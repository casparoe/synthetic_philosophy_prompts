prompt: |-
  I'm a novelist — three books, the last one about a farm family — and for the past two years I've been a volunteer EMT on our town's rescue squad, which is basically research with a pager, because the book I'm actually trying to write is about a squad like ours. Here's the problem I've backed into. We have no idea what to do about members who go beyond what the squad requires. Last winter one of our guys went into a house that was already fully involved to pull out a dog, and we gave him a plaque at the banquet. In March a different member, same fire, stood on the lawn and did chest compressions on the owner and didn't go in, and two of our officers have been quietly treating him like a coward ever since. Our chief keeps saying "we can't require that, but we sure can expect it," which even I can tell is doing something sneaky with the word expect. We get maybe a dozen calls a year where somebody's conduct is even in question, but a real one every couple months, and the verdict gets told to the member and goes in the file, so it isn't academic. I need a decision procedure we can run after an incident: what to ask in order, what counts as a sufficient answer to each question, where it stops with a verdict of required, forbidden, or optional-but-good, and where it has to stop and say this is a value judgment and a human being has to own it. It has to be usable by a chief who has never read any philosophy, in a kitchen, in about twenty minutes, while everyone is still rattled, and it has to survive our lawyer, who only cares whether we're creating a duty. Ground it in the philosophy of acts that go beyond the call of duty — the word for it is supererogation, I think, my daughter's philosophy TA said so — and I know there's at least one tradition that denies such acts exist at all, that every act is either required or not, so make the procedure say out loud where it's taking a side in that fight and why.

  It also has to handle the stuff that actually trips us up. The same act isn't the same for everybody — our medical director climbing a ladder to a patient is one thing, a seventeen-year-old probie doing it is another — so there needs to be a step for the person's role, training, and what they'd already agreed to when they signed up, and the procedure has to be able to say "supererogatory for her, required for him" without falling apart. There needs to be a step for the case where somebody did the brave thing for terrible reasons (the dog guy, honestly, wanted the plaque) and a step for the case where the brave thing was also stupid and put two other people at risk. And it has to tell me what to do about precedent, because the minute we commend something, everybody on the squad starts hearing it as the new standard, and I genuinely dont know if that's a flaw in the procedure or just how institutions work. Then run it on three cases and show your work: the dog guy; the guy who stayed outside; and a third one you invent where the procedure comes out against the person everyone in the room is rooting for — I want to see it tell us something we don't want to hear. Finish by telling me what this thing can't do, and specifically which of the verdicts are just me and the chief making a call with philosophy's name taped to them. Keep it in language a person could say out loud in a scene, because I'm stealing it for the book, and don't give me a reading list, I won't read it.
reasoning: |-
  Okay, the user is a novelist and volunteer EMT who's trying to create a fair decision procedure for evaluating actions that go beyond duty in their rescue squad. They need something practical, grounded in philosophy (especially supererogation), but usable by non-philosophers in high-stress situations. 

  Hmm, this is fascinating because it's both a real-world operational problem and a deep ethical puzzle. The user clearly understands the philosophical underpinnings (they even name-dropped supererogation) but needs it distilled into actionable steps. Their frustration with the chief's "we can't require but we expect" line shows they recognize the ethical sleight-of-hand there.

  Let me break this down layer by layer. First, the core tension: they need to judge actions that aren't covered by protocols but carry moral weight, like the dog rescuer vs the compressor who stayed outside. The philosophical spine must be supererogation - acts that are good but not obligatory. But I should acknowledge the alternative view (some philosophers argue all acts are either required or forbidden) upfront since the user explicitly asked for that debate. 

  The real meat is designing the procedure itself. It must:
  - Handle subjectivity (what's heroic for a probie may be baseline for a medic)
  - Account for motives (wanting a plaque vs genuine care)
  - Consider consequences (risking others for a dog)
  - Manage institutional ripple effects (commendations becoming expectations)
  All while being lawyer-proof regarding duty creation. 

  For the procedure structure, I'm imagining a flowchart-like Q&A with clear exit ramps. Key questions should cover: 
  1) Protocol alignment (required/forbidden?) 
  2) Personal capacity (training/role) 
  3) Risk assessment (cost/benefit) 
  4) Motivational purity (irrelevant per philosophy but matters socially) 
  Crucially, some answers must force a human judgment call - we can't algorithmize ethics completely.

  For the test cases: 
  - Dog guy: technically optional but reckless, motives questionable 
  - Lawn compressor: actually correct per protocol despite social shaming 
  - Invented case: maybe someone breaking protocol for emotional reasons but causing harm - shows procedure pushing against hero worship

  Final note: must emphasize what the procedure CAN'T do. It won't eliminate subjectivity - especially in the "gray zone" verdicts. And it can't prevent cultural drift where commendations become expectations. That's just organizational psychology. 

  The language should stay screenplay-ready like the user requested. No jargon, just straight talk you'd hear in an ambulance bay. "Did they roll the dice with other people's lives?" not "Did they externalize risk via negative spillovers?"
answer: |-
  Here's a decision procedure grounded in supererogation ("beyond duty"), designed for speed, practicality, and legal safety. It forces explicit choices where philosophy is silent. Call it the **Three-Step Triage for Tough Calls (3S-TTC)**.

  **Ground Rules Up Front (Said Loudly Before Any Incident):**
  1.  **"Required" = Written Protocol, Law, or Direct Order.** Period. No philosophy here. Violate this? Discipline starts.
  2.  **"Forbidden" = Explicitly prohibited by Protocol/Law/Order, OR recklessly endangers crew/public.** This is our safety/legal line.
  3.  **"Gray Zone" = Everything else.** *This is where judgment lives.* We *never* "expect" specific Gray Zone acts. We *hope* for courage/skill/compassion. We *evaluate* acts afterward based on *context*.
  4.  **Commending an act ≠ making it Required.** Saying "that was amazing" doesn't change the protocol. But we *are* responsible for what we celebrate – it shapes culture. Choose commendations carefully.
  5.  **Philosophy Stance:** We believe **supererogation exists.** Some acts *are* genuinely beyond duty – praiseworthy but not obligatory. Why? Because forcing extreme sacrifice or risk as "required" would crush volunteers and be unjust. Duty has limits. Heroism starts beyond them.

  ---

  **The 3S-TTC Procedure (20 Min Kitchen Table Version):**

  **Ask IN ORDER. Stop at first "Required," "Forbidden," or "Gray Zone" verdict.**

  1.  **"Was it REQUIRED by Protocol, Law, or Direct Order?"**
      *   **YES:** Verdict = **REQUIRED.** *Stop.* (e.g., Wearing PPE on scene, following treatment algorithms within scope).
      *   **NO:** Go to Step 2.

  2.  **"Was it FORBIDDEN by Protocol, Law, or Direct Order, OR did it RECKLESSLY endanger the member, crew, or public?"**
      *   *Reckless Endangerment? Consider:* Uncontrolled hazard, lack of necessary equipment/skill, diverting resources from a higher priority, violating scene safety fundamentals.
      *   **YES:** Verdict = **FORBIDDEN.** *Stop.* (e.g., Entering a fully involved structure without PPE/orders just for a pet; driving code with unsafe road conditions for a non-critical transfer).
      *   **NO:** Go to Step 3.

  3.  **"Was it within the member's TRAINED CAPABILITY and ROLE, considering their ACTUAL SKILL/EXPERIENCE?"**
      *   *This asks: "Could they reasonably DO it?"* Consider certifications, physical ability, known proficiencies, age/experience (e.g., probie vs. medic).
      *   **NO:** Verdict = **Gray Zone: NOT Reasonable/Expected.** (e.g., Untrained member attempting complex extrication). *Stop.* (Likely leans *away* from commendation, may need coaching).
      *   **YES:** Go to Step 4. *This is the core Supererogation Check.*

  4.  **"Did the action involve SIGNIFICANT PERSONAL RISK, SACRIFICE, or EXTRAORDINARY EFFORT beyond what any reasonable member in their role *could* be asked to bear?"**
      *   *This is the "beyond duty" filter.* Consider: Risk of serious injury/death, extreme physical/emotional toll, going far beyond shift/commitment.
      *   **NO:** Verdict = **Gray Zone: Within Reasonable Scope.** (e.g., Staying late to clean rig thoroughly after a tough call). *Stop.* (May be commendable effort, but not "beyond duty").
      *   **YES:** You have a *potential* supererogatory act. Go to Step 5.

  5.  **"BALANCE CHECK: Did the POTENTIAL GOOD outweigh the POTENTIAL HARM/CONSUMPTION OF RESOURCES, based on what they reasonably KNEW at the time?"**
      *   *This tackles recklessness disguised as heroism.* Consider: Value of what was saved/gained (life, property, critical info) vs. risk taken, resources diverted, alternatives ignored.
      *   **NO (Harm/risk clearly outweighed good):** Verdict = **Gray Zone: Reckless Disregard.** *Stop.* (e.g., Risky maneuver for extremely low chance of saving property only).
      *   **YES (Good outweighed harm/risk, or was reasonably balanced):** Verdict = **Gray Zone: Supererogatory (Potentially Commendable).** *Stop.* **BUT MOTIVE DOESN'T MATTER HERE.** Go to Step 6 *only* for commendation decisions.

  6.  **(For Commendation ONLY) "CONTEXT & CULTURE CHECK: Does commending this act align with our values AND is it unlikely to set a dangerous or unsustainable precedent?"**
      *   *This is pure human judgment.* Consider: True motivation (if known - e.g., plaque-chasing), potential message sent ("This risk is now okay"), impact on squad cohesion. *Motive matters here for praise, not for the act's category.*
      *   **YES:** **Commend it.** (The act was supererogatory *and* its celebration is wise).
      *   **NO:** **Acknowledge it privately but do not commend publicly.** (The act was supererogatory *but* celebrating it might encourage unsafe behavior or was done for poor reasons).

  ---

  **Why This Works & Where Philosophy Shows:**

  *   **"Expect" is Killed:** Step 3 & 4 explicitly tie "could they do it?" and "was it beyond reasonable ask?" to the *individual's* role/capacity. What's supererogatory for the probie might be baseline for the medic. Philosophy: Recognizes duties are role-specific and bounded by capacity.
  *   **Risk vs. Reward:** Step 5 explicitly forces a utilitarian-ish calculus *at the time of action*. Philosophy: Balances deontology (duty/rules) with consequentialism (outcomes). Reckless harm negates supererogation.
  *   **Motive:** Correctly separated. Step 5 judges the *act*. Step 6 judges the *commendation*. Philosophy: Kantians care deeply about motive; utilitarians care about results. This splits the difference practically.
  *   **Precedent:** Addressed in Ground Rules (Commend != Require) and Step 6 (Culture Check). Philosophy: Acknowledges institutional reality (praise shapes norms) but draws a bright line against changing *duty*.
  *   **Lawyer Safe:** Clear boundaries between Required/Forbidden (Step 1 & 2) and Gray Zone. "Expectation" is purged. Supererogation is explicitly *not* duty. Ground Rule 1 is ironclad.

  ---

  **Running the Cases (Show Your Work):**

  1.  **Dog Guy (Went into fully involved house for dog):**
      *   Step 1: Required? No (Protocol: no interior attack without PPE/orders). → Step 2.
      *   Step 2: Forbidden? **YES.** Entering fully involved structure without PPE/orders is *reckless endangerment*. Protocol likely forbids it implicitly via scene safety rules. Verdict: **FORBIDDEN.** *(Procedure stops here. Harsh, but legally/safely correct. Plaque was a mistake. Culture Check (Step 6) would have flagged the dangerous precedent.)*

  2.  **Lawn Guy (Stayed outside, did compressions):**
      *   Step 1: Required? Scene safety (stay out of IDLH - Immediately Dangerous to Life/Health) is REQUIRED. Performing compressions on viable patient is REQUIRED. He did both. Verdict: **REQUIRED.** *(Procedure stops here. Officers calling him a coward are WRONG and violating protocol/culture. He did his job correctly.)*

  3.  **Invented Case: "The Determined Detour"** - *A highly experienced, beloved medic (Sarah) is returning from a routine transfer. She hears a frantic call on the scanner: a child choking, 5 mins off her route, no other units closer than 12 mins. She diverts without notifying dispatch, runs lights/sirens, arrives first, and successfully clears the airway, saving the child.* Everyone wants to give her a medal.
      *   Step 1: Required? No. Her assigned transfer was complete. Protocol likely requires clearing with dispatch before taking a new call/changing status. → Step 2.
      *   Step 2: Forbidden? **Potentially YES.** Diversion without notifying dispatch violates communications protocol and could cause resource confusion ("Where is Unit 3?"). Running lights/sirens *unsafely* (e.g., intersections) would be reckless. Verdict hinges on *safe* response and *degree* of comms violation. Assume she drove safely but didn't call it in. Verdict: **Gray Zone - Reckless?** → *Go to Step 3.* (If driving was unsafe: **FORBIDDEN**).
      *   Step 3: Capable? **YES.** Experienced medic, within medical scope. → Step 4.
      *   Step 4: Beyond Duty? **YES.** Significant personal effort/risk (driving emergency, emotional weight), beyond her assigned task. → Step 5.
      *   Step 5: Balance Check? **YES.** Saving a child's life vastly outweighs protocol breach *in this extreme scenario*, based on what she knew (no closer units). Verdict: **Gray Zone: Supererogatory (Potentially Commendable).** → Step 6.
      *   Step 6: Context/Culture? **TRICKY. Likely NO.** While heroic, commending *ignoring dispatch* sets a dangerous precedent. What if next time it's a minor call? What if two units divert and cause chaos? Verdict: **Acknowledge skill/courage privately. Do NOT commend publicly.** Explain why: the *act* was beyond duty and saved a life, but the *method* (bypassing dispatch) cannot be encouraged. *(This hurts – she saved a kid! – but the procedure prioritizes system safety over individual heroism in this context.)*

  ---

  **What This Thing CAN'T Do (And Where Philosophy is Just a Label):**

  1.  **Define "Reasonable":** Steps 3 (Capability), 4 (Beyond Duty), and 5 (Balance) rely on "reasonable." What's reasonable risk? Reasonable sacrifice? **This is pure human judgment.** Philosophy provides the *framework* (bounded duties, supererogation), not the answer. The Chief/Officers must own this call based on training, experience, and squad norms.
  2.  **Resolve "Gray Zone" Ambiguity:** The procedure forces a verdict (Req/Forbid/Gray), but within Gray, especially "Potentially Commendable," **the line between 'good' and 'reckless' or 'truly heroic' and 'just hard work' is inherently blurry.** Philosophy tells us supererogation exists, but not its exact borders.
  3.  **Control Culture Directly:** Step 6 (Commendation Check) is **pure institutional judgment.** Philosophy offers no rule for "good precedent." This is leadership, sociology, and guesswork. Own it.
  4.  **Eliminate Subjectivity:** Motive seeps into Step 6. Personal feelings about a member might influence judgments in Steps 3-5. The procedure structures the questions, **not the answers.**
  5.  **Override Gut Feeling (Entirely):** If something feels deeply wrong or right after running the steps, **the Chief still has the human prerogative to weigh that**, especially in Step 6. The procedure informs, not dictates, final leadership decisions on praise or censure beyond the Req/Forbid baseline.

  **The Takeaway for Your Book:** This procedure forces clarity amidst chaos. It replaces "expectation" with structured questions. It separates legal duty (Req/Forbid) from moral praise (Gray Zone/Supererogation). It makes risk/reward explicit and individual capacity central. But in the messy middle? That's where humans, not philosophy, have to stand up and make the call, rattled pager and all. The plaque stays in the cabinet unless it passes *every* step, especially the last one.
