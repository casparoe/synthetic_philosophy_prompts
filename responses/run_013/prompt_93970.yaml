  Write a joke about accuracy-first epistemology. I want an actual joke — setup and punchline — and the punchline should turn on the real machinery of the view, so that it's funny to someone who's read the accuracy-first literature and pretty much dead to everyone else (no generic "philosophers are so weird" material). The stuff I want it to actually use: on this view the only epistemic good is how close your credences are to the truth, scored by something like the Brier score or the log score, and inaccuracy is objective — a credence of 0.05 in a proposition that turns out true is inaccurate, full stop, no matter how good your evidence was. At the same time there's a constraint in this literature to the effect that a rational credence function should expect itself to be at least as accurate as any alternative, so thinking your own credences are the most accurate ones available to you isn't conceit, its a requirement. So the scene I'm picturing is: someone catches my guy being flat wrong about something, and he defends himself on exactly these grounds — his credence was the most accurate one available to him given his evidence, so he wasn't merely blameless, he was epistemically flawless, and when they say "so you think your beliefs are the best anyone could have?" he says yes, that's required of him. Build whatever scene around that you like (breakup, hospital, poker table, eulogy, whatever) — just don't have him recite definitions at us. Bonus if you can work in the log score's attitude toward certainty (be certain, be wrong once, and your total inaccuracy is infinite), but that's optional.
