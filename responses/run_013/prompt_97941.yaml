  ### Key Choices Explained  
  - **Avoids theory**: Replaced "calculation debate" with tangible examples (baker sensing oven heat, clerk drowning in receipts).  
  - **Neutral on systems**: Calls price board/rota "tools," praises their evolution, and roots the co-op’s success in people.  
  - **Honors Priya**: Focuses on her listening, trust in the collective, and refusal to control—without judging the vote.  
