  ### Speech Text  
  "Good evening, everyone. For those who don’t know me, I’m Sam—Priya’s friend, occasional cake sampler, and the designated novelist who’s trying *very* hard not to turn this into a chapter on cooperative economics. Priya, your only note to me was: 'Sam, no seminars. And no burying the lede—this is about people, not policies.' So let’s begin where all good stories do: with a person.  

  Thirty-one years ago, Priya walked into a drafty storefront with a dream—not just to bake bread, but to build a place where flour-dusted hands shared ownership, risks, and rewards. The Lantern wasn’t born from a textbook. It was built at 4 a.m. by people who knew dough like their own heartbeat. And for three decades, Priya held that lantern—not as a CEO, but as a compass. She listened when the night baker said the rye needed five more minutes. She noticed when the accounts clerk was drowning in receipts. She understood that a co-op’s strength isn’t in its rules, but in the quiet alchemy of trusting each other’s instincts.  

  You all know the rhythms here: the clatter of pans, the scent of cardamom buns, the board where jobs found hands and hands found purpose. That board—like every system here—was a tool. Not scripture. Tools bend. They evolve. They get replaced when the hands using them say it’s time. What never changed? The truth that Priya etched into these walls: **the work knows things**. The baker knows when the oven’s humming low. The window cleaner spots the regular who’s limping. No committee can minute that. No sheet of paper holds it.  

  Which brings us to now. This week, you’ve chosen a new way to share the load. Some of you fought for it. Some fought against it. Priya? She abstained—not from caring, but because she’s always known this place wasn’t hers to steer forever. And here’s what she’d want me to say today: **The Lantern never lived in the points or the rota. It lived in you.** In the way you passed the rolling pin when wrists grew tired. In how you covered shifts for school plays and flu season. In the fact that you’ve fed a street—and each other—through recessions, pandemics, and that Great Sourdough Craze of 2020.  

  Priya, your legacy isn’t a system. It’s the stubborn, beautiful belief that people—flawed, brilliant, weary people—can shape something fairer together. You taught us that conflict isn’t rupture; it’s the friction that lets us grip the wheel. So tonight, we raise a slice of that legendary walnut cake to you. For keeping the flame alive. For trusting the room to find its way. And for proving that the most radical thing a baker can make isn’t bread—it’s community.  

  Cheers, Priya. May your retirement be as warm as your cinnamon rolls."  

