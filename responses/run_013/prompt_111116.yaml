prompt: |-
  I am presenting a paper at a two-day workshop on the ethics of office next month, and what I want from you is a question-period preparation sheet, not a defense of the paper. My view, which I call the warrant-depletion account of dirty hands, runs roughly as follows. There is no moral remainder that attaches to the individual who authorizes a wrong in an official capacity. Something real happens when an official does so, but it is mislocated by everyone who describes it as a stain on the person: the wrong is booked against the legitimacy of the institution whose warrant the official spent. Institutions confer standing to act on the collective's behalf; that standing is finite and consumable; when it is spent on a wrong, the institution is poorer by exactly that much. The official experiences the depletion from the inside, which is why the phenomenology reports itself as guilt, but the correct description is that the account has been drawn down, not that the agent has been soiled. Three consequences I draw in the paper: first, the permission in question is not an exception carved out of a moral rule but a transfer of who holds the debt; second, the reluctance and anguish of the official are not evidence of wrongdoing but an accurate reading of the balance; third, officials who act without institutionally conferred warrant -- putschists, vigilantes, the head of a faction, anyone whose authority is self-supplied -- should report remainders, and the fact that they reliably do is a prediction of my view rather than an embarrassment to it.

  The room will be about fifteen people and I know roughly who they are. A political realist of the Weberian stripe, who will hear the whole thing as the ethic of responsibility with a ledger attached. Two Rawlsians, one of whom works on public reason, who will press on whether a debt can be transferred without the consent of the party to whom it is transferred, namely the wronged. A Kantian who denies that an office can be a bearer of moral standing at all, and who will say I have reinvented the excuse/justification distinction and then blurred it back out of existence. Someone who has spent years on truth commissions and reparations, whose questions will all be about the audit: who reads the ledger, what becomes of the debt when the institution holding it is the one that committed the wrong, and whether the institution's legitimacy is anything other than a euphemism for the convenience of the state. And a moral psychologist who studies guilt and shame, who will reject the phenomenological claim outright and will want to know how, in the first-person case, I would distinguish warrant-depletion from ordinary agent-remainder.

  Give me the objections in the order I am likely to get them, weighted by how much damage each would do, phrased the way each of these people would actually phrase them and not the way they would appear in a survey article. For each: what I should concede up front, what I should hold, a two-minute reply, and a note on where the reply is soft -- in particular, which replies survive only because I have been granted a premise I have not earned. Tell me which single concession costs me least and buys me most, and which single reply has to land for the session to go well. If two of the objections are the same objection wearing different clothes, say so and tell me which of the two I should answer. Flag any place where my own formulation, rather than my position, is doing the damage. Include the question I am hoping nobody asks, and say why that one is the one that hurts. No reading list, no citations, and do not tell me who has said what before -- I know the literature and I will not be able to check it from the podium.
reasoning: |-
  Okay, the user is presenting a paper on their "warrant-depletion account of dirty hands" at a workshop. They need a question-period prep sheet tailored to specific attendees. Let me break down their request.

  First, their theory: They argue that when an official authorizes a wrong, the moral burden isn't on the individual but depletes the institution's legitimacy. The official feels guilt, but it's actually the institution's account being drawn down. Three key consequences: permission as debt transfer, reluctance as balance reading, and unauthorized actors having remainders.

  The audience includes a Weberian realist, two Rawlsians (one focused on public reason), a Kantian, a truth commissions expert, and a moral psychologist. Each will have specific objections. The user wants objections in likely order, damage assessment, replies, concessions, and notes on weaknesses.

  Starting with the Weberian. They see this as ethics of responsibility with a ledger. Their objection might be about the ledger's practicality and its detachment from consequences. The user should concede the ledger's abstraction but hold that institutions need such accounting. Reply by linking institutional integrity to real-world outcomes. Weakness: The ledger's measurability isn't addressed.

  Next, the Rawlsian on public reason. They'll challenge debt transfer without the victim's consent. Concede that consent is ideal but hold that institutional actions don't require individual consent. Reply by framing it as a precondition for reparations. Weakness: Overlooks cases where victims reject any institutional mediation.

  The Kantian argues institutions can't bear moral standing. They'll say the user blurs justification and excuse. Concede the distinction matters but hold institutions have derived moral status. Reply by differentiating individual vs. institutional accountability. Weakness: Doesn't fully ground institutional moral standing.

  The truth commissions expert will question auditing the ledger, especially when the institution is the perpetrator. They'll see legitimacy as state convenience. Concede the risk of self-serving audits but hold that depletion forces acknowledgment. Reply with examples like reparations funded by taxes. Weakness: Assumes institutions can impartially audit themselves.

  The moral psychologist disputes the phenomenology, asking how depletion feels different from guilt. Concede phenomenology is similar but hold the cognitive framing differs. Reply by emphasizing the official's role-awareness. Weakness: Relies on self-reporting which may not be reliable.

  The user's unasked question is about depleted institutions becoming illegitimate and who enforces that. It's dangerous because it challenges the theory's real-world applicability. The most damaging objections are the consent issue and the audit problem. The key concession is that legitimacy is a placeholder needing concrete expression. The must-land reply is distinguishing institutional depletion from personal guilt.

  Need to ensure objections are phrased as the attendees would, not academically. Avoid citations. Highlight where the user's wording causes issues, like "ledger" implying measurability. The Kantian and truth commission objections are similar in challenging institutional moral standing; answer the latter first for practical impact.
answer: |-
  Here is your question-period prep sheet, structured for damage control and tactical concession. Objections are ordered by likely sequence and impact weight (★ = low damage, ★★★★ = high damage). Replies are designed as 2-minute podium responses.

  ---

  ### **1. Weberian Political Realist**  
  **Likely Phrasing:** "This is just Weber's ethic of responsibility with accounting jargon. If the institution's 'ledger' is depleted but the state still functions, who cares? You've detached institutional legitimacy from the real currency of power: consequences."  
  **Damage:** ★★ (Attacks relevance, but doesn't gut core mechanics)  
  **Concede Up Front:** That legitimacy depletion doesn’t automatically collapse institutions — states can limp on with depleted warrants.  
  **Hold:** That depletion *is* the real cost of maintaining power through dirty hands; ignoring it accelerates decay.  
  **2-Minute Reply:**  
  > "You’re right that depleted states don’t always fall. But legitimacy isn’t binary—it’s a reserve tank. When you spend warrant on torture, you erode compliance capital. Think of occupation forces: initial brutality 'works,' but each atrocity drains cooperation, spikes insurgency costs, and forces more brutality. The ledger *is* the accounting of that feedback loop. Ignoring depletion is like ignoring debt: you can service it longer with force, but the compound interest is collapse."  
  **Soft Spot:** Assumes "compliance capital" is measurable. You haven’t earned this premise.  
  **Formulation Risk:** "Ledger" metaphors invite this attack. Use "reserve depletion" instead.

  ---

  ### **2. Rawlsian (Public Reason Focus)**  
  **Likely Phrasing:** "Transferring moral debt to an institution without the wronged party’s consent is morally alchemical. If I’m tortured, my claim is against *you* — not your office’s ledger. How can you move my debt to an abstraction I never agreed to?"  
  **Damage:** ★★★★ (Strikes at victim agency and core debt-transfer mechanism)  
  **Concede Up Front:** That victims *do* have personal claims against individuals for direct harm.  
  **Hold:** That institutional warrant creates a *second-order* debt held by the collective, which must answer separately.  
  **2-Minute Reply:**  
  > "The victim’s claim against the torturer isn’t erased—it’s nested. When an official acts *with warrant*, they bind the collective. The victim’s claim now runs *also* against the institution that authorized it. This isn’t theft—it’s recognizing the institution as co-signer. Your torture isn’t just by Smith; it’s by *the state using Smith*. The ledger tracks what the state owes you *because* it lent Smith its name. Without this, reparations are arbitrary gifts, not owed debts."  
  **Soft Spot:** Implies institutions can "co-sign" without victim consent. You need a theory of institutional representation here (which you haven’t provided).  
  **Key Insight:** This objection and the Truth Commission objection (below) are siblings—both demand victim-centric accounting. **Answer this one first**; it’s more foundational.

  ---

  ### **3. Kantian**  
  **Likely Phrasing:** "Offices aren’t moral agents. You’ve taken the excuse/justification distinction—'I was ordered' (excuse) vs. 'the act was right' (justification)—and smuggled in a third category: 'the office ate my guilt.' But if the act was *truly* justified, no depletion. If not, *you* are stained. This is sophistry."  
  **Damage:** ★★★ (Rejects institutional moral standing—your core innovation)  
  **Concede Up Front:** That Kant is right about individual culpability for evil acts.  
  **Hold:** That institutions *do* have derived moral standing via collective authorization.  
  **2-Minute Reply:**  
  > "When we say ‘Parliament authorized the war,’ we’re not just describing paperwork. We’re marking a moral shift: the act now belongs to *us*. The excuse/justification binary misses this. Warrant-depletion isn’t about the act’s permissibility (which is unchanged) but *who bears the cost of its wrongness*. The official isn’t excused—they’re the instrument. The stain is on the institution we built to act for us. Deny this, and ‘state action’ is reduced to a fairy tale."  
  **Soft Spot:** Assumes institutions can "bear costs" morally. Your reply survives only because you assert this premise.  
  **Formulation Risk:** "Stain" language in your summary contradicts your own thesis. **Cut it.**

  ---

  ### **4. Truth Commissions/Reparations Expert**  
  **Likely Phrasing:** "Who audits this ledger? When the institution *is* the perpetrator—say, a regime that enslaved people—its ‘legitimacy’ is just its power to ignore debts. Isn’t depletion a euphemism for laundering guilt through the state’s convenience?"  
  **Damage:** ★★★★★ (Exposes your model’s vulnerability to bad-faith institutions)  
  **Concede Up Front:** That depleted institutions *can* ignore debts—and often do.  
  **Hold:** That depletion *creates* a claim demanding institutional repair (reparations, reforms), even if unenforced.  
  **2-Minute Reply:**  
  > "A corrupt state *will* hide its ledger—but that doesn’t mean the debt isn’t real. Depletion isn’t what the state *feels*; it’s what it *owes*. Truth commissions are audits: they force the institution to confront its depleted balance. Reparations are withdrawals from the collective account to pay it down. Yes, powerful states stall—but your work proves depletion’s reality: why chase reparations if the debt isn’t *there*?"  
  **Soft Spot:** Assumes institutions *must* honor debts. Tyrannies don’t. This reply leans on idealism.  
  **Best Concession:** **This one costs least and buys most.** Conceding that depletion requires enforcement mechanisms (courts, commissions) to matter grounds your theory in the real world without gutting it.

  ---

  ### **5. Moral Psychologist**  
  **Likely Phrasing:** "Guilt without personal blameworthiness is nonsense. If officials *feel* guilt, it’s because they *are* guilty. Your ‘depletion’ just rebrands agent-regret. How would you know, introspectively, if your anguish is warrant-depletion or plain old culpability?"  
  **Damage:** ★★ (Challenges phenomenology but not structure)  
  **Concede Up Front:** That phenomenology alone *cannot* distinguish depletion from culpability.  
  **Hold:** That the cognitive framing (blameworthiness vs. institutional cost) alters the emotion’s object.  
  **2-Minute Reply:**  
  > "Imagine two officials: one authorized torture under valid warrant; the other did the same as a vigilante. Both feel anguish. But the first says, ‘What have we done?’; the second says, ‘What have *I* done?’. The feeling is similar, but the cognitive content isn’t. Depletion anguish is *grief for the institution*—like a CFO signing a ruinous contract. It’s not ‘I did wrong’ but ‘I spent our future.’ Your data on guilt in authorized acts fits this: it’s role-specific remorse."  
  **Soft Spot:** Relies on self-reported cognitive framing. Unreliable under duress.  
  **Must-Land Reply:** **This is the one that must land.** If the room accepts the grief/guilt distinction, your model gains intuitive traction.

  ---

  ### **The Unasked Question (That Hurts)**  
  **Likely Phantom:** "If warrant depletion is real, at what point does an institution become morally bankrupt? And if it does, who has the authority to foreclose on it?"  
  **Why It Hurts:** It forces you to admit that depletion’s stakes are political, not moral. A "bankrupt" institution might still rule through violence. Your model can’t specify when legitimacy hits zero—it only tracks deficits. This risks making depletion epistemically vacuous.  
  **Dodge Strategy:** If asked, pivot to: "Like financial debt, depletion isn’t a switch but a weighting of costs. A state at -100 isn’t ‘illegitimate’—it’s one where compliance costs more than it’s worth. Revolutions happen when collectors (the people) call in the debt."

  ---

  ### **Tactical Summary**  
  - **Most Valuable Concession:** Admit warrant depletion requires enforcement mechanisms (e.g., courts, commissions) to be actionable. (Costs little, buys realism).  
  - **Must-Land Reply:** The grief/guilt distinction to the moral psychologist. If this resonates, the room accepts your phenomenology.  
  - **Objections in Same Clothes:** Rawlsian (victim consent) and Truth Commission (debt enforcement) both demand *victim-centric accountability*. Prioritize the Rawlsian—it’s more theoretically fundamental.  
  - **Deadliest Objections:** Truth Commission expert (★★★★★) and Rawlsian (★★★★)—both attack core mechanics.  

  **Final Tip:** Start replies with "You're right that..." (concede terrain) before pivoting. It disarms critics and frames you as collaborative. Good luck.
