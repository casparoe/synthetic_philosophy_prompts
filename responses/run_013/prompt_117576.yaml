  ### Research Ethics Board Procedure for Protocols Involving Aggregation of Harms

  This procedure provides a step-by-step framework for evaluating research protocols where small individual harms may aggregate significantly. It is designed for efficiency (≤10 minutes per protocol) and usability by non-philosophers, while addressing key ethical distinctions. The sequence terminates in rejection if any step yields an insufficient answer, or hands off to board judgment when required. Each step specifies criteria for sufficiency and flags value judgments.

  ---

  **Procedure Steps:**

  1. **Identify Worst-Off Individual Burden**  
     *Question:* What is the maximum burden (harm or risk) faced by any single participant, considering the study's procedures?  
     *Sufficiency:* Burden must be quantified (e.g., "1% risk of liver damage," "5 minutes of inconvenience").  
     *Termination:* Reject if burden exceeds **moderate risk** (risk comparable to car travel or routine medical tests). If below moderate risk, proceed.  
     *Value Judgment:* Defining "moderate risk" is context-dependent (e.g., institutional norms).  
     *Distinctions Addressed:* (ii) Aggregation within a person (via burden assessment per participant).

  2. **Classify Harm Noticeability**  
     *Question:* Which harms are **noticeable** (participant would detect them, e.g., pain, time loss) vs. **unnoticeable** (e.g., negligible data-privacy risk)?  
     *Sufficiency:* Exclude harms that are (a) unnoticeable, (b) certain (not probabilistic), and (c) without any long-term effect. Count all other harms.  
     *Termination:* If no harms remain after exclusion, approve. Else, proceed.  
     *Value Judgment:* Whether unnoticeable harms "count" is a value choice; this step excludes only the most trivial subset.  
     *Distinctions Addressed:* (i) Noticeable vs. unnoticeable harms.

  3. **Assess Within-Person Aggregation**  
     *Question:* For a single participant, does the total burden (from repeated/accumulated harms) exceed the per-event burden identified in Step 1?  
     *Sufficiency:* Calculate total burden per participant (e.g., 10 blood draws × 2 min = 20 min).  
     *Termination:* Reject if total burden per participant exceeds moderate risk. Else, proceed.  
     *Value Judgment:* Aggregating within a person is treated as factual (summing burdens).  
     *Distinctions Addressed:* (ii) Aggregation across time within a person.

  4. **Calculate Expected Serious Adverse Events (SAEs)**  
     *Question:* For probabilistic harms, what is the expected number of serious adverse events (SAEs) across all participants? (SAE = life-altering harm, e.g., permanent disability.)  
     *Sufficiency:* Expected SAEs = (Probability of SAE per person) × (Number of participants).  
     *Handoff:* If expected SAEs ≥ 0.5, hand off to board judgment. If < 0.5, proceed to Step 5.  
     *Value Judgment:* The 0.5 threshold is arbitrary; SAE definition involves value choice.  
     *Distinctions Addressed:* (iv) Small probability of serious harm (aggregated) vs. certain trivial harm (not aggregated here).

  5. **Evaluate Cumulative Burden Across Studies**  
     *Question:* Could this study, combined with previously approved studies, push any participant’s total burden beyond moderate risk?  
     *Sufficiency:* Review database of approved studies targeting the same population.  
     *Termination:* Reject if cumulative burden exceeds moderate risk and cannot be mitigated (e.g., exclusivity clauses). Else, approve.  
     *Value Judgment:* Whether to aggregate across studies is a value choice (avoids piecemeal evasion).  
     *Distinctions Addressed:* (iii) Aggregation within one decision vs. across decisions.

  ---

  **Adjudicating Proposed Shortcuts:**  
  - **Chair’s Aggregate Burden Index (ABI: burden × N):**  
    *Gets right:* Quantifies total societal burden. *Goes wrong:* Ignores distribution (e.g., 1 severe harm ≠ 1M trivial harms) and harm types. *Salvageable?* Only for probabilistic SAEs (Step 4), not for trivial harms.  
  - **Noticeability Screen (only noticeable harms count):**  
    *Gets right:* Focuses on participant perspective. *Goes wrong:* Dismisses real but imperceptible risks (e.g., data leaks). *Salvageable?* Partial adoption in Step 2 (excludes only long-term-effect-free unnoticeable harms).

  ---

  **Limitations of the Procedure:**  
  - **Misclassifications:**  
    - Will approve studies with massive trivial harms (e.g., wasting 1M person-hours) if no SAE risk (Step 4 ignores trivial harms).  
    - May reject studies with high SAE risk but transformative benefits if the board is risk-averse.  
  - **Judgment Calls Dressed as Arithmetic:**  
    - Step 4’s SAE threshold (0.5) and "serious harm" definition.  
    - Step 1’s "moderate risk" line.  
  - **What It Cannot Do:**  
    - Resolve philosophical debates about aggregating trivial harms.  
    - Handle non-linear harm curves (e.g., diminishing marginal disutility).  

  ---

  **Application to Protocols:**  
  1. **Data-Donation Study (2M users, small re-identification risk):**  
     - **Step 1:** Worst-off burden = low risk of re-identification → below moderate risk → proceed.  
     - **Step 2:** Harm is probabilistic risk (not certain) → count it.  
     - **Step 3:** No within-person aggregation (single act) → burden unchanged.  
     - **Step 4:** Expected SAEs = (risk per person) × 2M. Risk is "small but not negligible" (e.g., 1/50,000) → expected SAEs = 40 → ≥0.5 → **Handoff to board judgment (Step 4)**.  
     *Verdict: Conditional on board review.*  
     *Pushback Source:* The procedure (aggregating risk of serious harm). Your threshold (individual burden trivial) is overridden by Step 4’s SAE calculation.

  2. **Biopsy Study (24 volunteers, 1% complication risk):**  
     - **Step 1:** Worst-off burden = 1% risk of serious complication → above minimal risk (liver biopsy > routine blood draw) but below moderate? *Value judgment:* Handoff to board to decide if burden is justified.  
     - *If approved by board:*  
       - **Step 2:** Harm is noticeable (pain) and probabilistic risk → count.  
       - **Step 3:** Single biopsy → no further aggregation.  
       - **Step 4:** Expected SAEs = 0.01 × 24 = 0.24 → <0.5 → proceed.  
       - **Step 5:** Unlikely cumulative burden (healthy volunteers) → **Approve**.  
     *Verdict: Conditional on board review at Step 1.*  
     *Pushback Source:* Your threshold ("not trivial") is validated at Step 1, but the procedure permits approval if benefits justify risks.

  ---

  **Final Verdicts:**  
  The procedure flags both protocols for board deliberation, challenging your initial inclinations. For data-donation, aggregation of risks (Step 4) forces scrutiny; for biopsy, individual risk (Step 1) requires justification. The "handoff" steps ensure no evasion of value judgments.

