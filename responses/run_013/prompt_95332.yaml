answer: |-
  Your brother's argument is clever, but it contains a critical flaw in step (2). The argument relies on the assumption that a moral rule (like "don't kill an innocent person") must be justified solely by its consequences—specifically, whether it makes the world better off overall. This is a consequentialist assumption smuggled into what starts as a deontological position (the belief in absolute moral rules based on duty, rights, or intrinsic wrongness). By accepting step (2), the argument forces a collapse into consequentialism, where all rules become contingent on their outcomes. But this isn't the only way to justify moral rules. Deontologists, for example, argue that some actions are inherently wrong, regardless of consequences, because they violate fundamental principles like human dignity, autonomy, or justice. Rejecting step (2) allows you to preserve absolute moral rules by grounding them in non-consequentialist foundations.

  Here's a breakdown of the bad step and why it's problematic:

  ### The Bad Step: Step (2)
  - **What it says**: "A rule like that is only worth having if the world is better off with it than without it; if it does no good, it's just a superstition people obey for nothing."
  - **Why it's flawed**: This step assumes that the only possible justification for a moral rule is its instrumental value in producing good consequences. It dismisses any non-consequentialist justification (e.g., based on duty, rights, or intrinsic moral facts) as "superstition." But this is a controversial philosophical claim, not a logical necessity. By building consequentialism into the foundation, step (2) sets up the rest of the argument to undermine absolute rules. If you start by insisting that rules must be justified by outcomes, it's unsurprising that you end up with no absolutes—because in extreme cases (like step 4), breaking the rule might indeed lead to better outcomes. But this doesn't prove that absolute rules are impossible; it only shows that they can't coexist with a purely consequentialist justification.

  ### How the Argument Unravels Without Step (2)
  If you reject step (2), the argument falls apart:
  - **Step (1)** can stand: You can maintain that killing an innocent person is absolutely wrong, not because of its consequences, but because it violates a categorical duty (e.g., "innocent life is inviolable").
  - **Step (3) becomes unnecessary or misdirected**: The "reason" not to kill isn't about reducing the "body count" in a consequentialist sense. Instead, it might be about upholding a principle that respects persons as ends in themselves (as Kant argued). The rule isn't "worth having" because it optimizes outcomes—it's binding because it's morally right, full stop.
  - **Steps (4)–(6) lose their force**: If the rule isn't justified by consequences, then a case where breaking it might save lives (e.g., killing one to stop five deaths) doesn't automatically obligate you to break it. You could consistently say, "Even if breaking the rule reduces deaths in this instance, it's still wrong because murder is intrinsically impermissible." The rule doesn't "eat itself" because its justification isn't tied to situational outcomes.

  ### Why Giving Up Step (2) is "Cheaper" Than Giving Up Step (6)
  You asked which step is "cheaper to lose" if you must choose between (2) and (6). "Cheaper" here means less philosophically costly in terms of preserving moral intuitions, logical coherence, and real-world applicability:
  - **Giving up step (2) is cheaper**:
    - **Cost**: You lose the idea that moral rules must be "useful" to be valid. This might feel unsatisfying if you value pragmatic, outcome-based reasoning, as it requires accepting that morality isn't always about maximizing good consequences. But it's a smaller cost because:
      - It aligns with common moral intuitions. Many people feel that actions like torturing an innocent or killing for convenience are wrong regardless of outcomes (as in your brother's initial example). Rejecting (2) lets you keep these intuitions intact.
      - It avoids the pitfalls of pure consequentialism. Step (6) leads to "do whatever leaves the fewest dead," which can justify horrifying actions (e.g., killing a healthy person to harvest organs for five dying patients). By rejecting (2), you prevent this slippery slope.
      - It's a targeted move. You only need to deny that consequences are the sole justification for rules, not that consequences don't matter at all. You can still acknowledge that rules often have good effects without making those effects the foundation.
      - Philosophically, it's defensible. Deontological ethics (e.g., from Kant or modern rights theorists) provides robust non-consequentialist frameworks that aren't "superstition"—they're based on reasoned principles like universalizability or human rights.

  - **Giving up step (6) is more expensive**:
    - **Cost**: Accepting that there are no absolute moral rules at all. This means abandoning the core intuition from step (1) and embracing full-blown consequentialism, where everything is permissable if it minimizes harm. This is costly because:
      - It conflicts with strong moral convictions. For instance, most people reject that torturing a child could be justified to save others, even if it "works" numerically. Losing (6) forces you to dismiss this as irrational.
      - It leads to practical problems. Without absolute rules, moral decisions become highly situational and vulnerable to bias, error, or slippery slopes (e.g., "Why not lie a little if it helps?" escalating to widespread dishonesty).
      - It doesn't resolve the issue. Your brother claims the trick works on all rules (e.g., "don't torture" or "don't lie"), but rejecting (6) means accepting that no rule is absolute—so you lose the very thing you're trying to defend.

  ### Why the Trick Feels Suspicious (As You Noted)
  The trick "works on everything" because it's essentially a bait-and-switch:
  - It starts by affirming an absolute rule in (1) but then redefines its justification in consequentialist terms via (2). This forces the rule to be judged by outcomes, which inevitably creates exceptions in edge cases (like step 4).
  - The suspicion arises because the argument exploits a tension between deontology and consequentialism. But it doesn't prove absolute rules are incoherent; it just shows they can't be grounded in consequences. If you don't accept the consequentialist framing from the start, the trick fails.

  ### How to Counter Your Brother
  - **Challenge step (2) directly**: Ask why a rule must be justified by good consequences to avoid "superstition." Point out that duties or rights can be foundational. For example: "Not killing innocents isn't 'superstition'—it's based on respect for human life, which has value beyond its consequences."
  - **Use his own examples**: For "don't torture," argue that torture is intrinsically dehumanizing, so even if it saves lives, it violates a principle that isn't negotiable. Ditto for lying—it undermines trust in a way that isn't captured by arithmetic.
  - **Concede a point**: You can agree that consequences matter (e.g., rules often do improve outcomes) without making them the sole justification. This makes your position more flexible without sacrificing absolutes.

  In short, the bad step is (2), and ditching it is the cheaper move—it preserves absolute rules while costing you only a narrow consequentialist assumption. If you cling to (2), you'll end up with no absolutes at all, which is a heavier price for most people's moral worldview.
