prompt: |-
  I'm in a small reading group on consciousness (three of us, mostly phd students, we meet in a cafe and argue way too much) and last week we did the color phi thing. You know the one: flash a dot at one spot, flash it again a little way off and in a different color, short gap between, and people swear they see a single dot travelling and changing color partway along the path -- and here's the bit that wrecked us -- the color change seems to be experienced as happening *before* the second dot even comes on, which is presumably impossible, since the second dot's color is what's driving it. We read Dennett on this and his Orwellian vs Stalinesque framing and it turned into a whole fight about whether the question "when did you actually experience that" even has an answer. So before we read any more theories in this area, I want a proper spec first -- good enough that we could actually use it to decide whether Dennett is right that the timing question is empty. Write me the desiderata for a theory of the temporal structure of experience: what any such theory has to deliver. The phenomena it has to account for, and why each one is a real constraint rather than a curiosity (color phi itself; metacontrast-type masking, where a later stimulus can decide whether you saw an earlier one at all; the fact that stretching the gap too far kills the illusion, so whatever the mechanism is it's sensitive to timing; the tactile-rabbit kind of saltation where taps at two points get felt in between; and the boring fact that we *can* often correctly say which of two events came first, so the system isn't just noise); the distinctions it mustn't blur (the time an experience occurs vs. the time that experience presents its object as occuring; the time of my report vs. the time of the experience I'm reporting on; order of processing vs. order in experience); the puzzles it has to actually dissolve rather than just rename (how information arriving later can shape an experience that supposedly already happened, without anything travelling backwards in time; whether there's a real "filling in" process or that's a bad description); and any hard constraints from neuroscience it can't contradict. For each requirement, tell me the case or consideration that puts it on the list.

  The thing I most want from you: which of these can't be satisfied together. My hunch -- say if it's wrong -- is that "every experience happens at some definite moment" and "what an experience is like can depend on stimuli that arrive after that moment" are the pair that fight, and that if you take both seriously you're forced to give one up, so the list ends up being a kind of proof all by itself. Lay out that conflict properly, and say which of the other requirements line up on either side of it. One more thing, and it's really why I'm asking now: a friend in the group wants to actually run a variant -- circle flashed at A, square at B, short gap -- and then ask people to sketch the shape they saw when the thing was halfway across, and separately to hit a key the instant the shape starts to change. If people draw some circle-square blob that was never on the screen, or if their key-press lands before B is even shown, what should a theory be committed to saying, and does the list I asked for already have a slot for that? Then, briefly at the end, score the obvious contenders against the list -- Dennett's multiple drafts, the naive "experience is just delayed until all the info is in" view, and a predictive-processing "the brain infers when things happened" story -- but keep that part short, the criteria are the point.
reasoning: |-
  We are constructing a set of desiderata for a theory of the temporal structure of experience, motivated by phenomena like the color phi, metacontrast masking, the tactile rabbit, and the ability to make temporal order judgments. The goal is to have a specification that can help evaluate whether questions about the exact timing of experiences are meaningful or empty (as per Dennett). We also want to identify any conflicts among the desiderata, especially between the idea that every experience has a definite timing and the idea that later stimuli can influence what an experience is like.

  Let's break down the requirements:

  ### I. Phenomena to Account For (and why they are constraints)

  1. **Color Phi Phenomenon**:
     - *Description*: Two flashes (at different locations and with different colors) in quick succession are perceived as a single moving dot that changes color mid-trajectory, with the color change apparently experienced before the second flash occurs.
     - *Constraint*: The theory must explain how the content of an experience (e.g., the color change) can be determined by a stimulus that hasn't yet occurred at the time the experience is purportedly happening. This is a direct challenge to the idea that experiences are fixed at the time of neural registration.

  2. **Metacontrast Masking**:
     - *Description*: A later stimulus (mask) can prevent the conscious perception of an earlier stimulus (target). For example, a ring flashed immediately after a disk can make the disk invisible.
     - *Constraint*: The theory must account for how a later event can influence whether an earlier event is experienced at all. This challenges the notion that experiences are determined solely by the initial stimulus and that they occur at a fixed time relative to that stimulus.

  3. **Temporal Gap Sensitivity**:
     - *Description*: In color phi and similar illusions, if the gap between stimuli is too long, the illusion breaks (e.g., two distinct flashes are seen). The illusion only occurs within a narrow time window (typically under 100 ms).
     - *Constraint*: The theory must incorporate a mechanism that is temporally bounded. This rules out explanations that do not have a temporal constraint and shows that the brain's temporal integration is limited.

  4. **Tactile Rabbit (Saltation)**:
     - *Description*: Taps at two distinct points on the skin in rapid succession are felt as if they "hop" along the skin, including at intermediate points where no tap occurred.
     - *Constraint*: The theory must explain how the content of experience can include events that never physically occurred (illusory events) and how the temporal order of stimuli is transformed into a spatial pattern in experience.

  5. **Temporal Order Judgments (The "Boring" Fact)**:
     - *Description*: We can often correctly judge the order of two events (e.g., two flashes) if they are sufficiently separated in time (e.g., >50 ms).
     - *Constraint*: The theory must account for both the cases where temporal order is correctly perceived and the cases where it is distorted. This shows that the system is not always fooled and has some temporal resolution.

  ### II. Distinctions to Maintain

  6. **Time of Experience vs. Time Presented in Experience**:
     - *Description*: The time at which an experience occurs (e.g., when the neural processes underlying it happen) is distinct from the time that the experience represents (e.g., the experience might represent an event as happening at time t, but the experience itself might occur at t+δ).
     - *Constraint*: The theory must not conflate these, because an experience can represent past or future events (e.g., in memory or anticipation) and also because in illusions like color phi, the experience represents a change happening at a time before the second stimulus.

  7. **Time of Report vs. Time of Experience**:
     - *Description*: When a subject reports an experience, the report occurs at a later time and may be influenced by post-experiential factors (memory, inference, etc.). This is distinct from the time the experience actually occurred.
     - *Constraint*: The theory must account for the possibility that reports are not direct readouts of the experience but reconstructions. This is critical for interpreting experiments where subjects are asked to report on their experiences.

  8. **Order of Processing vs. Order in Experience**:
     - *Description*: The temporal sequence of neural processing stages does not necessarily map directly to the temporal order of events in the experience. For example, later processing stages might influence the content of an experience that is subjectively referred to an earlier time.
     - *Constraint*: The theory must avoid assuming that the neural timeline is the same as the experienced timeline.

  ### III. Puzzles to Dissolve (Not Just Rename)

  9. **Backward Influence Without Backward Causation**:
     - *Description*: How can information from a later stimulus affect an experience that (subjectively) seems to have already occurred? This is seen in color phi (color change before the second flash) and metacontrast (the mask affecting the target).
     - *Constraint*: The theory must provide a mechanism that does not require backward causation. Simply labeling it as "postdiction" or "retroactive construction" is not enough; it must explain how the brain achieves this without violating the temporal order of neural processing.

  10. **The Nature of "Filling In"**:
      - *Description*: In illusions like the tactile rabbit or visual filling-in (e.g., the blind spot), does the brain actually generate a signal for the missing part, or is the absence simply ignored? This is a debate about the content of experience.
      - *Constraint*: The theory must clarify whether there is a positive representation of the illusory event or a lack of representation that is then interpreted as continuous.

  ### IV. Hard Constraints from Neuroscience

  11. **Neural Processing Takes Time**:
      - *Description*: Neural events are not instantaneous; they take time to propagate and be processed. For example, visual stimuli take about 100-200 ms to reach awareness (the "neural delay").
      - *Constraint*: The theory must respect the finite speed of neural processing and the fact that the brain receives information at different times for different modalities and stimuli.

  12. **No Evidence for Backward Causation**:
      - *Description*: There is no known mechanism in neuroscience for information to travel backwards in time. Neural signals propagate in a forward temporal direction.
      - *Constraint*: The theory cannot invoke backward causation.

  ### Conflict Analysis

  The key conflict is between:

  - **Desideratum A (Definite Timing of Experience)**: Every conscious experience occurs at a specific, definite time (relative to neural events).

  - **Desideratum B (Postdictive Influence)**: The content of an experience at time t can be influenced by stimuli that occur after t (in objective time) but are processed shortly thereafter.

  In the color phi case:
  - If the experience of the first flash occurs at time t1 (after the first flash), then the second flash at t2 (with t2 > t1) cannot influence the experience at t1 without backward causation (which violates neuroscience constraints).
  - But the subject experiences the color change as happening between t1 and t2, which is before the second flash is even presented (if we take the report at face value).

  This conflict is at the heart of the debate. Dennett argues that the question "when did the experience happen?" is empty because there is no definite time at which the experience occurs. Instead, he proposes that there is no central theater where experiences happen at a specific time. The alternative is to reject Definite Timing (Desideratum A) and allow that experiences are not fixed until after the relevant information is integrated (which might be after the second flash in color phi). But then we must explain how we can have the impression of the color change happening earlier.

  The other requirements line up as follows:

  - **Supporting Definite Timing (A)**: The ability to make temporal order judgments (5) suggests that experiences have some temporal structure and that we can sometimes report on the order of events accurately. Also, the distinction between time of experience and time presented (6) might be used to preserve definite timing by saying that the experience occurs later but represents an earlier time.

  - **Supporting Postdictive Influence (B)**: Metacontrast masking (2) and color phi (1) provide direct evidence that later stimuli can influence the experience of earlier ones. Temporal gap sensitivity (3) shows that this influence is only possible within a short time window, which fits with the idea of a postdictive temporal integration window.

  ### The Proposed Experiment

  The experiment: flash a circle at A, then a square at B, with a short gap. Then ask:
  1. Sketch the shape at the midpoint.
  2. Press a key when the shape starts to change.

  Possible results:
  - If subjects sketch a circle-square hybrid (e.g., a circle morphing into a square) at the midpoint, that suggests an illusory content that was never presented.
  - If the key-press for the change occurs before the second flash (B), that would be strong evidence for the subjective timing of the change being before the second stimulus.

  The theory must account for:
  - Why the experience includes an illusory shape at the midpoint (relates to tactile rabbit and filling-in puzzle).
  - How the key-press timing (if it is before B) can be reconciled with the objective timing of stimuli (relates to the report vs. experience distinction and the backward influence puzzle).

  This experiment adds a new requirement to the list:

  13. **Account for Illusory Content and Its Timing**: The theory must explain how and why an experience can include content that does not correspond to any stimulus (the hybrid shape) and how the timing of the report (key-press) relates to the experience.

  ### Scoring Contenders Briefly

  - **Dennett's Multiple Drafts Model**:
    - *Pros*: Rejects definite timing (A) and thus avoids the conflict. Experiences are not fixed until probed (by report). Thus, the timing question is empty. Accounts for postdiction (B) without backward causation by making the content of the report depend on later processing.
    - *Cons*: Might struggle with the distinction between time of experience and time presented (6) because it downplays the idea of a unified experience. Also, the "boring fact" of temporal order judgments (5) might be harder to explain if there is no definite temporal structure.

  - **Naive Delayed-Unified View**:
    - *Description*: Experience is delayed until all relevant information is in (e.g., until after the second flash in color phi).
    - *Pros*: Avoids backward influence by having the experience occur after both stimuli. Accounts for postdiction naturally. Respects neural delays (11).
    - *Cons*: Fails to explain why the color change is experienced as happening *before* the second flash (the subjective timing). Also, if the gap is long, we don't get the illusion, so why not always delay? And it blurs the time of experience vs. time presented (6) because the experience might present the event as happening at the time of the stimulus, but the experience itself is delayed.

  - **Predictive Processing / Inference Model**:
    - *Description*: The brain infers the most likely sequence of events, including their timing. The experience is the brain's best guess about what happened and when.
    - *Pros*: Can account for illusions (color phi, tactile rabbit) as inferences under uncertainty. Can explain why the color change is experienced as happening at the midpoint (it is inferred as part of a motion event). Also, temporal order judgments (5) are explained by the same inference mechanism.
    - *Cons*: Must handle the apparent backward influence without backward causation. Might have trouble with the definite timing (A) because the inference can be updated over time. Also, the distinction between processing order and experience order (8) becomes crucial.

  ### Conclusion on Conflict

  The conflict between Definite Timing (A) and Postdictive Influence (B) is central. To resolve it, one must either:
  - Reject Definite Timing (as Dennett does) and argue that there is no precise moment when the experience occurs, or
  - Reject Postdictive Influence as being about the experience at an earlier time by reinterpreting the reports (e.g., the key-press in the experiment is not a direct report of the experience but a reconstruction) and using the distinction between time of experience and time represented.

  The desiderata list forces this issue and shows that any theory must take a stand.

  ### Final List of Desiderata

  1. **Account for Color Phi** (evidence of postdictive influence on content and timing).
  2. **Account for Metacontrast Masking** (later stimulus affects earlier perception).
  3. **Temporal Gap Sensitivity** (mechanism has a limited temporal window).
  4. **Account for Tactile Rabbit** (illusory events in space-time).
  5. **Account for Temporal Order Judgments** (preserved ability in non-illusory cases).
  6. **Distinguish Time of Experience vs. Time Represented**.
  7. **Distinguish Time of Report vs. Time of Experience**.
  8. **Distinguish Order of Processing vs. Order in Experience**.
  9. **Explain Backward Influence Without Backward Causation**.
  10. **Clarify the Nature of Filling-In** (positive representation or absence?).
  11. **Respect Neural Processing Delays**.
  12. **Respect No Backward Causation**.
  13. **Account for Illusory Content and Its Timing** (from the proposed experiment).

  The conflict between A (Definite Timing) and B (Postdictive Influence) is the core tension, and the other requirements (especially 1,2,4,5,9,11,12) provide the evidence that forces the issue.
answer: |-
  Below is a structured set of desiderata for a theory of the temporal structure of experience, tailored to your reading group's needs. These criteria are derived from key phenomena (like color phi), conceptual distinctions (e.g., time of experience vs. time represented), and hard constraints (e.g., neuroscience). The goal is to provide a "spec" that can evaluate whether Dennett is right that the timing question is empty—or whether it must be answered. I'll first list all desiderata with their justifications, then unpack the core conflict you identified (definite timing vs. postdictive influence), and finally address your proposed experiment and score existing theories.

  ---

  ### **Desiderata for a Theory of Temporal Experience**
  Each desideratum is defined by: (1) what the theory must deliver, (2) the phenomenon or consideration that necessitates it, and (3) why it's a *real constraint* (not just a curiosity). Constraints are grouped by theme.

  #### **I. Phenomena the Theory Must Account For**
  These are empirical observations that any theory must explain. They are constraints because they reveal how the brain *actually* processes temporal information, exposing limits and quirks of the system.

  1. **Color Phi Illusion**  
     - **Requirement**: Explain why subjects report a *single* moving object changing color *mid-trajectory*, with the color change seemingly experienced *before* the second stimulus appears.  
     - **Case**: Standard color phi setup (e.g., red dot at A, then green dot at B, 50-200ms gap). Subjects claim the dot "changes color before reaching B."  
     - **Why a constraint?** It challenges the idea that experiences are fixed at stimulus onset, as later input (the second dot's color) retroactively alters the content of an earlier-seeming experience. Ignoring this would miss a fundamental feature of temporal binding.

  2. **Metacontrast Masking**  
     - **Requirement**: Explain how a later stimulus (e.g., a ring) can erase or modify the experience of an earlier stimulus (e.g., a disk), making subjects deny seeing the first stimulus at all.  
     - **Case**: A disk flashed briefly, followed by a ring at short latency (~50ms). Subjects report only seeing the ring; the disk is "masked."  
     - **Why a constraint?** It shows that later inputs can determine whether an earlier event is consciously experienced, proving that temporal order isn't just a sequence of fixed snapshots. This is a direct challenge to linear models of perception.

  3. **Temporal Gap Sensitivity**  
     - **Requirement**: Explain why illusions (color phi, tactile rabbit) break when stimuli are too far apart in time (e.g., >200ms), reverting to accurate reporting of distinct events.  
     - **Case**: Color phi fails with gaps >200ms; subjects see two separate dots.  
     - **Why a constraint?** It demonstrates that the brain's temporal integration has a strict window (~<200ms). Theories cannot treat postdiction as unbounded; they must specify mechanisms sensitive to timing.

  4. **Tactile Rabbit (Saltation)**  
     - **Requirement**: Explain why rapid taps at two skin locations (e.g., wrist then elbow) are felt as "hops" along the arm, including illusory taps at intermediate points.  
     - **Case**: Taps at A and B, 50ms apart, elicit reports of taps "moving" from A to B via nonexistent points.  
     - **Why a constraint?** Like color phi, it involves illusory events (taps in between) driven by later stimuli, but in a different modality. This rules out modality-specific explanations and emphasizes spatial-temporal binding.

  5. **Temporal Order Judgment (TOJ) Accuracy**  
     - **Requirement**: Explain why subjects can correctly report event order (e.g., flash A before flash B) when stimuli are sufficiently separated (>50ms), despite illusions at shorter gaps.  
     - **Case**: Two flashes >50ms apart yield accurate "A then B" reports; <50ms causes order confusion.  
     - **Why a constraint?** It proves the system isn't noise—it has a reliable baseline for temporal resolution. Theories must account for both illusions and veridical perception, avoiding ad hoc explanations.

  #### **II. Conceptual Distinctions the Theory Must Maintain**
  These prevent theory-killing conflations. They are constraints because blurring them leads to circularity or ignores how reports, experiences, and neural processes relate.

  6. **Time of Experience vs. Time Represented in Experience**  
     - **Requirement**: Distinguish the *when* of the experience itself (e.g., its neural occurrence time) from the *when* that the experience *presents* (e.g., an event seeming to happen "at time t").  
     - **Case**: In color phi, the experience (neurally) might occur *after* both flashes, but it *represents* the color change as happening *midway*, before flash B.  
     - **Why a constraint?** Conflating these leads to paradoxes (e.g., "how can you experience a change before the cause?"). It forces theories to address reference (how experiences point to times).

  7. **Time of Report vs. Time of Experience Reported**  
     - **Requirement**: Distinguish the time a report is *made* (e.g., a button press) from the time of the experience it *describes*.  
     - **Case**: In color phi, asking "when did the color change?" assumes the report reflects the experience's timing, but reports are post-hoc and reconstructive.  
     - **Why a constraint?** Reports are not direct readouts; they can be influenced by memory, inference, or task demands. Ignoring this risks misattributing report times to experience times.

  8. **Order of Processing vs. Order in Experience**  
     - **Requirement**: Distinguish the temporal sequence of neural processing stages from the temporal structure of the resulting experience.  
     - **Case**: Flash A might be processed before flash B, but the experience might fuse them into a single event.  
     - **Why a constraint?** Neural processing is often asynchronous and hierarchical, but experiences feel unified. Equating them ignores how binding works.

  #### **III. Puzzles the Theory Must Dissolve (Not Just Rename)**
  These are persistent conceptual problems. A theory must *resolve* them, not just relabel them (e.g., "filling in" as a metaphor).

  9. **Postdictive Influence Without Backward Causation**  
     - **Requirement**: Explain how later stimuli (e.g., flash B in color phi) can shape an experience that *seems* to have already occurred (e.g., the color change midway), without invoking backward time travel.  
     - **Case**: Color phi's color change is reported as happening *before* flash B, yet flash B's color drives it.  
     - **Why a constraint?** Simply calling this "postdiction" or "retroactive revision" is insufficient—it doesn't explain the *mechanism*. Theories must detail how the brain avoids literal backward causation.

  10. **The "Filling In" Ambiguity**  
      - **Requirement**: Clarify whether illusions (e.g., tactile rabbit's intermediate taps) involve *positive neural representation* of nonexistent events or merely the *absence of contradiction* (no signal, so the brain infers continuity).  
      - **Case**: In tactile rabbit, are there neural signals for illusory taps, or is it a narrative gloss?  
      - **Why a constraint?** Calling it "filling in" is metaphorical and evasive. A theory must specify the nature of illusory content to avoid dualist traps.

  #### **IV. Hard Constraints from Neuroscience**
  These ground the theory in biology. They are non-negotiable because they reflect physical limits.

  11. **Finite Neural Processing Speed**  
      - **Requirement**: Respect that neural transmission and processing take time (e.g., ~100ms for visual awareness). Experiences cannot precede input registration.  
      - **Case**: In color phi, the experience of flash A cannot neurally complete before flash A's signal reaches cortex (~50-100ms).  
      - **Why a constraint?** Violating this implies magic (e.g., experiences before stimuli arrive).

  12. **No Backward Causation**  
      - **Requirement**: No neural mechanism allows later events to *causally influence* earlier ones. Information flows forward in time.  
      - **Case**: Flash B cannot alter flash A's processing *before* flash B occurs.  
      - **Why a constraint?** Backward causation is physically implausible; neuroscience shows no evidence for it.

  ---

  ### **The Core Conflict: Definite Timing vs. Postdictive Influence**
  Your hunch is correct: the central tension is between **definite timing** (every experience occurs at a specific moment) and **postdictive influence** (what an experience is like can depend on later stimuli). These conflict because:
  - If experiences have definite timing (e.g., at time t), they must be fixed at t, immune to later inputs.
  - But phenomena like color phi show later inputs (flash B) alter experiences that seem to include events *before* B (e.g., the color change).

  **Why they can't both be satisfied**:
  - If the color change experience happens *at* the time of flash A (definite timing), flash B can't influence it without backward causation (violating Desideratum 12).
  - If the experience happens *after* flash B (allowing postdictive influence), then it can't *truthfully represent* the color change as occurring *before* flash B (violating the subjective report in color phi and Desideratum 6—time represented vs. time of experience).

  **Which desiderata align with each side**:
  - **Pro-Definite Timing**: TOJ accuracy (5, shows experiences can be time-stamped), neural speed (11, experiences can't be instantaneous), no backward causation (12).
  - **Pro-Postdictive Influence**: Color phi (1), metacontrast (2), tactile rabbit (4), gap sensitivity (3, shows time-limited integration), and the postdiction puzzle (9).

  **Resolution**: Theories must reject or redefine one:
  - Reject definite timing → Experiences aren't "fixed" at a point; timing is ascribed later (e.g., Dennett).
  - Reject naive postdictive influence → Reports of "experiencing change before B" are misinterpreted; the experience only happens after B, but *misrepresents* timing (e.g., predictive processing).

  ---

  ### **Your Proposed Experiment: Circle-to-Square Phi**
  - **Setup**: Circle flashed at A, square at B, short gap (e.g., 100ms). Tasks:  
    (1) Sketch the shape at the midpoint.  
    (2) Press a key when the shape "starts to change."  
  - **Possible outcomes**:  
    - Sketches show a circle-square hybrid (e.g., squircle) never displayed.  
    - Key presses occur *before* the square is shown at B.  
  - **What a theory must say**:  
    - **Hybrid sketches**: The theory must explain illusory content (Desideratum 10). If subjects draw a morph, it supports positive "filling in" (e.g., neural representation of a blend). If they omit details, it might be neglect.  
    - **Early key presses**: The theory must reconcile this with neural constraints (11–12). Key presses before B *cannot* reflect experience of B itself (violates neural speed). Instead, it might reflect:  
      - A *post-hoc report error* (Desideratum 7: report vs. experience).  
      - The experience *misrepresenting* the change time (Desideratum 6: time represented vs. time of experience).  
      - Predictive processes (anticipating B based on A).  
    - **Slot in desiderata**: This fits under **Phenomena to Account For (color phi variant, reinforcing 1 and 4)** and **Puzzles (filling-in ambiguity, 10)**. It also tests the **report/experience distinction (7)**.

  ---

  ### **Scoring Existing Theories Against Desiderata**
  Briefly, as requested:

  - **Dennett's Multiple Drafts**:  
    - **Pros**: Rejects definite timing (solves the core conflict). Treats reports as probes that "fix" content retroactively (accounts for 1, 2, 4, 9). Blurs experience/report distinction (aligns with 7).  
    - **Cons**: Fails to explain TOJ accuracy (5) or neural constraints (11–12) robustly. Dismisses timing questions as "empty," but doesn't dissolve puzzles like filling-in (10).  
    - **Verdict**: Best at dissolving conflicts but risks being non-committal.

  - **Naive "Delayed-Unified" View** (e.g., experience delayed until all input is in):  
    - **Pros**: Respects neural speed (11) and no backward causation (12). Explains postdiction (1, 2) by buffering inputs.  
    - **Cons**: Fails color phi's subjective timing (reports of change *before* B). Blurs time of experience vs. represented time (6). Cannot explain gap sensitivity (3)—why not buffer longer gaps?  
    - **Verdict**: Incoherent on temporal representation.

  - **Predictive Processing** (e.g., brain infers timing):  
    - **Pros**: Explains illusions (1, 4) as Bayesian inference. Accounts for TOJ (5) and gap sensitivity (3). Dissolves filling-in (10) as probabilistic representation.  
    - **Cons**: Struggles with definite timing (e.g., is inference the experience?). Risks blurring processing/experience order (8). Doesn't fully resolve how "change before B" is *experienced* without misrepresentation.  
    - **Verdict**: Strongest on phenomena but needs clarity on distinctions.

  ---

  ### **Summary**
  The desiderata create a framework for evaluating theories of temporal experience. The core conflict (definite timing vs. postdictive influence) is unavoidable, and your proposed experiment will test it by probing illusory content and report timing. Dennett's view handles the conflict by rejecting definite timing, but at the cost of downplaying other constraints (e.g., TOJ accuracy). A complete theory must satisfy *all* desiderata without contradiction—currently, none do perfectly. Use this list to dissect future readings: if a theory violates a desideratum, it must justify why the constraint isn't binding.
