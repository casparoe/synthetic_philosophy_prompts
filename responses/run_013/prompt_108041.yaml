  **What is the reference point?** If "the trajectory the principal intended," you land at the *Value-Dependent View* (view B), where side effects require knowing the true human values to define intention; its awkward commitment is the circularity of needing aligned values to protect the value-learning process itself. If "inaction" (the trajectory without the agent), go to impact measurement. If "the world as it stands at decision time," skip to a later branch.

  For inaction: **How is impact measured?** If "deviation in the physical state of the world," ask: **Does this measurement require the true value function, or only the agent's objective?** If it requires the true value function, you hold an unnamed position with the awkward commitment that impact assessment depends on perfect value knowledge, which is unavailable during early deployment. If only the agent's objective, you reach *Objective-Relative Impact* (view A), where side effects are deviations irrelevant to the objective; its awkward commitment is permitting catastrophic changes if they don't hinder the objective (e.g., ignoring harm to uninvolved entities). If impact is measured as "reduction in the agent's capacity to pursue objectives," ask: **Does corrective action nullify impact?** If yes, you hold the *Reversible Impact* view, committed to allowing any change reversible by the agent, even if reversal consumes resources or causes secondary harm. If no, you hold the *Immediate Preservation* view, committed to blocking capacity-reducing actions that might be long-term optimal.

