prompt: |-
  I teach a 90-minute political ethics session to about 20 masters students in public policy, most of whom have never opened a political theory book. I want a role-play that makes them feel the dirty-hands problem in their gut rather than just hear me name it. The specific thing I want them to run into — and it should ambush them, not be announced — is that the hard part isn't picking the lesser evil (that's just a cost-benefit calculation and they'll do it easily), it's that they end up doing something they still believe was wrong even though they'd do it again, and then discovering that the wrongness can't be outsourced: nobody else can carry it, and if they walk away feeling clean that seems like a reason to distrust them. So the mechanics need to force both halves — the decision, and a reckoning afterwards that they can't get out of.

  Give me the setup, the roles and any hidden information, the phases and rough timing, and some small concrete stake so the choice bites (no real money). I was thinking of a two-stage thing: a cabinet-type body decides under time pressure, then in stage two each person has to give a public justification of the decision and also privately record, on a sealed slip, whether what they did was wrong — and then you reveal the split. If you can think of a cleaner or nastier mechanism, use it. Include a debrief that maps specific moments onto the pieces of the idea (the act that's wrong but required, the residue, the fact that being untroubled is itself suspect), a candid list of what will predictably go sideways the first time I run it and how to rescue it, and an honest note on which part of the idea the activity can't reproduce and that I'll have to supply in words.

  At the end, have the response flag which bits of the dirty-hands idea are settled among people who actually work on it and which are genuinely contested (e.g. whether the act is truly wrong or just a lesser evil, whether guilt is required or merely expected), and don't pass off a contested reading as the consensus.
reasoning: |-
  Okay, the user is teaching a political ethics session to master's students in public policy. They want a role-play that makes the dirty-hands problem visceral. The dirty-hands problem involves making a decision that's morally wrong but necessary, and then grappling with the personal guilt that can't be avoided. The students shouldn't just understand it intellectually; they need to feel it.

  The user mentioned that the hard part isn't just choosing the lesser evil but dealing with the aftermath—feeling that the action was wrong even if necessary and that they can't outsource the guilt. They want the role-play to ambush the students with this realization. The user suggested a two-stage process: a group decision under pressure, then individual justification and private confession. They’re open to better mechanics and want a debrief linking the experience to theory.

  First, I need to design a scenario that forces a trade-off between two terrible options. The setting should be a crisis to add pressure. A pandemic scenario could work, involving vaccine distribution. One option prioritizes saving lives by vaccinating high-transmission groups but excludes vulnerable populations, leading to preventable deaths. The other protects the vulnerable but allows more deaths overall. Both have ethical flaws.

  Roles are important. Instead of fixed roles, assign each student a stakeholder role (health official, community rep, etc.) to ensure diverse perspectives. Hidden information could include personal stakes, like a vulnerable family member, adding tension between personal and professional ethics. This might make the decision harder and the guilt more personal.

  The user wants a "reckoning" phase where students can't escape the guilt. After the decision, each must publicly justify it and privately state if they thought it was wrong. Revealing the split between those who felt it was wrong and those who didn’t can highlight that feeling clean is suspect. Adding a twist, like a journalist asking if they’d make the same choice, could force them to confront their lingering guilt.

  Timing is tight: 90 minutes total. The setup needs to be quick, maybe 5 minutes. Stage 1: group discussion and decision in 25 minutes. Transition to Stage 2: individual reflections and public justifications in 15 minutes. Then debrief for 30 minutes, mapping each part to the dirty-hands concept.

  Anticipating problems: students might rationalize the decision too easily, avoiding guilt. To counter this, emphasize the preventable deaths in both options. If they choose a compromise, the facilitator should block it, forcing a clear, painful choice. If time runs short, impose a strict cutoff. If someone dominates, use structured turns or breakout groups.

  The debrief should connect their experience to the theory. Highlight the act (necessary but wrong), the residue (personal guilt), and the suspicion if untroubled. Point out contested aspects, like whether the act is truly wrong or just a lesser evil, and whether guilt is necessary or just common.

  The activity can't fully replicate the long-term emotional burden. The facilitator needs to explain that real guilt lingers, unlike the brief exercise. Also, mention scholarly debates to provide a balanced view, ensuring students know which parts are settled and which are contested.
answer: |-
  Here’s a streamlined role-play design focused on visceral understanding of the "dirty hands" problem, with mechanics forcing both the decision *and* the inescapable reckoning:

  **Core Scenario: The Outbreak Dilemma**  
  *Setting:* A coastal city. A mutated avian flu strain (CF-19) is spreading. Hospitals are overwhelmed. Two vaccines exist but are scarce:  
  - **Vax-A:** Reduces transmission by 80% but offers weak protection to high-risk groups (elderly/immunocompromised).  
  - **Vax-B:** 95% effective for high-risk groups but only reduces transmission by 30%.  

  *Stakes:*  
  - **Option 1 (Prioritize Vax-A):** Save more *total* lives by slowing spread, but 100% of high-risk people infected will die (est. 800-1,200 preventable deaths in this group).  
  - **Option 2 (Prioritize Vax-B):** Save high-risk groups, but slower spread control = 40% more *total* deaths overall (est. 3,000+ preventable deaths).  

  **Hidden Mechanics & Ambush:**  
  - **Secret Stake:** Each player receives a **"Personal Vulnerability Card"** *(e.g., "Your spouse is immuno-compromised," "Your child has CF-19," "Your parent lives in a nursing home")*. *Only they know this.*  
  - **The Trap:** Both options force players to sacrifice a group they *know* includes people like their vulnerable loved one. Rational calculation can’t erase this.  

  ---

  ### **Structure & Timing (90 Min Total)**  
  **1. Setup (5 mins)**  
  - Assign roles: 20 students = **City Pandemic Ethics Board**. No specialized roles (avoids power imbalances).  
  - Distribute: (1) Scenario briefing, (2) Personal Vulnerability Card (hidden), (3) Blank paper/pen.  
  - *Frame neutrally:* "You are the advisory board. Recommend Option 1 or 2 to the Mayor. You have 25 mins."  

  **2. Stage 1: Group Decision (25 mins)**  
  - **Pressure:** Strict time limit. Display a countdown. Interrupt at 20 mins: "Hospitals report 50 new deaths in the last 10 minutes. Decide *now*."  
  - **Facilitator Note:** If consensus stalls, force a vote. Record individual votes secretly.  

  **3. Stage 2: The Reckoning (15 mins)**  
  - **Public Justification:** Each student *must* stand and give **one sentence** justifying the group’s decision to "the public" *(e.g., "We minimized total fatalities," "We protected the most vulnerable")*.  
  - **Private Confession:** After speaking, each writes on a sealed slip:  
    > *"Knowing what I knew, I believe the decision we made was: ____ (Morally Wrong / Morally Permissible).  
    > If faced again, I would: ____ (Make the same choice / Choose differently)."*  
  - **Reveal:** Collect slips. Tally and announce:  
    - How many voted for the *chosen* option?  
    - How many believe it was **Morally Wrong**?  
    - How many would **do it again**?  
    *(Key: Highlight mismatches—e.g., "16 of you believe this was morally wrong, but 18 would do it again.")*  

  **4. Debrief (30 mins)**  
  - **Map the Experience:**  
    - **The Act:** "You chose based on consequences, but why did so many call it *wrong*? What *specific* harm felt unforgivable?" *(Link to violating a duty to protect the vulnerable/equal worth)*.  
    - **The Residue:** "The vote tally let you outsource the decision. The confession slip didn’t. Why?" *(Emphasize: Guilt sticks to the actor, not the group)*.  
    - **The Suspicion:** "If someone *didn’t* feel conflicted—what might that imply? Is clean hands a sign of bad faith?" *(Connect to "moral disengagement" or lack of integrity)*.  
  - **Connect to Theory:**  
    - **"Dirty Hands" Core:** Acting for the greater good while violating a deep moral norm.  
    - **The Unavoidable Bit:** You can’t *not* make the choice (inaction = Option 2), **and** you can’t shed the guilt.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Students rationalize the choice as "not wrong, just hard."  
    **Fix:** Pre-debrief, ask: *"Did anyone feel, even momentarily, that this decision betrayed someone like the person on your Vulnerability Card?"*  
  - **Problem:** Groupthink overpowers dissent.  
    **Fix:** Secretly record individual votes. Reveal dissent during confession tally ("3 of you voted against the group").  
  - **Problem:** Time runs out before decision.  
    **Fix:** Enforce hard stop. Declare: *"The Mayor has implemented Option [X] by default as you failed to act."* Proceed to reckoning—inaction is still a choice.  
  - **Problem:** Students minimize stakes ("It’s just hypothetical").  
    **Fix:** Use stark, specific numbers. Ask: *"If your Vulnerability Card was real, would the residue feel different?"*  

  ### **What the Activity Can’t Replicate**  
  - **The Lingering Burden:** Real dirty-hands guilt persists for *years*, not minutes. You must **verbally emphasize**: "In reality, this isn’t a slip of paper—it’s waking up at 3 AM decades later wondering if you became the kind of person who sacrifices the weak."  

  ---

  ### **Dirty-Hands Theory: Settled vs. Contested**  
  *(Per Walzer, Williams, Coady, etc.)*  
  | **Element**               | **Settled Consensus**                                  | **Contested Debates**                                                                 |  
  |---------------------------|--------------------------------------------------------|---------------------------------------------------------------------------------------|  
  | **The Act**               | Requires violating a profound moral norm (e.g., killing innocents). | Whether the act is *truly* wrong or *merely perceived* as wrong. Realists vs. moral absolutists. |  
  | **Necessity**             | Must be a genuine, catastrophic dilemma (no "clean" options). | How extreme must "necessity" be? Is it ever just an excuse for moral compromise?       |  
  | **The Residue (Guilt)**   | The actor *cannot* be morally "clean" afterward.       | Whether guilt is *required* for integrity, or merely *expected* (and if faking guilt is acceptable). |  
  | **Outsourcing Burden**    | Guilt is non-transferable (even if the decision is collective). | Whether institutions/structures can *absorb* culpability (e.g., "just following orders"). |  
  | **The Suspicion**         | Lack of guilt *is* suspect (implies moral blindness).  | Whether public displays of guilt are performative or necessary for democratic accountability. |  

  **Key Reading for Students:**  
  > *"Political action is evil when we know what it means and do it anyway, because we must."*  
  > – Michael Walzer, "Political Action: The Problem of Dirty Hands" (1973)  

  This design forces a consequentialist calculation (stage 1) followed by an inescapable confrontation with its moral residue (stage 2). The vulnerability cards personalize the sacrifice, while the confession slip makes the guilt non-negotiable. The debrief ties their lived frustration to Walzer’s core insight: **Sometimes to do good, you must do bad—and the bad sticks to you.**
