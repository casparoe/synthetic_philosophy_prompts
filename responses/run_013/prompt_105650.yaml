prompt: |-
  After thirty-five years as a molecular biologist — cloning, sequencing, and more grant-panel arguments than I care to recall about whether a stretch of DNA "meant" anything — I have retired and, rather to my own surprise, fallen in with a philosophy of biology reading group. We keep circling the question of genetic information, and twice now someone has tried to settle a dispute by intoning a slogan instead of making an argument. In one session a colleague insisted that 'DNA is a code,' and from that inferred that genes carry information in the very same sense a sentence does: content that can be true or false, that can be read correctly or misread, and that therefore vindicates a robustly semantic notion of genetic information. In another, someone leaning on 'the genome is a blueprint' quietly assumed a one-to-one correspondence between a gene and a trait. I have used all of these phrases my entire career, and it has dawned on me that I could not say precisely what any of them asserts — which I find genuinely embarrassing.

  I would like you to take the part of a philosopher of biology, equally at home in molecular biology and in the philosophy of language and mind, and do for these slogans what a careful analytic philosopher does for any loose piece of language: extract the distinct, precise theses they might be expressing. Please think this through thoroughly before committing to anything. I want the readings laid out as a menu, running from the nearly trivial to the genuinely radical — I expect the interesting action to lie in the distinctions between syntactic and semantic senses of "information," in how much work arbitrariness and convention are doing, and in whether a code is being assimilated to a blueprint, a recipe, or a program. For each reading I want your verdict — platitude, substantive and defensible, or simply false — and, crucially, whether that reading is the one that would actually license the move my colleagues wanted to make with it. Do not trouble yourself with citations, reading lists, or who said what; I want the conceptual map, argued from first principles rather than from authority.

  Give me your answer as a numbered list of exactly five items, each one a sentence or two, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is a retired molecular biologist who's now grappling with philosophy of biology concepts. They're frustrated by colleagues using slogans like "DNA is a code" or "the genome is a blueprint" without precise definitions, and they want me to analyze these metaphors rigorously. They need five distinct interpretations of each slogan, assessed for truth value and whether they support the inferences their colleagues made.

  The user specifically wants:
  - A numbered list of exactly five items
  - Each item should be one or two sentences
  - No introduction or conclusion
  - Focused on conceptual analysis, not citations or authorities
  - Covering a range from trivial to radical interpretations
  - Explicit verdicts: platitude, substantive/defensible, or false
  - Assessment of whether each interpretation justifies the colleagues' arguments

  Key philosophical distinctions to address:
  - Syntactic vs semantic information (Shannon information vs meaning)
  - Role of arbitrariness/convention in genetic codes
  - Analogies to blueprints (static maps) vs recipes (process-oriented) vs programs (algorithmic)

  For "DNA is a code":
  1. Must distinguish between the genetic code (causal mapping) and linguistic codes (conventional meaning)
  2. Need to evaluate whether DNA contains "semantic" information with truth values
  3. Should address whether the arbitrariness of codons implies full-blown semantics

  For "genome is a blueprint":
  1. Must contrast one-to-one mapping claims with actual pleiotropy/polygeny
  2. Should differentiate between informational and causal roles
  3. Need to assess reductionist vs systems biology perspectives

  The user's embarrassment about using these terms uncritically suggests they want rigorous deconstruction. Their molecular biology background means I can use technical terms like "codons" but must keep philosophical explanations accessible.

  Priorities for the five items:
  - Cover both slogans within the five points
  - Ensure each reading gets a verdict
  - Explicitly state if it supports the colleagues' inferences
  - Build progression from least to most controversial
  - Maintain analytic precision without jargon

  Final structure plan:
  First two items on "code" slogan (syntactic then semantic)
  Next two on "blueprint" (minimal vs strong interpretation)
  Final item connecting both to show why conflations happen
answer: |-
  1. DNA functions as a biochemical code in the syntactic sense: nucleotide sequences (codons) causally map to amino acids via molecular recognition, embodying Shannon information measurable in bits, which is a defensible platitude; however, this does not license inferring semantic content (e.g., truth/falsity), as syntactic information lacks intrinsic meaning.  
  2. DNA is a code in a semantic sense if codon-tRNA pairings are arbitrary and convention-based, implying evolved "meanings" analogous to language; this is substantive but false—while codon assignments are historically arbitrary, they lack conventional agency or error-correction for misreading (beyond natural selection), failing to vindicate truth-apt information or robust semantics.  
  3. The genome acts as a minimal blueprint: gene sequences non-arbitrarily specify polypeptide structures via the genetic code, a substantive and defensible claim; yet this does not imply one-to-one gene-trait correspondence, as traits emerge from gene-environment interactions and regulatory networks.  
  4. The genome is a blueprint in a strong reductionist sense: each gene encodes a discrete trait in isolation, enabling direct trait prediction from sequence; this is simply false—it ignores pleiotropy, polygeny, epigenetics, and developmental contingencies, illegitimately supporting the colleague's assumption.  
  5. DNA is a program or recipe: genes context-dependently instruct cellular processes dynamically, like a computational algorithm, a substantive and defensible view; however, this still treats "information" causally (syntactic), not semantically, and cannot ground truth/falsity without conflating teleology with intentionality.
