  Key constraints: 
  - Avoid vague "structure survives" claims (as criticized by their philosopher friend).  
  - Commit to one specific interpretation of what lasts.  
  - Five minutes max, lighthearted but profound.  

  Hmm, the core philosophical tension is about scientific realism versus instrumentalism. Their advisor dismissed the work with "equations were the part that lasted," but that's too shallow. Need deeper insight.  

  Possible angles:  
  - **Mathematical relationships**: Not just any structure, but the concrete functional dependencies (e.g., how variables scale together) that reappear in new theories.  
  - **Problem-solving tools**: The techniques she developed for modeling, which remain useful even when the ontology changes.  
  - **Constraints and symmetries**: Physical principles (like conservation laws) that outlive specific theories.  

  The strongest approach might be "relational invariants"—the persistent mathematical relationships between observables. For example, in Newtonian vs. relativistic mechanics, kinetic energy = 1/2 mv² vs. γmc², but both express "energy scales with mass and motion." This isn't vague; it's testably preserved in limiting cases.  

