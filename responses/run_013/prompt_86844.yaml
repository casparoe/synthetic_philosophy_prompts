  Final touch: End with grandkids’ perspective ("coast") to humanize it. The laugh line? Teasing about her disliking sentimentality—then being deeply sincere anyway.
answer: |-
  Here is the toast, built on a single, concrete interpretation of what survives theory change: **the robust mathematical relationships governing measurable quantities under specific conditions**. This claims that what lasts are the precise functional dependencies between observables (e.g., how force relates to acceleration, or how energy scales with temperature), especially in well-defined limiting cases, even when the ontology (e.g., "what force *is*") changes. I reject vaguer notions of "structure" (too broad to be meaningful) and "approximate truth" (risks implying her work was "almost right," which undersells its rigor). Instead, this focuses on **invariant relational kernels**—equations that remain empirically valid or morph continuously into new forms under theory shifts, like how Newtonian mechanics persists as the low-velocity limit of relativity.

  ---

  ### The Toast
  [Raise glass, warm smile]  
  Good evening, everyone. For those who don’t know me, I’m [Your Name], one of [Advisor’s Name]’s former students. And like all of us here, I owe her more than I can fit into five minutes—though if I go long, I suspect she’ll cut me off with a whiteboard marker. [Light laughter]  

  [Advisor’s Name] taught me something early on: physics isn’t about being right. It’s about being *rigorous*. She spent forty years building frameworks so elegant, so mathematically crystalline, they felt inevitable. And when one of those frameworks was superseded? She helped dismantle it herself. Not because it was "wrong," but because that’s how science *grows*. Whenever we’d ask how she felt about it, she’d wave it away: "The equations are the part that lasts."  

  But tonight, I want to take that seriously. Because it’s not just a consolation—it’s a revelation.  

  Think of her work like a master cartographer mapping a coastline. When a better map comes along, the old one isn’t "wrong." It’s just refined. The headlands, the coves, the depth contours—those relationships between points *persist*. They’re the invariant core. In physics, it’s the same: when theories change, the deepest mathematical relationships—how pressure scales with volume, how fields couple to particles—don’t vanish. They become special cases, or limiting behaviors, or they evolve continuously into the new theory. They’re the coastline that newer maps describe more accurately, but can’t erase.  

  [Advisor’s Name] didn’t just draw maps. She taught us to see the *shoreline* in the math—the relationships so robust, they survive even when paradigms shift. That’s not a small thing. It takes courage to build something beautiful and later say, "This isn’t the whole story," without disowning the beauty.  

  And that’s why, to her grandchildren, she’s not just the woman who took them to the coast. She’s the one who taught them to watch the tide, to spot the patterns in the waves, to trust that even when the sea reshapes the sand, the rhythm remains. [Nod to family]  

  So, to [Advisor’s Name]: for teaching us that the best science isn’t a monument—it’s a compass. It guides us toward deeper truths, and its legacy isn’t in being permanent, but in being *precise* enough to outlast revolutions. Thank you for forty years of exquisite maps. [Raise glass higher]  

  ---

  ### The Claim & Why It Works  
  **Your one-sentence claim**:  
  "What lasts are the concrete mathematical relationships between measurable quantities—like how force scales with acceleration or energy with temperature—because they persist as empirical anchors in new theories, either exactly in limiting cases or as continuously deformed versions, unlike vague 'structure' or brittle 'truth.'"  

  **Why reject alternatives**:  
  - **"Structure is what survives" (too vague)**: As your philosopher friend noted, this is empty unless specified—any two theories share *some* abstract structure (e.g., "both use numbers"), making it meaningless praise.  
  - **"Her tools/methods live on" (too instrumental)**: This reduces her work to "useful tricks," ignoring its conceptual depth.  
  - **"It was approximately true" (misleading)**: Implies her framework was flawed, not superseded—a disservice to its rigor.  

  ### Liberties & Contested Ground  
  1. **Epistemic privilege to "measurable quantities"**: I assume relationships between observables (e.g., force, temperature) are the stable core. Some philosophers (e.g., structural realists) argue *all* structure survives, including unobservables—but that’s riskier and harder to defend physically.  
  2. **Continuity of equations**: I imply equations "morph" smoothly (e.g., Newton’s \( F=ma \) as \( v \ll c \) limit of relativity). This holds for many cases but isn’t universal (e.g., quantum-classical transitions). Philosophers like Nancy Cartwright contest whether math "survives" vs. being reinterpreted.  
  3. **Metaphor over metaphysics**: The "map/coastline" analogy leans pragmatic—it sidesteps debates about *why* relationships persist (e.g., do they reflect reality, or just human modeling?). Physicists will likely accept this; philosophers might crave deeper justification.  

  **Why this works for you**: It’s precise enough for physicists (they’ll recognize limiting behaviors), poetic for family, and honors the work’s integrity without false permanence. The laughs come from affection ("whiteboard marker"), and the coast metaphor ties her science to her humanity. It’s five minutes if delivered at a measured pace—practice with a timer!  

