   Given the arithmetic, it is impossible to have within every subgroup the control has a higher mean than the treated, but overall the treated has a higher mean than the control.

   because the overall mean for treated is a convex combination of the subgroup means for treated, and the overall mean for control is a convex combination of the subgroup means for control.

   Let for subgroup1: mean_control1 > mean_treated1
      subgroup2: mean_control2 > mean_treated2
   Then for any weights, the overall mean for control is > overall mean for treated.

   Therefore, the condition is arithmetic impossible.

   So what does the user mean by " the subgroup comparisons disagree" and " the disaggregated comparison is the one to trust" in the context of the reverse Simpson's where the aggregated is correct and the subgroups are not.

   In the typical Simpson's, the aggregated comparison shows one thing ( e.g., control better) and the subgroups show the opposite ( in at least one subgroup treated better).

   In the reverse, we want aggregated to show treated better, and every subgroup to show control better.

   But arithmetic shows this is impossible.

   Therefore, the only possibility is that in the subgroups, the comparison is made in the wrong direction due to a confounder, and in each subgroup the estimated effect is in the opposite to the true effect within that subgroup.

   How can that happen? 
     - If the within-subgroup analysis is confounded.

   In our cause, the partitioned variable might be a confounder or a collider.

   In the causal inference, if we condition on a collider, we may get a bias.

   So in the example, the partitioned variable might be a collider.

   Therefore, the within-subgroup analysis (condition on the collider) may show a association in the wrong direction, while the overall analysis (not conditioning on the collider) may show the correct association.

   So we need an example with a collider.

   Example with a collider:

     Let T ( treatment) and U ( unobserved confounder) both influence ( or are associated with) the partitioned variable S, and both T and U influence Y.

     Then when we condition on S, we may induce an association between T and U, and this may cause a bias that reverses the sign.

     And we want the overall association between T and Y to be positive ( treated better) but within every level of S, the association is negative ( control better).

     So for example, let's assume:

        T and U are independent ( by randomization for T, and U is background).
        S is caused by T and U.
        Y is caused by T and U.

     We want the causal effect of T on Y to be positive.
     But when we condition on S, the association between T and Y becomes negative.

     This is possible if conditioning on S induces a dependence between T and U, and U has a strong effect on Y.

     Example with binary variables (0,1) for T, U, S, Y.

     Assume:
       P(U=1) = 0.5.
       T is randomized: P(T=1)=0.5.

       S = 1 if T+U >=1, else 0. ( so S=0 only if T=0 and U=0).

       Y = T - U + noise. -> but then if T=1, U=0: Y=1; T=1, U=1: Y=0; T=0, U=0: Y=0; T=0, U=1: Y=-1.

     But to make it binary, maybe not.

     Instead, let's use linear statistics.

     Assume we have a large sample.

     By randomization, within each U, the only difference should be T.

     But we don't observe U.

     Now, if we condition on S, we may have:

       For S=0: only (T=0, U=0), so within this group, T is always 0, so we cannot compute the effect.

     So let's make S have more values.

     Assume:
       S = T + U  ( then S=0,1,2)

     Or we can make it that S is always observed, and for not being deterministic, make it noisy.

