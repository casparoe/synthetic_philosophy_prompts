prompt: |-
  ok so i'm trying to write something up on norms of assertion — the whole question of what it is you've got to have, exactly, before you're entitled to flat-out tell someone something. Before I commit to a side I want the spec first. So: give me the desiderata that any theory of the norm of assertion has to meet. The cases it has to get right, the distinctions it can't just collapse, the results it has to stay consistent with. For each one, say what's behind it — the case or consideration that makes it a genuine requirement and not just a taste of one camp. Then tell me which of the requirements are non-negotiable and which are really just commitments of a particular position, and flag any pair you think can't be jointly satisfied. That last bit is what I most want — if some subset of the list is jointly unsatisfiable, then the list itself is a result.

  I want it to handle some cases that aren't just the textbook ones, so it can't coast:

  - the lucky guess that happens to be true (person had no business being right, but was)
  - the Moore-ish one: "it's raining, but I don't believe it's raining" — what exactly is broken there
  - someone who genuinely knows, but asserts it to a person who has already announced they won't believe a word they say
  - someone who knows but couldn't give their reasons to save their life — expert who just can't articulate the justification
  - an assertion made to a diary / a recording only your future self will ever hear — does the norm even apply when there's no hearer taking your word
  - an assertion you're rewarded for getting believed, true or not (a bet, a sales pitch)
  - telling a small child something you know is true but the point is comfort, not information
  - a plain autocomplete or chatbot spitting out a sentence — is that an assertion at all, and if so who's bound by the norm
  - an assertion you later retract because it turned out false
  - high-stakes vs low-stakes contexts where the same speaker with the same evidence seems fine in one and not the other

  For each desideratum give me the one case that does the motivating work, and say whether it's really a requirement or a prejudice of the knowledge-norm crowd / the truth-norm crowd etc.

  If you want, add a one-liner on how knowledge, truth, belief, and justification views fare against the list — but keep the weight on the criteria, the scoring isn't the point, I'll do that part myself.

  One more thing: please be upfront about which of these requirements is acutally settled among people who work on this, and which is genuinely contested — don't sell me one camp's pet requirement as if everyone agrees, and seperate those two clearly.
