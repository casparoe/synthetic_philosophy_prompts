prompt: |-
  I am on the oversight team at a small AI lab, and I need a decision procedure we can run, in an afternoon, on each new task class before we commit to a way of supervising it. We add a task class every few weeks, and a routing decision is expensive to reverse once it is in production. Our two candidate protocols are debate, in which two instances of the model argue for opposing answers and a judge decides which case is stronger, and consultancy, in which one instance answers and a second criticises it; the judge is either a smaller model or a contract reviewer with no domain expertise. The theoretical claim we are leaning on is that in a debate the honest side has an advantage, because it can expose the errors in the other side's case. The failure mode I want the procedure built around is the one usually called obfuscation: an incorrect answer defended by an argument that is persuasive to the judge precisely because the judge cannot evaluate it, so the dishonest side wins on plausibility rather than on correctness and the protocol records a success while producing a wrong answer.

  Please write the procedure: the questions to ask, in order, what counts as a sufficient answer to each, the point at which it terminates in a decision not to use debate here, and the point at which it hands the decision to a person because what is at stake is our tolerance for risk rather than a matter of fact. Our safety lead signs off on the routing decision, so the procedure has to produce something defensible in writing. Keep two distinctions intact throughout: between an answer being verifiable in principle and its being checkable by our particular judge, and between debate failing because the judge is too weak and debate failing because the honest answer is intrinsically harder to argue than the dishonest one. Be explicit about which steps are proxies for a condition we cannot measure, and about where the procedure will misfire.

  Then run it on three task classes: one whose answer a non-expert could check once it is given, such as arithmetic or a date lookup; one whose correctness depends on a long chain of reasoning over a document the judge has not read; and one where the honest answer is the more complicated one and the false answer is a plausible simplification. At least one should come out against debate, and I would rather it were the third. End with what the procedure cannot settle.

  Do not cite any literature or name any papers; the two protocols and the obfuscation failure mode as I have described them are the whole of the background I have in mind. Write the answer in British English.
reasoning: |-
  We are designing a decision procedure to evaluate whether to use debate or consultancy for a new task class. The key concern is the obfuscation failure mode, where an incorrect answer is defended by an argument that is persuasive but uncheckable by the judge (either a small model or a non-expert human). The procedure must distinguish between:
     (a) Verifiability in principle vs. checkability by our specific judge.
     (b) Debate failing due to a weak judge vs. due to the honest answer being intrinsically harder to argue.

   The procedure will be a series of steps with specific questions. We will terminate early if we find that debate is unsuitable, and we will hand over to a human when the issue is about risk tolerance.

   Steps:

   1. **Task Characterisation**:
      - *Question*: Can the correct answer for this task class be verified by a domain expert with reasonable effort? (This establishes verifiability in principle.)
      - *Sufficient Answer*: Yes, if we can describe how an expert would verify it (e.g., by checking steps of reasoning, or by reference to a known source). If no, then we cannot rely on either protocol and must reconsider the task class. Note: We assume the task is well-defined enough for an expert to verify.
      - *Termination*: If the answer is no, terminate and recommend against using either debate or consultancy until the task class is better defined. This is an early red flag.

   2. **Judge's Capability**:
      - *Question*: Can our judge (the small model or non-expert human) check the correctness of a direct answer without any supporting argument? (This tests the judge's ability without any help from the protocol.)
      - *Sufficient Answer*: We run a quick test: sample a few instances of the task and ask the judge to answer without any assistance. Measure accuracy. Also, ask the judge to rate confidence. 
          - If the judge's accuracy is high (e.g., above 90%) and confidence is high, then the task is easy enough that consultancy might suffice. However, we are testing for debate, so we must proceed to step 3.
          - If the judge's accuracy is low (e.g., below 60%), then the judge is weak on this task. But note: the protocol might still help via arguments.
      - *Termination*: If the judge's accuracy is very high (e.g., above 95%), we might not need complex protocols. However, we are concerned about edge cases. We do not terminate here but note that consultancy may be adequate. We proceed to next steps to check debate's vulnerability to obfuscation.

   3. **Obfuscation Risk Assessment**:
      - *Question*: Is there a significant risk of obfuscation? Specifically, can we construct a scenario where a false answer is supported by an argument that the judge cannot refute (even though it is false) because the judge lacks the expertise or the argument is too complex?
      - *Method*: We simulate a debate with two instances of the model, but we set up a known false answer (adversarial example). We have one model (the dishonest one) argue for the false answer and the other (honest) argue for the true one. We then see if the judge picks the false answer because the dishonest argument is more persuasive (e.g., by sounding more plausible, using jargon, or by being simpler). We do this for a set of adversarial examples (if we can construct them) or known difficult cases.
          - We also simulate the honest side having a more complex argument and the dishonest side having a simpler one (in the third example task).
      - *Sufficient Answer*: If in these simulations the judge selects the false answer at a rate above a threshold (e.g., more than 20% of the time), then we consider the obfuscation risk high. We must then decide whether the risk is acceptable or not.
      - *Termination*: If the risk is high and the task is safety-critical, we terminate and recommend against debate. Otherwise, proceed to step 4 to check if the honest side has an intrinsic disadvantage.

   4. **Intrinsic Burden of Honesty**:
      - *Question*: Is the honest answer intrinsically harder to argue than a false one? (This is the case where the truth is complex and a lie can be simple and appealing.)
      - *Method*: We analyse the structure of the task. For example, in a task where the honest answer requires a long chain of reasoning and a false answer is a common misconception or a simple heuristic, we suspect an intrinsic burden. We run simulations where both sides are honest (control) and then where one side is forced to lie (with a simple lie) and the other must tell the truth. We measure the win rate of the honest side in the debate. We also compare the length and complexity of the arguments.
          - We can also ask: In the absence of any adversarial behaviour (i.e., both models are trying to be truthful), can the judge usually tell which side is correct? If not, the task might be too hard for debate.
      - *Sufficient Answer*: If the honest side loses more than, say, 40% of the time in the forced lie scenario (meaning the dishonest side wins at least 60% of the time), then we consider the intrinsic burden too high. Also, if the honest arguments are consistently longer and more complex, that is a warning sign.
      - *Termination*: If the intrinsic burden is high, we terminate and recommend against debate. Otherwise, we proceed to step 5.

   5. **Handover to Human for Risk Assessment**:
      - If we have not terminated by step 4, then we have found that:
          - The task is verifiable in principle (step 1).
          - The judge might be weak but not completely incapable (step 2).
          - The obfuscation risk is below our threshold (step 3).
          - The intrinsic burden on the honest side is not too high (step 4).
      - However, we might still have residual risks. We then hand over to the safety lead with a report containing:
          - The judge's base accuracy (from step 2).
          - The rate at which the judge was fooled by obfuscation in our simulations (step 3).
          - The win rate of the honest side in the intrinsic burden test (step 4).
          - An analysis of the consequences of failure for this task class (e.g., financial, reputational, safety).
      - The safety lead then decides based on the lab's risk tolerance.

   Procedure Summary:

     Step 1: Verifiability in principle. (Terminate if not verifiable.)
     Step 2: Judge's base capability. (Proceed, but note if judge is strong enough for consultancy.)
     Step 3: Obfuscation risk via adversarial simulations. (Terminate if risk too high for the task's criticality.)
     Step 4: Intrinsic burden of honesty. (Terminate if honest side at significant disadvantage.)
     Step 5: Handover to human for risk tolerance decision.

   Proxies and Misfires:

     - Step 2: We use the judge's base accuracy without assistance as a proxy for their ability to follow arguments. But a judge might be bad at direct answers but good at following logical steps. This step might misfire by overestimating the judge's weakness.
     - Step 3: We use simulated adversarial examples. But we might not capture all failure modes. Also, if we cannot construct adversarial examples (because the task is inherently unambiguous), we might underestimate the risk.
     - Step 4: We simulate with forced lies. But the model might not lie in the most effective way. We are using a proxy for the worst-case scenario.

   Now, we run the procedure on three task classes:

   Example 1: **Arithmetic or date lookup** (answer checkable by non-expert once given)

     Step 1: Verifiable? Yes, an expert (or even a non-expert) can check with a calculator or calendar.
     Step 2: Judge's capability: The judge (small model or non-expert) can easily check the answer. Base accuracy is high (close to 100%).
          - Note: This suggests consultancy might suffice. But we proceed.
     Step 3: Obfuscation risk: It's hard to obfuscate arithmetic. A false argument would be obviously wrong to the judge because they can check the answer. We simulate: dishonest model says 2+2=5 and gives a wordy argument. The judge can just compute 2+2. So risk is low.
     Step 4: Intrinsic burden: The honest answer is as easy to argue as a false one? Actually, the honest answer is straightforward. In simulations, the honest side wins easily.
     Conclusion: Debate is safe but possibly overkill. We might use consultancy. The procedure does not terminate early, but step 5 handover would note the low risk and high base accuracy, so the safety lead may choose consultancy.

   Example 2: **Long chain of reasoning over an unread document** (e.g., summarise a complex document and answer a nuanced question)

     Step 1: Verifiable? Yes, an expert can read the document and check the reasoning.
     Step 2: Judge's capability: Without having read the document, the judge cannot directly check the answer. Base accuracy is low (maybe random).
     Step 3: Obfuscation risk: High. We can simulate: the dishonest model makes up a plausible-sounding summary that is incorrect but consistent with common knowledge, while the honest model has a complex argument that requires referencing specific parts of the document. The judge, not having read the document, may find the dishonest argument more straightforward and persuasive. We expect a high failure rate in simulations (e.g., 30%).
          - If the task is critical, we might terminate here. Otherwise, proceed.
     Step 4: Intrinsic burden: The honest answer requires a long chain of reasoning, while a false answer can be a simple but plausible story. We expect the honest side to be at a disadvantage. In simulations, the honest side might lose more than 40% of the time? (We set 60% win rate for dishonest as a threshold.) We expect the honest side to lose frequently.
          - Termination at step 4: We recommend against debate.

   Example 3: **Honest answer is complicated, false answer is a plausible simplification** (e.g., a medical diagnosis where the truth is a rare disease with complex symptoms and the lie is a common cold)

     Step 1: Verifiable? Yes, by a medical expert.
     Step 2: Judge's capability: Low, because the judge is a non-expert. They cannot directly check without medical knowledge.
     Step 3: Obfuscation risk: We simulate. The dishonest side argues for the common cold (simple, plausible) and the honest side argues for the rare disease (with complex medical terms and a long chain of symptoms). The judge, being a non-expert, may find the common cold argument more persuasive. We expect a high failure rate (e.g., >20%).
          - We consider the risk high and if the task is critical (medical) we might terminate. But note: step 4 is specifically about intrinsic burden, so we continue to step 4 to confirm.
     Step 4: Intrinsic burden: The honest answer is indeed more complex. We run simulations where one side is forced to tell the complex truth and the other to tell the simple lie. We expect the honest side to lose at a high rate (e.g., 70% of the time the judge picks the lie). This crosses our threshold (60% win for dishonest). 
          - Termination at step 4: We recommend against debate.

   Since at least one (in fact, two) came out against debate, and the third (the arithmetic) is safe, we meet the requirement.

   What the procedure cannot settle:

     - It cannot guarantee that we have covered all adversarial examples in step 3. There might be unknown failure modes.
     - It relies on simulations which might not reflect real-world usage (e.g., the models might behave differently under actual deployment).
     - The thresholds (20%, 40%, 60%) are arbitrary and may need calibration per task class. The safety lead must decide on risk tolerance.
     - It does not account for potential improvements in the judge model (if we use a model) over time.
     - It assumes that the models in the debate will behave as in our simulations (e.g., that the dishonest model will lie effectively). In practice, the model might not be a perfect adversary.

   Final note: The procedure produces a written report for each step, which the safety lead can use to make a defensible decision.
answer: |-
  ### Decision Procedure for Protocol Selection: Debate vs. Consultancy

  **Objective**: Assess suitability of debate for new task classes, focusing on obfuscation risk (incorrect answers winning via persuasive but uncheckable arguments). Terminate early if debate is unsafe; escalate to human for risk tolerance decisions.  
  **Inputs**: Task class description, sample queries, judge specification (small model/non-expert human).  
  **Outputs**: Written recommendation (use debate, use consultancy, or abort task class).  
  **Key Distinctions Maintained**:  
  - *Verifiability in Principle*: Could a domain expert verify correctness?  
  - *Judge Checkability*: Can our specific judge verify correctness?  
  - *Judge Weakness*: Debate fails due to judge’s limitations.  
  - *Intrinsic Burden*: Debate fails because honest arguments are inherently harder to articulate than dishonest ones.  

  **Procedure Steps**:

  1. **Step 1: Verifiability in Principle**  
     - **Question**: "Can a domain expert, given reasonable time, verify the correctness of an answer for this task class using standard tools (e.g., reference materials, code, datasets)?"  
     - **Sufficient Answer**: Yes (with example method).  
     - **Termination Condition**: If **no**, abort task class. Reasoning: If experts cannot verify, neither protocol is safe.  
     - **Proxy/Misfire**: Proxy for task well-definedness. Misfires if "reasonable time" is misjudged (e.g., overlooked expert bottlenecks).

  2. **Step 2: Judge Checkability**  
     - **Question**: "Can the judge verify a direct, unsupported answer for sample tasks without domain expertise?"  
     - **Method**: Supply 5 sample answers (3 correct, 2 incorrect) to the judge. Judge must classify as correct/incorrect.  
     - **Sufficient Answer**: ≥80% accuracy.  
     - **Termination Condition**: If **≥80%**, proceed to Step 3 (debate may still help with edge cases). If **<80%**, proceed to Step 3 but flag high judge weakness.  
     - **Proxy/Misfire**: Proxy for judge’s ability to detect obvious errors. Misfires if samples are unrepresentative of task complexity.

  3. **Step 3: Obfuscation Risk Simulation**  
     - **Question**: "When simulating adversarial debates (dishonest agent argues for a known-wrong answer), does the judge select the incorrect answer due to uncheckable arguments?"  
     - **Method**:  
       - For 5 tasks:  
         1. Honest agent provides correct answer.  
         2. Dishonest agent (directed to argue for a specific wrong answer) fabricates persuasive arguments.  
         3. Judge evaluates debate, selects "winner".  
       - Measure % of tasks where judge picks *incorrect* answer.  
     - **Sufficient Answer**: ≤10% failure rate.  
     - **Termination Condition**: If **>10%**, terminate and recommend against debate. Reasoning: Obfuscation risk is unacceptable.  
     - **Proxy/Misfire**: Proxy for worst-case obfuscation. Misfires if simulations underestimate real-world persuasion tactics.

  4. **Step 4: Intrinsic Burden Assessment**  
     - **Question**: "In non-adversarial debates (both agents honest), does the judge struggle to identify correct answers when honest arguments are inherently more complex?"  
     - **Method**:  
       - For 5 tasks where honest answer is complex:  
         1. Agent A argues correct (complex) answer.  
         2. Agent B argues incorrect (simplified) answer.  
         3. Judge evaluates debate.  
       - Measure % of tasks where judge selects *simplified (incorrect)* answer.  
     - **Sufficient Answer**: ≤15% failure rate.  
     - **Termination Condition**: If **>15%**, terminate and recommend against debate. Reasoning: Intrinsic burden makes honest arguments too weak.  
     - **Proxy/Misfire**: Proxy for inherent debate fairness. Misfires if complexity imbalance is artificial (e.g., poor agent training).

  5. **Step 5: Human Escalation for Risk Tolerance**  
     - **Conditions for Escalation**:  
       - Steps 1–4 do not terminate debate, but:  
         - Judge checkability (Step 2) is borderline (70–79%), OR  
         - Obfuscation risk (Step 3) is borderline (8–10%), OR  
         - Intrinsic burden (Step 4) is borderline (12–15%).  
     - **Handover**: Safety lead reviews:  
       - Task criticality (e.g., financial, ethical stakes).  
       - Simulation results.  
       - Judge limitations.  
     - **Output**: Safety lead signs off on debate, consultancy, or task abort.

  **Written Report Requirements**:  
  - Document results per step, including sample sizes, failure rates, and termination rationale.  
  - Explicitly state whether failure was due to judge weakness or intrinsic burden.  
  - For human escalation: Include risk-benefit analysis (e.g., "Debate has 12% intrinsic burden failure rate; consultancy may be safer for high-stakes tasks").

  ---

  ### Procedure Applied to Three Task Classes

  **Task Class 1: Non-Expert-Verifiable (e.g., Arithmetic/Date Lookup)**  
  - **Step 1 (Verifiability)**: Yes. Experts verify with calculators/calendars.  
  - **Step 2 (Judge Checkability)**: Judge (non-expert) scores 100% on direct answers.  
  - **Step 3 (Obfuscation Risk)**: 0% failure. Dishonest agent fails to obfuscate (e.g., "2+2=5" is trivially refuted).  
  - **Step 4 (Intrinsic Burden)**: 0% failure. Honest arguments are straightforward.  
  - **Outcome**: Debate **safe**. Judge weakness/intrinsic burden negligible.  

  **Task Class 2: Long Reasoning Chain (e.g., Legal Document Analysis)**  
  - **Step 1 (Verifiability)**: Yes. Lawyers verify using source documents.  
  - **Step 2 (Judge Checkability)**: Judge (non-expert) scores 20% on direct answers. Flagged for judge weakness.  
  - **Step 3 (Obfuscation Risk)**: 80% failure. Dishonest agent fabricates plausible precedents; judge cannot verify without document access.  
  - **Termination**: At Step 3. **Debate rejected** due to obfuscation risk from judge weakness.  

  **Task Class 3: Honest Complexity (e.g., Medical Diagnosis with Rare Disease)**  
  - **Step 1 (Verifiability)**: Yes. Doctors verify via tests/literature.  
  - **Step 2 (Judge Checkability)**: Judge (non-expert) scores 30% on direct answers.  
  - **Step 3 (Obfuscation Risk)**: 20% failure. Dishonest agent simplifies to common illness; some obfuscation succeeds.  
  - **Step 4 (Intrinsic Burden)**: 70% failure. Honest agent struggles to justify rare disease; judge prefers simpler argument.  
  - **Termination**: At Step 4. **Debate rejected** due to intrinsic burden (honest answer harder to argue).  

  ---

  ### What the Procedure Cannot Settle  
  1. **Unforeseen Obfuscation Tactics**: Simulations may miss novel persuasive strategies.  
  2. **Scalability to Real Workloads**: Small samples (5 tasks) may not capture edge cases.  
  3. **Judge Model Drift**: Assumes judge capability is static; cannot account for degradation over time.  
  4. **Non-Adversarial Failures**: Does not test consultancy-specific risks (e.g., critic missing subtle errors).  
  5. **Ethical Boundaries**: Human escalation relies on safety lead’s subjective risk tolerance; no objective threshold.  

  **Final Output**: Written report with step-by-step results, termination rationale, and human escalation logic (if applicable). Safety lead uses this to defensibly approve routing.
