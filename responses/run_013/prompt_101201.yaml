  ### **Decision Tree: Interpreting Nāgārjuna’s Tetralemma and Emptiness**

  **Start**: You encounter the tetralemma applied to a claim like “Things have intrinsic nature.” All four corners are rejected.  
  **Commitments assumed**:  
  - The tetralemma has four corners (true, false, both, neither).  
  - Emptiness means “no independent intrinsic nature; all things dependently arisen.”  

  ---

  #### **1. When rejecting all four corners, is the rejection about the *answers* or the *question itself*?**
  - **A: It rejects each answer (distributive: all corners are false).** → Go to 2.  
  - **B: It rejects the whole question (collective: the framework is ill-posed).** → Go to 6.  

  ---

  #### **2. [From A] Can a conventional truth (e.g., “fire is hot”) be false in ordinary usage?**
  - **A: Yes—conventions are useful fictions, not truths.** → Go to 3.  
  - **B: No—conventions are a kind of truth, just not ultimate.** → Go to 4.  
  - **C: It depends—truth is whatever we agree on, not fixed.** → Go to 5.  

  #### **3. [From 2A] Does the tetralemma describe reality with non-classical logic?**
  - **A: Yes—some contradictions (e.g., “emptiness exists and doesn’t”) are true.**  
    → **Leaf: Paraconsistent/Dialetheic Reading**  
    - *Description*: The tetralemma assigns non-classical truth values (e.g., true contradictions) to reveal reality’s inconsistent nature. Emptiness is a property things lack (intrinsic nature), but this lack is itself contradictory. Conventional truth is a useful fiction. The point is to produce knowledge of reality’s true structure.  
    - *Most awkward commitment*: Emptiness must be both true and false simultaneously, violating intuitive logic.  
  - **B: No—the tetralemma only exposes conceptual errors.**  
    → **Leaf: Semantic Reading**  
    - *Description*: The tetralemma shows all corners fail because they presuppose intrinsic nature (which doesn’t exist). Emptiness is a second-order claim: concepts never refer to independent things. Conventional truth is what we agree on. The point is to remove confusion by revealing linguistic presuppositions.  
    - *Most awkward commitment*: If all concepts fail, the semantic reading itself cannot be stated without presupposing intrinsic meaning.  

  #### **4. [From 2B] Is emptiness itself empty in the *same* way as other things?**
  - **A: Yes—emptiness is empty identically, not exceptionally.**  
    → **Leaf: Two-Truths Reading**  
    - *Description*: The tetralemma applies to ultimate truths (all corners false), while conventional truths (e.g., causality) are a separate kind of truth. Emptiness is a property things lack, but this lack is relationally defined. The point is to produce knowledge of two distinct realities. Emptiness is empty, making the view self-correcting (no fixed “ultimate”).  
    - *Most awkward commitment*: Conventional truth risks being seen as “less real,” undermining everyday validity.  
  - **B: No—emptiness is uniquely real (not empty).**  
    → **Leaf: Coherent but Unattractive Position: Foundational Emptiness**  
    - *Description*: Emptiness is an intrinsic property (the lack of nature) that grounds all else. The tetralemma’s distributive rejection clears false views to reveal this. Conventional truth is a useful fiction. The point is to produce knowledge of emptiness as the sole truth.  
    - *Most awkward commitment*: Emptiness must be non-empty to avoid infinite regress, contradicting universal emptiness.  
    - *Why unattractive*: Nāgārjuna explicitly rejects treating emptiness as intrinsic.  

  #### **5. [From 2C] Is the tetralemma’s goal to end all metaphysical questioning?**
  - **A: Yes—it halts questions to prevent confusion.**  
    → **Leaf: Deflationary/Pragmatic Reading**  
    - *Description*: The tetralemma is a rhetorical tool recommending we stop asking questions about intrinsic nature. Emptiness is a second-order claim: our language cannot capture reality. Conventional truth is whatever we agree on. The point is to end unanswerable debates for practical peace.  
    - *Most awkward commitment*: If two people agree conventionally but disagree on emptiness, there is no fact of the matter—risking relativism.  
  - **B: No—it points to a truth beyond questions.** → Go to 8 (Leaf E).  

  ---

  #### **6. [From B] Does the tetralemma apply to itself? (e.g., “Is the tetralemma valid?”)**
  - **A: Yes—and it rejects itself too.** → Go to 7.  
  - **B: No—it only applies to metaphysical claims.** → Go to 8.  

  #### **7. [From 6A] If the tetralemma cancels itself, what replaces it?**
  - **A: A non-conceptual state (e.g., enlightenment).**  
    → **Leaf: Mystical/Ineffability Reading**  
    - *Description*: The tetralemma is a therapeutic device pointing beyond language to ineffable reality. Emptiness is a lack we experience, not describe. Conventional truth is a useful fiction. The point is to remove craving for answers and induce direct insight. Emptiness is empty, making the view self-annulling.  
    - *Most awkward commitment*: Ineffability cannot be expressed, so the reading is self-silencing.  
  - **B: Nothing—questioning just stops.**  
    → **Leaf: Quietist/Therapeutic Reading**  
    - *Description*: The tetralemma is a practice to dismantle views without asserting anything. Emptiness is not a property, relation, or thesis—it’s the absence of reification. Conventional truth is merely what we agree on. The point is to cure confusion, not produce knowledge.  
    - *Most awkward commitment*: If therapy requires no truth, it cannot be “wrong”—even if misapplied.  

  #### **8. [From 6B or 5B] Is emptiness a feature of reality or our concepts?**
  - **A: Reality—but we can only point to it indirectly.** → **Leaf E: Mystical/Ineffability Reading** (as above).  
  - **B: Our concepts—emptiness is about language.** → **Leaf: Semantic Reading** (as in 3B).  

