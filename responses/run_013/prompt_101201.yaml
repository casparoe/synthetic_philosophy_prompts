    - “Conventional truth as useful fiction” + “collective rejection” is unattractive. If the tetralemma is ill-posed, conventions can’t be “fictions” without presupposing a truth/falsehood distinction.  
  - **Coherent but empty branches**: None—all paths lead to a leaf.  

