  ### **Notes on the Tree**
  - **Flagged indistinct pair**: The *Quietist/Therapeutic* and *Deflationary/Pragmatic* readings are hard to separate. Both reject metaphysics as useless, but Quietism refuses *all* theses, while Deflationism allows pragmatic conventions. The tree splits them at Q5 (ending questions vs. pointing beyond), but they overlap in practice.  
  - **Unexplored combinations**:  
