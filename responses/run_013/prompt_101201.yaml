  Below is a decision tree structured to navigate the logical space of interpretations for Nāgārjuna's tetralemma and emptiness. It uses your specified distinctions and concrete cases, starting from minimal commitments. Each branch node is a question answerable without prior knowledge of the positions. Leaves describe positions (in original terms) and note their most awkward commitments. The tree includes all requested positions and one coherent but unattractive view.

