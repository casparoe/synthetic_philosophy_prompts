  Therefore, the argument fails at step (3) for some chains (if we are in a class theory) because the union of a proper class chain is not a set. And in set theory (ZF), we cannot even form the chain as an object (because chains must be sets) and we cannot form the union of a proper class.

  But note: the argument says "every chain in P" and in step (3) it claims that the union is a set. But without restricting to chains that are sets, we cannot form the union as a set.

