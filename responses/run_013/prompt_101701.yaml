prompt: |-
  Before I settle on any verdict about whether destroying a habitat is on balance good or bad for the wild animals that live in it, I want the specification first: what must a theory of ecosystem-level welfare be able to do in order to count as adequate? Write me the desiderata — the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse, and the empirical results it must not contradict — with the consideration behind each requirement. Treat the following as raw material to be sorted into genuine requirements and mere prejudices of one camp, and add anything the list omits.

  1. Aggregation across dissimilar lives. The individuals to be summed differ by orders of magnitude in number, lifespan, and welfare level. Many species are r-strategists: enormous numbers of offspring, the great majority of which die young, frequently by starvation or predation. Others are K-strategists: few individuals, long lives, extended parental care. The theory must say how to aggregate across these, and whether a life that is short and ends badly is a benefit to be counted or a cost to be booked.

  2. Endogenous populations. Destroying a habitat does not merely alter the welfare of a fixed set of animals; it changes how many animals there are and of which kinds. The comparison is therefore between two different populations rather than two states of one population, and the theory must specify the baseline against which the comparison is made — the individuals now alive, the individuals that would otherwise have come to exist, or some rate per unit of habitat.

  3. Totals versus averages. Maximizing total welfare and maximizing average welfare yield opposite recommendations here, since the very interventions that multiply lives may lower the average quality of those lives. The theory must choose between them, or argue that the distinction lapses in this setting.

  4. Death versus suffering. It must say whether death is itself a harm to the animal that dies, or whether only the suffering contained within a life counts, and how the two are weighed when a habitat change reduces suffering while raising mortality, or the reverse.

  5. Non-naturalism. It must not treat a state as better simply because it is undisturbed or natural.

  6. Determinacy and action-guidance. It must be usable to rank actual interventions, which requires it to return verdicts under the severe uncertainty that attaches to wild-animal welfare.

  7. Empirical fidelity. It must be consistent with the broad facts of wild population biology — high juvenile mortality, predation as a principal cause of death, the dependence of population size on habitat — and it must not require the welfare of a population to be read off from anything we could not in principle measure.

  Two things I want most from you. First, flag any subset of these requirements that cannot be jointly satisfied, and explain the conflict; if the list turns out to be internally inconsistent, that is itself the result I am after. Second, identify the single requirement that does the most work in excluding candidate theories, and say what it excludes. I do not need a scorecard of named positions — keep the weight on the criteria and on the cases that motivate them.
reasoning: |-
  Okay, the user is asking for a set of criteria to evaluate theories about whether destroying a habitat is good or bad for wild animals. They want desiderata—specific requirements that such a theory must meet. They've provided seven points as raw material and want me to sort them into genuine requirements versus mere prejudices. They also want me to flag any conflicts between requirements and identify which requirement is most restrictive.

  First, I need to understand their scenario. They're likely an ethicist, environmental philosopher, or someone involved in conservation policy. Their explicit need is a framework to assess ecosystem welfare theories. But deeper, they might be grappling with moral dilemmas in conservation—like whether human intervention (even habitat destruction) could reduce wild animal suffering. They mentioned "non-naturalism," hinting they reject appeals to nature fallacies. So their unspoken need might be grounding decisions in measurable welfare, not tradition.

  Now, analyzing their seven points:  
  1. Aggregation across dissimilar lives—how to sum welfare when species have different lifespans and suffering levels. This seems essential because real ecosystems mix r/K-strategists.  
  2. Endogenous populations—habitat changes alter animal numbers and types. Vital since you're comparing dynamic populations, not fixed groups.  
  3. Totals vs. averages—conflicting goals: more lives vs. better lives. A core tension in utilitarianism.  
  4. Death vs. suffering—is death inherently bad or just suffering mattering? Key for ethics.  
  5. Non-naturalism—rejecting "natural=good." Important to avoid bias.  
  6. Determinacy—must give actionable advice despite uncertainty. Practical for real decisions.  
  7. Empirical fidelity—must align with biology and be measurable. Ensures scientific plausibility.  

  Sorting into requirements vs. prejudices:  
  All points seem like genuine requirements except possibly #5 (non-naturalism). But #5 is valid—it prevents circular reasoning, so it's necessary. No prejudices here; all are substantive.  

  Conflicts:  
  - Biggest clash is between #2 (endogenous populations) and #6 (determinacy). #2 insists on counterfactual comparisons of potential populations, which under uncertainty (#6) becomes speculative. Example: Predicting how many animals "would exist" if a habitat isn’t destroyed is guesswork. So these conflict—high determinacy needs simplification, but #2 demands complexity.  
  - Also, #3 (totals vs. averages) forces a choice that could contradict intuitive outcomes. E.g., if totals favor habitat destruction (more lives, lower average), it might feel counterintuitive.  

  Most restrictive requirement:  
  #2 (endogenous populations). It excludes theories that ignore population dynamics—like those only counting current animals. Classic welfarism fails here; it can’t handle potential beings. This requirement forces theories to model counterfactuals, which is theoretically and empirically demanding.  

  Adding missing desiderata:  
  - **Scale-invariance**: Should work for small/large habitats.  
  - **Sensitivity to ecosystem services**: Habitat loss might indirectly affect welfare (e.g., pollination collapse).  
  - **Time dynamics**: Welfare impacts over time (short-term suffering vs. long-term extinction).  
  - **Non-speciesism**: Weighting welfare equally across species.  

  In conclusion:  
  The framework must balance these, but #2 and #6 create tension. The user’s deeper need? Probably a practical, non-arbitrary way to judge habitat interventions—avoiding both romanticizing nature and ignoring suffering. Highlighting conflicts helps them see why this is philosophically thorny.
answer: |-
  Below is a systematic analysis of your query, organized into: (1) **genuine desiderata** for an adequate theory of ecosystem-level welfare, (2) **conflicts between desiderata**, (3) the **most exclusionary requirement**, and (4) **omissions** from your list. I treat your seven points as raw material, categorizing each as a requirement or prejudice, and provide the underlying rationale for each. The focus is on conceptual rigor, empirical adequacy, and action-guidance—not on cataloging existing theories.

  ---

  ### **I. Genuine Desiderata for an Adequate Theory**  
  *(Sorted from your list, with rationale and classification)*  

  1. **Aggregation Across Dissimilar Lives**  
     - **Requirement? Genuine.**  
     - **Rationale:** Ecosystems contain organisms with vastly different life histories (e.g., r-strategists like insects vs. K-strategists like elephants). A theory must specify how to weigh short, suffering-intensive lives against longer, higher-welfare lives. Failure here collapses morally relevant distinctions (e.g., ignores whether a high-mortality life is net negative).  
     - **Motivating Case:** Is replacing a forest (high r-strategist mortality) with a grassland (fewer K-strategists) a net welfare gain? The theory must compare incommensurable lives without arbitrariness.

  2. **Endogenous Populations**  
     - **Requirement? Genuine.**  
     - **Rationale:** Habitat destruction alters carrying capacity, species composition, and population dynamics. Comparing fixed populations is empirically false; the baseline must account for counterfactual populations (e.g., "future animals that would have existed").  
     - **Motivating Case:** Draining a wetland eliminates mosquitoes (high suffering) but also removes food for birds (reducing future bird populations). The theory must handle shifts in population size/structure and define the baseline (e.g., per-unit-area welfare rates vs. total future beings).

  3. **Totals vs. Averages**  
     - **Requirement? Genuine.**  
     - **Rationale:** Total welfare (summed across all individuals) and average welfare (per individual) conflict when habitat changes affect population size. A theory must resolve this—e.g., by justifying one approach, rejecting the dichotomy, or introducing a hybrid (e.g., "critical-level utilitarianism").  
     - **Motivating Case:** Creating a reservoir increases fish populations (higher total welfare) but with shorter, competitive lives (lower average welfare). The theory must not ambiguously switch metrics to suit intuitions.

  4. **Death vs. Suffering**  
     - **Requirement? Genuine.**  
     - **Rationale:** Death (especially premature) and suffering (e.g., predation, starvation) pose distinct ethical challenges. A theory must define whether death is intrinsically harmful, how it compares to suffering, and how to trade them off (e.g., if habitat loss reduces suffering but increases mortality).  
     - **Motivating Case:** Culling predators may reduce prey suffering but increase prey populations, leading to more starvation deaths. The theory must weigh these without conflating them.

  5. **Non-Naturalism**  
     - **Requirement? Genuine.**  
     - **Rationale:** "Natural" states often involve extreme suffering (e.g., parasitism, infant mortality). A theory must not assume undisturbed/natural = better, as this is a prejudice masking empirical realities. Welfare assessments should be nature-neutral.  
     - **Motivating Case:** A "pristine" wilderness with 90% juvenile mortality may be worse than a managed habitat. The theory must avoid romanticizing nature.

  6. **Determinacy and Action-Guidance**  
     - **Requirement? Genuine.**  
     - **Rationale:** Theories must deliver actionable verdicts despite uncertainty (e.g., unknown species interactions, welfare ranges). Vague or speculative theories are useless for real decisions.  
     - **Motivating Case:** Under data scarcity (e.g., unknown insect sentience), can the theory still guide whether to clear a forest? It must provide decision rules (e.g., precautionary principles) without requiring impossible precision.

  7. **Empirical Fidelity**  
     - **Requirement? Genuine.**  
     - **Rationale:** The theory must align with ecology: high juvenile mortality, density-dependent regulation, predation as a major cause of death. It must also be measurable in principle (e.g., not reliant on unobservable properties like "natural harmony").  
     - **Motivating Case:** If a theory claims predation is always net welfare-positive without empirical support, it fails. It must ground claims in population biology.

  **Verdict:** All seven points are **genuine requirements**. None are mere prejudices, as each addresses a core challenge in ecosystem welfare (e.g., aggregation, dynamism, empiricism). #5 (non-naturalism) is essential to avoid bias, not a "camp" position.

  ---

  ### **II. Conflicts Between Desiderata**  
  Two pairs of desiderata are in **fundamental tension**, risking inconsistency:  

  #### **A. Conflict: Endogenous Populations (EP) vs. Determinacy (DG)**  
  - **Nature of Conflict:** EP requires comparing counterfactual populations (e.g., "future animals that would exist if the habitat persists"). DG demands tractable decisions under uncertainty. But predicting future populations/suffering is highly speculative (e.g., unknown extinction cascades, climate effects).  
  - **Consequence:** Theories satisfying EP become computationally intractable or arbitrary (e.g., ad-hoc baselines), violating DG. Conversely, theories prioritizing DG (e.g., focusing only on observable current animals) fail EP by ignoring population dynamics.  
  - **Example:** Assessing a dam's impact requires modeling future fish/insect populations across decades—a task fraught with uncertainty, making action-guidance impossible without oversimplification.  

  #### **B. Conflict: Aggregation (AG) vs. Empirical Fidelity (EF)**  
  - **Nature of Conflict:** AG requires weighing lives across taxa (e.g., one mammal vs. 10,000 insects). EF demands measurable welfare. But welfare metrics (e.g., sentience, valence) are unmeasurable for most species, forcing subjective assumptions that contradict EF.  
  - **Consequence:** To satisfy AG, theories must make untestable claims (e.g., "a mayfly’s suffering is 1/1000 of a deer’s"), violating EF. Strict EF limits aggregation to comparable species, failing AG.  

  **Result:** No theory can fully satisfy all desiderata simultaneously. EP vs. DG is the sharpest conflict—resolving it may require compromising on precision (DG) or realism (EP).

  ---

  ### **III. Most Exclusionary Requirement**  
  **Endogenous Populations (EP)** is the **strongest filter**, ruling out the widest range of candidate theories:  
  - **What it excludes:**  
    - **Fixed-population theories:** Approaches comparing welfare only among currently living animals (e.g., "harm to existing individuals"). These fail because habitat destruction prevents future births, altering population size/composition.  
    - **Static baselines:** Theories using simplistic counterfactuals (e.g., "compare to the habitat’s current state") ignore that ecosystems are dynamic systems.  
  - **Why it’s decisive:** EP forces theories to confront the *demographic consequences* of interventions. For example, if destroying a habitat prevents millions of future short, miserable lives (e.g., mosquitoes in a swamp), a theory must account for this. Those that cannot are inadequate for real-world decisions.  
  - **Exclusionary Power:** EP eliminates all theories that treat ecosystems as static or welfare as separable from population ecology—which includes most traditional animal ethics frameworks (e.g., rights-based approaches).

  ---

  ### **IV. Omitted Desiderata**  
  Your list lacks three critical requirements:  

  8. **Scale-Invariance**  
     - **Requirement:** The theory must apply consistently across spatial/temporal scales (e.g., a pond vs. a continent; immediate vs. generational effects).  
     - **Rationale:** Interventions have ripple effects (e.g., fragmenting a forest alters regional biodiversity). Without scale-invariance, verdicts become arbitrary.  

  9. **Sensitivity to Indirect Effects**  
     - **Requirement:** It must account for knock-on impacts (e.g., destroying a pollinator habitat reduces plant diversity, affecting herbivore welfare).  
     - **Rationale:** Ecosystems are interconnected. Ignoring indirect effects (e.g., trophic cascades) risks perverse outcomes.  

  10. **Non-Speciesism**  
      - **Requirement:** Welfare weights must not arbitrarily prioritize charismatic species (e.g., mammals over insects).  
      - **Rationale:** Empirical fidelity (#7) demands this—most animals are invertebrates, and their welfare could dominate aggregates.  

  ---

  ### **Summary**  
  - **Genuine Requirements:** All seven points are essential; no prejudices identified.  
  - **Key Conflict:** *Endogenous Populations* vs. *Determinacy* creates a trade-off between realism and usability.  
  - **Most Exclusionary:** *Endogenous Populations* disqualifies theories ignoring population dynamics.  
  - **Additions:** Scale-invariance, indirect effects, and non-speciesism are necessary for completeness.  

  This framework ensures a theory avoids bias, respects ecology, and guides decisions—but inherent tensions (especially EP vs. DG) imply that any adequate theory will involve trade-offs or novel innovations (e.g., stochastic baselines).
