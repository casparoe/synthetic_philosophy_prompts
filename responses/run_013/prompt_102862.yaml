answer: |-
  ## Consequentialism & Cluelessness: A Decision Tree

  **Start:** You accept that the rightness of an action (or something) depends *only* on its consequences.

  ---

  **1. What is the primary 'thing' being judged for rightness?**
      *   **A. A single act.** → Go to 2
      *   **B. A rule, disposition, or type of act.** → Go to 7
      *   **C. The whole pattern of choices over a life or project.** → Go to 10

  ---

  **Branch for A (Single Act):**

  **2. Is consequentialism primarily a...**
      *   **A. Criterion of Rightness (what makes an act right) *and* a Decision Procedure (how to decide)?** → Go to 3
      *   **B. Criterion of Rightness only?** → Go to 4

  **3. Given cluelessness (long-run consequences unknown), how should we actually decide what to do?**
      *   **A. Use expected value based on our best credences.** → Go to 5
      *   **B. Follow robust, simple heuristics (e.g., help nearby, follow rules).** → **Rule-of-Thumb Consequentialism.** *Awkward: Admits chosen acts often aren't actually right.*
      *   **C. Aim for "good enough" consequences based on foreseeable effects.** → **Satisficing Consequentialism.** *Awkward: Why "good enough" if only total consequences matter?*

  **4. What does cluelessness mean for knowing the actual consequences?**
      *   **A. We don't know the *actual* outcome, but we *can* assign meaningful probabilities/credences.** → Go to 5
      *   **B. We genuinely have *no* basis for assigning probabilities to vast swathes of long-term effects.** → Go to 6

  **5. What is the standard for rightness/choice?**
      *   **A. Maximize expected value (EV).** → Go to 11
      *   **B. Something else (e.g., maximize minimum gain, avoid catastrophe).** → **Robust/Non-EV Maximization.** *Awkward: Hard to justify not maximizing EV if it's the criterion.*

  **6. Are the unknown, very long-term effects likely to...**
      *   **A. Roughly cancel out or be negligible across options?** → **Restricted Scope Consequentialism (Near-Term).** *Awkward: Assumes unknowable long-term effects are benign.*
      *   **B. Be systematically tilted (e.g., towards bad, good, or hugely variable)?** → **Effective Altruism-esque Longtermism / Strong Long-Term Tilt View.** *Awkward: Requires acting on speculative long-term models despite cluelessness.*

  **11. How do you view the implication: "A one-in-a-gogol chance of astronomically huge good outweighs any certain small harm"?**
      *   **A. This is a reductio ad absurdum; it shows EV maximization is flawed here.** → **Moderate Actualism / Non-Fanatical EV.** *Awkward: Must explain why EV calculation fails only for extremes.*
      *   **B. This is correct; I'll bite the bullet.** → **Fanatical EV Maximization / Pure Actualism.** *Awkward: Commits to spending vast resources on minuscule chances of huge payoffs.*

  ---

  **Branch for B (Rule/Disposition):**

  **7. What does cluelessness mean for judging rules?**
      *   **A. We can estimate the expected consequences of widespread compliance with the rule.** → **Rule Consequentialism (Standard).** *Awkward: Picks rules ignoring whether *this* act under the rule has good consequences.*
      *   **B. Cluelessness means we can't reliably estimate even rule-compliance consequences long-term.** → Go to 8

  **8. How should we choose rules?**
      *   **A. Choose rules with robustly good foreseeable consequences, ignoring deep cluelessness.** → **Robust Rule Consequentialism.** *Awkward: Ignores potential catastrophic long-term rule effects.*
      *   **B. Choose rules promoting traits resilient to cluelessness (prudence, flexibility).** → **Virtue-Oriented Rule Consequentialism.** *Awkward: Indirect link from virtue to actual consequences.*

  ---

  **Branch for C (Life Pattern):**

  **10. How does cluelessness affect judging a life?**
      *   **A. We focus on the pattern's foreseeable consequences or inherent virtues it expresses.** → **Objective-List or Virtue-Focused Consequentialism.** *Awkward: May downplay actual total consequences.*
      *   **B. Deep cluelessness remains paralyzing even at this level.** → **Unnamed (Life-Pattern Paralysis).** *Awkward: Offers no practical guidance.*

  ---

  **Notes on the Tree:**

  *   **Unseparated Views:** The tree *does* separate "Use expected value" (3A/5A) and "Follow robust heuristics" (3B). However, someone might hold that EV is the *criterion* (4A/5A) but that robust heuristics are the best *decision procedure* due to cluelessness/limits (implied by 3B). The tree forces a choice at 2/3, potentially masking this *hybrid* view (Criterion EV + Heuristic Procedure), which is common.
  *   **Unoccupied/Incoherent Combinations:**
      *   **4B (No Probabilities) + 5A (Maximize EV):** Incoherent. Can't maximize EV without probabilities.
      *   **6A (Effects Cancel) + Strong Longtermism Leaning (B under 6):** Incoherent. 6A assumes no systematic tilt, 6B asserts one.
      *   **3A (Use EV in DP) + 11A (Reject Fanaticism):** Unattractive/Unexplored? Using EV as DP but rejecting its extreme implications is unstable.
      *   **7B (Rule Cluelessness) + Insistence on Precise Calculation:** Incoherent. 7B denies the basis for calculation.
  *   **Reasons for Gaps:** Incoherent combinations (like 4B+5A) are logically impossible. Combinations like 3A+11A might be *unstable* or *unattractive* (why use the tool if you reject its clear outputs?). Others (like hybrid criterion/procedure views) are *unexplored* by the tree's forced choices.

  **Bottom line:** Cluelessness forces consequentialists to refine their view, typically by narrowing the scope of consequences considered, changing the standard from actual to expected value or robustness, altering the object of evaluation, or biting extreme bullets.
