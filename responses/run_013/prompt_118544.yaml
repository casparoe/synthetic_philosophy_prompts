prompt: |-
  I am the methods officer for a state environmental and public-health agency. Our advisory committees must commit, for each decision, to a single quantitative model; we cannot publish a decision as "somewhere between the models." Twice a month a committee faces rival models that fit the same body of evidence about equally well but disagree about the decision-relevant quantity, and the members have no training in the philosophy of science, so they settle it by seniority. I need a standing decision procedure I can hand them as a one-page annex, built on what the underdetermination literature actually establishes and honest about what it does not.

  The procedure should run in order, say what counts as an adequate answer at each step, and keep these distinctions alive: underdetermination that more data would dissolve versus one that any feasible study would leave standing; rivals that are equivalent in general versus rivals that are equivalent only with respect to the quantity we have to decide; and the holism problem that any model can be rescued by adjusting its auxiliaries, so "the evidence favors X" is always relative to a package someone chose. At each step it must mark whether that step is evidential or a judgment the committee is making -- how much to hedge, which error is worse -- and say who has to sign off when it is a judgment.

  Then run it on two cases: two transmission models of the same respiratory outbreak that fit the same case data but disagree about the benefit of closing schools; and two dose-response models behind a contaminant limit, one with a threshold and one without, where I suspect the procedure will tell us we cannot defend the stricter limit on evidential grounds alone. Close by telling me where the procedure will misfire and what it cannot decide. Separate what is settled in this literature from what is genuinely contested, and do not present a contested view as the consensus.
reasoning: |-
  We are designing a decision procedure for advisory committees to choose between rival models when they are underdetermined by the evidence. The procedure must be one page and address the distinctions required. We'll break it down step by step, marking each step as evidential or judgmental and specifying who must sign off on judgments.

  **Standing Decision Procedure for Model Selection Under Evidential Equivalence**

  **Step 1: Assess Evidential Equivalence (Evidential)**
     - Check if the rival models fit the available evidence equally well using pre-agreed statistical criteria (e.g., AIC, BIC, cross-validation, goodness-of-fit tests). If not, the model with better fit is chosen and the procedure stops.
     - *Adequate Answer*: Quantitative assessment showing that the difference in fit is negligible (e.g., ΔAIC < 2) or that the models are statistically indistinguishable.
     - *If not equivalent*: Choose the better-fitting model. Stop.
     - *If equivalent*: Proceed to Step 2.

  **Step 2: Check for Resolvability by Feasible Data Collection (Judgmental)**
     - Determine whether collecting additional feasible data within the decision timeline would likely break the equivalence. Consider:
       a. Are there ongoing studies or readily available data that could be analyzed?
       b. Would the cost and time of collecting new data be acceptable?
     - *Adequate Answer*: A clear yes or no, with justification. If yes, delay the decision and collect the data. If no, proceed to Step 3.
     - *Sign-off*: Committee chair, with input from data collection team.

  **Step 3: Distinguish Global vs. Local Underdetermination (Evidential)**
     - Assess whether the models are equivalent only for the decision-relevant quantity (local underdetermination) or for all quantities (global underdetermination). This is done by:
       a. Testing the models on other output quantities for which data exists (if available).
       b. If the models disagree on the decision quantity but agree on others, then it's local. If they disagree on multiple quantities, then it's global.
     - *Adequate Answer*: Evidence of agreement or disagreement on other quantities. If the underdetermination is only local (i.e., the models are equivalent for the decision quantity but not in general), proceed to Step 4. If global (equivalent in general), proceed to Step 5.

  **Step 4: Local Underdetermination: Examine Auxiliary Assumptions (Evidential/Judgmental)**
     - For local underdetermination, the disagreement arises from auxiliary assumptions (e.g., functional form, parameter restrictions). Evaluate these assumptions:
       a. Are the auxiliary assumptions independently supported by evidence? (Evidential)
       b. If not, which set of assumptions is more plausible given domain knowledge? (Judgmental)
     - *Adequate Answer*: If one set of auxiliary assumptions is better supported, choose the model with those. If not, proceed to Step 5.
     - *Sign-off for judgment*: Entire committee.

  **Step 5: Global Underdetermination or Unresolved Local: Decision-Theoretic Hedge (Judgmental)**
     - Since the evidence alone cannot break the tie, the committee must make a judgment call based on:
       a. The consequences of being wrong: Which model being wrong would have worse societal, health, or environmental impacts?
       b. Precautionary principle: In the face of uncertainty, which decision minimizes the risk of severe harm?
       c. Robustness: Can a decision be framed that is acceptable under both models? (e.g., a compromise or a hedging strategy)
     - *Adequate Answer*: A clear justification for the chosen model or a robust decision that works under both.
     - *Sign-off*: Entire committee and the agency director.

  **Step 6: Record and Report (Procedural)**
     - Document the steps taken, the evidence considered, and the judgments made. Transparency is key.

  ---

  **Application to Case 1: Two Transmission Models for School Closures**

  - **Step 1**: Both models fit the case data equally well (ΔAIC < 2). Proceed to Step 2.
  - **Step 2**: No feasible data collection within the outbreak timeline (2 weeks). Proceed to Step 3.
  - **Step 3**: The models agree on total cases and hospitalizations (other quantities) but disagree on the effect of school closures (local underdetermination). Proceed to Step 4.
  - **Step 4**: 
    - Model A assumes school closures reduce transmission by 40% (based on historical flu data). 
    - Model B assumes 20% (based on recent coronavirus studies). 
    - The committee judges that the recent coronavirus studies are more relevant (judgment). Choose Model B? But if not, proceed to Step 5.
    - *Note*: If the auxiliary assumptions (historical vs. recent) are equally plausible, then we move to Step 5.
  - **Step 5**: The consequences of being wrong: 
    - If we close schools and Model B is correct (only 20% reduction), we incur high social cost with limited benefit. 
    - If we don't close and Model A is correct (40% reduction possible), we miss a chance to reduce cases. 
    - The committee must decide which error is worse. Given the outbreak severity, they might choose to close schools as a precaution (if severity is high) or not (if severity is low). 
    - *Sign-off*: Entire committee and agency director.

  ---

  **Application to Case 2: Two Dose-Response Models (Threshold vs. Linear No-Threshold)**

  - **Step 1**: Both models fit the available data equally well (e.g., same deviance). Proceed.
  - **Step 2**: No feasible new data in the short term (long-term studies would be required). Proceed.
  - **Step 3**: The models agree on the observed range of doses but disagree at low doses (local underdetermination). Proceed to Step 4.
  - **Step 4**: 
    - The threshold model assumes a biological mechanism that allows repair below a threshold. The linear no-threshold (LNT) model assumes DNA damage is proportional to dose. 
    - Current evidence does not definitively support either mechanism. Therefore, we cannot resolve on evidence alone. Proceed to Step 5.
  - **Step 5**: 
    - Consequences: 
      - If we set a strict limit (based on LNT) and there is a threshold, we impose unnecessary economic costs. 
      - If we set a lenient limit (based on threshold) and LNT is correct, we risk excess cancers. 
    - Precautionary principle: In environmental health, the consequences of underestimating risk are severe. Therefore, a judgment to use LNT and set the stricter limit might be made. However, note that the procedure requires admitting that this is a judgment, not evidence-based. 
    - *Sign-off*: Entire committee and agency director.

  ---

  **Where the Procedure Misfires and What It Cannot Decide**

  - **Misfires**:
    - If the committee misjudges the resolvability by new data (Step 2) and forgoes feasible data that could break the tie.
    - If the distinction between local and global underdetermination (Step 3) is not clear (e.g., models may agree on some but not all other quantities).
    - If the committee is unable to reach consensus in Step 5, leading to deadlock.

  - **What it cannot decide**:
    - The procedure cannot resolve underdetermination by evidence alone when Step 5 is reached. It shifts the burden to value judgments.
    - It cannot create evidence where none exists. If the models are truly underdetermined and consequences are incommensurable, the procedure only makes the judgment explicit.

  ---

  **Settled vs. Contested in the Underdetermination Literature**

  - **Settled**:
    - Underdetermination is a real phenomenon: evidence alone cannot always pick a unique model.
    - Holism: Models come with auxiliary assumptions, and evidence tests the whole package.
    - Underdetermination can be transient (resolvable by more data) or persistent (not resolvable by feasible data).

  - **Contested**:
    - The extent to which underdetermination is widespread and unresolvable (optimists vs. pessimists).
    - Whether there are non-empirical criteria (e.g., simplicity, explanatory power) that can break ties without being arbitrary. (The procedure avoids non-empirical criteria to stay evidence-based as much as possible.)
    - How to balance epistemic and non-epistemic values in science policy (e.g., precautionary principle).

  The procedure does not take a stand on contested philosophical views but structures the decision process to be transparent about when evidence ends and judgment begins.
answer: |-
  ### Standing Decision Procedure for Model Selection Under Evidential Equivalence  
  *For use by advisory committees when rival models fit evidence equally well but yield divergent decision-critical quantities*  

  **Principles**  
  1. **Underdetermination**: Evidence alone cannot always uniquely determine a model; judgment is sometimes required.  
  2. **Holism**: Models depend on auxiliary assumptions (e.g., parameter ranges, functional forms); evidence evaluates the whole package.  
  3. **Transparency**: Document evidential vs. judgmental steps and justify choices.  

  ---

  **Procedure**  
  *Run steps in order. Stop and decide if a step resolves the conflict. Record answers at each stage.*  

  #### **Step 1: Verify Evidential Equivalence**  
  - **Task**: Quantitatively confirm that both models fit *all available evidence* (e.g., case data, dose-response curves) equally well.  
  - **Tools**: Use objective criteria (ΔAIC/BIC ≤ 2; likelihood-ratio tests; cross-validation error within 1 SE).  
  - **Adequate Answer**: "Models A and B are indistinguishable under [metric]."  
  - **Evidential/Judgmental**: Purely **evidential** (statistical tests).  
  - **If resolved**: Pick either model (document equivalence).  
  - **If unresolved**: Proceed to Step 2.  

  #### **Step 2: Assess Resolvability with Feasible Data**  
  - **Task**: Determine if collecting *feasible* new data (e.g., within 6 months, under $100k) could break equivalence.  
  - **Key Distinction**:  
    - **Transient underdetermination**: Solvable with new data (e.g., targeted lab study).  
    - **Persistent underdetermination**: Infeasible to resolve (e.g., ethical barriers, multi-year trials).  
  - **Adequate Answer**: "Equivalence is [transient/persistent] because [justification]."  
  - **Evidential/Judgmental**: **Judgmental** (requires expert estimation of data feasibility).  
  - **Sign-off**: Committee chair + data subcommittee.  
  - **If transient**: Delay decision; design study.  
  - **If persistent**: Proceed to Step 3.  

  #### **Step 3: Local vs. Global Underdetermination**  
  - **Task**: Test if models disagree *only* on the decision-critical quantity (local) or broadly (global).  
  - **Method**: Compare model outputs for 3+ *non-decision* quantities with existing data (e.g., effect on workplaces if schools close; high-dose toxicity if setting low-dose limits).  
  - **Key Distinction**:  
    - **Local**: Models agree on other outputs → conflict isolated to auxiliaries (Step 4).  
    - **Global**: Models disagree broadly → deep incompatibility (Step 5).  
  - **Adequate Answer**: "Underdetermination is [local/global] because [specific outputs tested]."  
  - **Evidential/Judgmental**: **Evidential** (data-driven comparisons).  
  - **If local**: Proceed to Step 4.  
  - **If global**: Proceed to Step 5.  

  #### **Step 4: Scrutinize Auxiliary Assumptions (Local Cases Only)**  
  - **Task**: Identify and evaluate auxiliary assumptions driving divergence in the decision-critical quantity.  
  - **Method**:  
    - List key assumptions (e.g., "linear dose-response" vs. "threshold"; "schools drive 30% of transmission" vs. "10%").  
    - Assess independent support for each (e.g., prior literature, mechanistic plausibility).  
  - **Adequate Answer**: "Assumption X in Model A is [better/worse/neither] supported by [evidence]."  
  - **Evidential/Judgmental**: **Mixed** (evidence evaluates support; judgment weighs plausibility if evidence is weak).  
  - **Sign-off**: Entire committee for judgment calls.  
  - **If resolved**: Choose model with better-supported auxiliaries.  
  - **If unresolved**: Proceed to Step 5.  

  #### **Step 5: Decision-Theoretic Hedge**  
  - **Task**: Make a value-based choice using error consequences.  
  - **Method**:  
    - Define errors (e.g., "False positive: Close schools needlessly" vs. "False negative: Fail to close, causing deaths").  
    - Apply agency guidance (e.g., "Precaution when health impacts irreversible").  
    - Consider robustness (e.g., "Can we set an interim limit?").  
  - **Adequate Answer**: "We choose Model X because [error consequence] is worse, and hedging via [action] is justified by [policy]."  
  - **Evidential/Judgmental**: Purely **judgmental** (weighing risks/ethics).  
  - **Sign-off**: Entire committee + agency director.  

  #### **Step 6: Documentation**  
  - **Task**: Archive all steps, evidence, and justifications.  
  - **Required**: "Chosen model reflects [evidence/judgment] at Step X due to [reason]."  

  ---

  ### Case Applications  

  #### **Case 1: School Closure in Respiratory Outbreak**  
  - **Rivals**: Model A (schools drive 30% transmission; closure cuts cases 40%) vs. Model B (schools drive 10%; closure cuts cases 15%).  
  - **Step 1**: Both fit case data (ΔAIC = 1.8) → **unresolved**.  
  - **Step 2**: No new data feasible before decision deadline → **persistent underdetermination**.  
  - **Step 3**: Models agree on workplace/household transmission → **local underdetermination**.  
  - **Step 4**: Auxiliary assumption "schools drive 30%" lacks direct evidence; mechanistic studies support 10–30% range → **unresolved**.  
  - **Step 5**: False negative (not closing if A is true) risks lives; false positive (closing if B is true) disrupts education. Committee invokes precaution: **choose Model A**.  
  - **Outcome**: Closure recommended. Judgment at Step 5 dominates.  

  #### **Case 2: Contaminant Limit with Threshold vs. Linear Model**  
  - **Rivals**: Threshold Model A (safe below 10 ppm) vs. Linear Model B (risk at all doses; strict limit needed).  
  - **Step 1**: Both fit high-dose data equally (p = 0.32 for difference) → **unresolved**.  
  - **Step 2**: Resolving low-dose effects requires decade-long cohort study → **persistent underdetermination**.  
  - **Step 3**: Models disagree on low-dose risk but agree on high-dose toxicity → **local underdetermination**.  
  - **Step 4**: No direct evidence for threshold; biological plausibility debated → **unresolved**.  
  - **Step 5**: False positive (strict limit if A is true) imposes economic cost; false negative (lenient limit if B is true) risks chronic disease. **No evidential basis to prefer B**; committee cannot defend stricter limit without judgment of "which error is worse."  
  - **Outcome**: If policy mandates precaution, choose Model B; else, default to status quo. **Evidence alone is insufficient**.  

  ---

  ### Limitations and Failure Modes  
  1. **Misfires**:  
     - **Step 2 misjudgment**: Committees may overestimate data feasibility, prolonging uncertainty.  
     - **Step 4 stalemate**: Auxiliaries often lack independent evidence, forcing over-reliance on judgment.  
     - **Coercion risk**: Senior members may dominate judgment steps (mitigation: blind voting at Step 5).  
  2. **Unresolvable Cases**:  
     - When models are globally underdetermined *and* consequences are incommensurable (e.g., economic vs. health tradeoffs with no agency guidance).  
     - When auxiliaries are untestable (e.g., "dark matter" in cosmology; irrelevant here).  
  3. **Cannot Address**:  
     - Models with equivalent fits but incoherent assumptions (e.g., logically inconsistent auxiliaries).  
     - Cases requiring novel science (e.g., unprecedented pathogens).  

  ---

  ### What the Underdetermination Literature Establishes vs. Contests  
  | **Settled** | **Genuinely Contested** |  
  |-------------|-------------------------|  
  | • Underdetermination exists: evidence cannot uniquely specify models. | • **Frequency**: Is underdetermination "rare" (Laudan) or "ubiquitous" (Duhem-Quine)? |  
  | • Holism: Auxiliary assumptions are part of model testing. | • **Tie-breaking criteria**: Can simplicity/explanatory power objectively resolve ties? |  
  | • Transient vs. persistent underdetermination is distinguishable. | • **Value judgments**: Should non-epistemic values (e.g., ethics) influence model choice? |  
  | • Local underdetermination is common in policy-relevant models. | • **Demarcation**: Where does "evidence" end and "judgment" begin? |  

  **Consensus Summary**: Evidence alone is sometimes insufficient; judgment is unavoidable in persistent/local cases. The procedure makes this explicit, separating evidence from values. Contested claims (e.g., "simplicity breaks ties") are excluded to avoid bias.  

  ---  
  **Approved by**: [Your Name], Methods Officer  
  **Date**: [Date]  
  *Distribute with committee charter; revise annually.*
