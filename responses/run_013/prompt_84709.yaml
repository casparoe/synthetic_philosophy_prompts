  ### Procedure Applied to Files  
  **File 1: Objects from 1890s Punitive Military Expedition**  
  - **Claimants:** Successor state’s commission; historic royal court (disagree on destination).  
  - **Intake facts:** Taken during military action; no consent from source community.  
  - **Procedure:**  
    1. Ground: A (wrongful taking – military looting).  
    2. Wrongful taking established (coercive removal).  
    3. Competing claimants: Royal court has stronger cultural ties (e.g., ritual use); state’s claim is bureaucratic.  
    4. Value judgement: Royal court sustains living practice (Commitment 2).  
    5. Outcome: Return to royal court.  
  - **Value judgement point:** Step 4 (resolving competing claims).  

  **File 2: Architectural Sculptures from Monument**  
  - **Claimant:** Successor state (ensemble integrity).  
  - **Intake facts:** Removed with colonial-era permission; legally acquired by museum.  
  - **Procedure:**  
    1. Ground: C (ensemble integrity).  
    2. Ensemble established (object part of a whole; division diminishes meaning).  
    3. No wrongful taking, but significance relies on unity.  
    4. Non-return options: Joint title or shared custody considered, but claimant wants reunification.  
    5. Value judgement: Physical return is the only solution to sustain relation (Commitment 2); public access (Commitment 3) is secondary.  
    6. Outcome: Return to claimant state.  
  - **Value judgement point:** Step 7 (rejecting non-return options as avoidance).  

  **File 3: Sacred Object with Access Restrictions**  
  - **Claimant:** Community of origin.  
  - **Intake facts:** Object sacred; public display violates norms; community demands return and restricted access.  
  - **Procedure:**  
    1. Ground: D (restriction of access).  
    2. Sacred status and restrictions verified.  
    3. Non-return options (e.g., loan-back) rejected; public display contradicts norms.  
    4. Value judgement: Living practice (Commitment 2) overrides public access (Commitment 3).  
    5. Outcome: Return to community.  
  - **Value judgement point:** Step 7 (prioritizing Commitment 2 over 3).  

  ### Case with Undesired Outcome  
  - **File 2 outcome:** Return recommended. This contradicts your instinct (to decline) because the procedure prioritizes ensemble integrity (Commitment 2) over legal acquisition.  

  ### Class of Case Where Procedure Misfires  
  - **Fragmented communities with no clear successor:** When a historic community has dissolved or split into factions with equal legitimacy (e.g., due to forced displacement), the value judgement in Step 5 becomes arbitrary. The procedure may fail to identify a recipient or inflame disputes. Do not trust it here; seek external mediation.  

