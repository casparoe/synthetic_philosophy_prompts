prompt: |-
  I chair the restitution advisory panel of a mid-sized encyclopedic museum in a European city. We hold about a million objects; a few thousand entered the collection between 1880 and 1930 from territories under colonial administration or military occupation, or from the private collections of officials who served in them. The panel meets monthly and disposes of roughly twenty matters a year. Some arrive as claims from states, some from communities, royal houses, or diaspora organisations, some from individual descendants of donors or of the people an object was taken from; some we open ourselves when a curator finds a hole in the record and nobody is asking for anything. We get one ninety-minute slot per matter. The panel is a lawyer, two curators, a historian, and me; none of us has a background in the ethics of cultural property, and the files we read are written by claimants, so they argue. Anything that transfers title needs the trustees, and every decision is reported in the press in at least two countries.

  The council has adopted a premise I need turned into something we can actually run: for objects of the kind above, our holding is a stewardship and not an ownership, and legal title is where the inquiry ends only when the law compels it to. It has also adopted three commitments that I suspect contradict one another, and I want the procedure to expose the contradiction rather than smooth it over: a wrongful taking is not cured by the passage of time; an object's significance may lie in its relation to a living practice rather than in the object considered alone, in which case the question is where that relation can be sustained; and we remain answerable to a public that pays for the building and to donors' heirs whose future gifts we need.

  Please write the procedure: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the matter to someone else because the question is one of values rather than facts. It has to fit on two pages, plus a one-page intake sheet listing what we must establish before the procedure starts (facts, not characterisations), and be usable by a curator without a law degree. Every step should produce a line in the minutes that would survive a freedom-of-information request.

  It must handle, at minimum: sorting claims by kind — remedy for a wrong, recognition of belonging, integrity of a dismembered ensemble, restriction of access to material a community treats as sacred, and a dispute among heirs — and saying what each kind requires, including whether a claim that alleges no wrong at all can succeed on any other ground; competing claimants, including the case where a state and the community of origin want different things; who counts as the successor of a community when the taking is a hundred and thirty years old and the community's own institutions have changed, and what to do when the claimant community is itself split; whether the recipient's capacity to care for and display the object is ever a legitimate consideration, and where it is a pretext; the non-return outcomes (loan-back, joint title, shared custody, transfer of title with a continuing loan, transfer to a body other than the claimant, digital return) and when each is a real answer rather than a way of avoiding the hard one; and precedent — the trustees will ask whether returning this one means returning everything.

  Then run it on three files. First, objects taken in a punitive military expedition in the 1890s, claimed now by the successor state's national commission and separately by the historic royal court, the two disagreeing about where the objects should end up. Second, architectural sculptures removed from a monument with the permission of the then-sovereign power, bought by a private buyer and later sold to us; the claimant state does not say the removal was illegal by the standards of its time, but that the monument is a single work whose meaning the division destroys. Third, an object whose sacred or restricted character means the claimant community wants it back and wants it kept from general view, which collides with our access mission and our funders. You will recognise the first two; I have left the names out deliberately, and I do not want the public arguments rehearsed — run the procedure on the facts as I have stated them, and tell me if my statement of the facts is incomplete in a way that matters.

  For each file, give the outcome and name the point at which a value judgement rather than a fact decided it. Then give me one case where the procedure yields an answer I will not like — my instinct is that the first should be returned and the second declined — and one class of case where the procedure misfires and I should not trust it. No citations or reading lists; if you name a real case, use only ones whose broad facts are common knowledge, and do not invent dates or figures.
reasoning: |-
  We are designing a procedure for the restitution advisory panel. The procedure must fit on two pages, plus a one-page intake sheet. It must be usable by a curator without a law degree. Every step should produce a line in the minutes that would survive a FOI request.

  The council's premise: Our holding is a stewardship, not ownership. Legal title is the end only when the law compels it.

  Three commitments:
  1. A wrongful taking is not cured by the passage of time.
  2. An object's significance may lie in its relation to a living practice; then the question is where that relation can be sustained.
  3. We remain answerable to the public and to donors' heirs.

  The procedure must handle:
  - Sorting claims by kind: remedy for a wrong, recognition of belonging, integrity of a dismembered ensemble, restriction of access for sacred material, dispute among heirs.
  - What each kind requires, including whether a claim with no alleged wrong can succeed.
  - Competing claimants (state vs. community, etc.).
  - Successor of a community when the community has changed.
  - When the claimant community is split.
  - Whether the recipient's capacity to care for and display is ever legitimate, and when it's a pretext.
  - Non-return outcomes (loan-back, joint title, shared custody, transfer with continuing loan, transfer to another body, digital return) and when each is a real answer.
  - Precedent: trustees will ask if returning one means returning everything.

  Also, we must have an intake sheet (one page) listing what we must establish before starting (facts, not characterizations).

  Then we run the procedure on three files.

  After the procedure, we need:
  - For each file: outcome and the point where a value judgement decided it.
  - One case where the procedure yields an answer the chair won't like (the chair's instinct: first returned, second declined).
  - One class of case where the procedure misfires.

  Let's break this down.

  **Procedure Structure**

  The procedure should be a step-by-step flowchart or a numbered list of questions. We have 90 minutes per matter, so it must be efficient.

  **Intake Sheet (One Page)**
  This is for the curator to fill out before the panel meeting. It establishes the factual basis. It should list:

  1. **Object Identification:** Accession number, description, current location in the museum.
  2. **Provenance:**
     - Date and place of acquisition by the museum.
     - How acquired (purchase, donation, bequest, etc.).
     - Source (individual, dealer, auction, etc.).
     - Previous ownership history (as far as known): dates, locations, transactions.
     - Any known gaps in provenance.
  3. **Circumstances of Removal:**
     - Date and place of removal from original context.
     - By whom and under what circumstances (e.g., military expedition, colonial administration, private collection during colonial era).
     - Legal framework at the time of removal (if known, e.g., was it permitted by then-sovereign?).
  4. **Claimant(s):**
     - Name and type (state, community, royal house, diaspora, individual, etc.).
     - Basis of claim (e.g., descendant, successor state, cultural affiliation).
     - If community: describe the community and its current institutions.
     - Contact information.
  5. **Nature of Claim:**
     - What remedy is sought (return, loan, access restrictions, etc.).
     - Grounds: wrongful taking, belonging, ensemble integrity, sacred/restricted, heirs dispute, etc.
     - If wrongful taking, describe the wrong.
     - If sacred/restricted, describe the cultural/religious significance and restrictions.
     - If ensemble, describe the ensemble and current locations of parts.
     - If heirs dispute, describe the competing claims.
  6. **Competing Claims:** Are there multiple claimants? Describe each and their relationship.
  7. **Object Significance:**
     - To the claimant: cultural, religious, historical, etc.
     - To the museum: exhibit history, research, public interest.
     - Living practice: Is the object still used or connected to a living tradition? Where?
  8. **Current Conditions:**
     - Physical condition of the object.
     - Current display status (on view, in storage, etc.).
     - Any conservation concerns.
  9. **Previous Research:** Any prior investigations by the museum or others.

  This intake sheet is factual. The curator must provide sources (documents, references) for each fact.

  **Procedure (Two Pages)**

  The procedure is a series of questions. Each question must be answered with facts where possible, and when a value judgement is needed, it must be identified and recorded in the minutes.

  We structure the questions in order:

  1. **Establish the factual basis from the intake sheet.** (This should be reviewed and confirmed by the panel at the start.)

  2. **Classify the claim.** What is the primary ground? (Remedy for a wrong, recognition of belonging, integrity of a dismembered ensemble, restriction of access for sacred material, dispute among heirs, or other.) Note: A claim can have multiple grounds, but we need to identify the primary one for structuring the inquiry.

     - *Minutes line:* Claim classified as [type].

  3. **For each ground, the specific questions to ask:**

     - **Remedy for a wrong:**
       - Was the object taken under circumstances that constitute a wrongful taking by the standards of the time? (Consider: looting, theft, duress, unfair transaction, etc.)
       - If yes, does the passage of time cure the wrong? (Commitment 1 says no, so we proceed to remedy.)
       - *Sufficient answer:* Evidence of the circumstances of removal (e.g., military looting, forced sale). If the law at the time permitted it, but it was morally wrong, we note that but then move to the next step because our premise says stewardship not ownership and legal title isn't the end unless compelled by law.
       - *Stops with a no:* If there was no wrong by the standards of the time and no other ground, then the claim fails on this ground. But we must check other grounds.

     - **Recognition of belonging:**
       - Does the object belong to a particular community or culture in a way that is recognized today? (This is about cultural affiliation, not necessarily legal ownership.)
       - *Sufficient answer:* Evidence of cultural, religious, or historical ties that are ongoing.
       - *Stops with a no:* If no such ties are established.

     - **Integrity of a dismembered ensemble:**
       - Was the object part of a larger whole (e.g., a monument, a set) that has been dismembered?
       - Would reunification significantly enhance the meaning or value of the object and the ensemble?
       - *Sufficient answer:* Documentation of the original ensemble and current locations of parts; evidence that division destroys meaning.
       - *Stops with a no:* If the object was not part of an ensemble or if the ensemble is no longer coherent.

     - **Restriction of access for sacred material:**
       - Is the object of sacred or restricted character to a community?
       - Would public display or access violate the community's cultural or religious practices?
       - *Sufficient answer:* Evidence from the community of the sacred nature and restrictions; consistent practice.
       - *Stops with a no:* If the object is not sacred or if restrictions are not substantiated.

     - **Dispute among heirs:**
       - Are there competing claims from individuals asserting inheritance rights?
       - *Sufficient answer:* Documentation of lineage and ownership history. This may require legal resolution, but we can make a recommendation based on evidence.
       - *Stops with a no:* If no valid heir can be established.

     Note: A claim that alleges no wrong can succeed on other grounds (e.g., belonging, ensemble, sacred).

  4. **Competing claimants:**
     - If multiple claimants, what is the relationship between them? (e.g., state vs. community, factions within a community)
     - We must determine: Who is the most appropriate claimant? This may involve:
       - Who has the closest cultural ties? (Commitment 2: relation to living practice)
       - If the claim is for wrongful taking, who was wronged? (The community or the state at the time? And who now represents them?)
       - *Value judgement:* When the community is split, we must decide which faction represents the community's interests. This is tricky. We can consider: Which group is recognized by the broader community? Which group can sustain the living practice? (Commitment 2)
       - *Minutes line:* Competing claims noted; decision on appropriate claimant based on [reasons].

  5. **Successor of a community:**
     - When the community's institutions have changed, we look for continuity in cultural identity and practice.
     - We consider: Is there a current institution that represents the descendants and maintains the cultural traditions related to the object? (Commitment 2: where the relation to living practice can be sustained)
     - *Value judgement:* Deciding which group is the legitimate successor. We must rely on evidence of cultural continuity and representation.

  6. **Recipient's capacity:**
     - Is the recipient's capacity to care for and display the object a legitimate consideration?
     - *Our commitments:* Commitment 3 (public and donors) might seem to support this, but Commitment 1 and 2 are primary. We must avoid using capacity as a pretext to deny return.
     - *Procedure:* Only consider if the claimant requests non-return options (e.g., loan-back) or if there are concerns about the object's safety. But for sacred objects, the community's wishes about access might override display considerations.
     - *Value judgement:* When is capacity a legitimate factor? Only in non-return options where the object remains in the museum, or when the claimant agrees to a loan-back. Otherwise, it should not block return.

  7. **Non-return outcomes:**
     - We must consider if a non-return outcome addresses the claim:
       - **Loan-back:** If the claimant wants the object back but agrees to loan it to the museum for display. This might address Commitment 3 (public access) and the claimant's ownership.
       - **Joint title:** Shared ownership. This might work for ensemble pieces where multiple institutions hold parts.
       - **Shared custody:** Rotating display. This might work for objects with significance in multiple locations.
       - **Transfer of title with continuing loan:** The museum loses ownership but keeps the object on loan. This addresses the claimant's ownership and the museum's display.
       - **Transfer to another body:** If the claimant is not equipped to care for it, but we don't want to keep it, we transfer to a third party (e.g., another museum in the country of origin). This might be for sacred objects where the community wants it but lacks facilities, but then we must ensure the community's access.
       - **Digital return:** Creating a digital surrogate. This is only a real answer for access to information, not for the physical object's significance (e.g., for sacred objects, it doesn't help).
     - *When is it a real answer?* Only when the claimant agrees and it addresses the core of the claim. For example, for a sacred object, if the community wants it back and restricted, then digital return is not sufficient. For an ensemble, joint custody might be a real solution.

  8. **Precedent:**
     - The trustees will ask if returning one means returning everything.
     - We must note: Each case is decided on its own merits. Our procedure does not create a blanket rule. However, we should be consistent in our principles.
     - *Minutes line:* Precedent considered; decision based on specific circumstances.

  9. **Value Judgements:**
     - Whenever a question cannot be resolved by facts alone and requires weighing commitments or ethical considerations, we flag it as a value judgement and record the reasoning in the minutes.

  10. **Decision and Recommendation:**
      - After going through the questions, the panel makes a recommendation: return, non-return outcome, or reject the claim.
      - The recommendation must be based on the facts and value judgements, and it must address the three commitments.

  **Final Output:**
  - The panel produces a recommendation for the trustees, with reasons, and the minutes record each step.

  **Running the Procedure on Three Files**

  File 1: Objects taken in a punitive military expedition in the 1890s. Claimed by the successor state's national commission and separately by the historic royal court. They disagree on where the objects should go.

  File 2: Architectural sculptures removed from a monument with permission of the then-sovereign power, bought by a private buyer and later sold to us. Claimant state does not allege illegality at the time but says the monument is a single work whose meaning is destroyed by division.

  File 3: Sacred object; claimant community wants it back and kept from public view, which collides with our access mission and funders.

  Now, let's run each.

