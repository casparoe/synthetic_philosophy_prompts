  This procedure fits your constraints: fact-driven, exposes commitment conflicts, and delivers auditable minutes. It avoids smoothing contradictions by forcing value judgements into the open (e.g., Step 4, 5, 7). The intake sheet ensures factual rigor, and the three-file test shows it operates as intended.
