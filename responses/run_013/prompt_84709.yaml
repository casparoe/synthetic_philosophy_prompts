  - Step 2: Was it a wrongful taking? Yes, punitive military expedition implies looting or seizure without consent. Standards of the time: Colonial military actions often involved looting that was accepted then but is now seen as wrong. Our commitment 1: passage of time doesn't cure. So, we proceed to remedy.

  - Step 3: Competing claimants. State vs. royal court. Who is the appropriate claimant? 
