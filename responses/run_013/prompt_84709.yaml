  ### Restitution Advisory Panel Procedure  
  **Purpose:** To evaluate claims for objects acquired between 1880–1930 from colonial contexts, guided by stewardship (not ownership) and three commitments:  
  1. Wrongful taking is not cured by time.  
  2. Significance lies in relation to living practice; prioritize where that relation is sustained.  
  3. Maintain accountability to the public and donors' heirs.  

  **Procedure (90 minutes per matter):**  
  1. **Confirm intake facts (5 min)**  
     - Review the intake sheet to ensure all factual fields are complete and undisputed.  
     - *Minutes line:* Intake facts confirmed as complete. Gaps: [List any].  
     - *Stop if:* Facts are insufficient; hand back to curator for research.  

  2. **Classify the claim (10 min)**  
     - Identify primary ground:  
       - **A. Remedy for wrongful taking** (e.g., looting, duress).  
       - **B. Recognition of belonging** (cultural/affiliative ties).  
       - **C. Integrity of dismembered ensemble** (object part of a fragmented whole).  
       - **D. Restriction of access** (sacred/secret material).  
       - **E. Dispute among heirs** (competing inheritance claims).  
       - *Note:* A claim with no alleged wrong can succeed on B, C, or D.  
     - *Minutes line:* Claim classified as [ground(s)].  

  3. **Assess primary ground (20 min)**  
     - **A. Wrongful taking:**  
       - Fact: Was the removal illegal or coercive by the standards of its time?  
       - *Sufficient answer:* Evidence of violence, theft, or inequitable power dynamics (e.g., military confiscation).  
       - *Stop if:* No evidence of wrong; proceed only if another ground applies.  
     - **B. Belonging:**  
       - Fact: Is there a verified, ongoing cultural link between the object and a living community?  
       - *Sufficient answer:* Community testimony, historical records, or scholarly consensus.  
       - *Stop if:* Link is purely historical with no modern continuity.  
     - **C. Ensemble integrity:**  
       - Fact: Is the object part of a documented ensemble, and is meaning diminished by separation?  
       - *Sufficient answer:* Provenance showing original unity; expert analysis of contextual loss.  
       - *Stop if:* Ensemble is speculative or irreparably dispersed.  
     - **D. Restriction of access:**  
       - Fact: Is the object sacred/secret, and would public access violate community norms?  
       - *Sufficient answer:* Consistent community practice; religious/cultural protocols.  
       - *Stop if:* Restrictions are unsubstantiated or inconsistent.  
     - **E. Heirs dispute:**  
       - Fact: Are there valid, competing claims from direct descendants?  
       - *Sufficient answer:* Lineage documentation; wills or ownership records.  
       - *Stop if:* No heir can be verified.  
     - *Minutes line:* Ground [A–E] [met/not met] based on [evidence summary].  

  4. **Resolve competing claims (15 min)**  
     - Fact: Are there multiple claimants (e.g., state vs. community)?  
     - *Value judgement:* Who best sustains the living practice (Commitment 2)? Prioritize:  
       - Community of origin over state if cultural ties are stronger.  
       - Consensus faction if a community is split (e.g., majority-supported institution).  
     - *Handover if:* Dispute is irreconcilable (e.g., two equally valid factions); recommend mediation.  
     - *Minutes line:* Competing claimants resolved in favor of [entity] due to [reason, noting value judgement].  

  5. **Determine community succession (10 min)**  
     - Fact: How has the claimant community changed since the taking (e.g., institutions, territory)?  
     - *Value judgement:* Who is the legitimate successor? Prioritize:  
       - Continuity of cultural practice (Commitment 2).  
       - Modern entities with ancestral ties (e.g., recognized tribal councils).  
     - *Stop if:* No living successor exists; claim fails.  
     - *Minutes line:* Successor established as [entity] based on [evidence/value judgement].  

  6. **Evaluate recipient capacity (10 min)**  
     - Fact: Does the claimant lack infrastructure to preserve/display the object?  
     - *Value judgement:* Is capacity a legitimate factor?  
       - **Yes:** Only if claimant requests non-return (e.g., loan-back) or safety risks are extreme and verifiable (e.g., conflict zone).  
       - **No (pretext):** If used to undermine return for belonging, sacred, or wrongful taking claims.  
     - *Minutes line:* Capacity [accepted/rejected as factor] due to [reason/value judgement].  

  7. **Consider outcomes (15 min)**  
     - **Return:** Default for A, D, or if B/C demand physical reunification.  
     - **Non-return options (use only if claimant agrees or return is impossible):**  
       - Loan-back: For B or C when ongoing access aligns with living practice.  
       - Joint title/shared custody: For C (ensembles) or shared heritage.  
       - Transfer with continuing loan: For public accountability (Commitment 3).  
       - Transfer to a third party: Only if claimant designates it (e.g., community-nominated museum).  
       - Digital return: For informational access only; never sufficient for A, D, or C.  
     - *Value judgement:* Is the outcome a real solution?  
       - **Yes:** If it fully addresses the claim’s core (e.g., loan-back for belonging without wrong).  
       - **No (avoidance):** If it sidesteps return for wrongful taking or sacred claims.  
     - *Minutes line:* Outcome [type] recommended because [reason/value judgement].  

  8. **Address precedent (5 min)**  
     - Fact: Is this case materially identical to past/future objects?  
     - *Value judgement:* Each claim is unique; consistency in principles, not outcomes.  
     - *Minutes line:* Precedent considered; no blanket implications.  

  **Recommendation:**  
  - Unanimous or majority vote.  
  - *Minutes line:* Final recommendation: [outcome] due to [ground] and [commitment(s)].  

  **Handover:**  
  - To trustees if title transfer is advised.  
  - To legal team if law compels an outcome (e.g., unambiguous ownership).  
  - To mediators if claims are deadlocked.  

