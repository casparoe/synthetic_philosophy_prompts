  **File 3: Sacred Object**

  - Facts: Claimant community wants it back and kept from public view. Collides with museum's access mission and funders.

  - Step 1: Classify: Restriction of access for sacred material.

  - Step 2: Is it sacred? Yes, by claimant's evidence.

  - Step 3: Would public display violate practices? Yes.

  - Step 4: Non-return outcomes? The community wants it back, so non-return options (like loan-back with restrictions) might not work because the museum wants public access. Transfer to the community is the only option that respects their wishes.

