  One class of case where the procedure misfires: When there is no clear living practice or the community is completely fragmented, and we cannot determine a successor. Then, the value judgements become arbitrary.

  **Procedure Document Draft**

  Let's write the procedure concisely.

  ---

  **Restitution Advisory Panel Procedure**

  **Purpose:** To evaluate claims for restitution or other remedies for objects acquired between 1880-1930 from colonial contexts, based on stewardship (not ownership) and the council's commitments.

  **Input:** Completed intake sheet (facts only).

  **Output:** Recommendation to trustees; minutes record each step.

  **Steps:**

  1. **Review Intake Sheet (5 min)**
     - Confirm factual basis. Note any gaps.
     - *Minutes line:* Facts reviewed as per intake sheet.

  2. **Classify Claim (5 min)**
     - Primary ground: 
       - A. Remedy for wrongful taking
       - B. Recognition of belonging
       - C. Integrity of dismembered ensemble
       - D. Restriction of access (sacred/restricted)
       - E. Dispute among heirs
       - F. Other (specify)
     - *Minutes line:* Claim classified as [letter(s)].

  3. **Evaluate Grounds (30 min)**
     - For each applicable ground:
       - A. **Wrongful taking:** 
          - Was the removal wrongful by the standards of the time? (Evidence: e.g., looting, duress)
          - If yes: Proceed to remedy. Passage of time does not cure (Commitment 1).
          - If no: This ground fails.
       - B. **Belonging:**
          - Does the object have ongoing cultural ties to a community? (Evidence: e.g., cultural practices, oral history)
          - If yes: Proceed.
          - If no: This ground fails.
       - C. **Ensemble integrity:**
          - Is the object part of a dismembered whole? (Evidence: e.g., documentation of original context)
          - Would reunification restore significant meaning? (Evidence: e.g., scholarly opinion, community statement)
          - If yes: Proceed.
          - If no: This ground fails.
       - D. **Sacred/restricted:**
          - Is the object sacred or restricted? (Evidence: e.g., community testimony, consistent practice)
          - Would public access violate practices? (Evidence)
          - If yes: Proceed.
          - If no: This ground fails.
       - E. **Heirs dispute:**
          - Are there valid competing inheritance claims? (Evidence: e.g., lineage documents)
          - If yes: Proceed.
          - If no: This ground fails.
     - *Minutes line:* Ground [letter] [passed/failed] based on [brief reason].

  4. **Address Competing Claims (10 min)**
     - If multiple claimants, determine the most appropriate:
       - Consider: Cultural ties (Commitment 2: living practice), who was wronged (for A), and current representation.
       - If community split: Evaluate which faction sustains the living practice or is recognized by the broader community. (Value judgement)
       - *Minutes line:* Competing claims resolved in favor of [claimant] due to [reasons, noting value judgements].

  5. **Successor Community (5 min)**
     - For community claims, if institutions changed:
       - Identify current group with cultural continuity and ability to sustain practice (Commitment 2). (Value judgement if contested)
       - *Minutes line:* Successor community established as [group] based on [evidence/value judgement].

  6. **Consider Non-Return Outcomes (15 min)**
     - If return is not feasible or if claimant agrees, consider:
       - Loan-back: Object returned but loaned to museum for display. (Suitable when claimant wants ownership but museum display is acceptable.)
       - Joint title/shared custody: For ensemble pieces or shared interest.
       - Transfer with continuing loan: Transfer title but object stays on loan.
       - Transfer to another body: If claimant lacks capacity, but ensure community access.
       - Digital return: Only for informational access, not for physical/sacred needs.
     - Evaluate: Does this address the claim? (e.g., for sacred objects, only return with restrictions works; digital is insufficient.)
     - *Minutes line:* Non-return option [specify] considered [accepted/rejected] because [reason].

  7. **Recipient Capacity (5 min)**
     - Is capacity a legitimate factor? Only if:
       - Non-return option is being considered and the claimant agrees, or
       - There are genuine concerns for object safety that cannot be mitigated.
     - Do not use as pretext to deny return. (Value judgement: when legitimate?)
     - *Minutes line:* Recipient capacity [considered/not considered] because [reason].

  8. **Precedent (5 min)**
     - Each case is unique. Consistency in principles, not outcomes.
     - *Minutes line:* Precedent considered; recommendation based on specific merits.

  9. **Weigh Commitments (10 min)**
     - Balance:
       - Commitment 1: Wrong not cured by time.
       - Commitment 2: Living practice relation.
       - Commitment 3: Public and donors.
     - Value judgement: When commitments conflict, e.g., living practice vs. public access, we prioritize Commitments 1 and 2 over 3 for ethical reasons, but seek solutions that address all.
     - *Minutes line:* Commitments weighed; [which commitment(s) prioritized] because [reason].

  10. **Recommendation (5 min)**
      - Propose: Return, non-return outcome, or reject.
      - State reasons based on facts and value judgements.
      - *Minutes line:* Recommendation: [outcome] because [reasons].

  **Handover to Trustees:** If title transfer is recommended, hand to trustees with full documentation.

  ---

  **Intake Sheet (One Page)**

  **Restitution Claim Intake Sheet**

  *Complete with factual evidence (documents, sources). No characterizations.*

  1. **Object Identification:**
     - Accession Number: __________
     - Description: __________
     - Current Location (gallery/storage): __________

  2. **Provenance:**
     - Date of museum acquisition: __________
     - Acquisition method (purchase, donation, etc.): __________
     - Source (name, role): __________
     - Previous ownership history (list with dates): __________
     - Gaps in provenance: __________

  3. **Circumstances of Removal:**
     - Date of removal from original context: __________
     - Location of removal: __________
     - Removed by whom: __________
     - Circumstances (e.g., military action, sale, gift): __________
     - Legal framework at time (if known): __________

  4. **Claimant(s):**
     - Claimant 1: 
       - Name: __________
       - Type (state, community, etc.): __________
       - Basis of claim: __________
       - Contact: __________
     - Claimant 2 (if any): [same]

  5. **Nature of Claim:**
     - Remedy sought: __________
     - Ground(s) (wrongful taking, belonging, ensemble, sacred, heirs, other): __________
     - If wrongful taking, describe the wrong: __________
     - If sacred, describe significance and restrictions: __________
     - If ensemble, describe the whole and current parts: __________
     - If heirs dispute, describe competing claims: __________

  6. **Competing Claims?** Yes/No. If yes, describe: __________

  7. **Object Significance:**
     - To claimant(s): __________
     - To museum (exhibit history, research): __________
     - Living practice connection (describe and location): __________

  8. **Current Conditions:**
     - Physical condition: __________
     - Display status: __________
     - Conservation concerns: __________

  9. **Previous Research:** __________

  ---

  **Running the Files**

  **File 1: Punitive Military Expedition**

  - Intake facts: Removal in 1890s punitive military expedition (wrongful taking). Claimants: successor state and historic royal court.
  - Step 2: Classify as A (wrongful taking) and possibly B (belonging).
  - Step 3: Ground A: Wrongful taking? Yes (military looting, even if accepted then, it's a wrong by current ethics). Passage of time doesn't cure. So proceed.
  - Step 4: Competing claims: State and royal court. 
    - Who can sustain the living practice? The royal court might be the traditional institution with ongoing rituals. The state might want it for a national museum. 
    - Value judgement: If the royal court is the cultural heart, then they are preferred. 
    - Outcome: Recommend return to the royal court. 
  - Value judgement point: Step 4 (competing claims) — deciding the royal court is the appropriate claimant for sustaining the living practice.

  **File 2: Architectural Sculptures**

  - Intake facts: Removed with permission of then-sovereign, not illegal at time. Claimant state: ensemble integrity (ground C).
  - Step 2: Classify as C.
  - Step 3: Ensemble integrity: Object part of a monument. Reunification would restore meaning? Claimant says yes. Evidence: The monument is a single work. 
  - Step 6: Non-return? Not requested; claimant wants reunification. 
  - Step 9: Weigh commitments: Commitment 2 (relation to living practice) — but is the monument a living practice? If it's an ancient site not in active use, then perhaps not. But ensemble integrity is about historical and cultural meaning. Commitment 3 (public access) might be affected if returned. 
  - Value judgement: How much weight to give ensemble integrity? The council's premise (stewardship) suggests that if the object's significance is tied to the ensemble, it should be reunited. But the chair wants to decline. 
  - Outcome: The panel might recommend return to reunite the ensemble, as the removal, though legal, has led to loss of meaning. 
  - Value judgement point: Step 3 (ensemble integrity) and Step 9 (weighing commitments) — deciding that ensemble integrity overrides the museum's stewardship in this case.

  **File 3: Sacred Object**

  - Intake: Sacred, community wants it back and restricted.
  - Step 2: Classify as D.
  - Step 3: Sacred? Yes. Public access violates practices? Yes.
  - Step 6: Non-return? The community wants return, so non-return options don't work (e.g., loan-back would require display, which they oppose).
  - Step 9: Weigh commitments: Commitment 2 (living practice) requires return. Commitment 3 (public) is overridden because the object's significance is in the restricted practice.
  - Outcome: Return to the community.
  - Value judgement point: Step 9 — prioritizing Commitment 2 over 3.

  **Case where chair won't like the outcome:**
  - File 2: The procedure might recommend return due to ensemble integrity, but the chair's instinct is to decline.

  **Class of case where procedure misfires:**
