prompt: |-
  I am the compliance and ethics officer at an international NGO that runs health and water programs through twelve country offices. Three decisions land on my desk most weeks, and I currently make them by feel: whether to approve a declared gift or act of hospitality given or received by field staff; whether a locally ordinary arrangement must be stopped, tolerated, or restructured (a payment to move a shipment past a checkpoint, a salary a driver is expected to share with his extended family, hiring a cousin over an equally qualified stranger, a contribution to a chief's funeral); and how to triage a report that a colleague is taking. I get about thirty minutes per case, I have no training in anthropology or law, and I have to write a justification that will hold up both to a donor's auditor and to a village council. Gifts under $250 are mine to decide; anything larger, and every termination, goes to the general counsel and the country director. Assume I have no web access; I need reasoning I can use, not references.

  Please write me a decision procedure I can actually run: the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure returns a no, and where it must hand the decision to a person because the question is one of values rather than facts.

  Some material I would like the procedure to use rather than reinvent. The standard formula that corruption is the abuse of entrusted power for private gain is too coarse here, because the fights are almost never about whether a payment happened; they are about whether the power was entrusted by the right community and whether the gain was private when it went to a kin group rather than to an individual. In many of the places we work, people move between two normative orders: the state or the NGO, experienced as an alien structure from which extraction is not felt to be stealing, and the kin and community network, whose claims are felt as genuine obligations that outrank the institution's. My own staff are not outside this. There is also a live argument I cannot settle, that petty payments to officials grease the wheels where bureaucracies are broken and produce better outcomes than refusal, against the reply that they are a regressive tax, select for those who can pay, and corrode the institution over time. And I need a way to separate a gift from a price: my instinct is that a real gift is addressed to a person and would have roughly the same value whoever held the office, while a bribe is addressed to the office and calibrated to the decision at stake, but I do not know how much weight that test can carry. Field staff also insist that local people distinguish sharply among kinds of taking — a cut a clerk demands and everyone resents, a payment a family man is understood to owe his relatives, a tribute that flows upward and is expected — and I would rather exploit those distinctions than flatten them.

  Then run the procedure on three cases. First, a customs official asks $200 to release a container of vaccines whose refrigeration is failing; the shipment is worth $40,000 and covers a district's routine immunization for a month, and a field officer has paid before. Second, a district health officer who sits on the committee choosing which villages get boreholes has asked us for $600 toward his mother's funeral, as many local organizations contribute, and separately for a laptop in recognition of his support. Third, a pharmacist at one of our clinics is reported to sell a small share of the donated drugs on the local market and give the money to the cleaning staff and to patients who cannot afford transport; he works unpaid overtime and the clinic depends on him.

  Tell me which of the three the procedure answers in a way I will not like, and what it offers me there beyond stop or tolerate. Say where the procedure can only run on information the field office may not have — what the decision would have been without the payment, whether local people call the arrangement a wrong — and what to do when that information is missing. Mark the steps that are judgment calls dressed up as procedure, and tell me which way the procedure should err, given that letting corruption through and cutting off a program or firing someone for what the community regards as ordinary decency do not cost the same. Close by telling me what this procedure cannot decide.
reasoning: |-
  We are designing a decision procedure for an ethics officer in an international NGO. The procedure must handle three types of decisions: gifts/hospitality, locally ordinary arrangements, and triage of reports about taking. The constraints are: 30 minutes per case, no specialized training, and justifications that hold up to both donor auditors and village councils.

  The procedure must incorporate the following insights:
  1. Corruption is defined as abuse of entrusted power for private gain, but we must consider that the "entrusted power" may be perceived differently by the state/NGO vs. the kin/community network.
  2. In many contexts, people move between two normative orders: the institutional (state/NGO) and the kin/community network. The latter's claims are seen as genuine obligations.
  3. There is a debate about the short-term benefits of petty corruption (greasing the wheels) vs. long-term harms (regressive tax, institutional corrosion).
  4. Distinguish between a gift (addressed to a person, consistent value regardless of office) and a bribe (addressed to the office, calibrated to the decision at stake).
  5. Field staff report that local people distinguish among types of taking (resented demands, understood obligations, expected tributes). We should use these distinctions.

  We are to design a procedure with ordered questions, sufficient answers, and clear outputs (approve, deny, escalate). We must note where information might be missing and how to handle it, and where judgment is required.

  The procedure will be applied to three cases:

  Case 1: Customs official asks $200 to release a container of vaccines (worth $40,000, refrigeration failing). Field officer paid before.

  Case 2: District health officer (on committee for borehole selection) asks for $600 for his mother's funeral (as many organizations do) and separately a laptop for his support.

  Case 3: Pharmacist sells a small share of donated drugs on the local market and gives money to cleaning staff and patients for transport; works unpaid overtime and is essential.

  We must also note which case might yield an unpopular decision and what alternatives exist beyond stop/tolerate. Finally, we must state the limitations of the procedure.

  ---

  **Decision Procedure**

  The procedure is structured in stages. Each stage has one or more questions. We proceed until we reach a decision or an escalation point.

  **Stage 1: Initial Triage (Applies to all cases)**
  1. Is this a report of wrongdoing (like Case 3) or a request for approval (like Cases 1 and 2)?
     - If it's a report, go to Stage 4 (Triage for Reports).
     - If it's a request for a gift/hospitality or an arrangement, proceed to Stage 2.

  **Stage 2: For Gifts/Hospitality and Arrangements (Cases 1 and 2)**
     We are considering an action that involves giving or receiving something of value.

  2.1. **Nature of the Transfer**: Is the transfer a gift, a payment, or an obligation?
     - Use the test: 
          - A gift is addressed to a person and would be given regardless of the office (e.g., a wedding gift to a friend who happens to be an official). 
          - A payment is for a specific service or to influence a decision.
          - An obligation arises from local norms (e.g., sharing salary with family, contributing to a funeral as a community member).
     - If it's a gift and under $250, and the recipient is not in a position to make decisions affecting the NGO, then it may be acceptable (but proceed to next steps). If over $250, it must be escalated (per your policy). 
     - If it's a payment, then it is likely a bribe and must be denied unless it meets the conditions in 2.4.
     - If it's an obligation, then it might be tolerated or restructured.

  2.2. **Power Dynamics and Entrustment**: 
     - Who entrusted the power that is being used? 
          - If the power is entrusted by the NGO or state and the gain is private (to an individual or a small group that is not the broader community), then it is likely corrupt.
          - If the power is entrusted by the community and the gain is going to the community (or a kin group as per community norms), then it might not be corrupt in the local context.
     - However, note: even if the community norm accepts it, the NGO must also consider its own standards and donor requirements.

  2.3. **Local Perception**: 
     - How is the arrangement perceived locally? 
          - Is it widely resented (like a clerk's cut) or accepted as an obligation (like sharing with family) or expected as tribute?
          - We must rely on field staff to provide this. If they cannot, then we must note the gap and proceed cautiously.

     - Sufficient answer: 
          - If the arrangement is widely resented, then it is likely corrupt and should be stopped.
          - If it is accepted as an obligation or tribute, then we might tolerate or restructure.

  2.4. **Consequences and Alternatives**:
     - What are the consequences of refusing the transfer?
          - For Case 1: If we don't pay, the vaccines spoil and children go unvaccinated.
          - For Case 2: If we don't contribute to the funeral, we might lose the health officer's goodwill and it might affect borehole allocations? (But note: this is a bribe if it influences the allocation.)
     - Are there alternatives? (e.g., paying through official channels, reporting the demand, restructuring the arrangement)
     - Weigh the short-term benefits against long-term harms (regressive tax, institutional corrosion). If the harm of refusal is catastrophic (like losing life-saving supplies) and there is no alternative, then we might tolerate it as an exception, but document and work on a long-term solution.

  2.5. **Escalation and Documentation**:
     - If the value is over $250, or involves termination, escalate (per policy).
     - Otherwise, if after the above we are still unsure, or if the case involves a significant risk, escalate to the country director or general counsel.
     - Always document the reasoning, including the local context and consequences.

  **Stage 3: Decision for Arrangements (Output from Stage 2)**
     After analysis, we have three options: Stop, Tolerate, Restructure.
     - Stop: if the arrangement is clearly corrupt and the consequences of stopping are manageable (or we can mitigate).
     - Tolerate: if the arrangement is an accepted obligation and stopping would cause more harm (e.g., losing essential staff) or if it is a one-time emergency with no alternative. But note: tolerating should be the exception and must be reviewed periodically.
     - Restructure: if we can change the arrangement to align with both institutional and local norms (e.g., instead of giving cash to an official for a funeral, the NGO makes a public donation to the funeral committee; instead of a driver sharing salary, we adjust the salary and provide family support through a transparent program).

  **Stage 4: For Reports of Taking (Case 3)**
     This is for when someone reports that a colleague is taking (e.g., the pharmacist selling drugs).

  4.1. **Nature of the Taking**:
     - What is being taken? (e.g., drugs, money)
     - How is it being used? (e.g., for personal gain, for community support, for helping patients)
     - Is the taking against the rules? (Clearly, selling donated drugs is against rules, but we must consider context.)

  4.2. **Local Perception**:
     - How do local people and staff view the taking? 
          - Is it seen as theft, or as a necessary redistribution? 
          - Is the person taking seen as corrupt or as a community helper?
     - If the taking is resented, then it's a clear violation.

  4.3. **Intent and Impact**:
     - What was the intent? (e.g., to help patients vs. to enrich oneself)
     - What is the impact? 
          - Negative: diversion of resources, harm to the program, unfairness.
          - Positive: helps patients access care, supports low-paid staff.

  4.4. **Alternatives and Restitution**:
     - Could the same goal be achieved without breaking rules? (e.g., creating a transport fund, formally supporting cleaning staff)
     - Is the person willing to stop and make restitution?

  4.5. **Consequences of Action**:
     - If we fire the person, what happens to the clinic? (e.g., Case 3: the clinic depends on him and he works unpaid overtime.)
     - Can we restructure the situation to address the root cause? (e.g., provide a transport fund, pay cleaning staff more)

  4.6. **Decision for Reports**:
     - If the taking is for personal gain and resented: then termination is likely, but must be escalated (per policy, terminations go to general counsel and country director).
     - If the taking is for community support and accepted, but still against rules: then we might restructure (e.g., create a formal mechanism) and discipline (e.g., warning, training) rather than termination.
     - If the taking is mixed, then we must weigh the harm vs. the good and the possibility of restructuring.

  **Handling Missing Information**:
  - For questions about local perception, consequences, or alternatives: if the field office cannot provide the information, then the procedure must err on the side of caution. 
  - Since the cost of letting corruption through (loss of donor trust, program suspension) is often higher than the cost of cutting off a program or restructuring (which might cause short-term disruption), we err toward stopping when information is missing. However, in life-threatening situations (like Case 1), we might tolerate temporarily while gathering information and seeking alternatives.

  **Judgment Calls Dressed as Procedure**:
  - Stage 2.1 (Nature of the Transfer): Distinguishing gift vs. bribe is a judgment call. The test provided is a guideline but requires interpretation.
  - Stage 2.3 (Local Perception): Requires input from field staff, which might be subjective.
  - Stage 2.4 (Consequences): Weighing short-term vs. long-term is inherently judgmental.
  - Stage 4.2 and 4.3 (Local Perception and Intent): These are critical but rely on reports and interpretation.

  **Where to Err**:
  - Given that the cost of letting corruption through (institutional corrosion, loss of donor funding) can be catastrophic for the entire organization, we should err on the side of stopping corruption when there is ambiguity and no immediate life-threatening consequence.
  - However, in cases of immediate life-threatening consequences (like spoiling vaccines) and no alternative, we might tolerate temporarily while documenting and escalating for a long-term solution.
  - For community obligations that are not resented, we should try to restructure rather than stop, because cutting off a program or firing someone for what the community sees as ordinary decency can cause loss of trust and program failure.

  **What the Procedure Cannot Decide**:
  - The procedure cannot resolve the fundamental debate about the long-term effects of petty corruption (grease the wheels vs. corrosive). It can only weigh the immediate consequences and look for alternatives.
  - It cannot create local norms or change them; it can only respond based on the information provided.
  - It cannot replace legal advice; if a situation involves clear violation of law, it must be escalated.

  ---

  **Apply to Cases**

  **Case 1: Customs official asks $200 to release a container of vaccines (refrigeration failing)**
  - Stage 1: Request for an arrangement (payment to move shipment).
  - Stage 2.1: This is a payment (bribe) because it is addressed to the office (customs) and calibrated to the decision (release the container). It would not be paid if the official did not have that power.
  - Stage 2.2: The power is entrusted by the state (customs) and the gain is private (to the official). So, corrupt by definition.
  - Stage 2.3: What is the local perception? If field staff say that such payments are resented (or not), we need to know. But typically, these are seen as extortion. However, the field officer paid before, suggesting it might be routine. Without clear resentment report, we proceed with caution.
  - Stage 2.4: Consequences: Without payment, vaccines spoil -> children unvaccinated (life-threatening). Alternatives? Can we escalate within customs? Can we get a higher official to intervene? If no alternative and the situation is urgent, we might tolerate as a one-time exception. But note: repeated payments are corrosive and might escalate.
  - Stage 2.5: Value is $200 (under $250) so it's within your authority. However, because it is a bribe and the consequences are severe, we might approve the payment this time but with a plan to avoid in future (e.g., report to authorities, work with other NGOs to address the issue). 
  - Output: Tolerate for now, but must document and escalate the systemic issue to the country director and general counsel for a long-term solution.

  **Case 2: District health officer asks for $600 for mother's funeral and a laptop**
  - Stage 1: Request for gifts (funeral contribution and laptop).
  - Stage 2.1: 
     - Funeral contribution: This is presented as an obligation (many organizations contribute). But note: the officer sits on a committee that decides on boreholes. If we contribute, it might influence his decisions. So, it's a payment for access? Also, the value ($600) is over $250 -> must escalate per policy. But let's analyze.
     - Laptop: This is a gift addressed to the office? It's in recognition of his support -> likely a bribe because it's for the office and the support (which is his job) and the laptop is valuable. Also, it's a separate request.
  - Stage 2.2: The power (sitting on borehole committee) is entrusted by the state/NGO. The gain is private (for the officer and his family). So, corrupt.
  - Stage 2.3: Local perception: If contributing to funerals is expected and not resented, then it might be an obligation. But the officer is using his position to solicit? That might be resented. We need field input. Without it, assume resentment because it's solicited by an official.
  - Stage 2.4: Consequences of refusal: We might lose his goodwill and it might affect borehole allocations. But that is exactly the problem: if we pay, we are buying influence. Alternatives: The NGO could make a donation to the funeral as a community gesture (not tied to the officer) or to a community fund. The laptop should not be given as a personal gift.
  - Stage 2.5: Both the funeral contribution ($600) and the laptop (likely >$250) are over the limit -> must escalate to general counsel and country director. We also note: the funeral contribution might be restructured as a community donation (if allowed) and the laptop should be refused because it is a bribe.

  **Case 3: Pharmacist sells drugs, gives money to cleaning staff and patients**
  - Stage 1: Report of taking -> go to Stage 4.
  - Stage 4.1: Taking: selling donated drugs. Use: for helping cleaning staff and patients (transport). Against rules? Yes.
  - Stage 4.2: Local perception: The report doesn't say, but we must ask. If the community sees it as positive redistribution (helping the poor and underpaid staff) and not theft, then it might be accepted. But if patients are being charged for free drugs, that is resented.
  - Stage 4.3: Intent: Apparently good (to help). Impact: 
     - Negative: diversion of drugs (which might cause shortages), undermines trust in the clinic, sets a bad precedent.
     - Positive: helps patients access care and supports cleaning staff.
  - Stage 4.4: Alternatives: Create a transport fund for patients, increase support for cleaning staff (if funds are available). The pharmacist might be willing to stop if alternatives are provided.
  - Stage 4.5: Consequences of action: Firing the pharmacist might collapse the clinic (he works unpaid overtime and is essential). So, termination would be very costly.
  - Stage 4.6: The taking is not for personal gain and might be accepted locally. Therefore, we should restructure: 
     - Stop the selling of drugs immediately.
     - Work with the clinic to set up a formal system for patient transport assistance and support for cleaning staff (maybe reallocate funds or seek a donor for that).
     - Discipline the pharmacist: require him to stop and possibly give a warning, but provide training on compliance and recognize his dedication.
     - Because termination must be escalated, we would not terminate without escalation. But we can impose other measures.

  **Which decision might you not like?**
  Case 2: The procedure requires escalation because the amounts exceed $250 and also flags both requests as problematic. You might not like that you cannot make the call yourself and that the answer is not simple. But the procedure offers restructuring the funeral contribution as a community donation (if possible) and refusing the laptop. It also forces a systemic review of how to handle such requests.

  **Limitations**:
  - The procedure cannot decide without local perception information. If missing, we err on the side of caution (against the transfer).
  - It cannot eliminate the tension between short-term and long-term consequences; it only structures the trade-off.
  - It cannot replace the need for judgment in close calls.

  Final note: The procedure is a tool to structure your thinking and ensure consistency, but it must be applied with wisdom and in consultation with field staff.
answer: |-
  Below is a decision procedure designed for your context: structured as sequential questions, with clear thresholds for approval, denial, escalation, or restructuring. It incorporates your material on normative orders, local distinctions, and the gift/bribe test. The procedure errs toward **protecting program continuity and community trust** when facts are ambiguous, as firing staff or halting programs for locally accepted acts often causes more immediate harm than tolerating minor, non-malicious violations (e.g., kinship obligations). However, it errs toward **denial or escalation when institutional corrosion or legal risk is high** (e.g., bribes to officials).

  ### **Decision Procedure: Key Principles**
  1. **Order of Questions**: Sequential, starting with easily verifiable facts (e.g., value, role of involved parties) before probing context and norms.
  2. **Sufficient Answers**: Relies on field staff’s on-ground insights. If they cannot provide evidence (e.g., local perceptions), default to documented assumptions.
  3. **Outputs**: 
     - **Approve**: Clear evidence of harmlessness or alignment with both norms.
     - **Deny**: Unambiguous corruption or high risk.
     - **Tolerate**: Short-term acceptance of non-ideal but locally normative acts, with a plan to mitigate long-term harm.
     - **Restructure**: Modify the arrangement to align with institutional rules and local norms (e.g., convert informal payments to transparent community funds).
     - **Escalate**: Mandatory for high-value gifts (>$250), terminations, or unresolved value conflicts.
  4. **Judgment Calls**: Marked at each relevant step. When in doubt, prioritize community trust for staff/kin issues and institutional integrity for officials.

  ---

  ### **The Procedure: Core Questions**
  **Run these in order. Stop when a decision/output is reached.**

  #### **Step 1: What is the value and nature of the transfer?**
     - **Question**: Is this a gift, hospitality, payment, or obligation? Use the **gift test**: "Would this be given similarly if the recipient held no official power? Is its value tied to a specific decision or office?"
       - _Gift/hospitality_: Addressed to the person, not the office (e.g., a wedding gift of fixed value).
       - _Payment_: Calibrated to influence a decision (e.g., checkpoint fee for faster service).
       - _Obligation_: Driven by kinship/community norms (e.g., salary sharing, funeral contributions).
     - **Sufficient Answer**: Field officer’s description + past precedents. If unclear, treat as payment.
     - **Output**:
       - Gift/hospitality ≤$250: Proceed to Step 2.
       - Gift/hospitality >$250: **Escalate** (per policy).
       - Payment: Proceed to Step 3.
       - Obligation: Proceed to Step 4.
     - **Judgment Call**: Gift test application. *Err toward "payment" if recipient is a state/NGO official*.

  #### **Step 2: Is there risk of undue influence? (For gifts/hospitality ≤$250)**
     - **Question**: Could this reasonably influence the recipient’s decisions about the NGO? Consider:
       - Recipient’s role (e.g., vendor vs. regulator).
       - Local customs (e.g., routine token gifts vs. unusual offerings).
     - **Sufficient Answer**: Field officer’s assessment of recipient’s influence and local norms.
     - **Output**:
       - No influence (e.g., gift to a non-decision-making vendor): **Approve**.
       - Potential influence (e.g., gift to a government liaison): **Deny**.
     - **Judgment Call**: Assessing influence. *Err toward denial for state officials*.

  #### **Step 3: Is this payment abusive or functional? (For payments)**
     - **Question**: 
       - a) **Abuse of power**: Is the payer acting under duress? Is the payment demanded/coerced? 
       - b) **Private vs. communal gain**: Does the gain go to an individual (abusive) or a kin/group (potentially obligatory)? 
       - c) **Local perception**: Is this resented ("cut") or accepted ("tribute")? 
       - d) **Alternatives**: Can the outcome be achieved without payment (e.g., official channels, advocacy)?
     - **Sufficient Answer**: Field officer’s local intelligence. If perception/alternatives unknown, assume resented and explore alternatives.
     - **Output**:
       - Coerced + individual gain (e.g., checkpoint extortion): **Deny** and document coercion.
       - Accepted + communal gain + no alternatives (e.g., customary tribute): **Tolerate** short-term but **Restructure** long-term (e.g., formalize via community fund).
       - Resented or corrosive to institutions: **Deny** regardless of outcome.
     - **Judgment Call**: Balancing acceptance vs. corrosion. *Err toward deny if no local perception data, unless immediate harm is life-threatening*.

  #### **Step 4: Is this obligation necessary or avoidable? (For obligations)**
     - **Question**:
       - a) **Normative conflict**: Does fulfilling this violate NGO rules but align with kin/community norms? 
       - b) **Consequences of refusal**: What happens if we stop it? (e.g., staff attrition, community backlash).
       - c) **Restructuring potential**: Can we formalize this (e.g., salary advance for family support, public funeral donation)?
     - **Sufficient Answer**: Field officer’s input on local norms and restructuring options.
     - **Output**:
       - Aligns with community norms + low institutional risk: **Tolerate** with documentation.
       - High institutional risk (e.g., nepotism) or avoidable: **Restructure** (e.g., open hiring, transparent grants).
       - Causes harm if stopped (e.g., program collapse): **Tolerate** temporarily while **Restructuring**.
     - **Judgment Call**: Weighing community norms vs. institutional rules. *Err toward tolerate for staff/kin issues, deny for official interactions*.

  #### **Step 5: Triage for reports of "taking" (e.g., staff diversion)**
     - **Question**:
       - a) **Intent and gain**: Was this for private gain or communal benefit? 
       - b) **Local perception**: Is this seen as theft, redistribution, or obligation? 
       - c) **Impact**: Does it harm beneficiaries or the program? 
       - d) **Alternatives**: Can the same outcome be achieved transparently?
     - **Sufficient Answer**: Field investigation (staff interviews, community feedback). If perception unknown, assume harmful.
     - **Output**:
       - Private gain + resented (e.g., clerk’s cut): **Escalate** for termination.
       - Communal benefit + accepted (e.g., sharing with kin): **Restructure** (e.g., formal stipends).
       - Ambiguous: **Tolerate** with oversight while exploring alternatives.
     - **Judgment Call**: Intent assessment. *Err toward restructuring if communal benefit and staff are essential*.

  ---

  ### **Application to Your Cases**
  **Case 1: $200 to customs official for vaccines**  
  - Step 1: **Payment** (calibrated to decision, office-specific).  
  - Step 3:  
    - a) **Abuse**: Likely coerced (refrigeration failing).  
    - b) **Gain**: Individual (official).  
    - c) **Perception**: If "resented cut," deny; if "grease payment," tolerate. *Field officer paid before, suggesting accepted but resented—assume resented without data*.  
    - d) **Alternatives**: Can higher authorities intervene? If no, and vaccines spoil → immediate harm.  
  - **Output**: **Tolerate** (due to life-threatening harm) but **Restructure**: Report to authorities, prep official fees for future shipments. *You may dislike this, but it offers a "tolerate + restructure" path—not just stop/tolerate—to avoid program collapse while fighting systemic change*.  

  **Case 2: $600 for funeral + laptop for health officer**  
  - Step 1: **Obligation** (funeral) + **Gift** (laptop).  
  - Funeral ($600 > $250): **Escalate** immediately (per policy).  
  - Laptop: Step 1 → **Gift** >$250 → **Escalate**.  
  - *If forced to analyze*:  
    - Funeral: Step 4 → Normative (local custom) but high risk (official oversees boreholes). **Restructure**: Donate publicly to funeral fund, not to officer.  
    - Laptop: Step 2 → High influence risk → **Deny**.  
  - **Output**: **Escalate both**. *Procedure flags this as high-risk: mixing obligation (funeral) with bribe (laptop for influence)*.  

  **Case 3: Pharmacist sells drugs for staff/patients**  
  - Step 5:  
    - a) **Intent/Gain**: Communal (staff/patients), not private.  
    - b) **Perception**: If locals see this as redistribution (not theft), tolerate/restructure. *Without data, assume accepted if staff support it*.  
    - c) **Impact**: Harmful if drugs run short, helpful if aids access.  
    - d) **Alternatives**: Create transport fund/staff stipends.  
  - **Output**: **Restructure**: Stop sales immediately; formalize support via transport fund/staff bonuses. Retain pharmacist with warning. *Avoids firing essential staff while fixing the system*.  

  ---

  ### **Where the Procedure Might Yield Unlikable Outcomes**
  - **Case 1 (Customs payment)**: You may dislike **tolerating** a bribe. The procedure offers **restructuring** (e.g., advocacy, contingency funds) to avoid recurrence. It forces trade-offs: rejecting risks program failure, accepting risks corrosion. Restructuring is the middle path.

  ### **Information Gaps and Handling**
  - **Critical Missing Data**:  
    - Local perception (Steps 3c, 4b, 5b): If unknown, *err toward institutional risk* for officials (deny) and *community norms* for staff (tolerate/restructure).  
    - Alternatives (Steps 3d, 5d): If unknown, assume they exist and deny/tolerate while tasking field staff to find solutions.  
    - Consequences of refusal (Steps 3d, 4b): If unknown, default to worst-case scenario (e.g., life-threatening harm → tolerate).  
  - **Procedure Response**: Document gaps, require field staff to fill them post-decision, and review in 3–6 months.

  ### **Limitations of the Procedure**
  1. **Cannot resolve deep value conflicts**: E.g., the "petty corruption as grease vs. corrosion" debate. It defaults to short-term harm reduction but can’t settle the ethics.  
  2. **Cannot verify local norms without field input**: Relies on staff honesty and cultural competence.  
  3. **Cannot handle complex legal/operational risks**: Always escalates terminations, high-value gifts, or legal violations.  
  4. **Cannot replace context**: Anthropological nuances (e.g., "which kin group counts as communal") require human judgment.  

  ### **Final Guidance**
  - **When to Err**:  
    - **For staff/kin issues**: Err toward *tolerate/restructure* to avoid unjustly punishing locally ethical behavior.  
    - **For officials**: Err toward *deny/escalate* to prevent institutional harm.  
  - **Document Everything**: Justifications must show how local norms and risks were weighed.  
  - **Iterate**: Update the procedure every 6 months using case outcomes.  

  This procedure systematizes your "feel" into auditable steps while respecting the dual normative orders. It won’t make you an anthropologist, but it will make your decisions consistent, defensible, and adaptable.
