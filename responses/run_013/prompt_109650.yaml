  ## Eulogy for Professor [Teacher's Name]

  Good morning. Standing here, looking out at all of you – his family, his students, his colleagues, his friends from the zendo – I feel the immense weight, and the strange honor, of trying to speak about [Teacher's Name]. Honestly? I think he’d be quietly amused that any of us are trying to pin him down with words at all. He spent a lifetime carefully showing how words, especially big, absolute words, often trap us more than they free us.

  For those who knew him in the classroom, or through his writings on Nagarjuna, emptiness, and the dance of dependent origination, you’ll remember his particular insistence. Not the loud, demanding kind, but the quiet, persistent kind. He was insistent, perhaps above all, about the tetralemma. Not as a multiple-choice quiz where one answer was right, but as a flashing red light: *Stop! Your question itself is built on shaky ground.* Is it this? Is it not this? Is it both? Is it neither? If you find yourself forcing reality into one of those four boxes, he’d suggest, look again at what you’re really asking. The question might be the problem.

  And in notes he left, with that familiar wry clarity, he applied it to… well, to this. To now. To whatever we might say about him here today. *Don’t*, he essentially wrote, *try to put me in one of those corners. Don’t say I’m somehow still going. Don’t say I’ve simply stopped. Don’t say both. Don’t say neither.* He left us, quite deliberately, standing in the open space beyond those categories. Stuck, beautifully, thoughtfully stuck, with the inexpressible reality of *this* – his absence, our presence, the shared history we hold.

  So, what *can* we say? How do we gather here, hearts often feeling heavy, minds perhaps wrestling with the very concepts he taught, and speak meaningfully without landing in the traps he pointed out?

  We can speak of the net. The intricate, shimmering net of dependent origination he spent his life contemplating. Nothing exists alone, isolated, self-powered. Everything arises because of countless causes and conditions. *He* arose, the remarkable person we knew, because of an unfathomable constellation of things: his family, his teachers, the books he read, the students who challenged him, the silence of the zendo, the arguments he had (and he did have them, gently but firmly!), the air he breathed, the ground he walked on. And this gathering right now? It arises because of him. Our shared memories, our gratitude, our confusion, even our grief – they are threads in the vast, interconnected web his life helped weave.

  This isn't abstract. It’s the most concrete thing we have. **It’s the memory of his utterly predictable, utterly endearing habit of quietly correcting people’s pronunciation of Sanskrit terms under his breath during talks – not to show off, but with the faintest, almost apologetic wince, as if the mispronunciation caused a tiny, actual physical pain he couldn’t ignore.** It’s the way his eyes would light up, not when a student gave the "right" answer, but when they asked the question that exposed the wobbliness of their own assumptions. It’s the profound respect he had for his sister’s Catholic faith, a respect born not from agreement on doctrine, but from a deep understanding that her truth, her path, was a vital thread in the net of causes that shaped *him*.

  He taught that the conventional world – this world of tomatoes and gardens and beat-up cars and tearful goodbyes – isn't *false*. It’s not a lie we tell ourselves to feel better about some harsher reality. It’s the very ground of our experience. The “two truths” weren't separate layers for him; they were inseparable aspects of one reality. The ultimate truth of emptiness – that nothing has fixed, independent existence – doesn't erase the conventional truth that this cup of tea is hot, that kindness matters, that losing someone we love *hurts*. Emptiness isn't a void; it’s the very possibility of connection, of change, of meaning arising within interdependence. To deny the pain of loss because “everything is empty” isn't wisdom; it’s a misunderstanding as profound as clinging to the belief that the pain is absolute and permanent. It risks turning the liberating insight of emptiness into a kind of nihilism, a dismissal of the very real, textured, bittersweet reality we inhabit.

  His colleague suggested last night that because everything is empty, grief is ‘just a convention,’ and this should be short and dry. But I think [Teacher's Name] would see that as falling into one of the very traps he warned against – mistaking emptiness for nothingness, mistaking the ultimate for an excuse to dismiss the conventional. The profound depth of emptiness doesn't make our love, our memories, or our sorrow less real on *this* level. It makes them possible. It means our grief isn't a solid, permanent *thing* possessing us, but it *is* a genuine, arising phenomenon, woven from the threads of our connection to him. To deny its conventional reality wouldn't honor the truth; it would deny the depth of the connection that caused it. This gathering *is* the conventional truth of our love and loss, manifesting beautifully, messily, unavoidably.

  So, we don’t say he’s “gone” in some final, erased sense. We don’t say he’s “still here” in some literal, unchanged way. We don’t say both, and we don’t say neither. What we *can* say, what we *must* say within the tender, fragile truth of this convention, is this:

  We feel his absence sharply. We miss his voice, his quiet wit, his fierce intellect wrapped in profound kindness. We miss the specific way he occupied space in this world. And simultaneously, we feel his presence vividly – in the ideas that challenge us still, in the memories that bring a smile or a tear, in the ways he shaped how we see ourselves and the world. He is woven into the net. He is part of the causes and conditions that make us who we are in this moment, sitting here together, remembering. That’s not a corner; that’s the open, dynamic, interconnected space he invited us into. That’s where we find him now. Not gone, not here, but inextricably part of the vast, unfolding pattern.

  Thank you, [Teacher's Name], for the net. We will keep tending to its threads.

  **Summary:** The eulogy honored conventional grief as a valid, arising phenomenon within dependent origination, affirming its reality and significance without needing to contradict the ultimate truth of emptiness, thereby demonstrating that emptiness grounds rather than negates the profound experience of love and loss.
