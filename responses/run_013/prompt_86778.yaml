  The requirement that eliminates the most candidates is probably the no circularity one. Many approaches, like decision-theoretic or world-counting, either assume the measure or use Hilbert space norm without justification beyond getting the right probabilities. Self-locating uncertainty might not explain rational weighting. So no circularity is a big hurdle.

