answer: |-
  Here are the desiderata for probability in no-collapse (e.g., many-worlds) quantum mechanics, framed for a working physicist seeking a complete, predictive theory. I'll state each requirement, its motivation, my verdict on whether it's genuine, then analyze tensions and elimination power. My confidence assessments follow at the end.

  ---

  ### **Desiderata for Probability in Branching Theories**
  1. **Numerical Adequacy (Born Rule Compliance)**  
     - **Requirement**: The account must recover the standard Born rule probabilities (amplitude-squared weights) as operational predictions.  
     - **Motivation**: Without this, the theory fails empirically. Quantum mechanics is defined by its statistical predictions (e.g., particle detection rates, interference patterns). A "complete" theory must reproduce these.  
     - **Verdict**: **Genuine requirement**. Non-negotiable for any interpretation claiming empirical equivalence to standard QM.  

  2. **Subjective Uncertainty**  
     - **Requirement**: The account must explain why agents experience genuine uncertainty about future outcomes, despite all outcomes occurring in some branch.  
     - **Motivation**: Probability is meaningless without uncertainty. If agents know all outcomes *will* happen (just in different branches), there is no basis for betting, anticipation, or scientific testing—core activities for physicists.  
     - **Verdict**: **Genuine requirement**. Uncertainty is essential for the *use* of probability in decision-making.  

  3. **Non-Circularity / No Presupposition**  
     - **Requirement**: The account must not tacitly presuppose the Born rule (e.g., by assuming amplitude-squared weights as "probabilities" from the outset). Derivations relying on a pre-chosen measure over Hilbert space—*solely* because it yields the Born rule—are invalid.  
     - **Motivation**: To avoid question-begging. If the derivation assumes what it sets out to prove (e.g., "weights are probabilities"), it fails to *explain* probability. Physicists need a justification deeper than formal convenience.  
     - **Verdict**: **Genuine requirement**. Explanatory power demands derivation from non-probabilistic axioms.  

  4. **Branching Agnosticism (No World-Counting)**  
     - **Requirement**: The account must not depend on "counting" branches, as the decomposition of the universal wavefunction into "worlds" is non-unique (basis-dependent) and often continuous.  
     - **Motivation**: Branch structure is emergent, approximate, and defined by decoherence—it is not fundamental to the formalism. Probability cannot hinge on an arbitrary partition (e.g., treating branches as discrete "worlds" with equal weight).  
     - **Verdict**: **Genuine requirement**. The formalism fixes the state vector and its norm, not a privileged branching basis.  

  5. **Rational Agency (Weighted Preferences)**  
     - **Requirement**: The account must explain why rational agents should weight decisions/credences by branch amplitude (squared) rather than treating branches as equiprobable.  
     - **Motivation**: Without this, there is no normative force to the Born rule. If all branches are equally "real," why care more about low-weight branches? A working physicist needs grounds for *differential* betting behavior.  
     - **Verdict**: **Genuine requirement**. Probability must guide action in a way consistent with rationality (e.g., avoiding Dutch books).  

  ---

  ### **Tensions: Which Requirements Cannot Be Jointly Met?**  
  The core tension lies between **Subjective Uncertainty** and **Rational Agency**, exacerbated by **Non-Circularity**:  
  - **Uncertainty vs. Ontology**: If all outcomes occur, uncertainty seems paradoxical—yet we need it for probability to function.  
  - **Agency vs. Symmetry**: If branches are all real, why not treat them equally? But we must justify weighting by amplitude.  
  - **Circularity Trap**: Avoiding circularity forces derivations to start from non-probabilistic axioms (e.g., decision theory or symmetries), but these struggles to *simultaneously* explain uncertainty and rational weighting without smuggling in the Born rule.  

  **The irreconcilable pair**: **Non-Circularity** + **Subjective Uncertainty** + **Rational Agency**.  
  - **Why?**  
    - Self-locating uncertainty (e.g., "I don't know which branch I'm in") can generate uncertainty but fails **Rational Agency**: it doesn't explain why agents should weight branches unequally.  
    - Decision-theoretic approaches (e.g., Deutsch-Wallace) derive rational weighting but struggle with **Non-Circularity**: critics argue they implicitly assume the Hilbert space norm as a measure of value.  
    - Relative frequency approaches often violate **Branching Agnosticism** (by discretizing branches) or **Non-Circularity** (by assuming the measure).  
  - **Result**: No extant account satisfies all five. The trio above creates a "trilemma"—sacrifice one to satisfy the others.  

  ---

  ### **Which Requirement Eliminates the Most Candidates?**  
  **Non-Circularity** is the strongest filter, eliminating three major strategies:  
  1. **Decision-Theoretic (Deutsch-Wallace)**:  
     - Eliminated by **Non-Circularity**. Derives Born rule from rationality axioms but is accused of assuming the Hilbert space norm as the "currency" of utility (e.g., implicitly treating amplitudes as weights).  
  2. **World-Counting / Naive Frequentism**:  
     - Eliminated by **Branching Agnosticism** (assumes discrete, countable branches) and **Non-Circularity** (assumes equiprobability without justification).  
  3. **Self-Locating Uncertainty (Vaidman, Tappenden)**:  
     - Eliminated by **Rational Agency**. Generates uncertainty but cannot justify unequal weighting—agents might assign equal credence to all branches.  

  Only "timeless" (e.g., Carroll-Sebens) or "epistemic" (e.g., Zurek's envariance) approaches survive **Non-Circularity**, but they stumble on **Subjective Uncertainty** or **Rational Agency**.  

  ---

  ### **Confidence Assessments**  
  | **Claim**                                                                 | **Confidence** | **Reason for Uncertainty**                                                                 |  
  |---------------------------------------------------------------------------|----------------|--------------------------------------------------------------------------------------------|  
  | Numerical Adequacy is a genuine requirement                               | 100%           | Uncontroversial; empirical adequacy is non-negotiable.                                     |  
  | Branching Agnosticism is a genuine requirement                            | 95%            | Decoherence literature solidly shows branch non-uniqueness.                                |  
  | Non-Circularity is a genuine requirement                                  | 90%            | Some physicists accept "shut up and calculate" approaches.                                 |  
  | Rational Agency is a genuine requirement                                  | 85%            | One could argue probability needs no decision-theoretic foundation (e.g., frequentism).     |  
  | Subjective Uncertainty is a genuine requirement                           | 80%            | **Least sure**: Some (e.g., Carroll) argue probability can be "objective" without uncertainty. |  
  | Non-Circularity + Uncertainty + Rational Agency cannot be jointly satisfied | 75%            | Active research (e.g., McQueen, Vaidman) claims progress; consensus is elusive.             |  
  | Non-Circularity eliminates the most candidates                            | 95%            | Explicitly or implicitly, most derivations assume the measure.                             |  

  **Weakest claim**: **Subjective Uncertainty as a requirement**. If probability is purely "bookkeeping" for branch weights (e.g., "caring measure"), uncertainty might be illusory. But this clashes with how physicists *use* probability (e.g., in quantum computing or cryptography).  

  **Recommendation for seminar**: Focus on the **Uncertainty–Agency–Circularity trilemma**. It exposes why no-collapse probability remains contentious and forces clarity on whether "probability" is epistemic or ontological. For references, contrast Deutsch-Wallace (rationality-driven) with self-locating uncertainty (epistemic) and Carroll-Sebens (objective branch weights).
