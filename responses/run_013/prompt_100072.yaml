prompt: |-
  I am a doctoral student in political theory, and I have been trying, without much success, to write my way out of a dissatisfaction with how the "dirty hands" problem is usually posed. The standard framing seems to me to fixate on a single dramatic moment — a leader must choose between authorizing something monstrous and allowing something worse, does the monstrous thing, and emerges guilty though perhaps justified. My suspicion is that this framing has distorted the whole topic by treating the moral damage of politics as something that occurs at moments of decision. I have drafted the core of an alternative argument below; it is rough and closer to a sketch than to a finished essay. I would like you to respond as a sharp colleague rather than a cheerleader: tell me where the argument is genuinely confused, where it is merely dressing a familiar point in new vocabulary, and whether the distinction on which everything rests actually does any work. I would rather be told which parts to abandon than which parts to keep.

  The draft runs as follows. Most discussions of dirty hands take their model from the single dramatic moment, and this model has misled us, because it locates the moral damage of politics at the scene of a decision. I want to distinguish three ways a political actor's hands can get dirty, and to claim that the third — the one our concepts are worst equipped to describe — is where most of the damage actually accumulates. First, the decisive hand: you perform the act yourself. Second, the commissioning hand: you authorize, order, or sign off on someone else's performing it. Third, the custodial hand: you neither perform nor authorize any particular act, but you keep in being the institution, the budget line, the standing rule, or the norm through which a whole class of such acts is routinely performed by others — and you never once consider any individual instance of it. The mid-level official who administers a deportation quota without ever adjudicating a case has custodial hands; so does the legislator who votes for the framework and then forgets it; so, arguably, does the citizen who benefits from the arrangement and votes to preserve it. My claim is that the moral texture of the third case differs in kind, and that the dirty-hands tradition, built around the first case, systematically misdescribes it. Guilt for the decisive hand attaches to an act, and so it has an occasion — a moment one can point to, regret, and confess. Guilt for the custodial hand attaches instead to a standing relation rather than to any act, and so it has no occasion: there was no moment of decision, no scene in which one could have felt the weight of what one was doing. The consequence is that the custodial hand is typically not experienced as guilt at all, but as nothing, which is precisely what makes it durable. Worse, the standard exculpations — necessity, the lesser evil, the thought that the alternatives were worse — are available to the decisive and commissioning hands only because necessity is a property of choices made under constraint; the custodial hand has no analogous defense, since maintaining an institution is never necessary in that way, and one could always have spent one's career dismantling it. So the case with the weakest defense receives the least scrutiny, and I take that inversion to be the real scandal of the subject.

  Please give me, first, a short prose assessment, and then a structured summary as a JSON object with exactly the following fields: "overall_assessment" (two to three sentences giving your bottom line); "central_distinction_verdict" (one of "holds up", "partly holds up", "collapses into a restatement"); "central_distinction_reason" (one or two sentences justifying that verdict); "strongest_objection" (the single most damaging objection, stated as its proponent would state it); "weakest_step" (a string naming which of my claims or sentences is most vulnerable, with a one-sentence explanation); "accuracy_or_clarity_issues" (an array of strings, each a concrete problem of precision, overreach, or ambiguity); "concrete_revision" (one specific, actionable change); "recommended_cut" (the part of the draft I should delete, with a one-line reason); and "interest_rating" (an integer from 1 to 5, where 1 means the argument is uninteresting because it is already common coin and 5 means it is genuinely novel and worth developing).
reasoning: |-
  Okay, the user is a doctoral student in political theory struggling with the traditional framing of the "dirty hands" problem. They feel it's too focused on dramatic single moments of decision-making, which distorts the broader moral damage in politics. They've drafted an alternative argument introducing three categories: decisive hand (direct action), commissioning hand (authorizing others), and custodial hand (maintaining systems that enable harm without direct involvement). 

  The core frustration here is visible—they're dissatisfied with existing literature and want to push beyond the theatrical "trolley problem" style dilemmas. Their draft reveals a deeper concern about institutional complicity and the normalization of harm through bureaucratic structures. The emotional tone suggests intellectual restlessness and a desire for rigorous critique rather than validation.

  Hmm, their key innovation—the custodial hand concept—attempts to capture passive, structural wrongdoing. But is this truly novel? The resemblance to "administrative evil" and "structural violence" theories needs probing. The strongest part is how they identify the lack of "occasion" for guilt in custodial cases—that absence of a decisive moment makes moral reckoning impossible. That insight feels fresh.

  But there's tension in their claim that custodial hands lack necessity defenses. Isn't institutional maintenance sometimes framed as necessary? And their examples blur levels (citizen vs official). The legislator who "forgets" their vote—is that custodial or irresponsible commissioning? Needs sharper boundaries.

  Ah! The real vulnerability is the "no analogous defense" assertion. Critics would pounce here: institutionalists argue systems are necessary for order, even when flawed. And the citizen example risks overreach—voting isn't quite like budget administration. 

  For revisions, I'd suggest:
  - Clarify custodial hands as requiring systemic output without individual visibility
  - Drop the citizen parallel to avoid dilution
  - Tackle the necessity objection head-on: maybe custodial guilt stems from failing to interrogate the system, not maintaining it per se

  The 4/5 interest rating reflects real potential. This isn't just rebranding; it forces dirty hands theory to confront its blind spot for bureaucratic morality. With tighter definitions, it could reframe debates on complicity in modern states.
answer: |-
  Here’s a sharp colleague’s assessment, as requested:  

  ### Short Prose Assessment  
  Your core insight — that the "dirty hands" discourse over-indexes on punctual decisions while neglecting the moral corrosion of maintaining harmful systems — is potent and largely correct. The *custodial hand* concept usefully names a pervasive but undertheorized mode of political complicity. However, the distinction between "custodial" and "commissioning" hands risks collapsing in practice, as authorizing frameworks *is* a form of commissioning systemic acts. Your strongest contribution is highlighting the *absence of a guilt occasion* in custodial cases, which illuminates why systemic harm evades moral reckoning. But the claim that custodial hands lack necessity defenses is overstated; institutionalists constantly invoke systemic necessity (e.g., "dismantling this would cause chaos"). The argument needs tighter definitions and a clearer defense against objections that custodial guilt is just diluted commissioning guilt.  

  ### Structured Summary (JSON)  
  ```json  
  {  
    "overall_assessment": "The argument compellingly exposes a gap in dirty hands theory by shifting focus from dramatic decisions to institutional maintenance, but its key distinction blurs at the edges. The insight about guilt's 'lack of occasion' is novel and generative, though claims about defenses require qualification.",  
    "central_distinction_verdict": "partly holds up",  
    "central_distinction_reason": "While custodial hands usefully describe passive/systemic complicity, the line between 'authorizing a particular act' (commissioning) and 'maintaining a framework for acts' is often semantic; both involve enabling harm through governance choices.",  
    "strongest_objection": "Your 'custodial hand' is not meaningfully distinct from aggregated 'commissioning': maintaining a deportation system *is* authorizing its operations, just at a higher level of generality—and institutional necessity (e.g., 'order requires this apparatus') is routinely invoked to defend such maintenance.",  
    "weakest_step": "The claim that custodial hands have 'no analogous defense' to necessity (e.g., 'one could always dismantle the institution'). Explanation: This ignores how institutionalists frame maintenance *as* necessary (e.g., 'abolishing this agency would collapse essential services').",  
    "accuracy_or_clarity_issues": [  
      "Ambiguity: Does 'custodial' require total ignorance of individual acts (e.g., the official who 'never once considers any instance')? If so, most real-world cases blend custodial/commissioning.",  
      "Overreach: Equating citizens who 'benefit and vote' with hands-on custodians risks conflating democratic complicity with bureaucratic agency.",  
      "Precision: 'Guilt attaches to a standing relation' needs elaboration—is this guilt for enabling *potential* harm, or for actual harm caused?"  
    ],  
    "concrete_revision": "Clarify that the custodial hand's uniqueness lies in *how* guilt manifests (no occasion) and its *source* (upkeep of structures that *dissociate* actors from discrete harms), not in being defense-less. Contrast with 'commissioning' by emphasizing the lack of episodic responsibility.",  
    "recommended_cut": "Cut 'so, arguably, does the citizen...' Reason: It muddies the core argument about institutional actors and invites familiar debates about collective guilt.",  
    "interest_rating": 4  
  }  
  ```  

  ### Key Commentary Beyond the JSON  
  - **Where it’s genuinely confused**: The custodial hand’s "no necessity defense" claim contradicts real-world political discourse. Institutions *are* defended as necessary (e.g., "We need ICE to secure borders"). Your point should be that such defenses are *weaker* or *more dishonest* because they mask optionality, not that they don’t exist.  
  - **Where it’s dressing familiarity**: The critique of "dramatic moment" fixation echoes Arendt on thoughtlessness and bureaucracy, and the "no occasion for guilt" resonates with Fricker on hermeneutical injustice. But synthesizing these into the dirty hands lexicon *is* novel.  
  - **Where the distinction works**: The "no occasion" thesis is sharp and original. It explains why custodial guilt evades confession and thus perpetuates harm—this is your ace. Isolate and amplify this.  
  - **Revision Priority**: Drop the citizen example (it’s a distraction) and refine custodial hands around *structured ignorance* (e.g., systems designed to obscure individual harm). This avoids blurring with commissioning.  

  **Bottom Line**: This is 80% of a breakthrough argument. Focus on the *phenomenology of guilt* (or its absence) in systems, drop overambitious claims about defenses, and ruthlessly clarify the custodial category. Abandoning the citizen parallel and tightening "custodial" to require *systemic dissociation* will pay dividends.
