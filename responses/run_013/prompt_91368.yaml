  The user's hypothesis is that a dispute is verbal if parties agree on all facts when rephrased in the other's vocabulary. I need to test this against the cases. For the burrito example, if both agree on the ingredients and structure, rephrasing might show they're using "sandwich" differently. That fits. But for composite objects, if rephrased, they might still disagree on fundamental ontological facts, so it's not verbal. The hypothesis seems useful but insufficient for deep metaphysical disputes.

  Next, listing desiderata. Non-negotiable requirements include resolving the core cases, distinguishing verbal from substantive/trivial disputes, handling linguistic drift, explaining participant resistance, and avoiding circularity. The tomato case requires recognizing multiple legitimate meanings, so the theory must allow for contextual correctness. The physicists' sign convention is a clear verbal dispute due to definitional differences, so the theory must flag such cases easily.

  The user mentioned distinctions like verbal vs. trivial vs. unresolvable. A trivial dispute might have an obvious answer, while verbal is about meaning. Unresolvable could be due to deep disagreements, not just words. The theory must separate these. Also, sources like ambiguity, vagueness, polysemy need different handling—ambiguity might be resolved by disambiguation, while polysemy involves related meanings.

  Sociologically, participants resist the "just verbal" label because it feels dismissive. A good theory should explain this, perhaps by acknowledging that verbal disputes can mask deeper conceptual or value conflicts. For example, the burrito argument might really be about cultural identity or categories, not just words.

  Testing the main camps: The "no genuine disagreement" camp (like Chalmers) handles cases like the physicists well but struggles with composite objects. The "different concepts" camp might handle linguistic drift but could blur conceptual vs. verbal disputes. The "substantive" camp risks dismissing genuine verbal disputes as substantive.

  The user wants a usable theory. If a requirement leads to an abstract theory, like needing possible-worlds semantics, it might not be practical. The rephrasing criterion is usable but might not resolve deeper disputes. So, balancing usability with theoretical depth is key. Maybe combining rephrasing with a shared ontology check could help, but that's complex.

  The most damaging requirement is likely the composite objects case, as it challenges whether any dispute is purely verbal when ontology is involved. If the theory can't handle that, it fails for metaontology. Also, participant resistance is crucial because if the theory doesn't explain why people care, it won't be accepted.

  In conclusion, the desiderata list must include resolving the five cases, key distinctions, linguistic and social constraints, usability, and non-circularity. The rephrasing hypothesis is a good start but needs supplementation for ontological disputes. A hybrid approach might be necessary, though it risks complexity. The group might need to prioritize some requirements over others based on their focus, like metaontology versus everyday disputes.
answer: |-
  Here’s a distilled desiderata list for a theory of verbal disputes, designed to cut through fluff and flag tensions. The non-negotiables (★★★) are grounded in your cases and core philosophical/linguistic constraints. The list exposes a critical tension between **resolving ontological disputes** and **preserving usability**.

  ---

  ### **Core Desiderata (Non-Negotiable ★★★)**
  1. **Resolve the Burrito Problem (Case 1)**  
     *Requirement:* Must diagnose why disputes over category boundaries (e.g., "is a burrito a sandwich?") feel substantive but lack traction.  
     *Motivation:* Demonstrates **vagueness/polysemy** in everyday language. A theory must distinguish *verbal* disagreements (about definitions) from *substantive* ones (about facts).  
     *Test:* If both parties agree on all physical properties of the burrito (ingredients, structure) but still disagree on the label, the dispute is verbal.

  2. **Handle Contextual Correctness (Case 2: Tomato)**  
     *Requirement:* Must allow that *both* "tomato is a fruit" (botanical) and "tomato is a vegetable" (culinary) can be correct without contradiction.  
     *Motivation:* Shows **domain-relative meaning**. A theory must explain why disputes arise when contexts clash, but neither side is "wrong."  
     *Test:* Failure here collapses contextual nuance into "one true meaning" fallacies.

  3. **Flag Stipulative Disagreements (Case 3: Physicists)**  
     *Requirement:* Must identify disputes where disagreement vanishes once notational conventions (e.g., sign conventions) are made explicit.  
     *Motivation:* Pure **conventionality**. A theory must distinguish disputes about *worldly facts* from those about *representational choices*.  
     *Test:* If switching vocabulary (e.g., flipping signs) resolves the dispute, it’s verbal.

  4. **Preserve Substantive Metaphysical Disagreements (Case 4: Composite Objects)**  
     *Requirement:* Must **not** classify hard ontological disputes (e.g., "do composite objects exist?") as "merely verbal" if they reflect genuine conceptual/categorial divergence.  
     *Motivation:* Avoids trivializing metaphysics. If the theory flattens this to verbal disagreement, it fails metaontology.  
     *Test:* If parties agree on all physical facts but disagree on whether "object" applies to aggregates, the dispute may still be substantive (e.g., about parthood).

  5. **Explain Persistent Miscommunication (Case 5: Linguistic Drift)**  
     *Requirement:* Must diagnose disputes where parties use the same term with **slightly different, stable meanings** (e.g., "theory" in science vs. colloquial use).  
     *Motivation:* Highlights **polysemy without confusion**. A theory must capture how communication fails despite both sides using language consistently.  

  ---

  ### **Critical Distinctions the Theory MUST Preserve**
  - **Verbal vs. Trivial**: A trivial dispute has an obvious answer (e.g., "2+2=5"); a verbal dispute has *no* unique answer without disambiguation.  
  - **Verbal vs. Unresolvable**: Some disputes are unresolvable due to evidence gaps (e.g., "what killed Napoleon?"), not meaning variance.  
  - **Resolving vs. Dissolving**: Resolving settles a question; dissolving shows the question was malformed (e.g., "how many hairs make a bald man?").  
  - **Ambiguity vs. Vagueness vs. Polysemy**:  
    - *Ambiguity*: "Bank" (river/finance) → clear disambiguation possible.  
    - *Vagueness*: "Sandwich" → no sharp boundaries.  
    - *Polysemy*: "Line" (geometry/queue) → related meanings.  
    **Motivation:** Each requires different diagnostic tools.  
  - **Words vs. Concepts**: Disputes can be verbal due to lexical ambiguity ("chip" = snack/silicon) or conceptual divergence (e.g., "justice" in utilitarianism vs. deontology).

  ---

  ### **Sociological & Linguistic Constraints**
  1. **Participant Resistance (★★★)**  
     *Requirement:* Explain why parties reject the "merely verbal" label (e.g., in burrito/tomato cases).  
     *Motivation:* People often intuit that categorization reflects deep principles (e.g., social identity in "is hot dog a sandwich?"). A theory must acknowledge that **verbal disputes can proxy for value-laden or conceptual commitments**.

  2. **Usability Constraint (★★★)**  
     *Requirement:* The test for verbal disputes must be applicable without omniscience (e.g., no access to "ideal translations").  
     *Motivation:* If the theory requires impossible epistemic access, it’s useless for real disputes.

  ---

  ### **Stress-Testing Your Hypothesis**  
  > *Hypothesis: A dispute is verbal iff parties agree on all facts when rephrased in the other’s vocabulary.*  

  - **Strengths**:  
    - Nails Cases 1 (burrito) and 3 (physicists): Rephrasing "sandwich" or flipping signs resolves disagreement.  
    - Handles Case 5 (linguistic drift): Translating terms exposes misalignment.  
  - **Weaknesses**:  
    - **Fails Case 2 (tomato)**: Rephrasing "fruit" in culinary terms doesn’t resolve dispute—parties *disagree on which context is relevant*.  
    - **Fails Case 4 (composite objects)**: Rephrasing "object" in nihilist vs. universalist terms may not yield agreement—they disagree on *what exists*, not just words.  
    - **Circularity Risk**: "Agreeing on all facts" assumes facts are vocabulary-neutral, which is contested in metaphysics.  
  - **Verdict**: **Necessary but insufficient**. It captures *core* verbal disputes but falters on contextual and ontological cases. Needs augmentation for domain-relativity.

  ---

  ### **How Major Camps Fare Against Desiderata**
  | **Camp**                          | **Strengths**                                  | **Failures**                                  | **Usability** |  
  |-----------------------------------|-----------------------------------------------|----------------------------------------------|--------------|  
  | **1. "No Genuine Disagreement"** (e.g., early Carnap) | Clears Cases 1,3,5. Simple. | Fails Case 4 (collapses ontology to verbal). Ignores participant resistance. | High |  
  | **2. "Different Concepts"** (e.g., Chalmers) | Handles Cases 1,4,5. Distinguishes words/concepts. | Struggles with Case 2 (tomato: same concept, different contexts?). "Concept" is elusive. | Medium (requires conceptual analysis) |  
  | **3. "Substantive Dodge"** (e.g., Sider) | Preserves Case 4 as substantive. Explains resistance. | Overlooks Cases 1,3,5 (risks denying verbal disputes exist). | Low (demands metaphysical insight) |  

  ---

  ### **The Tension That Breaks Most Theories**  
  **The Ontological Usability Paradox (★★★)**:  
  - **Requirement**: To satisfy Case 4 (composite objects), the theory must allow that some disputes are substantive *despite* agreement on physical facts.  
  - **Conflict**: This requires judging whether disagreement is "conceptual" or "worldly," which demands a heavyweight metaphysics of concepts—**violating Usability**.  
  - **Result**: *No theory satisfies all desiderata*. If you demand ontological seriousness (Case 4), usability suffers. If you demand usability, you risk flattening ontology (Case 4 fails).  

  ---

  ### **Recommendation: A Hybrid Approach**  
  1. **Adopt a "diagnostic flowchart"**:  
     - Step 1: **Rephrase claims** in neutral vocabulary (handles Cases 1,3,5).  
     - Step 2: Check for **context collapse** (e.g., tomato: is there domain conflict?).  
     - Step 3: Assess if disagreement persists **after fixing conventions/concepts** (e.g., physics signs). If yes, it’s substantive.  
  2. **For ontology (Case 4)**: Accept that disputes *start* as verbal but may reveal **conceptual divergence** with normative stakes (e.g., "what must a fundamental theory quantify over?"). This avoids dismissing them as "merely verbal" while acknowledging semantic roots.  

  **What You Sacrifice**: A unified, elegant theory. But you gain a tool that works for 80% of cases (burritos, tomatoes, physics) and flags ontological disputes as "high-risk" for deeper conceptual work. The key is to **separate diagnostic criteria** (is this verbal?) from **metaphysical significance** (does it matter?).
