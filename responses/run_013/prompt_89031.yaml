prompt: |-
  My friend and I have just spent a long evening arguing about whether a Newtonian and an Einsteinian are even talking about the same thing when they both say "mass," and we ended it unable to agree on what would settle the matter. So before I read another account of incommensurability, I want the specification: what must any adequate theory of incommensurability deliver? Set out the requirements, each with the case or consideration that motivates it — the episodes it has to handle (the chemical revolution, the Newtonian-to-relativistic shift in the concept of mass, the move to Copernican astronomy), the distinctions it must not collapse (meaning versus standards of theory choice versus perceptual and practical training; local versus global holism; a graded loss of translatability versus an all-or-nothing gap between paradigms), and the constraints it must respect (that scientists on either side of a revolution do communicate, argue, and are sometimes persuaded; that we can still say the earlier theory got something wrong). Then add the requirements I would not think to ask for: what incommensurability is supposed to be a relation between — paradigms, languages, models, practices, communities — whether it can be diagnosed from inside a paradigm or only in retrospect, and what observations about actual scientific practice would count as evidence against the theory. Finish by telling me which of these requirements cannot be jointly satisfied; my suspicion is that the demand that the theory explain the difficulty of theory choice and the demand that it leave rational persuasion intact pull against each other, but I want to know where the real conflict lies. Don't bother ranking the familiar accounts against the list — the list is the deliverable.
reasoning: |-
  Okay, the user is asking about the requirements for an adequate theory of incommensurability. They had an argument with a friend about whether Newtonian and Einsteinian "mass" refer to the same thing. They want a clear set of criteria that any good theory of incommensurability must meet.

  First, I need to recall what incommensurability means in philosophy of science. It's from Kuhn and Feyerabend, about how scientific paradigms can be so different that they can't be fully compared. The user mentions specific cases: chemical revolution, mass in Newton vs Einstein, Copernican shift. So the theory must handle these historical episodes.

  The user lists several requirements. They want distinctions like meaning vs standards of theory choice, local vs global holism, and degrees of translatability. Also, constraints like scientists communicating across paradigms and earlier theories being wrong. Plus, they mention aspects they might not think of, like what entities incommensurability relates and whether it can be diagnosed from within a paradigm.

  I should structure the requirements into categories: historical adequacy, conceptual distinctions, constraints from scientific practice, meta-requirements, and potential conflicts. Key points: scientists do argue and persuade across paradigms, so communication must be possible even if partial. Also, we need to say past theories were incorrect, so incommensurability can't imply total isolation.

  What might the user miss? The relata—what incommensurability applies to. Is it between languages, paradigms, models? Also, whether it's retrospective or can be seen from inside. Evidence against would be if scientists easily translate or compare theories without issues.

  The user suspects a conflict between explaining difficult theory choice and allowing rational persuasion. I need to address that. The tension is real: if theories are incommensurable, how can scientists rationally persuade each other? The theory must show partial communication is possible, using shared methods or values, even if terms differ.

  Also, local incommensurability might help—only some terms are problematic, not the whole theory. This avoids global holism issues. But then translatability becomes a gradient, not all-or-nothing. That could resolve some tension.

  The central conflict is between robust incommensurability (making theory choice hard) and minimal translatability (allowing communication). Too much incommensurability risks making persuasion irrational; too little can't explain historical disputes. The theory needs a balance, perhaps through partial references or shared standards despite meaning variance.

  Deep needs: User wants clarity after a frustrating debate. They might seek a framework to evaluate incommensurability claims themselves, not just summaries of existing theories. They value precision in distinguishing concepts and practical implications for scientific practice. Ensuring the answer addresses both philosophical rigor and real-world scientific communication is key.
answer: |-
  Here is a comprehensive specification for an adequate theory of incommensurability, detailing the requirements, their motivations, and inherent tensions:

  ### I. Historical & Empirical Adequacy: Must Explain Key Episodes
  1.  **The Chemical Revolution (Lavoisier vs. Phlogiston):**
      *   **Requirement:** Explain why "dephlogisticated air" (Priestley) and "oxygen" (Lavoisier) weren't simply different names for the same thing, and why communication/understanding was profoundly difficult.
      *   **Motivation:** Shows shifts in taxonomy (e.g., "air" vs. distinct gases), causal roles, and experimental significance.
  2.  **Newtonian-to-Relativistic Mass:**
      *   **Requirement:** Explain the nature of the shift: Is Newton's "mass" (invariant quantity of matter, additive) the *same concept* as Einstein's relativistic mass (velocity-dependent) or his invariant rest mass? Account for the predictive continuity *and* conceptual rupture.
      *   **Motivation:** Core case for conceptual change in fundamental physics; involves mathematical continuity but ontological shift (space-time dependence).
  3.  **Copernican Revolution:**
      *   **Requirement:** Explain not just the shift from "planet" (wandering star) but the profound change in the meaning of "motion," "earth," "heaven," and the relationship between astronomy and physics. Account for resistance beyond empirical fit.
      *   **Motivation:** Demonstrates holistic change affecting core concepts and worldview, impacting physics, cosmology, and theology.

  ### II. Essential Conceptual Distinctions: Must Not Collapse
  4.  **Meaning vs. Standards of Theory Choice:**
      *   **Requirement:** Clearly distinguish changes in the *meaning* of terms/concepts from disagreements about *epistemic values* (e.g., simplicity, scope, accuracy) or methodological rules.
      *   **Motivation:** Scientists can agree on values but disagree on which theory best embodies them *because* they interpret the world/terms differently. Confusion here leads to misdiagnosing disputes.
  5.  **Meaning vs. Perceptual/Practical Training:**
      *   **Requirement:** Distinguish conceptual understanding/knowledge (what terms *mean*) from the practical skills of perception ("seeing as") or manipulation acquired within a paradigm.
      *   **Motivation:** Kuhn's "world-change" involves both. A theory must account for how training shapes perception *and* conceptualization without reducing one to the other.
  6.  **Local vs. Global Holism:**
      *   **Requirement:** Allow for *local* incommensurability (affecting specific clusters of interrelated concepts - e.g., mass/space/time; phlogiston/combustion/air) without necessitating *global* holism (where *every* concept changes meaning with *any* change).
      *   **Motivation:** Global holism makes communication across *any* theoretical divide implausible and contradicts historical evidence of partial understanding/translation. Local holism is more plausible and fits episodes better.
  7.  **Graded Loss vs. All-or-Nothing Gap:**
      *   **Requirement:** Treat translatability as a *matter of degree*, not a binary state. Explain *how much* and *in what ways* translation is difficult, partial, or requires significant reinterpretation, rather than declaring it impossible.
      *   **Motivation:** Historical cases show *pockets* of untranslatability or severe distortion, not total failure. Scientists *do* communicate, albeit imperfectly and with effort. Absolute gaps are empirically untenable.

  ### III. Constraints from Scientific Practice: Must Respect
  8.  **Communication & Argument Across Paradigms:**
      *   **Requirement:** Explain how scientists holding incommensurable theories *can* argue, present evidence, criticize each other, and sometimes even persuade one another, despite the conceptual differences.
      *   **Motivation:** Historical fact (e.g., debates between Newtonians and Cartesians, Einstein and Lorentz, Bohr and Einstein). Denying this makes scientific change irrational or mysterious.
  9.  **Rational Persuasion Possible:**
      *   **Requirement:** Show how theory choice, while difficult and not dictated solely by logic+evidence, can still be a *rational* process involving shared (even if interpreted) values, problem-solving success, and partial communication.
      *   **Motivation:** To avoid collapsing into relativism or irrationalism. Scientists *are* persuaded by arguments they find compelling within their evolving understanding.
  10. **Earlier Theory Can Be Wrong:**
      *   **Requirement:** Allow for the objective judgment that a superseded theory (e.g., Newtonian mechanics, Phlogiston theory) was *incorrect* or *significantly inaccurate* in its descriptions/explanations, even if its concepts were deeply embedded in its paradigm.
      *   **Motivation:** Preserves the realist intuition and progress narrative of science without denying the radical nature of conceptual change.

  ### IV. Meta-Requirements: Clarifying the Theory's Scope
  11. **Specify the Relata:**
      *   **Requirement:** Explicitly state what incommensurability is a relation *between*. Options include: paradigms, lexicons/languages, conceptual schemes, theoretical matrices, models, practices, or communities. Justify the choice.
      *   **Motivation:** Vagueness on this point leads to confusion. Is it about words, concepts, worldviews, or social groups? The relata impact the mechanism and severity of incommensurability.
  12. **Diagnosability: Internal vs. Retrospective:**
      *   **Requirement:** Address whether participants *within* a paradigm can recognize potential incommensurability with rivals, or if it's only identifiable *after* a paradigm shift has occurred (retrospectively).
      *   **Motivation:** Kuhn leaned retrospective, but this seems too strong. Can scientists anticipate translation difficulties? This affects the dynamics of debate.
  13. **Falsifiability/Evidence Against:**
      *   **Requirement:** Specify what empirical observations about scientific practice or history would count as evidence *against* a particular theory of incommensurability.
      *   **Motivation:** To avoid being an unfalsifiable dogma. Examples: Evidence of effortless, precise, and comprehensive translation between rival theories; evidence that scientists *never* talk past each other in deep conceptual disputes; evidence that core meanings of central terms remain completely stable through major revolutions.

  ### V. The Central Tension: Where Requirements Pull Apart
  The most significant conflict lies between the requirements driven by **explaining the profound difficulty of theory choice** and those driven by **preserving rational communication and progress**:

  *   **Explaining Difficulty (Robust Incommensurability):** To explain why paradigm shifts are revolutionary, traumatic, and involve deep disagreement seemingly resistant to straightforward empirical resolution (Requirements I.1-3, II.4, II.7 - loss), the theory needs significant conceptual divergence (local holism - II.6). Meaning variance (II.4) must be substantial enough to make shared criteria (II.4) hard to apply univocally and translation (II.7) significantly distorted. This pushes towards stronger forms of incommensurability.
  *   **Preserving Rationality & Communication (Minimal Translatability):** To account for cross-paradigm argument, persuasion (III.8, III.9), and the ability to judge prior theories wrong (III.10), the theory needs sufficient *common ground*. There must be enough stability in reference, shared values (even if weighted differently), or overlapping practices to enable meaningful dialogue and comparative evaluation. This pushes towards weaker forms of incommensurability, emphasizing partial translation (II.7), local holism (II.6), and distinguishing meaning from values/practice (II.4, II.5).

  **The Core Conflict:** **The demand for robust meaning variance/holism sufficient to explain revolutionary rupture directly challenges the demand for sufficient semantic stability/common ground to explain cross-paradigm argument and rational theory choice.**

  *   **Robust Incommensurability Risks:** Making persuasion seem irrational (violating III.9), making cross-paradigm communication largely illusory (violating III.8), and potentially undermining the ability to say the old theory was *wrong* in a shared sense (complicating III.10).
  *   **Minimal Translatability Risks:** Explaining revolutionary rupture as merely a large accumulation of incremental changes or disagreements resolvable by shared standards, failing to capture the genuine conceptual transformation and "world-change" described in historical episodes (weakening I.1-3, II.6).

  **Resolution?** An adequate theory must navigate this tension by:
  1.  Emphasizing **local holism** (II.6) - rupture affects *specific, crucial* concept clusters, not everything.
  2.  Insisting on **graded translatability** (II.7) - translation is *difficult, distorting, and incomplete* for core terms/concepts, not impossible for all discourse.
  3.  Leveraging **shared practices/perception** (II.5) and **partially shared values** (II.4) as bridges, even when core theoretical meanings diverge.
  4.  Explaining persuasion as often involving a **gestalt shift** or **learning a new language/way of seeing**, facilitated by shared problems, anomalies in the old framework, and the perceived problem-solving power of the new, *even if full understanding precedes commitment*.

  **The Irreducible Tension:** While the above mitigates the conflict, the pull remains. A theory maximizing robustness risks sacrificing rationality/communication; a theory maximizing translatability risks minimizing the revolutionary aspect. The best theories acknowledge this tension as inherent in radical conceptual change itself. They explain *why* communication is hard *and* how it's still possible, why choice is underdetermined *and* how it can be rational, why the old was wrong *and* how its concepts made sense within its framework. The tension isn't resolvable by eliminating one pole; it must be managed.
