answer: |-
  Okay, let's break down that passage from the Sentences Commentary and fit it into Aquinas's broader view on obedience and tyranny. Forget the Latin for a moment and focus on the concepts – the Latin just frames the question.

  **Unpacking the Sentences Passage (II Sent., d. 44):**

  1.  **The Question Aquinas is Addressing:** "Hic oritur quaestio non transilienda silentio. Hic inquirit de obedientia debita his qui a Deo potestatem habent..."
      *   **Translation:** "Here arises a question not to be passed over in silence. Here he [Peter Lombard, the author of the Sentences Aquinas is commenting on] inquires about the obedience owed to those who have power from God..."
      *   **The Core Question:** Is obedience to secular rulers *absolute* because they have power "from God"? Must subjects *always* obey, no matter what the ruler commands? This arises specifically in the context of commenting on St. Paul's command in Romans 13:1-2 ("Let every person be subject to the governing authorities...") which seems to imply universal obedience.

  2.  **The Resolution Aquinas Gives:** "...et primo movet quaestionem; secundo solvit, ibi: sed sciendum est, apostolum ibi loqui de saeculari potestate."
      *   **Translation:** "...and first he [Lombard] raises the question; second, he solves it, where he says: 'But it must be known that the Apostle there speaks of secular power.'"
      *   **Aquinas's Point (Expanding on Lombard):** Aquinas agrees with Lombard's solution. St. Paul *is* speaking about *legitimate* secular power ("saeculari potestate"). The key implication is that **obedience is owed only to commands that fall within the legitimate scope and purpose of that God-given authority.**

  3.  **The Crucial Distinction Made Here (Implicitly):**
      *   **Legitimate Authority vs. Illegitimate Command:** A ruler *as such* has authority from God for the common good. But *specific commands* can fall outside that purpose. Aquinas explicitly states elsewhere in his works (like the *Summa Theologiae*) that **we must obey in matters pertaining to the common good and the ruler's just jurisdiction, but we are *not* obliged to obey unjust commands or commands that exceed the ruler's authority.** This is the fundamental resolution to the question raised. Obedience is conditional on the *justice* and *scope* of the command.

  **How This Fits with *On Kingship* and Tyrannicide:**

  Aquinas's thought is remarkably consistent on this point. Here's how it all connects:

  1.  **Foundation (From Sentences & ST): Obedience is Conditional.** Secular authority exists for the common good (derived ultimately from God). Therefore, obedience is only owed *to the extent that the ruler commands just things within his authority*. Commands that are unjust (e.g., commanding idolatry, theft, murder) or beyond his competence (e.g., commanding purely spiritual matters) *need not and should not be obeyed*. A ruler who habitually commands unjustly undermines the very legitimacy of their rule.

  2.  **Tyranny Defined:** A tyrant, for Aquinas, is precisely a ruler who *rules for their own private benefit rather than the common good*. They habitually issue unjust commands.

  3.  ***On Kingship* (De Regno) - The Practical Framework:** Here Aquinas addresses the *practical question* of how to *deal* with a tyrant.
      *   **Toleration as Prudence:** If attempting to overthrow the tyrant would likely cause *even greater evils* than the tyranny itself (e.g., civil war, invasion, anarchy leading to worse oppression), then *prudence* dictates that the lesser evil (tolerating the tyrant) should be chosen. This isn't approval of tyranny, but a recognition of fallen reality and the need to avoid greater harm. (*On Kingship*, Book I, Ch. 6)
      *   **Public Authority, Not Private Presumption:** Crucially, Aquinas states that deposing or removing a tyrant **"does not pertain to private individuals but to public authority"** (*On Kingship*, Book I, Ch. 6). Why?
          *   **To Avoid Anarchy:** Private individuals acting on their own judgment risk chaos, vendettas, and simply replacing one tyrant with another.
          *   **Legitimacy of Action:** "Public authority" could mean:
              *   A superior authority within the political structure (e.g., nobles, estates, a council empowered by law to check the king).
              *   The community *as a whole* acting in an organized manner according to whatever legitimate mechanisms exist (or can be reasonably constituted) for the common good. Aquinas sometimes references the people granting power and thus potentially having a role in removing it if abused, though he is cautious.
              *   **Not** random individuals acting as vigilantes.

  4.  **The "Praiseworthy Tyrannicide" Idea:** This is where context is *everything*. Aquinas *does* say things like:
      *   "To kill a tyrant is... an action of the highest excellence" (*Commentary on the Sentences*, II, d. 44, q. 2, a. 2 - often cited but needs context!).
      *   BUT he immediately qualifies this. He is *not* endorsing private assassination. He is making a *theoretical* point:
      *   **Distinction:** He contrasts killing an *evildoer* (like a tyrant) with killing an *innocent person*. Killing an innocent person is always wrong. Killing an evildoer *is not intrinsically evil*; it *can* be just (e.g., a soldier in a just war, an executioner carrying out a just sentence).
      *   **The Crucial Condition:** The justice of killing the evildoer (tyrant) depends **entirely on who does it and by what authority**. He explicitly states it is praiseworthy *only if done by public authority* ("ex publica auctoritate"). A private individual usurping this authority commits murder. (This is the key passage often missed by those claiming Aquinas endorsed private tyrannicide).

  **Synthesizing the Answer to Your Questions:**

  1.  **What is the Sentences passage saying?** It establishes the foundational principle: Obedience to rulers is *not* absolute; it is owed only to just commands within the ruler's legitimate authority. St. Paul commands obedience to *legitimate secular power*, not to tyranny or unjust decrees.
  2.  **How does it fit with *On Kingship*?** Perfectly. *On Kingship* builds on this principle:
      *   A tyrant, by definition, rules unjustly (violating the condition for obedience).
      *   Therefore, he *can* be removed.
      *   However, the *how* and *by whom* are critical to avoid greater evil and maintain order. Removal must be an act of public authority, not private zeal.
  3.  **What are the key distinctions?**
      *   **Legitimate vs. Illegitimate Authority/Command:** Obedience hinges on this.
      *   **Tyrant vs. Legitimate King:** Defined by pursuit of private gain vs. common good.
      *   **Public Authority vs. Private Action:** This is the *most crucial* distinction regarding *removal*. Only public authority can legitimately depose or execute a tyrant. Private killing is murder.
      *   **Prudence vs. Principle:** The principle allows removal; prudence dictates *when and how* it should be done to avoid worse outcomes.
  4.  **Is there a real tension?** **No fundamental tension, only careful distinctions.** The apparent tension arises when quotes about tyrannicide being "praiseworthy" are ripped from their context. Aquinas *never* endorses vigilantism or private assassination. He consistently argues:
      *   Obedience is conditional (Sentences Commentary).
      *   Tyranny is illegitimate and harmful (On Kingship).
      *   Removal is *theoretically* justified and can be praiseworthy *if done properly* (Sentences Commentary, qualified).
      *   Removal *in practice* must be undertaken by public authority to be legitimate and avoid greater evils (On Kingship).

  **In essence:** Aquinas provides a nuanced framework. He denies absolute obedience to tyrants, affirms the right (even duty) of the community/public authority to remove them for the common good, but absolutely forbids private individuals from taking the law into their own hands. The "praiseworthiness" applies *only* to the act *when performed legitimately by public authority*, contrasting it with the intrinsic evil of murdering an innocent person. His concern is always order, justice, and the common good, rejecting both tyranny and anarchy.
