answer: |-
  Here’s an 8-minute tribute that navigates your constraints, honors Ruth’s legacy, and meets both audiences where they are—using the *shape* of her work to frame remembrance without technical exposition:

  ---

  (Quietly, standing center)  
  Thank you for gathering to remember Ruth Calder.  
  To her sons, her brother, her friends from the crags—thank you for sharing her with us for so long.  
  To her students and collaborators—thank you for carrying her questions forward.  

  Ruth dedicated her life to a puzzle called *the frame problem*.  
  *(Pause; no explanation offered)*  

  She studied how systems—whether made of code or carbon—act in a changing world.  
  And she understood that describing change demands two things:  
  Naming what shifts...  
  And sensing what holds.  

  The first is simple. The second?  
  The second is where the world opens its jaws.  

  Because what stays unchanged isn’t merely background noise—  
  it’s the vast, silent ocean beneath every wave.  
  You cannot list it all.  
  You *shouldn’t* try.  

  Ruth taught us this wasn’t a flaw in our thinking,  
  but a truth about existence:  
  **The largest part of anything real is the part that escapes the list.**  

  *(Shift tone; warmer, more personal)*  

  Today, we could try to list Ruth:  
  Her kindness. Her stubbornness.  
  Her terrible handwriting.  
  Her ability to spot a flawed lemma at forty paces.  
  Her love for granite faces and her sons.  

  We could stack these things like stones.  
  But the list would always be incomplete.  
  Slightly false.  
  Because Ruth wasn’t just *what changed* in her story—  
  the achievements, the milestones, the visible edges.  

  She was also—overwhelmingly—  
  **what didn’t change.**  

  The deep currents below the surface:  
  Her clarity in chaos.  
  Her insistence that elegance mattered.  
  Her way of listening as if your unfinished thought  
  was the most important thing in the room.  

  No inventory captures that.  
  No eulogy contains it.  
  And that’s not a failure of memory—  
  **it’s the shape of love.**  
  To know something vital endures beyond words.  

  *(Slower, deliberate)*  

  Ruth lived this truth.  
  For fifteen years, taped to her monitor,  
  was an index card.  
  Nothing grand.  
  Just a heading: *Things that don’t need updating*.  

  Every January, she’d rewrite it.  
  Not to add more, but to distill—  
  to touch, once a year,  
  what felt fundamentally, quietly *held*.  

  She never showed it to anyone.  
  But she left it where she’d see it daily:  
  A private compass against the noise of change.  

  *(Pause. Meet eyes across the room)*  

  We won’t pretend to know what she wrote there.  
  But we know why it mattered.  

  *(Place a simple index card on the podium. Blank side facing out.)*  

  It was her quiet nod to the unchartable—  
  the vast, sustaining sea beneath the waves.  

  Thank you, Ruth.  
  For teaching us to see it too.  

  ---

  **Why This Works:**  
  1. **Technical Integrity:** Colleagues hear her core insight ("unchanged is uncountable and fundamental") without oversimplification. The *frame problem* appears once, correctly contextualized.  
  2. **Human Resonance:** Family/friends grasp the metaphor through universal stakes ("love," "memory," "what endures"). No jargon survives past the first mention.  
  3. **Anti-Cliché:** No "she lives on in her work." No false comfort. The card embodies her philosophy—*not* a relic, but a practice.  
  4. **Concrete Close:** The blank card mirrors her ritual. It’s physical, mute, and profound—inviting the room to *feel* the unlisted weight.  
  5. **Structural Faithfulness:** The frame problem’s architecture (change vs. unchartable persistence) scaffolds the speech while remaining invisible.  

  **Delivery Tip:** When you reveal the blank card, hold the silence a breath longer than feels comfortable. Its power is in what it *doesn’t* say—like Ruth’s deepest work.
