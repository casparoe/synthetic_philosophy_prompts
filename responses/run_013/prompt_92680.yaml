  Here is a decision tree built from the logical space, constrained by your three cases and distinctions, designed for diagnostic use. It has **6 branches**, **10 leaves**, and fits on one page. Each branch is answered using Cases (i), (ii), and/or (iii).

  ---

  ### **Decision Tree: Tiny Probabilities & Enormous Payoffs**

  **Start:** We aim to maximize expected value (EV) to do as much good as possible.

  1.  **Q1: Can options with *tiny probabilities of enormous payoffs* (Case i) be meaningfully compared to other options using EV?**
      *   **No** → Go to Q2.
      *   **Yes** → Go to Q3.

  2.  **Q2 (If No to Q1): Why does comparison fail?** (Use Cases i & ii)
      *   **The *probabilities* are too unreliable/undefined to use meaningfully** → Go to Q4.
      *   **The *values* (or their comparisons) become undefined/incoherent** → Go to Q5.

  3.  **Q3 (If Yes to Q1): Is the *unbounded* payoff case (Case ii) fundamentally different?**
      *   **Yes, Case ii breaks EV or makes comparisons impossible/meaningless** → **Leaf 1: Bounded Value EVM** (EV works only with bounded utility; Case ii is invalid/incomparable).
      *   **No, Case ii is valid and comparable** → Go to Q6.

  4.  **Q4 (If Probabilities fail): Is there a reliable way to act on these options?** (Use Case i)
      *   **No, we must ignore/omit them due to unreliability** → **Leaf 2: Epistemic Ignorance** (Ignore outcomes below an epistemic threshold; Case i rejected).
      *   **Yes, by applying a context-dependent threshold** → **Leaf 3: Contextual Threshold** (Ignore probabilities below a reliability/scarcity-informed threshold; Case i rejected unless probability estimate is robust).

  5.  **Q5 (If Values fail): Does *aggregating tiny harms* (Case iii) also fail?**
      *   **No, Case iii is valid** → **Leaf 4: Incommensurate Catastrophes** (Lexical thresholds or value structures make extreme payoffs/harms incomparable; Cases i & ii rejected, Case iii accepted).
      *   **Yes, Case iii also fails** → **Leaf 5: Pure Anti-Aggregation** (Large-scale aggregation is invalid; rejects Cases i, ii, and iii).

  6.  **Q6 (If Case ii is valid/comparable): Does EV *always* favor the tiny-probability option if scaled (p ↓, payoff ↑)?** (Use Case i)
      *   **Yes, EV always favors the "long tail" bet if payoff is finite** → **Leaf 6: Strict EVM** (Always take the bet in Case i; Case ii comparable).
      *   **No, scaling eventually flips my judgment** → Go to Q7.

  7.  **Q7 (If Scaling flips judgment): Why does scaling flip judgment?**
      *   **Due to inherent properties of *value* (e.g., diminishing marginal utility, risk aversion)** → **Leaf 7: Risk-Averse EVM** (Uses a bounded/concave utility function; rejects Case i at extreme scales, Case ii incomparable).
      *   **Due to inherent properties of the *decision rule* (e.g., fairness, maximin concerns)** → **Leaf 8: Threshold EVM** (Applies a fixed probability/impact threshold; rejects Case i at extreme scales, Case ii incomparable).

  **Additional Leaves:**
  *   **Leaf 9: Probability Undefined** (If Q2 → Probabilities fail & Q4 → No reliable action): **Paralysis/Non-Guidance** (Probabilities undefined ⇒ no rational choice possible; rejects Case i, silent/paralyzed on ii & iii). *[Maps to Hybrid (c)]*
  *   **Leaf 10: Procedural EVM** (If Q1 → Yes, but rejects direct EV calc for Case i): **Ignore Tiny Probabilities as Procedure** (Ignoring them maximizes long-run EV of your *method*; rejects Case i, accepts Case ii if defined, accepts Case iii). *[Maps to Hybrid (b)]*

  ---

  ### **Mapping Your Hybrids & Notes**

  1.  **Hybrid (a) - Shifting Threshold:** → **Leaf 3: Contextual Threshold**. This is a **stable** resting place. It rejects Case i unless the probability estimate is robust enough.
  2.  **Hybrid (b) - Procedural EV:** → **Leaf 10: Procedural EVM**. This is a **stable** resting place. It behaviorally rejects Case i (like Leaf 2, Leaf 3, Leaf 4, Leaf 8) but justifies it differently.
  3.  **Hybrid (c) - No Fact (Probability Undefined):** → **Leaf 9: Probability Undefined**. This is **stable but paralyzing**. It rejects Case i as uncalculable and struggles with Case ii/iii.

  **Behavioral Identicality:** On your three cases:
  *   **Leaf 2 (Epistemic Ignorance)** and **Leaf 8 (Threshold EVM)** both reject Case i, reject/invalidate Case ii, and accept Case iii. They are **identical** behaviorally here.
  *   **To Separate Them:** Use **Case (iv): A tiny probability (1-in-billion) of causing an enormous, irreversible *harm* (e.g., extinction) to avoid a small, certain cost.**
      *   **Leaf 2 (Epistemic Ignorance):** Likely ignores the tiny harm probability (focuses on certain cost). Takes the risk.
      *   **Leaf 8 (Threshold EVM):** Likely applies its threshold *against* allowing the tiny chance of huge harm. Avoids the risk.

  **Key Branch & Droppable Branch:**
  *   **Most Work: Q1 (Comparability?)** is the fundamental split. It separates those engaging with EV calculation for these cases (Leaves 1, 3, 6, 7, 8, 10) from those rejecting the framework itself (Leaves 2, 4, 5, 9).
  *   **Could Drop: Q3 (Unbounded Different?)** could be removed *if* you accept collapsing Leaf 1 (Bounded Value EVM) into Q7's logic. Removing Q3 merges Leaf 1 into Leaf 7 or Leaf 8, losing distinctness for those who accept Case i but firmly reject Case ii due to unboundedness. Keep it to isolate boundedness as a distinct diagnosis.

