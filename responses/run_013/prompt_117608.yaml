prompt: |-
  I am preparing a seminar in which J. B. Priestley's An Inspector Calls is read alongside Peter Singer's argument about the drowning child, and I would like a genuine philosophical reading of the play rather than the usual examination-style commentary on social responsibility. I do not need a bibliography or a reading list: I know the play and I know Singer's essay, and what I want from you is the reading itself, argued through the scenes.

  The familiar move is to say that Priestley anticipates Singer — that the Birlings are bystanders who could have prevented a death at small cost, and that the Inspector exists to make them see it. I want you to take that suggestion seriously and then test it hard, because I suspect the play fits the drowning-child model much less well than the comparison suggests. Three things pull against it, and I should like your view on each.

  First, Singer's argument turns on a bad thing that someone standing at the edge of the pond can prevent here and now. Eva Smith's death is not an emergency of that kind; it is what a class system produces through ordinary decisions — a sacking, a jealous complaint to a manager, a charity committee's refusal, an affair, a young man's drunken cruelty and the money he steals to make amends. Most of these are ways of treating someone badly rather than missed opportunities to rescue. If the play's claim is that they add up to a killing, does that support a positive duty to prevent harm, or does it displace it in favour of something closer to a duty not to take part in an unjust structure? I would rather have a straight answer than a both-and.

  Second, the victim. The Inspector shows the photograph to one person at a time, and by the end the family can plausibly suppose that they were shown different women; the dead woman appears to them as Eva Smith, as Daisy Renton, and to Sybil's committee under the Birling name. Singer's case draws its force from an identifiable child in front of you, and there is a well-documented human tendency to act for identifiable victims while going numb before statistics. Priestley seems to withhold precisely that grip, and yet still expects us to feel the death. Is that a correction to Singer, or wishful thinking about how moral motivation works?

  Third, causation is distributed. No single member of the family could have saved her. Singer insists that it makes no difference whether I am the only person who could act or one among millions in the same position; but I have been persuaded by the suggestion that where a harm can be prevented only by many acting together, each of us owes no more than a fair share of what would be required if everyone did their part. Which principle does Priestley's chain of responsibility actually vindicate? And what of the ending — the family's relief when the hoax is exposed, followed by the second telephone call? Is that the demandingness problem dramatised, the moral demand returning just as the family has talked itself out of it, or merely a lesson about the fragility of guilt? I am also interested in the gap between what Singer's argument implies and what he asks of people in his public advocacy.

  Finally, tell me what the play's ground of obligation is. The Inspector appeals to a shared social body and to mutual responsibility, which is not obviously the same thing as Singer's impartial benevolence, and I want to know whether the difference matters or is merely rhetorical. And tell me what the play adds to the debate that argument on its own cannot — what it shows about how such obligations are learned, resisted and forgotten. Where the play resists the reading I am proposing, say so; do not force it into an illustration of a thesis.

  Write in British English. Finish with a final line beginning Verdict: followed by one of the words SUPPORTS, COMPLICATES or UNDERMINES, a dash, and one sentence of justification, giving your overall judgement on whether the play, taken as a whole, vindicates Singer's rescue model.
reasoning: |-
  Okay, the user is preparing a seminar comparing Priestley's "An Inspector Calls" with Singer's drowning child argument. They want a genuine philosophical reading that goes beyond the typical social responsibility commentary. They specifically want to test three key tensions between the play and Singer's model: (1) the nature of the harm (structural vs. immediate emergency), (2) the identifiability of the victim, and (3) distributed causation and fair shares.

  I need to address each tension directly without hedging. For the first point, Priestley's focus is clearly on structural harm through ordinary participation in unjust systems, not Singer's immediate rescue scenario. The chain of events shows how routine acts of callousness accumulate to destroy a life, emphasizing negative duties to avoid complicity rather than positive duties to rescue. 

  On the second tension, Priestley deliberately fractures Eva's identity (Smith/Renton/Birling) to challenge the identifiable victim effect. Yet he still demands emotional engagement—suggesting moral imagination can transcend Singer's reliance on visceral immediacy. This is both a critique and an ambitious psychological claim.

  For the third point, the play actually complicates Singer's "no difference" principle. Since no single Birling could have prevented Eva's death alone, collective responsibility becomes key. The ending—with their relief followed by the second phone call—brilliantly dramatizes how structural harm persists beyond individual moments of guilt. It highlights the demandingness problem while rejecting the idea that responsibility dissolves when harm isn't immediately visible.

  The grounding of obligation differs too: the Inspector appeals to organic social bonds ("members of one body"), contrasting sharply with Singer's utilitarian impartiality. This communal framing makes responsibility feel less abstract but risks parochialism. 

  Where the play shines is in dramatizing moral evasion—how guilt gets rationalized (Eric's "we did her in"), how class shields perception (Sybil's "girls of that class"), how relief obliterates resolve. It shows ethics as a lived struggle, not just a logical conclusion. 

  Verdict: COMPLICATES—while both condemn moral indifference, Priestley exposes the inadequacy of Singer’s rescue model for addressing harms embedded in social structures, demanding instead an ethics of systemic non-complicity.
answer: |-
  Here is a rigorous philosophical reading, testing the Singer analogy against the text and your specific concerns:

  **1. Structural Sin vs. Immediate Rescue:** Priestley absolutely displaces Singer's positive duty to rescue with a stringent negative duty not to participate in an unjust structure. Eva Smith’s death isn't a sudden accident the Birlings *failed to avert*; it is the direct, cumulative consequence of their *active choices* within a system rigged against her. Arthur Birling *sacked* her for asserting worker rights. Sheila *had her fired* from Milwards out of petty jealousy. Gerald *used* her as a disposable mistress. Sybil *denied her charity* based on class prejudice. Eric *impregnated and abandoned* her, then *stole* to provide relief. Each act, seemingly "ordinary" or "businesslike" to the perpetrator, is an exercise of power that incrementally strips Eva of dignity, security, and hope. The Inspector’s chain of causation reveals complicity, not bystander apathy. The "killing" is metaphorical only in the final act; it signifies the fatal outcome of systemic oppression enacted through individual agency. **The play's claim demands a duty *not to harm* through participation in exploitative social and economic structures, not a duty to rescue from isolated emergencies.** The "preventable harm" emerges *from* their actions, not *despite* their inaction.

  **2. The Unidentified Victim & Moral Motivation:** Priestley deliberately fractures Eva's identity (Smith/Renton/Birling) to *challenge* the very psychological crutch Singer relies upon – the identifiable victim effect. The play argues that our moral obligation should *not* depend on visceral proximity or a single, graspable image. The Inspector forces the family (and audience) to confront the *representative* victim: Eva Smith *is* the working poor, Daisy Renton *is* the vulnerable woman exploited by men, the Birling applicant *is* those denied dignity by institutional charity. The emotional force comes not from seeing "one child drowning," but from understanding the *pattern* and the *system* that produces countless "Evas." Priestley *is* engaging in ambitious wishful thinking about moral psychology. He suggests that reason and an understanding of social interconnection *can* and *should* generate the same imperative as immediate empathy for a singular victim. This is a direct *correction* to Singer, asserting that ethics must transcend the limitations of our evolved empathy triggers to address structural injustice. The Inspector’s success (temporarily) in shaming the family shows this *is* possible, even if the ending reveals its fragility.

  **3. Distributed Causation, Fair Shares & The Ending:** Priestley both utilises and complicates Singer’s "no difference" principle regarding collective responsibility. While no single Birling *alone* killed Eva, each action was *necessary* (though not sufficient) in the causal chain leading to her suicide. Singer would say each bears full responsibility for failing to prevent the outcome their actions contributed to, regardless of others' actions. However, the play subtly acknowledges the "fair share" problem. The Inspector isolates each act, holding each individual *fully* responsible for *their* contribution to the harm, not for failing to single-handedly save her. Arthur is culpable *for the sacking*, Sybil *for the refusal*, Eric *for the theft and abandonment* – each for their own violation of duty, not for failing to compensate for the others' violations. **The ending is key:** Their relief upon suspecting a hoax isn't *just* about escaping guilt; it’s a desperate attempt to dissolve the unbearable weight of *collective* responsibility and the implication that their *entire way of life* is culpable ("*we did her in*"). The second phone call is the return of the *structural* reality. It dramatises that the "demand" isn't a one-off rescue completed or avoided; it’s the unceasing demand of systemic injustice. The harm wasn't *just* Eva’s death; it’s the *ongoing* system that produces such deaths. Relief is fleeting because the ethical failure is embedded in their social existence. This transcends Singer’s rescue scenario, highlighting the relentless nature of obligations within an unjust world. The gap between Singer’s philosophical conclusion (give all excess income) and his advocacy (more modest giving) reflects this tension between individual action and systemic change – a tension Priestley places at the heart of the drama.

  **Ground of Obligation:** The Inspector grounds obligation firmly in **organic social interdependence**: "*We are members of one body. We are responsible for each other.*" This is fundamentally distinct from Singer's grounding in **impartial utilitarian benevolence**. For Singer, the obligation stems from the equal capacity of all beings to suffer and the principle of minimising suffering impartially. The Inspector’s appeal is communitarian: obligation arises from our inherent, inescapable connection within a specific social organism. Harm to one *is* harm to the whole body. This difference *matters profoundly*. Singer’s duty is universal but potentially abstract; the Inspector’s is contextual but deeply rooted in shared existence. Priestley implies that recognising our *embeddedness* is a more powerful motivator (though the ending questions its durability) than abstract calculation. It frames responsibility as intrinsic to relationship, not derived from consequence alone.

  **What the Play Adds:** The play uniquely dramatises the *psychology and sociology* of confronting systemic obligation:
  *   **Learning:** Through shock, shame, and the dismantling of alibis. The Inspector uses Socratic method, forcing self-recognition.
  *   **Resisting:** Via denial (Arthur), deflection (Gerald), temporary remorse overridden by self-interest (Sheila initially), appeals to respectability (Sybil), and ultimately, the desperate desire to dissolve collective guilt through disbelief.
  *   **Forgetting:** The ending chillingly shows how quickly guilt evaporates when the immediate pressure (the Inspector) lifts and the system (the police) offers an escape hatch. It exposes the fragility of ethical awakening against entrenched class interest and the allure of normalcy.
  The play resists being a neat Singer illustration because it insists on the *specificity* of class, power, and social structure. It shows obligation not as a discrete choice before a drowning child, but as a continuous demand embedded in every social interaction within an unequal system. The harm is not accidental; it is *manufactured* by the system the Birlings uphold.

  **Verdict: COMPLICATES –** While both condemn moral indifference and assert responsibility for preventable suffering, Priestley’s play fundamentally challenges Singer’s model by locating the harm within active participation in an unjust social structure, rejecting reliance on the identifiable victim, exposing the complexities of distributed causation within collectives, grounding obligation in organic social connection rather than impartial utility, and dramatising the immense psychological and social barriers to sustaining the recognition of systemic responsibility that Singer’s argument logically demands.
