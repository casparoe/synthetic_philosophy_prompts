  ### Classroom Simulation: Evolutionary Dynamics of Cooperation

  **Objective:** Simulate multi-level selection dynamics without upfront theory, focusing on empirical patterns that leave students unsure whether group selection is a distinct level or reducible to gene-level accounting. The payoff structure ensures that within groups, self-regarding behavior ("Grab") dominates contributing behavior ("Give"), but group totals increase with more contributors. Stakes are points toward candy prizes.

  ---

  ### **Materials & Setup**
  - **Students:** 14 students, divided into four groups (two groups of 3, two groups of 4). Assign groups randomly in Phases 1–3; allow self-selection in Phase 4.
  - **Roles:** 
    - **Scorekeeper (you or a student):** Manages the score table, calculates payoffs, enforces rules. Uses a one-page score table (template below).
    - **Students:** Make private choices each round. Receive trait assignments (initially random) and update cumulative scores.
  - **Materials:** 
    - Index cards (one per student per round) for secret choices (marked "Grab" or "Give").
    - Tokens (e.g., colored beads) to represent points (1 token = 1 point). 
    - Whiteboard to display group totals and class-wide frequency of "Give" choices.
    - Timer for rounds.
  - **Initial Trait Assignment:** Randomly assign "Grab" or "Give" to each student (aim for ~50% "Give" overall). Record starting traits on the score table.
  - **Payoff Table & Verification:**  
    Each student starts each round with an endowment of **10 points**.  
    - **Choice "Grab":** Keep 10 points + share of group project.  
    - **Choice "Give":** Contribute 10 points to group project.  
    - **Group project:** Total contributions multiplied by 1.5, divided equally among *all* group members.  

    **Payoff Formulas:**  
    - For a student in a group of size \(n\) with \(k\) "Give" contributors:  
      - **"Grab" payoff:** \(10 + \frac{(k \times 10 \times 1.5)}{n}\)  
      - **"Give" payoff:** \(0 + \frac{(k \times 10 \times 1.5)}{n}\)  

    **Verification of Conditions:**  
    1. **"Grab" always outperforms "Give" within a group:** Difference = 10 points (constant), regardless of others' choices.  
    2. **Group total strictly increases with contributors:**  
       - E.g., group of 3: All "Grab" = 30 points, 1 "Give" = 35 points, 2 "Give" = 40 points, 3 "Give" = 45 points.  
       - E.g., group of 4: All "Grab" = 40 points, 1 "Give" = 45 points, 2 "Give" = 50 points, 3 "Give" = 55 points, 4 "Give" = 60 points.  
    3. **Within-group advantage causes rapid decline of "Give":** 10-point gap ensures "Give" frequency drops ~50% in 3 rounds without intervention (as "Grab" reproduces more).  

  ---

  ### **Phase Rules & Mechanics**
  **Order of Operations per Round (all phases):**  
  1. Students write "Grab" or "Give" on index cards (secretly).  
  2. Scorekeeper collects cards, records choices, and calculates:  
     - Individual payoffs (add to cumulative scores).  
     - Group total (sum of payoffs).  
     - Class-wide "Give" frequency (display on whiteboard).  
  3. **Reproduction (Phases 1–4):** Assign traits for next round:  
     - For each group, calculate total payoff for "Grab" (sum of payoffs from "Grab" students) and "Give" (sum from "Give" students).  
     - Assign each student a new trait: Probability of "Give" = \(\frac{\text{Total "Give" payoff}}{\text{Group total payoff}}\), "Grab" otherwise.  
  4. **Additional mechanics (Phases 2–4):** Apply after reproduction.  
  5. Scorekeeper updates score table and resets for next round.  

  **Phase-Specific Rules (announced flatly):**  
  - **Phase 1 (Baseline: Within-Group Selection Only):**  
    - "Reproduction happens based on your group’s payoffs. I’ll assign your choice for next round."  
    - **Expected trajectory:** "Give" declines sharply (e.g., 50% → 25% → 10% → 5% in 3–4 rounds). Within-group advantage dominates.  
  - **Phase 2 (Add Group Extinction):**  
    - "New rule: Groups with total below threshold (12 × group size) go extinct. I’ll replace them by copying the highest-scoring group’s choices."  
    - **Thresholds:** Group of 3: 36 points; group of 4: 48 points.  
    - **Mechanics:** After reproduction, extinguish groups below threshold. For each student in extinct group, copy trait from highest-scoring group (weighted by payoffs).  
    - **Expected trajectory:** "Give" stabilizes or oscillates (e.g., 5% → 20% → 15% → 25%). Extinction rescues "Give" via between-group selection.  
  - **Phase 3 (Add Migration):**  
    - "New rule: After reproduction, I’ll move one random member between groups. Each group loses one member and gains one."  
    - **Mechanics:** After reproduction, shuffle one random student per group (e.g., Group A loses to B, B to C, C to D, D to A).  
    - **Expected trajectory:** "Give" collapses (e.g., 25% → 15% → 10% → 5%). Migration homogenizes groups, eroding between-group variation.  
  - **Phase 4 (Assortative Grouping):**  
    - "New rule: Form your own groups (sizes: 3,3,4,4)."  
    - **Mechanics:** Students group by shared trait (or freely). No other changes.  
    - **Expected trajectory:** "Give" recovers (e.g., 5% → 30% → 50%). Assortment restores between-group variation.  

  ---

  ### **Score Table Template (One Page, Fillable Live)**
  | Round | Group 1 (Size 3) | Payoffs | Group Total | Group 2 (Size 3) | Payoffs | Group Total | Group 3 (Size 4) | Payoffs | Group Total | Group 4 (Size 4) | Payoffs | Group Total | % "Give" (Class) |
  |-------|------------------|---------|-------------|------------------|---------|-------------|------------------|---------|-------------|------------------|---------|-------------|-------------------|
  | **0** | e.g., G,G,G      | 10,10,10| 30         | ...              | ...     | ...         | ...              | ...     | ...         | ...              | ...     | ...         | 50%               |
  | **1** | ...              | ...     | ...         | ...              | ...     | ...         | ...              | ...     | ...         | ...              | ...     | ...         | ...               |
  | **2** | ...              | ...     | ...         | ...              | ...     | ...         | ...              | ...     | ...         | ...              | ...     | ...         | ...               |
  *(Columns for Groups 2–4 identical to Group 1. "Payoffs" column lists individual amounts.)*

  ---

  ### **Timeline (90 Minutes Total)**
  - **0:00–0:05:** Opening script (below). Assign groups and initial traits. Distribute materials.  
  - **Phase 1 (Rounds 1–3):** 0:05–0:20 (5 min/round).  
  - **Phase 2 (Rounds 4–6):** 0:20–0:35 (5 min/round). Announce new rule at start.  
  - **Phase 3 (Rounds 7–9):** 0:35–0:50 (5 min/round). Announce new rule at start.  
  - **Phase 4 (Rounds 10–11):** 0:50–1:00 (5 min/round). Announce new rule; 1 min for grouping.  
  - **Debrief:** 1:00–1:25 (25 min).  
  - **Buffer/Q&A:** 1:25–1:30 (5 min).  

  **Opening Script (2 Sentences):**  
  *"Today we’re simulating evolutionary dynamics. You’ll make choices each round to earn points—remember, your goal is to maximize your personal score."*  

  ---

  ### **Debrief Script (Prompts & Key Points)**
  **Instructor Prompts (ask sequentially):**  
  1. *"Phase 1: What happened to contributors? Why?"*  
     - **Map to claim:** "Give" is group-beneficial but individually costly → within-group selection dominates.  
  2. *"Phase 2: Why did contributors persist despite the disadvantage?"*  
     - **Map to claim:** Extinction rule creates group-level selection—groups "reproduce" (via copying) and "offspring" resemble "parents."  
  3. *"Phase 3: Why did migration cause collapse without changing payoffs?"*  
     - **Map to claim:** Migration destroys between-group variation (groups no longer "resemble" parents), showing selection requires heritable units.  
  4. *"Phase 4: Why did contributors recover when you chose groups?"*  
     - **Map to claim:** Assortment restores heritability—groups become units with high fidelity.  

  **Deepening the Debate (Your Colleague’s Challenge):**  
  - *"Could we redescribe this as a trait spreading because it benefits carriers of the same variant? For example, in Phase 2, ‘Give’ persists because beneficiaries (group members) are likely to share the trait."*  
    - **Key:** Yes—this is inclusive fitness (benefits × relatedness/assortment). Phase 3 collapses because migration reduces assortment.  
  - *"Is this redescription a rival hypothesis or the same arithmetic?"*  
    - **Key:** Same arithmetic! Partitioning selection into within/between components (Price Equation) works at any level.  
  - *"Why, then, is there disagreement?"*  
    - **Key:** Not about math—it’s about *causal framing*. Is the group a "unit" (vehicle) being selected, or is it merely a context for gene/trait propagation? The simulation leaves this open.  

  **Predictable Problems & Mitigations:**  
  1. **Moralizing/Guilt:** Students may shame "Grab" players.  
     - **Mitigation:** Open with: *"This is not about morality—your job is to maximize points. Choices are private; no judging."*  
  2. **Binding Promises:** Students may pact to "Give," smuggling in enforcement.  
     - **Mitigation:** After first pact: *"Remember, no talking during rounds. Choices must be private and independent."* Debrief: *"Promises create within-group enforcement—a different dynamic we’re not testing today."*  
  3. **Extinction as Artificial:** "Real groups don’t vanish and get copied by a referee!"  
     - **Mitigation:** Debrief: *"True—this abstracts natural group reproduction (e.g., fission, colonization). But it captures heritability: offspring groups resemble parents."*  
  4. **Social Punishment:** A "Grab" player may be ostracized.  
     - **Mitigation:** Assign anonymous ID numbers for choices; discuss post-activity: *"Punishment is real, but it’s a separate mechanism—here, we isolate selection."*  

  **What the Activity Cannot Reproduce (Supply in Lecture):**  
  - **No Referee:** Real selection has no external enforcer—dynamics emerge from interactions.  
  - **Simultaneity:** Levels act continuously, not in discrete phases.  
  - **Variance Ratio:** Selection strength depends on genetic/trait variance *between* vs. *within* groups (not rules).  
  - **Heritability Complexity:** Traits aren’t perfectly inherited; mutations and environmental noise matter.  
  - **Scale:** Real systems involve nested hierarchies (genes, cells, individuals, groups).  
    **Closing Note:** *"This simulation simplifies to isolate logic—but in nature, these processes are messy, simultaneous, and unorchestrated."*  

  ---
  ### **Final Notes**  
  - **Phase 3 Collapse:** Critical for showing migration’s role. Verify with the expected trajectory (25% → 5% in 3 rounds). If "Give" doesn’t drop, increase migration (e.g., swap 2 members/group) or run extra rounds.  
  - **Why It Leaves Them Unsure:** The redescription in terms of assortment (inclusive fitness) is mathematically identical—students see the arithmetic is neutral, forcing them to grapple with interpretation.  
  - **Post-Activity:** Assign readings from Dawkins (gene-centric) vs. Wilson (group selection) to crystallize the debate.  

  This design ensures students *feel* the dynamics while the arithmetic rigorously maps to theory. By the end, they’ll grasp why the "levels of selection" debate transcends mere accounting—and why your colleague’s view isn’t easily dismissed.
