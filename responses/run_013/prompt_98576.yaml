  ## The Toast: For Eleanor

  [Raise glass, warm smile to the room, then specifically to Eleanor]

  Right then. Good evening, everyone. For those who might not know me, I had the distinct privilege – and occasional bafflement – of working alongside Eleanor for a good chunk of those twenty-six years she spent presiding over Leeds' finest theatre of the absurd... otherwise known as the Municipal Nuisance Tribunal. Now, for Eleanor’s family – lovely to see you all – picture this: a room where grown adults argue, with astonishing sincerity and occasionally elaborate decibel meters, about extractor fan hums, security lights casting unwanted spotlights on next door’s begonias, and the precise moment a bin lorry’s pre-dawn clatter transforms from 'necessary civic service' into 'personal vendetta against sleep'.

  [Light chuckle]

  Eleanor navigated this peculiar landscape not just with patience, though heaven knows she needed it, but with a formidable clarity. She had a rule. Her **threshold rule**. Announced at the start of every hearing like a secular commandment: *“A grievance that is beneath notice when it happens does not become a grievance by happening to a great many people, or to one person a great many times.”*

  [Pause, look to Eleanor]

  Immovable, Eleanor. Utterly immovable. It drove some petitioners spare. It made others quietly cheer. And it made half this room – the regulators, the acousticians, the economists nursing their drinks over there – spend decades either building temples to its brilliance or trying to dismantle it brick by brick. [*Nod towards the professionals, especially the feuding economist, with a slight knowing smile*] It was, and remains, gloriously, infuriatingly *Eleanor*.

  It was the bedrock. Without it, she argued, the tribunal would drown in a tide of trivialities, each wave insisting that sheer volume, or relentless repetition, must *mean* something. The rule drew a line. It said: nuisance law deals with *noticeable* harm. Something you can point to. Something that *ruins* a specific moment, a specific day. If one squeaky gate hinge doesn’t spoil your afternoon, then ten thousand squeaks, she’d argue, still don’t constitute a legal nuisance – just a very annoying statistical fact.

  [Shift tone slightly, more reflective]

  Now, since Eleanor hung up her gavel – or more accurately, her very stern notebook – I’ve found myself turning over a case. One she never actually heard. It’s not about extractor fans or bin lorries. It’s about something smaller. Almost vanishingly small.

  Imagine… a single minute of dull headache. Not migraine territory. Just a faint, background throb. So faint, so fleeting, that *no one* would ever think to complain about it. It arrives, it’s gone. Lunchtime comes, it’s forgotten. Beneath notice. Below the threshold.

  [Pacing slows slightly]

  Now, take that single minute of negligible ache. And give it to one person. Every single day. For eighty years. Thirty thousand minutes of headache. But here’s the rub: it arrives at unpredictable hours. Never enough to ruin a day. Never enough to point to and say, “*There!* That’s when you harmed me!” Just… a constant, low-level hum of discomfort woven into the fabric of a life. Day after day, year after year.

  [Pause, let the image settle]

  Eleanor’s threshold rule looks at this. It sees each instance – each single minute – falling below the line of 'noticeable harm'. Individually, beneath notice. Therefore, the rule tells us, collectively… nothing. No grievance. Just life.

  [Shift]

  Now, take that *exact same* quantity of irritation. Thirty thousand minutes of dull headache. But scatter it. One minute each, across thirty thousand different people. Each person gets their single, fleeting throb. Forgotten by lunch. Individually, beneath notice. Therefore, the rule tells us… nothing. Again. No grievance.

  [Pause, look around the room]

  And the rule says… these two cases? They are *exactly the same*. Equally nothing. Because in neither case did a single instance ever rise above the threshold. The sheer, grinding accumulation borne silently by one soul for a lifetime? Legally indistinguishable from thirty thousand fleeting, forgotten twinges.

  [A longer pause. Let the discomfort, the intuitive sense of *difference*, hang in the air. No need to argue it; the contrast speaks for itself.]

  Now… [*Turn fully to Eleanor, direct, respectful, affectionate*] …I know what you’d have ruled, Eleanor. I can see it now. That look. The one that said, “Don’t bring me hypothetical soufflés when we’ve got real potatoes to peel.” You’d have pointed out, quite rightly, that your tribunal dealt with *actual* extractor fans and *real* security lights, not philosophical thought experiments. That the threshold rule *worked*. It kept the system functional. It stopped it collapsing under the weight of the infinitesimal. That drawing a line, however sharp, was necessary. And that the law, bless its clumsy heart, isn't always equipped to measure the slow erosion of a life by a thousand tiny, untraceable grains of sand. It deals in broken windows, not weathered stone.

  [*Slight smile*]

  And you’d be right. Utterly, pragmatically right. That’s why you were the chair. That clear, unbending line was your gift to the sanity of the tribunal and the city it served. It *was* brilliant. It *was* necessary.

  But here’s the thing we all felt in that room, Eleanor, even your fiercest admirers – and perhaps especially your fiercest critic over there [*gesture lightly*] – when faced with that eighty-year ache... even if the *law* sees nothing, the *human* in us squirms. We feel the weight of it. We sense the difference, even if we can't quite codify it. It highlights the stark, sometimes uncomfortable, gap between what the law can capture and the full spectrum of human experience. Your rule, magnificent and robust as it was, like a perfectly engineered dam, couldn't always hold back the feeling that *some* accumulations, borne alone in silence, might seep through the cracks.

  [Raise glass higher]

  So, we toast you tonight, Eleanor, not just for your formidable intellect and your immovable principles – though heaven knows we toast those too! – but for holding that difficult line for twenty-six years. For bringing clarity to chaos. For enduring the absurd with grace. For sparking debates that will doubtless rage on in lecture halls and pubs long after this hotel’s security lights have been adjusted to everyone’s satisfaction.

  We toast your integrity. You never pretended the line wasn’t sharp. You never pretended the verdicts were easy, or that everyone would be happy. You showed us that sometimes, making the system work means accepting that it won't perfectly map onto every human feeling. And you did it all without ever losing sight of the real people, with their very real frustrations, sitting across the table.

  You were, and are, utterly remarkable. A force of nature in sensible shoes. Leeds is quieter, and perhaps a little less interesting, for your retirement.

  To Eleanor! For the threshold, the gavel, the grace, and the glorious, infuriating clarity of it all.

  **To Eleanor!**

  [Everyone drinks]
