  Here's a terza rima exploring that toxicological/philosophical edge, where imperceptible increments unravel "better than":

  **Arsenic Elegy (Or, On the Transitivity of Better Than)**

  **(Trace)**
  A hair's-breadth grace within the vintage's bloom, (A)
  A subtle fire that warms the latent core, (B)
  So faint, a barely whispered "better" looms. (A)

  **(Chronic Threshold)**
  That core now glows, demanding slightly more— (B)
  A sharper tang upon the evening tongue, (C)
  A strength perceived where weakness was before. (B)

  **(Low Toxicity)**
  The tongue grows thick, the vibrant chords unstrung; (C)
  A tremor starts where steady hands held fast. (D)
  "Is *this* worse?" Doubt clouds what was clearly wrung. (C)

  **(Moderate Toxicity)**
  The steady pulse begins to beat too fast, (D)
  Then slows, a leaden weight beneath the skin. (E)
  The "better" chain insists it still holds fast. (D)

  **(Lethal Dose)**
  The skin turns cold, the frantic gasps begin, (E)
  Then cease. The silent heart, the chamber stilled. (F)
  The final step: where did the "better" end? (E)

  ---

  ### How it works your request

  1.  **Terza Rima & Transitive Chain:** The ABA BCB CDC DED EFE structure forces each tercet to link *rhymically* to the next, embodying the transitive chain. Each stanza depends on the rhyme established by the previous one, just as each step relies on the "better than" judgment of the one before.
  2.  **Dose-Response Spectrum:**
      *   **Trace (1st tercet):** Barely detectable, perceived as enhancement ("grace," "warms," "better looms").
      *   **Chronic Threshold (2nd):** Noticeable effect, still framed as positive/neutral ("sharper tang," "strength perceived").
      *   **Low Toxicity (3rd):** Clear negative effects begin ("tongue grows thick," "tremor starts"), but doubt clouds judgment ("Is *this* worse?").
      *   **Moderate Toxicity (4th):** Significant harm ("pulse... fast/slows," "leaden weight"), yet the *chain's logic* persists ("insists it still holds fast").
      *   **Lethal Dose (5th):** Death ("cold," "gasps cease," "silent heart," "chamber stilled").
  3.  **Imperceptible Steps:** Each tercet describes a subtle shift from the previous state, focusing on incremental changes ("slightly more," "tremor starts," "begins to beat too fast," "slows").
  4.  **The Ambiguous Ending:**
      *   **Closing the Rhyme?** The final rhyme is EFE. The 'E' sound ("stilled") *does* rhyme back with the 'E' sound in the previous tercet ("skin," "fast" - DED). However, the *final sound* of the poem is 'F' ("stilled"). There is no subsequent stanza starting with 'F' to rhyme with it.
      *   **Breaking the Chain?** The chain *rhythmically* ends here. The expected pattern (after EFE, it *could* go FGF, but it stops). The final question ("where did the 'better' end?") hangs in the silent space after the last line, mirroring the "silent heart." The chain of "better" is broken by death, and the rhyme scheme stops abruptly with an unrequited 'F' sound. It *links back* technically with the 'E', but *ends* on a break.
  5.  **Recognizable Yet Felt:**
      *   **Knows the Debate:** The structure embodies the Sorites paradox applied to value/transitivity. The specific dose-response progression and the final unresolved question directly address the core philosophical problem.
      *   **Feels the Chain & Snap:** The interlocking rhymes create a sense of inevitable progression. The shift from subtle enhancement ("grace") to clear harm ("tremor," "leaden weight") is palpable. The final stanza's stark imagery and the abrupt stop after the question create the "snap" – the point where the accumulation of tiny "betters" results in undeniable, catastrophic "worse." The silence after "stilled" *is* the snap.

  The poem performs the argument: the rhyme chain *almost* completes a circle (E to E), but the final, fatal step leaves it hanging, unresolved, the word "stilled" echoing the broken logic of the accumulated "betters."
