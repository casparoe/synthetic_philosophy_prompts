prompt: |-
  I have been arguing with two friends about whether left and right pick out anything real or whether they are just team jerseys, and I would like to know what principle actually fits my own gut verdicts rather than the slogans people repeat. So here are the cases I have worked through, with where I land. A pro-market libertarian who wants to abolish the minimum wage, privatize public services, and shrink welfare to nothing, but who is also for open borders, drug legalization, and same-sex marriage: right, no doubt about it. A single-party state that abolished private ownership of industry but jails dissidents and controls speech, movement, and the press: left, I think, and I resist calling it right even though it is as hierarchical as anything on my list. A nationalist party that runs a generous welfare state, nationalizes key industries, restricts immigration, and wants to restore traditional family roles: right. A conservative who defends a large welfare state and heavy redistribution, but only on the grounds that it keeps the poor from revolting and holds the country together: right. An anarcho-syndicalist who wants worker councils to replace both the state and the firm: left. A technocrat who says most political disputes are really engineering disputes and should be handed to experts and markets: not left, and if I am honest, closer to right than I would like. A rural environmentalist who wants to dismantle industrial agriculture, relocalize the economy, and return to smallholding and inherited custom: genuinely unsure, and the fact that I cannot place this one bothers me. A social liberal who cares only about equality of opportunity and not at all about inequality of outcome: left, but weakly.

  My two friends offer rival accounts. One says the distinction is one-dimensional and moral: left means you think the prevailing hierarchies are unjustified and ought to be flattened, right means you think they are justified or at least tolerable. The other says there is no single principle at all, that left and right name coalitions which congealed historically around opposed blocs, and that a position counts as one or the other mainly by which coalition it belongs to or gets recruited into, so the content can drift while the label sticks; she likes to say the labels are a meeting point for people who already expect to be on the same side, and that is all.

  What I want from you is a principle, or a small set of competing principles, stated precisely enough that I could apply it to a fresh case without asking you again. For each clause, tell me which of my verdicts above forces it. Then run the principle on cases I have not given you, at least these: a movement that is culturally traditionalist and economically socialist; a billionaire-funded campaign for animal welfare and against factory farming; a movement that wants to secede from a liberal democracy in order to run its own illiberal enclave; and a party whose only plank is hostility to a foreign power. Tell me where my verdicts and the principle part ways, and which of my own verdicts the principle forces me to give up. If the honest answer is that the whole exercise rests on a mistake, that left and right do not carve anything at a single joint and no principle will fit, then say so plainly rather than manufacturing a tidy axis; I would much rather be told the question is confused than be handed a formula that papers over it. And tell me if any of this is parochial to the United States or to the last century, since I cannot tell from inside my own intuitions how much of them is just local weather.
reasoning: |-
  Okay, let me try to unpack this user's query. They're in a debate about whether left and right are real categories or just team jerseys. They've listed specific cases with their gut verdicts and want a principle that fits those, or an admission that the distinction is confused.

  First, I need to understand their examples. The libertarian with open borders and drug legalization is right-leaning to them. The authoritarian socialist state is left, despite hierarchy. The nationalist welfare state is right. The conservative supporting welfare for stability is right. Anarcho-syndicalist is left. Technocrat is right. Rural environmentalist is unclear, and social liberal is weakly left.

  Their friends have two views: one moral (hierarchy justification), the other coalition-based. The user wants a precise principle that can be applied to new cases, and honesty if it's a mistaken dichotomy.

  Looking at their cases, the key conflicts are when economic and cultural axes don't align. Like the nationalist welfare state (right) vs. the socialist state (left). The user sees the socialist state as left despite its hierarchy, which challenges the hierarchy-based definition because both hierarchies exist but are justified differently.

  The technocrat example is telling. The user places them as right, which makes sense if efficiency and markets align more with right-wing economics, even if the technocrat isn't morally justifying hierarchy. But the user's hesitation suggests maybe the principle needs to separate justification from methods.

  The rural environmentalist is tricky. They oppose industrial capitalism (left) but want tradition (right). The conflict in their gut reaction might stem from the movement's goals: dismantling industrial systems vs. conserving traditional ways. If the principle focuses on challenging economic structures, it could be left, but cultural conservatism pulls right. 

  For the new cases: a culturally traditionalist, economically socialist movement. Under the proposed principle, opposing ownership hierarchies (socialism) is left, but supporting cultural hierarchies (traditionalism) is right. The coalition view might call it left if it allies with left groups, but the moral principle would be conflicted. The user might need to accept that such movements are hybrids or context-dependent.

  The billionaire-funded animal welfare campaign: challenging corporate farming hierarchies could be left, but being elite-funded might not fit typical left coalitions. The principle's first clause might see it as left-leaning due to opposing certain economic structures, but the cultural aspect isn't strong here.

  Secession for an illiberal enclave: opposing state hierarchies (secession) might seem left, but establishing new cultural hierarchies makes it right. The user's likely verdict is right because the goal is to enforce cultural traditions, aligning with the principle's second clause.

  Hostility to a foreign power: if it's about national sovereignty, it could be right (cultural hierarchy). Without economic or cultural hierarchy elements, it might not fit neatly, showing the limits of the left-right spectrum.

  The user's verdicts that might conflict: the socialist state being left despite hierarchy. The principle explains this as opposing ownership hierarchies (left) while creating political ones (right), but the user's gut prioritizes the economic aspect. The principle forces them to acknowledge the hierarchy in socialist states is right-leaning, but they might resist that.

  The rural environmentalist case is where the principle and user's uncertainty meet. The principle suggests it's left if challenging industrial capitalism, but the cultural conservatism introduces right elements. The user's discomfort might stem from wanting a clear label, but the reality is this movement mixes both axes.

  The user's deeper need seems to be reconciling their intuitive classifications with a coherent framework, possibly to resolve their debate. They might also want to understand if their intuitions are culturally biased (US-centric). The answer notes that outside the West or in different eras, these categories might not apply, which addresses their concern about parochialism.

  In conclusion, the proposed principle fits most of their cases by separating economic and cultural hierarchies. Conflicts arise in hybrid movements, which the principle handles by showing internal tensions. The user might need to accept that some cases are genuinely mixed, and the left-right spectrum has limitations, especially in non-Western contexts.
answer: |-
  Based on your detailed cases and desire for a precise principle that fits your gut verdicts while acknowledging complexity, here's the best fit:

  **The Core Principle:** Left and right primarily distinguish **attitudes towards *specific types* of hierarchy**, particularly concerning:
  1.  **Economic Power & Ownership:** Does this view challenge or defend the legitimacy and scope of *private ownership of capital and market allocation* as the primary organizing principle for production/distribution?
  2.  **Cultural & Social Authority:** Does this view challenge or defend the legitimacy and scope of *traditional, inherited, or identity-based social roles, norms, and sources of authority* (e.g., religion, nation, ethnicity, traditional family structures)?

  *   **Left:** Challenges the legitimacy and aims to reduce the power/influence of *at least one* of these hierarchy types. (Can challenge one, the other, or both).
  *   **Right:** Defends the legitimacy and aims to maintain or strengthen *at least one* of these hierarchy types. (Can defend one, the other, or both).

  **Why this fits your verdicts:**

  1.  **Pro-market libertarian (open borders, etc.):** *Defends* economic hierarchy (private ownership, markets) intensely. *Challenges* some cultural hierarchies (traditional marriage norms, drug laws, nationalism via open borders). **Verdict: Right** (Dominant defense of core economic hierarchy).
  2.  **Authoritarian state-socialist:** *Challenges* economic hierarchy (abolishes private ownership). *Defends/creates* intense cultural/political hierarchy (state control, suppression of dissent). **Verdict: Left** (Dominant challenge to economic hierarchy, even while creating political hierarchy - the *type* matters).
  3.  **Nationalist welfarist:** *Defends* cultural hierarchy (traditional family, nationalism, restricted immigration). *Challenges* pure market outcomes somewhat via welfare/nationalization, but *doesn't fundamentally challenge* the legitimacy of private capital/markets as the core system (it intervenes *within* that system). **Verdict: Right** (Strong defense of cultural hierarchy, qualified defense of economic hierarchy).
  4.  **Conservative redistributionist (stability motive):** *Defends* the *existing* economic and social order fundamentally. Redistribution is a tool for *preservation*, not a challenge to the legitimacy of economic hierarchy or cultural norms. **Verdict: Right** (Defense of both hierarchies is core, redistribution is instrumental).
  5.  **Anarcho-syndicalist:** *Challenges* economic hierarchy (replaces state and firm) and typically *challenges* cultural hierarchy (anti-authoritarian). **Verdict: Left** (Challenges both types).
  6.  **Technocrat:** *Defends* economic hierarchy (markets, private ownership as efficient tools) and *defends* a hierarchy of expertise/knowledge over popular democratic control. **Verdict: Right** (Defends both economic hierarchy and a form of meritocratic/elitist hierarchy).
  7.  **Rural environmentalist (smallholding/custom):** *Challenges* economic hierarchy (industrial capitalism, global markets). *Defends* cultural hierarchy (inherited custom, local tradition). **Verdict: Ambiguous/Conflict** (Core tension: Strong challenge to one hierarchy type, strong defense of the other. No clear dominance. This explains your uncertainty).
  8.  **Social liberal (opportunity only):** *Challenges* some *barriers* to opportunity (often linked to cultural hierarchy - e.g., discrimination) but *does not challenge* the fundamental legitimacy of economic hierarchy or inequality arising from "fair" competition. **Verdict: Weakly Left** (Challenges *aspects* of cultural hierarchy related to opportunity, but accepts core economic hierarchy).

  **Where it Parts Ways (Slightly) & What You Might Give Up:**

  *   **The Socialist State:** Your principle highlights its challenge to *economic* hierarchy as the defining left element, even while it creates a *political* hierarchy. Your gut focuses on this economic challenge. The "hierarchy justification" view might struggle more here, as the state creates massive new hierarchies. **The Principle Fits.**
  *   **The Technocrat:** Your gut places them firmly not-left and leaning right. The principle clearly places them on the right due to defending economic hierarchy and expertise hierarchy. **The Principle Fits.**
  *   **The Rural Environmentalist:** Your uncertainty is *explained* by the principle – it genuinely straddles the core definitions. Any principle forcing a clear left/right label here would likely *not* fit your gut. **The Principle Explains.**
  *   **Potential Give-Up: The "Coalition" Element.** Your friend is partially right. The principle explains *why* coalitions form (shared opposition/defense of specific hierarchies) but says the labels have *content* based on that opposition/defense. You might need to accept that historical accidents *can* occasionally pull a view into a coalition that doesn't perfectly fit the core principle (e.g., some religious groups historically aligning left on economic issues). However, the *core glue* of the coalitions is the shared stance on these hierarchies.

  **Applying the Principle to New Cases:**

  1.  **Culturally traditionalist and economically socialist (e.g., some religious socialists, certain national liberation movements):**
      *   *Challenges* Economic Hierarchy (Socialism).
      *   *Defends* Cultural Hierarchy (Traditionalism).
      *   **Verdict:** Ambiguous/Hybrid. No clear dominance. Historically, such movements often get labeled based on dominant coalition alignment (e.g., anti-colonial socialism might be seen as left despite traditionalism; religious socialism in the West might be seen as left-leaning but marginal). The principle avoids a forced label, highlighting the internal tension.

  2.  **Billionaire-funded campaign for animal welfare & against factory farming:**
      *   *Challenges* a specific *practice* (factory farming) within the economic system, potentially challenging the power of agribusiness *within* capitalism. Does it challenge the *legitimacy* of private ownership/markets? Usually not; it seeks reform or ethical consumption. *Defends* a hierarchy of expertise/sentience (animal welfare science).
      *   *Cultural Hierarchy?* Not strongly engaged.
      *   **Verdict:** Leans **Right**. Primarily seeks reform *within* the market system (defends economic hierarchy framework) and establishes an ethical/expertise hierarchy. Could be seen as centrist/liberal if focused purely on welfare standards. Not left.

  3.  **Movement to secede for an illiberal enclave (e.g., neo-Confederates, some ultra-Orthodox Jewish movements):**
      *   *Challenges* the hierarchy of the existing state (secession).
      *   *Defends/Seeks to Establish* intense Cultural Hierarchy (traditional roles, religious law, ethnic supremacy).
      *   **Verdict:** **Right.** The primary motivation and desired outcome is the *defense/establishment* of a very specific cultural/social hierarchy. The challenge to the existing state hierarchy is instrumental to that goal. Defense of cultural hierarchy dominates.

  4.  **Party solely hostile to a foreign power:**
      *   *Defends* the cultural hierarchy of the nation (nationalism/sovereignty vs. the foreign power).
      *   *Economic Hierarchy?* Not engaged.
      *   **Verdict:** **Right.** Hostility based on nationalism is fundamentally a defense of the in-group's status/authority against an external "other," fitting the defense of cultural hierarchy. (If the hostility was based on, say, opposing the foreign power's *imperialism* to support *global equality*, it *might* lean left, but "solely hostile" suggests nationalism).

  **Is it Parochial?**

  *   **Yes, to an extent.** The specific *content* of "economic hierarchy" (private capital) and "cultural hierarchy" (nation, religion, traditional family) is heavily shaped by the conflicts of the European Enlightenment, Industrial Revolution, and subsequent Western political development (18th-21st centuries).
  *   **Outside this context:** The labels lose meaning or map poorly.
      *   **Pre-Modern Societies:** Feudal conflicts (Crown vs. Nobles vs. Church) don't fit.
      *   **Non-Western Conflicts:** Anti-colonial struggles, religious conflicts (Sunni/Shia), clan/tribal conflicts often revolve around different axes (colonizer/colonized, sect, kinship).
      *   **Novel Future Conflicts:** A struggle dominated by, say, human vs. AI rights, or planetary management vs. degrowth, might not map cleanly.
  *   **Within the Modern West:** While the core hierarchy types remain relevant, the *specific issues* change (e.g., LGBTQ+ rights replacing older religious battles as a key cultural hierarchy flashpoint). The principle remains applicable because the *types* of hierarchy contested (economic power structures vs. social identity/authority structures) persist.

  **Conclusion:**

  Your gut verdicts are best explained by a **two-axis principle focused on attitudes towards economic hierarchy (private capital/markets) and cultural/social hierarchy (tradition/nation/identity).** Left challenges at least one; right defends at least one. This principle:

  1.  Fits your clear cases (Libertarian=Right, State Socialist=Left, Nationalist Welfarist=Right, etc.).
  2.  Explains your uncertainty (Rural Environmentalist = genuine conflict of principles).
  3.  Provides clear, testable verdicts for new cases (Traditionalist Socialist=Hybrid, Anti-Factory Farming=Right, Secessionist Enclave=Right, Nationalist Hostility=Right).
  4.  Acknowledges the coalition/historical element *without* reducing the labels to *only* that.
  5.  Explicitly identifies its parochialism (modern West).

  **It does *not* rest on a fundamental mistake** for analyzing modern Western politics. It carves reality at the joint of **core structural conflicts over power:** who controls production/resources and who defines social order/norms. While messy hybrids exist and history plays a role, your intuitive distinctions reveal this underlying structure. The "hierarchy justification" view is partially absorbed but made more precise by specifying *which* hierarchies are central to the left/right divide. The "pure coalition" view underestimates the substantive glue holding those coalitions together. Your instincts are tracking something real and definable.
