  ### Engineered Case: The Coin-Flip Isolation Experiment  
  **(i) Case Statement (under 250 words):**  
  You are one of 100 volunteers in an experiment. The experimenter flips a fair coin. If heads, 99 volunteers are placed in green rooms and rendered permanently unconscious via a safe neural blocker; you (the remaining one) are placed in a red room, fully conscious. If tails, 99 volunteers are placed in red rooms (conscious), and one is placed in a green room (unconscious). You awaken conscious in a red room. All volunteers are physically identical and isolated. The coin flip is fair, and the setup is common knowledge.  

  **(ii) Belief, Hypotheses, and Credences:**  
  - **Belief at issue:** Your credence that the coin landed heads (denoted \(H\)).  
  - **Hypotheses:**  
    - \(H\) (heads): 1 conscious observer (you in red), 99 unconscious.  
    - \(T\) (tails): 99 conscious observers (all in red), 1 unconscious.  
  - **SSA verdict:** \(P(H) \approx 0.5025\) (slightly favors heads).  
    - Calculation: Under SSA, you are a random sample from all *conscious* observers. Given \(H\), there is 1 conscious observer (you); given \(T\), there are 99. Bayes:  
      \[
      P(H|\text{conscious red}) = \frac{P(\text{conscious red}|H) \cdot P(H)}{P(\text{conscious red}|H) \cdot P(H) + P(\text{conscious red}|T) \cdot P(T)} = \frac{1 \cdot 0.5}{1 \cdot 0.5 + \frac{99}{99} \cdot 0.5} = \frac{0.5}{0.5 + 0.495} \approx 0.5025.
      \]  
  - **SIA verdict:** \(P(H) = 0.01\) (strongly favors tails).  
    - Calculation: SIA weights hypotheses by the number of observers matching your observation. Given \(H\), there is 1 conscious red observer; given \(T\), there are 99. Bayes:  
      \[
      P(H|\text{conscious red}) \propto P(H) \times \text{number of conscious red in } H = 0.5 \times 1 = 0.5,  
      \]  
      \[
      P(T|\text{conscious red}) \propto P(T) \times \text{number of conscious red in } T = 0.5 \times 99 = 49.5,  
      \]  
      \[
      P(H|\text{conscious red}) = \frac{0.5}{0.5 + 49.5} = 0.01.
      \]  

  **(iii) Feature Doing the Work and Alteration:**  
  - **Feature:** The **reference class** (conscious observers). SSA samples from the reference class of conscious observers, while SIA weights by the number of observers matching the indexical fact (being conscious and red).  
  - **Alteration:** Change the reference class to *all volunteers* (including unconscious). Now:  
    - SSA: \(P(\text{conscious red}|H) = 1/100\) (only you in \(H\)), \(P(\text{conscious red}|T) = 99/100\).  
      \[
      P(H|\text{conscious red}) = \frac{(1/100) \cdot 0.5}{(1/100) \cdot 0.5 + (99/100) \cdot 0.5} = \frac{0.005}{0.5} = 0.01.
      \]  
    - SIA: Unchanged at \(0.01\) (weights by conscious red observers, still 1 in \(H\), 99 in \(T\)).  
  - **Outcome:** Divergence vanishes; both yield \(P(H) = 0.01\). This confirms the reference class drives the split.  

  **(iv) Defense of the Worse-Faring Assumption:**  
  - **Worse-faring assumption:** **SIA** (yields \(P(H)=0.01\), rejecting the intuition that heads/tails remain equiprobable).  
  - **Attack:** An SIA defender argues:  
    - "The case *presumes* unconscious beings are 'observers' in the reference class, but they lack subjective experience. SSA’s use of conscious observers is arbitrary; SIA avoids this by focusing on *actual observers like me* (conscious and red)."  
  - **Genuine cost or stipulation?** This exposes a **genuine cost**: SIA ignores the causal link between the coin flip and consciousness. In \(T\), there are more conscious observers, but learning you are conscious and red *should not* drastically update \(H\) (as SSA shows), since consciousness is guaranteed in both cases for red-room occupants. SIA’s verdict (\(P(H) = 0.01\)) feels extreme and violates the principle that indexical evidence should not override symmetric non-indexical evidence (the fair coin).  

  **(v) Substantive or Verbal Dispute?**  
  If the case succeeds, it shows the dispute is **substantive**. The core disagreement—whether to sample from a reference class (SSA) or weight by observer counts (SIA)—arises from fundamental principles of anthropic reasoning, not semantics. SSA treats the reference class as a fixed epistemic starting point; SIA treats observer counts as prior-modifying evidence. Resolving this requires grappling with how indexical evidence *should* update beliefs, a deep question in epistemology and decision theory.
