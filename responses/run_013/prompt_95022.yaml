  A fair die with 20 sides is rolled. If it lands on 1, one person is created in a red room. If it lands on 2-20, then two people are created: one in a red room and one in a blue room. You find yourself in a red room. What is the probability that the die landed on 1?

  Hypotheses:
  - H1: die=1 (1 red room person)
  - H2-20: die=2-20 (2 people: one red, one blue)

  SSA calculation:
  - In H1: there is 1 person, who is in red. So if H1 is true, you are that person.
  - In H2-20: there are 2 people, one of whom is in red. So if H2-20 is true, the probability that you are the red one is 1/2.

  The prior: P(H1)=1/20, P(H2-20)=19/20.

  P(you are in a red room | H1) = 1
  P(you are in a red room | H2-20) = 1/2

  So by Bayes:
  P(H1 | red) = [ P(red|H1) * P(H1) ] / [ P(red|H1)*P(H1) + P(red|H2-20)*P(H2-20) ]
  = [ 1 * (1/20) ] / [ 1*(1/20) + (1/2)*(19/20) ]
  = (1/20) / [ 1/20 + 19/40 ] = (1/20) / [ (2 + 19)/40 ] = (1/20) / (21/40) = (1/20)*(40/21) = 2/21 ≈ 9.52%

  SIA calculation:
  SIA weights by the number of observers.
  - H1: 1 observer
  - H2-20: 2 observers

  Prior probabilities under SIA adjustment:
