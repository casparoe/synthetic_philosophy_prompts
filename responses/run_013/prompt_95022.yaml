  P(H1 | red) = [ P_SIA(H1) * P(red|H1) ] / [ P_SIA(H1)*P(red|H1) + P_SIA(H2-20)*P(red|H2-20) ]
  = [ (1/39)*1 ] / [ (1/39)*1 + (38/39)*(1/2) ]
  = (1/39) / [ 1/39 + 19/39 ] = (1/39) / (20/39) = 1/20 = 5%

  So SSA gives about 9.52% and SIA gives 5%. They are different, but not dramatically so. More importantly, both are low, but we want one to be high and one to be low.

