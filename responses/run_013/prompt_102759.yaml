prompt: |-
  I am a high school junior and the student council president. In two weeks, I have to give the opening address at a school-wide assembly where the administration will announce a pilot program to replace our current final-exam policy with a portfolio-based assessment. The audience will include students, teachers, administrators, and one school board member who teaches economics at the local university. I want the speech to argue for a specific version of the pilot, not to survey the pros and cons.

  The dispute has become an empirical stalemate. Some teachers insist that final exams are the only way to ensure retention; others argue that exams mainly measure test-taking ability and that portfolios better capture learning; the school board member has a model in which exams sort students by conscientiousness and thereby improve later outcomes; student surveys show that exam stress is correlated with anxiety and that many students would do better on portfolios, but no one knows whether that would translate into learning gains. I do not want to pretend to resolve this. Instead, I have been reading about safe Pareto improvements—roughly, changes that make at least one person better off and no one worse off relative to the status quo, not just under the best estimate of the relevant facts, but under every plausible model of those facts. I want the speech to commit to a concrete policy (for example, an opt-in two-year pilot with a guaranteed right to switch back after one term) and to defend it as a safe Pareto improvement: under every plausible model of how assessment affects learning, no group is worse off than under the current exam policy, and at least one group is better off. The concept should do real work: it should constrain what I can claim and how I can frame the proposal, so that I am not smuggling in an empirical prediction I cannot defend.

  Please write the speech. It should be formal and polished, suitable for a mixed audience: the economics teacher should recognize the structure of the argument, but my classmates and their parents should be able to follow it. It should take a definite position and give reasons, rather than laying out options and leaving the decision to me. After the speech, add a brief note on where the speech takes liberties with the idea of a safe Pareto improvement or leans on a contested reading of it.
reasoning: |-
  We are writing a speech that argues for a specific pilot program as a safe Pareto improvement. The key is to avoid empirical claims that are disputed and instead frame the policy as beneficial under every plausible model of how assessment affects learning.

  The proposal: an opt-in two-year pilot with a guaranteed right to switch back after one term. Why this?
  - Opt-in: allows students and teachers who are skeptical to continue with exams, so they are not forced into something they fear might be worse.
  - Two-year pilot: gives enough time to gather data and for the program to mature.
  - Right to switch back after one term: addresses immediate concerns and allows for quick correction if the portfolio method is not working for an individual.

  We will argue that under every plausible model (whether exams are better, portfolios are better, or they are equally good), no one is worse off and at least one group is better off.

  Structure of the speech:
  1. Introduction: Acknowledge the assembly and the importance of the topic.
  2. The Stalemate: Briefly describe the disagreement without taking sides.
  3. Introducing the Safe Pareto Improvement Concept: Explain it in simple terms.
  4. The Proposal: Describe the opt-in two-year pilot with the right to switch back.
  5. Why It's a Safe Pareto Improvement: Break it down by groups (students, teachers, administrators, school board) and show that under every model, no one loses and at least one gains.
  6. Call to Action: Urge support for the pilot as a cautious, evidence-based step.

  Note: We must be careful not to claim that portfolios are empirically better. Instead, we frame the policy such that it protects everyone and creates an opportunity for gain without risk.

  After the speech, we'll add a note on where we took liberties with the concept.

  Let's write the speech.
answer: |-
  ### Opening Address: Proposal for a Portfolio Assessment Pilot Program  

  Good morning, students, teachers, administrators, and honored guests. As your student council president, I stand before you today not just as a leader, but as a fellow learner deeply invested in the future of our education. In two weeks, our school will embark on a critical conversation about how we assess student learning. The administration has proposed replacing our traditional final exams with a portfolio-based system—a shift that has sparked passionate debate. I understand the concerns on all sides: teachers who value exams as tools for retention, educators who believe portfolios capture learning more authentically, and experts who see exams as sorting mechanisms for long-term success. Student voices, including my own, highlight the anxiety exams can cause. Yet after months of discussion, we remain at an impasse.  

  Today, I offer a path forward—one that transcends this stalemate. I propose a specific pilot program: **a two-year, opt-in trial for portfolio-based assessments, with a guaranteed right for any student to switch back to final exams after just one semester.** This is not a compromise between competing visions. It is a deliberate strategy grounded in a principle from decision theory—the concept of a "safe Pareto improvement." Let me explain.  

  A "safe Pareto improvement" is a change that makes at least one person better off and no one worse off—not just under our best guess of how the world works, but under *every plausible scenario* we can imagine. It is a policy that protects everyone from loss while creating room for gain. Let me show you how this pilot achieves exactly that, regardless of which side of the assessment debate you support.  

  First, consider the students. Under the status quo, every student faces high-stakes exams, which many find stressful and unrepresentative of their abilities. In our pilot, participation is optional. If you believe portfolios will help you shine—perhaps you excel at projects, reflections, or creative work—you opt in. If you thrive under exams, you stay with what works. Crucially, the right to switch back after one term is ironclad. So, under every model of learning:  
  - If exams truly are superior for retention or sorting (as some argue), students who keep them lose nothing.  
  - If portfolios reduce anxiety and unlock potential (as others claim), students who opt in gain immediately.  
  - Worst case? A student tries portfolios, finds them ineffective, and switches back—no harm done. At least one group (those who choose portfolios and benefit) is better off.  

  Now, to our teachers. You are the architects of learning, and your expertise is irreplaceable. Under this pilot, no teacher is forced to abandon exams. Those who see value in portfolios can pilot them; those who prefer exams continue as usual. Data will be collected transparently, and your feedback will shape the program. So:  
  - If exams are essential for rigor, teachers who keep them preserve their methods.  
  - If portfolios reveal deeper learning, teachers who adopt them gain new insights.  
  - No one is coerced. No one is worse off.  

  Administrators and our school board representative—this pilot is designed for evidence, not ideology. We commit to rigorous evaluation: tracking grades, anxiety levels, college admissions, and stakeholder feedback across both groups. After two years, we will have data to guide a permanent decision. But here’s the Pareto logic:  
  - If the skeptics are right, the status quo remains intact for those who choose it, and we avert a rash overhaul.  
  - If the proponents are right, we unlock gains for willing participants without imposing risk on others.  
  - Either way, the school gains valuable insights at near-zero cost.  

  To our guest from the school board, who teaches economics: you know better than anyone that Pareto improvements are rare in policy. They require careful constraints. This pilot is constrained by choice, reversibility, and time limits. It hedges against uncertainty by ensuring no group bears the burden of being wrong.  

  In closing, this is not a bet on portfolios versus exams. It is a bet on humility—that in a complex world, the wisest policies are those that allow us to learn without sacrificing the safety of any stakeholder. Let us seize this opportunity to move beyond debate and into action. Let us approve this pilot not as a victory for one side, but as a shared step toward a more inclusive, evidence-based future. Thank you.  

  ---  

  ### Brief Note: Conceptual Liberties and Contested Interpretations  
  1. **Expanding "No One Worse Off" to Groups**: The strictest definition of Pareto improvements applies to *individuals*. Here, it is applied to *groups* (e.g., "all exam-preferring students" as a bloc). This assumes homogeneity within groups, which may not hold (e.g., one exam-preferring student might indirectly "lose" if portfolios shift classroom resources). The speech leans on the pilot’s reversibility clause to mitigate this.  
  2. **Defining "Plausible Models"**: The speech treats "plausible models" as discrete, mutually exclusive theories (e.g., "exams aid retention" vs. "portfolios reduce anxiety"). In reality, models may overlap or be incomplete. The argument implicitly assumes these cover the full spectrum of disagreement, which is contestable.  
  3. **Non-Quantifiable Losses**: Pareto improvements typically focus on quantifiable welfare (e.g., grades, stress). The speech overlooks potential non-quantifiable losses, like teachers’ sense of professional autonomy if pressured to adopt portfolios. The opt-in provision aims to address this but may not eliminate perceived cultural pressure.  
  4. **Long-Term Uncertainty**: The pilot’s two-year horizon assumes short-term outcomes (e.g., switching back after a term) are sufficient to prevent harm. Critics might argue that even one term of portfolios could cause irreversible skill gaps if exams are superior for long-term sorting. The speech counters by emphasizing the right to switch back as a safeguard.  

  These liberties make the concept operationally useful for policy but require accepting bounded rationality—that our "plausible models" and group-based protections are reasonable proxies for true Pareto efficiency.
