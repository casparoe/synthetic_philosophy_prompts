  2. **Case (The Annoyance)**: To prevent one person’s year of severe depression, each of 10 billion people endures a 0.1-second flicker of irritation (noticed but instantly forgotten).  
     **Verdict**: Impermissible.  
     **Why**: Principle 3 applies; irritation is non-fungible and cannot aggregate interpersonally to outweigh severe harm.

  3. **Case (The Toll)**: A highway toll charges drivers $0.05, adding 10 seconds to trips via payment delay. Revenue saves one life/year.  
     **Verdict**: Permissible.  
     **Why**: Principles 1 and 3; delays are brief and fungible, and tolls imply consent (drivers opt in).

