  First, I need to unpack the core issues. The quantitative camp is using cost-benefit analysis with discount rates. The other camp challenges the moral foundations, especially with the non-identity problem (how our actions affect who exists). The user's intuition about two stacked disagreements seems spot on. The beneficiary/claimant distinction could be useful here. Beneficiaries fit into aggregative models where discount rates matter. Claimants require deontological or relational ethics, where the non-identity problem complicates harm.

  But is this distinction just repackaging? Maybe partially, but it organizes the debate better. The deeper issue might be metaethical—different views on what morality requires. The quantitative side might prioritize welfare maximization, while the other focuses on duties or relationships across time. 

