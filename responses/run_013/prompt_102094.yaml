  I need you to construct a thought experiment to order: a realistic case where a utilitarian demand threatens an agent's integrity, but the threat does not come from the demand asking her to be impartial. Instead, it comes from the demand that she deliberate in a certain way. The twist is that the agent's deepest project is itself an impartial one, like being a good scientist or a judge, so the usual one thought too many objection seems to come from the other direction. Constraints: one paragraph, no wife-rescue case, the agent is not a utilitarian, and no exotic sci-fi stuff. After the scenario, walk through what Williams's integrity objection would say about it, what a utilitarian would say back, and tell me which feature of the case is doing the work. If you remove that feature, does the case collapse back into the standard integrity objection? Finish with how a utilitarian defender would attack the case. Dont cite any books or articles, just reason from the ideas.
