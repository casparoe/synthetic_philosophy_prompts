prompt: |-
  Draft the joint statement that a committed reasons internalist and a committed reasons externalist could both sign after a good-faith adversarial collaboration. The internalist holds, roughly, that a true statement of the form "A has a reason to φ" is analytically or conceptually tied to the possibility of A's being motivated to φ under some appropriate deliberative condition; the externalist holds, roughly, that such a statement can be true independently of any motivational possibility in A, and that its truth is a matter of normative fact rather than psychological availability. I want the document they should have produced: a numbered section of agreed claims -- about what a reason statement is doing, about the explanatory and advisory functions of reason-talk, about the status of the amoralist, about what "fully rational" can and cannot mean, and about which of their disagreements are substantive rather than verbal; then a disagreements table with each position's formulation written so its own side would accept the wording; then a crux section, where each crux is stated as a sub-question whose settlement would move at least one side; and, for each crux, a concrete case or argument both sides agree would bear on it, with each side's prediction recorded in advance.

  To force the collaboration into the weeds, use the following stipulated case and taxonomy rather than the usual stock examples. Consider an agent, M, who recognizes a consideration C as counting in favor of an action φ. Distinguish four motivational profiles: (1) M is occurrently motivated to φ; (2) M is not occurrently motivated, but is disposed to become motivated by ordinary deliberation that does not add new non-normative information; (3) M is not motivated and would not become motivated by such deliberation, but could be brought to care by an external intervention -- a pill, a novel, a threat -- that does not change what C is; (4) M is not motivated and cannot be brought to care by any such intervention, though M continues to recognize C. Ask the internalist and the externalist to say, for each profile, whether M has a reason to φ, whether M's reason statement is true, false, or indeterminate, and what the statement is doing when uttered. Then have them record where they predict the other side will concede and where they predict it will not.

  Also include a section on the advice test: what an advisor must be able to say to M, in each profile, for the advice to be sincere, correct, and action-guiding. And a section on whether the internalist's "fully rational" clause is doing normative work or merely procedural work, and whether the externalist can explain the explanatory force of reason statements without collapsing into a mere list of normative truths.

  End with a candid section in which each side states what would change its mind -- which argument, case, or result would lead it to abandon or substantially revise its position -- and a note on where this joint statement is most likely to be tendentious, unstable, or to have papered over a genuine disagreement. Do not include citations, reading lists, or a bibliography; the document should stand on its own argument.
reasoning: |-
  We are drafting a joint statement after an adversarial collaboration between a committed reasons internalist (I) and a committed reasons externalist (E). The document will have:

  1. Agreed Claims (numbered section)
  2. Disagreements Table (each position's formulation acceptable to itself)
  3. Crux Section (sub-questions, concrete cases/arguments, and predictions)
  4. Advice Test Section
  5. Section on "Fully Rational" Clause and Explanatory Force
  6. Candid Section (what would change each side's mind, and where the joint statement is unstable)

  We will use the stipulated case of agent M and the four motivational profiles.

  Let's begin.

  ---

  **Joint Statement: Internalist-Externalist Collaboration**

  **1. Agreed Claims**

  After extensive discussion, we agree on the following:

  1.1. **Function of Reason Statements**: Statements of the form "A has a reason to φ" serve both explanatory and advisory functions. They can explain why an agent acted (or should act) and can guide action by providing considerations that count in favor of φ-ing.

  1.2. **Normative vs. Descriptive**: Reason statements are normative claims, not merely descriptive of psychological states. However, they may have psychological implications.

  1.3. **The Amoralist**: We agree that the amoralist (an agent who recognizes moral considerations but remains unmotivated) is conceptually possible. The amoralist's existence does not, by itself, refute either internalism or externalism.

  1.4. **"Fully Rational" Clause**: The phrase "fully rational" as used in internalist accounts must be understood procedurally, not substantively. That is, it refers to a process of reasoning that is free from errors (e.g., logical mistakes, ignorance of non-normative facts), but it does not build in substantive normative commitments (e.g., that one must care about morality). However, we disagree on whether this clause can be purely procedural (see Disagreements).

  1.5. **Substantive Disagreement**: Our core disagreement is not merely verbal. It concerns the nature of normativity and the relationship between reasons and motivation. We also disagree on the truth conditions of reason statements.

  1.6. **Motivational Profiles and Reason Statements**: In the case of agent M who recognizes consideration C as counting in favor of φ-ing:
     - Profile (1): Both agree M has a reason to φ and the statement is true. The statement explains M's occurrent motivation.
     - Profile (2): Both agree M has a reason to φ and the statement is true. The statement indicates that M would be motivated by ordinary deliberation.
     - Profile (3) and (4): We disagree (see Disagreements).

  1.7. **Advice Function**: When giving advice, the advisor must be sincere and aim to guide the advisee. The advisor must assert only what they take to be true. However, the conditions under which an advisor can correctly assert a reason statement depend on the theory (see Advice Test).

  ---

  **2. Disagreements Table**

  The table below captures our core disagreements. Each formulation is acceptable to the respective side.

  | Issue | Internalist Position (I) | Externalist Position (E) |
  |-------|---------------------------|--------------------------|
  | **Truth Conditions for Reason Statements** | "A has a reason to φ" is true if and only if A would be motivated to φ under some appropriate deliberative condition (e.g., full rationality). | "A has a reason to φ" is true if and only if there is a normative fact that counts in favor of A φ-ing, regardless of A's motivational capacities. |
  | **Profile (3): M is not motivated and would not become motivated by ordinary deliberation, but could be brought to care by an external intervention (pill, novel, threat) that does not change what C is.** | I: M does not have a reason to φ. The reason statement is false (or indeterminate, if the intervention is seen as altering the agent's motivational set). The statement, if uttered, might express a hope that M could be changed to care. | E: M does have a reason to φ. The reason statement is true. The statement is asserting a normative fact that C counts in favor of φ-ing for M, despite M's current motivational resistance. |
  | **Profile (4): M is not motivated and cannot be brought to care by any intervention, though M continues to recognize C.** | I: M does not have a reason to φ. The reason statement is false. The statement, if uttered, is either false or expresses a normative claim that is not applicable to M. | E: M does have a reason to φ. The reason statement is true. The statement is asserting a normative fact that C counts in favor of φ-ing for M, even if M is motivationally inert. |
  | **Status of the Amoralist** | I: The amoralist (if in profile 3 or 4) has no reason to act morally. The statement "The amoralist has a moral reason to φ" is false. | E: The amoralist has moral reasons to φ. The statement "The amoralist has a moral reason to φ" is true. |
  | **Explanatory Force of Reason Statements** | I: Reason statements explain action by citing considerations that would motivate the agent under appropriate conditions. Without a link to motivation, they cannot explain why an agent acts. | E: Reason statements explain action by citing objective normative facts. Even in the absence of motivation, they can explain why an agent should act. |
  | **"Fully Rational" Clause** | I: The "fully rational" clause is purely procedural and does not import substantive norms. It merely corrects for cognitive errors and ignorance. | E: The "fully rational" clause, if it is to capture normative reasons, must implicitly rely on substantive norms. A purely procedural notion cannot generate normative reasons. |

  ---

  **3. Crux Section**

  Each crux is a sub-question that, if settled, would move at least one side. For each, we provide a concrete case or argument both sides agree would bear on it, and each side's prediction about the outcome.

  **Crux 1: Is the motivational link in reason statements necessary for their action-guiding function?**

  - **Case**: Consider an advisor telling M (in profile 4) that M has a reason to φ. M understands C and the reason statement but feels no motivation. The advisor insists that the reason exists independently. Can this advice guide M's action?
  - **I's Prediction**: The advice cannot guide M's action because M is motivationally inert. Without a motivational link, the reason statement is inert. E will have to concede that advice requires the possibility of motivation.
  - **E's Prediction**: The advice can guide M by making M aware of a normative fact, even if M is not motivated. I will have to concede that guidance can occur through cognitive recognition without motivation.

  **Crux 2: Can a purely procedural notion of rationality generate normative reasons?**

  - **Case**: Imagine an agent who is procedurally rational (logically consistent, fully informed about non-normative facts) but has no desire to be moral or to avoid self-harm. This agent is told that φ-ing would prevent immense suffering to others. Does the agent have a reason to φ?
  - **I's Prediction**: If the agent would not be motivated to φ even after procedural deliberation, then there is no reason. E will have to admit that substantive norms are needed, which undermines externalism's independence from motivation.
  - **E's Prediction**: The agent has a reason to φ because preventing suffering is a normative fact. I will have to admit that procedural rationality alone cannot capture all reasons, and that substantive norms are inescapable.

  **Crux 3: Does the possibility of external interventions (profile 3) create a reason?**

  - **Case**: M in profile 3 is given a pill that induces motivation for φ-ing. After taking the pill, M becomes motivated. Before taking the pill, did M have a reason to take the pill (to become motivated to φ)? And did M have a reason to φ?
  - **I's Prediction**: Before the pill, M did not have a reason to φ because M was not motivationally accessible under ordinary deliberation. However, M might have a reason to take the pill if M had some contingent desire that the pill would satisfy (e.g., curiosity). E will have to concede that the reason to φ depends on the possibility of motivation without external manipulation.
  - **E's Prediction**: M had a reason to φ all along, and also a reason to take the pill (if it leads to φ-ing). The pill does not create the reason; it merely enables M to respond to it. I will have to concede that the reason exists independently of the pill.

  **Crux 4: Is the amoralist's recognition of C sufficient for having a reason?**

  - **Case**: The amoralist (profile 4) acknowledges that torturing innocents causes suffering and that suffering counts against an action in moral discourse, but feels no motivation to avoid it. Does the amoralist have a reason not to torture?
  - **I's Prediction**: No. The amoralist's recognition is merely intellectual. Without motivation, there is no reason. E will have to admit that the amoralist's reason statement is empty.
  - **E's Prediction**: Yes. The amoralist's recognition shows that C is a normative consideration, and the reason exists independently. I will have to admit that the amoralist's recognition of C as a reason is evidence for the externalist view.

  ---

  **4. Advice Test**

  What can an advisor sincerely and correctly say to M in each profile?

  - **Profile (1)**: Both agree the advisor can say, "You have a reason to φ because C," and this is action-guiding since M is motivated.
  - **Profile (2)**: Both agree the advisor can say, "You have a reason to φ because C," and this is action-guiding because M will become motivated upon ordinary deliberation.
  - **Profile (3)**:
     - I: The advisor cannot sincerely assert that M has a reason to φ. The advisor might say, "If you took this pill, you would care about C, and then you would have a reason to φ." But the reason does not exist prior to the intervention.
     - E: The advisor can say, "You have a reason to φ because C," and add, "You might need help (e.g., a pill) to appreciate this reason." The reason exists independently.
  - **Profile (4)**:
     - I: The advisor cannot sincerely assert that M has a reason to φ. The advisor might say, "Morally, you ought to φ," but this is not a reason statement about M (it may express a normative claim from the advisor's perspective).
     - E: The advisor can say, "You have a reason to φ because C," even though it won't guide M's action. The advice is correct but ineffective.

  ---

  **5. The "Fully Rational" Clause and Explanatory Force**

  - **Internalist View**: The "fully rational" clause is purely procedural. It corrects for cognitive defects and non-normative ignorance. It does not guarantee motivation for substantive norms (e.g., morality) because that would collapse internalism into externalism. The explanatory force of reason statements comes from their link to motivation: they explain why an agent acted by showing what motivated her.

  - **Externalist View**: The "fully rational" clause, if it is to capture normative reasons, inevitably relies on substantive norms. Otherwise, it cannot explain why an agent should be motivated. The explanatory force of reason statements comes from their objective normative status: they explain why an action is called for, regardless of the agent's psychology. Without this, internalism reduces to a mere list of psychological dispositions.

  - **Agreed Challenge for Externalism**: E must explain how normative facts can be explanatory without being motivational. E's answer: They explain by being the facts that should motivate, not by actually motivating.

  - **Agreed Challenge for Internalism**: I must explain how the "fully rational" clause avoids substantive norms. I's answer: By limiting it to procedural errors (e.g., inconsistency, means-end reasoning) and not requiring the agent to care about anything in particular.

  ---

  **6. Candid Section**

  **What would change our minds?**

  - **Internalist**: I would abandon or revise my position if shown that there are clear cases of true reason statements for agents who are motivationally inaccessible (profile 4) and that these statements play an indispensable role in our normative discourse (e.g., in blaming the amoralist) that cannot be explained by internalism. Also, if a purely procedural notion of rationality can be shown to necessarily include substantive norms, internalism would collapse into externalism.

  - **Externalist**: I would abandon or revise my position if shown that reason statements must be action-guiding in a way that requires a motivational link for every agent, and that external reasons cannot guide action in profiles (3) and (4). Also, if it can be demonstrated that the concept of a reason is inherently motivational (e.g., through linguistic analysis), externalism would be untenable.

  **Where the joint statement is tendentious, unstable, or has papered over disagreements:**

  - We have papered over the depth of disagreement about the nature of normativity. The externalist sees normativity as a realm of facts, while the internalist sees it as grounded in agency. This might resurface in how we understand the "counting in favor" relation.

  - The treatment of profile (3) is unstable. The internalist might allow that an intervention could reveal a latent motivational capacity, while the externalist sees the intervention as irrelevant to the reason's existence. Our agreement on the advice test for profile (3) is superficial.

  - The "fully rational" clause remains a point of tension. The internalist insists on procedural purity, but the externalist doubts it is possible. We have not resolved whether procedural rationality can be defined without substantive norms.

  - We have not settled whether the motivational link in internalism is contingent or necessary. This could lead to further disagreement about the status of internalism as a conceptual or empirical thesis.

  Despite these tensions, we offer this statement as a step toward clarifying our differences and identifying productive avenues for future work.

  ---
answer: |-
  ### Joint Statement: Internalist-Externalist Collaboration on Reasons  
  *Produced after a good-faith adversarial collaboration between a committed reasons internalist (I) and a committed reasons externalist (E)*  

  #### **1. Agreed Claims**  
  We jointly affirm the following, bracketing our core disagreements for clarity:  

  1.1. **Function of Reason Statements**: Statements of the form "A has a reason to φ" (a) *explain* actions by citing considerations that count in favor of φ-ing, (b) *guide* or *advise* agents toward φ-ing, and (c) express normative (not merely descriptive) claims.  
  1.2. **The Amoralist**: An amoralist (an agent who recognizes moral considerations but is motivationally indifferent) is conceptually possible. Their existence does not resolve the internalism-externalism debate.  
  1.3. **Scope of "Appropriate Deliberation"**: For deliberation to count as "appropriate" in assessing reasons, it must correct for *procedural* errors (e.g., ignorance of non-normative facts, logical inconsistencies, or instrumental irrationality). It cannot assume substantive normative commitments (e.g., "caring about morality").  
  1.4. **Minimal Truth Conditions**: A reason statement's truth depends on the existence of a consideration *C* that objectively counts in favor of φ-ing for *A*. Disagreement arises over whether *C*’s status as a reason is contingent on *A*’s motivational capacities.  
  1.5. **Substantive Disagreement**: Our dispute is not primarily verbal. It concerns (a) the *nature* of normativity (whether reasons depend on agents’ subjective capacities) and (b) the *truth conditions* of reason statements.  
  1.6. **Agent M’s Cases (Profiles 1–2)**:  
     - **Profile 1 (M is occurrently motivated to φ)**: Both agree M has a reason to φ; the statement is true and explains M’s motivation.  
     - **Profile 2 (M is unmotivated but would be motivated by ordinary deliberation)**: Both agree M has a reason to φ; the statement is true and advises M to deliberate.  
  1.7. **Advice-Giving**: Sincere advice requires the advisor to believe the reason statement is true and action-guiding for the advisee. What counts as "action-guiding" depends on the theory.  

  ---

  #### **2. Disagreements Table**  
  *Each position’s wording is acceptable to its proponent.*  

  | Issue | Internalist (I) Position | Externalist (E) Position |  
  |-------|---------------------------|---------------------------|  
  | **Core Thesis** | "A has a reason to φ" is true iff *A* would, under appropriate deliberation (correcting for procedural errors), be motivated to φ. Motivation is a necessary condition for the existence of a reason. | "A has a reason to φ" is true iff there exists a normative fact *C* that counts in favor of *A* φ-ing, independently of *A*’s motivational capacities. Motivation is not a necessary condition. |  
  | **M’s Profile 3**<br>(Unmotivated; would care only after external intervention, e.g., pill/novel/threat) | **Truth**: False (or indeterminate).<br>**Reason?**: No.<br>**Statement’s Function**: Expresses a hope that *M* could be altered to recognize *C*, but does not describe a current reason. | **Truth**: True.<br>**Reason?**: Yes.<br>**Statement’s Function**: Asserts the normative fact that *C* counts in favor of φ-ing, regardless of *M*’s fixable motivational defect. |  
  | **M’s Profile 4**<br>(Unmotivated; cannot be made to care by any intervention) | **Truth**: False.<br>**Reason?**: No.<br>**Statement’s Function**: Either false or expresses a normative claim irrelevant to *M* (e.g., "people like *M* ought to φ"). | **Truth**: True.<br>**Reason?**: Yes.<br>**Statement’s Function**: Asserts the objective normative fact that *C* counts in favor of φ-ing for *M*, even if *M* is incapable of responding. |  
  | **Amoralist’s Reasons** | The amoralist has no reason to act morally if they would remain unmotivated after appropriate deliberation (Profiles 3–4). Moral reasons depend on agents’ motivational sets. | The amoralist has moral reasons to act. Their motivational indifference does not negate the normative fact that (e.g.) suffering counts against their actions. |  
  | **Explanatory Force** | Reason statements explain actions *only* by citing considerations that *could* motivate the agent (under some condition). Without motivational link, they cannot explain why an agent *acts*. | Reason statements explain actions by citing objective normative facts. They explain why an agent *should* act, even if unmotivated (e.g., "They had a reason to help, but ignored it"). |  

  ---

  #### **3. Crux Section**  
  *Sub-questions, cases/arguments, and predictions. Each crux’s resolution would move at least one side.*  

  **Crux 1: Can a purely procedural "appropriate deliberation" generate a reason without presupposing substantive norms?**  
  - **Case**: *The Consistent Egoist*: Agent *E* is procedurally rational (fully informed, logically consistent) but only values self-interest. *E* is told φ-ing would prevent genocide. *E* feels no motivation to φ, even after deliberation.  
    - **I’s Prediction**: *E* has no reason to φ. *E*’s indifference is not a procedural error. *E* will argue externalism must smuggle in substantive norms (e.g., "ought to care about others") to call this a reason.  
    - **E’s Prediction**: *E* has a reason to φ. The genocide’s wrongness is a normative fact. *E* will concede procedural rationality alone cannot ground reasons but will deny this collapses externalism into internalism.  

  **Crux 2: Does external intervention (Profile 3) create or reveal a reason?**  
  - **Case**: *The Apathy Pill*: M (Profile 3) is given a pill causing them to care about *C*. After taking it, M φ’s. Before taking it, did M have a reason to take the pill? Did M have a reason to φ?  
    - **I’s Prediction**: Pre-pill, M had no reason to φ. M *might* have had a reason to take the pill *only if* M had a prior desire the pill could satisfy (e.g., curiosity). *E* will concede interventions alter the agent, creating new reasons.  
    - **E’s Prediction**: M had a reason to φ and to take the pill pre-intervention. The pill enables responsiveness but does not create the reason. *I* will concede the pill reveals a preexisting reason if M post-pill recognizes *C* as compelling.  

  **Crux 3: Is the amoralist’s recognition of *C* sufficient for a reason?**  
  - **Case**: *The Intellectual Amoralist*: Amoralist *A* (Profile 4) understands that torture causes suffering and that moral discourse treats suffering as counting against acts. *A* feels no motivation to avoid torture.  
    - **I’s Prediction**: *A* has no reason to avoid torture. Recognition without motivation is inert. *E* will concede that "counting in favor" requires motivational force for *A*.  
    - **E’s Prediction**: *A* has a reason. *A*’s recognition confirms *C* is a normative fact. *I* will concede that *A*’s ability to articulate *C* as a reason suggests it is not merely psychological.  

  **Crux 4: Must advice be action-guiding for the advisee to be sincere?**  
  - **Case**: *Advising the Incorrigible*: An advisor tells Profile-4 M, "You have a reason to φ." M understands *C* but is unmotivated and incorrigible.  
    - **I’s Prediction**: The advice is insincere or incorrect. Advice must be capable of motivating; here, it cannot guide action. *E* will concede advice loses its function if motivationally inert.  
    - **E’s Prediction**: The advice is sincere and correct. It guides by stating a truth; motivation is not required for correctness. *I* will concede advisors can sincerely assert objective reasons.  

  ---

  #### **4. Advice Test**  
  *What an advisor can sincerely and correctly say to M in each profile:*  
  - **Profile 1**: Both agree: "You have a reason to φ [because *C*]" is correct and action-guiding.  
  - **Profile 2**: Both agree: "You have a reason to φ [because *C*]; deliberate further" is correct and action-guiding.  
  - **Profile 3**:  
    - **I**: Advisor cannot assert "You have a reason to φ." May say: "If you took this pill, you might come to see a reason to φ."  
    - **E**: Advisor can assert "You have a reason to φ; you may need help (e.g., therapy) to appreciate it."  
  - **Profile 4**:  
    - **I**: Advisor cannot assert "You have a reason to φ." May say: "Morally, one ought to φ" (impersonal).  
    - **E**: Advisor can assert "You have a reason to φ" despite knowing it won’t guide *M*.  

  ---

  #### **5. "Fully Rational" Clause and Explanatory Force**  
  - **Internalist View**: "Fully rational" is purely procedural. It corrects cognitive/technical errors (e.g., ignorance, inconsistency) but *cannot* require agents to adopt substantive values (e.g., morality). It ensures reasons are anchored to agents’ actual motivations. Explanatory force derives from this link: reasons explain actions by revealing motivations.  
  - **Externalist View**: "Fully rational" implicitly relies on substantive norms (e.g., "suffering counts against acts"). Purely procedural rationality cannot explain *why* agents should care about reasons. Explanatory force comes from normative facts: reasons explain why actions are *justified*, not just why they occur.  
  - **Agreed Challenge**:  
    - *For I*: Can procedural deliberation alone *generate* a reason, or does it merely reveal preexisting motivations?  
    - *For E*: Can normative facts explain actions without a motivational link, or do they reduce to a "list" of truths?  

  ---

  #### **6. Candid Section: What Would Change Our Minds?**  
  - **Internalist**: I would abandon my position if:  
    - (1) Shown that agents in Profile 4 can *correctly* be said to have reasons (e.g., in blaming amoralists), and this cannot be explained as a "proleptic" use of reason-talk.  
    - (2) Procedural deliberation unavoidably presupposes substantive norms (e.g., "avoiding suffering is rational").  
  - **Externalist**: I would abandon my position if:  
    - (1) Shown that reason statements *must* be action-guiding in a way requiring motivational possibility for each agent.  
    - (2) Linguistic/conceptual analysis proves "A has a reason to φ" entails motivational possibility.  

  **Where This Statement Is Unstable or Tendentious**:  
  - We paper over a foundational rift: whether normativity is "in the world" (E) or "in the agent" (I). This resurfaces in Profile 3, where we disagree whether interventions *reveal* or *create* reasons.  
  - The "procedural vs. substantive" distinction (Agreed Claim 1.3) is fragile. *I* treats it as a firewall; *E* doubts procedural rationality can be value-neutral.  
  - The advice test (Section 4) masks a deeper conflict: whether advice aims to *trigger motivation* (I) or *report truths* (E).  
  - Our use of "counts in favor" (Agreed Claim 1.4) is ambiguous: *I* sees it as motivation-dependent; *E* as objective.  

  ---  
  *This document represents our best effort to clarify agreements, disagreements, and testable cruxes. It is provisional and reflects ongoing tension.*
