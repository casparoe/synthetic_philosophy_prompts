prompt: |-
  I've been reading rationalist decision-theory writing for a long time, and I can recite the gist of updateless decision theory without being able to say what it actually forbids. My question is about the line between legitimate and illegitimate conditioning. The idea, as I understand it, is that the agent selects a policy — a mapping from observations to actions — and is not permitted to condition on anything downstream of that policy: it may condition on what the world tells it, but not on its own decision, and not on evidence about which algorithm it is running. Please explain how that line is meant to be drawn and why it falls where it does, using the hard cases rather than the easy ones. What happens to an agent that reads its own source code, or that finds itself in a world containing a reliable predictor of its output, or that is simply told by a trusted source what it is about to do? Which of those are ordinary observations and which are illicit self-conditioning, and does the distinction survive once the agent's observations are themselves causally downstream of its own algorithm? I'd like the answer to mark the seams: say which of these verdicts are forced by the core idea and which depend on contested choices about how to model the agent, and please don't present a contested resolution as the consensus.
reasoning: |-
  We are discussing updateless decision theory (UDT) and the distinction between legitimate and illegitimate conditioning. The core idea is that an agent should choose a policy (a function from observations to actions) without conditioning on information that is "downstream" of the policy. This includes not conditioning on the agent's own decision (which is determined by the policy and observations) and not conditioning on evidence about the algorithm the agent is running (which would also be downstream).

  However, the hard cases involve situations where the agent's observations are influenced by its own algorithm (e.g., because there is a predictor or because the agent reads its own source code). The question is: which of these observations are legitimate and which are illicit?

  Let me break down the key concepts:

  1. **Policy Selection**: The agent chooses a policy π that maps observations (or sequences of observations) to actions. The agent is then committed to following π.

  2. **Illicit Conditioning**: Conditioning on events that are determined by the policy itself is forbidden. For example, if the agent were to condition on the action it will take (which is determined by π and the observation), that would be illicit because it would lead to circularity or irrationality (like in Newcomb's problem, where conditioning on the action might lead to one-boxing but then the predictor would have predicted that and put the money).

  3. **Legitimate Observations**: Observations that are generated by the world independently of the agent's policy are legitimate. However, if the observation is generated by a process that takes the agent's policy as input (like a predictor that simulates the agent), then the observation is not independent of the policy.

  The hard cases:

  a. **Reading its own source code**: The agent observes the algorithm it is running (its own source code). This is a direct observation of the policy. Is this legitimate?

  b. **Reliable predictor**: The agent is in a world with a predictor that can perfectly simulate the agent and predict its action. The predictor's prediction (and hence the state of the world that depends on it) is causally downstream of the agent's policy. How does the agent treat an observation that includes the predictor's output?

  c. **Trusted source tells the agent what it is about to do**: The agent is told by a trusted source what action it will take. This is similar to (b) but perhaps more direct.

  In UDT, the agent is supposed to evaluate the expected utility of each candidate policy by considering what would happen if it were to follow that policy in all possible situations (including counterfactuals). The agent does not condition on the fact that it is using a particular policy when evaluating that policy.

  However, the agent's observations are part of the input to the policy. The problem arises when the observation itself contains information about the policy. How do we handle that?

  Let's consider each case:

  1. **Reading its own source code**: In UDT, the agent is allowed to know its own policy because that is what it is choosing. However, when evaluating a candidate policy, the agent must consider what it would observe if it were using that policy. If the agent's source code is part of the world state, then when the agent reads its own source code, it is observing the policy that it is actually using. But in the counterfactual where the agent is considering a different policy, it would observe a different source code. Therefore, when evaluating a candidate policy π, the agent must condition on the observation that it would have if it were using π. If the observation includes the source code, then in the counterfactual for π, the agent would observe π. This is legitimate because it is part of the world model.

     However, note that the agent must not condition on the fact that it is actually using a particular policy when evaluating that policy. Instead, it evaluates each policy in a counterfactual world where it is using that policy. So, if the agent observes its own source code, then in the counterfactual for policy π, the observation would be that the source code is π. Therefore, the agent conditions on the observation of π when evaluating the expected utility of π. This is legitimate.

     Example: In the "transparent Newcomb" problem, the agent's source code is visible to the predictor and also to the agent itself. The agent must choose a policy that, when it observes its own source code (which is the same as the policy it is considering), it will take the action that leads to the best outcome. This leads to one-boxing because if the policy is to one-box, then the predictor sees that and puts the million in the box, and the agent observes that it is one-boxing (via reading its source code) and then indeed one-boxes.

  2. **Reliable predictor**: The predictor's output is a function of the agent's policy (because the predictor simulates the agent). Therefore, when evaluating a candidate policy π, the agent must consider what the predictor would predict if the agent were using π. Then, the agent conditions on that prediction (as part of the observation) when calculating the expected utility of π.

     Example: In Newcomb's problem, the agent considers two candidate policies: one-boxing and two-boxing. For the one-boxing policy, the predictor (being reliable) would have predicted one-boxing and put $1,000,000 in the opaque box. So the agent, when using the one-boxing policy, would observe that the opaque box is full. Similarly, for the two-boxing policy, the predictor would have put nothing in the opaque box. The agent then compares the expected utility of the two policies and chooses the one with higher utility (which is one-boxing).

     This is legitimate because the agent is conditioning on the observation that would occur if it were using the candidate policy, and that observation includes the predictor's output which is a function of the candidate policy.

  3. **Trusted source tells the agent what it is about to do**: This is tricky because the source is telling the agent what action it will take. But the action is determined by the policy and the observation. In UDT, the agent must choose a policy. Now, if the agent is told what it is about to do, that information is part of the observation. But note: the agent's action is determined by the policy and the observation. So if the observation includes the action, then the policy must be consistent with that observation. However, the agent is choosing the policy. So if the agent is told it will take action A, then the policy must be such that given the entire observation (which includes the announcement of A) it outputs A. But the agent is free to choose a policy that, for the observation that includes the announcement of A, outputs A. However, the agent must also consider the counterfactual where it is told it will do something else.

     Example: Suppose a trusted source tells the agent: "You will take action A." The agent then must choose a policy that maps this observation to an action. The agent could choose a policy that always does A when it hears this announcement, or one that does B. But if the agent chooses a policy that does B when it hears "You will take action A", then the trusted source would have been wrong. But the source is trusted! So we have a contradiction. Therefore, the agent must choose a policy that is consistent with the source being correct. This means that the agent must choose a policy that, when it hears "You will take action X", it does X. But note: the agent is free to choose which action X it will do? Not exactly. The announcement is part of the observation. The agent must choose a policy that for each possible announcement, it does what is announced. But then the policy is determined: it must be the policy that maps the observation "You will do X" to the action X.

     However, this leads to a problem: the agent has no freedom. But note: the announcement is made by a trusted source that knows the agent's policy. Therefore, the source will only announce an action that the agent will take. So if the agent chooses a policy that for the observation "You will do X" does X for every X, then the source can choose to announce any X and the agent will do it. But that is not what happens: the source is reporting a fact about the agent's policy. The source will announce the action that the agent's policy will output given the entire observation (which includes the announcement). This is circular.

     This is similar to the "Psychopath Button" or "Death in Damascus" problem. In UDT, the agent must choose a policy that maximizes expected utility across all possible observations. The agent must consider: if I choose policy π, then the source (being truthful) will announce the action that π would output given the observation that includes the announcement. But the announcement is part of the observation, so we have a fixed point.

     How to resolve? The agent must consider, for each candidate policy π, what announcement would be made. The announcement must be the action that π would choose when given the observation that includes the announcement. So we need a fixed point: for a given π, we need an announcement a such that when the observation includes "You will do a", then π maps that observation to a. There might be multiple fixed points or none. The agent must then choose the policy π that, at its fixed points, yields the highest utility.

     Example: Suppose the agent has two actions: A and B. There are two observations: one is the announcement "You will do A", the other is "You will do B". The agent must choose a policy π that maps each announcement to an action. But for the announcement "You will do A", the agent must do A for the announcement to be true. Similarly, for "You will do B", the agent must do B. So the only consistent policies are the one that always does A (and so the announcement must be "You will do A") and the one that always does B (and the announcement must be "You will do B"). The agent then chooses the policy that gives the better outcome.

     However, note that the world state might also depend on the action. For instance, if the agent does A, it gets $100, if it does B, it gets $200. Then the agent would choose the policy that always does B. Then the announcement will be "You will do B", and the agent does B, and gets $200.

     This is legitimate because the agent is conditioning on the observation that would occur if it were using the candidate policy. But note: the observation depends on the candidate policy via the fixed point.

  Now, the distinction: 

  - In case 1 (reading source code), the observation is of the policy. Since the agent is evaluating the policy π, it conditions on observing π. This is legitimate.

  - In case 2 (predictor), the observation (the predictor's output) is a function of the policy. The agent conditions on the output that would be produced by the predictor if the agent were using π. This is legitimate.

  - In case 3 (trusted source), the observation (the announcement) is also a function of the policy, but via a fixed point. The agent must condition on the fixed point that would occur if it were using π. This is legitimate.

  What is common? In all three, the agent conditions on the observation that would be generated if it were using the candidate policy π. The observation may depend on π, but that is acceptable because it is part of the counterfactual world.

  What is forbidden? Forbidden conditioning would be, for example, if the agent were to condition on the action it will take without considering that the action is determined by the policy. But in UDT, the agent does not condition on the action it will take in the actual world when evaluating a policy. Instead, it evaluates the policy in a counterfactual where it uses that policy and then conditions on the observations that would occur in that counterfactual.

  Now, the core idea forces that the agent must evaluate each policy by considering the expected utility conditional on the observations that would occur under that policy. This includes observations that are causally downstream of the policy (like the predictor's output) or logically determined by the policy (like the source code). However, the agent must not condition on the actual policy it is using when evaluating a policy (because the agent is considering counterfactual policies).

  The contested issues:

  - How to model the set of possible observations? In particular, when the observation includes information about the agent's own algorithm, we must have a model of how that information is generated. The above treatments are standard in UDT, but there are variations.

  - How to handle cases with no fixed point or multiple fixed points? (e.g., in the trusted source case, if there are multiple fixed points for a policy, which one do we consider? And if there are none, what then?) This is an open problem and different UDT variants might handle it differently.

  - The role of self-fulfilling and self-defeating prophecies: UDT typically handles them by requiring consistency (via fixed points) and then choosing the policy that yields the best outcome in the consistent scenario.

  In summary:

  - All three cases are examples of legitimate conditioning because the agent is conditioning on the observation that would occur under the candidate policy.

  - The distinction is that the agent must not condition on the actual policy (or actual action) when evaluating a candidate policy. But in these cases, the agent is conditioning on what the observation would be in the counterfactual where the candidate policy is in effect.

  - The core idea forces this counterfactual treatment. However, the details of how to model the counterfactual (especially in the fixed point case) are contested and there isn't a single consensus on how to handle every possible scenario.

  Therefore, in all three hard cases, UDT permits the agent to condition on the observation because the observation is part of the counterfactual scenario that the agent must consider for each candidate policy. The agent does not condition on its own actual decision (which is determined by the chosen policy) but on the decisions that would be taken in the counterfactual by the candidate policy.
answer: |-
  ### Updateless Decision Theory: Legitimate vs. Illicit Conditioning

  Updateless Decision Theory (UDT) requires an agent to select a **policy** (a complete mapping from possible observations to actions) that maximizes expected utility, without conditioning on information "downstream" of that policy. This means:
  - **Legitimate conditioning**: The agent can condition on observations generated by the world *before* or *independently of* the agent's policy. These are inputs to the policy function.
  - **Illicit conditioning**: The agent cannot condition on:
    - Its own decisions (outputs of the policy).
    - Evidence revealing which algorithm/policy it is running (since the policy is chosen *upfront*).
    - Any consequence causally or logically dependent on the policy.

  The core intuition is that conditioning on downstream information creates circularity or self-reference that distorts rational choice (e.g., in Newcomb-like problems). However, when observations are *themselves* causally downstream of the agent's algorithm, the boundary blurs. Below, I address your hard cases, distinguishing between **core UDT principles** (widely agreed) and **contested resolutions** (where interpretations diverge). I mark seams explicitly.

  ---

  ### Core Principles: What UDT Forbids and Why
  1. **The policy is fixed upfront**:  
     The agent commits to a policy \(\pi\) before observing anything. \(\pi\) defines actions for all possible observations. Utility is evaluated by averaging over world-states *as if* \(\pi\) is followed everywhere.

  2. **Illicit conditioning = self-fulfilling circularity**:  
     Conditioning on your own decision (e.g., "I see I will choose A, so I choose A") or your algorithm (e.g., "I see I'm the type who chooses A") violates UDT. It conflates the *choice* of a policy with the *output* of that policy. This leads to "cheating" counterfactuals (e.g., two-boxing in Newcomb's paradox by pretending the prediction is fixed).

  3. **Legitimate observations**:  
     Observations are legitimate if they are "pre-decision" inputs. Even if correlated with the policy (e.g., via a predictor), they are valid *if treated as part of the world-model for evaluating \(\pi\)*.

  The tension arises when observations **depend on the policy itself**. UDT resolves this by evaluating each candidate policy \(\pi\) in a **counterfactual world** where \(\pi\) is used, and observations consistent with \(\pi\) are generated.

  ---

  ### Hard Cases: Legitimate vs. Illicit Conditioning

  #### Case 1: **Agent Reads Its Own Source Code**
  - **Scenario**: The agent observes its algorithm (source code) as part of its input.
  - **Legitimate? Yes, with caveats**.
  - **Core UDT reasoning**:  
    The source code is part of the world-state. When evaluating a candidate policy \(\pi\), the agent must consider the observation it *would* receive if \(\pi\) were its source code. Thus, conditioning on "I see source code \(\pi\)" is legitimate because it is consistent with the counterfactual where \(\pi\) is running.  
    - Example: In "transparent Newcomb" (source code visible to predictor and agent), UDT chooses one-boxing. If \(\pi = \text{"one-box"}\), the agent observes \(\pi\) and one-boxes, leading to high reward. This is consistent.
  - **Contested seam**:  
    What if the source code is only partially observable or noisy? Core UDT requires a deterministic model of observation-generation. If the world-model allows stochastic code-reading, this remains legitimate. But if the agent conditions on *inferences* about its policy (e.g., "I see code that usually one-boxes, so I'll one-box today"), it risks illicit conditioning by treating the policy as fixed prematurely.

  #### Case 2: **Agent Faces a Reliable Predictor**
  - **Scenario**: The world contains a predictor that simulates the agent and sets up a causal chain based on the prediction (e.g., Newcomb's problem).
  - **Legitimate? Yes**.
  - **Core UDT reasoning**:  
    The predictor's output is causally downstream of the policy, but UDT handles this by evaluating \(\pi\) in a counterfactual where the predictor simulates \(\pi\). Thus, conditioning on the prediction (e.g., "I see the predictor put $1M in Box B") is legitimate *for the counterfactual run of \(\pi\)*.  
    - Example: For \(\pi = \text{"one-box"}\), UDT conditions on the predictor forecasting one-boxing and rewarding it. For \(\pi = \text{"two-box"}\), it conditions on no reward. UDT then picks the \(\pi\) with higher expected utility.
  - **Contested seam**:  
    How to model predictors that are **imperfect** or **resource-bounded**? Core UDT assumes perfect simulation, but real agents must approximate. Some UDT variants (e.g., logical induction) address this, but there's no consensus. Crucially, the agent must **not** condition on the predictor's output *as if it were independent of \(\pi\)* (e.g., "I see $1M, so I can two-box" is illicit).

  #### Case 3: **Trusted Source Tells the Agent What It Will Do**
  - **Scenario**: A trusted oracle says, "You will choose action A."
  - **Legitimate? Contested – depends on modeling choices**.
  - **Core UDT intuition**:  
    The announcement is a *logical consequence* of the policy, creating a fixed-point problem. UDT requires consistency: \(\pi\) must map the observation "oracle says A" to action A. Thus, conditioning on the announcement is legitimate *only if* it aligns with \(\pi\)'s output in the counterfactual.
  - **Resolution with fixed points**:  
    UDT evaluates \(\pi\) by finding a fixed point:  
    - Let \(o_\pi\) = "oracle says \(\pi(o_\pi)\)" (i.e., the oracle announces the action \(\pi\) takes when given \(o_\pi\)).  
    - For each \(\pi\), solve for \(o_\pi\) such that the oracle's announcement matches \(\pi\)'s response.  
    - Compare utilities across consistent \((\pi, o_\pi)\) pairs.  
    Example: If the world punishes inconsistency, UDT picks a \(\pi\) that "obeys" the oracle (e.g., if the oracle says "A," \(\pi\) does A) and yields high utility.  
  - **Contested seams**:  
    - **Existence of fixed points**: What if no consistent \(o_\pi\) exists? (e.g., \(\pi\) always contradicts the oracle.) Some UDT extensions allow stochastic policies or default actions; others reject such \(\pi\). **No consensus.**  
    - **Multiple fixed points**: If \(\pi\) can have multiple consistent announcements (e.g., \(\pi\) does A for "A" and B for "B"), which does UDT choose? Most UDTs average over possibilities, but weighting is contested.  
    - **Self-undermining**: If the oracle says, "You will not obey me," UDT may enter a loop. This exposes a vulnerability in the fixed-point approach.  

  ---

  ### The Boundary: Where the Line is Drawn and Why
  - **Legitimate observations**: Any input generated by a process that:  
    (a) Is part of the world-model (e.g., physics, predictors, oracles),  
    (b) Is evaluated *counterfactually* for each \(\pi\) (i.e., "what would I observe if I used \(\pi\)?").  
    This includes **algorithm-dependent observations** (source code, predictions) because UDT treats them as precomputed consequences of \(\pi\).

  - **Illicit conditioning**: Any information treated as "fixed" when it is actually **output-dependent**. Forbidden examples:  
    - Conditioning on your action *as if it were independent of the policy* (e.g., "I see I will one-box, so I'll one-box").  
    - Using evidence about your policy to "update" your decision (e.g., "I see I'm an agent who one-boxes, so I'll one-box now").  

  - **Why the boundary holds even when observations are downstream**:  
    UDT avoids circularity by **decoupling policy selection from policy execution**. Observations downstream of the algorithm are permitted because they are computed *within the counterfactual evaluation* of \(\pi\), not in the "real" decision. The agent never conditions on its *actual* decision during policy selection.

  ---

  ### Consensus vs. Contested Seams
  | **Aspect**                          | **Core UDT (Consensus)**                                  | **Contested Seams**                                                                 |
  |-------------------------------------|-----------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **Source code reading**             | Legitimate; condition on \(\pi\) in counterfactual run. | How to handle noisy/partial self-knowledge?                                         |
  | **Predictor-dependent observations**| Legitimate; predictor simulates \(\pi\).                 | Modeling imperfect predictors (approximate UDT).                                    |
  | **Oracle announcements**            | Requires fixed-point consistency.                        | Handling no/multiple fixed points; self-referential paradoxes (active research).    |
  | **Model of observations**           | Deterministic, known generative process.                 | Stochastic observations, logical uncertainty, or adversarial settings (no consensus). |
  | **Scope of policy**                 | Global (all possible observations).                      | How to handle infinitely many observations? (Practical approximations differ.)      |

  - **Forced by core idea**:  
    Conditioning on algorithm-dependent observations is legitimate *iff* done counterfactually (e.g., "if I were \(\pi\), I would see X"). Illicit conditioning directly uses the agent's own decision or identity as evidence (e.g., "I am \(\pi\), so I do X").

  - **Contested resolutions**:  
    The treatment of **oracles/logical fixed points** and **stochastic dependencies** is not settled. Some argue for "UDT2" (logical extension with proof-based models), while others use "reflective" oracles. Disagreements stem from how to formalize the agent's world-model and handle logical uncertainty.

  ### Conclusion
  UDT draws the line at **counterfactual consistency**: Observations are legitimate if they can be modeled as consequences of the policy in a consistent counterfactual world. This allows conditioning on source code or predictors but requires care with self-referential announcements. The distinction survives even when observations are downstream because UDT evaluates policies *as if* they are fixed globally. However, the hardest cases (e.g., oracles) expose unresolved challenges in defining fixed points and handling logical dependencies – here, UDT's implementation is still evolving, and no single solution is universally accepted.
