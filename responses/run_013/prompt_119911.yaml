prompt: |-
  My mate Dan has been building an arguement in our reading group and it's got right under my skin. He reckons he's just taking Friedman's line seriously — the one where the more important a theory is, the less realistic its assumptions have to be — and following it where it leads. Here's his chain:

  1. A model is a model because it leaves stuff out.
  2. When what's left out makes a difference to the outcome, the model is, strictly speaking, false of the system it's meant to be about.
  3. Anything we can actually work with leaves out something that makes a difference — if it didn't, we'd be computing the world instead of modelling it.
  4. So every workable model is strictly false of its target.
  5. If a model is strictly false of its target, then its getting the predictions right can't be evidence that it's true of that target; at best it shows the thing is useful for the case in hand.
  6. If success only ever shows usefulness, it never shows truth — and nothing changes when you bolt a load of such models together into a theory.
  7. So no amount of empirical success can support realism about the unobservable parts of our theories.
  8. Now take any two theories that make exactly the same predictions in every situation. Pick your favourite pair.
  9. By 5–7, nothing could ever count as evidence that one of them rather than the other is the accurate description.
  10. So for such a pair, the question of which one is really true has no content.
  11. And if it has no content there, it has none anywhere, since by 4 all our theories are false in that same way.
  12. So realism about science isn't merely unwarranted, it's incoherent.

  The cases I keep chewing over, in case they help: the ideal gas law, which gives molecules no volume and no forces between them, is still how you get from the gas laws to kinetic theory, and it's fine for air in a room; the Bohr atom has assumptions everyone now knows are false, nails hydrogen's spectrum, and is hopeless for helium; a frictionless plane isn't anywhere; Lotka–Volterra has prey breeding without limit and predators bumping into prey at random, and it's still the first thing anyone reaches for; the Hardy–Weinberg setup assumes no selection, no drift, no migration and no mutation, and the whole point of it is the deviations from it; and in economics you get agents who know everything and never miscalculate, which works for some questions and not others. Phlogiston, meanwhile, was false and did nothing. I keep wanting to say the gas law's assumptions are harmless and the Bohr atom's aren't, even though both are false, but I can't find a slot for that in his argument anywhere.

  I don't accept 12, obviously. But I'd rather keep 3 and 5 than just stamp my foot at the end, so: which step goes, why did it look fine while I was reading it, and what does losing it cost me? If it's 2 that's doing something dodgy with 'false', then say what I'm supposed to say about the Bohr atom instead, because I can't just wave it away. If it's 6, tell me what sort of evidence empirical success is meant to be, given that I still think the F-twist has something to it. And tell me what your repair predicts about a case he left out — Newtonian gravity for plotting a spacecraft's course, which everyone agrees is false in the sense of step 2 and which everyone happily uses.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in a reading group where Dan has presented an argument against scientific realism, based on Friedman's idea that important theories have unrealistic assumptions. The user feels unsettled by Dan's chain of reasoning and wants to refute it without just rejecting the conclusion outright. They provided examples like the ideal gas law and Bohr atom, where false assumptions still lead to useful predictions.

  First, I need to break down Dan's argument step by step. The key premises are that all models leave things out (step 1), making them strictly false (step 2). Since any workable model omits something that affects outcomes, they're all false (step 4). Then, because they're false, predictive success only shows usefulness, not truth (step 5). This leads to the idea that evidence can't support realism about unobservables (step 7). Underdetermination (steps 8-10) and the conclusion that realism is incoherent (step 12) follow.

  The user's main struggle is with step 5 and 6. They recognize that models are approximations but believe predictive success can still indicate truth to some extent. Their examples show that some false assumptions are harmless (like the ideal gas law for air) while others aren't (Bohr atom for helium). But Dan's argument doesn't distinguish between types of falsity, lumping all approximations as equally false.

  I recall that scientific realism often involves entities being real if theories referencing them are successful. Dan's argument attacks this by saying success doesn't imply truth. So the core issue is how we interpret "false" in step 2. If "false" means not exactly matching reality, then all models are false. But that's a crude binary. Approximations can be closer or farther from truth. The Bohr model works for hydrogen because its oversimplifications (like circular orbits) don't matter much there, but for helium, they do. So the harm of false assumptions varies by context.

  Step 5 claims predictive success only shows usefulness, not truth. But the user wants to say that success provides evidence for the model's core structures being correct. For example, kinetic theory's success with gases supports the existence of molecules, even if the ideal gas law ignores volume and forces. So step 5 overgeneralizes by ignoring that models can have truth-apt components.

  The user mentioned the F-twist (Friedman's point about assumptions not needing realism). They agree with it partially but think it doesn't negate all realism. Their deeper need is reconciling the utility of false models with the belief that science approximates truth. They need a way to differentiate between benign and problematic false assumptions.

  Looking at the repair: Rejecting step 5 makes sense. Predictive success can support realism if the model's inaccuracies are known and bounded. For instance, Newtonian gravity works for spacecraft because relativistic effects are negligible. Its success in that domain supports the approximate truth of its core principles, even if it's strictly false. Similarly, deviations in Hardy-Weinberg indicate where real evolutionary forces act, showing the model's framework is sound.

  The user's examples help here. The ideal gas law's assumptions are harmless under certain conditions; its predictions validate the particle nature of gases. Phlogiston failed entirely, so its false assumptions weren't benign. Thus, the repair allows distinguishing useful falsehoods from those undermining the theory.

  The user also needs to address underdetermination (steps 8-10). With step 5 rejected, empirical success can favor one theory over another if it better approximates truth across contexts. For example, kinetic theory vs. phlogiston: both might have been underdetermined historically, but predictive success in diverse scenarios (like diffusion rates) supported molecules over phlogiston.

  Costs of repair: Accepting that models can be approximately true requires a nuanced view of truth. It might involve structural realism or verisimilitude. But this complexity is necessary to avoid Dan's radical conclusion. It also means scientific knowledge is fallible and context-dependent, which is already a realist stance.

  In conclusion, the user should challenge step 5 by arguing that predictive success, especially when robust across domains, provides evidence for the approximate truth of a model's core elements. This preserves Friedman's insight without collapsing into anti-realism. The repair explains why some false assumptions are harmless (contextually irrelevant) and others fatal, using their own examples.
answer: |-
  Your frustration is palpable—and justified. Dan's argument is a clever but ultimately flawed extension of Friedman's "F-twist." The critical failure point is **step 5**, and losing it costs surprisingly little while salvaging scientific realism. Let's dissect why:

  ### Why Step 5 is the Culprit
  Step 5 claims:  
  > *"If a model is strictly false of its target, then its getting the predictions right can’t be evidence that it’s true of that target."*  

  This conflates two distinct ideas:  
  - **Strict falsity**: The model isn’t a perfect, complete description (true for all models, per steps 1–4).  
  - **Evidential irrelevance**: Predictive success says *nothing* about the model’s relation to truth.  

  **The flaw**: Predictive success *can* be evidence that a model **approximates truth** in specific, relevant ways—even if it’s strictly false. Step 5 ignores *degrees* of falsity and *contextual relevance*.  

  ### Why Step 5 Looks Seductive
  1. **The Binary Trap**: Dan treats "true/false" as all-or-nothing. But science deals in *approximations*. The ideal gas law isn’t "false" in the same way as phlogiston—it’s *approximately true* for low-pressure gases.  
  2. **Misplaced F-Twist**: Friedman rightly said unrealistic assumptions don’t invalidate predictive power. Dan wrongly infers that predictive power can’t support *any* truth claims.  

  ### Your Repair: Reject Step 5, Embrace Approximate Truth
  **What to say instead of step 5**:  
  *Predictive success, especially under varied conditions, is evidence that a model captures *structurally significant* aspects of its target—even if idealized. We can rationally prefer models that are *closer approximations* to truth.*  

  **How this handles your examples**:  
  | **Model**         | **False Assumptions**                  | **Why Success *Does* Support Truth Claims**                          |  
  |-------------------|---------------------------------------|---------------------------------------------------------------------|  
  | Ideal Gas Law     | Zero volume, no forces                | Success under standard conditions supports *molecular kinetic theory*—it reveals real entities (molecules) and their statistical behavior. |  
  | Bohr Atom         | Fixed circular orbits, no electron interaction | Success for hydrogen shows electrons occupy *quantized energy levels*—a core truth. Failure for helium reveals where the approximation breaks. |  
  | Newtonian Gravity | Instant action-at-a-distance          | Success in spacecraft trajectories confirms *mass attracts mass*, approximating general relativity in weak fields. |  
  | Phlogiston        | Nonexistent substance                 | Failure everywhere; no predictive success to reinterpret.           |  

  **Why this works**:  
  - **Benign vs. Malignant Idealisations**: Benign falsehoods (e.g., ignoring molecular volume in air at room temp) don’t affect outcomes in a domain; malignant ones (e.g., Bohr’s orbits for multi-electron atoms) do. Success in a domain suggests the falsehoods are benign *there*, implying the core structure is reliable.  
  - **Deviation as Data**: Hardy-Weinberg deviations *rely* on the model’s approximate truth—they measure real evolutionary forces.  

  ### What Losing Step 5 Costs You
  1. **A Naïve Notion of Truth**: You concede no model is *exactly* true (per steps 1–4). This is standard scientific humility.  
  2. **No Guarantees**: Success doesn’t prove a model is *ultimately* true (e.g., Newton → Einstein). But it *does* justify believing in its referents (e.g., molecules, electrons) and its *direction* toward truth.  

  ### Handling Dan’s Other Steps
  - **Step 6–7**: Collapse without step 5. Success *can* support realism about unobservables (e.g., molecules confirmed via kinetic theory’s predictive success).  
  - **Steps 8–10 (Underdetermination)**: Resolved. For empirically equivalent theories (e.g., Newtonian gravity vs. GR in low-energy limits), we *can* prefer the one that better approximates truth *across contexts* (e.g., GR handles Mercury’s orbit).  
  - **Step 12**: Realism isn’t incoherent—it’s *fallible* and *approximative*.  

  ### The F-Twist Survival Guide
  Friedman was right: unrealistic assumptions don’t invalidate models. But Dan overreaches. Your repair retains the F-twist’s core—models are tools, not mirrors—while allowing that *successful tools reveal real patterns*.  

  ### Case Test: Newtonian Gravity
  - **Dan’s View**: Success only shows usefulness; no truth connection.  
  - **Your Repair**: Success in spacecraft trajectories supports Newton’s *approximate truth* for weak gravitational fields. It captures real relations (e.g., mass ratios, inverse-square trends) and fails where we’d expect (e.g., near black holes). This *is* evidence for realism about gravity—as an aspect of spacetime curvature, later refined by Einstein.  

  ### Bottom Line
  **Step 5 fails** by ignoring that predictive success *licenses inferences* to underlying structures. Bohr’s atom isn’t "just useful"—it correctly identified quantized energy levels, a foundational truth. Dan’s chain confuses *incompleteness* with *irrelevance to truth*. Your intuition about "harmless" vs. "harmful" falsehoods is spot-on; it reflects science’s ability to isolate *causally significant* factors. Keep steps 1–4 and 3’s pragmatism—dump step 5 and its anti-realist baggage. Science isn’t computing the world, but it *is* mapping it.  

  *"All models are wrong, but some are useful" — and useful models often point toward what’s real.*
