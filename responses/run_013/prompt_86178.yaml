answer: |-
  ### **Transitional Justice Simulation: "The Truth Bargain"**  
  **90-Minute Activity for 16 Students**  
  *Goal: Immerse students in the tension between truth, impunity, and victim agency without front-loading theory. Focus on the unverifiable "bargain" and its legitimacy crisis.*

  ---

  ### **Activity Structure**  
  **Core Mechanic:** A two-round role-play where students first decide on amnesty applications as a Truth Commission, then reassign as victim families to accept/reject the entire deal. Forces confrontation with the trade’s inherent injustice.  

  #### **Roles & Materials (Print in Advance)**  
  1. **Perpetrators (8 Students):**  
     - **Role Sheets:** Brief profiles of regime/rebel actors seeking amnesty. Include:  
       - **Rank/role** (low-level operative vs. architect).  
       - **Crime committed** (torture, killing, etc.).  
       - **Written "disclosure" statement** (self-serving, evasive, or detailed).  
       - **Hidden motive** (e.g., "Blame superiors," "Minimize involvement").  

     **Sample Perpetrators (Tailor to South Africa/Rwanda context):**  
     - **P1 (Low-Level Operative):** "I tortured activist X under orders. Names my commander." *Disclosure seems truthful but narrow.*  
     - **P2 (Mid-Level Architect):** "I gave broad orders but didn’t know specifics of killings." *Self-serving; implies underlings went rogue.*  
     - **P3 (Rebel Fighter):** "I bombed a market to destabilize the regime. It was war." *Deflects blame to "necessary violence."*  
     - **P4 (High-Level Official):** "I authorized arrests but never killings. No evidence links me." *Evasive; cites "patriotism."*  

     > **Key Twist:** P2’s disclosure is ambiguous. Did they knowingly order killings? No "evidence" exists—commissioners must judge credibility.  

  2. **Commissioners (8 Students):**  
     - **Rules Sheet:** Criteria for amnesty:  
       - Full disclosure of acts + political motivation.  
       - Amnesty = immunity from prosecution.  
       - Unanimous vote required per case (forces debate).  
     - **Applications Packet:** All 8 perpetrator disclosures.  

  3. **Victim Families (All 16 Students in Round 2):**  
     - **Family Role Sheets:** Distributed after Round 1. Each includes:  
       - **Victim’s name/relationship** (e.g., "Your son, activist X, killed by P1").  
       - **Demand** (e.g., "You want the commander prosecuted, not just the foot soldier").  
       - **Leverage:** "Reject the deal → Trials occur. Accept → Amnesty stands."  

  4. **Other Materials:**  
     - Timer, voting slips, bell.  
     - "OUTCOME" cards for final vote (ACCEPT/REJECT).  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Round 1: Truth Commission Hearing (40 Minutes)**  
  - **0–5 min:** Assign roles (8 commissioners, 8 perpetrators). No context beyond:  
    > *"You are a Truth Commission. Perpetrators seek amnesty for crimes. Decide if they deserve it based on their disclosures. Unanimous vote required per case."*  
    Perpetrators review roles; commissioners get rules + applications packet.  

  - **5–25 min:** **Testimony & Questioning.**  
    - Perpetrators testify one-by-one (60 sec each).  
    - Commissioners question (90 sec each; strict timer).  
    > *Focus: Push perpetrators to clarify gaps (e.g., "P2, did you know your orders would cause deaths?").*  

  - **25–40 min:** **Deliberation & Voting.**  
    - Commissioners debate each case. Stress:  
      > *"Amnesty requires full disclosure. If in doubt, is the truth worth the impunity?"*  
    - Vote per perpetrator (unanimous = amnesty; else, trial). Record decisions.  

  #### **Transition (5 Minutes)**  
  - Collect commission decisions. Reveal the twist:  
    > *"The amnesty deal was pre-negotiated by the old regime. Victim families never consented. They now have veto power: if they reject your decisions, all amnesties are void and trials begin."*  
  - Reassign all students as victim families (hand out family role sheets).  

  #### **Round 2: Family Assembly (35 Minutes)**  
  - **45–50 min:** **Family Pair Discussions.**  
    - Families of the same victim meet (2 min/pair). Share grief/demands (e.g., "P2 got amnesty but lied").  

  - **50–65 min:** **Open Debate.**  
    - Families argue whether to ACCEPT or REJECT the deal. Stress:  
      > *"Your veto is real—but rejecting means trials may never reveal the truth."*  
    - **Leverage in Action:** Families can demand concessions (e.g., "Accept only if P2 is retried"). Commissioners (now observing) cannot intervene.  

  - **65–70 min:** **Secret Vote.**  
    - Majority vote decides (all 16 vote). Reveal outcome.  

  #### **Debrief (15 Minutes)**  
  - **70–75 min:** **Emotional Reflection.**  
    Ask:  
    - "How did it feel to grant amnesty? To have no say as a family?"  
    - "Did you believe the perpetrators? What made disclosures trustworthy or not?"  

  - **75–85 min:** **Thematic Connections to Transitional Justice.**  
    Link activity moments to theory:  
    | **Activity Moment**          | **Transitional Justice Concept**                                                                 |  
    |------------------------------|--------------------------------------------------------------------------------------------------|  
    | Unanimous vote requirement   | **Individualized amnesty vs. blanket amnesty:** Why attach conditions to impunity?               |  
    | P2’s ambiguous disclosure    | **Unverifiable truth:** Commissions "buy" confessions trials can’t produce—but can we trust them? |  
    | Families’ veto power         | **Who pays?** Victims bear the cost without consent (South Africa: families lost in court).      |  
    | Architects (P4) avoiding blame | **Small-fish/architect asymmetry:** Commissions only get what perpetrators offer. No leverage over those who stay silent. |  
    | Family demands for retrial   | **Restorative vs. retributive justice:** Can truth heal without punishment?                      |  

  - **85–90 min:** **Limitations & Real-World Context.**  
    - **What the simulation missed:**  
      - Real trauma/stakes (we reduced suffering to role cards).  
      - Long-term societal impact (e.g., Rwanda’s Gacaca courts’ mixed legacy).  
      - Structural power imbalances (e.g., old regime elites dictating terms).  
    - **Key takeaway:**  
      > "Commissions legitimize a pre-cut bargain. Their ‘truth’ is what perpetrators surrender—not what victims deserve."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Perpetrators/commissioners resist role-play ("This is unfair!").  
     - **Fix:** Start cold: *"You’re here to make hard choices, not debate ethics yet."*  

  2. **Problem:** Round 1 runs long due to indecision.  
     - **Fix:** Enforce timers. If deadlocked, amnesty fails (shows trade’s fragility).  

  3. **Problem:** Families vote strategically (not in-character).  
     - **Fix:** Role sheets include emotional cues (e.g., "You’re haunted by nightmares").  

  4. **Problem:** Architects’ asymmetry isn’t obvious.  
     - **Fix:** Debrief explicitly: "Did high-level perpetrators (P4) confess? Why not?"  

  ---

  ### **Why This Works for 90 Minutes**  
  - **No Lecture:** Concepts emerge from lived tension.  
  - **Stakes Feel Real:** Families’ veto forces engagement with the bargain’s injustice.  
  - **Critical Asymmetries Surface:** Unverifiable disclosures, missing architects, and victim powerlessness.  
  - **Debrief Bridges Theory/Practice:** Students articulate insights before labeling them.  

  **Alternate If Short on Time:** Run a streamlined version with 4 perpetrators, 6 commissioners, and 6 family roles; cut testimony to 30 sec each. Focus on ONE contested case (e.g., P2) to deepen debate.  

  **Materials:** Email for printable role sheets, voting slips, and facilitator cheat sheet.
