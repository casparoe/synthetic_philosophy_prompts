prompt: |-
  I sit on the research-ethics committee at a neuro-rehab hospital, and we've started getting protocols that don't just stimulate or record from brain tissue, they replace it — a hippocampal prosthetic that takes over a bit more of the job each month, and one proposal to swap out a whole cortical column for a chip doing the same work, in stages over about a year. Next year someone will send us a destructive scan and copy. We meet twice a month, there's two clinicians, a lawyer, a philosopher and two lay members, roughly an hour per protocol, and whatever we sign off on can't be undone. I need a decision procedure we can actually run in a sitting, not an essay about personal identity.

  Give me the procedure as an ordered set of questions, with what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision back to us as a value call rather than a finding. It has to give us two things separately: whether we may treat whoever wakes up as the same person for the purposes we actually care about (consenting to carry on in the trial, advance directives, who signs, who's liable if the chip misfires), and whether what the patient cared about is preserved. I don't assume those come apart in the same place, so don't let the procedure collapse them into one.

  Three things I want built in. First, track what I'll call narrow continuity (memory, character, plans, linked causally) alongside wide continuity (same living body, same brain as an organ), because our legal forms lean on the body and our ethics leans on the psychology, and the procedure needs to say what to do when they point different ways. Second, a parity constraint: whatever we conclude about the slow step-by-step case we have to conclude about the one-shot case, unless we can point to a difference that isn't just speed — so make the procedure force us to name that difference or give up the distinction. Third, a two-claimants rule: if there are two successors both claiming to be the patient, identity can't go to both, but the procedure still has to say what each of them is owed. And keep the metaphysical verdict seperate from the practical one, so it can tell us when treating someone as the same person is a legitimate fiction for our purposes and when its just a lie.

  Run it on three: 30% staged replacement with the patient awake, lucid and reporting she feels the same; full replacement completed over two years with the last of the biological tissue destroyed at the end; and a destructive scan producing two running copies, original gone, where the question is whether either copy can consent to the next phase. At least one of those should come out in a way we won't like — if it doesn't, you've been too easy on us. Say what the procedure can't settle, and mark every point where we're deciding rather than discovering. Also tell me how confident you are in the claims you make and which single step you're least sure of. Write it in British English. No reading list please, I can't check citations and I'd rather you just argued it.
reasoning: |-
  Alright, let me tackle this systematically. The user is on a research ethics committee for a neuro-rehab hospital dealing with radical brain replacement protocols. They need a practical decision procedure, not philosophical theory. 

  First, I need to understand their core requirements: 
  The procedure must separate personal identity (for legal/consent purposes) from preservation of what the patient cared about. It needs three key features: tracking both psychological ("narrow") and biological ("wide") continuity, applying the same standards to gradual and one-shot replacements ("parity constraint"), and handling cases with multiple successors ("two-claimants rule"). 

  Hmm, the challenge is making this actionable within their 1-hour meeting format. I'll structure it as sequential yes/no questions with clear exit points. Each "no" should terminate that path, while some answers force a committee value judgment rather than a factual determination. 

  For the parity constraint, I'll build in explicit comparisons between staged and destructive methods. If the committee tries to treat them differently, the procedure will force them to justify why speed matters fundamentally. 

  The two-claimants rule needs special handling - if multiple entities emerge, identity can't be assigned to both, but the procedure must specify obligations to each. This is tricky but crucial for cases like destructive copying.

  Testing scenarios: 
  For the 30% replacement case, the procedure should likely affirm continuity based on ongoing psychology. The full replacement over two years might hit a committee judgment call when biological continuity breaks. The destructive scan with two copies should deliberately produce an uncomfortable outcome where neither copy is the original, forcing hard decisions about consent validity.

  I'm least confident about the biological continuity threshold question. Determining when wide continuity is "sufficiently preserved" feels arbitrary, but it's necessary for their legal forms. Maybe framing it as "is the biological basis still meaningfully present?" leaves room for committee discretion.

  The output will be two separate determinations: 
  1) Can we treat this as the same person? (yes/no/judgment call) 
  2) Is what the patient cared about preserved? (yes/partially/no) 
  This separation meets their requirement against collapsing the concepts.

  British English phrasing is straightforward - terms like "recognise", "organised", and "tissue" instead of "tissue" will do. No citations as requested, just clear reasoning.
answer: |-
  Here is a procedural decision tree designed for your committee's practical needs. It prioritises operational clarity, separates the key questions, embeds your requirements, and forces explicit value judgments where necessary. **British English throughout.**

  **Decision Procedure: Brain Replacement & Copying Protocols**

  **Core Principles:**
  1.  **Separate Outputs:** Verdicts on *Continuation of Personhood* (for legal/consent purposes) and *Preservation of What Was Cared About* are determined independently.
  2.  **Explicit Judgment Points:** Where the procedure requires a committee decision based on values, not discoverable facts, it is marked **"COMMITTEE JUDGMENT REQUIRED"**.
  3.  **Termination on "No":** A "No" answer to specific questions halts the procedure for that output path.
  4.  **Parity Enforcement:** Questions about biological/physical continuity are framed to apply equally to staged and one-shot procedures unless a fundamental difference is articulated by the committee during a **"COMMITTEE JUDGMENT REQUIRED"** step.
  5.  **Two Claimants:** Handled explicitly in the procedure.
  6.  **Metaphysical vs. Practical:** The *Continuation of Personhood* verdict distinguishes between "Yes" (strong claim), "Legitimate Practical Fiction" (weak claim but functional), and "No" (not viable).

  **Definitions:**
  *   **P:** The original patient pre-intervention.
  *   **S:** The single entity post-intervention (for replacement protocols).
  *   **S1/S2:** The entities post-intervention (for copying/splitting protocols).
  *   **Narrow Continuity (NC):** Causal dependence and similarity of psychology (memories, character traits, values, plans, experiential narrative).
  *   **Wide Continuity (WC):** Continuity of the living biological body, specifically the *organism* and its core biological systems (including significant intact original brain tissue as an organ). Gradual replacement inherently erodes WC.
  *   **What Was Cared About (WWCA):** The patient P's values, life projects, relationships, fears, hopes, and conception of a meaningful life.

  **Procedure:**

  **I. DETERMINE CONTINUATION OF PERSONHOOD (for consent, directives, liability, signature)**

  1.  **Is there only ONE successor entity (S)?** (e.g., single chip recipient, staged replacement endpoint)
      *   *Sufficient Answer:* Yes / No (if destructive scan with >1 copy, answer No).
      *   *If No, go to Step 8 (Two Claimants Procedure).*
      *   *If Yes, proceed to Step 2.*

  2.  **Does S exhibit strong Narrow Continuity (NC) with P?** (Does S have a robust causal connection to P's psychology? Are core memories, character, values, and plans recognisably present and integrated? Does S *claim* to be P with conviction and coherence?)
      *   *Sufficient Answer:* Clearly Yes / Unclear or Ambiguous / Clearly No. (Relies on pre/post psych evals, self-report, behavioural observation).
      *   *If Clearly No, STOP for Continuation of Personhood: **NO**. (S is not P).*
      *   *If Unclear or Ambiguous, proceed to Step 3.*
      *   *If Clearly Yes, proceed to Step 3.*

  3.  **Is Wide Continuity (WC) sufficiently preserved?** (Is S the *same biological organism*? Is a biologically significant portion of the original brain tissue still present and functionally integrated as part of the organism? Gradual replacement complicates this; focus on *current biological status*, not past process. Apply Parity: Would you answer the same if this state resulted from a one-shot procedure? If not, **COMMITTEE MUST ARTICULATE THE NON-SPEED DIFFERENCE** justifying the distinction or abandon it).
      *   *Sufficient Answer:* Clearly Yes (e.g., significant original tissue remains vital) / Unclear or Ambiguous / Clearly No (e.g., all original brain tissue destroyed/replaced, organism continuity arguably broken).
      *   *If Clearly Yes AND Step 2 was Clearly Yes: Continuation of Personhood = **YES** (Strong claim).*
      *   *If Clearly Yes BUT Step 2 was Unclear: **COMMITTEE JUDGMENT REQUIRED**: Given the WC, is the NC sufficient *enough* to warrant treating S as P for practical purposes? (Possible outcome: **Legitimate Practical Fiction** or **NO**).*
      *   *If Unclear or Ambiguous (WC): Proceed to Step 4.*
      *   *If Clearly No (WC): Proceed to Step 4.*

  4.  **Continuation Judgment Point (Single S, WC Compromised/Unclear):**
      *   **COMMITTEE JUDGMENT REQUIRED:** Based on the strength of NC (Step 2) and the *practical needs* (consent, liability, directives), can treating S as the same person as P be considered a **Legitimate Practical Fiction**?
          *   *Factors:* Strength of NC claim, S's affirmation of identity, functional equivalence for decision-making, societal/legal precedent needs, risk of harm from denying continuity.
          *   *Possible Outcomes:*
              *   **YES** (Strong claim - if committee overrules WC concern based on NC & function) - *Rare, requires strong justification.*
              *   **Legitimate Practical Fiction** (We acknowledge the metaphysical uncertainty or WC break but deem it practically necessary/justifiable to treat S *as if* P for specific purposes).
              *   **NO** (The break in WC and/or insufficient NC makes treating S as P untenable, even as a fiction).
      *   *Record outcome.*

  **II. DETERMINE PRESERVATION OF WHAT WAS CARED ABOUT (WWCA)**

  5.  **Does the successor entity/entities possess a psychology causally connected (NC) and *sufficiently similar* to P's such that P's core values, life projects, relationships, and conception of a meaningful life are recognisably present and motivating?** (Focus on content, not identity. Could P reasonably recognise their cares living on in S/S1/S2? Does S/S1/S2 endorse and act upon P's core cares?)
      *   *Sufficient Answer:* Robustly Preserved (NC strong & high fidelity) / Partially Preserved (NC present but significant drift/alteration) / Minimally or Not Preserved (NC weak or cares fundamentally altered/lost).
      *   *Outcome:* **Robustly Preserved** / **Partially Preserved** / **Minimally or Not Preserved**.
      *   *Note:* This is primarily a judgment based on NC and psychological assessment. WC is largely irrelevant *for this specific question*.

  **III. PROCEDURE FOR TWO CLAIMANTS (S1 & S2)**

  6.  **Do *both* S1 and S2 exhibit strong Narrow Continuity (NC) with P?** (As defined in Step 2)
      *   *Sufficient Answer:* Both Clearly Yes / One Clearly Yes, One No or Unclear / Both Unclear or Ambiguous / One or Both Clearly No.
      *   *If One or Both Clearly No:* The "No" claimant(s) are **not P**. Proceed to evaluate the remaining claimant(s) starting at **Step 2** (if one remains) or **Step 7** (if multiple remain).
      *   *If Both Clearly Yes or Both Unclear:* Proceed to Step 7.

  7.  **Identity & Obligations Judgment (Multiple Strong NC Claimants):**
      *   **Continuation of Personhood:** **COMMITTEE JUDGMENT REQUIRED:** Can *either* S1 or S2 be practically treated as *the* continuation of P for legal/consent purposes without causing unacceptable confusion or injustice?
          *   *Possible Outcomes:*
              *   **Designate One** (e.g., first created, primary copy, based on pre-defined criteria - requires strong justification for choice).
              *   **Legitimate Practical Fiction (Single Designation)** (Acknowledge ambiguity but designate one for practical necessity).
              *   **NO (Neither)** (The existence of two strong claimants makes assigning unique identity to either untenable; P is effectively gone).
      *   **Obligations:** **REGARDLESS** of the Identity verdict above:
          *   **Both S1 and S2 are owed duties arising from P's status and WWCA.** They possess P's NC. This includes (but isn't limited to): respect for autonomy (as derived from P), consideration of P's advance directives (interpreted in light of their current NC), potential claims on P's estate/contracts (to be resolved legally), duties of care from the researchers/hospital. They are distinct persons *now* but carry P's legacy forward.
      *   **Preservation of WWCA:** Proceed to **Step 5**, evaluating WWCA for *each* claimant separately (e.g., "Robustly Preserved in S1, Partially Preserved in S2").

  **Running the Test Cases:**

  1.  **30% Staged Replacement (P -> S):**
      *   **Continuation of Personhood:**
          *   Step 1: Yes (One S).
          *   Step 2: Clearly Yes (Lucid, reports same, NC strong).
          *   Step 3: Clearly Yes (70% biological tissue remains, organism continuity clear). Parity: Same answer for one-shot 30% replacement.
          *   Outcome: **YES** (Strong Claim).
      *   **WWCA:** Step 5: **Robustly Preserved** (Strong NC).
      *   *Likely Committee Comfort:* High. Outcome is clear and favourable.

  2.  **Full Replacement over 2 Years, Biological Tissue Destroyed (P -> S):**
      *   **Continuation of Personhood:**
          *   Step 1: Yes (One S).
          *   Step 2: Assume Clearly Yes (Implied by context).
          *   Step 3: **Clearly No** (No original brain tissue, organism continuity arguably broken. Parity: Same verdict for one-shot full replacement unless committee finds a *non-speed* difference justifying distinction. They likely cannot).
          *   Proceed to Step 4: **COMMITTEE JUDGMENT REQUIRED.** Arguments:
              *   *For Legitimate Practical Fiction:* Strong NC, functional equivalence, S claims identity, avoids legal void.
              *   *Against:* Fundamental break in biological identity (WC), potential loss of deep biological aspects of personhood, sets precedent eroding human biological basis. Risk: Treating a copy *as* the original when it might not be metaphysically true.
          *   *Likely Outcome:* **Legitimate Practical Fiction** (driven by strong NC and practical necessity) OR **NO** (driven by WC break as fundamental). *This is the uncomfortable value call.*
      *   **WWCA:** Step 5: Likely **Robustly Preserved** (Strong NC assumed). *Even if Continuation of Personhood is "NO", WWCA can be preserved.*
      *   *Likely Committee Discomfort:* High. Step 4 forces a contentious value judgment about the importance of biology vs. psychology for practical identity.

  3.  **Destructive Scan, Two Copies Running (P destroyed, S1 & S2 exist):**
      *   **Continuation of Personhood:**
          *   Step 1: **No** (Two successors). Go to Step 8 (Two Claimants Procedure).
          *   Step 6: Assume **Both Clearly Yes** (Copies exhibit strong NC).
          *   Step 7: **COMMITTEE JUDGMENT REQUIRED** on Identity.
              *   *Designate One?* Arbitrary (which one?). *Legitimate Fiction (Single)?* Still arbitrary and ignores the other claimant. *Most defensible:* **NO (Neither)**. P is gone; two distinct persons (S1, S2) with P's psychology now exist. Parity: Contrast with staged full replacement. The *simultaneous existence* of two claimants is the non-speed difference justifying a different Continuation verdict.
          *   Outcome: **NO (Neither S1 nor S2 is P)**.
      *   **Obligations:** Both S1 and S2 are owed duties stemming from P's NC (see Step 7).
      *   **WWCA:** Step 5: Evaluate each. Likely **Robustly Preserved** in both S1 and S2. *WWCA is preserved, even though P is gone and neither copy "is" P.*
      *   **Consent for Next Phase:** *Neither S1 nor S2 can provide valid consent "as P"* because P is gone (Continuation = NO). They are new persons. Consent would need to be obtained from them *as the new entities they are*, raising complex questions about capacity and authority. This is likely the "won't like" outcome.
      *   *Likely Committee Discomfort:* Very High. Legally and ethically messy.

  **What the Procedure Can't Settle & Requires Judgment:**

  1.  **The Fundamental Nature of Personal Identity:** It doesn't resolve the metaphysical debate. It forces practical decisions *in light* of the NC/WC evidence and the committee's values.
  2.  **The Threshold for "Sufficient" WC (Step 3):** Where is the line for "sufficiently preserved"? (Judgment based on biological facts).
  3.  **The Weight of WC vs. NC (Step 4):** When WC is compromised, how strong must NC be to support "Yes" or "Legitimate Fiction"? (Value Judgment).
  4.  **Handling Multiple Claimants (Step 7):** Can one be chosen? Is "Neither" the only fair answer? (Value Judgment).
  5.  **Interpreting "What Was Cared About" (Step 5):** Assessing fidelity and motivational force of preserved cares. (Interpretive Judgment).
  6.  **The Validity of "Legitimate Practical Fiction":** When is it ethically permissible to adopt a fiction? (Core Value Judgment).

  **Confidence & Least Sure Step:**

  *   **Overall Confidence:** Moderately High (7/10). The procedure logically embeds your requirements, forces critical distinctions (Identity vs. WWCA, NC vs. WC, discovery vs. judgment), and handles core scenarios rigorously. It's designed for your operational constraints.
  *   **Least Sure Step:** **Step 4 (Continuation Judgment Point when WC is broken but NC is strong).** Confidence: 5/10. This is the crux of the hardest philosophical/ethical dilemma (Ship of Theseus for persons). While the procedure correctly forces the *judgment call*, predicting how committees will (or should) consistently rule here is difficult. The legitimacy of the "fiction" is highly contestable. The Parity Constraint makes this step even more acute. This step is where real-world ethics committees will likely face the most internal disagreement and external scrutiny. The Step 7 outcome for two claimants ("Neither") is also ethically challenging but feels more logically defensible given the impossibility of unique identity.

  This procedure provides a structured, auditable framework for your committee's daunting task, ensuring critical questions are asked, judgments are made explicit, and your core requirements are met, even when the answers are uncomfortable.
