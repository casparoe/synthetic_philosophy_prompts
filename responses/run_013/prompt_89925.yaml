answer: |-
  Right, let's get stuck in. Your draft is sharp and raises the core tension well. Addressing your priorities:

  **(a) Does the central argument go through?**  
  Mostly, yes. You've correctly identified that under EDT, astronomical cooperation gains *depend entirely* on how you define the reference class of "agents correlated with me". The circularity ("you need the answer before you compute the answer") is a real problem *for generating specific prescriptions* from EDT alone. Where you might slightly "assume what you show" is in implying EDT *inherently* demands astronomical cooperation. EDT *requires* a reference class to be specified; without one, it simply *cannot* tell you what to do at all. Your argument shows that the *massive gains* vanish if the reference class isn't pre-specified arbitrarily. That's sound. The conclusion isn't that cooperation is impossible under EDT in large worlds, but that *which* cooperation strategy (if any) is optimal is radically underdetermined without fixing the class.

  **(b) Does causal anchoring collapse into CDT?**  
  **Yes, essentially.** You've nailed this suspicion. If the correlation is *fully* screened off by a settled common cause in your past (like shared code or training data), then your action provides *no* additional evidence about the actions of others in the reference class. It only provides evidence about the *outcome* of that settled common cause. EDT then reduces to maximising conditional on that fixed past cause – which is functionally identical to CDT maximising over local consequences. The astronomical gains disappear because your choice doesn't *update* your expectations about others' choices. The *only* way causal anchoring preserves astronomical EDT gains is if the "common cause" is somehow *not* screened off (e.g., if your decision *now* is part of what determines the nature of the cause – but this lands you back in circularity and unresolved disputes). So yes, it largely reinstates CDT's local focus.

  **(c) Messing up the reference-class point?**  
  You're right to nag. The reference-class problem *is* general (e.g., self-locating uncertainty). However, it's **acutely worse here** for two reasons:
  1.  **Stakes Sensitivity:** Unlike typical self-locating problems, tiny shifts in reference class definition here cause *astronomical* swings in expected value calculations. "Agents with my exact code" vs "agents using EDT" could differ by orders of magnitude.
  2.  **Self-Referential Choice:** The reference class is defined by *your own decision procedure*, and the choice you're trying to make *affects which procedure you're running* (e.g., choosing to cooperate might define you as a "Cooperator-Type"). This creates a feedback loop absent in simpler reference-class problems. The circularity ("pick the class that maximises EV") isn't *unique* per se, but the scale and self-referential nature make it particularly vicious and resistant to standard resolution methods like seeking fixed points (as you note, ugly equilibria exist).

  **Other Comments:**
  *   **Strengths:** Your "compelling picture" paragraph is excellent – clear and motivating. The "causal anchoring kills the view" insight is spot-on. The whole draft is concise and avoids padding.
  *   **Minor Cut:** The aside about "ugly ones... punish anyone like me" is slightly distracting. The core point is multiple equilibria exist; this example doesn't add much new.
  *   **Sharpening:** Explicitly state that without a *given* reference class, EDT is *silent*. The problem isn't that it gives the *wrong* answer, but that it gives *no determinate answer* about whether astronomical cooperation is required. The circularity prevents bootstrapping.
  *   **Clarify "influence":** Emphasise that EDT cares about *evidential* influence (updating your beliefs), not causal influence. Causal anchoring removes the *evidential* link relevant for updating beliefs about *others' actions*.

  **Summary Verdict:** Your core argument stands up. You correctly show the astronomical gains are contingent on an arbitrary reference class, creating a vicious circularity for EDT. Your causal anchoring fix *does* largely collapse into CDT for the reasons you suspect, sacrificing the gains. The reference-class problem is general but uniquely severe here due to the astronomical stakes and self-referential nature of the choice. It’s a strong, honest draft exposing a fundamental tension. Good luck with the session!
