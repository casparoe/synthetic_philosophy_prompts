  - **Multiple Drafts Model (MDM):** Handles the case naturally. The verbal report is one draft, and the sensory experience of the spill is another. There is no single moment when the spill becomes conscious; it is processed in parallel and the report is just one output.

  **Feature doing the work:** The real-time, continuous verbal report that captures events as they occur, but with a gap between the report of one event (the cup tipping) and the next (the spill) during which the spill physically occurs and is felt.

  **Without that feature:** Without the real-time report, the CT could dismiss the report as a later reconstruction, and the MDM would lose its advantage.

