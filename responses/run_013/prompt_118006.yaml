at the same time, then they are both conscious at the same time, but the report is serial. The character might experience both at once but report them in sequence. That fits. So GWT is separated from CT (which would require a serial order of experiences) but not entirely from MDM (which might also have parallel conscious processes). However, MDM denies any single moment or place of consciousness, so it is different from GWT. The case does not clearly separate GWT from MDM because both can account for the report being serial while the underlying processing is parallel. But it does separate GWT from CT because CT requires a strict ordering of experiences.

  **Honest assessment of the specifications:**

  Can they be jointly satisfied? Yes, but with difficulty. The most challenging specification is the real-time report without any later. We have to design a scenario where the report is happening at the same time as the events, and the events are happening quickly enough that there is no time for reconstruction. The scenario above attempts that by having a rapid sequence of events and a running commentary. However, one might argue that even in real-time report, there is a minimal delay. But the scenario builds the gap into the report: the spill happens during the word "cup" and is reported as the next word. The simultaneity is built in by having the report interrupted by the spill. This is the best we can do without laboratory conditions.

  If one specification has to be relaxed, it might be the requirement that the phenomenology is entirely neutral from the inside. In the scenario, the character might feel that the spill happened while she was saying "cup," which could be interpreted as supporting either picture. But if we require absolute neutrality, it might be hard to achieve. However, we have tried to make it neutral: she cannot tell by introspection whether the experience of the spill was delayed until after the report of the cup or whether both were present at the same time but the report was sequential.

  Therefore, I think the specifications are satisfied.

