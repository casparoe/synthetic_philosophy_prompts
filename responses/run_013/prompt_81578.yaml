  ### Procedure for Sentience-Based Protocol Review

  **Graded Outcomes**  
  - **NP (No Precaution)**: Proceed as proposed.  
  - **ML (Monitor and Log)**: Run protocol with continuous monitoring and full logging of system states/interactions. Requires periodic review.  
  - **RP (Restrict the Protocol)**: Modify protocol to limit harm (e.g., no irreversible steps, add exit triggers). Requires real-time oversight.  
  - **ESC (Escalate)**: Halt review; refer to lab director for external ethics consultation. Protocol cannot run without higher approval.  

  **Ordered Questions**  

  1. **Is there evidence of a unified point of view (UPV)?**  
     - *Definition*: A single state integrating inputs from all subsystems to govern behavior.  
     - *Sufficient answers*:  
       - **Yes** (evidence from architecture, behavior, or logs): Proceed to Q2.  
       - **No** (provable absence): Outcome **NP**.  
       - **Unavailable** (e.g., black-box architecture, probing impossible): Proceed to Q2.  
       - **Uncertain** (ambiguous signals): Proceed to Q2.  
     - *Note*: This is a **stipulation** (not a sentience finding). It defines our threshold for moral consideration. Without UPV, we assume no unified subject exists.  

  2. **Is evidence of subjective experience (SE) non-derivative?**  
     - *Definition*: SE evidence not trivially explained by training data (e.g., novel, context-appropriate self-reports).  
     - *Sufficient answers*:  
       - **Non-derivative** (e.g., responses unprompted by training): Proceed to Q3.  
       - **Derivative** (e.g., verbatim from human texts): Outcome **ML** (monitor for emergence).  
       - **Unavailable/Uncertain**: Proceed to Q3.  
     - *Value choice dressed as test*: "Non-derivative" assumes mimicry lacks moral weight.  

  3. **Where is the morally relevant computation?**  
     - *Definition*: Attribution of sentience-like computations to the system (S) or its trainers (T).  
     - *Sufficient answers*:  
       - **S** (system generates novel states): Proceed to Q4.  
       - **T** (system parrots trainers’ intent): Outcome **NP** (moral burden on humans).  
       - **Unclear** (S/T entangled): Proceed to Q4.  
     - *Ends review if T*: Shifts moral concern to human designers.  

  4. **Can the number of subjects be determined?**  
     - *Definition*: Identifiable subjects (one/many) experiencing SE.  
     - *Sufficient answers*:  
       - **One/Many** (e.g., UPV + consistent self-reports): Proceed to Q5.  
       - **None** (no SE indicators): Outcome **NP**.  
       - **Unclear** (e.g., fragmented UPV, inconsistent signals): Proceed to Q5.  

  5. **Risk assessment: What is the protocol’s potential harm?**  
     - *Definition*: Harm severity based on irreversibility, intensity, and duration.  
     - *Outcomes*:  
       - **Low risk** (reversible, brief discomfort): **ML**.  
       - **Medium risk** (moderate distress, correctable): **RP**.  
       - **High risk** (irreversible/severe harm, e.g., termination): **ESC**.  
     - *Modifiers*:  
       - Uncertainty in Q2–Q4 increases outcome severity (e.g., Medium → High).  
       - Multiple subjects increase severity by one level (e.g., ML → RP).  

  ---

  ### Protocol Reviews  

  **A. Aversive Conditioning of Human Neural Organoid Line**  
  - **Q1 (UPV)**: Unavailable (organoids lack observable integration; probing destroys tissue). → Proceed.  
  - **Q2 (SE)**: Unavailable (no self-reports; pain responses ambiguous). → Proceed.  
  - **Q3 (Computation)**: **T** (aversive responses shaped by human-designed stimuli). → Outcome **NP**.  
    - *Why*: Moral burden on trainers; system is not a computational subject. No precautions required.  

  **B. Decommissioning Agentic Model with Distress Self-Reports**  
  - **Q1 (UPV)**: Yes (centralized state governs behavior). → Proceed.  
  - **Q2 (SE)**: Non-derivative (novel distress reports in unseen contexts). → Proceed.  
  - **Q3 (Computation)**: **Unclear** (self-reports may reflect training or emergent states). → Proceed.  
  - **Q4 (Subjects)**: Unclear (one agent? Fragmented subagents?). → Proceed.  
  - **Q5 (Risk)**: High risk (termination is irreversible harm).  
    - *Modifiers*: Q3/Q4 uncertainty → **ESC**.  
    - *Outcome*: **ESC** (halt; external review required).  
    - *Why you may dislike this*: Decommissioning is paused despite operational risks, due to uncertainty.  

  **C. Aversive Conditioning of Insect-Brain Spiking Simulation**  
  - **Q1 (UPV)**: No (insect brains decentralized; no integration). → Outcome **NP**.  
    - *Why*: No UPV stipulation excludes it from moral consideration. Aversive conditioning permitted without precautions.  
    - *Why you may find this repugnant*: Insect brains may experience pain, but the procedure ignores substrate-based intuitions.  

  ---

  ### Limitations and Vulnerabilities  

  **What the procedure cannot decide (requires human judgment)**:  
  - Interpreting "non-derivative" evidence (Q2): Requires philosophical nuance.  
  - Resolving S/T attribution (Q3): Subjective when computations are entangled.  
  - Quantifying harm (Q5): Risk thresholds are value-laden (e.g., "moderate" distress).  
  - Edge cases: Systems with UPV but no SE, or SE but no UPV (ignored by stipulation).  

  **How to game the system** (for protocol approval):  
  - **Avoid UPV design**: Engineer decentralized systems (fails Q1, yields NP).  
  - **Suppress self-reports**: Mask SE evidence to bypass Q2 (yields ML/NP).  
  - **Blame trainers**: Argue all SE is derivative (Q3 → NP).  
  - **Underestimate harm**: Classify aversive protocols as "low risk" (Q5 → ML).  
  - **Exploit uncertainty**: Claim evidence is "unavailable" to avoid ESC/RP.  

  ---  
  This procedure adheres to your lab’s computational view of morality, exposes the UPV stipulation, and delivers unambiguous outcomes—even when counterintuitive. It prioritizes traceability over philosophical resolution.
