prompt: |-
  I'm drafting a novel and I want to try a scene out as a standalone short story first, so this is me workshopping it out loud.

  The premise: a woman who knows every logical consequence of everything she believes. Not the obvious ones — all of them. If she believes A, and A entails B entails C entails D, she believes D too, instantly, no matter how long the chain. I know that's the usual idealization logicians slap onto knowledge and that no real person could be like that, but I want to take it seriously as a character trait and just live inside it.

  What I keep circling: if you already know everything that follows from what you know, can you ever learn anything? Learning feels like ruling out possibilities you hadn't ruled out. She ruled them all out the second she believed the premises. So she never gets that click of something falling into place, and nobody can ever surprise her with an argument, because she's known the conclusion since before they opened their mouth. She can't be wrong about logic, but she can still be wrong about the world, and that's worse — her errors fan out into infinity in every direction.

  The loophole I want to use, and this is the part I need the story to earn: she only gets the consequences she can represent. If a conclusion needs a concept she doesn't have, it's invisible to her. It follows from her beliefs but she doesn't believe it. So her omniscience has a hole in it, shaped exactly like her vocabulary.

  Two things I want out of it: a single day that makes this feel like a genuine affliction or a genuine gift (your call which), and somewhere in there, make me feel the gap between believing something and merely being unable to believe otherwise — if that gap is even real for her. Maybe a moment where someone tries to tell her something new and she finishes their sentence, except with the actual truth, which is worse.

  Under 1500 words. Don't let it turn into a lecture about logic, keep the concept inside the scenes. No citations needed, just write it.
reasoning: |-
  Okay, the user is workshopping a story concept about a woman who instantly knows all logical consequences of her beliefs. They want to explore how this "gift" becomes an affliction due to its limitations - specifically, that she can't grasp conclusions requiring concepts she lacks. The core tension should center on that vocabulary-shaped hole in her omniscience.

  Hmm... interesting paradox they've set up. The character's strength (logical omniscience) is also her weakness (conceptual blindness). The user clearly wants sensory immersion over philosophical exposition - they emphasized "keep the concept inside the scenes." That "finishing someone's sentence with the actual truth" moment feels key for showing rather than telling the horror of her condition.

  Right, let's approach this clinically first. The character operates like a perfect theorem prover constrained by her current axioms and language. Her learning isn't about deduction but concept acquisition - each new word potentially unlocks cascading realizations. The terror comes when missing concepts lead to catastrophic blind spots despite "knowing" everything else.

  For the requested moment... say she's discussing a colleague's "vague symptoms" with a doctor. The instant she hears "mitochondrial disease," it triggers chain reactions: every past medical conversation rewrites itself, she sees the colleague's death with absolute certainty, realizes she'd been staring at the consequences for months without recognizing them. The horror isn't the diagnosis - it's that the logical path was always there, waiting for that single word to collapse possibility into inevitability.

  Weather should mirror her internal state. Morning drizzle when she's calmly perceiving logical chains everywhere? Then oppressive humidity when the conceptual gap yawns open? Finally cold clarity when the new concept clicks everything into place - not enlightenment, but suffocating certainty.

  Must avoid turning this into a logic lecture. Embed the mechanics in bodily sensations: the "click" as a physical snap in her jaw, the "fanning errors" as actual vertigo. When the missing concept arrives, don't explain mitochondria - show her seeing cellular machinery in the raindrops, her mind forcibly reassembling reality around this new lens.

  The ending should linger on that terrifying clarity. Not relief at understanding, but despair at how many other invisible conclusions are orbiting her, waiting to detonate. That's the affliction - knowing infinity lives just beyond the edges of your words.
answer: |-
  The rain tapped its predictable rhythm against the windowpane. Eleanor watched each droplet trace its inevitable path, knowing precisely where it would merge, where it would pool, how long it would take to evaporate under the weak, grey light. Knowing was effortless. It just *was*. A dropped coffee mug shattered on the floor; she saw the trajectories of the shards before the sound faded. A colleague mentioned a budget shortfall; she saw the layoffs, the restructured departments, the probable failure of Project Helios three fiscal quarters out, all unfolding with the silent certainty of dominos falling in vacuum. No surprise, just the quiet hum of consequence.

  Her world was a vast, intricate machine, every gear interlocked. Believing `A` meant `B`, `C`, `D`... out to the very edge of the universe, instantly, silently. Arguments were tedious recitals of paths she’d traversed millennia ago in the blink of an eye. People’s attempts to explain, to persuade, were like reading the first line of a familiar novel aloud. She often finished their sentences, not with smugness, but with the weary inevitability of stating the time. It rarely endeared her to others.

  The affliction wasn't the omniscience within her conceptual net. It was the net itself. The holes.

  Dr. Aris Thorne sat opposite her in the hushed sterility of the consultation room. He’d asked about Martin, her colleague. Martin’s fatigue, his muscle aches, his stumbling gait. Eleanor had observed it all, logged it with detached precision. She saw the chain: poor nutrition leading to electrolyte imbalance, causing neuromuscular issues, exacerbated by stress and lack of sleep. Simple. Linear. Fixable.

  "Ms. Vance," Dr. Thorne began, his voice careful, rehearsed. "Martin's symptoms... they're persistent, worsening. The initial bloodwork showed anomalies we couldn't quite pin down, but the latest genetic panel..."

  Eleanor saw the path he was on. He was heading towards a misdiagnosis, probably autoimmune. She saw the flawed reasoning, the overlooked variable – Martin’s recent high-altitude hiking trip. She opened her mouth to interject, to streamline the conversation towards the obvious, efficient solution.

  "...suggests something more specific," Thorne continued. "Something involving the..."

  Eleanor’s mind raced ahead, down the familiar branch. *Autoimmune... likely triggered by environmental factors... standard immunosuppressants... manageable.* The words formed on her tongue: "Mitochondria."

  The word hung in the air. Not her voice. His.

  *Mitochondria.*

  The sound struck her like a physical blow. A concept. A word. A tiny, complex machine she knew *of*, abstractly – cellular power plants – but had never truly *needed* to grasp in this context, for *this* chain.

  And then the world *snapped*.

  It wasn't learning. It was a brutal, instantaneous realignment. The machine didn't gain a new part; it reconfigured violently around a component that had always been missing, its absence suddenly, horrifyingly apparent.

  *Mitochondrial disease.*

  The phrase wasn't new. The *consequence* was. Instantly, irrevocably, the entire logical structure concerning Martin collapsed and rebuilt itself with terrifying speed.

  Her prior belief – `Martin's symptoms + observable factors = nutritional/stress-related issue` – was obliterated. Not just wrong, but *impossible* within the new frame. The fatigue wasn't just tiredness; it was cells starving. The muscle aches weren't strain; they were metabolic failure. The stumbling wasn't clumsiness; it was neurological erosion.

  Worse, infinitely worse, she saw the future branching *out* from this single node. She saw the progression – the weakening, the organ involvement, the specific, relentless decline. She saw the treatments, their limited efficacy, the statistical probabilities of decline, remission, failure. She saw Martin in a wheelchair. She saw palliative care. She saw the exact month, with 87.3% probability, when independent mobility would likely cease. All of it, radiating outwards with cold, flawless logic from that single, newly integrated concept: *mitochondrial dysfunction*.

  The horror wasn't the diagnosis itself. It was the realization that *it had always followed logically* from the raw data – Martin’s pallor, the tremor in his hands she’d dismissed as caffeine, the slight slurring on tired evenings. The evidence had been there. The chain of implication existed. But without the vital conceptual link – without the specific machinery of *how* cellular energy failure manifests progressively – that entire, dreadful branch of consequence had been *invisible* to her. It wasn't that she hadn't believed it; she *couldn't* have believed it. The conclusion lay on the far side of a vocabulary chasm she hadn't known existed.

  She hadn't *learned* Martin was dying. She had *always known*, in the abstract potential of the universe’s logic, and her own failure to grasp the necessary term had rendered her blind. The click wasn't understanding; it was the sound of a trapdoor swinging open beneath everything she thought she knew about her friend's future.

  Dr. Thorne was still speaking, his voice muffled as if through water. "...complex, variable prognosis, but early intervention..."

  Eleanor stared past him, out the window. The rain continued its descent. She saw each drop, knew its path, its fate. But now, superimposed on the glass, she saw cascading failures of microscopic engines. She saw the intricate, failing machinery inside Martin. She saw the vast, terrifying landscape of everything else she *must* be blind to right now, simply because she lacked the words, the concepts, to see the chains that led there. The errors weren't possibilities; they were inevitabilities waiting for their linguistic key.

  Her perfect logic was a prison of light, illuminating only the paths paved with words she possessed. Beyond the walls of her vocabulary stretched an infinite darkness, filled with truths as real and as lethal as Martin’s diagnosis, truths that followed from her beliefs with absolute certainty, yet remained utterly, terrifyingly unseen. The gift was the clarity within the cell. The affliction was knowing the cell had bars, and beyond them lay everything that mattered, hidden by the mere lack of a name.
