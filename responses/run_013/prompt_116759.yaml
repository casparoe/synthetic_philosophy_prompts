answer: |-
  ## Closing Address: A Promise Across Time

  Friends, members, alumni, and especially to the families and partners joining us tonight – welcome. Thank you for sharing this moment of transition with us. Standing here, as my year as Chair draws to a close, handing over the reins to a wonderfully capable new committee, is a moment filled with gratitude. Gratitude for the debates that challenged us, the laughter that sustained us, and the shared belief that carefully examining the foundations of how we live together is not just an academic exercise, but a vital one.

  Now, as is tradition, this is where the outgoing Chair offers some final thoughts. And mine circle around a rule you might have heard mentioned – our ‘double lock’. It’s a mechanism close to my heart, one I argued for two years ago. It says that changing the very bedrock of this society – its founding principles – shouldn’t be done lightly, or quickly. It requires a high bar of agreement, twice, with a year of reflection in between. Everything else? We decide by simple majority on the night. Budgets, motions, membership rules – they can adapt swiftly. But the core? That was meant to be different.

  The idea wasn’t born from distrust, but from a very specific worry. A worry that in a difficult moment, under pressure, a group like ours – passionate, temporary, made up of people who will inevitably move on – might be tempted to solve an immediate problem by quietly chipping away at the very things that make this society unique, that make it worth the commitment. And that the moment when that temptation feels most urgent, most necessary, might be precisely the moment when stepping back and asking harder, longer questions is most vital. The double lock was meant to be that step back, that cooling-off period, that space for genuine deliberation.

  Now, here we are. An amendment to the double lock itself has passed its first hurdle. It proposes shortening the waiting period and lowering the threshold for the final vote. In essence, it would use the rule’s own process to make the rule itself easier to change.

  And this amendment now sits, waiting for its second vote next year, under the watch of the committee I hand over to tonight. I won’t be here for that vote. And honestly? I find myself wrestling with it. I catch myself in the shower, of all places, rehearsing arguments for and against. And that caught me off guard. Because the entire point of the double lock was to move arguments *out* of the shower, out of private rehearsal, and into the open light of shared deliberation over time. To slow things down, so we might see more clearly.

  So, what do I want to say about it tonight? Not a defence of the rule as I wrote it. Not an attack on the amendment. But perhaps something about the nature of the promise the double lock represents.

  When one year’s members establish a rule like this, what are they actually doing for the members who come after? Are they binding those future members, including those who might have voted against the rule in the first place? Is a rule that can be undone by the very process it created even a real constraint, or is it just a temporary speed bump?

  Is this kind of self-binding primarily a promise *to* others – to future members we may never meet? Or is it, more fundamentally, a device that one year’s members use *on* themselves – a way to tie their own hands against future impulses they fear might lead them astray? And does the answer to *that* question change what we think it’s permissible for future members to do with it?

  Perhaps the deepest question is about the rule’s value. What matters most: the specific bad amendments it might prevent? Or the quality of deliberation it forces us to have? If the primary value lies in forcing that slow, careful, open argument – the very thing designed to replace my shower rehearsals – then what happens when that deliberation *has* genuinely been had? When the case has been made, circulated, argued over, and reflected upon for the required time?

  Here’s where I land, honestly, standing here with this glass, painfully aware that I’m the one who drafted the original rule. I believe the immense value of the double lock *was* in forcing that deliberation. It was a bet that time and open argument yield better decisions than haste and immediate pressure. It was a structure built for thoughtfulness.

  Therefore, if the process works – *really* works – then its outcome deserves respect. If, over the coming year, the case for this amendment is made openly and clearly to the whole membership, if it’s debated fairly and thoroughly, if doubts are aired and genuinely considered… then the double lock has done its job. It has created the space for the deliberation it was designed to foster. And if, after that full, open process, a legitimate majority – whether two-thirds or simple – decides the rule should change, then that, too, is the process working. The rule facilitated the very debate that might lead to its own evolution. That isn’t a failure; it’s the system operating as intended. The promise wasn't to a specific outcome, but to a specific *quality* of decision-making.

  So, my position is this: I trust the process *we* built. I trust the space for argument it creates. And I trust the members who will engage in that argument over the next year. If, after the deliberation the rule demands, the society decides the lock should be lighter, then that is the society exercising its collective judgment thoughtfully – which is the whole point.

  To our incoming Chair, [Incoming Chair's Name]: your task isn’t to defend my rule, or anyone else’s idea of what this society should be. Your task is to steward that space for open, honest, rigorous deliberation. Ensure the case for the amendment is heard fairly. Ensure counter-arguments get their due. Protect the forum where members can genuinely think this through. Trust the members to engage seriously. And then, next year, trust the vote that emerges from that process. That is the essence of what we’ve tried to build – a community that takes its own foundations seriously enough to argue about them properly, and then to live by the results.

  Thank you all – committee members past and present, members, alumni, friends, and family – for being part of this unique, argumentative, wonderful society. It has been the deepest privilege to serve as your Chair. Now, please join me in raising a glass: To thoughtful argument, to promises made across time, and to the exciting year ahead under new leadership. Cheers.
