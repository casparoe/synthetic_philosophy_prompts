            Disagreement: (0,0)
            Contracts:
              Contract 1: (0,80)
              Contract 2: (40,60)
              Contract 3: (60,0)

          Case C card:
            Disagreement: (0,0)
            Contracts:
              Contract 1: (0,80)
              Contract 2: (40,60)
              Contract 3: (60,0)
              Contract 4: (80,0)

          Case D card (not distributed until the end):
            Disagreement: (20,10)
            Contracts:
              Contract 1: (30,50)
              Contract 2: (50,30)

          Facilitator table:

          Case A:
            Equal split (x=y): (75,75)
            Product rule: (200,50)
            Ray rule: (128.6,64.3)  [round to one decimal]

          Case B:
            Equal split (x=y): (40,40) -> but is it on the frontier? 
              At x=40, on S1: y=80-0.5*40=60 -> (40,60) is on the frontier. 
              But (40,40) is not. 
              Alternatively, we defined equal split as x=y: then solve x=80-0.5x -> 1.5x=80->x=53.33, not in [0,40]. In S2: x=180-3x -> 4x=180->x=45, y=45. So (45,45) is in the feasible set? We need to see if it's on the frontier. The frontier at x=45: S1 only goes to x=40, S2: at x=45, y=180-3*45=180-135=45. So (45,45) is on the frontier? 
              But wait, the frontier in case B: 
                S1: x in [0,40], y=80-0.5x.
                S2: x in [40,60], y=180-3x.
              At x=45 (which is in [40,60]), y=180-3*45=45. So (45,45) is on the frontier.
            So we can use (45,45) for equal split.

            But in the activity, students might choose (40,60) or (45,45) for different reasons.

            However, for the table, let's compute the three as we defined:

              Equal split (x=y): (45,45)
              Product rule: (40,60)
              Ray rule: (41.5,55.4)  [rounded]

          Case C:
            Equal split (x=y): 
              In S1: x=80-0.5x -> x=53.33 not in [0,40].
              In S2: x=120-1.5x -> 2.5x=120 -> x=48, y=48. So (48,48)
            Product rule: (40,60)
            Ray rule: (48,48) [because the ray rule with new ideal became (48,48)]

          Case D:
            Equal split (x-20 = y-10) -> gains equal: x-20 = y-10 and y=80-x.
              So x-20 = (80-x)-10 = 70-x
              x-20 = 70-x -> 2x=90 -> x=45, y=35.
            Product rule: (45,35)
            Ray rule: (41.4,38.6) [rounded from 41.43,38.57]

          Now, predictable failures:

          1. When a pair converges instantly on an equal split.
            - This is fine. In the debrief, we can discuss whether equal split is always fair, especially in the lopsided case.

          2. When someone rejects the mixing story.
            - Explain that mixing is allowed over a long run of identical transactions, so any point in the convex hull is achievable. If they question, assure them that the set is convex.

          3. When someone insists there is a right answer.
            - Acknowledge that there are different notions of fairness. The activity is to explore the trade-offs.

          4. When the tally of written rules is too vague to apply.
            - The facilitator should have a few examples of clear rules and focus on those. If a rule is vague, skip it or ask the pair to clarify quickly.

          Finally, the closing note:

            - The activity uses finite menus to create convex hulls, but the ray rule is defined for any convex set.
            - The case cards cannot show why IIA (insensitivity to deleted options) is normatively attractive in some contexts.
            - Both rules assume that the utility scales are comparable, which they officially disown.

          We'll now output the case cards and the run sheet in detail.
