  ### Bargaining Solutions Activity: Run Sheet and Materials

  **Total Time:** 90 minutes  
  **Goal:** Experience the tension between proportional sacrifice (Kalai-Smorodinsky) and independence of irrelevant alternatives (Nash bargaining) without naming rules until the end.  

  ---

  #### **Materials:**
  - **Whiteboard:** Blank at start.
  - **Case Cards:** Pre-printed for each pair (diagrams + payoffs).
  - **Markers, timer, coin for random assignment.**

  ---

  #### **Run Sheet:**

  1. **Introduction (0-5 min)**  
     - **Facilitator Says:**  
       *"You’re two parties bargaining over contracts. Any mix of contracts is allowed for repeated interactions, so convex combinations are feasible. If no deal, you get the disagreement outcome. Negotiate a deal you find fair. No calculators."*  
     - **Board:** Blank.  
     - **Do Not Say:** Anything about "rules," "solutions," or "axioms."

  2. **Case A Negotiation (Lopsided Case) (5-25 min)**  
     - **Distribute Case A Card (Diagram Below).**  
       *"Negotiate and agree on a payoff pair. Write it down. Be ready to explain why it’s fair."*  
     - **Pairs Negotiate (10 min).**  
     - **Defend Splits (10 min):**  
       Ask 3 pairs: *"What split did you choose? Why is it fair?"*  
     - **Board:** Sketch Case A’s feasible set. Mark pairs’ splits (no analysis).  
     - **Do Not Say:** Why splits might be inconsistent.

  3. **Case B & C Negotiation (Sensitivity Test) (25-45 min)**  
     - **Distribute Case B Card:**  
       *"New case. Negotiate a deal."* (5 min).  
     - **Distribute Case C Card (Case B + one contract):**  
       *"Same as before but with an extra contract. Negotiate again. Did your deal change? Why?"* (5 min).  
     - **Report Changes (10 min):**  
       Ask 2 pairs: *"Did your split shift from B to C? Why?"*  
     - **Board:** Add Cases B and C diagrams. Note if splits moved.

  4. **Write a Mediator Rule (45-55 min)**  
     - **Facilitator Says:**  
       *"Write a clear rule for a mediator to split payoffs in an unseen case. Afterwards, you’ll be randomly assigned to be Player 1 or 2. Your rule should be fair no matter which side you’re on."*  
     - **Pairs Write Rules (10 min).**  
     - **Collect Rules.**

  5. **Apply Rules to Case D (55-65 min)**  
     - **Random Assignment:** Flip coin for each pair (heads = Player 1, tails = Player 2).  
     - **Distribute Case D Card.**  
     - **Facilitator Applies 2-3 Clear Rules:**  
       *"Rule 1 says: ‘Split gains equally.’ For Case D: Gains over (20,10). Equal gains: (x-20) = (y-10). Combined with frontier y = 80 - x → (45,35)."*  
       *"Rule 2 says: ‘Reach the highest sum of payoffs.’ On y=80-x, max x+y is 80, so any point on the frontier. Not specific enough."*  
       *"Rule 3 says: ‘Give each a fraction of their best possible gain.’ For Player 1, best gain is 50-20=30. Player 2: 50-10=40. Set fractions equal: (x-20)/30 = (y-10)/40. With y=80-x → (41.4,38.6)."*  
     - **Ask Pairs:** *"Given your assigned side, are you satisfied? Why?"*

  6. **Debrief and Rule Names (65-85 min)**  
     - **Put Names on Board:**  
       - **Product Rule:** Maximizes (Player 1’s gain) × (Player 2’s gain).  
       - **Ray Rule:** Point where gains as fractions of best possible gains are equal.  
     - **Map Moments to Concepts:**  
       - *"Case A splits: Equal shares (e.g., 75,75) vs. equal sacrifice (e.g., 129,64)."*  
       - *"Case B to C: Adding a contract (80,0) in C moved the ray rule (48,48) but not the product rule (40,60)."*  
       - *"Ideal point: The ray rule uses ‘best possible’ payoffs to define sacrifice. Delete an option? The ray rule shifts."*  
       - *"Your rules: ‘Equal gains’ aligns with product rule. ‘Fraction of best gain’ aligns with ray rule."*  
     - **Explicit Violations:**  
       - *"The ray rule violates independence: Adding/deleting options changes the deal."*  
       - *"The product rule violates proportional sacrifice: One party may sacrifice more of their potential gain (e.g., Player 2 gets 50/100=50% in Case A’s product rule vs. Player 1’s 200/200=100%)."*  

  7. **Closing Note (85-90 min)**  
     - **Facilitator Says:**  
       *"What we couldn’t capture:  
        - Real bargaining has complex feasible sets, not just 4 contracts.  
        - Why care about independence? If deleting an option you’d never choose changes the deal, is that fair?  
        - Both rules assume gains are comparable, though they claim not to.  
        - The ray rule works for any convex set, but our cards simplify it.  
       In practice, this tension shapes arbitration, trade deals, and resource splits."*  

  ---

  ### **Case Cards**  
  *(Each card shows payoffs, disagreement point, and a plotted diagram. Mixing allowed → convex hull feasible.)*  

  #### **Case A (Lopsided, d=(0,0))**  
  - **Contracts:**  
    - (0, 100)  
    - (75, 75)  
    - (200, 50)  
  - **Diagram:**  
    - Axes: Player 1 (x), Player 2 (y).  
    - Frontier: Line from (0,100) to (75,75) to (200,50). Disagreement at (0,0).  
  - **Facilitator Table (Points):**  
    | Rule           | Payoff (P1, P2) |  
    |----------------|-----------------|  
    | Equal Split    | (75, 75)        |  
    | Product Rule   | (200, 50)       |  
    | Ray Rule       | (128.6, 64.3)   |  

  #### **Case B (Base, d=(0,0))**  
  - **Contracts:**  
    - (0, 80)  
    - (40, 60)  
    - (60, 0)  
  - **Diagram:**  
    - Frontier: Line from (0,80) to (40,60) to (60,0). Disagreement at (0,0).  
  - **Facilitator Table (Points):**  
    | Rule           | Payoff (P1, P2) |  
    |----------------|-----------------|  
    | Equal Split    | (45, 45)        |  
    | Product Rule   | (40, 60)        |  
    | Ray Rule       | (41.5, 55.4)    |  

  #### **Case C (Base + Contract, d=(0,0))**  
  - **Contracts:**  
    - (0, 80)  
    - (40, 60)  
    - (60, 0)  
    - (80, 0)  // Adds nothing to Player 2, raises Player 1’s ceiling.  
  - **Diagram:**  
    - Frontier: Line from (0,80) to (40,60) to (80,0). Disagreement at (0,0).  
  - **Facilitator Table (Points):**  
    | Rule           | Payoff (P1, P2) |  
    |----------------|-----------------|  
    | Equal Split    | (48, 48)        |  
    | Product Rule   | (40, 60)        |  
    | Ray Rule       | (48, 48)        |  

  #### **Case D (Unseen, d=(20,10))**  
  - **Contracts:**  
    - (30, 50)  
    - (50, 30)  
  - **Diagram:**  
    - Frontier: Line from (30,50) to (50,30). Disagreement at (20,10).  
  - **Facilitator Table (Points):**  
    | Rule           | Payoff (P1, P2) |  
    |----------------|-----------------|  
    | Equal Split    | (45, 35)        |  
    | Product Rule   | (45, 35)        |  
    | Ray Rule       | (41.4, 38.6)    |  

  ---

  ### **Predictable Failures & Handling:**  
  1. **Pair converges instantly on equal split:**  
     - *Handling:* Note it in discussions. Later, contrast with Case A’s lopsided ceilings. Ask: *"Is equal split fair if one party’s potential gain is 3× higher?"*  

  2. **Student rejects mixing:**  
     - *Handling:* *"Assume many identical transactions; mixing averages payoffs."* Example: *"Half (0,80), half (80,0) → (40,40)."*  

  3. **Insists "there’s a right answer":**  
     - *Handling:* *"Different notions of fairness exist. We’re exploring trade-offs, not declaring winners."*  

  4. **Vague written rule:**  
     - *Handling:* Skip or interpret charitably (e.g., "maximize fairness" → use equal split). Focus on clear rules first.  

  ---

  ### **Facilitator Notes:**  
  - **Stick to Script:** No theory until final debrief. Use "product rule" and "ray rule" only after applying student rules.  
  - **Board Use:** Sketch diagrams, mark splits, and note shifts (B→C). Save rule names for the end.  
  - **Core Tension:**  
    - **Ray Rule:** "Equal sacrifice needs ideals. But deletion changes ideals → changes deal."  
    - **Product Rule:** "Stable under deletion. But lets one party sacrifice less of their potential."  
  - **What Activity Omits (Clarify in Closing):**  
    - Ray rule’s generality (any convex set, not just menus).  
    - Normative appeal of independence (e.g., "Why let a phantom option change the deal?").  
    - Utility comparisons: Both rules disown interpersonal comparison, yet ray rule’s "fraction of gain" implies it.  

  --- 

  **Outcome:** Students experience the intuition behind the Kalai-Smorodinsky solution (proportional sacrifice), its vulnerability to irrelevant options, and the trade-off against the Nash solution’s stability.
