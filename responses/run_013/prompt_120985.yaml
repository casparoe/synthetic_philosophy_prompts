  3. Case 2: The pair of cases (20 minutes): First, students negotiate the base case (without the extra contract). Then they are given the same case but with an added contract that raises one party's ceiling. They negotiate again and note any changes.
  4. Writing the rule (10 minutes): Each pair writes down a rule for a mediator to apply to an unseen third case, knowing that they might be either party.
  5. Applying the rules (10 minutes): The facilitator draws sides and applies the written rules to the third case.
