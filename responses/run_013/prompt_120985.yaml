          Now, the run sheet.

          90 minutes:

          0-5 min: Introduction
            - Explain the bargaining scenario: two parties negotiating over a set of possible contracts (which are payoff pairs). They can also mix between contracts over a long run of identical transactions, so any point in the convex hull is available.
            - If they fail to agree, they get the disagreement outcome.
            - They will be given a card with the contracts and the disagreement point, and a diagram of the feasible set.
            - In pairs, they will negotiate and agree on a split.

          5-25 min: Case A (lopsided case) negotiation and defense.
            - Distribute Case A card.
            - Give pairs 10 minutes to negotiate.
            - Then ask a few pairs to report their agreement and reason.

          25-45 min: Case B and Case C.
            - First, give Case B. Pairs negotiate (5 minutes).
            - Then, give Case C. Pairs negotiate again (5 minutes).
            - Ask pairs to noter any change in their agreement and why.

          45-55 min: Writing the rule.
            - Explain: "Imagine you are to write a rule for a mediator to apply to an unseen case. The rule should be a clear recipe. The mediator will apply it to a new case, and then you will be randomly assigned to be player 1 or player 2 in that case. So you want a rule that is fair and that you would be happy with regardless of which side you are on."
            - Give them 5 minutes to write a rule.

          55-65 min: Applying the rules.
            - Collect the written rules.
            - Randomly assign sides to the pairs (flip a coin: heads the pair is player 1, tails player 2).
            - Distribute Case D card.
            - For each written rule, the facilitator (with the help of a table) will compute the outcome for Case D.
            - Ask each pair: given your assigned side, are you happy with the outcome? (But this might be too time-consuming for 18 students -> 9 pairs). Instead, we might do a few sample rules.

            Alternatively, we can ask pairs to submit their rule and then the facilitator selects one or two that are clear and apply them.

          65-90 min: Debrief and introduction of the names.
            - Put on the board the two rules: the "product rule" and the "ray rule", and define them.
            - Discuss the intuition: 
                - Product rule: maximizes the product of gains -> often interpreted as fairness in the sense of symmetry and efficiency, and insensitive to irrelevant alternatives.
                - Ray rule: equal proportional sacrifice (each gets the same fraction of their ideal gain) -> but sensitive to the ideal point.
            - Highlight the case with the added contract: in Case C, the ray rule moved because the ideal point changed, while the product rule did not.
            - Discuss the written rules: did any pair write something resembling the ray rule? The product rule? Equal split?
            - Discuss the phantom contract: it was not chosen, but it affected the ray rule.
            - Explicitly state: 
                - The ray rule violates the independence of irrelevant alternatives (IIA) because adding an option that is not chosen can change the outcome.
                - The product rule violates the intuition of proportional sacrifice because it doesn't take into account how much each party could have gotten.

