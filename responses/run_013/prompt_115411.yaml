answer: |-
  Here are 10 tightly-focused interview questions designed to press the substance of your guest's thesis, incorporating all your specific requirements:

  1.  **Core Divergence:** You argue the Atlantic split in "liberal" isn't just semantic but reflects distinct political projects. Beyond the basic left/right difference, what's the *fundamental, substantive disagreement* between a European liberal party's core project today (like the FDP or VVD) and the project of an American Democrat calling themselves "liberal"?
      *   *(Follow-up if she deflects to party systems):* "Granted party systems shape labels, but if their *underlying commitments* were fundamentally the same project adapting locally, shouldn't we see more policy overlap? Where do their core philosophical commitments about the state or individual actually *clash*?"

  2.  **Economic Axis:** Why did "liberalism" become associated with *market fundamentalism* and center-right economics in Europe, while in the US, the term "liberal" is tied to the welfare state, regulation, and civil rights? Is this purely historical path dependency, or does it reveal a deeper conflict about the role of the state in securing liberty?
      *   *(Follow-up if she deflects to "welfare state size"):* "But both European liberal parties and US liberals accept *some* state role. Is the difference one of degree, or is it about a fundamentally different *conception* of what economic freedom requires – protection *from* the state vs. provision *by* the state?"

  3.  **Historical Translation:** When a 19th-century European intellectual called themselves "liberal," what did it *concretely* mean in terms of state power, individual rights, and the economy? Does *any* core element of that 19th-century continental liberalism genuinely survive in the DNA of *today's* American liberalism?

  4.  **"Neoliberal" as Epithet:** The term "neoliberal" is almost exclusively an accusation in European discourse, rarely a self-description. In the US, it *is* sometimes embraced by centrist figures. Does this asymmetry support your thesis of divergent projects? Does "neoliberal" function differently across the Atlantic precisely because it interacts with two distinct understandings of the "liberal" baseline?

  5.  **Social Liberalism - Bridge or Straddle?:** Does "social liberalism" (e.g., D66, parts of the Lib Dems) represent a coherent synthesis of the two Atlantic traditions, or is it primarily the *European* liberal tradition making concessions on social policy, fundamentally distinct from the American liberal project centered on civil rights and positive state action?

  6.  **Conceptual Framing:** Is the split best understood as prioritizing *one face* of a single liberal tradition – liberty primarily as *restraint on state power* (Europe) vs. liberty as something the state must *actively secure and enable* (US) – or is this very framing itself an artifact of the *American* perspective, masking a deeper divergence into two separate projects?

  7.  **Civil Liberties Common Ground?:** Both traditions champion civil liberties. Does this shared commitment suggest an underlying unity, or is it superficial, masking divergent priorities (e.g., European liberals focusing more on economic/negative liberties, US liberals on identity/positive liberties)? How does this common ground fit your "two projects" thesis?

  8.  **Survival of Older European Ideas:** Beyond just economics, what specific tenets of 19th-century European liberalism (e.g., views on secularism, nationalism, constitutionalism, elitism) do you see actively shaping the identity and policies of *contemporary* European liberal parties, distinguishing them from US liberals?

  9.  **The "Local Incentives" Challenge:** Critics might say the divergence is *only* about local party-system competition – e.g., the US lacked a viable socialist party, so liberalism absorbed the left. How does your "two projects" thesis explain why these supposedly *contingent* labels became attached to such *enduringly different policy bundles* across the Atlantic?

  10. **Falsifiability:** What evidence would genuinely challenge your "two distinct projects" thesis? Would consistent transatlantic policy alliances between European liberal parties and US Democrats undermine it? Or finding 20th-century European liberals advocating strong welfare states? Or US figures historically using "liberal" in the European economic sense? What observation would make you reconsider?

  **Self-Critical Note:**

  *   **Biggest Risk: Overstating Coherence & Ignoring Internal Variance:** The reasoning risks portraying both "European Liberalism" and "American Liberalism" as monolithic, coherent blocs when each contains significant internal diversity (e.g., Nordic agrarian liberals vs. German FDP; US New Deal liberals vs. neoliberal technocrats vs. progressive activists). The episode shouldn't stake its success on proving *absolute* homogeneity within each tradition.
  *   **Misrepresenting Historical Continuity:** The note on 19th-century liberalism risks implying a straight, unbroken lineage. The reality is messier – European liberal parties underwent significant transformations (e.g., post-WWII, post-1968). Claiming direct survival of *all* 19th-century tenets would be weak.
  *   **The "Liberty" Framing Oversimplifies:** The question framing liberty as "restraint vs. enablement" is a useful heuristic but risks being reductive. Most political traditions grapple with both aspects; the difference is emphasis and application. Staking the episode on this being an *absolute* dichotomy would be flawed.
  *   **What Would Change My Mind:** Evidence demonstrating that self-described "liberal" parties/intellectuals across the Atlantic, *when facing similar contexts* (e.g., post-industrial economies, similar electoral systems), consistently converge on the *same core policy prescriptions and philosophical justifications*, regardless of label, would seriously challenge the "two distinct projects" thesis and suggest labels are indeed primary. Consistent intellectual cross-pollination leading to *identical* policy programs would also be strong counter-evidence.
