  ### Variation: The Beeping Device

  **Alice:** Suppose the driver can spend 1 at the start on a device that beeps exactly once, at the second intersection. Now, at each intersection, she knows: silence implies first, beep implies second. She should buy the device (cost 1), then continue at the first (silent) and exit at the second (beep). Payoff is 4 - 1 = 3. Without it, she randomizes for 4/3. Since 3 > 4/3, she buys it. This resolves our dispute: the ex ante plan becomes executable *only* with distinguishing information. In the original problem, without the device, the plan isn’t available, so randomization is best. But the variant shows why: information limitations, not rationality failures, prevent the ex ante optimum. It tells against your view that randomization is fundamentally coherent—here, it’s dominated by a strategy that leverages information to execute the ex ante plan.

  **Bob:** She should buy the device and follow the conditional policy (continue on silence, exit on beep), netting 3. Without it, she randomizes for 4/3. This doesn’t resolve the dispute; it relocates it. The device makes the information sets distinct, so a differential policy becomes executable. In the original (no device), information sets are identical, so no differential policy is possible. The variant confirms my view: the ex ante optimum (4) wasn’t a real option originally because it required node-specific acts without the information to support them. Buying information doesn’t make the original plan “retrospectively available”; it creates a new plan. Your ex ante perspective only “wins” here because the information structure changes. Randomization in the original isn’t “making the best of a bad model”—it’s rational given the constraints.

  **Alice:** Is randomization rational or a compromise?

  **Bob:** It’s fully rational: it maximizes expected payoff (4/3) given the informational symmetry. The driver isn’t “compromising”; she’s optimizing within feasible strategies. If she could bind herself to your plan, she would, but she can’t—without the device, she’d deviate at the second node if she knew it was second, but she doesn’t. Randomization respects sequential rationality.

  **Alice:** But doesn’t randomization reveal a conflict between ex ante and ex post optimality? Ex ante, 4 is best; ex post, at the first node, continuing is optimal (leading to 4), but at the second, exiting is optimal (getting 4). Randomizing at the second node (exiting with 1/3 probability) is ex post suboptimal—if she knew she was at the second, she’d exit for sure. But this “conflict” is artificial; it arises from describing the problem with identical information sets. In reality, ex ante and ex post are consistent under proper information.

  **Bob:** The conflict is genuine but unavoidable. With identical information, she can’t achieve node-specific ex post optimality. Randomization balances ex ante and ex post goals: it allows a 2/3 chance of reaching the second node and a 1/3 chance of exiting there for 4, versus 0 or 1. It’s not an artifact—it’s how decision theory handles imperfect recall. Your “global plan” ignores the dynamic inconsistency: at each node, she must choose based on current information, which is symmetric.

  ---

  ### Final Disagreement

  **Alice:** The driver is a single agent who chooses a plan ex ante. The ex ante optimum (continue, exit) is a real option because it’s defined on the decision tree. Execution requires only that she acts as prescribed at the node she occupies, not that she recognizes it. Information limitations prevent execution in the original problem, but the optimum remains the benchmark. Randomization is a fallback, not true rationality. The device variant proves this: she pays to make the optimum executable. Without it, she randomizes, but only because she’s informationally impoverished, not because it’s ideal.

  **Bob:** The driver is a single agent making sequential choices with identical information. The ex ante optimum isn’t an option because it’s not implementable—without distinguishable information, she can’t assign different acts. Randomization is the rational response, maximizing utility within feasible strategies. The device doesn’t “prove” the ex ante plan was always available; it changes the game. The conflict between ex ante and ex post isn’t artifactual; it’s inherent in problems of imperfect recall. Randomization isn’t a compromise—it’s optimal under the constraints, and it’s how rational agents navigate ambiguity.
