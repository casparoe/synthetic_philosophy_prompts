  ### Dialogue on the Absent-Minded Driver Problem

  **Theorist 1 (Alice):** The driver should adopt the ex ante optimal policy: continue at the first intersection and exit at the second. This yields a payoff of 4, which dominates all alternatives—exit at the first (0) or continue at both (1). The principle is that rationality requires maximizing expected utility from the initial perspective, before any actions are taken. A policy is a complete plan chosen ex ante, mapping nodes to acts. Here, the policy (continue, exit) is available because the driver, as a single agent, commits to it in advance. At execution, she follows the plan mechanically, without needing to recognize the node. The fact that she cannot distinguish the intersections doesn’t invalidate the plan; it’s a constraint on her information, not her ability to execute pre-commitment.

  **Theorist 2 (Bob):** That policy is illusory. The principle is that an agent can only choose acts based on available information. Since her information is identical at both intersections—she cannot discern which is which—no policy assigning different acts to the two nodes is executable. She must choose a behavioral strategy: a rule from information states to acts (or randomizations). Given identical information, the rule must specify the same act (or randomization) at both nodes. Randomizing allows her to achieve 4/3 in expectation (by exiting with probability 1/3 at each intersection), beating the constant acts (0 or 1). Your policy isn’t “mechanically executable” because, at the moment of choice, she lacks the information to know which part of the plan applies.

  **Alice:** Your strongest objection is that identical information prevents differential acts. But consider: at the first intersection, she executes the “continue” instruction for node one; at the second, she executes the “exit” instruction for node two. She doesn’t need to know which node she’s at—the plan specifies the act for the node she is *actually* at. The driver is a single agent who chose the plan ex ante; execution is just carrying out orders. If she randomizes, she settles for 4/3 when 4 was achievable.

  **Bob:** But *how* does she “execute the instruction” without knowing which node it is? At each intersection, she faces identical uncertainty. Suppose she asks, “What does my plan say here?” The plan says “continue if first, exit if second,” but she doesn’t know if it’s first or second. Without that knowledge, she can’t select the correct act. She’s forced to use a decision rule based solely on her current information, which is the same at both nodes. Your policy requires her to magically condition on an unobservable state. Randomization isn’t settling—it’s the rational response to informational constraints.

  **Alice:** So, what does the driver *do* at the first intersection, given she can’t recognize it?

  **Bob:** At each intersection, she randomizes: exits with probability 1/3, continues with probability 2/3. This is her behavioral strategy, fixed for both nodes. At the first intersection, she might exit (payoff 0) or continue. If she continues, she reaches the second intersection and randomizes again (same probabilities). The expected payoff is (1/3)*0 + (2/3)*[(1/3)*4 + (2/3)*1] = 4/3. She’s one agent, but her choices are made at separate times with identical information, so she must use a time-symmetric rule.

  **Alice:** And what does she do at the second intersection?

  **Bob:** The same: randomizes with exit probability 1/3. Even though, objectively, she’s at the second node, her information doesn’t reveal that. She must act based on her belief, which is consistent with the strategy. The driver isn’t “two time-slices,” but her temporal identity doesn’t grant her node-specific knowledge. The ex ante optimum (4) isn’t a real option; it’s a fiction because it’s informationally inaccessible.

  **Alice:** I see the crux. You view the driver as a single agent whose choices are made locally at each information set, constrained by identical data. I view her as a single agent choosing a global plan ex ante, which she executes without further deliberation. For you, “the driver” at each node is an instance of the same decision-maker facing identical conditions, forcing identical acts. For me, she’s a unified entity selecting a path through the decision tree, and the tree’s structure defines the nodes, even if she can’t distinguish them. The ex ante optimum is real because it’s defined by the tree, not her awareness.

