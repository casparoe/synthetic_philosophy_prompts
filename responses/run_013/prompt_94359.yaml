prompt: |-
  You are a philosopher of mind and a historian of cybernetics; please reason carefully, and begin by brainstorming before you commit to anything. I am a software engineer with no formal philosophy training, preparing a handout for a reading group on whether the brain is a computer, anchored in von Neumann's late lectures on the subject (the posthumously published The Computer and the Brain). The picture I have taken from them is roughly this, and you may take it as given rather than needing to verify or cite it: the nervous system is a computing machine, but of a peculiar kind — its elementary signals are all-or-nothing, yet it appears to reach reliable results from parts far less accurate and less dependable than those of a digital computer, apparently by averaging over very large numbers of them; its memory may be organised on a different principle from an addressed store; and the language in which it operates is not the language of mathematics but something on which mathematical notation is a later, secondary construction.

  What I want is a decision tree that sorts the positions one could hold on whether, and in what sense, the brain is a computer. Each branch node should be a question a reader can answer without already knowing which position it leads to — for instance, whether the criterion is being a digital machine, being a universal machine, deriving reliability from precise parts rather than from redundancy, or implementing a formal language. Give each leaf the name of the position it reaches (or 'unnamed' if no one defends it) and one sentence on its most awkward commitment. Build the tree from the logical space first — the questions and the combinations of answers they permit — and only then locate the actual positions within it, noting which combinations are unoccupied and whether that is because the view is incoherent, unattractive, or merely unexplored. Aim for six to eight leaves, and flag any positions your tree cannot separate.
