answer: |-
  Below is a complete, runnable 90-minute session plan for your philosophy of biology meetup. It's designed to immerse participants in the "chauvinism vs. liberalism" bind in defining life through a hands-on, role-playing activity. Participants will argue as a "planetary protection committee" deciding the fate of a sample from a subglacial lake (the made-up autocatalytic set), using borderline cases to force debates about definitions. The debrief connects their experience to philosophical concepts (definitional, cluster, natural kind) without using jargon until the end. I've included rules, roles, a timeline, materials, troubleshooting, and limitations.

  **Session Goal:** Make participants experience the tension in defining life: too strict (chauvinism) risks excluding novel life (e.g., the autocatalytic set); too broad (liberalism) risks including non-life (e.g., prions). They must confront how definitions serve practical goals (e.g., protection vs. discovery).

  ### **Rules Overview**
  - **Core Mechanic:** Groups argue for a definition of life to justify one of three actions for the Europa sample:  
    - **Sterilize:** If not alive → Destroy sample, mission data published.  
    - **Publish:** If alive and safe → Release sample/data immediately.  
    - **Quarantine:** If alive and risky → Isolate sample for study.  
  - **Key Constraints:**  
    1. Groups **must agree on a single 1–2 sentence definition** before voting. No laundry lists of criteria.  
    2. Arguments **must use borderline cases** to challenge definitions.  
    3. **No formal philosophy terms** (e.g., "cluster concept") until debrief.  
  - **Outcome:** The committee must vote on a definition and action, knowing every definition has counterexamples.

  ---

  ### **Timeline (Total: 90 Minutes)**
  1. **Setup (5 min)**  
     - Hand out materials (roles, fact sheets). Briefly set the scene: *"You're a planetary protection committee for a Europa mission. This sample (autocatalytic set) could rewrite biology—or be inert. Decide if it's alive. Your call determines if we sterilize, publish, or quarantine. Use the borderline cases to argue."*  
     - **No lecture.** Just state the goal: *"Agree on a definition to justify your action—don’t just list traits."*

  2. **Group Formation & Prep (15 min)**  
     - Assign roles (14 people → three 4-person groups + one 2-person group; adjust if numbers change).  
     - Groups review materials (fact sheets, roles).  
     - **Task:**  
       - Discuss **which borderline cases** support/undermine definitions.  
       - Draft a **1–2 sentence definition** and **recommended action** (sterilize/publish/quarantine).  
       - Prepare to defend both, using cases.

  3. **Small Group Debates (30 min)**  
     - Groups debate internally. Focus on:  
       - *"Why does your definition exclude/include cases like viruses or mules?"*  
       - *"How does your role justify your action?"*  
     - **Facilitator (You):** Roam, listen, and nudge:  
       - *"That definition might include prions—does your role want that?"*  
       - *"If you exclude worker ants, are you being too chauvinist?"*

  4. **Full Committee Deliberation (30 min)**  
     - Groups present (3 min each): Definition + action + key borderline case.  
     - Open debate (15 min): Argue across groups. Use cases to attack definitions.  
     - **Voting (5 min):**  
       - Step 1: Vote on a **single definition** (majority wins; tie → chairs break).  
       - Step 2: Apply definition to sample → vote on **action** (sterilize/publish/quarantine).  
     - **Chairs** facilitate: Ensure arguments use cases, not just opinions. Interrupt if listing criteria.

  5. **Debrief (10 min)**  
     - Guide reflection → map to philosophy.  
     - **Script:**  
       - *"What happened when you tried to define life? Did you run into cases that broke your rules?"* (Elicit stories.)  
       - *"Notice how every definition excluded something 'obviously' alive (e.g., viruses) or included something 'obviously' not (e.g., prions). That's the chauvinism/liberalism bind."*  
       - *"In philosophy, we might think life has a strict definition (like a 'natural kind' with an essence), but your arguments probably felt more about balancing properties (replication, metabolism, etc.). That's a 'cluster concept'—no single trait is necessary, but together they form a family resemblance."*  
       - *"Finally, your roles shaped your definitions. That's key: definitions aren't neutral. They depend on what you fear (e.g., contamination) or value (e.g., discovery)."*

  ---

  ### **Materials to Prepare**
  **1. Role Cards (14 total; print 1 per person)**  
  - **Exobiologists (4 people):** *"You seek novel life. Push for a broad definition (liberalism). Fear missing alien life by being too strict. Argue to include cases like viruses or the autocatalytic set. Action tip: Favor publish/quarantine over sterilize."*  
  - **Planetary Protection Officers (4 people):** *"You protect Earth. Push for a strict definition (chauvinism). Fear false positives that risk contamination. Argue to exclude borderline cases like prions. Action tip: Favor sterilize/quarantine over publish."*  
  - **Mission Scientists (4 people):** *"You prioritize scientific knowledge. Seek a pragmatic definition. Balance inclusion/exclusion to enable study. Argue based on research value. Action tip: Favor publish—unless evidence suggests risk."*  
  - **Chairs (2 people):** *"You facilitate. Ensure all speak. Challenge groups to use cases in arguments. Break ties in votes. Stay neutral."*  

  **2. Fact Sheets (Print 1 set per group; 8 borderline + 1 sample)**  
  > **Design:** Simple bullet points. No jargon. Focus on traits that provoke debate (e.g., replication without metabolism).  
  > **Borderline Cases:**  
  > - **Virus:** *"Infects cells to replicate. Has DNA/RNA but no metabolism. Can’t replicate alone."*  
  > - **Viroid:** *"Tiny RNA circle, no proteins. Replicates in host cells. Causes plant disease."*  
  > - **Prion:** *"Misfolded protein. Replicates by reshaping other proteins. No genetic material. Causes disease."*  
  > - **Plasmid:** *"Small DNA circle in bacteria. Replicates with host. Can transfer traits (e.g., drug resistance). Not essential for life."*  
  > - **Mitochondrion:** *"Energy-producing part of cells. Has its own DNA. Can’t live independently. Evolved from bacteria."*  
  > - **Mule:** *"Offspring of horse/donkey. Healthy but sterile—can’t reproduce."*  
  > - **Worker Ant:** *"Sterile ant. Works for colony. Cannot reproduce. Dies if separated."*  
  > - **Spore:** *"Dormant bacterial/fungal state. No metabolism. Revives in right conditions."*  
  >  
  > **Sample: Autocatalytic Peptide Set (Made-up case)**  
  > *"Found in a Europa subglacial lake mineral pore. Peptides copy their composition by catalyzing amino acids. No membrane, no genetic material, no metabolism outside the pore. Falls apart if pore is destroyed."*  

  **3. Committee Rules Handout (Print 1 per group)**  
  - *"Goal: Agree on a definition of life to justify action for Europa sample.*  
  - *Rules:*  
    1. *Draft a 1–2 sentence definition in your group.*  
    2. *Argue using borderline cases—e.g., ‘Your definition would include prions, is that alive?’*  
    3. *Vote on a definition first, then action.*  
    4. *Actions: Sterilize (not alive), Publish (alive/safe), Quarantine (alive/risky).*  
  - *Time: 30 min small groups → 30 min committee debate/vote.*"  

  **4. Sample Report (Print 1 per person)**  
  > *"EUROPA SAMPLE REPORT: Autocatalytic peptide set. Origin: Subglacial lake. Traits: Self-copying peptides in mineral pore. No membrane, genome, or external metabolism. Pore-dependent; inert if removed. Unknown if hazardous."*  

  ---

  ### **Predictable Problems & Handling**
  1. **Problem: Groups list criteria instead of arguing.**  
     - *Why:* Participants default to brainstorming.  
     - *Handling:* Roam during small groups. Ask: *"Which case breaks your definition? How does your role feel about that?"* Remind them the vote requires a single definition.  

  2. **Problem: One role dominates the committee debate.**  
     - *Why:* Strong personalities or perceived "high stakes."  
     - *Handling:* Chairs enforce time limits. Ask quiet members: *"[Name], your role is X—how does case Y affect your view?"*  

  3. **Problem: Fixation on one case (e.g., viruses).**  
     - *Why:* Familiar cases distract from the bind.  
     - *Handling:* Chairs interject: *"Forget viruses—does your definition include the autocatalytic set? What about prions?"*  

  4. **Problem: Voting on action without using the definition.**  
     - *Why:* Practical concerns (e.g., "quarantine is safest") override philosophy.  
     - *Handling:* Before votes, chairs ask: *"How does your chosen definition force this action?"*  

  5. **Problem: Time overruns.**  
     - *Why:* Debates get heated.  
     - *Handling:* Use a timer. Cut off presentations at 3 min. If voting lags, chairs decide.  

  ---

  ### **What the Game Can't Reproduce (Requires Your Input in Debrief)**
  - **The "Deep" Philosophy:** The activity shows how definitions are *purpose-driven* (e.g., protection vs. discovery), but it can’t resolve if life is a "natural kind" (an objective category with an essence) or purely constructed.  
    - **Debrief Script:** *"You saw definitions depend on goals. But philosophers ask: Is life a natural kind? Does it have an essence, like water being H₂O? Your struggles suggest it might not—borderline cases resist fixed rules. Cluster concepts (Wittgenstein) often fit better, but that doesn’t mean a natural kind is impossible."*  

  - **The "Why" of the Bind:** Participants experience the bind but may not see its universality.  
    - **Debrief Script:** *"This bind isn’t just about life. Definitions of 'consciousness' or 'species' have similar tensions. Philosophy exposes how categories shape science—and vice versa."*  

  ### **Why This Works**
  - **No Prior Knowledge Needed:** Roles and cases make philosophy accessible.  
  - **Tension is Built:** The sample’s fate forces high-stakes debate. Borderline cases make chauvinism/liberalism visceral.  
  - **Debrief Links Experience to Theory:** Participants "feel" the bind before naming it.  

  **Final Tip:** Start energetically—*"Your decision could change biology... or doom Earth!"*—to ignite engagement. Enjoy your session!
