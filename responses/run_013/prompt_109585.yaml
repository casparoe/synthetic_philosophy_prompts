       - *XOR Blackmail commitment:* Pays or refuses arbitrarily, blind to acausal trade-offs. Vulnerable to blackmail even when refusal could benefit "twin" agents.  

  4. **In XOR Blackmail, does your action depend on what you’d do if the coin were different?**  
     (E.g., "If coin were heads, I’d refuse; so now I’ll pay to balance outcomes")  
