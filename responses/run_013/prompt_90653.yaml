prompt: |-
  I am a machine-learning engineer who builds probabilistic forecasting systems; my working vocabulary is the one I use daily: filtrations and adapted processes, conditional expectation, martingales and supermartingales, calibration and reliability diagrams, proper scoring rules such as Brier and log score, forecast aggregation, online learning regret bounds, and the distinction between a model's output distribution and the world's data-generating process. I have only a tourist's acquaintance with philosophy of probability, and I am not looking for a reading list or citations. I keep running into van Fraassen's Reflection principle in a reading group and would like it restated, as faithfully as possible, in my vocabulary. The principle, as I understand it, says that a rational agent's present credence in a proposition A, conditional on the supposition that her future credence in A will be some value r, should itself be r; van Fraassen motivates it with a diachronic Dutch-book argument, and it is bound up with his view that first-person reports of subjective probability are commitments rather than mere predictions of one's future mental states.

  Please translate the principle, the Dutch-book motivation, and the main lines of criticism—especially the worry that it overintellectualizes self-knowledge or demands certainty about future evidence and future selves—into my vocabulary, using the formal objects I actually work with. Then give me the residue report: which parts of the philosophical position map cleanly onto martingale properties, calibration, or forecast aggregation; which parts survive only with distortion; and which parts have no counterpart in my vocabulary at all. Finally, tell me whether the residue is best explained as a defect of my framework—something about agency, commitment, or the first-person perspective that my statistical objects cannot represent—or as evidence that the philosophical dispute is less substantive than its participants take it to be.
