prompt: |-
  I'm a 3rd year PhD student in political theory, and my dissertation is on sortition and democratic legitimacy, basically the question of whether a randomly selected citizens' assembly can be legitimate even though nobody voted for it. I've been trying to write something less academic for a departmental workshop, and I thought a short story might be a good way to dramatize the tensions. Here's the setup I want you to work with: a midsize city has just replaced its elected council with a lottocratic assembly called the Civic Lottery. The selection works in two stages: first, a random sample of all adult residents is drawn; second, those who accept are randomly assigned either to the decision assembly or to a review panel that can send decisions back for reconsideration. The twist I'm interested in is that the city also runs a counterfactual audit: after each major decision, a random sample of people who were not selected is polled on what they would have decided, and if the assembly's decision diverges too sharply from that shadow sample, the issue goes to a second lottery. I want the story to explore whether this kind of mechanism makes the assembly more accountable or just gives it a new way to be captured by whoever knows how to game the audit. Also, I want it to get at the difference between sortition as a mirror of the population and sortition as a filter for better deliberation, whether those two ideals can come apart. Maybe center it on one member of the assembly, someone who didn't want to serve, and show how the process changes her.

  Anyways, I dont need citations or reading lists or anything like that; I just need the story and then a short commentary on the choices you made. Please give me: first, the story, around 1,200 to 1,800 words; second, a section titled Commentary, around 300 to 500 words, where you explain why you set the tension where you did, what you were trying to say about sortition and lottocracy, and where you think the story risks oversimplifying the issues.
