answer: |-
  ## Folded Shape

  The scattered stones upon the hill
  Lie cold beneath the winter sky.
  **Hold fast**, you say. They merely lie.

  The binder threads the pages through,
  A spine constrains the splayed leaves tight.
  **Hold fast**, the glue asserts its right.

  Yet lift a leaf, the words remain
  Distinct upon the fragile sheet.
  The binding holds, but worlds don't meet.

  All substance poured to seamless glass,
  A molten curve without a seam.
  **Hold fast**, the furnace makes one dream.

  But trace the cooled edge, sharp and bare –
  What fused is fixed, no breath, no shift.
  The rigid whole denies the gift.

  The list goes on: always a heap,
  Or never more than parts apart...
  Each answer fractures, strains the heart.

  Then think: the folded shape that stands
  Against the flux, against the night –
  No bolt, no weld confers its might,

  But residue to residue
  Speaks *stay*, defines the curve, the cleft,
  Each knowing where the rest is left.

  **Hold fast**, the neighbourhood exhales,
  Where porch and walk and watching eye
  Adjust, support, and specify.

  **Hold fast**, the molecule demands,
  Not glued, not fused, not simply near,
  But held by what they hold most dear.

  **Hold fast.** The binding is the form,
  The mutual grip that gives the place.
  The whole defines the partial face.

  **Hold fast** – the call, the state, the act
  That makes the stone part of the wall,
  The part a meaning, meaning all.

  ---

  **Form Enacting Content:**
  The poem embodies mutual maintenance through its evolving refrain, "Hold fast." Initially an external command or property (urging contact, describing fastening, signifying fusion), it transforms into an intrinsic state and reciprocal action arising *from* the whole arrangement. Lines gain meaning only in context: early descriptions of stones, books, or glass lack resonance alone, mirroring how isolated parts lack definition. Later stanzas achieve significance through interdependence, culminating in the final lines where "Hold fast" carries the accumulated weight of reciprocal dependence. The slant rhymes and rhythmic consistency act as coherence, not rigid binding, allowing the central concept – the whole prior to the parts – to emerge through the poem's unfolding structure, just as the parts find their definition within the poem's completed form.
