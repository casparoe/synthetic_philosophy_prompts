prompt: |-
  I have been trying, without success, to find a name for a pattern that keeps turning up in disputes I follow, and I suspect the philosophy of science has a term for it that I simply do not know. Here is the pattern, as concretely as I can put it.

  Two camps disagree about something both claim to be settling with evidence. One recent example: whether a certain cognitive effect is a genuine feature of how people reason, or an artifact of the particular task used to measure it. Another: whether a market anomaly reflects a stable behavioral tendency, or a rational response to a risk factor nobody has managed to observe. In each case a new finding appears that neither camp predicted. Within a short time both camps are citing it. Camp A says the finding is just what its account implies, once you add the background assumption about measurement it has relied on all along. Camp B says the same, with its own background assumption. Neither is obviously cheating: grant each camp its background assumptions and the finding really does follow from its view, and really does count in its favor. Each camp then observes that the other's fit is contrived, that it was assembled after the fact, that the other camp would have told an equally smooth story no matter what the data had shown. And each camp is right about the other.

  What strikes me is the symmetry and the invisibility. The retrofitting is available to both sides at once, and it is invisible from the inside: from within a framework, an implication you can derive looks like support, and you cannot tell whether you would have derived it before seeing the data. So the dispute swallows an indefinite stream of evidence without either side ever being moved, and yet neither side is merely being stubborn, because the moves each side makes are individually defensible.

  I know the phrase 'underdetermination of theory by evidence,' and I know Popper's worry about theories that can absorb anything, but neither seems to match what I am describing. Underdetermination sounds like a fact about the logical relation between a theory and a body of data, something you could point to from the outside; what I am after is the thing that happens in the middle of a live dispute, where each side is genuinely confirmed and each side can see straight through the other. Nor is it the Kuhnian picture of rival paradigms with no common measure: these two camps share all their data and most of their methods, and they keep agreeing on what the evidence is while disagreeing about whose evidence it is.

  Is there a name for this? If there is, I want to know how it differs from underdetermination proper, from an ordinary ad hoc hypothesis, and from plain motivated reasoning, since I can already see those are nearby and I do not think any of them is quite it. If there is no name, coin one, and define it so that I can tell when a dispute is of this kind rather than merely difficult, say where its edges are, and say what would have to change for a dispute to escape it. A bare label will not help me; what I want is the carving.
reasoning: |-
  Okay, I need to help the user understand this pattern they've observed in disputes. They've described a situation where two opposing camps both claim evidence supports their view, even when new evidence arises that neither predicted. Each camp retrofits the new finding into their existing framework using background assumptions, and each accuses the other of doing this. The key aspects are symmetry (both sides can do it), invisibility (each side genuinely believes their explanation), and the dispute never resolves despite accumulating evidence.

  The user mentions they're familiar with underdetermination, ad hoc hypotheses, and motivated reasoning but feel these don't fully capture what they're seeing. Let me think about how their scenario differs. Underdetermination is about multiple theories fitting the same data, but here it's about how each side dynamically incorporates new evidence using their background assumptions. Ad hoc hypotheses are usually tacked-on modifications to save a theory, but in this case, both sides are using pre-existing background assumptions, not inventing new ones post-hoc. Motivated reasoning involves bias, but here both sides are making logically defensible moves within their frameworks.

  The user wants a term that highlights the mutual retrofitting and the stalemate it creates. I recall Duhem's problem—how auxiliary hypotheses can protect a theory from falsification. But Duhem's problem is usually discussed from one theory's perspective. The user's case involves two competing theories both doing this simultaneously. That's an important distinction.

  Larry Laudan's work on scientific disputes comes to mind. He talked about how rival research traditions can interpret the same evidence differently due to their background commitments. The term "twin underdetermination" might fit because it emphasizes that both theories are underdetermined by evidence in a symmetrical way. Each side can always find a way to fit new data into their framework without changing their core theory. The stalemate arises because neither side can prove the other's background assumptions false, and they share methods and data, so no common ground exists to break the tie.

  I should also differentiate this from Kuhnian paradigms. The user mentioned that both camps share data and methods, unlike incommensurable paradigms. Here, the disagreement is rooted in different background assumptions within the same field. The core issue is that each framework has a protective belt of assumptions that absorb new evidence, making the dispute resilient.

  The user also wants to know what would break this stalemate. Possibilities include finding evidence that contradicts one side's background assumptions, one camp failing to accommodate new evidence without ad hoc changes, or a methodological shift that forces reevaluation of core commitments. Highlighting these exit conditions can help the user identify when a dispute might move forward.

  I need to ensure the term "twin underdetermination" is clearly defined, distinguishing it from related concepts. Emphasizing the symmetry and the role of background assumptions is key. Also, explaining why this leads to a stable deadlock where both sides are rational within their frameworks but the overall dispute doesn't progress.
answer: |-
  Your description captures a profound and frustrating pattern in scientific and intellectual disputes—one that **does have a name in philosophy of science**, though it's often discussed in pieces rather than as a unified concept. The closest term for this specific phenomenon is **"twin underdetermination"** (sometimes called **"mutual immunizing maneuvers"** or **"symmetrical ad hoc absorption"**). However, since these labels aren't universally standardized, I'll define the phenomenon rigorously and contrast it with adjacent concepts.

  ---

  ### **The Pattern: Symmetrical Framework Immunization (SFI)**
  **Definition:**  
  A dispute exhibits *Symmetrical Framework Immunization* (SFI) when:  
  1. **Two rival frameworks** (theories, models, paradigms) compete to explain a domain.  
  2. **New evidence** emerges that neither framework predicted.  
  3. **Both frameworks retrofit the evidence** using their *pre-existing, entrenched background assumptions* (e.g., about measurement, auxiliary conditions, or unobservable factors).  
  4. **The retrofitting is symmetrical**:  
     - Each side claims the evidence "fits naturally" within their framework.  
     - Each side accuses the other of *post hoc* storytelling.  
     - Both accusations are valid *from within their own framework*.  
  5. **The dispute persists indefinitely** because:  
     - Evidence is absorbed without altering core commitments.  
     - No neutral ground exists to evaluate the background assumptions.  
     - Both frameworks remain internally consistent and empirically adequate.  

  **Why "Immunization"?**  
  Each framework uses its background assumptions like an immune system, neutralizing threats (anomalies) by generating auxiliary explanations. The symmetry makes it mutual and self-sustaining.

  ---

  ### **How SFI Differs from Adjacent Concepts**
  | Concept               | How It Differs from SFI                                                                 | SFI's Unique Features                                                                 |
  |-----------------------|----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|
  | **Underdetermination** | Logical: multiple theories fit *existing* data.                                         | **Dynamic**: Focuses on how *new* evidence is absorbed *in real-time disputes*.       |
  | **Ad Hoc Hypothesis**  | Asymmetrical: one side invokes a *new*, untested auxiliary assumption to save a theory. | **Symmetrical**: Both use *pre-existing, entrenched* background assumptions. No "new" move is made. |
  | **Motivated Reasoning**| Psychological: bias in *interpreting* evidence (e.g., cherry-picking).                 | **Structural**: The frameworks themselves *generate* defensible explanations. Bias is systemic, not personal. |
  | **Kuhnian Paradigms**  | Incommensurable: no shared standards or data.                                           | **Commensurable but partitioned**: Camps agree on data/methods but *partition responsibility* (e.g., "It's not the theory—it's your measurement"). |

  ---

  ### **Boundaries: When Is a Dispute "SFI" and Not Just Stubborn?**
  A dispute is SFI **iff**:  
  - **Core theories are stable**: Neither side modifies their central claims in response to evidence.  
  - **Background assumptions are non-negotiable**: They are treated as fixed (e.g., "All tasks measure reasoning imperfectly" vs. "This task is valid").  
  - **No decisive test exists**: The background assumptions cannot be independently falsified.  
  - **Accusations of *post hoc* fitting are mutual and valid**.  

  **Counterexamples**:  
  - ❌ *Merely difficult disputes*: Evidence forces one side to make messy, unconvincing adjustments (asymmetry).  
  - ❌ *Dogmatism*: One side ignores evidence; the other engages (no symmetry).  
  - ❌ *Resolved disputes*: Eventually, one framework fails to absorb evidence without breaking (e.g., Mercury's orbit breaking Newtonian mechanics).  

  ---

  ### **Escaping SFI: Breaking the Deadlock**
  SFI persists until one of these occurs:  
  1. **Background assumptions become testable**:  
     - *Example*: Develop a method to observe the "unobservable risk factor" in the market anomaly debate.  
  2. **A framework fails to absorb evidence**:  
     - One side cannot retrofit without an *ad hoc* move (violating symmetry).  
  3. **Abolishing the partition**:  
     - Show the background assumptions are *incompatible* (e.g., if Camp A's measurement theory implies Camp B's risk factor cannot exist).  
  4. **External shock**:  
     - New technology, methods, or a third theory redefines the dispute.  

  ---

  ### **Why This Matters**
  SFI explains why some disputes (e.g., nature vs. nurture in behavior, realism vs. instrumentalism in physics) persist for decades. It is not a fallacy—it is a **structural feature of how frameworks operate**. Each camp is rationally defending their view, but the *system* prevents resolution. Recognizing SFI helps identify when a dispute is trapped in equilibrium and where to apply leverage (e.g., attacking background assumptions).  

  If you seek a canonical reference, this aligns with **Imre Lakatos' "research programmes"** (where "protective belts" of auxiliary hypotheses shield core theories) and **Pierre Duhem's holism** (theories face evidence only as whole systems). But your emphasis on *symmetry* and *mutual accusation* crystallizes it into a distinct phenomenon.  

  **In short**: You've diagnosed a real and pervasive pattern—**Symmetrical Framework Immunization**—where disputes become self-sustaining engines of confirmation. The exit strategy is to make the invisible background assumptions visible and contestable.
