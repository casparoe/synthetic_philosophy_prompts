prompt: |-
  I'll give you the setup and then what I actually want. I retired two years ago after thirty-odd years as a hydrologist with a state water agency, and I've spent a good chunk of that retirement reading political philosophy — mostly the stuff about who gets to decide things, which I wish somebody had handed me at forty instead of sixty-eight. Through a chain of events I won't bore you with, I now chair a volunteer committee in the little town where we retired; we're called the Water Futures Committee, which sounds grander than it is. Here's our mess. Our valley sits over a shallow aquifer that a big farming operation has been pumping hard, and the state has told us that before it will impose a cap — something like a forty percent cut in permitted withdrawals — the town has to hold a referendum. Under state law the clerk runs it and only registered voters of the town may vote, full stop. But the people whose wells actually go dry are mostly not in our town: there's a city about fourteen miles downstream that draws from the same formation, plus a couple of unincorporated hamlets, and they'd outnumber us three to one. Meanwhile a fair number of our own residents live up on the ridge and pull from a different, deeper source entirely, so a cap costs them nothing. And the farm itself is a corporation that owns a few thousand acres in the township, pays property tax, employs about sixty seasonal workers who live in trailers for part of the year, and has no residents at all. In my reading I keep running into two principles for who belongs in a decision like this, and they come apart right here in front of me: one says everyone whose interests are affected should have a say, the other says it's everyone subject to the authority making the decision — subject to the rule, bound by it, made to obey it — regardless of whether they come out worse. I've also noticed, and this is the part that keeps me up, that in our case the choice between them basically decides the referendum: include downstream and the cap passes, exclude them and it fails. So the rule for drawing the boundary is doing the work the vote is supposed to do.

  What I want from you is to turn whichever of those principles (or some defensible combination) into a procedure my committee can actually run — not an essay about the problem, a procedure. We meet ninety minutes a week, nobody on the committee has read any of this except me and I'm an amateur, and we have to hand the town council a recommendation in eight weeks that the clerk can implement without a law degree. So: the questions to ask in order, what counts as a sufficient answer to each, which steps are mechanical (something a clerk can check against a record) and which are irreducibly judgment calls, where the procedure should stop with a flat no, and where it has to hand the question to an elected body because it's a question of values and not of fact. Then run it on three of our cases and show your work: (a) the downstream city, whose residents are affected but not governed by us; (b) our own ridge residents, who are governed by us but plainly unaffected; (c) the farming corporation, which is governed, taxed, and employs people here but has no human residents to register. At least one of the three should come out in a way my committee won't enjoy hearing, and I'd rather you tell me which one that is than be diplomatic. Finally, be straight with me about the circularity I described — the fact that the eligibility rule flips the result — because if there's no way out of it I need to know that before I stand up in front of the council and pretend otherwise.

  Give me the answer under these headings, in this order, and please respect the rough lengths: What the principle commits us to (about 250 words, no name-dropping, I don't need a reading list and I can't look anything up); The procedure, step by step (about 600 words, numbered, each step saying what a sufficient answer looks like and whether it's mechanical or a judgment call); Where the procedure gives out (about 200 words); Worked cases (about 500 words, the three above, with the unwelcome one flagged); and finally Confidence and the softest spot (about 150 words) — tell me how confident you actually are in this procedure and single out the one step you're least sure about and why. Keep the whole thing in plain language; if I have to look up a term you've used, you've lost me. And I should say I'm definately not expecting you to settle the metaphysics of it — I just need something that won't fall apart the first time somebody on the council asks a hard question.
reasoning: |-
  Okay, the user is a retired hydrologist chairing a volunteer committee dealing with a complex water rights referendum. They've clearly done their homework on political philosophy and identified the core tension: affected interests vs. governed community. What they need isn't theory but a practical decision procedure that holds up under scrutiny. 

  Hmm, their situation is a perfect storm of jurisdictional mismatch: the aquifer doesn't care about town boundaries, but the law does. The corporation-as-legal-person angle is particularly thorny - can a business be "subject to authority" without human residents? And that circularity problem they spotted is brutal: how the eligibility rule predetermines the outcome. They're right to want that addressed head-on.

  I notice they're explicitly rejecting academic jargon. Good - this needs to work in a 90-minute committee meeting with laypeople. The request for "unwelcome" outcomes shows they value intellectual honesty over comfort. Smart. They've also boxed me in with very specific structural requirements (word counts, headings). That's helpful discipline.

  The real challenge is designing steps that minimize judgment calls but don't oversimplify. For example: "affected interests" needs operational definition - measurable well depth thresholds? Tax records for corporations? And that ridge resident case will force uncomfortable tradeoffs between principles. 

  Most importantly, I must resist the urge to "solve" the philosophy. They're not asking for perfection - just something defensible that doesn't collapse at the first council question. The confidence section will be crucial: better to flag weaknesses upfront than have them exposed later.
answer: |-
  ## Recommendation for Water Futures Committee Eligibility Procedure

  ### What the Principle Commits Us To (250 words)
  We’re blending two core ideas: **affected interests** (those harmed/benefited) and **subject to authority** (those bound/enforced by our rules). This hybrid principle says: *Those whose vital interests are demonstrably impacted AND who are subject to the town’s authority in relevant ways have the strongest claim to vote. Others subject to authority but unaffected, or those affected but not governed, have weaker claims.* This avoids extremes: it’s not just anyone downstream (unworkable), nor just town residents regardless of impact (unjust). We prioritize inclusion where impact and governance overlap meaningfully. However, state law sets the *minimum* boundary (town voters only); our recommendation can argue for *expanding* eligibility within legal constraints where impact and governance connect. The corporation is tricky: it’s governed but lacks human residents, forcing a choice between its legal "existence" and the people it employs.

  ### The Procedure: Step by Step (600 words)

  1.  **List Entities:** Identify all groups/entities potentially affected *or* governed regarding the aquifer cap decision (e.g., Town Residents (by address), Downstream City, Hamlets, Farming Corp, Seasonal Workers). *Sufficient:* Comprehensive list based on maps, water reports, tax rolls, employment records. **Mechanical.**

  2.  **Assess "Subject to Authority":** For each entity, determine if they are *currently* subject to the town’s enforceable rules/ordinances *specifically related to water use, land use, or well drilling* within the town boundaries. *Sufficient:* Check town code for applicable regulations the entity must comply with. (e.g., Town Residents: Yes; Downstream City: No; Hamlets: Likely No; Farming Corp: Yes (land use, well permits); Seasonal Workers: Individually, only if residents). **Mechanical/Judgment:** Checking code is mechanical; interpreting applicability to specific groups is judgment.

  3.  **Assess "Affected Interest":** For each entity, determine if there is *objective evidence* they will *directly and materially* gain/lose from the cap decision. Focus on water access: documented well depth/decline, reliance on the specific aquifer, lack of alternatives. *Sufficient:* Hydrogeological reports showing aquifer connection, well logs showing depth/drawdown, municipal water source data. Avoid speculation. *Insufficient:* General proximity, potential future impact. **Judgment Call (based on evidence).**

  4.  **Apply Hybrid Test & Strength of Claim:**
      *   **Strong Claim (Recommend Vote):** Entity is *both* **Subject to Authority** (Step 2) *and* demonstrates **Affected Interest** (Step 3). (e.g., Town Resident with shallow well in aquifer).
      *   **Weak Claim (Do Not Recommend Vote):**
          *   Entity is **Subject to Authority** but has **No Affected Interest** (Step 3 shows no impact). (e.g., Town Ridge Resident).
          *   Entity has **Affected Interest** but is **Not Subject to Authority** (Step 2 shows no governance). (e.g., Downstream City).
          *   Entity’s claim rests solely on employment or economic ties *without* direct water impact or direct governance *of the individuals*. (e.g., Seasonal Workers *not* also residents).
      *   **Corporate Entity:** Treat as governed entity (Subject to Authority if Step 2 = Yes). Its "interest" is property/operation, but voting requires human agency. *Recommendation:* **Do Not Recommend Vote** – governance applies to the *corporation*, not individual voters; no human residents with direct interest. Voting rights attach to people.

  5.  **Define Eligible Voters:** Only individuals with a **Strong Claim** (Step 4) are recommended for eligibility. Eligibility is tied to the *individual's* specific situation (residence + water source impact) within the town. *Sufficient:* List based on property records (residency) cross-referenced with well permit data/depth logs showing aquifer reliance. **Mechanical/Judgment:** Compiling lists is mechanical; interpreting well logs for aquifer reliance is judgment.

  6.  **Document Rationale:** For each group/entity assessed in Steps 2-4, clearly state the finding and brief reason (e.g., "Downstream City: Affected Interest (Yes - Hydro Report Fig 3), Subject to Authority (No - Outside Jurisdiction). Claim: Weak. Not Recommended."). **Mechanical.**

  7.  **Recommend to Council:** Present: (a) Proposed eligible voter criteria based on Strong Claim; (b) List of groups/entities assessed and their classification (Strong/Weak Claim); (c) Rationale documentation; (d) Clear statement that this is a *recommendation* for the Clerk to implement within state law (town voters only), potentially requiring verified evidence of aquifer reliance *within town boundaries*. **Mechanical.**

  ### Where the Procedure Gives Out (200 words)
  This procedure **cannot overcome the state law constraint.** The Clerk can only allow *registered town voters* to vote. Our core task is to recommend *which town voters* should be eligible based on impact, within this legal box. Steps 2-4 involve unavoidable **judgment calls**:
  *   **"Affected Interest" (Step 3):** Defining "materially" and "directly" based on hydro data is interpretive. Where's the cutoff depth? What evidence is definitive? Committees must weigh evidence carefully.
  *   **"Subject to Authority" Scope (Step 2):** Deciding which town rules are "relevant" requires judgment.
  *   **Corporate Voting (Step 4):** The principle doesn’t neatly resolve this. Our procedure excludes corporations (no human voters), but some may argue their governance status warrants representation *somehow*. This is a values gap.
  *   **The Circularity:** The eligibility rule *does* predetermine the outcome. Including only impacted town voters likely passes the cap; using the full town roll likely fails it. The procedure makes this bias explicit based on principles, but **cannot eliminate it.** The fundamental mismatch between aquifer boundaries and town jurisdiction creates this bind. We can only make the rationale transparent.

  ### Worked Cases (500 words)

  *   **(a) Downstream City:**
      *   Step 2: **Not Subject to Authority.** City lies outside town boundaries; town rules cannot be enforced there. (Mechanical).
      *   Step 3: **Affected Interest.** Hydro reports confirm shared aquifer; city wells are documented to be impacted by pumping. (Judgment based on evidence).
      *   Step 4: **Weak Claim (Affected but Not Governed).** Do Not Recommend Vote. **Rationale:** While materially affected, they are not subject to the town's authority enforcing the decision or related water rules. Including them exceeds legal jurisdiction and the "subject to authority" principle.
      *   **Recommendation:** Not Eligible.

  *   **(b) Ridge Residents (Town Voters):**
      *   Step 2: **Subject to Authority.** Town residents, subject to all town ordinances. (Mechanical).
      *   Step 3: **No Affected Interest.** Well logs and hydro reports confirm they draw from a separate, deep aquifer unaffected by the shallow aquifer pumping or the proposed cap. (Judgment based on evidence).
      *   Step 4: **Weak Claim (Governed but Unaffected).** Do Not Recommend Vote. **Rationale:** While subject to the town's authority, they will not experience direct, material impact (water loss) from the cap decision. Including them dilutes the voice of those directly impacted. **<- UNWELCOME OUTCOME (Likely surprises committee, reduces "Yes" votes).**
      *   **Recommendation:** Not Eligible (if procedure strictly followed). *Practical Note:* This may be politically difficult. Committee must decide if strict principle outweighs resident solidarity.

  *   **(c) Farming Corporation:**
      *   Step 2: **Subject to Authority.** Owns land/taxes in town; subject to land use, zoning, and well permitting rules. (Judgment/Mechanical - check code).
      *   Step 3: **Affected Interest.** Its operations rely entirely on pumping the shallow aquifer; a cap would directly and materially impact its ability to farm. (Judgment based on evidence - obvious).
      *   Step 4: **Corporate Entity.** While governed and affected, it lacks human residents to cast votes. Voting rights attach to people. **Do Not Recommend Vote** for the corporation itself. **Rationale:** Governance applies to the legal entity, not individual voters. The corporation's "interest" is not directly represented by a human vote; its compliance is enforced on the entity, not via franchise. Seasonal workers are assessed separately (likely Weak Claim unless residents).
      *   **Recommendation:** Not Eligible (Corporation itself). Seasonal workers only eligible if *also* town residents (check Step 4 for them individually).

  ### Confidence and the Softest Spot (150 words)
  **Confidence: Moderately High.** The procedure is logical, transparent, and translates the hybrid principle into actionable steps. It clearly separates evidence gathering (Steps 1-3) from principled reasoning (Step 4), making it defensible to the council. The judgment calls are focused and based on available evidence.

  **Softest Spot: Step 3 - Defining "Affected Interest" materially and directly.** This is inherently vulnerable:
  1.  **Evidence Gaps:** Not all wells may have recent logs/reliable data. How do we handle borderline cases (e.g., moderate depth, some drawdown)?
  2.  **Subjectivity Threshold:** Deciding what constitutes "material" impact (e.g., 10% reduction? Risk of future dry well?) is fundamentally a value judgment disguised as a factual one, even with data.
  This step is crucial and the most likely point of challenge ("Prove MY well won't be affected eventually!"). Be prepared to show the specific evidence used and acknowledge the inherent uncertainty where data is imperfect.
