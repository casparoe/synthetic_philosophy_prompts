  Below is a carefully designed plan for your seminar activity, optimized for clarity, engagement, and pedagogical impact. The focus is on ensuring students viscerally experience the transitivity problem before formalizing it. Total word count: ~750.

  ---

  ### **Activity Design: "The Trade-Off Chain"**
  **Core Mechanic**  
  - **Cards**: Create 20 cards (use 14 if limited to one/student). Each card has two dials:  
    - **A**: "Number of people mildly inconvenienced" (e.g., delayed commute).  
    - **B**: "Severity of harm to one person" (e.g., broken leg, car accident).  
    - **Card values**:  
      - Card 1: A=0, B=20  
      - Card 2: A=1, B=19  
      - ...  
      - Card 20: A=19, B=1  
    *Why this works*: The endpoints feel starkly different (e.g., "no harm vs. massive harm" vs. "massive inconvenience vs. minor harm"). Students will feel the tension between incremental trade-offs and extreme outcomes.  

  - **Setup**:  
    - Students line up in order (Card 1 to Card 20), holding their cards visibly.  
    - **Swap Rule** (posted): *"Swap with your right neighbor if their card is ≥1 unit better on A, EVEN IF it’s 1 unit worse on B."*  
    - **Teams**: Split into Team Left (Cards 1–10) and Team Right (Cards 11–20).  

  - **Process**:  
    1. **Prediction Ledger** (critical for reflection):  
       - Each student answers **two questions** *before any swaps*:  
         > a) *"When we compare the two endpoints (Card 1 vs. Card 20), which will Card 20’s holder say is ‘better’? Why?"*  
         > b) *"Will your OWN swap decision survive the entire game (i.e., still hold after all passes)?" (Yes/No)*  
       - Collect ledgers pre-activity to baseline predictions.  
    2. **First Pass (Left to Right)**:  
       - Starting left, each pair compares and swaps if the rule demands it.  
       - *Expected result*: All adjacent pairs swap (Card 1 moves right, Card 20 moves left).  
       - **Team scoring**: 1 point/student for correctly executing the swap (max 20 points).  
    3. **Second Pass (Right to Left)**:  
       - Repeat the process from right to left (same rule).  
       - *Expected result*: Another full reversal (Card 20 moves further left, Card 1 further right).  
    4. **Final State**:  
       - Cards reverse positions (Card 1 ends near right, Card 20 near left).  
       - **Vote**: "Which card is the WORST outcome overall?" (Team with the "winning" card sets next topic).  

  ---

  ### **Debrief Script: Key Insights and Pitfalls**  
  1. **Gut-Feeling Moments**:  
     - **Swap tension**: Students will hesitate when trading minor harm (B) for inconvenience (A). *Highlight this*: "Did swapping feel like an ‘improvement’? Why/why not?"  
     - **Prediction mismatch**: Most will predict Card 20’s holder prefers Card 20 (high A) but post-activity, many see Card 1 (low B) as "better." *Ask*: "Why did your endpoint judgment change after seeing the chain?"  

  2. **Transitivity Problem**:  
     - **Structure mapping**:  
       - Each swap implies "Card N+1 > Card N" by the rule.  
       - By transitivity, Card 20 > Card 1, but the group often votes Card 1 > Card 20.  
     - **Name the problem**: "We created a chain where X > Y > Z > ... but Z > X! This is intransitivity."  

  3. **Predictable Pitfalls & Fixes**:  
     - **Pitfall 1**: Students may resist swapping (e.g., "B matters more than A").  
       - *Fix*: Enforce the rule strictly. Say: "The rule is arbitrary—follow it even if you disagree."  
     - **Pitfall 2**: Ledger question (b) may confuse (students assume swaps are "final").  
       - *Fix*: Clarify: "Survive" means your local swap aligns with the *global* order after all passes.  
     - **Pitfall 3**: The vote on "worst card" may deadlock.  
       - *Fix*: Use ranked voting (students list top 3 "worst" cards; majority wins).  

  4. **What the Game Can’t Do (The Gap)**:  
     - **Rule vs. Preference**: The activity shows *the imposed rule* is intransitive when chained. It does *not* prove that human preferences ("better than") are inherently intransitive.  
     - **Bridge the gap**: Ask:  
       - *"Would you use this rule in real life? Why did it fail?"*  
       - *"Can we avoid intransitivity by weighting A and B? What if we can’t agree on weights?"*  
     - **Supply the link**: Explain that intransitivity arises when trade-offs lack consistent weighting (e.g., A and B are incommensurable).  

  ---

  ### **Why This Works**  
  - **Gut-level impact**: The physical swap and ledger force students to confront the tension between local rationality (following the rule) and global absurdity (reversing endpoints).  
  - **Debrief payoff**: The vote exposes disagreement, revealing that aggregated "better than" judgments may be incoherent.  
  - **Efficiency**: Ledger + two passes fit in 80 mins. Teams and scoring sustain engagement.  

  **Final Tip**: Start the debrief by reading ledger predictions aloud (e.g., "Who thought Card 20’s holder would pick Card 1?"). The mismatch between predictions and outcomes primes deeper discussion.
