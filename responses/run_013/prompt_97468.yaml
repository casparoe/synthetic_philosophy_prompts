    — *Awkward commitment: Must deny that specification/control failures share common structure across contexts.*  

  **Node 2A (Epistemic): What makes specification fundamentally hard?**  
  - **A. Complexity of human values/context** (Values are underspecified or unframable)  
  - **B. Technical limits of objective functions** (Reward hacking, distributional shifts, etc.)  

  **Node 2B (Agential): Where does adversarial pressure originate?**  
  - **A. Single system's capabilities** (Power-seeking emerges in one agent)  
  - **B. Multi-system incentives** (Competition, misaligned actors in an ecosystem)  

  **Node 3A (Values): Does alignment scale favorably with capability?**  
  - **A. Yes** (Smarter systems better infer/uncover values)  
  - **B. No** (Misgeneralization worsens with capability)  

  **Node 3B (Technical): Is alignment primarily about system design or deployment context?**  
  - **A. System design** (Robustness properties within the model)  
  - **B. Deployment context** (Operator incentives, data pipelines, governance)  

  **Node 3C (Single-agent): Can alignment be solved pre-deployment?**  
  - **A. Yes** (Control/verification techniques suffice)  
  - **B. No** (Ongoing oversight required; alignment is dynamic)  

  **Node 3D (Multi-agent): What is the root failure mode?**  
  - **A. Competitive pressures** (Race dynamics override safety)  
  - **B. Collective action problems** (Coordination failures between actors)  

  **Node 4A (Values + scales well): Is "alignment" a property of the system or its training history?**  
  - **A. System** (Aligned knowledge/values embedded in the model)  
  - **B. History** (Alignment depends on data/process, not final state)  

  ---

  ### Leaves with Positions  
  1. **Value-Loading View** (1A→2A→3A→A)  
    — *Awkward commitment: Requires formalizing amorphous human values.*  
  2. **Specification/Engineering View** (1A→2B→3B→A)  
    — *Awkward commitment: Assumes specification failures are reducible to robustness puzzles.*  
  3. **Containment/Control View** (1B→2B→3C→A)  
    — *Awkward commitment: Needs secure control methods against superintelligent systems.*  
  4. **Multi-Agent Coordination View** (1B→2B→3D→B)  
    — *Awkward commitment: Demands enforceable cooperation among sovereign actors.*  
  5. **Structural View** (1A→2B→3B→B)  
    — *Awkward commitment: Implies capitalism inherently misaligns AI incentives.*  
  6. **Unnamed (Capability-Sensitive Value Learning)** (1A→2A→3A→B)  
    — *Awkward commitment: Accepts that aligned systems may *lose* alignment as capabilities grow.*  
  7. **Unnamed (Dynamic Control)** (1B→2B→3C→B)  
    — *Awkward commitment: Alignment permanently requires costly human oversight.*  

  ---

  ### Ambiguities and Unoccupied Branches  
  - **Indistinguishable pair:**  
    - *Specification/Engineering* vs. *Structural* on scaling (Node 3B). Both *could* claim difficulty flattens, but for different reasons (technical limits vs. fixed structural constraints).  
  - **Unoccupied branches:**  
    - 1B→2B→3D→A (Agential, multi-agent, competitive pressures):  
      — *Unexplored?* Implies races are unavoidable; most work assumes coordination is possible.  
    - 1A→2A→3A→A→B (Values, scales well, history-dependent):  
      — *Unattractive?* Suggests alignment isn't "solved" even if systems robustly learn values.  
    - 1A→2A→3B (Epistemic-values → Technical):  
      — *Incoherent?* Values complexity can’t reduce to technical failures without losing distinction.  
    - 1B→2A→3C→A (Agential, single-system, pre-deployment solvable):  
      — *Containment/control occupies this branch.*  

  ### Key Splits Clarified  
  - **Epistemic vs. Agential** (Node 1) separates whether the core challenge is ignorance or opposition.  
  - **System vs. Relationship** (Nodes 3B/3C/4A) isolates if alignment is a static property or contextual process.  
  - **Scaling** (Nodes 3A/3B) distinguishes views on capability’s impact (solves, irrelevant, or worsens alignment).  
  - **Single vs. Ecosystem** (Node 2B) forces separation of monolithic and multi-agent challenges.  
  - **Root cause/solution/name unity** is disambiguated by path: e.g., Value-Loading shares root/solution (human values), while Multi-Agent rejects both. Deflationary denies name unity.
