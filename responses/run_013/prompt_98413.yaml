  When structuring, I'll group desiderata by whether they protect subjectivity or objectivity demands, then show where tensions arise. The closing comparison should be telegraphic since the user wants criteria to dominate.
answer: |-
  Here are the desiderata for an adequate theory of taste, motivated by core phenomena and challenges, with their status marked. Historical and stipulated cases are integrated as specified.

  ---

  ### **Core Desiderata & Motivations**
  1. **The Antinomy Requirement**  
     *Motivation*: We say "This painting is beautiful *to me*" yet argue as if demanding "This *is* beautiful" universally. The prize jury must justify its verdict as more than personal whim.  
     *Status*: **Non-negotiable**. A theory must reconcile the subjective feel with the objective claim.

  2. **Faultless Disagreement Survival**  
     *Motivation*: Two attentive, sincere viewers may irreconcilably disagree about a work’s merit (e.g., one finds a minimalist sculpture profound, another sterile). The theory must explain why neither is *wrong* while preserving a standard.  
     *Status*: **Non-negotiable** (for non-relativist theories). The standard must not collapse into "anything goes."

  3. **Non-Circular Charge of Corruption/Immaturity**  
     *Motivation*: We condemn a taste for kitsch or propaganda as "corrupt," or a child’s preference for bright colors as "immature." The theory must ground this without simply defining corruption as "disagreeing with experts."  
     *Status*: **Non-negotiable**. Circularity would make criticism vacuous.

  4. **Asymmetry of Direct Experience**  
     *Motivation*: Reading a critic’s praise of a symphony is no substitute for hearing it. A jury member who skipped viewing the artwork cannot judge.  
     *Status*: **Non-negotiable**. The theory must require firsthand engagement.

  5. **Non-Question-Begging Connoisseur Superiority**  
     *Motivation*: We defer to art historians or seasoned critics. But if their authority *defines* the standard, the theory is circular. Superiority must derive from traits independent of current consensus (e.g., breadth of exposure, attentiveness).  
     *Status*: **Non-negotiable**. Expertise must be earned, not axiomatic.

  6. **Divergent Ideal Critics**  
     *Motivation*: Suppose two critics with equal training, attentiveness, and freedom from prejudice irreconcilably disagree (e.g., on whether *Tristram Shandy* is ingenious or tedious). The theory must either resolve this or accept indeterminacy.  
     *Status*: **Negotiable/Prejudicial**. Some camps demand resolution; others accept pluralism.

  7. **Community-Wide Error**  
     *Motivation*: Could an entire culture misjudge art? (e.g., Nazi condemnation of "degenerate" art). "Bad" must mean more than "divergent from ours"—e.g., systematic blindness to complexity, enforced by coercion.  
     *Status*: **Negotiable**. Relativists reject this; objectivists require it.

  ---

  ### **Stipulated Cases & Demands**
  1. **Neurodivergent Perceivers**  
     Identical training, attention, and knowledge, but divergent perceptual wiring (e.g., one hears a chord as harmonious, the other as dissonant).  
     *Demand*: The theory must explain whether one judgment is correct, both are valid, or beauty is relative to perceiver-type—without reducing to mere preference.

  2. **Radically Novel Art Form**  
     An art form (e.g., AI-generated immersive experiences) that challenges all prior criteria (narrative, technique, intentionality).  
     *Demand*: Accommodation must be *principled*—e.g., extending core principles (e.g., "complex unity")—not ad hoc ("because elites now endorse it").

  3. **Deadlocked Jury**  
     After rigorous debate, jurors remain split on a winner.  
     *Demand*: The standard must prescribe action: e.g., defer to the most experienced juror? Aggregate scores? Declare no winner? It cannot imply all views are equally valid.

  ---

  ### **Tensions & Dealbreakers**
  - **Fatal Tension**: **Faultless Disagreement** (Desideratum 2) and **Community-Wide Error** (Desideratum 7) conflict. If a whole community is wrong, how can individual disagreement be faultless? A theory must either limit faultlessness or define community error weakly (e.g., via coercion).  
  - **Most Eliminative Requirement**: **Non-Circular Charge of Corruption** (Desideratum 3). It sinks theories that define "good taste" as "what ideal critics prefer" without independent criteria for *why* critics are ideal. Humean and dispositional accounts risk this.

  ---

  ### **Brief Family Assessment vs. Desiderata**
  - **Hume’s Ideal Critic**:  
    Fails **Divergent Ideal Critics** (6) and struggles with **Neurodivergent Perceivers** (1). Excels at **Connoisseur Superiority** (5) if non-circularity is waived.  
  - **Kantian Universal Subjectivity**:  
    Struggles with **Faultless Disagreement** (2) and **Neurodivergent Perceivers** (1)—if harmony is universal, wiring differences shouldn’t matter. Excels at **Antinomy** (1) and **Asymmetry** (4).  
  - **Dispositional/Expressivist**:  
    Easily handles **Faultless Disagreement** (2) and **Neurodivergence** (1) but fails **Community Error** (7) and **Corruption Charge** (3) (if "bad taste" is just atypical disposition). **Connoisseur Superiority** (5) becomes statistical, not normative.

  ---

  ### **Conclusion**
  Adequacy hinges on balancing subjectivity’s reality with criticism’s bite. The hardest nuts are **non-circular corruption charges** and **reconciling faultless disagreement with collective error**. No historical theory clears all hurdles; a hybrid acknowledging multiple "standards" for multiple perceiver-types may be needed, risking jury paralysis (Stipulated Case 3). The prize jury test forces the issue: without **Asymmetry** and **Non-Circular Expertise**, verdicts are indefensible.
