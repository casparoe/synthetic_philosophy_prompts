  I should flag that "faultless disagreement" and "collective error" might be irreconcilable - if everyone agrees but they're all wrong, how can disagreement ever be faultless? And the neurodivergence case probably kills dispositional theories that rely on shared human responses.

  For historical families: 
  - Hume's ideal critic stumbles on divergent experts
  - Kant's universal subjectivity struggles with physiological differences
