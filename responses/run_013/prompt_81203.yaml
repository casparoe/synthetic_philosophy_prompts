  Okay, the user is in a graduate seminar on animal ethics and is defending the scale argument for invertebrate sentience. They're getting pushback and want to practice against a strong critic. The critic should be a philosopher of mind who's skeptical but not speciesist, using expected value reasoning elsewhere.

