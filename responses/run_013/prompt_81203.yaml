  Also, the user's formula requires that subclasses are homogeneous in their sentience potential. But if we don't know what grounds sentience, how can we define these subclasses reliably? For example, having nociception doesn't guarantee sentience; it's a correlate. If the basis is unknown, our credence might be global, not divisible into independent subclasses.

