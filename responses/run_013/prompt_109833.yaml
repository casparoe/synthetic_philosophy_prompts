  The user mentions mathematicians using CH or ¬CH freely in theorems. This suggests a pluralistic approach where different models are legitimate for different purposes. But then some argue for MM settling CH at ℵ₂ as "true," implying a belief in an intended model. How do these coexist?

  I should outline possible stances on set-theoretic truth. Realism posits a unique universe where CH has a truth value. Multiverse views see all models as equally real. Pragmatism avoids truth claims entirely. But the practice shows a blend: while working, mathematicians act as pluralists, but some still believe in an intended universe.

  The routine of proving with CH or ¬CH doesn't require a unique universe—it fits with multiverse or formalism. But when mathematicians call MM "true," they're stepping into realism. The key is that the practice itself is flexible, but the rhetoric reveals deeper commitments.

  The user is bothered by the inconsistency. They want to know what the practice necessitates versus what's optional. For example, does treating MM as a candidate truth rule out multiverse views? Not necessarily, but it suggests a preference for certain universes as more "natural." 

  Swapping to strict formalism would mean dropping all truth claims—no "MM is true," just consistency. In a multiverse, theorems would need specification of which universes they apply to, and "settling" CH would be contextual. The current practice allows for vague realism, which is pragmatically useful but philosophically fuzzy.

  The user might also be seeking validation that their discomfort is legitimate—that there's genuine tension here. The practice leans into realism through rhetoric while being formally pluralistic, which can feel inconsistent. Highlighting that this tension is inherent in modern set theory could help them frame their own stance.
answer: |-
  As a philosopher of mathematics immersed in set theory, I'll dissect the practice you describe, moving from the concrete mathematical fact to its philosophical residue. The core tension is between mathematical practice and implicit ontological commitments.

  ### What "CH is independent" means mathematically:
  1. **Syntactic fact**: There is no proof of CH or ¬CH from ZFC axioms.
  2. **Semantic fact**: There exist models of ZFC where CH holds and models where it fails.
  3. **Methodological consequence**: For any ZFC-proof of a statement \( \phi \) that assumes CH, we can relativize it to \( \text{ZFC} + \text{CH} \models \phi \). Same for ¬CH.

  ### Views of set-theoretic truth in play:
  - **Universalism (Realism)**: There is a unique intended universe of sets (\( V \)). CH has a definite truth value. Independence means ZFC is incomplete for describing \( V \).
  - **Multiverse Pluralism**: All consistent models of set theory are equally "real". CH is genuinely indeterminate – true in some universes, false in others.
  - **Formalism**: Set theory is about syntactic manipulation. "Truth" is provability within a chosen formal system. CH-independent statements lack meaning beyond their role in deductions.
  - **Pragmatic Maximization**: No commitment to a unique \( V \), but some extensions of ZFC (like forcing axioms) are privileged because they maximize interpretative power or settle natural questions.

  ### Anatomy of the practice & its presuppositions:
  1. **Routine use of CH/¬CH**:  
     - **Presupposes**: Model-theoretic relativity. No unique universe is *required* for this practice – it fits naturally with multiverse views or formalism.  
     - **Residue**: Treating ZFC as an incomplete base theory. The practice is neutral between "there's one universe we haven't fully captured" and "there are many universes".

  2. **Advocating forcing axioms (e.g., MM) as "true"**:  
     - **Presupposes**: A selective realism. MM isn't just consistent; it captures something fundamental about sets (e.g., "maximality" under forcing). This leans toward universalism, but with a refined notion of the intended universe.  
     - **Residue**: A hierarchy of epistemic value. MM is privileged over arbitrary extensions of ZFC. This *requires* rejecting "all models are equal" pluralism.

  3. **Dismissing philosophy as "not math"**:  
     - **Presupposes**: A working distinction between mathematical practice (proofs, models) and ontological interpretation. But the use of "true" for axioms betrays latent metaphysical commitments.

  **What the practice strictly requires**:  
  - Acknowledgment that ZFC is incomplete.  
  - Acceptance that mathematical results can be relativized to different contexts (CH vs ¬CH).  
  - Privileging *some* extensions of ZFC (e.g., large cardinals, forcing axioms) for their mathematical fruitfulness.  

  **What it does NOT strictly require (but often pairs with)**:  
  - Belief in a *unique* intended universe.  
  - Commitment to MM being "true" in a Platonic sense. Many who say "MM is true" mean "MM is mathematically natural/productive".  

  ### Rival views ruled out quietly:
  - **Flat-footed Formalism**: If set theory were *only* about symbol manipulation, calling MM "true" would be incoherent. The practice of evaluating axioms as "better" or "more true" based on mathematical consequences (e.g., settling ℵ₂, structure theory of ℵ₁) requires a notion of *theoretical virtue* beyond consistency.  
  - **Radical Multiverse Equality**: If all models were truly equal, advocating MM as "true" would be nonsensical. MM settles CH at ℵ₂, but in a multiverse with no privileged models, why prefer this over models where CH holds or where 𝔠 = ℵ₃?  

  ### What changes under rival presuppositions:
  - **Under Strict Formalism**:  
    - Set theorists must stop saying "MM is true". They say: "MM is consistent and proves useful theorems".  
    - Independence results are purely syntactic; no "search for better axioms" – all extensions are formal options.  
    - The seminar leader's dismissal becomes consistent; no philosophical residue remains.  

  - **Under Full Multiverse Pluralism**:  
    - Set theorists must stop implying that MM "settles" CH absolutely. They say: "In MM-universes, 𝔠 = ℵ₂", emphasizing relativity.  
    - Results assuming CH/¬CH are framed as holding in specific sub-universes.  
    - Advocating MM requires justification within pluralism (e.g., "MM universes are mathematically rich").  

  ### The tacit commitment:
  The practice assumes a **stratified ontology**:  
  - A base theory (ZFC) defining "set-like" structures.  
  - A privileged class of extensions (large cardinals, forcing axioms) that reveal "deep structure" – whether of a single universe or a natural collection of universes.  
  "Truth" talk for axioms like MM is a shorthand for **mathematical naturalness**: the ability to decide undecidable statements, prove new absoluteness results, or unify areas of mathematics. This sits uneasily between universalism and pluralism, but rejects "anything goes" formalism. The practice needs a notion of *theoretically virtuous axioms*, which presupposes that set theory is about more than consistency – it's about uncovering mathematical coherence. The residue is a quiet realism about mathematical depth, even if not about a unique universe.
