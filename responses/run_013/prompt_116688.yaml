   - Each small action is individually rational and defensible.
   - The cumulative effect is ruinous for the group.
   - Cooperation is rationally available but structurally difficult to maintain.

  We'll design a resource extraction game with a common pool resource. The trap: over-extraction leading to collapse. Each player is a company extracting a resource (e.g., fish from a lake, oil from a field). The resource renews but only if the total extraction is below a threshold. However, each player faces individual incentives to extract more because if they don't, others might, and they lose out.

  Key structural elements:
  1. **Small steps**: Each round, players can choose to extract a small amount (low cost) and the harm (depletion) is delayed and shared by all.
  2. **Cooperation phase**: Allow a negotiation phase where players can form binding agreements (e.g., to limit extraction). But then we introduce a structural challenge: 
     - We'll have an "entry rule": after the agreement phase, one randomly chosen player (or a new entrant) is allowed to break the agreement without penalty (to simulate the real-world problem that agreements are not enforceable on outsiders or that circumstances change for one player). 
     - Alternatively, we can have a replication rule: if a player (by chance) defects and does well, then in the next round one other player is replaced by a new player who inherits the defector's strategy (to mimic the market pressure to compete).
  3. **Unilateral refusal**: We'll have a moment where one player is asked to unilaterally reduce extraction. We will show that this player then earns less and the resource is still depleted by others, so they lose twice (less income and still the collapse).
  4. **Justifications**: At the end, each player writes a one-line justification for their final extraction level.

