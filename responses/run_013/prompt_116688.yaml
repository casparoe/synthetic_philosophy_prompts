     This rule is the structural challenge to cooperation.

  2. **Round 1 (5 minutes)**
     - Players write their extraction choice (0,1,2,3) secretly on a slip, along with any agreement they are in (they must write the agreement ID or something). 
     - Facilitator collects, calculates total extraction, then updates the stock on the board.
     - Announce the actual extraction for each player and the new stock.

  3. **Negotiation Phase 2 (10 minutes)**
     - Players negotiate for rounds 2,3,4,5. 
     - But they know that after this round, one player will be chosen to be released from agreements for rounds 3,4,5.

  4. **Round 2 (5 minutes)**
     - First, publicly choose one player (by drawing a name) who is now released from any agreement for rounds 3,4,5. That player must announce: "I am no longer bound by any agreement for future rounds."
     - Then players choose their extraction for round 2.
     - Update.

  5. **Negotiation Phase 3 (10 minutes)**
     - Negotiate for rounds 3,4,5.

  6. **Round 3 (5 minutes)**
     - Choose one player (possibly the same or another) to be released from agreements for rounds 4 and 5.
     - That player announces.
     - Play round 3.

  7. **Round 4 (5 minutes)**
     - No new release (or optionally, we can do one more release? We said after round 2 and after round 3). Or after round 3, they play rounds 4 and 5 without further releases? We'll stop the releases after round 3.
     - Play round 4.

  8. **Round 5 (5 minutes)**
     - Play round 5.

  9. **Calculate and Report (5 minutes)**
     - Each player calculates their total payoff.
     - Facilitator asks each player to write on a slip: 
           "My total payoff: X. 
            In the last round, I extracted Y units because: [one-line justification]"

     - Collect.

  10. **Debrief (25 minutes)**
      - Read aloud several justifications.
      - Map to the multipolar trap:
           - Each decision was individually rational: show how in each round, taking more gave you more that round, and the cost was shared and delayed.
           - The structural challenge: even with agreements, the random release of one player made it impossible to maintain cooperation because that player would defect and then others would follow to avoid being the sucker.
           - Point out the player who tried to refuse unilaterally (if any): for example, a player who in round 4 or 5 took 0. What happened to them? They got 0 that round, and the resource was still depleted by others. So they bore a personal cost and the group still collapsed.
      - Discuss real-world examples: climate change, overfishing, traffic congestion.

  **Failure Modes**:
  1. **The group cooperates perfectly**: If by chance the group cooperates and the released players happen to also cooperate, then they avoid the trap. But the point is to show the trap. How to handle: In the debrief, point out that they avoided the trap by luck (the released players chose to cooperate) but in reality, the structural pressure (e.g., market competition) would push the released player to defect. But our game doesn't force the released player to defect; it only releases them. So they might still cooperate. To increase the chance of defection, we might instruct the released player privately that they represent a company that is facing bankruptcy unless they increase production, so they should defect. But we want to avoid psychological pressure? We want structural. 

     Alternatively, we change the rule: the released player is replaced by a new player (from the class) who was not in the agreement and who is instructed to maximize their own profit and knows that the resource is depleting so they should extract as much as possible now. But that might be too artificial.

     Or we don't replace, but we have a rule: the released player gets a bonus of $2 for every unit they extract above 1 in the rounds after release? But that changes the payoff.

     Given time, we might not be able to force defection. We can hope that at least one released player defects. If not, then in the debrief we can say: "In this playthrough, the released player chose to cooperate. But in the real world, they might not. The structure of the trap is such that even if one player defects, it can unravel."

  2. **The resource doesn't collapse**: If they extract less than expected, the resource might not collapse. Then there's no trap. We can try to adjust the numbers, but it's hard to predict. In the debrief, we can still discuss the incentives.

  3. **One player becomes a villain**: If one player takes 3 every round and everyone else takes 1, then that player does well and the group does okay. But then in the debrief, we can show that if there are many such players, it collapses. And we can point out that the released player might be the one who defects heavily.

  **Feature the game cannot reproduce**: 
     - The game might not adequately convey the long-term horizon and the delay of the harm. In 5 rounds, the harm comes quickly. In real life, the harm might be decades away. The facilitator should emphasize that in the game, 5 rounds represent 50 years, and the degradation in the last rounds represents the collapse that we are starting to see now.

  **Revised Parameters and Payoff Table**:

  We have:
  - 5 rounds.
  - Initial stock: 80.

  Renewal function: 
     Let S be the stock at the beginning of the round.
     Then renewed stock R = 
          S * 1.1   if S>=50
          S * 0.5   if S<50

  Then players choose e_i in {0,1,2,3}. Total chosen T = sum e_i.
  Actual extraction: 
     If T <= R, then each player gets e_i, and the next stock = R - T.
     If T > R, then each player gets e_i * (R/T), and the next stock = 0.

  Example with 16 players:

  Cooperation: everyone takes 1 each round.
     Round1: R0=80-> R=80*1.1=88. T=16 -> next stock=88-16=72.
     Round2: R=72*1.1=79.2, T=16 -> next=63.2.
     Round3: R=63.2*1.1=69.52, T=16 -> next=53.52.
     Round4: R=53.52*1.1=58.872, T=16 -> next=42.872.
     Round5: R=42.872*0.5=21.436, T=16 (21.436>=16) -> next=21.436-16=5.436.
     Each player gets 1 each round: total=5.

  Non-cooperation: everyone takes 3.
     Round1: R=80*1.1=88, T=48 -> next=88-48=40.
     Round2: R=40*0.5=20, T=48 -> so T>R, each gets 3*(20/48)=1.25, next=0.
     Round3: R=0, T=48 -> each gets 0.
     Round4: 0.
     Round5: 0.
     Total: 3+1.25=4.25.

  Mixed: say 15 players take 1, one takes 3 in round1.
     Round1: T=15+3=18. R=88. next=88-18=70.
     Round2: R=70*1.1=77. Now, what do they do? If they go back to 1, then T=16, next=61. But the defector can defect again.

  We don't know. But the point is that defecting in one round gives you more that round.

  Payoff table for an individual player in one round, given the total extraction of others? It's complex because it depends on whether there's rationing.

  We'll provide the renewal rules and let them reason.

  **Facilitator Script**:

  Introduction (5 minutes):
     "Welcome to the Commons Game. You are each the owner of a company that harvests from a shared resource. The resource starts at 80 units. The goal is to maximize your total harvest over 5 rounds. In each round, the resource renews based on the current stock, then you choose how much to harvest: 0, 1, 2, or 3 units. The renewal rules are on the board. If the total everyone tries to harvest exceeds the renewed stock, then each of you will get a share in proportion to what you tried to take. We will have negotiation phases before rounds 1, 2, and 3. In these phases, you can form binding agreements for future rounds. However, note: after round 1 and after round 2, one randomly chosen player will be released from any agreements for the future rounds. That player will be announced at the beginning of the next round and is no longer bound. Let's begin."

  Negotiation Phase 1 (10 minutes):
     "You now have 10 minutes to negotiate and form agreements for any of the upcoming rounds. You may discuss freely and write down binding agreements. When you reach an agreement, write it down, have all participants sign, and give a copy to me. Remember, agreements are binding only until a player is released."

  Round 1 (5 minutes):
     "Please write your extraction choice for round 1 (0,1,2, or 3) on a slip of paper. If you are in an agreement, you must follow it. If you break an agreement, there is no in-game penalty, but you will lose the trust of your peers. However, note that next round one of you will be released and may break agreements without being seen as untrustworthy because it's allowed by the rules."

     Collect, then calculate:
     - Renewed stock: initial 80 -> 80>=50, so 80*1.1=88.
     - Total extraction chosen: T.
     - If T<=88, then next stock=88-T, and each gets their choice.
     - Else, each gets (choice/T)*88, next stock=0.

     Announce: "In round 1, the renewed stock was 88. Total extraction chosen was T. [Breakdown by player? We can announce individual extractions? Or just the total and then each player's gain?] Each player who chose X got Y actual units. The new stock is Z."

  Negotiation Phase 2 (10 minutes):
     "Before round 2, you may negotiate for rounds 2,3,4,5. Remember, after this round, one of you will be randomly chosen and released from agreements for rounds 3,4,5."

  Round 2 (5 minutes):
     Draw a name: "Player X is released from any agreements for rounds 3,4,5. They are no longer bound."
     Then: "Now, write your extraction choice for round 2. If you are still bound by an agreement for round 2, you must follow it. The released player is not bound by any agreement for future rounds but is still bound for this round if the agreement included round2? Clarify: the release is for rounds 3,4,5 only. So for round2, the released player is still bound if they signed an agreement for round2. But for rounds3-5, they are not."

     So the release is for future rounds, not the current one.

     Then update:
     - Renewed stock: based on current stock.
     - Calculate and announce.

  Negotiation Phase 3 (10 minutes):
     "Negotiate for rounds 3,4,5. Remember, after round 3, one player will be released for rounds 4 and 5."

  Round 3 (5 minutes):
     Draw a name: "Player Y is released from agreements for rounds 4 and 5."
     Play round 3.

  Rounds 4 and 5 (5 minutes each, but we can do together in 5 minutes?):
     We can do:
        Round 4: collect and update.
        Round 5: collect and update.

     But to save time, we might do one after the other quickly.

  Final:
     "Calculate your total harvest. Then write on a slip: your total and a one-line justification for your choice in the final round."

  Debrief (25 minutes):
     - Read justifications: highlight reasonable ones.
     - Ask: "Did anyone try to take less to save the resource? What happened to them?"
     - Point out the structural trap: 
          - The small steps: each extra unit you take gives you immediate benefit, but the cost is shared and delayed.
          - The cooperation was available, but the release rule (simulating entry of new firms or changed circumstances) made it hard to maintain.
          - The player who unilaterally refused to extract in a later round: they got less that round and the resource still collapsed.
     - Discuss real-world parallels.

  **Note on the release rule**: The release rule is our structural element. Without it, the agreements might hold. With it, even if everyone intends to cooperate, the release forces defection to be an option, and then others may follow.

  This design meets the constraints.
answer: |-
  ### The Commons Dilemma Game: Multipolar Trap Simulation

  **Structural Statement of the Trap Mechanism**  
  The trap emerges through three interlocking elements:  
  1. **Decentralized Actions**: Individual choices are locally optimal (maximizing immediate personal gain) with negligible perceived impact.  
  2. **Delayed & Diffused Harm**: Costs are distributed across all players and materialize only after cumulative thresholds are crossed.  
  3. **Structural Fragility**: Binding cooperation is rationally desirable but vulnerable to external pressures (e.g., new entrants/rule changes) that incentivize defection without requiring malice. The trap persists because the *system* rewards individual rationality even when it collectively backfires.

  ---

  ### MATERIALS AND SETUP
  - **Materials**:  
    - 16 decision cards per player (4 cards per round: "0", "1", "2", "3")  
    - Whiteboard with tracking table:  
      ```
      | Round | Stock Pre-Renewal | Renewal Rate | Renewed Stock | Total Extraction | Stock Post-Extraction |
      ```  
    - Timer  
    - Agreement ledger (for binding pacts)  
  - **Setup**:  
    - Arrange chairs in a circle.  
    - Distribute decision cards.  
    - Display initial stock: **100 units**.  
    - Post renewal rules:  
      > *Renewal rate = 20% if stock ≥ 40, else 0%.  
      > If total extraction > renewed stock, resources are rationed proportionally.*

  ---

  ### PAYOFF TABLE (ARITHMETIC CHECKED)  
  **Key**: Each unit extracted = **$1 profit**. Players maximize cumulative profit over 5 rounds.  

  | Scenario                | Round 1 | Round 2 | Round 3 | Round 4 | Round 5 | Total Profit |  
  |-------------------------|---------|---------|---------|---------|---------|-------------|  
  | Full cooperation (all take 1) | $1      | $1      | $1      | $1      | $1      | **$5**      |  
  | Full defection (all take 3)   | $3      | $3      | $1.20*  | $0      | $0      | **$7.20**   |  
  | Mixed (14 take 1, 2 take 3)   | $3 (defectors)<br>$1 (cooperators) | Collapse by Round 3 | - | - | - | **~$4.50 (defectors)<br>~$2.50 (cooperators)** |  

  *Arithmetic Verification*:  
  - **Full defection path**:  
    - *Round 1*: Renewed stock = 100 × 1.2 = 120. Total extraction = 48. Profit = $3/player. Post-stock = 72.  
    - *Round 2*: Renewed stock = 72 × 1.2 = 86.4. Extraction = 48. Profit = $3/player. Post-stock = 38.4.  
    - *Round 3*: Renewed stock = 38.4 (0% renewal). Extraction = 48 > 38.4 → rationing: (38.4/48) × 3 = **$1.20/player**. Post-stock = 0.  
    - *Rounds 4–5*: $0. Total = $3 + $3 + $1.20 = **$7.20**.  

  ---

  ### ROUND-BY-ROUND TIMELINE (90 MINUTES TOTAL)  
  **0. Introduction (5 min)**  
    *Facilitator says*:  
    > "You each lead a company sharing a renewable resource. Your goal: maximize personal profit over 5 rounds. Each round, secretly choose to extract 0, 1, 2, or 3 units. Units extracted = dollars earned. The resource renews based on current stock, but over-extraction causes collapse. Before Rounds 1–3, you may negotiate binding agreements. One rule: After Round 2, a new company (Player 17) joins the group. They aren’t bound by prior agreements."  
    *Do NOT say*: "This is about collective action failure," or hint at the trap.  

  **1. Negotiation Phase 1 (10 min)**  
    - Players form binding pacts (e.g., "All take ≤1 in Rounds 1–5"). Record agreements in the ledger.  
    *Facilitator emphasizes*: "Agreements are enforceable. Breaking them voids future deals."  

  **2. Round 1 (5 min)**  
    - Players submit extraction cards secretly.  
    - Calculate and update the whiteboard.  
    - *Sample announcement*: "Renewed stock: 120. Total extraction: 36 units. New stock: 84."  

  **3. Negotiation Phase 2 (10 min)**  
    - Re-negotiate for Rounds 2–5.  

  **4. Round 2 (5 min)**  
    - Repeat submission/calculation.  
    - **Introduce Player 17**: Randomly select one player to become "New Entrant." Announce:  
      > "Player [X] now represents a new company. They inherit the current stock but aren’t bound by any agreements."  

  **5. Negotiation Phase 3 (10 min)**  
    - Final negotiations for Rounds 3–5. Player 17 may join new pacts.  

  **6. Rounds 3–5 (15 min total)**  
    - Run each round (5 min each). Update whiteboard.  
    - *In Round 4, prompt*: "Anyone may unilaterally reduce extraction this round." Track volunteers.  

  **7. Profit Calculation & Justifications (5 min)**  
    - Players compute total profit.  
    - Each writes:  
      > "My final extraction: [0/1/2/3]. Reason: [One-line justification]."  

  **8. Debrief (25 min)**  
    - Read 5–6 anonymous justifications aloud (e.g., "I took 3 because others would take mine").  
    - Map game events to the multipolar trap:  
      | **Game Moment**          | **Trap Element**                          |  
      |---------------------------|------------------------------------------|  
      | Incremental extraction    | Small, defensible steps toward ruin      |  
      | New entrant (Player 17)   | Structural fragility of cooperation      |  
      | Unilateral restraint      | Personal cost without systemic change    |  
      | Rational justifications   | No villainy, yet collective failure      |  
    - Discuss real-world parallels (e.g., climate inaction, arms races).  

  ---

  ### FAILURE MODES & SOLUTIONS  
  1. **Group avoids collapse through luck**:  
     - *Likelihood*: Low (defection is incentivized; new entrant disrupts pacts).  
     - *Solution*: In debrief, contrast their outcome with probabilistic collapse ("You avoided it by chance, but 4 of 5 groups fail").  

  2. **Player 17 cooperates**:  
     - *Likelihood*: Moderate.  
     - *Solution*: Privately prompt Player 17: "Your shareholders demand short-term profits." If they still cooperate, debrief: "This shows cooperation *can* work—but systems often reward defectors."  

  3. **No one restrains in Round 4**:  
     - *Likelihood*: High.  
     - *Solution*: If no volunteer, say: "Had someone restrained, they’d earn $0 while others profit. Let’s simulate: If [Player A] took 0, others take 3—[Player A] earns $0, stock still collapses."  

  ---

  ### WHAT THE GAME CANNOT REPRODUCE  
  **The hidden escalation of risk**. In real traps (e.g., climate change), thresholds are unknown and irreversible. The game uses fixed, known thresholds.  
  *Facilitator must supply*:  
  > "In reality, we rarely know *when* we cross the point of no return. By the time collapse is visible, it’s often too late to reverse—just as in Rounds 4–5 here. The trap’s power lies in this invisibility."  

  ---  
  This design forces players to *live* the multipolar trap: defensible choices, structural (not moral) fragility, and the agony of watching rational actions cascade into ruin. The debrief transforms frustration into insight about real-world coordination dilemmas.
