prompt: |-
  I'm putting together a handout for a grad seminar on manipulation and I want the spec before we touch any of the theories. So: write the desiderata a theory of manipulation has to meet — the cases it has to classify right, the distinctions it can't collapse, the background facts it can't contradict — and give me the consideration behind each one. I want it to handle stuff like the highballing car salesman versus the partner who says "if you really loved me you'd..."; whether manipulation even requires deception, given you can manipulate someone while telling the strict truth; and where the nudge / choice-architecture crowd lands, since reordering a cafeteria or a search ranking seems to be aiming at your behavior without addressing your reasons. Throw in two cases I keep worrying about: manipulation of someone's options rather than their beliefs (rigging the menu, not the mind), and manipulation with no manipulator at all (a recommender that learns to feed outrage and nobody intended it). Then tell me which two requirements you think cant be met at once, and which single one does the most to kill the accounts people actually defend. Dont score the theories against the list, I'll do that in class.
