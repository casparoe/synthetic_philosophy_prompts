answer: |-
  Here’s a rigorous set of desiderata for a theory of manipulation, designed as a seminar handout. Each includes the core requirement and the underlying philosophical/empirical consideration driving it:

  **Core Desiderata for a Theory of Manipulation**

  1.  **Distinction from Coercion & Persuasion:**
      *   *Requirement:* Must sharply distinguish manipulation from coercion (which removes/overrides choice via threats) and rational persuasion (which appeals to reasons/evidence).
      *   *Consideration:* Manipulation operates in the crucial middle ground – influencing choice *without* force/threats *or* engaging the target's rational faculties fairly. Collapsing these obscures key moral and conceptual differences (e.g., threatening a lawsuit vs. guilt-tripping vs. presenting evidence).

  2.  **The Deception Paradox:**
      *   *Requirement:* Must accommodate both manipulation *involving* deception (lies, misleading omissions) and manipulation *without* deception (using stark truths, emotional triggers, or environmental cues).
      *   *Consideration:* Intuitively, you *can* manipulate someone while telling the literal truth (e.g., car salesman revealing a flaw *only* after building rapport/highballing; partner weaponizing a true vulnerability: "If you really loved me, you'd quit your job"). A theory solely reliant on deception fails.

  3.  **Volitional Integrity (vs. Rational Autonomy):**
      *   *Requirement:* Must explain how manipulation subverts or bypasses the target's *volition* (will, choice-process) without necessarily attacking their capacity for *reason* per se. It should capture influences that feel "off" or controlling, even if beliefs remain true.
      *   *Consideration:* Nudges (cafeteria placement), emotional blackmail ("If you loved me..."), or exploiting compulsions manipulate *bypassing* rational deliberation, not by feeding false beliefs. The wrong is in hijacking the *process* of choosing, not (always) the *content* of belief.

  4.  **Mechanism Neutrality:**
      *   *Requirement:* Must account for manipulation via diverse mechanisms: belief distortion (deception), emotional triggering (guilt, fear, excitement), option structuring ("rigging the menu"), social pressure, and informational control (selective truth-telling).
      *   *Consideration:* Manipulation isn't a single tool; it's a toolbox. A theory focused only on beliefs (e.g., lying) misses emotional exploitation or choice architecture. Rigging options (e.g., making the healthy choice inconvenient) can manipulate as effectively as lying.

  5.  **The Nudge/Choice Architecture Challenge:**
      *   *Requirement:* Must provide principled criteria for when benign "nudging" (e.g., default organ donation) crosses into manipulative "steering" (e.g., hiding cancellation options, exploiting known biases for profit/power), especially when reasons aren't addressed.
      *   *Consideration:* Libertarian paternalism aims to influence behavior while preserving freedom of choice. A theory must pinpoint when influencing behavior *through non-rational means* (like default effects or salience) becomes manipulative, violating the spirit of informed/autonomous choice.

  6.  **Non-Intentional Cases (Emergent Manipulation):**
      *   *Requirement:* Must accommodate cases where manipulation occurs *without* a specific, blameworthy "manipulator" intending it (e.g., algorithmic recommender systems optimizing for engagement by feeding outrage, creating addictive patterns unintended by designers).
      *   *Consideration:* Moral responsibility often focuses on intent, but manipulative *outcomes* can arise from system dynamics. A theory shouldn't exclude these pervasive modern phenomena simply because no single agent consciously plotted the manipulation.

  7.  **Affective Leverage:**
      *   *Requirement:* Must explain how manipulation exploits non-rational psychological levers: emotions (fear, guilt, shame, excitement), cognitive biases (anchoring, scarcity), impulses, loyalties, or vulnerabilities.
      *   *Consideration:* Much manipulation works precisely by *sidestepping* reason and targeting these "hot" systems (e.g., highballing exploits anchoring bias; "If you loved me..." exploits guilt/loyalty). A purely cognitive/rational theory fails.

  8.  **Harm/Autonomy Link:**
      *   *Requirement:* Must explain *why* manipulation is typically wrong or problematic, linking it to a violation of autonomy, agency, dignity, or leading to harmful/suboptimal outcomes for the target.
      *   *Consideration:* The core objection to manipulation isn't just inefficiency; it's an ethical one concerning the target's self-governance or well-being. The theory needs a plausible account of this wrong-making feature.

  **The Tension Point: Two Desiderata in Conflict**

  *   **Volitional Integrity (3) vs. Mechanism Neutrality (4):** This is the most persistent tension.
      *   *Why?* Defining manipulation strictly as a *subversion of volition* (e.g., bypassing agency) risks excluding "rigging the menu" cases where options are constrained but the choice *within* those options feels volitionally intact (e.g., "I freely chose the fries because they were right in front of me, even if the salad was hidden"). Conversely, defining it broadly by *mechanism* (any non-rational influence) risks including benign nudges or simply effective marketing under "manipulation," diluting the term's moral force. Squaring a robust concept of *violated volition* with the sheer diversity of *non-coercive, non-persuasive influence mechanisms* is extremely difficult.

  **The Theory-Killer: The Most Damaging Desideratum for Existing Accounts**

  *   **The Deception Paradox (2):** This single-handedly dismantles a huge swathe of popular and intuitive theories.
      *   *Why?* Many influential accounts (often implicit) define manipulation *centrally* or *necessarily* in terms of deception, trickery, or belief distortion. The "Truthful Manipulation" cases (emotion weaponization, exploiting known biases with true information, highballing with true sticker prices) are undeniable and pervasive. Any theory requiring deception as a core element instantly fails to capture these paradigm cases. It forces theorists into contortions (e.g., redefining "deception" implausibly broadly) or abandoning deception as a necessary condition, fundamentally reshaping their account. This desideratum exposes the inadequacy of overly cognitive/rational-focused definitions.

  ---

  **Handout-Ready Summary:** This framework provides the essential benchmarks. Theories will be evaluated on their ability to: distinguish manipulation from coercion/persuasion **(1)**, handle truthful manipulation **(2)**, explain bypassing volition **(3)**, cover diverse mechanisms like option-rigging **(4)**, critically assess nudges **(5)**, address unintended algorithmic effects **(6)**, account for emotional/affective leverage **(7)**, and articulate the core wrong **(8)**. The inherent tension lies between defining manipulation by *subverted volition* or by *non-rational mechanisms* **(3 vs 4)**, and the most common fatal flaw in theories is the inability to explain manipulation *without deception* **(2)**.
