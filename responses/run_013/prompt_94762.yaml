  Now, let's break down:

  The crux is: can two rational agents in a symmetric prisoner's dilemma, who know they are both rational and in the same situation, coordinate on the cooperative outcome? This is the idea of superrationality (Hofstadter) or the use of symmetry to select the cooperative equilibrium.

  However, note that the situation is not symmetric because the two men have different utility functions? But Peter argues that the ranking is the same and that's what matters. But the symmetry of the situation is broken by the different stakes? Peter says no, because the rule of superrationality is the same: both should do the same thing, and the better same thing is mutual holding.

  But the problem is that with different stakes, they might not both come to the same conclusion. For example, the man in debt might be more tempted to bolt. So if they both are to use the same rule, what rule? The rule: "do what the other does" is not available because they cannot communicate. The rule: "choose the action that if both do it, yields the best outcome" is the rule of cooperation. But why should they follow that rule? The standard game-theoretic answer is that it is not incentive compatible.

  Moreover, note that even if they are identical in every way, there are two symmetric equilibria: both hold and both bolt. Why should they coordinate on holding? In the absence of communication, it is arbitrary.

  Peter's argument is that they should choose the pattern that yields the better outcome. But the problem is that each individual has an incentive to deviate from that pattern. So if they both plan to hold, then each individually would want to bolt and get 350,000. So the mutual holding is not a Nash equilibrium? Actually, mutual holding is not an equilibrium at all because each player can do better by bolting if the other holds. The only Nash equilibrium is mutual bolting.

  Superrationality, as proposed by Hofstadter, suggests that if the players recognize that they are identical and will therefore do the same thing, then they can choose the action that when both do it, yields the highest payoff. In the prisoner's dilemma, that is mutual cooperation. But this is a controversial position and not accepted by mainstream game theory because it violates the principle of dominance.

  Now, to the moves:

