prompt: |-
  My roommate and I have been argueing for about two months now about Bertrand's paradox and I think we've reached the point where we need to write something down instead of just going in circles. She's in what I'd call the well-posed camp: she thinks "pick a random chord" has a real answer once you apply the right invariance or maximum-ignorance principle, and that the answer is 1/2 — the one you get by picking a random distance from the center — because the space of lines in the plane carries a unique (up to scale) measure invariant under all the rigid motions, whereas the space of chords carries a whole family of rotation-invariant measures, one for every choice of density in the distance-from-center coordinate, so only the ambient symmetry of the plane can break the tie. I'm in the underspecified camp: I think the thing only has an answer relative to a physical procedure (two random rim points, midpoint uniform in the disk, random distance and random angle, whatever), that the invariance move just relabels a choice as a discovery, and that demanding the symmetry group of the whole plane when the problem hands you one specific circle is unmotivated — the circle's own rotations leave the radial density completely free, so they can't be what's picking out 1/2. We're not going to convert each other and I'm tired of the arguement.

  Here's what I want: the joint statement the two of us could actually both put our names to. So, a numbered section of claims we agree on — what the three classic procedures give and why, what's actually true about invariant measures on lines versus on chords, what the paradox does and doesn't show about the principle of indifference and about Bayesianism more generally, and what would count as resolving the problem versus just stipulating an answer. Then the real disagreements, each one written so that the side who holds it would sign off on the wording of its own view rather than a strawman of it. Then the cruxes — the sub-questions where settling things would actually move one of us; I suspect the load-bearing one is which symmetry group is relevant, the setup's or the ambient space's, and the second is whether indifference is a norm that constrains rational credence or just a heuristic for building priors. For each crux I want a case or argument that we'd both agree bears on it, with both of our predictions written down in advance. And please use some probes that aren't the stale three: (i) throw a dart at the plane with a 2D Gaussian centered on the circle's center, resample if it misses the disk, and take the chord whose midpoint is the dart — the answer slides from near 1 down to 1/4 as the variance goes from tiny to huge, which I think is a problem for her and she thinks is a non-event; (ii) say "random line hitting the circle" instead of "random chord" and the invariant measure pins the answer to 1/2 — I say that's a different question, she says that's the question. Format it as a numbered agreed-claims section followed by a disagreements table, and if some of this turns out to be purely verbal, say which part and why.

  And don't just lay out both sides and leave me to pick — I want you to take a definite position. Tell me which crux is actually load-bearing, who you think is right on it, and what would change your mind; if you think one of us is making a straightforward error, say so and say whose.
