answer: |-
  Here is the strongest case I can construct for your position, presented as a sustained argument with its reasoning exposed. I'll defend your core claim, address your specific requirements, mark points of uncertainty, and confront the strongest objection head-on.

  **The Core Argument: Friedman's Instrumentalism Fails at the Load-Bearing Frontier**

  Your distinction between **Idle Falsehoods** (IFs: falsity doesn’t impact predictions in the target domain) and **Load-Bearing Falsehoods** (LBFs: falsity is essential for predictive success) is crucial. Friedman's famous instrumentalism ("The Methodology of Positive Economics") argues that a theory's predictive power is *all* that matters; the "realism" of its assumptions is irrelevant. I argue this holds *only* for IFs and collapses for LBFs, and that most philosophically significant cases are LBFs.

  1.  **Why Friedmanism Works for Idle Falsehoods (IFs):**
      *   IFs are simplifying heuristics or harmless abstractions. They make models tractable, communicable, or computationally feasible *without* distorting their core predictive mechanism for the target domain. Correcting them adds unnecessary complexity without gain.
      *   **Example:** Modeling gas molecules as perfectly elastic billiard balls in ideal gas law predictions (pressure, volume, temperature) *within standard conditions*. Real molecules have internal structure and inelastic collisions, but for predicting PV=nRT, this falsity is *idle*. Modeling quantum wavefunctions wouldn't improve the prediction at this scale; the "false" assumption is a harmless stand-in for "sufficiently small, fast-moving particles undergoing predominantly elastic collisions." Relaxing it (e.g., adding van der Waals forces) only matters outside the target domain (high pressure/low temperature).
      *   **Epistemic Status:** IFs pose no fundamental threat. They are pragmatic tools. Science can rightly ignore their falsity because it doesn't affect the model's truth-tracking ability *for its specified purpose*. Reporting/teaching them as simplifications is sufficient; trust is based solely on predictive performance within scope.

  2.  **Why Friedmanism Fails for Load-Bearing Falsehoods (LBFs):**
      *   LBFs *actively contribute* to generating the correct prediction. Removing or correcting them degrades the model's performance *in its intended domain*. This exposes a dangerous dependency: the model *requires* falsehood to function.
      *   **Example (Avoiding Classics):** **Phlogiston Theory in Combustion Prediction (18th Century).** The assumption that combustible materials contain "phlogiston" released during burning was false. Crucially, it was *load-bearing* for predictions within its domain (e.g., weight loss of burned metals, smothering flames). The model "worked" *because* it incorporated the falsehood: phlogiston's postulated negative weight "explained" the observed weight *loss* of calx (oxide) after burning. Correcting it (recognizing oxygen's role and mass conservation) *initially degraded predictive accuracy* for weight changes – the corrected model predicted weight *gain* upon oxidation, contradicting the (misinterpreted) observations reliant on impure samples. The model's "success" depended on retaining the false assumption. Its predictive power was an artifact of the falsehood interacting with measurement limitations.
      *   **Epistemic Status:** LBFs are epistemic landmines. A science resting on LBFs is fundamentally fragile and untrustworthy. Its predictive success is:
          *   **Coincidental & Contingent:** It works only under specific, often poorly understood, conditions tied to the falsehood. Change the domain slightly, and it fails catastrophically (as phlogiston did when precise weighing became possible).
          *   **Explanatorily Bankrupt:** It offers no true understanding of *why* the phenomenon occurs, masking the real causal structure. The falsehood is doing the explanatory heavy lifting.
          *   **Stifling:** It discourages searching for deeper truths, as the model "works" superficially.
      *   **Reporting/Teaching/Trust:** Models relying on LBFs *must* be reported with severe caveats highlighting the LBF's role. Teaching should emphasize the fragility and the need for replacement. Trust should be extremely limited and provisional, recognizing the success is built on sand. Pretending the assumption's realism doesn't matter is actively misleading.

  3.  **The Sorting Criterion & Defeating the Stubborn Modeler:**
      *   **Criterion:** An assumption is **Load-Bearing** if and only if: **Relaxing/correcting the assumption *in a way that better reflects known reality*, while holding other core model mechanisms constant, leads to a *statistically significant degradation in predictive accuracy* within the model's *original, intended target domain* and under *standard operational conditions*.**
      *   **Resisting the Rejoinder:** The stubborn modeler might claim *any* relaxation "isn't the right way" or "changes the model too much." The criterion counters this by:
          1.  **Requiring Realism-Driven Relaxation:** The correction must be motivated by making the assumption *more realistic* based on established knowledge, not arbitrary tinkering.
          2.  **Holding Core Mechanisms Constant:** The relaxation should be as minimal as possible, targeting *only* the specific false assumption. If the modeler insists relaxing A *requires* also changing B, C, and D, it suggests A might be LBF *within that specific model structure*, but it also highlights the model's pathological dependence on falsehoods. A better model might exist where relaxing A doesn't necessitate such cascading changes.
          3.  **Empirical Test:** It's not up to the modeler's declaration; it's an empirical question. Does prediction *actually* get worse *in the target domain* when the assumption is realistically relaxed? Data decides. If the modeler refuses to test, they forfeit the claim. If they test and predictions degrade, they've confirmed it's LBF. If predictions hold or improve, it was IF.

  4.  **Why Most Interesting Cases are LBFs:**
      *   IFs are typically *obvious* simplifications or abstractions acknowledged upfront (point masses, frictionless planes, infinite populations). They rarely provoke deep philosophical debate.
      *   LBFs are found where models achieve surprising predictive success in complex domains (economics, psychology, ecology, climate sub-models) using assumptions *known* to be radically incomplete or false (rational expectations, fixed preferences ignoring context, equilibrium assumptions in non-equilibrium systems, coarse-grained climate parameters). The *tension* between known falsity and predictive utility is intellectually gripping. The fear is that the success relies on the falsehood compensating for other errors or fitting noise. These are the cases that fuel debates about scientific realism, reductionism, and the limits of modeling. Phlogiston is a historical example; modern equivalents abound in behavioral economics (mis-specified utility functions yielding "good" aggregate predictions) or machine learning ("black box" models relying on patterns correlating with but not reflecting true causality).

  5.  **Confronting the Strongest Objection: LBFs as Unsolved Research Problems**
      *   **Objection:** "Labeling an assumption 'load-bearing' is just admitting ignorance. It's not a property of the assumption but a symptom of the modeler's failure. Every LBF is merely an unsolved research problem; the task is to find a better model where the falsehood becomes idle or is eliminated without predictive loss. Friedman's point is that we should use the predictively successful model *now* while searching for that better model."
      *   **Rebuttal:**
          *   **Epistemic Risk:** This view underestimates the *risk* inherent in relying on LBFs. While research continues, basing policy, investment, or understanding on a model whose success *depends* on a known falsehood is dangerous. The model isn't just incomplete; its core mechanism is corrupted. The next experiment or domain shift could trigger catastrophic failure (e.g., financial models relying on normal distribution assumptions pre-2008). Treating it as merely "provisional" ignores the specific *active harm* its false dependency causes.
          *   **Stifling Effect:** Pragmatically accepting LBFs as "good enough for now" actively discourages the necessary research. If the model "works," why invest the massive effort to rebuild it from less false foundations? Phlogiston persisted precisely because it "worked" within its limited, error-prone context.
          *   **Explanatory Bankruptcy:** The objection focuses on *prediction*. But science also seeks *explanation*. A model with an LBF offers no true explanation, only a predictive algorithm reliant on false premises. Accepting it stalls understanding. Knowing phlogiston was an LBF wasn't just an unsolved problem; it meant the entire explanatory framework was backwards.
          *   **The Criterion Still Holds:** Even if a better model is *possible*, *this specific model, here and now*, relies on the falsehood as load-bearing. The distinction applies to the model as currently constituted. Declaring it "just a research problem" doesn't change the *current* epistemic status and risk profile of the existing model. We should be *more* hesitant to trust and use models identified as relying on LBFs precisely because they mark a dead end or a dangerous path.

  **Points of Uncertainty & What Would Move Me:**

  1.  **The Universality of "Nearly Every Interesting Case":** I find this plausible, but am less certain. Are there significant, deep philosophical debates *truly* centered on IFs? Arguments about idealized gases or frictionless planes seem more pedagogical than deeply philosophical. Debates about consciousness, quantum foundations, or the nature of economic rationality seem intrinsically tied to potential LBFs in our best models. *What would move me:* A compelling example of a major, persistent philosophical debate in science demonstrably centered on an assumption that robustly meets the IF criterion.
  2.  **The Brightness of the Line:** While the criterion is clear in principle, application can be messy. How minimal must the relaxation be? What constitutes "significant" degradation? Domain specificity is crucial. *What would move me:* Concrete cases where applying the criterion leads to ambiguous or counterintuitive results despite careful empirical testing, suggesting the distinction isn't always operationally sharp.
  3.  **The Stifling Effect:** Is the discouragement of research by accepting LBF-laden models as severe as claimed? Some might argue pragmatic use fuels further inquiry. *What would move me:* Historical or sociological studies showing widespread abandonment of research programs aimed at eliminating known LBFs in predictively successful models, specifically *because* those models were deemed "good enough" instrumentally.

  **Conclusion:**

  Your distinction cuts through slogans. Friedman's instrumentalism provides a pragmatic justification for **Idle Falsehoods**: their lack of realism is truly irrelevant to their predictive utility, allowing simplification and focus. However, it provides no defense for **Load-Bearing Falsehoods**. Here, the lack of realism is catastrophic epistemically: the model's success *depends* on falsehood, making it fragile, untrustworthy, and explanatorily empty. The empirical criterion (degradation upon realistic relaxation within the target domain) reliably sorts assumptions, resisting the stubborn modeler by demanding evidence. Epistemically, a science relying on LBFs is in crisis, regardless of superficial predictive success; such models demand severe caveats, should not be taught as foundational, and merit minimal trust. While the search for better models continues, accepting LBFs as merely "unsolved problems" ignores their active perniciousness in corrupting understanding and inviting failure. The most profound challenges in modeling complex systems—where predictive success is hard-won and explanations elusive—almost invariably involve wrestling with Load-Bearing Falsehoods, not harmless idealizations.
