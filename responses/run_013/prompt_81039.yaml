answer: |-
  Your colleague's remark invokes a common aphorism that, while containing a kernel of wisdom, is often misapplied to deflect legitimate scientific scrutiny. Below, I dissect the phrase into distinct, precise theses—graded from trivial to radical—assess their defensibility, and evaluate their implications for both failed replications and original findings. Crucially, we must distinguish **frequentist** and **Bayesian** frameworks, as their handling of "absence of evidence" diverges fundamentally.

  ---

  ### **Key Distinctions & Presuppositions**
  1. **Evidence**:  
     - **Frequentist**: Evidence is binary (significant/non-significant). "Absence of evidence" = failure to reject H₀ (null hypothesis).  
     - **Bayesian**: Evidence is continuous, quantified by the Bayes Factor (BF) or posterior probability. "Absence of evidence" = data insufficiently support either H₁ (alternative) or H₀.  

  2. **Study Power**:  
     Probability (1-β) of detecting an effect *if it exists*. Low power undermines frequentist "non-significance" but informs Bayesian updates.  

  ---

  ### **The Five Theses: From Trivial to Radical**
  #### **Thesis 1: Trivial Epistemic Caution**  
  *"Non-significance alone cannot definitively prove an effect is absent (H₀ true)."*  
  - **Reading**: Rejecting H₁ requires more than one underpowered test.  
  - **Defensible?** Yes, universally.  
  - **Frequentist**: A high p-value (e.g., *p* = 0.30) ≠ evidence for H₀; it may indicate low power.  
  - **Bayesian**: Non-significance with low power may leave BF ≈ 1 (no update toward H₀).  
  - **Dismisses replication?** No. This is a caution, not a dismissal.  
  - **Undermines original?** No. Original findings require independent scrutiny.  

  #### **Thesis 2: Asymmetric Evidence Thresholds**  
  *"Confirming an effect requires less evidence than disproving it."*  
  - **Reading**: Standards for "evidence of absence" (H₀) are stricter than for "evidence of presence" (H₁).  
  - **Defensible?** Contentious.  
  - **Frequentist**: True if power < 50%. High power is needed for "confirming" H₀ (e.g., equivalence testing).  
  - **Bayesian**: Asymmetric priors (favoring H₁) may require stronger data for H₀.  
  - **Dismisses replication?** Only if replication had low power *and* original had high power.  
  - **Undermines original?** Yes, if original study had low power (a common crisis contributor).  

  #### **Thesis 3: Frequentist Equivalence Fallacy**  
  *"Non-significance is never evidence for absence; it is evidentially inert."*  
  - **Reading**: Failure to reject H₀ provides *zero* information about H₀.  
  - **Defensible?** **False** in general, but common in practice.  
  - **Frequentist**: False. A high p-value *with high power* suggests true effect is small (e.g., p > 0.95 and power > 0.95).  
  - **Bayesian**: Actively false. Non-significance *always* updates priors toward H₀ to some degree.  
  - **Dismisses replication?** Illegitimately yes—it ignores power.  
  - **Undermines original?** Cripplingly yes: If non-significance is "evidentially inert", significance is the *only* evidence—ignoring Type I errors.  

  #### **Thesis 4: Radical Evidential Relativism**  
  *"Only positive findings constitute evidence; null results are epistemically vacuous."*  
  - **Reading**: Science progresses solely through confirmation; falsification is impossible.  
  - **Defensible?** **False** and unscientific.  
  - **Frequentist/Bayesian**: Rejected by both. Null results reduce belief in H₁ proportionally to power.  
  - **Dismisses replication?** Yes—but only by dogmatic fiat.  
  - **Undermines original?** No (perversely), but renders science unfalsifiable.  

  #### **Thesis 5: Bayesian Update Mandate**  
  *"Absence of evidence *is* evidence of absence, proportional to power."*  
  - **Reading**: Non-significance *lowers* the probability of H₁, with strength dependent on power.  
  - **Defensible?** **True** under Bayesianism.  
  - **Bayesian**: BF = [P(data|H₀) / P(data|H₁)]. If power is high, P(data|H₁) is high, so non-significant data favors H₀.  
  - **Frequentist**: Incompatible—no direct probability assigned to H₀/H₁.  
  - **Dismisses replication?** No. It *quantifies* evidence for absence. High-power replications strongly support H₀.  
  - **Undermines original?** Only if original ignored its own low power or prior odds.  

  ---

  ### **Which Thesis Licenses Your Colleague's Dismissal?**  
  Your colleague likely invokes **Thesis 3 (Frequentist Equivalence Fallacy)**, treating the failed replication as "evidentially inert" and thus ignorable. This is **indefensible** because:  
  - It ignores the replication's power. If power was high (>80%), non-significance *is* evidence for absence.  
  - It falsely presupposes that only significant results carry weight.  

  Crucially, **this same reading would devastate the original finding**: If non-significance is "not evidence," then the original study's significance (if underpowered) could easily be a Type I error—and no amount of replication could ever challenge it.  

  ---

  ### **Conclusion & Recommendations**  
  - **Platitude vs Substance**: The phrase is platitudinous as a general caution (Thesis 1), but weaponized as Thesis 3 to dismiss replications illegitimately.  
  - **Power is Paramount**: A high-powered failed replication *is* evidence of absence. Dismissing it requires showing the replication was flawed or underpowered.  
  - **Bayesian Clarity**: Adopting Bayesian framing (Thesis 5) forces explicit discussion of priors and power, exposing weak dismissals.  
  - **Colleague's Error**: They commit the fallacy of **ignoring the power of the test**. Remind them that "absence of evidence *where evidence should exist* **is** evidence of absence."  

  In short: Your colleague's dismissal holds only if the replication was underpowered—a claim they must substantiate, not assume. Otherwise, the replication *does* shift the burden of proof back onto the original effect. The aphorism, while catchy, is no substitute for quantitative evidence assessment.
