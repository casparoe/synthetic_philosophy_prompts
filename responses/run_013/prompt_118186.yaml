  I should also consider the user's identity. They might be a resident affected by these policies, possibly someone interested in urban planning or social justice. Their need isn't just theoretical; they want to understand how to advocate for change. The deeper need is to find a coherent framework to challenge the status quo and promote inclusive housing policies.

