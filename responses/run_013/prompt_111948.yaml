prompt: |-
  Bit of a weird one, hope this is the right place for it. I run a small catering thing with a mate of mine and we're always having to split stuff between us — money, shifts, who gets the van on the weekend — and I've realised I keep judging whether a split is fair by one particular rule that I've never seen written down anywhere. I want to know if it's a real idea with a name, or just something I invented in the van.

  Here's the rule. Work out the best each of us could possibly get — the deal that's best for me if we completely ignore what's good for him, and the deal that's best for him if we ignore me. Work out the worst each of us would put up with. Then pick the deal where we've each travelled the same *fraction* of the way from our own worst to our own best. So if the very best I could walk away with is £200 and the very best he could walk away with is £5,000, and every deal trades one against the other, my rule says find the deal where I've got half of my 200 and he's got half of his 5,000 — so £100 for me, £2,500 for him. Massively unequal in money, and my gut still says that's the fair one and that splitting things down the middle is the wrong instinct. I couldn't defend that to you if you pushed me though.

  Four things I get stuck on:

  The "best I could possibly get" is a deal where he rolls over and hands me everything. It's not on the table, nobody would ever offer it, so I'm measuring myself against something that can't happen and then taking wherever the line to that impossible point hits the edge of what's actually possible. Is that how it's meant to work? Feels like cheating.

  My mate did a bit of economics and reckons the actual textbook answer is to pick the deal that makes the *product* of our two gains as big as possible, and that when you're just splitting a pot of cash it comes out as half each anyway. Fine, but then why do the two rules agree in the easy case and disagree as soon as we're dividing different sorts of things — he wants the Saturday off, I want the cash?

  Who says it's half, anyway? If we agreed on 60/40 of our own maximums, is that still the same idea or a different one with a different name?

  And there's three of us sometimes, and then my rule just dies, because there's no single deal where all three of us get our maximum at once so I can't even draw the line. Does the whole idea only work for two people, or is there a version that survives three?

  One more: if he's got another job offer and can just walk, I've been treating that as his "worst he'd put up with". Is that right, or is the walk-away a separate thing?

  What I'm after is not a label I can drop in conversation — I want to know exactly what my rule is, which of the things that do have names it's closest to, how it's different from each of those, and precisely where it stops working. If it turns out nobody's named it, tell me that and name it yourself, but I'd rather have the carving than the name.
reasoning: |-
  Okay, the user runs a small catering business with a friend and they constantly need to split things like money, shifts, and van usage. They've developed their own fairness rule: for each person, calculate the best possible outcome (ignoring the other) and the worst they'd accept. Then find the deal where both get the same fraction of the way from their worst to best. For example, if the user's best is £200 and their friend's best is £5000, the "fair" split would be £100 for the user and £2500 for the friend. 

  The user has several questions. First, is it valid to use an unrealistic "best case" as a reference point? They feel like it might be cheating since that ideal scenario isn't achievable. Second, their friend mentions the Nash Bargaining Solution from economics, which maximizes the product of gains and typically results in equal splits for symmetric cases. But why do these methods diverge when dividing non-monetary things like shifts? 

  Third, why use a 50% fraction? Could other fractions like 60/40 work? Fourth, how does this rule handle three people? The current method seems to break down with more than two. Finally, they question whether the "worst acceptable" point should be the walk-away option (like another job offer) or something else.

  Looking deeper, the user isn't just seeking a term for their rule. They want a thorough understanding of its mechanics, how it compares to established concepts, its limitations, and whether it holds up theoretically. They might be trying to validate their intuitive approach to fairness in their business partnership, ensuring their method is logically sound rather than arbitrary. There's also a practical need: applying this to real-life negotiations with varying stakes and multiple participants.

  The user's rule resembles the Kalai-Smorodinsky Bargaining Solution (KSBS), which uses ideal points and equal proportional concessions. KSBS addresses the criticism of unrealistic ideal points by focusing on the feasible set's bounds. Unlike Nash, which prioritizes joint gains, KSBS emphasizes balanced sacrifices relative to potential. This explains why their rule gives unequal monetary splits but feels fair—it accounts for differing opportunities.

  For the fraction question, KSBS inherently uses 50%, but in asymmetric scenarios (like differing bargaining powers), different ratios could apply. However, that's not standard in KSBS. The three-person issue is a real limitation; KSBS requires a utopian point that's often unattainable with multiple parties, leading to complications. The walk-away point is indeed the disagreement point in bargaining theory, correctly serving as the "worst acceptable" baseline.

  Key differences from Nash: Nash maximizes the product of gains and assumes symmetry, leading to equal splits when possible. KSBS equalizes relative gains, which can result in asymmetric outcomes if potentials differ. The user's intuition highlights that fairness isn't just about equal amounts but equitable sacrifice, especially when partners have different alternatives.

  In conclusion, the user's method is a real concept (KSBS), effective for two parties with clear ideal/disagreement points. It breaks down with three people due to feasibility constraints. For their business, KSBS justifies their approach, though they should recognize its limitations in group settings. They might explore hybrid models or other solutions for multi-party splits.
answer: |-
  Your "fraction of the way from worst to best" rule is **absolutely a real concept in bargaining theory**, called the **Kalai-Smorodinsky Bargaining Solution (KSBS)**. You've independently discovered a significant alternative to the classic Nash solution your mate mentioned. Let's break it down precisely:

  1.  **The Core Idea (Kalai-Smorodinsky):**
      *   **Disagreement Point (d):** This is the "worst you'd put up with." It's the outcome if you *fail* to reach a deal. For you, it's likely £0 and no van access. For your mate, it's walking away to that other job. **You are 100% correct to treat this as the baseline.** It's crucial.
      *   **Ideal Point (u*):** This is the "best you could possibly get." It *is* hypothetical and often unattainable. For you (£200), it assumes your mate accepts £0. For him (£5000), it assumes you accept £0. It defines the *outer limit* of what's *conceivably possible* for each individually within the negotiation space.
      *   **The KSBS Solution:** The fair point is where the line connecting the Disagreement Point (d) to the Ideal Point (u*) intersects the *Pareto Frontier* (the set of deals where one can't gain without the other losing). This point **equalizes the ratio of gains for each player relative to their maximum potential gain** from the disagreement point. Mathematically: Find the point (x, y) on the frontier where:
          `(x - d_x) / (u*_x - d_x) = (y - d_y) / (u*_y - d_y)`
          In your example: `(My Cash - 0) / (200 - 0) = (His Cash - 0) / (5000 - 0) = k`. Solving for k=0.5 gives £100 and £2500.

  2.  **Addressing Your Sticking Points:**

      *   **The "Impossible" Ideal Point:** This is **fundamental to KSBS and *not* cheating.** The ideal point defines the *scale* of potential improvement for each player from the disagreement point. KSBS argues fairness means both players make an *equal proportional sacrifice* relative to their *individual maximum potential*, not relative to each other's absolute gains. It anchors fairness in the *opportunity cost* each player faces. Your gut feeling that £100/£2500 is fairer than £1025/£1025 stems from recognizing that your mate has vastly more *potential* gain on the table (£5000) than you do (£200). Equal sacrifice *relative to potential* feels fairer than equal absolute gains when potentials differ wildly. KSBS formalizes this intuition.
      *   **vs. Nash Bargaining Solution (NBS - your mate's "product" rule):**
          *   **NBS:** Maximizes `(My Gain) * (His Gain)`, where "Gain" is improvement over the Disagreement Point. For splitting a fixed sum (e.g., £1000) with d=(0,0), NBS gives (£500, £500). It focuses on *joint efficiency* and Pareto optimality.
          *   **Agreement in Easy Cases:** When the bargaining space is symmetric (like splitting pure cash with equal bargaining power) *and* the ideal point is symmetric (u*_x = u*_y), KSBS and NBS **coincide** at the equal split. Both rules see the situation as perfectly balanced.
          *   **Divergence with Different "Goods":** This is where KSBS shines and differs crucially from NBS. When players value different things (cash vs. Saturday off), their *ideal points* become **asymmetric** (u*_x ≠ u*_y). NBS still seeks the point maximizing the *product* of absolute gains. KSBS seeks the point equalizing the *proportion* of maximum potential gain achieved. **Your rule (KSBS) directly incorporates the differing scales of what's possible for each player.** NBS does not explicitly consider the upper bounds defined by the other player's minimum requirements. In your cash/Saturday example, KSBS would likely give you more cash and him more Saturdays off *relative to their respective maximum potentials* for those items, whereas NBS would find a trade-off maximizing the joint product of utilities (which depends heavily on how utility is measured for Saturdays off vs. cash).
      *   **Why 50%? (Monotonicity & Symmetry):** The 50% fraction arises directly from the requirement of **equal proportional concessions**. KSBS satisfies an axiom called **Individual Monotonicity:** If the feasible set expands in a way that improves one player's maximum potential gain (u*), that player shouldn't end up *worse off*. The equal proportion (`k`) is determined by where the line hits the Pareto frontier. If you arbitrarily picked 60/40, you'd violate core axioms of bargaining solutions (like Pareto efficiency or symmetry). However, KSBS can be generalized to asymmetric cases where players have different "bargaining powers," leading to *different* target fractions (e.g., 60/40 instead of 50/50). This is sometimes called the **Weighted Kalai-Smorodinsky Solution**, where weights represent relative power. Your basic rule assumes symmetric power/entitlement.
      *   **The Three-Person Problem:** **This is a major weakness of KSBS.** The core idea relies on defining a single "Utopian Point" (u*) where *all* players simultaneously get their individual maximums. With three or more players, this Utopian Point is almost always **outside** the feasible set of possible deals. The line connecting d to u* may not intersect the Pareto frontier in a way that satisfies the equal proportion condition for all three simultaneously. Extending KSBS to n>2 players is mathematically messy and less satisfying. Concepts like the Nash solution or other cooperative game theory solutions (Shapley value) often handle multiple players more robustly. **Your rule fundamentally struggles beyond two players.**
      *   **Walk-Away as Worst Case:** **You are exactly right.** The Disagreement Point (d) **is** the outcome if negotiations fail. Your mate's alternative job offer defines his best option outside the deal with you – that's his disagreement payoff. This is standard in all bargaining theory.

  3.  **Precisely What Your Rule Is & Where It Stops Working:**
      *   **What it is:** The **Kalai-Smorodinsky Bargaining Solution (KSBS)** for two players with symmetric bargaining power/entitlement.
      *   **Core Differences:**
          *   **vs. Nash (NBS):** KSBS prioritizes **equal proportional sacrifice relative to individual potential** (`(gain/max_gain)` equal). NBS prioritizes **maximizing the joint product of absolute gains** (`(my_gain * his_gain)` max). KSBS cares about the *scale* of what's possible for each; NBS cares about the efficient *trade-off*.
          *   **vs. Equal Split:** KSBS justifies unequal absolute outcomes when players have vastly different maximum potentials or value different goods differently. Equal split ignores differing opportunity costs and scales of potential gain.
          *   **vs. "Split the Difference":** KSBS uses the *ideal point* as the upper bound, not the other player's actual offer or some midpoint. It's anchored in potential, not just the current negotiation range.
      *   **Where it Stops Working:**
          *   **More than Two Players:** Defining the Utopian Point and finding a point satisfying equal proportions for all becomes problematic or impossible.
          *   **Non-Convex Feasible Sets:** If the set of possible deals has "holes" or irregular shapes, the KSBS line might not intersect the Pareto frontier cleanly or uniquely.
          *   **Defining Utilities:** KSBS (like NBS) assumes you can quantify "gain" (utility) on a consistent scale. How much is a Saturday off "worth" in cash? This can be subjective and difficult. Your rule implicitly assumes you can compare the fractions `(My Cash / 200)` and `(His Cash / 5000)` meaningfully.
          *   **Asymmetric Bargaining Power:** Basic KSBS assumes symmetry. If one player inherently has more power (e.g., owns the van), the weighted version is needed.
          *   **Ignoring Joint Gains:** KSBS doesn't *directly* maximize the total pie, only the proportions. If there's a deal that makes both players much better off in absolute terms but at slightly different proportions, KSBS might not find it. (NBS would).

  **Conclusion:** Your van-born intuition has a solid theoretical foundation: the **Kalai-Smorodinsky Bargaining Solution**. It's a powerful concept for two-player negotiations where fairness is viewed as equal *relative sacrifice* compared to individual potential, especially when players value different things or have vastly different opportunity scales. It explains why £100/£2500 feels fairer than £1025/£1025 in your scenario – you've both sacrificed the same *proportion* of your potential maximum gain (50%). It breaks down with three or more people and requires careful consideration of how to measure "gain" for non-monetary items. For your catering partnership, it's a remarkably sophisticated and justified approach to fairness. When your mate mentions Nash, tell him you're running a Kalai-Smorodinsky shop – it prioritizes proportional fairness over pure efficiency.
