  and two smaller things while you're at it. if the hinge is one century inside the maybe hundred thousand years a civilisation could last, then picking a year at random i should basically never land on it, and every generation has been sure it was the climax of history, so it being obvious from the inside isnt evidence. and: if now is the hinge then everything i do is astronomically consequential, which means i can never act, because i cant compute the effects of anything. your view makes action impossible and its the same belief every apocolyptic cult has had. so give me the leverage argument, deal with the base rate, and tell me how you avoid the paralysis. definite answers please, not a hedge.
