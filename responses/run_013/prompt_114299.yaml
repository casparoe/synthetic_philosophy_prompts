prompt: |-
  I chair the investment committee of a mid-sized private foundation, and at our March meeting we must approve the next three-year asset allocation. Our models put two candidates at the same expected return: a duration-matched bond ladder whose return distribution we have estimated from sixty years of data, and an infrastructure fund whose returns depend on a regulatory regime that has existed for four years, where our consultants' models disagree by more than the entire expected return and no two of them share a prior. Several members have noticed that we drift to the first option whenever the numbers tie, and one of them now calls this our Ellsberg problem: she says we are the person refusing the ambiguous urn, and that whatever makes the paradox a paradox makes our reluctance a bias to be overridden rather than a judgment to be respected. Another member answers that the foundation's 4.5% payout rule and its inability to raise new gifts after a bad decade make a bad outcome for the second fund asymmetric with a good one, so treating the two as interchangeable in expectation is the real error.

  Please draft the short written opinion I will circulate before the vote. It should recommend a concrete allocation with a time frame, take a clear position on whether our caution is a bias or a defensible response to ambiguity, and state honestly the strongest consideration against whichever side you come down on.
reasoning: |-
  Okay, let me break this down. The user chairs an investment committee facing a classic ambiguity aversion scenario wrapped in institutional constraints. The core tension is between a stable bond ladder with robust historical data and a novel infrastructure fund with extreme modeling uncertainty. 

  First, I need to recognize the layers here: the Ellsberg paradox framing suggests behavioral economics is relevant, but the foundation's payout rule and fundraising constraints introduce real-world stakes that might validate caution. The "unable to raise new gifts after a bad decade" point is crucial - it implies the foundation has asymmetric downside risk that theoretical models often ignore.

  Hmm... the consultants' disagreement is alarming. When models diverge by more than the expected return and lack shared priors, it signals fundamental uncertainty about the regulatory regime. Four years of data is practically nothing for infrastructure, which often has 20+ year asset lives. 

  I should emphasize that this isn't just psychological aversion; the payout rule creates a mathematical imperative to avoid left-tail outcomes. A 4.5% annual payout means the foundation is essentially eating its seed corn if returns dip below that threshold for extended periods. The bond ladder's predictability becomes a structural hedge.

  But I must honestly engage the counterargument: foundations do need growth, and infrastructure could provide inflation protection and diversification. The strongest pro-fund point is that avoiding all ambiguity might condemn them to perpetually diminishing real returns. 

  For the recommendation, a 3-year horizon makes sense - it aligns with their allocation cycle and allows time for the regulatory environment to mature. The 0% allocation to the infrastructure fund might seem extreme, but with such profound uncertainty, preserving optionality is rational. Later, when the regulatory dust settles...

  The tone needs to balance intellectual rigor with decisiveness. No hedging - they need a clear call. And acknowledging the growth trade-off upfront will make the recommendation more credible.
answer: |-
  ## Pre-Vote Committee Opinion: Asset Allocation Recommendation

  **To:** Investment Committee Members  
  **From:** Chair, Investment Committee  
  **Subject:** Recommended Three-Year Asset Allocation & Analysis of Ambiguity  

  After careful consideration of our models, consultant reports, and the compelling arguments raised regarding ambiguity and risk asymmetry, I recommend we adopt the following allocation for the next three years (March 202X - March 202Y):

  *   **Duration-Matched Bond Ladder:** 100% of the allocation under consideration.
  *   **Ambiguous Infrastructure Fund:** 0%.

  **This allocation represents a defensible response to ambiguity, not a cognitive bias to be overridden.** While the Ellsberg paradox highlights a common aversion to unknown probabilities, our foundation faces concrete, asymmetric consequences that validate extreme caution here. The core arguments are:

  1.  **Asymmetric Downside Risk:** Our 4.5% payout obligation is non-negotiable. A severe underperformance or capital impairment from the infrastructure fund, driven by unresolved regulatory uncertainty, could force us to sell assets at depressed values to meet payouts, potentially triggering a destructive cycle. The bond ladder provides reliable cash flows precisely matched to our liabilities, mitigating this existential risk. A "good outcome" for the fund cannot compensate for the existential threat of a "bad outcome" given our payout constraints and inability to replenish capital easily.
  2.  **Profound & Unresolvable Ambiguity:** This exceeds typical Ellsberg "unknown probabilities." Four years of regulatory history is insufficient for modeling long-duration infrastructure assets. Consultant models disagreeing *by more than the entire expected return*, with no shared priors, signals a near-total lack of credible information. This isn't just ambiguity about red vs. black balls; it's ambiguity about the fundamental physics governing the urn.
  3.  **Fiduciary Prudence:** Our duty demands prioritizing capital preservation and reliable payout coverage, especially when faced with unquantifiable tail risks. The bond ladder, backed by 60 years of data, offers quantifiable risk. The infrastructure fund does not.

  **Strongest Consideration Against This Recommendation (Growth & Opportunity Cost):** The most compelling argument *for* the infrastructure fund is the potential for higher-than-expected returns or valuable portfolio diversification that could significantly enhance the foundation's long-term capacity. By choosing certainty, we explicitly forgo this potential upside and accept the risk that inflation or low bond returns may gradually erode the foundation's real value over the very long term. Avoiding ambiguity may condemn us to reliably meeting, but never exceeding, minimal return targets, potentially limiting our future impact.

  **Recommendation & Timeframe:** We commit to the **100% Bond Ladder** allocation for the **next three years**. This timeframe acknowledges the need for stability while allowing the regulatory environment surrounding infrastructure investments more time to mature and generate meaningful track records. We direct our consultants to provide a deep-dive analysis of evolving infrastructure regulations and fund performance at the 18-month mark, informing our *next* three-year allocation decision. This approach prioritizes our fiduciary duty to safeguard the foundation's core mission funding capability today, while leaving the door open to potentially embracing more ambiguity once the actual risks become less opaque.

  **Vote:** I will move this recommendation (100% Bond Ladder for 3 years) for formal approval at our March meeting. Please come prepared to discuss.
