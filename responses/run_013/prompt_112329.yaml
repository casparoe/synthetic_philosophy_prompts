prompt: |-
  ok so I'm in the middle of a dissertation chapter on hinge epistemology and I've hit a wall, so what I want is the spec, not another reading. What does an adequate theory of hinge commitments have to deliver? Not a summary of the debate -- the requirements list. The stuff that isn't known and isn't doubted but also isn't just arbitrary: which cases does the theory have to get right, which distinctions can't it collapse (hinge vs. ordinary belief, hinge vs. mere presupposition or habit, holding a hinge vs. just acting on it), which results can't it contradict (that inquiry still gets going, that hinges aren't simply arbitrary, that we can criticize at least some of them), and for each requirement, the case or consideration that puts it on the list. Don't cite anybody, I know who's who.

  Two things I want in the list because they're whats bugging me. One, hinges get lost, not just revised -- someone's whole framework for a domain can come apart, and I don't think a theory should be allowed to wave that off as ordinary belief revision or as a mysterious conversion. Two, some hinges look engineered: an institution, a market, or a profession can install a presupposition that then does hinge-work for everyone inside it (I've been calling these engineered hinges for lack of a better phrase). If a theory only handles the homey cases and can't say anything about those without collapsing into the claim that all hinges are social or into relativism, that's a failure, and I want it written down as a requirement.

  Then tell me which requirements are non-negotiable and which are just preferences of one camp, and which pairs I can't have together -- my suspicion is that whatever makes hinges groundless without being arbitrary fights with whatever lets them be criticized, and I'd like to know whether that's a real tension or my own confusion. Skip the scorecard, I'll do that part myself. American English please.
