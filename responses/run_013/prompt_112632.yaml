prompt: |-
  I've been going round in circles with my flatmate about how much we actually owe strangers, and before I tie myself in knots I want to work out what I really think. So here are my gut verdicts on a pile of rescue cases, and I'd like you to tell me what principle — or small set of principles — they add up to, which verdicts I'd have to give up to get a tidy one, and what it says about a couple of cases I've not listed.

  The ones I'm sure about. I'm walking past a shallow pond and a small child is drowning, I'm the only one about, wading in ruins my suit: I have to wade in, no question. The same child is drowning in a pond three miles off, and getting there in time means definately missing my sister's wedding: I still have to go. I get a letter saying thirty quid will save a particular named child I'll never meet from a disease that would otherwise certainly kill them: I have to send it. Thirty quid buys that same named child only a five per cent chance of pulling through: I think I still have to send it, though it feels thinner. Thirty quid is my last thirty quid and sending it means skipping dinner: still have to send it, I think.

  The ones where it flips. Thirty quid goes to a programme that will on average save one life somewhere among ten thousand children but saves no one in particular: I dont think I'm obliged to send it — and that bothers me, because it's the same expected life either way. The thirty quid is the money I'd earmarked for my own daughter's swimming lessons: I think I may spend it on her instead. I'd have to give thirty quid every single day for the rest of my life, one child after another: I don't think I'm obliged to, even though every individual gift is exactly the sort I said I had to make. And if the only way to save the pond child is to use the last dose of an antidote that another child elsewhere will then die without, I don't think I have to save the first child that way.

  The pair I can't get to sit still is the letter case (must send) and the ten-thousand-children case (needn't send), which look like the same number of expected lives. And there's a case I keep chewing on: I manage a small fund for my employer, and I could quietly divert thirty quid of it to save one of these distant children — but the money isn't mine to give, and I think I mustn't, even though the cost to me is nil and the child is every bit as real as the one in the pond. What principle, if any, gets the verdicts I'm sure about, forces me to drop at least one of the ones that flip, and tells me what to do with the fund case and with one more I've not worked out — where I can save the distant named child only by breaking a promise I made to my dying mother, and keeping that promise will cost the child their life?
reasoning: |-
  Okay, the user is wrestling with ethical dilemmas about obligations to help others, particularly in rescue scenarios with varying costs and contexts. They've laid out clear intuitive judgments about when they feel compelled to act versus when they don't, and they're seeking an underlying principle that explains these judgments consistently. The core tension is between their strong intuition to save a specific, identifiable child (even at high personal cost) versus their reluctance when help is statistical, involves trade-offs with personal commitments, or becomes overwhelming.

  Hmm, their examples reveal several psychological and ethical boundaries. The identifiable victim effect is prominent - they feel intense obligation toward concrete individuals (drowning child, named sick child) but detachment from statistical lives. They also intuitively recognize personal stakes: obligations diminish when their own resources or loved ones are involved (daughter's swimming lessons), or when sacrifices become unsustainable (daily lifelong donations). The "flipped" cases further introduce competing duties (promises, fiduciary responsibility) and tragic choices (antidote rationing).

  What's fascinating is their discomfort with the inconsistency between the letter case (must save one named child) and charity case (needn't save 1/10,000th of a life statistically), despite identical expected utility. This suggests their moral psychology isn't purely utilitarian - proximity, specificity, and relational duties matter deeply. Their unresolved cases (employer funds, broken promise) amplify this tension between impartial altruism and personal integrity.

  I should synthesize principles that honor their intuitions without forcing artificial consistency. The agent-centered prerogative (Scheffler) seems relevant - allowing space for personal projects without full self-sacrifice. Threshold deontology might also help: absolute duties up to a point of "unreasonable" cost. Their fund manager case clearly needs fiduciary duty as a moral "firewall," while the promise dilemma pits two sacred values against each other - perhaps requiring acknowledgment of unresolvable tragedy rather than neat principles.

  Notably, they're not just seeking theory but practical coherence to resolve flatmate debates. Their language ("tie myself in knots," "can't get to sit still") reveals frustration with cognitive dissonance. The employer funds case suggests professional ethics concerns, while the broken promise scenario touches on familial piety. A robust response should validate their nuanced intuitions while offering frameworks to navigate gray areas without demanding absolute consistency.
answer: |-
  Based on your intuitive verdicts, your core principle seems to be a blend of **Strong Agent-Relative Obligations combined with a Threshold of Sacrifice and a Rejection of Pure Aggregation**, specifically:

  1.  **Strong Obligation to Rescue Identifiable Individuals:** You feel a very strong, almost absolute duty to save a specific, identifiable individual facing imminent, severe harm when you can do so at a cost you deem "moderate" or "reasonable."
  2.  **Agent-Relative Sacrifice Threshold:** This duty weakens or disappears when the cost to you (or your close dependents) becomes "excessive" relative to your own life projects, commitments, and relationships. This threshold isn't purely financial but includes significant personal costs (missing a sister's wedding, lifelong daily sacrifice, compromising core duties like parenting).
  3.  **Rejection of Pure Statistical Aggregation:** You feel significantly less (or no) obligation when the beneficiary is statistical ("1/10,000th of a life saved") rather than an identifiable individual, even if the *expected* outcome is the same. Personal connection/identifiability matters profoundly.
  4.  **Respect for Prior Commitments & Roles:** Obligations arising from specific roles (parent, employee, promise-keeper) or prior commitments (to your daughter, your mother, your employer) can override the general duty to aid distant strangers, even when the cost *to you* is otherwise low.

  **How Your Verdicts Map to the Principles:**

  *   **Pond Child (Shallow & Distant):** (1) Identifiable individual, severe imminent harm. Cost (ruined suit, missing wedding) doesn't exceed your sacrifice threshold. **Must Save.**
  *   **Letter - Named Child (Certain/Small Chance/Last £30):** (1) Identifiable individual, severe harm. Costs (money, skipped dinner) don't exceed threshold. **Must Send.**
  *   **Charity - Statistical Lives:** (3) Lack of identifiability significantly weakens the pull of (1). **Not Obliged.**
  *   **Daughter's Swimming Lessons:** (2) Cost to identifiable close dependent (daughter) outweighs the obligation to a distant stranger. (4) Prior parental commitment reinforces this. **May Spend on Daughter.**
  *   **Daily Lifelong Donation:** (2) Cumulative cost becomes "excessive," exceeding your sacrifice threshold and destroying personal life projects. **Not Obliged.**
  *   **Antidote Trade-Off:** (1) Pulls both ways for identifiable individuals. (2) The cost (actively causing the death of another identifiable child) is morally excessive/intolerable, exceeding the sacrifice threshold. (4) A duty not to actively harm might also be felt here. **Not Obliged to save the first child that way.**
  *   **Fund Manager:** (4) The duty arising from your role (fiduciary responsibility to employer) overrides the general duty to aid. The money isn't yours; giving it violates a specific commitment. **Must Not Divert.**
  *   **Promise to Dying Mother:** (4) The sacred duty arising from a specific, profound personal promise overrides the general duty to aid a distant stranger. **May Keep Promise (costing the child).**

  **The Inconsistency You've Spotted & What You'd Need to Drop:**

  *   **The Core Tension:** Your verdicts on the **Letter (Named Child - Must Send)** and the **Charity (Statistical Lives - Needn't Send)** are inconsistent if the *only* moral factor is the *expected number of lives saved*. Both have the same expected utility (1 life).
  *   **To Achieve Consistency, You'd Need to Drop:**
      *   **Either:** Your verdict on the Charity case. If expected lives saved is paramount, you *should* feel obliged to send the £30 to the effective charity (saving 1/10,000th of a life is morally equivalent to saving 1 life with certainty, *if* aggregation is accepted).
      *   **Or:** Your verdict on the Letter case. If identifiability *doesn't* create a special obligation, then saving the named child with £30 isn't fundamentally different from contributing to the charity saving a statistical life. Both would be optional or both obligatory based on expected outcome and cost.

  **Your principles explicitly reject pure aggregation and give immense weight to identifiability (Principle 3).** This explains the different verdicts *for you*, but it means you accept that saving an identifiable life feels categorically different/more obligatory than saving a statistical life, even with the same expected outcome. This is psychologically common ("identifiable victim effect") but controversial in strict consequentialist ethics.

  **Applying the Principles to Your Unresolved Cases:**

  1.  **Fund Manager Case:** As stated above, Principle 4 (**Respect for Prior Commitments & Roles**) clearly applies. The money isn't yours; diverting it breaches your fiduciary duty to your employer and constitutes theft. The cost *to you* might be nil, but the *act itself* violates a specific obligation arising from your role. **Verdict: Must Not Divert.** (Matches your intuition).
  2.  **Broken Promise Case:** Principle 4 (**Respect for Prior Commitments & Roles**) is paramount here. The promise to your dying mother creates a profound, specific, agent-relative obligation. Keeping this promise is a core personal commitment that falls within your sacrifice threshold for *maintaining personal integrity and honoring sacred bonds*, even though the cost is the life of a distant child. The distant child, while identifiable, doesn't trigger an obligation strong enough to override this specific, deeply personal prior commitment. **Verdict: You are not obliged to break the promise to save the child. You may keep the promise.** (This aligns with your intuition in the daughter's swimming lesson case and the fund manager case, prioritizing specific commitments).

  **In Summary:** Your moral intuition operates with **strong agent-relative duties focused on identifiable individuals facing severe harm, constrained by a threshold of personal sacrifice and overridden by specific prior commitments or role-based obligations, while rejecting the moral equivalence of statistical and identifiable lives.** To achieve consistency with pure consequentialism (expected utility maximization), you would need to abandon either your verdict on the identifiable child in the letter case or your verdict on the statistical charity case, which you are understandably reluctant to do. Your principles provide a coherent (though not purely utilitarian) explanation for all your stated intuitions, including the unresolved cases.
