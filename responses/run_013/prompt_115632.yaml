  ### **Predictable Problems & Solutions**
  1. **Problem**: Teams sneak cross-indexing into cards (e.g., "if A0, check Bob’s setting").  
     - **Solution**: Referee checks cards before sealing. **Debrief moment**: Highlight how this violates locality.  

  2. **Problem**: Teams fixate on perfecting one card, missing enumeration.  
     - **Solution**: Hard time limits; early finishers design a card achieving S=2 or run extra rounds.  

  3. **Problem**: Students protest quantum box is "cheating."  
     - **Solution**: Pre-generate quantum data with a transparent method (e.g., Python using \(P(\text{agree}) = \sin^2(\Delta\theta/2)\)). **Debrief moment**: Emphasize QM is a *statistical model*, not LHV.  

  4. **Sample Size**:  
     - **20 rounds/team**: Correlations stabilize within ±0.3 (enough to see S ≤ 2).  
     - **Quantum box (50+ rounds)**: Ensures S ≈ 2.83 ± 0.2.  

  ---

  ### **Quantum Box Implementation**
  **Python Script** (Run from laptop):  
  ```python
  import numpy as np

  # Settings: A0=0°, A1=90°, B0=45°, B1=135°
  angles = {'A0':0, 'A1':90, 'B0':45, 'B1':135}

  def quantum_outcome(a, b):
      """Returns Alice and Bob outcomes (±1) for settings a, b."""
      theta = np.radians(angles[a] - angles[b])
      P_agree = np.sin(theta/2)**2  # P(Alice = Bob)
      rand = np.random.uniform()
      # +1/-1 with 50% marginal each
      if rand < 0.5:
          alice = 1
      else:
          alice = -1
      # Agree with probability P_agree
      if rand < P_agree:
          bob = alice
      else:
          bob = -alice
      return alice, bob

  # Generate 50 pairs
  data = []
  for _ in range(50):
      a_setting = np.random.choice(['A0','A1'])
      b_setting = np.random.choice(['B0','B1'])
      a_out, b_out = quantum_outcome(a_setting, b_setting)
      data.append([a_setting, b_setting, a_out, b_out, a_out*b_out])
  ```

