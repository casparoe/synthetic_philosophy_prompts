  ### **Summary of Key Deliverables**
  - **Activity Flow**: Device building → Testing → Enumeration → Quantum demo → Debrief.  
  - **CHSH Convention**: \(S = E(A0,B0) - E(A0,B1) + E(A1,B0) + E(A1,B1)\) (LHV: |S| ≤ 2; QM: S = 2√2).  
  - **Enforcement**: Referees, sealed envelopes, time boxing.  
  - **Outcomes**: Students *discover* the LHV ceiling (S≤2) before seeing quantum violation.  

  This plan ensures students confront Bell's theorem "from the inside," separates locality assumptions, and candidly addresses what the activity can/cannot prove.
