  Below is a comprehensive, runnable activity plan for teaching Bell's theorem in a 90-minute undergraduate session. It emphasizes hands-on discovery, requires no special equipment, and addresses your pedagogical goals, including explicit handling of assumptions and limitations.

  ---

  ### **Activity: Bell's Card Challenge**
  **Objective**: Students discover that pre-agreed instructions ("local hidden variables") cannot reproduce quantum correlations, exposing a fundamental limit (Bell's inequality) through hands-on experimentation.

  **Concepts Covered**: Local hidden variables, CHSH inequality, quantum nonlocality vs. locality assumptions, limitations of Bell tests.

  **Materials per Team**:
  - 2 blank index cards (Alice/Bob instruction cards).
  - 2 envelopes.
  - 1 coin (for randomization).
  - 1 scoring sheet (template below).
  - Pens.

  **Team Structure**: 10 teams of 2 students each (20 students total). Each team builds one "device" (Alice/Bob pair).  
  **Time**: 90 minutes total.

  ---

  ### **Rules & Instructions**
  #### **Phase 1: Build Devices (15 min)**
  1. **Sealed Instructions**:  
     - Each team writes instructions for Alice and Bob on separate cards:  
       - **Alice's card**: Outcomes for settings **A0** and **A1** (each ±1).  
         *Example: "A0: +1, A1: -1"*.  
       - **Bob's card**: Outcomes for settings **B0** and **B1** (each ±1).  
       - **No cross-indexing**: Alice’s card *cannot* mention B0/B1, and vice versa.  
     - Seal cards in envelopes. *Enforcement*: Referee (instructor) checks cards before sealing.  

  2. **Key Constraints**:  
     - Outcomes must be predetermined (±1) for all settings.  
     - Settings are chosen *after* sealing.  
     - No communication between Alice/Bob during testing.  

  #### **Phase 2: Test Devices (25 min)**
  1. **Run 20 Rounds**:  
     - Each round: Randomly choose **one** Alice setting (A0/A1) and **one** Bob setting (B0/B1) using a coin flip:  
       - Heads = A0/B0, Tails = A1/B1.  
     - Open envelopes, read outcomes for the chosen settings.  
     - Record on scoring sheet:  
       | Round | Alice Setting | Bob Setting | Alice Outcome | Bob Outcome | Product (A×B) |  
       |-------|---------------|-------------|---------------|-------------|---------------|  

  2. **Compute Correlations**:  
     - After 20 rounds, calculate four **correlations** (E):  
       - E(A0,B0) = Avg. product when settings = (A0,B0).  
       - E(A0,B1) = Avg. product when settings = (A0,B1).  
       - E(A1,B0) = Avg. product when settings = (A1,B0).  
       - E(A1,B1) = Avg. product when settings = (A1,B1).  
     - **CHSH Sum (S)**:  
       $$  
       S = E(A0,B0) - E(A0,B1) + E(A1,B0) + E(A1,B1)  
       $$  

  #### **Phase 3: Discover the Ceiling (15 min)**
  1. **Report S Values**: Teams write S on the board.  
  2. **Enumerate All Strategies**:  
     - Instructor leads class to list all 16 possible instruction cards (4 Alice options × 4 Bob options).  
     - For each, compute S (deterministically):  
       *Example: Alice: [A0=+1, A1=+1], Bob: [B0=+1, B1=−1] → S = (1) − (−1) + (1) + (−1) = 2*.  
     - **Discovery**: Maximum |S| = 2. *No card combination beats S=2*.  

  #### **Phase 4: Quantum Box Demo (10 min)**
  1. **Run Quantum Simulation**:  
     - Instructor runs a "quantum box" (Python script or pre-generated table) with:  
       - Settings: **A0=0°**, **A1=90°**; **B0=45°**, **B1=135°**.  
       - **Correlations**: \(E(a,b) = -\cos(a - b)\) (singlet state).  
       - **CHSH Sum**: \(S_{\text{quantum}} = 2\sqrt{2} \approx 2.83\).  
     - Generate 50–100 pairs (settings chosen randomly).  

  2. **Verify Quantum Properties**:  
     - **Flat Marginals**: Students check Alice/Bob outcomes are ±1 with 50% probability (regardless of distant setting).  
     - **Correlations**: Match \(-\cos(\Delta\theta)\) (e.g., E(A0,B0) ≈ \(-\cos(45°) = -0.707\)).  

  #### **Phase 5: Debrief (25 min)**
  Map each activity step to Bell’s theorem:  

  | **Activity Moment**             | **Theoretical Concept**                                                                 |  
  |---------------------------------|----------------------------------------------------------------------------------------|  
  | Sealed instruction cards        | **Local hidden variables (LHV)**: Pre-agreed instructions (λ) for all settings.        |  
  | No cross-indexing on cards      | **Locality assumption 1 (setting independence)**: Distant setting doesn’t affect local outcome. |  
  | Outcomes read independently     | **Locality assumption 2 (outcome independence)**: Distant outcome doesn’t affect local outcome. |  
  | S ≤ 2 for all cards             | **Bell inequality (CHSH)**: Upper bound for LHV theories.                              |  
  | Quantum box achieves S = 2√2   | **Quantum violation**: QM exceeds LHV limit.                                           |  
  | Flat marginals in quantum box  | **No signaling**: Cannot communicate faster than light (marginals independent of distant setting). |  

  **Explicit Handling of Assumptions**:  
  - **Pressure on Locality 1**: The "no cross-indexing" rule directly challenges whether distant settings affect local outcomes.  
  - **Assumed Locality 2**: Outcome independence is built in (no outcome communication) but *not* tested by the inequality.  

  **Limitations of the Activity**:  
  1. Does **not** prove nature violates Bell’s inequality; the quantum box is a *stipulated model*.  
  2. Ignores **loopholes** (detection efficiency, locality in spacetime).  
  3. **Freedom-of-choice loophole**: A skeptic could argue settings weren’t independent of hidden variables.  
  4. **Interpretation-agnostic**: Doesn’t resolve *why* QM violates it (nonlocality, indeterminism, retrocausality, etc.).  

  ---

  ### **Scoring Sheet Template**
  ```markdown
  | Round | Alice Setting (A0/A1) | Bob Setting (B0/B1) | Alice Outcome (±1) | Bob Outcome (±1) | Product (A×B) |
  |-------|-----------------------|---------------------|--------------------|------------------|---------------|
