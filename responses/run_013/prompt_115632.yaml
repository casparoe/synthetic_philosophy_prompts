  | ...   | ...                   | ...                 | ...                | ...              | ...           |
  | 20    |                       |                     |                    |                  |               |

  Correlations:
  - E(A0,B0) = Avg. product for (A0,B0) rounds → _______
  - E(A0,B1) = _______ → _______
  - E(A1,B0) = _______ → _______
  - E(A1,B1) = _______ → _______

  CHSH Sum (S) = E(A0,B0) - E(A0,B1) + E(A1,B0) + E(A1,B1) → _______
  ```

