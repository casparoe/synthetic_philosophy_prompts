  ## Commencement Address: The Unseen Compass

  **(Setting down notes, looking across both halves of the room – graduates/faculty and families – with warmth and directness)**

  Parents, families, distinguished faculty, colleagues, and most importantly, the remarkable individuals seated here before me in these gowns – our very first graduating class: Congratulations.

  I know, many of you parents are looking at these robes, listening to the Latin honors, and thinking, “Decision theory? Global risk? What *exactly* did my child spend this year, and yes, that tuition, doing?” My own dad, bless him, just wants confirmation it’s a real degree. (Nods to the third row). It is, Dad. A challenging, vital one.

  And graduates, I see you. I see the intensity of this year etched in your faces, the late nights wrestling with impossible problems, the weight of the ‘global risk’ part settling in. You’re stepping into a world that feels… precarious. Uncertain. It’s frightening. It’s natural to wonder: *Will any of this matter?*

  So, what *did* we spend this year building? What’s the tool we handed you? It’s tempting to say it’s about solving specific problems – climate models, AI alignment, pandemic curves. Important, yes. But that’s not the core. The core isn’t *what* to think about those things. It’s *how* to think. It’s the *procedure* itself.

  Let me try to explain that core with a concept we explored deeply: **acausal trade**.

  **(Pauses, leans forward slightly, addressing both groups)**

  Imagine two people, utterly separated. Maybe continents apart, maybe separated by centuries. They can never speak. They can’t send messages, trade goods, or even see each other’s actions directly. By all ordinary measures, they are isolated islands. Yet… they can still cooperate. They can still help each other succeed. How?

  Not because they share the same goals. Maybe their objectives are wildly different. The key is that they share the *same rigorous method for reasoning*. They both build their decisions on the same bedrock principles of logic, evidence, and careful consideration of consequences. Because they both use this method, they can *anticipate* how the other would reason in a given situation. Each knows that the other is also methodically figuring out the best course of action, including how their own choice might influence the distant other’s thinking. Their cooperation isn't based on communication; it's based on mutual recognition of a shared *process* of thought. What they exchange isn’t influence, but *trust in the method*.

  Think of it like this: **Imagine two lighthouses, built on different, storm-lashed shores, designed by the same meticulous architect.** They’ve never seen each other’s light. They don’t send signals back and forth. But the captain of a ship lost in the fog near Lighthouse A knows something crucial: Lighthouse B *must* be built exactly the same way. Its light will flash with the same reliable pattern, its warnings will be just as clear, *because it was built using the same rigorous blueprint*. The captain near Lighthouse A trusts the light from Lighthouse B, not because he’s seen it, but because he understands *how it was made*. That shared blueprint, that shared commitment to precision and reliability – that’s what allows trust and cooperation across an impossible gulf. The light isn’t reaching the other lighthouse; the *method* is reaching the captain who needs it.

  **(Shifts tone slightly, more grounded)**

  Now, any sharp mind in this room – and I see many – might immediately raise an objection. It’s a serious one. If these two lighthouses, or reasoners, are truly separate, isn’t this just a coincidence? Aren’t they just *happening* to flash the same pattern? That’s just correlation. There’s no real connection, no actual cooperation. Or, if their similar design *does* mean one somehow influenced the other – maybe they read the same architect’s manual years apart – then isn’t that just ordinary, causal influence? Where’s the ‘acausal’ part? Does this idea of trading across silence and distance hold any water, or is it just a clever illusion?

  **(Pauses, lets the question hang. Looks at the graduates.)**

  That’s the question. That’s the knot we don’t fully untie today. Does the universe truly reward this kind of rigorous, methodical thinking when the other party is impossibly distant? Does the blueprint *actually* matter in the void? Or is it just us, building our lonely lights, hoping against hope?

  **(Tone softens, becomes warmer, focuses on the graduates)**

  Graduates, this is what you’ve spent the year mastering: the blueprint. The rigorous procedure. The commitment to clear thinking, to confronting uncertainty head-on, to breaking down vast, terrifying problems into questions logic and evidence can address. You haven’t just learned *about* global risks; you’ve learned how to *think* about them. That blueprint – that method – is what your tuition bought. It’s the most powerful tool we could give you.

  And here’s why I believe it matters, even if the grand philosophical question about acausal trade remains open: **Because you are the lighthouse builders.** You have chosen to build your minds with precision and integrity. You have chosen a method that strives for truth, even when it’s uncomfortable. You have learned to shine a clear, steady light into complex fog.

  Will that light *always* be seen? Will it *always* find a cooperating beacon across the void? We don’t know. The universe doesn’t promise that. What we *do* know is this: **A well-built lighthouse matters to the ships within its reach.** Your clarity of thought, your disciplined approach, your unwavering commitment to reason – these will matter profoundly to the people around you, to the problems you tackle, to the communities you serve. They will see your light. They will recognize its reliability. They will trust its pattern. That is real. That is causal. That changes the world right here, right now.

  You leave here not with guarantees, but with something more profound: **The dignity of the signal.** The integrity of the method. You carry a way of thinking that is your light. Shine it clearly. Build it strong. Trust that others, perhaps in ways we cannot yet fathom, are building theirs too.

  Parents, families: *This* is the real degree. You invested in young people who can now navigate complexity with rare skill and intellectual courage. Be proud. Graduates: The world needs your light. Go shine it. Congratulations.
