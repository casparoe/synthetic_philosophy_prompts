  Below is a decision tree designed to guide participants through the Einstein's-brain thought experiment. It starts from the common gut reaction ("it's paper and ink, not thinking") and branches into named positions, clarifying that disagreements hinge on distinct underlying issues (implementation, substrate, speed/agency, and triviality). The tree uses **7 concrete, label-free questions** (nodes) and leads to **5 terminal positions (leaves)**. Each node is a question answerable without philosophical jargon, using intuitive cases. 

  ### Decision Tree
  1. **Node 1 (Substrate):**  
     *If we built a perfect physical replica of Einstein’s brain using silicon chips (same structure, same activity patterns), would it be conscious?*  
     - **Yes** → Go to Node 2.  
     - **No** → **Leaf: "No, wrong stuff"** (Consciousness requires biological neurons or specific physical material).  

  2. **Node 2 (Implementation):**  
     *Could a rock, by itself (sitting untouched), be "running" a program like a calculator—simply because we* interpret *its cracks as representing numbers and operations?*  
     - **Yes** → Go to Node 6.  
     - **No** → Go to Node 3.  

  3. **Node 3 (Book’s causal role):**  
     *In the book experiment, is the book itself (the paper/ink object) doing the thinking when someone uses it to simulate Einstein’s brain?*  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  4. **Node 4 (Speed):**  
     *If the simulation runs extremely slowly (e.g., one "thought" per century), is it still conscious?*  
     - **Yes** → **Leaf: "Yes, and it’s just slow"** (Consciousness depends only on computational structure, not speed).  
     - **No** → **Leaf: "No, too slow to count"** (Speed is critical; too slow means no consciousness).  

  5. **Node 5 (Agency):**  
     *When you use the book to simulate the brain (turning pages, updating states), is the* reader *the one doing the thinking (like performing mental math), or is it the* whole system *(book + reader)?*  
     - **Reader** → Go to Node 7.  
     - **Whole system** → Go to Node 4 (applies to the system).  
     - **Neither** → **Leaf: "No, it’s a description, not a computation"** (The book encodes information but doesn’t *execute* it; only descriptions exist here).  

  6. **Node 6 (Triviality):**  
     *Is it true that* any *object (e.g., a teacup) can be seen as "implementing" any program (e.g., a chess AI) if we interpret its states arbitrarily?*  
     - **Yes** → **Leaf: "Yes, but only trivially"** (Everything "implements" everything under some description, so the question is ill-posed without a non-arbitrary implementation standard).  
     - **No** → *Rare view; redirect to Node 3* (Inconsistent with Node 2 "Yes"; assume pragmatic reset).  

  7. **Node 7 (Memorization):**  
     *If a person memorizes the entire book and "runs" the simulation internally over 40 years (reciting steps in their mind), are they simulating Einstein’s brain?*  
     - **Yes** → **Leaf: "Yes, and it’s just slow"** (Same as Node 4 "Yes"; manual execution still counts).  
     - **No** → **Leaf: "No, it’s a description, not a computation"** (Same as Node 5 "Neither"; the memorizer is just interpreting a description).

  ---

  ### Key Notes
  1. **Trivial-Implementation Path**:  
     - If participants take the "trivial implementation" horn (Node 2 → Node 6 → "Yes"), they land at the **"Yes, but only trivially"** leaf. This *separates cleanly* from the "slow" leaf because:  
       - **"Trivial"** denies the question’s coherence (no non-arbitrary implementation standard).  
       - **"Slow"** affirms the simulation works but emphasizes speed as irrelevant.  
     - *No collapse*: The "slow" leaf requires non-trivial implementation (Node 2 → "No" path), while "trivial" rejects it.  

  2. **Empty/Incoherent Combinations**:  
     - **Node 6 → "No"**: This branch is **empty/unexplored** (rejecting trivial implementation *after* accepting it in Node 2 is inconsistent). Redirected to Node 3 for coherence.  
     - **Node 3 → "No" → Node 5 → "Whole system" → Node 4 → "No"**: Lands at **"No, too slow to count"**. This is **coherent but unattractive** (draws an arbitrary speed threshold for consciousness).  

  3. **Memorization Clarification**:  
     - Node 7 tests if "manual execution" (by a reader or memorizer) changes intuitions vs. the book alone. A "No" here reinforces the "description" leaf; "Yes" aligns with "slow."  

  4. **"No Fact of the Matter" Position**:  
     - Not a leaf because the tree forces commitments. If participants resist all branches, they implicitly hold this view (e.g., "It’s about usefulness, not truth"). Flag this orally during discussion.  

  ### Tree Summary
  - **Gut reaction** ("No, not thinking") typically starts at Node 3 → "No".  
  - **Disagreements decompose into**:  
    - Implementation (Nodes 2, 6: trivial vs. non-trivial).  
    - Substrate (Node 1: biology vs. organization).  
    - Speed/Agency (Nodes 4, 5, 7: what "runs" the computation, and if speed matters).  
  - **Leaves covered**:  
    1. No, wrong stuff (substrate essential).  
    2. No, it’s a description (causal power lacking).  
    3. Yes, and it’s just slow (organization + speed irrelevant).  
    4. Yes, but only trivially (implementation arbitrary).  
    5. No, too slow (speed essential).  

  Run this in your session by having participants vote at each node. Debrief by mapping leaves to named positions (e.g., "trivial" → computational antirealism; "wrong stuff" → biological naturalism). Empty branches highlight where views may be inconsistent.
