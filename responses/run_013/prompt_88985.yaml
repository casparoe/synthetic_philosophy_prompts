  Looking at dependencies, the foundational step is clarifying the threshold's nature. Is it metaphysical (a fact about value), epistemic (uncertainty in measurement), or deontological (a rule)? This choice affects everything else. The tie-break and band ideas fall under deontological and structural approaches respectively. 

  Next is the structure of suffering. If they adopt the band model, defining the floor and ceiling becomes crucial. But this requires an account of how suffering aggregates—is it additive, does it have diminishing returns? Without this, the band's edges remain arbitrary.

