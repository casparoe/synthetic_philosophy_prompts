prompt: |-
  Been reading LessWrong-adjacent blogs for about 15 years and I want to spend the next year on a proper post series about lexical-threshold negative utilitarianism -- the idea that there's a level of suffering no amount of pleasure can outweigh -- together with the older question of whether pleasure and pain are even on one scale (the dust specks vs torture thought experiment, but treated as a real axiological problem rather than a gotcha). Two half-ideas I want to use as scaffolding, and I honestly dont know if either survives contact: (1) the threshold isn't a fact about value, it's a tie-break rule -- the two aren't comparable, so we refuse to trade them off at all; (2) the threshold is a band, not a line: below the floor a life is bad however much good is mixed in, above a ceiling extra suffering can't spoil it, and inside the band ordinary weighing applies. Given all that, which open questions here actually matter most, and in what order? I want a dependency-aware ranking rather than a survey -- which questions are upstream of which, which are tractable for one person doing careful conceptual work over a year, which look central but don't end up changing anything downstream, and what would move a question up or down the list. No reading lists please.
