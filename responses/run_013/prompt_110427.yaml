  We are going to translate the metaphysical dispute between David Lewis's counterpart theory and the transworld identity view into the vocabulary of relational database engineering.

  **Key Metaphysical Positions:**

  1. **Transworld Identity (TI):** An individual exists in multiple possible worlds. The same individual (numerically identical) is present in different worlds. For example, "I might have been a musician" means that in some other possible world, the very same person (me) is a musician.

  2. **Counterpart Theory (CT):** No individual exists in more than one world. Instead, an individual in one world has counterparts in other worlds. These counterparts are similar to the original in relevant respects but are not numerically identical. The statement "I might have been a musician" means that in some other world, there is a counterpart of me who is a musician.

  **Database Vocabulary Translation:**

  We model the set of all possible worlds as a database. Each world is a separate database instance (or a separate schema within a multi-tenant database). We have tables in each world representing individuals and their properties.

  **Assumptions in the Database Model:**

  - We are representing possible worlds. We can think of having a `Worlds` table with a primary key `world_id`.
  - For each world, we have an `Individuals` table that has a foreign key `world_id` and a primary key `individual_id` (which might be unique only within a world, or globally unique?).

  **Transworld Identity (TI) in Database Terms:**

  In TI, the same individual exists in multiple worlds. Therefore, we must have a way to represent that an individual is the same across worlds.

  **Schema for TI:**

  - We have a global `Individuals` table that has a primary key `global_individual_id` (a surrogate key that is globally unique and identifies the individual across all worlds).
  - Then, for each world, we have a `Worldly_Properties` table that records the properties of an individual in a specific world. This table would have:
      - `global_individual_id` (foreign key to the global Individuals table)
      - `world_id` (foreign key to the Worlds table)
      - and then columns for properties (e.g., `occupation`, etc.)

  Alternatively, we might model each world as having its own `Individuals` table, but then we need a way to link the same individual across tables. This is the entity resolution problem: we want to say that a row in `Individuals_world1` and a row in `Individuals_world2` are the same global individual.

  In a normalized design, we would have:

  - Table: `Global_Individual`
      - `global_individual_id` (PK)

  - Table: `Worldly_Individual`
      - `world_id` (PK, FK to Worlds)
      - `local_individual_id` (PK within the world) -> but note: we are going to link via the global individual?
      - Instead, we can have:
          - `worldly_individual_id` (surrogate key for this table)
          - `world_id`
          - `global_individual_id` (FK to Global_Individual)
          - ... and then properties that are world-specific?

  But note: in TI, the individual is the same, so the core identity is fixed. Properties that are essential to the individual (if any) would be in the global table? But typically, properties vary across worlds. So we might have:

  - `Global_Individual`: only the essential properties (if any) that are necessary for identity? But TI doesn't necessarily say that identity is determined by properties. It might be primitive.

  Alternatively, we might have no global table and rely on a cross-world entity resolution that enforces that the same `global_individual_id` is used in every world for the same individual. But then how do we represent that an individual exists in multiple worlds? We have multiple rows in `Worldly_Individual` for the same `global_individual_id` and different `world_id`.

  **Counterpart Theory (CT) in Database Terms:**

  In CT, an individual exists only in one world. So:

  - We have a table `Worlds` (world_id PK)
  - For each world, we have an `Individuals` table (or one big table with `world_id` and `individual_id` as a composite primary key). Let's do:

      Table: `Individuals`
      - `world_id` (PK, FK)
      - `individual_id` (PK within the world) -> so primary key is (`world_id`, `individual_id`)
      - ... properties ...

  Then, we have a separate `Counterpart` relation that is not an equivalence relation. It is a relation between individuals in different worlds.

      Table: `Counterpart`
      - `world_id1`
      - `individual_id1`
      - `world_id2`
      - `individual_id2`
      - (and perhaps a `similarity_score` or attributes about the counterpart relation)

  Note: The counterpart relation is not necessarily symmetric or transitive. Also, it can be many-to-one, one-to-many, etc.

  **Residue Report:**

  We will break down the translation by the four points and then the overall residue.

  **Point 1: Identity as an Equivalence Relation vs. Counterpart Relation**

  - In TI, identity is an equivalence relation (reflexive, symmetric, transitive). In the database, we model this by having a single `global_individual_id` that is the same in every world. This forces the equivalence: if A=B and B=C then A=C, etc. We cannot represent non-transitive or non-symmetric identity because the primary key is an equivalence relation by design.

  - In CT, we have a `Counterpart` table that is a binary relation. We can design it without enforcing symmetry or transitivity. However, note that in a relational database, we are free to define a relation that is not an equivalence. But when we try to use it as a stand-in for identity (as in CT), we break the usual properties of identity.

    *What survives?* 
      - The database can represent a non-equivalence relation for counterparts. We can have a table that allows for one individual to have multiple counterparts in another world (one-to-many) and multiple individuals in one world to be counterparts of one individual in another (many-to-one). We can also have it non-symmetric: if (w1, id1) is a counterpart of (w2, id2) we don't require the reverse.

    *What is bent?*
      - However, the counterpart relation in Lewis is not arbitrary: it is based on similarity. In the database, we can have attributes that capture the degree of similarity, but the counterpart relation itself is a primitive in the theory? Actually, Lewis defines it by similarity. But in our table, we can have a similarity measure. The issue is that in practice, entity resolution in databases often uses a similarity function and then applies a threshold to create an equivalence relation (clustering). But we are not forced to do that. We can have a table of pairwise similarities without clustering. So the database can represent the counterpart relation as described.

    *Defect?* 
      - The database framework does not force the counterpart relation to be an equivalence. So we can represent non-equivalence. However, note that if we try to use the counterpart relation to represent "transworld identity" in a query (like: what properties does my counterpart have in world W?), we are not forced to have equivalence. So the representation is faithful.

  **Point 2: De re / De dicto distinction**

  In metaphysics:
  - De dicto: "It is possible that the tallest spy is a musician" — about the proposition.
  - De re: "The tallest spy might have been a musician" — about the individual.

  In database query terms:

  Consider a table `Individuals` (with `world_id` and `individual_id`) and a property `is_musician`.

  - De dicto: We can query for a world in which there exists an individual who is the tallest spy and is a musician. This is a query over the whole relation.

      Example SQL (for one world at a time? or across worlds?):
      We are considering one world at a time for possibility.

      For a fixed world, we might have:

          SELECT 1
          FROM Individuals I1
          WHERE I1.world_id = {world_id}
            AND I1.occupation = 'spy'
            AND I1.height = (SELECT MAX(I2.height) 
                            FROM Individuals I2 
                            WHERE I2.world_id = {world_id} 
                              AND I2.occupation = 'spy')
            AND I1.is_musician = true

      Then we say: there exists a world where this query returns a row.

  - De re: We have a particular individual (say, in world W0, individual X) and we want to say that in some other world, that individual (or a counterpart) is a musician.

      In TI: we look up the global individual ID of X in W0, then find a world W1 where the same global individual has `is_musician` true.

          SELECT 1
          FROM Worldly_Individual WI
          WHERE WI.global_individual_id = (SELECT global_individual_id 
                                          FROM Worldly_Individual 
                                          WHERE world_id = W0 AND individual_id = X)
            AND WI.is_musician = true
            AND WI.world_id <> W0   -- if we want another world

      In CT: we look for a counterpart of (W0, X) in some world W1, and that counterpart is a musician.

          SELECT 1
          FROM Counterpart C, Individuals I
          WHERE C.world_id1 = W0 AND C.individual_id1 = X
            AND C.world_id2 = I.world_id AND C.individual_id2 = I.individual_id
            AND I.is_musician = true

  *Translation:*
  - The de re/de dicto distinction maps to the difference between:
      - De dicto: a query that does not anchor to a specific individual row (it may use a description to pick out an individual in each world, but that description might pick different individuals in different worlds).
      - De re: a query that is anchored to a specific individual row (by a primary key or by a counterpart relation) and then looks at what happens to that same individual (or its counterparts) in other worlds.

  *Residue:*
  - This translation seems to survive intact. The database vocabulary captures the distinction.

  **Point 3: The consolation objection**

  The objection: If a counterpart of mine wins an election, that doesn't console me because it's not me. Only if I win am I consoled.

  In the database picture:
  - In TI: if we have the same global individual, then if in some world that individual wins, we can say "I win in that world". But note: the real me is in the actual world, and I didn't win. So the fact that in another world I win doesn't change the actual world. But the objection is about the consolation of knowing that in some world I win. The TI advocate might say: that is me, so it should console. But the non-identity theorist says: it's not me.

  - In CT: it's explicitly not me. It's a counterpart.

  But in the database, we are representing the worlds as records. The objection is about the psychological state of an individual in one world (the actual one) regarding the state of an individual in another world. The database does not by itself have a notion of "the actual world" or of the perspective of an individual. We can add:

      Table: ActualWorld
          - current_world_id   (only one row)

  But then, when we run a query that says: in some world, a counterpart of me wins, we are returning a fact about the database. The individual in the actual world (a record) does not have a psychological state. So the objection is about the interpretation of the query result: does the actual individual (the one in the actual world) care about the counterpart?

  The database cannot represent the "care" factor. It can only represent the facts. Therefore, the objection trades on a distinction between the record and the thing recorded (the actual person) that the database does not capture. The database is a representation; it is not the person.

  *Residue:*
  - This part of the metaphysics does not survive the translation. The database can represent that there is a counterpart in another world that wins, but it cannot capture the emotional or psychological significance of that fact for the actual individual because it is a representation, not the individual.

  **Point 4: Entity Resolution and Qualitative vs. Primitive Identity**

  Entity resolution (ER) in databases is the process of determining when two records refer to the same real-world entity. This is done by comparing attributes and using matching rules.

  - In TI, if we are to represent transworld identity, we need to know which rows in different world tables correspond to the same global individual. How do we do that?
      - If we take the view that identity is primitive, then we have no attributes to match. We must have a pre-existing global ID. This is like having a global surrogate key assigned arbitrarily. Then the identity is not based on any attributes. But how do we assign which individual in world W1 is the same as in world W2? We have to manually assign or have a divine key.

      - If we take the qualitative view, we use attributes to decide. This is like ER: we match on properties.

  - In CT, the counterpart relation is based on similarity of attributes. So it is qualitative.

  But note: Lewis says that the counterpart relation is based on similarity, but it is not an equivalence and it is context-dependent. In ER, we typically try to produce an equivalence relation (clusters of records that are the same entity). But we can also have a fuzzy matching that is not forced into equivalence by storing pairwise matches without enforcing transitivity.

  *Residue:*
  - The database idiom is inherently qualitative when it comes to matching. Even if we use a surrogate key, the assignment of that key must be based on some criteria (or it is arbitrary). So if we are to have transworld identity, and we don't have a pre-assigned global key, we must use ER. But the metaphysical view that identity is primitive has no direct expression in the database because we must have some way to assign the global key. We can assign arbitrarily (like a UUID) but then we have no way to know if two rows in different worlds are the same without a pre-existing table. So the primitive identity view in the database would require that we have a global table of individuals that is pre-populated independently of attributes. This is possible but not common in databases. The qualitative approach is natural for ER.

  **Overall Residue and Commitment:**

  We are asked to commit and say what the residue means.

  **Defects of the Database Framework:**

  1. **The Actual World and Perspective:** The database does not have a built-in notion of "the actual world" or the perspective of an individual within a world. This is a missing piece for the consolation objection. We can add a table to mark the actual world, but the framework doesn't capture the subjective experience.

  2. **Primitive Identity:** If we require that identity is primitive and not based on attributes, the database can represent it by using arbitrary surrogate keys. However, the process of assigning these keys across worlds is not guided by any attribute. This is possible, but in practice, without attributes, we have no way to know which individuals in different worlds are the same. So the primitive identity view requires that the mapping is provided externally. The database cannot derive it from the data.

  **What the Metaphysical Dispute Might Lack:**

  The database framework reveals that:

  - The counterpart theory is more naturally represented because it doesn't require a global identity. We can have separate tables per world and a counterpart relation that is defined by similarity (attributes). This is very close to how we do ER without forcing equivalence.

  - However, note that in practice, ER often forces equivalence (by creating a cluster of records that are the same entity). But we can choose not to do that and keep a graph of matches. The database doesn't force equivalence on the counterpart relation.

  - The transworld identity view requires a global identifier. This global identifier must be assigned arbitrarily or by fiat. There is no way in the database to avoid having a key. This key is an equivalence relation. So if the metaphysics insists that identity is primitive and not an equivalence relation, that would be impossible in the database. But TI does take identity as an equivalence relation. So the representation is faithful.

  **Verdict:**

  The translation does not dissolve the dispute, but it does highlight that:

  1. The counterpart theory is more flexible and natural in a database because it allows for a non-equivalence relation and does not require a global identity. It matches the way we might do fuzzy matching without forcing clusters.

  2. The transworld identity view requires a global identifier which is an equivalence relation. This is also representable, but the assignment of the global ID must be done externally (or by a qualitative matching that then forces equivalence).

  However, note that Lewis's counterpart theory does not require that the counterpart relation is based solely on attributes. He allows that it is a primitive relation (though he describes it in terms of similarity). But the database representation is constrained: we can only base the counterpart relation on stored attributes or on an arbitrary assignment.

  **Which View is Vindicated?**

  The database framework does not inherently favor one view over the other because we can represent both. However, the counterpart theory is more aligned with how we handle similarity and matching without forcing a global equivalence. The TI view requires a global equivalence that might be hard to establish without a qualitative match or an arbitrary assignment.

  But note: the metaphysical dispute is about what is true in reality, not about what is convenient in a database. However, the database framework reveals that:

  - The TI view must confront the problem of how to assign global IDs (how to determine transworld identity). This is analogous to the epistemological problem: how do we know which individual in another world is the same as me? The counterpart theory avoids that by using a context-dependent, similarity-based relation.

  - The objection that identity must be an equivalence relation is built into the database for TI. But for CT, we can represent without equivalence.

  Therefore, the residue report:

  - **Successes:** 
      - The de re/de dicto distinction maps cleanly.
      - The counterpart relation can be represented without forcing equivalence.

  - **Bent:**
      - The consolation objection cannot be captured because the database doesn't model subjective experience.
      - Primitive identity in TI requires an externally provided mapping, which in practice might be done qualitatively (thus bending the primitive view) or arbitrarily.

  - **Defects (of the database framework):**
      - Cannot capture the subjective perspective (so the consolation objection has no analogue).
      - Cannot represent primitive identity without a key, and the key requires an assignment process.

  **Conclusion:**

  The translation does not vindicate one view over the other, but it shows that the counterpart theory is more naturally implemented in a database because it does not require a global equivalence and allows for a flexible, attribute-based matching that can be non-transitive and non-symmetric. The TI view is also representable but requires a global identifier that forces equivalence and might be seen as an artificial constraint if the real metaphysical relation is not an equivalence.

  However, note that the metaphysical debate might be less determinate in the following way: the database framework reveals that both views are representable, but the practical challenges of implementing TI (the global ID assignment) mirror the epistemological challenges of knowing transworld identity. This might be taken as a point in favor of counterpart theory.

