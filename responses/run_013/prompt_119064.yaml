answer: |-
  ## Desiderata for a Theory of Mental Representation in Sub-Linguistic Cognition

  **1. Purpose and Scope**
  The theory must underwrite computational explanations of cognition in non-linguistic agents (e.g., animals, pre-linguistic infants). It must explain how internal states carry content about the world, combine to form new thoughts, and guide action, solely through computational operations over these states. Crucially, it cannot presuppose linguistic capacities in the agent *or* implicitly rely on the theorist's language. The scope includes sub-personal states (e.g., visual edge detection) as well as personal-level states like beliefs, demanding either a unified account or a principled distinction. (~95 words)

  **2. The Requirements**

  1.  **Non-Derivative Content:** States must possess intrinsic, non-derived content; their representational status cannot depend on interpretation by another system (e.g., the theorist or a linguistic community).
      *   *Case:* Explaining the infant's fear of a looming object requires the infant's visual state to *be* about looming *for the infant*, not just interpreted as such by us. Smuggling in the theorist's interpretation violates the project.
      *   *Tag:* **Non-negotiable.** Essential for genuine underwriting.

  2.  **Error Potential:** The theory must allow for misrepresentation: a state must be capable of representing X when X is absent or incorrectly represented, while still determinately representing X.
      *   *Case:* A vole's alarm call triggered by rustling wind (not a predator) is *about* a predator but wrong. The state must have the same content when correct or incorrect.
      *   *Tag:* **Non-negotiable.** Without error, it's not genuine representation.

  3.  **Determinacy (Disambiguation):** The theory must fix what a state represents (e.g., a dog) rather than disjunctive alternatives (dog or dog-shaped-surface, dog-in-dark, undetached-dog-part) or indeterminate possibilities.
      *   *Case:* A dog-detection state must guide behaviour appropriate to *dogs* (chasing, barking, fleeing) specifically, not just any dog-appearance. Evolution/cognition selects for specific affordances.
      *   *Tag:* **Non-negotiable.** Indeterminate content cannot support specific computational operations or explain specific behaviours.

  4.  **Property/Object Specificity:** The theory must account for representing specific properties (red, moving-fast) and specific objects/individuals (that-particular-dog), not just undifferentiated "stuff".
      *   *Case:* Tracking a specific prey animal through clutter requires representing *that* gazelle and its properties (direction, speed), distinct from representing gazelles in general or the scene holistically.
      *   *Tag:* **Non-negotiable.** Basic cognition involves predication and object individuation.

  5.  **Non-Circularity / Non-Presupposition:** The theory cannot presuppose the very representational capacities (e.g., understanding rules of combination, grasping concepts, interpreting symbols) it is meant to explain.
      *   *Case:* Explaining how an infant forms the thought "toy under blanket" cannot presuppose the infant already understands the combinatorial rule "UNDER(X,Y)" or possesses the concepts TOY and BLANKET *as structured representations*. The theory must build up to this.
      *   *Tag:* **Non-negotiable.** Foundational for the explanatory project.

  6.  **Nativism & Acquisition Compatibility:** The theory must accommodate the possibility of innate representational capacities *and* explain how new representations are acquired, without presupposing prior possession of the relevant concepts.
      *   *Case:* Explaining a naive animal's ability to represent a novel type of fruit after one encounter (poisonous/safe), or an infant's acquisition of object permanence. The theory must ground *both* innate content and learning.
      *   *Tag:* **Non-negotiable.** Basic cognition involves both.

  7.  **Narrow Supervenience (Present-State Fixation):** The representational content of a state must supervene solely on the creature's current, internal physical state. Two physically identical creatures at a time must have identical representational states, regardless of history.
      *   *Case:* Computational explanations rely on the causal powers of *current* internal states. If content depended on history, physically identical states could cause different behaviours, violating the computational model where state transitions determine outcomes. (E.g., a visual state S causing approach or flight based solely on past associations, while S remains physically identical).
      *   *Tag:* **Commitment of a camp (Internalist/Computationalist)** dressed as constraint. Teleosemanticists strongly dispute this.

  8.  **Sub-Personal Applicability:** The core notion of representation must apply to sub-personal, unconscious computational states (e.g., visual edge detection, motor control feedback) as well as personal-level beliefs/desires, or provide a clear, principled reason why it does not/cannot.
      *   *Case:* Explaining edge detection or depth perception computationally requires states that carry specific content (e.g., "vertical edge here") and participate in computations. Denying representational status here makes the computational story empty.
      *   *Tag:* **Non-negotiable** for the stated scope.

  9.  **Causal Efficacy of Content:** The representational content must play a causal/explanatory role within the computational processes, or the theory must convincingly explain why this *isn't* necessary for a computational explanation and how content fits in.
      *   *Case:* Explaining why a "predator-detection" state causes flight *rather than* freezing requires appealing to the content "predator". If only syntax matters, the transition seems arbitrary. Content must "matter" computationally.
      *   *Tag:* **Non-negotiable** for underwriting the explanation.

  10. **Combinatorial Potential:** The theory must explain how primitive representations can combine systematically to form complex representations with novel content, mirroring the combinatorial structure of thought.
      *   *Case:* Forming the thought "the juicy apple is near the sleeping dog" from "juicy(apple)", "near(apple, dog)", "sleeping(dog)". The theory must explain the constituent structure and how combination works computationally without presupposing linguistic rules.
      *   *Tag:* **Non-negotiable.** Fundamental to explaining cognition beyond simple reflexes.

  **3. Where the List Fights Itself**

  *   **Narrow Supervenience vs. Error Potential & Determinacy:** Teleosemantic accounts often ground determinacy and error in historical function (e.g., what the state was *selected* to represent). Narrow supervenience explicitly forbids this historical dependence. How can content be determinate and allow error (e.g., distinguishing dog from perfect mimic) based *only* on current internal state? Internal states might only correlate with disjunctions (dog-or-mimic). History often seems crucial for fixing distal content (dog) over proximal correlates (retinal pattern). Resolving this requires either showing how current state *alone* can fix distal content determinately and allow error, or abandoning narrow supervenience, making content causally inert in the moment.

  *   **Non-Circularity vs. Combinatorial Potential:** Explaining combinatorial structure without presupposing rules of combination or structured concepts is profoundly difficult. Formal symbol systems seem to require syntactic rules as primitive. Inferential role semantics often presupposes understanding of inferential connections. Avoiding circularity might push towards atomistic or purely causal theories, which then struggle mightily to explain compositionality. This conflict highlights the core tension in building structured thought from unstructured primitives computationally.

  These conflicts suggest that satisfying *all* requirements simultaneously is extremely challenging, potentially impossible. The list likely forces a choice between internalist/causal-informational approaches (prioritising narrow supervenience, non-circularity) and externalist/historical approaches (prioritising determinacy, error via history), with the combinatorial potential requirement being a major hurdle for both. (~360 words)

  **4. The Requirement that Does the Most Excluding**

  **Narrow Supervenience (Present-State Fixation)** is the most exclusive requirement. It immediately disqualifies any theory where content depends constitutively on historical facts (e.g., teleosemantics, certain causal-historical theories), learning history, or environmental embedding beyond what is reflected in the *current* physical state. Many otherwise attractive theories (especially teleosemantic accounts favoured in biology and philosophy of mind) rely heavily on evolutionary history or past conditioning to fix content, especially to solve the disjunction problem (Determinacy) and ground Error Potential. This requirement insists content is "in the head" *now*, forcing the theory to find resources solely within the organism's present physical constitution to ground all aspects of representation. This creates immense pressure on satisfying Determinacy, Error Potential, and Property/Object Specificity without those crucial external/historical resources. (~150 words)

  **5. What This Leaves of the Leading Families**

  *   **Covariance/Informational Accounts:** Pure covariance (state S caused by F) struggles massively with **Determinacy** (S correlates with F-or-G-or-H...) and **Error Potential** (S caused by G is "F" but wrong? Or is it correctly "G"?). **Narrow Supervenience** is satisfied only if covariance is defined by current, internal lawlike relations, which is hard. **Combinatorial Potential** is absent without added structure. Often fail **Non-Circularity** if used to explain concept possession. Severely challenged.

  *   **Historical/Teleological Accounts:** Fundamentally violate **Narrow Supervenience** by grounding content in selection history or past conditioning. Often excel at **Determinacy** and **Error Potential** using history. **Sub-personal Applicability** is generally good. **Combinatorial Potential** remains a challenge unless combined with structural rules. **Non-Circularity** can be an issue if functions presuppose representational norms. Excluded by the narrowness constraint.

  *   **Inferential-Role/Conceptual-Role Semantics:** Struggle profoundly with **Non-Circularity** (understanding inferential roles presupposes grasp of concepts/meanings) and **Sub-personal Applicability** (hard to apply to basic perceptual states). **Narrow Supervenience** is ambiguous – roles are internal but might depend on past learning. Can handle **Combinatorial Potential** well if roles are structural. **Determinacy** and **Error** can be tricky holistically. Often fail the core project for sub-linguistic cognition.

  *   **Formal Symbol-System Accounts (FSSA - e.g., LOT):** Satisfy **Combinatorial Potential**, **Narrow Supervenience**, **Sub-personal Applicability**, and **Non-Circularity** (if syntax is non-representational). The core challenge is **Non-Derivative Content**: how do primitive symbols get their content intrinsically? Pure computational role risks lacking **Determinacy** and **Error Potential** (symbols might lack specific content). They need a naturalistic "symbol grounding" theory compatible with the other constraints (especially **Determinacy**, **Error**, **Property/Object Specificity** without history) – which is the major unsolved problem. Currently, FSSA is the *only* family not immediately ruled out by a major constraint, but its success hinges entirely on solving the grounding problem within the remaining constraints. (~290 words)
