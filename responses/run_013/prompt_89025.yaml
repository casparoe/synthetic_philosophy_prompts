prompt: |-
  i'm a backend dev with no real philosophy training, but i've fallen down the rabbit hole on updateless decision theory and the weird decision problems its supposed to handle. before i read more defenses of it, i want the spec first: what does any theory of rational choice actually have to deliver to count as adequate for these cases? give me the requirements list — the cases it has to get right (newcomb, counterfactual mugging, parfit's hitchhiker, the smoking lesion, the twin-prisoner's-dilemma kind of setup), the distinctions it can't blur (causal vs evidential relevance, what you actually control vs what merely correlates with your choice, choosing vs predicting), and any consistency demands or no-go results it can't violate. behind each requirement, say why it's a requirement and which case forces it. then tell me which single requirement does the most work in knocking out the usual contenders, and flag any two requirements you think can't be satisfied at the same time — thats the part i most want to see.

  format:
  - "What a theory has to do" — the requirements, each with the case behind it, ~400 words
  - "Where it breaks" — the pairs that can't be jointly satisfied and why, ~150 words
  - "The requirement that does the most damage" — ~100 words
  - "Quick pass" — causal, evidential and updateless decision theory, one line each against the list, ~100 words
reasoning: |-
  We are going to break down the requirements for a theory of rational choice, especially in the context of the mentioned decision problems. Then we'll discuss conflicting requirements and the most damaging requirement.

  ### What a theory has to do

  1. **Handle Newcomb's Paradox correctly**: In Newcomb's problem, an agent faces two boxes: one transparent with $1000 and one opaque that may contain $1,000,000. A predictor has placed the $1,000,000 only if it predicted the agent would take only the opaque box. The agent must decide whether to take one box or both. The requirement is to one-box, because the predictor is reliable and the decision should reflect that taking only the opaque box is evidence of the million being there. This forces the theory to account for evidential relevance: the act of taking only one box is evidence of the predictor having put the million there.

  2. **Resolve Counterfactual Mugging**: In this scenario, a mugger asks for $100 based on a coin flip. If the coin flip was tails, the mugger asks what the agent would have paid if it was heads. If the agent wouldn't have paid, the mugger leaves, but if the agent would have paid, the mugger takes $100. The agent learns the coin was tails. The rational choice is to pay the $100 in the counterfactual scenario (i.e., commit to paying if heads) because that leads to a better outcome in the tails scenario. This forces the theory to handle counterfactual reasoning and commitments that are not causally connected to the current state.

  3. **Solve Parfit's Hitchhiker**: A driver will only give a ride to a stranded hitchhiker if the hitchhiker promises to pay $100 upon arrival. The hitchhiker can choose to pay or not upon arrival. The driver will only help if the hitchhiker is the type who pays. The requirement is that the hitchhiker must commit to paying (and actually pay) to get the ride. This forces the theory to account for pre-commitment and the fact that the driver's decision is based on the hitchhiker's disposition, which is fixed at the time of the ride.

  4. **Handle the Smoking Lesion**: An agent is considering smoking. Smoking is pleasurable but causes cancer. However, there is a lesion that causes both cancer and a craving for smoking. The agent must decide whether to smoke. The requirement is that the agent should smoke because the lesion is the common cause and smoking does not cause cancer (it's only correlated). This forces the theory to distinguish between causal and evidential relationships: the correlation between smoking and cancer is not causal, so the agent should not be deterred from smoking by the evidence.

  5. **Resolve Twin Prisoner's Dilemma**: Two identical twins are in separate cells and cannot communicate. They are both rational and know they are identical. They must decide to cooperate or defect. The requirement is that they both cooperate because they know the other will do the same due to their identical reasoning. This forces the theory to account for logical correlation (across possible worlds) and the fact that one's decision is evidence about the other's.

  6. **Distinguish causal and evidential relevance**: The theory must not confuse causation with correlation. This is forced by cases like the Smoking Lesion and Newcomb's problem. In the Smoking Lesion, the agent should smoke because there is no causal link from smoking to cancer, only an evidential one. In Newcomb's problem, the agent should one-box because the act is evidentially linked to the prediction.

  7. **Distinguish control from correlation**: The agent must understand what they can control (their action) versus what is merely correlated (the predictor's prior prediction, the lesion). This is forced by Newcomb and the Smoking Lesion.

  8. **Distinguish choosing from predicting**: The agent must not confuse the act of making a choice with predicting what they would do. This is forced by precommitment scenarios like Parfit's Hitchhiker and Counterfactual Mugging.

  9. **Consistency across time and counterfactuals**: The theory must yield consistent decisions across time and in counterfactual scenarios. This is forced by Counterfactual Mugging and Parfit's Hitchhiker.

  ### Where it breaks (conflicting requirements)

  The two requirements that are hard to satisfy together are:

  - **Requirement 1 (Newcomb: one-boxing) and Requirement 4 (Smoking Lesion: smoking)**. 
    - Why? In Newcomb, we want the agent to act in a way that is evidence of a good outcome (so one-boxing). In the Smoking Lesion, we want the agent to ignore the evidence (because it's not causal) and smoke. A theory that uses evidential decision theory (EDT) would one-box in Newcomb (good) but also not smoke in the Smoking Lesion (bad). A causal decision theory (CDT) would two-box in Newcomb (bad) but smoke in the Smoking Lesion (good). So we need a theory that can sometimes use evidence (Newcomb) and sometimes ignore it (Smoking Lesion) based on the causal structure.

  - **Requirement 2 (Counterfactual Mugging: paying in the counterfactual) and Requirement 5 (Twin Prisoner's Dilemma: cooperating)**. 
    - Why? In Counterfactual Mugging, we require the agent to commit to paying in a counterfactual world (which doesn't happen) to get a benefit in the actual world. In Twin Prisoner's Dilemma, we require cooperation because the other twin will do the same. The conflict is between counterfactual reasoning and logical correlation. Some theories (like UDT) handle Twin Prisoner's Dilemma by considering logical dependencies but may struggle with Counterfactual Mugging without a clear mechanism for counterfactual commitments.

  ### The requirement that does the most damage

  The requirement to **distinguish causal and evidential relevance** does the most damage. It knocks out both EDT and CDT. EDT fails the Smoking Lesion (it doesn't smoke because of the evidence) and CDT fails Newcomb's problem (it two-boxes because it doesn't account for the evidential link). This requirement forces a more sophisticated theory that can condition on the causal structure (like using causal graphs) or adopt an updateless perspective that considers the entire decision problem.

  ### Quick pass

  - **Causal Decision Theory (CDT)**: Uses causal models to evaluate actions. Fails Newcomb (two-boxes) and Counterfactual Mugging (won't commit to pay in counterfactual).
  - **Evidential Decision Theory (EDT)**: Uses conditional probabilities (evidence). Fails Smoking Lesion (doesn't smoke) and Twin Prisoner's Dilemma (may defect because it conditions on its own action? Actually, EDT can sometimes cooperate in Twin PD if it updates on the other's action via the correlation, but it's not clear. However, EDT fails the Counterfactual Mugging because it wouldn't pay in the counterfactual since it doesn't happen? Actually, in the actual world (tails) it doesn't pay and the mugger leaves, but the problem requires that the agent would have paid in the counterfactual to get the mugger to leave. EDT doesn't have a mechanism for counterfactual commitments.)
  - **Updateless Decision Theory (UDT)**: Chooses a strategy for all possible scenarios (including counterfactuals) at the start. It's designed to handle Counterfactual Mugging and Twin PD, but may struggle with the Smoking Lesion because it might not distinguish causal structure? (UDT uses a logical prior and considers all possible outcomes, but without explicit causal modeling, it might not ignore the correlation in the Smoking Lesion. However, UDT proponents argue that by considering the entire decision problem, it can incorporate causal information. Still, it's an open issue.)

  Note: UDT is still under development and its exact handling of the Smoking Lesion is debated. The point is that the requirement to handle both Newcomb and the Smoking Lesion (i.e., causal vs evidential) is the core challenge.
answer: |-
  ### What a theory has to do  
  **Requirements with cases behind them:**  
  1. **Resolve Newcomb's Paradox correctly (one-boxing):** The agent must choose only the opaque box, securing $1M when the predictor is reliable. *Why?* Two-boxing "seizes" the visible $1K but loses $1M due to evidential reasoning: choosing one box *correlates* with the predictor having pre-filled $1M. Forces distinction: **evidential relevance** (your choice signals past events) vs. causal irrelevance (your choice doesn't *cause* the predictor's past action).  
  2. **Satisfy Counterfactual Mugging (commit to paying if heads):** After losing a coin flip (tails), the agent must pay $100 to honor the counterfactual "what if heads?" scenario. *Why?* Refusing payment in the actual (tails) world forfeits $1,000, as the mugger tests counterfactual fairness. Forces: **counterfactual control** (your decision affects outcomes in unrealized branches) and **precommitment consistency** (your policy must hold across hypotheticals).  
  3. **Solve Parfit’s Hitchhiker (commit to paying post-rescue):** The stranded hitchhiker must be the type who pays upon arrival to get rescued. *Why?* Refusing payment post-rescue leads to abandonment; only *disposition to pay* motivates the driver. Forces: **control over identity/disposition** (you "control" your type, not just actions) and **timeless decision-making** (decide at the start, not upon arrival).  
  4. **Handle Smoking Lesion correctly (smoke):** The agent should smoke despite cancer/smoking correlation. *Why?* Cancer is caused by a lesion, not smoking; smoking is merely symptomatic. Forces: **causal relevance** (only direct causes matter) over **evidential relevance** (smoking *indicates* the lesion, but doesn’t cause cancer).  
  5. **Cooperate in Twin Prisoner’s Dilemma:** Identical twins must cooperate, knowing their decisions are perfectly correlated. *Why?* Defection leads to mutual punishment; cooperation exploits logical ties. Forces: **logical correlation** (your choice implies theirs) vs. **causal independence** (no communication).  
  6. **Distinguish causal vs. evidential links:** *Why?* Smoking Lesion requires ignoring correlation (evidential), while Newcomb requires leveraging it. Failure blurs what you control.  
  7. **Avoid self-fulfilling/self-defeating predictions:** *Why?* In Newcomb, two-boxing "proves" the predictor right about your greed—but loses $1M. Forces: **choice as action, not prediction**.  
  8. **Policy consistency over time/counterfactuals:** *Why?* Parfit’s Hitchhiker and Counterfactual Mugging require binding precommitments.  

  ---

  ### Where it breaks  
  **Conflicting pairs:**  
  - **Newcomb (evidential) vs. Smoking Lesion (causal):** No theory can universally prioritize evidential or causal reasoning without failing one case. **Why?** Newcomb demands one-boxing (leverage evidence), Smoking Lesion demands smoking (ignore evidence). Causal Decision Theory (CDT) fails Newcomb; Evidential Decision Theory (EDT) fails Smoking Lesion. Updateless Decision Theory (UDT) struggles with causal structure in Smoking Lesion.  
  - **Twin PD (logical correlation) vs. Counterfactual Mugging (counterfactual control):** Twin PD requires acting on logical ties (cooperate because twin does), but Counterfactual Mugging requires affecting outcomes in *unrealized* worlds (pay if heads). UDT handles Twin PD via logical correlation but struggles with "why care about counterfactuals?" in Mugging without additional machinery (e.g., logical induction).  

  ---

  ### The requirement that does the most damage  
  **Distinguishing causal vs. evidential relevance** eliminates most contenders. CDT fails Newcomb (two-boxes, ignoring evidential ties). EDT fails Smoking Lesion (doesn’t smoke, misinterpreting correlation as causation). UDT bypasses this by treating decisions as fixed policies, but its lack of explicit causal modeling still risks conflating the two in edge cases. This requirement alone forces a theory to be *causally rigorous* while *evidentially agile*—a near-impossible standard.  

  ---

  ### Quick pass  
  - **Causal Decision Theory (CDT):** Fails Newcomb (two-boxes), Counterfactual Mugging (won’t pay counterfactually), and Twin PD (defects). Passes Smoking Lesion (smokes).  
  - **Evidential Decision Theory (EDT):** Fails Smoking Lesion (doesn’t smoke), Counterfactual Mugging (won’t pay), and Parfit’s Hitchhiker (won’t commit). Passes Newcomb (one-boxes).  
  - **Updateless Decision Theory (UDT):** Passes Newcomb, Twin PD, and Counterfactual Mugging by treating decisions as fixed policies. Struggles with Smoking Lesion (may not smoke if policy-output correlates with lesion) and Parfit’s Hitchhiker (requires explicit handling of "type" as policy).
