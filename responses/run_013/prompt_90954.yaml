answer: |-
  ## Joint Statement on Epiphenomenalism and Phenomenal Judgment: A Framework for Adversarial Collaboration

  **Preamble:** We, **Colleague A (Epiphenomenalist)** and **Colleague B (Non-Eliminativist Interactionist)**, have engaged in prolonged debate regarding the causal status of phenomenal consciousness ("experience"). To advance beyond polemics, we establish this document outlining points of agreement and clarifying the precise loci of our disagreement. We commit to investigating these loci through collaborative analysis of arguments, thought experiments, and empirical findings. This document does not adjudicate, propose a middle ground, or assume either position is correct.

  **Section 1: Points of Agreement**

  We jointly affirm the following:

  1.  **Reality of Phenomenal Experience:** Phenomenal experiences (qualia, subjective feels) are real phenomena. They are not illusions, nor are they eliminable in favor of purely physical/functional descriptions of neural states. We reject eliminative materialism regarding consciousness.
  2.  **Neural Basis:** Phenomenal experiences are systematically correlated with, and causally dependent upon, specific neural activity states and processes within the brain. There are necessary neural conditions for the occurrence of any given experience.
  3.  **Physical World Completeness:** The physical world, as described by fundamental physics and neuroscience, is causally closed. Every physical event (including neural events leading to behavior and verbal reports) has a sufficient physical cause within the physical domain. No non-physical entity or force *produces* or *initiates* physical changes.
  4.  **Epistemic Access:** We possess generally reliable introspective access to our own phenomenal experiences, evidenced by the consistency and coherence of subjective reports (under appropriate conditions).
  5.  **The Explanatory Gap / Hard Problem:** Current physical science lacks a satisfying, non-question-begging account of how and why specific patterns of neural activity *give rise to* or *constitute* specific phenomenal experiences. There is an explanatory gap between physical processes and subjective experience.
  6.  **Scope of Epiphenomenalist Denial:** When Colleague A claims experiences are "causally inert" or "make no causal difference," this specifically means:
      *   Experiences do not *initiate*, *produce*, or *generate* any physical events (neural or otherwise).
      *   Experiences are not *difference-makers* for physical events: Holding all physical antecedents (including neural states) fixed, varying the experience alone would *not* result in any variation in subsequent physical events (including neural states leading to judgments about the experience).
      *   This denial applies *specifically to their causal efficacy within the physical domain*, including their role in causing the neural events that underlie judgments *about* experiences.
  7.  **Non-Verbal Disagreement:** Our core disagreement is substantive and not merely verbal. We agree on the referent of "phenomenal experience" and "physical event." Our dispute concerns the causal relations *between* these entities.

  **Section 2: Table of Disagreements and Cruxes**

  | #  | Core Question                                                                                                 | Colleague A (Epiphenomenalist) Formulation                                                                                                                                      | Colleague B (Non-Eliminativist Interactionist) Formulation                                                                                                                                                         | Crux                                                                                                                                                                                               | Relevant Case/Argument/Result                                                                                                                                                                                                                                                 | Prediction A                                                                                         | Prediction B                                                                                         | Disconfirmation Condition (For Predictor)                                                                                                                                                                                                                                                               |
  | :-- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1   | **Does the reliability of judgments *about* an experience require the experience itself to be a cause of that judgment?** | "No. Reliability can be fully explained by a common cause: the neural state N. N causes both the experience E and the judgment J about E. J reliably tracks E because both are distinct effects of N. The content of J is fixed by N alone." | "Yes. If E plays no causal role in generating J, then the fact that J is reliably *about E specifically* becomes a massive coincidence. A common cause N explains correlation, not the *intentional aboutness* of J to E. Why does J refer to E rather than just N?" | **Does the common cause (N) model adequately explain the *intentional content* (aboutness) and reliability of J *specifically with respect to E*, rather than just the correlation between E-occurrence and J-occurrence?** | **Blindsight Type-III (Content-Specific Unawareness):** A subject accurately discriminates/generates reports about stimulus property P (e.g., shape, motion) at above-chance levels, while sincerely denying *any* conscious experience of P *at all*. (e.g., motion area V5/MST damage causing akinetopsia with residual motion discrimination). | **A:** Predicts such cases are possible & demonstrate reliable judgment about P *without* conscious experience of P causing the judgment. J is caused by residual N, tracking P, while E is absent. | **B:** Predicts such cases either don't exist (reliable discrimination requires *some* minimal experience) or, if they exist, the judgments aren't *about* the *experience* of P (they might be about P directly or involve a different, degraded experience). | **A Disconf:** Finding that *all* reliable discriminatory judgments about P *require* a reportable minimal conscious experience of P.<br>**B Disconf:** Clear evidence of reliable, content-specific (about P) judgments occurring *concurrently* with a complete, verifiable absence of any experience of P. |
  | 2   | **Can a judgment J "track" an experience E (be counterfactually dependent on E) without E causing J?**          | "Yes. If E is a necessary effect of N, and J is a necessary effect of N, then J will covary with E: If E had been different (implying N was different), J would have been different. This counterfactual dependence constitutes tracking." | "No. Mere counterfactual dependence via a common cause is insufficient for genuine *tracking* or *representation*. True tracking requires E to play a causal role in the *production* or *shaping* of the state (J) that tracks it. Without causal efficacy, E is merely an epiphenomenal shadow, not something J can genuinely be *about* or track." | **Is counterfactual dependence grounded *solely* in a common cause sufficient for a judgment J to genuinely *track* or be *about* an experience E, constituting epistemic justification for J?** | **Philosophical Zombies (P-Zombies):** Conceivability of a physical/functional duplicate of a conscious human (including all neural states & behaviors, including verbal reports about experiences) that lacks any phenomenal consciousness whatsoever. | **A:** Predicts P-Zombies are conceivable & metaphysically possible. Their reports about "experiences" track the neural states N that *would* cause E (if present), not E itself (which is absent). J tracks N, not E. | **B:** Predicts P-Zombies are inconceivable or metaphysically impossible. Accurate reports *about experiences* in the actual world *require* the causal presence of those experiences to fix the content and justification of the reports. | **A Disconf:** Demonstrating a logical contradiction in the P-Zombie concept *specifically regarding the content and justification of phenomenal judgments*.<br>**B Disconf:** A compelling, non-question-begging argument showing P-Zombies are conceivable *and* how their phenomenal judgments could have accurate content/justification without any experiences. |
  | 3   | **Does the epiphenomenalist position undermine the justification for believing in the existence of phenomenal experiences?** | "No. My belief that experiences exist is caused by neural state N. N also causes the experience E. E does not cause my belief. The belief is justified because it accurately represents the state of affairs (E's existence) caused by N. The reliable link is via N." | "Yes. If my experiences (E) play no causal role in forming my beliefs (J) about them, then those beliefs lack a crucial justificatory foundation. The belief J is not *sensitive* to E itself, only to N. If E were absent but N identical (as in a P-Zombie), J would still occur falsely asserting E exists. This lack of sensitivity undermines justification." | **Does the justification for introspective beliefs about experience require the experience to play a causal role in the formation of that belief (making it *sensitive* to the experience itself)?** | **The Paradox of Phenomenal Judgment (Applied to Justification):** Can an epiphenomenalist provide a non-question-begging account of how their belief "I am experiencing red" is justified solely by neural state N, without E causing or being a difference-maker for that belief? | **A:** Predicts a coherent account is possible: The belief is reliably caused by N, and N reliably causes E, so the belief reliably indicates E's presence. Justification is externalist/reliabilist. | **B:** Predicts no fully satisfactory account is possible without granting E causal efficacy. Any externalist justification relying solely on N fails to connect the *content* of the belief ("I am experiencing red") to its actual subject (E) in the required justificatory way. | **A Disconf:** A successful argument showing that externalist/reliabilist justification *necessarily fails* for introspective beliefs if the target state is epiphenomenal.<br>**B Disconf:** A successful, non-question-begging externalist/reliabilist model of justification for introspective beliefs that convincingly explains their accuracy and justification *without* invoking causal efficacy of E. |

  **Section 3: Clarification on Causation**

  We acknowledge a potential source of confusion regarding the concept of "causation":
  *   Colleague A denies that experiences are causes under a *production* or *generation* model (where causes bring effects into being) and a *difference-making* model (where the cause must make a difference to whether or how the effect occurs, holding other relevant factors fixed).
  *   Colleague B asserts that experiences are causes, primarily under a *difference-making* model: the presence or specific character of the experience makes a difference to the nature or occurrence of subsequent physical events (specifically, the neural events constituting judgments about the experience).

  **Therefore, the disagreement over whether experiences "cause" judgments is substantive, not merely verbal.** We agree on the core meaning of causation as difference-making within the physical domain. Colleague A denies experiences are difference-makers; Colleague B affirms they are. This difference is central to Disagreements #1, #2, and #3 above.

  **Section 4: Commitment**

  We commit to investigating the identified Cruxes. We agree that **neither of us may treat the existence or nature of phenomenal judgments as a brute fact immune to explanation.** Progress requires engaging with the specific arguments and evidence outlined in the Cruxes. We will consider:
  *   Detailed analyses of blindsight and related neuropsychological dissociations.
  *   Philosophical arguments concerning P-Zombies, conceivability, and metaphysical possibility.
  *   Philosophical arguments concerning theories of mental content, reference, and justification (especially for introspection).
  *   Relevant empirical findings concerning neural correlates of consciousness and report.

  We recognize that resolving these Cruxes may require significant philosophical and empirical work. This document serves as our agreed-upon roadmap for that collaborative (yet adversarial) investigation. We will circulate this document to clarify the structure of our debate.

  ---

  **Signed,**

  _________________________
  Colleague A (Epiphenomenalist)

  _________________________
  Colleague B (Non-Eliminativist Interactionist)

  **Date:** October 26, 2023
