  The document must maintain strict neutrality - no sneaking in my own views. Each "crux" needs testable predictions: the user expects blindsight subjects can judge stimuli accurately without experience, while the colleague expects reports would falter. For zombies, the user thinks physical duplicates could make identical experience-reports without consciousness, while the colleague denies this possibility.

  Notably, both reject eliminativism and agree neuroscience hasn't explained consciousness. That's common ground to build on. The "no brute facts" rule means neither can handwave why we report experiences - this forces engagement with evidence.

