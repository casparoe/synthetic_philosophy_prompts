prompt: |-
  For the past three years I have been the volunteer treasurer of a small mutual-aid fund: six of us, no paid staff, about thirty grants a month of between one hundred and fifty and seven hundred dollars, mostly rent arrears, a car repair, a deposit, a funeral. We meet on a Thursday evening video call for ninety minutes and have to get through a dozen applications in that time, and every decision has to be written up afterwards in a single paragraph for the funders who pay for the grants. Until last autumn we took people at their word: an applicant told us what had happened and what it would cost, one of us called them back with a few questions, and the committee voted. Then two things happened in the same month. A grant we had made for a car repair turned out to have gone to an old debt, which is not what we had approved; and a woman who had already been turned away by two other agencies stopped answering our calls after we asked her for a pay stub, and we learned later that she lost the room she had been trying to keep. Since then we have argued about verification at every meeting and got nowhere. Roughly half the committee wants proof before we pay anything — a pay stub, a landlord's letter, a screenshot of the past-due bill. The rest of us think the point of the fund is that people should not have to perform their poverty for a stranger in order to be believed. In three years I can count on one hand the applications we have refused for a reason a document would have caught, and we share a list of refused applicants with two other local groups, so anything we learn about someone does not stay with us.

  What I cannot answer is the argument our chair keeps making. A friend of his in machine learning told him there is a proof — the friend calls it Good's theorem, though I have no idea whether that is the right name for it — that information which costs nothing to obtain, and which you are genuinely going to act on, cannot make you worse off on average: if you will choose differently after seeing it, then deciding after seeing it is at least as good as deciding now, and the only thing that can hurt you is the price of getting it. The chair's conclusion is that the only question for us is what the asking costs, and that until it costs more than the difference it makes we should be checking everything. I have two objections I cannot make precise. The first is that the information is not free; it is only free to us, and the person who pays for it is the one asking for help. The second is that I do not see where in his proof anyone is allowed to be worse off in a particular case as opposed to on average, or what happens when knowing something forces our hand — our funder's agreement obliges us to report anything that looks like fraud, and once we know a thing we cannot pretend we do not. So I want you to write me a procedure we can actually run, grounded in what decision theory says about the value of information, including the conditions under which the result he is quoting holds and the conditions under which it does not, rather than in anyone's intuitions about who deserves what. It should give the questions to ask in order, what counts as a sufficient answer to each, the point at which it stops with a no, and the points at which it has to hand the decision to a person because the question is one of values and not of fact. It has to be usable by six volunteers with no statistical training, on a Thursday evening, in ten minutes per application, and we are not going to start storing documents or building a database: whatever we ask to see, we look at once and hand back.

  Then run the procedure on three applications, and please do not arrange for the answers to come out the way I would like them. First, a four-hundred-dollar rent grant where we propose to ask for a pay stub. Second, an application where the person tells us something our funder's agreement obliges us to pass on, and which will follow them to the other groups we share a list with. Third, an application where the procedure tells us to stop asking for something we have always asked for, because the answer would not change what we do with the application — I expect that one to annoy me, and I would rather have it than not. Finally, tell me plainly what the procedure cannot do, and where it stops being a procedure at all and becomes a vote by six people who disagree about what the fund is for.
reasoning: |-
  We are going to design a procedure that incorporates the value of information as per decision theory, while addressing the concerns about the cost to the applicant and the potential for harm in individual cases. The key is to structure the verification process so that we only ask for information when it is likely to change the decision and when the cost (to the applicant and in terms of potential harm) is justified.

  The core idea from decision theory (Good's theorem) is that if information is free and you are going to act on it, then on average it cannot hurt. However, we note two critical caveats:
  1. The information is not free to the applicant. The cost is their time, dignity, and potential risk of harm (e.g., losing housing because of delays).
  2. Once we know something, we might be forced to act in ways that are harmful (e.g., reporting fraud, which might have severe consequences for the applicant).

  Therefore, our procedure must:
  - Only ask for information when the expected benefit (in terms of avoiding a bad grant) outweighs the cost to the applicant and the risk of harm.
  - Consider that some information might force us into actions that we would otherwise avoid (like reporting).

  We'll structure the procedure as a decision tree. At each step, we ask a question only if:
     a) The answer could change our decision (if we are going to act on it), and
     b) The expected cost to the applicant of providing the information is less than the expected benefit of having it.

  But we cannot compute exact probabilities and costs. Therefore, we will use a set of heuristics that are grounded in the theory but practical for volunteers.

  The procedure will have the following steps:

  1. **Initial Screening**: 
     - We start by reading the application and noting the type of request (rent, car repair, etc.), the amount, and the explanation.
     - We check our shared list of refused applicants (with the other two groups) to see if the applicant is on it. If so, we reject without further questions (unless there are new circumstances, but we don't have time for appeals).

  2. **Determine the "Decision Threshold"**:
     - We note that without any verification, we would typically approve the grant (given our history of few refusals). So the default is to approve unless we have a reason to doubt.
     - We then consider: what kind of doubt could be resolved by verification? We are concerned about:
          a) The money not being used for the stated purpose (like the car repair example).
          b) The applicant having resources that would make the grant unnecessary (if we had a policy about that, but we don't? We don't means-test beyond the stated emergency).

     However, we do not typically refuse because the applicant has some income. We are a mutual-aid fund, and our goal is to help in an emergency.

     Therefore, the main risk we are trying to mitigate is fraud in the sense of misrepresentation of the purpose. We are less concerned with the applicant's overall financial situation.

  3. **When to Ask for Verification**:
     - We will only ask for verification when:
          - The request is for a specific bill (like rent, utility, car repair bill) and the bill is payable to a third party (so we can verify by seeing the bill and then pay the third party) OR
          - There is a specific reason to doubt the story (e.g., inconsistencies in the application, or the same applicant having multiple requests in a short time) OR
          - The amount is above a threshold (say, $500) where the risk is higher.

     But note: we don't want to ask for pay stubs to verify income because that is not the point of our fund. We are not means-testing.

     Therefore, we focus on verifying the *expense* that the grant is for.

     Proposed verification rules:

     a) For rent: We ask for a lease agreement or a letter from the landlord. Why? Because we can pay the landlord directly, which also prevents the money being used for something else. If the applicant cannot provide this, we might consider a bank statement showing the rent payment (but that is more intrusive and we don't store it) or we might decide to trust and pay the applicant.

     b) For car repairs: We ask for a quote from the mechanic and then we pay the mechanic directly.

     c) For funeral costs: We ask for a bill from the funeral home and pay the funeral home.

     d) For deposits: We ask for a lease or a letter from the landlord stating the deposit required.

     However, if the applicant does not have the document, we don't automatically reject. We proceed to step 4.

  4. **Cost-Benefit Analysis (Heuristic)**:
     - If the applicant cannot provide the document and we are not paying the third party, then we consider:
          - The risk of the money being misused (which we estimate based on the type of expense: high for car repairs because we had a problem, low for rent because we haven't had problems? But we had a problem with a car repair, so we are more cautious there) vs.
          - The cost to the applicant of not getting the grant (losing housing, etc.) and the cost of the delay in getting the document.

     Since we cannot quantify, we set up a rule:

     - For rent: If the applicant cannot provide a lease or landlord letter, we ask if they have any other proof (like a past due notice). If not, we note that but still approve because the cost of not paying (eviction) is very high and we have had very few problems. We do not ask for pay stubs because that doesn't verify the rent expense.

     - For car repairs: We insist on a quote because we can pay the mechanic. Without it, we cannot approve because we had a prior incident and the risk is high. We might make an exception if the car repair is urgent and the applicant has a history with us? But we don't have a database. So without a quote, we reject.

     - For funeral expenses: We try to get a bill but if not, we trust because the risk is low (funeral homes are usually legitimate) and the need is high.

  5. **Handling Information that Forces Action**:
     - If in the process we learn something that we are obliged to report (e.g., evidence of fraud), we note that the act of asking for verification has now imposed a cost on the applicant (and on us) that we cannot avoid. Therefore, we should be cautious about asking for information that might reveal fraud unless we are prepared to report.

     How to handle:
     - We will not ask for information that is not directly relevant to the expense (like pay stubs) because that might reveal unrelated issues (like underreporting income to other agencies) that we are then obliged to report.

     - We will only ask for information that is necessary to verify the expense and that we can act on by paying the third party. This minimizes the chance of uncovering unrelated issues.

  6. **The Procedure Steps**:

     Step 1: Read the application and check the shared refusal list. If on the list, reject (unless there are new circumstances that we have time to consider? But we don't, so reject). Else, proceed.

     Step 2: Categorize the request (rent, car repair, funeral, deposit, other).

     Step 3: For each category, we have a standard verification request:
          - Rent: Ask for lease or landlord letter (with contact info) and a past due notice if available. We will pay the landlord directly if possible. If the applicant cannot provide, ask: "Is there any other way to verify the rent and the arrears?" If not, we note that and still approve (with a note that we are taking a risk) because the cost of rejection is too high.
          - Car repair: Must have a quote from a mechanic. We will pay the mechanic. Without it, reject.
          - Funeral: Ask for a bill from the funeral home and pay the funeral home. If not available, we can approve by paying the applicant but note that we are taking a risk (but historically low risk).
          - Deposit: Ask for lease or landlord letter stating the deposit required. We pay the landlord if possible. If not, we can approve by paying the applicant but note the risk.

     Step 4: If the applicant provides the document, we verify by looking at it (we don't store it). If it matches the application, approve and pay the third party if possible. If it does not match, we can either adjust the grant (if the amount is less) or reject (if the expense is not as stated).

     Step 5: If the applicant does not provide the document, then for rent, funeral, and deposit: we may still approve (with a note) but for car repair we reject.

     Step 6: If at any point we see evidence of fraud (e.g., a document is forged, or the applicant admits to lying), then we must report as per our funder's agreement and reject. We also add the applicant to the shared refusal list.

     Step 7: If the request is for something else (like food, medical bills, etc.), we do not ask for verification because we have no standard way and the risk is low (we haven't had problems). We approve if the story is plausible.

     Step 8: We do not ask for pay stubs or income verification because that is not relevant to the emergency and it might force us to learn about other issues.

     Step 9: Time constraint: If we are running out of time and the applicant hasn't provided documents, we either:
          - For rent, funeral, deposit: approve without verification (with a note) and hope to do better next time.
          - For car repair: reject because we cannot proceed without the quote.

     However, we must do this in 10 minutes per application. So we set a time limit for each step.

     We structure the call-back: one volunteer calls the applicant immediately after the application is received (before the meeting) to ask for the necessary documents. Then at the meeting, we have the documents (if provided) or we know they are not provided.

  7. **What the Procedure Cannot Do**:
     - It cannot eliminate all risk of fraud.
     - It cannot avoid the possibility of harming an applicant by delaying or by forcing a report.
     - It cannot resolve the fundamental disagreement in the committee about the purpose of the fund (whether we are here to trust or to verify). The procedure is a compromise: we verify only the expense and only when it is practical and when the risk is high.

     The procedure stops being a procedure and becomes a vote when:
          - The application does not fit the categories (e.g., an unusual request).
          - The verification document is not available but the applicant offers an alternative that is not in the procedure.
          - There is a dispute about whether the provided document is sufficient.

     In these cases, we vote.

  Now, let's run the procedure on three applications:

  **Application 1: $400 rent grant**

     Step 1: Not on the refusal list.
     Step 2: Category: rent.
     Step 3: We ask for a lease or landlord letter and past due notice. The applicant provides a past due notice from the landlord (with landlord contact info) but no lease. The notice has the amount due and the property address.
     Step 4: We verify the amount and the landlord's contact. We call the landlord (if we have time) to confirm? But we don't have time. We look at the notice: it looks legitimate. We decide to pay the landlord directly. We note that we are paying the landlord to avoid the risk of misuse.
     Step 5: Not applicable (document provided).
     Step 6: No fraud detected.
     **Decision: Approve, pay the landlord.**

  **Application 2: An application that forces a report**

     Let's say it's a rent grant. We ask for a lease or landlord letter. The applicant provides a letter from the landlord, but when we look at it, we notice that the landlord's contact information is the same as the applicant's phone number (which we have). We call the number and the applicant answers and pretends to be the landlord? Or we notice the letter is forged.

     Step 4: We detect that the document is forged. Now, we are obliged to report this to our funder and add the applicant to the shared refusal list.
     Step 6: We reject and report.
     **Decision: Reject, report, and add to refusal list.**

     This applicant will now be on the shared list and the other groups will know.

  **Application 3: Stop asking for something we always asked for**

     We used to ask for pay stubs for rent grants? But the procedure says we don't. So let's take a rent grant where the committee member might want to ask for a pay stub.

     Step 1: Not on the list.
     Step 2: Rent.
     Step 3: We ask for lease or landlord letter. The applicant provides the lease and a past due notice. We are satisfied. But then a committee member says: "We should also check if they have income to cover future rent, so we should ask for a pay stub."

     The procedure says: we do not ask for pay stubs because:
          - We are not means-testing.
          - The purpose is to cover the rent arrears, not to ensure the applicant's long-term stability.
          - Asking for a pay stub might reveal information that we are then forced to act on (e.g., if we see they are working but not reporting to benefits agency) and we don't want that.

     Therefore, the procedure stops us from asking for the pay stub.

     **Decision: We have the lease and past due notice, so we approve without asking for pay stub.**

     This might annoy the treasurer (you) because you are in the half that doesn't like verification, but note: we are still verifying the expense. We are just not verifying income.

     However, the procedure does not require income verification, so we skip it.

  Finally, what the procedure cannot do:

  - It cannot prevent all bad outcomes. For example, an applicant might use the money for something else even if we pay the landlord (if the landlord is not legitimate). But we are reducing the risk.
  - It cannot eliminate the need for human judgment in borderline cases.
  - It cannot change the fact that asking for documents might cause delays and lead to harm (like the woman who lost her room). We try to minimize this by only asking for essential documents and by paying quickly.

  The procedure becomes a vote in cases of ambiguity, new situations, or when the committee feels the procedure is not adequate. We accept that and vote.

  This procedure is a compromise: it asks for verification only when necessary to confirm the expense and when we can pay the third party, and it avoids unnecessary requests that might harm the applicant or force us into unwanted actions.
answer: |-
  Below is a practical, step-by-step procedure grounded in decision theory (specifically, the value of information, including Good's theorem) for your mutual-aid fund. It addresses your constraints: no statistical expertise needed, 10 minutes per application, no document storage, and alignment with decision-theoretic principles. I'll summarize the key theory first, then present the procedure, and finally apply it to your three test cases.

  ### Core Decision-Theoretic Principles
  1. **Good's Theorem (Value of Information)**:  
     - Information has positive expected value if:  
       - It is free to obtain (zero cost to the decision-maker).  
       - It can change your decision ("actionable").  
       - On average, it leads to better outcomes (e.g., avoiding bad grants).  
     - **Limitations in your context**:  
       - **Not free for the applicant**: The cost is dignity, time, or risk (e.g., delayed aid causing harm). This violates the "free to obtain" assumption.  
       - **Forced actions**: If information reveals fraud (per your funder agreement), you must report it, potentially harming the applicant. This makes information costly even if it changes your decision.  
       - **Average vs. individual harm**: Good's theorem guarantees "on average" improvement, but individual cases can be worse (e.g., an applicant loses housing due to verification delays).  

  2. **When to Seek Information**:  
     - Only seek information if:  
       - **Actionability**: It could change your decision (e.g., proof of fraud would lead to rejection).  
       - **Cost-benefit**: Expected benefit (e.g., avoiding a bad grant) > expected cost to the applicant (e.g., dignity loss, delay).  
     - **Do not seek information if**:  
       - It won’t change the decision (e.g., you’d approve regardless).  
       - The cost to the applicant outweighs the benefit (e.g., invasive requests for small grants).  

  3. **Stopping Rules**:  
     - Stop if information is unobtainable without excessive cost to the applicant.  
     - Stop if information forces a harmful action (e.g., mandatory reporting) that outweighs the grant’s benefit.  
     - Defer to human judgment when values conflict (e.g., "Is dignity more important than fraud risk?").  

  ### Verification Procedure for Mutual-Aid Grants  
  **Goal**: Minimize harm while ensuring grants are used as intended.  
  **Process**: One volunteer (the "reviewer") handles each application sequentially during the 90-minute call. Total time: 10 minutes/app.  

  #### Step 1: Initial Assessment (2 minutes)  
  - **Questions to ask**:  
    1. Is the applicant on the shared refusal list? (Yes → Reject; end).  
    2. Is the request for a documented third-party expense (e.g., rent, car repair, funeral bill)? (Yes → Proceed to Step 2; No → Skip to Step 3).  
    3. Is the request plausible and consistent? (No → Flag for Step 3).  
  - **Sufficient answers**:  
    - Refusal list: Cross-check with the shared list (no docs needed).  
    - Third-party expense: Any verbal/written description of the payee (e.g., "rent to landlord Jane Doe").  
    - Plausibility: No internal contradictions (e.g., "car repair" for an applicant with no car).  
  - **Stop with "no" if**: Applicant is on the refusal list.  
  - **Hand to humans if**: Plausibility is ambiguous (e.g., complex backstory). Vote on whether to proceed.  

  #### Step 2: Verification for Third-Party Expenses (4 minutes)  
  - **Questions to ask (in order)**:  
    1. Can we pay the third party directly? (Yes → Ideal; skip to question 2. No → Proceed cautiously).  
    2. Is there a low-cost way to verify the expense? (e.g., bill screenshot, landlord/mechanic contact).  
    3. Does verification risk mandatory reporting? (e.g., signs of fraud).  
  - **Sufficient answers**:  
    - Direct payment: Applicant provides contact info for the payee (e.g., landlord phone number).  
    - Low-cost verification: Bill screenshot, email from payee, or brief call with payee. No sensitive docs (e.g., pay stubs).  
  - **Stop with "no" if**:  
    - Expense is unverifiable at low cost (e.g., applicant cannot provide bill screenshot).  
    - Verification would delay aid beyond 48 hours (cost > benefit).  
  - **Hand to humans if**:  
    - Risk of mandatory reporting arises (vote on whether to proceed, knowing reporting may harm the applicant).  
    - Direct payment is impossible (vote on trust vs. risk).  

  #### Step 3: Risk-Benefit Evaluation (3 minutes)  
  - **For non-third-party requests** (e.g., food, clothing) **or flagged plausibility issues**:  
    - **Questions to ask**:  
      1. Is the grant amount low (<$300)? (Yes → Less risk; lean toward approval).  
      2. Is there high cost of rejection? (e.g., homelessness; Yes → Lean toward approval).  
      3. Does verification violate dignity? (e.g., requesting pay stubs for non-income-related grants; Yes → Avoid verification).  
    - **Sufficient answers**:  
      - Verbal confirmation of urgency (e.g., "I will be evicted tomorrow").  
      - No verification required unless fraud is suspected.  
  - **Stop with "no" if**:  
    - High fraud risk + low cost of rejection (e.g., luxury item request).  
  - **Hand to humans if**:  
    - Values conflict (e.g., "Should we prioritize dignity over fraud prevention?"). Vote.  

  #### Step 4: Final Decision (1 minute)  
  - **Approve if**:  
    - No refusal-list match + plausible need + (verification successful or low-risk/high-urgency).  
  - **Reject if**:  
    - Refusal-list match, unverifiable high-risk expense, or fraud requiring reporting.  
  - **Documentation**: Write the decision paragraph for funders, including:  
    - "Approved based on [trust/verification]" or "Rejected due to [refusal-list/risk]."  
    - No applicant documents stored; notes only (e.g., "landlord verified rent arrears").  

  ### Key Features  
  - **Avoids unnecessary verification**: No blanket requests (e.g., pay stubs). Focuses on actionable info.  
  - **Prioritizes applicant dignity**: Verification only when benefit > dignity cost.  
  - **No database/docs**: All info is reviewed once and discarded.  
  - **Human judgment for values**: Delegates subjective trade-offs (e.g., dignity vs. fraud risk) to a vote.  

  ---  

  ### Test Case Applications  
  I’ll apply the procedure neutrally. Assume all applicants are not on the refusal list and requests are plausible unless stated.  

  #### Case 1: $400 Rent Grant – Proposed Verification: Pay Stub  
  - **Step 1**: Rent is a third-party expense → Proceed to Step 2.  
  - **Step 2**:  
    - Ask: "Can we pay the landlord directly?" Applicant provides landlord’s phone number.  
    - Low-cost verification: Request a past-due bill screenshot or landlord contact (not a pay stub).  
    - Pay stub? Not requested because:  
      - **Non-actionable**: It doesn’t verify the rent expense (only income).  
      - **Dignity cost**: High (performing poverty).  
      - **Cost > benefit**: Risk of delay/harm outweighs fraud risk (only 1–2 fraud cases/year).  
    - Landlord confirms rent arrears via phone → Verification successful.  
  - **Step 4**: Approve (pay landlord directly).  
  - **Outcome**: Approved. **No pay stub requested**—procedure overrules committee habit.  

  #### Case 2: Application Triggering Mandatory Reporting  
  - **Scenario**: Applicant requests $600 for car repairs. In Step 2, they provide a mechanic’s quote. During verification, the mechanic admits the quote is fake (collusion).  
  - **Procedure**:  
    - **Step 2**: Fraud detected → Triggers mandatory reporting per funder agreement.  
    - **Hand to humans**: Committee votes on whether to report (values conflict: aid vs. obligation).  
      - Vote outcome: Report (required by agreement).  
  - **Step 4**: Reject. Applicant added to refusal list and reported. Outcome shared with other groups.  
  - **Outcome**: Rejected, reported, and listed.  

  #### Case 3: Stop Requesting Unnecessary Verification  
  - **Scenario**: Funeral grant request ($700). Historically, your group always asked for a death certificate.  
  - **Procedure**:  
    - **Step 1**: Funeral is a third-party expense → Proceed to Step 2.  
    - **Step 2**:  
      - Ask: "Can we pay the funeral home directly?" Applicant provides funeral home contact.  
      - Low-cost verification: Request an invoice (not death certificate).  
      - Why skip death certificate?  
        - **Non-actionable**: Fraud risk is minimal (funeral homes rarely collude; only 1 refusal in 3 years).  
        - **Dignity cost**: High (grief performance).  
        - **Cost > benefit**: Delay could delay burial; invoice suffices.  
      - Funeral home email confirms cost → Verification successful.  
  - **Step 4**: Approve (pay funeral home).  
  - **Outcome**: Approved. **Death certificate not requested**—procedure eliminates unnecessary ask.  

  ---  

  ### What the Procedure Cannot Do  
  1. **Eliminate All Risk**: It reduces but doesn’t erase fraud risk or individual harm (e.g., an applicant might still lose housing due to delays).  
  2. **Override Values Conflicts**: When trade-offs involve core principles (e.g., "Should we ever prioritize dignity over compliance?"), it defaults to a vote. This happens in:  
     - Step 1 (plausibility disputes).  
     - Step 2 (mandatory reporting risks).  
     - Step 3 (high-dignity-cost verification).  
  3. **Guarantee "Fair" Outcomes**: Good’s theorem ensures average improvement, but individual harm (e.g., rejection due to verification delay) is possible.  
  4. **Handle Ambiguous Evidence**: If verification is incomplete (e.g., landlord doesn’t answer), it relies on human judgment.  
  5. **Replace Trust**: If your committee values trust over verification, the procedure can’t resolve that—it only optimizes for harm reduction.  

  ### Where the Procedure Ends and Voting Begins  
  The procedure stops being algorithmic and requires a vote when:  
  - **Values are in conflict**: E.g., "Is verifying this expense worth the dignity cost?" (Step 3).  
  - **Forced actions arise**: E.g., mandatory reporting that could harm the applicant (Step 2).  
  - **Ambiguity in evidence**: E.g., plausibility is unclear (Step 1).  
  - **Edge cases**: Unusual requests (e.g., non-standard expenses).  

  In these cases, six people must vote based on what they believe the fund is for—**mutual aid** (prioritizing speed/dignity) or **fiduciary duty** (prioritizing fraud prevention). The procedure ensures this vote is informed by decision theory (e.g., "Does verification have net positive value here?"), but it can’t reconcile philosophical differences.  

  ---  
  This procedure balances decision theory with your practical realities. It minimizes harm, respects applicant dignity, and reduces verification to only what’s actionable—while making explicit where human judgment must take over. Use the test cases as templates for training volunteers.
