prompt: |-
  I'm trying to get straight on something in the demandingness objection to consequentialism, and every time I read the standard stuff on it I come away feeling like two seperate complaints have been stapled together. One complaint is about the ledger: consequentialism says keep giving until the marginal cost to you matches the marginal benefit to someone else, so it eats your projects, your relationships, your whole life. The other complaint isn't about the size of the requirement at all, it's about its mode: consequentialism makes morality into something that can be *demanded* of you -- addressed to you, enforced, resented when you fall short. Call that the address reading. What I want is an explanation of the issue, made sharp and then actually used. Are these one objection or two? What is each one really a complaint about -- the content of the requirement, the agent's psychology, or the interpersonal standing of morality itself? And which of the familiar replies engages which reading: agent-centred prerogatives, satisficing, rule or indirect versions, separating the obligatory from the blameworthy, "ought implies can" plus some premise about what's motivationally available to a person? My suspicion is that the address reading is the load-bearing one, that prerogatives only answer the ledger complaint, and that they maybe make the address complaint worse, since a prerogative is still a permission handed to you by morality. Tell me if that's right and, if it isn't, exactly where it goes wrong. One more thing I want out of this: is there a principled account of how much morality can demand in the address sense -- does the notion of what can be demanded bottom out in reciprocity, or in some second-personal standing to hold each other to things -- and once you've got that account, does it help the consequentialist or sink her? I don't want the literature, I want the distinction drawn properly and then put to work.
reasoning: |-
  Okay, the user is grappling with the demandingness objection to consequentialism and feels like there are two distinct complaints being conflated. They've identified what they call the "ledger complaint" and the "address complaint." The ledger is about the content—how much consequentialism demands, potentially consuming one's entire life. The address is about the mode—morality being something that can be demanded, enforced, resented. They want clarity on whether these are separate, what each targets, and how various replies (like agent-centered prerogatives) address them. They suspect the address complaint is more fundamental and that prerogatives might even worsen it.

  First, I need to confirm that these are indeed two distinct objections. The ledger is about the quantitative demand—sacrificing personal projects and relationships. The address is qualitative—morality's authority to demand and enforce compliance. They're separate because one could accept the content but reject the mode, or vice versa. For example, even if demands were moderate, the address issue might still arise if morality is seen as overreaching in its authority.

  Next, analyzing each complaint's target. The ledger focuses on the content of moral requirements—what is demanded. It's about ethical theory's implications for an agent's life. The address complaint targets the interpersonal structure—how moral obligations are imposed and enforced, involving resentment, blame, and authority. This ties into second-personal ethics, where moral claims stem from reciprocal relationships.

  The user suspects that agent-centered prerogatives only address the ledger by allowing personal space but might worsen the address because they're still permissions granted by morality. I agree. Prerogatives reduce the content (ledger) by permitting partiality but don't resolve the authority issue (address). In fact, by framing it as a permission, they reinforce morality's overarching authority.

  Other replies: Satisficing lowers demands (ledger) but still operates under morality's authority (address). Rule-consequentialism might moderate demands but retains enforcement. Separating obligation from blame might help with address by limiting enforcement, but it doesn't challenge the underlying authority.

  The user asks if there's a principled account for how much can be demanded in the address sense. This relates to reciprocity and second-personal standing. Stephen Darwall's work suggests that legitimate demands require mutual accountability. If morality's demands are too extreme, they violate reciprocity, making resentment inappropriate. This could sink consequentialism if its demands exceed what can be reasonably demanded of an agent within reciprocal relationships.

  So, the address complaint is indeed load-bearing. Even if demands are reduced (ledger), the authority issue remains. Consequentialists must address the interpersonal structure, possibly by incorporating reciprocal accountability or reframing obligations as mutual rather than imposed.
answer: |-
  You've nailed a crucial distinction that often gets blurred. **The "ledger complaint" and the "address complaint" are fundamentally separate objections, targeting different aspects of consequentialism.** Understanding this split clarifies why standard replies often miss the mark for one complaint while addressing the other, and why your suspicion about the "address" complaint being load-bearing is insightful, though needing refinement. Let's put the distinction to work:

  1.  **The Ledger Complaint (The "What"):**
      *   **Complaint:** Focuses on the *content* and *extent* of the requirement. Consequentialism demands too much *stuff* – sacrificing personal projects, deep relationships, self-development, leisure – essentially consuming the agent's life to maximize the good. The problem is the *quantity* and *nature* of the sacrifice required ("eats your projects, your relationships, your whole life").
      *   **Target:** Primarily the *content* of the moral requirement imposed by the theory. It's an objection to what consequentialism *says you must do*.
      *   **Agent's Psychology:** Implied secondary concern: such constant, extreme sacrifice is psychologically unsustainable or alienating, leading to burnout or resentment, but this is derivative of the primary content complaint.

  2.  **The Address Complaint (The "How" and "By Whom"):**
      *   **Complaint:** Focuses on the *mode* or *structure* of the requirement. Consequentialism presents morality as something that can be *demanded* of the agent *by others* (or impersonally "by morality"), enforced through blame, resentment, and sanction. The problem is the *interpersonal authority* implied – that others (or morality itself) have the *standing* to demand *this level* of sacrifice from you as a matter of enforceable obligation. It turns morality into an external, potentially oppressive, taskmaster ("addressed to you, enforced, resented when you fall short").
      *   **Target:** Primarily the *interpersonal standing* implicit in the theory's structure. It's an objection to the *kind of claim* consequentialism makes on the agent *in relation to others*. It questions who has the *right* or *authority* to demand such things.
      *   **Agent's Psychology:** Secondary concern: experiencing morality *as* a constant demand enforced by blame/resentment is psychologically burdensome and alienating, reinforcing the sense of being under an external yoke.

  **Why They Are Distinct:**
  *   You could imagine a theory imposing *modest* demands but doing so in a way that feels like an illegitimate, enforceable *demand* (Address complaint without Ledger).
  *   Conversely, you could imagine consequentialism demanding *everything* (Ledger) but *not* framing it as something others have the standing to demand, enforce, and resent you for *personally* failing to do (e.g., perhaps framing it as a tragic cosmic imperative, or solely a matter of regret, not blame). The Ledger complaint would remain, but the Address complaint might vanish.
  *   The Ledger complaint is about *what* morality requires you to *do*. The Address complaint is about *how* others (or morality) relate to you *in virtue* of those requirements – the structure of accountability.

  **Applying the Distinction to Replies:**

  *   **Agent-Centered Prerogatives (Scheffler):**
      *   **Engages:** Primarily the **Ledger complaint**. By allowing agents to give *some* preferential weight to their own projects/relationships even when slightly more good could be done impartially, it directly reduces the *content* of the demand ("eats your life" less). It carves out protected space.
      *   **Address Complaint:** **Worsens it or leaves it untouched, potentially exacerbating it.** Why? Because a prerogative is a *permission granted by morality itself* ("Morality says you *may* favor yourself here"). This reinforces the idea that morality is the ultimate sovereign *allowing* you this space, not that the space exists prior to or independently of morality's authority to demand. The structure of morality as the demanding authority remains intact. The permission is still something *morality addresses to you*. It doesn't challenge the *standing* of morality (or others) to demand the *remainder*.
      *   **Your Suspicion Confirmed:** Yes, prerogatives tackle Ledger but likely make Address worse by making the permission *itself* an artifact of the demanding system.

  *   **Satisficing Consequentialism (Slote):**
      *   **Engages:** Primarily the **Ledger complaint**. By requiring agents only to produce a "good enough" outcome, not the *best possible*, it significantly reduces the *extent* of the required sacrifice. Less stuff needs giving up.
      *   **Address Complaint:** **Leaves it largely untouched.** Morality (or others) can still *demand* that you achieve the "good enough" threshold. Falling short is still blameworthy/resentable. The structure of demand/enforcement remains, even if the threshold is lower. It doesn't question the *authority* to demand at all.

  *   **Rule Consequentialism / Indirect Consequentialism:**
      *   **Engages:** Primarily the **Ledger complaint** (and potentially psychological sustainability). By focusing on rules or motivations whose general acceptance/possession maximizes good, it often justifies rules/motives that protect personal projects and moderate demands in practice.
      *   **Address Complaint:** **Ambiguous/Problematic.** Rules are typically things we can demand compliance with and resent violations of. If RC says the optimal rule is "Donate 10%" (reducing Ledger), then failing to donate 10% *is* blameworthy/resentable – the Address structure remains. If RC says the optimal rule incorporates something like "Respect personal boundaries," it *might* begin to engage the Address complaint by limiting the *scope* of legitimate demands, but this depends on the *basis* of that rule. If it's purely instrumental (respecting boundaries *causes* more good), then it's still morality (via rules) *granting* the space, not denying its authority. The enforcement mechanism for the rules themselves retains the Address structure.

  *   **Separating the Obligatory from the Blameworthy:**
      *   **Engages:** Primarily the **Address complaint**. This is the most direct counter. It grants that consequentialism defines what's *objectively best/right* (Ledger remains high!) but denies that failing to do the objectively best thing is *always* blameworthy or something others have standing to resent/enforce. Blameworthiness requires, e.g., intentions, motives, or capacities the agent lacked ("ought implies can" plus epistemic/motivational constraints). Falling short might be regrettable, even wrong, but not necessarily a *personal failing* warranting resentment *from others*.
      *   **Effect:** This directly attacks the "enforced, resented" part of the Address complaint. It says morality (as defined by consequentialism) *requires* X, but morality (or others) *cannot justly demand* X *of you personally* in a way that warrants blame/resentment if you fail, due to your circumstances. It creates a buffer between the objective requirement and the interpersonal standing to hold accountable.
      *   **Cost:** It risks making "right action" seem alien or disconnected from what we can reasonably expect of agents, potentially weakening the practical force of morality. The high Ledger remains conceptually.

  *   **"Ought Implies Can" + Motivational Availability:**
      *   **Engages:** A hybrid. "Ought implies can" (literal impossibility) *might* slightly reduce the Ledger in extreme cases, but its main force is against the Address complaint. If you *literally cannot* do X (psychologically or physically), then demanding it is incoherent and blaming you unjust. Adding "motivational availability" (what a reasonably virtuous/well-constituted person *could* bring themselves to do) significantly reduces the Ledger *and* directly addresses the Address complaint. It says morality cannot *demand* (in the enforceable, blameworthy sense) actions that exceed the motivational capacities of a decent human being. This sets a psychological limit on both the content (Ledger) and the enforceability (Address).

  **Your Suspicion & The Load-Bearing Complaint:**
  You're largely right. **The Address complaint is often the deeper, more persistent worry.** Consequentialism's structure inherently makes the *maximization of the good* the sovereign principle. Any requirement derived from it (even a moderated one via prerogatives or satisficing) inherits this structure: Morality (or others, invoking morality) *demands* compliance. Prerogatives *do* mitigate the Ledger but, as you say, by framing the space as a *permission*, they reinforce morality's overarching authority, potentially making the Address complaint *more* salient ("See, even my 'free' time is just what morality *allows* me").

  The Ledger complaint can be pragmatically addressed (prerogatives, satisficing, rules). The Address complaint strikes at the **second-personal authority** constitutive of how consequentialism (especially act-consequentialism) functions. Reducing the Ledger doesn't automatically resolve the Address issue; it just makes the demands less extreme, but the *structure of demand itself* remains problematic if it's seen as overreaching.

  **The Principled Account of Demandability (Address):**
  This is where second-personal ethics (Stephen Darwall) is crucial. What can be *demanded* (in the blame/enforcement/resentment sense) is tied to **reciprocity** and **mutual accountability** among free and equal persons.

  *   **Bottoming Out:** Legitimate demands bottom out in our shared standing as persons capable of recognizing and holding ourselves and others accountable to norms governing our interactions. We have the *standing* to demand of others only what they can reasonably demand of us (reciprocity), and only what respects their equal moral agency.
  *   **The Limit:** Morality can only *demand* (in the enforceable, second-personal sense) actions that:
      1.  **Respect the agent's basic status and autonomy:** Demands cannot reduce the agent to a mere instrument for others' good. They must leave space for the agent's own life and projects as intrinsically valuable aspects of their personhood.
      2.  **Are within the scope of mutual accountability:** They must be actions whose performance we can reasonably expect *from each other* in a cooperative scheme based on reciprocal respect. Extreme, life-consuming sacrifice typically violates both (1) and (2). It treats the agent instrumentally and exceeds what we could mutually demand of each other without undermining the very equality the demand presupposes.
      3.  **Are motivationally accessible:** As noted earlier, demanding the supererogatory or psychologically impossible violates the conditions for fair blame.

  **Does this Sink or Save Consequentialism?**

  *   **Sinks Act-Consequentialism:** Standard AC is sunk by this account. Its sovereign principle (maximize good) recognizes no inherent limits based on reciprocity or the agent's separate status. It *does* treat the agent as an instrument. Its demands can easily violate mutual accountability ("I demand you sacrifice everything for strangers, even though I wouldn't, and you couldn't demand the same of me without contradiction"). Its structure of requirement is fundamentally first-personal/impersonal (the calculus of good), not second-personal (mutual accountability).
  *   **Challenges Other Forms:** Rule Consequentialism *might* be adapted if the optimal rules are justified *because* they embody norms of reciprocity and mutual accountability that respect persons, not just because they instrumentally cause good. However, if the justification remains purely instrumental, the Address complaint lingers – the rules are demands *from morality* based on consequences, not *from each other* based on mutual recognition.
  *   **Points to a Solution?** To survive the Address complaint, consequentialism would need to *integrate* the second-personal standpoint. It might argue that maximizing good *just is* what mutual respect among equals requires (a big claim!) or that the optimal social rules/motives *constitute* the norms of mutual accountability. This is difficult but not impossible. However, it likely requires abandoning the *pure* maximizing, agent-neutral structure of classic AC and incorporating agent-relative reasons rooted in relationships and reciprocity directly into the theory's foundation.

  **Conclusion:**
  You've correctly identified two distinct strands. The Ledger complaint is about *how much* consequentialism requires. The Address complaint is about *the nature of the authority* claiming to require it – its demandability, enforceability, and resentment-worthiness. Standard replies like prerogatives and satisficing primarily target the Ledger, often reinforcing the Address complaint. Separating obligation from blameworthiness and invoking "ought implies can" + motivational limits more directly target the Address complaint. The principled account of legitimate demands stems from reciprocity and mutual accountability in the second-person standpoint. This account poses a severe, likely fatal, challenge to act-consequentialism's core structure, as its demands frequently lack the reciprocity and respect for the agent's separate status that legitimizes moral demands in the first place. The Ledger complaint is painful; the Address complaint strikes at consequentialism's moral authority.
