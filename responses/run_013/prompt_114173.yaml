prompt: |-
  ok so I'm drafting a chapter on how conventions get replaced, and I want to use Sweden's H-day as the case, but I keep going back and forth on whether Lewis is the right frame or whether I'm just using him as a foil. Can you do the analysis properly and then tell me where it actually breaks?

  Facts so you don't have to guess at them: Sweden drove on the left until 3 September 1967, even though Norway, Denmark and Finland all drove on the right and something like 5 million vehicles a year crossed the borders. In a 1955 referendum about 83% voted to keep driving on the left. The Riksdag approved the switch anyway in 1963, and after a multi-year publicity campaign the country changed over at 5am on a Sunday: roads cleared, cars stopped at 4:50, moved to the other side, stopped again, then off at 5:00. Fatalities dropped sharply for a while, then the accident rates were back to pre-switch levels by 1969. Trains and the Stockholm metro never switched and still run on the left.

  Set it up as a Lewis convention first: who the agents are, what the coordination problem is, whether the old left-hand rule met his conditions including the one about there being another regularity that would have served just as well, and whether the new rule is a convention or something else given that a parliament installed it and a large chunk of the population had voted against it.

  Then the strains. Does the arbitrariness condition hold for the old rule at all, once the border traffic is in play — is the relevant game two drivers meeting on a road, or an n-player game with a network externality across the border, and does the answer change whether the left-hand rule was ever a convention? What do we do with a state that can manufacture common knowledge on a national scale, which looks like it's doing the entire explanatory work and isn't really in Lewis? If everyone follows a rule and expects everyone else to follow it, but it's also backed by law, is it still a convention? And the trains: same country, comparable coordination problem, no switch — is that the theory correctly declaring itself out of scope because signals replace mutual expectation, or is it a genuine miss? Also say something about the temporary safety gain and what it implies about whether the content of the new rule mattered or only its salience.

  Then the other direction: what does the episode show about the arbitrariness condition and about whether conventions have to be efficient. No citations needed, I know the literature, I just want the mapping and the failure points.
reasoning: |-
  We are analyzing the Swedish H-day (1967) as a case study for how conventions get replaced, using David Lewis's theory of conventions as a framework. We will set up the situation as a Lewis convention and then examine the strains and where the theory breaks.

  ### Step 1: Setting up as a Lewis Convention

  **Agents:** The drivers in Sweden (and potentially also pedestrians, but primarily drivers).

  **Coordination problem:** The problem of avoiding collisions and smoothly coordinating the flow of traffic when two vehicles meet or cross paths. The problem is symmetric: both drivers want to avoid a collision and have a preference for coordinating on the same side (left or right). The situation is recurrent and involves a large population.

  **Old Rule (Left-hand rule):** 

  - **Condition 1 (Regularity):** There was a regularity in behavior: everyone in Sweden drove on the left.
  - **Condition 2 (Common Knowledge and Mutual Expectations):** Everyone expected others to drive on the left, and this expectation was common knowledge. The regularity was self-perpetuating because each driver preferred to drive on the left given that others did so.
  - **Condition 3 (Arbitrariness):** The left-hand rule was arbitrary in the sense that a right-hand rule would have worked just as well for coordination, provided it was universally followed. However, note that by 1967, most of Sweden's neighboring countries (Norway, Denmark, Finland) drove on the right. This raises a question: was the left-hand rule still arbitrary? If we consider the entire system including cross-border traffic, then the right-hand rule might have been better because it matched the neighbors. But within Sweden, the left-hand rule was still arbitrary in the sense that if everyone switched to the right and expected others to do so, it would have been equally effective for domestic coordination. However, the presence of cross-border traffic (which was significant) introduced a non-arbitrary element: the right-hand rule would have been better for coordinating with foreign drivers. Thus, the arbitrariness condition might be challenged because one rule (right) was becoming more efficient due to external factors.
  - **Condition 4 (Reason to conform):** Each driver had a reason to conform to the left-hand rule because they expected others to do so and wanted to avoid collisions.

  **New Rule (Right-hand rule):**

  After the switch, the new rule was the right-hand rule. But was it a Lewis convention?

  - **Regularity:** After H-day, everyone drove on the right.
  - **Common Knowledge and Mutual Expectations:** The massive publicity campaign and the state's role ensured that everyone knew about the switch and expected others to switch. This was manufactured common knowledge.
  - **Arbitrariness:** The right-hand rule was arbitrary in the sense that the left-hand rule could have been maintained if everyone had continued to follow it. However, because of the neighbors, the right-hand rule was less arbitrary in the broader context (it matched the regional standard). But within Sweden, the right-hand rule was arbitrary in Lewis's sense because the left-hand rule would have worked if everyone had continued to follow it (ignoring the border issue). 
  - **Reason to conform:** After the switch, each driver had a reason to conform to the right-hand rule because they expected others to do so.

  However, the switch was not spontaneous. It was imposed by the state (Riksdag) despite a referendum in which 83% voted to keep driving on the left. This raises a question: Is the new rule a convention in Lewis's sense? Lewis emphasizes that conventions arise from the interactions of agents and are self-enforcing. Here, the state intervened to create a new regularity. Lewis does allow that conventions can be supported by law, but he insists that the primary reason for conformity must be the expectation that others will conform and the preference for conformity given that expectation. After the switch, the reason for conformity might be two-fold: the expectation that others are driving on the right and the fear of legal penalty. If the legal penalty is the primary reason, then it might not be a convention. However, in the Swedish case, the publicity campaign and the clear common knowledge of the switch date likely created strong mutual expectations. Moreover, the fact that accident rates returned to pre-switch levels by 1969 suggests that drivers had adapted and were coordinating effectively, indicating that the new rule had become a convention.

  ### Step 2: Strains on Lewis's Theory

  1. **Arbitrariness Condition and the Role of Border Traffic:**
     - Initially, when Sweden was isolated, the left-hand rule was arbitrary. But with increasing cross-border traffic (5 million vehicles a year), the right-hand rule became more efficient because it matched the neighbors. This breaks the arbitrariness condition because one rule (right) was now better than the other. Lewis's theory allows that conventions can be inefficient, but the arbitrariness condition requires that there is an alternative that would have been just as good. However, in this case, the left-hand rule was no longer just as good because it caused coordination problems at the borders. Thus, the old rule might have ceased to be a convention by Lewis's definition because the arbitrariness condition failed? Or, we might reinterpret the coordination problem to include the entire region. But then the agents are not just Swedish drivers but also drivers from neighboring countries. That would make it a multi-population coordination problem, which Lewis does not explicitly address.

  2. **The Role of the State in Manufacturing Common Knowledge:**
     - Lewis's theory relies on common knowledge emerging from repeated interactions and precedents. In H-day, the state created common knowledge through a massive publicity campaign and a fixed switch time. This allowed for a coordinated switch that would have been impossible without a central authority. Lewis's theory does not account for such top-down, state-led coordination. The state did the explanatory work of creating the new convention by fiat and ensuring common knowledge. This breaks the spontaneous, bottom-up emergence that Lewis emphasizes.

  3. **Convention vs. Law:**
     - Before the switch, the left-hand rule was both a convention and a law. Lewis would say that the convention exists independently of the law because drivers follow it primarily due to mutual expectations. But if the law were removed, would the convention persist? In this case, after the switch, the right-hand rule was backed by law. However, the return to normal accident rates by 1969 suggests that the rule had become internalized as a convention. But the initial period of high compliance might have been due to the law. The temporary drop in fatalities (attributed to increased caution) and then the return to baseline might indicate that the law and the novelty of the switch caused extra caution, but then the new convention took hold. This shows that the state can successfully replace one convention with another by law, but the new regularity becomes a convention only when it is self-sustaining.

  4. **The Trains:**
     - Trains and the Stockholm metro did not switch and still run on the left. This is a coordination problem that is similar to road traffic but with key differences. The train system is closed, with dedicated tracks and signals. The coordination is managed by a centralized system (signals, timetables, and control) so that mutual expectations among drivers (engineers) are less critical. Lewis's theory is about situations where the coordination problem is solved by mutual expectations. In the train case, the coordination is enforced by a system of signals and controls, which replaces the need for a convention. Thus, the theory correctly declares itself out of scope because the problem is solved by a different mechanism. This is not a failure of Lewis's theory but a recognition of its domain.

  5. **Temporary Safety Gain:**
     - The temporary drop in fatalities followed by a return to pre-switch levels by 1969 suggests that the content of the new rule (right vs. left) did not matter for safety in the long run. What mattered was the salience and the common knowledge of the switch. During the transition, drivers were extra cautious because they were uncertain about others' behavior. Once the new rule became entrenched, behavior normalized. This supports Lewis's idea that any arbitrary rule can solve the coordination problem equally well, provided there is universal compliance. The safety gain was due to increased attention (salience of the change) and not the side per se.

  ### Step 3: What the Episode Shows About Lewis's Conditions

  - **Arbitrariness Condition:** The Swedish case challenges the arbitrariness condition because the left-hand rule became inefficient relative to the right-hand rule due to cross-border traffic. Lewis allows that conventions can be inefficient, but he maintains that they are arbitrary in the sense that an alternative would have worked if it had been established. However, in this case, the alternative (right-hand rule) was not established in Sweden but was established in the region. This suggests that in a globalized context, the arbitrariness condition may break because the relevant group is larger than the nation. The theory does not easily handle such network externalities across groups.

  - **Efficiency of Conventions:** Lewis argues that conventions are not necessarily efficient. The Swedish case shows that an inefficient convention (left-hand driving in a right-hand region) can persist for a long time (despite the inefficiency at the borders) because of the high cost of switching. The referendum (83% against switching) shows that the population preferred the status quo. The state overruled this, leading to a more efficient outcome. This shows that conventions can be inefficient and that state intervention can move a society to a more efficient convention. However, Lewis's theory does not provide a mechanism for such a switch without a state.

  ### Failure Points of Lewis's Theory in this Case

  1. **Top-down change:** Lewis's theory is about conventions emerging organically. The Swedish change was top-down, state-driven, and planned. The state created the conditions for a new convention by law and publicity. This is outside Lewis's model.

  2. **Network externalities across groups:** The presence of cross-border traffic meant that the coordination problem extended beyond the national population. Lewis's theory is designed for a single, closed population. The case shows the need to extend the theory to multiple populations with interactions.

  3. **The role of law:** When a convention is also enforced by law, it becomes hard to disentangle the motivation for compliance. The Swedish case shows that the state can use law to create a new convention, but the new convention then becomes self-sustaining. Lewis does not address how law and convention interact.

  4. **Temporary effects of salience:** The temporary safety improvement during the switch shows that the salience of a change can override the content of the rule. Lewis's theory does not account for such transitional periods.

  ### Conclusion

  The Swedish H-day case is a fascinating example of convention change. It fits Lewis's framework in some ways (the old rule was a convention, the new rule became one) but breaks it in others. The main breaks are:

  - The state's role in manufacturing common knowledge and forcing the switch is not part of Lewis's model.
  - The arbitrariness condition is challenged by the network externality from neighboring countries.
  - The theory does not account for how conventions change when they are inefficient and when a state can impose change.

  You can use Lewis as a foil to highlight these limitations. The case shows that while Lewis's theory is useful for understanding the stability of conventions, it is less helpful in explaining how they change, especially when change is driven by external factors and state intervention.
answer: |-
  ### Lewisian Analysis of Sweden's H-Day: Mapping and Failure Points  
  **Core Lewis Framework Setup:**  
  - **Agents:** Swedish drivers (population ≈7.8 million in 1967).  
  - **Coordination Problem:** Avoiding collisions when vehicles meet. The game is a *bilateral coordination game* with two pure Nash equilibria: all drive left or all drive right. Payoffs are symmetric—coordination itself matters, not the side.  
  - **Pre-H-Day as Lewis Convention:**  
    - **Regularity:** Universal left-driving in Sweden.  
    - **Common Knowledge & Expectations:** Drivers knew others drove left, expected continued compliance, and knew this was universally known (reinforced by decades of practice).  
    - **Arbitrariness:** Yes—right-driving would have worked *equally well* absent border effects (per Lewis’s baseline model).  
    - **Preference for Conformity:** Strong incentive to avoid collisions; no unilateral deviation benefit.  
    *Conclusion:* Left-driving was a Lewis convention *domestically*.  

  #### **Strains on Lewis's Theory**  
  1. **Arbitrariness Under Border Pressures:**  
     - **Strain:** Lewis assumes a closed system, but Sweden faced *cross-border spillovers*:  
       - Neighbors (Norway/Denmark/Finland) drove right, creating coordination failures at borders.  
       - The relevant game shifts from bilateral (two cars meeting) to an *n-player network game* with externalities.  
     - **Failure Point:** Arbitrariness collapses when one rule (right) becomes Pareto-superior due to *exogenous network effects*. Left-driving was no longer "just as good" as right-driving—it incurred real costs (e.g., border accidents, vehicle modifications). Lewis’s model lacks tools for interdependent conventions across groups.  

  2. **State Enforcement vs. Organic Conventions:**  
     - **Strain:** The switch was imposed by the Riksdag (1963) despite an 83% referendum vote *against* it. Lewis defines conventions as *self-sustaining via mutual expectations*, not state fiat.  
       - Post-H-Day, compliance relied on state-manufactured common knowledge (e.g., nationwide campaigns, synchronized clocks).  
     - **Failure Points:**  
       - **Authority as Common-Knowledge Catalyst:** The state solved the "startup problem" of a new convention by forcing synchronized expectations—outside Lewis’s organic emergence model.  
       - **Motivation for Compliance:** Post-switch, conformity was driven by *law* (fines) and *top-down coordination*, not purely mutual expectations. Lewis’s "preference for conformity" condition blurs when penalties underpin compliance.  

  3. **Trains as Counterfactual:**  
     - **Observation:** Trains/metro kept left-driving.  
     - **Lewisian Explanation:** Signals (tracks, centralized control) *replace* the need for decentralized coordination. Trains don’t require mutual expectations among drivers—only obedience to signals.  
     - **Success for Lewis:** This falls outside convention theory’s scope (per *Convention*, Ch. 4.1). Conventions solve *decentralized* coordination problems; signals solve *centralized* ones.  

  4. **Temporary Safety Gain and Salience:**  
     - **Facts:** Fatalities dropped post-H-Day, then rebounded by 1969.  
     - **Lewisian Interpretation:**  
       - The drop reflects heightened salience (novelty induced hyper-alertness), not rule efficiency.  
       - The rebound confirms Lewis: *Any* arbitrary rule (left or right) works equally well once entrenched—coordination, not content, prevents accidents.  
     - **Strain:** Lewis neglects *transition costs* and salience effects. The safety dip/recovery implies conventions require *stability* for full efficacy, not just existence.  

  #### **Where Lewis Breaks: Key Failure Points**  
  - **Arbitrariness Under Globalization:**  
    Lewis’s arbitrariness condition assumes isolated populations. Sweden’s border traffic exposed the convention to *external efficiency pressures*—right-driving was objectively better *given regional context*. The theory cannot handle conventions in networked systems.  

  - **State Power as Convention-Maker:**  
    Lewis treats conventions as emergent (e.g., traffic norms arise organically). H-Day shows states can *engineer* conventions by:  
    - Overruling majority preferences (vs. Lewis’s reliance on individual incentives).  
    - Creating instant common knowledge (e.g., media campaigns).  
    *This is a core break:* Lewis’s model has no role for coercive institutions.  

  - **Efficiency and Path Dependence:**  
    - Lewis claims conventions need not be efficient. Sweden confirms this: left-driving persisted despite inefficiency (border costs).  
    - **But:** The state *imposed* efficiency. Lewis cannot explain *how* inefficient conventions change without exogenous shocks (e.g., state intervention).  

  - **Law vs. Convention:**  
    - Pre-H-Day, left-driving was both law and convention. Post-H-Day, right-driving was initially law-dominated.  
    - **Failure:** Lewis ambiguates law-convention interplay. If compliance depends on penalties, is it still a convention? Sweden suggests conventions can be *subsets of legal norms*—but Lewis’s definition struggles with hybrid cases.  

  ### Conclusion: Lewis as Foil, Not Framework  
  Sweden’s H-Day fits Lewis **only domestically/pre-border pressures**. It breaks his model by exposing:  
  1. **Networked arbitrariness failure** (cross-border externalities).  
  2. **State capacity to override mutual expectations** (top-down imposition).  
  3. **Transition dynamics** (salience effects, law-driven change).  
  4. **Efficiency interventions** (state resolving path dependence).  

  **Use Lewis to highlight what H-Day reveals:** Conventions are fragile under globalization and mutable by state power. The case study *needs* institutional/network extensions to Lewis—making him a productive foil for analyzing convention change, but insufficient alone. The trains’ persistence, meanwhile, neatly affirms his scope boundaries.
