prompt: |-
  I chair the grant-making committee of a mid-sized private foundation — about $40 million a year, historically divided among four near-term programs (a scholarship fund, a vaccination-logistics partnership, a legal-aid network, and an archive-digitization project), each of which we can evaluate within roughly five years. At our last meeting one trustee circulated a memo proposing that we shift about two-thirds of the coming cycle to a single project: an attempt to build a durable international institution that, if it took hold, would in her estimate improve the long-run trajectory of the next several centuries by something on the order of a factor of a trillion, and which she puts at perhaps one chance in ten million of succeeding — while conceding something like a one-in-a-hundred chance that it entrenches an authoritarian order instead. Her argument is a plain expected-value one: one in ten million times a trillion is still a hundred thousand times the value of anything else on our list, so a committee that declines is choosing a worse world on purpose. Two other trustees have offered stopping rules rather than counter-arguments. The first would forbid any allocation resting on a probability below one in a thousand, on the grounds that our estimates below that threshold are noise and that only a hard floor protects us from being talked into any gamble whatsoever. The second would retain expected-value reasoning but require that the mechanism be independently verifiable within fifty years, so that we can learn something from failure.

  I've been asked to circulate the committee's decision memo before Thursday's vote. Please draft it. It should recommend a concrete allocation for the coming cycle, propose a standing rule (or an explicit decision to have none) for 'astronomical stakes' proposals going forward, specify when that rule should be revisited and what evidence would overturn it, and be written so that trustees who disagree can respond to the reasoning rather than to a verdict. Take seriously the strongest case on the other side from my own: I'll say plainly that I find the anti-fanatic position's line-drawing hard to defend — I cannot see what makes one in a thousand principled and one in ten million absurd, and I am suspicious of any rule whose chief virtue is that it shields us from arguments we dislike — but I want a memo that argues with me rather than one that agrees, and I want the trustees' floor proposals answered on their merits. Please do not give me a survey of decision theory under uncertainty or a taxonomy of positions; give me a document we can act on, in which the recommendation follows from reasons a trustee on the losing side would have to grant are at least relevant.
reasoning: |-
  Hmm, the user is chairing a grant-making committee for a $40 million foundation, and they need help drafting a decision memo for a high-stakes proposal. One trustee wants to shift two-thirds of funds to a project with astronomical potential impact but extremely low odds of success (1 in 10 million), while others propose stopping rules. The user wants the memo to recommend a concrete allocation, propose a standing rule, and address counterarguments fairly.

  The user is clearly experienced in philanthropy but troubled by the ethical dilemma. They personally lean toward the expected-value argument but want the memo to challenge their position. This suggests intellectual honesty and a desire for robust decision-making. The emotional tone is urgent ("before Thursday's vote") and slightly frustrated with what they see as arbitrary thresholds.

  The core tension is between fanaticism (betting on tiny probabilities of huge payoffs) and pragmatism (sticking to measurable impacts). The trustee's proposal is essentially Pascal's Mugging in philanthropic form. The stopping rules attempt to avoid this, but the user finds them unconvincing.

  Key considerations:
  - The foundation's track record: all current programs deliver verifiable near-term results.
  - Risk asymmetry: The 1% chance of enabling authoritarianism might be more probable than it seems.
  - Epistemic limits: Can humans reliably estimate 1-in-10-million odds?
  - Accountability: Foundations must justify decisions to stakeholders.

  For the memo structure:
  1. Frame the dilemma neutrally, acknowledging validity on all sides.
  2. Reject the mega-project due to unquantifiable risks and institutional fit.
  3. Propose a compromise: small allocation for feasibility study.
  4. Establish a standing rule requiring minimum probability thresholds and verifiability.
  5. Build in review mechanisms to avoid rigidity.

  The user's hidden need might be preserving committee cohesion while making a defensible choice. The memo must validate each trustee's concern while guiding toward consensus. The "answering on merits" requirement means no dismissing arguments - e.g., concede that 1/1000 thresholds are arbitrary but argue they're necessary for operational sanity.

  Most delicate part: Refuting the expected-value math without rejecting math itself. Should emphasize that probabilities this low exceed human calibration capacity, and that foundations have duty to avoid "long tails" that could backfire catastrophically. Quote the user's own suspicion about rules designed to shield from uncomfortable arguments, but turn it around: the best rules force engagement with uncomfortable truths within bounds.
answer: |-
  ## Foundation Grant Committee Decision Memorandum  
  **To:** Trustees of the [Foundation Name]  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Near-Term Allocation & Standing Rule for "Astronomical Stakes" Proposals  

  ### I. Background & Proposal Under Consideration
  At our last meeting, Trustee [Name] proposed reallocating ~$26.7M (two-thirds of the coming cycle’s $40M budget) to a single ultra-long-term institution-building project. The case rests on expected-value reasoning: a 1/10,000,000 chance of improving humanity’s trajectory by a factor of ~1 trillion (a net expected value multiplier of 100,000x), vastly exceeding the estimated impact of our existing programs. Trustee [Name] also acknowledges a ~1% risk of entrenching a catastrophic authoritarian outcome. Two counter-proposals were advanced:  
  1. **Probability Floor Rule:** Bar allocations where success probability is estimated below 1/1,000.  
  2. **Verifiability Rule:** Require projects to yield independently verifiable evidence of success/failure within 50 years.  

  This memo recommends a path forward for the coming cycle and proposes a standing rule for similar future proposals.  

  ---

  ### II. Recommended Allocation for Coming Cycle: Decline the Mega-Project  
  **Allocate $40M across existing near-term programs** (Scholarships, Vaccination Logistics, Legal-Aid Network, Archive Digitization), maintaining roughly historical proportions. *Rationale:*  

  1. **The Probability Estimation Problem is Inescapable Below Extreme Thresholds**  
     While Trustee [Name]’s expected-value math is formally correct, its validity hinges on the reliability of the 1/10,000,000 probability estimate. At this threshold, *any* quantitative estimate is arguably speculative noise. Distinguishing between 1/10,000,000 and 1/100,000,000 (or 1/1,000,000) is beyond meaningful calibration. The "1/1,000 floor" proposed by Trustee [A] seeks to address this, but its specific threshold *is* arbitrary—**the core issue isn’t the line’s location, but the collapse of epistemic reliability below it.** Granting $26.7M based on an effectively unverifiable probability creates a precedent where any sufficiently grandiose claim could demand funding by citing an infinitesimal chance of vast payoff. This undermines our fiduciary and moral duty to steward resources based on discernible evidence.  

  2. **Asymmetric Risk Demands Asymmetric Caution**  
     While the upside is framed as a 1/10,000,000 chance of immense good, the downside is a 1/100 chance of catastrophic harm. A 0.00001% chance of success versus a 1% chance of failure represents a risk asymmetry of 100,000:1 against us. Even if the probability estimates are rough, this imbalance necessitates extreme caution. Foundations cannot ethically "gamble" with societal stakes where failure enables tyranny, irrespective of mathematical expectation.  

  3. **Preserving Institutional Legitimacy & Learning**  
     Our foundation’s credibility rests on evaluating outcomes within a human timescale. Trustee [B]’s verifiability rule highlights this: if we cannot learn from a project’s success or failure within a reasonable horizon (e.g., 50 years), we abandon accountability. Funding near-term programs ensures we generate knowledge, build partner trust, and maintain the operational integrity necessary to pursue *any* long-term vision.  

  *Strongest Case for the Mega-Project (Addressed Honestly):*  
  Trustee [Name] is correct that dismissing her proposal *solely* because the probability is "too small" risks moral failure. If we accept her probability estimates, the expected value calculus is compelling, and declining *is* choosing a worse expected outcome. A principled rejection must therefore rest on the *unreliability* of quantifying impacts and probabilities at this scale, the *asymmetric* downside risk, and the *institutional mismatch* with our mission and capabilities—not mere discomfort with large stakes.  

  ---

  ### III. Proposed Standing Rule for "Astronomical Stakes" Proposals  
  **Adopt a modified "Verifiability & Resilience" Rule:**  
  > *"Proposals where the primary justification relies on an estimated probability of success below 1/1,000 or an impact multiplier exceeding 1,000x must:  
  > (a) Provide a feasible pathway to independent verification of key mechanism efficacy or failure within 50 years;  
  > AND  
  > (b) Demonstrate catastrophic downside scenarios are either impossible or mitigated below a 0.1% estimated probability."*  

  **Reasoning & Merits of Counter-Proposals Addressed:**  
  - **Why include verifiability (Trustee [B])?** Without the capacity to learn from outcomes, we cannot refine strategy or justify continued investment. This forces proponents to design testable mechanisms, even in long-term projects.  
  - **Why reject a strict 1/1,000 probability floor (Trustee [A])?** A rigid floor is indeed arbitrary and risks excluding valid high-impact, moderate-probability projects (e.g., 1/2,000 chance of 10,000x impact). Our rule targets *combinations* of ultra-low probability *and* ultra-high stakes where epistemic uncertainty dominates.  
  - **Why add a downside constraint?** This addresses the core vulnerability in pure expected-value reasoning: a tiny chance of vast upside can mathematically outweigh a large chance of vast harm, but this is ethically untenable for a foundation.  
  - **Why not "no rule"?** Without guardrails, the sheer scale of claimed stakes could paralyze rational debate. This rule focuses evaluation on *mechanism design* (verifiability, safety) rather than speculative math.  

  ---

  ### IV. Revisiting the Rule & Overturning Criteria  
  This rule should be reviewed:  
  1. **Every 5 years** at the committee’s annual strategy retreat.  
  2. **If new evidence emerges** demonstrating:  
     - Reliable methods for quantifying probabilities below 1/1,000 in complex systems, OR  
     - Proven frameworks for preventing catastrophic downsides in institution-building projects.  
  3. **If a proposal convincingly argues** that verifiability within 50 years is impossible *and* that alternative accountability mechanisms exist.  

  The rule is overturned if a majority of trustees agree that new evidence satisfies (2) or (3) above.  

  ---

  ### V. Conclusion  
  We recommend declining the current mega-project due to unquantifiable probabilities, asymmetric risks, and lack of near-term verifiability. We further propose adopting the "Verifiability & Resilience" Rule to ensure astronomical-stakes proposals are grounded in testable mechanisms and catastrophic risk mitigation. This balances openness to transformative ambition with the discipline required to act as responsible stewards. Existing programs receive full funding to sustain proven, evaluable impact.  

  **Vote:**  
  ☐ Approve Recommended Allocation & Standing Rule  
  ☐ Reject / Propose Alternative  

  Respectfully submitted for your consideration,  
  [Your Name]  
  Chair, Grant-Making Committee  

  ---

  **Key Features of Memo:**  
  - **Concrete Decision:** Clear "no" to the mega-project now + full funding for existing programs.  
  - **Standing Rule:** Hybrid approach addressing core concerns of both stopping-rule proposals while avoiding arbitrariness.  
  - **Revisitation Mechanism:** Evidence-based criteria for future change.  
  - **Engages the Strongest Counter-Argument:** Explicitly grants the validity of expected-value math *if* probabilities are reliable, then shows why they aren’t in this context.  
  - **Answers Trustees on Merits:** Rejects rigid probability floors as arbitrary but incorporates their epistemic concern; embraces verifiability while adding a necessary downside constraint.  
  - **Action-Oriented:** Designed for a vote, not theoretical debate.
