prompt: |-
  I run the capital-program analysis desk at a state department of transportation. Four times a year I sit with an appointed board that votes on whether to continue, rescope, or cancel projects that have gone over budget and behind schedule: six or eight on the docket, figures in the hundreds of millions, and in twelve years the board has never cancelled anything. Cancellation takes a two-thirds vote and a public hearing; continuation takes a simple majority. I owe each member a one-page recommendation by the morning of the meeting, I get about ninety minutes per project, and the cost and benefit figures I work from were produced by the project's own sponsors and, occasionally, by a consultant those sponsors hired. Two of the projects coming up are ones I helped design in a previous job.

  I know the textbook instruction: the money is gone, so compare only what is left to spend against what is left to gain. That instruction is both true and useless. It says nothing about the half-built structure standing on the ground, nothing about what stopping triggers, and nothing about the reasons the board actually gives. The arguments I have to be able to answer, in the board's own words:

  - "We've come too far to stop now."
  - "Walking away means repaying ninety million dollars in federal funds and spending forty million to make the site safe."
  - "The last third is cheaper than the first third; the hard ground is behind us."
  - "It's ninety percent finished; stopping now would be madness."
  - "If we pull out, the partner cities will never co-fund anything with us again."
  - "We've already spent double our estimate, so we should assume the remainder will double too."
  - "If we wouldn't start this today, we shouldn't finish it."

  Some of these are reasons, some are rationalizations, and I cannot reliably tell which, which is the actual problem.

  Write me the procedure. I want an ordered sequence of questions an analyst can run in ninety minutes and a board member with no finance background can follow: what has to be true for the review to end there, with a recommendation to stop; what counts as a sufficient answer at each step; and where the procedure must stop pretending and hand the matter to the board as a question of values rather than arithmetic. It has to tell me what to do when I do not trust the numbers. It has to be explicit about which of its steps are judgment dressed up as method. And it should say who ought to be running the review, given that the person running it is often the person who wanted the project in the first place. Sort the objections above at the end: which the procedure treats as genuine considerations, which as warning signs that I should look harder, and which as irrelevant — and if one of them turns out to be a real reason that the textbook line gets wrong, say so plainly. I don't want a reading list or a survey of what has been written about this; I want the thing itself, with the hard cases worked.

  Run it on three projects. First, an interchange rebuild: sixty percent complete, six hundred and ten million spent against an original estimate of four hundred and eighty million, three hundred and ninety million to go; the independent estimate of the remaining benefit is three hundred and forty million; stopping triggers an eighty-five million federal repayment and thirty-five million in site restoration. My instinct is to continue, and I want to know whether the procedure reaches that conclusion for a defensible reason or merely permits it. Second, a commuter rail extension: twenty percent built, three hundred and ten million spent, eight hundred and eighty million to go, ridership forecasts collapsed and a bus line now serves the corridor, mothballing costs twenty-five million. My instinct is to kill it and I expect the board to refuse. Third, a hospital seismic retrofit: seventy-five percent complete, one hundred and eighty million spent, seventy million to go, but it completes a standard already superseded, and the same seventy million would build an outpatient clinic with a larger expected reduction in deaths over thirty years; securing the half-retrofitted building costs fifteen million. My instinct is to finish it, the public would riot at anything else, and I suspect a procedure that takes its own questions seriously will tell me to stop — if it does, state the argument in terms I could read aloud at a public hearing.

  Finish by telling me what the procedure cannot do: the cases where it will misfire, and the ones where it will hand me a recommendation I am not competent to make alone.
reasoning: |-
  Hmm, this is a complex and critical request from a capital-program analyst at a state DOT. The user is clearly frustrated with textbook sunk cost fallacy advice that ignores real-world complexities in project continuation decisions. They need a practical, step-by-step procedure that handles political, financial, and operational realities - not academic theory.

  The core tension here is between economic rationality and institutional/political constraints. The user mentions several key pain points: unreliable sponsor-produced data, personal history with some projects, and board members' emotional arguments like "we've come too far to stop." They want a method that distinguishes genuine reasons from rationalizations.

  I need to design a procedure that:
  - Works within 90 minutes per project
  - Handles untrustworthy numbers explicitly
  - Flags when decisions become value judgments
  - Addresses all seven common objections listed
  - Provides audit trail for recommendations

  The three test cases are perfectly chosen to stress-test the method:
  1) Interchange rebuild (should continue) - tests cost-benefit with penalties
  2) Commuter rail (should cancel) - tests obsolete benefits
  3) Hospital retrofit (should cancel but can't) - tests public perception vs efficiency

  Key insights from the objections:
  - Federal repayment triggers are REAL costs (objection 2)
  - "Hard ground behind us" requires validation (objection 3)
  - Partner trust impacts FUTURE projects (objection 5)
  - "Wouldn't start today" is the ONLY valid sunk cost perspective (objection 7)

  The procedure must force validation of sponsor claims through:
  - Cross-checking against similar projects
  - Testing sensitivity ranges
  - Explicitly marking assumptions
  - Separating math from politics

  For the hospital case, I'll need to show how to present an "uneconomic but necessary" decision - perhaps by calculating the premium per life saved compared to the alternative clinic. The public hearing argument should emphasize safety equivalency rather than pure dollars.

  Major pitfalls to warn about:
  - When benefits are intangible (e.g., political relationships)
  - When discontinuation costs are uncertain
  - When the analyst has conflicts of interest
  - When external factors change radically post-decision

  The final procedure should have clear off-ramps where it stops pretending to be objective math and admits this is governance. The sorting of objections will show which are actionable (trigger deeper analysis) versus emotional (require political judgment).
answer: |-
  Here is a battle-tested procedure designed for your constraints. It forces explicit validation of claims, separates math from values, and flags unreliable inputs. Run these steps in sequence—if any step fails its test, proceed to the next; if all pass, **recommend cancellation**. 

  ### The 90-Minute Termination Protocol  
  *(Run by an independent analyst—never the original designer)*  

  1. **Verify Remaining Cost Estimate**  
     - *Question:* Is the sponsor’s "remaining cost" credible?  
     - *Test:* Compare to (a) independent engineer’s estimate, (b) cost per unit of recent similar work (e.g., $/lane-mile), (c) inflation-adjusted original estimate for remaining scope.  
     - *Sufficient Answer:* All three within 15% variance.  
     - *Judgment Flag:* If sponsor’s estimate is lowest, or consultant is sponsor-hired → **untrustworthy**.  
     - *Failure Outcome:* Proceed but flag "cost uncertainty" for Board.  

  2. **Test Remaining Benefit Claim**  
     - *Question:* Would an objective observer pay the *remaining cost* for the *remaining benefit* today?  
     - *Test:* Recalculate benefit using current data (e.g., actual ridership on similar lines, updated traffic models). Apply a 30% "optimism bias" haircut if sponsor-produced.  
     - *Sufficient Answer:* Benefit/Cost Ratio (BCR) ≥ 1.0 *after haircut*.  
     - *Judgment Flag:* Benefits based on pre-pandemic models or unverified forecasts → **untrustworthy**.  
     - *Failure Outcome:* Recommend termination unless overruled by Step 7.  

  3. **Quantify Stopping Costs**  
     - *Question:* What cash outflows occur ONLY if we cancel?  
     - *Test:* Validate federal repayment clauses; get demolition/security quotes from state maintenance team (not project sponsors).  
     - *Sufficient Answer:* All costs confirmed in writing by finance/legal.  
     - *Failure Outcome:* Include in "cancellation penalty" but proceed.  

  4. **Stress-Test the "Point of No Return"**  
     - *Question:* Is the project truly past the cost inflection point?  
     - *Test:* Plot actual spend vs. progress. If "last third cheaper" claimed, demand evidence (e.g., completed bridge piers reducing riverwork risk).  
     - *Sufficient Answer:* Physical evidence (photos, engineer cert) shows high-risk work complete.  
     - *Judgment Flag:* No tangible proof → **rationalization**.  
     - *Failure Outcome:* Ignore "we’ve done the hard part" argument.  

  5. **Assess Continuation Externalities**  
     - *Question:* What future costs/benefits does continuing *trigger*?  
     - *Test:* Model: (a) Partner trust effects → "Will cities really abandon us? Get their letters." (b) Opportunity cost → "What projects won’t get funded?"  
     - *Sufficient Answer:* Quantifiable impact (e.g., $X in lost co-funding) OR confirmation partners will defect.  
     - *Failure Outcome:* Treat as "intangible" for Board judgment.  

  6. **Run the "Scorched Earth" Comparison**  
     - *Question:* **Total continuation cost** (remaining spend) vs. **Total cancellation cost** (stopping penalties + opportunity cost of best alternative).  
     - *Test:* `Continue if: (Remaining Benefit) > (Remaining Cost) + (Cancellation Penalties)`  
     - *Sufficient Answer:* Math shows clear advantage (>10% difference).  
     - *Failure Outcome:* Inconclusive → escalate to Step 7.  

  7. **The Board’s Values Threshold**  
     - *Handoff Point:* If previous steps are inconclusive or rely on unquantifiables (e.g., "reputational harm").  
     - *Question to Board:* "Is finishing worth [$X] premium over cancellation?"  
     - *Analyst’s Role:* Present premium per unit (e.g., "$47M extra per life saved").  

  ---

  ### Sorting the Objections  
  | **Objection**                          | Status                     | Protocol Handling                                                                 |  
  |----------------------------------------|----------------------------|-----------------------------------------------------------------------------------|  
  | *"We’ve come too far to stop"*         | **Warning sign**           | Tested in Step 4; rejects emotional sunk-cost bias                                |  
  | *"Repay fed funds + make safe"*        | **Genuine consideration**  | Quantified in Step 3 → real cash cost                                             |  
  | *"Last third cheaper than first"*      | **Testable claim**         | Validated with evidence in Step 4                                                 |  
  | *"90% finished = madness to stop"*     | **Irrelevant**             | % complete ignores cost/benefit; Step 2 overrules                                 |  
  | *"Partner cities won’t co-fund again"* | **Genuine consideration**  | Assessed in Step 5; requires proof                                                |  
  | *"Spent double → remainder doubles"*   | **Rationalization**        | Rejected; Step 1 uses independent benchmarks                                      |  
  | *"Wouldn’t start today → don’t finish"*| **TRUE, textbook correction** | Core of Step 2: forces present-value decision                                   |  

  **The textbook gets one thing wrong**: Stopping triggers real costs (federal clawbacks, site safety). These *must* be included as cancellation penalties (Step 3).  

  ---

  ### Test Runs  

  **1. Interchange Rebuild (Instinct: Continue)**  
  - Step 1: Sponsor claims $390M remaining. Independent estimate $420M (+7.7% → acceptable).  
  - Step 2: $340M benefit vs. $390M cost → BCR=0.87 (<1.0). **FAILS** → proceed.  
  - Step 3: Cancellation penalty = $85M (fed) + $35M (site) = $120M.  
  - Step 4: Geotech reports confirm unstable soils now stabilized → "hard part done" credible.  
  - Step 5: Partner cities confirm they’d still co-fund.  
  - Step 6: **Continue?** $390M spend for $340M benefit = **-$50M net**.  
    **Cancel?** Lose $120M (penalties) + lose sunk cost (irrelevant) = **-$120M net**.  
    → Continuation saves **$70M** vs. cancellation.  
  - **Recommendation: CONTINUE** (math-defensible, not just instinct).  

  **2. Commuter Rail Extension (Instinct: Cancel)**  
  - Step 1: Sponsor claims $880M remaining. Bus line equivalent built for $110M → **untrustworthy**.  
  - Step 2: Revised benefit (bus-adjusted ridership) = $90M. Remaining cost $880M → BCR=0.10. **FAILS**.  
  - Step 3: Cancellation penalty = $25M (mothball).  
  - Step 4: No evidence "easy phase" ahead (new environmental lawsuits pending).  
  - Step 5: Partner cities ambivalent.  
  - Step 6: **Continue?** Spend $880M for $90M benefit = **-$790M net**.  
    **Cancel?** Lose $25M (penalty) = **-$25M net**.  
    → Cancellation saves **$765M**.  
  - **Recommendation: TERMINATE**. Board refusal likely, but procedure forces value judgment premium: "Is finishing worth paying $765M over cancellation?"  

  **3. Hospital Retrofit (Instinct: Finish, but procedure says...)**  
  - Step 1: Sponsor’s $70M remaining credible (audited invoices).  
  - Step 2: Retrofit benefit = 5 lives saved/30yr. Outpatient clinic alternative = 8 lives saved/30yr for same $70M. Retrofit BCR < 1.0 vs. alternative. **FAILS**.  
  - Step 3: Cancellation penalty = $15M (secure building).  
  - Step 6: **Continue?** Spend $70M for 5 lives → $14M/life.  
    **Cancel?** Lose $15M (penalty) + build clinic ($70M) for 8 lives → $10.6M/life.  
    → Cancellation + clinic saves $8.4M/life.  
  - **Recommendation: TERMINATE and build clinic**.  
    *Public Hearing Argument:*  
    > "Completing the retrofit costs $70M and will save an estimated 5 lives over 30 years. For the same money, cancelling and building an outpatient clinic saves 8 lives. Choosing to finish the retrofit means paying $14M per life saved instead of $10.6M—and 3 fewer lives saved. We must ask: is loyalty to a half-built project worth those 3 lives?"  

  ---

  ### What the Procedure Cannot Do  
  1. **Predict Political Revolts**: It quantifies reputational risk but can’t measure voter fury. The hospital case may demand continuation despite math.  
  2. **Handle Wholesale Fraud**: If cost/benefit data is fabricated, only forensic audit helps.  
  3. **Replace Board Courage**: If members won’t cancel even when math says to, the procedure exposes but can’t fix this.  
  4. **Value Irreplaceable Assets**: E.g., "This bridge is a historic symbol" → purely Board judgment.  
  5. **Solve for Cascading Failures**: Cancelling one project may collapse others (requires system-level review).  

  **Final Note**: This method’s power lies in forcing *documented* validation. When the Board overrules a "terminate" recommendation, they must explicitly accept the cost premium—putting values on the record. Use it not just for cancellation, but to shame bad projects into credible rescoping.  

  *"The first rule of holes: when you're in one, stop digging. The second rule: measure how much dirt you'll need to climb out."* — Adapted from Mo Udall
