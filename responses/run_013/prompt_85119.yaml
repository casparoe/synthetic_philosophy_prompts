prompt: |-
  I have been trying to sort out what I actually think about deferring to my future self, and I want a principle that accounts for my verdicts. The rough principle I was taught — the reflection principle, I believe it is called — is this: if you are certain that at some later time you will be x confident that A, then you should be x confident that A now. It gives the answer I want in some cases and strikes me as plainly false in others. The cases below are the ones that decide the matter for me.

  1. *The Ledger.* Tomorrow morning I will sit down with the rainfall records and will then be 95% confident that it rained here on the fourteenth. Right now I have not seen the records. I should be 95% confident now, and this seems to me exactly right.

  2. *The Amnesia Draft.* Tonight I will take a pill that erases the past month from my memory. That month contained the only evidence I have ever seen bearing on whether a certain treaty was signed in March or in April, and I know that after the pill I will be at 50/50. I am at 80/20 now, on the strength of that evidence. I should stay at 80/20. Deferring to the person I will be tomorrow would mean discarding evidence I still have today, and I take that to be absurd.

  3. *The Guru.* I have agreed to spend tomorrow at a session run by a man whose methods I know to be effective and epistemically worthless: by the end of it I will be 85% confident that the moon landings were staged. I should not be 85% confident of that now, and I should not be 85% confident of it tomorrow either, if I could contrive to keep my head. The difference from the Ledger is that the Ledger's future self is responding to the world, and the Guru's future self is responding only to the Guru.

  4. *The Confidant.* Tomorrow I will spend two hours arguing with a colleague I regard as roughly my equal. He will put the case for a hypothesis I now put at 80/20, and I know from experience that I come out of such conversations much closer to my interlocutor than I should — call it 55/45. I think I should move partway now, to about 65/35, and not all the way to 55/45. My future self will have heard arguments I have not heard, which is a genuine gain in information; but I also know that the mechanism by which those arguments will move me is not their force but my tendency to fold in the presence of confidence, which is not a gain in anything.

  5. *The Complacency Implant.* A hypnotist will put me under tomorrow and implant in me the conviction that I will pass an examination. I know two things about the implant: that it will take, and that the resulting confidence will make me careless, so that I will in fact fail. I should now be *less* confident of passing than I was before I heard about the hypnotist — certainly not 90%, and in fact below whatever I thought beforehand, since I now have evidence that a cause of failure is on its way.

  6. *The Confidence Pill.* Same story with the sign reversed. The hypnotist will make me 90% confident I will pass, and the confidence will make me prepare harder, so that I will in fact pass. Here I think I should be confident, and near 90%. This is the case I keep going back and forth on, because the causal story is the same as in 5 and only the direction differs, and because I dislike the idea that a state I know to be manufactured can be a reason to believe anything.

  Taken together, my verdicts seem to track whether my future credence is a *sign* of the thing it is about, and not whether it is mine. The tentative principle I would offer is this: defer to your future self to exactly the degree to which you would defer to a stranger who had arrived at that credence by that route, if you knew the route and knew nothing else about him. On that test, the Ledger's future self is a stranger who has read the records, and I defer almost entirely; the Guru's is a stranger who has been worked on, and I defer not at all; the Confidant's is a stranger who has heard an argument and also has a known tendency to over-persuade, and I defer a little; and in 5 and 6 the stranger's credence is a sign of the outcome only because the credence will help cause the outcome, which I take to be a reason to follow it in 6 and to invert it in 5.

  What I want from you is a principle — or a small set of candidates, if one will not do — stated precisely enough to be applied to a case I have not described. In particular I want to know what it says about two cases I cannot settle. First, a meter that reads my brain and prints the credence I would arrive at on some question after a week of solitary deliberation, if I never saw the printout: I cannot shake the feeling that I should simply adopt the printed value, and I am bothered that adopting it makes it self-fulfilling. Second, a drug that will tomorrow make me dogmatic about whatever answer I happen to hold, so that I know I will be made irrational without knowing in which direction. I also want to know whether the principle I end up with can be given the kind of coherence argument that is usually offered for the plain version — the argument that a policy of refusing to defer exposes one to a sure loss — and, if it can, whether that argument does not also prove too much, since the Guru's victim seems exposed to a sure loss in the same sense.

  Tell me which of my six verdicts you would overturn, and be definite about it. I would rather have a principle that costs me a verdict I like than a taxonomy of the options. I am not asking for a survey of what others have said and I do not need references; I want your own view, argued. Where you are unsure, say so, but say what you would go with anyway.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They've presented six thought experiments about deferring to their future self's beliefs, and they want a precise principle that explains their intuitive verdicts on these cases. The key is that their intuitions vary: sometimes deferring seems right (like in The Ledger), other times not (The Guru). They've proposed a tentative principle: defer based on whether the future credence is a sign of the truth, similar to how you'd defer to a stranger who arrived at that credence via the same process.

  First, I need to analyze each case through the lens of their proposed principle and see if it holds up. The Ledger is straightforward—future self has direct evidence, so deferring makes sense. The Amnesia Draft involves memory loss, but current self has evidence, so no deference. The Guru's influence is epistemically worthless, so no deference. The Confidant is tricky because there's some genuine information but also bias, so partial deference. Complacency Implant and Confidence Pill are causal cases where the future belief affects the outcome, so deference depends on the direction of causality.

  The user's uncertainty around the Confidence Pill is interesting. They dislike the idea that a manufactured state could justify belief, yet their intuition says to defer. The causal loop here is key—the pill causes confidence, which causes success. Their principle might handle it by treating the future credence as a sign due to its causal role, but inverted in the failure case.

  Now, the two unresolved cases: the brain-reading meter and the dogmatism drug. For the meter, if it prints the credence after genuine deliberation, it seems like a reliable indicator, so deference might be warranted. But the self-fulfilling aspect is problematic—if you adopt it because the meter says so, is that rational? The user feels they should adopt it, but it creates a loop. The principle would likely say defer because the process (deliberation) is reliable.

  The dogmatism drug makes future self irrational but direction unknown. No deference seems right here since the process isn't truth-conducive. The user might struggle because current evidence is unchanged, but the future state is corrupted.

  I need to formulate a precise principle. The user's "stranger" analogy is strong, but it needs refinement. Epistemic Hygiene Principle captures it: current credence should condition on the future credence only via the reliability of the process generating it. Using conditional probability clarifies when to defer.

  For the meter, the principle suggests adopting the value because the deliberation is reliable, regardless of the printout. The self-fulfilling aspect doesn't break it since the process is sound. For the dogmatism drug, no deference because the process is unreliable.

  The user also asks about coherence arguments. The Reflection Principle avoids sure losses only if future credences are rational. Their proposed principle restricts deference to reliable processes, so it avoids the Guru's sure loss by not deferring. The argument holds without proving too much.

  I should check if any verdicts need overturning. The Confidence Pill might be the sticking point. The user goes back and forth, but the principle supports deference due to the causal link to truth. If they're uncomfortable, maybe emphasize that the process (pill + effort) is what's reliable, not just the credence itself.

  Finally, ensuring the principle is precise: define "reliability" as how well the process tracks truth. For strangers, it's about their method. The principle handles all six cases and the unresolved ones. It's testable for new cases by evaluating the process's reliability.
answer: |-
  After analyzing your cases and intuitions, I propose the **Epistemic Hygiene Principle (EHP)** as the core of a refined deferral rule. It incorporates your insight about "sign-tracking" while avoiding the pitfalls of naive reflection. Here's the formal principle, followed by its application to your cases and unresolved questions.

  ### The Principle
  **Epistemic Hygiene Principle (EHP):**  
  Your current credence in proposition *A*, given that at future time *t* you will have credence *C_t(A) = x*, should be:  
  **P_now(A | C_t(A) = x) = E[Reliability(A, Process_t) | C_t(A) = x]**  

  **Where:**  
  - **Reliability(A, Process_t)** is your current estimate (between 0 and 1) of how well *Process_t* (the method by which your future self arrives at *C_t(A)*) tracks the truth of *A*.  
  - **E[·]** denotes expected value, conditional on knowing *C_t(A) = x*.  

  **In practical terms:** Defer to your future credence *only to the extent* that the *process generating it* is currently judged by you to be truth-conducive regarding *A*. Your "stranger test" is a valid heuristic for estimating Reliability(*A*, *Process_t*).

  ---

  ### Application to Your Six Verdicts
  I accept **all six** of your verdicts. EHP justifies each:

  1. **The Ledger**  
     - *Process_t*: Examining reliable rainfall records.  
     - *Reliability*: Near 1 (direct access to evidence).  
     - **Verdict:** Defer fully (95% now). ✅  
     - *Why*: The process is maximally truth-conducive.

  2. **The Amnesia Draft**  
     - *Process_t*: Memory erasure leading to ignorance.  
     - *Reliability*: 0.5 (no better than a guess).  
     - **Verdict:** Ignore future 50%; stay at 80%. ✅  
     - *Why*: The process destroys evidence. Reliability = 0.5 ≠ your current evidence-based reliability.

  3. **The Guru**  
     - *Process_t*: Epistemically worthless manipulation.  
     - *Reliability*: Near 0 (no truth-connection).  
     - **Verdict:** Ignore future 85%. ✅  
     - *Why*: Reliability ≈ 0 regardless of *x*.

  4. **The Confidant**  
     - *Process_t*: Hearing new arguments + bias from over-persuasion.  
     - *Reliability*: Partial. Your estimate: 65% reflects weighted trust in the argument (genuine info) discounting the bias (noise).  
     - **Verdict:** Move partially to 65%. ✅  
     - *Why*: Reliability is moderate but imperfect. EHP allows partial deference.

  5. **Complacency Implant**  
     - *Process_t*: Hypnosis causing complacency → failure.  
     - *Reliability*: *Inverse* of future credence. *C_t(A) = 90%* signals a *cause* of failure.  
     - **Verdict:** Decrease confidence below prior. ✅  
     - *Why*: Reliability(*A*, *Process_t*) < 0.5. *P(A | C_t(A) = 90%) ≈ 0* (since the implant causes failure).

  6. **Confidence Pill**  
     - *Process_t*: Hypnosis causing confidence → effort → success.  
     - *Reliability*: *Aligned* with future credence. *C_t(A) = 90%* signals a *cause* of success.  
     - **Verdict:** Increase confidence to near 90%. ✅  
     - *Why*: Reliability(*A*, *Process_t*) ≈ 1. *P(A | C_t(A) = 90%) ≈ 1* (the pill causes success).  
     - *Your hesitation*: The "manufactured" state isn't evidence *itself*; it's a reliable *indicator* due to the causal chain it triggers. EHP captures this: the process (pill → effort → success) *is* truth-conducive.

  ---

  ### Resolution of Unsettled Cases
  1. **The Credence Meter**  
     - *Process_t*: A week of solitary deliberation (without seeing the output).  
     - *Application of EHP*:  
       - **Adopt the printed credence.**  
       - *Why*: The process (your own deliberation) is truth-conducive. Reliability ≈ 1. *P_now(A | C_t(A) = x) ≈ x*.  
       - *Self-fulfillment worry*: This is not vicious circularity. The meter *reports* the credence you *would* have after genuine reasoning. Adopting it now is rational because it leverages your future epistemic labor. It’s no different than trusting a past diary written after careful thought. EHP treats the process, not the output, as primary.

  2. **The Dogmatism Drug**  
     - *Process_t*: Chemical induction of irrational certainty, direction unknown.  
     - *Application of EHP*:  
       - **Ignore the future credence entirely.** Maintain current credence.  
       - *Why*: Reliability(*A*, *Process_t*) = 0.5. The process *systematically destroys* your ability to track truth, regardless of the direction dogmatism takes. *P_now(A | C_t(A) = x) = P_now(A)* for any *x* (since *x* provides no information about *A*).  

  ---

  ### Coherence Argument
  **Can EHP avoid Dutch books?**  
  Yes, conditionally. The naive Reflection Principle avoids sure losses *only if* your future credences are rational. EHP generalizes this:  
  - **Coherence Theorem**: If you *believe now* that your future credences will be formed by a truth-conducive process (Reliability ≈ 1), then violating EHP exposes you to a sure loss.  
  - **Why it doesn’t prove too much**: The Guru’s victim faces no *rational* sure loss. Dutch books against them exploit *known irrationality*, not inconsistency. Refusing to defer to a corrupted future self is coherent.  
  - **Example**: In the Guru case, "deferring now" (setting *P_now(A) = 0.85*) and "not deferring later" (keeping *C_t(A) = 0.85* while knowing it’s bogus) creates no loss *if your later self recognizes the corruption*. The "loss" arises only if you irrationally commit to future deference *despite knowing the process is unreliable*. EHP forbids this.

  ---

  ### Why No Verdicts Overturned
  Your intuitions align perfectly with EHP’s core: **deference is justified only when the process generating future credences is truth-sensitive**. Cases where you reject deference (Amnesia, Guru, Complacency, Dogmatism) involve processes that are evidence-destroying, truth-ignorant, or anti-truth-conducive. Cases where you accept deference (Ledger, Confidence Pill, Credence Meter) involve processes that are evidence-responsive or causally reliable. The Confidant is hybrid, and your 65% verdict is a rational compromise under partial reliability.

  **Final note on EHP**: It subsumes your "stranger test" but adds rigor. Reliability(*A*, *Process_t*) quantifies how much you’d trust a stranger using that method *for this specific proposition*. This handles causal loops (Pill/Implant) and isolates process from identity. If you must choose one sentence:  
  **"Defer to your future self only when and to the degree that the process leading to their credence is, by your current lights, a reliable guide to the truth."**
