prompt: |-
  I chair the bylaws committee of a small resident-owned housing cooperative, and I need advice on a procedural question that has turned into a dispute about something deeper. The building has forty units. Some owners live in their units; others rent theirs out and live elsewhere. Among the residents are long-term renters who have lived here for a decade, a live-in aide to an elderly owner, adult children who have moved back home, and the owner of a ground-floor café whose lease runs through the building. We are about to vote on replacing the elevator and adding an accessibility ramp. The project requires a special assessment on owners, and it will close the café’s entrance for months. Our bylaws give one vote per unit to owners, and they can be amended only by a two-thirds vote of unit-owners. So the people excluded by the current rule cannot vote to change the rule that excludes them. The board is split on whether we may even put the question to a broader group without first amending the bylaws. One faction says only owners should vote because they pay and carry the risk. Another says anyone who lives here should vote because they live with the result. The café owner wants a vote because the construction will affect his business. Residents of the neighboring building say the ramp will change the shared courtyard and want in. One board member proposes a stakeholder assembly: owners, renters, the café, and a neighbor, with votes weighted by how long each has been affected. Another proposes a boundary jury of twelve people chosen by lot from everyone within a block, to decide who should be eligible to vote in future decisions. I have to recommend a process. Who should be included in this vote, and on what principle? Should non-owners get a binding vote, an advisory vote, or a separate track? How should we treat people who will be affected later—future owners, people on the waitlist to buy in, and whoever replaces the aide if she leaves? And how do we break the circularity without assuming the very boundary we are arguing about? Please lead with your bottom line, then explain, in no more than 650 words.
reasoning: |-
  Okay, the user chairs a bylaws committee for a small housing co-op facing a complex procedural and philosophical dilemma. They need to resolve who gets to vote on a major construction project (elevator replacement and accessibility ramp) that affects multiple stakeholders beyond just unit owners. The core tension revolves around democratic inclusion versus legal/financial responsibility.

  Hmm, this situation reveals deeper questions about community boundaries. The co-op has at least five distinct stakeholder groups: resident owners (directly impacted), non-resident owners (financially responsible), long-term renters (lived there 10+ years), commercial tenant (café owner facing entrance closure), and neighboring residents (concerned about shared courtyard changes). Each has legitimate claims.

  The user's hidden challenges are fascinating. Beyond the surface voting question, they're grappling with: (1) how to define "community" in a hybrid ownership/rental space, (2) whether financial risk should trump lived experience in decision-making, (3) how to handle temporal impacts (future residents), and (4) the meta-problem of circularity - you can't democratically include excluded groups without first changing rules that exclude them. 

  Legally, the bylaws are clear: only owners vote. But ethically, excluding renters who've lived there longer than some owners feels unjust. The café owner's business survival is at stake. And neighbors have valid aesthetic/safety concerns about the courtyard redesign. 

  For the recommendation: Binding votes must stay with owners due to financial liability and legal structure. BUT we can create layered participation: renters and café get advisory votes reported alongside official results, neighbors provide written input. This addresses inclusion without violating bylaws. For future-impacted parties, we document construction impacts explicitly for disclosure to prospective buyers/renters. 

  The circularity problem requires decoupling: First, use current owner vote for immediate construction decision (since delay isn't feasible). Simultaneously launch a separate, deliberate process to review voting eligibility rules - perhaps using that proposed boundary jury concept to recommend bylaw amendments. 

  Notably, the 650-word limit means prioritizing actionable solutions over philosophical debate. Should emphasize that advisory votes serve both ethical purposes (recognizing lived experience) and practical ones (owners may consider wider perspectives when casting binding votes). The café's situation is particularly urgent - its input could inform construction sequencing or compensation negotiations. 

  Key principles crystallizing here: Legitimacy comes from legal/financial responsibility; fairness from including affected voices; wisdom from diverse input. The solution nests all three without requiring immediate bylaw changes. Future amendments can emerge from the proposed review process.
answer: |-
  ## Bottom Line
  **Conduct the elevator/ramp vote with binding votes only for unit-owners, as required by current bylaws, but layer in robust, transparent advisory input from key affected non-owners (long-term renters, live-in aide, café owner). Simultaneously, launch a formal, time-bound process to review and propose amendments to the bylaws regarding voting eligibility for future decisions, using a broadly representative "boundary jury" or stakeholder committee to break the circularity.**

  ## Explanation & Recommendations

  1.  **The Immediate Vote (Elevator/Ramp): Binding Vote for Owners Only, Advisory Input for Others**
      *   **Why Binding for Owners:** The special assessment imposes direct financial liability and legal obligation *only* on unit-owners. The bylaws explicitly grant voting rights on assessments and major alterations solely to owners. Attempting to grant binding votes to non-owners now likely violates the bylaws and exposes the co-op to legal challenge. Owners bear the ultimate financial risk and responsibility.
      *   **Why Robust Advisory Input:** Ethical governance and practical wisdom demand acknowledging those significantly impacted:
          *   **Long-Term Renters & Live-in Aide:** They live with the disruption daily. Their practical experience is invaluable for planning (e.g., noise timing, access workarounds). Give them a formal *advisory* vote or structured feedback session. Present their aggregated input clearly alongside the official vote results.
          *   **Café Owner:** The closure directly threatens their livelihood. They deserve a formal consultation role. Their input on construction phasing, signage, mitigation, and potential compensation negotiations is crucial. Consider a written agreement outlining mitigation measures based on their input.
          *   **Neighbors:** Their concerns about the *shared* courtyard warrant a formal opportunity for input (e.g., a presentation/Q&A session, written comments) to the Board before the final design is locked in, but not a vote. The ramp design should respect shared space without giving neighbors decision-making power over co-op assets.
      *   **Future Residents:** Document the project's impacts thoroughly for disclosure to prospective buyers/renters. Their interests are protected by transparency and the long-term value of the improvements, but they cannot vote before existing.

  2.  **Breaking the Circularity: The Bylaw Review Process**
      The core dispute reveals the bylaws' democratic deficit regarding non-owner stakeholders. To address this *for the future* without assuming the boundary:
      *   **Establish a Bylaw Review Committee (BRC):** Task it specifically with reviewing voting eligibility and stakeholder inclusion. Mandate it to propose bylaw amendments.
      *   **Composition is Key - Use the "Boundary Jury" Concept:**
          *   **Selection:** Use sortition (random selection) from a *broadly defined pool*: All unit-owners (resident & non-resident), all adult long-term residents (>1-2 years?), the café owner, *and potentially 1-2 representatives nominated by the neighboring building*. Aim for 9-15 members.
          *   **Purpose:** This jury's task isn't to decide *this* vote, but to deliberate on principles of inclusion, impact, and responsibility for *future* significant decisions. They represent diverse perspectives *within the contested boundary zone*.
          *   **Process:** Provide them with background, facilitate structured deliberation (potentially with an external moderator), and task them with drafting specific bylaw amendment proposals addressing:
              *   Voting rights for long-term renters (e.g., after X years, on certain issues)?
              *   Input mechanisms for commercial lessees significantly affected?
              *   Formal consultation processes with immediate neighbors for shared-space projects?
              *   Distinguishing between binding votes (financial/legal responsibility) and advisory roles (lived impact)?
      *   **Recommendation & Vote:** The BRC/jury presents its proposals to the Board. The Board then submits the proposed bylaw amendments to the *unit-owners* for a vote, requiring the existing two-thirds majority. This respects the current legal structure while enabling democratic evolution based on thoughtful input from the affected community.

  ## Principles Applied

  *   **Legal Compliance & Fiduciary Duty:** Respects current bylaws and owners' financial/legal responsibility for binding votes.
  *   **Procedural Fairness & Inclusion:** Provides meaningful, structured avenues for significantly affected non-owners to be heard and influence decisions affecting them *now* (advisory input) and *in the future* (serving on the boundary jury/BRC).
  *   **Breaking Circularity:** The boundary jury/BRC, drawn broadly from the contested groups, deliberates on the *principle* of inclusion without needing a prior vote on who qualifies. Its recommendations then go through the existing owner amendment process.
  *   **Practicality:** Allows the urgent elevator/ramp project to proceed legally while initiating a concrete process to address the underlying democratic issue for the future. Separating the immediate vote from the bylaw review prevents paralysis.
  *   **Proportionality:** Recognizes degrees of impact. Owners have binding votes due to ultimate responsibility. Long-term residents have strong advisory roles due to daily disruption. The café owner gets specific consultation due to existential business impact. Neighbors get input on shared spaces.

  **Recommendation:** Present this dual-track approach to the board. For the elevator/ramp: Owners vote bindingly; solicit and transparently incorporate formal advisory input from long-term residents and the café owner; gather neighbor input on courtyard design. Simultaneously, propose forming the broadly representative Boundary Jury/Bylaw Review Committee with a clear mandate and timeline to propose voting eligibility amendments for the future. This respects legality, acknowledges impact, and provides a path forward on the deeper issue.
