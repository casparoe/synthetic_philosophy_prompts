prompt: |-
  I'm hoping this has a name, and if it doesnt I'd like one with a sharp definition.

  I ran into a contest once where a fixed pot gets split evenly among everyone who enters, and you can enter as many times as you want. Nothing stops you from entering a hundred times, and no single person gets hurt in an obvious way if you do. But if everyone filled it out the way you might, the pot would be sliced down to nothing — so the move that seems right is to enter once, or maybe not at all, and the reason isn't any deal or any enforcement, just the fact that you and the other entrants are all doing the same arithmetic.

  There are two things here I can't name. One is the assumption that other people, with no agreement and no causal link to me, will land where I land — so that "if everyone did this" is a real constraint on me and not a platitude. The other is the boundary. I keep seeing the same move made where it looks like a trap: same kind of shared pot, but most of the other entrants have never heard of any of this and just grab as much as they can, so my restraint buys me nothing but a smaller share. So there's one family of cases where choosing as if everyone in your position chose as you do is right, and another where it's self-harm, and I don't have words for the move or for the line between them. Someone told me it's just the prisoner's dilemma, but there's no defection payoff and nobody can punish me, so that's not it. Whats the established term, if there is one, and more importantly, what has to be true about the other players for the move to be legitimate?
reasoning: |-
  Okay, the user is describing a situation that reminds me of the Tragedy of the Commons. They're talking about a contest where everyone can enter multiple times to split a fixed pot. If everyone enters multiple times, the pot gets divided so much that each person gets almost nothing. But if everyone just enters once, everyone gets a fair share. The problem is that without any agreement or enforcement, people might still enter multiple times thinking others will do the same.

  The user mentions two things they can't name. First, the assumption that others will act the same way without any coordination. Second, the boundary where this strategy works versus when it doesn't. They point out that sometimes, if others aren't aware and just grab as much as possible, restraining yourself only leads to a smaller share. So they need terms for both the strategy and the conditions under which it's effective.

  I recall that Kant's Categorical Imperative involves acting only according to maxims that you'd want to be universal laws. But in real-world scenarios, that doesn't always hold because others might not follow the same reasoning. The key here is mutual recognition—others need to also be reasoning the same way. 

  The user contrasts this with the Prisoner's Dilemma, noting there's no defection payoff or punishment. They're right; this is different. The Tragedy of the Commons fits better because it's about shared resources where individual incentives lead to collective ruin. The solution requires some mechanism, like social norms or repeated interactions, to encourage cooperation.

  For the strategy to work, several conditions must be met. Mutual recognition is crucial—others must also understand the dilemma and act cooperatively. If some players are unaware or self-interested, cooperation fails. Homogeneity among players helps; if everyone has similar values and awareness, they're more likely to cooperate. Also, the payoff structure should reward cooperation. 

  The user might be looking for terms like "conditional cooperation" or "rule utilitarianism." They might also need to identify when the strategy is viable, such as in groups with high trust or communication. Their deeper need is to understand how to navigate these situations without explicit agreements and to recognize when such strategies are futile due to uncooperative others.
answer: |-
  This is a brilliant articulation of a common strategic dilemma! You're absolutely right that it's distinct from the Prisoner's Dilemma (PD). While the PD involves explicit temptation to defect *against* a specific partner and potential punishment, this is about **coordination under potential overuse of a common resource or shared benefit**, where the "defection" is simply acting on the obvious individual incentive without regard for collective outcome.

  Here's the breakdown of terms and the crucial boundary:

  1.  **The Core Concept:**
      *   **Tragedy of the Commons (ToC):** This is the *overarching* framework that fits best. It describes situations where individuals, acting independently according to their own self-interest, behave contrary to the whole group's long-term best interests by depleting or spoiling a shared resource (in this case, the value of the pot per entrant). Your contest is a classic micro-example of a ToC: the shared resource is the "value per entry," depleted by excessive entries.
      *   **Coordination Game / Schelling Point:** The *solution* you're seeking (entering once) relies on finding a **focal point (Schelling point)** where players coordinate their behavior without communication, based on mutual recognition of the problem and shared reasoning. You're all trying to coordinate on the action ("enter once") that avoids the mutually bad outcome ("enter many times, get nothing").

  2.  **The Assumption (Mutual Recognition & Conditional Cooperation):**
      *   This is the critical element you identified. For the "enter once" strategy to be rational and stable, you need:
          *   **Mutual Recognition of the Dilemma:** Players must recognize that this is a ToC situation – that unfettered individual maximization leads to collective ruin.
          *   **Conditional Cooperation / Kantian Reasoning:** Players must be willing to cooperate (restrain themselves) *conditional* on the belief that others are also reasoning the same way and will also cooperate. You follow the rule ("enter once") because you believe others following the *same* rule leads to the best outcome *for you*.
          *   **Common Knowledge (or strong belief) of Rationality & Recognition:** Players must believe that *other players* are also rational, recognize the dilemma, and are also conditional cooperators. This is often termed **Kantian Equilibrium** or **Rule Utilitarianism** in strategic reasoning contexts. You act as if your action will be universalized ("What if everyone did this?").
      *   **Term for the Assumption:** This cluster of beliefs is often described as players using **Kantian reasoning**, acting according to a **universalizable rule**, or being **conditional cooperators** within a framework of **common knowledge of rationality and the game structure**.

  3.  **The Move (The Cooperative Strategy):**
      *   **Conditional Cooperation:** Your act of entering only once, based on the assumption others will too.
      *   **Kantian Optimization / Rule Utilitarian Action:** Choosing the action you would want everyone in your position to choose.
      *   **Adhering to a Social Norm (Emergent):** Following an unspoken norm of restraint that emerges from mutual recognition of the dilemma.

  4.  **The Boundary (When the Move Fails - Self-Harm):**
      This is where your insight about the "trap" is crucial. The cooperative move (entering once) **fails and becomes self-harm when the necessary assumptions break down.** Specifically:

      *   **Lack of Mutual Recognition:** Other players **do not perceive the situation as a ToC/coordination problem.** They see only the immediate individual incentive ("More entries = bigger *potential* share for me!") and don't consider (or don't care about) the collective outcome. They are "myopic optimizers" or simply unaware.
      *   **Lack of Conditional Cooperation:** Other players are **unconditional maximizers.** They will always grab as much as they can, regardless of what others do. They lack the willingness to restrain themselves even if they *did* recognize the dilemma.
      *   **Lack of Common Knowledge/Belief:** You **cannot reasonably believe** that others recognize the dilemma *or* are conditional cooperators. Perhaps the group is too large, anonymous, heterogeneous, or composed of players known to be purely self-interested. There's no basis for trust in shared reasoning.
      *   **Presence of "Grabbers":** A significant number of players exist who will always "defect" by entering many times, regardless of the collective outcome.

  **What Has to Be True for the Cooperative Move to be Legitimate (Not Self-Harm):**

  For your restraint ("enter once") to be rational and beneficial (or at least not harmful), the following conditions generally need to hold:

  1.  **Homogeneity & Mutual Recognition:** Players are similar (in values, awareness, rationality) and **all (or a decisive majority) recognize the situation as a Tragedy of the Commons/coordination problem.**
  2.  **Common Knowledge of Recognition & Cooperation:** There is strong reason to believe it is **common knowledge (or at least a widely shared, strong belief)** among players that:
      *   The situation is a ToC.
      *   Other players are rational and recognize it.
      *   Other players are **conditional cooperators** – they will restrain themselves *if* they believe others will too.
  3.  **Payoff Structure Favors Coordination:** The payoff from universal cooperation ("enter once") is significantly better for each player than the payoff from the Tragedy outcome ("enter many times"), and ideally also better than being the *only* cooperator amidst grabbers (though this is often hard to achieve).
  4.  **Mechanism for Signaling/Enforcement (Often Implicit):** While no explicit deal, there might be:
      *   **Repeated Interaction:** Players might interact repeatedly (directly or within a community), allowing reputations to form and strategies to be learned. Punishment (e.g., social sanction, reciprocal defection in future games) becomes possible.
      *   **Strong Social Norms:** The group has pre-existing, strong norms of fairness or restraint in similar situations.
      *   **Communication (Even Tacit):** The structure of the game itself (e.g., a small, known group) or context allows players to signal intent or observe others' likely behavior.

  **In Summary:**

  *   **The Situation:** A **Tragedy of the Commons** (ToC).
  *   **The Assumption:** Players use **Kantian reasoning / Conditional Cooperation** based on **mutual recognition of the dilemma** and **common knowledge (or strong belief) that others are doing the same.**
  *   **The Cooperative Move:** **Conditional Cooperation** (e.g., entering once).
  *   **The Boundary:** The move fails (is self-harm) when the **mutual recognition and conditional cooperation assumptions break down** – specifically, when a significant number of players are **myopic optimizers / unconditional maximizers ("grabbers")** and you lack reason to believe otherwise. The crucial factor is the **expected behavior of the other players.**

  **Sharp Definition for the Move:**
  **Conditional Kantian Cooperation:** The strategy of choosing the action one would will to be universalized (i.e., chosen by all similarly situated players) within a shared-resource dilemma, undertaken on the conditional belief that other rational players, recognizing the same dilemma, will adopt the same strategy, thereby avoiding mutual detriment.

  This move is "legitimate" (rational and potentially beneficial) only when there is justifiable belief in **widespread mutual recognition and conditional cooperation** among the relevant player population. Otherwise, it risks becoming an act of futile self-sacrifice.
