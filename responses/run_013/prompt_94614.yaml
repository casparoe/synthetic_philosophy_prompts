answer: |-
  You've precisely dissected a pervasive and problematic maneuver in historical studies—one that straddles the line between flawed methodology and rhetorical sleight-of-hand. It is indeed distinct from euhemerism, rationalization, or standard source criticism. Let's anatomize it:

  ### The Minimal Structure: Four-Step Reclassification
  1. **Concession of Legendary Status**: The narrative is initially acknowledged as non-historical (wondrous events, schematic structure, typological characters, etiological/ideological function).  
  2. **Presentation of Substratum**: A mundane archaeological find, historical figure, or social phenomenon is introduced, situated plausibly within the narrative's *background or setting* (e.g., a destroyed city layer at Hisarlik, a 5th–6th century Romano-British warlord, Late Bronze Age Semitic populations in Egypt).  
  3. **Conflation of Categories**: The substratum is declared the "historical core" or "kernel," despite having no causal or evidentiary link to the narrative's *central legendary events* (Achilles' duel with Hector, Arthur pulling Excalibur, the parting of the Red Sea).  
  4. **Burden-Shifting**: The narrative is reclassified as "historical in outline." Skeptics are challenged to disprove the substratum's relevance—even though it doesn't validate the legend's key claims.  

  ### Why Legitimate Inference Differs
  Legitimate historical reconstruction requires:  
  - **Causal Specificity**: Evidence must connect directly to the *defining elements* of the tradition (e.g., Hittite texts mentioning "Wilusa" and conflict align with the Trojan War's geopolitical context).  
  - **Evidence of Transmission**: A plausible pathway of distortion from event to legend (e.g., oral traditions of Bronze Age collapses morphing into "Sea Peoples" invasion legends).  
  - **Avoiding Conflation**: Distinguishing *setting* from *plot*. A burned city is setting; a decade-long war over a queen is plot.  

  Here, the substratum only validates *setting* or *context*, but the move illicitly transfers that validity to the *plot*.  

  ### Category Error: When Context Swallows Narrative
  The error occurs when **compatibility** is mistaken for **confirmation**. The substratum is compatible with both:  
  (A) The legend being a fictional story set in a real milieu,  
  (B) The legend being a distorted memory of real events.  
  The move treats (A) as impossible once (B) is plausible—a false dichotomy.  

  **Boundary Cases**:  
  - **Valid Inference**: Canaanite destruction layers c. 1200 BCE *plus* Egyptian texts describing "Asiatics" leaving during instability → supports a *migration* context for Exodus folklore.  
  - **Kernel-Washing**: Using the same evidence to claim the Exodus *narrative* (plagues, divine intervention, 40-year desert journey) is "historical in outline."  

  ### Proposed Term: **Substratum Alchemy**
  **Definition**: The rhetorical transmutation of a mundane historical substratum into false validation of a legendary narrative’s core plot, reclassifying myth as history via category conflation and burden-shifting.  

  **Why this term?**  
  - **Substratum**: Highlights the tangible but peripheral evidence.  
  - **Alchemy**: Emphasizes the illusory transformation (lead → gold, context → plot).  
  - Avoids "kernel" (which implies a narrative seed) to reject the very premise.  

  **Boundary Illustrations**:  
  1. **Not Substratum Alchemy**: Using dendrochronology to prove a volcanic eruption correlates with Plato's Atlantis *timeline* while rejecting Atlantis itself as fiction.  
  2. **Substratum Alchemy**: Claiming the Thera eruption "proves Atlantis was historical"—shifting focus from the legend’s content to its setting.  
  3. **Gray Area**: Linking a Celtic bear-god name ("Artos") to Arthur. This risks alchemy if used to "prove" Arthur's historicity, but is valid if tracing cultural influences.  

  ### Why This Move Persists
  It serves psychological and ideological needs:  
  - **Cognitive Comfort**: Resolves dissonance between myth's power and empiricism’s demands.  
  - **Narrative Salvage**: Preserves cultural patrimony as "true" without defending the indefensible.  
  - **Academic Tribalism**: Creates defensible territory ("We accept it’s mythic, but here’s our *proof*...").  

  Your instinct for "kernel-washing" was astute—but "alchemy" better captures the *transmutation* of evidentiary value. This isn’t just bad history; it’s a category hijacking. To counter it, demand: *"Does your substratum explain the legend’s wonder, or merely its wallpaper?"*  

  Would you like to workshop examples from your seminar using this framework?
