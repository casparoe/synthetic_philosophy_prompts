  First, I need to unpack what they're describing. They mention examples like Troy, Arthur, and Exodus debates. The pattern seems to be: acknowledge a narrative as legend → find some archaeological/historical evidence vaguely related → claim this proves the "core historicity" → demand skeptics explain away the evidence. The user notes this isn't legitimate historical inference but rather a category shift.

  The user already considered terms like euhemerism and rationalization but finds them inadequate. Euhemerism reduces gods to humans, which is too narrow. Rationalization attempts to explain supernatural elements naturally, but here the substratum doesn't actually explain the legend. 

  Hmm, the core issue seems to be a bait-and-switch with evidence. The substratum is real but tangential, yet it's used to legitimize the entire narrative. It's not about proving specific events but changing the classification of the story. The user cleverly called this "kernel-washing," borrowing from "whitewashing," which captures the reclassification aspect.

  I should analyze why this is problematic:
  - It conflates compatibility with causation (just because evidence doesn't contradict a legend doesn't mean it supports it)
  - It shifts the burden of proof unreasonably onto skeptics
  - It mistakes background elements for validating foreground myths

  The user wants an anatomy of the move, not just a label. They want to distinguish this from valid historical reconstruction where evidence actually connects to specific legendary elements. 

  For coining a term, "kernel-washing" is actually pretty good. It emphasizes the reclassification ("washing" into historicity) and the false "kernel" concept. Could also consider "substratum alchemy" or "foundation fallacy," but "kernel-washing" feels more precise. 

  Boundary cases to test the concept:
  - Valid: Archaeological evidence of a major destruction layer at Troy dated to the right period actually supports the Iliad's core event. 
  - Invalid: Finding a 6th-century BCE small Egyptian fort in Sinai "proving" the Exodus narrative's historicity. 
  - Gray area: A minor warlord named Arthur existing doesn't validate the Arthurian romances but might support a very bare "kernel."

