prompt: |-
  Carnap's philosophy contains a tension that I would like to have explained. He was a non-cognitivist about value judgments: sentences that ascribe value or prescribe conduct do not state anything true or false, and their function is expressive or practical rather than descriptive. Yet he was also a socialist who took seriously the thought that the economic and social order can be planned, and whose principle of tolerance assigns the choice between rival frameworks to convention and practical decision rather than to truth. Please explain the conceptual issue that this combination raises — not by surveying what commentators have said, but by working out where the pressure actually lies.

  I am especially interested in one suggestion, and want you to explain what follows from it: that we transpose Carnap's own distinction between questions internal to a framework and the external question of which framework to adopt from the domain of ontology to the domain of practice, so that the question whether a given arrangement is unjust becomes internal and answerable, while the question which evaluative framework to adopt becomes external and settled by decision or convention. Explain the consequences for the coherence of Carnap's position. In particular: must the internal questions of morality be truth-apt for the analogy to do any work, and if so, does that compromise his non-cognitivism? What is the status of the socialist's advocacy once ultimate ends are placed outside the domain of truth — a proposal, a prediction, an expression of attitude, or something else? And does the notion of rational planning presuppose a standard of success that non-cognitivism is unable to supply?

  Lay out the issue rather than settling it, and make clear at each step which of Carnap's commitments is doing the work. No citations needed.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're pointing out a tension in Carnap's philosophy between his non-cognitivism about value judgments and his socialist commitments to rational planning. The user wants me to explore this tension without relying on commentators, focusing instead on the conceptual pressure points. Specifically, they're interested in applying Carnap's internal/external distinction to the domain of practice.

  First, I need to recall Carnap's key positions. His non-cognitivism means that value judgments aren't truth-apt; they're expressive or practical. Yet as a socialist, he advocated for planning societies based on certain values. The principle of tolerance allows choosing frameworks via practical decisions, not truth. The user suggests transposing the internal/external distinction from ontology to practice, making moral questions internal and framework choice external.

  The main tension arises because non-cognitivism denies truth to values, but rational planning seems to require objective standards. If adopting a framework is a practical decision, how can we rationally justify socialist planning? If moral statements are only internal, does that mean they're truth-apt within the framework, contradicting non-cognitivism? That's a key issue.

  The user asks several specific questions. First, if internal moral questions are truth-apt, that might compromise non-cognitivism. But Carnap could say they're technical, like how to achieve agreed ends, not about the ends themselves. Then the ends would be part of the external choice. But does that make advocacy just an expression of attitude? That seems at odds with Carnap's serious socialist engagement.

  Also, rational planning needs criteria for success. Non-cognitivism might struggle here because if success is defined by values, and those are non-cognitive, then success is subjective. But planning requires some objective measures. Maybe Carnap could argue for instrumental rationality, but then the ultimate ends are still non-cognitive.

  I should also consider the status of socialist advocacy. If ultimate ends are decided externally, is Carnap's socialism just a proposal or expression? That might weaken the normative force he seemed to attribute to it. The principle of tolerance itself might be undermined if there's no rational way to choose frameworks.

  Each step needs to tie back to Carnap's commitments: non-cognitivism, principle of tolerance, and his socialist advocacy. The user wants the pressure points laid out without resolution, so I'll present the conflicts clearly. For example, the internal/external transposition creates a dilemma: either internal morals are truth-apt (contradicting non-cognitivism) or they're not (making planning lack substance). Also, without truth-apt standards, how can we evaluate planning success? These tensions challenge the coherence of his overall position.
answer: |-
  Here's a breakdown of the conceptual tension within Carnap's position, focusing on the transposition of his internal/external distinction to the domain of practice and its consequences:

  1.  **The Core Tension:**
      *   **Non-Cognitivism (Commitment 1):** Value judgments (e.g., "Socialism is just," "This policy is good") are not truth-apt. They express attitudes, preferences, or commands, akin to "Hooray for socialism!" or "Adopt socialism!". They do not describe states of affairs and cannot be true or false.
      *   **Rational Planning & Principle of Tolerance (Commitment 2):** Carnap believed social and economic systems could and should be rationally planned based on empirical inquiry and logical analysis. His *principle of tolerance* dictates that the choice between *frameworks* (linguistic, logical, ontological) is not a matter of truth but of *practical expediency* – which framework best serves our purposes (e.g., simplicity, fruitfulness for science). This principle seems extendable to *practical frameworks* (like ethical or political systems). Socialist advocacy, therefore, appears as the proposal/prescription to adopt a framework optimized for certain (presumably socialist) goals.

  2.  **The Proposed Solution: Transposing Internal/External:**
      *   The suggestion is to apply Carnap's distinction directly to the practical domain:
          *   **Internal Questions (Practical Frameworks):** Once a specific evaluative framework is adopted (e.g., a utilitarian framework, a socialist conception of justice), questions *within* that framework *are* cognitively significant. "Is policy X consistent with socialist principles?" or "Does arrangement Y maximize utility?" become technical, empirically/analytically tractable questions with truth-values. Planning becomes the process of answering these internal questions to achieve the framework's goals.
          *   **External Questions (Framework Choice):** The choice *between* competing frameworks (e.g., socialism vs. laissez-faire capitalism, utilitarianism vs. deontology) is *not* a matter of truth. It's a *practical decision*, guided by convention, non-cognitive preferences ("volitional decisions" in Carnap's terms), or assessments of the framework's *practical consequences* (efficiency, coherence, psychological/social effects) relative to some underlying, non-truth-apt goals or inclinations.

  3.  **Consequences for Coherence & Pressure Points:**

      *   **Truth-Aptness of Internal Moral Questions & Non-Cognitivism:**
          *   **Pressure:** For internal questions within a *practical* framework to be genuinely analogous to internal questions within a *theoretical* framework (like ontology), they *must* be truth-apt. "Does this arrangement violate principle P?" needs a true/false answer *relative to framework F* for the analogy to hold and for "rational planning" within F to be substantive.
          *   **Conflict with Non-Cognitivism:** This directly contradicts Carnap's core non-cognitivism. Non-cognitivism holds that *fundamental* value judgments (like accepting principle P itself) are non-truth-apt. The transposition makes *derivative* value judgments ("This violates P") truth-apt *only relative to F*. Carnap might bite this bullet, arguing non-cognitivism only applies to *ultimate* ends/framework choices (the external question). However, this significantly weakens non-cognitivism, confining it solely to the foundational choice, while allowing robust cognitive discourse *within* an adopted framework. It risks collapsing into a form of *relativist cognitivism*: moral truths exist, but only relative to a chosen framework. This is in tension with the spirit of his emotivist/prescriptivist leanings regarding *all* value discourse.

      *   **Status of Socialist Advocacy (External Choice):**
          *   **Pressure:** If the choice for the socialist framework is an *external* decision, settled by convention/practical decision rather than truth, what is the status of Carnap's *advocacy* for socialism?
          *   **Possible Statuses & Tensions:**
              *   **Proposal:** It's a suggestion ("Let's adopt framework S"). But why *this* proposal? On what grounds is it preferable? If the grounds are purely non-cognitive ("I like it"), advocacy loses rational force.
              *   **Prediction:** "Adopting socialism will lead to consequences C (which you will/would prefer)." This relies on empirical predictions (internal questions *if* we value C) and assumes shared, non-cognitively grounded preferences for C. If preferences aren't shared, the prediction offers no *reason* to adopt S.
              *   **Expression of Attitude:** "Hooray for socialism!" This aligns with non-cognitivism but renders advocacy purely emotive, clashing with Carnap's rationalist image of planning and the principle of tolerance's appeal to *practical expediency*.
              *   **Appeal to Pragmatic Virtues:** "Framework S is simpler, more efficient, more coherent, or leads to less suffering than framework C." This invokes criteria like "efficiency" or "less suffering." But:
                  *   Are *these* criteria themselves truth-apt? If not, they are just expressions of preference.
                  *   If they *are* truth-apt, they must be grounded in *another*, more fundamental framework, leading to an infinite regress or a privileged framework that *is* truth-apt, again compromising non-cognitivism.
          *   **Fundamental Issue:** Socialist advocacy, if it claims any rational superiority beyond mere preference, seems to require *some* evaluative standard that transcends the frameworks being chosen. Non-cognitivism, applied to the external choice, denies the truth-aptness of any such standard. Carnap's principle of tolerance suggests *practical expediency* as the standard, but defining this without smuggling in truth-apt values is extremely difficult.

      *   **Rational Planning & Standards of Success:**
          *   **Pressure:** Rational planning within a framework (internal) presupposes a clear standard of "success" defined by the framework's goals. However, the rationality of the *planning process itself* (means-ends reasoning) seems to rely on a *cognitivist* notion of instrumental rationality: "Action A *is* the best means to achieve goal G" is treated as a truth-apt statement.
          *   **Conflict with Non-Cognitivism:** This instrumental rationality appears cognitive. Furthermore, the *ultimate* goals (G) are set by the external choice, which is non-cognitive. The deep tension arises when asking: *Can non-cognitivism supply the normative force needed for "rational" planning?*
          *   **The Success Standard Problem:** Planning is undertaken to achieve something *better*. But "better" according to whom/what? If the standard is internal to the chosen framework, planning is rational *relative to F*. But if someone rejects F, calling the plan "rational" has no force. If "success" requires an *external* standard, non-cognitivism denies such a standard can be truth-apt. Planning seems to require a notion of *objective improvement* that non-cognitivism cannot provide. Carnap might argue planning's "success" is merely achieving the (non-cognitively chosen) goals, but this reduces "rational planning" to "effective technique," potentially stripping it of the normative weight Carnap assigns it in social discourse.

  4.  **The Root of the Pressure:**
      The fundamental pressure arises from **the combination of Carnap's strong non-cognitivism (denying truth-aptness to fundamental values) and his commitment to rationality in the practical domain (planning, framework choice via principle of tolerance).** The transposition of the internal/external distinction attempts to salvage rationality *within* a framework but exposes the difficulty:
      *   **At the Internal Level:** Making derivative value judgments truth-apt compromises the universality of non-cognitivism.
      *   **At the External Level (the crux):** Denying truth-aptness to the framework choice leaves the rationality of that choice, the status of advocacy, and the standard for planning's "success" hanging. The principle of tolerance appeals to "practical expediency," but defining this without relying on *some* implicit, potentially truth-apt value (like efficiency, coherence, well-being, or even the "purpose" of the framework) is arguably impossible. Carnap's socialist advocacy implicitly relies on such values having more weight than mere preference, creating tension with his meta-ethical starting point. The coherence of his position hinges on whether "practical decision" can bear the rational weight he places upon it without collapsing into cognitivism or empty emotivism.
