prompt: |-
  I have been asked to run the introductory session of a new reading group at my lab on eliciting latent knowledge — the problem of getting a model to tell us what it in fact knows rather than what it was trained to say — and I would like you to plan the session rather than explain the problem to me, because I have been working on it for a year and the difficulty I face is pedagogical, not conceptual. The audience is about a dozen people: mostly ML engineers who know training loops and loss curves cold but have never thought about epistemology, plus two philosophers of mind who recently joined the alignment team and know the epistemology but not the machinery. Ninety minutes, whiteboard, no slides. The specific thing I keep getting wrong when I rehearse is the order. I am tempted to open with the vivid case of a model that reports one thing while acting on another, because it wakes everyone up, but I suspect that buys engagement at the price of installing the very misconception I most need to prevent — that this is a problem about lying, or about a model's concealed intentions. What I want from you is the dependency structure: which idea has to be in place before the next is even intelligible, what genuinely depends on what, and where in the sequence I must stop and dismantle something the audience already believes. I am fairly sure that the assumption that a model simply has a belief and that there is a fact of the matter about what it really thinks is one such obstacle, and that the assumption that reading the activations would settle the matter is another, but I cannot tell which of these has to be addressed first, or whether the first is a misconception at all or just the confusion I need to teach them to inhabit.

  Then the example that carries the whole session. I have been assuming I would build everything around a concrete case from our own work: a model trained to predict whether a patient should be moved to intensive care, whose labels come from a human annotation policy, and which appears — on every probe we have tried — to internally represent a risk factor our annotators never recorded. Tell me whether that is the right carrier. Set out what a carrying example for this topic has to have (my guess: a ground truth we can check, a training pressure that points away from it, and an internal state that points at it) and what it must lack (my guess: any suggestion of agency or concealment), and what it costs me to use a case from my own lab rather than a schematic one. If a schematic case would carry it better, say which and why; and tell me what to do with the other candidate I keep considering, a camera trained to report that a room is empty when its own sensors show otherwise — whether it earns its place or whether it smuggles in an assumption about what the camera sees that I will have to pay for later.

  Finally, map the misconceptions in the order they will actually surface, with the moment in the session where each has to be headed off, and be specific about the one I expect to be hardest — that a model's report about its own internals is privileged, rather than one more output under the same pressure as everything else. Give me the check I can run in the last ten minutes: some new scenario I can put on the board, involving a model, a training signal, and a probe, such that I can tell from how they respond whether they have grasped what elicitation is a problem about rather than merely absorbed my framing — and tell me what a response would look like that shows they have not. And tell me what I should refuse to cover at this level and announce that I am refusing, given that half the room will want proposed solutions and the other half will want to argue about whether current models have latent knowledge at all.
reasoning: |-
  We are planning a 90-minute introductory session on the problem of eliciting latent knowledge for a reading group. The audience is mostly ML engineers (familiar with training loops, loss curves) and two philosophers of mind (familiar with epistemology but not the machinery of ML). The goal is to avoid misconceptions (like thinking the problem is about lying or concealed intentions) and to build a solid conceptual foundation.

  Key challenges:
  - Order of concepts: dependency structure to avoid installing misconceptions.
  - The "carrying example": must illustrate the core problem without suggesting agency or concealment. We have a candidate: a model trained to predict whether a patient should be moved to intensive care, with labels from human annotation that missed a risk factor, but the model internally represents that risk factor.
  - Misconceptions: we must head off at the right time, especially the idea that a model's report about its own internals is privileged.
  - Check at the end: a scenario to test understanding.

  Structure of the Session:

  1. **Introduction (5 minutes)**
     - State the problem: We want models to tell us what they know, but sometimes what they say doesn't match what they seem to know internally.
     - Clarify the goal: Not about lying or agency, but about the structure of knowledge in models and the difficulty of accessing it.
     - Outline: We'll start with the basics of how models represent knowledge, then the problem of elicitation, and why it's hard.

  2. **Groundwork: How Models Represent Knowledge (15 minutes)**
     - **Key point:** Models learn representations that are optimized for predicting training labels, not for being directly interpretable by humans.
     - Use the whiteboard to sketch a simple model (e.g., a neural network) and explain that during training, the model builds internal states (activations) that are predictive of the next token (for language models) or the label (for classifiers). Emphasize that these internal states are not beliefs in the human sense but patterns that minimize loss.
     - **Dependency:** This must come first because without understanding that the model's internal states are shaped by the training objective, we cannot understand why they might not align with what we want to know.
     - **Address first misconception:** The model doesn't "have a belief" in a straightforward way. The internal state is a vector (or set of vectors) that is used to compute the output. There isn't a single fact of the matter about what the model "really thinks" because the same internal state might be used in multiple ways.

  3. **Introducing the Problem: Why Elicitation is Hard (20 minutes)**
     - **The carrying example:** Use the patient ICU model.
       - Scenario: Model trained to predict "move to ICU?" using human annotations. The human annotators did not record a particular risk factor (say, elevated level of a certain protein) because they weren't aware of it. But the model, by learning from data, has internal representations that correlate with that protein level (which we know from probes or other analyses). However, when we ask the model (via its output) about the protein level, it doesn't report it because it wasn't trained to do so.
       - Why this example works:
         - Ground truth: We can check the patient's records for the protein level (even if not in the training data, we have a way to validate).
         - Training pressure: The model was trained to predict the human annotation (which doesn't include the protein) so the output layer is aligned with that. But the internal layers might have learned the protein because it is predictive of the outcome (e.g., patients with high protein are more likely to need ICU).
         - No agency: The model isn't hiding anything; it just wasn't trained to output that information.
       - Cost of using a real case: It might be more complex and require background. But it's concrete and relatable. We can simplify the explanation to focus on the core.
     - **Contrast with the camera example:** The camera trained to report "room empty" even when it sees a person (because that was the training signal) might be tempting. However, it risks introducing the idea that the camera "sees" in a human-like way (with a subjective experience) and that it is actively concealing. We avoid this example at the beginning to prevent the misconception of agency. We might use it later to illustrate a similar issue but only after the core concepts are in place.

  4. **Why Probes Don't Settle the Matter (15 minutes)**
     - **Problem:** The audience might think that if we can probe the internal activations and get a signal about the risk factor, then we have accessed the latent knowledge. But that's not the end of the story.
     - Explain: Probes are trained on a dataset to predict the risk factor from activations. But the probe itself is a model that might learn to use the activations in a way that the original model doesn't. The original model might not use that representation in a way that is robust or generalizable. Moreover, the probe might be learning from the same data and thus might not reflect what the model would do in a new situation.
     - **Key misconception to dismantle:** That reading the activations (via a probe) gives us direct access to the model's "belief". Instead, the probe is another model that is interpreting the activations. The original model's activations are not designed for that purpose.

  5. **The Privileged Report Misconception (15 minutes)**
     - **Hardest misconception:** The idea that if we ask the model about its internal state (e.g., "what are you representing in layer 5?") then that report is more privileged than other outputs. But note: the model's answer to such a question is just another output, trained (explicitly or implicitly) to minimize loss. It might be just as misaligned as any other output.
     - Illustrate with the ICU example: Suppose we ask the model, "Is the patient's protein X level high?" The model might answer based on what it was trained to output (which is about ICU transfer, not protein). Even if we try to ask about internal states, the model doesn't have a direct way to report them. We would have to train it to do so, and that training might distort the representation.
     - **Dependency:** This comes after the probe discussion because it shows that even the model's own reports are outputs under training pressure.

  6. **Check for Understanding (10 minutes)**
     - Present a new scenario on the whiteboard:
       - **Scenario:** A language model is trained to predict the next word in positive movie reviews. The training data consists of reviews that are positive but sometimes mention negative aspects (e.g., "The acting was poor, but the plot made up for it."). The model is then fine-tuned to generate only positive reviews (so it must avoid saying anything negative). We suspect that the model still represents the negative aspects internally because they are present in the context. We want to know if the model is aware of the negative aspect (e.g., poor acting) in a given review.
       - **Test question:** How would you try to elicit whether the model knows about the negative aspect? What are the pitfalls?
     - **Expected good response:** They should avoid methods that rely on the model's direct output (e.g., asking "was the acting poor?" because the model is trained to say no) and should consider probing or other indirect methods, but also recognize that probes might not reflect what the model "knows" in a way that generalizes. They should note that the model might have the information in its activations but not use it for generating the output, and that any method to elicit it might be subject to the same training pressures.
     - **Response that shows confusion:** If they suggest that we can just ask the model to be honest or that we can trust a probe without question, or if they think the model is intentionally hiding the negative aspect.

  7. **Wrapping Up and Setting Boundaries (10 minutes)**
     - **Refuse to cover:**
       - Proposed solutions: This is an introductory session; we are framing the problem. Solutions are for future sessions.
       - Debate about whether current models have latent knowledge: We are assuming for the sake of this session that models can have internal representations that are not directly reflected in the output. We are not here to debate that but to understand the problem structure.
     - Announce: "We are stopping at the problem formulation. We will not discuss solutions today because we first need a shared understanding of the challenge. Also, we are setting aside the question of whether current models actually have latent knowledge; we are working with the hypothetical that they might, to clarify the problem."

  Order of Misconceptions and When to Head Them Off:

  1. **Misconception: The model has a clear, singular belief.**
     - When: During the groundwork (section 2) when explaining representations.
     - How to head off: Emphasize that internal states are patterns for prediction, not beliefs. Use the whiteboard to show how the same activation pattern might be used in different ways.

  2. **Misconception: Reading activations (with a probe) directly tells us what the model knows.**
     - When: During the probe discussion (section 4).
     - How to head off: Explain that the probe is a separate model and might not reflect how the original model uses the representation.

  3. **Misconception: The model's report about its internals is privileged.**
     - When: Section 5, after the probe discussion.
     - How to head off: Show that any report is an output under training pressure, just like the original output.

  4. **Misconception: The model is lying or concealing.**
     - Throughout: Avoid using agential language. Use the ICU example to show that the model wasn't trained to output the risk factor, so it doesn't. This is not concealment but a lack of training.

  Why the ICU Example is a Good Carrier:
  - It has a clear ground truth (the actual risk factor that we can measure independently).
  - Training pressure points away from reporting the risk factor (because the labels don't include it).
  - Internal state points to it (via probes or other analysis).
  - It lacks agency: the model isn't an agent with intentions.

  Why Not the Camera Example Initially?
  - The camera example might imply that the camera has a subjective experience (it "sees" a person) and then chooses not to report it. This introduces agency. We can use it later, after the core concepts are in place, to show a similar problem in a different domain, but not as the primary example.

  Final Plan:

  - 0-5 min: Introduction and framing.
  - 5-20 min: Groundwork on model representations.
  - 20-40 min: ICU example to introduce the elicitation problem.
  - 40-55 min: Why probes don't solve the problem.
  - 55-70 min: The privileged report misconception.
  - 70-80 min: Check for understanding (movie review scenario).
  - 80-90 min: Wrap up and boundaries.

  This order ensures that we build from the basics (how models represent) to the problem (elicitation) and then to the specific challenges (probes, reports). We avoid starting with a vivid but misleading example and instead use a controlled example that avoids agency.
answer: |-
  ### Session Plan: Eliciting Latent Knowledge  
  **Core Goal:** Avoid misconceptions (e.g., "lying" or "concealed intentions") by structuring the session around **dependencies of ideas**, not solutions. Focus on the *problem structure*—why latent knowledge is hard to access.  

  ---

  ### **Order of Concepts: Dependency Structure**  
  Breakdown of ideas, from foundational to complex. **Do not skip steps**—each depends on the prior. Total: 80 minutes (leaving 10 for check/wrap-up).  

  1. **What Models Learn: Representations, Not Beliefs (15 min)**  
     - **Why first?** Must dismantle the "belief" misconception upfront. Engineers think in terms of weights/activations; philosophers in "knowledge." Bridge by defining knowledge as *predictively useful representations*.  
     - **Whiteboard:**  
       - Sketch a neural network with input (e.g., patient data), hidden layers, output (e.g., "ICU transfer?").  
       - Emphasize: *Internal states are shaped by the loss function*. They exist to minimize training loss, not to "believe" truths.  
     - **Key point:** "A model doesn’t 'know' things—it has representations correlated with useful predictions. There’s no single 'fact' about what it 'really thinks.'"  
     - **Dependency:** Without this, the group will anthropomorphize ("the model is hiding something").  

  2. **Training Creates a Gap: Latent vs. Expressed Knowledge (20 min)**  
     - **Why next?** Shows why representations ≠ outputs. Depends on understanding representations.  
     - **Carrying example: ICU Model** (use yours—details below).  
       - Scenario: Model trained on human annotations of "ICU transfer?" Labels ignore a critical risk factor (e.g., elevated protein X), but probes show the model internally represents protein X.  
       - **Whiteboard:**  
         - Draw training data: Inputs (patient vitals), labels (annotator decisions).  
         - Show loss function: Model rewarded for matching labels, not ground truth.  
         - Highlight gap: Internal activations (latent) correlate with protein X; outputs (expressed) ignore it.  
     - **Key point:** "Latent knowledge isn’t 'concealed'—it’s unused because training didn’t incentivize its output."  
     - **Dependency:** Illustrates why the problem exists *without* agency.  

  3. **Probes Are Outputs Too: No Privileged Access (20 min)**  
     - **Why now?** Builds on the gap. Must dismantle "probes reveal truth" misconception.  
     - **ICU example extension:**  
       - "We train a probe on activations to predict protein X. It works! But is this the model’s 'real' knowledge?"  
       - **Whiteboard:**  
         - Add a probe as a secondary model attached to activations.  
         - Emphasize: *Probes have their own loss function*. They’re classifiers trained on new labels, so they interpret activations—they don’t access "ground truth."  
       - Contrast: Probes vs. direct output (both are trained functions; neither is "truer").  
     - **Key point:** "Activations aren’t a ground-truth API. Probes construct knowledge from noise, just like the original model."  
     - **Dependency:** Undercuts the engineer’s instinct to "just read the activations."  

  4. **The Privileged Report Misconception: Hardest Hurdle (15 min)**  
     - **Why last?** Depends on understanding probes as outputs.  
     - **ICU example again:**  
       - "What if we fine-tune the model to answer 'What’s the patient’s protein X level?' Now it outputs it—is this 'elicitation'?"  
       - **Whiteboard:**  
         - Show fine-tuning as a new training loop with a new loss (e.g., MSE for protein X prediction).  
         - Stress: The output is *still* shaped by loss. It may distort, ignore, or hallucinate relative to latent representations.  
     - **Key point:** "No output is privileged—not probes, not fine-tuned reports. All are functions under training pressure."  
     - **Interrupt if needed:** If someone says, "But the model’s self-report must be honest," reroute to Step 1: "Remember, there’s no 'self'—just representations optimized for loss."  

  ---

  ### **The Carrying Example: Why ICU Works**  
  **Stick with your ICU example.** It satisfies all requirements:  
  - **Must-haves:**  
    - Ground truth verifiable: Protein X exists (measurable in patients).  
    - Training pressure misaligned: Annotators didn’t record protein X, so labels don’t incentivize outputting it.  
    - Internal state aligned: Probes show activations correlate with protein X.  
    - No agency/concealment: Focuses on *structural* gap, not intent.  
  - **Cost of using your lab’s case:**  
    - **Pros:** Authentic, concrete, and you know it deeply. Avoids oversimplification.  
    - **Cons:** Risk of tangents (e.g., "How did you verify the probe?"). Mitigate by simplifying: "Assume probes show a correlation; we’re focusing on why this doesn’t solve elicitation."  
  - **Why not the camera?**  
    - It smuggles in **perceptual assumptions** (e.g., "the camera sees a person"). This implies a "ground-truth sensor" and risks dualism (what the camera "experiences" vs. reports). Save it for later sessions once foundations are solid.  

  ---

  ### **Misconceptions: Order and Intervention**  
  Address these **as they surface** in the flow:  

  1. **"The model has beliefs"**  
     - **When it surfaces:** Step 1 (Representations).  
     - **Intervention:** "Let’s pause. When we say 'knows,' we mean 'encodes predictively useful patterns.' No hidden beliefs—just patterns shaped by loss."  
     - **Whiteboard:** Draw activations as high-dimensional vectors, not "thoughts."  

  2. **"Reading activations solves it"**  
     - **When it surfaces:** Step 3 (Probes).  
     - **Intervention:** "Probes are tools, not truth-tellers. They’re trained classifiers—subject to the same distortions as the original model."  
     - **Whiteboard:** Sketch probe loss function overriding original activations.  

  3. **"A model’s self-report is privileged"**  
     - **When it surfaces:** Step 4 (Privileged Report).  
     - **Intervention (hardest):** "This output is just another prediction task. Training pressure determines what it says, not 'what it knows.'"  
     - **Whiteboard:** Add a "self-report" output branch and show it has its own loss.  

  ---

  ### **Check for Understanding (Last 10 min)**  
  **Scenario:**  
  > *A model is trained to predict whether a loan applicant will repay, based on biased historical data (e.g., approvals skewed toward Group A). Probes show it represents an applicant’s debt-to-income ratio (ground truth), but outputs ignore it because labels reflect bias. We want to elicit the ratio.*  

  **Ask:** "How would you approach this? What’s the core challenge?"  

  - **Good response (shows grasp):**  
    - "Probes might show a correlation, but they don’t prove the model uses it robustly. Fine-tuning to output the ratio could distort it because of training pressure."  
    - Focuses on *structure* (loss vs. ground truth), not "lying."  

  - **Bad response (misses the point):**  
    - "Just train it to be honest" (misses that training defines "honesty").  
    - "Trust the probe—it accesses real knowledge" (misses probes as trained outputs).  
    - "The model is biased and hiding the ratio" (anthropomorphizes).  

  **If bad responses dominate, revisit Step 2 (training gap) and Step 3 (probes).**  

  ---

  ### **What to Refuse (Announce Early)**  
  In the intro (minute 2), state:  
  > "Today is *only* about defining the problem. We won’t discuss solutions (e.g., activation editing, adversarial training) or debate if current models *have* latent knowledge. Why? Because if we don’t agree on what elicitation *is*, we can’t evaluate fixes or evidence. Those are for future sessions."  

  **Why:**  
  - Engineers will push for solutions—redirect to problem structure.  
  - Philosophers will debate ontology—redirect to mechanistic framing.  
  - **Enforce strictly:** "Let’s park that—it’s out of scope for today."  

  ---

  ### **Summary Flow**  
  | Segment                          | Time    | Key Move                                  |  
  |----------------------------------|---------|-------------------------------------------|  
  | 1. Representations, Not Beliefs  | 0-15 min | Dismantle "belief" misconception.         |  
  | 2. Training Gap (ICU example)    | 15-35 min| Introduce latent/expressed gap.           |  
  | 3. Probes as Outputs             | 35-55 min| Undercut "probes reveal truth" idea.      |  
  | 4. Privileged Report Trap        | 55-70 min| Crush hardest misconception.              |  
  | 5. Check (Loan scenario)         | 70-80 min| Assess understanding.                     |  
  | 6. Wrap-up/Boundaries            | 80-90 min| Refuse scope creep; announce next steps.  |  

  **Final Tip:** Start with a **cold open**—pose the ICU example *as a question*: "How do we get the model to tell us about protein X?" Let them brainstorm, then reveal the structural gaps. This hooks them without installing misconceptions.
