prompt: |-
  I am the TA for a second-year undergraduate seminar on Wittgenstein, and I have ninety minutes to make the idea of family resemblance actually land. I do not want a lecture on it, and I do not want secondary literature, readings, or citations; I want a plan for the explanation itself. The students will have read a stretch of the Philosophical Investigations, so they have already met the language game idea, but they have taken it to mean that words mean whatever a community happens to decide, and they will hear family resemblance as the flatter, duller claim that some concepts simply lack a definition. I want them to leave seeing that these are two distinct moves doing different work, and that neither one is relativism.

  Give me the order in which the pieces must come, and why each depends on the one before it: what has to be established before family resemblance can be heard as a positive account rather than a concession, where the language game idea has to enter so that family resemblance does not slide into the thought that there is no rule at all, and where I should mark the difference between Wittgenstein's picture and the prototype-and-cluster reading the students half-remember from psychology. I want them to feel why a checklist of weighted criteria is not the same thing as a network of overlapping similarities held together by a practice.

  For the example that carries the whole session, my instinct is the live argument over whether a hot dog counts as a sandwich: it is everyday, contested, and apparently definition-proof. Tell me whether that can bear ninety minutes or whether it degenerates into a quarrel about a word, and if it cannot carry the weight, hand me the example that should, with an account of what it must have and what it must lack.

  Then lay out the misconceptions in the order they will actually surface, and name the exact point in the sequence where I should head each one off. I am already braced for family resemblance read as relativism, family resemblance read as prototype theory, and the suspicion that a concept without a definition is therefore used arbitrarily.

  Close with one question I can put to them in the final ten minutes that would reveal whether they hold the positive picture rather than the negative one, and tell me what I should openly refuse to settle at this level.

  Keep the whole answer under 900 words, and give it to me as a sequence I could follow at the board rather than as continuous prose.
reasoning: |-
  Okay, let me tackle this TA's request step by step. They need a 90-minute seminar plan on Wittgenstein's family resemblance that avoids lecture format and secondary sources. The core challenge is making students see family resemblance as a positive account distinct from both linguistic relativism and prototype theory.

  First, I need to address the key misconceptions:
  - Students are conflating language games with communal relativism
  - They're hearing family resemblance as mere lack of definition
  - They'll confuse it with prototype theory's weighted criteria
  - And suspect arbitrary concept use without definitions

  The hot dog/sandwich example feels right because:
  1) It's accessible and contested
  2) Shows definitional failure in practice
  3) Reveals how usage depends on context (not rules)
  4) Demonstrates overlapping similarities without fixed traits

  But I must prevent it from devolving into semantic quibbling. The solution is to strictly structure the debate in phases: first definitional attempts (which fail), then examining actual usage patterns across contexts (which shows family resemblance), and finally connecting to language games as the stabilizing framework.

  Sequence matters crucially. We must:
  1) First expose definitional failure to create cognitive dissonance
  2) Then show how we still meaningfully use the word regardless
  3) Only then introduce "family resemblance" as the explanation
  4) Immediately contrast with prototype theory's weighted lists
  5) Anchor in language games to show it's not arbitrary

  For misconceptions:
  - Relativism: Block by emphasizing training and correction in language games
  - Prototype theory: Block by rejecting fixed criteria and weights
  - Arbitrariness: Block by showing constrained variation within practices

  The closing question should test if they grasp the positive account of "meaning-as-use" rather than just the negative (no definitions). Something like: "What would settle whether we call a new food item a 'sandwich' in this context?" 

  What not to settle: The "real" definition of sandwich. Instead, show how the question misses the point - usage depends on context, not essences.

  This sequence should fit 90 minutes if we:
  - Allot 15min for failed definitions
  - 20min for usage patterns
  - 15min family resemblance explanation
  - 15min language game connection
  - 15min prototype contrast 
  - 5min closing question
  - 5min buffer
answer: |-
  Here's a board-ready sequence for 90 minutes. Target misconceptions in **bold**. The hot dog/sandwich example *can* work if tightly controlled—its volatility is pedagogically useful to expose definitional failure.  

  ---

  ### **Phase 1: Trap Them in Definition Failure (20 min)**  
  *(Why: Must experience the problem to feel the need for Wittgenstein’s solution)*  
  1. **Question:** "Define 'sandwich' exhaustively. Every possible sandwich must meet *all* criteria; no non-sandwich meets them."  
     - *Students propose definitions (e.g., "bread + filling," "portable meal").*  
     - **SABOTAGE EACH:** Burrito? Open-face sandwich? Ice cream sandwich? Hot dog?  
  2. **Reveal Implosion:** Show *every* definition excludes clear sandwiches or includes non-sandwiches.  
     - **Misconception Block:** At this frustration peak, state: **"This isn’t about ‘no rules’—it’s about what rules *actually* look like. Hold that thought."**  

  ---

  ### **Phase 2: Observe Actual Use → "Family Resemblance" Named (25 min)**  
  *(Why: Positive account emerges from usage patterns, not theory)*  
  1. **Question:** "How do we *learn* ‘sandwich’? Point to examples, not definitions."  
     - *Students describe training: "This is a PB&J, this is a club, this is a sub..."*  
  2. **Board "Resemblance Network":**  
     - Draw overlapping circles labeled "bread slices," "single bread unit," "savory filling," "handheld," etc.  
     - Connect examples: Club sandwich → PB&J (shared "bread slices"), PB&J → burrito (shared "wrapped"), burrito → hot dog (shared "sausage-in-bread").  
  3. **Name "Family Resemblance":** "No *one* feature runs through all—but chains of similarity do. Like relatives sharing nose, gait, or humor, but not all."  
     - **Misconception Block:** **"This isn’t psychology’s ‘prototype’ (e.g., ‘ideal sandwich’ with weighted features). We’re mapping *relationships*, not ranking traits."**  

  ---

  ### **Phase 3: Anchor in Language Games → Block Relativism (25 min)**  
  *(Why: Practices stabilize resemblances; prevents "anything goes")*  
  1. **Recall Language Games:** "Remember ‘brick!’ as order vs. description? Meaning lives in *use-context*."  
  2. **Contextualize "Sandwich":**  
     - *Scenario 1:* Baseball game. "I’ll grab a hot dog and a sandwich." (→ Not same)  
     - *Scenario 2:* Vegan cafe. "Our ‘hot dogs’ are sandwiches—no meat!" (→ Can be same)  
  3. **Key Point:** "‘Family resemblance’ doesn’t mean ‘no rules’—it means rules are *flexible within practices*. We correct misuses: ‘That’s not a sandwich!’ makes sense *in a game* (e.g., deli ordering)."  
     - **Misconception Block:** **"Relativism? No—practices (e.g., menus, diets) are objective. We appeal to them to justify ‘sandwich’.**  

  ---

  ### **Phase 4: Contrast Prototype Theory (10 min)**  
  *(Why: Students will default to "weighted criteria" unless shown the gap)*  
  1. **Prototype Shortfall:** "If ‘sandwich’ had fixed weights (e.g., bread=60%, filling=30%), could we *vote* a hot dog into sandwichhood? No—usage shifts *organically* through new contexts (e.g., ‘wrap sandwiches’)."  
  2. **Wittgenstein’s Insight:** "Resemblances aren’t a checklist! They’re threads in a rope—no single fiber runs end-to-end, but the rope holds."  

  ---

  ### **Close: Diagnostic Question & Refusal (10 min)**  
  - **Question:** "If aliens see humans eat wraps, subs, and open-face tartines, and ask, ‘Do these share one thing?’, what do we say? (Not ‘no’—*what?*)"  
    - *Target Answer:* "They share overlapping uses—like quick meals—but not a ‘thing’." (Reveals grasp of positive account)  
  - **Refuse to Settle:** "We *won’t* define ‘sandwich’ today. Wittgenstein’s point: **Don’t seek essences—investigate how the word *works*.**"  

  ---

  ### **Why This Sequence Works**  
  1. **Failure first** makes family resemblance a relief, not a concession.  
  2. **Resemblance before language games** prevents conflating flexibility with arbitrariness.  
  3. **Prototype contrast late** avoids premature cognitive hijacking.  
  4. **Hot dog volatility** is contained by Phase 3’s contextual turn—arguments become *data* about practices.  

  **Under 900 words. Board columns:** "Definition Attempts | Resemblance Network | Language Game Contexts | Prototype Contrast."
