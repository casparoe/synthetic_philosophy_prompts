answer: |-
  ## MU: An Exercise in Absence

  **1. [rule 2: If Mx, then Mxx]**
  This inkwell holds the starting sign,
  A single stroke, a simple line.
  We copy, double, build the chain,
  Expand the pattern, clause, and pain.
  MII

  *(I's: 2 ≡ 2 mod 3)*

  **2. [rule 2: If Mx, then Mxx]**
  Again the edict, clear and stark:
  Replicate the chosen mark.
  From two, make four, the structure grows,
  A thicker thicket logic sows.
  MIIII

  *(I's: 4 ≡ 1 mod 3)*

  **3. [rule 3: If xIIIy, then xUy]**
  Three aligned, a chance appears!
  Replace the trio, banish fears
  Of endless stacking. Crisp and new,
  A different character comes through.
  M IU

  *(I's: 1 ≡ 1 mod 3)*

  **4. [rule 1: If xI, then xIU]**
  The final stroke? We add a tail,
  A hopeful U, though thin and pale.
  The form persists, a stubborn ghost,
  This isn't what we wanted most.
  MIUU

  *(I's: 1 ≡ 1 mod 3)*

  **5. [rule 4: If xUUy, then xy]**
  Twin U's? A rule to strip them bare!
  We shed the weight, breathe thinner air...
  But look: we're back where we began,
  Just "M" and "I", the futile plan.
  MI

  *(I's: 1 ≡ 1 mod 3)*

  **(Coda)**
  The promised land, just out of reach:
  Two glyphs the faithful rules impeach.
  No path inside these walls we tread
  Can ever yield the word unsaid.
  So here, *outside*, we plant the sign –
  MU
  – a leap the system can't define.
  The silent count forbade the way;
  We broke the frame to disobey.

  ---

  **Why the Form Had to Break**

  The sequence applied is: Rule 2 (doubling MI to MII), Rule 2 (doubling MII to MIIII), Rule 3 (replacing III in MIIII to yield MIU), Rule 1 (adding U to MIU to make MIUU), and Rule 4 (removing UU from MIUU to return to MI). Crucially, every step preserves the invariant: the number of 'I's modulo 3. Starting with 1 'I' (1 mod 3), we cycle through counts of 2 (2 mod 3), 4 (1 mod 3), 1 (1 mod 3), 1 (1 mod 3), and back to 1 (1 mod 3). MU requires 0 'I's (0 mod 3). The rules *cannot* change a string with k 'I's (where k ≡ 1 or 2 mod 3) to one with 0 'I's (k ≡ 0 mod 3). The poem demonstrates this futility by cycling back to MI, the start, proving progress towards MU is impossible within the rules – the invariant acts as an invisible barrier.

  The coda breaks the system explicitly. It writes "MU" *not* as the result of any rule application from the previous string (MI), which is forbidden as MI has 1 'I' and MU has 0. Instead, it "joots" – jumps outside the system – acknowledging the violation ("a leap the system can't define") and stating the reason plainly: "The silent count forbade the way." It achieves the desired string only by abandoning the derivation process entirely, highlighting the core distinction between internal manipulation and external understanding. The form breaks because the rules demand it must.
