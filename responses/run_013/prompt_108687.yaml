prompt: |-
  A friend who's a doctor keeps getting into it with me about whether 'disease' names a natural fact or just encodes what we don't like, and I'd rather hand her the spec than another slogan. So: write the desiderata any theory of disease (and of health, since the two come as a pair) has to meet. The cases it has to call right in both directions, the ones that have embarrased everybody (homosexuality, and the 19th-century diagnosis for slaves who ran away, on one side; grief, and the contested chronic pain and fatigue syndromes, on the other), the malfunctions that harm nobody and the harms that involve no malfunction, the predisease states we now medicate for (cholesterol, prediabetes, osteopenia), infertility -- a clear failure of a biological function that's devastating to some people and irrelevant to others -- whether it has to cover a tree and a dog or only people, and the reference-class mess: aging is universal and nearsightedness is now the majority condition among young adults in much of urban East Asia, so how much is left of 'statistically abnormal'? With each requirement, the case or consideration behind it, and whether it's a genuine constraint or just a commitment of one camp. Then the part I actually want: which of them can't all hold at once -- in particular, can you keep disease value-free, keep it meaning something bad for the person, and keep it as the thing that licenses treatment? -- and which single requirement does the most to kill off the usual candidates (the biostatistical line, the harm-plus-dysfunction line, and the flat normativist line that it's whatever the culture pathologizes).
reasoning: |-
  Okay, the user's query is quite complex and detailed. They want a set of criteria for defining "disease" and "health," along with examples that challenge existing theories. Let me start by breaking down their main points.

  First, they mention their friend, a doctor, debates whether disease is a natural fact or a value judgment. The user wants a structured list of requirements any theory must meet, rather than slogans. They provided specific cases like homosexuality, drapetomania, grief, chronic pain syndromes, predisease states, infertility, and issues like aging and nearsightedness affecting statistical norms.

  The user also wants to know which requirements conflict, especially whether disease can be value-free, harmful to the person, and justify treatment all at once. Plus, which requirement undermines common theories like biostatistical, dysfunction-plus-harm, and normativist approaches.

  I need to ensure each desideratum includes a case or consideration, and note if it's a genuine constraint or a camp commitment. The conflicts part is crucial. Let me list possible desiderata:

  1. **Harm Requirement:** Diseases must be harmful. Cases like infertility (harmful to some, not others) and asymptomatic conditions challenge this. Is harm subjective or objective? This seems normative.

  2. **Dysfunction Requirement:** Needs a biological malfunction. Cases like aging (universal but not malfunction?) and nearsightedness (common but dysfunctional?) are problems. Homosexuality was wrongly pathologized as dysfunctional. Genuine constraint if we want objectivity.

  3. **Treatment Justification:** Disease status implies treatability. But predisease states (osteopenia) might not need treatment, and some harms (grief) aren't diseases. Conflict here with harm and dysfunction.

  4. **Universality:** Should apply beyond humans? Trees and dogs get diseases. But human-specific values complicate this. Probably a constraint for biological theories.

  5. **Statistical Abnormality:** How to handle aging or common conditions? Not sufficient alone. Constraint against purely statistical theories.

  6. **Value-Freedom:** Can disease be defined without values? Cases like drapetomania show cultural bias. Homosexuality removal from DSM shows values change. Conflict with harm and treatment justification.

  7. **Inclusivity of Contested Cases:** Chronic fatigue, fibromyalgia—lack clear biomarkers. If excluded, patients suffer; included, might medicalize distress. Tension between dysfunction and harm requirements.

  8. **Distinguishing Disease from Normal Variation:** Prediabetes vs. normal aging. Where to draw the line? Requires value judgments.

  Now, conflicts: The main trilemma is value-freedom vs. harm vs. treatment justification. If disease must be harmful and justify treatment, values are inherent. But if it's value-free, harm can't be required. Also, dysfunction alone might not imply harm (asymptomatic conditions), or harm without dysfunction (grief).

  The key undermining requirement: Harm requirement challenges biostatistical (ignores harm), dysfunction-plus-harm struggles with universal dysfunction definitions, and normativism is hit by the constraint against cultural bias (drapetomania example).

  Need to ensure each point ties back to the user's examples. Highlight how infertility challenges harm, aging challenges statistics, etc. The user likely wants a clear framework to present to their friend, showing why no single theory works and where the tensions lie. They might also want to show that medical definitions aren't purely scientific but involve values, which affects diagnoses and treatments.
answer: |-
  Here's a breakdown of the desiderata for a theory of disease/health, structured as requested, followed by analysis of conflicts and the most challenging requirement.

  **Core Desiderata for a Theory of Disease/Health:**

  1.  **The Harm Requirement:**
      *   *What it demands:* Being diseased entails suffering harm, disadvantage, or reduced well-being *for the individual*.
      *   *Case/Consideration:* Infertility (devastating for some, irrelevant for others), Asymptomatic Hypertension (objectively harmful long-term, but subjectively non-harmful until complications arise). Grief (profound harm, but often not a disease).
      *   *Constraint or Commitment?* Primarily a **Commitment** of normativist and "harm+dysfunction" camps. Strict naturalists might reject it as non-scientific. However, *linking disease to suffering* is deeply embedded in the clinical *purpose* of medicine.

  2.  **The Dysfunction/Biological Failure Requirement:**
      *   *What it demands:* Disease requires an underlying failure of biological function, malfunction, or deviation from the species-typical design/functional organization of the organism.
      *   *Case/Consideration:* Homosexuality (historically mislabeled as dysfunction), Drapetomania (fabricated dysfunction), a rotting tree (clear biological failure). Asymptomatic high cholesterol (biological process failing to maintain homeostasis). Aging (universal process vs. accumulation of failures).
      *   *Constraint or Commitment?* **Core Constraint** for naturalist/biostatistical theories and the "harm+dysfunction" model. Normativists reject it as unnecessary.

  3.  **The Treatment Justification Requirement:**
      *   *What it demands:* Classifying a condition as a disease provides a prima facie ethical and/or practical justification for medical intervention (prevention, treatment, cure).
      *   *Case/Consideration:* Prediabetes, Osteopenia (medicated "pre-disease" states), contested syndromes like Chronic Fatigue Syndrome/ME (patients demand treatment legitimacy), Cosmetic "enhancements" (treated medically but often not considered disease). Grief (intervention might be offered, but is it *medical* treatment?).
      *   *Constraint or Commitment?* **Commitment** reflecting the social role of medicine. Not necessarily inherent to the *concept* of disease itself for all theorists, but crucial to its practical application.

  4.  **Universality (Applicability Beyond Humans):**
      *   *What it demands:* The core concept of disease should apply consistently to non-human animals, plants, and potentially other biological systems without relying on human-specific values.
      *   *Case/Consideration:* A dog with parvovirus, a tree with blight, a virus (is it diseased or just pathogenic?).
      *   *Constraint or Commitment?* Primarily a **Constraint** for naturalist/biostatistical theories aiming for biological objectivity. Normativists and some harm+dysfunction theorists accept disease as a distinctly human/social concept.

  5.  **Avoidance of Cultural Relativism/Moralization:**
      *   *What it demands:* The theory must not classify socially disfavored but biologically non-dysfunctional states as diseases merely because of cultural norms or power structures.
      *   *Case/Consideration:* Homosexuality (removed from DSM), Drapetomania (fabricated to control enslaved people), historical "hysteria".
      *   *Constraint or Commitment?* A **Powerful Constraint** against pure normativism. A major goal for naturalists and harm+dysfunction theorists seeking objectivity.

  6.  **Accommodation of Statistical Normality:**
      *   *What it demands:* The theory must handle cases where statistically abnormal conditions aren't diseases (many genetic variations), and statistically *normal* or *common* conditions *are* diseases.
      *   *Case/Consideration:* Aging (statistically universal, but involves accumulating dysfunctions), Nearsightedness (majority condition in some populations, causes harm/dysfunction), beneficial mutations (statistically abnormal, functional).
      *   *Constraint or Commitment?* A **Devastating Constraint** against theories relying *solely* on statistical abnormality (like simple biostatistical views). Requires a functional/normative anchor.

  7.  **Inclusivity of Contested/Medically Unexplained Conditions:**
      *   *What it demands:* The theory should provide principled reasons to include or exclude contested conditions where biological dysfunction is unclear or debated, but significant harm is reported.
      *   *Case/Consideration:* Chronic Fatigue Syndrome/ME, Fibromyalgia, Long Covid (in early stages), some Chronic Pain syndromes. Grief (prolonged/complicated?).
      *   *Constraint or Commitment?* A **Practical Constraint** reflecting clinical reality and patient suffering. Causes tension for strict dysfunction-only views and pure normativism.

  8.  **Distinction from Harm Without Biological Dysfunction:**
      *   *What it demands:* The theory must distinguish disease from states that cause significant harm but lack an underlying biological malfunction.
      *   *Case/Consideration:* Grief, Hunger, Poverty, Illiteracy, Social Ostracism.
      *   *Constraint or Commitment?* A **Core Constraint** for naturalists and harm+dysfunction theorists to maintain a distinct medical domain. Normativists may blur this line.

  9.  **Handling of "Predisease" States:**
      *   *What it demands:* The theory must account for states identified by biomarkers that confer increased risk of future disease, but are not currently causing harm or overt dysfunction.
      *   *Case/Consideration:* High Cholesterol, Prediabetes, Osteopenia, Ductal Carcinoma In Situ (DCIS).
      *   *Constraint or Commitment?* A **Modern Challenge/Practical Constraint** related to prevention and early intervention. Tests the boundaries of dysfunction and harm.

  **Conflicts & Tensions:**

  The central, likely **insoluble trilemma** involves three highly desired but mutually incompatible requirements:

  1.  **Value-Freedom (Desideratum 5 driven by Universality & Anti-Relativism):** Disease must be grounded purely in objective biological facts.
  2.  **Harm Requirement (Desideratum 1):** Disease must be intrinsically bad/harmful *for the person*.
  3.  **Treatment Justification (Desideratum 3):** Disease status provides a primary warrant for medical intervention.

  *   **Why they conflict:**
      *   **Value-Freedom + Harm Requirement:** How can "harm" be defined objectively and universally without reference to values? What constitutes "harm" to an organism (vs. mere difference) seems to require a normative judgment about what counts as "good" functioning or well-being for that organism, especially humans with complex social/psychological needs.
      *   **Value-Freedom + Treatment Justification:** Justifying intervention (cost, risk, resource allocation) inherently involves values – "health" is a value-laden goal. A purely biological dysfunction might not warrant intervention if it causes no harm (e.g., asymptomatic vitiligo, minor anatomical variations).
      *   **Harm Requirement + Treatment Justification + Value-Freedom:** If disease *must* be harmful *and* justify treatment, but must also be value-free, it's unclear how the link between the biological state and the harm/justification is established without values. Harm and justification are evaluative concepts.

  *   **The Implication:** You likely **cannot** simultaneously hold all three. Sacrificing one is necessary:
      *   Sacrifice **Value-Freedom:** Embrace that disease is a hybrid concept (biological dysfunction + value-judgment about harm), or fully normativist. (Harm+Dysfunction models do this implicitly).
      *   Sacrifice **Harm Requirement:** Define disease purely biologically (dysfunction), even if harmless. This severs disease from the core *clinical motivation* and struggles with conditions like infertility where harm is context-dependent. (Pure Biostatistical approach).
      *   Sacrifice **Treatment Justification:** Sever the tight conceptual link. A biological dysfunction *could* be a disease even if untreatable or if treatment isn't justified (e.g., very minor, risky treatment). This weakens medicine's practical rationale.

  **The Requirement That Kills the Usual Candidates:**

  **Desideratum 6: Accommodation of Statistical Normality** is the most potent killer of simplistic theories.

  1.  **Kills Pure Biostatistical Theory (Boorse):** This theory defines disease as statistically subnormal function relative to age, sex, and reference class. **Why it fails:** Aging is statistically normal but involves dysfunctions. Near-universal nearsightedness is statistically *normal* in specific populations but clearly involves dysfunctional vision. Many statistically abnormal traits (e.g., exceptional flexibility, certain harmless mutations) are not diseases. The reference class problem (defining "normal" human variation) becomes insurmountable for common dysfunctions. *This requirement exposes the inability of pure statistics to define "function" or "harm".*

  2.  **Harms Harm+Dysfunction (Wakefield):** While this theory includes dysfunction, it often relies on evolutionary or statistical notions of "natural function" to define dysfunction. **Why it struggles:** Aging challenges the evolutionary definition – is the accumulation of cellular damage outside reproductive prime a "failure" of a naturally selected function? The high prevalence of nearsightedness challenges the "species-typical design" aspect – if it's the norm in a modern environment, is it still dysfunctional relative to the "natural" state humans evolved in? It forces difficult questions about defining the baseline "design".

  3.  **Kills Pure Normativism:** While not reliant on statistics, pure normativism is already devastated by **Desideratum 5 (Avoiding Cultural Relativism/Moralization)**. Desideratum 6 adds another layer: if a harmful state becomes statistically normal (like mild depression or anxiety in some contexts), does pure normativism *have* to call it non-disease simply because it's common? Or does it flip-flop? This highlights normativism's instability and lack of biological grounding.

  **Conclusion:**

  No single theory satisfies all desiderata. The **Statistical Normality requirement** most forcefully exposes the fatal flaw in the Biostatistical approach and creates significant tension for Harm+Dysfunction models. The **core trilemma (Value-Free vs. Harmful vs. Treatable)** demonstrates that a completely value-free account of disease that captures its essential link to suffering and medical intervention is impossible. A hybrid model (like Harm+Dysfunction), acknowledging both biological dysfunction *and* harm (a value-judgment), arguably handles the widest range of cases and constraints most robustly, even if it sacrifices pure value-freedom. Presenting this framework to your friend should shift the debate beyond slogans to the genuine conceptual tensions inherent in defining disease.
