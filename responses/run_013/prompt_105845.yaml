prompt: |-
  I teach a 90-minute session in an upper-level seminar on philosophy of mind, sixteen students, most of them comfortable with functionalism and the Chinese-room debate but with no background in the specific thought experiment where a colony of ants is imagined to be a minded acquaintance of the sort one might chat with over tea. I want to run an activity that makes them feel the pull of the claim that the colony has a mind of its own, and then makes them feel how hard it is to say what would settle it — before I ever say the words "intentional stance" or raise the question of whether the colony is genuinely a subject of experience or merely something we find it convenient to talk about as if it were. My worry is that the standard discussion is too easy: everyone agrees the colony is "just ants" doing simple things, and the conversation dies there. So I want them to actually be the ants first, each with a rule that is genuinely local and stupid, and then to be confronted with the thing their collective produced, which none of them intended and none of them could have described from inside their own rule. Please design the whole session: the setup, the materials, the local rules (I want a real, runnable set — something like deposit-and-follow rules that make the group sort, bridge, or forage without any ant knowing the goal), the number of rounds, and the moment where I reveal to them what they collectively did and ask them to attribute a goal to it. I would like the attribution step to be forced rather than optional: arrange it so that answering a simple question about the group's behavior — what it was trying to do, whether it made a mistake, whether it wanted the thing it got — is much easier in agent language than in ant language, so that the convenience of the mental vocabulary is something they feel rather than something I assert.

  Then build in a second phase that puts pressure on the first: after the colony has been treated as an agent, run a variation in which the same output is produced by a script, a lookup table, or by a shill who has been told the answer, so the group has to decide whether the mentality was in the behavior or in the producing of it; and, if you can, a variation in which the colony behaves identically but each ant is secretly following a different rule than the one on its card, so they must ask whether there is any fact of the matter about what the colony is doing independent of our description. I want the debrief to map each moment of the activity onto the philosophical joints — the difference between a system whose parts have their own aims and a system that has an aim, the difference between something we can predict and something that means or wants, the recurrence of the same question one level up when we ask whether a single human is more than her neurons — and to be honest about which feature of the idea the activity simply cannot reproduce, namely the question of whether there is anything it is like to be the colony, since every participant is a human with a mind already, so the appearance of a collective mentality may be borrowed from them and the activity cannot rule that out. Finally, tell me what will predictably go wrong the first time I run this — where the rules will break down, where a clever student will short-circuit the emergence by shouting the global pattern out loud, and how to keep the group from collapsing into the "just ants" verdict too early — and give me a contingency for a group that is too small or too uncoordinated to produce anything emergent at all. Assume I can supply index cards, a large floor space, and some tokens or sticky notes, but no technology and no budget.
reasoning: |-
  We are designing a 90-minute session for an upper-level philosophy of mind seminar. The goal is to have students experience the emergence of complex group behavior from simple individual rules and then confront the difficulty of attributing mental states (like beliefs, desires, intentions) to the collective. We want to avoid early dismissal ("it's just ants") and instead make them feel the pull of the intentional stance.

  The session has two main phases:
  1. The Ant Colony Simulation: Students act as ants, each following a simple local rule. They collectively produce a complex pattern (like sorting, bridging, foraging) without any individual knowing the global goal. Then we reveal the collective behavior and force them to describe it in intentional terms (e.g., "What was the colony trying to do?").
  2. Pressure Phase: We run variations to challenge the initial intuition:
     a. Same output produced by a script or a shill (to question whether the behavior alone is sufficient for mentality).
     b. Same behavior but with different underlying rules (to question if there is a fact of the matter about the colony's aims independent of our description).

  We must be cautious of:
  - The simulation breaking down (e.g., if rules are too complex, or if a student shouts the pattern).
  - The group being too small or uncoordinated to produce the emergent behavior.

  Materials: index cards, tokens (e.g., colored paper clips, buttons, or sticky notes), a large floor space.

  Structure:

  I. Introduction (5 minutes)
     - Set the stage: "Today we are going to simulate an ant colony. Each of you will be an ant. You will receive a card with a simple rule. Your job is to follow that rule exactly, without trying to figure out the big picture. We will run a few rounds, and then we will look at what the colony as a whole did."

  II. The Ant Simulation (30-35 minutes)
     - Setup: Choose a task that is emergent and visually clear. Sorting by color is a good candidate because it is simple to set up and the result is obvious. We can have two colors of tokens (say, red and blue) scattered randomly in a bounded area (the "nest" area and a "foraging" area). The goal (unknown to the ants) is to sort the tokens so that red tokens end up in one area and blue in another.

     - Rules for the ants: Each ant has one of two rules (or more if needed for complexity). We assign about half the students to each rule. The rules are:

          Rule 1 (Forager):
            - If you are carrying a token, move toward the nest area (a designated spot, e.g., a taped circle at one end of the room). When you reach the nest, drop the token and then move randomly until you find a token of the same color as the one you just dropped. Pick it up and then move toward the nest again.
            - If you are not carrying a token, move randomly until you find a token. When you find one, pick it up and then move toward the nest.

          Rule 2 (Sorter? Actually, we can adjust the rules so that the sorting emerges from the foragers and the nest layout. But note: we want the sorting to happen without any ant knowing the color distinction. Alternatively, we can use a rule that doesn't mention color but uses location.)

          However, we want to avoid having the rules directly reference color if the ants are to be truly "stupid". Instead, we can set up the nest area to have two zones (without telling the ants) and let the movement rules cause sorting. But if the ants don't have any rule that distinguishes color, how does sorting happen?

          Revised plan: Use a rule that causes clustering by color without the ant knowing about color. This is tricky. Alternatively, use a rule that is inspired by ant foraging for food sources of two types. We can have two nest zones, but the ants don't know that. Instead, we can have:

          Rule 1 (for red tokens):
            - If you are carrying a token and you are in the nest area, drop the token.
            - If you are not carrying a token, move randomly until you find a red token. If you find one, pick it up and then move toward the nest area. (But how do they know it's red? We can't rely on them knowing colors if we want to avoid intentionality at the individual level.)

          Alternative: We use a rule that is based on the presence of tokens of the same type in the nest. But that requires the ant to be able to sense the nest's state, which might be too complex.

          Simpler: Use a rule that does not require color perception at the ant level. Instead, we can have two types of tokens that are identical in every way except that they are in two different locations initially. But then we want to sort by type? That doesn't work.

          Another idea: Use the "Langton's ant" principle but in a collective. That might be too abstract.

          Let me propose a different emergent behavior: forming a bridge. This is classic in ant colonies. We can have:

          Scenario: There is a gap (e.g., two tables separated by a gap) that the ants must cross to get to a food source (tokens on the other side). The ants can form a living bridge.

          But that requires them to have a rule about when to stop and link, and it might be too complex to run in a classroom.

          Given the constraints, let's stick with token clustering. We can have:

          Rule (for all ants, same rule? But we want multiple rules to make it more complex. Or we can have one rule that leads to clustering without color sorting, and then we can add color as an extra layer?).

          Actually, let's do a simple clustering simulation. We don't need two colors. We can have one type of token and have the ants collect them into clusters. Then we can interpret the colony's behavior as "foraging" or "gathering food".

          Steps for a clustering simulation:

          - Each ant has the same rule? That might not be as interesting. We can have two roles: some are collectors, some are movers? But let's keep it simple.

          Rule (for every ant):
            - If you are not carrying a token, move randomly until you find a token. When you find one, pick it up and then move randomly until you find another token on the ground. When you find one, drop the token you are carrying and then pick up the new one? That doesn't lead to clustering.

          Instead, use the rule from the "Ants clustering" model:

            Rule 1:
              - If you are carrying a token and you find an empty space, move randomly.
              - If you are carrying a token and you encounter another token, drop your token with a certain probability? But we don't want randomness to dominate.

          Alternatively, use a rule inspired by the real ant behavior: ants drop pheromones and follow pheromone trails. But we don't have the means for pheromones.

          Given the constraints, I propose a simplified version of the "sorting" behavior without color. We'll have tokens of one type and the goal is to gather them in the nest. The rule:

          Rule (for all ants):
            - If you are not carrying a token, wander randomly. When you find a token, pick it up and then move toward the nest (a clearly marked area).
            - If you are carrying a token, move toward the nest. When you reach the nest, drop the token and then wander randomly.

          This will lead to tokens being collected in the nest. The emergent behavior is foraging.

          But we want the students to be surprised by the collective result. So we can have two nests? Or we can have tokens of two types and two nests? Then we need a rule that distinguishes the tokens without the ant knowing. How?

          We can assign each ant to one color. Without telling them why, we give half the ants a rule for red and half for blue. But then the rule would be:

          Rule for red ant:
            - Only pick up red tokens. When carrying, move to the red nest.

          Rule for blue ant:
            - Only pick up blue tokens. When carrying, move to the blue nest.

          But then the ant does know about color? We can tell them: "If you are a red ant, you are only interested in red tokens. If you see a red token, pick it up and take it to the red nest." But that is intentional language. We want to avoid that.

          We can avoid by having the rule be purely mechanical: the red nest is at location A, the blue at location B. And the red tokens are marked with a symbol (like a triangle) and blue with a circle. Then we tell the ant:

          Rule for ant with a triangle on their card (red ant):
            - When you see a token with a triangle, pick it up and move to the triangle nest (location A).

          Rule for ant with a circle (blue ant):
            - When you see a token with a circle, pick it up and move to the circle nest (location B).

          The ant doesn't have to know that triangle=red and circle=blue. They just match the symbol. So the rule is: "If you are not carrying a token, move randomly. When you see a token with the same symbol as on your card, pick it up and move directly to the area marked with that symbol. If you are carrying a token, move to the area marked with the symbol on your card."

          But note: this requires the ant to be able to see the symbol on the token and on the nest. We can put a large sign at the nest. And the tokens have the symbol drawn on them.

          However, the students will know that they are sorting by symbol. We want them to not know the collective goal. So we don't tell them that there are two types. We just give them the rule and let them do it.

          The problem: if we have two groups of ants and two types of tokens, the students might figure out that they are sorting. So to prevent that, we can:

          - Not reveal that there are two types of ants. We assign the rule cards randomly and don't tell them that there are two kinds. We just say: "Your card has a symbol. You are to pick up tokens that have the same symbol and take them to the area with that symbol."

          Then they will focus on their own symbol and not notice the collective pattern until we reveal it.

          Steps:

          a. Prepare two sets of tokens: e.g., 20 tokens with ▲ and 20 with ●. Scatter them randomly in a large area (the "field").
          b. Mark two nest areas: one with a large ▲ sign (red nest) and one with a large ● sign (blue nest). Place them at opposite ends of the field.
          c. Assign students: 8 get a card with ▲, 8 with ●. Tell them: "Your rule is:
              - If you are not carrying a token, move around randomly until you find a token that has the same symbol as the one on your card. When you find one, pick it up.
              - Once you are carrying a token, move directly to the area marked with that symbol (your nest) and drop the token there.
              - After dropping, go back to moving randomly to find another token of your symbol.
              - You are not allowed to pick up a token that doesn't have your symbol. If you see one, ignore it.
              - You must follow the rule exactly. Do not try to coordinate with others."

          d. Run the simulation for 5-10 minutes (until most tokens are sorted). You can have multiple rounds if needed, but one round might be enough.

          e. After the round, have the students step back and look at the result: two piles, one of ▲ tokens in the ▲ nest and one of ● tokens in the ● nest.

          Then, the key moment: ask the students what the colony was doing. They will say "sorting the tokens". Then ask:

            - "What was the colony trying to do?"
            - "Did the colony make any mistakes? (e.g., were there tokens in the wrong pile?)"
            - "What did the colony want?"

          Force them to use intentional language. The point is that it's natural to say "the colony sorted the tokens" and "it wanted to get all the ▲ tokens to the ▲ nest", but no individual ant had that goal.

  III. Pressure Phase (25-30 minutes)

     a. Variation 1: Same output by a script or shill.
          - Tell the students: "Now, imagine that instead of you following these rules, I (the instructor) had just placed the tokens in the two nests myself. The end result is the same. Would you say the colony (in this case, me) had the same intention? Or is there a difference between the two cases?"

          - Alternatively, we can run a round where one student is told the entire plan and they direct the others (but that might be too obvious). Instead, we can say: "Suppose I had a lookup table that told me exactly where to put each token. I just did it. The behavior is the same. Is there a difference?"

          - Goal: to highlight that the intentional stance might be applied to the behavior regardless of how it was produced, but we have the intuition that the scripted version lacks the emergent, decentralized quality.

     b. Variation 2: Same behavior, different rules.
          - Without changing the setup, assign new rules to the ants. But this time, secretly give half of the ▲-ants a rule that is actually for ● and vice versa? That might cause chaos.

          Instead, we can change the rule without changing the outcome. For example, we can have a round where we swap the symbols. Tell the ▲-ants: "Now, your rule is: pick up ● tokens and take them to the ● nest." And tell the ●-ants: "Pick up ▲ tokens and take them to the ▲ nest." Then run the simulation. The result will be the same: tokens sorted by type. But now the ants are following a different rule.

          After the round, ask: "What was the colony trying to do? Was it the same as before? How do you know? What if I told you that in the first round, the ▲-ants were taking ▲ tokens to the ▲ nest, but in the second round, the same ants were taking ● tokens to the ● nest? Does that change the colony's intention?"

          This variation challenges the idea that the colony's intention is fixed by the behavior. The behavior is the same, but the underlying rules are inverted.

          Alternatively, we can have a round where the tokens are already sorted and the ants are given a rule that does nothing (e.g., "wander randomly and don't pick up tokens"). Then we get the same sorted result without any ant doing anything. This might be too extreme.

          We can do:

            Variation 2a: Invert the rules without telling the students. Secretly swap the rule cards for half of the students? But that might be hard to manage.

          Instead, we can run a round where the rules are changed but the outcome is the same. The above swapping of rules for the two groups will work. We tell the ▲-ants to now do what the ●-ants did and vice versa. Then the colony sorts the tokens just as before.

          Then we ask: "In the first round, the colony sorted tokens by type. In the second round, it did the same. But the individual rules were different. So what is the colony's rule? Does it have one? Or is the rule just in our description?"

     c. Variation 3: The colony behaves identically but each ant is secretly following a different rule.

          This is tricky because if each ant has a different rule, we might not get the same behavior. So we need to design rules that are different but lead to the same collective outcome.

          Alternatively, we can have one round where we assign the rules as in the first round, and then we tell the students: "Actually, some of you were not following the rule I gave you. Some of the ▲-ants were actually following a rule that said: 'Pick up whatever token you see first and take it to the nearest nest'. But by chance, they only encountered ▲ tokens and the ▲ nest was the nearest." But that might not be reproducible.

          Given time constraints, we might skip this variation and focus on the first two.

  IV. Debrief (20-25 minutes)

     - Map the activity to the philosophical issues:
          - The colony's behavior was produced by individuals following simple, local rules. Yet the colony as a whole seems to have a goal (sorting tokens). This parallels functionalism: mental states are about the functional organization, not the substrate.
          - The intentional stance: it was natural and useful to describe the colony as having intentions. But when the same behavior was produced by a script, we felt that the intentional stance might not apply. And when the rules changed but the behavior remained, we saw that the intentional description might be independent of the underlying mechanism.
          - The question of whether the colony is a genuine subject of experience (the hard problem) cannot be addressed by the activity because each ant is a conscious human. We only simulated the functional aspects.

     - Highlight the key distinctions:
          - Difference between a system whose parts have aims (each ant had the aim of following its rule) and the system having an aim (the colony sorting tokens).
          - Difference between predictability (we can predict the colony will sort) and intentionality (does the colony mean to sort?).
          - The same question arises for humans: are we more than our neurons? (The neurons might be like the ants.)

     - Acknowledge limitations: The activity does not address phenomenology (what it's like to be the colony) because the participants are conscious. We only simulated the functional behavior.

  Contingencies:

     - If the group is too small: We can have the students act as multiple ants each? Or we can use a smaller task. Alternatively, we can run the simulation with fewer tokens and fewer nests? But 16 students is enough for two groups of 8.

     - If the group is uncoordinated: The rules might break down if the field is too big or if students don't follow the rule. We can:
          - Have a practice round with a few tokens.
          - Use a smaller space.
          - Have a time limit per move? But that might be too rigid.

     - If a student shouts the pattern: Before starting, emphasize: "Do not communicate with each other about what you are doing. Focus on your own rule. The simulation only works if you act independently." If someone does, pause and remind them.

     - If they collapse into "just ants" too early: In the reveal phase, push the intentional language: "But look at what the colony did. It sorted the tokens. How would you explain that without saying the colony intended to sort? Why is it so natural to say the colony wanted to do this?"

     - If the simulation doesn't produce the result (e.g., tokens not sorted): Use it as a teaching moment: "Sometimes emergence doesn't happen because of the conditions. But note that in nature, ants do sort. The failure here might be due to our simplified rules or the setup. But the point stands: if it had worked, we would be having the same discussion."

  Timing breakdown:

     - 0-5 min: Introduction
     - 5-40 min: Simulation (including setup, running, and reveal) [35 min]
          - Setup: 5 min (assign rules, explain, scatter tokens)
          - Run: 10 min
          - Reveal and intentional attribution: 10 min
          - Then run Variation 1 and 2: 10 min? (We might do only one of the variations if time is short, or do them quickly as thought experiments without re-running the simulation, just by describing.)
     - 40-70 min: Pressure Phase and discussion of variations [30 min]
          - We might not have time to re-run the simulation for the variations. Instead, we can describe the scenarios and have a discussion.

          Revised: For Variation 1, we don't need to run it. We can just describe: "Imagine that instead of you doing this, I had a script and I put the tokens in the nests. The result is the same. Is the colony (in that case) still an agent with intentions?" 

          For Variation 2, we can run a quick round with the rules swapped. But it might take 5 minutes. We can do:

            - Variation 2: Swap the rules and run for 5 minutes. Then discuss for 5 minutes.

          Then we have:

            - Simulation and reveal: 25 min (5 setup, 10 run, 10 discussion)
            - Variation 2: 10 min (5 run, 5 discussion)
            - Variation 1: 5 min (discussion only)

     - 70-90 min: Debrief [20 min]

  Given the time, we might skip re-running the simulation for Variation 2 and just describe it. Or we can run a shorter second round.

  Final Design:

  I. Introduction (5 minutes)

  II. First Simulation Round (25 minutes total)
     - Setup (5 min): Assign rules (8 students get ▲, 8 get ●). Show the two nest areas. Scatter tokens (mix of ▲ and ●) in the field.
     - Run (10 min): Students follow their rules. Instructor may need to clarify rules during the run. Encourage them to move at a walking pace and not to communicate.
     - Reveal (10 min): Have students step back and look. Ask: "What did the colony do?" Then push for intentional language: "What was the colony trying to do? Did it succeed? Did it make any mistakes? What did it want?"

  III. Pressure Phase (30 minutes)
     a. Variation 1: Scripted version (thought experiment) (10 min)
          - Describe: "Suppose I had a lookup table and I placed each token in the correct nest. The result is the same. Is there a difference in terms of the colony's mentality? Does the colony (in that case) have the same intention? Why or why not?"
          - Discuss.

     b. Variation 2: Same behavior, different rules (20 min)
          - Without revealing the swap, tell the students: "Now we will run a second round. I have new rule cards for you." Give the ▲-ants the rule for ● and vice versa. (So the former ▲-ants now are told to pick up ● tokens and take them to the ● nest, and vice versa.)
          - Run the simulation again (5 min setup and run? We can do a shorter run because many tokens are already sorted. We might need to re-scatter the tokens. So: re-scatter tokens quickly and run for 5-7 minutes.
          - After the run, reveal: "Notice that the colony did the same thing: sorted the tokens. But in this round, the rules for the individual ants were different. In fact, they were swapped. So what was the colony trying to do? Is there a fact of the matter about what the colony's rule is? Or is the rule just in our description?"

  IV. Debrief (20 minutes)
     - Connect to philosophy of mind: functionalism, intentional stance, emergence, and the hard problem.
     - Acknowledge the simulation's limitations (especially regarding consciousness).

  Contingency for small group or failure: If the group is too small, assign each student two rules? But that might be confusing. If the simulation fails to sort, use the partial result and ask: "What would the colony have done if we had more time? What if we had more ants?" and still push the intentional attribution.

  This design should meet the goals: making them feel the pull of the intentional stance and then the difficulty in settling what grounds it.
answer: |-
  ### Designed Session: Emergent Intentionality in an Ant Colony Simulation  
  **Total Time:** 90 minutes  
  **Students:** 16  
  **Materials:**  
  - Index cards (for rules)  
  - Two colors of tokens (e.g., red and blue buttons/papers; ~40 total, 20 per color)  
  - Tape to mark "nests" on the floor  
  - Signs labeled "A" and "B" for nests  
  - Timer  

  **Philosophical Goals:**  
  1. **Phase 1:** Simulate emergence to make the "colony as agent" intuitive.  
  2. **Phase 2:** Challenge this intuition by varying the mechanism behind identical behavior.  
  3. **Debrief:** Map to functionalism, intentional stance, and hard problem of consciousness.  

  ---

  ### **Phase 1: Emergence Simulation (35 min)**  
  *Goal: Students experience emergence, then feel "pull" of attributing goals to the colony.*  

  #### **Setup (5 min)**  
  - **Prepare Space:** Designate a 10x10 ft area. Place two "nests" (tape circles) at opposite ends, labeled "A" and "B". Scatter tokens randomly (50% red, 50% blue).  
  - **Assign Rules:**  
    - **Rule 1 (Blue Ants - 8 students):**  
      *"If you see a blue token, pick it up and walk toward Nest A. If you reach Nest A, drop it. If you see a red token, ignore it. Never communicate."*  
    - **Rule 2 (Red Ants - 8 students):**  
      *"If you see a red token, pick it up and walk toward Nest B. If you reach Nest B, drop it. If you see a blue token, ignore it. Never communicate."*  
    > *Rules are "stupid": No ant knows sorting is happening. Use symbols (△ for blue, ○ for red) if color is ambiguous.*  

  #### **Activity (15 min)**  
  - Students act as ants: Move at walking pace, follow only their card. **Enforce silence/no collaboration.**  
  - Run for 10 min. **Instructor:** Observe, redirect rule-breakers, ensure tokens move.  
  - **Expected Emergence:** Blue tokens cluster at Nest A; red at Nest B.  

  #### **Reveal & Attribution (15 min)**  
  - **Freeze the colony.** Ask:  
    - *"What did the* colony *just accomplish? Describe its* goal *in one sentence."*  
    - *"Did the colony make mistakes? (e.g., tokens in wrong nest)"*  
    - *"What did the colony* want *or* intend *to do?"*  
  > **Force Intentional Language:** If students resist ("But we just followed rules!"), insist: *"Pretend you’re an outsider observing this colony—how would you explain this behavior?"*  

  ---

  ### **Phase 2: Pressure Variations (40 min)**  
  *Goal: Challenge whether intentionality depends on behavior or underlying mechanism.*  

  #### **Variation 1: Scripted Outcome (15 min)**  
  - **Setup:** Reset tokens to original chaos. Assign **one student** as "Shill." Secretly tell them: *"Direct others to sort tokens correctly. Say you ‘intuited’ the goal.’"*  
  - **Activity:** Run 5 min. Shill orchestrates sorting (e.g., "You! Take that red token to Nest B!").  
  - **Reveal & Contrast:**  
    - *"Same outcome as Phase 1. Did the colony ‘want’ to sort? Why/why not?"*  
    - *"Does it matter that a ‘mind’ controlled the outcome?"*  

  #### **Variation 2: New Rules, Same Behavior (15 min)**  
  - **Setup:** Assign **new rules** (keep nests/tokens identical):  
    - **Rule 3 (All students):**  
      *"If you see a token, pick it up. Walk to the nest whose label matches the token’s color. Drop it."*  
  - **Activity:** Run 5 min. **Same sorting result emerges.**  
  - **Reveal & Contrast:**  
    - *"Same outcome, but rules changed. Is the colony still ‘sorting’? Is there a fact about its ‘goal’ beyond our description?"*  

  #### **Variation 3: Hidden Rules, Identical Behavior (10 min)**  
  - **Setup:** Secretly assign **mixed rules** (half follow Rule 1; half follow Rule 3).  
  - **Activity:** Run 5 min. Tokens sort identically.  
  - **Reveal:**  
    - *"You all produced identical sorting, but followed different rules. What *actually* determined the colony’s goal? The behavior? The rules? Our interpretation?"*  

  ---

  ### **Debrief (15 min)**  
  *Map to Philosophy & Acknowledge Limits:*  

  1. **Functionalism & Emergence:**  
     - *"Each ant followed a ‘stupid’ rule, yet the colony ‘sorted.’ How is this like a mind arising from neurons?"*  
     - **Key Point:** Functional organization (rules → outcome) vs. substrate (ants/neurons).  

  2. **Intentional Stance (Dennett):**  
     - *"Why was it easier to say ‘the colony wanted to sort’ than list every ant’s movement?"*  
     - **Key Point:** Mental terms are pragmatic tools for prediction, even without "real" intentionality.  

  3. **The Hard Problem:**  
     - *"But is there ‘something it’s like’ to be the colony? Our simulation can’t answer this—each ‘ant’ is already conscious! We only modeled behavior, not experience."*  

  4. **Human Implications:**  
     - *"If we’re just neurons following rules, are *we* more than our parts? Or are we ‘convenient fictions’ like the colony?"*  

  ---

  ### **Predictable Problems & Contingencies**  
  1. **Breakdowns:**  
     - **Rules ignored?** Assign a "rule enforcer" (quiet observer).  
     - **No emergence?** Shorten rules or pre-place tokens near nests to "jumpstart" sorting.  
     - **Clever student spoils it:** If someone yells "We’re sorting!", pause: *"Freeze! Would an ant know this? Your job is to follow your card, not the big picture."* Restart with new tokens.  

  2. **Small/Uncoordinated Group:**  
     - **8–10 students:** Reduce tokens (10 per color) and nests to 5x5 ft.  
     - **Chaos?** Run a "practice round" with 1 token type (all ants forage to one nest). Then add complexity.  
     - **No progress?** Use "guided emergence": Add a rule like *"If nest has >5 tokens, walk slower"* to simulate pheromones.  

  3. **Early "Just Ants" Verdict:**  
     - **Response:** *"Sure, it’s ‘just ants.’ But why do we instinctively say the colony ‘wanted’ to sort? Let’s see if that intuition survives Phase 2."*  

  ---

  **Why This Works:**  
  - **Phase 1** makes emergence visceral: Students *feel* the colony’s "goal" as they struggle to describe it without mental terms.  
  - **Phase 2** forces ambiguity: Identical outcomes from scripts/different rules destabilize intuitive attributions.  
  - **Debrief** ties to philosophy explicitly but *after* the experience, grounding abstraction in lived confusion.  

  **Final Tip:** Start with a provocative hook: *"Today, you’ll become an ant—and together, you’ll *be* a mind. Let’s see if that sentence makes sense by the end."*
