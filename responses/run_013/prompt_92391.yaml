  ## Step 4: Real-world application and recommendation

  Real-world pattern: Two rival companies engaged in a price war or a bidding war over a contract. Each has already invested heavily and cannot recover those costs. The contract is worth a fixed amount, but the competition drives them to spend more than the contract is worth, and the loser also loses their investment.

  Diagnosis: The escalation is structural, not psychological. The rule of the contest (like the dollar auction) is that the loser also loses their entire investment (which in this case is the amount they spent in the competition). This creates an incentive to keep bidding to avoid being the loser and losing the investment.

  Practical recommendation: If a party is already caught in such a contest, the structural analysis suggests that the escalation will continue until one party is willing to accept a loss equal to the entire investment they have at stake. Therefore, the party should consider the following:

    - If possible, negotiate a settlement with the rival to split the prize and stop the escalation. This might involve one party paying the other to drop out, or both sharing the prize.

    - If negotiation is not possible, the party should recognize that the contest is a dollar auction and drop out as soon as possible to minimize the loss. The money already spent is sunk and should not influence the decision; only the future costs and the probability of winning matter. But in the dollar auction structure, the future costs include the risk of becoming the loser and losing even more. Therefore, it is better to drop out early rather than late.

  However, the decision to drop out must be based on a rational assessment of the rival's willingness to continue. If the rival is also rational, then they will drop out at a point that can be predicted. But in practice, this might be difficult. The best practical recommendation is to avoid entering such contests in the first place, but if already in, to cut losses early.

  ## Conclusion

  The dollar auction's escalation is a result of the rule that penalizes the second highest bidder by making them pay their bid. This creates a rational incentive to continue bidding even when the bid exceeds the prize value, to avoid the increasing loss from dropping out. It is not primarily due to psychological biases, although they might exacerbate the situation. The variant with a fixed penalty shows that without the increasing penalty, escalation is contained. In real-world situations, parties caught in such contests should negotiate or drop out early to minimize losses.
