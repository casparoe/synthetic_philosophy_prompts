  Biggest risk is accidentally implying death is "just" a social construct. Must balance honesty about standards with respect for the finality these graduates must project. The ventilator/heart example is useful - shows how the body can simultaneously show life signs while being legally dead. 

  For structure: opening should ground them in the physicality of their work (sticky floors, monitor sounds). Then introduce the two questions as professional tools rather than philosophical traps. Neurological criteria section must emphasize that brain death = biological death despite appearances, while acknowledging the strangeness. Circulatory protocols need framing as respecting natural processes rather than giving up. 

