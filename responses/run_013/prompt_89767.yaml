  ### **The Column**

  **Dear Nudge Nest**,  
  My partner is wonderful, really—except for the wet towels. Every shower ends with a damp, cold towel abandoned on our bed. I’ve asked nicely, I’ve “joked” about it, I’ve even threatened to start drying the cat with them. Nothing sticks. He agrees it’s gross, then does it again. How do I get him to hang it up *without* turning into a nag? Help me, Nudge Nest. I’m drowning in mildew.  

  —Soggy in Seattle  

  ---  

  **Dear Soggy**,  
  What a delightful challenge! First, let me commend your restraint. Too many resort to friction (nagging, ultimatums) when frictionless solutions abound. Your partner isn’t *choosing* inconvenience; he’s falling victim to “present bias”—prioritizing immediate comfort (flopping on the bed) over future costs (your dismay, damp sheets). Our task: redesign his environment so the *right* choice becomes the default.  

  **Step 1: Eliminate Friction for the Target Behavior**  
  Move the towel hook. If it’s behind the door or down the hall, relocating it is critical. Install a hook *directly* beside the bed—within arm’s reach of his post-shower collapse. Better yet, install two: one labeled “BED” (with a crossed-out towel icon) and another labeled “HERE” (with a cheerful ✔️). This leverages “salience architecture”: making the desired action visually obvious and spatially effortless. The default shifts from “towel on bed” to “towel within 12 inches.”  

  **Step 2: Frame the Error as a Cost to Him**  
  Humans respond to perceived loss. Place a moisture sensor (a simple hygrometer tile) under his pillow. When a wet towel lands on it, a gentle alarm—say, a soft *bloop*—pings his phone: “Mattress health at risk! 57% humidity detected.” This isn’t *your* annoyance; it’s *his* property decaying. He’ll self-nudge.  

  **Step 3: Pre-Commitment with Social Proof**  
  Casually mention you’re reading about “microbial hotspots in bedrooms” (cite a fictional Johns Hopkins study). Then propose a “no-judgment pact”: you’ll track towel placement for a week purely “for data.” Hang a whiteboard in the hall tallying “Towels Hung ✅” vs. “Towels Banished 🚫.” Humans instinctively optimize for positive metrics—especially when observed. The tally makes progress visible, leveraging his intrinsic drive for consistency.  

  **But What If It Fails?**  
  Ah, the beauty of iterative nudging! If hooks and hygrometers falter, escalate gently. Swap his towel for one half the size—too small to cozy the bed but ample for drying. Or apply “peer defaulting”: invite friends over, and ensure they loudly praise *your* towel-hanging rigor (“Wow, your hooks are so *accessible*!”). We’re social creatures; subtle approval reshapes norms.  

  **A Note on Sustainability**  
  Here’s where many falter: maintaining the nudge. Every intervention creates what I call **nudge debt**—the ongoing duty to ensure your architecture aligns with your partner’s *evolving* preferences. Check in monthly: “Does the hook still feel intuitive?” This isn’t surveillance; it’s auditing *choice infrastructure* for mutual benefit. Nudge debt is the kindest obligation: it honors his autonomy (“as judged by himself”) while protecting your sheets.  

  You’re not manipulating; you’re *curating*. He retains freedom to reject the hook—but why would he, when it’s easier than defiance? And should he opt out? Simply note the *bloop* intensifies after 7 PM. Gentle escalation preserves harmony.  

  Stay empathetic, stay structural,  
  —**Nudge Nest**  

  ---

  ### **Where This Leans On Contested Ground**  
  This column exaggerates three legitimate criticisms of nudge theory:  
  1. **"As judged by themselves" doing heavy lifting**: The columnist assumes the partner *truly* wants to hang towels (despite evidence). Nudge theory claims to help people achieve *their own* goals—but here, the “goal” is inferred, not stated. Critics argue this allows nudgers to impose external values under the guise of self-help.  

  2. **Nudge-to-shove escalation**: Moving hooks is benign; alarms and towel swaps add friction disguised as ease. The columnist frames this as “iterative,” but it mirrors real critiques: when nudges fail, practitioners often subtly coerce (e.g., changing defaults in pension plans from opt-*in* to opt-*out*).  

  3. **"Nudge debt" as unaccountable labor**: The term satirizes a real oversight. Maintaining nudges requires invisible work (tracking, adjusting)—which typically falls on the “nudger.” In theory, consent matters; in practice, renegotiation rarely happens. The column weaponizes this as virtue, underscoring paternalism’s slippery slope.  

  The piece also omits reciprocity: the partner gets no nudge “voting rights.” Real nudges (e.g., organ donation defaults) undergo ethical review; here, the columnist unilaterally defines the “error,” a common critique of libertarian paternalism in private spaces.
