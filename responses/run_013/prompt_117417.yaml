prompt: |-
  You are advising a foundation that will fund two researchers for three years to work on the theory of futarchy — the proposal that a polity fixes a welfare metric and lets prediction markets, rather than a legislature, choose policy. Treat the metric as given and measurable and the polity as a mid-sized city, so that the live questions concern the market mechanism, the incentives of participants, and the legitimacy of binding the city to market outcomes. Which questions most deserve the researchers' three years, and in what order? Rank them by how many other questions depend on them, how tractable they are without new data, and how much a clear answer would change a real attempt at implementation; flag the widely discussed worries you think are overrated, and say what argument or development over the next few years would reorder your list. I am especially unsure whether the deepest problem is the one I keep returning to — that a market-approved policy can itself change how the metric is defined or measured — or whether that is a distraction from more basic difficulties, so address it directly. End with a final line of the form \answer{...} naming only the question you would put first.
