answer: |-
  ### Memorandum  
  **To:** State Law-Reform Commission  
  **From:** Research Counsel  
  **Re:** Recommendation on Public Decency (Prohibited Amusements) Bill  
  **Date:** October 26, 2023  

  #### I. Recommended Outcome  
  **Reject the bill without amendment.** The commission should decline to recommend criminalizing the attraction. While the sponsors’ social-cohesion argument warrants serious consideration, it fails to meet the threshold of justification required for state intervention in consensual, non-deceptive conduct.  

  #### II. Summary of Positions  
  - **Sponsors’ Case:** The practice erodes shared morality ("society’s cement") by normalizing degradation, even absent direct harm. The state may ban it under a "public-decency test" (whether an ordinary community member would find it degrading).  
  - **Opponents’ Case:** This mirrors Lord Devlin’s position in the Hart-Devlin debate—rejected by modern liberal jurisprudence—where morality alone justifies coercion. Banning consensual acts violates autonomy and targets marginalized workers.  
  - **Performers’ Interest:** Consent is explicit; livelihoods and dignity through self-chosen work are at stake.  

  #### III. Defense of Recommendation  
  **A. The Sponsors’ Social-Cohesion Argument at Its Strongest**  
  The state has a legitimate interest in preserving the moral fabric that enables collective flourishing. If society tolerates spectacles that dehumanize individuals—treating them as objects for ridicule—it risks normalizing callousness, eroding mutual respect, and fragmenting communal bonds. As Devlin argued, a society’s survival depends on shared values; the state may act as "guardian of morality" to prevent incremental corrosion. Here, the spectacle’s reduction of a person to a projectile could be seen as inherently debasing, irrespective of consent. If such acts proliferate, they might desensitize citizens to cruelty, weakening social cohesion over time.  

  **B. Evidence Required to Sustain This Claim**  
  For the sponsors’ argument to justify criminalization, empirical evidence must demonstrate:  
  1. **Causal Link:** Proof that tolerating *this specific practice* materially coarsens public morality (e.g., increased dehumanizing behavior in communities where it occurs).  
  2. **Social Fragmentation:** Data showing such spectacles correlate with eroded trust, communal discord, or civic disengagement.  
  3. **Moral Consensus:** Evidence that the practice is universally condemned by ordinary citizens (not just a majority), aligning with the bill’s "ordinary member" test. Absent this, the test risks enshrining majoritarian prejudice.  
  *Current Deficiencies:* No such evidence was provided. The "degradation" claim relies on subjective assertion, not social science. Historical parallels (e.g., prohibitions on interracial marriage or homosexuality based on "morality") caution against state enforcement of amorphous moral standards.  

  **C. Autonomy and Proportionality Concerns**  
  - **Consent and Livelihood:** The state’s power to override consent requires compelling harm-based justification. Here, performers—a vulnerable group facing limited employment options—lose agency and income. Criminalization compounds their marginalization.  
  - **Slippery Slope:** A public-decency test invites arbitrary enforcement. Would it extend to BDSM, burlesque, or provocative art? Without a harm anchor, it becomes a tool for policing "taste."  

  #### IV. Proposed Decision Rule for Future Bills  
  To balance social cohesion with individual rights, the commission should apply a **modified harm principle**:  
  > *"The state may restrict consensual conduct only upon demonstrating: (1) tangible harm (physical, psychological, or socioeconomic) to participants or third parties, or (2) concrete evidence that the conduct directly undermines foundational social institutions (e.g., judiciary, elections). Subjective ‘degradation’ without proven harm is insufficient."*  

  This rule respects autonomy while allowing intervention where social cohesion is *provably* threatened (e.g., voter suppression). It rejects Devlin’s overbroad morality standard but accommodates extreme cases (e.g., public executions normalizing violence).  

  #### V. Conclusion  
  The bill’s well-intentioned goal cannot override the absence of harm and the dignity of consenting adults. Recommend rejection. Adopt the decision rule above to evaluate future public-decency legislation rigorously.  

  **Vote:** Reject the bill.  

  ---  
  *Approx. 500 words. Tailored for brevity, legal precision, and neutral framing to respect commissioners’ diverse views.*
