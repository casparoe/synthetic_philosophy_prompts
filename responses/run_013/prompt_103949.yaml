prompt: |-
  I'm a philosophy grad student and I've somehow been roped into running a 90-minute session for our university art museum's docent-training cohort — mostly retired volunteers, sharp as anything, no philosophy background at all, but they spend their weekends walking visitors past objects and getting asked "is this real?" about twenty times a day. The one idea I have to land is the thing about why a forgery can be visually indistinguishable from an original and still be worth less, and more generally why the causal history of an object seems to matter to its value as art at all. Don't explain it to me — plan how I should explain it. These people will arrive with very strong intuitions (they love originals, obviously) and almost no vocabulary, and I'm worried the whole session collapses either into "well, it's just what the market decides" or the opposite, into hand-wavy mysticism about the artist's touch. The room has a whiteboard and no projector, and I've got maybe three objects I can pass around from the study collection if that helps, though none of them are interesting fakes.

  What I want is the order the pieces have to come in and why each one depends on the one before it — specifically, what has to be in place before "but the forgery is just as beautiful" stops sounding like an objection and starts sounding like the puzzle; at what point I have to state the perceptualist view ("if you can't see the difference it can't matter") in its strongest, most sympathetic form before I complicate it; and where in the sequence I can finally let the idea in that some of an artwork's merits might be merits of achievement or of the history of making rather than of the surface you look at. I've half-decided the carrying example should be a restrike — a later impression pulled from the original woodblock, same block, same paper, same press, just decades later — because it isolates the history from everything visible, but I can't tell if it actually carries the whole session or if it just smuggles in a second confusion (is the later impression a forgery? a copy? an original?) before the first one has landed, so tell me what the carrying example needs to have and needs to not have, and give me the one you'd actually build on, and if it's not the restrike say why not. My first instinct was the Dutch forger whose Vermeers fooled the experts, but that story's famous enough that they'll coast on the narrative instead of doing the argument. I've also heard the words "autographic" and "allographic" and the Danto indiscernibles thing thrown around and genuinely don't know whether either belongs in the sequence or is just showing off at this level.

  Then the misconceptions, in the order they'll actually surface, and exactly where in the sequence I should head each one off: I'm guessing the "if you can't see it, it can't matter" one, then "the original's value is just scarcity and status", then "forgery = counterfeit = lying about what you can see", and then maybe the reverse error, that once you admit history matters a restoration or a replica is just as good as the thing it's made from — plus the inevitable one where they conclude the original must have some invisible aura. I also want a check at the end that shows whether they've actually got the distinction or have just learned to say the word "provenance" — something that makes them apply it rather than recite it, and that a docent could plausibly be asked by a visitor. And tell me what I should openly refuse to settle in 90 minutes and say so out loud, because I'd rather leave the hard cases (restoration, an artist's own later copy, translations of a novel) visibly hanging than pretend they're easy. Definately tell me if any of the misconceptions I listed is actually a reasonable position I'd be steamrolling.

  Format it as: "The sequence" (the order of ideas with a line on why each depends on the last, around 400 words), "The example" (what it needs, what it must not have, and your pick, a paragraph or so), "Misconceptions and where they get headed off" (bulleted, ordered by when they'll show up, each with the move that defuses it), "The check for understanding" (one exercise or question plus what a good answer sounds like), and "What to leave out and say so" (a few lines). Under 1400 words total.
