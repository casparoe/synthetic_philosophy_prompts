answer: |-
  Here’s a targeted Q&A prep sheet prioritizing high-damage objections from your specific audience, with strategic replies and vulnerability notes. Focus on **defusing conceptual collapse** (into causal role) and **defending normativity without selection**.

  ---

  ### **Q&A Prep Sheet: Maintenance Profile Account of Function**
  **Core Concessions to Make Upfront:**  
  1. Selection *is* a major (but not sole) source of maintenance.  
  2. "Maintenance profile" requires clearer operationalization (ongoing work).  
  **Hold Firm On:** Normativity emerging from system-relative contributions, not history.  
  **Retreat Position:** "For *most* biological functions, maintenance profiles explain stability; some edge cases (e.g., vestiges) may require etiological supplements."

  ---

  ### **Prioritized Objections & Replies**  
  *(Ordered by damage potential)*  

  1. **From Selected-Effects Traditionalist:**  
     *"If ‘maintenance’ includes present stabilizing processes, how is this not just causal-role functionalism with extra steps? You’ve smuggled in history vaguely to appease us, but your account can’t distinguish a *function* from any *useful effect*."*  
     **Reply:** "Unlike causal-role accounts, maintenance profiles require *actual stabilization* of the trait in the system. A heart’s noise isn’t functional because it doesn’t contribute to its own retention; blood circulation does via organismal survival. Stabilization provides the constraint causal role lacks."  
     **Weakness:** Needs clearer criteria for "stabilization" beyond circularity.  

  2. **From Evo-Devo/Niche Construction Scholar:**  
     *"Developmental constraints aren’t *maintaining* a function—they’re limiting form. If a trait persists because it’s developmentally entrenched but actively harmful (e.g., human pelvic narrowing), how can its ‘function’ be normative? You’ve decoupled normativity from adaptation."*  
     **Reply:** "Normativity is system-relative: the trait’s *expected* contribution given its maintenance context. A narrowed pelvis isn’t ‘functional’ for childbirth; its maintenance is due to constraints conflicting with other functions. Malfunction occurs when it fails its biologically *expected* role (e.g., bipedal locomotion)."  
     **Weakness:** "Biologically expected" risks becoming teleological sans selector.  

  3. **From Selected-Effects Traditionalist:**  
     *"Without selection history, how do you ground *proper* function? A trait’s maintenance via developmental constraint doesn’t tell us what it’s *supposed* to do—only what it *does* do. Normativity evaporates."*  
     **Reply:** "The ‘proper’ function is the contribution that *features in* the maintenance profile. A polar bear’s fur density is maintained by insulation-mediated survival; its function is insulation even if no selection *for* insulation occurred (e.g., via pleiotropy). Failure to insulate is malfunction."  
     **Weakness:** Hard to exclude cases where a trait is maintained for reason X but used for Y.  

  4. **From Comparative Physiologist:**  
     *"Why drag history into this? I identify functions in synthetic organoids with no evolutionary history. If causal role suffices there, why complicate biology with ‘maintenance profiles’?"*  
     **Reply:** "In organoids, functions are stabilized *by the experimenter’s design*—an artificial maintenance profile. In natural systems, profiles explain why traits *persist*. History isn’t necessary, but in biology, persistence often involves historical processes (e.g., selection, niche construction)."  
     **Weakness:** Risks making maintenance profile a "catch-all" for artificial/natural systems.  

  5. **From Philosopher of Neuroscience:**  
     *"How does this help for neural functions? If a neural circuit stabilizes via synaptic pruning (not selection), is its function just its current contribution? That seems too flexible to explain misrepresentation."*  
     **Reply:** "Exactly. A synapse’s function is its contribution to circuit stability via learning rules. Misrepresentation occurs when it fails to carry the signal that maintains it (e.g., dopamine prediction errors). No selection history needed—only real-time maintenance."  
     **Weakness:** May struggle with content indeterminacy (e.g., *which* signal?).  

  6. **From Niche Construction Proponent:**  
     *"If niche construction maintains a trait (e.g., beaver dams maintaining tooth sharpening), is the function dam-building or tooth-wearing? Your account blurs organism/environment boundaries."*  
     **Reply:** "The function is tooth-sharpening *because* that enables dam-building, which sustains the niche maintaining the trait. Maintenance profiles can be multi-level but are anchored to the trait’s role in organismal persistence."  
     **Weakness:** Needs rigorous hierarchy to avoid "function inflation."  

  7. **From Selected-Effects Advocate:**  
     *"Doesn’t this make functions ephemeral? If maintenance processes change (e.g., new constraints), does a trait’s function change? That violates the intuition that functions are stable."*  
     **Reply:** "Functions *can* shift if maintenance dynamics shift (e.g., bird feathers: insulation → flight). But profiles are typically stable over relevant timescales. Stability is empirical, not metaphysical."  
     **Weakness:** Undermines function’s role as a fixed explanatory anchor.  

  8. **From Evo-Devo Critic:**  
     *"Calling constraints ‘maintenance’ is verbal sleight-of-hand. Constraints explain why a trait *exists*, not what it’s *for*. You’ve conflated enabling conditions with function-bestowing processes."*  
     **Reply:** "When constraints *actively retain* a trait because of its effects (e.g., developmental pathways preserving an adaptive form), they’re not passive enablers—they’re part of the maintenance matrix. The ‘for’ is implicit in the persistence mechanism."  
     **Weakness:** May overextend "function" to unavoidably constrained traits.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Isn’t your ‘maintenance profile’ just a disjunctive list of every existing function theory’s criteria? If it includes selection when present, causal roles when history is irrelevant, and constraints as a fallback, is it doing any *explanatory work* itself—or is it just pluralism with a fancy label?"*  

  **Why it’s dangerous:** Challenges the account’s coherence and originality. A reply must argue that **maintenance is a unified explanatory framework** (e.g., "Stabilization via contribution is the single invariant; mechanisms like selection are context-specific instances"). But the disjunction charge is hard to shake.  

  ---

  ### **Strategic Summary**  
  - **Concede Early:** Selection is a key maintenance mechanism; operationalization needs work.  
  - **Hold Firm:** Normativity requires no selection history; malfunction is failure in maintenance context.  
  - **Retreat If Pressed:** "Maintenance explains *most* functions; etiological criteria may cover vestigial traits."  
  - **Prioritize:** 1, 2, 3, 5 (they attack core innovations). Let 4/6/7/8 take less time if needed.  
  - **Bridge-Building:** For physiologist: "Your organoid functions *are* maintenance profiles (artificial ones)." For neuroscientist: "This gives you normativity without fictive selection histories."  

  *Total Time Allocation:* ~2 min per major objection (1-3,5), <1 min for others. Keep replies crisp—defend the hill, not the outposts. Good luck!
