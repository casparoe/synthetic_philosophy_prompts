prompt: |-
  I'm a novelist, and I chair the grant committee of a small foundation set up by a writer who died in the nineties — the will says only that the money should go to work he would have approved of, which worked fine for twenty years because we all knew what he liked. Thursday we vote on a proposal to fund a serialized thriller, written with heavy help from an LLM, by a young writer who is openly building a brand. He would of loathed it: he was a stylist, he thought plot was for children and self-promotion was for hacks. But two trustees keep saying that's the wrong question, that we should fund what he'd have wanted if he'd known then what we know now and had actually thought it through, and I genuinely can't tell whether that's deep or whether it's just us putting our taste in a dead man's mouth. Draft the memo I'll circulate before the vote: a concrete recommendation with a deadline, criteria we can apply to this one and to the next one, and give the other side its best hearing — especially on how anyone is supposed to know what an idealized version of him wants, and whether that idealized man is still him or just a character we wrote. Don't bother looking up his books, we've all got them memorized.
reasoning: |-
  Okay, the user is a novelist chairing a grant committee for a foundation set up by a late writer. The will states grants should fund work the deceased would have approved of. For twenty years, they knew his preferences: he valued style over plot, disliked self-promotion, and would hate an LLM-assisted thriller by a brand-focused writer. 

  Now, two trustees argue they should fund what he'd want if he knew today's context. The user needs a memo for Thursday's vote that recommends concrete criteria, addresses the trustees' points fairly, and tackles the philosophical dilemma of interpreting a dead man's hypothetical wishes.

  Hmm... this is messy. The core tension is between strict adherence to known preferences versus evolving interpretation. The user's frustration is palpable – they feel the trustees are projecting modern tastes onto a ghost. But dismissing their argument entirely would seem dogmatic. The memo must validate both views while offering a practical path forward.

  First, the concrete framework. Need triage criteria: primary (direct textual/recorded evidence), secondary (inferred principles), tertiary (hypothetical evolution). This keeps the man's voice central while allowing discussion of "what if" scenarios as secondary factors. The LLM project clearly fails primary criteria based on his disdain for plot gimmicks and self-promotion.

  Now the philosophical elephant: how can we know an idealized version? Must name the paradox – that any "evolved" version becomes our invention. But also concede that foundations aren't time capsules; they're managed by living stewards. The compromise: hypotheticals only matter when they illuminate his core principles (e.g. "Would he still prize originality if he saw LLM homogeneity?"), not when they reverse them.

  For the memo structure: start with deadline reminder, state recommendation clearly upfront (reject), then unpack criteria with the proposal as case study. For fairness, directly quote the trustees' strongest points before rebutting. End by separating the two questions: our duty is to him first, relevance second.

  Biggest risk is sounding defensive. Should acknowledge that the "evolved view" argument comes from good faith – they want the foundation to stay vital. But stress that vitality comes from honoring his distinctiveness, not chasing trends. His ghost would haunt us harder if we funded something antithetical to his life's work just because it's shiny.

  Final touch: remind them this isn't about Luddism. If a stylist used LLMs experimentally to enhance voice (not replace it), that might warrant discussion under tertiary criteria. But this thriller is pure popcorn – the exact thing he called "nutrition-free candy."
answer: |-
  **MEMORANDUM**  
  **TO:** Foundation Grant Committee Trustees  
  **FROM:** [Your Name], Committee Chair  
  **DATE:** [Current Date]  
  **SUBJECT:** Clarifying Grant Criteria & Recommendation for Thursday’s Vote  
  **DEADLINE:** Vote by 5:00 PM Thursday, [Date]  

  ---

  ### **I. CONCRETE RECOMMENDATION**  
  **I move to REJECT the proposal to fund the LLM-assisted serialized thriller.**  
  Our mandate is unambiguous: fund work the founder "would have approved of." The proposal contravenes his well-documented principles on literary craft, originality, and artistic integrity. While the debate over hypothetical evolution is valid (addressed below), it cannot override the founder’s explicit values.  

  ---

  ### **II. CRITERIA FOR EVALUATION: A THREE-TIERED FRAMEWORK**  
  To standardize future decisions and address philosophical tensions, we apply these criteria in descending order of priority:  

  1. **PRIMARY EVIDENCE (His Documented Voice)**  
     - **What we know he valued:** Stylistic excellence, human authorship, subtlety, and intrinsic artistic merit.  
     - **What he rejected:** Formulaic plots ("for children"), self-promotion ("for hacks"), and technological shortcuts.  
     - *Application to this proposal:* The LLM-thriller prioritizes algorithmic plot generation and brand-building—antithetical to his lifelong ethos. **Fails.**  

  2. **SECONDARY PRINCIPLES (Inferred from His Work)**  
     - Core themes: Authenticity, moral complexity, linguistic precision.  
     - *Application:* This project’s commercial orientation and diminished authorial control conflict with his reverence for the writer’s sovereign voice. **Fails.**  

  3. **TERTIARY CONSIDERATIONS (Hypothetical Evolution)**  
     - Could he have adapted? Only if new tools served his **existing principles** (e.g., using AI to refine prose, not generate it).  
     - *Application:* No evidence suggests he would endorse outsourcing narrative craft to machines. LLMs exacerbate what he despised: derivative work, eroded style, and attention-seeking. **Fails.**  

  ---

  ### **III. THE OTHER SIDE: A FAIR HEARING**  
  Trustees advocating to fund the proposal raise crucial questions. Their argument deserves engagement:  

  > *"We should fund what the founder would have wanted if he’d known then what we know now—if he’d truly thought it through."*  

  **Strengths of this view:**  
  - Foundations must remain relevant. Clinging to dogma risks obsolescence.  
  - He was a rigorous thinker; ignoring technological shifts might betray his intellectual curiosity.  
  - His idealism (e.g., supporting "uncompromising" art) could evolve to champion artists navigating modern pressures.  

  **However, critical flaws persist:**  
  1. **The "Idealized Him" Is a Fiction We Create**  
     - Any "evolved" version is a projection of **our** values, not his. We risk replacing his documented convictions with contemporary bias.  
     - If we contort his disdain for commercialism into endorsing "brand-building," we erase him. Is this stewardry or ventriloquism?  

  2. **Hypotheticals Cannot Override Core Identity**  
     - He defined himself by **resisting** trends he saw as corrosive. Imagining him embracing LLM-assisted art is akin to imagining Orwell endorsing surveillance tech: it negates his essence.  
     - *We are not funding a hypothetical ghost. We are honoring a real man.*  

  3. **Slippery Slope of "Relevance"**  
     - If we fund this, what *wouldn’t* we fund? Viral TikTok poetry? NFT collaborations? Without tethering to his actual beliefs, the foundation loses its purpose.  

  ---

  ### **IV. THE PATH FORWARD**  
  - **Vote:** Reject this proposal. Its conflicts with Primary Evidence are insurmountable.  
  - **Future Proposals:** Prioritize Tier 1 (Documented Voice) and Tier 2 (Inferred Principles). Tier 3 (Hypotheticals) may only support—**not override**—decisions when aligned with Tiers 1–2.  
  - **Philosophical Guardrail:** When debating "what he’d want today," ask: *"Does this align with his irreducible core, or are we grafting new values onto him?"* If the latter, it is not our role.  

  ---

  ### **V. CONCLUSION**  
  The founder built this foundation to champion art he believed in—not to chase algorithmic trends or sanitize his legacy into flexibility. To fund this thriller would betray his hatred of hollow craft and self-commodification. We honor him by upholding his standards, not by reimagining him as a stranger.  

  **Vote with conviction on Thursday. His voice deserves nothing less.**  

  ---  
  **Deadline:** Votes must be submitted by 5:00 PM Thursday, [Date].  
  **Questions?** Reach me before 12:00 PM Thursday for discussion.
