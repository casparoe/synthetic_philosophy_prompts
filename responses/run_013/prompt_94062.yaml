  For the third development—resurrection from records—Borges explored identity and duplication in stories like "The Circular Ruins." He was skeptical of persistent selves, influenced by Hume. A reconstruction might fascinate him as a technological extension of idealism, but he'd probably call it a copy, not a resurrection. The question misposes by assuming a fixed self that can be restored. Moderate confidence; he might surprise us by embracing the copy as equally "real" in an idealist framework.

  Assessing novelty: The physics of timelessness (1) would be new in its scientific rigor but familiar philosophically. Recurrence (2) is explicitly old for him. Resurrection tech (3) is new but echoes his themes. 

