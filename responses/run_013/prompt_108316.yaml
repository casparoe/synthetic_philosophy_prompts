answer: |-
  ### Essay Question
  **The debate over whether large language models (LLMs) "understand" what they process often invokes Morgan's Canon (1894): we should not attribute a higher cognitive faculty to an organism if a simpler one explains its behavior. Critics argue LLMs are merely "stochastic parrots" exhibiting sophisticated pattern matching without understanding. However, contemporary techniques—like manipulating internal activations during inference to test causal hypotheses about model function—appear to provide evidence of structured internal representations. Does this interventional, mechanistic evidence resolve the understanding debate? Or does it merely relocate the disagreement to whether these internal states constitute *genuine* representations versus instrumental fictions? Take a clear stance on whether the core disagreement is empirical, conceptual, or verbal. Justify your view, and specify what evidence (if any) would change your position.**

  ---

  ### Model Answer (480 words)
  The persistent disagreement over LLM "understanding" is primarily conceptual, not empirical or verbal. Interventional evidence (e.g., activation swapping) enriches the debate but cannot resolve it alone because it shifts the dispute to the *interpretation* of representations—a fundamentally philosophical problem.

  Morgan’s Canon underpins the "stochastic parrot" view: if surface behavior (e.g., coherent answers) arises from statistical correlation, we should not infer understanding. Mechanistic interventions complicate this by revealing causal structure. For instance, patching a "fact retrieval" activation vector from one prompt into another demonstrably alters outputs predictably, suggesting the model relies on internal states that *functionally resemble* representations (e.g., of entities or relationships). This defeats simplistic behaviorist dismissals, as it shows internal computations beyond shallow pattern matching.

  However, this evidence only pushes the debate upstream. Proving that activations *operate as* representations in a causal chain does not prove they *are* representations in a semantic sense. Critics like Bender and Koller (2020) argue LLM "representations" lack intrinsic aboutness (*intentionality*): they are statistical shadows of training data, not grounded referents. Defenders like Buckner (2024) counter that functional role suffices for understanding. Here, the clash turns on conflicting theories of meaning—whether representation requires embodiment, social context, or mere causal-inferential utility. This divergence is conceptual; it concerns the *criteria* for "understanding" and "representation," not empirical gaps.

  Verbal disagreements exist (e.g., equivocating "understanding" across fields), but they are secondary. The core issue is whether cognition *must* involve non-computational elements (e.g., consciousness, embodiment), a question unresolved by observing silicon neurons.

  **What evidence would move me?** Interventional data already constrains the debate: if activations were chaotic or non-compositional, it would support the parrot view. To sway my conceptual stance, I would need evidence that LLM representations exhibit properties uniquely tied to human-like understanding. For example: 
  - **Unprompted error correction:** An LLM spontaneously rejecting inputs violating its internal "beliefs" (e.g., refusing "2+2=5" without safety training), suggesting endogenous goals.  
  - **Cross-modal grounding:** An LLM trained only on text reliably identifying real-world referents from sensory input (e.g., matching "red apple" to an image it never saw).  
  Such results would pressure anti-understanding views by simulating intentionality or grounding. Absent this, the debate remains a contest of philosophical priors.

  ---

  ### Marking Scheme  
  **A (18–20/20):**  
  - Explicitly classifies the disagreement as *conceptual* (or hybrid, with justification).  
  - Explains *how* interventional evidence challenges Morgan’s Canon but *fails* to resolve the debate due to ambiguity over representation.  
  - Names *specific* criteria for "genuine representation" (e.g., intentionality, functional role) from course texts (e.g., Searle, Dennett).  
  - Proposes *novel, feasible* evidence (beyond paraphrasing the model answer) and explains *why* it would shift the conceptual needle.  
  - Anticipates counterarguments (e.g., "But interventions *are* empirical proof!").  

  **B (15–17/20):**  
  - Correctly identifies the debate’s nature but with vaguer justification (e.g., "It’s about definitions").  
  - Describes interventional evidence but does not deeply engage with *why* representation remains contested.  
  - Suggests generic evidence (e.g., "better brain scans") without linking to philosophical thresholds.  

  **Deduct 2–3 marks for:**  
  - **Definitional stop**: Claiming "it’s *just* semantics" without analyzing implications.  
  - **Ignoring interventions**: Rehashing parrot vs. autocomplete arguments exclusively.  
  - **Vagueness**: Unspecified evidence or unclear stance on disagreement type.  

  ---

  ### Self-Critique of Model Answer  
  **Least confident point:** My claim that cross-modal grounding could pressure anti-understanding views. Some philosophers (e.g., Fodor) might argue this still constitutes "derived" intentionality (dependent on programmers), not intrinsic understanding.  
  **Evidence that could change my view:** If an LLM *autonomously* used such grounding to *revise* its representations (e.g., learning "shiny apples are sweet" from visual input and updating text predictions), it would better simulate embodied cognition, making intentionality harder to dismiss as instrumental fiction.  

  Total: 895 words.
