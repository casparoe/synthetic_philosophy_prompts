prompt: |-
  I run the evidence review desk at a policy institute: we commission social-science reports from economists, sociologists and epidemiologists, and before anything reaches the minister I have to sign off on whether the causal claims in the executive summary are adequately supported. The failure mode I keep meeting is not bad statistics but the wrong kind of explanation — a claim in which an aggregate or institutional fact (a labour market, a housing system, a culture of overwork, an inspection regime) is said to do the causal work with no account of how it bears on anyone's behaviour, or the reverse, a claim that is entirely about individual choices and is nonetheless offered as an explanation of a population pattern those choices cannot generate. My reviewers get two hours per report, never see the underlying data, and are not philosophers.

  Write the decision procedure I can hand them, ordered so that the cheap tests come first and grounded in the debate between methodological individualism and holism rather than in our in-house habits. I do not want a summary of that debate: for each step, give one line on which part of it the step is trying to preserve and what it is giving up. The procedure has to separate three things my reviewers currently run together under the word "microfoundations" — a claim about what exists, a claim about what an explanation must cite, and a claim about how to find good evidence. It has to say what a genuinely individual-level account adds that a restatement of the macro pattern in individual terms does not. And it has to handle the cases where the aggregate appears to be doing the explaining in its own right — where a macro fact constrains or causes individual outcomes rather than summarising them, and where a macro property is partly constituted by the individual behaviour and so cannot be a rival cause.

  Deliver the ordered questions, what counts as a sufficient answer to each, where the procedure stops with a rejection, and where it stops and hands the decision to a person because what is at issue is a judgement about what counts as an explanation rather than a fact. Mark the steps that are judgement calls dressed up as procedure. Then run it on two reports: (a) one arguing that a rise in local housing costs explains a fall in internal migration, with the mechanism given only as "people respond to prices"; and (b) one arguing that a change in a school funding formula raised attainment, evidenced by a discontinuity across district boundaries with no individual-level data at all. At least one of the two should come out against my reviewers' instincts. Finish by saying what the procedure cannot do and where its reasoning is most likely to fail — what argument or kind of case would make you give up the individual/aggregate distinction as a reviewing device altogether.
reasoning: |-
  We are building a decision procedure for reviewing causal claims in policy reports. The goal is to handle the tension between individual-level and aggregate-level explanations without requiring philosophical expertise. The procedure must separate three aspects often conflated under "microfoundations": ontology (what exists), explanation (what must be cited), and evidence (how to find support). It must also clarify the value of a genuine individual-level account and handle cases where macro facts constrain individuals or are constituted by individual behavior.

  The procedure will be a sequence of questions. We start with cheap tests and progressively require more. We will note at each step what aspect of the individualism/holism debate we are preserving and what we are giving up. We will also mark steps that are judgment calls.

  **Decision Procedure:**

  1. **Question:** Does the report claim a causal relationship between two or more variables?  
     **Sufficient answer:** Yes, and the variables are clearly identified (e.g., "X causes Y").  
     **If no:** Stop and reject the claim as non-causal.  
     **What we preserve:** The need for a clear causal claim to evaluate.  
     **What we give up:** We are not yet evaluating the claim's validity.  
     **Note:** This step is straightforward.

  2. **Question:** Are the variables at the same level of aggregation? (e.g., individual vs. aggregate)  
     **Sufficient answer:** The levels are identifiable (e.g., both aggregate, both individual, or mixed).  
     **What we preserve:** The idea that cross-level claims require special attention.  
     **What we give up:** We are not yet judging the validity of cross-level claims.  
     **Note:** This step is descriptive.

  3. **Question (for claims where cause and effect are at different levels):**  
     a. If the cause is aggregate and the effect is aggregate: Skip to step 4.  
     b. If the cause is aggregate and the effect is individual: Proceed to step 4.  
     c. If the cause is individual and the effect is aggregate: Go to step 5.  
     **Note:** We are categorizing the type of claim.

  4. **Question (for aggregate cause → any effect):** Does the report provide a mechanism that connects the aggregate cause to the effect by specifying how it influences individual decisions, behaviors, or constraints?  
     **Sufficient answer:** A clear description of how the aggregate factor changes the situation for individuals (e.g., incentives, constraints, information) and how that leads to the effect.  
     **If no:** Stop and reject the claim as inadequately supported.  
     **What we preserve:** Methodological individualism's requirement that aggregate causes must ultimately operate through individuals.  
     **What we give up:** Holism's direct macro-to-macro causation without micro-level mediation.  
     **Note:** This step requires a mechanism. A restatement of the pattern (e.g., "people respond to prices") is insufficient.

  5. **Question (for individual cause → aggregate effect):** Does the report provide an account of how the individual-level cause aggregates to the effect?  
     **Sufficient answer:** A clear description of the aggregation process (e.g., via composition, interaction, or emergence) that shows how the individual behavior leads to the aggregate pattern.  
     **If no:** Stop and reject the claim as inadequately supported.  
     **What we preserve:** The holist insight that aggregate patterns are not always reducible to individual actions without considering interactions and system effects.  
     **What we give up:** Individualism's assumption that individual actions alone explain aggregates.  
     **Note:** This step requires more than just stating individual actions; it must show how they generate the pattern.

  6. **Question (for all claims):** Is the mechanism or aggregation account consistent with the evidence presented?  
     **Sufficient answer:** The evidence (e.g., data, case studies) supports the proposed mechanism or aggregation process.  
     **If no:** Stop and reject the claim as unsupported by evidence.  
     **What we preserve:** Empirical adequacy.  
     **What we give up:** We are not requiring direct evidence of the mechanism (if indirect evidence is strong) but note that this step might involve judgment.  
     **Note:** This step is a judgment call. The reviewer must decide if the evidence is consistent with the mechanism. We don't require direct evidence of the mechanism (e.g., individual data) if the aggregate evidence strongly supports it.

  7. **Question (for aggregate cause → aggregate effect with mechanism):** Does the report address the possibility that the aggregate "cause" is in fact constituted by the individual behaviors? (i.e., is there a risk of circularity?)  
     **Sufficient answer:** The report either (a) shows that the aggregate cause is not merely a summary of the effect (e.g., it is an exogenous constraint) or (b) acknowledges the interdependence and provides a dynamic account.  
     **If no and circularity is evident:** Flag as a potential issue and hand to a person for judgment.  
     **What we preserve:** The holist view that aggregates can have independent causal power (e.g., as constraints) but without ignoring the individual basis.  
     **What we give up:** Individualism's strict reduction.  
     **Note:** This step is a judgment call because circularity can be subtle.

  8. **Handoff to human judgment:** If the claim passes steps 1-7 without rejection, but there are unresolved issues (e.g., the mechanism is speculative but consistent, or circularity is a concern but not fatal), then the decision is passed to a person. The human must judge whether the explanation is adequate given the context.

  **What a genuinely individual-level account adds:**  
  A restatement of the macro pattern in individual terms (e.g., "people move less because they are responsive to housing prices") does not explain how the pattern emerges. A genuine individual-level account must show the aggregation process (step 5) and/or the mechanism (step 4) to avoid being a tautology.

  **Running the Procedure on Two Reports:**

  **(a) Report: Rise in local housing costs explains a fall in internal migration, with mechanism "people respond to prices".**

  1. Claim: Aggregate cause (housing costs) → aggregate effect (fall in migration).  
  2. Levels: Both aggregate.  
  3. Skip to step 4.  
  4. Mechanism: "People respond to prices" is a restatement, not a mechanism. It does not specify how housing costs change individual decisions (e.g., by making moving less affordable, changing cost-benefit calculations, etc.).  
     **Decision:** Reject at step 4.

  **(b) Report: Change in school funding formula raised attainment, evidenced by discontinuity across district boundaries (no individual data).**

  1. Claim: Aggregate cause (funding formula) → aggregate effect (attainment).  
  2. Levels: Both aggregate.  
  3. Skip to step 4.  
  4. Mechanism: The report must provide a mechanism. If it says something like "more funding allows schools to hire better teachers, reduce class sizes, or buy resources, which improves student learning", that is a mechanism. But if it only says "funding affects attainment", it fails. Let's assume the mechanism is not specified.  
     **Decision:** Reject at step 4.

  However, if the report does specify a mechanism (even without individual data), then:
  4. Mechanism: If provided (e.g., "funding allows for smaller classes, which improves individual student attention and learning"), then proceed.
  6. Evidence: The RDD at district boundaries is consistent with the mechanism if the mechanism implies that funding differences lead to different school resources and then to different average attainment. But without individual data, we rely on the aggregate evidence. This step is a judgment call. The reviewer might accept if the mechanism is plausible and the evidence is strong.
  7. Circularity: Not an issue here because the funding formula is an exogenous policy change, not constituted by individual attainment.  
     **Decision:** If step 4 is passed and step 6 is passed by judgment, then accept or hand to human if there are concerns.

  But note: the problem states the report has "no individual-level data at all". The procedure does not require individual data; it requires a mechanism. However, step 6 (evidence) might be a problem if the mechanism is not directly tested. The reviewer must judge if the aggregate evidence (the discontinuity) is consistent with the mechanism.

  **What the Procedure Cannot Do and Where It Fails:**

  - **Cannot handle emergent properties:** Some phenomena (e.g., market equilibria, social norms) are irreducible to individual actions without circularity. The procedure might reject valid holistic explanations that do not specify microfoundations.
  - **Judgment calls:** Steps 6 and 7 are judgment calls. Inconsistent judgments may occur.
  - **Complex interdependencies:** In systems with feedback loops (e.g., where individual actions and aggregate conditions co-evolve), the distinction between levels blurs, and the procedure may break down.
  - **Non-causal explanations:** The procedure only evaluates causal claims. It does not handle descriptive, interpretive, or functional explanations.
  - **Where to give up the distinction:** If the report argues that the aggregate phenomenon is an emergent property with causal powers that cannot be reduced (e.g., a social norm that constrains behavior but is maintained by that behavior), the procedure might reject it at step 4 or 5. In such cases, we might need to accept a holistic explanation without microfoundations. But note: step 7 is designed to handle some of this by allowing for constraints. However, if the debate is about whether such emergent properties are admissible, the procedure sides with individualism. If the reviewer encounters a case where the holistic explanation is well-established and the mechanism is not known (e.g., in some complex systems theories), the procedure would reject it, which might be a failure.

  **Conclusion:**  
  The procedure is designed to catch common failures in explanation but may be too strict for genuinely emergent phenomena. It prioritizes clarity about mechanisms and aggregation processes, which are often missing in policy reports. It fails when the individual/aggregate distinction is not meaningful or when reduction is impossible.
answer: |-
  ### Decision Procedure for Causal Claim Review  
  **Grounding**: This procedure preserves the core insight of *methodological individualism*—that social phenomena must be traceable to individual actions—while conceding to *holism* that aggregates can causally constrain or constitute behavior. It separates ontology (what exists), explanatory requirements (what must be cited), and evidence (how to verify). A "genuine individual-level account" adds *causal specificity*: it shows how individual actions *generate* the aggregate pattern through mechanisms (e.g., decisions, interactions), not just restate the pattern in individual terms (e.g., "people respond" is tautological).  

  **Ordered Questions** (Cheap tests first; ⚠️ = judgment call):  

  1. **Is the causal claim explicit?**  
     - *Check for*: Clear "X causes Y" statement, with variables defined.  
     - *Sufficient answer*: Yes, with cause/effect identified.  
     - *Stop if no*: Reject claim (non-causal).  
     - *Debate preservation*: Clarity in explanation (individualism/holism neutral).  
     - *Gives up*: Depth of causal structure.  

  2. **Are cause and effect at the same level?**  
     - *Levels*: Aggregate (e.g., institutions, population rates) vs. individual (e.g., choices, behaviors).  
     - *Sufficient answer*: Levels clearly distinguished (e.g., "housing costs [aggregate] → migration [aggregate]").  
     - *Stop if unclear*: Reject (ambiguous ontology).  
     - *Debate preservation*: Acknowledges level distinctions (individualism).  
     - *Gives up*: Holist view that levels may blur.  

  3. **For aggregate → aggregate claims: Is the cause *exogenous* to the effect?**  
     - *Check for*: Cause is not constituted by the effect (e.g., policy change vs. emergent culture).  
     - *Sufficient answer*: Cause is external (e.g., law, shock) or constitution is addressed.  
     - *Stop if endogenous*: Hand to human (⚠️ judgment: is circularity defensible?).  
     - *Debate preservation*: Holist allowance for macro constraints.  
     - *Gives up*: Individualism’s reduction mandate.  

  4. **Does the explanation specify a *mechanism*?**  
     - *Mechanism defined*: How the cause alters individual incentives, constraints, or information, leading to behavior change.  
     - *Sufficient answer*: Description of behavioral pathway (e.g., "higher rents reduce relocation budgets, leading households to reject job offers").  
     - *Stop if absent*: Reject (wrong explanation type).  
     - *Debate preservation*: Individualism’s explanatory requirement.  
     - *Gives up*: Holist macro-to-macro causation.  

  5. **For individual → aggregate claims: Does it show *aggregation logic*?**  
     - *Check for*: How individual actions combine (e.g., via markets, norms, or feedback loops) to produce the pattern.  
     - *Sufficient answer*: Account of composition/interaction (e.g., "individual savings choices amplify via bank lending to create a credit bubble").  
     - *Stop if absent*: Reject (fallacy of composition).  
     - *Debate preservation*: Holist focus on emergent properties.  
     - *Gives up*: Individualism’s atomism.  

  6. **Is the mechanism/aggregation supported by evidence?**  
     - *Check for*: Data consistent with the pathway (e.g., surveys on choices, boundary discontinuities, natural experiments).  
     - *Sufficient answer*: Evidence plausibly links mechanism to outcome (direct or indirect).  
     - *Stop if inconsistent*: Reject (unsupported).  
     - *Hand if weak*: To human (⚠️ judgment: adequacy of proxy evidence).  
     - *Debate preservation*: Empirical rigor (neutral).  
     - *Gives up*: Philosophy-first purity.  

  7. **Does the claim confuse *constitutive* vs. *causal* roles?**  
     - *Check for*: Whether the aggregate is a container for behavior (e.g., "culture" as shorthand for shared norms) vs. a causal force (e.g., law penalizing behavior).  
     - *Sufficient answer*: Distinction acknowledged; no "culture" as a causal actor without behavioral anchors.  
     - *Hand if ambiguous*: To human (⚠️ judgment: is reification justified?).  
     - *Debate preservation*: Individualism’s anti-reification.  
     - *Gives up*: Holist social facts.  

  ---  
  ### **Test Cases**  
  **Report (a):** *"Rise in local housing costs explains a fall in internal migration, with mechanism 'people respond to prices.'"*  
  - Step 1: **Pass** (claim explicit: costs → migration).  
  - Step 2: **Pass** (aggregate → aggregate).  
  - Step 3: **Pass** (housing costs exogenous; not constituted by migration).  
  - Step 4: **Fail**—Mechanism is a restatement ("respond to prices"), not a behavioral pathway (e.g., how costs alter job search or relocation calculus).  
  - **Decision**: Reject at Step 4.  
  - *Reviewers’ instincts*: Likely accept (common economic shorthand). **Procedure overrules**.  

  **Report (b):** *"Change in school funding formula raised attainment, evidenced by discontinuity across district boundaries with no individual-level data."*  
  - Step 1: **Pass** (funding → attainment).  
  - Step 2: **Pass** (aggregate → aggregate).  
  - Step 3: **Pass** (funding formula is exogenous policy).  
  - Step 4: **Hand to human**—If mechanism is implied (e.g., "funding hires teachers, improving instruction"), it passes. If absent (e.g., "funding causes attainment"), it fails. ⚠️ Judgment: Boundary discontinuity *suggests* a mechanism (resource disparity), but the report must state it.  
  - Step 6: **Pass** (discontinuity evidence supports mechanism if stated).  
  - **Decision**: If mechanism stated, accept; else reject at Step 4.  
  - *Reviewers’ instincts*: Likely reject (no microdata). **Procedure may accept** with mechanism.  

  ---  
  ### **Limitations and Failure Modes**  
  1. **Cannot handle irreducible emergence**: Cases where macro properties (e.g., inflation, herd immunity) are *explained by* but not *reducible to* individual actions. The procedure rejects these as "mechanism absent," though they may be valid (e.g., epidemiological models).  
  2. **Fails under strong feedback loops**: When aggregates and individuals co-constitute each other (e.g., a "culture of overwork" both emerges from and constrains choices), the constitutive/causal distinction (Step 7) becomes untenable.  
  3. **Vulnerable to proxy overreliance**: Step 6 (evidence) may accept weak proxies for mechanisms (e.g., boundary discontinuities as "proof" of individual behavior), risking ecological fallacy.  
  4. **Abandons the distinction when**:  
     - The explanation relies on *systemic properties* (e.g., network effects, equilibrium states) where microfoundations are intractable or trivial.  
     - Evidence is purely historical/interpretive (e.g., "the regime collapsed due to state fragility"), making individual/aggregate separation artificial.  
     **In these cases, reject the procedure and invoke expert judgment for "explanation adequacy."**
