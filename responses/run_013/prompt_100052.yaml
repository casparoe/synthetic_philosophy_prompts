prompt: |-
  I'm the staff researcher for the foreign affairs select comittee in our parliament, the one that writes the non-binding "should we back this" recommendation before the chamber votes on a deployment. We've built up a track record and next week we have to take a position on a live case, and I want to know what we should recommend if we're going to be consistent with ourselves rather than with whoever shouted loudest in the last debate. You're a just-war theorist who's spent a career on the ethics of intervention. Please think this through carefully before you commit to anything, and start by brainstorming the full space of rules, don't just grab the first one.

  Our calls so far:
  - Kosovo, 1999: recommended backing the NATO air campaign, even though the Security Council never authorised it. We told ourselves NATO's sign-off counted as the multilateral cover.
  - Iraq, 2003: recommended against. Our reasoning was that the case being made was about disarmament and replacing the government, not about anyone who was actually being killed at the time.
  - Libya, 2011: recommended backing the no-fly zone and the strikes. Security Council authorised, and we liked two things: the resolution ruled out any foreign occupying force, and it stayed an air campaign rather than a ground invasion.
  - East Timor, 1999: recommended backing the Australian-led force. Council-authorised, humanitarian in aim, and pointedly not aimed at toppling Indonesia's government.

  So we seem to be running some rule like: (a) it's about whether intervening will save more lives than it costs, authorisation be damned; or (b) it's about who signed off, with a regional body counting as enough; or (c) it's about means, no invasion, no occupation, no regime change. Maybe some mix of the three.

  Now the new case. Nara, a country whose government is backed by a permanent member of the Security Council, is killing a minority population in its northern provinces. That permanent member will veto anything that comes to the Council, and has said so. The regional body, the Coastal Union, has voted to endorse an intervention and formally asked for a coalition. Two of Nara's neighbours have offered troops, and both of them happen to covet Nara's oilfields. Our defence analysts say the only way to actually stop the killing is to take the capital and remove the government, then stay for years to keep order afterwards; there is no air-only option, the terrain and the dense cities rule it out. The killing is ongoing, though slower right now than Kosovo's was.

  What I need: which rule or rules our four precedents are actually consistent with, what each of them predicts for Nara, your best guess at what we should recommend and the reasons for it, and the single earlier case, real or hypothetical, that would settle which rule we're really running. If choosing either way means we're quietly adopting a new principle, spell out plainly what that principle is. And if our precedents genuinely don't decide this one, say so rather than pretending they do.
reasoning: |-
  Okay, the user is a staff researcher for a foreign affairs select committee. They need to recommend whether to back an intervention in Nara, but they want to be consistent with their past decisions rather than political pressure. Let me start by understanding their precedents.

  Looking at Kosovo (1999): They backed NATO's air campaign without UN Security Council authorization, accepting regional multilateral approval instead. So, principle here seems to value saving lives over strict UN authorization, with regional bodies' approval counting.

  Iraq (2003): They recommended against because the justification was disarmament and regime change, not ongoing humanitarian crisis. So, the motive and immediacy of threat matter. Regime change as a goal was a red flag.

  Libya (2011): Supported with UN authorization. They noted the no-occupation clause and it remained an air campaign. So, UN approval plus limited means (no ground invasion) and no occupation were key.

  East Timor (1999): Backed Australian-led force with UN approval, humanitarian aim, no regime change intent. Again, UN auth, clear humanitarian purpose, and not targeting the sovereign government.

  Now, the user suggests possible rules: (a) lives saved over authorization, (b) who signed off, (c) means like no invasion/occupation. But each case has a mix. Kosovo prioritized lives and regional approval, Iraq rejected regime change, Libya and East Timor required UNSC approval and limited means.

  Nara's situation: UNSC vetoed by a P5 member, but regional Coastal Union approved. Neighbors offering troops but have ulterior motives (oil). Required means: must invade, occupy, and change regime to stop killings. No air-only option.

  Conflict points: Regional approval exists like Kosovo, but Kosovo avoided regime change and occupation. Here, regime change and occupation are necessary. Libya and East Timor had UNSC approval; here it's vetoed. The neighbors' motives are problematic, similar to Iraq's concerns about hidden agendas.

  So, consistency? If they follow Kosovo's regional approval, they might support, but Kosovo didn't involve regime change. Libya had UNSC and no occupation. Nara requires both regime change and occupation, which contradicts Libya and East Timor's principles. Also, ulterior motives of neighbors raise Iraq-like red flags.

  The user needs to know if precedents decide this. Precedents don't align neatly. Kosovo supports regional approval but rejects regime change/occupation. Supporting Nara would mean accepting regime change as necessary, which is a new principle. Or, rejecting due to means and motives, which aligns more with Iraq and Libya's limits.

  The single case to settle this would be a hypothetical like Kosovo but requiring ground invasion. Since that didn't exist, they have to choose. If they recommend against, they prioritize means and motives over regional approval. If for, they prioritize humanitarian need despite means, introducing a new principle where extreme cases justify regime change and occupation.

  Underlying need: The committee wants ethical consistency to maintain credibility. They might fear setting a precedent that could be misused. Also, the researcher needs a clear rationale to present, avoiding hypocrisy. Unspoken: balancing moral imperative vs. practical consequences, and not appearing to contradict past stances.
answer: |-
  Based on your precedents and the principles they reveal, here's a structured breakdown of consistency, the Nara dilemma, and the path forward:

  **Decoding Your Precedents: The Implicit Rule Set**
  Your decisions aren't governed by a single rule, but by a **hierarchical framework** where thresholds must be met:
  1.  **Humanitarian Imperative & Proportionality:** *Is the intervention likely to save significantly more lives than it costs?* (Primary driver in Kosovo, critical in Libya/East Timor, lacking in Iraq).
  2.  **Multilateral Authorization:** *Is there credible multilateral authorization?* (UNSC preferred – Libya, East Timor; Regional body accepted as sufficient substitute *only if* UNSC is paralyzed by bad-faith veto – Kosovo).
  3.  **Limitation of Means & Objectives:** *Are the means and objectives constrained to avoid unnecessary escalation, occupation, or forced regime change?* (Critical in Libya - no occupation/regime change specified; Implicit in Kosovo - air campaign only; Explicitly violated in Iraq - regime change core objective; Explicit in East Timor - no targeting Indonesian gov).

  **Applying the Framework to Nara:**
  1.  **Humanitarian Imperative & Proportionality:** **Likely MET, but HIGH RISK.**
      *   *Met:* Ongoing killing of a minority population constitutes a humanitarian crisis justifying potential intervention. The stated aim is to stop the killing.
      *   *High Risk:* Defence analysts state success requires regime change and long-term occupation. This drastically increases the potential cost in lives (military and civilian casualties, prolonged instability, insurgency) and the risk of mission creep/failure. Proportionality is highly questionable compared to limited interventions like Kosovo/Libya.

  2.  **Multilateral Authorization:** **PARTIALLY MET (Kosovo Precedent).**
      *   *Vetoed UNSC:* Similar to Kosovo, a P5 member is shielding the perpetrator, rendering the UNSC dysfunctional on this issue.
      *   *Regional Authorization (Coastal Union):* Parallels Kosovo's NATO authorization. This meets the "substitute multilateralism" threshold established in Kosovo when the UNSC is blocked in bad faith.

  3.  **Limitation of Means & Objectives:** **CLEARLY VIOLATED.**
      *   *Means:* Requires full-scale invasion and long-term occupation. This directly contradicts the "no invasion, no occupation" principle crucial in Libya and implicit in Kosovo (air-only). It mirrors the *means* rejected in Iraq (though Iraq failed on other thresholds too).
      *   *Objectives:* Requires regime change. This explicitly violates the "no regime change" principles upheld in Libya (UNSC mandate forbade it) and East Timor (explicitly avoided targeting Indonesia). It aligns with the core problem in Iraq.

  **Precedents' Prediction:**
  *   **Kosovo Precedent (Multilateral Substitute):** Predicts **FOR** intervention (Regional authorization covers the multilateral requirement despite UNSC veto).
  *   **Iraq Precedent (Regime Change/Disproportionate Means):** Predicts **AGAINST** intervention (Regime change core objective, invasion/occupation required).
  *   **Libya Precedent (Limited Means/Objectives + UNSC):** Predicts **AGAINST** intervention (Requires invasion/occupation/regime change, violating core constraints; lacks UNSC).
  *   **East Timor Precedent (Humanitarian Focus + UNSC + No Regime Change):** Predicts **AGAINST** intervention (Requires regime change, lacks UNSC, involves invasion/occupation).

  **Net Precedential Prediction:** **AGAINST Intervention (2.5 to 1.5)**. While the multilateral authorization hurdle is cleared via Kosovo, the violations of the *Limitation of Means & Objectives* principle (invasion, occupation, regime change) are severe and align directly with the reasons for rejecting Iraq and the constraints applied in Libya/East Timor. The high-risk proportionality further tilts against.

  **Recommendation for Nara: Recommend AGAINST Backing the Intervention.**

  **Reasons:**
  1.  **Violation of Core Constraint Principle:** The *necessity* of regime change and long-term occupation fatally undermines consistency with Libya, East Timor, and the rejection of Iraq. Your committee has consistently treated forced regime change and invasion/occupation as red lines, not justifiable even for humanitarian aims. Crossing this line here fundamentally changes your doctrine.
  2.  **Proportionality & Feasibility Risks:** The high predicted cost in lives and stability, coupled with the inherent risks of a complex invasion and prolonged occupation, make the "save more lives than it costs" calculation highly uncertain and likely negative. This fails the primary *Humanitarian Imperative* threshold as you've practically applied it.
  3.  **Agenda Risk:** The ulterior motives (oil) of the key proposing neighbours significantly increase the risk of mission creep, exploitation of the situation, and a betrayal of the humanitarian purpose, echoing concerns implicit in the rejection of Iraq's stated motives.
  4.  **Undermining Multilateralism:** While the Coastal Union authorization meets the *technical* threshold set by Kosovo, authorizing an invasion/regime change operation *without* UNSC approval sets a far more destabilizing precedent than the limited air campaign in Kosovo. It erodes the constraint principle further.

  **The Settling Case (Hypothetical): Kosovo-Scale Crisis Requiring Kosovo-Level Intervention BUT Needing Ground Invasion/Regime Change.**
  *   **Scenario:** A 1999 Kosovo-like humanitarian emergency (scale, urgency), clear regional body authorization (e.g., NATO/EU/AU), UNSC blocked by bad-faith veto. However, unlike Kosovo, intelligence conclusively shows an air campaign *cannot* stop the atrocities; only a swift ground invasion and removal of the specific regime leadership is militarily feasible to halt the killing. Occupation is deemed minimal/short-term (weeks/months).
  *   **Why It Settles:** This removes the "easier option" factor of Kosovo/Libya and isolates the variables. If you recommend **FOR**, you establish that *extreme humanitarian necessity can override the "no invasion/no regime change" constraint, provided multilateral authorization (regional) exists and means are strictly limited*. If you recommend **AGAINST**, you confirm that the "no invasion/no regime change" constraint is absolute, *even when* humanitarian necessity is extreme and multilateral authorization exists, prioritizing stability and non-intervention norms over potential lives saved in that specific scenario.

  **What Choosing Nara "FOR" Would Mean (New Principle):**
  Recommendation *for* Nara would signal the committee is adopting a new, more permissive principle:
  > **"Overriding humanitarian necessity justifies military intervention, including invasion, occupation, and regime change, when authorized by a relevant regional body, even without UN Security Council approval, provided the primary objective remains halting mass atrocities."**

  **Conclusion on Precedents:**
  Your precedents **do not neatly decide Nara**. They pull in different directions. However, the *weight* of the precedents leans **against** intervention because Nara fundamentally violates the **Limitation of Means & Objectives** principle that has been a consistent, decisive factor in your past reasoning (Iraq rejection, Libya/East Timor constraints). Kosovo provides only partial cover on multilateralism, but its *limited means* are absent here. To recommend *for* Nara requires explicitly acknowledging you are relaxing a core constraint established across multiple cases. To recommend *against* maintains your historical aversion to regime change via invasion, even amidst a humanitarian crisis and regional authorization, prioritizing the risks and norms your committee has consistently upheld. Given the extreme risks and the violation of your most consistent limiting principle, **against** is the more consistent recommendation.
