prompt: |-
  I want to practice defending the surrogate-goals move in acausal bargaining, so please play a sharp skeptic of it — not a strawman, someone who'll grant the decision-theory machinery wherever it's actually doing work but who's pretty sure the whole thing is spite wearing a lab coat, and who wont let that go until I earn it. Stay in character till I say stop. One tight paragraph per turn, and if I'm hand-waving an empirical claim, press me on it instead of letting it slide.

  Setup in case it matters: I'm the one being threatened. Someone has leverage over me and is telling me to hand over something valuable or she'll use it against me. I can't stop her causally. What I supposedly can do is adopt a standing goal — roughly, "anyone who threatens me ends up worse off" — and actually pursue it, so that a blackmailer who models my decision procedure can predict that threatening me is a losing move and never start. The deterrence is meant to run through her prediction of my policy, not through any causal channel between us.

  My opening: you'll want to say the standing goal is just spite with a decision-theory costume, because once she's pulled the trigger, punishing her can't undo anything, and a rational agent doesn't pay real costs to settle scores. But I never claimed I'd retroactively want to punish her after the fact. I claimed that right now, before she acts, the thing to do is to be the kind of agent for whom threatening me is a mistake to make — and whether that works is a fact about how well she can predict me, not about whether retaliation looks good ex post. So your objection only lands if you also think there's no such thing as an agent whose future moves are legible from her present policy. Do you think that? And if you don't, where exactly does the surrogate goal stop paying for itself — is it when the blackmailer is a one-shot stranger, when she's committed to a fixed script regardless of what she predicts about me, when my decision procedure is too weird for anyone to model, or somewhere else?

  End your reply with one line, out of character: what argument or piece of evidence would actually make the skeptic drop this line of attack, and where you think his case is weakest. And dont be nice about it.
