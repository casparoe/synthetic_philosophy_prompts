answer: |-
  Here is my credence breakdown for the viability of expressivism solving Frege-Geach while retaining independent plausibility and classical logic, including your novel credence operator challenge. I assign **0.28 (28%) probability** overall.

  ### Core Sub-Questions & Probabilities
  1.  **Embedding is a *real* problem (not just an artifact of truth-conditional semantics):**  
      *   **Probability:** 0.85  
      *   **Reasoning:** The core issue is that attitude-expression is fundamentally *force-sensitive* (designed for assertion), while embeddings require *content* that persists regardless of force. This tension seems inherent to the expressivist starting point, not merely a quirk of truth-conditional frameworks. Most non-truth-conditional theories (e.g., pure imperativism) face analogous embedding problems.

  2.  **Quasi-realist "attitude-toward-an-attitude" assigns *genuine content* (not just gesturing):**  
      *   **Probability:** 0.30  
      *   **Reasoning:** This is the linchpin. Blackburn's project is ingenious, but it often feels like simulating propositional content using attitudes rather than genuinely *providing* it. Explaining the *systematicity* and *compositionality* of complex sentences (especially embeddings within embeddings, like your credence case) purely via higher-order attitudes remains deeply challenging. The "bespoke logic of attitudes" worry is persistent. Schroeder's relativized attitude approach (being *for*) improves but adds significant complexity that undermines independent plausibility.

  3.  **Deflationism grants truth-aptness *without* collapsing into descriptivism:**  
      *   **Probability:** 0.65  
      *   **Reasoning:** Deflationism *does* help significantly. If "true" is just a device for endorsement or semantic ascent, expressivists can say moral judgments are truth-apt without conceding they describe robust moral facts. However, the *work* of explaining inference (like modus ponens) and embedding *still needs to be done* at the level of attitude-expression logic. Deflationism avoids immediate collapse but doesn't solve the core Frege-Geach problem by itself.

  4.  **Expressivism can retain *classical logic* for moral sentences:**  
      *   **Probability:** 0.40  
      *   **Reasoning:** This is incredibly hard. Classical logic relies on truth-preservation defined over truth-conditional content. Expressivists need to replicate this structure using norms governing the consistency/commitment of non-cognitive attitudes. While sophisticated systems exist (e.g., Gibbard, Schroeder), they often require significant revisions or complexities (e.g., rejecting some classical inferences under negation, complex "plan-laden" contents) that make them feel non-classical or ad hoc. Preserving full classical validity is a major hurdle.

  5.  **The resulting package remains *recognizably expressivist* (not strange cognitivism):**  
      *   **Probability:** 0.60  
      *   **Reasoning:** If quasi-realism succeeds (a big 'if'), it *can* maintain the core expressivist thesis: the fundamental mental state expressed by a moral utterance is conative (desire-like, plan-laden, commitment-based), even if the *logical role* of the sentence mimics that of a belief with truth-conditional content. However, the theoretical machinery required (complex higher-order attitudes, deflationary truth, bespoke logic norms) pushes it towards a hybrid or "strange" view where the conative foundation feels increasingly vestigial.

  ### Combining the Probabilities
  *   The sub-questions are interdependent but not perfectly correlated. A multiplicative model is overly pessimistic. A geometric mean better reflects the "success requires all hurdles" nature.
  *   **Combined Probability (Geometric Mean):** (0.85 * 0.30 * 0.65 * 0.40 * 0.60)^(1/5) ≈ (0.03978)^(0.2) ≈ **0.50**
  *   **Adjustment for Interdependence & Your Novel Challenge:** The geometric mean of 0.50 needs downward adjustment because:
      1.  Success on (2) Quasi-Realist Content is heavily dependent on success on (4) Classical Logic and vice-versa – failure in one likely means failure in the other.
      2.  Your novel credence operator challenge (see below) directly targets the weak spot identified in (2) and (4), suggesting an even harder problem. This warrants a significant downward adjustment.
  *   **Final Adjusted Credence:** **0.28**

  **Sensitivity:** The final number is **most sensitive to Sub-Question 2 (Quasi-Realist Content - 0.30)**. This is the core mechanism proposed to solve Frege-Geach. If this fails (as I think it likely does), the expressivist project in its ambitious quasi-realist form collapses, regardless of progress on deflationism or avoiding collapse into cognitivism. The viability of classical logic (4) is a close second, tightly linked to 2.

  ### Your Novel Credence Operator Challenge
  *   **This is a *new and severe* problem, not just the old one in new clothes.** It directly exposes the tension in quasi-realism.
  *   **Why it's worse:** Credences explicitly quantify *over possibilities where a proposition is true or false*. Embedding "lying is wrong" under "70% likely" **demands** that "lying is wrong" has genuine truth-evaluable content *independent* of the attitude-expressing speech act – precisely what expressivism denies at its core. The quasi-realist must explain what cognitive or probabilistic attitude is expressed towards *what kind of content* by the credence claim. Saying it expresses a "70% strength pro-attitude towards being for blaming liars" is grotesquely implausible and severs the essential link between credence and truth-aptness. Your inference (1)-(3) *looks* like a simple probabilistic modus ponens, valid only if the embedded clauses have stable truth-conditional content.
  *   **Impact:** This challenge significantly **lowers** my credence. It starkly highlights why Sub-Question 2 (genuine content assignment) is so improbable. It pushes the expressivist towards either conceding robust truth-conditional content (collapsing into descriptivism) or offering an utterly implausible account of probabilistic moral language. **Adjustment Reason:** This challenge directly reduces my probability for Sub-Question 2 (Quasi-Realist Content) and Sub-Question 4 (Classical Logic) even further than my initial estimates. Hence the downward adjustment from the geometric mean of 0.50 to **0.28**.

  ### The Gap (Seminar Leader 0.85 vs. You 0.3)
  *   **The gap most likely lives in Sub-Question 2 (Quasi-Realist Content).**
  *   **Why:** Your seminar leader likely finds the quasi-realist project of simulating propositional content via higher-order attitudes successful or sufficient (assigning a high probability, perhaps 0.8+ to Q2). They see the resulting logic as adequately classical and the view as still expressivist. You (and I) find the quasi-realist content simulation unconvincing and gesture-like (low probability on Q2, ~0.3), seeing the logic as bespoke and the inference problems (especially novel ones like credence) as unresolved. Your leader may also assign higher probabilities to Deflationism helping (Q3) and Logic preservation (Q4).

  ### What Would Move My Number the Most?
  *   **The single argument:** A compelling, workable, and independently plausible **account of the compositional semantics of embedded moral sentences** – *especially embeddings under epistemic operators like knowledge, belief, and crucially, credence* – that **does not tacitly rely on assigning truth conditions** but genuinely derives the semantic properties (entailment relations, probability assessments) from the expression of conative attitudes and norms governing their consistency. Showing how "70% likely that lying is wrong" expresses a conative state *and* licenses your probabilistic MP inference *without* smuggling in truth-conditional content would be revolutionary. Currently, expressivist accounts feel like they *stipulate* the logic rather than *derive* it compositionally from attitude expression. Solving this for credences would likely bump Q2 to 0.6+ and Q4 to 0.6+, dragging my overall credence up to around 0.6.

  ### Who is More Correct?
  *   **You (the student) are more correct.** Your gut feeling (0.3) and focus on the core tension (especially highlighted by your novel challenge) are closer to the mark. The seminar leader's 0.85 overestimates the success of quasi-realism in genuinely solving the content problem (Q2) and preserving classical logic (Q4), particularly in the face of complex embeddings like credence. The expressivist project is brilliant and resilient, but the Frege-Geach problem, especially in its more sophisticated forms (like embedding under epistemic modals and credences), remains a fundamental, likely insurmountable, challenge for its core non-cognitivist thesis. **My 0.28 aligns with your 0.3.** The burden of proof remains firmly on the expressivist to show their semantics isn't just a very clever simulation of truth-conditional content.
