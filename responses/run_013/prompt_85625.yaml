prompt: |-
  I'm in a third-year metaethics seminar and we've spent the last two weeks on the Frege–Geach problem, and my position paper is due Friday. I want one thing from you: a number, with the reasoning that produces it. Don't tell me to go read anyone (I can't get to the library and you can't browse either), just decide.

  Here's the claim I want your credence in: there is a version of expressivism — moral sentences express desire-like attitudes rather than beliefs, and their meanings are fixed by those attitudes rather than by truth conditions — that (a) is independently plausible as an account of what moral thought and talk actually is, and (b) gives an adequate account of unasserted moral sentences, so that 'if lying is wrong then telling my brother to lie is wrong' together with 'lying is wrong' really does entail 'telling my brother to lie is wrong' in the ordinary sense of entailment, and not by way of a bespoke 'logic of attitudes' that quietly redefines validity.

  Give me your credence in that, decomposed into the sub-questions it rests on, a rough probability for each, how they combine, and which one your final number is most sensitive to. The ones I'd want at least: whether embedding is a real problem for every expressivism or just an artifact of assuming meaning = truth conditions; whether the attitude-toward-an-attitude (quasi-realist) move genuinely assigns contents to complex sentences or just gestures at doing so; whether deflationism about truth lets the expressivist have truth-apt moral sentences for free or collapses her into a descriptivist; whether she can keep classical logic; and whether the surviving package is still recognisably expressivism rather than a strange cognitivism.

  Now the part I actually care about, because I made it up and havent seen it anywhere. Take 'It's about 70% likely that lying is wrong.' Credences attach to things that can be true or false; that's what they're for. But nothing there is asserted — 'lying is wrong' is under an operator, so by the expressivist's own lights it isn't doing its attitude-expressing job. So what attitude is '70% likely that...' supposed to be expressing? Then consider:

  (1) It's about 70% likely that lying is wrong.
  (2) If lying is wrong, telling my brother to lie is wrong.
  (3) So it's at least 70% likely that telling my brother to lie is wrong.

  I'm certain of (2), so this looks valid to me, and it's the Frege–Geach shape again with a credence operator where the conditional was. Is that a new problem or the old one in new clothes? Should it push the number down? My gut says it definately makes things worse, since credences are so obviously about truth-evaluable content, but decide rather than telling me it depends on the version.

  For calibration: my seminar leader reckons this is basically solved and is at about 0.85; I'm at 0.3. Tell me which of your sub-questions that gap most likely lives in, and what single argument would move your own number the most. Be committed — if you think one of us is just wrong, say which and why.
