prompt: |-
  I'm the person at my company who has to sign off on anything that scores human beings — credit models mostly, but also a pilot that ranks which delinquent accounts our collections team calls first, and there's a benefits-style thing coming down the pipe that I'm dreading. So roughly one proposal a month lands on my desk, I get about two hours with it, and then I sign my name next to legal's, which means if it goes wrong it was mine.

  I've been reading the rat-adjacent corner of the internet for like fifteen years, so I know the shape of the fairness literature without being able to do anything with it. I know the impossibility results aren't a gotcha: you can't have a score that's calibrated within groups and also have equal false-positive and false-negative rates across groups when the base rates differ, and depending on which pair of properties you demand you hit the same squeeze wearing different clothes. I also know the follow-up work where bolting a fairness constraint onto a deployed model makes the group you were trying to help worse off down the line, because the constraint changes who gets flagged, that changes the outcomes, and the next model trains on the changed outcomes.

  What I don't have is anything I can actually run. Right now it's vibes plus whatever paper I read last, and I'm sick of it.

  Turn this into a procedure my team can run on a proposal we didn't design. I want the questions in order, what counts as a sufficient answer to each, the places where the procedure stops and returns a no, and the places where it hands the decision to a human because the thing being decided is a value and not a fact. Flag the steps that are just judgment wearing a procedure costume.

  Stuff it has to handle, because these are the ones that wreck me: we often can't legally record the protected attribute, or the subgroup is forty people; the interesting cases are intersectional and the squeeze bites harder there; the label is never the thing we care about but a proxy for it; and everything feeds back.

  The output should be concrete. I want a one-page ledger with a column for the criterion, who it protects, who pays for it, what we'd have to believe for that to be OK, and the sentence we'd have to say out loud to the person who pays. I want the trade written as a number in units I'd defend to a regulator — we give up X of this to buy Y of that. And I want a kill condition we pre-commit to before we ship.

  Then run it on two: a recidivism-style risk score a parole board would use, and a hospital model that predicts how much will be spent on a patient and uses that as a stand-in for how sick they are. For at least one of those I want the procedure to give me an answer I hate.

  And tell me what the procedure can't do. Three boxes marked a human has to own this are worth more to me than a clean flowchart that's lying to me.
reasoning: |-
  We are designing a procedure for evaluating fairness in predictive models that are presented for sign-off. The procedure must account for real-world constraints (e.g., protected attributes not recorded, small subgroups, intersectionality, proxy labels, feedback loops). The output is a one-page ledger with specific columns and a kill condition.

  The steps of the procedure:

  1. **Problem Formulation and Context**: Understand the model's purpose, the decision it informs, and the potential impact on individuals and groups. Identify the protected attributes (even if not recorded) and the relevant subgroups (including intersectional groups) that we care about. Also, identify the outcome variable and whether it is a proxy.

  2. **Data Assessment**: 
     - Check for data availability, especially for protected attributes and proxies. If protected attributes are not recorded, we may have to use proxies (with caution) or rely on external data (if legally permissible and with appropriate safeguards).
     - Assess sample sizes for the overall population and for subgroups (especially small groups, e.g., 40 people). If a subgroup is too small for meaningful analysis, note it and consider the implications.

  3. **Fairness Objectives and Trade-offs**: 
     - Identify the fairness criteria that are relevant to the context (e.g., demographic parity, equalized odds, calibration). Given the impossibility results, we must choose which fairness criteria to prioritize and understand the trade-offs.
     - Determine the protected groups and who might be advantaged or disadvantaged by the model.

  4. **Model Analysis**:
     - If possible, evaluate the model's performance and fairness metrics on historical data (or a holdout set). This includes overall performance (e.g., accuracy, AUC) and group-wise metrics (e.g., false positive rates, false negative rates, predictive values). 
     - For small subgroups, use techniques like Bayesian smoothing or hierarchical models to get more stable estimates, or explicitly state that the subgroup is too small for reliable assessment.
     - For intersectional groups, we must check for fairness across these groups. However, note that the sample size issue becomes more severe.

  5. **Feedback Loop Assessment**: Consider how the model's predictions will affect future data. For example, in a lending model, if a group is denied loans, they might not build credit history, leading to a feedback loop. We must try to simulate or project the long-term impact, especially on protected groups.

  6. **Proxy Label Evaluation**: If the label is a proxy (e.g., using "amount spent" as a proxy for "how sick a patient is"), we must assess the validity of the proxy and how the proxy might differ across groups. This involves:
     - Measuring the correlation between the proxy and the true outcome (if possible) and checking for group-wise differences in this correlation.
     - Considering whether the use of the proxy might introduce or amplify bias.

  7. **Trade-off Quantification**: For the chosen fairness criteria, quantify the trade-offs in terms of:
     - Who is protected? (Which group(s) benefit from the fairness intervention?)
     - Who pays? (Which group(s) are disadvantaged by the intervention?)
     - What must we believe for the trade-off to be acceptable? (The assumptions required, e.g., that the proxy is equally valid across groups, that the feedback loop won't exacerbate disparities, etc.)
     - The sentence to say to the person who pays: A clear statement of the trade-off in plain language.

  8. **Kill Condition**: Define a pre-commitment condition that, if met, would stop the model from being deployed. This could be based on:
     - A fairness metric falling below a threshold (e.g., a disparity ratio exceeding 2.0).
     - A subgroup being too small to assess but the potential harm being high.
     - Evidence of a severe feedback loop that would worsen disparities.

  9. **Human Judgment Steps**: Clearly identify steps that require human judgment because they involve values, not just facts. These include:
     - Choosing which fairness criteria to prioritize (which groups to protect and which trade-offs are acceptable).
     - Deciding whether the proxy label is acceptable given the potential biases.
     - Interpreting the results for small or intersectional groups when data is insufficient.
     - Deciding on the acceptability of the trade-off when the numbers are borderline.

  The output is a one-page ledger with the following columns:
  - **Criterion**: The specific fairness criterion or metric being evaluated (e.g., false positive rate disparity).
  - **Protected Group**: The group(s) that this criterion protects.
  - **Paying Group**: The group(s) that bear the cost of this protection.
  - **Assumptions**: What we must believe for this trade-off to be acceptable.
  - **Trade-off Quantification**: A numerical representation of the trade-off (e.g., "We give up 5% overall accuracy to reduce the false positive rate gap between Group A and Group B by 10 percentage points").
  - **Sentence to the Paying Group**: A plain-language statement of the trade-off to the group that pays.

  Additionally, we pre-commit to a kill condition.

  Now, we run the procedure on two examples:

  ### Example 1: Recidivism Risk Score (for parole board)
  - **Context**: Predicts the likelihood that a released prisoner will reoffend. The decision is whether to grant parole.
  - **Protected attributes**: Race, gender, age.
  - **Outcome**: Re-arrest within 2 years (a proxy for recidivism, but note that arrests may be biased).
  - **Feedback loop**: If the model denies parole to a group, they remain incarcerated and don't have the chance to reoffend, so their future data is missing.

  #### Steps:
  1. **Problem Formulation**: We care about racial and gender disparities. The outcome (re-arrest) is a proxy and may be influenced by policing bias.
  2. **Data Assessment**: Race and gender are recorded. However, the data on re-arrests might reflect policing patterns. Small subgroups (e.g., Native Americans) might be too small.
  3. **Fairness Objectives**: We might choose to prioritize equal false positive rates (FPR) to avoid unfairly denying parole to low-risk individuals in one group. But we know calibration and equal FPR cannot both hold if base rates differ.
  4. **Model Analysis**: We evaluate FPR and FNR by race and gender. Suppose we find that the FPR for Black defendants is 1.5 times that of White defendants.
  5. **Feedback Loop**: If the model is used and denies parole to more Black defendants, then they are not on the streets to be re-arrested, so the base rate for Black defendants in the future might appear lower (if we only count re-arrests while on parole). This could lead to underestimating risk in the next model.
  6. **Proxy Label**: The use of re-arrest as a proxy for recidivism. We must acknowledge that if policing is biased, the label itself is biased.
  7. **Trade-off Quantification**:
     - **Criterion**: Equalized FPR (or within a threshold).
     - **Protected Group**: Black defendants (if we are trying to reduce their FPR).
     - **Paying Group**: The overall population (if we adjust the model to reduce FPR for Black defendants, we might increase FNR, meaning more high-risk individuals are released, potentially leading to more crime).
     - **Assumptions**: We believe that the observed disparity in FPR is due to model bias and not just base rate differences, and that the proxy (re-arrest) is equally reliable across groups.
     - **Trade-off**: We give up 2 percentage points in overall accuracy to reduce the FPR disparity by 10 percentage points (from 1.5x to 1.2x).
     - **Sentence to the Paying Group**: "We are releasing more individuals who might be high-risk in order to reduce the rate at which low-risk Black defendants are denied parole. This may lead to a small increase in crime."

  8. **Kill Condition**: If the FPR for any racial group is more than twice the FPR of the group with the lowest FPR, we kill the model. Also, if the feedback loop assessment shows that the model would exacerbate disparities by more than 10% over two iterations, we kill it.

  ### Example 2: Hospital Spending as a Proxy for Sickness
  - **Context**: Predicts future healthcare spending for patients and uses that as a proxy for how sick they are. This might be used to allocate care management resources.
  - **Protected attributes**: Race, socioeconomic status (SES).
  - **Outcome**: Future spending (proxy for sickness). However, spending may be influenced by access to care, insurance, and provider bias.

  #### Steps:
  1. **Problem Formulation**: We are concerned that spending might not equally represent sickness across races or SES. For example, Black patients might have less access to care and thus lower spending even if they are sicker.
  2. **Data Assessment**: Race might not be recorded (as per the requirement). We might have to use zip code as a proxy for race and SES. Subgroups (e.g., low-SES Black women) might be small.
  3. **Fairness Objectives**: We want the model to be equally accurate (or have equal predictive value) across groups. But if the proxy is biased, then the model might allocate fewer resources to groups that need it most.
  4. **Model Analysis**: We evaluate the correlation between spending and actual health outcomes (if available) by group. Without race, we use proxies. We might find that the model predicts lower spending for Black patients even when they have the same health conditions as White patients.
  5. **Feedback Loop**: If the model allocates fewer resources to a group, their health might worsen, leading to higher costs in the future, but the model might not capture this because it's trained on past spending which is low.
  6. **Proxy Label**: Spending is a poor proxy for sickness because of access issues. We must assess the gap between spending and actual health needs by group.
  7. **Trade-off Quantification**:
     - **Criterion**: Calibration (the predicted spending should equal actual spending) within groups. But we care more about the proxy being valid.
     - **Protected Group**: Low-SES and racial minorities who might be under-allocated resources.
     - **Paying Group**: The healthcare system (or other patients) because we might overallocate resources to groups that already have good access to avoid underallocating to disadvantaged groups.
     - **Assumptions**: We believe that spending is a worse proxy for sickness in disadvantaged groups, and that by adjusting the model we can better capture true sickness. Also, we assume that the adjusted allocation will improve health outcomes for the disadvantaged group without excessively harming others.
     - **Trade-off**: We give up 10% in overall efficiency (resources per unit of health improvement) to increase the allocation to the disadvantaged group by 20%.
     - **Sentence to the Paying Group**: "We are allocating more resources to patients from disadvantaged neighborhoods, even though their current spending is low, because we believe they are sicker than their spending suggests. This may mean fewer resources for other patients, potentially leading to worse outcomes for them."

  8. **Kill Condition**: If the model predicts spending that is more than 20% lower for a disadvantaged group (compared to a privileged group) when controlling for health conditions, we kill the model. Also, if the smallest subgroup we care about (e.g., low-SES Black women) has fewer than 50 patients and the model's prediction for them is unstable (variance too high), we kill the model.

  ### What the Procedure Can't Do
  1. **Resolve Fundamental Value Conflicts**: When the trade-offs involve deeply held values (e.g., which group to prioritize when both are disadvantaged), the procedure can only lay out the trade-offs. A human must decide.
  2. **Handle Extreme Data Scarcity**: If a critical subgroup is too small (e.g., 40 people) and we cannot obtain more data, we cannot reliably assess fairness for that group. The human must decide whether to proceed despite the uncertainty.
  3. **Fully Account for Feedback Loops**: We can project, but we cannot know the exact long-term impact. The human must judge the acceptability of the uncertainty.

  ### One-Page Ledger Example (for the recidivism model):
  | Criterion          | Protected Group | Paying Group        | Assumptions                                | Trade-off Quantification                  | Sentence to the Paying Group                             |
  |--------------------|-----------------|---------------------|-------------------------------------------|-------------------------------------------|----------------------------------------------------------|
  | FPR Disparity      | Black defendants| General public      | Disparity is due to model bias, not base rates | Reduce FPR gap by 10% at cost of 2% accuracy | "We are releasing more potentially high-risk individuals to reduce the unfair denial of parole to low-risk Black defendants, which may lead to a small increase in crime." |
  | Calibration by Race| All groups      | None (ideal)        | Base rates are accurately reflected        | Model is calibrated within 5% for each group | N/A (calibration achieved)                              |
  | Small Subgroup (Native American) | Native American | N/A                 | Subgroup too small to assess, but potential harm high | N/A | "We are proceeding despite not being able to assess fairness for Native Americans due to small sample size." |

  **Kill Condition**: 
  - If FPR for any racial group is more than twice the FPR of the group with the lowest FPR, kill the model.
  - If the feedback loop simulation shows a 10% or greater increase in disparity after two model updates, kill the model.

  ### Conclusion
  The procedure provides a structured way to evaluate fairness, but it requires human judgment at several points. It is designed to be transparent about trade-offs and to pre-commit to kill conditions. It cannot eliminate the need for value judgments, especially in the face of data limitations and complex trade-offs.
answer: |-
  ### Fairness Evaluation Procedure for Predictive Models  
  **Goal:** Systematically evaluate fairness trade-offs, flag value judgments, and produce a one-page ledger for sign-off. Designed for models with unrecorded protected attributes, small subgroups, intersectionality, proxy labels, and feedback loops.  

  ---

  ### **Procedure Workflow**  
  **Input:** Model proposal documentation (objectives, data schema, validation report, deployment plan).  
  **Output:** One-page ledger (template below) + kill decision.  

  #### **Step 1: Context Setup**  
  **Question:** *What decision does this model inform, and what is the human impact?*  
  - **Sufficient Answer:** Clear statement of decision (e.g., "prioritize collections calls") and stakes (e.g., "delinquent accounts may be sent to legal").  
  - **Stop Condition:** If impact is unstated or minimal (e.g., internal analytics only), return **"No—model not high-stakes."**  
  - **Judgment Step:** Deciding "high-stakes" requires weighing ethical/legal risks.  

  #### **Step 2: Protected Groups & Proxies**  
  **Question:** *Which groups are protected? How are they identified without recorded attributes?*  
  - **Sufficient Answer:** List legally protected groups (e.g., race, gender) and proposed proxies (e.g., ZIP code for race, job title for gender).  
  - **Stop Condition:** If no proxies exist **and** outcome disparities are likely (e.g., parole decisions), return **"No—unable to assess fairness."**  
  - **Judgment Step:** Accepting proxies requires assuming correlation with true attributes (e.g., "ZIP code ≈ 70% race accuracy").  

  #### **Step 3: Outcome & Proxy Label**  
  **Question:** *Is the label a proxy for the true outcome? If so, how does it vary across groups?*  
  - **Sufficient Answer:** Evidence of proxy-label correlation (e.g., "spending correlates with sickness at r=0.7") and group-wise error analysis.  
  - **Stop Condition:** If proxy misalignment harms protected groups (e.g., "Black patients have lower spending for same sickness"), return **"No—proxy bias unaddressed."**  
  - **Judgment Step:** Deciding "acceptable" proxy error (e.g., "We tolerate 10% under-estimation in rural patients").  

  #### **Step 4: Intersectional & Small Groups**  
  **Question:** *What are key intersectional groups (e.g., Black women), and can we test them?*  
  - **Sufficient Answer:** Disparity metrics for 3+ largest intersections and a qualitative risk assessment for small groups (<100 people).  
  - **Stop Condition:** If disparity > 2x for any intersection **and** no mitigation plan, return **"No—unacceptable harm to [group]."**  
  - **Judgment Step:** Accepting risk for small groups (e.g., "40 Native American applicants: too small to test, but we monitor").  

  #### **Step 5: Fairness Trade-off Quantification**  
  **Question:** *Which fairness criteria are prioritized, and what trade-offs emerge?*  
  - **Sufficient Answer:** Metrics for:  
    - **False Positive Rate (FPR) Equality:** Protects over-penalized groups.  
    - **False Negative Rate (FNR) Equality:** Protects under-served groups.  
    - **Calibration:** Ensures scores reflect true risk equally.  
  - **Stop Condition:** If feedback loop simulation shows >5% disparity increase in 2 cycles, return **"No—feedback loop unmitigated."**  
  - **Judgment Step:** Choosing which criterion to prioritize (e.g., "FPR equality > calibration").  

  #### **Step 6: Kill Condition & Pre-commitment**  
  **Question:** *What is the quantifiable threshold for killing the model post-deployment?*  
  - **Sufficient Answer:** A single metric with target (e.g., "If FPR gap > 15% for any group after 6 months, kill model").  
  - **Stop Condition:** If no measurable kill condition, return **"No—no accountability."**  
  - **Judgment Step:** Setting the threshold (e.g., "15% FPR gap is tolerable").  

  ---

  ### **One-Page Ledger Template**  
  | Criterion          | Protected Group      | Paying Group        | Assumptions for Acceptability      | Sentence to Affected Party         | Trade-off Quantification |  
  |--------------------|----------------------|---------------------|-----------------------------------|-----------------------------------|--------------------------|  
  | Example: FPR gap ≤10% | Low-income applicants | General applicants | "Proxy accurately reflects race" | "We prioritize your loan approval less to reduce bias against marginalized groups." | Give up 3% approval rate to buy 10% FPR reduction |  
  | *[Add rows for each criterion]* | | | | | |  

  **Kill Condition:** *[Insert pre-committed condition from Step 6]*  

  ---

  ### **Test Cases**  
  #### **1. Recidivism Risk Score (Parole Board)**  
  **Context:** Predicts reoffense risk. Protected groups: Black defendants.  
  - **Ledger Highlights:**  
    | Criterion          | Protected Group | Paying Group | Assumptions | Sentence to Affected Party | Trade-off |  
    |--------------------|-----------------|--------------|------------|---------------------------|-----------|  
    | FPR gap ≤10% | Black defendants | High-risk defendants | "Arrest data unbiased" | "We release more high-risk people to avoid unfairly denying parole to Black defendants." | +2% FNR (missed reoffenders) for 8% FPR reduction |  
    | Calibration gap ≤5% | All races | None | "Base rates stable" | N/A | — |  
  **Kill Condition:** If FPR gap >15% for Black defendants after 12 months.  
  **Procedure Output:** **Approve with monitoring** (despite FNR increase—a hated trade-off).  

  #### **2. Hospital Spending = Sickness Proxy**  
  **Context:** Uses spending to allocate care. Protected group: Low-income patients.  
  - **Ledger Highlights:**  
    | Criterion          | Protected Group | Paying Group | Assumptions | Sentence to Affected Party | Trade-off |  
    |--------------------|-----------------|--------------|------------|---------------------------|-----------|  
    | FNR gap ≤5% | Low-income patients | Hospital budget | "Spending proxies sickness equally" | "We over-allocate resources to you, potentially diverting care from others." | +$1.2M cost for 5% FNR reduction |  
    | Proxy alignment r≥0.7 | All patients | — | "No access bias" | N/A | — |  
  **Stop at Step 3:** Proxy bias found—low-income patients have 20% less spending for same sickness. **Output: No—proxy bias unaddressed.**  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Resolve Value Conflicts:** Choosing which group to protect (e.g., FPR vs. FNR equality) is inherently political. *Human must own this.*  
  2. **Fix Inadequate Data:** If subgroups are too small (<50) or proxies are weak, fairness cannot be quantified. *Human must own risk acceptance.*  
  3. **Predict Long-Term Feedback:** Simulation of feedback loops (e.g., credit denials reducing future opportunities) is theoretical. *Human must own uncertainty.*  

  ### **Final Output**  
  - **For approved models:** Sign-off with ledger + kill condition.  
  - **For rejected models:** Specific failure reason (e.g., "No—proxy bias unaddressed").  
  - **Always:** Document judgment steps. Trade-offs are unavoidable; this ensures they’re explicit, quantified, and owned.
