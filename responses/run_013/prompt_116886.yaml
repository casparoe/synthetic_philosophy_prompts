  ## The Harmonist: Common Knowledge

  **Dear Common Knowledge,**
  My neighborhood has four-way stops at every minor intersection. It’s maddening! Shouldn’t the first car to arrive proceed? But here, everyone seems to wait for elaborate, unspoken cues – a wave, a flash of lights, sometimes just staring each other down until someone inches forward. It wastes so much time and feels chaotic. How can we get everyone on the same page?
  — Stuck in St. Louis

  **Dear Stuck,**
  You’ve identified a classic coordination problem! The goal is safe, efficient passage, but multiple possible regularities could achieve it: first-come-first-served, yielding to the right, or even the complex signalling you observe. The current local pattern prevails because it’s become salient through precedent. Each driver conforms because they expect others to conform to *this specific signalling dance*, and deviating unilaterally – simply going when you arrive first – carries a high cost: potential collision or at least confusion and horn-honking, as others’ expectations are violated. The perceived chaos stems from the lack of a single, universally salient cue within your immediate population of drivers. The solution isn’t persuasion, but a shift towards a new, clearer precedent. Perhaps consistently being the driver who goes strictly on arrival order (when safe) could, over time, establish its own salience if enough others find it predictable and start expecting it. But remember, you cannot establish it alone; you can only offer a new potential focal point and see if coordination shifts around it. The cost of unilateral deviation remains high until that shift potentially occurs.

  **Dear Common Knowledge,**
  For years, our friend group had a lovely convention: for birthdays, we’d each contribute $25 towards one meaningful group gift chosen by the birthday person’s closest friend. It felt special. Lately, though, several members have started bringing individual, smaller gifts instead – often just cards. It feels disjointed and less thoughtful. Are they breaking a promise? Can we insist they return to the old way?
  — Disappointed in Denver

  **Dear Disappointed,**
  Conventions persist only as long as the expectations of mutual conformity hold and the perceived costs of deviation remain manageable for the population. Your gift-giving pattern was a regularity solving the coordination problem of demonstrating regard without overwhelming expense or duplication. Its stability depended on everyone expecting everyone else to contribute to the single gift. The shift you observe indicates that expectation is fragmenting. Some members likely perceived a lower personal cost in deviating (e.g., less effort, more individual expression) and found the salience of bringing *something* (a card, a small item) sufficient, perhaps triggered by one or two initial precedents. This deviation then altered the expectations of others – why contribute $25 if others are bringing cards? The old convention is fading precisely because unilateral deviation *isn’t* going badly for the deviators within this changing expectation landscape. There is no rule to enforce or promise broken; the pattern was sustained by mutual expectation, not obligation. You cannot compel conformity. You *can* attempt to re-establish the old pattern by consistently providing the precedent yourself (organizing the group gift) and clearly signalling the expectation. But its revival depends entirely on whether others find that precedent salient enough to follow, restoring the expectation of mutual conformity and raising the perceived cost of individual gifting again. If not, a new convention is emerging.

  **Dear Common Knowledge,**
  I detest the convention at large weddings where the couple’s parents and grandparents get the prime seats at the front. My grandparents are unpleasant, and my partner’s are deceased. I want our closest friends, who’ve supported us, to have those seats instead. The wedding planner insists it’s “just not done.” Can I simply seat our friends there? Do I need to announce the change?
  — Baffled in Boston

  **Dear Baffled,**
  Seating arrangements are indeed often governed by conventions solving the coordination problem of assigning status and avoiding conflict in a crowded space. The current regularity (parents/grandparents front) possesses salience through long precedent. The wedding planner’s objection reflects the strength of the common knowledge surrounding this expectation: deviating carries a social cost (confusion, perceived slight, gossip) because others *expect* to see elders there. Can you change it? You can certainly *act* as a precedent-setter. Place your friends in those seats. However, you cannot establish a new convention alone. The convention changes only if:
  1. Your action is sufficiently salient (people notice and understand the deviation).
  2. A sufficient portion of the population (your guests) finds this new precedent a useful focal point for their own expectations ("Ah, *this* is where the important people sit at *this* wedding").
  3. They then conform to *that* expectation, making deviation (e.g., someone trying to seat grandparents there anyway) costly for *them*.
  Announcing it might increase salience but also highlights the deviation, potentially heightening the initial cost (it signals you know you’re breaking a prevailing expectation). There is no authority to grant permission. You can only provide the precedent and observe whether coordination shifts around it. If it does, the convention changes for your event. If not, you may bear the costs of confusion or perceived eccentricity. The old convention dies only when it ceases to be the expected solution for the majority.

  **Dear Common Knowledge,**
  My partner of ten years left me abruptly for someone else. We had common knowledge about our commitment: shared finances, plans for retirement, mutual declarations of love. They offered no explanation, just said they were “unhappy.” They’ve moved in with the new person already. This feels like a profound betrayal of everything we built. How do I process this violation of our deepest understanding?
  — Hurt in Houston

  **Dear Hurt,**
  You describe a situation where a long-standing pattern of mutual expectations – a complex set of coordinated behaviours around shared life, finances, and affection – has been unilaterally deviated from. The stability of such intimate coordination relies heavily on each party consistently meeting the expectations of the other, based on the precedent of past behaviour creating common knowledge (“this is how we are together”). The cost of unilateral deviation within such a tightly coupled system is, understandably, immense for the non-deviating party, as their entire structure of expectations collapses. Your partner perceived a lower cost (or higher anticipated benefit) in deviating from the established pattern than in maintaining it, despite the common knowledge of your mutual commitments. Their deviation became the new salient precedent for their own behaviour. The intense distress you experience is the direct result of this sudden, unilateral shift shattering the intricate web of reciprocal expectations that constituted your shared life coordination. Processing involves recognising that the old pattern of mutual conformity is definitively broken. The high costs you bear stem directly from the abrupt failure of the coordination equilibrium you inhabited. Rebuilding requires establishing new, stable patterns of expectations and behaviour, likely with different partners or structures, where mutual conformity offers lower costs and greater benefits for all involved. The salience of their new partnership is now the precedent guiding their actions, regardless of the significant coordination costs their deviation imposed upon you.
