answer: |-
  ### Examination Question  
  **(Total: 25 marks; Time: 50 minutes)**  

  A five-member committee must decide whether to promote a candidate (proposition C) based on two criteria: excellent teaching (A) and excellent research (B). The charter stipulates that promotion is justified if and only if both criteria are met: formally, \(C \leftrightarrow (A \land B)\). The members’ votes are individually consistent with this rule but collectively yield an inconsistency:  

  | Member | A (Teaching) | B (Research) | C (Promote?) |  
  |--------|--------------|--------------|--------------|  
  | 1      | Yes          | Yes          | Yes          |  
  | 2      | Yes          | Yes          | Yes          |  
  | 3      | Yes          | No           | No           |  
  | 4      | No           | Yes          | No           |  
  | 5      | No           | No           | No           |  

  Additionally, the charter requires that the committee’s verdict on C must be "answerable to the reasons that carried the day," meaning it must be logically derived from the collective judgments on A and B, not from a direct vote on C.  

  **(a)** Using arithmetic (vote counts), demonstrate how premise-based aggregation (PBA) and conclusion-based aggregation (CBA) deliver opposite verdicts on C. Explain why the collective outcome is inconsistent under CBA but consistent under PBA. (5 marks)  

  **(b)** Explain what PBA and CBA each *preserve* and *sacrifice* in terms of three desiderata: (i) collective consistency and logical closure; (ii) responsiveness to majority judgments on all propositions; and (iii) fairness (anonymity across members and neutrality across propositions). Frame this as a conflict among these values. (8 marks)  

  **(c)** Assess the charter’s "reasons-tracking clause" (requiring C to be derived from A and B). Does it resolve the dilemma or merely legislate one horn of it? What could proponents of the *losing* aggregation method fairly argue in response? Consider whether the clause ensures a verdict that aligns with any member’s full set of judgments. (7 marks)  

  **(d)** Is the discursive dilemma a defect of majority voting *as such*, or is it a consequence of the logical connection between A, B, and C? Describe what would happen if A, B, and C were logically independent propositions, and explain why the dilemma disappears in that scenario. (5 marks)  

  ---

  ### Model Answer  
  **(Approx. 700 words)**  

  The discursive dilemma arises when individually rational judgments, aggregated by majority rule, produce collective inconsistency on logically connected propositions. This committee’s case illustrates the tension between premise-based aggregation (PBA) and conclusion-based aggregation (CBA), exacerbated by a charter clause prioritizing reason-based deliberation.  

  **(a)** Under PBA, the committee aggregates votes on the premises (A and B) and derives C from the majority outcome. For A, three members vote "yes" (1, 2, 3) and two "no" (4, 5), so A is collectively approved. For B, three vote "yes" (1, 2, 4) and two "no" (3, 5), so B is approved. Since the charter requires \(C \leftrightarrow (A \land B)\), collective approval of both A and B necessitates C: promote the candidate. Under CBA, votes on C are aggregated directly: two "yes" (1, 2) and three "no" (3, 4, 5), so C is rejected. Thus, PBA endorses promotion (C yes), while CBA rejects it (C no). Crucially, CBA produces inconsistency: if we retroactively apply majority rule to A and B (yielding A yes and B yes), the collective judgments {A yes, B yes, C no} violate \(C \leftrightarrow (A \land B)\). PBA avoids this by deriving C from the premises, ensuring consistency with the charter.  

  **(b)** PBA and CBA prioritize conflicting desiderata. PBA preserves *collective consistency and logical closure* by deriving C from A and B, ensuring the outcome adheres to the charter’s rule. However, it sacrifices *responsiveness to majority judgments* on C: a 3–2 majority opposes promotion, yet PBA overrides this. It also sacrifices *fairness* in the form of neutrality across propositions, as it privileges premises (A and B) over the conclusion (C) in aggregation. CBA, conversely, preserves responsiveness and neutrality: it applies majority rule equally to C, respecting the 3–2 vote against promotion, and treats all propositions symmetrically. Yet it sacrifices consistency: the collective set {A yes, B yes, C no} is logically incoherent. It also fails to provide "reasons" for the verdict, as it yields no collective judgments on A and B. The conflict is thus between (i) rationality (PBA) and (ii)–(iii) majoritarian fairness (CBA). No method satisfies all three desiderata simultaneously.  

  **(c)** The reasons-tracking clause resolves the dilemma by mandating PBA, ensuring consistency and reason-based accountability. However, it merely *legislates* one horn of the dilemma without solving the underlying conflict. Proponents of CBA could fairly argue that this clause:  
  - Overrides the majority will on C (3–2 against promotion), undermining democratic responsiveness.  
  - Produces a verdict (promote) that no member’s *full* judgment set supports: Members 1 and 2 support promotion but are outnumbered 3–2; members 3–5 all oppose promotion. The collective outcome {A yes, B yes, C yes} matches only members 1 and 2’s views, but these members constitute a minority. Worse, the *reasons* for promotion (A and B approved) lack full endorsement: A is rejected by members 4–5 (40%), and B by member 3 (20%). Thus, the clause imposes a verdict that a majority opposes and that fractures the committee’s deliberative cohesion.  

  **(d)** The dilemma is *not* a defect of majority voting per se but a consequence of the logical connection between propositions. If A, B, and C were independent (e.g., no charter rule linking them), majority voting would yield consistent outcomes. Here, A would pass 3–2 (yes), B 3–2 (yes), and C 2–3 (no). The collective set {A yes, B yes, C no} involves no inconsistency because no rule binds them. The dilemma arises only because \(C \leftrightarrow (A \land B)\) creates a logical constraint: when majority rule on individual propositions conflicts with the group’s ability to satisfy that constraint, inconsistency emerges. Thus, the root issue is agenda-setting—specifically, whether the verdict is tied to reasons—not majority voting itself.  

  In sum, the discursive dilemma exposes a trade-off between collective rationality and majoritarian fairness in structured agendas. The reasons-tracking clause favors rationality but at the cost of marginalizing majority views on the conclusion. This tension is inherent to logically connected propositions and cannot be blamed on aggregation mechanics alone.  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  

  #### **Part (a) (5 marks)**  
  - **Full credit (5):**  
    - Correct arithmetic: PBA shows A yes (3–2), B yes (3–2), thus C yes; CBA shows C no (2–3).  
    - States PBA delivers C yes, CBA delivers C no (opposite outcomes).  
    - Explains inconsistency under CBA: majority on A/B implies C yes, but CBA yields C no.  
  - **Competent (3–4):** Correct outcomes but minor errors (e.g., misstates vote counts) or omits why CBA is inconsistent.  
  - **Partial (1–2):** Fails to show arithmetic (e.g., only names procedures); confuses PBA/CBA; or asserts inconsistency without explanation.  
  - **Key errors:** Confusing with Condorcet cycles (e.g., framing as preference aggregation); claiming individuals are inconsistent.  

  #### **Part (b) (8 marks)**  
  - **Full credit (8):**  
    - **PBA:** Preserves consistency/closure; sacrifices responsiveness on C (majority opposes C) and neutrality (premises prioritized).  
    - **CBA:** Preserves responsiveness on C and neutrality; sacrifices consistency/closure and reason-giving.  
    - Frames conflict explicitly: consistency vs. responsiveness vs. fairness (neutrality/anonymity).  
  - **Competent (5–7):** Covers most trade-offs but lacks depth on desiderata (e.g., omits neutrality or reason-giving); vague on conflict.  
  - **Partial (2–4):** Lists strengths/weaknesses without framing as a conflict; or only addresses one procedure.  
  - **Key errors:** Treating PBA as "obviously correct" due to consistency; ignoring neutrality; conflating fairness with anonymity only.  

  #### **Part (c) (7 marks)**  
  - **Full credit (7):**  
    - States clause mandates PBA, resolving inconsistency but legislating one horn.  
    - Losing side (CBA) argues: overrides majority on C (3–2 no); verdict (C yes) matches no member’s *full* view (only 1–2 support it, but they are a minority); reasons (A/B) lack consensus (A opposed by 4–5, B by 3).  
    - Concludes clause has a cost: sacrifices majoritarian legitimacy.  
  - **Competent (4–6):** Identifies clause enforces PBA and notes majority override but misses that no member fully endorses the outcome or underplays reason-based objections.  
  - **Partial (1–3):** Only describes the clause; no critique of costs; or asserts dilemma is "solved" without analysis.  
  - **Key errors:** Claiming the verdict aligns with all members; ignoring the 3–2 majority against C.  

  #### **Part (d) (5 marks)**  
  - **Full credit (5):**  
    - Dilemma stems from logical connection, not majority voting.  
    - If independent: A yes (3–2), B yes (3–2), C no (2–3); collective set consistent (no rule binds them).  
    - Explains dilemma vanishes because no constraint forces inconsistency.  
  - **Competent (3–4):** Correct conclusion but weak explanation of independence (e.g., no vote counts).  
  - **Partial (1–2):** Attributes dilemma to majority rule; or claims inconsistency persists in independent case.  
  - **Key errors:** Suggesting majority voting causes inconsistency; misstating vote counts in independent scenario.  

  #### **General Guidance for Study Group**  
  - **Top answers (21–25 marks):** Work the case explicitly in all parts; avoid summarization; take a clear stance in (c)/(d); name and apply desiderata precisely.  
  - **Competent answers (15–20 marks):** Cover basics but lack depth (e.g., state PBA/CBA outcomes without exploring conflicts); may omit nuances in (c) (e.g., why reasons lack support).  
  - **Common errors to penalize:**  
    - Confusing discursive dilemma (judgment aggregation) with Condorcet paradox (preference cycles).  
    - Assuming the paradox requires irrational individuals (all members here are consistent).  
    - Using "fairness" vaguely without specifying anonymity/neutrality.  
    - In (d), blaming majority rule instead of agenda structure.  
  - **Self-grading tip:** Award marks objectively—check for arithmetic accuracy in (a), explicit desiderata in (b), and logical coherence in (c)/(d). Deduct for unsupported claims.
