prompt: |-
  I am enrolled in an upper-level undergraduate seminar on collective decision-making and social choice, and I am running the review session for our final examination. I would like to draft one practice essay question on the discursive dilemma, together with a model answer and a marking scheme, so that my study group can attempt it under exam conditions and then grade ourselves honestly. The question should be pitched so that it cannot be answered by restating the difference between premise-based and conclusion-based aggregation; it should force the writer to work through a concrete case and then say what the case does and does not show.

  The case I want the question to turn on is the following. A five-member appointments committee must decide whether to promote a candidate, and its charter ties the decision to two reasons. Let A be "the candidate's teaching record is excellent", B be "the candidate's research record is excellent", and C be "the candidate should be promoted", with the charter stipulating that C is correct exactly when both A and B are. The members vote as follows:

  - Member 1: A yes, B yes, C yes
  - Member 2: A yes, B yes, C yes
  - Member 3: A yes, B no, C no
  - Member 4: A no, B yes, C no
  - Member 5: A no, B no, C no

  Every member is individually consistent with the charter's rule; the inconsistency appears only at the collective level, which is what I want students to discover for themselves rather than be told.

  I have also invented one institutional wrinkle for the exercise. Suppose the charter contains a further clause requiring that the committee's recorded verdict be answerable to the reasons that carried the day, meaning the verdict must be derivable from the reasons the committee endorsed rather than from a head-count on the verdict itself. I want students to notice that this clause seems to settle the dispute in favor of aggregating the reasons and then deriving the verdict, and then to press on whether that settlement has a cost — in particular whether it commits the committee to a verdict that a majority of its members rejected and that no single member's own combination of reasons supports.

  Please write three things.

  First, the examination question itself. It should be a single essay question for a fifty-minute paper worth twenty-five marks, broken into lettered parts that build on one another, and it should ask the candidate to: (a) demonstrate, using the case above, that premise-based aggregation and conclusion-based aggregation deliver opposite verdicts, showing the arithmetic rather than merely naming the procedures; (b) explain what each procedure preserves and what each sacrifices, framed as a conflict among desiderata such as collective consistency and logical closure, responsiveness to the members' judgments, and some form of fairness or anonymity across members and propositions; (c) assess the reasons-tracking clause, saying whether it resolves the dilemma or merely legislates one horn of it, and what the losing side could fairly say in reply; and (d) say whether the dilemma is a defect of majority voting as such or a consequence of the fact that the agenda is logically connected — that is, of the verdict being tied to the reasons — by describing what would happen to the case if A, B and C were logically independent of one another.

  Second, a model answer of roughly 650 to 750 words that a strong candidate could produce in the time allowed. It should not merely summarize the topic: it should work the case, take a position on the clause in part (c), and give a clear verdict in part (d) about where the difficulty really lies.

  Third, a marking scheme totalling twenty-five marks, distributed across the four parts, that names the specific moves a top answer must make and the specific errors that should cost marks — for instance, confusing the discursive dilemma with a Condorcet-style cycle of preferences, assuming the dilemma presupposes that individual voters are irrational, or treating premise-based aggregation as obviously correct merely because it preserves consistency. For each part, indicate the difference between a full-credit answer and a merely competent one.

  Please write the model answer in continuous prose suitable for a candidate to emulate, and keep the marking scheme in a form a study group could apply without an instructor present.
reasoning: |-
  We are creating an exam question on the discursive dilemma with a specific case and additional institutional wrinkle. The question will have four parts (a, b, c, d) and should require the student to work through the case.

  Let's start by writing the exam question.

  **Examination Question**

  You are a member of a five-person appointments committee that must decide whether to promote a candidate (proposition C). The committee's charter stipulates that promotion is justified if and only if both the candidate's teaching record is excellent (proposition A) and the candidate's research record is excellent (proposition B). Thus, the charter requires that C ↔ (A ∧ B). The committee members cast the following votes, each of which is individually consistent with the charter:

  | Member | A   | B   | C   |
  |--------|-----|-----|-----|
  | 1      | Yes | Yes | Yes |
  | 2      | Yes | Yes | Yes |
  | 3      | Yes | No  | No  |
  | 4      | No  | Yes | No  |
  | 5      | No  | No  | No  |

  Additionally, the charter contains a clause requiring that the committee's recorded verdict on promotion must be "answerable to the reasons that carried the day," meaning that the verdict must be derivable from the collective judgments on the reasons (A and B) rather than being determined by a direct vote on C.

  (a) Using the case above, demonstrate that premise-based aggregation (PBA) and conclusion-based aggregation (CBA) deliver opposite verdicts on promotion (C). Show the arithmetic of the voting on each proposition. (5 marks)

  (b) Explain what each procedure preserves and what each sacrifices, framing your answer as a conflict among the following desiderata: collective consistency and logical closure, responsiveness to the members' judgments (majority rule), and fairness (anonymity and neutrality). (8 marks)

  (c) Assess the reasons-tracking clause in the charter. Does it resolve the dilemma or merely legislate one horn of it? What could the losing side (those who would prefer the other aggregation method) fairly say in reply? (7 marks)

  (d) Is the discursive dilemma a defect of majority voting as such, or is it a consequence of the logical connection between the propositions (i.e., the fact that C is tied to A and B by the charter)? Describe what would happen in the case if A, B, and C were logically independent of one another. (5 marks)

  ---

  **Model Answer (approx. 650-750 words)**

  The discursive dilemma, also known as the doctrinal paradox, arises when individually rational agents hold judgments on interconnected propositions, and collective aggregation of these judgments leads to inconsistency. This essay uses the case of the appointments committee to illustrate the dilemma, compare aggregation methods, and evaluate a charter clause aimed at resolving it.

  (a) The case presents five committee members voting on A (excellent teaching), B (excellent research), and C (promotion), with the rule C ↔ (A ∧ B). Each member's vote is consistent with this rule. Under premise-based aggregation (PBA), we aggregate votes on the premises (A and B) and then derive C from the collective judgments on the premises. For A: three yes (members 1, 2, 3) and two no (4,5) — majority yes. For B: three yes (1,2,4) and two no (3,5) — majority yes. Thus, collectively A is yes, B is yes, so by the rule, C must be yes. Under conclusion-based aggregation (CBA), we aggregate votes directly on C: two yes (1,2) and three no (3,4,5) — majority no. Thus, PBA yields promote (C yes) and CBA yields do not promote (C no). The procedures deliver opposite verdicts.

  (b) The conflict between PBA and CBA reflects a deeper tension among democratic desiderata. PBA preserves collective consistency and logical closure: by aggregating the premises and then deriving the conclusion, the collective judgment set {A yes, B yes, C yes} is consistent with the rule. However, it sacrifices responsiveness to the majority on the conclusion: a majority (3 out of 5) voted against promotion. Moreover, PBA may raise fairness concerns because it treats premises and conclusions asymmetrically: the premises are decided by majority, but the conclusion is not voted on. CBA, by contrast, respects the majority will on the conclusion (C no) and treats the conclusion symmetrically (by having a direct vote). But it sacrifices consistency: the collective judgments on the premises (A yes and B yes) would imply C yes by the rule, but CBA records C no, leading to inconsistency. Additionally, CBA does not provide collective judgments on the premises, so it fails to offer reasons for the decision, which might be necessary for accountability.

  The desiderata in conflict are: (1) collective rationality (consistency and logical closure) vs. (2) responsiveness to majority will on every proposition (including the conclusion) and (3) fairness (anonymity and neutrality across propositions). PBA prioritizes collective rationality and provides reasons, but overrides the majority on the conclusion. CBA prioritizes majority rule on the conclusion and neutrality (by treating C as a proposition like any other) but sacrifices consistency and leaves the collective without a coherent set of reasons.

  (c) The charter's reasons-tracking clause, which requires that the verdict be derivable from the collective judgments on the reasons (A and B), effectively mandates PBA. This resolves the dilemma by choosing consistency and reason-giving. However, it does so by legislating one horn of the dilemma (PBA) and disregarding the other. The losing side (advocates of CBA) could fairly object that this clause ignores the majority's will on the conclusion. In this case, a majority (3 out of 5) voted against promotion, and the clause forces promotion anyway. Moreover, the collective judgment set under PBA (A yes, B yes, C yes) does not match any individual member's judgments: member 1 and 2 voted for A, B, and C; but members 3, 4, and 5 each rejected at least one premise or the conclusion. Specifically, no member held the exact set {A yes, B yes, C yes} because member 3 voted A yes but B no and C no; members 4 and 5 voted A no. Thus, the collective judgment is "unanimous" in no individual's view. The losing side might argue that the committee is promoting a candidate that a majority opposes and for reasons that no single member endorses in full.

  (d) The discursive dilemma is not a defect of majority voting per se, but a consequence of the logical connection among propositions. If A, B, and C were logically independent, there would be no dilemma. Each proposition would be decided by majority separately. In this case, for A: majority yes (3-2); for B: majority yes (3-2); for C: majority no (2-3). The collective judgments would be {A yes, B yes, C no}, which is consistent because there is no rule connecting them. The inconsistency in the original case arises precisely because of the rule C ↔ (A ∧ B). Without such a rule, majority voting on each proposition would yield consistent outcomes. Therefore, the dilemma is inherent in aggregating judgments on interconnected propositions, not in majority rule itself.

  In conclusion, the discursive dilemma reveals a fundamental trade-off in collective decision-making. The reasons-tracking clause in the charter resolves the inconsistency by adopting PBA, but at the cost of overriding the majority on the conclusion and producing a collective judgment that lacks individual endorsement. The dilemma is not about majority rule but about the challenge of aggregating judgments on a logically structured agenda.

  (Word count: approx. 700)

  ---

  **Marking Scheme (Total 25 marks)**

  **Part (a) [5 marks]**
  - Full credit (5): Correctly calculates that under PBA: A yes (3-2), B yes (3-2), so C yes. Under CBA: C no (2-3). Clearly states opposite verdicts. Shows arithmetic (counts) for each proposition.
  - Partial credit (3-4): Minor errors (e.g., miscounting votes) but correct method and recognition of opposite outcomes.
  - Low credit (1-2): Major errors (e.g., wrong aggregation method, not showing arithmetic) or only stating the outcomes without calculation.
  - Zero: No relevant answer.

  **Part (b) [8 marks]**
  - Full credit (8): Clearly explains that PBA preserves consistency and logical closure but sacrifices majority rule on the conclusion and may be seen as unfair by treating premises and conclusions differently. CBA preserves majority rule on the conclusion and treats propositions neutrally but sacrifices consistency and does not provide a reasoned decision. Frames the conflict in terms of the desiderata: collective consistency, majority responsiveness, fairness (anonymity/neutrality). May note that PBA provides reasons while CBA does not.
  - Competent (5-7): Identifies the trade-offs but with less precision on the desiderata or without framing as a conflict among the listed values. May miss one desideratum or not fully develop the fairness aspect.
  - Partial (3-4): Only describes what each procedure does without framing as a conflict of desiderata, or omits one of the procedures' strengths/weaknesses.
  - Low (1-2): Superficial treatment, e.g., only restating the difference between PBA and CBA without discussing what they preserve/sacrifice.

  **Part (c) [7 marks]**
  - Full credit (7): Argues that the clause resolves the dilemma by mandating PBA (thus ensuring consistency and reason-giving) but merely legislates one horn. Notes that it overrides the majority on C (3 against) and that the collective judgment (A yes, B yes, C yes) is not held by any member (since members 1 and 2 are the only ones with A yes and B yes, but they also have C yes, so the set {A yes, B yes, C yes} is held by them? Wait: in the model answer we said no member holds exactly the collective set because the collective set is {A yes, B yes, C yes}. But members 1 and 2 do hold that set. Correction: members 1 and 2 voted A yes, B yes, C yes. So the collective set matches members 1 and 2. However, the point that a majority (3) voted against C still holds. Also, note that the collective set is the same as members 1 and 2, so it is held by two members. Therefore, we should adjust the model answer: the collective set is held by two members (1 and 2) but opposed by three (3,4,5). The losing side can object that the majority opposed C and that the decision does not reflect the diversity of reasons (e.g., some members rejected A, some rejected B). The model answer incorrectly stated that no member held the set. We must correct that.

  Correction in model answer for (c): 
  "Moreover, the collective judgment set under PBA (A yes, B yes, C yes) matches the judgments of members 1 and 2, but it is opposed by a majority of the committee (members 3, 4, and 5) who each voted against C. The losing side might argue that the committee is promoting a candidate that a majority opposes and that the collective reasons (A and B both approved) do not reflect the views of the entire committee, since three members actually rejected at least one premise (member 3 rejected B, member 4 rejected A, and member 5 rejected both)."

  Given this, the marking scheme for (c) should reflect:
  - Full credit: Correctly states that the clause mandates PBA and resolves the inconsistency. Argues that it legislates one horn (PBA) and ignores the majority on C. Notes that a majority (3) voted against C and that the collective reasons (A and B approved) are not unanimously endorsed (with three members rejecting at least one premise). The losing side can object that the verdict goes against the majority on the conclusion and that the reasons are not supported by all.
  - Competent (5-6): Misses one of the points above, e.g., does not mention the majority on C or the lack of unanimous support for the reasons.
  - Partial (3-4): Only states that the clause chooses PBA without discussing the objections, or does not address the losing side's reply.
  - Low (1-2): Superficial or incorrect assessment.

  **Part (d) [5 marks]**
  - Full credit (5): Clearly states that the dilemma is not a defect of majority voting but a consequence of the logical connection. Explains that if A, B, C are independent, majority voting on each would yield A yes, B yes, C no (with no inconsistency). Thus, without the logical connection (C ↔ A∧B) there is no inconsistency.
  - Partial credit (3-4): Correct but less detailed, e.g., says there would be no dilemma without the connection but does not show the votes.
  - Low (1-2): Only states that the dilemma comes from the connection without explaining the independent case, or confuses the issue.

  **Common Errors that Cost Marks:**
  - Confusing the discursive dilemma with a Condorcet cycle (which is about preferences, not judgments).
  - Assuming that the dilemma requires irrational individuals (it does not; individuals are consistent).
  - Treating PBA as obviously correct without acknowledging the cost (overriding majority on C).
  - In part (c), failing to notice that the clause mandates PBA and thus settles the dilemma in one way but at a cost.
  - In part (d), suggesting that majority voting is the root problem.

  **Adjustment for Model Answer (c):**
  We must correct the statement about the collective judgment set not matching any individual. Actually, it matches members 1 and 2. The problem is that a majority of the committee (3 out of 5) voted against C and that the collective reasons (A and B) are not endorsed by all (only by a majority on each, but with different majorities). The losing side can argue that the decision on C does not reflect the majority view on C and that the reasons are contested.

  Revised paragraph in model answer (c):
  "Moreover, while the collective judgment set under PBA (A yes, B yes, C yes) matches the judgments of members 1 and 2, it is opposed by a majority of the committee (members 3, 4, and 5) who each voted against promotion (C no). The losing side could fairly object that the clause forces a verdict that a majority rejects. Additionally, the collective reasons (A and B both approved) do not reflect the views of the entire committee: member 3 rejects B, member 4 rejects A, and member 5 rejects both. Thus, the committee's decision is based on reasons that are not unanimously endorsed and that a majority of the committee might not hold in combination (since only two members hold both A and B together)."

  This correction is important for accuracy.

  Let's update the model answer accordingly.

  **Final Model Answer (with correction in (c))**

  The discursive dilemma, also known as the doctrinal paradox, arises when individually rational agents hold judgments on interconnected propositions, and collective aggregation of these judgments leads to inconsistency. This essay uses the case of the appointments committee to illustrate the dilemma, compare aggregation methods, and evaluate a charter clause aimed at resolving it.

  (a) The case presents five committee members voting on A (excellent teaching), B (excellent research), and C (promotion), with the rule C ↔ (A ∧ B). Each member's vote is consistent with this rule. Under premise-based aggregation (PBA), we aggregate votes on the premises (A and B) and then derive C from the collective judgments on the premises. For A: three yes (members 1, 2, 3) and two no (4,5) — majority yes. For B: three yes (1,2,4) and two no (3,5) — majority yes. Thus, collectively A is yes, B is yes, so by the rule, C must be yes. Under conclusion-based aggregation (CBA), we aggregate votes directly on C: two yes (1,2) and three no (3,4,5) — majority no. Thus, PBA yields promote (C yes) and CBA yields do not promote (C no). The procedures deliver opposite verdicts.

  (b) The conflict between PBA and CBA reflects a deeper tension among democratic desiderata. PBA preserves collective consistency and logical closure: by aggregating the premises and then deriving the conclusion, the collective judgment set {A yes, B yes, C yes} is consistent with the rule. However, it sacrifices responsiveness to the majority on the conclusion: a majority (3 out of 5) voted against promotion. Moreover, PBA treats premises and conclusions asymmetrically: the premises are decided by majority, but the conclusion is not voted on. This asymmetry may be seen as a violation of neutrality across propositions. CBA, by contrast, respects the majority will on the conclusion (C no) and treats the conclusion symmetrically (by having a direct vote). But it sacrifices consistency: the collective judgments on the premises (if we were to take them individually by majority) would be A yes and B yes, implying C yes by the rule, but CBA records C no, leading to inconsistency. Additionally, CBA does not provide collective judgments on the premises, so it fails to offer reasons for the decision, which might be necessary for accountability.

  The desiderata in conflict are: (1) collective rationality (consistency and logical closure) vs. (2) responsiveness to majority will on every proposition (including the conclusion) and (3) fairness (anonymity and neutrality across propositions). PBA prioritizes collective rationality and provides reasons, but overrides the majority on the conclusion. CBA prioritizes majority rule on the conclusion and neutrality (by treating C as a proposition like any other) but sacrifices consistency and leaves the collective without a coherent set of reasons.

  (c) The charter's reasons-tracking clause, which requires that the verdict be derivable from the collective judgments on the reasons (A and B), effectively mandates PBA. This resolves the dilemma by choosing consistency and reason-giving. However, it does so by legislating one horn of the dilemma (PBA) and disregarding the other. The losing side (advocates of CBA) could fairly object that this clause ignores the majority's will on the conclusion. In this case, a majority (3 out of 5) voted against promotion, and the clause forces promotion anyway. Moreover, while the collective judgment set under PBA (A yes, B yes, C yes) matches the judgments of members 1 and 2, it is opposed by a majority of the committee (members 3, 4, and 5) who each voted against promotion. Additionally, the collective reasons (A and B both approved) are not endorsed by the entire committee: member 3 rejects B, member 4 rejects A, and member 5 rejects both. Thus, the committee's decision is based on reasons that are contested and not held by a majority in combination (only two members hold both A and B). The losing side might argue that the decision is illegitimate because it goes against the majority on the outcome and the reasons are not consensual.

  (d) The discursive dilemma is not a defect of majority voting per se, but a consequence of the logical connection among propositions. If A, B, and C were logically independent, there would be no dilemma. Each proposition would be decided by majority separately. In this case, for A: majority yes (3-2); for B: majority yes (3-2); for C: majority no (2-3). The collective judgments would be {A yes, B yes, C no}, which is consistent because there is no rule connecting them. The inconsistency in the original case arises precisely because of the rule C ↔ (A ∧ B). Without such a rule, majority voting on each proposition would yield consistent outcomes. Therefore, the dilemma is inherent in aggregating judgments on interconnected propositions, not in majority rule itself.

  In conclusion, the discursive dilemma reveals a fundamental trade-off in collective decision-making. The reasons-tracking clause in the charter resolves the inconsistency by adopting PBA, but at the cost of overriding the majority on the conclusion and producing a collective judgment that, while consistent, does not reflect the majority's will on the outcome and is based on reasons that are not unanimously supported. The dilemma is not about majority rule but about the challenge of aggregating judgments on a logically structured agenda.

