  Alright, the user is deeply familiar with the voting paradox debates in rationalist circles but frustrated with circular arguments. They want a clear set of criteria to evaluate any theory of voter turnout, not just another defense of existing models. Their list of specific phenomena is thorough, covering everything from the base turnout mystery to the secret ballot puzzle.

  Hmm, they're clearly fatigued by the standard "pivotality vs. expressive value" deadlock. The request for desiderata suggests they want analytical tools to cut through tribal disagreements. Interesting that they included their friend's "rent theory" – they might be seeking frameworks that unify material and symbolic motivations.

  Key challenges in drafting this:
  - Their seven phenomena are already interdependent (e.g., stickiness relates to norms while secret ballot relates to expression).
  - Must resist the urge to solve the paradox while listing criteria – they explicitly want "spec first."
  - The "reverse case" (small groups) and "ceiling end" (compulsory voting) could be fatal to single-mechanism theories.

  For non-negotiables: The base fact (#1) and response pattern (#2) seem foundational. If a theory can't explain why anyone votes despite near-zero pivotality or why rain slightly reduces turnout, it's dead on arrival. Whereas the rent theory test (#8) feels more like a bonus challenge.

  Biggest tension spots:
  - Secret ballot (#4) vs. expressive theories: If voting is expression, why hide it? This might sink purely signaling-based accounts.
  - Asymmetry (#7) vs. rational choice: Treating abstention as void contradicts models where not-voting could be strategic communication.
  - Ceiling end (#5) vs. pivotality: Compulsory voting's near-100% turnout suggests habit/coercion dominate when costs are removed, undermining pivotality-focused models.

  For the "usual suspects" summary:
  - Rational choice fails #1 (base fact), #2 (response pattern), #3 (reverse case)
  - Expressive theories struggle with #4 (secret ballot) and #7 (asymmetry)
  - Norm accounts handle #6 (stickiness) well but may fumble #2 (response to closeness)
  - Group/ethical models ace #7 (asymmetry) but get messy with #3 (small groups)

  ...Better flag that no single theory clears all bars. The real value might be showing where hybrid models are necessary – which is probably what the user suspects but wants proven systematically.
answer: |-
  Here's a rigorous desiderata list for a theory of turnout, derived from your specified phenomena. Each includes the **phenomenon to explain**, the **core requirement** for a theory, a **one-line case/observation** justifying it, and whether it's **non-negotiable** (✓) or **camp-specific** (△). Conflicts are flagged.

  ---

  ### **Desiderata for a Theory of Voter Turnout**  
  *(✓ = Non-negotiable; △ = Camp-specific/contextual)*  

  1. **The Base Fact**  
     - **Phenomenon**: High turnout despite negligible pivotality.  
     - **Requirement**: Must explain why voting occurs when instrumental rationality suggests abstention.  
     - **Case**: U.S. presidential elections: ~60% turnout despite pivot probability <10^-8.  
     - **Status**: ✓ (Without this, no theory starts).  

  2. **Response Pattern**  
     - **Phenomenon**: Turnout responds weakly to cost/closeness, not as a pivotality step function.  
     - **Requirement**: Must predict smooth, bounded sensitivity to election closeness and voting costs.  
     - **Case**: Rain reduces turnout by ~1-5%; highly competitive races boost it by ~2-8%.  
     - **Status**: ✓ (Empirically indisputable).  

  3. **Reverse Case (Small Groups)**  
     - **Phenomenon**: Pivotality is high in small groups, but turnout isn’t higher or more rational.  
     - **Requirement**: Must explain why high pivotality doesn’t consistently increase participation.  
     - **Case**: Faculty meetings: 1 vote could swing outcomes, yet habitual attendees dominate; absentees don’t rush to join.  
     - **Status**: ✓ (Falsifies naïve pivotality-only models).  

  4. **Secret Ballot**  
     - **Phenomenon**: Voting is private, yet expressive/signaling theories rely on audience.  
     - **Requirement**: Must reconcile hidden votes with expressive/signaling motives.  
     - **Case**: "I Voted" stickers signal participation, but the vote itself is concealed. Expression targets *self* or *generalized others*.  
     - **Status**: △ (Critical for expressive/ethical theories; irrelevant for strict habit models).  

  5. **Ceiling End (Compulsory/Coercive Contexts)**  
     - **Phenomenon**: Near-universal turnout under coercion, suggesting habit/pressure dominates.  
     - **Requirement**: Must explain voluntary turnout without relying on coercion, while accommodating its effects.  
     - **Case**: Australia (compulsory voting): >90% turnout vs. ~55% in similar-voluntary UK.  
     - **Status**: ✓ (Tests if theory can scale from voluntary to coerced contexts).  

  6. **Stickiness & Norm Internalization**  
     - **Phenomenon**: Past behavior predicts future turnout; non-voters report shame, not indifference.  
     - **Requirement**: Must explain hysteresis and emotional responses to (non-)voting.  
     - **Case**: Lifelong voters turnout even in low-stakes elections; non-voters cite "not my thing" or guilt.  
     - **Status**: △ (Critical for norm/habit theories; less so for rational choice).  

  7. **Asymmetry of Meaning**  
     - **Phenomenon**: Voting is seen as agency; abstention as void/non-participation.  
     - **Requirement**: Must explain why abstention isn’t treated as an expressive/signaling act.  
     - **Case**: Protests *against* a candidate involve voting for rivals, not abstaining. Abstention lacks collective interpretation.  
     - **Status**: △ (Vital for ethical/group theories; irrelevant for pivotality).  

  8. **Rent Theory Test**  
     - **Phenomenon**: "Casting a ballot is paying rent on membership."  
     - **Requirement**: Must explain why "rent" is paid via voting rather than taxes, oath-taking, or civic acts.  
     - **Killer Case**: If true, naturalized citizens (who "paid rent" via immigration hurdles) should vote less. They don’t.  
     - **Status**: △ (Tests symbolic membership models).  

  ---

  ### **Conflicts & Tensions**  
  - **Base Fact vs. Response Pattern**: Explaining high baseline turnout (Base Fact) often requires non-pivotality mechanisms (e.g., norms). But these same mechanisms struggle to explain *variation* with closeness/cost (Response Pattern).  
  - **Secret Ballot vs. Expressive Theories**: If voting expresses identity, why hide it? Theories must posit expression to *self* (e.g., via sticker) or diffuse social approval.  
  - **Reverse Case vs. Pivotality**: High pivotality *should* boost turnout. When it doesn’t (small groups), theories must explain why cognitive/emotional factors override pivotality.  
  - **Ceiling End vs. Voluntary Turnout**: A theory explaining 90% coerced turnout may overfit and fail at 50% voluntary turnout (or vice versa).  

  ---

  ### **Non-Negotiables vs. Camp Preferences**  
  | **Desideratum**         | Non-Negotiable (✓) | Camp-Specific (△) |  
  |--------------------------|-------------------|-------------------|  
  | Base Fact                | ✓                 |                   |  
  | Response Pattern         | ✓                 |                   |  
  | Reverse Case             | ✓                 |                   |  
  | Secret Ballot            |                   | △ (Expressive)    |  
  | Ceiling End              | ✓                 |                   |  
  | Stickiness               |                   | △ (Norms/Habits)  |  
  | Asymmetry                |                   | △ (Ethical)       |  
  | Rent Theory Test         |                   | △ (Symbolic)      |  

  **Non-negotiable core**: Any theory must explain **why people vote despite low pivotality (1)**, **why turnout responds weakly to cost/closeness (2)**, **why high-pivotality small groups don’t see rational surges (3)**, and **how voluntary/coerced turnout relate (5)**.  

  ---

  ### **How Usual Theories Fare**  
  - **Rational-Choice Pivotality**: Fails Base Fact (1), Reverse Case (3), Response Pattern (2).  
  - **Expressive/Consumption**: Struggles with Secret Ballot (4), Response Pattern (2), Reverse Case (3).  
  - **Norm/Habit**: Aces Stickiness (6), Base Fact (1), Ceiling End (5); weak on Response Pattern (2).  
  - **Group/Ethical Voter**: Explains Asymmetry (7), Base Fact (1); vague on Secret Ballot (4), Reverse Case (3).  

  **No theory satisfies all desiderata**. The list reveals why debates persist: each camp optimizes for different criteria. A hybrid model (e.g., "norms + weak pivotality + expression") is implied, but must resolve tensions (e.g., privacy vs. expression). The **overconstrained list** itself is the result—voting is a syndrome, not a unitary behavior.
