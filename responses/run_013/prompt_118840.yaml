prompt: |-
  ok so i'm doing an independent-study project for math club and it's abt fair division — like how two people should split something when neither of them can just take it and both have to agree. my advisor keeps telling me that before i compare any rules i have to write down what a rule has to actually DO, otherwise i'm just picking whichever rule gives the answer i already wanted. so can you write me that list? the purpose is basically: a rule that me and my sister could actually use to split stuff, but also one that survives a club presentation.

  here's my half-formed list, in my own words, and i honestly don't know which of these are real requirements and which are just things one camp happens to like:

  - if we don't agree, we each have a fallback (what we get if the deal falls through). a rule should never hand either of us less than our fallback, or why would we ever sign.
  - it shouldn't waste anything: if there's another possible deal that's better for both of us, we shouldn't be sitting on the one we picked.
  - if our situations are exactly symmetrical we get the same, and the rule shouldn't care which of us is named what.
  - it shouldn't change if we measure in dollars vs cents, or if one of us reports happiness on a different scale.
  - if my options get better — like some new deal opens up that helps me and doesn't help her at all — i shouldn't end up with LESS than before. that one seems obviously true to me but my advisor said not every famous rule definately passes it???
  - the answer shouldn't depend on deals that nobody would ever actually pick anyway.
  - it should still work with three or more people, not just two. i have a feeling this is where the whole thing falls apart, idk.

  the rule i actually want to defend is the one where you draw the blob of all the possible deals, find the best each person could get, and then pick the point where each person has gone the same PERCENTAGE of the way from their own fallback to their own best case. my advisor says that's the Kalai–Smorodinsky one (sp?) and that the more famous rule — the one that maximizes the product of how much each person gains over their fallback (Nash?) — passes one of my bullets that this rule fails, and fails one that this rule passes.

  so what i want: for each bullet, say whether it's a genuine requirement or just a preference of one camp, and give me the actual case behind it (what goes wrong, concretely, if a rule breaks it). tell me which single bullet rules out the most rules. and if some of these can't all be true at the same time, please just say that straight out, because that's the part i most want and it would basically be the result of my project. then a short bit on how the product rule and the percentage rule each do against the list.

  also: tell me how confident you are in each thing you claim, and point out the single claim you're least sure abt, because i have to defend this in front of my club and i don't want to get destroyed. and dont worry abt sources or a reading list, my advisor says i should find those myself.
reasoning: |-
  Okay, the user is working on a fair division project for math club, focusing on rules for two people to split something when both must agree. They've listed several properties they think a fair rule should have but aren't sure which are essential. They need help clarifying these properties, understanding trade-offs between them, and comparing Nash and Kalai-Smorodinsky solutions.

  First, I need to break down each bullet point they mentioned. Let me verify each one against standard fair division axioms. 

  The first point about fallbacks is clear—it's individual rationality. Without it, people wouldn't agree to the deal. The second is Pareto efficiency; wasting resources isn't sensible. Symmetry seems straightforward too. 

  Scale invariance makes sense because switching units shouldn't change outcomes. The fifth point about options improving shouldn't hurt anyone—that's monotonicity. Independence of irrelevant alternatives (IIA) is tricky; Nash requires it, but Kalai-Smorodinsky doesn't. 

  Extending to three people is where complications arise. Many solutions work well for two but struggle with more due to strategic behavior or computational issues. 

  The user wants to defend Kalai-Smorodinsky (KS), which uses proportional gains. Their advisor mentioned Nash maximizes the product of gains. I should contrast these: KS satisfies monotonicity but fails IIA, while Nash does the opposite. 

  The user's deeper needs include a practical rule for splitting with their sister and a robust presentation. They might not realize the impossibility of satisfying all axioms simultaneously, especially with three players. Highlighting trade-offs here is key. 

  Confidence levels: Most axioms are well-established, but IIA and multi-agent extensions are where debates happen. I'm least sure about the feasibility of multi-agent KS without modifications. 

  Finally, summarizing which axioms rule out which solutions will help the user present trade-offs clearly, showing that no perfect solution exists, which could be their project's conclusion.
answer: |-
  Here's a breakdown of your requirements, their validity, trade-offs, and how the Nash and Kalai-Smorodinsky (KS) rules perform. This is the core framework you need.

  **Your Requirements Analyzed (The Axioms):**

  1.  **Individual Rationality:** "Never hand either of us less than our fallback."
      *   **Genuine Requirement? YES.** This is fundamental. If a rule gave you *less* than your fallback (disagreement point), you'd rationally walk away. No agreement can be stable without this. **Consequence if Broken:** The disfavored party rejects the deal, leading to the fallback outcome anyway, or conflict.
      *   **Confidence:** Very High (Standard in all bargaining theory).

  2.  **Pareto Efficiency / Non-Wastefulness:** "Shouldn't waste anything... shouldn't be sitting on a deal worse for both."
      *   **Genuine Requirement? YES (Almost Universally).** This is about economic efficiency. If a mutually better deal exists, rational bargainers should move to it. A rule settling on an inefficient point is considered flawed. **Consequence if Broken:** Potential mutual gain is left unrealized; both parties could be made better off without harming the other.
      *   **Confidence:** Very High (Cornerstone of welfare economics).

  3.  **Symmetry:** "If exactly symmetrical, we get the same... shouldn't care about names."
      *   **Genuine Requirement? CONDITIONAL.** It's a strong fairness principle when the situation is truly symmetric (identical preferences, identical fallbacks). However, real-world situations are rarely perfectly symmetric. Rules *can* be asymmetric if the underlying situation justifies it (e.g., different fallbacks). **Consequence if Broken in a Symmetric Situation:** The rule introduces arbitrariness based on irrelevant labels (names), violating basic fairness intuitions.
      *   **Confidence:** High for symmetric cases. Lower for asymmetric justification (depends on the justification).

  4.  **Scale Invariance / Invariance to Affine Transformations:** "Shouldn't change if we measure in dollars vs cents... or report happiness on a different scale."
      *   **Genuine Requirement? YES.** Utility is ordinal, not cardinal. How you *label* your satisfaction (e.g., 0-10 vs 0-100, or dollars vs cents) shouldn't change the *substantive* outcome of the bargain. The rule should depend only on the *relative* rankings of outcomes and the disagreement point. **Consequence if Broken:** The outcome becomes arbitrary, depending on how parties choose to report their preferences (scale) rather than the underlying preferences themselves. Parties could manipulate the outcome by changing their reporting scale.
      *   **Confidence:** Very High (Essential for rules based on cardinal utility).

  5.  **Monotonicity (Resource Monotonicity):** "If my options get better... I shouldn't end up with LESS."
      *   **Genuine Requirement? DEBATED (But Strong Fairness Intuition).** This seems obviously fair: if the pie grows *only* on your side, you shouldn't lose. However, as your advisor hinted, some famous rules violate it. Violations often occur because the rule prioritizes other fairness properties (like IIA - see below). **Consequence if Broken:** Counter-intuitive and potentially unfair outcomes where a party is penalized for the bargaining set improving *in their favor*.
      *   **Confidence:** High that it's desirable, but Medium that it's *always* an absolute requirement (acknowledging the trade-off with IIA).

  6.  **Independence of Irrelevant Alternatives (IIA):** "Shouldn't depend on deals nobody would ever pick."
      *   **Genuine Requirement? CONTROVERSIAL.** Proposed by Nash as rational, but heavily criticized. It means if you remove an alternative *that wasn't chosen anyway*, the chosen outcome shouldn't change. **Consequence if Broken:** The outcome can be manipulated by introducing or removing "dummy" options that are worse than the current choice for both parties, potentially shifting the bargain point. **Consequence if Enforced:** Can lead to violations of Monotonicity or other intuitive fairness properties (like KS failing IIA).
      *   **Confidence:** Medium-Low as an absolute requirement. It's a technical axiom representing a specific notion of consistency/rationality, but its real-world fairness implications are questionable. This is the axiom I'm *least sure* about being a universal "requirement" versus a specific modeling choice.

  7.  **n-Person Extension:** "Should work with three or more people."
      *   **Genuine Requirement? CONTEXT DEPENDENT.** For a *general* theory of bargaining, yes, extending beyond two players is crucial. However, for your specific use case (splitting stuff with your sister), the 2-person version is sufficient. **The Challenge:** Many elegant 2-person solutions (Nash, KS) lack unique, universally accepted, and satisfactory generalizations to n>2 that satisfy all the other desirable properties simultaneously. Things get messy (strategic voting, coalitions, core emptiness). **Consequence if Ignored:** The rule isn't generalizable. **Consequence if Poorly Extended:** Complex, hard to compute, unstable outcomes, or violations of other axioms.
      *   **Confidence:** High that extending is theoretically desirable, High that it's practically challenging.

  **Key Trade-offs and Impossibilities:**

  *   **The Big Trade-off: Monotonicity vs. IIA:** You **cannot** have a bargaining solution that satisfies Pareto Efficiency, Symmetry, Scale Invariance, IIA, *and* Monotonicity simultaneously for all possible bargaining problems. This is a fundamental result.
      *   Nash satisfies IIA but fails Monotonicity.
      *   Kalai-Smorodinsky satisfies Monotonicity but fails IIA.
  *   **n-Person Challenge:** Satisfying a consistent set of appealing axioms (like Pareto, Symmetry, Individual Rationality) becomes significantly harder or even impossible (depending on the specific set) for n>2 players in general bargaining problems. Solutions often involve compromises (e.g., focusing on the core, Shapley value for TU games, or using different concepts like envy-freeness for division).

  **Which Bullet Rules Out the Most?**

  **Independence of Irrelevant Alternatives (IIA)** is the most restrictive axiom. Many intuitively fair solutions (like Kalai-Smorodinsky) fail it, while Nash is specifically designed to satisfy it. It's the axiom most likely to disqualify a rule you might otherwise find appealing.

  **Nash vs. Kalai-Smorodinsky Against Your List:**

  | Axiom                  | Nash Bargaining Solution                                                                 | Kalai-Smorodinsky Solution                                                                 | Winner?        |
  | :--------------------- | :--------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :------------- |
  | **1. Individual Rationality** | YES                                                                                      | YES                                                                                        | **Both**       |
  | **2. Pareto Efficiency**      | YES                                                                                      | YES                                                                                        | **Both**       |
  | **3. Symmetry**               | YES (if symmetric)                                                                       | YES (if symmetric)                                                                         | **Both**       |
  | **4. Scale Invariance**       | YES                                                                                      | YES                                                                                        | **Both**       |
  | **5. Monotonicity**           | **NO** (Can penalize a player if the set expands favorably for them)                     | **YES**                                                                                    | **KS**         |
  | **6. IIA**                    | **YES**                                                                                  | **NO** (Adding irrelevant alternatives can change the outcome)                             | **Nash**       |
  | **7. n-Person Extension**     | **Difficult/Contested** (Various generalizations exist but lack unique appeal)           | **Difficult/Contested** (Various generalizations exist but lack unique appeal)             | **Neither**    |

  **Conclusion for Your Project:**

  You have a solid list of genuine requirements (axioms). The key insight is that **no single rule satisfies all desirable properties simultaneously.** The trade-off between **Monotonicity** and **IIA** is central.

  *   **Nash** prioritizes consistency (IIA) and the product of gains. It's simple, satisfies IIA, but can violate the intuitive fairness of Monotonicity.
  *   **Kalai-Smorodinsky** prioritizes equal relative gain from the fallback to the ideal point and satisfies Monotonicity. It feels fairer when the bargaining set changes asymmetrically but violates IIA.

  **Why KS might be good for you & your sister:** Its monotonicity is intuitive - if you find a new way to get more stuff that only benefits you, KS won't punish you for it. The "equal percentage gain" idea is also easy to explain.

  **Presenting Confidently:**

  *   Clearly state the axioms, emphasizing why Individual Rationality, Pareto Efficiency, and Scale Invariance are non-negotiable.
  *   Highlight the Monotonicity vs. IIA trade-off as the central tension. Use a simple example to illustrate how Nash fails Monotonicity and KS fails IIA.
  *   Acknowledge the n-player challenge: "While both rules *can* be generalized, finding extensions that perfectly preserve all the appealing 2-player properties remains an active area of research and involves compromises."
  *   **State your least sure point explicitly:** "The requirement I'm least certain about as universally mandatory is **Independence of Irrelevant Alternatives (IIA)**. While it ensures consistency, it can lead to outcomes that violate strong intuitions about fairness when the bargaining set changes, as shown by Kalai-Smorodinsky satisfying Monotonicity instead. The necessity of IIA depends on whether you prioritize consistency over this specific fairness intuition when options change."

  This framework gives you the structure to compare rules objectively and defend your choice of KS based on its strengths (Monotonicity, intuitive fairness) while acknowledging its weakness (IIA). Good luck with your math club presentation!
