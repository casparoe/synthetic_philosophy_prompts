prompt: |-
  I am a fourth-year PhD student in biostatistics, and next week I present to our department's causal-inference reading group a paper in which I argue that Simpson's reversals are not evidence of confounding but symptoms of an under-specified estimand, and I propose that an effect estimate count as admissible only if its sign is invariant under conditioning on every pre-treatment covariate that is a cause of the outcome — a criterion I call sign-stability. The room will be about a dozen people: three or four Pearl-style causal modellers who treat the back-door criterion as the complete answer, two frequentist epidemiologists who are sceptical of any appeal to counterfactuals, and one decision theorist who will want to know what any of this has to do with choosing between actions. Draft the Q&A prep sheet I actually need: the objections each of these camps will raise, in their own vocabulary, ordered by how likely and how damaging they are; for each, a two-minute reply and a note on where that reply is weakest; what I should concede up front; and the one objection I am hoping nobody asks. Do not give me a general exposition of the paradox — I know it — I need the questions this particular room will fire at this particular thesis.
reasoning: |-
  Okay, the user is a fourth-year PhD student in biostatistics preparing for a presentation on Simpson's paradox and their sign-stability criterion. They need a targeted Q&A prep sheet for a specific audience with three distinct camps: Pearl-style causal modelers, frequentist epidemiologists, and a decision theorist. 

  First, I need to understand the core argument: that Simpson's reversals indicate an underspecified estimand rather than confounding, and that sign-stability (invariant effect sign under conditioning on any pre-treatment covariate causing the outcome) should be the admissibility criterion. The audience's biases are clearly mapped—this is crucial.

  For the Pearl camp, their central objection will be dismissing sign-stability as redundant since back-door adjustment already "solves" confounding. They'll see this as reinventing the wheel. The reply should reframe sign-stability as an estimand robustness check, not an alternative to back-door. The weakness? It doesn't help identify which covariates to adjust for—back-door still wins there. Must concede this upfront.

  The epidemiologists will reject counterfactual framing entirely. Their objection will be pragmatic: "Why not just adjust for known confounders?" Reply should position sign-stability as clarifying what the adjusted estimate actually means. Weakness: It doesn't resolve real-world uncertainty about what variables are confounders. Concede that observed-data methods are still needed.

  The decision theorist is the wildcard. They'll ask how this abstract stability translates to choosing actions. The reply must link sign-invariance to reduced regret under model uncertainty. This is the weakest reply because it assumes risk-aversion—if someone prefers gambling on model specs, the argument crumbles. 

  The nightmare question? If someone points out that sign-stability is impossible to verify without exhaustive conditioning. That's fatal because the criterion becomes purely theoretical. The only defense is to fall back on it being an ideal for defining effects, not a practical tool. 

  User's tone suggests they're deep in the weeds but nervous about pushback. They don't want theory lectures—just battle-ready comebacks. The prep sheet must be mercilessly specific to their stated audience. No fluff.
answer: |-
  Here’s your targeted Q&A prep sheet, stripped of exposition and honed for the battleground you’re facing. Prioritize objections by likelihood/damage, with tactical replies and concessions.

  **Core Concession Up Front (Disarm Critics):**
  *   "Before we start, I concede: **Sign-stability is not a substitute for causal identification.** It doesn’t tell you *which* covariates are confounders (back-door), *how* to adjust (standardization/IPW), or guarantee identifiability. Its role is **diagnostic**: flagging when our causal question (the estimand) is ambiguous *even if* we perfectly adjust for all confounders. Simpson’s reversal reveals this ambiguity."

  ---

  **Likely & Damaging Objections:**

  1.  **The Pearl Camp: "This is Redundant/Subsumed by Back-Door Criterion"**
      *   **Objection:** "The back-door criterion *defines* a sufficient set for unbiased effect estimation. If you condition on a back-door set, the reversal disappears and you get the true causal effect. Your sign-stability is just a symptom of an *insufficient* adjustment set. Why invent a new criterion?"
      *   **2-Minute Reply:** "The back-door criterion ensures unbiasedness *conditional on a chosen DAG*. Sign-stability asks a different question: **Is the *sign* of the estimated effect robust to *any* further conditioning on pre-treatment causes of Y?** A reversal under conditioning on a *non-confounding* cause (e.g., a mediator collider opened by conditioning) demonstrates ambiguity in the *interpretation* of the *marginal* effect. It highlights that the 'effect' we initially stated wasn't a well-defined *causal* estimand – it mixed paths. Back-door gives *an* answer; sign-stability probes if the *question* was unambiguous. They address different aspects of specification."
      *   **Weakness:** Doesn't help *identify* confounders. Relies on correctly specifying *all* potential causes of Y to test. Practical verification is impossible without perfect knowledge.

  2.  **Frequentist Epidemiologists: "This is Philosophy, Not Analysis. Just Adjust for Known Confounders!"**
      *   **Objection:** "In practice, we adjust for known/suspected confounders based on subject-matter knowledge. We get a point estimate and CI. Observed reversals just mean we missed a confounder. Your 'sign-stability' is an unverifiable counterfactual ideal. What actionable guidance does this provide for my next cohort study?"
      *   **2-Minute Reply:** "It provides crucial **interpretative clarity**. If your carefully adjusted estimate *reverses sign* simply because you added another plausible pre-treatment cause of the outcome (not necessarily a confounder!) to the model, what does your original 'adjusted effect' *mean*? Sign-stability diagnoses that your initial estimand (`E[Y|do(X)]`) wasn't stable; it was implicitly dependent on the *level* of other causes you conditioned on. It forces us to specify: **Is the effect we want marginal over *all* pre-treatment causes, or conditional on specific levels of some?** Standard adjustment gives *an* answer; sign-stability warns if that answer is highly context-dependent."
      *   **Weakness:** Seems abstract. Doesn't solve the fundamental problem of unmeasured confounding or model misspecification in real data. Doesn't provide a "better" estimate, just a warning light.

  3.  **The Decision Theorist: "Where's the Optimal Action?"**
      *   **Objection:** "Fine, the sign might flip depending on conditioning. But I need to choose whether to treat Patient Z or not. How does sign-stability tell me which action maximizes utility *for Z*? Won't I just use the best available adjusted estimate given Z's covariates?"
      *   **2-Minute Reply:** "You're absolutely right. For individualized decisions (`E[Y|do(X), Z=z]`), conditioning on `z` is essential. Sign-stability targets the *population-level* estimand (`E[Y|do(X)]`). Its value for decision-making is **robustness under model uncertainty**. If the *population* effect sign isn't stable, it signals profound ambiguity about the *direction* of the effect *in general*. This raises a red flag: acting based on the marginal effect alone carries high risk of being wrong. It pushes you to: (1) Explicitly define the target population (marginal vs. subpopulations defined by `z`), and (2) Recognize that if the marginal sign isn't stable, your optimal action for an *unmeasured* individual might depend critically on their unknown `z`."
      *   **Weakness:** Doesn't directly give the individualized decision rule. Requires careful translation from population ambiguity to individual risk assessment. The decision-maker might still pragmatically use the best available model.

  ---

  **Less Likely But Damaging:**

  4.  **Pearl/Epi Crossover: "Sign-Stability is Too Strong/Impractical"**
      *   **Objection:** "Requiring invariance under conditioning on *every* pre-treatment cause of Y is impossible to verify empirically (we never know all causes) and often violated even when a clear causal effect exists (e.g., effect modification). Isn't this a uselessly strict criterion?"
      *   **Reply:** "It's an **ideal diagnostic**, not an estimation procedure. Think of it like consistency assumptions: we can't prove them, but violating observable implications (like sign reversals under conditioning on observed causes) alerts us to problems. While effect modification changes the *magnitude*, sign-stability focuses on the *direction*. Violation by modification is rare (requires modification strong enough to flip sign *within* strata *and* the marginal flip). Its primary value is revealing when the 'effect' we naively state aggregates fundamentally different processes."
      *   **Weakness:** Admits it's often unverifiable. Must rely on conditioning on *observed* causes. Practical application is limited to sensitivity analyses.

  ---

  **The Nightmare Question (Hope Nobody Asks):**

  *   **"If sign-stability requires conditioning on *all* pre-treatment causes of Y, and we never know them all, doesn't this make *every* marginal effect estimate potentially 'inadmissible' by your criterion? Isn't this just nihilism disguised as rigor?"**
      *   **Why it's Deadly:** Directly attacks the core premise as vacuous or paralyzing. Forces you into defending an impossible ideal.
      *   **Damage Control Reply (Grit Teeth):** "You've hit the philosophical core. Sign-stability highlights the **inherent ambiguity in coarse causal queries**. While perfect verification is impossible, *observed* sign reversals under conditioning on *known important causes* are demonstrable proof that ambiguity exists *in this specific case*. It doesn't render all estimates inadmissible; it renders *estimates vulnerable to demonstrable sign reversals* inadmissible as robust statements of a marginal effect. It pushes us towards: (1) Reporting effects within meaningfully defined subpopulations, or (2) Explicitly stating the limitations of the marginal estimand when stability is violated with known variables. It's a call for specificity, not nihilism."
      *   **Weakness:** Feels like retreating. Concedes the criterion is often unattainable, weakening its force as a practical admissibility rule. Highlights the tension between philosophical clarity and actionable inference.

  **Tactical Summary:**
  *   **Lead with Concession:** Acknowledge sign-stability doesn't solve identification or replace adjustment.
  *   **Reframe Relentlessly:** Emphasize "diagnostic for estimand ambiguity," not "alternative to back-door" or "better adjustment."
  *   **Target Language:** Use "estimand ambiguity," "robustness of interpretation," "context-dependence" for Pearls; "interpretative clarity," "purpose of the estimate" for Epi; "robustness under model uncertainty," "risk for marginal decisions" for Decision Theory.
  *   **Redirect:** When pressed on practicality, steer towards "This tells us *when* we need to be extra careful in defining *what* we mean by 'the effect'."
  *   **Defend the Core:** The unique value proposition is reframing Simpson's reversal as an *estimand specification issue*, not just a confounding issue. Don't let them reduce it to the latter.

  Good luck. They'll be sharp, but you've clearly thought deeply. Focus on the *question* Simpson's Paradox forces us to ask, not just the mechanics of the reversal.
