  To implement Zorn's lemma in your planner, you'll need a loop that ascends a chain of task sets until it finds a maximal element. The key insight is that Zorn's lemma guarantees the existence of a maximal element under the given conditions, but the implementation must handle the search process. Below is a structured approach:

  ### Core Algorithm
  ```python
  def find_maximal_element(initial_set, upper_bound_func):
      current = initial_set
      while True:
          # Find an upper bound strictly greater than 'current' if possible
          candidate = upper_bound_func(current)
          
          # Termination condition: no strict improvement found
          if candidate == current:
              return current  # 'current' is maximal
          
          # Move to the improved candidate
          current = candidate
  ```

  ### Explanation
  1. **Initialization**: Start with an arbitrary initial task set (`initial_set`).
  2. **Loop Invariant**: `current` is always an element of the partial order and represents the head of the chain built so far.
  3. **Upper Bound Function (`upper_bound_func`)**:
     - **Input**: An element `x` (current head of the chain).
     - **Output**: An element `y` such that:
       - `y ≥ x` (i.e., `y` is an upper bound for the chain).
       - **If** there exists *any* `z > x` (strictly better), then `y` should be such a `z` (i.e., `y > x`).
       - **Otherwise**, `y = x`.
  4. **Termination Condition**: When `upper_bound_func` returns `current`, it signals that no strict improvement exists, meaning `current` is maximal.

  ### Handling the Infinite Case
  - **Hypothesis of Zorn's Lemma**: Every chain has an upper bound in the space. This ensures that `upper_bound_func` can always return *some* `y ≥ x`.
  - **Termination in Practice**: Though chains *could* be infinite, the lemma guarantees a maximal element exists. In code, you rely on `upper_bound_func` to eventually "jump" to this maximal element (or a chain leading to it) in finite steps. For example:
    - If the chain is infinite but has an upper bound that is maximal, `upper_bound_func` could return this bound directly.
    - Implementations of `upper_bound_func` should leverage domain knowledge to find improvements efficiently.

  ### Critical Notes
  1. **Non-Uniqueness**: The result is **a** maximal element (not necessarily unique or the "best" in a total order). Your tool should return any maximal element.
  2. **Termination Warning**: The loop terminates only if `upper_bound_func` eventually finds a maximal element. To prevent infinite loops:
     ```python
     max_iterations = 100000  # Domain-specific safety
     iterations = 0
     while iterations < max_iterations:
