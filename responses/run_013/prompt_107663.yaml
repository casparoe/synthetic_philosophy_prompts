  Okay, the user is working on a metaphysics paper about virtual objects and virtual harms. They need a set of desiderata to evaluate theories on this topic. The main goal is to determine the moral and legal standing of virtual harms compared to real-world ones. 

  First, I need to understand their key concerns. They mention five cases that challenge standard accounts: duplication and reset, dependence on external factors, grief over virtual entities, theft/harassment with real impact, and users experiencing virtual presence. Each of these must be addressed by the desiderata.

  The user wants the desiderata to directly relate to assessing moral and legal standing. So any requirement that doesn't impact that should be excluded. For instance, technical implementation details might be irrelevant unless they affect harm or objecthood.

  I should identify core desiderata from the cases. For example, from duplication/reset: identity persistence needs to handle exact copies and reversals. From server dependence: contingency must be addressed without dismissing objecthood. Grief cases require explaining intentionality toward non-existent entities. Theft/harassment cases need to link virtual events to real harm. Presence cases must account for phenomenological reality.

  Potential conflicts: Maybe the requirement for phenomenological reality vs. contingency of existence. If users feel real presence, but the object depends on servers, theories might struggle to reconcile both. Also, intentionality toward virtual objects vs. their abstract nature could conflict.

  The most excluding requirement might be Phenomenological Reality Requirement. If a theory can't explain the vivid, bodily experiences users report, it fails a key aspect of virtual harm.

  For existing theories: Pretend theories might fail contingency and phenomenological requirements. Abstract artifact theories could struggle with duplication and persistence. Digital object theories might handle persistence but not phenomenological aspects.

  I need to ensure each desideratum clearly ties to moral/legal standing. For example, if a harm isn't phenomenologically real, its moral weight might be less. Or if an object's persistence isn't stable, ownership claims weaken.

  Also, flagging prejudices: Some might dismiss virtual grief as irrational. But the desiderata should treat user experiences as valid data points. Another prejudice is assuming digital objects lack realness because they're mutable.

  Finally, the list should help the user argue that existing debates skip defining success criteria. By setting these desiderata, they can show why theories succeed or fail, leading to a better framework for moral/legal analysis.
answer: |-
  Here's a structured list of desiderata for a theory of virtual objects and harms, derived from your cases and focused *specifically* on enabling a principled assessment of moral/legal standing. I've flagged potential conflicts, prejudices, and the most excluding requirement. A brief scorecard for major views follows the list.

  **Core Desiderata for Assessing Moral/Legal Standing of Virtual Harms:**

  1.  **Identity & Persistence Under Duplication/Reset (Case 1):**
      *   **Requirement:** The theory must explain what constitutes the "same" virtual object over time and across events like exact duplication or world rollback. Can an object be destroyed and then recreated identically? Does duplication create two identical objects or one object with instances?
      *   **Bearing on Standing:** Essential for concepts like ownership (did my *unique* item get stolen if it can be copied?), responsibility (who is responsible if a rolled-back world erases harm?), and harm permanence (is harm "undone" by a reset?).
      *   **Case:** Duplicating a rare sword; rolling back a server after harassment occurs.

  2.  **Contingent Existence & User Vulnerability (Case 2):**
      *   **Requirement:** The theory must account for the radical dependence of virtual objects on external, often commercial, infrastructure (servers, licenses, business decisions) *without* automatically reducing them to mere illusions or dismissing user investment.
      *   **Bearing on Standing:** Directly impacts the stability and security required for meaningful ownership claims, the locus of responsibility (who bears it when harm occurs due to platform failure?), and whether harms can be considered "real" if the target can be unilaterally erased.
      *   **Case:** A virtual world shut down by the company, deleting all user creations and relationships within it.

  3.  **Intentionality & Grief for the "Non-Existent" (Case 3):**
      *   **Requirement:** The theory must explain the *directedness* and *reality* of user emotions (grief, attachment, distress) towards virtual entities, even if those entities lack physical instantiation or are deemed "non-existent" by some accounts. It must avoid pathologizing or dismissing this grief as irrational.
      *   **Bearing on Standing:** If the *target* of grief/distress is deemed unreal, it severely undermines claims that the *harm* (the distress itself) warrants recognition, compensation, or even sympathy in the same way as grief for a physical object or being. This is core to assessing the "reality" of the harm.
      *   **Case:** Profound grief over a deleted virtual pet or companion AI.

  4.  **Real-World Impact & Valuational Link (Case 4):**
      *   **Requirement:** The theory must account for the tangible, negative consequences experienced by users in the physical world as a result of virtual events (financial loss, psychological distress, reputational damage) and the mechanisms linking virtual value (time, money, emotional investment) to real-world value.
      *   **Bearing on Standing:** This is crucial for establishing harm *concreteness* and *measurability*, which are prerequisites for legal standing and much moral consideration. It connects the virtual event to recognized harm types (theft, harassment, infliction of emotional distress).
      *   **Case:** Theft of a virtual item purchased with real currency; intense psychological distress and fear resulting from sustained avatar harassment.

  5.  **Phenomenological Reality & User Embodiment (Case 5):**
      *   **Requirement:** The theory must explain the vivid, often embodied, *experience* of users: feelings of presence, visceral reactions (startle), and lingering psychological states *as if* the virtual events happened physically. It must account for users for whom the virtual world holds primary significance.
      *   **Bearing on Standing:** The *quality* and *intensity* of the user's experience is central to the perceived severity of the harm and its moral weight. If the harm *feels* experientially real and impactful, it demands a different level of consideration than a purely intellectual slight. This challenges purely external/third-person accounts of harm.
      *   **Case:** Reporting bodily flinch during a virtual attack; lasting anxiety after virtual assault; users whose primary social life/identity resides online.

  **Critical Distinctions the Theory MUST Preserve:**

  *   **Virtual vs. Physical Instantiation:** It cannot *simply* collapse virtual objects into physical objects (e.g., server states) or vice versa. The distinct *mode* of existence matters.
  *   **Harm to User vs. Harm to Virtual Entity (If Any):** The theory must clearly distinguish between harms *experienced by the user* (distress, loss) and any potential harm *to the virtual entity itself* (e.g., "killing" an NPC vs. harassing a player's avatar). Moral standing primarily hinges on the former.
  *   **Intentional Action vs. Systemic Failure:** It must distinguish harms caused by malicious user/administrator actions (theft, harassment) from losses caused by platform decisions or technical failures (server shutdown, bug deleting items). Moral/legal responsibility differs significantly.
  *   **User Investment vs. Objective Value:** It must distinguish the value *derived from user investment* (time, money, emotion) from any purported *intrinsic value* of the virtual object itself. Moral/legal standing primarily rests on protecting the former.

  **Results the Theory MUST Be Consistent With:**

  1.  The *reality* of user psychological distress and financial loss stemming from virtual events.
  2.  The *contingency* and *malleability* of virtual worlds and objects (deletion, reset, duplication).
  3.  The *asymmetry* between user experience (feeling present, embodied) and the underlying digital/physical infrastructure.

  **Flagged Prejudices to Avoid:**

  *   **Physicalism Prejudice:** Automatically assuming that only physically instantiated entities can be real targets of genuine emotion or subjects of harm ("It's just pixels/bytes, get over it").
  *   **Hyper-Intellectualism Prejudice:** Dismissing intense user experiences because the *target* is deemed abstract or fictional, thereby pathologizing the user's reaction.
  *   **Commercial Reductionism:** Reducing virtual objects *solely* to their commercial value or contractual status (licenses), ignoring phenomenological and emotional dimensions crucial to assessing harm.
  *   **Gamer Culture Prejudice:** Assuming all users have a detached, "it's just a game" attitude, ignoring cases of deep investment, identity formation, and trauma.

  **Potential Conflicts Between Desiderata:**

  *   **Phenomenological Reality (5) vs. Contingent Existence (2):** Can an entity that feels experientially real and grounding for a user's identity/world simultaneously be so fragile and dependent on commercial whims? Reconciling the *felt stability and significance* with the *actual precariousness* is a major challenge.
  *   **Identity/Persistence (1) vs. Contingent Existence (2):** Can robust identity conditions be defined for entities whose very existence is inherently unstable and externally controlled? Does strong persistence undermine the reality of contingency, or vice versa?
  *   **Intentionality/Grief (3) vs. Abstract Nature (Potential Implication):** If virtual entities are fundamentally abstract (e.g., types, patterns), how can grief be *directed* at them in the same way as grief for a concrete particular? Reconciling directed emotion with abstractness is difficult.

  **The Most Excluding Requirement:**

  *   **Phenomenological Reality & User Embodiment (Requirement 5).** This requirement most directly challenges theories that downplay the first-person user experience or reduce virtual interactions to mere symbolic manipulation. It excludes views that cannot account for the visceral, embodied, and sometimes world-defining experiences users report, which are central to the *felt severity* of virtual harms and thus their moral weight.

  **Brief Scorecard of Main Contenders Against Desiderata:**

  1.  **Pretense/Make-Believe Approach (Virtual objects are props for imagination, harms are part of the game/story):**
      *   **Fails:** Contingent Existence (2 - trivializes dependence), Intentionality/Grief (3 - dismisses "real" grief as failed pretense), Phenomenological Reality (5 - cannot explain embodied presence/distress), Real-World Impact (4 - struggles with RMT theft/distress beyond the game frame). *Poor fit for moral standing.*
  2.  **Abstract Artifacts (Virtual objects are created abstract types, like stories or musical works):**
      *   **Strengths:** Identity/Persistence (1 - can handle duplication as instances), Contingent Existence (2 - artifacts depend on creators/sustaining practices).
      *   **Weaknesses/Challenges:** Intentionality/Grief (3 - hard to explain *directed* grief at an abstract type), Phenomenological Reality (5 - struggles with embodied experience), Real-World Impact (4 - links value/investment awkwardly). *Moral standing hinges heavily on protecting user investment/creation.*
  3.  **Ordinary Digital Objects (Virtual objects are specific configurations of data/physical states with causal powers):**
      *   **Strengths:** Real-World Impact (4 - clear causal chain to distress/loss), Phenomenological Reality (5 - can link experience to causal effects of digital states).
      *   **Weaknesses/Challenges:** Identity/Persistence (1 - struggles with exact duplication/rollback - is it the same data state?), Contingent Existence (2 - focuses on current instantiation, may downplay significance of potential erasure), Intentionality/Grief (3 - why grieve over a specific data pattern?). *Moral standing clear for user impacts, less so for "entity harm".*

  **Conclusion for Your Paper:** This desiderata list reveals that the key to assessing moral/legal standing lies in adequately explaining **user experience (phenomenology, investment, distress)** within the context of the virtual environment's **radical contingency and constructed nature**. The central tension is between the *felt reality and significance for the user* and the *external control and potential non-existence of the virtual target*. Any viable theory must bridge this gap without dismissing either side. Your argument that the debate needs this prior specification is strengthened by showing how existing contenders each fail on specific points crucial for the moral/legal question, often because they don't adequately grapple with this core tension defined by the desiderata. The list itself forces the question: Can something be both so experientially real *and* so contingently dependent? How a theory answers this dictates its approach to harm.
