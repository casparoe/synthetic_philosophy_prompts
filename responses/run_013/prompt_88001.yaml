  I need to argue that the irrationality persists in the preference structure itself, not the outcome. The consensus points should cover how money pumps reveal preference inconsistency, while the contested part will be my claim that the auction strategy doesn't resolve this defect. 

  The auction income is functionally equivalent to paying someone to induce preference coherence - it compensates for but doesn't fix the underlying irrationality. The core remains that at any given moment, her choices don't serve her own coherent ends. Even with the auction, she'd still walk through the pump steps if approached separately, proving the preference structure is unchanged.

