answer: |-
  ### Strict Translation: Lakatos’s MSRP in Evolutionary Terms  
  *(No analogies; no smuggled assumptions)*  

  1.  **Hard Core ≈ Lineage-Defining Constraints**  
      The immutable metaphysical commitments of a research programme are a set of deeply conserved, *non-negotiable traits* that define a scientific lineage. These are not genes but *developmental constraints*—boundary conditions that canalize variation, ensuring the lineage’s identity persists across generations (e.g., "natural selection explains adaptation" in Darwinism). Mutations violating these are lethal to lineage coherence.  

  2.  **Protective Belt ≈ Phenotypic Buffer Zone**  
      Auxiliary hypotheses surrounding the core function as *phenotypic plasticity*. These are modifiable traits (e.g., specific models, initial conditions) absorbing environmental "stress" (anomalies). Adjustments here are like plastic responses—morphological or behavioral shifts—that maintain the core’s integrity without altering lineage-defining constraints.  

  3.  **Negative Heuristic ≈ Stabilizing Selection Regime**  
      The prohibition against attacking the core acts as *stabilizing selection*: any variation (theoretical mutation) destabilizing the core is selected against, maintaining lineage stasis. It’s a *filter* eliminating deviations that threaten lineage identity.  

  4.  **Positive Heuristic ≈ Directional Selection Trajectory**  
      The programme’s guidance for constructing/modifying the protective belt operates as *directional selection pressure*. It predicts and channels variation toward specific trait spaces (e.g., "develop models of gradualism")—like adaptive peaks on a fitness landscape. This shapes how the lineage radiates theoretically.  

  5.  **Progressive Problem-Shift ≈ Adaptive Radiation**  
      A programme absorbing anomalies while predicting novel facts is a lineage undergoing *adaptive radiation*: it diversifies into new niches (empirical domains) via trait innovation (theory modification), increasing its relative fitness (explanatory/predictive scope).  

  6.  **Degenerating Problem-Shift ≈ Relictualization**  
      A programme only patching anomalies ad hoc, with no novel predictions, is a lineage undergoing *relictualization*. It persists in marginal niches (limited domains) through phenotypic plasticity (tweaking models), but suffers reduced fitness (stagnant explanatory power) and risks extinction.  

  7.  **No Instant Rationality ≈ Contingent Drift-Selection Interplay**  
      The rejection of instant falsification mirrors evolution’s rejection of instant adaptation. Lineages survive anomalies via *drift* (stochastic persistence in suboptimal niches) or *selection* (directed adaptation). Appraisal requires observing lineage trajectories—not snapshots.  

  ---

  ### Residue Report: What Translates, What Fudges, What Fails  
  **Clean Translations**  
  - Protective belt ≈ Phenotypic plasticity (absorbs perturbation).  
  - Degenerating shift ≈ Relictualization (persistence without innovation).  
  - No instant rationality ≈ Contingency of drift/selection outcomes.  

  **Fudged Translations** (Require Conceptual Stretching)  
  - **Positive Heuristic ≠ Directional Selection**: Directional selection acts on *existing* variation; positive heuristic is a *prescriptive roadmap* for generating *new* variation. Biology lacks this normative guidance.  
  - **Negative Heuristic ≠ Stabilizing Selection**: Stabilizing selection eliminates extremes; negative heuristic is a *rule* forbidding core variation. The latter is prescriptive, not emergent.  
  - **Hard Core ≠ Developmental Constraints**: Constraints are descriptive (e.g., physics limits); hard core is normative (e.g., "must defend core").  

  **Failed Translations** (No Evolutionary Expression)  
  - **Progressive/Degenerating as Epistemic Norms**: Evolution lacks equivalents for "theoretical progress" (novel predictions) or "degeneration" (loss of heuristic power). These are evaluative, not descriptive.  
  - **Heuristic/Appraisal Duality**: MSRP splits *prescriptive* heuristics (future guidance) from *retrospective* appraisal. Evolution has no such duality—it’s purely retrospective.  
  - **Problem-Shifts as Rational/Non-Rational**: Evolution judges outcomes by persistence; MSRP judges by truth-tracking potential. The latter has no biological counterpart.  

  ---

  ### Addressing Your Three Questions  
  **(a) Can "progressive" be non-teleological?**  
  Yes, *if* stripped of "progress." In ecology, adaptive radiation is non-teleological: it’s diversification increasing short-term fitness. MSRP’s "progressive" similarly denotes *expanding explanatory scope* (more niches occupied). But Lakatos smuggles teleology via "novel predictions"—implying directional improvement toward truth. Ecology’s radiation has no such aim.  

  **(b) Heuristic/Appraisal split ≈ Forward/Retrospective biology?**  
  **False friend.** Heuristics are *prescriptive* (how *to* modify theories); forward ecology is *predictive* (how traits *will* spread). Appraisal is *normative* (was the shift rational?); phylogenetics is *descriptive* (what traits *did* persist). The split maps to *ought* (heuristics) vs. *was* (appraisal)—biology lacks the "ought."  

  **(c) Is a degenerating programme just drift?**  
  **Category error.** Drift is stochastic allele frequency change; degenerating programmes *may* persist via socio-cultural selection (funding, prestige). Calling this "drift" misapplies population genetics. Persistence without *epistemic* selection ≠ genetic drift.  

  ---

  ### Verdict: Why Translations Fail  
  **Lakatos was dressing up sociology as epistemology.** The untranslatable residues—*prescriptive heuristics, normative appraisal, teleology in "progress"*—are epistemic norms MSRP imposes *externally*. Evolution lacks these because:  
  1. **Biology is descriptive**: It explains *how* lineages persist, not *why they should*.  
  2. **MSRP’s "rationality" is idealized**: It claims programmes *ought* to pursue novel predictions. Evolution has no "ought"—only adaptation or extinction.  
  3. **The heuristic/appraisal duality is a philosophical scaffold**: It frames science as a rational enterprise, while evolution is agnostic to rationality.  

  When MSRP labels a degenerating programme "irrational" but long-lived, it reveals its core: a *normative epistemology* judging science by idealized standards. Evolution can describe *how* such programmes persist (niche construction, cultural selection) but not condemn them as "degenerate." The residue isn’t biology’s flaw—it’s Lakatos grafting Popperian rationality onto Kuhnian sociology. Your suspicion is correct: the borrowed prestige is showing.
