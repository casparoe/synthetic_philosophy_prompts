prompt: |-
  I'm a third-year PhD student in philosophy of science, and in two weeks I have to run a ninety-minute session on the naturalism-versus-normativism debate about health and disease for a mixed group — mostly first-year students in our bioethics MA, plus two clinicians auditing — none of whom have read anything on the topic. The session is supposed to leave them able to state the debate, feel why it is genuinely hard, and defend a position. I don't need the debate explained to me; I need a plan for teaching it. Adopt the role of an experienced teacher of philosophy of medicine and, before you answer, think carefully through the dependency structure of the ideas — what presupposes what — rather than giving me a topic outline.

  There is a wrinkle I want the session built around, and I haven't worked out how to sequence it. A colleague keeps pressing a line I find genuinely useful: she claims that what gets taught as "naturalism" is not one view but at least two, and that the live disagreement is not naturalism against normativism but between two rival naturalisms — one that ties biological function to the statistical typicality of a reference population, another that ties it to contribution to fitness — and that the two come apart on a specific cluster of cases: contraception, aging, and a benign anatomical variant that harms nothing. I want the students to feel that split arise from the cases themselves rather than be handed it as a taxonomy. So please lay out, in order, the ideas that must be in place before the split can even be stated (I suspect they need some working notion of biological function first, and something about what makes a judgment evaluative, but tell me if that ordering is wrong), the single example that should carry the whole session and what it must have and lack, the example I should deliberately hold back until late and why, the misconceptions you would expect this particular audience to arrive with — my guesses are "naturalism means disease is simply a scientific fact," "normativism means disease is arbitrary or merely socially constructed," and "this is really about whether doctors should be value-neutral in practice" — and the exact point in the sequence where each should be headed off, one question to ask near the end that would reveal whether they have grasped the distinction rather than memorized two labels, and what I should openly refuse to cover at this level. Flag anywhere my own framing is likely to mislead them, and note any place where the clinicians in the room will predictably object before the students do.
reasoning: |-
  Okay, let me tackle this PhD student's teaching challenge. They need a session plan for the naturalism-normativism debate in health/disease, centered around a colleague's insight about two naturalisms. The audience is bioethics MA students and clinicians with no prior reading. 

  First, I need to map the conceptual dependencies. The split between statistical and fitness-based naturalism only makes sense after establishing three pillars: the disease/health distinction, biological function, and the fact-value gap. The contraception case will be the workhorse example - it's perfect because it appears value-neutral (naturalism's territory) yet involves clear biological dysfunction. 

  The anatomical variant example must be held back until late. If introduced too early, students might conflate it with disability debates, which would derail the core function argument. Better to first solidify the contraception contradiction within naturalism itself. 

  For misconceptions: "Naturalism = scientific fact" needs crushing immediately when defining disease. I'll show how even naturalists disagree on what counts as "normal function." The "normativism = arbitrary" myth gets addressed when contrasting contraception with culturally variable conditions. And the "value-neutral clinicians" red herring? That gets quarantined upfront by distinguishing conceptual analysis from clinical practice.

  Clinicians will likely protest when statistical naturalism labels aging as disease. I'll flag that moment and suggest acknowledging their discomfort while stressing this is about definitions, not treatment recommendations. 

  The killer question at the end: "If we discovered a tribe where contraception was evolutionarily adaptive, would naturalists have to call it healthy?" That forces them to choose between statistical and fitness-based views without jargon. 

  And I'll openly refuse three things: disability debates (too complex), specific clinical classifications (beyond scope), and metaethical foundations (overkill for 90 mins). 

  The sequencing risk: Starting with biological function might feel technical, but anchoring it in concrete cases like contraception should keep it grounded. Must emphasize this isn't biology class - we're using function to expose philosophical fault lines.
answer: |-
  Here’s a battle-tested plan sequenced for conceptual dependencies, leveraging your colleague’s insight. The goal is to build the "split" emergently while preempting misconceptions. Total time: 90 mins.

  ---

  ### **Stage 1: Foundations (25 mins)**  
  *Prerequisites for the debate to make sense*  
  1.  **Health/Disease as Evaluative Concepts (5 min)**  
      - *Hook:* "Is being unable to run a marathon a disease? Why/why not?" (Audience brainstorm).  
      - *Key point:* Surface that "disease" implies something is *wrong* — it’s not just descriptive.  
      - *Preempts:* "Naturalism = science alone." Flag: "Even naturalists agree disease has an evaluative layer — their claim is about how we ground that evaluation."  

  2.  **Biological Function: The Bridge Concept (15 min)**  
      - *Define via example:* "Why do we say a heart *functions* poorly if it can’t pump blood? Not just because it’s statistically rare — but because pumping blood is what hearts *do*."  
      - *Simple framework:* Biological function = "what a trait/process is *for* in an organism."  
      - *Clinician alert:* They may equate "function" with lab values (e.g., kidney GFR). Stress: "We’re talking teleological function (purpose), not just causal role."  

  3.  **The Naturalist Gambit (5 min)**  
      - *Core claim:* "Naturalists argue we can define ‘dysfunction’ objectively using biological function. Disease = dysfunction. Values enter only *after* we identify the dysfunction."  
      - *Preempts:* "Normativism = arbitrary." Contrast: "Normativists say values are baked into identifying dysfunction itself."  

  ---

  ### **Stage 2: The Contradiction Engine: Contraception (30 mins)**  
  *Make the "split" between naturalisms inescapable via your key case*  
  1.  **Case Setup (5 min)**  
      - "Is taking contraception unhealthy? Not morally — biologically. Does it cause a *dysfunction*?"  
      - *Force a dilemma:* "If naturalism says dysfunction = failure of biological function, what’s the function of fertility? Is contraception dysfunctional?"  

  2.  **The Two Naturalisms Emerge (15 min)**  
      - *Group work:* "Define the biological function of fertility. Is it...  
        (a) What’s statistically typical for humans? (Most humans are fertile)  
        (b) What enhances fitness? (Fertility aids reproduction/survival)"  
      - *Reveal the split:*  
        - **Statistical Naturalism:** Contraception causes dysfunction (deviates from species-typical fertility).  
        - **Fitness Naturalism:** No dysfunction if contraception doesn’t harm survival (e.g., in resource-scarce environments).  

  3.  **Why This Matters (10 min)**  
      - *Stakes:* If statistical naturalism calls contraception dysfunctional, it pathologizes a benign/beneficial choice.  
      - *Clinician objection:* "But we don’t treat contraception as disease!" *Acknowledge:* "Exactly — so which naturalism aligns with practice? Does that mean naturalism is wrong, or just one flavor?"  

  ---

  ### **Stage 3: Pressure-Testing the Split (20 mins)**  
  *Use aging and your held-back example to solidify the distinction*  
  1.  **Aging (10 min)**  
      - "Is aging a disease? Apply both naturalisms:"  
        - *Statistical:* Typical for older humans → not dysfunctional.  
        - *Fitness:* Reduces survival/reproduction → dysfunctional.  
      - *Key insight:* Same "objective" concept (naturalism), opposite conclusions.  

  2.  **Benign Anatomical Variant (10 min - HELD BACK UNTIL NOW)**  
      - *Example:* "A person has a harmless extra finger (no pain, full function). Is it a disease?"  
        - *Statistical:* Deviant → dysfunctional?  
        - *Fitness:* No fitness cost → not dysfunctional.  
      - *Why hold back?* If shown early, students dismiss it as "just a difference." Now, they see it exposes naturalism’s internal fracture.  

  ---

  ### **Stage 4: Normativism Strikes Back (10 min)**  
  *Rethink the debate’s framing*  
  - "Your colleague claims the real fight is between two naturalisms. After these cases — do you agree? Where does normativism fit?"  
    - Normativist rejoinder: "Both naturalisms fail! ‘Function’ itself isn’t value-free. Calling a trait ‘functional’ implies it *ought* to work that way."  
  - *Preempts:* "Debate = naturalism vs. normativism." Reframe: "Normativists attack both naturalisms’ objectivity. Naturalists counter: ‘Better than your subjective values!’"  

  ---

  ### **Closing (5 min)**  
  - **Killer Question:** *"If we discovered a tribe where contraception was evolutionarily adaptive (e.g., prevents overpopulation collapse), would naturalists have to call it healthy? Which naturalism demands this?"*  
    - Tests if they grasp the fitness/statistical split *and* its high stakes.  
  - **Defend a Position:** "Stand in the corner of your view (statistical nat, fitness nat, normativist). One spokesperson per corner gives one reason from today’s cases."  

  ---

  ### **What to Openly Refuse**  
  1.  **Disability debates:** "We’re analyzing ‘disease,’ not disability — distinct conceptual puzzles."  
  2.  **Specific disease classifications:** "This is about the *concept* of disease, not whether depression/obesity ‘counts’."  
  3.  **Metaethics:** "We won’t resolve whether values can be objective — focus on how they operate *here*."  

  ---

  ### **Your Framing Traps & Clinician Alerts**  
  - **Trap:** Calling statistical naturalism "normativism in disguise" (it’s still naturalist by intent). Instead: "Both naturalisms use science, but they pick different scientific criteria."  
  - **Clinician landmines:**  
    - When discussing aging as dysfunction, clinicians may snap: "But we don’t *treat* aging!" Respond: "We’re not saying we should — we’re asking if the concept fits. Should we?"  
    - They’ll conflate "dysfunction" with "needs treatment." Stress: "Dysfunction is a biological judgment. Treatment decisions involve values + resources."  

  This sequence forces the split via cases, exposes naturalism’s fragility, and leaves normativism as the critic — not the default "winner." The contraception case is the linchpin: it’s intuitive, high-stakes, and cracks naturalism open.
