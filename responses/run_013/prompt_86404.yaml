answer: |-
  Below is a decision tree that categorizes positions on the question, "What would you want if you were wiser, better informed, and more rational?" The tree is built from questions only, with named positions ("leaves") appearing at the end. Each leaf includes its most awkward commitment. Combinations with no occupants are flagged, and inseparable leaves are noted.

  ---

  ### **Decision Tree: Positions on Idealized Desires**

  1. **Is the concept of an "idealized self/group" central to defining "what you really want"?**
     - **No** → Go to 2.
     - **Yes** → Go to 3.

  2. **Is there *any* fact of the matter about "what you really want"?**
     - **No** → **Deflationary view** (e.g., eliminativism).  
       *Most awkward commitment: Denies practical guidance in dilemmas, leaving desires arbitrary.*
     - **Yes** → **How is it defined?**
       - By objective goods (e.g., health, knowledge, virtue) → **Objective-goods view**.  
         *Most awkward commitment: May ignore what *you* care about (e.g., "You should want vegetables, even if you hate them").*
       - By your actual second-order desires (what you want to want) → **Second-order-desire view**.  
         *Most awkward commitment: Your second-order desires might be irrational or manipulated (e.g., "I want to want cigarettes because ads told me to").*

  3. **Is there a fact of the matter about what the idealized subject would want?**
     - **No** → *Empty branch (unexplored: few defend a non-factual "idealization" as central).*
     - **Yes** → Go to 4.

  4. **Whose idealization?**
     - **Individual** → Go to 5.
     - **Group** (e.g., humanity, society) → Go to 10.

  5. **What is idealized?**
     - **Only beliefs** (correcting ignorance/miscalculation) → **Informed-desire view**.  
       *Most awkward commitment: Full information might make desires self-destructive (e.g., "You’d want to quit your job, even if it ruins you").*
     - **Beliefs and thinking** (perfect logic, no weakness of will) → Go to 6.
     - **Wants themselves** (removing "sour grapes" or adaptive preferences) → *Empty branch (unexplored: no major theory focuses solely on wants without beliefs/thinking).*

  6. **Are current wants held fixed during idealization?**
     - **Yes** (purify existing preferences) → **Preference-purification view** (economics).  
       *Most awkward commitment: Assumes a "true" preference under the noise, which may not exist (e.g., "Your 'real' preference is the average of your erratic choices").*
     - **No** (re-form wants after idealization) → Go to 7.

  7. **Order of operations: Which comes first?**
     - **Fix beliefs, then apply perfect rationality** → *Empty branch (unexplored: likely incoherent; rationality requires updated beliefs).*
     - **Apply perfect rationality first, then fix beliefs** → *Empty branch (unattractive: a rational fool with bad beliefs may want nonsense).*
     - **Simultaneous/emergent process** → Go to 8.

  8. **For a given individual, is the ideal want unique?**
     - **No** → *Empty branch (unattractive: if ideal-you contradicts itself, which "you" wins?).*
     - **Yes** → Go to 9.

  9. **If ideal-you wants something actual-you doesn’t, does ideal-you win?**
     - **Yes** → **Coherent Extrapolated Volition (CEV) for individuals** (rare variant).  
       *Most awkward commitment: Ideal-you may be alien to actual-you (e.g., "Ideal-you wants solitude, but you’re a social butterfly").*
     - **No** → *Empty branch (incoherent: if ideal-you doesn’t override, why call it "real" desire?).*

  10. **How is the group idealized?**
      - **As an impartial observer** (detached, unbiased) → **Ideal-observer view**.  
        *Most awkward commitment: Impartiality may demand sacrifices you’d never accept (e.g., "Give 90% of your income to strangers").*
      - **As humanity’s coherently extrapolated volition** → **CEV** (classic AI-aligned version).  
        *Most awkward commitment: Unclear how to aggregate diverse individuals into one "will" (e.g., "Whose values dominate?").*
      - **As a negotiation among idealized individuals** → *Empty branch (unexplored: no clear mechanism to resolve disagreements).*

  ---

  ### **Notes on the Tree**
  - **Empty branches**: 
    - Step 3 ("No" branch): No major position treats idealization as central but non-factual.
    - Step 5 ("Wants themselves"): No theory skips beliefs/thinking.
    - Steps 7 and 9: Conflicts in order of operations or authority are unresolved/unattractive.
  - **Inseparable leaves**: 
    - **Ideal-observer view** and **CEV** both occupy Step 10. They share commitments (group-level, factual idealization) but diverge on impartiality vs. extrapolation. The tree splits them by the *method* of group idealization.
    - **Informed-desire** and **preference-purification** are separated by whether wants are fixed (Step 6).
  - **Most awkward commitments**: Highlighted per leaf above.
  - **Key tensions**:
    - **Authority**: Views that idealize beyond beliefs (e.g., character) risk making "ideal-you" a stranger.
    - **Fairness**: Adding perfect rationality (Step 5, "Beliefs and thinking") is "unfair" idealization; only removing ignorance (Step 5, "Only beliefs") is "fair."
    - **Convergence**: Group views (Step 10) assume convergence; individual views (Step 8) assume uniqueness to avoid contradictions.

  ### **Summary of Leaves**
  1. **Deflationary view**: "Idealized desires" are fiction.  
     *Awkward: No standard to resolve conflicts.*
  2. **Objective-goods view**: Skip idealization; desire what’s objectively good.  
     *Awkward: Ignores personal values.*
  3. **Second-order-desire view**: What you want to want defines "real" desire.  
     *Awkward: Second-order desires can be irrational.*
  4. **Informed-desire view**: Idealize only beliefs.  
     *Awkward: Full info might breed reckless desires.*
  5. **Preference-purification view**: Fix wants, remove noise/irrationality.  
     *Awkward: No "true" preference may exist.*
  6. **CEV (individual variant)**: Idealized, coherent individual desire wins.  
     *Awkward: Ideal-you may be unrecognizable.*
  7. **Ideal-observer view**: Group idealization via impartiality.  
     *Awkward: Demands extreme impartiality.*
  8. **CEV (classic)**: Group idealization via extrapolated volition.  
     *Awkward: Unclear aggregation method.*

  This tree isolates core disagreements (e.g., how much to idealize, who "wins") while exposing gaps in theory. Use it to map arguments by answering the questions sequentially.
