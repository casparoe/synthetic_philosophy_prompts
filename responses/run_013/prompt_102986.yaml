prompt: |-
  So my buddy and I got into it last night — we were up till 1am — about whether you can ever rationally believe something while also believing that believing it is irrational. He says that's incoherent, period, like it's a flat contradiction. I say there's gotta be a case where the first-order stuff and the higher-order stuff pull in different directions, and you're stuck being akratic, and it's not your fault. I couldn't come up with a clean example on the spot though, and I want to win this arguement, so build me one.

  Specs, roughly in order of how much I care:

  - One scenario, one paragraph, realistic — a workplace, a lab, a clinic, a garage, whatever. No brains in vats, no demons, no mad scientists, no pills that make you bad at logic, no "you've been secretly hypnotized to believe nonsense" stuff. I want something a normal person could actually be in.
  - The agent needs real first-order evidence for p — evidence that, on its own, makes p the thing to believe — and *also* higher-order evidence that it's irrational for her to believe p. Both have to be genuine. Neither one can be a mistake on her part, so she's not just confused about the levels.
  - The higher-order evidence has to be about her reliability or her method, not about p itself, and it should come from somewhere independent and trustworthy. I don't want the cheap version where the "higher-order" evidence secretly just tells her something about p (like "your thermometer is broken"), because then she can just fix the instrument and there's no akrasia left.
  - Crucial: she can't redo the reasoning and get a better answer. The judgment should be a one-off, non-repeatable call — you can't rerun it, you can't check it against a second measurement. That's what makes it bite.
  - Don't stipulate the verdict. The akrasia has to fall out of the evidence plus the plausible norms, not from you announcing "and so she's akratic." If it only works because you said so, it's cheating, and my friend will smell it instantly.

  After the scenario, walk me through it: what p is, what the first-order evidence is and what verdict it forces, what the higher-order evidence is and what verdict *it* forces, and why the two don't just collapse into each other. Then tell me which single feature of the case is doing the real work, and what happens to the whole thing if I delete that feature — does it decay into a boring ordinary case? Then, honestly, tell me how my friend would attack it: what would someone who thinks akrasia is never rational say is wrong here? Don't hand-wave that one, give me his strongest actual move.

  Finally, dump the whole thing as a JSON object so I can paste it into our group chat. Fields: "scenario" (the one-paragraph case), "proposition_p" (the thing she believes), "first_order_evidence" (what it is and the verdict it supports), "higher_order_evidence" (what it is and the verdict it supports), "why_not_same_level" (why the higher-order stuff isn't just more first-order evidence about p), "key_feature" (the one feature carrying the case), "removal_test" (what happens if that feature is removed), "best_objection" (my friend's strongest move against the case), "verdict" (your honest call: is she rationally required to be akratic, merely permitted, or neither).
