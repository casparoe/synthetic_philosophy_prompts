  Okay, the user is a political theory student grappling with a specific conceptual gap regarding historical injustice and collective responsibility. They've identified a structure where present-day communities are held responsible for past wrongs committed by predecessor regimes, despite discontinuities in agency, membership, and institutional identity. 

  The user's frustration is palpable—they've clearly done the reading but found existing terminology inadequate. This isn't just about definitions; they're wrestling with the moral architecture of redress. Their rejection of "collective guilt" (too synchronous), "inherited guilt" (too metaphysical), "beneficiary responsibility" (insufficiently inclusive), and "structural injustice" (wrong temporality) shows sophisticated conceptual mapping. 

  What they're really after is precision: a term that captures the paradox of non-agent continuity in collective responsibility. The core tension is between moral attribution and historical rupture—how can "we" be responsible when "we" didn't exist as the acting agent? 

  I recall Margaret Gilbert's plural subject theory might help frame the "successor collective" idea, and perhaps Janna Thompson's work on intergenerational obligations. The term needs to reflect three layers: (1) the break in agency, (2) the persistence of obligation through institutional lineage rather than bloodline, and (3) the present community's role as moral inheritor rather than perpetrator. 

  "Discontinuous collective responsibility" feels right—it foregrounds the rupture while preserving collectivity. The user will likely push back if the definition doesn't rigorously exclude adjacent concepts, so boundaries matter: it's not about individual culpability, requires institutional lineage, and applies only when the state itself perpetuates the harm's legacy. 

  The coinage should resist metaphysical leakage—no talk of "national souls"—while acknowledging that material redress (reparations, curriculum reform) bridges the discontinuity. This isn't about feeling guilty; it's about being institutionally tasked with repair.
answer: |-
  The structure you're describing is indeed a distinct conceptual gap in the literature—a form of **"Discontinuous Collective Responsibility" (DCR)**. It arises precisely at the intersection of collective agency, intergenerational justice, and institutional discontinuity. Below is a formal carving of the concept, differentiating it from adjacent terms:

  ### **Discontinuous Collective Responsibility (DCR): Defined**  
  *The moral-political obligation of a present-day political community to acknowledge and redress a historical wrong committed by a predecessor state or regime, where:*  
  1.  **The Wrongdoer**: The original act was committed by a *collective entity* (a state, regime, or institutionalized group).  
  2.  **The Addressee**: The entity called to account is the *successor political community* (current state/nation).  
  3.  **Agency Discontinuity**: There is a *rupture in institutional or agential continuity* between the wrongdoer and the addressee (e.g., regime change, constitutional overhaul, demographic shift).  
  4.  **Non-Metaphysical Basis**: The obligation stems from *institutional succession*, *enduring structural legacies*, or *the community’s identity as a moral project*—**not** biological descent, metaphysical guilt-transfer, or direct benefit.  
  5.  **Expression**: Requires *public, institutional acts* (apologies, reparations, memorialization) by the *current state apparatus*.  

  ---

  ### **Boundaries: What DCR Includes vs. Excludes**  
  | **Included**                                      | **Excluded**                                      |  
  |---------------------------------------------------|--------------------------------------------------|  
  | Post-apartheid South Africa addressing apartheid  | Germany prosecuting living Nazi war criminals (individual guilt) |  
  | Contemporary U.S. reparations for slavery debates | A corporation paying damages for its own pollution (synchronous collective responsibility) |  
  | Australia’s apology to Stolen Generations         | Children feeling shame for parents’ crimes (familial inherited guilt) |  
  | Canada’s TRC for residential schools              | Paying taxes that fund welfare (beneficiary responsibility) |  
  | Turkey/Armenia genocide recognition demands       | Addressing present-day sexism (structural injustice) |  

  ---

  ### **Differentiation from Adjacent Concepts**  
  1.  **Collective Guilt** (e.g., Larry May, Karl Jaspers):  
      - **Difference**: Collective guilt assumes *contemporaneous agency*—the group acted together at *t₁*. DCR *denies* this continuity. The present group bears responsibility *despite* not being the acting agent.  
      - **Example**: The German people’s guilt for Nazism (Jaspers) vs. modern Germany’s DCR for colonialism (where the Kaiserreich ≠ FRG).  

  2.  **Inherited Guilt** (e.g., theological/folk conceptions):  
      - **Difference**: Inherited guilt implies *metaphysical transmission* (e.g., "sins of the fathers"). DCR is *institutional* and *political*, grounded in the successor state’s role in upholding/denying legacies.  
      - **Example**: "White guilt" for slavery (inherited) vs. the U.S. federal government’s DCR for slavery (due to constitutional/legal succession).  

  3.  **Beneficiary Responsibility** (e.g., Daniel Butt, Robert Goodin):  
      - **Difference**: Beneficiary responsibility focuses on *unjust enrichment*. DCR *may* involve beneficiaries but is *not contingent* on it. Obligation arises from *political community membership* and *institutional continuity*, even for new immigrants/non-beneficiaries.  
      - **Example**: A recent immigrant to the U.S. pays taxes funding reparations (DCR) despite no ancestral benefit.  

  4.  **Structural Injustice** (e.g., Iris Young, Sally Haslanger):  
      - **Difference**: Structural injustice addresses *ongoing systems*. DCR addresses *completed historical events* whose *legacies persist institutionally*. The *wrong* is past, but the *duty to rectify* is present.  
      - **Example**: Fighting current housing segregation (structural) vs. reparations for redlining (DCR for past policy).  

  ---

  ### **Theoretical Grounds for DCR**  
  DCR is justified by three overlapping arguments:  
  1.  **Institutional Succession**: States inherit obligations as legal successors (e.g., treaties, debts). Moral debts for state crimes extend analogously (Thompson, *Taking Responsibility for the Past*).  
  2.  **Moral Community Continuity**: Political communities are "projects across time" (Tamir). Present members join a community whose identity is shaped by past injustices, creating duties of narrative fidelity (Blustein, *The Moral Demands of Memory*).  
  3.  **Structural Legacy**: Past wrongs distort *current* institutions (e.g., wealth gaps from slavery). The state perpetuates harm by *failing to rectify* embedded inequities (McCarthy, *The Limits of Repair*).  

  ---

  ### **Why This Carving Matters**  
  - **Avoids Metaphysical Baggage**: DCR rejects blood guilt while demanding institutional accountability.  
  - **Clarifies Agency**: The *state* (not individuals) is the primary duty-bearer.  
  - **Explains Immigrant Inclusion**: Obligation derives from joining a polity whose institutions bear historical legacies, not ancestry.  
  - **Focuses on Repair**: DCR mandates *forward-looking acts* (reparations, education) over retroactive blame.  

  **Key Literature**:  
  - Janna Thompson, *Taking Responsibility for the Past* (2002)  
  - Melissa S. Williams, *Justice Toward Groups* (1995)  
  - Bernard R. Boxill, *A Lockean Argument for Black Reparations* (2003)  
  - Jeremy Waldron, *Superseding Historic Injustice* (1992)  

  This framework isolates the precise tension you identified: a demand for collective responsibility *across* broken agency. DCR names the paradox—and offers a path to resolve it through institutional, not metaphysical, obligation.
