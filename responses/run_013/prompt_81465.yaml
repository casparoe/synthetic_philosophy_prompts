answer: |-
  Sharp! You've hit the classic embedding objection. Fine, let's slice it.

  1.  **Conditionals ("If mocking is wrong..."):** That whole sentence expresses *my* complex attitude. It says, "Given that *I disapprove* of mocking, *I also disapprove* of daring others." It's not asserting a detached fact about "wrongness"; it's expressing a connection *between* my stances. The meaning of "wrong" *is* consistent – it always signals disapproval – but its *force* shifts. Flat-out "Mocking is wrong" directly expresses disapproval; in the conditional, it's building a rule for *my* disapproval based on hypothetical consistency.

  2.  **Negation ("It's not the case that mocking is wrong"):** You just expressed *rejection* of the disapproval-attitude towards mocking. You're *not* thereby expressing *approval* (that's a different attitude – "It's *good* to mock"). You're saying, "I *don't* hold the attitude of disapproval towards this." It's like saying "I don't like chocolate" vs. "I dislike chocolate." The first rejects liking without asserting disliking.

  3.  **Questions ("Is mocking wrong?"):** You're not *expressing* disapproval; you're *inquiring* whether you (or others) *should* feel disapproval. It's an invitation to *consider adopting* the attitude, or to *report* existing attitudes. Its function is to seek alignment or information about stances, not to assert a stance itself.

  4.  **Validity:** The argument works because it tracks *consistency in attitudes*. If you sincerely hold the attitude "Disapprove of mocking" *and* the attitude "Disapprove of daring others *if* I disapprove of mocking," then you *must*, to avoid practical inconsistency, adopt "Disapprove of daring others." The validity comes from the *internal logic of your own commitments*, not from truth-preservation of external facts. It's a pattern of attitudes compelling further attitudes – "a string of noises" *only* if you ignore the *practical reasoning* about your own reactive stances that the language is coordinating. Your turn. What makes you think "truth" explains this better than tracking the demands of coherent practical commitments?

  Go ahead. Challenge that.
