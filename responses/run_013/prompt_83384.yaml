answer: |-
  ### Dialogue: The Standing Grant  
  **Characters:**  
  - **Elena**: Argues that valid consent requires only competence, non-deception, and freedom to exit.  
  - **Ravi**: Argues that valid consent requires the Scope Condition—actions must remain within what the consenter could actually have authorized.  

  ---

  **Elena**: Ravi, take the Standing Grant case. At twenty, this woman signed a contract with full awareness of the broad categories. For forty years, she’s stayed—competent, undeceived, and free to withdraw. Her ongoing participation *is* her consent. The Scope Condition you propose would cripple society. If every long-term arrangement required us to foresee every twist, marriages would dissolve when partners change, careers when roles evolve, constitutions when interpretations shift.  

  **Ravi**: Elena, freedom to exit isn’t magic. Yes, she *could* leave, but the buy-out penalty grows over decades. By year forty, exiting means forfeiting benefits she’s paid into for half her life—effectively trapping her. More importantly, consent isn’t just about avoiding force or fraud; it’s about *authorization*. She authorized a specific framework, not whatever the bank dreams up later. If I lend you my car for groceries, and you drive it across the country, my silence isn’t consent—it’s violation.  

  **Elena**: But your car analogy fails because the bank *stays within the letter* of her grant. She agreed to "investment decisions," "medical data use," and "mutual obligations." Drift within those bounds is foreseeable—it’s why she chose a flexible institution. Marriage vows are just as broad: "in sickness and health." If my spouse becomes paralyzed, I didn’t foresee it, but my ongoing commitment *is* consent. The Scope Condition would freeze all relationships into static contracts.  

  **Ravi**: Marriage is a false parallel. Partners renegotiate daily through words and actions—a living dialogue. The consent bank operates unilaterally; she’s passive. Crucially, marriage’s "sickness and health" is a *shared moral horizon* both enter. The bank’s drift might exploit data in ways antithetical to her values—say, selling it to military contractors under "research." If she couldn’t fathom that at twenty, how can it be authorized?  

  **Elena**: Then let’s talk constitutions. The U.S. Founding Fathers didn’t foresee the internet, yet we apply the First Amendment to online speech. By your logic, modern citizens don’t consent to governance because they didn’t authorize digital-era interpretations. But they stay, vote, and pay taxes—that *is* consent. Withdrawal (emigration) is always an option, even if costly.  

  **Ravi**: Constitutions have amendment processes—explicit reauthorization mechanisms. The consent bank has none. It’s pure delegation without accountability. And emigration *isn’t* analogous; leaving a country imposes no punitive fee engineered by the state. That penalty is the bank’s design, making exit formally "free" but materially oppressive. Autonomy requires more than a theoretical escape hatch—it requires ongoing alignment with the agent’s will.  

  **Elena**: So must every institution become a direct democracy? Careers aren’t democracies. If I join a firm as a coder, and they shift me to AI ethics, I might hate it—but if I stay, I consent. The exit cost (lost seniority, job search friction) is real, but it doesn’t invalidate my choice. Your Scope Condition is unworkably vague. How do we measure what someone "could actually authorize"?  

  **Ravi**: We already do it in contract law—via "reasonable expectations" and "good faith." A court would ask if the bank’s later acts were within the *spirit* of her original grant, not just its words. And careers *do* respect this: if your job description says "coding," and your boss forces you to clean sewers, that’s breach of contract. Scope matters. Consent isn’t blanket surrender; it’s bounded delegation.  

  **Elena**: Then what’s the boundary? If the bank invests ethically at first but later funds fossil fuels—both under "investment decisions"—is that out of scope? Her values might shift too. At sixty, she might applaud fossil fuels, though at twenty she hated them. The Scope Condition ignores that people change.  

  **Ravi**: And if she changes, she can *reaffirm* consent. But the bank never asks. That’s the point: valid consent requires mechanisms to ensure alignment over time. A one-time signature at twenty, for actions at sixty that she couldn’t conceive of, is a fiction of authorization. We don’t hold toddlers to promises; we shouldn’t hold elders to uninformed young commitments.  

  **Elena**: So must the bank halt every five years for re-signing? That’s unsustainable. And what of "could actually authorize"? At twenty, she might not grasp *any* future tech—does that void all tech-related decisions? Your standard risks paralyzing innovation.  

  **Ravi**: Not paralyzing—constraining abuse. The bank could seek approval for major deviations (e.g., "We’re now partnering with arms manufacturers"). For the rest, "reasonable foreseeability" suffices: if a practice is wildly beyond cultural norms when she signed, it fails the Scope Condition. We protect people from exploitation without stifling progress.  

  **Elena**: I’ll concede that exit must be *meaningfully* free—if penalties are crushing, consent weakens. But your Scope Condition still overreaches. If she stays, knowing the drift, her choice stands. Otherwise, we infantilize adults.  

  **Ravi**: And I’ll agree that exit being cheap matters. But without the Scope Condition, we let institutions hollow out consent until it’s a coerced allegiance to an alien system. That’s not autonomy—it’s entrapment by gradualism.  

