     Actually, if we are modeling a static system, then we have:

        V_i = f_i(V_{-i}, U_G)   for each i.

     This is a system of simultaneous equations and it can be very messy.

   Alternatively, we can model the entire system as:

        V = f(U_G)

     meaning that the entire vector V is a function of U_G. Then an intervention on V_i would mean that we break that function and set V_i to a value. But then how do we get the rest? We cannot, because the function f is broken. So we must assume that after intervention, God produces the rest of the world as a function of the intervened state? Then we are effectively changing the model.

   This becomes very messy. Therefore, it might be more straightforward to represent the world as a dynamic system with:

