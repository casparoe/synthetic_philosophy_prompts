   Key ideas from al-Ghazālī:
   1. Created things have no inherent causal powers. What we call causes are only occasions for God to produce the effects.
   2. There is no necessary connection between cause and effect. Instead, we observe regular succession because of God's habitual action.

   In SCM terms:
   - An SCM is a tuple <U, V, F, P(U)> where U are exogenous variables, V are endogenous variables, F is a set of structural equations, and P(U) is a probability distribution over U.
   - The structural equations for endogenous variables are of the form V_i = f_i(Pa_i, U_i) where Pa_i are the parents of V_i (from V) and U_i is an exogenous variable.

   Occasionalism claims that the apparent causal relations we see (i.e., the structural equations) are not inherent in the created things (the endogenous variables) but are entirely due to God's direct action.

   How to model this?
   - We can think of God as an exogenous variable, say U_G, which is the only exogenous variable and which directly determines every endogenous event.
   - In fact, al-Ghazālī would say that every event (every variable in V) is directly determined by God. Therefore, there are no edges between the endogenous variables. Instead, every endogenous variable is a function of U_G.

   But note: al-Ghazālī does not deny that we observe regularities. So we can let U_G be a stochastic process that, by its design, produces the regularities we see. However, there is no necessity in the connection: God could choose to break the habit.

   Therefore, we can represent the world as an SCM with:
     U = {U_G}
     V = {V_1, V_2, ..., V_n}  (all the endogenous variables we observe)
     For each V_i, the structural equation is V_i = f_i(U_G)   [so no parents from V, only U_G]
