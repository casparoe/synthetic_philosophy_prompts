prompt: |-
  I'm on the ethics and safety board of a mid-sized health insurer and Ive got to write the decision memo for Tuesday's meeting, and Im stuck on the framing, so I want you to write it. Here's the case. The product team wants to roll out an "adherence" program for people on chronic meds. Patients opt in and then get messages generated from their own data. Two features are causing trouble. First, loss-framing: "you've built up 40 good days, don't lose it now." Second, and this is the one: for patients who've uploaded voice memos, the app can synthesize a message in the patient's own voice, as if from their future self — "take the pill tonight, I want to be at my daughter's wedding." The team says it's opt-in, it's true, and it works: adherence jumps about a third.

  Our draft policy defines manipulative influence as influence that "works by making the person's choice not really their own." Half the board thinks that line is useless because it just restates the problem. One member wants to approve everything on the grounds that it serves the patients' own long-term ends, which is what medicine is for anyway. Another wants to ban the voice feature outright as creepy and undignified, no matter how well it works.

  I don't want to just split the difference. My own half-formed thought is that the draft line is bad because it asks about the outcome (was the choice really theirs?) when we should be asking about the transaction — something like: an influence is fine if the person could learn exactly why and how it was produced and still be glad they acted on it, and manipulative if learning that would undercut the very reason they acted. But I can already see two problems with that and I want you to push on them. First, lots of legitimate stuff might fail it — a good teacher, a friend's pep talk, my own alarm clock. Second, it's all about whether the person can reflect and endorse, but what if the deeper worry is that someone now has a lever over your choices that you never handed over and that you have no way to contest, whether or not it ever overrides your reflection? And a third thing someone on the board will definitely say: the real issue isn't autonomy at all, it's that the message implies things that are false or misleading ("I" am your future self; this is what you want), so it's really a deception problem wearing an autonomy costume.

  So: write the decision memo. Commit to a criterion, say why it beats the alternatives — including the two I floated and the deception one — then apply it feature by feature, give me a concrete recommendation with any conditions and a timeline the team could actually work to, and be honest about the strongest thing someone on the losing side could say. No citations needed, I'll add those.
reasoning: |-
  Okay, the user is on an ethics board for a health insurer and needs help writing a decision memo about an adherence program with two controversial features: loss-framed messaging and AI-synthesized voice messages mimicking the patient's future self. They're stuck on how to frame the ethical evaluation and want a clear criterion to resolve the debate.

  Hmm, the user presented several ethical frameworks being considered by their board: their draft policy's vague "manipulative influence" definition, a consequentialist view (approve if it serves patient's long-term ends), and a dignity-based objection (ban the voice feature as creepy). They also proposed their own transactional criterion about whether patients would still endorse the influence after understanding its mechanics, but identified three problems with it.

  The core tensions here are fascinating: autonomy vs. effectiveness, transparency vs. psychological impact, and whether "creepiness" is a valid ethical objection. The voice feature especially raises uncanny valley concerns - it's not technically deceptive since patients opt in, but it exploits emotional vulnerability by mimicking intimate relationships (future self). 

  For the memo structure, I'll need to: (1) establish a clear ethical criterion that addresses the user's transactional idea while fixing its flaws, (2) show why it's better than alternatives including deception frameworks, (3) apply it concretely to both features, and (4) give actionable recommendations with implementation timelines. The "losing side" counterarguments should feel authentically represented - e.g., consequentialists will argue we're prioritizing philosophical purity over real health outcomes.

  Key insights to weave in: 
  - The voice feature creates a novel power asymmetry (insurer synthesizing patients' own voices for persuasion) that even opt-in may not legitimize
  - Loss-framing is common in behavioral economics but crosses a line when combined with health data
  - The strongest deception argument isn't about factual falsehoods but about subverting the patient's own decision-making process

  Implementation-wise, conditional approvals with guardrails make sense - e.g., allowing loss-framing only with positive reinforcement counterweights, and banning voice synthesis entirely due to irreducible dignity concerns. Timelines should acknowledge product team's rollout pressures while allowing for ethical safeguards.
answer: |-
  ## Ethics Board Decision Memo: Adherence Program Features  

  **To:** Ethics and Safety Board Members  
  **From:** [Your Name], Board Chair  
  **Date:** [Current Date]  
  **Subject:** Decision on Proposed Adherence Program Features – Loss-Framing & Voice Synthesis  

  ### I. RECOMMENDATION  
  **Approve** the loss-framing messaging feature **conditionally** (with revised framing guidelines). **Reject** the voice synthesis feature ("future self" messages) on ethical grounds. Implementation timeline: Loss-framing revisions to be submitted within 2 weeks; voice synthesis removed from the pilot. Final program review in 4 weeks.  

  ---

  ### II. ETHICAL CRITERION  
  **Adopted Principle:** *An influence is ethically permissible if it respects the patient’s agency by ensuring transparency, contestability, and alignment with their reflectively endorsed values.*  

  **Why this criterion?**  
  1. **Beats "Choice Not Their Own"**: Our draft policy’s vagueness invites circular debates. This standard demands concrete safeguards (transparency/contestability) and focuses on whether the tactic aligns with the patient’s *considered* goals, not momentary compliance.  
  2. **Beats Consequentialism ("Serves Long-Term Ends")**: While patient health is paramount, ends cannot justify *all* means. A tactic that bypasses agency (e.g., subliminal cues) erodes dignity even if effective. Medicine must uphold autonomy *alongside* beneficence.  
  3. **Beats "Endorsement After Explanation"**: Your transactional proposal improves on vagueness but fails two ways:  
     - **Legitimate Influences Are Captured**: A teacher’s encouragement passes because its mechanism (empathy/support) aligns with the student’s values when understood. An alarm clock is a neutral tool, not a psychological lever.  
     - **Addresses "The Lever" Concern**: Our criterion explicitly requires *contestability*—patients must have avenues to question, opt out, or correct misuse. This prevents hidden control.  
  4. **Beats the "Deception" Argument**: While the voice feature *implies* identity ("I am your future self"), the core issue isn’t factual falsity (patients *opt in* knowing it’s synthetic). The harm is *agency erosion*: it hijacks a deeply personal narrative voice to override present judgment, exploiting self-relationship.  

  ---

  ### III. APPLICATION TO FEATURES  
  1. **Loss-Framed Messaging**  
     - *Analysis*: Loss aversion is a known cognitive bias. While potent, it doesn’t inherently bypass agency. **Conditionally permissible** if:  
       - **Transparency**: Clear disclaimer: "This message uses behavioral science to support your goals."  
       - **Contestability**: Easy opt-out per message + program-level.  
       - **Alignment**: Combines with gain-framed alternatives (e.g., "Keep your streak! Only 5 days to 45!").  
     - *Recommendation*: **Approve** with requirement: ≥50% of messages must use gain-framing or neutral facts. Team submits copy for review within 2 weeks.  
     - *Losing Side’s Strongest Argument*: "Loss-framing preys on irrational fear. Even with safeguards, it exploits vulnerability for corporate gain (reduced costs), not pure patient interest."  

  2. **Synthesized "Future Self" Voice Messages**  
     - *Analysis*: Fails all aspects of the criterion:  
       - **Transparency**: Knowing "your future self" is AI-generated doesn’t negate the visceral, emotional hijacking of one’s own voice and identity.  
       - **Contestability**: The psychological lever (personal voice evoking guilt/shame) is embedded; opting out post-exposure is too late.  
       - **Alignment**: Manipulates by creating a fictionalized "future self" to override present values (e.g., if a patient *chooses* to skip a dose for valid reasons).  
       - **Dignity Risk**: Uses intimate biometric data (voice) to simulate an unmediated personal plea, reducing patienthood to programmable behavior.  
     - *Recommendation*: **Reject**. Prohibit use of voice synthesis for persuasive messaging.  
     - *Losing Side’s Strongest Argument*: "This rejects a 33% adherence boost for abstract ‘dignity’ concerns. Dying patients might prefer a ‘creepy’ nudge over irreversible health decline. Our duty is to save lives, not police psychological comfort."  

  ---

  ### IV. IMPLEMENTATION TIMELINE  
  | **Action Item** | **Responsible Party** | **Deadline** |  
  |-----------------|------------------------|--------------|  
  | Revise loss-framing messaging to include ≥50% gain-framing + transparency disclaimer | Product Team | 2 weeks |  
  | Remove voice synthesis feature from adherence program | Product Team | Immediate |  
  | Pilot launch with revised features (no voice synthesis) | Product Team | 4 weeks |  
  | Post-pilot ethics review (adherence data + user feedback) | Ethics Board | 90 days post-launch |  

  ---

  ### V. STRONGEST COUNTERARGUMENT ACKNOWLEDGED  
  **Consequentialist Objection:** *"Withholding a tool that boosts adherence by 33% is ethically negligent. If patients opt in, they’ve consented to the ‘lever.’ Prioritizing philosophical purity over real-world health outcomes ignores our duty to prevent suffering."*  
  **Response:** Valid, but incomplete. Opt-in is necessary but not sufficient; we must also ensure tools don’t degrade agency in ways consent can’t cure. The voice feature’s risks (covert influence, dignity harm) outweigh benefits. Loss-framing, with guardrails, balances outcomes and ethics.  

  ---  
  **Approved:** [Your Name], Chair  
  **Next Steps:** Vote at Tuesday’s meeting. Product team to begin immediate adjustments pending vote outcome.
