prompt: |-
  My neighbor Priya and I spent most of Saturday evening on her porch re-arguing the corner lot, and I came away less sure of my own position than when we started. Two years ago I helped draft our neighborhood association's letter supporting the city's corridor upzoning; I said at the time, and still believe, that owning a house does not give you a veto over what gets built within sight of it. The association then lobbied for a conservation overlay that exempted our own four blocks from the upzoning, and I signed that petition as well, largely because I did not want to lose the light in my kitchen. Now a nonprofit developer wants to put a five-story building of about forty apartments on the vacant lot two blocks east, a third of them reserved for households with very low incomes, and the residents there have asked me to speak against it at Thursday's hearing on the grounds of scale, parking, and the character of the street. Priya says my position is incoherent: I have arranged for my own street to be exempt from exactly the density I claim to want, and if I show up against this project I will simply be saying not here in the vocabulary of planning. She proposed a test — whether I would still object if I did not know in advance which of the two blocks I would end up living on — and I could not give her a clean answer. I do think there is a difference between building on a vacant lot and rezoning the street where I live, and that people can legitimately care about the character of their neighborhood, but I cannot get that difference to hold still, and I suspect I would not have read the parking study at all if the lot were three blocks further away. What should I do at Thursday's hearing, and is there a version of my position that is not just self-interest wearing a planning vocabulary?
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. They're struggling with a moral and practical conflict about supporting urban density in principle but opposing a specific development near their home. The user helped draft a letter supporting city-wide upzoning but later supported exempting their own neighborhood. Now, a new development is proposed nearby, and neighbors want them to speak against it. Priya calls this incoherent, and the user feels conflicted.

  First, I need to understand the core issue: cognitive dissonance between stated values and actions. The user admits their opposition might be rooted in self-interest. Priya's test—imagining not knowing which block they'd live on—highlights this. The user couldn't answer, indicating internal conflict.

  Next, I should assess their arguments: scale, parking, and neighborhood character. Are these valid concerns or justifications? The parking study mention suggests they dug into details, but only because it's close. If it were farther, they might not care. That's a red flag for self-interest.

  The user wants a version of their position that isn't self-interested. So, how can they contribute constructively? Maybe reframe objections into suggestions. Instead of opposing, advocate for improvements. Also, acknowledging their past contradictions could show growth and honesty.

  I should consider the hearing's impact. Speaking against might align with neighbors but betray their principles. Supporting could alienate them but align with their belief in density. A middle path: address concerns without opposing the project, pushing for community benefits instead.

  Also, the user values affordable housing. Highlighting that and suggesting ways to integrate it better might bridge their principles and local concerns. They need to reconcile caring about neighborhood character without vetoing development.

  Finally, long-term integrity matters. Admitting past inconsistency and committing to consistent support for density could resolve the incoherence Priya pointed out. This transforms their position from self-interest to principled advocacy with community engagement.
answer: |-
  This is a deeply human and intellectually honest struggle – the tension between abstract principles and lived reality, between community good and personal comfort. Priya's "veil of ignorance" test is powerful because it exposes where self-interest might be masquerading as principle. Here's a breakdown of your situation and potential paths forward:

  **Deconstructing the Incoherence (Priya's Point):**

  1.  **The Exemption:** Supporting city-wide upzoning *except* for your own immediate blocks is the core inconsistency. You benefited directly from the conservation overlay (your kitchen light), effectively insulating yourself from the density you advocated for elsewhere.
  2.  **"Not Here":** Opposing *this specific project* on "scale, parking, character" grounds, after securing your own exemption, *does* look like classic NIMBYism ("Not In My Backyard"), especially given your stated belief that homeownership shouldn't grant a neighborhood veto. The planning vocabulary *is* the typical language used to cloak "not here."
  3.  **The Vacant Lot vs. Rezoning Distinction:** While there *is* a technical difference (building on vacant land vs. rezoning existing residential), the *impact* (density, scale, parking, character change) is fundamentally similar to what upzoning *your* street would have allowed. The distinction feels shaky when examined closely, as you suspect.

  **Finding a Coherent Position (Beyond Self-Interest):**

  It *is* possible to care about neighborhood character and have concerns about specific developments without being purely self-interested. The key is *how* you frame it and *what you do with those concerns*:

  1.  **Acknowledge the Tension & Your History:** Start by being radically honest, especially with yourself and potentially even at the hearing. *"I supported city-wide upzoning but also supported exempting my own immediate neighborhood. I recognize that tension. Priya challenged me on it, and she has a point. My position is complicated, and I'm grappling with that."* This disarms the accusation of hypocrisy by owning it.
  2.  **Reframe Your Concerns as Suggestions, Not Opposition:** Instead of speaking *against* the project, speak *for* making it better and mitigating impacts. Shift from "No" to "How?".
      *   **Scale/Character:** "While I support density and affordable housing, the jump from vacant lot to 5 stories feels significant for this specific streetscape. Are there design elements (step-backs, materials, facade articulation) that could better transition the massing to the adjacent 2-3 story homes? Could the height be reduced on the sides facing the lowest-scale neighboring properties?"
      *   **Parking:** "The parking study indicates potential strain. Rather than oppose the project, I urge the developer and city to commit to robust, funded Transportation Demand Management (TDM) strategies *from day one* – enhanced transit passes for residents, secure bike storage, car-share partnerships, dedicated rideshare pickup zones – to minimize actual parking impacts. Could parking permits for the immediate surrounding blocks be explored proactively?"
      *   **Affordable Housing:** **Emphasize your strong support for this component.** "The inclusion of deeply affordable units is not just commendable, it's essential. My concerns about scale or parking should in no way undermine this critical need. How can we ensure these units are integrated successfully and that residents have access to needed services?"
  3.  **Focus on Process & Community Benefit:** Advocate for things that benefit the wider community, not just protect your immediate interests.
      *   "What community benefits beyond the affordable units (e.g., public space contribution, local hiring, support for nearby small businesses) is the developer offering?"
      *   "How will construction impacts (noise, traffic, dust) be minimized and communicated effectively to all nearby residents?"
      *   "What mechanisms will ensure long-term maintenance and management success, especially for the affordable units?"
  4.  **Distinguish "Character" from Stasis:** Articulate what "character" means beyond just "how it looks now." Is it walkability? Tree canopy? A mix of uses? Social connections? Explain how the development could *enhance* positive character traits, not just change them. "We value our walkable, tree-lined streets. How will this project *add* to walkability and green space, rather than detract?"
  5.  **Commit to Future Consistency:** Use this as a turning point. *"This process has challenged me. While I have specific suggestions for this project, I want to be clear: I support the principles of increased density and affordable housing in our city, including in my neighborhood. I will not support efforts to exempt other areas or block reasonable projects based solely on proximity going forward."*

  **What to Do at Thursday's Hearing:**

  1.  **Option 1 (Most Principled & Courageous):** **Do NOT speak in opposition.** Instead, focus on points 2, 3, and 4 above. Advocate for *improvements* and *mitigation*, emphasize strong support for the affordable housing, and acknowledge your own evolving perspective. You fulfill the request to "speak" by addressing the concerns, but you do so constructively without asking for denial.
  2.  **Option 2 (Acknowledge & Advocate):** If you feel you must address the neighbors' request more directly, start with **radical honesty (Point 1)**. Then present your concerns using the reframed language (Points 2 & 4). Crucially, **explicitly state you are NOT asking for denial**, but for specific conditions or mitigations (Point 2 & 3) to make the project work better for the community. End by reaffirming support for the affordable housing and density principles.
  3.  **Option 3 (Least Recommended - Maintains Incoherence):** Speak in opposition using the "scale, parking, character" arguments. This is the path Priya critiques. It *will* be seen as self-interest (because it largely is, based on proximity), damages your credibility on urbanism principles, and likely contributes to blocking needed housing.

  **The Core of a Coherent Position:**

  Your position becomes coherent when:
  *   You **acknowledge and own** the past inconsistency.
  *   You **unequivocally support** the core principles of density and affordable housing *as applicable to your own neighborhood*, not just abstractly "over there."
  *   You shift from **opposition** to **constructive engagement** focused on *improving* projects and *mitigating impacts* using planning principles applied fairly.
  *   You **separate legitimate planning concerns** (design integration, traffic management, community benefit) **from proximity-based resistance**.
  *   You **commit to future consistency**, aligning your actions with your stated beliefs even when it impacts you directly.

  Priya's challenge is an opportunity. Grappling with this discomfort is how genuine integrity is forged. Speaking at the hearing with honesty, support for the affordable housing, and constructive suggestions for improvement – while explicitly rejecting a call for denial – is the path that aligns most closely with your stated principles and offers a version of caring about your neighborhood that transcends simple self-interest. It won't please your immediate neighbors entirely, but it allows you to look at yourself in the mirror and builds a foundation for more consistent advocacy in the future.
