prompt: |-
  For the past two years I have taught the second-year undergraduate metaphysics course here, and next Thursday I have ninety minutes on origin essentialism — the claim that a particular person could not have come into existence from any sperm and egg other than the ones from which she in fact came. My thirty students will arrive having read the excerpt in which the claim is defended; they will know what a possible world is, they will have had a few weeks of modal logic, and they will be, as second-year students generally are, suspicious of anything that smells like essentialism. The room has a whiteboard and no projector, and I would rather not spend the hour writing definitions on it. What I want from you is emphatically not an explanation of the thesis; I have taught it before and I can state it in a sentence. What I want is a plan for teaching it: the order in which the components have to be introduced and why that order is forced rather than merely tidy — what must already be in place before the claim even registers as a claim, what can safely be postponed, and what will go wrong if I take the pieces in the order that comes most naturally to me.

  I also need the single case that will carry the whole session, and I need to know what that case must have and must lack. My own inclination is to skip the case everyone uses and to build the hour on one I have devised: the very same sperm and the very same egg, but meeting in a dish rather than in a body, at a different hour and in a different country, with a second version in which a single gene is corrected before the fusion takes place. My reasoning is that this will force the students to ask whether the essential origin is the pair of gametes or the entire causal route by which the person was produced, which strikes me as the interesting question. But I suspect the case may already presuppose the distinction I am trying to get them to see, and may quietly hand them the answer. Tell me whether to use it, whether to use it in both versions or only one, and what the alternative should be if it fails — and if you think the standard case is better, say why.

  As for the misconceptions, I have my own list and I want yours organized against it. I expect them to conclude that the thesis is genetic — that what is essential to you is your DNA — and to be unable to say why that is a different claim. I expect them to hear it as an epistemic thesis, something about how anyone could ever know which gametes were theirs, rather than a metaphysical one. I expect the regress objection to arrive in some form: if the gametes are essential, why not the meeting of the parents, the migration of the grandparents, and everything else upstream, so that the entire causal history of the world becomes essential to you? And I expect the worry that the thesis makes the past necessary and therefore makes a hash of ordinary claims about contingency and freedom. The one I am most worried about, because I think it is the deepest and the hardest to dislodge once it takes hold, is that they will treat the whole question as one about how we would describe or label a person — that coming from a different sperm and egg will strike them as a difference in our words rather than a difference in the world. For each of these, tell me at which point in the sequence it should be headed off, whether it is better met head-on or dissolved by a distinction I introduce earlier, and which single one, if it survives to the end of the hour, means the session has failed. Then give me one question to put to them in the last ten minutes that would show whether the thesis has actually landed rather than whether they can recite it, and tell me what I should openly decline to explain at this level — I am inclined to keep transworld identity, counterpart theory, and the parallel debates about artifacts and natural kinds out of the room entirely, but I want to know whether any of them is load-bearing for the rest. Please write this as continuous prose, in the manner of a letter to a colleague — no headings, no numbered lists, no bullet points, no bold or italicized labels, no tables — and in American English.
reasoning: |-
  Okay, let me approach this systematically. The professor needs a structured lesson plan for teaching origin essentialism to skeptical second-year students, with specific concerns about misconceptions and case selection.

  First, considering the foundational elements needed before introducing the claim. Students will arrive with modal logic knowledge and possible worlds understanding, but may conflate metaphysical necessity with epistemic or linguistic concepts. The core challenge is establishing a clear metaphysical framework where the claim registers as a substantive thesis about identity across worlds.

  Regarding the proposed case study - the dish fertilization scenario with genetic modification. While innovative, it risks presupposing the very distinction between gamete identity and causal history that should emerge through discussion. A better starting point might be the standard gamete-swap case to establish the basic intuition before layering complexity. The dish variant could serve as a secondary probe once the core thesis is grasped.

  For misconceptions, each requires strategic handling:
  - The genetic fallacy should be preempted by distinguishing material composition from origin during initial case analysis
  - Epistemic conflation can be dissolved through careful possible worlds framing
  - The regress objection needs containment via causal chain segmentation
  - Linguistic reductionism is the most dangerous and must be confronted directly through modal intuition pumps

  The key diagnostic question should test whether students can generate their own counterexamples to DNA-essentialism while preserving origin constraints. This would demonstrate conceptual ownership beyond mere recitation.

  Finally, counterpart theory and artifact debates should remain excluded - they're not load-bearing for this session and would introduce unnecessary complexity. The focus must stay tightly on personal identity and origin necessity.
answer: |-
  My dear colleague,

  I appreciate the precision of your request, and I share your instinct to cut through the standard scaffolding and get to the heart of the matter with students already primed by the reading. The danger here isn’t confusion about the thesis itself—you’re right, it compresses neatly—but about what kind of claim it *is*, and why anyone would take it seriously. The order matters because without laying the right groundwork, their skepticism will crystallize around misunderstandings that become harder to dislodge than the thesis itself. Let me walk through how I’d sequence it, why, and how your case fits in—or doesn’t.

  Start not with the thesis, nor even with a case, but with the modal *question* the thesis answers. Write on the board: "What makes *this particular person*, Alice, *Alice*?" Then clarify: "Not what makes her *human*, or *conscious*, or *tall*, but what makes her *this specific individual*?" The point is to isolate the problem of individual identity. Immediately pivot to possible worlds: "Could Alice have existed without having red hair? (Assume she does.) Could she have existed without being born to her parents?" The first is uncontroversial; the second is the hinge. This forces the issue: is parental origin contingent or necessary for being *Alice*? The students need this question vivid *before* they hear the answer, or the thesis sounds like an arbitrary assertion. It must register as a *solution* to a puzzle they feel. Without this, it smells like unmotivated essentialism from the jump.

  *Now* introduce the thesis: "Alice could not have come from any other sperm and egg." State it cleanly. Then, and only then, deploy your first case—but *not* your intricate dish scenario yet. Use the simplest, most intuitive counterfactual: "Suppose Alice’s actual parents, Smith and Jones, conceive at time T. But imagine instead that Smith’s sperm (S1) fertilizes Jones’ egg (E1) *five minutes later*. Is that person Alice?" The simplicity is crucial here. It isolates the variable of origin *time* within identical gametes. Students usually intuit "yes, still Alice." Then escalate: "Same parents, but a *different* sperm from Smith (S2) fertilizes Jones’ *actual* egg (E1). Is that Alice?" The discomfort begins. Most hesitate. This is where the core intuition—that the *specific gametes* matter—starts to surface *naturally*. Using identical parents avoids conflating gamete identity with parental identity. This step *must* come before your dish case because it establishes the minimal, brute intuition that specific gametes might be essential, without introducing confounding variables like location, method, or genetic tweaks. If you start with your complex case, they’ll fixate on the extraneous details (petri dish! gene editing!) and miss the foundational question.

  Only after they’ve wrestled with this should you introduce *your* case. Present it in two distinct versions. First: "Same sperm (S1), same egg (E1), but conception happens in a lab dish in Norway, not in the body, at a different time. Is that Alice?" Many will say yes—same materials, different causal route. Then hit them with the second version: "Same sperm (S1), same egg (E1), but *before* fusion, a single recessive gene for a disease Alice doesn’t have is ’corrected’ in the dish. *Then* fusion. Is that Alice?" The brilliance of your case is that it forces the question you want: is it the *physical matter* of the gametes (which has changed slightly) or the *causal origin event* (which is identical in location and method to the first variant) that matters? But—and this is critical—it only works if they’ve already accepted that the *specific gametes* are non-negotiable in the simple case. If you lead with it, they’ll likely dismiss both variants as "not Alice" because the *entire causal context* (body conception) feels essential, which buries the distinction you’re after. Use it here to expose the tension: if they say "Alice" to the first dish variant but "not Alice" to the gene-corrected one, they’re privileging genetic makeup over origin. If they say "not Alice" to both, they’re privileging the natural conception process. Both reveal the ambiguity in "origin" you want to probe. It’s perfect for this stage, but premature earlier.

  Now, the misconceptions. You’ve diagnosed them perfectly. Here’s how and when to defuse each:

  1.  **The Genetic Fallacy (mistaking origin for DNA essentialism):** This will surface immediately when you present the gene-corrected dish variant. They’ll say, "If the DNA is different, it’s not her!" *Head this off right then.* Ask: "Is the claim that Alice *must have* her actual DNA, or that she must *come from* these specific gametes, even if their DNA were altered slightly *before* she began to exist?" Contrast the gene-corrected dish with the simple gamete swap: in the swap, DNA is different *because* the origin is different; in the gene-correction, origin (same gametes) is the same but DNA differs. The thesis is about the latter. Hammer this distinction now; if it survives, they’ve reduced origin to genetics, gutting the thesis.

  2.  **Epistemic Misreading ("How could we ever know?"):** This often arises when discussing counterfactuals. When introducing possible worlds, explicitly state: "We’re not asking how *we* would *identify* Alice in another world, or what evidence we’d have. We’re asking what *metaphysically determines* that a person in another world *is* Alice." Repeat this when the worry pops up. If postponed, it reduces the thesis to skepticism about knowledge, missing its modal force.

  3.  **The Regress Objection ("Why not the parents, grandparents, big bang?"):** This is potent and likely. *Don’t* wait for it; *preempt* it when defending the simple gamete swap case. After establishing discomfort with S2+E1, ask: "Is this worry that if the sperm matters, then Smith’s parents meeting matters, and so on?" Acknowledge the pull, then distinguish: "The thesis isn’t that every prior cause is essential. It’s that *the materials from which you directly originate* are essential. Alice originates *from S1 and E1*. She doesn’t originate *from* her grandparents meeting; that’s a cause of the cause. Breaking the chain here avoids the regress." If this distinction isn’t made early, the regress can swamp the discussion.

  4.  **Linguistic Reductionism ("It’s just how we label things"):** This is the deepest threat. It often manifests as "Well, if someone came from different sperm, we just *wouldn’t call her* Alice." *Confront this head-on, early and late.* When first posing the modal question ("Could Alice have been born to different parents?"), press them: "Is this a question about what *name* we’d use, or about whether *that very person* would exist?" Use an analogy: "If a particular oak tree grew from an acorn other than the one it actually grew from, would it be *the same tree*, or just a similar one we *call* by the same name?" Anchor it in their own identity: "Is *your* existence contingent on *that specific sperm and egg*? If not, could there have been two of you?" If they leave thinking it’s about labels, the session failed. This misconception absorbs the metaphysical bite entirely.

  For your diagnostic question in the last ten minutes, ask: **"Imagine a person, Ben, who exists in the actual world. Now imagine a possible world where everything is identical up to the moment of Ben’s conception, except that a single, inert atom in a distant galaxy is in a slightly different position. In that world, the very same sperm fertilizes the very same egg. Is the person conceived there Ben? Why does this—or doesn’t it—challenge the origin essentialist thesis?"** This tests if they grasp that origin essentialism concerns the *specific causal origin* (the gametes), not the entire causal history or global supervenience. If they see that the distant atom is irrelevant (supporting the thesis by showing origin is isolatable), or if they wrongly think it *does* matter (confusing necessity of origin with necessity of entire past), you’ll know if they’ve grasped the core claim.

  Finally, what to exclude. You’re wise to keep transworld identity, counterpart theory, and artifact/natural kind debates out. None are load-bearing *for introducing and defending origin essentialism for persons at this level*. Discussing counterparts or transworld identity won’t clarify *why* origin might be essential; it only offers alternative semantic frameworks for expressing the claim, which distracts from the metaphysical intuition. Artifact debates (e.g., Ship of Theseus) introduce composition problems irrelevant to the unique way persons originate *from specific materials*. Natural kinds might invite confusing biological essentialism. Stay focused on the brute modal intuition about personal origin. If a student asks "But what *is* a person across worlds?", deflect: "Assume for today we have a working grasp of what it means for *this* person to exist in another scenario; we’re investigating the *conditions* for that."

  Your plan is sound, but sequence is everything. Build the intuition from the simple upwards, use your case to refine, not introduce, and relentlessly police the metaphysical frame. The hour hinges on them feeling the weight of the question before hearing the answer. Good luck—Thursday promises fire.

  Warmly,  
  A Fellow Traveler in Modal Realism
