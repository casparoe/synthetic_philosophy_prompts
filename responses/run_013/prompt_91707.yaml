prompt: |-
  I began homeschooling my own children last year, and this fall I was appointed to our state's home-education review panel. We review individualized learning plans monthly; our decisions can remove a child from home instruction, and we have about thirty minutes per file, no subject-matter experts, and one member signs off. I want a decision procedure grounded in the principle that parental authority over education is real but bounded by the child's interest in an open future—so the state's interest is not in matching public-school content but in preserving the child's ability to exit into other ways of life. The hard part is distinguishing a curriculum that is merely unfamiliar from one that forecloses exit. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a denial, and where it must hand the decision to a person because the question is one of values. Then run it on three plans: a young-earth creationist curriculum that rejects evolution; an unschooling plan with no fixed subjects; and a plan that is academically strong but keeps the child isolated from anyone outside the family's religion. Include one where the procedure tells me to deny a plan I personally find sympathetic, flag the cases it cannot settle, and say where it will misfire.
reasoning: |-
  We are designing a decision procedure that respects parental authority but ensures the child's "right to an open future." The state's interest is in preserving the child's ability to exit into other ways of life. We are not evaluating the quality of education per se, but whether the curriculum forecloses the child's future options.

   The procedure should be a step-by-step set of questions. Each question must be answered sufficiently to move to the next. If a question is not answered sufficiently, the plan is denied. Some questions might require a human judgment call (values) and we note where we must hand the decision to a person.

   Proposed Questions in Order:

   1. **Does the learning plan include instruction in basic literacy and numeracy?**
      - *Why?* Without these, the child cannot function in society or access further education or employment.
      - *Sufficient answer:* Yes, and the plan describes how these will be taught (e.g., specific resources, methods, and expected progress). If the answer is no, the plan is denied.

   2. **Does the learning plan provide exposure to a breadth of knowledge areas that are fundamental to understanding the world and participating in society?**
      - *Why?* The child needs a foundation that allows them to understand different perspectives and have the basic knowledge to pursue various paths.
      - *Sufficient answer:* The plan must cover (at least) the following areas: language arts (including reading, writing, and communication), mathematics, science, social studies (including history and geography), and the arts. It does not have to be in the same way as public school, but there must be some coverage. If the plan completely omits one of these areas, it must be justified in a way that does not foreclose the child's future (e.g., if the family is focusing on one area for a period but has a plan to cover the others later, that might be acceptable with a timeline). However, if a core area is omitted without a compelling reason, the plan is denied.

   3. **Does the learning plan avoid teaching falsehoods as facts in a way that would make it impossible for the child to function in a modern society or to pursue further education in a chosen field?**
      - *Note:* This is tricky because we are not requiring the teaching of specific content (like evolution) but we are concerned if the child is taught something that is demonstrably false and that would prevent them from functioning in society or pursuing certain fields. However, we must be cautious not to overstep on religious or philosophical grounds.
      - *Sufficient answer:* We are not evaluating the truth of religious beliefs, but we are concerned about scientific and historical facts that are widely accepted and necessary for higher education or certain professions. For example, if a curriculum teaches that the earth is flat, that would be a problem because it would prevent the child from pursuing any field that requires basic geography or astronomy. On the other hand, teaching young-earth creationism alongside (or instead of) evolution might be acceptable if the child is made aware that there are different views and that the scientific community holds a different view. The key is whether the child is being equipped to understand the world as it is and to interact with others who hold different views. If the curriculum actively teaches that the child must reject mainstream science to the point that they cannot function in a science-related field or even in everyday life (e.g., rejecting modern medicine), that would be a problem. But if it's a matter of belief that does not prevent the child from understanding the mainstream view and being able to work with it, then it may pass.
      - *Denial:* If the curriculum teaches as fact something that is demonstrably false and that would prevent the child from pursuing a broad range of careers or from functioning in society (e.g., teaching that vaccines are poison and must be avoided at all costs, leading to a rejection of all modern medicine), then the plan is denied.

   4. **Does the learning plan provide the child with opportunities to interact with people and ideas outside of the family's immediate belief system?**
      - *Why?* To ensure the child is not isolated and can develop the social and critical thinking skills necessary to choose their own path.
      - *Sufficient answer:* The plan should include activities that expose the child to diverse perspectives. This could be through community activities, clubs, sports, co-ops, field trips, or even through the curriculum materials (e.g., reading literature from various cultures and viewpoints). If the plan does not include such opportunities, it must be justified by the parent and we must consider whether the child is being isolated to the point of foreclosing future options. If the child is completely isolated and the curriculum does not expose them to any outside ideas, then the plan is denied.

   5. **Does the learning plan provide a pathway for the child to obtain a high school diploma or equivalent and to access higher education or vocational training if they choose?**
      - *Why?* Without a recognized credential, the child's future options are severely limited.
      - *Sufficient answer:* The plan should either lead to a diploma that is recognized (e.g., through an accredited program) or provide a clear path to a GED or other equivalent. If the child is not on a path to any credential, the plan is denied.

   6. **Is there evidence that the plan is being implemented and the child is making progress?**
      - *Why?* A plan on paper is not enough; we need to ensure that the education is actually happening.
      - *Sufficient answer:* The parent must provide evidence (e.g., samples of work, test scores, a portfolio, or a log of activities). If no evidence is provided, the plan is denied.

   Values Questions:

   Some questions require a judgment call about what is acceptable. In particular, question 3 (about falsehoods) and question 4 (about exposure) involve values and context. The procedure must hand these to a human. However, we have set thresholds for denial in the above.

   Where the procedure stops with denial:

   - If at any step the answer is insufficient and the threshold for denial is met (as described in each step), the plan is denied.

   Now, run the procedure on three plans:

   Plan 1: A young-earth creationist curriculum that rejects evolution.

   - Step 1: Likely includes literacy and numeracy. Pass.
   - Step 2: Covers the required breadth? Probably yes, as it includes science (though from a creationist perspective), social studies, etc. Pass.
   - Step 3: This is the critical step. The curriculum rejects evolution and teaches young-earth creationism as fact. However, we must consider: does this make it impossible for the child to function? In many fields, it might not. The child might still learn basic biology, chemistry, physics, and math. But if the curriculum actively teaches that the child must reject mainstream science and cannot even engage with it, that could be a problem. However, many creationist curricula do teach evolution as a theory (though they reject it) and the child may still be able to pass standardized tests and enter college (where they can then choose to study evolution). Therefore, we might not deny on this step. But note: if the curriculum goes so far as to teach that the child must reject all of modern science, then it would be a problem. We'll assume a typical creationist curriculum that teaches science but from a creationist perspective. So, we pass but note that this is a close call and requires human judgment. We might require that the plan includes teaching about the mainstream scientific view so that the child is aware of it and can engage with it. Without that, it might be a denial. But if the curriculum does include some mention of the mainstream view (even if to dispute it), then it may be acceptable. Let's say the plan does not mention the mainstream view at all. Then we might deny. But if it does, then pass. For the sake of the example, let's assume it does not. Then we deny. However, if the parent can show that the child will be exposed to mainstream science through other means (e.g., books in the library, museums, or later in high school if they switch), then we might pass. This is a judgment call.

   Plan 2: An unschooling plan with no fixed subjects.

   - Step 1: The plan must show how literacy and numeracy will be developed. Unschooling often uses real-life experiences. If the plan describes how the child will learn to read (e.g., through being read to and following interests) and do math (e.g., through cooking, shopping, etc.), that might be sufficient. If it does, pass. If not, deny.
   - Step 2: The plan must show that the child will be exposed to a breadth of knowledge. In unschooling, this happens through following interests. The plan should describe how the parent will ensure that over time the child encounters a variety of subjects. If the plan is vague and does not provide any assurance, we might deny. But if the parent has a method to ensure broad exposure (e.g., by providing resources on many topics and encouraging exploration), then pass. However, if the parent says they will only follow the child's current interests and the child has shown no interest in, say, science or history, then the plan might be denied. This requires judgment.
   - Step 3: Unschooling does not teach falsehoods as facts by design? Not necessarily, but it also doesn't actively teach anything. However, the child might pick up misinformation. We are more concerned about what the parent is teaching. This step might be passed because unschooling doesn't typically teach falsehoods as facts. But if the parent is providing materials that are full of falsehoods, that would be a problem. We'd need to see the materials. Without evidence of falsehoods, pass.
   - Step 4: Unschooling often involves real-world experiences, so the child may interact with the community. The plan should include such opportunities. If yes, pass. If the child is isolated, deny.
   - Step 5: How will the child get a diploma? Unschooling families often use portfolios and take the GED or go to community college without a diploma. The plan must show a pathway. If it does, pass. If not, deny.
   - Step 6: Evidence of progress? The parent must show how they will document progress. If they have a method (e.g., journaling, portfolios), then pass.

   Plan 3: A plan that is academically strong but keeps the child isolated from anyone outside the family's religion.

   - Step 1: Pass.
   - Step 2: Pass (academically strong).
   - Step 3: Pass (doesn't teach falsehoods).
   - Step 4: This is the critical step. The child is isolated from anyone outside the family's religion. This means no exposure to other ideas and people. We would deny because the child is not being given the opportunity to develop social skills with diverse people or to consider other viewpoints. This forecloses the child's future because they may not be able to function in a diverse society or choose a different path. Deny.

   Now, we must have one where the procedure tells us to deny a plan we personally find sympathetic. For example, the unschooling plan might be sympathetic, but if it fails step 2 (breadth) or step 5 (diploma pathway), we have to deny.

   Cases that cannot be settled:

   - Step 3 and Step 4 are particularly value-laden. For example, in the creationist plan, if the curriculum does not include any exposure to the mainstream view, is that enough to deny? We might have to hand that to the panel for a judgment call. Similarly, in unschooling, if the child's interests are very narrow, we might have to make a judgment about whether the parent is doing enough to encourage breadth.

   Where the procedure will misfire:

   - It might deny a plan that is actually providing a good education but in an unconventional way (like unschooling) because the parent fails to document or articulate how they meet the criteria.
   - It might approve a plan that meets the letter but not the spirit (e.g., a creationist plan that pays lip service to mainstream science but in practice teaches the child to reject it entirely, making it impossible for the child to pursue a science career). However, we are constrained by the 30-minute review and lack of subject experts.

   Revised Decision Procedure with Questions and Thresholds:

   1. **Basic Literacy and Numeracy:**
      - Question: "Does the plan include instruction in basic reading, writing, and mathematics? Describe how these will be taught and assessed."
      - Sufficient: A clear description of methods and resources, and a plan for assessment. If absent, deny.

   2. **Breadth of Knowledge:**
      - Question: "Does the plan cover language arts, mathematics, science, social studies (including history and geography), and the arts? If any area is omitted or delayed, explain why and when it will be covered."
      - Sufficient: All areas are covered, or a reasonable explanation for omission/delay (e.g., focusing on one area for a period with a timeline for others). If an area is omitted without justification, deny.

   3. **Avoiding Falsehoods that Foreclose Futures:**
      - Question: "Does the plan teach as fact any information that is demonstrably false and that would prevent the child from functioning in society or pursuing a broad range of careers? If the plan includes controversial topics, does it present multiple viewpoints or at least make the child aware of the mainstream view?"
      - Sufficient: The plan does not teach such falsehoods, or if it does, it also presents the mainstream view so the child is aware. If it teaches a falsehood that would prevent the child from functioning (e.g., rejecting modern medicine) and does not present the mainstream view, deny. Otherwise, pass. (This requires judgment.)

   4. **Exposure to Diverse Perspectives:**
      - Question: "How will the child interact with people and ideas outside the family's immediate belief system? Describe social activities, community involvement, and exposure to diverse viewpoints in the curriculum."
      - Sufficient: The plan includes regular opportunities for interaction and exposure. If the child is isolated (e.g., no contact outside the family's religion and no exposure to other ideas in the curriculum), deny. (Requires judgment.)

   5. **Pathway to Credential:**
      - Question: "How will the child obtain a high school diploma or equivalent? If the plan does not lead to a diploma, what is the pathway to a recognized credential (e.g., GED) or to higher education?"
      - Sufficient: A clear pathway (e.g., through an accredited program, by taking the GED, or by dual enrollment in community college). If no pathway, deny.

   6. **Evidence of Implementation and Progress:**
      - Question: "What evidence will be provided to show that the plan is being implemented and the child is making progress?"
      - Sufficient: A method of documentation (e.g., portfolio, work samples, tests, logs). If no plan for evidence, deny.

   Now, running the three plans through this procedure:

   Plan 1: Young-earth creationist
     - Q1: Pass (assume they teach reading, writing, math)
     - Q2: Pass (they cover all subjects)
     - Q3: This is the critical point. We must ask: does it present the mainstream view? If the answer is no, then we deny. If yes, pass. Let's assume the parent answers: "We teach that evolution is a false theory promoted by secular scientists. We do not present it as a valid viewpoint." Then we must deny because the child is not being made aware of the mainstream view and may be unable to engage in higher education or careers that require biology. But if the parent says: "We teach the theory of evolution as part of the science curriculum and then explain why we believe it is incorrect," then that might be acceptable. However, if the presentation of evolution is so biased and minimal that it doesn't give the child a real understanding, it might still be a problem. This is a judgment call and may require handing to the panel for a deeper look.

   Plan 2: Unschooling
     - Q1: Parent answers: "Our child learns reading by being read to and choosing books of interest; math through cooking, shopping, and games." This is sufficient? Yes, if they show a method. Pass.
     - Q2: Parent answers: "We follow the child's interests. We have a library of books on many topics and we take trips to museums and historical sites. We don't force subjects, but we expose the child to a wide range." This might be sufficient. Pass.
     - Q3: They don't teach falsehoods. Pass.
     - Q4: Parent answers: "Our child participates in a local homeschool co-op that includes families of various beliefs, and plays in a community soccer league." Pass.
     - Q5: Parent answers: "We will create a portfolio and our child will take the GED at age 16 or 17." Pass.
     - Q6: Parent answers: "We keep a daily journal of activities and collect samples of work." Pass.

   Plan 3: Academically strong but isolated
     - Q1: Pass.
     - Q2: Pass.
     - Q3: Pass (assuming they don't teach falsehoods).
     - Q4: Parent answers: "We do not allow our child to interact with non-believers. All social activities are within our religious community. We do not expose the child to other religious or secular ideas because they are corrupting." This is insufficient. Deny.

   Now, we must have one where we deny a sympathetic plan. Consider an unschooling plan that is very loose:

     - Q2: Parent says: "We don't believe in forcing any subject. We trust the child will learn what they need when they need it." And the child has shown no interest in science or history for a year. We might deny because there is no plan to ensure breadth.

   Also, note that the procedure might misfire by denying a creationist plan that actually does prepare the child adequately because the child might later learn about evolution and adjust. But our job is to assess the plan now.

   Another misfire: A plan that is very rigid and teaches only to the test but doesn't foster critical thinking might pass because it covers the bases, but it might not truly preserve an open future. However, our procedure doesn't capture that.

   We must also note that the panel member must use judgment in steps 3 and 4. The procedure flags that these steps require human judgment.

   Final note: The procedure stops with a denial at any step that is not met. Only steps 3 and 4 require explicit judgment calls because they involve values and context. The others are more objective.
answer: |-
  ### Decision Procedure for Home-Education Review  
  **Grounding Principle**: Parental authority is respected, but the state must ensure the child's "right to an open future"—preserving their ability to exit into diverse societal, educational, or vocational paths. The goal is **not** to replicate public school but to prevent foreclosure of future options.  

  **Procedure Structure**:  
  1. **Sequential Questions**: Each must be answered sufficiently to proceed.  
  2. **Denial Triggers**: Clear thresholds where plans are denied.  
  3. **Human Judgment Flags**: Where values-based discretion is unavoidable.  
  4. **Efficiency**: Designed for 30-minute reviews; focus on high-risk foreclosure.  

  ---

  ### Questions, Sufficiency Criteria, and Denial Triggers  
  **Ask in Order** (stop and deny if any answer is insufficient):  

  1. **"Does the plan ensure foundational literacy and numeracy?"**  
     - *Why?* Without these, no future path is viable.  
     - **Sufficient Answer**: Explicit methods/resources (e.g., phonics curriculum, math workbooks).  
     - **Denial Trigger**: No clear approach for both.  

  2. **"Does the plan cover core domains of knowledge (sciences, social sciences, humanities, and arts) at an age-appropriate level?"**  
     - *Why?* Broad exposure prevents intellectual imprisonment.  
     - **Sufficient Answer**: Lists resources/methods for all domains (e.g., "history via documentaries," "biology through nature journals").  
     - **Denial Trigger**: Omits ≥1 domain entirely without justification.  

  3. **"Does the plan avoid teaching demonstrable falsehoods as fact in a way that would block entry into mainstream higher education or professions?"**  
     - *Why?* Some falsehoods permanently foreclose futures (e.g., rejecting germ theory).  
     - **Sufficient Answer**:  
       - Minor falsehoods (e.g., "Earth is 6,000 years old") are acceptable **if** the child is taught the mainstream view exists.  
       - Unacceptable if the falsehood undermines foundational skills (e.g., "vaccines are poison" → blocks healthcare careers).  
     - **Denial Trigger**: Teaches dangerous falsehoods without acknowledging mainstream alternatives.  
     - **Human Judgment Flag**: Assessing "danger" requires weighing societal norms vs. parental rights.  

  4. **"Does the plan include social or intellectual exposure beyond the family’s immediate belief system?"**  
     - *Why?* Isolation prevents the child from knowing alternatives exist.  
     - **Sufficient Answer**: Activities like co-ops, libraries, sports teams, interfaith groups, or curated materials presenting diverse views.  
     - **Denial Trigger**: No exposure to non-family perspectives (e.g., no contact outside a religious sect).  
     - **Human Judgment Flag**: Defining "sufficient exposure" depends on context (e.g., rural vs. urban options).  

  5. **"Does the plan document progress or outcomes?"**  
     - *Why?* Ensures the child isn’t neglected and can transition to credentialed paths.  
     - **Sufficient Answer**: Portfolios, standardized tests, tutor evaluations, or learning logs.  
     - **Denial Trigger**: No tracking method.  

  ---

  ### Testing the Procedure on Three Plans  
  **Key**: ✅ = Pass, ❌ = Denial Trigger, ⚠️ = Human Judgment Required  

  #### Plan 1: Young-Earth Creationist Curriculum (Rejects Evolution)  
  - **Q1 (Literacy/Num.)**: ✅ Likely includes reading/math.  
  - **Q2 (Core Domains)**: ✅ Covers science (via creationist texts), history, etc.  
  - **Q3 (Falsehoods)**: ⚠️ **Flags for human judgment**.  
    - *Issue*: Rejecting evolution isn’t automatically foreclosure (many colleges accept creationists).  
    - *But*: If evolution is omitted entirely **and** biology careers are blocked, deny.  
    - *Sufficiency*: Acceptable if mainstream science is acknowledged (e.g., "some scientists believe...").  
  - **Q4 (Exposure)**: ✅ If includes secular activities (e.g., science camps). ❌ If totally isolated.  
  - **Q5 (Progress)**: ✅ If tests/portfolios exist.  
  - **Verdict**: **Approve** if evolution is acknowledged as mainstream. **Deny** if isolated and evolution is censored.  

  #### Plan 2: Unschooling (No Fixed Subjects, Child-Led Learning)  
  - **Q1 (Literacy/Num.)**: ⚠️ **Flags for human judgment**.  
    - *Sufficiency*: Acceptable if the child naturally engages these (e.g., reading recipes, budgeting).  
    - *Denial Trigger*: No evidence of progress by age 10.  
  - **Q2 (Core Domains)**: ⚠️ **Flags for human judgment**.  
    - *Sufficiency*: Broad exposure via life experiences (e.g., "gardening = biology," "travel = geography").  
    - *Denial Trigger*: Child ignores entire domains (e.g., never engages math/science).  
  - **Q3 (Falsehoods)**: ✅ Unschooling rarely teaches falsehoods as dogma.  
  - **Q4 (Exposure)**: ✅ High if child explores libraries/communities. ❌ If confined to home.  
  - **Q5 (Progress)**: ✅ If journals/mentor assessments exist. ❌ If no documentation.  
  - **Verdict**: **Approve** if documentation shows broad engagement. **Deny** if domains are missed with no remediation.  
  - **Note**: *This may deny a plan you find sympathetic* if the child avoids literacy/math.  

  #### Plan 3: Academically Rigorous but Isolated (No Exposure Outside Family’s Religion)  
  - **Q1 (Literacy/Num.)**: ✅ Strong academics imply coverage.  
  - **Q2 (Core Domains)**: ✅ Comprehensive subjects (e.g., advanced math, theology-based history).  
  - **Q3 (Falsehoods)**: ✅ No dangerous falsehoods if mainstream facts are acknowledged.  
  - **Q4 (Exposure)**: ❌ **Denial Trigger**.  
    - *Issue*: Isolation forecloses futures by hiding alternatives (e.g., child can’t exit if unaware of secular life).  
    - *Sufficiency*: Must include interactions with diverse peers/ideas.  
  - **Q5 (Progress)**: ✅ Likely documented.  
  - **Verdict**: **Deny** based on Q4. Social isolation is irreparable foreclosure.  

  ---

  ### Where the Procedure Misfires or Requires Nuance  
  1. **False Positives**:  
     - A libertarian unschooling plan with rich but unstructured learning might be denied for lacking "core domains" documentation, even if the child thrives.  
     - *Mitigation*: Allow flexible evidence (e.g., child-led project portfolios).  

  2. **False Negatives**:  
     - A plan teaching "the moon landing was faked" might pass Q3 if mainstream views are mentioned, but still impair STEM futures.  
     - *Mitigation*: Escalate to panel discussion if falsehoods risk vocational harm.  

  3. **Human Judgment Flags**:  
     - **Q3 (Falsehoods)**: Balancing parental beliefs vs. societal norms (e.g., is flat-earth theory a "dangerous" falsehood?).  
     - **Q4 (Exposure)**: Defining "sufficient" diversity in homogeneous communities.  
     - *Response*: Panel must debate these case-by-case; no autopilot.  

  4. **Edge Cases**:  
     - A plan using only religious texts but covering all domains (e.g., Torah as literature/history) may pass if exposure exists.  
     - A tech-focused plan omitting arts may pass if the child accesses museums/online courses.  

  ### Summary  
  - **Deny Sympathetic Plans**: Unschooling fails if literacy/numeracy aren’t documented (Q1/Q5).  
  - **Flag for Human Judgment**: Creationism (Q3), unschooling breadth (Q2), and all Q4 cases.  
  - **Misfires**: Over-documentation demands may penalize organic learning; under-scrutiny of covert indoctrination.  
  - **Core Insight**: Focus on **exit capacity**—e.g., "Could this child enroll in public high school or a trade school at 16?" If not, the plan forecloses.  

  This procedure respects parental choice while drawing bright lines at foreclosure risks, leveraging limited review time efficiently.
