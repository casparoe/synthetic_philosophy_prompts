answer: |-
  Here’s a draft joint statement structured to meet your requirements. It forces clarity on premises, embeddings, and terminological disputes while avoiding hedged compromises. British English throughout.

  ---

  **Joint Statement on Triviality Results and the Nature of Conditionals**  
  *Agreed by: [Your Name], Suppositionalist; [Colleague’s Name], Truth-Conditionalist*  

  ### I. Agreed Claims  
  1. **Lewis’ Triviality Results**: Lewis (1976) demonstrates that, given a probability space with a Boolean algebra of propositions, identifying P(if A, B) with P(B|A) for all non-null A implies absurdity (e.g., P(B|A) = P(B)).  
     - *Cost to Suppositionalist*: Concedes that Adams’ Thesis cannot hold universally within standard Boolean probability frameworks.  
     - *Cost to Truth-Conditionalist*: Accepts that the proofs assume conditionals are propositions in a Boolean algebra.  

  2. **Adams’ Thesis**: If Adams’ Thesis (P(if A, B) = P(B|A)) is correct, then:  
     - (a) Conditionals cannot be propositions with truth conditions in a classical logic.  
     - (b) Assigning probabilities to compounds (e.g., conjunctions/negations of conditionals) is problematic.  
     - *Shared cost*: Both accept (a) as a direct consequence of triviality; both acknowledge (b) as the embedding problem.  

  3. **Probability for Conditionals**: For a conditional to have *any* probability:  
     - (a) It must be governed by norms of rational credence (e.g., Dutch book coherence).  
     - (b) This probability cannot equal P(B|A) *if* conditionals are Boolean propositions.  

  ---

  ### II. Residual Disagreements  
  | Claim                                                                 | Attrib. to Suppositionalist                                       | Attrib. to Truth-Conditionalist                                  |  
  |-----------------------------------------------------------------------|------------------------------------------------------------------|-----------------------------------------------------------------|  
  | **Nature of conditionals**                                            | "If A, B" expresses a conditional attitude, not a proposition.   | "If A, B" denotes a proposition with truth conditions.          |  
  | **Triviality refutes Adams’ Thesis?**                                | No: triviality assumes Booleanism, which begs the question.      | Yes: no coherent truth-conditional model reconciles the two.    |  
  | **Primary flaw in Lewis’ argument**                                   | Premise 3 (closure under Boolean operations on conditionals).    | Premise 1 (Adams’ Thesis as universally quantifiable).         |  
  | **Embedding solution**                                                | Non-Boolean "conditional events" avoid embedding pathologies.    | Embedding requires truth conditions (e.g., Stalnaker/Grice).    |  
  | **"Probably, if A then B"**                                           | Credence in the conditional *just is* P(B\|A).                   | Quantifies over worlds where A is true and B is probable.       |  

  ---

  ### III. Cruxes and Predictions  
  1. **Crux: Is the conditional Boolean?**  
     - *Test*: Can "If A, B" embed in truth-functional compounds (e.g., "¬(if A, B)" or "(if A, B) ∧ C") without semantic collapse?  
     - *Suppositionalist prediction*: Non-Boolean semantics (e.g., de Finetti 1936) will coherently assign probabilities to embedded cases.  
     - *Truth-Conditionalist prediction*: All embeddings require truth conditions; non-Boolean approaches will fail to define probabilities for compounds.  

  2. **Crux: Does the restrictor view resolve triviality?**  
     - *Test*: If if-clauses are domain restrictors (e.g., for modals: "If A, must B" ≈ "Must: B given A"), does this invalidate Lewis’ premises?  
     - *Suppositionalist*: Restrictor view bypasses triviality by denying conditionals are independent propositions.  
     - *Truth-Conditionalist*: Restrictor view changes the subject: it analyses *operators*, not *conditionals* as connectives.  

  3. **Crux: Verbal or substantive?**  
     - *Test*: If "proposition" requires bivalence and Boolean closure, is this a terminological stipulation?  
     - *Suppositionalist*: Yes; "proposition" smuggles in truth-conditional assumptions.  
     - *Truth-Conditionalist*: No; probability without propositions reduces to assertability conditions.  

  ---

  ### Independent Assessment of Risks (Neutral Observer’s Note)  
  **Likeliest flaw**: Agreed Claim 3(b) subtly favours the truth-conditionalist. If conditionals *must* have probabilities, and non-Boolean approaches fail to define them for embeddings (e.g., "If A, then if B, C"), the suppositionalist concedes ground. Conversely, if embeddings *can* receive probabilities without truth conditions (e.g., via Kaufmann 2005), the truth-conditionalist’s Premise 1 objection weakens.  

  **Is the dispute verbal?** It hinges on whether "probability" extends to non-propositional objects. If experiments show speakers assign compound probabilities to conditionals coherently (e.g., Fugard et al. 2011), the suppositionalist gains; if not, the truth-conditionalist’s charge of "change of subject" sticks.  

  **What would change my mind**: A formal proof that *any* algebra assigning probabilities to embedded conditionals (without truth conditions) must violate core axioms (e.g., additivity). This would collapse the suppositionalist position. Conversely, a model reconciling Adams’ Thesis with non-Boolean embeddings would force truth-conditionalists to retreat to Gricean pragmatics.  

  ---  
  *Formatting note: Use numbered sections, italics for attribution, and bold for crux headings to ensure clarity in the reading group.*

  This draft forces explicit admissions (e.g., "Premise 3" vs "Premise 1"), confronts embedding via tests, and flags terminological risks without arbitration. It leaves the restrictor view’s status open ("bypasses triviality" vs "changes the subject") as requested.
