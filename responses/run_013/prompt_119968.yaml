prompt: |-
  I am designing a ninety-minute internal seminar for a mixed group of ML engineers, policy analysts, and one philosopher. All of them know the basic proposal for AI safety via debate, but none has thought carefully about the obfuscated arguments problem. I want you to act as an expert in AI safety, computational complexity, and the pedagogy of technical philosophy, and to produce a teaching plan rather than an explanation. I need the order in which the ideas must be introduced and why each depends on the last; the single carrying example that should run through the whole session and what it must include and leave out; the misconceptions this audience will predictably bring or form, and the exact point in the sequence where each should be headed off; a closing question or exercise that would show whether they have understood the problem rather than merely learned its name; and the topics you would explicitly refuse to cover at this level, with a sentence on why. Please begin by brainstorming the dependency structure before you commit to an order.

  To make this concrete, build the seminar around the following invented case, which I want you to treat as the carrying example unless you can argue that a different one would teach the dependency structure better: a judge with a fixed context window and no ability to run code must adjudicate a debate over whether a model has a hidden backdoor. The dishonest debater offers a two-hundred-step argument that the backdoor is harmless; exactly one step is invalid, but the invalidity only becomes visible if the judge expands a definition that would consume most of the remaining context. The honest debater can name the flawed step but cannot make the judge see the flaw within the round. The audience will likely think the problem is just lying, or just computational complexity, or just a matter of giving the judge more time. I want the plan to separate those. In particular, the sequence should make clear how obfuscation differs from ordinary deception, why a debate protocol can be sound in the limit yet useless under bounded resources, and what the judge's limitations do to the burden of proof. End with the one thing you would want the audience to be able to reconstruct on a whiteboard a week later.
reasoning: |-
  We are designing a 90-minute seminar on the obfuscated arguments problem in AI safety via debate, using the provided case as the carrying example.

  **Brainstorming Dependency Structure:**
  1. **Recap of Debate Basics:** We must start by reminding the audience of the debate setup (two debaters, one judge, iterative expansion) to establish common ground. Without this, the example won't make sense.
  2. **Introduction of the Example:** Present the invented case (backdoor in a model, one dishonest debater, one honest, the judge's constraints). This grounds the abstract problem in a concrete scenario.
  3. **First Misconception: "It's Just Lying"** - We must show that the dishonest debater is not simply lying but using a complex argument with one hidden flaw. This requires introducing the structure of the argument (200 steps, one invalid step) and why the judge cannot immediately see the flaw (context window limits). This step separates obfuscation from simple falsehoods.
  4. **Computational Complexity Aspect:** Explain that even if the judge had more time (or could run code) but still had a bounded context window, the problem persists. This addresses the misconception that "more time" would solve it. We must show that the context window is the key bottleneck.
  5. **Soundness in the Limit vs. Bounded Resources:** Highlight that the debate protocol is sound if the judge can expand arbitrarily (in the limit) but fails under bounded resources. This requires showing that the honest debater could eventually reveal the flaw with enough rounds, but in one round (with limited context) they cannot.
  6. **Burden of Proof Shift:** Due to the judge's limitations, the burden of proof shifts. The honest debater cannot force the judge to see the flaw in one round, so the judge might rule for the dishonest side by default. This is a critical insight about practical debate protocols.
  7. **Why Obfuscation is a Distinct Problem:** Contrast with ordinary deception (which might be caught with sufficient scrutiny) to show that obfuscation exploits resource limits in a way that is hard to counter even when the honest party is trying to help.

  **Order and Why Each Depends on the Last:**
  1. **Recap of AI Safety via Debate (5 minutes):** 
     - Why: Without a shared understanding of the debate protocol (two agents, iterative expansion of arguments, judge decides), the example won't make sense. This ensures everyone is on the same page.
  2. **Introduce the Carrying Example (10 minutes):** 
     - Present the case: judge with fixed context window (say 300 tokens) and no code execution. The debate is about a hidden backdoor. The dishonest debater gives a 200-step argument that the backdoor is harmless, with one invalid step. The invalid step is only revealed if the judge expands a definition that would use up most of the context. The honest debater can name the flawed step but cannot demonstrate the flaw within one round because the expansion would exceed the context.
     - Why: This concrete scenario sets the stage. It depends on the recap because it uses the debate protocol.
  3. **Address Misconception 1: "It's Just Lying" (15 minutes):** 
     - Show that the dishonest debater is not just making a false claim but constructing a long, seemingly valid argument with a well-hidden flaw. The key is that the argument appears valid until a particular step is expanded. The honest debater's inability to refute it in one round is not due to lack of truth but due to the context constraint.
     - Why: This step must come after the example to clarify that the problem is structural (obfuscation) rather than a simple lie (which could be easily caught).
  4. **Computational Complexity and Context Bottleneck (20 minutes):** 
     - Explain that even with unlimited time and compute (but fixed context window), the judge cannot expand the critical step without exceeding the context. Thus, the problem is not about time but about the information that can be held at once. Contrast with a hypothetical where the judge could run code (which they can't in this setup) or had a larger context window.
     - Why: This builds on the example and the previous step by showing that the core issue is the bounded context, not computational time. It addresses the "just give more time" misconception.
  5. **Soundness in the Limit vs. Bounded Resources (15 minutes):** 
     - Show that in the limit (unbounded context over multiple rounds), the honest debater could win by forcing expansion step-by-step. But in one round (bounded context), they cannot. Thus, the protocol is sound asymptotically but may fail in practice.
     - Why: This depends on understanding the context bottleneck and the structure of the argument. It separates the theoretical soundness from practical failure.
  6. **Burden of Proof Shift (10 minutes):** 
     - Due to the context limit, the honest debater cannot meet the burden of proof in one round. The judge must decide based on what fits in the context, which favors the dishonest debater's obfuscated argument. This shifts the burden to the honest side to somehow compress the refutation, which may be impossible.
     - Why: This builds on the bounded resource issue and the structure of the argument. It highlights a key practical consequence.
  7. **Why Obfuscation is Distinct (5 minutes):** 
     - Contrast with ordinary deception: In ordinary deception, a lie might be caught by direct inspection. Obfuscation, however, uses valid-looking steps and hides the flaw in a way that requires resources beyond the judge's means. It's a problem of computational complexity and information design.
     - Why: This summary ties together the previous points and cements the distinct nature of obfuscation.

  **Closing Question/Exercise (5 minutes):**
  - **Question:** "Suppose we change the example: instead of a definition expansion, the flaw is hidden in a sub-argument that requires 201 steps to unpack, and the judge's context window is 200 steps. How does this change the strategies of the debaters, and what does it tell us about the judge's burden of proof?"
  - **Why this shows understanding:** It requires them to apply the concept to a variation. A correct answer would note that the honest debater still cannot show the flaw in one round (because 201>200) and that the burden of proof remains shifted. They should also note that the dishonest debater could design such an argument to exploit the context limit.

  **One Thing to Reconstruct a Week Later:**
  - The key takeaway is: "In a debate with bounded context, an obfuscated argument can force the honest debater to lose because they cannot fit the refutation into the context in one round, even though the argument is flawed. This shifts the burden of proof and makes the debate protocol vulnerable despite asymptotic soundness."

  **Topics to Explicitly Avoid:**
  1. **Specific Complexity Classes (e.g., NP-completeness):** We avoid because the audience may not share the same background, and the point can be made without formal complexity theory.
     - Why: The seminar is about the problem structure, not a complexity theory lecture. We can say "computationally hard" without going into classes.
  2. **Alternative Debate Protocols (e.g., cross-examination, tree debates):** We avoid because the goal is to understand the problem in the basic protocol, not to solve it.
     - Why: Solutions are out of scope; we are focusing on the problem itself.
  3. **Philosophical Grounding of Proof and Truth:** We avoid deep philosophy because the mixed audience needs a technical focus, and we have limited time.
     - Why: The philosopher might want to go deeper, but the seminar must stay focused on the obfuscated arguments problem. We can acknowledge that the burden of proof is a philosophical concept but not delve into epistemology.

  **Detailed Timing Breakdown (90 minutes total):**
  - 0-5 min: Recap of Debate Basics
  - 5-15 min: Introduce Carrying Example
  - 15-30 min: Address Misconception 1 ("Just Lying")
  - 30-50 min: Computational Complexity and Context Bottleneck (includes discussion of time vs. context)
  - 50-65 min: Soundness in the Limit vs. Bounded Resources
  - 65-75 min: Burden of Proof Shift
  - 75-80 min: Why Obfuscation is Distinct
  - 80-85 min: Closing Question/Exercise (interactive)
  - 85-90 min: Wrap-up and Key Takeaway

  **Materials:**
  - Whiteboard for drawing the argument structure (200 steps, one step that expands to a large definition)
  - Slides for the example and key points.

  **Adjustments for Audience:**
  - ML Engineers: Emphasize the computational constraints (context window as a hard bottleneck).
  - Policy Analysts: Highlight the practical implications for real-world deployment (protocols that are sound in theory but fail in practice).
  - Philosopher: Engage with the burden of proof and epistemic limitations, but within bounds.

  This plan ensures that each concept builds on the previous, misconceptions are addressed when they naturally arise, and the carrying example ties everything together.
answer: |-
  ### Teaching Plan: Obfuscated Arguments in AI Safety via Debate  
  **Core Objective:** Distinguish obfuscation from simple lying/complexity, clarify why bounded resources break debate protocols, and expose burden-of-proof shifts.  
  **Carrying Example:** The *backdoor debate* (as specified). Key elements:  
  - **Judge:** Fixed context window (e.g., 300 tokens), no code execution.  
  - **Dishonest Debater:** 200-step argument that backdoor is harmless; one invalid step (flaw masked by a compressed definition).  
  - **Honest Debater:** Can identify the flawed step but lacks space to expand the definition (requires 250 tokens; only 100 left).  
  *What it omits:* Technical specifics of backdoors, alternative protocols, or complexity classes (focus on *structure* of obfuscation).  

  ---

  #### **Order of Ideas and Dependencies**  
  **Total: 90 minutes**  
  1. **Recap Debate Protocol + Example Setup (10 min)**  
     - *Content:* Quick review of debate mechanics (two agents, iterative expansion, judge’s vote). Introduce the backdoor example.  
     - *Why start here:* Ensures shared baseline. Example makes abstract protocol tangible.  
     - *Dependency:* None (foundation).  

  2. **Surface the “Lying” Misconception (15 min)**  
     - *Content:* Focus on the dishonest debater’s argument. Ask: *“Is this just a lie?”* Show the 200-step argument appears valid step-by-step until the critical step. Contrast with blatant falsehoods (e.g., “1+1=3”).  
     - *Why now:* Corrects the instinct that truth-telling alone solves deception. Preempts “honest debater should just object” reactions.  
     - *Dependency:* Requires the example to ground "hidden flaw vs. explicit lie".  

  3. **Judge’s Context Limit: Beyond Time/Compute (20 min)**  
     - *Content:* Simulate the judge reviewing the argument. Show:  
       - Dishonest debater’s argument fits (200 steps = 200 tokens).  
       - Honest debater’s refutation needs 250 tokens (but only 100 available).  
     - *Why now:* Separates context from computational power. Prevents “just give more time/CPU” by showing expansion is physically impossible.  
     - *Dependency:* Step 2 showed dishonesty isn’t overt; now constraints prevent exposure.  

  4. **Asymptotic Soundness vs. Bounded Failure (20 min)**  
     - *Content:* Prove the protocol *would* work with infinite context (flaw exposed in round 2). Contrast with single-round bounded failure. Use equation: *Soundness(∞) ≠ Soundness(bounded)*.  
     - *Why now:* After constraints (Step 3), shows debates fail *despite* working in theory. Prevents “debate is flawed” overgeneralization.  
     - *Dependency:* Judge’s limits (Step 3) enable this tension.  

  5. **Burden of Proof Shift (15 min)**  
     - *Content:* Highlight the honest debater’s dilemma: They *know* the flaw but must *prove* it within limits. Ask: *“Who holds the burden?”* Contrast with courts (balance shifts to accuser).  
     - *Why now:* Links constraints to epistemic injustice. Prevents “judge should assume dishonesty” by showing space limits force neutrality.  
     - *Dependency:* Steps 2–4 established obfuscation’s mechanics; now the strategic consequence.  

  6. **Obfuscation ≠ Complexity Alone (5 min)**  
     - *Content:* Contrast with “hard math problems.” Obfuscation is *adversarial design*: the flaw is *hidden*, not intrinsically complex (e.g., expanding the definition is trivial but space-bound).  
     - *Why now:* Final consolidation. Prevents “just optimize judges” by reframing as arms race.  
     - *Dependency:* All prior steps deconflate components; now unify into a distinct threat.  

  ---

  #### **Predictable Misconceptions & Mitigation**  
  - **“Lying is the core problem.”**  
    *Headed off in Step 2:* Show the argument isn’t false but rigged to *exploit* constraints.  
  - **“More time/compute fixes this.”**  
    *Headed off in Step 3:* Emphasize context as a *fixed* bottleneck (like RAM vs. CPU).  
  - **“Debate protocols are unsound.”**  
    *Headed off in Step 4:* Prove soundness-in-limit, then break bounded execution.  
  - **“Judges should distrust long arguments.”**  
    *Headed off in Step 5:* Show burden of proof forces neutrality; distrust breeds false positives.  

  ---

  #### **Closing Exercise: Test Understanding (5 min)**  
  - **Prompt:** *“In a new debate about biased hiring algorithms, the dishonest debater’s 150-step argument hides a flawed correlation in a compressed dataset ID. The honest debater can name the ID but not unpack it (needs 120 tokens; 50 left). How does this exploit obfuscation (not lying/complexity)? Why might the judge wrongly side with dishonesty?”*  
  - **Why it works:** Tests grasp of adversarial design, context limits, and burden shift. Correct answers will distinguish obfuscation from intrinsic hardness and note the judge’s forced neutrality.  

  ---

  #### **Topics Explicitly Excluded**  
  1. **Complexity classes (e.g., NP-hardness):**  
     *Why:* Adds unnecessary formalism; obfuscation is about adversarial bottlenecks, not intrinsic problem hardness.  
  2. **Alternative protocols (e.g., cross-examination):**  
     *Why:* Focus is on diagnosing obfuscation in *standard* debate; solutions distract from core mechanics.  
  3. **Ethics of deceptive AI:**  
     *Why:* The philosopher may crave this, but the goal is technical/pragmatic (flaw exploitation, not moral philosophy).  

  ---

  #### **Whiteboard Takeaway (1 Week Later)**  
  The audience should recreate:  
  ```  
  Obfuscated Argument = Valid-looking + Hidden flaw + Judge's constraints  
  → Honest debater can't refute within bounds  
  → Burden shifts → Judge fails despite protocol soundness (∞)  
  ```  
  *Why this endures:* It captures the dependency chain (obfuscation → constraints → burden shift → failure) without jargon.
