  Based on your 15 verdicts and internal tensions, I propose **two core principles** that cohere 13 of your positions while requiring revision to two. These principles address your key conflicts about fairness, coercion, exploitation, and civic obligation:

  ### The Principles
  1.  **Equal Vulnerability Principle (EVP):** *A state may impose mandatory service burdens only under rules that expose all eligible citizens to equal vulnerability to the burden, with exemptions permitted solely for incapacity or categorical moral objection. The burden itself must be standardized and non-commodifiable.*
  2.  **Anti-Commodification Principle (ACP):** *Citizenship duties essential to communal survival (like defense) cannot be transferred, sold, or outsourced. The state must not create markets where safety is bought from or sold by citizens or non-citizens.*

  ---

  ### How the Principles Work
  -   **EVP** handles *fairness in distribution*: It mandates universal eligibility (your #3, #4), rejects wealth-based escape hatches (#8, #9), forbids group exemptions (#6), and accepts incapacity (#2) or genuine conscience (#5) as the *only* grounds for alternative burdens (provided they are standardized and proportional). It explains your rejection of selective objection (#7) – it violates equal vulnerability by letting individuals self-exempt based on contingent judgments. It also accepts skill-based conscription in emergencies (#11) because "vulnerability" shifts to those whose skills are critical for survival when equality is impossible.
  -   **ACP** handles *the nature of the duty*: It forbids treating civic risk as a tradeable commodity. This condemns substitution (#9), mercenaries/outsourcing (#10), prisoner conscription (#12 – their service is commodified via sentence reduction), and arguably professional armies relying on economic coercion (#8). It accepts alternative service (#5) and incapacity levies (#2) because they are *non-transferable standardized burdens* imposed by the state, not market transactions. It supports armed neutrality (#13) as a communal project and condemns free-riding (#14) as a failure of communal duty.

  ---

  ### Application to Your Verdicts
  | Verdict | Supported? | Principle Applied | Tension Resolved |
  |---------|------------|-------------------|------------------|
  | 1 (Swiss militia) | ✔️ | EVP: Universal vulnerability | Justified by structure, not consent |
  | 2 (Unfit levy) | ✔️ | EVP (incapacity) + ACP (non-commodifiable) | Differs from #15 levy: incapacity vs. choice |
  | 3 (Pure lottery) | ✔️ | EVP: Maximizes equal vulnerability | Baseline fairness |
  | 4 (Gender-neutral) | ✔️ | EVP: Universal eligibility | Rejects arbitrary exclusion |
  | 5 (Conscientious objection) | ✔️ | EVP: Categorical moral exemption | Longer service ≠ punishment if standardized |
  | 6 (Group exemption) | ✖️ | EVP: Violates equal vulnerability | Reject: Undermines universality |
  | 7 (Selective objection) | ✔️ | EVP: Rejects contingent self-exemption | Serve or be punished |
  | 8 (Volunteer force) | ✖️ | ACP: Commodifies risk via economic coercion | Revise: Accept if not exploitative |
  | 9 (Substitution/fee) | ✔️ | ACP: Forbids commodification | Clearly unjust |
  | 10 (Mercenaries) | ✔️ | ACP: Outsourcing civic duty | Unjust even if "voluntary" |
  | 11 (Skill-based draft) | ✔️ | EVP: Vulnerability shifts in true emergency | Accepts necessity over equality |
  | 12 (Prisoner conscription) | ✔️ | ACP: Commodifies service (sentence as currency) | Worse than citizen conscription |
  | 13 (Armed neutrality) | ✔️ | EVP + ACP: Non-market communal defense | Legitimate and responsible |
  | 14 (Free-riding) | ✔️ | ACP: Evades communal duty | Parasitic |
  | 15 (Opt-out levy) | ✖️ | EVP + ACP: Choice creates unequal vulnerability; commodifies safety | Reject levy as inconsistent |

  **Inconsistent Verdicts to Revise:**
  1.  **#6 (Group Exemption):** You must reject this. EVP permits *individual* conscience (#5) but not group exemptions, which create privileged classes and violate equal vulnerability (e.g., Jehovah's Witnesses exemption).
  2.  **#8 (Volunteer Force):** You must soften this. ACP condemns *exploitative* volunteering (poor coerced by poverty), but not professional armies *if* pay/conditions avoid exploitation and service is seen as a civic profession. Your principle allows conscription as a fallback if volunteering fails EVP/ACP.

  **#15 (Opt-out Levy):** The principles condemn this. Unlike #2 (levy for *incapacity*), this allows *able-bodied citizens to buy safety*, violating EVP (unequal vulnerability) and ACP (commodification). It differs from #5 (conscientious objection) because the levy is a *financial choice*, not a moral exemption with alternative service.

  ---

  ### New Case Evaluations
  1.  **Close Case (Testing EVP):** *A lottery with* ***no*** *exemptions – not even medical or conscientious. All serve if drawn, regardless of fitness or belief.*  
      **Verdict:** ✖️ Rejected. Violates EVP by not exempting incapacity (medical) or categorical moral objection (conscience). Equal vulnerability requires *reasonable* exemptions for those fundamentally unable or morally forbidden to serve.

  2.  **Edge Case (Testing ACP):** *A small country mandates 6 months of civilian service (e.g., infrastructure, eldercare) for all 18-year-olds. It allows citizens to "sponsor" a foreign volunteer to do their service for them at market rates.*  
      **Verdict:** ✖️ Rejected. While civilian service may be legitimate, "sponsorship" commodifies the duty (violating ACP) and creates unequal vulnerability (violating EVP). Safety/service is bought, and the rich avoid the burden entirely.

  ---

  ### Why Simplicity Over Perfection?
  A single principle cannot resolve all tensions (e.g., #3 vs. #11, #2 vs. #9). Two principles are needed:
  - **EVP** explains fairness in *distribution* (lottery good, skill-draft emergency-acceptable).
  - **ACP** explains the *non-market nature* of civic duty (substitution bad, mercenaries bad).

  Sacrificing **#6 (group exemption)** and revising **#8 (volunteer force)** is justified:
  - #6 is a clear outlier in your otherwise universalist stance.
  - #8’s condemnation relies on an idealized view of conscription; professional armies can satisfy EVP/ACP if structured responsibly (e.g., fair pay, no economic conscription).

  **Result:** 13 verdicts preserved, #6 rejected, #8 revised. #15’s levy is correctly condemned by your core intuitions once EVP/ACP are applied. The "equal vulnerability" and "anti-commodification" principles provide a coherent framework for new cases while resolving your conflicts over fairness, coercion, and exploitation.
