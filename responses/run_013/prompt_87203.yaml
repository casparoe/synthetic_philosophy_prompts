  Okay, the user is grappling with a complex ethical and political dilemma about conscription, professional armies, and armed neutrality. They've laid out 15 specific verdicts on different scenarios and are struggling to find a unifying principle that justifies all their positions consistently. 

  First, I notice this is clearly someone with deep personal experience (Swiss upbringing, now in a small neutral country) and sophisticated political philosophy instincts. Their frustration is palpable - they've identified internal contradictions in their own views and want resolution, not just validation. The level of detail suggests they've wrestled with this for years.

  Hmm... their tentative principle about "burden of risk only on beneficiaries" is interesting but clearly flawed, as they themselves suspect - it would condemn their own acceptance of Swiss exemption taxes and alternative service. That's the core tension: how to reconcile equality of obligation with legitimate exemptions.

  Let me break this down systematically:

  The strongest pattern across their verdicts seems to be about equal vulnerability to state coercion. They consistently reject any system where:
  - Wealth can buy exemption (8,9)
  - Group identity grants privilege (6)
  - Market forces exploit economic desperation (10)
  While accepting:
  - Randomized coercion (3)
  - Medically necessary exemptions (3)
  - Proportionate burdens (2,5)

  The Swiss exemption tax works because it's proportional to income and targets incapacity rather than choice. That's crucially different from a flat fee. Similarly, longer alternative service isn't punitive because it maintains equivalent sacrifice.

  Their discomfort with (15)'s opt-out levy makes perfect sense under this framework - it creates two classes of citizens: those who serve and those who buy their way out. Whereas the Swiss system only exempts those physically unable to serve, maintaining the principle that everyone capable must contribute equally.

  For new test cases: 
  A) No-exemption lottery would align with their values better than their current (3) which allows medical exemptions. But they'd probably accept this as consistent with their medical exemption stance.
  B) NATO-style mutual defense would violate their anti-parasitism principle but might pass if contributions are proportional.

  The professional volunteer force case is thorniest. They call it "exploitation" but acknowledge no coercion exists. This might require a separate principle about structural injustice - that desperate choices aren't truly free. Their intuition prefers transparent state coercion over hidden economic coercion.

  Ultimately, their verdicts cluster around two distinct ideals:
  1. Equal exposure to communal defense obligations
  2. Non-commodification of civic duty
  When these conflict (as in 11's skills-based draft), they prioritize effectiveness, revealing a hidden pragmatism.

  I'll propose two principles with clear boundaries, show exactly where they validate or challenge the user's 15 verdicts, and suggest surrendering the blanket objection to professional armies since that's the weakest link in their otherwise coherent framework. The alternative service and exemption tax positions can be saved through the proportionality argument.
