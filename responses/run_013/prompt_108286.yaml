prompt: |-
  I'm putting together a "which view do you actually hold?" quiz for the first meeting of a reading group on virtual worlds — specifically whether virtual objects and virtual harms are real. It's going up on a blog so people can fill it in at home, which means it has to stand on its own: no citations, no reading list, no names of philosophers, and no jargon that would need a footnote. But I don't want it dumbed down either. I want the cases in the weeds enough that you can't get through it by reciting the standard positions.

  Format: 9 questions, each one a concrete case, each with exactly three options (A/B/C). Every option should be something a real person could actually say out loud about that case, in the first person, and none of the options should be the obviously sensible one. And no question may just ask "do you think virtual objects are real?" — the whole point is to sort people by what they say about cases, not by which label they like.

  Two things I want baked in, both of which I've never seen anyone state cleanly, and which are kinda the point of the whole quiz:

  - Ontology and ethics come apart. Everyone assumes that if virtual objects aren't real then virtual harms can't be either, and vice versa. I want at least one outcome that pairs "the sword is a fiction" with "the griefing was a real harm", and at least one that pairs "the sword is a real thing" with "the griefing wasn't a harm at all".
  - The reload test. Imagine the state gets rolled back and nobody keeps any memory of the episode. Then ask what, if anything, was lost. Use this in at least three of the questions — it seperates the people who think harm lives in mental states from the ones who think it lives in violated norms or in the object itself.

  Cases I want in there for sure: a duplication bug that spawns a second copy of a one-of-a-kind item; unwanted touching in a social VR room; a player's account being stolen; a platform deleting a memorial someone built for a dead friend; an NPC that begs you not to kill it; a player who loses an item in a duel they agreed to; and a world shutting down that people had paid real money into. Fill the rest yourself, but pick cases where two plausible views give different verdicts.

  Must appear somewhere in the outcomes: the view that virtual objects are real non-material objects; the view that they're fictions; the view that they're real only as social/institutional facts (they exist because we enforce ownership); the eliminativist view that there's only the hardware and "the sword" is a handy label; the view that virtual harms are real whenever they produce real mental states; the view that a harm is real only under the description the participant accepts; and a deflationary view that says "real" is doing no work here and we should be asking what the words license instead. If any pair of those can't be seperated by any answer pattern, say so instead of fudging it. Also flag any answer combination that no real position occupies, and say whether that's because the view is incoherent, unattractive, or just unexplored.

  Give it back to me as JSON, like this:

  {
    "quiz_title": "...",
    "questions": [
      {
        "id": "Q1",
        "case": "2-4 sentences describing the concrete situation",
        "options": [
          {"key": "A", "text": "first-person thing someone could say", "axis": "short name of the axis this option probes", "leans": "which outcome this option pushes toward"}
        ]
      }
    ],
    "axes": [{"name": "...", "what_it_separates": "..."}],
    "scoring_key": [
      {
        "position": "short label (or 'unnamed')",
        "one_line_commitment": "...",
        "awkward_commitment": "the thing this view has to swallow",
        "pattern": "rule for which answer patterns land here, e.g. 'A on Q1/Q4/Q7 and not B on Q5'"
      }
    ],
    "unoccupied_combinations": [
      {"combination": "...", "diagnosis": "...", "verdict": "incoherent | unattractive | merely unexplored"}
    ],
    "cannot_separate": [{"positions": ["...", "..."], "why": "..."}]
  }

  Order the scoring key from the most to the least common view, and keep the whole thing under 1500 words.
reasoning: |-
  We are designing a quiz with 9 questions, each with three options (A/B/C). The quiz should probe views on virtual objects and virtual harms without using jargon or requiring citations. Key features: 
   - Ontology and ethics should come apart in at least one outcome (e.g., virtual objects not real but virtual harm real, and vice versa).
   - The "reload test" (rollback with no memory) should appear in at least three questions to separate views on where harm resides (mental states vs. norms vs. object).
   - Cases to include: duplication bug, unwanted touching in VR, account stolen, platform deleting a memorial, NPC begging not to be killed, losing an item in a duel, world shutting down with real money invested. We need two more cases. Let's choose: 
     1. A case where a virtual object is used to threaten someone in real life (to probe the connection between virtual and real harm).
     2. A case of virtual vandalism (e.g., defacing a virtual artwork that took hours to create).

   We must cover the following views in the outcomes:
     Ontology:
       - Virtual objects are real non-material objects.
       - They are fictions.
       - They are real only as social/institutional facts (enforced by ownership).
       - Eliminativist: only hardware exists, "sword" is a handy label.

     Ethics:
       - Virtual harms are real whenever they produce real mental states.
       - A harm is real only under the description the participant accepts.
       - Deflationary: "real" is doing no work; we should ask what the words license.

   We also need to note any unoccupied combinations and any pairs that cannot be separated.

   Steps:
   1. Define the 9 cases (using the 7 specified and adding 2 more).
   2. For each case, write 3 options (A/B/C) that are first-person statements, each probing a different axis and leaning toward a particular view.
   3. Define the axes (what each option probes and what it leans toward).
   4. Define the scoring key: positions (labels), their one-line commitment, an awkward commitment, and the pattern of answers that lead to that position.
   5. Note unoccupied combinations and any positions that cannot be separated.

   Let's design the cases and options:

   Case 1: Duplication Bug
     Situation: In an online game, a rare one-of-a-kind sword is duplicated by a bug, creating two identical copies. The original owner and another player both claim the sword is theirs.

     Options:
       A: "The sword was always just data, so having two copies now doesn't change anything. They're both equally real." 
          (Probes ontology: eliminativist/social fact? Leans toward: virtual objects are just data, so duplication is fine.)
       B: "The original sword was unique and real, but the duplicate is a fake. Only the original owner has the real one."
          (Probes ontology: real non-material object? Leans toward: original is real, duplicate is not.)
       C: "Both swords are equally real because the game now treats them as identical and the community accepts them."
          (Probes ontology: social/institutional fact. Leans toward: reality is determined by social enforcement.)

     Axis for this question: "Ontology of virtual objects (duplication)"

   Case 2: Unwanted touching in social VR
     Situation: In a virtual reality social space, a user repeatedly touches another user's avatar in a way that makes them uncomfortable, despite being asked to stop.

     Options:
       A: "That was a real violation because it caused real distress, even if it was just virtual touching."
          (Probes ethics: harm from mental state. Leans toward: virtual harm is real if it causes real mental state.)
       B: "It's just pixels moving. The harm isn't real unless it spills over into real life, like if they doxxed or threatened the person."
          (Probes ethics: harm only when connected to real-world actions. Leans toward: virtual harm isn't real harm.)
       C: "What matters is the shared rules of the space. If the community norms say that's harassment, then it's a real harm."
          (Probes ethics: harm as violation of norms. Leans toward: harm is real if it breaks social norms.)

     Axis: "Ethics of virtual contact"

     Reload test: If we roll back the state and no one remembers, what was lost?
       Option A would say the harm was real and the distress was real at the time, so something was lost even if forgotten.
       Option B would say nothing real was lost because it was just virtual and forgotten.
       Option C would say the harm was in the violation of norms, which occurred and then was erased, so the harm is gone.

   Case 3: Account stolen
     Situation: A player's account is hacked, and the thief sells all their virtual items and deletes their characters.

     Options:
       A: "The real harm is the time and effort the player put into building that account, now wasted."
          (Probes: harm as loss of invested effort. Leans toward: harm is real because of the mental state of loss and wasted effort.)
       B: "The harm is real because it's theft: the items and account were the player's property, even if virtual."
          (Probes: virtual objects as property (social/institutional fact). Leans toward: harm as violation of ownership.)
       C: "It's only a harm if the player feels bad about it. If they don't care, then nothing was lost."
          (Probes: harm only under the participant's description. Leans toward: harm is subjective.)

     Axis: "Harm from virtual theft"

   Case 4: Platform deleting a memorial
     Situation: A player built a virtual memorial for a deceased friend in a game. Without warning, the platform deletes it for violating a rule against personal structures.

     Options:
       A: "The memorial was a real expression of grief, and destroying it caused real pain, so it was a real harm."
          (Probes: harm from mental state. Leans toward: harm is real if it causes pain.)
       B: "The memorial was just pixels and code. The real issue is that the platform broke its own rules or was insensitive."
          (Probes: ontology of the memorial. Leans toward: virtual objects are not real; the harm is in the real-world behavior of the platform.)
       C: "The harm is that the platform violated the player's virtual property rights and the social meaning of the memorial."
          (Probes: social/institutional fact. Leans toward: harm as violation of social norms and property.)

     Reload test: If the platform restores the memorial and rolls back, so no one remembers the deletion, what was lost?
       A: The pain was real at the time, so harm occurred.
       B: The memorial wasn't real, and after rollback, nothing is lost.
       C: The violation of rights was real, but if restored and forgotten, the harm is undone? Or maybe not? This might be tricky.

     Axis: "Harm from destruction of virtual meaning"

   Case 5: NPC begging not to be killed
     Situation: In a game, a non-player character (NPC) programmed to act sentient begs for its life when the player tries to kill it.

     Options:
       A: "It's just a program; there's no real harm in killing it, no matter how it acts."
          (Probes: ontology of NPCs. Leans toward: eliminativist/fictional.)
       B: "The harm is in the desensitization of the player. If it makes the player more callous to real suffering, that's a real harm."
          (Probes: harm as indirect effect on real world. Leans toward: harm only if it affects real behavior.)
       C: "The harm is real because the game creates a situation where the player is violating a plea for mercy, which is a real moral failing."
          (Probes: harm under the description the participant accepts (if the player feels they are doing wrong). Leans toward: harm as moral failing in the virtual context.)

     Axis: "Ethics of virtual cruelty to NPCs"

   Case 6: Losing an item in a duel
     Situation: Two players agree to a duel with high stakes: the loser must give a rare item to the winner. After losing, the loser refuses to hand it over.

     Options:
       A: "The item is just data, and the duel was just a game, so there's no real obligation to hand it over."
          (Probes: ontology and social fact. Leans toward: virtual objects not real, so no real obligation.)
       B: "The harm is real because the loser broke a promise and violated the rules of the game they both accepted."
          (Probes: harm as violation of norms. Leans toward: social/institutional fact for both the item and the harm.)
       C: "The winner feels cheated, so that's a real harm, but the item itself isn't real."
          (Probes: separating ontology and ethics. Leans toward: object not real, but harm is real because of mental state.)

     Axis: "Enforcement of virtual agreements"

     Reload test: If the game state is rolled back to before the duel, so the item never changed hands and no one remembers, what was lost? 
       A: Nothing, because it was just a game.
       B: The violation of the agreement was real, but if rolled back, it might be as if it never happened? But the agreement was made and then broken, even if undone. This is complex.

   Case 7: World shutting down with real money invested
     Situation: A virtual world shuts down permanently. Players had spent hundreds of real dollars on virtual items that are now gone.

     Options:
       A: "The real harm is the financial loss. They paid real money for something that disappeared."
          (Probes: harm as financial loss. Leans toward: virtual objects as having real financial value.)
       B: "The harm is the loss of the time and emotional investment, not the money itself. The virtual items were never real property."
          (Probes: harm as loss of effort and emotion. Leans toward: objects not real, but harm is real because of mental state.)
       C: "There's no real harm because they knew it was virtual and temporary when they paid. It was just for fun."
          (Probes: deflationary? Leans toward: no harm because virtual.)

     Axis: "Harm from virtual world shutdown"

   Case 8 (added): Virtual Threat
     Situation: In a game, a player points a virtual gun at another player's avatar and says, "I know where you live and I'm coming to kill you."

     Options:
       A: "The threat is real because it caused real fear, regardless of the virtual context."
          (Probes: harm from mental state. Leans toward: harm is real if it produces real fear.)
       B: "The virtual gun is just a prop, but the words are a real threat because they were communicated in real life."
          (Probes: separation of virtual and real. Leans toward: the virtual object is not real, but the speech is real.)
       C: "It's only a real threat if the victim believes it and if the threatener has the means to carry it out. Otherwise, it's just roleplay."
          (Probes: harm under the description the participant accepts and real-world connection. Leans toward: harm only if it meets real-world criteria.)

     Axis: "Threats in virtual context"

   Case 9 (added): Virtual Vandalism
     Situation: An artist creates a complex virtual sculpture in a public area of a virtual world. Another player destroys it, and the artist is upset.

     Options:
       A: "The sculpture was just data, so no real harm was done. The artist can just make another one."
          (Probes: ontology. Leans toward: eliminativist.)
       B: "The harm is real because the artist put real time and creativity into it, and that effort was disrespected."
          (Probes: harm from mental state and effort. Leans toward: harm is real because of the artist's feelings and effort.)
       C: "It's a real harm because it violates the shared understanding that virtual art is protected property and should be respected."
          (Probes: social/institutional fact. Leans toward: harm as violation of norms.)

     Axis: "Harm from virtual destruction of art"

     Reload test: If the sculpture is restored and the vandalism undone, and no one remembers, what was lost?
       A: Nothing, it was just data.
       B: The artist's distress at the time was real, so harm occurred.
       C: The norm violation occurred, but if undone and forgotten, the harm is repaired? Or the violation remains in the act?

   Now, we need to define the scoring key. We are to cover the following positions:

     Ontology:
       - Real non-material objects
       - Fictions
       - Real as social/institutional facts
       - Eliminativist (only hardware)

     Ethics:
       - Harm real when producing real mental states
       - Harm real only under the description the participant accepts
       - Deflationary (avoid "real")

     And we want to separate ontology and ethics.

   We also want at least one outcome that pairs:
     - "sword is a fiction" with "griefing was a real harm"
     - "sword is a real thing" with "griefing wasn't a harm at all"

   We'll have to map answer patterns to positions. We'll define the positions in the scoring key.

   Possible positions (we'll label them):

    1. Social Constructivist: 
       Ontology: Virtual objects are real as social/institutional facts.
       Ethics: Harm is real when it violates social norms or property rights.

    2. Mental State Reductionist:
       Ontology: Virtual objects are not real (they are fictions or data).
       Ethics: Harm is real whenever it produces real mental states (distress, etc.).

    3. Fictionalist:
       Ontology: Virtual objects are fictions (they are not real, but we engage with them as if they were).
       Ethics: Harm is not real unless it spills into the real world (e.g., real threats, real desensitization). In the virtual context, it's just part of the story.

    4. Eliminativist:
       Ontology: Only the hardware exists; virtual objects are just handy labels.
       Ethics: Harm is never real in virtual contexts because there's nothing to harm and no real norms. Only real-world effects (like financial loss) matter.

    5. Dualist (or Non-Material Realist):
       Ontology: Virtual objects are real non-material objects.
       Ethics: Harm can be real in the virtual world because it's a real moral failing, independent of mental states.

    6. Deflationary:
       Avoids the word "real". Instead, focuses on what the words license: e.g., we can say "the sword exists in the game" and that's true within the game's rules, and we can say "the harm was wrong" because it violates shared norms or causes avoidable distress.

    7. Participant Relativist:
       Ontology: Virtual objects are real under the description the participant accepts (e.g., if you treat it as real, then for you it is).
       Ethics: Harm is real only under the description the participant accepts (if the victim feels harmed and the context supports it, then it is).

   We must note that we want to separate ontology and ethics. For example, we might have:

     - Mental State Reductionist: objects not real, but harm is real (because of mental state).
     - Fictionalist: objects not real, and harm not real (unless real-world effect).

     And we might have:
     - Dualist: objects real, and harm real (but perhaps harm is real even without mental state? e.g., in the NPC case, killing is wrong even if the player doesn't feel bad).

   However, note the requirement for at least one pattern that pairs "object real" and "harm not real". This might be a position that says virtual objects are real (as non-material) but the harms are not real because they are part of the game and consented to? But in the duel case, they agreed to the duel, so no harm? That would be a specific case.

   Let's try to map the answers to positions. We'll design the scoring key after we have all the questions.

   First, we write the full quiz in the required JSON format.

   We'll assign each option an axis and a lean. The axis is a short name for the dimension it probes, and the lean is toward a particular position. We'll use the position labels we have above.

   But note: the lean is just which way it pushes. The overall position is determined by the pattern.

   We'll define the axes as well.

   Let's write the JSON.
