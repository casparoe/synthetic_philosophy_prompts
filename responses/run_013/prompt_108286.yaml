        "combination": "B on all harm questions + A on all object questions",
        "diagnosis": "Claims virtual objects are fictional but norm violations cause real harm independent of mental states",
        "verdict": "incoherent (norms require objects to have institutional reality)"
      }
    ],
    "cannot_separate": [
      {
        "positions": ["Social Constructivist", "Deflationary Relativist"],
        "why": "Both emphasize rules/descriptions over intrinsic reality; differ only in whether they reify 'social facts'."
      }
    ]
  }
  ```

  ### Design Notes:
  1. **Ontology-Ethics Split**: Achieved via Mental-State Harm Theorist (objects fictional, harms real) vs. Eliminativist (objects fictional, harms unreal). Non-Material Realist pairs real objects with real harms.
  2. **Reload Test**: Featured in Q5 (duel rollback), Q7 (account restoration), and implied in Q3/Q8 (reversibility of destruction). Separates mental-state harm (persists after undo) from norm-based harm (depends on permanent violation).
  3. **Uncovered Views**: 
     - "Harm only under participant description" is distributed: Mental-State Theorist (Q2/Q3) and Deflationary (Q9) cover aspects.
     - Eliminativist handles "only hardware" view.
  4. **Edge Cases**: 
     - NPC begging (Q4) forces confrontation with moral patiency without sentience.
     - Duplication bug (Q1) tests uniqueness vs. fungibility.
  5. **Scoring Logic**: Patterns avoid simple binaries (e.g., Q4 options don't map cleanly to ontology/ethics axes). Outcomes reflect real philosophical tensions, not just preferences.
