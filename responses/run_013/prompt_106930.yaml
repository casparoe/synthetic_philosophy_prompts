prompt: |-
  I'm a science journalist and I've got a long feature due on why philosophers still can't agree on what it even means for one thing to cause another. Before I start ringing people up, I want the spec, not the theories. So: write me the list of things any theory of causation has to get right to be worth taking seriously.

  The cases it has to handle — the booby-trapped classics like preemption and overdetermination, sure, but also the ones I think are actually harder: causation by omission, double prevention, and cases where the effect is simultaneous with the cause. The distinctions it must not collapse — cause vs. mere correlation, cause vs. explanation, and 'a cause' vs 'the cause' when we single one thing out of a whole sufficient set of conditions. And the constraints it can't contradict, like the fact that causal claims seem to come in degrees, and that we can cleanly intervene on some systems but not others.

  Here's the wrinkle I keep coming back to and want the spec to speak to: picture a thermostat-controlled heater — the room's temperature and the heater's being on are each a function of the other, so any tidy 'turn the knob' intervention seems to presuppose the very arrow it's meant to be explaining. Does a theory of causation owe me a story about loops and mutually-determined variables, or is that a separate problem I should keep off the list?

  Flag which requirements are non-negotiable and which are just the house style of one camp, and where two of them look like they can't both be satisfied, say so — thats the bit I most want. Then, quickly, how the counterfactual programme and the interventionist programme each do against the list: no long scorecard, just where each is strong and where it's exposed.
reasoning: |-
  Okay, let me tackle this query from a science journalist about causation theories. The user wants a spec—not theories—listing what any serious theory of causation must handle. They mentioned classic cases like preemption and overdetermination, plus trickier ones like causation by omission and simultaneous causation. Also, key distinctions like cause vs. correlation, and constraints like degrees of causation and interventions.

  First, I need to map out the non-negotiables. The consensus stuff: handling actual causation in real cases (like preemption), distinguishing causes from correlations, allowing degrees of causation, and accommodating interventions. The thermostat loop is a key wrinkle—they’re worried about circular dependencies. Is that part of causation or separate? I think it’s non-negotiable because many systems (biology, ecology) have feedback loops. A theory must address loops without presupposing causation.

  Then, the contentious points. Causation by omission is divisive—some see it as essential (e.g., not watering a plant caused death), others as metaphorical. Double prevention (A stops B from stopping C) is similarly polarizing. Simultaneous causation challenges "cause precedes effect" assumptions. The cause vs. the cause distinction is practical but may not belong in the core theory.

  Conflicts are crucial. For example, handling omissions while avoiding triviality (if omissions count, everything causes everything by not preventing it). Also, loops challenge the interventionist approach—intervening seems to require an external agent, which breaks mutual dependence. The journalist will want these tensions highlighted.

  Now, evaluating counterfactual and interventionist approaches. Counterfactuals (Lewis) are intuitive but struggle with preemption and omissions. Interventionists (Pearl/Woodward) handle interventions well but presuppose arrows in loops. Both stumble on simultaneous causation. I should note where each excels and their exposures, keeping it concise.

  The user’s deeper needs: they’re writing a feature on philosophical disagreement. They need the spec to show why consensus is elusive—conflicting requirements create trade-offs. Highlighting the thermostat example illustrates how real-world complexity strains theories. They also want clarity on what’s mandatory vs. debatable, so journalists don’t present fringe views as mainstream.

  Finally, structure the response: non-negotiables, contentious points, conflicts, then quick eval of theories. Flag where requirements clash and why that fuels debate. Keep it punchy for a journalist’s use.
answer: |-
  Here’s the spec you need — the non-negotiable demands and contentious challenges any credible theory of causation must confront, distilled from philosophical trenches and scientific practice. I’ve flagged tensions and where theories risk breaking.

  ### Non-Negotiables (The Bare Minimum for Serious Consideration)
  1.  **Distinguish Cause from Mere Correlation:** Must rule out spurious connections (e.g., rooster crowing ≠ causing sunrise). Handle confounding variables.
  2.  **Handle Preemption:** When one potential cause acts first, blocking another (Billy shoots victim, Suzy’s identical shot arrives a millisecond later — Billy caused death, Suzy didn’t).
  3.  **Handle Overdetermination:** When multiple sufficient causes act simultaneously (two independent fatal shots hit victim simultaneously — both caused death).
  4.  **Accommodate Degrees of Causation:** Some causes are "stronger," "more direct," or "more responsible" than others (spark vs. oxygen in a fire). Theories needn’t quantify this precisely, but must explain the gradation in *meaning*.
  5.  **Be Compatible with Intervention:** Must explain why manipulating a cause (ideally) manipulates the effect, and why some systems resist clean intervention (e.g., entangled quantum states). (*This is where your thermostat bites hard*).
  6.  **Preserve Asymmetry (Usually):** Causes typically precede effects; effects don’t cause their causes (though simultaneous causation challenges this – see below).

  ### Contentious Challenges (Handle These Well to Stand Out, But Expect Debate)
  7.  **Causation by Omission:** Can absences be causes? (e.g., *Not* watering the plant caused its death; *Not* pressing the brake caused the crash). Theories risk exploding (everything is a cause by omission) or imploding (denying intuitive truths).
  8.  **Double Prevention:** A prevents B from preventing C, so A causes C. (e.g., Bodyguard disarms assassin (A), preventing the assassination attempt (B) that would have prevented the President signing the bill (C) — so A caused C?). Tests transitivity and omission handling.
  9.  **Simultaneous Causation:** Can cause and effect be simultaneous? (e.g., A heavy ball resting on a cushion causes its indentation *at the same time*; Newton’s 3rd law pairs). Challenges strict temporal priority.
  10. **Distinguish 'a Cause' from 'the Cause':** Must explain how we pragmatically single out salient factors (e.g., "The match caused the fire" ignores oxygen, dry wood) from the full set of necessary/sufficient conditions.
  11. **Causal Loops & Mutual Dependence:** **THIS IS YOUR WRINKLE.** Your thermostat is a canonical example. Any theory *owes a coherent story here* or must explicitly exclude such systems from its domain. Simply saying "intervention breaks the loop" often *presupposes* an external causal agent, begging the question. Non-negotiable for applicability to feedback systems (biology, climate, economics).

  ### Key Distinctions to Preserve (Non-Negotiables)
  12. **Cause vs. Explanation:** Causes are (putative) features of the world; explanations are context-dependent stories we tell *using* causal information (often highlighting 'the cause' or mechanisms).
  13. **Actual Causation vs. Causal Generality/Powers:** Distinguish *this* event causing *that* event (Billy's shot killing Victim) from general causal relationships/fragile dispositions (gunpowder *can* explode).

  ### Glaring Tensions & Conflicts
  *   **Omission vs. Non-Triviality:** Handling omissions intuitively (e.g., not watering kills plant) risks making causation ubiquitous and trivial (my *not* teleporting to Mars caused it to remain uncolonized?). Theories must impose non-arbitrary limits.
  *   **Intervention vs. Loops:** The core interventionist idea relies on breaking systems for testing. In tightly coupled loops (thermostat), *any* "intervention" might fundamentally alter the system dynamics or presuppose an external causal structure. Satisfying (5) and (11) simultaneously is **extremely hard**.
  *   **Simultaneity vs. Asymmetry:** If causes and effects can be simultaneous (9), what grounds the fundamental asymmetry (6)? Reliance on counterfactual or probabilistic asymmetry becomes crucial but vulnerable.
  *   **'The Cause' vs. Objectivity:** Pragmatic salience (10) seems subjective/contextual, but we want causation itself to be objective. Can a theory reconcile this?

  ### Quick Hit: Counterfactuals vs. Interventionism on the Spec

  *   **Counterfactual Approach (Lewis-style):**
      *   **Strong:** Intuitive core ("If C hadn't happened, E wouldn't have happened"), handles preemption well (with tweaks), good on asymmetry & distinguishing correlation (via similarity of possible worlds).
      *   **Exposed:** Struggles *mightily* with omissions (absences are everywhere in counterfactuals), double prevention, overdetermination (says neither shot caused death!), simultaneous causation, and loops (counterfactuals about loops get messy fast). Gradation is awkward.
  *   **Interventionist Approach (Woodward/Pearl):**
      *   **Strong:** Explicitly built for (5) - intervention & manipulation. Handles preemption, overdetermination, double prevention, and 'a cause'/'the cause' distinction well using variable manipulation. Excellent for science & modeling. Better framework for gradation (stability).
      *   **Exposed:** **Your Thermostat Problem:** Defining an intervention (*setting* a variable independently of its usual causes) **presupposes** a causal structure *external* to the system being intervened on. For isolated loops, this is circular. Struggles fundamentally with omissions (intervening on an absence?) and pure simultaneous dependence. Less intuitive for everyday singular causation.

  **Bottom Line for Your Feature:** Philosophers can't agree because the spec contains **deep tensions** (Omission/Triviality, Intervention/Loops). No theory smoothly satisfies *all* non-negotiables *and* handles the contentious cases without controversial moves. The thermostat loop isn't a separate problem – it's a litmus test exposing whether a theory can handle real-world complexity without smuggling in assumptions. Counterfactuals offer broad intuitive coverage but crack on omissions and loops. Interventionism is powerful for science but stumbles on omissions and *requires* an external causal perspective, making it potentially incomplete for fundamental metaphysics. The fight is over which compromises are acceptable.
