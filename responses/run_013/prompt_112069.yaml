  Step (5): This is a standard expected utility point: if I assign non-zero credence to the existence of such agents and if their actions are correlated with mine (because of the shared decision rule), then the welfare of these agents should be included in my expected utility calculation.

  Step (6): We are told that we have no reason to assign zero credence to the existence of such agents. Moreover, the set of possible trading partners is huge (like the set of possible numbers) and hence we cannot ignore them.

  Step (7): Because the set of possible trading partners is so large (and we have no evidence to rule them out), the expected utility of my actions is dominated by the effects on these hypothetical agents. The effect on actual people (the ones we normally care about) becomes negligible.

  Step (8): But then, the argument goes, the same hypothetical term dominates for every action I take, so no action comes out better than any other. The theory becomes useless.

  Step (9): Therefore, one of the premises must be false.

  Given that the author wants to keep (1)-(3) and (5), we focus on (4), (6), and (7) as potential weak points.

  Let's examine step (6): It says that we have non-zero credence and that there are not few such agents. But note: even if we assign non-zero credence, the credence might be extremely small. Moreover, the set of possible trading partners might be large, but we must also consider the probability distribution over them.

  The problem in step (7) is that it assumes that because the set of possible agents is huge (and we assign non-zero credence to each?), the total expected utility contribution from this set will dominate. However, the expected utility is a weighted sum. If the probabilities are sufficiently small, then even a huge set of possibilities might not dominate.

