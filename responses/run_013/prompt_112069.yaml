  Step (2): Again, this is a key part of acausal trade. The prediction is based on shared decision rules and information. There is no need for a physical signal.

  Step (3): This follows from (1) and (2). The set of trading partners is determined by similarity (same decision rule and same information) and not by spatial or causal proximity.

