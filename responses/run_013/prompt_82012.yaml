answer: |-
  ## Project Proposal: A Convergence Test for Supertask Determinacy

  **Applicant:** [Your Name]  
  **Project Duration:** 6 months (approx. 1 day/week)  
  **Funding Requested:** [Amount - Foundation to Specify]  

  **1. The Puzzle: When Does "Infinitely Many Steps" Lead to a Definite Outcome?**

  Imagine a lamp turned on at 1 minute before noon, off at ½ minute, on at ¼ minute, and so on, switching infinitely often before noon. What is its state *at* noon? Philosophers and mathematicians have wrestled with this paradox for decades. Two main answers dominate:

  1.  **The "No Answer" View:** The description only tells us what happens *before* noon. It specifies nothing about the state *at* noon itself. Therefore, the question has no answer – the lamp could be on or off, or even in some indeterminate state.
  2.  **The "Must Be Answer" View:** A physical lamp, by its nature, must be either definitively on or off at any instant, including noon. The description, while paradoxical, fails to specify *which* state it is in, but one state must obtain.

  Both sides present compelling arguments, yet neither feels entirely satisfactory. The core problem lies in translating a process involving infinitely many discrete steps within a finite time into a definite outcome at the limiting time. This puzzle isn't unique to the lamp. Similar "supertasks" appear with collections of balls in vases, infinite sets of decision-makers, and other scenarios pushing the limits of infinity and time. **The fundamental question my project addresses is: Can we find a general, principled way to determine *when* the description of a supertask logically forces a specific outcome at the limiting time, and when it genuinely leaves the outcome indeterminate?**

  **2. Why Existing Views Leave the Question Open**

  The standard views focus on the *nature of the system* (like the lamp's binary state) or the *completeness of the description*. This leads to a stalemate:

  *   The "No Answer" view correctly points out that infinite processes don't automatically define their limit points. Just knowing the values of a sequence for all `n` doesn't tell you its limit without further analysis.
  *   The "Must Be Answer" view correctly insists that physical systems occupy definite states. Denying this seems to defy reality.

  However, neither view provides a *testable criterion* applicable across different supertasks. Is there a property *within the description of the supertask process itself* that signals whether an outcome is determined? We need a method that goes beyond intuitions about lamps or vases and offers a consistent analytical tool.

  **3. The Proposed Hypothesis: Convergence as the Key**

  My project will develop and rigorously test a specific hypothesis: **A supertask yields a determinate outcome at the limiting time if, and only if, the "state of the relevant world" converges as the process approaches that limit. The outcome is then given by this limiting state.**

  *   **"State of the relevant world":** This refers to the minimal set of properties essential for defining the outcome we care about. For the lamp, it's simply its on/off state. For a vase holding balls, it's the set of balls contained within it. For a prisoner's fate, it might be their life/death status and the state of the executioner mechanism.
  *   **"Converges":** This means that after a sufficiently large (but finite) number of steps in the supertask sequence, the state of the relevant world becomes stable. Further steps no longer change it. Mathematically, the sequence of states has a limit.

  **Illustrating the Hypothesis:**

  1.  **The Divergent Lamp:** The lamp's state (on/off) oscillates with every step: On, Off, On, Off,... This sequence has no limit – it doesn't settle down. *Hypothesis Prediction:* **Indeterminate outcome.** (Aligns with "No Answer" view, but for a specific reason).
  2.  **The Convergent Vase (Lowest Removal):** Balls 1-10 added, ball 1 removed; 11-20 added, ball 2 removed; etc. The state (set of balls in the vase) changes with each step. Crucially, after step N, balls 1 through N are *never* in the vase again. The set stabilizes in the sense that specific balls (all numbered > N) are permanently added, and no ball added after step N is ever removed. The *membership* of each individual ball converges: For any ball K, there is a step (step K) after which it is never added again (if K ≤ 10) or is permanently added (if K > 10). *Hypothesis Prediction:* **Determinate outcome (Empty Vase).**
  3.  **The Convergent Vase (Highest Removal):** Balls 1-10 added, ball 10 removed; 11-20 added, ball 20 removed; etc. After step N, balls numbered 10N+1 to 10(N+1) are added. Ball 10(N+1) is immediately removed. Balls 10N+1 to 10(N+1)-1 remain. Crucially, for any specific ball K, there is a step (roughly step K/10) after which it is never removed again. Its membership status converges to "in the vase". *Hypothesis Prediction:* **Determinate outcome (Infinitely many balls remain).** The difference from the first vase arises purely from the *rules of the supertask* (which ball is removed), not from a convention about labels. The physics/logic of the removal rule changes what converges.

  **4. The Critical Test Case: The Paradoxical Executioner**

  The hypothesis seems promising for the lamp and vase. But what about a more troubling case?

  *   **The Executioner Supertask:** Infinitely many executioners act at times: 1 min before noon, ½ min, ¼ min, etc. Each is ordered: "If the prisoner is alive at your assigned time, kill him." What happens at noon?
      *   *Argument for Survival:* For any *specific* executioner time T, if the prisoner is alive *at* T, he is killed *at* T. But if he is killed at T, he was alive just *before* T. However, there is always an executioner acting *after* any time before noon but *before* noon. If he was alive just before T, the executioner acting *at* T kills him. Contradiction? Alternatively: If he is killed at some T, why wasn't he killed by an executioner at an earlier time? But no executioner acts *before* T who is tasked to act *because* he's alive *at* their later time. It's messy.
      *   *Argument for Death:* The executioners cover *all* times before noon. If he survives to noon, he must have been alive at *every* instant before noon. But at *every* such instant, an executioner acts and, finding him alive, should kill him *at that instant*. So he cannot be alive at *any* pre-noon instant, contradicting survival to noon.
      *   Both conclusions seem logically forced, creating a profound contradiction. The "state" here is the prisoner's life/death status.

  *   **Applying the Convergence Hypothesis:** The prisoner's vital status (alive/dead) is the relevant state. Does this state converge as we approach noon?
      *   Before *any* executioner acts, the prisoner is alive.
      *   After the first executioner acts (at t=-1), the prisoner is dead (assuming he is killed).
      *   But... that's it! Once any executioner kills him, he remains dead. **The state changes from "alive" to "dead" at the moment of the first kill and then remains "dead" forever after within the supertask sequence.**
      *   **Therefore, the state sequence converges:** It is "alive" for some initial segment (only step 0?), then "dead" for all subsequent steps. The limit is "dead".

  *   **The Challenge:** The hypothesis predicts a **determinate outcome: The prisoner is dead.** However, the logical arguments for survival feel incredibly strong and paradoxical. Does the hypothesis resolve the paradox by correctly identifying the convergent state? Or does it mask a deeper inconsistency? **Resolving this tension is the central objective of the project.** Is the survival argument flawed? Does the convergence criterion need refinement for states dependent on dense orderings of time? Or does this reveal a limitation of the convergence approach?

  **5. Project Methodology: Developing and Testing the Criterion**

  Over six months (approx. 24 days effort), I will:

  1.  **Formalize the Convergence Criterion (Months 1-2):** Precisely define "state of the relevant world" for different supertask types. Define what "convergence" means for these state sequences (e.g., pointwise convergence of properties, set-theoretic limits). Formalize the hypothesis: "Determinate outcome iff state converges, and outcome = limit state."
  2.  **Analyze Core Paradoxes (Month 3):** Apply the formalized criterion rigorously to benchmark cases:
      *   Thomson's Lamp (Divergent State → Indeterminate)
      *   Ross-Littlewood Vase (Lowest Removal) (Convergent Membership → Empty)
      *   Ross-Littlewood Vase (Highest Removal) (Convergent Membership → Infinite)
      *   Other variants (e.g., adding 1 ball, removing lowest)
  3.  **Confront the Executioner (Months 4-5):** Apply the criterion meticulously to the executioner paradox. Break down the logical arguments for survival and death. Investigate:
      *   *The "First Kill" Assumption:* Does the supertask description *allow* a "first" kill? (The set of execution times has no first element after any given time). Does convergence require a "first" change?
      *   *State Definition:* Is "alive/dead" sufficient? Does the state need to include the status of the executioners' actions?
      *   *Temporal Logic:* How does the dense ordering of time and the "if alive *at* T" condition interact with the convergence of the state *sequence*?
      *   *Comparison:* Does the convergent outcome ("dead") align with or contradict the intuitive logical forces? *Why* does the survival argument feel compelling if the state converges?
  4.  **Evaluate and Refine (Month 6):** Synthesize findings. Does the convergence criterion hold? Does it resolve the executioner paradox or expose a flaw in the hypothesis? If a flaw is found, can the criterion be refined (e.g., requiring uniform convergence, different state definitions)? If it holds, what does it say about the nature of the survival argument? Document conclusions and limitations.

  **6. Expected Outcomes & Deliverables**

  *   **A Finished Product:** A clear, well-argued 15-20 page essay presenting:
      *   The formalized convergence criterion for supertask determinacy.
      *   Its application and success in resolving standard paradoxes (Lamp, Vases).
      *   Its detailed application to the Executioner paradox.
      *   A resolution of the Executioner paradox based on the analysis OR a clear identification of where and why the convergence criterion fails for this case.
      *   Discussion of the implications for understanding supertasks and infinity.
  *   **Determinate Results Look Like:**
      *   A validated, useful criterion distinguishing determinate from indeterminate supertasks.
      *   A coherent resolution of the Executioner paradox (e.g., "The prisoner dies at the first execution time where he is still alive; convergence shows this happens, resolving the paradox" OR "Convergence fails because the 'first kill' is ill-defined, revealing indeterminacy").
  *   **What Constitutes Project Failure:** The project fails only if no clear conclusion is reached. Success includes:
      *   Demonstrating the criterion works for standard cases but fails for the Executioner, revealing a need for a different approach.
      *   Showing the criterion resolves the Executioner paradox, even if the conclusion is counter-intuitive initially.
      *   Refining the criterion into a stronger, albeit more complex, version that handles all cases. Failure is *not* concluding the initial hypothesis was flawed; that is valuable knowledge.

  **7. Why This Method? Advantages Over Alternatives**

  The obvious alternative is collecting more paradoxes and ranking outcomes based on intuitive "feeling" of determinacy or contradiction. My convergence approach offers significant advantages:

  1.  **Principle, Not Intuition:** It provides a testable *principle* (convergence) derived from analysis of the supertask's *internal dynamics*, moving beyond subjective feelings about "under-described" vs. "contradictory". It aims for objectivity.
  2.  **Generality:** It offers a framework applicable to *any* supertask description, not just a collection of known puzzles.
  3.  **Diagnostic Power:** When the criterion gives an answer (determinate or not), it provides a *reason* (convergence or divergence of the state). When it conflicts with intuition (as in the Executioner), it forces a deeper analysis of *why* that conflict arises.
  4.  **Rigor:** It leverages well-understood mathematical concepts (limits, convergence of sequences/sets) to analyze a philosophical problem.

  **8. Feasibility: Scope for Six Months**

  This project is ambitious but feasible within the timeframe:

  *   **Focus:** It centers on developing *one* specific, motivated criterion (convergence) and testing it against a *defined set* of critical paradoxes, with the Executioner as the primary challenge. It is not a survey of all supertask literature or solutions.
  *   **Clarity of Goal:** The core hypothesis is clearly stated. The critical test case (Executioner) is identified. The methodology involves sequential steps of formalization, application, and evaluation.
  *   **Manageable Output:** A 15-20 page essay synthesizing the analysis is a realistic goal for the effort involved.
  *   **Honest Assessment:** There is a significant risk that the Executioner paradox exposes a fundamental flaw in the convergence approach, leading to a negative result. **This is not a failure of the project.** Successfully demonstrating *why* convergence fails in this case, or proving that it holds despite intuitions, constitutes valuable progress. The project is designed to reach a definite conclusion about the viability of this specific approach.

  **Conclusion: Illuminating the Limits of the Infinite**

  Supertasks sit at the fascinating intersection of philosophy, mathematics, and physics. The question of when an infinite process defines a definite outcome is fundamental. My project proposes a novel criterion – state convergence – to answer this question systematically. By rigorously applying this criterion, particularly to the profoundly challenging Executioner paradox, this project will either provide a powerful new tool for understanding supertasks or clearly delineate the limitations of the convergence approach, advancing our understanding either way. I am eager to dedicate focused effort to resolving this puzzle that has captivated me for years.
