answer: |-
  ### Examination Question  
  **Answer ONE question in no more than 800 words.**  

  **1.** Apply the *Prospective Welfare Ledger* to the following scenario:  
  > A farmer must choose between two pest-control interventions in a single arable field.  
  > - **Option A** uses a broad-spectrum insecticide. It kills the target pest effectively but also kills large numbers of non-target invertebrates (including pollinators).  
  > - **Option B** introduces a parasitoid wasp species that targets *only* the pest. The wasp lays eggs inside the pest, causing its eventual death. However, adult wasps suffer high mortality from starvation/predation, and their sentience credence is scientifically unresolved. The pest population exhibits density-dependent rebound (i.e., suppressing it predictably triggers replacement via increased reproduction/survival of remaining pests).  
  >  
  > Using the Ledger’s rules—(1) *Weighting* (welfare change × sentience credence), (2) *Attribution* (only harms *caused* above baseline), and (3) *No Credit for Replacement* (suppressed lives not spared; new lives count as a cost)—evaluate which option scores better.  
  >  
  > In your analysis, **identify and explain** a specific circumstance where following rules (1) and (3) *requires* counting a welfare change that rule (2) would *exclude*. Argue whether this conflict exposes a defect in the Ledger or captures a defensible moral insight. Defend your verdict.  

  ---

  ### Model Answer (Approx. 600 words)  

  **Applying the Ledger to Options A and B**  
  The Ledger evaluates interventions by aggregating expected welfare changes for all affected individuals, weighted by sentience credence (*Weighting*). Only harms *caused* by the intervention (exceeding a no-intervention baseline) count (*Attribution*). *No Credit for Replacement* denies "saved life" credit for suppressed pests and treats new individuals arising from density-dependent rebound as a welfare *cost*.  

  For **Option A (insecticide)**:  
  - Direct harms: Deaths of pests, non-target invertebrates (e.g., pollinators), and suppressed pest replacements (Rule 3). All count as welfare losses.  
  - *Attribution*: Only deaths *caused* by spraying count. Natural baseline deaths (e.g., age, predation) are excluded.  
  - *Weighting*: High sentience credence for pollinators (e.g., bees) increases their welfare-loss weight.  

  For **Option B (parasitoid wasp)**:  
  - Direct harms:  
    - Pest deaths from parasitism: Count under Rule 2 (caused by intervention).  
    - Adult wasp deaths: High mortality occurs *without* intervention (baseline starvation/predation). Rule 2 excludes these.  
    - Replacement pests: Count as a cost (Rule 3).  
  - *Weighting*: Uncertainty around wasp sentience credence (*c*) complicates scoring. If *c* is low, wasp welfare losses matter little; if high, they dominate.  

  **Conflict Between Rules**  
  The critical conflict arises in **Option B** regarding **replacement pests**:  
  - Rule 2 (*Attribution*): Excludes harms that would occur regardless. In the *no-intervention* baseline, pests die naturally (e.g., disease). Only *additional* pest deaths from parasitism count as a cost.  
  - Rules 1 + 3 (*Weighting* + *No Credit*): Require counting the *welfare loss of new replacement pests*—individuals who would not exist but for suppression. Their suffering (e.g., starvation) is a cost.  
  **Thus, Rules 1 and 3 mandate counting welfare losses for replacement pests, while Rule 2 excludes identical losses for baseline pests.**  

  **Is This Conflict Defective or Insightful?**  
  This asymmetry exposes a **defect in the Ledger**, undermining its coherence.  
  - **Inconsistency in Harm Valuation**: Replacement pests experience identical suffering to baseline pests (e.g., starvation). Rule 2 correctly ignores baseline suffering as unpreventable. But Rule 3 counts replacement suffering *only* because the intervention altered population dynamics. This violates *Attribution*’s core principle: interventions should not be penalised for "harms" they do not *cause*. Replacement-pest suffering is caused by ecological pressures (e.g., resource scarcity), not parasitism itself.  
  - **Double-Counting Risk**: Rule 3 treats replacement pests as a *cost* of suppression. Yet if suppression reduces *total* pest numbers (despite rebound), aggregate suffering may decrease. Penalising interventions for preventing suffering that would occur in their absence (via Rule 3) is perverse.  

  **However, this conflict inadvertently captures a key moral insight**:  
  - **Preventing Future Suffering**: Rule 3’s cost attribution for replacement pests reflects that interventions triggering rebound *create* new sentient lives doomed to suffering. This aligns with anti-natalist intuitions: creating life that suffers is bad, even if unintended.  

  **Verdict**: The conflict reveals a **fundamental flaw** in the Ledger. Rule 3 overrides Rule 2’s causation requirement, imposing costs for outcomes beyond the intervention’s agency. While the insight about preventing avoidable births is valid, Rule 3 applies it incoherently by ignoring baseline comparators. A defensible ledger would either:  
  (i) Broaden Rule 2 to include *all* foreseeable welfare changes (including replacement), abandoning causation; or  
  (ii) Apply Rule 3 *only* if replacement suffering exceeds baseline levels.  
  As stipulated, however, the Ledger’s asymmetric treatment of identical harms is unjustifiable.  

  **Recommendation**: Option A likely scores better. Option B’s parasitism-caused harms + replacement costs + uncertain wasp sentience outweigh Option A’s non-target harms *if* pollinator sentience credence is high. But the Ledger’s defects preclude decisive scoring.  

  ---  

  ### Marking Scheme (Total: 20 marks)  
  **Essential Moves for an A (17–20)**  
  - **✓ Correctly applies all 3 rules to both options** (e.g., Option B’s wasp deaths excluded by Rule 2; replacement pests cost under Rule 3).  
  - **✓ Identifies the core conflict**: Rules 1+3 require counting replacement-pest suffering, but Rule 2 excludes identical baseline-pest suffering.  
  - **✓ Diagnoses defect/insight** with precision (e.g., inconsistency in harm attribution; anti-natalist insight).  
  - **✓ Justifies verdict** using Ledger’s internal logic (e.g., “asymmetric treatment violates causation principle”).  
  - **✓ Discusses sentience uncertainty** (e.g., how *c*<sub>wasp</sub> affects Option B’s score).  

  **Distinguishes A from B (13–16)**  
  - B answers may *describe* the conflict but lack depth in evaluating its implications (e.g., “it’s inconsistent” without explaining *why*).  
  - A answers *synthesise* the conflict’s systemic implications (e.g., “Rule 3 undermines Rule 2’s moral purpose”).  

  **Characteristic Errors (Marks deducted)**  
  - **Misapplies Rule 2**: e.g., Claims baseline wasp deaths count in Option B (–3).  
  - **Ignores Rule 3**: Fails to treat replacement pests as a cost (–4).  
  - **Assumes sentience credences**: e.g., Asserts wasps are non-sentient without engaging uncertainty (–2).  
  - **Unsubstantiated verdict**: e.g., “Conflict shows the Ledger is broken” without argument (–3).  
  - **Rule conflation**: Merges distinct rules (e.g., “Weighting overrides Attribution”) without justification (–2).  

  **Grade Boundaries**: A (17–20), B (13–16), C (9–12), D (5–8), E (1–4).  

  ---  
  **British English Note**: Spelling/phrasing adjusted throughout (e.g., "prioritise", "credence", "defence", "penalised").
