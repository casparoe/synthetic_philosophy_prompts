  For the model answer, I need to demonstrate how this conflict plays out. First, establish that parasitoid larvae consume hosts (direct harm under rule 2), but adult wasp deaths are natural baseline (not counted). Then show how rule 3 makes replacement hosts a cost, while rule 1 forces us to weigh uncertain wasp sentience. The conflict arises when replacement hosts count as a cost (via rules 1+3) but identical baseline deaths don't (rule 2). 

  The marking scheme should reward recognizing this asymmetry as either a defect (inconsistent treatment) or insight (preventing future suffering). Top marks for engaging the sentience uncertainty's impact on the weighting - that's the A/B differentiator. Common errors would include misapplying rule 2 to natural wasp mortality or forgetting rule 3's replacement cost.

