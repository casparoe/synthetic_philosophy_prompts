prompt: |-
  I am on the advisory board of a small liberal arts college that is revising its core curriculum. The board has spent two years classifying practices and ideals as either expressions of “Western values” or not, and its track record is now long enough to constrain what it can consistently do next. Its decisions so far are these. It counted trial by jury as a Western value, even though the institution is medieval in origin and is not used in every Western country. It counted the separation of church and state as a Western value, even though several Western states have established churches and the doctrine is contested within the West. It counted human rights as a Western value, even though the phrase and the international instruments are twentieth-century and many of the rights are now affirmed globally. It counted democracy as a Western value, though it originated in a small Greek city-state and has taken illiberal forms in the West. It counted capitalism as a Western value, though it is now practiced worldwide. It did not count Confucian filial piety as a Western value, though several Western philosophers admired it and some Western families practice something like it. It did not count socialism as a Western value, though its major theorists were European and it has deep roots in Western labor movements. It did not count vegetarianism as a Western value, though Pythagoreans and some Christian ascetics practiced it. It did not count slavery as a Western value, though Western societies practiced it for centuries. It did not count absolute monarchy as a Western value, though it was the dominant form of government in Europe for a long period. It counted gender equality as a Western value, though it is a recent achievement and remains incomplete.

  Next month the board must classify a proposed addition to the core: a module on “algorithmic due process,” understood as a set of procedural rights that people should have when automated systems make consequential decisions about them — notice, explanation, contestation, and human review. Some board members say this is just a particular application of the rule of law and therefore already covered. Others say it is a distinctively twenty-first-century, transnational technocratic norm with no clear home in the Western tradition. The board wants to be consistent with its own precedents, but its precedents do not wear their principle on their sleeve.

  If you were advising the board, what should it decide, and why? Identify the closest earlier precedent and say what work it does. Then set out the competing rules that fit the board’s existing verdicts equally well — for example, a genealogical rule, a functional rule, a normative-ideal rule, or a distinctiveness rule — and say what each would predict about algorithmic due process. Give your best guess about which rule the board is actually running, and name one further case that would best tell those rules apart. Finally, if the board’s precedents genuinely underdetermine the new case, say what principle it would be adopting if it voted yes and what principle it would be adopting if it voted no.
reasoning: |-
  Okay, let me tackle this complex curriculum question. The user presents a fascinating puzzle about classifying "algorithmic due process" within a Western values framework, based on a pattern of inconsistent precedents. 

  First, I notice the board's decisions reveal deep tensions in how they define "Western values." Their approach seems to cherry-pick modern ideals while ignoring historical complexities - calling democracy Western despite its Athenian origins and illiberal Western variants, but rejecting socialism despite its European roots. This selective treatment suggests they're not applying a consistent historical or genealogical standard.

  The user wants me to reverse-engineer the board's hidden logic. Looking at their yes/no pattern, I spot two competing principles: 
  - A "Normative Distinctiveness" rule (counting values perceived as uniquely Western achievements, even if recent or contested)
  - A "Genealogical Origin" rule (tracing ideas to Western sources regardless of current adoption)

  For algorithmic due process, the closest precedent seems to be human rights - a 20th century development recognized as Western despite global adoption. Following that logic, the board might approve it as a modern extension of due process. But if they applied the origin rule strictly (like with socialism), they'd reject it since algorithmic systems aren't uniquely Western.

  The board's actual behavior leans toward normative distinctiveness. They consistently claim progressive values (gender equality, human rights) as Western while disowning problematic history (slavery, monarchy). This performative selectivity suggests they're constructing an idealized Western identity rather than documenting history.

  To test this, I'd propose a hypothetical about universal healthcare. Under normative distinctiveness, they'd likely reject it (associated with non-Western systems), but under genealogical origin, they'd have to accept it (Bismarck's Germany). 

  Ultimately, the vote reveals their priorities: approving algorithmic due process would cement their view of Western values as evolving ideals; rejecting it would suggest stricter historicism. Given their pattern, I'd bet on approval - not because it's consistent, but because it continues their trend of claiming contemporary moral high ground as inherently Western.
answer: |-
  Based on your board's precedent pattern, **I advise voting YES to classify "algorithmic due process" as a Western value**. The closest precedent is **Human Rights**. Here's the full analysis:

  ### 1. **Closest Precedent: Human Rights**  
     - **Why it fits**: Like algorithmic due process, human rights are:  
       - A *modern development* (20th-century instruments)  
       - *Universally aspirational* yet claimed as Western  
       - *Contested within the West* (e.g., US vs. Europe on socio-economic rights)  
       - Grounded in *procedural ideals* (due process, rule of law)  
     - **Work it does**: It shows the board prioritizes *normative ideals* over historical purity or exclusivity. The fact that human rights are recent and global didn't disqualify them—algorithmic due process shouldn’t be disqualified for similar reasons.

  ### 2. **Competing Rules Fitting the Precedents**  
  Your board’s decisions fit two conflicting patterns equally well:  

  | **Rule Type**         | **Predicts for Algorithmic Due Process** | **Board's Pattern**                                                                 |
  |------------------------|------------------------------------------|-------------------------------------------------------------------------------------|
  | **Normative Distinctiveness** | **YES** (Extension of rule of law)       | Counts democracy (despite illiberal forms), human rights (despite global adoption). Excludes socialism (despite Western origin) because it conflicts with liberal individualism. |
  | **Genealogical Origin**       | **NO** (21st-century/transnational tech) | Counts trial by jury (medieval origin), excludes vegetarianism (non-Western roots). Ignores socialism’s European theorists because it’s now global. |

  ### 3. **Best Guess: The Board is Running "Normative Distinctiveness"**  
     - **Evidence**:  
       - **Inclusions**: Values like gender equality (recent/incomplete) and human rights (20th-century) are counted because they align with a *progressive Western self-conception*.  
       - **Exclusions**: Socialism (though Western-origin) is excluded as "non-Western" because it challenges liberal capitalism—a core *normative* pillar. Slavery/monarchy are excluded as *negative* history, not aspirational ideals.  
     - **Why Normative Distinctiveness?** The board consistently claims *positive, liberal-democratic ideals* as "Western," regardless of origin or global adoption, while disowning illiberal practices or rival frameworks (Confucianism, socialism).

  ### 4. **Test Case to Distinguish the Rules: Universal Healthcare**  
     - **Normative Distinctiveness**: Would likely say **NO** (associated with socialism/non-Western systems like Cuba).  
     - **Genealogical Origin**: Would say **YES** (pioneered by Bismarck in Germany, expanded in UK/Europe).  
     *Your board’s probable verdict: NO*—because it conflicts with capitalist individualism, despite Western origins.

  ### 5. **If Precedents Underdetermine the Case**  
     - **Voting YES** adopts:  
       *"Western values include contemporary ethical extensions of core liberal principles, even if technologically novel or globally adopted."*  
       (This extends the human rights/logic: algorithmic due process as 21st-century procedural justice.)  
     - **Voting NO** adopts:  
       *"Western values require pre-20th-century cultural lineage and must not be primarily driven by transnational technocracy."*  
       (This would align with excluding socialism/vegetarianism for being "global" or "non-native.")  

  ### Final Recommendation  
  Vote **YES** to stay consistent with the **human rights precedent** and the board’s implicit **Normative Distinctiveness rule**. Algorithmic due process:  
  - Is framed as a *procedural right* (like jury trials/due process)  
  - Extends *rule of law* to digital governance (a "Western" ideal)  
  - Fits the pattern of claiming *aspirational, liberal innovations* (gender equality, human rights) as Western.  

  Rejecting it would undermine the board’s prior flexibility with modernity while accepting it reinforces the construct of the West as a beacon of evolving liberal ideals—flawed but consistent with your track record.  

  **Key Insight**: Your board isn’t cataloging history; it’s curating an *idealized Western identity*. Algorithmic due process fits this narrative as the "digital rule of law."
