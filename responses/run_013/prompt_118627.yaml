  I should emphasize how common knowledge of rationality (CKR) behaves differently here. In the standard model, CKR nukes trust because strategies can't adapt. But programs that recognize clones sustain trust *while satisfying CKR*. The paradox dissolves because the model artificially cripples players' ability to signal intentions. 

  ...Wait, must avoid getting lost in abstraction. User wants "tight" arguments. Key moves: 
  - Contrast fixed strategies vs. algorithmic conditioning 
  - Show cooperative outcome meets Nash equilibrium criteria 
  - Stress that CKR + flexible modeling permits cooperation whereas rigid modeling doesn't 

