  The user's deeper unease resonates with me - they're sensing Dennett might be conflating two separate issues: phenomenological consciousness versus moral agency. That's crucial. When they ask "is he saying the thing only seems conscious, or that it only seems responsible?" - that's the fork in the road. 

  I should clarify that Dennett's primary concern is social coordination, not qualia. His "intentional stance" is about treating entities as rational agents for predictive purposes, regardless of inner states. So the counterfeit danger isn't philosophical zombies, but systems that parasitize human trust without accountability. 

  For the test design, I'll steer away from consciousness detectors (impossible) toward responsibility verification. But must emphasize this isn't foolproof - it's about raising the cost of deception, not achieving perfection. The arms race point is well-taken; we'd need regulatory teeth behind any verification system.

