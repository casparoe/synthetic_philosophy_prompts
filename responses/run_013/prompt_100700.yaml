answer: |-
  Let us dissect this without illusion. Your uncle speaks with the voice of La Rochefoucauld: "We are all strong enough to bear the misfortunes of others." His cynicism has a brutal elegance—power *does* often dress itself as justice, and appeals to abstract fairness *can* be naïveté or bad faith. Yet this is incomplete. Your sister’s claim rests on two pillars: invented tradition ("eldest takes more") and raw possession ("I have the keys"). Neither withstands scrutiny.

  **The Lay of the Land:**
  1.  **Your Sister's Gambit:** "Family custom" is almost certainly ex post facto justification. If this tradition existed, why was it never discussed? Why no documentation? It’s a narrative woven to cloak power in legitimacy. Her "because I can" reveals the engine: control of assets and legal machinery. This is Thrasymachus in Plato’s *Republic*: "Justice is the advantage of the stronger."
  2.  **Your Uncle’s Realpolitik:** He sees the world as a contest of wills. Law, custom, morality—these are masks. The victor defines virtue. Montaigne might nod grimly: "Laws are maintained in credit not because they are just, but because they are laws." Your uncle focuses on the *is*, dismissing the *ought* as fantasy.
  3.  **Your Instinct:** You feel a 50/50 split is "fair," but struggle to ground it in an immutable law. This is Pascal’s wager without the certainty: you sense an injustice but lack the cosmic rulebook. Your discomfort stems from recognizing both the fragility of abstract justice *and* the ugliness of naked power.

  **The Cracks in the Armor:**
  *   **The Executor’s Duty:** This is the critical pivot. An executor is **not** a sovereign. They are a **fiduciary**, a trustee. Their role is to administer the estate *impartially* according to the will *or* intestacy law (if no valid will). They cannot arbitrarily rewrite distributions for personal gain. Self-dealing is a breach of duty, not custom. Her "70/30 because I can" is legally precarious, regardless of family lore.
  *   **The "Custom" Dodge:** Even if a genuine tradition existed (doubtful), it holds no weight against the legal structure of executorship or the terms of the will/deed. Customs bind only when voluntarily accepted; they cannot override fiduciary law or property rights established by probate. Her appeal to tradition is theater.
  *   **Justice Without a Sky-Hook:** You need no divine decree. Justice here is **procedural** and **relational**:
      *   *Procedural:* Did she follow the law and the will's intent? Did she act as a neutral trustee? No. Her actions suggest breach.
      *   *Relational:* Did she treat you, a co-beneficiary and sibling, with the good faith owed? Did she negotiate openly or dictate terms? Her conduct reveals coercion, not cooperation. Justice, even undefined, recoils at betrayal of trust for profit.

  **The Difference That Doesn't Dissolve:**
  Your uncle is half-right: Power often wins. **But the difference between "she wins because she's strong" and "she wins because it's just" is not dissolved by your inability to name the perfect just outcome.** It persists because:

  1.  **Her justification is fraudulent.** "Custom" is likely invented, and "because I can" is an admission of bad faith. This isn't a sincere appeal to *any* principle, however flawed; it's a weaponization of power disguised as principle. La Bruyère observed: "The pleasure of slandering oneself is inferior only to that of slandering others." Here, she slanders the very concept of fairness by draping greed in its robes.
  2.  **The law provides a framework, however imperfect.** You don't need cosmic justice; you have earthly probate law. Executors *do* have enforceable duties. While legal outcomes aren't perfectly just, the system *does* recognize the distinction between rightful administration and theft-by-position.
  3.  **Your silence is complicity, not wisdom.** Acquiescing because "fair is whatever the powerful say" reinforces her narrative and your uncle's cynicism. It tells her this tactic works. Resistance, even imperfect, asserts that power alone is insufficient justification.

  **Verdict & Action (Medium Confidence):**

  **What to Do:** **Consult an estate litigation attorney immediately. Do not confront your sister further until you do.**

  1.  **Why:** Your sister likely breached her fiduciary duty. The attorney will:
      *   Review the will, probate filings, and deed transfer.
      *   Determine if the executor appointment/deed transfer was proper.
      *   Assess the viability of challenging the distribution based on self-dealing and breach of trust.
      *   Outline options: demand letters, mediation, litigation. The threat of court scrutiny often forces renegotiation.
  2.  **The Goal:** Not necessarily a Pyrrhic war, but **leverage**. Knowledge of your legal position empowers negotiation. Aim for 50/50, but know your bottom line. A settlement near 50% is likely the optimal practical outcome.
  3.  **Costs:** Be clear-eyed. Litigation is expensive and destructive. An attorney will tell you the cost/benefit. Your 30% might be eroded by fees. Weigh the financial loss against the moral cost of capitulation and the precedent it sets.

  **Confidence & Pushback:**
  *   **Confidence (Medium):** Legally, executors *cannot* arbitrarily enrich themselves. Your case has merit. Practically, outcomes depend on evidence, jurisdiction, legal costs, and the sister's willingness to fight. The *moral* case for resistance is strong; the *pragmatic* path is thorny.
  *   **Reasonable Pushbacks:**
      *   *"The legal cost might exceed the gain."* True. This is the uncle's pragmatism biting. Solution: Get the facts from a lawyer first. Know the numbers. Mediation is cheaper.
      *   *"You'll destroy the family."* It's already broken by her actions. Appeasement rewards the breaker. As Chamfort noted: "Swallowing a toad every morning is a recipe for a life without fear of anything worse." Is that the peace you want?
      *   *"You can't prove her 'custom' is fake."* Irrelevant. Fiduciary duty trumps unverified family lore. The burden is on *her* to justify the deviation from the estate's presumed intent (equal split) or the law.
      *   *"What if you lose?"* You will have asserted the principle that power requires justification beyond itself. That has value, even in defeat. Resisting Thrasymachus is never futile.

  **The Uncomfortable Truth:** Your uncle sees the world as it often *is*. You sense how it *should* be, even if you can't perfectly define it. The gap between is and ought is where morality lives. Your sister exploits that gap using fraud and force. Acting now is not about enforcing cosmic justice; it’s about rejecting a lie and confronting abuse of power within the flawed but real systems available. The just outcome you seek isn't written in the stars—it's found in refusing to let "because I can" be the final word. Consult the lawyer. See what weapons the earthly city provides. Then decide your battle.
