prompt: |-
  I could use some help with something personal, and I'd rather get a real answer then a polite one.

  My mom died last year and left the house to me and my sister. Long story short, the paperwork ended up with my sister as sole executor and the deed in her name, and she's now decided she keeps 70% of the sale and I get 30%. When I ask why, she says two things: that's how it's always been done in our family (eldest handles the estate, takes the bigger cut), and, more bluntly, because she can — she has the lawyer, she has the keys, she has the bank account. My uncle tells me to drop it, that "fair" is just whatever the person with the power says it is, and that anybody who talks about justice is either naive or pretending. I want to argue with him, but I keep getting stuck, because honestly I can't point to any rule that says 50/50 is the right split. There's no natural law of inheritance hanging in the sky, and her "family custom," even if she's half making it up, is at least a rule of some kind. So is my uncle basically right? Is there actually a difference between her getting her way because she's stronger and her getting her way because it's just — or does the difference dissolve once I admit I can't name the just outcome? And what should I actually do here?

  A few things I want from you:

  - Start by spending a few lines laying out the different ways this could be seen, so I can tell you're not just pattern-matching to the first famous argument that comes up.
  - Please don't hand me the canned "might doesn't make right, stand up for yourself" answer. I've heard it. I want the version that takes seriously that I can't name the just outcome and still tells me something anyway.
  - If my framing is confused, or if the honest answer is that I'm asking the question in the wrong shape, say so straight out instead of humoring me. I'd rather be told I'm asking it wrong than get a nice answer to the wrong question.
  - Give me an actual verdict — what to do — and tell me how confident you are, and where you'd expect a reasonable person to push back on you.

  Write it like someone who's spent years in early-modern moral philosophy, the French moralists and the uncomfortable bits, not the textbook summary — someone willing to tell a stranger something true rather than something comforting. And please, no reading list; I'm not going to go read a treatise about this, I just want you to think it through carefuly and talk to me.
