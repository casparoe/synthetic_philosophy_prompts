answer: |-
  Here is a rigorous analysis of desiderata for intergenerational weighting theories, distinguishing non-negotiable requirements from contingent assumptions, with identified tensions:

  ### Core Non-Negotiable Desiderata
  1. **Moral Symmetry of Persons**  
     *Requirement:* Identical persons (same properties, circumstances) must receive equal moral consideration regardless of temporal location.  
     *Why Non-Negotiable:* Rejecting this permits arbitrary temporal discrimination without justification.  
     *Excludes:* Positive pure time preference (PTP > 0) absent further justification.

  2. **Non-Identity Problem Constraint**  
     *Requirement:* Theories must acknowledge that policies altering future populations create different individuals, complicating "harm" assessments.  
     *Why Non-Negotiable:* A logical feature of causality in population ethics; ignoring it leads to false counterfactuals.  
     *Excludes:* Simple utilitarianism assuming fixed populations.

  3. **Epistemic Humility (Causal Opacity)**  
     *Requirement:* Theories must account for radical uncertainty in long-term causal chains.  
     *Why Non-Negotiable:* An empirical constraint on prediction; ignoring it invites false precision.  
     *Excludes:* Models requiring precise probability distributions over centuries.

  4. **Non-Substitutability of Critical Goods**  
     *Requirement:* Certain goods (e.g., stable climate, ecosystem viability) cannot be compensated for by increased consumption.  
     *Why Non-Negotiable:* These goods are preconditions for welfare; substitution assumes fungibility where none exists.  
     *Excludes:* Cost-benefit analyses treating all goods as monetizable/commensurable.

  ### Contingent or Framework-Dependent "Requirements"
  1. **Zero Pure Time Preference (PTP=0)**  
     *Status:* A *consequence* of moral symmetry + no defeater, not a freestanding axiom. Some camps (e.g., Ramsey) accept PTP>0 pragmatically.  
     *Parochial If:* Treated as sacrosanct without justifying moral symmetry first.

  2. **Distinction Between Uncertainty & Pure Discounting**  
     *Status:* Logically necessary for conceptual clarity, but operationalizing it depends on epistemic framework.  
     *Parochial Trap:* Utilitarians often conflate them in discount rate formulas.

  3. **Future Value Divergence**  
     *Status:* Important empirical consideration, but its weight depends on metaethical stance (objective vs. preference-satisfaction goods).  
     *Parochial If:* Used to dismiss future interests entirely rather than modulate interventions.

  4. **Temporal Directionality (One-Way Influence)**  
     *Status:* Descriptive fact, not normative requirement. Only relevant for feasibility, not moral weight.

  ### The Most Exclusionary Requirement
  **Non-Substitutability** does the most work in excluding standard candidates:
  - **Excludes PTP>0 & Goods-Discounting:** If critical goods (e.g., civilization collapse prevention) are irreplaceable, discounting their future loss is indefensible.
  - **Excludes PTP=0 Utilitarianism:** Even with zero discounting, substituting lost critical goods with increased future consumption fails.
  - **Excludes Welfare-Discounting Models:** If welfare depends on non-substitutable goods, separating goods from welfare discounting collapses.

  ### Critical Tensions Between Desiderata
  **1. Moral Symmetry vs. Non-Substitutability + Non-Identity**  
     - Symmetry demands equal weight for future lives.  
     - Non-substitutability requires preserving critical goods *for specific beneficiaries*.  
     - Non-identity implies beneficiaries of preservation are different people.  
     **→ Tension:** Do we preserve goods for abstract future people (who don’t yet exist) at high cost to concrete present people? Symmetry alone doesn’t resolve this.

  **2. Epistemic Humility vs. Actionability**  
     - Radical uncertainty undermines precise intergenerational calculus.  
     - But policy requires *some* actionable framework.  
     **→ Tension:** Precautionary principles may conflict with symmetry if they prioritize avoiding catastrophe over marginal gains.

  **3. Non-Substitutability vs. Value Divergence**  
     - We must preserve non-substitutable goods (e.g., biodiversity).  
     - Future people might value these differently (e.g., prefer AI-mediated existence).  
     **→ Tension:** Imposing our valuation risks paternalism; not preserving risks irreversible loss.

  ### Conclusion: Inherent Inconsistency?
  The core tension is **unresolvable within standard frameworks**:
  - Moral symmetry + non-substitutability demands we sacrifice present welfare to preserve critical goods for future people.
  - Non-identity + value divergence implies we cannot know *which* future people or values will exist.
  - Causal opacity prevents confident large-scale tradeoffs.

  **Result:** No theory satisfying all desiderata can generate precise discount rates. The seminar should conclude that intergenerational ethics requires:
  - **Procedural** approaches (e.g., reflexive institutions)
  - **Threshold** rules (e.g., "safe minimum standards" for critical goods)
  - **Robustness** over optimization

  This exposes the illusion that a single "correct" discount rate can reconcile all demands. The tension isn’t eliminable—it’s foundational.

  > "We are trying to balance the needs of people who do not exist in ways we cannot predict with goods we cannot replace through sacrifices we cannot quantify. Precision here is not just unattainable; it is conceptually incoherent."
