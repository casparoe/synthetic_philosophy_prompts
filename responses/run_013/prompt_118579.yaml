  I'm thinking about creating a setting called "The Institute for Quantified Wellbeing." This would be a place where pleasure is measured through neural scans and physiological data, then aggregated into a "Daily Aggregate Pleasure Index" (DAPI) that determines resource allocation. The story will follow Dr. Aris Thorne, a scientist who believes in this system but starts questioning it.

