  The title "The Calculus of Unlikeness" captures both the mathematical approach and the fundamental dissimilarity between pleasures. I'll write in third-person limited perspective focused on Aris, showing his growing doubts through concrete experiences rather than abstract dialogue. Sensory details will make the different pleasures vivid - the physical relief of an itch, the intellectual satisfaction of a puzzle, the emotional warmth of companionship.

