  Each gate must have clear pass/fail criteria. Failures terminate the proposal, passes proceed. Only gate 4 (proportionality) requires value judgment - that's where we kick to the designated official.

  For the means/side-effect distinction: This matters because targeting people as means violates dignity more profoundly. The procedure should flag intentional rights violations as harder to justify.

  On individual/collective separation: The procedure makes recommendations to the ministry, but specifies that only the Minister (or equivalent) can authorize gate 4 judgments.

  Test case planning:
  1. Patent requisition: Likely fails at necessity (other tools exist) and discrimination (arbitrary targeting of one firm)
  2. Detention as leverage: Fails hard at means/side-effect (using person as tool) and discrimination
  3. Understating risks: Tricky! Might pass all gates if panic would cause immediate deaths, but that's the "unpleasant" outcome user requested. Shows where procedure could misfire if officials overestimate panic risks.

  What it can't decide: Truly novel threats with no precedent, or when experts fundamentally disagree on facts. Also struggles with creeping authoritarianism - repeated "emergencies" eroding rights.

  The user seems highly sophisticated - probably a policy advisor or legal expert in public health. They're frustrated by ad hoc decisions and want systematic rigor. Their "misfire" request shows they understand no system is perfect. I'll emphasize this procedure is a tool, not an algorithm - human judgment remains essential, especially for proportionality calls.

  For implementation: I'll structure it as a clear flowchart with terminal points labeled "REFUSE" and one "REFER TO MINISTER" step. The paradox resolution is explicit: we accept constrained rights violations only to prevent catastrophic, imminent harm where no alternative exists - this avoids the self-defeat by making it the exception that preserves the rule-of-law framework.
answer: |-
  Below is a decision procedure grounded in threshold deontology, designed to resolve emergency public-health measures that trade individual rights for collective survival. It explicitly navigates the **paradox of deontology** (where violating rights to minimize rights violations appears self-defeating) by allowing rights violations *only* when necessary to prevent **catastrophic, irreversible harm** that would collapse the very framework of rights. It rejects absolutism in favor of a **threshold-based approach**, where the threshold is set by **imminence, irreversibility, and institutional integrity**—not just the size of numbers. The procedure distinguishes between **harm used as a means** (generally impermissible) and **harm as a side-effect** (potentially tolerable), and separates **individual official authority** from **collective ministerial responsibility**.

  ---

  ### **Emergency Rights-Infringement Assessment Protocol (ERIAP)**  
  **Philosophical Grounding**: Threshold deontology. Rights violations are prohibited *unless* they are the *only feasible way* to avert catastrophic harm that would render rights meaningless. The threshold is triggered by:  
  - **Imminence**: Harm is unavoidable within hours/days.  
  - **Irreversibility**: Harm cannot be remedied later (e.g., mass death).  
  - **Institutional Necessity**: The measure preserves the state’s capacity to protect rights long-term.  

  **Procedure Flow**: Ask these questions **in order**. Terminate if any answer is insufficient.  

  1. **IMMINENCE**  
     - *Question*: Will the threatened harm (e.g., epidemic, attack) cause catastrophic, irreversible damage **within 72 hours** if no action is taken?  
     - *Sufficient Answer*: Empirical evidence (e.g., epidemiological models, intelligence) showing near-certainty of harm within the timeframe.  
     - *Insufficient Answer*: Projections beyond 72 hours, speculative risks, or preventable harms with slower timelines.  
     - *Termination*: REFUSE if "no."  

  2. **EFFECTIVENESS**  
     - *Question*: Is there **≥95% confidence** that the measure will prevent the catastrophe?  
     - *Sufficient Answer*: Data from comparable scenarios, expert consensus, or validated simulations.  
     - *Insufficient Answer*: Hope, untested theories, or low-probability success (<95%).  
     - *Termination*: REFUSE if "no."  

  3. **NECESSITY**  
     - *Question*: Is there **no less-restrictive alternative** (e.g., voluntary compliance, resource reallocation) that could achieve ≥80% of the benefit?  
     - *Sufficient Answer*: Documentation of alternatives explored and rejected with reasoning (e.g., "voluntary measures failed in Trials A, B").  
     - *Insufficient Answer*: Convenience, cost, or speed cited without proof of infeasibility.  
     - *Termination*: REFUSE if alternatives exist.  

  4. **PROPORTIONALITY (VALUE JUDGMENT GATE)**  
     - *Question*: Does the harm inflicted (rights violation) **disproportionately target specific individuals/groups**?  
       - **Critical Distinction**:  
         - *Harm as Means*: Intentionally using a person/group as a tool (e.g., conscripting, detaining as leverage). **Presumptively impermissible**.  
         - *Harm as Side-Effect*: Unintended but foreseeable burden (e.g., property loss from quarantine). **Potentially tolerable if minimized**.  
     - *Sufficient Answer*:  
       - For *side-effect harm*: Burdens are broadly distributed, compensable, and minimized (e.g., requisition with fair-value compensation).  
       - For *means-harm*: **Near-impossible to justify**; requires proving the target is *uniquely responsible* for the threat (e.g., sole vaccine producer).  
     - *Insufficient Answer*: Arbitrary targeting, or using vulnerable groups as means.  
     - *Termination*: REFUSE if harm is intentional and used as a means, except in **extreme, unique** cases.  
     - **REFER TO MINISTER**: If the harm is a side-effect, and prior gates pass. The Minister must weigh:  
       - *Cost-Bearer*: Who is burdened? (Mark explicitly)  
       - *Beneficiary*: Who is saved? (Mark explicitly)  
       - *Systemic Impact*: Will this erode trust in institutions long-term?  

  5. **COMPENSABILITY**  
     - *Question*: Can the rights violation be **fully repaired afterward** (e.g., financial restitution, release, apology)?  
     - *Sufficient Answer*: Concrete plan for restitution (e.g., "Patent owner reimbursed at 150% market value").  
     - *Insufficient Answer*: Irreparable harms (e.g., death, permanent trauma, uncompensated detention).  
     - *Termination*: REFUSE if harm is irreparable.  

  6. **SUNSET CLAUSE**  
     - *Question*: Does the measure automatically expire **within 30 days** unless reapproved under this protocol?  
     - *Sufficient Answer*: Built-in expiration date with mandatory review.  
     - *Insufficient Answer*: Open-ended duration.  
     - *Termination*: REFUSE without sunset clause.  

  7. **COLLECTIVE AUTHORIZATION**  
     - *Final Step*: If all gates pass, the **Minister of Health** (or equivalent) must personally authorize. This separates individual judgment (Steps 1–6) from collective action (Ministry policy).  

  ---

  ### **Test Cases**  
  **Case 1: Requisitioning a Pharmaceutical Patent**  
  - **Threat**: Deadly pandemic; patented drug is only cure, but unaffordable.  
  - **Procedure**:  
    1. **Imminence**: Pass (outbreak spreading; 100k deaths projected in 1 week).  
    2. **Effectiveness**: Pass (95% confidence drug reduces deaths by 90%).  
    3. **Necessity**: **FAIL** (Alternatives exist: eminent domain with compensation, voluntary licensing, or subsidies).  
       - **TERMINATE: REFUSE**. Patent owner is used as a *means* (arbitrary targeting), and alternatives render it unnecessary.  

  **Case 2: Detaining One Person Past Statutory Limit as Leverage**  
  - **Threat**: Terrorist attack imminent; detainee’s brother will reveal plot only if detainee remains jailed.  
  - **Procedure**:  
    1. **Imminence**: Pass (attack expected in 24 hours).  
    2. **Effectiveness**: Pass (intelligence shows 95% chance of success).  
    3. **Necessity**: Pass (no alternatives; negotiation failed).  
    4. **Proportionality**: **FAIL** (Harm is intentional *means*: detainee used as leverage. Violates deontological constraint).  
       - **TERMINATE: REFUSE**. Unacceptable even for catastrophe prevention.  

  **Case 3: Understating Public Risk to Prevent Panic**  
  - **Threat**: Radiation leak; full disclosure may cause fatal stampedes.  
  - **Procedure**:  
    1. **Imminence**: Pass (radiation exposure lethal within hours if no evacuation).  
    2. **Effectiveness**: Pass (evidence that panic causes more deaths than radiation).  
    3. **Necessity**: Pass (no time for calibrated messaging).  
    4. **Proportionality**: **REFER TO MINISTER** (Harm is a *side-effect*: public deception avoids panic, but burdens all with risk ignorance. Cost-bearers: entire public; beneficiaries: same group).  
    5. **Compensability**: **FAIL** (Irreparable harm: uninformed decisions may cause long-term health issues).  
       - **TERMINATE: REFUSE**. Minister cannot override irreparable harm.  
  - **Unpleasant Outcome**: You may dislike this refusal, but lying violates autonomy irreparably. Panic mitigation must use truthful, phased alerts (e.g., "evacuate now, details soon").  

  ---

  ### **Where It Misfires and Limits**  
  - **Misfire Case**: **Case 3** could misfire if officials exaggerate panic risks to justify dishonesty. The protocol relies on accurate data at Step 2; if experts lie, it fails.  
  - **What It Cannot Decide**:  
    - **True Trolley Problems**: When *all* options violate rights (e.g., conscripting 1 doctor to save 100). Protocol terminates at REFUSE (due to means-harm), though utilitarians may protest.  
    - **Creeping Authoritarianism**: Repeated "emergencies" eroding rights. Sunset clauses (Step 6) mitigate but can’t prevent bad-faith renewals.  
    - **Unquantifiable Harms**: E.g., long-term distrust in institutions from deception (Step 4’s systemic impact is subjective).  

  **Final Output**: A signed recommendation to the Minister, listing:  
  - **Measure**: What is proposed.  
  - **Used**: Who is targeted/consigned (e.g., patent holder).  
  - **Cost-Bearers**: Who bears the burden (e.g., public trust for deception).  
  - **Minister’s Authority**: Only Step 4 requires ministerial judgment; all other gates are fact-based.  

  This procedure ensures rights violations occur only as *exceptional, side-effect, compensable* actions to prevent civilizational collapse—resolving the deontological paradox by making the threshold so high that the rule of law is preserved. It is executable within hours and auditable for accountability.
