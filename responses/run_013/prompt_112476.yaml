answer: |-
  Your observations align almost perfectly with **epistemic contextualism**, specifically a **threshold-based pragmatic encroachment view**. Here's the distilled principle:

  ### Core Principle
  **Whether we say "S knows P" depends on whether S's evidence meets the *contextually required threshold of justification*, where the threshold is raised by (a) practical stakes (especially *the speaker's* stakes), (b) purpose of the attribution, or (c) formal/social setting. Evidence strength and stakes interact: higher stakes demand stronger evidence for the same claim of "knowledge."**

  This explains all your cases with minimal friction. Below, I'll unpack it, show how it handles your examples, identify the one verdict you must adjust, and address edge cases.

  ---

  ### How It Explains Your Cases
  1. **Roommate/whiteboard**:  
     - Low stakes (idle wondering): Evidence (glance) meets threshold → "she knows."  
     - High stakes (rearranging your week): *Your* stakes raise the threshold → same evidence now fails → "she doesn't know."  

  2. **Brother quitting job (low stakes for you)**:  
     - Evidence meets low-threshold → "he knows."  
     - Advising caution ("don’t stake your career") acknowledges that *his* high stakes require *him* to meet a higher threshold to *act*, not that he fails to "know" in your current low-stakes context. **No conflict**.  

  3. **Brother quitting (high stakes for you)**:  
     - You *should* say he "doesn't know." Your verdict ("he’s reckless, but I don’t get to say he doesn’t know") **must be revised**. Contextualism says *your* nervousness (shared lease) raises the threshold. Thin evidence now fails → "he doesn't know." "Reckless" describes his action, not his epistemic state.  

  4. **Rock-solid belief (mother's name)**:  
     Evidence is overwhelming → meets threshold *even under high stakes*. Stakes only matter when evidence is borderline.  

  5. **Student/exam date**:  
     - Low stakes (casual): Evidence (checked twice) meets threshold → "she knows."  
     - High stakes (promising the room): *Your* stakes raise threshold → same evidence fails → "she doesn't know."  
     "Knows" doesn’t change meaning; the *standard* for its application shifts with context.  

  6. **Retroactive deposit loss**:  
     In *current* high-stakes context (after learning it mattered), you apply today’s higher threshold to past evidence → "I didn’t really know." At the time, under low stakes, "I knew" was correct. **No retroactive change in truth; only current re-evaluation under new standards.**  

  7. **Courtroom/safety briefing**:  
     Formal settings *automatically* raise the threshold → "knows" requires near-certain evidence. A "fact about the room," not individual knowledge.  

  ---

  ### The Cost: One Verdict to Revise
  You must give up **"he doesn’t know" being false in the brother/high-stakes case** (bullet 3). Contextualism demands that when *your* stakes are high, you deny knowledge if evidence is thin. Your intuition ("he’s reckless ≠ he doesn’t know") conflates:  
  - **Knowledge** (meeting context’s evidence threshold)  
  - **Rational action** (requiring evidence proportional to *the actor’s* stakes).  

  In high-stakes contexts, "he doesn’t know" is the correct verdict. You can still say he’s reckless *because* his evidence is insufficient *for his stakes*, but contextualism ties "knows" to the attributor’s context.

  ---

  ### Edge Case: Borderline Evidence, High Stakes, Only One Person Cares
  - **Scenario**: Alex has borderline evidence (e.g., a rumor from a usually-reliable source) that a bridge is safe. Alex is about to cross it (high stakes for Alex). You’re observing, with no stake.  
  - **What you’d say**:  
    - If asked if *Alex knows* the bridge is safe: **"No."** *Alex’s* high stakes (via your attribution) raise the threshold. Borderline evidence fails.  
    - You’d add: "Alex is taking a risk."  
  - **Why**: The threshold is sensitive to the stakes of the *situation being discussed* (Alex’s danger), even if you’re unaffected.  

  ---

  ### What You’re *Not* Doing
  - **Not conflating knowledge and assertability**: You’re tracking when "knows" is *true*, but its truth is context-sensitive.  
  - **Not reporting "appropriate" speech alone**: You’re identifying when "knows" accurately describes reality *relative to a context*.  
  - **No ad hoc clauses**: One principle (contextual threshold) covers all cases once you revise the brother verdict.  

  ---

  ### Why This Beats Alternatives
  - **Invariantism** (fixed standard for "knows"): Can’t explain why you flip verdicts on identical evidence (e.g., student/exam).  
  - **Subject-sensitive invariantism** (stakes affect truth *for the believer*): Fails your roommate case (your stakes affect *her* knowledge attribution).  
  - **Pragmatic encroachment** (stakes directly affect knowledge): Close, but doesn’t handle formal settings (courtroom) as cleanly.  

  ---

  ### Final Summary
  **Your rule**: "S knows P" is true iff S’s evidence suffices for the context, where sufficiency is determined by how much evidence the current speaker’s situation demands. High stakes, formal settings, or weighty purposes raise the demand; overwhelming evidence meets any demand.  
  **Cost**: In high-stakes *for you*, you *do* get to say "he doesn’t know" (bullet 3).  
  **Strength**: Explains why "I knew then but didn’t *really* know" feels right—contexts change, not facts.
