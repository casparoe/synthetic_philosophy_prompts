  1.  **Terza Rima (Interlocking Tercets):** The rhyme scheme strictly follows ABA, BCB, CDC, DED. This mirrors the chain: each element (tercet) is succeeded by one taking its dominant rhyme (like being topped by the next element). The sound passes: B from 1st tercet (say/paid) drives the 2nd, C (sight/light/bright) drives the 3rd, D (bound/found/ground) drives the 4th.
