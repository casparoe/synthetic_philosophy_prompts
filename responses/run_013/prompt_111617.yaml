answer: |-
  You've nailed the core frustration with evolutionary debunking arguments (EDAs) in metaethics. Your hunch is sharp, but the reality is a multi-layered stalemate driven by deeper philosophical fault lines. Let's dissect it candidly, starting with candidate diagnoses before settling on the primary one.

  ### Candidate Diagnoses
  1.  **The Epistemic Rift (Your Hunch Refined):** The core conflict is over **epistemic internalism vs. externalism** regarding justification/debunking.
      *   **Debunkers (Often Implicit Internalists/Inaccessibilists):** Demand a *non-accidental connection* or *explanation* for why the causal origin of a belief (evolution) would track its truth. They see the lack of an *accessible reason* linking cause to truth as defeating justification. The "coincidence" charge only makes sense if this connection is required. (Street, Joyce)
      *   **Realists (Often Externalists/Reliabilists):** Argue justification only requires that the belief-forming process *is in fact reliable*, regardless of whether the believer can *access* or *explain* that reliability. For them, the mere *existence* of a reliable link (e.g., via third factors) is sufficient, even if its evolutionary origin seems contingent. The etiological story is only relevant if it *demonstrably undermines reliability*. (Enoch, Wielenberg, co-opted Plantinga)
      *   **Why it Stalls:** Each side's rebuttal assumes its own epistemic standard. The debunker says the third-factor reply *begs the question* because it assumes the reliability (truth of moral facts) the debunker is challenging. The realist says the debunker *demands an impossible standard* that would also wreck math/induction. Neither can prove their epistemic standard is correct without circularity; it's bedrock intuition.

  2.  **The Scope/Ambition Ambiguity:** What exactly is "debunking" supposed to do?
      *   **Global Debunking:** Claims *all* moral beliefs are unjustified because their *entire causal origin* is evolutionary, not truth-tracking. This invites the companion-in-guilt reply and seems wildly implausible.
      *   **Local Debunking:** Claims EDAs undermine *specific types* of moral beliefs (e.g., deontic constraints) or *justification for realism specifically*. Realists counter that evolution *could* have shaped reliable mechanisms for *some* moral truths (e.g., basic welfare), even if not others.
      *   **Why it Stalls:** Debunkers often write like global debunkers but retreat to local claims under pressure. Realists exploit the implausibility of global debunking. The target is fuzzy.

  3.  **Empirical Underdetermination:** What *exactly* did selection shape?
      *   **Proximate Mechanisms vs. Abstract Beliefs:** Did selection shape specific moral *belief contents* or just domain-general *pro-social emotions/dispositions* (kin altruism, reciprocity, empathy) that we *interpret* morally? Realists lean heavily on this: selection shaped the *raw material*, not the sophisticated beliefs themselves. Debunkers argue the content is still causally downstream of those non-truth-tracking mechanisms.
      *   **The "Third Factor" is Vague:** *Is* survival intrinsically good? *Is* cooperation intrinsically valuable? Debunkers argue these are precisely the contested moral claims realists are smuggling in.
      *   **Why it Stalls:** Philosophers aren't doing the detailed evolutionary psychology. Both sides interpret the (often speculative) empirical story to fit their prior commitments. The lack of a definitive, granular account of evolved moral psychology allows endless reinterpretation.

  4.  **Metaethical Starting Points:** The debate covertly assumes incompatible views of moral facts.
      *   **Debunkers (Often Non-Naturalists/Error Theorists):** See moral facts as radically non-natural, causally inert "queer" entities. *Therefore*, evolution *couldn't* plausibly track them – the connection *must* be coincidental.
      *   **Realists (Varied):** Naturalists think moral facts *are* natural facts (e.g., about well-being) evolution *could* track. Non-naturalists think our cognitive faculties, shaped for survival, *can* still access non-natural truths via third factors or rational intuition.
      *   **Why it Stalls:** The EDA often *presupposes* the queerness of moral facts to generate the coincidence worry. Realists start from the intuition that we *do* have moral knowledge. The argument becomes circular: only those already leaning towards skepticism find the coincidence charge compelling.

  5.  **The "Companion" Mismatch:** Is mathematics/induction a true companion?
      *   **Debunkers:** Math/induction are *necessary for practical reason itself*. Evolution *had to* get those roughly right for *any* belief-forming to work. Morality isn't like that; false moral beliefs could still be fitness-enhancing.
      *   **Realists:** The *epistemic principle* used to debunk morality is the same one that would debunk math/induction if applied consistently. If it's too strong, it fails.
      *   **Why it Stalls:** It hinges on whether morality is seen as analogous to math/induction in its *epistemic indispensability*. This is deeply contested and returns us to the epistemic rift (is a reliability *explanation* necessary?) and metaethical starting points (are moral facts necessary/contingent?).

  **Your Hunch Collapses Into:** Primarily **#1 (The Epistemic Rift)**, with significant contributions from **#4 (Metaethical Starting Points)**. You're right: the core isn't *really* about evolution per se. Evolution is the *tool* exposing a pre-existing disagreement about what constitutes *justification* and the *nature* of the moral facts being justified. The "coincidence" only seems damning if you already demand an internalist/explanatory connection. The third-factor reply only works if you're an externalist about justification and a realist about the moral facts invoked.

  ### The Primary Diagnosis: Epistemic Rift + Metaethical Entrenchment
  The stalemate arises because **the EDA debate is a proxy war for fundamental, likely irresolvable, disagreements in epistemology and metaethics.** The debunker's core intuition is: "A belief caused *only* by evolutionary pressures beneficial for survival, with no independent reason to think those pressures track truth in this domain, cannot be justified knowledge." The realist's core intuition is: "If the process producing a belief is reliably truth-conducive (even if we don't fully understand why), and the belief seems obviously true, it is justified knowledge."

  *   **What the Sides Actually Say Fits This:**
      *   Debunkers (e.g., Street): "Show me *how* evolution connected us to these queer moral truths! Without that explanation, it's a coincidence." (Internalist/Explanatory Demand)
      *   Realists (e.g., Enoch, Wielenberg): "Selection favored believing survival is good *because survival is good*. The link exists, so reliability is established." (Externalist Reliabilism + Realism about the Third Factor)
      *   The "Begging the Question" Charge: The debunker says the realist *assumes* the truth of the moral fact ("survival is good") to explain the reliability. The realist says the debunker *assumes* no connection exists to demand the explanation.
      *   The "Companion-in-Guilt" Move: The realist points out the debunker's epistemic principle is self-defeating. The debunker replies morality isn't a true companion because it lacks the necessary indispensability of logic/math.

  **Is it Verbal, Substantive, or Intuitive?** It's **substantive but resting on bedrock intuitions** about justification and the nature of morality that are incredibly hard to argue for without circularity. The *concepts* ("justification," "knowledge," "moral fact") are contested, leading to some verbal disagreement, but the core clash is real.

  **Hidden Question?** The hidden question is: **"What are the necessary and sufficient conditions for a belief to be justified, specifically when its causal origin is 'off-target' (not aimed at truth)?"** This is pure epistemology.

  **What Counts as Progress?** Don't expect a knockout blow. Progress would look like:
  1.  **Sharpening the Epistemic Question:** Explicitly framing the debate *as* a clash between internalist/externalist (or accessibilist/inaccessibilist) theories of defeat/justification. Papers increasingly do this (e.g., Vavova, Korman).
  2.  **Conceptual Ethics:** Shifting to "What *should* we demand of justification for beliefs with 'off-target' origins?" This admits the foundational nature of the clash but allows normative argument.
  3.  **Refined Empirical Input:** Better evolutionary psychology detailing *exactly* how specific moral intuitions map onto evolved mechanisms. This won't resolve the epistemic rift but could narrow the scope of *local* debunking and make third-factor proposals more concrete/less question-begging (e.g., does kin selection *reliably* track special obligations?).
  4.  **Formal Modeling (Limited Use):** Probabilistic models of belief fixation under selection pressures (e.g., Clarke-Doane, Tersman). This clarifies *if* and *when* selection implies unreliability, but the models embed assumptions reflecting the epistemic rift.
  5.  **Changing the Question:** Moving away from "Does evolution *debunk* morality?" to "How *does* evolution (and culture) constrain and shape the *content* and *reliability* of our moral cognition?" This is more productive science but avoids the metaethical knife-fight.

  **The General Template & The Moral Case:**
  Yes, **this is a general template for "Genealogical Debunking Arguments":**
  1.  Identify the causal origin of belief/intuition X (Evolution, Cognitive Bias, Culture).
  2.  Argue this origin is "off-target" – aimed at F (fitness, comfort, social cohesion), not at truth about X.
  3.  Conclude: Beliefs about X are unjustified (or likely false).

  *   **Your Field (Helping Behaviour):** "Does kin selection explaining helping behaviour debunk *genuine* altruism?" The debunking charge *only works* if "genuine altruism" implies a motivation *ungrounded in* evolutionary mechanisms. This assumes a specific, often Cartesian, view of motivation/agency. Biologists (rightly) see the behavior as real; the "deeper" motivation is a philosophical add-on. The *philosophical* debate parallels the epistemic rift: Does explaining the *origin* of the motivation negate its *intentional content* or *moral quality*?
  *   **Cognitive Science of Religion (CSR):** "Do evolved cognitive biases (hyperactive agency detection, theory of mind) explaining religious belief debunk it?" Same structure. Defenders offer "third factors" (e.g., the bias makes us detect *real* agents; religion fulfills a *real* spiritual need). The stalemate mirrors metaethics: demand for explanation vs. externalist reliability, plus disagreement on the nature of religious truth.
  *   **What the Moral Case Adds:** Moral beliefs involve **inescapable practical normativity.** They *demand* action. This makes the "externalist reliability" reply feel less satisfying – knowing a belief is *reliably true* feels different from knowing it *binds me*. The "queerness" intuition is stronger. Moral disagreement is also more salient and visceral than disagreement about bird behavior or (often) religious doctrine, fueling skepticism about reliability. The moral case is the hardest because the stakes *feel* highest and the facts *feel* most detached from the proposed causal mechanisms.

  **Straight Talk on Your Framing:**
  *   **Confused?** No. Your framing is insightful and correctly identifies the epistemic core. Your behavioral ecology background gives you a keen eye for how causal explanations interact with normative concepts.
  *   **Stalled?** Yes, profoundly. The core issues (epistemic standards, nature of moral facts) are foundational. Progress is incremental refinement, not resolution.
  *   **Malformed Question?** The question "Does evolution debunk morality?" *is* malformed because it obscures the underlying questions: "What does justification require?" and "What are moral facts?". The debate persists because those deeper questions are unavoidable and contentious.

  **In short:** You're observing a philosophical trench war over the epistemic implications of naturalistic origins. The weapons (evolutionary psychology) are modern, but the battle lines (internalism vs. externalism, realism vs. anti-realism) are ancient. Your hunch is correct: the stalemate exists because the real fight is elsewhere. Evolution is the battlefield, not the cause of the war.
