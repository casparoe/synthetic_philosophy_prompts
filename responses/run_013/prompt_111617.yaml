  I should start by brainstorming possible diagnoses. First, the epistemic rift: internalism vs. externalism. If debunkers assume beliefs need a non-coincidental connection to truth (internalist), but realists only need reliability (externalist), that's a fundamental split. The user's hunch fits here. But maybe there's more—like conceptual ambiguity in "debunking" itself. Is it about justification or truth? Or perhaps an empirical underdetermination: what exactly did evolution select for? Proximate emotions or abstract beliefs? That gap lets each side interpret the evidence differently.

  Also, metaethical starting points might be doing covert work. Realists assume moral facts are detectable through evolution, while debunkers see them as queerly detached. That could make the third-factor reply question-begging from the get-go. And yes, this pattern shows up elsewhere. In behavioral ecology, explaining altruism via kin selection might "debunk" genuine altruism, but that hinges on whether "genuine" requires non-evolutionary motives. Same with religion—if beliefs arise from cognitive biases, does that undermine their truth? The general template is about causal origins vs. justification/truth, across domains.

  Now, tying this to what both sides say. Debunkers like Street demand an explanation for why evolution would track truth, implying a need for non-accidental connection. Realists like Enoch or Wielenberg offer third factors (e.g., survival is good) but rely on the truth of moral facts to do so—which debunkers see as circular. Companion-in-guilt arguments (e.g., math) get dismissed as irrelevant to morality specifically. This stalemate persists because each side's standards are rooted in deeper commitments they don't share.

