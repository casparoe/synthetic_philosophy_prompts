prompt: |-
  I have been trying to work out, case by case and without cheating, what I actually think about material constitution, and I have reached the point where I need someone to tell me what my verdicts add up to. The argument began in a friend's ceramics studio, over the question of how many things were on the bench: a lump of clay that had been sitting there since Monday, and the bowl it was thrown into on Thursday. Here is what I find myself wanting to say. The lump and the bowl are two things, not one. The lump was on the bench before the bowl existed; if I break the unfired bowl up and soak the pieces, I get my lump back — the same clay, the same lump, so far as I can see — but not the same bowl; and if instead the bowl goes into the kiln, the bowl comes out the other side, still the same bowl, while the clay does not, since what comes out is earthenware and not clay. But I also think there is only one material object on that bench. I have never been able to believe in coincident objects: I do not think there is a chair in the next room over and above the wood and the screws, and I do not think the bowl is a second thing lying in the same place as the clay. That pair of verdicts is, I take it, the problem. It gets worse, because I also think the bowl is nothing over and above its matter — no extra ingredient, no ghostly bowl-stuff, only the clay arranged bowlwise — and I am nevertheless not prepared to say that the bowl simply is the clay.

  Some further verdicts, less central but I think they belong to the pattern. If the bowl is smashed and I later glue the fragments back together, the thing I end up with is the very same bowl and not a replica of it; but at the moment of the smashing, I want to say, the bowl was destroyed. If I pinch a piece of clay off the lump, the lump survives, only smaller; the bowl, if the pinch comes from its rim, is damaged but survives as well. A lump of clay that has never been shaped but happens to look like a horse is not a statue; a lump that was shaped in order to look like a horse, and then abandoned, is a statue, though a bad one. A piece of driftwood mounted on a plinth in a gallery is a sculpture; the same piece of wood floating in the sea is not. And a plaster cast taken from the bowl is a new object, a copy, rather than the bowl itself, even if the bowl is destroyed in the taking.

  What I want from you is the principle, or the smallest set of principles, that gets these verdicts right, stated precisely enough that I can see which clause is doing which work, together with an honest statement of the verdicts it cannot accommodate: I would sooner give up a verdict than keep a theory held together with tape. Please apply it to at least two cases I have not mentioned, one of which should involve living matter — a hedge clipped into a shape, or a bonsai trained over decades, will do — and say what it implies for the question I keep going back and forth on, namely whether the throwing of the bowl brought a new object into being or only made a new description true of an old one. Where two of my verdicts cannot both be kept, tell me which one a competent defender of the principle would surrender, and why. There is no need for references; I can place the positions myself, and I am after the principle rather than a survey of what others have said.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been grappling with material constitution, starting from a ceramics studio scenario with a lump of clay and a bowl. Their verdicts seem contradictory: they believe the lump and bowl are two distinct things, yet only one material object exists. They reject coincident objects but also deny that the bowl is identical to the clay. 

  First, I need to understand their core positions. They mention the lump existing before the bowl, the bowl surviving firing while the clay doesn't, and the bowl being nothing beyond the clay arranged bowlwise. But they can't accept that the bowl *is* the clay. This is the crux of the problem. 

  Looking at their additional verdicts: the smashed bowl can be restored to the same object; pinching clay damages but doesn't destroy the bowl; intentional shaping defines statues (a horse-shaped lump isn't a statue unless intended); driftwood becomes art in a gallery context; plaster casts are copies, not the original. These points emphasize intention, function, and persistence conditions.

  The user wants a principle that explains all this without contradictions. They prefer sacrificing a verdict over a patched theory. They also want applications to new cases, like living matter (hedge/bonsai), and clarity on whether throwing creates a new object.

  I recall that their rejection of coincident objects rules out theories like constitutionalism. Their emphasis on arrangement and function suggests a hylomorphic approach, but they deny the bowl is the clay, which challenges strict identity. The temporal aspect (lump existing before the bowl) points to a phase sortal or modal approach.

  The key might be grounding object identity in functional persistence conditions plus historical properties like intention. The bowl isn't just the clay; it's the clay serving a bowl-function. This explains why firing destroys the lump (now earthenware) but preserves the bowl. Restoration works because the function is reinstated. The accidental horse-shape isn't a statue because no intention exists.

  For living matter: a bonsai is a distinct object from the plant because its persistence is tied to the art form, not just biology. Clipping a hedge into shape creates a topiary as a new functional object. 

  The unresolved tension: if only one material object exists, how can the lump and bowl be two things? Here, the user might need to accept that "thing" can refer to different aspects—functional vs. material—without being separate entities. Or surrender the "two things" language in favor of describing changes in state or phase.

  In the bonsai case, the plant undergoes a phase shift when trained, becoming a bonsai-object. The same matter, but a new functional identity. The user's verdicts mostly hold, except perhaps the insistence on two distinct "things" coexisting. A competent defender would reframe that as one object under different descriptions or phases.
answer: |-
  Your verdicts reveal a consistent, sophisticated view of material constitution centered on **functional persistence conditions** and **intentional-historical properties**, rejecting both mereological reductionism and coincidence. The core tension arises from distinguishing *objects* by their identity conditions while insisting on material monism. Here's the principle that systematizes your judgments:

  ### The Principle of Teleologically-Defined Objects (TDO)
  1. **Existence Condition**: An object *O* exists iff:  
     - (a) There is a parcel of matter *M* arranged in a specific form *F*,  
     - (b) *F* serves a sustained functional role *R* (e.g., containment, artistic representation),  
     - (c) *R* is actively intended or socially recognized (implicitly or explicitly).  

  2. **Identity Condition**: *O* persists iff:  
     - (a) *M* maintains continuity (no radical scattering or replacement),  
     - (b) *F* retains sufficient structure to fulfill *R*,  
     - (c) *R* remains relevant (intention/social context persists).  

  3. **Material Basis**: *O* is numerically identical to *M* during *O*'s existence, but *O* and *M* are not identical *simpliciter* because:  
     - (a) *M* can exist without *O* (pre-formation or post-destruction),  
     - (b) *O* and *M* have divergent persistence conditions (modality and temporality).  

  ---

  ### How TDO Explains Your Verdicts
  - **Lump vs. Bowl**:  
    - The *lump* is *M* under no sustained functional role (*R* absent).  
    - The *bowl* is *M* + *F* (hollow shape) + *R* (containment function) + *intention* (crafted for use).  
    - Two "things" in the sense of distinct *kinds* (material parcel vs. functional artifact), but only one material object (*M*).  
    - **Why firing destroys the lump but not the bowl**:  
      - *Lump* (as raw clay) requires *M* to be plastic and hydrous; firing alters this.  
      - *Bowl* persists if *F* (shape) and *R* (function) survive firing, even as *M* chemically changes.  

  - **Smashing and Reassembly**:  
    - Smashing destroys *F* and suspends *R* → bowl ceases to exist.  
    - Reassembly restores *F* and *R* with original *M* → same bowl (via TDO2a).  

  - **Pinching clay**:  
    - *Lump* persists (smaller *M* still lacks *R*).  
    - *Bowl* persists if *F* retains enough structure for *R* (e.g., still holds liquid).  

  - **Statue/Driftwood cases**:  
    - Accidental horse-shape lacks *intention* for *R* (artistic role) → no statue.  
    - Driftwood gains *R* in a gallery (social context) → becomes art.  

  - **Plaster cast**:  
    - New *M*, discontinuous with original → replica (TDO2a violated).  

  ---

  ### Where TDO Demands Surrender
  **Your claim: "The lump and the bowl are two things, not one."**  
  - TDO accepts this *conceptually* but rejects it *ontologically*.  
  - **Resolution**: There is only one material object (*M*), but it instantiates two distinct *modes of being*:  
    - *As clay-lump*: when *M* lacks functional role *R*.  
    - *As bowl*: when *M* is structured for *R* and *R* is active.  
  - **Surrender**: The phrase "two things" misleads; they are not two *objects*. A "thing" here is a phase or aspect of *M*.  
  - **Why?** Your rejection of coincident objects (e.g., "no chair over and above wood") forbids multiplying entities. TDO preserves this while distinguishing *descriptions*.

  ---

  ### Applications to New Cases
  **Case 1: Bonsai Tree**  
  - *Pre-training*: A shrub (*M*) with no artistic *R* → only a biological organism.  
  - *Post-training*: *M* is shaped into *F* (dwarf form) with *R* (aesthetic function) + *intention* (artist/gardener).  
  - **Verdict**: The bonsai is a new object—a *living artwork*—distinct from the untrained shrub.  
    - *Persistence*: It survives pruning (if *F*/*R* maintained) but dies if neglected (loss of *R*).  
    - *Not coincident*: There is only one entity (*M*) under a new description.  

  **Case 2: Organ Transplant**  
  - A heart (*M*) is:  
    - *In a body*: Functional role *R₁* (pumping blood).  
    - *In a vat*: Functional role *R₂* (surgical specimen).  
  - **Verdict**:  
    - The heart as an *organ* ceases when removed (*R₁* lost).  
    - The heart as a *specimen* begins in the vat (*R₂* activated).  
    - Same *M*, but two functional phases—no coexistence.  

  ---

  ### Answer: Did Throwing Create a New Object?
  - **Yes**, but not by adding matter or a "ghostly layer."  
  - **How**: The act of throwing imposed:  
    - (i) A new *form* *F* (bowl-shape),  
    - (ii) A new functional role *R* (vessel for containment),  
    - (iii) An intentional context (ceramics).  
  - Thus, *M* entered a new phase of existence *as a bowl*. The clay-lump phase ended, and the bowl phase began.  

  ---

  ### Unresolved Tension
  **Your claim: "The bowl is nothing over and above its matter" vs. "The bowl is not the clay."**  
  - TDO resolves this via *temporal qualification*:  
    - "The bowl *at t* is identical to the clay *at t*."  
    - But "the bowl" (as a functional entity) ≠ "the clay" (as a material parcel) *simpliciter* because their persistence conditions differ.  
  - **Cost**: Accepts temporary identity but denies trans-temporal identity for "the clay" and "the bowl" as continuants.  

  ### Competent Defender's Compromise
  A defender of TDO would surrender the **absolute distinction between "the bowl" and "the clay" in synchronic contexts**. At any moment the bowl exists, it *is* the clay—not a separate entity. The "two things" intuition reflects cognitive focus (lump-history vs. bowl-function), not ontology. This preserves your core aversion to coincidence while explaining diachronic differences.  

  This system prioritizes your functional/practical intuitions (art, restoration, intention) over mereological or temporal extremism. It treats objects as *functional phases of matter*, denying permanent "thinghood" to artifacts without resorting to magic or overlap.
