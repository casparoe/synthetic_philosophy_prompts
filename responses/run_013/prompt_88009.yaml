prompt: |-
  I spent 35 years as a chemist—mostly spectroscpy—and since I retierd I've been reading philosophy. I keep bumping into this Jain idea, anekantavada, which as I understand it says reality is many-sided and every judgment is only true from a certain perspective. The blind men and the elephant is the usual illustration, but the more interesting part is syadvada: instead of saying the elephant is like a rope, you say that in some respect it is like a rope and in some respect it isn't. The claim is that this isn't just politeness or hedging—it's the literal structure of truth. Everything is true only conditionally.

  So what's your credence that this is basically right as a theory of truth—i.e., that for any claim about the world, the most accurate assessment is that it's true in some respects and false in others, and there is no such thing as a claim that is just plain true, full stop? I'm at about 0.3 myself, but I don't trust it.

  Please give me a number and the decomposition. I want a JSON object with these fields:

  - 'credence': your number between 0 and 1.
  - 'subquestions': an array of objects, each with 'name', 'probability' (0-1), and 'justification' (one sentence). Include at least: (a) whether truth is always perspective-relative; (b) whether apparent contradictions can be reconciled by 'respects' without just equivocating; (c) whether the doctrine is self-consistent when applied to itself (if everything is only partially true, is that claim only partially true?); (d) whether anekantavada is really just fallibilism or contextualism in fancier clothes; (e) whether a paraconsistent or many-valued logic (one that doesn't treat every contradiction as fatal) can capture it. Add any others you think belong.
  - 'combination': a short explanation of how the subquestions combine into the final credence.
  - 'most_sensitive_subquestion': the name of the one that moves your final number most.
  - 'least_confident_subquestion': the name of the one you're least sure about.
  - 'what_would_move_it': what evidence or argument would shift your number most.

  No reading list, no citations—I can't look anything up anyway. Just reason it out. And don't just tell me it depends on what you mean by truth—I know that's the boring answer. I want to see where the number actually comes from.
