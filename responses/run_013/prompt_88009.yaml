  Combining these: Weight (c) and (d) heavily since they cut to the core. If anekantavada isn't self-consistent or is just repackaged fallibilism, it loses force. My credence lands at 0.45—higher than the user's 0.3, as I see merit in partial truths but doubt universality. 

