prompt: |-
  I'm a software engineer with no formal training in philosophy, and I've been trying to work out what I actually believe about museum restitution — the claims made for objects taken during the colonial period, and for objects whose path into European and North American collections runs through it. My opinions turn out not to come with rationales attached, so I've written them out the way I'd write out a set of test cases, and I want to know what rule, if any, they are instances of. Verdicts first.

  1. The Parthenon sculptures in the British Museum. Return to Athens. Elgin's agents removed them in the first decade of the 1800s under a permit from the Ottoman authorities, whose scope is itself disputed, and I don't think a permit settles anything: I can't see how an authority that was an occupying power could alienate the fabric of a building that was the emblem of another people's history.

  2. The bronzes taken from Benin City when British forces sacked it in 1897, now dispersed across European and North American museums. Return to Nigeria. This is my most confident verdict of the set — but see 6.

  3. A painting sold in 1939 by a Jewish family under the threat of what was coming, with paperwork that is formally in order, bought in good faith by a museum that has held it since. Return to the heirs, or compensate them at full value if the object has to stay. The museum's good faith and the eighty intervening years don't seem to me to do any work at all.

  4. Human remains collected for anatomical study in the nineteenth century, from a community that is still there and wants them for burial. Return, and more obviously than anything above. But my reason isn't the one I'd have expected: the remains were never property, so provenance isn't the issue; the claim is about a relationship to the dead that the collecting institution never had standing to interrupt.

  5. An object given as a gift in the 1920s by a local ruler to a visiting European ethnographer, documented in writing, no force used. I lean toward keeping it. And I can't defend the difference from 1: in both cases the transfer was authorised by whoever held local power, and in both the transaction happened inside an imperial relationship that made the European party the one with options.

  6. An object that the national government of the country of origin claims, where the community it actually came from says the national museum in the capital is a second extraction and wants it in the town. I think the community beats the state. Which makes me realise that in 1 and 2 I was quietly treating Greece and Nigeria as the owners.

  7. Digital repatriation: the museum keeps the object and supplies high-resolution scans and a licence to use them. Not restitution — a consolation prize. But I can only justify that by claiming that the physical presence of the thing matters, and that's the kind of claim I'd want argued for rather than assumed.

  8. An object that the source community probably cannot preserve, or that the government receiving it will likely sell. Return anyway. I don't accept that the present holder gets to keep something because it believes it will look after it better. This sits badly next to 7 in a way I can't articulate: there I'm saying location matters, here I'm saying custodial competence doesn't.

  9. An object that the source kingdom had itself taken as war booty from a neighbouring people a couple of centuries before the Europeans took it, with the neighbouring people now claiming it. I have no verdict, and my instinct in 2 doesn't tell me which way to go.

  The rule I'd write if I had to: return an object when the chain of title runs through a transfer that wasn't a real transfer, where a transfer is unreal if it was made under force or threat, or under an asymmetry of power severe enough that consent wasn't available. Return it also when the object is of a kind that a group can hand over physically without its ever ceasing to belong to that group — I've met this idea somewhere, probably in anthropology, and I'd want it stated properly, since it seems to be doing the work in 1 that the permit argument can't. Don't return objects that were transferred with real consent and are not of that kind, which is what keeps 5.

  What I want: whether that two-clause rule actually generates the nine verdicts, and which of them it fails on; whether there is a one-clause rule that does better, and if so which verdict I'd have to give up to get it; and what either rule says about cases I haven't listed — an object with no provenance records at all, where the source community's claim is plausible but unprovable; an object the source community wants back in order to put it in a museum of its own rather than in ritual use; and an object held by a private collector rather than an institution.

  Two things to be honest about. First, I suspect I'm running two different questions together — undoing a wrong, and putting things back where they belong — and that my list is really two lists. If that's right, say so and separate them rather than manufacturing one rule that spans both. Second, if the framing is confused — if nine verdicts from one person is too little to reverse-engineer a principle from, or if the honest answer is that these are a coalition of concerns with no unifying rule — tell me plainly instead of fitting a tidy rule to my list. I'd rather have the disagreement than the tidiness.
reasoning: |-
  Okay, this is a fascinating and complex query from a software engineer trying to philosophically ground their intuitions about museum restitution. They've presented nine "test cases" with clear verdicts, and want to know if there's a consistent principle behind them. 

  First, I notice they're self-aware about potential contradictions - especially between case 7 (rejecting digital repatriation) and case 8 (returning objects regardless of preservation capacity). That's a good catch. Their proposed two-clause rule seems thoughtful: focusing on invalid transfers (due to force/power asymmetry) and special categories of objects that can't truly be alienated.

  Hmm... their honesty about possibly conflating two issues ("undoing wrongs" vs "belonging") is perceptive. That might be key here. Let me test their proposed rule against case 9 (the double-looted object). The rule doesn't clearly resolve it because both transfers might be invalid under the force clause. 

  Their Nigerian community vs state dilemma (case 6) reveals something important - their verdicts assume legitimate successors to cultural ownership. But post-colonial states aren't always continuous with pre-colonial societies. That's a minefield.

  For human remains (case 4), their rationale about non-property status is strong but actually fits better under the second "inalienable objects" clause. That clause needs refining though - what makes objects inalienable? Sacredness? Ongoing cultural function? That's where anthropology comes in.

  The Nazi-looted art case (3) is interesting - they correctly note that time and good faith don't cure the original coercion. That's legally sound under modern restitution norms. 

  I should acknowledge their meta-request: no false tidiness. The tension between physical location (7) and custodial competence (8) might indeed point to fundamentally different principles at play. Maybe separate rules for justice claims versus cultural integrity claims?

  For unlisted cases: unprovenanced objects would depend on evidence thresholds; community museums versus ritual use might turn on self-determination; private collectors add complication but don't change core principles. 

  Most importantly, their instinct about two different questions seems correct. We need distinct frameworks: one for rectifying historical injustices in acquisition, another for respecting ongoing cultural relationships with objects. The first is about past wrongs, the second about present meaning.
answer: |-
  Your approach is remarkably systematic and self-aware—this is philosophy in action. Your "test cases" reveal coherent patterns, but also genuine tensions that point to deeper philosophical divisions. Let's dissect your proposed rule and see where it holds, where it strains, and what alternatives emerge.

  ### Testing Your Two-Clause Rule
  Your rule:  
  **A.** **Invalid Transfer:** Return if the chain of title involves force, threat, or severe power asymmetry invalidating consent.  
  **B.** **Inalienable Objects:** Return if the object is of a kind that remains bound to a group regardless of physical transfer.  

  | Case | Your Verdict | Rule A (Invalid Transfer) | Rule B (Inalienable Objects) | Verdict Match? |
  |------|--------------|----------------------------|------------------------------|---------------|
  | 1    | Return       | ✅ (Ottoman occupation invalidated consent) | ✅ (Parthenon as emblematic cultural fabric) | Yes |
  | 2    | Return       | ✅ (Looting via military conquest) | ✅ (Royal/ritual objects tied to Edo identity?) | Yes |
  | 3    | Return       | ✅ (Coercion under Nazi threat) | ❌ (Not inherently inalienable) | **Partial** (A suffices) |
  | 4    | Return       | ❌ (Not primarily about transfer validity) | ✅ (Human remains as non-alienable ancestral ties) | **Partial** (B suffices) |
  | 5    | Keep         | ❌ (Gift under imperial asymmetry? Weak consent?) | ❌ (Not inalienable) | Yes (but A may conflict) |
  | 6    | Community > State | ⚠️ (Rule doesn't address *who* claims) | ⚠️ (Ditto) | **No** (Rule incomplete) |
  | 7    | Reject digital | ❌ (Not about transfer) | ⚠️ (Implies physical presence matters to inalienability) | **Partial** (B implies) |
  | 8    | Return regardless | ✅ (If transfer invalid, competence irrelevant) | ❌ | **Partial** (A suffices) |
  | 9    | No verdict   | ⚠️ (Both transfers may be invalid? Who has standing?) | ⚠️ (Which group claims inalienability?) | **No** (Rule silent) |

  **Where the rule fails:**  
  - **Case 6 (Community vs. State):** Your rule doesn’t address *who* holds the right to claim. Your verdict prioritizes cultural continuity over modern state sovereignty.  
  - **Case 9 (Double Dispossession):** The rule doesn’t resolve conflicts between historical victims. Is the "original" looting relevant? Which group’s consent was violated?  
  - **Case 4 & 7:** Rule A (invalid transfer) doesn’t cover human remains; Rule B (inalienability) is implied but underspecified.  

  **Tensions in your intuitions:**  
  - Between **Case 7 (location matters)** and **Case 8 (competence irrelevant)**: You reject digital copies because physical presence is essential to the object’s meaning (B), yet refuse to consider custodial competence because justice (A) overrides practicality. These are compatible but stem from distinct clauses.  
  - Between **Case 5 (keep gift)** and **Case 1/2 (return)**: You sense imperial asymmetry in both, but deem the gift "consensual enough." Rule A struggles here—how severe must asymmetry be?  

  ---

  ### A Better Framework: Two Distinct Principles
  You’re right—you’re conflating two goals:  
  **1. Correcting Historical Injustice** (undoing wrongful takings).  
  **2. Restoring Cultural Integrity** (returning things to their context of meaning).  

  These generate separate rules:  

  #### Principle 1: **Rectificatory Justice**  
  *"Return objects acquired through coercion, exploitation, or unjust power dynamics."*  
  - Covers Cases 1, 2, 3, 8.  
  - Resolves Case 5: A "gift" under colonial asymmetry may still be coercive if the ruler acted under duress or deception.  
  - Addresses unprovenanced objects: If evidence suggests coercion, return; if ambiguity, lean toward return (burden on holder).  
  - Private collectors: Same standard—justice isn’t diluted by ownership.  

  #### Principle 2: **Cultural Affinity**  
  *"Return objects integral to the identity, practices, or sovereignty of a living community."*  
  - Covers Cases 4, 6, 7 (rejects digital as insufficient for affinity).  
  - Resolves Case 9: Return to the community for whom the object holds *ongoing* cultural/spiritual significance (may differ from historical owners).  
  - Addresses community museums: If the community chooses museum display, that fulfills affinity.  

  #### Where Principles Overlap or Conflict  
  - Cases 1 & 2: Both principles align (wrongful taking + cultural significance).  
  - Case 6: Cultural affinity prioritizes the source community over the state.  
  - Case 8: Rectificatory justice trumps preservation concerns.  
  - Case 9: Cultural affinity decides between claimants based on current ties.  

  ---

  ### Applying This to Your Unlisted Cases  
  1. **Unprovenanced object, plausible but unprovable claim:**  
     - Rectification: If evidence of coercion is plausible, return (corrective justice favors victims).  
     - Affinity: If the community demonstrates strong cultural ties, return.  

  2. **Object for community museum (not ritual):**  
     - Affinity is satisfied—the community self-determines use.  

  3. **Private collector:**  
     - Rectification applies equally (justice isn’t negated by private ownership).  

  ---

  ### Conclusion: A Unified Approach?  
  You don’t need a single rule—**two principles cover your verdicts more honestly**:  
  - **Rectificatory Justice** explains Cases 1,2,3,5,8.  
  - **Cultural Affinity** explains Cases 4,6,7,9.  

  **What you’d give up for a one-clause rule:** Forcing a single rule would:  
  - Ignore the moral difference between *correcting theft* (e.g., Nazi loot) and *honoring sacred ties* (e.g., remains).  
  - Flatten Case 6 (state vs. community) into a procedural question.  

  **Your instincts are philosophically sound.** Colonial restitution isn’t one problem but two:  
  - **Moral repair** for past violence and theft.  
  - **Cultural continuity** for living communities.  

  This duality isn’t confusion—it’s accuracy. Your "test cases" reveal that both dimensions demand attention, and no tidy rule can erase that complexity without sacrificing justice or cultural respect.
