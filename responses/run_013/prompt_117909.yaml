prompt: |-
  I'm in a very slow-moving decision theory reading group — we spent most of last month on Newcomb, again — and last week we finally got to the absent-minded driver problem. You're driving home along a road with two exits; when you arrive at an exit you can't tell whether it's the first one or the second one; pulling off at the first is worth nothing, pulling off at the second is worth a lot, and sailing past both leaves you mildly annoyed. The answer is that the best plan is to keep driving most of the time and only occasionally pull off, which means that at the moment the driver is actually sitting at an exit, the plan is telling him to do something that isn't the best thing to do given where he is. Everyone in the group said "right, dynamic inconsistency," and moved on, and I didnt want to be the guy who asks what that's supposed to mean.

  What I want from you is an example of the conceptual issue that this case is an instance of. Not the same puzzle with different numbers, and not another named paradox from the literature — I want the issue itself, stated plainly in a sentence or two, and then an example: some concrete situation, made up or pulled from ordinary life, that is an instance of that issue without also being an instance of the driver puzzle. Then tell me which features of the driver case are actually load-bearing for the issue and which are just scenery — the road, the two exits, the forgetting: is any of that doing real work? One warning: if the only examples you can come up with are akrasia-flavoured — procrastination, weakness of will, "I stayed up too late again" — then don't bother, because I'll take that to mean the issue is narrower than my group thinks it is, and what I'm really trying to find out is whether it's as general as they all seem to assume.

  And one more thing I keep getting stuck on, so please build it into the answer: in my version the driver is allowed to prepare in advance. He can tape a note to the dashboard, or tune the radio to a station that only comes in near the second exit, or count bridges. If any of that dissolves the puzzle, then the issue obviously can't be about memory at all, and I'd like your example to make clear what it is about instead. Don't send me off to the literature on this either — I mostly just want to see the shape of the thing, and I'd rather have your version than a summary of somebody's paper.
