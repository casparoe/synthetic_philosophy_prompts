prompt: |-
  before I read any more on moral testimony I want the spec first. what does a theory of moral testimony actually have to get right? give me the desiderata list — the cases it has to handle, the distinctions it can't collapse, the results it has to be consistent with — with the case or consideration behind each one, and tell me which of these are real requirements and which are just one camp's prejudice.

  the cases: the old intuition that you shouldn't let someone else tell you what's right; the person who knows they're bad at moral reasoning and outsources to a friend who's better at it; testimony about a general moral truth vs. testimony about what to do here and now; and the group / AI adviser case (does anything change if the testifier isn't a person?). also a case I keep circling and haven't seen handled well: the testimony is correct but the testifier is a monster — does that change wether you should defer?

  the distinctions it can't flatten: testimony vs. advice, believing the testimony vs. just acting on it, moral knowledge vs. moral understanding, trusting someone's character vs. trusting their reasoning.

  then the big one: is there actually an asymmetry between moral and non-moral testimony that a theory has to respect, or is that just a myth people keep repeating? flag any two requirements you think can't both be met, and tell me which single requirement rules out the most popular views. skip the scorecard, I'll do that myself.
reasoning: |-
  Okay, the user wants a comprehensive list of desiderata for a theory of moral testimony. Let me start by understanding their query. They mentioned specific cases: the old intuition against letting others dictate morality, outsourcing to a more competent friend, general vs. specific moral truths, group/AI advisors, and the issue of a morally corrupt testifier giving correct advice. Also, distinctions like testimony vs. advice, believing vs. acting, knowledge vs. understanding, and trust in character vs. reasoning. The big question is whether there's a genuine asymmetry between moral and non-moral testimony.

  First, I need to outline the core requirements. The user wants to know what any theory must account for, separating real necessities from biases. The cases they provided are crucial. The intuition against deferring is a key challenge—why does it feel wrong to let others decide morally? Competence-based outsourcing seems reasonable, so the theory should explain when and why it's acceptable. The distinction between general principles and specific actions might matter because deferring on specifics feels more problematic. Non-human advisors (like AI) could test if the issue is about human judgment or authority. The corrupt testifier case questions whether the source's morality affects the permissibility of accepting correct testimony.

  Next, distinctions. Testimony vs. advice: testimony is asserting a fact, advice is suggesting action. A theory must handle both without conflating them. Believing vs. acting: you might act on testimony without believing it, which relates to moral encroachment. Understanding vs. knowledge is vital—understanding involves grasping reasons, which might be necessary for moral responsibility. Trusting character vs. reasoning: relying on someone's virtues versus their logical skills might affect legitimacy.

  The asymmetry debate is central. If moral testimony isn't different from non-moral, then deferring should be equally acceptable. But many argue there's something special about moral deference. The user wants to know if this is a real requirement or a bias.

  I should identify which desiderata are widely agreed upon versus contentious. For example, handling the anti-deference intuition is necessary for any theory, while the understanding requirement is debated. Also, some desiderata conflict, like epistemic permissibility (if testimony is reliable, why not defer?) versus moral responsibility (deferring might undermine autonomy).

  The corrupt testifier case is tricky. Even if the advice is correct, the source's immorality might make accepting it problematic. This ties into trust and character versus reasoning. If a trustworthy person gives advice, it's different from a corrupt one, even if both are correct.

  AI advisors might show that the issue isn't about human authority but about understanding reasons. If an AI explains its reasoning, deferring might be more acceptable. This tests whether the core problem is epistemic or moral.

  I need to flag conflicts. For instance, epistemic permissibility conflicting with moral responsibility. If testimony is a reliable source, epistemically it should be acceptable. But morally, deferring might be irresponsible. Also, understanding versus reliance: requiring understanding might make reliance impossible, but without it, moral agency could be compromised.

  The user might be preparing to evaluate existing theories. They want a clear framework to test against these cases and distinctions. They might be a philosopher or student diving into metaethics, looking for a structured way to assess theories without bias. Their deeper need could be to cut through academic debates and identify non-negotiable criteria for a viable theory.
answer: |-
  Here's a structured desiderata list for a theory of moral testimony, differentiating core requirements from contested commitments. Treat this as your benchmark for evaluating theories.

  **Core Desiderata (Widely Agreed Requirements):**

  1.  **The Anti-Deference Intuition:**
      *   **Case:** The strong intuition that "you shouldn't just let someone else *tell* you what's morally right/wrong" (e.g., "Because my priest/politician/friend said so" feels insufficient or wrong).
      *   **Requirement:** The theory *must explain or accommodate* this widespread intuition. It cannot simply dismiss it as irrational. It needs to say *why* deference often feels problematic, even if it ultimately argues it *can* sometimes be permissible. Ignoring this is fatal.

  2.  **The Competence-Based Deference Case:**
      *   **Case:** An individual recognizes their own poor track record in complex moral reasoning (e.g., consistently selfish biases) and reliably defers to a friend known for exceptional wisdom, fairness, and insight in such matters. The friend's judgment is consistently sound.
      *   **Requirement:** The theory *must allow for the possibility* that such deference can be rational and morally permissible, or at least *not inherently irrational/impermissible*. It must explain *how* this case differs (if at all) from the anti-deference intuition case. A theory that rules out *all* deference is implausible.

  3.  **Distinction: Testimony vs. Advice:**
      *   **Consideration:** "Theft is wrong" (pure testimony asserting a moral fact) vs. "You shouldn't steal that" (advice, implying a course of action based on moral and possibly non-moral factors).
      *   **Requirement:** The theory must account for the phenomenological and functional differences. While related, collapsing them ignores that advice often incorporates non-moral elements (practicality, consequences for *you*) and feels more directly action-guiding. A theory must handle both but explain their relationship.

  4.  **Distinction: Belief vs. Action:**
      *   **Consideration:** Can you *believe* "X is wrong" solely on testimony (epistemic question)? Should you *act* (e.g., refrain from X) solely based on testimony (moral/practical question)? These might come apart.
      *   **Requirement:** The theory must address both the epistemology of *acquiring moral belief* via testimony and the ethics of *acting* on moral testimony. It cannot assume that believing entails one must/should act, or vice-versa. A theory collapsing this risks oversimplification.

  5.  **Non-Human Advisers (Group/AI):**
      *   **Case:** Does deferring to an algorithm trained on vast ethical datasets, or the averaged judgment of a diverse expert panel, pose fundamentally different problems than deferring to a single human expert?
      *   **Requirement:** The theory must be *applicable* to non-human sources. It needs to explain whether the core objections to moral deference are tied to *human* testimony specifically (e.g., concerns about character, relationship) or if they apply to reliable non-human sources too. This tests the scope of the theory's claims.

  **Contested Desiderata (Requirements for *Some* Theories / Points of Debate):**

  6.  **The Corrupt Testifier Case:**
      *   **Case:** A notoriously immoral person (e.g., a calculating, cruel dictator) correctly testifies that "Torturing innocents for fun is wrong." Should their corruption affect the permissibility of *you* believing/acting on this correct testimony?
      *   **Consideration:** Challenges the source-independence of moral truth. Does the *source's* moral character/vices undermine the legitimacy of *your* deference, even if the content is correct? Or is it purely about the content's truth/reliability?
      *   **Contested Requirement:** Theories emphasizing the *relational* or *character-based* aspects of trust often argue **yes**, this matters (e.g., accepting moral knowledge requires trusting a virtuous source). Purely epistemic/content-based theories often argue **no** (truth is truth, regardless of source). A theory must take a stance.

  7.  **Distinction: Moral Knowledge vs. Moral Understanding:**
      *   **Consideration:** Can you *know* "X is wrong" via testimony without *understanding why* it's wrong? Understanding implies grasping the reasons, principles, and context.
      *   **Contested Requirement:** Many theories (especially "Understanding-First" or "Kantian" views) argue that **moral deference can yield belief/knowledge but *not* genuine moral understanding**, and that understanding is crucial for full moral agency/responsibility. Other theories (e.g., strict reductionist epistemic views) downplay this distinction or see understanding as achievable through testimony. This is a major fault line.

  8.  **Distinction: Trusting Character vs. Trusting Reasoning:**
      *   **Consideration:** Are you trusting the testifier's general *good character/virtue* (which inclines them to truth) or their specific *reasoning competence* on this issue? These can sometimes conflict (a virtuous person lacking expertise, or a vicious expert).
      *   **Contested Requirement:** Theories focused on moral worth or relational ethics often prioritize **trusting character**. Theories focused on reliability or expertise often prioritize **trusting reasoning competence**. A robust theory should clarify what kind of trust is involved in justified deference.

  9.  **The Asymmetry Thesis:**
      *   **The Big Question:** Is there something fundamentally different/problematic about deferring on *moral* matters compared to deferring on *non-moral* matters (e.g., historical facts, scientific truths, directions)?
      *   **Contested Requirement:** **Pro-Asymmetry** theories (e.g., based on autonomy, understanding, action-guidingness) argue **yes**, moral deference is distinctively problematic. **Anti-Asymmetry/Symmetry** theories argue **no**, moral testimony functions epistemically like other testimony; objections stem from general epistemic/social concerns misapplied. *This is the central debate.* Your theory *must* explicitly take a position here.

  **Flagged Conflicts & The Key Constraint:**

  *   **Conflict 1: Epistemic Permissibility vs. Moral Responsibility.** A theory might successfully argue that moral deference is *epistemically* permissible (you can gain knowledge/belief) but still argue it's *morally* problematic to act solely on that basis due to lack of understanding/autonomy. Reconciling the epistemic possibility with the moral reservation is challenging.
  *   **Conflict 2: Understanding Requirement vs. Reliance Requirement.** Insisting that genuine moral agency *requires* first-hand understanding seems to rule out justified reliance on others for complex moral matters we cannot personally grasp (undermining desideratum 2: Competence-Based Deference). But allowing reliance without understanding risks undermining moral responsibility (linked to the Anti-Deference Intuition).

  *   **Single Requirement that Rules Out Popular Views:** The **Understanding Requirement** (Desideratum 7) is arguably the most potent constraint. It directly challenges the legitimacy of deference in principle for many views (e.g., Kantian, Aristotelian, some Intuitionist), forcing them to explain how deference could *ever* be compatible with genuine moral agency. It's the cornerstone of strong pro-asymmetry arguments. Views rejecting this requirement (e.g., strict reductionism, some consequentialist views) avoid this specific hurdle but struggle more with the Anti-Deference Intuition.

  **Summary of Key "Must-Handle" Cases & Distinctions:**
  *   **Cases:** Anti-Deference Intuition, Competent Outsourcing, General Truth vs. Specific Action, Non-Human Adviser, Corrupt Testifier.
  *   **Distinctions:** Testimony/Advice, Belief/Action, Knowledge/Understanding, Character/Reasoning Trust.
  *   **The Core Litmus Test:** **The Asymmetry Question.**

  This framework gives you the critical pressure points. Any viable theory needs a coherent story navigating these cases and distinctions, explicitly stating its stance on asymmetry and the understanding requirement. Now you can dissect the literature!
