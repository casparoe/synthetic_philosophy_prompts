prompt: |-
  You are a decision theorist who works on game theory and rationality, and I'd like you to think carefully from first principles before answering rather than giving me the standard survey. I've been reading about superrationality—the idea that in a symmetric prisoner's dilemma you should cooperate with anyone who is reasoning from the same premises as you, because you can treat your choice as evidence about theirs. It strikes me that my future self is exactly such an agent: she will face the same temptation to defect on the plans I make now, and she reasons from roughly the same premises I do. So isn't procrastination or breaking a resolution just a kind of defection in a prisoner's dilemma with my future self? And if so, shouldn't the superrational move be to cooperate with her—meaning I should keep my commitments because that is what an agent like me would do? I want to know how to use this insight to stop procrastinating. Please answer in continuous prose, with no headings, bullet points, bold text, or tables—write it as a letter to someone who knows some game theory but is not a specialist.
reasoning: |-
  Okay, the user is a decision theorist interested in game theory and rationality. They've been reading about superrationality and are drawing a parallel between the symmetric prisoner's dilemma and their own behavior with procrastination. Specifically, they see their future self as an identical agent facing the same choices, and they're wondering if superrationality implies they should cooperate now to ensure future cooperation.

  First, I need to unpack their core argument. They’re equating current and future selves as symmetric players in a repeated prisoner's dilemma where defection is procrastination. Superrationality suggests that identical rational agents should cooperate because their decisions are perfectly correlated. So if they cooperate now, the future self would too, breaking the cycle of procrastination.

  The user wants to stop procrastinating using this insight. Their explicit request is about applying superrationality, but their deeper need might be a practical method to commit to actions. They might have struggled with consistency and are seeking a rational framework to enforce discipline.

  I recall Douglas Hofstadter's superrationality where players recognize their symmetry and choose cooperatively, knowing the other will do the same. Applying this to one's temporal selves makes sense. But there's a hitch: in the standard prisoner's dilemma, players act simultaneously, while here the present self acts first. However, because the future self reasons identically, the present choice can signal or determine the future action.

  I should address potential counterarguments. Causal decision theorists might argue that your current choice doesn’t affect the future self’s decision since it's independent. But superrationality rejects that, emphasizing the logical correlation between identical reasoners. The user needs to internalize that their action sets a precedent—by cooperating, they’re acting as the type of agent who cooperates, which the future self will mirror.

  Another angle is the infinite regress in reasoning: "If I cooperate, will my future self?" Superrationality cuts this by prescribing cooperation as the only consistent choice for identical agents. It’s a focal point. 

  For practical application, I need to suggest ways to operationalize this. The user might benefit from ritualizing decisions—framing each choice as defining their identity as a cooperator. Instead of seeing a task as a one-off, view it as a step in a pattern where cooperation begets cooperation. Also, precommitment devices could help bridge the gap until the superrational mindset becomes habitual.

  I should also mention that this transforms the interaction into an assurance game. Once you commit to cooperation, defection becomes irrational because it guarantees mutual defection. The key is the psychological shift: seeing your future self as an ally, not an independent entity. Trusting that cooperation now ensures reciprocity later.

  Finally, emphasize that this isn't just theoretical. By consciously adopting the superrational perspective, they reframe procrastination as a betrayal of a collective self-interest. Each act of cooperation reinforces the identity of someone who keeps commitments, making future cooperation the natural choice.
answer: |-
  My dear colleague,

  Your inquiry cuts to the heart of a fascinating tension within decision theory: how to reason about interactions with agents who are not just similar, but fundamentally *identical* to you in their reasoning process. Your insight about superrationality and your future self is profound and touches on core issues of commitment, identity, and intertemporal bargaining. Let's walk through it carefully.

  You are absolutely correct in identifying the structural similarity between a symmetric Prisoner's Dilemma (PD) involving two identical superrational reasoners and the situation you face with your future self. The essence of superrationality, as championed by Hofstadter, is this: when facing an identical copy of yourself – an agent using the exact same premises and reasoning algorithm – your choice isn't causally independent of theirs. Choosing to cooperate isn't *causing* your copy to cooperate; rather, it *is* evidence that your copy *will* cooperate, because you both necessarily reach the same conclusion. Defection, similarly, signals mutual defection. The optimal choice becomes cooperation, as it is the only way to achieve the mutually preferred outcome when mutual cooperation is possible under identical reasoning.

  Now, transpose this onto your temporal self. Your future self *is* such an identical reasoner. She faces the same temptations, possesses the same goals (in principle), and crucially, reasons from the same cognitive architecture and premises as you do now. The "game" between Present-You and Future-You has the hallmarks of a PD:
  *   **Mutual Cooperation (CC):** You commit to the task now (work on the report, start the diet, study), and Future-You follows through. Best collective outcome (task completed).
  *   **Present Defection / Future Cooperation (DC):** You procrastinate now (defect on your current commitment), but somehow Future-You heroically does the task anyway. Best outcome for Present-You (avoid effort now), worst for Future-You (all the burden).
  *   **Present Cooperation / Future Defection (CD):** You exert effort now to start, but Future-You abandons the plan. Worst outcome for Present-You (effort wasted), best for Future-You (avoided effort later).
  *   **Mutual Defection (DD):** You procrastinate now, and Future-You procrastinates later. Status quo persists, task undone. Mediocre outcome for both.

  Under standard causal decision theory, Present-You might reason: "My action now doesn't *force* Future-You to cooperate. If I work hard now (cooperate), she might still defect later (leave me hanging). Worse, if I defect now (procrastinate), maybe she'll be forced to cooperate later and do it all anyway! So defecting now seems safest." This is the classic myopic defection logic leading to the DD trap.

  Superrationality offers an escape hatch precisely because of the identity of the players. Present-You and Future-You aren't independent agents; Future-You *is* the outcome of Present-You's reasoning and choices, instantiated later. When Present-You contemplates cooperation, she must recognize: "A reasoner *identical* to me, facing *identical* incentives, will reach the *identical* conclusion. If I conclude cooperation is rational, so must she. If I defect, she defects. My choice now *is* predictive of her choice because it stems from the same source."

  Therefore, the superrational perspective compels you to cooperate *now*. By choosing cooperation, you are not just acting for the present; you are acting *as* the type of agent who cooperates. You are setting the precedent that "an agent like me, in this situation, cooperates." Since Future-You *is* an agent like you, in a situation functionally identical (the same task, the same temptation), she will conclude the same: "An agent like me cooperates. Therefore, I cooperate." Cooperation now becomes a self-fulfilling prophecy anchored in your shared identity as a rational cooperator.

  Defection now, conversely, is also self-fulfilling. Choosing to procrastinate defines "an agent like me" as a defector. Future-You, reasoning identically, will see defection as the rational choice for "an agent like me," perpetuating the cycle. Mutual defection becomes the stable, but inferior, attractor.

  **How to use this to stop procrastinating:**

  1.  **Internalize the Identity:** Before a decision point (e.g., "Should I start working on X now, or later?"), pause. Explicitly frame it: "This is a Prisoner's Dilemma between Present-Me and Future-Me. Future-Me is *me*. She will reason *exactly* as I am reasoning right now." Recognize that your choice isn't isolated; it defines the rational choice for your identical successor.
  2.  **Make it Categorical, Not Conditional:** Don't think, "I'll work now *if* I believe Future-Me will cooperate." That invites doubt and defection. Think instead: "What does an agent *like me* – a rational agent committed to long-term goals – do in this situation? An agent like me cooperates *now* to set the precedent for cooperation." Your action defines what "like me" means for the future.
  3.  **Focus on the Pattern:** Procrastination often feels like a single, isolated lapse. Superrationality forces you to see it as part of a *pattern* of identity-defining choices. Each act of cooperation strengthens the identity of "a cooperator," making future cooperation the natural, rational conclusion for Future-You. Each defection reinforces the "defector" identity.
  4.  **Leverage the Symmetry:** The power lies in the symmetry. You cannot rationally expect Future-You to cooperate if you defect now, because *you* wouldn't cooperate later if you were in her shoes after having defected now. The only logically consistent path where cooperation occurs is if you start the chain *now*. Be the cooperator you wish Future-You to be – because she *will* be that cooperator only if you are first.
  5.  **Start Small, Build the Identity:** Begin with smaller commitments. Choose to cooperate (e.g., work for 10 minutes) on something manageable. Succeeding reinforces the "cooperator" identity through experience. This makes it psychologically easier to apply the superrational logic to larger tasks, as the evidence mounts that "an agent like me *does* cooperate."

  The superrational move is indeed to cooperate. By doing so, you resolve the intertemporal dilemma not through sheer willpower battling temptation, but through a deeper logical consistency: acting as the unified, cooperative agent you aspire to be across time. You align your present action with the future outcome by recognizing that both are outputs of the same reasoning process. Cooperating now *is* how you ensure Future-You cooperates, because it defines the rational choice for the identical agent she will be. Defection is not just failing your future self; it's failing the logical imperative of your own consistent identity.

  It requires a shift from thinking causally ("Can I make her cooperate?") to thinking reflectively ("What does my choice imply about the choices of all identical reasoners, including my future self?"). Embrace that reflection. Act as the cooperator, and thereby *become* the cooperator, moment by moment, for all your future selves. That is the superrational path out of the procrastination trap.

  Warmly,

  A Fellow Temporal Game Theorist
