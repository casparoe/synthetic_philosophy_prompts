prompt: |-
  I've been sitting in on my supervisor's grad seminar on vagueness and I want to work out what she actually thinks before I write my response paper, because she's slippery about it. Her verdicts so far, all on the sorites with 'heap': one grain of sand on a table isn't a heap, ten thousand is, and she gives both with no hedging at all. She treats the sorites arguement for 'no pile is ever a heap' as a reductio of the tolerance premise — 'if n grains isn't a heap then n+1 grains isn't either' is just false, full stop. She's a classicist: 'either 5,000 grains is a heap or it isn't' is true, she says, and she won't hear about dropping excluded middle or classical logic for vague sentences. Of a pile of about 5,000 grains she says you shouldn't assert that it's a heap and you shouldn't assert that it isn't — both assertions are out of order. She says no amount of counting grains, measuring, or polling English speakers could ever tell you which pile is the smallest heap. She buys penumbral connections: if one pile is a heap then a bigger pile is too, and a patch that's red all over can't be orange all over. And she's dead against degree talk — a borderline pile isn't 'half a heap', and it isn't both a heap and not a heap. The thing I've never got out of her is the thing I actually want: she'll talk all day about what you're entitled to assert and never quite says whether a borderline sentence has a truth value at all.

  I've got office hours Thursday and I want to put a new case to her that she hasn't covered: a colour patch sitting dead on the red/orange boundary, and the question whether 'that patch is red' is true, false, or neither — and more generally whether there's any pile or patch at all of which a vague sentence is neither true nor false.

  Give me this as a numbered list of exactly five items, a sentence or two each, no preamble and no wrap-up. (1) What she'll say about the patch, and about the general question. (2) The rule she seems to be running. (3) The rival rule or rules that fit her whole track record just as well, with what each predicts about the patch — I'm thinking epistemicism, supervaluationism, some flavour of contextualism, or something else, but tell me which of those her verdicts already rule out and which survive. (4) Which survivor you'd bet on and why. (5) The further case that would tell them apart, and which way each would go on it.
