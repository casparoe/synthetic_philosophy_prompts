  I've been reading about the Mencius–Xunzi debate on human nature, and I can't shake the feeling that Xunzi's position is internally unstable. If Xunzi thinks human nature is evil, then why does he place so much weight on ritual and education? For ritual to transform a person, doesn't there have to be something in human nature that is already receptive to it — some seed of goodness that the ritual can cultivate? Otherwise, it seems like you'd be trying to straighten a board that has no potential to be straight. And on the other side, Mencius says human nature is good, but he also insists that people need years of moral cultivation to become virtuous. So isn't he implicitly admitting that the goodness isn't really there by nature? It feels like each thinker is forced to borrow from the other's position. How should I resolve this apparent inconsistency? I'd like you to say how confident you are in your reading and to single out the point you're least sure about. Please structure your response as follows: (1) "The confusion in the question" (~150 words), (2) "What the distinction actually is" (~300 words), (3) "What remains genuinely contested" (~150 words), (4) "My confidence and least sure point" (~100 words).
