prompt: |-
  Alright, I need a game theorist to talk me down, and I'd rather get it from you then from my TA (who is 24 and terrifying). Background: I'm a philosopher, I teach a rational choice unit in a political theory seminar, and I've been doing the iterated-elimination thing for years, mostly from memory. Last week a student asked me something I couldn't answer and it's been eating at me. Treat yourself as the expert here and talk to me like a colleague. Take your time, and please actually work the two games below before you say anything general — I want the diagnosis, not the textbook gloss.

  Game 1 is the one I use to introduce mixed strategies. Row player's payoff first, column player's second:

            L        R
     T    3, 3     0, 0
     M    0, 0     3, 3
     B    1, 1     1, 1

  I tell them B is stupid: the 50-50 lottery over T and M gives you 1.5 against either column, and B only gives you 1. The cute part is that no pure strategy beats B — you need the lottery to do it. Then my student asks: if it takes a lottery to beat B, in what sense is B irrational? Someone who is dead certain the other player is playing L should play T, not flip a mental coin. And I have to admit I've always half-thought of dominance as a pure-strategy affair, with mixed-strategy dominance as a technical refinement for the graduate students. So what am I actually doing when I delete B? Is the lottery an option in the same sense T is? (My TA mumbled something about B not being a best response to any belief, which sounds like the right answer, but I want to see how it connects to the thing about lotteries.)

  Second thing, and this one has nagged me for years. My TA says the order of elimination doesn't matter, and that it's fine to use a strategy inside the eliminating lottery and then turn around and eliminate that same strategy two steps later. That sounds circular to me — if the thing doing the beating is itself beaten later, isnt the earlier elimination retroactively undone? Is he right that you get the same answer either way, and if so, where does the guarantee come from?

  Third, my lecture line is that what survives iterated elimination is roughly the set of strategies you might see in an equilibrium. Game 2, which I use for exactly this point, makes that look false. Same layout:

            L        C        R
     T    0, 7     2, 5     7, 0
     M    5, 2     3, 3     5, 2
     B    7, 0     2, 5     0, 7

  Nothing ever gets eliminated here — every strategy is a best response to some belief — and yet the only equilibrium is both players playing M. So my survivors include strategies that no equilibrium ever uses. Which of my two sentences has to go, and what should I say instead? Is there a name for what the procedure is actually picking out, and does it have anything to do with rationality, or is it a different idea wearing the same coat?

  Last, a practical one. I've also been telling them to go ahead and delete weakly dominated strategies while they're at it, on the grounds that a weakly dominated strategy can't be a best response either, so no harm done. My TA winced at that. Was he right to wince?
reasoning: |-
  Alright, let me tackle this step by step. The user is a philosopher teaching rational choice theory and has hit some conceptual snags. They're clearly knowledgeable but troubled by student questions that challenge their understanding. I need to address their concerns without jargon, showing the math but keeping it conversational.

  First, Game 1 and the rationality of deleting B. They've always said B is "stupid" because a 50-50 mix of T and M gives 1.5 > 1. But the student asked: if you need a mixed strategy to beat B, and pure strategies can't, why is B irrational? The user suspects mixed strategies might be a "technical refinement." 

  Hmm. The key is that rationality isn't about what *does* beat a strategy, but what it *loses to*. B isn't strictly dominated by any pure strategy, but it *is* strictly dominated by the mixed strategy (0.5T, 0.5M). That means no matter what Column plays, the mixed strategy gives higher payoff. So a rational player would never choose B because there's a strictly better option available—even if that option involves randomness. 

  The TA's "not a best response to any belief" point is spot-on. For B to be rational, there'd have to be some belief about Column's play where B is optimal. But if Column plays L, Row should play T (3>1); if R, then M (3>1); if mixed, the mixed strategy still beats B. So no belief justifies B. The lottery isn't just a trick—it's necessary to expose B's irrationality. 

  Second issue: order of elimination. The TA says it doesn't matter, but the user worries it's circular. They're right that elimination order can matter for *weak* dominance, but for *strict* dominance, it doesn't. Why? Because if strategy A is strictly dominated *at all*, it's strictly dominated by something that isn't itself strictly dominated yet. So deleting A first doesn't "rescue" it later. The guarantee comes from transitivity: if X beats Y, and Y beats Z, then X beats Z, so deleting Z first doesn't change X dominating Y. 

  Third, Game 2: nothing is dominated, but the only NE is (M,M). The user's line that "what survives iterated elimination is roughly the set of strategies in equilibrium" is too strong. Survival just means "not strictly dominated," which is necessary but not sufficient for being in an equilibrium. Here, T and B *could* be played if players had crazy beliefs (e.g., Row thinks Column will play R, so Row plays T), but in equilibrium, beliefs are correct, so only M makes sense. The procedure picks out "strategies that might be rational under some beliefs," not necessarily equilibrium play. 

  Lastly, weak dominance. The user thinks deleting weak-dominated strategies is fine since they "can't be best responses." But that's not true! Weak-dominated strategies *can* be best responses if they tie with the dominator at the opponent's play. Deleting them can remove equilibria, like in the Battle of the Sexes where both pure NE use weak-dominated strategies. So yes, the TA should wince—deleting weak-dominated strategies loses information about possible rational play. 

  Overall, the user's unease comes from conflating three things: dominance (a rationality criterion), equilibrium (a stability concept), and the epistemic conditions for each. Untangling those should help.
answer: |-
  Alright colleague, let's tackle this head-on. Coffee's on me – imaginary, but potent. I'll work through your examples as requested, then synthesize. This is messy, beautiful game theory, not textbook gloss.

  **Game 1: The B Affair & Mixed Strategy Dominance**

      L       R
  T  (3,3)  (0,0)
  M  (0,0)  (3,3)
  B  (1,1)  (1,1)

  *   **Your Lecture Line:** B is "stupid" because a 50-50 lottery between T and M yields 1.5 > 1 against *either* L or R.
  *   **Student's Challenge:** If B is beaten *only* by a lottery (not a pure strategy), and if a player is "dead certain" the opponent plays L (so they play T), how is B *irrational*? Dominance feels like a pure-strategy concept.
  *   **TA's Mumble:** "B isn't a best response to any belief." (Correct, but needs connection).

  **Diagnosis & Connection:**

  1.  **The Lottery *is* an "Option":** You've hit the core conceptual shift. Rationality *requires* considering *all* available actions, including *randomizations* over them (mixed strategies). A rational player isn't limited to pure commitment; they can hedge bets. The set of available choices includes the *simplex* over {T, M, B}.
  2.  **Strict Dominance Defined Properly:** Strategy S is **strictly dominated** if there exists *some other strategy* (pure **or mixed**) S' such that S' yields a strictly higher payoff than S *against **every** possible pure strategy of the opponent*. That "some other strategy" is the key.
  3.  **B is Strictly Dominated:** The mixed strategy σ* = (0.5 T, 0.5 M, 0 B) strictly dominates B:
      *   Against L: σ* gives (0.5 * 3) + (0.5 * 0) + (0 * 1) = 1.5 > 1
      *   Against R: σ* gives (0.5 * 0) + (0.5 * 3) + (0 * 1) = 1.5 > 1
  4.  **The Belief Connection (TA's Point):** For B to be a rational choice (a best response), there must be *some belief* the player holds about the opponent's play (a probability distribution over L and R) that makes B optimal.
      *   If belief is 100% L: Best Response is T (3 > 1), not B.
      *   If belief is 100% R: Best Response is M (3 > 1), not B.
      *   If belief is (p, 1-p) for p ≠ 0.5: Expected payoff of T is 3p, M is 3(1-p), B is 1. One of T or M will give 3p or 3(1-p) > 1.5 > 1? Not necessarily (if p=0.6, T gives 1.8, M gives 1.2, B gives 1. T is better than B). Crucially, *even if* p=0.5:
          *   T gives 3*0.5 = 1.5
          *   M gives 3*0.5 = 1.5
          *   B gives 1
          *   **σ* also gives 1.5**. B is *worse* than T, M, *and* σ*.
      *   **Conclusion:** There is *no* belief (pure or mixed) about the opponent's play for which B yields a strictly higher payoff than some other available strategy (T, M, or σ*). It is *never* a unique best response, and it is always strictly worse than σ*. Deleting B is justified because it is strictly dominated (by σ*) and because it can *never* be rational given the full set of choices (pure and mixed).

  **Game 2: Survivors vs. Equilibrium & Order of Elimination**

      L       C       R
  T  (0,7)  (2,5)  (7,0)
  M  (5,2)  (3,3)  (5,2)
  B  (7,0)  (2,5)  (0,7)

  *   **Observation:** Nothing is strictly dominated. Check for Row (Column is symmetric):
      *   T vs M: T better if Col plays R (7>5), M better if Col plays L (5>0) or C (3>2). Not dominated.
      *   T vs B: T better if Col plays C (2>2? Wait, tie!) or R (7>0), B better if Col plays L (7>0). Not dominated (ties matter!).
      *   M vs B: M better if Col plays L (5>7? No, 5<7!) or C (3>2), B better if Col plays R (0>5? No!). M better against C, B better against L. Not dominated.
  *   **Equilibrium:** Only (M, C) is Nash. ((3,3)). Why?
      *   If both play M/C, payoff (3,3).
      *   If Row deviates to T: Gets 2 < 3 (Col still on C).
      *   If Row deviates to B: Gets 2 < 3 (Col still on C).
      *   If Col deviates to L: Gets 2 < 3 (Row still on M).
      *   If Col deviates to R: Gets 2 < 3 (Row still on M).
  *   **Your Lecture Line:** "What survives iterated elimination is roughly the set of strategies you might see in an equilibrium." Here, everything survives, but only M/C appear in equilibrium.
  *   **The Problem:** Your sentence conflates two distinct concepts.

  **Diagnosis:**

  1.  **What Iterated Elimination of Strictly Dominated Strategies (IESDS) Actually Captures:** IESDS identifies strategies that are **rationalizable**. A strategy is rationalizable if it is a best response to *some* belief about the opponents' play, where that belief itself only assigns positive probability to strategies that are best responses to some belief, and so on. It captures the set of strategies that *could* be played by rational players whose rationality and the structure of the game are common knowledge. In Game 2:
      *   *Could* Row play T? Yes, if Row believes Col plays R. Is that belief rationalizable? Could Col play R? Yes, if Col believes Row plays B. Could Row play B? Yes, if Row believes Col plays L. Could Col play L? Yes, if Col believes Row plays T. It's a loop, but a consistent one under common knowledge of rationality. Same logic holds for all pure strategies. Hence, all survive IESDS because all are rationalizable.
  2.  **What Equilibrium Captures:** Equilibrium requires *mutual best responses* and (in Nash) *correct expectations*. Rational players in equilibrium don't just have *some* rationalizing belief; they have beliefs that are *correct*. In Game 2, the *only* pair of mutual best responses is (M, C). While T, B, L, R *can* be played under *some* beliefs (rationalizable), those beliefs are *not* correct in equilibrium. If Row plays T, the *best* Col can do is play L (getting 7), not R. But if Col plays L, Row should play B, not T! Beliefs unravel unless players coordinate on M/C.
  3.  **Which Sentence Has to Go?** The overly broad one: "What survives iterated elimination is roughly the set of strategies you might see in an equilibrium." **Replace it with:** "What survives iterated elimination of strictly dominated strategies is the set of **rationalizable strategies**. These are strategies that *could* be played by rational players with common knowledge of rationality, *under some consistent beliefs*. In Nash equilibrium, players use strategies that are rationalizable *and* their beliefs are mutually correct."

  **Order of Elimination & Circularity**

  *   **TA is Correct (for Strict Dominance):** The order of elimination **does not matter** for the final set of strategies surviving IESDS. If a strategy is strictly dominated in the original game, it remains strictly dominated *even if* a strategy that dominated it gets eliminated later (as long as the dominator wasn't its *only* dominator). More importantly, a strategy strictly dominated in the original game *cannot* become undominated later.
  *   **Why No Circularity?** Strict domination is absolute: "Strategy S is strictly worse than Strategy T *against every possible profile of opponents' strategies*." Eliminating a strategy D doesn't *create* new ways for S to be good; it only removes profiles where S *might* have been compared to D. Crucially, if S was strictly dominated by T originally, T beats S *on every profile*, including those that don't involve D. Eliminating D doesn't make S look any better relative to T. The guarantee comes from the **transitivity** inherent in strict domination across the entire strategy space. If A strictly dominates B, and B strictly dominates C, then A strictly dominates C. Eliminating C first doesn't "rescue" B because A still dominates B everywhere.
  *   **Caveat:** This **only holds for strict dominance.** Order *can* matter for weak dominance (which is a big part of why your TA winced later!).

  **Weak Domination: To Delete or Not to Delete?**

  *   **Your Line:** "Delete weakly dominated strategies too, they can't be best responses, no harm done."
  *   **TA's Wince:** **Justified.** Your line is incorrect.
  *   **Why:**
      1.  **Weakly Dominated Strategies *CAN* be Best Responses:** A strategy is weakly dominated if there's another strategy that is *at least as good* against *all* opponent profiles and *strictly better* against *at least one*. Crucially, it *can* be *just as good* as the dominator against the profile(s) the opponent *actually* plays. If a player believes the opponent will only play profiles where the two strategies tie, the weakly dominated strategy *is* a best response!
      2.  **Deleting Them Can Remove Equilibria:** This is the critical point. Nash equilibria *can* include weakly dominated strategies. Deleting them during IESDS can actually *remove* Nash equilibria from consideration. Classic example: Battle of the Sexes.
          *   Simplified BoS:
              ```
                    Ballet    Fight
              Ballet  (2,1)   (0,0)
              Fight   (0,0)   (1,2)
              ```
          *   (Ballet, Ballet) is a pure Nash Equilibrium.
          *   Is "Fight" weakly dominated for Row? Yes! Ballet gives 2 > 0 if Col plays Ballet, and 0 = 0 if Col plays Fight. So Ballet weakly dominates Fight for Row.
          *   If you delete Fight (weakly dominated) for Row *before* solving, you eliminate the (Ballet, Ballet) equilibrium! (Similarly, Fight weakly dominates Ballet for Column, deleting Ballet for Column would eliminate (Fight, Fight)).
      3.  **Loss of Information:** Deleting weakly dominated strategies loses information about potential rational play and equilibria based on coordination or specific off-equilibrium beliefs.

  **Synthesis & Recommendations:**

  1.  **Game 1 (B):** You were conceptually right to delete B, but your justification was incomplete. Emphasize that rationality requires considering *all* available actions, including randomizations. B is irrational because:
      *   It is strictly dominated by the mixed strategy (0.5T, 0.5M).
      *   There exists *no belief whatsoever* about the opponent that makes B a best response.
      *   Connect the lottery (mixed strategy) directly to the belief argument: even if you believe the opponent plays a 50-50 mix, the lottery *still* beats B. No belief saves it.
  2.  **Order of Elimination:** Reassure your students (and yourself) that for **strict** dominance, order doesn't matter. The guarantee comes from the definition of strict domination being absolute across all opponent strategy profiles and the transitivity property. It's not circular. Demonstrate with a small example if needed.
  3.  **Game 2 (Survivors vs. Equilibrium):** Refine your lecture line. Distinguish clearly:
      *   **IESDS Survivors = Rationalizable Strategies:** Strategies that *could* be played under common knowledge of rationality and *some* consistent beliefs.
      *   **Nash Equilibrium Strategies:** Rationalizable strategies played in a profile where beliefs are *mutually correct* (best responses to each other).
      *   Say: "IESDS gets rid of strategies that could *never* be rational. What's left (rationalizable strategies) are the *only* candidates for being played in *any* Nash equilibrium. But not every rationalizable strategy necessarily appears *in* an equilibrium, as Game 2 shows. Equilibrium imposes the extra condition of belief correctness."
  4.  **Weak Domination:** **Stop telling students to delete weakly dominated strategies during IESDS!** Explain why:
      *   Weakly dominated strategies *can* be best responses to *some* beliefs (specifically, beliefs concentrated on opponent profiles where it ties with its dominator).
      *   Deleting them risks eliminating valid Nash equilibria.
      *   IESDS should stick to **strict** dominance. Weak dominance is more fragile and used carefully in specific refinements (e.g., trembling hand) but not in the basic iterative procedure. Your TA winced correctly.

  This is the heart of the matter: IESDS based on strict dominance is a powerful, order-independent tool for eliminating *unambiguously irrational* strategies (those never a best response), leaving the rationalizable set. It identifies possibilities. Equilibrium requires mutual consistency of these possibilities. Weak dominance lives in a murkier epistemic space and shouldn't be mixed into basic IESDS. Your unease stems from glimpsing the boundaries between dominance, rationalizability, and equilibrium – boundaries worth exploring explicitly with your students. Now go forth and philosophize with clearer game-theoretic foundations! Your TA might still be terrifying, but at least you'll know why they're right.
