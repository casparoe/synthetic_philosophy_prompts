prompt: |-
  ok so I'm trying to nail down a spec for what a theory of moral worth actually has to deliver, before I wade into any more of the literature and get lost. By moral worth I mean roughly the thing that makes an action deserve a certain kind of credit or praise on the agent's behalf, as opposed to just being the right thing to have done, or being useful, or flowing from some trait they happen to have. I want the full requirements list, not another theory.

  Give me the cases any adequate theory has to get right, each with one line on what it's doing there. At minimum: the person who keeps a promise mainly because breaking it would humiliate them; the person who helps a stranger with real warmth but would have walked past if the stranger were ugly; someone who does the right thing only out of dread of their own guilt; someone who does the right thing for a reason that isn't the reason that makes it right (does you a favour because they like you, not because you needed it); and a case where the action is right, the motive is admirable, and the link between the two is sheer luck. Add any case you think does more work than mine.

  Then the distinctions it can't collapse: acting rightly vs acting worthily; praiseworthiness vs moral worth; the worth of the action vs the worth of the agent's character; and the gap between the reason the agent acted on and the reason that made the act right.

  Then the constraints coming from outside philosophy. Two I keep bumping into: how unreliable people are at reporting their own motives, and the fact that a lot of doing-good is habit and disposition rather than conscious deliberation. A view that requires the agent to have explicitly represented the right-making feature looks like it fails on both. Is that genuinely fatal, or is it a demand we should just drop?

  Flag any pair of requirements you suspect can't be jointly satisfied. My suspicion is that tying worth to something the agent is responsible for and tying it to the action's actual right-making features pulls apart, but tell me if that's confused.

  Finally: which single requirement does the most excluding work, i.e. knocks out the most otherwise plausible views, and briefly how do the Kantian quality-of-will line, the responsiveness-to-reasons line, and the Humean sentimentalist line fare against the list? Keep the scoring short, the criteria are what I need. No citations, I'll fill those in myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They want a clear spec for a theory of moral worth, distinct from just right action or character traits. They mentioned specific cases, distinctions, constraints, and potential conflicts. 

  First, I need to ensure I understand each component. The cases they listed are classic examples in moral philosophy, like the person motivated by humiliation avoidance. I should check if there are other pivotal cases to add, like the conscientious skeptic or the unknowing right-maker. These test different aspects of motivation and awareness.

  Next, distinctions. Acting rightly vs. worthily is crucial—right action doesn't guarantee praiseworthiness. Also, separating action worth from agent character worth, since habitual actions might lack conscious motive but still be worthy. The reason gap highlights when agents act for non-right reasons even if they do the right thing.

  Constraints like unreliable self-reporting and habitual actions challenge theories requiring explicit reasoning. If a theory demands conscious deliberation, it might exclude many everyday good deeds done out of habit. That seems fatal, so theories need to account for implicit motives or dispositions.

  Potential conflict: linking worth to responsibility (agent's control) vs. right-making features (external reasons). If an agent isn't aware of the right reason, can they be responsible for acting on it? That tension might be unresolvable for some theories.

  The most excluding requirement? Probably the reason gap. Many theories, like Kantian, require acting from duty, which might not handle cases where right action is done for personal reasons. Responsiveness-to-reasons might struggle with the skeptical philanthropist. Humean views could miss moral worth when sentiments align accidentally.

  I should assess each theory against the list. Kantian might fail the humiliation case and habitual actions. Responsiveness-to-reasons could handle some cases but not the skeptic. Humean might conflate sentiment alignment with worth, missing the luck case.

  User's deeper need: a robust framework to evaluate theories without getting lost in literature. They want clarity on necessary conditions and pitfalls. Highlighting conflicting requirements helps them identify which theories might fail where. Emphasizing practical constraints (like unreliable motives) ensures the theory is psychologically plausible.
answer: |-
  Here's a distilled spec for a theory of moral worth, focusing on your requirements:

  **I. Core Definition:** Moral worth is the property of an action (or the agent *in performing that action*) that makes it genuinely praiseworthy *for its own sake*, distinct from:
  *   The action being objectively right or good.
  *   The action being beneficial.
  *   The action stemming from a generally virtuous character trait.
  *   The agent receiving external praise or blame.

  **II. Mandatory Cases & Their Function:**
  1.  **Humiliation-Avoider:** Keeps a promise *primarily* to avoid personal humiliation. *(Tests if acting rightly but for self-interested/alien motives suffices for worth - it shouldn't.)*
  2.  **Conditional Altruist:** Helps a stranger warmly, *but only because* they find them attractive; would ignore an "ugly" person in need. *(Tests if contingent/arbitrary motives based on personal taste negate worth, even with warmth - they should.)*
  3.  **Guilt-Dreader:** Does the right thing *only* to avoid the crushing feeling of future guilt. *(Tests if acting from mere aversion to self-punishment (even internal) suffices for worth - it shouldn't.)*
  4.  **Mistaken Motiver:** Does you a needed favor *only* because they like you, utterly indifferent to your need. *(Tests if acting for a reason entirely disconnected from the right-making feature suffices for worth - it shouldn't.)*
  5.  **Accidental Alignment:** Performs the right action (saving a child) with an admirable motive (deep compassion), *but* the connection is sheer luck (e.g., they were actually aiming to impress someone else and didn't notice the child until the last second; their compassion just happened to align). *(Tests if mere coincidence between action/motive and rightness suffices for worth - it shouldn't; the motive must *track* the rightness.)*
  6.  **Conscientious Skeptic:** Does the right thing (e.g., tells truth) *despite* sincerely believing it's wrong (e.g., due to a flawed moral theory), but *because* they believe it's their strict duty. *(Tests if worth requires *correct* moral belief, or if acting from a sense of duty itself has worth even when mistaken about the rightness.)*
  7.  **Unknowing Right-Maker:** Acts from a genuinely good motive (e.g., kindness) intending something good, but their action *accidentally* fulfills a much more significant moral requirement they were unaware of (e.g., their kind act unknowingly prevents a disaster). *(Tests if worth attaches to the intended object/result of the motive or if the actual right-making feature must be part of the agent's reason.)*

  **III. Essential Distinctions:** A theory must *not* collapse:
  1.  **Acting Rightly vs. Acting Worthily:** (The core distinction; right action is necessary but insufficient for worthy action).
  2.  **Praiseworthiness vs. Moral Worth:** (Praiseworthiness can be broader, e.g., praising effort; moral worth is specific to the *moral quality* of the motivation for *that* right action).
  3.  **Worth of Action (in this instance) vs. Worth of Agent's Character:** (A generally vicious person can perform a morally worthy action; a generally virtuous person can fail to do so on a specific occasion).
  4.  **Agent's Reason vs. Right-Making Reason:** (The reason *why* the agent acted vs. the feature(s) that *actually* made the act right; worth requires a non-accidental link).

  **IV. External Constraints:**
  1.  **Unreliable Self-Reporting:** Theories relying on agents accurately identifying/introspecting their primary motives are empirically dubious.
  2.  **Role of Habit/Disposition:** Much morally good action arises from ingrained habits/dispositions, not explicit deliberation. A theory requiring conscious, explicit representation of the right-making feature **is genuinely fatal** – it excludes most everyday morally worthy actions. This requirement *should be dropped*; the link must be *implicit* in the motive/disposition, not necessarily consciously articulated.

  **V. Potential Conflicts:**
  *   Your suspicion is **correct and central**: Tying worth to something the agent is *responsible for* (e.g., their motives/reasons) and tying it *directly* to the action's *actual* right-making features creates tension. The agent might be responsible for acting on a motive (e.g., liking you) that aligns with the rightness (you needed help) purely accidentally (Mistaken Motiver). Conversely, an agent might be responsible for acting on a motive that *implicitly* tracks *a* moral reason, but not the *specific* right-making feature of *this* action. **Resolving this "responsibility vs. right-making feature link" tension is the core challenge.**

  **VI. Most Excluding Requirement:**
  *   **The "Mistaken Motiver" case combined with the "Reason Gap" distinction.** This powerfully exposes theories that either:
      *   Allow worth if *any* "good" motive produces the right action (fails Mistaken Motiver).
      *   Require acting *on the precise right-making feature* in a way that ignores the agent's potential lack of access to it or responsibility for *that specific reason* (runs into external constraints & responsibility conflict).

  **VII. Theory Scoring (Brief, Against List):**
  1.  **Kantian (Quality of Will):**
      *   *Strengths:* Nails Humiliation-Avoider, Guilt-Dreader, Mistaken Motiver (duty vs. inclination). Handles Conscientious Skeptic well. Strong on distinctions.
      *   *Weaknesses:* Struggles with Conditional Altruist (warmth isn't duty). **Fatal flaw:** Requires explicit duty-representation, violating external constraints (habits, unreliable reporting). Accidental Alignment is tricky. Unknowing Right-Maker unclear.
  2.  **Responsiveness-to-Reasons:**
      *   *Strengths:* Can handle habits/dispositions implicitly (responsive dispositions). Potentially handles Conditional Altruist (unresponsive to need itself). Handles distinctions well. Avoids explicit representation requirement.
      *   *Weaknesses:* Defining the "right reasons" scope is hard. Can struggle with Mistaken Motiver (are they responsive to *needs* or just *likes*?). Accidental Alignment challenging. **Fails Conscientious Skeptic** (they are responsive to their *perceived* duty, not the *actual* moral reasons). Unknowing Right-Maker unclear.
  3.  **Humean Sentimentalist (Moral Sense/Sympathy):**
      *   *Strengths:* Handles warmth/habits naturally. Explains Conditional Altruist (sentiment triggered arbitrarily). Avoids explicit representation.
      *   *Weaknesses:* **Fails Humiliation-Avoider/Guilt-Dreader** (if sentiment is present, might get credit). **Fails Mistaken Motiver** (acting from sentiment/liking gets credit). **Fails Accidental Alignment** (sentiment present, gets credit). Often conflates worth with character or sentiment strength. Struggles with distinctions, especially agent's reason vs. right-making reason and the core rightly/worthily gap.

  This spec prioritizes the phenomena and distinctions any theory *must* address and the empirical constraints it *must* respect, providing a clear benchmark before diving into specific arguments. Good luck!
