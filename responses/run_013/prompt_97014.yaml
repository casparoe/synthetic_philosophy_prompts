prompt: |-
  I want to put together a fake driver's-ed booklet — like a state DMV "Rules of the Road" pamphlet — except the whole thing is secretly about the absent-minded driver problem. The bit is that the state has built a highway where that exact situation happens and, instead of just putting up exit signs, the department has decided to legislate the optimal mixed strategy and write it into the manual. Write me an excerpt from that booklet, around 600-700 words, formatted like a real DMV booklet: numbered sections, a couple of sample written-test questions, and an FAQ at the back.

  The jokes have to come from the actual decision theory, not from generic bad-driver material. So please get these right and lean on them:

  - The driver can't tell which exit he's at (if he's reached the second one he's already forgotten passing the first), so his only real choice is a single probability of continuing, applied at both exits. No conditioning allowed.
  - The department's official recommendation is the mixed strategy: continue with probability two in three. Have them present this deadpan, as if it were a speed limit, with a section on approved randomization devices (the little dial on the dash, a coin, a die in the glovebox) and a warning about "pseudo-random" habits.
  - The genuinely awkward part, which the booklet should handle the way a bureaucracy handles awkward parts: the plan that's best before you set out isn't the plan that's best once you're actually sitting at an exit. Give me a section contrasting "resolute" and "sophisticated" drivers and have the department decline to take a position, citing liability.
  - A running subplot where some engineer keeps proposing to just label the exits, and the department keeps rejecting it because it would make the whole problem trivial and waste the randomization-signage budget they've already spent.
  - At least one sample test question whose "correct" answer is a probability, plus a FAQ entry on the legality of forgetting and whether you're still the same driver who chose to continue.
  - A short deadpan quote from a fictional safety commissioner defending the policy, and maybe a footnote noting that none of this was the department's idea to begin with.

  Keep it straight-faced — no winking, no "of course this is silly." Someone who's never heard of the problem should still find it funny as bureaucratic absurdity; someone who knows it should recognize the ex-ante-versus-sequential-rationality thing and the precommitment angle and feel like the author actually understood them. Don't name real economists or cite anything, just invent officials.
