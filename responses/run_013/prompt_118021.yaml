answer: |-
  ### Bottom Line (Verdict: ~150 words)  
  Nietzsche would condemn the digital restitution program as **antiquarian pathology masquerading as progress**. He’d see it as the museum entombing artifacts in digital formaldehyde while weaponizing copyright to assert colonial continuity under new guises. The scans are dead data, severed from the living culture that animated them, and the copyright clause crystallizes Western ownership of others’ heritage. He’d dismiss “access” as a sentimental illusion: a JPEG cannot be fed or danced with because it lacks *life*, reducing sacred objects to sterile spectacle. For Nietzsche, this program isn’t restitution—it’s the *ultimate antiquarian victory*, preserving the past as a controlled, frozen commodity to soothe guilty consciences while obstructing the present’s power to create or destroy.  

  ---

  ### The Three Lenses (Analysis: ~500 words)  
  **Monumental History** would praise the program selectively. It sees the past as a quarry of heroic examples to inspire present action. Scans of "great" artifacts could be wielded as templates for new creation—*if* freed from restrictions. But the "no commercial use" clause sabotages this: it prevents living artists from monetizing ancestral forms, neutering the monumental impulse. Nietzsche’s monumentalist might endorse the *idea* of digitizing glories for emulation but would rage against the museum’s legal shackles, calling it a betrayal of the past’s usefulness.  

  **Antiquarian History** would weep with joy. This is preservation fetishized: objects saved from decay, friction, or context, enshrined in eternal digital amber. The museum’s stance—"careful stewardship" via copyright—is pure antiquarianism: valuing the artifact’s *physical survival* over its cultural meaning. The scans become relics of relics, divorced from function and frozen in a foreign archive. For the antiquarian, the community’s anger over JPEGs replacing objects is irrational; the point is preservation, not use. Nietzsche despised this: it suffocates the present under "the sheer weight of the past."  

  **Critical History** would tear the program apart. It demands judging the past to break its chains. The scans are a new chain: digital colonialism, where the museum still controls access and profits while laundering its colonial theft through "openness." Critical history would side with communities demanding takedowns—destruction of digital ghosts is necessary to kill toxic history. But Nietzsche’s critical historian would go further: demand physical destruction or return of artifacts to force a rupture, not just digital deletions.  

  **Nietzsche’s Forced Choice**: He’d side with **Critical History**—but only if it escalates beyond scans. Copyright claims on ancestral objects would enrage him as a slave morality innovation. He’d endorse smashing both physical and digital idols to clear space for new creation. Yet he’d distrust any "community consensus"; for him, critical energy must serve *life-affirming creation*, not just grievance.  

  ---

  ### Where He’d Annoy Both Sides (~300 words)  
  Nietzsche would be ejected by lunchtime. To the **museum**: "Your ‘generosity’ is cowardice. You hoard corpses while parading their shadows. Copyright? A priestly trick to own what never was yours. Burn the originals if you lack the courage to return them—this digital mausoleum is vampiric." To **activists celebrating scans**: "You mistake a screen for a home. Downloading your grandfather’s mask? You’ve traded vitality for convenience. If it cannot be fed, it is dead—and you are paying the undertakers in gratitude." To **takedown advocates**: "Demanding deletion of images reeks of the same sickness as the museum: you fear the object’s power. True strength would laugh at scans or seize them without permission."  

  His nuclear take: **The object itself is already dead in the museum**. Whether in a vault or a JPEG, it’s a corpse. The fight over digital copies distracts from the real crime: the initial theft that severed the object from its life-context. Restitution debates are necrophilic—both sides worship relics. *Create new gods instead*.  

  ---

  ### Where the Framework Breaks (~250 words)  
  Nietzsche’s triad struggles with **digital dualism**. A scan isn’t purely monumental (it’s not *used*), antiquarian (it’s hyper-accessible, not buried), or critical (it’s a new entity to judge). It exists simultaneously as data, art, and legal property—a fluidity Nietzsche’s 19th-century categories can’t capture. **Copyright** is the true rupture: a modern power mechanism that weaponizes "creation" to extend control. Nietzsche anticipated monopolies of knowledge but not algorithmic enclosures.  

  **Consumer genealogy** is worse: it’s **monumental kitsch**. People don’t emulate ancestors; they consume DNA percentages as identity tokens. Nietzsche would scorn this as decadent antiquarianism—hoarding bloodline trivia to avoid self-creation. Learning you’re "3% Viking" is the opposite of monumental history: it reduces heroism to branding. Building a tree for a despised ancestor? *Critical history* devolved into family therapy—judging the past to absolve the present, not to forge it. Both cases reveal his framework’s limits: it can’t grapple with **identity as consumer product** or **data as capital**.  

  ---

  ### My Bets (~150 words)  
  Put money on:  
  1. **Nietzsche savaging copyright** as a slave-morality tool. Zero chance he’d tolerate corporations "owning" scans of tribal artifacts.  
  2. **Him dismissing scans as dead data**. His core critique—life vs. preservation—fits perfectly.  
  3. **Him mocking genealogy’s monumental emptiness**. DNA kits are self-mythology for the weak.  

  Fan fiction:  
  - Him endorsing physical destruction. He advocated "forgetting," not ritualized smashing.  
  - Taking activist takedown demands seriously. He’d likely see them as pious, not critical.  
  - The "create new gods" rant. It’s *plausible* but extrapolates his Ubermensch ideals into a soundbite.  

  Biggest certainty: **he’d despise the museum’s program as antiquarian poison**. The rest is tactical fury.
