answer: |-
  Below is a comprehensive exam package tailored to your specifications, designed to test students' ability to critically synthesize objections to surrogacy with regulatory logic rather than recite doctrine.  

  ---

  ### **Exam Question**  
  **Jurisdiction X enacts the Surrogacy (Prohibition and Recognition) Act with three provisions:**  
  > *(1) It is a criminal offence to enter into, arrange, or facilitate any surrogacy arrangement, whether performed domestically or abroad.*  
  > *(2) No parent-child relationship resulting from such an arrangement shall be legally registered, even if validly established in the jurisdiction where the surrogacy occurred.*  
  > *(3) Notwithstanding (2), a court may register the relationship if satisfied the child would otherwise have no legally recognized parent, or if registration is demonstrably in the child’s best interests.*  

  **Critically assess whether these provisions:**  
  (a) Coherently reflect a single ethical objection to surrogacy;  
  (b) Can withstand the comparative observation that Jurisdiction X permits compensated (and sometimes anonymous) oocyte donation.  
  *Defend a verdict on whether the Act’s design is ethically tenable, grounding your analysis in the relationship between its provisions and the core objections to surrogacy discussed in this course.*  

  *(25 marks; 90-minute closed-book paper)*  

  ---

  ### **Model Answer (800 words)**  
  Jurisdiction X’s Act attempts to reconcile ethical objections to surrogacy with practical obligations toward children, but its provisions pull in contradictory directions. I argue that the Act lacks a unified ethical foundation, as its criminal prohibition, non-recognition rule, and best-interest exception each presuppose distinct—and incompatible—views of surrogacy’s wrongs.  

  Provision (1) criminalizes surrogacy arrangements universally, implicitly endorsing the *commodification* and *exploitation* objections. By punishing facilitation regardless of location, it treats surrogacy as inherently degrading, akin to prohibited markets in organs. The expressive function here is clear: surrogacy commodifies women’s bodies and exploits socioeconomic vulnerability, making it morally impermissible. However, this absolutism ignores whether consent could ever be "undue" in regulated contexts—a tension Provision (1) cannot resolve.  

  Provision (2) extends this logic by refusing legal recognition to parent-child relationships from surrogacy. Crucially, this does *not* merely reiterate Provision (1)’s criminalization. Where (1) targets acts, (2) targets *status*, invoking the "gift relationship" objection: it implies that parental bonds cannot be manufactured by contract, as true kinship arises from non-commercial, "natural" ties. This is distinct from commodification—one could oppose surrogacy-as-contract while accepting non-commercial arrangements, yet (2) rejects *all* such relationships. This overreach exposes a flaw: if commodification is the core wrong, altruistic surrogacy should be exempt, but (2) denies this.  

  Provision (3) then destabilizes (1) and (2). By permitting registration to prevent statelessness or serve the child’s interests, it concedes that the child’s concrete needs override the state’s symbolic rejection of surrogacy. This draws on the "relocation critique": banning surrogacy doesn’t eliminate it but exports risks abroad. Yet (3) implicitly undermines (2)’s rationale. If surrogacy truly corrupts parenthood, registering the relationship legitimizes that corruption; if the child’s welfare justifies recognition, the "gift" objection collapses. Provision (3) thus acts as a pragmatic release valve, revealing that the state prioritizes avoiding administrative harm over moral consistency.  

  The Act’s incoherence sharpens when contrasted with Jurisdiction X’s tolerance for compensated oocyte donation. Permitting payment for gametes while criminalizing surrogacy suggests two contradictory principles: that reproductive *material* can be commodified, but reproductive *labor* cannot. The state might defend this by arguing gestation entails unique physical sacrifice, making exploitation more acute. Yet this distinction crumbles under the "defective consent" objection—if poverty unduly induces surrogates, it equally pressures egg donors. Worse, anonymous donation severs genetic origins, directly conflicting with the "child’s interest in knowing origins" invoked in surrogacy debates. The asymmetry implies the Act targets surrogacy not for consistent ethical reasons, but because it disrupts traditional notions of motherhood by splitting biological roles.  

  Does the Act hold together? Only if we accept that its core objection is *symbolic*: surrogacy is denounced as a category, but concessions are made to mitigate fallout. Provision (1) broadcasts moral condemnation; (2) reinforces it by nullifying legal effects; (3) cleans up collateral damage. Yet this "denunciation with cleanup" approach fails ethically. It refuses to engage whether surrogacy’s harms stem from poor regulation (e.g., exploitative contracts) rather than the practice itself. By allowing recognition in "crisis" cases (via 3), it admits the child’s existence demands a response—but if children deserve protection, why not regulate surrogacy to prevent statelessness *proactively*? The Act thus sacrifices both moral clarity and child welfare to punitive symbolism.  

  Ultimately, the Act is untenable. Its provisions rely on disjointed objections—(1) on commodification, (2) on the sanctity of parenthood, (3) on child welfare—without reconciling them. Permitting paid gamete donation while criminalizing gestation further exposes arbitrary moral lines. A coherent regime would either consistently prohibit all commodified reproduction (banning paid donation too) or regulate surrogacy to address exploitation while securing children’s rights. Jurisdiction X’s half-measures satisfy no one: they punish participants without protecting children, and denounce surrogacy while outsourcing its risks.  

  ---

  ### **Marking Scheme (25 marks total)**  
  1. **Identifies Provision (1)’s grounding in commodification/exploitation objections** (4 marks).  
     *Common error:* Vaguely references "ethical concerns" without specifying how criminalization expresses these.  
     
  2. **Explains how Provision (2) differs from (1) by invoking non-commodification/gift-based objections to parenthood** (4 marks).  
     *Common error:* Asserts (2) is redundant after (1), missing its expressive/status-based role.  
     
  3. **Analyzes Provision (3) as a pragmatic concession that undermines (2)’s logic but avoids child abandonment** (4 marks).  
     *Common error:* Labels (3) as "hypocritical" without addressing its child-welfare necessity.  
     
  4. **Critiques the oocyte donation comparison: highlights inconsistency in permitting commodified gametes but not gestation** (5 marks).  
     *Common error:* Claims symmetry without addressing anonymity or labor-vs-material distinctions.  
     
  5. **Assesses overall coherence: verdict on whether provisions share a unified ethical foundation** (4 marks).  
     *Common error:* Declares incoherence without engaging symbolic denunciation as a possible unifying aim.  
     
  6. **Defended verdict: Clear position on tenability, supported by provision/objection interplay** (4 marks).  
     *Common error:* Substitutes personal opinion for analysis of regulatory logic.  

  **A vs. B Differentiation:**  
  An A answer **traces how Provision (3) exposes the state’s prioritization of crisis management over moral consistency**, revealing the ban’s symbolic core. A B answer identifies contradictions but misses how (3) functions as a systemic pressure valve.  

  ---

  ### **Why This Meets Your Needs**  
  1. **Hypothetical statute-focused** – No prior cases/readings required; analysis turns solely on mapping objections to your provisions.  
  2. **Forces synthesis** – Students cannot list objections mechanically; they must ask: *Which objection justifies criminalization but not non-recognition? Why permit donation but not surrogacy?*  
  3. **Tests concrete misalignment** – The sister’s experience (child exists → state must respond) is mirrored in Provision (3), making abstract objections tangible.  
  4. **Closed-book compliant** – Model answer argues concepts (e.g., "expressive function," "relocation critique") without citing scholars.  
  5. **Your crux addressed** – The marking scheme’s top marks hinge on dissecting provision interactions (e.g., "Does (2) do work (1) doesn’t?" = Point 2; "Does (3) collapse the ban?" = Point 3).  

  This question mirrors your journey: moving from "tidy lists" to grappling with how objections fracture when confronted with real children and comparative inconsistencies. The model answer’s conclusion—that the ban pursues symbolism over ethics—directly echoes your insight that objections don’t align with regulatory responses.
