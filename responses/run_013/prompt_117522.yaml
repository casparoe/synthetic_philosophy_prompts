answer: |-
  Below is a diagnostic decision tree for analyzing moral compromise in value pluralism, designed for your graduate seminar. The tree begins from the premise that compromise is sometimes possible and worthwhile, and ends at named positions on the nature and justification of compromise. Each branch tests key philosophical questions without revealing the outcome. The cases (climate negotiator, university donor, legislator vote-trade) serve as illustrative tests. Unoccupied paths and inseparable positions are flagged at the end.

  ---

  ### **Decision Tree: Moral Compromise in Value Pluralism**  
  **Start**: Compromise is sometimes possible and worthwhile.  

  #### **1. Is the core value of the compromise found in the joint outcome or the relationship?**  
  - **Joint outcome** → Go to 2  
    *(e.g., Climate negotiator: Weakening a target to secure a treaty's survival focuses on collective environmental impact)*  
  - **Relationship** → Go to 5  
    *(e.g., University donor: Accepting funds to preserve donor relations prioritizes social bonds over principles)*  

  #### **2. Are the parties' values commensurable (mutually measurable for trade-offs)?**  
  - **Yes** → **Leaf: Integrative or gains-from-trade bargaining**  
    *Compromise is a mutually beneficial transaction; values are fungible (e.g., trading economic costs for emissions cuts).*  
  - **No** → Go to 3  
    *(e.g., Legislator: Trading a vote on abortion (sacred value) for infrastructure (secular value) treats values as incommensurable)*  

  #### **3. Does agreement require a party to act wrongly (not merely forgo a good)?**  
  - **Yes** → **Leaf: Dirty hands**  
    *Compromise demands morally tainted action for greater good; guilt is unavoidable (e.g., legislator voting for a "wrong" bill to pass an "urgent" one).*  
  - **No** → Go to 4  
    *(e.g., Climate negotiator: Weakening targets is suboptimal but not inherently wrongful)*  

  #### **4. Is there a non-negotiable floor (minimal standard) below which compromise is impermissible?**  
  - **Yes** → **Leaf: Unconscionable-floor view**  
    *Compromise is justified only if it upholds core minima (e.g., climate deal must avoid >2°C warming).*  
  - **No** → **Leaf: Bare modus vivendi**  
    *Compromise is a pragmatic truce without deeper moral weight; stability is primary (e.g., ad-hoc climate targets to avoid deadlock).*  

  #### **5. Does the compromise preserve all parties' integrity (no betrayal of core identity)?**  
  - **Yes** → **Leaf: Mutual-respect compromise**  
    *Compromise expresses reciprocal recognition; values remain intact (e.g., peace treaties honoring both sides' dignity).*  
  - **No** → Go to 6  
    *(e.g., University donor: Disinviting a speaker may violate academic integrity)*  

  #### **6. Is the compromise still adopted despite integrity loss?**  
  - **Yes** → **Leaf: Tragic compromise that leaves a remainder**  
    *Compromise is necessary but leaves moral residue (e.g., university sacrificing free speech for funds, mourning the loss).*  
  - **No** → **Leaf: Integrity-based refusal**  
    *Compromise is rejected to preserve self-respect (e.g., university rejecting donor demands as corrosive to its mission).*  

  ---

  ### **Case Applications**  
  - **Climate negotiator** (weakening targets):  
    - *Path:* 1 (Outcome) → 2 (No) → 3 (No) → 4 (Yes/No) → **Unconscionable-floor** or **Bare modus vivendi**.  
  - **University donor** (disinviting speaker):  
    - *Path A (Relationship):* 1 → 5 (No) → 6 (Yes) → **Tragic compromise**.  
    - *Path B (Outcome):* 1 → 2 (No) → 3 (Yes) → **Dirty hands**.  
  - **Legislator** (trading votes):  
    - *Path:* 1 (Outcome) → 2 (No) → 3 (Yes) → **Dirty hands**.  

  ---

  ### **Limitations & Diagnostics**  
  #### **Inseparable Positions**  
  - **Bare modus vivendi** and **Unconscionable-floor view** cannot be distinguished *solely* by the "relationship vs. outcome" branch (Step 1). Both are outcome-focused but diverge on floors (Step 4).  
    - *Diagnosis:* These positions share a structural foundation (pragmatic outcomes) but split on moral constraints.  

  #### **Unoccupied Paths**  
  1. **Outcome → Commensurable → Requires acting wrongly?**  
     - *Path:* 1A → 2A → (No branch for "acting wrongly" here).  
     - *Diagnosis:* **Incoherent view.** Gains-from-trade assumes values are fungible, so "acting wrongly" is nonsensical; trade-offs lack inherent wrongness.  

  2. **Relationship → Integrity preserved? → No → Compromise rejected?**  
     - *Path:* 1B → 5B → 6B → **Integrity-based refusal** (occupied).  
     - *Path gap:* Relationship → Integrity preserved? → No → (No branch for "floor" or "wrongness").  
     - *Diagnosis:* **Undefended view.** Relationship-focused theories rarely blend floors/wrongness with integrity; the tree reflects standard literature gaps.  

  3. **Outcome → Incommensurable → Not acting wrongly → (No tragic remainder)**  
     - *Path:* 1A → 2B → 3B → 4A/B → (**Unconscionable-floor** or **Bare modus vivendi**).  
     - *Missing:* A "tragic" outcome-based compromise (e.g., incommensurable loss without wrongdoing).  
     - *Diagnosis:* **Unattractive view.** Outcome-focused models treat compromise instrumentally; "tragic residue" is typically relational.  

  ---

  ### **Key Takeaways**  
  - The tree isolates how **value commensurability**, **wrongful action**, and **integrity** determine whether compromise is a negotiation (gains-from-trade), truce (modus vivendi), or tragedy (dirty hands/remainder).  
  - **Gaps** reveal philosophical blind spots: e.g., outcome-based compromises rarely admit "tragedy," while relationship-based models neglect "floors."  
  - Use cases to test if positions hold under pressure (e.g., Can "dirty hands" ever be mutual-respect? Does "modus vivendi" collapse without a floor?).  

  This handout enables participants to diagnose their own stance and debate boundary cases (e.g., Is the university’s compromise tragic or merely dirty?). Ideal for small-group analysis!
