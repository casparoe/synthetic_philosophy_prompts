prompt: |-
  For a graduate seminar on moral formation I am planning, a colleague has proposed a unit that pairs selections from Plutarch's paired Lives with a range of saints' lives, on the premise that the two are settings of a single pedagogical device: an edifying narrative that puts an admirable figure before a reader and lets admiration do the moral work. She distinguishes two settings. In the first, which she calls lateral exemplarity, the figure is close enough to the reader that the reader's own virtue could plausibly approach his, and Plutarch is her model. In the second, which she calls transcendent exemplarity, the figure stands above the reader, who can only revere rather than emulate, and the hagiographers are her models. She adds that in both genres fidelity to fact is subordinate to formative use, so the difference between them is one of altitude rather than of kind, and she wants the seminar to consider whether the second setting simply outperforms the first. My problem is that this looks exactly backwards. If the mechanism is one and the same, the loftier exemplar ought to be the more effective one, and the saints have everything on their side: virtue beyond dispute, suffering borne without complaint, and a reward promised to anyone who follows. Yet readers of the saints' lives seem to come away with devotion rather than emulation, while readers of Plutarch have claimed for centuries to have been made better by him. What am I failing to see? Is this a matter of degree, in which case my colleague's single-device picture stands and I need a better account of why the loftier setting fails to move people? Or is it a difference in kind, in which case I want to know precisely where the picture breaks, what each genre asks of its reader that the other does not, and whether altitude is even the right axis along which to place them? Please answer in American English.
reasoning: |-
  Okay, the user is planning a graduate seminar on moral formation and is grappling with their colleague's framework about exemplarity in Plutarch's Lives versus saints' lives. Let me start by unpacking their main concern. They think their colleague has it backwards: if both use admiration for moral formation, then the loftier saints should be more effective, yet historically, Plutarch seems to inspire emulation while saints inspire devotion. Why?

  First, I need to understand the colleague's model. She distinguishes lateral (Plutarch) and transcendent (saints) exemplarity. The user questions why the "higher" exemplars don't lead to more emulation. The key here might be psychological distance. Social psychology talks about how proximity affects motivation. If a model seems too distant, people might admire but not feel they can achieve similar results. Saints, with their miracles and divine grace, are in a different category. They're not just morally superior; they're in a realm of supernatural virtue. That creates a gap where emulation feels impossible, leading to reverence instead.

  Then there's the purpose of each genre. Plutarch aims to show virtue in action within human constraints. His biographies include flaws and practical wisdom, making them relatable guides. Saints' lives, however, are designed to inspire worship and reinforce faith. Their virtues are often otherworldly—miracles, martyrdom without pain—which aren't meant to be copied. The pedagogical goals differ: one is ethical improvement through feasible steps, the other is spiritual devotion.

  The user also mentions fidelity to facts being subordinate in both. But the nature of the idealization differs. Plutarch selects and shapes real traits to highlight practicable virtues. Hagiography amplifies virtues to supernatural levels, creating symbolic ideals. This affects how readers engage. Realistic models boost self-efficacy; symbolic ones trigger awe but not practical action.

  The colleague's axis of altitude might be misleading. Instead, the dimensions could be accessibility and kind of virtue. Saints embody virtues dependent on divine grace, making human effort seem secondary. Plutarch's figures succeed through discernment and effort, which readers can mirror. So the difference isn't just height but the nature of the virtue and the reader's role.

  The user needs to refine the framework. They should consider if altitude is the right measure or if it's about the perceived possibility of emulation. Also, examining what each genre asks of readers—practical application vs. contemplative devotion. The seminar could explore how each genre's context (philosophical vs. religious) shapes its approach. Maybe comparing how readers internalize lessons: behavioral change from Plutarch vs. spiritual affirmation from saints.
answer: |-
  You're absolutely right to question this – your instincts are sharp. Your colleague's "altitude" framework *does* seem counter-intuitive when faced with the historical evidence of Plutarch's tangible influence on emulation versus the often devotional response to hagiography. The key isn't that your colleague is entirely wrong, but that the "same mechanism, different altitude" model **oversimplifies the core psychological mechanism and the distinct purposes of each genre.** Here's why the loftier saint *doesn't* automatically outperform the relatable Plutarchian hero for moral *formation* (as distinct from inspiration or devotion):

  1.  **The "Plausibility of Emulation" Factor (Self-Efficacy is Crucial):**
      *   **Plutarch (Lateral):** His figures (even greats like Alexander or Pericles) are presented *within the human realm*. They grapple with recognizable passions, make mistakes (often highlighted!), exercise practical wisdom (phronesis), and succeed or fail based on discernible human qualities and circumstances. The reader thinks, "This is a heightened version of *my* world. I understand his choices. I see the *steps* he took. With effort, judgment, and perhaps some luck, I could cultivate similar virtues *in my own sphere*." This fosters **self-efficacy** – the belief that one *can* actually do the thing. Admiration translates into "I could learn from that approach."
      *   **Saints (Transcendent):** The saint's virtue is often depicted as **supernatural in origin or sustenance.** Their fortitude in suffering comes from divine grace, their resistance to temptation is miraculous, their love is agape poured out by God. Their "reward" is eternal and transcendent. The implicit message (even if unintended) is: "This level of virtue is only possible through divine intervention, not merely human striving." The reader thinks, "This is awe-inspiring, but fundamentally *beyond* me. Only God can make someone like this." Admiration translates into "I revere this gift of God," not "I can realistically practice this."

  2.  **The Nature of the Virtue Displayed:**
      *   **Plutarch:** Focuses on **practicable civic and personal virtues:** courage (in battle/politics), justice, prudence, temperance, magnanimity, leadership, friendship, dealing with fortune/misfortune. These are presented as skills developed through reason, habituation, and experience within complex social and political realities.
      *   **Saints:** Often emphasize **virtues demanding supernatural endurance or grace:** extreme asceticism, miraculous power, ecstatic union, martyrdom without faltering, perfect chastity, unwavering faith amidst torture. While inspiring *ideals* of faith, hope, and love, the *specific actions* (enduring being boiled in oil, levitating during prayer, living on the Eucharist alone) are framed as *gifts* or signs of divine favor, not blueprints for daily moral effort. The virtues are often less about navigating complex human politics and more about transcending the human condition altogether.

  3.  **Genre Purpose & Reader Engagement:**
      *   **Plutarch:** Explicitly **pedagogical for moral agency.** He states his aim is to help readers *train their own character* by observing the choices of others. The reader is invited to *judge*, *compare*, *analyze*, and *apply* lessons to their own lives and decisions. It's interactive and demands critical engagement with human psychology and consequence.
      *   **Hagiography:** Primarily **doxological and devotional.** Its core purpose is to glorify God through the saint, to strengthen the faith of the community, to provide intercessors, and to define orthodox belief/piety. While moral instruction is present ("be generous like St. X"), the overwhelming emphasis is on *wonder* and *mystery* – the saint as a vessel of the divine. The reader is invited to *venerate*, *pray to*, *seek intercession from*, and find *comfort* or *inspiration* in the saint's story. Engagement is often more receptive and worshipful than analytical and applicative.

  4.  **"Fidelity to Fact" – Different Kinds of Idealization:**
      *   While both shape narrative for effect, the *nature* of the idealization differs.
      *   **Plutarch:** Selects, arranges, and interprets historical events and character traits to illuminate *human* strengths, flaws, and the consequences of choices. The idealization serves to clarify recognizable psychological and ethical dynamics. It's heightening the *human* drama.
      *   **Hagiography:** Employs **topoi** (standard literary motifs) and often incorporates overtly miraculous or supernatural events to demonstrate the saint's *otherness* and divine connection. The idealization serves to separate the saint from ordinary humanity and anchor them in the celestial realm. It's heightening the *transcendent* aspect.

  **So, is it Difference in Kind or Degree? Where Does Altitude Fit?**

  *   **Primarily Difference in Kind:** The core mechanisms diverge significantly.
      *   **Plutarch/Lateral Exemplarity:** **Admiration + Plausible Self-Efficacy + Practical Virtue Analysis = Emulation.** The engine is relatable human agency within comprehensible challenges. Altitude is moderate; the figures are *exceptional humans*, not superhuman.
      *   **Saints/Transcendent Exemplarity:** **Admiration + Awe + Perception of Divine Causality = Veneration/Devotion.** The engine is wonder at the supernatural and divine action. The perceived altitude is so vast it creates a qualitative gap, shifting the response from "I could do that" to "Only God can do that; I worship Him through this saint."
  *   **Altitude is a Symptom, Not the Cause:** The extreme "altitude" of the saint *is* a key feature, but it arises *because* of the genre's focus on the supernatural and divine grace as the source of virtue. This altitude *creates* the plausibility gap that inhibits emulation in favor of devotion. Plutarch keeps his figures high enough to admire, but firmly within the human stratosphere where self-efficacy can operate.

  **What Each Genre Asks of the Reader:**

  *   **Plutarch:** Asks the reader to be an **active moral judge and apprentice.** Engage critically, compare lives, analyze cause and effect, extract practical wisdom applicable to *your* role as citizen, leader, friend, or individual navigating fortune. *Internalize principles for action.*
  *   **Hagiography:** Asks the reader to be a **faithful witness and supplicant.** Receive the story as a testament to God's power and love, strengthen your own faith, find inspiration in ultimate ideals, seek the saint's intercession, participate in communal veneration. *Strengthen belief and devotion.*

  **Conclusion & Seminar Suggestion:**

  Your colleague identifies a real phenomenon (different "altitudes" in exemplars) but misdiagnoses the core mechanism. It's not one device scaled up. Plutarch leverages **admiration grounded in plausible human agency** to foster emulation through self-efficacy. Hagiography leverages **awe grounded in the perception of divine action** to foster devotion and strengthen faith. The loftier setting "fails" to move people *to emulation* precisely because its loftiness is built on foundations (supernatural virtue, divine grace) that implicitly undermine the reader's belief in their *own* capacity to achieve similar results through moral effort alone.

  **For the Seminar:** Frame the unit around **testing the hypothesis.** Don't start with "lateral vs. transcendent exemplarity." Start with the core question: **"How do different narratives of admirable lives actually function to shape the moral character or spiritual disposition of their readers?"**

  *   Analyze specific Plutarch pairs: *How* does he present virtue and vice? What makes figures like Solon, Themistocles, or even flawed ones like Coriolanus feel *emulable*? What lessons are readers meant to extract for *their own* lives?
  *   Analyze specific Saints' Lives: What virtues are highlighted? *How* is their source depicted (human effort vs. divine grace)? What is the expected *response* from the reader (change behavior? pray more? venerate relics? endure suffering with faith?)? How do the miracles and topoi function?
  *   *Then* introduce your colleague's framework. Does it hold up? Where does it shine? Where does it break? Is "altitude" the best way to describe the difference, or are factors like "source of virtue" (human reason/effort vs. divine grace) or "implied reader action" (emulate vs. venerate) more fundamental?
  *   Explore the historical reception: *Why* did Plutarch become a handbook for statesmen for centuries? *Why* do saints' lives primarily fuel devotion and communal identity rather than detailed moral self-help?

  By focusing on the *mechanism of influence* and the *reader's expected response*, you'll get a much richer discussion than simply comparing altitudes. You'll uncover why Plutarch can make readers feel they *can* and *should* strive to be better, while saints' lives often make readers feel they *should* worship the power that made such a being possible. Both are formative, but they form different things, in different ways.
