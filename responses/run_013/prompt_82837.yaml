answer: |-
  Here’s a ranked agenda for a postdoc focusing on post-Frankfurt free will, prioritizing live questions by significance, tractability, and leverage potential. The ranking balances philosophical depth, actionability, and your provocation about desire-manipulation backups.

  ---

  ### **Ranked Research Agenda: Post-Frankfurt Free Will**
  1.  **The Source Question & Non-Causal Manipulation**  
      **Why #1?** Frankfurt killed PAP, but *responsibility* demands a *non-accidental connection* between the agent and their action. If Jones is responsible in Frankfurt cases, it’s because his decision *truly came from him*, not the counterfactual intervener. Your desire-manipulation variant **explodes this question**:  
      - *Desire-Manipulation Frankfurt (DMF)*: Black monitors Jones. If Jones shows any inclination *not* to kill Smith, Black manipulates Jones’s desires/values to ensure he *wants* to kill Smith and does so "freely." Jones shows no reluctance, Black does nothing, Jones kills Smith for his own (unmanipulated) reasons.  
      - **Challenge**: In DMF, Jones acts "for his own reasons" *only because* his desires *weren’t* manipulated. But his responsibility seems threatened because Black could have *made* those reasons his own. This reveals the **real action**: responsibility requires being the *ultimate source* of one’s will, not just acting uncoerced.  
      **Tractability**: Armchair-friendly (conceptual analysis of "sourcehood," manipulation arguments), but requires engaging metaphysics (causation, explanation). Moves forward by testing theories (e.g., reasons-responsiveness, mesh theories) against DMF and refining "source" criteria.  
      **Upstream of**: All other questions; defines the core condition for responsibility.

  2.  **The Actual Sequence & Moral Competence**  
      **Why #2?** Even if sourcehood is secure, *what* in the actual sequence of deliberation/action grounds responsibility? DMF intensifies this: Jones’s competence (understanding reasons, moral norms) seems intact, but its *history* is fragile. Key questions:  
      - What cognitive/volitional capacities must be intact *in the actual act*? (e.g., reasons-responsiveness, evaluative control).  
      - How do these capacities relate to the agent’s history? (Is *how* they acquired competence relevant? DMF suggests yes).  
      **Tractability**: Armchair-tractable (analyzing "competence," "control"). Moves forward by integrating moral psychology and epistemology (e.g., what "ownership" of reasons entails).  
      **Downstream of Source, Upstream of**: History-Sensitivity, Mechanism Types.

  3.  **History-Sensitivity & Moral Luck**  
      **Why #3?** DMF makes history salient: Jones is responsible *only* because Black *didn’t* manipulate him. But *why* does the counterfactual possibility of manipulation undermine responsibility if the actual sequence is identical? This links to:  
      - Moral Luck: Is responsibility luck-prone? If Jones escapes manipulation by luck, is he less responsible?  
      - Authenticity: Must reasons/values be "authentically" formed (e.g., not via bypassing agency, even counterfactually)?  
      **Tractability**: Requires grappling with luck and causation. Progress by developing criteria for "tainted histories" (e.g., Zimmerman, Fischer). DMF serves as a crucial test case.  
      **Downstream of Source/Actual Sequence.**

  4.  **Mechanism Types & Control**  
      **Why #4?** Frankfurt cases traditionally distinguish *types of control* (guidance vs. regulative). Your DMF variant challenges this:  
      - Is manipulation of *reasons/desires* fundamentally different from direct muscle-twitching? Both bypass agency, but desire-manipulation may preserve *apparent* guidance control.  
      - Does responsibility require control over the *formation* of desires, not just acting on them?  
      **Tractability**: Clarifying "levels of control" is armchair-viable. Moves forward by taxonomy of mechanisms (e.g., direct force vs. preference-engineering) and their impact on different control theories.  
      **Downstream of Actual Sequence.**

  5.  **Compatibilism’s Foundation: What Replaces PAP?**  
      **Why #5?** PAP’s demise forces compatibilists to specify their *positive* condition for responsibility. DMF pressures this:  
      - If compatibilism grounds responsibility in uncoerced, reasons-responsive action, does DMF show this is insufficient?  
      - Must compatibilists become "semi-historicist" (e.g., valuing unmanipulated histories)?  
      **Tractability**: Core compatibilist/incompatibilist debate. Armchair-refinement of conditions (e.g., Fischer/Ravizza vs. Smith). Progress by stress-testing theories against DMF.  
      **Downstream of Source/Actual Sequence.**

  6.  **The Flicker Defense & Alternative Possibilities Revisited**  
      **Why #6?** Some argue Frankfurt cases preserve "flickers" of alternatives (e.g., deciding *before* the intervener acts). DMF *weakens* this:  
      - In DMF, Jones might lack *any* robust alternative (even a flicker) if Black can preemptively alter desires.  
      - **Low Priority**: Mostly a rearguard action defending PAP; the field has moved on.  
      **Tractability**: Technical but largely settled. Dead end for a postdoc; focus on post-PAP questions.  
      **Downstream of everything; low yield.**

  ---

  ### **Why This Order?**
  - **Sourcehood is King**: DMF proves PAP was a distraction; the *real* battle is about uncontaminated sources of agency.
  - **DMF is the Litmus Test**: Any theory failing DMF (e.g., saying Jones is responsible) likely relies on discredited PAP-like intuitions or ignores history. Successfully handling DMF validates a theory’s depth.
  - **Tractability Balance**: Top questions are conceptual/philosophical psychology (armchair-viable), avoiding dead ends like flicker debates.
  - **Moves the Field**: Solving #1 (Source + DMF) would reshape the landscape, forcing incompatibilists to refine source arguments and compatibilists to confront history.

  ### **Dead Ends to Avoid**
  - **Flicker-of-Freedom Salvage**: Beating a dead horse; PAP is dead.
  - **Overly Fine-Grained Frankfurt Variants**: Unless they directly probe source/history (like DMF), they’re puzzles, not progress.
  - **Exclusive Focus on "Force" vs. "Manipulation"**: Superficial; DMF shows the core issue is *bypassing agency*, not mechanism type.

  ### **What Moves Items?**
  - **Up**: If DMF intuition (Jones *isn’t* responsible) gains traction, Source/History shoot to #1. If compatibilists convincingly answer DMF, #5 rises.
  - **Down**: If "actual sequence" theories robustly handle DMF (#2), history-sensitivity (#3) loses urgency. If sourcehood is deemed incoherent, #1 falls (but the field collapses).

  ### **Conclusion**
  Focus your postdoc on **Sourcehood Under Non-Causal Manipulation (DMF)**. It’s the nexus where Frankfurt’s legacy meets the unresolved core of responsibility: *How can an agent be the true author of their will in a world of potential hidden control?* Crack this, and you redefine the debate beyond PAP—exposing whether compatibilism can survive history or if source incompatibilism is the only game in town.
