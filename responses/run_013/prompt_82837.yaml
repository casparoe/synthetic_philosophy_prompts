  *scribbles mentally* Must emphasize that Source Incompatibilism is the elephant in the room. Frankfurt settled PAP but made source questions *more* urgent. And that desire-manipulation case they proposed? That's not just another puzzle - it's a litmus test for whether theories can handle covert control. If a theory fails there, it's probably PAP-dust in disguise. 

  *checks clock* Better flag that history-of-ideas work is the stealth priority. Contemporary papers keep reinventing wheels from the 1970s. And warn them away from "flicker of freedom" debates - that's a dead-end alleyway where careers go to die. 

  Most importantly: their desire-manipulation challenge needs center stage. If I were examining their thesis, I'd demand they develop that exact case. It bridges ethics, action theory, and metaphysics - perfect for high-impact work. Should stress that this isn't just "another Frankfurt variant" but a tool to expose whether responsibility theories have real explanatory depth. 

