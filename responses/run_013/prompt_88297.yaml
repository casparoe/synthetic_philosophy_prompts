answer: |-
  Here’s a decision tree handout tackling the separateness of persons, designed to unpack objections without relying on labels. Each node poses a concrete question, and leaves mark defended positions (✓) or unexplored/empty ones (✗).  

  ---

  ### **The Separateness of Persons: A Decision Tree**  
  **Starting Point:** *"You can’t just add up everyone’s good and bad because persons are separate."*  

  #### **1. Is "separateness" primarily about...**  
     - **A. What EXISTS?** (No collective "super-person" whose good justifies trade-offs)  
     - **B. What has VALUE?** (Each person’s good is a distinct locus of value; trading lives is like destroying art for net gain)  
     - **C. How we REASON?** (Agents must weight their own commitments; treating people as means is wrong)  

  ---

  #### **Branch A: What EXISTS?**  
     **→ Node A1: Does this imply boundaries *within* a person are illusory?**  
     - *Case: Discounting your future self’s pain (e.g., neglecting retirement savings).*  
       - **Yes** (No real boundary): *Leaf:* **Parfitian Reductionism** ✓ (Personal identity is less deep; discounting isn’t a separateness-of-persons error).  
       - **No** (Boundaries exist within persons too):  
         **→ Node A2: Is discounting your future pain *less wrong* than sacrificing others?**  
         - *Case: Choosing to endure future blindness vs. blinding someone else now for your benefit.*  
           - **Yes**: *Leaf:* **Temporal Neutrality Required** ✓ (Rawls, Nagel: Prudence ≠ morality; separateness blocks interpersonal aggregation only).  
           - **No**: *Leaf:* **Consistent Anti-Aggregation** ✗ (Unexplored: If time-slices are "separate," discounting is as wrong as sacrificing others).  

  ---

  #### **Branch B: What has VALUE?**  
     **→ Node B1: Can *any* aggregation of individual goods define the overall good?**  
     - *Case: The Utility Monster (one person gains huge utility from others’ suffering).*  
       - **Yes**: *Leaf:* **Classical Utilitarianism** ✓ (But violates separateness).  
       - **No**:  
         **→ Node B2: Is the problem *how* we aggregate (e.g., averaging vs. summing) or that we aggregate *at all*?**  
         - *Case: Repugnant Conclusion (a vast population with barely-worthwhile lives vs. a small happy one).*  
           - **Aggregation method flawed**: *Leaf:* **Average Utilitarianism** ✓ (Hurka).  
           - **Aggregation itself flawed**: *Leaf:* **Anti-Aggregationism** ✓ (Tännsjö, Nebel).  

  ---

  #### **Branch C: How we REASON?**  
     **→ Node C1: Must agents prioritize their own projects?**  
     - *Case: A surgeon who could save five patients by killing one healthy donor.*  
       - **Yes** (Sacrificing the donor treats them as a mere means): *Leaf:* **Agent-Relative Prerogatives** ✓ (Nagel, Scheffler).  
       - **No**:  
         **→ Node C2: Does separateness forbid *all* trade-offs, or only involuntary ones?**  
         - *Case: Two people each lose an eye vs. one person loses both eyes (same net harm).*  
           - **All trade-offs forbidden**: *Leaf:* **Side Constraints** ✓ (Nozick: Rights trump utility).  
           - **Voluntary trade-offs permitted**: *Leaf:* **Contractualism** ✓ (Scanlon: Justifiable only if no one could reasonably reject).  

  ---

  ### **Key Insights & Unexplored Nodes**  
  - **Temporal Parallel Sharpness**:  
    - If you answered **A1 "No" + A2 "Yes"**, separateness applies *only* interpersonally (✓ Rawls/Nagel).  
    - If **A2 "No"**, separateness demands radical temporal neutrality (✗ Incoherent? Demands equal concern for all time-slices of all persons).  
  - **Empty Leaves**:  
    - **Branch A "No + No"** (✗ Unexplored: Logically possible but no major defender).  
    - **Branch C "No + All trade-offs forbidden"** (✗ Incoherent: If no agent-relative weighting, side constraints lack foundation).  
  - **Ambiguity Flag**: Branch B’s "anti-aggregation" leaf could align with **deontology** (C) or **axiology** (B) — the tree can’t split these.  

  ---

  ### **Why This Tree?**  
  - **Avoids Labels**: Questions stand without naming positions (e.g., Node C1 doesn’t ask "Are you deontologist?").  
  - **Highlights Tensions**: Temporal vs. interpersonal boundaries reveal if separateness is metaphysical or moral.  
  - **Uses Cases, Not Jargon**: Transplant, utility monster, and repugnant conclusion drive distinctions home.  
  - **Maps the Debate**: Named leaves show live options; empty nodes expose gaps (e.g., no one defends radical temporal anti-aggregation).  

  Adapt cases or add citations (e.g., *Parfit, Reasons and Persons* on Branch A; *Scanlon, What We Owe* on C2) as needed. Designed for debate—no one "wins," but paths clarify philosophical stakes.
