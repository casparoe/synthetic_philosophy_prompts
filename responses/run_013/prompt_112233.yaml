  Ah, that thermometer analogy is crucial here - it shows how reliable correlation alone can ground reference, even when the causal arrow points the wrong way. The user's demanding to know what "aboutness" consists in if not causation, so I'll need to flesh out that informational/indicator theory carefully. 

