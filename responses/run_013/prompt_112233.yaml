answer: |-
  You've struck at the heart of the counterintuitive cost, and I concede it feels like a paradox. But let's dissect it. My zombie twin *does* utter "red looks like *this*" with identical physical causes – photons hitting retinas, neural processing, motor output – all without any redness-quale. His utterance refers only to the *physical* state reliably correlated with that quale in me. Yet here's the pivot: **representation isn't defined by causation, but by reliable correlation within a system.** Consider a thermometer. Its mercury level reliably correlates with temperature *because* temperature causes it to expand. But imagine a "backward" thermometer where a fixed internal heater causes mercury to expand on a schedule, while external temperature variations happen to correlate perfectly with that schedule by pure coincidence. To an observer tracking the correlations, the mercury level *still represents* external temperature – it carries information about it – even though the temperature doesn't *cause* the mercury level; the heater does. The "aboutness" comes from the pattern of correlation, not the causal direction.

  My brain state is like that backward thermometer. It's reliably *correlated* with the redness-quale (due to the common cause: the physical stimulus and neural processing). This correlation pattern, sustained by physical law, makes the brain state *indicate* the quale, even though the quale doesn't cause the state. When I judge "I experience *this* redness," the "this" refers to the quale *because* my judgment-state is part of a system where that specific neural pattern is lawfully paired with that specific quale. The zombie's identical utterance refers only to the neural pattern because the quale isn't there, but *my* utterance hooks onto the quale via this indicative relationship. Yes, it means my evidence for qualia is irreducibly first-person – the zombie denies qualia while I affirm them, both based on identical third-person evidence. The difference isn't in the public evidence or the causal chain producing the words; it's in the private reality the words *indicate* for me, not for him.

  **Bottom line:** Representation of the quale is grounded in its lawful correlation with the brain state, making the judgment *about* it via informational content, even if the quale is causally inert.
