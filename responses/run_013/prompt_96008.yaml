prompt: |-
  I'm in a philosophy of biology seminar this term and we've spent the last two weeks on functions, and I've realised I can't keep track of what anyone is actually claiming because everyone seems to want something different from the word. The etiological or selected-effects crowd (Millikan, Neander, that tradition) and Cummins-style causal role analysis are the two poles we've been given, but I keep noticing that half the objections in the readings are really disagreements about what the theory is even supposed to do. So before I write my paper I want the spec, not the verdict: what would a theory of biological function have to get right to count as adequate at all? Lay out the desiderata, with the case or consideration behind each one, and tell me which are non-negotiable and which are just house preferences of one camp.

  Some of the things I want in the list, though don't let these cap it: it has to handle malfunction (a heart that's stopped pumping, kidneys that don't filter, and the awkward question of whether a trait that was never selected for anything can malfunction at all), it has to say something about novelty (a structure that's only just appeared and hasn't been through any selection yet, a trait that's maintained by selection but now does something quite different from what it was originally selected for, an exaptation, whatever feathers were doing before flight), it has to respect the difference between a function and a mere side effect (my prof's example is the noise a heart makes, which nobody thinks is its function), and it has to be consistent with what actually goes on in biology — I'm thinking of the whole mess over how much of the genome is functional, where one side seems to be saying that if a stretch of DNA is doing something biochemically then it's functional and the other side thinks that's cheating and that function has to mean something about why the thing is there. I'd also like you to say whether we're owed one theory that covers all the uses at once, because function-talk in medicine, in ecology, and about artefacts like a paperweight or a badly designed chair doesn't obviously work the same way as function-talk about a kidney, and I don't know if the right answer is a single account that stretches to cover them or honest pluralism.

  What I most want, though, is the part where you tell me if some subset of the requirements can't be satisfied together — if the list itself turns out to be a result, i.e. no account can both do the malfunction thing and the novelty thing, say so and say which one you'd give up. And flag which single requirement is doing the most excluding work, the one that knocks out the most otherwise plausible theories, since thats the one I want to build my paper around. You can end with a quick sketch of how the selected-effects and causal-role views fare against the list, but keep it short, I'll do the scoring myself and the criteria are the actual assignment.
