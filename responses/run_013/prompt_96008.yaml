  Okay, let me unpack this user's query. They're in a philosophy of biology seminar focused on functions, feeling overwhelmed by conflicting theories. Their core request is for a clear set of desiderata to evaluate theories of biological function, not a defense of any particular view. 

  Hmm, I notice several layers here. First, the explicit need: criteria to assess functional theories (malfunction, novelty, etc.). Second, the underlying struggle: conceptual chaos in seminar discussions. Third, the unstated paper anxiety - they want structural clarity before writing. Smart move.

  The user's examples reveal sophisticated engagement: they're already spotting how objections often mask deeper disagreements about theory goals. That "spec not verdict" phrasing suggests they've been burned by partisan debates. Their frustration with "house preferences" tells me they want neutral evaluation tools.

  Let me mentally organize the must-haves from their text:
  - Malfunction cases (non-working organs)
  - Novelty problems (new traits/exaptations)
  - Function vs side-effect distinction 
