  - Scope question (single theory vs pluralism?)

  Plus their meta-request: identify conflicting desiderata and the "most excluding" criterion. Ah - that's where their paper likely hinges. They're not just collecting criteria but probing theoretical trade-offs.

  *Pausing to consider disciplinary context* 
  Philosophy of biology often gets messy when conflating conceptual analysis with scientific utility. The user's "what it's supposed to do" comment hits that nerve. Desiderata should separate:
  - Conceptual necessities (what function must mean)
  - Explanatory powers (what work the theory does)
  - Application constraints (biological realism)

  *Brainstorming the desiderata list*
  Starting with non-negotiables:
  1. Malfunction accommodation - else we can't call a stone heart dysfunctional
  2. Normativity - functions imply "should do" 
  3. Historical sensitivity - biology's evolutionary nature
  But wait - causal-role theories reject #3! That tension might be key...

  The genome debate example is perfect. It shows two distinct projects: 
  - Biochemists tracking causal roles
  - Evolutionary biologists asking "why present?"
  Both legitimate, but answering different questions. Pluralism alarm bells ringing here.

  *Identifying landmines*
  Biggest conflict: Novelty vs Malfunction. If a new trait has no history (novelty), how can it malfunction? Yet medicine needs malfunction for birth defects. Either we sacrifice historicity for medicine, or invent "proper function" for new traits. Ouch.

  The side-effect criterion seems weaker - even selected-effects can handle heartbeat sounds as accidental. But the heart noise example does expose how causal-role theories risk over-attributing functions. Trade-offs everywhere...

  *Structuring the response*
  Will organize desiderata into tiers: 
  - Universal (all theories must hit these)
  - Domain-specific (biological must-haves)
  - Load-bearing (causing most conflicts)
  Then spotlight the novelty-malfunction collision and how it wrecks monist theories. The genome pluralism point becomes the graceful exit.

  *User's paper tip* 
  Their instinct is right - the "most excluding" criterion is the novelty/malfunction tension. If I emphasize how this forces either historicist compromises (Millikan struggling with mutations) or ahistorical fixes (Cummins ignoring origins), they've got their paper engine. Should flag that as the goldmine.
answer: |-
  Here’s a structured breakdown of the **desiderata for a theory of biological function**, organized by what it must explain ("the spec"), why it matters, and how negotiable each is. I’ll flag conflicts and the "most excluding" requirement at the end, followed by a brief comparison of the two main views.

  ---

  ### **Core Desiderata (Non-Negotiable for Any Theory)**  
  These are the minimum requirements any theory must satisfy to be taken seriously in biology:

  1. **Malfunction/Error Possibility**  
     - **What it must do**: Explain how a trait can *fail* at its function (e.g., a heart that doesn’t pump blood).  
     - **Why**: Essential for medicine/pathology (e.g., diagnosing disease) and evolutionary theory (traits can be defective).  
     - **Non-negotiable**: Yes. Without this, "function" loses normative force.  

  2. **Function vs. Mere Side Effect**  
     - **What it must do**: Distinguish a trait’s *function* from accidental byproducts (e.g., the heart’s noise vs. pumping blood).  
     - **Why**: Prevents trivialization (e.g., if every effect is a function, the concept is useless).  
     - **Non-negotiable**: Yes. A core intuition across biology.  

  3. **Compatibility with Evolutionary Biology**  
     - **What it must do**: Cohere with how biologists explain trait origins/persistence (e.g., natural selection, drift, constraints).  
     - **Why**: Functions are invoked in adaptationist explanations; the theory must align with actual science.  
     - **Non-negotiable**: Yes. A theory biologists can’t use is irrelevant.  

  ---

  ### **Domain-Specific Desiderata (Biological Non-Negotiables)**  
  These arise from the unique character of *biological* systems:

  4. **Novelty Handling**  
     - **What it must do**: Account for traits that haven’t been selected *yet* (e.g., new mutations) or have been co-opted for new roles (*exaptations*, like feathers for insulation → flight).  
     - **Why**: Evolution generates novelty constantly; a theory ignoring this misrepresents biology.  
     - **Non-negotiable**: In a biological context, yes.  

  5. **Historical Sensitivity**  
     - **What it must do**: Explain why a trait’s *evolutionary history* matters (e.g., why we say "the heart’s function is pumping blood" even if it also produces noise).  
     - **Why**: Biologists appeal to selective history to explain *why* a trait exists.  
     - **Non-negotiable**: For evolutionary explanations, yes.  

  ---

  ### **Contested Desiderata (House Preferences)**  
  These split camps; satisfying one may undermine another:

  6. **Ahistoricity**  
     - **What it must do**: Assign functions without referencing evolutionary history (e.g., to newly synthesized organs or alien life).  
     - **Why**: Needed for functional anatomy, biochemistry, or systems biology (e.g., "junk DNA" with biochemical activity).  
     - **Negotiable**: Causal-role theorists demand this; etiological theorists reject it.  

  7. **Pluralism Scope**  
     - **What it must do**: Decide if one theory covers *all* contexts (biology, artefacts, ecology) or if pluralism is needed.  
     - **Why**: "Function" in medicine ("kidneys filter blood") vs. ecology ("keystone species function") may differ.  
     - **Negotiable**: Yes. Monists (e.g., Millikan) push unity; pluralists (e.g., Godfrey-Smith) allow context-dependence.  

  8. **Biochemical Activity as Function**  
     - **What it must do**: Resolve if "doing something" (e.g., DNA transcription) suffices for function, or if selection is required.  
     - **Why**: ENCODE project claims 80% of human genome is "functional" biochemically; critics say this confuses function with causal activity.  
     - **Negotiable**: Etiological views reject biochemical activity as sufficient; causal-role views accept it.  

  ---

  ### **The Central Conflict: Malfunction vs. Novelty**  
  **The unresolvable tension**:  
  - **Malfunction requires normativity** (a heart *should* pump blood).  
  - **Novelty requires ahistoricity** (a new trait has no history to ground norms).  
  **Result**: No theory fully satisfies both.  
  - *Etiological views* (Millikan, Neander): Solve malfunction via selective history but struggle with novelty (e.g., what is a *new* trait’s function before selection?).  
  - *Causal-role views* (Cummins): Handle novelty (assign function via current capacity) but struggle with malfunction (if a trait *can* do X, why is failure "malfunction" and not just absence?).  

  **The most excluding requirement**: **Malfunction**.  
  - Why? It demands *normativity* (functions as "shoulds"), which forces theories into either:  
    - Historical norms (etiological views), *or*  
    - Systemic norms (causal-role views, e.g., "contributing to a system’s goal").  
  - Casual-role norms feel arbitrary without history; etiological norms exclude novelty. Most theories collapse here.  

  ---

  ### **Quick Sketch: How Major Views Fare**  
  | **Desideratum**       | **Etiological (Millikan/Neander)** | **Causal-Role (Cummins)** |  
  |-------------------------|-------------------------------------|----------------------------|  
  | Malfunction             | ✅ (Failure of selected effect)     | ⚠️ (Failure of systemic role?) |  
  | Function vs. Side Effect| ✅ (Only selected effects count)    | ⚠️ (Roles are observer-relative) |  
  | Evolutionary Compatibility | ✅ (Built on selection)          | ⚠️ (Ignores history)       |  
  | Novelty/Exaptations     | ❌ (Function requires past selection) | ✅ (Current role suffices) |  
  | Biochemical Activity    | ❌ (Activity ≠ function)           | ✅ (Activity = function)   |  
  | Ahistoricity            | ❌ (History essential)             | ✅ (Current capacities only) |  
  | Pluralism               | ❌ (Monist: one theory for all)    | ⚠️ (Can extend to artefacts) |  

  ---

  ### **Conclusion: The Trade-Off**  
  - **You can’t have it all**: Malfunction demands normativity; novelty demands ahistoricity. Choose your poison.  
  - **Recommendation for your paper**: Focus on **malfunction** as the "most excluding" criterion. Argue whether a theory can ground normative claims without history (causal-role) or whether history is indispensable (etiological). Use the genome debate as a test case: Is "junk DNA" with biochemical activity "functional"? The answer depends on which desideratum you prioritize.  
  - **Pluralism?** Likely necessary: Etiological functions explain *why traits exist*; causal-role functions explain *how systems work*. Biology needs both.  

  This gives you the criteria to dissect any theory. Now go score them!
