  - 40 years at 10 vs 60 years at 9.5 -- she says the 60-year life is better.
  - 60 years at 9.5 vs 100 years at 9 -- the 100-year life is better.
  - 100 years at 9 vs 300 years at 8 -- the 300-year life is better.
  - 100 years at 9 vs 1,000 years at 5 -- now she flips and says the 100 years at 9 is better.
  - 40 years at 10 vs 10,000 years at 2 -- she says the 40 years at 10 is better.

  So she'll trade a little quality for alot of years, but she won't trade alot of quality for years. The trouble is she also insists those little trades stack, and if they stack it feels like she's sliding toward saying some enormous stretch of mildly-ok years beats a short blissful life -- the repugnant-conclusion thing -- which she flatly denies. I can't tell if she's genuinely inconsistent or if there's one coherent rule underneath all five verdicts.

  Here's the case I actually need you to call: 50 years at 9 vs 100,000 years at 5. Which one does she say is better?

  Play the role of a patient philosopher of value who works on axiology and the formal structure of betterness, and think carefully rather than pattern-matching. Dont answer straight away -- first brainstorm, in your head, every rule that could generate all five verdicts above, then narrow down. I want the candidate rules that fit everything she's said, what each predicts for my new case, your best guess plus why you prefer it, and the further case that would actually tell the surviving rules apart. Keep it in American English.

  Give it back to me as a JSON object with these fields:
  - "candidate_rules": a list, where each entry has "name", "one_line_rule", "how_it_fits_all_five_verdicts", and "prediction_for_new_case".
  - "best_guess_rule": the name of the one you'd bet on.
  - "best_guess_for_new_case": which life she picks, in one sentence.
  - "why_this_rule_over_the_others": a short paragraph.
  - "is_she_really_committed_to_the_repugnant_conclusion": yes / no / only-if, with a sentence or two.
  - "discriminating_case": an object with "description" and "what_each_surviving_rule_predicts".
