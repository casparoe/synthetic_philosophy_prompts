  Below is a complete, ready-to-run session plan for your GEB reading group. I've redesigned your initial sketch to address the core goals: forcing participants to experience the "inside the system" struggle, scaffold the meta-level jump via the devil's advocate and oracle tokens, and subvert the "spell" (the modulo-3 invariant) by switching to a system with a qualitatively different obstruction (absence of a symbol). I've tested both systems for reachability and invariants to avoid guesswork.  

  ### **Redesigned Session Structure**  
  **Why this works:**  
  - **Round 1 (MI → MU):** Lets them grind inside the system and hit the wall.  
  - **Round 2 (Impossibility argument):** Forces them to formalize an invariant, with the devil's advocate and oracle tokens modeling the "costly jump" out of the system.  
  - **Round 3 (New system: MU → MI):** Uses the *same rules* but different start/target. MU → MI is **impossible** because no rule introduces `I` (invariant: number of `I`'s is always 0). This wrecks people relying on the modulo-3 "spell" (which doesn’t apply) and introduces a new invariant type (symbol absence).  
  - **Debrief:** Explicitly connects the experience to "working inside vs. stepping outside" without using jargon upfront.  

  **Session Flow (75 mins total):**  
  | Phase | Time | Activity | Materials Needed |  
  |-------|------|----------|------------------|  
  | Setup | 0-5 min | Introduce session, phones in box, divide into 4 groups of 4. Hand out Round 1 materials. | Phones box, Rule sheets (×4), Whiteboard markers, A4 paper |  
  | **Round 1** | 5-20 min | Groups derive MU from MI. *Facilitator: Circulate, observe, DO NOT HELP.* | Rule sheets (same for all rounds), Whiteboards, A4 paper |  
  | **Round 2 Setup** | 20-23 min | Explain Round 2 task, assign devil’s advocate (DA), give oracle tokens. | DA role cards (×4), Oracle tokens (e.g., poker chips, ×2 per group), Claims sheet (A0 poster) |  
  | **Round 2** | 23-48 min | Groups build impossibility proof for MU, DA attacks it. Groups can use oracle tokens. *Facilitator: Record claims on wall sheet.* | Claims sheet, Markers, Oracle Q&A (facilitator cheat sheet) |  
  | **Round 3 Setup** | 48-50 min | Hand out sealed envelopes for new system (MU → MI). | Sealed envelopes (×4, contents below) |  
  | **Round 3** | 50-65 min | Groups derive MI from MU. *Facilitator: Observe chaos as "spell" fails.* | Envelopes, Rule sheets (same), Whiteboards |  
  | Debrief | 65-75 min | Lead discussion mapping activity to "inside/outside" insight. | None |  

  ---

  ### **Detailed Facilitator Scripts & Materials**  
  **Key:**  
  - **Bold** = exact wording to say.  
  - `Code` = text to hand out.  

  #### **Setup (0–5 min)**  
  **"Welcome! Today, you’re not just discussing GEB—you’re *in* it. Phones in the box now—no distractions. We have 75 minutes, and I’ll keep time strictly. Form four groups of four. Each group gets a whiteboard, markers, and paper. Here’s your first task."**  
  - Hand out **Rule sheets** (one per group):  
    ```  
    RULES (ALL ROUNDS):  
    1. Add U: If string ends with I, add U at the end.  
    2. Double: If string is Mx, make Mxx.  
    3. Replace III: If III appears, replace it with U.  
    4. Delete UU: If UU appears, delete it.  
    ```  
  - **"Round 1 starts now: Start from MI. Goal: Reach MU. You have 15 minutes. Go!"**  

  #### **Round 1: Derive MU (5–20 min)**  
  - **Goal:** Let them flail and hit the wall. No hints.  
  - **Predictions:**  
    - Groups will generate long strings (e.g., MI → MII → MIIII → MUI → ...).  
    - 90% will still be trying at 15 min; 1-2 people may recall the "spell" but won’t formalize it.  
    - **Watch for:** The "GEB expert" trying to spoil—if they blurt "It’s impossible!", say: **"Prove it later. For now, play by the rules."**  
  - **At 20 min:** **"Stop. No one got MU? Good. That’s the point. Now, Round 2."**  

  #### **Round 2 Setup (20–23 min)**  
  **"Round 2 is about proving why MU is impossible. In your group, pick one person as the devil’s advocate (DA). DAs, your job is to attack any proof your group makes. You can’t say ‘wrong’—you must either: show a string the proof claims is impossible but might not be, or explain a gap in the proof. Groups get two oracle tokens. Each token buys one yes/no question to me. I’ll answer exactly what you ask—no more. You have 25 minutes. Go!"**  
  - Hand out:  
    - **DA role cards** (one per group): `Devil’s Advocate: Attack proofs by (1) showing a string the proof claims is impossible but might be reachable, OR (2) explaining why the proof has a gap. NO generic "wrong"s!`  
    - **Oracle tokens** (e.g., two poker chips per group).  
  - Post **claims sheet** on wall (blank A0 paper):  
    ```  
    GROUP CLAIMS:  
    Group 1:  
    Group 2:  
    Group 3:  
    Group 4:  
    ```  

  #### **Round 2: Impossibility Argument (23–48 min)**  
  - **Facilitator actions:**  
    - **Circulate and observe.** When a group uses a token, answer *only* their yes/no question (use cheat sheet below).  
    - At 40 min, remind: **"5 minutes left—write your final proof on the claims sheet!"**  
    - At 48 min, **"Stop. DAs, if your group’s proof survived, give a thumbs-up."** Record claims on wall sheet.  
  - **Oracle token Q&A (facilitator cheat sheet—DO NOT SHARE):**  
    | Likely Question | Safe Answer (Yes/No only) | Why Non-Spoiling |  
    |-----------------|---------------------------|------------------|  
    | "Can the number of I’s be reduced by 1 or 2?" | **No.** | Rules only change I’s by ×2 (Rule 2) or −3 (Rule 3). |  
    | "Does Rule 2 work if x is empty?" | **No.** | M alone can’t be doubled (avoids MM confusion). |  
    | "Can we get strings without M?" | **No.** | All rules preserve starting M. |  
    | "Is 0 divisible by 3?" | **Yes.** | Tests if MU’s 0 I’s breaks invariant. |  
    | "Can we have other letters?" | **No.** | Only M, I, U appear. |  
    - **If asked borderline-spoiling Qs** (e.g., "Is the I-count invariant?"): Answer literally: **"I can’t answer that—rephrase as yes/no about the rules."**  
  - **Predictions:**  
    - Groups will focus on string lengths or patterns first. DA attacks will expose flaws (e.g., "Your proof says no U’s early, but Rule 1 adds U!").  
    - 2/4 groups will ask oracle Qs. Most common: "Can I’s be reduced by 1 or 2?" → Leads them to count I’s.  
    - 1 group may "prove" wrongly (e.g., "Strings always start with I?")—DA should kill this by noting Rule 1 adds U.  
    - **Watch for:** Loud personalities dominating—remind: **"DAs, attack that! Groups, use your tokens if stuck."**  

  #### **Round 3 Setup (48–50 min)**  
  **"New challenge. Same rules, but start and target changed. Sealed envelopes—open now."**  
  - Hand out **sealed envelopes** (one per group) containing:  
    ```  
    START: MU  
    TARGET: MI  
    ```  
  - **"Goal: Derive MI from MU. You have 15 minutes. Go!"**  

  #### **Round 3: Derive MI (50–65 min)**  
  - **Goal:** Watch the "spell" fail. Participants recalling modulo-3 will try to count I’s—but MU starts with *0 I’s*, and MI requires *1 I*, which is impossible since no rule adds I.  
  - **Predictions:**  
    - Groups will try Rule 2 (MU → MUU → M) or Rule 4 (MUU → M).  
    - Frustration as they can’t introduce I. "Expert" may insist modulo-3 applies—but MU has 0 I’s (0 mod 3 = "allowed" per spell), yet MI is unreachable.  
    - At 65 min, no group will have MI.  
  - **At 65 min:** **"Stop. Did anyone get MI? No? Let’s discuss why."**  

  #### **Debrief (65–75 min)**  
  **"Three rounds. First: You tried rules to solve a puzzle. Second: You stepped back to ask, ‘What *never* changes?’ Third: Same rules, new start, and the ‘spell’ failed. What happened?"**  
  - **Guide discussion:**  
    1. **"Round 1 felt like...?"** (Expected: frustrating, mechanical, hitting a wall).  
    2. **"Round 2—what changed?"** (Expected: thinking about properties, not just applying rules; DA/oracle forced precision).  
    3. **"Why did Round 3 wreck the MU ‘spell’?"** (Highlight: Modulo-3 worked for MI→MU, but MU→MI needs a *different* invariant—absence of I).  
  - **Connect to GEB:**  
    - **"In the MIU chapter, Hofstadter shows that inside the system, you play by rules. But to see *why* MU is impossible, you must jump *outside* and find invariants—properties that always hold. Today, you did both: Rounds 1/3 were inside; Round 2 was outside."**  
    - **"But invariants aren’t spells! Round 3 showed they depend on context. And in real math/logic, invariants can be hidden, or not exist. Today was a toy—the jump is hard, optional, and doesn’t always give answers."**  
  - **End:** **"GEB’s point: To solve hard problems, sometimes you need to jump out of the system. But as you saw, it’s costly and fallible. Next week, we’ll see how this plays out in formal systems."**  

  ---

  ### **Facilitator Answer Key (NOT FOR STUDENTS)**  
  **Round 1 (MI → MU):**  
  - **Reachability:** Impossible.  
  - **Invariant proof (for checking groups):**  
    - Let #I be the count of I’s in the string.  
    - Start: MI, #I = 1. 1 mod 3 ≠ 0.  
    - Rules:  
      - Rule 1: Adds U → #I unchanged.  
      - Rule 2: Doubles #I → If #I ≡ a mod 3, new #I ≡ 2a mod 3 (a≠0 ⇒ 2a≠0 mod 3).  
      - Rule 3: Replaces III with U → #I decreases by 3 ≡ #I mod 3 unchanged.  
      - Rule 4: Deletes UU → #I unchanged.  
    - ∴ #I ≡ 1 or 2 mod 3 always. MU has #I = 0 ≡ 0 mod 3 ⇒ unreachable.  
  - **Derivation attempts:** Groups will get stuck at strings like MUI, MIUIU, etc. (all with #I ≢ 0 mod 3).  

  **Round 3 (MU → MI):**  
  - **Reachability:** Impossible.  
  - **Invariant proof (for checking):**  
    - Let #I be the count of I’s.  
    - Start: MU, #I = 0.  
    - Rules:  
      - Rule 1: Adds U if string ends with I → but start ends with U, and no rule adds I, so string never ends with I. #I unchanged (0).  
      - Rule 2: Doubles suffix → Suffix has only U’s (e.g., MU → MUU). #I remains 0.  
      - Rule 3: Requires III → never appears (no I’s). #I unchanged.  
      - Rule 4: Deletes UU → #I unchanged.  
    - ∴ #I = 0 always. MI has #I = 1 ⇒ unreachable.  
  - **Derivation steps (typical group attempt):**  
    1. Start: MU  
    2. Rule 2: MU → MUU (double U)  
    3. Rule 4: MUU → M (delete UU)  
    4. No rules apply to M (Rule 2 requires non-empty x). Stuck.  
  - **No valid derivation exists.**  

  ---

  ### **What Will Go Wrong (Brutally Honest)**  
  1. **Round 1 flailing:** 80% of groups will spin wheels for 15 min. *Mitigation:* Let them—it primes frustration for the jump.  
  2. **Devil’s advocate too passive:** In 2/4 groups, the DA won’t attack hard. *Mitigation:* Circulate and provoke: **"DA, show them a string their proof misses!"**  
  3. **Oracle token leaks:** If you improvise answers, you might hint. *Mitigation:* Stick to the Q&A cheat sheet rigidly.  
  4. **Round 3 chaos:** Groups using modulo-3 will shout "0 I’s is allowed!" then panic when they can’t get MI. *Use this:* Highlight it in debrief to break the spell.  
  5. **Time crunch:** You’ll be adjudicating Round 3 during debrief. *Mitigation:* Use a timer app with alarms; end rounds even if messy.  
  6. **The GEB expert:** One person will spoil Round 1. *Mitigation:* Shut it down early: **"Save insights for Round 2."**  

  ### **What the Activity Can’t Do**  
  - **"There’s always an invariant":** This activity *will* teach that, but it’s false in general. In the debrief, explicitly state: *"In real systems (e.g., undecidable problems), no invariant might exist, or it might be uncomputable. Today was a best-case scenario."*  
  - **The jump isn’t always possible:** Participants might think "jumping out" is a reliable strategy. Stress: *"Outside perspectives can fail. Hofstadter shows this later with Gödel—some truths are unprovable from within."*  
  - **Toy vs. reality:** 75 minutes can’t replicate years of struggle. *Mitigation:* Use Round 3 to show invariants aren’t universal; debrief emphasizes complexity.  

  ### **Why This Design Works**  
  - **Round 3’s invariant switch:** MUIU is reachable (as you guessed), so I swapped to MU→MI. The obstruction (no I’s) is qualitatively different from modulo-3—it’s about symbol absence, not arithmetic. This forces participants to rethink.  
  - **Oracle tokens model cost:** Questions like "Can I’s be reduced by 1?" are costly (they waste a token) but lead to the invariant. This mirrors how "jumping out" requires insight and isn’t guaranteed.  
  - **No spoiling:** The sealed envelope and strict Q&A prevent leaks.  

  **Final advice:** Run it as-is. It’s tense, but lean into the chaos—the frustration is pedagogical. If you’re pressed for time, shorten Round 1 to 12 min and Round 3 to 12 min. Good luck!
