  So let's write the exact wording.

  Handout for round 1:

  "System rules:
  1. If you have a string ending with I, you can add U at the end.
  2. If you have a string that is M followed by some part (call it x), you can make a new string M followed by x twice.
  3. If you have a string containing three consecutive I's (III), you can replace them with a single U.
  4. If you have a string containing two consecutive U's (UU), you can remove them.

  Start: MI
  Target: MU

  Work in your group to try to derive MU from MI using only these rules. You have 15 minutes."

  Handout for round 2 (after round 1):

  "Now, instead of trying to derive MU, your task is to prove that it is impossible to derive MU from MI using these rules.

  In your group, one person will act as the devil's advocate. Their role is to challenge any proposed proof. The advocate should try to find a flaw in the proof by either:
  - Showing a specific string that the proof claims is impossible to reach, but which might be reachable (and if possible, how), or
  - Explaining why the proof does not cover all cases.

  The advocate is not allowed to simply say the proof is wrong; they must give a specific reason.

  Additionally, your group has two oracle tokens. Each token can be used to ask the facilitator one yes/no question about the system. The facilitator will answer truthfully.

  You have 25 minutes to formulate your proof and defend it against your advocate."

  Handout for round 3 (in sealed envelope):

  "System rules: (same as before)
  1. ...
  2. ...
  3. ...
  4. ...

  Start: MU
  Target: MI

  Work in your group to try to derive MI from MU using these rules. You have 15 minutes."

  For the facilitator's use only:

  Oracle questions and answers (for round 2):

  Common questions and safe answers:
  1. Q: Can the number of I's be reduced by one or two at a time?
     A: Rule 3 reduces the number of I's by three. There is no rule that reduces the number of I's by one or two.

  2. Q: Does the string always start with M?
     A: Yes, all rules preserve that the string starts with M.

  3. Q: Can we have letters other than M, I, and U?
     A: No, only M, I, and U can appear in the string.

  4. Q: Is there a way to remove a single U?
     A: Rule 4 removes two U's at a time. There is no rule that removes a single U.

  5. Q: Can we apply rule 2 even if x is empty? (i.e., from M, can we make MM?)
     A: In this system, rule 2 requires that there is a non-empty part after M. From M alone, rule 2 cannot be applied.

  6. Q: Is the empty string a valid string?
     A: No, the string must always start with M and have at least one character after M? But in this system, we never reach the empty string. The closest is M, but it's not empty. We do not consider the empty string.

  If asked about specific strings:
  - Q: Can we reach M?
     A: That's part of what you're investigating.

  - Q: Can we reach a string with no I's?
     A: You can try to see.

  But avoid answering about specific strings if possible.

  Debrief script (10 min):

  "Let's reflect on what happened.

  In the first round, you were given a system and a goal, and you tried to achieve the goal by applying the rules. Many of you probably found it frustrating that you couldn't reach MU.

  In the second round, you stepped back and tried to reason about the system as a whole. You looked for properties that are always true and that prevent the goal. This is what we call an invariant. For the first system, the invariant was that the number of I's is never a multiple of 3. In the third round, with a different starting point, the invariant was that the number of I's is always zero.

  This illustrates a key idea from the chapter: sometimes, to solve a problem within a system, you need to step outside the system and reason about it from a higher level. In the MIU system, working within the rules couldn't tell you that MU is impossible; you had to look at the invariant.

  However, in more complex systems, finding an invariant might be very hard, or there might not be one that settles the question. This activity shows the power of invariants, but also remember that they are not always easy to find or sufficient for all problems."

  This should fit in 10 minutes.

  Additional notes for facilitator:

  - For round 3, the derivation for MI from MU is impossible, so there is no derivation. The invariant is the key.

  - To verify groups' work: in round 2, a correct proof will mention that the number of I's modulo 3 is preserved and not zero for MU. In round 3, the proof is that no I can be introduced.

  - What if a group claims to have derived MI in round 3? They can't, but if they make a mistake (e.g., apply a rule that isn't allowed), correct them.

  - Time management is crucial. Use a timer.

  - The activity might not perfectly replicate the frustration of real research, but it gives a taste.

  This design should meet the goals.
