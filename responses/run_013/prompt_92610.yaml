prompt: |-
  I teach a grad seminar on combinatorial games, and we spend the last two weeks on the philosphical side of it -- existence proofs vs. constructions, what it even means to have "solved" a game, that kind of thing. I'm writing the final problem set and I want one essay question on strategy stealing, and I want it built so a student can't get away with just reciting "strategy stealing shows the first player wins at Hex and Chomp."

  Here's what the question has to force them to do. First, pin down which structural features of a game the argument actually leans on -- in particular, make them be explicit that the fact that an extra move never hurts the player who takes it is doing real work and isn't just throat-clearing. Second, explain why the argument hands you a winner without handing you a move, and take a stand on whether that's a defect of the proof or just a fact about what got proven. Third, make them diagnose a game where the argument fails and say exactly which premise breaks -- zugzwang in chess is the cheap one, so I want at least one more, and feel free to invent a small variant game inside the question itself so they can't just recall it. Fourth, make them distiguish strategy stealing from the mirroring / Tweedledum-style arguments, which do give you an explicit strategy -- I want them to say why one of these arguments can produce a move and the other one can't.

  So please write the question, a model answer of about 500 words, and a marking scheme out of 20 that lists the must-hit points with the marks for each, plus a one-line note for each point on how students typically blow it. Have the model answer open with a single-sentence bottom line. And keep the whole thing -- question, answer, and scheme -- under 900 words.

  One constraint: don't lean on any particular paper, author, or citation. The students won't have web access and neither will the person marking, so anything I can't assume they've actually read is off limits. Naming games is fine; they'll know Hex and Chomp.
reasoning: |-
  We are creating an essay question that forces students to think deeply about the strategy stealing argument. The question should cover:
  1. The structural features of the game that the argument relies on, emphasizing that an extra move never hurts (monotonicity).
  2. Why the argument gives a winner without giving a move, and the student's stance on whether that's a defect.
  3. A diagnosis of a game where strategy stealing fails (beyond zugzwang in chess) with a specific premise break. We'll invent a small variant.
  4. Distinguishing strategy stealing from mirroring arguments (like in Hex on a symmetric board) and why one gives explicit moves and the other doesn't.

  We'll invent a variant game for part 3 to avoid recall.

  Question:

  Consider the strategy stealing argument, as used to prove that the first player has a winning strategy in games like Hex and Chomp. 

  (a) Identify and explain the key structural features of a combinatorial game that are required for the strategy stealing argument to work. In particular, explain why the property that "an extra move never hurts the player who makes it" (sometimes called monotonicity) is essential, and not merely a formality.

  (b) The strategy stealing argument establishes the existence of a winning strategy for the first player without providing any specific move. Explain why the argument is non-constructive in this way. Then, argue whether this non-constructive nature is a defect of the proof or simply a reflection of what the proof accomplishes.

  (c) Consider the following game, which we will call "Asymmetric Chomp": the game is played on a rectangular grid as in normal Chomp, but with one corner cell already removed (so the starting board has a "bitten" corner). The players alternate taking rectangular bites (removing a cell and all cells above and/or to the right of it). The player who takes the poisoned cell (the bottom-left cell) loses. Explain why the strategy stealing argument fails to establish which player has a winning strategy in Asymmetric Chomp. Be specific about which premise of the strategy stealing argument is violated.

  (d) Contrast the strategy stealing argument with mirroring (or Tweedledum-Tweedledee) arguments, which can provide an explicit winning strategy. Explain why mirroring arguments can be constructive (i.e., tell you what move to make) while strategy stealing arguments cannot.

  Model Answer (approx 500 words):

  The strategy stealing argument is a powerful non-constructive tool that establishes the first player's winning advantage in certain impartial games without revealing any specific winning moves.

  (a) The strategy stealing argument requires three key features: (1) the game is deterministic with perfect information and no chance, (2) it is a two-player game of pure conflict (zero-sum) with no draws, and (3) every move is either beneficial or neutral to the player making it, meaning that having an extra move never harms a player (monotonicity). Monotonicity is crucial because it allows the first player to "steal" the second player's strategy without fear of being forced into a disadvantage. Without it, the first player's extra move might backfire, making the stolen strategy inapplicable.

  (b) The argument is non-constructive because it works by contradiction: assuming the second player has a winning strategy, the first player can make an arbitrary first move and then use the stolen strategy to respond to the second player's moves, but if the stolen strategy ever calls for the first player to make the same move they already made, they can make an arbitrary extra move and continue stealing. This contradiction shows the second player cannot have a winning strategy, so the first player must. However, the argument does not specify the first move or subsequent moves because it relies on the existence of the second player's strategy (which is assumed and then leads to contradiction) and arbitrary choices when overlaps occur. This non-constructiveness is not a defect; it is inherent to the proof technique and reflects that the result is an existence statement about a winning strategy, not an algorithm to find one.

  (c) In Asymmetric Chomp, the strategy stealing argument fails because the monotonicity condition is violated. Specifically, an extra move might force a player to take the poisoned cell (losing immediately). For instance, if the first player's extra move is the one that takes the poisoned cell, then that move is harmful. Thus, when the first player attempts to use the stolen strategy and might be forced to make a move that they have already made (and then make an arbitrary extra move), that arbitrary move could be fatal. Hence, the argument cannot proceed because the extra move is not always beneficial.

  (d) Mirroring arguments (like in symmetric Hex) are constructive because they provide a specific strategy: copy the opponent's move in a symmetric position. The symmetry of the board and the moves ensures that every opponent move can be mirrored, leading to a winning strategy that explicitly tells the player what move to make in every situation. In contrast, strategy stealing relies on the hypothetical existence of the opponent's strategy and uses it in a non-constructive way (by contradiction), so it cannot produce an explicit move.

  Marking Scheme (out of 20):

  - (a) Key features: 4 marks. Must include: deterministic, perfect information, zero-sum, no draws, and monotonicity (extra move never hurts). (2 marks for listing, 2 for explaining monotonicity's role.) *Common mistake: listing features without explaining why monotonicity is essential.*
  - (b) Non-constructive explanation: 5 marks. (2 marks for explaining why it's non-constructive, 3 for the stance and reasoning.) *Common mistake: not recognizing the contradiction method and arbitrary choices.*
  - (c) Asymmetric Chomp failure: 5 marks. (2 marks for identifying the violation of monotonicity, 3 for explaining why it fails in the variant.) *Common mistake: not linking to the poisoned cell and the harm of an extra move.*
  - (d) Contrast with mirroring: 6 marks. (3 marks for explaining why mirroring is constructive, 3 for why strategy stealing is not and the fundamental difference.) *Common mistake: confusing the two arguments or not highlighting the role of symmetry in mirroring.*

  Total: 20 marks.

  Word count: Question ~250 words, Model Answer ~500 words, Marking Scheme ~150 words. Total under 900 words.
answer: |-
  ### Essay Question

  Strategy stealing arguments establish that the first player has a winning strategy in games like Hex and Chomp without specifying any moves. Address all parts below in a unified essay.

  (a) **Premises and Monotonicity**: Strategy stealing relies on specific structural features of a game. Identify these features and explain why the property that "an extra move never harms the player who makes it" (monotonicity) is essential, not incidental.  
  (b) **Non-Constructiveness**: The argument proves a winner exists but provides no winning moves. Explain why it cannot produce a move, and argue whether this is a flaw in the proof or an inherent aspect of the result.  
  (c) **Failure Case**: Analyze "Asymmetric Chomp": played on an \(n \times m\) grid (\(n \neq m\)) with the bottom-left cell poisoned (loss on taking it). Moves remove a cell and all cells above and/or right of it. The first player starts. Explain why strategy stealing fails here, pinpointing the violated premise.  
  (d) **Contrast with Mirroring**: Mirroring arguments (e.g., for symmetric Hex) give explicit winning moves. Contrast these with strategy stealing: why can mirroring produce a first move while strategy stealing cannot?

  ---

  ### Model Answer (500 words)

  Strategy stealing non-constructively proves the first player wins certain games but cannot specify how, due to its reliance on monotonicity and contradiction, unlike constructive mirroring arguments.

  (a) Strategy stealing requires three features: the game must be deterministic with perfect information, zero-sum without draws, and *monotonic*—any extra move benefits (or at least does not harm) the player making it. Monotonicity is essential because it guarantees the first player can safely "steal" the second player’s hypothetical strategy after an arbitrary first move. Without it, the stolen strategy might force the first player into a harmful position when responding to the second player, undermining the contradiction. It is not throat-clearing; it ensures the extra move used in the stealing process cannot backfire.

  (b) The argument is non-constructive because it uses contradiction: assume the second player has a winning strategy; the first player makes any move, then "steals" the second player’s strategy. If the stolen strategy ever demands the first player’s initial move, they make an arbitrary extra move (relying on monotonicity to avoid harm), leading to a win—contradicting the assumption. This does not yield a move because it depends on the existence of the second player’s strategy (which is imaginary) and arbitrary choices during stealing. This non-constructiveness is not a defect; it reflects that the proof only establishes *existence* of a winning strategy, not its form. Demanding a move misinterprets the result.

  (c) In Asymmetric Chomp, strategy stealing fails because monotonicity is violated. An extra move can force a player to take the poisoned cell, causing immediate loss. For example, if the first player’s arbitrary extra move is the poisoned cell, it harms them. Without monotonicity, the first player cannot safely use the stolen strategy after an extra move, breaking the contradiction. Zugzwang (e.g., in chess endgames) also violates monotonicity but Asymmetric Chomp illustrates this with a different game structure, emphasizing that non-rectangular boards or poisoned cells disrupt the premise.

  (d) Mirroring arguments (e.g., for symmetric Hex) are constructive because they use board symmetry to define an explicit strategy: copy the opponent’s move across a symmetry axis. This tells the first player exactly what move to make initially (e.g., the center in symmetric Hex) and all subsequent moves. In contrast, strategy stealing relies on a hypothetical opponent strategy and contradiction, so it cannot specify moves—it only disproves the second player’s winning possibility. The difference stems from mirroring’s use of symmetry to build a playable strategy, while strategy stealing’s reliance on contradiction and monotonicity only proves existence.

  ---

  ### Marking Scheme (20 points)

  - **(a) Premises and Monotonicity (4 points)**:  
    - 2 points: Identify features (deterministic/perfect information, zero-sum/no draws, monotonicity).  
    - 2 points: Explain why monotonicity is essential (enables safe stealing; extra move cannot harm).  
    *Common mistake: Lists features but treats monotonicity as trivial or fails to link it to the stealing mechanism.*  

  - **(b) Non-Constructiveness (5 points)**:  
    - 2 points: Explain why no move is produced (uses contradiction; depends on hypothetical strategy and arbitrary choices).  
    - 3 points: Argue stance (e.g., not a defect as it proves existence; or inherent to the result).  
    *Common mistake: Claims it is a defect without engaging with the proof’s purpose, or omits the role of contradiction.*  

  - **(c) Failure Case (5 points)**:  
    - 2 points: Identify violated premise (monotonicity).  
    - 3 points: Explain failure in Asymmetric Chomp (extra move can take poisoned cell, causing loss; breaks contradiction).  
    *Common mistake: Cites zugzwang only or does not specify how the poisoned cell violates monotonicity.*  

  - **(d) Contrast with Mirroring (6 points)**:  
    - 3 points: Explain why mirroring is constructive (uses symmetry for explicit moves; e.g., copying).  
    - 3 points: Explain why strategy stealing cannot produce moves (relies on contradiction and hypotheticals).  
    *Common mistake: Equates the two arguments or misses that mirroring exploits symmetry for executable strategies.*  

  **Total: 20 points**
