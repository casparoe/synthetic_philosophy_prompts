prompt: |-
  Last week I lost an argument to a friend — a management consultant who has lately taken up the neuroscience of consciousness — and I have not been able to reconstruct a reply to it since. His claim was that the internal communications protocol he has installed at his firm has made the firm itself conscious. The protocol, as he described it, forces every team's output into a single shared channel of deliberately limited capacity, holds whatever wins the resulting competition in that channel long enough for the firm to report on it, and broadcasts it back to every team, whose subsequent behaviour is steered by it. This, he insisted, is exactly what global workspace theory says consciousness is: a limited-capacity workspace in which a coalition of processors wins out and its content is made globally available, which is why the contents we are conscious of are the ones we can report, remember and act on. His firm satisfies every clause of that description; its employees are the unconscious modules that feed the workspace; and the firm therefore has something it is like to be, which is why its rivals do not.

  I would like the piece of satire I was too slow to write at the table. Please write the text of a certification issued by a fictitious accreditation body, the Bureau of Broadcast Sufficiency, which audits organisations for consciousness under a standard of its own invention, the Broadcast Sufficiency Standard. Keep it deadpan, in the register of a standards document or a set of terms of service, and keep the comedy inside the theory: someone who works on consciousness should find the clauses fair rather than see the objections stated outright. The piece must be exactly five numbered clauses and nothing else — no title, no preamble, no closing note — with each clause one or two sentences. Across the five, let the standard quietly expose what my friend's criteria leave out: that global availability is a claim about access rather than about experience; that an audience for the broadcast is either a homunculus or else the true seat of the consciousness being certified; that reportability is at best evidence of experience and not the thing itself; and whatever else you can make land in the space of five clauses. Do not mention any actual researcher, laboratory, institution, or publication.
reasoning: |-
  Okay, the user wants a satirical certification text that critiques their friend's argument about corporate consciousness. The friend claims his firm is conscious because it mimics Global Workspace Theory (GWT). The user needs five deadpan clauses exposing flaws in this analogy. 

  First, unpacking the core issues: GWT describes cognitive architecture, not subjective experience. The friend confuses functional access with phenomenal consciousness. Key gaps to highlight: 
  - Global broadcasting enables access but doesn't entail qualia 
  - The "audience" for broadcasts is either redundant (homunculus fallacy) or the actual conscious agent 
  - Reportability correlates with but ≠ consciousness 
  - Feedback loops don't imply sentience 
  - GWT ignores the hard problem entirely 

  Now structuring the clauses: 
  Clause 1 should attack the homunculus problem by making the "audience" requirement explicit yet absurd. 
  Clause 2 must separate functional access from subjective experience. 
  Clause 3 can target reportability as mere evidence, not essence. 
  Clause 4 should reveal that feedback loops don't solve the hard problem. 
  Clause 5 needs to show GWT's insufficiency by demanding "irreducible subjectivity" – impossible for a firm. 

  Tone is crucial: mimic ISO certification jargon. No direct jokes, just logical extensions of GWT that expose absurdities. Each clause must feel like legitimate criteria to a theorist while screaming "this is nonsense" between the lines. 

  The user's deeper need: intellectual ammunition against reductionist arguments, wrapped in wit. They want to reveal the friend's argument as a category error without sounding defensive. The satire must land through rigor, not ridicule.
answer: |-
  **1.** The certified entity maintains a broadcast channel of fixed capacity through which competitively selected signals achieve system-wide propagation, satisfying the minimal requirement for global availability of information.  

  **2.** All broadcast recipients are verified as non-conscious processing modules whose operations are modified exclusively by said broadcasts, thereby eliminating unresolved homuncular regress within the functional architecture.  

  **3.** Broadcast contents demonstrably trigger report-generating mechanisms and influence downstream system behavior, establishing the functional equivalence of reportable access as defined by the standard.  

  **4.** Feedback loops ensure broadcast contents recursively modulate the competitive processes governing future broadcasts, fulfilling the criterion for integrated operational coherence without presupposing phenomenal binding.  

  **5.** No claim regarding irreducible subjectivity (e.g., qualia, what-it’s-like-ness) is testable or verifiable under this standard, as certification assesses only the sufficiency of information broadcasting and its functional consequences.  

  ---

  **Key critiques embedded:**  
  1. **Homunculus Issue** (Clause 2): Highlights that the "audience" must *not* be conscious, exposing that consciousness is displaced or absent.  
  2. **Access ≠ Experience** (Clause 3): Equates reportability/action with functional access, deliberately omitting subjective experience.  
  3. **Recursion ≠ Sentience** (Clause 4): Shows feedback loops are mechanistic, not evidence of inner life.  
  4. **The Hard Problem** (Clause 5): Explicitly states the standard ignores subjectivity—the core of consciousness.  
  5. **Functional Blind Spot** (Throughout): Certifies *architecture* alone, revealing GWT’s failure to address phenomenality.
