  At Honest Abe's Preference Emporium, Abe charges a shiny nickel per swap: banana for apple (you prefer apples today!), apple for cherry (cherries look divine now!), cherry for banana (well, that banana *is* tempting...). Each trade feels rational, each fee fair. After three loops, Abe’s grinning, your wallet’s lighter, and you’re back holding the same banana, minus ninety cents. "Ah," you sigh, pulling out your *favorite mug* you'd wisely glued the initial banana to this morning. "Sticking with Plan Banana. Sophisticated precommitment." Abe scowls at the mug: "Blasted ‘sophisticates.’ Always ruin a perfectly good pump by actually *thinking* diachronically."

