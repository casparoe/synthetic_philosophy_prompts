answer: |-
  Here is a focused 90-minute teaching plan designed for your quantitative, ethics-naive audience, adhering strictly to your stipulation and constraints. It prioritizes conceptual dependencies, leverages quantitative intuition, and preempts predictable misunderstandings.

  **Core Pedagogical Strategy:** Anchor abstract concepts in quantitative scaling familiar to engineers/scientists. Treat the lexical threshold as a *discontinuity* (like a phase transition in your low-T work) within an otherwise cardinal scale. Use scaling arguments to expose the qualitative difference between lexical priority and mere weighting.

  **Order of Components & Dependencies:**
  1.  **Aggregation of Similar States (15 mins):** Start with what they *know*: summing like quantities.
      *   *Example:* "If 100 people each lose $1, the total disutility is like one person losing $100. We sum homogeneous harms/benefits." (Dependency: This is foundational. Without accepting aggregation *within* categories, the rest is meaningless.)
  2.  **The Cardinal Scale Postulate (10 mins):** Introduce the stipulation's core axiom.
      *   *State Clearly:* "Assume *all* conscious experience – from mild pleasure to excruciating pain – maps onto a single numerical scale. A 'util' is a unit of this hedonic magnitude. Positive = enjoyment, Negative = suffering. We *can* compare magnitudes: -5 utils is worse than -2, +3 is better than +1." (Dependency: This must be accepted *before* the threshold makes sense as a *point* on *this scale*. Without one scale, a threshold has no defined location.)
  3.  **Introducing the Threshold & Lexical Priority (20 mins):** Define the discontinuity.
      *   *State Clearly:* "There exists a specific negative utility value, `-T`, on this scale. Suffering *above* `-T` (i.e., less intense: -T > x >= 0) and enjoyment (+y) are aggregated normally. Suffering *below* `-T` (i.e., more intense: x < -T) is *lexically prior*. No finite amount of suffering above `-T` OR any amount of enjoyment can outweigh *even one instance* of suffering below `-T`." (Dependency: Requires the cardinal scale (Step 2) to define `-T`. Aggregation (Step 1) applies only above/below, not across.)
  4.  **Commensurability Question (15 mins):** Now pose the paradox the threshold *creates*.
      *   *Pose the Question:* "The scale says we *can* assign numbers. But the lexical rule *blocks* trade-offs across the threshold. So, is pleasure/pain truly *commensurable*? Below `-T`, yes (utils sum). Across `-T`, no (utils are incomparable for trade-offs). The scale exists, but its use for aggregation has a fundamental limitation." (Dependency: Threshold (Step 3) forces the question. Without the threshold blocking trade-offs, commensurability is trivial.)

  **The Single Example: Waterboarding vs. Mosquito Bites**
  *   **Scenario:** One person undergoes 1 hour of waterboarding (widely recognized as torture causing intense suffering, stipulated as `x < -T`). Compare this to imposing a vast number of minor annoyances: say, a brief, barely noticeable mosquito bite (`-ε`, where `0 > -ε > -T`).
  *   **Scale It:** Ask: "How many mosquito bites (`N`) would it take to make the *total disutility* equal to one hour of waterboarding?" Under aggregation (Step 1) & cardinality (Step 2): `N * (-ε) ≈ x` → `N ≈ |x / ε|` (a huge but finite number).
  *   **Lexical Threshold Verdict:** Because waterboarding is stipulated `x < -T`, **NO** finite `N` (no matter how large) justifies inflicting the waterboarding to avoid the bites. The waterboarding *cannot* be traded away.
  *   **Heavily Weighted Verdict:** A utilitarian heavily weighting intense pain might set `N = K * |x / ε|` (where `K >> 1`, e.g., 1000x larger). But crucially, a sufficiently large `N` *could* outweigh it. The lexical view says *no* `N` is sufficient.
  *   **Why NOT "Irritations vs. Agony"?** Your candidate (`large number of irritations vs. one agony`) conflates scaling *intensity* (agony vs. irritation) with the *threshold effect*. "Agony" might be above or below `-T`; "irritation" is almost certainly above. The crucial test is scaling *quantity* of mild harms against a *fixed* intense harm known to be below `-T`. Waterboarding vs. bites forces focus on quantity scaling against a clear threshold-crossing harm.

  **Misconceptions & Preemption:**
  1.  **"Threshold = Very Large Weight" (Preempt at Step 3):** When defining lexical priority, immediately contrast: "This is NOT saying 'suffering below -T is 10,000 times worse'. Weighting implies a finite multiplier. Lexical priority means *infinite* weight relative to above-threshold states in trade-offs. No finite multiplier suffices."
  2.  **"Cardinal Scale = Thermometry" (Preempt at Step 2 & 4):** When introducing the scale, state: "We're *stipulating* a cardinal scale exists for argument's sake. This doesn't mean we have a 'hedonometer'. It's a theoretical construct. The question is whether this scale allows *meaningful trade-offs* across all values, given the lexical rule." Reiterate during Commensurability (Step 4): "The scale isn't invalid; its *use for aggregation* is restricted."
  3.  **"Denies Common Currency" (Preempt at Step 4):** Explicitly state: "The view *affirms* a common currency (utils) *below the threshold*. Enjoyment and mild suffering *can* be traded using utils. It *denies* that this currency works *across the threshold*. Utils below `-T` are in a different 'economy'."
  4.  **"Line-Drawing Fallacy!" (Preempt at Step 3 & manage throughout):** Acknowledge it early: "You might object: 'Where exactly is `-T`? This is vague!' That's a valid concern *for applying the theory*, but **not** for understanding its *logical structure*. Today, we accept `-T` exists (like a phase transition point) to explore the *implications* of such a discontinuity, regardless of precise measurement." If raised, reiterate: "We're examining the structure assuming `-T` is defined, much like assuming a frictionless plane in physics."

  **Diagnostic Question (Final 5 mins):**
  *   **"Would this view *ever* permit the deliberate infliction of one instance of suffering known to be below `-T` (e.g., torture), if the *only* alternative was the existence of an arbitrarily large, but finite, number of instances of suffering *above* `-T` (e.g., mild headaches for billions) AND no other consequences?"**
  *   **Why it works:** A "No" indicates understanding lexical priority (no finite number outweighs the torture). A "Yes" suggests either rejection of the view, misunderstanding (thinking `-T` is just a heavy weight), or overlooking the "no enjoyment" clause (the question specifies only above-`-T` *suffering* as the alternative). Follow-up probes can distinguish these.

  **What to Refuse (State Explicitly When Needed):**
  1.  **Debating the Exact Location of `-T`:** "As stated earlier, the precise location of `-T` is a critical issue *for applying* this view, but it's secondary today. We're focused on the *structural implications* of *assuming* such a threshold exists on a cardinal scale. We won't resolve measurement now."
  2.  **Ontology of Pleasure/Pain:** "We won't debate today whether pleasure and pain *are* fundamentally commensurable in reality. Our starting point is the *stipulation* that they lie on one cardinal scale. The session explores the consequences *within that assumption*."
  3.  **Comparison to Other Utilitarianisms:** "We're examining *this specific stipulated view* in isolation today. We won't contrast it with classical utilitarianism, prioritarianism, or other forms of negative utilitarianism. That's for another session."

  **90-Minute Flow:**
  1.  (0-15 min) **Aggregation & Cardinal Scale:** Intro, Step 1 & 2. Simple examples summing mild harms/benefits. Establish the cardinal scale postulate.
  2.  (15-35 min) **Threshold & Lexical Priority:** Step 3. Define `-T` and lexical priority. **Waterboarding vs. Mosquito Bites** example introduced and scaled (aggregation calc vs. lexical verdict). **Preempt "Weight" misconception.**
  3.  (35-50 min) **Commensurability:** Step 4. Pose the paradox. Revisit example: Cardinal scale exists, but trade-off blocked. **Preempt "Thermometry" & "Common Currency" misconceptions.** Briefly acknowledge but refuse line-drawing debate.
  4.  (50-70 min) **Deep Dive & Misconception Busting:** Explore variations. *What if the bites were slightly worse but still above `-T`?* (Answer: Still finite N needed under aggregation, still blocked lexically). *What if we add massive enjoyment?* (Answer: Still blocked - lexical priority over *any* above-threshold state). Actively solicit and correct predicted misconceptions using the example.
  5.  (70-85 min) **Application & Diagnostic:** Pose hypothetical scenarios testing the logic (e.g., a medical experiment causing one guaranteed case of torture-level suffering to find a cure for all non-threshold diseases). Discuss. Pose the **Diagnostic Question**. Gauge responses.
  6.  (85-90 min) **Wrap-up:** Briefly restate the core structure: One scale, aggregation within zones, lexical veto across the threshold. Emphasize the stipulated nature and the focus on internal logic.

  This plan leverages your audience's quantitative strength (scaling, aggregation, discontinuities) while directly confronting the philosophical novelty (lexical priority as non-finite weighting) of the stipulated view. It keeps the core example central and proactively manages the major stumbling blocks.
