  The diagnostic question should force application: "Would you accept a society with mild universal discomfort to eliminate extreme torture?" A "no" suggests lexical understanding; a "yes" indicates either rejection or weighted thinking.

  Boundaries to set:
  - No debate on threshold location (emphasizing structure over implementation)
