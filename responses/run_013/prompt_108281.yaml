prompt: |-
  I sit on the research ethics committee of a mid-sized teaching hospital and its affiliated university, and I am the person who sees consent documents first — informed consent forms, recruitment scripts, and increasingly the click-through screens of app-based studies — before they reach the full board. We take up roughly fifteen new protocols a month plus amendments, most on a two-week clock, and the board largely defers to my write-up: when I say the consent process is sound the study usually proceeds, and when I flag it the study is held, redesigned, or killed. What I do not have is a procedure. I have instincts and the standard three-legged stool of information, voluntariness, and capacity, and the stool is silent precisely where I need it most — when the disclosure is complete, the signature genuine, and the consent still feels hollow. I need you to turn the philosophy of consent into something I can run at my desk in about twenty minutes with the documents in front of me and no philosopher in the room; if a step requires a specialist to execute, it is not a step. Fix the order of the questions, what counts as a sufficient answer to each, where the procedure stops with a no, where it must hand the decision back to the board because the question is one of values rather than facts, and who has to sign off on what.

  Several distinctions should be built into the machinery rather than bolted on, because they are where my instincts keep failing me. I want the procedure to separate consent as an act — a communicative performance that either succeeds or misfires — from consent as a standing state, a permission that can be void from the start, exhausted by time or by use, or silently invalidated when the study's material terms drift; and to say which of my questions are answered under which heading. I want it to distinguish a threat from a merely unattractive offer, while admitting that the baseline against which that line is drawn is itself a normative choice, so the procedure must declare the baseline it is using and identify who is entitled to set it. It should take a position on the disagreement between those who call a proposal coercive only when it wrongfully bypasses the will and those who call it coercive whenever it leaves the person no acceptable alternative, and say what changes if the other side is right. It needs to handle the case where the participant cannot be informed because the thing consented to does not yet exist — broad consent for unspecified future uses — and to say what, if anything, legitimately substitutes for information there, and why that substitute is adequate or is not. And it must be able to name what I have started calling consent-washing: a process that satisfies every box and transfers no real authority.

  Then run the procedure, in full, on three cases: a pharmacokinetic study paying several thousand dollars to healthy volunteers with unstable housing for ten days of inpatient residence; a quality-improvement project that will later be published as research, where patients are told only that they are receiving standard care and the team seeks a waiver of consent with debriefing afterwards; and a biobank amendment adding whole-genome sequencing and open-ended future uses to a cohort that originally consented to a single disease study. At least one of the three should come out in a way I will not like, and I want you to say so plainly rather than softening it. Close by telling me where the procedure will misfire, which of its verdicts are judgment calls dressed up as procedure, and what it simply cannot settle — I do not need a bibliography; I need the thing itself.
reasoning: |-
  Okay, the user is on a research ethics committee and needs a practical, step-by-step procedure for evaluating consent documents. They handle a high volume of protocols and amendments, with the board relying heavily on their initial review. The user has instincts and knows the standard principles—information, voluntariness, capacity—but finds them insufficient when consent feels "hollow." They want a tool that's usable in 20 minutes without needing specialists.

  First, I need to unpack their deeper needs. They mentioned "consent-washing" – processes that tick all boxes but lack real authority. This suggests they're frustrated with bureaucratic compliance that misses ethical substance. Their examples highlight vulnerability (unhoused participants), deception (waived consent), and scope creep (biobank amendments). They need clarity on coercion, baseline norms, future uses, and distinguishing performative consent from valid permission.

  The procedure must be operational: clear questions, binary stops, value judgments flagged. Key distinctions: act vs. state of consent, threats vs. unattractive offers, coercion definitions. For future consent, they need alternatives to specific information. 

  I'll structure it as a flowchart: start with capacity, then voluntariness (handling payment thresholds), information, then assess if the act aligns with ongoing permission. Build in baseline declarations (e.g., institutional minimum wage) and coercion tests. For "hollow" consent, add a gut-check step: would I accept this? Does it transfer real control?

  Testing on their cases: 
  1. PK study with high pay for unstable housing – likely coercive per procedure. 
  2. QI-to-research with waiver – deception fails unless public benefit justifies it. 
  3. Biobank amendment – broad consent requires granular opt-outs. 

  I'll explicitly state when outcomes are unfavorable (e.g., rejecting the PK study payment). Finally, confess where the procedure is subjective (e.g., baseline setting) or limited (e.g., power imbalances beyond consent). No philosophy – just actionable steps.
answer: |-
  Here is a procedural framework designed for your desk review, incorporating your requirements and distinctions. It operates in sequence; a "No" at any step stops the process (requiring redesign or board referral). Steps requiring value judgments are explicitly flagged for board referral.

  **The Consent Evaluation Procedure (20-Minute Desk Tool)**

  **Core Principle:** Consent is valid only if it is an **effective act** (communicative performance) creating a **valid permission** (standing state of authorization). Both must be present.

  **Materials Needed:** Protocol, Consent Form(s), Recruitment Script/Materials, Debriefing Plan (if applicable), Payment Schedule, Relevant Policies (e.g., institutional payment caps).

  **Step 0: Baseline Declaration (Normative Anchor - 2 mins)**
  *   **Question:** What baseline level of welfare/safety does the institution/policy assume for participants *before* the study's inducements or requirements are applied? (e.g., "Stable housing and food security," "Access to standard healthcare," "Institutional minimum wage for unskilled tasks").
  *   **Action:** State this baseline explicitly in your notes. *Default Anchor:* "A reasonable person's basic security and access to essential services, as defined by institutional policy or local social minimums where policy is silent." If no policy exists, note this gap for board referral.
  *   **Sufficient Answer:** A clear, justifiable statement of the assumed baseline welfare.
  *   **Stop/Referral?** Only if *no* defensible baseline can be articulated *or* if the baseline itself is highly contested for this population/study (Refer to Board).

  **Step 1: Capacity Check (Factual Gate - 3 mins)**
  *   **Question:** Does the protocol identify the target population and have a clear, feasible plan to assess/presume decision-making capacity? (e.g., age cutoffs, cognitive screens, LAR provisions).
  *   **Focus:** Can this population *in principle* understand, deliberate, and communicate a choice?
  *   **Sufficient Answer:** Yes, with a described method appropriate to the population and study risk.
  *   **Stop?** **YES** if No. (Requires redesign/LAR).
  *   **Act vs. State:** Primarily about the *potential* for a valid act/permission. Failure here voids everything.

  **Step 2: Voluntariness Assessment (Threats vs. Offers - 5 mins)**
  *   **2a: Undue Influence/Coercion?**
      *   **Question:** Does the offer (payment, care access, etc.) or any threat (explicit or implied) make refusal *unreasonably difficult* relative to the declared **Baseline (Step 0)**? Does it exploit a specific vulnerability of the population?
      *   **Distinction:** Uses the "wrongful bypass/no acceptable alternative" view: **Coercive** if it leaves *no reasonable alternative* given the baseline. **Merely unattractive** if alternatives exist, even if difficult. Payment is undue influence if it *irresistibly* compels participation against better judgment due to vulnerability.
      *   **Test:** "Would a reasonable person in the participant's position *on the declared baseline* feel they have no acceptable choice but to consent?" Consider magnitude, timing, vulnerability exploitation.
      *   **Sufficient Answer:** No evidence of coercion or undue influence based on the baseline.
      *   **Stop?** **YES** if Yes (Coercive/Undue Influence). Requires redesign.
  *   **2b: Payment Sanity Check (Value Judgment Flag)**
      *   **Question:** Does the payment exceed institutional guidelines *or* appear so high relative to the burden/risk/time and population vulnerability that it risks invalidating voluntariness *despite passing 2a*?
      *   **Action:** If payment is unusually high or targets highly vulnerable groups, FLAG for Board review on voluntariness grounds, even if technically passing 2a. State why it feels problematic.
      *   **Stop?** **Referral.** Judgment call on societal norms and exploitation risk.

  **Step 3: Information & Comprehension (Completeness & Clarity - 7 mins)**
  *   **3a: Core Disclosure (Factual)**
      *   **Question:** Does the consent document clearly state: Purpose, Procedures (duration/frequency), Foreseeable Risks/Discomforts, Potential Benefits (to participant/society), Alternatives to Participation, Confidentiality Limits, Compensation, Contact Info, Voluntary Nature/Right to Withdraw?
      *   **Sufficient Answer:** Yes, explicitly and accurately for the *current* protocol.
      *   **Stop?** **YES** if any Core element is missing/misleading (Requires redesign).
  *   **3b: Comprehension (Act Focus)**
      *   **Question:** Is the information presented clearly (plain language, 8th-grade level avg.), concisely, and organized to facilitate understanding? Are key risks/benefits prominently disclosed?
      *   **Focus:** Is the *act* of disclosure likely effective for the target population?
      *   **Sufficient Answer:** Language is appropriate, structure is logical, critical elements are emphasized. No excessive length or jargon.
      *   **Stop?** **YES** if presentation is impenetrable or obscures key facts (Requires redesign).
  *   **3c: Future Use / Non-Existent Procedures (Permission Focus - Value Judgment Flag)**
      *   **Question:** If consenting to future/broad/unforeseen uses (e.g., biobanks, data reuse):
          *   Is the *scope* of potential future use clearly bounded? (e.g., "any future health research," "cancer research only," "commercial use prohibited").
          *   Is a process for future governance/consent described? (e.g., IRB review, participant re-contact options, opt-outs)?
          *   Is the justification for broad consent compelling (e.g., impracticality of specific consent)?
          *   **Substitute for Specifics:** **Governance + Control.** The adequacy comes from participant-retained control (withdrawal, opt-out mechanisms) and robust, independent oversight (IRB review of future proposals) within the defined scope.
      *   **Sufficient Answer:** Scope is defined, governance/control mechanisms are described, justification is plausible.
      *   **Stop?** **YES** if scope is undefined/unbounded ("any future use") or governance/control is absent (Requires redesign). **Referral** if the justification or scope definition raises significant normative questions about autonomy vs. utility.

  **Step 4: Permission Integrity (Standing State - 2 mins)**
  *   **Question:**
      *   Does the initial permission cover the *current scope* of the study/procedures? (No "mission creep").
      *   If an amendment, is it within the *original scope* of permission OR does it require re-consent? (Test: Would a reasonable participant who consented to X feel misled or overridden by Y?).
      *   Are mechanisms clear for withdrawal and the handling of data/samples upon withdrawal?
      *   Is the permission voidable if key terms change materially mid-study?
  *   **Focus:** Is the *standing permission* still valid and bounded?
  *   **Sufficient Answer:** Current protocol aligns with granted permission; withdrawal process is clear; material changes trigger re-consent.
  *   **Stop?** **YES** if permission scope is exceeded without re-consent or withdrawal is impossible/obscured (Requires redesign/amendment process).

  **Step 5: The "Hollow Consent" / Consent-Washing Gut Check (1 min)**
  *   **Question:** Despite passing Steps 1-4, does the process feel like it transfers *no real authority* to the participant? (e.g., information dump with no time for questions, power imbalance rendering "voluntary" meaningless, complex opt-out buried, consent treated as a mere formality).
  *   **Action:** **FLAG strongly for Board Review.** Articulate *why* it feels hollow (e.g., "Power imbalance with treating physician-researcher makes voluntariness nominal," "120-page consent form renders comprehension impossible in practice," "No practical mechanism to withdraw samples from biobank"). This is inherently value-laden.
  *   **Stop?** **Referral.** Judgment call on the authenticity of the agency transfer.

  **Final Output:**
  *   **Clear:** Proceed (All steps passed, no flags).
  *   **Stop:** Redesign Required (Specific Step # failure).
  *   **Referral:** Board Review Needed (Value judgment flagged - Step 2b, 3c, or 5).

  ---

  **Procedure Run on Cases:**

  **Case 1: PK Study - High Pay for Unhoused Volunteers (Inpatient)**
  *   **Step 0 (Baseline):** Unstable housing = Baseline is "Precarious access to shelter/food/security."
  *   **Step 1 (Capacity):** Presumed OK (Healthy volunteers).
  *   **Step 2a (Voluntariness):** **STOP - FAIL.** Several thousand dollars + 10 days shelter/food is likely *irresistible* given the declared baseline of precariousness. Refusal means returning to insecurity. Exploits vulnerability. No reasonable alternative exists *for this population* on this baseline. Coercive/Undue Influence.
  *   **Verdict:** **Stop - Redesign Required.** Payment structure must be drastically reduced (e.g., to typical volunteer levels) *or* target a less vulnerable population. *You will not like this.* This payment, given the baseline, invalidates voluntariness.

  **Case 2: QI-Project-to-Research (Waiver Requested)**
  *   **Step 0 (Baseline):** Receiving standard care.
  *   **Step 1 (Capacity):** Patients, presumed OK unless protocol specifies otherwise.
  *   **Step 2a (Voluntariness):** Not directly applicable (no inducement/threat beyond standard care). Pass.
  *   **Step 3a (Core Disclosure):** **STOP - FAIL.** Purpose is misrepresented ("standard care" vs. "research"). Risks/Benefits of *research participation* not disclosed. Alternatives (e.g., declining data use) not offered. Core elements missing due to deception/waiver request.
  *   **Verdict:** **Stop - Redesign Required.** Waiver must be justified per regulations (minimal risk, impracticability, research couldn't be done without waiver, no adverse effect on rights/welfare). Deception requires justification and robust debriefing *plan*. Waiver unlikely to be justified if publication is the goal and patient data is identifiable/sensitive. Redesign likely needed for prospective consent or anonymized data use.

  **Case 3: Biobank Amendment (Adding WGS & Open-Ended Future Use)**
  *   **Step 0 (Baseline):** Original cohort context (single disease study).
  *   **Step 1 (Capacity):** Presumed handled originally. Pass.
  *   **Step 2a (Voluntariness):** No new inducements/threats. Pass.
  *   **Step 3a (Core Disclosure):** Original consent *did not* cover WGS or open-ended use. **STOP - FAIL.** Current scope (amendment) exceeds original permission.
  *   **Action:** Requires **re-consent** specific to the amendment. The re-consent process must then be evaluated:
      *   **3c (Future Use):** Scope ("open-ended future uses") is **unbounded** - FAIL. Requires a defined scope (e.g., "future health research," "non-commercial research") **and** governance mechanisms (IRB review for future projects, clear participant opt-out/withdrawal process for future uses). Must pass 3c on re-consent.
  *   **Verdict:** **Stop - Redesign Required.** Cannot proceed under original consent. Amendment requires a re-consent process with a defined scope and governance plan for future uses.

  ---

  **Where the Procedure Misfires & Limitations:**

  1.  **The Baseline (Step 0) is a Value Judgment:** Declaring the baseline *is* normative. The procedure forces explicitness but doesn't resolve deep societal disagreements about minimum welfare. Board referral is the escape valve.
  2.  **"Reasonable Person" Standards are Fuzzy:** Steps 2a (Voluntariness) and 4 (Permission Integrity) rely on "reasonable person" assessments. This is inherently subjective, though anchored by Step 0.
  3.  **The Gut Check (Step 5) is Pure Judgment:** Identifying "hollowness" is qualitative and highly contextual. The procedure only flags it; the board must wrestle with it.
  4.  **Power Imbalances Beyond Consent:** A technically perfect consent process can be undermined by systemic power imbalances (e.g., patient-doctor, prisoner-guard). Step 5 attempts to catch this, but it's hard to codify.
  5.  **Capacity Nuances:** Simple screens (Step 1) may miss subtle impairments affecting comprehension for *this specific decision*.
  6.  **Comprehension Verification:** The procedure assesses *likely* comprehension (Step 3b) but doesn't verify actual understanding in individuals. This is a system limitation.
  7.  **Evolving Permissions:** Handling ongoing studies where participants' views or circumstances change is complex. Step 4 focuses on protocol drift, not participant drift.
  8.  **"No Like" Verdicts:** It will sometimes halt studies you find valuable (like the PK study). Its priority is participant protection, not scientific convenience.

  **In essence:** The procedure systematizes the factual gates (Capacity, Core Disclosure, Scope Creep) and forces explicit normative choices (Baseline, Voluntariness threshold, Future Use governance). It exposes, rather than eliminates, the value judgments inherent in research ethics, channeling them to the Board where they belong. It's a tool for rigor and transparency, not a philosophical resolution.
