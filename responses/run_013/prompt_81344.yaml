prompt: |-
  Write me a mock insurance policy — the full fine print of an invented product, something like "Famine & Food-Security Indemnity, Form 7B," sold by a made-up international underwriter to governments and aid agencies. Numbered clauses, roughly 800 words, deadpan legalese the whole way through, no winking at the reader.

  The joke should be built into the product: the policy has to decide, in writing and in advance, when a famine counts as an Act of God and when it counts as a political act, because the payout is wildly different in the two cases. So the definitions section should quietly commit to an entitlement-style view of famine — endowments, exchange entitlements, the difference between food not being available in a region and food being unavailable to a particular group of people — without ever announcing that's what its doing. Some things to work in:

  - a definition of "famine" with mortality and child-wasting thresholds, plus a note that the thresholds were "calibrated to avoid over-triggering"
  - an exclusion for losses arising from "collapse of exchange entitlements," which the policy classifies as a pre-existing condition
  - a rider for famines that occur while regional food output is flat or rising — the claims adjuster finds these confusing and the policy says so
  - seperate clauses for export bans, requisitioning, and procurement quotas, each assigned a different liability
  - subrogation: the insurer reserves the right to recover from the sovereign, with a recovery schedule ranking which governments it considers worth pursuing
  - moral hazard: what happens when the insured government is also the body that classifies the event
  - a cheerful customer-service page at the end, with a claims form

  It should be funny to someone who's read Sen on famines and still readable to someone who hasn't, and the reader should finish it feeling that the natural/political distinction is doing political work rather than descriptive work — but the document itself must never admit that. No real quotations and no citations, obviously.
reasoning: |-
  We are creating a mock insurance policy for "Famine & Food-Security Indemnity, Form 7B". The policy is sold by a made-up international underwriter (we'll call it "Global Indemnity Group" or GIG) to governments and aid agencies.

  Key elements to include:
  1. Definitions section that sets thresholds for famine (mortality and child-wasting) and notes they are calibrated to avoid over-triggering.
  2. A distinction between "Act of God" (natural causes) and political acts, with different payouts.
  3. An exclusion for losses from "collapse of exchange entitlements" (classed as a pre-existing condition).
  4. A rider for famines that occur while regional food output is flat or rising (with a note that these are confusing to claims adjusters).
  5. Separate clauses for export bans, requisitioning, and procurement quotas, each with different liability.
  6. Subrogation clause: insurer reserves the right to recover from the sovereign, with a recovery schedule ranking governments.
  7. Moral hazard: when the insured government is also the body that classifies the event.
  8. Cheerful customer-service page at the end with a claims form.

  The tone must be deadpan legalese, no winking. The humor comes from the product design and the way it handles the natural/political distinction.

  Let's structure the document:

  I. Preamble (Policy Number, Parties, Effective Date, etc.)
  II. Definitions
  III. Covered Events and Exclusions
  IV. Conditions and Triggers for Payout
  V. Special Riders and Endorsements
  VI. Claims Procedure
  VII. Subrogation
  VIII. General Provisions (including moral hazard clause)
  IX. Customer Service and Claims Form

  We'll aim for about 800 words.

  Note: We are inventing legal-sounding language without real citations.

  Let's write.
answer: |-
  **GLOBAL INDEMNITY GROUP**  
  **FAMINE & FOOD-SECURITY INDEMNITY POLICY**  
  **FORM 7B (SOVEREIGN & AGENCY EDITION)**  
  **POLICY NUMBER: GIG-FFS-7B-X0001**  

  **EFFECTIVE DATE:** 01 JANUARY 2025  
  **ISSUED TO:** [INSERT SOVEREIGN/AGENCY NAME]  
  **UNDERWRITTEN BY:** Global Indemnity Group (GIG), Bermuda  

  ---

  ### **I. DEFINITIONS**  
  1. **Act of God**: A Famine Event (as defined herein) arising exclusively from Natural Perils, including but not limited to: drought, flood, cyclone, pestilence, or volcanic eruption, where human agency does not materially contribute to food unavailability.  
  2. **Famine Event**: A condition meeting all thresholds below, verified by GIG-appointed auditors:  
     a. Crude Mortality Rate (CMR) ≥ 2/10,000 persons/day sustained over 90 days.  
     b. Weight-for-Height Z-score (WHZ) ≤ -3 in ≥ 30% of children under five in the Affected Region.  
     *Note: Thresholds calibrated to avoid over-triggering; isolated shortfalls do not constitute an Event.*  
  3. **Exchange Entitlement**: The legally enforceable capacity of a person or household to acquire food via trade, labor, or transfer within prevailing market or institutional frameworks.  
  4. **Pre-Existing Condition**: Any systemic vulnerability predating policy inception, including but not limited to: structural market fragmentation, discriminatory legal frameworks, or chronic asset depletion.  
  5. **Political Act**: Any Famine Event materially influenced by human agency, including legislative, administrative, or coercive measures.  

  ---

  ### **II. COVERED EVENTS & EXCLUSIONS**  
  6. **Covered Natural Perils (Act of God)**:  
     a. Payout: USD 5,000 per excess mortality case, subject to Clause 12.  
     b. Exclusions: Losses occurring where regional food output (RFO) is stable or rising (see Rider 7B-R1).  
  7. **Covered Political Acts**:  
     a. Payout: USD 500 per excess mortality case, subject to Clauses 8–10.  
     b. Exclusions:  
        i. Losses arising from collapse of Exchange Entitlements (classified as Pre-Existing Condition).  
        ii. Events where food is physically present in the Affected Region but distributionally constrained.  
  8. **Political Act Sub-Categories**:  
     a. **Export Ban**: Liability capped at 40% of Natural Peril payout.  
     b. **Requisitioning**: Liability capped at 25% of Natural Peril payout.  
     c. **Procurement Quotas**: Liability capped at 15% of Natural Peril payout.  

  ---

  ### **III. SPECIAL RIDERS**  
  9. **RIDER 7B-R1 (PARADOXICAL OUTPUT RIDER)**:  
     a. Applies where Famine Event occurs while RFO is flat or rising (±5% year-on-year).  
     b. Payout reduced by 90% for Natural Peril claims.  
     c. *Adjuster Note: Such scenarios indicate anomalous causation; proof of causality may require third-party forensic audit at Insured’s expense.*  

  ---

  ### **IV. CLAIMS PROCEDURE**  
  10. **Notification**: Insured must notify GIG within 30 days of Famine Event onset, submitting:  
      a. Certified mortality/Wasting data (WHO/FAO methodology).  
      b. RFO metrics from two independent agronomists.  
      c. Affidavit attesting no material contribution by Insured to Event causation.  
  11. **Verification**:  
      a. GIG reserves right to deploy auditors to validate thresholds.  
      b. If Insured is also the region’s data custodian (e.g., national statistical office), evidence must be countersigned by a GIG-approved NGO (List Annex A).  
  12. **Payout Calculation**:  
      a. Excess mortality = Total deaths minus 5-year baseline.  
      b. Deductions apply for Pre-Existing Conditions (Clause 4).  

  ---

  ### **V. SUBROGATION & RECOVERY**  
  13. **Right of Recovery**: GIG may pursue subrogation against any sovereign entity materially contributing to a Political Act Famine.  
  14. **Recovery Schedule**: Claims prioritized per sovereign creditworthiness:  
      a. **Tier 1 (High Recovery Likelihood)**: IMF program participants, investment-grade debt.  
      b. **Tier 2 (Medium)**: Low-middle-income nations, non-sanctioned regimes.  
      c. **Tier 3 (Low)**: Highly indebted poor countries, sanctioned regimes (no recovery attempted).  

  ---

  ### **VI. GENERAL PROVISIONS**  
  15. **Moral Hazard Mitigation**:  
      a. If Insured classifies the Event (e.g., declares famine), payout requires validation by a GIG-appointed panel.  
      b. Misclassification voids coverage.  
  16. **Exchange Entitlement Exclusion**:  
      a. No coverage for losses traceable to diminution of Exchange Entitlements, regardless of cause.  
      b. Pre-Existing Conditions are uninsurable under this policy.  
  17. **Policy Voidance**:  
      a. If food is physically available in the Affected Region but inaccessible to subpopulations due to non-physical barriers.  

  ---

  ### **VII. CUSTOMER SERVICE**  
  **WE’RE HERE TO HELP!**  
  Contact GIG Claims Department:  
  - Tel: +1 (441) 555-0199  
  - Email: claims@gig.bm  
  - Web: www.globalindemnitygroup.bm/ffs-claims  

  **CLAIMS FORM 7B-C1 (SUMMARY)**  
  [ ] NATURAL PERIL [ ] POLITICAL ACT  
  AFFECTED REGION: _____________  
  EVENT START DATE: ___/___/___  
  EXCESS MORTALITY: _______  
  WASTING RATE: _______%  
  RFO TREND: [ ] Rising [ ] Flat [ ] Falling  
  ATTACH: (1) Data Pack, (2) Auditor Cert., (3) Causation Affidavit  

  *Global Indemnity Group: Securing Stability Since 1987.*  

  ---  
  **END OF POLICY**  

  *Note: This policy is governed by Bermuda law. Disputes subject to arbitration under ICC Rules, London. Premiums non-refundable. Coverage void where prohibited by sanctions.*
