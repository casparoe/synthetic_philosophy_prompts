  - Identity: same object throughout, just described differently
  - Eliminativist view: only clay exists throughout (agrees with identity here)

  The crucial feature is the "museum object" status - remove it and we're back to ordinary statue/clay puzzle. The strongest objection would be that institutional status doesn't genuinely affect ontology, just our descriptions. 

  This forces identity view to accept that existence depends on non-physical facts, or else implausibly claim the artwork never existed. The cost is denying institutional practices have any ontological weight - which seems counterintuitive given how we treat artworks.
answer: |-
  Here is the thought experiment:

  > A conserved ceramic vase, physically intact and unchanging, sits in a museum storage. Its accession record lists it as "Attic Vase, 5th c. BCE." New scholarship conclusively proves it is a 19th-century forgery. Upon verifying this, the curator updates the database: the object is formally deaccessioned as an ancient artwork and redesignated "Study Collection: Modern Forgery." No physical alteration occurs; the vase remains untouched in the same location. The moment the database entry saves, the museum ceases to insure it as a cultural artifact and removes it from the permanent collection inventory.

  ### Demonstration:
  1.  **Constitution View:**
      *   *Before:* Two coincident objects exist: a lump of clay and a statue (the ancient artwork).
      *   *After:* Only the lump of clay exists. The statue (the artwork) ceases to exist at the moment of deaccession.
      *   *Why:* The statue's existence depends on its historical origin and institutional recognition *as that artwork*. Changing these relational/normative properties (authenticity, status as museum artifact) destroys the statue, even though the constituting matter remains intrinsically unchanged. The lump persists as it depends only on the matter's physical cohesion.

  2.  **Identity View:**
      *   *Before:* One object exists: the statue (which is identical to the lump of clay).
      *   *After:* The same object exists, now accurately described as a lump of clay or a forgery, but not as an ancient statue.
      *   *Why:* There is only one object throughout. A change in descriptive properties (authenticity, institutional status) doesn't change the object's numerical identity; it merely changes how we correctly *describe* or *classify* the single, persistent entity constituted by that matter.

  3.  **Eliminativist View ("No Statues, Only Lumps"):**
      *   *Verdict:* Only the lump of clay exists before and after the change.
      *   *Alignment:* This lands with the **Identity View** on the *outcome* (only one object persists), but for starkly different *reasons*. The Eliminativist denies statues exist *at all*, so the deaccession changes nothing ontological – just our (mistaken) description of the lump. The Identity View accepts the statue existed *as a phase* of the lump.

  ### Analysis
  *   **The Crucial Feature:** The object's status as an **institutionally recognized, authentic cultural artifact** (a "museum object" in the full normative sense). This status depends entirely on relational/historical facts (provenance, expert consensus) and normative facts (institutional policies, cultural value assignment).
  *   **Consequence of Removal:** If this institutional/art-historical status feature is deleted, the case collapses into the ordinary lump-and-statue puzzle. The disagreement would hinge solely on whether arranging matter statue-wise creates a new entity (Constitution) or re-describes the lump (Identity), revolving only around physical arrangement and function.
  *   **Strongest Objection (From Identity View Defender):** "The case illicitly assumes that 'being an ancient statue' is an *existence-conferring* property rather than merely a *correct description*. The object's persistence conditions are purely physical (spatiotemporal continuity of the matter). Before deaccession, the object *was* a lump *misdescribed* as an ancient statue. After deaccession, it's the same lump *correctly described* as a forgery. Nothing ontological changes; only our epistemic and institutional labels do. The Constitution View mistakenly reifies institutional categories into distinct objects."
  *   **Answering the Core Question:** The case **shows the Identity View cannot escape allowing an object's existence (as a statue/artwork) to depend on non-physical facts.** To maintain that the (ancient) statue persists after deaccession is implausible (contra Identity View's own principle that the object is *now* just a lump/forgery). To deny it existed *before* deaccession is also implausible (given museum practices). Thus, the Identity View *must* accept that the statue's existence *as such* depended on the non-physical facts (authenticity, recognition) that constituted its 'statuehood'. Its escape route – claiming it was *always* just a lump misdescribed – comes at the **cost of severing ontology radically from our practices of identification and reification** (e.g., rendering museum accession records fundamentally mistaken about *what exists* in their vaults). This highlights the Constitution View's point: the distinct objects *are* distinguished precisely by their differing relational/historical/normative properties (origin, function, status), as their intrinsic physical properties are identical. The Identity View's refusal to countenance coincident objects forces it to either deny the intuitive coming/ceasing of existence (implausibly) or accept that existence (as a type of thing) depends on non-physical facts.
