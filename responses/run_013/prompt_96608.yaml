prompt: |-
  I'm a third-year student taking a joint course in set theory and philosophy of mathematics, and I've been stuck on a question that our textbook treatment of Skolem's paradox seems to skate past. I understand the usual point: by the downward Löwenheim–Skolem theorem, if ZFC is consistent it has a countable model, and such a model can satisfy the sentence asserting that the power set of its natural numbers is uncountable because no bijection between its natural numbers and that power set lies inside the model. What I want is not another restatement of that point, but an example of a conceptual issue that arises once we stop treating the model's membership relation as a mere relabeling of the real one. In particular, take a countable model of ZFC whose natural-number sequence is non-standard, so that the model's finite sequences can have non-standard length and the object that the model calls the power set of its natural numbers may contain sets that are not genuine subsets of the genuine natural numbers.

  Give me an example of a conceptual issue, suitable for a seminar discussion, that arises when we ask whether the model's predicate of uncountability expresses the same concept as our predicate of uncountability, or when we ask what the object that the model calls the power set of its natural numbers is actually a power set of. Please make the example concrete: identify the kind of object or definable set that generates the issue, and explain why the issue is not dissolved by simply saying that uncountability is model-relative. In your answer, say how confident you are in the claims you make, and single out the point you are least sure of.
