answer: |-
  Below is a step-by-step analysis of the "glorp" case, diagnosis of the standoff, and paths to progress, reflecting actual commitments in the literature (with key interpretive flags noted). I'll use American English throughout.

  ---

  ### **The "Glorp" Test Case: Forced Moves**
  1. **Epistemicism (Williamson's view)**:  
     - **Commitment**: Bivalence holds; predicates have sharp extensions even when unknown.  
     - **Forced claim about "glorp"**: "Glorp" *already has* a sharp extension (since the future measurement will fix a specific threshold). Our ignorance is purely epistemic—no different from not knowing a hidden coin flip's outcome.  
     - **Problem**: This conflates *temporal indeterminacy* (no fact *yet*) with *epistemic vagueness* (unknowable fact). Williamson (*Vagueness*, 1994) treats vagueness as a type of irremediable ignorance, but here ignorance is temporary and resolvable. Calling "glorp" vague seems counterintuitive—it’s merely *undefined pending measurement*.  

  2. **Supervaluationism (Fine/Keefe)**:  
     - **Commitment**: Truth requires truth across *all admissible precisifications*; borderline cases are indeterminate.  
     - **Forced claim about "glorp"**: Until measurement, *no admissible precisifications exist* because the rule specifies a single future cutoff. Thus, "x is glorp" is neither true nor false for all masses—but this indeterminacy isn’t due to vagueness. It’s *metaphysical* (future contingency) or *semantic incompleteness*.  
     - **Problem**: Supervaluationism defines vagueness via *multiple* admissible precisifications (per Fine’s 1975 "super-truth"). "Glorp" has *zero* precisifications now, making it a poor model for vagueness.  

  **Key insight**: "Glorp" has a sharp-but-unknown boundary *without vagueness*. This pressures epistemicism to explain why vagueness isn’t *just* ignorance, and supervaluationism to explain why vagueness requires *multiple* precisifications.  

  ---

  ### **Diagnosis: What the Standoff Is *Really* About**  
  Your working hypothesis is correct: **the dispute centers on divergent explanatory ambitions**, not empirical data. The commitments confirm this:  

  - **Epistemicism** (e.g., Williamson) prioritizes:  
    - Preserving bivalence and classical logic.  
    - Truth-conditional semantics (meanings fix sharp extensions).  
    - Explanation: Vagueness is an *epistemic phenomenon* arising from our limited discriminatory capacities.  

  - **Supervaluationism** (e.g., Keefe) prioritizes:  
    - Modeling "no fact of the matter" while keeping classical logic *valid*.  
    - Explaining truth-value gaps and tolerance intuitions.  
    - Explanation: Vagueness is *semantic indecision* (multiple candidate meanings).  

  **Higher-order vagueness and sharp-boundary objections are symptoms**:  
  - Supervaluationism’s "sharp boundaries between precisifications" objection (*Keefe 2000*) exposes its need to avoid meta-vagueness while retaining classicality.  
  - Epistemicism’s "unknowable cutoff" objection highlights its insistence that semantic precision transcends epistemic access.  

  **Your competing hypotheses**:  
  - ❌ **Not a verbal dispute about 'true'**: Both sides use 'true' classically (modulo supervaluationist super-truth). The clash is over *what fixes truth conditions*.  
  - ✅ **Two camps answering different questions**:  
    - Epistemicism: "What *determinate* truth conditions do vague predicates have?"  
    - Supervaluationism: "How can we *model* indeterminacy without logical revision?"  
    **This is supported** by how they handle "glorp": Epistemicism sees a truth-conditional fact; supervaluationism sees semantic incompleteness.  

  **Interpretive Note**: Williamson *explicitly* rejects supervaluationism’s explanatory goals (*Vagueness*, Ch. 5), while Keefe (*Theories of Vagueness*, 2000) argues epistemicism "changes the subject" from indeterminacy.  

  ---

  ### **What Counts as Progress?**  
  The standoff persists because goals are incommensurable. Progress could involve:  

  1. **Distinction-drawing**:  
     - Separate *semantic indeterminacy* (multiple precisifications) from *epistemic indeterminacy* (unknowable facts) and *temporal indeterminacy* (future contingents). "Glorp" shows these are distinct.  
     - Concede pluralism: Epistemicism explains *why we can’t know cutoffs*; supervaluationism explains *why we intuit no fact*.  

  2. **Formal Results** (limited utility):  
     - Results showing higher-order vagueness *cannot* be modeled classically (e.g., using fuzzy logic) might pressure supervaluationism, but it’s contested whether classicality is non-negotiable.  
     - Epistemicism is unfalsifiable—no result can rule out unknowable facts.  

  3. **Change the Question**:  
     - Focus on *which phenomena* need explanation: Tolerance? Truth-value gaps? Inexplicable ignorance?  
     - Ask: What do competent speakers *disagree* about in borderline cases? (Epistemicism: nothing; supervaluationism: which precisification to adopt.)  

  4. **The No-Progress View**:  
     - The standoff may be irresolvable because it reflects a **fundamental methodological split** in philosophy of language.  
     - Evidence: After 30+ years, core advocates (e.g., Williamson vs. Keefe) remain unmoved. "Glorp" shows their theories describe *different phenomena*.  

  ---

  ### **Settled vs. Contested**  
  | **Settled** | **Contested** |  
  |-------------|---------------|  
  | Both views preserve classical logic for valid arguments. | Whether classical logic *must* be preserved. |  
  | Higher-order vagueness is a problem for supervaluationism. | Whether it’s fatal (Keefe: manageable; critics: insoluble). |  
  | Epistemicism posits sharp cutoffs. | Whether this is a reductio (e.g., Sorensen) or defensible (Williamson). |  
  | "Glorp" isn’t vague. | What this implies for each theory’s account of vagueness. |  

  **Final Diagnosis**: The standoff is **not resolvable by standard objections** because it’s driven by **divergent conceptions of semantics**. Epistemicism seeks to assign truth conditions; supervaluationism seeks to model indeterminacy. "Glorp" confirms they aren’t even analyzing the *same phenomenon*—epistemicism treats it as vague-like; supervaluationism treats it as a different beast. Progress requires either redefining the project’s aims or accepting pluralism.
