prompt: |-
  I'm a PhD student in medieval political thought and I'm thinking of making Aquinas on tyrannicide a dissertaion chapter, maybe two. Trouble is I cant tell which of the live debates are actually worth a chapter and which are just people circling the same three sentences. Which open questions here matter most, and what order would you put them in?

  Some of what's bugging me: the way I read it, the Sentences commentary lets you kill a tyrant, while the little kingship treatise that goes under his name basically says to grit your teeth and put up with one -- is that a real change of mind, two different cases (a guy who seized power vs. a legit ruler who went bad), or just two genres? And even if he does allow it, does he mean a private person can do it, or does it take public authority, and does that have to be the pope? Half the time I suspect he's just glossing Lombard and it isn't even his view.

  What I want is a defended agenda, not a survey: for each candidate question, why it's upstream of the others (or isn't), whether it's tractable for someone like me who works on texts and Latin and doesn't want to do theology, and what would move it up or down the list. And tell me which of the questions people write about most are actually overrated.
