answer: |-
  Based on your focus and concerns, here's a prioritized agenda for structuring your Aquinas/tyrannicide chapters, designed to cut through repetitive debates and target **upstream, textually tractable questions with genuine stakes**:

  **Core Priority: Resolve the Apparent Contradiction (The Upstream Engine)**

  1.  **Question 1: Genre, Purpose, and Audience - The Foundational Key:**
      *   **Why it's Upstream:** The perceived contradiction between the *Sentences Commentary* (SC) and *De Regno* (DR) is the *primary* driver of most subsequent debates. Resolving *why* Aquinas presents seemingly different advice is essential before tackling *what* the advice actually allows. It dictates how we read the specifics.
      *   **Tractability (High):** Perfect for your skillset. Requires close reading of:
          *   *Structure & Argument:* Compare the *immediate context* of the tyrannicide passage in SC (IV Sent. d. 44, q. 2, a. 2?) with the relevant sections of DR (esp. Ch. 6-7). How do the surrounding arguments frame the issue?
          *   *Genre Conventions:* SC is academic *theology* (commentary on Lombard), addressing a theoretical question within a framework of sin, grace, and authority. DR is *political advice* (mirror for princes), addressed to a Cypriot King, focused on practical governance, stability, and the common good. How do these distinct purposes shape the rhetoric and emphasis?
          *   *Audience & Rhetoric:* SC addresses theologians/students; its language is scholastic, potentially exploring logical extremes. DR addresses a *ruler*; its language is hortatory, emphasizing prudence and the dangers of anarchy. Is Aquinas tailoring his message?
          *   *Source Engagement:* In SC, Aquinas *is* glossing Lombard. The critical question is: **Does he merely report Lombard's position, endorse it critically, qualify it significantly, or use it as a springboard for his own developed view?** Track his phrasing ("Utrum...", "Respondeo...", "Sed contra...", "Ad primum...").
      *   **Stakes & Contribution:** Demonstrating that the "contradiction" stems primarily from different *modes of discourse* (theoretical possibility vs. practical prudence) or *distinct cases* (usurper vs. legitimate tyrant *requiring different remedies*) is fundamental. This moves beyond "did he change his mind?" to "how do context and purpose shape his articulation of principle?" **This *must* be Chapter 1.**
      *   **Move Up/Down:** Solidly #1. Its resolution frames everything else.

  **Building on Resolution: The Specifics of Agency and Authority**

  2.  **Question 2: Agency - "By Whose Hand?" (Public vs. Private Action):**
      *   **Why it's Upstream:** Once the context of the SC passage is clarified (Is it Aquinas's considered view? On what *type* of tyrant?), the critical question becomes *who* possesses the legitimate authority to act. This directly impacts the practical meaning and medieval reception of his "permission."
      *   **Tractability (High):** Primarily textual analysis within Aquinas's corpus, informed by legal/political context.
          *   *SC Close Reading:* Analyze the *specific language* in SC: Does Aquinas specify "private person" (*privata persona*), "public authority" (*publica auctoritas*), or leave it ambiguous? Who does he imply has the "authority" he mentions? Note his examples (Ehud, Judith).
          *   *Integration with Political Theory:* Cross-reference SC with key passages in the *Summa Theologiae* (ST I-II q. 90-97 on law; II-II q. 42 on sedition; q. 64 on killing; q. 104 on obedience; q. 10 on unbelief). What is Aquinas's core theory of authority, resistance, and the common good? Does SC fit this framework logically? Does DR?
          *   *Legal Context:* Briefly engage with contemporary juristic thought (e.g., Gratian's *Decretum*, Roman law concepts like *lex regia*, *maiestas*). Does Aquinas's language reflect legal distinctions between public justice and private vengeance?
      *   **Stakes & Contribution:** Clarifying whether Aquinas envisions tyrannicide as a potentially legitimate act of *public justice* (even if initiated by individuals representing the community) or strictly a matter for *established magistrates* versus a dangerous permission for *private individuals* is crucial. This speaks directly to the later "monarchomach" debates and the development of resistance theory. **This is Chapter 2.**
      *   **Move Up/Down:** #2, as it logically follows the contextual analysis. Its answer depends heavily on how you resolve Question 1 regarding the SC passage's status and scope.

  **Essential But More Contained: The Usurper vs. Legitimate Tyrant Distinction**

  3.  **Question 3: The Nature of the Tyrant - Usurpation vs. Abuse of Office:**
      *   **Why it Matters:** While often discussed, its precise role *within Aquinas's framework* needs careful delineation based on your prior conclusions. Is this distinction the *key* to reconciling SC and DR? Or is it secondary to the genre/agency questions?
      *   **Tractability (High):** Textual analysis focused on Aquinas's definitions.
          *   *Aquinas's Definitions:* Systematically collect and analyze how Aquinas defines "tyrant" (*tyrannus*) across his works (SC, DR, ST, *De Regimine Principum* if authentic, other commentaries). Does he consistently distinguish between one who *seizes* power unjustly (usurper) and one who *exercises* justly acquired power unjustly? What terminology does he use?
          *   *Consequences of the Distinction:* If he makes this distinction, what specific remedies does he associate with each type in different texts? (e.g., SC might focus more on usurpers; DR on legitimate rulers gone bad). Does the distinction *determine* the permissibility of killing, or only the *process* for removal?
      *   **Stakes & Contribution:** Refining this distinction clarifies the *scope* of Aquinas's "permission" in SC. Does it apply only to usurpers? Or also to legitimate tyrants? How does it interact with Question 2 (Agency)? **This can be integrated into Chapters 1 & 2**, rather than a standalone chapter, *unless* your analysis reveals it as the *primary* explanatory factor for the SC/DR difference, which is less likely than genre/audience/agency.
      *   **Move Up/Down:** #3, integrated within Chs. 1 & 2. A dedicated chapter risks over-inflating a distinction Aquinas might imply rather than systematically theorize.

  **Overrated or Less Central Debates to Sideline/Minimize**

  *   **"The Pope's Role":** Aquinas *does not explicitly state* that tyrannicide requires papal authorization. While later hierocratic theorists (e.g., Giles of Rome) might interpret him that way, and papal depositions happened, reading this *back* into Aquinas is anachronistic for *his* primary text-based argument. Focus on *public authority* generally in Aquinas's own terms (which could *include* the Pope in certain conceptions, but isn't limited to or defined by it in his core political writings).
  *   **"Aquinas vs. Later Thinkers (Suárez, Calvin, etc.)":** Important for reception history, but not central to understanding Aquinas *on his own terms* for your dissertational chapter core. Keep the focus tightly on Aquinas and his immediate sources/context unless a specific comparison illuminates *his* text.
  *   **"Was Aquinas Really a Revolutionary/Conservative?":** Often a dead-end, presentist debate. Your analysis of genre, agency, and the tyrant distinction will provide a more nuanced picture than these labels.
  *   **"Theological Underpinnings vs. Political Theory":** While theology is *foundational* for Aquinas, your focus on the *political articulation* of tyrannicide within his works, analyzed through the lens of genre, agency, and definitions, allows you to engage primarily with the political arguments he *makes*, referencing theology only where it directly shapes the political conclusion (e.g., how sin affects authority, the ultimate end of man informing the common good). Avoid deep dives into grace or sacramental theology unless absolutely necessary for the political point.

  **Your Defended Agenda & Chapter Structure**

  *   **Chapter 1: Framing the Problem: Genre, Purpose, and Lombard's Shadow**
      *   Thesis: The apparent contradiction between SC and DR stems primarily from their distinct genres (scholastic commentary vs. princely advice), audiences, and purposes, compounded by Aquinas's complex engagement with Lombard in SC.
      *   Core Work: Close textual analysis of SC passage (context, language vis-à-vis Lombard, argument structure) vs. DR (rhetoric, practical concerns, emphasis on prudence/anarchy). Argue that SC presents a *theoretically permissible* act under very specific conditions within an academic exercise, while DR emphasizes the *grave practical dangers* and prioritizes established processes for resisting a *legitimate ruler* gone bad. Lombard provides the *quaestio* framework, but Aquinas's *responsio* is his own qualified position.
  *   **Chapter 2: Agency and Authority: Who Can Act and Against Whom?**
      *   Thesis: Aquinas's "permission" for tyrannicide in SC is best understood as an extreme remedy potentially permissible to those possessing *public authority* (explicitly or implicitly representing the *res publica*), not a general license for private individuals, and this principle coheres with his broader political theory in ST and the specific cautions in DR.
      *   Core Work: Precise analysis of agency language in SC ("auctoritas", examples). Integration with Aquinas's core political concepts in ST (law, sedition, obedience, common good). Examination of how the usurper/legitimate tyrant distinction (developed in Ch. 1) interacts with permissible agents and remedies. Argue that DR's "grit your teeth" applies primarily to *resisting legitimate rulers* via *private* means or *premature public* action lacking proper authority/form, while SC's allowance is for action *by* or *in lieu of* public authority against a *usurper* or potentially an *intolerable legitimate tyrant* when no other recourse exists. Emphasize the role of *representing the community*.
  *   **(Optional Deep Dive/Integration):** If the Lombard question proves exceptionally rich and contentious, a significant section within Chapter 1 could be dedicated to a meticulous comparison of Aquinas's SC passage with Lombard's original text and standard glosses, demonstrating Aquinas's critical engagement and originality.

  **Why this order works:**

  1.  **Ch1 tackles the biggest confusion head-on (SC vs. DR),** providing the essential interpretive frame.
  2.  **Ch2 builds on Ch1's resolution** to address the next most critical and contested issue (Agency), using the clarified context from Ch1.
  3.  **Key distinctions (Usurper/Legitimate)** are analyzed *within* these chapters where they are most relevant, preventing fragmentation.
  4.  **Overrated debates are sidelined,** keeping the focus on Aquinas's text and core political arguments.
  5.  **Tractability is maximized:** Heavy on Latin text work, genre analysis, conceptual definition within Aquinas's political theory, and manageable engagement with legal/political context, minimizing deep theology.

  **Moving Forward:**

  *   **Re-read SC IV d. 44, q. 2, a. 2 (or wherever your edition locates it) and DR Ch. 6-7 immediately** with the genre/audience lens front and center. Annotate ruthlessly for language of agency, type of tyrant, context, and Lombard references.
  *   **Identify key ST passages** (I-II q. 90-97, II-II q. 42, 64, 104, 10) and compile Aquinas's definitions of *tyrannus*, *auctoritas*, *respublica*, *sedition*.
  *   **Sketch the Lombard passage and standard glosses** to establish the baseline Aquinas was working from/against.

  This structure gives you a clear, defensible path to make an original contribution by reframing the central "contradiction" and clarifying the crucial but often muddled question of agency, grounded firmly in textual analysis and genre sensitivity. Good luck!
