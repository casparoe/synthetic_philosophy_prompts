prompt: |-
  I'm teaching a 75-minute session in a seminar that's half philosophy MA students, half econ MA students, on why people object to certain markets — the commodification objection specifically, not the usual harm and coercion stuff. I don't want the explanation, I want the plan for explaining it: the order the ideas have to come in and why each one can't come earlier (what actually dependends on what), the one case that carries the whole session, the misconceptions each half of the room will arrive with — the econ half thinks any voluntary Pareto improvement is fine and the philosophy half thinks repugnance is just disgust and therefore worthless as evidence — and exactly where in the sequence I should head each one off.

  Two things I've already decided, and I want you to push back on both:

  1) Kidney sales is out as the carrying case; they've all seen it and they'll just recite the arguments back at me. My replacement is hired professional mourners — you pay people to grieve at a funeral, everyone involved knows what's happening, nobody's decieved, the family is comforted rather than harmed, and yet plenty of people find it gross and some think it's genuinely wrong. Tell me whether that case can carry the session or what else I need, what it has to have and what it has to lack, and give me the one contrast case that stops them leaving convinced that nothing with meaning in it can ever be sold.

  2) I want to teach the difference between the objection that says the exchange is wrong in itself and the objection that says the market erodes something over time, using a grid I made up: does the objection turn on what changes hands, on the terms of the exchange, or on the attitude the exchange expresses — crossed with whether it survives asking what would happen if nobody minded. If that grid is a house of cards, say so and give me a better one, and tell me where in the order it goes.

  Also in the plan: the moment they'll try to fold the commodification objection into the exploitation objection and how I stop it; whether the objection is really about markets at all or about commodification as such (a state could commodity something just as thoroughly with no market anywhere — I think this breaks a lot of the standard framings, tell me if I'm wrong); whether being wrong and being illegal come apart here; one question I can ask at the end that shows me they can seperate their own reaction from an argument; and what I should say out loud that I'm refusing to explain at this level. No readings.

  And be straight with me about the state of play — tell me which parts of this are actually settled and which are contested among people who work on it, and don't hand me a contested position as if it were the consensus. If my framing is idiosyncratic, say that too.
reasoning: |-
  Okay, the user is preparing a seminar on commodification objections in markets for a mixed group of philosophy and econ MA students. They have a 75-minute session and want a detailed plan, not the content itself. They've already decided on some elements but want pushback and alternatives.

  First, I need to address their two main decisions. They want to use professional mourners instead of kidney sales. Professional mourners are interesting because there's no deception, it's voluntary, and it provides comfort, yet many find it repugnant. But can this case carry the whole session? I think it might be too niche. Students might not see the depth of the commodification objection here. They might think it's just about insincerity. So suggesting adding another case like commercial surrogacy could help. Surrogacy involves deeper personal aspects, making the commodification argument clearer. The contrast case could be something like selling handmade crafts – where personal meaning is present but commodification isn't problematic, showing that not all meaningful things are off-limits.

  Next, their grid framework: categorizing objections based on what changes hands, terms of exchange, or attitude expressed, and whether it survives if no one minds. The grid seems useful but might oversimplify. Some objections might overlap categories. I should suggest refining it to avoid forcing all objections into boxes. Emphasize that the grid is a heuristic, not a rigid taxonomy. Place this after establishing the mourners case but before addressing misconceptions to give students a structured way to analyze different objections.

  Now, addressing the econ students' belief that voluntary Pareto improvements are always acceptable. They might miss that commodification can undermine non-economic values. Philosophy students might dismiss repugnance as mere disgust. Need to tackle these early. For econ, use the mourners case to show that efficiency isn't the only value. For philosophy, explain that repugnance can signal deeper moral violations, like undermining human dignity.

  The user is concerned about students conflating commodification with exploitation. I should highlight that exploitation involves harm or coercion, whereas commodification is about turning something into a commodity, which can happen without harm. Use examples like state commodification without markets, such as assigning monetary value to organs in a public system. This shows commodification isn't solely market-related.

  Timing the session is crucial. Allocate segments: intro, mourners case, econ/phil misconceptions, grid framework, surrogacy comparison, non-market commodification, and conclusion. Keep each segment tight to cover all points in 75 minutes.

  End with a question that separates personal reaction from argument, like asking if they'd object to a market in something they find sacred even if no harm occurs. This tests their ability to articulate commodification objections beyond personal disgust.

  State of play: The commodification debate is contested. Some scholars like Satz and Sandel argue markets can corrupt goods, while others like Brennan and Jaworski defend markets. Acknowledge these differing views without taking sides, presenting the grid as a tool to explore the debate.

  Finally, advise the user to be explicit about the contested nature of the topic and that the session's goal is analytical clarity, not resolution. This manages expectations and encourages critical thinking.
answer: |-
  Here’s a battle-tested 75-minute plan designed to force both groups out of their comfort zones, using your constraints and refining your ideas. The structure prioritizes **argumentative dependencies** and preempts discipline-specific misconceptions early.

  ---

  ### **Core Case & Contrast (25 mins)**  
  **Carrying Case: Professional Mourners**  
  *Why it works*: It lacks deception/harm, focuses purely on symbolic degradation, and triggers intuitive discomfort. But it needs **one critical reinforcement** to avoid dismissal as "just insincerity."  
  - **Sequence**:  
    1. **Describe the practice neutrally** (payment, no deception, comfort to family).  
    2. **Poll reactions**: "How many find this *morally troubling* even if voluntary?" (Forces acknowledgment of discomfort).  
    3. **Econ Trap**: They’ll say, "It’s just irrational disgust; markets reveal true preferences."  
       - *Shut down with*: "If the mourner *genuinely* feels grief through method acting (like an actor crying on cue), does that resolve the objection?" (No → moves beyond sincerity).  
    4. **Philosophy Trap**: "This is mere cultural prejudice; no *moral* wrong."  
       - *Shut down with*: "What if mourners auction their services to the highest bidder, or wear branded attire? Does *that* change the wrongness?" (Yes → hints at market norms).  

  **Contrast Case: Artisan Craft Sales** (e.g., a potter selling their own ceramics)  
  *Why it works*: It’s meaningful, personal, *and* commodified, yet non-repugnant. **Crucial question**: "Why is selling a handmade urn (for ashes) arguably less problematic than hiring a mourner?" Exposes that commodification isn’t about "meaning" per se, but **contextual integrity**.  

  ---

  ### **Grid Framework (20 mins)**  
  *Place after the mourners case but before misconceptions*. Your grid isn’t a house of cards, but risks being *descriptive*, not *analytical*. Reframe it as:  

  |                          | **Wrong in itself**                          | **Erosion over time**                |  
  |--------------------------|---------------------------------------------|--------------------------------------|  
  | **Changes hands**         | Sacred object (e.g., selling relics)         | → Cheapens value (e.g., mass-produced relics) |  
  | **Terms of exchange**     | Price as insult (e.g., paying for friendship) | → Norm shifts (e.g., monetizing all social acts) |  
  | **Attitude expressed**    | Treating dignity as fungible (e.g., surrogacy) | → Habituation (e.g., seeing bodies as assets) |  

  **Key refinement**: Add a column: **"Does it vanish if no one minds?"**  
  - *Wrong in itself*: No (e.g., selling votes still wrong even if consensual).  
  - *Erosion*: Yes (e.g., paid mourning normalizes grief as service).  
  *Why this works*: Forces students to see that not all objections are about psychological disgust.  

  ---

  ### **Order & Dependencies**  
  1. **Intro (5 mins)**: Define "commodification objection" vs. harm/coercion. Stress: *We’re asking if markets transform the meaning of acts/goods*.  
  2. **Mourners case + traps (15 mins)** (← *must come first to ground intuitions*)  
  3. **Grid framework (15 mins)** (← *depends on having a concrete case to classify*)  
  4. **Econ/Phil misconceptions (10 mins)** (← *requires the grid to dissect their biases*):  
     - **Econ**: "Pareto improvements trump all."  
       - *Counter*: Use the grid’s "wrong in itself" column. "If paying mourners expresses that grief is *for sale*, does efficiency justify degrading a social practice?"  
     - **Phil**: "Repugnance = irrational disgust."  
       - *Counter*: "Is your discomfort about the *act* or the *market*? Would state-employed mourners be less wrong?" (Teases non-market commodification).  
  5. **Exploitation Conflation (5 mins)**:  
     - *When it arises*: When discussing payment (e.g., "But mourners are exploited!").  
       - *Stop it*: "Suppose mourners are highly paid experts. Does *that* eliminate the commodification worry? If not, why?" (Decouples commodification from fairness).  
  6. **Non-Market Commodification (7 mins)**:  
     - *Example*: State assigns monetary value to organs for allocation (no market).  
       - *Point*: "Commodification is about *reduction to economic logic*, not markets. Markets are just the most visible engine."  
  7. **Illegal vs. Wrong (3 mins)**:  
     - "Is paid mourning *wrong* where legal? Illegal where it’s not? Why might law and morality diverge here?" (Highlights social contingency).  
  8. **Closing Question (5 mins)**:  
     - **"What’s something you personally find repugnant to sell, but struggle to articulate *why* without invoking harm?"** (e.g., romantic love, citizenship). Tests if they can separate visceral reaction from reasoned objection.  

  ---

  ### **State of Play & Your Framing**  
  - **Settled**:  
    - Commodification objections are distinct from exploitation/harm (Sandel, Satz).  
    - Repugnance can signal moral boundaries, not just bias (Kass’s "wisdom of repugnance" debate).  
  - **Contested**:  
    - Whether "wrong in itself" exists vs. all commodification being about erosion (Radin vs. Brennan/Jaworski).  
    - Whether markets *cause* commodification or merely expose it.  
  - **Your Grid**: Idiosyncratic but defensible. It synthesizes Satz (what’s traded), Anderson (expression), and Sandel (erosion). *Admit this upfront*: "This is a pedagogical tool; real scholarship disputes these boundaries."  
  - **Non-Market Point**: Correct and underdiscussed. State commodification (e.g., cost-benefit analysis of lives) is a powerful example.  

  ---

  ### **Pushes Back on Your Decisions**  
  1. **Mourners Alone Aren’t Enough**  
     - They risk being seen as "creepy but harmless." Add **commercial surrogacy** as a *comparison* (10 mins in grid section). Contrast: "Why do surrogacy debates focus on commodification *more* than mourners?" (Highlights body/labour boundaries).  
  2. **Grid Needs a "So What?"**  
     - Add a row: **"Policy Implications"** (e.g., "Wrong in itself" → ban; "Erosion" → regulate visibility). Prevents it feeling academic.  

  ---

  ### **What to Explicitly *Not* Do**  
  - Say aloud: "I won’t resolve whether commodification objections are *valid*—only how to distinguish them from other critiques. Validity depends on your metaethics; we’re mapping the battlefield."  

  ### **Why This Sequence Works**  
  - Econ students see early that efficiency isn’t the only value.  
  - Phil students confront that repugnance can track norm-structure.  
  - The grid gives both sides analytical leverage.  
  - Non-market commodification stops econ students retreating to "market failure."  

  This plan forces each group to argue on the other’s turf. The mourners case is your Trojan horse—benign enough to bypass defensiveness, but rich enough to escalate.
