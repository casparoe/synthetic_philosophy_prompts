  ### Decision Tree for Solution Concept Foundations in Game Theory

  **Premise**: You accept iterated deletion of strategies that are never best responses (to some beliefs about others). This is your starting commitment. The tree branches based on your answers to conceptual questions. Each leaf names a solution concept and its core commitment, plus a potential "embarrassment" (a challenge to that position). Answer the questions without peeking at the leaves. The tree has 7 branch nodes and 8 leaves. If a combination is incoherent or empty, it's noted.

  ---

  **1. Do you accept that common knowledge of rationality (CKR) justifies iterating deletion?**  
     - **No**: → **Leaf: Skeptic**  
       *Commitment: CKR is implausible or self-undermining; deletion has no epistemic foundation.*  
       *Embarrassment: How do you justify any iterative procedure?*  
     - **Yes**: → **2**

  **2. Can a strategy be strictly dominated by a mixed strategy (even if not by any pure strategy)?**  
     - **No**: → **3** (Never best response ≠ strictly dominated; weakens deletion)  
     - **Yes**: → **3** (Never best response = strictly dominated by mixed; strengthens deletion)  

  **3. Do you delete weakly dominated strategies?**  
     - **No**: → **4** (Only strict dominance; avoids order-dependence)  
     - **Yes**: → **4** (Weak dominance allowed; order-dependent but more aggressive)  

  **4. Does the solution require self-enforcement (each player's strategy is a best response to others)?**  
     - **No**: → **5** (Stop at fixed point of deletion)  
     - **Yes**: → **6** (Solution must be self-enforcing)  

  **5. Can players' beliefs about others be correlated?**  
     - **No**: → **Leaf: Independent Rationalizability**  
       *Commitment: Beliefs are independent; solution is the set surviving deletion.*  
       *Embarrassment: In 3+-player games, disallowing correlation ignores plausible outcomes.*  
     - **Yes**: → **Leaf: Correlated Rationalizability**  
       *Commitment: Beliefs can be correlated; solution is the set surviving deletion.*  
       *Embarrassment: Allows "unreasonable" correlations without a correlating device.*  

  **6. Must beliefs be independent?**  
     - **No**: → **Leaf: Correlated Equilibrium**  
       *Commitment: Self-enforcing with a mediator or correlated beliefs.*  
       *Embarrassment: Where does the correlating device come from?*  
     - **Yes**: → **7**  

  **7. Should the solution be robust to small mistakes (trembles)?**  
     - **Yes**: → **Leaf: Refined Nash (Trembling-Hand/Proper Equilibrium)**  
       *Commitment: Mixed strategies are limits of pure strategies with tiny errors.*  
       *Embarrassment: Trembles are arbitrary; may not reflect real behavior.*  
     - **No**: → **8**  

  **8. When a player randomizes 50-50, is she...**  
     - **Actually randomizing (e.g., rolling a die)?**: → **Leaf: Nash with Deliberate Randomization**  
       *Commitment: Randomization is a real action; mixed strategies are intentional.*  
       *Embarrassment: Why randomize if payoffs are deterministic?*  
     - **Representing others' beliefs?**: → **Leaf: Nash with Belief Interpretation**  
       *Commitment: Mixed strategies encode beliefs, not actions; players use pure strategies.*  
       *Embarrassment: How do beliefs become common knowledge?*  
     - **Approximating pure strategies with tiny payoff shocks?**: → **Leaf: Nash with Purification (Harsanyi)**  
       *Commitment: Mixed equilibria are limits of pure equilibria with private uncertainty.*  
       *Embarrassment: Payoff shocks are unobservable and ad hoc.*  

  ---

  ### Key Notes on the Tree
  1. **Mixed-Strategy Spine**: The tree centers on mixed strategies (Q8), as requested. This forces clarity: Is randomization real, epistemic, or a limit? It shapes all self-enforcing concepts.  
  2. **Grid vs. Tree**: This is a tree. Branches are ordered to avoid redundancy:  
     - Dominance questions (Q2–Q3) come early—they affect deletion but don't split epistemic/interpretive forks.  
     - Self-enforcement (Q4) separates set-based (rationalizability) from point-based (Nash/CE) concepts.  
     - Mixed-strategy interpretation (Q8) only applies to non-refined Nash, avoiding clutter.  
  3. **Empty/Incoherent Nodes**:  
     - **Correlated Equilibrium + Independent Beliefs (Q6 "No" → Q7)**: Skipped because correlated equilibrium inherently requires non-independent beliefs.  
     - **Stable Sets**: Omitted—they require set-valued solutions with admissibility, which clashes with the dominance framework (Q3 "No" kills weak dominance, which stable sets need). If included, they’d need a separate branch after Q4 ("No"), but this would bloat the tree.  
  4. **Leaves the Tree Can't Separate**:  
     - **Refined Nash vs. Purification Nash**: Both treat mixed strategies as limits, but differ on why (trembles vs. payoff shocks). The tree separates them via Q7 (robustness to mistakes) vs. Q8 (purification).  
     - **Skeptic vs. Others**: The skeptic (Q1 "No") rejects CKR, while others rely on it—a foundational choice, not a case-based one.  
  5. **Collapsed Labels**:  
     - "Refined Nash" covers trembling-hand/proper equilibrium (both treat mixed strategies as error-prone).  
     - "Stable-set camp" omitted (as above); it doesn’t fit the spine.  
  6. **Framing Validity**: The spine works. Mixed strategies are the crux:  
     - Deletion (Q2–Q3) affects which strategies survive.  
     - Interpretation (Q8) determines what mixed strategies "are."  
     - Self-enforcement (Q4) and independence (Q5–Q6) then assign labels.  

  This tree forces engagement with core tensions (e.g., "Is randomness real?"), avoids label-first thinking, and fits on one page. Use it to spark debate—not as a taxonomy.
