prompt: |-
  Okay so basically me and my mate Priya have been arguing about Newton's bucket for about three months and our philosophy teacher has finally said either we write it up as a proper thing or stop derailing lessons. So I need you to draft the actual document — the one me and her could both put our names on — even though we still definately disagree.

  Quick version of the fight. She's a substantivalist: spacetime is a real thing over and above the matter in it, so when the water climbs the sides of the bucket it's genuinely rotating relative to space itself. I'm a relationist: there's no such extra thing, all that exists is matter and the relations between bits of it, so rotation has to be rotation relative to something material, and in a universe with nothing else in it a spinning bucket shouldn't do anything at all.

  What I want out of you:

  1. A numbered list of claims we can both sign — about what Newton's bucket does and doesn't show, about what each of us is actually committed to, and about what we'd both agree would count as evidence either way.
  2. Then the actual disagreements, in a table, one row each, with her version and my version in seperate columns, each one phrased so the person whose view it is would be happy to sign that wording. Not strawmen, and not mush that quietly dodges the fight.
  3. Then the cruxes: the smaller questions where, if one got settled, one of us would actually have to change our mind.
  4. For each crux, a case or argument we'd both accept bears on it, plus what each of us predicts about that case, written down in advance.

  Some things I want worked in properly, because we keep getting stuck:

  - The lonely bucket. A universe with literally one bucket of water in it and nothing else — no stars, no fields, nothing. Can the water bulge? If I'm right it can't even make sense to say it's spinning. She says fine, then it's spinning relative to spacetime, which is a thing even when it's empty. Which of us has to say something weirder here, and can either side wriggle out?
  - What if the physics came out relational? Say we found that the bulge depends on the bucket's spin relative to some other lump of matter — a marble on the far side of the universe, or a shell wrapped round it — and not on anything absolute. Does that settle it for me, or can she just say absolute space is in that world too and simply doesn't show up in the bulge?
  - The metric-wiggling thing, I think it's called the hole argument but don't just tell me what other people said about it, actually use it. If you take a spacetime with no matter in some region and shuffle the metric around inside there, you seem to get a genuinely different arrangement of the same physical situation, which looks bad for spacetime points being real individual things. Is that a real problem for her or can she get out of it, and is her way out actually just relationism with extra steps?
  - Frame dragging — the way a big rotating lump of matter drags local frames round with it. She says that's just a field effect and doesn't help me. Does it help me or not? Be honest, don't just be nice to both sides.
  - If it turns out spacetime isn't fundamental at all, if it emerges out of something else in quantum gravity, does either side win by default, or is the whole fight about a level of description that might turn out not to be the real one?
  - And is part of this just us using words like real and exists in different ways? If so, say which part is verbal and what's left over once you strip that out, because I don't want the whole document to dissolve into "we were talking past each other" if there's still a genuine disagreement buried in there.

  No references or reading lists please, we'll add those ourselves later — just the argument. And write it in British English, spelling and all, since we're handing it in here.
