answer: |-
  ### Exam Question: The Café Paradox  
  *(Total Time: 75 minutes)*  

  **Background**: A café serves a drink mixing tea (\(t\)) and milk (\(m\)). The only information given is that the ratio \(t/m\) is in the interval \([1/2, 2]\) (i.e., neither ingredient is more than twice the other). There is no additional information about the drink’s composition or how it was prepared.  

  **Tasks**:  
  1. **Analysis (10 points)**:  
     (a) Student A argues that indifference implies a uniform distribution over \(t/m \in [1/2, 2]\), concluding \(P(\text{more tea than milk}) = 2/3\).  
     (b) Student B argues that indifference should apply to \(m/t\), concluding \(P(\text{more tea than milk}) = 1/3\).  
     Critically evaluate both claims. Explain why these applications of indifference lead to contradictory results and what fundamental problem this reveals.  

  2. **Resolution (10 points)**:  
     (a) Student C claims \(P(\text{more tea than milk}) = 1/2\) by symmetry. Formalize this argument carefully: show how swapping the labels "tea" and "milk" transforms the event "more tea than milk" into its complement. Explain why this symmetry *forces* \(P(\text{more tea}) = 1/2\) *without* assuming a uniform distribution over any parameter.  
     (b) Is this symmetry argument a form of indifference? Justify your answer.  
     (c) Does the stated information *entail* \(P(\text{more tea}) = 1/2\), or does this require an additional substantive assumption? Explain.  

  3. **General Principles (5 points)**:  
     (a) The "chord problem" (Bertrand’s paradox) shows indifference fails when applied to different parameters (e.g., chord length vs. midpoint distance). Why does the café case *not* suffer the same flaw? Contrast how symmetries act in both cases.  
     (b) **Bonus (1 point)**: What does this case illustrate about when symmetries can pin down a specific probability (like \(1/2\)) without determining the entire distribution?  

  ---

  ### Model Answer (≈700 words)  
  #### Part 1: Critique of Student A and B (10 points)  
  Student A and B both misapply the principle of indifference (PoI) by assuming uniformity over an arbitrary parameterization. Student A uniformizes \(r = t/m\) over \([1/2, 2]\). Since \(P(r > 1) = \frac{2-1}{2-0.5} = \frac{1}{1.5} = 2/3\), they conclude \(P(t > m) = 2/3\). Student B uniformizes \(s = m/t\) over \([1/2, 2]\). Then \(P(s < 1) = P(m/t < 1) = P(t > m) = \frac{1-0.5}{2-0.5} = \frac{0.5}{1.5} = 1/3\). The contradiction (2/3 vs. 1/3) arises because PoI is applied inconsistently to *two equally valid reparameterizations* of the same underlying state space. This is a manifestation of Bertrand’s paradox: PoI is sensitive to the choice of parameter when multiple "natural" parameterizations exist, leading to incoherent probabilities. The core problem is that the interval \([1/2, 2]\) for \(r = t/m\) is *not* a sufficient "privileged" description to justify uniformity; it ignores the problem’s inherent symmetry.  

  #### Part 2: Symmetry Argument and Its Implications (10 points)  
  **(a)** The symmetry argument resolves this. The information "\(t/m \in [1/2, 2]\)" is *invariant* under label-swapping: swapping "tea" and "milk" transforms the condition to \(m/t \in [1/2, 2]\), which is identical. Crucially, swapping labels also maps the event \(E: t > m\) to its complement \(E^c: m > t\) (since \(t > m\) iff \(m < t\)). Let \(P\) be any credence function respecting the informational symmetry. Swapping labels preserves all given information, so \(P(E) = P(E^c)\) by invariance. Since \(E\) and \(E^c\) partition the possibility space (as \(t = m\) has measure zero), \(P(E) + P(E^c) = 1\), implying \(P(E) = 1/2\). This holds *without* assuming uniformity over \(r = t/m\) or any other parameter.  

  **(b)** This is **not** PoI. PoI asserts uniformity over possibilities when no information distinguishes them. Here, we make no uniformity claim; we derive a constraint (\(P(E) = P(E^c)\)) from the invariance of the information under a symmetry group (the label-swap). This avoids the arbitrariness of parameterization that plagued Students A and B.  

  **(c)** The value \(1/2\) is *entailed* by the symmetry of the information. No further assumption (e.g., uniformity) is needed. The symmetry forces any rational credence function to satisfy \(P(E) = P(E^c)\), and probability axioms then require \(P(E) = 1/2\). Rejecting this would violate the principle that identical information about mutually exclusive events demands equal credence.  

  #### Part 3: General Principles and Contrast with Bertrand’s Paradox (5 points)  
  **(a)** The chord problem fails because its symmetries do not act transitively on the disputed event. For example, rotating a chord does not map chords at distance \(d\) from the circle’s center to chords at distance \(d' \neq d\); thus, "distance from center" breaks rotational symmetry. Here, the label-swap symmetry *does* act transitively between \(E\) and \(E^c\): every state with \(t > m\) maps to one with \(m > t\), preserving all information. PoI requires a unique invariant measure (e.g., uniform on \(r\) vs. uniform on \(\log r\)), but the café case’s symmetry fixes only \(P(E) = 1/2\), not the full distribution.  

  **(b) Bonus**: This shows that symmetries can constrain *specific probabilities* without determining the entire credence function. For instance, \(P(t/m > 1) = 1/2\) is fixed, but the distribution over \(r \in [1/2, 2]\) (e.g., uniform vs. log-uniform) remains underdetermined. This highlights that symmetry arguments can be "local" (constraining events) without being "global" (fixing a unique prior).  

  ---

  ### Marking Scheme (25 points + 1 bonus)  
  | **Part** | **Points** | **Must-Hit Moves** | **Common Errors (and Recovery)** |  
  |----------|------------|-------------------|----------------------------------|  
  | **1a: Critique Student A** | 3 | • Identifies arbitrary choice of \(t/m\) as parameter.<br>• Notes PoI inconsistency (Bertrand-type flaw). | *Error: "Both are valid, so it’s subjective."*<br>→ **No credit** unless notes contradiction violates probability axioms. |  
  | **1b: Critique Student B** | 3 | • Same as 1a, but for \(m/t\).<br>• Synthesizes: PoI fails without privileged parameter. | *Error: "It’s a verbal dispute."*<br>→ **Credit only if** reframed as deeper incoherence in PoI. |  
  | **1 Synthesis** | 4 | • General lesson: PoI requires invariant parameterization; here, none exists. | *Error: "PoI is always wrong."*<br>→ **Partial credit** if tied to parameter-dependence. |  
  | **2a: Symmetry Formalization** | 5 | • Swap maps \(E\) to \(E^c\) and preserves information.<br>• Derives \(P(E) = P(E^c) = 1/2\) *without uniformity*. | *Error: "Symmetry means uniformity over \(t/m\)."*<br>→ **No credit** unless corrected. |  
  | **2b: Indifference?** | 2 | • Distinguishes: Symmetry constrains, but ≠ PoI (no uniformity assumed). | *Error: "It’s PoI in disguise."*<br>→ **Credit only if** explains why constraining ≠ uniformizing. |  
  | **2c: Entailment** | 3 | • States \(1/2\) is entailed by symmetry + probability axioms. | *Error: "We need to assume indifference."*<br>→ **No credit** if assumes uniformity. |  
  | **3a: Chord Contrast** | 4 | • Chord: Rotations don’t preserve distance-from-center.<br>• Café: Swap preserves all information + acts transitively on \(E\)/\(E^c\). | *Error: "Both have symmetries."*<br>→ **Credit only if** contrasts transitivity. |  
  | **3b: Bonus** | 1 | • Notes symmetry pins \(P(E)\) but not full distribution. | — |  

  ### Typical Pitfalls and Recovery  
  - **"2/3 vs. 1/3 is merely verbal"**: Earn back by showing it violates coherence (e.g., same event, two probabilities).  
  - **"Symmetry argument is PoI"**: Earn back by explaining that symmetry *constrains* probabilities without *selecting* a uniform measure.  
  - **Missing transitivity in chord problem**: Point out that rotating a chord doesn’t change its distance to the center, so symmetries can’t equate chords at different distances.  

  ---  
  **Rationale**: This question forces originality by using an unseen case, tests grasp of symmetry beyond cookie-cutter PoI critiques, and rewards meta-analysis of when symmetries fix probabilities. The marking scheme emphasizes conceptual clarity over computation, filtering A students (who see symmetry as a constraint) from C students (who conflate it with indifference).
