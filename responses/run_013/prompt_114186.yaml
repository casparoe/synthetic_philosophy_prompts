prompt: |-
  I'm convening a ninety-minute session of a cross-departmental reading group on the question of which computations, if any, can matter morally, and what I need from you is a teaching plan rather than an exposition of the problem. The audience is six people, mostly not philosophers: two machine-learning engineers, a systems neuroscientist, and three graduate students from other departments. They arrive sharing two assumptions I have to dismantle on the way in, that behaving like a person is evidence of feeling like one and that moral status scales with the amount or complexity of computation, and none of them has read any philosophy of mind.

  Build the session around a case I have invented for it, so that the discussion cannot be settled by reciting the famous thought experiments. The case: a lab trains a system, then ships a behavioural twin that reproduces the original's outputs over the whole distribution anyone will ever query, by table lookup with interpolation; a second version of the twin compresses that table into a small circuit whose internal algorithm is nothing like the original's. Both twins are, by stipulation, behaviourally indistinguishable from the original on every input that will ever occur. My questions for the session are whether anything morally relevant survives each swap, and whether the second swap, same behaviour but a different algorithm, should trouble us more or less than the first, same behaviour but a different implementation.

  Give me the sequence: which ideas must be in place before which, and why the dependencies run as they do. Tell me whether this case can carry the whole session or whether it needs a simpler one underneath it, and what a carrying case of this kind must have and must lack. I had intended to use the Chinese room as the anchor and now suspect it teaches the wrong lesson here, since it concerns understanding words rather than which of many computations a physical system is running; tell me whether I am right to demote it, and what it fails to supply. Then map the misconceptions in the order they will actually surface, I expect the behavioural-equivalence fallacy first, then the thought that implementation is simply read off the physics, then the appeal to simulation versus instantiation as a conversation-stopper, and say at exactly which point in the sequence I should head each one off. I am also unsure whether to keep the factual question, whether there is something it is like to be the system, apart from the practical one, what we may do under our uncertainty about it, or whether that split is itself one of the ideas that has to be taught; settle that too. Include one closing question or task that would show me whether they have grasped the structure of the problem rather than acquired its vocabulary, and tell me what to leave out at this level and to announce that I am leaving it out.
reasoning: |-
  We are building a 90-minute teaching plan for a cross-departmental reading group. The audience: 6 people (2 ML engineers, 1 systems neuroscientist, 3 grad students from other departments). They share two assumptions to dismantle:
  1. Behaving like a person is evidence of feeling like one (behavioral equivalence fallacy).
  2. Moral status scales with the amount or complexity of computation.

  We have a novel case to use as the anchor:
  - Original system: trained model.
  - First twin: behavioral duplicate via table lookup with interpolation (same outputs for every possible input, but implemented as a lookup table).
  - Second twin: compresses the table into a small circuit with a completely different internal algorithm, but same behavior on every input that will ever occur.

  Key questions for the session:
  1. Does anything morally relevant survive each swap? (Original -> Twin1, then Twin1 -> Twin2)
  2. Should the second swap (different algorithm) trouble us more or less than the first (different implementation)?

  We must avoid relying on famous thought experiments (like the Chinese Room) because we want original engagement. The Chinese Room is demoted because it focuses on understanding (semantics) rather than the multiple realizability of computations and the moral relevance of the underlying processes.

  The plan must:
  - Sequence ideas with dependencies.
  - Decide if the case can carry the whole session or if a simpler case is needed.
  - Map misconceptions and when to head them off.
  - Decide whether to keep the "what it is like" (factual) question separate from the practical (what we may do) question.
  - Include a closing question/task to test understanding.

  Structure:

  1. Introduction (10 minutes)
     - Set the stage: We are exploring which computations (if any) can matter morally. We are going to use a case study to think about this.
     - State the two common assumptions we are going to challenge (behavioral equivalence and moral status scaling with computation).
     - Present the case: 
          - Original: a trained system (e.g., a neural network) that behaves in a complex way.
          - Twin1: a lookup table that exactly reproduces the original's behavior for every possible input (using interpolation for gaps).
          - Twin2: a small circuit that has the same input-output behavior but with a completely different internal algorithm (e.g., a compact formula).

     - Pose the two main questions for the session.

  2. Dismantling Assumption 1: Behavioral Equivalence (20 minutes)
     - Why do we tend to think that behavior implies feeling? (Discuss: we use behavior as evidence for other humans, but is it sufficient for machines?)
     - Introduce the idea of multiple realizability: the same behavior can be produced by very different underlying processes.
     - Use Twin1: It behaves exactly like the original but is just a lookup table. Ask: Does it feel? Why or why not?
     - Expected misconception: "It behaves exactly the same, so it must feel the same." Head this off by stressing that the internal process is completely different (passive lookup vs. active computation). The lookup table might be seen as a mere recording, not a process that feels.
     - Point: If we grant that the original might feel (because of its complex training and architecture), does that feeling survive when we replace it with a lookup table? Why or why not?

  3. Dismantling Assumption 2: Moral Status and Computational Complexity (20 minutes)
     - Twin2: Now we have a circuit that is very small and simple, but it does the same thing. It has the same behavior. 
     - Question: Does the simplicity of the circuit (or the fact that it uses a different algorithm) affect moral status?
     - Expected misconception: "But Twin2 is simpler, so it must have less moral status." Head this off by noting that complexity doesn't necessarily map to moral status. For example, a very simple organism might have moral status (like a worm) while a very complex computer program might not. Also, note that Twin2 is behaviorally equivalent to the original, so if we only care about behavior, then it should have the same status. But if we care about the internal process, then the change in algorithm might matter.
     - Introduce the idea that moral status might depend on the nature of the process, not just the output. For example, if the process is not one that supports consciousness (like a lookup table) then it might not matter. But how do we know?

  4. Factual vs. Practical Questions (10 minutes)
     - At this point, we must address the split:
          - Factual: Is there something it is like to be the system? (The hard problem of consciousness)
          - Practical: Given our uncertainty, what should we do?
     - We cannot resolve the factual question (it's a hard problem). But we can discuss the practical implications: In the face of uncertainty, we might adopt a precautionary principle (if it might be conscious, we should treat it with care).
     - However, the case study pushes us to think about what features of the system might be relevant to the factual question. For example, the lookup table (Twin1) is a static representation, not a dynamic process. The circuit (Twin2) is a dynamic process but a very simple one. Does the dynamic aspect matter? Does the algorithm matter?

  5. Comparing the Swaps (15 minutes)
     - Now focus on the two swaps:
          - Swap1: Original -> Twin1 (same behavior, different implementation: from active computation to passive lookup)
          - Swap2: Twin1 -> Twin2 (same behavior, different algorithm: from lookup to a simple active circuit)
     - Question: Should Swap2 trouble us more or less than Swap1? Why?
     - Possible arguments:
          - Swap1: We go from a complex, possibly conscious system to a static lookup table. This might be a bigger loss because we lose the dynamic process that might be necessary for consciousness.
          - Swap2: We go from a static table to a dynamic circuit. But the circuit is very simple and the algorithm is different. If we thought the lookup table had no moral status, then the circuit might also have none. Or, if the circuit is dynamic, does that make it more likely to have moral status? But note: the circuit is very simple and the algorithm is different from the original.

     - Key point: The swap from the original to Twin1 seems to remove the process that we might associate with consciousness (the original's training and architecture). The swap from Twin1 to Twin2 restores a process (a circuit) but one that is very simple and not like the original. So which one is more troubling? This is open, but it highlights that behavior alone doesn't tell us about the internal process.

  6. Addressing Misconceptions in Order (as they arise, but planned):
     - Misconception 1 (behavioral-equivalence fallacy): Likely to come up in step 2. Head it off by emphasizing multiple realizability and the possibility of "zombie" systems (that behave without consciousness).
     - Misconception 2 (implementation read off physics): Might come up when discussing the circuit. Someone might say that the physics of the circuit is what matters. But note: the same algorithm can be implemented in different physical substrates (multiple realizability). So we are interested in the computation, not the physical stuff. However, the physical stuff might be necessary for consciousness? (But that's a different debate.) We are focusing on the computational level. Head this off by clarifying that we are talking about the algorithm and the process, not the physics.
     - Misconception 3 (simulation vs. instantiation): This might come up as a conversation-stopper: "Twin1 is just a simulation, so it doesn't feel." But what about Twin2? Is it a simulation or an instantiation? We must avoid this dichotomy because it is often used without clear criteria. Instead, focus on what features of the system are present. Head this off by asking: What is the difference between simulation and instantiation? And how do we know when we have one or the other? This is not a clear-cut distinction.

  7. Can the Case Carry the Whole Session?
     - Yes, because it is rich enough to explore both assumptions and the two swaps. However, to make it more accessible, we can start with a simpler case (e.g., a thermostat) to illustrate the idea that behavior doesn't imply feeling. But since time is short and the group is advanced (though not philosophers), we can dive into the main case. We can use the thermostat as a quick example when introducing the behavioral equivalence fallacy.

     - What a carrying case must have:
          - Multiple levels of abstraction (behavior, implementation, algorithm).
          - A clear contrast between a complex process and a simple one that yield the same behavior.
          - A way to challenge both assumptions.
     - What it must lack: 
          - An obvious answer (so it provokes discussion).
          - Dependence on prior knowledge of famous thought experiments.

     - Therefore, we will use the case as the anchor, but we might briefly use a simple example (thermostat) to illustrate the fallacy.

  8. Closing Question/Task (15 minutes)
     - Task: Break into pairs and consider a variation: What if the twin is not a lookup table or a circuit, but a human who has memorized the entire lookup table and answers queries by looking up in their memory? (This is like the Chinese Room, but we are using it to test understanding of the structure of the problem.)
     - Question: Does the human twin have the same moral status as the original system? Why or why not? What features matter?
     - This tests whether they have moved beyond vocabulary to structure because:
          - They must apply the same reasoning: same behavior, different implementation (human vs. machine) and different algorithm (the human is using their brain, which is a different algorithm).
          - They must consider if the internal process (the human's conscious experience) is relevant.
          - They must confront the practical question: Even if the human is conscious, does that mean the system they are implementing is conscious? Or is it the human that is conscious?
     - We can then have a brief discussion (5 minutes) to share insights.

  9. What to Leave Out
     - We will leave out detailed discussions of specific theories of consciousness (like IIT, global workspace, etc.) because it's too much for one session and not necessary for the structure of the problem.
     - We will announce: "We are leaving out the specific theories of consciousness because we are focusing on the structural question of how behavior, implementation, and algorithm relate to moral status. We are also not trying to solve the hard problem of consciousness but to understand the landscape of the question."

  10. Detailed Timeline:
      - 0-10 min: Introduction and case presentation.
      - 10-30 min: Dismantling behavioral equivalence (with Twin1). Include a quick example (thermostat) if needed.
      - 30-50 min: Dismantling moral status scaling with computation (with Twin2).
      - 50-60 min: Factual vs. practical and the two swaps.
      - 60-75 min: Discussion of the two swaps and addressing misconceptions as they arise.
      - 75-90 min: Closing task (human twin variation) and wrap-up.

  Note: Be flexible and let the discussion flow, but keep an eye on the time and the key points to cover.
answer: |-
  ### Teaching Plan: Cross-Departmental Reading Group on Moral Relevance of Computations  
  **Session Duration:** 90 minutes  
  **Participants:** 6 non-philosophers (2 ML engineers, 1 systems neuroscientist, 3 grad students).  
  **Core Goal:** Dismantle two assumptions—(1) behavioral equivalence implies phenomenological equivalence ("behaving like a person = feeling like one"), (2) moral status scales with computational complexity/amount—using your original case study.  

  ---

  ### **Sequenced Plan: Ideas, Dependencies, and Timing**  
  *Why this sequence?* We start with *behavior* (accessible to non-philosophers) and layer in implementation/algorithm distinctions. The case anchors the session but needs a simpler warm-up to preempt fallacies.  

  #### **Phase 1: Introduction & Warm-Up (15 min)**  
  - **Goals:** Surface assumptions, introduce key terms (computation, behavior, implementation, algorithm).  
  - **Activity:**  
    1. **Prompt (5 min):** "You see a system that behaves exactly like a human. What would convince you it 'feels' like one? What features matter?"  
       - *Listen for Assumption 1 (behavioral equivalence = feeling).*  
    2. **Simple Case (Thermostat, 10 min):**  
       - *Case:* A thermostat "behaves" optimally (turns heat on/off to maintain temperature). Does it "feel" cold?  
       - *Why:* Illustrates that identical behavior ≠ subjective experience. Challenges Assumption 1.  
       - *Dependency:* Must come first—uses intuitive example to expose behavioral equivalence fallacy.  

  #### **Phase 2: Present Your Case & Dismantle Assumption 1 (25 min)**  
  - **Goals:** Apply behavioral equivalence critique to your case; dissociate behavior from implementation.  
  - **Activity:**  
    1. **Case Presentation (10 min):**  
       - Describe the original system (trained model), Twin1 (lookup table), Twin2 (compressed circuit).  
       - Emphasize: Both twins are *behaviorally indistinguishable* from the original on all possible inputs.  
    2. **Guided Discussion (15 min):**  
       - *Question 1:* "After swapping the original for Twin1, does anything morally relevant vanish? Why?"  
         - *Expected Misconception:* "Twin1 behaves identically, so it must feel identical."  
         - *Head Off Here:* Interrupt to stress: Twin1 is a *static map* (lookup table), not a dynamic process. Ask: "Does a static map 'experience' anything? Or is it just retrieving precomputed answers?"  
       - *Key Point:* Behavior alone is insufficient for moral status; implementation matters.  

  #### **Phase 3: Dismantle Assumption 2 & Introduce Algorithm (25 min)**  
  - **Goals:** Challenge computational complexity as proxy for moral status; distinguish implementation from algorithm.  
  - **Activity:**  
    1. **Transition to Twin2 (10 min):**  
       - *Question 2:* "Now swap Twin1 for Twin2 (small circuit, same behavior, different algorithm). Should this worry us more or less than the first swap?"  
       - *Expected Misconception:* "Twin2 is simpler, so it has less moral status."  
         - *Head Off Here:* Note: Moral status ≠ computational complexity (e.g., a bee may matter more than a supercomputer).  
    2. **Algorithm vs. Implementation (15 min):**  
       - *Question:* "Is Twin2's algorithm (simple circuit) more 'alive' than Twin1's lookup table? Or less?"  
       - *Expected Misconception:* "Implementation is just physics—open the box and see what's inside!"  
         - *Head Off Here:* Clarify: "Implementation" is abstraction-dependent (e.g., same circuit can be seen as NAND gates or voltage flows). The *algorithm* (step-by-step process) is what we care about.  
       - *Key Point:* Moral relevance may depend on *how* computation happens (algorithm), not just output or substrate.  

  #### **Phase 4: Factual vs. Practical Questions (15 min)**  
  - **Goals:** Separate "is there something it is like?" (factual) from "what should we do?" (practical). *Teach this split—it’s critical.*  
  - **Activity:**  
    - *Question:* "For Twin2: We don’t know if it 'feels' (factual). But should we treat it as if it might (practical)?"  
    - *Why Teach This Split:* The group will conflate them. Emphasize:  
      - **Factual:** Hard problem of consciousness (unknowable without theory).  
      - **Practical:** Precautionary principle (if uncertain, err on the side of caution).  
    - *Tie to Case:* Twin2’s alien algorithm might *factually* lack experience, but its behavioral fidelity creates *practical* obligations.  

  #### **Phase 5: Synthesis & Swaps Comparison (10 min)**  
  - **Activity:**  
    - *Questions:*  
      1. "Which swap loses more moral relevance: Original→Twin1 (same behavior, different implementation) or Twin1→Twin2 (same behavior, different algorithm)?"  
      2. "Does moral relevance require a specific *kind* of computation (e.g., dynamic, adaptive)?"  
    - *Expected Insight:*  
      - Swap 1 (→Twin1) likely loses *more*: Dynamic process → static map feels like losing "life."  
      - Swap 2 (→Twin2) is ambiguous: Simpler algorithm may not feel "less," but its alien nature raises new doubts.  

  #### **Closing Task: Assess Understanding (5 min)**  
  - **Task:** "Design *one question* to test if a system’s algorithm (not behavior) has moral relevance. What would you probe?"  
    - *Why This Works:* Tests grasp of *structure* (algorithm vs. behavior), not vocabulary.  
    - *Good Response:* E.g., "Does the system adapt unpredictably?" or "Is its process irreducibly complex?"  

  ---

  ### **Case Design & Anchor Role**  
  - **Can This Case Carry the Session?** Yes, but with the thermostat warm-up.  
    - **What the Case Must Have:**  
      - Behavioral equivalence across variants.  
      - Clear implementation/algorithm contrast (Twin1 vs. Twin2).  
      - No obvious real-world analog (avoids "just like the Chinese Room").  
    - **What It Must Lack:**  
      - Ambiguity about behavioral parity (stipulate it’s perfect).  
      - No ties to famous thought experiments (prevents canned responses).  

  ---

  ### **Demoting the Chinese Room**  
  - **You Are Right to Demote It.**  
    - **Why:** The Chinese Room focuses on *semantic understanding* ("does it comprehend Chinese?"), not *which computation is morally relevant*. Your case targets multiple realizability and substrate independence—e.g., Twin2’s algorithm is nothing like the original’s, but outputs match.  
    - **What It Fails to Supply:**  
      - No insight into how *algorithmic differences* (not just implementation) affect moral status.  
      - Ignores the practical/factual split (Searle assumes understanding is binary).  

  ---

  ### **Key Announcements About Scope**  
  - **Leave Out:**  
    - Theories of consciousness (IIT, global workspace). *Announce:* "We’re bracketing specific theories to focus on structural questions."  
    - Neurocentrism (e.g., "only brains feel"). *Announce:* "We’re assuming computation, not biology, is the issue—but we’ll revisit if needed."  
  - **Why:** Prevents digressions; keeps focus on computation/behavior tension.  

  ---

  ### **Misconception Map & Intervention Points**  
  1. **Behavioral-Equivalence Fallacy**  
     - *When It Surfaces:* Phase 2 (Twin1 discussion).  
     - *Intervention:* "If a lookup table behaves human, is it human? What if we print it as a book?"  
  2. **Implementation Read Off Physics**  
     - *When It Surfaces:* Phase 3 (Twin2 discussion).  
     - *Intervention:* "Is an algorithm defined by silicon vs. neurons? Or by abstract steps?"  
  3. **Simulation vs. Instantiation**  
     - *When It Surfaces:* Phase 3/4 (e.g., "Twin2 is just simulating!").  
     - *Intervention:* "What does 'simulation' mean here? If it behaves indistinguishably in all contexts, is the distinction useful?"  

  ---

  ### **Flexibility Notes**  
  - **If Discussion Lags:** Ask, "What if Twin2’s circuit evolved naturally? Would that change its status?"  
  - **If Engineers Dominate:** Redirect with, "How would a neuroscientist approach the 'algorithm' of a brain?"  
  - **Time Buffer:** Use Phase 5 for open debate if earlier sections run short.  

  This plan builds from behavior → implementation → algorithm, with your case as the engine. It forces engagement with *novel* questions while systematically dismantling assumptions. The closing task reveals if they internalize the framework—not just the jargon.
