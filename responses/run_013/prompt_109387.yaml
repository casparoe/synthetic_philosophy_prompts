  ### Microdomain: Directed Graph Arrows

  **Primitives and Relations:**
  - **Nodes**: Finite set of labeled nodes: `{A, B, C, X, Y, Z}`.
  - **Arrows**: Directed edges between nodes. Defined relations:
    1. **Direct Arrow (DA)**: A direct edge from one node to another (e.g., `A → B`).
    2. **Common Target (CT)**: Two nodes share the same immediate successor (e.g., if `A → C` and `B → C`, then `A` and `B` have a CT relation via `C`).
    3. **Path Extension (PE)**: A node reaches another via a single intermediate node (e.g., `A → C → B` implies a PE relation from `A` to `B`).

  Domain is closed: Only these nodes and relations exist. No isolated nodes; all arrows form explicit, documented paths.

  ---

  ### Analogy Problem
  **Source Pair**:  
  - `(A, B)`  
    - **Explicit arrows**: `A → C` and `B → C` (so `A` and `B` share a CT relation via `C`).  
    - **Implicit structure**: `C → D` (a documented path, but `D` is not part of the source pair).  
    - *Full description*: `A → C → D` and `B → C → D`. Thus, `A` and `B` both have a PE relation to `D` via `C`.  

  **Target**:  
  - `(X, Y)`  
    - **Explicit arrows**: `X → Z` and `Y → Z`.  
    - **Task**: Find a node `W` such that the relation from `(X, Y)` to `W` mirrors the source pair’s relation to its "answer."  

  **Candidate Answers**:  
  - Surface answer: `Z` (via CT, as `X` and `Y` both point to `Z`).  
  - Slipped answer: `D` (via PE, as `X → Z → D` and `Y → Z → D` for some `D`).  

  ---

  ### Specifications Satisfied
  1. **Two readings yielding different answers**:  
     - **Surface reading**: Applies CT (common target). Source: `A` and `B` share `C`; target: `X` and `Y` share `Z`. Answer: `Z`.  
     - **Slipped reading**: Applies PE (path extension). Source: `A` and `B` both reach `D` via `C`; target: `X` and `Y` both reach `D` via `Z`. Answer: `D`.  

  2. **Slippage licensed by source feature**:  
     - **Feature**: The source pair `(A, B)` has an *idle intermediate node (`C`)* that enables a path to `D`. The CT relation (`A,B → C`) is surface-visible, but the PE relation (`A,B → C → D`) relies on `C`’s role as a gateway. This gateway role (unused in CT) licenses re-describing `C` not as the target, but as a mediator to `D`.  

  3. **Surface reading is a good rule**:  
     - In prior problems (e.g., `(P, Q)` with `P → R`, `Q → R`), CT correctly identifies `R` as the shared target. Ignoring paths would suffice here, making CT reliable. Slippage imposes a cost: It forces considering "hidden" paths, which are irrelevant in simple CT cases.  

  4. **Microdomain ratchets**:  
     - The slipped answer `D` creates a new role: **Mediator Node** (e.g., `C` or `Z` as conduits, not endpoints). In the next problem (e.g., `(M, N) → ?` with `M → T → U`, `N → T → U`), the mediator `T` can now be reinterpreted as a gateway, allowing answers like `U` (via PE) even if `T` is superficially the target.  

  ---

  ### Accounting
  - **Source pair**: `(A, B)` with arrows `A → C`, `B → C`, and implicit `C → D`.  
  - **Target**: `(X, Y)` with arrows `X → Z`, `Y → Z`.  
  - **Answers**:  
    - Surface (CT): `Z` (direct shared target).  
    - Slipped (PE): `D` (shared node two steps away).  
  - **Licensing feature**: The source’s intermediate node `C` serves as a **gateway to `D`**. This idle path (`C → D`) makes `D` a valid endpoint for reinterpretation.  
  - **If feature deleted**: If `C → D` did not exist, the PE relation would collapse. The only valid answer would be the surface CT (`C`), eliminating slippage.  
  - **Surface advocate's reply**:  
    - *Strongest argument*: "The source pair’s arrows explicitly terminate at `C`, so the target’s arrows terminate at `Z`. `D` is external and irrelevant."  
    - *Concession required*: The slipped reading concedes that `Z` *is* a valid answer under CT but argues that the gateway structure in the source licenses prioritizing deeper endpoints.  

  ---

  ### Why This Works
  - **Internal coherence**: The CT/PE tension arises solely from the arrows. No external knowledge or programs needed.  
  - **Fluidity cost**: Surface readers must overlook a documented path (`C → D`), which is counterproductive if future problems involve chained paths (ratcheting).  
  - **Slippage trigger**: The idle gateway (`C`) forces asking: "Is the shared node the endpoint, or does it point further?"  
  - **Ratcheting**: The mediator role (`Z` in the target) becomes a pivot for future path-based re-descriptions.
