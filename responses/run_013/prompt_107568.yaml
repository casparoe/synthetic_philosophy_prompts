prompt: |-
  I'm prepping a seminar on Montaigne and I keep going back and forth on something in the cannibals essay. Montaigne basically says we call barbarism whatever isn't our own custom, and then he spends the rest of the piece describing the Brazilian peoples in ways that clearly aim to shame his own countrymen — their wars are gentler, their cannibalism is motivated by revenge rather than by the torture Europeans inflict, they treat their prisoners in a way he almost admires. Heres my problem: is he actually a relativist, or is he smuggling in a universal standard — nature, reason, some notion of the original human condition — and just using the New World as a mirror? And does the essay's argument survive once you notice he still calls some practices good and others bad? Help me sort out what's actually going on in the argument, and what the most defensible reading is. Not looking for a reading list, just help thinking it through.
reasoning: |-
  Okay, let's tackle this user's query. They're prepping a seminar on Montaigne's "Of Cannibals" and are stuck on whether Montaigne is a relativist or if he's using a universal standard. The user points out that Montaigne criticizes European customs by comparing them to the Tupinambá, who he portrays as more noble in some aspects. But then Montaigne still judges practices as good or bad, which complicates the relativist angle.

  First, I need to recall the essay's main points. Montaigne starts by saying that "barbarism" is a term based on unfamiliarity, not inherent wrongness. He describes the Tupinambá people's practices like cannibalism but contrasts their motivations with European torture. The user is confused because Montaigne seems to relativize customs but then makes value judgments. 

  So, the user's main question is about relativism versus universal standards. They wonder if Montaigne is using nature or reason as a hidden benchmark. Also, they're asking how the argument holds up when Montaigne condemns certain practices. 

  I should break down the elements of Montaigne's argument. His relativism is about cultural practices—what's considered barbaric is relative to one's own customs. But he also appeals to nature, reason, and virtue. The Brazilian tribes live closer to nature, which Montaigne sees as inherently good. Their customs are guided by natural reason, unlike Europeans who are corrupted by artificial institutions. 

  When Montaigne praises the Tupinambá's warfare and criticizes European torture, he's using nature as a universal standard. Their cannibalism is framed as part of a coherent cultural system of honor and revenge, which he contrasts with the arbitrary cruelty of European wars. This isn't full relativism because he uses "nature" as the criterion. 

  The user also mentions that Montaigne still calls some practices good or bad. This is where the distinction between cultural relativism and moral evaluation comes in. Montaigne doesn't endorse all customs; he evaluates them based on their alignment with natural reason and virtue. So, while he relativizes the label of "barbarism," he doesn't abandon moral judgment. 

  The defensible reading here is that Montaigne is a mitigated relativist. He rejects ethnocentrism but upholds universal principles rooted in nature. His argument survives because he's consistent: the standard isn't European customs but natural law. The Brazilian tribes serve as a mirror to show Europeans their own deviations from these principles. 

  For the seminar, the user could focus on how Montaigne uses the New World as a critique tool. Highlighting the distinction between cultural practices and underlying virtues might clarify his stance. Also, discussing how Montaigne's own biases (like idealizing the "noble savage") affect his argument could add depth. 

  The user might be concerned about presenting a balanced view to students. They need to show Montaigne's critique of Eurocentrism while acknowledging his use of universal standards. Emphasizing the essay's rhetorical strategy—using the Tupinambá to provoke self-reflection—could help. Also, addressing the potential contradictions in his approach would make the seminar more engaging.
answer: |-
  Here's a breakdown of the core tension in Montaigne's "Of Cannibals" and a defensible reading of his argument:

  **1. The Explicit Relativist Move (Smashing Ethnocentrism):**
  *   **The Opening Salvo:** Montaigne unequivocally attacks the *label* "barbarian" as purely relative: "each man calls barbarism whatever is not his own practice." This is a fundamental critique of European arrogance and the assumption of inherent superiority. He exposes the *label* as an expression of cultural bias, not objective truth.
  *   **The Mirror Function:** The primary purpose of describing the Tupinambá is indeed to hold up a mirror to European society. By detailing their practices (warfare, justice, treatment of prisoners, social cohesion) in a way that often seems *more* reasonable, honorable, or less cruel than contemporary European practices, he forces his readers to confront their own "barbarism." This relativizes the *evaluation* of practices based solely on their origin.

  **2. The Universal Standard (Nature, Reason, Virtue):**
  *   **Nature as the Benchmark:** Montaigne *does* consistently invoke "Nature" as the ultimate standard. He praises the Tupinambá because they are "still governed by natural laws and very little corrupted by our own." This "state of nature" (not Rousseau's later idealized version, but closer to an original condition) is presented as inherently good, rational, and virtuous.
  *   **Reason and Virtue:** His admiration for the Tupinambá stems from perceived virtues accessible to universal reason:
      *   **Courage & Honor:** Their warfare and treatment of prisoners involves displays of valor, endurance, and a code of honor he finds admirable ("noble").
      *   **Justice & Simplicity:** Their legal/political system is presented as straightforward, equitable, and free from the complexities and corruptions of European courts and kingship.
      *   **Lack of Artificial Vice:** He contrasts their natural desires (including cannibalism, framed as ritual revenge) with European vices stemming from artifice: greed, religious persecution, pointless cruelty, torture, political intrigue, social inequality.
      *   **Motivation Matters:** Crucially, he contrasts the *motivation* behind Tupinambá cannibalism (revenge within a coherent cultural system) with the *motivation* behind European torture and massacre (greed, religious fanaticism, sheer cruelty). The former, while shocking to European sensibilities, possesses a kind of internal logic and restraint; the latter seems arbitrary and boundless.

  **3. Reconciling the Tension: Not Pure Relativism, but "Mitigated Relativism" or "Critical Universalism"**

  Montaigne isn't saying *all* practices are equally valid because they are culturally relative. He's saying:

  *   **Step 1:** **Reject the Ethnocentric Label:** Calling others "barbarians" simply because their customs differ is ignorant and arrogant. Judging solely by *our* customs is invalid.
  *   **Step 2: Evaluate Practices Against Nature/Reason/Virtue:** Having discarded the biased label, we can *then* evaluate practices (both theirs and ours) against a deeper, universal standard: conformity to "Nature," reason, and fundamental virtues (courage, justice, simplicity, restraint, honor).
  *   **The Result:** Using this universal standard (Nature), Montaigne argues that the Tupinambá, despite a practice Europeans find utterly abhorrent (cannibalism), exhibit virtues *more consistently* and live in a way *closer* to this natural ideal than contemporary Europeans. Their "barbarous" custom is embedded in a system with virtues, while European "civilization" produces systematic vices.

  **4. Why the Argument Survives (and is Strengthened) by his Judgments:**

  *   **He's Not Endorsing Cannibalism Per Se:** He never says "cannibalism is good." He says:
      *   Calling it "barbarous" *just because it's unfamiliar* is wrong.
      *   Understanding its *context* and *motivation* reveals it's part of a system with admirable virtues.
      *   Compared to the *actual practices* and *motivations* of Europeans, this system *as a whole* is arguably less barbarous.
  *   **Consistency of Standard:** His judgments ("good" and "bad") are *not* based on French custom. They are consistently applied based on the universal standard (Nature/reason/virtue) he establishes. He judges *both* societies by the *same* yardstick. He finds European practices wanting *by their own* professed ideals of reason and Christianity, as well as by the natural standard.
  *   **The Power of the Contrast:** The essay's brilliance lies in using the *most shocking* possible example of "otherness" (cannibalism) to force the reader past initial revulsion and see the deeper virtues of the Tupinambá system *and* the deeper vices of their own. If he can make cannibalism seem *less* barbarous than European torture *when judged by a consistent standard*, his critique of European hypocrisy and corruption is devastating.

  **The Most Defensible Reading:**

  Montaigne is **not a radical cultural relativist** who believes all moral judgments are culture-bound. He **is a trenchant critic of ethnocentrism** who exposes the hollowness of labeling others "barbarian." Crucially, he **employs a universal standard – conformity to "Nature," reason, and core virtues (courage, justice, restraint)** – to evaluate *all* societies. He finds the Tupinambá, despite a practice Europeans find abhorrent, live closer to this natural ideal and exhibit these virtues more consistently than the artificially corrupted Europeans.

  **This argument absolutely survives his value judgments** because those judgments are *not* based on cultural preference but on his explicitly argued universal standard. The essay isn't saying "everything is relative, so nothing matters." It's saying: **"Stop judging others by your own narrow customs. Look deeper at *why* they do things and the virtues they embody. And when you do that, using reason and nature as guides, you might find your own 'civilized' society far more barbarous."** The cannibals become the mirror revealing the true face of European barbarity.

  **For Your Seminar:**

  *   Focus on the *rhetorical strategy*: How does using the most extreme "other" make his critique of Europe more powerful?
  *   Highlight the distinction between *labeling* ("barbarian") and *evaluating* (against Nature/reason).
  *   Emphasize that his praise of Tupinambá virtues is inseparable from his condemnation of European vices – they are two sides of the same coin, judged by the same standard.
  *   Acknowledge the potential tension but argue that his invocation of Nature/reason provides a consistent (if perhaps idealized) framework that avoids pure relativism while demolishing ethnocentrism. His universalism is *critical*, not prescriptive dogma. It's used to expose hypocrisy, not to build a new rigid system.

  This reading preserves the essay's radical critique while giving Montaigne a coherent, defensible philosophical stance.
