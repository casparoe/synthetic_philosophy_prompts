  The user is perceptive to suspect this isn't purely empirical. They're noticing how the debate layers multiple questions: metaphysical (what exists), explanatory (what counts as good science), and pragmatic (what research paths are fruitful). Smart undergrad - they've identified that the sides are partially talking past each other.

  Ah, the key insight might be that computationalists are committed to computation as a causal-explanatory level (like Marr's algorithmic level), while critics see computation as observer-dependent. This isn't just about the word "computation" - it's about whether cognitive science should privilege abstract symbol manipulation over continuous dynamics.

  What would help this student? They need the disagreement mapped cleanly without taking sides. Should emphasize: both positions have merit. Computationalism provides concrete models for phenomena like reasoning, while critics rightly point out its limitations for embodied skills like catching a ball. The real progress would come from clarifying explanatory targets - some cognitive phenomena may genuinely require computational explanations, others might be better served by dynamical approaches. 

  The user's request for "diagnosis not verdict" is wise. I'll avoid recommending papers and focus on showing how the arguments interlock. Might use the two-maps case to demonstrate how both sides interpret the same scenario differently based on their explanatory priorities. 

