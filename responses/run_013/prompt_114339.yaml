answer: |-
  Here's a structural diagnosis of the dispute, mapping the core disagreements and paths to progress:

  ### The Three-Layered Disagreement
  1.  **Metaphysical/Descriptive Claim:** Is computation an *intrinsic property* of cognitive systems?
      *   **Computationalists:** Argue that computation (manipulation of representational structures via algorithms) is a real, discoverable feature of the brain's causal structure. It's not just a description; it's *how the brain works*.
      *   **Critics:** Argue computation is *observer-relative*. Any physical system can be *described as* computing given a sufficiently gerrymandered mapping. Calling the brain a "computer" adds no substantive information without specifying why *this particular mapping* is privileged.

  2.  **Explanatory Claim:** Are representations/algorithms the *right level* for explaining cognition?
      *   **Computationalists:** Cognition *is* information processing. Explaining *how* the system transforms representations via algorithms provides mechanistic insight into cognitive capacities (e.g., solving problems, forming beliefs). The "trivial" mappings don't explain because they don't capture the causal structure relevant to the system's cognitive function.
      *   **Critics:** Privileging the representational/algorithmic level is arbitrary and ignores the essential role of continuous dynamics, embodiment, and real-time interaction with the environment. Cognition emerges from these non-computational properties. A "cognitive" mapping might be useful for prediction, but it doesn't reveal the *real basis* of cognition.

  3.  **Semantic/Pragmatic Claim:** What does "computation" *mean* in this context?
      *   **Computationalists:** Use "computation" in a specific, substantive sense: the processing of structured, content-bearing states (representations) according to rules (algorithms) that are causally efficacious in the physical substrate. The "trivial" mappings violate this sense.
      *   **Critics:** Point to the *formal definition* of computation (e.g., implementing a state transition table, Turing machine). By this definition, the claim *is* trivial. If computationalists mean something else, they need to define it rigorously to avoid vacuity.

  ### The "Two-Maps" Case: Why It Stalls
  *   **Computationalist View:** The "trivial" mapping isn't a *serious candidate* because it doesn't explain the system's cognitive capacities. The "cognitive" mapping is privileged because it *correlates with and explains* the cognitive behavior. It captures the causal structure *used by* the system to achieve its function. The "trivial" mapping is an artifact of description.
  *   **Critic View:** The "two-maps" case *proves* there's no intrinsic computational fact. Both mappings are formally valid. Choosing the "cognitive" one reflects *our explanatory interests* in cognition, not an inherent property of the system. It's a useful fiction, not a discovery of mechanism.
  *   **The Impasse:** Computationalists rely on explanatory success to identify the "real" computation, while critics argue explanatory success doesn't establish ontological primacy and is vulnerable to the triviality problem.

  ### Diagnosis: Not *Just* Verbal, But Intertwined
  *   **Not Purely Verbal:** Both sides understand the terms similarly enough. The dispute isn't *only* about defining "computation." It's about **ontological commitment** (does computation exist in the system?) and **explanatory primacy** (is it the fundamental level?).
  *   **Not Primarily Empirical:** While neuroscience evidence (e.g., neural coding, algorithmic models of specific functions) informs the debate, the core clash is **metaphysical and methodological**. What *counts* as explaining cognition? What constitutes a "real" mechanism versus a useful description?
  *   **Research Programs Talking Past?:** Partially. Computationalism is often a **mechanistic research program** seeking algorithms implemented in neural hardware. Critics often advocate an **alternative paradigm** (dynamical/embodied) seeing cognition as fundamentally different from symbol manipulation. However, the "triviality" argument directly challenges the *foundations* of the computationalist program's core claim.
  *   **Core Disagreement:** It's fundamentally a **disagreement about explanatory standards and ontological grounding**:
      *   Computationalists accept the autonomy of the algorithmic level as causally explanatory.
      *   Critics demand that explanations be grounded in non-representational, physical dynamics and see the algorithmic level as potentially epiphenomenal or observer-dependent.

  ### Paths to Progress (Not Resolution)
  1.  **Refine the Target:** Move beyond "Is the brain a computer?" Specify:
      *   *Which specific cognitive phenomena* are best explained computationally vs. dynamically? (e.g., logical reasoning vs. motor control).
      *   *What kind* of computation is claimed? (e.g., classical symbolic, connectionist, neural network models).
  2.  **Clarify "Discovery":** What criteria definitively establish that a discovered mapping captures the *real* computation implemented by the system, beyond just predicting behavior? (e.g., causal intervention, evolutionary/functional arguments, neural realizability constraints). This directly addresses the "two-maps" challenge.
  3.  **Formalize Constraints:** Develop rigorous criteria for what makes a computational description *non-gerrymandered* and *explanatorily relevant* (beyond mere implementability). This could involve:
      *   **Causal Specificity:** Mapping must correspond to distinct causal states/pathways in the system.
      *   **Functional Relevance:** The "computation" must be what the system is *doing* to achieve its evolved/designed purpose.
      *   **Robustness:** The mapping should hold under relevant perturbations/variations.
      *   **Efficiency/Generality:** The mapping shouldn't be absurdly complex or system-specific.
  4.  **Focus on Explanatory Gaps:** Instead of absolute claims, investigate where computational explanations demonstrably *succeed or fail* compared to dynamical/embodied explanations for specific tasks. Does adding dynamics significantly improve the model? Does a purely computational model miss essential features?
  5.  **Acknowledge Pluralism:** Recognize that different levels of description (physical, dynamical, algorithmic, functional) might be necessary and complementary for a full understanding of cognition. The debate then becomes about primacy or sufficiency for *specific explanatory goals*.
  6.  **Shift from "Computer" to "Computes":** Focus less on whether the brain *is* a computer and more on whether specific cognitive processes *involve* computation (of a specific type) as an essential component of their mechanism.

  ### Can They Make Contact? Yes, But...
  The debate isn't ill-posed, but the original question ("Is the brain a computer?") is too blunt. Genuine contact requires:
  *   **Computationalists** to directly confront the "two-maps" challenge with robust criteria for identifying "real" computations that go beyond explanatory utility and address the observer-relativity charge.
  *   **Critics** to acknowledge that computational models *do* provide powerful explanations for specific cognitive phenomena and articulate precisely *why* dynamics/embodiment provide a *better* or *more fundamental* explanation where they do.
  *   **Both sides** to engage with specific cognitive capacities and compare the explanatory power and mechanistic plausibility of competing models (computational vs. dynamical/embodied) for *that specific phenomenon*.

  Progress lies in moving from the abstract metaphysical dispute to concrete, comparative explanations of cognitive phenomena while rigorously addressing the underlying challenges each side poses to the other's foundations. The "two-maps" case is not a knockout blow but a crucial challenge demanding a sophisticated response. The dispute won't be "solved," but it can be made more productive.
