answer: |-
  ## Dissertation Prospectus: Substitutability and the Perceived Weakness of Omission Causation  

  **1. Title:**  
  The Illusion of Impotence? Substitutability as the Hidden Determinant of Causal Strength Ascriptions to Omissions  

  **2. Research Question:**  
  When an omission (e.g., failing to order a scan) and a functionally equivalent action (e.g., actively cancelling an ordered scan) lead to the *identical outcome* through the *identical causal chain*, why do we persistently perceive the omission as a *weaker cause*? Does this perceived weakness primarily track the *substitutability* of potential interveners (how many others *could* have performed the omitted act), rather than being a direct consequence of normative duties or a fundamental metaphysical difference between acts and omissions?  

  **3. Problem Significance & Stakes:**  
  *   **Personal Motivation:** Rooted in the tragic case of a fatal hospital omission, highlighting real-world confusion between causal attribution and blame assignment.  
  *   **Theoretical Gap:** Dominant positions on omission causation fail to explain the *graded perception of weakness* when causal chains and outcomes are held constant:  
      *   **Omissions Aren't Causes (e.g., Dowe, Beebee):** Dismisses omissions entirely, failing to account for strong intuitions in cases like the hospital failure.  
      *   **Omissions Are Causes (e.g., Lewis, Schaffer):** Treats omissions as equivalent causes, unable to explain the persistent *intuition* of relative weakness compared to actions.  
      *   **Normative/Duty-Based Accounts (e.g., Moore, Honoré):** Explains why we *blame* or *hold responsible* for omissions, but conflates normative duty with *causal strength perception*. It doesn't explain why the omission feels *causally weaker* even when duty is undisputed (e.g., the hospital *clearly* had a duty to scan).  
  *   **Core Puzzle:** If causation is about difference-making within a chain, and the chain/outcome is identical, the *causal contribution* of the omission vs. action should be identical. The persistent intuition of weakness demands an explanation beyond metaphysics or norms. Substitutability offers a novel, empirically testable hypothesis.  

  **4. Core Hypothesis:**  
  The perceived causal weakness of an omission (relative to an equivalent action leading to the same outcome) is inversely proportional to the *substitutability* of the agent – i.e., the number of other agents who *could easily and normally* have performed the omitted act. Low substitutability (only one agent *could* have acted) strengthens the perception of the omission as a cause; high substitutability (many could have acted) weakens it. This operates independently of, though often correlates with, norms of duty.  

  **5. Research Plan (One Term - Month-by-Month):**  

  *   **Month 1: Conceptual Groundwork & Vignette Design**  
      *   Finalize precise definitions: "functionally equivalent action/omission", "identical causal chain/outcome", "substitutability" (operationalized as number + salience of alternative agents).  
      *   Develop core vignette pair: One depicts an *action* causing harm (e.g., Nurse A cancels scan order). The other depicts an *omission* causing identical harm through an identical chain (e.g., Nurse A fails to place scan order per protocol).  
      *   Design substitutability manipulations: Create 3 versions of the omission vignette systematically varying substitutability:  
          *   **Low Sub:** Only Nurse A *could* have ordered it (e.g., sole responsibility, unique access).  
          *   **Medium Sub:** Nurse A had primary duty, but Nurse B/C *could* have noticed and ordered it.  
          *   **High Sub:** Ordering was a routine task easily performed by any of 5+ nurses on duty.  
      *   Control vignettes: Test perception of equivalent *actions* with varying "substitutability" (e.g., could others have intervened to *stop* the action?) to isolate the omission effect.  

  *   **Month 2: Data Collection & Analysis**  
      *   **Method:** Online survey experiment (e.g., Qualtrics, Prolific).  
      *   **Participants:** Target N=300+ (100 per substitutability condition), screened for attention.  
      *   **Procedure:** Random assignment to one vignette. Measure:  
          *   **Dependent Variable 1 (Causal Strength):** "To what extent did [Nurse A's action/omission] cause the patient's death?" (1-7 Scale).  
          *   **Dependent Variable 2 (Blame/Role):** "To what extent is [Nurse A] to blame?" / "To what extent did [Nurse A] fail in their role?" (1-7 Scales) – to *disentangle* causation from blame.  
          *   **Manipulation Check:** Questions confirming understanding of who *could* have acted.  
      *   **Analysis:**  
          *   ANOVA: Compare causal strength ratings across Action + 3 Omission (Substitutability) conditions.  
          *   Key Prediction: Causal strength for the *omission* will be significantly lower than the action *only* in Medium/High Sub conditions, converging with the action rating in Low Sub.  
          *   Regression: Test if substitutability predicts causal strength ratings *within* omission vignettes, controlling for blame ratings.  

  *   **Month 3: Interpretation, Writing & Integration**  
      *   Analyze results: Did substitutability modulate causal strength ratings for omissions as predicted? Did it affect blame differently?  
      *   Interpret findings in light of theories: Do results support substitutability as a key driver of perceived causal weakness? Do they challenge purely normative or metaphysical accounts?  
      *   Draft Dissertation Chapter: Integrate literature review, methodology, results, and discussion.  
      *   Refine argument: How do results clarify the act/omission distinction in causation? What are implications for legal/moral reasoning (distinguishing causation from responsibility)?  

  **6. Why This Method Beats Alternatives:**  

  *   **Vs. Purely Conceptual Analysis:** Directly tests the *psychological intuition* driving the philosophical puzzle with quantifiable data. Conceptual analysis alone cannot resolve why the *feeling* of weakness persists.  
  *   **Vs. Legal Case Studies:** While relevant, case studies (like the hospital inquest) are confounded by multiple factors (blame, liability, complex facts). Controlled vignettes isolate the variables of interest (act/omission, substitutability).  
  *   **Vs. Broad Surveys on Omissions:** Focuses precisely on the core contrast (identical chains/outcomes) and the novel substitutability hypothesis, avoiding the morass of general omission causation debates.  
  *   **Feasibility:** Online surveys are time-efficient and cost-effective for an MA term project. The design is focused and testable.  

  **7. Expected Results & Interpretation:**  

  *   **Success (Supports Hypothesis):**  
      *   Causal strength ratings for omissions are significantly lower than equivalent actions *only* under medium/high substitutability.  
      *   Under *low substitutability*, causal strength ratings for omissions converge with those for actions.  
      *   Substitutability significantly predicts causal strength ratings for omissions *independent* of blame ratings.  
      *   *Interpretation:* The perceived weakness of omissions is largely an artifact of substitutability, not an intrinsic feature of omissions or solely due to norms. Causation intuitions track potential interveners.  
  *   **Alternative Result (Supports Normative Account):**  
      *   Causal strength ratings for omissions are consistently lower than actions regardless of substitutability.  
      *   Blame ratings strongly correlate with causal strength ratings.  
      *   *Interpretation:* The perceived weakness is more fundamentally tied to the absence of an overt act or is inseparable from normative judgments of duty failure.  
  *   **Null Result (Project Failure - Uninformative):**  
      *   No significant difference in causal strength ratings between actions and omissions *or* across substitutability conditions.  
      *   *Likely Cause:* Poor vignette design (failed to establish identical chains/outcomes or manipulate substitutability effectively), flawed measures, or the core intuition is not robust.  

  **8. Scope Management & Feasibility:**  

  *   **Focused Question:** Addresses *only* the *perceived causal strength* gap for omissions vs. actions in identical chains, *not* the general metaphysics of omissions or full theories of responsibility.  
  *   **Controlled Experiment:** Uses tightly constrained vignettes to isolate variables. Avoids entanglement with complex real-world cases beyond the motivating example.  
  *   **Single Core Mechanism:** Tests *substitutability* as the primary explanatory variable against the dominant normative alternative.  
  *   **Realistic Output:** A single, well-designed experiment provides sufficient data for a robust MA thesis chapter. Analysis uses standard statistical techniques.  
  *   **Contingency:** If recruitment is slow, simplify to 2 substitutability levels (High vs. Low) or slightly reduce target N while maintaining power analysis.  

  **9. Conclusion:**  
  This project tackles a persistent and practically significant puzzle in causation – the intuitive weakness of omissions – by proposing and empirically testing the novel hypothesis of substitutability. Moving beyond the stalemate between metaphysical and normative accounts, it uses experimental philosophy methods to uncover the psychological underpinnings of causal ascription. By clarifying whether perceived causal weakness stems from the *availability of alternative interveners*, this research promises to refine our understanding of causation, sharpen the distinction between causal and normative judgments, and illuminate real-world reasoning in contexts like medical error and legal liability. The scope is tightly defined and methodologically feasible for a one-term MA project.
