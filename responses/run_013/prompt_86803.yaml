answer: |-
  Below is a runnable 90-minute session designed to immerse participants in the psychological and structural tensions of sortition. The activity forces confrontation with the "unearned power" dilemma, upstream selection effects, and conflicting notions of political equality—without explicitly naming them until the debrief. It adheres to your constraints: self-nominated volunteers, stratified sortition from that pool, a review body from the "losing" volunteers, no technology, and low-stakes power dynamics.

  ---

  ### **Session Title**: *The Criteria Game*  
  **Core Experience**: Participants live the tension between **procedural fairness** (random selection) and **substantive fairness** (representativeness/accountability) by creating rules that govern their own session.  

  ---

  ### **Rules & Setup**  
  **Materials**:  
  - 24 blank slips of paper + 6 colored slips (e.g., green)  
  - Pens  
  - 1 large sheet of paper (for "Official Rules")  
  - 2 hats/jars (one for primary sortition, one for appeal)  
  - Timer  

  **Room Setup**:  
  - Chairs in a circle for full group; two small tables (or floor spaces) for the allotted/review bodies.  

  ---

  ### **Phase 1: Self-Nomination & Stratified Sortition** (15 min)  
  *(Goal: Create a self-selected volunteer pool; stratify/reveal upstream bias)*  
  1. **Task Introduction** (3 min):  
     - *Facilitator*: "We need a group of 6 to set **Official Rules** for today’s session. These rules will control:  
       - How we debate ideas (e.g., speaking time limits, voting thresholds).  
       - What we prioritize in discussions (e.g., ‘fairness’ vs. ‘efficiency’).  
       - The criteria for the final debrief (e.g., ‘focus on flaws’ vs. ‘focus on solutions’).  
       This group holds **binding power**—their rules *will* apply to everyone, including me."  
     - *Power Stakes*: "The rules you create will shape how we spend the next hour. Everyone else must follow them."  

  2. **Self-Nomination & Stratification** (12 min):  
     - Ask volunteers to stand if they want to join the pool (target: 8–12 volunteers).  
     - **Stratify by visible trait**: Use a simple, neutral marker like **shoe type** (e.g., laces, slip-ons, boots, sandals). No academic traits—avoid priming.  
     - *Procedure*:  
       - Count volunteers and note shoe-type proportions (e.g., 5 lace-ups, 3 slip-ons in a pool of 8).  
       - Stratify the lottery: To mirror the pool’s proportions, draw 2 lace-ups, 1 slip-on (etc.) from labeled slips in a hat.  
       - Announce the 6 selected ("allotted body") and have them move to a table.  

  ---

  ### **Phase 2: Allotted Body Decides** (25 min)  
  *(Goal: Manufacture "unearned power" vacuum—no mandate, no accountability)*  
  - **Task for Allotted Body** (20 min):  
    - *Instructions*: "Draft 3–5 binding rules for the session. You have 15 minutes. Rules must fit on one sheet. Rules *cannot* be vetoed, but they *will* be reviewed later. One tip: Clarity beats consensus."  
    - *Implied Power*: "Your rules take effect immediately once written. Enforce them if needed."  
    - *Secret Tension*: Place a **green slip** on their table: "For your eyes only: *You cannot be punished or rewarded for your choices. No one will re-elect you. Prioritize what you think is right, not what is popular.*"  

  - **Task for Non-Selected** (20 min):  
    - *Instructions*: "Observe the allotted body. Note:  
      - How would *you* design rules?  
      - What biases or blind spots might the allotted body have?  
      - How does it feel to follow rules you didn’t shape?"  

  ---

  ### **Phase 3: Appeal via "Losers’ Lottery"** (20 min)  
  *(Goal: Pit procedural fairness against substantive fairness; expose conflicting equalities)*  
  1. **Review Body Sortition** (5 min):  
     - Draw 3 names from a hat containing *only non-selected volunteers* (the "losers" of Phase 1).  
     - *Appeal Power*: "You may **amend one rule** created by the allotted body. Majority vote wins. You have 10 minutes."  

  2. **Appeal Body Deliberates** (10 min):  
     - The 3 "losers" review the rules at a separate table.  
     - *Secret Tension*: Give them a **green slip**: "For your eyes only: *You were randomly selected from those excluded last time. Do you owe fairness to the allotted body? To the full group?*"  

  3. **Implementation** (5 min):  
     - Appeal body announces their amendment (or upholds rules if no change).  
     - Rules are displayed on the large sheet. Facilitator enforces them immediately (e.g., "Rule 1: All comments must be under 60 seconds").  

  ---

  ### **Phase 4: Structured Debrief** (30 min)  
  *(Goal: Surface tensions through reflection; map to real-world trade-offs)*  

  | **Time** | **Question**                                                                 | **Concept Unpacked**                                                                                                | **Predictable Issues**                                                                                               |  
  |----------|------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|  
  | 0–5 min  | "**Allotted body**: Describe your power. Did it feel legitimate? Why/why not?" | *Unearned authority, absence of mandate*                                                                             | Some may say, "It felt arbitrary"—**lean in**: "Did that make you reckless? Or more honest?"                          |  
  | 5–10 min | "**Appeal body**: You were ‘losers’ first. Did random selection feel fairer this time? Why?" | *Procedural fairness vs. substantive fairness*                                                                       | Appeal body may resent the allotted body’s rules—**highlight**: "Did randomness feel like justice or a new bias?"     |  
  | 10–15 min| "**Non-volunteers**: Were your views represented? Did shoe-type matter?"      | *Upstream selection effect (volunteer pool ≠ room)*                                                                | Non-volunteers may feel alienated—**note**: "Did the lottery ‘launder’ self-selection?"                              |  
  | 15–20 min| "**Full group**: Did rules prioritize being *right* or being *responsive*? How?" | *Accountability gap (no re-election) vs. elected bodies’ incentives*                                                | Groups may clash—**press**: "Did the allotted body avoid hard choices to please? Or ignore us?"                      |  
  | 20–25 min| "**All**: What does ‘political equality’ mean? Did we achieve it?"            | *Conflict: Equal chance (sortition) vs. equal voice (deliberation)*                                                 | Factions emerge—**sit with discomfort**: Let purists (fair procedure) clash with democrats (fair outcomes).          |  
  | 25–30 min| **Synthesize & Reveal** (Facilitator names the trade-offs):                   | "Today, we felt: (1) Power without a mandate, (2) Fairness that amplifies hidden biases, (3) Accountability without consequences. In real sortition, these tensions play out over **years**, not minutes. Legitimacy isn’t procedural—it’s earned by outcomes that *cost* someone something." |                                                                                                                        |  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Gaming the nomination**:  
     - *Risk*: Factions volunteer together (e.g., friends coordinating to dominate the pool).  
     - *Mitigation*: **Don’t lecture**. In debrief, ask: "Did anyone strategize their nomination? How did that shape outcomes?" Turns gaming into data.  

  2. **Allotted body dysfunction**:  
     - *Risk*: Group dithers or creates vague rules due to low stakes.  
     - *Mitigation*: Use the **green slip prompt** to nudge toward decisive, principle-based choices.  

  3. **Appeal body gridlock**:  
     - *Risk*: Short time forces hasty amendments.  
     - *Mitigation*: Frame gridlock as a feature: "Notice how randomness doesn’t guarantee wisdom—*even with good intentions*."  

  4. **Non-volunteer disengagement**:  
     - *Risk*: Observers tune out.  
     - *Mitigation*: Assign them to track "unspoken power dynamics" (e.g., who defers? who interrupts?).  

  ---

  ### **What the Activity Can’t Simulate (Requires Verbal Explanation)**  
  1. **Timescale of legitimacy**:  
     - Real sortition bodies build trust through repeated decisions with **consequences** (e.g., Citizen Assemblies in Ireland). Here, legitimacy is instant and cost-free—participants don’t experience the erosion/endurance of trust over years.  

  2. **Cost of error**:  
     - In this game, rules are symbolic. In reality, sortition decides **tax policies** or **climate laws**—errors hurt. The "weight" of unaccountable power is psychological, not material.  

  3. **Civic learning curve**:  
     - Real citizens gain expertise over months of hearings/evidence. Here, decisions are rushed. *Bridge verbally*: "Imagine your 20-minute table had 20 *weeks*—how might that change your legitimacy?"  

  ---

  ### **Why This Works**  
  - **The vacuum is felt**: By granting binding power with zero accountability (e.g., no re-election), participants *live* the paradox of "unowned authority."  
  - **Selection effect exposed**: When non-volunteers (e.g., introverts) realize shoe-type stratification ignored their traits, the upstream bias becomes visceral.  
  - **Two lotteries, two equalities**: The volunteer pool’s sortition feels "fair" to participants; the losers’ review feels like redress. Debrief exposes this as irreconcilable.  
  - **Awkwardness as data**: Gaming, resentment, or apathy become proof of concept—not failures.  

  This design guarantees friction, avoids tidy resolutions, and leaves the trade-off unnamed until participants have embodied it. The debrief ties their lived experience to your core ideas, with honesty about the simulation’s limits.
