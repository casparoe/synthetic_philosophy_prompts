prompt: |-
  I teach Kant's ethics, and I want to test the position I actually defend in lecture: that we have no direct duties to animals, and that whatever duties we have concerning them are indirect, owed to humanity and grounded in what cruelty does to the agent's own character or to human sympathy. Give me a map of what would count against this position, not a defense of it. Which arguments, cases, intuitions, or empirical findings tell against it? Which would a committed Kantian concede as a genuine cost, and which would they dismiss as a misunderstanding? Sort the defeaters from fatal to merely awkward. I am especially interested in whether the view can survive the argument from marginal cases, what it must say about cruelty that cannot affect any human, whether the empirical premise about character damage is doing more work than the moral argument, and whether the view is really a thesis about animals or a thesis about what kind of person the agent becomes. Also tell me what the position predicts that rival views do not, and whether it risks anything at all or has been insulated by qualifications. If it is well insulated, say so and say whether that is a problem. End with a one-sentence summary as the last line, beginning with "Summary:".
