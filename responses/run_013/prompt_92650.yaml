  Ok, this has been bugging me since a comment thread I was reading about illusionism, and I can't tell if it's a real problem or if I'm just confused. Someone in the thread was trying to make illusionism consistent by seperating 'the seeming' from 'the appearance' — the seeming (a state that represents that there's phenomenal redness) is real, but the appearance (the phenomenal redness itself) is not. Fine, ok. But here's my issue: a seeming is still a felt thing, right? Like when the Müller-Lyer lines seem different lengths, the seeming is part of my experience — I really do seem to see them that way, that's not nothing. So if the illusionist grants there's a real seeming with the content 'I'm having a phenomenal experience,' hasn't he just smuggled phenomenal consciousness back in under a new name? He'll say the seeming isn't itself phenomenal, but then what is it? If it's just a belief, then illusionism collapses into 'we're sometimes wrong about our own beliefs,' which nobody denies and which isn't interesting. And if it's not just a belief — if there's something it's like to have the seeming — then he's not an illusionist anymore. It feels like a dilemma and I can't tell which horn they're supposed to take. Also maybe I'm over-indexing on the visual-illusion analogy and that's whats tripping me up. Can you sort out what I'm missing and where the actual disagreement is — is this a genuine problem for illusionism, or am I running two different things together? Lead with the bottom line in your first sentence and then give the reasoning, no preamble and don't restate my question back at me.
