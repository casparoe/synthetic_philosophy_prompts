answer: |-
  ## Function Decision Tree

  **Start:** A trait's function is a fact that grounds malfunction claims. What does this fact depend on?

  ### Q1: Does the function depend *only* on the trait's *current* properties and role within its system *now*? (No History)
  *   **If YES:** → **Q2: What defines the system's "purpose" for assigning function?**
      *   **Analyst's Choice:** Function is relative to a capacity *we choose* to explain (e.g., circulation, thermoregulation). → **Leaf: Causal-Role Function**
          *   *Problem Case:* Appendix (no clear chosen capacity it contributes to *now*), Sound of Heart (contributes to diagnosis, but is that its *function*?).
      *   **System's Survival/Reproduction Goals:** Function is promoting the organism's survival/reproduction *right now*. → **Leaf: Goal-Contribution Function**
          *   *Problem Case:* Diseased Heart (fails to pump, so no current contribution to survival? Yet we say its function is pumping). Flightless Bird's Wings (no current flight contribution to survival/reproduction).
      *   **System's Ongoing Self-Maintenance:** Function is contributing to maintaining the organism's specific, self-producing organization *now*. → **Leaf: Organisational Function**
          *   *Problem Case:* Lightning Dog's Heart (identical organization, but no history?).
  *   **If NO:** Function depends on the trait's *history* → **Q3: What kind of history is required?**

  ### Q3: Is the required history *specifically* one of being favored by *natural selection*? (Selection History)
  *   **If YES:** The trait must have been selected *because* it performed that job. → **Leaf: Selected-Effects Function**
      *   *Problem Case:* Trait Fixed by Drift (later became useful, but not selected *for*). Feathers (origin selected for warmth, now used for flight - which is the function?).
  *   **If NO:** → **Q4: Can history include non-selective reproduction/persistence due to the trait's effects?** (Broader History)
      *   **If YES:** Includes learning, cultural transmission, simple persistence. → **Leaf: Permissive-Historical Function**
          *   *Problem Case:* Mousetrap Never Used (has history of being *made* to catch mice, but no history of *doing* it? Song passed by imitation (history, but no genetic selection).
      *   **If NO:** → **Q5: Does the function depend on the trait's *future propensity* to be selected?** (Forward-Looking)
          *   **If YES:** Function is what the trait *would* be selected for if it persists. → **Leaf: Propensity Function**
              *   *Problem Case:* Diseased Heart (low propensity now - loses function? Lightning Dog (high propensity - gains function instantly?).
          *   **If NO:** → **Leaf: Artifact Function (Designer's Intention)**
              *   *Problem Case:* Chair as Doorstop (used differently than intended).

  ### Deflationary/Pluralist Path (Throughout)
  *   **At any point:** "Function" isn't one thing; it's defined by the explanatory context (history, current role, design, etc.). → **Leaf: Pluralist/Deflationary View**
      *   *Problem Case:* None uniquely; it dissolves the "embarrassment" by accepting multiple valid ascriptions. *But:* Struggles to ground robust malfunction claims (is the heart *really* malfunctioning, or just serving a different function in a different context?).

  ---

  ## Position Summary Table

  | Leaf Position              | Core Commitment                                                                 | Most Problematic Case                                     |
  | :------------------------- | :------------------------------------------------------------------------------ | :-------------------------------------------------------- |
  | **Causal-Role Function**   | Current causal contribution to a *chosen* system capacity.                      | **Appendix** (What chosen capacity does it contribute to now?) |
  | **Goal-Contribution Function** | Current contribution to organism survival/reproduction.                          | **Diseased Heart** (Fails to contribute now, yet retains function). |
  | **Organisational Function** | Current contribution to maintaining the organism's self-producing organization. | **Lightning Dog** (Identical organization, no history?). |
  | **Selected-Effects Function** | Past selection *for* the trait's effect.                                        | **Trait Fixed by Drift** (Useful now, but not selected *for*). |
  | **Permissive-Historical Function** | History of being reproduced/persisted *because of* the effect (incl. learning/culture). | **Mousetrap Never Used** (History of *intent*, not *effectiveness*?). |
  | **Propensity Function**     | Future propensity to be favored by selection.                                   | **Diseased Heart** (Low future propensity - loses function?). |
  | **Artifact Function**       | Designer/Creator's intended purpose.                                           | **Chair as Doorstop** (Used successfully for unintended purpose). |
  | **Pluralist/Deflationary** | "Function" is context-dependent; multiple valid ascriptions exist.              | Grounding robust **malfunction** claims (e.g., diseased heart). |

  ---

  ## Notes on Distinctions & Gaps

  *   **Blurry Distinction:** Permissive-Historical vs. Organisational on **Beaver Dam**: Both might assign 'flood control' function based on history (beavers rebuild) *or* current role in maintaining beaver colony organization. Hard to separate empirically here.
  *   **Blurry Distinction:** Propensity vs. Causal-Role on **Drift Case**: If the trait *currently* contributes to fitness (drift case now useful), Causal-Role (relative to survival) and Propensity views might converge on assigning the *current* beneficial effect as the function. The historical *origin* (drift) is irrelevant to both.
  *   **Unoccupied Branch:** Answering Q1 "YES" (No History) and then Q5 "NO" leads only to the Artifact leaf. This path (`No History` -> `Not Propensity`) isn't really a distinct biological view; it's forced towards artifacts. Combining `No History` + `Requires Current Contribution` + `Designer Intention` is incoherent for biology (no designer). `No History` + `Requires Current Contribution` + `Not Survival/Reproduction` + `Not Self-Maintenance` + `Not Analyst's Choice` is unexplored/unnamed and likely incoherent (no basis left for ascription).
  *   **Malfunction Key:** Historical (SE, Permissive) and Organisational views handle malfunction best (trait fails to perform the historically/organizationally defined job). Propensity struggles (low propensity now?). Causal-Role/Goal-Contribution struggle (if it doesn't contribute *now*, does it even *have* the function?). Pluralism accepts malfunction claims relative to a chosen context.
