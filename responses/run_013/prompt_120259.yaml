prompt: |-
  I want the specification before I settle on a theory. By a theory of dispositions I mean an account of what it is for something to be disposed to produce a manifestation of type M when circumstances of type C obtain — solubility, fragility, flammability, infectivity, and the rest. The account is meant to underwrite the explanatory and predictive work such ascriptions do in the special sciences (materials testing, pharmacology, ecology) and the counterfactuals they are supposed to support. What I want from you is the list of demands any adequate account has to meet, each with the case or consideration that motivates it, rather than a verdict on the contenders.

  Build the list around at least the following, and add whatever they force you to add:

  - A stimulus that destroys the disposition at the moment it arrives, so that the thing would not in fact manifest if the circumstances obtained, though it is plainly disposed to.
  - Conditions that block the manifestation while leaving the disposition untouched, where the blocking factor is no part of the thing itself.
  - The manifestation delivered under the stimulus conditions, but by a mechanism independent of any disposition to deliver it.
  - Dispositions whose manifestation is not an event but the absence of one — resistance, immunity, stability, a beam disposed not to fail under a given load.
  - Manifestations that are probabilistic, or that come in several tracks, so that no strict conditional of the simple form holds.
  - Dispositions that are never manifested, and whose stimulus conditions are physically impossible or otherwise unavailable, so that nothing settles what would have happened.
  - Dispositions to acquire further dispositions, and dispositions whose stimulus conditions themselves presuppose the disposition.
  - Bearers that are not individual material objects: a design, an algorithm, a population, an institution.
  - Dispositions that exist in virtue of conventions or norms rather than physical structure.

  For each requirement, state the case behind it and say what it rules out. Then sort the list: which of these are genuine desiderata, and which are demands that only one camp in the dispute has reason to press — for instance those who require that dispositions be analyzed into non-dispositional, categorical facts, as against those who treat dispositions as primitive features of the world. Flag any pair or subset of requirements that cannot be satisfied together, say which member has to give way and why; that is the part I most want. Then say which single requirement eliminates the most candidate accounts. A brief assessment of how the familiar conditional analysis fares, and of the two camps just mentioned, is welcome at the end, but keep the weight on the criteria themselves — I will do the scoring on my own. No citations or reading lists; I want the requirements.
reasoning: |-
  Okay, the user is asking for a detailed specification of requirements for any theory of dispositions. They want a list of demands that any adequate account must meet, each motivated by specific cases or considerations. They've provided several key points to build around and want additional ones that logically follow. 

  First, I need to parse their core request: they're not asking for a specific theory or evaluation of existing theories, but rather the criteria those theories must satisfy. The user is clearly deeply familiar with the philosophical landscape around dispositions—mentioning conditional analyses, primitivism vs reductionism—but wants the framework itself laid bare. 

  Looking at their bullet points, each represents a hard case for dispositional theories. Let me unpack the challenges systematically:

  For the stimulus-destroying-disposition case (like the dissolving glass), the key is preserving the disposition's existence despite its immediate destruction. This kills simple counterfactual analyses where "if C then M" must hold. Any theory requiring actual manifestation under stimulus fails here.

  Blocking conditions (like antidote to poison) demand that dispositions persist even when externally prevented from manifesting. This requires a sharp distinction between the disposition itself and its manifestation pathway. Theories that conflate the two—like some behavioral analyses—won't survive this.

  Independent-mechanism cases (like the hammer breaking glass) attack theories that tie dispositions too closely to their typical causal chains. If the manifestation occurs but via wrong means, the disposition shouldn't get credit. This targets process-based accounts.

  Non-event manifestations (like stability) expand what counts as M—here the absence of change. Theories limited to event-based outputs need revision. This also connects to negative dispositions (immunity) which some accounts struggle to characterize.

  Probabilistic dispositions force rejection of strict conditionals. If fragility only breaks 70% of the time, "if struck then shatters" is false. Frequentist or propensity approaches might handle this, but categorical accounts choke.

  Unmanifested dispositions (like unbreakable glass in a world without impacts) challenge verificationist theories. If nothing could test the disposition, what grounds its existence? Primitivists accept this; reductionists may need categorical bases.

  Higher-order dispositions (like solubility making something dissolvable) create regress risks if all dispositions reduce to further conditionals. Circularity threats emerge if the stimulus presupposes the disposition (e.g., infectivity requiring susceptibility).

  Non-object bearers (like algorithms being "error-prone") stretch dispositional predicates beyond physical science. Theories must accommodate abstract or collective entities without anthropomorphizing.

  Conventional dispositions (like "legal tender") decouple dispositions from physical bases. A reductionist might reduce this to social facts, but a primitivist sees dispositionality as broader.

  Now for tensions: The biggest conflict is between probabilistic dispositions and unmanifested dispositions. The former demands non-binary outputs; the latter lacks any output data. Only a theory with robust modal independence (like primitivism) can satisfy both—reductionists must either deny unmanifested dispositions or inflate categorical bases.

  The single most destructive requirement is blocking conditions. It forces disposition/modal separation that nukes simple conditionals, process theories, and some reductionisms. Even sophisticated conditionals (with ceteris paribus clauses) struggle with external blockers.

  On conditional analysis: It fails most tests spectacularly—destroyed by blockers, independent mechanisms, probabilities, unmanifested cases. Only for non-event manifestations might it limp along via contraposition ("if not-M then not-C").

  Primitivism handles blockers, unmanifested cases, and conventions well but may struggle with probabilistic precision. Reductionism shines on higher-order dispositions (reducing them to structures) but stumbles on conventions and unmanifested cases.

  The user's depth suggests they're constructing or evaluating a novel theory. Their focus on tensions ("which requirement eliminates most accounts") reveals they care about knockout arguments. I should emphasize where demands form inconsistent sets—that's their "most wanted" part.

  Adding derived requirements: 
  - Modal resilience (from stimulus-destruction)
  - Intrinsic/Extrinsic separation (from blockers)
  - Manifestation vs outcome distinction (from independent mechanisms)
  - Negative/absence ontology (from non-events)
  - Degree/probability architecture (from probabilities)
  - Grounding without manifestation (from unmanifested)
  - Regress resolution (from higher-order)
  - Abstract bearer compatibility (from non-objects)
  - Social ontology interface (from conventions)

  The final list should present these as necessary gates every theory must pass through, with clear failure conditions for each. The sorting must remain neutral per their request—no championing primitivism or reductionism—though implications will be evident.
answer: |-
  Here is the specification of requirements for an adequate theory of dispositions, structured around your cases with additions derived from their implications. Requirements are sorted into **core desiderata** (non-negotiable for any adequate theory) and **camp-specific demands** (tied to reductionist or primitivist commitments). Tensions are identified, and the most eliminative requirement is flagged.

  ---

  ### **Core Desiderata** (Any adequate theory must satisfy these)  
  1. **Stimulus-Destruction Resilience**  
     - *Case*: A fragile glass is struck by a bullet, shattering instantly. The stimulus (impact) destroys the disposition (fragility) at the moment of arrival, so the glass *would not* manifest fragility *if struck* (as it ceases to exist). Yet it was fragile.  
     - *Ruled Out*: Theories where disposition ascription requires that the manifestation *would* occur under stimulus conditions (e.g., naïve conditional analyses).  

  2. **Extrinsic Blocking**  
     - *Case*: A poisonous substance is ingested but neutralized by an antidote. The poison retains its disposition (toxicity) despite the blocked manifestation. The blocker (antidote) is external to the bearer.  
     - *Ruled Out*: Theories conflating dispositions with their manifestations, or requiring intrinsic changes to negate the disposition.  

  3. **Manifestation-Independence**  
     - *Case*: A fragile vase struck by a hammer shatters, but the shattering is caused by a hidden explosive device, not the vase’s fragility. The manifestation occurs under stimulus conditions, but not *because of* the disposition.  
     - *Ruled Out*: Theories that equate dispositions with guaranteed manifestations under conditions, or that lack a causal/modal link between stimulus and manifestation.  

  4. **Non-Event Manifestations**  
     - *Case*: A steel beam is disposed *not* to buckle under a load (stability). The manifestation is the *absence* of an event (failure).  
     - *Ruled Out*: Theories requiring manifestations to be positive events (e.g., "shattering" for fragility).  

  5. **Probabilistic/Track-Relative Manifestations**  
     - *Case*: A radioactive atom has a 50% chance of decaying in 10 years. No strict "if C, then M" conditional holds.  
     - *Ruled Out*: Theories relying on deterministic conditionals (e.g., simple counterfactual analyses).  

  6. **Non-Individual Bearers**  
     - *Case*: An algorithm is disposed to produce biased outputs under skewed data; a population is disposed to develop herd immunity.  
     - *Ruled Out*: Theories restricting dispositions to atomic material objects.  

  ---

  ### **Camp-Specific Demands** (Motivated by philosophical commitments)  
  7. **Unmanifested Dispositions**  
     - *Case*: A diamond in a world without impacts is fragile, though its stimulus conditions are nomologically impossible (e.g., no forces exist to strike it).  
     - *Motivation*: **Primitivists** accept unmanifested dispositions as basic; **reductionists** demand a categorical basis (e.g., atomic structure).  
     - *Ruled Out*: Verificationist theories requiring actual or possible manifestations.  

  8. **Higher-Order & Circular Dispositions**  
     - *Case*: (a) A chemical is disposed to *become* flammable when heated. (b) Infectivity requires a susceptible host—the stimulus *presupposes* the disposition elsewhere.  
     - *Motivation*: **Reductionists** must avoid regress (e.g., reducing higher-order dispositions to categorical bases); **primitivists** accept irreducible dispositional chains.  
     - *Ruled Out*: Theories where dispositions reduce to non-dispositional properties *only* if regress occurs.  

  9. **Conventional/Normative Grounding**  
     - *Case*: A piece of paper is disposed to function as currency (legal tender) in virtue of social norms, not physical structure.  
     - *Motivation*: **Reductionists** must ground this in non-dispositional facts (e.g., beliefs); **primitivists** treat social dispositions as fundamental.  
     - *Ruled Out*: Theories requiring physical microstructures for all dispositions.  

  ---

  ### **Derived Requirements** (Forced by core cases)  
  10. **Intrinsic/Extrinsic Separation**  
      - *From Extrinsic Blocking*: Dispositions must be intrinsic to the bearer, while manifestations can be extrinsically blocked.  
      - *Ruled Out*: Theories making dispositions extrinsic (e.g., contextualist accounts).  

  11. **Modal Strength Beyond Counterfactuals**  
      - *From Stimulus-Destruction & Unmanifested Dispositions*: Dispositions require a modal ground stronger than actual or possible manifestations (e.g., essences, powers).  
      - *Ruled Out*: Pure conditional analyses relying on closest-possible-world semantics.  

  ---

  ### **Tensions Between Requirements**  
  - **Greatest Tension**: **Probabilistic Manifestations vs. Unmanifested Dispositions**  
    - *Conflict*: Probabilistic dispositions require degrees of possibility (e.g., 30% chance of M under C). Unmanifested dispositions (with impossible stimuli) lack any ground for assigning probabilities.  
    - *Resolution*: **Unmanifested dispositions must yield**. A theory can accommodate probabilistic dispositions (via propensities/chances) but cannot assign probabilities to nomologically impossible stimuli. Unmanifested cases must be handled by structural/symmetry grounds (e.g., "same atomic structure as manifested fragile objects").  

  - **Secondary Tension**: **Higher-Order Dispositions vs. Reductionism**  
    - *Conflict*: Reductionists must terminate dispositional chains in categorical bases, but circular cases (e.g., infectivity) resist non-circular reduction.  
    - *Resolution*: **Reductionists must accept irreducible relations** (e.g., "susceptibility" as primitive) or abandon strict reduction.  

  ---

  ### **Most Eliminative Requirement**  
  **Extrinsic Blocking** eliminates the most accounts:  
  - Naïve conditional analyses (falsified by antidote cases).  
  - Process-based theories (if the manifestation is blocked, the "process" is absent).  
  - Finks/antidotes require a distinction between the disposition’s *existence* and its *manifestation* that many theories cannot capture.  

  ---

  ### **Brief Assessment of Key Approaches**  
  - **Conditional Analysis** (e.g., "x is fragile iff if struck, it would break"):  
    Fails nearly all desiderata: stimulus-destruction (finks), extrinsic blockers (antidotes), independent mechanisms (explosives), probabilities, unmanifested cases, and non-events.  

  - **Reductionism** (dispositions reduce to categorical bases):  
    Struggles with conventional dispositions, unmanifested cases (if no basis is observable), and circular/higher-order dispositions. Excels at intrinsic blocking cases.  

  - **Primitivism** (dispositions are fundamental):  
    Handles blockers, unmanifested cases, non-object bearers, and conventions well. Struggles to explain probabilistic gradations without additional machinery.  

  No theory satisfies all requirements trivially; trade-offs are unavoidable. The criteria above define the battlefield for adjudicating contenders.
