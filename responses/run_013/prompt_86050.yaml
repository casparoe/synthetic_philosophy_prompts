answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  
  **Marks:** 20  

  **Case:** During a meeting, Alex notices they lack a pen. They quietly take a pen from a colleague’s desk without asking, intending to return it after the meeting. Consider two candidate maxims for this act:  
  > **(A)** "Whenever I need something and can just take it, I’ll take it, meaning to return it later."  
  > **(B)** "When I’m stuck in a meeting without a pen, I’ll borrow one from a colleague sitting near me and hand it back a few minutes later."  

  **Task:**  
  1. Apply Kant’s Formula of Universal Law (FUL) to **both maxims**, explaining whether each generates a contradiction in conception or contradiction in the will, and why.  
  2. A critic argues that the FUL is "rigged": narrowing the maxim (e.g., B) avoids contradiction, while generalizing it (e.g., A) guarantees failure. Present this objection **in its strongest form**.  
  3. Defend Kant’s framework with a reply that addresses whether (A)’s failure stems from a *logical contradiction* or merely a *defeated purpose*, and why the wording of (B) is not arbitrary but grounded in Kant’s theory of rational agency. Conclude by justifying which maxim (if either) a Kantian agent could adopt.  

  ---  
  ### Model Answer (Approx. 700 words)  

  #### Step 1: Testing Maxim (A) with FUL  
  Maxim (A)—"Whenever I need something and can just take it, I’ll take it, meaning to return it later"—fails the universalizability test by generating a **contradiction in conception**. When universalized ("*Everyone* takes whatever they need, intending to return it later"), the practice of reliable ownership dissolves. If all people seized possessions without consent, trust in "borrowing" would collapse: no one could assume items would remain available for their use, as others might take them at any moment. This defeats the maxim’s purpose (temporarily using others’ property), since universalization makes "returning" meaningless—there is no stable system of possession to return *to*. The contradiction is **conceptual**: a world where everyone acts on (A) is incoherent, like a maxim to make false promises (G 4:422). The act presupposes a background of respected ownership it simultaneously destroys.  

  #### Step 2: Testing Maxim (B) with FUL  
  Maxim (B)—"When I’m stuck in a meeting without a pen, I’ll borrow one from a colleague sitting near me and hand it back a few minutes later"—passes the FUL. Universalizing it produces no contradiction. A world where everyone briefly borrows pens *in meetings* from *adjacent colleagues* with *immediate return* is sustainable. The specificity ensures the practice is non-disruptive: pens are easily monitored, return is swift, and the context (professional meetings) implies mutual understanding. This creates no systemic threat to ownership. Unlike (A), (B) does not universalize a principle that erodes the very conditions for borrowing. It avoids both contradiction in conception (the practice remains logically possible) and contradiction in the will (we need not rationally reject such a world, as it preserves trust).  

  #### Step 3: The "Rigged Test" Objection (Strong Version)  
  The critic contends that FUL’s outcome depends entirely on *how narrowly we describe the maxim*. By tailoring (B) to include restrictive conditions ("in meetings," "sitting near me," "minutes later"), we engineer a pass, while (A)’s generality guarantees failure. This makes Kantian ethics **subjective**: agents can "game" morality by phrasing maxims to avoid contradiction, reducing duty to semantic manipulation. If correct, Kant fails to provide an objective test—the same act could be permissible or forbidden based on description alone, violating practical reason’s demand for universality.  

  #### Step 4: Kantian Reply: Maxim Authenticity and Rational Contradiction  
  Kant’s best reply denies that maxim-wording is arbitrary. A maxim must capture **the agent’s actual principle of action**, including their **incentive** (*Triebfeder*) (G 4:400n). (A) reflects a self-interested policy: the agent acts because they can "just take" what they need, ignoring others’ agency. Universalizing this *incentive* reveals a contradiction because it invalidates the reciprocal trust required for the act’s success. The failure is **not merely practical** (a purpose defeated) but **logical**: it generates an inconceivable world (like false promising), proving the maxim violates rational agency itself.  

  Conversely, (B) succeeds not due to phrasing tricks, but because its specificity *embeds respect for mutual conditions*. The agent acts only in contexts where borrowing is non-coercive, reciprocal, and trust-preserving—conditions aligning with the *Categorical Imperative’s second formulation* (treating others as ends). Kant insists maxims must be "fit for universal lawgiving" (G 4:437), meaning they must express principles all rational agents could share without undermining their collective rationality. (B) meets this by limiting itself to scenarios where autonomy and ownership remain intact.  

  **Conclusion**: (A) fails due to a contradiction in conception—it universalizes an incentive that destroys its own precondition. (B) passes because it describes a practice compatible with universal rationality. A Kantian agent could adopt (B) but not (A), as only (B) respects humanity as an end in itself. The "rigging" objection mistakes Kant’s demand for maxim *authenticity* for semantic gamesmanship.  

  ---  
  ### Marking Scheme (Total: 20 marks)  
  **Award marks for:**  
  - **Maxim Analysis (A)**: Correct identification of **contradiction in conception** (1 mark), explanation of how universalization destroys ownership trust, defeating the maxim’s purpose *and* creating incoherence (2 marks).  
  - **Maxim Analysis (B)**: Clear statement that universalizing (B) **avoids contradiction** (1 mark), justification citing contextual limits (meetings, proximity, quick return) preserving systemic trust (2 marks).  
  - **Objection Handling**: Articulation of the "rigged test" objection—i.e., FUL’s verdict depends on maxim specificity, making morality subjective/manipulable (2 marks).  
  - **Kantian Reply**:  
    - Emphasis on **maxim authenticity** (agent’s true incentive/principle) (2 marks).  
    - Distinction between (A)’s **logical contradiction** (incoherent world) vs. mere practical defeat (1 mark).  
    - Link to **rational agency**—(A) universalizes non-reciprocal self-interest, violating the Kingdom of Ends (2 marks).  
  - **Conclusion**: Judgement that (B) is permissible while (A) is not, grounded in Kant’s ethics (1 mark).  

  **Deduct marks for:**  
  - Misidentifying (B)’s test result (e.g., calling it a "contradiction") (–1).  
  - Reducing the FUL to intuition (e.g., "A feels wrong") or consequences (–2).  
  - Claiming (A) fails *only* due to purpose defeat (ignoring logical contradiction) (–1).  
  - Ignoring the role of the agent’s incentive in the reply (–2).  
  - Unsubstantiated claims (e.g., "Kant would reject both") without argument (–1).  

  **Band Descriptors:**  
  - **First-Class (17–20)**: All key moves present; precision on contradiction types; sophisticated reply to objection.  
  - **Upper Second (13–16)**: Solid analysis but minor slips (e.g., vague reply to rigging objection).  
  - **Lower Second (9–12)**: Superficial treatment of one section (e.g., misstates why A fails).  
  - **Third (5–8)**: Fails to test both maxims properly; ignores core objection.  
  - **Fail (0–4)**: Major errors (e.g., conflates FUL with utilitarianism).  

  ---  
  **Rationale**: This question forces engagement with maxim formulation—a core problem in Kant scholarship—while requiring students to defend Kant against a potent critique. The model answer and scheme prioritise conceptual precision over textual exegesis, fitting an upper-level course focused on applied reasoning.
