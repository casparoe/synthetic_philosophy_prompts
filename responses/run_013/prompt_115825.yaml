  Okay, let me start by unpacking the user's query. They're stuck in a long-running debate with friends about anthropic reasoning, specifically self-locating beliefs and various thought experiments. The core issue seems to be that they can't agree on what a theory of self-locating credence should actually accomplish. They want a clear "spec" outlining necessary features, constraints, and potential conflicts between desiderata.

  First, I need to identify all the cases they mentioned: Doomsday Argument, Presumptuous Philosopher, Sleeping Beauty, and their two custom scenarios (Observer Coinflip and Duplication Dilemma). Each tests different aspects of anthropic reasoning. The user is especially interested in where desiderata conflict and which are non-negotiable versus factional.

  Breaking down their explicit questions: (1) What must an adequate theory deliver? (2) Which requirements are essential vs. camp-specific? (3) Where are there unavoidable trade-offs? (4) How does the belief/action distinction play out? 

  The underlying frustration is circular arguments from undefined success criteria. They want neutrality ("don't score theories") to independently evaluate positions. Their unspoken need might be resolving deadlocks by mapping the conceptual minefield.

  For the spec, I'll structure: 
  - Core functions (what the theory must do) 
  - Constraints (absolute boundaries) 
  - Test-case requirements (specific outcomes per scenario) 
  - Tensions (where desiderata clash)

  Key tensions I anticipate:
  - Non-arbitrariness vs. observer-count sensitivity (PP vs. Doomsday) 
  - Indexical indifference vs. betting behavior (Sleeping Beauty conflict) 
  - Pre-experimental facts mattering vs. observer-count updating (Observer Coinflip dilemma) 
  - Decision-credence consistency vs. indexical uncertainty (Duplication case)

  The belief/action axis cuts across everything. Sleeping Beauty forces this with betting, Duplication links today's credence to tomorrow's decisions. I'll flag where theories must pick a priority: e.g., if credences guide actions, duplication decisions constrain current beliefs.

  For non-negotiables: Epistemic non-arbitrariness and temporal consistency seem universal. Observer-count sensitivity and indexical indifference are battlegrounds. The user's custom cases likely expose new rifts—Observer Coinflip challenges whether existence is evidence, Duplication tests dynamic consistency.

  Conflicts I see as fundamental:
  1. Doomsday's birth-rank updating requires discounting large observer counts, but PP forbids favoring smaller universes without evidence. Any theory must pick which intuition to break.
  2. Sleeping Beauty's 1/3 vs 1/2 credence implies different betting behaviors—no theory satisfies both "intuitive credence" and "no Dutch book" simultaneously under duplication.
  3. In Observer Coinflip, "existence as evidence" (SIA) implies coin bias, but that feels wrong. Rejecting it undermines typical anthropic arguments.
  4. Duplication demands that if future decisions depend on coin outcomes, current credences must align—but this seems to let decisions dictate belief, which is backwards.

  The user's group needs this map to see why consensus is hard. My response should lay bare the trade-offs so they can debate values ("Is PP's absurdity worse than Doomsday's inaction?") rather than theory mechanics.
answer: |-
  Here’s a specification for an adequate theory of self-locating credence, structured around your requirements. I’ll define **core functions**, **constraints**, **test-case desiderata** (with justifications), **non-negotiables vs. factional commitments**, and **irreconcilable conflicts**. The belief/action axis is integrated throughout.

  ---

  ### **I. Core Functions**  
  A theory must:  
  1. **Assign coherent credences** in scenarios with indexical uncertainty (e.g., "Where/When am I?").  
  2. **Update beliefs** on receiving self-locating evidence (e.g., "I am human," "I am awake now").  
  3. **Interface with decisions**: Specify how credences translate to actions when duplicates exist, bets are offered, or outcomes affect observers asymmetrically.  

  ---

  ### **II. Inviolable Constraints**  
  *(Non-negotiable for any minimally adequate theory)*  
  1. **Epistemic non-arbitrariness**: No ad hoc parameters (e.g., arbitrary reference classes).  
     *Case backing*: If the reference class in Doomsday is "humans named John," results change absurdly.  
  2. **Temporal consistency**: Credences today must align with known future actions (no Dutch books across time).  
     *Case backing*: In Duplication Dilemma (v), betting against your future decision invites self-sabotage.  
  3. **Empirical adequacy**: Must not ignore or contradict non-indexical evidence (e.g., physics, cosmology).  

  ---

  ### **III. Test-Case Desiderata**  
  *(What the theory *should* deliver, but these are contested)*  

  | Case | Desideratum | Justification | Tension Points |
  |------|-------------|---------------|----------------|
  | **(i) Doomsday Argument** | Birth rank *n* should lower credence in "humanity survives long." | Intuition: Being born early among all humans suggests a smaller total population. | Collapses if observer count doesn’t affect likelihood. |
  | **(ii) Presumptuous Philosopher (PP)** | No boost to large-universe theories without direct evidence. | Intuition: It’s absurd that "there are 10^20 observers" wins over "there are 10^10" with zero data. | Violated by theories that weight hypotheses by observer count. |
  | **(iii) Sleeping Beauty (SB)** | Upon waking, P(Heads) = 1/3 (or 1/2). | Halfer: Coin outcome is independent of waking. Thirder: Two wakings on Tails, one on Heads. | Betting behavior differs: 1/3 credence justifies 2:1 odds on Tails. |
  | **(iv) Observer Coinflip** | Your existence provides *no evidence* about future coin flips. | Intuition: Your existence is fixed; the coin determines *other* observers. Rejecting this implies solipsism. | Self-Indication (SIA) violates this: P(you exist) higher if more observers exist. |
  | **(v) Duplication Dilemma** | Your credence today (e.g., P(Heads)=0.5) *must not change* based on your future duplication decision. | Intuition: Past events (coin flip) are independent of future choices. If choices alter beliefs retroactively, rationality breaks. | Decision-credence consistency requires this. |

  ---

  ### **IV. Non-Negotiables vs. Factional Commitments**  
  - **Non-negotiables**: Epistemic non-arbitrariness, Temporal consistency, Empirical adequacy.  
    *(Violating these risks incoherence or contradiction with science.)*  
  - **Factional commitments**:  
    - *Self-Sampling (SSA)*: Favors Doomsday desideratum, rejects PP.  
    - *Self-Indication (SIA)*: Favors PP, violates Observer Coinflip desideratum.  
    - *Halfer (SB)*: Demands no indexical updating in SB.  
    - *Thirder (SB)*: Demands indexical updating in SB.  

  ---

  ### **V. Irreconcilable Conflicts**  
  **These desiderata cannot all be satisfied simultaneously. You must abandon at least one:**  

  1. **Doomsday vs. Presumptuous Philosopher**  
     - *Conflict*: Doomsday requires that being an early observer lowers credence in large populations. PP forbids favoring small populations without evidence.  
     - *Forced choice*: Abandon Doomsday desideratum (accept SIA) or abandon PP desideratum (accept SSA).  

  2. **Sleeping Beauty Thirdism vs. Decision-Credence Consistency**  
     - *Conflict*: If Beauty is a thirder (P(Heads)=1/3), she bets at 2:1 on Tails. But if duplicates are created later (as in Duplication Dilemma), identical betting behavior implies credences *must* depend on duplication decisions.  
     - *Forced choice*: Reject thirder credence or accept that beliefs can be controlled by future actions.  

  3. **Observer Coinflip vs. Self-Indication (SIA)**  
     - *Conflict*: SIA says your existence is evidence for hypotheses with more observers. Observer Coinflip says your existence tells you nothing about unrelated coin flips.  
     - *Forced choice*: Reject SIA or reject Observer Coinflip desideratum (opening solipsism worries).  

  4. **Duplication Dilemma vs. Indexical Indifference**  
     - *Conflict*: If you will create 1000 duplicates tomorrow, should your credence *today* treat all future observer-moments equally? If yes, P(Heads) must drop (as duplicates will observe it). But this lets future actions alter past beliefs.  
     - *Forced choice*: Preserve temporal consistency (fix P(Heads)=0.5) or insist on indexical indifference across time.  

  ---

  ### **VI. Belief vs. Action: The Critical Axis**  
  - **Theories must specify how credences inform actions** when duplicates exist. Examples:  
    - *Sleeping Beauty*: Thirders bet on Tails at 2:1 odds; Halfers refuse.  
    - *Duplication Dilemma (v)*: If you’ll duplicate iff Heads, your P(Heads) today must align with your future decision rule to avoid Dutch books.  
  - **Key tension**: Theories that separate "belief" from "decision" (e.g., contextual credence) violate **temporal consistency**. Those that tightly couple them (e.g., EDT/FDT) may violate **Observer Coinflip** (by letting duplication affect beliefs).  

  ---

  ### **Summary of Tradeoffs**  
  To build a coherent theory, you **must** sacrifice one desideratum from each conflicting pair:  
  - **Doomsday or PP**  
  - **Observer Coinflip or SIA**  
  - **SB Halfer or Thirder** (if decision-consistency is prioritized)  
  - **Fixed prior credences or Indexical indifference over time**  

  The belief/action question is not ancillary—it *forces* commitments. If credences guide actions, then Duplication Dilemma (v) collapses SB-style indexical uncertainty into precommitment decisions. If not, temporal Dutch books loom.  

  Your group’s next step: **Flag which conflicts each member is willing to resolve (and how)**. The deepest rift is between "existence is never evidence" (Observer Coinflip) and "more observers make existence more likely" (SIA). There’s no free lunch.
