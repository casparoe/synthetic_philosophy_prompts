prompt: |-
  Next term I am giving a guest lecture to a cohort of first-year PhD students in a decision theory seminar on risk-weighted expected utility. They know the von Neumann–Morgenstern axioms and the standard expected utility representation cold, and most of them assume that any systematic departure from expected utility must be a reasoning error rather than a rival conception of rationality. Do not deliver the exposition; plan the lecture. Give me the order in which the components must be introduced and why each depends on the one before it, from the separation of risk attitude from the curvature of the utility function through to the risk function itself; the single concrete choice problem that should carry the whole framework, and why the Allais paradox is the wrong vehicle for this audience; the misconceptions they will predictably form — in particular that the risk function is merely prospect theory's probability weighting under another name, or that it distorts belief rather than expressing a distinct attitude toward risk — and the exact point in the sequence at which to head each off; one question to pose at the end that would reveal whether they have grasped what is distinctive about the theory; and what I should explicitly set aside at this level and tell them I am setting aside.
reasoning: |-
  We are planning a lecture on risk-weighted expected utility (RWEU) for first-year PhD students who are familiar with von Neumann-Morgenstern (vNM) expected utility theory and are skeptical of departures from it. The goal is to present RWEU as a coherent alternative conception of rationality, not as a reasoning error.

  The lecture must be structured to build understanding step by step, addressing potential misconceptions. We'll use a concrete choice problem to illustrate the framework and avoid the Allais paradox because it might be too familiar and could be dismissed as an anomaly or attributed to probability weighting (which is associated with prospect theory, not RWEU). Instead, we'll use a simpler binary choice that clearly separates risk attitude from utility curvature.

  Key components to cover in order:

  1. **Recap of vNM and the separation of risk attitude from utility curvature:**
     - In vNM, the curvature of the utility function captures both diminishing marginal utility and risk aversion. However, we want to show that these can be separated: one can be risk-averse even with linear utility (if we introduce a different mechanism) or have a curved utility without risk aversion? Actually, in vNM, linear utility implies risk neutrality. But we want to introduce a distinct concept of risk attitude that is not tied to the utility function.
     - We start by showing that in vNM, risk aversion is equivalent to concave utility. But is it possible to have a different kind of risk attitude? We set up the idea that we might want to express a more general risk attitude.

  2. **Introduce a simple choice problem that cannot be explained by vNM without making ad hoc assumptions about utility:**
     - Present a binary choice between two lotteries that have the same expected value but different risk profiles, and where the typical choice (risk-averse or risk-seeking) cannot be explained by the curvature of the utility function alone without inconsistency in other choices. We need a problem that forces the separation.
     - Example: 
          Option A: $100 for sure.
          Option B: a 50% chance of $200, 50% chance of $0.
       In vNM, choosing A (risk-averse) would be explained by concave utility. But what if we have a person who is risk-averse for gains but risk-seeking for losses? Or a person who is risk-averse for moderate stakes but risk-seeking for high stakes? We need a more nuanced example.

     However, we want to avoid the Allais paradox because it involves multiple outcomes and common consequence effect, which might be too complex and is often associated with probability weighting. Instead, let's use a problem that involves two outcomes but in a way that shows that the same person might exhibit both risk aversion and risk seeking in different contexts that vNM cannot explain without changing the utility function arbitrarily.

     Actually, we can use a problem that has been used in the RWEU literature: the "fifty-fifty" problem but with different stakes. But we need one that clearly shows the need for a risk function.

     Alternative: Use a problem with two outcomes but where the probabilities are the same but the stakes are different, and observe that the same person might be risk-averse for high probability of a small gain and risk-seeking for low probability of a large gain. But that might be explained by vNM with a utility function that is concave in some regions and convex in others (like the Markowitz utility). However, RWEU can account for this with a linear utility and a risk function.

     We want to show that the risk attitude is not captured by the utility function. So let's design a problem that uses the same two outcomes but different probabilities, and where the pattern of choices is inconsistent with any utility function (without introducing the risk function).

     Actually, we can use a problem that has been used to illustrate the need for rank-dependent models:

     Problem 1:
        Option A: 90% chance of $100, 10% chance of $0
        Option B: $90 for sure

     Problem 2:
        Option C: 10% chance of $100, 90% chance of $0
        Option D: $10 for sure

     Many people choose B in Problem 1 (risk-averse) and C in Problem 2 (risk-seeking). In vNM, this would require a utility function that is concave for the first problem (since B is chosen: u(90) > 0.9*u(100)+0.1*u(0)) and convex for the second (since C is chosen: 0.1*u(100)+0.9*u(0) > u(10)). But if we set u(0)=0, then we have:
        u(90) > 0.9*u(100)
        and
        0.1*u(100) > u(10)   =>   u(100) > 10*u(10)

     Then from the first inequality: u(90) > 0.9*u(100) => u(90) > 0.9 * (something greater than 10*u(10)) = at least 9*u(10). But this does not directly contradict because we don't know the relationship between u(90) and u(10). However, it is challenging because if we assume that u is increasing, then u(90) > 9*u(10) is possible only if u is convex enough in [0,90] and then concave in [90,100]? Actually, it is possible with an S-shaped utility, but that is an ad hoc assumption and requires the utility to change shape arbitrarily.

     However, we want to avoid the Allais because it is overused and might be confused with prospect theory. But this example is similar to the common ratio effect? Actually, it is the common consequence effect? Or it is a reflection effect? The above example is not the Allais, but it is a common pattern.

     We need a simpler binary choice that is one shot and that clearly shows that two people with the same utility function (and same beliefs) might have different risk attitudes. But in vNM, that is impossible because the utility function captures risk attitude.

     Instead, we can present:

          Lottery 1: 50% chance of $100, 50% chance of $0.
          Lottery 2: $40 for sure.

     In vNM, if a person chooses Lottery 2, we say they are risk averse and have a concave utility. But what if we have a person who chooses Lottery 1? They are risk seeking. Now, can we have a person who in one context is risk averse and in another risk seeking without changing the utility function? We can if we change the lottery. But we want to show that we can capture that with a risk function without changing the utility.

     Actually, the key is to show that the risk function can capture a general pattern of risk attitudes that is independent of the utility function. We want to show that even with a linear utility function, we can have risk aversion or risk seeking by using a risk function.

     So we set up:

          Suppose we have a linear utility function: u(x)=x. Then in vNM, the person is risk neutral. So they would be indifferent between Lottery 1 (expected value $50) and Lottery 2 ($40). But if a person prefers $40 for sure, they are risk averse. How can we capture that without making utility concave? We need a different mechanism.

     This is the key: we want to show that we can have risk aversion with linear utility. So we present:

          Option A: $40 for sure.
          Option B: 50% chance of $100, 50% chance of $0.

     A risk-averse person might choose A. How can we model that without a concave utility? By introducing a risk function that transforms the cumulative probabilities? Actually, in RWEU, we transform the decumulative probabilities? Or the cumulative distribution? 

     RWEU (as in Quiggin, 1982, and later by Schmeidler, 1989, and others) uses a rank-dependent approach. But we are focusing on the risk function.

     We build step by step.

  3. **Introduce the risk-weighted expected utility framework:**
     - Start with the idea that we can represent preferences by:
          V(F) = ∫ u(x) d h(F(x))
       but that is not exactly the standard form. Actually, for a discrete lottery, we order the outcomes from worst to best and then assign weights to each outcome that depend on the probability of getting at least that outcome (decumulative) and the probability of getting less. The risk function h: [0,1] → [0,1] is applied to the cumulative probabilities? Actually, in the rank-dependent utility, we transform the cumulative distribution function? 

     The standard RWEU (also known as rank-dependent utility) for a discrete lottery with outcomes x1 ≤ x2 ≤ ... ≤ xn with probabilities p1, p2, ..., pn:

          V = u(x1) * h(p1 + p2 + ... + pn) - h(p2 + ... + pn) 
            + u(x2) * [h(p2 + ... + pn) - h(p3 + ... + pn)] 
            + ... 
            + u(xn) * [h(pn) - h(0)]

     But h(0)=0 and h(1)=1, and h is increasing. Actually, the weights are:

          w_i = h( p_i + ... + p_n ) - h( p_{i+1} + ... + p_n )

     for i from 1 to n, with the convention that the sum from n+1 to n is 0.

     Alternatively, for a binary lottery (which is simpler) with outcomes x < y:

          V = u(x) * [h(1) - h(p_y)] + u(y) * h(p_y)

          = u(x) * [1 - h(p_y)] + u(y) * h(p_y)

     because the cumulative for x is 1 (since it's the worst) and for y is p_y (the probability of getting y, which is also the probability of getting at least y? In a binary lottery, if x<y, then the probability of getting at least y is p_y, and the probability of getting less than y is p_x. So:

          V = u(x) * [h(p_x + p_y) - h(p_y)] + u(y) * [h(p_y) - h(0)]
            = u(x) * [h(1) - h(p_y)] + u(y) * h(p_y)
            = u(x) * [1 - h(p_y)] + u(y) * h(p_y)

     So for the binary lottery:

          Option A: sure $40 -> u(40)
          Option B: 50% $0, 50% $100 -> V_B = u(0)*[1 - h(0.5)] + u(100)*h(0.5)

     If we assume u(0)=0, then V_B = u(100) * h(0.5)

     Now, if the person is risk averse, they prefer A if:

          u(40) > u(100) * h(0.5)

     With linear utility, u(x)=x:

          40 > 100 * h(0.5)   =>   h(0.5) < 0.4

     So if h(0.5) is less than 0.4, the person is risk averse. In vNM, we would require u(40) > 50 (if u(0)=0) which is 40>50 -> false. But with RWEU, we can have h(0.5)=0.3, then V_B=30, so 40>30 -> risk aversion.

     Similarly, if h(0.5)=0.6, then V_B=60, so 40<60 -> risk seeking.

     So we can capture risk attitude without the utility function.

  4. **Concrete choice problem to carry the whole framework:**
     - Use the binary choice above: sure $40 vs. 50-50 lottery of $0 or $100. This is simple and clear. Then we can show how RWEU explains both risk aversion and risk seeking with the same linear utility function by changing the risk function.

  5. **Why avoid the Allais paradox?**
     - The Allais paradox involves choices between two pairs of lotteries and is often explained by the common consequence effect. However, it is frequently associated with prospect theory (which uses probability weighting) and might lead the students to conflate RWEU with prospect theory. Moreover, the Allais paradox can be explained by RWEU, but it is more complex and might distract from the core idea of separating risk attitude from utility. The binary choice is simpler and more directly illustrates the role of the risk function.

  6. **Misconceptions to address:**
     a. **That the risk function is just prospect theory's probability weighting:** 
          - When? When introducing the risk function. We must clarify that in prospect theory, probability weighting is applied to individual probabilities (without regard to rank) and can violate stochastic dominance. In RWEU, the risk function is applied to cumulative probabilities (in a rank-dependent manner) and preserves stochastic dominance. We must emphasize this when we introduce the weighting formula, especially when we explain the rank-ordering step.

          - How? When we first write the formula for the binary lottery, we can note: "Note that we are weighting the outcome by transforming the cumulative probability, not the individual probability. This ensures that if one lottery first-order stochastically dominates another, it will always be preferred. This is a key difference from prospect theory, where probability weighting is done on individual probabilities and can violate stochastic dominance."

     b. **That the risk function distorts belief rather than expressing a distinct attitude toward risk:**
          - When? When we interpret the risk function. We must stress that the risk function is about the evaluation of risk, not about misperceiving probabilities. The probabilities are known and objective (we are in a risk setting, not uncertainty). The risk function is a characteristic of preferences, not beliefs.

          - How? When we first use the risk function in the calculation, we can say: "The risk function h does not represent a belief about the probability; it represents the decision maker's attitude toward the risk inherent in the lottery. We are assuming the probabilities are known and objective, and h transforms the cumulative distribution to reflect how the decision maker feels about the chance of getting at least a certain outcome."

  7. **Sequence of the lecture:**
     - **Step 1:** Recap vNM and the link between risk aversion and concave utility. Emphasize that in vNM, the utility function captures both the value of money and risk attitude. [10 minutes]
     - **Step 2:** Present the binary choice problem (sure $40 vs. 50-50 $0/$100) and note that a risk-averse choice (sure $40) cannot be explained by vNM with linear utility. But what if we want to model a risk-averse person with linear utility? We need a new tool. [5 minutes]
     - **Step 3:** Introduce the RWEU for a binary lottery. Derive the formula: 
            V = u(x_low) * [1 - h(p_high)] + u(x_high) * h(p_high)
       and explain that h is the risk function. Show how with u(x)=x, and h(0.5)=0.3, we get risk aversion. Also show that h(0.5)=0.5 would be risk neutrality (matching vNM with linear utility) and h(0.5)=0.6 would be risk seeking. [15 minutes]
     - **Step 4:** Address the first misconception: "Note that this is not the same as prospect theory's probability weighting. In prospect theory, we might weight the 0.5 probability by a function w(0.5) and then use that in the expectation. But that would lead to: 
            0.5 weighted to w(0.5) and 0.5 to w(0.5) again? Actually, no: in prospect theory for binary lotteries, it would be: 
            V = w(0.5)*u($100) + w(0.5)*u($0)   [if we use the original version] but note that in prospect theory, the weights are applied to the probabilities of the outcomes, but without rank-dependence. This can lead to violations of stochastic dominance. In our RWEU, the weight for the good outcome is h(p_high) and for the bad outcome is 1-h(p_high). This ensures that if we increase the probability of the high outcome, the weight increases, and if we increase the probability of the low outcome, the weight for the high outcome decreases appropriately. Also, it preserves stochastic dominance." [5 minutes]
     - **Step 5:** Address the second misconception: "The risk function h is not about distorted beliefs. We assume the decision maker knows the probabilities. The function h captures how the decision maker feels about the risk of the lottery. For example, a function h that is concave (like h(p)=p^2) might reflect pessimism (overweighting the bad outcomes) because it underweights the high outcome's probability in the cumulative? Actually, for a concave h, h(p) < p for p in (0,1). So in the binary case, h(0.5) would be less than 0.5, which leads to risk aversion. But this is a preference, not a belief." [5 minutes]
     - **Step 6:** Extend beyond binary: briefly explain how to handle more outcomes (ordering from worst to best and applying the risk function to the cumulative probabilities). But for this lecture, we might stick to binary to keep it simple. [Optional: 5 minutes]
     - **Step 7:** Conclude by positioning RWEU as a coherent alternative that generalizes expected utility (when h(p)=p, we get EU) and allows for a separate risk attitude. Emphasize that it is not a reasoning error but a different model of rational choice under risk. [5 minutes]

  8. **Question to pose at the end to test understanding:**
     - "Suppose we have two decision makers with the same linear utility function (u(x)=x) but different risk functions. The first has h(p)=p^2, and the second has h(p)=sqrt(p). For the lottery that pays $0 with probability 50% and $100 with probability 50%, which one would prefer the sure $40? And what does this tell us about their risk attitudes?"

          Calculation:
            For the first: h(0.5)=0.25 -> V = 100 * 0.25 = 25 -> prefers $40 (which is 40>25) -> risk averse.
            For the second: h(0.5)=sqrt(0.5)≈0.707 -> V=100*0.707≈70.7 -> prefers the lottery (40<70.7) -> risk seeking.

          This shows that the risk function captures risk attitude independently of the utility function.

  9. **Set aside:**
     - Explicitly set aside:
          - Ambiguity (Knightian uncertainty) and subjective probabilities (we are only dealing with known probabilities).
          - The axiomatic foundations of RWEU (though mention that it satisfies stochastic dominance and continuity, and is derived from axioms that relax the independence axiom in a specific way).
          - Applications to insurance or portfolio choice (though they exist, we are focusing on the conceptual foundation).
          - Comparison with other non-expected utility models (like prospect theory, betweenness models, etc.) beyond the clarification we already provided.

     Tell the students: "Today, we are focusing on the core idea of risk-weighted expected utility in a setting of known probabilities (risk). We are setting aside ambiguity and subjective probability, as well as the full axiomatic derivation and applications, to concentrate on the separation of risk attitude from the utility function."

  Time allocation: Total 50-60 minutes.
answer: |-
  ### Lecture Plan: Risk-Weighted Expected Utility for Skeptical PhD Students  
  **Goal:** Position risk-weighted expected utility (RWEU) as a *rational* alternative to vNM expected utility (EU), not a reasoning error.  
  **Core Strategy:** Build from familiar foundations, use a *single binary choice problem* to crystallize the theory, preempt misconceptions, and emphasize the *separation of risk attitude from utility curvature*.  

  ---

  #### **Order of Components and Dependencies**  
  1. **Recap vNM EU and Its Limitations (10 mins)**  
     - **Why start here?** Students know EU cold; anchor the lecture in their expertise.  
     - **Key point:** In EU, risk attitude is *entangled* with utility curvature (concave \(u\) → risk aversion). Highlight that this entanglement implies a rigid link: you cannot be risk-averse with linear \(u\), nor risk-seeking with concave \(u\).  
     - **Dependency:** This sets the stage for questioning EU’s universality. If risk attitude and utility curvature are distinct phenomena, why force them into one function?  

  2. **Introduce a Puzzling Binary Choice Problem (10 mins)**  
     - **Problem:**  
       - Option A: \( \$50 \) for sure.  
       - Option B: \( 50\% \) chance of \( \$100 \), \( 50\% \) chance of \( \$0 \).  
     - **Observed behavior:** Many people prefer A (risk-averse). EU explains this with concave \(u\) (e.g., \(u(x) = \sqrt{x}\)).  
     - **Challenge:** Suppose a decision maker (DM) has *linear utility* (\(u(x) = x\)) but *still* prefers A.  
       - EU fails: Linear \(u\) implies risk-neutrality (\( \text{EU(B)} = 50 = u(50) \)), so indifference, not aversion.  
     - **Why this problem?**  
       - Simpler than Allais (avoids probability-weighting red herrings).  
       - Forces confrontation: *How can we model risk aversion without utility curvature?*  

  3. **Separate Risk Attitude from Utility (15 mins)**  
     - **Core insight:** Decouple "value" (utility \(u\)) from "risk attitude" (a new construct).  
     - **Mechanism:**  
       - Rank outcomes (here: \(x_{\text{low}} = \$0\), \(x_{\text{high}} = \$100\)).  
       - Transform *decumulative probabilities* (probability of getting *at least* a given outcome) using a **risk function** \(h: [0,1] \to [0,1]\).  
     - **RWEU for binary lotteries:**  
       \[
       V(\text{B}) = u(x_{\text{low}}) + h(p_{\text{high}}) \cdot [u(x_{\text{high}}) - u(x_{\text{low}})]
       \]  
       With \(u(x) = x\), \(x_{\text{low}} = 0\), \(x_{\text{high}} = 100\), \(p_{\text{high}} = 0.5\):  
       \[
       V(\text{B}) = 0 + h(0.5) \cdot (100 - 0) = 100 \cdot h(0.5)
       \]  
     - **Risk aversion with linear \(u\):** If \(h(0.5) < 0.5\) (e.g., \(h(p) = p^2\) → \(h(0.5) = 0.25\)), then \(V(\text{B}) = 25 < 50 = V(\text{A})\) → preference for A.  
     - **Dependency:** The binary problem *demands* this separation. Without it, linear \(u\) cannot explain aversion.  

  4. **Define the Risk Function \(h\) (10 mins)**  
     - **What \(h\) captures:** Attitude toward *chance* (e.g., pessimism via \(h(p) < p\) for \(p \in (0,1)\)).  
     - **Contrast with EU:**  
       - EU: Risk aversion *only* via \(u''(x) < 0\).  
       - RWEU: Risk aversion via \(h(p) < p\) *even if \(u\) is linear*.  
     - **Preempt misconceptions *here*:**  
       - **"Is \(h\) just prospect theory's weighting function?"**  
         - No: Prospect theory weights *individual probabilities* (violating stochastic dominance). RWEU weights *decumulative probabilities* (preserves dominance by respecting ranking).  
         - **Example:** In a lottery with \(\$0\) (99%), \(\$100\) (1%), \(h\) acts on the *chance of getting \(\$100\)* (1%), but only after ranking. Prospect theory might overweight 1% directly.  
       - **"Does \(h\) distort beliefs?"**  
         - No: \(h\) operates on *known probabilities* (risk, not ambiguity). It encodes how the DM *feels* about risk, not what they believe. Beliefs are undistorted; \(h\) is about preference.  

  5. **Generalize to Multiple Outcomes (5 mins)**  
     - **Why last?** The binary case suffices to prove concept; generalization is a technical extension.  
     - **Formula:**  
       \[
       V(L) = \sum_{i=1}^n u(x_i) \cdot \left[ h\left(\sum_{j=i}^n p_j\right) - h\left(\sum_{j=i+1}^n p_j\right) \right]
       \]  
       (Outcomes ranked \(x_1 < \cdots < x_n\), \(h\) monotonically increasing).  
     - **Dependency:** Binary logic extends naturally (weights depend on cumulative "tail" probabilities).  

  ---

  #### **Why Not the Allais Paradox?**  
  - **Misfires with this audience:**  
    - Allais is often dismissed as a "probability distortion" error (e.g., "people misread small probabilities").  
    - It doesn’t *force* separation of risk and utility: EU can "explain" it with specific \(u\) (e.g., Markowitz-style convex-concave).  
  - **Binary problem > Allais:** Cleanly isolates *risk attitude without utility curvature* and avoids probability-weighting associations.  

  ---

  #### **Predictable Misconceptions and When to Preempt Them**  
  1. **"\(h\) is prospect theory in disguise."**  
     - **When:** Immediately after defining \(h\).  
     - **How to head off:** Contrast weighting methods:  
       - RWEU: \(h\) transforms *decumulative* probabilities (rank-dependent).  
       - Prospect theory: \(w\) transforms *individual* probabilities (violates dominance).  
     - **Example:** "Would you prefer \(\$100\) with prob 0.01 or \(\$99\) with prob 0.02? EU and RWEU obey stochastic dominance; prospect theory might not if \(w(0.01) > w(0.02)\)."  

  2. **"\(h\) distorts beliefs."**  
     - **When:** When introducing \(h\)’s role.  
     - **How to head off:** Stress that probabilities are *objective and known* (this is *risk*, not ambiguity). \(h\) is about *evaluating* risk, not *perceiving* it.  

  ---

  #### **Revealing Question at the End**  
  - **Question:** "Suppose two DMs have linear \(u(x) = x\). DM1 has \(h(p) = p^2\), DM2 has \(h(p) = \sqrt{p}\). Which prefers the lottery (50% \(\$100\), 50% \(\$0\)) over \(\$50\) for sure? What does this imply about their risk attitudes?"  
    - **Answer:**  
      - DM1: \(V(\text{lottery}) = 100 \cdot (0.5)^2 = 25 < 50\) → prefers sure thing (risk-averse).  
      - DM2: \(V(\text{lottery}) = 100 \cdot \sqrt{0.5} \approx 70.7 > 50\) → prefers lottery (risk-seeking).  
    - **Why it works:** Tests grasp of \(h\) as the *sole* driver of risk attitude when \(u\) is linear.  

  ---

  #### **What to Set Aside**  
  Explicitly state:  
  - **"Today, we set aside:**  
    - *Ambiguity* (Knightian uncertainty): RWEU assumes known probabilities.  
    - *Axiomatic foundations*: We focus on intuition; RWEU satisfies completeness, transitivity, continuity, and a weaker independence (comonotonic independence).  
    - *Calibration/emprics*: How to estimate \(h\) is for another lecture.  
    - *Prospect theory comparisons*: We’ll revisit, but today RWEU stands alone as a rational model."  

  ---

  **Total Time:** 50-55 mins (flex Q&A).  
  **Outcome:** Students see RWEU not as "EU plus errors," but as a coherent extension separating risk from value—rationality under a broader definition.
