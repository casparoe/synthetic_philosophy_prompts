prompt: |-
  I just lost about two hours of my evening to an argument with my roommate — she's finishing a PhD in econ, I'm doing a policy masters and working part time at a state environmental agency — about whether being risk averse can be rational in its own right, or whether it's always either an illusion or a mistake. I said of course it's rational, that's why people buy insurance on things the math says are bad bets. She said no, that's just diminishing marginal utility of money, and once you spell the outcomes out in terms of the thing you ultimately care about, you have to be risk neutral, so if you'd rather have a sure loss of 50 than a coin flip between 0 and 120 that's either you misperceiving the odds or you being irrational, end of story. Then she pulled out this thing she's been reading about where you line up the outcomes of a gamble from worst to best and each outcome's weight isn't its probability but some function of the chance of that outcome happening *or anything worse than it* happening — so the same one percent chance of a catastrophe gets treated completely differently depending on what else is on the table, and your attitude to risk is baked into the rule itself instead of into the utility function. Which sounds insane to me, but then I went to work the next morning and started looking around at how the stuff on my desk is actually set up, and now I can't tell who's right.

  Some of what we do is pure expected value arithmetic. We put a dollar figure on a statistical life, a few million give or take, multiply by the expected number of deaths a rule would prevent, subtract the compliance cost, and if the number comes out positive we do the rule. Risk there is just probability times harm — a one in ten thousand chance of killing someone is worth exactly a thousandth of killing them outright, no more. Fine. But two floors down, contaminated sites run on a totally different logic: the cleanup target is a one in a million added cancer risk, which everybody in the building treats as basically zero, i.e. as a line below which the risk stops counting at all rather than as a small number that gets multiplied by anything. And there are statutes — the food additive one from the late fifties is the famous example, if I'm remembering it right — where a substance that causes cancer in lab animals can't be approved at any dose, no matter how tiny, because that risk simply isn't tradeable against the benefit. The safety people write rules saying you have to keep reducing a hazard until the next increment of protection costs *wildly* more than the benefit it buys, not merely equal to it, and other rules that set an absolute ceiling on individual risk that no economic benefit can justify crossing even if the benefit is enormous. And over in the courts, someone exposed to a chemical can sometimes recover damages for the increased risk of a disease they haven't got and may never get.

  So what view of practical rationality does this whole bundle presuppose? Is there a single theory under which the linear cost-benefit stuff and the no-safe-dose stuff are both correct rather than one of them just being a political bone thrown to frightened people — and does the rank-dependent thing my roommate was going on about actually do that job, i.e. does the practice presuppose a non-linear weighting of chances, and if so what shape does that weighting have to have to generate ceilings, floors, and gross disproportion tests all at once? Which rival views does the bundle rule out, and where is it merely compatible with several, so that the practice turns out to be underdetermined — could a straight expected utility view with the right utility function license all of it, including the absolute ceilings, or do the ceilings need something else entirely, like a deontic constraint or a threshold below which probabilities just don't register? I want the strict presuppositions separated from the stuff that's just there for litigation risk and public panic. And if the answer is that we're implicitly running something like her theory, tell me what actually changes if we swap in straight expected value: which of these rules has to go, and what does the replacement rulebook look like?
reasoning: |-
  Alright, let's tackle this user's problem. They had a heated argument with their roommate about whether risk aversion can be rational. The user works in environmental policy and noticed inconsistencies in how different agencies handle risk. Their main question is whether there's a unified theory that explains all these approaches, specifically if rank-dependent utility (RDU) or expected utility theory (EUT) can reconcile practices like cost-benefit analysis, no-safe-dose thresholds, and absolute risk ceilings.

  First, I need to break down the user's scenario. They’re in policy with real-world applications, so theoretical answers must connect to practice. The roommate, an econ PhD, argues that risk aversion stems from diminishing marginal utility, not irrationality. But the user observes that in their agency, some departments use strict expected value, while others use thresholds and prohibitions. The user wants to know which model underpins these practices and what changes if they switch to pure expected value.

  The key points from the user’s examples: 
  1. Statistical Life Value (VSL) uses linear expected value. 
  2. Contaminated sites use a one-in-a-million threshold, treating risks below as zero. 
  3. Statutes like Delaney Clause ban carcinogens regardless of dose. 
  4. Safety rules require disproportionate costs for incremental safety. 
  5. Courts award damages for increased risk without actual harm.

  The user’s deeper need is understanding the rationality behind these policies. They might be seeking validation that their practical observations have theoretical grounding. Also, they might need to justify these policies to stakeholders or reconcile conflicting approaches in their work.

  Next, analyzing the theories. Expected Utility Theory (EUT) with a concave utility function explains buying insurance through diminishing marginal utility. But absolute ceilings and thresholds don’t fit neatly here. For example, banning any carcinogen, no matter how small the risk, contradicts EUT’s probabilistic trade-offs. 

  Rank-Dependent Utility (RDU) or Cumulative Prospect Theory (CPT) might explain thresholds. These models overweight extreme outcomes (like catastrophes) and underweight small probabilities. A one-in-a-million risk being treated as zero could be due to probability weighting where tiny chances are ignored. Absolute ceilings align with overweighting worst-case scenarios, making them non-negotiable.

  Now, reconciling both approaches. The agency might use EUT for high-probability, calculable risks (like VSL) but switch to threshold models for low-probability, high-impact events (like carcinogens). This hybrid approach isn't inconsistent but context-dependent. The user needs to know if RDU can unify these. While RDU explains thresholds and ceilings, it doesn't seamlessly merge with linear VSL. However, in practice, agencies might adopt different models based on context without a single overarching theory.

  If switching to pure expected value: Thresholds would dissolve, making all risks tradable. The Delaney Clause would be irrational; instead, tiny risks would be cost-justified. Courts wouldn’t compensate for risk without harm. Safety rules would balance costs exactly, not disproportionately. 

  The user also asked about other theories. Deontological constraints (rights-based bans) or lexical utilities (infinite disutility for certain harms) could justify absolute ceilings, but these are non-consequentialist. Probability thresholds (ignoring risks below a level) are pragmatic but not utility-based. 

  In conclusion, the practices aren’t unified under one theory. EUT can explain some, but thresholds need RDU or other models. The bundle of practices rules out pure expected value and strict EUT without adjustments. Hybrid approaches are common, where calculable risks use EUT, and catastrophic risks use thresholds. The user’s insight about varying methods is valid; the answer lies in contextual application rather than a single model.
answer: |-
  Your confusion is understandable—this debate cuts to the core of how we model rationality under risk. Let's dissect the institutional practices you described and map them to theoretical foundations. The short answer: **your roommate's "rank-dependent" framework (likely Cumulative Prospect Theory or Rank-Dependent Utility) *can* rationalize many of these practices, but they also rely on non-consequentialist elements. Pure Expected Utility Theory (EUT) *cannot* explain all of them without violating its axioms.**

  Here's how the pieces fit:

  ### 1. **Core Theories in Play**
  - **Expected Utility Theory (EUT):** Rational agents maximize *expected utility*. Risk aversion arises *only* from the **concavity of the utility function** (diminishing marginal utility). Probabilities are linear. *No inherent fear of uncertainty*.
  - **Rank-Dependent Models (RDU/CPT):** Outcomes are ranked worst-to-best. Decision weights depend on *cumulative probabilities* (probability of outcome X *or worse*). This distorts probability weighting: small probabilities of catastrophe are overweighted, high probabilities underweighted. Risk attitudes are baked into **probability weighting + utility curvature**.

  ### 2. **Mapping Practices to Theories**
  | **Practice** | **EUT-Compatible?** | **RDU/CPT-Compatible?** | **Requires Non-Consequentialism?** |
  |--------------|---------------------|--------------------------|-----------------------------------|
  | **VSL-based CBA** | ✅ (Linear EV in utils) | ✅ (If utility ≈ linear) | ❌ |
  | **1-in-1M Threshold** | ❌ (Ignores small risks) | ✅ (Probability "neglect" via weighting function) | ⚠️ (Can be pragmatic) |
  | **Absolute Risk Ceilings** | ❌ (No trade-offs) | ⚠️ (Only with extreme weighting) | ✅ (Rights/thresholds) |
  | **Gross Disproportion Tests** | ❌ (Requires k>1, not k=1) | ✅ (Overweighting worst outcomes) | ⚠️ |
  | **No-Safe-Dose (Delaney)** | ❌ | ❌ (Even RDU allows tiny risks) | ✅ (Deontic constraint) |
  | **Damages for Risk Itself** | ❌ (No harm = no loss) | ✅ (If risk is disutility) | ⚠️ |

  ### 3. **Key Insights**
  - **Thresholds & Ceilings:** The 1-in-1M "practical zero" aligns perfectly with RDU's **probability weighting function**, where probabilities below a threshold (e.g., 10⁻⁵) are mentally rounded to zero. Absolute ceilings (e.g., "no individual > 1/10,000 risk") require **lexicographic preferences** or **deontological rules** ("no one sacrificed for aggregate gain").
  - **Gross Disproportion:** RDU naturally generates this. If your weighting function **overweights worst-case outcomes** (e.g., a 1% chance of catastrophe feels like 10%), you'll demand far more than actuarial value to accept risk.
  - **Delaney Clause Paradox:** This is the hardest to rationalize. *No consequentialist model* (EUT or RDU) bans infinitesimal risks if benefits exist. It presupposes **categorical moral prohibitions** ("no deliberate carcinogen introduction") or **infinite disutility** (any cancer risk = -∞ utility).
  - **Risk-Only Damages:** EUT sees this as irrational (no harm = no loss). RDU allows it if the **psychological burden of risk exposure** itself reduces utility.

  ### 4. **What Changes Under Pure Expected Value?**
  If your agency switched to strict linear EV:
  - **Thresholds Vanish:** All risks >0 are priced. Cleanup continues until cost = benefit.
  - **Ceilings Fall:** A project imposing 1% cancer risk on one person is approved if benefits > $10M (using VSL).
  - **Disproportion Tests Normalize:** Safety spending capped at cost = expected benefit.
  - **Delaney Clause Repealed:** Tiny risks traded for benefits (e.g., 1-in-a-billion risk approved if benefit > $0.01).
  - **Risk-Only Damages Dismissed:** Courts require manifest injury.

  ### 5. **The Hybrid Reality**
  Your agency's practices reflect a **pragmatic pluralism**:
  - **Quantifiable High-Probability Risks:** Handled by EUT (VSL-based CBA). *Rationale:* Utility curvature suffices.
  - **Low-Probability Catastrophes:** Use RDU-like thresholds. *Rationale:* Humans/systematically overweight tail risks.
  - **Sacred Values:** Invoke deontology (no-trade-off rules). *Rationale:* Political/ethical constraints.

  ### 6. **What Theory Best Explains the Bundle?**
  - **RDU/CPT** (your roommate's model) explains:  
    - Thresholds ("ignorable" risks)  
    - Disproportion tests (overweighting disasters)  
    - Risk-only disutility (anxiety from exposure)  
    *But fails at absolute ceilings/Delaney.*
    
  - **EUT + Deontology** explains:  
    - VSL calculations  
    - Absolute ceilings/Delaney as side-constraints  
    *But fails at thresholds/disproportion.*

  ### Conclusion
  Your institutional practices **presuppose RDU-like probability weighting for low-frequency events** (explaining thresholds and disproportion) **+ deontic constraints for "sacred" harms** (explaining ceilings/Delaney). Pure EUT can't replicate this without ad-hoc utility functions violating its axioms. 

  **What's rational?** In a bounded-rationality world, RDU is descriptively accurate and pragmatically defensible for rare disasters. But Delaney-style bans are political/ethical choices, not risk-management ones. The "mistake" is applying one model universally—your agency's eclectic approach is wiser than rigid adherence to either theory.

  *Source: Tversky & Kahneman (1992) on CPT; Sunstein on cost-benefit pluralism; Hansson on deontic thresholds.*
