prompt: |-
  I'm teaching a one-off 90-minute session on Hacking's looping effects to second-year psychiatry residents. They know the DSM and ICD cold, they have zero philosophy of science, and I'd bet half of them think this is a fancy way of saying "diagnoses carry stigma." Don't explain looping effects to me, I've got that part. Plan the teaching. What order do the pieces have to go in so it lands as a claim about classifications and people reshaping each other rather than as a slogan — what depends on what, and what has to come before what — plus the one case that carries the whole thing, where the misconceptions surface, and how I'll know at the end whether it worked.

  Two constraints on the plan.

  First, the obvious carrying cases are the ones they've half-heard of already (fugue, multiple personality/DID, homosexuality, the Rosenhan study). Tell me which of those are actually bad pedagogically and why, then give me something better. I was thinking prolonged grief disorder, which is new-ish in both DSM-5-TR and ICD-11 and drew a lot of pushback about pathologizing grief, or else burnout, which sits in ICD-11 but deliberately not as a disorder. Say whether either of those works, which one carries more, and what the case has to have and lack for the loop to be visible rather than just asserted.

  Second: what has to be in place before they can predict a loop instead of recognizing one in hindsight? I want to close by inventing a category live — something like "post-scroll dysphoria" or "algorithmic compulsion" — and have them map where the loops would go: who adopts it, who resists it, what happens to the people it lands on, what happens to the criteria themselves. For that to be more than a bullshit session, tell me what the earlier sequence must have established and give me the actual prompt I'd put on the board. And if that exercise is too easy to fake, give me a sharper second check.

  Then the misconception map: the ones they'll walk in with and the ones the material will manufacture, in the order they'll show up, with the exact point in the sequence where I head each off. I'm expecting "this is labeling theory," "social construction means it isn't real," "it's just stigma," "patients are copying symptoms off TikTok," "so diagnosis is bad and we should stop diagnosing," and probably "doesn't this apply to everything, like left-handedness or obesity?" Finally, what I should openly refuse to cover at this level and announce that I'm skipping — the realism/construction fight, Hacking's later machinery for how a kind gets made, the detailed history of any single category — and why skipping those is the right call rather than cowardice.

  No reading list, they won't read it anyway.
reasoning: |-
  Okay, let me tackle this psychiatry teaching plan. The user wants a tightly sequenced 90-minute session on Hacking's looping effects for residents who know DSM/ICD cold but lack philosophy background. 

  First, I need to avoid the obvious cases like DID or homosexuality - they're too loaded with preconceptions. Prolonged grief disorder (PGD) seems perfect: it's new, controversial, and shows active looping without being politicized like burnout. The key is having both institutional adoption (DSM-5-TR/ICD-11) AND pushback from clinicians/public - that tension makes the loop visible.

  For the prediction exercise, we need to build step-by-step: start with their existing knowledge (diagnostic criteria), add Hacking's "interactive kinds" concept, then demonstrate with PGD before asking them to invent something like "algorithmic depletion disorder". The prompt must force specificity: "Who would institutionalize this? Which patients might adopt/reject it? How might symptoms shift after media coverage?"

  Misconceptions will pop up at specific points:
  - "Just stigma" when introducing PGD → counter by showing how griefers actively reshape the category itself
  - "Social construction = not real" during Q&A → emphasize Hacking's "dynamic nominalism": categories have real effects because we live in them
  - "So diagnosis is bad" at conclusion → reframe as "diagnosis is participatory"

  I'll explicitly skip three things: realism debates (too philosophical), Hacking's later taxonomy of kinds (too granular), and single-category histories (distracts from mechanism). This isn't cowardice - it protects the core argument.

  The proof it worked? If they can not only predict loops for the invented disorder but spot why "left-handedness" is a bad example (stable category, no feedback loop). That shows transfer beyond the case study.
answer: |-
  Here’s a structured 90-minute plan focused on **sequence, misconception management, and predictive application**, using a pedagogically optimized case. Skip to "The Sequence" for the order, but first—critical groundwork:

  ### Why Avoid Obvious Cases?  
  **Fugue/DID:** Residents already "know" these as "discredited" or "controversial," triggering "stigma/overdiagnosis" reflexes. Loops get reduced to "doctors created it."  
  **Homosexuality:** Politically charged; debates about harm/liberation overshadow the *mechanism* of looping.  
  **Rosenhan:** Focuses on diagnostic *error*, not dynamic interaction.  

  **Prolonged Grief Disorder (PGD) is the superior case:**  
  - **Why it works:**  
    - Fresh (DSM-5-TR/ICD-11), so no hardened opinions.  
    - Embodies **active looping**: Clinicians *debated* criteria pre-inclusion; patients *self-identify* or *reject* the label; media pathologizes/public resists; support groups adopt/reshape it.  
    - **Crucial elements for visibility (not assertion):**  
      1. **Pre-existing human experience** (grief) everyone recognizes.  
      2. **Contested institutionalization** (APA/WHO committees argued duration, cultural validity).  
      3. **Visible patient/clinician pushback** (e.g., "medicalizing normal grief").  
      4. **Emergent adaptations**: Patients using PGD diagnosis to access therapy/sick leave; others avoiding clinicians to evade pathologization.  
  - **Burnout is weaker:** ICD-11 deliberately frames it as an "occupational phenomenon" *not* a mental disorder. This muddies the "diagnosis reshapes people" core (though useful contrast later).  

  **PGD carries the argument because the loop is live and observable.**  

  ---

  ### The Sequence: 90-Minute Plan  
  **GOAL:** Move from *"diagnosis = static label"* → *"classification + humans = co-evolving system."*  

  | Time  | Phase                     | Key Activity                                                                 | Purpose                                                                 | Misconception Addressed (When/How)                                                                 |
  |-------|---------------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
  | 0-10m | **Anchoring in Reality**  | Show 3 quotes: 1 grieving person rejecting PGD, 1 using it for therapy access, 1 clinician criticizing DSM criteria. Ask: "What’s happening *between* these positions?" | Surface intuitions about diagnosis as social process; reveal resident assumptions. | **"It's just stigma" (pre-empted):** Highlight *active* negotiation (rejection/adoption/adaptation), not passive labeling. |
  | 10-25m| **The Engine: Hacking’s Core** | **Define:** "Interactive Kinds" (vs. "Indifferent Kinds"). Use PGD: <br>- Pre-DSM: Grief variations existed but weren’t a *clinical target*.<br>- Post-DSM: People *aware* of criteria → adjust behavior (seek help/hide grief/reframe identity).<br>- Clinicians tweak criteria based on patient response. | Establish loop mechanism: **Classification → Awareness → Reaction → Classification shift.** | **"Patients copy symptoms" (headed off):** Frame awareness as *reinterpretation* of experience ("Is *this* PGD?"), not imitation. |
  | 25-40m| **PGD Deep Dive**         | Map PGD’s loop:<br>1. **Institutionalization:** WHO/APA committees debate → criteria set.<br>2. **Adoption:** Patients use diagnosis for validation/resources.<br>3. **Resistance:** "Grief advocates" protest medicalization.<br>4. **Shift:** Clinicians report "new" presentations (e.g., anxiety about grief duration). | Show feedback loops in action. Criteria aren’t "applied," they *interact*. | **"So diagnosis is bad" (pre-empted):** Note PGD *also* helps some access care. Stigma is one *effect*, not the *mechanism*. |
  | 40-55m| **Predictive Exercise**   | **Prompt on board:** *"Invent 'Algorithmic Depletion Disorder' (ADD): chronic brain fog/dysphoria after prolonged algorithmic content consumption. Map the loops:*<br>- **WHO adopts/resists?** (Tech workers? Teens?) <br>- **How might 'symptoms' shift** once labeled?<br>- **Where would DSM criteria be in 5 years?**"<br>Groups brainstorm → share. | Apply loop logic prospectively. Forces focus on *dynamics*, not just "is it real?" | **"Doesn't this apply to everything?" (addressed live):** Contrast ADD with left-handedness (stable biology, minimal feedback). |
  | 55-75m| **Refinement & Checks**   | **Sharper check:** "Where would ADD *fail* to loop? If it only affected isolated, disempowered groups? If algorithms were banned?" Highlight: **Loops require awareness + capacity to react.**<br>**Key Q:** "What made PGD loop *faster* than historical diagnoses?" (Ans: Internet, patient advocacy, rapid publication). | Test understanding of *necessary conditions* for looping (visibility, agency, institutional permeability). | **"This is labeling theory" (final kill):** Labeling theory is passive (label → stigma). Looping is *dialectical* (label inspires reorganization → label changes). |
  | 75-90m| **Clinical Implications** | Discuss: "How does looping change your use of DSM? Should you avoid diagnosis? *Adjust* diagnosis? Involve patients in conceptualization?" Emphasize: **Diagnosis is participatory, not static.** | Transition to practice; mitigate "diagnosis is bad" conclusion. | **"Social construction = not real" (closed):** "PGD criteria *organize* real suffering; the loop makes it *differently* real, not unreal." |

  ---

  ### Misconception Map & Strategic Omissions  
  **Incoming Misconceptions:**  
  1. **"This is about stigma"** → Killed in **Anchoring (0-10m)** by showing active negotiation.  
  2. **"Patients copy symptoms (TikTok)"** → Pre-empted in **Hacking’s Core (10-25m)** by framing awareness as reinterpretation.  
  3. **"So diagnosis is harmful"** → Neutralized in **PGD Deep Dive (25-40m)** by showing utility + in **Clinical Implications (75-90m)**.  

  **Material-Generated Misconceptions:**  
  4. **"Social construction = not real"** → Shut down in **Clinical Implications (75-90m)** with "differently real" pragmatism.  
  5. **"Applies to everything (obesity)"** → Resolved in **Predictive Exercise (40-55m)** by contrasting ADD with low-feedback examples.  
  6. **"Just labeling theory"** → Explicitly distinguished in **Refinement (55-75m)**.  

  **What We Skip & Why:**  
  - **Realism/construction debates:** Too abstract; distracts from *mechanism*. Say: *"We’re bracketing ‘what is real’ to focus on ‘how it changes.’"*  
  - **Hacking’s later machinery (e.g., ‘making up people’):** Granular; not needed for core loop. Say: *"We’re using his foundational insight, not later taxonomies."*  
  - **Single-category histories:** Time sink; PGD suffices. Say: *"Today’s case is paradigmatic—we don’t need more examples to see the structure."*  
  **This isn’t cowardice—it’s precision.** Depth on looping > superficial coverage of tangents.  

  ---

  ### How You’ll Know It Worked  
  - **Predictive Exercise Success:** Groups identify plausible feedback loops (e.g., "Teens reframe boredom as ADD" or "Tech firms lobby against ICD inclusion").  
  - **Sharper Check:** They articulate why ADD *wouldn’t* loop without awareness/agency (e.g., "If only illiterate farmers had it, no loop").  
  - **Clinical Implications:** Residents suggest concrete adjustments (e.g., "Discuss diagnosis as a working hypothesis with patients" vs. "Stop diagnosing").  

  **PGD’s loops make the abstract concrete; inventing ADD tests transfer. If they see diagnosis as a verb, not a noun—you won.**  

  ---
