prompt: |-
  I'm a novelist — not an academic, never published a paper, and I'm applying for one of those year-long arts-and-humanities fellowships that basically pays you to think. They want a two-page research proposal and I've got half an idea I'd like you to turn into something I could actually hand in. Don't worry about citations or a reading list, I'll get a friend in a philosophy department to fill those in for me.

  The half-formed idea: I keep noticing something when I workshop scenes. If I give the same moral dilemma to two readers — say, a person has to decide whether to divert a runaway trolley, or whether to hand over a friend hiding in the attic — and I write it one way as a bare clinical paragraph, and another way as a slow domestic scene with weather and a kitchen and somebody's bad knee, I get different answers. Same content, different container, different verdict. And then there's translation: two of my books have been translated, and the translators made choices I'd never have made, and the reviews in those languages zeroed in on completely different things than the English ones did. So my suspicion is that the big cross-cultural surveys of philosophical intuitions — the trolley stuff, the Gettier cases, the moral-luck stories — might be partly measuring narrative conventions and habits of storytelling rather than some deep difference in moral or epistemic intuition. A vignette is a tiny piece of fiction, and nobody in that literature treats the genre of the vignette as a variable that matters. That's the in-the-weeds bit I want to push on.

  Turn this into a real proposal. I need: the question stated so precisely that there's a definite answer to it, some account of why the existing positions and studies leave it open (without me having to cite them, just describe the shape of the debate), and then the method — what I would actually do, month by month, for twelve months. My instinct is that the cheap and clever move is to vary the register inside a single language and culture first, where I can control everything, before spending money on translation and cross-cultural samples; say whether that's the right order and why, and what the obvious alternative approach would be and why mine beats it. Then tell me what a result would even look like — what I'd write at the end, and what finding would actually be interesting versus what would just be me confirming that readers are suggestible. And be honest about what would count as the project failing, and whether a year is enough given that I'll also be finishing a novel in the same twelve months. Assume I have basically no budget and no lab, just time, a laptop, some willing readers, and a couple of translators I can beg favors from.
reasoning: |-
  Okay, the user is a novelist applying for a fellowship and needs help turning their half-formed idea into a research proposal. Let me start by understanding their core observation: narrative framing affects moral judgments. They mentioned workshop experiences where the same dilemma presented differently led to different reader responses. Also, translations of their books shifted critical focus, suggesting narrative conventions influence interpretation. 

  The key insight here is that existing philosophy studies might be measuring storytelling habits rather than deep intuitions. The user wants to test if the vignette's genre itself is a variable that affects outcomes. Their main question is whether narrative framing alters perceived moral judgments, which existing studies overlook by treating vignettes as neutral.

  Now, structuring the proposal. The user needs a precise question. Refining their idea: "How does narrative framing influence responses to moral dilemmas?" But it needs specificity. Maybe focus on variables like detail level, perspective, or sensory elements. The hypothesis is that richer narratives reduce reliance on abstract principles, introducing ambiguity and context.

  Existing positions in experimental philosophy assume vignettes are transparent vessels. The user should highlight this gap—studies don't vary narrative form. The method should start simple: modify existing dilemmas (like trolley problems) with different narrative treatments within one language/culture. That's cost-effective and controls variables. Then, if time, test translations to see if effects persist across languages.

  Methods month-by-month: Start with literature review to identify key dilemmas. Months 3-4 design variations (sparse vs. rich, close vs. distant POV). Months 5-7 recruit readers via workshops/online, collect responses. Analyze qualitative feedback for why judgments shifted. If possible, collaborate with translators for cross-language tests later.

  Expected results: If narrative style changes responses, it challenges the assumption that vignettes are neutral. Interesting findings would show specific narrative elements that consistently alter judgments. Failure would be no significant changes, suggesting judgments are stable despite framing. A year is tight but feasible with focused phases. Balancing the novel writing means keeping experiments manageable—no large surveys, leverage existing networks.

  The user’s deeper needs: They’re a creative writer, so the proposal must resonate with artistic inquiry, not just academia. Emphasize how this bridges literature and philosophy. They need credibility without citations, so framing the debate broadly. Also, practical constraints—low budget, no lab. Stress using available resources: writer networks for readers, translator favors. Highlighting the novel-writing parallel shows feasibility within time limits.

  Potential pitfalls: Time management with dual projects. Advise front-loading experiments. If results are inconclusive, the project still contributes by questioning methodological assumptions in experimental philosophy. Even null results prompt reevaluation of how studies are designed. The fellowship’s goal is thinking time, so the process itself has value.
answer: |-
  Here’s a structured, two-page research proposal tailored to your needs as a novelist, emphasizing feasibility and clear intellectual stakes without requiring heavy academic infrastructure. It frames your insight as a critical intervention in experimental philosophy and narrative theory.

  ---

  **Research Proposal: The Narrative Container – How Storytelling Conventions Shape Philosophical Intuitions**

  **Principal Investigator:** [Your Name], Novelist  
  **Duration:** 12 months  
  **Resources Required:** Laptop, volunteer readers (drawn from writing workshops/book clubs), pro bono translation consultations, qualitative analysis software (e.g., free-tier Dedoose/ATLAS.ti).  

  ### 1. Core Research Question
  > **Does systematic variation in the *narrative framing* of classic philosophical thought experiments (e.g., trolley problems, Gettier cases, moral luck scenarios) significantly alter respondents' intuitions about morality, knowledge, or agency, *independently* of the core logical or ethical dilemma presented?**  

  This question demands a **yes/no answer** with **qualitative nuance**: *Which* narrative elements (e.g., sensory detail, focalization, pacing, domestic context) exert the strongest influence, and *how* do they reframe the perceived stakes?  

  ### 2. The Gap in Existing Work
  Experimental philosophy ("X-Phi") relies heavily on short textual vignettes to probe cross-cultural or universal intuitions. These studies assume the vignette is a **neutral container** for the underlying dilemma. The debate focuses on whether variations in responses reveal:  
  *   **Deep cultural/cognitive differences** (e.g., individualist vs. collectivist ethics),  
  *   **Performance errors** (misunderstanding, inattention), or  
  *   **Noise** requiring statistical filtering.  

  **Crucially, the *literary form* of the vignette itself is rarely treated as a significant independent variable.** The genre conventions of the "philosophical vignette" – typically sparse, abstract, emotionally detached, and focused on action/choice – are taken for granted. Meanwhile, narrative theory (in literary studies) demonstrates that form *creates* meaning: perspective shapes empathy, detail anchors abstraction, pacing builds tension, and genre signals interpretive rules. **This proposal bridges X-Phi and narrative theory by testing the hypothesis that the "neutral vignette" is an illusion; its form actively shapes the intuitions it aims to measure.**

  ### 3. Methodology: Phased, Controlled, and Feasible
  **Core Principle: Start Simple, Control Variables.** Testing narrative framing *within* a single linguistic/cultural context first isolates the variable of interest (form) before introducing the complexity of translation/culture. This is **more rigorous** than jumping to cross-cultural comparison, as it:  
  *   Rules out translation artifacts as the *initial* cause of variation.  
  *   Allows precise crafting and comparison of narrative forms.  
  *   Requires minimal resources for Phase 1.  
  *(Alternative approach: Jumping straight to cross-cultural surveys. Why mine is better: Without first establishing *if/which* narrative variables matter within a culture, cross-cultural differences are impossible to interpret cleanly – is it culture or narrative rendering? This approach builds foundational evidence efficiently).*  

  **Phase 1: Intra-Cultural Narrative Modulation (Months 1-6)**  
  *   **Month 1-2:** **Selection & Base Text Creation.** Choose 3-5 canonical vignettes (e.g., Standard Trolley, Fat Man Trolley, a Gettier case, a Moral Luck scenario). Create a rigorously controlled "Base" version for each (akin to typical X-Phi presentation: minimal, factual, 3rd person objective).  
  *   **Month 3:** **Narrative Intervention Design.** For each Base vignette, craft 3 distinct narrative versions varying key elements:  
      *   *Version A (Sparse/Clinical):* Base text, slightly polished.  
      *   *Version B (Rich/Sensory/Immersive):* Embed dilemma in a specific domestic setting (kitchen, attic); add sensory details (weather, smell, texture), mundane physical constraints (bad knee, flickering light), and subtle emotional cues (hesitation, a recalled memory). *Maintain identical core facts/choices.*  
      *   *Version C (Shifted Perspective/Genre):* Re-tell from a different character's POV (e.g., the person on the track, the hiding friend); or use a distinct genre convention (e.g., noir suspense, diary entry, bureaucratic memo).  
  *   **Month 4:** **Reader Recruitment & Protocol.** Recruit 30-40 volunteer readers (via writer networks, book clubs, online communities). Ensure diversity in age/gender but *not* requiring philosophical training. Design a simple online survey: Each reader gets *one version* of *each dilemma type* (counterbalanced to avoid order effects), followed by open-ended questions: "What should [Agent] do? Why? Was the choice obvious/hard? What felt most salient?" + demographic info.  
  *   **Month 5-6:** **Data Collection & Intra-Cultural Analysis.** Run surveys. Analysis:  
      *   *Quantitative:* Compare % endorsing key actions (e.g., pull lever, betray friend) across versions (A vs. B vs. C).  
      *   *Qualitative:* Thematic analysis of "why" justifications. Do reasons shift (e.g., from abstract utility to empathy, duty to consequence, certainty to doubt)? Look for patterns linking narrative elements to shifted intuitions.  

  **Phase 2: Pilot Cross-Lingual Test (Months 7-9 - *Contingent on Phase 1 Results*)**
  *   **If Phase 1 shows significant narrative effects:** Take *one* vignette showing strong effect and its Base version. Work with 2 translators (different language families, e.g., German & Japanese) to create translations. 
  *   **Month 8-9:** Recruit small reader pools (n=10-15 per language) *native* in target languages. Repeat survey (translated). Compare:  
      *   Responses *within* each language (Base vs. Narrative version).  
      *   Responses *between* languages for the *same* version (Base vs. Base; Narrative vs. Narrative).  
      *Goal:* Preliminary signal on whether narrative effects persist *across* translation, and if cultural context interacts with form.  

  **Phase 3: Synthesis & Writing (Months 10-12)**  
  *   Analyze all data, finalize conclusions.  
  *   Draft a long-form essay (target: literary/philosophical journal like *Philosophy and Literature* or *The Point*) and a public-facing article.  
  *   **Key Output:** A theory of "narrative susceptibility" in intuition elicitation, with concrete examples of *how* form shapes judgment.  

  ### 4. Anticipated Results & Significance
  *   **Interesting Result (Likely):** Significant differences in intuitions (both choices and justifications) between narrative versions *within* the same culture. E.g., the "Rich" version increases reluctance to act (divert trolley, betray friend) due to heightened empathy or perceived complexity; a "Bureaucratic" version might increase utilitarian responses. **Significance:** Challenges X-Phi's methodological foundation. Shows intuitions are not merely "read off" abstract dilemmas but are *co-constructed* by the narrative presentation. Demands greater reflexivity about vignette design.  
  *   **Very Interesting Result:** Identification of *specific, replicable narrative levers* (e.g., sensory immersion consistently triggers empathy-based objections; close POV increases perception of ambiguity). Provides tools for both philosophers and storytellers.  
  *   **Confirming Suggestibility (Trivial Result):** Minor or inconsistent variations. While possible, your workshop observations suggest this is unlikely. *Even this* is valuable if shown rigorously – it would bolster confidence in current X-Phi methods against critiques of narrative bias.  
  *   **Failure Modes:**  
      *   *Technical Failure:* Inability to recruit sufficient readers (mitigation: leverage multiple networks, simplify participation).  
      *   *Null Result:* No significant differences found *despite* careful design. **This is still a result!** It would suggest narrative framing within standard bounds matters less than suspected, a valuable contribution.  
      *   *Ambiguity:* Effects present but messy/noisy. **Still valuable:** Highlights the complexity and context-dependence of intuition formation.  

  ### 5. Feasibility Within One Year (Alongside Novel Writing)
  *   **Yes, with focus.** Phase 1 is core (6 months). Design (M1-3) is writing-adjacent. Data collection (M4-5) is mostly passive. Analysis (M6) is intensive but bounded. Phase 2 is small-scale pilot. Synthesis (M10-12) is core writing time.  
  *   **Leverages Your Strengths:** Crafting narratives, qualitative analysis of reader responses, working within constraints. Avoids costly labs, large surveys, or complex stats (basic percentages + thematic coding suffice).  
  *   **Budget:** Near-zero. Readers & translators volunteer. Free software.  
  *   **Risk Mitigation:** Prioritize Phase 1. If novel deadlines clash, Phase 2 becomes optional. The core contribution rests on Phase 1.  

  **Conclusion:** This project uses a novelist’s expertise to probe a fundamental, overlooked assumption in how philosophers (and psychologists) understand human judgment. By treating the vignette *as literature*, it reveals how the container shapes – and potentially distorts – the measurement of its contents. Whether findings reveal significant narrative effects or surprising robustness, the results will refine methodologies across disciplines and deepen our understanding of how stories shape moral and epistemic worlds.  

  ---
  **Key Strengths for Fellowship Committee:**  
  *   **Clear, Testable Question:** Moves beyond vague "narrative matters" to a specific hypothesis.  
  *   **Intellectual Novelty:** Identifies a genuine methodological blind spot.  
  *   **Feasibility:** Realistic scope, leverages applicant's unique skills, low cost.  
  *   **Interdisciplinary Appeal:** Bridges philosophy, literary studies, psychology.  
  *   **Defined Outcomes:** Clear deliverables (essay, article) and value even with negative/null results.  
  *   **Self-Awareness:** Addresses limitations (time, budget) and integration with creative work.  

  This proposal gives you a robust framework. Your philosopher friend can add citations (Machery, Nisbett, Doris for X-Phi critiques; Barthes, Genette, Herman for narrative theory) and flesh out the "existing positions" paragraph with specific names if desired, but the structure stands strong without them. Good luck!
