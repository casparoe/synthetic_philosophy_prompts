  For sub-question (a): Is "belief" well-defined? In cognitive science, beliefs involve propositional attitudes, but models are next-token predictors. The weights encode patterns, but whether that constitutes "belief" is philosophical. There's a 30% chance it's well-defined. This is highly contested; some researchers like Bengio argue for emergent structures, while others like Mitchell stress it's just pattern matching.

  Sub-question (b): If we accept some belief-like state, are indirect methods better? Given that RLHF and safety training suppress certain outputs, indirect probing might bypass this. Likely 80% chance here. But "better" depends on context. Settled that RLHF affects outputs, but whether probes reveal "true" knowledge is disputed.

  Sub-question (c): Why the gap—training pressure or missing info? Training pressure like RLHF causes refusal, but the model might lack deep understanding. High confidence (85%) that pressure dominates in refusal cases like diet claims. Less settled in ambiguous cases; depends on the model's knowledge depth.

  Sub-question (d): Can behavior alone settle this, or is white-box needed? Behavior can indicate knowledge via probing, but white-box methods (like activation vectors) are more reliable. 65% for behavior alone. This area is evolving, with mechanistic interpretability making progress but not yet comprehensive.

  Synthesizing: Start with (a) at 30%. Multiplying through the conditionals: 0.3 * 0.8 * 0.85 * 0.65 ≈ 13.26%. Round to 13-15% as a conservative estimate. The most sensitive term is (a)—whether belief is well-defined. Improving this would involve reading philosophy of AI or cognitive computational neuroscience papers.

  For the hobbyist, practical steps: Experiment with different prompts, languages, and model scales. Use open weights to inspect layers if possible. Track research on ELK and interpretability. This hands-on approach can provide personal evidence, though it won't resolve philosophical debates.

