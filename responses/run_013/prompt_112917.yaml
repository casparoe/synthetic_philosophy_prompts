  Below is a decision tree designed to help your ethics committee navigate the paradox of deontology in the context of your protocol. It uses concrete cases to ground the distinctions and avoids academic jargon. Each branch node is a question answerable without prior knowledge of the positions, and each leaf is a named position (or unnamed if unoccupied) with its most awkward commitment highlighted. The tree covers the logical space based on key distinctions: the nature of the constraint (mere-means prohibition vs. side-constraint), object of assessment (act, rule, etc.), constraint strength (absolute, threshold, etc.), agent-centered restrictions/prerogatives, and the role of moral residue. Cases are integrated throughout, including consent (Case A: one consents to the risk), culpability (Case B: the many are culpable for the threat, e.g., terrorists causing harm), non-lethal rights violation (Case C: harm is theft of a vital resource, not death), and special obligations (Case D: the many are the agent's family).

  ### **Decision Tree: Navigating the Paradox of Deontology**
  *Start at the top and answer each question based on your intuitive judgment of the cases. Proceed to the next branch until you reach a leaf (position).*

  1. **In the protocol, if the one patient consents to the serious risk (Case A), does that make the act permissible?**
     - **Yes** → Go to 2
     - **No** → Go to 3

  2. **Does consent always override the constraint, regardless of the harm or context?**
     - **Yes** → **Consent-Based Specificationism**  
       *Most awkward commitment: It permits extreme harm to a consenting person (e.g., lethal experiments) if they autonomously agree, even if the benefit to others is trivial.*
     - **No** → **Specificationism**  
       *Most awkward commitment: It requires endlessly refining duties to avoid conflicts (e.g., redefining "harm" for every new case like Case C), risking arbitrariness.*

  3. **Is the constraint against harming the one patient absolute, even if it means letting many die?**
     - **Yes** → **Absolutism**  
       *Most awkward commitment: It forbids violating one person (e.g., in Case D, you cannot harm one stranger to save your family) even if the alternative is catastrophic loss of life.*
     - **No** → Go to 4

  4. **In Case B (the many are culpable, e.g., terrorists), would it be permissible to harm one innocent to save them?**
     - **Yes** → **Pluralist Prima Facie Duty View**  
       *Most awkward commitment: It allows harming an innocent to save culpable people if the numbers are large enough, undermining the link between blame and protection.*
     - **No** → Go to 5

  5. **Is the core wrong in harming the one that it treats them as a mere means?**
     - **Yes** → **Kantian Mere-Means View (denies paradox)**  
       *Most awkward commitment: It prohibits using anyone as a mere means even to prevent greater violations (e.g., in Case C, stealing from one to save many is wrong however vital the resource).*
     - **No** → Go to 6

  6. **Can the constraint be overridden, but only when the harm prevented is catastrophic (e.g., extinction-level)?**
     - **Yes** → **Threshold Deontology**  
       *Most awkward commitment: It sets an arbitrary threshold (e.g., "100 lives") where violating one person suddenly becomes permissible, creating a moral cliff-edge.*
     - **No** → Go to 7

  7. **In Case D (the many are the agent's family), does the agent have a prerogative to prioritize saving them?**
     - **Yes** → **Agent-Centered Restrictions with Prerogative**  
       *Most awkward commitment: It allows an agent to avoid a minor harm (e.g., a rights violation in Case C) even if this choice causes many more deaths elsewhere due to inaction.*
     - **No** → Go to 8

  8. **Should the protocol be assessed based on rules that, if widely followed, would minimize harm overall?**
     - **Yes** → **Rule-Consequentialist Reconstruction**  
       *Most awkward commitment: It may forbid breaking a rule (e.g., "never harm without consent") in a one-off case where breaking it would save more lives, because the rule's general acceptance is beneficial.*
     - **No** → Go to 9

  9. **After a decision, is unavoidable regret or guilt (moral residue) evidence of a genuine dilemma?**
     - **Yes** → **Moral Dilemma or Residue View**  
       *Most awkward commitment: It cannot resolve the protocol dilemma (e.g., choosing to harm one or let many die) and instead focuses on managing regret, offering no action-guidance.*
     - **No** → **Particularism**  
       *Most awkward commitment: It rejects all general principles (like your protocol), making standardized ethics rules impossible because every case (e.g., Case B vs. Case D) is unique.*

