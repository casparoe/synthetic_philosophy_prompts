  I'm in a reading group that's nominally about philosophy of physics but has turned into a standing argument about whether string theory and the multiverse get to count as science, and we keep going round in circles. I'm the one whose always bringing up falsifiability, and every single time, someone -- usually the guy doing his PhD on the string landscape -- says 'well, absence of evidence isn't evidence of absence' and leans back like the matter is closed. Last week he used it twice in ten minutes against two different points and I only realised afterwards that it can't have been doing the same work in both. First time was against me saying that a lot of the versions people got excited about were supposed to produce new particles within the LHC's reach and nothing has shown up. Second time was against someone else saying that a theory which never rules anything out isn't earning its keep as a scientific theory. I don't think the slogan is simply false, I think there are several quite different claims hiding inside that one sentence, and that the one he needs is probably not the one that's true.

  So can you take it apart for me? I want the distinct precise things that sentence could be asserting, laid out as a menu rather than one explanation, going from the completely trivial logical point up to the strong probabilistic and normative versions. For each one I want: exactly what it commits you to, whether it's a platitude, a genuinely substantive and defensible claim, or false as stated, and whether that particular reading is one that would actually get him his conclusion. My suspicion is that the version that's actually correct comes with a condition attached (something about likelihoods -- whether the thing is more likely to be missing under the theory than under its rivals), and I want that spelled out properly, including the awkward case of a theory that makes no distinctive prediction at all and whether it even has the kind of likelihood you'd need to run that test. Also flag where the slogan is being used as a thought-stopper rather than as a premise. Don't hedge everything into mush, I want verdicts I can quote back at him.

  Give it to me as a JSON object I can paste into our group chat, with exactly these fields: "slogan" (the sentence under discussion, as we say it); "readings" (an array, one entry per distinct reading, each with "label" -- a short name for the reading; "precise_claim" -- one or two sentences stating it exactly; "kind" -- one of logical, probabilistic, epistemic, dialectical/normative; "status" -- one of trivially true, substantive and defensible, false as stated, true only with a stated qualification; "why" -- two or three sentences of justification; and "gets_him_his_conclusion" -- yes, no, or only with whatever extra premise); "the_correct_version" (an object with "statement" and "condition", the actual principle with its condition made explicit); "theory_with_no_distinctive_prediction" (a paragraph on whether such a theory has a likelihood and what that does to his move); "applied_to_his_two_uses" (an array of exactly two entries, each with "use", "reading_that_fits", and "verdict"); "most_likely_what_he_means" (the reading he's probably running, and whether he'd accept it if it were spelled out); and "bottom_line" (one sentence I can say out loud).
reasoning: |-
  We are dealing with the slogan: "Absence of evidence isn't evidence of absence."
   We want to break this down into several distinct readings, each analyzed.

   Let's outline the readings:

   1. Logical reading: In formal logic, if we have no evidence for a proposition, it does not logically entail that the proposition is false. 
      - This is trivially true, but very weak.

   2. Probabilistic reading (naive): The absence of evidence does not change the probability of the proposition being false.
      - This is false in general because, by Bayesian updating, absence of evidence can lower the probability (if the evidence was expected).

   3. Probabilistic reading (with condition): Absence of evidence is not evidence of absence, unless the evidence was expected under the hypothesis. 
      - This is more nuanced and defensible.

   4. Epistemic reading: We cannot conclude that a hypothesis is false just because we haven't found evidence for it. 
      - This is often true but not absolute (depends on how hard we looked).

   5. Dialectical/Normative reading: It is a fallacy to argue that because we haven't found evidence for X, X must be false. 
      - This is true as a normative rule in argument.

   However, note that the slogan is often used to block criticism of theories that don't make clear predictions. We need to be precise.

   We'll structure the readings as:

    1. Logical Necessity:
        precise_claim: The fact that we have not observed evidence for a proposition P does not, by itself, logically entail that P is false.
        kind: logical
        status: trivially true
        why: Logic only deals with entailment. Without additional premises about how evidence relates to truth, non-observation does not entail falsity.
        gets_him_his_conclusion: Only in the trivial sense that the theory hasn't been proven false by contradiction. But it doesn't help in justifying the theory as scientific.

    2. Naive Probabilistic:
        precise_claim: The absence of evidence for a hypothesis H does not change the probability that H is false.
        kind: probabilistic
        status: false as stated
        why: By Bayes' theorem, if H predicts evidence E with high probability, then failing to observe E should lower the probability of H. This is especially true if the evidence was expected under H and we have looked thoroughly.
        gets_him_his_conclusion: No, because if the theory predicted evidence and we didn't find it, then the absence of evidence is evidence of absence (falsification).

    3. Conditional Probabilistic (Defensible):
        precise_claim: Absence of evidence is not evidence of absence unless the evidence was more likely to be found if the hypothesis were true than if it were false.
        kind: probabilistic
        status: true only with a stated qualification
        why: The impact of non-observation depends on the likelihood ratio. If the probability of not observing E given H is about the same as the probability of not observing E given not H, then non-observation doesn't change much. But if H predicts E with high probability and not H predicts E with low probability, then not observing E strongly disconfirms H.
        gets_him_his_conclusion: Only if the condition (that the evidence wasn't more likely under H than under alternatives) holds. But in the case of string theory predictions at LHC, we would expect the evidence under string theory and not under alternatives? So condition fails.

    4. Epistemic Caution:
        precise_claim: We should not treat the absence of evidence as conclusive proof of absence because there might be undiscovered evidence or limitations in our methods.
        kind: epistemic
        status: substantive and defensible
        why: In practice, absence of evidence might be due to insufficient search or sensitivity. This is a caution against premature rejection.
        gets_him_his_conclusion: Yes, but only as a caution against concluding the theory is false. It doesn't support the theory's validity.

    5. Dialectical Rule:
        precise_claim: In argument, it is fallacious to claim that a hypothesis is false solely because no evidence for it has been found.
        kind: dialectical/normative
        status: substantive and defensible
        why: This is a standard point in critical thinking: the argument from ignorance (ad ignorantiam) is a fallacy. However, it can be reasonable if we have searched thoroughly and the hypothesis predicted the evidence.
        gets_him_his_conclusion: Yes, in the sense that he can dismiss a particular argument. But note: the burden of proof lies with the one making the positive claim.

   Now, the correct version:

     We can state: Absence of evidence is not evidence of absence, unless the evidence was expected to be present if the hypothesis were true and absent if the hypothesis were false.

     More precisely: The absence of evidence E is evidence of the absence of H only if the probability of not observing E is higher under not H than under H (i.e., P(not E | H) < P(not E | not H)). This is equivalent to saying that the absence of evidence is evidence of absence when the presence of evidence would have been evidence for H (via the likelihood ratio).

     So:
        statement: "Absence of evidence is evidence of absence only if the evidence was more likely to be observed if the hypothesis were true than if it were false."
        condition: The likelihood ratio P(E|H) / P(E|~H) is high, meaning that E is more likely under H. Then, not observing E would be evidence against H (relative to ~H).

     Note: We can also express it in terms of the expectedness of the evidence.

   Now, for a theory that makes no distinctive prediction:

     If a theory T makes no distinctive prediction (i.e., for all possible evidence E, P(E|T) is about the same as P(E|not T)), then the absence of any particular E does not count against T. But note, such a theory is unfalsifiable and therefore not scientific (by Popperian standards). It cannot be tested because no evidence can distinguish it from its rivals. In that case, the absence of evidence is indeed not evidence of absence, but that's because the theory is not doing any work. It doesn't predict anything, so we can't test it.

     This is a problem for string theory/multiverse if they are set up to accommodate any observation. They become immune to evidence, which is a reason to question their scientific status.

   Applied to his two uses:

     Use 1: Against LHC non-detection.
        - Reading that fits: He's using the slogan to say that just because we didn't see the particles, it doesn't mean string theory is false. 
        - But which reading? He's probably using the naive probabilistic or the epistemic caution. However, in the conditional probabilistic reading, if string theory predicted these particles with high probability (and rivals didn't), then the absence is evidence against. So the correct verdict is that the slogan does not apply here because the condition is not met (if indeed the particles were predicted). Therefore, the absence of evidence (of the particles) is evidence of absence (of the particular string theory model that predicted them).

     Use 2: Against the charge that a theory which never rules anything out isn't scientific.
        - Here, the charge is that if a theory doesn't make falsifiable predictions, it's not scientific. He uses the slogan to say that even if we haven't ruled it out, that doesn't mean it's false (or not scientific?).
        - But note: the issue is not about the truth of the theory but about its scientific status. The slogan is about evidence of absence (falsity) but the charge is about the theory being unscientific because it doesn't take risks. The slogan might be misapplied. The correct reading here might be the dialectical one: it's fallacious to say the theory is false because we haven't found evidence. But the charge is not about truth but about methodology. The verdict: the slogan doesn't address the charge. The theory might still be true, but if it doesn't rule anything out, it's not scientific because it doesn't make testable predictions.

     So for use 1:
          use: "against LHC non-detection"
          reading_that_fits: Probably the naive probabilistic or epistemic caution. But the correct reading for the context is conditional probabilistic, and the condition fails if the particles were expected.
          verdict: The absence of evidence is evidence of absence for the specific string theory models that predicted the particles, because the evidence was expected under those models and not under alternatives. So the slogan does not apply.

     For use 2:
          use: "against the charge that a theory which never rules anything out isn't scientific"
          reading_that_fits: He might be using the logical or dialectical reading to say that we can't conclude the theory is false. But the charge is not about the truth of the theory but about its status as science. The slogan is about evidence of absence (falsity), not about the methodological status. So the verdict: The slogan is irrelevant to the charge. The charge is that the theory is not scientific because it doesn't make falsifiable predictions, and the slogan doesn't address that.

   Most likely what he means:

     He's probably running the naive probabilistic or the epistemic caution reading. He might not accept the conditional probabilistic reading because it would undermine his defense of string theory in the LHC case. If spelled out, he might reject the condition or argue that string theory doesn't really make such strong predictions (which would then make it untestable).

   Bottom line:

     One sentence to say: "Absence of evidence is evidence of absence when the evidence was expected under the theory but missing, and without that condition, the slogan is either trivial or false; moreover, for a theory that never rules anything out, the absence of evidence is not evidence of absence but that's because the theory is unfalsifiable and thus unscientific."

   Now, we structure as JSON.
