prompt: |-
  I have just come out of a long argument with a friend about how a rational agent should revise her degrees of belief when the new information arrives in conditional form—if A then B—rather than as an outright proposition. Before we continue, I want the specification: what must any adequate theory of updating on conditional information be able to do? Give me the desiderata, each with the case or consideration behind it. It should handle the Judy Benjamin problem and say what makes that case difficult; reduce to ordinary conditionalization when the input is a proposition; be invariant under equivalent reformulations of the conditional and of the partition; say what happens when the antecedent is initially assigned probability zero; allow sequential updating without order effects; and respect the distinction between learning a conditional and learning that a conditional has a certain probability. Mark which of these are genuine requirements and which are stipulations of a particular camp, and tell me whether any subset cannot be jointly satisfied. Then, briefly, how the main families of response—minimizing relative entropy under a constraint on the conditional probability, imaging, and the suppositional or Ramsey-style approach—fare against the list.
reasoning: |-
  We are discussing how a rational agent should update her degrees of belief when the new information is a conditional "If A then B". The problem is that standard Bayesian conditionalization applies when we learn a proposition, but a conditional is not a proposition in the same way. We need to specify desiderata for any adequate theory of updating on conditional information.

  Desiderata:

  1. **Handle the Judy Benjamin problem** (genuine requirement):  
     This is a classic case (from van Fraassen) where a soldier (Judy Benjamin) is dropped in a territory with two areas: Red and Blue, each divided into Headquarters and Second Company. Initially, she believes she is equally likely to be in any of the four quadrants. Then she is told: "If you are in Red territory, then the probability that you are at Headquarters is 3/4." How should she update her probabilities?  
     The difficulty: The information is not a proposition but a constraint on conditional probabilities. Any theory must provide a unique and reasonable update. The problem is difficult because it seems underdetermined: there are multiple ways to update (e.g., minimizing relative entropy, imaging) that yield different results.

  2. **Reduce to ordinary conditionalization when the input is a proposition** (genuine requirement):  
     If the conditional information we receive is in fact a proposition (e.g., we learn "B" or "A and B"), then the update should reduce to standard conditionalization. For example, if we learn the proposition "B", then we condition on B. Similarly, if we learn "A implies B" as a material conditional (which is a proposition), then we condition on that proposition. However, note that learning a conditional is often not the same as learning the material conditional.

  3. **Invariance under equivalent reformulations of the conditional and of the partition** (genuine requirement):  
     The update should not depend on how we express the same conditional information. For example, "if A then B" is equivalent to "if not-B then not-A" (contraposition) in classical logic, and the update should be the same. Also, if we change the partition (e.g., from {A, not-A} to a finer partition) in a way that doesn't change the meaning, the update should be invariant. This is a form of logical consistency.

  4. **Handle the case when the antecedent is initially assigned probability zero** (genuine requirement):  
     If the antecedent A has probability zero, then the conditional probability P(B|A) is undefined. How should the update proceed? Some theories (like imaging) can handle this by shifting probability to the closest worlds where A is true. Others might leave the posterior undefined? We need a defined update even in this case.

  5. **Allow sequential updating without order effects** (stipulation of a particular camp, but often considered desirable):  
     Some theories (like standard conditionalization) are commutative: the order of learning does not matter. However, for conditional information, it is not clear that order should not matter. This might be a stipulation of the Bayesian camp that wants updating to be path-independent. But note that in some contexts (like learning multiple conditionals) order might matter. So this is not an absolute requirement for all camps.

  6. **Respect the distinction between learning a conditional and learning that a conditional has a certain probability** (genuine requirement):  
     When we learn "if A then B", we are not learning that the conditional probability is 1 (which would be a constraint on the current probability function). Instead, we are learning the conditional as a piece of information that should affect our beliefs. Also, note that we might learn that the conditional probability is some value r (without learning the conditional as a fact). These are different and should be treated differently.

  Now, note that not all of these can be jointly satisfied in all cases. For example, the Judy Benjamin problem has shown that some natural methods (like Jeffrey conditionalization) do not apply directly, and different methods (minimizing relative entropy vs. imaging) give different answers. Also, invariance under reformulation might conflict with other desiderata in some cases.

  Main families of response:

  a) **Minimizing relative entropy (MRE) under a constraint on the conditional probability**:  
     This method (also known as the Kullback-Leibler divergence minimization) updates by finding the probability distribution that is closest to the prior (in terms of relative entropy) and satisfies the constraint that P(B|A) = r (for the learned conditional).  
     - Judy Benjamin: This method gives a specific answer (the "geometric" or "symmetry" solution) that some find reasonable.  
     - Reduces to conditionalization: If the input is a proposition, then the constraint is that the probability of that proposition is 1, and MRE reduces to conditioning on that proposition.  
     - Invariance: It is invariant under equivalent reformulations of the constraint? Not necessarily. For example, the constraint P(B|A)=r is not the same as P(not-A|not-B)=? (via contraposition) because the constraint on conditional probabilities is not symmetric. So it may violate the contrapositive invariance.  
     - Antecedent probability zero: If P(A)=0 initially, then setting P(B|A)=r is a constraint that can be satisfied by shifting probability to A-worlds appropriately? MRE might run into problems because the conditional probability is undefined in the prior.  
     - Sequential updating: MRE is not in general commutative.  
     - Distinction: It respects the distinction because we are imposing a constraint on the conditional probability, not conditioning on a proposition.

  b) **Imaging**:  
     This method (due to Lewis) shifts the probability from each world to the closest world where the antecedent is true (if the conditional is "if A then B"). Then the new probability of B is the shifted probability. But note: we are updating the entire distribution.  
     - Judy Benjamin: Imaging gives a different answer than MRE. It might be less appropriate in this case because it doesn't use the probabilistic constraint.  
     - Reduces to conditionalization: Only when the input is a proposition? Not exactly. If we condition on a proposition, we set the probability of the negation to zero. Imaging for a proposition A would shift each world to the closest A-world, which is not the same as conditioning on A (unless all worlds are equally close).  
     - Invariance: Imaging depends on a notion of closeness (similarity). The same conditional expressed differently (e.g., contrapositive) might not yield the same update because the closeness relation might not be symmetric.  
     - Antecedent probability zero: Imaging handles it naturally by shifting probability to A-worlds.  
     - Sequential updating: Order effects are possible because the closeness relation might change?  
     - Distinction: It does not respect the distinction well because it does not directly represent the conditional as a constraint on the conditional probability. Instead, it is a form of "conditional assertion".

  c) **Suppositional or Ramsey-style approach**:  
     This approach, based on Ramsey's test, says that to update on "if A then B", we should revise our beliefs by hypothetically supposing A and then adjusting our belief in B accordingly. But how to incorporate this into a global update? One way is to set the new probability of B given A to the specified value (like MRE) but without minimizing entropy? Or by using Adams' rule?  
     - Judy Benjamin: This approach might lead to the same update as MRE because it sets the conditional probability.  
     - Reduces to conditionalization: If we learn a proposition B, then we condition on B. But if we learn "if A then B", we are not conditioning on a proposition.  
     - Invariance: The same issue as MRE: contraposition might not hold.  
     - Antecedent probability zero: If P(A)=0, then we have a problem because we cannot condition on A. Some versions might use Popper functions or conditional probability spaces.  
     - Sequential updating: Not clear.  
     - Distinction: It respects the distinction because we treat the conditional as a rule for belief change under supposition.

  Comparison:

  - MRE does well on Judy Benjamin (according to some), reduces to conditionalization, and respects the distinction. But it may fail invariance under contraposition and have issues with P(A)=0. Also, sequential updating may be order-dependent.
  - Imaging handles P(A)=0 well and is defined, but it does not reduce to conditionalization and may not handle Judy Benjamin in the intended way. It also requires a similarity metric which is not always available.
  - The suppositional approach is intuitive but needs a precise global update rule. It might be implemented as MRE in some cases.

  In summary, there is no consensus on the best method. The desiderata are not all jointly satisfied by any one method. In particular, the Judy Benjamin problem shows that MRE and imaging give different answers, and invariance under contraposition is a challenge.

  Note: Some of the desiderata are genuine requirements (like handling Judy Benjamin, reducing to conditionalization for propositions, invariance, and the distinction) while others (like order invariance) might be more optional. However, the problem of P(A)=0 is also a genuine challenge.

  References: The literature on conditionalization and the Judy Benjamin problem includes van Fraassen (1981), Douven and Romeijn (2011), and others.
answer: |-
  ### Desiderata for Updating on Conditional Information

  Below are the desiderata for any adequate theory of updating degrees of belief when new information arrives in conditional form ("if A then B"). Each is categorized as a **genuine requirement** (essential for rationality) or a **stipulation of a particular camp** (e.g., strict Bayesianism), and includes the motivation or case behind it. I also note conflicts and how families of responses fare.

  ---

  #### **1. Handle the Judy Benjamin Problem**  
  - **Type**: Genuine requirement.  
  - **Case/Consideration**: Judy Benjamin is dropped into a territory divided into four equally likely quadrants: Red HQ (RH), Red 2nd (R2), Blue HQ (BH), Blue 2nd (B2). She learns: "If you are in Red territory, then the probability you are at HQ is 3/4" (i.e., P(HQ | Red) = 3/4). The challenge is to update her prior (P(RH) = P(R2) = P(BH) = P(B2) = 1/4) to a posterior that respects this constraint.  
  - **Why difficult**: The conditional information does not specify how probabilities should shift *within* the non-Red (Blue) region or how to balance uncertainty between Red and Blue. Theories must resolve underdetermination without ad hoc assumptions.  
  - **Failure Consequence**: Inability to handle real-world cases where information is probabilistic and conditional (e.g., medical diagnostics: "If a patient has symptom X, the probability of disease Y is 90%").

  #### **2. Reduce to Ordinary Conditionalization for Propositional Input**  
  - **Type**: Genuine requirement.  
  - **Case/Consideration**: When the input is an outright proposition (e.g., "B" or "A ∧ B"), the update must reduce to standard Bayesian conditionalization: P_new(·) = P_old(· | E).  
  - **Motivation**: Preserves consistency with foundational Bayesian principles. If the conditional "if A then B" is learned as a material conditional (A ⊃ B), updating should match P_old(· | A ⊃ B).  
  - **Example**: Learning "B" outright should not differ from learning "if ⊤ then B" (where ⊤ is a tautology).

  #### **3. Invariance Under Equivalent Reformulations**  
  - **Type**: Genuine requirement.  
  - **Case/Consideration**:  
    - **Conditional reformulation**: Updating on "if A then B" should yield the same result as updating on its contrapositive "if ¬B then ¬A" or its disjunctive form "¬A ∨ B".  
    - **Partition reformulation**: The update should be unaffected by refining or coarsening partitions (e.g., splitting "¬A" into subcases) if the information is equivalent.  
  - **Motivation**: Rationality demands logical consistency; outcomes should not depend on arbitrary syntactic choices.  
  - **Failure Consequence**: Updating on "if A then B" could produce different beliefs than updating on "if ¬B then ¬A", violating intuition and logic.

  #### **4. Handle Probability-Zero Antecedents**  
  - **Type**: Genuine requirement.  
  - **Case/Consideration**: If P_old(A) = 0, the conditional probability P_old(B | A) is undefined. A theory must still specify a non-arbitrary update (e.g., for counterfactuals or new hypotheses).  
  - **Motivation**: Agents often encounter novel scenarios (e.g., "if aliens exist (P=0), then they are carbon-based"). Ignoring this case limits applicability.  
  - **Failure Consequence**: Theory is incomplete for realistic learning.

  #### **5. Allow Sequential Updating Without Order Effects**  
  - **Type**: Stipulation of a particular camp (strict Bayesians).  
  - **Case/Consideration**: If information arrives sequentially (e.g., first "if A then B", then "C"), the final belief state should not depend on order.  
  - **Motivation**: Path independence aligns with commutativity in standard conditionalization and avoids Dutch books.  
  - **Counterargument**: Order effects may be rational when learning conditionals (e.g., context-dependent interpretations).  
  - **Conflict**: May clash with other desiderata (e.g., in Judy Benjamin, some methods violate commutativity).

  #### **6. Respect Learning a Conditional vs. Learning Its Probability**  
  - **Type**: Genuine requirement.  
  - **Case/Consideration**:  
    - **Learning a conditional**: Treating "if A then B" as a direct constraint (e.g., setting P_new(B | A) = 1).  
    - **Learning its probability**: Learning "P(B | A) = r" as evidence about the current world (e.g., via Jeffrey conditionalization).  
  - **Motivation**: The two are epistemically distinct. Learning a conditional (e.g., a rule) may not imply certainty, while learning its probability is empirical data.  
  - **Example**: Being told "if it rains, the match is canceled" (rule) vs. "the probability that the match is canceled if it rains is 0.9" (statistical report).  
  - **Failure Consequence**: Conflating rules with evidence leads to misguided updates.

  ---

  ### **Conflicts and Joint Satisfiability**  
  - **Incompatible Pair**: **Invariance** (3) and **handling probability-zero antecedents** (4) conflict with **order independence** (5) in some cases.  
    - *Why*: For P(A)=0, imaging (see below) violates order independence, while MRE may violate invariance under contraposition.  
  - **Judy Benjamin Conflict**: MRE satisfies (1) but violates (3) for contraposition; imaging satisfies (4) but fails (1).  
  - **No Single Solution**: No theory satisfies all desiderata simultaneously. Trade-offs are unavoidable (e.g., between invariance and generality for P(A)=0).

  ---

  ### **How Major Theories Fare**  
  #### **1. Minimizing Relative Entropy (MRE) / Kullback-Leibler Divergence**  
     - **Core Idea**: Find P_new closest to P_old (in divergence) satisfying constraints (e.g., P_new(B | A) = r).  
     - **Judy Benjamin**: Provides a unique solution (van Fraassen's "geometric" update: P(RH)=0.5, P(R2)=1/6, P(BH)=P(B2)=1/6).  
     - **Pros**:  
       - Reduces to conditionalization for propositions (2).  
       - Handles probabilistic inputs (6).  
     - **Cons**:  
       - Violates **invariance** (3): Contrapositive "if ¬B then ¬A" may yield different updates.  
       - Struggles with **P(A)=0** (4): Constraint P(B|A)=r is undefined; requires workarounds.  
       - **Order effects** (5): Sequential updates may not commute.

  #### **2. Imaging**  
     - **Core Idea**: Shift probability from ¬A-worlds to the "closest" A-worlds, then update on B in those worlds.  
     - **Judy Benjamin**: Depends on similarity metric (e.g., if "closest" is symmetric, P(RH)=3/4, P(R2)=1/4, P(BH)=P(B2)=0). Controversial for violating the input's probabilistic nature.  
     - **Pros**:  
       - Handles **P(A)=0** (4) naturally (shifting probability).  
       - Reduces to conditionalization for propositions if similarity is trivial (2).  
     - **Cons**:  
       - Fails **Judy Benjamin** (1): Does not respect the constraint as probabilistic.  
       - Violates **invariance** (3): Contrapositive and disjunctive forms diverge.  
       - **Order effects** (5): Similarity metrics may cause path dependence.  
       - Blurs **learning vs. probability** (6): Treats conditionals as "shifts," not constraints.

  #### **3. Suppositional (Ramsey-Style) Approach**  
     - **Core Idea**: Adopt P_new(B | A) = r (via Jeffrey-like updates on the partition A/¬A).  
     - **Judy Benjamin**: Satisfies the constraint (P_new(HQ | Red) = 3/4) but underdetermines non-Red probabilities. Often defaults to MRE.  
     - **Pros**:  
       - Honors **distinction** (6): Learning a conditional directly sets P(B|A).  
       - Reduces to conditionalization for r=1 (2).  
     - **Cons**:  
       - Struggles with **P(A)=0** (4): Requires extending conditional probability.  
       - **Invariance** (3): Contrapositive may not hold (P(¬A | ¬B) ≠ r).  
       - **Order effects** (5): Possible in sequential updates.

  ---

  ### **Summary of Trade-offs**  
  | **Theory**               | **Judy Benjamin (1)** | **Reduction (2)** | **Invariance (3)** | **P(A)=0 (4)** | **Order Effects (5)** | **Distinction (6)** |  
  |---------------------------|------------------------|-------------------|--------------------|----------------|-----------------------|---------------------|  
  | **MRE**                   | ✓                      | ✓                 | ✗ (contraposition) | △ (workarounds)| ✗                     | ✓                   |  
  | **Imaging**               | ✗ (metric-dependent)  | △ (if trivial)    | ✗                  | ✓             | ✗                     | △ (blurs)           |  
  | **Suppositional**         | △ (underdetermined)   | △ (for r=1)       | ✗                  | △             | △                     | ✓                   |  

  - **✓**: Strong satisfaction.  
  - **△**: Partial or context-dependent satisfaction.  
  - **✗**: Failure or major limitations.  

  No theory dominates; choice depends on prioritization (e.g., MRE for Judy Benjamin, imaging for P(A)=0). The desiderata reveal that updating on conditionals is fundamentally more complex than propositional learning, requiring extensions beyond standard Bayesianism.
