  First, I need to unpack what's being asked. The user is clearly well-versed in the literature - they're throwing around terms like beta-delta discounting and Davidsonian akrasia without breaking stride. This isn't a beginner's request. They're frustrated with superficial discussions and want to force depth by making both sides articulate their positions rigorously. 

  The core tension seems to be between descriptive and normative approaches. The discounting camp explains behavior through time-inconsistent preferences, while the akrasia camp cares about the phenomenology of acting against one's own judgment. The user's guessed cruxes (preference reversal rationality, sophisticated agents, multiple selves) are spot-on - these are exactly where the philosophical rubber meets the empirical road.

  For the joint statement, I'll need to:
  - Find genuine common ground in (1) without fudging differences
  - Present disagreements in (2) using each side's own language (e.g., letting the akrasia camp call discounting "reductive")
  - Design (4) with testable cases where predictions diverge (like whether a sophisticated agent feels conflict)

  The verbal dispute point is crucial. When the discounting side says "preference" and the akrasia side says "judgment", they're often talking past each other. I should flag that explicitly rather than pretending it's resolved.

  Hmm... the user wants British English. That means "judgement" with the extra 'e', "prioritise" with 's' not 'z', and phrases like "beside the point" rather than "besides the point". Minor but important for their context.

  Most challenging bit will be table 2 - making sure each side would actually endorse their column's wording. For instance, the akrasia camp would reject "preference change" as misdescribing the phenomenon, while the discounting camp would see "better judgment" as question-begging. Need to preserve that edge.
answer: |-
  Right then, here's the adversarial collaboration statement drafted for your two camps, preserving the friction while finding common ground. Written as requested, with British English spelling and phrasing.

  **Joint Statement on Weakness of Will & Akrasia: Adversarial Collaboration Framework**

  **Camp A (Hyperbolic Discounting/Present Bias):** Focuses on modelling observed, often time-inconsistent, choice behaviour using formal tools like quasi-hyperbolic (β-δ) discounting. Key concepts include preference reversals, sophistication/naivety, and commitment devices. Sees "weakness of will" as primarily descriptive of these behavioural patterns.
  **Camp B (Aristotelian/Davidsonian Akrasia):** Focuses on the normative phenomenology of action: an agent judging X best *at the moment of action* but intentionally doing Y instead, contrary to that judgement. Sees discounting models as potentially useful for *some* empirical patterns but conceptually inadequate to capture the core of akrasia as a failure of practical reason.

  **1. Claims Both Camps Accept:**

  1.  **Phenomenon Existence:** There exists a robust set of human behaviours commonly labelled "weakness of will" or "akrasia", including procrastination, failing diets, impulsive spending, and addictive behaviour relapse, despite prior resolutions.
  2.  **Preference Reversal Evidence:** Empirical studies (e.g., choice-then-pay, reward delay tasks) reliably demonstrate that individuals often exhibit dynamically inconsistent preferences. Choices made for the immediate future frequently reverse when the same choice becomes immediate (e.g., choosing fruit over cake for *tomorrow*, but cake over fruit when offered *now*).
  3.  **Cross-Species Parallels:** Similar patterns of preference reversal under temporal delay are observed in non-human animals (e.g., pigeons, rats), suggesting deep biological roots for time-inconsistent decision-making mechanisms.
  4.  **Commitment Device Utility:** Both camps agree that commitment devices (e.g., Ulysses contracts, savings accounts with penalties, locking away temptations) are empirically effective strategies people use (and sophisticated agents in models seek) to overcome predicted future failures to stick to prior plans. Camp B grants these *work* to change *behaviour*; Camp A grants their existence demonstrates foreseen conflict.
  5.  **Sophistication vs. Naivety Distinction:** Both accept the empirical and theoretical distinction between agents who correctly predict their own future time-inconsistency ("sophisticates") and those who do not ("naifs"), and that this distinction has behavioural consequences (e.g., sophisticates may seek commitment or pre-emptively give up).
  6.  **Camp A Grant:** Camp A grants that the *phenomenological experience* reported by humans in akratic episodes often involves a conscious sense of acting against one's own "better judgement" at the moment of action, which their models do not directly capture or represent.
  7.  **Camp B Grant:** Camp B grants that hyperbolic discounting models provide a powerful, empirically validated framework for predicting and explaining a wide range of time-inconsistent *behavioural choices* and the effectiveness of certain classes of interventions (like commitment devices).

  **2. Residual Disagreements (Phrased in Each Camp's Own Terms):**

  | Disagreement Point                                                                 | Camp A (Discounting) Perspective                                                                                                 | Camp B (Akrasia) Perspective                                                                                                                               |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Explanation**                                                               | Weakness of will arises from dynamically inconsistent preferences driven by present-biased discounting.                         | Weakness of will (akrasia) arises from a failure of practical reason: acting contrary to one's own contemporaneous judgement of what is best.               |
  | **Status of "Better Judgement"**                                                   | What is called "better judgement" is simply a stable preference held at a non-immediate time-point; it has no special authority. | The "better judgement" represents the agent's synchronic, all-things-considered evaluative assessment *at t*; it has normative force distinct from mere wanting. |
  | **Irrationality of Preference Reversal**                                           | Preference reversal itself is not necessarily irrational; it reflects the agent's genuine preferences at different times.        | Acting against one's own contemporaneous better judgement *is* intrinsically irrational, irrespective of prior or future preferences.                       |
  | **Scope of the Discounting Model**                                                 | Our model accurately describes and predicts the key behavioural phenomena associated with weakness of will.                      | Discounting models are behaviourally useful but conceptually silent on (and potentially distort) the core normative structure of akratic action.            |
  | **"Self" in Weakness of Will**                                                     | The agent is a sequence of time-slices with potentially conflicting preferences; "weakness" describes the later slice's choice. | The agent is a single, temporally extended entity; weakness of will is a failure *of that agent* at time *t* to act on its own reason.                      |
  | **Can Sophisticates be Akratic?**                                                  | A sophisticated agent foresees their future bias; choosing not to commit is a consistent preference, not akrasia.                | A sophisticated agent who foresees bias but still *at t* acts against their *t*-judgement of what's best *at t* can still be akratic.                      |

  **3. Cruxes & Testing Proposals:**

  1.  **Crux: Is Preference Reversal Synchronic Irrationality?**
      *   **Issue:** Is flipping from choosing salad (for lunch tomorrow) to choosing cake (when lunch is now) at time *t* an instance of irrationality *at t*, or merely a change in the agent's genuine preferences?
      *   **Concrete Case:** **Real-Time Choice Justification:** Present subjects with sequential choices (e.g., healthy/unhealthy snack for immediate consumption vs. delayed). Immediately *after* their choice at *t* (especially when it reverses a prior stated preference), ask them to justify it and rate their satisfaction/regret. Repeat under time pressure and without.
      *   **Camp A Prediction:** Subjects will predominantly justify their *t*-choice as genuinely preferred *at t* ("I just fancied cake more right then"). Regret ratings may be low or reflect changed circumstances.
      *   **Camp B Prediction:** Subjects experiencing akrasia will frequently express regret, offer justifications revealing they knew the choice was worse *by their own lights at t* ("I knew I shouldn't, but..."), and report lower immediate satisfaction.

  2.  **Crux: Can Sophisticated Agents Exhibit Akrasia?**
      *   **Issue:** If an agent knows they are biased, does this awareness negate the possibility of them acting against a genuine "better judgement" *at the moment of action*?
      *   **Concrete Case:** **The Sophisticate's Dilemma:** Design a task where sophisticates correctly predict their future bias for an immediate reward (Task A) over a larger delayed one. Then, introduce a novel, immediate temptation *at t* (Task B) that conflicts with a *simultaneously held*, non-time-biased goal relevant *only at t* (e.g., maintaining a specific cognitive state for a concurrent, non-delayed task). Can they override the immediate temptation for Task B based on the *t*-relevant goal?
      *   **Camp A Prediction:** The sophisticate's choice will be determined by the strength of the present bias for Task B vs. the value of the *t*-relevant goal. Choosing Task B is consistent with their preferences *at t*, even if it harms the concurrent goal. No akrasia occurs.
      *   **Camp B Prediction:** If the agent sincerely judges pursuing the *t*-relevant goal best *at t* (verified by concurrent reporting), yet intentionally chooses the tempting Task B, this constitutes akrasia *at t*, irrespective of their prior sophistication about time bias. Sophistication about future bias doesn't preclude synchronic failure.

  3.  **Crux: The Multiple Selves Problem – Who is Weak?**
      *   **Issue:** If the agent is modelled as multiple time-slices, which slice is exhibiting weakness of will, and against whose standard?
      *   **Concrete Case:** **Narrative Attribution:** Present subjects (or philosophers/psychologists) with detailed vignettes clearly framed through both lenses (e.g., a dieter plans salad, encounters cake at a party, eats cake). Explicitly ask: "At the moment they ate the cake, was the person exhibiting weakness of will? If so, *who* (which 'self' or part) was weak, and *what standard* were they weak against?" Analyse responses for consistency with each model's ontology.
      *   **Camp A Prediction:** Attributions will focus on the "present self" giving in to immediate temptation, seen as weak *relative to the prior self's plan*. The standard is the prior preference/plan.
      *   **Camp B Prediction:** Attributions will focus on the whole person failing to act on their *contemporaneous* judgement *at the party* that they shouldn't eat the cake (even if that judgement aligns with the prior plan). The standard is the synchronic judgement itself.

  **4. Verbal Disputes & Silences:**

  *   **"Judgement" vs. "Preference":** This is central and partly verbal. Camp B uses "judgement" to denote a normative, reason-based evaluative conclusion (akin to Davidson's "all-things-considered judgement"). Camp A uses "preference" descriptively for revealed choice or stated ranking. Camp A holds that Camp B's "judgement" is either reducible to a type of preference or an unhelpful metaphysical addition. Camp B holds that Camp A's "preference" misses the normative dimension essential to akrasia. **The fight is substantive:** it's about whether practical reason involves more than revealed choice rankings.
  *   **"Will":** Camp B often uses "will" to denote the capacity to execute one's better judgement. Camp A typically avoids the term "will" as non-explanatory or uses it simply to mean "choice" or "preference". Camp A is largely silent on the concept of "will" as a distinct faculty.
  *   **Silence of Discounting Models:** The discounting framework is fundamentally silent on:
      *   The *normative authority* or *reason-giving force* of an agent's synchronic evaluative state.
      *   The phenomenology of *inner conflict* experienced *at the moment* of acting against one's judgement.
      *   Explaining *why* acting against one's synchronic judgement *feels* like a failure distinct from mere preference change. It describes the behaviour, not necessarily the first-person experience of irrationality central to Camp B's concern.

  This document provides a clear map: agreed territory, starkly stated disagreements, testable cruxes, and clarity on where the conflict is conceptual/verbal and where the models are simply mute. It forces engagement on the specific points of divergence without requiring either side to abandon their core framework prematurely. Good luck with the reading group!
