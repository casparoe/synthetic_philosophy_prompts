  ### Decision Procedure for Deferring to Future Credence  
  **Use this flowchart on the whiteboard. Answer sequentially. Stop at first conclusive answer.**  

  1. **Is the future credence conditional on an event?**  
     (e.g., "I’ll believe X only if event Y happens")  
     - **YES**:  
       - Set your **current conditional credence** to the future value: \( P_{\text{now}}(A \mid Y) = d \).  
       - **Recalc unconditional credence** using your current beliefs:  
         \[
         P_{\text{now}}(A) = d \cdot P_{\text{now}}(Y) + P_{\text{now}}(A \mid \neg Y) \cdot P_{\text{now}}(\neg Y)
         \]  
       - **Do NOT set \( P_{\text{now}}(A) = d \)**. Stop.  
     - **NO**: Proceed to 2.  

  2. **Will future-you have new evidence?**  
     (e.g., "Tomorrow’s report will reveal new data")  
     - **YES**: **Do NOT defer** (future credence uses information you lack). Stop.  
     - **NO**: Proceed to 3.  

  3. **Will future-you forget relevant information?**  
     (e.g., "They’ll overlook the base rate")  
     - **YES**: **Do NOT defer** (future-you is less informed). Stop.  
     - **NO**: Proceed to 4.  

  4. **Will future-you be in a better cognitive state?**  
     (e.g., "They’ll be well-rested and sharp")  
     - **YES**: **Defer** (set \( P_{\text{now}}(A) = d \)). Stop.  
     - **NO**: Proceed to 5.  

  5. **Will future-you be in a worse cognitive state?**  
     (e.g., "They’ll be fatigued or rushed")  
     - **YES**: **Do NOT defer**. Stop.  
     - **NO**: Proceed to 6.  

  6. **Will future-you do more analysis?**  
     (e.g., "They’ll have time to rethink the model")  
     - **YES**: **Judgment call**:  
       - Trust their reasoning? → **Defer** (\( P_{\text{now}}(A) = d \)).  
       - Suspect overcomplication? → **Do NOT defer**.  
     - **NO**: **Defer** (\( P_{\text{now}}(A) = d \)). Stop.  

  ---

  ### Where Judgment is Required  
  - **Step 6** (if future-you does more analysis).  
  - **Step 1** (if you lack estimates for \( P_{\text{now}}(Y) \) or \( P_{\text{now}}(A \mid \neg Y) \)).  
  - Any step where evidence/cognition is ambiguous (e.g., "some new evidence but trivial").  

  ---

  ### Run the Cases  
  **Case 1:**  
  *Current credence: 60%. Future credence (after quarterly report): 85%.*  
  - Step 1: No conditional event → **Proceed**.  
  - Step 2: Future-you has new evidence (quarterly report) → **Do NOT defer**.  
    **Result: Keep 60%. Do NOT set to 85%.**  

  **Case 2:**  
  *Current credence: 40%. Future credence (if still employed): 70%. Employment requires project success.*  
  - Step 1: **Conditional on employment (Y)**.  
    - Set \( P_{\text{now}}(A \mid Y) = 70\% \).  
    - Recalc unconditional: \( P_{\text{now}}(A) = 70\% \cdot P_{\text{now}}(Y) + P_{\text{now}}(A \mid \neg Y) \cdot P_{\text{now}}(\neg Y) \).  
    **Result: Do NOT set to 70% unconditionally.**  
    *(You won’t like this: You must supply \( P_{\text{now}}(Y) \) [prob. project success] and \( P_{\text{now}}(A \mid \neg Y) \) [prob. A if project fails].)*  

  ---

  ### Key Takeaways  
  - **Defer only when** future-you is better cognitively *or* has identical information/state.  
  - **Never defer** if future-you has new evidence, forgets key facts, or is cognitively impaired.  
  - **Conditional futures** force recalculation—they don’t give unconditional probabilities.  
  - **You’re the expert**: Use judgment when evidence/cognition is mixed or ambiguous.
