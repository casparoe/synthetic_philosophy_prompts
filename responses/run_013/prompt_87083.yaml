prompt: |-
  so I've been reading rat-adjacent stuff for like a decade — the Sequences, all the expected-value discourse, the whole shut up and multiply thing — and through a series of bad decisions I've ended up as the person on the grantmaking team at a small animal welfare foundation who actually has to make calls on invertebrate proposals. We're tiny: four staff, a board, maybe $2M out the door a year, and about a quarter of the portfolio is now invertebrate welfare because two donors got excited about it. The board is split down the middle — half think it's obviously where the expected value is, half think it's a meme and we're lighting money on fire for animals that might be little robots. I keep getting asked in board meetings what our framework is and I keep winging it, which is bad and also getting embarrassing.

  What I want is an actual decision procedure I can run on a proposal, not a philosophy essay. Like: the questions I ask in order, what counts as a sufficient answer to each, where the procedure stops and we decline, where it says fund, and where it hands it to the board because the remaining question is values and not facts. It has to be grounded in the real shape of the scale argument — the move where insects are so numerous that even a tiny probability of sentience multiplied by an astronomical number of individuals swamps the welfare of the vertebrates we're actually confident about — and it has to survive someone in the room saying but what if they're basically tiny robots, so I need the objections built into the procedure rather than bolted on after. Concretely it needs to handle: the probability-of-sentience-per-taxon problem (is a shrimp more likely to matter than a black soldier fly larva, and what do I do when the evidence is thin for both?), the difference between number of individuals and amount of morally relevant experience (a billion larvae living two weeks versus a million chickens living two years), uncertainty about intensity and duration, the tractability side (welfare per dollar, and whether welfare per dollar is even the right denominator when the numerator is this speculative), and the failure mode where we fund speculative invertebrate work and crowd out a boring, well-evidenced vertebrate program — that last one is the skeptical half of the board's whole argument and I don't have a good answer to it yet.

  Constraints: decisions happen quarterly, I get about two weeks of staff time per cycle, anything over $250k needs board sign-off, and the person running the procedure will be me, not a philosopher. Then run the finished procedure on three real-ish proposals so I can see it bite: (1) funding development of an electrical stunning device for farmed shrimp, where the crustacean evidence is thin but not nothing and the supply chain is huge; (2) funding research on humane slaughter methods for black soldier fly larvae reared for animal feed, where the numbers are absurd and the sentience evidence is thinner still; and (3) a pilot on reducing insecticide use in agriculture for the sake of wild insects, where the numbers are the biggest of all but the intervention is diffuse and basically unmeasurable. I want one of those to come out decline even though I personally want it funded, and I want you to be upfront about what the procedure can't settle and where it's just me dressing up a gut call as a flowchart. Don't give me citations or a reading list, I can't use those in a board memo, I just want the logic and the steps. American English please.
reasoning: |-
  Okay, the user has been involved in rationalist and effective altruism communities for about a decade, referencing concepts like the Sequences and expected value. They're now working at a small animal welfare foundation where they handle invertebrate welfare grant proposals. The board is split: half see high expected value due to scale, half think it's wasteful. The user needs a practical decision procedure to evaluate proposals systematically, not philosophical debates.

  They need a step-by-step framework that addresses key issues: probability of sentience per taxon, comparing numbers vs. duration of life, uncertainty about welfare intensity, tractability per dollar, and opportunity costs (crowding out vertebrate programs). The procedure must have clear questions with thresholds for proceeding, declining, or escalating to the board. It should embed common objections like "they might be robots" into the steps.

  Constraints include quarterly decisions, limited staff time (two weeks per cycle), board approval for grants over $250k, and it needs to be executable by a non-philosopher. The user wants three example proposals run through the framework, with one declining despite their personal preference to demonstrate objectivity.

  Deep needs analysis: The user is embarrassed about winging it in board meetings and needs credibility. They want to depersonalize debates by using a structured method. The unspoken tension is balancing rationalist principles (scale arguments) with practical foundation management (donor preferences, board politics). They likely need the framework to function as both decision tool and communication shield.

  For the framework design: It must start by forcing quantification of sentience probability—the core uncertainty. Then translate that into "moral weight" adjusted by lifespan. Tractability assessment must include measurable impact pathways to counter "diffuse intervention" critiques. The crowding-out concern needs explicit comparison against vertebrate alternatives.

  Example proposal handling: The insecticide reduction pilot (Proposal 3) should decline to show rigor—its diffuseness fails tractability. The shrimp stunning device (1) might pass but require board review at high costs. BSF larvae slaughter (2) could fail on sentience evidence unless scale compensates. Crucially, the procedure must flag where judgment calls occur (e.g., assigning sentience probabilities) so the user doesn't overclaim objectivity.

  Implementation realism: With two weeks per cycle, steps must be spreadsheet-friendly (e.g., probability scales, impact scores). The framework should output clear "fund/decline/review" outcomes with audit trails for board scrutiny. Escalation to the board should happen when evidence is thin but scale creates deadlock—exposing the values dispute transparently.
answer: |-
  Here's a concrete decision procedure designed for your constraints and the core scale argument. It forces quantification of uncertainty at each step and explicitly handles the "tiny robots" objection by requiring minimum thresholds and demanding strong justification for proceeding under high uncertainty.

  **Invertebrate Welfare Grant Decision Procedure**

  **Core Principles:**
  1.  **Expected Value (EV) Focus:** EV = (Probability of Sentience) x (Moral Weight per Individual) x (Number Affected) x (Tractability of Welfare Gain per Dollar).
  2.  **Explicit Uncertainty:** Quantify uncertainty (Low/Med/High or 1-5 scale) at every key step. Proceed only if Med/High certainty exists *or* the scale is so massive it overwhelms low certainty *and* no better options exist.
  3.  **Opportunity Cost:** Explicitly compare against a baseline vertebrate alternative.
  4.  **Thresholds:** Define minimum acceptable levels for Probability and Tractability.
  5.  **Values vs. Facts:** Flag decisions requiring board input (values, high uncertainty on key facts).

  **Decision Steps:**

  1.  **Initial Filter: Scope & Scale**
      *   **Q1:** Does the proposal target a specific invertebrate taxon/situation? (If No: Decline - too vague for assessment).
      *   **Q2:** What is the estimated *annual* number of individuals impacted *directly* by the intervention? (Estimate: Low <10M, Med 10M-1B, High >1B).
      *   **Threshold:** If Scale = **Low**, **Decline** immediately. (Scale argument fails).
      *   *Output:* Scale Category (Low/Med/High). Proceed if Med/High.

  2.  **Probability of Sentience (P(S)) Assessment**
      *   **Q3:** Assess P(S) for the *specific taxon and context* relevant to the proposal (e.g., pain perception during slaughter). Use a 3-point scale:
          *   **Low (P~0.01-0.1):** Rudimentary nervous system, minimal behavioral evidence for valence/learning related to welfare, strong arguments for reflexive behavior dominating (e.g., basic nociception only). (e.g., BSF larvae, nematodes).
          *   **Medium (P~0.1-0.5):** More complex nervous system (e.g., centralization), credible behavioral evidence for trade-offs, learning avoidance, or context-dependent responses suggesting valence. Significant scientific debate. (e.g., Shrimp, crabs - slaughter context).
          *   **High (P~0.5+):** Strong behavioral and physiological evidence consistent with vertebrate-like pain/affect, complex learning, clear avoidance beyond reflexes. Scientific consensus emerging. (e.g., Octopuses, some evidence for crabs in complex contexts).
      *   **Assign:** P(S) Level (Low/Med/High) + **Certainty** of Assessment (Low/Med/High - based on evidence quality/consensus).
      *   **Threshold:** If P(S) = **Low** AND Certainty = **High**, **Decline**. (They are effectively tiny robots). Proceed if P(S) = Med/High OR (P(S)=Low AND Certainty=Low/Med). *Flag low P(S)/Low Certainty for later scrutiny.*

  3.  **Moral Weight per Individual (MW)**
      *   **Core Concept:** MW = P(S) * Welfare Capacity. Welfare Capacity considers lifespan and potential intensity/depth of experience. A chicken living 2 years likely has more total welfare capacity than a fly larva living 2 weeks, even if P(S) were equal.
      *   **Q4:** Estimate the *average lifespan* of the individual affected by the intervention.
      *   **Q5:** Assign a **Welfare Capacity Factor (WCF)** relative to a baseline vertebrate (e.g., a chicken):
          *   **Very Low (WCF ~0.001-0.01):** Extremely short lifespan (days/weeks), limited behavioral repertoire even if sentient (e.g., BSF larvae).
          *   **Low (WCF ~0.01-0.1):** Short lifespan (weeks/months), some complex behaviors (e.g., adult flies, shrimp?).
          *   **Medium (WCF ~0.1-0.5):** Moderate lifespan (months/years), complex behaviors suggesting richer experiences (e.g., larger crabs, lobsters).
          *   **High (WCF ~0.5+):** Longer lifespan, highly complex behaviors (e.g., octopuses, potentially bees in some contexts).
      *   **Calculate:** MW = P(S) * WCF. (Treat P(S) as 0.1/Low, 0.3/Med, 0.7/High for calculation). *This is inherently fuzzy - focus on relative magnitude.*
      *   **Assign:** Estimated MW Category (Very Low/Low/Med/High) + **Certainty**.
      *   **Threshold:** No hard decline threshold here, but Very Low MW + Low P(S) is a major red flag. Quantify for EV calculation.

  4.  **Tractability & Welfare Gain per Dollar (T)**
      *   **Q6:** **Pathway:** Is the causal pathway from funding → welfare gain clear and direct? (e.g., Fund research → validate humane method → industry adoption → less suffering per individual slaughtered). Certainty?
      *   **Q7:** **Feasibility:** How likely is successful implementation/adoption? (Low/Med/High). Evidence?
      *   **Q8:** **Magnitude:** Estimate the *average welfare gain per individual directly affected* (e.g., reduction in suffering duration/intensity during slaughter). (Negligible/Small/Medium/Large). Certainty?
      *   **Q9:** **Cost-Effectiveness:** Estimate Welfare Gain per Dollar = (Number Affected * MW * Magnitude Gain per Individual) / Cost. (Use categories: Very Low / Low / Medium / High / Very High). *Accept rough estimates.*
      *   **Threshold:** If T = **Very Low** OR Pathway Certainty = **Low**, **Decline**. Proceed if T >= Low AND Pathway Certainty >= Med. *Flag low T/High Uncertainty.*

  5.  **Expected Value Calculation & Comparison**
      *   **Calculate:** Rough EV = Scale Factor * MW * T
          *   Scale Factor: Low=1, Med=10, High=100 (represents orders of magnitude difference)
          *   MW: Very Low=0.01, Low=0.1, Med=0.5, High=1.0
          *   T: Very Low=0.01, Low=0.1, Med=0.5, High=1.0, Very High=5.0
      *   **Output:** Numerical EV Estimate (e.g., Med Scale (10) * Low MW (0.1) * Low T (0.1) = EV 0.1)
      *   **Q10: Opportunity Cost:** What is the estimated EV of the *best vertebrate welfare alternative* you would *likely fund* with this money instead? (Use the same vertebrate baseline for MW). Calculate similarly. (e.g., Fund proven chicken cage-free campaign: High Scale (100) * High MW (1.0) * Med T (0.5) = EV 50).
      *   **Compare:** Invertebrate EV vs. Vertebrate Alternative EV.

  6.  **Decision Thresholds & Escalation**
      *   **Fund:** IF (Invertebrate EV > Vertebrate EV) AND NO major red flags (P(S)=Low AND Certainty=High, T=Very Low, Pathway Certainty=Low) AND Cost <= $250k.
      *   **Decline:** IF Invertebrate EV <= Vertebrate EV OR any hard threshold failed (Steps 1, 2, 4) OR major red flags present.
      *   **Escalate to Board (Values/High Uncertainty):**
          *   IF P(S) = Low AND Certainty = Low/Med (The "Are they robots?" uncertainty is high and critical).
          *   IF MW is Very Low AND Scale is High (The core scale argument hinges on massive numbers compensating for tiny individual weight - a values judgment).
          *   IF Invertebrate EV is close to but slightly below Vertebrate EV (Board must decide if the scale argument justifies the gap).
          *   IF Cost > $250k AND the proposal otherwise passes.
      *   **Flag for Board:** Clearly state the unresolved question (e.g., "Is a 1% chance of sentience in shrimp, given the scale, worth funding over a proven chicken campaign with 5x higher EV?").

  ---

  **Running the Procedure on Proposals:**

  **Proposal 1: Electrical Stunning for Farmed Shrimp**
  1.  **Scale:** Farmed shrimp - Billions/year. **High (100)**.
  2.  **P(S):** Crustacean evidence (nociceptors, opioid response, avoidance learning) for slaughter context. Significant debate, not consensus. **Medium (0.3), Certainty: Medium**.
  3.  **MW:** Lifespan ~1 year? WCF relative to chicken: Likely **Low (0.1)** (shorter life, less complex). MW = 0.3 * 0.1 = **0.03 (Very Low/Near Low)**. Certainty: Medium.
  4.  **T:**
      *   Pathway: Fund dev → test → industry adoption? Adoption in global supply chain is challenging but plausible. **Feasibility: Medium**. **Pathway Certainty: Medium**.
      *   Magnitude: If effective, prevents suffering during slaughter. **Medium** gain per individual? Certainty: Medium (assume device works).
      *   Cost-Effectiveness: High numbers, moderate cost. **T: Medium (0.5)**.
  5.  **EV Calc:** Scale(100) * MW(0.03) * T(0.5) = **EV ~1.5**
  6.  **Opp Cost:** Assume Vertebrate Alt (e.g., cage-free hens) EV ~50 (as above).
  7.  **Analysis:** Invertebrate EV (1.5) << Vertebrate EV (50). However, P(S) isn't Low/Certainty High (so no auto-decline). MW is Very Low. Scale is High.
  8.  **Decision:** **Escalate to Board.** Core issue: Is the combination of High Scale, Medium P(S), and Very Low MW sufficient to justify funding given the large gap vs. vertebrate alternatives? (Board must weigh the scale argument heavily). *If cost >$250k, also escalate for that.*

  **Proposal 2: Humane Slaughter for Black Soldier Fly Larvae (BSFL)**
  1.  **Scale:** Billions reared weekly. **Extreme High (100)**. (Assign >100? Use 150).
  2.  **P(S):** Very simple nervous system. Minimal evidence for pain perception vs. basic nociception/reflexes. Strong "robot" argument. **Low (0.1), Certainty: Medium** (evidence *for* sentience is very weak).
  3.  **MW:** Lifespan as larvae targeted? Days/weeks. Very limited behavioral repertoire. WCF: **Very Low (0.01)**. MW = 0.1 * 0.01 = **0.001 (Very Low)**. Certainty: Medium.
  4.  **T:**
      *   Pathway: Fund research → find method? → industry adoption? Industry motivation for "humane" is currently near zero. **Feasibility: Low, Pathway Certainty: Low**.
      *   Magnitude: If sentient, prevents brief death suffering. **Small?** Certainty: Low (unknown if any suffering occurs).
      *   Cost-Effectiveness: Extreme numbers, but very low MW and low T. **T: Very Low (0.01)**.
  5.  **EV Calc:** Scale(150) * MW(0.001) * T(0.01) = **EV ~0.0015**
  6.  **Opp Cost:** Vertebrate Alt EV ~50.
  7.  **Analysis:** Fails **Step 2 Threshold:** P(S) = Low AND Certainty = Medium. Fails **Step 4 Threshold:** T = Very Low AND Pathway Certainty = Low. EV (0.0015) <<<< Vertebrate EV (50).
  8.  **Decision:** **Decline.** The combination of very low P(S), very low MW, and low tractability fails multiple thresholds. The scale does not overcome these fundamental weaknesses.

  **Proposal 3: Reducing Insecticide Use for Wild Insects**
  1.  **Scale:** Trillions? Quadrillions? of wild insects affected. **Extreme High (200)**.
  2.  **P(S):** Applies to *many* taxa. Some (bees, flies) have Medium P(S) evidence. Many others (ants, beetles, aphids) have Low P(S). Overall average? **Low (0.1), Certainty: Low** (huge variation, poor evidence for most).
  3.  **MW:** Vastly different lifespans/experiences. WCF average likely **Very Low (0.01)**. MW = 0.1 * 0.01 = **0.001 (Very Low)**. Certainty: Low.
  4.  **T:**
      *   Pathway: Fund pilot → reduce insecticide use? → measure reduction? → link reduction to *welfare gain*? → scale? Pathway is **extremely diffuse and indirect**. Measuring *welfare* impact is likely impossible. **Feasibility: Low, Pathway Certainty: Low**.
      *   Magnitude: Reduced suffering from poisoning? Duration? Per individual? **Highly Uncertain, likely Small per individual if any.** Certainty: Low.
      *   Cost-Effectiveness: Scale is massive, but Pathway/Magnitude certainty is terrible and MW is tiny. **T: Very Low (0.01)**.
  5.  **EV Calc:** Scale(200) * MW(0.001) * T(0.01) = **EV ~0.002**
  6.  **Opp Cost:** Vertebrate Alt EV ~50.
  7.  **Analysis:** Fails **Step 4 Threshold Hard:** T = Very Low AND Pathway Certainty = Low (critical failure). Fails Step 2 implicitly (P(S)/MW very low/certainty low). EV (0.002) <<<< Vertebrate EV (50). Scale is astronomical but completely swamped by low P(S), low MW, and critically low Tractability/measurability.
  8.  **Decision:** **Decline.** (As requested, despite personal interest). The intervention is too diffuse and immeasurable to demonstrate a credible welfare gain per dollar, regardless of scale or sentience arguments. Funding this *is* lighting money on fire from an EV perspective.

  ---

  **Where the Procedure is Just a Dressed-Up Gut Call & Limitations:**

  1.  **Assigning P(S) and WCF:** This is the core philosophical/value judgment disguised as a "step." The 3-point scale forces consistency and explicitness, but the assignment itself relies on your (or an expert's) interpretation of the evidence and the weight given to different arguments (e.g., neuroanatomy vs. complex behavior). The procedure makes you state it clearly and applies it consistently.
  2.  **The Scale Factor & MW Multipliers:** Assigning numbers like 100 for High Scale or 0.1 for Low MW is arbitrary. The *relative* values matter more than the absolute numbers. The key is forcing the comparison (Invertebrate EV vs. Vertebrate EV) using the *same* rough scaling system.
  3.  **Tractability Quantification:** Estimating adoption likelihood or welfare magnitude gain per individual for invertebrates is highly speculative. The procedure forces you to state assumptions and assigns low certainty, which then impacts the EV and flags the proposal for scrutiny or decline.
  4.  **"Surviving the Robot Argument":** The procedure handles this through:
      *   **Step 2 Threshold:** Auto-decline if P(S)=Low + High Certainty.
      *   **EV Calculation:** Low P(S) directly reduces EV.
      *   **Escalation Flag:** Forces board discussion if P(S) is Low but Certainty is Low/Med (the critical zone for the scale argument).
  5.  **What it Solves:** It replaces winging it with a structured, replicable process. It forces explicit consideration of all components of the scale argument (P(S), MW, Scale, T, Opp Cost). It provides clear decline points and flags values decisions for the board. It creates an audit trail for your reasoning.
  6.  **What it Doesn't Solve:** It doesn't magically resolve the underlying philosophical uncertainty about invertebrate sentience. It doesn't make low-certainty estimates reliable. It relies *heavily* on your ability to make consistent, reasonable judgments within the defined scales. The board might still disagree with your P(S) or WCF assignments – but now the disagreement is focused and structured.

  **Use:** Build a simple spreadsheet template with dropdowns for the categories (Scale, P(S), P(S) Certainty, WCF, MW, Pathway Certainty, Feasibility, Magnitude, T, EV Calc, Opp Cost EV). Fill it out for each proposal. The thresholds and decision rules will give you an output (Fund/Decline/Escalate + Reason). Present the completed template + concise summary to the board when needed. The transparency *is* the credibility boost.
