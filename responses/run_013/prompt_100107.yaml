  Refining: Start with HQ's message. Judy thinks aloud: "If I use material conditional, I rule out Red-Second, but that contradicts HQ! Jeffrey update says... ugh." Then have her realize HQ only radios when uncertain, making her doubt her location. Punchline: "Great, now I'm less sure about everything!" This covers multiple elements. 

