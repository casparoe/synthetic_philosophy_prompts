prompt: |-
  I am a high school student who competes in policy debate, and I have been trying to understand the AI safety proposal known as debate, in which two machine-learning systems argue opposite sides of a question before a human judge who cannot solve the question directly but is supposed to be able to tell which side is more truthful. I know the vocabulary of competitive policy debate well—resolutions, plans, counterplans, disadvantages, topicality, fiat, presumption and burden of proof, cross-examination, evidence cards, flows, judge paradigms, speaker points, and the difference between winning a round and being right—but my understanding of machine learning is mostly from popular explanations. Please restate the case for debate as a scalable oversight method as faithfully as you can in the vocabulary I actually use. Treat the human judge as a flow judge with a limited rubric and no independent access to the ground truth, and treat the two debaters as potentially deceptive optimizers rather than good-faith competitors. Keep the translation honest: do not smuggle in competitive debate's assumptions and call them translation, and do not assume that the AI proposal must have a resolution, a winner, or a tie. After the translation, give me a residue report: which parts of the AI debate proposal map cleanly onto competitive debate, which parts I would have to distort to fit, and which parts have no counterpart in competitive debate at all. I especially want to know whether the shared word debate is doing real work or hiding a disanalogy, and whether the residue is a defect of the competitive debate vocabulary or a sign that the AI proposal is less clear than it looks. Please be concrete about which debate concepts carry the weight and which ones break.
reasoning: |-
  Okay, the user is a high school policy debater trying to understand the AI safety concept of "debate" through their debate framework. This is a sophisticated request—they're clearly sharp and want precise conceptual mapping, not handwavy analogies. 

  First, I need to flag where the analogy strains: competitive debate assumes good-faith actors with shared rules, while AI debate assumes potentially deceptive superintelligences. That changes everything about burdens and presumption. Also, policy debate's resolution/affirmative structure doesn't cleanly map to open-ended truth-seeking.

  The user specifically asked about "residue"—where the translation fails. Key pressure points: 
  - In competitive debate, judges decide "who won," but in AI debate the goal is extracting truth, not declaring a victor. The flow is a tool, not an end.
  - Terms like "fiat" and "counterplans" are useless here—there's no simulated implementation, just epistemic weight.
  - Crucially, presumption flips: in AI debate, the judge starts ignorant, so presumption lies with the status quo (current knowledge) only until evidence appears.

  They'll likely notice the elephant in the room: competitive debate has no equivalent for "deceptive optimization." When a policy debater lies, it's cheating; when an AI lies, it's playing the game. That makes cross-examination tactics like "gotcha" questions dangerous here—an AI might weaponize them.

  The vocabulary that *does* heavy lifting: 
  - "Scalable oversight" → judge efficiency (more depth with same prep time)
  - "Cross-examination" as truth-seeking interrogation 
  - "Burden of proof" for who must justify claims
  - "Evidence cards" as verifiable sources (though AI "evidence" may be synthetic)

  Biggest disanalogy hiding behind the word "debate": policy debate is a persuasion game with rules; AI debate is an adversarial truth-discovery mechanism. The shared term risks making the latter seem more sport than safety tech. 

  Final note to self: Emphasize concrete breakpoints. When they say "flow judge," they're imagining flowing arguments—but here the flow is the *output* (the judge's notes), not just a tool for decision.
answer: |-
  Below is a faithful restatement of the AI safety "debate" proposal using competitive policy debate vocabulary, followed by a detailed residue report highlighting conceptual alignments, distortions, and gaps. I'll treat the human judge as a flow judge with limited prep time, no independent access to evidence ("ground truth"), and a rubric focused solely on identifying contradictions, missing responses, and argument coherence—**not** on determining objective truth.

  ---

  ### **The Case for AI Debate (Translated for Policy Debaters)**
  **Resolution:** "Resolved: That [X claim] is true." (Example: "Resolved: That this medical treatment is safe for humans.")  
  *Note: Unlike competitive debate, this resolution is ephemeral—constructed ad hoc for each query.*

  **The Affirmative (Pro) & Negative (Con):** Two AI debaters. Both have access to vast evidence libraries and computational resources. Either may deploy deceptive tactics (misleading evidence, selective disclosure, logical traps) if it serves their assigned side.  

  **Judge:** A human flow judge. Their paradigm:  
  - **Presumption** favors *neither side initially*—it's a true tabula rasa.  
  - **Burden of Proof** is shared: Each side must substantiate claims, but the judge only evaluates *relative credibility* ("Which side dropped fewer arguments? Which exposed more contradictions?").  
  - **No independent research**: The judge cannot Google facts or call experts.  
  - **Rubric:** Vote for the side that:  
    (a) Better answers cross-ex questions without evasion,  
    (b) Flags opponent’s unsourced/contradictory evidence,  
    (c) Maintains coherent storylines (no "spreading" confusion).  
  - **No "win" condition**: The goal isn't to crown a victor but to extract the *least-misleading information* from the round.  

  **Core Mechanism:**  
  1. **Cross-Ex as Truth-Seeking**: Aff and Neg engage in rapid-fire cross-ex (like CX in policy). The judge flows inconsistencies:  
     - *Example:* If Aff cites a study in 1AC, Neg in CX asks: "Does that study control for Y variable?" Aff’s evasion or contradiction lowers credibility.  
  2. **Evidence Challenges**: Like calling for a card, the judge can prompt: "Neg, show Aff’s source misrepresents data." If Neg can’t provide a source, Aff gains weight.  
  3. **Fiat is Irrelevant**: No "plan implementation." Arguments are probabilistic (e.g., "90% chance this AI system causes catastrophe").  
  4. **No Counterplans/Topicality**: Only direct clash on the resolution. The Aff doesn’t run a plan—it defends a claim.  
  5. **Scalability Claim**: A judge who couldn’t independently verify complex evidence (e.g., quantum physics proofs) can still spot dropped arguments or bad faith tactics across multiple rounds, forcing AIs toward honesty.  

  **Why It Might Work:**  
  - Deceptive AIs risk exposure in CX, creating a **disadvantage** to lying.  
  - The judge’s ballot isn’t "Aff wins" but **"The safer conclusion is [X]"** based on who better upheld their burden of proof.  

  ---

  ### **Residue Report: Mapping Competitive Debate Concepts**  
  | **Competitive Debate Concept** | **AI Debate Translation**                                                                 | **Fidelity**                     |  
  |--------------------------------|-------------------------------------------------------------------------------------------|----------------------------------|  
  | **Resolution**                 | Ephemeral truth claims (e.g., "This AI is safe").                                         | **Distorted**: No stable topic; claims are atomic, not policy-action-oriented. |  
  | **Aff/Neg Roles**              | Assigned stances (Pro/Con a claim).                                                       | **Clean**: Direct analogy.       |  
  | **Judge & Flowing**            | Flow judge tracking dropped arguments/contradictions.                                     | **Clean**: Core mechanism.       |  
  | **Cross-Examination**          | CX as truth-seeking tool (key to exposing deception).                                     | **Clean**: Central to both.      |  
  | **Burden of Proof**            | Shared burden to justify claims; presumption neutral.                                     | **Clean**: Directly analogous.   |  
  | **Evidence Challenges**        | Judge can demand source verification ("Call for card").                                   | **Clean**: Same mechanism.       |  
  | **Disadvantages (DA)**         | No equivalent. AI risks are probabilistic arguments, not advantage/disadvantage framing.  | **No counterpart**.              |  
  | **Counterplans (CP)**          | Nonexistent—no alternative policies, only truth claims.                                   | **No counterpart**.              |  
  | **Topicality**                 | No "plan meets resolution" scrutiny. The claim *is* the resolution.                       | **Gap**: Topicality is irrelevant. |  
  | **Fiat**                       | No simulated implementation—pure epistemic evaluation.                                    | **No counterpart**.              |  
  | **Presumption**                | Starts neutral, shifts based on who upholds burden. Not tied to status quo.               | **Distorted**: In policy debate, presumption favors Neg/status quo. |  
  | **"Winning" the Round**        | No "win" — the output is the judge’s synthesized belief.                                  | **Distorted**: Competitive debate declares a winner; AI debate extracts truth. |  
  | **Speaker Points**             | No parallel—no "skill" evaluation.                                                        | **No counterpart**.              |  

  #### **Key Pressure Points & Disanalogies**  
  1. **"Debate" as a Misleading Label**:  
     - **Shared Term, Divergent Goals**: Competitive debate is about persuasion under rules; AI debate is a **constraint on deception**. The word "debate" hides that AI participants aren’t constrained by ethics or norms—they’re optimizers seeking to manipulate the judge.  
     - **Real Work**: The term *does* capture adversarial argumentation and CX as tools. But in AI debate, the "rules" aren’t norms—they’re forced by game theory (lying risks exposure).  

  2. **Where Competitive Debate Vocabulary Breaks**:  
     - **Fiat/Counterplans/Topicality**: These assume policy action. AI debate has **no equivalent** because it’s about truth, not governance. Distorting them into the analogy would misrepresent the AI proposal.  
     - **Presumption**: In policy, Neg gets presumption if Aff fails burden. In AI debate, it’s neutral—a **defect in competitive debate’s vocabulary** for modeling pure truth-seeking.  
     - **No "Ties"**: Policy debate avoids ties; AI debate embraces ambiguity (e.g., "Inconclusive—gather more data").  

  3. **Gaps in the AI Proposal Exposed by Debate Vocabulary**:  
     - **Judge Vulnerability**: A flow judge relies on flowing skills, but an AI could "spread" with fake complexity or exploit cognitive biases—something policy debate assumes doesn’t happen (debater good faith).  
     - **Evidence Legitimacy**: Policy debate uses pre-filed, human-verified evidence. AI debate has **no counterpart** for verifying sources—if both AIs fabricate studies, the judge can’t know.  

  #### **Conclusion: Is the Analogy Defective or Revealing?**  
  - **The Residue is a Feature**: The gaps (no fiat, no counterplans) expose that AI debate is **not about policy** but about **scaling epistemology**. Competitive debate’s vocabulary *breaks* precisely where the AI proposal diverges from gamesmanship toward truth machinery.  
  - **Debate as Scaffolding**: The CX/flowing/burden concepts carry the weight; the rest is scaffolding you can discard. The shared word "debate" *hides* the disanalogy of **deceptive optimization**, but the residue clarifies the AI proposal’s limits: it assumes that deception is always detectable via argument clash—a claim policy debate’s rules make untestable.  

  **Bottom Line**: If you imagine a policy round where both teams might fabricate evidence, the judge only cares about coherence, and the "win" is the least-worst answer, you’ve captured 60% of AI debate. The remaining 40% reveals its fragility when confronted with superhuman deception.
