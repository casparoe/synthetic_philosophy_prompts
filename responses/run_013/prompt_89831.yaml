prompt: |-
  I'm building up to writing my own expressivist semantics, and before I start I want the full spec of what the thing has to do — the criteria, not a survey of who said what. So: give me the desiderata an account of moral language has to meet, each with the case that motivates it. Some I already know I'm on the hook for — 'lying is wrong' has to mean the same thing when it sits unasserted in 'if lying is wrong then getting your brother to lie is wrong' as when it stands alone; the modus ponens has to come out valid for someone with no opinion about lying; 'lying is wrong' and 'lying isn't wrong' have to be contradictories and not just two different attitudes colliding; and it has to make sense of us calling these things true and arguing about them. Fine, those are the price of entry.

  What I actually want is the rest of the list, including the ones that aren't usually written down. Here's the kind of thing that keeps tripping me up and that I'd want a requirement for: 'I wonder whether lying is wrong' — nobody's expressing an attitude there, but the clause seems to mean what it always means. 'Lying is probably wrong' — what is 'probably' doing to an attitude? 'Either lying is wrong or the sign is misprinted' — one disjunct is a norm, the other is about ink. Someone who says all the right sentences and then adds 'but I couldn't care less' — is she using the words with our meaning and just cold, or is she using different words? And 'I take that back' after having said it.

  For each requirement, give me the case behind it and say whether it's non-negotiable or a prejudice of one camp. Then the part I care about most: which subset of these can't be had together, and which single requirement does the most to sink expressivism. Brief scorecard at the end of how the standard moves (quasi-realism, hybrid views, minimalism about truth) fare against the list — keep that short, the criteria are the deliverable. No reading list.
reasoning: |-
  Okay, the user is building their own expressivist semantics and wants a comprehensive list of desiderata for moral language. They already know some standard requirements like compositionality, validity of modus ponens for non-committed speakers, contradiction, and truth-aptness. But they're asking for more nuanced cases that trip them up—like embedded contexts without attitude expression ("I wonder whether lying is wrong"), probabilistic modifiers ("lying is probably wrong"), mixed disjunctions ("either lying is wrong or the sign is misprinted"), and withdrawn commitments ("I take that back"). They also want to know which requirements conflict and which is most damaging to expressivism.  

  First, I need to recall the standard expressivist challenges beyond what they listed. The Frege-Geach problem covers compositionality and inference preservation, but the user wants deeper cases. The "I wonder" example tests non-assertoric embeddings—how can "lying is wrong" retain meaning without attitude expression? Probability modifiers like "probably" challenge how attitudinal content interacts with epistemic modals. Mixed disjunctions force unifying normative and descriptive content under one logical operator. The "couldn't care less" speaker questions whether indifference voids meaning or reflects cold acceptance. Retraction ("I take that back") demands a mechanism for reversing commitments.  

  Then there are subtler issues: negation consistency (why "not wrong" isn't just a different attitude), non-assertoric acts (questions, commands), propositional anaphora ("that"), propositional attitudes ("believes that lying is wrong"), and explanatory depth (why moral language has its features). For each, I'll tie to concrete cases.  

  Conflicts arise: compositionality versus non-propositionalism is expressivism's core tension. Embeddings without attitude expression clash with attitude-expression-as-meaning. Probability modifiers need truth-conditional scaffolding, which pure expressivism avoids. Mixed disjunctions force propositional equivalence. Retraction requires commitment-tracking beyond belief.  

  The biggest sinkhole? Probably mixed disjunctions—they demand normative and descriptive contents play identical logical roles, forcing expressivists into quasi-realism's propositional mimicry.  

  Quasi-realism (Blackburn, Gibbard) tackles most via higher-order attitudes or structured contents but struggles with mixed embeddings. Hybrid views (Ridge) add descriptive content to handle compositionality but dilute expressivism. Minimal truth helps with truth-talk but not underlying logic.  

  User likely wants this for framework design, so I'll emphasize trade-offs. Their examples suggest they've hit practical walls—probabilities, mixed content, cold speakers—so I'll prioritize those. No reading lists, just criteria.  

  Final list: embedded non-assertoric contexts, modifiers, mixed content, retraction, indifference, non-assertoric acts, anaphora, propositional attitudes, negation, and explanation. Scorecard: quasi-realism handles most but bends toward realism; hybrids compromise; minimal truth is superficial. Biggest conflict: compositionality vs. non-propositionalism. Worst for expressivism: mixed disjunctions.
answer: |-
  Here's the full desiderata list for an expressivist semantics, driven by concrete cases, with necessity ratings and conflicts highlighted. Focus is on the *work* the theory must do, not historical positions.

  ### Core Desiderata (Price of Entry - You Knew These)
  1.  **Compositionality (Frege-Geach):**
      *   **Case:** "If lying is wrong, then getting your brother to lie is wrong." The meaning of "lying is wrong" must be consistent when embedded unasserted as in the antecedent vs. when asserted alone.
      *   **Necessity:** Non-negotiable. Failure means the theory can't handle logic.
  2.  **Validity Preservation (Non-Cognitivist Inference):**
      *   **Case:** A logician with no stance on lying must recognize the argument "If lying is wrong, then getting your brother to lie is wrong; Lying is wrong; Therefore, getting your brother to lie is wrong" as valid modus ponens.
      *   **Necessity:** Non-negotiable. Logic can't depend on sharing the attitude.
  3.  **Contradiction:**
      *   **Case:** "Lying is wrong" and "Lying is not wrong" must genuinely contradict each other. It can't merely be "Boo lying!" vs. "Hooray lying!" or two unrelated attitudes.
      *   **Necessity:** Non-negotiable. Fundamental to disagreement and logic.
  4.  **Truth-Aptness & Disagreement:**
      *   **Case:** We say "It's true that lying is wrong," "Is it true that lying is wrong?", "She's wrong about lying being permissible," and engage in reasoned argument about it. The theory must explain this practice without collapsing into realism.
      *   **Necessity:** Non-negotiable for quasi-realist expressivism.

  ### The "Rest of the List" (Driven by Your Cases & More)
  5.  **Embedded Non-Assertoric Contexts (Wondering, Supposing):**
      *   **Case:** "I wonder whether lying is wrong." "Suppose lying is not wrong." No attitude is expressed *by the speaker* towards lying in these embeddings, yet "lying is wrong" seems to contribute its standard meaning to the thought/sentence.
      *   **Case:** "Does Mary believe that lying is wrong?" (Reports attitude, doesn't express it).
      *   **Necessity:** Non-negotiable. Pervasive in thought and language. **Conflict:** Directly challenges the core expressivist idea that meaning *is* (only) attitude expression in assertion.
  6.  **Modifiers (Probability, Evidentials):**
      *   **Case:** "Lying is probably wrong." "Clearly, lying is wrong." What does "probably" modify if "wrong" expresses a non-cognitive attitude? How does "clearly" function? The modification must make sense compositionally.
      *   **Necessity:** High. Common in moral discourse. **Conflict:** Forces the "attitude" to have a structure or degree that can be modified, or requires embedding within a proposition-like entity.
  7.  **Mixed Content (Disjunctions, Conditionals):**
      *   **Case:** "Either lying is wrong or the printer is out of ink." "If the printer is out of ink, then lying isn't wrong after all (because we can't print the rules)." One component is normative, one descriptive. The disjunction/conditional must function as a unified whole with logical properties (e.g., one disjunct being true suffices for the whole disjunction).
      *   **Necessity:** High. Common and logically essential. **Conflict:** Perhaps the *strongest challenge*. Expressivism must provide a *single, unified account* of what the disjunction expresses that logically connects fundamentally different types of content (attitude vs. belief). This pushes hard towards propositional equivalence.
  8.  **Retraction:**
      *   **Case:** "Lying is wrong... Actually, I take that back." What state is the speaker retracting? How is this different from changing a descriptive belief? The theory must account for the object of retraction being the *commitment* expressed by the initial utterance.
      *   **Necessity:** Moderate/High. Important for accountability and discourse dynamics.
  9.  **The "Couldn't Care Less" Speaker (Indifference vs. Meaning):**
      *   **Case:** A speaker uses "lying is wrong" grammatically correctly in all contexts (embeddings, inferences, disagreement) but insists they feel no disapproval towards lying and "couldn't care less." Are they using the words correctly but insincerely? Or have they failed to grasp the meaning?
      *   **Necessity:** Important. Tests the link between meaning and motivational force/internal state. **Conflict:** Pure expressivism suggests meaning *is* the attitude, implying indifference shows lack of understanding. This seems counterintuitive (they use it correctly!). Solutions often involve distinguishing competence/performance or adding a layer.
  10. **Non-Assertoric Speech Acts (Questions, Commands):**
      *   **Case:** "Is lying wrong?" (Question) "Don't lie, it's wrong!" (Command). How do these acts relate to the core expressive act? What state does the question query?
      *   **Necessity:** Moderate. Needed for full linguistic coverage.
  11. **Propositional Anaphora:**
      *   **Case:** "Lying is wrong. Bill denies that." "Bill believes that too." What does "that" refer to? It must pick out a common item (the "content" of the first sentence) shared between speaker and Bill.
      *   **Necessity:** High. Fundamental to discourse cohesion. **Conflict:** Strongly suggests the need for proposition-like entities as objects of denial/belief.
  12. **Propositional Attitudes:**
      *   **Case:** "Mary believes that lying is wrong." The theory must state what Mary's belief *consists in* (e.g., what state she is in) and how this relates to the state expressed by asserting "lying is wrong."
      *   **Necessity:** Non-negotiable. Crucial for psychology and semantics.
  13. **Negation Consistency:**
      *   **Case:** Why isn't "Lying is not wrong" naturally interpreted as expressing *permission* or *indifference* instead of *prohibition*? How does expressivism ensure negation targets the *specific* attitude expressed by "wrong"?
      *   **Necessity:** High. Follows from Contradiction but needs specific mechanism.
  14. **Explanatory Depth (Why *this* structure?):**
      *   **Case:** Why does moral language *so perfectly mirror* the structure of descriptive discourse (truth, logic, embedding, etc.) if its core function is expression? The theory shouldn't just mimic propositions but explain *why* this mimicry is necessary or efficient.
      *   **Necessity:** Aspirational/Important. Addresses the "worry" behind many other desiderata.

  ### Conflicts and the Biggest Sinkhole
  *   **Core Conflict:** **Compositionality & Logic (1,2,3) + Embeddings (5) + Mixed Content (7) + Anaphora (11) vs. Non-Propositionalism.** This is expressivism's fundamental tension. Making moral claims behave logically and compositionally like propositions, *especially* in mixed contexts and embeddings, constantly threatens to turn the "attitude" into a proposition by another name. Quasi-realism walks this tightrope.
  *   **The Biggest Sinkhole:** **#7 (Mixed Content: Disjunctions/Conditionals).** Providing a unified, logically adequate account of "Either lying is wrong or the printer is out of ink" is exceptionally difficult for pure expressivism. It forces the theory to treat the expression of an attitude and a descriptive belief as inputs to a single logical operator (*or*, *if...then*) requiring outputs of the same logical type. This pushes *harder* than any other single requirement towards needing proposition-like contents as the fundamental bearers of truth and logical relations.

  ### Brief Scorecard on Standard Moves
  *   **Quasi-Realism (Blackburn, Gibbard):** Aims to meet *all* desiderata. Handles 1-4, 5, 8-14 well via sophisticated accounts of higher-order attitudes or plans. Its biggest strain is **#7 (Mixed Content)** – solutions exist but are complex and contentious (e.g., treating the disjunction as expressing a complex higher-order attitude contingent on descriptive beliefs). **#6 (Modifiers)** also requires careful treatment.
  *   **Hybrid Views (e.g., Ridge):** Incorporate descriptive belief component. Handle **#1-5, 7, 11-12** more straightforwardly by having propositional content. Struggle more distinctively with **#3 (Contradiction)** - ensuring genuine contradiction between hybrids, and **#4 (Truth-Aptness)** - explaining why the *normative* component gets "truth" talk. Can handle **#9 (Indifference)** better if competence is linked to the descriptive component.
  *   **Minimalism about Truth:** Crucial for **#4 (Truth-Aptness)** across expressivist/hybrid views. Makes truth "cheap" and deflates the challenge. Doesn't solve the underlying compositional and logical problems (**#1,2,3,5,7**) by itself – it just makes the *symptom* (truth-talk) less problematic.

  **The Deliverable:** Your semantics must navigate these constraints. Prioritize solving **Compositionality, Inference, Mixed Content, and Embeddings** first – they are the most rigorous tests. **Mixed Content (#7) remains the single toughest nut to crack.** Good luck!
