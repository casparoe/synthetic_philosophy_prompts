prompt: |-
  I'm on a small panel advising a country that's deciding whether to keep, create or scrap a ceremonial head of state, and we've got basically one researcher for a year. Our comparitive cases are the UK, Denmark/Norway/Sweden and Japan. I keep finding that two very different things get run together: (a) the monarch as a real actor who might use reserve powers -- refusing assent, dissolving parliament, picking a PM after a hung parliament -- to block something, and (b) the monarch as background furniture whose mere existence changes what elected politicians do even though the monarch never lifts a finger. Which open questions in this area would you actually put at the top of our researcher's list, and why? I want a defended ordering rather than a survey: for each, why it's load-bearing for the practical recommendation, how tractable it is with a political theorist's toolkit, and what would move it up or down. And tell me which of the questions everyone fixates on we should quietly deprioritise because the answer wouldn't change our recommendation either way. No reading list, just the argument. British English please.
reasoning: |-
  Okay, the user is part of a panel advising a country on whether to keep, create, or scrap a ceremonial head of state. They're frustrated that discussions conflate two distinct aspects: the monarch as an active political actor using reserve powers versus the monarch as a symbolic figure whose mere presence influences political behaviour passively. 

  The user wants a prioritised list of research questions that would actually inform their practical recommendation. They're clearly an experienced policy advisor - the request is highly specific, demanding defended rankings with clear criteria (practical impact, research tractability, what would shift priorities). The "quietly deprioritise" ask suggests they've sat through too many academic debates that don't move the needle.

  Hmm... the comparative cases (UK, Scandinavia, Japan) are all stable democracies with long-standing monarchies. That's useful - means we're not dealing with contexts where crowns get weaponised. The researcher is a political theorist with one year. That rules out massive empirical studies but allows for qualitative analysis and institutional comparisons.

  Right, the core tension is between "monarch as veto player" vs "monarch as cultural symbol". The user's absolutely right these get muddled. Need to disentangle:
  - Concrete risks (when might reserve powers actually be used?)
  - Diffuse effects (does the monarchy's existence make politicians more restrained/civic-minded?)

  First question must be about reserve powers. It's the most direct threat to democratic functioning if misused. Tractability is high - can analyse historical precedents (e.g. Australian crisis 1975, Belgian royal refusals) and constitutional safeguards. Would move down only if the country's constitution neutered all discretionary powers.

  Second priority: symbolic stabilisation. Even if the monarch never acts, does the institution create a "backstop" mentality? Behavioural economics studies on symbolic authority could help here, plus crisis moments where monarchs calmed tensions (e.g. Spanish king vs coup 1981). But tractability is medium - harder to isolate causality.

  Third: constitutional guardian perception. Do judges/bureaucrats/internalise different norms because monarchy exists? Important because it affects whether scrapping the crown would weaken institutional checks. Tractability low - would require attitudinal surveys beyond researcher's scope. Move up if the country has strong independent institutions already.

  Fourth: civic cohesion. The "dignified part of the state" argument. But evidence is shaky - Scandinavian social cohesion predates modern monarchy. Deprioritise unless the country has severe national identity fractures.

  And crucially, what to ignore: The "cost" debate. Whether the monarchy pays for itself via tourism/pageantry is irrelevant to democratic function. Also historical legitimacy arguments - dead people's choices shouldn't bind living democracies.

  The active/passive distinction is everything here. If research shows reserve powers are genuinely dormant (like Japan) and symbolism has negligible behavioural effects, that pushes towards abolition being safe. But if evidence suggests even passive presence alters elite behaviour meaningfully, that's a case for keeping - or creating a non-hereditary variant.
answer: |-
  Here's a prioritised list of research questions for your year-long project, with clear justifications based on practical impact, tractability, and actionability for your recommendation:

  ### **Top Priority: The Active Threat Question**
  **Question:** *In stable parliamentary democracies with ceremonial monarchies (our comparator cases), how credible is the threat that reserve powers would be used against prevailing democratic norms?*  
  - **Why load-bearing?**  
    If reserve powers are a credible threat (e.g., a monarch could block legislation or dismiss a government), this fundamentally alters the risk calculus. Scrapping the monarchy eliminates this risk; creating one introduces it. Keeping it requires safeguards.  
  - **Tractability:**  
    High. Political theory provides frameworks for analysing constitutional conventions, historical precedents (e.g., the 1975 Australian dismissal), and the gap between *de jure* powers and *de facto* practice. Focus on moments of crisis (e.g., hung parliaments) in comparator states.  
  - **What moves it?**  
    Up if evidence shows latent power exists (e.g., Sweden’s monarch retained formal powers until 1974). Down if all cases show powers are truly "nuclear options" (e.g., Japan’s Emperor has never intervened).  

  ### **Second Priority: The Passive Discipline Effect**  
  **Question:** *Does the monarch’s symbolic presence create a measurable "disciplining effect" on political actors – fostering restraint, civility, or stability – independent of any active intervention?*  
  - **Why load-bearing?**  
    If the monarchy acts as a psychological "circuit breaker" (e.g., politicians self-censor extreme actions to avoid forcing the monarch’s hand), scrapping it might remove a stabilising force. Conversely, if the effect is negligible, this weakens the case for keeping/creating one.  
  - **Tractability:**  
    Medium. Requires behavioural analysis: compare political conduct in crises with/without monarchies (e.g., UK’s Brexit chaos vs. Ireland’s presidency). Use theoretical tools like Schelling’s focal points or Weberian legitimacy. Interviews with insiders (e.g., retired civil servants) could reveal unwritten norms.  
  - **What moves it?**  
    Up if comparators show consistent patterns (e.g., Nordic monarchs cited as unifying symbols during crises). Down if no correlation exists (e.g., Japan’s politics remain fractious despite the Emperor).  

  ### **Third Priority: The Substitution Question**  
  **Question:** *Can the symbolic and stabilising functions of a monarchy (if they exist) be fully replicated by a non-hereditary, elected head of state?*  
  - **Why load-bearing?**  
    If your country wants the benefits of a unifying figure without hereditary privilege, this determines whether creating a presidency (e.g., Ireland, Germany) is a viable alternative to monarchy.  
  - **Tractability:**  
    Medium-High. Compare the perceived legitimacy and efficacy of elected heads of state in similar systems (e.g., German President’s role in government formation). Analyse how non-hereditary figures build cross-partisan respect (e.g., duration of term, selection process).  
  - **What moves it?**  
    Up if evidence shows elected heads of state are equally effective (e.g., Ireland’s president as a national unifier). Down if monarchy’s "mystique" proves irreplaceable (e.g., UK polls showing monarchy’s unique emotional resonance).  

  ### **Fourth Priority: The Cost of Scrutiny Avoidance**  
  **Question:** *To what extent does the existence of a monarch incentivise politicians to avoid accountability by "hiding" behind ceremonial deference?*  
  - **Why load-bearing?**  
    Monarchies may inadvertently shield elected leaders from scrutiny (e.g., by absorbing media attention or providing a fig leaf of unity). This could undermine democratic accountability – a key argument for abolition.  
  - **Tractability:**  
    Medium. Analyse media coverage patterns and parliamentary scrutiny levels in comparator states. Theoretical lens: "decoupling" of symbolic vs. operational politics (e.g., UK’s "Queen’s Speech" masking government agendas).  
  - **What moves it?**  
    Up if evidence shows reduced scrutiny of executives in monarchies (e.g., Japan’s Emperor-centric narratives overshadowing PM scrutiny). Down if monarchies coexist with robust accountability (e.g., Denmark’s high transparency rankings).  

  ---

  ### **Deprioritise This (Despite Popular Fixation):**  
  **Question:** *Does the monarchy promote social cohesion or national identity?*  
  - **Why deprioritise?**  
    While emotionally resonant, this is unlikely to change your recommendation. Evidence is correlational (e.g., Nordic monarchies exist alongside high social trust, but causation is unclear). Social cohesion stems from deeper factors (e.g., welfare states, education). Creating a new monarchy for "unity" is high-risk symbolism; scrapping an existing one may not fracture society if alternative symbols exist (e.g., Japan’s post-1945 transition).  
  - **Impact on Recommendation:** Low. Even if monarchy *correlates* with cohesion, it doesn’t prove causation – and your country’s context (e.g., demographics, history) will dominate outcomes.  

  ### **Key Decision Triggers from Research:**  
  1. **If reserve powers pose a credible threat** → Scrapping avoids risk; creating requires strict limits.  
  2. **If passive discipline is strong and irreplaceable** → Keeping (or creating) becomes viable.  
  3. **If a presidency replicates benefits without risks** → Scrap or avoid monarchy.  
  4. **If monarchy obscures accountability** → Strong case for abolition.  

  Focus your researcher: The monarchy’s *operational emptiness* (ceremonial role) is irrelevant without understanding its *latent power* (reserve threats) and *behavioural effects* (passive discipline). Prioritise questions where findings could tip the balance between options – not just describe how monarchies function.
