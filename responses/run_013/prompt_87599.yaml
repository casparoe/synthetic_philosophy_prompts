prompt: |-
  I chair the methods review panel of the National Replication Fund, which supports multi-site replications in the social and behavioural sciences. At Thursday's meeting we must dispose of an application from a five-site consortium that proposes to replicate a widely cited priming effect. The design is sequential and Bayesian: the team will recruit to a pre-registered maximum, but intends to stop early as soon as the Bayes factor for the effect exceeds ten, and it proposes to report that Bayes factor as the primary evidence. One panellist, a frequentist, says this is optional stopping by another name and that our standing requirement of calibrated error control is thereby breached; another, a Bayesian, replies that error probabilities are not properties of the evidence and that the fund has no business imposing a frequentist straitjacket on a Bayesian design. The applicant has offered a compromise: an adversarial prior centred on zero and scaled to half the original effect, together with a simulation study showing a false-positive rate no worse than five per cent under that prior. We are all conscious of the replication crisis and of the winner's curse that inflates published effects, and the applicant's stated reason for the Bayesian design is that it will let them stop as soon as the evidence is strong, which they say is more honest than fixed-horizon testing. I should add that I am a psychologist by training, comfortable with both approaches in practice but not a statistician, and I need an opinion I can defend to colleagues who are.

  Our fund has just introduced a pilot condition, the dual-reporting condition, which requires every funded replication to report both a Bayes factor and a design-based error guarantee, and to pre-specify any stopping rule in a manner that is transparent under both frameworks. The applicant's compromise is plainly an attempt to satisfy that condition, but the frequentist panellist objects that a guarantee which depends on the applicant's chosen prior is not the kind of guarantee the fund's remit requires, while the Bayesian panellist objects that the dual-reporting condition is itself incoherent because it treats a posterior odds as if it were an error probability. The panel must decide whether the dual-reporting condition can be met by the applicant's proposal, and if not, what conditions would make it meetable.

  Please draft the short written opinion I shall circulate before Thursday's meeting. It should recommend a concrete course of action -- fund as proposed, fund with specified conditions, defer for revision, or reject -- with a time frame and reasoning that the applicant could actually respond to. Engage seriously with the strongest consideration on the losing side, whether that is the Bayesian's claim that error probabilities are irrelevant once the data are in or the frequentist's claim that a prior-dependent guarantee cannot satisfy the fund's remit, and do not pretend the disagreement is merely verbal. The opinion should read as a decision memo for an institutional body, not as an essay on the foundations of statistics; it should be no longer than two pages, and it should not ask for citations, bibliographies, or a reading list, since the panel must decide the case in front of it.
reasoning: |-
  We are faced with a proposal that uses a Bayesian sequential design with early stopping based on a Bayes factor threshold. The panel's concern centers on whether this design meets the fund's new dual-reporting condition, which requires both a Bayes factor and a design-based error guarantee, with a pre-specified stopping rule that is transparent under both frameworks.

  The applicant has offered a compromise: an adversarial prior (centered at zero and scaled to half the original effect) and a simulation showing a false-positive rate (FPR) of no more than 5% under that prior. However, the frequentist panellist objects that this prior-dependent guarantee does not meet the fund's requirement for a design-based error guarantee. The Bayesian panellist objects that the dual-reporting condition is incoherent because it conflates posterior odds (Bayes factor) with error probabilities.

  Key points:

  1. **The fund's remit**: We require calibrated error control, which in the frequentist sense typically means controlling the Type I error rate (e.g., at 5%) over the design. The dual-reporting condition is new, but it aims to ensure that the replication provides both Bayesian and frequentist measures of evidence, with the stopping rule pre-specified and transparent in both frameworks.

  2. **The applicant's design**: It is Bayesian sequential, stopping when BF>10. The compromise adds an adversarial prior and a simulation to show FPR≤5% under that prior. However, note that the simulation is based on a specific prior (the adversarial one) and thus the FPR guarantee is conditional on that prior. This is not the same as a frequentist error rate, which conditions on the null hypothesis (without a prior) and averages over the stopping rule.

  3. **The frequentist concern**: Optional stopping can inflate the Type I error rate in frequentist testing. The simulation provided by the applicant does not necessarily control the frequentist Type I error because:
     - The simulation assumes a prior (so it's a Bayesian FPR, not a frequentist one).
     - The frequentist Type I error rate would require evaluating the probability of a false positive under the null hypothesis (H0) for the entire sequential design.

  4. **The Bayesian concern**: The Bayes factor is a measure of the strength of evidence from the data. The Bayesian framework does not require error control in the frequentist sense because it conditions on the observed data. The dual-reporting condition is seen as imposing an alien frequentist requirement on a Bayesian design.

  5. **The dual-reporting condition**: It requires both a Bayes factor and a design-based error guarantee. The key question is: what constitutes a "design-based error guarantee"? The fund's standing requirement is for calibrated error control, which has been interpreted in a frequentist manner (e.g., controlling the Type I error at 5%).

  6. **The compromise simulation**: The applicant's simulation shows that under the adversarial prior (which is conservative, centered at zero and scaled to half the original effect), the false-positive rate is ≤5%. But note:
     - This FPR is a Bayesian FPR (i.e., the posterior probability of the null given a positive finding, or similar) and it is conditional on the prior. It is not the same as the frequentist Type I error rate.

  However, the applicant may argue that this simulation is an attempt to bridge the gap by using a prior that is skeptical. But the frequentist panellist is right: the fund's requirement for a design-based error guarantee likely refers to a frequentist guarantee (i.e., controlling the Type I error rate under H0 without a prior).

  7. **The winner's curse**: The applicant's motivation for the Bayesian design is to stop early when evidence is strong, which they argue is more honest than fixed-horizon testing. This is a valid point in the context of the replication crisis.

  8. **Feasibility of meeting dual-reporting**: The dual-reporting condition requires pre-specification of the stopping rule in a manner transparent under both frameworks. The stopping rule (stop when BF>10) is clear, but the design-based error guarantee must be provided in a frequentist manner.

  Proposal for resolution:

  The applicant's current proposal does not provide a frequentist error guarantee because the simulation is under a prior. To meet the dual-reporting condition, we require a frequentist error control for the sequential design. This could be achieved by:

  - Pre-specifying a frequentist sequential design that controls the Type I error (e.g., using a sequential testing procedure like alpha-spending) and then reporting the Bayes factor alongside the frequentist result. However, the applicant has chosen a Bayesian sequential design.

  Alternatively, the applicant could adjust their stopping rule to control the frequentist Type I error. For example, they could use a stopping rule based on a Bayes factor but with a threshold that is chosen to control the Type I error rate at 5% under H0. This is possible by simulating the null distribution of the Bayes factor under the sequential design (i.e., under H0, without any prior) and setting the BF threshold so that the probability of ever stopping with BF>threshold under H0 is 5%. This would provide a frequentist guarantee.

  However, note that the Bayes factor itself is not calibrated to a fixed error rate under optional stopping in the frequentist sense, but the design (with a properly chosen threshold) can be.

  Therefore, I recommend:

  **Defer for revision**, with the following conditions:

  1. The applicant must provide a frequentist error guarantee for the sequential design by simulating the Type I error rate under the null hypothesis (without any prior) for the proposed stopping rule (i.e., stop when BF>10) and with the maximum sample size. If the Type I error rate exceeds 5%, they must adjust the stopping threshold (i.e., require a higher BF) so that the Type I error rate is controlled at 5% (or at least no more than 5%) under the null.

     - Explanation: This simulation would run the experiment under the null hypothesis, with the same stopping rule (stop when BF>10, else continue to max sample size) and count the proportion of times the BF ever exceeds 10. If that proportion is above 5%, then the threshold must be increased until the proportion is ≤5%. This provides a design-based frequentist guarantee.

  2. The applicant must pre-register both the stopping rule (with the adjusted threshold if necessary) and the maximum sample size. They must also pre-register the adversarial prior they proposed (to compute the Bayes factor) and the simulation plan for the Type I error control.

  3. The dual-reporting condition will then be met by:
     - Reporting the Bayes factor (using the pre-registered prior) as the primary Bayesian evidence.
     - Reporting the frequentist test (with the pre-registered stopping rule) and its associated Type I error guarantee (from the simulation).
     - The stopping rule is the same for both: stop when the BF exceeds the threshold (which has been chosen to control Type I error) or when the maximum sample size is reached.

  This approach satisfies both frameworks:
  - The Bayesian gets their Bayes factor and the ability to stop early with a pre-specified prior.
  - The frequentist gets a design that controls the Type I error rate at 5% (or less) under the null, by adjusting the BF threshold to achieve that.

  This addresses:
  - The frequentist's concern: by providing a direct frequentist error control.
  - The Bayesian's concern: by retaining the Bayes factor as the primary evidence and not requiring a fixed sample size.

  The applicant's compromise (using an adversarial prior and a simulation under that prior) does not provide a frequentist guarantee because it conditions on a prior. We require a guarantee under the null hypothesis (without a prior). The above revision does that.

  **Timeline**: The applicant should be given 4 weeks to conduct the simulation and adjust the threshold if needed. The panel would then review the revised design.

  **Why not fund as is?** The current proposal does not meet the dual-reporting condition because the "design-based error guarantee" they offer is prior-dependent and not frequentist. The fund's remit for calibrated error control has historically been frequentist. The dual-reporting condition was introduced to ensure both types of evidence, but without a frequentist error guarantee, it fails on that front.

  **Why not reject?** The proposal has merit in addressing the winner's curse and the desire for efficient stopping. With revision, it can meet the dual-reporting condition.

  **Strongest objection from the Bayesian side**: The Bayesian panellist argues that error probabilities are irrelevant once the data are in. However, the fund's remit requires a design-based error guarantee, which is a pre-data requirement. We are not requiring that the posterior inference be altered by the error probability, but that the design must have a known error control. This is a condition of funding, not a condition on the interpretation of the results. The Bayesian framework does not preclude reporting a frequentist property of the design.

  **Strongest objection from the frequentist side**: The frequentist panellist is correct that a prior-dependent guarantee is not the same as a frequentist one. We address that by requiring a simulation under H0.

  Therefore, I recommend deferring for revision as described.

