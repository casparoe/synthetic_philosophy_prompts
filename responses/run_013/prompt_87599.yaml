  **DRAFT OPINION**

  **To**: Methods Review Panel, National Replication Fund  
  **From**: [Your Name], Chair  
  **Date**: [Date]  
  **Subject**: Decision on Application [ID] for Replication of Priming Effect  

  **Proposal Summary**: The applicant, a five-site consortium, proposes a sequential Bayesian replication design with early stopping when the Bayes factor (BF) for the effect exceeds 10. The design includes a maximum sample size. The applicant has offered a compromise: an adversarial prior (centered at zero, scaled to half the original effect) and a simulation showing a false-positive rate (FPR) of ≤5% under that prior. The proposal is intended to meet the fund's new dual-reporting condition.

  **Panel Concerns**:  
  1. The frequentist panellist argues that the design does not provide a design-based error guarantee (i.e., frequentist Type I error control) because the offered FPR is prior-dependent.  
  2. The Bayesian panellist argues that the dual-reporting condition is incoherent because it conflates Bayesian evidence (BF) with frequentist error probabilities.  

  **Assessment of Dual-Reporting Condition**:  
  The dual-reporting condition requires:  
  - A pre-specified stopping rule transparent in both Bayesian and frequentist frameworks.  
  - Reporting of both a Bayes factor and a design-based error guarantee.  

  The applicant's stopping rule (stop when BF>10) is clear and pre-specified. However, the error guarantee provided (FPR≤5% under the adversarial prior) is a Bayesian error rate (conditional on the prior), not a frequentist one (which must hold under the null hypothesis without a prior). The fund's standing requirement for calibrated error control has been interpreted as frequentist error control (e.g., Type I error ≤5%). Therefore, the current proposal does not meet the dual-reporting condition.

  **Recommendation**:  
  We **defer** a funding decision pending revision by the applicant, to be submitted within **four weeks**. The applicant must revise the design to provide a frequentist Type I error guarantee. Specifically:  

  1. The applicant must simulate the Type I error rate under the null hypothesis (without any prior) for the sequential design with the stopping rule (stop when BF>10) and maximum sample size.  
     - If the simulated Type I error rate exceeds 5%, the applicant must adjust the BF threshold upward until the Type I error rate is ≤5%.  
  2. The revised design must pre-register:  
     - The stopping rule (with the final BF threshold).  
     - The maximum sample size.  
     - The adversarial prior (for the Bayes factor computation).  
     - The simulation plan for Type I error control.  

  **Reasoning**:  
  - This approach retains the Bayesian sequential design (using BF) while ensuring frequentist error control by adjusting the threshold. It meets the dual-reporting condition by:  
    - Reporting the Bayes factor (with the pre-registered prior) as the Bayesian evidence.  
    - Reporting the frequentist test with the pre-registered stopping rule and its controlled Type I error rate (from the simulation).  
  - It addresses the frequentist concern by providing a direct frequentist guarantee under H0.  
  - It addresses the Bayesian concern by not altering the primary Bayesian analysis and by allowing early stopping.  

  **Response to Objections**:  
  - **Bayesian objection (error probabilities are irrelevant post-data)**: The fund's requirement for a pre-data design-based error guarantee does not force a frequentist interpretation of the Bayes factor. It ensures the design has known frequentist properties, which is a separate requirement.  
  - **Frequentist objection (prior-dependent guarantee insufficient)**: The current compromise does not control the frequentist Type I error. The revision requires a simulation under H0 to provide that control.  

  **Conclusion**:  
  The proposal is innovative and addresses the winner's curse, but it currently fails to meet the dual-reporting condition. With the requested revision, it can meet both Bayesian and frequentist requirements. We encourage the applicant to revise and resubmit within four weeks. The panel will then make a final decision.  

  **Action**: Panel to discuss this recommendation at Thursday's meeting.
answer: |-
  **To**: National Replication Fund Methods Review Panel  
  **From**: [Your Name], Chair  
  **Date**: [Current Date]  
  **Subject**: Funding Recommendation for Application [ID] – Sequential Bayesian Replication of Priming Effect  

  ### Proposal Summary  
  The applicant consortium proposes a five-site replication of a priming effect using a sequential Bayesian design. Key elements include:  
  - Recruitment up to a pre-registered maximum sample size.  
  - Early stopping if the Bayes factor (BF) for the effect exceeds 10.  
  - Primary evidence: the BF itself.  
  - **Compromise offer**: An adversarial prior (centred on zero, scaled to half the original effect) with simulations showing a false-positive rate (FPR) ≤5% under this prior.  

  This aims to satisfy the Fund’s new **dual-reporting condition**, requiring:  
  1. Reporting of both a Bayes factor and a design-based error guarantee.  
  2. Pre-specification of stopping rules transparent under Bayesian and frequentist frameworks.  

  ### Key Concerns Raised  
  1. **Frequentist perspective**: Optional stopping invalidates error control; the 5% FPR guarantee under a prior does not satisfy the Fund’s requirement for calibrated frequentist error probabilities.  
  2. **Bayesian perspective**: Error probabilities are irrelevant to evidence; imposing frequentist requirements on a Bayesian design is incoherent.  

  ### Assessment Against Dual-Reporting Condition  
  The dual-reporting condition aims to ensure **transparency** and **rigor** by bridging frameworks, acknowledging the replication crisis and winner’s curse. The applicant’s compromise is a good-faith effort but falls short for two reasons:  
  1. **Prior-dependent "guarantee" is not design-based**:  
     - The 5% FPR simulation relies on the adversarial prior, making it a Bayesian (posterior) error rate.  
     - The Fund’s remit for "calibrated error control" refers to frequentist error probabilities (e.g., Type I error), which must hold under the null hypothesis without prior assumptions. The design’s stopping rule inflates frequentist error rates, and the prior-based simulation does not rectify this.  
     - **Strongest frequentist counter**: A guarantee contingent on a chosen prior cannot fulfill the Fund’s requirement, as it substitutes a posterior probability for a design-based frequentist property.  

  2. **BF and error probabilities serve distinct roles**:  
     - The Bayesian argument that "error probabilities are irrelevant once data are in" correctly notes that the BF measures evidence conditioned on observed data. However, the Fund’s dual-reporting condition explicitly demands a pre-data design guarantee to ensure reliability across the sequence of analyses.  
     - **Strongest Bayesian counter**: While error probabilities are not properties of the evidence, the Fund’s mandate includes pre-study design safeguards to mitigate false positives. The dual-reporting condition is not incoherent but pragmatic: it treats BF as evidence while requiring frequentist calibration as a check on design robustness.  

  The applicant’s design **does not meet the dual-reporting condition** because:  
  - The stopping rule (BF > 10) is transparent but lacks a frequentist error guarantee.  
  - The compromise FPR is prior-dependent, not design-based.  

  ### Recommendation: Defer for Revision  
  **Decision**: Defer funding pending revisions. Do not reject—the design addresses the winner’s curse and offers efficiency merits.  
  **Timeline**: Applicant to resubmit within **4 weeks**.  

  #### Required Revisions  
  To meet the dual-reporting condition, the applicant must:  
  1. **Pre-specify a frequentist stopping rule alongside the Bayesian rule**:  
     - Example: Stop if BF > 10 *or* if a frequentist sequential test (e.g., Pocock or alpha-spending) hits p < 0.05 at an interim analysis.  
     - Rationale: This allows early stopping while capping frequentist Type I error at ≤5% over all analyses. The BF remains primary evidence, but the frequentist rule provides the design-based guarantee.  

  2. **Retain the adversarial prior for BF computation**:  
     - This addresses effect inflation concerns and aligns with the applicant’s goals.  

  3. **Conduct a joint simulation**:  
     - Demonstrate that the **combined design** (Bayesian stopping + frequentist stopping) controls both:  
       - Bayesian FPR ≤5% under the adversarial prior.  
       - Frequentist Type I error ≤5% under the null.  
     - Pre-register simulation code and assumptions.  

  ### Why This Works  
  - **Frequentist concern addressed**: The frequentist stopping rule provides explicit error control under H0, independent of priors.  
  - **Bayesian concern addressed**: The BF remains the primary evidence; the frequentist rule is a secondary safeguard to satisfy the Fund’s remit.  
  - **Applicant’s goals preserved**: Early stopping is still permitted (via BF or frequentist threshold), and the adversarial prior tackles effect inflation.  
  - **Dual-reporting compliance**: Both frameworks are respected—BF as evidence, frequentist rule as design guarantee.  

  ### Why Not Fund As-Is?  
  The compromise’s prior-dependent FPR does not equate to frequentist error control. Funding without revision would:  
  - Violate the Fund’s calibrated error requirement.  
  - Set a precedent weakening the dual-reporting condition.  

  ### Why Not Reject?  
  The proposal innovatively addresses the replication crisis via sequential efficiency. Revision is feasible and aligns with Fund principles.  

  ### Final Note  
  This recommendation navigates the dispute by enforcing the dual-reporting condition’s intent without privileging either framework. It respects the Bayesian’s evidence-centric view while upholding the frequentist’s demand for design robustness.  

  **Action**: Panel to discuss and endorse revisions at Thursday’s meeting. Applicant resubmission due by [Date + 4 weeks].  

