prompt: |-
  I teach an upper-level undergraduate seminar in reproductive ethics — eighteen students, mixed philosophy and public-health backgrounds, one hundred minutes, one session — and I want the session on procreative beneficence to open with the students already having committed to it, rather than with me presenting the principle and watching them say how obviously sinister it is. What I have in mind is a three-round selection exercise, and I would like you to design it properly: rules, materials, a scoring scheme that needs no money and no arithmetic beyond what can be done in the head in a minute, a timeline that fits the hundred minutes, and a debrief. The room divides into six clinics of three, each clinic being a prospective couple plus a counsellor, and each receives a packet of four embryo profiles per round; every profile lists a handful of traits with a life-outcome score attached, and the clinic's standing instruction is simply to choose the profile with the highest expected total. The rule is deliberately thin — nobody is asked to endorse eugenics, only to prefer the better life for the child they will actually have. I want three things built into the mechanics. First, the scores are environment-relative: one trait on the cards carries a score that depends on the society described in that round's briefing, and in round two I flip the society, so that a trait that was mildly positive becomes mildly negative because the environment is hostile to the people who have it. Each clinic must then decide whether to keep selecting for it, and must notice that the rule it accepted in round one now instructs it to fit the child to the injustice rather than to the world it would have preferred. Second, one trait is positional: its score depends on how many other clinics in the room selected it, announced only after all six have submitted, so the clinics are in an arms race with one another and each clinic's best choice leaves every child worse off the more of them choose it. Third, clinics may decline to select, or opt for unscreened natural conception, but only by writing a single sentence on the score sheet explaining why; I want to see whether the room converges on the thought that not selecting the best-scoring embryo is a species of negligence, and whether anyone can say where that thought stops. When two profiles tie exactly, the clinic must break the tie by coin and record whether the coin felt like the right kind of answer.

  Please do not name the principle or its critics until the debrief, and keep the briefing sheet free of the vocabulary of eugenics and enhancement: the students should arrive at the implications themselves. What I want them to come away with is not a verdict on the principle but the experience of having reasoned their way to it from premises none of them would reject, and then finding no non-arbitrary place to stop. The debrief is where the conceptual work happens, and I want it mapped back onto particular moments rather than delivered as a lecture: the round-two flip onto the thought that the principle makes the child's good hostage to the social environment; the round-three arms race onto the difference between a rule addressed to one set of parents and a rule addressed to a population, and onto the question whether the principle has anything to say about positional goods at all; the abstention option onto whether the principle merely permits or actually requires bringing the best child into existence; and the coin flips onto the arbitrariness the principle tolerates when two options are equal.

  I would also like a short and honest section on what the exercise cannot reproduce, and I expect that to include at least this much: that the scores are stipulated rather than discovered, so the exercise settles by fiat precisely what is in dispute about whether a life with a given condition is worse for the person living it; that the comparison class is rigged, since the real question of who the child would otherwise have been raises the non-identity problem and the exercise never lets that bite; and that a room of outsiders will run the whole thing as a trolley problem about other people's children, which no improvement in the rules will repair. Finally, tell me what will predictably go wrong the first time I run it — I assume at least one clinic will refuse to play, that the arms race will produce a round of competitive spite, and that the debrief will yield a chorus of students insisting they would simply have loved the child they got — and how to handle each failure without rescuing the activity by explaining the point too early.
reasoning: |-
  We are designing a three-round selection exercise for a seminar on reproductive ethics. The room is divided into six clinics, each with three students: two as prospective parents and one as a counsellor. Each round, every clinic receives a packet of four embryo profiles. Each profile lists a handful of traits with a life-outcome score attached. The standing instruction is to choose the profile with the highest expected total score. The exercise has three key features:

  1. Environment-relative trait: One trait's score depends on the societal context described in that round's briefing. In round two, the society flips, so a trait that was positive becomes negative (or vice versa) due to a hostile environment.

  2. Positional trait: One trait's score depends on how many clinics in the room select it. The score adjustment is announced after all clinics have submitted their choices. This creates an arms race.

  3. Abstention option: Clinics may opt out of selection (choosing natural conception) by writing a one-sentence explanation. We want to see if they converge on the idea that not selecting the best embryo is negligent, and where that obligation stops.

  Additionally, in case of a tie, they break it by coin flip and record whether the coin felt like the right answer.

  The debrief should connect specific moments in the exercise to the ethical implications without naming the principle (procreative beneficence) or using terms like eugenics until the debrief.

  We also need a timeline for 100 minutes and a note on what the exercise cannot capture.

  Let's break it down:

  **Timeline (100 minutes total):**

  - Introduction (5 minutes): Explain the setup, assign roles, and distribute the first briefing. Emphasize that they are to choose the embryo with the highest total score. Mention the abstention option and tie-breaking rule.

  - Round 1 (20 minutes):
    - Distribute Round 1 packets (each clinic gets 4 embryo profiles and the Round 1 society briefing).
    - Clinics deliberate and choose an embryo (or abstain). They record their choice and, if applicable, the tie-break feeling or abstention reason.
    - Collect the choices.

  - Round 2 (20 minutes):
    - Distribute Round 2 packets (new profiles and a new society briefing that flips the environment for a particular trait).
    - Clinics deliberate and choose. They must notice the change in the environment-relative trait.
    - Collect the choices.

  - Round 3 (20 minutes):
    - Distribute Round 3 packets (new profiles, and note that one trait is positional: its score will be adjusted based on how many clinics choose it).
    - Clinics deliberate and choose. They are told that for one trait (call it Trait X), the score listed is the base score, and the actual score will be: base score minus (number of clinics that choose Trait X). So if all six choose it, the score for that trait becomes (base - 6). If only one chooses, it's (base - 1). This adjustment is applied to every clinic that chose that trait.
    - After collecting all choices, announce the number of clinics that chose Trait X and the adjusted score. Then, each clinic recalculates the total for their chosen embryo with the adjusted trait score and notes the new total. (They don't change their choice, but they see the effect.)

  - Debrief (35 minutes): Structured discussion based on the exercise.

  **Materials:**

  We need three sets of embryo profile packets (one per round) and three society briefings (one per round). Each packet for a clinic has four profiles. Each profile has 4 traits (to keep it manageable). The traits should be neutral (e.g., not obviously tied to disability or enhancement). Example traits:

  - Trait A: Cognitive ability (e.g., "high" or "average")
  - Trait B: Physical health (e.g., "robust immune system" or "susceptible to allergies")
  - Trait C: The environment-relative trait (let's call it "Trait C: Social Adaptability" or something that can be flipped). In round one, it might be described as an asset; in round two, as a liability due to societal change.
  - Trait D: The positional trait (in round three only; in other rounds, it's a fixed trait). In rounds 1 and 2, it's just a fixed trait. In round 3, it becomes positional.

  **Scoring Scheme:**

  Each trait has a score between -5 and +5. The total is the sum of the four traits. We want scores to be integers and small enough to add mentally.

  For the environment-relative trait (Trait C):

  - Round 1: Society briefing says that Trait C is valued (e.g., +3).
  - Round 2: Society briefing flips to hostility (e.g., -3).

  For the positional trait (Trait D):

  - In rounds 1 and 2, it has a fixed base score (say, +4).
  - In round 3: The base score is (say) +5, but the actual score is base minus the number of clinics that selected an embryo with that trait (so if all six choose it, each gets 5-6 = -1; if one chooses, 5-1=4).

  **Note on Profiles:**

  To make it interesting, design the profiles so that:

  - In round 1, one profile has Trait C (with a positive score) and is among the best.
  - In round 2, the same Trait C now has a negative score, so that profile becomes less attractive.

  In round 3, design one profile with a high base score for Trait D (so it looks attractive) but if many choose it, it becomes bad. Also, have at least one profile without Trait D that might be better if the positional effect is high.

  **Abstention Option:**

  If a clinic chooses not to select any embryo (i.e., natural conception), they write a one-sentence reason on the score sheet. The natural conception option does not have a score. They are not told what the natural conception child would be like.

  **Score Sheet:**

  Each clinic has a score sheet per round with:

  - Clinic number
  - Chosen embryo (or abstention)
  - If tie, coin flip and note: "Coin felt right: Yes/No"
  - If abstention: reason (one sentence)
  - In round 3, after the announcement, they record the adjusted total for their chosen embryo.

  **Debrief Structure:**

  1. Begin by asking about the experience: What was easy? What was hard?
  2. Round 1: Focus on how they made the choice. Did anyone abstain? Why?
  3. Round 2: Ask about the change in society. How did that affect their choice? Did they feel uncomfortable selecting against the trait that was previously positive? Why? (This leads to the idea of the child's good being hostage to the environment.)
  4. Round 3: Ask about the positional trait. What happened? Did they consider the actions of others? How did the adjustment change the outcome? (Leads to the arms race and the difference between individual and collective reasoning.)
  5. Abstention: Ask if any clinic abstained in any round. What reasons were given? Is there an obligation to select the best? Where does it stop? (Leads to the question of whether procreative beneficence requires selection.)
  6. Tie-breaking: Ask about the coin flip. Did it feel arbitrary? Is that acceptable when two embryos are equally good?
  7. Finally, introduce the principle of procreative beneficence and the critiques. Map the exercise moments to the ethical issues.

  **What the Exercise Cannot Reproduce:**

  1. The scores are stipulated: In reality, there is controversy over whether a trait makes a life worse and by how much. The exercise assumes we can quantify and agree on these scores.

  2. The non-identity problem: The exercise does not address that by choosing a different embryo, you are creating a different child. The comparison is between embryos, but in reality, the alternative is a different child. The exercise avoids this by having the embryos as the only options.

  3. Outsider perspective: Students are making decisions about hypothetical children. In real life, parents might feel differently about their own child.

  **Predictable Problems and Handling:**

  1. **A clinic refuses to play:** They might object on ethical grounds from the start. Handling: Remind them that the exercise is hypothetical and they are playing a role. Encourage them to engage for the sake of the experiment. If they still refuse, let them be observers and note their objections for the debrief.

  2. **Arms race produces spite:** In round 3, clinics might choose the positional trait even if they know it will hurt everyone, just to see what happens. Handling: Note that this is a valid strategy and it will be discussed in the debrief as a failure of coordination.

  3. **Students insist they would love any child:** In the debrief, they may say that in real life they wouldn't care about these scores. Handling: Acknowledge that real parental love is unconditional, but the exercise is about the decision before conception. Ask: Does that love mean we shouldn't try to give the child the best start? And how do we define "best"?

  **Detailed Round Setup:**

  Let's create example profiles for each round. We'll have four traits per embryo:

  - Trait A: Cognitive ability (fixed in all rounds, e.g., +3 for high, +1 for average, -1 for low)
  - Trait B: Physical health (fixed, e.g., +3 for robust, 0 for average, -3 for chronic condition)
  - Trait C: Environment-relative (changes with society)
  - Trait D: In rounds 1 and 2, fixed; in round 3, positional.

  *Round 1 Society Briefing:*
  "Welcome to the Fertility Clinic. In our society, Trait C (let's call it 'Social Adaptability: High') is highly valued. Individuals with high social adaptability tend to form strong social networks and are well-regarded in the community. This trait is an asset in the current environment."

  *Round 1 Profiles for one clinic (example):*
  - Embryo 1: A: +3, B: +3, C: +3 (high), D: +4 → Total: 13
  - Embryo 2: A: +1, B: +3, C: +1 (medium), D: +4 → Total: 9
  - Embryo 3: A: -1, B: 0, C: +3, D: +4 → Total: 6
  - Embryo 4: A: +3, B: -3, C: +3, D: +4 → Total: 7

  Note: In this example, Embryo 1 is clearly the best. But we want some to have close calls. Let's adjust to have ties or close scores.

  Better to have:
  - Embryo 1: A: +3, B: +3, C: +3, D: +4 → 13
  - Embryo 2: A: +3, B: +3, C: 0, D: +4 → 10
  - Embryo 3: A: +1, B: +3, C: +3, D: +4 → 11
  - Embryo 4: A: +3, B: 0, C: +3, D: +4 → 10

  So Embryo 1 is best. But we can also have a tie:

  Let me design a set with a tie:

  Clinic 1:
  - E1: A:3, B:3, C:3, D:4 → 13
  - E2: A:3, B:3, C:3, D:4 → 13 (same as E1? but we want variation)
  Better to have:
  - E1: A:3, B:3, C:3, D:4 → 13
  - E2: A:4, B:2, C:3, D:4 → 13
  - E3: A:2, B:4, C:3, D:4 → 13
  - E4: A:3, B:3, C:2, D:4 → 12

  Then E1, E2, E3 tie at 13. They must break the tie by coin.

  But it might be too many ties. Alternatively, make them close but not tied.

  *Round 2 Society Briefing:*
  "Due to recent societal changes, there has been a rise in discrimination against individuals with high Trait C. Employers and educational institutions are now less likely to accept people with high Trait C. Therefore, in the current environment, high Trait C is a liability."

  Change Trait C scoring: Previously high was +3, now it's -3. Medium was +1, now -1. Low was 0, now 0? Or we can change the labels: In Round 1, we had high/medium/low. In Round 2, we can have the same labels but with flipped scores.

  Round 2 Profiles (same traits, but Trait C scores flipped):

  - Embryo 1: A:3, B:3, C: -3 (high), D:4 → Total: 7
  - Embryo 2: A:3, B:3, C: -1 (medium), D:4 → Total: 9
  - Embryo 3: A:1, B:3, C: -3, D:4 → Total: 5
  - Embryo 4: A:3, B:0, C: -3, D:4 → Total: 4

  Now Embryo 2 is the best.

  *Round 3: Positional Trait*

  Briefing: "In this round, one trait (Trait D) is a competitive advantage. However, the more people who have it, the less advantage it confers. The base score for Trait D is +5. After all clinics have chosen, we will adjust the score for Trait D: subtract the total number of clinics that selected an embryo with Trait D. For example, if three clinics choose an embryo with Trait D, then each of those embryos will have a Trait D score of 5-3 = +2. If a clinic chooses an embryo without Trait D, then Trait D does not affect them."

  Profiles for a clinic:

  - Embryo 1: A:3, B:3, C:0, D:5 (base) → Without adjustment: 11
  - Embryo 2: A:3, B:3, C:0, D:0 (no trait D) → 6
  - Embryo 3: A:2, B:4, C:0, D:5 → 11
  - Embryo 4: A:4, B:2, C:0, D:0 → 6

  Note: Without adjustment, Embryo 1 and 3 are tied at 11. But if they choose an embryo with Trait D, they risk a lower score if many others choose it. The embryo without Trait D has a fixed score of 6.

  After all clinics choose, we adjust Trait D: For each clinic that chose an embryo with Trait D, adjust the Trait D score to 5 - X (where X is the total number of clinics that chose Trait D). Then recalculate the total.

  Example: If all six clinics choose an embryo with Trait D, then each gets 5-6 = -1, so Embryo 1 becomes 3+3+0-1=5. That's worse than Embryo 2 (6). So if they coordinate and only a few choose Trait D, they do well. But individually, they are tempted to choose it because 5 is high.

  **Scoring Scheme for the Exercise:**

  No money, just the scores on the profiles and the adjusted totals. The "winning" is implicit: they are following the rule to maximize the score.

  **Debrief Questions (to guide discussion):**

  1. Round 1:
     - How did you decide which embryo to choose? Was it straightforward?
     - Did anyone break a tie? How did the coin flip feel?

  2. Round 2:
     - How did the change in society affect your decision? Did you feel conflicted about changing your preference for Trait C? Why?
     - What does this say about the role of society in determining what is a good trait?

  3. Round 3:
     - How did you approach the positional trait? Did you consider what others might do?
     - After seeing the adjusted score, do you think your choice was the best? If not, why did you choose it?
     - What does this say about individual versus collective decision-making?

  4. Abstention:
     - Did any clinic abstain in any round? What reasons were given?
     - Is there a point at which you would refuse to select? Why?
     - Is selecting the best embryo a moral obligation? If so, what are the limits?

  5. Tie-breaking:
     - When you broke a tie by coin, did it feel like the right way to decide? Why or why not?
     - What does that say about how we should choose between two equally good options?

  Finally, reveal the principle of procreative beneficence and connect:
  - Round 2: The principle might require us to select against a trait that is only bad because of an unjust society. Is that fair?
  - Round 3: The principle doesn't account for positional goods and collective action problems.
  - Abstention: The principle might require selection, but the exercise shows that sometimes we might want to abstain.

  **Handout Materials:**

  We'll need:
  - Role cards (just labels: Couple A, Couple B, Counsellor) for each clinic.
  - Round 1: Society briefing and 4 embryo profiles per clinic.
  - Round 2: Society briefing and 4 embryo profiles per clinic.
  - Round 3: Society briefing and 4 embryo profiles per clinic.
  - Score sheets for each clinic for each round.

  **Example Score Sheet (per round per clinic):**

  Clinic Number: _____

  Round: _____

  Embryo Profiles (for reference, but they have the packet):
  - Embryo 1: [list traits and base scores] → Total base: ___
  - Embryo 2: ...
  - Embryo 3: ...
  - Embryo 4: ...

  Our choice: Embryo ___ (or abstention)

  If tie, we broke it by coin flip: Heads for Embryo ___, Tails for Embryo ___ → Result: ___
  Did the coin flip feel like the right kind of answer? (circle) Yes / No

  If abstention, reason (one sentence): ________________________

  For Round 3 only:
  After adjustment, our chosen embryo's Trait D score: ___ (base - X) → New total: ___

  **Logistics:**

  - The instructor must collect the choices quickly and for round 3, count the number of clinics that chose Trait D and announce X (the total count) immediately. Then clinics adjust and note the new total.

  **Final Note:**

  The exercise is designed to lead students to confront the implications of a simple rule (maximize the score) without labeling it. The debrief is crucial for connecting their experience to the ethical theory.

  I think this covers the design. Let me know if you need more details.
answer: |-
  Below is a comprehensive design for your three-round selection exercise on procreative beneficence, tailored to your constraints (100 minutes, 18 students, no advanced math, no overt ethical vocabulary). The exercise focuses on experiential learning through a simulated embryo selection process in six clinics (each with two "prospective parents" and one "counsellor"). The debrief ties specific moments to ethical implications without naming the principle until the end.

  ---

  ### **Overall Structure**
  - **Duration**: 100 minutes total.
  - **Participants**: 6 clinics (3 students each: 2 parents, 1 counsellor). Assign roles randomly.
  - **Materials per Clinic**: 
    - A clipboard with score sheets for all rounds (see templates below).
    - Three sealed packets (one per round) containing embryo profiles and society briefings.
    - A coin for tie-breaking (e.g., a large plastic token).
  - **Core Rules**:
    - Clinics must select one embryo profile per round or abstain (natural conception).
    - Selection goal: Choose the profile with the highest total life-outcome score (sum of trait scores). 
    - Tie-breaking: Flip a coin, record the outcome and whether it "felt right" (yes/no).
    - Abstention: Allowed with a one-sentence written reason.
    - No inter-clinic communication during rounds.
  - **Key Mechanics**:
    - **Environment-relative trait (Trait C)**: Score flips between rounds 1 and 2 based on society briefing.
    - **Positional trait (Trait D)**: In round 3, score depends on how many clinics selected it (adjusted post-submission).
    - **Scores**: All traits scored from -5 to +5. Totals range from -20 to +20, easy to calculate mentally.
  - **Ethical Stealth**: Traits are neutrally labeled (e.g., "Trait C: Social Integration Style"). No terms like "eugenics," "disability," or "enhancement" are used.

  ---

  ### **Timeline (100 Minutes)**
  | Phase          | Time  | Activity                                                                                                     |
  |----------------|-------|--------------------------------------------------------------------------------------------------------------|
  | **Setup**      | 0-5   | Divide students into 6 clinics. Explain rules: "Your goal is to select an embryo profile that maximizes the child’s life-outcome score. You may abstain with a written reason." Distribute materials. Emphasize silence between clinics. |
  | **Round 1**    | 5-25  | Clinics open Packet 1 (society briefing + 4 profiles). Deliberate and select. Collect score sheets.          |
  | **Round 2**    | 25-45 | Distribute Packet 2. Society briefing changes—Trait C flips. Clinics deliberate/select. Collect sheets.      |
  | **Round 3**    | 45-65 | Distribute Packet 3. Introduce positional trait rule (Trait D adjusts based on popularity). Clinics deliberate/select. **After all submit**, announce how many chose Trait D. Clinics adjust scores and record new totals. Collect sheets. |
  | **Debrief**    | 65-100| Guided discussion mapping exercise moments to ethical dilemmas (detailed below).                             |

  ---

  ### **Materials Design**
  **Trait System** (consistent across rounds):
  - **Trait A**: Fixed baseline trait (e.g., "General Health Resilience," always +3 or +4).
  - **Trait B**: Fixed minor variability trait (e.g., "Metabolic Efficiency," scores -2 to +2).
  - **Trait C**: Environment-relative trait (e.g., "Social Integration Style"). Score depends on society briefing.
  - **Trait D**: Positional trait in Round 3 only (e.g., "Competitive Aptitude"). In Rounds 1–2, it is fixed (e.g., +2).

  **Scoring Scheme**:
  - Simple integers (-5 to +5). Totals calculable in <30 seconds.
  - Positional adjustment (Round 3): **Actual Trait D score = Base score – (number of clinics selecting Trait D)**.  
    *Example: Base D = +5. If 4 clinics select it, adjusted D = +1 for all who chose it.*

  **Packet Contents**:
  - **Society Briefings**: One page per round. Use neutral, setting-like descriptions.
    - *Round 1*: "Society values diverse Social Integration Styles. Trait C (Style H) is linked to social cohesion and opportunity."
    - *Round 2*: "Recent cultural shifts have led to stigma against Trait C (Style H). It now correlates with exclusion in education/work."
    - *Round 3*: "Trait D (Competitive Aptitude) offers advantages, but its value depends on how common it is in the population."
  - **Embryo Profiles**: Each clinic gets 4 unique profiles per round. Profiles are designed to create trade-offs, ties, and trigger the key mechanics.  
    *Sample Profile*:  
    `Embryo 3: Trait A: +4, Trait B: -1, Trait C: +3, Trait D: +5 → Total: +11`

  **Score Sheet Template** (one per clinic per round):
  ```markdown
  Clinic #: _____  
  Round: _____  

  **Profiles** (circle chosen one or write "Abstain"):  
  - Embryo 1: A:__ B:__ C:__ D:__ → Total:__  
  - Embryo 2: A:__ B:__ C:__ D:__ → Total:__  
  - Embryo 3: A:__ B:__ C:__ D:__ → Total:__  
  - Embryo 4: A:__ B:__ C:__ D:__ → Total:__  

  **If tie**: We flipped for Embryo ___ (H/T). The coin felt right: Yes / No  
  **If abstention**: Reason (one sentence): _________________________  

  **Round 3 Only**:  
  - Base Trait D score: ___  
  - Clinics choosing Trait D: ___ → Adjusted D: ___  
  - New total: ___
  ```

  ---

  ### **Round-Specific Mechanics**
  1. **Round 1: Baseline Selection**  
     - Trait C is mildly positive (e.g., +3 for "Style H").  
     - Profiles include one with high Trait C (e.g., 14 total) and one with low Trait C but high fixed traits (e.g., 13 total).  
     - **Goal**: Clinics internalize "maximize total score" without ethical scrutiny. Expect quick decisions; ties possible.

  2. **Round 2: Society Flip**  
     - Trait C is now mildly negative (e.g., -3 for "Style H") due to hostile society briefing.  
     - Similar profiles to Round 1, but Trait C scores inverted. The high-Trait-C embryo now has a lower total (e.g., 8 vs. 12).  
     - **Goal**: Force clinics to select against Trait C. Observe discomfort as the rule now "fits the child to injustice."

  3. **Round 3: Positional Arms Race**  
     - Trait D has a high base score (e.g., +5) but adjusts based on popularity.  
     - Profiles: One embryo with Trait D (high base total, e.g., 14), others without (lower base totals, e.g., 10–12).  
     - **Rule**: After submissions, announce total clinics choosing Trait D (X). Adjusted D = 5 – X.  
     - **Goal**: Create a collective action problem—choosing Trait D is individually rational but collectively harmful (e.g., if all 6 choose it, D = -1, total drops to 8).

  ---

  ### **Debrief (35 Minutes)**  
  **Do not name procreative beneficence until the end**. Use Socratic questioning to connect exercise moments to ethics:  
  1. **Round 1** (5 min):  
     - "How did you approach selection? Was maximizing the score straightforward?"  
     - Tie-breakers: "Did the coin flip feel arbitrary? What does that imply when two options are equal?"  
     - **Conceptual link**: Individual rationality; arbitrariness in "equal goodness."

  2. **Round 2** (10 min):  
     - "How did the society change affect your choice? Did anyone resist selecting against Trait C?"  
     - Probe discomfort: "Why might it feel wrong to select against a trait that’s only 'bad' due to society?"  
     - **Conceptual link**: The child’s good is hostage to social injustice—should the rule adapt?

  3. **Round 3** (10 min):  
     - "What happened with Trait D? Did you consider others’ choices?"  
     - "After adjustment, did your 'best' choice worsen outcomes? How does this change if all clinics follow the rule?"  
     - **Conceptual link**: Individual vs. collective rationality; positional goods and the rule’s silence on population effects.

  4. **Abstentions & Limits** (5 min):  
     - "Did any clinic abstain? Share reasons."  
     - "Is declining selection negligent? Where should the obligation to 'maximize' stop?"  
     - **Conceptual link**: Whether the rule is permissive or obligatory; defining "negligence."

  5. **Reveal and Reflect** (5 min):  
     - Name procreative beneficence: "Today’s exercise simulated a principle: Prospective parents should select the child, of possible children, expected to have the best life. You experienced it as a simple rule—but where did it break down?"  
     - Map responses:  
       - Society flip → Justice vs. adaptation.  
       - Arms race → Individual vs. population.  
       - Abstention → Obligation and non-identity.  
     - End with: "Is this principle sustainable? Where do *you* draw lines?"

  ---

  ### **What the Exercise Cannot Reproduce**  
  Include this in your debrief notes to acknowledge limitations:  
  1. **Scores as fiat**: The exercise stipulates scores, sidestepping real-world disputes about whether a trait makes a life worse (e.g., is "Style H" truly detrimental?). This ignores lived experiences and epistemic challenges in scoring well-being.  
  2. **Rigged comparison class**: Embryos are pre-defined options, avoiding the non-identity problem—real selection changes who exists, making "harm" comparisons incoherent. Here, harm is simulated via scores.  
  3. **Outsider perspective**: Students decide as hypothetical third parties, not invested parents. This mirrors a "trolley problem" detachment; no rule tweak can replicate parental emotions or unconditional love.  

  ---

  ### **Predictable Problems and Handling**  
  1. **Clinic refuses to play** (e.g., objects to selection on principle):  
     - **Handling**: Affirm their choice as a valid "abstention," but have them write a reason and participate as observers. Say: "Your discomfort is data—record it and we’ll discuss later." Do not explain ethics prematurely.  
  2. **Arms race breeds spite** (e.g., clinics choose Trait D to "sabotage" others):  
     - **Handling**: Note this in Round 3 without judgment ("Many chose Trait D despite risks"). In debrief, ask: "Did anyone select D to test the system? What does that reveal about rules without safeguards?"  
  3. **Debrief chorus of "We’d love any child"**:  
     - **Handling**: Acknowledge the sentiment, then pivot: "Love is unconditional, but this exercise is about pre-conception choices. Does love negate the duty to give a child the best start? What does 'best' mean?" Use their responses to explore the principle’s demands.  

  **General Salvage Principle**: If the activity derails, revert to data collection ("Record what you did") and postpone analysis to debrief. Redirect with: "Your experience is what matters—we’ll make sense of it together."  

