answer: |-
  Below is a structured decision procedure for screening proposals that move public tasks between levels of government (municipal, regional, state, supranational). The procedure is designed for efficiency (30–40 proposals per session, ~1 hour each) and rigor, with clear distinctions to prevent conceptual collapse. It prioritizes early failure points to avoid wasted effort and includes handoffs to elected members for value judgments. Analysts must document all steps for transparency, and the procedure explicitly addresses potential assessor bias.

  ### Core Principles Embedded
  1. **Subsidiarity vs. proportionality**: 
     - **Subsidiarity** determines the *level* (presumption for the lowest feasible level; higher levels act only when necessary).
     - **Proportionality** assesses the *measure* at that level (least intrusive means; benefits outweigh costs).
  2. **Key distinctions**:
     - **May act vs. must act**: Higher levels "may act" only when necessary; they "must act" if lower levels fail and no alternatives exist.
     - **Allocation vs. manner**: Moving a *task* (allocation) is distinct from regulating *how* it is executed (manner). Analysts must isolate the task.
     - **Presumption vs. duty**: Presumption against higher-level action, but a duty to assist (not take over) if lower levels struggle.
  3. **Reversibility test**: 
     - Favors **lower levels** if reversal is cheap (e.g., policy tweaks, temporary programs).
     - Favors **higher levels** if irreversible (e.g., infrastructure, binding standards, multi-decade investments).
     - **Application**: Analysts assess based on historical analogues (e.g., similar laws/standards) and design features (e.g., sunset clauses). Avoid forecasting by focusing on institutional or physical constraints. **Misleads** when: (a) political/social lock-in exists despite technically reversible design (e.g., a reversible tax that becomes entrenched); (b) short-term decisions have long-term path dependencies (e.g., a small standard enabling monopolies).
  4. **Assessor bias mitigation**: 
     - Analysts must declare if a proposal affects the level of their own body (e.g., strengthens/weakens it) or is a contested part of the decentralization settlement. 
     - In such cases: (a) document the conflict; (b) double-source evidence; (c) if bias could influence a close call, flag it for elected members. Bias does not automatically cause handoff—only if it risks distorting factual analysis.

  ---

  ### Decision Procedure: Questions, Order, and Thresholds
  **Key**:
  - ✅ **Sufficient answer**: Proceed to next step.
  - ⛔ **Failure stop**: Proposal fails subsidiarity; reject or return for revision.
  - ⚠️ **Handoff to elected members**: For value judgments (marked below). Analysts summarize evidence but do not decide.
  - **Time saver**: Steps 1–4 filter out clear failures early.

  | Step | Question                                                                 | Sufficient Answer ✅ | Failure Stop ⛔ | Handoff ⚠️ | Rationale for Handoff/Notes |
  |------|--------------------------------------------------------------------------|---------------------|-----------------|----------|-----------------------------|
  | 1    | **Task identification**: What is the specific public task, and at what level is it currently allocated? | Clear, unambiguous description of the task and its current level (e.g., "water quality monitoring in River Basin X is regional"). | Task or current level is undefined, contradictory, or too vague (e.g., "improve sustainability"). | None | Ensures focus on *allocation*, not manner. |
  | 2    | **Proposed change**: What level is the task moved to, and is this a full reallocation or only manner regulation? | Explicit statement of target level and confirmation it is a *task* move (not just setting standards/funding for execution). | Proposal only regulates *manner* (e.g., "set curriculum standards" without moving education task) or target level is unclear. | None | Prevents collapse of allocation vs. manner. |
  | 3    | **Effects analysis**: What are the task’s effects? (e.g., spillovers, economies of scale, interdependent risks) | Evidence of effects (e.g., data on cross-border impacts, cost-benefit analysis). | No effects beyond the lower level *and* no economies of scale. ⛔ **Stop: Failure** (presumption for lower level). | None | Factual; uses existing data (no forecasting). |
  | 4    | **Reversibility test**: Can the decision be cheaply undone? What are the lock-in risks? | Assessment based on: (a) historical analogues (e.g., similar levies/repeals); (b) design features (e.g., sunset clauses); (c) infrastructure/standards lifespan. | None directly; informs Steps 5–7. | None | Factual; avoids forecasting by using past cases. |
  | 5    | **Lower-level capacity**: Can the losing level perform the task effectively alone? (Legal authority + administrative/financial capacity) | Evidence of capacity (e.g., budgets, institutional reviews, audits). | Lower level **can** perform effectively *and* effects are purely local (from Step 3). ⛔ **Stop: Failure** (presumption against higher level). | None | Factual. "Effectively" = adequate, not perfect. |
  | 6    | **Necessity of higher action**: If lower level cannot perform (Step 5), could coordination/assistance avoid moving the task? | Evidence on feasibility of: (a) lower-level coordination (e.g., treaties, compacts); (b) higher-level assistance (e.g., funding, expertise) without takeover. | Lower level **cannot** perform, but alternatives exist. ⛔ **Stop: Failure** (duty to assist, not take over). | If evidence on alternatives is thin/contested. ⚠️ **Handoff** | **Value judgment**: Weighing alternatives involves trade-offs (e.g., efficiency vs. autonomy). |
  | 7    | **Cross-border necessity**: If lower level *can* perform (Step 5) but effects are cross-border (Step 3), can coordination solve it? | Evidence that coordination is impossible (e.g., failed attempts, high transaction costs, urgency). | Lower level **can** perform *and* coordination is feasible. ⛔ **Stop: Failure** (no necessity). | If feasibility of coordination is debatable. ⚠️ **Handoff** | **Value judgment**: Assessing "feasibility" may require political/pragmatic weighing. |
  | 8    | **Proportionality check**: If task passes subsidiarity (Steps 5–7), is the measure the least intrusive to achieve the goal? | N/A. Analysts only summarize evidence for elected members. | None. Always handoff after subsidiarity passed. | Always. ⚠️ **Handoff** | **Value judgment**: Balancing necessity, suitability, and cost-benefit is inherently political. |

  ---

  ### Application to Three Proposals
  **Assumptions**: 
  - Analysts have limited time; evidence is from proposal documents and quick database checks.
  - Reversibility uses analogues (e.g., similar laws, infrastructure projects).

  #### Proposal 1: Supranational minimum standard for health record portability
  - **Step 1 (Task)**: Task = "Ensure health records are portable across borders." Current level = National (each state sets own standards). ✅  
  - **Step 2 (Change)**: Move to supranational level. Full reallocation. ✅  
  - **Step 3 (Effects)**: Clear cross-border effects (e.g., patient mobility, pandemics). ✅  
  - **Step 4 (Reversibility)**: Standards often lock in (e.g., IT systems, data laws). Reversibility low → favors higher level. ✅  
  - **Step 5 (Capacity)**: National level *can* perform task (many states have digital systems). Effects are cross-border → skip to Step 7. ✅  
  - **Step 7 (Cross-border necessity)**: Coordination (e.g., mutual recognition treaties) is possible (e.g., precedents in trade). Evidence shows attempts but high costs/fragmentation. **Mixed evidence** → ⚠️ **Handoff to elected members** (value judgment on coordination feasibility).  
  - **Outcome**: Subsidiarity unresolved by analyst. Proportionality (Step 8) handed off.

  #### Proposal 2: National curriculum requirement binding regional schools, with funding conditions
  *(You favor this, but procedure must run impartially)*  
  - **Step 1 (Task)**: Task = "Set core curriculum." Current level = Regional (regions design curricula). ✅  
  - **Step 2 (Change)**: Move to national level. Proposal conflates allocation and manner? Analyst isolates task: "Setting curriculum" is moved (allocation), not just funding/execution. ✅  
  - **Step 3 (Effects)**: Cross-border effects claimed (e.g., labor mobility, national cohesion). Evidence: Student migration data exists. ✅  
  - **Step 4 (Reversibility)**: Curriculum changes reversible (e.g., can be amended regionally later) but lock-in via textbooks/teacher training → medium reversibility. ✅  
  - **Step 5 (Capacity)**: Regions *can* perform task (have education departments). Effects cross-regional → skip to Step 7. ✅  
  - **Step 7 (Cross-border necessity)**: Coordination feasible? Evidence: Regions have cooperated on standards (e.g., via councils) but inconsistently. **Mixed evidence** → ⚠️ **Handoff to elected members** (value judgment on coordination feasibility).  
  - **Outcome**: Subsidiarity unresolved by analyst. Proportionality (Step 8) handed off (e.g., is funding condition too intrusive?).

  #### Proposal 3: Regional levy on shared river basin (region lacks capacity; higher level silent)
  - **Step 1 (Task)**: Task = "Impose levy for river basin management." Current level = Regional. ✅  
  - **Step 2 (Change)**: *No move proposed.* Higher level is inactive. Analyst reinterprets: Implicit proposal for state to take over task. ✅  
  - **Step 3 (Effects)**: Cross-border effects (e.g., pollution, water rights across regions). ✅  
  - **Step 4 (Reversibility)**: Levies reversible, but if funding infrastructure (e.g., dams), lock-in high → favors higher level. ✅  
  - **Step 5 (Capacity)**: Region has legal power but lacks administrative capacity (evidence: audits show staffing gaps). Cannot perform → skip to Step 6. ✅  
  - **Step 6 (Assistance alternatives)**: Alternatives exist (e.g., state provides technical aid or creates regional joint body). Evidence: Other basins use such models. ✅ → ⛔ **Stop: Failure** (duty to assist, not take over).  
  - **Outcome**: Proposal fails subsidiarity. No handoff.

  ---

  ### What the Procedure Cannot Do
  The procedure is a screening tool, not a substitute for political judgment. It will misfire when:

  1. **Necessity cannot be pre-tested**: 
     - Novel crises (e.g., pandemics) with no analogues for evidence.
     - "Nothing less will do" claims (e.g., Proposal 1) that rely on speculative futures.

  2. **Lower-level pathologies**: 
     - **Legal fiction**: Lower level exists on paper but lacks resources/autonomy. Procedure assumes functionality.
     - **Capture**: Lower level is corrupted or controlled by elites. Analysts lack mandate/tools to assess.

  3. **Community boundaries disputed**: 
     - When the "natural" community for a task is contested (e.g., a river basin split culturally). Analysts rely on existing jurisdictions.

  4. **Reversibility misapplied**: 
     - Ignores behavioral lock-in (e.g., a "reversible" policy that becomes entrenched due to norms).
     - Fails on innovations with no historical parallels.

  5. **Interdependence complexity**: 
     - Tasks with multi-level spillovers (e.g., climate policy) where no single level is optimal.

  ### Residual Questions for Elected Members
  These require value-based weighing and cannot be resolved by procedural ordering:
  1. **Subsidiarity dilemmas**: 
     - When evidence for necessity (Steps 6–7) is balanced, which level *should* act?
     - How much inefficiency/risk justifies overriding local autonomy?

  2. **Proportionality**: 
     - Is a measure "least intrusive" enough (e.g., is conditional funding in Proposal 2 coercive)?
     - Do benefits (e.g., unity in Proposal 2) outweigh costs (e.g., regional discontent)?

  3. **Duty vs. presumption**: 
     - When should higher levels assist (without taking over) vs. accept lower-level failure?

  4. **Reversibility trade-offs**: 
     - How much weight to give lock-in risks vs. local experimentation?

  5. **Bias acknowledgment**: 
     - How to balance the assessor body’s institutional interests against the common good?

  The procedure forces analysts to clarify facts and isolate value conflicts, but elected members must resolve ambiguities in line with political philosophy and the decentralization settlement. This ensures subsidiarity is more than a gesture—it becomes a disciplined, evidence-based framework.
