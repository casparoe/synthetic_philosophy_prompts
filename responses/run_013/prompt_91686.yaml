  We are going to create a poem that illustrates Simpson's paradox with a twist: the grouping variable is downstream of the treatment. 
  We'll invent a scenario: a company testing two training programs (Program A vs. Program B) for employees. The company assigns employees to the programs, but the assignment is influenced by the employees' initial performance. 

  Scenario:
  - Program A is assigned to high-performers and Program B to low-performers (because the company wants to give the high-performers the "premium" program and the low-performers the "remedial" one).
  - However, Program B is actually more effective for both high and low performers. But because Program A gets the high-performers (who are already better) and Program B gets the low-performers (who are worse), when we look at the overall success rate without grouping, Program A appears better.

  But note: the twist we want is that the grouping (by initial performance) is caused by the assignment? Actually, let me clarify: the assignment to the program is based on the initial performance. So the grouping variable (initial performance) is a pre-existing condition that affects both the assignment and the outcome. However, the request says: "the grouping variable is downstream of the thing being compared". 

  Wait, let me re-read: "rig the case so the grouping variable is downstream of the thing being compared — i.e. the comparison itself changes how many people end up in each group". 

  So we need the comparison (the treatment) to affect the grouping variable. How? 

  Let me think of a different scenario: a drug trial for two drugs (Drug A and Drug B) for a disease. But the drug assignment affects a downstream variable (say, severity of a side effect) that we then group by. 

  Example: 
  - We compare two drugs for curing a disease. 
  - Drug A causes a severe side effect in some patients, and Drug B causes it in fewer. 
  - We then group the patients by whether they had the severe side effect. 
  - Within each group (those with side effect and those without), Drug A has a higher cure rate. 
  - But overall, Drug B has a higher cure rate. 

  Why? Because Drug A causes the side effect in many patients, and having the side effect is associated with a lower cure rate (maybe because it weakens the patient). So even though Drug A is better in both subgroups (with and without side effect), overall it is worse because it causes more patients to end up in the "with side effect" group, which has a lower cure rate.

  Now, in this case:
  - The grouping variable (side effect) is downstream of the drug assignment (the treatment). 
  - The drug assignment causes the side effect (so it affects the group membership).

  Let's make up numbers:

  Total patients: 200

  Drug A:
  - 100 patients
  - Causes side effect in 60%: 60 patients
    - Cure rate with side effect: 40% (so 24 cured)
    - Cure rate without side effect: 80% (so 32 cured out of 40)
    - Total cured for Drug A: 24 + 32 = 56 (56%)

  Drug B:
  - 100 patients
  - Causes side effect in 20%: 20 patients
    - Cure rate with side effect: 50% (10 cured)
    - Cure rate without side effect: 90% (72 cured out of 80)
    - Total cured for Drug B: 10 + 72 = 82 (82%)

  So overall, Drug B is better (82% vs 56%). But in each subgroup (with side effect and without), Drug A has a lower cure rate? Wait, no: in our example, we want Drug A to have a higher cure rate in each subgroup? Let me adjust:

  Instead, let me set:

  Drug A:
  - With side effect (60 patients): 50% cure rate -> 30 cured
  - Without side effect (40 patients): 90% cure rate -> 36 cured
  - Total: 66 cured (66%)

  Drug B:
  - With side effect (20 patients): 40% cure rate -> 8 cured
  - Without side effect (80 patients): 80% cure rate -> 64 cured
  - Total: 72 cured (72%)

  Now, overall Drug B is better (72% vs 66%). But in the subgroup with side effect: Drug A (50%) > Drug B (40%). In the subgroup without side effect: Drug A (90%) > Drug B (80%). 

  So the refrain: "in every group it goes this way" meaning Drug A is better in both subgroups. But overall, Drug B is better.

  But note: the grouping variable (side effect) is caused by the drug. So the drug assignment affects the group membership.

  This is the structure we want.

  Now, the poem:

  We want about 18-20 lines. We'll have stanzas. The refrain at the end of each stanza (except the last) will say something like: "In every group, the first prevails". Then the last stanza will have the same refrain but then reveal the overall result which contradicts.

  But note: the last stanza should have the refrain and then show that it's false in the aggregate.

  We'll structure:

  Stanza 1: Introduce the trial: two drugs, A and B. Then the grouping by side effect. Then the results in the group with side effect: Drug A has higher cure rate. End with refrain.

  Stanza 2: The group without side effect: again Drug A has higher cure rate. End with same refrain.

  Stanza 3: Then we look at the overall. The refrain is repeated, but then we show the overall numbers: Drug B wins. And then the closing couplet explaining the twist.

  We'll make the refrain: "In every group, the first prevails" (meaning Drug A).

  But then in the last stanza, after the refrain, we say: "But in the whole, the second wins" and then explain why (because the first drug caused more side effects).

  Finally, the closing two lines: the lesson about cause and effect.

  Poem:

