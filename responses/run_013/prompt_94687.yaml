  First, I recall Fitch's paradox: if all truths are knowable, it leads to all truths being known, which is absurd. The key elements are the knowability principle (∀p (p → ◊Kp)), factivity (Kp → p), and distribution (K(p ∧ q) → (Kp ∧ Kq)). The problematic case is the unknown truth (p ∧ ¬Kp), which when assumed knowable leads to contradiction.

