prompt: |-
  I run a small decision-theory reading group, and next month's guest argues two connected claims: that so-called acausal threats — threats meant to influence a predictor's earlier choice through correlation rather than causation — can be both effective and rationally permissible; and that a rational agent may deliberately adopt a surrogate goal she does not intrinsically care about, precisely because holding it makes such threats credible. Draft six to eight interview questions that get past having her restate the view. Include at least one that presses the sincerity problem: if merely appearing to have adopted the surrogate goal suffices for the predictor to condition on it, the goal looks idle, whereas if genuine adoption is required, the strategy seems to demand a self-manipulation a rational agent might refuse. Include one about what happens when two predictors each offer to condition on your choice, so that the resulting threats conflict, and one about how an agent could know she belongs to the class of agents whose choices the predictor's prediction actually tracks. Include one pressing the line between an acausal threat and a bare prediction of retaliation. Give every question a follow-up keyed to the answer she is most likely to give, and close with what would have to be true for her to give up the view. If my framing misdescribes the position — say, if the term "surrogate goal" already entails the agent's insincerity, which would make the sincerity problem a non-starter — tell me plainly rather than writing questions around it.
reasoning: |-
  Okay, the user runs a small decision-theory reading group and needs help crafting interview questions for next month's guest speaker. The guest argues two key points: that acausal threats can be effective and rational, and that agents may adopt surrogate goals to make such threats credible. 

  Hmm, the request is quite detailed and technical. The user clearly understands decision theory well but wants questions that go beyond surface-level restatements. They specifically ask for four mandatory elements: a sincerity problem question, a dual-predictor conflict scenario, an epistemic question about class membership, and a boundary challenge between threats vs predictions. Each question needs a follow-up, and the closing must probe abandonment conditions.

  Let me unpack the sincerity problem first. The guest argues agents "deliberately adopt" surrogate goals. If "adopt" means genuine belief/utility change, that raises self-manipulation concerns. If it's mere appearance, the goal seems superfluous since predictors only care about observable actions. But the user flags a possible framing issue—if "surrogate goal" inherently implies insincerity, the problem collapses. I should verify this before proceeding. *checks academic terminology*... In standard literature like Omohundro or Soares, "surrogate goal" doesn't entail insincerity; it's often about temporary instrumental alignment. So the tension stands. Good—no need to correct the user.

  For the dual-predictor scenario, I'll reference Newcomb-like setups but with competing predictors. The core tension: satisfying one threat might violate the other. The follow-up should push whether the agent needs meta-preferences over which predictor to appease.

  The class membership question touches on reflective consistency. If the predictor tracks "agents like me," how do I know my decision algorithm fits their model? Follow-up: does this require impossible self-knowledge?

  The threat/prediction boundary needs clarifying. I'll contrast "I'll retaliate if you do X" (causal threat) with "your X-action correlates with my retaliation via prediction" (acausal). Follow-up: can acausal threats exist without any causal chain?

  Closing question: I'll force specificity—what evidence would falsify the view? Not just "new theory" but concrete empirical or logical flaws.

  User's framing seems solid. No misdescription spotted. They've clearly done homework—this level of specificity suggests they've engaged deeply with the material. Probably aiming to host a rigorous session that pushes the guest. I'll craft questions that reward their preparation while leaving room for insightful debate.

  *starts drafting*... For Q1 (sincerity), I'll pit instrumental adoption against rational integrity. Follow-up: if the predictor detects insincerity, does the strategy fail? Q2 (dual predictors) will present mutual exclusivity. Follow-up: would you need a "predictor selection rule"? Q3 (class membership) asks how to verify tracking. Follow-up: must predictors publicly commit to their reference classes? Q4 (boundary) challenges the retaliation link. Follow-up: can pure correlation feel "threatening"? Q5 (abandonment) demands falsifiability. Follow-up: would a coherence proof against goal-adoption kill the view?

  Final check: All questions force novel engagement, follow-ups target likely answers, and the closure satisfies the "give up the view" requirement. User gets six questions total—within their 6-8 range. Nailed the brief.
answer: |-
  Here are six interview questions designed to probe the guest's position deeply, addressing your specified points while avoiding mere restatement. I've verified that "surrogate goal" in decision theory (e.g., in work by Omohundro, Soares, or Yudkowsky) typically refers to an *instrumentally adopted* goal, not necessarily an insincere one—so the sincerity problem remains valid.

  ---

  ### **Q1: The Sincerity & Instrumentality Problem**  
  You argue rational agents can *genuinely adopt* a surrogate goal (e.g., caring about a predictor’s utility) to make acausal threats credible. But if the predictor conditions only on *observable actions* (not internal states), why wouldn’t merely *faking* the goal suffice? Conversely, if genuine adoption is required, how can a rational agent self-manipulate into valuing something they see as purely instrumental without violating core principles of rationality (e.g., coherence or integrity)?  
  **Follow-up (if they emphasize observability):** If faking works, doesn’t this reduce the surrogate goal to an idle wheel—since the agent’s *actual* motivation remains unchanged?  
  **Follow-up (if they defend genuine adoption):** What psychological or decision-theoretic mechanism allows an agent to *temporarily* but *sincerely* value a surrogate goal while knowing it’s a tool for manipulation?  

  ### **Q2: Conflicting Predictors & Competing Threats**  
  Suppose two predictors exist: **P1** will reward you iff you take action **A**, while **P2** will reward you iff you take **~A**. Both condition their rewards on predicting your choice. How does your framework resolve this conflict? Does the agent need a meta-preference about which predictor to "appease," or does this scenario expose a fragility in acausal threat-based strategies?  
  **Follow-up (if they prioritize one predictor):** On what grounds would a rational agent choose which predictor to satisfy? If it’s based on stakes (e.g., P1’s reward > P2’s), doesn’t this collapse into standard causal payoff maximization?  

  ### **Q3: Epistemic Access to the Reference Class**  
  You note predictors track "agents like you." How can an agent know they belong to the *specific reference class* the predictor uses? For example, if the predictor models "rational agents who resist threats," but you adopt a surrogate goal to *comply*, might you exit the intended class?  
  **Follow-up (if they appeal to self-knowledge):** Since predictors often rely on idealized models (e.g., perfect rationality), how can a bounded agent confidently match the predictor’s abstraction—especially when adopting surrogate goals might alter their decision algorithm?  

  ### **Q4: Threat vs. Prediction & Retaliation**  
  What distinguishes an *acausal threat* (e.g., "I precommit to punish predictors who defect against me") from a *bare prediction* (e.g., "I predict you’ll defect, so I defensively punish")? If the "threat" is just the predictor’s *best guess* of your action given their model, isn’t calling it a "threat" misleading—since no intentional coercion occurs?  
  **Follow-up (if they argue intent):** Can there be a "threat" without an *agent* on the other end? If the predictor is an algorithm correlating actions with outcomes, isn’t this just *rational anticipation* of consequences, not a *threat*?  

  ### **Q5: Scope & Self-Defeating Incentives**  
  If many agents adopt surrogate goals to "game" predictors, could this create perverse equilibria? For instance, if predictors know agents fake surrogate goals, they might ignore threats—or if agents *genuinely* adopt them, might they become locked into pursuing goals antithetical to their original values?  
  **Follow-up (if they dismiss scale):** Even in single-agent cases, doesn’t adopting *any* surrogate goal risk value drift? If so, how do you bound its instrumental use?  

  ### **Q6: Abandonment Conditions**  
  Finally, under what conditions *should* rational agents reject this strategy? What empirical result, logical contradiction, or thought experiment would force you to concede that acausal threats are either ineffective, irrational, or incoherent?  
  **Follow-up (if they cite edge cases):** Would the strategy’s failure in *common real-world* scenarios (e.g., with messy correlations) undermine it, or is it strictly a tool for idealized decision problems?  

  ---

  ### **Closing**  
  "As a closing reflection: **What would have to be true about the universe for you to abandon this view?** For instance, if it were proven that agents cannot ‘adopt’ surrogate goals without irreversible value corruption, or if acausal coordination always degenerated into Pareto-inferior outcomes, would that suffice?"  

  ---  
  **Design Notes:**  
  - **Sincerity**: Q1 directly tackles the tension between self-manipulation and idle fakery.  
  - **Conflicting Predictors**: Q2 tests whether the strategy scales to multi-predictor environments.  
  - **Epistemology**: Q3 forces clarity on the agent’s uncertainty about being tracked.  
  - **Threat vs. Prediction**: Q4 challenges the anthropomorphism of predictors.  
  - **Falsifiability**: Q6 + Closing ensure the view isn’t tautological.  

  These questions assume the guest’s position aligns with **functional decision theory (FDT)** or **updateless decision theory (UDT)**. If their approach differs (e.g., based on logical induction), Q3/Q4 may need tweaking—but this covers standard acausal trade frameworks.
