prompt: |-
  I teach a seminar on autonomy and influence, and the thing that keeps tripping me up isn't the textbook cases — it's a pattern I've started noticing everywhere and can't find a home for. Example one: in a department meeting last term, a colleague got me to change my vote on a hire. He never said anything false, never leaned on me, never even really argued — he just chose which of the files we looked at first, let a couple of silences run long, and asked the one question he knew would land. I changed my mind, and honestly I'd change it again; I still think the candidate he favored was better. And yet I came out of that room feeling handled, and I still do. Example two: my sister-in-law is a therapist, and she says flatly that she never manipulates her clients. But she absolutely picks which question to ask and when, which interpretation to float and which to sit on for a month, and she'd say that's just what competent practice is. Example three, the one that bothers me most: I write my exams in a particular order, and I know perfectly well that the order moves the answers around, and I keep doing it, because there's no non-moving order to use instead.

  Here's what I can't get a grip on. Everything I've read about manipulation seems to build in that the manipulator goes around the person's reasoning — plays on a bias, hides the real motive, applies pressure that isn't a reason. But in these cases nothing is bypassed. I reason, I weigh, I conclude, and the conclusion is one I endorse on reflection and would endorse again. It's the material I was handed that was chosen for me — the order, the salience, the timing, what got left in the drawer. And when I raise it, people say well, that's just persuasion, all persuasion is selective, you can't present every consideration at once, and by your standard every teacher and every friend is a manipulator. Which I don't accept, but I also can't say precisely why not, and that gap is what's eating at me.

  So: is there an established concept for influence of this shape — influence that runs through a person's rational capacities rather than around them, that survives their retrospective endorsement, and that nonetheless seems to compromise something? I don't want a label slapped on it; I want the carving. Where exactly is the line between this and ordinary selective persuasion, is the difference in the mechanism or in the outcome or in who's setting the terms, and does it come apart from nudging and from the usual manipulation literature in a way that earns its own name? If nothing established fits, coin something and give me the boundary cases — the ones where you'd say no, that's just teaching, or no, that's just conversation.
reasoning: |-
  Okay, the user is struggling with a nuanced concept in their seminar on autonomy and influence. They've noticed a pattern where influence isn't bypassing reason but carefully curating the information presented. Their examples include a colleague affecting a vote, a therapist's strategic questioning, and their own exam design affecting answers. They feel this isn't classic manipulation but still compromises autonomy, and existing frameworks don't capture it.

  First, I need to understand why current definitions fall short. Traditional manipulation involves deception or coercion, but here, everything is transparent, and the influenced person endorses the outcome. The user mentions that people dismiss this as mere persuasion, but they sense something more insidious. Their frustration is about pinpointing where ethical persuasion ends and problematic influence begins.

  Looking at their examples, the common thread is epistemic framing—controlling the structure of information flow. The colleague controls file order and silence, the therapist selects which questions to ask when, and the exam sequence shapes responses. All involve steering reasoning by managing the context, not the content itself. The influenced person engages rationally, but within boundaries set by another.

  The user's deeper need might be to articulate a concept that validates their intuition that autonomy is compromised even without irrationality bypass. They want to teach this distinction but lack the terminology. They might also seek ethical guidelines for when such framing is permissible, especially in roles like educators or therapists.

  Existing concepts like nudging focus on choice architecture but often for benign ends. Manipulation literature emphasizes undermining rationality. Here, rationality remains intact, but the epistemic terrain is shaped. Terms like "epistemic steering" or "structural influence" come to mind. The key difference from persuasion is covertness of the framing's intent. If the colleague stated, "I'm showing this file first to sway you," it might be overt persuasion. But the subtlety makes it feel manipulative.

  Boundary cases: A teacher structuring lessons to build concepts isn't problematic if the goal is understanding. But if the sequence hides counterevidence to push an agenda, it crosses the line. The therapist's case is trickier—therapy inherently guides, but if the framing serves the therapist's goal over the client's, it becomes problematic. The exam design is unavoidable, hence ethically neutral.

  The user needs clear criteria: Is the framer's intent aligned with the influenced person's goals? Is the framing transparent? Does it restrict access to relevant information? This could form the basis of a new conceptual framework, helping students analyze influence beyond traditional categories.
answer: |-
  What you're grappling with is profoundly insightful and cuts to the core of agency in a way much of the standard manipulation literature misses. You're right: the classic definitions (bypassing reason, exploiting irrationality, hidden motives, coercion) don't fit these cases. The influence occurs *through* your reasoning, with transparent information, and you endorse the outcome. Yet, it *feels* like something vital – perhaps *authorship* – was compromised. This absolutely deserves its own conceptual space. Let's carve it.

  **The Core Concept: Epistemic Steering**

  The established term that comes closest is **"Framing Effects"** (from psychology/behavioral economics), but this is often too passive and descriptive. What you're describing is an *active, strategic* use of framing with intent to influence. I propose **"Epistemic Steering"** as a more precise label for this specific phenomenon:

  *   **Epistemic:** Relating to the structure, flow, and accessibility of *knowledge* and *reasons* presented to the agent.
  *   **Steering:** The deliberate, strategic shaping of the *context* within which reasoning occurs, directing attention, salience, and the sequence of consideration without altering the raw facts or applying direct pressure.

  **The Carving: How Epistemic Steering Differs**

  1.  **Mechanism vs. Traditional Manipulation:**
      *   **Traditional Manipulation:** Targets the *agent's reasoning process* directly to *impair* or *bypass* it (exploiting biases, triggering emotions, hiding information, lying, coercing). The flaw is in *how* the agent thinks/judges.
      *   **Epistemic Steering:** Targets the *epistemic environment* the agent reasons *within*. It shapes the *material* (what info, when, how salient) presented *to* a fully functioning rational capacity. The flaw (if it is one) is in the *landscape* the agent navigates, not the navigation itself. The agent reasons soundly *given the presented landscape*.

  2.  **Outcome vs. Nudging & Persuasion:**
      *   **Nudging:** Aims to influence *choices* predictably *without forbidding options or significantly changing incentives*, often leveraging cognitive biases. Nudges frequently work *around* reason (e.g., default options). Epistemic Steering works *through* reason by structuring its inputs. Nudges often aim for easy/system 1 decisions; Steering engages system 2.
      *   **Ordinary Selective Persuasion:** Involves selecting *which arguments/reasons* to present, often overtly. The selectivity is usually *transparent as argumentation* ("Here are my strongest points..."). The agent knows they are being presented with a *case*.
      *   **Epistemic Steering:** Involves selecting *the sequence, salience, timing, and context* for encountering *facts or questions themselves*. The influence lies in *structuring the reasoning process before argumentation even begins*. The steering mechanism itself is often *opaque* to the agent in the moment (they don't realize *why* this file was first or *why* that silence mattered). Retrospective endorsement complicates the judgment of harm, but the feeling of being "handled" stems from recognizing this hidden structure *after the fact*.

  3.  **"Who Sets the Terms" - The Crux of Compromised Authorship:**
      This is the core of why it feels compromising even with rational endorsement. Autonomy isn't just about reasoning well *within* a given frame; it's also about having some agency *over the frame itself* or at least being aware of its contingent nature when reasoning.
      *   In Epistemic Steering, the *steerer* unilaterally sets the epistemic terms: the order of encounter, the weight of salience, the timing of prompts, the boundaries of the "relevant" information set. They design the maze you walk through rationally.
      *   You reason autonomously *within* the frame, but the *selection of the frame* was not yours, and its influence was likely hidden. This creates a disconnect between the reasoning *process* (yours) and the *initial conditions* that powerfully shaped its trajectory (theirs). You authored the *conclusion*, but they authored the *problem-space* that led to it. Retrospective endorsement affirms the conclusion was sound *given the frame*, but doesn't necessarily affirm that *this was the right frame to use* or that its selection was legitimate.

  **Boundary Cases: Where Steering Becomes Benign or Crosses into Manipulation**

  1.  **Just Teaching / Good Pedagogy (Benign Steering):**
      *   **Case:** A math teacher introduces concepts in a specific, scaffolded sequence (e.g., arithmetic before algebra, derivatives before integrals). This *heavily* steers the students' reasoning path. They couldn't grasp integral calculus meaningfully without this sequence.
      *   **Why Benign?** The frame (sequence) is chosen *transparently* for the *student's own epistemic development*, aligned with shared pedagogical goals. The goal is building robust understanding, not achieving a specific, pre-determined outcome desired solely by the teacher. The structure is often explicit ("We learn this first because it builds the foundation for that"). Students eventually gain tools to question and transcend the initial frame.

  2.  **Just Conversation / Collaborative Framing (Benign):**
      *   **Case:** Friends discussing where to eat. One says, "I'm really craving something warm and hearty, it's so cold out!" This makes soup/salads more salient without argument.
      *   **Why Benign?** The framing is relatively transparent (expressing a personal preference/context), low-stakes, easily countered ("I'm actually really hot, how about sushi?"), and occurs within a context of mutual respect and equal agency. The frame isn't fixed; it's fluid and co-created in dialogue.

  3.  **Crossing into Problematic Steering / Quasi-Manipulation:**
      *   **Case (Therapist):** A therapist *always* chooses questions that steer the client towards interpreting events through the lens of childhood trauma, systematically avoiding questions that might lead to interpretations focusing on current situational factors or client agency, *because the therapist has a strong theoretical bias*. The client reasons soundly within this frame and endorses the insights, but feels subtly led down one specific path.
      *   **Why Problematic?** The frame (childhood trauma as primary lens) is applied opaquely and unilaterally. While therapeutic competence involves selection, the selection here serves the *therapist's* theoretical commitment more than the *client's* unique needs and potential for self-discovery across multiple frames. It restricts the epistemic landscape in a way that compromises the client's authorship of their own narrative. The endorsement might be for insights *within the frame*, not for the *exclusive application of that frame*.

  4.  **Crossing into Blatant Manipulation:**
      *   **Case (Colleague - Malicious Version):** Your colleague knows Candidate A (their favorite) has a brilliant publication everyone will focus on, while Candidate B (your initial favorite) has a subtle, distributed strength across service and teaching. They ensure A's publication-heavy file is discussed first, letting the silence after its brilliance linger, then ask a devastatingly simple question about B's teaching philosophy that sounds weak in contrast. They deliberately suppress discussion of B's strengths and A's weaknesses hidden later in the files.
      *   **Why Manipulation?** Now it includes *hiding relevant counter-information* (material in the files). The steering isn't just selective presentation; it actively creates a *misleading* epistemic landscape by *concealing* crucial data. This bypasses reason by denying it access to key materials. The endorsement is based on a *curated subset* masquerading as the whole.

  **Why Your Examples Fit Epistemic Steering:**

  1.  **Colleague:** Set the *sequence* (which file first), controlled *salience* (the lingering silence amplifying the impact), and chose the *pivotal prompt* (the specific question). They structured the reasoning environment.
  2.  **Therapist:** Chooses *which question* and *when* (timing/sequence), *which interpretation to float* (salience/framing of possibilities). This structures the client's epistemic journey within the session.
  3.  **Your Exams:** You control the *sequence* of questions, knowing it influences answers. This is unavoidable epistemic steering inherent in linear presentation, usually benign because the goal is fair assessment, not achieving a specific answer distribution *per se*, and students ideally develop meta-cognition about sequencing effects.

  **The Gap You Feel: Compromised Authorship of the Frame**

  The "something" compromised is **epistemic authorship** or **framing autonomy**. You retained *conclusion authorship* ("I decided this candidate is best") but lost *problem-space authorship* ("I reasoned within a frame *designed by another* to lead me to a specific type of conclusion, without my awareness or consent regarding that design"). Retrospective endorsement affirms the conclusion was reasonable *given the frame*, but doesn't resolve the ethical unease about *how that frame came to be imposed* and whether alternative frames could have led to different, equally reasonable conclusions. This is why it feels different from transparent persuasion (where the frame *is* the argument being made) or benign teaching (where the frame is openly designed for your development).

  Epistemic steering highlights that rational autonomy isn't just about *how* we think, but also about *the ground upon which our thinking stands*, and who gets to lay that ground. Your seminar now has a fascinating new frontier: the ethics of structuring the very landscape of reason itself.
