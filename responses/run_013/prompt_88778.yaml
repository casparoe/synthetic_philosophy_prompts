  ## INTEROFFICE MEMORANDUM  
  **To:** BCVM Staff & Affiliated Coders  
  **From:** Dr. A. Finchley, Director, Bureau of Consolidated Violence Metrics (BCVM)  
  **Date:** October 26, 2023  
  **Subject:** Release of Revised Standard Coding Manual (Edition 7.2)  

  Per the mandate established in the Global Accord on Metric Harmonization (GAMH-2004), the Bureau is pleased to disseminate Edition 7.2 of the *Standard Coding Manual for the Consolidated Global Violence Index (CGVI)*. This edition incorporates refinements based on the 2022 External Review Panel recommendations and addresses ambiguities identified in regional coder feedback sessions. Key updates concern clarifications in Section 4.1.3 (Attribution of Intent) and Annex D (Population Denominator Protocols).

  Adherence to the procedures and definitions herein is mandatory for all CGVI data collection and reporting effective January 1, 2024. The integrity and comparability of the CGVI series depend upon strict uniformity. Submit procedural queries through the designated portal.

  ---

  **BUREAU OF CONSOLIDATED VIOLENCE METRICS (BCVM)**  
  **STANDARD CODING MANUAL FOR THE CONSOLIDATED GLOBAL VIOLENCE INDEX (CGVI)**  
  **Edition 7.2 (October 2023)**

  **1. PURPOSE AND SCOPE**

  1.1. This manual establishes standardized definitions, classification criteria, and operational procedures for the compilation of the Consolidated Global Violence Index (CGVI), the definitive annual time series measuring the global incidence of violent events.

  1.2. The CGVI provides an objective, comparable metric for tracking trends in violence over time and across populations, facilitating evidence-based policy and scholarly analysis.

  **2. DEFINITION OF VIOLENCE (CGVI OPERATIONAL FRAMEWORK)**

  2.1. **Violent Event:** For the purposes of the CGVI, a Violent Event is defined as:
      > *An intentional act of physical force, initiated by human agents, occurring within a single calendar year (January 1st - December 31st), resulting in no fewer than 25 direct, immediate, battle-related fatalities.*

  2.2. **Rationale for Threshold (25 Fatalities):** Analysis of historical conflict records (1946-2003) indicates a natural inflection point in reporting reliability and societal impact around the 25-fatality level. Events below this threshold exhibit significantly higher variance in documentation completeness and contextual interpretation, introducing unacceptable noise into the aggregate series. The threshold of 25 represents the point where signal coherence is empirically optimized for longitudinal trend analysis (BCVM Technical Report TR-2005/04). Sub-threshold incidents are cataloged separately (See Section 6).

  2.3. **Intentionality:** The act of physical force must be deliberate. Accidents, natural disasters, or deaths resulting purely from negligence or structural factors (e.g., famine, disease outbreaks under non-combat conditions) are excluded, regardless of fatality count. This ensures the metric captures *agent-driven* harm.

  2.4. **"Battle-Related":** Fatalities must occur as a direct result of tactical engagements between formally organized or informally sustained armed groups, or between such groups and state forces. This excludes fatalities occurring *after* tactical disengagement (e.g., post-capture executions, deaths in detention) unless occurring within the immediate spatial and temporal continuum of the tactical engagement itself. Fatalities from terrorism targeting non-combatants are included only if they meet the 25-fatality threshold within a single, continuous incident.

  **3. CODING PROCEDURES**

  3.1. **Event Identification & Fatality Count:**
      3.1.1. Coders shall utilize the BCVM-designated Primary Source Registry (PSR), comprising vetted news archives, NGO reports, state statistical yearbooks (post-verification), and the BCVM Regional Observer Network feed.
      3.1.2. Only fatalities occurring within 72 hours of the initiating act of force and directly attributable to that act shall be counted.
      3.1.3. The minimum threshold of 25 fatalities must be confirmed by at least two independent sources within the PSR. Estimates are permissible; extrapolation from partial data requires Bureau approval (Form BCVM-7C).
      3.1.4. **Definitional Authority:** The Bureau takes no ontological position regarding the existence or fundamental nature of "violence" outside the operational framework defined in Section 2. The CGVI series measures the incidence of phenomena meeting these specific, standardized criteria. Proceed to record the event identifier, location, date, primary actors, and confirmed fatality count (minimum 25) in the CGVI Master Database.

  3.2. **Assignment to Year:**
      3.2.1. An event is assigned to the calendar year in which the *initiating act* occurred.
      3.2.2. Events spanning multiple years are disaggregated. Fatalities occurring after December 31st are assigned to the subsequent year's events if they meet the threshold independently.

  3.3. **Treatment of Extreme Events ("Tail Events"):**
      3.3.1. Events resulting in exceptionally high fatalities (e.g., exceeding 10,000) are coded identically to all other Violent Events meeting the threshold.
      3.3.2. **Statistical Note:** While such events exert significant influence on the annual mean fatality count per event, they are intrinsic components of the distribution of violence. The CGVI series reports the *number* of events and the *aggregate fatalities* from all coded events. Analysis of central tendency should acknowledge the distribution's inherent skewness; the Bureau provides decile breakdowns in supplementary tables (CGVI-SuppA).

  **4. POPULATION DENOMINATOR & RATE CALCULATION**

  4.1. **Population Base:** The CGVI utilizes the UNPD-WPP (United Nations Population Division - World Population Prospects) Medium Variant estimate for the *global human population* as of July 1st of the relevant year as the denominator for per-capita rates. This provides a stable, consistent, and universally recognized baseline.

  4.2. **Reporting Protocol:**
      4.2.1. The primary CGVI outputs are:
          *   **CGVI-A:** Absolute number of qualifying Violent Events per year.
          *   **CGVI-F:** Absolute number of fatalities from qualifying Violent Events per year.
          *   **CGVI-R:** Fatalities per 100,000 global population (calculated as (CGVI-F / Global Population) * 100,000).
      4.2.2. **Divergent Trends:** Should CGVI-A/CGVI-F and CGVI-R exhibit opposing directional trends within a reporting period (e.g., absolute numbers increase while per-capita rate decreases, or vice-versa), both trends must be reported with equal prominence in the Annual Summary. The Bureau refrains from privileging either absolute or per-capita metrics as more "fundamental"; their relationship reflects the complex interaction between event frequency, scale, and demographic change. Commentary should note the divergence without adjudicating its interpretation.

  **5. PERIODIZATION AND BASELINE**

  5.1. The official CGVI series commences in 1946. This baseline year was selected based on the confluence of three factors:
      1.  The establishment of the first genuinely international framework for conflict documentation (precursor to modern systems).
      2.  The availability of sufficiently systematic, verifiable records across major world regions to meet minimum coding reliability standards.
      3.  A clear historical demarcation point facilitating trend analysis.
  5.2. Pre-1946 data is archived under "BCVM Historical Estimates (Pre-CGVI)" and is explicitly flagged as derived from methodologies inconsistent with the CGVI framework. It is not incorporated into the core series.

  **6. SUB-THRESHOLD INCIDENTS AND NON-CODABLE EVENTS**

  6.1. **Sub-Incident Disruptions (SIDs):** Events involving intentional physical force resulting in 1 to 24 immediate, direct fatalities are classified as Sub-Incident Disruptions (SIDs). SIDs are *not* Violent Events under the CGVI definition. They are recorded in the separate BCVM SID Registry (Database BCVM-SID) for potential contextual analysis, but *must not* be aggregated into CGVI-A, CGVI-F, or CGVI-R. Referencing SIDs as "violence" in the context of the CGVI is a categorical error.

  6.2. **Excluded Phenomena:** Per Section 2.3, acts not meeting the criteria of intentional, immediate, physical force causing battle-related death (e.g., systemic discrimination, psychological abuse, structural poverty, criminal violence below threshold, state executions under judicial process, most domestic violence incidents, deaths from indirect consequences of conflict like disease or displacement) fall outside the CGVI operational framework. While potentially significant in broader societal contexts, they represent distinct conceptual categories and are not measurable under the current CGVI methodology. Their inclusion would compromise the metric's specificity and comparability.

  **7. DATA REVISION POLICY**

  7.1. The CGVI series for a given year is considered provisional until 24 months after the year's conclusion, allowing for source verification and late reporting. After this period, the series is designated "Final" and revisions are permitted only in exceptional circumstances with Director-level approval and full documentation of the justification and source material (Procedure BCVM-Rev1).

  ---

  **APPROVED:**  
  Dr. A. Finchley  
  Director, Bureau of Consolidated Violence Metrics
