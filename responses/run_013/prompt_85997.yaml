answer: |-
  ### Exam Question (20 marks; allocate ~30 minutes)  
  **Analyze the cognitive wave theory research programme through Lakatos’s methodology of scientific research programmes (MSRP).**  
  (a) Apply Lakatos’s criteria for progressive and degenerating problem-shifts to *each stage* of the wave programme’s development (stages 1–3).  
  (b) A critic argues that Lakatos’s criteria are useless to working scientists because they can only judge progress retrospectively. Using your analysis of the wave programme, defend *or* refute this criticism. Does MSRP offer meaningful real-time guidance?  

  ---

  ### Model Answer (Approx. 600 words)  

  **(a) Lakatosian Analysis of the Wave Programme**  
  Lakatos’s MSRP evaluates programmes by their *theoretical* and *empirical progress*, defined by whether problem-shifts predict *novel facts* (progressive) or merely accommodate known anomalies *ad hoc* (degenerating).  

  *   **Stage 1 (Predicted Retrieval-Induced Forgetting Curve):** This shift is **progressive**. The wave programme’s positive heuristic (interference models) generated a *novel prediction* (a specific forgetting curve) that was *corroborated*. It increased empirical content and demonstrated heuristic fruitfulness (Lakatos, *Proofs and Refutations*).  

  *   **Stage 2 (Failed Spacing Effect Prediction; Added Dampening Hypothesis):** This shift is **degenerating**. Faced with an anomaly (spacing effect), the programme protected its hard core (standing waves/resonance) by adding the dampening hypothesis *only after* the failure. Crucially, this hypothesis offered *no novel predictions*; it merely explained the known anomaly ("We adjust parameter D to fit the spacing data"). This is Lakatos’s hallmark of degeneration: accommodating data *post hoc* without increasing testable content (Lakatos, *Falsification and the Methodology*).  

  *   **Stage 3 (Priming Asymmetry Accommodated Post Hoc):** This stage reveals **degeneration intensifying**. The rival connectionist programme predicted a *novel fact* (priming asymmetry). The wave programme only *accommodated* this fact *after* it was discovered and explained by the rival. While it protected its core, it did so reactively and heuristically barrenly, failing again to anticipate a novel test. This highlights the programme’s increasing reliance on defensive maneuvers.  

  **(b) The Retrospective Critique and MSRP’s Real-Time Guidance**  
  The critic is partially correct: Lakatos’s *definitive* judgment of a programme’s progress/degeneration requires hindsight. We see this starkly in Stage 3: only *after* the connectionist prediction succeeded could we definitively label the wave programme’s reaction as degenerative. This retrospective element is inherent to MSRP’s historical appraisal.  

  **However, MSRP *does* offer crucial, actionable guidance to scientists in real-time:**  

  1.  **Heuristic as a Compass:** The positive heuristic is explicitly *forward-looking*. Scientists aren’t passive. They should actively use their programme’s heuristic (e.g., developing interference models) to *generate* novel predictions (like Stage 1). If a programme’s heuristic dries up (Stages 2-3) and only produces defensive adjustments, this is a *real-time warning sign* of degeneration. The wave theorists *should have recognized* that the dampening hypothesis (Stage 2) was a dead end for heuristic development.  
  2.  **Degenerating Shifts as Red Flags:** Lakatos defines degeneration *procedurally*: shifts that lack novel predictions *at the time they are made*. When proposing an adjustment (like the dampening hypothesis), scientists *must ask*: "Does this *only* explain the anomaly we already know, or does it *also* predict something *new* we can test?" If it’s the former, it’s *provisionally degenerative* and weakens the programme. This forces scientists to strive for progressive moves.  
  3.  **Monitoring Rival Programmes:** MSRP emphasizes competition. The *relative* progress of rivals is often discernible faster than a programme’s absolute fate. The connectionist programme’s successful novel prediction (priming asymmetry) in Stage 3 was a *real-time signal* of its progressive momentum and the wave programme’s relative stagnation. Scientists should monitor rivals for such progressive shifts.  

  **Conclusion:** While definitive "progress" or "degeneration" labels require historical perspective, Lakatos provides scientists with *diagnostic tools* and *normative imperatives* for real-time work: diligently pursue heuristic-driven novel predictions, avoid ad hoc adjustments lacking new content, and be alert to rivals’ progressive shifts. The wave programme failed precisely because it ignored these imperatives after Stage 1, slipping into reactive degeneration. MSRP’s value lies not just in ultimate appraisal, but in guiding scientists to *avoid* degenerative paths as they unfold.  

  ---

  ### Marking Scheme (20 Marks Total)

  **A-Grade Answer (17-20 marks) MUST demonstrate:**  
  1.  **Precise Stage Analysis (a):**  
      *   Correctly identifies Stage 1 as *progressive* **specifically because** it predicted a *novel fact* later confirmed.  
      *   Correctly identifies Stage 2 as *degenerating* **specifically because** the dampening hypothesis was *ad hoc* (saved core *only* after failure) and **made no novel predictions**.  
      *   Correctly identifies Stage 3 as *degenerating* **specifically because** it *reactively accommodated* a rival's novel prediction *post hoc* without generating independent novelty.  
      *   Uses Lakatosian terminology accurately ("novel fact", "ad hoc", "problem-shift", "heuristic").  
  2.  **Sophisticated Engagement with Retrospectivity (b):**  
      *   **Explicitly names and explains the "retrospective judgment problem"** using the wave programme (e.g., Stage 3 outcome needed for definitive judgment).  
      *   **Clearly articulates Lakatos's counter-arguments for real-time guidance:**  
          *   The **positive heuristic as a forward-looking tool** for generating novel predictions.  
          *   **Degenerating shifts are identifiable *provisionally* at the time** based on the *absence* of novel predictions in an adjustment.  
          *   The **critical role of monitoring *rival* programmes' progress** as a comparative indicator.  
      *   **Explicitly links these guidance mechanisms back to the wave case** (e.g., wave theorists *should have* recognized the dampening hypothesis as degenerative *when proposed*; they *should have* seen the rival's priming prediction as a threat).  
      *   Offers a balanced conclusion acknowledging the retrospective element while robustly defending MSRP's practical utility.  

  **B-Grade Answer (13-16 marks) Demonstrates:**  
  1.  **Competent Stage Analysis (a):**  
      *   Correctly labels the shifts (Progressive Stage 1, Degenerating Stage 2, Degenerating Stage 3).  
      *   Provides generally correct reasons (e.g., Stage 1 predicted something new, Stage 2/3 were ad hoc).  
      *   Uses key Lakatosian terms, though perhaps less precisely.  
  2.  **Adequate Engagement with Retrospectivity (b):**  
      *   Acknowledges the retrospective element using the case.  
      *   Mentions some form of real-time guidance (e.g., "scientists should make predictions", "avoid ad hoc moves").  
      *   Attempts to link guidance to the case, though perhaps less explicitly or missing key elements (e.g., discusses heuristic vaguely, omits rival monitoring, doesn't explicitly define the provisional identification of degeneration).  
      *   Conclusion is present but may lack the nuance of the A answer.  

  **Lower Scores (C: 10-12, D/F: <10):**  
  *   **Analysis (a):** Mislabels shifts; confuses core/belt; vague descriptions lacking Lakatosian criteria; ignores key details (e.g., no novel predictions in Stage 2/3).  
  *   **Retrospectivity (b):** Superficial treatment; simply agrees critic without counter-argument; lists Lakatos ideas without applying to case; misunderstands the nature of the retrospective problem.  
  *   **Structure/Clarity:** Unclear, disorganized, or significantly underdeveloped.  

  **Key Differentiators:**  
  *   **A:** *Explicitly names the retrospective problem*; *precisely defines provisional degeneration*; *integrates the role of the positive heuristic and rival monitoring*; *consistently links analysis to specific case details* with Lakatosian terminology.  
  *   **B:** Identifies shifts correctly and the retrospective issue generally; mentions guidance but lacks depth/precision on *how* Lakatos addresses it; links to case are present but less rigorous.
