prompt: |-
  I chair the theory review panel at a research foundation that funds foundational computing. Our hypercomputation track receives about a dozen proposals a year, each asking for two to five years of support, and every one of them gets a written verdict from me that will be read by the proposers, by my board, and occasionally by a logician who will enjoy catching us out. The panel is five people: four computer scientists and me, with a background in the philosophy of computation. We have ninety minutes per proposal, we cannot redo anyone's mathematics, and we are in no position to settle open questions in physics or in computability theory. What I need from you is not an essay on the Church–Turing thesis but a decision procedure I can actually run in that ninety minutes.

  Please write the procedure as a sequence of questions asked in order. For each question, say what would count as a sufficient answer, which answers stop the review with a no, and which answers mean the question is not ours to settle and must be handed off — naming the recipient in each case (a physicist, a mathematician, the board as a question of what we want to fund rather than what is true). It has to be runnable by panel members who are not logicians, and it has to be candid about which of its steps are judgment calls wearing the costume of a procedure.

  The procedure must survive the fact that the thesis itself is contested. It is not a theorem, and a claim against it can be read as a claim about what is effectively calculable in principle, as a claim about what physical systems can do, or as a proposal about how the word computable ought to be used. I do not want the procedure to adjudicate that dispute. I want it to force each proposal to declare which of these it is attacking, and to say what the panel should do when a proposal refuses to declare, or declares one thing and argues another.

  Two things I want the procedure to do that our current informal process does not. First, it should keep three failure points distinct and name them: whether the device's behaviour is merely described by a non-computable function rather than being the computation of one; whether the non-computability survives the fact that a real device realizes its idealization only up to tolerance, so that the hardness may sit entirely in the preparation of the input; and whether, even granting that a non-computable value appears somewhere in the device's behaviour, that value is available as the output of a procedure we could run on inputs we could prepare and read, and could run more than once. Second, it should separate a genuine counterexample to the thesis from a claim about speed, cost, or the widening of what we call computation, and say what the panel does with the latter, given that we have no track for it and will have to send it somewhere.

  Then run the procedure on three proposals. (1) A mechanical device in which a ball reaches a singularity in finite time; the proposers encode the index of a Turing machine in the initial angle and claim that the direction in which the ball escapes encodes whether that machine halts. (2) An analog network with real-valued parameters, said to compute a function outside the Turing-computable class in the limit of exact parameter values. (3) A device exploiting a hypothetical spacetime in which infinitely many operations can be completed in a finite time along one worldline while a signal arrives later on another, claimed to decide the halting problem by inspection.

  At least one of your three verdicts should be one I will not enjoy delivering, and you should say which it is. Close by telling me what the procedure cannot do and where you expect it to misfire on the proposals we will actually receive.
reasoning: |-
  We are designing a decision procedure for reviewing hypercomputation proposals. The procedure must be runnable in 90 minutes by a panel of computer scientists and a philosopher, without redoing mathematics and without settling open questions in physics or computability. The procedure must:
   1. Force the proposal to declare its target (effective calculability, physical realizability, or the definition of computability).
   2. Distinguish three failure points: 
      a. Whether the device's behavior is described by a non-computable function vs. actually computing it.
      b. Whether non-computability survives real-world tolerances (so that the hardness might be in input preparation).
      c. Whether the non-computable value is available as a usable output.
   3. Separate genuine counterexamples from claims about speed, cost, or broadening computation.

   The procedure is a sequence of questions. For each:
     - What counts as a sufficient answer (continue to next question, or stop with approval? Note: approval is rare and we are mostly looking for reasons to reject or refer)
     - Which answers stop the review with a "no"
     - Which answers require handing off to an external party (physicist, mathematician, board) and name the recipient.

   We are also to run the procedure on three proposals.

   Steps of the procedure:

   Step 0: Pre-review checks (by panel staff, before the meeting)
     - Check that the proposal is within the hypercomputation track (if not, refer to appropriate track). This step is assumed done.

   Step 1: Clarify the target of the proposal.
     Question: "Which version of the Church-Turing thesis (CTT) does this proposal challenge? Please choose one:
       A) The physical version: that no physical system can compute a function not computable by a Turing machine.
       B) The effective calculability version: that no human-computable method (by pencil and paper) can compute such a function.
       C) The definitional version: that we should not call any function 'computable' unless it is Turing-computable.
       D) Other (specify)."

     Sufficient answer: The proposal must clearly state A, B, C, or D. If D, they must specify.

     Stop with no: If the proposal does not state a target (even after we ask in the review) or if it states that it is not challenging any version of CTT (then it is not hypercomputation).

     Hand off: If the proposal challenges (B) or (C), we note that our foundation funds foundational computing and that (A) is our primary interest. We might still review, but we note that the board may have to decide on the relevance. We continue the review, but we flag for the board that the proposal is about (B) or (C). We do not hand off at this step, but we note the challenge type for the board.

     Judgment: This step requires the panel to interpret the proposal if the authors are ambiguous. We must be candid: this is a judgment call.

   Step 2: Does the proposal claim to compute a specific non-computable function?
     Question: "Does the proposal specify a function f that is proven to be non-computable by a Turing machine? And does it claim that the device computes exactly that function?"

     Sufficient answer: The proposal must identify a function (e.g., the halting problem) and either provide a proof of its non-computability (which we can take on trust if it is standard, or if not, we note we cannot redo the math) or reference a known non-computable function.

     Stop with no: If the function is not specified, or if the function is computable (and the panel recognizes this), or if the function is not proven non-computable (and the panel is aware of the status). Also, if the proposal does not claim to compute a non-computable function at all (then it is not hypercomputation).

     Hand off: If the non-computability of the function is an open question in mathematics, we hand off to a mathematician. But note: we cannot settle open questions. So if the function's status is open, we reject because we cannot confirm the claim.

     Note: We are not redoing the math. We rely on standard results. If the function is the halting problem, that's fine. If it is a new function, we must see a proof that is either published in a reputable venue or that we can follow without much effort (but we have only 90 minutes). If we cannot, then we note that the non-computability is not established and stop with no.

   Step 3: Is the non-computable behavior of the device distinct from merely being described by a non-computable function? (Failure point a)
     Question: "Is the non-computable function being computed by the device, or is the device's behavior merely being described by a non-computable function? Specifically, does the device take an input (which we can control) and produce an output (which we can read) for that function?"

     Sufficient answer: The proposal must clearly specify the input and output of the device and how they relate to the function. The device must be intended as a computer for that function.

     Stop with no: If the device does not have a clear input-output behavior (e.g., it is a system that evolves and we observe some property that happens to encode a non-computable value, but we cannot control the input) OR if the device is only being simulated by a non-computable function (but the device itself is not computing it).

     Hand off: None. This is a conceptual issue for the panel.

     Judgment: This step requires distinguishing between a system that computes and one that is merely modeled by a non-computable function. The panel must judge whether the device is set up to be run on inputs we choose and to give outputs we can interpret.

   Step 4: Does the non-computability survive realistic tolerances? (Failure point b)
     Question: "Does the proposal address the effect of noise, imprecision, and approximation in the physical realization? Specifically, is the non-computable function still computed when the device is built with finite precision and under noise? If the hardness is shifted to the input preparation, does the input require infinite precision to encode the problem instance?"

     Sufficient answer: The proposal must either:
        (i) Show that the non-computability is robust to some level of noise and imprecision (and specify how much), OR
        (ii) Argue that the input can be prepared with the required precision (and that this preparation is feasible, at least in principle), OR
        (iii) Concede that the device only works in an idealized setting and that the non-computability is lost in practice.

     Stop with no: If the proposal does not address tolerances and the device requires infinite precision (or precision beyond what is physically possible) for either input or internal parameters, then we stop with no. Also, if the proposal admits that the device does not work under any realistic noise, then we stop with no.

     Hand off: If the proposal claims that the required precision is physically achievable, but the panel is skeptical, we may hand off to a physicist. However, note that we are not funding engineering. We are interested in foundational claims. So if the proposal is about an idealized device that cannot be built, we reject. We only hand off if the proposal provides a plausible physical argument for the feasibility of the required precision and we are not qualified to judge.

     Judgment: The panel must decide whether the required precision is physically reasonable. This is a judgment call.

   Step 5: Is the output available? (Failure point c)
     Question: "Can the output of the device be read and used? Specifically, can we run the device on a given input and get an output in a finite time (even if it's in the limit of some process) and can we run it repeatedly to verify the result? And is the output clearly identifiable as the value of the function?"

     Sufficient answer: The proposal must explain how the output is obtained and how it is interpreted. It must be clear that we can run the device on an input and get an output that we can record.

     Stop with no: If the output is not accessible (e.g., it requires observing a singularity, which destroys the device) or if it is only available in a way that we cannot record (e.g., it's in a part of spacetime we cannot access) or if we cannot run the device repeatedly (because it is destroyed or because it requires a unique event). Also, if the output is only available in the limit of an infinite process and we cannot get any finite approximation, then we stop with no.

     Hand off: None. This is a design issue.

   Step 6: Is the proposal really about hypercomputation or about something else?
     Question: "Does the proposal primarily claim to compute a non-computable function, or does it instead claim advantages in speed, cost, or a redefinition of computation? And if it does claim hypercomputation, does it also make secondary claims about speed, cost, etc.?"

     Sufficient answer: The panel must determine the main claim.

     Stop with no: If the proposal does not actually claim hypercomputation (but instead, say, efficient computation of a computable function) then it is out of scope for this track. We stop with no and suggest the proposers submit to another track.

     Hand off: If the proposal has a hypercomputation claim that we have accepted so far, but also has secondary claims about speed or cost, we note these for the board (they may be of interest, but we don't evaluate them). If the hypercomputation claim fails, then we don't consider the secondary claims.

     If the proposal is about redefining computation (e.g., using real numbers in a way that is not physically realizable but extends the mathematical notion), then we note that this is a mathematical redefinition and hand off to the board as a question of scope. The board must decide if they want to fund such a proposal.

   Step 7: Overall assessment
     If the proposal has passed all the previous steps without a stop with "no" and without requiring a hand off that leads to a negative outcome, then we may consider funding. However, note that we have not assessed the scientific merit beyond the hypercomputation claim. We must also consider:
       - Is the proposal well-written and the team qualified?
       - Is the budget reasonable?
     But these are beyond our procedure. Our procedure only checks the hypercomputation claim.

     In the overall assessment, we note any hand offs that are pending (e.g., if we handed off to a physicist and the physicist says the required precision is impossible, then we reject). We also note any judgment calls we made.

     We then write a verdict that summarizes the answers to the above and makes a recommendation.

   Now, run the procedure on three proposals.

   Proposal 1: Mechanical device with a ball and a singularity.

   Step 1: Clarify target.
     The proposal likely challenges the physical version (A). We assume they state A.

   Step 2: Non-computable function?
     They claim to decide the halting problem, which is non-computable. So yes.

   Step 3: Computing or described?
     The device takes an input (initial angle) and is supposed to output whether a TM halts (by the escape direction). So it is set up as a computer.

   Step 4: Tolerances.
     The device requires exact initial conditions (infinite precision) to encode the TM and to have the ball reach the singularity. Also, any noise in the construction of the device or in the motion of the ball (friction, etc.) would likely disrupt the outcome. The proposal probably does not address this.

     We stop with no. The non-computability does not survive realistic tolerances because the input requires infinite precision and the device is chaotic. Even if they argue that infinite precision is achievable, we hand off to a physicist. But a physicist would say that in classical mechanics, infinite precision is not achievable due to quantum effects (or even in classical chaos, any perturbation grows). Therefore, we stop with no.

     Alternatively, if the proposal argues that they can achieve the required precision, we hand off to a physicist. But in 90 minutes, we can't wait for the physicist. So we note that we are not qualified and that the claim is physically implausible. We stop with no.

   Step 5: Output available?
     Even if we set aside Step 4, the output is the escape direction. We assume we can observe that. But if the ball reaches a singularity, the device might be destroyed. They might argue that we can observe without destroying, but that's unclear. However, we already stopped at Step 4.

   Step 6: Scope?
     This is about hypercomputation.

   Verdict: Reject (due to Step 4).

   Proposal 2: Analog network with real-valued parameters.

   Step 1: Target.
     They might be challenging the physical version (A) or the definitional version (C). They might say that with exact real numbers, they can compute a non-Turing computable function. So they might be targeting (A) if they claim physical realizability, or (C) if they are defining a new kind of computation with reals. We ask.

     Suppose they state: "We are challenging the physical version (A) by showing that an analog network with real-valued parameters can compute a non-computable function." So we proceed.

   Step 2: Non-computable function?
     They specify a function (say, a function that uses an oracle encoded in the real parameters). They must prove that the function is non-computable. If they use a known construction (like an oracle for the halting problem), then we accept. If they define a new function, we must see a proof. In 90 minutes, we cannot redo the proof. If the proof is complex and we cannot follow, we stop with no. If they reference a known result, we accept.

     Let's assume they use the halting problem and it's clear.

   Step 3: Computing or described?
     The network takes inputs (say, real numbers) and produces outputs. So it is set up as a computer.

   Step 4: Tolerances.
     The proposal says the function is computed in the limit of exact parameter values. But what if the parameters are not exact? They must address noise. If they say that the device requires exact parameters, then we have a problem.

     They might argue that the non-computability is robust to small errors? Probably not, because small changes in the parameters might change the function entirely. Also, the input might require infinite precision.

     The proposal likely does not address this. We stop with no.

     Alternatively, if they claim robustness, we must see an argument. Without one, we reject.

   Step 5: Output available?
     They might say that the output is available as a real number. But how do we read it? We might need infinite precision to read the output. Then we stop with no.

     But even if we assume Step 4 is passed, Step 5 might fail: if the output is a real number and we can only read it to finite precision, then we only get an approximation. The non-computable value might be lost in the approximation.

     So we have two reasons to reject: Step 4 and Step 5.

   Step 6: Scope?
     This is hypercomputation.

   Verdict: Reject.

   Proposal 3: Device exploiting a hypothetical spacetime.

   Step 1: Clarify target.
     They challenge the physical version (A). They claim that in this spacetime, a physical device can decide the halting problem.

   Step 2: Non-computable function?
     The halting problem, so yes.

   Step 3: Computing or described?
     Input: the index of a TM. Output: 0 or 1 (halts or not). So it is set up as a computer.

   Step 4: Tolerances?
     This device relies on a hypothetical spacetime. We must assume that the spacetime is as described. But the proposal must also address noise and imprecision in the device. They might not. But the bigger issue is the spacetime.

     Hand off: The physical possibility of the spacetime must be assessed by a physicist. We hand off to a physicist. The panel cannot settle this.

     However, note: we are not in a position to settle open questions in physics. The foundation might not want to fund a proposal that requires a hypothetical spacetime that is not accepted by the physics community.

     We stop the review and note that we need a physicist's opinion. But in 90 minutes, we can't get one. We must make a judgment: if the spacetime is purely speculative and not supported by any current physical theory, we reject. If it is based on a well-known theory (like general relativity) and the proposal uses a known solution (like Malament-Hogarth spacetime), then we note that the physics is controversial. We hand off to the board with a note: "This proposal requires a spacetime that is not known to exist. A physicist would be needed to evaluate the possibility. We do not have the expertise. The board must decide if they are willing to fund such speculative physics."

     But our procedure says we are not to settle open questions. So we must reject unless the physics is established. Since it is not, we reject.

     Alternatively, we might hand off to the board and let them decide on the risk. But the procedure says we must hand off to a physicist. However, we don't have one on the panel. So we note that we cannot evaluate the physical basis and therefore we cannot confirm the hypercomputation claim.

   Step 5: Output available?
     They claim the output is available on a later worldline. We assume we can read it.

   Step 6: Scope?
     Hypercomputation.

   Verdict: We stop at Step 4 and hand off to a physicist. But since we cannot do that in 90 minutes, we note that the physical basis is unconfirmed and we reject. Alternatively, we might recommend that the proposal be reviewed by a physicist and then reconsidered. But the track is hypercomputation, and we are not set up for that. The board might have a mechanism for external review, but our procedure must run in 90 minutes. Therefore, we reject.

   One of the verdicts I won't enjoy delivering: Proposal 3. Because it is exciting and speculative, and the proposers might be disappointed that we rejected on the basis of unproven physics. But we have to.

   What the procedure cannot do:
     - It cannot prove or disprove mathematical claims that are open or complex.
     - It cannot resolve physical controversies.
     - It cannot evaluate the engineering feasibility beyond the basic tolerance issue (e.g., cost, materials).
     - It does not assess the quality of the research team or the budget.
     - It does not handle proposals that are on the boundary between hypercomputation and, say, accelerated computing.

   Where it might misfire:
     - If a proposal has a valid argument for robustness to noise, but the panel does not have the expertise to recognize it.
     - If a proposal uses a non-computable function that is not well-known and the panel misjudges its status.
     - If a proposal challenges the CTT in a subtle way that our steps do not capture.
     - If a proposal is so novel that it does not fit into our categories.

   Despite these, the procedure forces the panel to think systematically and record their reasoning.

   Final note: The procedure is designed to be run in 90 minutes per proposal. It is not foolproof, but it structures the review and makes the reasons for rejection explicit.
answer: |-
  Below is a decision procedure designed for your panel. It consists of sequential questions, each with clear criteria for sufficiency, rejection, or referral. The procedure forces proposals to declare their target (physical realizability, effective calculability, or definitional computability), separates genuine hypercomputation claims from unrelated advances, and explicitly addresses the three failure points. Judgment calls are flagged.  

  **Decision Procedure for Hypercomputation Proposals**  
  *Total time: 90 minutes per proposal. Panel may skip questions if earlier answers trigger rejection/referral.*  

  1. **Question 1: Target Declaration**  
     *"Which aspect of the Church-Turing thesis (CTT) does this proposal challenge? Specify exactly one:*  
     *A. Physical realizability (claims a physical system computes a non-Turing-computable function).*  
     *B. Effective calculability (claims a human-executable method computes such a function).*  
     *C. Definitional (argues 'computable' should include non-Turing-computable functions).*  
     *D. None (e.g., focuses on speed/cost without challenging computability limits)."*  
     - **Sufficient answer**: Clear selection of A, B, C, or D. Proposal must explicitly state its target.  
     - **Reject if**: D selected (out of scope) OR target ambiguous/contradictory (e.g., claims A but argues C).  
     - **Refer if**: B or C selected. **Recipient**: Board (to decide if funding aligns with foundation goals).  
     - *Judgment call*: Interpreting ambiguous declarations. Panel must note inconsistencies.  

  2. **Question 2: Non-Computable Function Specification**  
     *"Does the proposal identify a specific function \(f\) proven non-Turing-computable (e.g., halting problem), and claim the device computes \(f\)?"*  
     - **Sufficient answer**: Names \(f\) and provides/references proof of non-computability.  
     - **Reject if**: \(f\) is Turing-computable OR proof absent/incorrect (e.g., misstates Rice’s theorem).  
     - **Refer if**: Non-computability of \(f\) is an open problem. **Recipient**: Mathematician (to verify status).  
     - *Judgment call*: Distinguishing referenced proofs from handwaving (e.g., "similar to the halting problem" without rigor).  

  3. **Question 3: Computation vs. Description**  
     *"Is \(f\) computed by the device (input→output), or is the device merely described by \(f\) (e.g., \(f\) models internal dynamics)?"*  
     - **Sufficient answer**: Clear input-output mapping for \(f\) (e.g., input encoded, output decodable).  
     - **Reject if**: No input control/output access OR \(f\) describes non-computable behavior without being computed (e.g., system evolution encodes \(f\) but output isn’t extractable).  
     - **Refer if**: Ambiguous, but physics/math could clarify. **Recipient**: Physicist (if physics) OR Mathematician (if math).  
     - *Judgment call*: Deciding if output is "extractable" (e.g., is the ball’s escape direction a readable output?).  

  4. **Question 4: Tolerance Survival**  
     *"Does non-computability survive realistic noise/tolerance? Specifically:*  
     - *a. Can inputs be prepared with finite precision?*  
     - *b. Is output stable under small perturbations?*  
     - *c. Does hardness rely on infinite precision/energy/etc.?"*  
     - **Sufficient answer**: Explicit analysis of tolerances (e.g., error bounds, noise thresholds).  
     - **Reject if**: Non-computability requires infinite precision (e.g., exact real numbers) OR proposal ignores tolerances.  
     - **Refer if**: Tolerances are physically plausible but unverified. **Recipient**: Physicist (feasibility of precision/energy).  
     - *Judgment call*: Assessing "realistic" tolerances (e.g., is nanoscale precision acceptable for a mechanical device?).  

  5. **Question 5: Output Availability**  
     *"Is the non-computable output: (a) readable, (b) repeatable for verification, and (c) not dependent on unreproducible events?"*  
     - **Sufficient answer**: Output is accessible, repeatable, and finitely observable (even if asymptotically).  
     - **Reject if**: Output is unrepeatable (e.g., device destroyed), unreadable (e.g., requires observing a singularity), or requires infinite time/resources for a single run.  
     - **Refer if**: Physical constraints affect readability. **Recipient**: Physicist (e.g., is spacetime signal detectable?).  

  6. **Question 6: Scope Separation**  
     *"Does the proposal primarily claim hypercomputation (non-Turing-computable \(f\)), or is it about speed/cost/redefinition (e.g., ‘faster Turing computation’ or ‘broadening definitions’)?"*  
     - **Sufficient answer**: Focus on hypercomputation; secondary benefits (speed/cost) are noted but not central.  
     - **Reject if**: Admits no hypercomputation claim (e.g., "accelerates computable functions").  
     - **Refer if**: Hybrid (e.g., claims hypercomputation but emphasizes engineering). **Recipient**: Board (funding priorities).  

  ---  
  **Procedure Applied to Proposals**  
  *Verdicts assume honest interpretation; judgment calls noted.*  

  **Proposal 1: Mechanical singularity device**  
  - **Q1**: Targets A (physical realizability). Sufficient.  
  - **Q2**: \(f\) = halting problem. Sufficient (known non-computable).  
  - **Q3**: Input (angle) → output (escape direction). Sufficient.  
  - **Q4**: Reject. Hardness relies on infinite precision:  
    - Input requires exact angle to encode arbitrary TM.  
    - Chaotic dynamics amplify noise; no tolerance analysis.  
    - *Judgment*: Preparation of inputs is infeasible (failure point b).  
  - **Verdict**: Reject. **Why?** Tolerances fatal.  

  **Proposal 2: Analog network with real parameters**  
  - **Q1**: Targets A or C. Assume declared as A (physical).  
  - **Q2**: \(f\) specified (e.g., a non-computable limit-computable function). Sufficient if proof cited.  
  - **Q3**: Input→output mapping claimed. Sufficient.  
  - **Q4**: Reject. Non-computability requires exact real parameters (infinite precision). Output unstable under noise (e.g., small parameter drift changes function).  
  - **Q5**: Reject (redundant). Output is a real number; reading it exactly requires infinite precision.  
  - **Verdict**: Reject. **Why?** Tolerances (Q4) and output availability (Q5) fail.  

  **Proposal 3: Spacetime device (infinitely many operations in finite time)**  
  - **Q1**: Targets A (physical). Sufficient.  
  - **Q2**: \(f\) = halting problem. Sufficient.  
  - **Q3**: Input (TM index) → output (halt/no-halt). Sufficient.  
  - **Q4**: Refer. Tolerances depend on spacetime physics:  
    - Requires exotic matter/infinite energy? No analysis.  
    - **Recipient**: Physicist (feasibility of spacetime model).  
  - **Q5**: Reject. Output requires a "later" signal from an infinite process; may not be readable/verifiable (e.g., if worldline is inaccessible).  
  - **Verdict**: Reject (despite Q4 referral, Q5 fails).  
  - **Unenjoyable verdict**: This one. Proposers invested in novel physics, but output availability (failure point c) is fatal.  

  ---  
  **Limitations and Failure Modes**  
  1. **What the procedure cannot do**:  
     - Resolve open problems (e.g., if a proposal claims to solve the physical CTT via unproven quantum gravity).  
     - Detect sophisticated mathematical errors (e.g., misapplication of infinitary logic).  
     - Evaluate engineering viability (beyond tolerance thresholds).  
     - Handle proposals that intentionally obscure their target (Q1 forces declaration, but dishonesty may slip through).  

  2. **Expected misfires**:  
     - **False negatives**: Proposals with valid tolerance analyses (e.g., error-correcting analog systems) may be rejected if panel misjudges "physical plausibility" (Q4).  
     - **Ambiguous referrals**: Proposals straddling physics/math (e.g., "quantum hypercomputation") may bounce between physicist/mathematician without resolution.  
     - **Output availability disputes**: E.g., is a "limit" readable? Panel may inconsistently apply Q5.  
     - **Over-reliance on declarations**: A proposal declaring "physical" (Q1) but arguing definitional (C) might pass Q1 but fail later steps, wasting time.  

  **Final Recommendation**: Use this procedure to structure discussions, document rejection reasons explicitly, and flag all judgment calls in the verdict. It optimizes for rigor in 90 minutes but requires panel discipline to avoid rabbit holes.
