answer: |-
  Here's a faithful translation of each philosophical position into your specified software vocabulary, followed by the residue report analyzing the mapping:

  **1. Social Practice + Fairness (e.g., Rawls, Scanlon)**
  *   **Translation:** Promising is a standardized social interface (`IPromiseInterface`). Invoking `IPromiseInterface.MakePromise(commitment)` creates an instance binding the promisor. This interface defines strict semantic versioning rules: breaking changes (non-fulfillment) without extraordinary justification (`forceMajeure`) violate the contract. Fairness dictates adhering to the interface's SLA, as others rely on its stability within the social dependency graph. Breaking it corrupts the shared library of trust.
  *   **Residue:**
      *   **Clean Carryover:** Interface standardization, contract violation, semantic versioning expectations, dependency on stable interfaces, system-wide corruption risk.
      *   **Distortion:** The *moral obligation* of fairness is reduced to a system stability concern. The "shared library of trust" implies a tangible, engineered artifact, whereas the social practice is organic and emergent. The "SLA" lacks defined penalties or enforcement mechanisms inherent in software.
      *   **No Counterpart:** The foundational *social convention* itself – the shared understanding creating the obligation just by participating. Software interfaces are designed and adopted; social practices evolve tacitly. The specific *wrongness of unfairness* isn't captured, only the functional instability.

  **2. Invited Reliance (e.g., MacCormick, Raz)**
  *   **Translation:** Making a promise is an explicit call to `relyee.addDependency(promisor, commitment)`. This creates a directed edge in the dependency graph. The promisor's subsequent action/inaction triggering `commitment.fail()` constitutes a breaking change for the relyee, violating the implied SLA established by the initial `addDependency` call. The wrong is generating an unhandled critical dependency failure in another agent's execution flow.
  *   **Residue:**
      *   **Clean Carryover:** Explicit dependency creation, breaking changes causing downstream failure, SLA violation via induced failure, directed dependencies.
      *   **Distortion:** Software dependencies are often declared explicitly in code/config (*opt-in*). Promises can create reliance even without the promisor *intending* to create a formal dependency or the relyee *explicitly* declaring it. The *moral weight* comes from *inducing* vulnerability, not just breaking a declared contract. The "implied SLA" is far fuzzier than a software SLA.
      *   **No Counterpart:** The concept of *inducing reasonable reliance* – the promisor's responsibility for foreseeing and accepting the creation of this vulnerability. Software dependencies are managed; induced reliance is about creating unmanaged risk in another. The *harm of betrayal* distinct from mere functional failure.

  **3. Self-Prediction (e.g., Hume - skeptical view)**
  *   **Translation:** A promise is a publicly logged `console.assert(promisor.willPerform(commitment), "Promise made")`. It's a strong assertion about the future state of the promisor's internal state machine (`willPerform == true`). Breaking the promise reveals the initial assertion was flawed (`AssertionError: "Promise made"`), indicating faulty internal logic or unhandled exceptions within the promisor. The "obligation" is epistemic consistency, not inherent binding.
  *   **Residue:**
      *   **Clean Carryover:** Assertions about future state, logging declarations, error on assertion failure, debugging faulty logic/exceptions.
      *   **Distortion:** Reduces the promise to a *descriptive* statement (a prediction) rather than a *performative* act (creating an obligation). The moral "wrong" becomes merely an *inaccuracy* or *bug*. The notion of *binding intent* is absent. Software assertions are for debugging; promises are for commitment.
      *   **No Counterpart:** The *performative act* of *undertaking* an obligation. The *normative force* generated by making the promise itself. Assertions describe; promises commit. The potential *blameworthiness* for the inaccurate prediction vs. the *wrongdoing* of breaking a commitment.

  **4. Transfer of Authority (e.g., Owens, Shiffrin)**
  *   **Translation:** Making a promise executes `relyee.grantAuthority(commitmentScope, promisor)`. This delegates a limited right-to-command (`RTC_CommitmentFulfillment`) over the promisor's future action within the specified scope to the relyee. Breaking the promise is equivalent to the promisor illegally revoking this granted authority (`promisor.revokeAuthority(commitmentScope)` without `relyee.consent`) or ignoring a valid `relyee.executeRTC(commitmentScope)` call. The promisor becomes an unauthorized actor regarding their own future actions within the delegated scope.
  *   **Residue:**
      *   **Clean Carryover:** Delegation of permissions/authority, revocation violations, unauthorized actions within a scope, explicit permission grants.
      *   **Distortion:** Software authority delegation is explicit, technical, and enforceable. Promissory authority transfer is moral, often implicit in the act, and lacks technical enforcement. The promisor is both the actor *and* the entity whose authority was delegated, creating a self-referential conflict software permissions avoid. The "right-to-command" is metaphorical.
      *   **No Counterpart:** The concept of *alienating a portion of one's own future autonomy* to another. The deep *normative entanglement* created. Software permissions control access *to* a resource; promissory authority transfer changes the *normative status* of the promisor's own actions. The *wrong of self-betrayal* alongside failing the other.

  **Residue Report & Specific Queries**

  1.  **Broken Promise vs. Failed Dependency:**
      *   **Software Vocab Can Mark It?** Only partially. It can describe the *mechanics*: a broken promise is a `commitment.fail()` caused by `promisor.action` (internal logic/choice), while a failed dependency could be caused by external factors (`networkError`, `resourceUnavailable`) or other services. It *cannot* mark the crucial **moral distinction**: the element of **willfulness, control, and betrayal inherent in a *broken promise***. A `commitment.fail()` due to `promisor.maliciousIntent` or `promisor.negligence` is functionally identical to one caused by `promisor.hardwareFailure` in the dependency graph, but morally worlds apart. The vocabulary lacks tags for *culpability* and *violation of trust* specific to promises.

  2.  **Commitment-Device Gloss:**
      *   **Position or New Subject?** It's **distinct but overlaps significantly with the Predictive view**, adding a crucial layer. The Predictive view sees a promise as *describing* future intent ("I predict I will do X"). Your commitment-device gloss sees it as a *tool to bind future self* against weakness of will ("I construct this device *now* to ensure I do X *later*, knowing my future self might defect"). This *intentional self-binding for strategic reasons* is absent in the core Predictive view. It's closer to viewing the promise as creating an internal `atomicTransaction` or setting a `precommitmentLock` within your own state machine to overcome known future `temptationException` handlers. It changes the subject slightly by focusing on the *internal strategic function for the promisor*, whereas the philosophical positions focus on the *external normative relation*.

  3.  **Size of Residue & Indictment:**
      *   **Residue is Significant:** The irreducible residue centers on:
          *   **Normative Force/Moral Obligation:** The "ought" created by the promise itself.
          *   **Willfulness & Culpability:** The distinction between breaking and failing, tied to control and intent.
          *   **Performative Creation:** Promises *create* obligations; software contracts *describe* existing agreements/behaviors.
          *   **Social Context & Repair:** The organic, non-engineered nature of trust, blame, forgiveness, and relationship repair.
          *   **Alienation of Autonomy:** The unique self-binding/authority-transfer aspect.
      *   **Indictment?** It **indicts neither framework wholesale, but highlights their different domains.** The software vocabulary excels at describing *mechanisms, structures, and functional consequences* of commitments within designed systems. Philosophical vocabulary addresses *normative status, moral obligations, intentions, and the social fabric of trust*. The residue exists because **human promises are inherently moral and social acts occurring within relationships and agency**, not just functional dependencies within deterministic or probabilistic systems. The software vocabulary cannot capture the *why-should-I-feel-guilty* or *why-did-you-betray-me* dimensions. Conversely, philosophical vocabulary struggles to model the precise, enforceable mechanics software demands.

  **Conclusion:** Your vocabulary provides powerful metaphors for the *architecture* and *functional flow* of promises. It cleanly maps aspects of structure, dependency, failure modes, and even some strategic self-binding. However, it fundamentally cannot capture the core *normative, moral, and relational essence* of why a broken promise feels like a betrayal rather than just a system outage. Your commitment-device view is a valuable, primarily internally-focused perspective that complements but doesn't replace the external relational focus of the main philosophical positions. The large residue isn't a failure of either language; it reflects that human promises operate in a richer, messier domain than software contracts.
