answer: |-
  Below is a decision procedure grounded in Fernand Braudel's temporal registers (event, conjuncture, longue durée), designed for your team to apply in under an hour using only proposal files. The procedure addresses your constraints, including the charter clause that prohibits funding interventions with effects shorter-lived than the disturbance. It is structured as a step-by-step checklist with explicit rules, safeguards, and escalation points. After the procedure, I apply it to your three test proposals and conclude with which verdict you may dislike and the procedure's limitations.

  ---

  ### **Decision Procedure: Braudelian Temporal Register Assessment**

  **Purpose**: To assign a temporal signature to each proposal, identify mismatches, distinguish trends from structures, safeguard against dismissing recent harms, and escalate ambiguities.  
  **Input**: Proposal file (text, maps, data, testimony).  
  **Time**: 45–60 minutes per proposal.  
  **Outputs**: Temporal signature, mismatch rules, trend/structure test, safeguard, and escalation points.  
  **Key Definitions**:  
  - **Event**: Surface disturbance (days to 5 years). Evidence: Specific dates, short-term data (e.g., storm damage report, spill record).  
  - **Conjuncture**: Cyclic or trend-driven changes (10–50 years). Evidence: Multi-decadal datasets (e.g., catch records, population trends).  
  - **Longue durée**: Immutable structures (100+ years). Evidence: Persistent features (e.g., sediment cores, property maps) invariant to human intervention.  
  - **Disturbance**: The problem being addressed (e.g., marsh loss, storm damage, fishery collapse).  

  #### **Step 1: Assign Temporal Signatures**  
  Assign a register (event, conjuncture, longue durée) to:  
  - **The disturbance (problem)**  
  - **The intervention**  
  - **The expected effect**  

  **Rules for Assignment**:  
  - **Disturbance (problem)**: Assign based on the *evidence of causality*. Use the longest register supported by evidence unless contradicted.  
    - Evidence: Instrumental data (e.g., storm intensity), maps (e.g., marsh extent), testimony (e.g., fisher accounts).  
    - Overturning evidence: e.g., An event disturbance assigned as event could be overturned if linked to a decadal trend (conjuncture) or a permanent shift (longue durée).  
  - **Intervention**: Assign based on *implementation timeframe*.  
    - Event: Rapid (e.g., debris cleanup in months).  
    - Conjuncture: Medium-term (e.g., habitat restoration over 10 years).  
    - Longue durée: Permanent (e.g., land acquisition).  
  - **Expected effect**: Assign based on *duration of impact*.  
    - Event: Short-term (e.g., temporary habitat recovery).  
    - Conjuncture: Decadal (e.g., sustained fishery health).  
    - Longue durée: Permanent (e.g., restored coastline).  

  **Document**:  
  - Register for each element.  
  - Supporting evidence (cite file sources).  
  - Evidence that would overturn the assignment (e.g., for a longue durée disturbance, overturning evidence would be data showing recent human-caused change).  

  #### **Step 2: Rules for Mismatches**  
  Identify and resolve mismatches between disturbance and intervention registers:  
  - **Mismatch 1: Event-scale intervention for structure-scale disturbance** (e.g., quick fix for a long-term problem).  
    - Rule: **Reject** unless:  
      - The intervention is a necessary emergency step within a funded long-term strategy (evidence: existing plan with commitments).  
      - Effects are explicitly tied to enabling long-term recovery (e.g., "rapid marsh planting to buy time for sediment management").  
  - **Mismatch 2: Structure-scale intervention for event disturbance** (e.g., land buyout for a one-time storm).  
    - Rule: **Reject** unless:  
      - The disturbance is proven to be a symptom of a longer shift (evidence: e.g., storm frequency data showing trend).  
      - No effective event/conjuncture intervention exists (evidence: e.g., testimony that short-term fixes failed).  

  #### **Step 3: Test for Slow Trend vs. Structure**  
  Distinguish conjuncture (trend) from longue durée (structure):  
  - **Persistence alone is insufficient**. A phenomenon is **longue durée only if**:  
    - It is *invariant* to human social/economic changes (e.g., persists across policy shifts, market fluctuations, or technology).  
    - It *enables or constrains* possibilities (e.g., a coastline shape determines settlement patterns).  
  - **Evidence required**:  
    - For structure: Cross-century invariance (e.g., sediment cores showing consistent deposition despite land-use changes).  
    - For trend: Reversibility or cyclicity (e.g., fish population cycles tied to climate patterns).  
  - **Test question**: "If we removed all human activity, would this phenomenon revert or persist?" Persistence = structure; reversion = trend.  

  #### **Step 4: Safeguard Against Dismissing Recent Harm**  
  Prevent mislabeling a recent harm as "mere event/fluctuation":  
  - **Rule**: If the disturbance is assigned to event or conjuncture:  
    - **Do not close the file** without checking for links to longer registers.  
    - **Require positive evidence** that the harm is isolated (e.g., data showing no trend, testimony confirming rarity).  
    - **Default to longer register** if evidence is ambiguous (e.g., if community testimony describes increasing storm severity, assign conjuncture even without full data).  

  #### **Step 5: Escalation Points**  
  Escalate to the board if any criteria below are unmet. Provide:  
  - **Exact question for the board**.  
  - **Escalation triggers**:  
    - Conflicting evidence on disturbance register (e.g., data vs. testimony disagree). Question: *"Given conflicting evidence, which register best characterizes the disturbance, and why?"*  
    - Intervention mismatch with no clear justification (Step 2). Question: *"Should we fund this temporal mismatch? If yes, how do we mitigate the risk of misalignment?"*  
    - Uncertainty in trend vs. structure test (Step 3). Question: *"Is this disturbance a structure (longue durée) or trend (conjuncture)? What evidence is decisive?"*  
    - Safeguard violation risk (Step 4). Question: *"Is there sufficient evidence to rule out a longer-term process behind this recent harm?"*  

  **Procedure Output Template**:  
  ```markdown
  1. **Temporal Signature**:  
     - Disturbance: [Register]. Evidence: [List]. Overturned by: [Evidence].  
     - Intervention: [Register]. Evidence: [List].  
     - Effect: [Register]. Evidence: [List].  
  2. **Mismatches**: [None/Mismatch 1/Mismatch 2]. [Rule applied].  
  3. **Trend vs. Structure**: [Structure/Trend]. [Evidence of invariance/reversibility].  
  4. **Safeguard**: [Harm dismissed? Yes/No]. [Evidence of isolation or link].  
  5. **Escalation**: [Points and questions, if any].  
  ```  

  ---

  ### **Application to Test Proposals**  
  **Assumptions**: Staff uses only proposal file evidence. Charter constraint incentivizes applicants to overstate disturbance duration, so evidence is scrutinized for register consistency.  

  #### **Proposal (a): Restoring Salt Marsh to Historical Extent**  
  **File Evidence**: 19th-century survey (longue durée), sediment core (centuries of marsh data), community memory (60 years of marsh-edge observations).  
  **Applicant's Claim**: Disturbance is longue durée (marsh loss due to permanent hydrology change). Intervention is longue durée (land acquisition). Effect is longue durée (permanent restoration).  

  **Step-by-Step Application**:  
  1. **Temporal Signature**:  
     - Disturbance: **Conjuncture**. Evidence: Community memory (60-year loss trend); sediment core (shows marsh existed for centuries but recent degradation). Overturned by: Data showing degradation predating human memory (e.g., pre-1900 core layers).  
     - Intervention: **Longue durée**. Evidence: Land acquisition (permanent).  
     - Effect: **Longue durée**. Evidence: Restoration to "historical" state (claimed permanent).  
  2. **Mismatches**: None (intervention/effect match disturbance’s *potential* longue durée, but disturbance is conjuncture).  
  3. **Trend vs. Structure**: **Trend** (conjuncture). Evidence: Marsh edge changed in 60 years (reversible); sediment core shows variability (not invariant). Test: If human activity ceased, marsh might recover (reversion likely).  
  4. **Safeguard**: Harm not dismissed (community memory validates recent loss). Evidence: No isolation—60-year trend implies ongoing issue.  
  5. **Escalation**: Triggered by conflicting evidence (survey vs. memory vs. core). Question: *"Given conflicting evidence, which register best characterizes the disturbance?"* Board must resolve historical target.  

  **Verdict**: Escalate. Disturbance is conjuncture, but applicant claims longue durée. Board must decide if "historical restoration" aligns with evidence.  

  #### **Proposal (b): Rapid-Response After Severe Storm Season**  
  **File Evidence**: Storm damage photos (event), climate model projections (conjuncture), testimony linking storms to rising seas (longue durée).  
  **Applicant's Claim**: Disturbance is longue durée (climate shift). Intervention is event (rapid rebuild). Effect is event (quick recovery).  

  **Step-by-Step Application**:  
  1. **Temporal Signature**:  
     - Disturbance: **Conjuncture**. Evidence: Climate projections (decadal trend); testimony (links to rising seas). Overturned by: Data disproving trend (e.g., no sea-rise in 50 years).  
     - Intervention: **Event**. Evidence: Rapid construction (months).  
     - Effect: **Event**. Evidence: Short-term recovery (e.g., "restore access within a year").  
  2. **Mismatches**: **Mismatch 1** (event intervention for conjuncture disturbance). Rule: Reject unless part of long-term plan. Evidence shows no linked strategy—fails rule.  
  3. **Trend vs. Structure**: **Trend** (conjuncture). Evidence: Storms tied to climate cycles (reversible if emissions cut). Test: Without humans, storms may revert (no invariance).  
  4. **Safeguard**: Harm not dismissed (storm damage is real). Evidence: Climate data supports longer process.  
  5. **Escalation**: None. Mismatch rule decisive.  

  **Verdict**: Reject. Event intervention for conjuncture disturbance with no long-term plan.  

  #### **Proposal (c): No Action on Collapsing Fishery**  
  **File Evidence**: Catch records (20-year boom-bust cycles), testimony on "natural cycles," no data on habitat loss.  
  **Applicant's Claim**: Disturbance is conjuncture (natural cycle). Intervention is none (implicit conjuncture acceptance). Effect is conjuncture (recovery in next cycle).  

  **Step-by-Step Application**:  
  1. **Temporal Signature**:  
     - Disturbance: **Conjuncture**. Evidence: Catch records (20-year cycles); testimony ("always recovered"). Overturned by: Data showing broken cycle (e.g., no recovery in 10 years).  
     - Intervention: **Conjuncture**. Evidence: No action (allows cycle to play out).  
     - Effect: **Conjuncture**. Evidence: Expected recovery in next cycle.  
  2. **Mismatches**: None. Intervention matches disturbance register.  
  3. **Trend vs. Structure**: **Trend** (conjuncture). Evidence: Cyclic catch data (reversibility); no invariance (e.g., cycles depend on fishing pressure). Test: Without humans, fishery might stabilize (reversion).  
  4. **Safeguard**: Risk of harm dismissal. Evidence: No proof of isolation—testimony is anecdotal. Rule applied: Default to longer register without isolation evidence, but catch records support conjuncture.  
  5. **Escalation**: Triggered by safeguard risk. Question: *"Is there sufficient evidence to rule out a longer-term process (e.g., habitat collapse)?"*  

  **Verdict**: Conditionally accept, pending board escalation. No action aligns, but safeguard requires board confirmation.  

  ---

  ### **Which Verdict Will You Dislike?**  
  You will dislike the **verdict for Proposal (c)**. The procedure conditionally accepts "no action" for the fishery collapse, as the evidence supports a conjuncture cycle. However, this risks dismissing a real harm if the collapse is actually a permanent shift (e.g., due to climate change or habitat loss). The safeguard escalates this to the board, but the outcome may still feel unsatisfactory because:  
  - The applicant’s incentive (to claim the longest register) is countered by weak evidence (only catch records and testimony).  
  - "No action" could exacerbate community harm if the cycle is broken.  
  This verdict highlights the tension between Braudel’s framework (which privileges structures) and your mandate to avoid inaction.  

  ### **What the Procedure Cannot Do**  
  1. **Resolve evidence gaps**: It relies on existing files; absent data (e.g., no sediment core in Proposal a) forces escalation.  
  2. **Predict future registers**: Braudel’s model is historical; it cannot forecast if an event becomes a structure (e.g., a storm cycle intensifying into permanent change).  
  3. **Override charter constraints**: The procedure flags mismatches but cannot waive the "no short-lived effects" rule.  
  4. **Eliminate subjectivity**: Register assignment requires judgment (e.g., interpreting testimony), though rules standardize this.  
  5. **Address non-temporal biases**: E.g., political pressure to fund "visible" events over long-term work isn’t resolved.  

  The procedure systematizes temporal thinking, but board judgment remains essential for ambiguous cases. I recommend piloting it on past grants to refine rules before full deployment.
