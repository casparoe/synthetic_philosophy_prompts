  We are creating a decision procedure based on Braudel's three registers: event, conjuncture, and longue durée. The procedure must be applied by program staff in about an hour using only the proposal file. The steps are as follows:

  Step 1: Temporal Signature Assignment
  For each proposal, we will assign the problem, the proposed intervention, and the expected effect to one of Braudel's three registers (event, conjuncture, or longue durée). We do this by examining the evidence provided in the proposal and looking for characteristics of each register.

  Definitions:
  - Event: Discrete, short-term occurrences (e.g., a storm, a spill). Evidence: specific dates, short duration (days to months), direct observations.
  - Conjuncture: Medium-term cycles (decades to a generation). Evidence: trends over 10-50 years, cyclical patterns (e.g., economic cycles, population changes).
  - Longue durée: Long-term structures (centuries or more). Evidence: persistent features (geological, climatic, institutional) that change very slowly or are effectively permanent.

  For each element (problem, intervention, effect), we:
  a. List the evidence provided that speaks to the time scale.
  b. Assign a register based on the evidence. If multiple registers are possible, note the ambiguity.
  c. Identify the evidence that would overturn the assignment (e.g., if a problem is assigned to event, evidence showing it is part of a longer cycle would overturn).

  Step 2: Rules for Mismatches
  We define two key mismatches:
  Mismatch 1: Event-scale intervention justified by structure-scale claim (e.g., a quick fix for a long-term problem). This is generally disfavored because it may not address the underlying structure.
  Mismatch 2: Structure-scale intervention offered to fix an event (e.g., buying land to address a one-time storm). This is disfavored because it may be an overreaction.

  Rule for Mismatch 1: If the problem is in the longue durée and the intervention is event-scale, reject unless the proposal shows that the event-scale intervention is a necessary step within a long-term strategy and that the long-term strategy is already being pursued (with evidence). Otherwise, it's a patch.

  Rule for Mismatch 2: If the problem is an event and the intervention is structure-scale (longue durée or conjuncture), reject unless the proposal provides strong evidence that the event is a symptom of a longer-term change (i.e., the event is not an isolated occurrence but a manifestation of a conjuncture or structure) and that the structure-scale intervention is the only effective response.

  Step 3: Distinguishing Slow Trend from Structure
  A slow trend (conjuncture) vs. a structure (longue durée) must be distinguished. Persistence alone is not enough for the longue durée. Additional criteria for structure (longue durée):
  - The phenomenon is invariant under changes in human institutions, technology, or social organization (e.g., geology, climate patterns).
