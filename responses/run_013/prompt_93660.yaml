prompt: |-
  I am a doctoral student in a science and technology studies department, and I have just spent a fortnight in a seminar working through the old quarrel over whether technical artefacts can be political — Winner's essay and its two ways of reading the question, and the constructivist insistence that a thing's politics lies in the meanings and uses that social groups assign to it rather than in the thing itself. I have come to think that both parties load too much weight onto design. Each of the standard examples, the low bridge and the mechanical tomato harvester included, is a case in which someone chose something or a group read something into it; the artefact's political content turns out to be either a decision or an interpretation, and the interesting question is only which.

  What I keep running into, and cannot place in either camp, is what I have taken to calling politics by attrition: cases in which an artefact is politically consequential neither because it forecloses an option nor because anyone reads it as doing so, but because of the small, recurring, unremarkable demands it makes of a particular class of users — demands that fall below the threshold of design intent and below the threshold of interpretation, and that are nevertheless dictated by the artefact's material properties rather than by convention or by anyone's expectation. The politics, on this reading, is carried by the cumulative cost of compliance rather than by any decision or any meaning.

  I would like you to give me five examples of artefacts or technical systems whose politics is best described in that way. Please give the answer as a numbered list of exactly five items, each one or two sentences long: name the artefact, say what recurring demand it imposes and on whom, and indicate why that demand cannot be redescribed as a design decision or as an interpretation. No introduction, no conclusion, and no table. Write in British English.
reasoning: |-
  Okay, the user is a doctoral student in science and technology studies, deeply engaged in the debate about whether technical artefacts can be political. They've just spent two weeks in a seminar discussing Langdon Winner's ideas—like the low bridges and mechanical tomato harvester—and the constructivist view that politics comes from social interpretations. The user feels both sides focus too much on design, where politics is either a decision or an interpretation. Instead, they're interested in "politics by attrition": cases where an artefact's political impact comes from small, recurring demands on users that aren't about intent or meaning, but arise from material properties. They want five examples that fit this, described concisely in British English. 

  Hmm, the user's query is sophisticated and shows they've moved beyond the standard arguments. Their frustration with design-centric views suggests they're seeking a more nuanced, materialist perspective. The concept of "attrition" points to everyday, embodied experiences—like minor physical adjustments or time costs—that accumulate over time. This feels aligned with feminist STS or disability studies, where mundane interactions with technology can reinforce inequalities without conscious design or interpretation. 

  For the examples, I need to pick artefacts where the demand is inherent to materiality, not reducible to decision or reading. Each must highlight cumulative costs falling on specific groups. Let's brainstorm: urban infrastructure often has this effect—think kerbs without ramps forcing wheelchair users to take longer routes. Or workplace tech like standing desks that subtly pressure workers into discomfort. Digital systems too, like CAPTCHAs that burden neurodivergent users with repetitive tasks. 

  I'll ensure each example clearly shows: the artefact, the recurring demand, the affected group, and why it's not design or interpretation. For instance, high-mounted soap dispensers—their height isn't necessarily malicious design, nor is it "interpreted" as exclusion; it's just a physical mismatch that tallies up inconvenience for shorter people daily. Similarly, public benches with armrests: meant to prevent sleeping, but for older people, the constant strain of sitting down and rising is a material demand that wears on their bodies. 

  The response must stick to British English and be exactly five items, no extras. This will give the user concrete cases to build their argument, helping them carve out a third position in the polemic they're navigating. It might even resonate with their own embodied experiences—academia is full of such attritional technologies!
answer: |-
  1.  **Standard-height kitchen worktops:** Require shorter individuals to consistently reach upwards or stand on stools for food preparation, imposing a cumulative physical strain that stems from the fixed material dimensions rather than a specific exclusionary intent or a socially constructed meaning of height inferiority.
  2.  **Public seating with fixed armrests:** Demand extra effort from older or less mobile users each time they sit down or stand up, creating a recurring physical burden dictated by the seat's rigid structure, distinct from any conscious design to inconvenience them or a symbolic interpretation of the armrests.
  3.  **Automatic hand dryers with short activation times:** Force users, particularly those with limited dexterity or mobility, to repeatedly wave or reposition hands beneath the sensor, a demand arising directly from the device's sensor range and timing mechanisms, not a designed disregard nor an interpreted message of impatience.
  4.  **Fixed-cycle domestic washing machines:** Require users managing incontinence, young children, or specific medical needs to run multiple partial cycles for small loads, incurring a recurring time and resource cost dictated by the machine's preset water and energy minimums, independent of designers assuming "standard" laundry volumes or users interpreting inefficiency as neglect.
  5.  **Non-adjustable monitor stands:** Cause users of significantly different heights to maintain sustained poor neck posture during computer work, a cumulative ergonomic toll dictated by the monitor's fixed base height rather than an intentional design choice for average height or an interpretation of the monitor as "unfriendly".
