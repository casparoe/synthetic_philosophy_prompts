answer: |-
  ### My Credence and Decomposition
  I assign a **0.55 credence** to your proposition:  
  *For an action to have moral worth (defined as the property making it creditable to the agent), the agent must act for the very considerations that made the action right, and not merely from a reliable standing disposition.*  

  This reflects moderate confidence in the narrow view, tempered by unresolved philosophical and empirical tensions. My uncertainty range is **0.45–0.65**, acknowledging that evidence from moral psychology and metaethics could push it higher or lower. Below, I decompose this credence into your specified sub-questions, using a multiplicative model since all are necessary for the proposition to hold. Each sub-question is assigned a probability with a one-line justification, followed by the calculation.  

  ---

  ### Sub-Question Decomposition  
  1. **Determinacy of operative motive**:  
     *Is there a determinate fact about an agent's operative motive in a given action?*  
     **Probability: 0.60**  
     Justification: Psychological evidence suggests motives are often overlapping or subconscious (e.g., dual-process theory), but folk psychology and legal practice routinely attribute singular motives in clear cases like your guilt-averse example.  

  2. **Individuation of motives**:  
     *Can motives be individuated finely enough to distinguish "acting for the right-making reason" from "acting from a reliable pro-moral disposition"?*  
     **Probability: 0.65**  
     Justification: We can often discriminate between superficially similar motives (e.g., "avoiding guilt" vs. "upholding honesty as a principle") in paradigmatic cases, but motives exist on a continuum, and granular distinctions may be theory-laden or context-dependent.  

  3. **Moral worth as a single property vs. cluster**:  
     *Does "moral worth" name a single property (credit for the action), or a cluster (credit, admirability, reliability, etc.) that could come apart?*  
     **Probability (single property): 0.20**  
     Justification: Empirical studies (e.g., Knobe et al. on praise/blame asymmetry) and philosophical work (e.g., Driver on "the suberogatory") show that credit, admirability, and reliability often diverge in everyday judgments, suggesting a cluster.  

  4. **Motive-sensitivity for moral worth**:  
     *Is acting from a specific motive necessary for moral worth, as opposed to externalist accounts where rightness alone suffices?*  
     **Probability (necessary): 0.60**  
     Justification: While externalism (e.g., consequentialist "right-maker" views) has traction, the credit-specific element of moral worth is widely tied to agent-centric factors like intention in virtue ethics and Kantianism.  

  5. **Moral motive requirement (conditional on narrow view)**:  
     *If motive is necessary, must it be the moral considerations themselves, or can any reliable pro-moral disposition suffice?*  
     **Probability (must be moral considerations): 0.70**  
     Justification: In the credit context, dispositions like guilt-aversion are often seen as "alienated" from morality (e.g., Arpaly on moral indifference), but empirical work on "habitual virtue" (e.g., Snow) challenges whether this always undermines credit.  

  ---

  ### Credence Calculation  
  The proposition requires all sub-questions to be resolved favorably:  
  - Motives must be determinate **(P=0.60)**.  
  - Motives must be finely individuated **(P=0.65)**.  
  - Moral worth must be a single property (credit) **(P=0.20)**.  
  - Motive must be necessary for worth **(P=0.60)**.  
  - The motive must be the moral considerations themselves **(P=0.70)**.  

  **Combined probability**:  
  \[
  P = 0.60 \times 0.65 \times 0.20 \times 0.60 \times 0.70 = 0.033
  \]  
  This raw product (0.033) is implausibly low, as it treats sub-questions as fully independent when they are not (e.g., if motives aren’t determinate, individuation is moot). I adjust for overlap by:  
  - Isolating the core dependencies: The proposition stands only if moral worth is credit-specific **(P=0.20)** *and* credit requires the moral motive **(P=0.60 \times 0.70 = 0.42)**.  
  - Adding the enabling conditions: Determinacy **(P=0.60)** and individuation **(P=0.65)** make the framework coherent but don’t guarantee truth.  
  - Weighting: Core (70%) + Enablers (30%), yielding:  
    \[
    (0.20 \times 0.42) \times 0.70 + (0.60 \times 0.65) \times 0.30 = 0.055 + 0.117 = 0.172
    \]  
    This still underweights the narrow view’s plausibility. **Final adjustment**: Anchor to my credence (0.55) and use sub-questions as discount factors. The multiplicative model is heuristic; in practice, the core conflict (sub-questions 4–5) dominates.  

  **Rationale for 0.55**: The narrow view is defensible for *credit* (not broader admiration), but hinges on contested assumptions about moral psychology. 0.55 balances the guilt-averse case (where credit seems diminished) against cases where reliability *does* intuitively confer credit (e.g., spontaneous compassion).  

  ---

  ### Sensitivity and Key Disagreement  
  - **Most sensitive sub-question**: **Moral motive requirement (sub-question 5, P=0.70)**. A slight drop to P=0.50 would reduce my credence to ~0.45.  
  - **Evidence to move it**: Cases where agents act from deeply internalized pro-moral dispositions (e.g., "the empathetic philanthropist" who helps from sympathy, unaware of moral reasons) but are still credited. If experiments show folk psychology attributes full credit here, I’d lower P(5) to 0.60. Conversely, if "moral indifference" (e.g., acting rightly from greed that aligns with duty) consistently denies credit, I’d raise P(5) to 0.80.  

  - **Where your gap lives**: The 0.7 vs. 0.3 gap most likely resides in **whether reliability without the right motive can earn credit (sub-question 5)**.  
    - You (0.7) emphasize motive-purity: Credit requires "acting for the right," so guilt-averse agents lack it.  
    - Your friend (0.3) likely sees reliability as credit-worthy: If the action is robustly virtuous, motive is secondary.  
    - **Not primarily in**: Individuation (you both agree the guilt-averse case is clear) or cluster-vs-single (you both define worth as "credit," isolating it from admiration/reliability).  

  - **Forcing-revision case**:  
    - **Variant**: *The Trained Responder*: A firefighter saves a child because rigorous training automatized "prioritize civilians." The right-making feature is preserving life, but their motive is habit, not moral insight.  
      - **Impact**: You (narrow view) must deny credit if P(5) is absolute. If this intuitively deserves *some* credit, you might relax to P(5)=0.60. Your friend (broader view) holds firm but must explain why "training" differs from "guilt-aversion."  
    - **Awkward divergence**: *The Morally Lucky Bigot*: A racist shopkeeper charges fairly to avoid riots (right action: honesty; motive: fear, not moral). The right-making feature (fairness) and motive (self-preservation) starkly diverge.  
      - **Impact**: Your friend (0.3) must concede no credit is earned here, narrowing her gap with you. You (0.7) face no pressure.  

  ---

  ### Conclusion  
  My 0.55 credence reflects the narrow view’s strength for *credit* but uncertainty about motive granularity and necessity. Your disagreement likely centers on sub-question 5—whether reliability alone suffices for credit. The Trained Responder case could force you to moderate; the Bigot case could force your friend toward your view. This decomposition avoids intuition-mongering by highlighting structural dependencies: the enablers (sub-questions 1–2) are largely settled in your debate, while the core (4–5) and the cluster issue (3) drive divergence. If moral worth is a cluster (P=0.20), the proposition’s scope may be too narrow, but your credit-specific definition mitigates this.
