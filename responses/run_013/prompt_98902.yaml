prompt: |-
  I sit on a hospital system's ethics committee, which reviews proposals for new markets in health-related goods and services. We have no formal doctrine, but our track record is as follows. We rejected a proposal to let patients sell one of their kidneys, on the grounds that it would exploit poor donors and crowd out altruistic donation. We approved, with conditions, a proposal to let a research consortium pay healthy volunteers for participation in a risky first-in-human trial; the conditions were that payment not be contingent on completing the trial, that it be capped, and that an independent monitor screen for undue inducement. We rejected a proposal to let shareholders sell their votes in a corporate election, on the grounds that voting is a fiduciary act whose point is not to be traded. We approved, with conditions, surge pricing for bottled water and generators during a declared emergency, but only after the company agreed to a price cap and to supply essential medicines at pre-emergency prices; our reasoning was that prices can allocate scarce goods and signal where need is greatest, but that some goods must not be rationed by ability to pay. We rejected a proposal to let individuals buy carbon offsets for their own flights and call it climate neutrality, because it would let people discharge a duty without changing the underlying conduct and because the offsets might not be additional. We approved, with conditions, a market in personal data in which users could opt in, share revenue, and exclude health data, on the grounds that people have an interest in controlling their data but that some data are constitutive of privacy rather than mere commodities. A recurring theme in our reasoning, though never adopted as a formal test, has been a distinction between price as a discovery mechanism, a way of surfacing dispersed information about demand and cost, and price as a rationing device, a way of allocating a good by ability to pay. We have tended to permit the former and resist the latter.

  Now a new proposal is before us. A private clinic wants to create a marketplace in which patients on a waiting list for a scarce, life-saving treatment can sell their place in the queue to the highest bidder. The clinic would take a 15 percent fee and use the proceeds to fund treatment for uninsured patients. Sellers would be adults who are competent, have been fully informed, and are not being coerced; buyers would be wealthy patients or their families. The treatment is not experimental, but it is in short supply, and the queue is currently managed by a combination of medical need and waiting time.

  The question is not what I personally think is just. It is what our committee should decide if it wants to be consistent with its own precedents. Identify the candidate principles that could explain our past rulings—at least three, and make sure they are genuinely different, not restatements of one another. For each, say what verdict it predicts on the queue-sale proposal and why. Then give your best guess about which principle we are implicitly committed to, with reasons, and say which past ruling is the closest analog. If our precedents genuinely underdetermine the new case, say so, and explain what principle we would be adopting if we approve and what principle we would be adopting if we reject. Finally, name a further case—one not in our track record—that would best distinguish between the surviving principles, and say what verdict each principle would give in that case.
reasoning: |-
  Okay, the user is part of a hospital ethics committee that reviews proposals for new health-related markets. They've provided their track record of decisions and want to apply consistent principles to a new proposal about patients selling their place in a waiting list for life-saving treatment. 

  First, I need to understand their pattern. They seem to draw a line between using prices as information tools versus rationing tools. For example, they allowed surge pricing for essentials with caps (information function) but banned kidney sales (rationing concern). The carbon offset rejection also fits here—it wasn't truly informative about environmental impact.

  Now the new case: letting patients auction queue positions. The clinic takes a cut to fund uninsured care. Superficially, it resembles surge pricing (using price to allocate scarce resources), but the "good" here isn't a product—it's queue position, which feels different. 

  For principles, I'm seeing three candidates: 
  1) The information-vs-rationing distinction they hinted at. 
  2) Whether the thing being sold has intrinsic non-commodity value (like votes or kidneys). 
  3) Whether the market corrects or worsens existing inequities (they cared about exploiting the poor in kidney sales).

  Testing these: Principle 1 might approve queue sales since it surfaces who values the spot most (information), but Principle 2 would reject—queue positions aren't mere commodities; they're tied to medical need. Principle 3 is tricky—it could argue either way (funding uninsured = equity vs. favoring wealthy = inequity).

  The closest past analog is their surge pricing decision. Both involve scarce essentials during critical times, but queue positions feel more ethically charged than bottled water. If they approved surge pricing with caps, consistency might push them to approve this... but I suspect Principle 2 is stronger in their history. The vote-selling rejection shows they care about certain things being "sacred."

  For a distinguishing future case: imagine paying people to accept lower-quality healthcare. Principle 1 might allow it (reveals preference for risk-taking), while Principle 2 would ban it (health isn't commodifiable). That'd force the committee to choose between consistency with surge pricing (info focus) or with kidney/vote cases (anti-commodification).
answer: |-
  Based on your committee's track record and reasoning patterns, here are three distinct candidate principles, their application to the queue-sale proposal, and an analysis of consistency:

  ---

  ### **Candidate Principles**
  1. **Principle of Non-Commodification of Intrinsic Goods (NCI)**  
     *Basis in Precedents:* Rejected kidney sales (body integrity as non-tradable), rejected vote sales (fiduciary duty as non-tradable), restricted personal data market (health data as constitutive of privacy).  
     *Core Idea:* Certain goods (e.g., bodily integrity, fiduciary roles, core privacy) lose their moral meaning if treated as commodities. Markets in these goods exploit inherent dignity or social function.  
     **Verdict on Queue-Sale:** **Reject.**  
     *Why?* A queue position for life-saving treatment is tied to medical need—a foundational element of healthcare justice. Allocating it by wealth commodifies access to survival, undermining the principle that medical triage should reflect urgency and need, not purchasing power.  

  2. **Principle of Price as Discovery Mechanism vs. Rationing Tool (PDM vs. PRT)**  
     *Basis in Precedents:* Approved surge pricing (price signals scarcity *with caps*), approved paid trials (price compensates risk *without coercion*), rejected carbon offsets (price didn’t reveal real environmental demand).  
     *Core Idea:* Prices are permissible when they reveal dispersed information (e.g., resource scarcity, risk value) but impermissible when they solely ration by wealth, especially for essential goods.  
     **Verdict on Queue-Sale:** **Reject.**  
     *Why?* The queue position’s price would primarily reflect *buyers’ wealth*, not the urgency of medical need (e.g., a less-ill billionaire could outbid a dying pauper). This violates your surge-pricing condition: essential goods (like medicines) were protected from rationing by wealth.  

  3. **Principle of Exploitation/Equity Safeguards (EES)**  
     *Basis in Precedents:* Rejected kidney sales (exploits the poor), approved paid trials (independent monitors for undue inducement), approved surge pricing *only* with price caps and medicine protections.  
     *Core Idea:* Markets may be allowed if they include robust safeguards against exploitation (e.g., payment caps, third-party oversight, equity provisions) and benefit vulnerable groups.  
     **Verdict on Queue-Sale:** **Approve with Conditions.**  
     *Why?* The clinic’s fee funds uninsured patients, creating an equity offset. If conditions were added (e.g., strict price caps, buyer means-testing to ensure medical urgency, oversight for seller coercion), it *could* align with your past approvals.  

  ---

  ### **Best Guess for Implicit Commitment**
  - **Principle 1 (NCI)** is the strongest fit.  
    *Reasons:*  
    - Your rejections of kidney/vote sales center on the *intrinsic nature* of the goods, not just inequity. Votes and kidneys are invalidated as commodities regardless of safeguards.  
    - The surge pricing approval explicitly excluded essentials (medicines), showing a boundary against commodifying life-saving access.  
    - "Queue position" mirrors "vote": a non-tradable social commitment (medical triage by need) that loses legitimacy when sold.  
    - **Closest Analog:** Rejecting vote sales. Both involve converting a procedural entitlement (voting/triage) into a tradable asset, corrupting its purpose.  

  **Why Not PDM vs. PRT?** While central to your reasoning, this principle is *subordinate* to NCI. You permitted price discovery only when commodification was acceptable (e.g., water bottles, non-health data).  

  **Why Not EES?** Safeguards were insufficient for kidneys/votes, suggesting NCI trumps EES when intrinsic goods are at stake.  

  ---

  ### **If Precedents Underdetermine the Case**  
  Your precedents **do not underdetermine** this case. NCI and PDM vs. PRT both clearly reject queue sales. EES could approve it but conflicts with stronger themes in your history.  

  - **If You Approve:** You adopt **EES** as dominant, prioritizing equity offsets (funding uninsured) over non-commodification.  
  - **If You Reject:** You reaffirm **NCI**, holding that life-saving queue positions are intrinsic to medical justice and non-tradable.  

  ---

  ### **Distinguishing Future Case**  
  **Proposal:** *A marketplace for living liver lobe donations, where donors receive capped, regulated payments funded by a nonprofit that also covers recipient costs for low-income patients.*  

  - **NCI Principle:** **Reject.** Body parts are intrinsically non-commodifiable (like kidneys). Payment undermines dignity, even with safeguards.  
  - **PDM vs. PRT:** **Reject.** Price rations life-saving organs by wealth, failing as a discovery tool (demand is universal; supply is fixed).  
  - **EES Principle:** **Approve with conditions.** Capped payments, third-party oversight, and equity provisions (funding poor recipients) align with paid trial/surge pricing approvals.  

  **Why it Distinguishes:**  
  - NCI/EES conflict sharply here, forcing a choice between anti-commodification and equity-focused pragmatism.  
  - PDM vs. PRT would reject (as with kidneys), but EES could approve—highlighting whether your committee prioritizes safeguards over intrinsic goods.  

  --- 
  **Conclusion:** Your committee’s implicit commitment to **non-commodification of intrinsic goods (NCI)** predicts rejection of the queue-sale proposal. The closest analog is your rejection of vote sales, as both involve converting a procedural entitlement into a commodity. The liver donation case would best test whether NCI or EES dominates in future rulings.
