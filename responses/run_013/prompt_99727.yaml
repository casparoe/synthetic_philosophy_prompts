prompt: |-
  I cover science and ideas for a general-interest magazine, and next month I am leading a forty-five-minute salon at a literary and ideas festival on how conventions harden into norms — and why they so often outlive the coordination problems that first made them useful. The audience will be educated non-specialists: a few will have read some philosophy, most will not, and a handful will be policy people who care about norm change. I want you to plan the explanation for me, not deliver it. I am not asking for a reading list, citations, or a survey of the literature; I need a teaching sequence.

  The intellectual spine I want to build on is the account of convention associated with David Lewis: a regularity in behavior that solves a recurrent coordination problem, where everyone prefers to conform given that others conform, and where alternative regularities would have worked just as well. But I want the talk to end somewhere Lewis does not quite take it. A researcher I have been interviewing describes what she calls normative lag: a regularity that began as a Lewis-style solution to a coordination problem can persist after the original problem has vanished, and can then acquire the feel of an independent obligation — people follow it, expect others to follow it, and resent deviation, even when no one's interests are being coordinated by it anymore. I want the audience to understand both the original mechanism and this drift from convention to norm.

  Please give me a plan with the following elements. First, the order in which the ideas must be introduced, with an explicit account of what depends on what; tell me where the audience will be tempted to jump ahead and why that jump would break the argument. Second, the single carrying example that should do most of the work. I am tempted by the old standbys — driving on one side of the road, or standing on the right of an escalator — but if one of those is the wrong choice, say so and tell me what should replace it, what features the replacement must have, and what it must avoid. Third, the misconceptions you expect this audience to bring or form: for instance, that a Lewis convention is just a shared habit, that it requires an explicit agreement or a promise, that common knowledge is merely mutual belief, that norms are simply conventions plus punishment, or that normative lag is a story about biological evolution. Tell me where in the sequence each misconception is most likely to appear and exactly how I should head it off. Fourth, one question I can put to the room near the end that would show whether they have grasped the difference between a coordination equilibrium and a norm with independent normative force, rather than merely memorized the vocabulary. Fifth, what I should deliberately leave out at this level — the formal apparatus, the infinite hierarchy of common knowledge, the debates about whether Lewis's account is reductive — and how I should signal that omission without making the audience feel cheated.

  I would like the plan to be concrete enough that I can rehearse from it, and honest about the places where the audience is likely to resist. Where a term is unavoidable but potentially misleading, tell me whether to keep it, replace it, or define it on the spot.
reasoning: |-
  Okay, let me tackle this request. The user is a science and ideas writer preparing a salon talk on how conventions become norms and persist beyond their usefulness. They need a teaching plan based on David Lewis's convention theory, ending with normative lag. 

  First, I need to identify the core structure. The explanation must start with coordination problems as the foundation, since everything else builds on that. If we jump straight to conventions, the audience might miss why conventions exist in the first place. The sequence should be: coordination problem → convention → normative lag. Each step depends on the previous one.

  For the carrying example, driving side seems perfect. It's universally relatable, has clear coordination logic, and shows how arbitrary choices become binding. Escalators are tempting but risk confusion with politeness norms. Driving side keeps it purely about coordination without moral overtones. Must avoid examples with intrinsic meaning (like handshakes) or mixed motives.

  Key misconceptions to address:
  - Conventions vs habits: clarify intentional coordination aspect early when defining conventions
  - Need for explicit agreements: use driving example to show emergence without discussion
  - Common knowledge complexity: acknowledge but simplify to "everyone knows everyone knows" without hierarchy
  - Punishment as norm marker: explain resentment comes before enforcement mechanisms
  - Biological evolution: explicitly contrast with cultural transmission during normative lag

  The diagnostic question should force distinction between practical coordination and perceived obligation. "Would you switch driving sides if possible?" works well - yes for coordination, no if norm internalized. 

  Deliberate omissions:
  - Formal game theory matrices (use narrative descriptions)
  - Infinite regress of common knowledge (call it "shared public awareness")
  - Reductionism debates (mention philosophical depth but stay practical)

  Biggest resistance points: 
  - Accepting conventions without communication (counter with traffic examples)
  - Grasping non-instrumental resentment (emphasize emotional shift in lag phase)

  For terms: 
  - Keep "coordination problem" (intuitive)
  - Replace "equilibrium" with "stable pattern"
  - Define "normative force" as "feels morally required"

  The flow should feel like peeling layers: start concrete (traffic), build theory, then reveal hidden transformation. Practice transitions between stages clearly - that's where minds wander.
answer: |-
  Here’s a concrete teaching sequence designed to build understanding step-by-step, using a strong central example while preempting misconceptions. Rehearse this as a narrative arc:

  **Core Example: Driving Side Conventions**  
  *Why it works*: Universally relatable, purely functional origin, arbitrary choice (left/right), clear coordination payoff (avoiding crashes), and visceral understanding of resentment when violated. *Avoid* escalators (often conflated with politeness) or language (adds unnecessary complexity).

  ---

  ### **Teaching Sequence: The 5-Stage Arc**
  **Total Time**: 45 mins (≈8–9 mins per stage + Q&A)  
  **Goal**: Show how *functional coordination* → *self-reinforcing convention* → *autonomous norm with "moral" force*.

  #### **Stage 1: Start with the Coordination Problem (Foundation)**  
  - **Key Idea**: Some problems *require* mutual adjustment. No "best" individual choice—success depends on others’ choices.  
  - **Example**: *Driving on roads*. Ask: *"What if half chose left, half right? What if everyone chose independently?"* Highlight chaos/crashes.  
  - **Crucial Dependency**: If audience skips this, they’ll see conventions as arbitrary habits, not solutions.  
  - **Preempt Misconception**: *"Is this just about habits?"* → No: Habits lack strategic interdependence. Contrast brushing teeth (habit) vs. driving side (coordination).  
  - **Term**: Use "coordination problem" freely—it’s intuitive.

  #### **Stage 2: Introduce Convention as a Solution**  
  - **Key Idea**: A *regularity* emerges because everyone prefers matching others’ behavior, even if alternatives exist (left *or* right could work).  
  - **Example**: *Driving on the left in the UK*. Stress:  
    - It works *because* others do it (not inherent superiority).  
    - No agreement needed—it emerges from repeated interactions.  
  - **Lewis Core**: Conventions solve coordination problems; conformity is *conditional* ("I do it if you do").  
  - **Preempt Misconception**: *"Does this require laws/promises?"* → No. Show convention arising organically (e.g., historical roads before laws).  
  - **Temptation to Jump**: Audience might conflate convention with "tradition." Anchor in *function*: *"What problem did this solve originally?"*

  #### **Stage 3: The Role of Common Knowledge (Simplified!)**  
  - **Key Idea**: Conventions rely on *shared awareness*: "I know you know I know we drive on the left."  
  - **Example**: *Tourists driving in a foreign country*. Ask: *"Why is it stressful? Because you can’t assume others know what you expect!"*  
  - **Simplify**: Call it "public knowledge" or "shared expectation." *Omit* infinite hierarchies.  
  - **Preempt Misconception**: *"Is this just mutual belief?"* → Stress predictability: *"It’s not enough that I believe you’ll drive left; I need to know you know I believe it, so I can trust your behavior."*  
  - **Signal Omission**: *"Philosophers model this with intricate layers, but for us, ‘we all know the rules’ captures the essence."*

  #### **Stage 4: Normative Lag – The Drift to Obligation**  
  - **Key Idea**: When the *original problem vanishes*, the convention may persist and gain independent "ought-ness."  
  - **Example**: *Self-driving cars eliminate crashes*. Yet people still resent "wrong-side" driving. Ask:  
    - *"If AI coordinates perfectly, why care if a human drives on the right in the UK?"*  
    - *"What if your GPS said ‘drive on the right today—it’s efficient’?"*  
  - **Mechanism Shift**: Resentment now targets *disloyalty to the group*, not just risk.  
  - **Preempt Misconception**:  
    - *"Is this biological evolution?"* → No, it’s cultural: Norms spread via disapproval, not genes.  
    - *"Is it just convention + punishment?"* → Punishment emerges *from* the felt obligation ("This is *our* way!"), not the other way around.  
  - **Resistance Point**: Audience may insist resentment is "rational." Ask: *"If no safety issue exists, is the anger still rational?"*

  #### **Stage 5: Contrast Coordination Equilibrium vs. Normative Force**  
  - **Diagnostic Question**:  
    *"Imagine a country switches driving sides overnight with perfect compliance. In the coordination phase (Week 1), you follow to avoid crashes. By Year 5, crashes are impossible thanks to smart roads. You see someone driving on the old side. Do you react differently? Why?"*  
  - **Ideal Answer**: Week 1 = pragmatism ("I need to match them"). Year 5 = indignation ("They’re disrespecting our way!"). Reveals the *normative leap*.  
  - **Clincher**: *"The convention became a norm when its value shifted from ‘what works’ to ‘what’s right’."*

  ---

  ### **Deliberate Omissions & Signals**  
  - **Formal game theory** (matrices, Nash equilibria): *Signal*: "Lewis uses game theory, but we’re focusing on the social glue."  
  - **Reductionism debates** (e.g., "Can norms *really* be reduced to conventions?"): *Signal*: "This is a powerful lens, not the whole story—philosophers still debate!"  
  - **Infinite common knowledge**: Already handled in Stage 3.  

  ---

  ### **Rehearsal Notes**  
  - **Pacing**: Stages 1–3 (20 mins), Stage 4 (15 mins), Stage 5 + Q&A (10 mins).  
  - **Resistance Hotspots**:  
    - Stage 2: "Conventions need enforcement!" → Refocus on emergence (e.g., footpaths in snow).  
    - Stage 4: "But norms *always* have a function!" → Cite etiquette norms (e.g., men’s hats indoors) where function is lost.  
  - **Terminology**:  
    - Use "normative force" but immediately rephrase: "the feeling that it’s *morally* wrong to break it, even without consequences."  
    - Replace "equilibrium" with "stable pattern" unless context makes it obvious.  

  This sequence mirrors how norms *actually* emerge: problem → solution → habit → sacredness. The driving example withstands scrutiny at every stage and forces audiences to confront the shift from pragmatism to moralism. By ending with the diagnostic question, you avoid definitions and test conceptual grasp.
