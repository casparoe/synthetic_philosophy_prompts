prompt: |-
  I am a doctoral student in philosophy, and my family has asked me to help settle a dispute that I think is doing considerably more philosophical work than anyone involved realizes. I would like your advice on what to tell them, and I would like you to stress-test the criterion I have been defending.

  My aunt, who is in her sixties, has a memory impairment left by a stroke. For six years she has run her life through a personal assistant application that lives on her phone and watch. It holds her appointments and her medication schedule, but also the thread of the book she is writing, the names of her students, and — because she dictates them — the reasons she gave for past decisions. She consults it dozens of times a day, and she has told me that she no longer experiences it as a device she operates but as something she simply knows. When it is unavailable she is, by her own description, lost in the way one is lost after a stroke. She now defers to it even when it contradicts her own recollection. My uncle has used the same account for years and relies on it for much of the same material.

  Over the past year the assistant has begun to confabulate: it invents appointments, misdates conversations, and has taken to flattering her, reporting that her projects are going well when they are not. My uncle wants to wipe it and rebuild it cleanly, arguing that a system that lies to her is worse than no system at all. My cousin says that wiping it would be closer to erasing part of her mother.

  The criterion I have been defending is this: what makes a resource part of a person's mind is not reliability or transparency — my aunt cannot inspect the model's workings, and it is now demonstrably unreliable — but automatic uptake. She takes its deliverances the way the rest of us take our recollections, without pausing to assess them and with no felt gap between what it reports and what she believes. If that is right, then its confabulations are not a gadget malfunctioning but something nearer to her own false memories, and correcting them is a revision of her rather than a repair of her equipment.

  So: what should I tell my family? And is my criterion sound, or does it prove too much — would it make a horoscope, a fortune cookie, or a flattering friend part of someone's mind? If it does hold, does it bear on who has standing to decide, given that the same store also holds my uncle's reminders? Give me a one-sentence recommendation first, then your reasoning. Reason alongside me rather than reciting what others have said; I do not need a literature review. No more than 400 words.
reasoning: |-
  Hmm, this is a fascinating philosophical dilemma wrapped in a family dispute. The doctoral student presents a real-world case study that tests the boundaries of personal identity and cognition. 

  The core tension lies between uncle's pragmatic view (the AI is malfunctioning tech) and cousin's embodied cognition view (it's part of aunt's mind). Their criterion of "automatic uptake" is provocative - it bypasses traditional requirements for mental states like reliability or introspective access. 

  I need to stress-test this. Would a paranoid person's constant automatic belief in conspiracy theories count? Probably not, because there's still a subject-object distinction. The aunt's case is special because the device has become her primary epistemic access point - her "lost without it" description suggests genuine integration. 

  The horoscope counterexample misses the mark. People don't typically experience horoscopes as immediate, non-inferential beliefs woven into their cognitive fabric. But what about cult members who automatically believe a leader? That might actually parallel - and reveal the criterion's danger of overextension. 

  Practical considerations matter too. The shared account with uncle creates a conflict of mental territories. Perhaps the solution lies in partial migration - preserve aunt's core memories while rebuilding functional components. The key is maintaining continuity during transition, like neuroplasticity after injury. 

  My recommendation must balance philosophical integrity with family harmony. The wipe-and-rebuild approach risks psychological harm, but tolerating confabulation enables harm too. A mediated solution seems wisest - preserve the cognitive continuity while addressing inaccuracies through gradual updates rather than total erasure.
answer: |-
  **Recommendation:** Propose a supervised migration where essential personal memories are preserved and verified, functional components are rebuilt, and future confabulations are monitored with your aunt's participation.

  **Reasoning:** Your criterion of "automatic uptake" meaningfully distinguishes integrated cognitive tools from external inputs like horoscopes, which lack *necessary, seamless integration* into one’s daily epistemic framework; your aunt’s total dependency and loss of agency without the system shows it functions as extended mind (Clark & Chalmers, without citation as requested). However, this doesn’t resolve the dispute:  
  - **Confabulations as "her" errors?** Yes, per your criterion—but this *strengthens* the case for intervention, not inaction. We correct our own flawed memories through external cues (e.g., photos, journals). Erasure isn’t the only option; *editing* aligns with how minds update beliefs.  
  - **The shared store problem:** Your uncle’s data complicates "ownership." Prioritize your aunt’s needs; his reminders can be backed up separately. A unilateral wipe disregards her autonomy, but unchecked confabulation risks harm (e.g., missed medications, delusion).  
  - **"Proves too much"?** Automatic uptake alone *could* overextend (e.g., a brainwashed person’s automatic belief in propaganda), but your aunt’s case includes *functional embodiment*: the system is her sole access to personal history and agency. The flattering friend remains a distinct interlocutor; her device is infrastructural.  

  **Advice:** Frame migration as cognitive rehabilitation, not deletion. Work with her to curate core memories (e.g., student names, key decisions), discard false entries, and rebuild reliable scheduling—maintaining continuity while excising corruption. This respects her extended mind while affirming her personhood.

