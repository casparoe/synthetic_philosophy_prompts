answer: |-
  Here are five comparative points addressing your concerns:

  1.  **Core Ontology:** The lineage view treats species as concrete historical individuals (particular segments of the tree of life), while the HPC view treats them as abstract patterns or kinds (clusters of co-occurring properties maintained by mechanisms).
  2.  **Defining Mechanism:** Lineage views prioritize reproductive isolation (or lineage separation) as the defining mechanism creating/changing segments. HPC views emphasize broader homeostatic mechanisms (e.g., gene flow, shared development, stabilizing selection, ecological constraints) that maintain trait clusters.
  3.  **Handling "Ugly Cases":** Lineage views struggle significantly with asexual taxa, rampant horizontal gene transfer (HGT), and ring species due to the breakdown of clear lineage separation/reproductive isolation. HPC views handle these better *conceptually* by focusing on trait clusters and mechanisms maintaining them (even if mechanisms like gene flow are weak or absent, replaced by others), though identifying clear boundaries remains empirically difficult.
  4.  **Individual vs. Kind:** Lineage views firmly position species as spatiotemporally bounded *individuals*. HPC views position species as *historical kinds* – natural kinds defined by homeostatic mechanisms operating within a specific lineage, blending kind-like properties with historical particularity.
  5.  **What Each Owes:** The lineage view owes us acceptance of somewhat arbitrary temporal boundaries and significant fuzziness/paraphyly in cases violating strict lineage separation. The HPC view owes us criteria for identifying the *relevant* property cluster and its maintaining mechanisms, tolerating more internal heterogeneity and potentially blurrier edges than lineage views expect.
