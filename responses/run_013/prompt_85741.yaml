answer: |-
  ### The Broken Vase  

  **First Half**  
  The vase lay shattered on the kitchen floor.  
  I saw the fragments when I entered first.  
  I did not see the crash, I closed the door.  
  I did not ask which hour it occurred.  
  The cat slept soundly on the window seat.  
  The kettle steamed away beside the sink.  
  I swept the shards into a careful heap.  
  I wiped the mess away with cloth and rag.  
  If you broke the vase, I forgive.  
  It held no meaning but its shape and hue.  
  I know the hours turn and things collide.  
  The porch light glimmers; I will wait for you.  

  **Second Half**  
  The vase lay shattered on the kitchen floor.  
  I saw the fragments when I entered first.  
  I did not see the crash, I closed the door.  
  I did not ask which hour it occurred.  
  The cat slept soundly on the window seat.  
  The kettle steamed away beside the sink.  
  I swept the shards into a careful heap.  
  I wiped the mess away with cloth and rag.  
  If you had broken the vase, I would forgive.  
  It held no meaning but its shape and hue.  
  I know the hours turn and things collide.  
  The porch light glimmers; I will wait for you.  

  The cat still sleeps, and footsteps near the gate.  

  ---

  ### Explanation of the Design:
  - **Parallel Structure**: Both halves are 12 lines each, with identical wording except for the refrain's verb form.  
  - **Refrain Shift**:  
    - *First Half (Indicative)*: "If you broke the vase, I forgive." Spoken hypothetically—since the speaker doesn’t know who broke it, forgiveness costs nothing.  
    - *Second Half (Counterfactual)*: "If you had broken the vase, I would forgive." Now the speaker knows *they* broke it, so the condition (you breaking it) is unreal. Forgiveness becomes a costly, unfulfilled wish.  
  - **Asymmetry**: The first half feels like patient waiting ("I will wait for you"). The second feels like regret—the speaker longs for a world where the other broke it and forgiveness was possible, but they must face their own fault.  
  - **Closing Line**: Unpaired and in the indicative ("The cat still sleeps, and footsteps near the gate"), it returns to the present moment, unresolved. The difference between halves stems only from knowledge, not events.  
  - **Domestic Focus**: A broken vase, swept shards, a sleeping cat—all mundane details avoid abstraction.  
  - **Emotional Arc**: The first half is light, almost procedural; the second aches with the weight of "what if." The shared language makes the shift in perspective stark.
