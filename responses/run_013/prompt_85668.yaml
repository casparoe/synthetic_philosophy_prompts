prompt: |-
  I'm a science-and-ideas reporter and I'm three weeks into a piece on a materials lab that keeps telling me their new stuff is "disposed to" do things, and I've stopped being able to tell when that's a claim and when it's a vibe. Before I file I want the spec, not the vibes: what does any account of "this thing is disposed to do X when Y" have to deliver before I can interrogate these people properly? Give me the requirements list -- the cases it has to get right, the distinctions it can't collapse, the results it can't contradict -- with the consideration behind each one, not just the label.

  Here's whats actually on my desk, so you can tell me which of my demands are doing real work and which are just my own hang-ups:

  - the fuse thing. A nanomaterial the lab calls disposed to conduct, except that hooking up the probes is what wrecks the conductive structure. So nobody will ever watch it conduct. Don't test it and you learn nothing; test it and it's dead. One of the grad students told me it conducts "when nobody's looking," which I'm fairly sure isn't a thing you can put in a paper.
  - the water that eats sugar. A sample of water with nanobots in it. Drop sugar in, sugar's gone, every time, in every condition I can think of. But it's the bots doing it, and a rival lab says the water isn't disposed to dissolve sugar at all, it's just arranged so that dissolving always happens. They're fighting about this and I can't tell if there's a fact of the matter or just a word.
  - the vase in the glove. My fact-checker's favorite. The vase would break if dropped, except the exhibit has a sensor and a net that catches it. It has never broken and never will. Still disposed to break?
  - the glowing rock. Half-life stuff. The physicist says the nucleus is disposed to decay, but nothing has to happen to it first, and when it goes it's a coin flip. So the if-Y-then-X shape doesn't seem to fit at all, which he seems to think is my problem rather than his.
  - the solvent nobody's made. A chemist tells me a compound is disposed to dissolve in a solvent that doesn't exist and maybe never will. Is that a claim about the compound or a claim about a possible world?
  - and the line I keep getting from everyone: that the disposition is "nothing over and above" the structure that produces it. I want to know what requirement that's meant to satisfy, and whether it satisfies it or just re-describes it.

  Then the honest call: which of these requirements are non-negotiable and which are just what one camp happens to care about. And the part I actually need for the piece -- flag any two things on my list that I probaly can't have at once. If a plain if-Y-then-X story can't survive the fuse, the water, and the vase together, say so flat out; that's the paragraph I'm running. Also tell me which single requirement does the most work, i.e. kills off the most accounts people actually hold.

  Don't bother scoring the contenders against the list, I'll do that in the piece. And make the very last line start with Verdict: followed by just the one requirement that eliminates the most otherwise-decent accounts, short phrase, nothing after it.
reasoning: |-
  Alright, let's tackle this query from the science reporter. They're working on a piece about a materials lab using the term "disposed to" in ways that blur the line between scientific claims and vague vibes. The reporter needs a clear set of requirements to evaluate such statements. 

  First, I need to understand the core problem. The lab's usage of "disposed to" seems ambiguous, making it hard to distinguish between testable properties and untestable assertions. The reporter provided six case studies that challenge different aspects of dispositional claims. Each case highlights a potential pitfall: the observer effect in the fuse, the agent vs. inherent property in the sugar water, the masked fragility in the vase, the probabilistic nature of the glowing rock, the counterfactual scenario for the solvent, and the reducibility to structure.

  The key here is to extract the essential criteria any dispositional claim must meet to be scientifically substantive. The reporter wants to know which requirements are non-negotiable versus philosophical preferences. They also need to identify conflicting requirements and which single criterion is most decisive in weeding out weak claims.

  Looking at the cases:
  - The fuse problem shows that testing the disposition destroys it. This raises questions about verifiability and intrinsic properties.
  - The sugar water debate centers on whether the disposition belongs to the water or the nanobots. This challenges attribution and reducibility.
  - The vase scenario questions whether a disposition exists if it's never manifested due to external preventions.
  - The glowing rock introduces probabilistic dispositions without triggers, conflicting with the standard conditional (if Y then X) structure.
  - The hypothetical solvent involves dispositions that can't be tested because the conditions don't exist.
  - The "nothing over and above" statement suggests dispositions are reducible to structure, but the reporter wants to know if this explains anything or just restates the problem.

  From these, I can distill the requirements:
  1. **Verifiability/Testability**: The claim must be testable in principle, even if not in practice, without destroying the disposition. The fuse fails here because testing it negates the property.
  2. **Attribution**: The disposition must be tied to the entity itself, not external agents. The sugar water case is problematic because the nanobots are doing the work, not the water.
  3. **Manifestation-Independence**: The disposition should exist even if never manifested. The vase meets this if fragility is inherent, regardless of the net.
  4. **Probabilistic Integrity**: Dispositions can be probabilistic without triggers. The glowing rock's decay fits here, challenging the standard conditional form.
  5. **Counterfactual Robustness**: Dispositions should hold in relevant possible worlds. The solvent case requires the disposition to be true even if the solvent doesn't exist.
  6. **Non-Vacuity**: The claim must add information beyond "current structure leads to behavior." The "nothing over and above" line might risk vacuity if it doesn't explain how the structure enables the disposition.

  The reporter also wants to know which requirements conflict and which one does the heaviest lifting. For conflicts:
  - **Verifiability vs. Counterfactual Robustness**: If a disposition can't be tested (like the solvent), it might still be valid in possible worlds, but this clashes with the need for empirical verification.
  - **Verifiability vs. Manifestation-Independence**: The vase's fragility can't be tested because of the net, but it's still considered fragile. However, without any possible test, it's just an assertion.

  The most decisive requirement is **Verifiability/Testability** because it eliminates claims that can't be tested even in principle, like the fuse (if testing destroys it) or the solvent (if the condition is impossible). This criterion forces dispositions to be grounded in empirical science rather than untestable assertions.

  Finally, the verdict highlights Verifiability as the requirement that filters out the most inadequate accounts, ensuring that dispositional claims are more than just vibes.
answer: |-
  Here’s your requirements list for dispositional claims, distilled from philosophical rigor and your case studies. Each requirement includes its *consideration* (why it matters) and how it handles your examples. Non-negotiable requirements are marked with **★**.

  ---

  ### **The Requirements List**  
  *(What a dispositional claim must deliver to be scientifically substantive)*  

  1. **Verifiability/Testability**  
     - *Consideration*: Must allow for *in-principle* empirical confirmation (even if indirect). Untestable claims are unfalsifiable vibes.  
     - *Cases*:  
       - **Fuse thing**: Fails. Testing destroys the property → no verifiable evidence.  
       - **Solvent**: Fails if solvent is *truly* impossible to synthesize (no test possible).  
       - **Glowing rock**: Passes (statistical decay observed).  

  2. **Attribution**  
     - *Consideration*: The disposition must belong to *the entity itself*, not contingent on external agents/structures. Avoids misassigning properties.  
     - *Cases*:  
       - **Water that eats sugar**: If bots are *external*, water lacks disposition; if bots are *intrinsic* (e.g., self-assembled), it holds.  
       - **Fuse thing**: Ambiguous—is conductivity intrinsic or probe-dependent?  

  3. **Manifestation-Independence**  
     - *Consideration*: The disposition exists *even if never manifested*. Otherwise, it’s just a description of history.  
     - *Cases*:  
       - **Vase in glove**: Passes—vase *would* break if net failed, so disposition persists.  
       - **Fuse thing**: Fails if testing *always* destroys it (no manifestation possible).  

  4. **Probabilistic Integrity**  
     - *Consideration*: Must accommodate probabilistic outcomes *without* a triggering condition (Y). Rejects rigid "if Y then X" literalism.  
     - *Cases*:  
       - **Glowing rock**: Passes—decay is probabilistic, no "trigger" needed.  
       - **Standard if-Y-then-X**: Fails here → shows why conditional logic is insufficient.  

  5. **Counterfactual Robustness**  
     - *Consideration*: Must hold in *relevant possible worlds* (not just actual one). Distinguishes real properties from lucky accidents.  
     - *Cases*:  
       - **Solvent**: Passes *if* the solvent is chemically possible (even if unmade).  
       - **Vase**: Passes—vase breaks in worlds without the net.  

  6. **Non-Vacuity**  
     - *Consideration*: Claim must add information beyond "current structure leads to behavior." Prevents "nothing over and above" from being a circular dodge.  
     - *Cases*:  
       - **"Nothing over and above" line**: Fails if it *only* re-describes structure → becomes untestable. Passes if it explains *why* structure enables future behavior (e.g., fragility due to atomic bonds).  

  ---

  ### **Your Demands: Real Work vs. Hang-Ups**  
  - **Real Work**: Verifiability, Attribution, Non-Vacuity. Without these, "disposed to" is poetry.  
  - **Your Hang-Ups**:  
    - Over-indexing on **if-Y-then-X** (glowing rock breaks this; it’s fine).  
    - Worrying about **"when nobody’s looking"** (valid if verifiable indirectly).  

  ---

  ### **Conflicts: What You Can’t Have at Once**  
  **You cannot have both:**  
  - **Verifiability** (requires testability)  
  - **AND** a disposition that **self-destructs upon testing** (fuse thing).  
    - *Why*: If testing *necessarily* destroys the property, verification is impossible → claim becomes untestable vibes.  
  - **Result**: A "plain if-Y-then-X story" **cannot survive the fuse, vase, and water cases together**. The fuse breaks verifiability, the vase requires counterfactuals, and the water challenges attribution.  

  ---

  ### **The Heavy Lifter**  
  **★ Verifiability/Testability** is **non-negotiable** and does the most work:  
  - Kills the **fuse** (untestable),  
  - Challenges the **solvent** (if solvent is impossible),  
  - Exposes **"nothing over and above"** if it avoids testable predictions.  
    - *Why*: Science demands empirical anchors. Without verifiability, "disposed to" is a vibe.  

  ---

  ### **Final Call on Non-Negotiables**  
  | Requirement          | Non-Negotiable? | Why                                                                 |
  |----------------------|-----------------|---------------------------------------------------------------------|
  | Verifiability        | **★ YES**       | Untestable claims aren’t science.                                  |
  | Non-Vacuity          | **★ YES**       | Prevents circularity ("it’s disposed because of its structure").   |
  | Attribution          | **★ YES**       | Stops misassignment (e.g., water vs. bots).                        |
  | Manifestation-Indep. | Likely          | Needed for counterfactual validity (vase).                         |
  | Counterfactual Rob.  | Contextual      | Required for hypotheticals (solvent), not for observed events.     |
  | Probabilistic Integ. | Contextual      | Essential for QM (glowing rock), irrelevant for deterministic cases. |

  ---

  Verdict: Verifiability anchors science.
