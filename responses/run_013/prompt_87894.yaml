  The procedure is only for evaluating the use of a heritability figure in the proposal.

  Now, write the procedure in a step-by-step form.

  Procedure for Evaluating a Heritability Citation in a Proposal

  Step 1: Identify the heritability figure and its source.
     - Required: Note the number, the source (e.g., twin study, GWAS), the population, and the environmental range (if provided).
     - If missing, note: "Population or environmental range not specified; interpret with caution."

  Step 2: What is the proposal using the heritability figure to do? (Choose one or more)
     - A. Explain individual differences in a trait within a population.
     - B. Explain differences between two populations (e.g., racial groups).
     - C. Predict the effect of an environmental change (intervention) on the trait.
     - D. Predict which individuals will respond to an environmental change.

  Step 3: Check the relevance of the heritability estimate to the purpose.
     - If B: Heritability within a population does not explain between-group differences. Stop with verdict: "Irrelevant to this decision".
     - If D: Heritability of a trait does not inform about the heritability of the response to an intervention (which is a different trait). Stop with verdict: "Irrelevant to this decision". (Exception: if the study is about the heritability of the treatment response, then proceed. But this is rare.)
     - If C: 
          a. If the proposed environmental change is outside the range of environments in the heritability study, then stop: "Not assessable on the available evidence".
          b. Else, proceed to Step 4.
     - If A: Proceed to Step 4.

  Step 4: Assess the heritability estimate for purposes A or C (within the environmental range).
     - Note the type of study (twin or DNA-based). 
     - Twin studies: remember they assume equal environments for twins and might overestimate heritability.
     - DNA-based (e.g., SNP heritability): typically lower than twin estimates and avoid twin assumptions.
     - Without adjudicating between methods, note that the estimate is specific to the population and environment.

  Step 5: Separate "heritable" from "unchangeable".
     - High heritability does not mean the trait is unchangeable. It means that in the current environment, genetic differences account for a large portion of the variation. Environmental changes can alter the trait mean or variation.

  Step 6: Assign a verdict.
     - If the proposal uses the heritability figure to claim that the trait is unchangeable (for C) or that an environmental intervention is futile, then the heritability estimate does not support that. Verdict: "Relevant and cutting against the proposal".
     - If the proposal uses the heritability figure for A or C appropriately (e.g., to note that genetic factors are important) but then draws a conclusion that requires additional evidence (e.g., that a specific intervention is needed), then verdict: "Relevant but insufficient".
     - If the proposal uses the heritability figure appropriately and the conclusion follows directly (e.g., for A: to explain individual differences, and the proposal is about understanding variation, not intervention), then it might be "Relevant and supporting it". But note: in education, proposals often involve interventions, so this is rare.
     - If the environmental change proposed in C is within the range and the proposal uses the heritability figure appropriately (e.g., to note that the trait is heritable but we are changing the environment), then it might be "Relevant but insufficient" because the heritability alone doesn't predict the effect size of the intervention.
     - If the proposal does not misuse the heritability figure but it's not clear how it supports the proposal, then "Relevant but insufficient".

  But we must map to the fixed verdicts. We'll refine step 6:

  Step 6: Verdict
     - If the heritability figure is used for B or D: "Irrelevant to this decision".
     - If for C and the environment is outside the range: "Not assessable on the available evidence".
     - Otherwise (A or C within range):
          - If the proposal claims that the trait is unchangeable or that an environmental intervention is futile because of high heritability: "Relevant and cutting against the proposal".
          - If the proposal uses the heritability figure to support a claim that requires evidence beyond heritability (e.g., the effectiveness of a specific intervention): "Relevant but insufficient".
          - If the proposal uses the heritability figure appropriately and it directly supports the claim (e.g., the proposal is about understanding the causes of variation and the heritability estimate is used for that), then "Relevant and supporting it". But note: this is rare in the context of interventions.

  However, for an intervention proposal, the heritability figure is almost never sufficient. So we might default to "Relevant but insufficient" unless the proposal misuses it (then "cutting against").

  Now, re-run the cases with the structured procedure.

  Case 1: Vendor for intensive reading program.
     - Step 1: 0.7, twin study, population: children in typical schools.
     - Step 2: Purpose C (and maybe A). They argue that because reading difficulty is heritable, it's intrinsic and requires an intensive program.
     - Step 3: Purpose C: environmental change (one-to-one) is within the range? We'll assume yes. Proceed.
     - Step 4: Twin study, heritability 0.7. Note potential overestimation and population specificity.
     - Step 5: Heritable does not mean unchangeable.
     - Step 6: The proposal claims that because it's heritable, it's intrinsic (unchangeable?) and requires an intensive program. This is a misuse: high heritability does not imply unchangeable. Therefore, verdict: "Relevant and cutting against the proposal".

  Case 2: Board member against resilience curriculum.
     - Step 1: Heritability of grit (say 0.5), twin study, typical population.
     - Step 2: Purpose C: predict that teaching grit is futile.
     - Step 3: C: within range? yes.
     - Step 4: Twin study, 0.5.
     - Step 5: Heritable does not mean unchangeable.
     - Step 6: The proposal claims that because grit is heritable, teaching it is futile. This is a direct misuse. Verdict: "Relevant and cutting against the proposal".

  Case 3: Targeted reading intervention.
     - Step 1: The heritability of a characteristic (say, a genetic profile) is cited. Assume it's high and from a GWAS. Population: children.
     - Step 2: Purpose D: predict which individuals will respond (by using the heritable characteristic).
     - Step 3: D: heritability of the characteristic does not inform about the treatment response. Verdict: "Irrelevant to this decision".

  The memo for case 3 would say: the heritability figure is irrelevant to the decision of targeting. The moderation evidence (that the characteristic predicts response) stands on its own and should be evaluated separately.

  Overclaiming risk: In case 1 and 2, we are saying the heritability figure cuts against the proposal, but we are not saying the intervention is good or bad. We are only evaluating the use of the heritability figure.

  Where the procedure misfires:

  - If a heritability estimate is low, and the proposal uses that to argue that the trait is malleable, that might be correct. But the procedure doesn't cover that because we focused on high heritability being misused. But step 6 could be extended: if the proposal claims that because heritability is low, the trait is easily changeable, that might be an overstatement because a low heritability might mean the environment is already very influential and changing it further might be hard. But the procedure doesn't have a step for that. We might need to adjust step 6.

  Revised step 6 to cover more cases:

  Step 6: 
     - If the proposal claims that a high heritability (say >0.5) means the trait is unchangeable or that an environmental intervention will be ineffective, then: "Relevant and cutting against the proposal".
     - If the proposal claims that a low heritability (say <0.3) means the trait is easily changeable, then that might be an overstatement. We would say: "Relevant but insufficient" (because low heritability doesn't guarantee that a specific intervention will work) or "Relevant and cutting against the proposal" if they claim it's easily changeable? Actually, low heritability suggests that the environment matters, so it might support the idea that interventions can work. But it doesn't guarantee that a particular intervention will work. So we'd say "Relevant but insufficient" for a specific intervention.

  But the fixed verdicts don't include "Relevant and supporting it" for low heritability? We could have:

     - If the proposal uses a low heritability to support that environmental interventions can be effective (without claiming they are easy), then that might be appropriate. But we don't have a verdict for that. We might say "Relevant and supporting it" if the proposal is only making the general point that environment matters. But in the context of a specific intervention, it's insufficient.

  To keep it simple, we'll stick to:

     - If the proposal misuses heritability (by equating high heritability with unchangeability or low heritability with easy change) in a way that the heritability estimate contradicts, then "Relevant and cutting against the proposal".
     - Otherwise, if the heritability estimate is relevant, then "Relevant but insufficient" because the estimate alone is not enough to justify an intervention.

  This covers the common misuses.

  Finally, the procedure cannot:
     - Replace a cost-benefit analysis.
     - Evaluate the evidence for the intervention itself.
     - Account for all the nuances of gene-environment interplay.
