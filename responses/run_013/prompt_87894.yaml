  ### Decision Procedure for Evaluating Heritability Citations in Proposals

  **Purpose**: This procedure assesses whether a cited heritability figure is relevant to a proposal's conclusion and whether it is used correctly. It focuses on four common misapplications of heritability and outputs one of five verdicts:  
  1. **Irrelevant to this decision**  
  2. **Relevant but insufficient**  
  3. **Relevant and cutting against the proposal**  
  4. **Relevant and supporting it**  
  5. **Not assessable on the available evidence**  

  **Key Definitions**:  
  - **Heritability**: A population statistic (ranging from 0 to 1) estimating the proportion of variation in a trait (e.g., reading skill) due to genetic differences in a specific population and environment.  
  - **Critical Distinction**: "Heritable" ≠ "Unchangeable." High heritability means genetics explains much of the variation in a trait *in a given environment*, but changing the environment (e.g., through interventions) can alter the trait for everyone.  

  ---

  #### Step-by-Step Procedure  
  *(Complete all steps in order; stop at the first verdict trigger.)*  

  **Step 1: What is the cited heritability figure and its source?**  
  - *Sufficient answer*: State the number (e.g., 0.7), source (e.g., "twin study in U.S. children"), and trait (e.g., "reading difficulty").  
  - *If missing/incomplete*: Note gaps and proceed, but flag uncertainty.  
  - *Next step*: Always proceed to Step 2.  

  **Step 2: What is the proposal using heritability to do?**  
  Identify which of the four goals the proposal claims heritability supports:  
  - **A. Explain individual differences** (e.g., "Why do students in the same school vary in reading skill?").  
  - **B. Explain group differences** (e.g., "Why do Group X and Group Y differ in grit?").  
  - **C. Predict trait changes under environmental intervention** (e.g., "Will this program reduce reading difficulties?").  
  - **D. Predict individual responses to intervention** (e.g., "Which students will benefit most from this program?").  
  - *Sufficient answer*: Select A, B, C, or D. If multiple, list all.  
  - *Next step*: Proceed to Step 3.  

  **Step 3: Is heritability relevant to the proposal’s goal?**  
  - **If goal is B (explain group differences)**:  
    - Heritability *within* a group cannot explain differences *between* groups (e.g., between racial or socioeconomic groups). Group differences may stem from environmental factors.  
    - *Verdict*: **Irrelevant to this decision**. Stop here.  
  - **If goal is D (predict individual responses)**:  
    - Heritability of a trait ≠ heritability of *response to intervention*. A heritable trait (e.g., IQ) does not predict who will respond to an intervention (e.g., a tutoring program).  
    - *Verdict*: **Irrelevant to this decision**. Stop here.  
  - **If goal is A (explain individual differences)**:  
    - Heritability estimates are designed for this purpose. Proceed to Step 4.  
  - **If goal is C (predict changes under intervention)**:  
    - Proceed to Step 4.  

  **Step 4: What population/environment was the estimate drawn from?**  
  - *Sufficient answer*: Describe the population (e.g., "twins in Sweden") and environmental range (e.g., "typical public schools in 1990–2010").  
  - **If environmental range is narrow** (e.g., all subjects had similar socioeconomic status, education, or resources):  
    - The estimate may not apply to interventions that widen the environment (e.g., introducing a new curriculum).  
    - *Verdict*: **Not assessable on the available evidence**. Stop here.  
  - **If environmental range is broad/representative** (or not specified):  
    - Proceed to Step 5.  

  **Step 5: Does the proposal equate "heritable" with "unchangeable"?**  
  - *Sufficient answer*: Check if the proposal uses heritability to imply a trait is fixed (e.g., "genetic, so cannot be changed").  
    - **If yes**: This is incorrect. High heritability does not mean interventions cannot work (e.g., height is highly heritable but increased with better nutrition).  
    - *Verdict*: **Relevant and cutting against the proposal**. Stop here.  
  - **If no**: Proceed to Step 6.  

  **Step 6: Final Assessment**  
  - **If goal is A (explain individual differences)**:  
    - Heritability is relevant but rarely justifies interventions alone.  
    - *Verdict*: **Relevant but insufficient**. Stop here.  
  - **If goal is C (predict changes under intervention)**:  
    - Heritability may indicate environmental sensitivity, but cannot predict intervention effects. High heritability suggests genetics explains variation *in current conditions*, but interventions can alter the environment.  
    - *Verdict*: **Relevant but insufficient**. Stop here.  

  **Verdict Key**:  
  - **Irrelevant**: Misapplied to group differences (B) or individual responses (D).  
  - **Not assessable**: Estimate from a narrow environment used for broad interventions.  
  - **Cutting against**: Equates heritable with unchangeable.  
  - **Insufficient**: Relevant to individual differences (A) or intervention predictions (C) but requires additional evidence.  
  - **Supporting it**: Rarely applicable (e.g., heritability used only to describe variation, not to drive action).  

  ---

  ### Application to Your Cases  

  **Case 1: Vendor’s Intensive Reading Program**  
  - **Proposal**: "Heritability of reading difficulty is 0.7 (from a twin study), so difficulty is intrinsic and requires intensive 1:1 intervention."  
  - **Procedure Analysis**:  
    1. **Step 1**: 0.7, twin study (population likely similar to your district).  
    2. **Step 2**: Goal C (predict intervention impact) and implies "unchangeable."  
    3. **Step 3**: Goal C → proceed.  
    4. **Step 4**: Twin studies typically draw from broad environments → proceed.  
    5. **Step 5**: Proposal claims "intrinsic" (i.e., unchangeable) → **Relevant and cutting against the proposal**.  
  - **Why?** Step 5 triggered: Heritability does not imply unchangeability. A 0.7 heritability means genetics explains 70% of variation *under current conditions*, but interventions (even non-intensive ones) could help all students.  
  - **Overclaiming Risk**: Assuming heritability = unchangeability ignores environmental plasticity. The vendor’s argument is invalid.  

  **Case 2: Board Member Against Resilience Curriculum**  
  - **Proposal**: "Grit is heritable (twin study), so teaching it is futile."  
  - **Procedure Analysis**:  
    1. **Step 1**: Heritability cited (e.g., 0.5), twin study.  
    2. **Step 2**: Goal C (predict intervention futility).  
    3. **Step 3**: Goal C → proceed.  
    4. **Step 4**: Twin study environment broad → proceed.  
    5. **Step 5**: Equates heritable with unchangeable ("futile") → **Relevant and cutting against the proposal**.  
  - **Why?** Step 5 triggered: Heritability does not justify futility claims. A 0.5 heritability means environment explains 50% of variation, so interventions could work.  
  - **Overclaiming Risk**: None. The verdict directly counters the misuse.  

  **Case 3: Targeted Reading Intervention Based on Response Profile**  
  - **Proposal**: Reserve intervention for children with a heritable response profile, citing evidence that effect size varies with a heritable trait.  
  - **Procedure Analysis**:  
    1. **Step 1**: Heritable trait cited (e.g., genetic marker for attention).  
    2. **Step 2**: Goal D (predict individual responses).  
    3. **Step 3**: Goal D → **Irrelevant to this decision**.  
  - **Why?** Step 3 triggered: Heritability of a trait (e.g., attention) does not predict *response to intervention*. The proposal should rely on direct evidence of differential response (e.g., "children with profile X improved more in trials"), not heritability.  
  - **Overclaiming Risk**: The proposal conflates a heritable trait with a fixed response pattern. Heritability of attention ≠ heritability of *response to reading intervention*. The verdict is "irrelevant" because heritability adds no predictive value beyond the response profile evidence.  

  ---

  ### Limitations of the Procedure  
  **Where It Misfires**:  
  1. **Gene-Environment Interactions**: If a heritable trait (e.g., stress sensitivity) interacts with the intervention in unmeasured ways, the procedure won’t catch it. Example: A well-designed study showing gene-intervention interactions could support Case 3, but the procedure dismisses heritability as irrelevant.  
  2. **High Heritability in Optimized Environments**: In populations with high environmental equality (e.g., universal healthcare), high heritability may indicate limited room for intervention gains. The procedure treats this as "not assessable" (Step 4) but may miss valid inferences.  
  3. **DNA vs. Twin Estimates**: Twin studies often overestimate heritability due to equal-environments assumption. The procedure flags this (Step 4) but doesn’t quantify bias, so a DNA-based estimate could overturn a verdict.  

  **What It Cannot Do**:  
  - **Evaluate Intervention Efficacy**: Heritability is unrelated to whether an intervention works. Always demand direct evidence (e.g., RCTs).  
  - **Address Values-Based Questions**: E.g., "Should we prioritize genetic subgroups?" requires ethical debate, not heritability.  
  - **Replace Contextual Knowledge**: Local factors (e.g., district resources) outweigh heritability.  

  **Final Advice**: Use this procedure to neutrally flag misuse of heritability, but pair it with standard evaluation (cost, feasibility, equity). Your instinct—that heritability is often a red herring—is usually correct, but this keeps you honest when exceptions arise.
