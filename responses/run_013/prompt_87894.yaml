prompt: |-
  I am the research and evaluation analyst for a mid-sized urban school district — the only person on staff who reads the studies behind the proposals that reach the deputy superintendent. I have one graduate statistics course behind me, no access to paywalled journals, and no time: three or four times a month, a vendor pitch, a board member's public comment, a grant application, or a parent letter cites a heritability figure for a cognitive or behavioral trait and draws a conclusion about what the district should do. My working instinct, after two years of this, is that every such citation is a red herring. I would like a procedure that keeps me honest, including in the cases where that instinct is wrong.

  Write me a decision procedure I can run on a single proposal in under two hours, producing a two-page memo, using only the documents in front of me and arithmetic no harder than a ratio. It should be usable by someone who knows the phrase "heritability is a population statistic" and not much more, and it has to survive scrutiny from a board member who does know more. Do not send me to the literature; I cannot get it, and a reading list is useless to me.

  The procedure should take the form of ordered questions, each with a statement of what counts as a sufficient answer, where the procedure stops with a verdict, and where it must hand the decision back to a person because the remaining question is one of values rather than facts. It must, at minimum, force me to distinguish four different things a heritability number might be asked to do — explain why individuals within a population differ, explain why two populations differ, predict what happens if we change the environment, and predict which individuals will respond to a change — and then to identify which of the four the proposal actually needs and whether the estimate on offer could possibly support it. It must require me to state the population and the range of environments the estimate came from, and to treat an estimate drawn from a narrow environmental range as uninformative about any intervention that widens that range. It must handle the equal-environments assumption and the gap between twin-based and DNA-based estimates without requiring me to adjudicate either. It must keep "heritable" and "unchangeable" apart in a way I can say out loud in a memo without delivering a lecture. And it should end in one of a fixed set of verdicts: irrelevant to this decision; relevant but insufficient; relevant and cutting against the proposal; relevant and supporting it; or not assessable on the available evidence.

  Then run it on three matters I am currently sitting on. First, a vendor proposing an intensive one-to-one decoding program for struggling readers, on the argument that a twin study puts the heritability of reading difficulty near 0.7, so the difficulty is intrinsic and only an intensive program can reach it. Second, a board member arguing against funding a resilience curriculum because grit is substantially heritable and teaching it is therefore futile. Third, a proposal to reserve a new reading intervention for children with a particular response profile, supported by evidence that the size of the intervention's effect varies across children in ways that track a heritable characteristic. For each, say what the procedure yields, which step is doing the work, and where I am at risk of overclaiming. The third case should come out in a way I will not like; do not soften it to spare my instinct.

  Finally, tell me where the procedure will misfire — the situations in which a well-designed study would overturn its verdict and nothing in the memo would let me see that coming — and what it cannot do at all.
reasoning: |-
  We are creating a decision procedure for evaluating proposals that cite heritability figures. The procedure must be usable by someone with basic knowledge and limited time, and must output one of several verdicts. The steps should force the analyst to consider key distinctions and end with a clear conclusion.

  Key distinctions to cover:
  1. Explaining individual differences within a population.
  2. Explaining differences between populations.
  3. Predicting the effect of changing the environment.
  4. Predicting individual responses to an environmental change.

  The procedure must also:
  - State the population and environmental range of the heritability estimate.
  - Treat an estimate from a narrow environmental range as uninformative for interventions that widen that range.
  - Handle the equal-environments assumption and the gap between twin-based and DNA-based estimates without requiring adjudication.
  - Separate "heritable" from "unchangeable".

  Verdicts:
  - Irrelevant to this decision
  - Relevant but insufficient
  - Relevant and cutting against the proposal
  - Relevant and supporting it
  - Not assessable on the available evidence

  Procedure:

  Step 1: Identify the heritability figure and its source.
     - What is the cited heritability number? What is the source (twin study, GWAS, etc.)?
     - What population and what range of environments does the study cover? (e.g., children in the US in the 2000s, with typical school environments)
     - If the population and environment are not specified, note that and proceed with caution.

  Step 2: Clarify what the proposal uses the heritability figure to do.
     - Choose one of the four:
          A. Explain why individuals within a population differ.
          B. Explain why two populations differ.
          C. Predict what happens if we change the environment.
          D. Predict which individuals will respond to a change.
     - If the proposal uses it for more than one, note all.

  Step 3: Check if the heritability estimate is relevant to the intended use.
     - For A (explaining individual differences): Heritability estimates are designed for this. Proceed to step 4.
     - For B (explaining group differences): Heritability within groups does not explain between-group differences. Stop: verdict "Irrelevant to this decision" (unless the proposal also addresses the environmental differences between groups, but typically it doesn't).
     - For C (predicting effect of environment change): A high heritability does not mean the trait is unchangeable. In fact, if the environment changes, the heritability estimate from old environments may not hold. If the intervention changes the environment in a way that is outside the range of the study, then the estimate is not informative. Stop: if the environmental change is outside the study range, verdict "Not assessable on the available evidence". Otherwise, proceed to step 4 with caution (but note step 5).
     - For D (predicting individual responses): Heritability of a trait does not directly inform about the heritability of the response to an intervention (which is a different trait). Stop: verdict "Irrelevant to this decision" unless the study is about the heritability of the treatment response (which is rare). 

  Step 4: Assess the quality of the heritability estimate for the purpose of explaining individual differences (if we got here from A or C).
     - Note the type of study: twin study or DNA-based (e.g., SNP heritability).
     - Twin studies: They rely on the equal-environments assumption (EEA) and may overestimate heritability if EEA is violated. DNA-based estimates are typically lower and avoid EEA issues.
     - Without adjudicating, note: if the estimate is from a twin study and the heritability is high (say >0.5) and the proposal is using it to claim the trait is "intrinsic" or "unchangeable", then we must challenge that leap.
     - Also note: heritability is population-specific and time-specific.

  Step 5: Separate "heritable" from "unchangeable".
     - High heritability does not mean unchangeable. It means that in the current environment, genetic differences account for a large portion of the variation. But if you change the environment, the trait might change for everyone, or the variation might change.
     - Example: height is highly heritable but has increased over time due to environmental changes (nutrition).

  Step 6: Final verdict.
     - If the heritability figure is used for B (group differences) or D (individual responses) and we stopped at step 3: the verdict is "Irrelevant to this decision".
     - If the heritability figure is used for C (environment change) and the intervention environment is outside the study range: "Not assessable on the available evidence".
     - If the heritability figure is used for A (individual differences) or C (environment change) and the environment is within range, then:
          - If the proposal claims that a high heritability means the trait is unchangeable, then the heritability figure is being misused. Verdict: "Relevant but insufficient" (because it doesn't support the unchangeable claim) or "Relevant and cutting against the proposal" if the proposal is using it to argue against change.
          - If the proposal uses a high heritability to argue for an intensive intervention (because the trait is "intrinsic"), then we must note that high heritability does not imply that the environment is ineffective. In fact, a high heritability might mean that the current environment is already optimized and that only a very strong intervention (or one that targets the genetic differences) would work. But without evidence for the intervention, we cannot conclude that the intervention will work. So we might have "Relevant but insufficient" or "Not assessable" for the intervention claim.
     - However, if the proposal uses a high heritability to argue that the trait is unchangeable and therefore we shouldn't try to change it, then the heritability figure does not support that. Verdict: "Relevant and cutting against the proposal" (because the claim of unchangeability is false) or "Relevant but insufficient" (if the argument is that the trait is hard to change, but note that heritability doesn't directly measure that).

  But we need to be more structured. Let's define the verdicts based on the steps.

  Revised Step 6: Based on the above, assign one of the verdicts:

  - "Irrelevant to this decision": if the heritability estimate is being used for a purpose it doesn't address (B or D, as per step 3).
  - "Not assessable on the available evidence": if the heritability estimate is from a population/environment that is not relevant to the current one, or if the environmental change proposed is outside the range of the study (for C).
  - "Relevant but insufficient": if the heritability estimate is relevant (for A or C) but the proposal makes a leap that the estimate doesn't support (e.g., from heritable to unchangeable, or to a specific intervention).
  - "Relevant and cutting against the proposal": if the heritability estimate, when correctly interpreted, contradicts the proposal's claim (e.g., if the proposal claims that high heritability means unchangeable and we know that is false, then the heritability estimate actually cuts against the claim of unchangeability).
  - "Relevant and supporting it": if the heritability estimate is used appropriately and supports the proposal. (But note: it's hard to imagine a case where a heritability estimate alone would support an intervention without additional evidence.)

  However, note that a high heritability might be used to support the idea that a trait is largely genetic and therefore might respond to a genetic-based intervention (like medication for a disorder) but that is not common in education. And even then, it's indirect.

  In education, it is rare that a heritability estimate alone would support an intervention. So we must be cautious.

  Now, let's run the three cases.

  Case 1: Vendor proposing an intensive one-to-one decoding program for struggling readers, on the argument that a twin study puts the heritability of reading difficulty near 0.7, so the difficulty is intrinsic and only an intensive program can reach it.

  Step 1: Heritability = 0.7, from a twin study. Population: likely children in a developed country, with typical schooling.

  Step 2: The proposal uses the heritability figure to do two things:
     - Implicitly, to explain individual differences (A) and to argue that the difficulty is intrinsic (which might be a claim about unchangeability, so related to C?).
     - But the main claim: because it's heritable, it's intrinsic and therefore requires an intensive program.

  Step 3: 
     - For A: yes, heritability estimates are for individual differences. Proceed.
     - The proposal also uses it to predict that only an intensive program can reach it (so for C: changing the environment). We need to check the environmental range. The twin study environment is typical schooling. The intervention (one-to-one) is a change, but is it outside the range? Probably not, because one-to-one tutoring has been studied in many contexts. So we proceed.

  Step 4: Twin study with heritability 0.7. We note that twin studies might overestimate heritability. But we don't adjudicate. We also note that heritability of 0.7 means that in the current environment, 70% of the variation in reading difficulty is due to genetic variation. It does not mean that the environment is ineffective.

  Step 5: Separating heritable from unchangeable: High heritability does not mean unchangeable. In fact, a high heritability might mean that the current environment is already doing a good job for most children, and that the remaining variation is due to genetics. But that doesn't mean that a change in environment (like one-to-one) won't help. In fact, it might help a lot, especially for those who are struggling.

  Step 6: The vendor argues that because reading difficulty is heritable, it is intrinsic and therefore only an intensive program can help. But:
     - The heritability estimate does not imply that the trait is unchangeable. 
     - In fact, the high heritability might be because the current environment is uniform and good, so that genetic differences are the main reason for variation. But if we change the environment (one-to-one), we might reduce the variation or shift the mean.
     - Therefore, the heritability estimate does not support the claim that only an intensive program can help. It might be that a less intensive program could help if applied appropriately.

  Verdict: The heritability estimate is relevant (because it's about individual differences and the effect of environment change within the range) but the argument that the trait is "intrinsic" and therefore requires an intensive program is not supported by the heritability figure. We assign: "Relevant but insufficient" (because the heritability figure does not, by itself, tell us what kind of intervention is needed).

  But note: the vendor is using the heritability to argue for the intervention. Since the heritability figure does not support the claim that the intervention is necessary (and might even be misinterpreted to suggest that environmental interventions are less effective, which is not true), we might say "Relevant and cutting against the proposal" because the heritability figure actually contradicts the claim that the trait is unchangeable. However, the vendor is using it to argue for an intensive program, which might be effective. The problem is the reasoning, not necessarily the intervention.

  We have to be careful: the verdict is about the use of the heritability figure. The heritability figure does not support the claim that the reading difficulty is "intrinsic" in the sense of unchangeable, and therefore the argument that only an intensive program can help because it's intrinsic is flawed. So the heritability figure, when correctly interpreted, cuts against the vendor's reasoning. But the intervention might still be a good idea for other reasons. So:

  Verdict: "Relevant and cutting against the proposal" because the heritability estimate does not support the claim that reading difficulty is unchangeable and therefore requires an intensive program. In fact, the heritability estimate is consistent with the possibility that environmental interventions (including less intensive ones) might be effective.

  But note: the vendor might be right that an intensive program is needed, but the heritability figure doesn't tell us that. So we are saying the heritability figure does not support the proposal.

  Case 2: A board member arguing against funding a resilience curriculum because grit is substantially heritable and teaching it is therefore futile.

  Step 1: Heritability of grit is substantial (say, 0.5 from a twin study). Population: likely similar to the above.

  Step 2: The board member uses the heritability figure to argue that grit is heritable and therefore teaching it (changing the environment) is futile. So this is for C (predicting what happens if we change the environment) and also implying that because it's heritable, it's unchangeable.

  Step 3: For C: we must check the environmental range. The twin study environment is the current one. The intervention (resilience curriculum) is a change. Is it outside the range? Probably not, because resilience curricula are being tested in similar populations. So we proceed.

  Step 4: Twin study, heritability 0.5. Note that this is a moderate heritability, meaning both genes and environment contribute.

  Step 5: High heritability does not mean unchangeable. Even if heritability is 0.5, that means 50% of the variation is due to environment, so environmental changes could have a big impact.

  Step 6: The board member claims that because grit is heritable, teaching it is futile. This is a direct misinterpretation. The heritability estimate does not imply that the trait is unchangeable. In fact, a heritability of 0.5 suggests that the environment matters a lot. Therefore, the heritability estimate actually cuts against the board member's claim.

  Verdict: "Relevant and cutting against the proposal" because the heritability figure, when correctly interpreted, contradicts the claim that teaching grit is futile.

  Case 3: A proposal to reserve a new reading intervention for children with a particular response profile, supported by evidence that the size of the intervention's effect varies across children in ways that track a heritable characteristic.

