prompt: |-
  so next thursday i have to present at our decision theory reading group and im dreading the q&a. what im defending is a version of evidential cooperation in large worlds, and i want you to build me a prep sheet for the objections im actually going to get.

  here's my thesis in my own words so you know what to attack. normally when i decide whether to do something costly that helps someone i'll never meet -- pay into a fund that only helps strangers on the far side of the planet, or even cooperate in a one-shot prisoners dilemma against a person i'll never interact with again and who'll never learn what i did -- the standard move is to ask: does my action change anything for anyone? if the answer is no, don't do it. i think thats too quick. my choosing to cooperate is also evidence about what other agents who are relevantly like me are choosing. if im the kind of reasoner who defects, then the other runs of that same reasoning process -- in other countries, in situations i'll never see -- tend to defect too; if i cooperate, they tend to cooperate. in a large world there are alot of such agents, and a good number of them sit in positions where their cooperating happens to benefit me, so the indirect payoff from my own cooperating can dwarf the direct cost. so sometimes i should cooperate even when i have zero causal influence on anyone. and i think the scope is bigger than people expect: it should change what i do about distant charities, about voting, about defecting in anonymous one-shot games, the whole lot. thats the claim.

  now the room. its a mixed crowd and i know exactly who's coming after me: the bulk are causal decision theorists and game theorists who think anything evidential is a confusion between correlation and causation, and they'll be the loudest. there are two economists who basically live in nash equilibrium and mechanism design and will keep asking what game this even is and who the players are. one person is deep into team reasoning and we-reasoning and will insist i've just reinvented that with extra steps. and there's one kantian philosopher who's going to say its universalizability dressed up in probability. nobody in the room works on acausal stuff, so i cant lean on jargon and i cant cite anything -- assume they'll interrupt the moment i wave at a paper.

  what i want back: the objections in the order i'll actually hear them, ranked by how likely and how damaging, each one phrased the way that particular person would put it in their own vocabulary, a short reply for each that i could deliver in about two minutes, and a note on where my reply is weakest so i dont get caught flat. and tell me the one question im praying nobody asks. write it in american english please.
reasoning: |-
  Okay, the user is preparing for a Q&A session next Thursday on their thesis about evidential cooperation in large worlds. They're dreading objections from a specific audience: causal decision theorists, game theorists, economists, a team-reasoning advocate, and a Kantian philosopher. They need a prep sheet that anticipates each objection, provides concise replies, and highlights weak spots.

  First, I need to understand their thesis clearly. They're arguing that even in situations with no causal influence (like one-shot prisoner's dilemmas or donating to distant charities), cooperating is beneficial because it's evidence that similar agents in similar situations will also cooperate. This evidence-based effect can outweigh the direct costs when aggregated across a large world. It's an evidential approach, contrasting with causal decision theory.

  The audience breakdown is crucial. Causal decision theorists will likely attack the core premise, calling it magical thinking. Game theorists will question the game structure and player definitions. The economists will focus on equilibrium concepts. The team-reasoning person will see parallels to their field. The Kantian will tie it to universalizability. The user mentioned no one works on acausal stuff, so jargon must be avoided.

  For each objection, I should:
  1. Identify the speaker's style and likely phrasing.
  2. Rank by likelihood and damage (high likelihood/high damage first).
  3. Draft a 2-minute reply that's accessible.
  4. Flag weaknesses in the reply.

  Top objection will be from causal decision theorists: "This is correlation/causation confusion!" Reply: Frame it as rational updating on your own decision algorithm. Weakness: Still looks like spooky action at a distance to them.

  Game theorists will ask "What game is this?" Reply: Clarify it's a large population with correlated algorithms, not a defined game. Weakness: They'll demand formalization.

  Economists will ask about Nash equilibrium. Reply: Explain it's about pre-commitment to strategies via algorithm design. Weakness: Feels like moving goalposts.

  Team-reasoning advocate will say it's reinventing their framework. Reply: Acknowledge overlap but stress individual reasoning without group identity. Weakness: May seem like a distinction without difference.

  Kantian will call it universalizability. Reply: Agree but note probabilistic aggregation of benefits. Weakness: Might concede too much ground.

  The nightmare question: "How does this not justify cooperating with Hitler?" Attacks the core similarity metric. Reply must distinguish between similarity of decision algorithms vs. outcomes, but this is the weakest point.

  Key prep advice: Don't say "acausal," avoid jargon, emphasize that algorithms must be sufficiently similar, and pivot to empirical calibration where possible. User should practice phrasing like "updating on my own decision-process" instead of "evidence."

  User's anxiety suggests they need confidence in their counterarguments. Highlighting weaknesses helps them prepare defensively. The nightmare question warning is critical—they must rehearse that answer.
answer: |-
  Here’s your prep sheet, structured by objection severity (likelihood + damage), phrased in each critic’s voice, with tight replies and exposed weaknesses. I’ve kept replies under 2 minutes and flagged where you’re vulnerable.

  ---

  ### **1. Objection: "This is classic correlation/causation confusion. Your action doesn’t *make* others cooperate—it’s just a sign you’re in a world where cooperation is common. But you can’t change that world by acting!"**  
  *(Causal Decision Theorist / Game Theorist — 90% chance, High Damage)*  
  **Your Reply:**  
  "Absolutely, my action doesn’t *cause* others to cooperate. But as a rational agent, I must use all available information to predict outcomes. If I defect, I learn I’m likely an agent in a 'defection-heavy' reference class—meaning many others defect too, including those who might affect me. By cooperating, I update toward a world where my reference class cooperates more often, and since even a tiny chance of benefiting from *their* actions outweighs my small cost in large populations, it’s rational self-interest. This isn’t causation—it’s Bayesian updating on the type of agent I am."  
  **Weakness:** They’ll argue you’re smuggling in "spooky" global correlations. If pressed, admit you assume agents share *sufficiently similar decision algorithms* (e.g., all rational altruists), but this needs empirical backing.

  ---

  ### **2. Objection: "What game are we even playing? Who are the players? This isn’t a defined game—there’s no Nash equilibrium or mechanism to enforce coordination."**  
  *(Economist / Game Theorist — 85% chance, High Damage)*  
  **Your Reply:**  
  "Fair point—this isn’t a finite game with fixed players. It’s a mass coordination problem among agents with *correlated decision rules* across time and space. Think of it as a 'meta-game' where your strategy isn’t 'cooperate/defect' but *'adopt a decision algorithm that cooperates in these contexts'*. The 'equilibrium' is the consistency of that algorithm across logical counterparts. If enough agents adopt this rule, we all benefit from mutual cooperation in overlapping interactions."  
  **Weakness:** They’ll demand formalization. Briefly gesture to precommitments (e.g., "Choosing to *be a cooperator* now affects expectations"), but concede it’s not traditional game theory.

  ---

  ### **3. Objection: "You’ve just reinvented team reasoning! You’re implicitly framing this as a ‘we’—acting as if we’re on a team optimizing collective outcomes."**  
  *(Team-Reasoning Advocate — 70% chance, Medium Damage)*  
  **Your Reply:**  
  "Team reasoning is a great lens, but my approach is more individualistic. I’m not assuming a shared group goal or identity. Instead, I’m saying: *Individually*, it’s rational to cooperate because your action reveals information about other *individuals* whose actions affect you. No ‘we’ needed—just rational agents updating on logical correlations between their own choices and others’. It’s individualism plus correlated reasoning, not group agency."  
  **Weakness:** They’ll say the "reference class" *is* a team. Stress it’s about *algorithmic similarity* (e.g., "agents using *this* decision process"), not shared identity.

  ---

  ### **4. Objection: "This is just utilitarianism with Kantian universalizability. You’re saying ‘Act only if everyone should act that way’—but with probabilities!"**  
  *(Kantian Philosopher — 60% chance, Medium Damage)*  
  **Your Reply:**  
  "Universalizability captures part of it, but Kant is categorical. My argument is *consequentialist* and *self-interested*. I cooperate because—statistically—it increases my personal expected payoff when aggregated over many unseen interactions. It’s not a duty; it’s a gamble that pays off because similar agents face similar choices. The ‘universal’ part is a byproduct of the correlation, not a moral axiom."  
  **Weakness:** They’ll argue you’re still relying on a "similarity principle" akin to Kant’s. Don’t fight this—agree it’s a *convergence* but emphasize the instrumental rationality.

  ---

  ### **5. Objection: "How do you define ‘relevantly like me’? What stops this from demanding cooperation with Nazis or idiots?"**  
  *(Causal Decision Theorist / Philosopher — 50% chance, High Damage if unanswered)*  
  **Your Reply:**  
  "Critical point. The reference class isn’t ‘all humans’—it’s agents using *similar decision algorithms in similar contexts*. If I’m deciding whether to donate to a proven charity, my reference class is ‘rational altruists evaluating charities’. Nazis or irrational agents aren’t in that class because their decision rules differ. We restrict the class to agents whose reasoning we *share*—those who respond to evidence and incentives like we do."  
  **Weakness:** Defining "similarity" is fuzzy. Offer examples (e.g., "voters in democracies," "one-shot lab participants") but admit boundaries need refinement.

  ---

  ### **The Nightmare Question You’re Praying Nobody Asks:**  
  **"If your argument works, shouldn’t I cooperate with *anyone* I deem ‘similar,’ including agents trying to exploit me? Doesn’t this force me into indefensible cooperation with predators?"**  
  *(Game Theorist / Economist — Low chance but Fatal)*  
  **Why It’s Deadly:** It attacks the core of your similarity metric and could make your position look naively exploitable.  
  **Your Best Reply:**  
  "No—because predators *aren’t* in your reference class. They use different decision rules (e.g., ‘always exploit’). Your cooperation only correlates with agents who *conditionally* cooperate. If you suspect an interaction is predatory, that breaks the similarity. This isn’t about blind trust; it’s about statistical alignment of *conditional strategies* among rational cooperators."  
  **Weakness:** If similarity is defined by "conditional cooperation," critics may argue this is circular. Prep a concrete example (e.g., "In anonymous online markets, sellers with high ratings are ‘similar’—cooperating correlates with mutual benefit").

  ---

  ### **Key Prep Tactics**  
  1. **Jargon Avoidance:** Never say "acausal." Say "logical correlation" or "updating on my own decision-process."  
  2. **Anchor in Self-Interest:** Hammer "This isn’t morality—it’s selfish rationality with extra computation."  
  3. **Concede Early:** "I agree this isn’t causal! But causality isn’t the only thing that matters for rational choice."  
  4. **Defuse Kant/Team Comparisons:** "Yes, it rhymes with these ideas, but the *mechanism* is different: Bayesian evidence, not duty or group identity."  
  5. **Weakness Mitigation:** When pressed on similarity, pivot to empirical cases (e.g., "Voting data shows clustered behavior among demographics—that’s a real-world reference class").  

  **Final Tip:** Start your talk with: "I know this sounds wild if you only think causally. But suspend that for 10 minutes—assume we *can* update on our own algorithm. Now, does this change your decisions?" Forces engagement on your terms. You’ve got this.
