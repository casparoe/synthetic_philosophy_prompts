  We are designing an exam question that presents three lamp scenarios (A, B, C) and four candidate diagnoses for the trouble in Lamp A (Thomson's original lamp). The candidate must use Lamps B and C to evaluate each diagnosis and then relate the findings to the possibility of supertasks, using an example of a bouncing ball that comes to rest.

  The question must be self-contained and printed on the exam paper. The material for the lamps is provided.

  We are to write:
  1. The exam question (with time allowance: 90 minutes, expected length: ~800 words).
  2. A model answer of about 800 words.
  3. A marking scheme with exactly five must-hit points, ordered from elementary to discriminating, with marks (totalling 20) and a note on common mistakes.

  The five must-hit points should be:

  1. (elementary) ... 
  2. ...
  3. ...
  4. ...
  5. (most discriminating) ...

  Reserve the highest marks for distinguishing between what the description determines and what a physical system can do.

  Let's design the question.

  Exam Question:

  ---
  **Question 1: Thomson's Lamp and Supertasks**

  *Time allowance: 90 minutes. Expected length: approximately 800 words.*

  Consider the following three lamp scenarios:

  - **Lamp A**: This is Thomson's original lamp. It starts in the "off" state at time t=0. The lamp has a two-state switch (on/off). The switch is toggled at times \( t_n = 1 - 2^{-n} \) for \( n = 1, 2, 3, \ldots \). Thus, infinitely many toggles are completed by time t=1.

  - **Lamp B**: This lamp runs on the same schedule of times \( t_n = 1 - 2^{-n} \) for \( n = 1, 2, 3, \ldots \). However, the switch is a dimmer. At time \( t_n \), the brightness is set to \( b_n = \frac{1}{2} + (-1)^n \cdot 2^{-(n+1)} \). Note that \( b_n \) is a continuous quantity between 0 (completely off) and 1 (fully on). Specifically, for odd n, \( b_n = \frac{1}{2} - 2^{-(n+1)} \), and for even n, \( b_n = \frac{1}{2} + 2^{-(n+1)} \).

  - **Lamp C**: This lamp is identical to Lamp A (same two-state switch, same starting state, same toggle times) with one additional clause: it is specified that the lamp is on at time t=1.

  Four candidate diagnoses for the trouble in Lamp A (i.e., the problem that we cannot determine the state at t=1) are:

  1. The trouble is the infinite number of actions (toggles) in a finite time.
  2. The trouble is that the lamp's state space has only two discrete values (on/off), so the process cannot converge to a well-defined state.
  3. The trouble is that the description is incomplete: it fixes the lamp's state at every time in the interval [0,1) but not at t=1.
  4. The trouble is a tacit assumption that the lamp's state function must be continuous at t=1, which the description does not license.

  **Your tasks:**

  (a) For each diagnosis (1-4), state what it predicts about Lamp B and Lamp C. Specifically, for each lamp, would the diagnosis imply that we can determine the state at t=1? And if so, what state? Then, evaluate whether the prediction is correct for that lamp.

  (b) Based on your analysis in (a), what do you conclude about the four diagnoses? Which, if any, are correct? Which are incorrect? Why?

  (c) What, if anything, does the case of Thomson's lamp (and your analysis) show about the thesis that supertasks (the completion of an infinite number of actions in a finite time) are impossible? In your answer, use as a control the example of an idealised ball that bounces with a coefficient of restitution less than 1 (so that each bounce is a fraction of the previous height) and bounces infinitely often within a finite time, coming to rest at the limit point.

  In your answer, you must explicitly engage with the deflationary reply (associated with Benacerraf) that the problem lies in the under-specification of the state at t=1, and with Thomson's own conclusion that the lamp shows the impossibility of supertasks.

  *Note: Base your answer solely on the material provided and the content of the course. Do not refer to any external sources.*

  ---

  Now, let's write a model answer (approx 800 words).

  **Model Answer**:

  Thomson's lamp (Lamp A) poses a paradox: after infinitely many toggles, what is the state of the lamp at t=1? The problem has generated debate about the possibility of supertasks. I consider four diagnoses of the trouble in Lamp A, using Lamps B and C to test them.

  **(a) Evaluation of the four diagnoses using Lamps B and C:**

  **Diagnosis 1: The trouble is the infinite number of toggles.**

  This diagnosis suggests that the mere fact of performing infinitely many actions in a finite time is problematic. If so, then Lamp B (with infinitely many adjustments of the dimmer) should also be problematic at t=1. However, in Lamp B, the brightness at the times \( t_n \) is given by \( b_n = \frac{1}{2} + (-1)^n \cdot 2^{-(n+1)} \). As n increases, the term \( 2^{-(n+1)} \) becomes negligible, and the sequence \( b_n \) converges to 1/2. Moreover, we can define the state at t=1 as the limit of the states at \( t_n \), which is 1/2. Hence, Lamp B has a well-defined state at t=1. Thus, the infinite number of actions alone is not the trouble. The prediction for Lamp B fails: the diagnosis predicts trouble, but there is none.

  For Lamp C, this diagnosis would also predict trouble because there are infinitely many toggles. However, Lamp C explicitly states that the lamp is on at t=1. So if we take the specification at face value, then the state at t=1 is defined (on). But note: the infinite toggles are still present. If the infinite toggles were the problem, then Lamp C should be inconsistent. However, there is no inconsistency because the additional clause overrides the sequence of toggles. The diagnosis is incorrect for Lamp C too.

  **Diagnosis 2: The trouble is the two-state discrete state space.**

  This diagnosis attributes the problem to the discrete on/off states. It predicts that Lamp B, with a continuous state space, should not have trouble. As above, Lamp B converges to 1/2 at t=1. So the prediction holds: Lamp B has a defined state.

  For Lamp C, the state space is still discrete (on/off). But Lamp C specifies the state at t=1 as on. Thus, the state is defined. So the diagnosis would predict that without an explicit specification, the discrete state space causes trouble (as in A), but with an explicit specification (as in C), the trouble is avoided. This fits: in A the state is not specified and we have a problem; in C it is specified and no problem. However, note that the state in C is specified arbitrarily and not by the sequence. The diagnosis is partially correct: the discrete state space does not by itself prevent a defined state (as in C) but does prevent convergence of the sequence (as in A). But the problem in A is under-specification, not the state space per se.

  **Diagnosis 3: The trouble is incomplete description (fixes state only on [0,1), not at t=1).**

  This diagnosis says that the description of Lamp A does not specify the state at t=1. Therefore, we cannot determine it. For Lamp A, this is true: the description does not say what happens at t=1.

  For Lamp B: the description does not explicitly specify the state at t=1. However, the sequence of brightness values converges to 1/2. If we take the limit as defining the state at t=1, then we might say the state is 1/2. But note: the description does not say that the state at t=1 must be the limit. Thus, the description is incomplete for Lamp B too. But we can complete it by specifying the state at t=1 as the limit. This is natural and avoids arbitrariness. So the diagnosis is correct for Lamp B: the description is incomplete, but we can complete it without contradiction.

  For Lamp C: the description explicitly states the lamp is on at t=1. Thus, the description is complete. There is no trouble. This fits the diagnosis: by completing the description, we avoid the problem.

  The diagnosis is correct for all three lamps: A is incomplete and hence problematic; B is incomplete but can be naturally completed; C is complete and unproblematic.

  **Diagnosis 4: The trouble is the tacit assumption of continuity.**

  This diagnosis says that we assume the state function must be continuous at t=1, but the description does not require that. For Lamp A: if we assume continuity, we get a contradiction because the state oscillates without settling. But the description does not require continuity. So the state at t=1 is arbitrary. The diagnosis then is that the trouble arises from an unwarranted assumption.

  For Lamp B: the state function at the points \( t_n \) converges to 1/2. If we assume continuity, then the state at t=1 must be 1/2. But without continuity, we could assign any value. However, the description does not require continuity. So the state at t=1 is not determined. But in contrast to Lamp A, there is a natural candidate (the limit). The diagnosis would say that without the continuity assumption, Lamp B is under-specified too. This matches: the description does not specify the state at t=1.

  For Lamp C: the state at t=1 is explicitly given as on. This breaks any continuity assumption (since the sequence of states in [0,1) does not converge to a single state). But the description does not require continuity. So the explicit assignment is acceptable. The diagnosis is consistent.

  However, the diagnosis does not explain why Lamp B is less problematic than A: in B we have a natural limit, but in A we do not. The problem in A is not just the lack of continuity but the lack of convergence in the state values.

  **(b) Conclusions about the diagnoses:**

  Diagnosis 1 is incorrect: the infinite number of actions is not the problem, as Lamp B shows.

  Diagnosis 2 is partially correct but not the whole story: the discrete state space prevents convergence, but the core issue is under-specification.

  Diagnosis 3 is the most compelling: the trouble is incomplete description. This explains all cases: A is incomplete and hence paradoxical; B is incomplete but can be naturally completed; C is complete and unproblematic.

  Diagnosis 4 is insightful but secondary: the continuity assumption is not warranted, but the primary issue is under-specification. Without convergence (as in A), there is no natural candidate for the state at t=1, so the under-specification is more acute.

  **(c) Implications for supertasks:**

  The deflationary reply (Benacerraf) is that the problem is under-specification: the description does not fix the state at t=1. This is supported by our analysis: by explicitly specifying (as in C) or by having a convergent sequence (as in B), we avoid paradox.

  Thomson concludes that supertasks are impossible because they lead to contradiction. But our analysis shows that the contradiction in Lamp A arises only if we assume that the state at t=1 must be either on or off and that it must be determined by the sequence. But the sequence does not determine it. Hence, there is no contradiction; only under-specification.

  The bouncing ball example: a ball bouncing with decreasing height (due to a coefficient of restitution <1) completes infinitely many bounces in finite time and comes to rest. The state (position and velocity) is continuous and converges to (0,0) at the limit time. Hence, we can define the state at the limit. This is a coherent supertask.

  Thus, supertasks are not impossible. The problem in Thomson's lamp is not the supertask per se but the combination of a non-converging sequence and a discrete state space, leading to under-specification. In continuous systems with convergence (like the ball or Lamp B), supertasks are unproblematic. The lamp paradox does not show the impossibility of supertasks but the need for adequate specification.

  ---

  Now, the marking scheme: five must-hit points, ordered from elementary to discriminating, totalling 20 marks.

  1. **Elementary (2 marks)**: For each of the four diagnoses, the candidate must state what the diagnosis predicts about Lamp B and Lamp C and whether the prediction is correct.
     - *Common mistake*: Failing to address both lamps for each diagnosis or misstating the predictions.

  2. **Intermediate (4 marks)**: The candidate must explicitly note that Lamp B converges to a limit (1/2) and that this allows a natural completion of the description, while Lamp A does not converge.
     - *Common mistake*: Not recognizing the convergence in Lamp B or not contrasting it with Lamp A's non-convergence.

  3. **Intermediate (4 marks)**: The candidate must conclude that the primary trouble in Lamp A is under-specification (diagnosis 3) and that the other diagnoses are either incorrect (diagnosis 1) or secondary (diagnoses 2 and 4).
     - *Common mistake*: Failing to identify diagnosis 3 as the most compelling or not properly evaluating the others.

  4. **Advanced (5 marks)**: The candidate must explicitly engage with the deflationary reply (Benacerraf) and Thomson's conclusion, arguing that the lamp does not show the impossibility of supertasks because the problem is under-specification, not the supertask itself.
     - *Common mistake*: Not discussing Benacerraf and Thomson or misrepresenting their views.

  5. **Most discriminating (5 marks)**: The candidate must clearly distinguish between what the description determines and what a physical system can do, and must use the bouncing ball example to show that supertasks are possible in systems with convergent behavior. They must note that the ball example provides a physical model of a supertask that is unproblematic because the state at the limit is determined by convergence.
     - *Common mistake*: Conflating the issue of specification (what the description says) with physical realizability, or failing to properly use the ball example to contrast with the lamp.

  Total: 2+4+4+5+5 = 20 marks.
answer: |-
  ### Exam Question  
  **Time allowance:** 90 minutes  
  **Expected length:** Approximately 800 words  

  **Question:**  
  Thomson’s lamp (Lamp A) describes a supertask: a lamp starts "off" at \( t = 0 \), and its two-state switch (on/off) is toggled at times \( t_n = 1 - 2^{-n} \) for \( n = 1, 2, 3, \ldots \), completing infinitely many toggles by \( t = 1 \). This raises a paradox: the lamp’s state at \( t = 1 \) is indeterminate. Consider two variants:  
  - **Lamp B**: Runs on the same schedule \( t_n \), but the switch is a dimmer. At \( t_n \), brightness is set to \( b_n = \frac{1}{2} + (-1)^n \cdot 2^{-(n+1)} \) (a continuous value between 0 and 1).  
  - **Lamp C**: Identical to Lamp A, but with an added clause: "the lamp is on at \( t = 1 \)."  

  Four candidate diagnoses for the trouble in Lamp A are:  
  1. The trouble is the infinite number of toggles.  
  2. The trouble is that the lamp’s state space has only two discrete values, preventing convergence.  
  3. The trouble is that the description fixes the state only on \([0, 1)\), not at \( t = 1 \) (incomplete specification).  
  4. The trouble is a tacit assumption that the state must be continuous at \( t = 1 \), which is unwarranted.  

  **Tasks:**  
  (a) For each diagnosis (1–4), state what it predicts about Lamp B and Lamp C: Can the state at \( t = 1 \) be determined? If so, what is it? Evaluate whether the prediction is correct for each lamp.  
  (b) Based on (a), adjudicate the diagnoses: Which are correct or incorrect? Why?  
  (c) What do your conclusions show about the thesis that supertasks are impossible? Use a control case: an idealised ball with a coefficient of restitution < 1 bounces infinitely often in finite time and comes to rest at the limit point. Explicitly engage with Benacerraf’s deflationary reply (that the problem is under-specification) and Thomson’s conclusion (that supertasks are impossible).  

  **Requirements:**  
  - Use only the material provided and course content.  
  - No citations or external sources.  

  ---

  ### Model Answer (Approx. 800 words)  
  Thomson’s lamp (Lamp A) presents a paradox: after infinitely many toggles, the state at \( t = 1 \) seems indeterminate. I evaluate four diagnoses using Lamps B and C, then discuss implications for supertasks.  

  **(a) Evaluation of diagnoses using Lamps B and C**  
  *Diagnosis 1 (infinite toggles cause trouble)*: This predicts that any supertask with infinite actions is problematic. For Lamp B, it implies the state at \( t = 1 \) should be indeterminate. However, the brightness sequence \( b_n = \frac{1}{2} + (-1)^n \cdot 2^{-(n+1)} \) converges to \( \frac{1}{2} \) as \( n \to \infty \). Thus, the state at \( t = 1 \) is determinable as \( \frac{1}{2} \). The prediction fails for Lamp B. For Lamp C, infinite toggles occur, but the added clause fixes the state as "on" at \( t = 1 \), making it determinate. The prediction also fails here. Thus, Diagnosis 1 is incorrect: infinity alone is not the issue.  

  *Diagnosis 2 (discrete state space prevents convergence)*: This predicts that a continuous state space (Lamp B) allows convergence, resolving the trouble. Lamp B’s brightness converges to \( \frac{1}{2} \), so the state at \( t = 1 \) is determinate—correct. For Lamp C, the discrete state space should cause trouble, but the explicit clause overrides this, fixing the state as "on". Diagnosis 2 is partially correct but incomplete: it explains Lamp A’s non-convergence but ignores that specification can resolve it (as in C).  

  *Diagnosis 3 (incomplete specification on [0,1) only)*: This predicts that without a \( t = 1 \) specification, the state is indeterminate. For Lamp A, this holds: the description only covers \( t < 1 \), so \( t = 1 \) is undefined. For Lamp B, the description also omits \( t = 1 \), so the state is initially indeterminate. However, the sequence converges to \( \frac{1}{2} \), providing a natural completion. Thus, while incomplete, it is resolvable. For Lamp C, the explicit clause completes the specification, fixing the state as "on". Diagnosis 3 is correct: under-specification is the core issue.  

  *Diagnosis 4 (unwarranted continuity assumption)*: This predicts trouble arises if we assume continuity without justification. For Lamp A, if continuity is assumed, the state must match the limit of the sequence—but no limit exists, causing contradiction. The diagnosis correctly notes that the description does not require continuity, so the state is arbitrary. For Lamp B, the sequence converges to \( \frac{1}{2} \), so continuity would imply this state at \( t = 1 \), but without continuity, any state is possible. The description does not require continuity, so the state is indeterminate without further specification. This matches. For Lamp C, the explicit "on" at \( t = 1 \) violates continuity (as the sequence oscillates), but the description does not demand continuity, so it is acceptable. Diagnosis 4 is insightful but secondary: it highlights an error in reasoning, but under-specification (Diagnosis 3) is the root cause.  

  **(b) Adjudication of diagnoses**  
  Diagnosis 1 is refuted: Lamps B and C show that infinite actions do not inherently cause indeterminacy. Diagnosis 2 is partially correct for Lamp A but fails for Lamp C, where specification overcomes non-convergence. Diagnosis 4 identifies a common mistake (assuming continuity) but does not address why Lamp B is less problematic than A. Diagnosis 3 is the most compelling: under-specification at \( t = 1 \) is fundamental. Lamp A’s trouble arises because the sequence does not converge, leaving no natural completion, while Lamp B converges and Lamp C is explicitly specified. Benacerraf’s deflationary reply—that the problem is merely under-specification—is vindicated: no contradiction exists if we reject unwarranted assumptions.  

  **(c) Implications for supertasks**  
  Thomson concludes that Lamp A proves supertasks impossible, as they generate contradictions. However, our analysis shows the contradiction arises from under-specification and misapplied assumptions (e.g., continuity or binary state constraints), not the supertask itself. Benacerraf’s deflationary view is correct: the description fails to specify the limit state, but this does not imply impossibility. The bouncing ball control case confirms this: with coefficient of restitution < 1, bounce heights decrease geometrically, and infinitely many bounces occur by \( t = 1 \). Crucially, the state (position/velocity) converges to (0,0) at \( t = 1 \), so it comes to rest deterministically. This supertask is unproblematic because the state is naturally defined by convergence.  

  Thus, Thomson’s lamp does not show supertasks are impossible. Lamp A’s trouble stems from its discrete state space and divergent sequence, which prevent a unique limit, but this is a failure of description, not physics. Lamp B and the bouncing ball demonstrate that supertasks with convergent behavior are coherent. The broader lesson is that supertasks require clear limit-state specification: when convergence occurs (Lamp B, ball), it defines the state; when not (Lamp A), explicit completion (Lamp C) is needed. Physical realizability is distinct: the ball shows convergence can model physical rest, but Lamp A’s discrete states may not align with real systems. In sum, supertasks are possible if the description ensures determinacy at the limit.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points, ordered from elementary to most discriminating:**  

  1. **For each diagnosis, predictions for Lamps B and C are stated and evaluated (2 marks).**  
     *Note: Candidates often fail to address both lamps per diagnosis or misstate predictions (e.g., claiming Lamp B has no state at t=1 for Diagnosis 2).*  

  2. **Lamp B’s convergence to 1/2 is noted, contrasting with Lamp A’s non-convergence (4 marks).**  
     *Note: Candidates often overlook convergence in Lamp B or do not contrast it with Lamp A.*  

  3. **Diagnosis 3 (incomplete specification) is identified as primary, with correct reasoning for Lamps A, B, and C (4 marks).**  
     *Note: Candidates often misrank diagnoses (e.g., overemphasizing Diagnosis 1 or 4) or fail to explain why Lamp B is resolvable.*  

  4. **Explicit engagement with Benacerraf (deflation: under-specification) and Thomson (impossibility), showing Lamp A’s trouble is descriptive, not inherent to supertasks (5 marks).**  
     *Note: Candidates often omit or misrepresent Benacerraf/Thomson, or conflate under-specification with impossibility.*  

  5. **Clear distinction between description (what is specified) and physical realizability, using the bouncing ball to show supertasks are possible when convergence defines the state (5 marks).**  
     *Note: Candidates often conflate these (e.g., assuming Lamp A’s description must match physics) or misuse the ball example (e.g., not explaining convergence).*
