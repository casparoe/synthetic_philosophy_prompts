prompt: |-
  In my comparative political theory course we keep encountering the claim — made about Singapore and China — that a government can earn its authority through results: sustained growth, public order, rising living standards, rather than through competitive elections. I want to know what that justifying practice presupposes. Reconstruct the implicit theory of legitimacy. Does it presuppose that legitimacy is a matter of outputs rather than consent — that some threshold of welfare and order, once met, makes electoral accountability unnecessary — or only that performance is one consideration among several? Which rival accounts does it quietly rule out, and which does it leave compatible, given that a consent-based or rights-based theory might treat performance as evidence that genuine consent is possible rather than as a substitute for it? Say where the practice is philosophically underdetermined: can a purely procedural account, or a purely prudential one, license the same conclusions, or does the practice strictly require a substantive theory of the people's interests that is knowable independently of what they would choose? Keep the descriptive question separate from the normative one — is the claim that people do in fact accept such a regime as legitimate, or that they should? Finally, tell me what would have to change if someone defended the same practice while refusing any paternalism, treating prosperity and order only as conditions that make genuine consent possible rather than as the ground of authority.
reasoning: |-
  Okay, the user is asking about the implicit theory of legitimacy behind the claim that governments like Singapore and China derive authority from results rather than elections. Let me unpack this step by step.

  First, the core tension: performance legitimacy versus procedural legitimacy. The user wants to know if results alone can justify authority, or if they're just one factor. They mention consent-based theories where performance might enable consent rather than replace it. 

  I should map the presuppositions carefully. The performance-based argument seems to rest on three pillars: that legitimacy originates from outputs (welfare/order), that these outputs are objectively measurable, and that they can substitute for consent mechanisms. This directly conflicts with theories requiring explicit consent procedures like elections.

  The user's deeper concern might be about paternalism - can we avoid it while still valuing performance? That's where the "conditions for consent" angle becomes crucial. If prosperity enables meaningful choice rather than replacing it, that's a very different framework.

  Also need to address the descriptive/normative split. The claim often mixes "people accept this" (descriptive) with "they should accept it" (normative). This ambiguity matters because real-world acceptance doesn't equal moral justification.

  The trickiest part is the underdetermination question. Can proceduralists or prudentialists reach similar conclusions? Probably not purely, since both would still require some choice mechanism. The practice seems to demand substantive knowledge of what's good for people.

  If rejecting paternalism, the defender would need to treat performance as preparatory - like building the economic base for future democracy. But that undermines the original claim's substitution logic. The moment you say "this enables real consent later," you admit consent is ultimately necessary.

  User seems philosophically sophisticated - they're spotting how performance arguments smuggle in objectivist views of welfare. Should highlight that move: when regimes say "we know what's good for you," they're making a strong epistemological claim that bypasses preference revelation mechanisms.
answer: |-
  This performance-based legitimacy claim rests on a sophisticated but contestable set of presuppositions. Here's a reconstruction, analysis of rival theories, and implications:

  **Implicit Theory of Legitimacy:**
  1.  **Legitimacy Source:** Authority stems primarily from the *effective delivery of substantive goods* (sustained growth, order, rising welfare), not from the *procedural source* of power (e.g., competitive elections).
  2.  **Threshold Logic:** Meeting a sufficiently high threshold of performance renders *alternative mechanisms* for demonstrating consent (like elections) *unnecessary or even counterproductive* to stability and continued delivery.
  3.  **Objective Goods:** The goods delivered (economic growth, order, basic welfare) are considered objectively valuable and universally desired by the populace, regardless of their expressed preferences on political procedures. The regime possesses the technical competence to identify and deliver these goods.
  4.  **Tacit Consent:** Sustained popular acceptance (lack of mass unrest, compliance) under conditions of improved welfare is interpreted as *tacit consent* or *de facto legitimacy*. Grumbling is tolerated as long as core needs are met.
  5.  **Primacy of Outcomes:** The moral justification for authority ultimately rests on the *consequences* of rule, prioritizing collective well-being and stability over individual political rights or procedural fairness as foundational values.

  **Relationship to Rival Accounts & What it Rules Out:**
  *   **Rules Out:** Purely procedural theories (e.g., strict Schumpeterian democracy, Lockean consent theories requiring explicit mechanisms). It explicitly rejects that competitive elections are a *necessary condition* for legitimacy.
  *   **Rules Out:** Strong rights-based theories where certain political rights (voting, free speech, assembly) are inherent to legitimacy *regardless* of outcomes. Performance cannot override the violation of these core rights.
  *   **Compatible With:** **Pragmatic Consent Theories:** Performance could be seen as *creating conditions* where genuine consent (if sought) would be more meaningful or likely. However, the performance-based claim *as stated* goes further by suggesting performance *obviates the need* to seek that consent procedurally.
  *   **Compatible With:** **Weak Rights-Based Theories:** Theories where socio-economic rights are paramount *and* the regime demonstrably delivers them might find resonance, but only if political rights are deemed secondary or conditional.
  *   **Compatible With:** **Communitarian Theories:** Emphasizing social harmony, collective welfare, and cultural context over individualistic procedural rights. Performance delivers these communitarian goods.
  *   **Quietly Rules Out:** **Epistemic Theories of Democracy:** The claim implicitly rejects the idea that democratic procedures are essential for *discovering* the public good or avoiding catastrophic error, suggesting technocratic competence suffices.

  **Philosophical Underdetermination:**
  *   **Purely Procedural Account:** Cannot license the same conclusions. A proceduralist insists legitimacy *requires* the correct procedure (e.g., free elections). Good outcomes might be desirable but are irrelevant to the *source* of legitimacy. Performance alone wouldn't justify bypassing the procedure.
  *   **Purely Prudential Account (Obey for Self-Interest):** *Could* license *compliance* based on fear of chaos or desire for continued prosperity ("prudential acquiescence"). However, it struggles to ground genuine *legitimacy* (moral right to rule) solely on outcomes. Prudence explains *why* people obey; it doesn't necessarily morally *justify* the ruler's authority. It reduces legitimacy to effective coercion + bribery.
  *   **Requires a Substantive Theory:** The performance-based claim **strictly requires** a substantive, objective theory of the people's "true" or "fundamental" interests (welfare, order, growth) that is knowable *independently* of their expressed political choices. The regime claims privileged knowledge of these interests and the competence to deliver them. This is inherently paternalistic.

  **Descriptive vs. Normative:**
  *   **Descriptive Claim:** Often made: "The people *do* accept the regime as legitimate *because* of the results." This is an empirical claim about attitudes, potentially measurable through surveys, social stability, and lack of revolutionary fervor despite political restrictions.
  *   **Normative Claim:** The stronger, more philosophical claim embedded in the justification: "The people *should* accept the regime as legitimate *because* it delivers the goods, *even without* competitive elections." This claims performance *morally justifies* authority, making elections unnecessary.

  **Defending the Practice Without Paternalism (The "Enabling Conditions" Defense):**
  To reject paternalism and treat prosperity/order *only* as conditions enabling genuine consent:
  1.  **Shift in Justification:** Prosperity and order are *necessary preconditions* for meaningful political agency and the formation of authentic consent, not the *ground* of legitimacy itself. The *ground* remains consent.
  2.  **Temporary & Instrumental:** The non-democratic phase is framed as a *temporary, instrumental necessity* to establish the socio-economic foundations (literacy, basic security, economic independence) required for a functioning democracy where consent isn't distorted by desperation or ignorance. The regime is a "developmental dictatorship."
  3.  **Ultimate Goal is Consent:** The regime's legitimacy becomes contingent on its *eventual transition* to a system where consent can be authentically expressed. Its performance is judged partly on *how well it prepares* the ground for this transition. Stagnation or refusal to transition undermines legitimacy.
  4.  **Burden of Proof:** The defender bears a heavy burden to demonstrate:
      *   Genuine consent is *impossible* under current conditions (not just difficult).
      *   The regime is the *only feasible* path to creating the enabling conditions.
      *   There is a credible, binding commitment and roadmap to transitioning to a consent-based system *once conditions are met*.
      *   The regime actively fosters the *skills and spaces* (education, civil society development) needed for future democratic citizenship, not just economic growth.
  5.  **Vulnerability:** This defense is highly vulnerable to the "moving goalposts" problem – regimes often claim conditions for democracy "aren't yet met" indefinitely. It also struggles to justify the suppression of dissent aimed at *accelerating* the transition or defining the "enabling conditions" differently.

  **In essence:** The performance-based legitimacy claim presupposes a substantive, output-oriented theory that prioritizes objective welfare goods and interprets tacit acceptance as sufficient consent, explicitly rejecting procedural democracy as necessary. It is incompatible with purely procedural or strong rights-based theories and *requires* a paternalistic claim to know the people's true interests. Defending similar practices without paternalism transforms the justification entirely, making performance merely a temporary, instrumental step towards the ultimate goal of genuine consent-based legitimacy, placing a heavy burden of proof on the defender regarding transition.
