prompt: |-
  Background: I've been reading rationalist blogs and forums since the old Overcoming Bias days, I'm not an academic, and I've somehow talked a friend with a donor-advised fund into letting me allocate about $500k over two years to the question of how moral revolutions actually happen — the Appiah honor thing (dueling, footbinding, the slave trade), the older economic-interest story about abolition where Britain ditches slavery once it stops paying, and the third option where it's mostly arguments and moral suasion finally landing. I get to pick 3 or 4 people, mostly philosophers and political theorists, maybe one person who can run numbers on historical data, and I have to hand them a research agenda. This is also going to turn into a long blog sequence, so I care about the reasoning, not just the list.

  Here's my problem: every time I try to write the agenda I end up with a list of topics that sound deep and don't constrain anything. So I want you to act like a philosopher who's spent a career on moral change and also has a good nose for what's actually load-bearing, and think carefully rather than giving me the obvious list. No need for citations, I won't check them and half the point is I want to see the reasoning rather than a literature map.

  Before you answer, brainstorm: spend some real time generating 15-20 candidate open questions in this area, then cut down to the 4-5 you'd actually fund. Show me the discard pile in one line each, so I can see what you threw away and why.

  Some half-formed things I keep circling that you should engage with, and tell me if they're confused:

  - Failed and near-miss revolutions. Some norms get argued against for a century and don't budge, then collapse in twenty years (dueling, footbinding). Others never move at all. Is the interesting variable the norm itself, the elite that carries it, or the surrounding crisis?
  - Counter-revolutions and norm hardening. Anti-sodomy law spread across a lot of the world's legal codes in the 19th century through imperial administration, not argument. Do we have a theory of moral change that even handles the bad direction, or is everything written assuming the change is the good kind?
  - The de jure / de facto gap. People can stop doing a thing without thinking it wrong, or think it wrong and keep doing it. Most of the literature seems to count the behavior change as the revolution. Should whether the norm itself actually changed be its own research question?
  - Silent collapses. Dueling seems to die off largely after the mass slaughter of the first world war — no big argument, everyone just stops. How much of moral change is argument and how much is that?
  - The honor/dignity/victimhood trichotomy that circulates in comment sections. Does it carve at joints, is it a candidate explanation of the mechanisms, or is it a distraction?

  For each of the 4-5 you keep: (a) why it's upstream of other questions rather than downstream, (b) whether it's actually tractable for philosophers who mostly can't read archives and aren't going to do stats, (c) what the crux is — what you'd have to believe for it to matter, (d) what evidence over the next two years would move it up or down my list, and (e) what it would change about how the empirical people spend their time if it got settled one way or the other. Then tell me the two questions I should probaly not fund even though they're fun, and why. And if you think the whole framing is off and the right agenda is somewhere else, say so and defend it — I'd rather find out now than in year two.
reasoning: |-
  Okay, let me approach this systematically. The user is a seasoned rationalist community member with $500k to allocate to studying moral revolutions, seeking a focused research agenda beyond superficial topics. They've identified several half-formed concerns about norm persistence, counter-movements, and silent collapses that need addressing.

  First, I need to generate 15-20 candidate questions covering the key dimensions they raised: historical cases, mechanisms of change, theoretical frameworks, and methodological challenges. This should include their specific points about failed revolutions, norm hardening, de facto/de jure gaps, and the honor/dignity/victimhood model. 

  Looking at their half-formed thoughts:
  - The elite/crisis interplay in failed revolutions seems crucial but underdeveloped
  - Counter-revolution analysis could reveal symmetries in moral change mechanisms
  - The de jure/de facto distinction might need conceptual refinement
  - Silent collapses challenge argument-centric models
  - The honor/dignity/victimhood framework deserves scrutiny

  From these, I'll develop candidate questions ranging from case-specific inquiries to theoretical frameworks. Then I'll filter them through criteria of upstream importance, tractability for philosophers, and potential to reshape empirical research. The discard pile should clearly show why certain interesting but derivative or intractable questions get cut.

  For the selected 4-5 questions, each analysis must articulate:
  (a) Why it's foundational 
  (b) Philosophical tractability 
  (c) Core assumptions 
  (d) What evidence would shift its priority 
  (e) How it would redirect empirical work

  The two tempting but unfundable questions should highlight seductive yet unproductive avenues. Finally, I'll consider whether their framing needs adjustment - perhaps emphasizing mechanism identification over grand theories could yield more actionable insights.

  Throughout, I'll maintain the voice of a philosopher steeped in moral change literature but pragmatic about research design, matching the user's preference for reasoning over citations.
answer: |-
  Here’s a brutally honest philosopher’s take, after generating and pruning 20 questions. I’ll cut to the chase first, then justify the cuts and address your half-formed thoughts.

  **The Core Agenda (4 Questions to Fund):**

  1.  **What *structural* conditions make moral arguments "land" after long latency periods?**  
      *(e.g., Why did anti-dueling arguments from 1650-1800 fail, then succeed post-1918?)*  
      - **(a) Upstream:** Explains *when/why* suasion works, not just *if*. Cuts across "argument," "interest," and "crisis" models.  
      - **(b) Tractability:** Philosophers can analyze historical cases for recurring structural features (e.g., decline of aristocratic power, rise of centralized state monopoly on violence, changes in media tech) without deep archives. Theorist + data person can test correlations.  
      - **(c) Crux:** Belief that the *receptiveness environment* is distinct from the moral argument’s quality or the economic interest.  
      - **(d) Evidence:** Identifying 2-3 common structural shifts (e.g., institutional collapse, technological disruption) preceding multiple "sudden" norm collapses despite prior argumentation. Failure would be finding only idiosyncratic causes.  
      - **(e) Empiricist Impact:** Focuses data work on mapping pre-collapse conditions (institutional strength, elite cohesion, communication flows) rather than just tracking argument prevalence or economic metrics.

  2.  **Is "norm hardening" (counter-revolutions) driven by the same mechanics as norm collapse, just in reverse?**  
      *(e.g., Anti-sodomy laws spreading via administration, not argument)*  
      - **(a) Upstream:** Forces symmetry. If "bad" change uses different mechanisms, our whole theory of moral change is probably wrong/normatively biased.  
      - **(b) Tractability:** Philosophers excel at comparing mechanisms (coercion vs. persuasion, institutional vs. cultural). Identify clear cases of norm *imposition* vs. organic adoption.  
      - **(c) Crux:** Belief that moral change mechanics are directionally neutral. If false, we need separate theories for "progress" and "regression."  
      - **(d) Evidence:** Finding cases where norm hardening used persuasion/social mimicry (supporting symmetry) vs. pure top-down coercion (asymmetry). Quantifying elite vs. mass buy-in in hardening.  
      - **(e) Empiricist Impact:** Compels data work on *how* norms spread in "regressive" shifts (legal codes, surveillance, punishment rates) and elite signaling, not just progressive ones.

  3.  **When does behavioral change *precede* normative belief change, and vice versa? What sustains the gap?**  
      *(e.g., People stop dueling but still believe in honor; people condemn slavery but profit from it)*  
      - **(a) Upstream:** Challenges the assumption that behavior and belief shift together. Explains persistence/resistance and predicts relapse potential.  
      - **(b) Tractability:** Philosophers dissect concepts of hypocrisy, weakness of will, social performance, and belief fragmentation. Identify proxies for belief/behavior disconnect in historical records (e.g., private letters vs. public acts).  
      - **(c) Crux:** Belief that the de facto/de jure gap is a core feature, not noise, and reveals mechanisms (e.g., fear vs. genuine conviction).  
      - **(d) Evidence:** Documenting sustained gaps in specific cases (duration, scale). Finding *why* gaps close (new enforcement? genuine persuasion?) or persist.  
      - **(e) Empiricist Impact:** Demands data on *both* behavior *and* attested beliefs (diaries, sermons, court records) and their correlation over time, not just one stream.

  4.  **Do "silent collapses" primarily reflect latent argumentation becoming salient, or a genuinely non-discursive shift?**  
      *(e.g., Dueling post-WWI: Did the war just make prior arguments visceral?)*  
      - **(a) Upstream:** Tests the *necessity* of explicit argument. If non-discursive shifts dominate, it undermines rationalist models of change.  
      - **(b) Tractability:** Philosophers analyze causation, salience, and the role of visceral experience vs. discourse. Contrast cases with/without prior argumentation.  
      - **(c) Crux:** Belief that shared traumatic experience can bypass discourse and directly rewire normative intuitions.  
      - **(d) Evidence:** Finding "silent collapses" with *no* prior discursive criticism (unlikely), or showing prior discourse was irrelevant/counterproductive. Evidence *for* would be rapid collapse coinciding with trauma *without* new arguments.  
      - **(e) Empiricist Impact:** Shifts focus from tracking discourse to identifying exogenous shocks (wars, famines, tech changes) and measuring behavioral response speed/consistency.

  **The Discard Pile (1-Line Justification):**

  5.  *Cataloging "failed" vs. "successful" revolutions:* **Downstream** – Requires first understanding mechanisms to define "failure" meaningfully.
  6.  *Mapping elite network dynamics in specific revolutions:* **Intractable** – Needs deep archival skills beyond typical philosophers/data scope on this budget.
  7.  *Evolutionary psychology of norm adoption:* **Distraction** – Too speculative/fundamental; doesn't engage with historical particulars of *revolutionary* change.
  8.  *Role of specific rhetoric/emotions (shame vs. guilt):* **Downstream** – Depends on knowing *when* rhetoric can land (covered in Q1).
  9.  *Comparing speed of different revolutions:* **Descriptive** – Doesn't explain *why* speed varies; outcome of Q1/Q4 explains this.
  10. *Economic determinism vs. idealism debate:* **Stale/Oversimplified** – Q1 & Q2 inherently address this interplay better.
  11. *The "Great Man" theory of moral leaders:* **Mostly Debunked/Downstream** – Leaders matter within structural contexts (Q1).
  12. *Universal stages of moral progress:* **Unfalsifiable/Normatively Loaded** – Contra Q2.
  13. *Impact of printing press/internet:* **Specific Instance** – Covered under structural conditions (Q1) and salience (Q4).
  14. *Defining "moral revolution" precisely:* **Semantic Rabbit Hole** – Can operationalize per project without universal definition.
  15. *Detailed case study of one revolution (e.g., abolition):* **Downstream** – Useful later to test hypotheses from core questions.
  16. *Future-telling: Predicting next revolution:* **Premature** – Requires answers to core questions first.
  17. *Neuro-correlates of norm change:* **Intractable/Off-Mission** – Far from historical focus, methods mismatch.
  18. *Global survey of current norm conflicts:* **Descriptive/Not Mechanistic** – Doesn't explain *how* change happens.
  19. *Formal modeling of norm diffusion:* **Downstream/Oversimplifying** – Needs empirical mechanisms from Q1-Q4 to build on.
  20. *The role of religion as prime mover:* **Reductive** – Religion is one vehicle operating within structures/mechanisms of Q1-Q4.

  **Engaging Your Half-Formed Thoughts:**

  *   **Failed/Near-Miss Revolutions:** Your variables (norm, elite, crisis) are intertwined. Q1 (structural conditions) tackles this head-on. The "interesting variable" is likely the *alignment* of elite incentives, institutional capacity, and crisis-driven salience (Q1 & Q4).
  *   **Counter-Revolutions/Norm Hardening:** Absolutely crucial and often ignored. Q2 forces this symmetry. Bad change *can* happen via suasion (e.g., moral panics) *or* coercion; figuring out which and when is key.
  *   **De Jure/De Facto Gap:** Central and understudied. Q3 makes this the focus, not a footnote. It reveals hypocrisy, coercion, and genuine belief shifts.
  *   **Silent Collapses:** Q4 addresses this directly. The WWI example might show trauma making prior arguments *salient* (supporting argument's role) or a true non-discursive shift (challenging it). This is a crux.
  *   **Honor/Dignity/Victimhood Trichotomy:** **Largely a distraction.** It's a descriptive typology, not a mechanistic explanation. It confuses *rhetorical styles* with *causal engines*. Does "victimhood culture" *cause* change, or is it a tactic used *within* structural conditions (Q1)? Likely the latter. Fund Q1 instead.

  **Two Fun But Unfundable Questions:**

  1.  **"Can we identify 'moral singularity' points where change becomes irreversible?"** *Why Not:* Requires answering Q1-Q4 first. Premature and potentially unfalsifiable myth-making. Tempting but not load-bearing.
  2.  **"What's the optimal rhetorical strategy for moral entrepreneurs?"** *Why Not:* Downstream of Q1 (when/where arguments land) and Q3 (belief/behavior gap). Highly context-dependent; no universal answer. Feels tactical, not fundamental.

  **Framing Check:** Your framing is *mostly* sound. The obsession with "how it actually happens" is correct. However, ditch the quest for *one* unified theory (Appiah vs. interest vs. suasion). Fund Q1-Q4 to **identify distinct mechanisms and when they dominate**. The right agenda isn't "which grand theory wins?" but **"what toolbox of mechanisms operates under what conditions?"** This is more actionable for your blog and future work. Q1-Q4 build that toolbox and the conditions for its use.

  **Next Steps:** Hand this agenda to your team. The philosopher(s) focus on mechanism conceptualization and historical case *comparison* across Q1-Q4. The data person hunts for quantifiable proxies for structural conditions (Q1), norm spread methods (Q2), belief/behavior gaps (Q3), and shock events (Q4). The blog writes itself as each question reveals layers of the how. Good luck—this is a philosopher's dream project.
