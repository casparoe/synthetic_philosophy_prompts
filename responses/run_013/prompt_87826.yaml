prompt: |-
  Last night I argued with an old friend for the better part of three hours, and I would rather put the disagreement to work than lose the sleep again.

  We were arguing about the co-operative where I live — some two hundred households that own their buildings in common and run everything by vote — and about a deadlock we keep hitting. Our rules let any household claim a 'personal domain' over certain matters: what it cooks, how it keeps its own front garden, whether it keeps a pet, whether it works from home. The same rules let the whole membership adopt binding standards: no open fires on the balconies, no amplified music after eleven, no vehicles on the green. These two things collide, and our rules say nothing about what to do when they do. My friend's position was that the arrangement is incoherent: a community genuinely liberal, he said, must let each household settle what concerns only itself, and one that lets the majority override that is bullying a minority with extra steps; yet a community that lets any household veto whatever the majority cares about cannot govern itself at all. So one of the two principles must be a fiction, and we should admit which we have quietly abandoned. My position was that the collision is real but not fatal — it means we cannot have both principles unconditionally, not that we must surrender either — but I could not tell him what we should do instead, and I would like to be able to.

  I chair the committee that hears these disputes, so this is not hypothetical. We get two or three a month, and the household that loses can be genuinely hurt: one was recently told to rehome a dog, another to give up bees on its roof, and in both cases the members said, in effect, that we had voted on something that was theirs and not ours. I need a decision procedure I can actually run, and that the other six members of the committee can apply without having read any political philosophy. Please write it for me: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops and says no, and the point at which it hands the decision back to a person because the remaining question is one of values rather than of fact.

  Three constraints, all of them coming out of the argument.

  First, we cannot appeal to how strongly anyone feels. We have no way to measure that and no common currency in which to compare one household's intensity with another's; we have only people's rankings of the outcomes and their reasons. The procedure has to work with that and no more.

  Second, people here do not care only about their own affairs. Several members have told us they are made miserable by a neighbour's choice even when it touches nothing of theirs — one said she cannot enjoy the shared garden while another household keeps a dog she is frightened of, though the dog is always on a lead. A procedure that counts only self-regarding preferences describes a community that does not exist; one that counts all preferences will let majorities legislate over what a household does inside its own walls. Be explicit about which the procedure does, and why.

  Third, my friend's parting shot was a proposal I cannot dismiss. He suggested that anyone claiming an exemption should pay into a common fund — a 'liberty tax', he called it — so that the household keeping its dog or its bees compensates the others for the nuisance, with the majority free to set the price. He thinks this dissolves the conflict by making liberty a question of what you will pay. I do not trust it, but I cannot articulate exactly what is wrong with it, and I would like the procedure to say whether such a scheme is admissible and, if not, on what ground.

  Then run the procedure on three cases and show your work: a household wanting to keep bees on the roof, where the objection is stings and fear rather than harm yet done; a household wanting to slaughter an animal in the shared courtyard for a religious festival, where the objection is that the courtyard is common and the practice offensive to some; and one further case you construct, in which the procedure returns an answer that will be unpopular with the committee and unpleasant for me, so that I can see what it costs to follow it. Mark clearly which steps are genuinely deciding and which are only arranging a decision a person must make, and tell me at the end what the procedure cannot do — which disputes will still have to be settled by judgement, and which by the crude arithmetic of a vote.

  Finally, tell me how confident you are in each part of this, and single out the step you are least sure survives contact with real cases.
reasoning: |-
  We are designing a decision procedure for a co-operative housing community to resolve disputes where a household's claim of "personal domain" conflicts with a binding standard adopted by the majority. The procedure must:
  1. Not rely on the intensity of feelings (no cardinal utility, only ordinal preferences and reasons).
  2. Account for the fact that people care about others' choices even when not directly affected (so preferences are not purely self-regarding).
  3. Address the "liberty tax" proposal and determine its admissibility.

  The procedure will be based on a framework that distinguishes between:
  - Matters that are inherently private (within the household's personal domain) and those that have legitimate community interest.
  - The nature of the harm or impact on others.

  We will draw from political philosophy (e.g., Mill's harm principle, but adapted) without requiring committee members to know any theory.

  The procedure will ask a series of questions in order. Each question must be answered with evidence (facts, not feelings). The procedure stops when a clear criterion is met.

  **Key Principles for the Procedure:**
  1. **Personal Domain Presumption:** A household's choices are presumed to be within their personal domain unless there is a compelling community interest that overrides it.
  2. **Community Standards Limitation:** Community standards must be justified by a harm (or potential harm) that is non-trivial and not merely based on offense or preference without a tangible impact.
  3. **Neutrality:** The procedure must not favor either side arbitrarily.

  **The Decision Procedure:**

  **Step 1: Identify the Claim and the Standard**
  - Ask: What specific activity is the household (the claimant) engaging in?
  - Ask: What binding community standard (if any) does this activity allegedly violate?
  - If there is no binding standard, then the activity is allowed (unless it violates a fundamental rule of the co-op, but that's not the case here). The dispute is about a standard that exists.

  **Step 2: Determine if the Activity Falls Within the Personal Domain as Defined by the Co-op Rules**
  - Check the co-op rules for the list of matters that are explicitly in the personal domain (e.g., cooking, front garden, pets, working from home). If the activity is explicitly listed, then it is prima facie in the personal domain. If not, then it is not automatically protected, but the household may argue it should be considered analogous. (The committee must decide if it's analogous by a simple vote if necessary, but we try to avoid that.)
  - If the activity is not in the personal domain (explicitly or by analogy), then the community standard applies and the activity is disallowed. The procedure stops here (decision for the community standard).
  - If it is in the personal domain, proceed to Step 3.

  **Step 3: Assess the Community Standard's Justification**
  - Ask: What harm (or potential harm) does the community standard aim to prevent? The harm must be:
     a. Concrete and non-speculative (e.g., risk of fire, noise that disrupts sleep, health hazard).
     b. Not based solely on subjective offense or moral disapproval without tangible harm.
  - If the standard does not address such a harm, then it is an invalid standard for overriding the personal domain. The activity is allowed. The procedure stops (decision for the household).
  - If the standard does address such a harm, proceed to Step 4.

  **Step 4: Assess the Connection Between the Activity and the Harm**
  - Ask: Is the activity causing (or likely to cause) the harm that the standard aims to prevent?
  - Evidence required: e.g., for bees, is there evidence of stings or allergies? For slaughter, is there evidence of health hazards, or is it about offense?
  - If the activity does not cause (and is not likely to cause) the harm, then the standard does not apply to this activity. The activity is allowed. Stop.
  - If the activity does cause (or is likely to cause) the harm, proceed to Step 5.

  **Step 5: Assess the Reasonableness of the Activity in Avoiding the Harm**
  - Ask: Are there reasonable modifications that the household could make to avoid the harm while still engaging in the activity? (e.g., for bees: moving the hive to a less trafficked area, using a bee fence; for a dog: muzzling, keeping it on a lead, etc.)
  - If yes, then the committee can impose those modifications and allow the activity. Stop.
  - If no, then proceed to Step 6.

  **Step 6: Balancing the Interests (The Hard Case)**
  - Now we have a genuine conflict: the activity is in the personal domain and causes (or is likely to cause) a harm that the community standard aims to prevent, and it cannot be reasonably modified to avoid the harm.
  - We must decide whether the harm to the community outweighs the household's interest in the activity.

  But we cannot measure intensity of preferences. So we must use a different approach.

  **Proposed Approach for Step 6:**
  - We consider the nature of the harm and the nature of the activity.
     a. **The Harm:** Is it a harm that violates a basic right or a fundamental interest (e.g., health, safety, sleep) or is it a lesser inconvenience?
     b. **The Activity:** Is it a core aspect of the household's autonomy (e.g., religious practice, basic living) or a non-essential preference?

  We ask:
  - Is the harm one that would be recognized as a violation of a basic right or a fundamental interest in a liberal society? (e.g., physical safety, health, property damage, severe psychological distress that is medically recognized).
  - Is the activity one that is central to the household's identity or well-being? (e.g., religious practice, cultural tradition, essential for mental health).

  **Decision Rule for Step 6:**
  - If the harm is to a basic right/fundamental interest and the activity is non-essential, then the community standard prevails and the activity is disallowed.
  - If the harm is not to a basic right/fundamental interest and the activity is essential, then the household prevails and the activity is allowed (with possible conditions to mitigate the harm as much as possible).
  - If both are of the same level (e.g., both essential or both non-essential), then we cannot resolve by the procedure and must have a vote of the entire membership (or the committee, if delegated). But note: we are trying to avoid votes on values.

  However, the committee must make a judgment call on whether the harm is fundamental and whether the activity is essential. We need to constrain this.

  **To avoid subjectivity:**
  - For the harm: We require evidence of the harm (e.g., medical evidence for health risks, documented noise levels for sleep disruption). Without evidence, we cannot classify it as fundamental.
  - For the activity: We require evidence that the activity is essential (e.g., religious texts for a religious practice, a doctor's note for a therapy animal). Otherwise, we assume it is non-essential.

  But note: the procedure must work without such evidence being always available.

  Alternatively, we can structure Step 6 as a test of **proportionality**:

  1. **Legitimate Objective:** The community standard must serve a legitimate objective (already established in Step 3).
  2. **Rational Connection:** The restriction must be rationally connected to the objective (Step 4).
  3. **Necessity:** There must be no less restrictive means available (Step 5).
  4. **Balancing (Proportionality stricto sensu):** The harm caused by the restriction to the household must not be excessive in relation to the benefit to the community.

  But we cannot measure the magnitude of harm or benefit.

  Given the constraints, we might have to accept that at Step 6, the committee must vote. However, we can structure the vote by requiring the committee to answer two questions:

  Question A: Is the harm prevented by the standard a fundamental harm? (Yes/No)
  Question B: Is the activity a fundamental aspect of the household's liberty? (Yes/No)

  Then:
  - If A is yes and B is no: disallow the activity.
  - If A is no and B is yes: allow the activity.
  - If both are yes or both are no: then the committee must decide by majority vote on the specific case, but they must give reasons based on the evidence and the principles.

  This at least structures the vote and forces the committee to focus on the fundamentality.

  **Step 7: The Liberty Tax Proposal (if raised)**
  - If the household proposes to pay a liberty tax (or if the community proposes it as an alternative), we must decide if it is admissible.
  - The procedure should reject the liberty tax as a general solution because:
     a. It commodifies fundamental rights: some harms (e.g., to health) cannot be compensated by money.
     b. It may lead to inequity: only the rich can then exercise their liberty.
     c. It may not address non-material harms (e.g., fear of dogs, offense at slaughter).
  - Therefore, the liberty tax is only admissible if:
     - The harm is purely economic (e.g., property value decrease) or minor inconvenience that can be compensated by money.
     - And the activity is non-essential.
  - In all other cases, the liberty tax is not admissible.

  **Summary of the Procedure Steps:**

  1. **Identify the activity and the standard.**
  2. **Is the activity in the personal domain?** (Explicitly or by analogy) If no, the standard applies. If yes, go to 3.
  3. **Does the standard address a concrete harm?** If no, the activity is allowed. If yes, go to 4.
  4. **Is the activity causing (or likely to cause) that harm?** If no, the activity is allowed. If yes, go to 5.
  5. **Can reasonable modifications avoid the harm?** If yes, impose modifications and allow. If no, go to 6.
  6. **Balancing test:**
     - Is the harm fundamental? (Requires evidence of fundamental harm: health, safety, etc.)
     - Is the activity fundamental? (Requires evidence of essential importance to the household.)
     - Then:
          (a) If harm is fundamental and activity is not: disallow.
          (b) If harm is not fundamental and activity is: allow (with possible conditions).
          (c) Otherwise (both fundamental or both not): the committee must vote by majority (with reasons) on whether the community interest overrides the personal domain.
  7. **Liberty tax:** If proposed, only admissible in cases of non-fundamental harm and non-fundamental activity. Otherwise, reject.

  **Now, apply to cases:**

  **Case 1: Bees on the roof**

  - Step 1: Activity: keeping bees. Standard: none explicitly about bees? (Assume there is a standard about not causing a nuisance or health hazard, or about pets? But bees may not be considered pets. Alternatively, the community might have adopted a standard against beekeeping because of stings.)

  But let's assume the co-op has a standard: "No keeping of animals that pose a health risk." The household claims that beekeeping is within their personal domain (as a pet or as a garden activity).

  - Step 2: Personal domain includes pets? The rules say "whether it keeps a pet". Bees might be considered a pet? Or not? This is a judgment call. Let's assume the committee decides that bees are not a typical pet but are analogous to a garden activity (which is personal). So yes, personal domain.

  - Step 3: The standard aims to prevent stings (health hazard). This is a concrete harm.

  - Step 4: Is beekeeping likely to cause stings? Yes, but the risk can be low with proper management. However, the objection includes fear (which is not a concrete harm without evidence of phobia or past incidents). We need evidence: if there is a history of stings, then yes. If not, then the fear alone might not be enough. But the standard is about health risk, and the risk exists (even if low). So we proceed.

  - Step 5: Reasonable modifications? Yes: move the hive to a less accessible place, use a bee fence, provide bee suits to neighbors, etc. So we impose modifications and allow.

  **Decision:** Allow with conditions.

  **Case 2: Slaughter in the shared courtyard**

  - Step 1: Activity: slaughtering an animal in the shared courtyard. Standard: probably a standard about maintaining cleanliness and peace in common areas, or about not causing offense? But the rules say the courtyard is common and the standard might be against such practices.

  Assume a standard: "No activities in common areas that are unsanitary or offensive."

  - Step 2: Is slaughtering an animal in the personal domain? The activity is in a common area, not within the household's private space. Therefore, it is not in the personal domain. The personal domain covers what they do inside their own walls. The courtyard is shared.

  - Therefore, the standard applies. The activity is disallowed.

  But note: the household might argue that the religious practice is personal and they have no other place. However, the location (common area) removes it from the personal domain.

  **Decision:** Disallow.

  **Case 3: A Case Where the Procedure is Unpleasant (Constructed)**

  **Case: A household wants to work from home as a music teacher (giving piano lessons) during the day. The community has a standard: "No amplified music after eleven", but this is acoustic music during the day. However, the household's neighbor is a night-shift worker who sleeps during the day and is disturbed by the piano. The neighbor objects.**

  - Step 1: Activity: giving piano lessons at home during daytime. Standard: the standard only covers amplified music after eleven. So no direct violation? But the community might have a general nuisance standard: "No noise that unreasonably disturbs others."

  - Step 2: Working from home is explicitly in the personal domain. So it is protected.

  - Step 3: The standard (if we interpret the nuisance standard) aims to prevent disturbance of peace. This is a concrete harm (sleep disruption).

  - Step 4: Is the piano noise causing harm? The neighbor is a night-shift worker. The noise during the day is disturbing his sleep. This is a concrete harm (health-related). Evidence: the neighbor's work schedule and a doctor's note about the importance of uninterrupted sleep for health.

  - Step 5: Reasonable modifications? The household could soundproof the room, limit lessons to certain hours, use an electric piano with headphones, etc. But let's say the household argues that only acoustic piano is acceptable for teaching. They refuse modifications.

  - Step 6: Balancing test.
     - Harm: sleep disruption is a fundamental harm (health issue). Evidence: doctor's note.
     - Activity: working from home is fundamental, but the specific manner (with acoustic piano) may not be essential. The household must show that teaching piano with an acoustic piano is essential (e.g., it's their livelihood and they cannot afford an alternative, and students require acoustic). Without such evidence, we assume non-essential.

     Decision: harm is fundamental, activity (in this form) is not. Therefore, disallow the piano lessons in the current form.

  But note: the household might lose their livelihood. This is unpleasant.

  **Now, the Liberty Tax:**

  In the bee case, if the household offered to pay a liberty tax, we would reject it because the harm (health risk) is fundamental and cannot be compensated by money. In the piano case, if the harm is non-fundamental (e.g., minor annoyance) then a tax might be admissible, but here the harm is health-related, so tax is not admissible.

  **What the Procedure Cannot Do:**
  - It cannot resolve cases where both the harm and the activity are fundamental and they conflict (Step 6c) without a vote. In such cases, the committee must vote and the outcome depends on their judgment.
  - It cannot measure the intensity of preferences, so it may not capture the full extent of harm or benefit.
  - It relies on evidence for fundamental harm or essential activity; if evidence is lacking, it defaults to non-fundamental.

  **Confidence in the Procedure:**
  - Steps 1-5: High confidence. They are based on standard legal and regulatory reasoning.
  - Step 6: Moderate confidence. The fundamentality distinction is principled but may be hard to apply without evidence. The least confident step is the balancing when both are fundamental or both are not, requiring a vote. We risk reverting to majoritarianism.
  - Liberty Tax: High confidence in rejecting it for fundamental harms, but moderate in defining what is non-fundamental.

  **The Least Sure Step:** Step 6 (when both are fundamental or both are not) because it requires a vote and might not avoid the original problem of majoritarianism. But it is better than an unstructured vote.

  **Final Note:** The procedure must be administered by the committee with care, ensuring that evidence is fairly presented and that the principles are applied consistently. It will not eliminate all disputes, but it structures the inquiry and limits arbitrary decisions.
answer: |-
  Below is a decision procedure designed to resolve disputes in your co-operative where a household's claim of "personal domain" conflicts with a binding community standard. It is built around your constraints: no reliance on intensity of feelings, acknowledgment that preferences are not purely self-regarding, and explicit handling of the "liberty tax" proposal. The procedure uses a step-by-step factual inquiry to minimize subjectivity, with clear stopping points. When values must be weighed (e.g., defining "fundamental harm"), it defaults to a committee vote—but only after exhausting objective tests. I'll first outline the procedure, then apply it to your three cases with detailed work, and end with limitations and confidence assessments.

  ---

  ### **Decision Procedure for Personal Domain vs. Community Standard Disputes**
  **Goal**: Resolve conflicts without measuring emotional intensity, while balancing individual liberty and community governance.  
  **Inputs**:  
  - The household's claimed activity (e.g., keeping bees).  
  - The community standard in question (e.g., "no animals causing nuisance").  
  - Evidence from both sides (documented facts, not feelings).  

  **Outputs**:  
  - **Allow**: Activity permitted (possibly with conditions).  
  - **Disallow**: Activity prohibited.  
  - **Vote**: Committee vote required on values.  
  - **Liberty Tax Admissibility**: Yes/no, with reasoning.  

  **Procedure Steps** (ask in order; stop when a decision is reached):  

  1. **Establish the activity and standard**:  
     - **Question**: What specific activity is the household claiming under personal domain? What specific community standard conflicts with it?  
     - **Sufficient Answer**: Clear descriptions of both (e.g., "keeping bees on the roof" vs. "no health hazards in common areas").  
     - **Decision Point**: If the activity is not listed or reasonably analogous to the co-op's defined personal domain matters (e.g., pets, gardens), disallow immediately. Personal domain only applies to explicit or analogous cases.  
     - **Stop If**: Activity is outside personal domain → **Disallow**.  

  2. **Assess direct harm**:  
     - **Question**: Does the activity cause *direct, observable harm* to others (e.g., physical injury, property damage, health risks) or only *indirect harm* (e.g., offense, discomfort, fear without tangible impact)?  
     - **Sufficient Answer**: Evidence of harm (e.g., medical reports, safety incidents, documented noise levels). Subjective feelings (e.g., "I feel scared") alone are insufficient; require objective correlates (e.g., a diagnosed phobia, past incidents).  
     - **Decision Point**:  
       - If no direct harm → proceed to Step 3.  
       - If direct harm → proceed to Step 4.  
     - **Why this handles non-self-regarding preferences**: Indirect harms (e.g., fear) are considered only if linked to objective evidence (e.g., a phobia diagnosis), preventing majorities from overriding personal domain based purely on preferences. Direct harms always override if proven.  

  3. **Assess indirect harm and community impact**:  
     - **Question**: Is the indirect harm (e.g., offense, fear) severe enough to undermine the *shared environment*? Use two tests:  
       - **Test A**: Does the harm violate a widely accepted co-op norm (e.g., from your founding documents) about communal well-being?  
       - **Test B**: Is the harm pervasive (affecting many households) or isolated (affecting one or few)?  
     - **Sufficient Answer**: Documentation (e.g., community surveys, past committee rulings) showing the harm affects shared spaces or norms.  
     - **Decision Point**:  
       - If neither Test A nor B is met → **Allow** (activity stays in personal domain).  
       - If both tests met → proceed to Step 4.  
       - If ambiguous → proceed to Step 6 (values vote).  
     - **Why this avoids intensity comparisons**: It uses binary tests (pervasive/isolated, norm violation/not) rather than strength of feeling.  

  4. **Evaluate reasonable alternatives**:  
     - **Question**: Can the activity be modified to avoid the harm while preserving its core purpose?  
     - **Sufficient Answer**: Practical options (e.g., relocating beehives, using noise barriers) from experts or past cases.  
     - **Decision Point**:  
       - If feasible modifications exist → **Allow with conditions** (e.g., "bees allowed with relocated hive").  
       - If no feasible modifications → proceed to Step 5.  

  5. **Balance fundamental interests**:  
     - **Question**:  
       - Is the harm *fundamental* (threatens health, safety, or core community function)?  
       - Is the activity *fundamental* to the household (e.g., religious practice, livelihood, basic well-being)?  
     - **Sufficient Answer**: Evidence for fundamentality (e.g., religious texts for rituals, medical needs for therapy animals). Use a "reasonable person" standard: Would most people view this as essential?  
     - **Decision Point**:  
       - Harm fundamental, activity not → **Disallow**.  
       - Activity fundamental, harm not → **Allow**.  
       - Both fundamental or neither → **Proceed to Step 6** (committee vote on values).  
       - Ambiguous evidence → **Proceed to Step 6**.  

  6. **Committee vote on values**:  
     - **Question**: Which principle (personal domain or community standard) should prevail?  
     - **Process**: Majority vote by the committee. Members must state reasons tied to co-op rules or shared values (e.g., "This violates our noise policy," not "I dislike it").  
     - **Stop Here**: This step handles unresolvable value conflicts.  

  **Liberty Tax Admissibility Check** (run if proposed at any step):  
  - **Question**: Is the harm purely economic or minor inconvenience (e.g., property devaluation, temporary noise)?  
  - **Sufficient Answer**: Evidence that money could remedy the harm (e.g., compensation for cleaning costs).  
  - **Decision Point**:  
    - If yes → Liberty tax is **admissible**. Set payment through community vote.  
    - If no (harm is health/safety/fundamental) → Liberty tax is **inadmissible**. Proceed with the main procedure.  
  - **Why this rejects commodification**: It prevents buying exemptions for fundamental harms (e.g., health risks), which cannot be fairly priced and would favor wealthier households.  

  ---

  ### **Application to Cases**  
  **Key**:  
  - ✅ = Decisive step (resolves with facts).  
  - ⚖️ = Values judgment (requires vote or discretion).  

  #### **Case 1: Household wants to keep bees on the roof. Objection: Fear of stings, no prior harm.**  
  - **Step 1: Establish activity and standard**  
    - Activity: Beekeeping (claimed under "pets" or "garden" in personal domain).  
    - Standard: Assume "no health hazards" (from your example).  
    - ✅ **Decision**: Beekeeping is analogous to "pets" or "gardens" → personal domain applies → proceed.  

  - **Step 2: Assess direct harm**  
    - Objection: Fear of stings, but no evidence of allergies or past incidents.  
    - ✅ **Decision**: No direct harm (stings are potential, not actual) → proceed to Step 3.  

  - **Step 3: Assess indirect harm and community impact**  
    - Test A: Does fear violate a co-op norm? Unlikely (no rule against "fear").  
    - Test B: Is fear pervasive? If only one household objects, it's isolated.  
    - ✅ **Decision**: Neither test met → **Allow**. No need for further steps.  
    - **Liberty Tax**: Not proposed, but if it were: Harm (fear) is not economic/minor → **inadmissible**.  

  **Outcome**: Bees allowed.  

  ---

  #### **Case 2: Household wants to slaughter an animal in the shared courtyard for a religious festival. Objection: Offense, shared space.**  
  - **Step 1: Establish activity and standard**  
    - Activity: Slaughter in courtyard (claimed under "what it cooks" in personal domain).  
    - Standard: Likely "no unsanitary/offensive practices in common areas."  
    - ✅ **Decision**: Courtyard is **shared, not personal domain** (rules specify "own front garden," not common areas) → **Disallow**. Stop.  
    - **Why**: Personal domain covers private spaces (e.g., inside homes). Shared courtyards are governed by community standards.  

  - **Liberty Tax**: If proposed, harm (offense) is not economic → **inadmissible**.  

  **Outcome**: Slaughter disallowed.  

  ---

  #### **Case 3: Constructed Case – Unpopular Outcome**  
  **Scenario**: A household wants to run a small daycare (6 children) from their home, claiming "work from home" personal domain. Noise is audible in adjacent units. Community standard: "No disruptive noise in residential zones." Objections: Neighbors report sleep disruption (one provides doctor's note for chronic insomnia), and many find constant noise stressful.  

  - **Step 1: Establish activity and standard**  
    - Activity: Home daycare (claimed under "work from home").  
    - Standard: "No disruptive noise."  
    - ✅ **Decision**: Daycare is analogous to "work from home" → personal domain applies → proceed.  

  - **Step 2: Assess direct harm**  
    - Evidence: Doctor's note links noise to health harm (insomnia). Decibel readings show occasional peaks above local noise ordinances.  
    - ✅ **Decision**: Direct harm (health impact) → proceed to Step 4.  

  - **Step 4: Evaluate reasonable alternatives**  
    - Options: Soundproofing, limited hours (e.g., no early mornings), or fewer children.  
    - Evidence: Soundproofing is feasible but costly ($5,000); household refuses due to cost.  
    - ✅ **Decision**: Modifications feasible → **Allow with conditions** (e.g., "install soundproofing by X date").  
    - **But**: Household rejects conditions → proceed to Step 5.  

  - **Step 5: Balance fundamental interests**  
    - Harm: Sleep disruption → **fundamental** (health impact, supported by evidence).  
    - Activity: Daycare is livelihood → **fundamental** for household (income source).  
    - ⚖️ **Decision**: Both fundamental → proceed to Step 6 (vote on values).  

  - **Step 6: Committee vote on values**  
    - Vote: Majority must weigh community health vs. household livelihood.  
    - Unpopular Outcome: Committee votes 4–3 to disallow, prioritizing health.  

  **Outcome**: Daycare disallowed. **Why unpleasant**: Household loses income, committee faces backlash.  
  **Liberty Tax**: If proposed, harm is health-related → **inadmissible**.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve value conflicts without voting**:  
     - Step 6 (vote) is needed when both harm and activity are fundamental/neither (e.g., Case 3). Roughly 10–20% of disputes may end here.  
     - This retains "crude arithmetic" but limits it to edge cases after objective tests.  

  2. **Handle ambiguous evidence**:  
     - If harm or fundamentality lacks evidence (e.g., "fear" without diagnosis), the procedure defaults to favoring personal domain (Step 2 or 3). Some may view this as unfair.  

  3. **Eliminate all subjectivity**:  
     - Steps 3 (indirect harm) and 5 (fundamentality) require judgment, but they are structured to minimize discretion.  

  4. **Address non-compliance**:  
     - If households ignore rulings (e.g., refuse to rehome a dog), enforcement falls outside this procedure.  

  ---

  ### **Confidence Assessment**  
  - **High Confidence (Steps 1, 2, 4, Liberty Tax)**:  
