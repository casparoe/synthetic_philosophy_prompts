prompt: |-
  I sit on my hospital's neuroethics committee and we vote Thursday on a protocol I can't get a clean grip on. A neurology group here wants a first-in-human trial for patients with a fast, fatal neurodegenerative disease: as regions of the brain die off, they replace the lost tissue with a prosthetic that does the same input-output job, one small chunk per surgery, spaced over roughly three years, until by the end most of the relevant circuitry is prosthetic rather than biological. The patients are terminal and have signed on.

  What I have to write up is the consent design. Before every surgery the patient has to pass what the team calls a continuity interview -- life story, recognition of family, their own stated values, and a yes to "do you still feel like the same person" -- and only then can they re-consent to the next stage; if they fail it, everything stops. Their fallback is a directive the patients sign at the outset, saying that if they stop being themselves the team should finish the procedure anyway, since whoever comes out the other side has their memories and their unfinished business. Half the committee thinks that's humane, half thinks its a machine writing its own permission slip, because the thing we're supposed to be testing is the thing doing the testing.

  Draft the short opinion I'll circulate before the vote: approve, reject, or approve with conditions, with a bottom line we can act on, and if it's conditions then the one or two changes that would flip you to a yes, with a deadline we could actually put in the letter. Don't just hand me the standard line that identity isn't what really matters -- I've taught that seminar and it doesn't tell me whether this consent structure is valid. I want your verdict, the strongest case for the side you rule against, what would move you off your position, and where your reasoning is most likely to break down.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on a neuroethics committee voting on a first-in-human trial for a neurodegenerative disease. The procedure involves replacing brain tissue with prosthetics over three years. The consent design includes a continuity interview before each surgery and a fallback directive if the patient fails the interview. The committee is split, and the user needs a draft opinion before the vote.

  First, I need to understand the core ethical dilemma. The main issue is whether the consent structure is valid, especially when the prosthetic itself might influence the patient's ability to consent. The continuity interview assesses identity, but if the prosthetic alters cognition, it could invalidate the test. The directive to proceed even if they "stop being themselves" raises questions about who is consenting—original person or a new entity.

  The user mentioned they've taught that identity isn't what matters, but here the procedure directly ties consent to identity. So, the standard arguments might not apply. They need a practical decision: approve, reject, or approve with conditions. Conditions must be actionable with a deadline.

  Next, considering the stakeholders. Patients are terminal, seeking hope, but the experimental nature means high risk. The fallback directive is controversial. Half the committee sees it as humane, honoring the patient's initial wishes. The other half sees it as the machine self-validating. The key is ensuring informed consent isn't compromised by the procedure itself.

  Possible conditions: strengthen the directive's safeguards. Require specificity in what constitutes "stopping being themselves." Include a third-party advocate. Add a time-delay for the directive to allow reassessment. Also, post-procedure monitoring for identity disruption, but that's retrospective and doesn't prevent issues during consent.

  Deadline feasibility: The vote is Thursday, so conditions need to be implementable quickly, like revising consent documents by a set date. Requiring changes before the first surgery is practical.

  The user's deeper needs: They want a decisive opinion that addresses the ethical tension without theoretical jargon. They need actionable steps that can sway the divided committee. Highlighting the strongest counterarguments shows thoroughness, making the recommendation credible. Also, acknowledging where the reasoning might break down adds transparency, which is crucial for committee trust.

  Risk of conditions: If the team can't meet them, rejection is necessary. The fallback directive's vagueness is a big concern. Without clear metrics, it's too subjective. The patient's evolving identity versus the prosthetic's influence is a gray area. Ensuring the directive is explicit and involves an independent advocate could mitigate some risks.

  Conclusion: Approve with specific, tight conditions. This balances patient autonomy with ethical safeguards. The deadline for revised documents ensures accountability. If conditions aren't met, rejection protects against invalid consent. The strongest counterargument is that the conditions might not fully address the inherent paradox, but it's the best feasible approach.
answer: |-
  Here’s a draft opinion designed for clarity, decisiveness, and actionable recommendations, acknowledging the core paradox:

  **TO:** Neuroethics Committee  
  **FROM:** [Your Name]  
  **DATE:** [Date Before Vote]  
  **SUBJECT:** Recommendation on Protocol [Protocol Number] - Consent Structure & Fallback Directive  

  **BOTTOM-LINE RECOMMENDATION:** **APPROVE WITH CONDITIONS.** Conditional approval is contingent on specific, binding modifications to the fallback directive and consent process, with revisions submitted to the Committee Chair by **5 PM, [Date 7 Days After Vote]**. Failure to meet these conditions by the deadline necessitates rejection.  

  **VERDICT & CORE REASONING:**  
  The core consent structure—sequential re-consent predicated on the "continuity interview"—is ethically *necessary* but *insufficient* as proposed. While the interview process provides a crucial safeguard for respecting the evolving agent *during* the procedure, the **fallback directive ("finish anyway") creates an unacceptable ethical rupture**. It attempts to bind a potentially *different* future agent (whose identity and values may be fundamentally altered by the prosthetic integration *itself*) to the original patient’s prior wishes, using the very cognitive architecture whose impact on identity/continuity is the experiment's unknown variable. This is not merely about "identity" philosophically, but about the *validity of consent* for a future state potentially created *by* the intervention. Consent requires a minimally coherent agent capable of understanding and endorsing the action *at the time it occurs*. The directive bypasses this principle.

  **STRONGEST CASE FOR THE OPPOSITE SIDE (APPROVE AS-IS):**  
  The counter-argument is compellingly humane: Terminal patients facing total cognitive annihilation have rationally chosen this experimental path *as their last hope*. Denying them the ability to pre-authorize completion based on their current, lucid judgment—especially when the alternative is guaranteed, horrific decline—imposes paternalistic constraints on their autonomy at the end of life. They understand the profound uncertainty ("whoever comes out") but value the *continuity of their project* (memories, unfinished business) over strict metaphysical continuity of self. Forcing stoppage upon "failure" might abandon a being *they* would want to see completed, violating their deeply held final wish. This respects the patient’s current assessment of what matters most.

  **WHAT WOULD MOVE ME TO UNCONDITIONAL APPROVAL:**  
  Only if the fallback directive were removed entirely, requiring cessation if continuity is lost *at any point*. However, recognizing the patient autonomy argument above, this feels unduly rigid. **Conditions offer a viable path.**

  **CONDITIONS TO FLIP TO YES:**  
  1.  **Revise the Fallback Directive:** It must **explicitly require independent verification** *before* activation. Replace "if they stop being themselves" with a concrete, multi-faceted assessment by **an independent neuropsychiatrist/ethicist (unaffiliated with the trial team)**, using pre-defined, documented criteria (beyond the team's interview) focused on *capacity for informed consent regarding the* ***next*** *procedure*, not metaphysical identity. The directive should state: *"If, based on independent assessment against protocol-defined capacity criteria [Reference Appendix], I am deemed incapable of providing valid informed consent for the next surgical stage, and this incapacity is judged likely irreversible within the treatment window, THEN complete the procedure."*
  2.  **Strengthen Initial Consent:** The initial consent process must include a **mandatory, structured consultation with an independent patient advocate/ethicist** specifically focused on the implications and risks of the fallback directive. This consultation must be documented and include exploration of the patient's understanding of the "whoever comes out" scenario and their rationale for the directive.

  **DEADLINE:** Revised consent documents (including the new directive language and description of the independent verification process & advocate consultation) must be submitted to the Committee Chair by **5 PM, [Date 7 Days After Vote]**. *Approval is void if revisions are unsatisfactory or late.*

  **WHERE MY REASONING IS MOST VULNERABLE:**  
  1.  **The Independence Gambit:** Can *any* "independent" assessment truly be objective when the phenomenon being assessed (prosthetic-altered cognition/identity) is unprecedented? The criteria might be gamed or remain fundamentally inadequate to detect the specific alterations caused by the prosthesis. We might just be adding layers to the same paradox.
  2.  **Patient Autonomy vs. Future Agent:** Does prioritizing the dying patient's current autonomous wish (to complete) truly justify potentially overriding the interests/rights of a future, distinct agent inhabiting their body and memories? The conditions mitigate but don't resolve this tension. If the future agent *is* fundamentally different, is completing the procedure *on them* ethical, even if the original patient authorized it? This remains philosophically and ethically raw.

  **CONCLUSION:**  
  The aspiration of the trial is profound. The sequential consent is sound. The fallback directive, as proposed, is not. **Conditional approval** leverages patient autonomy while imposing critical safeguards against the directive becoming an unethical self-validating loop. The required changes are feasible within the deadline. Without them, the consent structure lacks validity for the final, most critical stages of the experiment. I urge the committee to support approval **only** if these conditions are met.  

  Respectfully,  
  [Your Name]
