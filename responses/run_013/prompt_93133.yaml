prompt: |-
  I'm redoing my grad seminar notes on probabilistic updating and I keep getting stuck on the Judy Benjamin case, so I want you to help me sort out the options. Here's the setup as I put it on the board. Judy gets dropped into a region that's divided two ways at once: Red Army territory vs Blue Army territory, and (cross-cutting that) the Second Company area vs the Headquarters area. Four quadrants, and she starts with 1/4 on each. Then the radio crackles: she can't be sure, but she's probably in Red territory, and if she's in Red then the odds are 3 to 1 that she's in the Second Company part. So what she's actually learned is a conditional — given Red, Second Company is 3/4 likely. She hasn't learned that she's in Red, and she hasn't learned anything outright about Blue.

  The textbook move is to treat that as a constraint and pick the posterior that satisfies it while staying as close as possible to her prior — minimum relative entropy, that whole family of rules. And you get the result that makes everyone squirm: her credence that she's not in Red territory goes up, past 1/2. Learning something about the internal composition of Red territory makes her more confident she isn't in Red territory at all.

  Here's what I need from you. Rank the candidate policies for handling conditional inputs like this one, by how much you'd actually trust them, and give me the result as a tier list (S/A/B/C/D/F is fine, or 0–10 trust scores if you'd rather) with a sentence or two on why each lands where it does. The candidates I've got on the handout so far:

  1. Minimum relative entropy / max-entropy style constraint satisfaction: keep the constraint, otherwise stay as close to the prior as you can in the KL sense.
  2. Same family, different metric: squared Euclidean distance, Jeffreys, reverse KL, whatever — the thought being that the choice of divergence is the real problem.
  3. A local-fix rule: hold her credence that she's in Red fixed at 1/2 and only move probability around inside Red, so conditional inputs tell you about the composition of the antecedent region and nothing else.
  4. Treat the message as though she'd learned the material conditional Red-implies-Second-Company, i.e. just rule out the Red-and-not-Second-Company quadrant.
  5. Refuse the update: call the input ill-formed, since it's neither an unconditional fact nor a shift on a partition, and say you can't get there from here without more detail.
  6. Add one of your own if I've missed a live option.

  I want the ranking to be responsive to a few variants, so please say how each policy fares on these:

  - Two messages in sequence. First the 3-to-1 message about Red, then a second one: if she's in Blue, the odds are 2 to 1 against her being in the Second Company part. Does applying the policy twice in a row give the same posterior as applying it once to both constraints together? If not, is that a fatal defect or a harmless artifact of how the policy is stated?
  - A degenerate antecedent. The message says: if she's in the Purple territory, the odds are 3 to 1 for Second Company — and she assigns zero credence to Purple. Intuitively this carries no information whatsoever. Does the policy respect that, or does it do something weird?
  - A conditional inside a conditional. The message says: if she's in Red, there's a 1/2 chance that the odds for Second Company given Red are 3 to 1, and otherwise they're 1 to 1. So what she learns is itself conditional. Does the policy have anything sensible to say, or does it just silently presuppose that all evidence arrives as a constraint on a credence function?
  - A disjunctive conditional input. The message says: either the odds for Second Company given Red are 3 to 1, or they're 1 to 3 — the source can't tell which. She knows only that one of the two conditional constraints holds. Is the answer determinate under the policy, or does the policy just not apply?

  Two verdicts I need you to commit to, no hedging. First: is the probably-in-Blue consequence of the minimum-relative-entropy approach a bug or a feature? Defend it. Second: if you had to teach exactly one of these as the default for conditional inputs in a first-year grad seminar, which one, and what's the one-sentence justification you'd give the students?
