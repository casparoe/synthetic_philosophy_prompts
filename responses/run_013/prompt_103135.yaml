  **Why this works:** It acknowledges Germany's pivotal role without demanding sole "blame," respects the complexity highlighted by the systemic view, bypasses the conceptual deadlock over collective agency by focusing on *mechanisms* and *processes*, and abandons the restrictive test for a more historically appropriate framework. It allows you to agree that German leadership made crucial, risky, escalatory choices *within* a dangerous system they helped create, without getting stuck on whether "Germany" is an "agent." Progress lies in understanding the *how*, not just the *who*.
