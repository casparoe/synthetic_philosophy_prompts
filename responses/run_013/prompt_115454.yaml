  The story needs two characters: a poker player who's free from craving and his staker who's full of it. Setting is a grubby card room, present day. Told from the staker's POV. Key elements: show the difference between preference and craving through actions, have the player lose something significant (like a marriage) without it affecting his wellbeing, include a direct statement that grieving makes you worse off, maintain ambiguity about whether the player is free or hollow, no conversions, and end unresolved on a small physical detail.

