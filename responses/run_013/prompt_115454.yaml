  ## The Still Point

  Vince watched Leo’s hands. They were the only things that moved, smooth and economical, riffling chips, sliding cards. No tremor, no nervous tap, no white-knuckled grip on the edge of the worn green felt. Just… motion. Like water finding its level. It drove Vince quietly insane.

  The air in the back room of "The Lucky Ace" was thick with smoke and desperation. The low hum of conversation, the clink of glasses, the visceral *thwack* of cards hitting felt – it was Vince’s oxygen. The scent of stale beer, cheap cologne, and anxious sweat was the perfume of his life. His life ran on want. He wanted the pot in the center of the table. He wanted the respect of the other stakers leaning against the wall. He wanted the sharp-eyed dealer, Carla, to glance his way again. He wanted Leo to *want* something, *anything*, besides the mechanical execution of perfect, detached poker.

  Leo won. Again. A modest pot, built patiently on a pair of nines that became a full house. He didn’t smile. He didn’t exhale in relief. He just gathered the chips towards his already formidable stack with the same quiet efficiency he used to fold napkins. Vince felt the familiar, gnawing itch beneath his ribs. Leo’s success was *his* success financially, but it tasted like ash. How could you play like a machine and win? Where was the hunger, the drive, the glorious, sweaty *fight*?

  "You want a drink, Leo?" Vince rasped, pushing off the wall. "Whiskey? Water? Hell, champagne?" *Crave it. Want it. Show me you’re still in there.*

  Leo looked up. His eyes were calm, grey pools reflecting the cheap overhead lights without depth. "Water would be fine. Thank you, Vince." No preference stated, just acceptance. Vince remembered a time, years ago, when Leo would have asked for a specific brand of bourbon, neat, with a particular intensity. That Leo was gone. Vanished about the same time Sarah did.

  Vince fetched a bottle of mineral water, the expensive kind he bought specifically to tempt Leo into showing a flicker of discernment. He placed it beside Leo’s elbow. Leo didn’t touch it. He ate a single pretzel from the bowl the runner brought around – just one, chewed methodically, then returned his focus to the cards. Vince watched. Was that preference? Choosing a pretzel? Or just… fuel intake? The distinction was maddening.

  The game ground on. Leo folded marginal hands without a flicker of disappointment. He called large bets with stone-cold bluffs, his face a serene mask. He scooped pots without a trace of triumph. Vince paced the narrow strip behind him, a caged animal radiating the craving Leo lacked. He thought about Sarah. Leo’s ex-wife. Vibrant, fierce Sarah, who’d loved Leo with a ferocity that scared Vince. She’d walked out five years ago. Said living with Leo was like living with a beautifully carved ice sculpture. Said his calm wasn’t peace, it was absence.

  Vince had seen Leo the day after she left. He’d expected devastation, rage, the raw, ugly craving of loss. He’d brought whiskey, ready to commiserate, to feed the beast of grief. Leo had been… Leo. Calm. Methodical. Sorting poker chips. "It’s unfortunate," he’d said, his voice level. "But these things happen."

  *Unfortunate.* Like stubbing a toe. Not like losing the sun.

  Another hand. A big one. Leo was heads-up against Doyle, a bear of a man whose face was perpetually flushed with the effort of containing his own volcanic desires. The pot was mountainous. Vince’s palms were slick. His heart hammered against his ribs, a frantic drumbeat of vicarious craving. *Win, Leo. Crush him. Take it all!*

  Leo raised. Doyle shoved all-in, a roar escaping him. The room held its breath. Vince leaned forward, trembling. This was it. The crucible. Surely, even Leo would feel *this*?

  Leo studied Doyle. Studied the board. Studied his own cards. It wasn’t calculation Vince saw; it was… assessment. Like checking the weather. Finally, he nodded, almost imperceptibly. "Call."

  Cards flipped. Leo had the nuts. The straight flush he’d coolly built. Doyle groaned, a sound of pure animal anguish, and slammed his fist on the table. Chips rattled.

  Leo began stacking his winnings. His movements were identical to stacking his original buy-in chips. No faster, no slower. No gleam in the eye, no tension released in the shoulders. He just… stacked.

  Vince couldn’t stand it. He leaned down, his voice a harsh whisper near Leo’s ear, smelling the faint scent of soap and nothing else. "Sarah called me last week."

  Leo’s hands didn’t pause. He didn’t look up. "Oh?"

  "Yeah. From Portland. Got married again. Two kids now. Pictures." Vince injected venom, searching for a crack. "She looked… happy. Really happy."

  Leo placed another chip neatly on the stack. "I’m glad for her. Stability is beneficial."

  "*Glad*?" Vince hissed. "That’s it? Five years, Leo. Five years she poured into you. And you’re just… *glad*?" He needed the wound to bleed. He needed to see *pain*.

  Leo finally turned his head, just slightly. His grey eyes met Vince’s, clear and undisturbed. "Vince," he said, his voice low and even, devoid of reproach or heat, "holding onto grief is like drinking poison. It doesn’t change what happened. It only makes the person who grieves… worse off. Much worse off." He held Vince’s gaze for a second longer, then returned to stacking chips. "She’s moved on. I have moved on. There’s no cost."

  *No cost.* The words hung in the smoky air. Vince felt a chill that had nothing to do with the room’s air conditioning. Here it was, stated plain as day, no philosopher’s hedging, just cold, transactional truth: Love was a liability. Grief was weakness. Sarah’s absence meant nothing because Leo didn’t *crave* her presence. Vince thought of his own chaotic loves, his messy divorces, the constant ache for connection, the gnawing fear of being alone. Leo saw that ache, that fear, as damage. As making Vince *worse off*.

  And looking at Leo’s serene, untouched face, stacking chips worth more than Vince made in six months, Vince couldn’t refute the logic. Not logically. But in his gut? It felt like looking at a ghost. Or a shell.

  Was this freedom? This utter stillness? Or was it a kind of death? Leo wasn’t hollow like a broken thing; he was hollow like a perfectly tuned instrument with no music left to play. Vince searched Leo’s profile – the clean line of jaw, the calm brow – for any sign of the passionate, sometimes reckless player he’d staked a decade ago. The man who’d laughed too loud, loved too hard, *wanted* with a fierceness that sometimes burned him. Where had that fire gone? Extinguished? Or… excised?

  The game wound down. Leo cashed out, his winnings a thick stack of bills Vince carefully counted and secured. They walked out into the pre-dawn chill of the city. The streets were quiet, slick with recent rain, reflecting the sodium glare of streetlights. Vince felt jangled, raw-nerved, the residue of his own constant wanting buzzing under his skin. Leo walked beside him, silent, his breathing even, his gaze resting on the wet pavement ahead with the same detached observation he gave the poker table.

  They stopped at Vince’s battered sedan. Vince fumbled with the keys, his fingers clumsy with exhaustion and the residue of unspent adrenaline. He glanced at Leo, standing patiently under a flickering streetlight. The calm was absolute. Impenetrable.

  Vince remembered Sarah’s face in the photo she’d sent – laughing, holding a toddler, alive in a way Leo hadn’t been for years. He remembered Doyle’s roar of loss at the table. He remembered the gnawing ache in his own chest, the constant companion of his wanting life.

  "Good game, Leo," Vince said, the words tasting flat.

  Leo nodded. "Efficient," he replied. Not good. Not satisfying. Efficient. Like a well-oiled machine completing a task.

  Vince got into the car, the worn upholstery creaking under him. He started the engine, the rumble loud in the quiet street. Leo stood waiting for Vince to drive away first, a small courtesy devoid of warmth. Vince looked at him through the rain-beaded windshield. Leo’s face was pale in the streetlight, his expression serene, untouched by the night’s tension, the money in Vince’s pocket, or the ghost of the woman who’d once loved him.

  Vince put the car in gear. He didn’t know if he was looking at a man who had found the ultimate peace, liberated from the prison of want, or a man who had simply… turned himself off. The engine idled roughly. Leo remained still, a statue in the damp city dawn, watching the raindrops trace erratic paths down the passenger window. Vince lifted his foot off the brake. The car lurched forward. In the rearview mirror, Leo became a diminishing figure of perfect, unsettling calm, until the rain and the turning corner swallowed him whole. Vince drove on, the familiar, restless craving settling back into his bones like an old, uncomfortable coat. The silence in the car was loud.
