answer: |-
  **Joke:**  
  *A donut's center of mass floats quietly in its hole, content to be empty. The self is like that hole, except it keeps screaming, "I AM A DONUT!"*  
  *— One abstraction just works. The other works overtime.*

  **Why it fits:**  
  - **Asymmetry Highlighted:** The center of mass (CoM) is silent and functional without assertion (like the donut's void), while the self is a "void" that *insists* on substance ("I AM A DONUT!").  
  - **Dennett Nod:** "Center of narrative gravity" mirrors the donut's CoM — both are abstract, useful fictions. But the self’s compulsive storytelling (the scream) is the twist.  
  - **No Citations Needed:** The donut’s empty CoM is intuitive physics. The punchline juxtaposes it with the self’s noisy self-delusion.  
  - **The Tag:** Clarifies the core joke: CoM "just works" passively; the self "works overtime" fabricating itself.  

  **Bonus one-liner if preferred:**  
  *"Centers of mass never interrupt meetings to clarify they exist."*
