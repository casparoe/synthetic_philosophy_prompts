  The user clearly needs a framework that can handle real-world complexities: imperfect information, shifting contexts, unreliable communication, and unverifiable actions. Their frustration with academic literature is palpable—they want something practical for their narrative, not jargon. The four custom scenarios they invented are brilliant stress tests, exposing gaps in standard models. 

  Hmm, their core ask is a "spec"—desiderata for any credible cooperation theory. But deeper, they need their biologist character to sound authentic when discussing these ideas. That means the theory must withstand scrutiny within the novel's logic. The shifting border metaphor is key here—it's not just physical terrain changing, but the rules of engagement between the characters. That instability is central to their dynamic.

  Breaking this down: First, the theory must explain how cooperation emerges AND persists—many models conflate these. Second, it must handle ambiguity (scenario 4: unverifiable costs/benefits) and misinformation (scenario 2: faulty third-party reports). Crucially, it can't assume rational actors with perfect knowledge (scenario 3: misjudged payoffs). 

  The trickiest is scenario 1—repeated interaction where players can hide their moves. Standard reciprocity models collapse if actions aren't observable. Yet somehow, their characters sustain cooperation despite this opacity. Existing theories would say this shouldn't work... but humans do this constantly. That gap is where their novel lives. 

  I should flag the tension between plasticity (adapting to changing games) and stability (maintaining cooperation through shifts). Also, prosocial preferences feel necessary but can't be a deus ex machina—the user hates that. The "no reading list" demand is telling: they want distilled insights, not academic homework. 

  For the biologist character's credibility, the theory must acknowledge limits—where uncertainty breaks cooperation versus where it paradoxically sustains it. That nuance is gold for their "almost trusting" dynamic. Finally, the resolution of conflicting desiderata should feel earned, not pat. Their characters navigate gray areas; the theory should too.
answer: |-
  Here's the spec for a credible theory of cooperation, built from the ground up to handle your novel's complexities. I'll lay out the non-negotiables, the house preferences, critical distinctions, findings it must respect, and how it handles your four scenarios. Finally, I'll point out the key tension and the rulebreaker.

  **The Desiderata: What a Theory of Cooperation MUST Do (Non-Negotiables)**

  1.  **Explain Emergence AND Stability:** *Why it's on the list:* Theories often focus on one (e.g., kin selection explains emergence in related groups, reciprocity explains stability in repeated interactions). A theory must account for how a *novel* cooperative behavior *first arises* (even if rare) in a population/system *and* how it *persists* once present against competing strategies. *Case:* Your biologist character needs to discuss how the initial fragile trust formed *and* how it endured decades of shifting borders and temptations.
  2.  **Handle Strategic Uncertainty & Ambiguity:** *Why it's on the list:* Real actors rarely know the true game, exact payoffs, or others' actions/intentions perfectly. *Case:* Your scenarios #2 (unreliable gossip), #3 (misperceived game), and #4 (unverifiable help) scream this. A theory assuming perfect information is useless here.
  3.  **Acknowledge Contextual Plasticity:** *Why it's on the list:* The "game" isn't static. Payoffs, available actions, and interaction structures change (shifting border, changing laws, aging individuals). Cooperation must adapt or break. *Case:* Scenario #3 explicitly demands this. A theory treating the game as fixed is unrealistic.
  4.  **Accommodate Diverse Motivations Without Collapsing Them:** *Why it's on the list:* Cooperation can stem from calculated self-interest ("I scratch your back, you scratch mine"), genuine other-regarding preferences ("I care about your welfare"), or constrained choices ("I have no better option"). A theory must allow for this spectrum without reducing one to the other *as its core mechanism*. *Case:* Your characters' relationship likely blends calculation ("he *might* retaliate") and something warmer ("she *deserves* help this time"). The theory mustn't force a single motivation.
  5.  **Respect Core Evolutionary & Game Theoretic Findings:** *Why it's on the list:* It can't contradict well-established results that are context-dependent truths.
      *   *The Prisoner's Dilemma is hard:* Defection is the dominant strategy in a true, one-shot, anonymous PD. A theory can't magically make pure cooperation rational there without invoking other mechanisms (like prosociality).
      *   *Reciprocity needs observability:* Tit-for-tat works because actions are seen. A theory can't claim reciprocity functions perfectly when actions are hidden.
      *   *Kin selection requires relatedness:* Helping close relatives spreads shared genes. A theory can't explain bee sterility without relatedness.
      *   *Group selection requires structure:* Benefits to groups must outweigh costs *and* group structure must limit free-riding for group-level traits to evolve. A theory can't invoke "for the good of the group" as a simple explanation.

  **Important Distinctions the Theory Must Maintain**

  *   **Altruism vs. Mutualism:** Altruism = behavior costly to self, beneficial to other. Mutualism = behavior beneficial to both. A theory must distinguish the *initial cost/benefit structure* driving the behavior's emergence. Explaining altruism is harder.
  *   **Emergence vs. Stability:** See Desideratum #1. How something starts isn't always why it lasts.
  *   **One-shot vs. Repeated vs. Structured Interactions:** The possibility of future encounters (direct or indirect) fundamentally changes the strategic landscape. A theory must specify the interaction context it addresses.
  *   **Direct Reciprocity vs. Indirect Reciprocity:** Direct = "I help you, you help me." Indirect = "I help you, *someone else* helps me because they saw/know I helped you." The mechanisms differ significantly, especially concerning observability and reputation.
  *   **Cost/Benefit Structure:** The theory must be clear about what constitutes a "cost" and "benefit" in the specific context (energy, time, risk, money, reproductive success, social standing?).

  **House Preferences (Where Camps Differ, Not Dealbreakers)**

  6.  **The Role of Prosocial Preferences:** *Why it's a house preference:* Some theories see other-regarding preferences (empathy, fairness, "warm glow") as essential building blocks. Others see them as evolutionary *products* of successful strategies driven initially by self-interest. Your theory needs to *address* them but can lean either way.
  7.  **Level of Selection:** *Why it's a house preference:* Does cooperation primarily evolve via individual benefits, kin benefits, or group benefits in structured populations? Strong camps exist. A good theory should be compatible with multiple levels playing a role in different contexts.
  8.  **Complexity vs. Parsimony:** *Why it's a house preference:* Should the theory invoke the minimal necessary mechanisms (e.g., reciprocity + discounting) or embrace cognitive complexity (e.g., theory of mind, empathy, cultural norms)? Your biologist character might favor biological parsimony initially.

  **How Your Scenarios Test the Desiderata**

  1.  **Pay to Hide Moves:** *Theoretical Challenge:* Direct reciprocity is crippled (Desideratum #5 - Reciprocity needs observability). Reputation is impossible. *What a theory must say:* The repetition *might* still matter if players have intrinsic motivations (Desideratum #4) or develop norms/identity ("We are people who cooperate, even when unseen, because that's who we are" - linking to Stability/Plasticity). It highlights the limits of pure strategic reciprocity and pushes towards prosociality or internalized rules. *Survival:* Requires Desiderata #2 (uncertainty), #4 (diverse motivations), potentially #6 (prosociality).
  2.  **Unreliable Gossiper:** *Theoretical Challenge:* Indirect reciprocity relies on *reliable* reputation transmission. *What a theory must say:* Reputation is now a noisy signal. Cooperation requires either extreme tolerance for error (unlikely), mechanisms to detect/devalue unreliable gossipers (complex), or a fallback to direct experience and other motivations (Desiderata #2, #4). Trust becomes fragile and context-dependent. *Survival:* Crucially tests Desideratum #2 (Strategic Uncertainty). Requires the theory to handle flawed information channels.
  3.  **Misperceived Game:** *Theoretical Challenge:* Players are building strategies based on an outdated or incorrect model of reality. *What a theory must say:* Cooperation dynamics depend on *perceived* payoffs, not objective ones. Stability requires learning/adaptation mechanisms (Desiderata #3 - Plasticity). A player defecting based on an old PD model might be seen as untrustworthy, not strategically rational. Explains how cooperation can break down even if the objective game improved. *Survival:* Directly demands Desideratum #3 (Contextual Plasticity) and #2 (Uncertainty). Highlights that players infer the game.
  4.  **Unverifiable Help:** *Theoretical Challenge:* The core currency of reciprocity (cost incurred, benefit received) is obscured. *What a theory must say:* Standard reciprocity struggles. Cooperation hinges heavily on **trust** and **signaling**. The helper must signal commitment/cost *somehow* (even imperfectly: effort, emotional display, reputation for honesty). The receiver must interpret these signals charitably (Desiderata #4 - diverse motivations, potentially prosociality). Highlights the role of communication and interpretation beyond simple accounting. *Survival:* Severely tests Desideratum #2 (Uncertainty, Ambiguity) and pushes hard on #4 (Motivations - trust, signaling).

  **The Tension and The Rulebreaker**

  *   **The Key Tension:** **Desideratum #2 (Handle Strategic Uncertainty & Ambiguity)** vs. **Desideratum #5 (Respect Core Findings - particularly "Reciprocity needs observability" and the "PD is hard")**.
      *   *Why they pull:* Pure reciprocity (a core mechanism under #5) fundamentally relies on observable actions and clear payoffs to function. Desideratum #2 demands the theory work when these are *absent* or *murky*. Reconciling this requires moving beyond simple reciprocity models into areas like trust, signaling, norms, prosocial preferences, or complex learning models – mechanisms that are often less rigorously defined or harder to model mathematically than clean reciprocity. Your scenarios 1, 2, and 4 directly exploit this tension.

  *   **The Rulebreaker Requirement:** **Desideratum #2 (Handle Strategic Uncertainty & Ambiguity)** does the most to rule out popular accounts.
      *   *Why:* Kin selection ignores it (focuses on relatedness, not uncertainty). Simple direct reciprocity (Tit-for-Tat) collapses without observability (Scenario 1). Indirect reciprocity collapses with unreliable gossip (Scenario 2). Group selection often assumes clear group boundaries and payoffs. Basic game theory assumes known payoffs (failing Scenario 3). The most popular, clean models rely on clear information. Desideratum #2 forces the theory into the messy reality where your characters exist – a world of shifting borders, hidden motives, unreliable whispers, and unverifiable debts. Any theory that can't navigate that fog isn't worthy of your biologist or your novel.

  **The Takeaway for Your Biologist Character:**

  She shouldn't sound like she has *the* single, perfect theory. She should sound like someone grappling with the complexity. She might say: "The textbooks give you clean models – kin, reciprocity, maybe group selection. They work beautifully... in their boxes. Out here? The border moves, you can't see what the other did, whispers lie, and the rules change without notice. Cooperation here? It's built on layers. Maybe it started as cold calculation decades ago, but it's hardened into something else – habit, identity, a shared story we tell ourselves about who we are to each other on this shifting line. The cost might be real and unseen, the benefit hard to measure, and trusting that report from a known liar is madness... and yet, here we are. The clean models explain the foundation stones, but the building? That's built with messier stuff."

  This spec gives you the guardrails. Your characters provide the human truth within them. Good luck!
