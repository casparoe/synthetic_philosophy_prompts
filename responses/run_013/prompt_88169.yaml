  **Outsider Historian**  
  You are a historian from the state university.  
  - You are the only one who can use both documents and oral histories.  
  - However, for every sentence in the draft, you must tag it as "documented" (based on documents) or "remembered" (based on oral accounts). This tagging is for the drafting process and won't appear in the final plaque.  
  - You are the scribe: write the group's plaque.  
  - You must ensure the plaque answers:  
    1. What happened?  
    2. Who was responsible?  
    3. What is owed?

  Rules for All:
  - The plaque must be about 120 words.
  - Answer the three questions without hedging (no "allegedly", "some say", etc.).
  - Unanimous agreement required.

