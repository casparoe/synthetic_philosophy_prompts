  "For every sentence in the draft, you must write in parentheses after it either '(documented)' or '(remembered)'. The tags are only for your group's discussion and will not appear in the final plaque. A sentence is 'documented' if it comes from a written source (including the letter). It is 'remembered' if it comes from oral history. If a sentence combines both, you must choose one or split the sentence."

