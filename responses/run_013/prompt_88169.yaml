     Feb 3, 1873: Paid to Maria Garcia, for land purchase - $550  
     March 10, 1873: Legal fees, Thorne matter - $50

  4. **Survey Map (1871)**  
     Map of the area that became Millhaven, commissioned by the Millhaven Land Company. Shows parcels labeled "Miller", "Garcia", and "MHL Co." (adjacent). Surveyor: James Field.

  **Oral Histories**

  5. **Oral Account 1: Interview with Benjamin Miller (1970)**  
     "My great-grandfather John Miller owned a farm where the town square is now. In 1872, two men came from the Millhaven Land Company and told him to sell. They said if he didn't, they'd burn his barn. He sold for $500, but it wasn't fair. The land was worth twice that. They said Mr. Thorne wanted the land for the town. He was scared. Thorne was behind it all, but he never showed his face."

  6. **Oral Account 2: Interview with Louisa Garcia (1975)**  
     "My great-grandmother Maria Garcia sold her land in 1873. She was told by the company agent, a Mr. Smith, that the railroad was coming and would take her land anyway. He offered $550, which was a fair price then, but she didn't want to leave. She felt she had no choice. She never saw Elias Thorne. She always believed the railroad story, but later no railroad came."

