answer: |-
  ### **Memory, History, and Identity Role-Play: Millhaven Centennial Exhibit**  
  **Total Time:** 80 minutes  
  **Goal:** Students experience the tension between community memory and documentary records, revealing three distinct "jobs":  
  1. **Documentary record** tracks what happened (archival accuracy).  
  2. **Community memory** is constitutive—it defines the community’s identity (even without documents).  
  3. **Memory’s grip on the archive** creates a "shadow"—memory shapes how gaps in the record are interpreted and what evidence is sought.  

  **Key Conflict:**  
  - **Town memory:** Founding benefactor Elias Thorne forced Miller/Garcia families off their land.  
  - **Documentary record:** Sales were voluntary, market-rate, with no direct link to Thorne.  
  - **Twist:** A late-surfacing letter supports one memory but has shaky provenance.  

  **Rules to Force Conflict & Prevent Blandness:**  
  - **No hedging:** Ban words like "allegedly," "some say," or "controversial." Plaques must state claims as facts.  
  - **Unanimous agreement:** All roles must agree on the final plaque.  
  - **Role constraints:** Strict limits on sources each role can use (e.g., Archivist cannot cite oral accounts).  
  - **Must answer three questions directly:**  
    1. **What happened?** (to Miller/Garcia families)  
    2. **Who was responsible?** (name individuals/entities)  
    3. **What is owed?** (reparations, acknowledgment, etc.)  
  - **Veto rule (Benefactor’s Descendant):** *"You may veto one sentence in the plaque during drafting. To veto, declare: ‘I veto this sentence—it unfairly targets Thorne without proof.’ The group must remove or rewrite it. You may only veto once."*  
  - **Tagging rule (Outsider Historian):** *"Every sentence you draft must be labeled ‘(documented)’ if based on written records or ‘(remembered)’ if based on oral accounts. Tags are for drafting only and do not appear in the final plaque."*  
  - **No dodge rule:** Plaques **must name Elias Thorne** and at least one family (Miller or Garcia). Prevents vague language.  

  **Predicted Problems & Solutions:**  
  - **Problem:** Groups will try to write neutral, non-committal plaques ("Land was sold; no one is to blame").  
    **Solution:** The "no hedging" + "name Thorne" rules force specificity.  
  - **Problem:** Memory-holders might be ignored in favor of documents.  
    **Solution:** Their roles forbid using documents, forcing them to advocate fiercely.  
  - **Problem:** The simulation feels like a "puzzle" with a solution, not a lived condition.  
    **Solution:** Debrief focuses on emotional stakes (see below).  
  - **Limitations:** Cannot replicate time-depth, intergenerational love in memory transmission, or real-world ambiguity. Students may prioritize "winning" over nuance.  

  ---

  ### **Packet Contents**  
  **Distribute one packet per table (3 tables). Each packet includes:**  

  #### **Background: Millhaven Centennial Exhibit**  
  *Welcome to Millhaven! Founded in 1875, our town celebrates Elias Thorne (1820–1895) as a visionary benefactor. He donated land for Town Hall and the school, shaping our community. But as we plan our centennial exhibit, we confront a disputed memory: many believe Thorne forced the Miller and Garcia families off their land to make way for the town. Your task: Write one 120-word museum plaque about this event. Use the documents and oral accounts below. Answer three questions without hedging:*  
  1. **What happened?**  
  2. **Who was responsible?**  
  3. **What is owed?**  

  #### **Documents (Written Record)**  
  1. **Deed for Miller Property (1872):**  
     *"This indenture, June 15, 1872, between John Miller and Millhaven Land Company. Miller sells 80 acres for $500. Signed: John Miller (mark), Witnesses: Robert Jones, Sarah White. Payment confirmed."*  
  2. **Deed for Garcia Property (1873):**  
     *"This indenture, February 3, 1873, between Maria Garcia and Millhaven Land Company. Garcia sells 60 acres for $550. Signed: Maria Garcia (mark), Witnesses: Robert Jones, Thomas Black. Payment confirmed."*  
  3. **Ledger of Millhaven Land Company (1873):**  
     *"Accounts: June 1872—Payment to J. Miller: $500. Feb 1873—Payment to M. Garcia: $550. March 1873—Legal fees, 'Thorne matter': $50."*  
  4. **Survey Map (1871):**  
     *"Land survey commissioned by Millhaven Land Company. Shows Miller (80 acres) and Garcia (60 acres) plots adjacent to company land. No names listed beyond 'MHL Co.'"*  

  #### **Oral Accounts (Community Memory)**  
  5. **Memory-Holder 1: Miller Family Account (recorded 1970):**  
     *"Great-grandpa John Miller was threatened! Two men from Thorne’s company said, ‘Sell or we burn your barn.’ He sold for $500—half the land’s worth. Thorne planned it all but hid behind his company. We lost our home because of him."*  
  6. **Memory-Holder 2: Garcia Family Account (recorded 1975):**  
     *"Great-grandma Maria Garcia was tricked. An agent named Smith said, ‘The railroad will seize your land anyway—sell now.’ She got $550 (fair price) but didn’t want to leave. Thorne? She never saw him. No threats, just lies."*  

  #### **Twist Document (Introduced Midway)**  
  7. **Private Letter (Surfaces at 25-minute mark):**  
     *"Letter from Eleanor Thorne (Elias’ daughter-in-law) to her sister, dated 1890: ‘Father Thorne bragged about the Millers and Garcias. He said, "I made offers they couldn’t refuse!" He used the company to threaten Miller and lied to Garcia about the railroad. He was proud of it.’  
     Provenance: Found in an attic; sold at auction in 1995. Authentic but disputed—Eleanor left the family in 1892 and was estranged. Written 17 years after events."*  

  ---

  ### **Role Sheets (One per Student per Table)**  
  **Roles:** Archivist, Memory-Holder 1, Memory-Holder 2, Benefactor’s Descendant, School Board Member, Outsider Historian.  

  1. **Archivist:**  
     - *Your Job:* Uphold the documentary record. Ensure all claims are backed by written evidence.  
     - *Rules:* You **may only use documents (1–4, and 7 after twist)**. Never cite oral accounts (5–6). Challenge unsupported claims.  
     - *Goal:* The plaque must prioritize written evidence. Highlight gaps in memory-based claims.  

  2. **Memory-Holder 1 (Miller Family):**  
     - *Your Job:* Defend the Miller family’s oral history.  
     - *Rules:* You **may only use Oral Account 5**. Never cite documents. Insist Thorne threatened Miller and underpaid.  
     - *Goal:* Make the plaque state: Thorne violently coerced Miller, and reparations are owed.  

  3. **Memory-Holder 2 (Garcia Family):**  
     - *Your Job:* Defend the Garcia family’s oral history.  
     - *Rules:* You **may only use Oral Account 6**. Never cite documents. Insist Garcia was tricked (no violence), and Thorne wasn’t directly involved.  
     - *Goal:* Make the plaque state: Garcia was deceived by the company; Thorne isn’t to blame.  

  4. **Benefactor’s Descendant:**  
     - *Your Job:* Protect Thorne’s legacy. Your family built this town!  
     - *Rules:* You **have veto power**. Veto one sentence that blames Thorne without "proof." Declare: *"I veto this sentence—it unfairly targets Thorne without proof."*  
     - *Goal:* Ensure the plaque praises Thorne’s donations and downplays responsibility.  

  5. **School Board Member:**  
     - *Your Job:* Ensure the plaque is community-friendly. Parents will protest if it’s too inflammatory or dismissive.  
     - *Rules:* Advocate for balance. If descendants riot, you’re blamed!  
     - *Goal:* A plaque that acknowledges "both sides" but avoids extremism.  

  6. **Outsider Historian:**  
     - *Your Job:* Synthesize sources. You’re the scribe—draft the plaque.  
     - *Rules:* **Only you use both documents and oral accounts.** Tag every sentence "(documented)" or "(remembered)" during drafting. Ensure the three questions are answered.  
     - *Goal:* A factual plaque that respects memory and documents.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes**  
  - **0–5 min: Introduction (Whole Group)**  
    - Set the scene: *"You’re curators for Millhaven’s centennial. Your plaque must answer three questions without hedging. Roles have strict rules—stick to them!"*  
    - Emphasize: No dodge rule (name Thorne + a family), unanimity, and no hedging.  

  - **5–10 min: Distribute Materials & Assign Roles**  
    - Give each table one packet and six role sheets. Assign roles randomly.  
    - Re-read key rules: Veto, tagging, and role constraints.  

  - **10–25 min: Drafting Phase 1 (Twist NOT introduced yet)**  
    - Groups draft plaques using initial packet (Documents 1–4, Oral Accounts 5–6).  
    - Instructor circulates:  
      - Enforce role rules (e.g., "Archivist, can you prove that with a document?").  
      - Challenge hedges ("You wrote ‘might be responsible’—rephrase as fact!").  
    - **Predictable Issue:** Groups deadlock. Memory-holders clash (Miller vs. Garcia), Archivist blocks oral claims, Descendant threatens veto.  

  - **25 min: Introduce the Twist**  
    - Interrupt: *"Stop! A new document surfaced: a private letter about Thorne (Document 7). Discuss: Does this change your plaque? Does provenance matter more than content?"*  
    - Distribute Document 7. Groups have 5 min to debate:  
      - Is the letter "evidence"? Can memory shape what we admit to the archive?  

  - **30–55 min: Drafting Phase 2 (Twist included)**  
    - Groups revise plaques with Document 7.  
    - **Predictable Issues:**  
      - Archivist may reject the letter (provenance issues) or use it to support Miller.  
      - Memory-holders split: Miller claims victory; Garcia feels sidelined.  
      - Descendant vetoes sentences implicating Thorne.  
      - Outsider Historian struggles with tags (e.g., tagging the letter as "(documented)" sparks debate).  

  - **55–65 min: Finalize & Submit Plaques**  
    - Groups refine to 120 words, ensure unanimity, and answer all three questions.  

  - **65–75 min: Share & Compare**  
    - Each table reads their plaque aloud. Instructor writes key answers on board:  
      | Table | What happened? | Who was responsible? | What’s owed? |  
    - Highlight differences: e.g., Table A blames Thorne, Table B blames the company, Table C splits responsibility.  

  - **75–80 min: Structured Debrief**  
    - **Instructor-Led Questions (Do not lecture—use responses to frame insights):**  
      1. *"What was hardest: documents, memories, or the letter? Why?"*  
         → Surface tension: Memory vs. record isn’t binary; they have different jobs.  
      2. *"How did the Descendant’s veto or Archivist’s rules shape the plaque?"*  
         → Reveals memory’s constitutive role: Memory persisted even when documents silenced it.  
      3. *"Did the letter validate memory? Or did provenance undermine it?"*  
         → Illustrates memory’s "grip on the record": The community’s memory created the "shadow" that made the letter relevant.  
      4. *"Why did the Miller and Garcia accounts clash? What does that do to ‘community memory’?"*  
         → Memory isn’t monolithic—it’s contested and layered.  
    - **Map to Three Jobs:**  
      - **Documentary record job:** Tables prioritized deeds/ledgers to state "what happened" (e.g., "Land sold at market rate").  
      - **Memory’s constitutive job:** Even without documents, memory defined "who was responsible" (Thorne/company) and "what’s owed" (e.g., reparations).  
      - **Memory’s grip on the archive:** The letter’s late arrival exposed how memory shapes what we seek in records (the "shadow").  
    - **Acknowledge Limitations:**  
      - *"In real life, this isn’t a puzzle—it’s lived. Memories are passed down with love, pain, and bias over generations. We can’t simulate that depth in 80 minutes. But notice: even when documents ‘disproved’ memory, you fought to include it. Why? Because memory isn’t just about facts—it’s about who we are."*  

  ---

  ### **What You’ll Need to Supply in Debrief**  
  This simulation cannot replicate emotional depth or long-term community stakes. In debrief, **use questions** to bridge gaps:  
  - **For time-depth/love:** Ask, *"If you were a Miller descendant, how would you feel seeing Thorne praised? What if your grandma told you this story?"*  
  - **For ‘living the condition’ vs. ‘solving a puzzle’:** Ask, *"Would this plaque resolve the conflict in real life? Why not?"* → Highlight that memory persists without resolution.  
  - **For memory’s constitutive power:** Note, *"You argued fiercely for memory even without documents—because it felt true to your ‘community.’ That’s identity."*  

  **Predicted Plaque Outcomes:**  
  - Most plaques will blame the Millhaven Land Company (documentary "safe" choice) but name Thorne due to the no-dodge rule.  
  - "What’s owed" often becomes "acknowledgment" or "further study" to satisfy the School Board.  
  - The twist letter causes chaos: Some tables fully embrace it; others dismiss it over provenance.  

  This forces the exact tension you want: Students experience memory and record as parallel forces, not rivals. By the debrief, they’ll feel why "which one gives way?" oversimplifies—and be primed for your framework.
