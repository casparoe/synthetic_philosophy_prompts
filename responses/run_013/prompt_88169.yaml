  5-10: Distribute, assign roles, explain rules
  10-35: First drafting (25 min) - but at the 25-minute mark of class (15 min into drafting) introduce the twist. So at 25 min (class time), say: "Hold on, we have a new development" and hand out the letter. Then they have from 25-35 to consider it and adjust (10 min). Then:
