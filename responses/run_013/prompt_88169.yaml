  Packet Contents:

  **Documents for Millhaven Centennial Exhibit Planning**

  **Background**: The town of Millhaven was founded in 1875. Elias Thorne (1820-1895) is celebrated as a founding benefactor because he donated the land for the town hall and school. However, there is a community memory that Thorne was involved in driving out the previous landowners, the Miller and Garcia families, to acquire their land for the town site. The following documents are from the town archive.

