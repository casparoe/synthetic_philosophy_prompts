  4. Survey map of the area, dated 1871, commissioned by the Millhaven Land Company. It shows the Miller and Garcia properties, and adjacent land owned by the company. No names of individuals beyond the company.

  5. Oral Account 1 (for Memory-Holder 1): From an interview with a descendant of the Miller family, recorded in 1970: "My great-grandfather John Miller was forced to sell. Thorne's men came and threatened him. They said if he didn't sell, they'd burn his barn. He sold because he had no choice. The money was less than the land was worth. Thorne was behind it, but he used the company to hide."

  6. Oral Account 2 (for Memory-Holder 2): From an interview with a descendant of the Garcia family, recorded in 1975: "My great-grandmother Maria Garcia sold because she was told that the railroad would come through and take the land anyway. She was given a fair price, but she didn't want to leave. She only sold because she thought she had no choice. But she never saw Thorne. It was the company agent, Mr. Smith."

  Note: The two oral accounts differ on the role of Thorne (direct threat vs. no mention of Thorne) and the nature of the pressure (threat of violence vs. threat of eminent domain). Also, they disagree on the fairness of the price.

  Twist document (introduced midway):

  7. A letter dated 1890, from Eleanor Thorne (Elias Thorne's daughter-in-law) to her sister: "Father Thorne was ruthless in building this town. He told me once about the Millers and Garcias. He said, 'I made them an offer they couldn't refuse.' He laughed about how he used the company to buy the land cheaply. He said he had the agent threaten Miller with violence and told Garcia that the railroad would take her land. He was proud of it. I am writing this because I cannot bear the weight of this secret."

  Provenance note: The letter was acquired by the Millhaven Historical Society in 1995 at an auction. It was part of a collection of papers from the Thorne family that had been in private hands. The letter's authenticity is undisputed, but it was written 17 years after the events and by a family member who was estranged (Eleanor left the family in 1892 and moved away).

  Role Sheets (one per student at the table):

  1. Archivist:
     - You may only use the documents in the packet. You cannot refer to the oral accounts.
     - Your job is to ensure that every statement in the plaque that claims to be historical fact is supported by a document.
     - You can point to the ledger entry "Legal fees, Thorne matter" as evidence that Thorne was involved in some way, but you cannot connect it to the land sales without further evidence.

  2. Memory-Holder 1 (Miller family tradition):
     - You represent the Miller family's oral history. You can only use the oral account from the Miller descendant.
     - You must insist that John Miller was threatened and forced to sell at an unfair price, and that Elias Thorne was behind it.
     - You cannot refer to any documents.

  3. Memory-Holder 2 (Garcia family tradition):
     - You represent the Garcia family's oral history. You can only use the oral account from the Garcia descendant.
     - You must insist that Maria Garcia was misled (about the railroad) and felt she had no choice, but she did not experience direct threats and never saw Thorne. The price was fair, but the circumstances were coercive through deception.
     - You cannot refer to any documents.

  4. Benefactor's Descendant:
     - You are a descendant of Elias Thorne. You are proud of your family's role in founding the town and want to protect their reputation.
     - You have the power to veto one sentence in the plaque. You can do this at any time during the drafting. You must use your veto if a sentence unfairly tarnishes your ancestor without, in your view, sufficient evidence. You can only use the veto once.

  5. School Board Member:
     - You represent the town's school board. The plaque must be something you can defend to the public, especially if there are angry parents (some of whom might be descendants of the Millers or Garcias, or Thornes). You want the plaque to be historically accurate but also to promote community harmony. You cannot let the plaque be too inflammatory or too dismissive of community memory.

  6. Outsider Historian:
     - You are a historian from outside the town. You are the only one who can use both documents and oral accounts. However, for every sentence you write (or that the group agrees to), you must tag it as either "documented" (from the written record) or "remembered" (from the oral accounts). This tagging must be visible in the draft (but not on the final plaque). You are also the scribe and will write the plaque.

  Rules for the plaque:
  - Must be about 120 words.
  - Must answer three questions directly:
    1. What happened? (to the Miller and Garcia families)
    2. Who was responsible?
    3. What is owed? (if anything, to the families or the community)
  - No hedging: no words like "allegedly", "some say", etc. You must state things as facts.
  - Unanimous agreement required.

  What will predictably go wrong:
  - Groups may try to avoid assigning responsibility or stating what is owed, especially without hedging. We force them by the rules.
  - They might ignore the oral accounts and rely only on documents, but the memory-holders are constrained to push their accounts.
  - The contradiction between the two memory-holders may cause conflict and make it hard to state a single version.
  - The veto power might be used to block any negative statement about Thorne.

  To prevent a bland, non-committal plaque, we have the rule: "Must answer three questions without hedging". Also, the school board member and the descendant will likely push against strong language, but the memory-holders and historian must push for including the memory. The archivist might block some memory-based statements.

  The twist introduces a document that supports one memory (Miller's) but not the other (Garcia's). Now they have to decide: is this letter admissible? How does it change the balance?

  Debrief (10 minutes):

  Instructor asks:
  - What happened at your table? (Get quick reports)
  - How did you handle the conflict between the documents and the memories?
  - How did the new letter change things? Did you trust it? Why or why not?
  - How did you decide what to put in the plaque?

  Then, connect to the three functions:

  1. The documentary record: What did the documents alone tell us? (They showed voluntary sales but hinted at Thorne's involvement with the ledger entry.) The record is supposed to track what happened, but note: the letter, though a document, was initially absent from the archive.

  2. Community memory: How did the oral accounts function? They were constitutive of the community's identity (the Miller and Garcia families as victims, Thorne as a villain). But note: the memories were not uniform (they contradicted each other). Also, the memory of the event was preserved even without documents.

  3. The shadow of the archive: The community remembered what was left out (the coercion). The letter, even though it came later, was a document that confirmed one memory. But its provenance was questionable. The community's memory set the agenda for what evidence was sought (the letter was acquired because the historical society was aware of the oral tradition).

  Limitations to acknowledge:
  - This is a simulation; real memories are passed through generations with emotional weight and in the context of relationships.
  - The time depth is missing: these events are long past and the memory has been nurtured over time.
  - The students know it's a puzzle, but in reality, communities live with these tensions without resolution.

  Instructor must supply in debrief:
  - The emotional and relational aspect of memory: "In real life, these stories are told at family gatherings, with love and pain. The memory is part of how the community understands itself."
  - The idea that the archive is not static: the letter's appearance shows that the archive can grow, and that the community's memory can lead to the discovery of new documents.

  How to do this without lecturing: Use questions. "How did it feel to be a memory-holder? Did you feel your story was being dismissed? How might that feel in a real community?" "What does it mean that the community remembered the coercion even when the documents said otherwise?" "How did the appearance of the letter change the way you viewed the archive?"

  Finally, to avoid a bland plaque, we can add a rule: "The plaque must name Elias Thorne at least once." This forces the issue of responsibility. But let's see if the existing constraints are enough. Alternatively, we can require that the answer to "who was responsible" must name at least one person or entity. Since the documents show the Millhaven Land Company, that could be named. But the memory-holders want Thorne. So we leave it as is.

