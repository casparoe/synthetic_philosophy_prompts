  Now, we need to design the packet.

  Fictional town: Millhaven

  Conflict: Founding benefactor, Elias Thorne, donated land for the town hall and school. The town's memory holds that he was complicit in driving several families (the Millers and the Garcias) off their land. The documentary record (deeds, ledgers, map) shows the sales were voluntary and at market rate, and Thorne's name doesn't appear in the transactions.

  Documents in the packet:

  1. Deed for the Miller property, dated 1872, showing sale from John Miller to the Millhaven Land Company for $500. Signed by John Miller and witnessed by two people (names given). No mention of Thorne.

  2. Deed for the Garcia property, dated 1873, showing sale from Maria Garcia to the Millhaven Land Company for $550. Signed by Maria Garcia and witnessed.

