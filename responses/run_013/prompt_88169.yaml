  - Without the twist, groups might struggle because the documents don't show coercion and the oral accounts are contradictory and cannot be used by the archivist. The historian might be forced to have two "remembered" sentences that conflict, but the plaque must be unified. This forces them to choose or find a middle ground that isn't there.
