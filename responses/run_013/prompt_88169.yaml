  We are designing an 80-minute seminar activity with the following goals:
  1. Students experience the tension between community memory and documentary record.
  2. They see that these serve different functions: record tracks what happened, memory is constitutive of community, and memory also shapes how the record is interpreted (the shadow archive).
  3. They confront that community memory is not monolithic and that the archive itself can be contested.

  Structure:
  - 3 tables of 6 students each.
  - Each table has a packet with the same documents and role sheets.
  - They must write a 120-word museum plaque answering three questions without hedging: what happened, who was responsible, what's owed.
  - Roles at each table (6 roles per table, so one of each):
    1. Archivist: Can only assert what a document in the packet supports. Cannot cite oral accounts.
    2. Memory-Holder 1: Can only assert what their assigned oral account says. Cannot cite documents.
    3. Memory-Holder 2: Same as above, but with a different oral account that contradicts the first on a central fact.
    4. Benefactor's Descendant: Can veto one sentence in the plaque (once, at any time during drafting).
    5. School Board Member: Must ensure the plaque is defensible to angry parents (so it must not be too inflammatory or too dismissive of community memory).
    6. Outsider Historian: The only one who can use both sources, but every sentence they write must be tagged as "documented" or "remembered". They are also the scribe (or shares writing duties).

  Rules:
  - Unanimous agreement required.
  - No hedging: no "some say", "allegedly", etc. Must take a stand.
  - The three questions must be answered: what happened, who was responsible, what's owed.

  Twist (midway through):
    Introduce a new document: a private letter that supports one of the memory accounts, but with questionable provenance.

  Minute-by-minute plan (80 minutes total):

  0-5 min: Introduction by instructor. Set the scene: "You are the planning committee for the centennial exhibit of the fictional town of Millhaven. Your task is to write a 120-word plaque about the town's founding, focusing on a controversial land acquisition. You have a packet of documents and oral histories. You must answer: what happened, who was responsible, and what's owed. You have 40 minutes to draft."

