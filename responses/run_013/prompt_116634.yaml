  Here’s a speech that navigates the tightrope you described – celebrating Erin while honouring your principles, without collapsing into confession, defensiveness, or policy lecture. It’s structured to *show* the tension, not just state it, and ends warmly with Erin at the centre.

  **Speech (Approx. 580 words):**

  "Right then, before Mum brings out that fantastic-looking pudding – and before I get too nervous! – I’ve been asked to say a few words about our brilliant Erin and her news. [*Look at Erin, big smile*] Erin, love, first and foremost: WELL DONE. We are *so* incredibly proud of you. Sitting that test took guts, working with [Tutor's Name, *if comfortable, otherwise*] your tutor took real dedication, and getting that place? That’s down to your hard work and your spark. Honestly, sweetheart, you should be chuffed to bits. We all are. Give her a round of applause, please!" [*Lead applause, genuine warmth*]

  "Now, anyone who knows me knows… well, knows I’ve got opinions. About… stuff. Systems. How things work. And sometimes, life throws you a situation where the things you believe bump right up against the things you *do* as a parent. This is one of those moments for me. For us. [*Brief glance at partner*]."

  "We looked at options. We thought hard. And we made a choice *for Erin*. We chose the path we thought would give her the best shot at the things she loves and the things she might discover. That’s the job, isn’t it? Trying to do right by your kid. Looking at *this* kid, right here, with her specific strengths and hopes, and asking ‘What helps *her* thrive?’ That question feels simple. Necessary. Non-negotiable, really. It comes from a place of pure love and wanting the best *for her*."

  "But here’s where it gets… knottier. Because ‘the best’ isn’t always a simple thing sitting on a shelf, ready to be picked up. Sometimes, what makes a place ‘good’ depends on who else is there. It’s built by the people who choose it. And that means our choice for Erin… well, it wasn't *just* about picking a good thing. It was also about stepping away from something else. From a place full of good people doing important work, a place where families like ours have made a difference just by being part of it. [*Nod respectfully, perhaps subtly towards brother-in-law, but not a direct stare that puts him on the spot*]. That bit… that weighs on me. It really does."

  "And I know some might say, ‘But she earned it!’ And Erin, you absolutely worked incredibly hard, and that deserves every bit of celebration! But the truth is, lots of kids work incredibly hard. What you had wasn’t just hard work; it was the chance to *show* that hard work in a very specific way, with support not everyone gets access to. That’s not a slight on *you* at all – it’s just… how the game is set up. It’s an edge, but only because not everyone gets to sharpen their pencil quite the same way. If everyone did what we did, the whole race just gets harder and more expensive for everyone. That feels… messy."

  "So yes, I’m wrestling with it. I believe fiercely in giving Erin every opportunity *she* can grasp. That’s the parent in me. And I also believe in fairness, in communities pulling together, in schools reflecting the whole place they serve. That’s the citizen in me. Right now, those two beliefs are having a bit of a barney in my head! And maybe that’s okay. Maybe it’s okay to hold both – the fierce love for our child, and the nagging worry about how all our individual choices add up to a system that sometimes feels like it works against itself. We make the best choice we can see *for our family*, step by step, hoping it’s the right one, knowing it has ripples we can’t always control."

  "But today? Today isn't about solving that big puzzle. Today isn’t about the system, or my opinions, or the awkward knots in my conscience. [*Look directly at Erin, soften tone completely*] Today is about *you*, Erin. It’s about celebrating *your* achievement, *your* hard work, and *your* exciting next step. It’s about this brilliant, funny, determined young woman standing right here, who we all love so much. It’s about our family, gathered round this table, supporting her, cheering her on. That’s the simple, wonderful heart of it."

  "So, Erin, darling – this moment belongs to you. We are bursting with pride. We can’t wait to see what you do next. Now… who’s ready for some of Mum’s amazing pudding? To Erin!" [*Raise glass*]

  ---

  **Short Note on the Unused Point:**

  *   **The Point:** "Each family doing the sensible thing adds up to a system nobody chose... the tyranny of small decisions... the only way not to be part of it is to make my own kid worse off..."
  *   **Why it was hard to include directly:** Naming the concept ("tyranny of small decisions") instantly sounds academic/lecture-y. Explaining the *mechanism* explicitly ("if we all defect, the system collapses") risks turning the speech into an economics seminar and feels overly negative/accusatory towards other parents (and implicitly, oneself) in this celebratory moment.
  *   **What I did instead:** I *showed* the tension without naming the theory. The core idea ("individual choices adding up to unintended systems") is embedded in the lines about "how all our individual choices add up to a system that sometimes feels like it works against itself" and "ripples we can’t always control." The *feeling* of being caught in that dynamic ("We make the best choice we can see *for our family*, step by step... knowing it has ripples") conveys the essence without the jargon or explicit systemic critique. The parent's dilemma ("fierce love" vs. "nagging worry") *is* the lived experience of that "tyranny."
