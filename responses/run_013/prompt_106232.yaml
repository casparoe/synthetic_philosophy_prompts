  *double-checks* Did I miss anything? Oh right - they asked about "lucky guesses." Need to clarify how non-causal justification avoids being accidental. The key is the necessary connection between experience and belief in the constitutive account. When you're in pain and think "I'm in pain," it's not a guess - the experience directly presents itself to you. The zombie's identical utterance lacks this presentation, so it's not knowledge.

