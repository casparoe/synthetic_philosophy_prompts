  *checks notes* The user also asked about the "bill" for rejecting (4). Main costs: 1) needing a non-causal theory of mental content (which many philosophers actually prefer anyway), 2) explaining justification via constitutive or relational facts rather than causation, 3) accepting that zombie "beliefs" aren't real beliefs. That last point might be a feature, not a bug.

