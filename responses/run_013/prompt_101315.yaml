prompt: |-
  Ok so I'm putting together a grad seminar on collapse -- the whole thing, Bronze Age eastern Mediterranean, the Classic Maya, Rapa Nui, all of it -- and before we wade into any particular account I want us to get the spec on the table first. So: write me the desiderata. What does any theory of societal collapse have to actually deliver to be worth taking seriously?

  Give me the cases it has to get right, and say what "right" amounts to in each -- the eastern Med at the end of the Bronze Age, the Maya terminal classic, Easter Island -- what's the thing about each that a theory can't just wave away. Then the distinctions it can't be allowed to flatten: failure vs. transformation vs. slow decline vs. just getting conquered; the polity vs. the population vs. the subsistence base; a real discontinuity vs. an artifact of how we date the stuff. And the background results it can't contradict -- that Maya people are still here, that abandoning cities isn't the same as the death of a culture, that some of the famous "crashes" turn out gentler or weirder than the popular story.

  Then tell me which of these are genuine requirements and which are just prejudices of one camp -- the systems-theory people, the resilience/adaptive-cycle crowd, the climate-determinists, whoever -- and flag any pair you think can't be satisfied together. That's the part I actually want. And say which single requirement does the most to rule out candidates; I have a suspician it's something about the observer's standpoint, whether collapse is a description of a process or a verdict we pass, but convince me either way.

  No need to score every theory, I'll do that in class. Just make the criteria carry their weight -- for each one, the case or consideration that puts it on the list.
reasoning: |-
  Okay, the user is putting together a grad seminar on societal collapse and wants to establish robust criteria ("desiderata") for evaluating theories before diving into specific cases. They're clearly an academic preparing a sophisticated course, likely in anthropology, archaeology, or history. 

  Hmm, their request is exceptionally well-structured – they already know exactly what gaps they want addressed: case-specific accuracy, conceptual distinctions, alignment with established knowledge, and ideological biases. They're also hinting at a pet theory about "observer standpoint" being key. Smart framing.

  First, the non-negotiables for case coverage: 
  - For Bronze Age collapse, any theory must explain the *synchronized* disintegration of multiple interconnected states (Hittites, Mycenaeans etc.) without over-relying on single causes like Sea Peoples. The simultaneity is the real puzzle.
  - Maya collapse theories absolutely cannot ignore that Mayan people persisted while urban elite structures crumbled. That's a classic trap for deterministic models.
  - Rapa Nui's case kills any theory claiming ecological suicide was simple or inevitable – the real story involves rat-driven deforestation AND European disruption.

  Now conceptual distinctions they want protected:
  - Must separate population collapse (rare) from political fragmentation (common). So many theories conflate these!
  - Can't call conquest "collapse" – unless it triggers systemic failure (like Aztecs vs. Inca resilience).
  - Need to flag when archaeological "dark ages" are just data gaps. Early Medieval Europe wasn't actually "collapsed."

  Key background truths to honor:
  - Modern Maya continuity isn't an addendum – it's core evidence against civilizational extinction narratives.
  - Urban abandonment ≠ cultural death (see: post-Roman Britain).
  - "Collapse" timelines are often messier than textbooks say (Byzantine Empire's 8th-century "decline" was highly regional).

  Now for the minefield: ideological biases. 
  - Systems theorists love universal patterns but ignore human agency. 
  - Resilience crowd's "adaptive cycles" sometimes romanticize decline. 
  - Climate determinists downplay political choices (e.g., Maya kings doubling down on monuments during droughts). 
  Biggest tension? Explaining synchrony (Bronze Age) while accounting for diverse local outcomes (Maya city-states).

  And the killer criterion? Observer standpoint. Whether "collapse" is an analytical category or just a presentist judgment. This torpedoes theories that: 
  1) Apply modern sustainability anxieties to past societies 
  2) Assume collapse was always catastrophic for everyone (elites vs. peasants often had opposite experiences) 
  3) Treat it as binary rather than a spectrum of reorganization

  The user's suspicion is dead right – this requirement alone eliminates half the field. A theory that can't articulate its own standpoint will inevitably project biases onto the past.
answer: |-
  Here’s a rigorous set of desiderata for any theory of societal collapse, structured to meet your seminar’s needs. The criteria emerge from historical specificity, conceptual clarity, and interdisciplinary guardrails—with explicit flags for biases and tensions.

  ---

  ### **I. Non-Negotiable Case Accuracy**  
  *(What the theory MUST explain, not just address)*  

  1. **Late Bronze Age Eastern Mediterranean (c. 1200 BCE)**  
     - **Core puzzle**: Synchronous collapse of *interdependent but distinct* states (Hittites, Mycenae, Ugarit, Egypt’s decline).  
     - **"Right" means**: Accounting for **fragility in interconnected systems** (trade, tin/copper networks) without defaulting to monocausal "Sea Peoples" narratives. Must explain why recovery took centuries.  
     - *Red flag*: Theories that ignore climate (3.2 ka BP event) OR overstate migration as primordial cause.  

  2. **Classic Maya Collapse (c. 800–950 CE)**  
     - **Core puzzle**: Abandonment of *cities* amid continued occupation of *regions* (e.g., Northern Yucatán persisted).  
     - **"Right" means**: Reconciling **monumental urban collapse with demographic continuity**. Must address why city-states failed *differentially* (e.g., Tikal vs. Lamanai).  
     - *Red flag*: Theories that equate "collapse" with societal extinction (modern Maya number ~8 million).  

  3. **Rapa Nui (Easter Island)**  
     - **Core puzzle**: Radical deforestation and cultural rupture *before* European contact.  
     - **"Right" means**: Explaining how **ritual-political dynamics** (moai transport, elite competition) amplified ecological feedbacks *without* Eurocentric "ecocide" tropes.  
     - *Red flag*: Ignoring Polynesian agency or post-contact slave raids (1860s) as final disruptors.  

  ---

  ### **II. Forbidden Conceptual Flattening**  
  *(Distinctions a theory MUST preserve)*  

  4. **Collapse ≠ Conquest**  
     - *Test case*: Inca Empire vs. Aztecs. Inca bureaucracy fragmented after Pizarro; Tenochtitlán fell rapidly but Mesoamerican cultures persisted.  
     - **Requirement**: Distinguish **systemic unraveling** from **punctual takeover**.  

  5. **Polity vs. People vs. Subsistence Base**  
     - *Test case*: Post-Roman Britain (cities abandoned, Latin literacy lost) vs. Anglo-Saxon continuity in farming/hamlets.  
     - **Requirement**: A theory must **isolate which level fails**—e.g., state institutions (polity) can dissolve while agroecology endures.  

  6. **Discontinuity vs. Archaeological Ghosts**  
     - *Test case*: The "Greek Dark Ages" (c. 1100–800 BCE) show pottery/style breaks, but likely reflect *data gaps* from decentralized living.  
     - **Requirement**: Prove **material/social rupture** isn’t an artifact of sampling or dating methods.  

  ---

  ### **III. Non-Contradictory Background Knowledge**  
  *(Empirical guardrails)*  

  7. **Cultural Survival ≠ State Survival**  
     - **Fact**: Cahokia’s dissolution (c. 1350 CE) didn’t exterminate Mississippian peoples; Maya languages/thriving today.  
     - **Requirement**: No theory can imply "collapse" = extermination.  

  8. **Non-Catastrophic "Collapses"**  
     - **Fact**: Byzantium’s "decline" was 800 years of strategic adaptation; Angkor’s unraveling was slow reconfiguration.  
     - **Requirement**: Acknowledge **gradual reorientation** as a collapse pathway.  

  9. **Collapse as Reorganization**  
     - **Fact**: Post-collapse societies often retain core tech/knowledge (e.g., irrigation in post-Hohokam O’odham culture).  
     - **Requirement**: Explain why some capabilities persist while others vanish.  

  ---

  ### **IV. Ideological Biases & Tensions**  
  *(Flagging camps and irreconcilabilities)*  

  | **Criterion**               | **Often Weaponized By**               | **Contested By**               | **Fatal Tension?** |  
  |-----------------------------|---------------------------------------|--------------------------------|---------------------|  
  | **Primacy of Climate Shock** | Climate determinists (e.g., Diamond) | Political ecologists           | Vs. **Human Agency** (e.g., Maya kings *chose* monument-building during droughts) |  
  | **"Resilience" as Cycle**    | Adaptive-cycle theorists (Holling)   | Historical materialists        | Vs. **Irreversibility** (e.g., LBA tin trade never rebooted) |  
  | **Universal Collapse Laws** | Systems theorists (Tainter)          | Postprocessual archaeologists  | Vs. **Case Specificity** (e.g., Rapa Nui’s isolation made innovation harder than in Mesopotamia) |  
  | **Collapse as Pathology**   | Degrowth advocates                   | Neo-institutional economists   | Vs. **Collapse as Adaptive Shedding** (e.g., post-Roman ruralization) |  

  **Most Exclusionary Criterion**:  
  **Observer standpoint** ("collapse as verdict vs. process").  
  - *Why it rules out theories*: If collapse is framed as a *moral judgement* (e.g., "unsustainable"), it ignores cases like the Olmecs, where decentralization may reflect rational adaptation. Conversely, theories treating collapse as a *mechanical process* (e.g., declining returns on complexity) often erase survivor narratives (e.g., Indigenous continuities).  
  - *Kills*: Theories that conflate **structural change** with **civilizational failure**—e.g., Chaco Canyon’s "collapse" preserved Chacoan knowledge but transformed its socio-political container.  

  ---

  ### **V. The Ultimate Litmus Test**  
  A theory must pass **ALL THREE** of these:  
  1. **Explain synchronicity** (LBA) without denying **asynchronicity** (Maya city-states).  
  2. **Allow collapse without genocide** (modern Maya) while explaining **genuine loss** (Rapa Nui’s oral traditions).  
  3. **Address both *why it happened* and *why it persisted*** (e.g., LBA’s centuries-long "dark age").  

  Fail any, and the theory is either reductionist or teleological.  

  ---  
  **Why this framework?** It forces theories to navigate the **paradox of collapse**: Simultaneously a *material process* (ecosystemic, economic) and a *cultural experience* (loss of meaning, identity rupture). The strongest theories will bridge systems science and historical particularism—which is where your seminar’s critical work begins.
