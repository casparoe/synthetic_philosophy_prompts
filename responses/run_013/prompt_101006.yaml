prompt: |-
  Last month a colleague insisted, in the middle of an argument I would rather forget, that I had a reason to keep a promise I had made even though nothing I actually cared about was served by keeping it, and that it was simply irrational of me to think otherwise. When I described the exchange to a friend who is a graduate student in philosophy, she summarized Bernard Williams's position for me as follows:

  "Williams thinks a reason for action has to be something that can move you, so it always has to hook up to a desire you already have. If nothing you want would be served by acting, then there is no reason for you to act, full stop, and anyone who tells you otherwise is just moralizing. External reasons -- reasons that apply to you no matter what you want -- are therefore impossible, because you literally cannot be moved by something that is not already in your motivational set. Williams says the only alternative is to insist that people should care about things they do not, which he thinks is empty."

  I have just joined a reading group on practical reason, and I would like to know how much of this I can bring with me. Go through the summary claim by claim and tell me what Williams and his defenders would accept, what is a common simplification, and what is a misrepresentation -- in particular, I suspect two things are being run together here: having a reason and being motivated to act on it, and also the word "desire" with what Williams actually packs into an agent's motivational set. I also want to know whether the summary's conclusion, that external reasons are impossible and that any externalist is just moralizing, follows from the parts that are accurate, or whether a serious externalist has resources the summary simply ignores. Throughout, separate what is settled from what is genuinely contested among people who work on this, and do not let a contested reading pass as the consensus. Keep the whole reply under 700 words.
reasoning: |-
  Okay, let me tackle this user's query systematically. They've presented a summary of Bernard Williams's internal reasons theory from their philosophy student friend, and want to know how accurate it is before joining a reading group. The user specifically suspects two potential conflations: between reasons and motivation, and between "desire" and Williams's broader "motivational set."

  First, I need to verify Williams's actual positions. His internalism centers on the "internal reasons thesis": a reason for A to φ must connect to A's "subjective motivational set" (S-set). This S-set is indeed broader than just desires - it includes commitments, values, projects etc. The summary oversimplifies by using "desire" exclusively. 

  The user is correct that the summary conflates having reasons with being motivated. Williams distinguishes: reasons require dispositional motivation (could motivate after sound deliberation), not necessarily occurrent motivation. The summary's "literally cannot be moved" is too strong - it's about deliberative path from existing motivations.

  Regarding external reasons impossibility, Williams does argue this, but his target is external reasons that lack any S-set connection. The "moralizing" charge applies only to certain externalist claims that ignore the agent's perspective. Sophisticated externalists like Parfit counter that reasons can exist independently of motivation - this is the core debate the summary presents as settled when it's actually contested.

  I should note where the summary gets things right: the necessity of reasons hooking to motivation (via S-set), and Williams's rejection of disconnected "shoulds." But I must highlight the key oversimplifications and the ongoing debate about external reasons, emphasizing that Williams's view remains influential but disputed.

  The user wants this for academic discussion, so I'll maintain precision about what's Williams's position versus contested interpretations, keeping under 700 words by focusing on: accurate S-set definition, motivation/reason distinction, and external reasons debate status.
answer: |-
  Here’s a claim-by-claim breakdown of the summary, separating Williams's core positions from simplifications/misrepresentations and clarifying the contested landscape:

  1.  **"Williams thinks a reason for action has to be something that can move you..."**
      *   **Acceptable:** This captures the core of Williams’s "internal reasons" thesis. A reason must be *capable* of motivating the agent *if* they engage in sound deliberative reasoning from their existing motivational state.
      *   **Crucial Nuance:** It's not that it *must* move you *now*, but that there *must be a sound deliberative route* from your current S-set to being motivated by it.

  2.  **"...so it always has to hook up to a desire you already have."**
      *   **Simplification/Misrepresentation:** This is the key error noted in your suspicion. Williams uses the broader term **"subjective motivational set" (S-set)**. While desires are included, the S-set also encompasses **dispositions of evaluation, patterns of emotional reaction, personal loyalties, commitments, projects, and anything the agent values** – essentially, the complex array of psychological elements that constitute the agent's perspective and explain their actions.
      *   **Consequence:** Reducing it to "desires" makes Williams seem like a crude Humean desire-satisfaction theorist, which he is not. The "hook" is to the *whole S-set* via deliberation.

  3.  **"If nothing you want would be served by acting, then there is no reason for you to act, full stop..."**
      *   **Broadly Acceptable (with S-set correction):** Replacing "want" with "have in your S-set" and understanding "served" as "connectible via sound deliberation", this captures Williams's internalism. If no element of your S-set, actual or potential (through deliberation), supports φ-ing, then you have no reason to φ.
      *   **Clarification:** "Served" might misleadingly imply instrumental benefit. The connection can be direct (φ-ing *is* the valued thing) or constitutive (φ-ing is part of a project).

  4.  **"...and anyone who tells you otherwise is just moralizing."**
      *   **Oversimplified & Contested Interpretation:** Williams *does* argue that asserting external reasons often amounts to "bluff" or coercive "moralising," trying to impose an external standard disconnected from the agent's perspective. However:
          *   This is a *diagnosis* of *some* externalist claims, not a necessary definition. He grants externalists are sincere.
          *   It's a highly *contested* claim. Externalists (like Parfit, Scanlon) argue they *are* identifying genuine normative truths, not merely "moralizing."

  5.  **"External reasons... are therefore impossible, because you literally cannot be moved by something that is not already in your motivational set."**
      *   **Williams's Core Conclusion:** Yes, Williams argues external reasons (reasons applying irrespective of the agent's S-set) are *impossible*.
      *   **Crucial Nuance on Motivation:** The argument isn't just about *literal current movability* (psychology). It's conceptual: for something to be *your* reason, it must be capable of explaining *your* action via your motivations and deliberation. A "reason" utterly disconnected couldn't play that role.
      *   **Contested Territory:** This conclusion is **hotly debated**. Externalists (e.g., Parfit, Dworkin, later Nagel) argue:
          *   Reasons can exist independently of motivation (e.g., objective values, rational requirements).
          *   Williams conflates *having* a reason (a normative fact) with *being motivated* by it (a psychological state).
          *   Sound deliberation can sometimes reveal *new* reasons not derivable from pre-existing S-set elements.

  6.  **"Williams says the only alternative is to insist that people should care about things they do not, which he thinks is empty."**
      *   **Acceptable:** Williams argues that simply asserting "You should care about X" (without showing how caring about X connects to what the agent *already* cares about via deliberation) is normatively inert and fails to provide the agent with a *reason*.

  **Addressing Your Suspicions & Key Contested Points:**

  *   **Reasons vs. Motivation:** You are correct. The summary runs them together. Williams *links* them conceptually (a reason must be potentially motivating via deliberation from the S-set) but doesn't utterly conflate them. Externalists *separate* them: reasons exist independently; motivation is a separate issue.
  *   **"Desire" vs. S-set:** You are correct. This is the major simplification. "Desire" is far too narrow for Williams's rich conception of the S-set.
  *   **Does the Conclusion Follow?** Within Williams's internalist framework, the impossibility of external reasons *does* follow from his premises about what constitutes a reason. **However, this framework is itself contested.** Serious externalists don't accept Williams's starting premise that reasons must be potentially motivating via the S-set. They offer alternative accounts of normativity (e.g., objective values, rational agency constitutivism, contractualism) where reasons apply independently. The summary ignores these substantive alternative foundations, portraying externalism as *only* empty moralizing, which is unfair. The debate is about the *fundamental nature* of reasons and normativity.

  **Summary of Consensus vs. Contested:**

  *   **Settled (Exegetically):** Williams defended internalism based on the S-set, rejected external reasons as impossible, and viewed unsupported "shoulds" as empty/bluff. He meant S-set, not just desires.
  *   **Contested:** The fundamental debate is **wide open**.
      *   Williams's internalism remains highly influential but faces significant challenges.
      *   Externalists offer robust alternative theories (not just "moralizing").
      *   The core dispute is whether reasons are essentially tied to an agent's contingent motivations (Internalism) or can exist objectively/independently (Externalism).
      *   The nature of "sound deliberation" and its ability to *generate* new reasons from an S-set is also debated *within* internalist and externalist camps.

  Bring Williams's core insights about the S-set and the requirement for a potential deliberative link to motivation. Be prepared for vigorous debate about external reasons – the claim that they are "impossible" is Williams's conclusion, not a settled philosophical truth.
