prompt: |-
  I've somehow ended up running next month's meetup session — ninety minutes, whiteboard, fifteen people who read a lot of EA/rationalist blog stuff and have read exactly zero philosophy of war. Topic is the moral equality of combatants. Don't explain it to me, I roughly know what it says; I want the lesson plan.

  So: what order do the pieces have to go in, and what actually depends on what? My guess is you can't even state the doctrine before people have (a) the ad bellum / in bello split and (b) the idea that the rules of fighting are meant to apply the same to both sides regardless of who started it — but I might be putting the cart before the horse, tell me if so and what the real first move is.

  The one example that has to carry the whole thing: I want an unjust combatant who fights on knowing full well his side's cause is rotten — he's read the actual memo, he believes it — and who also isn't being coerced (volunteer army, nobody shooting deserters, he could just walk). Reason I'm insisting on that: with the ususal WWII-flavored case I'm fairly sure the room will quietly swap in 'well he couldn't have known' and the whole session collapses into the excuse story without anyone noticing they've changed the subject. So — can that case even be constructed, or does the excuse do all the work and my example is impossible? If it's impossible, say so loudly, because it changes what I should teach. And tell me what the example has to have and has to lack to do the job.

  Second thing, and I want you to tell me if it's a trap: I want to try walking in through a licensing-convention picture, like the rules of a duel, or two boxers who both agreed to the match. On that picture the permission to kill each other comes from both sides accepting the same rulebook, not from either cause being just, and the symmetry is just what a rulebook looks like when two parties buy in. Two worries: it smuggles in a consent/contract story that actual soldiers don't satisfy, and it seems to license any mutually agreed fight, which is nuts. Load-bearing or drop it? Related version I may have made up on a walk: the symmetry is doing coordination work rather than moral work — both sides prefer a shared rulebook to anything-goes, and symmetry is what makes it self-enforcing — in which case the "moral" equality is a moralized convention. If that's a real position and not just me, work it into the plan.

  Misconceptions, in the order they'll actually show up and where in the sequence to head each one off. I'm betting on: (1) moral equality = both sides equally in the right; (2) so combatants are just following orders and aren't responsible for anything; (3) it's a legal doctrine, so it's about tribunals and the Geneva rules; (4) you can only be killed if you deserve it, i.e. liability requires guilt. What's the big one I'm missing?

  Then: one question to put to the room at the end that would show whether they got the structure of the debate rather than memorized a side. And what I should explicitly refuse to cover at this level and announce that I'm refusing — I'm thinking the occupation/aftermath material and the exceptional-circumstances material, but you tell me.

  No reading list, they won't do it.

  Last thing: keep the confidence honest. Seperate what's settled among people who actually work on this from what's a live fight, and don't hand me one side as the consensus. In particular, if the revisionist line (McMahan and co.) has basically won, don't tell me it's settled; and if it hasn't, don't tell me it's fringe.
reasoning: |-
  Okay, the user is preparing a 90-minute session on the moral equality of combatants for a group familiar with EA/rationalist blogs but no formal philosophy of war. They need a structured lesson plan that avoids common pitfalls. 

  First, I need to address their core concerns: They want to start with foundational concepts like the ad bellum/in bello split and the symmetry principle before introducing MEC. Their specified example of a non-coerced, fully aware unjust combatant is crucial—they're right that typical WWII examples invite "didn't know" excuses. This example must stand without collapsing into epistemic debates, so I'll emphasize voluntariness and explicit knowledge of unjust cause. 

  The licensing-convention approach (duels/boxing) is smart for illustrating symmetry but risky. They correctly identify the consent problem—real soldiers don't opt in. I'll reframe it as coordination logic: shared rules reduce mutual harm, with symmetry enabling reciprocity. This avoids moralizing the convention while showing why both sides might comply. 

  For misconceptions, their list is solid but I'd add the conflation of moral/legal equality (MEC ≠ Geneva Conventions). The biggest oversight might be assuming MEC requires blanket absolution—it actually coexists with post-war accountability. 

  The closing question should test structural understanding: "Can MEC survive if we reject the in bello independence thesis?" This forces them to engage the revisionist critique without picking sides. Areas to explicitly exclude: occupation justice and supreme emergency exemptions. 

  On intellectual honesty: McMahan's revisionism dominates academically but hasn't displaced MEC in practice. I'll note this tension—consensus exists on problems (MEC's counterintuitive elements) but not solutions. 

  Their teaching instincts are sharp: insisting on the "rotten cause" example shows they grasp how easily the debate gets derailed. The boxing analogy attempt reveals they're thinking deeply about convention-based justifications. Their misconception list is practitioner-grade. 

  Final adjustments: Stress that MEC's symmetry is about permissions during combat, not post-war deserts. Preempt the "desert vs. liability" confusion early. And absolutely forbid "just following orders" discussions—that's a Nuremberg trap, not MEC.
answer: |-
  Here’s a battle-tested lesson plan for a 90-minute session, optimized for your constraints. It prioritizes conceptual dependencies, preempts your listed misconceptions, and centers your "rotten cause" case. The structure forces engagement with MEC’s toughest challenge.

  **Core Sequence & Dependencies**  
  *(Total: 70 min — leaves 20 min for Q&A/debate)*  

  1.  **Groundwork: The Two Wars** (15 min)  
      - **Activity:** Pose two scenarios:  
        *(A) State A unjustly invades State B. A conscript shoots B’s soldier.  
        (B) State B’s soldier shoots invading A’s conscript.*  
      - **Q1:** "Is there *any* moral difference between these killings?" (Poll votes + brief reasons)  
      - **Reveal:** Introduce *jus ad bellum* (justice of war) vs. *jus in bello* (justice in fighting). Emphasize the *split*: Judgments about *who started it* vs. *how they fight*.  
      - **Key Insight:** "The rules of fighting apply equally to both sides, *even if one side is clearly wrong to be there*."  

  2.  **Introducing MEC & Your Test Case** (20 min)  
      - **State MEC:** "Combatants on opposing sides possess equal moral status *in the conduct of war*, regardless of the justice of their cause."  
      - **Your Test Case (Critical!):**  
        > *"Alex is a volunteer in the army of Aggressia. Aggressia’s leaders have published (and Alex has read) a candid internal memo: ‘We’re invading Defendia solely to steal its resources; our claimed justification is fabricated.’ Alex believes this memo. Aggressia has no draft; deserters face only administrative discharge, not punishment. Alex chooses to fight. During an attack on a Defendian military base, Alex shoots Carl, a Defendian soldier defending the base. Is Alex morally permitted to kill Carl? Is Carl morally permitted to kill Alex?"*  
      - **Activity:** Small groups discuss (5 min). Report back: Focus on *permissions*, not blame.  
      - **Drive Home:** Alex knows the cause is unjust, isn’t coerced, and fights voluntarily. If MEC holds, *Alex has the same moral permission to kill Carl as Carl has to kill Alex*.  

  3.  **Why Symmetry? The Coordination Logic** (15 min)  
      - **Your Boxing Analogy (Use it!):** "Two boxers agree to a match under set rules. The rules grant *both* permission to punch the other, *regardless of who ‘deserves’ to win* or why they’re fighting. This isn’t about consent (*soldiers don’t consent*), but about *coordination on shared rules to limit disaster*."  
      - **Why Symmetry?**  
        - **Mutual Benefit:** Both sides benefit from rules prohibiting torture, targeting medics, etc.  
        - **Self-Enforcement:** Rules only work if *both sides have incentive to comply*. If only the "just" side could kill, the "unjust" side has *no reason* to follow *any* rules – leading to total war.  
        - **Epistemic Humility:** Soldiers/officers often can’t *reliably know* who is truly "just" mid-conflict.  
      - **Stress:** This makes the *convention moral*, not *amoral*. It minimizes overall harm.  

  4.  **Dissecting Misconceptions** (15 min) *(Preemptively tackle these as they arise, but reserve time to nail them)*  
      - **MEC ≠ Both sides equally *just* (ad bellum).** "MEC is silent on who started it! It’s only about *conduct in war*."  
      - **MEC ≠ Immunity from *all* blame.** "Alex may be *culpable* for joining an unjust war! MEC only says he has the *same permissions as Carl* **during combat**. Post-war, Alex might face trial for aggression."  
      - **MEC ≠ Legal Doctrine (Geneva).** "It’s a *moral* thesis underpinning *some* laws. Geneva *reflects* MEC, but MEC is a philosophical claim."  
      - **MEC ≠ "Just Following Orders" Excuse.** "MEC doesn’t say Alex isn’t *responsible* for *joining* the war! It’s about the specific act of *fighting combatants*."  
      - **The Liability Trap:** "**MEC rejects that you must be *guilty/deserving* to be liable to attack.** Liability stems from being a *threat* posing *harm* within an armed conflict, *not* from personal moral guilt." (Link back to Alex: He’s a threat to Carl; Carl is a threat to him).  

  5.  **The Revisionist Challenge (Briefly)** (5 min)  
      - **McMahan’s Core Strike:** "If only the just side has a *right* to kill, then unjust combatants like Alex are *murderers*. The symmetry is illusory. *Jus in bello* depends on *jus ad bellum*."  
      - **The Coordination Reply:** "But without symmetry, *how do you restrain the unjust side?* The revisionist might make war *more brutal* by removing incentives for restraint."  
      - **Status:** "This is the **central live debate**. McMahan’s critique is dominant in *academic philosophy* but MEC remains foundational in *law, military ethics, and state practice* because of coordination/realism concerns. No consensus."

  **Closing Question to Test Understanding** (5 min)  
  *"Can the moral equality of combatants survive if we reject the independence of jus in bello from jus ad bellum? Why or why not?"*  
  *(This forces them to see the core tension: Coordination vs. Moral Truth).*

  **What to Explicitly Exclude**  
  *   **Announce upfront:** "We’re focusing *only* on combatant vs. combatant in active hostilities. We will *not* cover:  
      *   Occupation duties / post-war justice.  
      *   Non-combatant immunity (civilian targeting).  
      *   ‘Supreme emergency’ exceptions.  
      These rely on distinct (though related) principles."

  **On Your "Rotten Cause" Case & The Licensing Analogy**  
  *   **Your Case is Valid (and Necessary):** It *can* be constructed. The "excuse" (ignorance/coercion) does significant work in *many* real cases, but MEC *requires* it to hold even when excuses are stripped away. If it only works with excuses, it collapses into a liability model. Alex *is* the acid test.  
  *   **Licensing Analogy is Load-Bearing (Use It Wisely):**  
      *   **Drop:** The literal "consent" element. Soldiers aren't boxers agreeing to a match.  
      *   **Keep:** The **coordination logic** and the **functional role of symmetry**. It answers *why* we might grant permissions based on role/threat rather than desert.  
      *   **Refine:** "Think of it less as a contract and more as a *tragically necessary mutual framework*. Both sides, even the unjust aggressor, have a *prudential reason* to accept rules limiting warfare *if* those rules bind their enemy too. Symmetry makes that possible." This avoids licensing *any* fight – it’s about structuring *inevitable* conflicts to minimize harm. It's a moralized convention.

  **Key Misconception You Missed**  
  **"MEC means unjust combatants bear no responsibility *for anything*."**  
  *   **Preempt:** Hammer the distinction between *liability to attack during war* and *culpability/responsibility for participating in an unjust war*. MEC only addresses the *former*. Alex might be a moral monster for volunteering, but *while he's a combatant threatening others*, Carl is permitted to stop him, and *Alex is permitted (under MEC) to defend himself against Carl's attack*.

  **Confidence Check**  
  *   **Settled:**  
      *   The *distinction* between *jus ad bellum* and *jus in bello* is fundamental.  
      *   MEC *is* the traditional, mainstream view embedded in IHL.  
      *   McMahan's critique is the dominant *academic philosophical* challenge.  
      *   The "coordination"/"epistemic" *defenses* of MEC are the primary counters to McMahan.  
  *   **Live Fight:**  
      *   **Has McMahan "won"?** **No.** In academic *moral philosophy*, his view is highly influential. But MEC remains dominant in *international law, military ethics training, and state practice*. Most scholars acknowledge the *practical necessity* of MEC-like rules even if they find McMahan *morally* correct. It's a "live fight" precisely because the tension between moral purity and practical consequence is unresolved. No side is fringe; it's the core debate.

  **Session Flow Summary:**  
  1.  (15 min) Foundational Split (ad bellum vs. in bello).  
  2.  (20 min) MEC Defined + **Alex Test Case** (Group Work).  
  3.  (15 min) Why Symmetry? **Coordination Logic** (Boxing Analogy Refined).  
  4.  (15 min) **Demolish Misconceptions** (Focus: Liability ≠ Guilt, Permissions ≠ Culpability).  
  5.  (5 min) Revisionist Challenge & Status Quo.  
  6.  (5 min) **Closing Question**.  
  7.  (15 min) **Q&A / Debate** (Manage tightly! Refer back to Alex & Coordination).  

  **Crucial Teaching Moves:**  
  *   **Relentlessly** refer back to "Alex" when discussing permissions.  
  *   **Whiteboard the Split:** Two columns (ad bellum / in bello) early. Add MEC under "in bello".  
  *   **Shut Down Nuremberg Talk:** "Just following orders" is irrelevant to MEC. Redirect to Alex's *knowledge and choice*.  
  *   **Concede McMahan's Moral Intuition:** "Yes, it *feels* wrong that Alex can permissibly kill Carl. The debate is whether we can *live* with that feeling for the sake of less horrific wars."  
  *   **End on the Tension:** The unresolved conflict between moral idealism (McMahan) and pragmatic moral tragedy (MEC) is the point.

  This structure forces engagement with MEC's hardest implication (your Alex case), grounds it in the ad bellum/in bello split, justifies symmetry via coordination (your insight), and preempts fatal misconceptions. Good luck!
