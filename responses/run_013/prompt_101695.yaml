prompt: |-
  I'm slowly grinding through Aquinas's bit on war in the Summa (the "whether it is always sinful to wage war" question) and I've got the three conditions roughly down, but the third one is eating me alive. Here's the passage:

  "Thirdly, it is necessary that the belligerents should have a rightful intention, so that they intend the advancement of good, or the avoidance of evil. [...] For it may happen that the war is declared by the legitimate authority, and for a just cause, and yet be rendered unlawful through a wicked intention. Hence Augustine says [...] 'The passion for inflicting harm, the cruel thirst for vengeance, an unpacific and relentless spirit, the fever of revolt, the lust of power, and such like things, all these are rightly condemned in war.'"

  My seminar leader waved this around and claimed its the real reason you can't just say soldiers on both sides of a war are moral equals -- that once you take "rightful intention" seriously, the whole moral-equality-of-combatants thing collapses. I'm pretty sure she's got it backwards but I can't say why. As far as I can tell the third condition is a condition on the war (or on the prince's intentions), not on what some conscript on the losing side is guilty of. And yet... if a war is "rendered unlawful through a wicked intention", unlawful for who exactly? The sovereign? The war as a whole? Every last soldier in it?

  Can you pull the passage apart for me? I want to know who the "belligerent" whose intention matters actually is; whether the condition attaches to the act of war or to the agent; what exactly "rendered unlawful" is supposed to land on; how the intention condition relates to the other two, since it looks redundant untill you read the next sentence; and then, finally, what all of this does or doesn't imply about the moral equality of combatants. And if my seminar leader's reading is a live one, tell me what version of it would have to be true for this passage to support it -- lay the options out so I can go back to her with specifics instead of just mumbling.
reasoning: |-
  Okay, the user is struggling with Aquinas's third condition for just war—rightful intention—in the Summa Theologiae. They're confused about whose intention matters, how it affects the lawfulness of the war, and whether it undermines the moral equality of combatants. Their seminar leader argued this condition collapses that equality, but the user thinks that's backwards. Let me unpack this step by step.

  First, I need to clarify Aquinas's text. The third condition focuses on the belligerents' intention to advance good or avoid evil. Augustine's quote lists vicious motives like vengeance or lust for power. The key question is: who are the "belligerents" here? The user is unsure if it's the sovereign, the soldiers, or the war as a whole.

  Looking at the structure, Aquinas places this condition alongside legitimate authority and just cause. Those are macro-level (sovereign/prince), so rightful intention likely is too. When Aquinas says the war is "rendered unlawful through a wicked intention," it's the sovereign's intention that corrupts the war's moral status. The soldiers' individual intentions aren't the focus here. 

  The user’s seminar leader connects this to moral equality of combatants—the idea that soldiers on both sides are moral equals. But Aquinas isn’t addressing individual soldiers here. The condition targets the decision-makers. Even if a war is unjust due to the prince's bad intentions, a conscript fighting for survival isn’t necessarily committing a sin by participating. 

  The redundancy question: why isn’t intention covered by "just cause"? A just cause (like stopping aggression) could be pursued with wicked motives (e.g., cruelty). So intention is a separate check against abuse. 

  For the seminar leader’s view to hold, we’d need to interpret "belligerents" as including every soldier or assume that an unjust war makes all participants culpable. But Aquinas’s framework doesn’t support that. His later articles discuss soldier obedience, implying lower culpability for those following orders. 

  The user needs specific arguments to counter their leader. I should outline possible interpretations: strict (only sovereign's intent matters) vs. expansive (intent permeates all actors). The latter is less textually supported. Also, distinguish between the war’s objective unlawfulness and individual culpability. 

  Finally, the moral equality debate: if the war is unjust due to authority/intent, the sovereign is culpable, but soldiers may lack the capacity or knowledge to be equally guilty. So the condition doesn’t inherently collapse moral equality; it actually might preserve it by separating leadership sins from soldiers’ actions.
answer: |-
  Let's dissect Aquinas's third condition systematically, addressing each of your concerns and refuting your seminar leader's claim about the "moral equality of combatants" (MEC). The key lies in understanding the *agent* and *level of analysis* Aquinas employs.

  ### 1. Who is the "Belligerent" Whose Intention Matters?
  *   **The Sovereign/Ruling Authority:** Aquinas is crystal clear. The "belligerents" he refers to in the *third condition* are the same agents bound by the *first condition*: the **legitimate authority** (the prince, sovereign, or governing body) who declares and wages the war ("*bellum iustum indicere*").
  *   **Why?** The entire *quaestio* (ST II-II, Q40) is framed around the *prince's* decision to wage war. Condition 1: *Who* can licitly *declare* war? Condition 2: *For what reason* can they declare it? Condition 3: *With what intention* must they declare and prosecute it? The subject is the *prince acting as sovereign*, not the individual soldier.
  *   **Textual Evidence:** "The passion for inflicting harm, the cruel thirst for vengeance..." (quoting Augustine) are vices attributed to *rulers*, not rank-and-file soldiers. These are motivations for *initiating and conducting* a conflict, not for obeying orders.

  ### 2. What Does the Condition Attach To? Act or Agent?
  *   **Primarily the Agent (The Sovereign):** The condition specifies the *state of mind* required of the authority *performing the act* of declaring and waging war. It demands their *intention* ("*recta intentio*") be rightful.
  *   **Consequently, the Act (The War):** If the sovereign acts with a "wicked intention," this *renders the war itself unlawful* ("*bellum redditur illicitum*"). The moral character of the *agent's will* directly determines the moral licitness of the *act* they undertake. An act otherwise just (proper authority, just cause) becomes sinful *because* of the corrupt will motivating it.

  ### 3. What Does "Rendered Unlawful" Land On?
  *   **The War as an Act Undertaken by the Sovereign:** The phrase "the war is declared by the legitimate authority, and for a just cause, and yet be rendered unlawful..." means the *entire enterprise of waging this specific war*, undertaken by this sovereign power, loses its moral justification *despite* meeting the first two conditions.
  *   **The Sovereign's Moral Culpability:** It means the *sovereign* is sinning by waging this war, even if the cause is objectively just. Their internal motivation corrupts the external act.
  *   **Implications for Subjects/Soldiers:** While the *war* is unlawful, this **does NOT automatically mean every soldier participating commits a mortal sin**. Aquinas explicitly addresses soldier obedience later (ST II-II, Q40, A1, Reply Obj. 3 & Q104). Soldiers are generally obligated to obey lawful authority *unless the command is manifestly sinful*. A war rendered unlawful *solely* by the sovereign's hidden wicked intention (which a soldier cannot know) is not "manifestly sinful" to the soldier. Their participation, while part of an objectively unjust war *due to the prince's intent*, may not be subjectively sinful *for them*.

  ### 4. How Does Intention Relate to the Other Conditions? (The Redundancy Question)
  *   **Distinct & Necessary:** It is **not redundant**. The three conditions address distinct moral dimensions:
      *   **Legitimate Authority:** *Who* acts? (Jurisdiction/Competence)
      *   **Just Cause:** *Why* act? (Objective Right/Injury Suffered)
      *   **Rightful Intention:** *For what purpose/subjective motive* act? (Subjective Will/Ends)
  *   **Why Necessary?** A sovereign can have legitimate authority and a *plausible* just cause (e.g., recovering stolen territory - Just Cause) but be motivated *entirely* by vengeance, cruelty, or lust for power (Wicked Intention). The *same external act* (waging war for territory) is morally transformed by the internal motive. The "Just Cause" becomes a *pretext*, not the true motive. Intention ensures the war is fought *for the common good and peace*, not for base passions, even if the cause *could* justify it with the right intent.

  ### 5. What This Does/NOT Imply for Moral Equality of Combatants (MEC)
  *   **Aquinas's Condition Directly Refutes Your Seminar Leader:** The third condition, understood correctly, **undermines her claim that it collapses MEC.** In fact, it **supports the core idea of MEC** at the soldier level.
      *   **MEC (Simplified):** Combatants on opposing sides in a war share a similar moral status *as combatants*; they are generally not guilty of murder simply for fighting the enemy, even if their side is unjust overall. Their role is governed by the rules of war, not directly by the justice of the *casus belli*.
  *   **Why Her Claim is Backwards:**
      1.  **Level Confusion:** The condition targets the *sovereign's* intention. The *sin* of waging war with wicked intent lands on the *prince*, not automatically on every soldier.
      2.  **Soldier's Knowledge & Agency:** Aquinas recognizes soldiers lack the authority's knowledge and decision-making capacity. Their duty is obedience *unless the sin is manifest*. A war unjust due to hidden sovereign intent is *not manifestly sinful* to the soldier.
      3.  **Focus on Combatant Actions:** MEC concerns whether *killing enemy soldiers in battle* is murder. Aquinas's just war theory (including this condition) primarily judges the *decision to initiate and conduct the war*, not the moral status of every act of killing *within* it by subordinates acting under orders. A soldier fighting bravely and justly *within the rules* on the side with a wicked sovereign intention isn't necessarily sinning by fighting.
  *   **What Aquinas *Does* Undermine:** He undermines the idea that *any* war meeting the first two conditions is automatically just. He emphasizes that the *character and motivations of the leaders* matter profoundly for the overall justice of the war. However, he does **not** transfer that leader-level guilt wholesale to every combatant.

  ### Addressing Your Seminar Leader's Reading: The Options
  For her reading (that rightful intention collapses MEC) to be supported by *this passage*, she must interpret Aquinas in one of these ways (all of which are problematic):

  1.  **"Belligerents" Means All Combatants:** She argues Aquinas uses "belligerents" to mean every soldier. *Problem:* This contradicts the context of the *prince* declaring war (Condition 1), the focus on sovereign vices (Augustine quote), and Aquinas's later discussion of soldier obedience.
  2.  **"Rendered Unlawful" Means Every Participating Act is Sinful:** She argues that if the *war* is unlawful due to wicked intent, then *every act* within it, including a soldier killing an enemy combatant, becomes inherently sinful/murder. *Problem:* Aquinas explicitly distinguishes the soldier's role and obligation to obey non-manifestly sinful orders. He doesn't equate participation in an unjust war (even one unjust due to intent) with individual mortal sin for every soldier.
  3.  **Intention Permeates the Entire War Effort:** She argues the sovereign's wicked intent morally contaminates *every action* ordered within the war, making even tactically justified killing by soldiers sinful. *Problem:* This is a possible *theological extension* (sometimes debated), but it's **not** what Aquinas *says here*. His focus is on the sovereign's culpability for *waging* the war unlawfully, not on the automatic mortal guilt of every subordinate. His structure separates the *ius ad bellum* (justice of going to war - Conditions 1,2,3) from the *ius in bello* (justice *in* the conduct of war - addressed elsewhere, e.g., non-combatant immunity), and the moral status of soldiers.

  ### Conclusion
  Aquinas's third condition is a crucial check on sovereign power. It targets the *prince's* motivations for declaring and waging war. A war declared with legitimate authority and for a just cause is *still* rendered sinful and unlawful *if the prince acts out of vengeance, cruelty, or ambition*. This sin lands primarily on the sovereign.

  **This condition does NOT mean that soldiers on the "unlawful" side are automatically guilty of sin simply for fighting, nor does it collapse the moral equality of combatants.** Aquinas carefully distinguishes the responsibility and knowledge of the sovereign from that of the soldier. The soldier's moral culpability depends on factors like the manifest injustice of the cause/orders and their own conduct within the war (*ius in bello*), not solely on the hidden wicked intention of their prince that rendered the *war* unlawful at the strategic level.

  **Go back to your seminar leader with this:** "Aquinas specifies that the 'belligerent' bound by the rightful intention condition is the *legitimate authority* (the prince), not the individual soldier. When he says the war is 'rendered unlawful' by wicked intention, he means the *prince sins* by waging it, and the *enterprise* loses its justification. However, he explicitly discusses soldier obedience later, stating they must obey *unless the order is manifestly sinful*. A war unjust solely due to the sovereign's hidden wicked intent isn't 'manifestly sinful' to the soldier. Therefore, this condition targets the leader's culpability for initiating an unjust war, not the moral status of combatants killing in battle. It doesn't collapse MEC; it actually relies on the distinction between sovereign and soldier inherent in MEC." Cite ST II-II, Q40, A1, Reply Obj. 3 for soldier obedience.
