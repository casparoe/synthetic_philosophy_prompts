prompt: |-
  Last night a friend and I spent most of a dinner arguing about whether her phone counts as part of her memory, and this morning I have a stack of scripts to get through before the seminar. One of them I have read three times without settling on a mark, and since my own view of the argument has been sharpened by the dinner, I would rather have a second read than mark it myself. The script is fluent and tidy, which I know tends to buy marks, and I want the comments to be about the philosophy rather than the prose. The question is worth twenty marks, split eight for part (a), six for part (b) and six for part (c), and the class was told that a bare verdict without reasons earns at most half credit on that part.

  Question 2 (20 marks).

  Clark and Chalmers argue that Otto's notebook is part of Otto's cognitive system. In presenting the case they identify three features of the notebook: it is reliably available to Otto and typically invoked when he needs the information; what it contains is directly available to him without difficulty; and he automatically endorses what he finds there rather than treating it as one source of testimony to be weighed against others. They also discuss cases in which a person solves a puzzle by physically rotating a shape on a screen with a button rather than rotating it mentally, and argue that the external operation should be counted as part of the cognitive process in the same way.

  Consider two further cases.

  Case A, Rosa. Rosa is a radiologist who reads chest films in a reading room. A laminated card of diagnostic criteria hangs on the wall at eye level. She consults it for essentially every film she reads, without deliberating about whether to consult it; the entries are legible at a glance; and she does not treat them as a second opinion to be weighed against her own judgement. She reads films by their lights. She has never worked in a room without one, and she would find reading without it a different and much harder task.

  Case B, Dev. Dev is a radiologist who uses a phone app that proposes differential diagnoses from an image. He consults it for most, though not all, films. The proposals appear quickly. He treats them as prompts: he frequently rejects or overrides them on the basis of his own reading, and he says he would not sign off on a report whose conclusion he could not independently justify.

  (a) Apply the three features to Rosa and to Dev and say, for each, whether the resource counts as part of the person's cognitive system on Clark and Chalmers's account. Be explicit about whether you take the three features to be necessary and sufficient conditions for an external resource to count as part of a cognitive system, or something weaker, and say what follows for the rotation-button case. (8 marks)

  (b) State the coupling–constitution objection to the extended mind thesis, and assess whether it defeats the claim about Rosa. (6 marks)

  (c) A classmate objects as follows: if Rosa's card is part of her cognitive system, then so is the wall it is mounted on, and then the reading room, and then the hospital, so the thesis proves far too much. Is this a good objection? Is it the same objection as the one in (b)? (6 marks)

  Student script.

  (a) Rosa's card satisfies all three features. It is reliably available and typically invoked, since a card is on the wall of every reading room and she consults it for essentially every film. Its contents are directly available without difficulty, since they are legible at a glance. And she automatically endorses them, since she does not weigh them against her own judgement but reads films by their lights. So on Clark and Chalmers's account the card is part of Rosa's cognitive system, and we should say that her memory for diagnostic criteria extends onto the wall. Dev's app fails the first feature. He consults it only for most films, not all, so it is not reliably available in the relevant sense; and an app's suggestions are not reliable in the sense that matters, since they are statistical guesses that are sometimes wrong. Since the first feature is not satisfied, the app is not part of Dev's cognitive system, and Dev is in the position of someone who occasionally asks a colleague for advice rather than someone whose memory is extended. This is the right result, because Dev's own reasoning is doing the work. I take the three features to be necessary and sufficient for an external resource to count as part of a cognitive system: they are necessary because without them we would have no principled way of distinguishing cognition from mere causal influence, and they are sufficient because once a resource is reliably available, directly readable and automatically endorsed, there is nothing left for it to do in order to qualify. It follows that the rotation-button case is a genuine case of extended cognition as well, since the external operation plays the same role in the task that a mental rotation would, and the two cases are on a par in the way Clark and Chalmers say they are.

  (b) The coupling–constitution objection is that Clark and Chalmers infer constitution from coupling. A resource's being causally coupled to a cognitive process, so that the process goes worse when the resource is removed, shows only that the resource is part of the causal story; it does not show that the resource is part of the cognitive system, any more than the fact that a calculator is coupled to my arithmetic shows that the calculator is part of my mind. The objection does not defeat the claim about Rosa. Rosa's card is not merely coupled to her reading: it satisfies all three features, including automatic endorsement, and it is therefore integrated into her cognitive system rather than being an external aid she consults. The objection has force against a view on which any causal contribution counts, but that is not the view under discussion.

  (c) The classmate's objection is the coupling–constitution objection in a different form, and it fails for the reason given in (b). If we imagine the card's contents stored in Rosa's head rather than on the wall, we would have no hesitation in calling her use of them cognitive, and that is the test Clark and Chalmers use: what would we say if the process were internal? Applying that test, the card counts as part of her cognitive system. The wall does not, because walls are not reliably available to her in the relevant sense, are not directly readable as diagnostic criteria, and are not automatically endorsed; the same goes for the room and the hospital. So the thesis does not prove too much: the three features draw the line exactly where it should be drawn.

  Please give me the mark out of twenty, a one-line summary of the script's overall quality, and then itemised comments organised by part, saying for each part what the answer gets right, what it gets wrong or leaves unsupported, and what the error should cost. If any of the student's claims are defensible rather than wrong, say so and explain why, rather than penalising disagreement with a textbook line; and if you find a mistake that is not a slip of exposition but a misunderstanding that would recur elsewhere in the course, flag it separately and say what it is. I would also like a short note on which parts of the answer a hurried marker is most likely to over-credit, and why.
reasoning: |-
  Hmm, the user is a philosophy professor who needs help marking a student essay on Clark and Chalmers' extended mind thesis. They're conflicted about grading it themselves due to fatigue and want an external assessment. The essay analyzes two radiologist cases (Rosa and Dev) through Clark and Chalmers' three criteria, and addresses common objections.

  First, I need to assess Part (a). The student correctly applies all three features to Rosa: reliability (always consulted), direct availability (legible at glance), and automatic endorsement (no second-guessing). Full marks there. For Dev, they claim he fails the first criterion because he only consults the app "for most, not all" films. But Clark/Chalmers' reliability criterion focuses on stable access, not constant use - Dev's "most films" usage likely qualifies. The student also incorrectly adds an unsupported claim about the app being "statistical guesses." Minus 2 marks: 1 for misapplying reliability, 1 for the extraneous claim.

  On necessity/sufficiency, the student's claim that the features are necessary is defensible (aligns with Clark/Chalmers), but calling them sufficient is problematic - Clark/Chalmers imply they're sufficient but don't state it outright. Still, this is minor. Rotation-button analysis is perfect. Total: 6/8.

  For Part (b), the student nails the coupling-constitution objection: distinguishing causal coupling from constitutive inclusion. Their defense of Rosa is strong, correctly noting the three features prevent the objection. Full marks: 6/6.

  In Part (c), the student brilliantly links the "slippery slope" objection to coupling-constitution and uses the three features as a boundary. They appropriately apply Clark/Chalmers' "what if internalized?" test. No errors. Full marks: 6/6.

  The hurried marker might over-credit Part (a)'s Dev analysis (due to surface plausibility) and miss the sufficiency claim issue. Overall this is an excellent script (18/20) - loses marks only on subtle missteps in Part (a). The summary should emphasize its fluency and argumentative skill while noting the specific deductions.
answer: |-
  ### Mark: 18/20  
  **Overall Quality:** Exceptionally clear, philosophically astute application of Clark and Chalmers' criteria with minor overreach in Part (a).  

  ---

  ### Itemised Comments  

  **Part (a) (6/8 marks)**  
  **✓ Correct:**  
  - Rosa’s card perfectly satisfies all three features (reliable availability, direct accessibility, automatic endorsement).  
  - Correctly identifies the rotation-button case as analogous to Rosa (aligns with Clark/Chalmers).  
  - Defensible claim that the features are *necessary* (prevents over-extension, per Clark/Chalmers).  

  **✗ Errors/Costs:**  
  - **Misapplies reliability to Dev (-1 mark):** Claims Dev’s app fails the first feature due to "most, not all" use. Clark/Chalmers emphasize *stable* access (e.g., Otto’s notebook is consulted "when needed"), not constant use. Dev’s "most films" likely meets this.  
  - **Unsupported assertion about the app (-1 mark):** Calls the app "statistical guesses" to deny reliability. This is speculative (case states proposals are "prompts," not unreliable).  
  - **Overclaim on sufficiency:** Asserts the features are *sufficient* without addressing Clark/Chalmers’ caveats (e.g., "glue and trust" conditions). Not penalized (defensible), but weakens rotation-button support.  

  **Part (b) (6/6 marks)**  
  **✓ Perfect:**  
  - Precise statement of coupling-constitution objection (confusing causal coupling with constitutive role).  
  - Strong defense of Rosa: Correctly notes the three features (esp. automatic endorsement) show integration, not mere coupling.  
  - Distinguishes the target view (functional integration) from crude causal views.  

  **Part (c) (6/6 marks)**  
  **✓ Perfect:**  
  - Correctly identifies the "slippery slope" as a variant of coupling-constitution (both challenge boundaries).  
  - Masterfully uses the three features to halt the regress: Wall/room lack reliability, readability, and endorsement.  
  - Appropriately invokes Clark/Chalmers’ "internalization test" for the card.  

  ---

  ### Crucial Misunderstanding (Flagged for Recurrence Risk)  
  **Error:** Misinterpreting "reliable availability" as requiring *constant* use (Dev’s "most films" deemed insufficient).  
  **Why it matters:** This could undermine analysis of other real-world cases (e.g., intermittent tool use like calculators). Clark/Chalmers focus on *access stability* (resource is "typically invoked" when relevant), not frequency.  

  ---

  ### Hurried Marker Over-Credit Warning  
  **Part (a) on Dev** is most vulnerable to over-crediting. Why:  
  1. **Surface plausibility:** The student’s "statistical guesses" claim *sounds* critical but lacks textual basis.  
  2. **Rosa’s strength distracts:** Flawless Rosa analysis may make Dev’s assessment seem equally rigorous.  
  3. **"Own reasoning" comment:** Hurried markers might accept "Dev does the work" as justification, though it’s irrelevant to the *functional criteria*.  

  **Feedback Recommendation:** Praise clarity and argumentation, but stress precision with textual evidence (e.g., "Avoid importing assumptions not in the case description").
