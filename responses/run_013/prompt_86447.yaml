prompt: |-
  Ok, so I'm a TA for a second-year metaphysics course and I'm putting together a handout for the week on counterpart theory vs. transworld identity, and I keep hitting the same wall. My students read the Lewis and Kripke material and come away convinced the whole debate is one binary — either a person literally exists in more than one possible world or they don't — when really the live positions are combinations of about four or five independent comittments, and half of section is people defending the same view under different names while thinking they disagree. So I want you to build me a decision tree (or taxonomy, whatever's cleaner) that starts from commitments a student can actually have an opinion about and ends at a named position, built from the logical space first and the list of names second. Every branch node should be a question phrased so a reader can answer it without already knowing where it leads — no node that's just "do you accept counterpart theory?". Here are the axes I care about in particular: whether the other worlds are concrete universes like ours or abstract representations of ways things could be, or whether the reader thinks there's nothing there to argue about at all; whether an actual individual itself shows up again at other worlds or whether cross-world talk is really about distinct world-bound individuals related by resemblance; whether an individual's modal profile is fixed by something intrinsic to it or is a partly extrinsic, context-shifting matter of overall similarity; whether the reader thinks two worlds could differ with no qualitative difference between them at all (perfect duplicates, swapped roles); and whether the only possible worlds are recombinations of what already exists or whether there can be genuinely new things. Also please pull apart people who take the counterpart idea as a mere semantics for modal talk from people who buy the whole metaphysical picture, because those two get run together constantly and it drives me up the wall.

  I need at least these leaves: full-on counterpart theory with concrete worlds; the actualist who still helps themselves to counterparts; transworld identity together with a real essentialism; the actualist who hands every individual an individual essence and locates modal properties in world-indexed predicates; the primitive-thisness view on which worlds can differ with no descriptive difference; a combinatorialism; and a quietist/deflationist leaf for the student who thinks de re modal claims aren't really truth-apt. For the diagnostic cases, use concrete ones — the statue and the lump of clay, a person who could have had entirely different parents, a world that duplicates ours up to some point and then diverges, a chair that could have been made of ice, and at least one case that forces the reader to say whether a perfect duplicate of them at another world is them or merely resembles them — rather than asking people which ism they like.

  Where the tree can't actually separate two leaves, say so instead of fudging it; my suspicion is that transworld identity plus essentialism and the individual-essence actualism will collapse into each other, but tell me if I'm wrong. And flag any branch combinations nobody in the literature seems to occupy, with a one-line guess at whether that's because the combo is incoherent, just unattractive, or simply unexplored. Please write it in American English.
reasoning: |-
  Okay, the user is a TA for a second-year metaphysics course, specifically dealing with counterpart theory versus transworld identity. They're frustrated because students see the debate as a simple binary—either literal existence across worlds or not—when it's actually more nuanced with multiple independent commitments. The TA wants a decision tree or taxonomy that breaks down the positions based on key philosophical commitments without using jargon-heavy questions. 

  First, I need to identify the core axes the user mentioned: 
  - Nature of possible worlds (concrete, abstract, or deflationary)
  - Cross-world identity (literal vs. resemblance-based)
  - Modal profile determination (intrinsic vs. extrinsic/similarity-based)
  - Haecceitism (whether worlds can differ non-qualitatively)
  - Combinatorialism vs. genuine novelty in worlds

  The user also wants to clearly separate counterpart theory as semantics versus full metaphysics, and include specific leaves like concrete counterpart theory, actualist counterparts, transworld identity, individual essences, primitive thisness, combinatorialism, and deflationism. 

  Hmm, the key challenge is designing branch questions that are accessible. Instead of asking "do you accept counterpart theory?", I should use concrete cases like: 
  - If there's a perfect duplicate of you in another world, is it you? (tests transworld identity vs counterpart)
  - Could a chair be made of ice? (tests essentialism)
  - Could someone have different parents? (tests origin essentialism)
  - Can two worlds differ only by swapped particles? (tests haecceitism)

  I notice the user suspects transworld identity + essentialism might collapse into individual-essence actualism. I should analyze that—they're similar but the latter uses world-indexed properties and avoids literal cross-world existence, so they're distinct leaves. 

  For the structure, I'll start with the most fundamental question about truthmakers for modal claims to separate deflationists early. Then branch into nature of worlds, then cross-world identification. The "modal profile" branch will handle intrinsic/extrinsic determination, leading to counterpart semantics. Finally, haecceitism and combinatorialism as late branches since they're narrower. 

  I should flag underoccupied positions, like: 
  - Concrete worlds + transworld identity (incoherent? Lewis would object) 
  - Abstract worlds + resemblance + intrinsic modal profiles (unattractive? makes similarity redundant) 
  - Deflationism + haecceitism (unexplored? deflationists usually avoid such metaphysics)

  The user emphasized American English, so I'll avoid British spellings and keep examples culturally neutral (statue/clay is perfect). Diagnostic cases should be vivid: duplicate worlds for haecceitism, ice chair for essentialism, divergent worlds for combinatorialism. 

  This taxonomy should help students see why Kripkeans and Lewisians talk past each other—e.g., both might say "I could've been a fish" but mean radically different things (literal transworld existence vs. counterpart resemblance). The semantics/metaphysics split is crucial here; I'll add warnings where positions like actualist counterparts risk conflation. 

  Finally, I'll note where leaves genuinely differ (e.g., individual essences vs primitive thisness—one has descriptive haecceities, the other non-qualitative) and where combos are unstable (like concrete worlds + transworld identity violating isolation). The user's suspicion about collapsing views is mostly wrong—they're adjacent but separable.
answer: |-
  Here’s a decision tree that breaks down the logical space of positions on modality, starting from concrete intuitions and ending at named views. Each branch is phrased as a question about cases, avoiding jargon. Positions collapse only where unavoidable, and unexplored/incoherent branches are flagged.

  ### Core Diagnostic Cases
  1. **Duplicate You**: A world *exactly* like ours in every qualitative detail (particles, history, etc.) contains a person indistinguishable from you. Is that person **you**, or just a *perfect duplicate*?  
  2. **Ice Chair**: Your wooden desk chair – could it have been *made entirely of ice* (same shape, function, location in history), or would that be a different chair?  
  3. **Different Parents**: Could *you* have been born to completely different biological parents?  
  4. **Swapped Worlds**: Could two distinct possible worlds be *qualitatively identical* (same distribution of particles, events, etc.) but differ *only* in which individual is which (e.g., you and I are "swapped")?  
  5. **New Stuff**: Could there be a possible world containing a fundamentally *new kind of entity* (e.g., a particle not composed of quarks/strings/whatever our physics uses)?  

  ---

  ### The Decision Tree

  #### Step 1: What makes de re modal claims ("I could have been a sailor") true or false?
  *   **(A) Nothing objective does; these claims aren't genuinely true/false about the world.** → **DEFLATIONIST/QUIETIST** (Leaf 1: e.g., Carnapian conventionalism, some Wittgensteinians)  
  *   **(B) Something objective in reality makes them true/false.** → Proceed to Step 2.

  #### Step 2: What is the nature of "other possibilities" or "ways things could have been"?  
  *   **(A) They are fully real, concrete universes, parallel to ours, just as real as distant galaxies.** → Proceed to Step 3 (Concrete Realism).  
  *   **(B) They are abstract objects (like stories, models, or sets of propositions) that *represent* ways reality could be.** → Proceed to Step 4 (Actualism).  
      *   *Note: Deflationists (Step 1A) are already out.*

  #### Step 3 (Concrete Realism): In the *Duplicate You* case, is the person in that other universe **you**?  
  *   **(A) Yes, that *is* me, literally existing over there.** → **TRANSWORLD IDENTITY** (Leaf 2: *Requires an account of essences!* Proceed to Step 5 to see *which kind*).  
      *   *Warning: This + Concrete Realism is rare. Lewis argues it violates "isolation" of worlds. Most who hold TWI are Actualists (Step 4).*  
  *   **(B) No, it's just a duplicate *counterpart* of me, related by resemblance.** → Proceed to Step 6 (Counterpart Framework).  

  #### Step 4 (Actualism): How do we talk about *this individual* (e.g., you) having properties in other possibilities (e.g., being a sailor)?  
  *   **(A) This individual *itself* literally exists in (or is "present at") those other abstractly conceived worlds.** → **TRANSWORLD IDENTITY** (Leaf 2: *Requires an account of essences!* Proceed to Step 5).  
  *   **(B) We don't need the *same individual* elsewhere. We use *representatives* (counterparts) in other worlds defined by similarity.** → **ACTUALIST COUNTERPART THEORY** (Leaf 3: e.g., Hazen, Fara, Forbes (sometimes)). *Proceed to Step 6 to see if it's semantic or metaphysical.*  
  *   **(C) The individual only exists here. Its modal properties are captured by its having world-indexed properties (e.g., "being-sailor-at-W") or an individual essence.** → **INDIVIDUAL ESSENCE ACTUALISM** (Leaf 4: e.g., Plantinga, Adams (early)).  

  #### Step 5 (Essentialism for TWI - Steps 3A or 4A): What fixes *which* properties an individual must have in *all* worlds where it exists? (e.g., for the *Ice Chair*)  
  *   **(A) Something intrinsic to the individual itself (its matter, origin, fundamental "whatness").** → **TRANSWORLD IDENTITY + REAL ESSENTIALISM** (Leaf 5: e.g., Kripke's paradigmatic view).  
  *   **(B) Primitive non-qualitative identity ("thisness") - the individual is just *this thing*, regardless of description. What's essential is just being *it*.** → **PRIMITIVE THISNESS/HAECCEITISM** (Leaf 6: e.g., Adams (later), Rosenkrantz). *Proceed to Step 7 (Swapped Worlds).*  

  #### Step 6 (Counterpart Framework - Step 3B or 4B): What determines an individual's modal profile (what it *could* be/do)?  
  *   **(A) The intrinsic properties of the individual *itself* fix the range of counterparts it can have.** → *Warning: This is unstable!* Resemblance becomes constrained by intrinsic nature. Leans towards essentialism. (Rare/Unattractive combo).  
  *   **(B) Counterpart relations are based on *overall similarity*, which can shift with context/conventions. Modal properties are extrinsic.** → **FULL-ON COUNTERPART THEORY** (if from Step 3B - Leaf 7: Lewis) OR **COUNTERPART SEMANTICS** (if from Step 4B - Leaf 3). *Proceed to Step 8 (Combinatorialism).*  

  #### Step 7 (Haecceitism - Step 5B): Could there be *Swapped Worlds* (qualitatively identical but differing only in which haecceity is where)?  
  *   **(A) Yes. Non-qualitative identity facts are fundamental and can vary independently.** → **PRIMITIVE THISNESS/HAECCEITISM** (Leaf 6: Confirmed).  
  *   **(B) No. If worlds are qualitatively identical, they are identical *simpliciter*. No room for primitive "swaps".** → *Incoherent?* Haecceitism (Step 5B) typically *entails* (A). If you reject swaps, you likely aren't a true haecceitist. (Leans back towards descriptive essentialism - Leaf 5).  

  #### Step 8 (Combinatorialism - Any non-Deflationist, non-Quietist leaf): Could there be *New Stuff* (worlds with fundamentally novel kinds of entities)?  
  *   **(A) No. All possibilities are just rearrangements/recombinations of the actual fundamental kinds of entities/universals.** → **COMBINATORIALISM** (Leaf 8: e.g., Armstrong, Skyrms). *Can be combined with TWI, Actualist Counterparts, or Individual Essences.*  
  *   **(B) Yes. Possibility isn't limited by what actually exists; genuinely new kinds are possible.** → *Your leaf remains the same (Leaves 2-7), but you reject Combinatorialism.* (Most common position).

  ---

  ### Key to Leaves & Notes
  1.  **DEFLATIONIST/QUIETIST:** Rejects objective truthmakers for de re modality. (e.g., "Talking about what *could* have been is just a linguistic convention, not about deep reality").
  2.  **TRANSWORLD IDENTITY + REAL ESSENTIALISM:** Individuals exist in multiple worlds (concrete or abstract); their modal limits come from intrinsic essential properties (e.g., Kripke: You *must* have originated from the sperm/egg you did; the chair *must* be originally made of wood).
  3.  **ACTUALIST COUNTERPART THEORY:** Worlds are abstract; de re modal claims are made true by *distinct*, world-bound representatives (counterparts) selected by context-dependent similarity. (e.g., "I could have been a sailor" is true because a *similar-enough person* in another abstract world is a sailor).
  4.  **INDIVIDUAL ESSENCE ACTUALISM:** Only the actual world and its inhabitants are real. Each individual has an essence (often a highly specific world-indexed description - e.g., "being the unique individual originating from sperm S and egg E in world W@"). Modal claims reduce to this essence. (*Distinct from Leaf 5:* Avoids literal transworld existence; essences are abstract, not intrinsic "stuff").
  5.  **TRANSWORLD IDENTITY + REAL ESSENTIALISM:** (See Leaf 2 above).
  6.  **PRIMITIVE THISNESS/HAECCEITISM:** Identity is primitive ("thisness"). Essential properties may be minimal (just being *this* thing). Allows non-qualitative differences between worlds (Swapped Worlds). Compatible with TWI or possibly robust Actualism. (e.g., Adams: What makes you *you* is a primitive "haecceity," not your properties).
  7.  **FULL-ON COUNTERPART THEORY (Concrete Worlds):** Concrete parallel universes exist. Individuals are world-bound. De re modality is about counterparts linked by similarity. Modal profiles are extrinsic/context-dependent. (Lewis's view).
  8.  **COMBINATORIALISM:** Possibility is exhausted by recombining/spatiotemporally redistributing the fundamental entities and kinds *actually* instantiated. (Can be layered onto many views above).

  ---

  ### Clarifications & Collapses
  *   **TWI + Essentialism (Leaf 5) vs. Individual Essence Actualism (Leaf 4):** *These do NOT collapse.* Leaf 5 requires the *same individual* literally existing in multiple worlds with intrinsic essential properties. Leaf 4 denies literal existence in other worlds; the essence is an abstract property (often descriptive/world-indexed) that the *actual* individual has. Kripke (Leaf 5) vs. Plantinga (Leaf 4) is the key contrast.
  *   **Counterpart Theory as Semantics (Leaf 3) vs. Metaphysics (Leaf 7):** *Crucially distinct.* Leaf 3 uses counterparts as a semantic device *within actualism* to interpret modal talk. Leaf 7 (Lewis) is a full-blooded metaphysical commitment to concrete pluriverse and world-bound individuals. Students constantly conflate these.
  *   **Unexplored/Incoherent Combos:**
      *   **Concrete Worlds + TWI (Step 3A):** Lewis argued this violates the spatiotemporal isolation of worlds. Few defend it. (*Incoherent? Or just unmotivated?*)
      *   **Resemblance (Counterpart) + Intrinsic Modal Profile (Step 6A):** If intrinsic nature *fixes* counterparts, why invoke resemblance? Unstable/Unattractive.
      *   **Deflationism + Haecceitism (Steps 1A + 7A):** Deflationism typically avoids robust metaphysics like primitive thisness. (*Unexplored?*)
      *   **Combinatorialism + Genuine Novelty (Step 8B + Leaf 8):** Contradictory. (*Incoherent*).

  This tree forces students to confront their intuitions on concrete cases first, revealing the underlying commitments that generate the various "named" positions. It highlights the independence of axes (world concreteness, identity vs. counterparts, essentialism source, haecceitism, combinatorialism) and separates semantic vs. metaphysical uses of counterparts.
