       On the other hand, if the results show that Condition C is slow (like Condition B), supporting Orwellian, then the Stalinesque defender might argue that the unconscious processing of the first flash caused the same distraction as conscious processing. This might be true, but we can then run additional experiments to measure unconscious distraction (e.g., with masking). If it turns out that unconscious distraction is less than conscious distraction, then the Stalinesque account would be challenged.

