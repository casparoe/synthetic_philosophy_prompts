       Orwellian: Expect a longer reaction time to the tone in the two-flash condition compared to a condition with no flash (because of distraction by the first flash).

       Stalinesque: Expect the same reaction time as in the baseline with no flash? Because the observer is not aware of the flash until after the second flash. But note: the flash might still cause unconscious distraction. So we need a control condition that has an unconscious flash? How?

     We can compare:

       Condition A: Tone alone (baseline).
       Condition B: First flash, then tone (without second flash). This condition will have the flash consciously experienced (both accounts would agree that without the second flash, the observer experiences the first flash and the tone). So reaction time in Condition B might be longer than in Condition A because of distraction by the flash.

