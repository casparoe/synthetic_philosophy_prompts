     However, let's stick with the original design and see if the Stalinesque defender can absorb the outcome by moving the revision step.

     Suppose we get the result that Condition C is fast (like Condition A). The Orwellian might say: "No, the reaction time is slow but the memory of the reaction time is rewritten to be fast." But that is impossible because the reaction time is measured by the computer. We are not relying on the subject's report of their reaction time. The computer records the time of the tone and the time of the button press. So the Orwellian cannot rewrite that.

