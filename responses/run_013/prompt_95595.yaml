          In Condition C, the observer experiences the first flash at time 0. Then at time 50 ms, the tone occurs. The observer is distracted by the visual experience (the first flash) and so the reaction time is slowed. Then at 150 ms, the second flash occurs. After that, the memory of the first flash and the tone is rewritten to fit the narrative of the moving dot. However, the motor response to the tone occurred at the time of the tone and cannot be rewritten. Therefore, the reaction time in Condition C is slow (like in Condition B) because it was recorded at the time of the tone when the observer was distracted by the first flash.

       Stalinesque telling:
          In Condition C, the brain receives the first flash and then the tone. However, it is holding off on conscious experience until after the second flash. Therefore, at the time of the tone (50 ms), the observer is not aware of the first flash. There is no conscious visual distraction. So the reaction time to the tone is as fast as in Condition A (tone alone). Only after the second flash (at 150 ms) does the brain construct the illusion and present it to consciousness. Therefore, the reaction time in Condition C is fast (like Condition A) and faster than Condition B (where the first flash was presented and became conscious before the tone, causing distraction).

     What becomes of the case if the critical feature (the second flash) is removed? Then we have Condition B, which both accounts would agree should show a slow reaction time because the first flash is experienced and distracts. Without the second flash, the Stalinesque account does not hold off consciousness.

     Now, the key question: what if the defender of the losing account tries to move the revision a step later?

     Suppose the experiment shows that Condition C has a fast reaction time (like Condition A) and Condition B has a slow one. This supports the Stalinesque account. How might an Orwellian defender respond?

       They might argue: the revision process (which rewrites the memory) does not just change the memory of the flashes but also the memory of the tone. It could change the memory of the reaction time as well? But the reaction time is a physical measurement: the time between the tone and the button press. That cannot be rewritten. So the data is fixed.

       Alternatively, the Orwellian might argue that the reaction time was not affected by the first flash because the brain had already started constructing the illusion? But that would be to adopt the Stalinesque mechanism. The Orwellian is committed to the experience of the first flash at the time it happened.

     On the other hand, if the experiment shows that Condition C has a slow reaction time (like Condition B), supporting Orwellian, how might a Stalinesque defender respond?

       They might argue that the brain, in constructing the illusion, must have started processing the first flash before the second flash arrived, and that this unconscious processing was enough to cause distraction. Therefore, even though the observer was not conscious of the first flash at the time of the tone, the unconscious processing still caused a delay in the reaction time. Thus, Condition C would be slow (like Condition B) and the Stalinesque account would be saved.

