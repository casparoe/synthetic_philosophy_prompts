prompt: |-
  I am a student in a course on probability and evidence, and I am trying to write a position paper that states my own view of how probabilities should guide belief and action. Before I commit to it, I want an audit of whether the commitments hang together. Here is what I believe. (1) There is a fact of the matter about the probability of a singular event, and it is fixed by the most specific reference class for which we have reliable frequency data. (2) That probability is an objective chance, not merely a credence; the Principal Principle is correct, so a rational agent should align their credence with known chances. (3) When two reference classes of comparable specificity give different frequencies, the correct one is the class whose defining features are causally relevant to the outcome; statistical correlation without causal relevance is not enough. (4) In legal factfinding, bare statistical evidence should not suffice for conviction or liability, even when the frequency is high and the reference class is well defined. (5) In clinical and actuarial decision-making, base rates should be used, and it is a mark of irrationality to ignore them in favor of unstructured individual judgment. (6) When no frequency data are available, the principle of indifference is a legitimate fallback for assigning probabilities over symmetric possibilities. (7) The same basic epistemic standards govern legal, clinical, and everyday reasoning; differences between these domains are differences in the costs of error, not in what counts as evidence. To make the contrast concrete: I think a clinician who ignores a well-established base rate for a condition is making an epistemic mistake, but I also think a prosecutor who offers only a well-established base rate for a criminal defendant has not met the standard of proof, even if the base rate is higher than the clinician's.

  I suspect at least some of these pull against each other, but I do not know which. Please tell me which pairs are genuinely in tension, which only appear to be, and how severe each genuine tension is. For each genuine tension, say what would have to give and what the cheapest revision would cost me. I would also like to know which single commitment is doing the most damage to the rest, and whether there is a way to keep the package while making only a small adjustment. Please be specific about the reference-class problem, Simpson-style reversals, and the distinction between probability as a guide to belief and probability as a guide to legal proof.
reasoning: |-
  Okay, the user is a student in a probability and evidence course working on a position paper. They've outlined seven commitments about how probabilities should guide belief and action and want an audit for coherence. I need to analyze where tensions exist, especially regarding reference classes, causal relevance, and differing standards across legal, clinical, and everyday contexts.

  First, looking at their commitments: 
  (1) advocates using the most specific reference class with reliable frequency data for singular events. 
  (2) treats this as objective chance requiring credence alignment via Principal Principle. 
  (3) adds a causal relevance filter when reference classes conflict. 
  (4) rejects bare statistics for legal proof. 
  (5) mandates base rates in clinical/actuarial decisions. 
  (6) accepts indifference principle as fallback. 
  (7) insists on uniform epistemic standards across domains, attributing procedural differences to error costs only.

  The most glaring tension is between (1-3) and (4). If reference-class probabilities are objective chances that should guide rational belief (per 1-2), why can't high-probability statistics suffice for legal convictions? The user acknowledges this by contrasting clinicians (who must use base rates) with prosecutors (who can't rely solely on them). Their causal relevance criterion (3) attempts to resolve reference-class conflicts but doesn't explain the legal prohibition—since a well-defined, causal reference class (e.g., "DNA match in rape cases") still wouldn't suffice for conviction under (4). This suggests (4) isn't just about evidence quality but about normative standards of proof, conflicting with (7)'s claim of uniform epistemology.

  Another tension exists between (3) and (6). The causal relevance requirement implies probabilities require substantive knowledge of mechanisms, but the indifference principle (6) assigns probabilities based purely on symmetry without causal justification. This could lead to contradictions: e.g., assigning 50% probability to a coin being biased via indifference, even when causality suggests otherwise.

  (7) also clashes with domain practices. In law, standards like "beyond reasonable doubt" intentionally exceed what's epistemically optimal, prioritizing false convictions over false acquittals. Clinical settings balance different errors (e.g., false positives vs. false negatives), but the user's framework reduces this to mere cost differences while retaining identical evidence evaluation—which doesn't align with (4)'s outright rejection of statistical evidence in law.

  For resolutions: 
  - Softening (4) to allow statistics as evidence but not proof preserves most commitments. 
  - Clarifying that (7) permits domain-specific decision thresholds (though they call this "epistemic"). 
  - Replacing indifference (6) with imprecise credences avoids causal clashes. 

  The most damaging commitment is (7)'s insistence on uniform epistemology; relaxing it to allow procedural variations would resolve key tensions cheaply. The reference-class problem is mitigated by (3)'s causal filter but not eliminated—Simpson's paradox could still arise if causal relationships are misidentified.
answer: |-
  Your position is philosophically rich but contains genuine tensions—particularly between objective probability demands and legal proof standards. Below, I analyze conflicts using your numbering, assess severity, and propose minimal revisions. The core tension is **commitment (7) (uniform epistemic standards) conflicting with (4) (legal rejection of bare statistics)**, but others exist.

  ### Key Tensions & Resolutions
  1. **Severe Tension: (1–3) vs. (4)**  
     - **Conflict:** (1–3) imply that well-defined, causal reference-class probabilities *are* objective chances and *should* guide rational belief (via (2)). Yet (4) states that even high-probability statistics (e.g., "99% of DNA matches in this class are correct") cannot suffice for legal conviction. If the same epistemic standards govern all domains (per (7)), this inconsistency threatens coherence.  
     - **Why it arises:** Legal proof requires *individualized* evidence to mitigate moral risks (e.g., convicting innocents via statistical flukes). Your causal criterion (3) doesn't resolve this—a reference class can be causal *and* specific (e.g., "defendants with matching DNA, motive, and opportunity") yet still lack narrative specificity courts demand.  
     - **Cheapest revision:** Soften (4) to: *"Bare statistical evidence is insufficient for conviction **unless** it meets (3)'s causal relevance criterion and no individualized exculpatory evidence exists."* This preserves skepticism about "base rates alone" (e.g., racial profiling statistics) but allows DNA/match statistics *if* causally integrated.  
     - **Cost:** Weakens the boldness of your legal position but aligns with (1–3,7).

  2. **Moderate Tension: (3) vs. (6)**  
     - **Conflict:** (3) requires causal relevance to resolve reference-class conflicts, implying probabilities depend on *substantive knowledge* of mechanisms. (6) uses the principle of indifference (PoI) in ignorance, assigning probabilities based on *symmetry* (e.g., 50% for a coin being biased without data). PoI can contradict causal knowledge (e.g., assigning 50% to "this unknown chemical causes cancer" ignores biological constraints).  
     - **Why it arises:** PoI is a purely logical tool; (3) injects metaphysics. Simpson's paradox illustrates: If Class A (men) has higher recovery rates than Class B (women) for a drug, but within age groups women do better, (3) prioritizes age *if causally linked to recovery*. PoI couldn't resolve this—it might assign equal probability to contradictory reference classes.  
     - **Cheapest revision:** Restrict (6) to cases with *genuine symmetry* (e.g., coin flips) *and* no causal priors. Add: *"PoI yields defeasible probabilities; causal knowledge overrides it."*  
     - **Cost:** Minimizes clash but admits PoI isn't fully "legitimate" without causal scrutiny.

  3. **Moderate Tension: (4) vs. (5) vs. (7)**  
     - **Conflict:** (5) mandates base rates in clinical decisions (e.g., treating a patient based on 95% disease prevalence in their cohort). (4) forbids analogous reasoning in law (e.g., convicting based on 95% guilt in a defendant's cohort). (7) insists epistemic standards are identical, attributing differences only to error costs. But legal rejection of statistics isn't just about costs—it reflects deeper norms about *agency* and *individual responsibility* absent in clinical contexts.  
     - **Why it arises:** Clinicians face aggregate outcomes (e.g., "treatment works for 80%"); courts decide *particularized* blame. High error costs in law amplify the need for causal/narrative evidence beyond frequencies.  
     - **Cheapest revision:** Reframe (7): *"Epistemic standards are continuous, but **pragmatic constraints** (e.g., moral risks, stakes) justify domain-specific rules for action."* This keeps epistemology uniform while accepting that legal "proof" is a hybrid norm.  
     - **Cost:** Concedes that "what counts as sufficient proof" isn't purely epistemic.

  4. **Mild Tension: (1) vs. (3)**  
     - **Conflict:** (1) prioritizes the *most specific* reference class; (3) overrides specificity for *causal relevance*. These can clash: e.g., the most specific class (e.g., "left-handed redheads in Tucson") may lack causal ties to an outcome, while a broader class (e.g., "smokers") is causal.  
     - **Resolution:** (3) already resolves this by subordinating specificity to causality. No revision needed—commitments are compatible if (3) trumps (1) when classes conflict.

  ---

  ### The Most Damaging Commitment: (7)
  **(7) does the most damage** by demanding identical epistemic standards everywhere. Legal proof *is* epistemically distinct: it requires eliminating *reasonable doubt* through individualized evidence, not just high probability. Clinical decisions prioritize aggregate outcomes. Insisting on uniformity forces contradictions like accepting base rates in medicine (per (5)) but rejecting structurally similar evidence in law (per (4)).  

  **Minimal adjustment:** Replace (7) with:  
  > *"The same basic principles of probability govern belief across domains, but **standards for action** incorporate contextual values (e.g., liberty, health). Differences in proof burdens reflect these values, not evidence itself."*  

  This retains core epistemology while acknowledging law's unique norms. Cost: You concede that "sufficiency for conviction" isn't purely evidence-based.

  ---

  ### Reference-Class Problem & Simpson's Paradox
  - Your (1)+(3) **improves** standard reference-class approaches by adding causal relevance. This avoids Simpson's paradox (where aggregated data reverses subgroup trends) by selecting classes tied to mechanisms.  
    - *Example:* A drug improves recovery in men and women separately but not overall. (3) picks gender-specific classes if gender is causal—avoiding the reversal.  
  - **Remaining risk:** Causal knowledge may be incomplete. If two causal classes conflict (e.g., genetics vs. environment), you need a hierarchy—e.g., prefer direct causes over distal ones. Consider adding: *"When causal classes conflict, prioritize the most proximate cause."*

  ---

  ### Final Recommendations
  1. **Revise (4) and (7)** as above to resolve the severe tension.  
  2. **Clarify (6)** to subordinate indifference to causal knowledge.  
  3. **Keep (1)–(3), (5)**—they cohere well and address reference-class issues robustly.  

  Your framework is largely defensible with these tweaks. The core insight—that probabilities should be causal, objective, and action-guiding but sensitive to moral stakes in law—is consistent. By refining (4) and (7), you preserve most commitments while acknowledging law's distinctive burdens.
