            - Extra move is never a disadvantage: false. Taking a token can be a disadvantage (if it makes you take the last token).

          So it breaks premise 3.

          And indeed, the first player loses.

          So Card 3 is the token game. 

     But note: the token game is not a modification of Ferries. It's a new game. We'll present it as a variant.

     Alternatively, we can have all three cards as Ferries modifications, but then we need a Ferries modification where the first player loses. That's hard. 

     Given the time, I think using the token game is acceptable.

     So the three cards:

     Card 1 (Ferries, asymmetric board): breaks symmetry.
     Card 2 (Ferries, can pass -> draws possible): breaks no-draws.
     Card 3 (Token game): breaks the "extra move doesn't hurt" and also note: this game has a known outcome (first player loses).

     What to expect for each:

     Card 1: The group should say that the board is asymmetric, so the second player might have a winning strategy. The argument doesn't hold. The argument only says that the second player cannot have a winning strategy if the game is symmetric. Here, it might be that the second player wins.

     Card 2: The group should say that draws are now possible. The argument shows that the second player cannot have a winning strategy, but the first player might not have a winning strategy either because the game could be drawn.

     Card 3: The group should say that an extra move can be bad (because you might be forced to take the last token). In the strategy-stealing argument, if the first player makes an extra move (takes one token) and then tries to steal the second player's strategy, it might backfire. And in fact, we know the first player loses.

     And the argument still might give: for Card 1, nothing. For Card 2, it still shows the second player cannot have a winning strategy. For Card 3, the argument doesn't even start because the extra move can hurt.

     The card that doesn't really break what it's supposed to: 
          In Card 1, we break symmetry, but we also might have broken the no-draw property? We didn't, because the board is still a Hex-like board with a cell removed, and it is still a fact that one player must win? Actually, no: by removing a cell, we might have disconnected both players? But in Hex, even with a cell removed, the no-draw property holds if the board is simply connected? I'm not sure. But we don't need to go into that. The point is that the strategy stealing requires symmetry.

     So it's fine.

   Debrief (after the break-it round):

     - General schema: 
          "The strategy-stealing argument has three key premises: 
            1. The game is ______ (symmetric). 
            2. The game has no ______ (draws). 
            3. Having an extra move of your own is never a ______ (disadvantage). 
          Then, the argument shows that the ______ (second) player cannot have a winning strategy. And because there are no draws, this implies that the ______ (first) player must have a winning strategy."

     - Map from the room: 
          - We noticed in small games that sometimes the first player wins, sometimes the second (due to mistakes). 
          - We then saw that on a large board, we were confident the first player wins without knowing how. 
          - The argument: we assumed the second player has a winning strategy and then showed that the first player can steal it and win, leading to a contradiction. 
          - The physical enactment (with the volunteer) showed the process of stealing. 
          - The break-it cards showed that if any premise fails, the argument collapses.

     - What you have to assert: 
          - The no-draws property (topological fact for Hex) is asserted without proof. 
          - The property that an extra stone never hurts (in the original Ferries) is also asserted without proof (but it's intuitive: having an extra stone can only help your connections).

     - Also, note: the argument doesn't construct a winning strategy for the first player; it only proves that one exists.

   What goes wrong the first time:

     - Students might not believe the no-draws property. Be prepared to show them on a 4x4 board that every filled board has a winner (by filling a board arbitrarily and showing one player wins). 
     - The strategy-stealing argument is subtle: students might not see why the first player wins by stealing. They might think the arbitrary moves ruin it. Emphasize: the extra stone doesn't hurt, so even if you make an arbitrary move, you are at least as well off as if you hadn't made the extra stone and had followed the strategy perfectly. 
     - In the break-it round, they might not see which premise is broken in the token game. Be ready to ask: "If the first player makes an extra move (takes one token) and then tries to steal the second player's strategy, could that extra move force them to take the last token and lose?" 
     - The physical enactment might be chaotic because the volunteer doesn't have a real strategy. Stress that we are assuming the second player has a winning strategy and we are showing how to steal it, regardless of what it is.

   What the activity can't do:

     - The activity cannot prove the no-draws property. We have to assert it. 
     - The activity cannot prove that an extra stone never hurts in Ferries. We rely on intuition. 
     - The activity does not provide a constructive proof. We never find a winning strategy for the first player. We only know it exists. 
     - We should not pretend that the activity showed how to win. We only showed that there is a win. 
     - Also, the activity does not cover the full generality of the strategy-stealing argument (which can apply to other games). We are focused on Ferries.

   Given the complexity, we've done our best.
