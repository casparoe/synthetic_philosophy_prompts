  ### Materials and Setup (~150 words)  
  **Boards:** Print 4×4 rhombus boards (hexagonal cells) for initial play and 7×7 boards for the challenge. Use two colors (e.g., blue/red) for ferry tokens.  
  **Rule Sheets:** Explain: "Players (NE/SW vs. NW/SE) alternate placing ferries on empty cells. Win by connecting your shores with an unbroken chain. No draws possible—topological fact (take my word for small boards)."  
  **Break-it Cards:** Three laminated cards (details below).  
  **Setup:** Arrange tables in pairs. Distribute 4×4 boards, rule sheets, and tokens. Display a large 7×7 board on the whiteboard. Place chocolate bar visibly.  

  ### Run of Show (~500 words)  
  **0–10 min:** Intro + Play  
  - *You:* "Pair up. Play two 4×4 games—switch who starts first. Find out what wins games." Circulate, clarify rules.  
  **10–15 min:** Group Share  
  - *You:* "What did you notice? Who won? Any draws?" (Students report: first/second won sometimes; no draws.)  
  **15–25 min:** Challenge Setup  
  - *You:* "Now, 7×7. I bet no one can beat me as second player. Win this chocolate by beating me *as second player*—but I’ll be first. Who’s in?" (Pause; likely no takers.) "Why won’t anyone try?"  
  **25–40 min:** Brainstorm  
  - *You:* "In pairs: Why can’t the second player have a winning strategy?" Circulate. If stalled:  
    - *Nudge 1:* "Suppose second player *has* a winning strategy. How could first player use it?"  
    - *Nudge 2:* "What if first player makes a throwaway move, then copies second’s strategy?"  
    - *Nudge 3:* "What if the ‘copy’ move is already taken? Can an extra ferry hurt you?"  
  **40–50 min:** Enactment (Key Moment)  
  - Pick a volunteer (V) as "second player." Use whiteboard 4×4.  
  - *You (first player):* Place ferry arbitrarily (e.g., center).  
  - *V (second player):* Places ferry.  
  - *You:* "Now, I ignore my first move. V, if this were your first move, what would your winning strategy say to play next?" V points to a cell.  
  - *You:* "If that cell’s empty, I play there. If taken (by my first move), I play randomly elsewhere." Repeat for 2–3 turns.  
  - Conclude: "I’m using V’s strategy but started earlier. My extra ferry doesn’t block me—it might even help. So if V’s strategy wins for second player, I win as first. Contradiction!"  
  **50–55 min:** Conclusion  
  - *You:* "So what can we say about the second player?" (Students: "Can’t have a winning strategy.") "And since no draws…?" (Students: "First player must win!")  
  **55–75 min:** Break-it Cards  
  - Divide into three groups. Each gets one card (below). 5 min to discuss: "Which premise breaks? What can the argument still prove?"  
  **75–85 min:** Group Reports  
  - Each group shares. Discuss nuances.  
  **85–90 min:** Final Challenge  
  - *You:* "Chocolate for anyone beating me as second player on 7×7." Students refuse. "Why?" (They articulate the argument.)  

  ---

  ### Break-it Cards (~300 words)  
  **Card 1: Asymmetric Shores**  
  *Rules:* "Player 1 connects A↔B; Player 2 connects C↔D. Board is a rectangle (not rhombus) with C↔D shorter."  
  *Breaks:* **Symmetry** (board/objectives asymmetric).  
  *Expect:* Students note stealing fails—second player’s strategy might not work for first. Argument gives nothing.  

  **Card 2: Passes Allowed**  
  *Rules:* "A player may pass. Two consecutive passes = draw."  
  *Breaks:* **No draws** (draws possible).  
  *Expect:* Argument still shows "second player can’t have a winning strategy," but first player might not win (could draw).  

  **Card 3: Blocking Ferries**  
  *Rules:* "Placing a ferry on a ‘stormy’ cell (marked centrally) destroys adjacent ferries. Storms help no one."  
  *Breaks:* **Extra move can’t hurt** (your move might wreck your position).  
  *Expect:* Students spot the harm—stealing fails because first player’s extra move could backfire.  
  *Note:* Card 2 is the "doesn’t fully break" card. Students might think "no draws" still holds since passes aren’t forced, but the rule change *allows* draws, breaking the premise.  

  ---

  ### Debrief (~350 words)  
  **Schema Template:**  
  *"The argument relies on:  
  1. ______ (symmetry) between players.  
  2. No ______ (draws).  
  3. An extra move never ______ (harms you).  
  It proves the ______ (second) player can’t have a winning strategy.  
  With no draws, ______ (first) player must win."*  

  **Map to Session:**  
  - *Symmetry:* Ferries’ rules/shores were identical (until Card 1).  
  - *No Draws:* Asserted topologically; confirmed in small games (Card 2 broke this).  
  - *Extra Move Harmless:* Enacted physically—your throwaway ferry didn’t hurt (Card 3 broke this).  
  - *Conclusion:* "Second can’t win" emerged from stealing; "first wins" required no draws.  

  **What You Assert (Don’t Prove):**  
  - No draws (topology beyond scope).  
  - Extra ferry never harms (intuitive but not proven—e.g., it can’t disconnect your chain).  

  ---

  ### What Goes Wrong the First Time (~200 words)  
  1. **Enactment Confusion:** Volunteer struggles to "have a strategy." *Fix:* Pre-brief V: "Pick cells arbitrarily—we’re pretending you have a plan."  
  2. **Overlooking "No Draws":** Students might say, "Second can’t win, so first wins," without mentioning draws. *Fix:* Ask: "What if the game could end without a winner?"  
  3. **Break-it Card Missteps:** Groups might think Card 2 (passes) "doesn’t change much" (since passes are optional). *Fix:* Ask: "Can both players avoid losing by passing forever?"  
  4. **Stealing Feels Magical:** Students might think the argument gives a strategy. *Fix:* Stress: "We proved existence, not how to win. Can you tell me how to beat you on 7×7?" (They can’t.)  

  ---

  ### What the Activity Can’t Do (~150 words)  
  - **It can’t prove the premises.** You assert no draws and "extra move harmless" as axioms. Students must accept these for Hex (they’re true, but proofs require topology/combinatorics).  
  - **It can’t replicate "no constructive strategy."** Students *experience* lacking a strategy (via the 7×7 challenge), but the game itself doesn’t highlight why finding one is hard—you must explicitly say: "We know a winning strategy exists, but even experts don’t know it for large boards!"  
  - **Don’t pretend it shows:** The universality of strategy stealing. Hex is a "perfect" example; most games lack symmetry or have harmful moves. Say: "This is a rare trifecta—usually, at least one premise fails."
