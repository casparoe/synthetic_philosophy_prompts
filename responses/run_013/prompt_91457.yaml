prompt: |-
  I'm a TA for a 400-level seminar on moral uncertainty, and I'm grading the midterm. I've been staring at one student's answer for way too long and I definately need a second opinion. You're a professional philosopher who specializes in normative ethics and decision theory under moral uncertainty, so please think carefully and help me out. Start by brainstorming what a perfect answer to this question would include, then compare the student's answer to that, then give me a grade (letter or 0-100) and detailed, point-by-point comments. I need to know what's right, what's wrong, what's unclear, and what would improve it. If there are subtle mistakes, flag them and explain why they matter. Don't just say it's good or bad. Also, don't worry about citations or bibliographies; I just want the philosophical assessment. Please structure your comments by part (a), (b), (c), and then give an overall grade.

  Here's the exam question:

  Suppose an agent has credence 0.7 in a totalist consequentialist theory C and 0.3 in a deontological theory D. C says the action with the greatest total welfare is required. D says lying is always wrong, regardless of consequences. The agent can either (A) tell a lie that produces 100 units of total welfare, or (B) tell the truth that produces 0 units. Under C, A has choiceworthiness 100 and B has 0. Under D, A has choiceworthiness -100 (because lying is wrong) and B has 100 (because truth-telling is required). Assume for now that the choiceworthiness scores are intertheoretically comparable. (a) What does maximize expected choiceworthiness (MEC) recommend? (b) Does your answer change if the scores are not intertheoretically comparable? (c) Briefly explain how the parliamentary model would approach this case, and whether it avoids the problem of intertheoretic comparisons.

  Here's the student's answer:

  Under MEC, we compute the expected choiceworthiness of each action by weighting each theory's score by our credence in that theory. For A: 0.7*100 + 0.3*(-100) = 70 - 30 = 40. For B: 0.7*0 + 0.3*100 = 30. So MEC recommends A, because 40 > 30. This shows that MEC can recommend an action that is wrong according to a theory we take seriously, which is the distinctive feature of moral uncertainty. It is not the same as simply following the theory we think most likely, since D's verdict still affects the expected score.

  If the scores are not intertheoretically comparable, MEC cannot be applied directly, because we cannot say whether C's 100 is greater than D's -100 in a common unit. Some philosophers respond by using variance voting, which normalizes each theory's choiceworthiness scores so that they have the same mean and variance; after normalization, the scores become comparable and we can apply MEC. Others propose the parliamentary model, in which each theory gets a number of seats proportional to our credence, and the parliament decides by majority vote. The parliamentary model avoids the intertheoretic comparison problem because it only asks each theory to rank the actions internally, and then aggregates the rankings. In this case, C ranks A > B and D ranks B > A. With 0.7 seats for C and 0.3 for D, A wins the vote, so the parliamentary model also recommends A.

  One might object that the parliamentary model is not really a decision rule but a metaphor, but I think it captures the idea that moral uncertainty should be treated like political disagreement among theories. The main lesson is that MEC and the parliamentary model can disagree when the theories' value scales are distorted, but in this case they agree.

  I'm trying to seperate the parts that earn credit from the parts that lose it, so be specific. If you think a point I might be tempted to mark wrong is actually defensible, say so. And if the student has conflated two things or made a step that doesn't follow, spell it out.
