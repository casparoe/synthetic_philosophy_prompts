  Formal results: Mereology with identity. If two objects coincide, they share all parts. But if the statue is distinct, it must have different properties. The grounding problem is about how they differ. User dismisses this, but perhaps there's a formal inconsistency. Suppose we use modal logic. The lump could exist without being statue-shaped, but the statue couldn't. But in parasitic persistence, the statue's modal properties are derived from the lump. So if the lump could be non-statue-shaped, then the statue couldn't exist in that scenario. But that means in a world where the lump is not statue-shaped, the statue doesn't exist. But what is the statue's essence? It seems tied to the lump's shape at a time. So the statue is a phase of the lump. But then, is it a distinct object? That might be close to eliminativism.

