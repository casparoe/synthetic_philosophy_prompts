answer: |-
  Here's the adversarial breakdown, targeting "parasitic persistence" (PP) with cases, intuitions, and formal pressures, sorted by severity. Your specific re-carving case is addressed head-on.

  ### Fatal Threats (or Near-Fatal)
  1.  **The Reshaping Intuition Pump (Your Specific Case):**
      *   **The Challenge:** When the lump is re-carved from Statue S1 into Bust B, then into Abstract Blob A, common intuition screams that S1 is *destroyed* during the carving into the bust. It ceases to exist. PP denies this: S1 persists as long as the lump does, merely losing its "statue" status while gaining "bust" status parasitically. But this clashes violently with the strong intuition that *what the thing is* matters for its persistence. If asked "Is *David* (the statue) still here?" after it's carved into a bust of Michelangelo, the overwhelming intuitive answer is "No, that's a different thing now." PP must deny this, claiming *David* still exists but is now coinciding with the lump *as a bust*. This feels like a category error – the persistence of the *artifact kind* is ignored.
      *   **Why it's Fatal-Level:** It directly attacks PP's core claim that the dependent object has *no* persistence conditions beyond the host's. This intuition is central to why constitution views posit distinct persistence conditions in the first place. PP dismisses artifact-kind persistence as illusory, making it revisionist in a way many find deeply counterintuitive and explanatorily weak for artifacts. Your "parade of parasites" description highlights this revisionism starkly.
      *   **Your Shrug?** You might bite the bullet, arguing artifact-kind persistence *is* an illusion and only underlying matter persistence is real. But this moves PP perilously close to eliminativism about artifacts (why posit distinct parasitic objects at all?) and abandons any hope of capturing ordinary talk about statues being created/destroyed.

  2.  **Modal Collapse & The "Could Have Been Otherwise" Problem:**
      *   **The Challenge:** PP claims the statue's modal profile is *entirely derivative* from the lump's. This leads to modal collapse: The statue cannot possibly have *any* property or undergo *any* change that the lump cannot. But consider a world where the *very same lump of clay* was never molded into a statue at all. Intuitively, in that world, *that particular statue* (e.g., *David*) does not exist. However, according to PP:
          *   The lump exists in that world (it's just unshaped clay).
          *   The statue's existence in the actual world is parasitic on *this lump* being statue-shaped *now*.
          *   PP doesn't obviously provide resources to say *David* doesn't exist in that world, because its existence is solely tied to the lump's existence, which is satisfied. It seems PP *must* say that *David* exists coincident with the lump in *all* worlds where the lump exists, regardless of shape or history – it's just that in the unshaped world, *David* is coinciding as an unshaped lump! This absurdly implies *David* could have existed as a shapeless blob.
      *   **Why it's Fatal-Level:** It undermines the very notion of the statue being a distinct *artifact*. If the statue exists necessarily whenever the lump exists (just parasitically taking whatever form the lump has), it loses all connection to its form or function as essential to *what it is*. This contradicts the core idea that artifacts are created/destroyed based on their configuration/purpose.
      *   **Your Shrug?** You might impose a "shape requirement" for the parasitic object *to be a statue*, but assert the *numerically identical parasitic object* persists through shape changes. This intensifies the Reshaping Intuition problem (it *is* still *David*, just blob-shaped now?) and risks making the "statue" label purely contingent/epiphenomenal on the underlying object's state, weakening the claim of distinctness.

  ### Serious Awkwardnesses
  3.  **The Grounding Problem Lite (It Won't Stay Away):**
      *   **The Challenge:** You dismiss the grounding problem, but PP resurrects a specific flavor. If the statue and lump are *numerically distinct* but coincide and share *all* parts, *all* spatial locations, *all* physical properties, and (crucially under PP) *all* modal and persistence properties, **what grounds their distinctness?** What *is* the difference between them? PP seems to posit a brute, ungrounded difference in "kind" or "parasitic status" with no discernible consequences. This violates supervenience intuitions (how can things differ without differing in their base properties?) and feels ontologically profligate without explanatory payoff.
      *   **Your Shrug?** You likely see this as the cost of doing business for genuine coincidence without eliminativism. You might appeal to primitive "kind" properties or different ways of being (object vs. parasitic object) as fundamental. Many find this unsatisfying, but it's a known move in metaphysics.

  4.  **Counting Arguments & Proliferation:**
      *   **The Challenge:** Take your re-carving parade. At t1: Lump + S1. At t2: Lump + B. At t3: Lump + A. PP posits *three* distinct parasitic objects (S1, B, A) coinciding with the *one* lump over time. But mereology (assuming classical extensional mereology) combined with the indiscernibility of the coincidents at each time (same parts, location, physical properties) suggests there's only one object at each time. Adding distinct parasitic objects seems to violate principles like the Identity of Indiscernibles or Ockham's Razor without sufficient justification. Furthermore, what principle determines *when* a new parasitic object comes into existence upon reshaping? Why is there an S1-object and a B-object rather than just one constantly changing parasitic object? This risks arbitrariness.
      *   **Your Shrug?** You might reject classical extensional mereology for coinciding objects or argue that "being a statue," "being a bust," etc., are genuine, irreducible sortal properties that individuate objects even when coincident and physically indiscernible. The "operational test" defines the principle for persistence, but not for the *coming into existence* of new parasitic objects upon sufficient change in the host's properties (like shape/function).

  5.  **The Test and Unfalsifiability:**
      *   **The Challenge:** Your operational test ("can the dependent survive a change the host can't?") *does* insulate PP against many standard coincidence counterexamples (e.g., "The lump could survive being flattened, the statue couldn't!"). But that's because PP *defines* parasitic dependence *by* this failure. The test seems tautological: If the object fails the test, it's parasitic; if it passes (could survive a change the host couldn't), then by PP's definition, it *isn't* parasitic and might be a case of mutual coincidence or something else. This makes PP potentially unfalsifiable *for the cases it chooses to apply to*.
      *   **Is it Fatal?** Not necessarily fatal, but **deeply awkward**. In metaphysics, views often carve out their domain. PP carves out a domain (parasitic dependence) defined by this test. The problem is whether this domain captures anything *real* or is just an ad hoc way to avoid counterexamples. Its explanatory power hinges entirely on whether the Reshaping Intuition and Modal Collapse problems can be solved. If those are bullet-bitten, PP becomes a consistent but highly revisionist niche.
      *   **Par for the Course?** Somewhat. Many metaphysical views (e.g., temporal parts, perdurantism) employ definitions that make them hard to falsify by simple intuition pumps. The key is whether the view provides a *better overall package* (coherence, explanatory power, fit with other theories) despite this.

  ### Does PP Predict Differently?
  *   **Vs. Ordinary Constitution:** Yes. Constitution views typically allow the statue to be destroyed (e.g., by smashing or reshaping) *while the lump persists*. PP explicitly denies this – destruction only happens if the lump is destroyed. Constitution also usually allows the statue and lump to have different modal profiles (e.g., statue couldn't survive flattening, lump could). PP denies this.
  *   **Vs. Eliminativism:** Yes. Eliminativism (e.g., only the lump exists) denies the distinct existence of the statue altogether. PP affirms distinct existence but makes it ontologically and modally parasitic. The main prediction difference is the existence of distinct, coinciding, modally inert parasitic entities.

  ### Verdict on Your Re-carving Case
  The strongest count against the "parade of parasites" claim is the **violation of strong, persistent intuitions about artifact destruction through radical reshaping.** If you carve *David* into a bust of Michelangelo, *David* is gone, not merely persisting parasitically as the bust. This clashes with the meaning of artifact terms and our practices of identifying, valuing, and tracking such objects. PP sacrifices this core intuition for theoretical consistency within its defined domain.

  **Verdict: Reshaping intuition (artifact destruction)**
