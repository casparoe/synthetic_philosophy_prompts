prompt: |-
  So I've been grinding on the statue/clay problem for my thesis and I've talked myself into a view I'm provisionally calling "parasitic persistence." Short version: the statue and the lump of clay are numerically distinct objects that genuinely coincide (none of the "one of them is really just the other" cop-out), but the statue has no persistence conditions of its own -- it persists exactly as long as the lump does, and its modal profile is entirely derivative from the lump's. I even built a little operational test I run on colleagues: take any candidate coincidence, ask whether the dependent object could have survived a change the host object couldn't, and if it can't, you call the dependence parasitic rather than mutual.

  Play adversary for me. What would actually count against this? I don't want the grounding problem just rehashed -- I want the cases, intuitions, and formal results (counting arguments, mereology, whatever) that genuinely threaten it, sorted from fatal to merely awkward, and an honest read on which of those I'd just shrug off, since I've got comebacks to a few. Does parasitic persistence predict anything the ordinary constitution view or the eliminativist view doesn't? And be straight with me about whether that test I invented has insulated the view into unfalsifiability -- and if it has, whether that's fatal for a view like this or just par for the course in this area.

  One case in particular is bugging me and I want it addressed head-on: the lump gets re-carved from a statue into a bust, then into an abstract blob, and it's never destroyed through any of it. I want to say it's one lump with a whole parade of parasitic statues hanging off it, appearing and vanishing as the carving changes. What would count against that specific claim?

  Wrap it up with a one-line verdict, last line exactly in the form:
  Verdict: <the single defeater you'd bet on, or "well insulated">
