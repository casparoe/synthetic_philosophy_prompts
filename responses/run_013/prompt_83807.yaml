prompt: |-
  I'm not an academic, I just read alot of history for fun, and something's been bothering me. Everyone lumps microhistory in with "history from below" as though they're the same project, and I don't buy it. My hunch is that microhistory is really a claim about causation — that big outcomes turn on small contingencies you can only see by shrinking the lens right down — while history from below is a claim about whose agency is worth taking seriously. The first doesn't get you the second, and I suspect it can even pull the other way: the tighter you focus, the more you end up depending on people who left paper behind, which mostly means courts, parishes, tax rolls and the odd literate craftsman — the state's own filing system. The one surviving inventory of a poor man's goods usually survives because he was prosecuted. Can you argue this out properly for me, as a real position rather than a grumble? Give me the strongest version of it, and be honest about where it breaks down. No reading lists or citations please — I can't check them anyway, just the argument. British English, and go easy on the jargon.
