  I need to create a formal arbitration document with specific sections: appearances, stipulated facts, findings, conclusions, remedy, and a short dissent. The challenge is to incorporate deep philosophical debates about causation, multiple realizability, and boundaries while keeping it deadpan serious.

  For the philosophical elements:
  - Causal exclusion: If ball collisions determine everything, clump-level causes seem redundant
  - Counterfactual test: What happens if we intervene on clumps while holding balls fixed?
  - Multiple realizability: Stipulate an experiment where balls are swapped but clump persists
