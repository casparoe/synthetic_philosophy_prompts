prompt: |-
  Radio spectrum and the atmosphere are both finite and rivalrous in use, and neither can be fenced off — if at all — without a serious apparatus of law and enforcement. Yet most states treat them in opposite ways. Spectrum is cut into exclusive, tradeable licences and sold to the highest bidder, with monitoring and penalties to make the boundaries bite. The atmosphere is left open: in most places, emitting into it costs nothing, even where the same government has legislated that it is a shared and finite resource. The contrast is sharper still within spectrum itself, since the regulator that auctions exclusive bands also leaves other bands unlicensed, open to anyone who obeys technical rules — power ceilings, listening before transmitting — and those open bands, which carry Wi-Fi and much else, have not been ruined by overuse.

  What theory of the commons does this pattern presuppose? In particular: does it presuppose that a commons is discovered — a natural fact about a resource, that it is rivalrous and cannot be fenced — or that a commons is made, a status the law confers by declining to enforce boundaries and can just as easily withhold? The auctioned licences look like the first; the open bands and the unpriced atmosphere look like the second, or else like a claim about the cost of enforcement. Reconstruct the implicit theory, or the several theories, as sharply as you can, including how the practice classifies these resources — public good, common-pool resource, club good — and whether that classification is a finding about the resource or a decision about it. Say which rival accounts of the commons each half of the practice rules out and which it merely accommodates; whether the halves can be held together consistently, and if so how, and if not, which one is doing the real work. Separate what the practice strictly requires from what it merely happens to fit. Identify where it is underdetermined, so that incompatible theories would license it equally. Ask, too, where the practice supposes order comes from — law, shared norms, or the design of the devices themselves. Then suppose the presupposed view were replaced by its rival: what would have to change in the assignment of spectrum and in the treatment of the atmosphere? And which half of the practice does the fact that the open bands work rather well tell against?

  Argue it on the merits; I am not interested in who said what. Please write in British English.
reasoning: |-
  Hmm, the user has presented a sophisticated analysis of how radio spectrum and atmospheric emissions are managed differently despite sharing similar characteristics. They're asking me to reconstruct the implicit theories behind this contrasting treatment - particularly regarding whether commons are discovered natural facts or legally constructed statuses.

  The core contrast is fascinating: spectrum gets carved into exclusive tradable licenses through auctions, while the atmosphere remains an open-access resource despite being legislated as finite and shared. Even within spectrum itself, we have this duality - licensed bands versus unlicensed ones like WiFi that function well without exclusivity.

  Key questions to address:
  - Whether rivalrousness and excludability are inherent properties or legal constructions
  - How the practice classifies these resources (public goods, common-pool resources etc.)
  - Which theories of the commons are ruled out by each approach
  - Whether the two approaches can be coherently reconciled
  - What the success of unlicensed spectrum implies about enforcement costs
  - Practical consequences if we swapped the approaches

  The user wants rigorous analysis "on the merits" without referencing particular scholars, in British English. They're clearly well-versed in institutional economics and property theory - this reads like an advanced tutorial question or perhaps preparation for academic work.

  Notable tensions in the current system:
  1) The atmosphere treatment suggests regulators view exclusion as prohibitively expensive - yet spectrum auctions prove exclusion is technologically feasible for emissions monitoring too
  2) Unlicensed spectrum's success undermines the "tragedy of the commons" narrative used to justify spectrum auctions
  3) Calling atmosphere "shared" while allowing free pollution is logically inconsistent if rivalrousness is acknowledged

  The WiFi example is particularly damning for "discovered commons" theories - it shows rivalrous resources can avoid overuse through technical constraints rather than property rights. This points toward Ostrom-style institutional solutions rather than Hardinesque binaries.

  If we applied spectrum logic to atmosphere:
  - We'd need comprehensive emissions monitoring
  - Tradable pollution permits would become the norm
  - Enforcement costs would determine where exclusion is practical

  Conversely, applying atmosphere logic to spectrum:
  - Most bands would become unlicensed
  - Technical standards (like WiFi protocols) would replace exclusive rights
  - Auctions would disappear except perhaps for ultra-scarce bands

  The fact that unlicensed spectrum works efficiently suggests that for moderately rivalrous resources, technological governance may outperform property regimes - which radically questions the default auction approach.
answer: |-
  The described practice reveals an inconsistent, bifurcated theory of commons, treating rivalrous resources as either *inherently* requiring exclusion (spectrum licences) or *pragmatically* permitting open access (unlicensed bands, atmosphere). This presupposes no single theory but rather a conflicted stance on whether commons are discovered natural facts or socially constructed legal choices.

  ### Implicit Theories and Resource Classification
  1. **Auctioned Spectrum Licences**  
     - **Presupposed Theory**: Commons as a *discovered natural fact*. The resource is inherently rivalrous and non-excludable without enforcement; thus, legal exclusion (property rights) is necessary to prevent overuse.  
     - **Resource Classification**: Treated as a *common-pool resource* (rivalrous, potentially excludable), converted into a *private good* via licences.  
     - **Rival Theories Ruled Out**: Rejects open-access solutions for highly rivalrous uses. Incompatible with theories where technical norms alone suffice (e.g., unlicensed bands prove this possible).  
     - **What It Accommodates**: Allows that exclusion is costly but feasible with enforcement.  

  2. **Unlicensed Spectrum Bands & Unpriced Atmosphere**  
     - **Presupposed Theory**: Commons as a *legal construct or pragmatic choice*. Open access is viable where:  
       (a) Enforcement costs are prohibitive (atmosphere), or  
       (b) Technical rules and low-to-moderate rivalry enable self-regulation (unlicensed bands).  
     - **Resource Classification**: Atmosphere treated as *open-access resource* (de facto, despite legislation); unlicensed bands as *club goods* (excludable via device standards, non-rivalrous at low congestion).  
     - **Rival Theories Ruled Out**: Rejects that *all* rivalrous resources *must* be privatised (contra Hardin).  
     - **What It Accommodates**: Accepts that some resources can avoid tragedy without full exclusion.  

  ### Consistency and Underdetermination  
  - **Inconsistency**: The halves cannot be held together logically. If rivalry/non-excludability were purely inherent, unlicensed bands should fail (they do not). If purely constructed, auctioning spectrum would be unnecessary where technical rules work.  
  - **Real Work Done**: The *pragmatic* half (unlicensed bands) does the real work. Success there shows exclusion is not always essential, undermining the "inherent rivalry" justification for auctions.  
  - **Underdetermined Aspects**:  
    - Why some spectrum is licensed and some not? Not inherent rivalry but *enforcement cost* and *perceived scarcity* (political choices).  
    - Why atmosphere remains open? Not inherent non-excludability but *prohibitive monitoring costs* (pragmatism).  

  ### Source of Order  
  - **Licensed Spectrum**: Order from *law and enforcement* (fines, monitoring).  
  - **Unlicensed Bands**: Order from *device design* (power ceilings, listen-before-talk protocols) and *shared technical norms*.  
  - **Atmosphere**: *No effective order*; open access leads to overuse, as neither law, norms, nor technology currently restrain emissions.  

  ### Consequences of Swapping Theories  
  1. **Apply "Auction Logic" to Atmosphere**:  
     - States would create tradeable emission permits, enforced via monitoring/penalties.  
     - Pollution becomes a priced, excludable resource (e.g., cap-and-trade systems).  

  2. **Apply "Open-Access Logic" to Spectrum**:  
     - Most bands made unlicensed, regulated by technical standards (like Wi-Fi).  
     - Auctions abolished; spectrum treated as a commons with device-level governance.  

  ### What Unlicensed Bands' Success Challenges  
  The efficiency of open bands **tells decisively against the licensed-spectrum half**. It proves:  
  - Rivalry alone does not necessitate exclusion.  
  - Technical solutions and moderate rivalry can prevent overuse *without* property rights.  
  - Thus, the "inherent rivalry" justification for auctions is empirically undermined—enforcement costs and political choice, not natural facts, drive licensing.  

  ### Conclusion  
  The practice presupposes no coherent theory but a **pragmatic dualism**:  
  - Where exclusion is cheap (spectrum monitoring), states impose property rights.  
  - Where exclusion is costly (atmosphere) or technical fixes work (unlicensed bands), states permit open access.  
  The success of unlicensed bands exposes this dualism as inconsistent, revealing that commons are *made*, not discovered. Resources are classified not by inherent traits but by *enforceability* and *institutional convenience*. If rivalry were truly the immutable determinant, open bands would collapse—yet they thrive, indicting the licence regime as overreach.
