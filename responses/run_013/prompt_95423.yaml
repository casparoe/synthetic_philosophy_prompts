prompt: |-
  I am a platform engineer, ten years into distributed systems and on-call work, with no formal training in philosophy. The vocabulary I actually reason in is the one I use at three in the morning: capacity planning and queueing, admission control and load shedding, circuit breakers and bulkheads, SLOs and error budgets, overcommit ratios and bin-packing, Kubernetes scheduling with its Guaranteed, Burstable, and BestEffort QoS classes, kubelet eviction ordering under node pressure, cgroup limits and the OOM killer, autoscaling with cold-start lag, spot-instance reclamation, tail latency, thundering herds, priority inversion, blast radius, and the incident-command split between the person who owns the service and the person who owns the response.

  I want the lifeboat problem — the case that a boat already at capacity owes nothing to the people in the water, since taking more aboard sinks everyone; and the main objections to it, that the boat's capacity is not a fact of nature but someone's provisioning decision, that passengers and swimmers were separated by an unjust prior distribution, that the argument treats persons as interchangeable units of load, and that the boat's occupants are not thereby the ones authorized to decide who else boards — restated as faithfully as you can in that vocabulary. Restate each position as a concrete engineering claim rather than a mood: name the policy the operator is actually running, say which workloads are Guaranteed and which are BestEffort and in what order the kubelet evicts them, state what the SLO promises, say who holds and who spends the error budget, say whether capacity is reserved or elastic, and whether the queue drops requests or grows without bound.

  Where a philosophical claim maps cleanly onto one of these, say so and move on. Where it maps only under distortion, name the distortion precisely — for instance, whether the distinction between failing to admit and actively killing survives when every configuration is an action the system takes and there is no privileged default state, or whether a rights claim amounts to anything more than a priority class that the operator remains free to edit. Where a claim has no counterpart at all, say that in as many words rather than gesturing at an analogue.

  Then the part I actually want: the residue report. Tell me what the translation could not carry — whether the non-substitutability of persons, the demand that some things not be traded off against throughput at all, the question of who is authorized to set the boat's capacity in the first place, the possibility that the scarcity is manufactured rather than given, the apparent difference between a rescue refused and a death caused, and any obligation to one's own passengers that strangers in the water do not share (in my vocabulary every request is interchangeable, so I cannot see where partiality would even be represented) — and give me a verdict on each item: is my vocabulary constitutively unable to express it, and if so what would have to be added to it, or was the original claim resting on an ambiguity or a picture that dissolves once it is stated operationally? Finish with a judgment on my own suspicion, that lifeboat ethics is resource allocation under hard constraints with a great deal of moralizing layered on top: tell me whether that suspicion survives the translation, and if it does not, exactly which step of the translation kills it.
reasoning: |-
  Okay, the user is a platform engineer with a decade of experience in distributed systems. They want the lifeboat ethics problem translated into their specific engineering vocabulary. They provided a list of terms like capacity planning, SLOs, Kubernetes QoS classes, etc. The goal is to restate each philosophical position as a concrete engineering claim, noting where the analogy holds or breaks.

  First, I need to map the lifeboat scenario to their system. The boat at capacity is like a node with resource limits. Swimmers are incoming requests. The boat's occupants are existing pods. The ethical arguments need to be translated into policies like admission control, eviction order, SLOs. 

  The main philosophical positions: 
  1. Boat owes nothing to swimmers - this maps to admission control rejecting requests when at capacity. 
  2. Capacity isn't natural but a provisioning decision - here, it's about reserved vs. overcommitted resources. The engineer might see this as an operator's choice in resource allocation. 
  3. Unjust prior distribution - this relates to how workloads are classified (Guaranteed vs. BestEffort). But the engineer's system treats requests as interchangeable, which might miss the moral aspect of prior injustice. 
  4. Persons not interchangeable - in engineering, requests are units of load. This is a key mismatch where the vocabulary can't capture human uniqueness. 
  5. Authorization to decide - who sets capacity? In systems, it's the operator or autoscaling policies. But ethically, it's about legitimacy, which isn't represented in the system.

  Next, the residue report. The engineer's terms can't express non-substitutability of persons, absolute constraints (no trade-offs), or the legitimacy of decision-makers. The difference between refusing rescue and causing death might map to admission control vs. eviction, but the moral weight differs. Partiality towards existing passengers isn't captured since all requests are equal in priority.

  The user's suspicion is that lifeboat ethics is just resource allocation with moralizing. The translation shows that while core mechanisms align, the residues (like human uniqueness and legitimacy) indicate that ethics adds dimensions beyond engineering. So the suspicion survives but is nuanced—resource allocation is the mechanism, but ethics addresses what the system can't model.
answer: |-
  Here's a precise translation of the lifeboat problem into your operational vocabulary, followed by a residue report identifying what escapes the mapping.

  ### Core Scenario Translation
  - **Lifeboat System**: A Kubernetes node cluster running stateful services.
  - **Current Occupants (Passengers)**: `Guaranteed` QoS Pods (strict `requests=limits`), consuming 95% of allocatable CPU/MEM.
  - **Swimmers**: Incoming traffic bursts (HTTP requests) or new `BestEffort` batch job Pods.
  - **Capacity Limit**: Node allocatable resources + 5% headroom for system daemons. SLO: 99.9% availability for `Guaranteed` Pods. **Error budget owner**: Service owner.
  - **"Sinking" Condition**: Node pressure triggering kubelet evictions or OOM kills violating SLOs.

  ---

  ### Philosophical Positions as Engineering Policies
  1. **"Boat owes nothing to swimmers"**  
     *Policy:* **Admission Control Webhook rejects new Pods/requests** when node allocatable free < swimmer's requested resources. Eviction ordering: `BestEffort` > `Burstable` > `Guaranteed`.  
     *Mapping fidelity:* **Clean**. Matches `kubelet --eviction-hard=memory.available<100Mi` with Pod QoS precedence.

  2. **"Capacity is provisioned unjustly"**  
     *Policy:* Cluster runs with **0% resource reservation buffer**, 40% overcommit on `Burstable` Pods, and **no autoscaling** (reserved instances only). Swimmers are `BestEffort` Pods from tenant-B, while `Guaranteed` Pods are tenant-A (privileged tenant).  
     *Distortion:* **Ignores provisioning agency**. Engineer's autoscaling group (ASG) max-size *is* a policy choice, but operators see it as a "hard constraint" due to budget approvals.

  3. **"Prior distribution separated swimmers"**  
     *Policy:* **NodeSelector/Affinity rules** segregate tenant-A (`Guaranteed`) to high-CPU nodes, tenant-B (`BestEffort`) to spot-instance node pool. Spot reclamation creates "swimmers".  
     *Distortion:* **Moral context erased**. Engineering treats spot markets as financially optimal, not "unjust". Fairness is SLO parity, not historical redress.

  4. **"Persons aren't interchangeable units"**  
     *Policy:* System has **no priority classes or weighted queues**. All `BestEffort` Pods share one eviction score. L7 load balancer uses round-robin, not per-request priority.  
     *Mapping failure:* **No counterpart**. Engineering vocabulary lacks *intrinsic value*. A `Guaranteed` Pod isn't "sacred"—it's just higher `oom_score_adj`. Human uniqueness has no QoS equivalent.

  5. **"Occupants aren't authorization authorities"**  
     *Policy:* **PodSecurityPolicy allows `Guaranteed` Pods to set `nodeAffinity`**, blocking tenant-B from scheduling. Error budget spend decisions made by service owner without stakeholder review.  
     *Distortion:* **Mistakes control for legitimacy**. Operators *can* set policies (e.g., `LimitRange`), but philosophical objection challenges their *right* to do so unilaterally.

  ---

  ### Residue Report: What the Vocabulary Cannot Express
  1. **Non-Substitutability of Persons**  
     *Verdict:* **Constitutively inexpressible**. Your system models requests/pods as fungible units with priority tags. Adding `user_id` to metrics or per-entity SLOs still quantizes humans into workloads.  
     *Requires:* Axiomatic declaration of intrinsic value (e.g., "human life has ∞ error budget"). Cannot be operationalized without violating utility optimization.

  2. **Absolute Constraints (No Tradeoffs)**  
     *Verdict:* **Dissolves under operational reality**. "No throughput-death tradeoffs" implies infinite capacity. Your systems *require* setting `--eviction-hard` thresholds. Even "do no harm" defaults (e.g., no overcommit) are still capacity choices.  
     *Exception:* **Immutable SLOs** (e.g., "latency must never exceed X even if cluster burns") approach this, but are economically unsustainable.

  3. **Authorization to Set Capacity**  
     *Verdict:* **Ambiguity in 'authorized'**. Operators *provision* capacity (ASG max-size), Product *owns* SLOs, Finance *sets* budgets. Philosophy asks "Who *should_ decide?"—a question of legitimacy, not control.  
     *Requires:* A separate governance layer (e.g., "capacity council with swimmer representatives") not representable in Kubernetes RBAC.

  4. **Manufactured Scarcity**  
     *Verdict:* **Operationally indistinguishable from 'real' scarcity**. Whether capacity limits stem from budget cuts (deliberate) or AZ failure (emergent), your autoscaler reacts identically. "Manufactured" is a human attribution.  
     *Requires:* Audit trail of *intent* (e.g., "CostOps chose 80% utilization target over 60%"), not technical telemetry.

  5. **Rescue Refused vs. Death Caused**  
     *Verdict:* **Mapped with distortion**. Admission control (rejecting new) ≈ refusing rescue. Evicting existing `BestEffort` Pods (killing) ≈ causing death. But morally, *not* scaling up = refusal? System sees both as "load shedding".  
     *Distortion:* **No neutral state**. "Inaction" is still running a `kube-scheduler` with its defaults.

  6. **Obligation to Passengers over Swimmers**  
     *Verdict:* **Partially expressible**. `Guaranteed` > `Burstable` > `BestEffort` eviction order encodes partiality. But *why_ prioritization? Your system says "SLO contracts", not "inherent duty". Moral partiality (e.g., "family first") has no QoS class.  
     *Requires:* A `Trusted` QoS tier with non-contractual, non-revocable guarantees.

  ---

  ### Verdict on Your Suspicion
  **Your suspicion survives but is proven incomplete**.  

  The core resource allocation mechanics map cleanly:
  - Lifeboat capacity = Node allocatable resources  
  - Swimmers = Pods failing admission control  
  - Sinking = SLO violation cascade  
  - Occupant safety = `Guaranteed` QoS enforcement  

  **What kills pure reductionism:**  
  1. **Residues 1 & 6** (Non-substitutability, partiality) expose that *human value is not reducible to SLO tiers*. A `Guaranteed` Pod isn't "valued more"—it's contractually entitled.  
  2. **Residue 3** (Authorization) reveals ethics concerns *meta-configuration*: Who sets ASG limits? Why do they have that right? Your vocabulary describes *how* policies run, not whether they *should*.  
  3. **Residue 4** (Manufactured scarcity) shows that "hard constraints" are often policy decisions masked as physics.  

  **Conclusion**: Lifeboat ethics *is* resource allocation under constraints, but the moralizing addresses irreducibly human elements (dignity, legitimacy, blame) that your system explicitly optimizes *out* for efficiency. The translation proves ethics operates in the gaps your instrumentation cannot measure.
