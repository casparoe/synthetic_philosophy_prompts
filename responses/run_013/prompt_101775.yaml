prompt: |-
  You are advising the board of a small foundation that can commit roughly six researcher-years to conceptual work on moral trade — the class of situations in which two agents who hold divergent moral views each do something the other approves of, so that each is better off by her own lights even though each regards some of the other's values as mistaken. The board cannot agree on where the money should go. Some members want work on whether such trades are permissible in the first place, and specifically on whether a person who trades away a piece of her own conduct is corrupted or made complicit by the exchange; others want work on whether individual trades can be aggregated at all, and what an equilibrium would even mean when there is no common moral currency in which the trades are denominated; one member keeps pressing for a formal treatment in which the traders are uncertain which of them is right and trade partly as a hedge against that uncertainty. They have asked you for a ranked research agenda rather than a survey. Which open questions in the theory of moral trade most deserve those six researcher-years, in what order, and why? For each, make clear what puts it upstream of the others, how tractable it is for people doing conceptual and formal work rather than empirical work, and what argument or result over the next few years would move it up or down the ranking. Do not supply citations or a reading list.

  Return the agenda as a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is asking for a ranked research agenda on moral trade, specifically for a foundation with six researcher-years to allocate. The board has different priorities: some focus on permissibility and corruption, others on aggregation and equilibrium without a common moral currency, and one on uncertainty and hedging. I need to provide exactly five items in a numbered list, each one or two sentences, no intro or conclusion.

  First, I should identify the core open questions that are most deserving and rank them by importance. Upstream means foundational issues that enable others; tractability refers to how feasible they are for conceptual/formal work; and I need to specify what could change the ranking over time.

  Starting with upstream issues: permissibility is fundamental because if trades aren't allowed due to corruption or complicity, nothing else matters. It's highly tractable with conceptual analysis and formal models of moral agency. If results show trades are often impermissible, it would drop in priority; if resolvable, it could move down.

  Next, uncertainty and hedging seems upstream for aggregation because without accounting for differing beliefs, aggregating trades might not make sense. It's tractable with decision theory and game theory. If models show uncertainty resolves aggregation issues, it could rise; if it complicates things, it might stay high.

  Aggregation without a common currency is next. It's downstream because it builds on permissibility and uncertainty, but crucial for real-world applications. Tractability is medium—tough but with tools like welfare economics. Progress here could boost it; if intractable, it might fall.

  Then, dynamics of moral change: how do trades influence moral views over time? It's downstream as it assumes trades occur, and tractable with evolutionary game theory or learning models. If empirical work shows shifts, it could rise; if not, it might stay lower.

  Finally, institutional design: how to implement trades in practice. It's the most applied, so downstream, and tractable with mechanism design. If permissibility or aggregation are solved, this could jump up; otherwise, it's less urgent.

  Ranking: 1. Permissibility (most upstream), 2. Uncertainty, 3. Aggregation, 4. Dynamics, 5. Institutional design. This order ensures foundational issues are tackled first, maximizing impact with limited resources.

  Now, for the response: I'll craft five concise items with the required elements, based on this reasoning.
answer: |-
  1.  **Establishing core permissibility and avoiding complicity/corruption:** This is most upstream, as without resolving whether trades are fundamentally allowed or corrupting, subsequent work lacks grounding; it's highly tractable for formal/conceptual analysis of agency and value alienation. If future results show trades inherently undermine moral integrity, this drops; if resolvable safeguards are found, it moves down the list.
  2.  **Modelling trade under deep moral uncertainty (hedging):** Directly upstream for aggregation and equilibrium, as uncertainty about being "right" fundamentally shapes trade motives and potential gains; highly tractable using existing formal tools from decision theory and game theory under ambiguity. If models show uncertainty dissolves aggregation problems or creates new ones, its priority changes; empirical evidence on real uncertainty levels could also shift its rank.
  3.  **Defining aggregation and equilibrium without a common moral currency:** Crucial for moving beyond pairwise trades to societal scales, but depends on resolving permissibility and uncertainty; tractability is medium, requiring novel formal frameworks for interpersonal comparisons under fundamental disagreement. Development of a robust aggregation metric (even if non-unique) would boost it; proving inherent impossibility would lower its priority.
  4.  **Dynamics of moral views through trade interaction:** How does engaging in trade alter agents' own moral views over time? Downstream, as it assumes trades occur, but vital for long-term stability; tractable via formal models of belief updating, social influence, or evolutionary dynamics. Evidence that trades reliably cause value convergence or dangerous polarization would increase its urgency; showing minimal impact would lower it.
  5.  **Institutional design for facilitating permissible trade:** Most downstream and applied, focusing on rules and mechanisms enabling beneficial trades identified upstream; tractable using mechanism design and contract theory, but contingent on prior theoretical foundations. Concrete proposals for feasible institutions would raise its profile; persistent upstream roadblocks (e.g., insolvable aggregation) would keep it low.
