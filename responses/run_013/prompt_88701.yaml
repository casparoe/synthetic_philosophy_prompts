  ### Fairness in Bargaining: A Negotiation Activity  
  **Designed for a 90-minute session with 16 participants**  

  **Goal**: Explore how people instinctively split gains from cooperation, without prescribing principles. The activity reveals whether negotiators prioritize equal absolute gains, maximum joint gains, or equal proportional sacrifice (without naming these).  

  ---

  ### Materials (Photocopy for Pairs)  
  **Handout Instructions (Generic)**  
  > *You are negotiating with a partner to choose one agreement from a list. If you fail to agree, both get the "Disagreement Point." Your goal is to maximize your own points. Do not show your payoff table to your partner—discuss openly. You have 15 minutes.*  

  **Scenario Alpha (Symmetric) - Player 1 Version**  
  > **Disagreement Point**: If no agreement, you get **10 points**, Partner gets **10 points**.  
  > **Available Agreements**:  
  > | Agreement | Your Points | Partner's Points |  
  > |-----------|-------------|------------------|  
  > | A         | 15          | 50               |  
  > | B         | 20          | 48               |  
  > | C         | 25          | 45               |  
  > | D         | 30          | 40               |  
  > | E         | 35          | 35               |  
  > | F         | 40          | 30               |  
  > | G         | 45          | 25               |  
  > | H         | 50          | 15               |  

  **Scenario Alpha (Symmetric) - Player 2 Version**  
  > *Same as Player 1, but columns swapped:*  
  > | Agreement | Your Points | Partner's Points |  
  > |-----------|-------------|------------------|  
  > | A         | 50          | 15               |  
  > | B         | 48          | 20               |  
  > | ...       | ...         | ...              | *(up to Agreement H)*  

  **Scenario Beta (Lopsided) - Player 1 Version**  
  > **Disagreement Point**: If no agreement, you get **10 points**, Partner gets **20 points**.  
  > **Available Agreements**:  
  > | Agreement | Your Points | Partner's Points |  
  > |-----------|-------------|------------------|  
  > | A         | 20          | 46               |  
  > | B         | 28          | 42               |  
  > | C         | 35          | 36               |  
  > | D         | 40          | 34               |  
  > | E         | 42          | 32               |  
  > | F         | 50          | 25               |  

  **Scenario Beta (Lopsided) - Player 2 Version**  
  > *Same as Player 1, but columns swapped:*  
  > | Agreement | Your Points | Partner's Points |  
  > |-----------|-------------|------------------|  
  > | A         | 46          | 20               |  
  > | B         | 42          | 28               |  
  > | ...       | ...         | ...              | *(up to Agreement F)*  

  ---

  ### Activity Setup  
  - **Participants**: 16 people (8 pairs).  
  - **Scenarios**: 4 pairs get **Alpha** (symmetric), 4 pairs get **Beta** (lopsided).  
  - **Roles**: Randomly assign "Player 1" and "Player 2" in each pair. Give corresponding handouts.  
  - **Key Features**:  
    - **Symmetric (Alpha)**: Identical payoff ranges. "Equal absolute gains" (E), "proportional sacrifice" (E), and "max product of gains" (E) all align at (35,35).  
    - **Lopsided (Beta)**: Different payoff ranges.  
      - **Equal absolute gains**: ≈ Agreement B (gains = 18 vs. 22).  
      - **Max product of gains**: Agreement D (gains = 30 × 14 = 420).  
      - **Proportional sacrifice**: Agreement C (each gives up ≈38% of their ideal range).  

  ---

  ### Timeline (90 Minutes Total)  
  1. **Introduction (5 min)**:  
     - *Facilitator says*: "Today, you’ll negotiate in pairs to split points. The goal is to maximize your own points. If you deadlock, both get the Disagreement Point. No fairness lectures—just negotiate!"  

  2. **Distribute Materials & Assign Roles (5 min)**:  
     - Hand out scenarios: Half Alpha, half Beta. Randomly assign Player 1/2 roles.  

  3. **Negotiation (15 min)**:  
     - Pairs negotiate face-to-face. **Rules**:  
       - No trading side deals.  
       - Agree on one option (A, B, C...) or deadlock.  
       - **Do not** discuss fairness theories—focus on your points.  
     - *Facilitator circulates but does NOT intervene*.  

  4. **Report Results (5 min)**:  
     - Pairs report: Scenario (Alpha/Beta), agreement reached (e.g., "Beta, Agreement C"), or deadlock. Record publicly.  

  5. **Debrief Part 1: Share Instincts (15 min)**:  
     - For Alpha pairs: *"Why did you choose your agreement? What felt fair?"*  
     - For Beta pairs: *"What drove your choice? Did you feel your partner’s best outcome affected fairness?"*  
     - **Do not validate/refute answers**. Just listen.  

  6. **Debrief Part 2: Reveal Patterns (40 min)**  
     - **Step 1: Symmetric (Alpha) Results**  
       - *Plot Alpha on a board*: Mark axes (Player 1 Points vs. Player 2 Points).  
       - Mark disagreement (10,10) and agreements (A–H). Circle pairs’ chosen points.  
       - *Ask*: "Why did most pick Agreement E? Is fairness about equality here?"  
       - **Key insight**: In symmetry, all principles converge (E = 35,35).  

     - **Step 2: Lopsided (Beta) Results**  
       - *Plot Beta on board*: Mark disagreement (10,20) and agreements (A–F). Circle chosen points.  
       - Mark "ideal points": Player 1’s max = 50 (Agreement F), Player 2’s max = 46 (Agreement A).  
       - *Ask*:  
         - Agreement B choosers: *"You got gains of 18 vs. 22. Is equal gain fair if Player 1’s best was 50 and Player 2’s was 46?"*  
         - Agreement D choosers: *"You maximized total gains (30+14=44). Does efficiency feel fair?"*  
         - Agreement C choosers: *"You got 25 vs. 16 gains. Why did this feel balanced?"*  

     - **Step 3: Calculate Sacrifice Fractions**  
       - *For a Beta agreement (e.g., B)*:  
         - Player 1 sacrifice = (50 - 28) / (50 - 10) = 22/40 = 55%  
         - Player 2 sacrifice = (46 - 42) / (46 - 20) = 4/26 ≈ 15%  
         - *Ask*: "Is it fair for Player 1 to sacrifice 55% and Player 2 only 15%?"  
       - *For Agreement C (Beta)*:  
         - Player 1 sacrifice = (50 - 35) / (50 - 10) = 15/40 = 37.5%  
         - Player 2 sacrifice = (46 - 36) / (46 - 20) = 10/26 ≈ 38.5%  
         - *Ask*: "This has near-equal sacrifice. Did it feel fair without knowing the math?"  

     - **Step 4: Connect to Principle**  
       - *Say*: "The ‘fairness line’ runs from the disagreement point (10,20) to the ideal point (50,46) in Beta. Agreements on this line (like C) require equal *fractional* sacrifice."  
       - *Contrast*: "Equal absolute gains (B) and max joint gains (D) fall off this line. In symmetry, these collide; in asymmetry, they diverge."  

  7. **Conclusion (5 min)**:  
     - *Final note*: "Your instincts might track different principles in different contexts. The ‘proportional sacrifice’ idea—giving up the same fraction of your own best hope—is one lens. Does it resonate?"  

  ---

  ### Predictable Problems & How to Handle Them  
  1. **Problem**: A pair splits gains equally (e.g., Beta Agreement B) and insists, "Equal is obviously fair!"  
     - **Handling**: In debrief, ask: *"Player 1, your best was 50, Partner’s was 46. By taking equal gains (18 vs. 22), you gave up 55% of your range, they gave up 15%. Does that imbalance feel fair?"* Don’t rescue—let them debate.  

  2. **Problem**: Deadlocks or collusion to "split the middle."  
     - **Handling**: Praise deadlocked pairs for honesty. Ask: *"What made you walk away? Did the other’s ‘best possible’ feel unreasonable?"*  

  3. **Problem**: Players fixate on points, not ranges.  
     - **Handling**: In debrief, calculate sacrifices publicly. *"Notice how Player 1’s best (50) vs. Player 2’s best (46) changes what ‘fair sacrifice’ means."*  

  4. **Problem**: Economists dominate with theory.  
     - **Handling**: Redirect: *"Forget theory—what did you actually do? Why did it feel right at the time?"*  

  ---

  ### What the Activity Can’t Do & What You’ll Need to Supply  
  - **Limitation**: Discrete agreements mean exact proportional sacrifice (e.g., 38.5% in Beta) isn’t perfectly achievable. Participants might land near (C) but not perfectly.  
  - **What You’ll Supply**: In the debrief, clarify that in continuous bargaining (e.g., dividing money), the "fairness line" from disagreement to ideal can be precisely followed. The activity simplifies this, but the intuition holds: fairness requires equal relative sacrifice, not absolute equality.  

  ---  
  **Final Note**: Use the handouts as-is for your Ohio students. All text is in American English. Run it as a hands-on negotiation—participants discover principles through action, not lecture. Good luck!
