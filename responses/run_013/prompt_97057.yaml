answer: |-
  ### Kalai-Smorodinsky Bargaining Procedure for Budget Allocation

  **Core Philosophy**: The Kalai-Smorodinsky (KS) solution ensures allocations are proportional to each party's *aspirations* (relative to what's feasible), preserving fairness through **scale invariance** and **individual monotonicity**. Unlike Nash bargaining (which maximizes the *product* of gains), KS equalizes the *ratio* of achieved gains to ideal gains, preventing either side from being disproportionately penalized for high aspirations.

  ---

  ### Step-by-Step Procedure (for two constituencies: Library & Teaching Labs)
  **Time**: 40 minutes for steps 1–4; 20 minutes for steps 5–6.

  1. **Define Disagreement Point (5 min)**  
     - **Question**: "What happens if we fail to agree?"  
     - **Data**: Status quo funding (e.g., $0 incremental change).  
     - **Default**: Disagreement point = ($0, $0).  
     - **Judgment**: If historical baselines or minimum viable funding exist, adjust disagreement point (e.g., $10 to each). *Hand to provost if consensus fails*.

  2. **Collect Ideal Proposals (5 min)**  
     - **Question**: "What is your ideal incremental funding request?"  
     - **Data**: Library request = $L$, Labs request = $T$.  
     - **Rule**: Accept requests as stated (no normalization yet).  

  3. **Normalize Ideal Points (10 min)**  
     - **Question**: "What is the maximum feasible for each if the other gets nothing?"  
     - **Data**: Pool size = $P$.  
     - **Calculation**:  
       - $U_L = \min(L, P)$  
       - $U_T = \min(T, P)$  
     - **Why?** Caps requests at the total pool ($P$) to avoid rhetorical inflation.  

  4. **Calculate KS Allocation (10 min)**  
     - **If $U_L + U_T \geq P$**:  
       $$\lambda = \frac{P}{U_L + U_T}, \quad x_L = \lambda \cdot U_L, \quad x_T = \lambda \cdot U_T.$$  
     - **If $U_L + U_T < P$**:  
       $$\text{Leftover} = P - (U_L + U_T), \quad x_L = U_L + \frac{\text{Leftover}}{2}, \quad x_T = U_T + \frac{\text{Leftover}}{2}.$$  
     - **Output**: $(x_L, x_T)$.  

  5. **Adjust for Non-Convexity/Values (10 min)**  
     - **Feasibility Check**: If the KS point exceeds physical constraints (e.g., lab equipment costs $>x_T$), *hand to provost*.  
     - **Equity Override**: If historical injustice or need isn't reflected in requests, adjust $U_L$ or $U_T$ (e.g., boost underfunded unit by 20%). *Judgment required; hand to provost if contested*.  

  6. **Recommend Final Split (10 min)**  
     - Present $(x_L, x_T)$ with rationale:  
       > "Each party receives the same *proportion* of their feasible ideal: $\frac{x_L}{U_L} = \frac{x_T}{U_T}$."  

  ---

  ### Why Not Nash Bargaining?
  - **Nash Solution**: Maximizes $(x_L - d_L) \times (x_T - d_T)$, leading to equal *absolute* gains ($x_L - d_L = x_T - d_T$) if feasible.  
  - **KS vs. Nash**:  
    - KS uses **ideal points as benchmarks**; Nash ignores aspirations.  
    - KS satisfies **individual monotonicity** (if $U_L$ increases, $x_L$ doesn’t decrease); Nash does not.  
    - Example: If Lab’s ideal request doubles from $100 to $200 (pool $100$):  
      - KS: $U_T$ rises from $100$ to $100$ (capped at $P$), so allocation unchanged.  
      - Nash: Unchanged if feasible set identical.  
    - **KS ≠ Nash with steps**: Nash is aspiration-agnostic; KS ties allocation to scaled ideals.  

  ---

  ### Case Studies
  #### Case 1: Routine Split  
  - **Pool**: $P = 100$  
  - **Requests**: Library = $80$, Labs = $60$  
  - **Feasible Ideals**: $U_L = 80$, $U_T = 60$  
  - **KS Allocation**:  
    $\lambda = \frac{100}{80+60} = 0.714$  
    $x_L = 0.714 \times 80 = 57.14$  
    $x_T = 0.714 \times 60 = 42.86$  
  - **Why?** Equal relative gain: Both get 71.4% of their ideal.  

  #### Case 2: High Aspiration vs. Low Aspiration  
  - **Pool**: $P = 100$  
  - **Requests**: Library = $50$, Labs = $200$  
  - **Feasible Ideals**: $U_L = 50$, $U_T = 100$ (capped at $P$)  
  - **KS Allocation**:  
    $\lambda = \frac{100}{50+100} = 0.667$  
    $x_L = 0.667 \times 50 = 33.33$  
    $x_T = 0.667 \times 100 = 66.67$  
  - **Why?** Labs have a larger feasible ideal ($U_T=100$ vs. $U_L=50$), so they receive a larger absolute share.  

  #### Case 3: Historically Underfunded Unit  
  - **Pool**: $P = 100$  
  - **Requests**: Library (underfunded) = $40$, Labs = $160$  
  - **Feasible Ideals**: $U_L = 40$, $U_T = 100$  
  - **KS Allocation**:  
    $\lambda = \frac{100}{40+100} = 0.714$  
    $x_L = 0.714 \times 40 = 28.57$  
    $x_T = 0.714 \times 100 = 71.43$  
  - **vs. Splitting Difference**:  
    - Split difference: $x_L = \frac{40 + (100 - 100)}{2} = 20$ (midpoint of $L$ and $P - T$)  
    - KS gives *more* ($28.57$) than splitting ($20$) but may still be politically unacceptable.  
  - **Why?** KS ignores historical context; it only responds to current aspirations. Use **Step 5** to override.  

  ---

  ### Limitations and Survival of KS Properties
  | **KS Property**      | **Survives Translation?** | **Reason**                                                                 |
  |----------------------|---------------------------|----------------------------------------------------------------------------|
  | Scale Invariance     | Yes                       | Doubling $L, T, P$ doubles $x_L, x_T$.                                    |
  | Individual Monotonicity | Partially               | $U_L$↑ → $x_L$↑, but capped ideals mask true expansions.                  |
  | Ideal Point Benchmark | Yes                      | Core of the procedure.                                                     |
  | Symmetry             | Lost                      | Asymmetric historical factors require override in Step 5.                  |

  **Where Misfires Occur**:  
  - **Cardinal Utility Comparisons**: Assumes money ≈ utility. Fails if:  
    - $1 for labs ≠ $1 for library (e.g., labs have high fixed costs).  
    - Diminishing returns (e.g., first $50 > next $50 for library).  
  - **Non-Convex/Unknown Frontiers**: If feasibility constraints (e.g., "labs need $60 or $0") break convexity, KS may prescribe infeasible points. Use Step 5.  
  - **>2 Constituencies**:  
    - Extend via $\lambda = P / \sum U_i$ → $x_i = \lambda U_i$ (equal relative gain).  
    - Leftover split equally.  

  ---

  ### Final Recommendation
  This procedure replaces arbitrary splits with a principled benchmark: **equal sacrifice of aspiration**. It requires minimal game theory, runs in <1 hour, and delivers auditable allocations. The provost retains authority to adjust for values (Step 5) when:  
  - Historical justice outweighs current aspirations.  
  - Non-convex constraints or cardinal utility ambiguities arise.  
  - The committee deadlocks on the disagreement point or equity adjustments.  

  **Output Template**:  
  > "We recommend \$X to the library and \$Y to the teaching labs. Each achieves [Z]% of their feasible ideal request, ensuring proportional sacrifice. Adjustments were made for [reasons]."
