prompt: |-
  I spent most of last night arguing with a friend about slurs, and we kept talking past each other because we never settled on what a theory of slurs is even supposed to deliver. Before we take it up again, I want the specification on paper: the desiderata that any adequate account of slurs — semantic, pragmatic, or a hybrid of the two — has to meet.

  Start with the phenomena such an account must get right, each with the case that motivates it. A slur and the neutral term for the same group pick out the same people, yet swapping one for the other changes what is said and done, so the account must explain the difference between two co-extensive expressions. A slur can wound even when the speaker intends no derogation — reported, quoted, read aloud from a dictionary, or uttered by someone ignorant of its history — while the same word, used by members of the target group among themselves, gives no offense; the account therefore has to locate the offensiveness somewhere that is neither simply the speaker's intent nor simply the word's dictionary sense. Some group pejoratives have no neutral counterpart at all, and some are aimed at groups defined by ideology, religion, or chosen affiliation rather than by anything ascriptive, so the theory must say whether these belong to the same class and whether having a neutral counterpart is really part of what makes a term a slur. Slurs differ in severity, and particular terms drift in status over a generation — from ordinary to taboo, or from taboo to reclaimed — so the account must accommodate a gradient and its movement in time. Slurs resist uses that their descriptive content would otherwise license: it is hard to utter one in a flatly classificatory or neutrally reporting way without the utterance sounding like endorsement, so the theory must explain the missing innocent uses. Slurs embed — under negation, in conditionals, in questions, in compounds, in reported speech — and their offensiveness survives some embeddings and not others, which constrains any compositional treatment. And a slur derogates a person through a group, whereas a plain insult like 'idiot' aims at the person directly, so the account should say whether one mechanism covers both and what marks the difference.

  Then the distinctions it cannot collapse: use versus mention; a slur versus a mere insult versus a taboo or profane word; the act of derogating versus the effect of giving offense versus the attitude of contempt; what the word means versus what the speaker means; and the descriptive content a slur shares with its neutral counterpart versus whatever else it carries.

  For each requirement, give the consideration behind it, then tell me which of them are genuine desiderata and which are merely the commitments of one camp dressed up as requirements. I especially want you to flag any pair that cannot be satisfied together — I suspect that the no-intent case and the reclamation case pull in opposite directions, and that the demand for one uniform mechanism fights the demand that the account capture how heterogeneous slurs are — and to identify the single requirement that does the most to rule out candidate theories. Skip the scorecard of the familiar positions; the list is what I am after, and I will do the scoring myself once we agree on the criteria.
reasoning: |-
  Okay, the user is deep into a philosophical debate about slurs and wants a clear set of criteria for evaluating any theory of slurs. They've had an all-nighter argument with a friend, and they're frustrated because they couldn't even agree on what a theory should accomplish. Now they're trying to get it all down on paper before round two.

  First, I need to unpack their dense query. They want desiderata—essential requirements—for any adequate account of slurs, whether semantic, pragmatic, or hybrid. They’ve listed specific phenomena the theory must explain, like why slurs and neutral terms co-refer but differ in impact, how slurs offend even without intent, and why some slurs lack neutral counterparts. They also want distinctions the theory can’t blur, like use vs. mention or slur vs. insult.  

  The user’s tone is meticulous and slightly weary—they’ve been burned by talking past their friend and want rigor. Their hidden need might be for a framework that preempts dead-end debates. They’re not asking for existing theories; they want neutral criteria to judge theories themselves.  

  Breaking it down:  
  - **Core phenomena**: The list is thorough. Co-extensiveness vs. differential impact is foundational—any theory failing this is dead on arrival. The intent-free offensiveness (e.g., dictionary readings) is tricky because it suggests offensiveness is lodged in the expression itself, not just speaker meaning. Reclamation (e.g., in-group use) complicates this, creating tension: if offensiveness is word-bound, how can it "switch off" for certain speakers?  
  - **Heterogeneity**: Some slurs target immutable traits, others ideologies—should these be lumped together? And must a slur always have a neutral counterpart? The user hints this might be a false requirement.  
  - **Gradient and drift**: Severity differences (e.g., moderate vs. extreme slurs) and historical change (reclamation, taboo shifts) need explaining. A static theory won’t cut it.  
  - **Embedding puzzles**: Offensiveness vanishes in some contexts ("Is X a slur?") but not others ("Y said all Zs are slurs"). Compositionality is key here.  
  - **Derogation mechanism**: Slurs attack via group membership; insults like "idiot" don’t. Is this a difference in kind or degree?  

  Distinctions to uphold: Use/mention is critical—mentioning "slur" shouldn’t offend like using it. Slur vs. insult matters because slurs harness bigotry; insults might not. Also, disentangling attitude (contempt), act (derogating), and effect (offense) avoids oversimplification.  

  Now, conflicts:  
  - **Intent-free offense vs. reclamation**: The former demands offensiveness be word-embedded; the latter shows it’s speaker/context-dependent. This is the biggest tension—theories favoring one struggle with the other.  
  - **Uniform mechanism vs. heterogeneity**: If slurs vary wildly (targets, severity, reclaimability), a one-size-fits-all account might falter.  
  - **Neutral counterpart requirement**: The user suspects this isn’t essential. Some group-based pejoratives lack neutrals (e.g., "quisling" for traitors), so a theory shouldn’t hinge on this.  

  The knockout desideratum? **Intent-free offensiveness**. If a theory can’t explain why quoting a slur offends without speaker intent, it fails. This nixes pure pragmatic accounts where offense relies wholly on speaker meaning.  

  I’ll structure the response by:  
  1. **Phenomena/desiderata** with motivations.  
  2. **Distinctions** with their rationale.  
  3. **Conflicts and knockouts**.  
  The user wants clarity, not advocacy, so I’ll stay descriptive. Highlighting tensions shows where theories face trade-offs—that’s what they need for their next debate.
answer: |-
  Below is a structured specification of desiderata for any adequate theory of slurs, derived from the phenomena and distinctions you outlined. Each desideratum is presented with its **motivating case(s)**, followed by **key considerations** and an assessment of its status as a **genuine requirement** or a **potentially contested commitment**. Conflicts between desiderata and the "knockout" constraint are flagged explicitly.

  ---

  ### **I. Core Phenomena & Desiderata**  
  *What an account must explain, with cases and rationale:*

  1. **Co-extensiveness with Differential Impact**  
     - **Case**: Swapping a slur (e.g., "k*ke") for its neutral counterpart ("Jewish person") changes communicative content and perlocutionary effect (e.g., from neutral reference to hate speech), despite identical reference.  
     - **Requirement**: Explain how two co-extensive expressions differ semantically, pragmatically, or both.  
     - **Considerations**: Neutral counterparts fix reference; slurs add layers (e.g., contempt, group-based dehumanization).  
     - **Status**: **Genuine desideratum**. Core to defining slurs as a distinct linguistic category.  

  2. **Intent-Independent Offensiveness**  
     - **Case**: A slur offends even when quoted ("He called me a [slur]"), read from a dictionary, or uttered by a child/outsider unaware of its history.  
     - **Requirement**: Offensiveness must persist without speaker derogatory intent.  
     - **Considerations**: Suggests offensiveness is conventionalized in the term itself or its socio-historical context.  
     - **Status**: **Genuine desideratum**. Rules out theories reducing slurs *only* to speaker attitude.  

  3. **Reclamation/In-Group Neutralization**  
     - **Case**: Slurs used within target groups (e.g., "queer" in LGBTQ+ contexts) lose offensiveness and may express solidarity.  
     - **Requirement**: Explain how context/speaker identity can neutralize offense without altering core meaning.  
     - **Considerations**: Implicates speaker-group alignment and socio-linguistic negotiation.  
     - **Status**: **Genuine desideratum**. Tests flexibility of the account.  

  4. **Heterogeneity of Targets**  
     - **Case**: Some slurs target immutable traits (e.g., racial slurs); others target ideology/affiliation (e.g., "commie," "fascist"). Some lack neutral counterparts (e.g., "slut" for promiscuous persons).  
     - **Requirement**: Clarify whether these belong to the same class and whether a neutral counterpart is essential.  
     - **Considerations**: If "slut" is a slur, neutral-counterpart requirement is oversimplified.  
     - **Status**: **Genuine desideratum**. Avoids overgeneralization; exposes diversity of derogation mechanisms.  

  5. **Gradient Severity & Temporal Drift**  
     - **Case**: "C*lt" (moderate) vs. "n\*\*\*\*r" (severe); "queer" (reclaimed) vs. "tr\*nny" (largely unreclaimed).  
     - **Requirement**: Accommodate variations in offensiveness and historical change (taboo → neutral, neutral → taboo).  
     - **Considerations**: Severity depends on socio-historical factors (e.g., oppression, violence).  
     - **Status**: **Genuine desideratum**. Rules out binary/static theories.  

  6. **Absence of Innocent Uses**  
     - **Case**: A slur cannot be used "neutrally" for classification (e.g., "There are five [slur]s in the room") without implying endorsement.  
     - **Requirement**: Explain why descriptive content is "infected" by derogation.  
     - **Considerations**: Suggests default interpretive bias toward speaker endorsement.  
     - **Status**: **Genuine desideratum**. Highlights asymmetry with neutral terms.  

  7. **Embedding Resilience/Vulnerability**  
     - **Case**: Offensiveness survives in "He’s not a [slur]" (resilient) but not in "Is 'ch\*nk' a slur?" (non-resilient).  
     - **Requirement**: Specify how embedding under negation/questions affects offense.  
     - **Considerations**: Constrains compositional semantics (e.g., presupposition vs. conventional implicature).  
     - **Status**: **Genuine desideratum**. Tests formal rigor.  

  8. **Group-Mediated Derogation**  
     - **Case**: "K*ke" attacks via Jewish identity; "idiot" attacks directly.  
     - **Requirement**: Explain how slurs derogate *through* group membership.  
     - **Considerations**: Slurs weaponize social hierarchies; insults need not.  
     - **Status**: **Genuine desideratum**. Distinguishes slurs from individual insults.  

  ---

  ### **II. Essential Distinctions**  
  *What an account must uphold:*

  1. **Use vs. Mention**  
     - **Case**: Mentioning "n\*\*\*\*r" in a linguistic discussion ≠ using it to address a Black person.  
     - **Requirement**: Distinguish between talking *about* a word and deploying it derogatorily.  
     - **Status**: **Genuine**. Foundational to philosophy of language.  

  2. **Slur vs. Mere Insult vs. Taboo Word**  
     - **Case**: "B\*\*\*h" (gendered slur) vs. "jerk" (insult) vs. "f\*\*k" (profanity).  
     - **Requirement**: Explain why slurs derive power from group-based oppression, unlike insults/profanity.  
     - **Status**: **Genuine**. Avoids conflating distinct linguistic phenomena.  

  3. **Derogation vs. Offense vs. Contempt**  
     - **Case**: Derogation (act), offense (effect), contempt (attitude) may dissociate (e.g., unintended offense without contempt).  
     - **Requirement**: Isolate mechanisms for each.  
     - **Status**: **Genuine**. Prevents reductionist accounts.  

  4. **Word Meaning vs. Speaker Meaning**  
     - **Case**: A bigot using "African American" politely still conveys contempt via tone; this is speaker meaning. Slurs convey contempt conventionally.  
     - **Requirement**: Locate derogation in conventional meaning or pragmatic enrichment.  
     - **Status**: **Genuine**. Central to semantics/pragmatics divide.  

  5. **Descriptive Content vs. Additional Load**  
     - **Case**: "Jewish person" (descriptive) vs. "k*ke" (descriptive + contempt).  
     - **Requirement**: Identify the "load" (e.g., evaluative, expressive, presuppositional).  
     - **Status**: **Genuine**. Key to the co-extensiveness puzzle.  

  ---

  ### **III. Conflicts Between Desiderata**  
  1. **Intent-Free Offense vs. Reclamation**  
     - **Conflict**: Intent-free offense demands offensiveness be *conventional* (word-bound), but reclamation implies offensiveness is *cancelable* (context/speaker-dependent).  
     - **Resolution**: Hybrid theories often posit conventionality *plus* contextual override mechanisms. Pure semantic or pragmatic theories struggle.  

  2. **Uniform Mechanism vs. Heterogeneity**  
     - **Conflict**: A single mechanism (e.g., "all slurs express contempt") may not capture variation in targets, severity, or reclaimability.  
     - **Resolution**: Theories must allow for family resemblances or multiple sub-types.  

  3. **Neutral Counterpart Requirement**  
     - **Challenge**: Cases like "slut" (no neutral counterpart) suggest this is **not essential**. Treating it as necessary overgeneralizes.  
     - **Status**: **Contested commitment** of some semantic theories; discardable if slurs are defined by function (group-based derogation).  

  ---

  ### **IV. The Knockout Desideratum**  
  **Intent-Independent Offensiveness** does the most to rule out theories:  
  - **Eliminates**: Pure pragmatic accounts (e.g., Gricean) that reduce slurs to speaker intent.  
  - **Challenges**: Semantic accounts must explain how conventional offensiveness arises and how reclamation works.  
  - **Why it dominates**: If a theory cannot explain why a dictionary reading of a slur is offensive, it fails a non-negotiable empirical observation.  

  ---

  ### **V. Summary of Genuine vs. Contested Elements**  
  - **Genuine Desiderata**: All phenomena (1–8) and distinctions (1–5) are essential *except* the neutral-counterpart requirement.  
  - **Contested Commitments**:  
    - Neutral counterpart as definitional (overly restrictive).  
    - "All slurs must have identical mechanisms" (ignores heterogeneity).  
  - **Critical Tensions**: Intent-free offense vs. reclamation; uniformity vs. heterogeneity.  

  This framework isolates what a theory *must* explain (phenomena), what it *must not* conflate (distinctions), and where compromises may be needed (conflicts). Use it to test theories for coverage, consistency, and empirical adequacy. If a candidate fails the knockout desideratum or collapses essential distinctions, reject it.
