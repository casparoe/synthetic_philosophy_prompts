  3. **Faint-dot detection with payoff change**: Subjects report more dots when payoff increases, but brightness didn't change. Verdict: Stalinesque. Reasoning: Edit at decision/report level.

  4. **Choice blindness (face preference)**: Subjects explain a choice they didn't make. Verdict: Stalinesque. Reasoning: Story written at the moment of the question, original experience unrevised.

