  - **Orwellian**: When the experience itself (what was conscious at the time) is altered, and this alteration happens early (in the perceptual processing, before memory). Examples: color phi (case 1) and flash-lag (case 2).

  - **Stalinesque**: When the experience is not altered at the time, but the memory or report is falsified later. Examples: dot detection (case 3) and choice blindness (case 4).

  But note the reasoning:

  - In the first two (Orwellian), the edit is in the visual system (perceptual processing) and occurs before the experience becomes conscious.

  - In the last two (Stalinesque), the edit is at the level of decision/report (case 3) or at the moment of the question (case 4), meaning after the experience.

