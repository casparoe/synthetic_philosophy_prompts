  - If the alteration occurs during perceptual processing (before the experience is fixed), then Orwellian.

  - If the alteration occurs after the experience (in memory, decision, or reporting), then Stalinesque.

  But note: in case 4 (choice blindness), she says the story is being written at the moment of the question. That is, when they are asked to explain, they confabulate without changing the original experience. This is clearly after the experience.

  **Step 2: Apply to the Barn Case**

  In the barn case:

