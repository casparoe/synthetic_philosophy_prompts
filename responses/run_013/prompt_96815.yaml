prompt: |-
  Bit of context first, then the ask. I'm the deputy head at a state secondary school in France -- not a philosopher, just someone who reads the rationalist blogs on the train and has somehow become the person who handles every request to be excused from something, to wear something, or to skip an activity on religious grounds. It's maybe two or three a week, the stakes are a kid's grades or a family's trust in the school, and whatever I decide becomes the precedent for the whole building, so I can't just wing it. I need a procedure I can run at my desk in ten minutes: the questions in order, what counts as a sufficient answer to each, where it terminates in a no, and where it's a values call that gets punted upstairs to the head.

  What I keep tripping on is that I've got two instincts fighting, and they're basically the two sides of the laïcité vs multiculturalism thing. The French instinct says the school is neutral ground and nobody gets special treatment. The Anglo instinct says neutrality is a fiction and fairness means accomodating everyone equally. My hunch -- tell me if it's wrong -- is that these two agree on the answer most of the time and disagree only about the reason, and that the genuinely hard cases are the ones where one of them has to stop being honest about what it's actually doing. I also suspect laïcité is really two seperate doctrines stapled together, one about the state not endorsing religion and one about protecting people from religion, and that the second one is doing most of the work and isn't neutral at all. If that's right, I want the procedure to say which doctrine it's leaning on at each step instead of pretending there's a single principle underneath.

  So: build the procedure, mark the point where the French and the Anglo frameworks actually fork rather than papering over it, and run it on three cases. A girl who wants to wear a headscarf in PE -- I'm fairly sure that's just illegal here, and I want to know whether the procedure reaches that conclusion honestly or has to cheat to get there. A family asking for a substitute meal in the canteen. And one request that you think I should refuse even though refusing is awkward, because granting it quietly costs some other kid something. If the procedure tells me to grant something I'd instinctively refuse, don't massage it into a yes -- own the no.

  Last thing: tell me what the procedure can't do. Which requests will it mis-sort no matter how carefully I fill in the blanks?
reasoning: |-
  Okay, let me start by understanding the user's situation. They're a deputy head at a French secondary school, handling religious accommodation requests regularly. They need a practical, ten-minute procedure that's consistent and sets precedents. The key points are balancing French laïcité with Anglo-style multiculturalism, and they want transparency about which principle is being applied.

  First, I need to unpack their main struggles. They mentioned two conflicting instincts: strict state neutrality vs. accommodating diversity. They suspect laïcité has two components—state non-endorsement and protecting from religion—and the latter isn't neutral. The procedure must distinguish when each doctrine is in play, especially where the frameworks diverge.

  The user provided three test cases: headscarf in PE (likely illegal in France), substitute meals, and a tricky refusal case. They want honesty in the procedure, even if it leads to an unpopular "no." Also, they need to know the procedure's limitations.

  Now, building the procedure. The core structure should be a flowchart with clear questions. Start with legality (French law is non-negotiable), then assess neutrality vs. accommodation. The fork between French and Anglo approaches happens when an accommodation imposes on others or disrupts neutrality. For example, allowing a headscarf might be seen as endorsing religion under laïcité, while multiculturalism focuses on equal access.

  For the headscarf case, French law prohibits religious symbols in schools, so the procedure should flag it as illegal without bending. The canteen meal is more flexible; substitutions don't violate neutrality and can be accommodated. The refusal case might involve something like a request that excludes others, like gender-segregated activities, which imposes on other students' rights.

  The procedure's weaknesses: it can't perfectly handle nuanced sincerity claims, situations where neutrality vs. accommodation is equally weighted, or systemic issues beyond individual requests. Also, evolving social norms might outpace the framework.

  Deep needs: The user likely wants to reduce cognitive load and emotional strain by having a reliable system. They also seek validation that their internal conflict is legitimate, and reassurance that transparency in decision-making builds trust, even when saying no. Highlighting where principles diverge helps them communicate decisions more effectively to families and staff.
answer: |-
  Here's a streamlined, 10-minute desk procedure based on French legal reality and your analysis of the competing principles. It explicitly flags which doctrine is driving each step.

  **The Procedure: Religious Accommodation Request Decision Tree**

  1.  **Is the request explicitly illegal under French law? (Check: Loi 2004, Circulaires, Loi 2010, Conseil d'État Jurisprudence)**
      *   **Sufficient Answer:** Yes/No based on verified legal sources (keep updated list: headscarves on students, staff religious symbols, proselytizing, refusal of co-ed activities based on religion, refusal of core curriculum).
      *   **Termination:** **NO** if illegal. **Doctrine:** *Laïcité (Protection)*. The state actively prevents religious expression in school to protect others and maintain strict neutrality. *Anglo framework would likely diverge here, seeing this as suppression.*
      *   *If NO, proceed.*

  2.  **Does granting the request create a direct, material burden or cost for the school or other students?** (e.g., significant expense, reallocating scarce resources, displacing other students, requiring extra staff time beyond minimal admin).
      *   **Sufficient Answer:** Concrete evidence of burden/cost (e.g., catering contract specifics, staffing schedules, facility limitations). Vague "inconvenience" isn't enough.
      *   **Termination:** **Likely NO** if significant burden. **Doctrine:** *Pragmatic Neutrality / Fairness*. The school cannot be expected to bear undue cost; neutrality includes not favoring one group's needs over the school's operational capacity. *Anglo framework might seek cost-sharing solutions.*
      *   *If NO significant burden, proceed.*

  3.  **Does granting the request require active participation by others in a religious practice, or compel others to modify *their* own protected behavior (religious/secular)?** (e.g., forcing a teacher to lead prayer, requiring classmates to gender-segregate, forcing a secular student to participate in a ritual).
      *   **Sufficient Answer:** Clear description of the requested action and who must perform it.
      *   **Termination:** **NO** if compels others. **Doctrine:** *Laïcité (Protection) & Fundamental Rights*. Protects the negative freedom *from* religion and the rights/conscience of others. Strict neutrality forbids imposing practices. *Anglo framework might prioritize the requester's practice unless harm is proven.*
      *   *If NO compulsion, proceed.*

  4.  **Does the request primarily involve personal observance that is passive, non-disruptive, and doesn't impede learning or safety?** (e.g., wearing discrete symbols *not banned by law*, quiet prayer during non-instructional time, dietary needs).
      *   **Sufficient Answer:** Description shows observance is personal, doesn't draw attention, happens during breaks/free time, doesn't conflict with safety rules (e.g., PE equipment).
      *   **Termination:** **Likely YES**. **Doctrine:** *Anglo Multiculturalism / Individual Freedom*. School neutrality means non-interference in private belief/practice, ensuring equal access. *Laïcité (Non-Endorsement)* might tolerate this as private, but views it cautiously as a potential breach in neutrality.
      *   *If unclear or potential disruption, proceed.*

  5.  **Values Call / Punt Upstairs:**
      *   **Triggers:** Requests falling *between* steps 3 & 4 (e.g., highly visible but non-compelling practice), novel requests not clearly covered by law/precedent, significant disagreement about "disruption" or "burden," potential conflict with core educational mission (e.g., refusing specific content in sex ed/science), or where *Laïcité (Protection)* feels strongly applicable but not explicitly illegal.
      *   **Action:** Summarize the request, steps taken, conflicting principles, and potential consequences (precedent, community impact). Escalate to Head Teacher with recommendation.

  **Where the Fork Happens:**
  *   The fundamental fork occurs at **Step 3 (Compelling Others)**. This is where *Laïcité (Protection)* draws a hard line: the state must actively protect individuals (especially minors) from being subjected to religious practices, even passively or indirectly. The Anglo framework sees this line much later, focusing only on preventing direct harm or coercion. It views "passive exposure" as a cost of pluralism. The procedure forces honesty here – a "NO" at Step 3 is explicitly about protecting others *from* religion, not just state neutrality.

  **Running the Cases:**

  1.  **Girl wants to wear a headscarf in PE:**
      *   Step 1: **Is it illegal?** YES. French law (Loi 2004) explicitly prohibits students from wearing "conspicuous" religious symbols, including headscarves, in public schools. This applies to all activities, including PE.
      *   **Termination: NO.** **Doctrine:** *Laïcité (Protection)*. The law embodies the doctrine of protecting the school space from visible religious influence and (arguably) protecting girls from perceived pressure. *The procedure reaches this conclusion honestly and directly via Step 1, without cheating. The Anglo framework would likely see this as an overreach and grant the accommodation.*

  2.  **Family requesting a substitute meal in the canteen (e.g., pork-free, halal/kosher option):**
      *   Step 1: **Illegal?** NO. Providing alternative meals is generally permitted if feasible.
      *   Step 2: **Significant Burden?** Depends. Can the existing caterer provide it at marginal cost? Is it a simple substitution (pork-free) or complex new menu? If minimal cost/admin, **NO burden**. Proceed. If complex/expensive, **Likely NO**.
      *   Step 3: **Compels Others?** NO. Other students aren't forced to eat it or participate. Their meal isn't altered.
      *   Step 4: **Passive, Non-Disruptive?** YES. Student eats their own meal without impacting others' learning or behavior.
      *   **Termination: YES.** **Doctrine:** *Anglo Multiculturalism / Individual Freedom*. Accommodation ensures equal access to a core service (food) without compelling others. *Laïcité (Non-Endorsement)* might tolerate this as a private need, but *Laïcité (Protection)* hardliners might worry it "fragments" the communal meal or signals endorsement – this tension might trigger Step 5 if the request is controversial locally, but the procedure leans to YES.

  3.  **Request to Refuse (Example: Opting out of Co-Ed Swimming or Mandatory Mixed-Gender Group Work on Religious Grounds):**
      *   Step 1: **Illegal?** POTENTIALLY. Refusing core curriculum activities, especially those with civic/social integration goals (like co-ed PE), can be seen as undermining the school's mission. Case law often sides with the school. Assume **NO** explicit prohibition *yet*, proceed.
      *   Step 2: **Significant Burden?** YES. Arranging separate sessions, supervision, alternative tasks creates logistical burden and cost.
      *   **Termination: Likely NO** based on burden. **Doctrine:** *Pragmatic Neutrality / Fairness*. School resources are finite.
      *   Step 3: **Compels Others?** **YES.** Granting this request:
          *   Implies acceptance of a belief system that deems interaction with the other gender inherently problematic.
          *   Forces the school to organize activities based on this belief.
          *   Potentially pressures other religious students to seek similar exclusion.
          *   Undermines the educational goal of fostering mixed-gender cooperation and respect in a neutral space.
      *   **Termination: NO.** **Doctrine:** *Laïcité (Protection)*. This protects other students (especially girls who might feel judged or pressured by the underlying rationale) and the secular civic space from being structured according to religious norms about gender separation. It protects the educational mission. *The Anglo framework might seek a compromise (e.g., modest swimwear, sensitive grouping) but would likely also refuse a full opt-out as imposing religious norms on the curriculum and disadvantanging the student.* **Own the NO:** Granting this quietly validates a principle that could segregate activities and make other students feel their presence is "immodest" or problematic, costing them an inclusive environment.

  **What the Procedure Cannot Do (Limitations):**

  1.  **Perfectly Assess Sincerity:** It relies on taking requests at face value. Truly judging depth of belief is impossible in 10 minutes and risks intrusive questioning. It might grant accommodations based on insincere requests or miss deeply held but poorly articulated needs.
  2.  **Resolve Deep Value Conflicts:** When neutrality vs. accommodation is perfectly balanced *and* legally ambiguous (e.g., a novel, non-disruptive but highly visible practice not explicitly banned), the procedure flags it for escalation (Step 5) but doesn't magically solve the underlying philosophical clash.
  3.  **Predict Community Reaction:** Granting a legitimate YES under Step 4 might still cause significant community upset the procedure can't foresee. It focuses on legal/operational/principle-based fairness, not political feasibility.
  4.  **Handle "Cumulative Burden":** Individually, 10 small requests might pass Step 2. Collectively, they could overwhelm the system. The procedure struggles with this systemic view.
  5.  **Address Hidden Costs:** The "cost" to other kids might sometimes be subtle social pressure or a sense of inequality, not a material burden or compulsion (Step 2/3). The procedure might miss these harder-to-quantify social costs.
  6.  **Evolve Automatically:** It relies on *you* keeping the Step 1 legal references updated and interpreting Steps 2-4 consistently as society and norms change. It's a framework, not an AI.
  7.  **Fix Systemic Issues:** If the canteen only serves pork-heavy meals, the procedure handles individual opt-outs but doesn't solve the underlying lack of inclusive default options. It's reactive.

  **Key Takeaway:** This procedure forces clarity by separating legality, operational burden, compulsion, and passive observance. It explicitly reveals the *Laïcité (Protection)* doctrine as the driver behind restrictions on practices that would be accommodated elsewhere, especially when those practices are seen (rightly or wrongly) as impacting others or the secular character of the school. It helps you "own the NO" when required, based on identifiable principles or constraints, not just instinct.
