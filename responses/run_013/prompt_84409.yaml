  I should structure the desiderata around their cases. Start with non-negotiable ones: minimal realism (handling fragility/solubility), masking, mimicking, stimulus-manifestation link, non-redundancy, intrinsicness, gradability, and scientific utility. Then negotiable ones like possibilism, counterfactual analysis, compositionality, and no brute modality. 

  Conflicts to highlight: intrinsicness vs. contextual gradability, non-redundancy vs. distinctness, and possibilism vs. non-manifestation cases. The vaporizing vase case tests both intrinsicness and counterfactual truth. The enzyme case challenges possibilism—must the theory allow dispositions without possible manifestation? 

  Scientific practice points: dispositions as black boxes, inferred from single instances or stats. A theory must accommodate this without requiring full knowledge of the base. 

  The excluding power: Masking (anti-cases) is the big one. Many theories fail here, especially conditional analyses. The vaporizing vase adds pressure on counterfactuals and intrinsicness. 

  Table format will help. Non-negotiable column includes the cases they provided. Negotiable includes debated points. 

  Finally, flag conflicts. Intrinsicness vs. gradability: if dispositions are intrinsic, how can resistance be relative to reference classes? Non-redundancy vs. distinctness: if the disposition isn't the base, how does it add causal power without overdetermination? Possibilism vs. enzyme case: if manifestation must be possible, the inhibited enzyme can't have the disposition, contradicting biochemists. 

