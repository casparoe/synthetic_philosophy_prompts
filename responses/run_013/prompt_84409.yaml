answer: |-
  Here’s a distilled desiderata table for a theory of dispositions, derived from your cases and core philosophical constraints. Non-negotiables are grounded in coherence with scientific practice and logical consistency; negotiables reflect metaphysical commitments. Conflicts are flagged post-table.

  ---

  ### **Desiderata for a Theory of Dispositions**
  | **Desideratum** | **Non-Negotiable?** | **Case/Constraint** | **Rationale** |
  |-----------------|---------------------|---------------------|--------------|
  | **1. Handle Simple Cases (Minimal Realism)** | Yes | Boring baseline (fragile glass, soluble sugar) | Fails if it can’t explain paradigmatic examples. |
  | **2. Accommodate Masking** | Yes | Glass fragility stripped pre-impact; coated sugar | Disposition persists despite blocked manifestation. |
  | **3. Accommodate Mimicking** | Yes | Charged rubber ball (shatters but not fragile) | Disposition ascriptions aren’t reducible to manifestations. |
  | **4. Stimulus-Manifestation Link** | Yes | All cases | Dispositions require a non-arbitrary connection between stimulus (S) and manifestation (M). |
  | **5. Non-Redundancy** | Yes | Bridge strength ≠ mere sum of beams | Dispositions must add explanatory value beyond categorical bases (no epiphenomenalism). |
  | **6. Intrinsicness** | Yes | Vaporized vase (original is fragile, replacement is not) | Disposition is a property of the object itself, not extrinsic context. |
  | **7. Gradability & Context-Relativity** | Yes | Immunity/resistance (depends on dose, reference class) | Must handle degrees and normative/normal conditions clauses. |
  | **8. Scientific Utility** | Yes | Black-box bases; inference from stats/single cases | Theory must align with how special sciences *use* dispositions (e.g., inferring from limited data). |
  | **9. Distinction: Disposition vs. Manifestation** | Yes | Enzyme inhibited but still "catalytically active" | Having a disposition ≠ manifesting it. |
  | **10. Possibilism** | **Negotiable** | Never-manifests enzyme | Can a disposition exist if M is *physically impossible*? (Biochemistry says yes; some metaphysics say no.) |
  | **11. Counterfactual Adequacy** | **Negotiable** | Vaporized vase (counterfactual false, yet fragile?) | Must clarify relation to counterfactuals, but no need for simple conditional analysis. |
  | **12. Compositionality** | **Negotiable** | Bridge’s strength | Are macro-dispositions reducible to micro-bases? (Emergence vs. reduction.) |
  | **13. No Brute Modality** | **Negotiable** | — | House rule: Anti-realist demand to ground dispositions in non-modal properties. |
  | **14. Dispositions to Acquire Dispositions** | **Negotiable** | Stem cell’s "capacity to differentiate" | Must handle higher-order dispositions without regress. |

  ---

  ### **Key Conflicts & Trade-offs**
  1. **Intrinsicness vs. Context-Relativity (Gradability)**  
     - *Conflict*: Intrinsicness (Des. 6) requires dispositions to be "in" the object, but gradability (Des. 7) often depends on extrinsic factors (e.g., "resistant relative to population").  
     - *Resolution*: Either deny strict intrinsicness (e.g., contextualist views) or treat degrees as intrinsic capacities measured extrinsically.

  2. **Non-Redundancy vs. Distinctness from Base**  
     - *Conflict*: If dispositions are distinct from their categorical bases (Des. 5), how do they avoid causal overdetermination?  
     - *Resolution*: Identity theory (dispositions *are* bases) sacrifices distinctness; pandispositionalism avoids bases but inflates ontology.

  3. **Possibilism vs. Never-Manifests Cases**  
     - *Conflict*: If dispositions require possible M (Des. 10), the inhibited enzyme lacks the disposition—contra biochemical practice.  
     - *Resolution*: Admit dispositions without possible M (e.g., finkish or masked cases generalize) or redefine "possibility" (e.g., hypothetical removal of inhibitors).

  ---

  ### **Most Excluding Desideratum**  
  **Masking/Mimicking (Des. 2 & 3)**.  
  - *Why*: Simple conditional analyses (if S, then M) fail masking/mimicking. Categoricalist theories struggle with finks. Powers-based theories need to explain how dispositions persist when masked.  
  - *Excluded*: Naive conditional analyses, some Humean supervenience views.

  ---

  ### **Theory Families vs. Key Desiderata**  
  | **Theory Type** | **Handles Anti-Cases?** | **Gradability?** | **Never-Manifests?** | **Black-Box Science?** |
  |-----------------|--------------------------|------------------|----------------------|------------------------|
  | **Conditional Analyses** | Fails masking/mimicking | Poor | Requires possible M | Poor (needs full counterfactual knowledge) |
  | **Categoricalism** | Struggles with finks | Good | Rejects if M impossible | Moderate (bases are non-modal) |
  | **Powers/Dispositionalism** | Best (built for anti-cases) | Moderate | Accepts | Strong (dispositions fundamental) |
  | **Contextualism** | Good | Best (relativized to context) | Ambiguous | Strong (fits reference classes) |

  ---

  ### **Non-Negotiables vs. Negotiable: Final Tally**
  - **Non-Negotiable**: 1–9.  
    *Why*: Failure here collapses scientific practice (e.g., calling an inhibited enzyme "catalytically active" or a masked object "fragile").  
  - **Negotiable**: 10–14.  
    *Why*: These reflect metaphysical choices (e.g., possibilism vs. actualism) or are soluble within broader frameworks (e.g., compositionality via structural equations).

  ### **The Vaporized Vase Test**  
  A theory *must* say:  
  - The original vase is fragile (intrinsicness).  
  - "If struck, it would break" is *false* (due to destruction pre-manifestation).  
  - **Crucially**: It must explain why the counterfactual fails while the disposition holds. Winning move: Dispositions are *properties*, not reducible to counterfactuals. Masking/finking breaks the S-M link without eliminating the disposition.

  ### **The Enzyme Problem**  
  An adequate theory *should*:  
  - Ascribe the disposition (per scientific practice).  
  - Ground the ascription in the enzyme’s *actual structure* (e.g., active site geometry), not possible manifestations. Content: "Under inhibitor-absent conditions, it would catalyze."  

  ---

  **Bottom Line**: Any theory flunking **masking**, **mimicking**, or **intrinsicness** is dead on arrival. The hardest trade-off is **intrinsicness vs. gradability**—pick your poison. Powers-based theories + contextual gradability handle most cases but risk bloated ontology. Your vaporized vase and enzyme cases are the ultimate stress tests.
