prompt: |-
  I am presenting at an AI safety workshop a paper arguing that inverse reinforcement learning cannot recover human preferences from behavior, because behavior is always generated under feasibility constraints; what IRL recovers is not the preference ordering but the projection of that ordering onto the feasible set. I call this the feasible-set projection problem and claim it is conceptual, not a mere identifiability issue to be fixed with more data or better priors. The audience will be mostly reinforcement learning researchers who treat IRL as Bayesian inference over reward functions, plus a few econometricians working on revealed preference and cognitive scientists who model planning. Prepare my Q&A prep sheet: the objections I will actually get, ordered by how likely and how damaging they are, each phrased the way that person would phrase it, with what I should concede up front, what I should hold, a two-minute reply, and a note on where the reply is weakest. Include the question I am hoping nobody asks.
reasoning: |-
  We are preparing a Q&A prep sheet for a presentation on the "feasible-set projection problem" in inverse reinforcement learning (IRL). The core argument is that IRL cannot recover human preferences because it only recovers the projection of preferences onto the feasible set, due to behavior being generated under feasibility constraints. The audience includes RL researchers (who see IRL as Bayesian inference), econometricians (revealed preference), and cognitive scientists (planning models).

  We need to anticipate objections, ordered by likelihood and damage. For each, we provide:
  - The objection as phrased by the questioner.
  - What to concede.
  - What to hold (the core argument).
  - A two-minute reply.
  - A note on the reply's weakness.

  Also, we include the "question I am hoping nobody asks."

  Order of objections (by likelihood and damage):

  1. From an RL researcher: Likely and damaging if not addressed well because it challenges the Bayesian framework.
  2. From an econometrician: Likely because revealed preference theory has dealt with constraints, and damaging if they point out that this is already known.
  3. From a cognitive scientist: Likely because they model planning, and damaging if they show that planning algorithms can account for constraints.
  4. Others.

  Let's list the top objections:

  **Objection 1 (RL Researcher - Bayesian Perspective):**
  - **Question:** "But in Bayesian IRL, we already account for constraints through the likelihood function. The reward posterior is conditioned on the MDP, which includes the constraints. So why is this a problem?"
  - **Concede:** That Bayesian IRL does condition on the MDP and thus the constraints are part of the model.
  - **Hold:** That conditioning on the MDP only recovers a reward function that explains the behavior within the given constraints, but not the underlying preference ordering that would hold in other constraint settings. The projection is inherent and cannot be overcome by more data or better priors without additional assumptions about how preferences generalize.
  - **Two-minute reply:** 
    "Thank you. You're right that the Bayesian approach conditions on the MDP, including constraints, and the likelihood function captures the probability of behavior given a reward and the constraints. However, the fundamental issue is that the same behavior can be generated by many different reward functions when projected onto the feasible set. Even with a prior, without strong assumptions on the structure of the reward function across different MDPs (i.e., how the reward function would behave in unobserved constraints), we cannot disambiguate the true reward from others that are equivalent on the observed feasible set. This is not just an identifiability issue that can be fixed with more data; it's a conceptual limitation of inferring preferences from behavior under constraints. We can only recover the reward up to the equivalence class defined by the constraints. To recover the true preference ordering, we would need data from multiple, diverse constraint settings, which is often not available and not assumed in standard IRL."
  - **Weakness:** The reply might not satisfy if the Bayesian believes that with a sufficiently expressive prior (e.g., one that assumes simplicity or structure) and enough diverse data, the problem is mitigated. Also, the reply does not address the possibility of active learning to gather data in diverse constraints.

  **Objection 2 (Econometrician - Revealed Preference):**
  - **Question:** "In econometrics, revealed preference theory has long dealt with the problem of inferring preferences from choices under constraints. We have methods like the Afriat’s theorem that can test for rationalizability and recover preferences. Why is your 'feasible-set projection' more than a restatement of this classic problem?"
  - **Concede:** That revealed preference theory indeed addresses the issue of constraints and that the feasible-set projection problem has similarities.
  - **Hold:** That while revealed preference theory provides conditions under which observed choices can be rationalized by a utility function, it does not recover the true utility function uniquely. The focus in IRL is often on point estimation of a reward function, which is used for transfer to new environments, and the projection problem means that without additional assumptions, the learned reward may not generalize to new constraint settings. Moreover, IRL typically assumes a specific functional form (e.g., linear) and uses complex MDPs, which goes beyond the discrete choice settings of classical revealed preference.
  - **Two-minute reply:** 
    "Thank you for the connection to revealed preference theory. Indeed, the feasible-set projection problem is analogous to the classic issue in revealed preference: we can only recover the part of the preference that is revealed by choices under constraints. However, in IRL, we often aim to learn a reward function that can be used for prediction in new environments with different constraints. The projection problem implies that the learned reward function may not transfer correctly because it was only identified on the observed feasible set. While revealed preference theory provides necessary and sufficient conditions for rationalizability, it doesn't uniquely pin down the utility function. In IRL, we typically use functional approximations and then deploy the reward in new MDPs. The projection problem means that without explicit consideration of how preferences generalize beyond the observed constraints, we risk misgeneralization. This is particularly critical in AI safety where incorrect reward functions can lead to harmful behavior in novel situations."
  - **Weakness:** The reply might not fully address that revealed preference theory can also handle transfer by requiring the utility function to rationalize choices across multiple budgets (constraint sets). If the econometrician points out that with multiple constraint sets we can recover more, then we must concede that but note that in practice we often have only one constraint set.

  **Objection 3 (Cognitive Scientist - Planning Models):**
  - **Question:** "Cognitive models of planning, such as bounded rationality, already incorporate the idea that behavior is adapted to constraints. Why can't we use similar models in IRL to account for the projection and recover the underlying preferences?"
  - **Concede:** That cognitive models do account for constraints and bounded rationality.
  - **Hold:** That even with such models, the mapping from behavior to underlying preferences is still underdetermined without additional assumptions. The feasible-set projection problem is inherent because the same behavior can result from different preferences when filtered through the constraints and the planning algorithm. Without knowing the planning algorithm exactly and having data from multiple constraint settings, we cannot uniquely recover preferences.
  - **Two-minute reply:** 
    "That's a great point. Cognitive models do account for constraints and bounded rationality, and they can be used in IRL. However, the feasible-set projection problem remains because the planning process (whether optimal or bounded) maps the underlying preferences to behavior within the constraints. Without knowing the exact planning algorithm (which we often don't) and without observing behavior across a diverse set of constraints, we cannot uniquely invert this mapping. Even if we assume a planning model, the reward function is only constrained to the extent that it produces the observed behavior under the given constraints and planning algorithm. The projection onto the feasible set means that many reward functions are behaviorally equivalent. Therefore, to recover the underlying preferences, we need not only the planning model but also data from multiple constraint settings or strong assumptions about the reward structure that hold across environments."
  - **Weakness:** The cognitive scientist might argue that with a well-validated cognitive model (e.g., from psychology) and enough behavioral data, we can constrain the reward sufficiently. Also, if the planning model is known and invertible, then the problem might be solvable.

  **Objection 4 (RL Researcher - Identifiability):**
  - **Question:** "Isn't this just an identifiability issue? With more data, especially from diverse environments, and appropriate regularization, we can narrow down the reward function. Why call it a conceptual problem?"
  - **Concede:** That with diverse data and regularization, we can sometimes get better identifiability.
  - **Hold:** That without diversity in the constraints, the problem is not resolved. Moreover, regularization itself is an assumption about the reward function (e.g., simplicity) that may not hold. The conceptual problem is that the projection is fundamental: the reward function is only constrained on the observed feasible set. Without data from environments that break the equivalence classes, we cannot recover the true preferences. Regularization is a prior assumption, not a solution to the projection.
  - **Two-minute reply:** 
    "Yes, identifiability is a key part of the problem. However, the feasible-set projection problem is more than just an identifiability issue because it highlights that without data from environments with different constraints, we cannot even in principle recover the true reward function. Regularization and priors are tools to pick one reward function from the equivalence class, but they are based on assumptions (e.g., simplicity) that may not reflect the true preferences. In AI safety, we care about the true preferences because we want the AI to behave correctly in novel situations. If we use a regularized reward that is not the true one, it may lead to unintended behavior when the constraints change. Therefore, the problem is conceptual: we are trying to infer a mapping that is fundamentally underdetermined by the data we have, and more data of the same kind (same constraints) doesn't help. We need diverse constraints to break the equivalence."
  - **Weakness:** The reply might not address the possibility that the true reward function is the simplest one, and with Occam's razor, we are justified. Also, if the prior is correct, then Bayesian inference does recover the true reward.

  **Question I hope nobody asks:**
  - **Question:** "What if the feasible set is the entire state-action space? Then the projection is the identity, and we recover the true preferences. So doesn't your critique only apply when constraints are binding? And in many real-world cases, the constraints are not binding for all decisions, so we can recover parts of the reward function without projection?"
    - This is damaging because it points out that the problem is not universal and that in some cases (when constraints are not binding) we can recover the true reward for those unconstrained parts. The critique then becomes situation-dependent, which weakens the generality of the argument.

    **How to handle if asked:**
    - **Concede:** That when the constraints are not binding (i.e., the agent could have chosen any action in a subset without constraint), then we might recover the true preferences for that subset.
    - **Hold:** That in most real-world scenarios, especially in complex environments, constraints are binding for most decisions. Moreover, even if some parts are unconstrained, the overall reward function is still underdetermined because the constrained parts dominate the behavior and the unconstrained parts might be minimal. Also, the projection problem still holds for the constrained parts, and these are often the ones that matter for safety (e.g., when constraints are safety constraints).
    - **Two-minute reply:** 
      "That's an important point. In the ideal scenario where the entire state-action space is feasible and the agent can choose arbitrarily, then indeed we might recover the true preferences. However, in practice, most environments have constraints that are binding. For example, physical limitations, safety constraints, or computational limits restrict the feasible set. Even when some actions are unconstrained, the observed behavior only reveals preferences over the chosen actions relative to the available ones. If an action was never chosen because it was infeasible, we don't know how much it was preferred. Moreover, the reward function is a global function, and without observing choices in all parts of the space, we cannot recover it entirely. Therefore, while in unconstrained settings we might recover more, the projection problem remains for the constrained aspects, which are often critical for safety."
    - **Weakness:** The questioner might argue that in many IRL applications, we are interested in the reward for the observed states and actions, and we don't need the entire function. Also, if the unconstrained parts are large, then we recover a lot.

  **Additional Preparation:**
  - Be ready with a one-sentence summary of the core argument to reiterate if needed: "The feasible-set projection problem means that IRL recovers a reward function that is consistent with the observed behavior under the given constraints, but it cannot uniquely determine the true preference ordering that would hold in other constraint settings without additional assumptions or data from diverse constraints."

  - Have a slide or two ready to illustrate with a simple example (e.g., a gridworld with a barrier: the reward function behind the barrier is not observed and hence not recoverable).

  - Be aware of recent work that tries to address this (e.g., by learning from multiple environments, or by using causal models) and be prepared to discuss why they require additional assumptions.

  This preparation should cover the most likely and damaging objections.
answer: |-
  Below is your Q&A prep sheet, structured to address the most likely and damaging objections from your audience. The objections are ordered by likelihood (based on audience composition) and potential damage to your core argument. Each objection includes the questioner's likely phrasing, what to concede, what to hold firm on, a concise two-minute reply, and a note on the reply's weakest point. I conclude with the "question you hope nobody asks."

  ---

  ### **Core Argument Recap for Context**
  Your thesis: IRL cannot recover true human preferences from behavior due to feasibility constraints; it recovers only the *projection* of preferences onto the feasible set. This is a **conceptual problem** (not solvable with more data/priors), leading to misgeneralization in AI systems.

  ---

  ### **Objection 1: Likeliest and Most Damaging (RL Researcher)**  
  **Question:** "You're ignoring that Bayesian IRL *already accounts for constraints* via the MDP and likelihood function. We condition on the environment, so the posterior *is* the true reward posterior. Isn't your 'projection' just a failure of the prior or data?"  
  *Likelihood:* High (Bayesian IRL is standard). *Damage:* High (undermines novelty; implies your critique is misguided).  

  - **Concede upfront:**  
    Bayesian IRL does condition on the MDP, and the posterior is mathematically correct given the data.  
  - **Hold firm:**  
    The posterior is only valid *within the observed feasible set*. It cannot recover preferences outside it, and priors/data don't resolve this without unrealistic assumptions about cross-environment reward consistency.  
  - **Two-minute reply:**  
    "You're right that Bayesian IRL conditions on the MDP, and the posterior correctly reflects uncertainty *given the constraints*. But this doesn't recover the *true preference ordering*—only its shadow on the feasible set. For example, if an agent never faces a choice between $A$ and $B$ due to constraints, the posterior reward for $A$ vs. $B$ is arbitrary, no matter the prior or data quantity. Priors can't inject unseen preference information; they only smooth within the feasible set. This isn't an identifiability issue—it's a fundamental limit: IRL infers rewards defined *by* constraints, not independent of them. For AI safety, this means deploying such rewards in new environments risks catastrophic misalignment, as the projection doesn't generalize."  
  - **Weakness in reply:**  
    Does not explicitly address how "hierarchical priors" (e.g., meta-learning over environments) *might* partially mitigate this. Some in the audience may argue that strong priors *can* extrapolate with theoretical guarantees.

  ---

  ### **Objection 2: Highly Likely and Damaging (Econometrician)**  
  **Question:** "Revealed preference theory (RPT) has handled constraints for decades. Afriat’s theorem shows we can recover preferences if choices satisfy GARP. Isn't your 'projection problem' just rehashing this, and why isn't it solvable with RPT-inspired methods?"  
  *Likelihood:* High (econometricians know RPT). *Damage:* High (suggests your work is derivative; solvable with existing tools).  

  - **Concede upfront:**  
    RPT elegantly handles constraints, and my feasible-set projection aligns with RPT's core challenge (e.g., Varian 2006).  
  - **Hold firm:**  
    RPT assumes rationality and recovers *a* utility function consistent with *observed* choices, but not the *true* preferences for unobserved trade-offs. IRL’s use in AI demands *transferable* rewards for novel constraints, which RPT doesn’t ensure.  
  - **Two-minute reply:**  
    "Great point—RPT is foundational here. But RPT recovers a utility function *rationalizing observed choices*, not the *latent preference ordering*. For instance, RPT can't distinguish between an agent who dislikes $X$ and one who never encountered $X$ due to constraints. IRL inherits this: it outputs rewards valid only for the training MDP. In AI, we need rewards that generalize to *new* constraints (e.g., a robot in disaster zones). RPT methods (e.g., GARP tests) don't solve this; they verify consistency, not truth. Without data from diverse feasible sets—rare in practice—the projection remains, making this conceptual. Econometric fixes like pivot experiments aren't always feasible for IRL."  
  - **Weakness in reply:**  
    Doesn't engage with modern RPT extensions (e.g., partial identification) that *might* tighten bounds on preferences. Risk of appearing unaware of recent econometrics.

  ---

  ### **Objection 3: Likely and Damaging (Cognitive Scientist)**  
  **Question:** "Planning algorithms (e.g., MCTS or bounded rationality models) already internalize constraints. Why can't we use better process models to 'invert' planning and recover true preferences, avoiding your projection?"  
  *Likelihood:* Medium (cognitive scientists focus on planning). *Damage:* Medium (could imply your critique is model-specific).  

  - **Concede upfront:**  
    Cognitive models improve IRL by refining the policy-to-reward mapping (e.g., Baker et al. 2009), and they do capture constraint-aware planning.  
  - **Hold firm:**  
    Even with perfect planning models, feasibility constraints *still* truncate the observable preference space. Inversion can only recover rewards within the set of *plausible* behaviors under constraints.  
  - **Two-minute reply:**  
    "Absolutely—better planning models (e.g., resource-rationality) help. But they don't solve the projection problem. Take an agent planning with MCTS in a maze: the reward for an inaccessible path is never expressed in behavior, so no planning model can recover it. The planner’s output is inherently constrained by feasibility. Cognitive models might refine *how* constraints shape behavior, but they still leave the reward underdetermined for unobserved states. This is why we see IRL fail in transfer learning: without exposure to diverse constraints, the 'inversion' is stuck in the feasible set. For safety-critical AI, we need preferences that hold universally—cognitive models alone don't provide that."  
  - **Weakness in reply:**  
    Ignores that cognitive models *can* incorporate counterfactuals (e.g., "what if constraints changed?"). Audience may argue simulation/mental sampling mitigates this.

  ---

  ### **Objection 4: Likely but Less Damaging (General RL Researcher)**  
  **Question:** "This sounds like an identifiability problem. With richer data (e.g., multiple environments) or better feature learning, can't we isolate the true reward? Why call it 'conceptual'?"  
  *Likelihood:* High (common intuition). *Damage:* Medium (if conceded, undermines your thesis).  

  - **Concede upfront:**  
    More diverse data (e.g., varying constraints) *can* reduce ambiguity and improve identifiability.  
  - **Hold firm:**  
    Identifiability issues are technical; the projection problem is deeper. Even with infinite data *from a single feasible set*, the reward outside it is arbitrary. "Better features" assume preferences are low-dimensional, which isn't guaranteed.  
  - **Two-minute reply:**  
    "Richer data helps, but only if it *varies the feasible set*. If all data comes from one constrained environment (e.g., a factory robot never seeing outdoors), no amount of data recovers preferences for unobserved contexts. Feature learning might compress rewards but can't invent unseen preferences—it risks encoding biases. This isn't mere non-identifiability; it's a *causal* gap: behavior is generated *conditional* on constraints. Like inferring a function from a single domain point, you need domain shifts. Since real-world IRL often lacks such shifts, calling it 'identifiability' understates the risk: we get rewards that work only in training, failing dangerously in deployment."  
  - **Weakness in reply:**  
    Underplays advances in "adversarial IRL" or active learning, where algorithms *do* seek diverse constraints. Could be seen as dismissive of empirical progress.

  ---

  ### **Objection 5: Less Likely but Damaging (Hybrid RL/Econometrics)**  
  **Question:** "Can't we treat the feasible set as a latent variable and jointly infer preferences + constraints? This is done in structural econometrics for incomplete markets."  
  *Likelihood:* Low (niche expertise). *Damage:* High (offers a direct solution).  

  - **Concede upfront:**  
    Joint inference is theoretically possible and used in econometrics (e.g., dynamic discrete choice models).  
  - **Hold firm:**  
    This shifts the problem to identifying *constraints*, which often require external data (e.g., physics laws) and still don't reveal preferences for *infeasible* options.  
  - **Two-minute reply:**  
    "Joint inference helps but doesn't escape projection. To infer constraints, we need either direct measurement (e.g., sensor data) or strong assumptions (e.g., constraints are sparse). Even then, preferences for infeasible choices—like an agent who *would* prefer $Z$ if possible—remain unobserved. Econometrics handles this via exclusion restrictions, but in IRL, such restrictions are rare (e.g., how do you experimentally 'remove' gravity for a robot?). Without them, joint inference reduces to another projection: it recovers the *joint* system of preferences + constraints, not preferences alone. For AI safety, we need preferences invariant to constraints—this approach doesn't provide that."  
  - **Weakness in reply:**  
    Assumes constraints are hard to measure; may not convince those who see simulation as sufficient.

  ---

  ### **The Question You Hope Nobody Asks**  
  **Question:** "If the feasible set is *sufficiently rich* (e.g., covering all state-action pairs), projection becomes identity. In many benchmarks (e.g., gridworlds), agents *can* explore freely. Doesn't your critique only apply to constrained settings, not IRL in general?"  
  *Why you fear it:* This could corner you into admitting your critique is domain-specific, weakening its universality. It targets the core of your conceptual claim.  

  - **Concede upfront (if pressed):**  
    In fully ergodic MDPs with unconstrained exploration, IRL *can* asymptotically recover rewards.  
  - **Hold firm:**  
    Real-world domains (e.g., autonomous driving, healthcare) are *always* constrained (safety, physics, ethics), making "sufficiently rich" feasible sets rare. Even in gridworlds, implicit constraints (e.g., time limits) create projections.  
  - **Two-minute reply (defensive):**  
    "In theory, yes—if the feasible set includes *every possible* state-action pair, and the agent explores it all, projection vanishes. But in practice, this is unattainable. No real agent has unbounded time/resources to explore all options (e.g., a medical AI can't try lethal actions). Even in gridworlds, we impose artificial constraints (e.g., episode termination). Crucially, 'sufficient richness' requires *dense* exploration, which IRL rarely assumes—we infer rewards from *observed* behavior, not exhaustive data. When constraints bind (which they often do), projection dominates. For AI safety, we must assume the worst-case: deployment in *novel* constraints where unobserved preferences matter most."  
  - **Weakness in reply:**  
    Benchmarks *are* often unconstrained, making your critique seem less applicable. Audience may argue for "constraint-aware IRL" as sufficient.

  ---

  ### **General Q&A Strategy**  
  - **Start replies by validating the questioner** ("Great point," "I appreciate that perspective") to build rapport.  
  - **Reiterate your thesis** in closers: "This isn't about better algorithms—it's about the *nature* of inference from constrained behavior."  
  - **Use examples**: e.g., "Consider a robot trained in a lab: it learns rewards for lab-feasible tasks but fails in a forest where new constraints reveal unseen preferences."  
  - **When cornered**, pivot to safety: "Even if solvable in theory, projection poses real-world risks—like reward hacking when constraints change."  
  - **For hostile questions**, defer: "Let's discuss offline—I have a toy model that illustrates this."  

  This prep sheet balances concession (showing you're grounded) with holding firm on the conceptual core. Good luck!
