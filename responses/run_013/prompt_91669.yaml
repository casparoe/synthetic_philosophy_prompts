prompt: |-
  I teach a comparative ethics seminar — 16 undergrads, 80 minutes, no prep they'll actually do. I want to run Confucian role ethics as something they experience rather than a lecture about the Analects. The claim I'm after isn't the usual "Confucians care about family and ritual." It's two sharper things. First, the self isn't something that has roles, the way a person has hats; the roles are all there is, and there's no leftover individual behind them to consult when two of them pull apart. Second, a role isn't owned by one person — what my role asks of me depends on how you're playing yours, so if you're failing as a son, my obligations as your father change. Which makes the usual seminar reflex — step back, find a neutral standpoint, apply a principle — exactly the thing that's supposed to be off the table.

  Design the activity so they walk into that. I'm imagining roles assigned as directed ties between actual people in the room (nobody gets a free-standing role like "virtuous person"), a small contested pot of something — the family's land, say — and a few forced decisions. Give me the rules, materials, the order of rounds, and how to handle the moment where a counterpart drops out: does the role still make demands once there's nobody on the other end?

  Then a debrief that maps what happened onto those two claims, tells me what'll predictably go wrong the first time (I expect they'll treat the roles as costumes they can take off and start appealing to universal principles anyway) and how to keep that from killing it, and is honest about which part of the view the activity just can't reproduce and I'll have to say out loud myself.
reasoning: |-
  Okay, the user teaches a comparative ethics seminar for 16 undergrads. They want an activity to experience Confucian role ethics, focusing on two key claims: the self as entirely constituted by roles with no independent individual, and roles as interdependent—changing based on others' actions. They want to avoid students retreating to universal principles.

  First, I need to design an interactive activity. The user mentioned assigning roles as directed ties between people, a contested resource, and forced decisions. So, roles should be relational, like "father-son" pairs. Each role must connect to another in the room, ensuring no standalone roles. 

  Materials: Role cards, tokens for the resource (like land tiles), family heirlooms to add emotional weight. Maybe use index cards and poker chips for simplicity. 

  Structure: Start with role assignment, then a peaceful round to establish relationships. Introduce a crisis—like a dispute over land. Force decisions with time pressure. Include a twist where someone "leaves" to test if obligations persist when the counterpart is absent. 

  Debrief is crucial. Map the activity to the two claims. Anticipate students might treat roles as costumes or appeal to universal principles. How to prevent that? Emphasize in the setup that roles are their identity. During the activity, redirect any abstract discussions back to role obligations. 

  What could go wrong? Students might not take roles seriously. Solution: assign roles thoughtfully, maybe based on real relationships. The "abandonment" scenario might confuse them. Debrief by highlighting how obligations linger, showing the absence of a detached self. 

  What can't the activity replicate? The deep, lifelong commitment to roles in Confucianism. The professor will need to explain that part. Also, the emotional weight of real family ties might be hard to simulate. 

  Refining the activity: Three rounds. Round 1: peaceful interaction to build role dynamics. Round 2: crisis with resource conflict. Round 3: one person leaves, forcing adaptation. Use a family heirloom to symbolize shared history. 

  In debrief, ask targeted questions connecting their actions to the claims. For example, when they compromised, point out it was role-driven, not principle-based. When someone left, discuss how roles still influenced decisions. 

  Handling the abandonment: The remaining members must still act based on their roles, showing obligations persist beyond the counterpart's presence. This addresses the first claim—no detached self to fall back on. 

  Materials: Role cards with specific obligations and relationships. Tokens for land. A physical heirloom for emotional stake. 

  Logistics: Assign roles before class. Ensure all roles are interconnected. Avoid free-floating roles. Use a family tree diagram to show connections. 

  Predictable issues: Students might step out of role. Coach them to stay in character. If they appeal to principles, ask, "What does your role require?" Highlight interdependence when roles conflict. 

  Finally, acknowledge the activity's limits: it can't replicate lifelong role internalization. The professor must explain that roles in Confucianism are deeply ingrained, not just situational.
answer: |-
  Here’s a structured activity designed to force an experiential encounter with your two core claims, followed by a debrief blueprint addressing your concerns:

  **Activity Title:** *The Wei Family Estate Crisis*

  **Core Mechanics:** Role interdependence, contested resource allocation, counterpart abandonment, enforced role-based decisions under pressure.

  **Materials:**
  1.  **Role Cards (16):** Pairs/groups of *directed relational roles* (e.g., "Elder Brother *of_ [Name/Seat#]", "Younger Sister *to_ [Name/Seat#]", "Mother *of_ [Name/Seat#]", "Father *of_ [Name/Seat#]", "Aunt *to_ [Name/Seat#]", "Respected Teacher *of_ [Name/Seat#]", "Filial Grandson *to_ [Name/Seat#]"). **Crucially:** Every role explicitly names its counterpart(s) in the room. *No one is just "a person".*
  2.  **Resource Tokens:** 24 small, identical tokens (e.g., poker chips, buttons) representing plots of the "Family Land".
  3.  **Family Heirloom:** One distinct object (e.g., a small vase, carved box) representing irreplaceable ancestral heritage/face (*mianzi*).
  4.  **Timer.**
  5.  **Large visible chart/board:** "Wei Family Land Holdings".

  **Setup (Before Class):**
  1.  Sketch a simple "family/social web" for 16 people with directed relationships. Ensure most have 2-3 key relationships (e.g., a Father is also a Son and a Brother). Include 1-2 "outsiders" with strong ties (e.g., the Teacher).
  2.  Assign roles based on this web. Write role cards specifying the role AND the counterpart(s) by name/seat number. (e.g., "You are: Elder Brother *of* [Younger Brother's Name/Seat#]" and "You are: Younger Brother *to* [Elder Brother's Name/Seat#]"). *List specific obligations* (e.g., "Respect Elder Brother", "Guide & Protect Younger Brother", "Provide for Parents", "Honor Ancestors through the Heirloom", "Seek Teacher's Wisdom"). Make obligations slightly ambiguous/open to interpretation.
  3.  Place the 24 Land Tokens and the Heirloom in the center.
  4.  Draw the starting "Family Web" (just relationships, no names) on the board.

  **In-Class Activity (60 mins):**

  1.  **Role Assignment & Context (5 mins):**
      *   Distribute Role Cards. Give students 2 mins to find their counterpart(s) and briefly confirm relationships. "Find the person you are *eldest son to*. Find the person who is *younger sister to* you." Noise is good.
      *   Introduce the fiction: "You are the Wei family. This land (tokens) is your collective ancestral inheritance, vital for survival and honor. This (heirloom) embodies your ancestors' spirit. Your roles define who you are *within this family*. Your actions should reflect your obligations *to your specific relatives*. There is no 'neutral judge' here. You *are* your relationships."
      *   State the goal: "Preserve family harmony (*he*) and honor (*mianzi*) through this crisis."

  2.  **Round 1: Harmony & Allocation (15 mins)**
      *   **Task:** Distribute the 24 Land Tokens *as a family* based on perceived needs and obligations. Decide where the Heirloom will reside (signifies honor/burden).
      *   **Process:** Open discussion. Encourage role-based appeals: "As your mother, I worry the western plots are too harsh for you..." "As eldest son, I feel duty-bound to hold the heirloom..." "Teacher, guide us..."
      *   **End:** Record final token distribution and Heirloom location on the board. *Do not judge fairness.*

  3.  **Round 2: The Crisis (15 mins)**
      *   **Introduce Crisis:** "Drought strikes! The river shifted. 8 plots (remove tokens) are now barren wasteland. The family *must* reallocate the remaining 16 plots. Further, rumors surface that the Heirloom holder neglected its care!" (Point to whoever has it).
      *   **Force Decisions:** Set timer for 12 mins.
      *   **Key Tensions:**
          *   Who loses land? (Based on role? Need? Status?)
          *   Who takes responsibility for the Heirloom "neglect"? (Holder blames drought? Others blame holder? Does the Holder's *father* share blame?)
          *   **Interdependence Trap:** If the "Negligent Heirloom Holder" is, say, the Eldest Son, how does this impact *his* Father's standing? Does the Father's obligation to guide his son change because the son failed? Does the Younger Brother's obligation to obey change?
      *   **Observe:** Watch for appeals to "fairness," "individual rights," or stepping "outside" the role. Gently challenge: "What does being *his father* require of you *now*, given his actions?" or "Is there a 'you' separate from being *her elder brother* to consult?"

  4.  **Round 3: Abandonment & Lingering Roles (10 mins)**
      *   **The Rupture:** Announce: "The strain is too much! [Target Role - e.g., the Father of the Negligent Eldest Son] declares 'I can no longer bear this shame!' and leaves the family gathering (physically leaves the room or moves to a designated 'outcast' chair, silent)."
      *   **Immediate Fallout (5 mins):**
          *   What happens to *his* land? (He "took" tokens with him? Left them? Who decides?)
          *   Who assumes his relational obligations? (Who guides the children? Who honors *his* parents?)
          *   **Crucially:** How do the *counterparts* (e.g., *his* sons, *his* wife, *his* brothers) understand their obligations *now*? Does being "Son *to_ [Abandoned Father]" still demand anything? Filial piety after abandonment? What does being "Wife *of_ [Abandoned Husband]" mean now? *Is the role void, or does it still define them, demanding new, perhaps painful, actions?*
      *   **Observe:** Do students try to "delete" the abandoned role? Or do its obligations linger and reshape others' duties?

  5.  **Final Resolution (5 mins):** Groups must report final land distribution and Heirloom status, acknowledging the abandonment.

  **Debrief (20 mins) - Mapping Experience to Theory:**

  1.  **Narrate the Experience:** Briefly recap key moments, especially conflicts, compromises, and the abandonment fallout. Ask: "What was hardest? What felt most constrained?"
  2.  **Claim 1: No Detached Self ("Roles Are All There Is"):**
      *   "When two roles pulled you apart (e.g., duty to father vs. duty to sibling), *where* did you look for the answer? Was there a 'you' behind the roles deciding? Or were you trying to figure out what *this son* or *that brother* must do *in this specific mess*?"
      *   "When [Abandoned Role] left, did the people connected to him feel *less* defined by their relationship to him? Or did that relationship *still* shape what they felt they had to do (grief, anger, taking on duties, redistributing land)? What does that suggest about where the 'self' resides?"
      *   **Predictable Problem & Fix:** Students *will* have appealed to fairness/principles. **Don't scold.** Say: "Many reached for fairness. Notice *how hard that was to define* here. Confucius might say that abstract fairness *detaches you from the specific people and history that make you who you are*. The 'pull' you felt back to your role obligations? *That's the point.* The struggle *is* the experience of having no detached self."
  3.  **Claim 2: Interdependent Roles ("Your Failure Changes My Duty"):**
      *   "Look at the Negligent Heirloom Holder. How did their failure *change what others felt obligated to do*? (e.g., Father might need to correct more harshly/defend more fiercely; Siblings might need to cover shame; Teacher might need to intervene). Did your *own* role feel different because *someone else* wasn't fulfilling theirs?"
      *   "After the abandonment: Did the 'Son' role disappear when the Father left? Or did it become a different, perhaps painful, kind of obligation (duty to mourn, duty to the ancestors despite him, duty to fill the void)? How did the *Father's* failure to endure change the obligations *of those left behind*?"
      *   **Predictable Problem & Fix:** Students might see roles as static contracts. **Highlight:** "If roles were like contracts, failing one party voids the other's duties. Did it feel like that? Or did the *relationship itself*, even broken, still generate obligations? That's interdependence."
  4.  **The "Step Back" Reflex Off the Table:**
      *   "When things got messy, did anyone *wish* they could just step back and apply a neutral rule? Why was that impossible here? Confucian ethics says *that very wish* is the problem – it asks you to step *out of* the relationships that *are* you. The agony of navigating *within* the roles *is the ethical work*."
  5.  **What the Activity CAN'T Do (Be Honest):**
      *   **Lifelong Internalization:** "We played roles for 80 minutes. Real *li* (ritual/role mastery) is cultivated over a lifetime, becoming second nature. This was a crisis simulation, not deep habituation."
      *   **Deep *Ren* (Benevolence):** The activity focuses on obligation/conflict. The deep, affective *care* (*ren*) ideally underpinning these roles is hard to simulate quickly. The bonds felt thin because they *were*.
      *   **The Positive Harmony:** We focused on conflict to expose mechanics. Real Confucian ethics aims for harmonious flourishing (*he*) *through* well-lived roles – that positive, joyful aspect wasn't the focus today.
      *   **Say This:** "What you felt was the *structure* and the *pressure* of relational identity, especially when it breaks. The deep love, respect, and joy that *should* be cultivated within these roles over time – that's the ideal we read about, but harder to stage in a seminar. Remember this tension when we read the *Analects*."

  **Predictable Problems & Mitigation:**

  1.  **Treating Roles as Costumes/Appealing to Principles:**
      *   **Mitigation:** Strong setup ("You *are* your relationships"), Role Cards with *named counterparts* and *specific obligations*, constant gentle redirection ("What does being *his* elder brother demand *right now*?"), and *using this reflex as debrief fodder* (showing its difficulty/inadequacy here) are key. Don't fight it *during*; exploit it *after*.
  2.  **Awkwardness/Silliness:**
      *   **Mitigation:** Assign roles thoughtfully (avoid sensitive real relationships), maintain a slightly serious tone during setup/crisis, use the timer to create pressure, focus debrief on the *ethical tension* not "acting".
  3.  **Abandonment Confusion:**
      *   **Mitigation:** Choose the abandoned role carefully (pivotal, with many ties). In debrief, explicitly ask counterparts "What are you *now* in relation to the one who left? What does that demand?" Highlight the lingering demands.
  4.  **Dominant Personalities/Logjams:**
      *   **Mitigation:** The directed relationships create multiple centers of authority (Parents, Eldest Son, Teacher). The crisis forces different perspectives. The timer pressures resolution.

  This design throws students into the relational fray, makes the lack of a detached self palpable through forced role conflicts and abandonment fallout, and vividly demonstrates how one person's failure dynamically reconfigures others' obligations – making the "step back" reflex both tempting and experientially unsatisfying. The debrief explicitly ties the chaos to your two sharp claims and pre-empts the inevitable appeal to universal principles by framing it as evidence *for* the Confucian critique.
