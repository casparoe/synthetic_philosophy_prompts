answer: |-
  ### Summer Examination Paper: Probability and Rationality  
  **Module Code: PHIL708**  
  **Time Allowed: 50 minutes**  
  **Marks: 20**  

  ---

  **Question**  
  Critically evaluate the claim that an agent’s vulnerability to a Dutch book (due to non-probabilistic credences) demonstrates a failure of *epistemic* rationality, rather than merely a practical disadvantage in betting scenarios. Your evaluation must:  
  (i) Precisely identify the key premises required for the Dutch book theorem to hold, explaining which premises are substantive (e.g., assumptions about bet acceptance and utility) and why they are necessary to preclude objections based on risk aversion, non-linear utility, or rejection of the betting interpretation;  
  (ii) Assess what follows from the theorem for whether non-probabilistic credences are epistemically irrational, as opposed to pragmatically inadvisable; and  
  (iii) Examine whether accuracy-first arguments (which evaluate credences using strictly proper scoring rules) resolve the tension identified in (ii), or whether they merely relocate the challenge to a different set of assumptions.  

  ---

  ### Model Answer (780 words)  
  The Dutch book theorem establishes that an agent with non-probabilistic credences can be offered a set of bets, each appearing fair individually, that collectively guarantee her a loss. While this demonstrates *practical* vulnerability, it does not self-evidently indict *epistemic* rationality. Three premises underpin the theorem:  
  1. **Bet-by-bet acceptance**: The agent accepts each bet in the package if considered singly, deeming it fair given her credences.  
  2. **Linear utility for money**: The agent maximises expected monetary value, so "fair" bets align exactly with her credences.  
  3. **Additivity of bets**: The net effect of accepting multiple bets is the sum of their individual outcomes.  

  Premise (1) blocks the objection that a rational agent would reject the package as a whole. Premise (2) is substantive: without linear utility, risk-averse agents might reject "fair" bets to avoid exposure to loss, and non-linear utility (e.g., diminishing marginal value of money) invalidates the equivalence between credences and betting odds. Premise (3) ensures no synergistic effects alter the net loss. Crucially, the theorem relies on these pragmatic constraints to define "fairness"; remove them, and incoherent credences need not compel bet acceptance.  

  This exploitability is a practical failure: it reveals poor betting strategy under specific utility conditions, not defective belief formation. Epistemic rationality concerns alignment with truth or evidence, not wealth preservation. One could coherently hold that non-probabilistic credences track evidence perfectly (e.g., in non-classical logics) while accepting Dutch-book vulnerability as a trade-off for other epistemic virtues (e.g., computational simplicity). The theorem shows only that probabilism is *necessary* for avoiding guaranteed losses *if* one accepts the premises—it cannot bridge the "why be practical?" gap to epistemic normativity.  

  Accuracy-first approaches appear to circumvent this by evaluating credences via strictly proper scoring rules (e.g., Brier score), where epistemic rationality minimises expected inaccuracy. Here, probabilism is defended as uniquely minimising *expected* inaccuracy from the agent’s own perspective. However, this relocates rather than resolves the challenge. First, scoring rules embed pragmatic choices: using quadratic rather than linear loss implicitly prioritises certain error penalties, and "accuracy" itself may be value-laden. Second, the additivity of scoring rules (summing inaccuracy across propositions) mirrors the separability in Dutch books. If an agent rejects additivity (e.g., denying that the inaccuracy of a belief set is separable), the argument lapses. Finally, accuracy arguments still appeal to *expectation*-minimisation—a tool of practical rationality. One might grant that incoherent credences are accuracy-dominated but deny that dominance is epistemically significant; it could remain a prudential heuristic.  

  Thus, neither argument conclusively proves epistemic irrationality. Dutch books highlight contingent vulnerabilities tied to action-guidance, while accuracy-first frameworks covertly inherit pragmatic elements through scoring rules and separability. The core tension persists: pragmatism and epistemic normativity are distinct domains, and neither theorem supplies a self-sufficient bridge.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  Candidates must hit these five points:  

  1. **Identification of key Dutch book premises** (4 marks)  
     *Must state: (i) bet-by-bet acceptance, (ii) linear utility/maximisation of EMV, (iii) additivity of bets.*  
     *Common error:* Omitting linear utility or treating risk aversion as irrational "irrationality" rather than invalidating premise (ii).  

  2. **Substantive role of premises** (4 marks)  
     *Must explain: Premise (ii) precludes risk-aversion objections; premise (i) blocks package-deal refusals.*  
     *Common error:* Treating the package as "inescapable" without justifying separable acceptance.  

  3. **Epistemic vs. practical implications** (4 marks)  
     *Must argue: Exploitability shows practical disadvantage alone; no necessary link to truth/evidence.*  
     *Common error:* Asserting that guaranteed loss is "obviously" epistemic or conflating money-loss with cognitive defect.  

  4. **Accuracy-first limitations** (4 marks)  
     *Must note: (i) Scoring rules impose pragmatic choices (e.g., quadratic loss), (ii) Separability persists, (iii) Expectation-minimisation is practical.*  
     *Common error:* Claiming accuracy arguments are "purely epistemic" or ignoring separability.  

  5. **Overall assessment of the gap** (4 marks)  
     *Must conclude: Neither argument closes the gap; accuracy relocates pragmatic assumptions.*  
     *Common error:* Declaring accuracy successful or treating Dutch books as obsolete.  

  ---

  ### First vs. 2:1 Distinction  
  - **First (70+)**:
    Consistently distinguishes epistemic and pragmatic rationality. Explicitly notes that accuracy arguments rely on value-laden separability (e.g., summing inaccuracy) and expectation-minimisation, which are practical tools. Avoids implying exploitability or dominance *must* be epistemic defects.  
  - **2:1 (60–69)**:
    Correctly identifies premises and limitations but occasionally conflates domains (e.g., "avoiding financial loss is epistemically urgent" or "accuracy is obviously truth-directed"). May treat accuracy as a clear upgrade without scrutinising its assumptions.  

  **Note:** Full marks are achievable for defensible lines (e.g., "accuracy *reduces* pragmatism but doesn’t eliminate it") if argued coherently against the above criteria. Consensus holds only that Dutch books prove vulnerability under premises; epistemic significance, accuracy’s purity, and separability remain contested.  

  ---  
  **Formatting note**: This question and materials adhere to British English conventions (e.g., "marks", "epistemic normativity", "minimises").
