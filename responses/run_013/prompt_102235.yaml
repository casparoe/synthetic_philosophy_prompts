  3.1. **The Calibration Crux**: In the Calibration Room experiment (described below), what should be the credence that the many-copies procedure was used, given that one awakes and sees a triangle? And how does this change in the variant with a one-in-a-thousand awakening rate?

  3.2. **The Reference Class Crux**: How should the reference class of observers be determined? Is it fixed by the context, or can it be arbitrarily chosen? And how do the assumptions handle cases of reference class mismatch?

  3.3. **The Total Evidence Crux**: How should one combine indexical and non-indexical evidence? Is there a principled way to separate them, or must they be integrated?

