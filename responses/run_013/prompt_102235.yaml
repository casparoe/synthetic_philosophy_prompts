  **Joint Statement on Self-Sampling and Self-Indication Assumptions**  

  **1. Agreed Claims**  
  The undersigned, representing the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA) positions, affirm the following:  

  1.1. Both assumptions address self-locating uncertainty—uncertainty about one's identity or spatiotemporal location among possible observers—and require the specification of a non-arbitrary reference class of observers.  
  1.2. Both are normative principles for updating credences. SSA mandates that one reason as if randomly sampled from the reference class. SIA mandates that one treat one’s existence as evidence weighted by the number of observers entailed by a hypothesis.  
  1.3. The Doomsday Argument requires, as a premise, that one's birth rank is treated as random among all past and future observers in the reference class. Without this, the argument lapses.  
  1.4. The Presumptuous Philosopher thought experiment demonstrates a challenge: SIA appears to grant disproportionate credence to hypotheses postulating more observers without empirical evidence, while SSA avoids this by demanding indexical calibration.  

  **2. Table of Disagreements**  
  The table below states unresolved disagreements at the level of principle. Each description is accepted by the respective side as its own wording.  

  | Principle Disagreement                                                                 | SSA Stance                                                                                                | SIA Stance                                                                                                |
  |----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|
  | **Evidential status of observer count**                                                | Hypotheses entailing more observers gain no probability from merely implying more observers; learning this requires indexical calibration. | Hypotheses entailing more observers gain proportional probability from the evidence of one’s existence alone. |
  | **Default treatment of self-locating evidence**                                        | Self-locating evidence must be explicitly conditioned on (e.g., via birth rank) to update credences.      | Self-locating evidence is inherently integrated via existence; no additional conditioning step is required. |
  | **Invariance under reference class changes**                                           | Credence updates depend critically on the reference class specification; changes alter conclusions.       | Credence updates exhibit greater invariance to reference class changes due to the observer-count weighting. |
  | **Handling of "no new evidence" scenarios**                                            | When no indexical evidence distinguishes observers, no update occurs; prior probabilities stand.          | Even without distinguishing evidence, observer-count differences in hypotheses necessitate an update.      |

  **3. Cruxes**  
  Settling any of the following sub-questions would resolve a core disagreement:  
  3.1. **The Calibration Crux**: Does the Calibration Room experiment (see §4) show that SSA requires additional mechanisms to match SIA’s predictions?  
  3.2. **The Reference Class Crux**: Can the reference class be defined independently of observer-count differences between hypotheses?  
  3.3. **The Existence Evidence Crux**: Is existence under a hypothesis *always* evidence for that hypothesis, irrespective of indexical particulars?  
  3.4. **The Weighting Crux**: Does the number of observers in a hypothesis directly determine evidential weight, or only after indexical calibration?  

  **4. Tests**  
  *Both tests below include predictions from each side, recorded in advance.*  

  **4.1. Calibration Room Experiment**  
  *Setup*: An experimenter flips a fair coin. Heads: She creates one copy of you in a room; the wall is painted with a triangle or square (50% each). Tails: She creates N copies (N large), each in an independent room with independent triangle/square painting (50%). You wake in a room and see a triangle.  

  *Question*: What is your credence that the coin landed tails?  

  - **SSA Prediction**:  
    - *Credence*: 1/2.  
    - *Reasoning*: The triangle is non-indexical evidence equally likely under either hypothesis. SSA’s reference class is all created observers. As a random sample, you gain no information from the triangle to distinguish heads/tails.  
  - **SIA Prediction**:  
    - *Credence*: N/(1 + N) ≈ 1 (for large N).  
    - *Reasoning*: Existence is evidence. Tails has N times more observers, so initial credence in tails is N times higher. The triangle, equally likely under both, does not alter this.  

  *Variant Setup*: Under tails, only one-in-a-thousand rooms are opened (occupants awoken); under heads, the room is always opened.  

  - **SSA Prediction**:  
    - *Credence*: N/(1000 + N) ≈ 1 (for large N).  
    - *Change from original?* Yes.  
    - *Mechanism*: Reference class shifts to *awoken* observers. Under tails, only N/1000 are awoken, so the effective observer count drops.  
  - **SIA Prediction**:  
    - *Credence*: N/(1000 + N) ≈ 1 (for large N).  
    - *Change from original?* Yes.  
    - *Mechanism*: The evidence is now "I am an awoken observer." Under tails, the probability of being awoken is 1/1000, counterbalancing the higher observer count.  

  **4.2. Cosmic Die Experiment (Collaboration-Constructed Test)**  
  *Setup*: A fair die is rolled. If 1, the universe contains 1 observer. If 2–6, it contains 1000 observers. You are an observer and know the setup.  

  *Question*: What is your credence that the die landed 1?  

  - **SSA Prediction**:  
    - *Credence*: 1/6.  
    - *Reasoning*: No indexical evidence distinguishes observers. Existence is assumed; no update occurs.  
  - **SIA Prediction**:  
    - *Credence*: 1/5001.  
    - *Reasoning*: Existence is evidence. The 2–6 outcome entails 1000 times more observers, so it is 1000 times more probable.  

  **5. Verdict on Verbal Dispute**  
  The dispute is not purely verbal. Both sides agree that "probability" refers to subjective credence under self-locating uncertainty. However, a residual verbal element arises in §2’s "Existence Evidence" row: SSA holds that "existence" is not a discrete evidence event requiring update unless accompanied by indexical particulars, while SIA treats it as fundamental evidence. Stipulating this distinction reveals a substantive crux: whether existence *alone* (without indexical details) can shift credences. If SSA’s view is stipulated, SIA’s updates appear unwarranted; if SIA’s is stipulated, SSA’s updates appear incomplete. The core substantive issue—whether observer counts directly affect hypothesis probabilities—survives this stipulation.  

  **6. Contextual Extensions**  
  - **Finite universe, unknown population**: SSA requires a prior over total population, then birth-rank calibration. SIA adjusts the prior for expected population size. Disagreement persists as in the Doomsday Argument.  
  - **Infinite or open-ended universe**: Both assumptions struggle with infinities. SSA may restrict the reference class to finite patches. SIA assigns near-certainty to hypotheses with infinite observers unless modified (e.g., with density measures). Neither position resolves this decisively.  
  - **Sleeping Beauty**:  
    - *SSA*: Favours the "thirder" view (credence 1/3 for heads) by treating awakenings as distinct within the reference class.  
    - *SIA*: Also yields 1/3 if Beauty is "indicated" by her multiple awakenings under tails.  
    - *Disagreement*: None here; both concur against "halfer" positions.  
  - **Credence vs. Decision Theory**: The dispute centres on credence, not decision theory. Both sides accept standard decision rules (e.g., maximizing expected utility) once credences are fixed.  

  **7. Closing Note**  
  Both sides agree that the following would genuinely move the debate:  
  - **Would**: Resolving the Calibration Room or Cosmic Die tests empirically (e.g., via simulations), or deriving a unified mathematical framework that reconciles both assumptions without paradoxes.  
  - **Would not**: Further iterations of established thought experiments (e.g., Doomsday or Presumptuous Philosopher) without new formal tools, or appeals to intuition alone.  

