  **Joint Statement on Self-Sampling and Self-Indication Assumptions**

  **1. Agreed Claims**

  The undersigned, representing the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) positions, agree on the following:

  1.1. Both assumptions are intended to guide reasoning under self-locating uncertainty, that is, uncertainty about one's own identity or position within a set of possible observers or experiences.

  1.2. Both assumptions are meant to be applied with a reference class of observers that is contextually appropriate and non-arbitrary, though the determination of this reference class may be subject to further debate.

  1.3. The Doomsday Argument (DA) requires, in order to run, that we have a model of the total number of humans that will ever exist and that we are currently at a random point in the sequence of all humans. The DA then uses this to update the probability of an early end to humanity. The SSA proponent accepts the DA as valid in its basic form, while the SIA proponent rejects it, but both agree that the DA relies on the premise that one's birth rank is random among all humans.

  1.4. The Presumptuous Philosopher thought experiment is intended to challenge SIA by suggesting that, if SIA were correct, one could have overwhelming evidence for a large universe even in the absence of any empirical data. The SIA proponent accepts the thought experiment as a valid challenge but argues that it can be answered without abandoning SIA, while the SSA proponent contends that it reveals a flaw in SIA.

  **2. Table of Disagreements**

  The following table records the principal disagreements at the level of principle. Each description is acceptable to the side it describes.

  | Principle Disagreement | SSA Stance | SIA Stance |
  |------------------------|------------|------------|
  | **The evidential impact of one's own existence** | One's own existence is not evidence for hypotheses that entail more observers because, under self-locating uncertainty, one should condition on being an observer. Hence, learning only that a hypothesis entails more observers does not raise its probability. | One's own existence is evidence that should be accounted for, and it is more likely that one exists in a world with more observers, all else equal. Therefore, hypotheses entailing more observers are proportionally more probable. |
  | **How to handle the reference class** | The reference class should be defined in a way that avoids arbitrary boundaries and is fixed independently of the hypotheses being considered. The reference class is crucial for determining the set from which one is a random sample. | The reference class is also important, but the SIA update effectively adjusts for the fact that one exists, which can lead to a form of reference-class invariance in some cases. |
  | **The relationship between indexical and non-indexical evidence** | Indexical evidence (about one's identity or location) should be treated separately from non-indexical evidence, and the two should not be conflated. | Indexical evidence and non-indexical evidence are integrated in a unified update, and the existence of an observer is a piece of evidence that is both indexical and non-indexical. |

  **3. Cruxes**

