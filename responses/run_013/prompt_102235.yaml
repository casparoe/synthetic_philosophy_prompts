            P(die=1) is proportional to the expected number of observers in die=1: 1.
            P(die=2-6) is proportional to the expected number of observers in die=2-6: 1000.
            and the prior on die=1 is 1/6, on die=2-6 is 5/6.
            So the probability is (1/6 * 1) / (1/6 * 1 + 5/6 * 1000) = 1/(1+5000) = 1/5001.

    So the disagreement is clear: SSA says 1/6, SIA says 1/5001.

    We propose this as our original test.

  **5. Verdict on Verbal Dispute**

  Both sides agree that there is a verbal component to the dispute, particularly regarding the term "probability" in the context of self-locating beliefs. The SSA proponent argues that probability should be understood as a subjective degree of belief that respects the principle of indifference over indistinguishable experiences within the reference class. The SIA proponent argues that probability must account for the selection effect of one's own existence. 

  However, the disagreement is not purely verbal. Even if we stipulate the same mathematical formalism (such as using a weighted world prior), the two sides disagree on whether the weights should be applied in the absence of specific indexical evidence. In the Cosmic Die test, the disagreement is about the correct update procedure and cannot be resolved by redefinition. 

  That said, the only substantive issue is the correct update procedure for self-locating beliefs in the absence of specific indexical information. The reference class determination, while important, is a separate issue.

  **6. Contexts**

  **Finite universe of unknown total population**: 
    - The SSA proponent would require a prior over the total population, and then update on one's birth rank.
    - The SIA proponent would bake in a prior that is proportional to the population size, so that the update on birth rank is altered.

  **Infinite or open-ended universe**:
    - In an infinite universe, SSA may be applied with a reference class of observers in your causal vicinity or within a finite patch, to avoid the problem of infinities.
    - SIA, however, faces the problem of infinite weights: if a hypothesis implies an infinite number of observers, then SIA would assign it probability 1 if any other hypothesis is finite. Both sides agree that infinities are problematic, and that the assumptions may need modification or may not apply in infinite settings.

  **Sleeping Beauty**:
    - In the Sleeping Beauty problem, a fair coin is flipped. If heads, Beauty is woken on Monday and put back to sleep with amnesia, and not woken on Tuesday. If tails, she is woken on both Monday and Tuesday (with amnesia after Monday). When awoken, what should be her credence in heads?
    - The SSA proponent typically argues for the "thirder" position (1/3) because there are three possible awakenings (one on heads, two on tails) and she is a random awakening.
    - The SIA proponent may also arrive at 1/3 if they interpret the awakenings as distinct observers. However, some SIA proponents may object to treating the same person at different times as distinct observers. The debate then turns on the reference class.

