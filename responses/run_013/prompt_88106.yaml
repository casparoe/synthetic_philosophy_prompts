answer: |-
  Below is a decision tree designed to guide students from the shared intuition about the sorites paradox to specific philosophical positions on vagueness. It incorporates concrete cases (including an institutional example), covers all requested diagnostic questions, marks logically available but unoccupied combinations, and highlights the divergence between epistemicism and supervaluationism. The tree uses simple, theory-neutral language for branch nodes and includes explanations where needed.

  ---

  ### **Decision Tree for Vagueness**
  **Starting Point (Shared Intuition):**  
  In a sorites series (e.g., 10,000 grains → 1 grain; clearly tall → clearly short), no adjacent pair seems different enough to mark a boundary.  

  #### **Question 1: Is there a fact of the matter about the first borderline case?**  
  *(e.g., a pile of sand that seems neither clearly a heap nor clearly not; a thesis draft that seems neither clearly "substantially complete" nor clearly incomplete)*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  #### **Question 2: For this borderline case, is the relevant sentence ("This is a heap"; "The thesis is substantially complete") either true or false?**  
  - **Yes, it must be one or the other** → **Position: Epistemicism**  
    - *Diagnosis*: Sharp boundaries exist but are unknowable. The sorites argument is unsound (the tolerance premise is false).  
    - *Divergence point from supervaluationism*: Accepts bivalence.  
  - **No, it is neither true nor false** → Go to Question 4.  
  - **No, it is both true and false** → **Position: Subvaluationism (glut/paraconsistent)**  
    - *Diagnosis*: Borderline cases are truth-value gluts. The sorites is valid but non-explosive (conclusion may be both true/false).  

  ---

  **Branch for "No" at Question 1**  
  #### **Question 3: Is the failure to assign truth/falsity due to the predicate being defective?**  
  *(e.g., "heap" or "substantially complete" cannot draw any boundary)*  
  - **Yes** → **Position: Defective Predicates (Meaninglessness)**  
    - *Diagnosis*: Vague predicates lack meaning. The sorites exposes this defect.  
  - **No** → Go to Question 4.  

  ---

  **Branch for "Neither T/F" or "No Fact" → Question 4**  
  #### **Question 4: Does the indeterminacy belong to...?**  
  - **Language or thought (e.g., semantic indecision)** → Go to Question 5.  
  - **The world itself (e.g., metaphysical indeterminacy)** → **Position: Ontic Indeterminacy**  
    - *Diagnosis*: Objects/properties are vague independently of language. Bivalence fails. Sorites is unsound (tolerance premise misstates reality).  

  ---

  **Branch for "Language/Thought" → Question 5**  
  #### **Question 5: Does the predicate's extension shift with context or practical purposes?**  
  *(e.g., "heap" depends on context; "substantially complete" depends on departmental urgency)*  
  - **Yes, with context of use** → **Position: Contextualism**  
    - *Diagnosis*: Boundaries shift contextually. Sorites is unsound (tolerance premise ignores context-sensitivity).  
  - **Yes, with context of assessment** → **Position: Relativism**  
    - *Diagnosis*: Truth is assessment-relative. Sorites is invalid (premises not jointly assertable).  
  - **No, boundaries are fixed by meaning** → Go to Question 6.  

  ---

  **Branch for "Fixed Meaning" → Question 6**  
  #### **Question 6: Is "borderline" itself vague?**  
  *(e.g., is there a sharp line between clear heaps and borderline heaps?)*  
  - **Yes** → **Position: Supervaluationism (with higher-order vagueness)**  
    - *Diagnosis*: Truth = supertruth (true in all precisifications). Sorites is unsound (tolerance premise false in every precisification).  
  - **No** → **Position: Supervaluationism (without higher-order vagueness)**  
    - *Diagnosis*: Same as above, but rejects higher-order vagueness (rare; most supervaluationists accept it).  

  ---

  **Branch for "Degree of Truth" (from Question 2)**  
  *(If "neither T/F" but degrees allowed)*  
  #### **Question D: Can truth be assigned a degree (e.g., 0.7 true)?**  
  - **Yes** → **Position: Degree-Theoretic/Fuzzy Logic**  
    - *Diagnosis*: Truth is gradual. Sorites is invalid (modus ponens fails for degrees).  
  - **No** → Return to Question 4 (if not already addressed).  

  ---

  ### **Key Features**
  1. **Institutional Case**:  
     - **Thesis Defense Rule ("substantially complete")**: Reveals how institutional stakes can *force* boundary decisions (unlike passive examples like "heap"), testing whether vagueness is resolved by context (contextualism), precisification (supervaluationism), or defect. Shows the role of **practical purposes** in Question 5.  

  2. **Divergence of Epistemicism and Supervaluationism**:  
     - They part at **Question 2** (bivalence). Epistemicism insists bivalence holds; supervaluationism rejects it (via Question 4 → 6).  
     - *Plausible Hybrid?* **Gap Epistemicism** (bivalence fails, but boundaries exist unknowably) is theoretically possible but unoccupied (unattractive: combines unknowability with no fact of the matter).  

  3. **Logically Available but Unoccupied Combinations**:  
     - **"No fact" + Bivalence (Yes at Q1 + Yes at Q2)**: Incoherent (rejects fact but insists T/F).  
     - **"Defective" + Shifting Extension (Yes at Q3 + Yes at Q5)**: Neglected (defect implies no extension to shift).  
     - **Gap + Knowable Boundary (No at Q2 + Yes at Q1)**: Unattractive (indeterminacy with knowable truth?).  

  4. **Covered Positions**:  
     - Epistemicism, Supervaluationism, Subvaluationism, Degree-Theoretic, Contextualism, Relativism, Ontic Indeterminacy, Defective Predicates.  
     - *Unseparated Pair*: **Relativism vs. Contextualism** (both say extension shifts; tree flags this).  

  5. **Diagnosis of Sorites**:  
     - Built into leaves (e.g., epistemicism → unsound; subvaluationism → valid but gluts; fuzzy → invalid).  

  ---

  ### **How to Use**
  - Students answer questions **without seeing position names** until the end.  
  - The institutional case ensures engagement beyond "heap"/"tall".  
  - Tree ends at 7 leaves (epistemicism, subvaluationism, defective, ontic, contextualism, relativism, supervaluationism, degree-theoretic), with higher-order vagueness as a sub-branch.  

  This tree isolates core commitments while exposing underdeveloped options, priming students for deeper debate on epistemicism/supervaluationism.
