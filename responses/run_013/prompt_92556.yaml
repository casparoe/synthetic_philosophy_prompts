answer: |-
  Here is a comprehensive specification of desiderata for a theory of the analytic-synthetic distinction, grounded in the philosophical challenges and your scientific concerns. Requirements are classified as **Non-Negotiable** (N) or **Contested** (C), with justifications and key tensions highlighted.

  ---

  ### **I. Core Classification & Case Handling**
  1.  **Accommodate Agreed Core Cases (N):**
      *   *What:* Correctly classify undisputed analytic truths (e.g., "All bachelors are unmarried," "Triangles have three sides," "Vixens are female foxes") and synthetic truths (e.g., "Water boils at 100°C at sea level," "There are mountains on Mars").
      *   *Why:* Any theory failing this lacks basic explanatory power.
      *   *Case:* Failure here renders the distinction useless.

  2.  **Principled Handling of Disputed Cases (N):**
      *   *What:* Provide clear, justified verdicts on contentious examples:
          *   "7 + 5 = 12" (arithmetic identity)
          *   "All vixens are female" (entailment from meaning)
          *   "All cats are animals" (taxonomic classification)
          *   "Water is H₂O" (theoretical identity - post-discovery)
          *   "No surface is wholly red and wholly green simultaneously" (conceptual exclusion)
          *   "P ∨ ¬P" (logical tautology)
          *   "Hesperus is Phosphorus" (identity statement - pre/post discovery)
      *   *Why:* These test the theory's robustness across logical, semantic, taxonomic, and scientific domains. Vagueness here invites skepticism.
      *   *Case:* Your concern about definitions vs. empirical claims in theory change hinges on cases like "Water is H₂O".

  ---

  ### **II. Essential Distinctions to Preserve**
  3.  **Distinguish Analytic from Necessarily True (N):**
      *   *What:* A theory must not equate analyticity with metaphysical necessity. Not all necessary truths (e.g., "Water is H₂O") are analytic; not all analytic truths are obviously about deep metaphysical necessity.
      *   *Why:* Kripkean arguments show necessity can arise empirically. Collapsing the distinction obscures how meaning and modality relate.
  4.  **Distinguish Analytic from A Priori (N):**
      *   *What:* Analytic truths are *one source* of a priori knowledge, but not the only source (e.g., rational intuition, conceptual analysis might yield synthetic a priori truths for some).
      *   *Why:* Kant's challenge and contemporary debates (e.g., moral knowledge, mathematical intuitionism) demand this separation.
  5.  **Distinguish Analytic from Merely Conventional Definition (N):**
      *   *What:* A truth stipulated by explicit definition ("Let 'blurg' mean a green apple") is analytic *because of* the stipulation. But many analytic truths (e.g., "Vixens are female") seem deeper, reflecting conceptual connections *within* a language, not arbitrary fiat. The theory must explain this depth.
      *   *Why:* Avoids trivializing analyticity; addresses how "implicit definition" works in science.
  6.  **Distinguish Analytic from Epistemically Obvious/Trivial (C):**
      *   *What:* Some analytic truths are non-obvious (e.g., complex logical equivalencies, implications of scientific definitions). Analyticity ≠ psychological obviousness.
      *   *Why:* (Contested) Some equate obviousness with analyticity; others see it as a distraction. Crucial for scientific contexts where definitions have complex implications.

  ---

  ### **III. Theoretical Requirements**
  7.  **Non-Circular Account of "True by Virtue of Meaning" (N):**
      *   *What:* Define analyticity without relying on synonyms, definitions, or necessity in a way that presupposes the very notion being defined. Must explain *how* meaning alone makes the truth hold.
      *   *Why:* Quine's regress argument targets circularity. This is the central technical hurdle for *any* pro-distinction theory.
  8.  **Clarify Binary vs. Graded Distinction (C):**
      *   *What:* Must explicitly state whether analyticity is all-or-nothing (binary) or a matter of degree (e.g., based on centrality of concepts, revisability cost). Justify its stance.
      *   *Why:* (Contested) Quine/Carnap later views suggest gradedness; traditional views are binary. Impacts how theory handles borderline cases and theory change.
  9.  **Naturalizable Epistemology (C):**
      *   *What:* Explain how we *know* analytic truths in a way compatible with a scientific understanding of cognition (e.g., via conceptual role, inferential dispositions, linguistic training). Avoids mysterious rationalist faculties.
      *   *Why:* (Contested) Essential for naturalists; others (rationalists) may reject the demand. Your scientific background likely favors this.
  10. **Compatibility with Semantic Holism & Confirmation Holism (N):**
      *   *What:* Must be consistent with Quine's core insight: individual sentences generally lack determinate empirical content ("Two Dogmas"); meaning is interdependent across the web of belief; *all* beliefs are potentially revisable under sufficient empirical pressure *as a last resort*.
      *   *Why:* Rejecting holism outright is empirically and philosophically implausible for most contemporary views. Central to your concern about corporate bodies facing experience.
  11. **Acknowledge Historical Blurring in Science (N):**
      *   *What:* Must account for the fact that in scientific revolutions (e.g., Newtonian -> Relativistic mass; Phlogiston -> Oxygen; Newtonian Absolute Time -> Relativistic Spacetime), what looked like an analytic definition ("Mass is invariant") became revisable synthetic claims, and vice-versa. Must explain *how* this happens without collapsing the distinction entirely.
      *   *Why:* Directly addresses your core motivation regarding constitutive rules vs. empirical claims in flux.

  ---

  ### **IV. Pragmatic & Functional Requirements**
  12. **Do Real Work (N):**
      *   *What:* The distinction must illuminate significant philosophical/scientific problems (e.g., explaining a priori knowledge, clarifying meaning change in science, grounding logic/mathematics, analyzing conceptual truths) beyond merely labeling examples. It must be *explanatory*.
      *   *Why:* Avoids being a trivial or useless categorization. Essential for your goal of understanding scientific theory structure.

  ---

  ### **Key Tensions & Excluding Factors**
  *   **Most Excluding Requirement:** **#7 (Non-Circular Account)** is the major graveyard of theories. Quine's regress argument ("Truth by virtue of meaning" requires defining 'meaning', which itself relies on analyticity/synonymy) eliminates many naive accounts. **#10 (Compatibility with Holism)** is a close second, excluding rigid, atomistic conceptions of meaning.
  *   **The Core Tension (Likely Jointly Unsatisfiable Pair):** **#10 (Holism/Revisability) vs. #4 (Analytic ≠ A Priori) / #1 (Core Analytic Cases).**
      *   *The Conflict:* Holism (#10) insists *no* belief is absolutely immune to revision under extreme empirical pressure ("Even the law of the excluded middle might be revised for quantum phenomena!"). However, the very definition of analyticity (#1, #4) seems to entail *unrevisability* based on meaning alone – revising "All bachelors are unmarried" seems to change the meaning of 'bachelor', not falsify a synthetic claim. A theory declaring some truths analytic *because* they are unrevisable a priori clashes directly with holism's denial of *any* absolute unrevisability. Accommodating both requires finesse: perhaps analytic truths are *maximally* central/constitutive, making their revision equivalent to meaning change/language abandonment rather than empirical falsification *within* the language, but holists (like Quine) see this as a distinction without a difference. **This tension *is* the heart of the debate.** A successful theory must either dissolve it convincingly or embrace one side fully.

  *   **Potential Prejudice:** **#9 (Naturalizable Epistemology)** might be seen as a prejudice of the naturalist/scientific camp. Rationalists (e.g., proponents of robust synthetic a priori) might argue that some knowledge (e.g., pure logic, fundamental concepts) simply cannot be reduced to natural cognitive processes and requires a distinct rational faculty. Your background makes this desirable, but it's not universally accepted as mandatory for a *semantic* distinction.

  ---

  ### **Assessment of Key Positions**
  *   **Logical Positivism (e.g., Ayer, early Carnap):**
      *   *Strengths:* Clear binary distinction (#8), handles core cases (#1), emphasizes verificationism linking meaning to empirical content (touching #12).
      *   *Failures:* **Catastrophically fails #7:** Relies on verificationism and an unanalyzed notion of "synonymy" or "definition" vulnerable to Quine's regress. **Fails #10:** Treats analytic truths and protocol sentences as foundations immune to revision, rejecting holism. **Fails #11:** Cannot adequately handle meaning change in scientific revolutions without implausible claims about redefinition. **Fails #3/#4:** Often conflated analytic, a priori, and necessary. Lacks naturalized epistemology (#9).

  *   **Quine ("Two Dogmas"):**
      *   *Strengths:* **Excels at #7, #10, #11:** Provides powerful arguments against non-circular accounts of analyticity; masterfully defends holism and describes the revisability of all beliefs, explaining historical blurring. Forces a naturalized view (#9).
      *   *Failures:* **Rejects the core distinction (#1, #12):** Argues there is *no* principled difference, merely a gradation of centrality/revisability (#8 graded). **Collapses key distinctions (#3, #4, #5):** Rejects the a priori/synthetic divide and reduces necessity/convention to pragmatic centrality. **Fails #12 (for your purpose):** While doing immense philosophical work, it arguably doesn't provide the distinction *you* seek to illuminate constitutive vs. empirical elements in science, seeing it all as one pragmatic web.

  ---

  **Conclusion:** The desiderata reveal the analytic-synthetic distinction as a powerful but fragile tool. The non-negotiable requirements (#1, #3, #4, #5, #7, #10, #11, #12) are stringent, and the tension between unrevisability-by-meaning (#1, #4) and universal empirical revisability (#10) is profound. **No theory perfectly satisfies all.** Quinean holism satisfies many but abandons the distinction itself. Contemporary attempts (e.g., Carnap's later tolerance, inferential role semantics, two-dimensional semantics, neo-Fregeanism) grapple with these demands, often embracing gradedness (#8) and attempting to reconcile constitutive roles (#12) with holism (#10, #11) using sophisticated tools, but the specter of circularity (#7) and the core tension remain significant challenges. Your quest for clarity on constitutive rules in science pushes towards salvaging *some* distinction, but the path is fraught.
