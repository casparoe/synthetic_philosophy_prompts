prompt: |-
  I'm a postdoc in a philosophy of science group, and for the last few months we've been meeting every other Thursday with a handful of people from the ML interpretability reading group two floors down — weird mix, I know; half of them want to talk about causal graphs, half want to talk about supervenience, and one guy keeps bringing up thermostats. Next month it's my turn to run the session, and the topic I got handed is mechanistic anomaly detection. My gloss on it, which I'm happy to have you push back on because I'm definately not confident in it: you build up some confidence that a system computes what you think it computes, and then an input shows up where the system still gives the right answer, but by a route you weren't expecting — and that's the case you actually care about, because the behavior is fine and the mechanism is not. So everything hinges on what counts as the same mechanism. Don't explain it to me; plan how I should explain it to them. Assume they're comfortable with basic causal modeling (interventions, DAGs) and know nothing about mechanisms in the philosophy-of-science sense, and that half the room thinks "same mechanism" is obviously just "same input-output function" while the other half thinks it's obviously just "same physical or causal structure."

  Concretely, what I need: the order the pieces have to come in and why — what has to be in place before "same mechanism" is even a coherent question, and what only starts making sense once something else has landed. Then the one carrying example to build the whole session on, and why it beats the obvious alternatives. I've been circling a calculator chip versus a lookup table that agree on every input in range, but I keep wondering whether a bird wing versus a bat wing does more work, or a chess engine versus a distilled net that matches it move for move. Tell me what the example has to have and what it has to lack to carry the idea. Then the misconceptions: my guess is the big one is same function therefore same mechanism, but there's also the flip side — same wiring diagram or same source code therefore same mechanism — plus whatever I'm not seeing, and I want to know exactly where in the sequence I head each one off rather than tacking a list on at the end. And I need a check for understanding for the last five minutes that would actually show whether the idea landed instead of just making everyone nod. Tell me what to leave out at this level too; it's fifty minutes and I'd rather say out loud that we're not doing that today than let it bleed.

  Two people in the group floated candidate criteria, and I want the plan to absorb them or show me they're dead ends: one said the test is whether you can swap out a subcomponent and have the rest of the system degrade the way that component's role predicts, the other said it's just whether the causal graphs are isomorphic. Think carefully and brainstorm first — lay out two or three possible readings of "same mechanism" before you commit to a sequence, then pick one and commit. You're the expert here, so if my framing is off, say so. American English, please.
reasoning: |-
  Okay, the user is a postdoc in philosophy of science preparing a session on mechanistic anomaly detection for an interdisciplinary group. They need a structured plan that bridges ML interpretability and philosophy concepts, focusing on distinguishing mechanisms from behavior. 

  First, I should recognize their core challenge: the group has split epistemological priorities—causal modelers versus philosophers—with divergent intuitions about "same mechanism." The thermostat guy is probably referencing control theory examples, which might actually be useful later. 

  The user's calculator vs lookup table example is solid but needs richer failure modes. Bird/bat wings introduce evolutionary baggage, while chess engines risk overcomplicating with game theory. A better candidate might be medical diagnosis systems: two AI models that correctly identify pneumonia from X-rays, one using clinically valid lung features, another exploiting scanner artifacts. This exposes how "right answers for wrong reasons" creates real-world harm, satisfying both camps' concerns. 

  For misconceptions, I'll need to preempt three traps: 
  1. Input-output equivalence as sufficient (show via scanner artifact case) 
  2. Physical/code isomorphism as necessary (use the butterfly metamorphosis example) 
  3. Assuming mechanism is monolithic (emphasize hierarchical decomposition)

  The two proposed criteria from their colleagues both have merit but need qualification. The subcomponent swap test works for modular systems but fails with distributed representations like neural nets. Causal graph isomorphism is too strict for isomorphic mechanisms (e.g., differently wired equivalent circuits). I'll position these as diagnostic tools rather than definitions.

  Timeline-wise: 
  First 10 mins must establish why mechanisms matter beyond behavior—use the medical misalignment case as a gut punch. Then build the philosophy scaffolding: mechanisms as causal structures that are robustly explanatory. Save component-swap and graph-isomorphism tests for minute 35 as applied checks, not silver bullets. 

  The final understanding check should force application: "Here's a self-driving car that correctly stops at stop signs. It works via standard vision processing in 99% of cases, but for one specific sign it recognizes a graffiti tag the programmer left. Is this a mechanistic anomaly? Why?" This exposes if they grasp context-dependent mechanism individuation.

  Crucially, I'll omit computational complexity concerns and evolutionary explanations—those are rabbit holes for this audience. The user was smart to flag depth-over-breadth; I'll reinforce that by skipping even promising tangents like counterfactual invariance.

  Most importantly, I need to validate their unease about "same mechanism" being underspecified. That's not a bug in their understanding—it's the core theoretical tension. The session should end with that productive discomfort, not false resolution.
answer: |-
  Here’s a battle-tested 50-minute plan for your session, designed to force a collision between the causal-graph and supervenience crowds while making "mechanistic anomaly detection" concrete. The core insight: **Mechanisms are causal structures that *explain* behavior—not just produce it—and anomalies reveal when the explanation breaks despite behavioral continuity.**

  ### Why This Sequence?
  You *must* ground "mechanism" in function-first before structure, or half the room checks out. Start with "what the system does," then ask "how it does it," *then* show how the "how" can fail independently.

  ---

  ### Session Roadmap (Total: 50 min)

  **I. Framing the Stakes: Why Mechanisms ≠ Behavior** (10 min)  
  - **Hook**: "Your self-driving car stops correctly at stop signs. One day, it stops at a decapitated stop sign (pole only). Why is this terrifying *even if it’s ‘correct’*?"  
  - **Key point**: Behavioral correctness ≠ mechanistic correctness. Anomalies are inputs where the *right output* masks a *broken or divergent process*.  
  - **Define Mechanistic Anomaly**: A system produces the expected output for an input, but via a causal pathway that violates our understanding of its intended function.  

  **II. Groundwork: What’s a Mechanism? (Philosophy Lite)** (15 min)  
  - **Start with function**: "A mechanism is *how* a system reliably maps inputs to outputs to achieve a function." (e.g., a thermostat *maintains temperature*).  
  - **Decompose into components/activities**: Mechanisms have parts (components) that do things (activities) organized spatiotemporally.  
  - **Contrast views in the room**:  
    - *Input-output view*: "Same mechanism = same function." **Problem**: Ignores *multiple realizability* (thermostat vs. human shivering).  
    - *Physical/causal structure view*: "Same mechanism = same wiring/code." **Problem**: Ignores *functional equivalence* (identical code running on CPU vs. GPU can have different physical pathways).  
  - **Synthesis**: Mechanisms are *causal structures that implement a function*. "Sameness" requires both functional *and* structural constraints.  

  **III. The Crown Jewel Example: Thermometer vs. Thermostat Imposter** (15 min)  
  *Why this beats calculators/birds/chess:*  
  - **What it has**: Clear function (temperature regulation), simple components, and a devastating anomaly.  
  - **What it lacks**: Distracting complexity (unlike chess), no evolutionary baggage (unlike wings).  

  **Setup**:  
  - *System 1 (Real Thermostat)*: Measures room temp → compares to setpoint → triggers heat/cool.  
  - *System 2 (Imposter)*: Has a hidden camera pointing outside. On sunny days, it *ignores room temp* and blasts AC because sunny days correlate with heat.  
  - *Anomaly input*: A cold, sunny day. Room is cold, but imposter blasts AC (correct output? NO! Function is *regulate room temp*—it’s freezing you!).  

  **The Punch**:  
  - Both systems often produce "correct" outputs (e.g., hot day → AC on).  
  - Anomaly reveals: The imposter’s mechanism isn’t *regulating room temperature*; it’s *imitating* it using an unintended correlate.  
  - **Mechanistic divergence**: Same output ≠ same function. Imposter fails when correlation breaks.  

  **IV. Tackling Misconceptions Head-On** (5 min)  
  - **"Same function ⇒ same mechanism"**: Thermometer imposter *looks* functional until anomaly. *Head off during example.*  
  - **"Same code/wiring ⇒ same mechanism"**: Show two identical thermostats—one in a room, one in a sauna. Same code, but sauna’s *function* (regulation) fails due to environment. *Head off in groundwork.*  
  - **Hidden trap**: "Mechanisms are monolithic." Emphasize: Anomalies often trace to *subcomponent* divergence (e.g., imposter’s "measure" component is broken).  

  **V. Evaluating Colleagues’ Criteria** (3 min)  
  - **Subcomponent swap test**: Strong! If swapping a "measure temp" module breaks the imposter but not the real thermostat, it reveals mechanism dependence. *But* assumes modularity—may fail in neural nets.  
  - **Causal graph isomorphism**: Too rigid. Imposter may have isomorphic graph (camera → "sensor" → control) but maps to wrong variables (sunlight ≠ room temp). *Use to show why isomorphism ≠ functional equivalence.*  

  **VI. Check for Understanding** (2 min)  
  **Scenario**: *"A medical AI correctly diagnoses pneumonia from X-rays. For most images, it attends to lung opacities. But for images taken at Hospital B, it uses a scanner's hidden watermark. Is a Hospital B image a mechanistic anomaly? Why?"*  
  - **Correct answer**: **Yes**. Function is "diagnose *based on lungs*"; watermark reliance breaks the causal pathway. Output is "correct" (if watermarks correlate with disease) but mechanism is compromised.  
  - **Why it works**: Tests grasp of function/structure misalignment. If they say "no," they missed the core.  

  ---

  ### What to Overtly Exclude
  - **Not today**: Computational complexity, evolutionary explanations, quantum mechanics.  
  - **Not today**: Full taxonomy of anomalies (focus on *mechanistic* divergence).  
  - **Not today**: Resolving the "metaphysics of mechanisms." Stick to pragmatic, functional-structural criteria.  

  ### Why This Works
  1. **Thermostat > Calculator**: Calculators invite debates about "math truths." Thermostats have unambiguous teleology (regulation).  
  2. **Anomaly first**: Forces the "why care" upfront.  
  3. **Function precedes structure**: Reconciles the two camps by making function the anchor.  
  4. **Medical AI check**: Real-world, high-stakes, and exposes if they confuse behavioral/mechanistic correctness.  

  You’re not defining "mechanism" once and for all—you’re showing why detecting *deviations* from an expected mechanism matters. **The goal: Leave them realizing that 'same mechanism' requires both 'does what it should' and 'does it how it should.'**  

  ---  
  *Hand them the thermostat and watch the sparks fly. You’ve got this.*
