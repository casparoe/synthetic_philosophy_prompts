prompt: |-
  I write about science and ideas for a living, which mostly means my friends now ask me to referee arguments I'm not qualified to referee. Here's the current one.

  My sister is applying for a job at a small research outfit. After the interviews, they asked her to do a "trial project" — about a week of real work, unpaid, and they say they won't use anything she produces. Her boyfriend thinks this is smart. His line: anybody can claim to be detail-oriented and hardworking on a resume, and anyone can fake enthusiasm in an interview, but only someone who will actually burn a week of her life for nothing has proven she wants it. He says if they paid everyone for the trial, or cut it down to an hour, the whole point would evaporate. My sister says the opposite: she'd have done that week for literally any job she'd applied to, so all it proves is that she's desperate and has savings. Also, one of the other finalists is a kid with family money who took a month off to travel; another has two kids and a day job. If the week is the test, she says, the test measures the wrong thing.

  Then she went and did the project anyway, and got the job, so now she's mad at herself and also thinks the process was rigged in her favor.

  I think they're both half right and I can't articulate why. His point seems to be that the waste is what makes the claim believable — that if the trial were easy, or fun, or paid, it wouldn't tell them anything. But then her point kicks in: what it tells them depends on who can afford the waste, and it might be telling them she's desperate rather than that she's good.

  Where I get stuck is the counterfactuals. If the company paid for the trial, would they learn less? If they made the project genuinely interesting, would they learn less? If it took a month instead of a week, would they learn more, or just end up fishing in a different and worse pond? And is there any version of this that gets them the information without the pointless week, or is the pointless week itself the information? I'd also like to know whether it matters that they don't use the output, and what changes if they do.

  And how do I think about the ethics here seperately from the mechanics? If the filter genuinely works, does that make it fair? Would your answer change if the place were a nonprofit my sister admired rather than some random lab, or if the trial were the only way a broke candidate could get in the door?

  I'm definately out of my depth. Could you walk me through the general shape of this — why a useless cost can be informative at all, when that breaks down, and what a smarter version of this process would look like? A verdict on my sister's case wouldn't hurt either.
reasoning: |-
  Okay, let me unpack this. The user is a science writer caught between friends arguing about unpaid trial work. His sister did a week-long unpaid project to get a job, succeeded, but feels conflicted. The boyfriend sees it as a genuine commitment test, while the sister thinks it selects for privilege or desperation. 

  First, I need to recognize the core tension: the boyfriend's "costly signal" theory vs the sister's "biased filter" concern. The user wants to understand both the mechanics (why waste might signal value) and the ethics (when such signals become unfair). 

  Hmm, the user's real struggle seems to be with counterfactuals. He's asking: Would paying ruin the signal? Would shorter trials work? Is the uselessness necessary? That's where economic signaling theory might help. Remember Spence's job market model - costs can reveal hidden attributes. But crucially, Spence also warned about access barriers.

  Let me mentally simulate variations:
  - Paid trial: Removes financial barrier but might attract less committed candidates? Though one could argue pay would test professionalism.
  - One-hour trial: Too cheap to signal deep commitment, only basic skills. 
  - One-month trial: Filters out anyone without extreme privilege, shrinking talent pool unhealthily.
  - Useful output: Ethically better, but if candidates know it'll be used, effort becomes transactional, not sacrificial.

  Ah, and the sister's case adds wrinkles: She won, but feels the process favored her savings over merit. Valid. The family-money candidate and parent finalist prove her bias argument. Yet the firm likely did learn she was diligent - just not exclusively so. 

  Ethically, my gut says unpaid trials cross a line. Even nonprofits exploit power imbalances. The "only path for broke candidates" angle is tricky - if the trial replaces traditional credentials, it could democratize, but unpaid work usually does the opposite. 

  For the user, I should emphasize that costly signals aren't magic. They work within narrow parameters (when cost correlates perfectly with desired trait) but often misfire in messy reality. The smarter version? Paid micro-projects assessing actual skills, plus staged commitments (e.g., paid short trial post-offer). 

  And for his sister - she's right to feel icky. The process selected for persistence, yes, but also for candidates without dependents or financial pressure. Her success doesn't validate the method, just means she cleared an arbitrary hurdle. 

  Final thought: The user's science background might appreciate the evolutionary biology parallel - like peacock tails, costly signals are effective precisely because they're wasteful. But in nature, such signals can drive populations to extinction. Humans should know better.
answer: |-
  You've hit on a fascinating intersection of economics, psychology, and ethics. Here's a breakdown of why the "costly signal" works (in theory), why it's flawed in practice, and how to think about your sister's case:

  ### 1. **The Boyfriend's Point: Why a "Useless Cost" Can Be Informative**
     - **Costly Signaling Theory**: This comes from evolutionary biology/economics. A credible signal must be *costly* to fake. If a trial project is easy, paid, or short, anyone could do it without genuine commitment. But burning a week of unpaid work is a "costly" investment only someone *truly interested* would likely bear.
     - **Separating Equilibrium**: The goal is to separate "serious" candidates from "casual" ones. The financial/time cost acts as a filter. If the firm paid everyone, it might attract opportunists. If it took an hour, it wouldn’t test stamina or grit.
     - **The "Sunk Cost Fallacy" as a Tool**: Ironically, the firm exploits human psychology. Candidates who invest unpaid effort may feel psychologically committed to seeing the process through, reducing their likelihood of dropping out later.

  ### 2. **Your Sister's Point: Why the Signal is Flawed & Biased**
     - **Wealth/Privilege Bias**: The cost isn’t equally burdensome. Candidates with savings/family support (like the "kid with family money") can absorb the loss easily. Those with kids/day jobs (the other finalist) may be filtered out *despite being qualified*.
     - **Measures "Desperation," Not "Fit"**: As your sister noted, the test selects for candidates who can afford to work for free, not necessarily the best skill/cultural fit. A desperate candidate might endure the week for *any* job, while a highly skilled one with options might refuse on principle.
     - **Opportunity Cost**: A week unpaid isn’t just a financial loss—it’s a week not spent job-hunting, freelancing, or resting. This disproportionately harms marginalized groups (e.g., single parents, low-income applicants).
     - **False Positives/Negatives**: A candidate might do the trial due to privilege (not passion), or a star candidate might refuse, deeming the process exploitative.

  ### 3. **Counterfactuals: What Changes the Signal?**
     - **If Paid**: Reduces bias (more candidates can participate), but weakens the "commitment signal." *However*, it could test professionalism (e.g., "Do they treat paid work seriously?"). **Verdict**: Better ethics, similar skill assessment, weaker commitment signal.
     - **If Genuinely Interesting**: Attracts candidates who enjoy the work, but may select for intrinsic motivation over practical skills. **Verdict**: Better for roles needing creativity/passion, worse for testing mundane-task endurance.
     - **If Longer (e.g., a Month)**: Exacerbates privilege bias. Only the wealthy/unemployed could participate. **Verdict**: Worse signal, smaller talent pool.
     - **If Output is Used**: Ethically murky (free labor). Candidates might exert more effort, but the signal of "sacrifice" weakens—it becomes transactional. **Verdict**: Unethical unless paid; undermines the boyfriend's "costly signal" theory.

  ### 4. **Smarter Alternatives to the "Pointless Week"**
     - **Paid Micro-Projects**: 2–4 hours of paid work testing core skills. Filters for competence, not privilege. Cost to firm is low, access is equitable.
     - **Staged Commitments**: Offer a *conditional* paid trial (e.g., "We’ll pay you for 2 days if you pass the initial interview"). Reduces risk for both sides.
     - **Portfolio Substitutions**: For creative/technical roles, accept past work samples + a short, paid skills assessment.
     - **Reference Checks with Teeth**: Ask past employers/colleagues specific questions about work ethic, detail orientation, etc.
     - **Probation Periods**: Hire faster with a 1–3 month paid probation. Fires faster too if unfit.

  ### 5. **Ethics vs. Mechanics: Does "It Works" Make It Fair?**
     - **No**. Even if the filter "works" (i.e., selects diligent hires), it may be:
       - **Unjust**: Discriminates against socioeconomically disadvantaged candidates.
       - **Inefficient**: Misses top talent unwilling to engage with exploitative practices.
       - **Legally Risky**: Unpaid trials often violate labor laws if the work benefits the firm (even indirectly).
     - **Context Matters, But Not Enough**:
       - **Nonprofit/Passion Project**: Might attract more tolerance, but still inequitable. A candidate's admiration shouldn’t justify exploitation.
       - **"Only Path for Broke Candidates"**: If the trial replaces traditional credentials (e.g., Ivy League degrees), it *could* democratize access. But unpaid work typically does the *opposite*. A paid trial would serve this better.

  ### Verdict on Your Sister's Case
  - **She Was Half-Right**: The test *did* measure her commitment, but it also measured her financial security (and possibly desperation). Her success doesn’t validate the process—it just means she cleared an arbitrary barrier others couldn’t.
  - **Her Self-Frustration is Misplaced**: Doing the trial was rational (she wanted the job), and getting it proves competence *beyond* the trial. Her anger should be at the system, not herself.
  - **The Firm’s Approach Was Lazy**: They prioritized a crude commitment filter over equitable hiring. A paid micro-project or skills assessment would have been fairer and equally informative.

  ### The Big Picture
  Costly signals work when the cost correlates *perfectly* with the desired trait (e.g., "willingness to sacrifice"). But in practice, costs are entangled with privilege, making the signal noisy and unjust. A well-designed hiring process assesses skill *directly* (via work samples, tests) and commitment *indirectly* (via interviews, references)—without exploiting candidates. The "pointless week" isn’t just unethical; it’s a missed opportunity to build a diverse, loyal team.

  Your sister’s victory is real, but the process was a blunt instrument. The best employers don’t confuse "willingness to be exploited" with "passion."
