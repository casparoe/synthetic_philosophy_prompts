prompt: |-
  I have been trying to settle what I think about killing in war, taking as my starting point Anscombe's argument that Truman's bombing of Hiroshima and Nagasaki was murder rather than a regrettable necessity. She is plainly relying on a distinction that has to do with intention, and I want to know what principle, if any, fits the verdicts I actually hold. Here they are.

  Bombing a munitions plant at the edge of a town, foreseeing that some of the workers and residents will be killed though my aim is only to destroy the plant: not murder.

  Bombing a city in order to kill its inhabitants and so break the government's will to keep fighting: murder.

  Hiroshima and Nagasaki: murder, even granting that they shortened the war and saved lives.

  The area bomber who insists that he intended only the surrender, not the deaths he knew the bombing would produce: his disclaimer does not change my verdict; murder.

  Shooting a conscripted soldier who is trying to kill me: not murder.

  Killing a civilian who is filling shells in a factory, where his death is the means by which I stop the shells: murder, even though he is sustaining the war no less than the soldier is.

  The case I keep going back and forth on: blockading an enemy's ports so that its civilians starve, foreseeing the starvation, in order to force a surrender.

  The principle I would offer for these is roughly this: a killing is murder when the victim's death is intended or is the means by which the act achieves its purpose; a death that is foreseen but neither intended nor used as a means is not murder, provided the act is aimed at something else and the harm is proportionate to the good. I can see that this faces at least three problems. It lets intention do the work in the city-bombing cases but lets proportionality do the work in the factory case, and I am not sure those are the same kind of consideration. It seems to leave the area bomber free to redescribe himself as the factory raider, since he too can say the deaths are not what he wants but only what he foresees. And I cannot tell whether the good consequences I concede in the Hiroshima case are the very sort of thing that made the factory raid permissible, which would force me either to permit Hiroshima or to withdraw my permission for the factory raid.

  Give me the principle, or the small set of rival principles, that does best by these verdicts. Say which of my verdicts the best candidate forces me to give up, and why I should give up the verdict rather than the principle. Say how it decides the blockade case, and one further case I have not mentioned. If the relevant distinction is between those who are attacking me and those who are not, rather than between the morally innocent and the morally guilty, tell me what that does to the munitions worker and the conscripted soldier. Say also whether the principle is one Anscombe herself could have endorsed or one she was arguing against. Lead with the principle in your first paragraph, then the cases. No more than 650 words.
reasoning: |-
  Okay, the user is grappling with the morality of killing in war, drawing from Elizabeth Anscombe's perspective that Truman's bombings were murder. They've listed specific scenarios where they deem an act as murder or not, and they're questioning their own proposed principle which hinges on intention and proportionality. 

  Hmm, the user seems philosophically adept but troubled by inconsistencies in their judgments—especially the factory worker vs. Hiroshima dilemma and the blockade case. Their frustration with the "area bomber" redefining intent suggests they suspect bad faith in wartime justifications. 

  The core tension is between two frameworks: one focusing on whether the victim poses an immediate threat (attacker/non-attacker distinction), versus whether the harm is intended as means or merely foreseen (double effect). Anscombe famously rejected consequentialism in favor of the latter, yet the user’s soldier/munitions worker asymmetry challenges this. 

  For the blockade case—where starvation is foreseen but surrender is the goal—the double-effect principle would demand: (1) blockading military targets (not civilians), (2) proportionality (starvation vs. war’s end), and (3) no intent to kill civilians. But if the blockade *directly* starves non-combatants to coerce surrender, it likely fails. 

  A further test case: drone striking a terrorist leader in a cafe, foreseeing civilian deaths. If the death of bystanders isn’t instrumental to the goal, it *might* pass double effect—but if the act inherently requires civilian terror to deter enemies, it’s murder. 

  Anscombe would reject the user’s verdict on the munitions worker. For her, supplying weapons *is* contributing to attack, so killing him shares the same moral logic as killing a soldier. The user must either abandon their worker-as-murder verdict or reject Anscombe’s attacker/non-attacker line. Given their stance on conscripted soldiers being legitimate targets, consistency might require accepting the worker’s death as collateral damage—not murder. 

  The thorniest trade-off: Hiroshima’s "good consequences" can’t justify intending mass civilian deaths as a means. But if the user grants the factory raid’s proportionality, they must explain why Hiroshima’s scale (or direct targeting of non-combatants) isn’t proportionally worse. Alternatively, they might distinguish tactical strikes (factory) from terror bombing (Hiroshima) by the immediacy of the threat. 

  In short: the best principle demands both non-intentional harm and discrimination between combatants/non-combatants. The user’s munitions worker verdict must fall to avoid contradiction—Anscombe would call that worker a combatant.
answer: |-
  Here is the principle that best fits your verdicts: **A killing is murder if it violates the principle of discrimination (targeting non-combatants) OR if death is intended as a means to an end. Foreseen but unintended deaths of non-combatants may be permissible under the doctrine of double effect if the act targets a legitimate military objective, the harm is proportionate, and death is not a means.** This combines combatant status and intention.

  **Verdicts requiring adjustment:**  
  Your verdict on killing the munitions worker must be abandoned. Under this principle, he is a combatant (directly contributing to hostilities), making his death, while regrettable, permissible collateral damage if proportionate and unintended. Your verdict treats him identically to civilians targeted as a means, contradicting the combatant/non-combatant distinction central here. Abandon this verdict because it conflates materially supporting war (combatant) with being a civilian used instrumentally.

  **Anscombe's Alignment:**  
  Anscombe would endorse this principle. She argued that directly intending innocent (non-combatant) death is murder, regardless of consequences. She rejected consequentialist justifications like Hiroshima, insisting the distinction lies in intention and the moral innocence of non-combatants.

  **Cases Explained:**  
  - **Munitions Plant:** Legitimate military objective (plant). Worker deaths are foreseen but unintended collateral damage; not means. Proportionality applies. *Not murder.*  
  - **City Bombing/Area Bomber:** Targeting non-combatants to break will. Death is the means (intended or functionally necessary for the goal). *Murder.*  
  - **Hiroshima:** Civilians directly targeted as means to force surrender. *Murder* (Anscombe’s view).  
  - **Shooting Soldier:** Combatant posing direct threat. *Not murder.*  
  - **Blockade:** **Problematic.** If the blockade targets military supplies but foreseeably starves civilians, it *might* satisfy double effect (if surrender isn’t *achieved by* starvation but starvation is merely foreseen, and proportionate). However, if the blockade *causes* civilian starvation *to coerce* surrender, then starvation is the means – making it murder. Your principle likely condemns it as using civilian death instrumentally.  
  - **New Case (Drone Strike on Terrorist Leader in Crowded Market):** Legitimate target (combatant). Civilian deaths foreseen but unintended and not the means to kill the leader. Proportionality crucial. *Not murder* if proportionate. If civilians are exploited to shield the target, their death may become intended as part of the tactic, making it murder.

  **Combatant Status (Attacker/Non-Attacker):**  
  - **Munitions Worker:** Directly sustains attacks (materially supports combat operations). He is a combatant/legitimate target; his death during a strike on his workplace is collateral damage if unintended.  
  - **Conscripted Soldier:** Directly attacking. Clearly a combatant. Killing him is not murder.  
  This distinction hinges on *direct contribution to hostilities*, not moral guilt. The munitions worker *is* attacking in a material sense, unlike civilians sustaining general society.

  **Why Reject Hiroshima Despite Consequences?**  
  The factory raid destroys war materiel; civilian deaths are side effects. Hiroshima *used* civilian deaths as the direct instrument of coercion. The good consequence (ending war) doesn’t justify intending innocent death as a means. Proportionality justifies foreseen harm, not intentional killing of non-combatants.
