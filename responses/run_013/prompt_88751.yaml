prompt: |-
  ok so my flatmate and I have been going at this for weeks and I want an actual number out of you, not a survey of the literature.

  The claim I want your credence on: if I, a comfortably-off person in a rich country, buy and eat a beef burger tonight, I have done something wrong — wrong in virtue of that act itself, not merely because I'm one of millions doing it. Call that B. I'm sitting at about 0.55, my flatmate's at about 0.9, and I'd like your number. But what I really want is the decomposition, because I suspect the two of us are disagreeing about something other than what we think we're disagreeing about.

  Here's how I'd carve it up, though add or split terms if you think I've got the joints wrong. (1) The probability that an individual act whose causal contribution to any identifiable harm is either zero or unmeasurable can still be impermissible in itself. (2) The probability that my purchase actually lands on the wrong side of a threshold — my flatmate's point is that a shop's reorder is a step function of demand, so whether my burger flips a step is a factual question with a probability attached, and I have no idea what that probability is. (3) The probability that, even when a step does flip, there's a real harm there, given that the animal that gets raised wouldn't have existed otherwise and (arguably) isn't made worse off by being raised. (4) The probability that the correct description of what I did is participating in a wrongful practice rather than causing a harm, and that this is enough on its own for wrongness. (5) The probability that whatever makes the act wrong is weighty enough to survive the fact that the practice-level harm depends on millions of others and my own contribution is microscopic. Also give me a seperate term for how much you think my uncertainty about the empirical step-function stuff should matter versus the moral-theory stuff, since I suspect we're both way more confident about the philosophy than the facts.

  Then the number, and tell me which term you're least sure about and what would move it most. If there's a term I've left out that does more work than any of the five, say so and give me the revised decomposition with the number recomputed. Last thing: does your answer change if the act is a short-haul flight rather than a burger? My flatmate says the burger case is special because the threshold story is clean there and the flight case is a mess, and I want know whether that's a real distinction or just a rhetorical convenience.
