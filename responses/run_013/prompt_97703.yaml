  ## The Lingering Paint: Why Lewis Needs Help with Zombie Conventions

  Your haunting vignette captures a profound social puzzle: a convention persisting as a hollow shell, enforced by quiet resentment long after its original purpose has evaporated. David Lewis’s elegant theory of convention – as a self-sustaining solution to a coordination problem, resting on mutual expectations and conditional preferences – brilliantly illuminates the *birth* of your town's fence-painting ritual. It solved a tangible problem (wood preservation) in a remote setting. However, its stubborn, normatively charged afterlife exposes limitations in the Lewisian framework. While elements of his analysis remain relevant, explaining the *persistence* and the *felt obligation* requires supplementing Lewis with an account of internalized norms and the intrinsic aversiveness of social conspicuousness.

  **Lewis Applied (and Found Wanting):**

  Lewis defined a convention as:
  1.  A regularity in behavior.
  2.  Sustained because everyone prefers to conform *conditional* on others conforming.
  3.  Arising from a recurring coordination problem (multiple equilibria possible).
  4.  Where conformity is a coordination equilibrium (no one benefits from unilateral deviation).
  5.  Arbitrary (another solution could work).
  6.  With common knowledge of all the above.

  This fits the ritual's origin perfectly. The coordination problem was clear: protect vulnerable wood efficiently. Painting together on a fixed day ensured coverage and avoided duplication or gaps. Everyone preferred to paint *if* others did, as it solved the shared problem effectively. The specific day and method were arbitrary solutions.

  Yet, Lewis struggles with the present state:
  *   **The Vanished Problem:** The core coordination problem *is* gone. Treated wood and paved roads eliminate the material need for painting. Conformity no longer yields the original coordination benefit (wood preservation).
  *   **The Shifted Preference:** Crucially, you state that nearly everyone *privately wants the practice to end* and believes others feel the same. This is **not** the case where individuals privately *want* the convention to continue. The conditional preference structure has inverted. People don't prefer to paint *if* others paint; they prefer *not* to paint *if* others also stop. Lewis's conditional preference (conform if others conform) is present but now serves a *different*, negative function: preventing the individual cost of being the lone defector.
  *   **The Normative Sting:** Lewisian conformity is driven by the *benefits* of coordination, not the *aversion* to being disliked. The "quiet dislike" directed at non-participants is a form of sanction, however mild. Lewis's framework can potentially incorporate sanctions as part of a *new* coordination equilibrium (see below), but explaining the *origin* and *nature* of this resentment purely within the original coordination logic is difficult. Why the dislike? What "harm" does deviance cause if the original problem is solved? The resentment seems disproportionate to any tangible cost incurred by others' non-painting.

  **Addressing the Sticking Points:**

  1.  **Resentment Without (Organized) Sanction:** You rightly isolate this. The dislike isn't formal punishment; it's a spontaneous social response. Lewis struggles here. This resentment likely stems from a violation of an *internalized norm*. The practice has transcended mere coordination; it's become a symbol of community solidarity, respect for tradition, or perhaps even a ritual honoring the dead. Deviance isn't just inefficient; it's perceived as disrespectful, selfish, or a rejection of shared identity. This expressive function generates resentment independently of any material consequence. The "harm" prevented is social disharmony or the erosion of a valued (though functionally obsolete) tradition.
  2.  **Collective Desire to End vs. Private Reluctance:** This distinction is vital. Lewis handles the *private reluctance* well: the assurance problem ("I'll stop if you stop, but I won't stop first") fits the conditional preference structure. Where Lewis falls short is explaining why this equilibrium persists despite the *overwhelming collective preference for change*. His framework describes stable states but doesn't inherently prioritize efficient equilibria over inefficient ones. The "lock-in" arises from the lack of a focal point for coordinated defection and the fear of unilateral conspicuousness (addressed below).
  3.  **The Displaced Coordination Problem:** This is a sophisticated Lewisian defense. The argument goes: The *original* problem is gone, but a *new* coordination problem emerges: "Who, if anyone, can stop painting without incurring social cost?" The stable equilibrium might be "Everyone paints" or "Everyone stops," but moving from one to the other requires coordination. The dislike of deviants could be part of a *new convention* stabilizing the inefficient "Everyone paints" equilibrium. People might prefer to sanction deviants *if* others also sanction, to prevent a chaotic collapse of the social fabric or to avoid the ambiguity of partial participation.

  **Does the Displacement Save Lewis?**

  It relocates the mystery but doesn't fully resolve it. While it formally preserves the Lewisian structure (a new problem, new conditional preferences), it leaves critical questions unanswered:

  *   **Why this particular new equilibrium?** Why does "Everyone paints + Sanction Deviants" remain stable while "Everyone stops" (the collectively preferred state) is unstable? Lewis allows inefficient equilibria, but doesn't explain *why* this one persists so stubbornly.
  *   **The Source of Sanctions:** Explaining the sanctioning behavior (dislike) purely as a solution to a new coordination problem feels circular and thin. *Why* is there a preference to sanction? What problem does sanctioning solve that mutual tolerance wouldn't? The expressive function of resentment (upholding a norm perceived as valuable in itself) seems a more fundamental driver than solving a second-order coordination puzzle. The aversion to being disliked isn't just fear of coordination failure; it's a primal social instinct.
  *   **The Nature of the "Ought":** The displacement might explain *behavioral* conformity but doesn't fully capture the *normative* dimension – the *felt obligation* to paint, the sense that skipping is *wrong*, not just risky or inconvenient. This internalized "ought" motivates both conformity and the resentment of non-conformists, and it seems rooted in socialization and identity, not just conditional preferences over outcomes.

  **Supplementing Lewis: Norms and Conspicuousness**

  To fully explain your town's predicament, we need to augment Lewis:
  1.  **Internalized Norms:** Over time, the regular practice becomes embedded as a social norm – a shared standard of behavior perceived as obligatory and intrinsically valuable. Norms generate internal motivations (guilt, shame) and external sanctions (disapproval) for deviation, independent of the original functional justification. The painting is now "what we do" because it's "who we are"; skipping feels like a betrayal. The resentment stems from the perceived violation of this internalized norm.
  2.  **Aversion to Conspicuousness:** Humans have a deep-seated aversion to standing out negatively. Being the lone non-painter makes one conspicuous, attracting attention and potential disapproval. This aversion operates powerfully even without formal sanctions or tangible harm. The fear of being "the one who stopped" is often sufficient to enforce conformity in situations like this, fueled by the internalized norm.
  3.  **Expressive Function:** The practice likely now serves an expressive function – symbolizing community cohesion, continuity, respect for tradition, or shared history. This symbolic value gives the norm its resilience and makes deviation feel like an attack on these values, explaining the resentment.

  **Verdict: Lewisian framework incomplete; requires supplementation by internalized norms and aversion to conspicuousness.**

  The persistence of the fence-painting ritual and its associated normative sting after the dissolution of its original purpose cannot be fully explained within a strict Lewisian framework. While the displaced coordination problem and the conditional preference structure explain the *assurance trap* preventing change, they fail to adequately account for the *source and nature of the resentment* directed at deviants and the powerful *internalized sense of obligation* to conform. This requires recognizing that the practice has evolved from a pure coordination solution into an internalized social norm, valued expressively and enforced by the intrinsic human aversion to negative conspicuousness and the spontaneous disapproval generated by norm violations. Lewis explains the skeleton; norms and social psychology provide the flesh and blood of this lingering, burdensome tradition.
