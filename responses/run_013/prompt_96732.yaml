prompt: |-
  For a unit I teach in an undergraduate political philosophy course, provisionally titled "What Is My Vote For?", I am putting together a one-page handout that sorts the positions one can hold about the ethics of voting, and I would like you to build the sorting instrument rather than summarise any literature on the subject. Please give me a taxonomy in the form of a tree: every branch node is labelled with the question that separates that branch from its siblings, and every leaf is a position, carrying a name (or the word unnamed where nobody defends it) plus one sentence identifying its most awkward commitment. Build the tree from the logical space first — the questions and the combinations of answers they permit — and only then locate the actual positions within it, noting the unoccupied combinations and briefly diagnosing each as incoherent, unattractive, or merely unexplored. Where the tree cannot separate two leaves, flag the pair and say why. The unit follows a seminar in which two students nearly came to blows over whether staying home on election day is a betrayal of everyone who fought for the franchise, so the handout has to be usable by people who arrive with convictions rather than with vocabularies.

  Every branch node must be a question my students can answer without already knowing which position it leads to, so no node may take the form "do you accept the fair-play account of political obligation?"; each should instead be a concrete case or a claim about a case. Use at least these cases: a voter who knows her single ballot cannot change the outcome in her safely held district; a two-candidate contest in which one is merely less bad, alongside a third candidate who matches her views exactly but cannot win; a spoiled or blank ballot cast deliberately as protest; a voter tempted to stay home because voting would cost her an unpaid shift; a voter whose preferred candidate will win overwhelmingly with or without her; and a voter in a gerrymandered district whose preferred party cannot take the seat. I need the following distinctions to do real work in the tree, because they are what the handout's second page will discuss: whether the vote is treated as a lever, whose point is the difference it makes to the outcome; as a token, whose point is what it expresses or the stance it takes; or as a constitutive act, whose point is that it helps compose a collective decision-maker to which the voter will afterwards owe something. Also, whether any duty to vote is owed to other citizens, to the voter's own integrity, or to no one; and whether sincerity is a constraint on how one may vote or a sentimentality to be traded away.

  Please make sure the following appear as leaves: a fair-play or reciprocity duty to vote; a no-duty view on which voting is morally optional; a sincerity-constrained expressive view; a lesser-evil instrumentalism; a complicity view on which voting for the lesser evil implicates one in what the winner goes on to do; a view on which one's vote is evidence rather than a cause, so that its point is what it tells others like oneself; and a civic-republican view on which voting matters as participation in self-rule irrespective of its effects. If you judge that one of those seven collapses into another, say so at the leaf rather than padding the tree with a distinction that does no work.

  Begin the response with the tree itself — the top-level split first, then each branch indented beneath the question that produces it — with no preface, no restatement of this request, and no account of what you are about to do. Put the diagnoses of unoccupied branches and the list of unseparable pairs in short notes after the tree. Keep the whole thing to ten leaves at most.
reasoning: |-
  Okay, let me tackle this political philosophy taxonomy request. The user wants a decision-tree style handout for undergraduate students debating voting ethics, with very specific constraints. 

  First, I consider the core challenge: building a logical framework that starts from concrete cases rather than theoretical terms, while capturing all requested positions. The tree must begin with questions students can answer based on intuition, like "Does your vote feel pointless if it can't change the outcome?" This anchors the taxonomy in lived experience - crucial given the seminar's heated debates.

  I map the three key conceptual distinctions first:
  - Lever (instrumental impact)
  - Token (expressive value)
  - Constitutive act (collective participation)
  These will structure the branches. The user's mention of students nearly "coming to blows" suggests the tree must validate strong convictions while creating space for reflection.

  For cases, I integrate all required scenarios:
  - Safe districts and predetermined outcomes address futility concerns
  - Lesser-evil dilemmas and protest votes handle strategic/expressive tensions
  - Gerrymandered districts and opportunity costs test duty-based views

  Position placement requires care. Fair-play duty fits under constitutive acts with "duty to others", while expressive views branch from token voting. The complicity view emerges naturally when lesser-evil voting intersects with outcome responsibility. I notice the "evidence not cause" position might collapse into an expressive sub-type - it'll need a flag.

  Diagnosing empty branches is key. For instance, combining "no duty" with "constitutive act" seems incoherent - if voting constitutes collective agency, opting out can't be neutral. The gerrymandered district case will test whether expressive views hold when representation is broken.

  Throughout, I weigh pedagogical clarity against philosophical precision. Ten-leaf limit means sacrificing some nuance (like separating different expressive theories) to keep it seminar-ready. The "awkward commitments" summaries must crystallize each position's toughest implication - for example, fair-play defenders must explain why non-voters aren't free-riders.
answer: |-
  **Question 1: Does your vote feel pointless if it cannot change the outcome (e.g., in a safely held district or when your preferred candidate wins overwhelmingly)?**
      *   **Yes, it feels pointless without outcome impact.**
          *   **Question 2: Does voting for the "lesser evil" in a close race feel like endorsing something bad?**
              *   **Yes, it feels like endorsing badness.**
                  *   Leaf: **Complicity View.** *Most awkward commitment: You must abstain even if your abstention helps the greater evil win, because voting implicates you in the winner's actions.*
              *   **No, it feels like preventing worse harm.**
                  *   Leaf: **Lesser-Evil Instrumentalism.** *Most awkward commitment: You must vote for candidates you find morally objectionable if they are slightly better than the only viable alternative.*
      *   **No, it still feels meaningful or required.**
          *   **Question 3: When you vote, is the primary point what your ballot *says* (expressing support, protest, identity) rather than what it *does*?**
              *   **Yes, the point is what it expresses.**
                  *   **Question 4: Would you ever vote for a candidate you dislike just to stop someone worse?**
                      *   **Yes, expression can be traded off strategically.**
                          *   Leaf: **Unnamed (Strategic Expression).** *Most awkward commitment: You might vote for a candidate you actively despise to signal opposition to their opponent, diluting the expressive act.*
                      *   **No, your vote must sincerely reflect your true view.**
                          *   Leaf: **Sincerity-Constrained Expressive View.** *Most awkward commitment: You must "waste" your vote on a no-hope candidate who perfectly matches your views, even if it helps elect the candidate you dislike most.*
              *   **No, the point isn't expression.**
                  *   **Question 5: Does staying home on election day feel like letting down your fellow citizens?**
                      *   **Yes, it feels like letting them down.**
                          *   Leaf: **Fair-Play / Reciprocity Duty.** *Most awkward commitment: You have a duty to vote even if you are deeply uninformed or find all candidates repellent, because others are doing their part.*
                      *   **No, it feels like a personal choice.**
                          *   **Question 6: Does voting feel important because it's how "we the people" rule ourselves, regardless of effect?**
                              *   **Yes, it's about participating in self-rule.**
                                  *   Leaf: **Civic-Republican View.** *Most awkward commitment: Voting remains crucial even in a gerrymandered district where your preferred party can't win, as it affirms your status as a ruler.*
                              *   **No, it's optional or about personal integrity.**
                                  *   Leaf: **No-Duty View.** *Most awkward commitment: It's permissible to skip voting to avoid losing an unpaid shift, even if others sacrificed for the franchise.*

  **Notes on Unoccupied Branches:**
  1.  **"Yes, pointless" -> "No, doesn't feel like endorsing badness" + "No, it still feels meaningful" branch:** Logically incoherent. If the *only* value is impact (Answer 1 = Yes), but you deny impact matters for duty/meaning (Answer 2=No leads to branch where meaning exists without impact), the positions conflict.
  2.  **"No, not pointless" -> "Yes, primary point is expression" -> "Yes, expression can be traded off strategically" + "No, the point isn't expression" branch:** Unattractive/Unstable. If expression is primary (Answer 3=Yes), but you then say the point *isn't* expression (Answer 5 branch contradicts the premise of Answer 3). Positions here would likely collapse into the strategic expression leaf or the instrumental branch.
  3.  **"No, not pointless" -> "No, primary point isn't expression" -> "No, doesn't feel like letting down citizens" -> "No, not about self-rule/personal integrity" branch:** Incoherent. This branch denies voting has meaning via impact, expression, duty to others, *or* constitutive self-rule/integrity. No coherent positive reason to vote remains.

  **Unseparable Pairs:**
  1.  **"Evidence View" collapses into "Sincerity-Constrained Expressive View".** The view that a vote's point is signaling to like-minded others ("evidence") is a specific type of expressive act focused on communication within a group. Its "awkward commitment" (e.g., signaling matters even if it changes nothing and isn't inherently satisfying) is subsumed by the broader expressive leaf's commitment to sincere expression regardless of outcome.
