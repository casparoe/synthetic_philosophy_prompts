answer: |-
  The polished oak door of the Hall of Revelation felt colder than the night air outside. Lykos traced the grain with a fingertip, the city’s seal – a stylized amphora balanced on scales – stark under the flickering sconce light. Inside lay the final test. Not oratory, not strategy, but wine. Plato’s crucible. To serve on the Council of Forty, you had to bare your soul under its influence before the city’s sober eyes.

  He stepped into an antechamber smelling faintly of beeswax and vinegar. A grey-haired Archon, his robe devoid of ornamentation, gestured to a stone bench. "Lykos, son of Theron? Sit. Understand the purpose."

  "I understand the requirement, Archon," Lykos replied, keeping his voice steady. He’d studied the *Laws*. He knew the theory: wine, carefully administered, loosens the tongue and the mask, revealing the true metal beneath. The state needed to see its leaders unmasked before entrusting them with power. The Archon – the designated ‘sober overseer’ – would observe, assess, and ultimately judge the character displayed *through* the intoxication, not despite it.

  "The measure," the Archon continued, his voice dry as parchment, "is not temperance alone. We seek the harmony – or discord – revealed. Does the soul, freed from convention's leash, show nobility or baseness? Generosity or spite? Courage or fear? Remember: the wine does not create. It excavates." His eyes held a disconcerting neutrality. "Proceed when ready."

  The main hall was surprisingly austere. A long, low table dominated the center, lit by hanging oil lamps. Three other candidates already sat, faces tense. Lykos recognized them: stout Pelagon, known for his fair judgments in the lower courts; sharp-eyed Elara, a merchant with a reputation for shrewd deals; and young Theron, earnest but untested. Opposite them, on a raised dais, sat three Observers, including the Archon. Their expressions were unreadable masks.

  A silent attendant placed a clay cup before Lykos. The wine was dark, pungent, unwatered. The first cup. The ritual demanded progression: one cup to ease, two to loosen, three to reveal, four… well, four was the precipice. Few reached it sober.

  Lykos drank. The bitterness hit first, then a spreading warmth. He focused on his breathing, on the smoothness of the cup. *Control. It’s all about control. Show them discipline.* He made polite conversation with Elara about harbour tariffs, his voice deliberate, his arguments clear. Pelagon chuckled nervously at a dry joke. Theron gulped his wine too fast.

  The second cup arrived. The warmth deepened, coiling in his limbs. His thoughts felt slightly slippery. Elara’s voice seemed louder. Pelagon’s face was flushed. Theron was leaning forward, arguing passionately, clumsily, about grain subsidies. Lykos felt a flicker of impatience. *The boy’s posturing.* He kept his own contribution measured, though a spark of genuine annoyance ignited when Theron misrepresented a trade agreement. He corrected him, perhaps a touch too sharply. He saw the Archon note something on a wax tablet.

  The third cup. The hall swam gently. Sounds blurred at the edges. Elara laughed, a high, brittle sound. Pelagon was recounting a long, rambling story about a disputed inheritance, his voice thick. Theron swayed slightly. Lykos felt… looser. The constant vigilance he wore like a second skin began to fray. The mask felt heavy. He found himself genuinely laughing at a crude jest from Pelagon – something he’d normally find distasteful. A wave of warmth washed over him, a feeling of camaraderie he’d rarely experienced sober. He clapped Pelagon on the shoulder. "Good man! Sharp wit!" He saw an Observer lean in, whispering to the Archon. Was this good? The ‘true’ sociable Lykos? Or just the wine talking?

  Then came the fourth cup. The world tilted subtly. The lamplight seemed to halo figures. Theron stumbled back from the table, knocking over his cup. He mumbled an apology, his face pale. Pelagon snorted. "Clumsy whelp. Shouldn't be here." Theron flushed crimson, humiliation warping his features.

  Lykos felt it rise suddenly, unexpectedly: a hot, contemptuous surge. It bypassed thought, erupting from some hidden reservoir. "Clumsy?" Lykos’s voice cut through the murmur, louder, harsher than he intended. "That’s not clumsiness, Pelagon. Look at him. Weak. Flawed. Like that leg he drags around." He gestured dismissively at Theron’s congenital limp, a detail Lykos had always politely ignored. "City doesn't need weakness at the helm. Needs strength." The words tasted sour and exhilarating. A raw, ugly truth he’d never consciously acknowledged, yet here it was, spat out with the bitterness of the wine.

  Theron recoiled as if struck. Pelagon stared, momentarily sobered by the venom. Elara gasped. The Observers were utterly still, tablets forgotten.

  Shame, cold and immediate, flooded Lykos, battling the wine’s heat. *What did I say?* But the feeling wasn't simple regret. It was terror. Had *that* been lurking inside him? The man who prided himself on fairness, on measured judgment? Was *that* the bedrock the wine had struck?

  Before the silence could solidify, a commotion erupted near Elara. The attendant, refilling her cup, fumbled the jug. Wine splashed onto her fine chiton. She shrieked, jumping back, her face contorted with disproportionate fury. "You idiot! Worthless oaf! This silk cost more than your miserable life!" She raised a hand as if to strike the cowering attendant.

  Driven by instinct, propelled by the confusing cocktail of shame, adrenaline, and wine, Lykos surged forward. He caught Elara’s wrist. "Enough!" His voice was a ragged bark. "It’s wine, Elara! And he’s a man!" He pulled her back, stepping protectively between her and the attendant. His heart hammered against his ribs. His vision swam. "No one touches him." He met Elara’s furious gaze, feeling utterly exposed, yet fiercely certain in that chaotic moment. Was *this* him too? The defender? Or just the drunken knight?

  He heard low murmurs from the dais. The Archon’s eyes, sharp and assessing, never left him.

  The attendants gently but firmly ushered the candidates out shortly after. The descent from the wine’s peak was a nauseous blur. Lykos stumbled into the cool night, the shame a crushing weight. The vicious insult to Theron replayed endlessly. The defense of the attendant felt like a hollow, reflexive act, overshadowed by his earlier cruelty.

  Days later, the summons came. He stood again before the Archon in the austere antechamber. The Archon held his tablet.

  "Lykos, son of Theron," the Archon began, his voice devoid of inflection. "The Observers have conferred. The wine revealed… complexity."

  Lykos braced himself.

  "You demonstrated moments of genuine, unforced camaraderie. You showed decisive action, protecting a subordinate from unjust aggression. A spark of protective nobility emerged."

  A flicker of desperate hope.

  "However," the Archon continued, his gaze unwavering, "the cruelty directed at Theron was… profound. It was not mere drunken bluster. It carried the weight of conviction, a deep-seated contempt laid bare. It revealed an ugliness that sobriety masks."

  "Archon," Lykos choked out, "that wasn't… that wasn't *me*. The wine… it twists…"

  "Does it?" The Archon interrupted softly. "Or does it remove the governor? Plato asks: does the wine reveal the lion, or merely unleash the beast that was always caged? We saw both potential paths within you, Lykos. The protector and the tyrant."

  "So… the Council?" Lykos whispered.

  "The decision is not unanimous," the Archon admitted. "Some argue the cruelty is a flaw too deep, a rot revealed. Others argue the protective instinct, emerging *through* the same intoxication, shows a core that can be educated, that the state can refine. That the Hall did its job – showing us the raw material."

  He closed the tablet. "The Council of Forty will vote. Your fate rests on which version of yourself they believe the wine uncovered: the essential Lykos, or merely a drunken phantom. And on whether they believe the state *should* use such a chemical scalpel to dissect a soul for its own purposes. The question, Lykos, remains… uncomfortably open." The Archon paused. "For you. And for us all."

  Lykos left the Hall, the city seal heavy on the door behind him. The cool air offered no clarity. He walked the familiar streets, the faces of Theron, the attendant, Elara flashing in his mind. Which reaction was the counterfeit? Which was the real man beneath the carefully constructed facade? Had the wine excavated a hidden truth, or merely introduced a destructive stranger? And did the state, by orchestrating this chemical unveiling, cross a line no government should cross, no matter how noble its aim? The bitter taste of the fourth cup lingered, not on his tongue, but in his soul, a question mark etched in acid, refusing to dissolve.
