lems do not fall to a clever student in five minutes. Before you commit, consider two or three candidate activities and quietly discard the weaker ones; I want the one you would actually run. Write the whole thing in continuous prose -- no headings, no bullet points, no bold text, no tables -- the way you would explain it in a long email to a colleague.
