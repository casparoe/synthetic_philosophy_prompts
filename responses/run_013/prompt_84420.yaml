answer: |-
  ## Joint Statement on Legal Moralism: Points of Convergence and Cruxes of Contention

  **Authors:** (Hypothetical Representatives of Sophisticated Legal Moralism and Anti-Moralism)

  **Preface:** This statement results from a sustained adversarial collaboration. We represent core commitments: one affirming that a society’s shared morality is a legitimate basis for criminalization even absent direct harm to others (Legal Moralist - LM), the other denying this, holding that only harm to others (and perhaps narrowly defined offense) provides legitimate grounds (Anti-Moralist - AM). Our goal is to clarify genuine agreements, state disagreements authentically, identify cruxes where resolution might shift positions, and test a novel proposal. We ground this in a concrete case.

  **Section 1: Agreed Claims**

  We jointly affirm the following substantive propositions:

  1.  **The Core Function of Criminal Law:** The criminal law is primarily a coercive tool for preventing serious wrongs and maintaining minimally necessary conditions for social order and individual security. It is not the primary vehicle for promoting virtue or comprehensive moral perfection.
  2.  **The Harm Principle's Scope:** Preventing harm to others is a necessary and central justification for criminalization. Neither side disputes its fundamental importance.
  3.  **Liberty's Default Position:** There exists a strong presumption in favor of individual liberty. The burden of justification rests squarely on those advocating for criminalization; mere moral disapproval is insufficient justification for either side. Toleration, not prohibition, is the default.
  4.  **The Limits of "Victimless" Crime:** Cases like consensual adult homosexuality (as in Wolfenden) or private drug use involve no identifiable, non-consenting victim suffering direct, tangible harm (e.g., physical injury, theft, fraud). The dispute centers precisely on whether the absence of such a victim renders criminalization illegitimate.
  5.  **Conceptual Clarity on "Harm":** We agree that "harm" requires a setback to an interest. We agree that interests include physical integrity, property, privacy, autonomy (in the sense of freedom from coercion and deception), and potentially psychological well-being *when grounded in a tangible, non-speculative injury*. The disagreement focuses on whether the "moral environment" or "social fabric" constitutes an interest capable of being harmed in a relevant way.
  6.  **The Reality of Social Morality:** Societies *do* possess shared moral norms that influence behavior and social cohesion. Neither side denies that widespread moral disapproval exists regarding certain acts, nor that such norms can shape social interactions.
  7.  **The Danger of Paternalism:** Criminalizing conduct *solely* to protect an individual from self-inflicted harm (pure paternalism) is highly problematic and requires exceptional justification that neither side finds readily available in the core dispute over legal moralism. (LM agrees this is generally impermissible, AM sees it as largely impermissible).

  **Section 2: Disagreements (Stated Authentically)**

  | Disagreement Point                  | Legal Moralist (LM) Position                                                                                                                                 | Anti-Moralist (AM) Position                                                                                                                                                                                                 |
  | :---------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Legitimate Grounds for Criminalization** | A society is entitled to use the criminal law to prohibit conduct judged by prevailing standards to be grossly immoral, even absent direct harm to non-consenting others, because sustaining a shared public morality is essential to the society's continued existence and stability. | The *only* legitimate grounds for criminalizing conduct are to prevent harm to non-consenting others (the Harm Principle) or, in extremely narrow circumstances, to prevent profound, unavoidable offense that cannot be reasonably avoided (Offense Principle). Morality alone is insufficient. |
  | **Nature of Society & Morality's Role** | A society is not merely an aggregate of individuals but a community bound by shared values. The common morality is constitutive of the society itself; its erosion weakens the bonds of mutual trust and obligation necessary for social life ("social disintegration"). | A society is an association of individuals pursuing diverse conceptions of the good. While shared norms exist, social cohesion depends primarily on respecting rights, maintaining order, and facilitating cooperation, not enforcing a specific moral code on private, consensual conduct. |
  | **Harm to the "Moral Environment"** | The decay of shared moral standards represents a genuine harm to the *society itself* and potentially to individuals who rely on that stable moral framework. This harm (social disintegration) may be diffuse and long-term but is no less real than physical harm. | Concerns about the "moral environment" or "social fabric" are either: (a) expressions of mere offense or disgust, masquerading as harm; (b) speculative predictions about social consequences lacking empirical validation; or (c) illegitimate attempts to impose one group's morality on others. This does not constitute a harm warranting criminalization. |
  | **Paternalism**                     | While pure paternalism is generally rejected, defending the shared moral fabric is distinct. It protects the *social* conditions necessary for individual flourishing and is not primarily about protecting the actor from themselves. | Arguments that prohibiting "immoral" acts protects individuals by preserving the social conditions for their good are often thinly veiled paternalism or collective moralism. If the act consensually causes no direct harm to others, protecting individuals from the "consequences" of their own moral choices is paternalistic. |

  **Section 3: Cruxes of the Dispute**

  Resolving the following questions could demonstrably shift at least one side’s position or significantly alter the burden of proof:

  1.  **The Empirical Crux: Does the toleration of specific conduct widely deemed immoral lead to measurable social disintegration?**
      *   **Agreed Test Case:** The decriminalization of adult, consensual homosexual conduct in Western jurisdictions following Wolfenden and similar recommendations.
      *   **LM Prediction:** Decriminalization contributed to a broader erosion of traditional family values and moral norms, weakening social cohesion and contributing to trends like rising divorce rates, declining religiosity, and increased social fragmentation (though LM acknowledges multiple causal factors). LM predicts measurable negative societal indicators correlate with declining enforcement of core moral taboos.
      *   **AM Prediction:** Decriminalization caused no measurable social disintegration. Societies remained stable, functional, and cohesive. Any perceived moral decline is either unrelated, illusory, or reflects positive progress towards greater individual liberty and tolerance. AM predicts no correlation between decriminalization and negative societal indicators.
      *   **What Would Move LM?:** Robust, multi-variate longitudinal studies showing *no* significant negative correlation between the *toleration* (not necessarily approval) of specific conduct like homosexuality and objectively measurable indicators of social health (e.g., trust levels, social capital metrics, crime rates unrelated to the tolerated act, political stability, economic participation).
      *   **What Would Move AM?:** Compelling evidence demonstrating a clear, causal link between tolerating a specific act (like adult incest) and empirically verified, significant increases in harms to others (e.g., demonstrable increases in non-consensual sexual assault, child abuse, family breakdown *caused by* the tolerated act, measurable collapse of vital social institutions).

  2.  **The Conceptual/Philosophical Crux: Can the "erosion of shared morality" or "harm to the social fabric" constitute a distinct type of harm that is non-offensive, non-paternalistic, and sufficient to justify criminalization?**
      *   **Agreed Test Case:** Conceptual analysis of "harm" applied to scenarios like widespread public corruption or pervasive breach of fiduciary duty (acts often seen as harming "society" or "trust").
      *   **LM Argument:** Yes. Just as widespread corruption destroys trust necessary for economic and political functioning, the erosion of fundamental moral norms (like those governing family integrity) destroys the intangible bonds of trust and mutual obligation underpinning society. This is a collective harm, distinct from offense to individuals, suffered by the community as a whole and by individuals relying on that stable context. It is not paternalism towards the corrupt official or the incestuous sibling; it is defense of the shared structure.
      *   **AM Argument:** No. Claims of "harm to society" or the "moral fabric" are either:
          *   *Reducible:* Ultimately explainable as aggregates of harm to individuals (e.g., corruption harms specific citizens defrauded or denied fair treatment).
          *   *Speculative:* Predictions about future individual harms, lacking certainty and immediacy required for criminalization.
          *   *Offensive:* Rooted in the disgust or profound offense felt by many citizens, which only justifies prohibition under very strict Offense Principle criteria (impossibility of avoidance, severity).
          *   *Illegitimate:* Attempts to privilege one contested conception of the good life ("family structure") over others using state coercion.
      *   **What Would Move LM?:** A compelling philosophical argument showing that "society" as a bearer of harm is incoherent, and that all purported "social fabric harms" are *necessarily* either paternalism, offense, or reducible to speculative future harms to individuals, which fail to meet the high bar for criminalization.
      *   **What Would Move AM?:** A precise, non-circular definition of "harm to the moral environment/social fabric" that: (a) distinguishes it clearly from mere offense and paternalism; (b) demonstrates it is a harm suffered by individuals in a concrete, non-speculative way (e.g., analogous to the tangible harm caused by systemic corruption); and (c) shows why this harm uniquely justifies criminalization where other non-coercive societal mechanisms (education, social pressure) fail.

  **Section 4: Testing "Practice-Dependent Moralism" (PDM)**

  **The Proposal:** The state may criminalize a morally wrong act only if (a) tolerating the act would demonstrably undermine some norm essential for coordinating an ongoing, socially vital practice upon which the society demonstrably depends, and (b) that norm cannot be effectively sustained by less coercive means.

  *   **LM Assessment (Can Sign? With Reservations):** LM can endorse PDM as a *necessary* but not *sufficient* condition. It provides a crucial mechanism linking morality to functional necessity ("socially vital practice"). However, LM argues PDM is too narrow:
      *   It misses acts whose immorality is foundational but not tied to a specific, discrete "practice" (e.g., intrinsic wrongness of cruelty).
      *   It risks requiring proof of imminent collapse rather than acknowledging the gradual, corrosive effect of tolerating serious immorality.
      *   The burden of proof for (a) and (b) is set too high, potentially paralyzing legitimate moral enforcement. LM sees PDM as a *subset* of valid moralist justification, not the whole.
      *   **Does it Collapse into AM?** No. It explicitly allows criminalization based on morality's functional role, which AM rejects. It accepts that "morally wrong" is a starting point.

  *   **AM Assessment (Can Sign? Conditionally):** AM can endorse PDM *if interpreted strictly* as a narrow exception proving the Harm Principle rule. It resonates because:
      *   It replaces vague "social fabric" claims with a focus on concrete, vital practices (e.g., contract enforcement, fair elections).
      *   It imposes a high empirical burden (demonstrable undermining) and a necessity test (less coercive means).
      *   It implicitly rejects criminalization based *purely* on intrinsic immorality disconnected from functional social harm.
      *   **Does it Collapse into AM?** Largely, yes, *in practice*. AM argues that any norm truly "essential for coordinating an ongoing, socially vital practice" will invariably be linked to preventing tangible harms to individuals' interests (e.g., enforcing contracts prevents economic harm; fair elections prevent tyrannical harm). If "undermining a norm" doesn't ultimately link to such harms, AM doubts its "vitality." The focus on *practices* and *coordination* pushes towards instrumental justifications AM accepts, avoiding purely intrinsic moral arguments.

  *   **Joint Conclusion on PDM:** Both sides can sign PDM as a *framework for inquiry*, but with divergent interpretations. It provides a potential common language but likely functions as a significant constraint on LM (requiring functional justification) and a potential (though narrow) expansion for AM beyond direct individual harm, contingent on meeting stringent tests. It does not fully bridge the gap; LM sees it as a minimal subset, AM sees it as a maximal concession grounded in harm-prevention logic. Whether it "collapses" depends on whether "undermining a vital practice" can be shown *without* invoking the types of harm AM already recognizes.

  **Section 5: Application to the Live Case: Consensual Adult Sibling Incest**

  *   **Agreed Facts:** Adults (>21), fully consensual, no coercion, no power imbalance/dependency, contraception used (no reproduction risk), private. No claim of direct harm to a third party.
  *   **LM Analysis (Using Agreed Claims & PDM):**
      1.  The act is widely considered grossly immoral based on prevailing standards (Agreed Claim 6).
      2.  The incest taboo is argued to be a norm essential for coordinating the vital practice of "family structure," preventing role confusion, protecting children's environments from sexualization, and maintaining clear generational boundaries (invoking PDM(a)).
      3.  Tolerating this conduct *could* erode this taboo, potentially leading to normalization, confusion in family dynamics, and harm to the perceived integrity of the family unit – a harm to the social fabric (Disagreement, Conceptual Crux).
      4.  Less coercive means (social disapproval, education) may be insufficient to maintain this foundational taboo against active challenge through tolerated practice (invoking PDM(b)).
      5.  Therefore, criminalization is justified as defense of a load-bearing moral norm for a vital social practice.
  *   **AM Analysis (Using Agreed Claims & PDM):**
      1.  There is no direct, tangible harm to non-consenting others (Agreed Claim 4, Core AM Position).
      2.  Claims of harm to the "family structure" or "moral environment" are speculative (Empirical Crux). Where is the evidence that tolerant laws regarding *adult, consensual, private* sibling incest lead to increases in child abuse, non-consensual acts, or measurable family breakdown? (Agreed Claim 5, Disagreement).
      3.  The argument relies on offense or moral disgust at the idea of incest, which fails the stringent Offense Principle tests (avoidability, severity) as the act is private (Disagreement, Conceptual Crux).
      4.  Applying PDM: Is the sibling incest taboo demonstrably *essential* for coordinating the *current, actual* practice of family life in this jurisdiction? Does tolerating private, consensual adult acts demonstrably undermine it? Evidence is lacking. Even if it did, strong social norms and education seem sufficient (failing PDM(a) & (b)). PDM, strictly applied, fails to justify criminalization here.
  *   **Outcome:** The disagreement persists *substantively*. While using the same framework (Agreed Claims, PDM), they reach opposite conclusions because they *disagree on the fundamental cruxes*: LM believes the harm to the social fabric is real and demonstrable in this case; AM sees it as speculative offense. LM believes PDM justifies prohibition; AM believes PDM, properly applied, does not. It is not merely verbal.

  **Conclusion: The Nature of the Dispute**

  The dispute is **not primarily verbal**. While terms like "harm," "society," and "morality" require careful definition (as attempted in Agreed Claims 5 & 6), the core disagreement is substantive and revolves around the two identified cruxes:

  1.  **Empirical:** Can the erosion of specific shared moral norms through legal toleration be shown to cause objectively measurable social harm (beyond offense)?
  2.  **Conceptual/Philosophical:** Can the purported "harm to the social fabric" caused by such erosion constitute a distinct, non-reducible, non-paternalistic, non-offensive type of harm sufficient to override the strong presumption in favor of liberty?

  Fixing vocabulary clarifies the battleground but does not resolve the conflict. Progress requires engaging the empirical crux with rigorous social science and the conceptual crux with deeper philosophical analysis of harm, social ontology, and the legitimate ends of the state. The live case of adult sibling incest starkly illustrates how these unresolved cruxes prevent agreement even when using shared analytical tools like the proposed PDM framework. This joint statement maps the terrain; resolving these cruxes is the path forward.

  --- 

  **Assessment of Your Proposal (PDM):** As predicted in the AM analysis, PDM *does* risk collapsing into the Harm Principle as understood by AM. For AM, a norm essential for a vital practice is only "essential" because its breakdown causes recognizably individual harms (economic loss, physical insecurity, political oppression). If PDM requires demonstrating the practice is vital *without* reference to such harms, it becomes philosophically unstable for AM. For LM, PDM is a useful but incomplete tool, capturing *one* strand of moralist reasoning (functional necessity) but potentially excluding intrinsic wrongness or diffuse moral corrosion they deem significant. It's a genuine middle ground only if the "vital practice" can be shown to depend on a norm whose erosion constitutes a *sui generis* social harm that *isn't* an aggregate of individual harms – a tall order that remains at the heart of the conceptual crux. Your suspicion that it leans Hart-ward is well-founded.
