prompt: |-
  Me and my mate Dave had a two hour row in the pub last night about what people actually believe, and I want to know whether there's a principle behind my gut recations, because he reckons there isn't and that I'm just being sentimental about brains.

  Here's my verdicts. Dave has never once considered whether 391 = 17 × 23. Ask him and he works it out in his head in five seconds and says yes, obviously. I say he believed it all along. Now take some theorem of arithmetic whose shortest proof is longer than the age of the universe — he's never heard of it, he'd never get there. I say he doesn't believe it, even though it follows from what he does believe. Dave says that's a fact about his skull, not about his beliefs: believe the axioms and you believe everything they spill out, full stop.

  Then: he believes P, he believes if P then Q, Q is staring him in the face, but he's never once put the two together. I want to say he believes Q, but it doesn't feel like the 391 case and I can't say why.

  Then there's the crank at work, who believes the axioms of arithmetic, believes a dodgy lemma, and believes a theorem that follows from the lemma. One of the three is false. I don't think he believes a contradiction — I think he believes three things and one of them's wrong. Dave says that's incoherent.

  Then my nan, who knows the rules of chess and can see the board perfectly well but can't spot the mate in three. I say she doesn't know there's a mate in three, though it follows from what she knows. Dave says she knows it and just doesn't know that she knows it, which sounds like a dodge to me. And when I point at a computer that spits out every consequence of a set of axioms, he says it believes all of them; I say it doesn't believe anything.

  The one I keep going back and forth on is Dave's cousin, who's read half a logic book and says, sincerely, that he believes every logical consequence of what he believes, including the ones he'll never get to. If a man tells you straight out that he believes a thing, doesn't that settle it? But I don't think he does believe it, and I can't tell whether I'm calling him a liar or saying he's wrong about his own mind.

  Dave's big move is that believing a thing is different from being committed to it, like signing a contract you've never read. Maybe. Is there one principle that gets all my verdicts, or a small set of candidates? Say which clause is doing the work in each case, what it predicts about a case I haven't thought of, and which of my verdicts I have to give up. Dave kept saying there's a name for all this, something about omniscience, but neither of us could remember it. No reading list please, I'm on my phone. British English.
reasoning: |-
  Okay, let me try to unpack this pub argument. The user and Dave are fundamentally disagreeing about what it means to "believe" something, especially when it comes to logical consequences of existing beliefs. 

  First, the 391 case seems straightforward - Dave can instantly verify it, so the user argues he must have believed it all along. But for a complex theorem with universe-length proof, the user denies Dave believes it despite it being logically entailed. Dave counters that belief in axioms automatically means belief in all consequences, regardless of human cognitive limits. 

  The modus ponens case (P and P→Q but never connected) is interesting - the user intuitively feels Dave believes Q here, but can't explain why it feels different from the 391 case. That suggests there's some threshold of cognitive accessibility at play. 

  The work crank scenario reveals a key nuance: believing three propositions where one must be false doesn't necessarily mean believing an explicit contradiction. The user wants to preserve that beliefs can be inconsistent without the person realizing it. Dave seems to think that's logically incoherent.

  The chess example with nan highlights practical vs theoretical knowledge - knowing rules doesn't mean seeing all consequences. Dave's "knows but doesn't know she knows" response feels evasive to the user. And the computer example starkly divides them on whether belief requires any mental state.

  Dave's cousin claiming to believe all logical consequences becomes the litmus test. If someone sincerely asserts they believe something, is that sufficient? The user doubts this, suggesting belief requires more than verbal commitment. Dave's contract analogy tries to bridge this - you can be committed to things you haven't processed.

  The omniscience reference Dave mentioned is likely about "logical omniscience" - the unrealistic idea that believers automatically know all consequences of their beliefs. This framework explains their clash: Dave takes the idealized logical view, while the user insists on psychological realism.

  For a unifying principle, the user might be operating with an "access requirement" - you only believe what you can actually access/reason about. But this struggles with the modus ponens case where Q is "staring him in the face." A "dispositional belief" approach could work better: you believe Q if you'd accept it upon minimal reflection. This would cover 391 (he can compute it instantly) and modus ponens (trivial connection), but exclude the universe-length proof. 

  For the crank, this principle allows inconsistent beliefs if they're not actively connected. Nan doesn't know mate in three because she lacks the disposition to see it. The computer has no dispositions at all. Dave's cousin may be overclaiming - asserting a disposition he doesn't truly have.

  The trade-off: adopting this means conceding that for simple, obvious implications like modus ponens, people do "already believe" the conclusion before connecting it. But that feels less counterintuitive than saying we believe infinitely many unknowable theorems.
answer: |-
  Right, this hits a deep nerve in philosophy of mind and logic. Dave's pushing the **logical omniscience** view (that's the name he was after), where believing axioms means automatically believing *all* their logical consequences, regardless of complexity or awareness. Your gut reactions are rejecting this as unrealistic for actual human minds. Here's the principle behind your verdicts and how it plays out:

  **Your Core Principle: Belief Requires Accessible Commitment (BRAC)**

  *   **What it is:** You believe P only if you are *disposed to treat P as true* in relevant reasoning, assertions, or actions *without needing significant new computation or evidence gathering when the question arises*. It's about a *ready-to-use* commitment.
  *   **What it rejects:** The idea that belief is *just* holding premises that logically entail P, regardless of whether you can (or ever would) see the connection. It prioritizes the *psychology* of the believer over pure logic.
  *   **Why it fits:** It captures your intuition that belief isn't just about abstract entailment ("spilling out"), but about the state of the mind *here and now* – its dispositions and capacities.

  **How BRAC Explains Your Verdicts:**

  1.  **391 = 17 × 23 (Dave says "obviously"):**
      *   **Your Verdict:** Believes it.
      *   **BRAC Explanation:** Dave possesses the arithmetic competence and can access the verification *trivially* (5 seconds in his head). The commitment to the truth of 391 being composite (given his belief in arithmetic) is readily accessible and usable. He'd rely on it in relevant calculations without a second thought.
      *   **Clause:** "without needing significant new computation"

  2.  **Complex Unprovable Theorem:**
      *   **Your Verdict:** Does *not* believe it.
      *   **BRAC Explanation:** Dave lacks the *cognitive access* to the proof. He cannot, even in principle within his lifetime, perform the computation needed to commit to its truth based on his axioms. The entailment exists logically, but it's not a disposition *he* possesses.
      *   **Clause:** "significant new computation" (here, impossibly significant).

  3.  **Believes P, Believes (P→Q), Never Put Together:**
      *   **Your Verdict:** Believes Q (but feels different from 391).
      *   **BRAC Explanation:** The connection is *trivially accessible*. If you asked "Do you believe Q?", he'd likely see the implication instantly ("Oh, right, yes!"). The commitment to Q is latent but requires negligible cognitive effort to activate. It feels different from 391 because 391 required a small computation, while this just requires *connecting* existing, immediately available beliefs – it's a recognition, not a calculation.
      *   **Clause:** "without needing significant new computation or evidence gathering" (the computation here is near-zero).

  4.  **The Work Crank (Axioms, Dodgy Lemma, False Theorem):**
      *   **Your Verdict:** Believes three things, one false – not an explicit contradiction.
      *   **BRAC Explanation:** He's committed to the truth of each individual proposition *as he understands them*. He hasn't seen the inconsistency *because he hasn't accessed the connection* that would force him to confront it. His mind holds conflicting *commitments*, but he doesn't hold the belief "*A and not-A*" because he hasn't derived that contradiction. He's inconsistent, not believing a contradiction *per se*.
      *   **Clause:** Belief requires commitment *to the specific proposition*, not to *all* its remote consequences or incompatibilities. The inconsistency is a fact *about* his beliefs, not itself a belief *he* holds.

  5.  **Your Nan & Mate in Three:**
      *   **Your Verdict:** Does *not* know/believe there's a mate in three.
      *   **BRAC Explanation:** While she knows the rules (axioms) and sees the board (evidence), she lacks the *computational access* to the specific consequence "mate in three exists here" within her cognitive limits. She cannot readily treat *that specific proposition* as true for planning or asserting. Knowing *how* to potentially find it (via the rules) isn't the same as knowing *that* it exists.
      *   **Clause:** "without needing significant new computation" (significant for *her* cognitive resources).

  6.  **The Computer Spitting Out Consequences:**
      *   **Your Verdict:** Doesn't believe anything.
      *   **BRAC Explanation:** Belief requires *mental commitment*. A computer blindly applying rules lacks intentionality – it doesn't *take* things to be true, it just manipulates symbols. It has no dispositions to act *based on* the truth of the propositions. Output isn't belief.
      *   **Clause:** Belief requires *disposed to treat P as true* – implying a *mind* with intentional states. The computer lacks this.

  7.  **Dave's Cousin (Says he believes all consequences):**
      *   **Your Verdict:** He *doesn't* truly believe the unknowable consequences.
      *   **BRAC Explanation:** His sincere *assertion* is about his *theory* of belief (the logical omniscience view), not about his actual psychological state. He cannot be *disposed to treat* a specific, complex, unreachable consequence P *as true* because he cannot access it. He's confusing *logical commitment* (if I hold A, I *should* hold B) with *actual psychological commitment* (I *do* hold B as a ready-to-use belief).
      *   **Clause:** You're saying he's *wrong about his own mind*, not lying. He misunderstands what belief *is*.

  **Dave's "Commitment like a Contract" Analogy:**

  *   Dave's onto something relevant to BRAC. Signing an unread contract *does* legally commit you to its terms. Similarly, believing axioms *logically* commits you to their consequences.
  *   **BRAC's Response:** Legal commitment ≠ Psychological belief. You are *bound by* the contract terms, but you don't *believe* each specific term until you know it/encounter it. Your mind doesn't *represent* or act upon clause 37b until it's relevant and accessed. BRAC is about the *psychological state of belief*, not just logical or normative commitment.

  **What You Have to Give Up (The Trade-Off):**

  *   **The Absolute Purity of "Belief":** You have to accept that "belief" isn't a perfectly closed logical set. People can hold beliefs that are *logically* inconsistent without *psychologically* believing the contradiction itself (like the crank). This makes "belief" messier than pure logic.
  *   **Modus Ponens Case as "Already Believed":** BRAC forces you to accept that in the P & (P→Q) case, Dave *does* already believe Q, even before connecting them, *because* the connection is so trivial. The feeling that it's different from 391 stems from 391 requiring calculation (however fast), while modus ponens just requires recognition. But BRAC treats both as "accessible without *significant* computation".

  **Prediction for a New Case:**

  *   **Case:** Sarah believes basic physics. She's never calculated how long it would take a penny dropped from the Empire State Building to hit the ground, but she could easily do it in 30 seconds with pen and paper.
  *   **BRAC Prediction:** She *does* believe it will hit the ground and accelerate, but she *does not* believe the *specific duration* (e.g., 8.8 seconds) until she calculates it or is told. The duration requires non-trivial (though manageable) computation based on her beliefs; it's not a readily accessible commitment.

  **In a Nutshell:**

  Your gut is rejecting **logical omniscience**. You're insisting belief requires **Accessible Commitment (BRAC)** – a psychological state where the truth of P is a *ready-to-use* component of the mind, not just a remote logical shadow of other beliefs. This principle explains all your verdicts by focusing on the believer's *actual cognitive access and dispositions* at the time. The cost is accepting that belief is a bit fuzzier than pure logic and that trivial inferences like modus ponens *are* already "believed" implicitly. Dave's contract analogy captures the *normative* commitment of logic, but BRAC captures the *psychological* reality of belief. You're not sentimental; you're psychologically realistic. Now go tell Dave his skull *is* relevant to his beliefs. Pint's on him.
