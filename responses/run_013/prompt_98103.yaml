prompt: |-
  Me and a mate have a running bet about whether the 'outside view' actually works for empires. His rule is: to forecast a current top power's decline, ignore the specifics, take every historical great power you can, measure how long each stayed at the top, and just read off the base rate. I think thats garbage — the reference class is gerrymandered and the hazard probably isn't stationary — but I want a number, not a vibe. What's your credence that his procedure would actually beat a careful inside-view analyst out of sample, i.e. at predicting, for a random great power, whether it's still top-tier fifty years on? Decompose it: how likely is a non-arbitrary reference class to even exist here, how stationary are the underlying hazards across centuries, how much does survivorship/selection bias corrupt the base rate, how much genuine info does the inside view add that the base rate can't, and anything else you'd include — a number and one line for each, then the combination. Then tell me how confident you are in the whole thing and which single term you're least sure of, and what would move it.
reasoning: |-
