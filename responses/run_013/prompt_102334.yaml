  ### Exercise: Iterated Elimination of Dominated Strategies

  **Game A.** Row player strategies: T, M, B; Column player strategies: L, C, R.  
  Payoffs:  
  - T: (3,0) against L, (0,3) against C, (3,0) against R  
  - M: (0,3) against L, (3,0) against C, (0,0) against R  
  - B: (1,1) against L, (1,1) against C, (1,3) against R  

  **Game B.** Row player strategies: X, Y; Column player strategies: L, C, R.  
  Payoffs:  
  - X: (1,0) against L, (1,1) against C, (1,0) against R  
  - Y: (0,0) against L, (1,1) against C, (1,1) against R  

  1. **Using Game A:**  
     a. Identify all strategies strictly dominated by a pure strategy.  
     b. Identify all strategies strictly dominated when mixed strategies are permitted, and explicitly exhibit a dominating mixed strategy for each.  
     c. Perform iterated elimination of strictly dominated strategies to its conclusion and state the surviving strategy profiles.  
     *(7 marks)*  

  2. Explain why the order of removal for strictly dominated strategies cannot affect the surviving set, but the same guarantee fails for weakly dominated strategies. Write for a student with one undergraduate course.  
     *(4 marks)*  

  3. **Using Game B:**  
     a. Exhibit two different orders of iterated elimination of weakly dominated strategies that terminate in different surviving sets.  
     b. Explain which feature of the game causes the discrepancy.  
     *(5 marks)*  

  4. Briefly: What is the relationship between a strategy being strictly dominated and it never being a best response to any belief about other players? Why does the clean equivalence in two-player games fail for three or more players?  
     *(4 marks)*  

  ---

  ### Model Answer  

  **Part 1: Game A**  
  a. **Strictly dominated by pure strategy:**  
     - *Row player:* Compare pure strategies:  
       - T vs M: Against L, T=3 > M=0; against C, T=0 < M=3; against R, T=3 > M=0. Neither dominates.  
       - T vs B: Against L, T=3 > B=1; against C, T=0 < B=1; against R, T=3 > B=1. Neither dominates.  
       - M vs B: Against L, M=0 < B=1; against C, M=3 > B=1; against R, M=0 < B=1. Neither dominates.  
     - *Column player:*  
       - L vs C: Against T, L=0 < C=3; against M, L=3 > C=0; against B, L=1 = C=1. Neither dominates.  
       - L vs R: Against T, L=0 = R=0; against M, L=3 > R=0; against B, L=1 < R=3. Neither dominates.  
       - C vs R: Against T, C=3 > R=0; against M, C=0 = R=0; against B, C=1 < R=3. Neither dominates.  
     **Conclusion:** No strategy is strictly dominated by a pure strategy.  

  b. **Strictly dominated by mixed strategy:**  
     - *Row player:*  
       - B is strictly dominated by a mixture of T and M. Let σ = pT + (1-p)M. For domination:  
         - Against L: p·3 + (1-p)·0 > 1 ⇒ 3p > 1 ⇒ p > 1/3  
         - Against C: p·0 + (1-p)·3 > 1 ⇒ 3(1-p) > 1 ⇒ p < 2/3  
         - Against R: p·3 + (1-p)·0 > 1 ⇒ 3p > 1 ⇒ p > 1/3  
         For p ∈ (1/3, 2/3), σ dominates B. Explicit mixture: p = 1/2, so σ = 0.5T + 0.5M.  
         - Against L: 0.5×3 + 0.5×0 = 1.5 > 1  
         - Against C: 0.5×0 + 0.5×3 = 1.5 > 1  
         - Against R: 0.5×3 + 0.5×0 = 1.5 > 1  
       - T and M are not dominated by any mixture (check mixtures of B and M for T, etc., yields contradictions).  
     - *Column player:*  
       - R is not dominated by L/C mixtures: Against B, R=3 > L=1 and C=1.  
       - L and C are not dominated (similar checks).  
     **Conclusion:** Only B is strictly dominated (by σ = 0.5T + 0.5M).  

  c. **Iterated elimination:**  
     - **Step 1:** Eliminate B (strictly dominated by σ). Reduced game:  
       - T: (3,0) L, (0,3) C, (3,0) R  
       - M: (0,3) L, (3,0) C, (0,0) R  
     - **Step 2:** Now, R is strictly dominated for Column by a mixture of L and C. Let τ = qL + (1-q)C. For domination:  
       - Against T: q·0 + (1-q)·3 > 0 ⇒ 3(1-q) > 0 ⇒ q < 1  
       - Against M: q·3 + (1-q)·0 > 0 ⇒ 3q > 0 ⇒ q > 0  
       For q ∈ (0,1), τ dominates R. Use q = 1/2: τ = 0.5L + 0.5C.  
       - Against T: 0.5×0 + 0.5×3 = 1.5 > 0  
       - Against M: 0.5×3 + 0.5×0 = 1.5 > 0  
       Eliminate R. Reduced game:  
       - T: (3,0) L, (0,3) C  
       - M: (0,3) L, (3,0) C  
     - **Step 3:** No further strictly dominated strategies:  
       - Row: T and M undominated (against L, T>M; against C, M>T).  
       - Column: L and C undominated (against T, C>L; against M, L>C).  
     **Surviving profiles:** {T, M} × {L, C}, i.e., (T,L), (T,C), (M,L), (M,C).  

  **Part 2: Order Independence and Weak Domination**  
  - **Strict domination order independence:** A strategy strictly dominated in the full game remains strictly dominated in any subgame containing it and its dominating strategy. This is because strict domination requires *strictly* better payoffs against *all* opponent strategies. Thus, removal of other strategies cannot "rescue" a strictly dominated strategy, and the surviving set is unique.  
  - **Weak domination order dependence:** Weak domination requires payoffs to be ≥ in all cases and > in at least one. Removal of an opponent strategy can eliminate the ">" case, causing a weakly dominated strategy to become non-dominated. For example, if the strategy that made it weakly dominated is removed, it may now be equivalent to others. Thus, the final set depends on removal order.  

  **Part 3: Game B**  
  a. **Different elimination orders:**  
     - **Order 1 (eliminate Row’s Y first):**  
       - Y is weakly dominated by X: Against L, X=1 > Y=0; against C and R, X=Y=1.  
       - Eliminate Y. Reduced game: X only vs (L,C,R).  
       - L weakly dominated by C (C=1 > L=0 for X) and R weakly dominated by C (C=1 > R=0 for X).  
       - Eliminate L and R. Surviving: (X,C).  
     - **Order 2 (eliminate Column’s L first):**  
       - L is weakly dominated by R: Against X, L=0=R=0; against Y, L=0 < R=1.  
       - Eliminate L. Reduced game:  
         - X: (1,1) C, (1,0) R  
         - Y: (1,1) C, (1,1) R  
       - R weakly dominated by C: Against X, C=1 > R=0; against Y, C=1=R=1.  
       - Eliminate R. Reduced game:  
         - X: (1,1) C  
         - Y: (1,1) C  
       - No further dominated strategies. Surviving: (X,C), (Y,C).  
     **Different surviving sets:** Order 1 → {(X,C)}; Order 2 → {(X,C), (Y,C)}.  

  b. **Feature causing discrepancy:**  
     Y is weakly dominated by X in the full game due to X’s strict advantage against L. When L is eliminated first, this strict advantage disappears (against C/R, X=Y=1), so Y is no longer weakly dominated. Thus, Y survives in Order 2 but not Order 1.  

  **Part 4: Strict Domination vs. Never Best Response**  
  - **Two-player games:** A strategy is strictly dominated if and only if it is never a best response to any belief about the opponent.  
    - *Why:* If σ dominates s, σ yields strictly higher payoff against *all* opponent strategies, so s cannot be a best response to any belief. Conversely, if s is never a best response, it must be strictly dominated (proof via separating hyperplanes).  
  - **Three or more players:** The equivalence fails if beliefs are restricted to *independent* distributions over opponents. Strict domination requires better payoffs against *every* joint strategy of opponents, but "never best response" under independent beliefs only requires better payoffs on average over *marginal* distributions. A strategy can satisfy the latter without the former if it performs well in correlated opponent profiles that independent beliefs cannot replicate.  

