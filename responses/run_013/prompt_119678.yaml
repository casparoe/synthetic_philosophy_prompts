  But now, please add: if A and B, then Z."
  Achilles wrote it, though he felt it grew
  Beyond the point, and where this led, who knew?
  The Tortoise said: "I see it, as do you."

  Stanza 4:
  The Tortoise said: "I see it, as do you.
  But to be moved, I need a little more:
  That if we have A, B, and what we just wrote too,
  Then Z must follow, as it did before."
  Achilles wrote it, though it seemed a chore,
  And knew the race-course stretched beyond the door.

  Stanza 5:
  And knew the race-course stretched beyond the door.
  The Tortoise added: "One more thing I ask:
  That if we have A, B, and rules one, two, three, four,
  And this new rule, then Z must come to task."
  Achilles wrote it, though it seemed a mask
  For endless deferral, and he felt the air grow thin.

  The last line: "thin" is unrhymed.

  We have five stanzas. The cumulative effect is achieved by the growing length and the nesting of the conditionals.

  The Tortoise is always polite and reasonable.

  The conclusion Z is never written; we only have more conditionals.

  The last stanza does not conclude; it defers.

  The reader can imagine adding another stanza with one more conditional.

  I think this meets the requirements.
