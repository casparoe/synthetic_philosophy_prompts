prompt: |-
  I am giving the launch-night speech for our town's new local currency, a scrip that member shops and residents will use alongside the national currency. The room will be mostly volunteers who believe they are building something with real value behind it, a few shopkeepers who have agreed to accept the scrip and are privately afraid of being left with worthless paper, and a retired economics teacher who will notice any overstatement. My plan was to tell the room that our scrip is backed by real need, unlike ordinary money, which is only a convention; but I have been reading Aristotle on exchange, and I no longer think I can say that. On his account money exists by agreement rather than by nature, it stands in for need so that exchange need not wait for two people who happen to want each other's goods, and the pursuit of money for its own sake is the unnatural case, as against exchange that serves real need. Write the speech so that it stays faithful to that and still moves the room. It must not promise that the scrip will gain value, it must not trade on a real-money-versus-fake-money contrast, and it must answer the shopkeepers' actual question -- what makes the scrip worth anything -- without inventing a backing behind it. Refer to Aristotle if it helps, but paraphrase him rather than quoting, and do not cite chapter and verse at a launch party. Keep it to about five minutes, take a definite line on whether a currency can rest on anything beyond agreement, and make the case inside the speech rather than hedging. Begin with the speech itself, with no preface; afterwards add one sentence naming which reading of Aristotle you committed to.
reasoning: |-
  Okay, the user is preparing a launch speech for a local currency (scrip) and wants it to align with Aristotle's views on money. They mentioned Aristotle's idea that money exists by agreement, not nature, and facilitates exchange without requiring a double coincidence of wants. The speech needs to address shopkeepers' concerns about the scrip's value without overpromising or creating a false contrast with national currency.

  Hmm, key constraints are tricky: no promising appreciation, no "real vs fake money" rhetoric, and explaining value without inventing backing. The audience mix is important - idealistic volunteers, skeptical shopkeepers, and a critical economist. Aristotle's core insight is perfect here: money is a social tool, not inherently valuable. 

  The real challenge is translating philosophy into motivational rhetoric. For shopkeepers, the answer lies in the network effect - the scrip gains value through collective participation. That's the "backing": mutual commitment. Must avoid sounding like a pyramid scheme though. For volunteers, emphasize community agency - they're building the agreement that gives it life. 

  Aristotle's warning about money becoming an end itself is useful framing - this scrip exists explicitly to serve real needs. That differentiates it from hoarding behavior he criticized. The retired economist will appreciate this nuance if presented cleanly.

  For structure: opening should grab attention with the "worthless paper" fear, then pivot to Aristotle's timeless solution - shared agreement. Middle section explains how this solves the double coincidence problem specifically for local trade. Closing ties participation to community resilience. 

  Paraphrasing Aristotle needs care - no jargon, just the clear idea that money is a bridge between needs. The one-sentence citation afterwards can specify it's from Nicomachean Ethics Book V without sounding academic during the speech.

  Biggest risk is sounding too abstract. Concrete examples - farmers, bakers exchanging via scrip - will ground it. Verbs like "circulate," "nourish," "knit together" make the mechanics vivid. That silent volunteer holding the basket? Perfect visual metaphor for the system in motion.

  Final check: Does this make the scrip feel both practical and noble? Yes - by rooting it in ancient wisdom and modern community action. The shopkeepers' fear is addressed head-on: value comes from their peers' participation. No false promises, just shared responsibility made tangible.
answer: |-
  **(Speech begins)**

  Friends, neighbors, and fellow builders – welcome! Tonight marks the start of something vital for our town: the circulation of our own local currency, our scrip. I see some faces lit with excitement, and others… perhaps with a quiet question: *What makes this paper in my hand actually worth anything?* It’s a good question. An essential one.

  We often think of money as having some inherent, magical value. We might imagine national currency is "real" because it’s backed by gold, or governments, or sheer force of habit. But an ancient thinker, Aristotle, cut through that illusion over two thousand years ago. He observed something profound: money doesn't spring from nature, carrying value in its very fibres. No. Money exists *by agreement*. It's a brilliant human invention, a token we *all* accept to solve a fundamental problem – the problem of coincidence.

  Think about it. Imagine Anna the farmer has extra eggs but needs shoes. Ben the cobbler has shoes but needs bread. Unless Anna needs shoes *at the exact moment* Ben needs eggs, they’re stuck. They need a coincidence of desires. Money – whether a dollar, a euro, or our scrip – is the solution to that problem. It’s a common measure, a shared token we accept *not* because the paper itself fulfills a deep need, but because we all agree it *stands in* for the things that *do* fulfill our needs – the eggs, the shoes, the bread, the haircut, the hour of skilled labor. It bridges the gap between different desires and different times.

  Aristotle warned us about mistaking the token for the goal. He saw that when money becomes an end in itself, pursued endlessly, divorced from the real goods and services it represents, it becomes unnatural. That’s the corruption of money. Its true purpose, its *natural* function, is to serve as a tool for fair exchange, connecting our real needs and our real work.

  So, what makes *our* scrip worth anything? The same thing that gives *any* money its fundamental value: **Our shared agreement, right here, right now.** Not a vault of gold, not a government decree, but *us*.

  The value of this scrip rests on a simple, powerful pact: **We, as a community of residents and shops, agree to accept it.** That baker displaying the "We Accept Scrip" sign? That’s his commitment. That resident choosing to spend scrip at the bookstore? That’s her commitment. Every time one of us accepts this currency for our goods or labor, we are *giving* it value. We are saying, "I trust that this token represents a share in the real, tangible wealth of our town – the skills, the products, the services we create and offer each other."

  This isn't magic. It’s mutual trust in action. It’s a circle of exchange we are deliberately creating. The scrip doesn't *have* value hidden behind it; it *gains* value *as it circulates*, passing from hand to hand, fulfilling its purpose: facilitating the exchange of what we *truly* need and value – the work of our neighbors, the goods from our local shops, the strength of our community bonds.

  Unlike national currency, designed for vast, impersonal systems, *this* scrip is designed for *here*. It’s a tool to consciously strengthen the connections between us. It encourages us to look locally first. It keeps resources circulating *within* our town, nourishing *our* businesses and *our* neighbors. Every scrip spent at a member shop isn't just a transaction; it's a reinvestment in the place we call home. It's a tangible statement: "I value *this* community."

  To our volunteers: You are building the network of trust that gives this token life. Your belief is the engine. To our shopkeepers: Your courage in accepting the scrip is *the* crucial backing. You are not holding "worthless paper" if you are part of an active network where that paper is constantly redeemed for real value – value you help create. The scrip in your till at the end of the day is a promise – a promise that someone in this community will offer you something you need in return. Its worth is directly tied to the health and activity of the system *we* sustain together.

  This scrip is not a rejection of national currency. It’s an addition. A focused tool for a specific purpose: strengthening our local economy and deepening our community ties. It’s a return to the original, noble purpose of money Aristotle described: a simple, agreed-upon token that helps neighbors exchange their real work and meet their real needs, right here, without waiting for coincidence.

  So, let’s put this agreement into action. Let’s spend it locally. Let’s accept it proudly. Let’s watch it circulate, and in its circulation, let’s see our town grow stronger, more connected, and more resilient. The value starts tonight. The value starts with us.

  Thank you.

  **(Speech ends)**

  **(Aristotelian commitment: The speech commits to Aristotle's view from *Nicomachean Ethics* (Book V) and *Politics* (Book I) that money (νόμισμα / nomisma) is fundamentally conventional (νόμος / nomos), established by agreement to facilitate reciprocal exchange (ἀλλᾰγή / allagē) and solve the problem of the "double coincidence of wants," contrasting its natural use for meeting needs with its unnatural use as an end in itself.)**
