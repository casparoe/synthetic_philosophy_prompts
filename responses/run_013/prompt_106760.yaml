  Here are two jokes that hit the requested beats – one synchronic, one diachronic – designed for an audience fluent in decision theory:

  ### Joke 1: The Synchronic Shuffle (Intransitive Preferences)
  **Setup:**  
  Barry loves debating rationality at the pub. He loudly insists his preferences are *perfectly consistent*: he’d swap his lukewarm lager (A) for Clive’s craft IPA (B) plus £1, Clive’s IPA (B) for Dave’s fancy whisky (C) plus £1, and Dave’s whisky (C) for Barry’s *own* lager (A) plus £1. "See? Totally rational valuations!" he slurs.

  **The Pump:**  
  A sharp-eyed trader slides over. "Fancy a *demonstration*, Barry? Tell you what: gimme that sad lager (A), I’ll give you Clive’s IPA (B) *and* £1. Deal?" Barry agrees.  
  Trader: "Now, gimme that IPA (B), I’ll give you Dave’s whisky (C) *and* another £1." Barry, feeling richer, agrees.  
  Trader: "Final step! Gimme that whisky (C), I’ll give you back... *this* lager (A) – look, it’s even *your* original pint! – *and* £1." Barry, slightly confused but seeing £1, agrees.

  **Punchline:**  
  Barry stares at his returned, now flat, lager and the three pound coins in his hand. The trader grins: "Congrats, mate. You just paid me £0 for the privilege of confirming you'd pay to cycle back to where you started. Best £3 arbitrage *I* never earned... though technically, *you* paid for the round."

  **Why it lands (Synchronic):**
  *   **Core Mechanism:** Clearly shows the A>B>C>A cycle exploited.
  *   **Pumper's Role:** Highlights the trader's role as the arbitrageur exploiting inconsistent valuations ("£0 for the privilege").
  *   **Arbitrage Angle:** Explicitly calls it "arbitrage" – the trader profits by "buying" Barry's regret loop at each step.
  *   **Moral:** Barry ends up with the same lager minus money, proving the self-undermining nature *by his own actions*.
  *   **Humor Source:** Barry's drunken confidence vs. the absurdity of paying to return to the start, framed as a "free" service he paid for.

  ### Joke 2: The Diachronic Dilemma (Naive vs. Sophisticated Sucker)
  **Setup:**  
  Naive Nora knows her future self has a crippling weakness for "Crunchy-O's" cereal. On Monday (sober, health-conscious Nora), she *prefers* veggies (A) over Crunchy-O's (B). But by Friday night (exhausted, weak-willed Nora), she *prefers* Crunchy-O's (B) over veggies (A). The Pumper knows this.

  **The Naive Pump:**  
  Monday: Pumper offers: "Pay me £5 now, I'll take those tempting Crunchy-O's away!" Relieved, Nora pays. Friday: Pumper returns: "Feeling peckish? Pay me £5, I'll sell you back these *exact* Crunchy-O's!" Desperate, Nora pays. Pumper profits: £10. Nora has her cereal back, minus £10.

  **The Sophisticated "Fix":**  
  Sophisticated Sarah has the *same* preference shift. She *knows* the Pumper will come. Monday: "Look," Sarah sighs, "I know your game. Here's £7 upfront. Just *go away* and leave my Crunchy-O's alone forever, okay?" Pumper takes the £7 and vanishes.

  **Punchline:**  
  Friday night arrives. Sarah stares at the unmolested Crunchy-O's box... and feels nothing but mild disgust. She *easily* resists. She mutters to herself: "Dammit. Paid £7 to avoid a £10 trap... that I wouldn't even have *fallen* into this week? Turns out my future self *was* me all along. Worst. Regret-arbitrage. Ever."

  **Why it lands (Diachronic):**
  *   **Core Mechanism:** Shows the time-based preference reversal (A>B on Mon, B>A on Fri).
  *   **Naive vs. Sophisticated:** Contrasts Nora's £10 loss with Sarah's "smarter" £7 loss.
  *   **Sophisticated Irony:** Sarah ends up worse off *financially* than if she'd been naive *this specific time* because her prediction about *this* Friday's weakness was wrong ("that I wouldn't even have *fallen* into"). She paid for protection she didn't need.
  *   **Beliefs, Not Preferences:** Sarah's failing wasn't Friday's preference, but Monday's *belief* about Friday's preference/strength.
  *   **Arbitrage Angle:** Sarah frames it as "Regret-arbitrage" – she paid the pumper to "buy" her anticipated future regret at a discount (£7 instead of the £10 loss), but the "asset" (the regret) never materialized, making it a bad trade.
  *   **Agent Unity/Identity:** The punchline "Turns out my future self *was* me all along" touches on the philosophical debate about whether sophisticated pre-commitment is truly a single agent's choice or a conflict.
  *   **The Real Horror:** Implicitly points to the "no pumper" scenario: Sarah just wasted £7 fighting a phantom battle *within herself*.

  ### Bonus: The Self-Torturer (No Pumper Needed)
  **Setup:**  
  Dave signs up for the "Happiness Dial" study. He starts at Dial Setting 0 (mild discomfort, £0). Each day, he can nudge the dial up *one* notch. Each notch gives him £10. The catch? He can't perceive the *difference* between adjacent notches... but Setting 1000 is pure agony he'd *never* accept for £10,000.

  **Punchline:**  
  Three years later, Dave's twitching in a corner at Setting 987, muttering "Just... one... more... £10..." as the researcher whispers: "Beautiful. Pure diachronic arbitrage. He's buying his own future misery £10 at a time... and selling his past comfort back to himself for free."

  **Why it lands (Self-Torturer):**
  *   **No Pumper:** The horror is entirely internal and temporal. The researcher is just an observer.
  *   **Diachronic Mechanism:** Imperceptible steps lead to a catastrophic endpoint he'd refuse outright.
  *   **Arbitrage Angle:** Framed as Dave "buying" future misery incrementally and "selling" past comfort (by abandoning it for £10).
  *   **Humor Source:** The dark absurdity of the researcher's detached admiration for the "beautiful" process while Dave suffers.

  These jokes work because they:
  1.  **Require the Knowledge:** You need to understand the pump mechanics, the naive/sophisticated distinction, and the arbitrage framing to get the full punchline.
  2.  **Use Real Content:** They hinge on the specific failures (intransitivity, incorrect beliefs about future selves, sophisticated over-payment, imperceptible increments) and the arbitrage insight.
  3.  **Highlight the Key Twists:** The sophisticated agent potentially being worse off financially, the terrifying "no pumper" scenario, and the core arbitrage metaphor are central.
  4.  **Land the Punchlines:** The humor comes from the character realizing the absurd, self-inflicted, logically inevitable trap they're in, framed through the cold lens of economic exploitation (even by themselves).

  Go forth and settle that argument! Your flatmate might still claim reductios aren't funny, but £10 says he cracks a smile at Sarah paying £7 to avoid a trap that wasn't even set this week.
