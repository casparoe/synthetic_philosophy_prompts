prompt: |-
  I'm a third-year philosophy student and I've somehow ended up chairing the Q&A when our visiting speaker comes to the society next month. She works on norms of assertion and I've read the draft she's presenting. Her line is roughly this: the norm of assertion is knowledge, sure, but it's *role-relative* — when you assert as a spokesperson for a group (a department, a company, a committee), the standard isn't what *you* know, it's what the *group* knows. So I can get up and tell the press "we've fixed it" because the team knows it, even if I personally couldn't say how I know. She reckons a lot of so-called selfless assertion is really just this, and that this is why "how do you know?" feels like the wrong challenge to put to a spokesperson.

  I have to write eight to ten questions for her and I don't want the obvious "so isn't the norm just belief, then" stuff that she's heard a hundred times. Could you draft them? I want at least one each on: how she squares "the group knows" with the summativist/non-summativist fight about group knowledge (and what happens if the group's knowledge is just the members' knowledge summed); what becomes of the "how do you know?" challenge in spokesperson mode — is "the department knows" actually a good answer, or does she just lose the main argument for the knowledge norm?; and whether role-relativity quietly turns the whole thing into a norm of entitlement or of blame rather than a norm of knowledge. For each question, please add the follow-up she's most likely to need — the reply she'll obviously give, and then the question that keeps the pressure on after it. Also one on who's actually blameworthy when a spokesperson assertion turns out false (her, or the group?), and one closing question about what evidence or argument would count against the view.

  Keep it under about 900 words and in British English please, it's going on the society's website so it needs to read properly. And if you can, stick the single question I most need to get right at the top, before the numbered list.
reasoning: |-
