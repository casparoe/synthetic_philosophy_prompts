  For the opener, I’ll prioritize the blameworthiness question—it’s practical and exposes a core tension in role-relativity. Then:  
  1. Summativism battle: If group knowledge reduces to member knowledge, does her norm collapse? Follow-up on whether internal dissent undermines assertions.  
