prompt: |-
  I am preparing a short session for a reading group on social ontology, and I have been trying to get clear about a picture of joint action that keeps coming up in our discussions. On this picture, two or more people do something together when four things hold at once: first, each of them intends the activity itself and not merely their own contribution to it; second, their plans interlock, in the sense that what each intends to do is precisely what the other's plan calls on them to do; third, each is disposed to adjust what they are doing in the light of what the other is doing or is about to do; and fourth, each knows that the first three things hold of the other, and knows that the other knows, as far as is needed for the plan to be carried out. What I cannot settle is which of these four conditions is doing the real work, and in particular whether a case that satisfies all four while involving no commitment of any kind between the participants -- no promise, no agreement, no obligation to the other, no entitlement on either side to complain if the other simply stops and walks away -- would still count as a case of doing something together. I suspect it would, and I want to see whether the suspicion survives a case built carefully enough to be convincing.

  So please construct such a case for me. It must be an ordinary, small-scale activity of the sort that could happen on a Tuesday afternoon, with no exotic technology, no contracts or promises, no explicit prior agreement, and no reliance on the participants feeling wronged, betrayed, or answerable to one another if one of them quits midway; the obligation-free character of the case has to be genuine rather than smuggled in through a background convention. It should also be a case in which an onlooker would describe what happened in the singular -- they did it -- and in which both participants, asked afterwards, would say without hesitation that they had done it together. Alongside it, give me a near-miss twin: a case that keeps the behaviour, the interlocking plans, and the participants' own sense of acting together as close to identical as possible, and differs in exactly one respect, which you choose and must defend as genuinely a single respect. The twin should fail to be a case of doing something together.

  Then do the checks. For the main case, show explicitly how it satisfies each of the four conditions, and show that the commitment conditions I listed are absent. Say which single feature of the case is carrying the weight in making it joint action rather than mere coordination, and what happens to the verdict if that feature is removed. Finally, put the strongest objection you can in the mouth of someone who thinks commitment is essential -- I expect the objection to be that a case like this cannot be built at all, because intending an activity as something we are doing just is accepting a standing commitment to the other person -- and tell me how the case survives it, or concede that it does not. A case that stipulates the conclusion, by describing the participants as cooperating or as acting as a unit, does not help me: the jointness needs to fall out of the structure of the case rather than be assumed in the telling.
reasoning: |-
  We are to construct two cases: one that satisfies all four conditions without any commitment (the main case) and a near-miss twin that fails to be joint action by differing in exactly one respect.

  Main Case: "The Passing Strangers"
  On a Tuesday afternoon, two strangers, Alice and Bob, are walking in opposite directions on a narrow sidewalk. They notice that they are about to collide. Without a word, they both step to their own right, pass each other smoothly, and continue walking. 

  Afterwards, an onlooker would say, "They passed each other without collision." If asked, Alice and Bob would each say, "We passed each other without bumping into each other." They did it together.

  Now, let's check the four conditions:

  1. Each intends the activity itself: 
     - Alice intends that she and Bob pass without collision. She doesn't just intend to step aside; she intends the joint activity of passing without collision. Similarly, Bob intends the same joint activity.

  2. Interlocking plans:
     - Alice's plan: she steps to her right and expects Bob to step to his right (so that they pass each other without collision). Bob's plan is the same: he steps to his right and expects Alice to step to her right. Their plans interlock because what each intends (stepping to their own right) is what the other's plan calls for.

  3. Disposition to adjust:
     - If Alice saw Bob step to his left (which would be wrong in their context), she would adjust by stepping to her left to avoid collision. Similarly, Bob would adjust if he saw Alice step to her left. They are responsive to each other's movements.

  4. Mutual knowledge:
     - Each knows that the other is also trying to avoid collision and that they are both stepping aside in a coordinated way. They know that the other is disposed to adjust (as in condition 3). This mutual knowledge is based on the immediate situation and the common practice of walking on the right (in countries where that is the norm). However, note that we are not relying on a background convention in the sense of an explicit agreement or obligation. The mutual knowledge is perceptual and situational.

  No commitment:
  - There was no promise, agreement, or obligation. If Bob had simply stopped or walked straight without stepping aside, Alice would not feel that Bob had violated an obligation. She might think he was rude or clumsy, but she wouldn't feel betrayed. Similarly, Bob could walk away without any moral complaint from Alice. They are strangers and owe nothing to each other.

  Near-miss Twin: "The Unilateral Adjuster"
  Same setting: two strangers, Alice and Bob, walking towards each other on a narrow sidewalk. They are about to collide.

  - Alice intends to avoid collision and steps to her right. She expects Bob to step to his right, but she doesn't have any intention about the joint activity. She only intends her own action and the outcome (avoiding collision for herself). She doesn't think in terms of "we are passing each other".

  - Bob, however, has the full joint intention: he intends that they pass without collision and steps to his right.

  Now, what happens? They pass without collision.

  But the near-miss twin fails condition 1: Alice does not intend the joint activity. She only intends to avoid collision by stepping aside, and she expects Bob to step aside (so condition 2 might seem to hold from Bob's perspective, but not from Alice's). Condition 3: Alice is disposed to adjust only to avoid her own collision, not because she is coordinating with Bob. Condition 4: Bob might know that Alice is stepping aside to avoid collision, but he doesn't know that she has the joint intention (because she doesn't). Alice doesn't know about Bob's joint intention because she doesn't think in joint terms.

  However, note that the behavior is the same: they both step to the right and pass. Also, if asked, Alice might say, "We passed without bumping," but that is a description of the outcome, not an acknowledgment of a joint activity. Bob would say they did it together, but Alice might not. So we have a failure in condition 1 for Alice.

  But the problem is that the participants' own sense of acting together might not be the same. In the main case, both would say they did it together. In the twin, only Bob would, but Alice might not. So we need to adjust to keep the participants' sense as close as possible.

  Alternative Near-miss Twin: "The Predictive Planner"
  Same setting, but now:

  - Alice intends to avoid collision. She predicts that Bob will step to his right (because she observes him or by habit). So she steps to her right, but she does not intend the joint activity. She only intends to get past Bob without collision by using her prediction.

  - Bob does the same: he intends to avoid collision and predicts Alice will step to her right, so he steps to his right.

  They pass without collision.

  Conditions:

  1. Neither intends the joint activity. Each intends only to avoid collision by moving appropriately, using a prediction about the other.

  2. Interlocking plans? Not exactly: each plans their own action based on prediction, but they do not have an intention that the other do their part. They only expect it.

  3. Disposition to adjust: each would adjust if the other did something unexpected, but only to avoid collision for themselves, not because they are coordinating.

  4. Mutual knowledge: they might know that the other is trying to avoid collision, but they don't know that the other has a joint intention (because they don't). They only know that the other is moving to avoid collision.

  Now, if asked, each might say, "We passed without bumping," meaning that the outcome was achieved, but they might not say that they did it together as a joint activity. They might say, "I stepped aside and he did too, so we didn't bump." So the sense of joint action might be missing.

  But to make the twin as close as possible, we can imagine that they do describe it as "we passed each other", but that description is merely about the outcome. The key is that they do not have the joint intention.

  Now, the main case has joint intention (condition 1) and the twin does not. We can take condition 1 as the single point of difference.

  Checks for the main case:

  - Condition 1: Each intends the joint activity. Alice intends that they pass without collision, and similarly for Bob.

  - Condition 2: Interlocking plans: each intends to step to the right and expects the other to step to the right, and that expectation is built into their plan.

  - Condition 3: Disposition to adjust: if one sees the other stepping the wrong way, they adjust. This is responsiveness.

  - Condition 4: Mutual knowledge: they each see the other stepping aside and know that the other is doing the same. They know that the other is disposed to adjust because they are both trying to pass without collision.

  No commitment: they are strangers, no obligations. If one had walked straight, the other would have adjusted or bumped, but without feeling that a promise was broken.

  What carries the weight? Condition 1: the joint intention. Without condition 1, even if the behavior and outcome are the same (as in the twin), it is not genuine joint action. In the twin, they are merely acting in parallel with mutual awareness and prediction, but not jointly.

  Objection from the commitment camp:
  "Intending that we do something together inherently involves a commitment to the other. When Alice intends that they pass without collision, she is committing herself to doing her part and also committing to the idea that Bob does his. She is thereby under an obligation to do her part and would feel that Bob is under an obligation to do his. If Bob simply stops, he violates that obligation. So the commitment is built into the joint intention."

  Reply:
  In the passing strangers case, the joint intention is minimal and does not generate obligations beyond the immediate moment. The intention is conditional and reactive. Alice does not feel that Bob owes her anything; she simply adjusts to the situation. If Bob stops, she might think he is being uncooperative, but not that he has violated a commitment. The joint intention is about the present coordination, not a promise for the future. It is a shared intention without the normative baggage of commitment.

  Moreover, the mutual knowledge is based on the immediate perception and the common practice, but that practice does not create obligations. It is a convention of coordination, not a moral rule.

  Thus, the case survives the objection by showing that joint intention can be present without commitment because the intention is purely about the immediate coordination and does not involve any undertaking for the future or any entitlement to demand performance.

  Therefore, the main case is a genuine instance of joint action without commitment, and the near-miss twin (without condition 1) is not.
