  ### Main Case: The Synchronized Stroll

  **Scenario:**  
  On a Tuesday afternoon, two strangers, Alice and Bob, are walking toward each other on a wide but cluttered sidewalk. Between them lies a large, immovable object (e.g., a public bench) that forces them into a narrow passage. Without breaking stride or exchanging any words, they both simultaneously:  
  - Slow their pace slightly to time their approach.  
  - Shift laterally (Alice to her left, Bob to his right) to create space.  
  - Pass each other smoothly without collision.  
  - Resume their original pace.  

  An onlooker would say, "They navigated the bottleneck together." Asked afterward, Alice and Bob would both say, "We got past each other without bumping," and agree they did it *together*.  

  #### Why It Satisfies the Four Conditions:  
  1. **Each intends the activity itself**:  
     Alice intends not just to move aside for her own sake but *that they pass smoothly as a pair*. She sees the bottleneck as a shared problem to solve jointly ("we need to avoid colliding"). Similarly, Bob intends the joint outcome—their coordinated passage—not merely his own sidestep.  

  2. **Interlocking plans**:  
     Alice’s plan: "I’ll slow down and move left so *he* can move right." Bob’s plan: "I’ll slow down and move right so *she* can move left." Each intends their own action *as* the complementary half of what the other’s plan requires.  

  3. **Disposition to adjust**:  
     If Alice saw Bob speeding up, she’d slow further; if Bob hesitated, she’d pause. Bob would widen his step if Alice misjudged the space. Each continuously monitors the other’s movements to fine-tune their own.  

  4. **Mutual knowledge**:  
     Alice sees Bob adjusting his gait and recognizes he is coordinating with her (and vice versa). Each knows the other is responsive (condition 3) and shares the joint goal (condition 1). This knowledge is perceptual and immediate—no prior agreement needed.  

  #### No Commitment:  
  - **No promises/agreements**: No words, gestures, or prior communication occur.  
  - **No obligations/entitlements**: If Bob abruptly stops walking, Alice feels no betrayal—she might be annoyed or confused, but she doesn’t think he *owed* her cooperation. She simply reroutes. Bob feels no guilt for quitting; he’s answerable to no one.  
  - **No reliance or convention**: The sidewalk has no cultural "rules" (e.g., right-side walking); they improvise. If Bob walks away, Alice doesn’t appeal to "fairness"—she adapts.  

  **Weight-Bearing Feature**: **Condition 1 (intending the joint activity)** carries the weight. Without it, the coordination becomes mere coincidence. Crucially, this intention is *reactive* and *non-normative*—Alice and Bob each adopt "we" as a descriptive frame ("we are getting past this") without incurring duties. If removed (e.g., if Alice only intended her own movement), the case collapses into parallel action, not joint action.  

  ---  

  ### Near-Miss Twin: The Predictive Bypass  

  **Scenario:**  
  Identical setup: Alice and Bob approach the bottleneck. They exhibit the *same behaviors*: slowing, shifting laterally (Alice left, Bob right), and passing smoothly. Both afterward say, "We got past each other," and *feel* they acted together. The only difference:  
  - **Condition 1 is absent**. Alice and Bob each intend *only their own contribution* to avoiding collision, not the joint activity. Alice thinks: "I’ll move left to dodge *him*." Bob thinks: "I’ll move right to dodge *her*." Each predicts the other’s actions based on real-time observation but sees no "we" in the activity—it’s purely about individual evasion.  

  #### Why It Fails as Joint Action:  
  - **Satisfied conditions**:  
    - *Interlocking plans (2)*: Alice moves left expecting Bob to move right (and vice versa), so plans interlock behaviorally.  
    - *Disposition to adjust (3)*: Each adjusts if the other deviates (e.g., Alice stops if Bob freezes) to avoid personal collision.  
    - *Mutual knowledge (4)*: Each knows the other is adjusting (e.g., Alice sees Bob shifting) and knows the other is responsive.  
  - **Failure**: **Condition 1 is missing**. Neither intends the activity *as joint*; they intend only their own roles. The "we" in their post-hoc description is just a report of the outcome, not a reflection of their intention during the act.  

  **Defending the Single Difference**:  
  The *only* change is the content of their intentions. The behaviors, adjustments, knowledge, and even their retrospective sense of "togetherness" are preserved. This isolates condition 1 as the decisive factor: joint action requires intending the *shared activity itself*, not just one’s part. Without it, we have sophisticated coordination (like two drivers swerving to avoid a crash) but not genuine doing-together.  

  ---  

  ### Commitment Theorist's Objection and Reply  

  **Objection**: "Your case is impossible. Intending a joint activity (‘we are doing X’) *just is* accepting a commitment to the other person. Alice can’t intend ‘*we* navigate the bottleneck’ without implicitly undertaking an obligation to Bob—e.g., to do her part and not let him down. If Bob walks away, Alice *should* feel he reneged on a minimal commitment. Otherwise, her ‘we-intention’ is hollow."  

  **Reply**: The case survives.  
  - **Why no commitment is entailed**: Alice’s intention is *contextually bounded* and *non-promissory*. She frames the activity as "we are passing" descriptively (like "we are blocking the light" in a cinema), not normatively. Her intention dissipates instantly if Bob quits—she doesn’t feel owed completion because the "we" was never a pledge. It’s like two people spontaneously lifting a fallen branch off a path: if one drops it, the other doesn’t accuse; they just adjust.  
  - **How the case avoids smuggling in commitment**: The absence of obligation is genuine:  
    - **No reliance**: Alice doesn’t *depend* on Bob; she’s prepared to act solo if he bolts.  
    - **No convention**: The coordination is improvised, not rule-based (e.g., no traffic norms).  
    - **No emotional residue**: If Bob leaves, Alice feels irritation (like encountering a slow walker), not moral betrayal.  
  - **Why condition 1 doesn’t require commitment**: Intentions can be *world-guided* (responsive to facts) without being *other-committing*. Alice’s "we-intention" is conditional on Bob’s concurrent actions: it’s a present-directed alignment, not a future-binding vow.  

  **Conclusion**: The Synchronized Stroll satisfies all four conditions without commitment, showing joint action is possible in fleeting, obligation-free contexts. Condition 1 is essential—it transforms coordination into jointness by embedding the "we" in the agents’ practical reasoning. The near-miss twin confirms this: identical behavior without joint intention reduces to mutual adjustment, not shared action. The commitment objection fails because reactive, non-normative we-intentions are coherent in transient interactions.
