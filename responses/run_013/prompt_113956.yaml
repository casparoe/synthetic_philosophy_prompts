prompt: |-
  I am writing up my position for a workshop on fanaticism and the limits of expected-value reasoning, and I should like an audit of my own commitments rather than a survey of the literature. Here is where I have landed. (1) Practical rationality consists in maximising expected value with respect to my actual credences; I do not think small probabilities may be discounted, and I do not think the value of outcomes has a ceiling. (2) I would not pay Pascal's mugger — the stranger who asks for my wallet on the strength of a threat whose astronomical magnitude, multiplied by its minute probability, is said to swamp every other consideration, and who can always raise the stakes until the arithmetic favours compliance — and I do not think I would be irrational in refusing. (3) I am a longtermist: I take the expected value of the far future to be astronomically large, and I take quite small probabilities of influencing it to be sufficient reason to give away a substantial part of my income. (4) I do not believe there is a fanaticism clause licensing me to ignore tiny probabilities of enormous payoffs; the machinery that makes longtermism compelling is the machinery that drives the mugging. (5) My resistance to the mugger rests on two thoughts: that the probability his threat is genuine is not merely small but unearned — a placeholder for ignorance rather than the output of any model with a track record — and that the making of the demand is itself evidence against it, since anyone able to do what he threatens would have no need to ask; my credences about the far future, by contrast, are earned, and no one is making a demand. (6) I do not think it is legitimate to refuse to put a number on the mugger's threat; if I decline to state a credence, I forfeit any claim to be an expected-value maximiser.

  Which of these are genuinely in tension, which only appear to be, and what is the cheapest repair for each genuine tension and what does that repair cost? Please order the tensions by severity, identify the commitment I am most likely to be holding only because I have not followed it through, and say which single revision would clear up the most. Do not simply reassure me that the package is consistent; where you think a tension is only apparent, say precisely what is doing the work of dissolving it, and where you think a commitment is doing no independent work, say so.
reasoning: |-
  Hmm, the user is presenting a philosophical position on fanaticism and expected value reasoning, and they want me to audit their commitments for tensions. They've shared six specific points about their views on rationality, Pascal's mugging, longtermism, and probability assessment.

  Looking at their positions, I see several potential tensions that need careful examination. The most obvious tension is between their rejection of Pascal's mugger (point 2) and their longtermist commitment (point 3). Both involve small probabilities of enormous payoffs, but they treat them differently. They justify this by distinguishing between "earned" and "unearned" probabilities (point 5) - seeing longtermist probabilities as based on models with track records, while the mugger's threat is just a placeholder for ignorance. This distinction seems crucial to their position.

  Another tension exists between their commitment to strict expected value maximization (point 1) and their refusal to pay Pascal's mugger (point 2). They acknowledge that by expected value calculations, they should pay the mugger if the numbers work out, yet they refuse. Their explanation about the threat being "unearned" and the demand itself being evidence against its credibility helps resolve this, but it still creates friction with their stated rational framework.

  I'm also noticing a potential issue with point 6 where they insist on assigning numerical probabilities. Their "unearned probability" concept might actually undermine this requirement, since placeholder probabilities aren't genuine credences. If they maintain that unearned probabilities shouldn't receive numerical assignments, this could resolve the tension.

  The most severe tension is definitely between points 2 and 3. The "earned/unearned" distinction is doing heavy lifting here, and I should scrutinize how robust this distinction really is. The user might be underestimating how similar longtermist probabilities are to the mugger's threat in terms of epistemic grounding.

  For repairs, the cheapest would be to clarify that "unearned" probabilities shouldn't receive numerical assignments (modifying point 6). A more costly repair would involve introducing a probability discounting mechanism for unsupported claims, which would require revising point 1. The most expensive repair would be to abandon strict expected value maximization entirely.

  The commitment most likely held without full follow-through is point 6 - the requirement to assign numerical probabilities. Their own "unearned probability" concept suggests they might actually believe some claims don't deserve numerical credences.

  To help the user, I should organize these tensions by severity, pinpoint where their reasoning might be inconsistent, and suggest targeted repairs that preserve as much of their original framework as possible while resolving the contradictions.
answer: |-
  Here is an audit of your commitments, ordered by severity of tension, with a focus on genuine friction points, apparent tensions, repair costs, and identification of the most vulnerable commitment:

  ### 1. **Severe Tension: Between (2) and (3)**
     - **Conflict:** Your refusal to pay Pascal’s Mugger (PM) clashes with your longtermist giving. Both involve tiny probabilities of astronomical payoffs. Your defense in (5) hinges on "earned" vs. "unearned" probabilities. However:
       - **Epistemic asymmetry is undefined:** You lack a principled distinction between "earned" and "unearned." What makes climate models or AI trajectory forecasts "earned" but PM’s threat not? Both extrapolate from limited data; both involve speculative chains of causality. If PM’s threat is "unearned" because it lacks a "track record," does longtermism’s claim about influencing the far future (which no model has tested) qualify?
       - **Demand-as-evidence is weak:** The claim that "anyone able to do what he threatens would have no need to ask" is an empirical assumption. A mischievous hyper-being might still mug for fun. This argument risks being an *ad hoc* excuse.
     - **Repair Needed:** Define "earned probability" rigorously. 
       - **Cheapest Repair:** Adopt a **track record requirement**: Only assign non-negligible probabilities to claims grounded in models that have generated successful predictions in analogous domains. PM’s threat fails; longtermism (e.g., based on climate science, tech forecasting) passes.  
       - **Cost:** Longtermist probabilities may still be far shakier than you admit. You must accept that *some* "earned" probabilities (e.g., AI risk estimates) might be contested as functionally "unearned" by skeptics.  
       - **Alternative Repair (Costly):** Introduce **updating on the act of offering the gamble**. PM’s proposal is evidence he’s selecting for gullible targets, lowering the probability he’s truthful. No equivalent "selection effect" exists for longtermist giving.  
       - **Cost:** This feels like rationalizing an intuition. It may not generalize cleanly.

  ### 2. **Significant Tension: Between (1) and (2)**
     - **Conflict:** Strict EV maximization (1) demands paying PM *if* the product (probability × payoff) favors it. You refuse (2), appealing to (5).
     - **Apparent or Genuine?** **Apparent, dissolved by (5) and (6)**. You *are* maximizing expected value *relative to your actual credences*. (5) argues your *actual* credence in PM’s threat is effectively zero (or low enough to refuse) because it’s "unearned" and the demand is evidence against it. (6) forces you to assign *some* number, but that number can be infinitesimal (e.g., 1/10^100) if justified by (5).  
     - **Work Being Done:** Your core move is that **some probabilities are so epistemically bankrupt they deserve assignment below any pragmatically relevant threshold**, even if non-zero. PM’s threat falls below this threshold; longtermism does not.  
     - **Risk:** This relies entirely on the strength of the "earned/unearned" distinction from point 1. If that fails, this tension re-emerges.

  ### 3. **Moderate Tension: Between (4) and (5)**
     - **Conflict:** You reject a "fanaticism clause" (4), insisting the same machinery drives PM and longtermism. Yet (5) introduces machinery *to block PM* (demand-as-evidence, unearned probability) that isn’t applied to longtermism.
     - **Apparent or Genuine?** **Apparent, dissolved by scope.** (4) rejects *general* exemptions for tiny probabilities. (5) provides *specific, contingent epistemic reasons* (applicable to PM but not longtermism) for assigning *ultra*-low probabilities. You’re not exempting tiny probabilities *as a class*; you’re assigning them differently based on context.  
     - **Work Being Done:** The consistency claim in (4) is upheld by applying the *same epistemic standards* (rigorous assessment of probability claims) to both cases, yielding different results due to contextual factors (the demand, the epistemic pedigree).

  ### 4. **Mild Tension: Between (6) and (5)**
     - **Conflict:** (6) demands assigning a number to PM’s threat. (5) labels it "unearned," a "placeholder for ignorance." Can ignorance be quantified meaningfully?
     - **Apparent or Genuine?** **Genuine, but easily repaired.** Assigning a precise number to "unearned" claims *is* epistemically dubious. However, EV maximization only requires *some* number (even an interval or a supremum).  
     - **Cheapest Repair:** **Distinguish quantifiable uncertainty from deep ignorance.** Assign PM’s threat a *vague, ultra-low* probability (e.g., "less than 10^-50", or a smooth ambiguity-prone credence). Your "placeholder" language suggests this.  
     - **Cost:** Weakens the force of (6). You must accept that some credences are not sharp numbers but are still usable in EV calculations (e.g., by using a supremum or a conservative estimate). This is standard in decision theory under ambiguity.

  ### 5. **Potential Tension: Between (3) and (5)**
     - **Conflict:** Is longtermism’s probability truly "earned"? The far future is massively more complex than PM’s threat. Models of AI, climate, or civilization trajectories have limited validation.
     - **Apparent or Genuine?** **Apparent, contingent on your defense of "earned."** If your repair for (1) (track record requirement) holds, longtermism plausibly qualifies. Models of existential risk draw on established science (physics, evolutionary biology, game theory) with predictive success in their core domains, applied cautiously to new contexts. PM invokes entirely novel, untestable entities/mechanisms.  
     - **Work Being Done:** The *relative* epistemic security of longtermism vs. PM. Longtermism leverages *existing* models; PM requires *wholly novel* ones.

  ### Summary & Recommendations
  - **Most Severe Tension:** (2) vs. (3) – The core challenge is justifying the *epistemic asymmetry* between PM and longtermism.
  - **Commitment Most Likely Held Without Full Follow-Through:** **(6) The demand to assign a number.** Your description of PM’s probability as "unearned" and a "placeholder" suggests you intuitively recognize *deep ignorance* that resists quantification. Strict adherence to (6) forces an artificial precision that contradicts (5). Relaxing (6) (accepting vague/imprecise probabilities for deeply uncertain claims) is the cheapest way to reduce friction without abandoning EV maximization.
  - **Single Revision Clearing the Most:** **Articulate a rigorous definition of "earned probability"** (e.g., based on model track records in relevant domains). This directly addresses the severe (2)/(3) tension and bolsters the defenses in (5) and (1).  
  - **Cost of This Revision:** You must confront the possibility that *some* longtermist claims (e.g., specific estimates of influence on 10^22 future lives) might be deemed "unearned" by your own standard, potentially weakening (3)’s force. It demands epistemic humility about longtermist probabilities, even while accepting their relative superiority over PM’s.

  Your position is *internally consistent* only if the "earned/unearned" distinction is robust and justifiable. The main work is done by this distinction and the contextual evidence from the mugging scenario. Without solidifying this distinction, the tension between rejecting the mugger and embracing longtermism risks appearing ad hoc. Focus your repair efforts here.
