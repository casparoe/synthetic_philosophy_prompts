prompt: |-
  I spent my working life as an experimental physicist and have come to philosophy only in retirement, so I may not have the vocabulary right; I would rather you correct my terms than defer to them. I am not asking for references, and a reading list would be of no use to me if the concept itself has not first been pinned down. What I want is a correct carving.

  I have been working through the difficulty that philosophers of mathematics call Benacerraf's dilemma: roughly, that an account of mathematical truth which treats mathematical sentences as true in the same way as any others sits badly with any credible account of how we could come to know them, while accounts that make the epistemology easy tend to surrender the truth. The dilemma itself I can follow. What I cannot find a name for is a smaller move that recurs inside the debate, and that I suspect is not peculiar to it.

  The move, as I see it, has three parts.

  First, someone objects to a class of entities on the ground that we have no credible account of how our beliefs about them could be reliably connected to the facts about them, so that the beliefs would be true, if at all, by accident. In the mathematical case the complaint is that nothing in our commerce with the world could explain why our arithmetic should match the arithmetic of objects we never touch.

  Second, the defender does not deny the gap. She points out that the same gap opens for something the objector is plainly committed to: the meanings of the words she uses, or the propositions her sentences are supposed to express, or the relation of logical consequence she is relying on in order to argue at all. None of those is something we bump into either.

  Third — and this is the part that interests me — the objector does not withdraw. She keeps the argument and narrows it. She explains that the cases are different after all: that numbers are supposed to be independent of us in a way that meanings are not; or that meanings come free with the very capacity to mean anything, whereas numbers would have to be discovered; or that the real trouble was never existence but reference, and that the words of mathematics stand differently from the words of our own theorizing with respect to what they latch onto. A line gets drawn which separates the objector's own commitments from the ones she is attacking, and which was doing no work in the argument until the parity reply appeared.

  I have seen the middle step called a companions-in-guilt argument, and that name seems right as far as it goes, but it appears to name only the parity reply, and it is normally offered as a way of defeating an objection outright. What I am describing is the case in which the objection is not defeated but relocated. I am also told that the first step is simply the access problem, and that the third step is nothing but the drawing of a legitimate distinction; I do not know how to tell whether that is so. I have noticed the same shape, as far as I can judge, in arguments about whether moral properties could be the sort of thing we come to know — where the reply is that mathematical properties are equally unlike anything in nature, and the narrowing is that mathematical properties are not supposed to move us to act.

  I would like three things. First, tell me whether the three-part trajectory, or the third step on its own, has an established name; if it does, say precisely how it differs from the nearest neighbours I have already mentioned, and from the tu quoque, and from the ordinary and respectable business of distinguishing cases. Second, if it has no name, give it one and define it, with a boundary case on each side: a pattern that resembles it but should not count, and a case you consider borderline, with a ruling and a reason. Third, tell me whether the third step is ever defensible — whether there is a principled way to redraw the line after parity has been conceded, or whether the honest response is always to drop the objection. Work the answer through concrete cases in the philosophy of mathematics; a survey of the literature is not what I am asking for.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired experimental physicist diving into philosophy, specifically Benacerraf's dilemma in math philosophy. They've noticed a recurring three-step move in debates and want to pin down what it's called or if it needs a new name. The key is that the third step—redrawing distinctions after a parity argument—isn't covered by terms like "companions-in-guilt" or "tu quoque."

  First, I need to confirm if the three-part move has an established name. From my knowledge, terms like "companions-in-guit" address the parity but not the subsequent distinction. The user mentions that in moral debates, similar moves happen, like distinguishing math properties not motivating action. So, no existing term covers this specific redrawing step.

  Next, the user wants a new name if none exists. I consider "distinction-retrofitting" as it captures the ad hoc redrawing after parity. For boundary cases, a legitimate distinction (like math vs. empirical claims) contrasts with a forced one. A borderline case might be Kantian synthetic a priori vs. analytic truths, where the distinction is debated.

  Then, the defensibility of the third step. In math philosophy, structuralism might allow a principled distinction between abstract objects and concepts like meaning. But if the objector just shifts the goalposts without justification, it's problematic. The user needs concrete examples, so discussing Field's nominalism or Carnap's internal/external questions could show when redrawing works versus when it's ad hoc.

  I should ensure clarity for someone without philosophy jargon. Avoid references, focus on concepts. Address their observation that this pattern isn't unique to math debates. Also, they value precise definitions, so the proposed term needs clear boundaries. Finally, emphasize whether the third step can be valid or if conceding parity should end the objection.
answer: |-
  Your dissection captures a precise dialectical maneuver that *does* lack a standard, universally accepted name. While "companions-in-guilt" (CiG) accurately describes the *second* step (the parity reply), the *third* step – the objector's *strategic redrawing of distinctions specifically to salvage the original objection after conceding parity* – is the distinctive phenomenon you've identified. Let's carve this precisely.

  1.  **Naming the Phenomenon:**
      *   **No Established Name:** There is no single, widely recognized term for this *specific three-step trajectory* or the *third step* in isolation. Philosophers discuss the *components* (access problem, CiG, distinctions) and the *outcomes* (e.g., "local error theory"), but not the *ad hoc redrawing maneuver* itself as a distinct move.
      *   **Distinguishing from Neighbors:**
          *   **Companions-in-Guilt (CiG):** This *is* the second step. It's a defensive strategy arguing that if the objector's premise (e.g., "no causal contact implies no knowledge") condemns the target (e.g., numbers), it also condemns something the objector accepts (e.g., meanings, logic). Its *intent* is to force the objector to either abandon the premise or accept skepticism about the companion. Your third step is the objector's *response* to CiG.
          *   **Tu Quoque ("You Too!"):** This is a broader accusation of hypocrisy. CiG *is* a specific form of tu quoque. The *third step* isn't itself tu quoque; it's the objector's *rebuttal* to the tu quoque/CiG challenge, attempting to show the "too" part doesn't actually apply equally.
          *   **Distinguishing Cases:** This is utterly ordinary and essential. The *problem* with the third step you describe isn't the act of distinguishing *per se*, but *when* and *how* it's done: **It occurs *only after* the CiG challenge is raised, and often involves invoking distinctions that weren't central to the *original* objection, specifically tailored to break the parity.** The distinction might be correct, but its deployment feels *post hoc* and motivated by the need to salvage the objection rather than arising organically from the initial critique.
      *   **Proposed Name & Definition:**
          *   **Name: Distinction-Retrofitting**
          *   **Definition:** The dialectical move in which, confronted with a successful companions-in-guilt argument showing that their original epistemic access objection applies equally to some entity X (which they accept) and the target entity Y (which they reject), the objector concedes parity *at the level of the initial objection* but immediately introduces a *new or previously underemphasized distinction* between X and Y. This distinction is invoked specifically to argue that, despite the conceded parity concerning the *original access problem*, Y remains uniquely problematic in a way that justifies maintaining the objection against Y while preserving acceptance of X.
          *   **Boundary Cases:**
              *   **Resembling but Not Counting (Legitimate Pre-Existing Distinction):** Imagine an objector argues against moral realism: "Moral facts, if they existed, would have to causally influence our beliefs, but there's no plausible causal mechanism." The defender deploys CiG: "So do mathematical facts! You accept math, so you must abandon this causal requirement." The objector replies: "Ah, but my *original* objection was *specifically* about *normative force* – moral facts are supposed to *motivate* action, and causal contact seems necessary for *that* in a way it isn't for inert mathematical facts. The CiG about causal contact is valid, but my core objection was always about normativity, not just existence/knowledge." Here, the distinction (normativity) *was* arguably central or implicit in the original objection *before* the CiG was raised. The reply clarifies, not retrofits.
              *   **Borderline Case (Plausible but Suspect Redrawing):** Consider an objector to abstract mathematical objects: "We have no perceptual or causal interaction with abstracta, so we can't know about them." CiG: "Same for the propositions expressed by this very sentence!" Objector replies: "Propositions are *types* (abstract), but they are *instantiated* or *realized* concretely in token utterances and mental states, which we *do* interact with causally. Numbers have no such concrete instances; they are pure abstracta. So the epistemic gap for numbers is absolute, while for propositions, we bridge it via their tokens." This distinction (type/token) is real, but was it doing the work in the *original* simple "no causal contact" objection? Or is it being brought in *now* specifically to break the CiG parity? It feels retrofitted, though the distinction itself isn't ad hoc.
                  *   **Ruling:** **Borderline, leaning towards Distinction-Retrofitting.** While the type/token distinction is genuine, its invocation here primarily serves to salvage the *specific form* of the access objection *after* the CiG challenge. The original objection ("no causal contact") didn't hinge on the pure abstract/concrete instantiation divide; it treated "abstract" monolithically. The distinction is retrofitted to *this specific dialectical context*.
          *   **Why this name?** "Retrofitting" implies adding something (the distinction) to an existing structure (the original objection) *after* it's been built and found deficient (due to CiG), specifically to patch the deficiency and make it serviceable again against the original target.

  2.  **Defensibility of the Third Step (Distinction-Retrofitting):**

      **It is *sometimes* defensible, but often suspect. The key is whether the distinction retrofitted is *principled* and addresses the *core spirit* of the original objection, or whether it's an *ad hoc* shift to avoid conceding defeat.** Honesty doesn't *always* demand dropping the objection; it demands rigorous justification for the new distinction.

      **Analysis Through Philosophy of Mathematics Cases:**

      *   **Case 1: Benacerraf's Dilemma & Platonism vs. Meaning/Logic (Your Core Example)**
          *   **Objector (e.g., Field-inspired nominalist):** "Platonic numbers are causally inert. No causal connection to our beliefs → no explanation for reliability of belief → knowledge impossible (or truth accidental)."
          *   **Defender (CiG):** "You accept the truth of logic (e.g., Modus Ponens is valid) and the meaningfulness of your own words. These also aren't causal entities we 'bump into'. Same problem!"
          *   **Objector (Distinction-Retrofitting):** "Logic and meaning are *constitutive of thought/linguistic competence itself*. They aren't 'discovered' external objects like numbers; they are framework conditions *we bring* to cognition. We grasp them *by* thinking/meaning. Numbers, as mind-independent abstracta, *would* need discovery. The access problem is for *external* reality, not internal constitutive rules."
          *   **Defensibility:**
              *   **Potentially Defensible:** This distinction (constitutive framework vs. discovered external object) is deep and principled (Kantian/Carnapian echoes). It arguably *does* address a core *spirit* of the access objection: the worry about *how we latch onto something genuinely independent*. The access problem *feels* different for things seen as products of our cognitive framework vs. inhabitants of a foreign realm. If the objector genuinely holds this view of logic/meaning *independently*, it's not purely *ad hoc* retrofitting.
              *   **Vulnerability:** The defender can push back: "Is this distinction truly clear? Are logical truths *really* just 'constitutive' or do they also track something objective? Doesn't math feel *discovered*? Why is 'constitutive' any less mysterious epistemically?" The burden is on the objector to flesh out this distinction convincingly. It's defensible *in principle* but requires robust development.

      *   **Case 2: Moral Realism vs. Mathematical Realism (Your Observation)**
          *   **Objector (Moral Skeptic):** "Moral properties (e.g., goodness) are queer – non-natural, causally inert. No plausible epistemology!"
          *   **Defender (CiG):** "Mathematical properties (e.g., primeness) are equally non-natural and causally inert. You accept math knowledge? Then drop this objection to morals."
          *   **Objector (Distinction-Retrofitting):** "Ah, but moral properties have *motivational force* or *practical authority* ('ought-ness') as part of their nature. Mathematical properties don't tell us what to *do*. This *normativity* is the truly problematic aspect requiring a special epistemology (e.g., causal influence on desires/will), which math lacks."
          *   **Defensibility:**
              *   **More Defensible:** This is arguably a *refinement* of the original objection rather than pure retrofitting. The "queerness" of moral properties often *includes* their normativity. The CiG *revealed* that the simple "non-natural, causally inert" description was insufficient. The objector sharpens their focus to the *distinctively normative* aspect, which genuinely *isn't* shared by math. This distinction (normative vs. non-normative abstracta) is fundamental and principled. It wasn't *absent* from the original "queerness" charge, even if implicit.
              *   **Caveat:** It can *feel* retrofitted if the objector initially presented the problem *solely* in terms of causal inertness/non-naturalness. The move is most defensible if the normativity worry was a core driver all along.

      *   **Case 3: Reference vs. Existence (Your "real trouble was never existence but reference" example)**
          *   **Objector:** "We can explain reference for 'water' (causal chains) or 'electron' (theoretical role). How can we refer to *abstract* objects like numbers? No plausible theory of reference!"
          *   **Defender (CiG):** "How do we refer to *meanings* or *logical constants* (e.g., 'and', 'not')? These aren't concrete. Your theory of reference fails for these too, yet you use them constantly!"
          *   **Objector (Distinction-Retrofitting):** "Logical constants and core semantic terms ('means', 'refers') are part of the *meta-language* framework *within which* reference is defined and discussed. They are presupposed by *any* theory of reference for *object-level* terms like 'water' or 'seven'. We don't need a *theory* of reference *for them* in the same way; they are *constitutive* of reference-talk itself. The problem of reference is specifically for *object-level* terms denoting entities *within* the domain of discourse. Numbers are problematic *object-level* referents."
          *   **Defensibility:**
              *   **Borderline/Defensible with Care:** The framework/content distinction (Carnap, meta-language/object-language) is a powerful and legitimate tool. If the objector genuinely holds a view where meta-linguistic terms function fundamentally differently, this *could* be principled.
              *   **Highly Suspect as Pure Retrofitting:** If the original objection was simply "How do words hook onto abstract things?", the CiG shows this applies equally to 'and' or 'means'. Suddenly limiting the objection *only* to "object-level" terms *after* the CiG challenge looks like changing the subject. Why wasn't the level distinction central to the *original* worry? This easily becomes an *ad hoc* dodge unless deeply integrated into the objector's prior semantic theory.

  **Conclusion on Defensibility:** Distinction-retrofitting is **not inherently illegitimate**. Philosophers *should* refine their views in response to counterarguments (CiG). The crucial questions are:
  1.  **Principled Basis:** Does the new distinction reflect a deep, independently motivated philosophical commitment, or is it *only* deployed to escape the CiG?
  2.  **Relevance to Original Spirit:** Does the distinction genuinely address the *core concern* driving the *original* objection, or does it subtly shift the goalposts?
  3.  **Burden of Proof:** After conceding parity at the initial level, the objector bears a heavy burden to *justify* the relevance and significance of the new distinction for the epistemic/access worry.

  The "honest response" isn't *always* to drop the objection. It *is* to recognize the force of the CiG argument against the *initial, unrefined* objection. The honest response is to either:
  *   **Concede:** Abandon or significantly weaken the original objection in light of the revealed parity.
  *   **Refine Principledly:** Articulate a *principled*, pre-existing (or now compellingly justified) distinction that *genuinely* explains why the target (Y) remains vulnerable to the *core concern* behind the objection, even if the *specific initial formulation* also caught the companion (X). This refinement must withstand scrutiny that it isn't merely *ad hoc*.

  Distinction-retrofitting often fails the "principled basis" test, becoming an unpersuasive dodge. But when it succeeds (as in sharpening the moral normativity point against the math CiG), it represents legitimate philosophical progress by forcing more precise formulations of both objections and commitments. You've pinpointed a subtle and pervasive dialectical dynamic that deserves the label "Distinction-Retrofitting."
