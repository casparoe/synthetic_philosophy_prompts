  I should break down the types of idealizations. Harmless ones, like frictionless planes in physics, simplify without altering core principles. Load-bearing ones, like the epidemic model ignoring superspreading, change the causal structure. The key difference is whether the assumption affects the model's ability to capture essential mechanisms or only simplifies non-essential factors.

  Friedman's essay might be misrepresented as "only predictions matter," but he likely acknowledged that unrealistic assumptions can still be useful if they predict well. However, the user's objection is that predictive success alone doesn't guarantee the model is reliable under different conditions. For example, if a model ignores network effects in epidemiology, it fails when those effects are critical, even if it predicted average cases in a controlled scenario.

  The user also needs a principled way to distinguish these cases. Criteria like modularity (can the assumption be relaxed without overhauling the model?) and causal faithfulness (does the model reflect real causal relationships?) are important. Examples like perfect competition vs. rational choice in economics can show how some assumptions are more critical than others.

