  **VEIL MUTUAL ASSURANCE SOCIETY**  
  *Safeguarding Tomorrow’s Persons, Today*  

  **PROSPECTUS: PRE-IDENTITY LIFE COVER**  
  *Policy No. VMA-Ω*  

  ---

  ### I. UNDERWRITING PRINCIPLES  
  1. **Equitable Risk Pooling**: Your premium is calculated under the *Uniform Stochastic Weighting Protocol*. As each applicant occupies an equiprobable position among all potential future policyholders (see Addendum 7: *The Lottery of Existence*), benefits are structured to maximize the mean expected welfare across the collective.  
     *Marginal Note: Actuarial neutrality is preserved via symmetric uncertainty. No identity-based discrimination occurs at underwriting.*  

  ---

  ### II. POLICY TERMS & CONDITIONS  
  #### A. COMPARABILITY CLAUSE (CLAUSE 3.2)  
  2. All claims are settled in units of Standardized Welfare Equivalents (SWE). SWE calibration requires certification by a Veil Mutual Accredited Assessor (VMAA).  
  3. Should a policyholder dispute SWE commensurability (e.g., "My suffering is *sui generis*"), the VMAA will assign a proxy SWE via randomized societal preference surveys (Rider 3.2a: *Hedonic Interpolation*).  
     *Regulator Note: Approved by the Bureau of Original Position Compliance (BOPC).*  

  #### B. EX ANTE/EX POST IRREVOCABILITY (CLAUSE 5.1)  
  4. Coverage is binding *prior* to identity assignment. Post-assignment claims of the form "Knowing my actual socioeconomic coordinates, I would have declined coverage" are null and void.  
     *Marginal Reassurance: 98.7% of hypothetical purchasers approve terms behind the veil (per VMA-Ω actuarial surveys).*  

  #### C. POSITIONAL CLAIMS EXCLUSION (CLAUSE 8.4)  
  5. No benefits are payable for losses arising purely from ordinal ranking (e.g., "I regret not being in the top 10%"). Relative deprivation is uninsurable.  
     *Illustration: Earning less than Policyholder X, absent absolute deprivation, is not a covered event.*  

  ---

  ### III. CLAIMS ADMINISTRATION  
  **FORM LETTER VMA/CL-447 (STANDARD)**  
  *To Policyholder #7749-δ ("Low-Skill Laborer, Subsistence Wage, Chronic Health Deficit"):*  

  6. Dear Sir/Madam/Nonbinary Person,  
     We acknowledge your claim for SWE adjustment (Ref: "Lifetime Welfare Deficit"). Per your policy, benefits are calculated ex ante under equiprobable identity weighting. Your payout (3.2 SWE/month) reflects the *average* expected welfare optimization across all enrollees.  
     While your realized identity falls in the 0.7th percentile of SWE outcomes, Veil Mutual’s model ensures this outcome was offset by higher payouts to identities you might equally have embodied. We regret we cannot recalibrate post-assignment.  
     Enclosed: Pamphlet, *"You Almost Won the Lottery! Statistical Consolations."*  

  ---

  ### IV. COMPETITIVE NOTICES  
  **REGULATORY FILING FROM RAWLSIAN SHIELD UNDERWRITERS (RSU)**  
  *BOPC Docket No. 44-ψ: "Objection to VMA-Ω’s Risk-Neutral Bias"*  

  7. RSU condemns Veil Mutual’s "reckless actuarial egalitarianism." No rational agent behind the veil would accept a gamble assigning equal odds to being a feudal serf or a tech oligarch. RSU offers **MAXIMIN GUARANTEE™**: Policies pay only to the worst-off identity, eliminating identity lottery risk.  
     *Veil Mutual’s Quiet Rebuttal (Footnote 8α): RSU’s model ignores 99.3% of potential welfare gains. Pessimism is expensive.*  

  ---

  ### V. SPECIAL PROMOTION  
  **BENTHAM & SON COLLECTIVE ASSURANCE**  
  *Advertisement in "The Utilitarian Quarterly"*  

  8. **JOIN THE GREATER NUMBER!**  
     Bentham & Son’s *Per Capita Advantage Plan*™ slashes your premium with each new enrollee. Why? More policyholders = lower individual cost-scaling of aggregate welfare! Enroll 10 friends, cut your premium by 40%!  
     *Small Print: Benefits diluted quadratically with enrollment (See: Diminishing Marginal Welfare Weights).*  

  ---

  **Bottom line:** The entire edifice assumes every rational agent behind the veil is *risk-neutral* over the lottery of life.
