  We are creating a parody brochure for a life-insurance firm that sells policies to people who do not yet exist (i.e., behind the veil of ignorance). The firm is based on Harsanyi's aggregation theorem, which derives a utilitarian social welfare function by assuming that each person has an equal chance of being anyone in society.

   The document will be structured as a brochure with clauses, riders, marginal notes, and some correspondence. We'll use deadpan corporate language and avoid stating objections outright. The reader should infer the premise (risk neutrality) that is carrying the structure.

   We'll include:
   1. The underwriting rule (actuarial prudence): premiums and payouts set to maximize the average expected welfare.
   2. Comparability clause: single scale of well-being, with an assessor. What if a policyholder insists her scale is incommensurable?
   3. Ex ante/ex post clause: no claims based on "now that I know who I am, I wouldn't have bought this."
   4. Positional-claims exclusion: losses that are only about ranking below others.
   5. Form letter to a policyholder who drew a bad identity.
   6. Notice from a rival (maximin) underwriter.
   7. Advertisement from a third firm that prices by headcount (utilitarian with increasing numbers).

   Finally, a bottom line stating the premise.

   Let's invent names:
   - Our firm: "Veil Mutual Assurance Society" (VMAS)
   - Rival (maximin): "Rawlsian Shield Underwriters" (RSU)
   - Third firm: "Bentham & Son Collective Assurance"

   We'll structure the brochure:

   I. Cover Page: Glossy, with a tagline: "Insuring the Unborn: Because Every Identity Deserves a Fair Chance."

   II. Inside: 
      A. Introduction: Reassuring message about covering the unknown.
      B. The Underwriting Rule (Clause 1)
      C. Comparability Clause (Clause 2)
      D. Ex Ante/Ex Post Clause (Clause 3)
      E. Positional Claims Exclusion (Clause 4)
      F. Sample Correspondence: Form letter to a policyholder with bad identity (Item 5)
      G. Notice from Rival (Item 6) - perhaps as a competitor alert or a regulatory filing?
      H. Third Firm's Ad (Item 7) - as a competitor's advertisement in the margin?

   III. Bottom line.

   We'll write in the style of a policy document with marginal notes and footnotes.

   Let's write.
