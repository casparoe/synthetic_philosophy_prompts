prompt: |-
  I am preparing a short note on the epistemic credentials of majority rule for a workshop, and I want my own position audited before anyone else gets to it. I would rather find the cracks myself than have them found for me. Here is what I hold.

  (1) A decision procedure is legitimate only if it is at least as likely as any available alternative to get the answer right. Procedural fairness is not a substitute for this; at most it governs what we do when the epistemic case is a tie.

  (2) Condorcet's theorem is the engine of the epistemic case for large electorates, and it is more robust than its critics allow. What the theorem needs is not well-informed voters but voters whose individual probability of getting the matter right sits on the correct side of one half; the individual shortfall is averaged out. Since a modern electorate is enormous, an average competence barely above one half is enough for practical certainty, so I do not lose sleep over voter ignorance.

  (3) Critics of the theorem make too much of the independence assumption. Votes need not be independent of one another as they come in; it suffices that they be independent once the state of the world is fixed. What the theorem cannot survive is a shared cause of error — one source, one framing, one bias that many voters take up together — and that is a failure no increase in the number of voters repairs.

  (4) On much of what actually appears on a ballot, I doubt the competence condition invoked in (2) is met. Voters are not merely ill-informed; on many questions I would expect a substantial share of them to be worse than chance.

  (5) Deliberation probably raises average competence and also raises the correlation of errors. I have no settled view about which effect dominates, and I do not think the theorem can settle it either.

  (6) Majority rule is nonetheless the right procedure for a polity, for reasons that have nothing to do with truth-tracking — something in the neighbourhood of equal respect.

  (7) Some questions put to a vote — how much of a budget should go here rather than there — have no answer independent of the votes, and the theorem has no business assessing them.

  Audit this. Which commitments are actually in tension with which others, and how badly? Rank the tensions rather than treating them as so many separate alarms; say where a tension is only apparent and why it dissolves; and identify the single revision that resolves the most while costing the least, together with what it costs. I am not antecedently attached to any one item on the list, so do not assume I would sooner give up any of them than any other. Where the mathematics of the theorem bears on whether two items can be held together, be explicit about which direction the result cuts.
reasoning: |-
  Okay, let me approach this user's request systematically. The user presents seven theses about majority rule's epistemic credentials and requests an audit focused on internal tensions. This is clearly a sophisticated philosophical argument requiring careful logical mapping.

  First, I need to understand the core structure: Thesis 1 establishes an epistemic legitimacy standard, 2-5 engage Condorcet's theorem mechanics, while 6 and 7 create exceptions. The most striking tension appears immediately between 1's strict epistemic requirement and 6's non-epistemic justification - that seems like the primary fault line.

  Looking at the Condorcet-related claims: Thesis 2's optimism about low-competence electorates contrasts sharply with 3's vulnerability to correlated errors and 4's skepticism about voter competence. The user acknowledges these but may underestimate their interaction - when correlated errors exist (as per 3), the "barely above 0.5" competence in 2 becomes unstable. 

  Thesis 5 introduces further complexity regarding deliberation's dual effects. But crucially, if 4 is correct that many voters are worse than random, deliberation might amplify errors rather than correct them. This directly challenges 2's reliance on averaging out errors.

  On the political philosophy front, thesis 6 creates what might be an irreconcilable conflict with 1. If legitimacy requires truth-tracking (1), but majority rule is justified non-epistemically (6), how do we handle cases where 4 applies? The user's distinction in 7 helps somewhat but doesn't resolve core legitimacy questions.

  Mathematically, I should emphasize how correlated errors (3) catastrophically undermine the asymptotic certainty in 2. The theorem's exponential decay of error probability depends critically on independence - shared error sources break this completely. This makes 3 and 4 jointly more damaging to 2 than the user suggests.

  For the recommended revision, softening thesis 1's absolutism ("only if") seems most productive. Changing it to a pro tanto requirement would preserve epistemic aspirations while accommodating 6's non-epistemic cases. The cost is conceding that legitimacy sometimes rests entirely on procedural fairness.

  Throughout, I need to maintain the user's preferred style: precise about logical tensions, explicit about mathematical implications, and ruthlessly prioritizing which contradictions matter most. The audit should mirror their own clear-eyed approach to finding cracks in the argument.
answer: |-
  Here's an audit of your commitments, ranking tensions by severity and identifying potential resolutions. The analysis prioritizes logical/mathematical tensions over practical concerns.

  **Ranked Tensions (Highest to Lowest Severity):**

  1.  **Tension between (1) and (6): The Legitimacy Dilemma**
      *   **Nature:** This is the core philosophical tension. (1) states legitimacy *requires* epistemic optimality (or at least non-inferiority). (6) asserts majority rule is legitimate *despite* potential epistemic failures (on many issues per (4)), justified by "equal respect". (1) makes procedural fairness a weak tie-breaker, while (6) elevates it to a primary justification.
      *   **Severity:** **Extreme.** These directly contradict on the *source* of legitimacy. If (1) is strict, (6) cannot justify majority rule for questions where a demonstrably better epistemic alternative exists (e.g., delegation to experts on complex technical issues) or where competence is <0.5 (per (4)). (6) implicitly rejects (1)'s primacy for legitimacy.
      *   **Resolution?** Only apparent if "legitimate" in (1) refers *only* to *epistemic legitimacy for truth-tracking questions*, while legitimacy in (6) refers to *political/moral legitimacy*. However, (1)'s wording ("a decision procedure is legitimate only if...") suggests a comprehensive claim. The tension dissolves only if you abandon the universality of (1) or the primacy of the epistemic claim in (6). This is fundamentally a normative clash.

  2.  **Tension between (2) and (3)/(4): The Fragility of Practical Certainty**
      *   **Nature:** (2) relies on Condorcet's theorem and low average competence (>0.5) in large electorates to achieve "practical certainty". (3) highlights the theorem's fatal vulnerability to *common causes of error*, which are empirically highly likely (media framing, dominant ideologies, misinformation campaigns). (4) directly challenges the core competence assumption (>0.5) for many issues, suggesting substantial subgroups are *worse* than random.
      *   **Severity:** **High.** (3) and (4) directly attack the pre-conditions required for (2)'s optimistic conclusion. The mathematics cuts decisively:
          *   **Competence <0.5:** If average competence is truly <0.5, Condorcet's theorem implies majority rule becomes *less* reliable as group size increases, converging on *certain error*. (4) suggests this is common.
          *   **Correlated Errors:** The law of large numbers *does not apply* to correlated errors. A single strong common cause of error affecting even a modest fraction of voters can dominate the outcome, regardless of group size. As per (3), "no increase in the number of voters repairs" this. The "practical certainty" of (2) vanishes under realistic conditions described in (3) and (4).
      *   **Resolution?** Only apparent if the issues where competence >0.5 *and* independence holds (once world-state fixed) perfectly overlap with the issues put to majority vote. (4) and (3) strongly suggest otherwise. The tension lessens slightly if "practical certainty" in (2) is interpreted as a *theoretical possibility* under idealized conditions, while (3)/(4) describe the *practical reality*. But (2)'s dismissal of worries ("I do not lose sleep") clashes directly with the severity of (3) and (4).

  3.  **Tension between (2) and (5): The Deliberation Uncertainty**
      *   **Nature:** (2) relies on averaging out uncorrelated errors via large numbers. (5) acknowledges deliberation, a key democratic ideal, *increases correlation* of errors (shared biases, groupthink) while *potentially* raising average competence. The net effect on majority accuracy is unknown.
      *   **Severity:** **Moderate-High.** This exposes a vulnerability in applying the theorem to real democracies. Deliberation is intended to *improve* decisions, but (5) correctly notes its complex effects. Crucially, **the mathematics cuts decisively against (2) if deliberation increases correlation *without sufficiently increasing competence*.** Even a small increase in correlation can significantly degrade the "averaging out" effect that (2) depends on for large groups. If deliberation makes voters *more likely to be wrong together*, it actively harms Condorcet reliability, counteracting the size benefit.
      *   **Resolution?** Not readily apparent. It highlights an empirical hole and a practical challenge for the epistemic case. You acknowledge the tension ("no settled view"), so it's consistent internally. However, it *amplifies* the concerns raised by (3) and (4), making the optimism of (2) appear even less justified in practice.

  4.  **Tension between (1)/(2) and (7): The Scope of Epistemic Justification**
      *   **Nature:** (1) and (2) focus on truth-tracking legitimacy. (7) correctly states that Condorcet's theorem (the engine of (2)) *only* applies to questions with a "procedure-independent truth" (PIT). It doesn't apply to pure preference aggregation (like budget splits).
      *   **Severity:** **Moderate.** This is less a tension and more a vital clarification. The problem arises if the epistemic justification ((1) & (2)) is *over-extended* to cover PIT-less questions. Your (7) explicitly prevents this over-extension. The legitimacy of majority rule on PIT-less questions must rest elsewhere (like (6) or fairness).
      *   **Resolution?** **Largely Apparent.** (7) acts as a necessary boundary condition, protecting the epistemic argument in (1)/(2) from being applied where it's invalid. It clarifies the *domain* of the Condorcet-based epistemic claim. The minor tension lies in (1)'s universality ("a decision procedure"). (7) implies (1) only applies to procedures *for questions with a PIT*. Revising (1) slightly to reflect this scope dissolves any residue tension.

  5.  **Tension between (3) and the Robustness Claim in (2):**
      *   **Nature:** (2) claims the theorem is "more robust than its critics allow." (3) then details its most significant and common vulnerability (common causes of error), emphasizing its catastrophic nature.
      *   **Severity:** **Low-Moderate.** This is more a matter of emphasis than direct contradiction. You acknowledge the vulnerability in (3), so you aren't ignoring it. However, calling the theorem "robust" while immediately highlighting a fatal and common flaw could be seen as downplaying the significance of (3). The robustness claim in (2) feels slightly discordant with the severity admitted in (3).
      *   **Resolution?** **Largely Apparent.** The tension dissolves if "robust" in (2) is meant relative to *other specific criticisms* you deem less important (e.g., minor deviations from 0.5, some forms of non-independence *before* conditioning), not relative to the common-cause vulnerability. Clarifying the scope of "robust" would help.

  **The Single Most Resolving Revision:**

  *   **Revise Thesis (1):** Soften its absolutism regarding epistemic performance as the *sole necessary condition* for legitimacy.
      *   **Proposed Revision:** *"For questions with a procedure-independent truth, a decision procedure gains significant epistemic legitimacy if it is at least as likely as any available alternative to get the answer right. Procedural fairness provides a distinct source of legitimacy, particularly relevant when the epistemic case is inconclusive or inapplicable (e.g., preference aggregation)."*
  *   **What it Resolves:**
      *   **Legitimacy Dilemma (Tension 1):** Explicitly separates epistemic legitimacy (for PIT questions) from other sources (fairness/respect), reconciling (1) and (6). Legitimacy can now flow from either source (or both), depending on the question type. It accommodates (7).
      *   **Scope Clarity (Tension 4):** Explicitly ties the strong epistemic claim to PIT questions, aligning perfectly with (7).
      *   **Impact on Other Tensions:** Doesn't directly resolve Tensions 2/3/5, but makes them less existentially threatening to the *overall legitimacy* of majority rule by allowing (6) to bear the weight where the epistemic case falters (as per (3), (4), (5)).
  *   **Cost:**
      *   **Theoretical Cost:** Abandons the strong, clean claim that epistemic performance is the *only* necessary foundation for legitimacy. Concedes that procedural fairness/respect can be a *primary* justification, not just a tie-breaker. This is a significant normative retreat from the original (1).
      *   **Practical Cost:** Introduces complexity: determining which questions have a PIT (as per (7)) becomes crucial for knowing which legitimacy standard applies. Some questions are contested (e.g., "Is policy X just?").

  **Why this Revision?**

  It addresses the most severe tension (1 vs. 6) and the scope tension (1/2 vs. 7) with minimal alteration to the other theses. It preserves your core insights about Condorcet (2, 3, 5), voter competence worries (4), the non-epistemic justification (6), and the PIT distinction (7), while providing a coherent framework for when each justification applies. The cost is abandoning the strongest possible epistemic claim to legitimacy, but it's necessary to hold (6) without contradiction and accurately reflect the limits highlighted by (3), (4), (5), and (7). The mathematics of Condorcet (susceptibility to correlation, dependence on competence >0.5) makes clinging to the original (1) for all questions under majority rule untenable in light of your own (3), (4), and (5). This revision allows the epistemic argument to stand where it can (simple PIT questions with decent competence and low correlation) while relying on fairness/respect elsewhere, which is your ultimate fallback in (6).
