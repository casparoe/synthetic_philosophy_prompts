  Also, include humor to keep it light, like joking about the uncle's comments or the bike sale. End with a toast tying it all together. The table will help the user verify each point against their rules. Check that all claims are backed by real costs and highlight divergent interests. Avoid any "look how they look at each other" clichés. Make sure the biology is accurate for the PhDs but not explicit for the family.
