  | **Subject Distress** (Groans, Sweating, Protesting) | Compassion/Intervention (D) | **N/A (Manifestation)** | Affective/internal manifestation of D occurring *despite* behavioral masking. Confirms D is present. | Is distress *necessarily* part of D's manifestation? Could it be something else? | Medium-High |
