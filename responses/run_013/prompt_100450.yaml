  | **Increased Proximity** (Victim Visible/Tactile) | Compassion/Intervention (D) | **Weakening Mask** | Falling obedience; stronger suffering signal (S) partially overwhelms the masking structures. | Doesn't perfectly predict *degree* of drop; other situational factors interplay. | Medium-High |
