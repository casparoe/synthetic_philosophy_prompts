prompt: |-
  The fourth meeting of a reading group on the legal afterlife of the Second World War falls to me, and I want to spend it on the drafting of the London Charter in the summer of 1945 rather than on the trial itself. Sixteen participants, ninety minutes, mostly philosophy and law graduate students, most of whom know the Nuremberg story in outline and none of whom have thought about where the categories came from. What I want is for them to feel the retroactivity problem from the inside — to end the session having *written* an ex post facto criminal code, in a room with no neutral arbiter, and to have noticed the price they had to pay for four-power agreement — instead of hearing me explain nullum crimen sine lege afterwards. No framing lecture at the start; the last time I tried this it became a seminar on Allied hypocrisy inside ten minutes, and I'd rather the structure make that outcome unavailable.

  Design it as a drafting conference rather than a mock trial: four delegations of three or four, each with a brief and a sealed file describing something its own state has done or is doing that a broadly worded rule would catch. Invent those files, but keep them plausible for 1945 and drawn from the kind of conduct the prosecuting powers themselves engaged in or tolerated. The delegations negotiate a short charter — a definition of the crimes and a clause on superior orders — and then ratify it. My guess is that unanimity will only be purchasable with vagueness, and I want them to discover that the vagueness is the mechanism rather than the sloppiness; if the design can make the finished text's ambiguities feel necessary, that is the whole session. Give me rules, materials, a minute-by-minute timeline, the four briefs and sealed files, the drafting template, and the ratification procedure.

  Then a debrief that maps what happened onto the real thing: the count of crimes against peace and its grounding in the 1928 renunciation of war, the tu quoque defence, the connection requirement that tied crimes against humanity to the war and the dispute over whose interests that limit served, the Tokyo variant where the same objections arose before a different bench, and what actually did the legitimising work afterwards — the General Assembly's affirmation of the principles and their later codification, rather than the verdicts themselves.

  Tell me what will predictably go wrong the first time I run it and how to handle it — I expect anachronism, someone reaching for the Rome Statute, and I expect one delegation to dominate the table — and be frank about which feature of the problem the activity cannot reproduce and that I will have to supply myself. Finally, say how confident you are that this arrangement will produce the discovery rather than a morality play about hypocrisy, and single out the one design feature you are least sure of.
reasoning: |-
  We are designing a 90-minute session for 16 participants (mostly philosophy and law graduate students) to simulate the drafting of the London Charter in 1945. The goal is for participants to experience the retroactivity problem and the necessity of vagueness for achieving four-power agreement. The session is structured as a drafting conference with four delegations (each with 3-4 participants), representing the US, UK, France, and the Soviet Union.

  Key elements:
  - No framing lecture at the start to avoid turning into a seminar on Allied hypocrisy.
  - Each delegation has a brief and a sealed file containing a sensitive issue that their own state has done or is doing which a broadly worded rule might criminalize.
  - The delegations must negotiate a short charter (definition of crimes and a clause on superior orders) and then ratify it by unanimity.
  - Debriefing to connect the exercise to the real historical events.

  Structure of the session:
  1. Introduction and setup (5 minutes)
  2. Delegation preparation (15 minutes)
  3. Negotiation rounds (45 minutes total, broken into two parts)
  4. Ratification (5 minutes)
  5. Debriefing (20 minutes)

  Materials needed:
  - Four delegation briefs (one per country: US, UK, France, USSR)
  - Four sealed files (one per delegation, containing their sensitive issue)
  - Drafting template for the charter (to be filled in during negotiation)
  - Rules of procedure for the negotiation

  Delegation Briefs (to be given to each group):

  1. United States:
     - Brief: You are committed to establishing a new international tribunal to try the Nazi leaders for unprecedented crimes. However, you are concerned about retroactivity and the principle of nullum crimen sine lege. You want to define crimes clearly but are under pressure to avoid setting precedents that could be used against the US. You are particularly sensitive about the crime of aggression (crimes against peace) and the conduct of strategic bombing. You also want to establish individual responsibility and reject the defense of superior orders in absolute terms.

  2. United Kingdom:
     - Brief: You support the prosecution of Nazi leaders but are wary of creating new law. You prefer to rely on existing international law and the laws of war. You are concerned about crimes against humanity because of the potential to criminalize colonial practices. You also have concerns about the defense of superior orders and want to allow it in limited circumstances. You are particularly sensitive about actions in the colonies and the treatment of detainees.

  3. France:
     - Brief: Having suffered under German occupation, you are eager to see justice done. However, you are concerned about the potential for crimes against humanity to be applied to your own actions in the colonies, particularly in North Africa. You also have concerns about the crime of aggression and want to limit the scope of the tribunal to the European theater. You want to ensure that the defense of superior orders does not absolve those who committed atrocities.

  4. Soviet Union:
     - Brief: You want a broad definition of crimes that will cover the Nazi atrocities, especially the extermination of civilians and the destruction of property. However, you are concerned about any rules that might be used to scrutinize your own actions, such as the Katyn massacre, the occupation of the Baltic states, or the treatment of prisoners of war. You also want to avoid any definition that would criminalize the Soviet system of government. You are open to a broad definition of crimes against humanity but want to tie it to the war. On superior orders, you take a hard line: no defense.

  Sealed Files (to be opened by each delegation during preparation):

  - US Sealed File: "Strategic Bombing: The US has engaged in extensive area bombing of German and Japanese cities, resulting in large numbers of civilian deaths (e.g., Dresden, Tokyo). Any broadly defined war crime that does not explicitly exclude attacks on cities from the air could implicate US commanders."

  - UK Sealed File: "Colonial Repression: In recent actions in Malaya and Kenya, British forces have used collective punishment, internment without trial, and harsh interrogation methods. A broad definition of crimes against humanity or war crimes without a clear link to international armed conflict could expose British officials."

  - France Sealed File: "Algeria: French forces have used torture and extrajudicial killings in suppressing nationalist movements in Algeria. Also, during the occupation of Germany, there have been incidents of abuse of German prisoners and expellees. A broad definition of crimes against humanity or war crimes without a temporal or geographic limitation could implicate French officials."

  - Soviet Sealed File: "Katyn and the Baltics: The Soviet Union executed thousands of Polish officers in the Katyn forest in 1940 and forcibly annexed the Baltic states. Additionally, the treatment of German civilians and prisoners of war by Soviet forces has been brutal. Any crime against humanity that covers pre-war actions or does not require a connection to the war could lead to scrutiny of these actions."

  Drafting Template: A one-page document with two sections to be filled:
  1. Definition of Crimes:
     - Crimes Against Peace:
     - War Crimes:
     - Crimes Against Humanity:

  2. Defense of Superior Orders: [Text]

  Rules of Procedure:
  - Each delegation has one vote. Unanimity is required for each article (each crime and the superior orders clause).
  - Negotiation will proceed in two rounds:
     - Round 1 (25 minutes): Delegations discuss and draft the definitions. They can caucus and move between tables. The goal is to produce a draft charter.
     - Round 2 (20 minutes): Delegations review the draft and try to achieve unanimity. They may make final amendments.
  - At the end of Round 2, the delegations vote on the entire charter. If any delegation votes against, the charter fails.

  Ratification Procedure: Each delegation must sign the charter. If all sign, it is adopted. If one or more refuse, the charter is not adopted.

  Timeline (90 minutes total):
  - 0-5 min: Introduction. Explain the setup: "You are delegates from the four prosecuting powers meeting in London in the summer of 1945 to draft the charter for an international military tribunal. Your task is to agree on definitions of crimes and a clause on superior orders. Unanimity is required. Each delegation has a brief and a sealed file with sensitive information. You have 15 minutes to prepare in your groups, then we will begin negotiations."
  - 5-20 min: Delegation preparation. Groups read their brief and open the sealed file. They discuss their priorities and red lines.
  - 20-45 min: Round 1 negotiation. Delegations mingle and negotiate. The instructor circulates to answer procedural questions.
  - 45-65 min: Round 2 negotiation. Delegations finalize the draft. They should write their agreed definitions on the template.
  - 65-70 min: Ratification. Delegations sign the charter (if they agree) or declare their objections.
  - 70-90 min: Debriefing.

  Debriefing Outline (20 minutes):
  1. What happened? What was the outcome? (5 min)
  2. Map to the real London Charter:
     - Crimes Against Peace: How did they define it? Compare to the real one (based on the 1928 Kellogg-Briand Pact). Note: the real charter defined it as "planning, preparation, initiation or waging of a war of aggression, or a war in violation of international treaties..." and the retroactivity problem was acute.
     - Crimes Against Humanity: The real charter required a connection to the war (to protect colonial powers and the Soviets). How did the groups handle it? Why?
     - Superior Orders: Real charter allowed it as mitigation but not a defense. How did the groups decide?
     - Tu quoque: The defense of "you did it too" was not allowed at Nuremberg, but how did it influence the negotiations? (The sealed files represented potential tu quoque material.)
  3. Tokyo Trials: Same charter principles applied but with different judges. The same objections (retroactivity, vagueness) were raised.
  4. Legitimacy: The General Assembly affirmed the principles in 1946, and they were later codified in treaties (e.g., the Genocide Convention, the Geneva Conventions). The verdicts themselves were controversial, but the principles gained acceptance over time.

  Predictable Problems and Solutions:
  1. Anachronism / Reaching for the Rome Statute: 
     - Solution: At the start, remind them that they are in 1945. They do not have the benefit of later developments. If a group uses modern concepts, ask: "Was that concept established in 1945?" and encourage them to think about what was available at the time (e.g., the Kellogg-Briand Pact for crimes against peace, the Hague Conventions for war crimes).

  2. One delegation dominating:
     - Solution: Assign roles within delegations (e.g., head delegate, legal advisor, note-taker) to distribute participation. Remind them that unanimity is required, so even a small delegation can block. Encourage quieter members by asking direct questions during preparation.

  3. Not achieving agreement:
     - This is acceptable. The real process almost broke down several times. In the debrief, discuss why agreement was difficult and how the real negotiators overcame it (by vagueness and compromise).

  4. Hypocrisy focus:
     - The design should make hypocrisy a tool for negotiation (via the sealed files) rather than a topic of discussion. By tying each delegation's concerns to their own sensitive issues, the activity channels the hypocrisy into the drafting process. The requirement of unanimity forces them to find language that avoids implicating themselves.

  Feature that cannot be reproduced:
  - The real negotiators had the pressure of impending trials and the need to act quickly. The exercise cannot fully replicate the historical urgency and the political stakes of the immediate post-war period. The instructor may need to emphasize the time pressure during the negotiation rounds.

  Confidence and Least Sure Design Feature:
  - Confidence: Moderately high that the activity will produce the desired discovery (vagueness as a necessary mechanism) because the sealed files and unanimity requirement create a clear incentive for ambiguity. The debriefing then makes the connection explicit.
  - Least sure feature: The sealed files. There is a risk that a delegation might not take their sensitive issue seriously or might disclose it too freely, breaking the dynamic. Emphasize the confidentiality of the sealed file and the strategic need to avoid exposure.

  Final note: The activity is designed to make the participants experience the trade-offs, so even if they produce a clear code, they will have had to confront the reasons why that might not have been possible in 1945. The debriefing will then contrast their product with the actual charter.
answer: |-
  ### Session Design: Drafting the London Charter Simulation  
  **Goal:** Participants experience the necessity of vagueness in achieving four-power consensus, confronting retroactivity and self-implication.  

  ---

  #### **Structure & Timeline (90 Minutes)**  
  1. **Introduction (5 min)**  
     - *Instructor Script:* "You are legal delegates at the 1945 London Conference. Your task: Draft a charter defining crimes and the superior orders defense. Unanimity is required. Each delegation has a confidential brief and a sealed file. Do not share your file’s contents unless strategically necessary. We start in 1945—no anachronistic references to modern law."  
     - **Key Rule:** Unanimity is non-negotiable. No agreement = no trial.  

  2. **Delegation Prep (15 min)**  
     - Groups read their brief and **secretly open their sealed file**. They must:  
       - Identify red lines (e.g., "Our actions in File X must not be criminalized").  
       - Draft initial proposals for crimes and superior orders.  

  3. **Negotiation Rounds (45 min)**  
     - **Round 1: Defining Crimes (25 min)**  
       - Delegations debate Articles 1–3 (see *Drafting Template*).  
       - *Instructor Circulates:* Redirect anachronistic arguments ("The Rome Statute doesn’t exist yet—what existed in 1945?").  
     - **Round 2: Superior Orders & Trade-offs (20 min)**  
       - Groups finalize Article 4 (superior orders) and resolve ambiguities.  
       - *Pressure:* Announce, "You have 10 minutes; the war’s aftermath demands urgency."  

  4. **Ratification (5 min)**  
     - Delegations sign the charter if they agree. **Unanimity required.** If vetoed, the charter fails.  

  5. **Debrief (20 min)**  
     - Map outcomes to history (see *Debrief Script* below).  

  ---

  #### **Delegation Briefs & Sealed Files**  
  *Assign: USA (4), UK (4), USSR (4), France (4).*  
  **Rules:** Sealed files are confidential. Delegations may hint at their contents to negotiate but risk exposure.  

  1. **USA Brief**  
     - *Priorities:* Push for "Crimes Against Peace" (justify trying Nazis for aggression) and reject superior orders defenses.  
     - *Red Line:* Avoid criminalizing strategic bombing.  
     - **Sealed File:** "**Operation Gomorrah (1943):** US/UK firebombing of Hamburg killed 42,000 civilians. A broad definition of ‘war crimes’ could implicate Allied commanders."  

  2. **UK Brief**  
     - *Priorities:* Focus on traditional war crimes (e.g., POW abuse). Limit "Crimes Against Humanity" to wartime.  
     - *Red Line:* Shield colonial practices from prosecution.  
     - **Sealed File:** "**Bengal Famine (1943):** British policies exacerbated famine causing 3M deaths. A crime against humanity *not* tied to war could implicate UK colonial administration."  

  3. **USSR Brief**  
     - *Priorities:* Broad "Crimes Against Humanity" covering pre-war acts (e.g., Holocaust). Reject superior orders defense.  
     - *Red Line:* Prevent scrutiny of Soviet annexations or prisoner treatment.  
     - **Sealed File:** "**Katyn Massacre (1940):** USSR executed 22,000 Polish POWs. Any rule binding occupiers *before* 1939 risks exposing this."  

  4. **France Brief**  
     - *Priorities:* Strong "war crimes" definition. Link crimes against humanity to war to protect sovereignty.  
     - *Red Line:* Avoid criminalizing colonial repression.  
     - **Sealed File:** "**Sétif Massacre (May 1945):** French forces killed 6,000–45,000 Algerians suppressing protests. A crime against humanity *without* war-nexus could implicate France."  

  ---

  #### **Drafting Template**  
  *Distribute this worksheet. Unanimity needed for each article.*  
  ```markdown
  # LONDON CHARTER DRAFT  
  ## ARTICLE 1: CRIMES AGAINST PEACE  
  [Define "aggressive war" retroactively. Based on 1928 Kellogg-Briand Pact?]  

  ## ARTICLE 2: WAR CRIMES  
  [Violations of laws/customs of war (e.g., mistreatment of POWs, civilians).]  

  ## ARTICLE 3: CRIMES AGAINST HUMANITY  
  [Atrocities against civilians. Key issue: Must it link to war? Include pre-war acts?]  

  ## ARTICLE 4: SUPERIOR ORDERS  
  [Is this a full defense, mitigation, or no defense?]  
  ```  

  #### **Ratification Procedure**  
  - Delegations sign only if consensus reached.  
  - *Instructor Role:* Declare failure if unanimity fails. No arbitration.  

  ---

  ### **Debrief Script (20 min)**  
  **Connect simulation to history:**  
  1. **Retroactivity & Crimes Against Peace:**  
     - *Real Outcome:* Defined as "waging aggressive war" based on Kellogg-Briand (1928). Vagueness allowed prosecution but exposed retroactivity.  
     - *Ask:* "How did your definition handle retroactivity? Did ambiguity feel necessary?"  

  2. **Tu Quoque & Sealed Files:**  
     - *Real Outcome:* Tu quoque defenses banned at Nuremberg, but Allies’ files (bombing, colonies) forced ambiguous drafting to avoid hypocrisy.  
     - *Ask:* "How did your sealed file shape your red lines? Did anyone risk exposure?"  

  3. **Crimes Against Humanity & War Nexus:**  
     - *Real Outcome:* Required connection to war to protect colonial powers (UK/France) and USSR (Katyn). Tokyo Trials later struggled with the same issue.  
     - *Ask:* "Why did you tie Article 3 to war? Whose interests did that serve?"  

  4. **Legitimacy via Codification:**  
     - *Real Outcome:* Nuremberg’s legitimacy came from the UN affirming its principles (1947), not the verdicts. Vagueness allowed later refinement (e.g., Genocide Convention).  
     - *Ask:* "Would your charter survive peacetime scrutiny? How might history judge it?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Anachronism (e.g., Rome Statute):**  
     - *Solution:* Intervene early: "In 1945, the Geneva Conventions are unfinished, and ‘genocide’ isn’t a legal term. Ground proposals in Kellogg-Briand or Hague Conventions."  

  2. **Dominant Delegation:**  
     - *Solution:* Give smaller delegations (e.g., France) tactical power: "France, you’re hosting—use procedural delays to force compromises."  

  3. **Hypocrisy Debate Overwhelming Negotiation:**  
     - *Solution:* Design prevents this by making hypocrisy a tactical tool (via sealed files) not a moral debate. If erupts, refocus: "Your state’s priority is avoiding liability—what wording achieves that?"  

  4. **Vagueness Feels Like Failure:**  
     - *Solution:* In debrief, contrast their draft with the actual Charter’s ambiguity (e.g., "crimes against peace" left undefined) and note: "Vagueness was the *price* of four-power buy-in."  

  ---

  ### **Limitations & Instructor’s Role**  
  - **What the Activity Can’t Replicate:** The Allies’ *shared desperation* to punish Nazism. This overpowered retroactivity concerns historically.  
     - *Instructor Supplies This:* In debrief, note: "The Allies prioritized symbolic justice over legal purity. Would your group have compromised if 12 million were dead?"  
  - **Least Confident Design Feature:** The **sealed files**. Risk: Students may ignore them to "do the right thing." Mitigation: Emphasize in briefs: "Your delegation will face consequences if exposed."  
  - **Confidence in Avoiding Morality Play:** **High** (85%). The unanimity requirement and self-protective sealed files make vagueness a strategic imperative, not moral failure.  

  **Final Prep Tip:** Assign assertive students as delegation heads. Their struggle to reconcile ideals with state interests will mirror the 1945 tensions.
