prompt: |-
  I'm prepping a session on Turing for a small reading group — mixed bag, two CS grad students, a historian of education, three philosophers — and I've got stuck on one sentence. It's from Turing's 1948 report on intelligent machinery, the one he wrote at the National Physical Laboratory, and it goes: "A man provided with paper, pencil, and rubber, and subject to strict discipline, is in effect a universal machine." I have that sentence in front of me, but I don't have the rest of the report handy and I'm definately going on memory for everything around it. So don't tell me what the rest of the report says as if you're reading it off the page — if you think the surrounding discussion matters for the sentence, say what you'd expect it to contain and why that would matter.

  What I remember of the context: in that report Turing is interested in machines that start out unorganised and get organised through something like education — training by reward and punishment, some kind of pleasure and pain arrangement — and he compares the whole business to the way a child's mind gets organised by experience. I also half-remember him treating discipline and initiative as two opposed things governing a machine's behaviour, with intelligence needing some of both: a machine that only follows rules is just a calculator, and a machine with no rules at all is useless. Then in the 1950 Mind paper there's the better known suggestion that instead of programming an adult mind you'd do better to build something like a child's mind and then educate it. I'm not asking you to quote any of that back at me; I know I'm fuzzy on the details.

  My problem is that these two pictures of education seem to pull in opposite directions, and the quoted sentence is where I feel it most. In the sentence, discipline is what turns a person into a machine: take a human being, subject them to strict discipline, and what's left is a universal machine, something whose behaviour is fully mechanical, of the same kind as any computing machine. But in the child-machine picture, education is what gets you out of the merely mechanical — the thing starts out as less than a computer and education is what makes it intelligent. So is education in Turing's thinking the thing that mechanises or the thing that de-mechanises? And does the discipline/initiative pairing actually resolve this, or does it just rename the problem?

  What I'd like from you:

  - A careful unpacking of the sentence itself, including what work each part is doing. Why "strict discipline"? Why "in effect" rather than "is"? And what "universal machine" is doing there — I take it that's a technical notion about being able to simulate any machine, and I want to know whether that technical reading survives in this context or whether it's just loose talk for being mechanical.
  - At least two readings of the sentence, and what would decide between them. E.g. one where it's a claim about what a human can be made to do — a recipe, or an observation about clerks and computers — and one where it's a claim about what a human already is underneath the noise.
  - Your best attempt at reconciling the sentence with the child-machine idea. Then the strongest case that no reconciliation is needed, maybe because the two are about different things: what a human can be reduced to vs. what a machine can be grown into, so the apparent conflict is me conflating two directions of education.
  - If you think the reconciliation fails, say exactly where, and what Turing would have to give up to keep both.
  - A short note on what the sentence can't be made to say. I don't want a reading that turns it into a claim about the dignity of labour or about education as oppression unless you think the text really supports that.

  No citations needed, I'll chase those myself. Just give me the readings and the reasoning. And be concrete — I'd rather have one worked-out example, say a room of human computers doing arithmetic by hand under rules, than a survey of what commentators say.
