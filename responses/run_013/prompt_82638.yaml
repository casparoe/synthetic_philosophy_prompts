  ### The Father's Demonstration
  The father sets down his cup, takes an envelope, and writes as he speaks:

  "Let’s define the lotteries clearly:  
  - **A**: £1,000 for sure. (Your first choice, over the lottery I called B.)  
  - **B**: 50% chance of £1,000, 25% of £4,000, 25% of nothing. (The lottery you rejected in the first choice.)  
  - **C**: 50% chance of £1,000, 50% of nothing. (The lottery you rejected in the second choice.)  
  - **D**: 25% chance of £4,000, 75% of nothing. (The lottery you preferred in the second choice.)  

  Now, I’ll introduce a new lottery for clarity:  
  - **E**: 50% chance of £4,000, 50% of nothing.  

  Observe that **B** can be expressed as a mixture of **A** and **E**:  
  - **B** = 0.5 × **A** + 0.5 × **E**.  
  Why? Half the time, you get **A** (£1,000 guaranteed), and half the time, you get **E** (a 50/50 gamble on £4,000 or nothing). That yields:  
    - 50% × £1,000 = £1,000 (from **A**),  
    - 50% × 50% = 25% chance of £4,000 (from **E**),  
    - 50% × 50% = 25% chance of nothing (from **E**).  
  This matches **B** exactly.  

  Next, look at **C** and **D**:  
  - **C** = 0.5 × **A** + 0.5 × **P0**, where **P0** is 'nothing for sure'.  
    - Half **A** (£1,000) and half **P0** (nothing) gives 50% chance of £1,000, 50% of nothing.  
  - **D** = 0.5 × **E** + 0.5 × **P0**.  
    - Half **E** (50/50 on £4,000/nothing) and half **P0** (nothing) gives 25% chance of £4,000, 75% of nothing.  

  You chose **A** > **B** (preferring **A** over **B**) and **D** > **C** (preferring **D** over **C**). The independence axiom says that if two lotteries are mixed with the same third lottery identically, your preference should hold. Let’s apply it:  
