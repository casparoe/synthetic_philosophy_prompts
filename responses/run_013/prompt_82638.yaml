     0.5 × **E** + 0.5 × **P0** > 0.5 × **A** + 0.5 × **P0**.  
     By the independence axiom, this implies **E** > **A**. (If adding the same **P0** doesn’t change your ranking, you must prefer **E** to **A** outright.)  
  2. Now, since **E** > **A**, consider mixing both with **A** using a 50/50 chance:  
     - 0.5 × **E** + 0.5 × **A** should be preferred to 0.5 × **A** + 0.5 × **A** (which is just **A**).  
     But 0.5 × **E** + 0.5 × **A** is identical to **B** (as we defined earlier).  
     So **B** > **A**.  
  3. Yet you told me **A** > **B**.  

  This is a contradiction: you cannot simultaneously prefer **A** to **B** and **B** to **A**. It’s like a number being both even and odd. Your answers violate the independence axiom, which requires consistency in how you evaluate risk when lotteries are combined."

  ### The Daughter's Rebuttal
  The daughter, sharp and unflinching, counters:  
  "Your axiom assumes I value probabilities linearly, but I don’t. In the first choice, I rejected **B** because the 25% chance of nothing felt worse than the certainty of £1,000—I’m averse to disappointment. In the second choice, both options risked nothing, so I chased the higher reward (£4,000), even with slightly lower odds. The ‘contradiction’ comes from your model, not my reasoning. Expected utility theory can’t capture how real people weigh certainty against opportunity. Your axiom is a straitjacket—I refuse to wear it."

  ### Why This Works for Your Scene
  - **The argument is valid**: The demonstration shows a true inconsistency under the independence axiom, making the father’s case solid. The steps are logical, concise, and mirror real decision-theory paradoxes (e.g., Allais). The daughter isn’t "wrong" in a vacuum—she’s violating a specific, normative rule.
  - **Authentic disagreement**: The daughter’s rebuttal reflects legitimate critiques of expected utility theory. Psychologically, people often overweight certainty (first choice) and chase high stakes when all options are risky (second choice). This realism adds depth—their clash isn’t about math errors but competing philosophies of risk.
  - **No cheating**: The father isn’t misrepresenting the math. If he were, the daughter would (and should) call it out. Here, she challenges the axiom’s relevance, preserving tension without undermining his integrity.
  - **Flexibility**: Use the envelope sketch as a visual prop. The father can write key equations (e.g., **B** = 0.5**A** + 0.5**E**), making the proof tangible. The daughter’s reply can be delivered with wit, showing her intellectual independence.

  This approach gives you a compelling scene: the father lands a logical blow, but the daughter exposes the axiom’s limitations, leaving both with dignity. If you alter the choices, the contradiction might vanish—so keep the lotteries as written. For added realism, research the Allais paradox; it’s the father’s intellectual anchor here.
