prompt: |-
  I've spent a long time in the rationalist blogosphere — Sequences-era LessWrong, the decision-theory wars, all of it — and I've recently landed in a graduate seminar on archaeological inference, where a slogan keeps getting deployed in ways that I suspect nobody has actually cashed out: "absence of evidence is not evidence of absence." I want a full disambiguation before the next meeting.

  Here's the episode. A classmate argued that because the excavated sample from a particular settlement contains no trace of some practice — I'm keeping the details generic, since the same pattern recurs across cases — the practice probably didn't exist there. The professor replied with the slogan and moved on. Later in the same session, another student defended a different claim by asserting that absence of evidence is evidence of absence. Both statements got nods. I've internalized enough Bayesian machinery to be suspicious of that pair of nods, but I don't trust myself to say exactly where the sleight of hand is, because in some framings the professor is obviously right and in others the classmate is.

  Act as a philosopher of science with genuine expertise in Bayesian confirmation theory and in the epistemology of archaeology — specifically the inference from taphonomy, preservation bias, sampling design, and formation processes to claims about past beliefs and institutions. Think carefully and work in stages: first brainstorm, listing every distinct reading of the slogan you can generate, including the bad ones; only then organize and evaluate. Don't stop at two or three readings.

  What I want back:

  1. A menu of precise claims. For each reading, state what it commits you to in terms of probabilities, quantifiers, and scope — whether it is a claim about likelihoods, about the possibility of proof, about the evidence-gathering procedure, or about what a community should believe. Mark each as trivially true, substantive and defensible, false, or ambiguous-but-repairable. Then say which reading the professor almost certainly meant, and whether that reading actually licenses dismissing the classmate.
  2. The mirror slogan, read the same way, plus a verdict on which readings of the two are genuine contraries and which turn out to be compatible.
  3. How 'you can't prove a negative' fits in: the same claim, a corollary, or something else entirely.
  4. An assessment of a distinction I've been groping toward — record-absence versus world-absence, where the first is a fact about what the excavation and its detection profile could have turned up and the second is a fact about the past. Tell me whether that's the right cut, how you would sharpen it, and what the analogue of a detection profile is when the evidence is texts or standing architecture rather than bones and lithics.
  5. A short list of diagnostic questions I can ask in the moment — the ones that would force whoever deploys the slogan to commit to a reading rather than retreating into vagueness.

  No citations or reading lists, please; I'm after the argument, not the literature, and I would rather you reconstruct it from first principles than gesture at authorities. Write in American English, and flag anywhere you're genuinely unsure rather than papering over it.
reasoning: |-
  We are going to break down the slogan "absence of evidence is not evidence of absence" (AE is not EoA) and its mirror "absence of evidence is evidence of absence" (AE is EoA). We'll consider multiple readings, evaluate them, and then address the other points.

  ### Step 1: Brainstorming Readings of the Slogan

  Let E be the evidence we have (which includes the absence of a particular trace in the excavated sample). Let H be the hypothesis that the practice existed at the settlement. We are interested in P(H|E) and how it relates to P(H) or to the likelihoods.

  We can think of the absence of evidence as the event that we did not find the trace (which we might denote as ~D, for "not detected"). The hypothesis of absence is ~H.

  Readings:

  1. **Reading 1 (Trivial Likelihood):** 
     - Claim: The absence of evidence does not make the hypothesis of absence certain. That is, P(~H | ~D) < 1.
     - Evaluation: Trivially true. We can never be absolutely sure of absence based on non-detection because there could be preservation or sampling issues.

  2. **Reading 2 (No Change in Probability):**
     - Claim: The absence of evidence does not change the probability of the hypothesis of absence. That is, P(~H | ~D) = P(~H).
     - Evaluation: This is false in general. In Bayesian terms, if the likelihood of not detecting the trace under ~H is higher than under H (i.e., P(~D | ~H) > P(~D | H)), then ~D should increase the probability of ~H. However, if P(~D | H) = P(~D | ~H), then indeed it doesn't change. But typically, if the practice existed, we would expect a higher chance of finding evidence, so P(~D | H) < P(~D | ~H). Thus, absence of evidence (if we expected evidence under H) should be evidence for ~H.

  3. **Reading 3 (Evidence of Absence is Impossible):**
     - Claim: It is impossible for the absence of evidence to ever be evidence of absence.
     - Evaluation: False. As in Reading 2, if the detection process is such that the absence is more likely when the practice is absent, then it is evidence of absence.

  4. **Reading 4 (Not Necessarily Proof):**
     - Claim: Absence of evidence does not prove absence. (Similar to Reading 1 but about proof rather than evidence.)
     - Evaluation: Trivially true. Proof in the sense of absolute certainty is almost never achieved in empirical matters.

  5. **Reading 5 (Contextual Dependence):**
     - Claim: Whether absence of evidence is evidence of absence depends on the context, particularly on the expectedness of evidence if the practice were present and the quality of the search.
     - Evaluation: Substantive and defensible. This is the core Bayesian point: the evidential meaning of non-detection depends on the likelihoods and priors.

  6. **Reading 6 (About the Quality of the Search):**
     - Claim: If the search was not sufficiently thorough, then absence of evidence is not evidence of absence. But if the search was thorough, it is.
     - Evaluation: Substantive and defensible. This is a special case of Reading 5. The "thoroughness" can be thought of as the probability of detecting the practice if it exists (P(D|H)). If that probability is low, then non-detection is weak evidence. If it is high, then non-detection is strong evidence.

  7. **Reading 7 (Not Evidence in this Specific Case):**
     - Claim: In the particular case at hand, the absence of evidence is not evidence of absence because of specific factors (e.g., poor preservation, small sample, etc.).
     - Evaluation: This is a case-specific claim and may be true or false depending on the details.

  8. **Reading 8 (Epistemic Community):**
     - Claim: The community should not update their beliefs toward absence based solely on absence of evidence in this context.
     - Evaluation: This is a normative claim about what the community should believe. It might be defensible if the community has background knowledge that the evidence is unlikely to be preserved even if the practice existed.

  9. **Reading 9 (Methodological Caution):**
     - Claim: We should be cautious in interpreting absence of evidence as evidence of absence because of common pitfalls (like preservation bias).
     - Evaluation: Substantive and defensible as a methodological principle.

  10. **Reading 10 (Quantifier Ambiguity):**
      - Claim: There exists some case where absence of evidence is not evidence of absence. (This is trivially true because we can imagine a case where the search was terrible, so non-detection is uninformative.) 
      - But the slogan is often used as a universal: In all cases, absence of evidence is not evidence of absence. That is false.

  Now, which reading did the professor likely mean? Given the context of archaeology (with taphonomy, preservation bias, etc.), the professor probably meant Reading 6 or 9: that because the search might not have been thorough (due to preservation, sampling, etc.), the absence of evidence in this case is not (strong) evidence of absence. Alternatively, it might be Reading 5: it depends, but in this context, it's not. 

  Did this license dismissing the classmate? Only if the professor had reason to believe that in this specific case the search was not thorough enough. Without knowing the details, we cannot be sure. The classmate might have overlooked the taphonomic factors.

  ### Step 2: The Mirror Slogan - "Absence of evidence is evidence of absence"

  We can similarly break this down:

  1. **Reading M1 (Trivial):** Absence of evidence can sometimes be evidence of absence. (True, as we saw in Reading 2 and 3 above.)
  2. **Reading M2 (Always):** Absence of evidence is always evidence of absence. (False: if the evidence is unlikely to be found even if the practice existed, then non-detection may not be evidence of absence. Example: searching for a needle in a haystack with a magnet that isn't strong enough. Not finding it doesn't mean it's not there.)
  3. **Reading M3 (In this case):** In this specific case, the absence of evidence is evidence of absence. (This might be true if the search was thorough.)

  Which readings are contraries? The professor's slogan (in its universal reading) is contrary to M2 (the mirror universal). But if we take the professor's slogan as Reading 6 (contextual), then it is compatible with M1 and M3. 

  In fact, the two slogans are not logical contraries in their most defensible readings. The defensible position is that sometimes AE is EoA and sometimes it isn't, depending on the context.

  ### Step 3: How 'you can't prove a negative' fits in

  This is a related but distinct claim. It says that it is impossible to prove the non-existence of something (a negative claim). 

  - It is a corollary of Reading 1 and 4: absence of evidence doesn't prove absence (because we can't be 100% sure). 
  - But note: we can have very strong evidence of absence (e.g., we searched the entire settlement with a method that would have detected the practice if it existed, and found nothing). So while we might not get absolute proof (in the sense of 100% certainty), we can get very high probability. 

  The claim "you can't prove a negative" is often used to discourage attempts to prove non-existence. However, in science and archaeology, we often do have strong evidence for absence (e.g., we know there were no nuclear reactors in ancient Rome). So the claim is false if by "prove" we mean "provide strong evidence". But if we mean "absolute proof", then it's true but trivial.

  ### Step 4: Record-Absence vs. World-Absence

  This is a useful distinction:

  - **World-absence:** The practice did not exist in the past (the objective fact about the past).
  - **Record-absence:** The absence of the practice in the excavated record (which is a product of both world-absence and the detection profile).

  The detection profile includes:
  - **Sampling design:** Which parts of the site were excavated?
  - **Taphonomy:** What processes might have destroyed the evidence?
  - **Detection methods:** How sensitive are our instruments? Did we look for the right things?

  The key point: record-absence is only evidence of world-absence if we have a good model of the detection profile. Specifically, we need to know the probability of record-absence given world-absence versus given world-presence. 

  For texts or standing architecture:
  - **Texts:** The detection profile includes the preservation of texts, the sampling of texts (which ones survived), and the ability to interpret them. For example, if a practice is not mentioned in any text, that might be because it didn't exist, or because it was not considered worth recording, or because those records were lost.
  - **Standing architecture:** The detection profile includes the survival of the architecture, the excavation methods (if buried), and the ability to recognize the practice in the remains. For example, the absence of a particular architectural feature in the remains might be due to world-absence, or due to destruction by later rebuilding.

  ### Step 5: Diagnostic Questions

  To force a commitment:

  1. **Question about the search:** "How likely is it that we would have found evidence of the practice if it had existed? Can you quantify that probability?"
  2. **Question about the baseline:** "What is the prior probability that the practice existed here, independent of this excavation?"
  3. **Question about the likelihood ratio:** "Is the absence we observed more probable under the hypothesis that the practice was absent than under the hypothesis that it was present? By how much?"
  4. **Question about taphonomy:** "What are the chances that evidence of this practice would have been preserved and found in our excavation if it had existed?"
  5. **Question about the universal claim:** "Are you saying that absence of evidence can never be evidence of absence, or just that in this case it isn't?"

  ### Summary of Key Points

  - The professor likely meant that in this specific archaeological context, due to preservation and sampling issues, the absence of evidence is not (strong) evidence of absence. This is defensible if the detection probability was low.
  - However, the classmate's argument that the absence makes the practice's non-existence more probable might be correct if the detection probability was high. Without knowing the details, the professor's dismissal might have been too quick.
  - The two slogans are not absolute; they depend on the context. The mirror slogan can be true in some contexts.
  - The distinction between record-absence and world-absence is crucial and is mediated by the detection profile.

  In the next meeting, you might ask: "Professor, I understand the caution about preservation, but under what conditions would you say that the absence of evidence does become evidence of absence? For instance, if we had excavated the entire site and had a near-perfect preservation environment, would that change your view?"
answer: |-
  ### Disambiguation of "Absence of Evidence is Not Evidence of Absence"  

  #### 1. Menu of Precise Claims  
  I categorize readings by their core commitments (probabilities, quantifiers, scope) and evaluate them. The professor likely meant **Reading 5** (context-dependent likelihood), which *does* license dismissing the classmate *if* preservation/sampling issues are severe. If not, the classmate's Bayesian update may be valid.  

  | # | Reading (Precise Claim) | Probabilistic/Quantifier Commitments | Scope | Evaluation |  
  |:-:|--------------------------|--------------------------------------|-------|------------|  
  | 1 | **Trivial Certainty**: Absence of evidence (~E) cannot prove absence (~H) with absolute certainty. | P(~H \| ~E) < 1. Quantifier: Universal (all cases). | Epistemic (proof) | Trivially true. Fails to address probabilistic evidence. |  
  | 2 | **No Probabilistic Impact**: ~E never changes the probability of ~H. | P(~H \| ~E) = P(~H). Quantifier: Universal. | Bayesian update | False. Ignores likelihood ratios; counterexample: a thorough search. |  
  | 3 | **Impossibility**: ~E can never be evidence for ~H under any circumstances. | P(~E \| H) is undefined or irrelevant; ~E never supports ~H. Quantifier: Universal. | Evidence relation | False. Conflicts with Bayes' theorem; if P(~E \| H) is low, ~E supports ~H. |  
  | 4 | **Possible Proof Denial**: ~E cannot *conclusively prove* ~H, but it might support it. | P(~H \| ~E) ≈ 1 is unattainable. Quantifier: Universal. | Epistemic (proof) | Trivially true but irrelevant; archaeology deals in probabilities, not proof. |  
  | 5 | **Context-Dependent Likelihood**: ~E is not evidence for ~H *in this specific case* due to low evidential sensitivity (e.g., taphonomic bias). | P(~E \| H) is high (evidence likely missing even if H true). Quantifier: Existential (this case). | Likelihoods (case-specific) | Substantive and defensible. Core archaeological caution; depends on P(~E \| H). |  
  | 6 | **Prior Dominance**: ~E is irrelevant if prior for H is high; it cannot lower P(H). | P(H \| ~E) ≈ P(H) if P(H) is near 1. Quantifier: Contextual. | Bayesian update | Ambiguous-but-repairable. True if priors swamp evidence; false if likelihoods dominate. |  
  | 7 | **Methodological Warning**: We should not treat ~E as evidence for ~H without quantifying detection failures. | Requires modeling P(~E \| H) and P(~E \| ~H). Quantifier: Normative (how to infer). | Evidence-gathering procedure | Substantive and defensible. Embodies best practices in archaeology. |  
  | 8 | **Community Threshold**: ~E should not shift community belief toward ~H until detection capabilities are validated. | P(~H) must exceed a threshold before ~E is actionable. Quantifier: Normative (social epistemology). | Community belief | Ambiguous-but-repairable. Defensible if peer review requires robustness; else dogmatic. |  
  | 9 | **Asymmetry Claim**: Only positive evidence (E) can support H; ~E can only refute H or do nothing. | P(H \| E) > P(H), but P(H \| ~E) ≤ P(H). Quantifier: Universal. | Confirmation theory | False. Bayes allows P(H \| ~E) < P(H) (refuting H) *or* P(~H \| ~E) > P(~H) (supporting ~H). |  
  | 10 | **Quantifier Flip (Existential)**: There exists *some* scenario where ~E is not evidence of ~H (e.g., poor search). | ∃ cases: P(~H \| ~E) = P(~H). Quantifier: Existential. | Likelihoods | Trivially true. Unhelpful; most archaeological cases are debated due to uncertainty. |  
  | 11 | **Quantifier Flip (Universal)**: In *all* cases, ~E is not evidence of ~H. | ∀ cases: P(~H \| ~E) = P(~H). Quantifier: Universal. | Evidence relation | False. Contradicted by Bayesian reasoning (e.g., if P(~E \| H) = 0.1 and P(~E \| ~H) = 0.9, ~E supports ~H). |  

  - **Professor's Likely Meaning**: Reading 5 (context-dependent likelihood). They imply that in this case, taphonomy/sampling made P(~E \| H) high, so ~E shouldn’t update us toward ~H.  
  - **Does It License Dismissing the Classmate?**: Yes, *if* the professor’s unstated premise (that P(~E \| H) is high) is correct. If the classmate assumed P(~E \| H) is low (e.g., a thorough search), the professor’s dismissal is premature.  

  #### 2. Mirror Slogan: "Absence of Evidence *is* Evidence of Absence"  
  Same readings applied to the mirror slogan:  

  | # | Mirror Reading | Evaluation | Compatibility with Professor's Slogan |  
  |:-:|----------------|------------|----------------------------------------|  
  | M1 | ~E proves ~H (absolutely). | False (same as Reading 1). | Contrary to all readings. |  
  | M2 | ~E always lowers P(H). | False (same as Reading 2). | Contrary to Readings 2, 5, 8, 11. |  
  | M3 | ~E is sometimes evidence for ~H (e.g., after a sensitive search). | Substantive and defensible (Bayesian core). | **Compatible** with Readings 5, 7, 10. Not contrary if professor’s claim is case-specific. |  
  | M4 | ~E is evidence for ~H in this specific case (due to high search sensitivity). | Substantive and defensible if P(~E \| H) is low. | **Contrary** to professor’s Reading 5 if they assert P(~E \| H) is high. |  

  - **Genuine Contraries**: When both are universal (e.g., Reading 11 vs. M2) or case-specific but incompatible (e.g., professor’s Reading 5 vs. M4).  
  - **Compatible Readings**: Professor’s Reading 5 (contextual) and M3 (existential) can coexist: "~E is sometimes evidence of absence, but not here due to taphonomy."  

  #### 3. "You Can't Prove a Negative"  
  - **Relationship**: A corollary of **Reading 1** (trivial certainty). It claims absolute proof of ~H is impossible, which is trivially true but distinct from evidence.  
  - **Distinction**: Proof (P(~H) = 1) ≠ evidence (P(~H \| ~E) > P(~H)). The slogan conflates:  
    - *Evidence for absence*: Probabilistic support (Bayesian).  
    - *Proof of absence*: Certainty (unattainable empirically).  
  - **Archaeological Relevance**: Useless as stated. Archaeologists don’t seek "proof"; they weigh evidence. Repaired: "You can't prove a negative with certainty, but absence of evidence can strongly support it."  

  #### 4. Record-Absence vs. World-Absence  
  - **Your Distinction**:  
    - **World-absence**: The practice did not exist in the past (~H).  
    - **Record-absence**: The practice is absent from the observed evidence (~E).  
  - **Sharpening the Cut**:  
    - **Key Mediator**: The **detection profile**—the process generating E from H, including:  
      - Taphonomy (preservation bias).  
      - Sampling design (where/when you dig).  
      - Analytical sensitivity (can your methods detect the practice if present?).  
    - **Bayesian Bridge**: ~E supports ~H iff the likelihood ratio favors it:  
      $$\frac{P(\sim E \mid \sim H)}{P(\sim E \mid H)} > 1 \quad \text{(i.e., record-absence is more likely under world-absence)}.$$  
      If taphonomy makes P(~E \| H) high, the ratio ≈1, and ~E is weak evidence.  
  - **Analogues for Other Evidence Types**:  
    - **Texts**: Detection profile = Preservation + Discursive bias + Decipherment reliability.  
      - *Example*: Absence of a practice in texts isn’t evidence of world-absence if scribes ignored it (high P(~E \| H)).  
    - **Standing Architecture**: Detection profile = Survival + Visibility + Interpretive framework.  
      - *Example*: Absence of a structure isn’t evidence of world-absence if later construction destroyed it.  
  - **Verdict**: Your cut is correct and fundamental. World-absence cannot be directly observed; record-absence is a taphonomy-filtered signal.  

  #### 5. Diagnostic Questions  
  Ask these to force clarity:  
  1. **"What is P(~E \| H) here?"**  
     - Forces quantification of detection failures. If they can’t answer, their slogan is ungrounded.  
  2. **"Under what conditions *would* absence be evidence of absence?"**  
     - Tests if they reject all evidence of absence (Readings 2, 3, 11) or accept it with sensitivity (M3, M4).  
  3. **"Is your claim about this case, or all cases?"**  
     - Exposes quantifier ambiguity (e.g., universal vs. existential).  
  4. **"How thorough was the search?"**  
     - Targets the detection profile. If low thoroughness, professor’s Reading 5 holds; if high, classmate’s M4 may apply.  
  5. **"Should we ever update toward absence based on absence?"**  
     - Challenges normative readings (e.g., Reading 8). If "no," they’re dogmatic; if "yes," they must specify when.  

  ### Final Summary  
  - **Slogan’s Core Truth**: Absence of evidence *is not necessarily* evidence of absence—it depends on the detection profile (P(~E \| H)). Archaeology’s taphonomic biases often make P(~E \| H) high, justifying the professor’s skepticism. But Bayes rules: with a sensitive search, absence *is* evidence of absence.  
  - **In Your Seminar**: The professor likely invoked taphonomy (Reading 5) to dismiss the classmate. If the excavation had high sensitivity (e.g., large sample, good preservation), the classmate may be right. Ask: "What justifies assuming P(~E \| H) is high here?"  
  - **Mirror Slogan**: They’re compatible when contextualized. Absence can support absence (M3/M4) without contradicting the professor if their claim is case-specific.  
  - **To Avoid Vagueness**: Demand likelihoods (Q1, Q4) and quantifiers (Q3). No one gets to hide behind the slogan without addressing the detection profile.
