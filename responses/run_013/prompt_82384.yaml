prompt: |-
  I want the specification on paper before I read another defense of any position. What would an adequate theory of material constitution — of the relation between a thing and the matter that constitutes it — have to deliver? Take the phenomenon to be explained as the ordinary one in which a lump of clay and the statue it makes appear to be a single thing in a single place and yet behave like two. Adequacy here is adequacy for a metaphysics that keeps ordinary object-talk largely true and contradicts no physics; if you think it should be relativized differently, say so and adjust. Write the desiderata, and attach to each the case or consideration that forces it. I do not want a list of slogans.

  The cases it must get right, each with a note on what it costs to get it wrong:

  - The squash. The lump survives flattening and the statue does not, although at the moment before the squash the two are microphysically indistinguishable. The theory must say what could ground a modal difference between things that differ in no physical respect, and whether that ground may be social or conventional rather than physical.
  - The counting. How many objects are on the pedestal, and whether the answer is sortal-relative or absolute. It must locate both our ordinary counting and the multiplication of objects that its own machinery licenses.
  - The many. A cat, and the many candidates that differ from it by a hair or a cell; the same problem in artifactal dress, a statue and the many things that differ from it by a chip. It must say whether the theory can leave the matter indeterminate, and whether it can do so uniformly in the two versions.
  - Reassembly and replacement. Parts dispersed and rejoined; matter replaced atom by atom with the form held fixed. The statue and the lump must come apart in the right places, and the theory must say what its verdicts require of its account of persistence.
  - Creation and destruction. Which events bring each thing into and out of being, and whether the statue's creation and the lump's creation may be the same event.
  - Truth and reference. Our claims about statues and their matter must come out true, or the theory must own an error theory and say why it is tolerable.

  Distinctions it may not collapse, and results it may not contradict: object versus matter; being a something versus existing; identity versus constitution; the artifact and the natural object, which are to receive the same treatment unless the asymmetry is earned; microphysical supervenience; Leibniz's Law, which forces any two distinct coincidents to differ in some respect and forces the theory to say what grounds that difference; and parsimony, which forbids coincidents that do no work.

  Two cases of my own, because I suspect they break the standard moves.

  First: one quantity of bronze is at once a statue, whose identity tracks its shape, and a counterweight, whose identity tracks its mass. Reshaping it destroys the statue and leaves the counterweight numerically the same. Say what there was before and after, and what the verdict costs the theory elsewhere — in particular, whether it can still treat the bronze as one thing.

  Second: a town's memorial. After vandalism the figure is recast from the same metal to the same design, and the original dedication plate is reattached. If the theory lets the memorial survive, it must say whether an artifact's identity can be grounded in an institutional fact rather than in matter or form, and must then explain why an ordinary recast statue is a new statue.

  Finally: which of these requirements are non-negotiable and which are the preferences of a camp; whether some subset is jointly unsatisfiable — my own suspicion is that the pressure lies in the combination of microphysical supervenience, the demand that every difference between distinct things be grounded, and the demand that ordinary counting survive — and, if so, which of the three is cheapest to abandon; and which single requirement excludes the most otherwise plausible theories. A closing paragraph on which structural options (identity, distinctness with constitution, eliminativism about artifacts, sortal-relative counting, four-dimensionalism) each requirement bears hardest on is welcome; a survey of who holds what is not.
reasoning: |-
  Okay, the user is asking for a detailed specification of what an adequate theory of material constitution must deliver. They've provided several cases and considerations that such a theory must address, along with distinctions it must maintain. They also want to know which requirements are non-negotiable and which might conflict.

  First, I need to parse the user's query carefully. They're clearly well-versed in metaphysics, particularly the debate around material constitution and coinciding objects. They mention cases like "The Squash," "The Counting," and others, each posing specific challenges. The user emphasizes avoiding slogans and wants concrete desiderata with the cases that necessitate them. 

  The user's unspoken needs might include a desire for clarity in a notoriously murky philosophical area. They might be frustrated with existing defenses that don't adequately address all cases. Their two additional cases (bronze counterweight/statue and the memorial) suggest they're testing for hidden weaknesses in standard theories. They also want to know where conflicts arise, especially between microphysical supervenience, grounded differences, and ordinary counting.

  Breaking down each requirement:

  1. **Modal Resilience (The Squash):** The theory must explain how two microphysically identical entities (lump and statue) have different modal properties (one survives flattening, the other doesn't). The cost of getting this wrong is either violating Leibniz's Law (if distinct but no difference) or denying the modal difference (which contradicts ordinary belief).

  2. **Counting Practices:** The theory must reconcile ordinary counting (one object on the pedestal) with ontological commitment to both lump and statue. If it says there's only one, it must explain away our talk of both; if two, it must explain why we count as one. Sortal-relativity might solve this but needs to address when it applies.

  3. **The Many Problem:** For any object, there are many slightly different candidates (e.g., a cat minus one hair). The theory must handle indeterminacy uniformly for natural and artificial objects. Denying indeterminacy leads to arbitrariness; accepting it might challenge classical logic.

  4. **Reassembly/Replacement:** The theory must explain how persistence conditions differ—lump survives reassembly, statue doesn't; statue might survive gradual replacement, lump might not. This ties to what changes destroy an object.

  5. **Creation/Destruction Events:** Must clarify if statue and lump creation are the same event. If distinct, what grounds the difference? If same, how do they have different persistence conditions?

  6. **Semantic Commitments:** Ordinary claims ("the statue is beautiful," "the clay is dirty") must be true or explained away. Error theories must justify why we're wrong but still useful.

  Key distinctions to maintain include object vs. matter, identity vs. constitution, and not privileging artifacts over natural objects without reason. Microphysical supervenience means no differences without physical differences; Leibniz's Law demands grounded differences for distinct objects; parsimony avoids unnecessary entities.

  The user's added cases:
  - **Bronze Counterweight/Statue:** Same matter serves two functions with different persistence conditions (shape vs. mass). Theory must say whether the bronze is one entity with multiple roles or multiple entities.
  - **Memorial Case:** Recasting after vandalism—survival via institutional facts vs. matter/form. Theory must explain why this differs from ordinary statues.

  Finally, the user wants to know which requirements conflict. The big tension is between microphysical supervenience (all differences grounded physically), Leibniz's Law (distinct things must differ), and ordinary counting (only one object pre-squash). Abandoning supervenience is costly for naturalists; denying distinct objects might require error theory; relaxing Leibniz's Law risks incoherence.

  Structural options:
  - **Identity Theory:** Collapses lump and statue, struggles with modal differences.
  - **Constitution w/distinctness:** Handles modals but multiplies entities and must ground differences.
  - **Eliminativism:** Rejects artifacts, simplifies but contradicts ordinary talk.
  - **Sortal-Relative Counting:** Contextual, may handle counting but struggles with absolute questions.
  - **Four-Dimensionalism:** Treats objects as spatiotemporal worms, handles change but may overcomplicate.

  The hardest requirements for each:
  - Modal resilience hurts identity theory.
  - Counting and parsimony hurt distinctness theories.
  - Semantic commitments hurt eliminativism.

  The user likely wants a theory that respects common sense without ontological excess, and they're probing where trade-offs are unavoidable. The memorial case tests if institutional facts can override matter/form, which might force a social ontology element. Overall, they seek a rigorous framework that doesn't dodge the toughest cases.
answer: |-
  Here is a specification of adequacy for a theory of material constitution, grounded in the cases and constraints you provided. Each desideratum is driven by a specific phenomenon or conceptual requirement, with explicit costs of failure. The requirements are non-sloganistic, tied to cases, and ranked by negotiability. Structural implications are addressed in the final analysis.

  ---

  ### **Core Desiderata (Forced by Cases)**
  1. **Modal Resilience Without Physical Difference**  
     - **Case:** *The Squash*. Pre-squash, lump and statue are microphysically indistinguishable. Post-squash, the lump survives (flattened clay), the statue does not.  
     - **Requirement:** The theory must ground the *modal difference* (lump can survive flattening, statue cannot) without physical divergence. It must specify whether this ground is physical (e.g., historical/relational properties), conventional (e.g., artifact function), or ontological (e.g., distinct persistence conditions).  
     - **Cost of Failure:** Violates **Leibniz’s Law** (if distinct coincidents lack a difference-making property) or **microphysical supervenience** (if modal differences lack any physical basis). Denying the modal difference contradicts ordinary object-talk (e.g., "the statue was destroyed, but the clay remains").

  2. **Ordinary Counting Without Ontological Proliferation**  
     - **Case:** *The Counting*. Pre-squash, we count one object on the pedestal (not "a statue and its clay"). Yet the theory’s machinery (e.g., constitution) implies two coincident objects.  
     - **Requirement:** The theory must reconcile *ordinary counting practices* (one object) with its *ontological commitments* (two objects if distinct). It must state whether counting is sortal-relative (e.g., "one statue" vs. "one lump") or absolute, and justify why multiplication (e.g., lump + statue) doesn’t infect everyday judgments.  
     - **Cost of Failure:** Undermines **ordinary truth-conditions** (e.g., "there is exactly one thing on the pedestal" is false). If counting is sortal-relative, it must explain why this relativity doesn’t lead to arbitrariness (e.g., in *The Many* cases).

  3. **Uniform Indeterminacy for Vague Objects**  
     - **Case:** *The Many*. For a cat (or statue), there are many precise candidates differing by a hair/cell (e.g., cat-minus-hair, cat-minus-cell).  
     - **Requirement:** The theory must resolve whether indeterminacy in object boundaries is acceptable and, if so, whether it applies uniformly to natural objects (cats) and artifacts (statues). It must specify if indeterminacy is metaphysical (ontic vagueness) or epistemic.  
     - **Cost of Failure:** Violates **parsimony** if positing sharp boundaries (arbitrary precisification) or **classical logic** if embracing ontic vagueness. Asymmetry between natural/artificial objects must be *earned* (e.g., via functional essence).

  4. **Persistence Conditions for Reassembly/Replacement**  
     - **Case:** *Reassembly and Replacement*.  
       - (a) *Reassembly*: Statue parts are dispersed and later rejoined identically. The lump persists, but the statue may not.  
       - (b) *Replacement*: Statue’s matter is replaced atom-by-atom (form fixed). The statue persists, but the original lump may not.  
     - **Requirement:** The theory must deliver divergent persistence conditions: lumps survive reassembly (matter-based), statues survive replacement (form/function-based). It must state what *grounds* these conditions (e.g., sortal essences).  
     - **Cost of Failure:** Collapses **object vs. matter** or **identity vs. constitution**. If both lump and statue behave identically, constitution is indistinguishable from identity.

  5. **Distinct Creation/Destruction Events**  
     - **Case:** *Creation and Destruction*. The statue is created when the lump is molded; both occupy the same space at the same time.  
     - **Requirement:** The theory must specify whether the statue’s creation is the *same event* as the lump’s alteration. If distinct, it must ground the difference (e.g., artifact introduction vs. matter reshaping). It must also identify destruction conditions (e.g., flattening destroys statue but not lump).  
     - **Cost of Failure:** Undermines **being a something vs. existing** (if statue creation isn’t a real event) or violates **Leibniz’s Law** (if distinct objects share all events).

  6. **Ordinary Truth-Value Preservation**  
     - **Case:** *Truth and Reference*. We say, "The statue is Romanesque" and "The clay is malleable," and these are true.  
     - **Requirement:** The theory must make ordinary statements come out true (e.g., via constitution relations or paraphrase). If not, it must provide an **error theory** explaining why false statements are pragmatically useful (e.g., "statue" talk refers to lump-under-a-description).  
     - **Cost of Failure:** Rejects **ordinary object-talk** as largely false, conflicting with the constraint that metaphysics should preserve it. Error theories must justify why revision is tolerable (e.g., no loss in explanatory power).

  ---

  ### **Distinctions & Constraints (Non-Collapsible)**  
  - **Object vs. Matter**: Constitution ≠ identity (per *Squash*). Collapse conflates properties (e.g., lump is essentially shapeless, statue is not).  
  - **Being a Something vs. Existing**: Constitution requires the constituted object to be an additional *thing* (not a phase or mode). Collapse eliminates artifact ontology.  
  - **Identity vs. Constitution**: Distinctness requires grounding per Leibniz’s Law (e.g., modal or historical properties).  
  - **Artifact/Natural Object Symmetry**: No asymmetry without justification (e.g., functional essence for artifacts).  
  - **Microphysical Supervenience**: All differences (modal, historical) must have microphysical grounds.  
  - **Leibniz’s Law**: Non-negotiable. Distinct coincidents *must* differ in some property (e.g., persistence conditions).  
  - **Parsimony**: Coincident objects must earn their keep (e.g., by grounding modal differences). Proliferation without explanatory gain is inadmissible.  

  ---

  ### **Your Cases: Breaking Standard Moves**  
  1. **Bronze Counterweight/Statue**  
     - **Case:** Same bronze is a statue (shape-dependent) and a counterweight (mass-dependent). Reshaping destroys the statue but not the counterweight.  
     - **Requirement:** The theory must say whether there is one object (bronze) with multiple roles, or distinct objects (statue, counterweight). It must explain how one entity has divergent persistence conditions.  
     - **Cost:** If distinct, it multiplies coincidents beyond lump/statue (parsimony pressure). If one object, it must reconcile conflicting persistence conditions (e.g., "the bronze survives as counterweight but not as statue").  

  2. **Town Memorial**  
     - **Case:** Vandalized memorial is recast identically from the same metal with the original dedication plate. Ordinary recast statues (same matter, same form) are new.  
     - **Requirement:** If the memorial survives, the theory must ground identity in *institutional facts* (e.g., communal rededication) rather than matter/form. It must then explain why ordinary statues *cannot* survive recasting (e.g., no institutional context).  
     - **Cost:** Privileges artifacts over natural objects without physical difference, risking asymmetry. If identity is institutional, it challenges microphysical supervenience.  

  ---

  ### **Non-Negotiables vs. Trade-Offs**  
  - **Non-Negotiable**:  
    - Leibniz’s Law (logical consistency).  
    - Microphysical supervenience (naturalism).  
    - Truth-preservation for ordinary statements (unless error theory is robust).  
  - **Negotiable**:  
    - Parsimony (proliferation may be necessary).  
    - Sortal-relativity (contextual counting may resolve puzzles).  
    - Ontic indeterminacy (vagueness may be tolerable).  

  - **Joint Unsatisfiability**:  
    The triad **microphysical supervenience + Leibniz’s Law + ordinary counting** is unstable.  
    - Supervenience + Leibniz’s Law require distinct coincidents to differ physically (e.g., historically).  
    - Ordinary counting precludes distinct objects (demands "one thing" pre-squash).  
    - **Cheapest to Abandon**: Ordinary counting. Admit two objects but explain why we count as one (e.g., sortal-relativity). Abandoning supervenience breaks with physics; abandoning Leibniz’s Law invites incoherence.  

  - **Most Exclusionary Requirement**:  
    **Modal Resilience** excludes identity theories (lump=statue can’t explain survival differences).  
    **Ordinary Counting** excludes robust pluralism (e.g., two coincidents pre-squash).  

  ---

  ### **Structural Implications**  
  - **Identity Theories** (lump=statue): Fail *Modal Resilience* and *Persistence Conditions*.  
  - **Constitution with Distinctness** (lump ≠ statue): Struggle with *Counting*, *Parsimony*, and *Truth* (if error-prone).  
  - **Eliminativism** (only lumps exist): Fail *Truth* (requires error theory for statues) and *Creation/Destruction*.  
  - **Sortal-Relative Counting**: Eases *Counting* but strains *Leibniz’s Law* (if differences are description-relative).  
  - **Four-Dimensionalism** (temporal parts): Handles *Replacement/Reassembly* but may overproliferate objects (parsimony) and struggles with *The Many* (vagueness in temporal boundaries).  

  The memorial case pressures all theories: if institutional facts ground identity, it demands a hybrid ontology (physical + social) and privileges artifacts—undermining symmetry with natural objects. A theory satisfying all desiderata likely requires constitution-as-distinctness with conventional grounding for modal differences, sortal-relative counting, and ontic indeterminacy for vague objects—but must then reconcile this with supervenience and parsimony. The core tension remains: respecting ordinary practice while honoring physics and logic forces costly trade-offs.
