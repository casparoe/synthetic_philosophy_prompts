prompt: |-
  Hi, I'm not a philosopher, just someone with chronic pain who recently recieved a diagnosis and started keeping a private pain diary. I use symbols I made up to rate sensations, and sometimes I go back and adjust earlier entries when I realize I'd been misreading a sensation. A friend who studied philosophy told me Wittgenstein's private language argument proves that a language referring only to my own private sensations is impossible, so my diary can't actually mean anything and I'm just fooling myself. But I also saw someone say the argument is really about private ostensive definition, not private diaries, and that the beetle-in-a-box point is that the sensation drops out of the language-game. So now I'm confused: does the argument show my pain diary is meaningless? If it does, is the problem that I can't check my memory, that I can't teach anyone the rule, or that the symbols don't have public criteria? If it doesn't, what exactly is it ruling out, and why doesn't that apply to what I'm doing? Act as a philosopher who works on Wittgenstein and philosophy of mind. Start by brainstorming the main readings of the argument, then give me your best answer. Tell me how confident you are in what you claim and flag the point you're least sure about.
