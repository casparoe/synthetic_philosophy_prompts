answer: |-
  Here is the five-step procedure:

  1. **Identify the core claim:** What specific, testable assertion is driving the conflict? If it's vague ("this is a scam") or purely emotional, skip to Step 4. If it's testable ("Product X fails below -10C" or "Rebate Y requires impossible paperwork"), proceed. *Example (a): "Heat pumps stop working efficiently below freezing." Example (b): "The rebate program's complexity is designed to prevent payouts."*

  2. **Check for pre-emptive discrediting:** Are external sources (manufacturers, utilities, gov't, experts) being dismissed *with a stated reason why they would lie or be incompetent* (e.g., "They profit from scams," "They're covering up the truth," "They're in industry's pocket")? If YES, flag as **Trust Issue**. If NO, or criticism is about specific data/methods without blanket malice, flag as **Potential Info Gap**. *Example (a): Critiques usually cite personal experience or installer bias, not systemic malice against *all* experts. Example (b): Rebate critics state utilities/governments design complexity *intentionally* to save money by denying claims.*

  3. **Assess social cost of disagreement:** Scan the thread. Do users pushing back against the dominant view receive significant hostility, dismissal (without counter-argument), or lose standing (e.g., called "shill," "naive," "bootlicker")? If YES and paired with Step 2 (Trust Issue), confirm **Trust Issue**. If NO, or pushback is met with arguments (even bad ones), lean **Info Gap**. If mixed or unclear, default caution. *Example (a): Pushback ("My unit works fine at -15C") often sparks debate, not shunning. Example (b): Pushback ("I got my rebate") is dismissed as luck/naivety, critics lose standing.*

  4. **Determine action based on issue type:**
      *   **Info Gap (Steps 1-3 indicate missing/incorrect facts):** Intervene constructively. Pin a concise, authoritative source (FAQ entry, manufacturer spec, independent test data) directly addressing the core claim. Add a brief neutral comment like: "This [source] specifically addresses cold-weather performance. Let's focus discussion here." *Leave thread open*. (Action for Example a).
      *   **Trust Issue (Steps 2 & 3 confirm distrust narrative + social enforcement):** Do NOT add facts (makes it worse). Assess harm: Is the thread repetitive, escalating, or causing harassment? If YES, **Lock immediately** with a neutral note: "This discussion has run its course and is becoming unproductive/repetitive." If NO (novel angle, mostly civil *within the in-group*), **Leave it alone** but monitor closely. *Action for Example b likely LOCK (repetitive malice claim) or LEAVE (if novel/civil in-group), but NOT correct.*

  5. **Escalate values questions:** Does the dominant view in a Trust Issue thread (Step 4) align with core server goals but rely on distrust, OR does intervention feel like suppressing valid criticism of powerful entities? If YES, AND the thread is significant/divisive, **DO NOT ACT SOLO. Escalate immediately** to other mods/owner with context: "Thread X involves deep distrust of [entity]. It's popular but may violate norms. Need consensus on handling." (Example b *might* trigger this if mods value critiquing utilities highly). Otherwise, follow Step 4 action.

  **Misfires/Judgment Calls:** Step 2/3 distinction is blurry; malice claims can be subtle. Step 3's "social cost" is inherently subjective (scan for downvotes, dismissive language). Step 5 is purely a values judgment about server culture. Distinguishing novel Trust Issue discussion (leave) vs. harmful repetition (lock) in Step 4 is also a judgment call.
