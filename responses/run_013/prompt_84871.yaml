  For tension points: validate council members' role without deference, acknowledge staff's implementation burden while inviting their expertise. Residents need clarity on their authority—they're not rubber-stamping but co-defining the problem. 

  Practical constraints: ten minutes max, no lecturing. Should end with forward momentum—maybe a "first question" prompt to transition into discussion. Tone is key: warm but not folksy, rigorous but not academic. Call it "shared work" often to reinforce collectivity. 

  ... Drafting now. Opening with the "uneasy feeling" metaphor to embody Dewey's "indeterminate situation." Then the three meeting purposes: map ripple effects, co-define the problem, design inquiry. Added the "no answers today" disclaimer early to manage expectations. Staff/council nods are brief but specific—staff as "consequence cartographers," council as "reality-checkers." Closing with the question about unheard consequences to immediately operationalize Dewey. 

