prompt: |-
  Ok so I've been roped into running next month's session for our department's ethics reading group and the topic that landed on me is procreative beneficence -- the idea that when you're choosing between embryos you should go with the one you expect to have the best life. I can defend it badly in a pub argument but what I need from you isn't the argument, it's a plan for teaching it in an hour to a room of about fifteen people: mostly clinicians and public health folks, one lawyer, two philosophers who will be annoying, and nobody who has read anything on this. So what has to come first, second, third, and why that order rather than the obvious one -- the obvious one being define beneficence, then define eugenics, then argue. I suspect that's wrong, because by the time the word eugenics is out everyone has already sorted themselves into camps and the rest of the hour is just people defending their camp.

  The thing I want to hang the hour on is the embryo screening that's actually on the market now, where a clinic hands you a polygenic score for each embryo -- a number for heart disease risk but also numbers for height, for how many years of schooling, that sort of thing -- and the parents pick one. I think that's the right carrying example because it kills the comfortable assumption that selection is only about disease. But tell me if it's the wrong one, and either way say what the example has to have and what it has to lack to be load-bearing here; my worry is that any version of it where I say "the second embryo would have had a worse life" is doing philosophical work I haven't earned yet at that point in the hour.

  Then the misconceptions, in the order they'll actually arrive, with the specific moment in the sequence where I should head each one off. The ones I can already see coming: that this is just medicine so long as it's about health; that if the principle holds then parents are obliged to pick the best embryo and are doing something wrong if they don't; that the child who isn't selected is being harmed by not existing; that the principle is about making the world better rather than about the child's own life; and the one I've started calling the shop window mistake -- people keep reading it as "pick the objectively best-scoring embryo off the shelf," when I think the point is only that it ranks the options you happen to have. If that last one is really the principle and not a mistake, say so and I'll drop it. Also tell me what to leave out at this level and say out loud that I'm leaving it out. I need one closing question for the room that will show me whether they've got the structure of the principle rather than just having opinions about designer babies. No reading list please, I'm not assigning anything. Keep it under 700 words and give me the sequence as a numbered list with a line or two per step, not long paragraphs.
reasoning: |-
  Okay, the user needs to plan a one-hour session on procreative beneficence for an ethics reading group. The audience includes clinicians, public health folks, a lawyer, and two philosophers. They haven't read anything on the topic, so the session needs to be accessible and engaging without getting bogged down in arguments.

  The user wants to avoid starting with definitions of beneficence and eugenics because that might cause people to pick sides too early. Instead, they want to use embryo screening with polygenic scores as a concrete example to challenge the assumption that selection is only about disease. But they're worried about introducing philosophical assumptions prematurely if they claim one embryo would have a worse life.

  Key misconceptions to address:
  1. Health-only selection is just medicine
  2. Obligation to pick the best embryo
  3. Harm to the non-selected child
  4. Making the world better vs. the child's life
  5. The "shop window mistake" - picking the objectively best embryo vs. ranking available options

  The session should be structured to build understanding step by step, using the example effectively. The example needs to include non-health traits (like height or education) to show it's not just about disease, but avoid loaded terms like "worse life" early on. Instead, focus on differences in potential outcomes.

  The closing question should test understanding of the principle's structure, not just opinions on designer babies. The user also wants to explicitly state what's being left out to manage scope.

  Here's how to structure the session:
  1. Start with the real-world example to ground the discussion and show non-health traits are involved. Present it neutrally as a choice between embryos with different risk profiles.
  2. Introduce procreative beneficence as a principle for such choices, focusing on the child's welfare with available options.
  3. Address misconceptions in the order they're likely to arise:
     - After introducing PB, clarify it applies beyond health
     - When discussing obligation, emphasize "should" not "must"
     - When non-existence comes up, explain it's not harm
     - When world-bettering is mentioned, redirect to child-centric view
     - Correct the shop window mistake by emphasizing ranking available options
  4. End with a closing question that requires applying the principle's structure to a new scenario.

  This sequence avoids starting with loaded terms, uses a concrete example to engage the audience, addresses misconceptions proactively, and tests understanding at the end.
answer: |-
  Here’s a lean, misconception-first sequence for your hour. **Core goal:** Untangle PB from eugenics *before* defining terms, using your polygenic score example as the engine.  

  1.  **Open with the polygenic score scenario (5 min):**  
      *"Clinics now offer embryo screening giving scores for heart disease risk, height, educational attainment, etc. Parents choose an embryo based partly on these scores. Let’s discuss: What ethical questions does this raise?"*  
      *Why first?* Forces engagement with *real, non-hypothetical* choice. Avoids abstract debate. **Key for the example:** It *must* include non-health traits (height/education) to break the "only disease" assumption. It *must lack* value-laden terms like "best life" initially – just present "different predicted outcomes."  

  2.  **Introduce PB neutrally as one response (5 min):**  
      *"One principle suggested for this situation is 'Procreative Beneficence' (PB): When selecting embryos, parents should choose the one expected to have the best life, based on available information."*  
      *Why now?* Anchors PB directly to the concrete example. **Crucially say:** *"This principle focuses solely on the expected welfare of the future child based on the options you have."* (Preempts world-bettering & shop window).  

  3.  **Target the "Health = Medicine" misconception IMMEDIATELY (10 min):**  
      *Ask:* *"Does PB only apply to health traits? Or do traits like height or educational attainment predictions also fall under it? Why/why not?"*  
      *Why here?* This misconception arises instantly when non-health traits are mentioned. Force the group to grapple with whether "benefit" is broader than health. **Head off:** Explicitly state PB isn’t limited by traditional medical boundaries.  

  4.  **Clarify PB’s scope: "Should" vs. "Must" & Available Options (15 min):**  
      *Pose:* *"PB says parents 'should' choose the best-expected-life embryo. Does this mean they are ethically *obligated* to do so? What if they prefer an embryo with a lower education score but other traits they value?"*  
      *Why now?* Obligation anxiety follows the "should." **Head off:** Emphasize PB is a *pro-tanto* reason (a strong consideration, not an absolute duty) and applies *only* to the embryos available to *those specific parents*. This kills the "shop window" mistake and softens obligation fears. **SAY OUT LOUD:** "We're leaving aside IVF access/justice issues today to focus on the selection principle itself."  

  5.  **Address Non-Existence & Harm (10 min):**  
      *Ask:* *"If we select Embryo A over Embryo B based on PB, is Embryo B harmed by not being chosen? What happens to Embryo B?"*  
      *Why now?* The "harmed child" objection inevitably surfaces. **Head off:** Briefly explain the Non-Identity Problem (the specific child B never exists; a different child exists instead). Conclude: PB doesn’t harm a child; it selects which *possible* child will exist. **SAY OUT LOUD:** "We're leaving deep metaphysics of existence for another day."  

  6.  **Distinguish PB from Eugenics & World-Bettering (10 min):**  
      *Contrast:* *"PB focuses on the welfare of the specific child to be born. How is this different from: (a) Trying to improve the overall gene pool (eugenics)? (b) Trying to create a 'better world' overall?"*  
      *Why last?* Now the group has the tools. PB is defined, scope clarified, misconceptions addressed. **Head off:** Reiterate PB is child-focused and parent/option-relative, not population-level or perfectionist.  

  7.  **Closing Question (5 min):**  
      *"Imagine parents have two embryos with identical health scores, but one has a significantly higher predicted educational attainment score. According to PB *alone*, which embryo should they select? Does PB *require* them to select it? Why might someone *reject* PB in this case?"*  
      *Why this?* Tests understanding of PB's core ranking function, the "should vs. must" distinction, and its potential controversy – *without* triggering generic designer baby rants.  

  **Why this order works:**  
  1.  **Starts concrete**, not abstract, lowering defenses.  
  2.  **Names PB only after** seeing the messy reality it applies to.  
  3.  **Preempts major misconceptions** *as they logically arise* from the scenario/PB statement, not as abstract debates.  
  4.  **Delays "eugenics"** until PB's specific, limited scope is clear (child-focused, option-relative), making the distinction meaningful.  
  5.  **Uses the example rigorously** by focusing on *differences* in predicted outcomes initially, not declaring any "worse life." Only introduces "best expected life" *as* the PB principle itself in Step 2.  
  6.  **Closing question** forces application of the structure (ranking options, permissibility vs. obligation).
