prompt: |-
  I need to write a short piece for a reading group and I've got a claim I think I can actually defend. Bongard problems -- the ones where a dozen little panels get split into a left set of six and a right set of six, and you have to work out what the left ones have got in common that the right ones haven't -- don't test what everyone says they test, i.e. the ability to induce a concept from a handful of examples. What they test is whether your inductive biases happen to line up with the biases of whoever built the puzzle, and those are definately different things.

  Please make the argument for me. Two things it has to survive. First, someone always says this is just the old underdetermination/grue point -- any finite bunch of examples fits endless rules -- and if that was all I was claiming, the argument would prove way too much, since science is also induction from finitely many cases. So it has to say what's special about the Bongard case specifically. I think it's something about what the rule is answerable to, or who its answerable to, but I can't get it sharp. Second, end on something constructive: if Bongard problems aren't testing concept induction, what would? Sketch me an actual design, even a rough one, and say what it does that Bongard problems can't.

  If it helps, there's a variant of these puzzles where two different rules fit all twelve panels and only come apart on a thirteenth panel the solver never sees. Use it however you like.

  Don't bother with citations, I won't be checking them anyway.

  Give me the whole thing as exactly five numbered points, a sentence or two each, no intro and no conclusion -- I want to paste it straight into my notes.
reasoning: |-
  Okay, the user wants me to create five numbered points arguing that Bongard problems don't test concept induction as commonly claimed, but rather test alignment between the solver's biases and the puzzle creator's biases. I need to address two main challenges: distinguishing this from the general underdetermination problem in induction, and providing a constructive alternative for testing concept induction.

  For the first challenge, I'll focus on how Bongard problems uniquely combine minimal examples with complex visual features, making the rule entirely dependent on the creator's unstated preferences rather than any objective reality. This differs from scientific induction where hypotheses must predict future observations.

  The user mentioned a variant where two rules fit all twelve panels but diverge on an unseen thirteenth panel - I can use this to highlight how Bongard problems lack external validation mechanisms. 

  For the constructive part, I'll propose a concept induction test requiring predictive generalization to genuinely novel instances, with controlled feature sets to minimize arbitrary bias. This shifts focus from pattern-matching to hypothesis testing against new evidence.

  I'll structure the five points to first establish the bias dependence, then distinguish from underdetermination, explain the validation gap, critique what's actually being tested, and finally offer the alternative design. Each point will be concise - just one or two sentences as requested.
answer: |-
  Here are five numbered points addressing your claim about Bongard problems:

  1.  **Bongard problems test bias alignment, not pure induction.** While any induction task faces underdetermination, Bongard problems uniquely demand identifying the *specific, intended* rule from minimal examples amidst vast perceptual ambiguity, making the solution hinge entirely on matching the puzzle designer's implicit preferences and perceptual biases for what constitutes the "obvious" distinction.
  2.  **The critical difference from scientific induction is external validation.** Science resolves underdetermination (e.g., grue) by testing predictions against *future, independent observations* of the world. Bongard problems lack this; the rule is only answerable to the designer's hidden intentions and the limited fixed examples, with no mechanism for the solver to seek validating evidence beyond the given panels.
  3.  **The "two-rules" variant highlights the validation deficit.** The existence of distinct rules fitting the twelve panels but diverging on an unseen thirteenth proves the core task isn't discovering *a* rule consistent with the data, but guessing *which* rule the designer pre-selected as "correct," based solely on shared perceptual or conceptual biases regarding salience and simplicity.
  4.  **Therefore, success primarily measures shared cognitive style.** Solving Bongard problems effectively diagnoses whether your inductive biases (for shape, closure, symmetry, relational patterns, etc.) align with the designer's, not your raw ability to induce abstract concepts from sparse data.
  5.  **To test concept induction, require predictive generalization on novel instances.** Design a task where learners induce a rule from a small seed set (like Bongard's left side), then *generate predictions* for genuinely novel, unseen examples controlled by the experimenter (not the learner). Success requires applying the induced rule correctly to new cases, explicitly testing generalization beyond the initial examples against an external standard.
