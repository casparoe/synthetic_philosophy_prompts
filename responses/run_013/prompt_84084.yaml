  ### Epigraph: The Double Reckoning  
  **I**  
  He waits within the quiet of his room,  
  Where through the door a letter finds its way.  
  He takes the sheet and reads it in the gloom:  
  *Your beams are dust or you have paid today.*  
  He knows the seal by what his hand will do:  
  If he withholds, the termites hold their sway.  
  But if he pays, the house stands safe and true—  
  The message holds: one true, the other flown.  
  So weighs the cost against the silent fray  
  That gnaws the wood when no one’s home alone.  

  **II**  
  He waits within the quiet of his room,  
  Where through the door a letter finds its way.  
  He takes the sheet and reads it in the gloom:  
  *Your coin has dropped, you owe the hundred today.*  
  He knows the seal by what he cannot do:  
  If it had turned, he’d claim tenfold the pay.  
  But as it fell, he must release his due—  
  The message holds: one true, the other flown.  
  So weighs the loss against the ghostly gain  
  That haunts the air where fortunes might have grown.  

  ---

  ### Structure Notes:  
  - **Mirroring & Changes**:  
    - **Line 4**: "Your beams are dust..." (I) vs. "Your coin has dropped..." (II).  
    - **Line 5**: "by what his hand *will do*" (I: active agency) vs. "by what he *cannot do*" (II: helplessness).  
    - **Lines 6–7**:  
      - I: Contingent on his choice (withhold/pay → termites/safety).  
      - II: Contingent on the coin (turned/fell → wealth/loss).  
    - **Closing Couplet**:  
      - I: "silent fray" and "gnaws the wood" (tangible threat: termites).  
      - II: "ghostly gain" and "haunts the air" (intangible regret: missed fortune).  
  - **Refrain (Line 8)**:  
    - **I**: "one true, the other flown" → Payment *reveals* which truth the letter seals (evidential: his act exposes reality).  
    - **II**: Identical words → Payment *cannot alter* the flown world (causal: his act is futile toward the coin’s outcome).  
  - **Payer/Payee Split**:  
    - **I**: The man *pays* (agency in "hand will do," "if he pays").  
    - **II**: The man *is paid (to owe)* (passivity in "cannot do," "must release his due").  
  - **Ambiguity & Interpretation**:  
    - Neither half specifies the coin result or payment choice, preserving uncertainty.  
    - The refrain’s duality—evidential (I) vs. causal (II)—aligns with the puzzles:  
      - **I**: Termite letter (evidential decision theory).  
      - **II**: Coin-flip payment (causal decision theory).  
  - **Form**:  
    - Iambic pentameter, ABABCDCDEE rhyme scheme.  
    - 10 lines per half; refrain anchors both at line 8.  
    - Minimal changes (7 words altered) create mirrored meaning.  

  The poem balances folly and obligation by leaving payment unresolved, while its structure invites rereading to unravel the twin reckonings.
