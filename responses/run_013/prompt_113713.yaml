answer: |-
  **Bottom line:** A minimally viable theory of standing to blame must jointly satisfy six constitutive requirements, but tension exists between the Anti-Hypocrisy and Participation Necessity requirements that may force trade-offs in edge cases like your colleague (a) and complicit blamer (d).  

  ### Core Desiderata (Constitutive Requirements)  
  1. **Anti-Hypocrisy Constraint**  
     - *Motivation:* Cases (a) and (e) (your colleague; institutional blamer). A blamer who commits the same wrong persistently without acknowledgment undermines the moral authority to blame.  
     - *Requirement:* The theory must deny standing to unrepentant repeat offenders. *Constitutive* — hypocrisy voids the blamer’s normative position.  

  2. **Acknowledgment-Restoration Principle**  
     - *Motivation:* Case (b) (reformed wrongdoer). Moral repair requires that past wrongdoers can regain standing.  
     - *Requirement:* Full standing is restored only if acknowledgment includes genuine change and restitution. *Constitutive* — moral agency presupposes capacity for redemption.  

  3. **Relational Proximity Threshold**  
     - *Motivation:* Case (c) (stranger). Blame requires a legitimate interest in the wrong (e.g., victim, community member).  
     - *Requirement:* Standing demands a relationship to the wrong/victim (not merely knowing the norm). *Constitutive* — blame is inherently second-personal; strangers’ objections reduce to abstract criticism.  

  4. **Participation Necessity**  
     - *Motivation:* Case (d) (complicit blamer). Co-participants in a corrupt practice must be able to call out peers.  
     - *Requirement:* Standing persists if the blamer’s participation is non-identical (e.g., lesser role) and blame targets the shared practice. *Constitutive* — collective wrongdoing requires internal critique.  

  5. **Delivery-Neutral Epistemology**  
     - *Motivation:* Case (f) (insufferable but correct blamer). Standing should not hinge on tone if the norm/fact claim is true.  
     - *Requirement:* Standing depends on *what* is asserted, not *how*. Bad faith delivery may make blame ineffective but not invalid. *Constitutive* — standing concerns warrant, not efficacy.  

  6. **Reflexive Consistency**  
     - *Motivation:* Case (g) (self-blame). The theory must symmetrically apply to self-reproach.  
     - *Requirement:* Criteria for standing (e.g., non-hypocrisy) bind self-blame. *Constitutive* — morality is not agent-relative.  

  ### Contested Requirements (Camp Commitments)  
  - **Binary vs. Graded Standing:** *Camp commitment.* Constitutive requirements allow for kinds (e.g., standing to resent privately ≠ standing to punish publicly) if grounded in relational roles (victim vs. official). Unified accounts can accommodate this via scope-limited standing.  
  - **Moral Wrong vs. Pragmatic Failure:** *Camp commitment.* Your suspicion is correct: Constitutive requirements imply lacking standing makes blame *pro tanto morally wrongful* (it usurps authority), not merely ineffective. Some utilitarian camps reject this.  

  ### Tensions and Trade-offs  
  - **Key Irreconcilable Tension:** Anti-Hypocrisy vs. Participation Necessity.  
    - In case (d), a complicit blamer may lack standing per Anti-Hypocrisy but need it per Participation Necessity.  
    - *Resolution?* The theory may prioritize Participation Necessity *only if* the blamer is actively reforming the practice (linking to Acknowledgment-Restoration).  
  - **Delivery-Neutrality as the Great Filter:** It rules out common views that conflate standing with blame’s social acceptability (e.g., "virtue signaling" critiques).  

  ### Verdict on Your Cases  
  - **(a) Colleague:** No standing (Anti-Hypocrisy).  
  - **(b) Reformed Wrongdoer:** Full standing if restitution is demonstrable.  
  - **(c) Stranger:** No standing (Relational Proximity).  
  - **(d) Complicit Blamer:** Standing *only if* blame includes self-implication and targets systemic change.  
  - **(e) Institutional Blamer:** No standing (Anti-Hypocrisy + power asymmetry exacerbates the wrong).  
  - **(f) Factually Correct Blamer:** Standing persists (Delivery-Neutrality).  
  - **(g) Self-Blame:** Standing requires meeting Anti-Hypocrisy (e.g., not blaming yourself for X while actively doing X).  

  ### Why Joint Satisfaction Is Limited but Possible  
  A theory can satisfy all six constitutive requirements *if* it:  
  - Treats Anti-Hypocrisy as defeasible by Participation Necessity *only* under reform conditions (bridging b/d).  
  - Anchors standing in *roles* (victim, co-participant, restorer) rather than pure moral status.  
  However, **your colleague (a) vs. complicit blamer (d) exposes a fault line:** Unrepentant hypocrites (a) cannot blame, but repentant complicit actors (d) can—yet if your colleague claims to be "reforming," the line blurs. This demands a high bar for what counts as acknowledgment (e.g., public redress, not just private remorse).
