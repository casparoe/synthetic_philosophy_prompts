  The user mentioned Aristotle's scala naturae and natural slaves. His hierarchy implies different capacities across species, which might suggest graded moral worth. But for Aristotle, the key divider is rationality—either you have it (humans) or you don't (other animals). So, moral worth isn't graded by brain size but by the presence of a rational soul.  

  They also brought up Aristotle's claim about humans having the largest brain relative to body size. Even if he said that, it's incorrect today (birds have more neurons per gram). But for Aristotle, that physical fact wouldn't matter. The rational soul is what counts, and it's non-material. Hylomorphism means the soul and body are united, but the rational soul's capacities aren't reducible to physical traits.  

