  ### Joint Statement: Agreed Claims

  1. **Setup Requirements**  
     Before evaluating any switching strategy, the setup must specify:  
     - A pair of envelopes containing amounts \(s\) and \(2s\), where \(s > 0\).  
     - A prior distribution for \(s\) (denoted by its CDF \(F\) or PDF \(f\)), which may be unknown to the player but must be proper (i.e., \(\int_0^\infty f(s)  ds = 1\)).  
     - The player receives one envelope at random (probability \(1/2\) for each), observes its amount \(x\), and decides whether to switch.  
     Strategies may depend on \(x\) and/or external randomization. The goal is to maximize expected gain relative to never switching.

  2. **The Fallacious \(5x/4\) Argument**  
     The argument claims:  
     - After observing \(x\), the other envelope has \(2x\) or \(x/2\) with equal probability \(1/2\).  
     - Thus, expected gain from switching is \(\frac{1}{2} \cdot 2x + \frac{1}{2} \cdot \frac{x}{2} = \frac{5x}{4} > x\).  
     This is presented as showing switching is always beneficial.

  3. **Where the \(5x/4\) Argument Fails**  
     Both camps agree the argument is invalid because:  
     - It implicitly assumes \(\Pr(\text{other} = 2x \mid x) = \Pr(\text{other} = x/2 \mid x) = 1/2\) for all \(x\).  
     - This requires \(f(x) = f(x/2)\) for all \(x\) (from Bayes' theorem), which is impossible for a proper prior.  
     - No proper distribution satisfies this, making the assumption illicit. Conditioning on \(x\) must account for the prior.

  4. **Camp A's Core Correctness (Invariance)**  
     Both camps agree that:  
     - The envelopes are exchangeable: no strategy can achieve **positive expected gain over all possible pairs \((s, 2s)\)** if it relies solely on \(x\) without external randomization.  
     - For any fixed proper prior, the **unconditional expected gain** (averaged over \(s\) and the initial choice) of switching is zero. Thus, "always switch" or "never switch" yields zero expected gain.  
     - No deterministic switching strategy (based only on \(x\)) has nonnegative expected gain for all \(x\), as \(\mathbb{E}[\text{gain} \mid x]\) must be negative for some \(x\).

  5. **Camp B's Core Correctness (Information)**  
     Both camps agree that:  
     - With external randomization, a strategy can achieve **positive expected gain for every fixed pair \((s, 2s)\)**.  
     - Specifically: If the player samples a threshold \(T\) from a continuous distribution with full support on \(\mathbb{R}^+\) (e.g., exponential, log-normal) and switches iff \(x < T\), then:  
       \[
       \mathbb{E}[\text{gain} \mid s] = \frac{s}{2} \cdot P(s < T < 2s) > 0 \quad \forall s > 0.
       \]
     - This holds because \(P(s < T < 2s) > 0\) (due to full support), and the gain occurs only when switching from \(s\) to \(2s\) (not when switching from \(2s\) to \(s\)).

  6. **Resolution of Apparent Conflict**  
     Both camps agree that:  
     - Camp B's strategy exploits external randomization to break exchangeability, yielding per-pair gains.  
     - Camp A's invariance holds for unconditional expectations over a fixed prior:  
       \[
       \mathbb{E}_{s,T}[\text{gain}] = \mathbb{E}_s \left[ \frac{s}{2} \cdot P(s < T < 2s \mid s) \right] \geq 0,
       \]
       but this is **not necessarily zero** and depends on the distributions of \(s\) and \(T\).  
     - For example, if \(s \sim \text{Exponential}(1)\) and \(T \sim \text{Exponential}(1)\) independently:  
       \[
       \mathbb{E}[\text{gain}] = \frac{1}{2} \int_0^\infty s \left( e^{-s} - e^{-2s} \right) e^{-s}  ds = \frac{5}{72} > 0.
       \]  
       Symmetry does not force this to zero because \(T\) breaks invariance.

