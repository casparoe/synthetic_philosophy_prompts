  5. **Camp B's Core Claim (Information)**: 
     - It is possible to design a switching strategy that conditions on the observed value `x` and that yields a strictly higher expected gain than never switching, for every possible pair `(s, 2s)`. This is achieved by using a randomized threshold that does not depend on the prior distribution of `s`. 
