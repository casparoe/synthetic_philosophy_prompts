answer: |-
  ### Essay Question (60 minutes, ~800 words)  
  **"In a single-period financial market, two risk-averse traders (A and B) share identical prior beliefs about the future value of an asset. Trader A holds the asset and a separate, undiversifiable liability perfectly correlated with the asset’s value. Trader B holds cash only. A sells the asset to B at a price below A’s expected valuation. Both strictly prefer the trade ex ante.  

  (a) Explain why this trade occurs despite identical priors. Does this violate the no-trade theorem? Justify your answer.  
  (b) Discuss the implications for the claim that ‘observed trade reveals private information’.  
  (c) If market prices fully revealed all traders’ private information, would rational agents invest in acquiring it? Analyse the tension this creates for understanding real-world markets."**  

  ---

  ### Model Answer (600 words)  

  **(a)** The trade occurs because Trader A is offloading pre-existing risk exposure, not acting on superior information. A’s liability (e.g., a debt repayment tied to the asset’s value) creates a correlated risk that makes holding the asset excessively costly *for A specifically*. Though both traders share identical priors about the asset’s fundamental value, A’s marginal utility differs due to this liability. Selling the asset at a discount allows A to hedge this exposure. Trader B, lacking such liability, values the asset more highly in risk-adjusted terms and thus benefits from the discount.  

  This does **not** violate the no-trade theorem. The theorem assumes traders maximise expected utility *given initial endowments and beliefs*, but critically presumes no pre-existing, trade-irrelevant risks. Here, A’s liability is an endowment effect external to the asset’s information structure. The no-trade theorem rules out trade based *solely* on differences in information under common priors and common knowledge of rationality. It explicitly excludes trades driven by risk reallocation from heterogeneous initial exposures. Thus, this is a case *excepted* by the theorem’s assumptions, not a counterexample.  

  **(b)** This scenario undercuts the claim that ‘observed trade reveals private information’. Trade here stems from differential risk tolerances caused by A’s liability, not asymmetric beliefs. B learns nothing about the asset’s value from the trade; they learn only that A is risk-constrained. Crucially, if B misinterpreted the trade as informational, they might update beliefs erroneously. Real-world trade can thus signal *heterogeneity in risk-bearing capacity* rather than private information. This complicates inferring information from trades: we cannot presume prices or trades aggregate dispersed knowledge when non-informational motives (e.g., hedging, liquidity) dominate.  

  **(c)** If prices perfectly revealed all private information, rational agents would **not** invest in acquiring it. Collecting information is costly, and if prices instantly reflect it, traders cannot profit from their investment (the *Grossman-Stiglitz paradox*). Markets would collapse into a no-trade equilibrium, as no one could gain from private knowledge. Yet real markets exhibit continuous trade and information acquisition, implying prices are *not* fully revealing. The tension arises because:  
  - Some informational inefficiency is necessary to incentivise information production.  
  - However, excessive inefficiency undermines market rationality.  
  This paradox highlights a fragile balance: prices must partially (but not fully) aggregate information to sustain both trade and information discovery.  

  ---

  ### Marking Scheme (out of 20)  
  **A Grade (17–20):** Distinction-level clarity on all key moves.  
  **B Grade (14–16):** Solid grasp but minor omissions/muddled phrasing.  

  | **Points** | **Specific Move Required**                                                                 | **Common Flaws** |  
  |------------|--------------------------------------------------------------------------------------------|------------------|  
  | **4**      | **(a) Correctly identifies trade driver:** Explicitly links trade to A’s liability-induced risk reduction, not belief differences. | Vaguely attributes trade to "risk aversion" without specifying *endogenous cause* (liability). |  
  | **4**      | **(a) No-trade theorem defence:** States theorem excludes pre-existing endowments/risk exposures; trade is consistent as it addresses non-informational heterogeneity. | Assumes theorem is falsified; misses exclusion of endowment effects. |  
  | **3**      | **(b) Challenges information revelation:** Argues trade reveals risk heterogeneity (A’s exposure), not private information; notes danger of misinterpretation. | Claims trade "partially" reveals info; omits liability’s signalling role. |  
  | **3**      | **(b) Links to real-world inference:** Concludes trade cannot be presumed informational when hedging motives exist. | States "trade isn’t always informational" without mechanics. |  
  | **3**      | **(c) Grossman-Stiglitz paradox:** Notes information acquisition ceases if prices are fully revealing due to zero profit incentive. | Describes paradox unclearly; fails to link to profit motive. |  
  | **3**      | **(c) Tension resolution:** Explains markets require *partial* revelation to sustain information investment and trade. | Suggests "some inefficiency is good" without pricing mechanism. |  

  **Clarity & Structure (Bonus 0–2):** Logical flow, precise terminology (e.g., "endowment", "common priors", "risk exposure").  
  *Penalties:* -1 for >750 words; -2 for misstating no-trade assumptions.  

  ---  
  **British English Note:** "Realise", "endogenously", "defence", "mechanism" used throughout. Question/model answer avoid contractions.
