prompt: |-
  I am a graduate student in a political philosophy seminar on distributive justice, and I am writing a term paper on the leveling-down objection. Over the semester my professor has been issuing verdicts, in passing, on pairs of possible futures, where each number in a distribution is one person's well-being (higher is better), the two options in a pair concern the same people, and her verdict is about which world is impersonally better rather than more just. She has been remarkably consistent. She says that (10, 50, 50) is a better world than (10, 20, 20), which is just its leveled-down version; that (8, 40, 40) is better than (8, 15, 15), even though the first is far less equal; that (18, 25, 25) is better than (10, 30, 30), even though its total is smaller; and that (10, 30, 30) is better than (10, 20, 40), even though the two have the same total and the same worst-off person. She tells us the leveling-down objection shows that equality cannot be a value in its own right, and she seems entirely unmoved by the thought that inequality above the worst-off position is bad in itself.

  What I need is not a survey of the literature but a prediction and a diagnosis. The case I have been arguing about with a friend is this: a population of one hundred people in which a single person is at 10 and the other ninety-nine are at 60, versus a world in which that worst-off person is at 12 and the other ninety-nine are each at 58. I have been assuming my professor is some kind of prioritarian, but I cannot tell whether her priority for the worse-off is absolute — the sort of view that treats the worst-off person's level as lexically prior, so that any gain to that person settles the matter — or merely strong, so that a sufficiently large aggregate loss to others can outweigh a small gain to the worst-off.

  Please tell me which candidate rules fit all four of her earlier verdicts, what each of those rules predicts about my hundred-person case, which verdict you would bet on and why, and which further case would do the most to separate the surviving rules from one another. I would also like to know what her verdicts so far do and do not pin down about how much a benefit to the worst-off counts for relative to losses to the better-off. Since I will have to defend this in a seminar without appealing to authorities, give me the reasoning rather than pointers to who has said what.
reasoning: |-
  We are given four pairwise comparisons by the professor:

  1. (10,50,50) is better than (10,20,20) [Leveling-down objection: the second is more equal but worse for two people without helping the worst-off. So she prefers the first.]
  2. (8,40,40) is better than (8,15,15) [Again, the second is more equal but worse for the two better-off individuals. She prefers the first.]
  3. (18,25,25) is better than (10,30,30) [Note: the first has a total of 18+25+25=68, the second 10+30+30=70. So the first has a lower total but is preferred. Also, the worst-off in the first is 18, which is higher than 10 in the second. The other two are 25 vs 30, so worse for the other two in the first.]
  4. (10,30,30) is better than (10,20,40) [Same total: 70 in both. Same worst-off (10). But the second is more unequal. She prefers the first, which is more equal above the worst-off.]

  We note that in (1) and (2), the worst-off is the same in both options, and she prefers the option that is better for the others. In (3), she prefers an option that has a higher level for the worst-off even if it lowers the total and the level of the others. In (4), she prefers a more equal distribution above the worst-off when the worst-off is fixed and the total is fixed.

  This suggests that the professor's view might be captured by a prioritarian social welfare function that uses a concave transformation of well-being. However, note that in (3) she prefers (18,25,25) to (10,30,30). The worst-off in the first is 18, which is much higher than 10, and that seems to matter more than the fact that the others are 25 versus 30. Also, in (4) she prefers equality above the worst-off.

  But note: in (4) the two distributions have the same worst-off (10) and the same total (70). So the only difference is that in (10,30,30) the two better-off are equal, whereas in (10,20,40) they are unequal (20 and 40). This suggests she has a preference for equality above the worst-off, but note that in (1) and (2) she did not prefer equality when it came at the cost of making the better-off worse off without helping the worst-off.

  Therefore, we might hypothesize that the professor cares about two things:
  - The level of the worst-off (with a strong priority to raising it).
  - Equality among the non-worst-off, but only when the worst-off is fixed and the total is fixed? Or more generally, but without sacrificing the well-being of the non-worst-off to achieve equality when it doesn't help the worst-off? (As in the leveling-down cases.)

  Alternatively, we might consider a rule that is a combination of prioritarianism and a concern for equality, but note that the leveling-down objection is often taken to show that equality is not a value in itself. So perhaps the professor is a prioritarian without an intrinsic concern for equality. How then to explain (4)?

  Let me consider prioritarian rules. A prioritarian social welfare function is the sum of a concave transformation of well-being. Let f be a strictly concave and increasing function. Then the social welfare of a distribution (x1, x2, ..., xn) is f(x1) + f(x2) + ... + f(xn).

  Let's test the four cases with a candidate f. Suppose f(x) = sqrt(x). Then:

  Case 1: 
  - (10,50,50): sqrt(10) + sqrt(50) + sqrt(50) ≈ 3.16 + 7.07 + 7.07 = 17.3
  - (10,20,20): sqrt(10) + sqrt(20) + sqrt(20) ≈ 3.16 + 4.47 + 4.47 = 12.1
  Clearly 17.3 > 12.1, so (10,50,50) is better. Correct.

  Case 2:
  - (8,40,40): sqrt(8) + sqrt(40) + sqrt(40) ≈ 2.83 + 6.32 + 6.32 = 15.47
  - (8,15,15): sqrt(8) + sqrt(15) + sqrt(15) ≈ 2.83 + 3.87 + 3.87 = 10.57
  15.47 > 10.57, so (8,40,40) is better. Correct.

  Case 3:
  - (18,25,25): sqrt(18) + sqrt(25) + sqrt(25) ≈ 4.24 + 5 + 5 = 14.24
  - (10,30,30): sqrt(10) + sqrt(30) + sqrt(30) ≈ 3.16 + 5.48 + 5.48 = 14.12
  14.24 > 14.12, so (18,25,25) is better. Correct.

  Case 4:
  - (10,30,30): sqrt(10) + sqrt(30) + sqrt(30) ≈ 3.16 + 5.48 + 5.48 = 14.12
  - (10,20,40): sqrt(10) + sqrt(20) + sqrt(40) ≈ 3.16 + 4.47 + 6.32 = 13.95
  14.12 > 13.95, so (10,30,30) is better. Correct.

  So the square root function passes all four tests.

  But is this the only function? We could try other concave functions. For example, f(x)=log(x). Let's test:

  Case 1:
  - (10,50,50): log(10) + log(50) + log(50) ≈ 2.30 + 3.91 + 3.91 = 10.12
  - (10,20,20): log(10) + log(20) + log(20) ≈ 2.30 + 3.00 + 3.00 = 8.30 -> correct.

  Case 2:
  - (8,40,40): log(8) + log(40) + log(40) ≈ 2.08 + 3.69 + 3.69 = 9.46
  - (8,15,15): log(8) + log(15) + log(15) ≈ 2.08 + 2.71 + 2.71 = 7.50 -> correct.

  Case 3:
  - (18,25,25): log(18) + log(25) + log(25) ≈ 2.89 + 3.22 + 3.22 = 9.33
  - (10,30,30): log(10) + log(30) + log(30) ≈ 2.30 + 3.40 + 3.40 = 9.10 -> correct.

  Case 4:
  - (10,30,30): 2.30 + 3.40 + 3.40 = 9.10
  - (10,20,40): 2.30 + 3.00 + 3.69 = 8.99 -> 9.10 > 8.99, so (10,30,30) is better. Correct.

  So both the square root and the log work. But note: the log function has a problem at 0, but we don't have zeros. So both are viable.

  Now, what about the hundred-person case? We have two options:

  A: (10, 60, 60, ..., 60) [one at 10, ninety-nine at 60]
  B: (12, 58, 58, ..., 58) [one at 12, ninety-nine at 58]

