  But what if we use the log function?

  A: log(10) + 99 * log(60) ≈ 2.3026 + 99 * 4.0943 ≈ 2.3026 + 405.3357 = 407.6383
  B: log(12) + 99 * log(58) ≈ 2.4849 + 99 * 4.0604 ≈ 2.4849 + 401.9796 = 404.4645

  Again, A is better (407.6383 > 404.4645). So both prioritarian functions with square root and log prefer A.

  But note the professor's behavior in case 3: she preferred (18,25,25) over (10,30,30) even though the total was lower. In that case, the worst-off went from 10 to 18 (a gain of 8) and the two others went from 30 to 25 (a loss of 5 each). The gain for the worst-off was enough to offset the loss for the others. In the hundred-person case, the worst-off gains 2, and each of the 99 loses 2. So the total loss is 99*2=198, and the gain is 2. But because of the concave transformation, the marginal value of a unit at 10 is higher than at 60.

