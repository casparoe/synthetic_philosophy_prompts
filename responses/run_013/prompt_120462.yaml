  - I would bet on leximin (so she chooses B) because of the strong priority given to the worst-off in case 3.
  - To separate the two, use a case with a very small improvement for the worst-off and a very large number of better-off who suffer a very small loss (like the thousand-person case above). In that case, additive prioritarianism will prefer the original distribution (A) while leximin will prefer the new one (B).

  Regarding how much a benefit to the worst-off counts relative to losses to the better-off:

  - If she is an additive prioritarian, then the relative weight is given by the ratio of the marginal values. The marginal value of a benefit to a person at level x is f'(x). So a benefit of size d to the worst-off (at level x) is worth f'(x)*d. The same benefit to a better-off at level y is f'(y)*d. The ratio is f'(x)/f'(y). For a concave f, f' is decreasing, so if x<y, then f'(x)>f'(y). The ratio can be large if x is much smaller than y. But it is finite. For example, with f(x)=sqrt(x), the marginal value at x is 1/(2*sqrt(x)). At x=10, it's about 0.158; at x=60, it's about 0.0645. So the ratio is 0.158/0.0645≈2.45. So a unit to the worst-off is worth about 2.45 times a unit to the better-off. But in the hundred-person case, we have one person gaining 2 and 99 people losing 2. The net effect on social welfare: gain of 2*0.158 - 99*2*0.0645 = 0.316 - 12.771 = negative.

  - If she is leximin, then any gain to the worst-off, no matter how small, outweighs any loss to the better-off, no matter how large, as long as the worst-off remains the unique worst-off and improved. If there are multiple worst-off, then we have to consider the next level.

  So the verdicts so far pin down that the professor is either an additive prioritarian or leximin. They do not pin down the exact function if she is additive prioritarian, but they do require that the function is strictly concave and increasing.

  Final prediction for the hundred-person case: I think she will choose B (the world where the worst-off is at 12 and the others at 58), because she seems to give absolute priority to the worst-off. So I bet on leximin.
