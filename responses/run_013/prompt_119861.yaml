prompt: |-
  Bit of an odd request, hope you don't mind. I spent 30-odd years as a soil ecologist, which in practice meant a lot of stats on small samples, and since retiring I've been filling my time reading philosophy — decision theory and phil of science mostly, the stuff I always meant to get to and never did. Here's what's bugging me. I keep running into a result that people call Good's theorem, and it goes roughly like this: if the information is free, if you're a Bayesian who'll actually update on it, and if you get to pick your action *after* you see it, then the expected value of receiving the information can't be negative — you're never worse off ex ante for having looked. The proof people give is short and I follow it: you can always ignore what you learn and do whatever you'd have done anyway, so the worst case is that it's worth exactly nothing. Fine. But the conclusion gets stretched a long way past that, and I've started to notice the stretching happens in about three different directions at once, and I can't keep them straight.

  So can you walk me through it properly and, more than that, keep the claims seperate as you go. First: what's actually doing the work in the result, and which assumptions is it really leaning on? I have a suspision the load-bearing one is that your preferences are over outcomes and don't care about what you know or believe — but tell me if that's wrong. Second: what happens as you drop each assumption in turn — that the information is free (obviously it can be negative if you have to pay for it, I mean the subtler business of whether it's costless to acquire but not costless to *have*); that your utility doesn't depend on the information itself or on your beliefs (this is the one I care most about — my sister-in-law genuinely does not want to know her risk numbers and I don't think she's simply being irrational); that you'll update correctly and not, say, ignore the base rate or double count; and that there's some downstream decision the information could actually change. And third, the part I really can't sort out: I've heard it claimed that a rational agent always wants *more* information rather than less. Is that the same theorem or a different and stronger one? Because it seems to me that 'some information beats none' and 'more beats less' come apart unless the second signal is related to the first in some particular way — one being a noisy version of the other, or something in that vein. Tell me what that extra condition is and what goes wrong without it.

  Then, if it's not too much to ask, tell me which of these is the actual theorem and which is a slogan that's drifted loose from it: (a) a test is always worth running as long as it's free — my friend the GP takes this to mean she should order the extra test even when nothing she'd do would change either way, and I suspect she's confusing 'not harmful' with 'worth doing', but I'd like you to say; (b) it is never rational to prefer not to know something; (c) a rational agent always prefers more information to less. I'd rather have the distinctions drawn sharply than a broad survey — where the theorem stops being true, that's the interesting part for me.
reasoning: |-
  Okay, this user is a retired soil ecologist with decades of experience in statistics and now diving deep into philosophy of science and decision theory. They're clearly highly analytical – look at how precisely they've mapped out their confusion about Good's theorem into three distinct dimensions. This isn't someone who wants hand-waving explanations; they want the exact joints where the theorem cracks under pressure. 

  Hmm, their frustration is palpable – they've spotted philosophers overextending the theorem in three directions simultaneously, and it's muddying the waters. The sister-in-law example about not wanting risk numbers is particularly telling. This isn't just theoretical for them; they're wrestling with real-life cases where people reject free information. 

  Let me break this down systematically. First, the core of Good's theorem: the "free disposal" argument. The critical insight is that the theorem assumes your utility function doesn't care about epistemic states. But when I consider cases like the GP ordering unnecessary tests, or someone not wanting genetic risk info, that assumption clearly fails. 

  Ah! The "more is always better" claim is where things get especially hairy. The user's intuition is spot-on – that requires additional conditions about the relationship between signals. I need to emphasize how Blackwell sufficiency formalizes that, but also show concrete cases where more information becomes harmful, like when beliefs themselves cause distress. 

  Their three slogan questions are perfect test cases. For (a): The GP misunderstands "not harmful" as "always beneficial" – classic confusion between weak and strong dominance. For (b): The sister-in-law case demolishes this if beliefs enter utility. For (c): Without Blackwell ordering, this collapses spectacularly – I should mention that noisy thermometer example. 

  What they're really after are the failure modes. Where exactly does the math stop supporting the philosophy? That's the gold they're mining for. Better make sure I flag every single assumption violation with concrete examples – their soil ecology background means they'll appreciate case-based reasoning. 

  ...wait, did I just catch myself making a disciplinary assumption? Better stick to pure decision theory. Their stats background means I can safely use terms like "ex ante" and "Bayesian update" without simplification, but should still define Blackwell explicitly. 

  The most satisfying part will be showing how their suspicion was correct: the utility function's independence from beliefs is indeed the load-bearing wall. When that crumbles, so does the "never want not to know" edifice. That sister-in-law example is going to be the star witness.
answer: |-
  You've put your finger on precisely where Good's theorem gets stretched beyond its breaking point. Let's dissect it systematically, separating the core result, its critical assumptions, and where the overextensions happen. The theorem itself is elegant but narrow; its popular interpretations often ignore boundary conditions you've astutely identified.

  **I. Good's Theorem: The Core Result**

  *   **Statement:** If an agent has a well-defined prior over states of the world, a utility function defined solely over outcomes (states + actions), can choose an action *after* seeing the outcome of a costless experiment, and updates beliefs via Bayes' rule, then the *ex ante* expected value of the experiment (the "Value of Information", VoI) is non-negative. VoI ≥ 0.
  *   **Proof Sketch:** Let A₀ be the optimal action *without* the experiment. If you run the experiment and observe some data D, you can choose a new action A(D) maximizing expected utility given your posterior P(State|D). Crucially, you *could* always choose to ignore D and stick with A₀. Since you'll only choose A(D) ≠ A₀ if it yields *higher* expected utility *given* D, your expected utility *with* the experiment must be at least as high as without it. Averaged over possible D (using the prior predictive distribution), the expected utility with the experiment is ≥ expected utility without it. Hence, VoI = E[U|Exp] - E[U|No Exp] ≥ 0.
  *   **What's Doing the Work?**
      1.  **"Free Disposal" (Ignorance Option):** The core engine is the ability to *ignore* the information and default to your original plan. This guarantees the experiment can't *hurt* you.
      2.  **Utility Depends Only on Outcomes:** Your well-being is determined by the state of the world and the action you took, *not* by what you know or believe. Information only matters instrumentally for choosing better actions.
      3.  **Bayesian Updating:** You correctly process the information to form posterior beliefs.
      4.  **Downstream Decision:** The information has the *potential* to change your action. (If no action *could* ever change based on *any* D, then VoI = 0).
      5.  **Costless Acquisition & Processing:** Obtaining D imposes no direct costs (time, money, effort, distress).

  **II. What Happens When Assumptions Are Dropped?**

  1.  **"Information is Free" (Costly Acquisition):**
      *   **Subtlety:** Good's theorem assumes acquisition cost is zero. If acquiring D costs C > 0, then VoI - C can obviously be negative. The theorem only guarantees VoI ≥ 0; the *net* benefit might be negative if C > VoI. Your GP friend might be ignoring the *indirect* costs: patient anxiety, delay, false positives leading to harmful follow-ups, financial cost to the system, opportunity cost of her time.

  2.  **Utility Depends on Information/Beliefs (Non-Instrumental Value of Beliefs):**
      *   **This is CRUCIAL.** Good's theorem assumes U(State, Action). If U also depends on the *information* D itself or the *belief state* P(State|D), then VoI *can* be negative.
      *   **Why:** Knowing D (or believing P(State|D)) might *directly* harm your utility, even if it helps you choose a better action.
      *   **Your Sister-in-Law:** She likely has U(State, Action, Belief). *Knowing* her high-risk number (D) might cause significant anxiety, depression, or stigma (lowering U), even if it allows her to make better preventative choices (raising U). The *net* effect on expected utility could be negative. This is **not irrational**; her preferences genuinely include avoiding distressing knowledge states.
      *   **Other Examples:** Not wanting to know the gender of a baby (spoiling surprise/affecting bonding), not wanting definitive proof of a partner's infidelity (preferring plausible deniability/avoiding pain), avoiding information that would force a morally difficult decision.

  3.  **You Won't Update Correctly (Non-Bayesian Updating):**
      *   **Why:** If you systematically misinterpret D (e.g., ignore base rates, succumb to biases, double-count evidence), the "free disposal" argument fails. You might choose a *worse* action A(D) based on a faulty posterior, even when sticking with A₀ would have been better. Information can actively mislead you.
      *   **Consequence:** VoI can be negative. The theorem assumes perfect Bayesian rationality; human cognition often deviates.

  4.  **No Downstream Decision:**
      *   **Why:** If *no possible outcome D* would ever change your optimal action from A₀, then VoI = 0. Running the experiment gains you nothing, but (under Good's assumptions) doesn't hurt you.
      *   **Your GP Friend:** This is her likely error. Ordering a test "because it might be useful" when she *knows* she wouldn't change treatment regardless of the result (e.g., a mild symptom with clear guidelines) yields VoI = 0. It's not *harmful* under strict Good assumptions (just wasteful of resources), but in the real world (costs, potential for misinterpretation, patient worry), it can easily become net negative. She's confusing "not harmful (in a narrow sense)" with "worth doing". It's only "worth doing" if VoI > Acquisition Cost (which includes all burdens).

  **III. "More Information is Always Better" - A Stronger (and Often False) Claim**

  *   **The Claim:** This is distinct from and **stronger** than Good's theorem. Good says VoI (for a *single* piece of free info) ≥ 0. This claim says that for *any two* potential information sources E1 and E2, if E2 provides "more" information than E1, a rational agent always prefers E2.
  *   **The Problem:** "More information" is ambiguous. "More" in what sense?
  *   **The Solution (Blackwell's Theorem):** The rigorous condition is **Blackwell Sufficiency**. Information structure E2 is "more informative" than E1 (E2 ≥ᴮ E1) if E2 can be statistically transformed (via a noisy channel/lottery) to mimic E1. Formally, there exists a conditional probability P(E1|E2) such that for all states, P(E1|State) = ∑_{E2} P(E1|E2)P(E2|State).
  *   **The Result:** *If E2 ≥ᴮ E1* (E2 is Blackwell-sufficient for E1), *then* any Bayesian decision maker prefers E2 to E1 ex ante. The VoI of E2 is ≥ VoI of E1.
  *   **What Goes Wrong Without Blackwell Sufficiency?**
      *   Information can be *incomparable*. E1 might be better for distinguishing State A from B, while E2 is better for distinguishing State B from C. Which is "more informative" depends on the decision problem and prior.
      *   **"More" can be harmful:** Consider two thermometers:
          *   E1: Perfectly accurate.
          *   E2: Perfectly accurate *or* always reads 0°C (you don't know which mode it's in).
          *   E2 provides "more data" (a number) but is strictly worse than E1. It's not Blackwell-sufficient to E1 (E1 is more informative!). E2 can mislead you severely if you don't know it's faulty.
      *   **Non-Statistical Dependence:** Signals might be correlated in ways that make their *combination* less valuable than the sum of their individual values, or even negative if they induce overconfidence in a wrong hypothesis.

  **IV. Dissecting the Slogans**

  1.  **"(a) A test is always worth running as long as it's free."**
      *   **Relation to Theorem:** Directly invokes Good's theorem.
      *   **Where it Drifts:** It confuses **"not harmful" (VoI ≥ 0)** with **"worth doing" (VoI > Acquisition Cost)**. Good only guarantees VoI ≥ 0.
      *   **Why it Fails (In Practice):**
          *   **VoI = 0:** If the test *cannot* change the action, it's not worth the *any* real-world cost (time, resources).
          *   **Non-Instrumental Utility:** Knowing the result might cause distress (harm).
          *   **Misinterpretation Risk:** You might update incorrectly and choose a worse action.
          *   **Hidden Costs:** "Free" rarely exists (patient time, anxiety, system costs, opportunity cost).
      *   **Verdict:** **A slogan drifted loose.** Good says it *can't actively hurt under ideal assumptions*. It does *not* say it's always worth acquiring. Your suspicion about your GP friend is correct.

  2.  **"(b) It is never rational to prefer not to know something."**
      *   **Relation to Theorem:** An overextension claiming the *negative VoI* case of Good's theorem never happens.
      *   **Where it Drifts:** Ignores the **Utility Depends on Beliefs/Information** assumption.
      *   **Why it Fails:** As per your sister-in-law's case and others, if the state of *knowing* D directly reduces utility (anxiety, spoiled surprise, psychological burden), preferring ignorance is perfectly rational. Good's theorem doesn't apply here.
      *   **Verdict:** **A slogan drifted loose (and false).** Rationality depends on the agent's utility function. Avoiding distressing knowledge can be optimal.

  3.  **"(c) A rational agent always prefers more information to less."**
      *   **Relation to Theorem:** A much stronger claim inspired by, but not equivalent to, Good's theorem or Blackwell.
      *   **Where it Drifts:** Assumes "more" is well-defined and universally better. Ignores Blackwell Sufficiency.
      *   **Why it Fails:**
          *   Without E2 ≥ᴮ E1, E2 might be worse than E1 for the specific decision.
          *   "More" raw data isn't equivalent to "more valuable" information (e.g., faulty thermometer E2 vs. perfect E1).
          *   Information can be redundant, misleading, or directly harmful via non-instrumental utility.
      *   **Verdict:** **A slogan drifted loose (and generally false).** Only holds under specific conditions (Blackwell Sufficiency) and assuming instrumental utility only. "More" ≠ "Better".

  **The Takeaway:**

  Good's theorem is a robust but **narrow** result: *Under strict Bayesian assumptions (outcome-only utility, correct updating, free access, potential for action change), the expected value of seeing free information before acting cannot be negative because you can ignore it.*

  Its power comes from the "free disposal" of information. Its fragility comes from the assumptions:

  1.  **Utility Independence from Beliefs:** The most common and significant point of failure in real life (your sister-in-law).
  2.  **Costless Acquisition/Processing:** Real information has burdens.
  3.  **Correct Bayesian Updating:** Humans are imperfect Bayesians.
  4.  **Potential for Action Change:** Useless information has VoI=0, not >0.
  5.  **"More is Better" Requires Blackwell Sufficiency:** Information structures need a specific dominance relation.

  The slogans (a), (b), and (c) are significant overextensions. Good's theorem provides a foundational justification for seeking information *instrumentally* under ideal conditions, but it **does not** imply information is always beneficial, that avoiding knowledge is irrational, or that more data is universally preferred. Recognizing where the assumptions break is essential for applying decision theory to messy human realities. Your intuition as a scientist – spotting the points where the model strains against reality – is precisely correct.
