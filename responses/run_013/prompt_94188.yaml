  Leaf positions: Hard incompatibilism (threatened by mechanism), classical compatibilism (unthreatened if flexible), metacognitive theories (require second-order capacity). An unnamed slot might be "flexibility suffices even without metacognition" - plausible but rarely defended explicitly.

  Biggest awkward commitments: Hard incompatibilists must accept thermostats have no free will (reductio they embrace). Metacognitive theorists struggle with sleepwalkers who seem agential but unreflective.

