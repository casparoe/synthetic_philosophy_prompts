  Next, flexibility: if rigidity is the threat, is the solution gradual flexibility (degree) or a categorical shift like metacognition (kind)? This splits the rigidity branch.

  Then the capacities question: does breaking loops require just behavioral variability (first-order) or self-monitoring (second-order)? This further refines the flexibility branches.

