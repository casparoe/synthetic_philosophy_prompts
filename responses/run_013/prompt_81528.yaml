prompt: |-
  I'm a novelist, so this is going to come out sideways, but bear with me. I'm about 200 pages into a book and I've hit a scene I can't write until I settle something. My protagonist, Dana, is a hypocrite, but not the cartoon kind: for two years she's been on her brother's case about how he handles their mother's money — he's vague, he's late with the care-home invoices, he treats the whole thing as an afterthought — and she does the same thing herself, only worse, and genuinely cant see it. The scene is in a hospital car park, he finally says some version of you have no right to say this to me, and I need that to land as a real objection and not just as a move in a fight. Trouble is I dont actually know what the objection is. My writing group and I keep using the word standing and talking past each other: one of them says standing isn't a moral matter at all, it's social, like how you can only say you're welcome if you actually helped; another says no, what's wrong with Dana is that she's setting herself above him and that's the whole of it; a third says it's a red herring and the only question is weather what she says about the invoices is true. My own hunch is that there's a difference between having no right to say it to him and having no right to think less of him, and that those can come apart — but I might just be inventing a distinction because it's convenient for my scene, and I'd rather find out now.

  So write me the desiderata: what does any adequate theory of standing to blame have to deliver before I should believe a word of it? Concretely — the cases it has to get right (the plain hypocrite; the reformed one who blames you for exactly what she used to do; the one who does the thing too, just less than you; the one who's right but has no business in your life at all; the one who is impeccable on the matter but is only saying it to hurt you; the one who'd have done exactly what you did if he'd ever been given the chance; and whatever else you think is load-bearing); the distinctions it can't be allowed to collapse (lacking standing vs. being wrong about the facts; blame as something you say vs. blame as something you feel; standing vs. what you're permitted to feel; forfeiting standing vs. never having had it; the brother's standing vs. a stranger's); and the ordinary facts about how blaming actually goes that it can't contradict. For each requirement, give me the case or the consideration doing the work — I don't want a list of abstractions. Then tell me which requirements you think are real and which are one camp's preference dressed up as a datum, and if some subset of them can't be satisfied together, say which and why, because that's the part I most want. If you had to put money on the single requirement that eliminates the most candidate theories, which one is it? Bullets are fine, a page or so. And please actually take a position — a list I can disagree with beats a survey, and if my speech/attitude distinction is a fiction I cooked up for the sake of my scene, say so and tell me what to do with the car park instead.
reasoning: |-
  Okay, the user is a novelist struggling with a scene where the protagonist Dana, a hypocrite, is confronted by her brother in a hospital car park. He tells her she has no right to criticize him about handling their mother's money, and the user needs this objection to feel real, not just a fight tactic. The core issue is understanding the concept of "standing to blame" – what makes Dana's brother's objection valid?

  The user has discussed this with their writing group, who have different interpretations: one sees standing as social (like only saying "you're welcome" if you helped), another as moral (Dana setting herself above him), and a third thinks it's irrelevant if her facts are true. The user suspects a distinction between having no right to say something versus no right to think less of him.

  The user wants a practical framework to evaluate theories of standing to blame. They need concrete cases the theory must handle, distinctions it must preserve, and real-world observations it can't contradict. They also want to know which requirements are essential versus preferences, and if any conflict. Plus, they need a decisive requirement that disqualifies most theories and a verdict on their speech/attitude distinction.

  First, I need to address the key elements: cases, distinctions, and contradictions. The cases mentioned are: plain hypocrite, reformed hypocrite, less-severe hypocrite, uninvolved truth-teller, malicious truth-teller, and envious non-doer. I should add "clean hands" as someone with no hypocrisy but unrelated involvement.

  Distinctions to maintain include: standing vs. factual correctness, speech vs. attitude, forfeited vs. never-had standing, and brother vs. stranger. Observations from real life: hypocrites' blame often backfires, blame can be valid even if hypocritical, and hypocrites can sometimes speak truth effectively.

  Now, for requirements, I'll list them with concrete examples. The irreconcilable conflict is between the "Clean Hands" case and the "Spiteful Truth-Teller" because one values factual correctness while the other emphasizes intent. The speech/attitude distinction is valid and crucial for the scene. The brother can say Dana lacks standing to voice blame but not that she can't feel it, which fits the car park confrontation.

  The killer requirement is that hypocrisy doesn't negate factual correctness. Theories claiming hypocrites lose standing entirely fail because truth matters independently. For the scene, Dana's brother can object to her voicing criticism due to her worse hypocrisy but not deny the truth of her claims. This makes his objection substantive and not just defensive.
answer: |-
  Here's your desiderata for "standing to blame," built for your scene. I'll take a firm position: **Your hunch about the speech/attitude distinction is correct and crucial.** The brother's objection lands because Dana lacks the *standing to voice blame to him*, not necessarily because she lacks the right to *believe* he's wrong or even to *feel* disapproval privately. This separation makes his objection substantive, not just deflection.

  ### Desiderata: What Any Adequate Theory MUST Deliver

  1.  **Hypocrisy Negates Voicing Blame, Not Necessarily the Truth:** It must explain why the **Plain Hypocrite (Dana)** cannot *effectively* or *appropriately* voice blame to her brother *for this specific failing*, *even if* her factual claims about his late invoices are true. (Case: Dana herself is worse). This is the core of the parking lot scene.
  2.  **Reformed Hypocrites Can Speak:** It must allow the **Reformed Hypocrite** to credibly blame someone for the *exact* thing they used to do, *provided* their reform is genuine and acknowledged. (Case: An ex-addict, now 10 years clean, telling a current addict they need help).
  3.  **"Less Than You" Hypocrisy Still Undermines Standing:** It must show why the **"Just Less Than You" Hypocrite** also lacks full standing. (Case: Dana *sometimes* pays her own share late, or forgets minor expenses, while berating her brother for major tardiness). The core is *doing the same kind of wrong*, not the identical degree.
  4.  **Irrelevant Truth-Teller Has No Standing:** It must show why **"No Business In Your Life" Truth-Teller** lacks standing, even if factually correct. (Case: A nosy neighbor, uninvolved in the mother's care, overhears and chastises the brother about the invoices in the hospital hallway).
  5.  **Malicious Intent Undermines Standing:** It must show why the **Spiteful Truth-Teller** ("impeccable on the matter but only saying it to hurt you") lacks standing, even if factually correct. (Case: A estranged relative who hates the brother uses the invoice issue purely as ammunition in a fight).
  6.  **Envy Isn't Hypocrisy (Neutral):** It must *not* automatically disqualify the **"Would Have Done It" Non-Doer**. Lacking opportunity isn't the same as hypocrisy. Standing might depend on *why* they speak (e.g., genuine concern vs. envy). (Case: A poor cousin who genuinely believes paying invoices late is wrong, but admits he'd struggle if he had the responsibility, chastises the brother).
  7.  **"Clean Hands" Matters:** It must affirm that someone with **Clean Hands and Direct Stake** has strong standing. (Case: The care home administrator, who always handles finances impeccably, calls the brother about the late payment).
  8.  **Distinguish Standing from Factual Correctness:** It must *never* collapse **Lacking Standing vs. Being Wrong About the Facts**. Dana can be factually right *about the brother's failing* yet still lack standing *to voice blame to him*. (This is vital for the scene – brother isn't denying the facts, he's rejecting *her* as the valid voice of that blame).
  9.  **Distinguish Blame as Speech vs. Attitude:** It must preserve the difference between **Blame as Something You Say (Voiced) vs. Blame as Something You Feel (Attitude)**. Dana can *feel* her brother is wrong (and maybe even be justified in feeling so), while lacking the standing to *express* that blame *to him* in a condemnatory way. This is your key distinction.
  10. **Distinguish Forfeiture from Absence:** It must differentiate **Forfeiting Standing (Like Dana)** vs. **Never Having Had Standing (Like the Nosy Neighbor)**. Dana had standing as sister/care-sharer *until* her own hypocrisy undermined it. The neighbor never had it.
  11. **Relationship Modulates Standing:** It must explain why the **Brother's Standing vs. a Stranger's** differs. The brother *might* have standing to voice certain criticisms *to Dana* about her hypocrisy that a stranger wouldn't, precisely *because* of their shared burden and history. His objection gains force *because* he's the wronged party *in this specific dynamic*.
  12. **Match Real-World Dynamics:** It cannot contradict the **Ordinary Facts**:
      *   Hypocrites' voiced blame often provokes resentment/defensiveness rather than remorse (Parking lot scene).
      *   People *can* sometimes be shamed into better behavior by hypocrites, but it feels dirty and breeds resentment (Dana's nagging might have kept him *somewhat* on track, but toxically).
      *   Voiced blame from someone with clean hands *feels* different and carries more moral weight (Care home administrator).
      *   We often accept criticism more readily from those who admit past failings (Reformed hypocrite).

  ### Conflicts & Killer Requirement

  *   **The Irreconcilable Conflict:** **#4 (Nosy Truth-Teller has no standing) vs. #5 (Spiteful Truth-Teller has no standing) vs. #7 (Clean Hands has standing).** Why? Because theories emphasizing *only* factual correctness (#7) struggle with #4 & #5. Theories emphasizing *only* relationship/role (#4) struggle with #7. Theories emphasizing *only* intent (#5) struggle with #4 & #7. **Resolution:** A good theory needs a *combination* – standing requires a *legitimate stake* (ruling out #4), *relatively clean hands on the matter* (ruling in #7, ruling out Dana), *and non-malicious primary intent* (ruling out #5). No single factor is absolute.
  *   **The Killer Requirement (Eliminates Most Theories):** **#8: Distinguish Standing from Factual Correctness.** Any theory that says "If the blame is factually correct, the blamer always has standing" (#3 writing group member's view) fails instantly on #1 (Plain Hypocrite), #4 (Nosy Truth-Teller), and #5 (Spiteful Truth-Teller). It reduces the brother's objection in the parking lot to mere defensiveness, ignoring the genuine relational wrong Dana commits by speaking *as his blamer* while being worse. This requirement forces the theory to grapple with the *social/moral relationship* of blaming, not just propositional truth.

  ### The Verdict & Your Scene

  *   **Your Speech/Attitude Distinction (#9) is REAL and NECESSARY.** It's the core of why the brother's objection lands. He's not (just) saying "You're wrong about the invoices." He's saying, "Given *your own actions*, you *forfeit the right* to adopt the position of *my moral judge* on this specific issue and voice that judgment *to me*." He rejects her *role* as his blamer.
  *   **"Standing" (#1) is fundamentally about the *moral authority to perform the act of voicing blame within a relationship*.** It's social/moral, not purely epistemic (about truth). Dana's hypocrisy (#1, #3) destroys that authority *with her brother* for *this failing*. She forfeited it (#10).
  *   **What to do in the Car Park:** The brother's line needs to target Dana's *presumption*, not the facts. Something like:
      *   "You don't get to stand there and lecture *me* about this, Dana. Not after two years of your own crap. Where were *your* payments last quarter? Where's the spreadsheet *you* promised? You don't get to be *my* conscience on Mom's money."
      *   **Key:** He *doesn't* say "The invoices aren't late!" (denying facts). He says "*You* don't get to say this *to me*" (rejecting her standing). He might *implicitly* concede the facts ("lecture me about *this*") while explicitly rejecting *her* as the legitimate voice of condemnation. His anger stems from the relational betrayal of her hypocrisy *while* she positioned herself as his critic.

  **Putting Money On It:** If I had to bet, the requirement that sinks the most simplistic theories is **#8 (Standing ≠ Factual Correctness)**. It forces the theory to confront the messy reality that *who* says it, *to whom*, and *in what context* matters as much as *what* is said when it comes to the moral legitimacy of voicing blame. Your scene hinges on this. Dana's facts might be right, but her *act* of voicing blame to her brother is wrong because *she* is the one doing it. That's the brother's real objection.
