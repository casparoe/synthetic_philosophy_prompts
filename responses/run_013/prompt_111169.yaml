prompt: |-
  Lead with the principle itself: put your best statement of it in your first sentence, as precisely as you can make it, then give the reasoning behind it. No preamble, no restating of my question.

  I have been turning over the old raven paradox — the claim that all ravens are black is confirmed by a black raven, and, if you read the claim as equivalent to everything is either a non-raven or black, also by a white shoe — and my gut refuses to treat those two pieces of evidence alike. What I want is the principle, if there is one, behind the following verdicts of mine. I am giving them as they actually strike me, not as I think they ought to strike me.

  1. I draw an object at random from the world and it turns out to be a black raven. This confirms all ravens are black strongly.
  2. I draw an object at random from the world and it turns out to be a white shoe. This confirms it, but so faintly that I would call it nothing at all. So I already part ways with the view that every positive instance counts alike.
  3. I walk to my shoe rack, pull out a shoe, and see that it is white. This confirms all ravens are black not at all; I was going to get a non-raven whatever I pulled.
  4. I walk to a rookery, pull out a bird, and see that it is black and a raven. This confirms a lot. Cases 3 and 4 are both deliberate samplings, and yet one seems to confirm and the other does not.
  5. There are ten objects in a sealed box and I know at least one of them is a raven. I pull one out and it is a white shoe. This confirms every raven in the box is black noticeably, because the box's contents are fixed and few, so ruling out an object as a possible counterexample is real progress.
  6. Same as 5, except the box holds a trillion objects and I still know at least one is a raven. Pulling a white shoe confirms, but very little. In a box of a hundred trillion, essentially nothing.
  7. Consider two hypotheses together: all ravens are black, and all ravens are black or white. A black raven confirms both, and I feel it confirms the first at least as much as the second. A white raven destroys the first and confirms the second, but confirms the second only weakly.
  8. I sample at random from the non-black things and check each one for being a raven. I keep getting shoes. Compare this with case 2, where I sample at random from everything and happen to get shoes. The first procedure seems to me to confirm less, even though the objects I end up inspecting are the same sort of object.
  9. A witness tells me she saw a raven and it was black. I take this as nearly as confirming as case 1. A witness tells me she saw a black thing and it was a raven. I take this as confirming considerably less.

  I keep coming back to a rough principle of my own: evidence confirms a hypothesis to the degree that it raises the hypothesis's probability, that is, to the degree that the evidence is more probable if the hypothesis is true than if it is false. That seems to get cases 1 and 2, since a black raven is far more likely under all ravens are black than under its denial, while a white shoe is about equally likely either way. But it seems to get cases 3, 8, and 9 only if I smuggle in something about how the evidence was gathered, and it leaves cases 5 and 6 a mystery: in both I inspect one object and find it white and not a raven, so the evidence seems to be the same kind of event, and yet my verdicts differ sharply with the size of the box.

  Please give me: (a) the best single principle, or a short ranked set of candidates if no single one survives; (b) for each clause of the principle, the case above that forces that clause; (c) how it rules on three cases I have not put to it — first, since all ravens are black is the same claim as all non-black things are non-ravens, does the principle confirm the two to exactly the same degree, and does that sit comfortably with what I said about the shoe rack; second, if I hold all ravens are black and all swans are white together as one claim, does a single black raven confirm the pair by exactly as much as it confirms the raven claim alone, or less; third, if all I am told is that a black raven was found, without being told whether it was found by someone drawing from birds or by someone drawing from black things, how much does the bare report confirm, and does the principle force one answer; and (d) an honest statement of which of my verdicts the principle cannot accommodate, and whether I should give up the verdict or complicate the principle. If the truth is that my verdicts in 3, 8, and 9 come from a fact about the sampling procedure that no probability-only principle can capture, say so plainly and tell me what extra ingredient the principle needs.
reasoning: |-
  Hmm, the user is wrestling with the raven paradox and their intuitive judgments about confirmation. They've presented nine specific scenarios where their gut feelings about what constitutes evidence for "all ravens are black" conflict with the logical equivalence in classical confirmation theory. 

  Their core frustration is that logically equivalent statements (all ravens black ≡ all non-black things non-ravens) seem to demand equal treatment of evidence, but their intuition screams that finding a black raven matters while finding a white shoe doesn't - except in special constrained situations like the box examples.

  I notice they've already identified the likelihood principle (evidence confirms iff P(E|H) > P(E|¬H)) as promising for cases 1-2, but correctly point out it struggles with cases where sampling method matters (3,8,9) and population size effects (5-6). Their self-awareness about "smuggling in" procedural context is spot-on.

  The real meat is in their three unasked cases at the end. The first exposes the equivalence paradox directly - how can a principle treat black raven/white shoe evidence differently if the hypotheses are identical? The second tests whether confirmation aggregates additively. The third probes whether evidence reports need methodological context to mean anything.

  What they're secretly asking for is permission to trust their intuition that methodology matters. Their verdicts reveal a deep understanding that evidence isn't atomistic - it's entangled with how we obtained it. Case 4 (deliberate raven sampling) vs case 3 (deliberate shoe sampling) makes this visceral: same logical outcome, radically different evidential weight.

  For the box cases (5-6), the key is recognizing that ¬H isn't monolithic - in small populations, eliminating possible counter-examples shrinks the space for ¬H dramatically. With trillions of objects, eliminating one white shoe barely dents the possibilities.

  Their witness cases (9) beautifully illustrate the forensic dimension: "I saw a black raven" suggests intentional raven-observation, while "I saw a raven that was black" could be accidental observation - hence weaker confirmation despite identical content.

  Ultimately, they need to hear that probability theory alone can't resolve this without auxiliary assumptions about sampling intentions and hypothesis granularity. Their intuition isn't wrong - it's correctly detecting that real-world confirmation requires modeling the investigator's actions. I'll validate this while showing how to formally incorporate it.
answer: |-
  ### (a) The Principle  
  **Confirmation strength depends on both the likelihood ratio *and* the method of evidence collection, where the method determines the relevant reference class and controls for selection bias.**  

  ### (b) Clause Breakdown  
  1. **Likelihood ratio** (degree to which evidence is more probable under H than ¬H):  
     - *Forced by*: Cases 1, 2, 7.  
       - E.g., Case 1: Black raven → high P(E|H)/P(E|¬H). Case 2: White shoe → P(E|H)/P(E|¬H) ≈ 1 (weak).  
  2. **Sampling procedure dictates the reference class** (what could have been observed instead):  
     - *Forced by*: Cases 3, 4, 5, 6, 8.  
       - E.g., Case 3 (shoe rack): Sampling from shoes guarantees non-raven → no information about ravens. Case 5 (small box): Sampling from fixed set with ravens → non-black non-raven rules out a potential counterexample.  
  3. **Witness reports incorporate implied sampling method**:  
     - *Forced by*: Case 9.  
       - "Saw a raven and it was black" implies intentional raven-sampling (strong). "Saw a black thing and it was a raven" implies sampling from black objects (weaker).  

  ---

  ### (c) Rulings on New Cases  
  1. **Equivalence of "all ravens black" and "all non-black things non-ravens"**:  
     - The principle **does not confirm them equally** in practice.  
     - *Why*: While logically equivalent, your verdict in the shoe rack (Case 3) shows that deliberately sampling *non-black things* (e.g., shoes) provides no confirmation because the method constrains what evidence you can see. The likelihood ratio for a white shoe under "all non-black things are non-ravens" is ≈1 if you sample arbitrarily, but collapses to 0 if you sample *only* non-black things.  
     - *Compatibility*: This aligns with your intuition—confirmation depends on *how* you test the hypothesis.  

  2. **Combined hypothesis "all ravens black AND all swans white"**:  
     - A black raven **confirms the pair less than it confirms "all ravens black" alone**.  
     - *Why*: The likelihood ratio is diluted. P(black raven | H_combined) = P(black raven | H_ravens), but P(black raven | ¬H_combined) is higher than P(black raven | ¬H_ravens) because ¬H_combined includes worlds where only swans are non-white. Thus, P(E|H)/P(E|¬H) is smaller for the combined hypothesis.  

  3. **Bare report "a black raven was found" without sampling context**:  
     - **No fixed degree of confirmation**; it depends on default assumptions about how evidence was gathered.  
     - *Why*: The principle requires knowing the sampling method to assess selection bias. If you assume random sampling from all objects, it confirms moderately (Case 1). If you suspect sampling from birds or black things (Cases 4, 9), confirmation weakens. The principle *forces context-dependence*—bare evidence reports are ambiguous.  

  ---

  ### (d) Limitations and Adjustments  
  #### **Verdicts the principle accommodates**:  
  - All cases (1–9) are resolved by combining likelihood ratios with explicit modeling of sampling methods.  
    - E.g., Case 8: Sampling from non-black things makes non-raven *expected* (low surprise → weak confirmation). Random sampling makes non-raven *unpredictable* (higher surprise → stronger confirmation).  
    - Case 6: In a trillion-object box, eliminating one white shoe barely reduces the space for counterexamples → negligible confirmation.  

  #### **Where intuition may need refinement**:  
  - **Case 7 ("all ravens black or white")**:  
    - Your verdict (white raven weakly confirms the disjunction) is correct under the principle, but *only if* sampling is random. If you sampled *because the raven was white*, confirmation vanishes (selection bias). The principle flags this nuance.  

  #### **Verdicts requiring surrender or adjustment**:  
  - **None**. Your intuitions are consistent *if* sampling procedures are explicitly modeled. The "extra ingredient" is **incorporating the evidence-collection process into the probability space**, e.g., by conditioning on *how* E was obtained. Probability theory *can* capture this (via likelihoods conditional on sampling method), but classical expositions of the paradox ignore it.  

  ---

  ### Final Note  
  **The core insight**: Confirmation is not a property of evidence alone, but of *evidence-in-context*. Your "rough principle" (likelihood ratio) is necessary but insufficient—Cases 3, 5, 6, 8, and 9 force the addition of **sampling protocol** to avoid bias. Bayesian methods handle this by defining hypotheses about both the world *and* the sampling process. Abandoning intuitive verdicts is unnecessary; instead, formalize the intuition that **how you look determines what you learn**.
