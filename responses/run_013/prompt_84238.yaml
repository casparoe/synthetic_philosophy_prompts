prompt: |-
  Had a two-hour row with a mate last night about whether a volcano can 'cause' a revolution, and I've come out of it with a pattern I can't put a name to. It runs like this. He says the Tambora eruption gave us the year without a summer, which is why we got Frankenstein — the volcano doing the work of an agent, deciding things. I push back, and he backs off: obviously I'm not a geographical determinist, the climate was one factor among many, human choices mattered. Fine. Ten minutes later the volcano is deciding things again, and when I ask what would've happened without it he says counterfactuals aren't the kind of question historians can answer. So the non-human thing gets full agency in the telling and takes on no causal commitments the moment anyone asks. Plagues ending feudalism, a drought toppling a kingdom, germs doing the work of empire — same two-step every time, and the case where the volcano changed nothing never comes up at all.

  Whats the name for this, if there is one? I dont think 'environmental determinism' is it — he'd be insulted by the label and he isn't claiming the outcome was inevitable. But I don't just want a label; I want the thing carved up: what exactly this move is, what the nearest established concept is and how it differs from it, and where the edges are. If nothing established fits, coin something and give me its boundary cases. Also keep what's genuinely settled in the literature apart from what's contested — don't sell me a live dispute as the consensus. British English, ta.
reasoning: |-
  Okay, let me unpack this user's query. They had a heated debate with a friend about whether volcanoes can "cause" revolutions, using the Tambora eruption leading to "Frankenstein" as an example. The friend keeps shifting between granting the volcano agency and then retreating to multifactorial explanations when challenged. The user wants to name this rhetorical pattern and analyze its structure.

  First, I need to identify the core issue. The friend isn't a strict environmental determinist—they acknowledge human choices matter. But they repeatedly attribute causal power to non-human actors (volcanoes, plagues) while avoiding counterfactual accountability. This feels like a specific logical maneuver. 

  I recall environmental history debates about "actancy" versus "agency." Latour's actor-network theory might be relevant here—he grants "actancy" to non-humans but reserves intentional "agency" for humans. The friend seems to conflate these by making the volcano "decide things." That's the first layer: smuggled anthropomorphism.

  Then there's the evasion tactic. When pressed for counterfactuals ("what without the volcano?"), the friend retreats to historian's epistemic humility ("we can't know alternatives"). This creates an asymmetry: the volcano gets credit for outcomes but faces no burden of proof for its necessity. It's a heads-I-win-tails-you-lose setup. 

  The user also mentions boundary cases. We'd need to distinguish this from: 
  - Technological determinism (where tools "cause" social change) 
  - Strong environmental determinism (outcomes are inevitable) 
  - Mere multifactorial analysis (where environment is one neutral factor) 

  What's unsettled in academia? The ontological status of non-human forces is hotly contested. Latourians grant them actancy; traditional historians reject causal parity; others compromise with "distributed agency." But nobody serious thinks volcanoes "decide" things—that's clearly a category error. 

  For coining a term... "Anthropomorphic Actantial Drift" captures the two-step: 
  1. Drift into describing non-humans as intentional agents 
  2. Drift away when challenged 
  "Actantial" nods to theory; "drift" implies the slippery evasion. 

  User seems philosophically savvy—they'll appreciate precise dissection. Should flag where consensus exists (rejecting literal volcano agency) versus open debates (non-human actancy). And avoid jargon where possible; they want clarity, not buzzwords. 

  British English check: "mate," "ta," "rubbish counterfactual"—got it. No "determinism" accusations since that'd misrepresent the friend's position. Focus on the rhetorical dodging.
answer: |-
  Right, this is a fascinating and very specific pattern of argumentation that goes beyond simple environmental determinism. It's a **rhetorical two-step** that grants non-human forces *narrative agency* while simultaneously *insulating them from causal scrutiny*. Here's the breakdown:

  1.  **The Core Pattern: Anthropomorphic Actantial Drift**
      *   **Step 1 (Narrative Agency):** The non-human entity (volcano, plague, drought, germ) is described using active, intentional, or agentic language ("**gave us** the year without a summer," "**deciding** things," "**doing the work**," "**ending** feudalism," "**toppling** a kingdom"). This embeds it within the narrative as a primary *actor* or *driver*, shaping events decisively.
      *   **Step 2 (Causal Insulation):** When challenged on the *necessity* or *sufficiency* of this factor – specifically via counterfactual questioning ("what would have happened *without* it?") – the arguer retreats to a position of epistemic humility or complexity ("counterfactuals aren't answerable," "it was just **one factor among many**," "human choices mattered"). This shields the non-human entity from having its specific causal *contribution* rigorously evaluated or falsified.

  2.  **The Name & Established Concepts:**
      *   **Nearest Established Concept: Narrative Conflation of Actancy and Agency (drawn from Actor-Network Theory - ANT).**
          *   **Actancy:** (Bruno Latour, Michel Callon) The *capacity* of any entity (human or non-human) to *make a difference*, to affect the course of events within a network. A volcano has high actancy – it *does* things (erupts, spews ash, cools climate).
          *   **Agency:** Typically reserved for entities with *intentionality* and *reflexivity* (humans, sometimes animals). Agency implies purpose and understanding of actions.
          *   **The Conflation:** Your mate is *conflating* the volcano's undeniable **actancy** (it *did* cause climatic effects) with **agency** (implying it *intended* or *decided* to trigger cultural/political outcomes like *Frankenstein* or revolutions). He attributes intentionality ("deciding things") where there is only powerful actancy. This is **anthropomorphism** applied to causal forces.
      *   **Why "Environmental Determinism" Doesn't Fit:** Environmental determinism posits the environment as the *primary*, often *inevitable*, shaper of human society/culture. Your mate explicitly *disavows* this ("one factor among many," "not inevitable"). His retreat in Step 2 shows he doesn't believe the volcano *determined* the outcome. The problem is the *language* and *attribution* in Step 1, not a hard determinist theory.
      *   **The Specific Name: Anthropomorphic Actantial Drift (AAD).**
          *   **Anthropomorphic:** Attributing human-like qualities (intention, decision-making) to non-human entities.
          *   **Actantial:** Related to the capacity to act/affect events (actancy).
          *   **Drift:** The *shift* or *slide* between granting full narrative agency (Step 1) and retreating to a shielded, non-falsifiable position (Step 2) when challenged. The causal weight *drifts* onto the non-human actor in the story but *drifts away* when accountability is demanded.

  3.  **Boundary Cases & Edges of AAD:**
      *   **Clear AAD:** Using verbs implying intention/purpose for non-humans leading to socio-political outcomes ("The plague *chose* to end feudalism," "The drought *decided* to topple the king"), followed by refusal to engage with counterfactuals about that specific factor.
      *   **Not Quite AAD (Strong Determinism):** "The Little Ice Age *made* the French Revolution inevitable. Without it, the Revolution wouldn't have happened." (This *does* engage the counterfactual, albeit deterministically).
      *   **Not Quite AAD (Careful Multifactorial):** "The Tambora eruption caused significant climate disruption, creating widespread famine and social unrest (*actancy*). This environmental stressor was a critical *catalyst* within a complex web of pre-existing political, economic, and social tensions that culminated in X events. While impossible to say revolution *wouldn't* have happened, Tambora's impact shaped its timing, intensity, and character." (Attributes actancy without agency; acknowledges complexity and the *difficulty* of counterfactuals without *refusing* the principle).
      *   **Edge Case (Subtle Agency Language):** "The volcano *triggered* the chain of events leading to revolution." ("Triggered" implies a decisive, initiating act, potentially drifting towards agency. If followed by counterfactual refusal, it leans towards AAD).
      *   **Edge Case (Accepting Counterfactual Possibility):** "The volcano was a major factor. *If* it hadn't erupted, the specific revolutionary fervour of 1816 might not have coalesced in that way, though other tensions likely would have surfaced later." (Acknowledges counterfactual possibility without claiming determinism – avoids AAD).

  4.  **What's Settled vs. Contested in the Literature:**
      *   **Settled Consensus (Rejected):**
          *   **Strict Environmental Determinism (à la Huntington):** The idea that climate/environment *directly* and *inevitably* determines complex human outcomes (culture, politics, intelligence) is widely rejected by modern historians and social scientists.
          *   **Literal Agency of Non-Humans:** No serious scholar argues that volcanoes, plagues, or germs possess conscious *intention* or *purpose* in shaping human history. Attributing conscious decision-making ("deciding things") to them is not a scholarly position.
      *   **Settled Consensus (Accepted):**
          *   **Non-Human Actancy/Force:** Environmental factors, technologies, and pathogens *do* exert powerful forces, have causal efficacy, and significantly shape the contexts, constraints, and possibilities within which humans act. They are legitimate historical actors in the sense of having *actancy*.
          *   **Complex Causality/Multifactorialism:** Historical events, especially large-scale socio-political changes like revolutions, result from the complex interplay of numerous factors (economic, political, social, cultural, intellectual, technological, environmental, contingent events, individual agency). Isolating a single "cause" is usually impossible and misleading.
          *   **Challenge of Counterfactuals:** Historians widely acknowledge that rigorously proving *what would not have happened* is epistemologically fraught. We deal with what *did* happen in its complex context. However, plausible counterfactuals are still used heuristically to *evaluate the relative significance* of different factors.
      *   **Actively Contested:**
          *   **The Ontological Status of Non-Humans (ANT & Beyond):** How *fundamentally* should we integrate non-humans into our causal explanations? While their *actancy* is accepted, ANT scholars argue for a "flat ontology" where humans and non-hums are symmetrical *actants* in networks. Many traditional historians strongly contest this symmetry, arguing that human agency (intention, meaning-making) is fundamentally different and primary in explaining human affairs. This is a major live debate.
          *   **Degree & Nature of Environmental Influence:** *How much* weight should be given to environmental factors versus social/political/economic ones in *specific* historical episodes (e.g., the fall of specific kingdoms, the rise of epidemics, social unrest) is constantly debated. The Tambora/Frankenstein link, or the role of the Little Ice Age in the French Revolution, are examples of ongoing scholarly discussion about *degree* and *mechanism*, not settled facts.
          *   **Language and Narrative:** Historians are increasingly attentive to how the *language* we use (like attributing agency to non-humans) shapes our understanding of causality, often unconsciously. This meta-discussion about historical narrative is active.

  5.  **In British English, Ta:**
      Your mate is pulling a classic bit of **"Anthropomorphic Actantial Drift" (AAD)**. He lets the volcano play the starring villain in the story ("it *gave us* Frankenstein!") like it's got a mind of its own, making things happen. But the second you ask the obvious question – "Hold on, what if it *hadn't* blown its top?" – he suddenly remembers it's just a big pile of rock and dodges with "Oh, well, counterfactuals are a bit rubbish, aren't they? It was just *one* thing among many!" It's giving the non-human thing all the dramatic credit in the telling, but none of the causal responsibility when questioned. Plagues ending feudalism? Same two-step. Germs conquering empires? Same dodgy shuffle. The case where the volcano changed nothing never gets a look-in because it ruins the dramatic tale. It's not that he's a full-blown determinist saying it *had* to happen; it's that he wants the volcano to be the *hero* (or villain) of the *story* without having to *prove* it was actually necessary. The settled bit is that volcanoes don't *decide* anything, and history's always messy. The live argument is about *how* much weight these big non-human forces really carry and whether we should talk about them *as if* they're characters in the drama.

  This pattern (AAD) allows for a compelling, simplified narrative centered on a dramatic non-human force, while using the undeniable complexity of history as a shield against having to defend the *specific necessity* of that force when challenged. It grants the non-human the *glory* of agency in the story but avoids the *burden* of proof that agency implies.
