prompt: |-
  For the past couple of years, the way I try to settle real disagreements with friends is the crux-finding exercise I first picked up in rationality workshops: rather than argue the object-level question, each of us names the sub-question we think the disagreement actually turns on, says what evidence would move us on it, and we iterate until we reach a claim where one person says "if I saw X I'd change my mind" and the other says "fine, and X is exactly what I'd expect either way." It has been genuinely useful, and I have recommended it to other people, but I have started to notice something about it that I would like you to help me think through. The technique works beautifully as long as both parties already share a large, unstated background: that there are facts independent of our wishes, that perception and memory are broadly reliable, that logic constrains what we may believe, that our words mean roughly the same thing to both of us, and that a certain kind of observation counts as evidence at all. Each of those is a claim of exactly the sort the procedure tells us to treat as a crux — something that could in principle be true or false, something we should be willing to put a probability on and revise. In practice, though, we never put them on the table; we treat them as the board the game is played on rather than pieces on it. And on the few occasions when I have tried, half-jokingly, to run the procedure on them — what evidence would move you on whether your memory is reliable, or on whether a contradiction really is a reliable sign of impossibility — the reply is not a crux. It is that I have stopped playing the game, or that the question is malformed, or that someone who doubts this much cannot be reasoned with at all. Meanwhile the practice itself is defended, when it is defended at all, by saying that it works, which strikes me as a different kind of move again.

  What I would like from you is a reconstruction of what theory of knowledge this practice presupposes. My own suspicion is that it is some version of the Wittgensteinian picture in On Certainty — that certain propositions function as hinges, or as the riverbed within which inquiry flows, and are exempt from doubt not because we have verified them but because doubting them would dissolve the very practices of doubting and justifying — but I want you to tell me whether that is really the best account or whether I am reading my own hobbyhorse into a practice that does not need it. In particular: which parts of the practice strictly require such an exempt class of propositions, and which parts would be served just as well by a plain foundationalism (some beliefs justified without inference) or by a coherentism (justification is holistic and no belief is privileged)? Does the practice need the hinges to be certain, or only to be undoubted in practice, and does that distinction bear on whether the practice is internally consistent, given that it demands justification for object-level claims while refusing to demand it for the framework claims? If the hinges are, as Wittgenstein also seems to allow, the sort of thing that can shift over time — if the riverbed can move — what would it look like for this practice to take that seriously, and what would have to change in how we argue if we did?

  And where is the practice underdetermined: what would have to be true of the arguers, or of the claims they argue about, for rival pictures to license exactly the same behavior? Please argue the reconstruction out rather than surveying the literature; I am not after a reading list, and if you think the practice is quietly committed to something worse than any of these options, say so and tell me why.
reasoning: |-
  Okay, the user is describing a crux-finding exercise they've been using to resolve disagreements, which involves identifying key sub-questions and evidence that would change one's mind. They notice that this technique relies on unstated background assumptions—like the existence of objective facts, reliable perception, logic, shared meanings, and evidence itself. These aren't treated as cruxes; trying to question them leads to pushback, like being accused of not playing the game. The practice is defended by saying it works, which seems circular. 

  The user suspects this aligns with Wittgenstein's "hinge propositions" from *On Certainty*—ideas so fundamental that doubting them undermines the entire process of inquiry. They want to know if this is the best explanation or if other epistemologies (foundationalism, coherentism) could work. They also ask if hinges must be certain or just undoubted, how the practice would handle shifting hinges, and where rival theories would result in the same behavior.

  First, I need to unpack why the background assumptions aren't treated as cruxes. The user's experience shows that challenging these leads to dismissal, not evidence-based discussion. This mirrors Wittgenstein's hinges: doubting them paralyzes rational discourse. For example, asking for evidence that memory is reliable is nonsensical because any evidence would rely on memory. 

  Comparing this to foundationalism: Foundationalism posits basic beliefs that justify others without needing proof. But hinges aren't beliefs; they're rules of the game. Foundationalism would still demand justification for basic beliefs, whereas hinges are immune to doubt by their role. Coherentism sees justification as holistic, but hinges are pre-justificational; they enable coherence.

  The user asks if hinges must be certain. Wittgenstein says they're not epistemically certain but practically immutable. The practice requires them to be undoubted, not indubitable. The circular defense ("it works") is pragmatic, not a flaw—it reinforces that hinges are validated by enabling the practice, not evidence.

  Regarding shifting hinges: If a hinge moves (e.g., shared meaning eroding in a multilingual debate), the practice would need to adapt by explicitly negotiating new rules. This is rare since hinges are deeply entrenched cultural/cognitive scaffolds.

  Underdetermination: Foundationalists and coherentists might use the same technique if their basic beliefs/coherent systems align externally. But Wittgenstein's view better explains the *breakdown* when hinges are challenged—the refusal to engage isn't irrational but protective of the framework.

  The user might also be wrestling with frustration when debates hit these walls. The deeper need is understanding how to navigate disagreements where core assumptions clash, or if such disagreements are resolvable at all. Recognizing hinges could help identify when a debate is foundational (e.g., political values) versus tractable within shared frameworks.

  In conclusion, Wittgenstein's hinges offer the most robust account because they explain the practice's structure, its breakdowns, and its pragmatic defense. Foundationalism and coherentism can't fully capture why doubting hinges feels like "cheating"—it’s not about belief justification but about the conditions for justification itself.
answer: |-
  Your analysis is acute, and Wittgenstein's "hinge propositions" from *On Certainty* provide the most compelling explanation for the phenomenon you observe. The crux-finding practice isn't merely *compatible* with this view; it *operationalizes* it. Let's reconstruct the implicit epistemology and address your specific questions.

  ### Core Epistemological Commitments of the Practice
  1.  **Hinges as Enabling Conditions:** The practice presupposes that rational discourse requires a shared, unquestioned framework. These "hinges" (e.g., reliability of perception, law of non-contradiction, shared linguistic meaning, the concept of evidence) are not empirical beliefs up for probabilistic assessment *within* the game. They are the *rules* that *define* the game of giving and asking for reasons. Doubting them isn't a move *within* the game; it's an attempt to dismantle the board.
  2.  **Pragmatic Justification:** The defense "it works" is crucial. Hinges aren't justified by foundational proof or coherentist fit *first*. Their justification is retroactive and performative: *in virtue of* holding them fast, the practice of rational inquiry, evidence-sharing, and belief revision *functions* and produces results we find valuable (e.g., resolving disagreements, building shared understanding, predicting the world). This is deeply Wittgensteinian: "My life consists in my being content to accept many things" (OC 344).
  3.  **Immunity to Standard Doubt:** The practice treats hinges as *practically* certain, not *logically* certain. Your friends' reactions ("you've stopped playing," "malformed question," "cannot be reasoned with") aren't irrational obstinacy; they correctly perceive that demanding a crux for a hinge is a category error. Any "evidence" offered for/against a hinge (e.g., "my memory is reliable because I remember past successes") inevitably *presupposes* the very hinge it tries to justify (reliability of memory/past experience). This creates a pragmatic circle, not a vicious logical one – the circle is the condition of possibility for the practice.
  4.  **Distinction from Foundationalism/Coherentism:**
      *   **Foundationalism:** Rejects it. Foundationalism posits *basic beliefs* (e.g., sense-data, self-evident truths) justified *without inference* but still *as beliefs*. Hinges are not beliefs *about the world* in the same way; they are *ways of acting* or *frameworks for holding beliefs*. Asking for justification for a basic belief is still *within* the game; asking for justification for a hinge is not. Foundationalism struggles to explain why demanding justification for its basic beliefs feels like stopping the game.
      *   **Coherentism:** Partially compatible, but insufficient. Coherentism sees justification as holistic within a web of beliefs. However, the practice treats hinges differently: they are the *scaffolding upon which the web is hung*, not just very well-connected beliefs. Coherentism *could* incorporate hinges as central nodes, but it struggles to explain the *absolute resistance to revision* and the *pragmatic breakdown* when they are questioned, rather than just a weakening of the web. The practice doesn't treat hinges as *revisable* based on coherence alone; it treats them as *preconditions* for assessing coherence.

  ### Addressing Your Specific Queries
  1.  **Which parts require hinges?**
      *   **The "Iterate Until" Step:** Requires hinges. The process assumes shared concepts of "sub-question," "evidence," "change of mind," and logical inference. Without these shared hinges, identifying a "crux" is impossible.
      *   **The Demand for Evidence:** Requires hinges. "Evidence" presupposes reliable perception/memory, shared meaning, and the concept of a fact independent of wishes. What counts *as* evidence relies on hinges.
      *   **The Resistance to Questioning Framework:** *Is* the requirement. The practice's breakdown when hinges are challenged is *diagnostic* of their hinge status. This resistance isn't a bug; it's a feature revealing the bedrock.

  2.  **Certain vs. Undoubted? Distinction & Consistency:**
      *   The practice requires hinges to be **undoubted *in practice***, not logically certain. Logical certainty is unattainable for empirical/conceptual hinges. The distinction *is* crucial for consistency.
      *   **Consistency Argument:** The practice demands justification for object-level claims *precisely because* they rest on the hinges. The hinges are the axioms enabling justification itself. Demanding justification *for the axioms* (the hinges) is incoherent *within the system those axioms define*. It's like demanding a proof that Modus Ponens is valid *using only Modus Ponens*. The practice is consistent *because* it recognizes this limit: justification applies *within* the framework, not *to* the framework itself. The framework is justified pragmatically ("it works").

  3.  **Shifting Hinges: What Would Change?**
      Wittgenstein acknowledges hinges can shift over time (e.g., belief in Newtonian physics as absolute framework vs. relativistic). For the crux practice to take this seriously:
      *   **Recognizing Shifts:** Participants would need meta-awareness that their *current* hinges *are* hinges and could potentially shift. This is difficult; hinges are often invisible until challenged.
      *   **Negotiating New Frameworks:** When fundamental disagreements *are* about potential hinge shifts (e.g., "Does objective truth exist?" in a postmodern debate, "Is logic culturally contingent?"), the crux-finding practice *as described* breaks down. Adapting it would require:
          *   **Stepping Outside:** Explicitly acknowledging the framework clash *as* a clash, not trying to find a crux within one framework.
          *   **Pragmatic Negotiation:** Shifting focus from "evidence for X" to "what shared practices/goals do we have, and what framework best enables *those*?" (e.g., "Do we both want predictively useful models? If so, let's adopt a framework where empirical evidence counts.").
          *   **Historical/Comparative Analysis:** Looking at how similar shifts occurred historically (e.g., the Copernican revolution, challenges to classical logic) and what pragmatic pressures drove them.
      *   **Changed Behavior:** Arguments wouldn't start with object-level cruxes. They'd start with diagnosing *which* hinges are potentially in conflict and engaging in meta-discourse about frameworks and their pragmatic consequences. The "evidence" becomes the *success or failure of practices* built on different frameworks.

  4.  **Where is the Practice Underdetermined?**
      The practice is *behaviorally* underdetermined concerning rival epistemologies **only if the arguers share the same hinges and never question them**.
      *   **Foundationalists & Coherentists:** Could use the crux-finding technique identically *as long as* their foundational beliefs or core web nodes *function* as hinges within the practice – i.e., they are treated as immune to revision *during that specific discourse* and enable the shared game. The *philosophical justification* they give later (basic belief vs. holistic fit) is irrelevant to the practice's execution *if the hinges are shared and unchallenged*.
      *   **What Must Be True:** Arguers must:
          1.  Share the relevant hinges implicitly.
          2.  Treat them as practically certain *for the duration and purpose of the discussion*.
          3.  Never attempt to apply the crux-finding procedure *to* the hinges themselves during the disagreement resolution process.
      *   **Where Rival Theories Diverge:** The underdetermination vanishes when:
          *   A hinge *is* challenged (Foundationalist tries to offer a basic belief justification, Coherentist tries to show fit, Wittgensteinian says the game has stopped).
          *   A disagreement *hinges* on a fundamental principle one party treats as foundational/basic and the other does not (e.g., a logical axiom, the authority of scripture vs. empirical science). Here, the rival justifications lead to different meta-responses.

  ### A Potential "Worse" Commitment? Pragmatic Circularity & Power
  You ask if the practice is committed to something "worse." The main risk isn't theoretical incoherence but **pragmatic circularity masking power dynamics**:
  1.  **"It Works" as Ideology:** The defense "it works" can be weaponized. *Whom* does it work *for*? *Which* disagreements does it resolve smoothly? It likely works best for disagreements *within* a shared paradigm held by people of similar epistemic cultures (e.g., scientifically-minded rationalists). It may fail or feel coercive when fundamental worldviews clash or when power imbalances exist (e.g., demanding "evidence" from someone whose epistemology values lived experience or tradition over empiricism). Declaring their framework "unreasonable" because it rejects your hinges reinforces your power.
  2.  **Hinges as Social Constructs:** The hinges aren't pure logical necessities; they are often contingent products of culture, language, and history. Treating them as absolute within the practice can inadvertently privilege one worldview and silence others. The refusal to engage ("cannot be reasoned with") can become a dismissal of legitimate, albeit fundamentally different, perspectives.

  ### Conclusion: Wittgenstein's Hinges are the Best Fit
  Your suspicion is correct. The crux-finding practice vividly illustrates Wittgenstein's hinge epistemology. It *requires* an exempt class of propositions that function as enabling conditions, justified pragmatically by the practice they make possible. Foundationalism and coherentism cannot fully account for the *absolute practical immunity* to doubt and the *categorical breakdown* when these propositions are challenged during the procedure.

  The practice is consistent *because* it recognizes the hierarchical structure: hinges enable justification for object-level claims; demanding justification *for* the hinges *using the tools they enable* is incoherent. The distinction between "practically undoubted" and "logically certain" is essential to this consistency.

  Taking shifting hinges seriously transforms the practice into a more complex, meta-level negotiation of frameworks based on pragmatic success criteria, moving beyond simple crux-finding. While foundationalists and coherentists can *use* the technique identically *if* their shared hinges align, Wittgenstein's account uniquely explains *why* the technique works when it does, why it breaks down when it does, and why the breakdown manifests as "you've stopped playing the game." The potential "worse" commitment is not theoretical but practical: mistaking culturally specific hinges for universal reason, potentially entrenching power structures under the banner of "what works." Recognizing the hinges *as* hinges is the first step towards mitigating this.
