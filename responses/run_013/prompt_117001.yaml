answer: |-
  ## Concomitance

  A finger brushes cotton, white and dry.  
  The furnace breathes its heat across the floor.  
  The fibres darken swiftly, curl, and die.  
  God gives the blackness as He gave before.

  A sharp knife parts the apple's greenish skin.  
  The open wound meets air, both sharp and clear.  
  The inner flesh turns quickly, brown, within.  
  God gives the brownness as He gave last year.

  The heavy stone slips from the climber's hold.  
  It falls through empty space, towards the ground.  
  It strikes the waiting rock, breaks, shatters cold.  
  God gives the breaking as He gave all round.

  The iron grows quite hot within the forge.  
  Cool water waits within the quenching pail.  
  Steam hisses loud as water meets the gorge.  
  God gives the hissing as He gave, without fail.

  A man walks slowly into blazing light.  
  Tall flames embrace his limbs, both arm and head.  
  His skin stays pale, untouched, unharmed, and bright.  
  God gives the whiteness as He gave, instead.

  The seed lies buried deep beneath the loam.  
  Soft rain descends upon the waiting earth.  
  Green shoots push upwards, seeking light, new home.  
  God gives the greening as He gave at birth.

  ---

  **Note on the form**

  The poem's structure embodies al-Ghazālī's critique of causal necessity. Each quatrain isolates a distinct, observed sequence (A, then B). The first three lines of each quatrain use unique, unrepeated end-rhymes (AAA), emphasizing the isolation of each event sequence; no "carry over" occurs, linguistically or imagistically. End-stopped lines enforce separation. The absence of connectives (causal or adversative) leaves the sequences as pure juxtaposition; the reader infers pattern solely through repetition, mirroring empirical observation. The unchanging, present-tense refrain ("God gives...") is the sole recurring element, representing the constant divine agency behind every distinct outcome, whether customary or exceptional. It names the Giver without specifying mechanisms, leaving "by what means" open. The unburned body (stanza five) receives identical formal treatment: same rhyme isolation, same refrain. This reflects the doctrine's core: the exception is not a different *kind* of event, only a different manifestation of the same divine will acting upon separate elements. The form itself demonstrates constant divine action amidst observed, non-necessary conjunctions.
