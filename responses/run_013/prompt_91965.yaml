answer: |-
  Here is a decision tree for navigating material constitution puzzles, designed to position students within the logical space using only case-based reasoning. Each branch is a concrete question about the cases, leading to terminal positions without presupposing labels.

  ---

  **The Decision Tree: Navigating Statues and Lumps**

  **Start with Case (a):** A lump of clay is molded into a statue. Later, the statue is squashed flat.  
  **Question 1:** *After squashing, is the statue still present?*  
  *   **Yes:** → Go to Question 2.  
  *   **No:** → Go to Question 3.  

  **Question 2 (Statue survived squashing?):** *Is the lump of clay still present after squashing?*  
  *   **Yes:** → The lump and statue always share all properties (including survival conditions). **Leaf: Identity View** (One thing, described two ways). *Embarrassment: Explaining why we thought the statue couldn't survive squashing.*  
  *   **No:** → The lump and statue both ceased to exist simultaneously despite different expected persistence. **Leaf: Eliminativism (No Statues & No Lumps)** or **Radical Revision**. *Embarrassment: Denying obvious differences between artifacts and their matter.*  

  **Question 3 (Statue destroyed by squashing):** *Is the lump of clay still present after squashing?*  
  *   **No:** → The lump depended entirely on the statue's form for its existence. **Leaf: Stuff Eliminativism?** (Highly unstable, likely incoherent). *Embarrassment: The lump seems obviously present before molding.*  
  *   **Yes:** → The lump persists where the statue does not. → Go to Question 4.  

  **Question 4:** *Before squashing (while statue is on pedestal), how many distinct physical objects are located exactly where the statue stands?*  
  *   **Exactly One:** → Go to Question 5.  
  *   **More Than One:** → Go to Question 6.  

  **Question 5 (Only one object pre-squash):** *What accounts for the difference: the lump survives squashing, but the statue (which was here) does not?*  
  *   **The one thing has different modal properties under different descriptions/names/concepts.** → Go to Question 7.  
  *   **The difference isn't really in the thing; it's in how we count or talk about its stages.** → Go to Question 8.  

  **Question 6 (Multiple objects pre-squash):** *How are the statue and the lump of clay related?*  
  *   **By a special, intimate relation (like constitution) distinct from identity.** → **Leaf: Constitution Without Identity**. *Embarrassment: Admitting a fundamental relation beyond identity/parthood.*  
  *   **By simple spatial coincidence (like two unrelated objects sharing a room).** → **Leaf: Coincident Objects (Robust Dualism)**. *Embarrassment: Explaining why they share *all* parts and properties until modal divergence.*  

  **Question 7 (One thing, different modal properties):** *Is the fact that we count it as surviving or perishing dependent on which concept (e.g., 'statue' vs. 'lump') we use?*  
  *   **Yes, fundamentally. There's no single answer without choosing how to conceptualize it.** → **Leaf: Sortal-Relative Counting** or **Conceptual Relativity**. *Embarrassment: Making survival objectively perspective-dependent.*  
  *   **No, the difference is a brute fact about the thing itself.** → **Leaf: Modal Property Bundling?** (Rarely defended). *Embarrassment: Explaining how one simple object has contradictory modal profiles.*  

  **Question 8 (Difference is in counting/talking):** *Is the "statue" just a temporary stage or temporal part of the lump's history?*  
  *   **Yes.** → **Leaf: Four-Dimensionalism (Perdurantism)**. *Embarrassment: Denying the statue exists wholly *now*; it's partly future/past.*  
  *   **No. The statue/lump talk reflects different linguistic practices or conceptual schemes, not temporal parts.** → **Leaf: Verbalism** or **Quantifier Variance**. *Embarrassment: Making ontology depend on language, risking anti-realism.*  

  **Now consider Case (b):** A statue is carved directly from bedrock. No separate lump was brought to the site.  
  **Question 9:** *Was there a distinct lump of matter present at the carving site immediately *before* the carving began?*  
  *   **Yes:** → Go to Question 10.  
  *   **No:** → Go to Question 11.  

  **Question 10 (Lump existed pre-carving):** *What happened to that lump during carving?*  
  *   **It was destroyed/modified to become the statue.** → Contradicts persistence of lump in Case (a). **Prunes:** Constitution Without Identity, Coincident Objects, Stuff-as-Object.  
  *   **It persists and now coincides with the statue.** → Consistent with multiple objects view. **No Prune.**  

  **Question 11 (No pre-existing lump object):** *What constitutes the material basis of the statue?*  
  *   **A portion of stuff (clay, marble) that is not itself a distinct object.** → **Leaf: Stuff Theory (Portions of Matter)**. *Embarrassment: Explaining how stuff portions persist or are individuated without being objects.*  
  *   **The bedrock itself (a larger object) or nothing distinct at all – just the statue.** → **Leaf: Hylomorphism** (Form unites matter into a new substance) or **Artifact Eliminativism?** (No distinct lump *or* statue as object). → *Split:*  
      *   *Is being a statue a fundamental way the matter is unified?* **Yes:** **Leaf: Hylomorphism**. *Embarrassment: Defining 'substantial form' non-mysteriously.*  
      *   *Is the "statue" just a patterned part of the bedrock?* **Yes:** **Leaf: Mereological Essentialism/Revisionism?** *Embarrassment: The statue seems destroyed if moved.*  

  **Now consider Case (c):** A piece of driftwood is displayed unmodified as a sculpture.  
  **Question 12:** *Is the sculpture (the artwork) identical to the piece of driftwood?*  
  *   **Yes.** → **Confirms:** Identity View, Sortal-Relative Counting, Verbalism. **Prunes:** Views requiring maker's intention for artifact existence (Hylomorphism often, Constitution sometimes).  
  *   **No. The sculpture came into existence when displayed/intended, the driftwood existed before.** → **Requires:** Constitution Without Identity, Coincident Objects, or Hylomorphism (if display imposes 'form'). **Prunes:** Identity View. *Embarrassment (for No):* What physical difference did the act of displaying make?  

  **Now consider Case (d):** One bronze item is a statue, a lamp base, and an investment.  
  **Question 13:** *How many distinct physical objects coincide where the bronze is?*  
  *   **Exactly One:** → **Confirms:** Identity View, Sortal-Relative Counting, Verbalism, Four-Dimensionalism. **Prunes:** Coincident Objects (beyond 2).  
  *   **Three (or more):** → **Confirms:** Coincident Objects (Pluralism). *Embarrassment: Explaining coincidence without causal interaction or discernible properties.*  
  *   **Depends on the context/sortal used to count:** → **Confirms:** Sortal-Relative Counting, Verbalism.  

  **Now consider Case (e):** The statue's material is replaced one chip at a time.  
  **Question 14:** *Does the original statue persist after all its original material is replaced?*  
  *   **Yes.** → **Confirms:** Views where persistence isn't strictly material (Identity View if lump also persists via replacement, Four-Dimensionalism, Sortal-Relative Counting, Hylomorphism). **Prunes:** Mereological Essentialism, Stuff Theory (if stuff is original matter).  
  *   **No.** → **Confirms:** Stuff Theory (original matter is gone), Mereological Essentialism. **Prunes:** Standard Identity View (if lump=statue).  

  **Question 15 (For all paths):** *Could it be vague whether one object or two are present at a given time?*  
  *   **Yes:** → **Leaf: Ontic Indeterminacy** (Must be combined with another leaf, e.g., Constitution or Coincidence). *Embarrassment: Admitting fundamental metaphysical vagueness.*  
  *   **No:** → Consistent with all other leaves.  

  ---

  **Classification Key: Answer Patterns & Embarrassing Commitments**

  1.  **Statue gone, Lump gone after squash (Q1 No + Q3 No):** **Leaf:** Incoherent/Eliminativism? *Embarrassment:* Denying the lump existed *before* molding.
  2.  **Statue gone, Lump persists; One object pre-squash; Modal difference via descriptions (Q1 No + Q3 Yes + Q4 One + Q5 → Q7 Yes):** **Leaf:** Sortal-Relative Counting. *Embarrassment:* Survival depends entirely on chosen concept.
  3.  **Statue gone, Lump persists; One object pre-squash; Modal difference brute (Q1 No + Q3 Yes + Q4 One + Q5 → Q7 No):** **Leaf:** Modal Bundling? *Embarrassment:* One thing has contradictory essential properties.
  4.  **Statue gone, Lump persists; One object pre-squash; Difference via temporal parts (Q1 No + Q3 Yes + Q4 One + Q5 → Q8 Yes):** **Leaf:** Four-Dimensionalism. *Embarrassment:* The statue isn't wholly present *now*.
  5.  **Statue gone, Lump persists; One object pre-squash; Difference via language (Q1 No + Q3 Yes + Q4 One + Q5 → Q8 No):** **Leaf:** Verbalism/Quantifier Variance. *Embarrassment:* What exists depends on words.
  6.  **Statue gone, Lump persists; Two objects pre-squash; Special relation (Q1 No + Q3 Yes + Q4 More + Q6 Special):** **Leaf:** Constitution Without Identity. *Embarrassment:* A fundamental relation beyond identity/parthood.
  7.  **Statue gone, Lump persists; Two objects pre-squash; Co-location (Q1 No + Q3 Yes + Q4 More + Q6 Co-location):** **Leaf:** Coincident Objects. *Embarrassment:* Two things share *all* intrinsic properties pre-squash.
  8.  **Statue survives squash? Yes + Lump survives? Yes (Q1 Yes + Q2 Yes):** **Leaf:** Identity View. *Embarrassment:* The statue *can* survive being flattened.
  9.  **Statue survives squash? Yes + Lump survives? No (Q1 Yes + Q2 No):** **Leaf:** Eliminativism/Revision. *Embarrassment:* The lump doesn't survive flattening.
  10. **Bedrock statue: Lump existed pre-carving (Q9 Yes) + Destroyed (Q10 Destroyed):** Conflicts with persistence in Case (a). Requires revision. *Prunes:* Constitution, Coincidence, Stuff-as-Object.
  11. **Bedrock statue: Lump existed pre-carving (Q9 Yes) + Persists (Q10 Persists):** Consistent with Constitution/Coincidence.
  12. **Bedrock statue: No lump object pre-carving (Q9 No) + Portion of stuff (Q11 Stuff):** **Leaf:** Stuff Theory. *Embarrassment:* Stuff isn't countable like objects.
  13. **Bedrock statue: No lump object pre-carving (Q9 No) + Statue as unified substance (Q11 Bedrock/Statue → Yes to form):** **Leaf:** Hylomorphism. *Embarrassment:* Defining 'substantial form' non-mysteriously.
  14. **Driftwood Sculpture ≠ Driftwood (Q12 No):** Requires Constitution/Coincidence/Hylomorphism. *Embarrassment:* The display act created a new physical object.
  15. **Driftwood Sculpture = Driftwood (Q12 Yes):** Confirms Identity, Sortal-Relativity, Verbalism.
  16. **Bronze Case: Three objects (Q13 Three):** **Leaf:** Coincident Objects (Pluralism). *Embarrassment:* Three things share all parts and location.
  17. **Gradual Replacement: Original statue persists (Q14 Yes):** Compatible with many views. *Embarrassment (for Identity):* Lump changes composition while statue persists.
  18. **Gradual Replacement: Original statue gone (Q14 No):** Confirms Stuff Theory/Mereological Essentialism. *Embarrassment:* The statue ceases despite functional continuity.
  19. **Vagueness possible (Q15 Yes):** **Leaf:** Ontic Indeterminacy (Combined). *Embarrassment:* Reality itself is vague.

  **Unattended Leaves & Diagnostics:**
  *   **"Neither, but one thing under two sortals":** Covered under Identity View / Sortal-Relative.
  *   **"Family Splits":** Hylomorphism (Aristotelian vs. Contemporary), Constitution (Modal vs. Amodal).
  *   **Undefended Leaves:** Stuff Eliminativism? (Q3 No), Modal Bundling? (Q7 No) – Generally incoherent/unattractive.
  *   **Hard to Distinguish Pairs:**
      *   *Identity View vs. Sortal-Relative Counting:* Use Case (e). Identity View usually ties persistence to the *matter* (lump), Sortal-Relativity might allow statue persistence through replacement via a different sortal. **Diagnostic Q:** *Can the statue persist through complete matter replacement without invoking a temporal part?* **Yes:** Favors Sortal-Relativity over standard Identity.
      *   *Verbalism vs. Sortal-Relative Counting:* Very close, often notational variants. Verbalism emphasizes language, Sortal-Relativity emphasizes concepts/modes of counting.
      *   *Constitution vs. Coincident Objects:* Use Case (d). Constitution typically allows only *one* constituted artifact (statue) per portion, Coincident Objects allows multiple coinciding artifacts (statue, lamp base, investment). **Diagnostic Q:** *In Case (d), do the statue, lamp base, and investment count as three coinciding objects?* **Yes:** Coincident Objects (Pluralism); **No:** Constitution (or Coincident Objects restricted to two).

  This tree provides a map where answers to concrete questions about the cases determine fundamental commitments, forcing students to confront the costs of their intuitive judgments before encountering the philosophical labels.
