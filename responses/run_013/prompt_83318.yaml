prompt: |-
  I'm a second-year PhD student in political theory, about halfway through a chapter on sortition, and I've hit a snag that's more conceptual than historical so I figured I'd just ask it flat out. The thing that keeps bugging me is that the citizens' assembly template — the one Ireland used in its assembly experiment, the French climate convention, the permanent citizens' council in the German-speaking community of Belgium, the Gdańsk city assemblies, and basically every how-to manual and OECD report that's been written off the back of them — is the same design in its bones, and it's a strange design. You recruit by lottery, but never a plain lottery: you stratify the sample so it mirrors the population on age, sex, region, education, sometimes migration background, sometimes urban vs rural. You pay people, or at least cover their costs, often a per diem. The design is supposed to avoid the people who put themselves forward — the whole point is that you didn't choose to be there and can't be there because you want something out of it. You sit them in a room for a few weekends with trained facilitators and expert witnesses, and the voting rule varies (bare majority in some cases, supermajority in others, which I think is itself telling). And then the output is *recommendations*: the assembly proposes, and the parliament, or the government, or the whole electorate in a referendum, decides. Meanwhile the one institution where we've let a randomly selected group actually decide — no ratification step, no veto, no sending it back for another round — is the criminal jury: drawn by a plain unstratified lottery off the rolls, paid a token fee, given no facilitators, and required to return a verdict rather than a suggestion. And even there we don't fully trust the lottery, since each side gets to strike a few people for no stated reason.

  What I want isn't a defense or a critique of lottocracy, I've read plenty of those. I want a reconstruction of what this actual practice — the template rather than the theory behind it — has to believe. Concretely: what view of political legitimacy does the two-stage design presuppose, that a random body is good enough to constitute an authoritative voice but not good enough to decide? Does stratifying by demographic category quietly commit the thing to a mirror or descriptive theory of representation, and if so is that consistent with the stock sortitionist argument that the point of the lottery is precisely to dissolve interest and faction and get people reasoning about a common good? What do the payment and the screening-out of volunteers presuppose about motivation, and about whose political participation is trustworthy? Is the practice strictly committed to any of this, or does it just sit comfortably with several incompatible accounts — a Condorcet-style epistemic story, a pure fair-procedure story, a consent or fair-play story, something about the division of labour between deliberation and decision? Which rivals does it actually rule out, as opposed to merely not needing? And if you swapped the presupposed view for one of the rivals, what would have to change in the design — what's load-bearing and what's decoration? I'd much rather be told the practice is underdetermined between two named theories than that it's underdetermined, full stop.

  Could you give me the answer as a JSON object and nothing else, with these fields: "bottom_line" (one sentence — the view the template can't do without, or a flat statement that it has none); "practice_restated" (two to four sentences restating the practice as you take it, so I can check we've got the same object); "presupposed_view" (the implicit theory of legitimacy, representation and competence, stated as a couple of propositions); "load_bearing" (array of objects with "commitment", "design_feature_that_needs_it", "what_breaks_without_it"); "comfortable_but_not_required" (array of objects with "commitment", "why_it_fits", "why_the_practice_survives_without_it"); "rivals_ruled_out" (array of objects with "view", "why_the_practice_excludes_it"); "internal_tensions" (array of objects with "feature_a", "feature_b", "the_tension", "cheapest_reconciliation"); "underdetermined_between" (array of objects with "theory", "how_it_reads_the_practice", "what_would_distinguish_it"); "counterfactual" (array of objects with "alternative_view", "what_would_have_to_change" as a list, "what_you_would_lose"); "jury_contrast" (what the jury/assembly difference reveals about the presupposed view); and "confidence" (object with "overall" as high, medium or low, and "weakest_link"). Don't worry about being exhaustive, I'd rather have four sharp commitments than twelve vague ones, and if some of the design features turn out to be doing no philosophical work at all just say so in the relevant field.
reasoning: |-
  We are reconstructing the implicit philosophical commitments of the standard citizens' assembly design template, as described. The key features are: stratified random sampling (mirroring demographics), payment, exclusion of volunteers, facilitation, expert input, and a recommendation-only output (with final decision by elected body or referendum). We contrast this with the jury model.

  Bottom line: The template presupposes that a randomly selected group, when properly constituted and supported, can achieve a form of deliberative competence that yields legitimate advice on the common good, but that final authority must rest elsewhere to preserve democratic sovereignty.

  Practice restated: Citizens are selected via stratified random sampling to mirror the population on key demographics. They are paid and their costs covered. Volunteers are screened out to avoid self-selection bias. Participants engage in facilitated deliberation over multiple sessions, with access to expert testimony. The assembly produces recommendations, which are then considered (but not automatically adopted) by an elected body or the electorate.

  Presupposed view:
  1. Legitimacy of input (not output): The assembly's deliberations, when conducted under conditions of representativeness, impartial support, and access to expertise, produce advice that reflects the public interest and thus has normative weight in the decision-making process.
  2. Division of labor: The role of the assembly is to deliberate and recommend, while the role of elected bodies (or referenda) is to decide, preserving the principle of popular sovereignty and accountability.

  Load-bearing commitments (features that break without them):
  - Commitment: The assembly must be descriptively representative (via stratification) to ensure that diverse perspectives are included and that the deliberation is seen as legitimate by the public.
    Design feature: Stratified random sampling.
    Breaks without: Without stratification, the assembly might not reflect societal diversity, risking groupthink or the perception that it is unrepresentative, undermining its claim to speak for the public.

  - Commitment: Deliberation must be supported to enable competent judgment.
    Design feature: Facilitators and expert witnesses.
    Breaks without: Without facilitation and expertise, the group might not overcome polarization, informational deficits, or domination by a few, failing to achieve deliberative quality.

  - Commitment: Participants must be disinterested (not self-selected) to avoid bias and ensure they are focused on the common good.
    Design feature: Exclusion of volunteers and payment to ensure participation without self-interest.
    Breaks without: Allowing volunteers would introduce selection bias (favoring those with strong opinions or agendas), undermining the claim to impartiality.

  - Commitment: The assembly's role is advisory, not authoritative, to preserve the sovereignty of the people as expressed through existing democratic institutions.
    Design feature: Output as recommendations to be ratified by elected bodies or referenda.
    Breaks without: If the assembly could make binding decisions, it would bypass the principle of accountability and the institutional role of elected representatives.

  Comfortable but not required:
  - Commitment: Epistemic democracy (Condorcet-style): The assembly, as a microcosm, can converge on the common good through informed deliberation.
    Why it fits: The stratified sample and deliberation process aim to produce wise judgments.
    Survives without: The practice doesn't require that the assembly is always right; it could be justified by procedural fairness even if epistemic gains are uncertain.

  - Commitment: Fair play: Citizens have a duty to participate when called, and society owes them support to fulfill this role.
    Why it fits: Payment and facilitation enable participation as a civic duty.
    Survives without: The practice could be justified by consequentialist reasons (better outcomes) without invoking a duty.

  - Commitment: Descriptive representation: The assembly should "look like" the population to enhance legitimacy.
    Why it fits: Stratification ensures visible diversity.
    Survives without: The deeper commitment is to inclusive deliberation; if representativeness could be achieved without mirroring (e.g., through other forms of sampling), stratification might be adjusted.

  Rivals ruled out:
  - View: Pure lottocracy (randomly selected bodies with binding decision power).
    Why excluded: The template explicitly separates deliberation and decision, rejecting the idea that a mini-public should have final authority.

  - View: Pure voluntarism (only those who choose to participate should have a say).
    Why excluded: The exclusion of volunteers and reliance on mandatory lotteried participation is central, ruling out self-selection.

  - View: Elite deliberation (only experts or elected representatives can competently decide).
    Why excluded: The practice assumes that ordinary citizens, when supported, can deliberate effectively on complex issues.

  Internal tensions:
  - Feature A: Stratification by demographics (mirroring).
    Feature B: The stock sortitionist argument that lotteries dissolve faction and get people to reason about the common good.
    Tension: Mirroring suggests that demographic categories are politically salient (for representation), but the common-good ideal implies transcending such categories.
    Cheapest reconciliation: Demographic diversity is a means to an end (inclusion of diverse perspectives) and not an end in itself; the deliberation process aims to foster a shared perspective.

  - Feature A: Payment to ensure participation.
    Feature B: Exclusion of volunteers to avoid self-interest.
    Tension: Payment might incentivize participation for financial reasons, potentially introducing a different kind of self-interest.
    Reconciliation: Payment is set at a level to compensate for costs and time, not as an incentive, and the exclusion of volunteers addresses the primary concern of issue-based activism.

  Underdetermined between:
  - Theory: Epistemic democracy (assembly as truth-tracker).
    How it reads: The design maximizes conditions for informed, rational deliberation to produce good advice.
    Distinguisher: If the assembly were seen as merely aggregating existing preferences without transformation, the epistemic claim weakens.

  - Theory: Deliberative democratic legitimacy (procedure-based).
    How it reads: The legitimacy comes from the inclusive and reasoned process itself, regardless of outcome quality.
    Distinguisher: If the process were shown to be flawed in execution but still accepted, legitimacy might derive from procedure.

  Counterfactual:
  - Alternative view: Pure proceduralism (binding force comes solely from the random selection and fair process).
    What would change: Remove the ratification step; the assembly's decisions are final.
    What you would lose: The sovereignty of the broader public and elected bodies, risking a disconnect from accountability.

  - Alternative view: Pure descriptive representation (the assembly should decide because it is a statistical mirror).
    What would change: Stratification becomes the core justification; the assembly might be given binding power without deliberation support.
    What you would lose: The emphasis on deliberation and competence; decisions might reflect raw preferences without refinement.

  Jury contrast:
  The jury model (unstratified, no facilitation, binding verdict) highlights the template's commitments: 
  - The citizens' assembly requires stratification to ensure representativeness and facilitation to ensure competence because it deals with complex policy issues (not just facts), whereas juries are trusted with binary verdicts based on evidence presented adversarially. 
  - The jury's binding power is acceptable because it operates under strict legal rules and a high burden of proof, and because the decision is narrow. The assembly's recommendations are advisory because they involve broad policy trade-offs that require democratic accountability.

  Confidence:
  Overall: High. The template is coherent and widely implemented with consistent justifications.
  Weakest link: The tension between descriptive representation and common-good deliberation. Some designs might overemphasize mirroring while downplaying how deliberation transforms perspectives.
