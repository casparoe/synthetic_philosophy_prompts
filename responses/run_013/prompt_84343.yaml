answer: |-
  Here is a pantoum capturing an information cascade in a jury room, followed by a concise note on theoretical liberties:

  **Jury Cascade (A Pantoum)**

  The first vote cast: a whispered "Guilty" heard.  
  The second juror, tracing doubt's faint sign,  
  (Her own mind held a flutter, like a bird)  
  Marked "Guilty" too, aligning with the line.

  The second juror, tracing doubt's faint sign,  
  Marked "Guilty" too, aligning with the line.  
  The third saw two agree, set his "Not Sure" aside,  
  And wrote the verdict others would define.

  Marked "Guilty" too, aligning with the line.  
  And wrote the verdict others would define.  
  The fourth, the fifth, the sixth, with glances brief,  
  Let public tally be their private guide.

  And wrote the verdict others would define.  
  Let public tally be their private guide.  
  A seventh paused, knuckle tapped on wood –  
  Then joined the stream, belief in disbelief.

  Let public tally be their private guide.  
  Then joined the stream, belief in disbelief.  
  The chain complete, the custom sealed by sight,  
  While the first vote cast: a whispered "Guilty" heard.  
  Then joined the stream, belief in disbelief.  
  While the second juror, tracing doubt's faint sign...

  The chain complete, the custom sealed by sight,  
  (Her own mind held a flutter, like a bird)  
  While the second juror, tracing doubt's faint sign...  
  The first vote cast: a whispered "Guilty" heard.

  ---

  **Prose Note on Theoretical Liberties:**

  This poem leans towards the starkest "pure cascade" model (e.g., Bikhchandani, Hirshleifer & Welch, 1992), where actors *completely* disregard private signals after observing sufficient predecessors, treating public actions as overwhelming evidence. Critics (e.g., Ottaviani & Sørensen, 2001) argue this overstates the discarding; private signals often still influence action probabilistically or in later updating. The poem implies absolute abandonment ("set his 'Not Sure' aside," "belief in disbelief"). A model incorporating Bayesian updating with noisy signals might show less total disregard. The "knuckle tap" moment highlights fragility – a single defection *could* shatter the cascade if observed early enough, but the poem places it after the threshold is crossed (stanza 4), where models suggest the cascade is robust unless private signals are very strong or actions are misinterpreted. The poem's emotional focus on brittleness stems from the *potential* for collapse inherent in path-dependence, though established cascades in standard models are stable absent strong contrary evidence. If the sequence required agents to act simultaneously or observe only aggregates, the cascade dynamics and the "first evidence" payoff structure would differ.

  **Key for the Seminar:**

  *   **First Actors:** The first juror acts solely on private info (line 1). The second juror *has* private doubt (line 3) but acts partly based on the first vote (line 4).
  *   **Threshold Crossed:** The third juror (Stanza 2, lines 3-4) sees two "Guilty" votes. This crosses the minimal threshold (often n=2) where it becomes rational to ignore his own "Not Sure" signal and follow the public information.
  *   **Defection:** The seventh juror's hesitation (Stanza 4, lines 3-4) represents the potential fragility. Had they defected *before* the cascade locked in (e.g., as the third juror), or if observed by others, it might have halted or reversed the cascade.
  *   **Arbitrariness:** The final custom ("Guilty") is locked in solely because the *first* vote happened to be "Guilty" (line 1), amplified by the second juror's conformity despite doubt. A different first vote could have locked in "Not Guilty" with the same structure.
  *   **Private Signal Resurfacing:** The second juror's private doubt ("Her own mind held a flutter, like a bird") is the crucial first-hand evidence. It appears initially in Stanza 1 but is buried by the cascade. It only resurfaces *after* the chain is complete and the verdict sealed (Stanza 6, line 2), highlighting its irrelevance to the final, arbitrary outcome despite being the initial spark for the second vote. The *first* vote's signal also returns at the very end, equally detached from the process it initiated.
