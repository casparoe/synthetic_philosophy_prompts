  Hey, I'm in a philosophy club and I need to build a thought experiment for a presentation on Bertrand's paradox and the principle of indiffrence. I definately don't want the chord-in-a-circle one or the cube factory one. Make me a realistic case (school, factory, whatever) where the principle of indifference gives two different probabilities for the same event depending on which quantity you're indifferent about, and both quantities are ones a normal person would think are just as natural as each other. Keep the scenario to one paragraph. Then walk me through: what the two probabilities are, which feature of the case is doing the work, what happens if someone says you just have to be indifferent over the correct variable, and whether switching to imprecise probabilities (a range instead of one number) actually solves it or just hides the problem. Finally, say how a defender of the principle of indifference would attack my case. Don't just say it's partition-dependent without showing the partitions.
