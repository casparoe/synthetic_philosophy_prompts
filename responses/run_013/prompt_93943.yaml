prompt: |-
  I run grantmaking at a small foundation — about forty grants a year, twenty to two hundred grand each, decided by a team of five with no training in this stuff, signed off by trustees quarterly. We've started asking what our grants do in the long run and its turned into a mess: once the far future is in play, the case for and against the same grant is dominated by stuff we're inventing, and two of us can reach opposite conclusions from the same facts. One trustee says this is just cluelessness and we should stop pretending to rank grants at all.

  I don't want to stop. Write me a procedure we can run on a proposal in an hour: questions in order, what counts as a good enough answer, where it stops with a no, and where it hands the decision to a person because the disagreement is about values rather than facts. Build in a sorting step I can teach: every consideration goes into one of three buckets — things we have evidence for, things we can reason about but not measure, and things that only work if you accept an assumption we can't defend — and the procedure should say how much of a case can be the third bucket before ranking by expected value stops meaning anything, and what we do then (reversibility? track record? admit it's a tie?).

  Then run it on two proposals: a scholarship program whose near-term effects we can measure but whose long-run effects on who ends up powerful nobody agrees on, and a grant to people working on slowing down the reckless development of AI, where nothing is measurable and even the sign of the effect is contested. Tell me where it gives an answer I won't like, which steps are heuristics dressed up as rigor, and which are values choices I have to own myself.
reasoning: |-
  Okay, let me tackle this user's problem. They run a small foundation making about 40 grants a year, with a team of five untrained members and trustees signing off quarterly. The issue is assessing long-term impact has become messy—leading to invented arguments and conflicting conclusions from the same facts. One trustee suggests stopping the ranking altogether, but the user wants a structured procedure instead.

  First, I need to design a one-hour procedure that categorizes considerations into three buckets: evidence-based, reasoned but not measurable, and undefendable assumptions. The key is determining how much of the third bucket can be in a proposal before expected value ranking becomes meaningless. The user also wants this applied to two specific proposals: a scholarship program and an AI safety grant.

  The scholarship program has measurable near-term effects but contested long-term impacts on power dynamics. The AI grant has nothing measurable, with even the effect's sign disputed. The procedure must highlight where it gives unpopular answers, where heuristics mimic rigor, and where value judgments are necessary.

  Starting with the procedure structure, a 60-minute timeframe means strict time boxing. Breaking it into phases makes sense: triage (15 mins), evidence assessment (15 mins), reasoning assessment (15 mins), and judgment (15 mins). The three buckets are crucial for sorting factors. Bucket 1 is for data-backed evidence, Bucket 2 for logical reasoning without data, and Bucket 3 for unsupported assumptions. 

  The critical threshold is how much Bucket 3 content is acceptable. I recall decision theory concepts like Knightian uncertainty—where probabilities can't be assigned. If Bucket 3 exceeds 30% of key factors, the model breaks. Beyond that, fallbacks like reversibility, track record, or admitting a tie are needed. 

  For the scholarship proposal, near-term metrics like graduation rates go into Bucket 1. Long-term power dynamics involve Bucket 2 (logical reasoning) and Bucket 3 (assumptions about systemic change). If Bucket 3 is high, say 40%, the procedure would trigger a fallback—maybe prioritizing reversibility since scholarships are hard to undo once awarded.

  The AI grant is trickier. Threats like misalignment are Bucket 3 (assumptions). Interventions’ effectiveness is also Bucket 3. Here, Bucket 3 dominates, so expected value ranking is invalid. The fallback would be track record of grantees or admitting a tie. This highlights where the procedure forces value judgments: how much risk to accept on unprovable assumptions.

  Heuristics dressed as rigor appear in the evidence scoring—assigning points based on source quality might feel objective but is still subjective. Also, the 30% threshold for Bucket 3 is arbitrary, though based on decision theory concepts.

  Values choices are evident when choosing fallbacks. Opting for reversibility or track record depends on the foundation's risk tolerance. The AI grant’s assessment inherently values speculative prevention over measurable outcomes, a core value judgment.

  The user might dislike outcomes where solid proposals are downgraded due to high Bucket 3 content, like the scholarship’s long-term impact. For AI, not getting a clear answer might frustrate them. Emphasizing that the procedure clarifies uncertainties rather than eliminates them is key. Trustees need to own the value decisions when the model reaches its limits.
answer: |-
  Here's a structured 60-minute decision procedure designed for your context, followed by analysis of your two cases. The system forces explicit separation of *knowns*, *reasoned estimates*, and *unprovable assumptions*, with clear off-ramps when assumptions dominate.

  ---

  ### **The 60-Minute Grant Assessment Procedure**
  *(Performed by 1-2 staff members per proposal)*

  **PHASE 1: TRIAGE (15 mins)**  
  | Step | Question | Good Enough Answer | Stop/Handoff Rule |
  |------|----------|---------------------|-------------------|
  | 1.1 | **Problem Fit**: Does this align with our core funding priorities *today*? | "Yes, per Section 2 of our charter" | Stop if "No" |
  | 1.2 | **Feasibility**: Can the grantee execute this? | Track record OR credible plan (resumes, prototypes) | Stop if no evidence |
  | 1.3 | **Direct Outputs**: What will we see in ≤3 years? | Specific, observable deliverables (e.g., "300 students trained", "policy draft published") | Stop if vague |

  **PHASE 2: EVIDENCE ASSESSMENT (15 mins)**  
  *Sort all claimed outcomes/risks into 3 buckets:*  
  - **Bucket 1 (Evidence)**: Data from *this* context or high-quality replication (e.g., RCTs, longitudinal studies).  
  - **Bucket 2 (Reasoned)**: Logic model with causal links + analogous examples (e.g., "Scholarships increase college attendance; similar programs show 20% income lift").  
  - **Bucket 3 (Assumption)**: No defensible logic/data ("AI alignment research prevents extinction").  

  | Step | Action | Thresholds |
  |------|--------|------------|
  | 2.1 | List all key claimed impacts (positive/negative). | Min. 3, max 5 |
  | 2.2 | Assign each impact to a bucket. | Require consensus |
  | 2.3 | **Scoring**: Rate evidence quality (Bucket 1: 1-5; Bucket 2: 1-3; Bucket 3: 0). | Stop if >50% of *weighted* score is Bucket 3 |

  **PHASE 3: REASONING & UNCERTAINTY (15 mins)**  
  | Step | Question | Handling |
  |------|----------|----------|
  | 3.1 | **Sensitivity**: Which Bucket 3 assumptions would reverse the grant’s value if false? | List & flag critical ones |
  | 3.2 | **Reversibility**: How hard is it to undo effects? (Scale: 1=trivial, 5=permanent) | Score ≥3 triggers caution |
  | 3.3 | **Contestedness**: Do experts disagree on core mechanisms? | Note if material disagreement exists |

  **PHASE 4: JUDGMENT CALL (15 mins)**  
  | Condition | Action |
  |-----------|--------|
  | **A** Bucket 3 < 30% of score | Quantify expected value: `(Probability × Impact) - Costs` |
  | **B** Bucket 3 = 30-50% | Use fallbacks:  
  - **Reversibility**: Prefer reversible grants  
  - **Track Record**: Bet on proven grantees  
  - **Robustness**: Choose options that work even if some assumptions fail |
  | **C** Bucket 3 > 50% OR expert conflict | **Handoff to Trustees** with memo: "Decision hinges on value: [Specific Assumption]." Admit tie if no consensus. |

  ---

  ### **Applied to Your Cases**

  #### **Case 1: Scholarship Program**  
  - **Triage**: Passes (fits charter, measurable short-term outputs).  
  - **Buckets**:  
    - *Bucket 1*: Graduation rates, job placement stats (Score: 4).  
    - *Bucket 2*: Likely income increases based on similar programs (Score: 2).  
    - *Bucket 3*: "Diverse leaders change power structures" (Score: 0 — no causal proof).  
  - **Assessment**:  
    - Bucket 3 = 1 of 3 factors → **33% of score**.  
    - Critical assumption: "Scholarship recipients gain systemic influence."  
    - Reversibility: Low (education is permanent).  
  - **Outcome**: **Fallback to Track Record/Robustness**. Fund if grantee has history of placing graduates in leadership roles. *You may dislike this* — it ignores the *scale* of desired power shifts, but the procedure flags that ambition as an undefended assumption.  

  #### **Case 2: AI Safety Grant**  
  - **Triage**: Passes (fits if "emerging tech" is a priority).  
  - **Buckets**:  
    - *Bucket 1*: None.  
    - *Bucket 2*: "Slower development → more testing time" (weak analogy; Score: 1).  
    - *Bucket 3*: "AI x-risk is existential", "Intervention reduces risk", "No counterproductive effects" (Score: 0).  
  - **Assessment**:  
    - Bucket 3 = 100% of score.  
    - Contestedness: High (experts split on risk/solutions).  
    - Reversibility: Very low (if AI is delayed, competitors may advance).  
  - **Outcome**: **Handoff to Trustees** with memo: "Decision rests on valuing speculative risk mitigation over opportunity costs. No empirical anchor." Likely result: **Admit tie** unless trustees share a value bias.  

  ---

  ### **Where the System Falters (and Why)**
  1. **Answers You Won't Like**:  
     - Rejects "visionary" grants with high Bucket 3 content (e.g., AI safety). Forces tradeoffs between values and rigor.  
     - Scholarships downgraded to "track record" prioritizes incrementalism over transformation.  

  2. **Heuristics Dressed as Rigor**:  
     - **Bucket scoring**: Assigning numbers (e.g., "Bucket 2 = Score 2") feels precise but is still subjective.  
     - **30% Bucket 3 threshold**: Arbitrary (though grounded in decision theory). Could be 25% or 40%.  
     - **Reversibility scoring**: "Scale 1-5" masks qualitative judgment.  

  3. **Values Choices You Must Own**:  
     - **Defining "Evidence"**: Is a pilot study enough? Must it be peer-reviewed?  
     - **Fallback preference**: Choosing reversibility vs. track record favors caution or momentum.  
     - **Handoff rules**: Admitting a tie vs. letting a trustee override is a cultural choice.  

  ---

  ### **Key Takeaways**
  - **Strengths**: Forces explicit discussion of assumptions, contains "visionary sprawl," surfaces value conflicts early.  
  - **Weaknesses**: Favors measurable interventions; punts hardest decisions to trustees.  
  - **For Your Team**: Use buckets *before* discussing merit. If Bucket 3 > 50%, say: "We’re voting on worldviews, not evidence."  

  > "This won't make your grants impactful, but it will make your disagreements *productive*. When facts disappear, you'll know *why* you're arguing — and when to stop." — Adapt from economist Kenneth Arrow’s impossibility theorem.
