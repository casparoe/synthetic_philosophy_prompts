answer: |-
  ## Joint Statement on Advance Directives & Dementia (Agreed Principles)

  1.  **Purpose:** Advance directives are tools for individuals to exert control over future medical care *during periods of incapacity*, aiming to prevent unwanted interventions and reduce burdens on loved ones and caregivers.
  2.  **Foundation of Respect:** Respect for the individual's autonomy—their capacity to shape their own life narrative and values—is the primary ethical foundation justifying the creation and consideration of advance directives.
  3.  **Impact of Dementia:** Dementia causes profound cognitive and psychological changes. Individuals with advanced dementia often experience a significantly altered sense of self, perspective, and relationship to their past values and future.
  4.  **Present Experience:** Individuals with dementia can experience states of contentment, pleasure in simple activities, and express preferences *in the moment*, including a desire to continue living. These expressions reflect their current phenomenological state.
  5.  **Epistemic Limits:** We often cannot know with certainty the internal experience or the degree of "self-continuity" experienced by a person with advanced dementia. We also cannot perfectly reconstruct the precise context or intensity of feeling behind the directive's creation.
  6.  **Stakes Involved:** The directive represents the *earlier self's* deeply held values, fears of indignity/suffering, and attempt to control their narrative's end. The *later self* experiences the immediate reality of life, with its own (altered) perspective and capacity for contentment or distress. Both states matter ethically.
  7.  **Prima Facie Weight:** A clearly expressed advance directive carries significant moral weight and should not be disregarded lightly. It provides crucial evidence of the person's values and wishes.

  ---

  ## Disagreements Table: Bindingness & Authority of the Directive

  | Claim                                                                                                 | Precedent-Autonomy View (Would Accept This Phrasing)                                                                 | Present-Interests View (Would Accept This Phrasing)                                                                 | What's Really Doing the Work                                                                                    |
  | :---------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------- |
  | **The binding authority of a directive stems primarily from:**                                        | The enduring moral force of the competent person's autonomous decision as a decisive exercise of self-governance.    | The directive's reflection of what the *current* person, given their present capacities and situation, would choose. | **Value:** Commitment to past autonomous acts vs. Primacy of current experiential well-being/phenomenology.     |
  | **When a person with dementia expresses a desire to live contrary to their directive:**               | That preference lacks decisive authority because the individual lacks the capacity to authentically reconsider or revoke the prior autonomous judgment. | That expressed preference *is* the most direct expression of the current self's will and well-being, demanding primary respect. | **Interpretation of Autonomy:** Is autonomy "banked" in the directive, or only exercisable by the present agent? |
  | **Overriding a directive against the later self's expressed wish to live is:**                        | A violation of the earlier person's autonomous choice and a failure of commitment to the values they entrusted us to uphold. | Primarily a potential harm to the *current* person by acting against their present will, not a wrong to the absent past self. | **Metaphysical Stance:** Does the earlier self persist in a morally relevant way to be wronged? / **Harm Focus:** Past vs. Present. |
  | **The core purpose of honoring a directive is to:**                                                   | Respect the *authority* of the earlier self's settled decision about their life's ending, as a matter of principle. | Protect the *well-being* of the current person by adhering to what best represents their likely choice *now* (using the directive as key evidence). | **Ultimate Goal:** Fulfilling a prior commitment vs. Optimizing present welfare/interests.                      |
  | **The directive's validity depends significantly on:**                                                | Its expression of authentic values and wishes during competence; subsequent cognitive changes don't invalidate it.   | Its relevance to the *current* situation and the *current* self's capacities and experiences; significant changes can diminish its applicability. | **Locus of Moral Standing:** Primarily the past self's act vs. Primarily the present self's state.              |

  ---

  ## Crux Analysis & Test Cases

  1.  **Crux 1: Bindingness Foundation (Identity vs. Promise/Value)?**
      *   **Agreed Test Case: The Self-Revising Directive.** *"If, when incapacitated, I appear content and explicitly state a desire to continue living, this directive requesting non-treatment should be overridden."*
      *   **Precedent-Autonomy Prediction:** Will strongly agree this *must* be followed. Proves bindingness rests on the *content* of the autonomous choice (which includes this condition), not on strict identity persistence.
      *   **Present-Interests Prediction:** Will also agree it must be followed. Proves the directive's force adapts to respect the present self's expressed will *as anticipated and authorized by the earlier self*. Agrees it's not about identity persistence per se.
      *   **Crux Resolution:** Both sides agree bindingness doesn't *require* strict personal identity continuity. It rests on **respect for the autonomous choice made**, which can include conditions based on future states.

  2.  **Crux 2: Authority of Later Self's Preference?**
      *   **Agreed Test Case: Outdated Directive (Treatment Now Cheap/Pleasant).** Competent Self, fearing painful, bankrupting, low-success chemo, writes directive refusing it if demented. Later, with dementia, Self is content. New chemo is painless, cheap, 90% successful, and widely available.
      *   **Precedent-Autonomy Prediction:** The directive *probably still binds*. The core fear/aversion expressed then (even if based on outdated facts) reflects a fundamental value choice about medical intervention in dementia that persists. Respecting autonomy means honoring that settled choice. *Might* allow override if new facts fundamentally change the *nature* of the intervention feared.
      *   **Present-Interests Prediction:** The directive's rationale is *invalidated* by changed circumstances. The current self is content; the burden/outcome profile is now objectively positive. Honoring the directive *now* would harm the current self based on obsolete information. The current situation and preference should control. The directive is strong evidence overcome by new facts.
      *   **Crux Resolution:** **Fundamental Disagreement.** Precedent-Autonomy sees the directive as expressing a *value-based decision* (e.g., "no medical interventions in dementia") that is largely context-independent. Present-Interests sees it as a *contingent choice based on specific burdens/benefits*; when those change significantly, the directive loses force against the present self's will.

  3.  **Crux 3: Harm/Wrong in Overriding?**
      *   **Implication from Cases:** Precedent-Autonomy sees overriding a directive (absent conditions like Crux 1 case) as *wronging the earlier person* by violating their autonomy, regardless of the current self's state. Present-Interests sees it as potentially *harming the current person* by acting against their expressed will, but *not* wronging a past entity that no longer exists in a morally relevant way. Overriding based on changed circumstances (Crux 2 case) is seen as *preventing harm* to the current self.

  ---

  ## Verbal vs. Genuine Disagreements

  *   **Verbal/Conflated:**
      *   **"Authority":** Often used ambiguously. Precedent-Autonomy means "binding decision-making power." Present-Interests often means "source of relevant will/well-being information." Clarifying which sense is used helps.
      *   **"Harm to the Earlier Self":** Precedent-Autonomy uses this morally/figuratively (a wrong done *to her*). Present-Interests often hears it literally/metaphysically (impossible if she's gone) and rejects the framing. Separating "moral wrong" (PA) from "literal harm to a sentient being" (PI) is crucial.
      *   **"Identity":** Running metaphysical identity debates (is she the same person?) together with the *normative* question of whose wishes/values should prevail. The Test Case 1 shows the normative question can be separated from strict metaphysics.
      *   **"Autonomy":** Conflating the *value* of respecting past autonomous acts with the *capacity* for current autonomous choice. The directive case involves the former; the later self's preference involves the latter (if any capacity exists).

  *   **Genuine Clashes:**
      1.  **Ultimate Ethical Priority:** Is the *past exercise of autonomy* (the directive) the supreme value, or is the *present experiential state and expressed will* of the existing person supreme when they conflict?
      2.  **Nature of the Directive:** Is it a **binding commitment** to a value or principle (PA), or is it **strong evidence** of what the person *would likely want now*, subject to reassessment based on current conditions and expressions (PI)?
      3.  **Moral Status of the Earlier Self:** Does the earlier self, *as an agent who made a decision*, retain a moral claim that can be "wronged" even after profound dementia (PA), or does moral concern shift entirely to the well-being and expressions of the *current entity* (PI)?

  This document provides a clear framework distinguishing agreed foundations, precisely stated disagreements, tested cruxes with predictions, and clarified language to move beyond circular debate.
