prompt: |-
  I'm helping run a reading group on advance directives and the "authority of the earlier self," and two of my regulars have been circling each other for months without ever quite meeting. On one side is the precedent-autonomy person: a competent person's written wishes about a later period of incapacity should basically control what happens then, even if dementia has turned her into someone who seems happy and wants to keep going. On the other side is the present-interests person: once the later self is actually here, and is content and asking to live, the old directive is at most evidence about what she would have wanted, not a command that overrides what she now wants. They keep re-litigating the same case and I'm tired of it.

  Write the joint statement they should have produced. I want it as a numbered list of claims both of them can sign -- about what a directive is for, what makes it worth honoring, what we actually know about how people with dementia experience their lives, and what's at stake for the person who wrote it versus the person who's living it now. Then a disagreements table: each row a claim where they part ways, with the column for each side worded so that side would actually accept it (not a strawman version), and a last column for what's really doing the work in the disagreement.

  I suspect a couple of the cruxes are these, but tell me if I've got the wrong ones: (1) does the bindingness of a directive rest on personal identity continuing across the dementia, or does it come from something else -- a promise to oneself, or just respect for autonomy as a value that outlives the agent who had it? (2) when the later self says she wants to live, is that preference authoritative, or is it something we should discount because she's no longer the one who set the terms? (3) is overriding a directive a harm to the earlier self, a wrong done to her even though she's gone, or neither?

  For each crux, name a case or argument both of them agree would bear on it, and write down in advance what each side predicts about that case. Please use at least these two, since they're the ones nobody can wriggle out of: a directive that includes a self-revising clause -- the earlier self writes that if she later seems content and asks to keep living, the directive should be overridden -- and a directive signed before the relevant treatment was cheap, pleasant, and widely available, so the earlier self was working from facts that no longer hold.

  Also say which parts of their fight are just verbal -- e.g. if they mean different things by "authority" or are running a metaphysical question and a policy question together -- and which parts are a genuine clash. Don't give me reading lists or citations; just the document. Keep it tight, no filler.
