  ## Closing Address: The Hardest Case

  [Pause. Look around the room.]  

  Colleagues, friends, guests… as I step down, I find myself drawn not to an easy victory, but to the hardest case: Nuremberg. It’s the case that both defines us and haunts us. Because what do we inherit, as defenders? We inherit the indelible image: counsel standing beside men the world had already hanged in effigy. That image is our North Star. It tells us that representation isn’t earned by popularity, but demanded by principle. That even for the most reviled, the law requires a voice – *our* voice. For that courage, in that cauldron, we should be profoundly proud.  

  But Nuremberg also forces us into unease. We cannot pretend the objections vanish in the shadow of the crimes. The loudest complaint from the defense bench? Retroactivity. The Charter defined *new* crimes – crimes against peace, crimes against humanity – *after* the acts were committed. "Ex post facto." The oldest warning bell in law: *you cannot punish what was not clearly forbidden*. That complaint wasn’t baseless. Law should warn before it punishes.  

  And here’s the rub: the defense’s *other* loud complaint pulls in the opposite direction. They argued the victors committed similar acts – bombing cities, waging aggressive war. But this *undercuts* the retroactivity argument! If the acts *were* already understood as wrong, even if not codified, then the "new law" charge loses some force. Yet, crucially, it highlights another flaw: the victors sat as judges of their own enemies under rules they wrote. No neutral forum existed. That stings.  

  So, where does legitimacy lie? It doesn’t spring from the Charter’s perfect justice. It lies, imperfectly, in the *process* we uphold. Nuremberg mattered because the victors, however imperfectly, *chose law over summary execution*. They chose a trial. They allowed – demanded – a defense. Evidence was presented, challenged, tested. Cross-examination happened. Arguments were heard. However tilted the scales, the *form* of law was observed. In a world scorched by raw power, they reached, however clumsily, for a principle: let the record be made. Let the facts be argued. However new the law, however partial the court, the *adversarial crucible* was ignited. That crucible is our domain.  

  And Tokyo? It sharpened the unease. There, the law wasn't just victors' justice; it was imposed by the sole decree of a single occupying commander, stripping away even the thin veil of multinational consensus that draped Nuremberg.  

  What does Nuremberg teach defenders? It teaches that our work transcends the verdict. It teaches that legitimacy isn’t bestowed by popularity or power, but fought for in the arena – by demanding evidence, testing accusations, holding power to its own proclaimed rules, *even when we know the rules are flawed*. We stand beside the despised not to endorse, but to demand: if you judge, judge fairly. Apply the law you claim to value. Make your case.  

  Nuremberg wasn't a show trial *because the defense showed up*. Because counsel stood, argued, objected, forced the machinery of condemnation to grind slower and harder. That is our inheritance. That is our uneasy pride. We defend not because our clients are pure, but because the law cannot be pure without us.  

  Thank you. It has been the honour of my career to stand beside you in this vital, difficult work.  

  **[End: Approximately 6 minutes. Tone: Respectful, reflective, intellectually honest, proud but not triumphalist.]**

  **Key Choices Explained:**  

  1.  **Honors the Defense:** Focuses on the *act* of representation itself as courageous and fundamental, separate from the tribunal's flaws ("our North Star," "transcends the verdict").
  2.  **Concedes Retroactivity Clearly:** Explicitly states the complaint "wasn't baseless" and grounds it in core legal principle ("Law should warn before it punishes").
  3.  **Acknowledges Contradiction:** Directly states the hypocrisy complaint ("victors did the same") *undercuts* the retroactivity argument, demonstrating honesty without fudging.
  4.  **Sources Legitimacy in Process:** Argues legitimacy stems imperfectly from choosing a trial with defense rights over summary execution, and crucially, the *adversarial testing* ("the crucible is our domain").
  5.  **Distinguishes Tokyo:** Highlights the singular imposition by "the sole decree of a single occupying commander," contrasting it with Nuremberg's (flawed) multinational aspect.
  6.  **Bridges the Room:** Appeals to defenders' core ethic (standing for the despised, demanding fairness) while acknowledging guests' view that *some* process was necessary ("chose law over summary execution").
  7.  **Avoids Quotes & Stays Celebratory (Enough):** Focuses on the enduring *principle* of defense work as the "uneasy pride" and "honour," meeting the "celebratory" ask by celebrating the *defender's role*, not the trial's perfection.
  8.  **Concludes on Purpose:** Ends by rooting the value firmly in the defender's action making the law *possible* ("the law cannot be pure without us").
