  Here is the speech, weaving Cato's consolations into plain speech while honoring your mother's reality and the occasion:

  **(Setting: The back room, the long table, the cold ovens. You stand facing the group, your mother seated prominently.)**

  Alright, everyone. Settle in. We all know why we’re here. We’re here because this corner, this room, these ovens… they’ve been Mom’s world for forty-four years. Since before some of us were born. And we’re here because, come March, after seventy-six years – and forty-four of those spent getting up at four in the morning – she’s locking the door for good. Not because she wants to, but because her eyes have decided it’s time.

  Now, anyone who knows Mary knows she’s not going quietly. This isn’t a surrender she chose. It feels like something’s being taken. Something vital. We all see it. It’s the work she loved, the work that defined her days – reading those orders, checking those recipes she knew like the back of her hand – suddenly just… out of reach. That’s a hard stop. A real loss. And pretending it isn’t wouldn’t fool her, or any of us.

  So, what do you say about that? About stepping back, about the body not keeping pace, about leaving the work you built your life around?

  It’s easy to look at stopping and think it means disappearing. That stepping away from the *doing* means the *doer* is somehow gone. But look around this room. Look who’s here. Family, yes. But also, women who stood behind that counter alongside her, year after year. And look, their kids are here too – grown now, but who probably sneaked their first cookie right over there! Parish friends who’ve broken bread from this bakery at countless gatherings. Customers… goodness, some of you folks have been coming since Jimmy Carter was figuring out the White House thermostat! You’re not just customers; you’re part of the rhythm of this place.

  Mom isn’t mixing the dough today, but this gathering? *This* is her work, made visible. This community, these connections, the way this little bakery became a landmark not just on the street corner, but in our lives? That didn’t disappear when the ovens cooled. That’s still here, warm and real. The work changed form, maybe, but its weight, its *substance*, is right here in this room. It’s in the loyalty of decades, the friendships forged over flour sacks, the sheer number of lives touched by a simple loaf of bread or a perfectly frosted cake. That’s a kind of harvest. It’s the yield of forty-four years of getting up at four AM.

  And about those pleasures? Sure, the body slows down. Things get harder, things are lost – like reading those beloved recipe cards. But ask her what she misses *least*? I’d bet it’s not the taste of the bread, or the warmth of the oven, or the satisfaction of a perfect batch. It’s not the feeling of accomplishment at the end of a long day. What might fade is that *frenzy* of youth, the constant push to build it all, prove it all. The deep pleasure now? It’s in the richness of what’s already done. It’s seeing the proof of her labor standing right here. That satisfaction doesn’t weaken; it deepens.

  She built this. Brick by brick, loaf by loaf. She earned her place here a thousand times over. That kind of building, that kind of constancy, that dedication… it commands a respect that doesn’t depend on her still being able to lift a fifty-pound bag of flour. It’s a respect earned purely by the life lived, the work done. We owe her that acknowledgement, not because she demands it, but because the sheer weight of what she created here demands it *of us*.

  So yes, the work she knew is changing. The hands-on part is ending. That’s real, and it’s hard. But the *life* she built through that work? The community she nourished? The sheer impact of forty-four years on this corner? That hasn’t vanished. It hasn’t even diminished. It’s transformed. It’s sitting here with us, filling this room, woven into the fabric of who we all are. It’s her legacy, not just written down, but baked into us.

  So let’s raise our glasses – whether it’s coffee, punch, or something a little stronger for those of us who helped clean the mixers! To Mary. To forty-four years of warmth, of crusty loaves and sweet frosting, of early mornings and hard work. To the hands that shaped more than dough – they shaped this place, and they shaped us. To the life built here, and to the deep, earned satisfaction of seeing just how much it truly means, right here, right now. To Mom!

  \answer{It leaves her within sight of death.}
