answer: |-
  1. Ask in order: (1) What is the specific outcome, defined as the incident described in the report (e.g., "a release of four hundred pounds at 3:14 a.m. from the north header")? (2) What candidate factors (events, conditions, or absences) might have contributed? (3) For each factor, if it were removed or corrected via an idealized intervention (changing only that factor and its direct consequences), would the outcome as defined have been prevented or substantially altered in timing, manner, or severity? (4) If not, was it part of a minimal set of actual conditions sufficient for the outcome, and necessary to that set's sufficiency?  

  2. A factor is a cause if either question (3) or (4) yields "yes." Stop and exclude it as a cause only if both answers are "no." Absences are treated as intervenable (e.g., "adding a guard"), and non-manipulable factors (e.g., equipment age) are eligible causes if they meet the criteria.  

  3. Conflicts are resolved by allowing multiple causes and including non-manipulable factors; the procedure stops and defers to policy when deciding which causes to cite or prioritize (e.g., for regulatory action), as this involves values, not factual causation.  

  4. First case (pressure vessel): Both the plastic sheet and seized valve are causes—each was sufficient and operated, meeting criterion (4). Second case (missing guard): The absence is a cause—intervening to add it would prevent the outcome, meeting criterion (3).  

  5. Third case (1963 design flaw): It is a cause—correcting it would prevent the outcome (criterion 3), regardless of non-manipulability. The procedure cannot mandate feasibility of remediation, assign blame, or override policy decisions on citing "background" factors.
