  We are creating a procedure for investigators to determine causes in occupational safety incidents. The procedure must address the limitations of the two causation accounts provided (counterfactual and intervention-based) and give clear guidance. The procedure should be in five numbered items as requested.

  Key goals:
  1. Avoid absurdities like naming oxygen as a cause or excluding each of two sufficient causes.
  2. Allow factors that cannot be manipulated (like design flaws) to be causes.
  3. Fix the level of description for the outcome to avoid shifting counterfactuals.
  4. Handle absences (like missing guards) as causes.
  5. Provide a stopping rule and when to hand decisions to a person.

  The procedure will use an adapted version of the interventionist account (the second one) because it tells us "what to wiggle", but we will modify it to allow for non-manipulable factors and to avoid the problems of the counterfactual account.

  We also note that the outcome description must be fixed. We will fix it at the level of the specific incident as described in the report (e.g., "a release of four hundred pounds at 3:14 a.m. from the north header"). The investigator should use the description that is the focus of the investigation (the one that defines the incident).

  We design the procedure as a series of questions:

  Item 1: The questions in order.
    1. What is the specific outcome (incident) we are explaining? (Fix the description at the level of detail in the report.)
    2. What are the candidate factors (conditions, events, or absences) that might have caused the outcome?
    3. For each candidate factor, if we had intervened to remove or change that factor (even if such an intervention is only hypothetical) and left everything else (including other candidate factors) as it was at the time of the incident, would the outcome have been different? (This is the counterfactual test but applied without adjusting other candidate factors.)
    4. For each candidate factor that passes the test in step 3, is there a reason to exclude it because it is too remote (like oxygen) or because it is a necessary background condition that does not explain the specific failure? (We are going to say that if it passes step 3, it is a cause unless it is a constant background condition that is always present and not specific to the incident.)

  However, note that step 3 as described might run into the problem of overdetermination (two independent sufficient causes). Therefore, we adjust: we will use an intervention that removes one candidate factor at a time and see if the outcome still occurs. If removing one factor would have prevented the outcome, then that factor is a cause. But if there are two factors, each sufficient, then removing one would not prevent the outcome (because the other is still present). So we would get that both are causes? Actually, in the case of two sufficient causes, if we remove one, the outcome still happens because of the other. Therefore, by step 3, neither would be a cause? That's the problem.

  We must avoid that. Therefore, we change step 3: we consider an intervention that removes the candidate factor and then we check if the outcome still occurs. But note: if there are two independent sufficient causes, removing one still leaves the other. Therefore, the outcome would still occur. So step 3 would say that the removed factor is not a cause? But that is the same problem as the counterfactual account.

  So we need a different approach.

  Alternative idea: We use the interventionist account but allow for multiple causes. We can think of an intervention that removes a candidate factor and then we see whether the outcome becomes less likely or does not occur. But in the case of two independent sufficient causes, removing one does not change the outcome because the other is still present. Therefore, we might say that each is not a cause? That is absurd.

  We must note that in overdetermination cases, both are causes. So we need to account for that. Therefore, we can adjust the test: we consider an intervention that removes the candidate factor and then we check whether the outcome would have occurred at the same time and in the same way. If the outcome would have been prevented or would have happened differently (e.g., at a different time, or in a different manner) then the factor is a cause. But in the case of two independent sufficient causes, removing one might mean the outcome happens at the same time because of the other? So it would be the same. Therefore, we need to consider the timing and the specific details.

  Given the complexity, we can instead say: a factor is a cause if it was a necessary element of a set of conditions that together were sufficient for the outcome. But that requires identifying the minimal sufficient sets? That may be too complex.

  Alternatively, we can use a "NESS" test (necessary element of a sufficient set) which is a known approach in causation. It avoids the overdetermination problem. The NESS test: a factor is a cause if it is a necessary element of a set of conditions that are together sufficient for the outcome, and that set was present at the time.

  But we want a procedure that is simple for engineers.

  Let's design a step-by-step:

  Step 1: Fix the outcome description (as in the report).
  Step 2: List candidate factors (events, conditions, absences).
  Step 3: For each candidate factor, imagine an intervention that removes that factor (or changes it to a safe state) and then see if the outcome would still have occurred in the exact same way (same time, same manner, same consequences). If the outcome would not have occurred at all or would have occurred in a significantly different way (e.g., much later, or with different consequences that are less severe), then the factor is a cause.

