  This leads us to:

  Item 3: We resolve conflicts by having the investigator note that multiple factors can be causes and that the procedure may identify more than one. For the overdetermination case, we say that both are causes because each was independently sufficient and present. We also note that the procedure does not require a single root cause. The decision to cite one or more is a matter of policy and values (e.g., which one to emphasize for remediation) and will be handled by the review panel.

  Therefore, we design the procedure as:

