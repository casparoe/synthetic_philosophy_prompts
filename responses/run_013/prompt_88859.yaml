    4. If a candidate factor is part of a set of factors that together are sufficient for the outcome and the factor is necessary for that set to be sufficient (i.e., without the factor, the set would not be sufficient), then it is a cause. However, if a candidate factor by itself is sufficient for the outcome (even if there are other sufficient factors), then it is a cause.

  But this is complex.

  We decide to make it simpler by policy: we will consider any factor that was a deviation from the expected or required state and that played a role in the incident as a cause. But that is vague.

  Given the constraints, we design the procedure as follows, and in the third item, we will state that the procedure may identify multiple causes and that the review panel will decide which ones to cite based on policy.

  Now, let's write the five items.

  Item 1: Questions in order for the investigator:
    1. Define the outcome precisely using the description in the report (e.g., "a release of four hundred pounds at 3:14 a.m. from the north header").
    2. List all candidate factors (conditions, events, or absences) that might have contributed to the outcome.
    3. For each candidate factor, consider: "If we had intervened to remove or correct this factor (even if only in an idealized way) while holding all other factors at their actual state at the time of the incident, would the outcome have been prevented or significantly altered in timing, manner, or severity?"
