  Given the time, we decide to use the following for step 3:

    For each candidate factor, consider an intervention that removes that factor and leaves all other factors as they were. Then, if the outcome would not have occurred at all, or would have occurred in a significantly different way (e.g., at a later time, or with less severity), then the factor is a cause. 

  However, in the case of two independent sufficient causes, removing one factor (e.g., the plastic sheet) would not change the outcome (because the seized valve would still cause it). Therefore, the outcome would still occur in the same way. So we would not count it as a cause? That's bad.

