    2. What are the candidate factors (conditions, events, or absences) that might have contributed to the outcome?
    3. For each candidate factor, would the outcome have been prevented or significantly altered (in timing, manner, or severity) if that factor had been different (e.g., absent or corrected) and all other factors had remained as they were? (This is a counterfactual test but holding other factors fixed.)
    4. If the answer to question 3 is "yes", then the factor is a cause. Also, note that a factor can be a cause even if it is not manipulable (like a design flaw) or if it is an absence (like a missing guard). However, if the factor is a constant background condition that is always present and not specific to the incident (like the presence of oxygen), then it is not a cause unless it was abnormal in the context.

  But we must handle the overdetermination. We adjust: if there are multiple factors that are each sufficient, then for each one, if we remove it and leave the others, the outcome might still occur. Therefore, the answer to question 3 would be "no" for each? That would be wrong. So we change the test: we ask whether the factor was a necessary part of the actual causal process that occurred? Or we ask: if we remove the factor, would the outcome have been the same? If not, then it is a cause. But in overdetermination, it would be the same. So we need to include factors that are sufficient even if not necessary? 

