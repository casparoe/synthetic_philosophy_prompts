answer: |-
  Here is a comprehensive exam question, model answer, and marking scheme designed to meet your specifications.

  ---

  **Exam Question**

  Critically evaluate the following two cases concerning rigid designation and the necessary *a posteriori*. For **each case**:
  (a) Explain whether the introduced term ("novium" or "glorp") rigidly designates.
  (b) Determine whether any plausible identity statement involving the term (e.g., "Novium is X" or "Glorp is Y") could qualify as a necessary *a posteriori* truth.
  (c) Explicitly identify the key factors resolving (a) and (b) (e.g., reference-fixing vs. meaning-giving, uniqueness failures, referential failure, or built-in essentialism).  
  Additionally:  
  (d) For a term whose reference is fixed by a description, what must be true of that description for the term to *still* rigidly designate? Avoid simply asserting that "descriptions aren’t rigid"; specify the conditions under which rigidity is preserved.

  **Case 1 (Novium):**  
  A spectroscopy team observes unexplained emission lines. They posit a single new element causing them and dub it ‘novium’, stipulating: "By ‘novium’, we mean *the element responsible for these lines*." Later, it is discovered that the lines arise from two distinct elements, and no single element caused all lines.

  **Case 2 (Glorp):**  
  A team points to a beaker of liquid and declares: "This stuff, whatever its chemical composition turns out to be, is ‘glorp’." Later analysis reveals the beaker contained a mixture of two substances (A and B). All scientifically interesting properties attributed to "glorp" (e.g., catalysis, fluorescence) are traced solely to substance A.

  ---

  **Model Answer (650 words)**

  **Case 1: Novium**  
  (a) "Novium" does **not rigidly designate** any entity.  
  (b) No identity statement (e.g., "Novium is element E") can be necessary *a posteriori*.  
  (c) **Key factors**:  
  - The term’s reference was fixed by the description "the element responsible for these lines." This description **fails to uniquely pick out an object** in the actual world, as no single element caused all lines. Consequently, "novium" suffers **referential failure** – it designates nothing.  
  - Rigid designation requires picking out the *same object* in all possible worlds where it exists. Referential failure in the actual world precludes this transworld identification.  
  - There is no necessary *a posteriori* truth because necessary truths require a designatum. Even if we counterfactually imagine a world with a unique element causing the lines, "novium" (as defined) wouldn’t designate *that* element rigidly; it would designate whatever *actually* satisfied the description (but nothing does).  
  - **What’s *not* doing the work**: This isn’t about meaning-giving vs. reference-fixing. The description was clearly used referentially (to fix reference, not give meaning), but uniqueness failure undermines successful reference-fixing.  

  **Case 2: Glorp**  
  (a) "Glorp" **rigidly designates** the mixture in the beaker.  
  (b) An identity like "Glorp is substance A" is **contingent**, not necessary. However, "Glorp is the mixture in this beaker" (pointing to the original sample) is **necessary *a posteriori***.  
  (c) **Key factors**:  
  - Reference was fixed **ostensively** ("this stuff") with the explicit stipulation "whatever it turns out to be." This makes "glorp" a **rigid designator** for the *actual substance* in the beaker, irrespective of its composition.  
  - The term rigidly picks out **that particular mixture** (composed of A and B) across all worlds where it exists. Even when we discover its composition, "glorp" does not shift to designate A alone.  
  - "Glorp is substance A" is contingent because glorp (the mixture) could have existed without A (if B were dominant, or another component caused the properties).  
  - "Glorp is the mixture in this beaker" is necessary *a posteriori*: It’s necessary because "glorp" rigidly designates that mixture, but we needed empirical discovery (*a posteriori*) to confirm the mixture’s identity.  
  - **What’s doing the work**: The **causal-ostensive grounding** overrides descriptive intentions. Although the team *cared* about the functional properties, they anchored reference to "this stuff" – the concrete sample. This reflects Kripke’s "baptism" model: reference is fixed by an initial act, not by satisfying contingent properties.  

  **Part (d): Conditions for Rigidity with Descriptive Reference-Fixing**  
  For a term whose reference is fixed by a description to still rigidly designate, two conditions must hold:  
  1. **The description must successfully pick out a unique object in the actual world** (unlike "novium").  
  2. **The term must designate *that actual object* in all possible worlds – not whatever satisfies the description in those worlds**.  
  For example, fixing "Neptunium" as "the planet causing perturbations in Uranus’ orbit" would make it rigid *if* we use the description solely to identify the actual planet (Neptune), which is then designated rigidly across worlds. Crucially, in counterfactual worlds where another planet causes the perturbations, "Neptunium" still refers to Neptune. The description is a **reference-fixing tool**, not a synonym. Rigidity collapses only if the term’s meaning *is* the description (e.g., "the tallest spy"), making it non-rigid by designating whoever satisfies the description in each world.

  ---

  **Marking Scheme (Total: 20 marks)**  
  **A-Grade Answers (16–20 marks) Must:**  
  - Correctly identify **novium** as non-rigid due to referential failure (not merely uniqueness failure) and explain why necessary *a posteriori* truths are impossible here. *(3 marks)*  
  - Correctly identify **glorp** as rigidly designating the *mixture*, not substance A. *(2 marks)*  
  - For glorp: Distinguish between contingent ("Glorp is A") and necessary *a posteriori* ("Glorp is *this* mixture") identities. *(3 marks)*  
  - Explicitly analyze **reference-fixing vs. meaning**:  
    - Novium: Description used referentially, not for meaning. *(1 mark)*  
    - Glorp: Ostension fixes reference rigidly despite descriptive intentions about "properties." *(2 marks)*  
  - For part (d): Clearly state that rigidity holds when the description fixes reference to the *actual object* (not world-relative satisfier). *(3 marks)*  
  - Avoid major errors (see below).  

  **Common Mistakes (Deduct 2–4 marks per error):**  
  - **Novium**: Claiming it rigidly designates "whatever caused the lines" or treating uniqueness failure alone as killing rigidity (without addressing referential failure).  
  - **Glorp**: Confusing reference-fixing with meaning (e.g., "glorp means ‘the functional substance’").  
  - **Glorp**: Arguing it rigidly designates substance A (misinterpreting speaker intentions).  
  - **Necessary *a posteriori***: Proposing one for novium or for "Glorp is A."  
  - **Part (d)**: Equating descriptive reference-fixing with non-rigidity, or failing to specify that the term must track the *actual referent* across worlds.  

  **Structure & Clarity (Max 3 marks):**  
  - Logical flow, precise terminology (e.g., "reference-fixing," "rigid designator"), and addressing all subparts.  
  - **A-grade threshold**: 16/20 (must avoid all major errors and cover core insights above).

  ---

  This question forces engagement with Kripkean mechanics beyond stock examples, testing grasp of how reference-fixing, ostension, and uniqueness interact with rigidity. The marking scheme rewards nuance (e.g., glorp’s ostensive rigidity vs. novium’s referential emptiness) and penalizes conflation of key concepts.
