prompt: |-
  I'm not a philosopher, just someone who got into an argument with my cousin at Thanksgiving about surrogacy. She's a nurse in California and knows people who've been surrogates, and she says it's just work—you carry a pregnancy for someone else, you get paid, and if a woman signs a contract and consents, what's the problem. But I have a friend from Italy who says surrogacy is banned there, and I think alot of European countries either ban paid surrogacy or only allow it if the surrogate isn't paid beyond expenses, while in the US there's this weird patchwork where some states enforce commercial surrogacy contracts, some won't, and some criminalize them. Meanwhile egg donors in the US often get paid for time, pain, and inconvenience but the contract definately insists it's not payment for the eggs themselves, which sounds like a legal fiction to me. And in a gestational surrogacy the surrogate has no genetic tie to the baby, so the law treats her as not the mother, while the egg donor is the genetic mother but usually has no parental rights. That seems to assume a very particular view of what makes someone a parent—gestation, genetics, intention, or contract. So my question is: what philosophical commitments does each system actually presuppose? The American market one seems to presuppose that women can sell reproductive labor and that a contract can cover pregnancy, but the European bans seem to presuppose that some things shouldn't be for sale even if the woman consents. Are those views consistent with their own other rules? Like, if Europe bans paid surrogacy because it commodities women, why does it often allow compensated egg donation for research, or unpaid altruistic surrogacy? And if the US says it's just a service, why does it get so squeamish about paying for the egg itself rather than the time it took to produce it? I want you to reconstruct the implicit theory behind each practice, tell me which parts are strictly presupposed and which are just convenient, and say where the practice is actually underdetermined so that several theories could license it. Also, if we replaced the presupposed view with a different one—say, treating pregnancy as a form of labor like any other, or treating the body as outside commerce entirely—what would have to change in the actual laws and contracts? Keep it under 800 words, and dont just give me a list of pros and cons; I want the hidden philosophy.
reasoning: |-
  Okay, I need to tackle this user's query about the philosophical underpinnings of surrogacy laws. They had an argument with their cousin and want to understand the implicit theories behind different systems. Let me start by breaking down their main points.

  First, the user contrasts the U.S. market-based approach with European bans. The cousin sees surrogacy as work, while the European stance prohibits commercialization. The user also notes inconsistencies: Europe allows compensated egg donation but bans paid surrogacy, and the U.S. pays for "time and inconvenience" but not the eggs themselves. 

  Hmm, the core issue here is conflicting views on commodification. The U.S. treats reproductive labor as a service, hence enforceable contracts. But the legal fiction around egg donation payments suggests discomfort with outright commodification of body parts. That's a key point—separating labor from the body itself. 

  For Europe, the ban on paid surrogacy stems from seeing the female body as inalienable. But allowing altruistic surrogacy implies consent isn't the issue; it's the market exchange. Why permit unpaid arrangements but not paid? Probably because payment introduces commodification, which they view as degrading. Yet compensated egg donation for research is allowed? That might be justified by framing it as contributing to science, not personal gain, but that distinction feels shaky. 

  The user also asks about parental definitions. In gestational surrogacy, genetics and intent override gestation. This reflects a liberal individualist view: parents are those who choose and commission the child, not necessarily those who carry or genetically contribute. Contracts formalize this intention. 

  Where are the inconsistencies? Europe banning paid surrogacy but allowing compensated egg donation could be seen as contradictory unless they differentiate between gametes and gestation. Eggs are renewable; pregnancy involves the whole body over time, making it more vulnerable to exploitation. But is that distinction philosophically consistent? Maybe not entirely. 

  The U.S. avoids calling egg payments "purchase" to dodge the commodification debate. This legal fiction maintains a veneer of non-commercialization for body parts while still facilitating the market. It's a practical compromise, not a coherent philosophical stance. 

  If we shifted to treating pregnancy as labor, laws would need to ensure labor protections: health coverage, minimum compensation, etc. But if the body is outside commerce entirely, surrogacy would only be altruistic, and payment for eggs might be banned. 

  The user wants the hidden philosophy, not pros/cons. They’re looking for the underlying principles and inconsistencies. I should highlight how each system's rules reveal their core commitments and where those commitments might waver. Also, address the parental theories—intention vs. gestation. 

  Need to keep it under 800 words. Structure: intro contrasting approaches, then deep dive into each system's presuppositions, inconsistencies, and what changes under different theories. Avoid lists; focus on reconstructing implicit theories. Make sure to connect the dots between commodification concerns, parental definitions, and the legal fictions used in practice.
answer: |-
  Here's a reconstruction of the implicit philosophical commitments underlying different surrogacy regimes, focusing on the core presuppositions and their tensions:

  **1. The US Market-Based Model (Gestational Surrogacy + Compensated Egg Donation):**
      *   **Core Presuppositions:**
          *   **Reproductive Autonomy as Market Freedom:** A woman's capacity for gestation and egg production is an extension of her labor and bodily resources. She owns this capacity and can alienate it via contract for a fee, just like other forms of work or tissue donation (e.g., plasma, hair).
          *   **Primacy of Contract & Intention:** Parentage is fundamentally a social/legal construct determined by pre-conception intention and formalized contract. Genetics and gestation are biological services rendered *to* the intended parents; the service provider (surrogate, egg donor) has no claim to the resulting child. The contract severs the biological link from parental rights.
          *   **Distinction Between Commodifying Labor vs. "The Body":** Paying for "time, pain, and inconvenience" for egg donation, rather than the egg *itself*, is a crucial legal fiction. It presupposes that compensating *effort* associated with biological processes is acceptable market exchange, while directly selling *body parts or persons* (the child) is morally problematic or illegal. This maintains a thin barrier against full commodification.
      *   **Conveniences & Tensions:** The egg payment fiction is convenient for avoiding direct "baby parts" or "organ sale" analogies, but philosophically shaky. Why is extracting and selling an egg different from selling a kidney if both involve bodily invasion and risk? The system *assumes* gametes are renewable and thus more like labor than organs, but this isn't rigorously defended. The patchwork laws reveal underdetermination – the core commitment to autonomy/contract could theoretically support even broader commercialization, but societal discomfort (exploitation risks, baby-selling concerns) creates boundaries.

  **2. European Bans on Commercial Surrogacy (Allowing Altruism/Expenses):**
      *   **Core Presuppositions:**
          *   **The Inalienability of the Female Body in Reproduction:** Pregnancy is not merely labor; it's a profound, embodied, and uniquely intimate relationship that cannot be fully alienated without degrading human dignity or commodifying women and children. Payment transforms a potentially altruistic act into a commercial transaction, risking exploitation and treating the woman's body and the child as commodities.
          *   **Rejection of Contract Overriding Fundamental Relationships:** The gestational bond is seen as creating a unique, non-contractual relationship between mother and child that cannot be severed purely by pre-conception agreement *if payment is involved*. Altruistic surrogacy is often permitted because the *absence* of profit preserves the act's relational nature and minimizes commodification concerns.
          *   **Distinction Between Gametes and Gestation:** Compensated egg donation (often for research, sometimes for ART) is tolerated because gametes are viewed as detachable genetic material, not involving the sustained, embodied relationship of pregnancy. Payment here is seen as compensation for time/effort/inconvenience (similar to the US fiction), not for selling the "child-to-be" or renting the womb. Unpaid surrogacy avoids payment but still relies on the gestational bond being voluntarily relinquishable *if not sold*.
      *   **Conveniences & Tensions:** Permitting altruistic surrogacy but banning paid creates a significant tension. If pregnancy is fundamentally inalienable and commodifiable, why is surrendering the child after altruistic gestation acceptable? The ban often hinges *specifically* on the corrupting influence of *money*, presupposing payment inherently distorts consent and relationships, while altruism preserves purity of motive. This struggles to explain why payment corrupts surrogacy but not egg donation. The system is underdetermined on whether the core objection is to commodification of children, women, or the act itself.

  **Changing the Presuppositions:**

  *   **If Pregnancy is Labor Like Any Other:** US laws would need stronger labor protections (minimum wage, health coverage, workers' comp for surrogates), standardized contracts, and potentially dismantle the egg payment fiction (acknowledging direct purchase). Europe would need to abandon its inalienability principle for gestation and allow payment.
  *   **If the Body is Outside Commerce Entirely:** The US model collapses. Only altruistic surrogacy and uncompensated gamete donation would be permissible. Contracts could not enforce payment for gestation or eggs; "compensation" would be strictly limited to verifiable expenses. Europe's bans align more closely, but would also need to eliminate compensated egg donation and potentially impose stricter limits on altruistic surrogacy to prevent *de facto* coercion or hidden payments.

  **Key Insight:** The core conflict is **commodification**. The US presupposes reproductive services *can* be commodified without inherently degrading dignity, protected by contract and autonomy. Europe presupposes payment for gestation *inherently* commodifies women and children in a way that violates human dignity, regardless of consent. The egg donation distinction in both systems is a convenient, philosophically unstable compromise reflecting discomfort with full commodification while enabling reproductive technologies. The parental assignment reflects the winner of this commodification debate: contract/intention in the US, a modified version of gestation (if unpaid) in restrictive European models.
