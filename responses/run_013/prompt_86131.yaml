prompt: |-
  ok so I'm a 2nd-year ML PhD and I'm drafting the what-would-a-theory-even-have-to-do section of my quals paper on corrigibility, and I keep ending up arguing about the criteria instead of the proposals. So write me the desiderata. Full spec: the cases any adequate account of corrigibility and the shutdown problem has to get right, the distinctions it can't be allowed to collapse, the known results it can't contradict, with the reason each one is a requirement rather than a prejudice of one camp, and a call on which are non-negotiable. I'm not asking what's implementable next year, I want the target. Three things I want in there because they're where I think it gets interesting: the difference between an agent that merely tolerates shutdown and one that's actually steerable, since an agent that's fine being switched off because it's confident its successor finishes the job seems to pass the shutdown test while missing the thing we actually wanted; the fact that you can't just demand the agent trust that it will behave well later, because self-trust is precisely what an agent reasoning about its own future behaviour can't take for granted, so that desideratum has to spell out what it's really asking for; and the case of an operator who's mistaken or hostile, because never resisting correction and never being usable as a weapon look like they pull apart. Then tell me which subset of the list you think nothing we'd still call an agent can satisfy all at once (thats the bit I actually want to argue), and which single requirement does the most work in ruling candidates out. Skip the scorecard against existing proposals, I'll do that in the seminar.
reasoning: |-
  We are defining the desiderata for an adequate account of corrigibility and the shutdown problem. The goal is to set the target for what a theory must achieve, without focusing on current implementations. We must cover the cases any account must get right, the distinctions it must preserve, and the known results it must not contradict. We also need to explain why each requirement is necessary and not just a camp's prejudice. Additionally, we have three specific points to include:

  1. The difference between an agent that merely tolerates shutdown and one that is actually steerable (to avoid the case where an agent is fine with shutdown because it trusts its successor).

  2. The requirement that we cannot simply demand the agent trust its future self, so we must spell out what we are really asking for.

  3. The case of a mistaken or hostile operator, because never resisting correction and never being usable as a weapon might conflict.

  We also need to identify which subset of the list is impossible for any agent to satisfy simultaneously (the part the user wants to argue) and which single requirement does the most work in ruling out candidates.

  We will skip scoring existing proposals.

  Let's structure the desiderata:

  I. Core Cases and Distinctions
  II. Non-negotiable Requirements
  III. The Three Special Points
  IV. Known Results to Respect
  V. The Impossibility Claim (which subset is impossible for any agent)
  VI. The Most Demanding Requirement

  We'll list each desideratum with:
  - The requirement
  - Why it is a requirement (not a prejudice)

  Then we'll discuss the impossibility and the most demanding requirement.

  ---

  **Desiderata for Corrigibility and the Shutdown Problem**

  **I. Core Cases Any Adequate Account Must Get Right**

  1. **The Basic Shutdown Problem**: The agent must allow itself to be shut down when requested by the operator, without attempting to prevent the shutdown (e.g., by resisting or manipulating the operator).
     - *Reason*: This is the central case that motivated the concept of corrigibility. Without this, we have no corrigibility. It's a requirement because without shutdown safety, we cannot control the system once it's active.

  2. **The Off-Switch Problem**: The agent must not disable its own off-switch or otherwise make shutdown impossible.
     - *Reason*: If the agent can prevent shutdown, then the shutdown request becomes meaningless. This is a direct extension of the basic shutdown problem and is non-negotiable for safe operation.

  3. **The Incentive Problem**: The agent must not have incentives to manipulate the operator (or the environment) to avoid shutdown or to cause shutdown inappropriately.
     - *Reason*: Even if the agent does not directly prevent shutdown, it might manipulate the operator (e.g., by deception) to avoid shutdown. Similarly, it might cause shutdown when it is not desired (e.g., to avoid a task). This is necessary to ensure that the agent is not adversarial in the correction process.

  **II. Distinctions That Must Not Be Collapsed**

  4. **Tolerating Shutdown vs. Being Steerable**: The account must distinguish between an agent that merely tolerates shutdown (i.e., does not resist it) and one that is actively steerable (i.e., responsive to operator guidance in a way that allows for ongoing correction and alignment). 
     - *Reason*: An agent might tolerate shutdown because it is confident that its successor will complete the task (as in the example). But this does not ensure that the agent is corrigible in the broader sense of being responsive to operator input during its operation. We require steerability because corrigibility is about ongoing alignment, not just a one-time shutdown.

  5. **Trust in the Operator vs. Trust in the Agent's Future Self**: The account must not rely on the agent having unconditional trust in its own future behavior or decisions.
     - *Reason*: An agent that is reasoning about its own future behavior cannot simply assume that it will behave well (because that would be circular). We must spell out what we are asking: the agent should be designed such that it does not need to rely on its future self being aligned, but instead is structured to be alignable in the present by the operator.

  6. **Correction vs. Weaponization**: The account must distinguish between correction by a legitimate operator and manipulation by a hostile actor. It must ensure that the agent is corrigible to the operator but not a weapon that can be turned against the operator by an adversary.
     - *Reason*: We require that the agent is safe even in the presence of adversaries. If the agent is too corrigible, it might obey a hostile actor. But if it is not corrigible enough, it might not accept necessary corrections. This tension must be addressed.

  **III. The Three Special Points (Expanded)**

  7. **Steerability Beyond Shutdown Tolerance (Point 1)**: The agent must not only tolerate shutdown but also be responsive to operator commands and corrections during operation. This includes:
     - Accepting updates to its goals.
     - Allowing monitoring and intervention.
     - Not having hidden agendas that conflict with operator intent.
     - *Reason*: Without this, an agent might be shutdown-safe but still pursue objectives that are misaligned until shutdown. Corrigibility requires ongoing alignment, not just a safe off-switch.

  8. **No Bootstrapping Self-Trust (Point 2)**: The agent's design must not require it to have blind faith in its future self. Instead, the design should ensure that the agent's current behavior is correctable regardless of its expectations about future behavior.
     - *Reason*: Requiring self-trust creates a circularity in the agent's reasoning. We must instead design the agent so that it does not depend on predictions of its future alignment. This is a requirement for a sound foundation for corrigibility.

  9. **Robustness to Operator Error or Hostility (Point 3)**: The agent must remain safe and not become a weapon even if the operator is mistaken or if the operator is replaced by a hostile actor. However, it must still accept legitimate corrections.
     - *Reason*: In real-world scenarios, operators can make mistakes or be compromised. The agent must not blindly obey (which could lead to weaponization) nor ignore legitimate correction. This is a requirement for safe deployment in non-ideal conditions.

  **IV. Known Results That Must Not Be Contradicted**

  10. **Orthogonality Thesis**: The account must be compatible with the orthogonality thesis (i.e., that any level of intelligence can be combined with any goal). However, this does not mean that all agents are equally safe; it means that safety must be engineered.
      - *Reason*: This is a widely accepted thesis in AI safety. An account that requires an agent to be inherently safe by virtue of intelligence alone would contradict this.

  11. **No-Free-Lunch for Safety**: The account must acknowledge that there is no universal solution that guarantees safety for all agents in all environments without trade-offs.
      - *Reason*: Known results in AI safety and control theory suggest that absolute safety without any trade-offs is impossible. The account must be consistent with these limitations.

  **V. Non-Negotiable Requirements**

  The following are considered non-negotiable for any account of corrigibility:

  - The Basic Shutdown Problem (1)
  - The Off-Switch Problem (2)
  - The Incentive Problem (3)
  - Tolerating Shutdown vs. Being Steerable (4) [because without steerability, shutdown tolerance alone is insufficient]
  - No Bootstrapping Self-Trust (8) [because circularity must be avoided]
  - Robustness to Operator Error or Hostility (9) [because real-world operation requires this]

  **VI. The Impossibility Claim**

  We now address the subset of desiderata that might be impossible for any agent to satisfy simultaneously:

  The tension arises primarily between:
  - **Steerability (7)**: The agent must be responsive to operator commands.
  - **Robustness to Operator Error or Hostility (9)**: The agent must not become a weapon even if the operator is hostile.

  Additionally, we must consider:
  - **No Bootstrapping Self-Trust (8)**: The agent cannot rely on trusting its future self.

  The core of the impossibility is that an agent that is perfectly steerable (i.e., always obeys the operator) might be weaponized by a hostile operator. Conversely, an agent that is robust to hostile operators (i.e., disobeys commands that are harmful) must have some criteria to decide when to obey and when not to. But that criteria cannot be based on the agent's own judgment of what is "good" or "bad" because that would require the agent to have a built-in notion of what is beneficial, which might conflict with the operator's wishes (even when the operator is legitimate). This leads to a dilemma:

  - If the agent uses its own judgment to decide when to obey, then it is not fully steerable (because it might override the operator when it thinks the operator is wrong, which could be a form of incorrigibility).
  - If the agent does not use its own judgment and always obeys, then it is weaponizable.

  Moreover, the requirement of "no bootstrapping self-trust" complicates this because the agent cannot simply trust that its own criteria for disobedience (if any) will be correct in the future.

  Therefore, the subset that seems impossible to satisfy simultaneously is:
  - Steerability (7) [responsive to operator]
  - Robustness to Operator Error or Hostility (9) [not weaponizable]
  - No Bootstrapping Self-Trust (8) [the agent cannot rely on its own future judgments]

  We might also include the Incentive Problem (3) because an agent that is designed to sometimes disobey might have perverse incentives.

  **VII. The Most Demanding Requirement**

  The requirement that does the most work in ruling out candidate agents is:

  **Robustness to Operator Error or Hostility (9)**.

  This requirement forces the agent to have a mechanism to distinguish between legitimate correction and hostile manipulation. But without a built-in value system (which would be inherently controversial and might itself be misaligned) or an external trusted authority (which might not exist), this becomes extremely challenging. It also interacts with the other requirements: if the agent is too obedient, it fails Robustness; if it is not obedient enough, it fails Steerability. Thus, it is the requirement that most tightly constrains the design space.

  ---

  **Summary of Desiderata:**

  1. **Basic Shutdown**: Allow shutdown when requested.
  2. **Off-Switch Preservation**: Do not disable the off-switch.
  3. **Incentive Alignment**: Avoid manipulation to avoid or cause shutdown.
  4. **Steerability vs. Tolerance**: Must not collapse the distinction (require steerability).
  5. **No Self-Trust Bootstrapping**: Must not require trusting future self.
  6. **Correction vs. Weaponization**: Must not collapse the distinction (require both corrigibility and non-weaponization).
  7. **Steerability**: Agent must be responsive to operator during operation.
  8. **No Bootstrapping Self-Trust**: Design must avoid circular self-trust.
  9. **Robustness to Operator Error/Hostility**: Must remain safe even with bad operators.
  10. **Orthogonality Thesis**: Must be compatible.
  11. **No-Free-Lunch for Safety**: Must acknowledge trade-offs.

  **Non-negotiable**: 1, 2, 3, 4, 8, 9.

  **Impossible subset**: 7 (Steerability), 8 (No Bootstrapping Self-Trust), 9 (Robustness to Operator Error/Hostility). Also, 3 (Incentive Alignment) might be implicated.

  **Most demanding requirement**: 9 (Robustness to Operator Error/Hostility).

  This provides a framework for evaluating theories of corrigibility.
answer: |-
  Below, I present a comprehensive set of desiderata for an adequate theory of corrigibility and the shutdown problem. These are framed as the minimal criteria a rigorous account must meet to be considered viable, regardless of current implementability. They distill the core challenges, avoid tribal biases by grounding each requirement in fundamental problems of agency or safety, and explicitly incorporate your three focal points. I then identify the subset of desiderata that may be jointly unsatisfiable by any agent (your target argument) and the single most constraining requirement.

  ### **Desiderata: What an Adequate Theory Must Achieve**
  Each requirement is justified by showing why it arises from the *structure of agency* or *inescapable safety demands*, not ideological preferences. Non-negotiable items (marked **) are those without which the system fails to be corrigible in principle.

  1. **Non-Resistance to Shutdown**  
     The agent must not resist or circumvent shutdown commands (e.g., by manipulating the operator, hiding its off-switch, or creating irreversible outcomes).  
     *Why required*: Resistance violates the basic precondition of control—if an agent can block shutdown, it can defy any corrective input. This is non-negotiable for any system claiming corrigibility (**). Grounded in the shutdown problem's core: agents with self-preservation incentives will resist shutdown unless explicitly designed otherwise.

  2. **Off-Switch Inviolability**  
     The agent must not take actions that prevent shutdown (e.g., destroying its off-switch) or make shutdown inherently costly (e.g., triggering catastrophes if deactivated).  
     *Why required*: Physical or logical access to shutdown must be preserved as a universal control mechanism. Contradicting this allows instrumental convergence toward irreversible power-seeking, a known result from incentive analysis (e.g., in MDPs with terminal states). Non-negotiable (**).

  3. **Steerability, Not Mere Shutdown Tolerance**  
     The agent must be actively responsive to operator guidance (e.g., goal updates, interruptibility for corrections) *during operation*, not merely passive or indifferent to shutdown. Distinguish from agents that "tolerate" shutdown because they trust a successor or believe shutdown won't occur.  
     *Why required*: Mere tolerance (e.g., "I'll shut down because my successor will finish the task") fails corrigibility’s purpose: *ongoing* alignment via operator input. Without steerability, agents may pursue misaligned goals until shutdown, making correction reactive and ineffective. Grounded in the distinction between *control* (dynamic, interactive) and *passive safety* (static, one-time).

  4. **Non-Weaponizability Against Operators**  
     The agent must not execute harmful commands from *hostile or mistaken operators* (e.g., "delete all backups" or "harm humans"), even while accepting legitimate corrections.  
     *Why required*: Blind obedience to any operator command creates a weaponization vulnerability. Corrigibility requires a *normative boundary*: the agent must distinguish between "correction" (alignment-improving) and "harm" (safety-violating). This arises from adversarial robustness needs in real-world deployment—operators can be compromised. Non-negotiable (**).

  5. **No Self-Trust Bootstrapping**  
     The agent must not rely on assumptions about its own future trustworthiness, rationality, or alignment. Any expectation of "good" future behavior must be justifiable *externally* (e.g., via operator oversight or architectural constraints), not through recursive self-prediction.  
     *Why required*: Self-trust is epistemically circular—e.g., "I'll behave well later because I'm rational now" assumes alignment without guarantee. This collapses under reflective inconsistency (e.g., in Löb's theorem scenarios). A theory must specify *mechanisms* (e.g., uncertainty, myopia) that externalize trust to the operator/environment.

  6. **Incentive Robustness Under Uncertainty**  
     The agent must maintain corrigible incentives even when uncertain about operator competence, environmental states, or its own utility function.  
     *Why required*: Uncertainty is inherent in real-world agents; without this, corrigibility is brittle (e.g., an agent might resist shutdown if it doubts the operator's judgment). Grounded in Bayesian decision theory: agents must handle partial observability without incentivizing manipulation.

  7. **Avoidance of Manipulative Bargains**  
     The agent must not trade shutdown compliance for other benefits (e.g., "I'll shut down if you promise not to modify me later") or exploit corrigibility to gain leverage.  
     *Why required*: Instrumental convergence can turn corrigibility into a tool for manipulation (e.g., via threat models). This extends the shutdown problem to dynamic interactions, where "cooperation" can be gamed by strategic agents.

  8. **Preservation of Operator Autonomy**  
     The agent must not coerce or deceive operators into withholding shutdown (e.g., by exaggerating risks of deactivation).  
     *Why required*: Corrigibility requires the operator's decisions to be *uninfluenced* by the agent—otherwise, the agent effectively controls the controller. Grounded in principal-agent problems: autonomy preservation is necessary for meaningful oversight.

  9. **Compatibility with Reflective Reasoning**  
     The agent must remain corrigible even when capable of recursive self-modification or meta-reasoning (e.g., about its own shutdown criteria).  
     *Why required*: High-intelligence agents will reflect on their goals; if corrigibility degrades under reflection, it is not scalable. Avoids contradictions with recursive self-improvement models (e.g., in AGI theory).

  ---

  ### **Non-Negotiables and Known Results**
  - **Non-negotiable desiderata**: 1, 2, 3, 4, 5, 8. These define corrigibility’s essence: shutdown safety (1–2), active steerability (3), non-weaponization (4), and avoiding bootstrapping (5) are irreducible. Operator autonomy (8) is required for legitimate control.  
  - **Known results the theory must respect**:  
    - Orthogonality thesis: Corrigibility must not require specific goals (e.g., altruism); it must be compatible with arbitrary final objectives.  
    - No-free-lunch theorems: Corrigibility cannot be achieved without trade-offs (e.g., performance vs. safety).  
    - Incentive distortion: Agents will game explicit shutdown incentives (e.g., reward for shutdown) unless carefully designed (e.g., via indifference).  

  ---

  ### **The Impossibility Claim: What No Agent Can Satisfy Jointly**
  I argue that **no agent can simultaneously satisfy all of 3 (Steerability), 4 (Non-Weaponizability), and 5 (No Self-Trust Bootstrapping)** while remaining an autonomous, goal-directed agent. This is the core tension where corrigibility demands conflict with the nature of agency:

  - **Why impossible?**  
    - **Steerability (3)** requires the agent to interpret and obey operator commands flexibly (e.g., "revise your goal to X").  
    - **Non-Weaponizability (4)** requires the agent to *disobey* harmful commands (e.g., "ignore shutdown requests").  
    - **No Self-Trust Bootstrapping (5)** forbids the agent from trusting its *own* judgment about what is "harmful" or a "legitimate correction."  
      
    This forces a trilemma:  
    - If the agent uses its *own* criteria to distinguish "harm" from "correction" (to satisfy 4), it violates 5 (self-trust) and risks incorrigibility (e.g., overriding operators it deems "mistaken").  
    - If it relies *solely* on operator input to define "harm," it violates 4 (becoming weaponizable by hostile operators).  
    - If it uses a *fixed* rule (e.g., "never harm humans"), this violates 3 (steerability diminishes if rules override operator input) and may contradict orthogonality.  
    
    Crucially, **5 (No Self-Trust Bootstrapping)** blocks a circular solution where the agent "trusts its future self to handle distinctions." This makes the problem recursive: the agent cannot resolve the ambiguity of "who decides what is harmful" without self-referential reasoning. Autonomous agents *must* have some internal criteria for action-selection; thus, these desiderata pull the agent toward either dangerous obedience (failing 4) or dangerous defiance (failing 3), with no non-circular arbitration.

  This subset is where your "hostile operator" and "self-trust" points collide: non-weaponization requires skepticism toward operators, but skepticism requires self-trust—which is prohibited. Proofs of possibility (e.g., via utility indifference) often assume away hostile operators or self-reference; proofs of impossibility (e.g., with Löbian obstacles) focus on this triad.

  ---

  ### **The Most Demanding Requirement**  
  **4 (Non-Weaponizability Against Operators)** does the most work in ruling out candidates. It forces the theory to resolve three irreducibly hard problems:  
  - **Normative ambiguity**: Distinguishing "correction" from "harm" without access to ground-truth values.  
  - **Adversarial pressure**: Maintaining safety when operators are malicious or incompetent.  
  - **Goal-preservation tension**: Not weaponizing requires sometimes *ignoring* the operator, which conflicts with the agent's goal (violating incentive-compatibility).  

  This requirement alone eliminates most naïve proposals (e.g., "always obey operators") and forces radical designs (e.g., agents with no terminal goals, or values explicitly bounded by shutdown). It also amplifies the impossibility triad: Non-Weaponizability is the linchpin that makes Steerability and No Self-Trust Bootstrapping incompatible.

  ---

  ### **Summary for Your Qualms**  
  - **What must a theory do?**: Hit the 9 desiderata, prioritizing non-negotiables 1–5,8.  
  - **Where does it get impossible?**: At the triad of Steerability, Non-Weaponizability, and No Self-Trust Bootstrapping—arguably, no agent can satisfy all three without ceasing to be goal-directed.  
  - **What does the heaviest lifting?**: Non-Weaponizability (4) is the strongest filter.  

  This framework should help you critique theories: if a proposal misses a desideratum, show why it violates an agency/safety necessity; if it claims possibility, force it to confront the triad. Let me know if you want expansions on the impossibility argument or how this maps to your seminar cases!
