prompt: |-
  I help run a weekly policy debate group at my university — about 20 students, mostly philosophy and law-adjacent, and we keep getting into the same mess whenever sex work law comes up. Everyone in the room says they're for decriminalisation, and then it turns out they mean completely different things: one person means the Nordic model with buyers criminalised, another means the German/Netherlands legalisation-and-regulation approach, another means the New Zealand approach (which I think is its own thing but I'm not sure exactly how it differs from full decriminalisation), and someone else means full decriminalisation of everything including managers, landlords, and platforms. We also have the abolitionist/end-demand people who agree with criminalising buyers but for totally different reasons than the public-health people, and a couple of libertarians who think the state shouldn't be involved at all. I want to make a one-page decision tree that sorts people by what they actually think rather than by which label they like. Can you design it? Maybe 12-14 branch nodes and 7-9 leaves. Each node should be a concrete question or claim someone can answer without already knowing which position it leads to — not "are you a decriminalisationist?" but things like whether buying should be a crime, whether selling should be, whether managers/landlords/advertisers should be, whether mandatory registration or health checks are acceptable, whether the state's main goal is reducing prevalence or improving working conditions, whether sex work is inherently harmful or just another job with bad labour protections, whether criminalising buyers reduces demand or just shifts harm onto workers, whether legalisation should exclude migrants/undocumented workers, whether the sex worker's consent can be genuine under economic pressure, and whether exit services should be funded instead of or alongside legalisation.

  The tree should be built from the logical space first and then locate the named positions in it, and I'd like you to flag any branches where two positions collapse into the same answers or where a combination is unoccupied — and say whether you think that's because the view is incoherent, unattractive, or just nobody has bothered to defend it. For each leaf give the position name (or "unnamed") plus one sentence on its most awkward commitment. Also, if the tree can't separate two views that people in my group insist are different, please say so rather than pretending the questions do the work. And don't just list countries and their laws; I can look those up. I want the diagnostic questions that get at the underlying disagreements. I'm not a lawyer, so some of my terminology is probly off — fix it where it matters, but keep the questions in plain language a first-year could answer.
reasoning: |-
  Okay, the user runs a university policy debate group focused on sex work law, and they're facing confusion because everyone uses "decriminalization" to mean different things. Their main need is a decision tree to clarify these positions based on underlying principles, not labels. 

  First, I need to map the logical space of disagreements. Key axes include criminalization of sellers/buyers/third parties, state regulation intensity, foundational beliefs about sex work (inherent harm vs. labor issue), migration policies, and consent debates. The user mentioned specific positions like Nordic Model, German approach, New Zealand style, and full decriminalization—these must be distinguishable in the tree.

  The user emphasized avoiding legal jargon and using plain-language questions. They want concrete nodes like "Should buying be a crime?" not theoretical labels. I should also flag where positions overlap or where combinations are unexplored (e.g., criminalizing only landlords—why is that rare? Probably because it's incoherent without targeting sellers/buyers). 

  Notable pitfalls: The Nordic Model vs. "end-demand" abolitionists might collapse if based solely on criminalizing buyers, but their reasons differ (gender violence vs. public health). Need a question about the state's primary goal to split them. Also, New Zealand's unique feature is no mandatory registration—that's crucial to separate it from German-style regulation.

  For the tree structure, 12-14 nodes and 7-9 leaves seems right. Start with criminalization questions (sellers, buyers, third parties), then regulation, then philosophical underpinnings. Each leaf must highlight an "awkward commitment" (e.g., Nordic Model's potential to harm workers). 

  User is clearly frustrated by surface-level agreement masking deep divides. The tree should force clarity—e.g., if someone supports health checks, they're pushed toward regulation models, not full decriminalization. Also, their note about libertarians and migrant exclusion needs representation. 

  Finally, warn where distinctions blur: e.g., "end-demand" and Nordic might share answers but diverge on "why." The tree can't resolve that—it's about actions, not motives. User should supplement with discussion on underlying values.
answer: |-
  Here's a 14-node decision tree designed to cut through the "decriminalization" ambiguity by forcing concrete answers on key disagreements. It prioritizes logical distinctions over labels, flags overlaps, and highlights awkward commitments.

  **Sex Work Policy Position Decision Tree**

  1.  **Should *selling* sexual services be a criminal offense?**
      *   **YES** ➔ **Prohibitionist** (Leaf 1) *Awkward Commitment: Believes arresting/victimizing workers is an effective way to address exploitation.*
      *   **NO** ➔ Go to 2

  2.  **Should *buying* sexual services be a criminal offense?**
      *   **YES** ➔ Go to 3
      *   **NO** ➔ Go to 4

  3.  **What is the PRIMARY justification for criminalizing buyers?**
      *   **To reduce demand/prevalence of sex work as inherently harmful exploitation.** ➔ **Nordic Model / "End-Demand" Abolitionism** (Leaf 2) *Awkward Commitment: Criminalizing clients often pushes the industry underground, making workers *less* safe and accessible to support services.*
      *   **Primarily to protect public health/order or workers (e.g., deterring trafficking, exploitation).** ➔ **Nordic Model / Public Health Focus** (Leaf 3) *Awkward Commitment: Shares the harmful consequences of criminalizing clients with Leaf 2, potentially undermining stated public health goals.*
      *   **Note:** Leaves 2 & 3 often collapse in practice (Nordic Model) despite differing motivations. The tree can't perfectly separate them as policies are identical. Distinction requires discussing *why* criminalization is favored.

  4.  **Should *third parties* (managers, landlords, advertisers, platforms) facilitating consensual adult sex work be criminalized?**
      *   **YES** ➔ **"Selling OK, Buying & Third Parties Criminalized"** (Leaf 4 - Uncommon/Unnamed?) *Awkward Commitment: Creates a bizarre legal limbo where selling is legal but anyone helping the seller operate safely/efficiently (or paying them) is criminalized, likely isolating workers. (Likely incoherent/unattractive - rarely defended).*
      *   **NO** ➔ Go to 5

  5.  **Should the state impose *mandatory* registration, licensing, or health checks on sex workers?**
      *   **YES** ➔ Go to 6
      *   **NO** ➔ Go to 7

  6.  **Should these regulations *exclude* migrant/undocumented sex workers?**
      *   **YES** ➔ **German/Dutch-Style Legalization/Regulation (Exclusionary)** (Leaf 5) *Awkward Commitment: Creates a two-tier system pushing marginalized migrant workers into an illegal, unregulated, and more dangerous sector.*
      *   **NO** ➔ **German/Dutch-Style Legalization/Regulation (Theoretical Inclusive)** (Leaf 6) *Awkward Commitment: Mandatory systems often still fail marginalized workers due to stigma, privacy concerns, and bureaucracy, potentially creating de facto exclusion.*

  7.  **Is sex work inherently harmful/exploitative due to its nature (not just current conditions), making genuine consent impossible under capitalism?**
      *   **YES** ➔ **Abolitionist (Non-Criminalizing)** (Leaf 7 - e.g., some feminist/service-provider stances) *Awkward Commitment: Must oppose full decriminalization/legalization, instead prioritizing exit services, while not criminalizing workers themselves.*
      *   **NO** ➔ Go to 8

  8.  **Should the state actively fund and prioritize *exit services* for sex workers who want to leave?**
      *   **YES, as a core strategy alongside non-criminalization.** ➔ **New Zealand-Style Decriminalization / Exit-Focused Support** (Leaf 8) *Awkward Commitment: Risks implying sex work is inherently undesirable in a way other jobs aren't, potentially undermining labor rights arguments.*
      *   **NO, or only as part of general social services (like any job).** ➔ **Full Decriminalization / Labor Rights Model** (Leaf 9) *Awkward Commitment: Must grapple with severe exploitation/trafficking without resorting to criminalization or paternalistic regulation, relying on standard labor law/policing.*

  **Key Observations & Flags:**

  1.  **Nordic Model Ambiguity:** The tree forces the distinction between "End-Demand" ideology (Leaf 2) and pragmatic public health arguments (Leaf 3) for criminalizing buyers, but their *policy prescriptions* are identical. This highlights that the label "Nordic Model" masks significant internal disagreement on *why* buyers are criminalized.
  2.  **The "Third Party" Trap:** Leaf 4 (Criminalize only Third Parties & Buyers) is logically possible but practically incoherent. Criminalizing landlords/advertisers while selling is legal makes safe operation nearly impossible, isolating workers. This branch is likely unoccupied because it's unworkable.
  3.  **Regulation vs. Decriminalization:** The key split between Leaves 5/6 (Legalization/Regulation) and Leaves 7/8/9 hinges on **mandatory state control** (Q5). New Zealand Style (Leaf 8) and Full Decrim (Leaf 9) both answer "NO" to mandatory registration/health checks.
  4.  **Abolitionism Without Criminalization:** Leaf 7 captures abolitionists who reject criminalizing *workers* but still see the work as inherently exploitative, prioritizing exit over legal frameworks. This is distinct from the Nordic Model which criminalizes buyers.
  5.  **New Zealand Nuance:** NZ Style (Leaf 8) is separated from Full Decrim (Leaf 9) by its emphasis on state-funded exit services *as a core strategy*. Both oppose criminalization and mandatory regulation.
  6.  **Libertarian Position:** Full Decriminalization (Leaf 9) encompasses the libertarian "state shouldn't be involved" view, rejecting criminalization *and* regulation *and* prioritizing exit funding.
  7.  **Migrant Exclusion:** The tree explicitly flags how Legalization/Regulation models (Leaf 5) often functionally exclude migrants, a major criticism.
  8.  **Consent Question:** Q7 directly tackles the core philosophical disagreement about whether economic pressure voids consent *specifically* for sex work. A "YES" pushes towards abolitionism (Leaf 7), a "NO" allows for labor rights frameworks (Leaves 8 & 9).

  **How to Use This:**

  1.  **Answer Honestly:** Start at Q1 and answer based on your actual beliefs about policy, not which label you prefer.
  2.  **Follow the Path:** Your answers will lead you down the branches to a leaf position.
  3.  **Check the Leaf:** Read the position name and its "Awkward Commitment." Does this accurately reflect your view and its most challenging implication?
  4.  **Discuss the Nodes:** When disagreements arise, pinpoint *exactly* which question(s) you answer differently. E.g., "We both end up in Full Decrim, but you said YES to funding exit services (Leaf 8) and I said NO (Leaf 9)." Or, "We both support the Nordic Model, but you answered Q3 based on inherent harm (Leaf 2) and I answered based on public health (Leaf 3)."

  This tree won't resolve the deep ethical disagreements (hence the "awkward commitments"), but it will force clarity on what policy prescriptions actually follow from those disagreements, moving beyond the uselessly vague label of "decriminalization."
