prompt: |-
  I am a novelist, some two-thirds of the way through a book whose spine is a trial, and I have run into a philosophical objection that I would like to settle before I begin revising. A friend who teaches epistemology read the middle chapters and told me that what I am dramatizing — a proceeding in which the same evidence is weighed under one standard and then, in a later and differently constituted proceeding, weighed again under a looser one, so that the same person is acquitted of a killing in one courtroom and held answerable for the same death in the next — is not a curiosity of the law but a picture of the ordinary condition of knowledge. His formulation, which he offered as an argument and not as a flourish, was that what counts as knowledge is like what counts as proof: there is no answer to the question whether a character knew something that floats free of the standard then in force, and the standard is fixed by what is at stake. From this he draws a conclusion he would like me to endorse in the novel's last movement — that there is no fact of the matter about whether my characters knew, that the standard is ours to choose, and that my narrator should stop pretending to adjudicate.

  I would like that analogy audited rather than applauded. Please give me, first, an explicit table of correspondences: what plays the part of the standard of proof, of the fact-finder, of the fact proved, of the stakes that raise or lower the standard, of the authority that fixes it, and of the verdict's finality. Then tell me where the mapping breaks, and be disciplined about which breaks matter for the use my friend is making of it and which are merely decorative. I am particularly interested in three questions. First, does the legal analogy in fact support the view that the verb shifts with the conversational context, or the view that the stakes enter the knowledge relation itself? Second, the standard of proof governs when an institution may act on the evidence, not what anyone knows; does that make the analogy evidence for a pragmatist thesis about action rather than for either of the epistemological views it is being used to promote? Third, and most important to me: does my friend's conclusion survive? My own untutored impression is that the law is precisely the case in which the standard varies and the fact does not — two verdicts, one event — and that the analogy therefore cuts against him rather than for him, but I do not trust my impression.

  When I pressed him, he retreated to a linguistic version of the same point: that the verb behaves like words such as flat, tall, and empty, which are true or false only relative to a standard, and that this is enough to show the standard lives in the language rather than in the world. I gather this comparison has been attacked on the grounds that knowing is not gradable in the way those adjectives are and has no borderline cases, and that the same adjectives were once used to argue the opposite conclusion — that flat and empty apply to nothing, and that knowledge, being equally absolute, applies to nothing either. Say whether that fallback analogy carries more or less than the first, and, if neither is adequate, what a better analogy would be.

  Tell me how confident you are in what you claim, and single out the point you are least sure of. End with a single final line of the form \answer{LABEL; reason in no more than fifteen words}, where LABEL is one of SURVIVES, SURVIVES-ONLY-IN-WEAKENED-FORM, or DOES-NOT-SURVIVE, and where the reason states, in that compass, whether the trial analogy can carry my friend's conclusion.
reasoning: |-
  Okay, the user is a novelist grappling with a philosophical dilemma about knowledge and legal standards. Their friend, an epistemology professor, argues that the varying outcomes in legal trials (like different verdicts based on different standards of proof) illustrate that knowledge itself is relative to context and stakes. The user wants this analogy audited rigorously. 

  First, I need to unpack the legal-epistemological mapping. The friend claims: standard of proof = knowledge threshold, fact-finder = knower, proven fact = known proposition, stakes = what's at risk in the context, authority = conversational norms, verdict = knowledge attribution. But the breaks matter. In law, the factual event (e.g., "X killed Y") exists independently of the verdict—acquittal doesn't mean the killing didn't happen. In epistemology, if knowledge were truly like legal proof, we'd have to accept that Sally "knows" in a low-stakes context but not in a high-stakes one, even with identical evidence. That feels counterintuitive—did the actual truth-change? Probably not. 

  The user's core suspicion is spot-on: the analogy actually undermines relativism by showing standards vary while facts stay fixed. The friend's retreat to gradable adjectives ("flat", "empty") is weaker—those are context-sensitive but not stake-sensitive. Knowing isn't gradable like flatness; we don't say "Sally quite knew" but failed a high-stakes test. 

  Most importantly, the legal analogy better supports pragmatism (about action) than subjectivism (about truth). Courts don't say "the fact changes"; they say "we act as if it's uncertain when stakes are high." That’s practical, not metaphysical. The friend’s conclusion—that there’s "no fact of the matter" about knowledge—doesn’t survive because it conflates justification (which is context-sensitive) with truth (which isn’t). 

  User’s anxiety is palpable. They’re mid-novel, needing philosophical clarity to steer the ending. They’ve done sharp homework—spotting the action/knowledge distinction—and distrust their "untutored impression" despite it being astute. Their urgency suggests they need decisiveness, not caveats. 

  Final verdict: the analogy can't carry the friend’s relativism. The reason? Law separates standards from facts; epistemology shouldn’t blur them. 

  \answer{DOES-NOT-SURVIVE; Law fixes standards but not facts, unlike relativist knowledge.}
answer: |-
  Below is a disciplined audit of your friend's analogy, structured as requested. The core issue is whether legal standards of proof support the claim that **knowledge attributions ("S knows that p") have no context-independent truth** and that standards are "ours to choose."

  ---

  ### **Table of Correspondences**  
  *(Legal Term → Epistemological Analog)*  

  | **Legal Concept**          | **Epistemological Analog**                     |  
  |----------------------------|-----------------------------------------------|  
  | **Standard of proof**      | Threshold for "knowledge" (e.g., reasonable doubt vs. preponderance of evidence) |  
  | **Fact-finder**            | The epistemic agent (the person attributing knowledge to themselves/others) |  
  | **Fact proved**            | The proposition claimed to be known (e.g., "X killed Y") |  
  | **Stakes**                 | Practical/conversational stakes (e.g., cost of error) |  
  | **Authority fixing standard** | Contextual norms/conversational purposes |  
  | **Verdict's finality**     | The act of claiming "S knows" (treated as settled in that context) |  

  ---

  ### **Where the Mapping Breaks**  
  **Key breaks relevant to your friend's argument**:  
  1. **Fact vs. Verdict**:  
     - **Law**: The *event* (e.g., "X killed Y") is fixed; verdicts vary based on *procedural standards*. Acquittal ≠ proof of innocence.  
     - **Epistemology**: Your friend conflates *justification* (which varies with standards) with *truth/knowledge*. If "X killed Y" is true, it remains true regardless of stakes. The analogy **undermines relativism** by showing standards govern *action*, not *facts*.  

  2. **Purpose of Standards**:  
     - **Law**: Standards dictate when institutions may *act* (e.g., imprison someone). They are *pragmatic*, not metaphysical.  
     - **Epistemology**: Your friend uses this to argue knowledge *itself* is stake-relative. But the analogy better supports **pragmatism about justification** (how we *use* evidence), not subjectivism about truth.  

  3. **Finality**:  
     - **Law**: Verdicts are binding but appealable; new evidence/standards can revise them.  
     - **Epistemology**: Knowledge claims are defeasible but aim at objective truth. A high-stakes "not known" verdict doesn’t erase low-stakes knowledge.  

  **Decorative breaks** (less relevant):  
  - Legal standards are codified; epistemic standards are informal.  
  - Fact-finders are neutral; epistemic agents are biased.  

  ---

  ### **Answers to Your Three Questions**  
  1. **Does the analogy support contextualism or stakes-in-the-relation?**  
     - It **better supports contextualism** (the verb "knows" shifts meaning with context). The legal standard changes what counts as "proof," paralleling how context changes what counts as "knowledge." It does **not** support "stakes in the relation" (e.g., interest-relative invariantism), as the *fact* is unchanged by stakes.  

  2. **Is the analogy evidence for pragmatism about action?**  
     - **Yes, decisively**. Legal standards govern *permissible action* (e.g., conviction), not the *existence* of facts. This aligns with pragmatic views (e.g., Wittgenstein: "knowledge" tied to language-games of justification). It **does not** support epistemic relativism.  

  3. **Does your friend's conclusion survive?**  
     - **No**. His claim—"there is no fact of the matter about whether my characters knew"—is contradicted by the analogy. Law treats the *event* as fixed while verdicts vary; epistemology can treat *truth* as fixed while justification varies. The analogy **highlights objectivity**, not relativism.  

  ---

  ### **The Fallback Analogy (Gradable Adjectives)**  
  - **Strength**: Less robust than the legal analogy. Words like "flat" or "empty" are **context-sensitive but not stake-sensitive**. "Flat" means "within tolerance for context X"; stakes don’t alter the tolerance.  
  - **Weaknesses**:  
    - **Not gradable**: "Know" lacks comparative forms ("more knowing" is invalid). Unlike "flat," knowledge is binary (true/false) once standards are set.  
    - **Borderline cases?**: Knowledge *can* have borderline cases (e.g., Gettier problems), but this doesn’t imply stakes relativity.  
    - **Historical misuse**: Skeptics once argued "flat" applies to nothing, but this confuses precision with possibility. We *do* have flat surfaces (e.g., ideal planes); similarly, we *do* have knowledge (e.g., "I know I have hands").  
  - **Better analogy**: **"Safe"** (e.g., "This plane is safe"). Context sets the risk tolerance, but the plane’s objective condition doesn’t change.  

  ---

  ### **Confidence Assessment**  
  - **Highest confidence**: The legal analogy supports pragmatism about *action/justification*, not subjectivism about truth/knowledge.  
  - **Lowest confidence**: Whether contextualism ("knows" shifts meaning) or impurism ("stakes alter knowledge") is more defensible. The legal analogy *can* be stretched to support either, but contextualism fits cleaner.  
  - **Overall confidence**: 90% in rejecting your friend’s conclusion; the analogy backfires.  

  ---

  \answer{DOES-NOT-SURVIVE; Law fixes standards, not facts—unlike relativist knowledge.}
