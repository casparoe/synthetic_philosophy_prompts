  *checks word count* 650 words means every sentence must multitask. The congratulatory opener sets the ironic tone immediately. "Your unique perspectives" will hint at the representativeness problem while sounding positive. 

  For the JSON appendix, each issue needs clinical descriptions matching the handbook's veiled references. Recognition statements should validate that the satire targets real academic debates - e.g., deliberative transformation compromising statistical validity isn't invented. 

  *mental note* An advocate of sortition should nod along, not feel attacked. No strawmen. When describing expert testimony, saying "balanced perspectives" will hint at curation bias without accusation. The "consent to participate" waiver can imply coercion through excessive perk-listing. 

