  First, I need to assess their core argument. They challenge the traditional narrative that Hobbes's geometry was merely a failed mathematical endeavor overshadowed by Wallis. Instead, they position it as a coherent philosophy of demonstrative science rooted in maker's knowledge. The user links Hobbes's geometric constructivism to his political philosophy, suggesting both rely on creating the objects of study. Then, they contrast this with Wallis's algebraic approach, framing their conflict as epistemological. The tension they identify between constructivism and materialism seems crucial—does Hobbes think we create real bodies or just conceptual artifacts?

  I should verify if the user accurately represents Hobbes's view of demonstration. Hobbes indeed emphasized definitions based on generation, like defining a circle through motion. The maker's knowledge model is present in Hobbes, though later thinkers like Vico expanded it. The user might be conflating Hobbes's focus on causal definitions with a broader epistemological tradition. But overall, their reading seems solid.

  Regarding Wallis, the user's claim that his algebra represents a different epistemology holds. Wallis prioritized symbolic manipulation over constructive intuition, which Hobbes criticized as empty formalism. This aligns with historical accounts of their dispute. The user should delve deeper into how Wallis's methods reflect a shift towards formal systems, possibly referencing Jesseph's work for support.

  The tension between constructivism and materialism is a strong point. Hobbes's materialism requires geometry to be about real bodies, yet his constructivism suggests we create these objects. The user questions whether this is equivocation between physical construction and mental conception. Hobbes might argue that geometric objects are mental constructs based on material properties, but the tension remains unresolved. Highlighting this could show Hobbes's system's fragility.

