  Give me an example of a case that actually makes the special composition question hard -- you know, the "when do a bunch of things add up to one futher thing" question. I know the three standard answers (always, never, and only when the parts are caught up in a single life) and I've heard the statue-and-clay and the ship stuff to many times, so I want something else. Ideally a case where two of the answers both feel right and you have to give up something you liked in order to pick one. Extra credit if it's something like a slime mold, a termite mound, a jazz quartet mid-solo, or a coral reef -- where "is this one thing or many?" is doing real work instead of being a parlor trick. Also, someone once told me the real criterion is that composition happens when the parts are mutually dependent, so you can't pull one out without the rest rearranging themselves -- is that even a live position, and does your example help or hurt it? Then say which answer the case actually favors once you stop hedging, and where exactly it stops being decisive.
