prompt: |-
  I chair the collections committee of a small university museum, and an accident in the courtyard has landed us in a dispute about identity that I would rather not resolve by fiat. The museum's founder commissioned a bronze equestrian figure in 1908; the sculptor's original plaster maquette is still in our stores, and the bronze was cast from it in 1911 and stood on the same plinth until a storm brought down an old elm last autumn and shattered it beyond repair. Wishing the courtyard restored before convocation, our director had the foundry cast a replacement from the maquette — same alloy, same scale, using the same mold taken from the maquette that was used in 1911 — and it now stands on the original plinth. One further detail has made the argument worse rather than better: rather than sell the shattered bronze for scrap, we had the fragments melted down and blended into the new pour, so that roughly a tenth of the metal in the figure now standing outside is metal that was part of the figure that fell. My committee meets Thursday and must settle four things: whether the registrar retires the 1911 accession number or opens a new one; what the rededication plaque may say (the alumni association wants it to read that this is the same statue, restored); whether the 1911 bequest, which obliges us to keep the statue in the courtyard in perpetuity and funds its upkeep, still binds the endowment or has lapsed — the donor's granddaughter sits on the board of trustees and the development office is watching this closely; and whether we can accept a lender's request to borrow the 1911 bronze for an exhibition in the spring.

  Please draft the short written opinion I will circulate before the meeting. I want a concrete recommendation on each of the four points, with a time frame for acting on it, and a principled test I can state in a sentence and defend, rather than a pragmatic "let us call it the same for the alumni." The committee is split. Our curator says it is the same statue because it came from the same mold and looks the same from the courtyard path; our conservator says it is the same statue only if it retains the original material, and points to the salvaged metal as evidence that it does; a colleague from the philosophy department says the bronze never was the statue but merely constituted it, that the statue is the shape, and that the shape was re-created rather than continued, so the 1911 statue is simply gone and what stands outside is a new work of the same design; the director says that whatever we call it, the courtyard is restored and the paperwork should reflect the institution's interests. Engage the strongest of these positions on its own terms before recommending against it — in particular, if you conclude that the 1911 statue no longer exists, say plainly what follows for the bequest and the loan, and if you conclude that it does exist, say exactly what work the salvaged metal is doing in your reasoning, since I suspect that is where the real argument lies. No need to cite any literature; argue from the case.
reasoning: |-
  Okay, the user chairs a museum committee dealing with a complex identity dispute over a bronze statue. Let me unpack this carefully. 

  First, the core problem: is the replacement statue the "same" as the original 1911 work? The physical facts are crucial - they recast using the original mold and maquette, same alloy and scale, plus incorporated 10% salvaged metal from the shattered original. But those facts support multiple interpretations, as seen in the committee's divisions.

  Hmm, the curator focuses on visual continuity (same mold, same appearance) while the conservator emphasizes material persistence (the 10% recycled bronze). The philosopher takes a conceptual approach (statue as form rather than matter), and the director pragmatically wants to avoid complications. The user needs a principled resolution that addresses all four practical questions: accession numbering, plaque wording, bequest status, and loan request.

  The recycled metal seems to be the emotional and philosophical crux. Without it, this would clearly be a replica. With it, some might argue for continuity. But materially speaking, 10% is symbolic at best - like adding a teaspoon of heirloom flour to new dough. The form argument feels stronger here: if the statue is its shape, then destruction of the original shape ended that particular work. The recreated shape is a new instantiation.

  For the practical outcomes: the accession number must be new because the original artifact is gone. The plaque can acknowledge the recreation without claiming identity. The bequest likely lapses since its object no longer exists - though they might seek legal advice given the trustee connection. And borrowing the "1911 bronze" is impossible because it doesn't exist anymore; they could borrow the maquette instead.

  The user needs this framed as a defensible principle. Maybe: "A work's identity requires continuity of both form and material; the loss of either creates a new artifact." This honors the conservator's concern while acknowledging the philosopher's point. And crucially, it prevents future slippery slopes - if they call this "the same statue," what about a 100% replica?

  ...Wait, should address why the salvaged metal doesn't change things. It's like adding a relic to a new object - meaningful symbolically but not constitutive. The committee might need to hear that explicitly since the conservator is using it as evidence.
answer: |-
  ## Committee Opinion: Statue Identity & Practical Resolutions  
  *Circulated by [Your Name], Chair, Collections Committee*

  The accident forces us to confront the nature of the statue’s identity – a question of both physical reality and institutional duty. While perspectives differ, a clear principle emerges: **A work’s identity requires the persistence of its original material form; destruction of that form ends the work, and recreation, even with shared matter or origin, creates a new artifact.** This principle balances material integrity (conservation) with conceptual clarity (philosophy), avoids the pitfalls of visual similitude alone (curation), and provides a stable foundation for institutional practice (director’s concerns), without resorting to expediency.  

  ### Applying the Principle to the Four Questions

  1.  **Accession Number:**  
      *   **Recommendation:** Retire the 1911 accession number. Open a new accession number for the 2024 cast.  
      *   **Reasoning:** The original 1911 bronze, as a distinct material object with its own history (weathering, patina, damage), was destroyed. The 2024 object, while sharing design and some material, is a new physical instantiation.  
      *   **Time Frame:** Immediate. Registrar to process retirement and new accession prior to finalizing any public-facing documentation or plaque text.  

  2.  **Rededication Plaque:**  
      *   **Recommendation:** The plaque should read: "Recreated in 2024 from the original 1908 maquette, incorporating bronze salvaged from the 1911 statue lost in the storm of 2023."  
      *   **Reasoning:** This accurately reflects the historical facts: the original statue is lost; this is a new creation; it honors the original design and incorporates salvaged material as a tangible link to the past, without falsely claiming identity. It satisfies the alumni’s desire for connection while maintaining accuracy.  
      *   **Time Frame:** Draft text finalized by the end of the meeting; approved by Director and Communications by [Date - e.g., one week later].  

  3.  **1911 Bequest Status:**  
      *   **Recommendation:** The specific obligation to "keep the [1911] statue in the courtyard in perpetuity" has lapsed due to the statue’s destruction. The endowment funds for "upkeep" are no longer applicable to the original statue.  
      *   **Reasoning:** The bequest contractually binds the museum to a specific object (the 1911 bronze). That object no longer exists. The principle of identity requires this conclusion. The obligation cannot transfer to a fundamentally different artifact created over a century later, regardless of appearance or shared metal.  
      *   **Implication:** The funds related to the *specific statue's upkeep* revert to the general endowment or lapse, subject to the original bequest agreement's terms regarding failure of purpose. *However:*  
      *   **Action:** Recommend immediate consultation with University Counsel and the Development Office. Explore:  
          *   Whether the *spirit* of the bequest (maintaining an equestrian statue in the courtyard) can be honored using the endowment funds for the *upkeep of the new statue*, possibly requiring agreement from the donor's heirs (especially the Trustee granddaughter).  
          *   If the original bequest language allows for reinterpretation or substitution in case of destruction.  
      *   **Time Frame:** Consultation with Counsel/Development initiated within 48 hours of the committee meeting; recommendation on fund reallocation/agreement sought by [Date - e.g., end of next month].  

  4.  **Loan Request for "1911 Bronze":**  
      *   **Recommendation:** Decline the loan request for the "1911 bronze".  
      *   **Reasoning:** The 1911 bronze no longer exists. We cannot lend an object that has been destroyed.  
      *   **Alternative Offer:** Propose lending the **original 1908 plaster maquette** for the exhibition. This is the true, unique historical artifact that gave rise to both bronzes and directly links to the sculptor's hand and the 1911 work. This offers significant scholarly and historical value to the exhibition.  
      *   **Time Frame:** Registrar to formally decline the loan for the "1911 bronze" and propose the maquette loan immediately after the meeting.  

  ### Engaging Key Positions

  *   **Curator (Same Mold/Same Look):** While the visual continuity is crucial for the *courtyard's aesthetic restoration*, and the shared mold is historically significant, visual similitude alone does not constitute identity. Many replicas share mold origins and appearance but are distinct objects. The courtyard is restored aesthetically, but the specific artwork from 1911 is not present.
  *   **Conservator (Salvaged Metal = Continuity):** The salvaged metal is significant, but its role is symbolic and connective, not constitutive of identity. Incorporating 10% original matter into a new form does not reconstitute the original object; it creates a new object *containing a relic* of the old. It honors the lost statue but does not resurrect it. The salvaged metal is evidence of the *loss* of the original and the creation of something new incorporating its remnants, not evidence of persistence.
  *   **Philosopher (Statue is Shape/Material Destroyed):** This position aligns most closely with the recommended principle. The original material form (shape+matter) was destroyed. Recreating the shape, even using some original matter, creates a new instance of the *type* (the design), but not the original *token* (the 1911 artifact). The practical consequences (retired accession, lapsed specific bequest obligation, inability to lend the non-existent original) follow logically and must be acknowledged, even if mitigated through alternative actions (new accession, maquette loan, bequest renegotiation).
  *   **Director (Institutional Interests/Restored Courtyard):** The courtyard *is* restored aesthetically and functionally with a faithful recreation. However, institutional interests are best served long-term by accurate documentation, clear ethical practice, and avoiding precedents where replicas are conflated with originals. This recommendation achieves restoration *and* principled accuracy, providing clear guidelines for the registrar, development office, and future committees.

  ### Conclusion
  The 1911 statue, as a unique material entity, is lost. The 2024 figure is a new, distinct artifact: a historically significant recreation incorporating salvaged material. This conclusion, grounded in the persistence of material form, provides the clearest, most defensible foundation for our actions. It demands we retire the old accession, create a new one, craft an accurate plaque, acknowledge the likely lapse of the specific bequest obligation (while seeking solutions), and decline the loan for the original. It honors the past truthfully while stewarding the present responsibly. I recommend the committee adopt this approach.
