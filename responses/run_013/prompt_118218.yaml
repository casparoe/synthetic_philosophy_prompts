     - **Yes** → **Leaf: Affected-Interests Cosmopolitan**  
       - *Description:* Franchise grounded in affected interests. Enfranchises non-citizen residents (affected) but not children (incompetence/age barrier). Voting is a right, not necessarily a duty; abstention may be tolerated. Demos boundary is flexible (could be decided democratically).  
       - *Concrete cases:* Non-citizen resident: yes. Expat citizen: yes. 16-year-old: no. Disengaged voter: not compelled.  
     - **No** → **Leaf: All-Subjected View**  
       - *Description:* Franchise grounded in being subject to the state's laws. Enfranchises non-citizen residents (subjected) but not expats (not fully subjected). Children excluded (capacity concerns). Voting is a right; abstention is not protected expression. Demos boundary is fixed (not democratically revisable).  
       - *Concrete cases:* Non-citizen resident: yes. Expat citizen: no. 16-year-old: no. Disengaged voter: not compelled.  

