     - *Rationale: Tests if compulsion violates expressive rights.*

     - **Yes** → **Leaf: Compulsion Impermissible**  
       - *Description:* Voting is a right; abstention is protected expression. Compulsion violates autonomy. Franchise basis varies (e.g., citizenship, age 18+). Demos boundary is flexible.  
       - *Concrete cases:* 16-year-old: no. Disengaged voter: not compelled.  
     - **No** → **Leaf: Unnamed (Voluntarism Without Expression Claim)**  
       - *Description:* Voting is a right, not a duty, but abstention isn't specially protected. Compulsion is permissible but not mandated. Franchise basis varies.  
       - *Unoccupied?* Coherent but unstable; rarely defended (voluntarists usually protect abstention as expression).  
       - *Concrete cases:* 16-year-old: no. Disengaged voter: not compelled.  

  ---

  ### Key Notes:
  1. **Unoccupied Combinations:**  
     - **"Civic-Duty + Affected-Interests Cosmopolitan"**  
       - *Why:* The civic-duty view assumes a fixed demos (e.g., citizens/residents), while affected-interests cosmopolitanism treats the demos as fluid. Combining duty with fluid boundaries is incoherent (can't enforce duties on an unstable electorate).  
     - **"Compulsion + Competence-Based Franchise"**  
       - *Why:* Coherent but unattractive. Forcing sharp 14-year-olds to vote is seen as paternalistic and logistically fraught (assessing competence at scale is impractical).  

  2. **Leaves the Tree Cannot Separate:**  
     - The tree **cannot distinguish** between variants of the civic-duty view (e.g., duty based on citizenship vs. residency). All converge on "Civic-Duty View" (Leaf 5).  
     - The tree **cannot isolate** "demos boundary flexibility" as a standalone distinction; it emerges indirectly in leaves (e.g., fixed in all-subjected, flexible in affected-interests).  

  3. **Clarifications on Positions:**  
     - **All-subjected view** excludes expats (not currently subjected) and children (lacking full autonomy).  
     - **Affected-interests cosmopolitan** includes expats (affected by foreign policy) but excludes children (affected but not competent).  
     - **Combo position** prioritizes capacity (age 16) but rejects compulsion to protect autonomy.  

  This tree allows your reading group to navigate real-world cases while exposing core theoretical tensions. Use the cases to trigger debate at each branch!
