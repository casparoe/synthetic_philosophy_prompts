answer: |-
  Here is a two-page research proposal structured to meet your requirements, balancing conceptual framing for philosophers and formal precision for computer scientists, while maintaining realistic scope.

  ---

  **Research Proposal: Stability and Impossibility in Iterative Algorithmic Fairness**

  **1. Core Research Question:**  
  *Can an iterative decision policy allocating a scarce resource (e.g., loans, interventions) simultaneously satisfy (i) calibration-by-group at every timestep, (ii) per-round equal opportunity (EO; equal TPR across groups), and (iii) equity stability (defined as the policy inducing a stationary population distribution where group base rates and error rates remain constant across timesteps), when group qualifications evolve endogenously based on prior allocations?*

  **Determinate Answer Target:** A formal proof establishing one of the following mutually exclusive outcomes:
      *O1 (Impossibility):* No policy satisfying (i), (ii), and (iii) exists under a defined class of feedback models (specified via qualification dynamics).
      *O2 (Possibility):* A constructive proof demonstrating a specific policy and feedback model satisfying (i), (ii), and (iii).
      *O3 (Refined Impossibility):* Proof that (iii) is equivalent to the base rate disparity required by the single-shot impossibility, rendering feedback irrelevant.

  **2. Why Single-Shot Results Leave This Open:**  
  Existing impossibility theorems (Chouldechova, Kleinberg, et al.) crucially assume a *static* population distribution. Group base rates (\(P(Y=1 | G)\)) are fixed exogenous parameters. Critically, the decision rule \(f_t\) has *no causal influence* on the distribution of qualifications (\(Y\)) or group composition in subsequent rounds (\(t+1, t+2, ...\)). This decouples the fairness criteria from the policy's long-term distributional impact. In iterative deployments, however, allocating a loan/program slot *changes* an individual's (and thus their group's) future qualifications and presence in the population. The policy itself *shapes* the very distributions to which fairness criteria are applied in the next round. The single-shot framework cannot model this feedback loop or the stability condition (iii), making the applicability of its impossibility results to dynamic settings an open question.

  **3. Methodology & Timeline (Concrete Monthly Plan):**

  *   **Months 1-2: Formal Framework Specification (Scope Definition)**
      *   Define the formal iterative model:
          *   **Population:** Two groups \(G \in \{A, B\}\). Time steps \(t = 1, 2, ..., T\).
          *   **State:** At time \(t\), group \(G\) has base rate \(p_t^G = P(Y_t = 1 | G)\) and size \(N_t^G\).
          *   **Policy:** A scoring function \(s_t(X, G)\) or decision rule \(d_t(X, G) \in \{0,1\}\) (allocate/not), trained on data from \(t-1\).
          *   **Feedback Dynamics (Core Novelty):** Define how allocation \(d_t\) *causally* affects future state. Specify a tractable model (e.g.):
              *   *Simplified Qualification Update:* Receiving the resource increases \(P(Y_{t+1}=1 | \text{allocated})\) by \(\delta\) (fixed effect).
              *   *Population Flow:* Define entry/exit probabilities based on allocation/outcome.
          *   **Fairness Criteria:** Precisely formalize (i) Calibration (\(P(Y_t=1 | s_t(x,G)=v, G) = v\)), (ii) Per-round EO (\(P(d_t=1 | Y_t=1, G=A) = P(d_t=1 | Y_t=1, G=B)\)), (iii) Equity Stability (\(\forall G: p_{t+1}^G = p_t^G, N_{t+1}^G / N_{t+1} = N_t^G / N_t\), and error rates stable \(\forall t\)).

  *   **Month 3: Analyze Trivial/Edge Cases & Formalize Stability**
      *   Identify necessary conditions for stability (iii) under the feedback model. Does stability *require* \(p_t^A = p_t^B\)? If yes, O3 is likely. If stable unequal base rates are possible, proceed.
      *   Formalize "stationary distribution" / "fixed point" mathematically (e.g., a distributional fixed point of the Markov process induced by policy + dynamics).

  *   **Months 4-6: Explore Specific Dynamics & Proof Strategies**
      *   Implement basic simulations (Python) for specific dynamics (e.g., fixed qualification boost) to generate hypotheses.
      *   **Target O1/O3:** Assume a general class of monotonic qualification dynamics. Attempt proof by contradiction: Assume a stable equilibrium exists satisfying (i), (ii), (iii). Derive necessary relationships between base rates, policy thresholds, and dynamics. Show inconsistency unless \(p^A = p^B\).
      *   **Target O2:** Explore specific functional forms for dynamics and policy. Can a policy be *designed* to counteract induced disparities? Look for fixed points algebraically under constrained models.

  *   **Months 7-9: Generalization & Rigorous Proof**
      *   Focus on the most promising path (O1/O3 or O2) from Months 4-6.
      *   **If O1/O3 Path:** Formalize the general proof, precisely specifying the required assumptions on the feedback dynamics. Identify the minimal sufficient conditions for impossibility.
      *   **If O2 Path:** Formalize the constructive proof. Prove convergence to the stable point and verify (i), (ii), (iii) hold there. Analyze robustness/sensitivity.
      *   **Key Challenge:** Handling the interdependence of group thresholds, base rates, and dynamics in equilibrium equations.

  *   **Months 10-12: Write-up & Dissemination**
      *   Finalize proofs/counterexamples.
      *   Prepare conference paper (e.g., FAccT, ICML, Philosophy & AI venues).
      *   Fellowship report.

  **4. Evidence of a Misguided Question:**  
  The question would be deemed "wrong" and require pivoting if, by **Month 6**, one of the following occurs:
      *   Equity Stability (iii) is proven *mathematically equivalent* to the initial base rate equality condition (\(p_0^A = p_0^B\)) under *any* non-trivial feedback model (strongly suggesting O3, making the iteration redundant).
      *   The defined feedback dynamics are shown to be fundamentally incompatible with *any* notion of stable unequal base rates, regardless of fairness constraints (making (iii) vacuous or trivial).
      *   The interaction between (i), (ii), and the dynamics is found to be so model-specific that no generalizable insight emerges, requiring a shift to simulation-based exploration beyond scope.

  **5. Honest Reckoning with Scope:**
  *   **Focus:** Binary classification, two groups, discrete time, one specific (but representative) class of qualification feedback dynamics (e.g., fixed boost). Avoid complex continuous-time, multi-group, or multi-resource models.
  *   **Realism:** The formal dynamics will be a stylized abstraction of real-world feedback. The value is conceptual clarity, not empirical fidelity.
  *   **Output:** One primary result: a theorem establishing O1, O2, or O3 for the defined model class. This is a significant conceptual advance if achieved. A negative result (e.g., O3) is still valuable.
  *   **Feasibility:** The 12-month plan focuses intensely on formalizing and attacking the core question within a tightly scoped model. Simulation months are for intuition, not large-scale experiments. The teaching load is acknowledged; months 4-9 represent core research effort.

  **6. Outcome Value and Hedging:**
  *   **Most Valuable Outcome:** **O2 (Possibility)** would be most impactful for reviewers. Demonstrating a feasible policy achieving all three goals in a dynamic setting directly challenges the perceived universality of impossibility and offers a constructive path forward. It best leverages the unique iterative framing.
  *   **Hedging Strategy:** **Leave the space of outcomes open.** Explicitly state the three possible determinate answers (O1, O2, O3) and frame the research as *discovering* which holds under the defined iterative model. Hedging ("I expect O1") is unnecessary and potentially limiting. Emphasize that *any* of these outcomes constitutes a novel contribution by rigorously addressing the feedback loop ignored in single-shot analyses. The value lies in resolving the open question, regardless of the direction.

  ---
  **Key Strengths for Reviewers:**
  *   **CS Reviewers:** Sees a clear theorem-shaped target, formal framework, defined dynamics, monthly technical plan, and binary resolution (O1/O2/O3).
  *   **Philosophy Reviewers:** Sees engagement with core concepts (fairness, justice over time, feedback loops, stability), clear articulation of the gap in static thinking, and the normative significance of "equity stability" (iii).
  *   **Both:** Appreciates the precise question, manageable scope, defined success/failure criteria, and awareness that the answer itself (whichever it is) advances understanding of fairness dynamics. Avoiding bibliographic fluff keeps focus on the novel contribution.
