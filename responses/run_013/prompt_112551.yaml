  Below is a decision tree structured to classify positions on the sorites paradox using only the specified cases and plain-language questions. It has **8 branching nodes** and **9 leaves** (covering 6 core positions and 3 diagnostic outcomes). Each leaf includes the position's name (or diagnosis), its central commitment, and its "cost" (the hardest concession for defenders). The tree is ordered to ensure questions are answerable independently, without jargon, and isolates key divides in the logical space.  

  ### Decision Tree  
  Start at the top. Answer each question based on intuitive judgments about the cases.  

  1. **Heap case:** When removing grains one by one from a heap, is there a *specific grain* whose removal turns it from a heap to a non-heap?  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Hair-loss case:** For a man balding gradually, can we *know* exactly which hair loss makes him no longer "hairy"?  
     - **Yes** → **Unattractive**  
       - *Commitment:* Sharp boundaries exist and are knowable.  
       - *Cost:* Ignores why the sorites paradox feels puzzling; makes vagueness trivial.  
     - **No** → **Epistemicism**  
       - *Commitment:* Borderline statements have a precise truth value, but humans cannot know it.  
       - *Cost:* Accepts unknowable facts (e.g., "There is a truth about *which* grain ends the heap, but we’re permanently ignorant").  

  3. **Color-patch case:** For a patch on the red-orange border, is "This is red" either true or false?  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **Dusk/night case:** Can "It is dusk" be *both true and false* at the same moment for the same observer?  
     - **Yes** → **Dialetheism**  
       - *Commitment:* Borderline statements are both true and false (e.g., dusk is both night and not-night).  
       - *Cost:* Rejects non-contradiction; requires new logic to avoid "everything follows" from contradictions.  
     - **No** → **Incoherent**  
       - *Diagnosis:* Claims bivalence (every statement is true or false) but denies sharp boundaries.  
       - *Cost:* Cannot explain why no grain "matters" in the heap case if truth values are precise.  

  5. **Color-patch case (revisited):** Is "This is red" *partially true* (e.g., 70% true, 30% false)?  
     - **Yes** → **Degree Theory**  
       - *Commitment:* Truth comes in degrees between 0 (false) and 1 (true).  
       - *Cost:* Forces arbitrary precision (e.g., "How many hairs make someone 0.63 hairy?").  
     - **No** → Go to 6.  

  6. **Age-threshold case:** For a law defining "child" as under age 18, is the indeterminacy because "child" has *multiple equally valid meanings* (e.g., under 17.5, under 18, under 18.5)?  
     - **Yes** → Go to 7.  
     - **No** → Go to 8.  

  7. **Theory-stating requirement:** To explain this, must we use a language with *no vagueness at all*?  
     - **Yes** → **Supervaluationism**  
       - *Commitment:* Truth requires truth on *all* admissible precisifications (e.g., "child" is only truly "child" if it holds for every sharp cutoff like 17.5, 18, etc.).  
       - *Cost:* Needs a sharp metalanguage; struggles with "vague vagueness" (e.g., borderline cases of "admissible precisification").  
     - **No** → **Unexplored**  
       - *Diagnosis:* Allows vague metalanguages but lacks a clear semantics.  
       - *Cost:* Circularity risks (e.g., "How do we define 'admissible' without vagueness?").  

  8. **Dusk/night case (revisited):** Does "It is night" depend on *context* (e.g., cultural norms, lighting standards, or the speaker’s purpose)?  
     - **Yes** → **Contextualism**  
       - *Commitment:* Predicate extensions shift with context/standards (e.g., "night" starts earlier for astronomers than poets).  
       - *Cost:* Boundaries feel objective; contextual shifts can seem arbitrary or ungrounded.  
     - **No** → **Non-Linguistic Vagueness**  
       - *Commitment:* Indeterminacy is in the world, not language/mind (e.g., dusk-to-night is objectively unsettled).  
       - *Cost:* Accepts metaphysical indeterminacy (reality itself is fuzzy).  

  ### Key Notes  
  - **Positions covered:** Epistemicism, supervaluationism, dialetheism, degree theory, contextualism, non-linguistic vagueness.  
  - **Diagnostic leaves:** Unattractive (for knowable boundaries), Incoherent (for bivalence without boundaries), Unexplored (for supervaluationism without sharp metalanguages).  
  - **Indistinguishable positions:** This tree **cannot separate** supervaluationism from some contextualist or epistemicist views on cases like the color patch or heap. To split them, add a case about *penumbral connections* (e.g., "If a patch is not red, is it automatically orange?").  
  - **Branch node doing the most work: Q1 (Heap case)**. It separates bivalent (sharp-boundary) from non-bivalent views, which is the deepest divide in the field.  

