prompt: |-
  My friend is putting together a little zine of philosophical short fiction and guilt-tripped me into contributing, so I've been reading about Ian Hacking's stuff on psychiatric classification — the looping effect, "interactive kinds," how classifying people can change the people being classified, which then changes the classification, round and round. It's kind of fried my brain and I want to write a story that makes someone *feel* that instead of just having a character explain it at a dinner party (please, no lecture-in-dialogue, no wise mentor figure spelling out the theme).

  So here's my seed, use it or bend it: a near-future town, not too flashy, where a new diagnosis has just entered the manual — call it something plausible and a little seductive, like "Cyclical Cognitive Overload" or whatever you think works better. My protagonist is among the first wave of people to recieve it. I want the story to move through three phases: her getting the label and the strange relief of it, her finding the online community of others with the same label and how they collectively talk about what it "really" is, and then a later moment where the diagnostic criteria themselves have shifted — partly because of how all these people started describing themselves — so that the thing she was diagnosed with isn't quite the thing anymore. The trick I'm after: one scene where you can see the label change *her* in a way that plainly wouldn't have happened otherwise, and one scene where her behavior, or the community's, visibly bends the category back. Don't resolve it neatly; I'd rather it end unsettled. Also — and this is the part I care about most — make it clear she isn't just a passive victim of the label; there's something real going on with her, the category isn't pure fiction, and that's what makes the loop so creepy. Third person, maybe 1200 words or so. If you need to invent clinical-sounding details, go ahead, just keep them believable and don't have anyone quote any actual researchers.
reasoning: |-
  Okay, the user wants a short story exploring Ian Hacking's looping effect through a near-future diagnosis scenario. They've provided clear parameters: a protagonist experiencing the three-phase cycle of diagnosis (relief, community formation, category shift), with emphasis on both the protagonist's agency and the "something real" underlying the label. 

  Hmm, what's interesting here is the tension they want - the diagnosis isn't fictional, yet it transforms through collective interaction. The challenge is showing the loop without didacticism. I should avoid:
  - Exposition disguised as dialogue
  - Oversimplifying the medical reality
  - Making the protagonist purely passive

  The seed suggests "Cyclical Cognitive Overload" but I'll refine it to "Cyclic Neural Fatigue" - more clinical yet poetic. The setting should feel mundane-futuristic: think automated homes but with the same human struggles. 

  For the three phases:
  Phase 1 (Diagnosis): Focus on somatic sensations - the physical relief of validation. Need to establish her pre-diagnosis suffering as tangible. Maybe sensory hypersensitivity? 

  Phase 2 (Community): Key to show language evolution. The online forum should develop its own lexicon ("glitches" instead of symptoms). Crucially, she must contribute to this reshaping. 

  Phase 3 (Category Shift): The creepiest part. When she receives updated criteria, it should feel alien yet familiar - the community's coping mechanisms have been medicalized. 

  The "visible change" moments:
  - Her adopting forum-speak during a sensory episode (label changing her)
  - The forum's "data dumps" ritual influencing research (community bending category)

  Ending must stay unsettled. Maybe her realizing she's simultaneously understanding herself better and being rewritten? The horror isn't the diagnosis but the collective echo chamber it creates. 

  Clinical details: Borrow from burnout/autism research but fictionalize. "Neural fatigue" could manifest as time-blindness, sensory gridlock. Treatment: blue light filters, dopamine regulators - plausible near-future tech. 

  Biggest risk is making the looping effect too explicit. Must trust subtext: her relieved sigh at diagnosis contains the first twist of the loop.
answer: |-
  ## The Comfortable Cage

  The diagnosis landed with a soft *thud* on Dr. Aris Thorne’s tablet. "Cyclic Neural Fatigue," he said, the words smooth and clinical. "CNF. It fits, Lena. The pattern – the cognitive gridlock preceding the sensory overload, the subsequent crash, the period of recovery before it builds again. Like your nervous system’s battery is wired wrong."

  Lena Kovac stared at the sleek device. *Cyclic Neural Fatigue.* It sounded less like a failing and more like… an explanation. For years, it had been a nameless storm inside her skull: days where thoughts jammed like tangled wires, sounds scraped raw against her eardrums, and light felt like needles. Then the collapse, the days spent in dim silence, recovering only for the pressure to build again. Doctors offered anxiety, depression, migraines – labels that never quite stuck, treatments that never quite worked. Now, CNF. It wasn't a cure, Thorne assured her, but a framework. "Recognition is the first step towards management," he’d said, prescribing modulated light filters for her screens and a trial of neuro-calibrating earbuds.

  The relief was physical. Lena walked out of the clinic feeling lighter, the invisible weight of being inexplicably *broken* finally named and shelved. She wasn’t lazy or weak-willed; she had CNF. It was a thing *out there*, in the world, in the latest Diagnostic Compendium. She belonged somewhere.

  ***

  The online space was called "The Cycle Hub." Finding it felt like discovering a secret society speaking her fractured language. Thousands shared her label, her rhythms. Posts pulsed with shared experience: *"Hitting the neural wall HARD today. Anyone else feel like their thoughts are buffering?"* *"Deep in the trough. The fridge humming is an assault weapon."* *"Managed a whole grocery run during a low-intensity phase! Small wins!"*

  Lena devoured it. She learned their vernacular: "Glitching" for the cognitive stumbles, "Sensory Static" for the overload, "Recharge Mode" for the necessary collapse. They swapped strategies – noise-dampening hoodies, specialized nutritional stacks, apps that predicted personal "pressure build" based on biometrics. Lena found herself describing her own "glitches" with the Hub’s language. The shared lexicon wasn’t just descriptive; it was *constitutive*. It shaped how she perceived her own internal states.

  One evening, mid-conversation with a friend, Lena felt the familiar pressure building behind her eyes. The streetlights outside seemed suddenly harsh, strobing. Her friend’s voice became a distorted buzz. Pre-diagnosis, she might have pushed through, gritting her teeth, blaming herself for being "too sensitive," leading inevitably to a worse crash. Now, the label and its community provided a script.

  "I’m hitting a CNF spike," Lena said, the term rolling off her tongue with practiced ease. "Sensory static dialing up. Need to tap out before I glitch completely." She excused herself, slipped on her neuro-calibrating earbuds, and retreated to her dimmed room. The act felt intentional, validated. *This is what CNF looks like,* she thought, *this is how I manage it.* The label hadn’t just explained her; it had given her permission and a protocol to *be* this way. She wouldn't have articulated it so cleanly, acted so decisively, without the framework. The label changed the dance.

  ***

  Eighteen months later, the updated Diagnostic Compendium notification pinged on Lena’s device. Out of curiosity, she pulled up the CNF entry. The core triad was still there – Cognitive Disruption, Sensory Hyper-Acuity, Cyclic Collapse – but the details had… shifted.

  The language was sharper, more behavioral. "Cognitive Disruption" now heavily emphasized "task abandonment during perceived cognitive load" and "expressed helplessness regarding routine planning." Examples included leaving shopping carts half-full or failing to initiate scheduled calls. "Sensory Hyper-Acuity" specifically cited "avoidance of communal environments citing non-specific sensory distress" and "over-reliance on personalized sensory dampening technology." Lena frowned. These weren't just descriptions of symptoms; they felt like descriptions of *choices* – choices heavily influenced by the Cycle Hub’s coping strategies, choices *she* made every day.

  Worse, the "Management Approaches" section now flagged certain Hub-endorsed behaviors as "potentially maladaptive coping mechanisms reinforcing symptom identity." Her beloved noise-cancelling sanctuary? Potentially "isolation-promoting." Her meticulous planning to avoid peak-hour crowds? "Risk of agoraphobic patterning."

  A cold unease seeped into her. She scrolled to the Cycle Hub, now a bustling metropolis compared to the small town she’d joined. A new thread was exploding: **"New DC Update - They're Pathologizing Our Survival!"**

  Comments raged:
  *"So now using my dampeners is 'maladaptive'? Should I just let my brain melt in the supermarket?"*
  *"They took OUR language, the stuff WE coined to describe what happens, and turned it against us!"*
  *"Notice how 'perceived cognitive load'? Like it's all in our heads? We need to push back!"*

  A coordinated action emerged: #RealCNFData. Hub members were urged to meticulously document their "glitches" and "static spikes" with biometric logs, mood trackers, even situational recordings – not just self-reports. They planned to flood research portals and clinician forums, proving the *objective reality* of their distress, reclaiming the narrative from the updated criteria that seemed to blame them for adapting.

  Lena watched the digital fervor. This was the loop snapping back. The medical category had changed *them* – given them language, identity, coping mechanisms. Now, *they* were changing the category back, weaponizing data to redefine what CNF "really" was. Her own biometric logs were part of the planned deluge.

  She thought about her last "spike." Had she leaned into the retreat *because* it was the CNF script? Absolutely. But the pressure behind her eyes, the way light had physically hurt? That was as real as the screen she stared at now. The label hadn't invented the storm; it had just given it a name, drawn a map that everyone – her, the community, the doctors updating the manual – was now redrawing in real-time.

  Lena opened her data tracker. The familiar graphs of her neural rhythms pulsed. She hesitated, her finger hovering over the "Contribute to #RealCNFData" button. The original relief felt like a distant coastline. Now, she was adrift in the loop, the comforting cage of the label morphing around her, shaped by her own hands and the thousands like her. Was she proving her reality, or just feeding the machine that would inevitably redefine it again? The storm inside her skull hadn't changed. But everything else – the name, the meaning, the rules for existing within it – was shifting sand. She took a breath that felt like static, and clicked. The loop tightened. The story wasn't over; it was just cycling again.
