prompt: |-
  I'm defending a paper at our philosophy of mind work-in-progress next week and I need my Q&A prep sheet. My thesis: the original/derived intentionality distinction isn't a fact about systems, it's a fact about how we describe them -- everything we call "original" intentionality is just derived intentionality whose derivation we've stopped asking about. My key move is a case I invented: a creature whose internal state covaries equally with predator, rockfall, and loud noise (it fires for all three and can't tell them apart), so there's no privileged answer to what it "represents" -- only a grain of description that happens to be useful to us. I claim the human case is the same, just with more joints. The room: two Searlean biological naturalists (intrinsic intentionality is a biological fact like digestion, you can't get it out of silicon), one Dennettian who thinks I'm being too timid, and two computational cognitive scientists who think the whole original/derived framing is a category error and want to talk about representational content as a modeling choice.

  Give me a table with these columns, ordered by likelihood times damage: objection (in the exact words that person would actually use), who raises it, likelihood (high/med/low), damage to my thesis (1-5), my two-minute reply, where that reply is soft. Then, underneath the table, a short note on which objection I should just concede up front instead of fighting, and seperately the one question I'm praying nobody asks.
