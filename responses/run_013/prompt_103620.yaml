answer: |-
  Here's your Q&A prep sheet, structured by threat level (likelihood × damage) with tactical replies and vulnerability flags. The ordering reflects both probability of being asked and potential disruption to your thesis defense.

  ### Q&A Prep Table
  | Objection (Verbatim Style)                          | Who                  | Likelihood | Damage | My 2-Minute Reply                                                                                                                                | Where Reply is Soft                                                                 |
  |-----------------------------------------------------|----------------------|------------|--------|-------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **"Covariance isn't intentionality! Your creature's state is just *caused*, not *about* anything. Real intentionality (like pain) has intrinsic *aspectual shape*—it presents its object *under a description*—which your covariance story utterly misses."** | Searlean #1          | High       | 5      | "I agree covariance alone isn't sufficient for full-blown intentionality. My point is it's *necessary* and *where the natural grounding stops*. When we say the state is 'about' predators, we're imposing that aspectual shape based on *our* explanatory interests and the creature's survival needs. The 'under a description' isn't in the system; it's in our gloss. Human intentional reports ("I'm thinking about my lunch") are similarly *reports* shaped by language and context, not transparent windows onto atomic mental content." | Soft on explaining *how* aspectual shape *arises* without smuggling in privileged description.               |
  | **"Why waste energy fighting the original/derived *framing*? We gave up on that years ago. 'Representation' is a tool for modeling cognitive systems—period. If your point is that all attributions are observer-relative, *we agree*, so why frame it as a critique of an outdated distinction?"** | Comp. Cog. Sci #1   | High       | 3      | "I'm glad we agree on the observer-relativity! My target is the lingering intuition—especially in philosophy and some corners of cog sci—that *biological* systems have a 'magic dust' of original intentionality. By showing the creature case parallels human cases (scaled up), I argue this intuition rests on stopping the 'why?' chain arbitrarily. Engaging the distinction directly is vital to dissolve that persistent myth and refocus debates (e.g., on consciousness or AI ethics) away from bogus metaphysical binaries." | Soft: Concedes the distinction *is* outdated for many cog sci practitioners. Framing may feel like tilting at windmills. |
  | **"You're halfway to my view but won't jump! If all intentionality is derivative/stance-relative, why cling to 'derivation'? Just say the *very notion* of intrinsic 'aboutness' is a bad myth. Stop saying 'derived intentionality'—say '*intentional stance* attribution' and be done with it!"** | Dennettian          | Med        | 4      | "You're right this is deeply Dennettian! My modest departure is tactical: using 'derived' keeps me engaged with Searleans *on their terms*. Saying "It's ALL derived, you just stopped tracing the derivation" directly confronts their biological primitive claim. 'Derived' also helps highlight the *historical/contingent processes* (evolution, learning, culture) that shape the systems we describe. But absolutely, in spirit, I’m waving your flag." | Soft: Risk of seeming inconsistent ("Is it ALL derived or is the term itself misleading?").                  |
  | **"Consciousness changes *everything*. When *I* experience pain, its 'aboutness' (its aversiveness *as such*) is *intrinsically given*, not derived or attributed. Your creature lacks consciousness; humans don't. You ignore the first-person datum that anchors *real* intentionality."** | Searlean #2          | Med        | 5      | "I don't ignore consciousness—I bracket it to isolate the *content* question. Even in conscious states, *what* the pain is 'about' (tissue damage? threat? pure qualia?) is underdetermined by biology alone. Is the creature's state conscious? Maybe! But even if it is, we *still* face the same underdetermination: does it *feel* like 'predator!' or 'danger!' or '*that* loud thing'? The first-person givenness doesn't specify the *content grain*. Phenomenology isn't a content-fixing mechanism." | **Softest Spot:** Hard to refute the *seeming* intrinsicness of conscious intentionality without sounding dismissive of phenomenology. |
  | **"Your 'grain problem' is trivial. Of *course* coarse-grained states exist. But complex systems evolve hierarchical representations with *functional* disambiguation. Human perception *does* distinguish rocks from predators! Your creature just has a bad detector."** | Comp. Cog. Sci #2   | Low        | 2      | "Absolutely! Humans have richer systems. But my point isn't that all states are ambiguous—it's that *when* we attribute content, even in humans, we choose a grain/category based on utility. When a human jumps at a loud noise, is the state 'about' acoustic volume, sudden threats, or the bear? All correlate! We pick 'bear' because it's useful. The 'functional disambiguation' itself relies on attributing teleology ('*for* survival'), which is observer-relative. Richness doesn't escape the frame-dependence." | Soft: Overstates universality. Cog sci *can* often define content via specific functional/causal roles in a model. |

  ---

  ### Strategic Concessions & Dreaded Question
  1.  **Concede This Up Front:** The **Dennettian's "Why not go full eliminativist?"** objection.  
      *   **Why Concede?** It’s a friendly push. Agreeing aligns you with a powerful ally without harming your core thesis. Fighting it wastes time and makes you seem defensive.  
      *   **Tactical Concession:** *"You're right, Dan, that a fully Stance-only view dissolves the problem more cleanly. I'm using the 'derived' language strategically to engage the Searleans directly and show that even on their *own* terms (where 'derived' has meaning), the distinction collapses under scrutiny. But yes, in the cleanest ontology, I’d drop the baggage."*

  2.  **The Question You Pray Nobody Asks:**  
      **"If intentionality is always observer-relative description, how do you account for the *normativity* of intentional states? My belief that 'water is H₂O' isn't just *described* as correct/incorrect; it *is* correct or incorrect *regardless of any observer*. Doesn't this require intrinsic, non-derived content to ground semantic norms?"**  
      *   **Why It's Dreaded:** This strikes at the deepest challenge for anti-realist/pragmatist views of content. It forces you to either (a) bite a very big bullet (denying robust normativity), (b) smuggle in intrinsic norms (contradicting your thesis), or (c) dive into complex, time-sucking debates about naturalizing norms (e.g., Millikan, Brandom) which are hard to summarize in 2 minutes and distract from your core case. The Searleans will pounce on any perceived weakness here as proof biology *must* ground norms.

  **Good luck!** Focus on your core move: the underdetermination in the creature case directly parallels human cases. Frame the Searlean responses as *proving* your point – they are revealing *their* pragmatically chosen "stopping point" for derivation (biology), not a fact of nature. Leverage the Cog Sci agreement to show your view is productive, not just critical.
