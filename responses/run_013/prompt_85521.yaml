prompt: |-
  I'm a second-year PhD student in philosophy (collective action, mostly), and I've been doing a summer placement at a foundation that funds AI governance and biosecurity stuff. The program officers here have all picked up the Moloch / multipolar trap vocabulary, and I keep watching them use it wrong. You know the idea: lots of independent actors, each doing the locally sensible thing, none able to unilaterally stop, so everyone ends up in a race to the bottom nobody wants — arms races, overfishing, that whole family of cases. But half the time what they're pointing at isn't a trap at all (it's just competition, and there's a winner), or the real problem is that one actor could fix it alone and doesn't want to, or "it's a multipolar trap" is doing rhetorical work — someone wants everybody to agree not to compete, and that someone is the incumbent. And even when it is a trap, they then fund whatever intervention comes with the word "coordination" in it.

  Can you write me a screening procedure they can actually run on an incoming proposal? This is a quarterly cycle, 15-20 proposals, anywhere from $50k to $2M, and they get about 20 minutes each at a screening meeting before it goes to the investment committee. They're smart people but no formal game theory, so it has to work without jargon.

  What I want: a short ordered set of questions — six to eight, no more — with what counts as a sufficient answer to each, where the procedure stops and says "this isn't a trap, don't fund it under this heading," and where it hands the decision to a human because the question is evaluative rather than factual. Two things I care about most. First, the diagnosis has to determine the remedy class: changing the payoffs (liability, taxes, monitoring), changing the number of players, changing the horizon so defection gets punished, changing verifiability, or just moral suasion — which I suspect the procedure should be allowed to call usually weak, and I want a rule that says you can't fund a remedy that doesn't match the diagnosis. Second, an adversarial step for the cartel problem, since a coordination proposal from a well-positioned actor can be a request to stop competing, and the officers will not spot that on their own.

  Then run it on three proposals: (1) a pledge campaign getting the major labs to commit to not doing certain capability-increasing work; (2) a proposal to fund a compact on biosafety standards that the labs would self-police; (3) a proposal premised on the idea that compute providers racing to cut prices is itself a trap worth intervening on. At least one of these should come out against what I'd naively want, and tell me plainly which one that is.

  Keep it to a page, mark the steps that are judgment calls dressed up as procedure, and end with what this screen can't do — in particular where the "bottom" being bad is a value question the procedure can't seperate from the facts.
reasoning: |-
  Hmm, the user is a second-year PhD student in philosophy focusing on collective action, working at a foundation that funds AI governance and biosecurity. They're frustrated because their colleagues misuse the "Moloch/multipolar trap" concept - applying it to situations that aren't actually traps, or using it rhetorically to push certain agendas. They want me to create a practical screening tool for funding proposals that can quickly identify whether something is genuinely a multipolar trap and whether the proposed intervention matches the diagnosis.

  The user wants a concise screening procedure with 6-8 questions that foundation staff can apply in about 20 minutes per proposal. Key requirements include: determining remedy based on diagnosis, flagging potential cartel-like behavior, and rejecting mismatched interventions. They also want me to test this on three specific proposals and identify which one shouldn't be funded.

  First, I need to clarify what constitutes a genuine multipolar trap. It's when multiple independent actors face incentives that lead to collectively worse outcomes, with no unilateral exit option. Common pitfalls include mislabeling simple competition as a trap, or situations where one powerful actor could solve the problem but chooses not to.

  For the screening questions, I'll structure them to progressively filter out non-trap cases. The sequence should start with verifying the "trap" structure before assessing solutions. Key diagnostic elements: multiple independent actors, conflict between individual and collective rationality, lack of unilateral exit, and undesirable equilibrium.

  For the adversarial cartel check, I need a question that exposes when "coordination" might actually be anti-competitive behavior favoring incumbents. The question should focus on who benefits from the proposed coordination and whether it creates artificial barriers.

  On remedy matching: I'll create a clear mapping between trap characteristics and solution types. For example, inability to verify compliance requires verification mechanisms, not just pledges. The procedure should flag mismatches like moral suasion for traps with strong short-term incentives.

  Testing the three proposals:
  - The AI labs pledge campaign (1) fails the unilateral exit test - any lab could defect while others comply.
  - The biosafety compact (2) might work if it includes verification, but could be problematic if it blocks new entrants.
  - The compute price war (3) seems like normal competition, not a trap - consumers benefit from lower prices.

  The compute proposal (3) should be rejected under this framework, as it's healthy competition, not a trap. This might be counterintuitive since the foundation might instinctively want to "fix" it.

  Important limitations to note: The screen can't judge whether the "bottom" is truly undesirable (that's values-based), can't quantify probabilities, and can't assess feasibility beyond basic mismatch. It also can't handle complex multi-trap systems well.

  I'll keep the language accessible - no game theory jargon. The whole thing should fit on one page with clear decision points. For the judgment call steps (like assessing harm), I'll mark them explicitly as such.
answer: |-
  Here's a concise screening procedure (fits on one page) for identifying genuine multipolar traps and matching interventions:

  **Multipolar Trap Screening Protocol (v1.0)**

  1.  **Are there ≥3 independent actors where no single one dominates outcomes?**  
      *Sufficient:* Yes, with clear examples. *Stop if:* One actor controls >50% of relevant capacity/market OR outcome depends mainly on 1-2 actors. *(Judgment: Assess dominance)*

  2.  **Is the "bad outcome" an equilibrium (stable state) forced by incentives, not just temporary?**  
      *Sufficient:* Yes, actors actively maintain it despite disliking it. *Stop if:* It's a transition phase OR the "bad" state clearly benefits some actors disproportionately.

  3.  **Could a single actor, acting alone, permanently escape the bad outcome without making it worse for themselves?**  
      *Sufficient:* **No.** Unilateral exit is impossible or self-punishing. *Stop if:* Yes (e.g., a dominant lab *could* slow down safely but chooses not to). **THIS IS THE CORE TRAP FILTER.**

  4.  **Is individual short-term rationality pushing actors toward actions that collectively worsen their *own* long-term outcomes?**  
      *Sufficient:* Yes, documented incentive clash. *Stop if:* Harm is mainly external (e.g., to public) OR actors simply value short-term gains over long-term harms.

  5.  **ADVERSARIAL CHECK: Who proposed this "coordination"? Would it entrench incumbents or raise barriers to entry?**  
      *(Judgment Call:)* Flag if proposer is dominant player OR solution disproportionately burdens new entrants. **Doesn't auto-stop, but REQUIRES explicit justification if flagged.**

  6.  **Does the proposed remedy DIRECTLY alter the trap's key incentive? (Match remedy to diagnosis):**
      *   *Verifiability problem?* → Needs monitoring/enforcement.
      *   *Short time horizons?* → Needs long-term contracts/punishments.
      *   *Payoffs reward defection?* → Needs taxes/subsidies/liability.
      *   *Too many players?* → Needs consolidation or focal points.
      *   *Moral Suasion?* → **Only fund if:** Incentives to defect are *very weak* AND actors have strong shared identity. **Flag as "High Risk" otherwise.**

  7.  **Is the remedy technically/politically feasible *enough* to test?**  
      *(Judgment Call:)* Low feasibility doesn't auto-stop but must be acknowledged.

  **What this screen CAN'T do:**
  *   Judge if the "bottom" is truly bad (that's values-based).
  *   Handle complex systems with multiple overlapping traps.
  *   Assess the probability of success.
  *   Replace deep domain expertise on the specific problem.

  ---

  **Screening the Proposals:**

  1.  **AI Labs Pledge (No Capability Increases):**
      *   Q1: Yes (Multiple labs).
      *   Q2: Maybe (Temporary equilibrium?).
      *   **Q3: NO.** Any *single* lab could defect (launch capability) while others comply, gaining massive advantage. **→ STOP. NOT A TRAP.** Funding this as "trap coordination" is invalid. (It's moral suasion/trust-building, which Q6 flags as high-risk here).

  2.  **Biosafety Standards Compact (Self-Policed):**
      *   Q1: Yes.
      *   Q2: Yes (Labs might prefer safety but fear being undercut).
      *   Q3: **No.** A single lab defecting (cutting safety costs) could gain advantage if undetected. **→ TRAP CONFIRMED.**
      *   Q4: Yes (Individual incentive to cheat vs. collective safety need).
      *   Q5: **Flagged.** Incumbent labs proposing self-policing? Needs scrutiny for barriers to entry.
      *   Q6: **MISMATCH.** Trap needs verifiability/enforcement. "Self-policing" lacks this. **→ REJECT under trap heading.** (Fund only if adds strong 3rd-party verification).

  3.  **Compute Provider Price War Intervention:**
      *   Q1: Yes (Many providers).
      *   Q2: Maybe (Low margins are stable).
      *   **Q3: YES!** A single provider raising prices alone would lose customers. **→ TRAP CONFIRMED?**
      *   Q4: **NO.** The "bad" outcome (low profits) is directly caused by individual rationality (compete for market share). But is this *collectively worse* for the providers? **Crucially:** Low prices are **good for consumers/AI developers** (the intended beneficiaries!). Providers *want* higher profits collectively, but achieving that via coordination harms others. **→ STOP. Harm is external; trap logic doesn't apply.** (This is standard competition; intervention likely creates a harmful cartel per Q5).

  **Result:** The procedure rejects the **Compute Price War (#3)** intervention *against* the naive desire to "fix" the race. It correctly identifies this as beneficial competition misdiagnosed as a trap. It also rejects the Pledge (#1) as not a trap and flags the Biosafety Compact (#2) unless significantly strengthened. The "adversarial" Q5 forces scrutiny on who benefits from stopping the "race".
