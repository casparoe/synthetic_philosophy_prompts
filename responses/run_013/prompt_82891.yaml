prompt: |-
  You're a philosopher working on moral psychology and the virtue-ethics/situationism debate; think carefully before you answer, and begin by setting out for yourself what the situationist experiments do and do not establish. I design character-education curricula for undergraduates, and I'm at an impasse. The obedience experiments, the seminary study of helping under time pressure, and the honesty and bystander studies all seem to show that character traits don't exist and that what people do is a function of the situation they're in. If that is settled, then trying to build virtues in students is building on sand, and the rational move is what I have been calling "outside-in": stop trying to change the person and instead engineer the situations students will occupy. I have also been toying with a dodge — redefining a virtue as a reliable sensitivity to the morally relevant features of a situation rather than a disposition to behave in a certain way — which I take to sidestep the critique entirely. So: which virtues, if any, survive the situationist critique well enough to be taught directly, which should be replaced by situation design, and does the sensitivity redefinition actually get me off the hook? Tell me how confident you are in each claim and name the single point you are least sure of, and end with one line of the form \answer{...} giving a short label for what you would have me do.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosopher designing character-education curricula for undergraduates, stuck because situationist experiments seem to undermine the existence of stable character traits. They mention experiments like Milgram's obedience study, the seminary Good Samaritan study, and others that show situational factors heavily influence behavior. Their dilemma is whether to shift focus from building virtues to engineering situations, or redefine virtues as sensitivities to contexts. They want to know which virtues can survive the critique, which should be addressed via situation design, and if the redefinition works.

  First, I need to recall what situationist experiments actually demonstrate. Milgram showed people obeying authority even when harming others. The seminary study revealed that time pressure affected helping behavior more than inherent kindness. Honesty studies vary based on surveillance. These highlight that situations can override dispositions. But do they prove traits don't exist? The user thinks so, but I should clarify. Situationists argue against global, consistent traits but not necessarily local ones. People might be honest in specific contexts, not universally. So the experiments challenge the Aristotelian idea of robust virtues, but not traits entirely.

  Next, the user's impasse: if traits are unstable, building virtues is futile. They propose two solutions—engineering situations or redefining virtues as sensitivities. I need to assess both. For situation design, it's practical. If students are in environments promoting honesty, they'll act honestly. That's solid, but maybe doesn't instill internal virtues. The sensitivity redefinition sounds like a Neo-Aristotelian approach, where virtues are about perception and response. But does that bypass the critique? It might, but only if we accept that virtues are context-sensitive and require practical wisdom to navigate situations. However, empirical evidence on perceptual consistency is still needed. 

  Now, which virtues survive best? Intellectual virtues like curiosity or open-mindedness might hold up because they're less dependent on immediate situations. They involve reflection and can be cultivated through teaching. Moral virtues like courage or honesty might be more context-bound. Courage could vary—physical vs. moral courage in different scenarios. Honesty might depend on surveillance. So perhaps intellectual virtues are more teachable directly, while moral virtues need situational supports.

  The user's hidden needs: They want to validate their curriculum efforts without abandoning virtue ethics. They might fear their work is ineffective, so they need strategies that are empirically sound yet philosophically robust. They also need practical solutions—what to implement in their courses. Their redefinition idea is a theoretical workaround, but they need to know if it holds water.

  Confidence levels: I'm confident that situation design is effective based on evidence. Redefining virtues as sensitivities is plausible but requires more empirical backing. The weakest point is whether these sensitivities are stable across contexts. Without that, the redefinition might not fully solve the problem. 

  So, recommending a hybrid approach: teach intellectual virtues directly, use situation design for moral virtues, and employ the sensitivity model cautiously. The answer should be "Hybrid Cultivation" to reflect combining methods.
answer: |-
  Based on the situationist experiments and their philosophical implications, here's a structured analysis for your curriculum design:

  **What Situationist Experiments Do & Do Not Establish:**
  - **Do:** They robustly demonstrate that *global*, *cross-situationally consistent*, *behaviorally monolithic* character traits (as sometimes conceived in naïve virtue ethics) are empirically rare. Behavior is profoundly influenced by seemingly trivial situational factors (authority, time pressure, anonymity, bystanders).
  - **Do Not:** They do *not* prove traits are nonexistent. They show traits are:
    - **Local:** Manifesting reliably only in specific contexts/situations (e.g., "office-honest" but not "tax-honest").
    - **Fragmented:** Not unified into a single global virtue (e.g., "courage" may not generalize across physical/social/moral domains).
    - **Probabilistic:** Increasing the *likelihood* of certain behaviors, not guaranteeing them universally.
  - They also do *not* invalidate the existence of *cognitive-affective* dispositions (sensitivities, schemas, values) that interact dynamically with situations.

  **Analysis of Your Proposals & Virtue Survival:**
  1.  **"Outside-In" (Situation Design):**
      *   **Strength:** Highly effective and empirically justified. Designing environments (e.g., honor codes with clear reporting mechanisms, structured time for reflection/helping, reducing anonymity) directly counters problematic situational pressures exposed by the experiments.
      *   **Limitation:** Doesn't cultivate *internal* resources for navigating *novel* or *poorly designed* situations. Reliance solely on engineering risks fragility if situational controls lapse.
      *   **Confidence:** **High Confidence.** This is a rational, evidence-based response to the critique for preventing harmful behaviors and promoting prosocial ones in predictable contexts.

  2.  **Sensitivity Redefinition ("A reliable sensitivity to morally relevant features"):**
      *   **Strength:** This aligns best with a philosophically defensible (Neo-Aristotelian) and psychologically plausible (cognitive-affective processing systems) view of virtue. It sidesteps the demand for *behavioral* consistency across dissimilar situations by focusing on *perceptual* and *motivational* consistency. Virtue becomes skilled perception and appropriate responsiveness *within* contexts.
      *   **Weakness:** Doesn't fully escape the critique. Situationism suggests these "sensitivities" themselves might be highly context-dependent and fragmented ("sensitivity to suffering when not hurried"). The key question is the *reliability and transfer* of this sensitivity across diverse morally relevant situations.
      *   **Does it get you off the hook?** **Partially, but not entirely.** It reframes the target of character education more plausibly (cultivating perception/reasoning over rigid behavior), but the empirical challenge remains: Can we reliably cultivate broad *sensitivities* that function robustly across the varying situations students encounter? Evidence for this is less developed.
      *   **Confidence:** **Moderately High Confidence** in its philosophical coherence and as the *best* target for direct cultivation. **Lower Confidence** in the empirical evidence for *broadly transferable* sensitivity training (this is the core challenge).

  3.  **Which Virtues Survive for Direct Teaching?**
      *   **Best Survivors (Focus on Perception/Judgment):**
          *   **Intellectual Virtues:** Curiosity, Open-mindedness, Intellectual Humility, Love of Truth. These target cognitive processing and are less directly challenged by the *behavioral* focus of classic situationist studies. Cultivated through critical thinking, epistemology, and dialogue.
          *   **Meta-Virtues:** Practical Wisdom (Phronesis). The skill of *discernment* – perceiving salient features, deliberating, judging. This *is* the "sensitivity" and is essential for navigating situational complexity. Taught via case studies, role-playing, and reflective practice analyzing situational influences.
      *   **Poorer Survivors (Require Heavy Situation Support):**
          *   **Behavioral-Demand Virtues:** Honesty (under low surveillance), Courage (in ambiguous social pressure), Spontaneous Helping (under time pressure). Direct attempts to instill *cross-situational behavioral consistency* in these face the strongest empirical headwinds. Rely more on situation design and cultivating the underlying *sensitivity* (e.g., sensitivity to deception's harm, sensitivity to injustice requiring courage) *alongside* environmental supports.
          *   **"Monolithic" Virtues:** Temperance, Chastity (if conceived rigidly). Situational triggers and cognitive processes underlying self-control are complex and context-bound.

  **Least Sure Point:**
  I am least sure about the **degree to which cultivated "sensitivities" (perceptions, values, cognitive-affective schemas) can reliably translate into *appropriate behavioral responses* across a *wide range* of novel or high-pressure situations, especially those not explicitly engineered.** While plausible theoretically (via phronesis), robust empirical evidence demonstrating this broad transfer from education/training programs is still developing and faces inherent challenges in measurement.

  **Recommendation for Curriculum Design:**

  Pursue a **Hybrid Model** leveraging all three insights:
  1.  **Teach "Sensitivities" & Judgment:** Explicitly focus curriculum on cultivating the *perceptual and deliberative* core of virtues – reliably seeing morally relevant features (injustice, need, truth/falsity) and developing practical wisdom (phronesis) through analysis, discussion, and reflection on situations (including the situationist experiments themselves).
  2.  **Directly Cultivate Intellectual/Meta-Virtues:** Prioritize teaching intellectual virtues and phronesis as foundational skills.
  3.  **Engineer Situations Strategically:** Design the learning environment and institutional structures to support desired behaviors (reduce negative situational pressures, create positive ones) *especially* for virtues where behavioral consistency is most fragile (honesty, spontaneous helping).
  4.  **Teach Situation Awareness:** Educate students *about* situational influences (making them salient "moral features") to empower their discernment and resistance.

  \answer{Hybrid Cultivation (Sensitivities + Phronesis + Situation Design)}
