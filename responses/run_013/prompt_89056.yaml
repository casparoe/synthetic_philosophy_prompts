  What I want is the stuff underneath it, because I think the chord thing is just a symptom. My hunch is that this is the same disease as "a flat prior over a continuous parameter isn't invariant under reparameterization" -- put a uniform prior on the side of a square and you get a different answer than a uniform prior on its area, even though it's literally the same square described two ways. So please:

  1. Convince me (or talk me out of it) that the chord case is really an instance of that general non-invariance problem and not some special quirk of circles.

  2. Explain the invariance / transformation-group fix, the Jaynes-style move where you demand the answer be indifferent to the circle's size and position, and say whether that actually singles out 1/2 or just quietly imports an extra physical assumption (throwing straws from far away?) that wasn't in the problem. I have a nagging feeling that any such "maximize ignorance" argument can be rejiggered to spit out a different answer if you insist on different invariances, and I want to know if that's right and what it does to the whole approach.

  3. Then the part I actually care about. Is the honest resolution here "the question was never well-posed -- a random chord isn't a determinate thing until you specify a sampling procedure, full stop"? Or is there a real sense in which one of the answers is correct and the other two are just mistakes? I keep flip-flopping. And if it's the former, what does that do to the principle of indifference more generally -- is indifference just dead in continuous cases, or can it be salvaged for some restricted class of problems?

  Don't give me the three-methods recitation again. I want the invariance/well-posedness layer, where the genuine disagreement lives, and I want you to actually stake out a position on #3 rather than surveying.
