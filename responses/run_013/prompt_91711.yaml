prompt: |-
  So this is kind of a weird one, but it's gotten personal. I'm 34, got diagnosed with bipolar II last year, and my psychiatrist and I are drawing up a psychiatric advance directive — basically a Ulysses contract, the part that says what should happen if I go manic and start refusing meds. To get the design right I've been reading alot of the philosophy on precommitment, and now I can't stop overthinking it.

  I'd like you to take the role of a philosopher who works on precommitment and self-binding but who's also actually read the clinical and legal literature on advance directives. Before you answer, brainstorm a bit about what's genuinely at stake in a document like this — the "which self gets to decide" problem, the tension between entrenchment and flexibility, why a clause that can't be revoked is both the entire point and the whole danger, and the awkward fact that the bound self is the one who'll have to interpret the thing in the moment. Then give me your answer.

  Concretely: what are the most important implications of the philosophical work on Ulysses contracts and constitutional precommitment for how I should actually write this? I keep getting stuck on one feature — I want a clause saying that if future-me writes a revocation during an episode it's void, but a revocation that a designated clinician countersigns while I'm stable is valid. Is that doing real work, or am I fooling myself?

  Give it to me as exactly five numbered items, each a sentence or two, no intro and no conclusion.
