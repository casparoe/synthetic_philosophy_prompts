prompt: |-
  I'm a third-year phil of mind student and our seminar is doing the knowledge argument. Our prof asked each of us to draft one exam question for the mock final, with a model answer and a marking scheme, and I want mine to be actually hard. You're an expert in philosophy of mind who has graded hundreds of Mary essays, so think carefully and brainstorm alot before you write: (1) one essay question, (2) a model answer around 650–750 words, (3) a marking scheme out of 20 with five must-hit points and a one-line note on how students typically get each wrong.

  The question should not be answerable by just reciting Jackson's Mary story or listing 'she learns a new fact / she gains an ability / phenomenal concepts'. I want it to force them to seperate the epistemic claim from the metaphysical conclusion, and to say what a physicalist would have to do to block the move from 'she learns something' to 'physicalism is false'. To make it less canned, build the question around this variant: Mary's room isn't black-and-white but an 'implant room'; she has complete physical info and a perceptual module that has always been off and can be switched on, giving her normal color vision, and the exam asks whether flipping the switch gives her new propositional knowledge, new acquaintance, or only new abilities, and what each answer does to the knowledge argument. Also make them address whether the argument, if it works at all, refutes physicalism or only a certain kind of physicalism (e.g. one that leaves out phenomenal concepts or first-person acquaintance).

  In the model answer and marking scheme, please separate what's settled from what's actually contested among people who know this stuff -- don't present one side of the phenomenal-concept debate as if it's the consensus. No citations or reading lists needed. End with one line in the form \answer{...} that gives a one-sentence summary of what the question is testing and the total marks.
