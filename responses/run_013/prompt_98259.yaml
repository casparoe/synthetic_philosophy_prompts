answer: |-
  ### (1) Essay Question  
  **Analyze the "Implant Room" variant of the knowledge argument: Mary possesses complete physical information about color vision and a dormant perceptual implant that, when activated, grants normal color experience. Does activating the implant give her (i) new propositional knowledge, (ii) new acquaintance, or (iii) only new abilities? For each option, explain how it strengthens or undermines the original knowledge argument’s case against physicalism. Finally, evaluate whether a successful argument refutes physicalism *in general* or only specific versions (e.g., reductive physicalism).**

  ---

  ### (2) Model Answer (690 words)  

  The "implant room" variant reframes Jackson’s knowledge argument by replacing Mary’s sensory deprivation with a latent capacity for color experience. This tweak forces sharper distinctions between *what* Mary gains upon activation (epistemic claims) and whether this entails non-physical properties (metaphysical conclusions). I argue that while the implant’s activation clearly provides new acquaintance, this alone cannot refute physicalism; only if it yields new propositional knowledge does the argument threaten physicalism—and even then, only reductive forms.  

  **Epistemic Gains: Three Options**  
  *(i) Propositional knowledge* ("knowing-that"): If activating the implant gives Mary new facts (e.g., "red looks like *this*"), the original argument holds: pre-activation Mary knew all physical facts, so her new fact must be non-physical. The implant variant strengthens this by clarifying that Mary’s deficit isn’t perceptual *access* (as critics like Lewis suggested) but integrated understanding. Physicalists must deny she learns new truths, perhaps arguing phenomenal truths are deducible from physical facts via "phenomenal concepts" (e.g., Loar). Yet the implant’s sudden revelation challenges deducibility: why wasn’t this "truth" inferable?  

  *(ii) Acquaintance* ("knowing-what-it’s-like"): If Mary gains only direct acquaintance (Russellian "knowledge by acquaintance"), the anti-physicalist inference falters. Acquaintance is non-propositional—it’s a *relation* to experience, not a fact *about* it. Mary could know all physical truths yet lack this relation until the implant activates. Physicalists (e.g., Tye) exploit this: acquaintance is a *mode of access* to physical properties, not evidence of new properties. The implant variant helps here: switching it on is like receiving a new key to a locked room—the room’s contents (physical) were always there, but access changed. This blocks the move to non-physicalism.  

  *(iii) Ability knowledge* ("knowing-how"): If activation only grants abilities (e.g., recognizing or imagining colors), the argument collapses. Rylean physicalists (e.g., Churchland) reduce "what-it’s-like" to discriminatory capacities. The implant variant supports this: switching it on enables functions Mary couldn’t perform, like distinguishing red from scarlet. But this fails—Mary could theoretically *have* all abilities (via AI simulations) and still lack subjective experience. The argument targets phenomenality, not behavior.  

  **Which Option Wins?**  
  Acquaintance is the most defensible gain. Propositional knowledge is contentious (does "redness" feel like a *fact* or a *presence*?). Abilities ignore phenomenology. Acquaintance captures the "hard problem": Mary *encounters* a qualitative dimension absent in her physical data. Yet as noted, this doesn’t entail non-physicalism—it may reflect *epistemic limitations* of physical descriptions.  

  **Does This Refute Physicalism? Scope Matters**  
  Even if Mary gains new propositional knowledge, the argument only refutes *reductive physicalism* (all truths are deducible from physical truths). Non-reductive physicalists (e.g., Chalmers) accept irreducibly subjective *facts* grounded in physical states. Crucially, this doesn’t vindicate dualism: properties can be physically constituted yet epistemically opaque. The implant variant highlights this. If Mary’s implant merely activates a physical module, her new knowledge reveals implementation gaps in reductive accounts—not a metaphysical gap. Only if her gain *cannot* be physically implemented (e.g., emergent qualia) does dualism follow. But physicalists deny this, insisting acquaintance or abilities are compatible with physicalism once we reject deducibility demands.  

  **Settled vs. Contested**  
  Settled: (1) Mary gains *something* new; (2) The argument’s soundness hinges on whether that gain is propositional; (3) It cannot refute non-reductive physicalism.  
  Contested: (1) Whether acquaintance is reducible to abilities/propositions; (2) Whether phenomenal concepts resolve the deducibility problem (e.g., Stoljar vs. Papineau); (3) Whether the argument shows physicalism is false or merely that it must accommodate irreducibility.  

  **Conclusion**  
  The implant variant clarifies that Mary’s core gain is acquaintance—a direct encounter with color experience. This challenges *reductive* physicalism by exposing epistemic gaps in translating physical data to subjective insight. However, it leaves non-reductive physicalism unscathed: physical properties can ground acquaintance without being deducibly transparent. The knowledge argument, even strengthened, targets only physicalisms that overpromise on explicability.  

  \answer{This question tests the ability to disentangle epistemic gains from metaphysical conclusions in knowledge arguments, and to assess physicalist counterstrategies against anti-physicalist inferences. Total marks: 20}

  ---

  ### (3) Marking Scheme (out of 20)  
  *Must-hit points (4 marks each):*  
  1. **Distinguish epistemic gains:** Clearly separate propositional knowledge, acquaintance, and abilities in the implant context.  
     *Common error:* Conflating acquaintance with propositional knowledge (e.g., "she learns *that* red looks like this" without specifying if this is a fact or relation).  
  2. **Link gains to argument validity:** For each option, explain how it supports/undermines the inference from "Mary learns something" to "physicalism is false."  
     *Common error:* Asserting that any new knowledge refutes physicalism without explaining *why* (e.g., ignoring deducibility).  
  3. **Defend acquaintance as primary gain:** Argue that acquaintance best captures Mary’s new state, while acknowledging alternatives.  
     *Common error:* Reducing acquaintance to abilities or dismissing it as irrelevant.  
  4. **Block the anti-physicalist move:** Explain how physicalists can accept new acquaintance/abilities without accepting non-physical properties (e.g., via epistemic limitations or modes of presentation).  
     *Common error:* Assuming physicalism requires deducibility of all knowledge from physical facts.  
  5. **Limit scope to reductive physicalism:** State that a successful argument only threatens physicalisms claiming all truths are deducible from the physical.  
     *Common error:* Claiming the argument refutes all physicalism or conflating non-reductive physicalism with dualism.  

  *Balance (0–4 marks):*  
  - **17–20:** Hits all 5 points; nuanced on contested issues; no significant errors.  
  - **13–16:** Hits 4 points; minor omissions/errors.  
  - **9–12:** Hits 3 points; superficial treatment; key misunderstandings.  
  - **5–8:** Hits 1–2 points; recites argument without analysis.  
  - **0–4:** Fails to address question; major errors.
