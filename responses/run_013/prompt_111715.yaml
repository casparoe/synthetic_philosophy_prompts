prompt: |-
  After a career in experimental physics, I have spent the last several years reading philosophy, and I have become interested in the epistemology of political disagreement. I keep encountering a pattern for which I have no term. In a dispute over a politically charged empirical matter—the reliability of a scientific institution, say, or the likely effects of a policy—each party accuses the other of arguing in bad faith. The accusation is not merely that the other side is mistaken. It is that the other side would not revise its view in the face of evidence. But the evidence that each side treats as decisive is precisely what the other side disputes. One party says that if the other were honest, it would accept the consensus of the relevant experts; the other says that if the first were honest, it would accept that the experts are captured by political interests. Each then treats the other's refusal to concede the contested premise as proof of bad faith. The test for good faith is thus internal to each side's position, and each side can apply its own test and fail the other without ever asking whether its own test is the right one.

  To be clear, I am not asking which side is correct, nor whether bad faith is common. I am asking whether there is an established concept for this structure: a dispute in which the criterion for arguing in good faith is itself one of the things in dispute, so that the charge of bad faith becomes question-begging. The pattern is related to echo chambers, but an echo chamber can exist without this particular circularity; it is related to deep disagreement, but deep disagreement concerns the absence of shared premises for rational resolution, whereas here the parties do share a vocabulary of good faith and simply disagree about its application; it is related to motive attribution asymmetry, but that concerns the distribution of motives rather than the criteria by which good faith is judged. If there is a name, I would like it identified and its boundaries marked. If there is no name, I would like a term coined and defined, with attention to what the phenomenon is not—how it differs from an ordinary charge of hypocrisy, from a self-sealing belief, and from the mere fact that people are biased. A bare label would not satisfy me; I am after the carving.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a former experimental physicist now diving into philosophy, specifically the epistemology of political disagreement. They've noticed a pattern where each side in a political dispute accuses the other of bad faith based on evidence the other side doesn't accept. The key issue is that the criterion for good faith is part of the dispute itself, making the accusation circular. They want to know if there's a term for this structure or if one needs to be coined.

  First, I need to recall related concepts. Echo chambers, deep disagreement, and motive attribution asymmetry come to mind. But the user already distinguished those. Echo chambers are about information flow, deep disagreement lacks shared premises, and motive asymmetry is about attributing negative motives. None capture the circularity where the test for good faith is contested. 

  Next, I should check philosophical literature. Epistemology of disagreement might have something. Maybe "question-begging" applies, but it's broader. The user mentioned it's not just hypocrisy or bias. They want a precise term. Since no existing term fits perfectly, coining a new one makes sense. 

  Considering possible terms: "Epistemic Entrenchment" or "Closed Justification" but they don't highlight the circular test. "Self-Sealing Accusation" comes closer but might be confused with self-sealing beliefs. "Criterial Circularity" emphasizes the circular criteria. "Good-Faith Catch-22" is catchy but maybe too informal. "Test Circularity" is straightforward but might need refinement.

  The user emphasized defining boundaries. So the new term must differentiate from related concepts. The core is the contested criterion for good faith leading to question-begging accusations. "Good-Faith Test Circularity" seems accurate. Break it down: "Good-Faith Test" specifies the criterion, "Circularity" denotes the logical flaw. 

  Also, the user wants the phenomenon carved out. So explaining how it differs from hypocrisy (which is inconsistency) or self-sealing beliefs (which protect the belief itself) is crucial. Here, it's about the mutual accusations using internal criteria. 

  Lastly, ensuring the term is precise enough for academic use. "Good-Faith Test Circularity" meets that by combining the key elements. The user's background in physics suggests appreciation for systematic terminology, so this should resonate.
answer: |-
  Based on your precise dissection, this phenomenon is a distinct and pernicious form of **epistemic circularity** within disagreement, where the *criterion for judging the epistemic virtue of the opponent* (good faith/openness to evidence) is itself *contingent upon the contested substantive claims*. While related concepts exist, none capture this specific structure perfectly. After careful consideration:

  1.  **There is no widely established, single term for *exactly* this structure.** Philosophers of disagreement (e.g., Fogelin, Lynch, Aikin, Talisse) explore deep disagreement and epistemic standoffs, but don't single out *this specific circularity concerning the criteria for good faith itself* with a dedicated label. Political psychologists (e.g., Ditto, Kahan) study biased processing and motive attribution but focus more on the *causes* and *manifestations* than this precise *logical structure of mutual accusation*.

  2.  **The most accurate and descriptive coinage is: GOOD-FAITH TEST CIRCULARITY (GFTC)**

  **Definition of Good-Faith Test Circularity (GFTC):**
  GFTC is a structural feature of profound disagreement wherein:
      *   **Mutual Accusation:** Each party accuses the other of arguing in bad faith, specifically of being unwilling to revise their position in the face of evidence.
      *   **Contested Criteria:** The "evidence" each party treats as *decisive proof* for their own position (and thus as the *test* the other *should* accept to demonstrate good faith) is precisely the core substantive claim(s) that is fundamentally *disputed* by the other side (e.g., the validity of expert consensus, the neutrality/capture of institutions).
      *   **Internal Criterion:** Each party defines the criterion for good faith (acceptance of their specific decisive evidence/premise) *internally* to their own epistemic framework and substantive commitments.
      *   **Question-Begging Accusation:** The accusation of bad faith becomes logically question-begging. Party A claims Party B is dishonest *because* B rejects Evidence X. However, B rejects Evidence X *because* B fundamentally disputes the framework or premises establishing X as decisive evidence *within A's position*. For A, rejecting X *is* proof of bad faith; for B, rejecting X is a *consequence* of their substantive disagreement with A's foundations. The accusation *presupposes the truth of the very premise under dispute* as the standard for judging epistemic virtue.
      *   **Mutual Reinforcement:** Each side interprets the other's continued adherence to their position and rejection of the "decisive evidence" as *confirmation* of bad faith, reinforcing their own stance and the perception of the other's irrationality/dishonesty, without engaging the *validity of their own criterion* for good faith.

  **Carving the Boundaries: What GFTC Is Not**

  *   **Ordinary Charge of Hypocrisy:** Hypocrisy involves inconsistency *within an agent's own stated principles or actions*. GFTC involves inconsistency *only when judged by the opponent's contested framework*. Party B isn't necessarily violating *their own* principles by rejecting Evidence X; they are violating *Party A's* principle that Evidence X *must* be accepted. GFTC is fundamentally about conflicting *epistemic frameworks* defining evidence and virtue.
  *   **Self-Sealing Belief System:** A self-sealing belief *protects the core belief itself* from counter-evidence by reinterpreting or dismissing disconfirming data. GFTC is specifically about the *criteria for judging the epistemic character (good faith) of the opponent*. While a GFTC dynamic often *protects* a self-sealing system by dismissing critics as dishonest, the core phenomenon is the *circular accusation structure* concerning the *virtue* of the disagreeing party, not just the protection of a belief.
  *   **Mere Cognitive Bias/Confirmation Bias:** Biases describe psychological tendencies to seek or interpret information favorably to one's existing views. GFTC is a specific *structural pattern of mutual accusation and justification* that *arises from and exploits* these biases within a context of deep disagreement, but it is defined by the logical circularity of the accusation criteria, not the bias itself.
  *   **Echo Chamber/Epistemic Bubble:** These describe information environments restricting exposure to dissenting views. GFTC *can flourish* within them, but it can also occur *between* distinct bubbles. Echo chambers explain *why* parties might not encounter the other's evidence; GFTC explains *how* they mutually accuse each other of dishonesty *based on* the evidence they respectively value.
  *   **Deep Disagreement (Fogelin):** Deep disagreement denotes the *absence* of shared principles or frameworks sufficient for rational adjudication. GFTC is a specific *manifestation* or *escalation* within deep disagreement. It adds the layer where the *shared concept* of "good faith" (an epistemic virtue) becomes a weapon precisely *because* its *application criterion* is pulled into the orbit of the substantive dispute. Parties agree "good faith is important," but their definitions of what *constitutes* good faith in the specific case are diametrically opposed and internal to their positions.
  *   **Motive Attribution Asymmetry:** This describes the *tendency* to attribute one's own side's actions to situational factors and the opponent's actions to negative dispositions (like dishonesty). GFTC provides the *specific logical structure* by which this attribution (of dishonesty/bad faith) is "justified" circularly *within* each side's framework. Motive attribution is the psychological tendency; GFTC is the epistemic structure enabling its seemingly reasoned justification.
  *   **Question-Begging (Petitio Principii):** GFTC *is* a specific *form* of question-begging, but applied uniquely to the *accusation of epistemic vice* (bad faith). The accuser presupposes the truth of their contested premise *as the necessary criterion* for the opponent to be considered epistemically virtuous. It's begging the question *about the standard for good faith*.

  **Why "Good-Faith Test Circularity"?**

  *   **"Good-Faith Test":** Directly targets the core issue – the contested *criterion* used to judge if the other is arguing in good faith.
  *   **"Circularity":** Accurately describes the logical flaw – the test presupposes the truth of the very thing being disputed as the standard for judging the opponent's epistemic character, making the accusation self-justifying within its own framework and irresolvable.
  *   **Precision:** It clearly distinguishes the phenomenon from related concepts like mere bias, hypocrisy, or deep disagreement generally, focusing precisely on the circular structure of mutual bad-faith accusations based on contested evidence-as-proof-of-virtue.
  *   **Descriptive Power:** The term immediately suggests the core problem: a circular trap where accusations of dishonesty are generated by the structure of the disagreement itself.

  This coinage, **Good-Faith Test Circularity (GFTC)**, accurately carves out the specific epistemic structure you have identified, distinguishing it clearly from neighboring concepts while highlighting its core feature: the question-begging circularity inherent in defining the criteria for epistemic virtue (good faith) *internal* to the substantive position under dispute.
