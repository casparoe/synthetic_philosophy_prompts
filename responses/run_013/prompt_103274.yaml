answer: |-
  ### Core Decision Rule
  Prioritize functional continuity over material continuity unless the object's primary value is its original matter (e.g., a relic), in which case material continuity is required.

  ### Procedure for Determining Object Identity  
  **Run tests in order; stop when a step gives a definitive answer. Judgment calls require human input.**  

  1. **Material Continuity (Endurantism Check)**  
     - **Question**: Has the object existed as a single, undivided entity with unbroken physical presence since creation?  
     - **Yes**: Object is the same. **Stop.**  
     - **No**: Go to Step 2.  
     - *Clarification*: Endurantism holds that an object is wholly present at every moment. Material continuity satisfies this by treating the object as a single entity enduring through change.  

  2. **Reassembly Integrity**  
     - **Question**: If the object was disassembled, can all original parts be physically reunited without significant gaps?  
     - **Yes**: Object is the same. **Stop.**  
     - **No** (parts lost, dispersed, or replaced): Go to Step 3.  
     - *Note*: Applies only if Step 1 failed due to disassembly.  

  3. **Functional Essence (Perdurantism Check)**  
     - **Question**: Does the object still perform its original core function or behavior, even with new matter?  
     - **Yes**: Object is the same. **Stop.**  
     - **No**: Go to Step 4.  
     - *Clarification*: Perdurantism treats objects as 4D "spacetime worms" with temporal parts. Functional continuity confirms identity by preserving the object’s defining purpose across time, resolving "temporary intrinsics" (e.g., a locomotive being functional at one time and non-functional at another) by attributing properties to different temporal stages.  

  4. **Reconstruction Judgment (Human Decision)**  
     - **Criteria**:  
       a. Proportion of original material (no strict percentage; assess significance).  
       b. Fidelity to original design and intent.  
       c. Cultural/historical acceptance (e.g., expert consensus, public perception).  
     - **Outcomes**:  
       - If criteria strongly support continuity: Object is the same. **Stop.**  
       - If criteria weak or contested: Object is **not** the same. **Stop.**  

  ### Counting Objects and Accessioning (Perdurantism Application)  
  - **How many objects?**  
    - An object with spare parts (e.g., locomotive + boiler) is **one object** if parts are integral to its function or history.  
    - Separated parts are **individual objects** only if they have independent function or provenance.  
  - **Accessioning**:  
    - You accession the **entire 4D object** (all temporal stages), not just the current stage.  
    - Owning a temporal stage is **like an undivided interest** in the whole object. You steward the stage you possess, but identity references the full timeline.  

  ---

  ### Case Applications  
  **Locomotive (1897 engine, heavily restored)**  
  - Step 1: Material continuity? **No** (parts replaced).  
  - Step 2: Not disassembled → Skip.  
  - Step 3: Functional essence? **Yes** (still operates as a locomotive).  
  - **Result**: Same object.  
  - *Why curators might hate this*: If original material is minimal, but functional continuity wins.  

  **Timber-Framed House (moved, 1/3 new timber)**  
  - Step 1: Material continuity? **No** (dismantled, new foundations).  
  - Step 2: Reassembly integrity? **No** (original parts not fully retained; new timber added).  
  - Step 3: Functional essence? **Yes** (still serves as a dwelling/historical structure).  
  - **Result**: Same object.  
  - *Why donors might hate this*: If material loss is significant, but function prevails.  

  **Re-Implemented Software (new hardware)**  
  - Step 1: Material continuity? **No** (original code/hardware replaced).  
  - Step 2: Not applicable → Skip.  
  - Step 3: Functional essence? **Judgment call** (Does it behave identically? If hardware alters output, **no**).  
    - *Assume behavior differs*: Functional essence **lost** → Go to Step 4.  
  - Step 4: Reconstruction judgment:  
    - a. Original matter? **None** (digital).  
    - b. Fidelity? **Uncertain** (artist’s intent vs. new tech).  
    - c. Acceptance? **Low** (if experts deem it inauthentic).  
  - **Result**: **Not** the same object.  
  - *Why curators/donors hate this*: Forces hard choice between preserving function or matter. Digital art often fails material tests.  

  ---

  ### Limitations and Failure Points  
  - **Cannot resolve**:  
    - Cases where functional and material continuity are **both ambiguous** (e.g., software with partial code reuse). These are **bookkeeping conventions**, not metaphysical truths.  
    - "Ship of Theseus" scenarios (gradual part replacement): Identity is **indeterminate**; accept either outcome as valid.  
  - **Misfires when**:  
    - Cultural acceptance (Step 4c) overrides evidence (e.g., public pressure to call a replica "original").  
    - Objects have no clear function (e.g., abstract art). Default to material continuity.  
  - **Critical judgment calls**:  
    - Step 4 (all criteria).  
    - Counting (what counts as an "integral" part).  
  - **Practical advice**:  
    - For contentious cases, document the rationale and acknowledge ambiguity.  
    - Use "original" sparingly; terms like "functional replica" or "reconstructed artifact" avoid confusion.
