  I should create a concrete example they can debate - perhaps about certification based on an evaluation suite versus expected loss under assumed conditions. The dialogue needs texture: concessions from both sides, responsive conversation rather than monologues, no citations, and no forced resolution. The tone should be conversational, like colleagues talking in a hallway.

  For character names, I'll go with Ravi (worst-case focus) and Anya (average-case focus). Their debate should cover:
