  I'll include a running example about certification against an evaluation suite. Ravi will criticize this as only covering the eval suite, while Anya will argue that expected loss under assumed conditions is meaningless when we know our assumptions are wrong. They should explore alternatives like certifying training processes or reporting risk profiles.

  Both characters should concede points: Ravi admitting worst-case can be dominated by unrealistic scenarios, Anya acknowledging that averages don't capture tail risks. The conversation should feel natural with interruptions and building on previous points. I'll aim for 1200-1800 words ending with a sharpened disagreement rather than resolution.

  For the dialogue structure:
