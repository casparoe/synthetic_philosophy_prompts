prompt: |-
  Okay so I'm trying to get the central argument of a chapter straight and I want someone to tell me whether it actually works. Here's the sketch — be as brutal as you like.

  Mary's room, standard setup: Mary knows every physical fact about colour vision, then leaves the room, sees red for the first time, and (supposedly) learns something she didn't know before. Conclusion: physicalism is false, because there are facts that outrun the physical facts. My move: I don't think the intuition, if it's worth anything, cuts against physicalism specifically. Take *any* complete description of the world, physical or otherwise. Imagine we had a complete dualist description — every fact about the non-physical properties, written out in some canonical notation. Mary's still in the room, still has never seen red. Does the dualist description close the gap? I say no. Descriptions don't seem to be the sort of thing that can hand you what-it's-like; you can be in full possession of the description and still be owed the experience. So the intuition is pumping on something quite general about the knowledge-that / descriptive mode, not on physicalism's failure in particular. If that's right, the knowledge argument can't be run as an argument *for* dualism or *against* physicalism — at most it shows that phenomenal knowledge isn't derivable from any complete description, which is a claim about description, not about the physical. I'm calling this the symmetry objection.

  What I want: comments on whether it goes through. Specifically — (a) am I begging the question by assuming a dualist description would be 'complete' in the relevant sense, or wether a description of the mental is exactly the kind that closes the gap by construction, in which case my symmetry is fake and there's a real asymmetry after all? (b) Does the objection prove too much, or does it just collapse into the phenomenal-concept reply that physicalists already give, in which case it's doing no work against them? (c) Is there a version of the knowledge argument where the asymmetry between physical and mental descriptions survives, so it still has dualist teeth? I think it's definately worth trying to save the argument this way, but tell me if I'm wasting my time.

  Lead with your bottom line in the first sentence — does the symmetry objection work, yes or no — then the reasoning. No preamble, and don't restate my question back at me. British English please.
reasoning: |-
  Okay, let me tackle this user's query about Mary's room and their symmetry objection. 

  First, I need to understand their core argument: they're claiming the Mary thought experiment doesn't specifically challenge physicalism because even a complete dualist description wouldn't give Mary the phenomenal experience of seeing red. So the gap is about descriptive knowledge versus experiential knowledge in general, not physicalism's failures. 

  The user raises three specific concerns: (a) whether they're begging the question about dualist descriptions, (b) if this collapses into existing physicalist responses, and (c) whether the knowledge argument can be salvaged for dualism. 

  Hmm... on point (a), I think they're onto something. Dualist descriptions might include mental properties by definition, but that doesn't mean describing them gives the experience - just like describing pain isn't feeling pain. So no question-begging there. 

  For (b), this does feel adjacent to the phenomenal concept strategy, but it's broader - attacking any descriptive system, not just physicalist ones. So it's not redundant. 

  Regarding (c), a dualist could argue their description includes the phenomenal properties themselves, not just pointers. But that seems to confuse the map with the territory. The user's symmetry seems to hold water here. 

  Noticing the user wants brutal honesty - they've clearly done their philosophy homework. Their objection seems robust, though I should flag that some might see this as reinforcing physicalism rather than attacking dualism. 

  The British English requirement is noted - I'll keep "colour" not "color", etc. And they want the bottom line first: yes, the symmetry objection works. 

  Right, time to structure the response: lead with the verdict, then unpack each concern methodically without restating their query. Need to be concise but rigorous - this user appreciates precision.
answer: |-
  **Bottom line: Yes, your symmetry objection largely works against the standard knowledge argument for dualism.**

  **Reasoning:**

  **(a) Question-begging? No.** Your point holds. A "complete" dualist description, listing *all facts* about non-physical properties (say, qualia Q1, Q2... associated with states P1, P2...), is still a *description*. Possessing this descriptive knowledge *that* quale Q1 is associated with red light hitting the retina in state P1 isn't equivalent to *experiencing* Q1 itself. Mary, confined with only this description, still wouldn't know *what it's like* to experience Q1 until she actually has the experience. The gap isn't inherently between physical and non-physical descriptions; it's between *propositional knowledge* (knowing-that) and *phenomenal knowledge* (knowing-what-it's-like). The dualist description doesn't automatically "close the gap by construction" – it merely catalogues the existence and relations of non-physical properties, not their intrinsic experiential character.

  **(b) Proves too much or collapses into phenomenal concepts? No, but it's adjacent.**  
  *   **Proves too much?** It doesn't prove *too much*; it precisely targets the knowledge argument's inference from Mary's epistemic gap to an ontological gap (physicalism is false). Your objection shows the epistemic gap could arise from the *nature of descriptive knowledge itself* relative to phenomenal knowledge, irrespective of the ontology described.  
  *   **Collapse into phenomenal concepts?** It shares *terrain* with the phenomenal concept strategy (PCS), which argues physical facts *are* complete, but phenomenal concepts offer a unique, non-descriptive mode of access. However, your objection is broader and more fundamental:  
      *   PCS typically accepts the physical description *is* ontologically complete but claims Mary acquires a new *concept*, not a new *fact*.  
      *   Your objection challenges the very *logic* of the inference used by the knowledge argument itself, showing it wouldn't work *even if dualism were true*, because the gap persists under *any* descriptive framework. It undermines the argument's *structure*, whereas PCS offers a physicalist-compatible *explanation* of the gap. Your objection weakens the dualist's weapon, making PCS a more viable *response* if physicalism is true.

  **(c) Salvaging dualist teeth? Difficult, but perhaps via direct acquaintance.**  
  The asymmetry struggles to survive your objection. However, a dualist *might* try:  
  1.  **Definitional Move:** Argue a "complete" dualist description *must* include the phenomenal properties *themselves*, not just descriptions *about* them. But this seems incoherent – a written or spoken description *cannot* literally *contain* the phenomenal experience.  
  2.  **Direct Acquaintance:** Claim the dualist description grants *direct epistemic access* to the non-physical qualia, bypassing the descriptive mode. For example, reading the description *just is* experiencing the quale. But this:  
      *   Is highly implausible (reading about pain isn't feeling pain).  
      *   Fundamentally changes the thought experiment – Mary wouldn't be *confined* if the description delivered the experience.  
      *   Makes the dualist description radically different from *any* standard descriptive system (physical or otherwise), undermining the symmetry *only* by stipulating an implausible, magical form of epistemic access unique to the mental description. This seems ad hoc and question-begging.  

  **Conclusion:** Your symmetry objection successfully defangs the standard knowledge argument. It exposes the core issue as the inherent limitation of *description* for conveying phenomenal *experience*, not a specific failure of *physical* description. While adjacent to PCS, it operates at a more foundational level by challenging the argument's inference structure directly. Saving a robustly *dualist* conclusion from Mary's room via your symmetry is highly problematic; the argument loses its specific anti-physicalist force. Your effort is **not** wasted; it's a powerful critique of the knowledge argument's logic.
