prompt: |-
  I'm a PhD student in philosophy, and I've been asked to run a ninety-minute session on peer disagreement — conciliationism versus steadfastness — for an interdisciplinary reading group: statisticians, professional forecasters, and two people from an ML lab. They are fluent in probability and Bayesian updating and have no epistemology at all. I don't want the debate explained to me; I want a plan for teaching it in that room.

  Start with the order in which the components have to go in and why the dependencies run that way: what has to be in place before the question even parses for this audience, and which of the usual building blocks can be compressed or skipped given what they already know. Then tell me what single case should carry the session. My current candidate is two forecasters with the same dataset, each aware of the other's track record, who end up at 0.75 and 0.40 on the same question — but I suspect that is a mistake, precisely because this audience will reduce the whole thing to a Bayesian update on the fact of disagreement. So tell me what the carrying case must have, and must lack, to survive that reduction rather than invite it, and whether a second case has to do work the first cannot.

  Then the misconception map. What I expect: that conciliationism just means averaging the two credences; that the dispute is about how much to trust the other person rather than about what epistemic weight the bare fact of disagreement gets; that steadfastness is self-confidence or stubbornness under another name. Give me the rest, in the order they will actually surface, and mark the exact point in the sequence where each should be headed off rather than left to sit. I also want the session to end with the self-undermining worry visible as a live problem rather than a puzzle with a known answer — the worry, roughly, that if a peer's disagreement should lower my confidence, I owe an account of what happens when the disagreement is itself about how to respond to disagreement. Tell me what must be established earlier for that to land, and give me one closing question that would show whether they have the shape of the problem or only a slogan.

  Finally, say what I should openly refuse to cover at this level. And throughout, keep track of which of the positions I would be presenting as the standard framing are in fact contested among people who work on this: I don't want to teach my own leanings as the consensus, so flag where the plan should say out loud that the literature is split.
reasoning: |-
  Okay, let me tackle this complex request from a philosophy PhD student. They need to design a 90-minute session on peer disagreement for an interdisciplinary group with strong stats/ML backgrounds but no epistemology. The challenge is to make the philosophical debate accessible without oversimplifying, while avoiding common misconceptions.

  First, I need to structure the session's flow carefully. Since the audience thinks naturally in Bayesian terms, I should start from their comfort zone before introducing philosophical nuances. The key dependencies seem to be:
  - Establishing the concept of epistemic peers first (shared evidence, similar competence)
  - Introducing credences as degrees of belief
  - Highlighting the core puzzle: when peers disagree, should you conciliate or stay steadfast?
  The philosophy must build on their statistical intuitions, not replace them.

  For the central case study, their proposed forecasters example risks Bayesian reductionism. Instead, I'll suggest a case with ambiguous evidence - like interpreting a complex geopolitical scenario. This prevents simple updating because it emphasizes differing interpretations of shared data. A second case about disagreeing on disagreement itself would set up the self-undermining problem later.

  The misconception map is crucial. I anticipate:
  - Reducing conciliationism to simple averaging
  - Confusing epistemic weight with reliability assessments
  - Mistaking steadfastness for mere stubbornness
  These should be preempted when introducing each position, using their own case to show why simple Bayesian updates don't resolve the philosophical dilemma.

  For the self-undermining worry, I'll need to lay groundwork early by distinguishing object-level and meta-level disagreements. The closing question should probe whether they grasp that disagreement about disagreement creates a regress problem.

  Throughout, I'll note contested areas in the literature - like whether peerhood is symmetric or how to weight disagreements. And I'll explicitly bracket applied issues like calibration techniques to maintain philosophical focus.

  The session should end by leaving the self-undermining problem open, showing how it challenges both positions equally. This preserves complexity while demonstrating philosophy's value to their technical work.
answer: |-
  Here’s a structured plan optimized for your audience, leveraging their strengths while avoiding philosophical pitfalls. Focus on **epistemic weight of disagreement itself**, not reliability assessment or averaging.

  ### **Session Structure & Dependencies**  
  *(Total: 90 min)*  

  1. **Groundwork: What Makes Disagreement "Peer"? (15 min)**  
     - **Why start here?** Without "peer," disagreement reduces to Bayesian reliability updating.  
     - **Key definition:** Peers ≈ same evidence + similar competence/track record *on this type of question*.  
     - **Their shortcut:** Use "calibrated forecasters with identical datasets." Emphasize: *This symmetry is the philosophical crux*.  
     - **Skip:** Long debates on defining "peer." Use their ML/stats intuition: "Assume two models with same training data and past test-set accuracy."  

  2. **The Core Puzzle: Bare Disagreement (20 min)**  
     - **Case Study (Carrying the session):**  
       *"Two geopolitical forecasters, Alice (p=0.75) and Bob (p=0.40), same dataset, same past Brier scores. Each learns the other’s estimate. How should they update?"*  
     - **Why this works:**  
       - Forces focus on *disagreement as evidence*, not hidden data differences.  
       - **Crucial addition:** Alice and Bob *agree why they’re peers* (same evidence, mutual respect for track records).  
     - **Must lack:** Any asymmetry (e.g., one saw extra data). Pre-empt Bayesian reduction by stressing: *"Assume no undisclosed priors or likelihoods—this is about the fact of disagreement itself."*  

  3. **Introduce the Positions (15 min)**  
     - **Conciliationism (Elga/Kelly):** Disagreement with a peer *itself* is evidence you made a mistake. Rational response: significantly revise toward the peer (not necessarily average!).  
     - **Steadfastness (Kelly/van Inwagen):** Peer disagreement doesn’t inherently require major revision; you can rationally stick to your guns (if justified by your evaluation of evidence).  
     - **Flag contestation:** "Note: Leading conciliationists (Elga) and steadfasters (Kelly) disagree on *how much* conciliation is required—this is live debate."  

  4. **The Self-Undermining Problem Setup (20 min)**  
     - **Second Case (Essential):** *Alice and Bob disagree on how to respond to peer disagreement.*  
       - Alice: "True peers should conciliate to ~0.58." (Conciliationist)  
       - Bob: "We should stay near our original estimates." (Steadfaster)  
     - **Why now?** Reveals meta-disagreement. Ask: *"Can they apply their own theories to this disagreement about disagreement?"*  
     - **Requires prior groundwork:** Peer definition + core positions must be clear.  

  5. **Misconception Map & Deflection Points**  
     *(Address as they arise, but pre-empt at these stages):*  

     | **Misconception** | **When it surfaces** | **Deflection Strategy** |  
     |-------------------|----------------------|--------------------------|  
     | "Conciliation = averaging credences" | Intro to conciliationism | **Pre-empt:** "It’s about *revision*, not math. Elga argues for equal weight, but others reject formulas." Use case: *"Should Alice drop to 0.58? 0.60? Conciliationists debate this."* |  
     | "This is just about trust in the person" | Core puzzle case | **Shut down immediately:** "Recall: They’re peers by assumption. If Bob is unreliable, he’s not a peer. This is about what disagreement *adds*." |  
     | "Steadfastness = arrogance" | Intro to steadfastness | **Pre-empt:** "Steadfasters argue: If evidence genuinely supports p=0.75, why abandon it? It’s about evidence, not ego." |  
     | "Bayesian updating solves this" | Any time | **Force the key point:** "Bayes tells you how to update on *new data*. Is disagreement itself data about your reasoning error? That’s the philosophical question." |  

  6. **Self-Undermining Climax (15 min)**  
     - **Pose the problem:**  
       - Alice (conc): "We should conciliate!"  
       - Bob (stead): "We shouldn’t!"  
       - *Can either apply their own view consistently?*  
         - If Alice conciliates toward Bob’s steadfastness, she abandons conciliationism.  
         - If Bob refuses to conciliate, is he dogmatic?  
     - **Closing Question (Diagnostic):**  
       *"If your own theory of disagreement is contested by a peer, does your theory require you to conciliate toward its rejection?"*  
       - **Why it works:** Tests if they see the regress (applying the theory to itself). Correct answers show grasp of structure; slogans fail.  

  7. **What to Refuse to Cover**  
     - **Openly exclude:**  
       - Social psychology of disagreement (e.g., bias studies).  
       - Applied forecasting techniques (e.g., how to aggregate predictions).  
       - Formal Bayesian models of disagreement (unless raised; say: "That’s a rich area, but today’s focus is the *normative* question.").  
     - **Boundary phrase:** "Today we’re isolating the *epistemic duty* question—what rationality demands, not what’s practical or strategic."  

  ### **Contested Points to Flag**  
  1. **"Who counts as a peer?"** (Disputed: symmetry, track records, domain specificity).  
  2. **"How much conciliation?"** (Elga: equal weight; others: variable).  
  3. **"Is steadfastness ever rational?"** (Kelly: sometimes; others: rarely).  
     **Your role:** "The literature splits here—I’m presenting the central arguments, not endorsing."  

  ### **Why This Works for Your Audience**  
  - **Stats/ML hooks:** Peer definition ≈ model calibration; credences ≈ probabilistic outputs.  
  - **Blocks reductionism:** The second case (meta-disagreement) **cannot** be Bayesian-updated away, forcing engagement with epistemology.  
  - **Closes strong:** The self-undermining problem leaves them with an unresolved tension—philosophy’s "live wire" effect.  

  **Final Tip:** Start with a poll: *"If a peer disagrees, should you significantly revise? Yes/No."* Re-poll at the end to show shifted intuitions.
