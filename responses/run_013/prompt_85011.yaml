prompt: |-
  I'm an MPhil student in philosophy of mind and I need to turn a half-formed idea into a two-page prospectus for my thesis chapter — roughly 8,000 words, one semester's worth of work. Take the role of a philosopher of cognitive science who knows the stances-and-real-patterns literature inside out and is sceptical of it; think carefully before you write, and start by brainstorming rather than diving straight in.

  My idea, as best as I've got it: Dennett's line (as I read him) is that a pattern is real when a description that uses it buys you a big compression win over the raw description of the data, and that this is what makes belief-desire talk about people, thermostats and chess engines legitimate rather than merely useful fiction. I was happy with that until I noticed that compression and causation seem to come apart, and that every example in the usual line-up — the glider in Conway's Life, the chess program, the thermostat — is a case where they happen to line up. Two cases where they don't: Benford's law, which is a gorgeous compressible pattern that turns up in all sorts of unrelated datasets and doesn't seem to cause anything; and a chaotic system, where the fine-grained trajectory is causally doing all the work but is essentially incompressible, so the pattern-language has nothing to grab. I suspect the framework is quietly trading on 'real' meaning 'causally efficacious', and that if you say that out loud you either have to drop the compression criterion for something else or let in far more patterns than Dennett wants to. So my half-formed question is whether the realism of the intentional stance depends on which criterion of pattern-realism you adopt, and whether the framework can be run on a causal criterion without smuggling back in exactly the Cartesian commitments it was built to avoid.

  Please turn this into the prospectus: a precise statement of the question (something with a determinate answer, not a 'let's explore' affair), an account of why the existing positions leave it open — in particular why the standard vindication-by-predictive-success move doesn't settle it — the method (what I'd actually do, roughly month by month, and why this counts as conceptual work rather than just a literature review), what a good result would look like and what would count as the project failing, and an honest scope check on whether this is one chapter or a whole thesis. Brainstorm two or three ways of sharpening the question first, tell me which you'd pick and why, then write the thing. No citations, references or reading lists please — I'll add those myself. British English. Oh, and my superviser thinks the whole stances business is a dead end, so the proposal also has to make a case for wether it's worth doing at all.
reasoning: |-
  Okay, the user is an MPhil student in philosophy of mind working on a thesis chapter prospectus. They have a half-formed idea critiquing Dennett's real patterns framework, specifically the tension between compression and causation. 

  First, I need to understand their core concern: Dennett uses compressibility to justify realism about intentional states, but the user notices compression doesn't always align with causal efficacy (Benford's law vs chaotic systems). They suspect Dennett might be smuggling in causal criteria while claiming compression is sufficient, potentially reintroducing Cartesian pitfalls. 

  The user's explicit request is to turn this into a structured prospectus with precise question, gap analysis, method, success/failure criteria, and scope check. But deeper needs emerge: their supervisor thinks the stances framework is a dead end, so the prospectus must compellingly argue for its relevance. They also need to transform a fuzzy intuition into a razor-sharp thesis question - hence my brainstorming step is crucial. 

  Brainstorming three angles: 
  1) Focus on the intentional stance's legitimacy - most directly addresses Dennett's project but may be too narrow. 
  2) Examine pattern realism criteria - philosophically deeper but risks scope creep. 
  3) Test framework against edge cases - concrete but could become technical. 

  I lean toward Option 1 because it centers the chapter on Dennett's core claim while letting the Benford/chaos cases do critical work. The "depends on" phrasing also creates a clear binary to investigate. 

  For the prospectus structure: 
  - Question must be yes/no determinate: "Does the intentional stance's realism require causation?" 
  - Gap: Existing literature ignores the compression-causation divergence, and predictive success alone doesn't resolve it (prediction ≠ causation). 
  - Method: Month 1-2 dissect Dennett's compression criterion; month 3-4 analyze causal alternatives; month 5 test against counterexamples; month 6 integrate findings. This is conceptual work because it constructs new distinctions. 
  - Success: A clear taxonomy showing where Dennett's framework holds/fails. Failure: Getting stuck in definitional debates or missing the Cartesian ghost re-entry risk. 
  - Scope: One chapter - the edge cases constrain it, but the thesis could expand to other stances. 

  Supervisor resistance: Argue this isn't beating a dead horse because (a) Dennett's influence persists in cognitive science, (b) the compression-causation tension exposes unresolved foundations, and (c) it forces clarity on what "realism" means - which matters for debates about AI cognition. 

  British English checks: "realise", "criterion/criteria", "programme" where applicable. No citations per request. 

  Key move: Frame this as diagnosing a silent assumption in Dennett's framework rather than outright rejection. That's more novel than mere criticism.
answer: |-
  Here’s a structured prospectus tailored to your needs, with British English and a focus on precision, feasibility, and scholarly stakes. I’ve prioritised conceptual clarity and a defensible scope for one semester’s work.

  ---

  **Thesis Chapter Prospectus: Causation, Compression, and the 'Reality' of Intentional Patterns**  
  **(Approx. 8,000 words)**

  ### 1. Precise Research Question  
  *Does the legitimacy of the intentional stance as a description of "real patterns" depend on adopting a causal criterion for pattern-realism, and if so, can this avoid reintroducing Cartesian commitments about mental causation?*

  - **Why this is determinate**: The question demands a yes/no evaluation of whether Dennett’s compression-based realism *requires* causal efficacy to ground intentional patterns (e.g., beliefs/desires). If yes, we must assess whether this collapses into substance dualism or reductive physicalism—positions Dennett’s framework aims to circumvent.

  ### 2. Why Existing Positions Leave the Question Open  
  - **Dennett’s predictive compressionism**: He argues pattern-realism is *solely* a matter of predictive/compressive utility ("stances" as tools). But this ignores cases where compression and causation diverge (e.g., Benford’s law is compressible but epiphenomenal; chaotic trajectories are causal but incompressible).  
  - **Standard vindication-by-prediction fails**: Predictive success doesn’t resolve whether patterns are *causal*. A useful fiction (e.g., celestial spheres) can predict without capturing causation, while chaotic causes resist prediction. Dennett assumes compression tracks causal relevance, but this is unargued.  
  - **Causal realists (e.g., Fodor, Millikan)** demand patterns mirror causal structures, but they often tacitly endorse computational/cartesian architectures. Dennett’s anti-realism about propositional attitudes seems incompatible with their view.  
  - **The gap**: No account reconciles Dennett’s instrumentalism with the *causal expectations* embedded in folk psychology. If we treat beliefs as "real" due to compression, but they lack causal power, the intentional stance becomes an *explanatorily inert* fiction—contradicting its scientific appeal.

  ### 3. Method: Month-by-Month Work Plan  
  *(Conceptual work via critical analysis, not literature review)*  
  - **Month 1: Deconstruct Dennett’s criterion**  
    - Task: Isolate compression’s role in *Real Patterns* and *Intentional Stance* texts. Map implied assumptions about causation (e.g., "patterns" as causal bottlenecks).  
    - Why conceptual: Diagnose unstated premises in compressionist realism.  
  - **Month 2: Test compression against causation-divergent cases**  
    - Task: Apply Benford’s law (compressible/non-causal) and chaotic systems (causal/incompressible) to Dennett’s examples (thermostats, chess AI). Does "real pattern" usage covertly rely on causal intuition?  
    - Why conceptual: Reveal tensions in the framework via edge cases, not textual interpretation.  
  - **Month 3: Evaluate causal criteria for pattern-realism**  
    - Task: Draft a "causal pattern" criterion (e.g., patterns as invariant under intervention). Test whether intentional states satisfy it without invoking Cartesianism (e.g., by coupling with Dennett’s multiple drafts model).  
    - Why conceptual: Construct and stress-test a hybrid model.  
  - **Month 4: Confront the Cartesian challenge**  
    - Task: If causation is necessary, does grounding beliefs/desires in physical causes reduce them to structural/functional properties? Or does it resurrect dualism by demanding "mental causation"?  
    - Why conceptual: Resolve whether Dennett’s escape from Cartesianism survives the causal turn.  

  ### 4. What a Good Result Looks Like  
  - **Strong outcome**: Demonstrate that compression is *insufficient* for realist commitments to the intentional stance, and that a minimally causal criterion (e.g., patterns as difference-makers) is necessary—but only viable if detached from microphysical reductionism.  
  - **Weak outcome**: Show that Dennett’s framework *implicitly* relies on causation, making it unstable; intentional patterns are either useful fictions (abandoning realism) or require a revised ontology.  
  - **Failure conditions**:  
    - Inability to disentangle compression/causation in case studies.  
    - Conflation of Dennett’s project with Fodorian realism.  
    - No clear criteria for "avoiding Cartesian commitments".  

  ### 5. Scope: Chapter, Not Thesis  
  - **Feasible for one chapter**: Focus is narrow—evaluating *one* criterion (causation) against *one* aspect of Dennett’s system (pattern-realism in intentional stance). Chaotic/Benford cases keep analysis bounded.  
  - **Not a thesis**: Broader issues (e.g., applicability to design/physical stances, comprehensive metaphysics of causation) are excluded. Conclusion will signpost these for future work.  

  ### 6. Why This Isn’t a Dead End  
  - **Supervisor’s scepticism addressed**: The stances framework remains ubiquitous in cognitive science (e.g., AI ethics, animal cognition) as a "safe" ontology. Showing its unresolved tension with causation:  
    - Exposes a foundational ambiguity in how cognitive science justifies its explanations.  
    - Forces clarity on whether "realism" is about prediction or mechanism—a divide impacting debates on consciousness, AI personhood, and mental representation.  
  - **Scholarly value**: Even if Dennett is wrong, *why* it fails at this juncture reveals:  
    - Whether instrumentalism can coherently replace causation.  
    - If anti-Cartesian projects must choose between eliminativism and reductive causation.  

  ---

  **Brainstorming Rationale**:  
  I considered sharpening the question as:  
  1. *"Can Dennett’s real patterns account for causal relevance?"* (Too broad; drifts into metaphysics of causation).  
  2. *"Is Benford’s law a ‘real pattern’ by Dennett’s lights, and what are the implications?"* (Too narrow; misses intentional stance).  
  3. **Chosen formulation**: Targets the core tension in your idea—compression vs. causation—while directly engaging Dennett’s flagship project (intentional stance). Forces a verdict on whether his realism is coherent, satisfying your need for a determinate answer.  

  This prospectus makes the project executable, confronts supervisor scepticism, and ensures conceptual heavy-lifting dominates. I’ve kept it lean for your 8,000-word target—expand methodological details in your final draft.
