  ### The Shared Bonus Pool Dilemma  
  Alice and Bob are coworkers tasked with a 4-week project. Each week, one takes the lead (Alice in weeks 1 and 3, Bob in weeks 2 and 4). On their turn, a player can:  
  - **Cooperate**: Work hard at a **personal cost of 4**, adding **5 to a shared bonus pool**.  
  - **Defect**: Do minimal work at **no cost**, adding **nothing to the pool**.  

  At the end of week 4, if the pool is **≥12**, they split it equally. If it’s **<12**, the project fails, and both get **zero**. The pool starts at 0.  

  #### Backward Induction: The "Rational" Unraveling  
  1. **Week 4 (Bob’s turn)**:  
     - If the pool is **≥12**: Defecting lets Bob take half without cost (he gets *Pool/2*). Cooperating costs 4 and only gains him *½(Pool + 5) – 4*, which is worse. **→ DEFECT**.  
     - If the pool is **7–11**: Only cooperating reaches ≥12. Bob nets *½(Pool + 5) – 4*, which is positive (e.g., pool=7: *½(12)–4=2*). **→ COOPERATE**.  
     - If the pool is **<7**: Even with cooperation, the pool stays <12. Cooperating costs 4 for no gain. **→ DEFECT**.  

  2. **Week 3 (Alice’s turn)**:  
     - If the pool is **5**: Cooperating makes it 10. Bob then cooperates in week 4 (pool=10→15≥12). Alice nets *½(15) – 4 (cost) = 3.5*. Defecting leaves pool=5, Bob cooperates (pool=10), but Alice gets *½(10)=5* with no cost. **5 > 3.5 → DEFECT**.  
     - If the pool is **0**: Cooperating (pool=5) leads to Bob cooperating (pool=10), but Alice’s net is *½(10) – 4 =1* (after her cost). Defecting means pool=0→project fails. **0 > –4 (if she cooperates) → DEFECT**.  

  3. **Week 2 (Bob’s turn)**:  
     - If Alice cooperated in week 1 (pool=5), Bob knows:  
       - Cooperating (pool=10) makes Alice defect in week 3 (pool stays 10). Bob then cooperates in week 4 (pool=15), netting *½(15) – 4 (week 2) – 4 (week 4) = –0.5*.  
       - Defecting (pool=5) makes Alice cooperate (pool=10), and Bob cooperates in week 4 (pool=15), netting *½(15) – 4 (week 4) = 3.5*. **3.5 > –0.5 → DEFECT**.  

  4. **Week 1 (Alice’s turn)**:  
     - Cooperating costs 4, making pool=5. Bob then defects (pool=5), Alice cooperates (pool=10), Bob cooperates (pool=15). Alice nets *½(15) – 4 (week 1) – 4 (week 3) = –0.5*.  
     - Defecting costs 0. Bob defects, Alice defects, project fails. Alice nets **0**. **0 > –0.5 → DEFECT**.  

  **Result**: Both defect from the start. The bonus pool stays at 0. Both get **0**.  
  **If both cooperated**: Pool = 20 (5×4). Each gets *10 – 8 (costs) = 2*.  

  ### The Fragile Trigger  
  **What makes the paradox tick**: The **threshold (pool ≥12)** creates a "last-minute" incentive to cooperate if the pool is *just below* the threshold (7–11 in week 4). But this **depends entirely on the pool’s exact value** at each step. In week 3, a pool of 5 *should* trigger cooperation (because Bob will cooperate if it reaches 10). But backward induction fails here because Alice compares:  
  - *Cooperate*: Pool=10 → Bob cooperates → she gets 3.5.  
  - *Defect*: Pool=5 → Bob cooperates → she gets 5 (no cost).  

  Defecting is better *for her*—even though it still leads to the pool reaching 15. The threshold’s power is **undercut by the immediate savings of defection**.  

  **Remove this, and cooperation survives**: If there’s **no threshold** (e.g., they split the pool regardless), Alice wouldn’t defect in week 3. Her choice would be: *Cooperate* (costs 4, adds 5 to the pool → she nets *0.5* after splits) vs. *Defect* (nets *0*). Cooperation becomes sustainable.  

  ### The Counter-Argument: "You Stacked the Costs!"  
  A defender of backward induction might argue: *"You made cooperation so costly (4) relative to individual gain (only +2.5 from your own $5 addition) that defection is obviously better. Real cooperation isn’t this lopsided!"*  

  **Does it land? Partially**. The costs *are* calibrated to ensure defection is strictly rational at each step. But that’s the point:  
  - In real-world dilemmas (like underfunded public goods), individual effort *often* costs more than its *isolated* benefit.  
  - The threshold *should* fix this by making efforts interdependent, but backward induction ignores that interdependence—it severs the future from the present. The model is "correct" mathematically yet fails human trust.  

  The fragility isn’t in the payoffs—it’s in the **assumption that players will ignore mutual gain to chase microscopic, step-by-step advantages**. When real people reject this, it’s not irrationality; it’s recognizing that the model’s "rationality" is too narrow to capture cooperation.
