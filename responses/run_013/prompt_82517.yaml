  Okay, the user wants a satirical piece for their school paper about the paradox of voting. They need a how-to pamphlet from a fictional "Institute for Rational Voting" that takes the paradox seriously but monetizes it. Let me break down their requirements.

  First, the economics: the paradox states that the probability of one vote being pivotal is minuscule, so voting seems irrational when costs (time, effort) outweigh benefits. The piece must include the formula: pivotality × stakes - cost + duty benefit. The pamphlet should treat the duty term as a commodity, with a worksheet to price it. 

  The user wants accurate calculus. The pivotality isn't zero but tiny in large elections, so the pamphlet should recommend voting in small local races instead. That's absurd advice for a GOTV effort, which is the satire. Also, pushing the duty term to its logical extreme: if the warm glow is the main reason, then a placebo ballot should suffice. The narrator shouldn't realize the absurdity.

  Include a dissenting colleague's argument about collective action—if everyone thinks this way, democracy collapses. The narrator dismisses it with "one vote doesn't matter," but the reader should see the flaw. No real citations; all invented names and stats. Around 600 words, deadpan, no winking.

  The user is a student, likely needing something clever for satire page. Their econ teacher mentioned the paradox, so they want to explore it humorously while showing understanding. Deeper needs: demonstrate grasp of the economic concepts, critique of rational choice theory, and highlight civic duty's role. Avoid mocking voters; the humor comes from the pamphlet's extreme rationality.

  Structure: Start with a smug title and intro. Explain the formula, break down each component. Pivotality: show calculation for presidential vs. local, recommend skipping big elections. Duty as a consumable good, offer placebo ballot. Dissenting quote from "Dr. Aris Thorne," dismissed but lingering. Worksheet to calculate personal duty value. End with the Institute's services for sale.

  Tone: Must stay deadpan. Narrator is earnest, not realizing the self-sabotage. Use corporate jargon, make the worksheet detailed. Ensure jokes stem from the logic, e.g., comparing civic duty to premium coffee. Stats like "1 in 60 million" for presidential pivotality, but "1 in 200" for water board. Placebo ballot as a premium product. The colleague's concern highlights the collective action problem, subtly showing the paradox isn't fully resolved.

  Check word count. Subheads: "The Rational Voter's Calculus," "Pivotality: Know Your Odds," etc. Worksheet with itemized costs and benefits. Avoid real references; all fictional. Ensure the satire is sharp but not mean-spirited, aligning with the school paper's standards.
