answer: |-
  ### Decision Tree for Classifying Positions on the Frame Problem  
  *Designed for graduate seminar use. Answer each question based on core commitments, not prior knowledge of positions. Concrete cases are referenced to guide answers.*

  ---

  #### **Q1: When a system performs an action like "waiting" (which should leave most facts unchanged), is the core difficulty how to *efficiently represent persistence* without exhaustively listing every unchanged fact?**  
  - **Yes** → Focus on **representation** (Go to Q2).  
  - **No** → Consider relevance or situated coping (Go to Q3).  

  ---

  #### **Q2 (Representation branch)**: Could a system *in principle* solve this representation problem with unlimited resources (e.g., infinite computing power), but fails in practice due to computational constraints?  
  - **Yes** → Problem is **computational tractability** (Go to Q4).  
  - **No** → Problem stems from **conceptual confusion** about representation itself (Go to Q5).  

  ---

  #### **Q3 (Non-representation branch)**: When a domestic robot clears a table but wastes time considering the wall color, is the core difficulty how to *ignore irrelevant information* (e.g., filtering what matters for the task)?  
  - **Yes** → Focus on **relevance** (Go to Q6).  
  - **No** → Difficulty arises because **explicit representation is misguided**; intelligence should bypass symbols via real-time interaction (Go to Q8).  

  ---

  #### **Q4 (Tractability branch)**: Is this tractability issue unique to artificial systems, or does it afflict *any* resource-limited reasoner (e.g., humans)?  
  - **Unique to AI** → [Position: **AI-Specific Tractability**]  
    *Awkward commitment: Must deny that humans face analogous efficiency constraints.*  
  - **Applies to all finite reasoners** → [Position: **Generalized Tractability**]  
    *Awkward commitment: Must explain why humans appear to avoid computational paralysis.*  

  ---

  #### **Q5 (Conceptual confusion branch)**: Does the representation problem dissolve if we reject classical logic-based models (e.g., frame axioms are incoherent)?  
  - **Yes** → [Position: **Representational Dissolution**]  
    *Awkward commitment: Must dismiss the problem as a philosophical artifact, not an engineering challenge.*  
  - **No** → *Unoccupied. Diagnosis: Incoherent—if representation is conceptually flawed, dissolution is unavoidable.*  

  ---

  #### **Q6 (Relevance branch)**: Is the relevance problem primarily about *engineering shortcuts* (e.g., heuristics to prune search spaces), not deep limits on reasoning?  
  - **Yes** → Problem is **engineering practice** (Go to Q7).  
  - **No** → Problem reflects a **fundamental limit** on formal systems (Go to Q9).  

  ---

  #### **Q7 (Engineering branch)**: Is this engineering challenge unique to AI, or does it reflect a *general limitation* of bounded reasoners?  
  - **Unique to AI** → [Position: **Pragmatic AI Engineering**]  
    *Awkward commitment: Must argue humans have "built-in" relevance heuristics unavailable to AI.*  
  - **General limitation** → [Position: **Bounded Rationality**]  
    *Awkward commitment: Must reduce human relevance-detection to efficient algorithms.*  

  ---

  #### **Q8 (Situated coping branch)**: For an embodied robot navigating a room, does bypassing explicit representation (e.g., via sensorimotor reflexes) *eliminate* the frame problem?  
  - **Yes** → [Position: **Embodied Dissolution**]  
    *Awkward commitment: Must reject symbolic planning as essential to intelligence.*  
  - **No** → [Position: **Hybrid Challenge**]  
    *Awkward commitment: Must justify why embodiment *and* representation are both necessary yet insufficient.*  

  ---

  #### **Q9 (Fundamental limit branch)**: Is the relevance problem unsolvable for AI but *solvable by humans* using non-computational means (e.g., intuition)?  
  - **Yes** → [Position: **Human Exceptionalism**]  
    *Awkward commitment: Must posit a non-algorithmic human capacity.*  
  - **No** → [Position: **Inescapable Relevance Problem**]  
    *Awkward commitment: Must concede that *all* reasoning (human or AI) is fundamentally flawed.*  

  ---

  ### Taxonomy Summary (8 Leaves)  
  | **Path**                     | **Position**                  | **Status** |  
  |------------------------------|-------------------------------|------------|  
  | Q1:Y → Q2:Y → Q4:AI          | AI-Specific Tractability      | Named      |  
  | Q1:Y → Q2:Y → Q4:General     | Generalized Tractability      | Named      |  
  | Q1:Y → Q2:N → Q5:Y           | Representational Dissolution  | Named      |  
  | Q1:N → Q3:Y → Q6:Y → Q7:AI   | Pragmatic AI Engineering      | Named      |  
  | Q1:N → Q3:Y → Q6:Y → Q7:Gen  | Bounded Rationality           | Named      |  
  | Q1:N → Q3:Y → Q6:N → Q9:Y    | Human Exceptionalism          | Named      |  
  | Q1:N → Q3:Y → Q6:N → Q9:N    | Inescapable Relevance Problem | Named      |  
  | Q1:N → Q3:N → Q8:Y           | Embodied Dissolution          | Named      |  
  | Q1:N → Q3:N → Q8:N           | Hybrid Challenge              | Unnamed    |  

  ---

  ### Notes on Unbranched Pairs and Unoccupied Nodes  
  - **Q5:No** (Representation confusion without dissolution): *Unoccupied. Diagnosis: Incoherent—if representation is conceptually flawed, the problem dissolves.*  
  - **Q8:Y vs. Representational Dissolution**: *Why not merged?* Embodied Dissolution rejects representation *entirely*; Representational Dissolution targets flaws in *how* persistence is modeled.  
  - **Human Exceptionalism vs. Inescapable Relevance Problem**: *Hard to separate* without invoking dualism. Both agree relevance is AI-unsolvable but split on whether humans escape it.  
  - **Hybrid Challenge (Q8:N)**: *Unnamed and rare*. Diagnosis: Unattractive—combines the challenges of representation, relevance, *and* embodiment without clear advantages.  

  ### Diagnostic Cases Embedded  
  - **Q1/Q2**: "Waiting" action (persistence without exhaustive listing).  
  - **Q3/Q6/Q9**: Table-clearing robot (ignoring wall color).  
  - **Q6/Q9**: System drawing cheap but irrelevant inferences (relevance selection).  

  This tree isolates commitments along the axes: representation/relevance/situated (Q1/Q3/Q8), tractability/engineering/conceptual (Q2/Q6/Q5/Q8), and AI-specific/general (Q4/Q7/Q9). Pitched for zero prior knowledge.
