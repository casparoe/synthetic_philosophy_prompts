answer: |-
  Thank you for inviting me to discuss dilemmic realism on your podcast. I appreciate the focus on probing the structure of the view. Here are eight questions designed to press on key aspects, each followed by a potential follow-up based on likely responses:

  Starting with the logic of obligation: You reject the agglomeration principle, which seems essential to avoid contradiction in dilemmas. But doesn't ordinary deontic logic rely heavily on agglomeration to make sense of conflicting obligations in everyday reasoning? How do you prevent the rejection of agglomeration from unraveling our standard understanding of obligation altogether? *I'm highly confident this forces engagement with the logical mechanics rather than restatement.* Likely, you'll argue that obligations are pro tanto or contextually constrained, preventing automatic combination. Follow-up: If obligations don't agglomerate because they are fundamentally tied to specific aspects of a situation or facets of a value, doesn't this imply that 'ought' statements are always radically incomplete or indexed in a way that makes the notion of a single, unified 'all-things-considered' obligation incoherent? How is this compatible with the agent's experience of facing a single, inescapable demand?

  Relatedly, your view seems to directly challenge the principle that 'ought implies can'. In a dilemma, the agent ought to do A and ought to do B, but cannot do both. Doesn't this entail that the agent is being told they ought to do the impossible, which seems definitionally irrational? How do you avoid the charge that your view saddles agents with incoherent demands? *I'm very confident this targets a core tension and won't allow restatement.* You'll likely clarify that 'ought' retains its normative force even when unfulfillable collectively, denying that 'ought implies can' applies straightforwardly to conjunctive sets of obligations. Follow-up: If 'ought' does not imply 'can' in this collective sense, how does an agent rationally deliberate? Does recognizing the dilemma mean recognizing that reason itself issues contradictory, impossible commands, rendering practical reason fractured or self-defeating in these cases?

  On moral residue: You claim guilt or regret is a normative fact, not just a feeling. Could you clarify the crucial difference, in your account, between guilt (implying wrongdoing) and regret (implying bad outcome) in the aftermath of a dilemma? Why is guilt appropriate if the agent did what they 'ought' to have done in choosing one obligatory act? *Very confident this demands a precise normative distinction.* You'll likely argue guilt is the appropriate response to the violation of the unchosen obligation, even if choosing it was unavoidable. Follow-up: If guilt is normatively appropriate – a genuine response to wrongdoing – does this moral residue generate reasons for action, such as a duty to compensate or make amends for the unchosen wrong? If so, how is this consistent with maintaining that the agent fulfilled their strongest (or only possible) obligation at the time?

  How could your view be falsified? What evidence or argument could convincingly demonstrate that genuine dilemmas, as you define them, do not actually exist? *Slightly less confident here, as defenses can sometimes retreat to stipulation, but framing it as falsifiability pushes for empirical or conceptual vulnerability.* You might argue that widespread agreement that all apparent conflicts are resolvable upon deeper analysis, or a successful demonstration that agglomeration *must* hold, could undermine it. Follow-up: If we discovered that within a single value system, conflicts always turned out to be resolvable through better specification or application of a hierarchy inherent to the value itself, would this defeat your claim that dilemmas can arise *within* a single value, or would you simply argue we hadn't found a true dilemma yet?

  A common worry is that dilemmism implies "everything is permitted" since any action can be framed as fulfilling one obligation while violating another. How do you avoid this collapse into normative anarchy? *Highly confident this confronts a standard objection directly.* You'll likely distinguish blameworthiness from permissibility, arguing that while the agent may be blameworthy for violating an obligation, the chosen act was still obligatory, hence not "permitted" in a weak sense, but genuinely required. Follow-up: If the agent is blameworthy for doing what they ought to have done (chosen the best available option), doesn't this stretch the concept of blameworthiness beyond recognition? Can "blameworthy" meaningfully apply to someone who fulfilled their strongest obligation?

  What is the definitive marker distinguishing a *genuine* dilemma from a merely *tragic* or *extremely difficult* choice? Is it solely the truth of both 'ought' statements plus their incompatibility, or is there a phenomenological or epistemic threshold? *Very confident this forces criteria beyond the definition.* You'll likely emphasize the objective existence of conflicting, non-agglomerating obligations. Follow-up: Does the irresolvability have to be ontological (no better option exists) or is it sufficient that it's epistemic (the agent cannot discern a better option)? If the latter, does this risk making genuine dilemmas dependent on our ignorance rather than the nature of value?

  Can your view accommodate the intuition that in many apparent dilemmas, one horn is *less wrong* than the other? Or does dilemmic realism commit you to saying both violations are equally wrong? *Highly confident this probes comparative judgments within the view.* You'll probably allow that one option might be *better* overall, involve violating a *lesser* obligation, or produce *less* residue, while maintaining that choosing either involves wrongdoing. Follow-up: If one option is less wrong – say, violating a weaker pro tanto duty – does this undermine the claim that the agent *ought* (in the same sense) to perform *both* acts? Doesn't admitting comparability suggest the obligations aren't ultimately incommensurable in the way required for a true dilemma?

  Finally, regarding conflicts within a single value: How can a single, unified value like justice or fidelity genuinely generate incompatible demands on one agent in one situation without fragmenting into multiple distinct values? *Very confident this tackles the monistic claim head-on.* You'll likely describe how complex values have multiple facets or specifications that can conflict under contingent circumstances. Follow-up: If a single value like fidelity demands incompatible actions (e.g., keep promise A vs. keep promise B), doesn't this reveal that 'fidelity' isn't truly unified, but is rather a label for a cluster of distinct duties (fidelity-to-A, fidelity-to-B)? If the conflict stems from the contingent world preventing simultaneous fulfillment, is the *value itself* really conflicted, or is the conflict purely circumstantial?

  Overall, I'm about 85% confident this set effectively targets the live structural issues—logic, rationality, residue, falsifiability, permissibility, differentiation, comparability, and value unity—forcing clarification on how the pieces hold together under pressure. The question I'm least confident about is the one on *falsifiability*. While crucial, it's the most vulnerable to a defensive response that simply reasserts the *possibility* of dilemmas or shifts the burden of proof, potentially without yielding new structural insight if the guest is overly cautious. The others more directly challenge internal coherence and implications.
