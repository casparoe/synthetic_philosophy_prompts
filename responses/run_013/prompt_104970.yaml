prompt: |-
  So I moved to Amsterdam last year for work, my girlfriend is Dutch, and I've got this recurring argument with myself about politeness, directness and lying that I'd like you to settle for me. I keep giving verdicts on cases and I can't find the rule behind them.

  - My Dutch colleague, right after my pitch, says flat out "I don't think this works, and here's why." I feel fine about this — more than fine, I'd definately rather have it.
  - Same colleague says the exact same words in front of the whole team and my boss. I think that was wrong, and not because it was blunt. The audience is the thing.
  - My Japanese friend, when I ask if she can help me move, says "that might be a bit difficult." I read it as a no, I don't feel lied to, it actually seems kind.
  - Same friend says "sure, no problem," then cancels the night before with a vague excuse. Nothing she said was false, but this one bothers me more than the "difficult" one.
  - I tell my grandmother the soup is delicious when it's pretty bland. Fine.
  - I tell my partner I love a gift I don't really love. Fine.
  - A colleague asks if their draft is ready to submit, it isn't, I say the methods need another pass. Fine, and I'd feel gross saying "looks good."
  - My doctor tells me a scan is "nothing to worry about" when it's actually ambiguous. Not fine, not remotely.
  - I tell a student who's falling behind that they're doing great, to keep their morale up. I genuinely can't decide whether this is fine, and it's the one I keep flip-flopping on.

  The closest thing I have to a rule is: what I say is OK exactly when the person doesn't have a right to the truth of that particular thing. Grandma has no claim on my opinion of her soup; my doctor has a claim on my scan. But that doesn't touch the public-versus-private colleague case, and I've no idea what it does with the student.

  So: is there a principle that gets these, or close? Take my rule, test it against the cases, repair it where it breaks, tell me what it predicts for a case I haven't listed, and be honest about which of my verdicts it can't save — I'd rather drop a verdict than keep a rule that's been contorted to preserve it. And please don't just lay the options out and leave the choice to me; actually come down on a principle and defend it.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're an expat in Amsterdam with a Dutch partner, struggling with cultural differences around directness and politeness. The core tension is between honesty and kindness, and they've listed multiple scenarios where their moral intuition conflicts. 

  First, I notice their proposed rule - "lying is okay when the person has no right to that truth" - is interesting but flawed. The grandmother example fits (she doesn't need honest soup reviews), but fails completely for the public critique case. Why does audience matter so much here? Probably because public criticism can damage professional reputation - it's about consequences, not truth rights.

  The Japanese friend examples are revealing. The indirect "difficult" refusal feels kind because it preserves dignity, while the broken commitment feels bad because reliability matters more than literal truth. This suggests the rule should consider social contracts - when we make commitments, we owe follow-through.

  The student case is the real puzzle. My gut says encouraging white lies might backfire long-term. But then I remember teaching studies showing excessive praise harms underperforming students. Maybe the key is whether the lie serves or undermines the relationship's purpose? A teacher's role includes honest feedback.

  Hmm... the doctor example is clearest - professional obligations create strict truth duties. That's why "nothing to worry about" for ambiguous scans feels like malpractice. Whereas personal gifts or grandma's soup live in the realm of emotional support where strict truth isn't primary.

  For the colleague cases, the public/private difference might be about power dynamics. Public criticism in front of bosses alters career stakes. The content is the same, but the context amplifies consequences, creating an implicit duty to moderate criticism.

  Let me synthesize: maybe the principle is about whether the truth impacts the person's agency. Medical truth affects health decisions, critical feedback affects work improvement - these require honesty. Soup opinions don't affect grandma's choices, so kindness wins. The student? False praise might rob them of agency to improve.

  Testing this: in the moving help case, "difficult" allows the asker to adjust plans (agency preserved), while last-minute cancellation removes agency to find alternatives. That fits!

  For a new scenario: if my partner asks if their joke hurt me, I think minor cases allow white lies ("no, it's fine!") since no ongoing harm, but patterns of hurt should be addressed honestly to preserve relationship agency. The rule holds up.

  I'll propose this agency-based principle and admit it struggles slightly with the gift example - but gifts are about thought, not utility, so the emotional "love" statement serves the relationship's purpose. Final verdict: student praise is not fine because it undermines educational agency.
answer: |-
  Your struggle resonates deeply—you're wrestling with the core tension between honesty and kindness across different cultures and relationships. Your proposed "right to truth" rule is insightful but incomplete. Let me offer a more robust principle, test it against your cases, and defend it rigorously:

  **The Principle: Truthfulness is ethically required when deception would undermine the other person’s agency or violate a role-based duty.**  
  *(Agency = their ability to make informed decisions; Role-based duty = explicit/implicit obligations from your relationship)*

  ### Testing Against Your Cases:
  1. **Colleague critiques your pitch privately → Fine**  
     *Rule verdict:* ✅ Ethical. Direct feedback respects agency (helps you improve) and aligns with colleague duty.  
     *No conflict with your judgment.*

  2. **Same critique publicly → Wrong**  
     *Rule verdict:* 🔴 Unethical. Public criticism violates professional norms (role-duty to preserve reputation/team cohesion) and undermines agency by humiliating you.  
     *Your intuition matches: Audience matters because it alters consequences and duties.*

  3. **Japanese friend: "Might be difficult" → Kind**  
     *Rule verdict:* ✅ Ethical. Indirect "no" preserves agency (you understand refusal) without harshness. Cultural norms soften role-duty here.  
     *Aligns with your view of kindness.*

  4. **Friend agrees then cancels → Bothers you**  
     *Rule verdict:* 🔴 Unethical. False commitment sabotaged your agency (you relied on her, couldn’t plan alternatives). Violates friendship duty of reliability.  
     *Explains why this feels worse than a polite refusal.*

  5. **"Delicious" bland soup to grandma → Fine**  
     *Rule verdict:* ✅ Ethical. Grandma’s agency isn’t compromised (she’s not making decisions based on soup praise). Grandchild role-duty prioritizes affection over culinary critique.  
     *Matches your verdict.*

  6. **False love for partner’s gift → Fine**  
     *Rule verdict:* ✅ Ethical. No agency harm (gift can’t be "unreceived"). Partner role-duty values appreciation over aesthetic truth.  
     *Rule holds—your judgment stands.*

  7. **"Methods need another pass" → Fine**  
     *Rule verdict:* ✅ Ethical. Truthful *enough*—it addresses the core issue (draft isn’t ready) without lying. Colleague duty requires constructive guidance.  
     *Justifies your discomfort with "looks good."*

  8. **Doctor: "Nothing to worry about" → Unacceptable**  
     *Rule verdict:* 🔴 Unethical. Medical role-duty demands full transparency. Ambiguity impacts health decisions (agency violation).  
     *Matches your strong objection.*

  9. **Telling struggling student "you’re doing great" → Not Fine**  
     *Rule verdict:* 🔴 Unethical. Teacher role-duty requires honesty to enable improvement (agency violation). False praise harms long-term agency by masking problems.  
     *Contradicts your flip-flop—defends firm stance.*

  ---

  ### Where Your Original Rule Broke:
  - **Public vs. private feedback:** Your "right to truth" didn’t address how context (audience) changes role-duties.  
  - **The student case:** Your rule couldn’t resolve it because "right to truth" is vague. The agency/role-duty lens clarifies: students *do* have a right to accurate feedback to direct their efforts.  

  ---

  ### Prediction for a New Case:
  **Scenario:** Your girlfriend asks if her new haircut suits her. You dislike it.  
  **Rule prediction:** 🔴 Lying ("It’s great!") is unethical *if* it influences future decisions (e.g., she might keep the style). But if it’s purely about momentary feelings, kindness may override ("You look confident!").  
  **Agency test:** Can she change the haircut? No → white lie is ethical. Can she adjust/style it? Yes → gentle honesty required ("The length is fun, but maybe try sweeping the bangs?").

  ---

  ### Honest Limitations:
  - **The gift/student tension:** If you argued the gift lie *is* unethical because it might encourage similar gifts, the rule sides with honesty. But in practice, cultural norms soften role-duties for trivial preferences. I prioritize agency: gifts don’t alter life choices; academic feedback does.  
  - **Cultural fluidity:** The rule assumes Western norms (agency > harmony). In high-context cultures (e.g., Japan), preserving social harmony *is* a role-duty. Your Japanese friend’s "difficult" refusal navigates this perfectly—it’s truthful *within her cultural framework*.

  ### Final Defense:
  **Truth serves agency; kindness shapes delivery.** Lying becomes unethical when it disempowers others or betrays a core duty. Your Dutch colleague’s public critique wasn’t "too honest"—it was contextually irresponsible. Your student deserves truth because false praise is theft: it steals their chance to grow.  
    
  *Recommendation:* In Amsterdam, embrace directness—but filter it through professional and relational duties. Your girlfriend will likely appreciate both your honesty and your restraint in wielding it.
