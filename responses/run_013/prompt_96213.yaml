prompt: |-
  I'm 38 and halfway through IVF, and something I read has flipped me around: I now think that once you're already screening embryos, you're morally required to pick the one with the best expected life, not just the one without the disease — Savulescu's procreative beneficence — and I've pushed it further than he does. Two twists: the duty is comparative only among the embryos you've actually got (no duty to create the best possible child), and it isn't a duty to maximize wellbeing, it's a duty of non-arbitrariness — you have to choose on grounds you'd be willing to have the child find out about later, since the duty is owed to the child. I'm not making this up in a seminar; my clinic has started offering polygenic scores for stuff like height and how long you'll stay in school, and I've been sitting in that waiting room alot.

  In two weeks I defend this at my clinic's ethics committee, and it's not a philosophy crowd: a Catholic moral theologian, two reproductive endocrinologists who think entirely in terms of clinical risk and later regret, a disability rights lawyer who's a social-model person and hears "best life" as an insult, and one Kantian who'll go straight for treating the child as a means. Write me a Q&A prep sheet: the objections I'll actually get from each of them, in their own vocabulary, ordered by how much damage they do to my position, each with a two-minute reply and one line on where the reply is soft; what I should concede up front to keep the room; and the one question I'm praying nobody asks. Start with the single objection most likely to sink the whole thing, then the rest in order, no preamble.
reasoning: |-
  Okay, the user is 38 and in the middle of IVF. They've encountered Savulescu's idea of procreative beneficence but have added their own twists. They now believe that when selecting embryos, parents should pick the one with the best expected life, not just avoid disease. Their key modifications are: it's only comparative among existing embryos, not about creating the best possible child; and it's about non-arbitrariness—choosing based on reasons they'd be comfortable with the child knowing later. The clinic offers polygenic scores for traits like height and education duration, making this very real for them.

  In two weeks, they're presenting this to their clinic's ethics committee. The committee includes a Catholic moral theologian, two reproductive endocrinologists focused on clinical risk and regret, a disability rights lawyer who uses the social model and might see "best life" as offensive, and a Kantian ethicist. They need a Q&A prep sheet: objections from each member, ordered by potential damage to their position, with two-minute replies, noting where the replies are weak, concessions to make upfront, and the one question they hope isn't asked. They want to start with the most damaging objection.

  First, I need to understand their position deeply. The core is that once screening is done, parents have a moral duty to choose the embryo with the best expected life, based on non-arbitrary reasons that can be justified to the child later. This is tied to owing a duty to the child. The twists are critical: only comparing existing embryos, and the rationale is about avoiding arbitrariness rather than pure optimization.

  Now, assessing the committee members. The Kantian will likely argue about treating the child as a means, which could be the most damaging because it attacks the moral foundation directly. The disability rights lawyer might see this as ableist, equating "best life" with non-disability, which is a strong emotional objection. The Catholic theologian could object on grounds of playing God or interfering with natural procreation. The endocrinologists might focus on practical risks like false promises from polygenic scores or patient regret. Each objection needs tailored responses.

  For the Kantian objection: If the user is selecting based on traits, it might reduce the child to a means (e.g., "we chose you for your height/iq"). The reply should emphasize that the duty is to the child's future autonomy and avoiding arbitrary harm, framing it as respecting the child by ensuring choices aren't whimsical. The soft spot is that any selection could be seen as instrumentalizing, which is hard to fully counter.

  The disability rights lawyer might argue that "best life" implies lives with disabilities are inferior, reinforcing discrimination. Responding by clarifying that the duty is comparative among specific embryos and based on broad wellbeing, not devaluing disability. Concede that social factors are crucial, but the choice is about minimizing preventable suffering. The soft spot is that polygenic scores might still carry eugenic undertones.

  Catholic theologian might see embryo selection as usurping God's role. The reply could focus on using technology responsibly to aid nature, similar to medical interventions. Soft spot: the Catholic view often opposes IVF itself, so this might not sway them.

  Endocrinologists worry about clinical risks: polygenic scores aren't reliable, leading to false expectations. Reply by agreeing on limitations but arguing that more information, used cautiously, can still aid non-arbitrary choice. Soft spot: if scores are probabilistic, they might not translate to real-life outcomes.

  Ordering objections by damage: Kantian first (moral foundation), then disability lawyer (social implications), Catholic (theological), endocrinologists (practical). The question they fear most might be about defining "best expected life" quantitatively, as that's inherently subjective and could unravel their position.

  Concessions upfront: acknowledge embryo screening's gravity, that polygenic scores are imperfect, and that social justice issues matter. This builds rapport and shows humility.

  Need to ensure responses are in each member's vocabulary: clinical terms for doctors, social model for lawyer, philosophical for Kantian, theological terms for Catholic. Keep replies concise—two minutes max per objection.
answer: |-
  Here's your Q&A prep sheet, ordered by objection severity with targeted replies, concessions, and the nightmare question. Focus on damage control: your position is philosophically novel in a non-philosophical room. Prioritize clarity over winning every point.

  ### **Key Concession to Open With (Builds Goodwill)**
  *   "I concede upfront: embryo selection is gravely serious. Polygenic scores are probabilistic, not deterministic. Social factors profoundly shape opportunity, and disability rights critiques expose real harms in how we frame 'normalcy'."

  ---

  ### **The Objections & Replies**

  1.  **The Kantian Ethicist: "You're treating the future child as a means, not an end. By selecting *for* specific traits (height, IQ proxies), you instrumentalize them. Their existence is conditional on meeting your 'best life' criteria."**
      *   **Why it's most damaging:** Strikes at the core moral justification. If your duty *to the child* is seen as fundamentally treating them as an object to optimize, your entire premise collapses for this committee.
      *   **Reply (2 min):** "The duty *is* to the child as an end. It arises precisely *because* we are bringing a specific person into existence. 'Non-arbitrariness' protects their future autonomy. Choosing randomly, or based on trivial grounds (like preferring Tuesdays), is a failure to take *their* future seriously. We owe it to *this child* to avoid choices that could cause them preventable hardship for reasons they couldn't possibly endorse. Selecting 'best expected life' among *existing* options, based on defensible reasons related to wellbeing, is an act of respect for *that individual's* life journey. It's the opposite of instrumentalization; it centers their potential experience."
      *   **Where it's soft:** Distinguishing "respectful selection based on wellbeing" from "instrumentalization" is razor-thin. The Kantian may see *any* deliberate trait selection as instrumental.

  2.  **Disability Rights Lawyer: "'Best expected life' is inherently ableist. It assumes disability = worse life. This reinforces harmful social prejudices, devalues existing disabled lives, and directly contradicts the social model (disability is caused by barriers, not impairment). Offering scores for height/education is pure eugenics."**
      *   **Why damaging:** Emotionally potent, ties your view to historical atrocities, challenges your core metric ("expected life"), and resonates with clinicians wary of controversy.
      *   **Reply (2 min):** "The duty is comparative among *these specific embryos*, not an absolute judgment. 'Best expected life' includes navigating a world with *current* barriers. If one embryo has a high genetic probability of a condition causing significant chronic pain *even with optimal support*, and another doesn't, choosing the latter avoids imposing that *specific, preventable burden* on *that child*. It's not about devaluing disabled lives; it's about minimizing *this specific child's* avoidable suffering within the world as it exists. Polygenic scores for non-health traits like height are far more ethically fraught; my framework *rejects* using them unless directly linked to significant wellbeing impacts (e.g., extreme shortness linked to major social/medical hardship)."
      *   **Where it's soft:** Defining "significant burden" and "even with optimal support" is subjective. The lawyer will argue *any* genetic deselection reinforces the harmful societal belief that disabled lives are less worth living.

  3.  **Catholic Moral Theologian: "This usurps God's role in creation and the inherent dignity of every human life from conception. Screening for disease is a limited therapeutic act. Selecting 'the best' embryo reduces life to a commodity and rejects the gift of each unique soul, especially those who may face challenges."**
      *   **Why damaging:** Challenges the fundamental permissibility of the *level* of selection, not just your criteria. Resonates with deep-seated beliefs about human dignity and natural law.
      *   **Reply (2 min):** "I respect the sanctity of life. The duty isn't about creating 'perfect' life or rejecting imperfection. It's about responsible stewardship *within* the technology we are already using (IVF/PGT). Given we *are* choosing which embryo to implant, isn't choosing arbitrarily more disrespectful than choosing thoughtfully based on the child's potential flourishing? We use medical knowledge responsibly in all other areas (prenatal care, nutrition) to promote wellbeing; this is an extension of that care, applied at the earliest stage *only* because the technology makes it possible. It affirms the dignity of *this specific child* by seeking the path with the least avoidable hardship *for them*."
      *   **Where it's soft:** Catholic doctrine often opposes IVF itself. The theologian may see *any* embryo selection beyond severe lethality as illicit, making your argument irrelevant within their framework.

  4.  **Reproductive Endocrinologist 1 (Risk Focus): "Polygenic scores are probabilistic and noisy, especially for complex traits like educational attainment. Basing choices on them sets parents up for false expectations, guilt, and profound regret when outcomes don't match. The clinical risk is significant emotional harm."**
      *   **Why damaging:** Practical, clinical, relatable. Undermines the *tool* you rely on for your duty. Plays on clinicians' primary concern: patient welfare and avoiding harm/litigation.
      *   **Reply (2 min):** "I completely agree. Polygenic scores are imperfect predictors, not crystal balls. My 'non-arbitrariness' principle *guards against* this risk. It demands the reasons for choice be justifiable *to the child later*. Choosing solely because 'Embryo A had a 0.2 higher polygenic score for IQ' fails this test spectacularly – it's arbitrary *and* misunderstands the data. The duty requires using the *best available evidence* cautiously, focusing on *significant* wellbeing factors with stronger genetic links (e.g., major depression risk, severe morbidity risks) where probabilities are clearer, and *always* emphasizing environment's massive role. It forces a deeper, more ethical conversation than just 'is it diseased?'."
      *   **Where it's soft:** Defining what constitutes "significant wellbeing factors with stronger genetic links" is messy. Clinicians worry any score use creates unrealistic expectations.

  5.  **Reproductive Endocrinologist 2 (Regret Focus): "This adds enormous pressure and potential for later blame ('Why didn't you pick the smarter one?'). The 'duty' language burdens parents. Choosing for 'best life' guarantees regret if the child struggles; choosing randomly or just for health absolves parents of that responsibility."**
      *   **Why less damaging:** Focuses on psychological consequences rather than core ethics. Easier to address with process and counseling emphasis.
      *   **Reply (2 min):** "The goal is to *reduce* arbitrary regret, not create new burdens. Transparency is key. The 'non-arbitrariness' principle *requires* that choices be made on grounds parents can stand by and explain. This fosters acceptance. Random choice *invites* future doubt ('What if we picked the wrong one?'). Choosing solely for absence of disease ignores known, significant differences in potential hardship. Good genetic counseling is essential – not just presenting scores, but exploring meaning, limitations, and parental values. The 'duty' is moral, not legal; it guides thoughtful decision-making, not blame. Responsible implementation minimizes regret."
      *   **Where it's soft:** Doesn't eliminate the *feeling* of responsibility/blame parents might have if a chosen trait doesn't pan out or a non-chosen trait becomes highly valued.

  ---

  ### **The Question You Pray Nobody Asks**
  *   **"Define 'best expected life' quantitatively. Show me the validated algorithm that weights IQ-proxy, height, mental health risk, disease risk, and longevity into a single score that objectively determines which embryo has the 'best' life, and prove it's not just your subjective preference masked as ethics."**
      *   **Why it's the nightmare:** Your entire position hinges on this comparative judgment being non-arbitrary and grounded in "expected life." Quantifying it is impossible. Any specific weighting is inherently subjective, undermining the "non-arbitrary" claim. It exposes the tension between your anti-maximization stance and the practical need for *some* comparison metric. It forces you into the weeds of contested wellbeing theories you explicitly tried to avoid. There is no good answer that doesn't sound either vague ("holistic assessment") or like hidden utilitarianism.

  **Final Prep Tip:** Frame your "non-arbitrariness" principle **HARD**. It's your shield against the Kantian (respect), the Lawyer (capricious eugenics), the Doctors (reckless use of imperfect data), and even the Theologian (arbitrary choice vs. reasoned stewardship). Emphasize: "It's not about creating the best *possible* child, it's about making the least arbitrary, most justifiable choice *for this specific child* from the options we *have*." Good luck.
