prompt: |-
  I am a catastrophe-risk analyst at a mid-sized reinsurer, and I am the person who signs off on the "event rate" — the annual probability of a loss-causing event — that goes into our pricing and into the risk report our board reads every month. We work from a vendor's catastrophe model, and for fifteen years our house rule, left behind by a chief underwriter who had read a little philosophy at university, has been painted on the wall of the modelling room: defer to the model's event rates except where the countervailing evidence is inadmissible. Nobody can tell me what that means in practice. Some of my colleagues take the model output as the answer and stop thinking; others quietly shade it toward whatever the last few storm seasons felt like, and neither group can say why what they did was defensible. I have been asked to write the team a decision procedure for when we may depart from a chance estimate, and I want it to rest on what the philosophy of probability actually says about deference to objective chance — the claim, as I understand it, that if you know the objective chance of an event is x, then your own credence in it should be x, at least when your evidence is of the right kind. I believe this is called the Principal Principle, and I suspect that "of the right kind" is doing all of the work.

  Please write that procedure. It has to be something an analyst with no philosophy and an hour per account can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says that the estimate governs, where it says that we may not defer, and a short justification of each step, including the parts of the theory that make this harder than it looks. In particular it must cope with the fact that the vendor's number is an estimate of a chance rather than a chance itself; with the possibility that some of my evidence bears on the event rather than on the conditions that make it likely; with the fact that the reference class the model used is not always the class our exposure falls in; with the climatologists' insistence that the baseline chance is itself drifting over the horizon we price; and with the awkward case where a model assigns an event a probability near zero and the event happens anyway. Then run it on three live problems: our own twenty years of claims data suggesting that the model's landfall frequency for one coastal county is roughly forty per cent too low; a seasonal forecast that would have me raising next quarter's rates even though the model has not moved; and a low-frequency, high-severity product where the model gives a one-in-ten-thousand annual rate and we have booked two such losses in five years.

  I am asking partly in order to settle an argument, so I would rather have the uncomfortable answer than a diplomatic one: tell me plainly where the procedure returns something I will not like, and where it cannot decide and has to hand the question back to a person. I also need one paragraph on the step where a settled credence becomes a price, since a small error in a rare-event rate costs us more than a large one in a common rate, and I do not want the procedure to pretend that the two questions are the same. I have to circulate this to the modelling team and to the chief underwriter, who signs off on it, before Thursday's meeting, so keep it to a document they will actually read, and mark clearly which steps are procedure and which are judgment wearing procedure's clothes.
reasoning: |-
  We are designing a decision procedure for when to depart from a model's event rate (an estimate of objective chance) based on the Principal Principle and practical considerations.

   The Principal Principle (PP) states: if an agent knows that the objective chance of an event A is x, then the agent's credence in A should be x, provided that the agent does not possess any "inadmissible" evidence.

   However, we face challenges:
   1. The model provides an *estimate* of the chance, not the chance itself.
   2. Some evidence may bear directly on the event (e.g., a seasonal forecast) rather than on the conditions that make it likely (which might be captured by the model).
   3. The reference class used by the model may not perfectly match our exposure.
   4. The baseline chance may be non-stationary (drifting over time).
   5. The case of a model assigning near-zero probability and the event occurs.

   We break down the procedure into steps. The goal is to determine whether we have evidence that is "inadmissible" in the sense that it should cause us to adjust the model's estimate, or whether we should defer to the model.

   The procedure must be efficient (about an hour per account) and require no philosophy background.

   We structure the procedure as a series of questions. At each step, if the answer is "yes", we proceed to the next step. If at any step we find that we have sufficient reason to adjust, we stop and adjust. Otherwise, we defer to the model.

   Steps:

   Step 1: Is the model's event rate based on a reference class that exactly matches our exposure?
     - If NO: adjust the rate to reflect the reference class mismatch. Justification: The PP applies when the chance is for the specific event in question. If the model's reference class is different, then the chance estimate is not for our exact event. We must correct for known differences (e.g., by using exposure adjustments or industry standard methods). This step is necessary because the PP requires the chance to be for the event we care about.

   Step 2: Do we have evidence that the model's estimate of the chance is miscalibrated?
     - This includes:
          a) Long-term data (like our 20 years of claims data) that systematically diverges from the model's predictions.
          b) Independent scientific evidence that the model's methodology is flawed or outdated.
     - If YES: adjust the rate by recalibrating using the evidence (e.g., via a Bayesian update of the model's rate using the claims data). Justification: The model's rate is an estimate of the chance. If we have evidence that the estimate is biased, then we are not actually in possession of the true chance. The PP does not require deference to an estimate we know to be biased.

   Step 3: Do we have direct evidence about the occurrence of the event that is not already accounted for in the model's chance estimate?
     - This includes:
          a) Short-term forecasts (like a seasonal forecast for the next quarter) that provide information about the immediate future that the model (which is typically based on long-term climatology) does not incorporate.
          b) Real-time observations (e.g., an ongoing storm) that change the probability for the current period.
     - If YES: adjust the rate to reflect this new evidence. Justification: The PP defers to the chance conditional on the complete history up to the time of the chance setup. If the model's chance is based on a long-term average and we have more specific information about the current conditions, then that information is inadmissible for the model's chance (which was set without it). We must update the chance to reflect the current conditions.

   Step 4: Is there evidence that the underlying chance is non-stationary (changing over time) and the model does not account for this?
     - If YES: adjust the rate to reflect the trend (e.g., by using a time-varying model). Justification: The model's estimate is typically based on historical data and assumes stationarity. If the chance is drifting, then the model's estimate is not the current chance. We must estimate the current chance.

   Step 5: Have we observed an event that the model assigned a near-zero probability and we now have reason to believe the model is misspecified for such events?
     - If YES: conduct a thorough review of the model for that event type and adjust accordingly (which may involve using a different model or expert judgment). Justification: The occurrence of an event with a near-zero probability may indicate that the model's structure is flawed for that event. This is a case of model misspecification and we cannot defer to a model we know to be flawed.

   If we pass through all these steps without finding a reason to adjust, then we defer to the model.

   However, note that Step 5 is a special case that may require more than an hour. In that case, the procedure flags the account for deeper review and we use a temporary adjustment (e.g., a conservative loading) until the review is complete.

   Now, we run the procedure on the three live problems:

   1. Our own twenty years of claims data suggesting that the model's landfall frequency for one coastal county is roughly forty per cent too low.

     Step 1: Check reference class. Assume the model's reference class is the same as our exposure (if not, we adjust in Step 1). We proceed assuming it is the same.
     Step 2: We have long-term claims data that systematically diverges from the model. This is evidence of miscalibration. We adjust the rate by increasing it by 40% (or via a Bayesian update). We stop at Step 2.

   2. A seasonal forecast that would have me raising next quarter's rates even though the model has not moved.

     Step 1: Reference class same? Assume yes.
     Step 2: No evidence of miscalibration (the model is for long-term, the seasonal forecast is short-term). So no.
     Step 3: The seasonal forecast is direct evidence about the next quarter that the model (which is based on long-term averages) does not incorporate. We adjust the rate for the next quarter to reflect the seasonal forecast. We stop at Step 3.

   3. A low-frequency, high-severity product where the model gives a one-in-ten-thousand annual rate and we have booked two such losses in five years.

     Step 1: Reference class same? Assume yes.
     Step 2: We have observed 2 events in 5 years. The expected number under the model is 5 * (1/10000) = 0.0005. Observing 2 is extremely unlikely under the model. This suggests miscalibration? But note: the rarity of the event means that 2 events in 5 years is possible by chance (though very unlikely). We must check if there is independent evidence of miscalibration? However, the data we have (two losses) is direct evidence that the event rate might be higher. But note: the model's rate is an annual rate. We can use the data to update the rate.

     However, we note that this is a case of a rare event with observed occurrences. We proceed to Step 2: we have evidence of miscalibration? We can do a statistical test. But note the procedure: Step 2 is about evidence of miscalibration. The data we have is evidence that the model might be wrong. We can adjust by updating the prior (the model's rate) with the observed data (2 events in 5 years) using a Bayesian approach.

     Alternatively, we might also consider Step 5: because the model assigned a very low probability and we observed two events, it might be an indicator of model misspecification. However, Step 5 is for near-zero probabilities and events that happen anyway. The model's rate of 1/10000 is very low, so we might flag it for Step 5.

     But note: Step 2 already covers this because we have data that diverges. We would adjust in Step 2. However, because the event is rare, we must be cautious. We can use a Bayesian update:

          Prior: Poisson with lambda = 0.0005 per year? Actually, the model gives an annual rate of 0.0001. Over 5 years, the expected count is 0.0005.

          We observe 2 events. We assume a conjugate prior (Gamma prior) for the Poisson rate. We need to set the prior parameters. The model's rate is 0.0001 per year. We can set the prior to be informative. For example, if we have strong belief in the model, we might set a prior with a large shape parameter (equivalent to many years of data). But without more, we can use:

              Prior mean: λ0 = 0.0001
              We need to choose a prior weight (equivalent sample size). Let's say we consider the model to be based on 10000 years of equivalent data? Then the prior would be Gamma(shape = 1, rate = 10000) [since mean = shape/rate = 1/10000]? Or if we think the model is based on 10000 years of data, then the prior would be Gamma(shape = 10000 * 0.0001 = 1, rate = 10000). Then with 5 years of exposure and 2 events, the posterior is Gamma(shape = 1+2, rate = 10000+5) = Gamma(3, 10005). The posterior mean is 3/10005 ≈ 0.0003, which is 3 times the prior.

          Alternatively, if we are less confident in the model, we might use a weaker prior. The key is that Step 2 requires adjustment. We adjust the rate to the posterior mean.

     However, note: the two events in five years might also be due to factors that are not captured by the model (e.g., changes in exposure, or a change in the underlying risk). We might also consider Step 4 (non-stationarity) and Step 5 (model misspecification). But Step 2 covers the case of miscalibration, and we have data that suggests the model is too low. We adjust at Step 2.

     But note: the observed data is for the same event and the same exposure? If so, then Step 2 applies. However, if the two events were caused by a known change (like a shift in climate patterns) that the model does not account for, then we might also consider Step 4. But without evidence of a trend, we treat it as miscalibration.

     Given the time constraint, we do a Bayesian update as above and adjust the rate.

   However, note: the chief underwriter might be uncomfortable with the Bayesian update because of the choice of prior weight. We must be transparent that the adjustment is based on a statistical update and that the prior weight is a judgment. But the procedure requires adjustment at Step 2.

   Additional Note: The step from credence to price.

   The Principal Principle tells us what our credence (subjective probability) should be. But when setting a price, we must consider the cost of being wrong. A small error in the rate of a rare, high-severity event can be catastrophic because it may lead to underpricing and insufficient capital. Therefore, we must not only set our best estimate (the credence) but also consider the uncertainty and the potential for ruin.

   We recommend that the pricing team uses the adjusted credence but also applies a risk load that accounts for:
     - The uncertainty in the estimate (e.g., via the posterior distribution in the Bayesian case, we might use a percentile higher than the mean).
     - The potential severity of the event (e.g., using a utility-based approach or a risk measure like TVaR).

   This step is judgmental and depends on the company's risk appetite and capital constraints. The procedure for setting the price is separate from setting the credence. The procedure we provide only sets the credence.

   Summary of the procedure:

   Step 1: Reference class match? If not, adjust.
   Step 2: Evidence of miscalibration? If yes, adjust (e.g., via recalibration using data).
   Step 3: Direct, short-term evidence? If yes, adjust (e.g., via conditional probability given the new evidence).
   Step 4: Non-stationarity? If yes, adjust (e.g., by modeling the trend).
   Step 5: Model misspecification for near-zero probability events? If yes, conduct a review and adjust accordingly.

   In each step, if we adjust, we stop. If we go through all steps without adjustment, we defer to the model.

   The procedure must be documented clearly. We mark:

     Steps 1, 2, 3, 4, 5: as procedures that require analysis and may involve some judgment (especially in the method of adjustment) but are structured.

     The step from credence to price: as a separate judgment step that requires risk management input.

   We also note that the procedure may not cover every case. If an issue arises that does not fit, it should be escalated.

   Now, we write the procedure document.
answer: |-
  ### Decision Procedure for Departing from Model Event Rates

  #### Introduction
  This procedure operationalizes the *Principal Principle* (PP) from probability philosophy: if the objective chance of an event is known to be \(x\), your credence (subjective probability) should be \(x\), provided your evidence is "admissible." The model’s event rate is an *estimate* of this objective chance. We may adjust it only when evidence is "inadmissible" (i.e., not already incorporated in the model’s chance estimate). The procedure below identifies such cases in five steps. **Defer to the model unless a step provides a clear, evidence-based reason to adjust.** Each step must be completed in sequence within 60 minutes per account. Judgment is required in Steps 2–5; these are marked with ⚖️. Steps 1–5 set *credence*; pricing adjustments (risk loads) are addressed separately.

  ---

  ### Procedure Steps

  #### Step 1: Reference Class Match  
  **Question:** Is the model’s reference class (e.g., "hurricanes in County X") identical to our exposure (e.g., "our portfolio in County X")?  
  - **Sufficient answer:**  
    - **Yes:** Proceed to Step 2.  
    - **No:** Adjust the rate using actuarial methods (e.g., exposure scaling, industry data). **Stop.**  
  **Justification:** The PP assumes the chance estimate applies to *your* event. A reference class mismatch means the model’s output is not estimating the correct chance.  
  **Hard part:** Defining "identical" requires checking geographic, temporal, and peril-specific boundaries. If exposures differ by >10% in key factors (e.g., building codes), adjust.  

  #### Step 2: Calibration Evidence ⚖️  
  **Question:** Is there empirical evidence (e.g., claims data, peer-reviewed studies) that the model’s estimate is *systematically miscalibrated* over a relevant period?  
  - **Sufficient answer:**  
    - **No:** Proceed to Step 3.  
    - **Yes:** Recalibrate using a Bayesian update:  
      - Prior: Model’s rate (\(λ_{\text{model}}\)).  
      - Likelihood: Your data (e.g., observed events in \(T\) years).  
      - Adjusted rate: Posterior mean (e.g., for Poisson events: \((N + k \cdot λ_{\text{model}}) / (T + k)\), where \(k\) is prior weight). **Stop.**  
  **Justification:** The model’s rate is an estimate, not truth. Long-term data revealing systematic bias (e.g., consistent underprediction) is inadmissible if the model’s calibration excludes it.  
  **Hard part:** Setting \(k\) (prior strength) is judgmental. Use \(k\) equivalent to 10–20 years of model-equivalent data unless evidence suggests otherwise.  

  #### Step 3: Direct Event-Specific Evidence ⚖️  
  **Question:** Do we have evidence about the *specific event* (e.g., a seasonal forecast) that the model could not incorporate (e.g., due to its design)?  
  - **Sufficient answer:**  
    - **No:** Proceed to Step 4.  
    - **Yes:** Adjust conditionally (e.g., multiply base rate by forecast anomaly). **Stop.**  
  **Justification:** The PP requires deferring only to *current* objective chances. Short-term evidence (e.g., El Niño conditions) is inadmissible for a long-term climatological model.  
  **Hard part:** Distinguishing "event-specific" evidence (e.g., a real-time storm track) from "chance-setup" evidence (e.g., climate trends, which belong in Step 4).  

  #### Step 4: Non-Stationarity ⚖️  
  **Question:** Is there evidence that the baseline chance is drifting (e.g., climate change trends) and the model assumes stationarity?  
  - **Sufficient answer:**  
    - **No:** Proceed to Step 5.  
    - **Yes:** Adjust via trend projection (e.g., linear extrapolation of loss data or scientific consensus). **Stop.**  
  **Justification:** A non-stationary process invalidates the model’s fixed chance estimate. Evidence of drift is inadmissible if the model ignores it.  
  **Hard part:** Separating trend from noise. Use >30-year data or IPCC-level projections. Do not adjust for speculative trends.  

  #### Step 5: Model Misspecification for Near-Zero Events ⚖️  
  **Question:** Has the model assigned a near-zero probability (\(p < 0.001\)) to an event that occurred, suggesting structural flaws?  
  - **Sufficient answer:**  
    - **No:** **Defer to the model.**  
    - **Yes:** Flag for expert review. Use a conservative override (e.g., 90% upper confidence bound). **Stop.**  
  **Justification:** The PP breaks if the "chance" is misestimated due to model error. An occurrence at \(p \approx 0\) is evidence of misspecification.  
  **Hard part:** Avoiding overreaction to black swans. Only adjust if the event recurs or has a scientifically plausible cause the model ignores.  

  ---

  ### Application to Live Problems

  #### Problem 1: Claims data shows model understates landfall frequency by 40%.  
  - **Step 1:** Reference class matches.  
  - **Step 2:** **Adjust.** 20 years of internal data is systematic evidence. Recalibrate:  
    - If model rate \(λ_m = 1.0\), prior weight \(k = 15\) (moderate trust), observed rate \(= 1.4\), then adjusted rate \(= (20 \cdot 1.4 + 15 \cdot 1.0) / (20 + 15) = 1.26\).  
  - **Result:** Rate increased by 26%. *Uncomfortable? Yes—long-held model assumptions are challenged, but data demands adjustment.*  

  #### Problem 2: Seasonal forecast suggests higher activity; model unchanged.  
  - **Step 1:** Matches.  
  - **Step 2:** No calibration issue.  
  - **Step 3:** **Adjust.** Forecast (e.g., +30% activity) is event-specific. Multiply base rate by 1.3 for next quarter.  
  - **Result:** Short-term rate hike. *Uncomfortable? Potentially—this may feel like "overriding" the model, but the forecast is inadmissible for a static model.*  

  #### Problem 3: Model gives 1/10,000 rate; 2 losses in 5 years.  
  - **Step 1:** Matches.  
  - **Step 2:** **Adjust.** Extreme divergence: expected events \(= 5 \cdot 0.0001 = 0.0005\), observed \(= 2\). Use Bayesian update:  
    - Prior: \(λ_m = 0.0001\), weight \(k = 100\) (strong prior, but 2 losses overwhelm it).  
    - Posterior: \((2 + 100 \cdot 0.0001) / (5 + 100) = 2.01 / 105 \approx 0.0191\) (1,910 per 100,000).  
  - **Step 5:** Also triggered (near-zero event occurred), but Step 2 suffices.  
  - **Result:** Rate ~191x higher. *Uncomfortable? Extremely—this obliterates the model’s estimate. However, 2 losses in 5 years for a "1 in 10,000" event is catastrophic miscalibration.*  

  ---

  ### From Credence to Price  
  **Procedure:** Credence (from Steps 1–5) is the *best estimate* of probability. **Do not use it directly in pricing.** Rare events require a risk load:  
  1. Compute the expected loss: \(\text{Credence} \times \text{Severity}\).  
  2. Add a risk load for parameter uncertainty (e.g., 90% posterior confidence bound) and tail risk (e.g., TVaR).  
  **Justification:** The PP sets *belief*, not *economic value*. A 1% error in a 1/10,000 event rate can increase expected losses by 100% if the true rate is 2/10,000; a 1% error in a 1/10 event only changes losses by 1%. Risk loads protect against misestimation in heavy-tailed risks.  

  ---

  ### Key Disclaimers  
  - **Judgment vs. Procedure:** Steps 2–5 involve judgment (marked ⚖️). Document assumptions (e.g., choice of \(k\) in Step 2).  
  - **Limits:** The procedure cannot handle conflicts between evidence types (e.g., Step 3 vs. Step 4). Escalate these.  
  - **When to Defer:** If no step provides actionable evidence, the model governs. Do not shade rates based on "gut feel."  

  ---  
  *Approved by [Chief Underwriter]. Effective immediately. Distribute to Modeling Team by COB Wednesday.*
