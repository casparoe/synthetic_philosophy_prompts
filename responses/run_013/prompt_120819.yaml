prompt: |-
  I write fiction, and my characters spend an implausible amount of their time not wanting to know things, which has driven me to defend in conversation a proposition I am not certain I can defend on paper. The proposition is this: no agent who maximises expected utility and updates by conditionalisation can be made worse off, in expectation, by receiving free information. She may be saddened by what she learns, but the learning itself cannot hurt her, because whatever she is told she remains free to act exactly as she would have acted in ignorance. I am told this is a settled result, usually filed under Good's name, and that everything hangs on that last clause. I should like it tested rather than restated.

  Assume the thesis is mine and that I believe it. Tell me what would count against it — formal results, counterexamples, the intuitions of people who refuse to look, and the possibility that the thesis, once properly hedged, was only ever about a special case. I want to know which assumption is carrying the weight: that the set of available acts is the same before and after learning; that the utility function is unchanged; that the possibility space was fixed in advance, so that what I learn was already among the things I had assigned a probability to; that I will in fact conditionalise; that the information is genuinely free; that I am an expected-utility maximiser at all. For each, say what has to be given up, whether giving it up is plausible, and what survives the loss.

  I also want to know whether the result is, as I suspect, close to a consequence of the probability calculus — a maximum taken after averaging cannot fall below an average taken before it — and if so, whether that emptiness is a defect in a claim of this kind or simply what such a claim is. And whether the clause about being free to ignore what one has learnt is doing all the work, given that in my experience nobody can ignore what they have learnt. I am told that certain ambiguity-averse or otherwise non-expected-utility preferences can reverse the result; tell me whether that is a genuine counterexample to the thesis or a change of subject, and whether the same reversal can be had without abandoning expected utility.

  Finally, tell me what the thesis predicts that a rival view does not. If nothing, say so plainly, and tell me whether a position that risks nothing is thereby worthless or merely a theorem. The case that would most move me is one in which the agent is a full expected-utility maximiser, updates impeccably, pays nothing for the information and is still worse off in expectation; if no such case can exist, I should like to be shown why, not merely told it. Rank the defeaters from fatal to merely awkward, mark which ones a defender of the thesis would concede and which he would dismiss as irrelevant, and if the honest verdict is that the thesis is true, well insulated and almost empty, I would rather have that than encouragement.
reasoning: |-
  We are to test the proposition that no agent who maximizes expected utility and updates by conditionalization can be made worse off, in expectation, by receiving free information. The key idea is that the agent can always choose to ignore the information and act as they would have without it, so the expected utility after receiving information (but before learning the specific content) should be at least as high as before.

  We will break down the query:

  1. **Assumptions and Their Roles**:
     - Fixed set of available acts: The agent has the same set of actions available before and after learning. If this is violated, the agent might be forced into a different action set that could be worse.
     - Utility function unchanged: The utility function does not change as a result of receiving information. If the utility function changes, then the same outcome might be valued differently.
     - Fixed possibility space: The information received is about events that were already in the agent's possibility space (i.e., they have assigned probabilities to them). Without this, conditionalization might not be defined.
     - Updates by conditionalization: The agent updates beliefs by Bayes' rule. If the agent does not update correctly, the result may not hold.
     - Information is free: There is no cost (monetary or otherwise) to receiving the information.
     - Expected utility maximizer: The agent is rational in the sense of maximizing expected utility.

  2. **Counterexamples and Formal Results**:
     - We will consider cases where one of the assumptions is relaxed and see if the proposition fails.

  3. **Is the Result Trivial?**:
     - The result is often seen as a consequence of the law of total expectation and the definition of expected utility maximization.

  4. **The Role of Ignoring Information**:
     - The key is that the agent can always choose to act as if they had not received the information. But in practice, once you know something, it might be hard to ignore. However, in the model, we are assuming the agent can choose any action from the fixed set, so they can choose the action that was optimal without the information.

  5. **Non-Expected Utility Preferences**:
     - If the agent is not an expected utility maximizer, then the result might not hold. For instance, ambiguity aversion might lead to situations where more information increases ambiguity and thus reduces expected utility (in their non-EU framework). But this is a change of subject.

  6. **What Does the Thesis Predict?**:
     - The thesis predicts that in any situation meeting the assumptions, the agent will never be made worse off in expectation by free information. A rival view (e.g., one that allows for information to be harmful due to psychological factors or changes in the decision problem) might predict that sometimes information can be harmful.

  Now, let's address the points in detail.

  **Formal Foundation**:

  The result is known as Good's theorem (Good, 1967). It states that for any decision maker who updates by conditionalization and maximizes expected utility, the expected utility of having the information (and then choosing optimally) is at least as high as the expected utility without the information.

  Formally, let:
  - \( A \) be the set of actions.
  - \( S \) be the set of states of the world (finite for simplicity).
  - \( u(a, s) \) be the utility of taking action \( a \) in state \( s \).
  - \( p(s) \) be the prior probability of state \( s \).

  The expected utility without information is:
  \[ EU_{none} = \max_{a \in A} \sum_{s} p(s) u(a, s) \]

  Now, suppose the agent can observe a random variable \( X \) which takes values in \( \mathcal{X} \). The conditional probability of \( s \) given \( X=x \) is \( p(s|x) \). The expected utility after observing \( x \) is \( \max_{a} \sum_{s} p(s|x) u(a, s) \). But since the agent does not know \( x \) in advance, the expected utility of having the information (before seeing \( x \)) is:
  \[ EU_{info} = \sum_{x} p(x) \max_{a} \sum_{s} p(s|x) u(a, s) \]

  Good's theorem states that \( EU_{info} \geq EU_{none} \).

  **Proof Sketch**:

  For any fixed \( x \), the optimal action after seeing \( x \) is \( a^*(x) \). Without the information, the agent chooses a fixed action \( a_0 \) that maximizes the prior expected utility. But note that the agent could choose to ignore the information and use \( a_0 \) regardless of \( x \). Therefore, for each \( x \), the optimal action after seeing \( x \) must yield at least as much expected utility (conditional on \( x \)) as \( a_0 \) does. Hence:
  \[ \max_{a} \sum_{s} p(s|x) u(a, s) \geq \sum_{s} p(s|x) u(a_0, s) \]

  Then, taking expectation over \( x \):
  \[ EU_{info} = \sum_{x} p(x) \max_{a} \sum_{s} p(s|x) u(a, s) \geq \sum_{x} p(x) \sum_{s} p(s|x) u(a_0, s) = \sum_{s} u(a_0, s) p(s) = EU_{none} \]

  This shows the result.

  **Which Assumptions are Critical?**

  1. **Fixed Set of Available Acts**:
     - If the set of acts changes after receiving the information, then the agent might not have the option to take the same action they would have taken without the information. For example, if learning the information forces the agent to make a decision in a new context where the old actions are not available, then they might be worse off.
     - Plausibility: In many real situations, the set of acts might change. For instance, knowing a secret might compel you to act in ways that were previously unavailable (e.g., you might be obliged to report it). This is a potential defeater. The thesis would need to be restricted to cases where the action set remains constant.

  2. **Utility Function Unchanged**:
     - If the utility function changes because of the information, then the same outcomes might be valued differently. For example, learning that you have a terminal illness might make you value money less. Then, even if you can take the same actions, the utility of the outcomes might be lower.
     - Plausibility: This is a real possibility. The proposition assumes a stable utility function. Without it, the result may not hold. However, in the standard Bayesian model, utilities are state-dependent but not information-dependent. If utilities depend on the information, then we are in a different model.

  3. **Fixed Possibility Space**:
     - The information must be about events that were already in the possibility space. If the agent learns something completely unexpected (not in the possibility space), then conditionalization is not defined. The agent would have to extend the probability space, and the prior might not have accounted for the new event.
     - Plausibility: In principle, the agent should have a rich enough state space to include any possible observation. But in practice, agents have limited models. This is a potential problem. However, if we allow the agent to assign prior probability to the event (even if very small) then conditionalization works.

  4. **Updates by Conditionalization**:
     - If the agent does not update by conditionalization, then the result may fail. For example, if the agent updates in a biased way, then the new beliefs might lead to suboptimal actions.
     - Plausibility: The theorem assumes rational updating. If we drop this, then the agent might be worse off because of mis-updating.

  5. **Information is Free**:
     - The information must not have any direct cost (e.g., monetary, time, or psychological cost). If there is a cost, then even if the information is valuable, the net effect might be negative.
     - Plausibility: In the real world, processing information might have costs (e.g., cognitive load). But the proposition explicitly says "free". So if the information is not free, then it might be harmful.

  6. **Expected Utility Maximizer**:
     - If the agent is not an expected utility maximizer, then the result may not hold. For example, an agent with ambiguity aversion (Ellsberg paradox) might prefer known risks to unknown ones, so more information might make them more ambiguity-averse and lead to lower expected utility (in their evaluation).

  **Counterexamples**:

  1. **Changing Action Set**:
     - Example: Suppose without information, the agent can choose to avoid a decision altogether. But if they receive information, they are forced to make a decision. For instance, without information, the agent can choose not to play a game. But if they receive information about the game, they are contractually obligated to play. Then, if the game is unfavorable in expectation, they might be worse off.

  2. **Changing Utility Function**:
     - Example: Consider an agent who is happy as long as they don't know they have a terminal illness. Without information, they are happy and take actions that yield high utility. But if they learn they are ill, then even the same actions (e.g., going to work) yield less utility because of the psychological burden. This is sometimes called the "paradox of happiness". Note: In this case, the utility function is changing because of the information. But in the standard model, utility is over outcomes (which include the state of the world and the action). If we model the state to include the agent's knowledge, then the utility might depend on that knowledge. However, the proposition assumes that the utility function is defined over the same outcomes regardless of information. So this is a violation.

  3. **Unforeseen Events**:
     - Example: The agent has a model that does not include a particular event. When they receive information about a completely unforeseen event, they might not know how to update and might make a poor decision.

  4. **Non-Bayesian Updating**:
     - Example: If the agent, upon receiving information, updates in a way that is not Bayesian (e.g., overreacts), then they might choose an action that is worse than the one they would have chosen without information.

  5. **Costly Information Processing**:
     - Even if the information is free, if it is complex and the agent has limited cognitive resources, they might make a mistake in processing it. But note: the proposition assumes the agent updates by conditionalization, which requires correct processing.

  6. **Non-Expected Utility Preferences**:
     - Example: In ambiguity aversion, consider an Ellsberg-style urn. Suppose without information, the agent faces an urn with 100 balls that are either red or blue in unknown proportion. The agent can bet on red or blue or avoid betting. They might prefer to avoid betting because of ambiguity. Now suppose they are told the exact proportion for free. This resolves the ambiguity. But if the proportion is 50-50, they might now be willing to bet and then face risk (which they might dislike more than the ambiguity). However, note that in EU, risk is accounted for by probabilities. In non-EU models, resolving ambiguity might not be beneficial if the agent is more risk-averse in the presence of known probabilities. But this is a change of subject because the agent is not an EU maximizer.

  **Can the Result be Reversed Without Abandoning Expected Utility?**

  Within the expected utility framework, the result is a theorem. Therefore, if all the assumptions hold, it cannot be reversed. However, if we relax one of the assumptions (like fixed action set or stable utility), then it might be reversed.

  **What Does the Thesis Predict?**

  The thesis predicts that, under the given assumptions, an agent will never be worse off in expectation by receiving free information. A rival view (e.g., one that allows utility to depend on information or that allows for psychological costs) might predict that sometimes information can be harmful. The thesis does not predict a specific positive outcome (like which action will be taken) but only that the expected utility will not decrease.

  **Verdict**:

  The thesis is true under the stated assumptions. The key assumption that does the heavy lifting is the fixed set of actions and the freedom to ignore the information (which is captured by the same action set and the ability to choose the same action as before). Without that, the result fails.

  The result is indeed a consequence of the probability calculus (via the law of total expectation and the max being at least the average) and is therefore "empty" in the sense of being a mathematical truth. But that does not make it worthless: it is a foundational result in decision theory.

  **Ranking of Defeaters**:

  1. **Fatal (if they occur, the result fails)**:
     - Changing action set: If the set of actions after receiving information does not include the action that was optimal without information, then the agent might be forced to take a worse action.
     - Changing utility function: If the utility function changes so that the same outcome is valued less because of the information, then the agent might be worse off.

  2. **Awkward (can be handled by extending the model, but in the basic model they break the result)**:
     - Unforeseen events: If the agent did not assign prior probability to the event, then conditionalization is undefined. But we can require the state space to be sufficiently rich.

  3. **Not Fatal (if violated, the agent is not in the model)**:
     - Not updating by conditionalization: The theorem assumes Bayesian updating. If the agent doesn't update correctly, then the result doesn't apply.
     - Information not free: The proposition is about free information.
     - Not an EU maximizer: The result is for EU maximizers.

  In conclusion, the thesis is well-insulated within the Bayesian expected utility framework. It is a theorem and hence true under the assumptions. The real-world situations where information seems harmful typically involve a violation of one of the assumptions (like stable utility or fixed action set). For your fiction, note that characters who are not ideal Bayesian agents or who face changing circumstances might indeed be hurt by information.

  **Final Note**: The case you seek (a full EU maximizer, updating impeccably, free information, and still worse off in expectation) cannot exist within the model. The proof shows that the expected utility after information is always at least as high as without. Therefore, if you observe such a case, one of the assumptions must have been violated.
answer: |-
  ### Analysis of the Proposition: The Value of Free Information for Expected Utility Maximizers

  Your proposition—that no expected utility (EU) maximizer who updates by conditionalization can be made worse off in expectation by free information—is indeed a settled result, often attributed to I. J. Good (1967). It holds under strict Bayesian decision-theoretic assumptions. Below, I dissect the proposition, test its limits, identify potential defeaters, and evaluate its significance. I proceed as requested: treating the thesis as yours, probing for weaknesses, and prioritizing formal and intuitive counterarguments over restatements.

  ---

  ### 1. **Core Logic and Emptiness of the Result**
  The proposition follows directly from the **law of total expectation** and the **definition of expected utility maximization**. Formally:
  - Let \(S\) be the state space, \(A\) the action space, \(U(a,s)\) the utility function, and \(P\) the prior probability distribution over \(S\).
  - The pre-information expected utility is \(EU^* = \max_{a \in A} \mathbb{E}_P[U(a,s)]\).
  - Upon observing signal \(X = x\) (with likelihood \(P(x|s)\)), the agent updates to posterior \(P(s|x)\) via conditionalization.
  - The post-information expected utility (before observing \(x\)) is \(\mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}_{P(s|x)}[U(a,s)] \right]\).

  **Why it holds**:  
  The agent can always **ignore the information** and choose the pre-info optimal action \(a^*\). Thus, for any \(x\),  
  \[
  \max_{a \in A} \mathbb{E}_{P(s|x)}[U(a,s)] \geq \mathbb{E}_{P(s|x)}[U(a^*,s)].
  \]  
  Averaging over \(X\),  
  \[
  \mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}_{P(s|x)}[U(a,s)] \right] \geq \mathbb{E}_X \left[ \mathbb{E}_{P(s|x)}[U(a^*,s)] \right] = \mathbb{E}_P[U(a^*,s)] = EU^*.
  \]  
  This is a mathematical tautology: **a maximum taken after averaging cannot fall below an average taken before it**.  
  - **Emptiness as a feature**: This is not a defect but inherent to the claim. The proposition is a *theorem* of Bayesian rationality, not an empirical assertion. It defines what it means for information to be "free" and for an agent to be "rational." Its value lies in clarifying assumptions—not in predicting real-world behavior.

  ---

  ### 2. **Defeaters: Assumptions Under Scrutiny**
  The proposition relies on six key assumptions. Below, I rank defeaters from **fatal** (destroying the thesis) to **awkward** (requiring hedging but leaving a weakened core). For each, I state:
  - What must be given up.
  - Plausibility of giving it up.
  - What survives.

  #### **Fatal Defeaters** (Undermine the core result)
  1. **Changing action set (\(A\)) after learning**  
     - **What's challenged**: The clause that the agent "remains free to act exactly as in ignorance."  
     - **Counterexample**: Suppose an agent must choose whether to enter a casino. If ignorant, they stay out (optimal). If they learn the odds are fair, they are *compelled by social pressure* to enter and play. The action "stay out" is unavailable post-info, forcing a loss in expectation.  
     - **Plausibility**: High in social contexts (e.g., learning a secret may compel morally fraught actions).  
     - **Survival**: The thesis holds only if \(A\) is invariant. Relaxing this falsifies Good's theorem.  
     - **Status**: Fatal. A defender concedes this but argues it violates "free information."

  2. **Utility function (\(U\)) depends on information**  
     - **What's challenged**: Utility is defined solely over outcomes, not beliefs.  
     - **Counterexample**: An agent prefers not to know if their spouse is unfaithful. Learning the truth (even if false) devastates them, reducing utility *for all subsequent outcomes*. Formally, \(U(a,s)\) becomes \(U(a,s,x)\), where \(x\) is the information.  
     - **Plausibility**: Psychologically realistic (e.g., information causing trauma, regret, or destroying blissful ignorance).  
     - **Survival**: The thesis assumes \(U\) is state-dependent only. If utilities are belief-dependent, it collapses.  
     - **Status**: Fatal. EU defenders dismiss this as "changing the game," but it's intuitive in your fiction.

  #### **Awkward Defeaters** (Hedge the thesis but leave a kernel)
  3. **Non-fixed possibility space**  
     - **What's challenged**: The signal \(X\) must be in the support of the prior (i.e., \(P(X=x) > 0\) for all \(x\)).  
     - **Counterexample**: An agent encounters a "black swan" event they assigned zero prior probability (e.g., a new technology). Conditionalization fails; they cannot update coherently.  
     - **Plausibility**: Common with unforeseen innovations or shocks.  
     - **Survival**: The result holds if the agent uses a sufficiently inclusive prior (e.g., assigning non-zero density to all conceivable events).  
     - **Status**: Awkward but manageable. Defenders insist rational agents must have "open-minded priors."

  4. **Failure to conditionalize**  
     - **What's challenged**: The agent must update via \(P(s|x) \propto P(x|s)P(s)\).  
     - **Counterexample**: Agents who misinterpret information (e.g., base-rate neglect) or suffer motivated reasoning.  
     - **Plausibility**: Universal in humans; even rational agents might miscalculate.  
     - **Survival**: The theorem assumes perfect conditionalization. It becomes normative ("should not hurt") not descriptive.  
     - **Status**: Conceded by defenders as irrelevant—it violates the setup.

  5. **Information is not free**  
     - **What's challenged**: No costs (cognitive, temporal, or strategic) to receiving/processing information.  
     - **Counterexample**: Learning a state secret invites assassination. Even if \(A\) and \(U\) are fixed, survival probability drops.  
     - **Plausibility**: Ubiquitous (e.g., information overload, attention costs).  
     - **Survival**: The thesis holds for "free" info; otherwise, it's a cost-benefit trade-off.  
     - **Status**: Defender dismisses as "not free information."

  #### **Non-Defeaters** (Do not challenge the core)
  6. **Agents must be EU maximizers**  
     - **What if abandoned?**: Ambiguity-averse agents (e.g., Gilboa-Schmeidler max-min EU) may prefer ignorance.  
       - *Example*: An Ellsberg urn with unknown proportions. Learning the exact ratio may increase perceived risk, lowering welfare.  
     - **Plausibility**: Well-documented in behavioral economics.  
     - **Status**: Changes the subject. The proposition explicitly assumes EU maximization. Within EU, reversal is impossible.

  ---

  ### 3. **The Role of Ignoring Information**
  - **Why it's crucial**: The clause "remains free to act exactly as in ignorance" is the linchpin. It ensures the post-info EU is at least the pre-info EU via dominance.  
  - **Real-world irrelevance?** You note that humans cannot ignore information. This is correct but orthogonal: the proposition is *normative* for idealized agents. It says, "If you *can* ignore it, you won't be worse off." Human cognitive limitations (e.g., emotional salience of information) are beyond its scope.  

  ---

  ### 4. **Predictions and Rival Views**
  - **What the thesis predicts**:  
    - *No* scenario exists where a "perfect" EU agent (fixed \(A\), stable \(U\), etc.) is hurt by free information.  
    - This contrasts sharply with:  
      - **Psychological views**: Information can intrinsically harm (e.g., "bliss of ignorance").  
      - **Non-Bayesian frameworks**: Info can increase ambiguity or regret.  
  - **Is it falsifiable?** Only if a counterexample violates *no* assumptions—which is impossible by the theorem.  
  - **Worthlessness?** Not at all. As a theorem, it:  
    - Exposes assumptions behind "information is valuable."  
    - Guides model-building: e.g., if information hurts, check for changing \(A\) or \(U\).  
    - Serves as a null hypothesis for behavioral deviations (e.g., why *do* people avoid information?).

  ---

  ### 5. **The Requested Counterexample: Why It Cannot Exist**
  You ask for a case where a perfect EU agent, updating impeccably, pays nothing, and is worse off in expectation. **This cannot occur.** A sketch proof:
  - Let \(a^*_0\) be the pre-info optimal action.  
  - Post-info, for any signal \(x\), the agent chooses \(a_x^* = \arg\max_a \mathbb{E}_{P(s|x)}[U(a,s)]\).  
  - By dominance: \(\mathbb{E}_{P(s|x)}[U(a_x^*,s)] \geq \mathbb{E}_{P(s|x)}[U(a^*_0,s)]\) for all \(x\).  
  - Thus, \(\mathbb{E}_X[\mathbb{E}_{P(s|x)}[U(a_x^*,s)]] \geq \mathbb{E}_X[\mathbb{E}_{P(s|x)}[U(a^*_0,s)]] = \mathbb{E}_P[U(a^*_0,s)]\).  
  - Equality holds only if \(a^*_0\) remains optimal for all \(x\).  

  If you observe apparent harm, recheck assumptions: likely \(A\) shifted (e.g., actions are belief-contingent) or \(U\) changed (e.g., guilt upon learning).

  ---

  ### Final Verdict
  - **Truth**: The proposition is true, well-insulated, and nearly empty—as all theorems are.  
  - **Strength**: It robustly isolates conditions where information cannot harm.  
  - **Weakness**: Its assumptions are brittle; relaxing any (especially fixed \(A\) or stable \(U\)) unravels it.  
  - **For your fiction**: Characters avoiding knowledge likely violate EU assumptions (e.g., their utility *depends* on ignorance, or their action set *expands* painfully upon learning). This is fertile ground: the theorem explains why rational agents *should* seek info, but humans don't—precisely because we live in the space of defeaters.  

  If you defend the thesis, concede that it holds only in idealized worlds. Attackers must target its assumptions, not the math. The theorem's power lies in its failure modes: when information *does* hurt, it reveals where our models break.
