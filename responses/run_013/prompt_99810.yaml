  ### Two-Envelope Paradox In-Class Activity Design

  **Objective**: Make students experience the paradox, generate the "always swap" argument, and reveal its flaws through hands-on play with points, structured rounds, and debriefing.

  ---

  #### **Materials & Setup**
  - **Envelopes & Amounts**:
    - Prepare index cards (stand-ins for envelopes) with point values (e.g., 5, 10, 20, 40, 80).  
    - For each student-pair (or individual), generate the smaller amount \(X\) from a **non-symmetric prior distribution** to ensure the naive EV argument fails. Use:  
      \[
      P(X=5) = 0.4, \quad P(X=10) = 0.3, \quad P(X=20) = 0.2, \quad P(X=40) = 0.1
      \]
    - One envelope contains \(X\), the other \(2X\). Assign amounts randomly per round.  
  - **Participants**: 18 students in 6 groups of 3. Groups design strategies together.  
  - **Payoff**: Points converted to extra credit (e.g., 1000 points = +1% on final grade). Track cumulative points.  
  - **Roles**: In paired rounds, two students share a single envelope pair (hold one envelope each).  

  ---

  #### **Structure & Timeline (90 min total)**  
  1. **Introduction (5 min)**:  
     - Explain rules: "You get one envelope, open it, see points, and choose to swap with the house (instructor) for the other unseen envelope. Goal: Maximize points."  
     - Emphasize: *"Decide a swapping strategy in your group before rounds start. No changes mid-game."*  

  2. **Strategy Design (15 min)**:  
     - Groups design and justify a strategy (written). **Prompt**: *"Argue mathematically for your strategy."*  
     - **Anticipate**: Most groups derive "always swap" using naive EV: If you see \(Y\), the other envelope is \(2Y\) or \(Y/2\) with equal probability, so EV(swap) = \(1.25Y > Y\).  
     - Allow natural choices: Always swap, never swap, or swap if amount < threshold (e.g., swap if \(Y < 30\)).  

  3. **Rounds (45 min)**:  
     - Run 15 rounds (3 min/round). Students record observed amount, decision, and final amount.  
     - **Round types**:  
       - **Rounds 1–10**: Standard (each student plays independently against the house).  
       - **Round 11**: Paired round (students A and B hold the two envelopes of *one* pair; both decide to swap independently without knowing they’re paired). After decisions, reveal they shared a pair and show outcomes (e.g., both swapped: one gains, one loses).  
       - **Rounds 12–15**: Threshold strategy refinement (groups may update strategy to swap only if \(Y <\) chosen threshold, e.g., 30).  
     - **Key twist**: In paired rounds, students see *both can reason to swap and expect gain, but combined gains are zero-sum*.  

  4. **Results & Tally (10 min)**:  
     - Groups sum points. Display rankings. **Example outcome**:  
       - Always-swap groups: ~19.5 pts/round/student.  
       - Threshold groups (e.g., swap if \(Y < 30\)): ~21.5 pts/round/student.  
       - Never-swap groups: ~19.5 pts/round/student.  

  ---

  #### **Predictable Issues & Mitigation**  
  - **"Deck is stacked!"**: Reveal prior after rounds. Explain: "Real decisions use unknown priors; we control it to expose the fallacy."  
  - **High-variance wins**: A reckless player might lead by luck. **Solution**: Use group averages (not individual rankings) and 15 rounds to reduce noise.  
  - **Refusing to commit**: Require written strategies. Enforce: "No strategy, no points for that round."  
  - **Overgeneralizing from one session**: Preface: "One session is noisy; the lesson is the aggregate math, not this exact outcome."  
  - **Noise in totals**: Run 15 rounds. With 18 students, 270 data points make threshold advantage visible (e.g., threshold groups often rank top 2).  

  ---

  #### **Debrief (15 min)**  
  - **What happened?**:  
    - Always-swap underperformed threshold strategies.  
    - In paired rounds, both players swapped expecting gains, but gains/losses canceled.  
  - **Naming the machinery**:  
    1. **Conditioning error**: Naive EV treats observed \(Y\) as fixed while the other envelope is random. But \(Y\) is a variable—you might have the smaller or larger envelope.  
    2. **Prior matters**: With a flat prior (all \(X\) equally likely), the EV calculation is incoherent (infinite expected values). Our prior \(P(X)\) made low amounts more probable, so high observed \(Y\) likely means you have the larger envelope.  
    3. **Genuine improvement**: Threshold strategies (swap if \(Y < c\)) use the prior to condition rationally. In our prior, swapping for \(Y = 5, 10, 20\) had positive conditional EV, but not for \(Y = 40, 80\).  
    4. **Why "never swap" isn’t the answer**: The paradox isn’t resolved by avoiding swaps—it’s solved by recognizing the naive EV is ill-defined without a proper prior. Swapping *can* be beneficial with information.  
  - **Final note**: The naive EV argument has no well-defined value. If \(X\) is unbounded with a flat prior, \(E[\text{gain}|Y]\) diverges—you cannot average over an infinite set uniformly.  

  ---

  #### **Limitations & What You Must Explain**  
  - **Unopened envelope strategy**: The activity doesn’t cover cases where swapping beats 50/50 without opening (e.g., [randomized strategies](https://plato.stanford.edu/entries/paradox-stpetersburg/)). **Supply this**: If you swap with probability \(f(Y)\) (e.g., \(f(Y) = 1/(1+Y)\)), you can gain without conditioning.  
  - **General resolution**: The naive EV fails because it assumes \(P(\text{other is } 2Y) = P(\text{other is } Y/2) = 0.5\) unconditionally. But these probabilities depend on \(P(X)\). Formally:  
    \[
    E[\text{gain}|Y] = \frac{1}{2} \left( \frac{Y}{2} + 2Y \right) - Y = \frac{Y}{4} \quad (\text{flawed})
    \]  
    This ignores that \(Y\) is correlated with the event that you hold the smaller/larger envelope. With prior \(P(X)\), the true EV is:  
    \[
    E[\text{gain}|Y] = Y \left( \frac{2p_{\text{small}}}{p_{\text{small}} + p_{\text{large}}} - \frac{p_{\text{large}}}{p_{\text{small}} + p_{\text{large}}} \right)
    \]  
    where \(p_{\text{small}}\) and \(p_{\text{large}}\) are the probabilities that \(Y\) is the smaller or larger amount in the pair.  

  ---

  ### **Why This Works**  
  - Students *feel* the paradox: They create the flawed argument themselves and see it fail.  
  - Structural twists (paired round, threshold rounds) force deeper engagement.  
  - Math emerges from data, not lectures. Debrief links experience to theory.  
  - Honesty about noise/limitations builds credibility—students trust the lesson isn’t rigged.  

  **Final Tip**: Use a spreadsheet to generate amounts and track points in real-time. Project scores after each round to heighten engagement.
