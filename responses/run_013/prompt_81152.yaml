prompt: |-
  A great deal of current work on why some nations are rich now runs on one methodological practice. Since we cannot run experiments on countries, the field treats certain episodes in the historical record as though they were experiments: it looks for variation that is plausibly arbitrary with respect to prosperity — settler mortality rates, borders drawn by colonial administrators through otherwise similar terrain, legal systems transplanted wholesale by conquest, the location of missionary stations, the timing of a slave trade's suppression — and treats such variation as licensing causal claims about institutions. Policy then follows: because the estimates say institutions cause prosperity, development agencies and finance ministries fund institution-building, and the geography and culture explanations are treated as the defeated rivals. The practice is exacting in one respect and permissive in another. Practitioners will refuse a causal claim outright unless the variation is plausibly exogenous, and will argue for years over a single identification assumption; yet they rarely ask whether the estimated relation would hold in a different region or century, and they seldom say by what mechanism the institution they have named is supposed to produce growth.

  I would like to know what this practice presupposes. Does it require a regularity or covering-law view of causation, on which a cause is a relation that must hold across cases, or is it equally at home with a mechanistic view on which causation is a stable process operating in a particular setting, so that the estimates need not travel at all? Does treating institutions as something that can be instrumented presuppose that institutions are one manipulable kind of thing, rather than a heterogeneous bundle of arrangements with different causal powers? What view of culture is built into the practice's habit of using culture as the residual, the term that absorbs whatever institutions and geography leave unexplained? And what does the practice assume about counterfactuals in a history that happened once — that the record is a sample drawn from a population of possible histories, or merely a collection of local contrasts?

  Reconstruct the implicit theory, then tell me which of these commitments the practice genuinely needs and which it merely fits comfortably with; where it is underdetermined, so that two incompatible accounts of causation would license the same research programme; and what would have to change in the practice itself, not merely in how its practitioners describe it, if the presupposed view were replaced by a mechanistic one.
reasoning: |-
  Hmm, the user is asking about the methodological presuppositions in development economics, particularly regarding causal inference using historical episodes as natural experiments. They want me to reconstruct the implicit theoretical commitments behind this practice.

  The core practice involves treating historical variations (like settler mortality or colonial borders) as quasi-experimental variations to identify causal effects of institutions on prosperity. This approach dominates current development thinking and policy.

  The user raises several philosophical questions about causation: whether this method presupposes a covering-law view (universal causal relations) versus a mechanistic view (context-specific processes); whether institutions are treated as homogeneous manipulable variables; how culture functions as a residual category; and what counterfactual assumptions underlie historical analysis.

  I need to identify what this methodology genuinely requires versus what it's merely compatible with. The key requirements seem to be: (1) Some minimal causal regularity to justify inference from past to present, (2) Treating institutions as sufficiently homogeneous for policy intervention, (3) Using culture as a residual category for statistical control, and (4) Assuming history contains enough "what-if" moments to support counterfactual reasoning.

  The methodology is flexible enough to accommodate both covering-law and mechanistic views, as long as practitioners believe mechanisms are sufficiently similar across cases. But switching to a strict mechanistic view would require significant changes: context-specific mechanisms, institutional heterogeneity analysis, cultural endogeneity considerations, and local counterfactuals. This would shift policy from universal blueprints to context-sensitive diagnostics.

  The practice is most rigid in requiring instruments to be exogenous and identification assumptions to be debatable. It's flexible about whether findings travel across contexts. The institutional homogeneity assumption is more operational than ontological - it's about tractability rather than deep belief.

  For the response, I'll reconstruct the implicit theory point by point, then show where the practice has hard requirements versus flexibility. Finally, I'll outline how switching to a mechanistic view would change research design, not just rhetoric. The user seems sophisticated about philosophy of science - they'll appreciate clear distinctions between necessary commitments and comfortable affinities.
answer: |-
  The methodological practice you describe—treating historical variations as quasi-experimental instruments to identify causal effects of institutions on prosperity—rests on an **implicit theory of causation and evidence** with specific philosophical commitments. Below, I reconstruct its presuppositions, distinguish necessary commitments from comfortable affinities, identify points of underdetermination, and outline changes required for a mechanistic view.

  ---

  ### **Core Presuppositions of the Practice**
  1. **Causation as Difference-Making (Counterfactual Dependence)**  
     - **Necessary Commitment**: The practice *requires* a counterfactual theory where causation is defined by what would change if the cause (e.g., institutions) varied while holding other factors fixed. Instrumental variables (IV) rely on this: institutions "cause" prosperity if prosperity differs when institutions change exogenously.  
     - **Comfortable Affinity**: It aligns with David Lewis-style counterfactuals but doesn’t require a full possible-worlds ontology.  

  2. **Institutions as Coarse-Grained, Manipulable Variables**  
     - **Necessary Commitment**: Institutions must be conceptualized as *intervenable levers* (e.g., "property rights" or "rule of law") that can be isolated and "swapped" across contexts. This allows IV methods to treat them as homogeneous inputs.  
     - **Implicit Ontology**: Institutions are presupposed to have stable, context-independent effects—ignoring that "institutions" are emergent bundles of norms, rules, and power relations whose causal powers depend on interactions.  

  3. **Culture as the Residual "Other"**  
     - **Presupposition**: Culture is treated as a residual category that absorbs unexplained variance, implying it is:  
       - *Non-manipulable* (too diffuse for policy intervention),  
       - *Static* (its effects are fixed background noise),  
       - *Epiphenomenal* (merely a correlate, not a driver of institutions/prosperity).  
     - **Commitment**: This requires culture to be separable from institutions, rejecting dialectical views (e.g., culture shapes institutions and vice versa).  

  4. **Historical Record as a Population of Possible Worlds**  
     - **Necessary Commitment**: The practice presupposes history contains *multiple realizations* of counterfactuals (e.g., "If settler mortality had been lower here, institutions would differ"). This treats historical events as draws from a hypothetical distribution of possible histories.  
     - **Rejects**: Singularity of history; assumes comparability across time/space.  

  5. **Causal Inference via Invariance Under Intervention**  
     - **Necessary Commitment**: The *only* regularity required is that the estimated effect (e.g., β in Y = βX + ε) is invariant under the *specific intervention* used (e.g., colonial borders). It does *not* presuppose universal covering laws.  
     - **Underdetermination**: This is compatible with both:  
       - **Covering-Law Lite**: Effects are stable across contexts if similar background conditions hold.  
       - **Mechanistic View**: Effects hold only if the same mechanisms are operable.  

  ---

  ### **Underdetermined Aspects: Where the Practice is Flexible**
  1. **Universality vs. Context-Specificity**  
     - The practice is *agnostic* about whether estimates "travel" to other regions/eras. Practitioners focus on local causal identification (e.g., "In 19th-century Africa, borders caused institutional differences") but often *extrapolate* tacitly.  
     - **Underdetermination**: Both covering-law and mechanistic views can justify the same IV design. The former assumes effects generalize; the latter assumes mechanisms are replicable.  

  2. **What Sustains the Causal Relation?**  
     - The practice doesn’t specify *why* institutions affect prosperity. It is compatible with:  
       - Mechanisms (e.g., institutions → secure property rights → investment → growth),  
       - Black-box regularities (no mechanism needed).  
     - **Key Point**: IV only requires *exogeneity*, not a mechanism.  

  ---

  ### **What Would Change Under a Mechanistic View?**  
  A mechanistic view (e.g., Machamer, Darden, Craver) treats causation as context-bound processes involving entities and activities. Adopting it would necessitate **methodological shifts**, not just semantic ones:  

  1. **From Variables to Mechanisms**  
     - **Change**: Stop treating institutions as monolithic variables. Instead, map *how specific components* (e.g., contract enforcement norms) interact with local actors/conditions to produce outcomes.  
     - **Example**: Replace "strong institutions → growth" with "When courts resolve disputes fairly (entity/activity), entrepreneurs (entity) invest (activity) because they trust outcomes (mechanism)."  

  2. **Heterogeneity of Institutions**  
     - **Change**: Reject instrumentalizing "institutions" as a whole. Design studies to test mechanisms within *types* of institutions (e.g., land titling vs. banking regulation) and their interactions.  

  3. **Culture as Endogenous Mechanism**  
     - **Change**: Culture could no longer be a residual. Researchers must model:  
       - How culture *shapes* institutional function (e.g., kinship norms limiting property rights),  
       - Feedback loops (e.g., institutions altering cultural attitudes).  

  4. **Context-Bound Generalization**  
     - **Change**: Abandon extrapolating estimates to dissimilar contexts. Instead:  
       - Identify scope conditions under which mechanisms operate (e.g., "This property-rights mechanism works only in market-oriented societies"),  
       - Use historical cases to trace mechanisms, not just estimate average effects.  

  5. **Counterfactuals as Localized Scenarios**  
     - **Change**: Replace population-of-histories with *specific, plausible alternate scenarios* (e.g., "If the British installed common law here instead of French civil law, would local elites have subverted it?").  

  ---

  ### **Conclusion: Necessary vs. Optional Commitments**
  | **Presupposition**               | **Necessary for the Practice?** | **Change Under Mechanism?**        |  
  |----------------------------------|----------------------------------|-------------------------------------|  
  | **Counterfactual causation**     | Yes (core to IV)                 | Retain, but localize                |  
  | **Institutions as intervenable** | Yes (for policy relevance)       | Reject homogeneity; analyze parts   |  
  | **Culture as residual**          | No (convenient, not essential)   | Integrate as mechanism              |  
  | **History as possible worlds**   | Yes (for identification)         | Shift to localized counterfactuals |  
  | **Invariance under intervention**| Yes (for estimation)             | Add mechanism constraints           |  

  The practice is *genuinely committed* to counterfactual causation and exogenous variation but is *underdetermined* on universality vs. context-dependence. Switching to a mechanistic view would transform it from a search for "levers" to a diagnostic toolkit for understanding *how* prosperity emerges in specific settings—prioritizing deep context over portable estimates. Policy would focus less on exporting institutions and more on catalyzing local mechanisms.
