prompt: |-
  ok, I need you to draft something for me and I want you to actually think it through first. Role: you're a philosopher of mind who also genuinely reads the sleep-lab literature — the kind of person who could referee for both a philosophy journal and a sleep journal. Before you write anything, spend a few paragraphs brainstorming: state the two camps in your own words, list the sub-questions you see, then scrap that and write the real document.

  Background: there's a decades-old fight about whether dreams are experiences, and the two sides have been talking past eachother almost the whole time. Camp A: a dream is an experience — it happens while you're asleep, roughly in real time, and the waking report is a lossy readout of something that already occurred. Camp B: "dreaming" names a waking performance, the remembering and the telling, and the idea that there's an experience going on in the sleeper's head is a picture we smuggled in and then mistook for a finding. (You'll know this as roughly the Malcolm vs Dennett thing, with the cassette business — the view that the dream gets assembled rather than played during sleep — floating around in there. Don't get bogged down in who said what when; I don't want a reading list, I want the arguement.)

  What I need is the joint statement the two camps could both actually sign after a good-faith adversarial collaboration:

  1. A numbered list of agreed claims — about what the word "dream" is doing, about what the sleep-lab evidence does and doesn't show, about what would count as settling things. Nothing vacuous, nothing that quietly hands one side the win.
  2. The disagreements, each written twice: once in the formulation Camp A would accept as fair to itself, once for Camp B. Then say which of them, if any, are fights about words rather than about the world, and why.
  3. The cruxes — the sub-questions where settling one would actually move at least one camp — and for each crux, a concrete case or test both camps agree would bear on it, with each camp's prediction written down in advance.

  Fold in these three, because the standard examples are worn smooth:

  (a) The dream nobody reports. Someone sleeps, shows whatever the lab signature of dreaming is, wakes with zero memory of anything. Did an experience happen? Neither camp gets to say "undecidable" and walk away.

  (b) Animals and pre-verbal kids. They sleep, they cycle through the relevant stages, they never tell anyone anything. Take Camp B seriously and you may have to say the question of whether a dog dreams is confused — say it plainly if so. Take Camp A seriously and say exactly what you're claiming on the dog's behalf.

  (c) Stipulate, don't litigate whether it's real: a lab builds a decoder that reconstructs visual content from brain activity with decent accuracy during waking imagery, then runs it during sleep and gets plausible-looking output. What would that show, and what would each camp predict before seeing the results?

  One more wrinkle to handle: suppose dream reports get dramatically thinner if you ask a few seconds after waking instead of immediately. What does that do, and not do, for each side?

  Format: numbered agreed claims, then a disagreements table, then the cruxes with the predictions. Keep the prose tight, skip the throat-clearing, and don't hedge your way out of saying which disagreements you think are real.
