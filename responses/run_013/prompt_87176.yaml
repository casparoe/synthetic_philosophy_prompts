  Then, the counterfactual problem. Regimes control the narrative on alternatives. Is this circular? Need to examine how regimes frame alternatives and how citizens perceive them. Uses historical examples and narrative analysis. Less urgent than the first two but still important. 

  Other questions: institutional adaptations, sources of performance standards, vulnerability to crises, and international dimensions. Institutional adaptations might be downstream because you need to understand legitimacy mechanisms first. Sources of standards could be upstream but maybe secondary to the belief gap. Vulnerability is important but relies on prior understanding of legitimacy foundations. International dimensions are emerging but might be lower priority. 

  Dropping familiar questions like typologies of regimes or economic indicators. The user wants conceptual depth, not classifications or econometrics. Also, avoid effectiveness vs. legitimacy debates if they're rehashed. 

  Prioritizing based on upstream nature. The belief gap is first because legitimacy hinges on perception. Then, procedural-performance relationship as it defines the concept. Counterfactuals next. Then institutional roles, standards, and vulnerability. 

  Need to ensure each question's tractability with existing texts and cases. Public opinion studies, regime documents, historical analyses are all feasible without new data collection. 

  Also, consider what could move questions up/down. For the belief gap, new survey methods or propaganda studies could elevate it. For procedural ties, shifts in regime rhetoric might change its relevance. Counterfactuals could rise with new framing theories. 

  Check if any angles are missed. Maybe how digital authoritarianism affects perception management? Or the role of nationalism in performance claims? But the user might prefer sticking to the outlined live issues. 

