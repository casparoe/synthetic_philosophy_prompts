prompt: |-
  I'm putting together a metaphysics unit on properties and universals, and before we read any of the theories I want the spec. So: what does a theory of properties (universals, if you like) have to deliver to count as adequate? Give me the requirements list, with the case behind each one -- the phenomenon or the example that makes it a requirement rather than a preference -- and say which of them are genuine desiderata and which are just the taste of one camp dressed up as a constraint. A few cases I want the list built around, because there the ones I keep tripping over:

  - two properties that happen, as a matter of fact, always to turn up in exactly the same things, so you can't tell the class of instances of one from the class of instances of the other (some people call this the companionship difficulty);
  - a crowd of things where every pair resembles in some respect, but there's no single respect they all share -- so a theory that says a property just is the class of things that resemble one another ends up with a 'property' that's nothing in particular;
  - nothing is wholly red and wholly blue at once, yet 'red or blue' is satisfied by plenty of things, so not every class and not every predicate can be a property;
  - properties that drag in a particular individual: being someone's sibling, being the capital of one particular country;
  - properties nothing ever has -- the exact determinate value of some quantity no object has ever taken, or a property only a possible-but-never-actual particle would have;
  - instantiation itself, where you seem to need a further relation between the thing and its property, and then a relation between the thing, the property and that relation, and off it goes.

  Then the bit I actually care about: are any of these requirements jointly unsatisfiable? I'd bet theres at least one pair where you have to give something up, and I want the trade-off spelled out rather than smoothed over. Say too which single requirement does the most work at ruling candidates out, and whether that's the one I'd have expected. Keep any scoring of the going views (realism about universals, tropes, class nominalism, whatever else is in play) to a couple of lines at the end -- the criteria are the deliverable, I'll do the marking myself. Purpose, in case it helps you fix what counts as adequate: this is for a metaphysics that has to stay on speaking terms with natural science, so nothing gets to be spooky or primitive unless it's earning its keep.
reasoning: |-
  Okay, the user is putting together a metaphysics unit on properties and universals and wants a list of adequacy requirements for any theory of properties. They've provided specific cases they want the list built around. Let me start by understanding each of those cases and what underlying issues they highlight.

  First, the companionship difficulty: two properties co-occur in all the same things. The problem here is that if properties are just sets, you can't distinguish them. So the requirement is to account for distinct but co-extensive properties. 

  Next, the resemblance problem. If every pair in a group shares a resemblance but there's no common property, a set-based theory might create a property that isn't real. This points to the need for properties to ground genuine similarities without arbitrary sets.

  Then, the red and blue issue. Not every predicate defines a property. The theory must explain why some combinations like disjunctions aren't genuine properties, possibly related to naturalness or sparse properties.

  Individual-involving properties, like being someone's sibling. These seem to involve particulars, so the theory needs to handle properties that depend on specific individuals without reducing them to sets.

  Uninstantiated properties are tricky. Even if no actual instances, we talk about them meaningfully. The theory must accommodate non-actual properties without overpopulating the ontology.

  The regress problem with instantiation. If instantiation requires a relation, does that lead to infinite regress? The theory must avoid such vicious regress.

  Now, the user wants to know if these requirements conflict. For example, distinctness of co-extensive properties (from companionship) might clash with a sparse theory that rejects abundant properties. Also, uninstantiated properties might conflict with nominalist views that only admit instances.

  The user's deeper needs: they want a clear framework for evaluating theories, highlighting trade-offs. They emphasize a scientifically compatible metaphysics, avoiding spooky entities. So, any primitive elements must be justified. They probably want students to critically assess theories rather than accept any one view. Also, identifying conflicts helps in understanding why different theories exist and their compromises. Need to ensure each requirement is tied to a concrete example, avoiding vague philosophical preferences. Highlighting which constraints are non-negotiable (like non-contradiction) versus those that are theory-dependent (like uninstantiated properties) is crucial. Finally, the regress problem might be the most stringent as it challenges the coherence of any relational theory of instantiation.
answer: |-
  Here's a requirements list for a theory of properties/universals, built around your specified cases, distinguishing genuine desiderata from contested "taste" constraints, identifying conflicts, and highlighting the key constraint. The focus is on phenomena demanding explanation, not doctrinal allegiance.

  **Core Requirements (Genuine Desiderata – Driven by Non-Negotiable Phenomena):**

  1.  **Distinctness Despite Coextension (Companionship Difficulty):**
      *   **Requirement:** The theory must allow for the *possibility* of two *distinct* properties (F and G) that are *as a matter of contingent fact* coextensive (∀x (Fx ↔ Gx)).
      *   **Case/Phenomenon:** Imagine a universe where, due to fundamental physical laws, every object with property F (say, *having exactly 10 quarks of type A*) also has property G (*having exactly 5 quarks of type B*), and vice versa. Yet, intuitively, F and G are different properties – they *could* come apart under different laws or in different circumstances. A theory identifying properties *only* with their extensions (sets) cannot distinguish F and G here.
      *   **Nature:** Genuine Desideratum. Failure renders properties merely linguistic/conventional and fails to capture real potential differences in how the world *could* be structured.

  2.  **Grounding Resemblance without Universal Commonality:**
      *   **Requirement:** The theory must explain how objects can resemble each other pairwise in different respects without requiring a single respect common to all objects in the resemblance-class. It must avoid positing a "junk property" for arbitrary resemblance classes.
      *   **Case/Phenomenon:** Consider a set of objects: {Red Circle, Red Square, Blue Square}. Every pair resembles: (Circle, Square) in redness; (Circle, Blue) in... nothing? (Red Circle & Blue Square share no obvious common property). *However*, (Red Circle & Red Square) resemble in redness; (Red Square & Blue Square) resemble in squareness; (Red Circle & Blue Square)... perhaps in being shapes? But there's *no single property* (like redness or squareness) shared by all three. A theory defining a property *simply as* the class of pairwise resembling things would be forced to posit a property for this arbitrary set ("being a red circle, red square, or blue square"), which isn't a genuine respect of similarity grounding the pairwise resemblances.
      *   **Nature:** Genuine Desideratum. Failure leads to an explosion of unnatural, non-genuine properties that don't reflect the actual structure of similarity.

  3.  **Constraint on Arbitrary Predicates/Classes (Exclusion of Disjunctions/Contradictions):**
      *   **Requirement:** The theory must explain why not every logically definable predicate or class corresponds to a genuine property. Specifically, it must rule out disjunctive properties like "red or blue" and contradictory properties like "wholly red and wholly blue" as genuine, fundamental properties.
      *   **Case/Phenomenon:** Nothing can be "wholly red and wholly blue" at the same time – this predicate (and its corresponding class) is empty and contradictory. Conversely, "red or blue" is satisfied by many things, but grouping them under a single property seems arbitrary; a red apple and a blue book share "red or blue" but lack a fundamental commonality. Genuine properties like mass or charge seem fundamentally different from arbitrary logical combinations.
      *   **Nature:** Genuine Desideratum (though the *degree* of constraint is contested). Failure allows any arbitrary collection or predicate to define a property, trivializing the notion and making it useless for capturing natural structure. This motivates the need for *sparse* properties.

  4.  **Avoidance of Instantiation Regress:**
      *   **Requirement:** The theory's account of instantiation (a particular having a property) must not generate a vicious infinite regress.
      *   **Case/Phenomenon:** If instantiation (I) is a *relation* between a particular (a) and a universal (F), then what relates a, F, *and* I? If it's a further relation I2, then what relates a, F, I, and I2? And so on, ad infinitum. This threatens the coherence of the instantiation relation itself.
      *   **Nature:** **The Key Constraint.** This is arguably the *most stringent* requirement. It rules out naive relational accounts of instantiation. Any theory must either provide a non-relational account (e.g., tropes as non-relational characterizers, nominalism reducing instantiation to predication) or demonstrate how a relational account avoids the regress (e.g., by making the relation "internal" or primitive in a non-regress-inducing way). Failure makes the core notion incoherent.

  **Contested Requirements ("Taste" Dressed as Constraint – Driven by Theoretical Commitments):**

  5.  **Accommodating Individual-Involving Properties (e.g., Being Socrates' Sibling):**
      *   **Putative Requirement:** The theory must account for properties that essentially involve specific individuals ("being taller than Socrates", "being the capital of France").
      *   **Case/Phenomenon:** We predicate things like "is Socrates' sibling" or "is the capital of France". These seem meaningful and true/false of particulars.
      *   **Nature:** **Contested / Taste.** *Realism about Universals:* Often rejects these as genuine *universals* (repeatable entities), seeing them as complexes involving particulars and genuine universals (e.g., *siblinghood* + Socrates). *Trope Theory:* Can treat them as complex tropes built from simpler tropes and particulars. *Class/Concept Nominalism:* Readily accepts these as predicates/classes. *Demand:* Primarily pushed by nominalists wanting to validate all meaningful predication as property-having. A sparse theory might dismiss these as non-fundamental. *Verdict:* Accommodating these isn't a *core* requirement for explaining property-like phenomena (similarity, causal powers, lawhood); it's a preference for abundant properties driven by linguistic considerations.

  6.  **Accommodating Uninstantiated Properties (e.g., Exact Unactualized Mass):**
      *   **Putative Requirement:** The theory must account for properties that are not instantiated by any actual particular (e.g., *having a mass of exactly π kg*, *being a magnetic monopole*).
      *   **Case/Phenomenon:** Science discusses uninstantiated properties meaningfully (laws might cover them, counterfactuals rely on them). We seem able to refer to and think about them.
      *   **Nature:** **Contested / Taste.** *Realism about Universals:* Often comfortable with uninstantiated universals existing independently. *Trope Theory:* Struggles significantly (no actual trope token). *Class/Concept Nominalism:* Struggles (empty class, uninstantiated concept). *Resemblance Nominalism:* Struggles (nothing to resemble). *Demand:* Primarily pushed by realists and those prioritizing modal/linguistic completeness. A sparse, actual-world-focused theory might see no need for them as *existents*. *Verdict:* While explaining our *thought* about such properties is important, requiring them as *existing entities* is a theoretical choice driven by modal realism or plenitude, not a core phenomenon like similarity or exclusion.

  **Conflicts and Trade-offs:**

  1.  **Distinctness vs. Constraint on Arbitraries (1 vs. 3 & 2):**
      *   **Conflict:** Guaranteeing distinctness for *all* coextensive properties (1) requires a very *fine-grained* ontology (e.g., abundant universals, hyperintensional concepts). However, avoiding junk properties (2) and excluding disjunctions/contradictions (3) demands a *coarse-grained, sparse* ontology. You can't easily have maximal distinctness *and* maximal sparseness.
      *   **Trade-off:** Theories must choose a level of grain. *Abundant Realism/Concept Nominalism* satisfy (1) well but struggle badly with (2) & (3). *Sparse Realism/Trope Theory* satisfy (2) & (3) better but face challenges explaining how distinct coextensive properties *could* exist without actual difference (handling (1) requires modal resources beyond simple instantiation).

  2.  **Constraint on Arbitraries (Sparseness) vs. Accommodating Individual-Involvers (3 vs. 5):**
      *   **Conflict:** Strictly enforcing sparseness (3) – demanding properties reflect fundamental, non-arbitrary similarities – pushes against recognizing individual-involving properties (5) as genuine, fundamental properties.
      *   **Trade-off:** *Sparse Realism/Trope Theory* typically demote (5) to derivative status. *Abundant Theories (Class/Concept Nom)* embrace (5) but sacrifice sparseness (3), leading to "junk" properties.

  3.  **Accommodating Uninstantiated vs. Actualist Commitment & Regress Avoidance (6 vs. Core Assumptions):**
      *   **Conflict:** Insisting uninstantiated properties (6) *exist as entities* conflicts with nominalist/actualist commitments where existence depends on instantiation. It can also complicate instantiation regress (4) by requiring a relation to non-actual entities.
      *   **Trade-off:** *Realism* bites the bullet on (6), accepting potential ontological bloat. *Trope/Resemblance/Class Nominalism* generally reject (6) as entities, requiring alternative accounts (e.g., combinatorial, conceptual) for our talk about uninstantiated properties.

  **The Key Constraint & Its Impact:**

  *   **Instantiation Regress Avoidance (4)** is the most powerful constraint. It immediately rules out naive formulations of **Relational Realism** (the "off-the-shelf" universal realism where instantiation is a fundamental relation). It forces any relational theory to find a sophisticated non-regressing account or motivates alternative approaches entirely.
  *   **Impact:** This might be surprising if you expected coextension or resemblance to be the big hurdles, but the regress threatens the very *coherence* of the core idea of "having a property" in relational views. It powerfully motivates **Trope Theory** (no instantiation relation needed, tropes are non-relational attributes) and **Varieties of Nominalism** (instantiation is primitive predication, or reduced to class membership/resemblance/concept application, avoiding a *distinct* relation). Sophisticated **Realism** (e.g., Armstrong's "state of affairs" primitivism, or views where instantiation is "internal") must explicitly address this to be viable.

  **Brief Positioning of Major Views (as requested):**

  *   **Realism (Universals):** Strong on (1), (6); must address (4) carefully; struggles with (2), (3) unless sparse (Armstrong).
  *   **Trope Theory:** Strong on (2), (3); avoids (4) directly; struggles with (1) (coextension possibility), (6), and sometimes (5).
  *   **Class Nominalism:** Strong on (1), (5), (6) (if classes exist); catastrophically fails (2), (3); instantiation (4) is class membership (primitive or defined).
  *   **Concept Nominalism:** Similar to Class Nominalism regarding properties; instantiation (4) is concept application.
  *   **Resemblance Nominalism:** Aims for (2), (3); avoids (4); struggles profoundly with (1) (coextension), (6), and complex cases like your resemblance crowd (2).

  This list provides the criteria; the grading of theories against them (with their necessary trade-offs) is now your task! Remember, the avoidance of primitive spookiness favors solutions that minimize unexplained primitives (especially avoiding the regress!) and align with scientifically tractable structure (pushing towards sparseness). Good luck with the unit!
