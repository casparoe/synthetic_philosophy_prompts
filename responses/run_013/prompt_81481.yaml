prompt: |-
  I'm in a group chat that argues about decision theory way more then is healthy, and yesterday one of the guys posted a long explainer on updateless decision theory for a new member. I know Newcomb's problem and the counterfactual mugging well enough, and I have a rough grip on causal vs evidential, but UDT has never really clicked for me, and I have a feeling a couple of the sentences in his post are doing something sneaky. Can you go through it claim by claim and tell me what to trust? Here's his post, copied:

  "OK so UDT in one go. The basic move is that you don't choose between actions, you choose between *policies* — entire functions from situations to actions — and you pick the policy whose expected utility is highest, where the expectation is over your prior, before you've observed anything at all. So the question isn't 'what should I do now' but 'what policy would I have picked if I'd had to commit before finding out which situation I'd wake up in'.

  In Newcomb's problem this gets you one-boxing: the policy 'one-box' is the one that scores well in the worlds where the predictor is right, and the predictor's accuracy is already baked into the prior. Because the policy is fixed before any observation, an updateless agent doesn't really update on evidence the way we do — it works out its policy once and then just executes it, and new information can't talk it out of the policy, since the new information was already in the prior.

  On the smoking lesion it says don't smoke, same as EDT: the smoking policy has a higher probability of the lesion, so it's out. Nice illustration that it's still evidential reasoning under the hood, just applied to policies instead of actions.

  Counterfactual mugging: it pays. The intuition is that from the agent's point of view the coin comes up before the policy gets picked, so the payment is really a precommitment, and precommitment is the whole trick. Parfit's hitchhiker is the same story — it pays the driver, where a causal agent wouldn't, because it's committed in advance.

  The formal setup is a Solomonoff prior over environments, where the environment is a program that might contain a copy of your own decision algorithm, so the agent can estimate the probability that the other player in a prisoner's dilemma is running the same code as it is. That's how it cooperates with a copy of itself.

  Known weaknesses: the Solomonoff prior is uncomputable, so the whole thing is uncomputable; and it has no account of logical uncertainty.

  His example at the end: you're going to play a two-armed bandit, and you have to pick your policy in advance, before you know which arm pays. He says UDT picks 'always pull the left arm' and then never learns anything, which he thinks is obviously stupid and shows the formalism is a solution in search of a problem.

  And it says you should pay the blackmailer."

  Two loose ends. The bandit thing is his own example, he made it up on the spot, so I'd like to know what someone who actually understands UDT would say about it, since he clearly thinks it's a reductio. And the blackmail line: I always thought 'so you end up paying blackmailers' was the standard complaint about *evidential* decision theory, so is he mixing up the two theories there, or do both get hit by it?

  Format: give me one sentence at the top on whether the post is a fair picture overall. Then a markdown table, one row per distinct claim you can pull out of his post (plus a row for the most important thing he leaves out), with these columns:

  - claim — the claim, in a few words
  - verdict — one of "accurate", "oversimplified", "subtly wrong", "false"
  - what's actually true — what UDT really says here, and if the claim is really describing some other theory, name that theory
  - fallout — whether anything else in his post depends on the claim being right, i.e. what I should mentally delete

  Then two or three bullets on what a newcomer would be misled about if that post was their only source. Don't hedge the verdicts — I need to know which sentences are junk.
reasoning: |-
  We are going to analyze the post claim by claim. First, the overall verdict: the post is a mix of accurate and oversimplified claims, with one subtly wrong claim and one false claim, and it leaves out a crucial aspect of UDT.

  Now, let's break it down:

  1. **Overall Fairness**: The post gives a mostly fair high-level picture but oversimplifies and misrepresents UDT in a few key places, particularly in the bandit example and the treatment of updating.

  Now, the table:

  | claim | verdict | what's actually true | fallout |
  |-------|---------|----------------------|---------|
  | UDT chooses policies (functions from situations to actions) that maximize expected utility over the prior. | accurate | This is the core idea of UDT. The agent chooses a policy (a complete strategy) that maximizes expected utility with respect to the agent's prior before any observations. | This is foundational. If this is wrong, the entire explanation fails. |
  | In Newcomb's problem, UDT one-boxes because the policy 'one-box' scores well in worlds where the predictor is right, and the predictor's accuracy is baked into the prior. | accurate | Correct. UDT one-boxes because the policy of always one-boxing leads to a high expected payoff when the predictor is accurate, which is part of the prior. | Correctly explains Newcomb. |
  | UDT is updateless: it doesn't update on evidence after the policy is set; it just executes the policy. | oversimplified | UDT does not update in the traditional Bayesian sense after choosing a policy, but the policy itself can condition on observations (i.e., it's a function from observations to actions). The "updateless" part means that the policy is evaluated before any observations, but the policy can and must use the observations when executed. | This oversimplification might lead to the misconception that UDT agents don't use observations at all. In fact, they do, as the policy maps situations (which include observations) to actions. |
  | In the smoking lesion problem, UDT says not to smoke, same as EDT, because the smoking policy has a higher probability of the lesion. | accurate | Correct. UDT, like EDT, uses evidential reasoning at the policy level. The policy of smoking is correlated with the lesion in the prior, so it is avoided. | Shows that UDT can resemble EDT in some problems. |
  | In counterfactual mugging, UDT pays because the coin comes up before the policy is picked, so paying is a precommitment. | accurate | This is correct. UDT evaluates the policy before knowing the coin flip, and the policy that pays in the case of heads (and does nothing in tails) has a higher expected utility because it gains in the heads world and loses nothing in the tails world (since it doesn't pay). | Correctly explains counterfactual mugging. |
  | Parfit's hitchhiker: UDT pays the driver because it's committed in advance. | accurate | Similarly, the policy of paying the driver when saved leads to being saved (by a driver who only saves if paid) and thus has higher expected utility. | Consistent with the previous claim. |
  | Formal setup: Solomonoff prior over environments that may contain a copy of the agent's algorithm, enabling cooperation in prisoner's dilemma. | oversimplified | UDT is often described with a universal prior (like Solomonoff) and the idea of self-referential environments. However, the formal setup is more abstract and doesn't require Solomonoff per se. Also, the cooperation in PD is due to the agent realizing that the environment (which might simulate it) will produce the same action, so it cooperates. | The uncomputability of Solomonoff is a real issue, but the core idea of self-referential reasoning stands. |
  | Known weaknesses: Solomonoff prior is uncomputable, so UDT is uncomputable; no account of logical uncertainty. | accurate | True, UDT as described with a Solomonoff prior is uncomputable. Also, the original UDT formulation did not have a built-in account of logical uncertainty (though later work has addressed this). | Correctly notes weaknesses. |
  | Bandit example: UDT picks 'always pull left' and never learns. | false | The example is misapplied. In UDT, a policy for a bandit problem would typically include exploration. The policy is chosen to maximize expected utility over the prior, and that often requires gathering information (i.e., exploring) to get higher returns in the long run. UDT would not blindly choose a fixed arm without exploration if there is uncertainty about which arm is better and if there are multiple pulls. The policy would include a strategy for learning. | This is a critical error. The bandit example is set up incorrectly. UDT would actually design a policy that explores and exploits, so it would not "never learn". The example is a straw man. |
  | UDT says you should pay the blackmailer. | subtly wrong | The blackmail problem (e.g., "Why ain'cha rich?" problem) is often used to critique EDT because EDT would avoid being blackmailed by not having the money (so it wouldn't be blackmailed). UDT, being updateless, would choose a policy that does not pay the blackmailer because paying leads to being targeted and losing money. In fact, UDT would not pay because the policy of not paying leads to not being blackmailed (if the blackmailer can predict the policy). | This claim is wrong because it misapplies UDT to the blackmail problem. The post author might be confusing UDT with EDT. In the standard blackmail problem, UDT would not pay. |

  **Important thing left out**: The post does not mention that UDT policies are *indexical* and condition on the agent's observations. The policy is a function from the agent's entire information state (including observations) to actions. This is crucial because it allows the agent to act differently in different situations, even though the policy is fixed in advance.

  Now, bullets for what a newcomer would be misled about:

  - The bandit example would mislead them into thinking UDT is stupid and doesn't allow learning, when in fact UDT can and does include exploration in policies for uncertain environments.
  - The claim about paying the blackmailer would mislead them into thinking UDT has the same flaw as EDT in the blackmail problem, when actually UDT (being updateless) avoids that flaw and would not pay.
  - The oversimplification of "no updating" might make them think UDT agents don't use observations at all, but they do: the policy uses the current observation to select the action.
answer: |-
  ### Overall verdict: The post is **oversimplified** with one subtly wrong claim and one false claim, but captures key UDT ideas superficially.

  | claim | verdict | what's actually true | fallout |
  |-------|---------|----------------------|---------|
  | UDT chooses policies (functions from situations to actions) to maximize expected utility over the prior before observations. | accurate | Core UDT: Policies are selected upfront via prior-weighted EU maximization (e.g., as in UDT1.1). | Foundational; delete this and the whole explanation collapses. |
  | UDT one-boxes in Newcomb’s because the "one-box policy" scores well when the predictor is accurate (accuracy baked into prior). | accurate | Correct: UDT one-boxes as the policy’s EU dominates via correlation with Omega’s prediction. | Valid; essential for understanding Newcomb’s resolution. |
  | UDT is "updateless": it sets a policy pre-observation and doesn’t update on evidence during execution. | oversimplified | UDT policies *do* condition on observations (e.g., "if I see X, do Y"), but the EU calculation ignores *which* observation occurs. The term "updateless" refers to no *Bayesian updating of beliefs* during policy selection. | Misleading; implies UDT ignores observations entirely. Corrections needed on how policies handle context. |
  | UDT says "don’t smoke" in smoking lesion (same as EDT) because smoking policy correlates with lesion in prior. | accurate | Correct: UDT avoids smoking due to evidential link (lesion probability) at policy level. | Shows UDT’s evidential flavor; no fallout. |
  | UDT pays in counterfactual mugging due to precommitment (coin flip precedes policy choice). | accurate | Correct: Policy paying on heads (but not tails) has higher EU since Omega’s coin is in the prior. | Valid; core to UDT’s counterfactual handling. |
  | UDT pays in Parfit’s hitchhiker due to precommitment. | accurate | Correct: Policy of paying iff rescued maximizes EU via driver’s conditional behavior. | Consistent with mugging; no issue. |
  | Formal setup uses Solomonoff prior; environments may contain agent’s algorithm copy (enabling self-cooperation in PD). | oversimplified | Solomonoff is a *common* prior, but UDT isn’t tied to it. Self-referential cooperation works via logical conditioning (e.g., "if I am copied, what would 'I' do?"), not just code equality. | Overemphasizes Solomonoff; cooperation relies on logical counterfactuals, not just code. |
  | Weaknesses: Solomonoff uncomputable → UDT uncomputable; no logical uncertainty account. | accurate | Fair: UDT’s idealization is uncomputable; early versions lacked explicit logical uncertainty (addressed in extensions like UDT2). | Valid criticism; no fallout. |
  | UDT picks "always pull left" in bandit problem, never learns, and this is stupid. | false | UDT *would* choose an exploratory policy (e.g., "pull both arms initially, then exploit best"). Policies optimize long-term EU, which requires learning in bandits. The example confuses "fixed action" with "policy" (which responds to observations). | Critical error; undermines the bandit critique. Delete this as a reductio—it misrepresents UDT. |
  | UDT says "pay the blackmailer". | subtly wrong | Actually, UDT *rejects* paying: A policy of "never pay" deters blackmailers (if they predict policies), while paying invites exploitation. This confuses UDT with *EDT* (which *does* pay due to evidential links). | Flawed; reveals conflation with EDT. Correcting this fixes the blackmail issue. |
  | **Left out: Indexical conditioning and logical counterfactuals.** | — | UDT policies condition on *agent-indexed observations* (e.g., "what I see now") and handle logical uncertainty via mathematical intuition modules (e.g., "if my computation outputs A, what happens?"). This is key for self-locating problems and logical games. | Major omission; without this, UDT seems inflexible or mystical. |

  **What a newcomer would be misled about:**  
  - UDT doesn’t learn or explore (false: policies *do* include learning strategies like in bandits).  
  - UDT has EDT’s flaws (false: e.g., it avoids blackmail by precommitment, unlike EDT).  
  - Policies ignore observations (false: they map observations → actions; "updateless" refers to belief-updating, not action flexibility).
