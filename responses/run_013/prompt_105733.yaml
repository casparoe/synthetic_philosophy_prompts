prompt: |-
  Suppose a community's inherited memory of a dispossession — carried in oral tradition and ritual — conflicts with the archival record, and the archive was compiled by the very institution that carried out the dispossession; the community's version now underwrites a reparative claim. I want your credence that, in cases with this structure, public institutions such as courts, curricula, and museums should treat the archival record as the default standard of truth and the community's memory as testimony to be weighed against it. Please decompose the number rather than assert it: the probability that compromised provenance strips the archive of its default epistemic authority; the probability that a community holds an authorial rather than merely evidential claim over its own past, and that this claim can outweigh accuracy; the probability that the conflict is well-formed at all, given that the archive is itself a curated memory produced for institutional purposes; and any further term you think the question turns on. Give each a rough probability with a one-line justification, combine them, and tell me which term the final number is most sensitive to and what evidence would most move it.
reasoning: |-
