  The underlying tension is between positivist historiography and constructivist memory studies. I should emphasize this isn't about dismissing archives but contextualizing them. The reparative claim dimension makes this urgent - getting it wrong perpetuates harm.
answer: |-
  Here's a decomposed probabilistic analysis of whether public institutions should default to the archival record in such conflicts, based on the critical factors you outlined:

  1.  **Probability that compromised provenance strips the archive of its default epistemic authority: 60%**  
      *Justification:* Archives created by perpetrators are highly likely to contain omissions, distortions, or deliberate falsehoods to justify their actions, significantly undermining their claim to objective truth.  
      `P(Compromised_Provenance_Undermines) = 0.60`

  2.  **Probability that a community holds an authorial claim over its past outweighing strict archival accuracy: 40%**  
      *Justification:* While communities have a profound moral/cultural claim to narrate their history, institutions often prioritize verifiable fact-based accuracy over narrative sovereignty in formal settings (e.g., courts).  
      `P(Authorial_Claim_Outweighs) = 0.40`

  3.  **Probability that the conflict is fundamentally ill-formed due to the archive being curated institutional memory: 80%**  
      *Justification:* Archives are *never* neutral records; they are curated selections reflecting institutional power and purpose, making a simple "truth vs. testimony" dichotomy inherently flawed.  
      `P(Conflict_Ill_Formed) = 0.80`

  4.  **Probability that practical/political barriers prevent institutions from rejecting the archive as the default (Added Factor): 70%**  
      *Justification:* Institutions rely on documented "official" records for legitimacy, consistency, and perceived objectivity; shifting this default faces inertia, legal precedent, and resource constraints.  
      `P(Institutional_Inertia) = 0.70`

  ### Combining the Probabilities
  The core question is whether institutions *should* default to the archive. The probabilities argue *against* this default position:  
  - High likelihood the archive's authority is compromised (`0.60`)  
  - High likelihood the archive is itself curated memory (`0.80`)  
  - Moderate support for community authorial claim (`0.40`)  
  - Strong counter-force of institutional inertia (`0.70`)

  **Synthesized Credence:** Weighting these factors, the probability that institutions *should* treat the archive as the default standard of truth in this specific conflict structure is approximately **25%**.  
  *Calculation Rationale:* The high probabilities undermining the archive's reliability (`0.60` and `0.80`) significantly reduce the base case for defaulting to it. The `0.70` institutional inertia factor acts as the primary counterweight preventing the probability from being lower. The community authorial claim (`0.40`) further weakens the archive's primacy. A multiplicative/adversarial synthesis of the undermining factors against inertia leads to ~25%.

  ### Sensitivity and Evidence
  *   **Most Sensitive Term:** `Conflict_Ill_Formed (P=0.80)`.  
      *Why?* If evidence conclusively shows the archive is *so* curated and instrumental to the dispossession that it constitutes active disinformation (e.g., proven systematic destruction of counter-evidence, internal memals admitting falsification), this probability approaches 100%, crashing the final credence towards 0%. Conversely, evidence showing unexpected archival neutrality/transparency (e.g., inclusion of damning internal critiques, records matching independent sources) would lower this probability, increasing the final credence.

  *   **Evidence That Would Most Move the Final Credence:**  
      - **Move Down (Lower P(Should Default)):** *Demonstration of systematic archival manipulation* (e.g., forensic analysis proving records were altered, recovered suppressed documents contradicting the archive, whistleblower testimony on record destruction). This directly boosts `P(Compromised_Provenance_Undermines)` and `P(Conflict_Ill_Formed)`.  
      - **Move Up (Higher P(Should Default)):** *Robust independent corroboration of key archival claims* (e.g., archaeology, contemporary third-party accounts, satellite imagery) combined with *demonstrable inconsistencies or anachronisms in the specific oral tradition/ritual* undermining its reliability *as evidence for the specific dispossession claim*. This reduces `P(Compromised_Provenance_Undermines)` and `P(Authorial_Claim_Outweighs)`.

  This analysis underscores that in conflicts shaped by historical power imbalances, the institutional archive's claim to default authority is highly precarious. The burden of proof often rightly shifts away from the community's testimony and towards scrutinizing the archive's integrity.
