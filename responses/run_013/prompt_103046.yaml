prompt: |-
  I am a retired experimental biologist who has spent the past three years attending a philosophy department's reading group. In a recent session on comparative cognition, a colleague closed a long exchange about whether a new information-theoretic measure—one that scores an organism by how efficiently it compresses the contingencies of its ecological niche—actually tracks intelligence with the observation that intelligence is whatever intelligence tests measure. I have since heard the same line used to dismiss questions about machine benchmarks, about whether cephalopods and corvids are intelligent in the same sense, and about whether general intelligence names a natural kind. I would like a disambiguation rather than a defense or a refutation. Please set out the distinct precise claims that the line could be making, ordered from the nearly trivial to the genuinely radical. For each reading, state what it commits one to, whether it is plausible, and whether it would actually license the dismissal in the setting where I heard it. I am especially interested in readings on which the line is not a definition at all but a prediction, a decision procedure, or a claim about the social function of testing; and in whether any reading can survive the observation that we sometimes revise a test because we have decided it was measuring the wrong thing. Please give me a menu I can bring back to the group, with a verdict on each item and a note on which reading my colleague most likely intended.
reasoning: |-
  We are given the line: "intelligence is whatever intelligence tests measure." This statement has been used in various contexts to dismiss deeper questions about intelligence. We will disambiguate this statement into several distinct claims, ordered from nearly trivial to genuinely radical. For each claim, we will set out:

  1. The precise claim.
  2. What it commits one to.
  3. Its plausibility.
  4. Whether it licenses the dismissal in the settings described (comparative cognition, machine benchmarks, cephalopods/corvids, natural kind status of general intelligence).
  5. How it handles the observation that we sometimes revise tests because we think they were measuring the wrong thing.

  We are also interested in non-definitional readings (prediction, decision procedure, social function) and which reading the colleague most likely intended.

  ---

  **Claim 1: The Operational Definition (Trivial Reading)**

  *Precise Claim*: Intelligence, for the purposes of scientific discussion and measurement, is defined operationally by the tests we use. This is a pragmatic stance that avoids metaphysical debates and focuses on measurable quantities.

  *Commitment*: One must accept that the concept of intelligence is tied to the current testing methods. It does not deny that there might be a deeper reality but insists that without an agreed-upon alternative, the test is the best we have.

  *Plausibility*: Highly plausible in an experimental context. This is the standard operationalist approach in science (e.g., temperature is what a thermometer measures).

  *Dismissal License*: In the settings described, it might license dismissal of the question only if the question is about the nature of intelligence beyond what is measurable. For example, if the group is trying to design an experiment, this stance says: "Use the test and move on." However, it does not dismiss the question of whether the test is valid for a particular group (like cephalopods) because the test may not be applicable. Thus, it might not fully dismiss the comparative cognition question.

  *Handling Test Revision*: This reading can accommodate test revision: we are defining intelligence by the tests we currently use, and if we change the test, we are changing the operational definition. However, it does not explain why we revise tests (if we revise because we think the old test wasn't measuring intelligence, that implies we have a pre-operational concept of intelligence).

  ---

  **Claim 2: The Predictive Claim**

  *Precise Claim*: Intelligence tests are the best predictors we have for certain outcomes (academic success, job performance, survival in an environment, etc.), and therefore, for practical purposes, we can equate intelligence with what the tests measure because that is what matters.

  *Commitment*: One must accept that the predictive validity of the tests is high and that the outcomes they predict are the ones we care about when we talk about intelligence.

  *Plausibility*: Plausible in many human contexts (e.g., IQ tests predict academic performance). However, it may be less plausible for non-human animals or artificial systems, and it may not capture all aspects of intelligence.

  *Dismissal License*: It might dismiss the question in the machine benchmark setting if the benchmark is designed to predict performance on tasks we care about. But it would not dismiss the question about cephalopods if the tests we use for them don't predict anything we care about (or if we don't have tests that do). Also, it does not address whether intelligence is a natural kind.

  *Handling Test Revision*: We revise tests when we find better predictors. So revision is driven by the goal of improving prediction, not by a prior notion of intelligence. This fits well.

  ---

  **Claim 3: The Decision Procedure (Methodological Stance)**

  *Precise Claim*: When faced with the question "Is X intelligent?", the only rational procedure is to administer an intelligence test and see what it scores. This is a methodological rule.

  *Commitment*: One must accept that no other method (e.g., theoretical reasoning, behavioral observation without a test) is as reliable or objective.

  *Plausibility*: It is plausible if we are in a context where we have well-validated tests. However, it becomes implausible when no appropriate test exists (e.g., for a novel AI or an octopus) or when the test is clearly inadequate.

  *Dismissal License*: This stance directly licenses dismissal of questions that do not lead to a testable procedure. For example, if someone asks whether cephalopods are intelligent in the same sense as humans, the response would be: "We can only compare them if we have a test that can be applied to both." But note: if we don't have such a test, then the question is unanswerable by this stance. Thus, it might dismiss the question as currently unanswerable.

  *Handling Test Revision*: The decision procedure can be updated: if we revise the test, we are updating our procedure. But the reason for revision might come from outside the procedure (e.g., we notice the test doesn't align with our intuitions in some cases).

  ---

  **Claim 4: The Social Function Claim**

  *Precise Claim*: Intelligence tests serve a social function (e.g., sorting individuals for educational or occupational opportunities), and therefore, intelligence is socially constructed as what the tests measure. The tests are not discovering a pre-existing natural kind but are creating a category that serves societal needs.

  *Commitment*: One must accept that the concept of intelligence is primarily shaped by social practices and not by an underlying biological or computational reality.

  *Plausibility*: This is a radical social constructivist view. It is plausible in the context of human testing (e.g., IQ tests have been used for social sorting) but less so for non-human animals or AI. It may be seen as implausible by those who believe in a biological basis for intelligence.

  *Dismissal License*: It dismisses the question about natural kinds because it denies that intelligence is a natural kind. It would dismiss the questions about comparative cognition and machine benchmarks by reframing them as social practices: we design tests for machines and animals that reflect our social needs, not an objective reality.

  *Handling Test Revision*: Tests are revised when societal needs change. This fits well because revision is driven by social factors.

  ---

  **Claim 5: The Radical Deflationary Claim (Anti-Realist Reading)**

  *Precise Claim*: There is no such thing as intelligence apart from what is measured by intelligence tests. Any talk of intelligence that cannot be reduced to test scores is meaningless.

  *Commitment*: One must deny that there is any underlying trait or natural kind that the tests are approximating. This is a strong anti-realist position.

  *Plausibility*: Highly controversial. It is implausible to many because we do revise tests based on the idea that they are getting closer to measuring the real thing. Also, it cannot explain why we have multiple tests that correlate (if there is no underlying trait).

  *Dismissal License*: It dismisses all the questions because they presuppose that intelligence is a real thing that can be discussed independently of tests. So it would directly dismiss the questions about whether cephalopods and corvids are intelligent in the same sense (because without a test, the question is meaningless) and whether general intelligence is a natural kind (it denies natural kinds exist for intelligence).

  *Handling Test Revision*: This reading struggles because if we revise a test because we think it was measuring the wrong thing, that implies we have a prior concept of intelligence that the test failed to capture. But the radical deflationary claim says there is no such prior concept.

  ---

  **Claim 6: The Institutional Authority Claim**

  *Precise Claim*: The scientific community (or the relevant institutional authority) has decided that intelligence tests are the official measure of intelligence. Therefore, for any official purpose, intelligence is what the tests measure.

  *Commitment*: One must accept the authority of the institution that defines the tests.

  *Plausibility*: Plausible in contexts where there is a strong consensus (like using IQ tests in psychology). However, in emerging fields (like AI or comparative cognition) there may be no such consensus.

  *Dismissal License*: It dismisses the question by appealing to authority: "The experts have settled on this test, so we don't need to debate it." But if there is no consensus (as in the case of cephalopods or AI benchmarks), then this appeal fails.

  *Handling Test Revision*: The institution can revise the test. The reason for revision might come from within the institution (e.g., new data) or from external pressures.

  ---

  **Which reading did the colleague most likely intend?**

  Given the context (a philosophy reading group on comparative cognition) and the way the line was used to dismiss questions, it is likely that the colleague intended a reading that avoids metaphysical debates and focuses on the practical. The **Operational Definition (Claim 1)** is the most common in scientific circles and is nearly trivial. However, the **Decision Procedure (Claim 3)** is also a strong candidate because it directly licenses dismissal by saying we must look to the test.

  But note: the colleague closed a long exchange with this line. The group had been discussing whether a new information-theoretic measure tracks intelligence. The colleague might have been expressing frustration with the lack of resolution and advocating for a pragmatic approach. Therefore, I think the colleague intended either:

  - **Claim 1 (Operational Definition)**: because it is a standard move in science to define a concept by how it is measured, or
  - **Claim 3 (Decision Procedure)**: because it says that the way to settle the question is by using the test.

  However, the colleague's statement was used to dismiss questions in multiple settings, which suggests a more general stance. The radical readings (like Claim 5) are less likely because they are extreme and would invite more debate.

  **Verdict**: The colleague most likely intended **Claim 1 (Operational Definition)** or **Claim 3 (Decision Procedure)**. Both are plausible and can be used to dismiss the question in the specific context of whether a particular measure tracks intelligence (by saying: if we use the test as our definition, then it does by definition). But note that they may not work as well in the other settings (like cephalopods) because the same test may not be applicable.

  ---

  **Menu for the Group**

  Here is a summary of the readings:

  | Claim | Name | Plausibility | Dismissal Power | Handles Test Revision? | Verdict |
  |-------|------|-------------|-----------------|-------------------------|---------|
  | 1 | Operational Definition | High | Moderate (works for the specific measure discussed, but not necessarily for cross-species) | Partially (revision changes the definition, but reason for revision may be external) | **Useful in human contexts and established tests; less so for novel domains.** |
  | 2 | Predictive Claim | Moderate to High (depending on context) | Moderate (if the test is predictive, then it's useful; but if not, then not) | Well (revision for better prediction) | **Good for practical purposes, but doesn't address the nature of intelligence.** |
  | 3 | Decision Procedure | Moderate (if tests exist) | High (if a test exists) | Partially (if we revise, we update the procedure) | **Useful when tests are available and applicable; but may dismiss questions that are not testable.** |
  | 4 | Social Function Claim | Controversial (plausible in human social contexts) | High (reframes the question) | Well (revision for changing social needs) | **Radical and may not be intended; useful in sociology of science.** |
  | 5 | Radical Deflationary | Low | Very High (dismisses the question entirely) | Poor (cannot explain revision based on prior concept) | **Implausible and likely not intended.** |
  | 6 | Institutional Authority | Moderate (if there is consensus) | Moderate (if there is authority) | Well (institution can revise) | **Useful in contexts with strong consensus (like IQ testing in humans).** |

  **Final Note**: The line "intelligence is whatever intelligence tests measure" is often used as a conversation stopper. But as we see, it can mean many things. The group should be aware that in the absence of a clear operational definition (especially in comparative cognition), the question of what intelligence is remains open. Moreover, the observation that we revise tests because we think they were measuring the wrong thing strongly suggests that we have an independent concept of intelligence that the tests are trying to capture. This undermines the radical deflationary claim and to some extent the operational definition. The predictive claim and the decision procedure can survive if we interpret the revision as improving prediction or procedure. The social function claim also survives by attributing revision to social factors.

  Given your colleague's context, I suspect they were advocating for a pragmatic operational definition (Claim 1) or a decision procedure (Claim 3). But the group should note that even these readings do not fully escape the deeper questions when applied to new domains.
answer: |-
  Below is a disambiguation of the line "intelligence is whatever intelligence tests measure," structured as a menu of distinct claims. I've ordered these from nearly trivial (least controversial) to genuinely radical (most controversial), with an analysis of each. For each claim, I provide:  
  - **Precise claim**: A clear formulation.  
  - **Commitments**: What accepting this claim obliges you to.  
  - **Plausibility**: An assessment of its reasonableness.  
  - **Dismissal power**: Whether it licenses dismissing questions in the settings you described (e.g., comparative cognition, machine benchmarks, cephalopods/corvids, natural kinds).  
  - **Handles test revision**: How it accommodates the fact that we sometimes revise tests because we believe they were "measuring the wrong thing."  
  - **Verdict**: A brief judgment.  

  I've also noted which reading your colleague most likely intended, based on the context you provided.  

  ---

  ### **1. Trivial Operationalism (Minimal Pragmatic Definition)**  
  **Precise claim**: Intelligence, *for practical purposes in a given context*, is operationally defined by the tests we use. This is a methodological stance to avoid circular debates and get on with empirical work.  
  **Commitments**: You must accept that intelligence is not directly observable and requires proxy measures. No deeper metaphysical claims are made.  
  **Plausibility**: High. Common in science (e.g., "temperature is what a thermometer measures"). Avoids unproductive debates.  
  **Dismissal power**: Weak to moderate. It licenses dismissing *methodological* questions (e.g., "How do we measure intelligence here?") by insisting tests are the starting point. But it does not dismiss *substantive* questions (e.g., "Does this test capture intelligence in cephalopods?") because operational definitions can be context-specific. In your settings, it might end debates about the information-theoretic measure by treating it as a provisional tool, but it cannot silence questions about cross-species comparisons or natural kinds.  
  **Handles test revision**: Easily. Tests are revised when they fail to align with practical goals (e.g., predicting real-world outcomes). Revision reflects updated operational needs, not a failure to track "true" intelligence.  
  **Verdict**: **Reasonable but limited**. Useful for grounding discussions in data, but too thin to justify dismissing deeper questions.  

  ---

  ### **2. Predictive Utility (Instrumentalist View)**  
  **Precise claim**: Intelligence tests measure a set of capacities that *predict* outcomes we care about (e.g., survival, problem-solving, academic success). Thus, intelligence is whatever maximizes predictive validity for these outcomes.  
  **Commitments**: You must prioritize prediction over explanation. Intelligence is defined by its functional role, not its essence.  
  **Plausibility**: Moderate to high. Aligns with psychometrics (e.g., IQ tests predict job performance) and evolutionary views.  
  **Dismissal power**: Moderate. It licenses dismissing questions about the "true nature" of intelligence (e.g., "Is general intelligence a natural kind?") by shifting focus to utility. In your settings, it could justify the information-theoretic measure if it predicts ecological success, and it might sideline cross-species comparisons if no common predictive framework exists. However, it fails to dismiss questions like "Are cephalopods intelligent?" if tests predict outcomes relevant to their niche.  
  **Handles test revision**: Well. Tests are revised when they lose predictive power (e.g., an IQ test that doesn't predict modern job demands). Revision aims for better instruments, not truth.  
  **Verdict**: **Solid for applied contexts**. Deflects metaphysical debates but doesn't eliminate them; predictive failures can still prompt deeper questions.  

  ---

  ### **3. Decision Procedure (Methodological Rule)**  
  **Precise claim**: The only way to answer questions about intelligence is to administer a test. Intelligence is not a pre-theoretical concept but an output of a measurement protocol.  
  **Commitments**: You must accept that no non-test-based evidence (e.g., anecdotes, evolutionary arguments) counts in intelligence attributions.  
  **Plausibility**: Moderate in controlled settings (e.g., labs), low elsewhere. Reflects a rigid empiricism.  
  **Dismissal power**: Strong. It licenses dismissing *all* untestable questions (e.g., "Are cephalopods and corvids intelligent in the *same sense*?") by declaring them non-empirical. In your settings, it could end debates by reducing intelligence to test scores, making further discussion seem unscientific.  
  **Handles test revision**: Poorly. Revision implies that the procedure was flawed, but the claim offers no criteria for identifying flaws (since it rejects external standards). If we revise a test, we are admitting the procedure was inadequate, undermining the rule.  
  **Verdict**: **Overly restrictive**. Useful for enforcing rigor but collapses when tests evolve, revealing its circularity.  

  ---

  ### **4. Social Function (Constructivist View)**  
  **Precise claim**: Intelligence tests serve social functions (e.g., allocating resources, legitimizing hierarchies), so intelligence is *socially constructed* as whatever these tests measure.  
  **Commitments**: You must accept that intelligence is not a natural property but a product of human practices. Tests reflect cultural values, not universal truths.  
  **Plausibility**: Plausible for human contexts (e.g., IQ tests and education policy); less so for non-humans or AI.  
  **Dismissal power**: High for human-centric questions, low otherwise. It dismisses debates about "true" intelligence (e.g., machine benchmarks) by reframing them as power struggles (e.g., "Whose values do these tests encode?"). In your settings, it could reframe the information-theoretic measure as a tool for human categorization, not a discovery. But it struggles with cross-species cases (e.g., cephalopods) where social functions are absent.  
  **Handles test revision**: Well. Tests are revised when social goals change (e.g., from eugenics to inclusivity). Revision reflects shifting norms, not epistemic progress.  
  **Verdict**: **Insightful but niche**. Powerful for critiquing human testing, but inapplicable to broader questions about cognition.  

  ---

  ### **5. Radical Deflationism (Anti-Realist View)**  
  **Precise claim**: Intelligence has no independent existence; it is *nothing more* than what tests measure. Questions about its "essence" are meaningless.  
  **Commitments**: You must deny that intelligence is a real property of minds/brains/systems. It is a reified label for test scores.  
  **Plausibility**: Low. Contradicts intuitions (e.g., we revise tests to better capture a pre-existing concept) and evidence (e.g., convergent validity across tests).  
  **Dismissal power**: Very strong. It dismisses *all* substantive questions (e.g., "Is general intelligence a natural kind?") as nonsensical. In your settings, it would silence debates by reducing intelligence to a tautology.  
  **Handles test revision**: Very poorly. Revision implies we have independent reasons to think the test was wrong, which requires an external concept of intelligence—contradicting the claim.  
  **Verdict**: **Untenable**. Self-refuting and ignores why we care about intelligence in the first place.  

  ---

  ### **6. Epistemic Authority (Institutional Fiat)**  
  **Precise claim**: The scientific community (or relevant experts) defines intelligence through consensus on tests. Intelligence is what *authorized* tests measure.  
  **Commitments**: You must defer to institutional power (e.g., psychology associations, AI ethics boards).  
  **Plausibility**: Moderate in established fields (e.g., clinical psychology), low in emerging areas (e.g., cephalopod cognition).  
  **Dismissal power**: Moderate to high. It licenses dismissing challenges to consensus tests (e.g., "This machine benchmark is flawed") by appealing to authority. In your settings, it could end debates by treating the information-theoretic measure as provisionally authoritative.  
  **Handles test revision**: Well. Authorities revise tests when new evidence challenges consensus. Revision is a sign of institutional responsiveness, not failure.  
  **Verdict**: **Practical but contingent**. Useful for policy but vulnerable to paradigm shifts (e.g., if authorities are overturned).  

  ---

  ### **Which Reading Did Your Colleague Most Likely Intend?**  
  Given the context—closing a long exchange about a new measure in comparative cognition—your colleague likely intended **#1 (Trivial Operationalism)** or **#3 (Decision Procedure)**. Both are common in scientific circles to halt theoretical debates and focus on empirical work. However, the dismissive tone suggests #3, which more aggressively shuts down questions by making tests the sole arbiter.  

  ### **Summary Verdicts**  
  | Claim | Name | Plausibility | Dismissal Power | Handles Revision | Verdict |  
  |-------|------|-------------|----------------|------------------|---------|  
  | 1 | Trivial Operationalism | ★★★★☆ | ★★☆☆☆ | ★★★★☆ | **Useful but limited**; doesn't justify broad dismissals. |  
  | 2 | Predictive Utility | ★★★★☆ | ★★★☆☆ | ★★★★☆ | **Strong for applied work**; deflects but doesn't eliminate debates. |  
  | 3 | Decision Procedure | ★★☆☆☆ | ★★★★☆ | ★☆☆☆☆ | **Rigid and circular**; licenses dismissal but crumbles under scrutiny. |  
  | 4 | Social Function | ★★★☆☆ | ★★★☆☆ | ★★★★☆ | **Valuable for critique**; irrelevant to non-human cases. |  
  | 5 | Radical Deflationism | ★☆☆☆☆ | ★★★★★ | ★☆☆☆☆ | **Self-defeating**; avoid. |  
  | 6 | Epistemic Authority | ★★★☆☆ | ★★★☆☆ | ★★★★☆ | **Pragmatic**; depends on institutional trust. |  

  ### **Key Takeaways for Your Group**  
  - The line is **not a monolithic claim**. Its meaning ranges from a benign tool for clarity (#1) to a radical denial of intelligence as a real phenomenon (#5).  
  - It **fails as a blanket dismissal** in most readings. Only radical deflationism (#5) fully silences debates, but it is implausible.  
  - **Test revision is a major weakness** for strong readings (e.g., #3 and #5). If we revise tests because they "measured the wrong thing," we imply an independent concept of intelligence that tests approximate—undermining claims that reduce intelligence to test scores.  
  - Your colleague likely used a **pragmatic (#1) or methodological (#3) reading** to cut short theoretical debate. However, neither survives scrutiny in cross-species or machine contexts, where tests are contested.  

  This menu should equip your group to dissect the line's use in future discussions, especially when it risks stifling inquiry into the nature of intelligence.
