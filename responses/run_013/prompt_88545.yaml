  For structure, I'll use the requested frame: present-day narrator (presumably "sick self") reading a letter from his well self. The letter needs to sound like one side of an argument with its own ghost - logical yet vulnerable, firm yet doubting itself. Key phrases should mirror each other: "I know you'll call this a betrayal" / "I know you'll say I never asked for this" etc.

