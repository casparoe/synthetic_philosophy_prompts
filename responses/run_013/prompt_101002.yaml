prompt: |-
  I'm teaching a grad seminar on supererogation this term and I want to spend a session on an analogy a collegue of mine leans on hard. His line is that morality is a pass/fail course with a low pass mark, and supererogatory acts are extra credit: you've satisfied the requirements the moment you clear the bar, and everything above the bar is bonus points you're free to take or leave. He uses it to argue that nobody is ever required to be a saint or a hero, that the demandingness objection to consequentialism is confused (you can't fail a pass/fail course by skipping extra credit), and that we should all stop feeling guilty about not doing more.

  So give me the audit. Start with the mapping -- what plays the role of the pass mark, the assignments, the grader, the curve, the transcript -- then the places the analogy breaks, seperating the breaks that matter for those three conclusions from the ones that don't. I want to know whether a bonus-point picture can even represent what supererogation is supposed to be, and whether his conclusion survives once the disanalogies are on the table or whether the analogy was carrying it the whole time. If there's a better analogy for the floor-and-above picture, tell me what it is.
reasoning: |-
  Okay, the user is teaching a grad seminar on supererogation and wants to discuss an analogy their colleague uses. The colleague compares morality to a pass/fail course with extra credit. The user wants me to audit this analogy thoroughly. Let me start by breaking down the mapping.

  First, the colleague's analogy: morality as a pass/fail course. The pass mark is the minimum moral requirement—what you must do to pass. Supererogatory acts are like extra credit; they're optional and beyond the basics. The assignments represent moral actions, the grader is moral evaluation (maybe society or conscience), the curve could be societal standards, and the transcript is your moral record.

  Now, I need to identify where this analogy breaks down. The key conclusions the colleague draws are: 1) No one is required to be a saint/hero, 2) The demandingness objection to consequentialism is invalid, and 3) We shouldn't feel guilty for not doing more. I should check if these hold when the analogy's flaws are exposed.

  First, the mappings that work. The pass mark as the moral minimum makes sense—duties are the baseline. Extra credit as optional acts aligns with supererogation being praiseworthy but not mandatory. The pass/fail structure reflects a binary moral status: permissible vs. impermissible. This supports the first conclusion that sainthood isn't required.

  But there are significant breaks. Morality's "pass mark" isn't fixed; it can vary by context, unlike a set course requirement. Also, in courses, extra credit is truly optional, but supererogatory acts might feel obligatory in extreme cases (e.g., saving a child from a pond). This challenges the idea that we're never required to be heroes. 

  The demandingness objection to consequentialism argues that it requires too much. The colleague says since supererogation is extra credit, not doing it doesn't fail you. But consequentialism often blurs duty and supererogation; maximizing good might make more acts obligatory. So the analogy might mask how demanding consequentialism really is, weakening the second conclusion.

  Guilt is another point. In courses, skipping extra credit doesn't induce guilt, but in morality, not helping when you could might. The analogy ignores emotional dimensions like agent-regret, which are crucial in ethics. So the third conclusion about not feeling guilty might not hold.

  Also, who's the grader? Morality's evaluation isn't as clear-cut as a professor grading. And the transcript—moral records aren't just pass/fail; they include nuances of character. Plus, extra credit is additive, but supererogation can involve personal sacrifice, which isn't just points.

  The colleague's conclusions partially hold: the floor is real, and beyond that isn't obligatory. But breaks matter: context can raise the floor, consequentialism's demands aren't captured, and guilt might still be appropriate. The analogy might oversimplify, making the conclusions seem stronger than they are.

  Is there a better analogy? Maybe a safety-rated machine: basic standards for operation (duties), but enhancements (supererogation) improve outcomes without being required. Or a building code: minimum safety vs. optional amenities. These better show that exceeding basics is beneficial but not mandatory, though they still might not capture all nuances.

  In sum, the analogy supports minimalism but falters on demandingness and emotional aspects. The colleague's conclusions survive in a minimal deontic framework but struggle against consequentialism or richer moral views. The user should highlight these breaks to show the analogy's limits in their seminar.
answer: |-
  Here's a full audit of the pass/fail course analogy for supererogation, breaking down its structure, strengths, critical breaks, and impact on your colleague's conclusions:

  **Core Mapping in the Analogy:**
  *   **Pass/Fail Course:** Morality as a whole.
  *   **Pass Mark:** The minimum threshold of moral permissibility (fulfilling duties, avoiding wrongdoing).
  *   **Assignments:** Individual actions or choices.
  *   **Passing ("Pass"):** Achieving moral permissibility ("You did enough; you're not blameworthy").
  *   **Failing ("Fail"):** Moral failure/impermissibility (violating duties, doing wrong). Blameworthy.
  *   **Extra Credit:** Supererogatory acts.
  *   **Bonus Points:** The extra moral value/praise-worthiness earned by supererogation.
  *   **Grader:** Moral evaluation (society, conscience, perhaps God). Determines pass/fail and assigns praise for EC.
  *   **Curve:** Contextual factors influencing difficulty/demand? (Analogy weak here - often implied as "normal expectations"). Not central.
  *   **Transcript:** One's overall moral record/character? (Analogy very weak here - morality isn't summarized by a single binary + points).

  **Strengths of the Analogy:**
  1.  **Clarity on the "Floor":** Effectively illustrates the concept of a *minimum threshold* for moral adequacy. You pass by clearing the bar of duty.
  2.  **Optionality of the "Extra":** Captures the core idea that supererogation is *beyond* the call of duty. Doing it is good, not doing it doesn't constitute failure.
  3.  **Binary Status at the Threshold:** Reinforces the distinction between permissible (pass) and impermissible (fail). Supererogation doesn't affect this fundamental status.
  4.  **Supports Conclusion 1 (No Requirement for Sainthood/Heroism):** If sainthood/heroism requires constant supererogation, and supererogation is extra credit, then indeed, sainthood/heroism is *not required* to pass (be morally permissible). This is the analogy's strongest point for the conclusions.

  **Critical Breaks in the Analogy & Impact on Conclusions:**

  1.  **Break: Fixed vs. Contextual Pass Mark:**
      *   **Analogy:** The pass mark (e.g., 60%) is usually fixed and known in advance for a course.
      *   **Morality:** The "pass mark" (minimum duty) is highly context-dependent. What's required changes drastically based on circumstances, abilities, relationships, and roles (e.g., parent vs. stranger, easy rescue vs. immense sacrifice). *Ignoring this makes morality seem simpler and less demanding than it is.*
      *   **Impact on Conclusions:**
          *   **Conclusion 1 (No Requirement for Sainthood):** *Mostly survives.* Even in context, heroic acts usually exceed contextually adjusted duties.
          *   **Conclusion 2 (Demandingness Objection):** **Significantly Weakens.** Consequentialism (especially act-utilitarianism) argues that the "pass mark" *is* constantly shifting upwards based on consequences. What looks like "extra credit" (e.g., donating a kidney to save a stranger) might actually be the *contextually required minimum* to maximize good. The analogy masks this by assuming a fixed, low bar. The demandingness objection claims consequentialism *eliminates* a meaningful "pass mark" below heroism, turning supererogation into obligation. The analogy can't represent this critique fairly.
          *   **Conclusion 3 (No Guilt):** **Weakens.** If the contextually required minimum is higher than the analogy suggests (e.g., you *could* easily save a life but don't), then not acting *can* be failing the real pass mark, warranting guilt. The analogy obscures this possibility.

  2.  **Break: The Nature of "Extra Credit" vs. Supererogation:**
      *   **Analogy:** Extra credit is purely additive, optional, and often low-cost. Skipping it has no negative consequence (beyond missing bonus).
      *   **Morality:** Supererogatory acts often involve:
          *   **Significant Sacrifice:** Real cost, risk, or effort (life, limb, fortune, deep comfort).
          *   **Moral Weight:** Not doing them, *especially when the need is great and the cost to you is reasonable*, can feel (and arguably *should* feel) like a moral *loss* or *regret*, even if not blameworthy failure. There's a sense of *opportunity missed for immense good*.
          *   **Not Always Discrete "Points":** Supererogation can involve character, dispositions, or ongoing commitments, not just isolated "bonus actions."
      *   **Impact on Conclusions:**
          *   **Conclusion 1 (No Requirement):** *Survives.* Sacrifice doesn't make it obligatory.
          *   **Conclusion 2 (Demandingness):** **Highlights the Analogy's Bias.** The analogy makes supererogation seem trivial and cost-free, which downplays the demandingness objection's core concern: that consequentialism demands *costly* acts as obligatory. The analogy stacks the deck against the objection.
          *   **Conclusion 3 (No Guilt):** **Severely Weakens.** The analogy suggests skipping EC is like not doing an optional puzzle – no emotional weight. Morality isn't like that. Failing to perform a significant, possible supererogatory act (e.g., not donating to save lives when you easily could) *can* and arguably *should* generate feelings like regret, shame, or agent-regret (regret focused on one's own role in an outcome), even if not guilt-as-blameworthiness. The analogy dismisses this important dimension of moral psychology. "Feeling bad" isn't always irrational guilt; it can be appropriate recognition of a moral opportunity unfulfilled.

  3.  **Break: The "Grader" and the "Transcript":**
      *   **Analogy:** A single, external authority (professor) applies clear rules. The transcript is a simplified, external record (Pass + Bonus Points).
      *   **Morality:** Evaluation is multi-source (self, others, society, possibly God), often contested, and involves complex judgment. The "record" is one's character, relationships, and impact on the world – rich, nuanced, and not reducible to "Passed + 15 Bonus Points."
      *   **Impact on Conclusions:** Less direct, but reinforces the oversimplification. Morality feels *lived* and *evaluated* differently than a course grade. This makes Conclusion 3 (No Guilt) feel particularly artificial – our internal "grader" (conscience) is more complex than a syllabus.

  4.  **Break: The Point of the Endeavor:**
      *   **Analogy:** The goal is to pass the course (get credit). Extra credit is a nice bonus for the grade.
      *   **Morality:** While avoiding blame is important, many see morality as having a *positive aim*: flourishing, reducing suffering, building good character, fulfilling potential for good. Supererogation isn't just "bonus points"; it's often seen as *realizing the higher potential* of morality and human agency.
      *   **Impact on Conclusions:** Undermines the spirit of Conclusion 3. If morality's point is partly about *achieving good*, not just avoiding bad, then not striving for the "extra" can feel like falling short of the *purpose*, even if not the *minimum requirement*. This fuels the feeling that "I *should* do more," distinct from "I *must* do more or fail."

  **Can the Analogy Represent Supererogation? Does the Conclusion Survive?**

  *   **Representation:** It *can* represent the basic *deontic structure*: a clear floor of obligation/duty and an optional space above it. It captures the core *optionality*.
  *   **Survival of Conclusions:**
      *   **Conclusion 1 (No Requirement for Sainthood/Heroism):** **Largely survives the breaks.** The core logic that exceeding the minimum isn't obligatory holds, even if the minimum is contextually variable. Saints/heroes, by definition, go beyond.
      *   **Conclusion 2 (Demandingness Objection Confused):** **Does not survive intact.** The analogy masks the core of the demandingness objection against consequentialism – that it *collapses* the distinction by raising the "pass mark" contextually to encompass what non-consequentialists see as supererogation. The analogy assumes a stable, low pass mark that consequentialism arguably rejects. It stacks the deck against the objection rather than refuting it.
      *   **Conclusion 3 (Stop Feeling Guilty):** **Does not survive well.** The analogy trivializes the potential moral significance (sacrifice, missed opportunity for great good) and psychological weight (regret, shame) of not performing supererogatory acts when one reasonably could. It fails to account for why people *do* (and perhaps *should*) feel something negative beyond mere absence of bonus points. The conclusion feels glib and psychologically unrealistic.

  **Was the Analogy Carrying the Conclusion?**
  For Conclusion 2 and especially 3, **yes, significantly.** The analogy's portrayal of supererogation as trivial, cost-free "bonus points" and its assumption of a fixed, low pass mark do the heavy lifting to make demandingness seem irrelevant and guilt seem irrational. Once the breaks (contextual demands, cost/sacrifice, moral psychology, consequentialism's shifting bar) are exposed, these conclusions lose much of their intuitive appeal and argumentative force derived *from* the analogy.

  **A Better Analogy for the "Floor-and-Above" Picture:**

  *   **Building Code Analogy:**
      *   **Code Minimum:** Moral duties (safety, structural integrity - must be met).
      *   **Passing Inspection:** Moral permissibility.
      *   **Failing Inspection:** Moral impermissibility.
      *   **Architectural Awards/Enhancements:** Supererogation (beauty, sustainability features, community spaces, exceeding accessibility standards). These are *good*, *praiseworthy*, and *valuable*, but not *required* for the building to be legally occupiable/safe (permissible). You can have a perfectly adequate building without them. However, choosing *not* to include significant, feasible enhancements in a prominent public building might lead to *regret* or *criticism* that it's merely "adequate," not that it's *unsafe* (impermissible).
  *   **Why it's better:**
      *   Retains the core floor/above structure.
      *   Acknowledges that what's "above" can be substantial, valuable, and costly.
      *   Allows for the idea that merely meeting code is "enough" but might be seen as minimally acceptable or lacking ambition in certain contexts.
      *   Better captures the potential for *regret* or *criticism* (not *blame* for failure) when significant, feasible enhancements are omitted. It separates "adequacy" from "excellence" more realistically than bonus points.
      *   Less likely to trivialize supererogation.

  **Summary for Your Seminar:** The pass/fail analogy is a useful, memorable tool for illustrating the *structural* separation of duty and supererogation, supporting the idea that sainthood isn't obligatory. However, it dangerously oversimplifies morality by assuming a fixed, low bar, trivializing the cost and significance of supererogation, and ignoring the contextual nature of duty. This oversimplification artificially props up the arguments against the demandingness objection and against feeling any negative sentiment for not doing more. Exposing these breaks shows that while the "floor" is real, the "above" is richer, more demanding, and more psychologically complex than mere extra credit, and that consequentialism's challenge to the very *existence* of that stable floor cannot be dismissed via this analogy. The Building Code analogy offers a more robust picture of the floor-and-above structure. Focus the discussion on whether morality *has* a stable "pass mark" (especially vs. consequentialism) and the appropriate sentiments surrounding supererogatory opportunities.
