prompt: |-
  I convene a graduate reading group on aggregation in ethics and political philosophy, and we have now spent three sessions failing to agree about the utility monster — the case, introduced by Nozick, of a being whose capacity for welfare so far exceeds anyone else's that ranking outcomes by total welfare requires the rest of us to be sacrificed to it. Our difficulty is not that we disagree about the conclusion; it is that we disagree about what the case is a case *of*. I would like a decision tree that sorts responses to the monster into positions, and I want it organized around the question our discussions never make explicit: where the respondent locates the argument's force — in the theory's axiology, in its rule for aggregating across persons, in its conception of welfare, or in its practical usability.

  A few requirements.

  Root and framing. Begin from the commitment the respondent is presumed to share — that in the stipulated case the sum of welfare (or whatever the theory takes the good to be) is maximized by the sacrifice — and branch by what the respondent denies. Build the space first and the positions second.

  Phrasing. Every node must be a question a reader can answer without knowing which position it leads to: a verdict about a concrete case, or a claim about what the case shows. No node may name a position or an -ism, and no node may simply ask whether one is, say, a prioritarian.

  Cases. These must be used; add others if you need them.

  (a) The classic monster, with a capacity for welfare large enough to outweigh the rest of us no matter how the numbers are distributed.
  (b) A bounded monster, whose capacity is very large but finite, so that no transfer is ever actually forced.
  (c) The reverse case: a being of enormous capacity for suffering, so that the same structure cuts against a view that treats the relief of suffering as the only thing that matters, and appears to demand the sacrifice of everyone's modest goods.
  (d) A parasitic monster, whose bliss is constituted by others' losses, as against one that merely consumes resources others might have used.
  (e) A composite monster that is itself a population, so that "sacrificing the rest of us to it" is itself an aggregation.
  (f) The marginal monster: a policy that harms very many people slightly and benefits one enormously, with the numbers calibrated so that a sum-ranking view must accept it while a view that gives priority to the worse off need not.

  Leaves. Each leaf should carry the name of a position and one sentence on its most awkward commitment. The following must appear somewhere: total utilitarianism that accepts the conclusion; the impossibility response, split into an empirical and a conceptual version if you think those are different positions; average utilitarianism; prioritarianism; a lexical or leximin rule; sufficientarianism; the family of views that reject the demand rather than the ranking, via agent-relative constraints or prerogatives; the person-affecting restriction; value pluralism or incommensurability; Moorean value holism, on which the whole is not the sum of its parts; an objective-list axiology; the epistemic response, on which the case is idle because the relevant magnitudes cannot be measured; and the meta-response that the case begs the question against hedonism. Merge any of these you judge not to be genuinely distinct, and say why.

  Unoccupied combinations. Tell me which combinations of answers nothing occupies, and diagnose each: is the view incoherent, unattractive, or merely unexplored?

  Inseparables. Flag any pairs of leaves the tree cannot separate, and say which further case would separate them.

  Scale. At most four levels of branching, and twelve to sixteen leaves.

  Finally, separate what is settled from what is genuinely contested among people who work on this, and do not present a contested reading of the monster as the consensus. Where a step in your tree depends on a disputed interpretation of what the case is meant to show, mark it as disputed rather than folding it into the structure. No citations, reading lists, or attributions to named authors are needed; where you would want to cite someone, describe the position instead, and if you do name anyone, do not guess at a title or a date.
reasoning: |-
  Hmm, the user is running a graduate reading group on aggregation in ethics and political philosophy. They've spent three sessions stuck on the utility monster problem introduced by Nozick. The core issue isn't disagreement about the conclusion but about what the case actually reveals. They want a decision tree that organizes responses based on where respondents locate the problem: axiology, aggregation rules, welfare conception, or practical usability.

  The user has specific requirements. The tree must start from the shared presumption that welfare sums are maximized by sacrifice in the monster case. Branches should be concrete questions about cases or claims, avoiding position names or -isms. I need to incorporate their listed cases (a-f) and possibly add more. The leaves should name positions with their awkward commitments, covering specified views like total utilitarianism, prioritarianism, and others. I should identify unoccupied combinations and inseparable leaves, while keeping the tree to 4 levels and 12-16 leaves.

  I consider how to structure the tree. The root is the shared presumption: "In the monster case (a), sacrifice maximizes total welfare." The first level branches on what the respondent denies. Options could be denying the axiology (that welfare is the only good), the aggregation rule (sum-ranking), the welfare conception, or practical usability.

  Cases should drive the branches. For example, to test axiology, I can use the reverse monster (c) where suffering relief might conflict with other values. For aggregation rules, the marginal monster (f) can distinguish sum-ranking from prioritarian views. The bounded monster (b) tests whether the problem is theoretical or practical. The parasitic monster (d) might probe welfare conceptions.

  For leaves, I need to map responses to positions. Accepting the conclusion leads to total utilitarianism. Denying axiology might lead to pluralism; denying aggregation could lead to prioritarianism or sufficientarianism. The impossibility response could be split into empirical (monsters don't exist) and conceptual (welfare can't be measured that way).

  Unoccupied combinations might arise. For example, denying both axiology and aggregation might be incoherent if axiology defines the good that aggregation rules handle. If someone denies that welfare is the only good but still uses sum-ranking, it might be unattractive or unexplored.

  Inseparables might occur between positions like lexical prioritarianism and sufficientarianism, which both reject sacrifices but for different reasons. Adding a case with sacrifices below a threshold could distinguish them.

  I aim for clarity: questions must be answerable without knowing positions, using cases to force concrete judgments. For instance: "Does (c) show that suffering relief isn't the only thing that matters?" Yes might lead to pluralism; no might lead to questioning aggregation.

  Finally, I mark disputed interpretations where needed, like whether the monster case assumes interpersonal comparisons of utility, which some views reject. The epistemic response fits here, denying practical usability.

  After planning, I'll build the tree step by step, ensuring it covers all required positions and stays within scale limits.
answer: |-
  ### Decision Tree: Locating the Force of the Utility Monster

  **Root Presumption:**  
  *In case (a), sacrifice maximizes the sum of welfare (or the theory's designated good).*

  ---

  #### Level 1: What does the respondent deny?  
  **Q1:** *Does case (c) (reverse monster) show that a theory focused solely on relieving suffering must endorse catastrophic sacrifice, and is this a fatal flaw?*  
  - **Yes** → Proceed to **Q2** (denies the axiology is complete).  
  - **No** → Proceed to **Q3** (denies the aggregation rule or welfare conception).  

  #### Level 2A (from "Yes" to Q1):  
  **Q2:** *Does case (d) (parasitic monster) show that welfare cannot be defined independently of how it is produced?*  
  - **Yes** → **Leaf: Objective-List Axiology**  
    *(Awkward: Must defend a specific list of goods without circularity.)*  
  - **No** → **Leaf: Value Pluralism/Incommensurability**  
    *(Awkward: Cannot always rank outcomes when values conflict.)*  

  #### Level 2B (from "No" to Q1):  
  **Q3:** *Does case (f) (marginal monster) show that sum-ranking is defective even when total gains outweigh total losses?*  
  - **Yes** → Proceed to **Q4** (denies the aggregation rule).  
  - **No** → Proceed to **Q5** (denies the welfare conception or usability).  

  #### Level 3A (from "Yes" to Q3):  
  **Q4:** *Does case (b) (bounded monster) show that aggregation rules must avoid *any* sacrifice to extreme capacity, even in theory?*  
  - **Yes** → **Leaf: Lexical Prioritarianism/Leximin**  
    *(Awkward: May ignore large benefits to many if the worst-off lose minimally.)*  
  - **No** → Proceed to **Q6** (denies prioritarianism).  

  #### Level 3B (from "No" to Q3):  
  **Q5:** *Does case (a) require interpersonal comparisons of welfare that are impossible in practice?*  
  - **Yes** → **Leaf: Epistemic Response**  
    *(Awkward: Cannot resolve real cases involving extreme inequality.)*  
  - **No** → Proceed to **Q7** (denies welfare conception).  

  #### Level 4A (from "No" to Q4):  
  **Q6:** *Does case (e) (composite monster) show that "sacrifice" is incoherent when groups are traded for groups?*  
  - **Yes** → **Leaf: Person-Affecting Restriction**  
    *(Awkward: Cannot condemn harm-free population increases.)*  
  - **No** → **Leaf: Prioritarianism**  
    *(Awkward: Must quantify how much extra weight the worst-off deserve.)*  

  #### Level 4B (from "No" to Q5):  
  **Q7:** *Does case (d) (parasitic monster) show that welfare is not a measurable quantity?*  
  - **Yes** → **Leaf: Conceptual Impossibility**  
    *(Awkward: Welfare comparisons are meaningless, undermining most aggregation.)*  
  - **No** → **Leaf: Empirical Impossibility**  
    *(Awkward: Actual beings lack such extreme capacities, making the case irrelevant.)*  

  #### Level 4C (from "No" to Q5, alternate path):  
  **Q8 (from "No" to Q3):** *Does case (a) violate constraints on how agents may treat others?*  
  - **Yes** → **Leaf: Agent-Relative Constraints/Prerogatives**  
    *(Awkward: May forbid saving many lives if it requires violating a right.)*  
  - **No** → **Leaf: Total Utilitarianism (Accepting Conclusion)**  
    *(Awkward: Endorses sacrificing innocents to the monster.)*  

  #### Level 4D (from "No" to Q4):  
  **Q9:** *Does case (f) (marginal monster) show that losses to the worst-off matter more than equivalent gains to others?*  
  - **Yes** → **Leaf: Sufficientarianism**  
    *(Awkward: Cannot explain why benefits *above* a threshold matter less.)*  
  - **No** → **Leaf: Average Utilitarianism**  
    *(Awkward: Prefers a tiny happy population over a vast moderately happy one.)*  

  ---

  ### Leaves (12 Positions):
  1. **Total Utilitarianism (Accepting Conclusion)**  
     *(Awkward: Sacrificing innocents to the monster is obligatory.)*  
  2. **Conceptual Impossibility**  
     *(Awkward: Welfare is incoherent, so aggregation is meaningless.)*  
  3. **Empirical Impossibility**  
     *(Awkward: Actual beings have bounded capacities, so the case is irrelevant.)*  
  4. **Average Utilitarianism**  
     *(Awkward: Prefers a world with 1 happy being over 9 billion slightly less happy beings.)*  
  5. **Prioritarianism**  
     *(Awkward: Arbitrariness in assigning priority weights.)*  
  6. **Lexical Prioritarianism/Leximin**  
     *(Awkward: Ignores large benefits if the worst-off lose anything.)*  
  7. **Sufficientarianism**  
     *(Awkward: No urgency to help those above the threshold.)*  
  8. **Agent-Relative Constraints/Prerogatives**  
     *(Awkward: May fail to minimize rights-violations overall.)*  
  9. **Person-Affecting Restriction**  
     *(Awkward: Cannot condemn painless extinction of future generations.)*  
  10. **Value Pluralism/Incommensurability**  
      *(Awkward: Cannot rank outcomes when values clash.)*  
  11. **Objective-List Axiology**  
      *(Awkward: Must defend a non-arbitrary list of goods.)*  
  12. **Epistemic Response**  
      *(Awkward: Paralyzed in real policy decisions.)*  

  *(Moorean holism merged with objective-list axiology; both deny welfare is additive. Meta-response to hedonism merged with conceptual impossibility; both deny welfare’s measurability.)*  

  ---

  ### Unoccupied Combinations & Diagnoses:  
  - **Deny axiology (Q1→Yes) + Deny aggregation (Q3→Yes)** → *Incoherent*. If values are plural (axiology denial), rejecting aggregation is redundant; pluralism already avoids sum-ranking.  
  - **Deny usability (Q5→Yes) + Deny welfare (Q7→Yes)** → *Unattractive*. If welfare is unmeasurable *and* incomparable, ethics lacks tools for most decisions.  
  - **Accept agent-relativity (Q8→Yes) + Accept composite monster (Q6→Yes)** → *Unexplored*. No major theory combines group-focused constraints with person-affecting logic.  

  ### Inseparables & Resolving Cases:  
  - **Prioritarianism vs. Sufficientarianism** → Both answer "Yes" to Q3 and "No" to Q4. *Separate with a case where many are slightly below a threshold vs. one far below*.  
  - **Leximin vs. Agent-Relative Constraints** → Both answer "Yes" to Q4. *Separate with a case where sacrificing one slightly worsens the worst-off but saves many*.  
  - **Empirical vs. Epistemic Impossibility** → Both answer "No" to Q3 and "Yes" to Q5. *Separate by asking if measurements are *impossible* (epistemic) or monsters *impossible* (empirical)*.  

  ### Disputed Interpretations (Marked in Tree):  
  - **Q1 (reverse monster)**: Disputed whether suffering-focused theories *must* endorse sacrifice.  
  - **Q4 (bounded monster)**: Disputed whether "theoretical" sacrifices are problematic if never actual.  
  - **Q6 (composite monster)**: Disputed whether groups can be "sacrificed" in a morally relevant way.  

  ### Settled vs. Contested:  
  - **Settled**: All positions agree the monster *threatens* sum-ranking if welfare is additive and measurable.  
  - **Contested**: Whether the case reveals a flaw in aggregation (prioritarians), axiology (pluralists), or welfare (impossibilists). No consensus exists—your group’s stalemate reflects the field. The tree makes these fault lines explicit.
