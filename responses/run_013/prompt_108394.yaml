prompt: |-
  I'm a junior in high school and I've been messing around making little games in Godot for about a year, and I'm also kind of obsessed with TAS videos (tool-assisted speedruns). Here's the thing thats been bugging me: in a game everything is deterministic — same seed, same inputs, same frames, every time. If a replay desyncs it's because some float got rounded differently, not because the game "chose" otherwise. And yet you literally cannot say what a Mario 64 speedrunner's run looks like at frame 30,000 without just running the thing, and TASers pull off stuff that looks like magic precisely *because* they lean on the determinism. So "deterministic" and "predictable" are clearly not the same word, and "chaotic" clearly doesn't mean "random." I've also got this vague sense that philosophers argue about determinism and predictability and chaos and whether the world could be deterministic but unpredictable, and honestly it feels like my game vocabulary already has all of this sorted out. One thing I already notice: even the random stuff in my game is just a formula off a seed, so "random" in my world always ends up meaning "I don't know the seed" — not sure if that's cheating or the whole point.

  So here's what I want. Restate the actual philosophical debate about determinism, predictability, and chaos as faithfully as you can in my vocabulary — game loop, fixed timestep, RNG seed, save states, desync, hitboxes, floating point rounding, frame-perfect inputs, engine, the whole thing. Then give me the residue report: what in the philosophers' debate survives the translation completely, what only survives if you bend my words a bit (say where you're bending), and what has no counterpart at all in how a game works. And then the part I actually care about — is the stuff that doesn't survive a sign that my framework is missing something real, or is it a sign that the philosophers are confused and the game view is just cleaner? I genuinly can't tell whether "the world is deterministic" is the same kind of claim as "my game is deterministic" or whether that's just an artifact of how games get built.

  Don't open with "great question" or anything like that and don't restate what I asked. Lead with your bottom line in the first sentence, then give me the reasoning.
