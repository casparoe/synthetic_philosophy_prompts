prompt: |-
  My mate and I just spent two hours arguing about whether knowledge really depends on the practical stakes or whether "knows" just shifts meaning from conversation to conversation, and by the end I honestly couldn't tell if those were even different claims. Give me an example of a conceptual issue that actually pulls them apart — and not the bank case or the airport case, I've heard those a hundred times. Bonus if it's a case where the person doing the attributing is the one with skin in the game rather than the person being said to know. Then tell me which side your example leans toward and why.
