answer: |-
  Here is your question-period preparation sheet, prioritizing the six most damaging objections tailored to your panelists’ expertise. I've ordered them by potential damage, included panelist-specific phrasing, rebuttals, soft spots, concessions, and survival-critical points. The goal is strategic defense within 25 minutes.

  ---

  ### **1. Cultural Psychologist: "Compliance Capital Lacks Discriminant Validity"**  
  *Phrased as:* "You’ve relabelled 'tightness-looseness' as 'compliance capital' but added no new predictive power. What does your construct explain that existing cultural latitude measures don’t? Where’s the discriminant validity?"  
  **Rebuttal (2 mins):** "Tightness-looseness captures *tolerance for deviance*; compliance capital quantifies the *depletable stock* enabling rule *absorption*. My construct uniquely predicts collapse points: societies high in tightness but low in capital (e.g., over-legislated democracies) show abrupt compliance collapse when marginal rules exceed replenishment rates. Your measures don’t model depletion dynamics."  
  **Soft Spot:** Admits capital is inferred (e.g., via abrupt compliance drops), not directly measured.  
  **Concede?** Briefly in talk: "Like social capital, compliance capital is latent—but its effects are observable."  

  ### **2. Behavioural Economist: "Compliance as Habit-Forming Undermines Your Asymmetry"**  
  *Phrased as:* "If compliance is reinforcing, your 'stock' appreciates with use. Why wouldn’t marginal costs *fall*? Show me the cost function where depletion dominates reinforcement."  
  **Rebuttal:** "Reinforcement applies to *specific* rules (e.g., buckling seatbelts), but capital is *generalized* compliance willingness. Cognitive load theory shows decision fatigue erodes generic rule-following. My trade-off function: **Marginal cost = (Baseline depletion rate) / (1 - Enforcement yield)²**. Depletion dominates when yield is low (sporadic enforcement)."  
  **Soft Spot:** Your function is illustrative, not empirically derived.  
  **Concede?** No—this is core to your asymmetry claim.  

  ### **3. Legal Philosopher: "Legitimacy Precedes Compliance, Not Quantity"**  
  *Phrased as:* "You reduce authority to a 'stock' of acquiescence. But if rules lack *legitimate authority*—grounded in subjects’ normative reasons to comply—no quantity of enforcement can create obligation. Why prioritize your metric over legitimacy?"  
  **Rebuttal:** "Legitimacy *builds* compliance capital (e.g., paying taxes perceived as fair). But legitimacy alone can’t explain why societies with similar legitimacy scores (e.g., Denmark vs. Sweden) tolerate different regulatory burdens. My model shows how legitimacy’s *output*—willing compliance—is exhaustible even when input legitimacy is stable."  
  **Soft Spot:** Conflates legitimacy (normative) with compliance (behavioral).  
  **Concede?** **YES, upfront:** "Legitimacy is necessary but insufficient—high legitimacy societies still face depletion."  

  ### **4. Public Health Official: "Your Thesis Paralyzes Necessary Non-Enforceable Guidance"**  
  *Phrased as:* "During COVID, unenforceable guidance (e.g., masking) saved lives despite imperfect adherence. By your logic, we shouldn’t issue such rules. Isn’t this dangerously rigid?"  
  **Rebuttal:** "The substitution thesis *supports* your approach: Fewer rules + high enforcement yield (e.g., Japan’s targeted lockdowns) outperform many unenforceable rules. My model praises societies that prioritize enforceability. Emergencies demand triage: issue *only* guidance with high yield potential, withdrawing low-yield rules to preserve capital."  
  **Soft Spot:** Doesn’t address "necessary but unenforceable" dilemmas.  
  **Concede?** No—reframe as a tool for prioritization.  

  ### **5. Cultural Psychologist #2: "Compliance Capital Is a Metaphor, Not a Mechanism"**  
  *Phrased as:* "Calling compliance a 'capital stock' is metaphorical hand-waving. Where’s the cognitive mechanism? How do you operationalize 'drawing down' versus context-specific defiance?"  
  **Rebuttal:** "Mechanisms include: (1) *Attention scarcity* (rules compete for cognitive bandwidth); (2) *Normative entropy* (visible non-enforcement erodes default compliance). We proxy capital via high-stakes rule-breaking (e.g., tax evasion) when low-stakes rules proliferate. Your own work on cultural fatigue aligns with this."  
  **Soft Spot:** Proxies are indirect; no neural/behavioral evidence.  
  **Concede?** Briefly: "Mechanisms need further study—but depletion patterns are robust."  

  ### **6. Behavioural Economist #2: "Your Evidence Doesn’t Establish Causality"**  
  *Phrased as:* "Cross-national correlation of rule counts and self-reported compliance? That’s endogeneity city. How do you identify causal direction? Did high compliance enable more rules, or did rules deplete compliance?"  
  **Rebuttal:** "I exploit *longitudinal* shocks: (1) Post-Soviet states saw compliance collapse after sudden rule proliferation; (2) Singapore’s phased enforcement increased capital. The asymmetry (declining marginal authority) appears only if depletion dominates."  
  **Soft Spot:** Natural experiments aren’t randomized; confounding variables.  
  **Concede?** **CRITICAL—PAPER SURVIVAL DEPENDS HERE:** "Causality isn’t proven, but the model predicts observed collapses. Falsifiable implication: Societies adding rules faster than capital replenishment (e.g., civic trust) will show accelerating defiance."  

  ---

  ### **The Question You Hope Nobody Asks:**  
  **"What if compliance capital isn’t fungible?**  
  e.g., Complying with dress codes doesn’t ‘deplete’ willingness to pay taxes. Doesn’t this fracture your model into domain-specific stocks, making ‘societal regulation’ incoherent?"  

  **Honest Answer:**  
  > "It *might*. I assume generalized capital for parsimony, but if compliance is hyper-specialized (e.g., ‘tax morality’ vs. ‘civic norms’), my aggregate claims collapse. However, domain-generality is evidenced by cross-domain spillover (e.g., low littering correlating with tax compliance). If pressed, I’d retreat to ‘regulation clusters’ sharing capital pools."  
  **Survival:** Barely—specialization undermines your societal-level claims.  

  ---

  ### **Summary Strategy**  
  - **Concede upfront:** Legitimacy is foundational but doesn’t explain depletion (disarm philosopher).  
  - **Survival depends on:** Defending causal plausibility of depletion using shocks (Objection #6).  
  - **Pre-empt metaphors:** Describe mechanisms (attention scarcity, entropy) early.  
  - **Avoid:** Over-claiming empirical proof; stress predictive utility.  
  - **Time allocation:** Spend most time on Objections #2 (economist’s asymmetry) and #6 (causality).  

  This sheet prepares you for 90% of high-damage critiques. If the "non-fungibility" question arises, pivot to spillover evidence—but it’s the deepest threat. Good luck.
