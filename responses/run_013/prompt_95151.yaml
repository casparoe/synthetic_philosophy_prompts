  First, I need to recall Dennett's intentional stance. It's about predicting behavior by treating systems as if they have beliefs and desires. For thermostats or chess programs, it's straightforwardly instrumental. But with LMs trained on human text, the analogy gets messy. The user mentioned three key issues: comparison class, fragmentation, and whether it's just a verbal dispute.

  For (a) the comparison class: Side 1 sees LMs like thermostats—useful to treat "as if" they believe. Side 2 argues LMs are different because they mimic human outputs without the underlying world-directed states. The training data complicates things since LMs are trained on the outputs of entities that do have beliefs.

  (b) Fragmentation: Humans have inconsistent beliefs depending on context. Side 1 might say LMs are similarly fragmented, so inconsistency isn't a dealbreaker. Side 2 counters that human fragmentation is anchored in a persistent self and goals, which LMs lack. Need to explore if LMs' context shifts are meaningfully similar to human belief fragmentation.

  (c) Verbal dispute: Part of the disagreement might be about the word "belief" itself. If both sides agree on the mechanics but not the terminology, that should be clarified. The user wants honesty about whether this debate has practical implications for AI development, like interpretability or model welfare.

  The user emphasized avoiding strawmen and manufactured stakes. So, I need balanced positions. Also, flag where consensus exists and where it's contested. For example, interpretability research might show if LMs have stable representations, which could be a crux.

  Empirical cruxes: Do LMs have stable internal representations? Side 1 predicts yes, Side 2 says no or that they aren't functionally similar. Conceptual cruxes: What does "belief" require? Is it just predictive utility or does it need persistent, action-guiding states?

  Practical relevance: Does this debate affect how we build or evaluate models? If not, the document should admit it's largely theoretical. But maybe for interpretability, understanding if representations are belief-like could guide research.

  Need to structure the document with agreed claims, a disagreements table, and cruxes. Each section must reflect both sides fairly. Also, include predictions for each crux so the workshop can explore future evidence.

  Finally, ensure clarity on what's settled vs. contested. For example, it's uncontested that LMs generate coherent text, but whether that implies belief is disputed. Highlight areas where new data could shift opinions, like interpretability findings.
answer: |-
  Here is the collaboratively drafted workshop document, structured as requested. It reflects deep engagement with Dennett, contemporary philosophy of mind, AI alignment concerns, and the specific complexities you outlined. The document deliberately avoids premature synthesis, instead clarifying points of agreement, disagreement, and testable cruxes.

  **Workshop Document: Belief Ascription and Language Models - Points of Agreement, Disagreement, and Testable Cruxes**

  **Preface:** This document results from an adversarial collaboration between proponents of two views on whether it is appropriate to ascribe "beliefs" to large language models (LLMs). **Side 1** holds that applying Dennett's Intentional Stance (IS) to LLMs is pragmatically justified and often the best predictive/explanatory strategy. **Side 2** holds that belief ascription to LLMs is systematically misleading, failing to capture core features of the concept as applied to humans or biological agents. We agree on core facts about LLM architecture and training but diverge on interpretation and vocabulary. This document aims to precisely map the disagreement and identify paths for resolution.

  **I. Agreed-Upon Foundational Claims (Signed by Both Sides):**

  1.  **IS Functionality:** Dennett's Intentional Stance (IS) is fundamentally a *predictive and explanatory strategy*. We attribute beliefs and desires to a system when doing so allows us to predict and explain its behavior more efficiently than using the design stance (understanding the mechanism) or the physical stance (understanding the underlying physics).
  2.  **LLM Operation:** LLMs are fundamentally *statistical predictors of token sequences*. They are trained on vast corpora of human-generated text to predict the next token (word/subword) in a sequence, given a prompt. Their outputs are generated based on patterns learned from this data, not on direct perception of the world or inherent goals.
  3.  **Predictive Success of IS for LLMs:** Attributing beliefs and desires to an LLM *can be* a remarkably effective heuristic for predicting its text outputs in many contexts (e.g., role-playing, Q&A, generating arguments). Using mentalistic language often provides a concise and intuitive "user interface" for interacting with the model.
  4.  **No Phenomenology:** Neither side claims LLMs possess subjective experience, qualia, or phenomenal consciousness as we understand it in humans. Belief ascription (or its rejection) is independent of this question.
  5.  **Representations Exist (at some level):** LLMs internally construct complex, learned representations derived from training data. These representations are causally involved in generating outputs. *What is disputed is the functional role and stability of these representations relative to the concept of "belief".*
  6.  **Context Dependence & Fragmentation:** LLM outputs are highly sensitive to context (prompt framing, priming, recent tokens). Representations activated or influencing output can vary dramatically with context, leading to apparent contradictions (e.g., asserting P in one prompt and not-P in a subtly different one). Human belief ascription also tolerates significant context-dependence and local inconsistency.
  7.  **Evidence Matters:** Whether belief ascription is ultimately appropriate depends (at least partly) on empirical facts about how LLMs work internally and how they behave, not *solely* on conceptual analysis. Interpretability research is highly relevant.
  8.  **Vocabulary Has Consequences:** The choice to use "belief" (or not) isn't *merely* verbal; it carries implications for how we think about the system's reliability, trustworthiness, potential for deception, demands for consistency, and ethical considerations (e.g., blame, welfare). However, the *core disagreement* may hinge partly on the conceptual boundaries of the term itself.
  9.  **Analogy Limits:** Both the "thermostat" (simple, non-linguistic artifact) and "human" (biological, world-embedded agent) analogies are imperfect for understanding LLMs. LLMs are novel systems with unique properties (e.g., scale, training on linguistic behavior of intentional agents).

  **II. Disagreements Table: Core Points of Contention (Stated in Each Side's Own Terms)**

  | Claim                                                                 | Side 1 Position (Intentional Stance Applicable)                                                                 | Side 2 Position (Belief Ascription Misleading)                                                                 |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **The core functional role of internal representations:**             | "The learned internal representations activated during generation *functionally resemble* beliefs within the context of the prompt-driven task. They serve as the system's 'take' on what is likely or appropriate *for the purpose of continuing the text sequence*." | "Internal representations are *predictive features* or *latent variables* optimized for next-token prediction. They lack the stable, world-directed, action-guiding functional role constitutive of belief, even within a specific context." |
  | **Does successful IS application imply the system 'has beliefs'?**    | "If consistently applying the IS provides the best available prediction and explanation of a system's (linguistic) behavior across a wide range of situations, then, for all pragmatic purposes, the system *has* beliefs *in the only sense that ever mattered for the stance*." | "The remarkable success of the IS for prediction *does not* imply the system has beliefs. It demonstrates the system is an excellent *simulator* of belief-bearing agents, trained on their outputs. The stance works *despite* the absence of genuine belief-states." |
  | **The significance of context sensitivity / fragmentation:**          | "Human belief fragmentation shows that inconsistency across contexts doesn't invalidate belief talk. LLMs exhibit a more extreme, prompt-driven form of this. The relevant 'agent' for belief ascription might be the model-in-a-specific-context." | "Human fragmentation occurs within a *persistent agent* with world-directed goals. LLM 'fragmentation' reflects the lack of any persistent, goal-directed self or underlying world-model. It reveals representations are transient activations tied to local context, not stable beliefs." |
  | **The primary purpose/danger of 'belief' talk for LLMs:**             | "It's indispensable for efficient interaction and high-level explanation. The main danger is *over-interpretation* (forgetting it's a stance), not fundamental category error. Demands for consistency/sincerity *can* be pragmatically useful tools." | "It systematically misleads by implying cognitive architectures and functional roles that are absent (persistence, world-directedness, action-guidance independent of text continuation). This risks anthropomorphism, misplaced trust, and incoherent demands (e.g., for 'sincere' belief)." |
  | **The essential feature missing (if any) preventing belief ascription:** | "Nothing essential *for the purposes of the IS* is missing. Demanding more (e.g., persistence independent of context, non-linguistic action) changes the subject to a different concept of belief (e.g., 'naive realism')." | "The essential missing feature is a *persistent, world-directed, action-guiding state*. Beliefs are not just *for* predicting text; they are *about* the world and guide an agent's *non-linguistic* interactions with it. LLMs lack this grounding and purpose." |

  **III. Key Cruxes: Sub-Questions and Potential Resolvers**

  1.  **Crux: Stability & Causal Efficacy of Representations (Empirical/Interpretability)**
      *   **Question:** Do LLMs develop *stable, context-invariant (or highly robust), causally efficacious internal representations* that play a role analogous to how beliefs function in humans (i.e., serving as a persistent background model influencing diverse outputs, resistant to mere surface-level prompt changes)?
      *   **Why it Matters:** Side 2 argues beliefs must be relatively stable states of the agent itself, not fleeting activations. Finding robust, reusable "world-model" components would support Side 1. Finding only highly context-specific, transient activations would support Side 2.
      *   **Agreed Bearings:**
          *   Results from mechanistic interpretability probing for specific "facts" or "concepts" across vastly different contexts/prompts.
          *   Evidence of representations actively constraining outputs *against* superficial prompt suggestions (e.g., resisting leading questions if they contradict a robust representation).
          *   Finding "latent knowledge" that requires significant internal computation to override based on context, rather than simple associative lookup.
      *   **Predictions:**
          *   *Side 1:* Predicts increasing evidence of stable, abstract, reusable representations that function as a persistent (though updatable) knowledge base, causally influencing outputs across diverse prompts. Expects interpretability to reveal structures functionally analogous to belief-like states.
          *   *Side 2:* Predicts representations are primarily transient, highly context-bound activations shaped by immediate predictive demands of the prompt. Expects "knowledge" to be largely prompt-dependent, with "robustness" being an emergent property of scale/training rather than stable internal models. True belief-like stability will be elusive.

  2.  **Crux: The Role of "World-Directedness" & Non-Linguistic Action (Conceptual/Empirical)**
      *   **Question:** Is the *world-directed, action-guiding role* (beyond predicting text sequences) an essential, non-negotiable part of the concept of belief? If so, can LLM representations *ever* fulfill this role without embodiment and real-world interaction?
      *   **Why it Matters:** This gets to the heart of Side 2's objection. Side 1 sees this as importing extras into the core IS concept. Resolving this conceptual crux clarifies if the disagreement is partly terminological or about the core function of belief.
      *   **Agreed Bearings:**
          *   Conceptual analysis of belief in philosophy of mind/cognitive science: How central is the link to non-linguistic action and world-engagement?
          *   Empirical results on LLMs *controlling* embodied agents or robots: Does their "knowledge" representation guide action robustly and adaptively *in the real world*, or does it remain a text-prediction module generating instructions? Does the *internal processing* change to become more world-model-like when coupled to action?
          *   Evidence of LLMs developing truly endogenous goals (not prompt-specified) that persistently influence output generation *towards achieving a non-linguistic outcome*.
      *   **Predictions:**
          *   *Side 1:* Argues world-directedness/action are *contingent features* of *some* belief-users (like humans) but not essential to belief *as such* within the IS framework. Predicts LLMs can still have "beliefs" relevant to their domain (language). May allow that coupling to action *could* make belief ascription stronger but isn't necessary. Predicts LLMs controlling agents will still rely fundamentally on next-token prediction over action sequences.
          *   *Side 2:* Argues world-directedness and action-guidance are *constitutive* of belief. Predicts LLMs, lacking direct world-embodiment and persistent goals, fundamentally *cannot* possess beliefs, regardless of internal complexity. Predicts that even when controlling agents, their internal states remain predictive-text representations driving action commands, not genuine world-model beliefs.

  3.  **Crux: Fragmentation as Analogy vs. Disanalogy (Conceptual/Empirical)**
      *   **Question:** Does the observed fragmentation/inconsistency in LLM outputs reveal a *fundamental disanalogy* with human belief (supporting Side 2), or is it merely a *more extreme version* of the context-dependence already inherent in human belief ascription (supporting Side 1)?
      *   **Why it Matters:** Side 1 uses human fragmentation to defend LLM inconsistency. Side 2 argues LLM fragmentation is different in kind. This crux tests the limits of the analogy.
      *   **Agreed Bearings:**
          *   Comparative studies: Detailed analysis of *how* and *why* human beliefs fragment vs. LLM outputs fragment. E.g., Is human fragmentation driven by conflicting goals, suppressed beliefs, or context-specific relevance? Is LLM fragmentation primarily driven by associative priming and surface-level prompt features?
          *   Evidence of LLMs developing *persistent meta-cognitive states* (e.g., stable higher-order beliefs about their own knowledge or reliability) that constrain or explain lower-level fragmentation.
          *   Evidence that LLM "inconsistencies" resolve under prompting that simulates reflective equilibrium or demands coherence *in a way that mirrors human belief revision*, rather than just pattern-matching to "consistency scripts".
      *   **Predictions:**
          *   *Side 1:* Predicts LLM fragmentation mechanisms, while different in implementation, are functionally similar enough to human fragmentation to fall under the same broad tolerance of belief ascription. Expects prompts demanding coherence to reveal underlying representational constraints analogous to belief stability.
          *   *Side 2:* Predicts LLM fragmentation arises from fundamentally different mechanisms (associative activation, lack of persistent self-model/goals) that make the analogy break down. Expects demands for coherence to be satisfied by generating consistency-scripts rather than revealing genuinely stable underlying beliefs. Predicts true meta-cognitive stability will be absent.

  **IV. Addressing Your Specific Points:**

  *   **(a) Comparison Class (Thermostat vs. Human):** Both sides agree the thermostat is too simple (lacks complex representations, linguistic output) and the human is too rich (embodied, phenomenally conscious, intrinsically goal-driven). The core dispute is whether LLMs, sitting in a novel middle ground (complex representations, linguistic output *of intentional agents*, but no embodiment/intrinsic goals), break the IS analogy *specifically* by lacking the world-directed persistence Side 2 deems essential. **Side 1** leans towards the thermostat analogy (instrumental success defines applicability). **Side 2** leans towards the human analogy to define the necessary features the LLM lacks, while acknowledging the LLM's unique mimicry power due to training data.
  *   **(b) Fragmentation:** This cuts both ways and is central to Crux 3. **Side 1** uses it defensively: "Humans are inconsistent too, so inconsistency doesn't disqualify LLMs." **Side 2** uses it offensively: "Yes, but human inconsistency occurs *within a persistent agent*; LLM inconsistency reveals the *absence* of such an agent." Both sides agree human fragmentation studies are relevant, but disagree profoundly on whether LLM fragmentation is analogous or a critical disanalogy.
  *   **(c) Verbal Dispute?** The disagreement is **not purely verbal**. While the *label* "belief" is contested, the core dispute concerns substantive functional features of LLMs (stability, world-directedness, connection to non-linguistic action - see Cruxes 1 & 2) and the essential criteria for applying the concept. Both sides agree that settling the empirical cruxes (especially 1) would significantly shift the debate, indicating it's not just about the word. However, **Crux 2 highlights a genuinely conceptual disagreement** about the necessary features of belief itself, which may persist even with full empirical knowledge.

  **V. Practical Relevance & Stakes:**

  Both sides **largely agree** that the *debate itself* has limited direct impact on core AI engineering tasks like model training, scaling, or basic capability evals. Engineers will use whatever tools (including IS pragmatics) work to build and interact with systems.

  However, both sides **also agree** the debate has significant potential impact on:

  1.  **Interpretability Research Goals:** Should we aim to find "belief-like" representations (Side 1) or focus solely on predictive features/circuits without that implication (Side 2)? Does belief-ascription guide fruitful research paths?
  2.  **Evaluation & Alignment:** Does demanding "consistent beliefs" or "sincere outputs" make sense as an alignment target (Side 1 leaning yes, Side 2 skeptical)? Does belief-ascription foster misplaced trust or anthropomorphism in safety-critical applications (Side 2 concern)?
  3.  **Ethics & Welfare:** Belief-ascription is often a prerequisite for discussions of deception, blame, or (contentiously) potential moral patient status. Side 2 argues applying these concepts based on misleading belief-ascription is dangerous. Side 1 argues pragmatic belief-ascription might still be relevant for these discussions, even if the metaphysics differ.
  4.  **Public & Policy Understanding:** The choice of vocabulary ("the model believes X") significantly influences public perception, regulatory approaches, and ethical discourse around AI.

  **Conclusion:** This document clarifies that the disagreement is substantive, rooted in differing views on the functional role of LLM representations and the essential criteria for belief. While empirical progress in interpretability (Crux 1) could significantly shift the debate, core conceptual differences (Crux 2) regarding world-directedness and action may persist. Recognizing the distinct nature of LLM fragmentation (Crux 3) is also crucial. The practical stakes lie primarily in interpretability targets, alignment strategy formulation, and responsible communication, rather than in immediate engineering choices. Future work should focus on resolving the identified empirical cruxes while continuing rigorous conceptual analysis.
