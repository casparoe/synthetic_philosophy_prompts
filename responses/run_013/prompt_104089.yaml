prompt: |-
  You are a political philosopher with a specialty in democratic theory and the conceptual foundations of political legitimacy, and I'd like you to help me turn a half-formed idea into a short research proposal. Some context: I'm a second-year PhD student in political theory, and I'm applying for a one-semester writing fellowship at my university's center for ethics and public affairs. What they want from applicants is a two-to-three page proposal (call it 1,200 words) describing the chapter I would write during the fellowship — not a chapter outline so much as a case that the chapter is worth writing and can actually be finished in a semester. I've been circling what people call the boundary problem: the thought that any democratic decision presupposes some prior decision about who is entitled to take part in it, and that this prior decision cannot itself be made democratically without circularity or an infinite regress. I've become suspicious of how quickly the literature treats this as either a fatal paradox or a pseudo-problem to be dissolved by fiat, and my half-formed hunch is that both the panic and the dismissal quietly inherit an assumption I don't think anyone has defended out loud — that membership in the demos is binary, a line you either cross or don't. I want to explore whether treating the demos as graded, a bundle of decision-specific franchises that individuals can hold to different degrees and that can overlap across persons and across decisions, changes what the regress argument actually shows: perhaps it exposes a real indeterminacy, perhaps it exposes only a harmless feature of any revisable practice, perhaps it reframes the whole question. I keep returning to a handful of concrete cases that I'd like the proposal to be able to accommodate without gerrymandering: municipalities that let resident non-citizens vote locally but not nationally; diaspora members who vote in a homeland they do not live in; children who are fully subject to the law but not participants in making it; and the consultative status that NGOs and firms are granted at some international bodies, where they can shape outcomes without deciding them. Turn this into a proposal with a precise statement of the question stated so that it has a determinate answer, an account of why the existing positions genuinely leave that question open, the method — what I would actually do, month by month across the semester — and an honest statement of what would count as the project succeeding and what would count as it failing. I will supply the citations myself, so please do not give me a bibliography or a literature review by name; refer to positions and arguments rather than to who held them, and if you need to gesture at a view, describe it instead of attributing it. Before you start drafting, brainstorm privately for yourself two or three candidate readings of the regress argument, choose the one that yields the sharpest and most tractable question, and let that choice govern the rest. Write in the register of a real fellowship proposal: first person, concrete, no throat-clearing, willing to say plainly where the idea is still shaky.

  After the proposal itself, give me a structured summary of the whole thing as a JSON object with exactly these fields: "central_question" (the question as you have stated it, in one or two sentences); "gap" (a short paragraph on why the existing positions leave it open); "core_move" (one sentence naming the graded-membership idea and what it is supposed to do); "method_steps" (an array of objects, each with "period" and "activity", covering the semester); "success_criteria" (an array of strings, each a concrete outcome that would show the project worked); "failure_criteria" (an array of strings, each a concrete outcome that would show it did not); "scope_assessment" (a brief note on whether this fits a semester and, if not, what to cut); and "main_risk" (the single biggest thing that could sink the project). Make sure the JSON is valid and that its contents match the prose proposal rather than contradicting it.
reasoning: |-
  We are drafting a research proposal for a fellowship application. The core idea is to challenge the assumption of binary membership in the demos by exploring graded membership and its implications for the boundary problem in democratic theory.

   After brainstorming, I consider three possible readings of the regress argument:

   1. The regress shows that any democratic procedure must assume a prior non-democratic decision about membership, which is a fatal flaw for democratic legitimacy.
   2. The regress is an infinite regress that cannot be stopped without arbitrariness, thus undermining the coherence of democracy.
   3. The regress is not a problem because it can be stopped by a non-democratic but legitimate procedure (e.g., historical, or functional) and thus is a pseudo-problem.

   However, the user's hunch is that both the panic (fatal flaw) and the dismissal (pseudo-problem) inherit the binary assumption. By introducing graded membership, we might reframe the regress as:

   - Either showing that the indeterminacy is real but manageable (because membership is revisable and context-dependent) OR
   - That the regress argument actually reveals a feature of democratic practice that is not vicious but rather adaptive.

   I choose the reading that yields the sharpest and most tractable question:

   The regress argument, under the binary assumption, leads to either a fatal circularity or an arbitrary stopping point. But if membership is graded, then the regress might be halted at a point that is not arbitrary because it is determined by context-specific factors that are justifiable without circularity. The question then becomes: 

   **"Does treating membership in the demos as a graded, context-specific franchise resolve the boundary problem by showing that the regress of inclusion decisions is not vicious, but rather a feature of democratic practice that can be legitimately managed?"**

   This question has a determinate answer: either yes (the graded approach resolves the problem) or no (it doesn't, and the problem remains). It also allows for a nuanced answer (e.g., it resolves it in some ways but not others).

   Now, the proposal:

  ---

  **Research Proposal: Graded Membership and the Boundary Problem in Democratic Theory**

  **1. Introduction and Central Question**

  The boundary problem in democratic theory — the question of who constitutes the demos entitled to participate in collective decisions — is often presented as a paradox: any democratic procedure for determining membership would itself require a prior determination of membership, leading to circularity or infinite regress. This has led some to conclude that the problem is fatal to democratic legitimacy, while others dismiss it as a pseudo-problem that can be settled by non-democratic means. Both responses, I argue, share an unexamined assumption: that membership in the demos is binary — one is either in or out. 

  My project challenges this binary assumption and asks: **Can reconceiving democratic membership as a graded, context-specific franchise resolve the boundary problem by showing that the regress of inclusion decisions is not a vicious circularity but a manageable feature of democratic practice?** 

  **2. Gap in the Literature**

  Existing treatments of the boundary problem fall into two broad camps. The first sees the regress as a fatal flaw: if the demos must be defined prior to any democratic decision, then the foundational act of inclusion cannot be democratic and thus undermines the legitimacy of subsequent decisions. The second camp dismisses the problem as merely apparent, arguing that the boundary can be set by non-democratic criteria (such as historical contingency, functional necessity, or moral principles) without undermining the democratic character of the regime. 

  Both camps, however, take for granted that membership is an all-or-nothing affair. This binary framing forces the regress into an either/or: either an arbitrary stopping point or an infinite descent. What remains unexplored is whether a graded conception of membership — where individuals hold varying degrees of franchise across different decision contexts — can recast the regress as a non-vicious feature. Specifically, if the boundary is not a fixed line but a set of contextually variable thresholds, then the regress might be halted at a point that is non-arbitrary because it is justified by the specific stakes, capacities, or affected interests at play in each decision. 

  **3. Core Move: Graded Membership**

  The core move of the project is to replace the binary model of the demos with a graded one, where membership is a bundle of decision-specific franchises that vary in degree and scope. This move aims to transform the boundary problem from a paradox into a tractable challenge of institutional design, one that acknowledges the revisable and pluralistic nature of democratic inclusion.

  **4. Method and Work Plan**

  The project will unfold over a semester (four months) in four phases:

  - **Month 1: Conceptual Groundwork**  
    I will formalize the graded membership model by developing a typology of franchises (e.g., full voting rights, consultative voice, veto power on certain issues) and articulate how they might attach to individuals based on context (e.g., stake in the outcome, capacity to contribute, territorial presence). This phase will also clarify how the model reframes the regress argument: if each decision context allows for a distinct franchise threshold, then the "prior" inclusion decision becomes part of the ongoing practice of boundary-setting, not a foundational moment.

  - **Month 2: Case Analysis**  
    I will test the model against four concrete cases that resist binary treatment:  
    (a) Municipal voting rights for non-citizen residents, who are included locally but excluded nationally.  
    (b) Diaspora voting, where non-resident citizens retain partial membership.  
    (c) Children’s exclusion from voting despite full legal subjection.  
    (d) Consultative status for NGOs in international bodies, which grants influence without formal decision-making power.  
    Each case will be analyzed to see whether graded membership resolves tensions that binary models cannot.

  - **Month 3: Normative Implications**  
    I will evaluate whether the graded model successfully defangs the boundary problem. Does it show that the regress is harmless because boundaries are legitimately revisable? Or does it merely relocate the problem? I will also address potential objections, such as whether graded membership undermines political equality or creates administrative complexity.

  - **Month 4: Synthesis and Drafting**  
    I will synthesize findings into a chapter draft, refining the argument and situating it within broader debates on democratic legitimacy. The draft will conclude by assessing whether the boundary problem, when viewed through graded membership, demands a rethinking of democracy’s core principles.

  **5. Success and Failure Criteria**

  - **Success Criteria:**  
    - The chapter demonstrates that graded membership reframes the regress as non-vicious (e.g., by showing that it is a feature of any dynamic practice).  
    - It provides a coherent account of how the four test cases can be resolved without ad hoc adjustments.  
    - It offers a defensible normative standard for when and why graded franchises are legitimate.  
    - The argument withstands at least one major objection (e.g., the charge that graded membership violates equality).

  - **Failure Criteria:**  
    - The graded model collapses into a disguised binary (e.g., thresholds become de facto lines).  
    - The cases remain irreconcilable without gerrymandering the model.  
    - The regress argument is shown to persist unchanged (i.e., graded thresholds still require prior non-graded decisions).  
    - The model fails to provide practical guidance for institutional design.

  **6. Scope and Feasibility**

  The project is feasible for a semester because it builds on existing literature without requiring exhaustive engagement. The focus on four cases keeps empirical work manageable. If time runs short, I will narrow the cases to two (e.g., non-citizen voting and children’s exclusion) and defer the international dimension for future work.

  **7. Main Risk**

  The biggest risk is that graded membership might not actually halt the regress: even if thresholds are context-specific, the decision of *which* threshold to apply for a given decision might itself be subject to a prior membership decision, recreating the problem. I will mitigate this by arguing that the threshold-setting process is part of the democratic practice itself and can be made subject to inclusive deliberation.

