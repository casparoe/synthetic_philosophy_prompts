answer: |-
  ### Research Proposal: Graded Membership and the Boundary Problem in Democratic Legitimacy  

  #### Central Question  
  Does reconceptualizing democratic membership as a graded, context-specific franchise (rather than a binary status) resolve the boundary problem’s regress argument by exposing it as a non-vicious feature of democratic practice—one that reflects legitimate institutional flexibility rather than fatal indeterminacy?  

  #### Gap in Existing Literature  
  The boundary problem—that defining the *demos* requires a prior undemocratic decision, creating circularity or regress—is typically met with two responses. One camp treats it as a fatal paradox revealing democracy’s foundational illegitimacy, while another dismisses it as a pseudo-problem solvable by pragmatic, historical, or moral fiat (e.g., "all affected interests" or territorial residence). Both assume membership is binary: individuals are wholly inside or outside the demos. This shared assumption forces the debate into a false dilemma where the regress *must* imply either impossibility or triviality. Crucially, no work systematically examines whether *degrees* of membership (e.g., partial voting rights, consultative roles, or issue-specific influence) could reinterpret the regress as inherent to adaptive democratic practice—not a flaw to be solved.  

  #### Core Move  
  Introducing **graded membership**—where an individual’s decision-making authority varies across contexts based on stakes, capacity, or proximity—to reframe the regress as evidence of democracy’s revisable, pluralistic character, rather than a threat to its coherence.  

  #### Method and Work Plan  
  *Month 1: Conceptual Framework*  
  - Formalize the graded membership model: Define "franchise bundles" (e.g., voting, consultation, agenda-setting) and their scalar attributes (intensity, scope, reciprocity).  
  - Reconstruct the regress argument under this model: Is indeterminacy reduced to institutional revisability? Does it shift the problem from "who decides?" to "how do we justify thresholds?"  

  *Month 2: Case Studies*  
  - Analyze four non-binary cases:  
    - *Non-citizen municipal voting*: Graded inclusion based on residency and local stakes.  
    - *Diaspora voting*: Split membership across territorial/political communities.  
    - *Children’s subjection without voice*: How capacity thresholds interact with legal subjecthood.  
    - *NGO consultative status*: Influence without formal authority in global governance.  
  - Test whether graded membership resolves tensions binary models cannot.  

  *Month 3: Normative and Institutional Implications*  
  - Determine if the regress becomes "harmless": Does graded membership transform it into routine boundary-adjustment?  
  - Confront key objections: Does this undermine equality? Create administrative tyranny?  
  - Sketch institutional principles for legitimate threshold-setting (e.g., proportionality to stakes).  

  *Month 4: Synthesis and Drafting*  
  - Draft the chapter, integrating cases to show how graded membership reframes the boundary problem.  
  - Refine based on peer feedback.  

  #### Success Criteria  
  1. Demonstrates that the regress persists under graded membership but loses its "vicious" character.  
  2. Explains all four cases without ad hoc exceptions, showing threshold flexibility as a feature.  
  3. Generates at least one actionable principle for legitimizing franchise variations (e.g., "stake-proportional inclusion").  
  4. Defends against a major objection (e.g., that gradations violate political equality).  

  #### Failure Criteria  
  1. Graded membership collapses into binary proxies (e.g., "effective" membership thresholds harden into borders).  
  2. Cases still require arbitrary line-drawing, reproducing the regress unchanged.  
  3. No normative advantage over existing solutions (pragmatic fiat or all-affected-interests) emerges.  
  4. Key objections (e.g., administrative complexity) remain fatal.  

  #### Scope Assessment  
  Feasible in one semester. Cases are bounded, and theory-building is anchored to concrete examples. *If time runs short, I will prioritize diaspora voting and children’s exclusion—they best expose tensions between territoriality/capacity and binary assumptions.*  

  #### Main Risk  
  The regress may reappear at a higher level: *Who decides the thresholds for each graded franchise?* If those decisions require prior binary membership, the problem remains. Mitigation: Argue that threshold-setting is inherently contestable and democratically revisable—a strength, not a failure.  

