  ## Joint Statement on Statutory Interpretation: ADAA Case Study  
  *(Agreed upon by Committed Textualist and Committed Purposivist after Adversarial Collaboration)*

  ### Brainstorming: Candidate Common Ground
  1.  **Text as Foundation:** Both approaches start with the enacted statutory text as the primary source of law.
  2.  **Contextual Meaning:** Words derive meaning from their linguistic context within the statute and broader linguistic conventions.
  3.  **Purpose Relevance:** Statutory purpose (explicitly stated or inferred) is relevant to understanding the law's operation.
  4.  **Ambiguity Trigger:** Some threshold of ambiguity or absurdity must be met before departing from the most natural linguistic reading of the text ("plain meaning").
  5.  **Rule of Law Values:** Predictability, consistency, and constraining judicial discretion are important legal values.
  6.  **Legislative Supremacy:** The enacted text represents the legislature's authoritative decision.
  7.  **Canons as Tools:** Canons of construction are non-binding heuristics or presumptions about language use or legislative intent.
  8.  **Section 3 Definition is Key:** The meaning of "meaningful explanation" is governed primarily by its statutory definition in Section 3 ("a description of the principal factors and the role they played in the decision").
  9.  **Trade Secret Concern Acknowledged:** The drafting note reveals a legislative concern regarding trade secrets, relevant to the scope of disclosure.
  10. **Defined Term Limits Scope:** The specific definition in Section 3 constrains the potential breadth of the general purpose stated in Section 2.

  ### I. Agreed Claims

  1.  **Nature of Statutory Meaning:** Statutory meaning is the communicative content of the enacted text, understood by a reasonable user of the language in the context of its enactment. This meaning is objective and public, not dependent on the subjective understanding of any individual legislator or drafter.
  2.  **Role of Purpose Clauses (e.g., Section 2):** An explicitly stated purpose clause (Section 2) is part of the enacted text and provides important context for understanding the scope and application of the operative provisions. It informs *what the text is designed to achieve* but does not authorize courts to override the specific requirements or limitations expressed in the operative text (e.g., Section 3's definition).
  3.  **Role of Legislative History (Including Preamble & Notes):** Legislative history (including preambles and uncodified notes) is not law. It may sometimes provide evidence relevant to understanding the linguistic context, the problem the statute addresses, or the meaning of ambiguous terms *within the enacted text*. Its weight is contingent on its reliability and relevance to the interpretive task defined by the text itself. The uncodified drafting note regarding trade secrets is evidence of a legislative concern, but its legal effect is determined by how it interacts with the enacted text.
  4.  **Role of Canons of Construction:** Canons are presumptions or principles about language use, structure, or typical legislative intent. They are tools to aid in discerning the objective meaning of the text or resolving ambiguity. No canon is absolute or trumps the clear meaning of the specific text in its context. Canons like *noscitur a sociis* (a word is known by its companions) or *expressio unius* (expression of one thing implies exclusion of others) may be applied cautiously based on the specific statutory context.
  5.  **Interpretation vs. Construction:** The distinction between "interpretation" (finding meaning in the text) and "construction" (resolving ambiguity or filling gaps where the text runs out) is conceptually useful but often blurred in practice. Both textualists and purposivists engage in discerning meaning from text and context. The core difference lies in the *sources* and *methods* deemed primary and authoritative when the text's application is uncertain, not in whether a distinct phase called "construction" occurs. The dispute is more substantive than merely verbal.

  ### II. Disagreements Table

  | Precise Point of Disagreement                                                                 | Textualist Formulation                                                                                                                                 | Purposivist Formulation                                                                                                                                                                | The Crux                                                                                                                                                                    | Concrete Case / Argument & Predictions                                                                                                                                                                                                                                                                                                                                                                                                                       |
  | :-------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Scope of "role they played" in Section 3's definition.**                                 | "Role they played" requires describing *what* the principal factors were (e.g., income, credit history) and *that* they were inputs considered in reaching the adverse outcome. It does not inherently require explaining *how* the factors were weighted, combined, or processed by the model to generate the output. | "Role they played" requires describing *how* the principal factors functioned within the decision-making process to cause the adverse outcome. This necessitates an explanation sufficient to understand the causal pathway, including relative weight or interaction where determinative, to fulfill the purpose of enabling understanding and contestation. | **Whether the text "role they played" linguistically encompasses the internal decision logic (the "how") or is limited to identifying the inputs (the "what").** Does enabling contestation *require* understanding the logic? | **Applying the ADAA to the company's system:** Does disclosing only the list of top factors used (e.g., "Low Credit Score, High Debt-to-Income Ratio") satisfy Section 3, or must the company also explain *how* those factors led to the denial (e.g., "The model assigns a weight of X to credit score and Y to DTI; your scores triggered threshold Z")? <br> **Textualist Prediction:** Plain-language summary suffices. <br> **Purposivist Prediction:** Disclosure of logic is required for meaningful contestation. |
  | **2. Resolving ambiguity in the defined term relative to Section 2's purpose.**               | If Section 3's definition is ambiguous *after applying linguistic canons and context*, the purpose in Section 2 *may* inform the choice between linguistically permissible meanings. The purpose cannot expand the definition beyond its plausible linguistic boundaries. | Section 2's purpose ("understand and contest") is the primary lens through which the definition in Section 3 must be understood. Ambiguity in Section 3 is resolved by choosing the meaning that best effectuates Section 2's purpose, provided it remains a plausible reading of the text. | **The hierarchy between specific definitional text and general purpose text when determining the scope of a defined term, especially in cases of perceived tension.**          | **Same as Point 1.** The dispute over "role they played" *is* the application of this principle. The concrete case illuminates the methodological disagreement.                                                                                                                                                                                                                                                                                              |
  | **3. Authority of the uncodified drafting note on trade secrets.**                            | The uncodified note is extrinsic evidence. It may confirm that concerns about trade secrets existed, but it cannot alter the meaning of the enacted text (Section 3). If Section 3's requirements, properly interpreted, inherently risk disclosing trade secrets, that is a policy consequence of the legislature's chosen text. | The uncodified note is strong evidence of legislative intent regarding a specific application of the statute (trade secret protection). It informs the interpretation of Section 3, indicating that the legislature did not intend the requirement to mandate disclosures that would reveal protected trade secrets. This intent constrains the scope of "meaningful explanation." | **Whether strong evidence of specific legislative intent on a concrete concern (trade secrets) revealed in drafting history can directly constrain the interpretation of otherwise broad or potentially intrusive statutory language.** | **Would Section 3 require disclosure of the algorithm's source code or proprietary weighting constants?** <br> **Textualist Prediction:** If "role they played" is interpreted to require disclosing logic/weights, the note is irrelevant; the statute requires it, and the legislature failed to codify an exception. <br> **Purposivist Prediction:** The note demonstrates that such disclosure falls outside the intended scope of "meaningful explanation," regardless of the literal breadth of Section 3. |
  | **4. Use of the preamble referencing "existing data-protection principles".**                 | The preamble is non-operative text. References to external principles are too vague to provide specific guidance for interpreting the precise, subsequent definition in Section 3. The enacted definition controls.                                      | The preamble confirms the legislative context and purpose. "Existing data-protection principles" (like GDPR's "right to explanation") provide relevant context for understanding the *kind* of transparency and accountability the legislature sought to achieve, informing the interpretation of Section 3. | **Whether a vague reference in non-operative text to external legal principles provides useful context for interpreting specific operative text, or is too indeterminate to be a reliable guide.** | **Does the GDPR context suggest "meaningful explanation" inherently requires disclosure of logic (supporting regulator) or focuses on understandable factors (supporting company)?** <br> **Textualist Prediction:** The preamble is too vague; interpretation relies solely on the enacted definition. <br> **Purposivist Prediction:** The preamble links the ADAA's purpose to established transparency norms, supporting a robust reading of Section 3. |

  **Note on "Merely Verbal" Disputes:** The disagreement over the label "interpretation" vs. "construction" (Point 5 in Agreed Claims) is judged to be largely verbal. Both sides agree the core task is ascertaining the statute's meaning and applying it. The substantive disagreement lies in the *methodology* for accomplishing that task when the text is not perfectly clear in its application to a novel situation (as demonstrated in Points 1-4 of the Disagreements Table). The different labels reflect different philosophies about the sources of authority, not a fundamental disagreement about the existence of distinct phases of analysis.
