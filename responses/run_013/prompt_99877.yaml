  **Final Procedure Document**:

  We'll write it as a numbered list of questions.
answer: |-
  ### Disposition Verification Procedure  
  **For Junior Technicians**  
  *Purpose: Assign a defensible verdict to a test result for a component's disposition, using fixed vocabulary (mask, fink, mimic, reverse fink).*  
  **Verdicts:**  
  - **Disposition Present** (DP)  
  - **Disposition Absent** (DA)  
  - **Inconclusive: Masked** (IM)  
  - **Inconclusive: Finked** (IF)  

  **Inputs:** Completed test record (disposition, trigger, manifestation pass/fail, test conditions, anomalies).  
  **Rules:**  
  - All steps require recording reasoning in the lab journal.  
  - **Mechanical steps (M):** Data lookup, arithmetic, or rule-based checks.  
  - **Judgment steps (J):** Require technician to evaluate plausibility. Escalate to senior engineer if uncertain.  
  - **Escalation:** Senior engineer reviews evidence, makes a call, and signs off. No recursion—engineer’s decision is final.  

  ---

  ### Procedure Flow  
  **Step 0: Classify Disposition (M)**  
  - *Question:* Is the disposition probabilistic (e.g., "resists corrosion 95% of the time")?  
    - **Yes:** Check if the test used statistical methods (e.g., multiple samples, confidence intervals).  
      - If no, escalate to engineer: Probabilistic dispositions require statistical tests.  
      - If yes, proceed.  
    - **No:** Proceed.  
  - *Output:* Proceed to Step 1.  

  **Step 1: For Passing Tests Only – Check for Mimic (J)**  
  - *Question:* Could a property *other than the disposition* explain the pass? (E.g., a temporary coating mimicking corrosion resistance).  
    - **No:** Proceed to Step 2.  
    - **Yes:** Escalate to engineer.  
      - *Engineer decides:*  
        - Mimic is implausible or ruled out → Proceed to Step 2.  
        - Mimic is plausible *and* independent evidence confirms disposition absence (e.g., prior fails, material analysis) → **DA**.  
        - Mimic is plausible *but no evidence of absence* → **IM** (mimic masks the true absence).  
  - *Branch ends if verdict reached.*  

  **Step 2: For Failing Tests Only – Check for Mask (J)**  
  - *Question:* Could a condition have blocked the disposition from manifesting? (E.g., a rig malfunction, contaminant).  
    - **No:** Proceed to Step 3.  
    - **Yes:** Escalate to engineer.  
      - *Engineer decides:*  
        - Mask is implausible or ruled out → Proceed to Step 3.  
        - Mask is plausible → **IM**.  
  - *Branch ends if verdict reached.*  

  **Step 3: Check for Fink (J)**  
  - *Question:* Could the trigger have altered/destroyed the disposition? (Includes reverse finks; e.g., trigger removes a barrier, allowing manifestation).  
    - **No:** Proceed to Step 4.  
    - **Yes:** Escalate to engineer.  
      - *Engineer decides:*  
        - Fink is implausible → Proceed to Step 4.  
        - Fink is plausible → **IF**.  
  - *Branch ends if verdict reached.*  

  **Step 4: Base Verdict (M)**  
  - Test passed → **DP**.  
  - Test failed → **DA**.  

  ---

  ### Special Cases Handling  
  - **Irreversible Triggers (e.g., component destroyed):**  
    - Cannot retest the same unit. In Steps 2–3, engineer must decide plausibility based on adjacent evidence (e.g., identical units, simulations).  
  - **Multi-Track Dispositions:**  
    - Run procedure separately for each test track. No cross-track inference.  
  - **Trigger = Mask (e.g., heat-trigger degrades the sealant it tests):**  
    - Evaluate as a fink (Step 3), as the trigger alters the disposition.  
  - **Only Passing Test Evidence:**  
    - Step 1 (mimic check) is critical. If mimic is plausible and unrefuted, **IM** or **DA** (per engineer).  

  ---

  ### Example Cases  
  **Case 1: Polymer Seal**  
  - *Lab test:* Passed cold-bend at -40°C.  
  - *Field result:* Cracked at -30°C (within spec).  
  - *Run procedure on lab test (pass):*  
    - **Step 1 (Mimic):** No plausible mimic → Proceed.  
    - **Step 3 (Fink):** No evidence trigger altered disposition → **DP**.  
  - *Run procedure on field failure (fail):*  
    - **Step 2 (Mask):** Field contaminant (e.g., fuel residue) is plausible mask → Escalate. Engineer confirms contaminant blocks flexibility → **IM**.  
  - *Verdict:* Lab test establishes **DP**; field result is **IM** (masked).  

  **Case 2: Coating in Salt-Spray Test**  
  - *Test:* Failed accelerated corrosion test.  
  - *Suspected rig artifact (e.g., uneven spray).*  
  - *Run procedure:*  
    - **Step 2 (Mask):** Rig artifact plausibly blocked corrosion resistance → Escalate. Engineer confirms artifact → **IM**.  
  - *Verdict:* **IM** (masked). Not entitled to **DA**.  

  **Case 3: Component with Plausible Mimics in All Passing Tests**  
  - *History:* Years of passing tests, but each admits a mimic (e.g., inert surface residue mimics chemical resistance).  
  - *Run procedure on one passing test:*  
    - **Step 1 (Mimic):** Plausible mimic → Escalate. Engineer reviews:  
      - No test without mimic ever passed.  
      - Material analysis shows no resistance mechanism.  
      → **DA** (disposition absent; mimic explains all passes).  
  - *Verdict:* **DA** (as expected, "unliked" but defensible).  

  ---

  ### What the Procedure Cannot Do  
  1. **Misclassification Risks:**  
     - **False negatives:** Masks/finks may go undetected if no anomalies are recorded.  
     - **False positives:** Mimics may be overlooked if no alternative hypotheses are considered.  
     - **Probabilistic error:** Single-instance tests for probabilistic dispositions may mislead (e.g., a pass could be luck).  

  2. **Unsupplied Inputs:**  
     - Requires explicit anomalies in test records (e.g., "rig temperature fluctuated").  
     - Relies on engineer’s expertise for plausibility judgments (no automated input).  

  3. **Beyond Metaphysics:**  
     - **Risk acceptance:** Verdicts (e.g., **DP**) do not imply "safe to ship." This is a business decision.  
     - **Design flaws:** Cannot fix tests where triggers inherently destroy dispositions (e.g., irreversible stress tests).  
     - **Ambiguous evidence:** If escalation yields no clear engineer call, lab must redesign the test.  

  **Final Note:** This procedure isolates *what the component is disposed to do* from *what risks we accept*. It reduces—but cannot eliminate—epistemic gaps in qualification.  

