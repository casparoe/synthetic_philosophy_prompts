  ### Underdetermination & Extra Assumption  
  - **Underdetermination**: Her verdicts *nearly* fit all three top rules, but the consciousness case slightly favors Problem-Framing/Empirical Decoupling over Theory Interpretation.  
  - **Extra Assumption Needed**: Whether she prioritizes *current empirical testability*. If the BH paradox is seen as "in principle" testable (e.g., future Hawking radiation detectors), she *might* call it useless, but her QM verdict suggests she values philosophy for untestable *foundations*.  

