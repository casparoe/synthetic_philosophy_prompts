  - **Why?**  
    - The paradox centers on reconciling quantum unitarity with GR-based black hole evaporation *in the absence of empirical tests*. This mirrors her "useful" cases (QM interpretations, stat mech) and contrasts with "useless" empirical cases (dark matter, Higgs).  
    - Key philosophical contributions include:  
