prompt: |-
  You're a philosopher of science who knows both the science and the philosophy literature. I need you to think carefully and brainstorm before answering.

  My friend Nadia is a physicist who also reads a ton of philosphy of science. She has strong views on whether philosophy has actually been useful to science. Here are her verdicts from various arguments we've had:

  - General relativity: philosophy was useful — the analysis of simultaneity and geometry actually helped Einstein.
  - Quantum mechanics: useful — interpretation debates clarified what the theory is even saying.
  - String theory: useless — philosophy hasn't helped find the right vacuum or make predictions.
  - Dark matter: useless — it's a purely empirical problem, philosophy has nothing to add.
  - Statistical mechanics: useful — philosophy clarified entropy and the arrow of time.
  - Consciousness research: useful — philosophy helped define the hard problem and design experiments.
  - The Higgs discovery: useless — philosophy played no role.

  Next week we're arguing about the black hole information paradox. What do you think Nadia will say? I'm less interested in the yes/no answer than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which case would best tell them apart.

  So: start by brainstorming all the plausible rules that could explain her pattern. Then pick the two or three that fit best. For each, say what it predicts about the black hole information paradox. Then give your best guess about what she'll say and why. Finally, name a further case that would distinguish the rules. If you think her verdicts actually underdetermine the new case, say so and explain what extra assumption would decide it.
