prompt: |-
  I am a novelist, midway through a book whose central character is a field archaeologist, and I have hit a problem that is conceptual before it is literary. I need my character to stand over a set of excavated remains and say what they show, and I want to know which of the sentences I put in her mouth the evidence could actually license and which are mine alone. Rather than read up on method, I have been going case by case on instinct, and I would like to know whether my instincts answer to a single principle or whether I am being quietly inconsistent in a way a real excavator would catch. Every detail below is invented — these are the sorts of finds my book contains — so I am after the principle rather than a ruling on any one case.

  My verdicts are these. A cemetery of several hundred graves in which adult males are consistently buried with blade-like stone tools and adult females with pierced shells: I am happy to say the community sorted its dead by sex and equipped the two groups differently, but not to say the men held authority. Cut marks and marrow fracturing on human bones in a midden, indistinguishable from the butchery of game animals: I am happy to say the bodies were dismembered and processed, but not to say the people ate them as a matter of custom. A hilltop enclosure with enormous ditches, no dwellings, and a single deposit of cattle bones: I am happy to say crowds gathered there and slaughtered cattle, but not to say it was a temple. Thousands of near-identical figurines of local clay, kept in the floors of houses across a whole region: happy to say a shared image circulated and mattered enough to be kept at home, not happy to say the people held a common belief about a goddess. A skeleton with a badly healed fracture that would have left the person unable to feed themselves for a year: here I am happy to say someone kept them alive, and I feel this more strongly than anything above, even though it is a claim about concern, which is exactly the kind of thing I have been refusing. And a body buried with its grave goods deliberately smashed: happy to say the living expected the dead to have some use for them, which I also feel strongly, and which is again a claim about what someone thought.

  What I cannot square is this: I keep refusing to infer beliefs and refusing to infer institutions on the grounds that the objects underdetermine them, and then in the two cases where the inference is most plainly about a mind — concern for the injured, expectation about the dead — I allow it at once and feel more confident than I do about the cases where I am inferring only what people did. I suspect the real difference is not belief versus behaviour but something about whether the pattern could plausibly have come about otherwise, and if that is right I want the principle stated exactly, with the clause that does the work identified. I do not want reassurance that archaeologists argue about this. I want the principle, or a small set of rival principles, that best fits the verdicts above, the verdict I have to give up if I keep it, and what it predicts for a case I have not listed.

  Please answer as exactly five numbered items, each one or two sentences, with no introduction and no conclusion: the principle first, then its verdicts on two or three of my cases, then the verdict it forces me to abandon, then the further case it predicts and what it says about that case.
reasoning: |-
  Okay, the user is a novelist working on a book centered around a field archaeologist character. They're grappling with how much their character can infer from archaeological evidence versus what might be overinterpretation. They've provided several fictional scenarios and their own verdicts on what conclusions are justified. Now they want underlying principles that explain their instincts, especially why they're comfortable inferring care for an injured person or beliefs about the dead but hesitant about social structures or religious institutions.

  Hmm, the key tension here is between their rejection of belief/institution inferences in most cases versus their strong confidence in two specific "mind-related" inferences. Their instinct seems to be that actions speak louder than patterns - but why does care for the injured feel more provable than ritual practices? 

  Looking at their examples: The healed fracture case requires continuous care - it's an extended action with no alternative explanation that makes sense. The smashed grave goods imply intentional destruction only meaningful if they believed the dead could use them. Whereas sex-based grave goods could just reflect social roles without implying hierarchy, and cattle bones in a ditch don't necessarily mean temple rituals. 

  The unifying principle might be "inference to the only plausible explanation." When an observation has exactly one reasonable cause (like year-long care for survival), inference is strong. When multiple causes fit (shells in graves = status? gender? decoration?), it's weak. Their confidence tracks how "brittle" the explanation is - how easily it breaks if you remove the inferred element. 

  For the new case they want predicted: A pot buried upright at a settlement's edge. Under this principle, the archaeologist could say "it was placed intentionally" (only plausible explanation for position) but not "it was a boundary marker" (could be storage, accidental, etc.). The verdict to abandon would be their hesitation about the "common belief" in figurines - if identical figurines appear everywhere, shared understanding is actually the only plausible explanation.

  This fits their instincts: The care and afterlife belief cases have no alternatives, while authority structures or temples do. They'd need to accept that widespread identical ritual objects do imply shared belief - which they currently reject. The strength comes from necessity, not just possibility.
answer: |-
  Here are the five numbered items as requested:

  1.  **Principle:** Inference is licensed only when the evidence necessitates a single plausible explanation, where no other cause or motivation could reasonably produce the observed pattern without invoking the inferred element. The work is done by "necessitates" and "no other cause or motivation could reasonably produce".
      *   **Verdicts:** Strongly licenses inferring care for the injured skeleton (necessitates sustained aid). Licenses inferring expected use for smashed grave goods (necessitates intentional destruction linked to an afterlife concept). Does not license inferring male authority from grave goods (social roles or tasks are plausible alternatives).
      *   **Forces Abandonment:** The refusal to infer "common belief" from the widespread, near-identical figurines; shared understanding is the most plausible explanation for the pattern.

  2.  **Principle:** Direct physical causation or immediate, unambiguous intention inferred from the *form* of the evidence itself is stronger than inferring abstract social structures, ideologies, or long-term motivations. The clause "immediate, unambiguous intention inferred from the *form* of the evidence" does the work.
      *   **Verdicts:** Licenses dismemberment from cut marks (direct physical action). Licenses intentional destruction of grave goods (direct action on objects). Does not license identifying the hilltop enclosure as a temple (abstract function, plausible alternatives like feasting site).
      *   **Forces Abandonment:** The refusal to infer cannibalism "as a matter of custom"; the butchery marks show processing, but the *motivation* (food, ritual, enemy treatment) is ambiguous from the form alone.

  3.  **Principle:** Confidence increases when the inferred action or motivation is the *only* way the individual actor(s) involved could have achieved an observable, biologically/survivally necessary outcome. The clause "only way... could have achieved an observable, biologically/survivally necessary outcome" does the work.
      *   **Verdicts:** Strongly licenses inferring care for the injured (survival necessitates care). Does not license inferring cannibalistic custom (survival doesn't necessitate eating humans; other proteins likely existed). Does not license inferring the enclosure was a temple (no survival necessity).
      *   **Forces Abandonment:** The refusal to infer cannibalism "as a matter of custom"; while processing is clear, the *necessity* for consumption isn't established.

  4.  **Principle:** Attributing specific thoughts/beliefs (e.g., expectation of afterlife use) is permissible when the material action (e.g., deliberate smashing) is *functionally inexplicable* without attributing that specific underlying mental state to explain its purpose. The clause "functionally inexplicable without attributing that specific underlying mental state" does the work.
      *   **Verdicts:** Licenses inferring an expectation of afterlife use for smashed goods (sabotage or display lack functional fit). Does not license inferring a goddess belief from figurines (figurines could function as toys, ancestor representations, etc., without a specific deity).
      *   **Forces Abandonment:** The refusal to infer "common belief about a goddess" from the figurines; shared image/circulation is licensed, but the *specific* belief content is not necessitated.

  5.  **Principle:** This principle predicts for an unlisted case: A lone, articulated dog skeleton found carefully placed in a small pit just outside a house entrance, with no grave goods.
      *   **Prediction:** The principle (Item 1 & 4) licenses inferring deliberate burial (necessitates intentional placement). It licenses inferring the dog had significance to the inhabitants (necessitates effort beyond disposal). It does *not* license inferring a specific belief (e.g., "guardian in afterlife") or ritual practice (e.g., "household protection rite"), as affection, practical disposal, or simple respect are plausible alternatives not requiring those specific beliefs.
