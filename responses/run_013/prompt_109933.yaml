prompt: |-
  ok so I'm a philosophy of physics grad student and I want a short story, maybe 1500-2500 words, that actually does work on Zeno instead of just name-checking him. Premise: a universe where space and time are genuinely grainy — there's a smallest length and a smallest tick, and nothing whatsoever happens between ticks. My protagonist is a physicist in that world who's spent her whole career on the paradoxes. Everyone around her dismisses the dichotomy (the runner who never reaches the wall) with the standard line about the series converging to a finite limit, except she's noticed that in a grainy world there are only finitely many positions between start and finish, so that solution is vacuous there — and meanwhile the arrow is worse than ever, because at every tick she's just somewhere, and she can't point to any tick at which she is actually moving. I want the story to make me feel the gap between "moving = being at different places at different ticks" and the passage she can't locate in any tick, and I want at least one scene where she tries to rebuild Zeno's reasoning inside her own grainy world and finds it fails for a completly different reason than the textbook one, so the reader sees which premise was really doing the work. Please don't have her resolve it with a speech about limits; if anything leave her somewhere uncomfortable. Give her something personal to lose, keep the physics consistent with the premise, and don't worry about a neat ending.
