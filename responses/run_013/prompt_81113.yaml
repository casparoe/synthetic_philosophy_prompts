prompt: |-
  I'm building up a thing on conscription and I keep getting stuck on the Swiss and Nordic cases, so I want you to do the reading for me. Here's the setup. Start from the standard economic story about the draft, the one Walter Oi was pushing in the sixties: a draft is a tax paid in kind, because the state takes a year of someone's labour at well below what they could earn elsewhere, so the real cost isn't the army's wage bill but the wages those people never earned, which never appears in any budget line. Follow that through and the richer a country gets, the worse the deal looks, and the more it should switch to a professional force paid market wages. Sweden did exactly that — paused the draft in 2010, went gender-neutral, all-volunteer — and then brought it back in 2017, calling up about 4,000 a year out of a cohort of roughly 100,000, picked from a pool of about 13,000. Finland never stopped at all: about 27,000 a year, with the large majority of men completing service. Switzerland runs a militia on the same premise, and in 2013 the electorate rejected abolishing conscription by about 73 to 27; men found unfit don't get off the hook either, they pay an extra 3% of income tax until they're 37, and anyone doing civilian service instead of military serves half again as long. All three are armed neutrals, which I suspect isn't a coincidence.

  So: read that episode through the tax lens and tell me what it gets and what it misses. Who's actually paying, what are the base and the rate, what does the theory predict about the 2010 pause, the 2017 reversal and the Swiss vote, and where does it go quiet? Is conscription doing something the tax frame can't see — a commitment device for neutrality, a way of legitimating the army in the eyes of the people it defends, a way of selecting people rather than levying them, or just a claim about who ought to share the risk? And what does that do to the theory — refute it, or just mark where it runs out?

  Give me exactly five numbered points, a sentence or two each, no preamble and no summing up at the end. Point 1 is the mapping, point 2 is what the theory nails, point 3 is where it breaks, point 4 is the rival reading of whatever looks anomalous, point 5 is what all this does to the theory and what evidence would settle it. I dont want an essay, I want the five beats.
reasoning: |-
  Alright, the user is working on conscription and specifically looking at Switzerland and Nordic countries. They mention the economic theory from Walter Oi, where conscription is seen as a tax in kind because the state pays below market wages, leading to a hidden cost in lost productivity. The user points out that as countries get richer, switching to a professional army should make more sense economically. But Sweden paused conscription in 2010, went all-volunteer, then reinstated it in 2017. Finland never stopped, and Switzerland rejected abolishing conscription in a referendum. All three are armed neutrals, which the user thinks is significant.

  First, I need to map the economic theory to these cases. The tax analogy: conscription as a tax where the base is the conscript's labor, the rate is the difference between market wage and military pay. The cost is the lost productivity. The theory predicts richer countries should abandon conscription because the opportunity cost is higher. But the reversals in Sweden and persistence in Switzerland contradict this.

  Next, what does the theory get right? Sweden's initial pause in 2010 fits the model. As the country got richer, the opportunity cost of conscription increased, making a professional army more efficient. So that aligns with Oi's argument.

  But where does it break? The 2017 reversal in Sweden and Swiss referendum can't be explained by the economic model alone. These countries reinstated or maintained conscription despite higher opportunity costs. The theory doesn't account for non-economic factors like national identity, neutrality commitment, or societal trust.

  The rival readings would focus on those non-economic factors. For Sweden, restarting conscription might be about ensuring military readiness with a broader recruitment pool. Switzerland's militia system could be tied to their armed neutrality doctrine, where widespread military service acts as a deterrent and legitimizes the army. Also, civilian service options and tax penalties for the unfit suggest a focus on shared sacrifice, not just economic efficiency.

  What does this do to the theory? It shows the economic model has limits. Conscription serves purposes beyond cost-saving, like social cohesion or national security strategy. To test this, you'd need to look at defense strategies of non-neutral countries. If they adopt conscription despite high opportunity costs, it supports the non-economic factors. But if only neutral states do, then neutrality is key. Also, public opinion data on military legitimacy in conscription vs professional armies could indicate if societal trust is a factor.

  The user's deeper need might be understanding why the economic model isn't sufficient and what other frameworks explain conscription's persistence. They might be building a case that neutrality requires a different approach, where conscription isn't just a tax but a tool for societal commitment. They need concise points that highlight the theory's limits and alternative explanations, especially in neutral states.
answer: |-
  1.  **Mapping:** The tax base is the conscript's labor time (especially peacetime), the tax rate is the gap between military compensation and the civilian market wage for their potential labor, paid in-kind by those drafted, with evasion penalties like Switzerland's tax surcharge or longer civilian service.
  2.  **What it nails:** Sweden's 2010 pause fits: rising national wealth dramatically increased the perceived deadweight loss (opportunity cost) of the draft, making a smaller, paid professional force appear economically efficient under peacetime assumptions.
  3.  **Where it breaks:** The theory cannot explain Sweden's 2017 reversal (reintroducing conscription despite higher opportunity costs), Finland's persistence, or Switzerland's 2013 referendum upholding conscription, as all contradict the prediction that rising wealth should permanently end the draft.
  4.  **Rival reading:** Conscription here functions primarily as a societal commitment device for armed neutrality – ensuring credible deterrence through mass mobilization potential, legitimizing the military as a "people's army," enforcing universal risk-sharing, and potentially improving selective recruitment quality (e.g., Sweden's smaller, targeted call-up from a large pool).
  5.  **Theory's status & test:** The tax frame is refuted as a *sufficient* explanation for these cases; it marks where non-economic factors (deterrence logic, social cohesion, political legitimacy) dominate. Evidence would be other wealthy non-neutral states adopting conscription despite high opportunity costs, or public opinion linking military legitimacy directly to conscription versus professional forces in these countries.
