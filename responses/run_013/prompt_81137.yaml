  Okay, the user is a retired field ecologist who spent 35 years working with long-lived species and is now diving into moral philosophy and long-term economics. They've noticed a recurring pattern in how discount rates are justified and are looking for a term to describe it. 

  Hmm, what they're describing is quite nuanced. They're observing that economists use a single discount rate number to determine how much future welfare matters, but when challenged, they justify it with three different types of arguments: market data (interest rates), psychological preference for immediate goods, and uncertainty about the future. The user feels these are being illegitimately pooled together to make the discount rate appear more robust than it really is. 

  I can see why this troubles someone with an ecology background. When you work with species that live for centuries, you develop a visceral understanding of intergenerational responsibility. The way economists collapse these distinct dimensions into one number must feel ethically shallow. 

  The user's suspicion about "phenomenological" coefficients is spot-on - in science, such terms are known to be descriptive rather than explanatory. But they're right that there's more at stake here: the pooling isn't just sloppy science, it's smuggling normative judgments into technical parameters. 

  This reminds me of ethical debates in climate policy where the same discount rate issue arises. Stern famously used 0.1% while others argued for 3% - that tiny numerical difference changes trillion-dollar decisions. The user's hunch about "moral laundering" feels accurate: by dressing value judgments in technical clothing, we avoid confronting hard ethical questions about our obligations to future generations. 

  I should emphasize that this isn't just about discount rates. We see similar moves in cost-benefit analyses for environmental regulations or healthcare rationing. Any time you quantify the unquantifiable (like the value of a human life), you risk this kind of category conflation. 

  The user's request for a new term makes sense - existing philosophical labels don't quite capture this particular sleight-of-hand. "Value conflation" might be too broad, "normative bundling" too jargon-heavy. "Moral laundering" has the right connotation of cleansing ethical stains through technical processes. 

  For their reply strategy, I'll suggest both deconstructing the bundled justifications AND demanding explicit ethical deliberation. An ecologist would appreciate the analogy to ecosystem interdependencies - we don't collapse all environmental factors into one metric because we know they interact complexly. Similarly, we shouldn't collapse distinct ethical dimensions into one discount rate.
answer: |-
  This is a profound observation that cuts to the heart of a critical flaw in long-term economic decision-making, particularly regarding intergenerational justice and sustainability. You've identified a genuine conceptual problem that deserves its own name. Existing terms don't fully capture it:

  1.  **Phenomenological Parameter:** (Your term) Accurate descriptively for its *technical function* (aggregating effects), but misses the *normative sleight of hand*.
  2.  **Fact/Value Gap or Naturalistic Fallacy:** Relevant, as descriptive facts (market rates, psychological preferences, risk) are used to justify a normative weight (how much future welfare *should* count). But it doesn't capture the *pooling* of multiple justifications.
  3.  **Hidden Premise:** True, but too broad. The hidden premise is the *equivalence* of the justifications and their *sufficiency* for the normative weight.
  4.  **Confusing Risk & Pure Time Preference:** A key distinction within the debate (e.g., Ramsey vs. descriptive approaches), but doesn't encompass the *broader pooling* of market, psychology, *and* risk into one morally-loaded number.

  **The Proposed Name: Moral Laundering via Discount Rate Conflation**

  **Definition:** The practice of justifying a single, normatively significant parameter (e.g., the social discount rate determining the moral weight of future welfare) by appealing interchangeably to a heterogeneous pool of justifications (e.g., observed market rates, revealed time preferences, pure risk, pure time preference, uncertainty). This pooling creates the illusion that the chosen value is:
      *   **Overdetermined:** Supported by multiple, seemingly independent lines of evidence.
      *   **Technically Robust:** Grounded in objective facts rather than ethical judgment.
      *   **Less Controversial:** Avoiding explicit confrontation of the underlying, distinct ethical questions inherent in each justification.

  **How it Differs from Nearest Neighbors:**

  *   **vs. Fact/Value Gap/Naturalistic Fallacy:** Focuses specifically on the *conflation and pooling* of *multiple* descriptive domains (markets, psychology, risk) to support *one* normative weight, creating a mirage of stronger justification. It's not just deriving 'ought' from 'is', but deriving *one specific 'ought'* from *several different 'ises'* treated as fungible.
  *   **vs. Hidden Premise:** Identifies the *specific* hidden premise: that these diverse justifications are mutually supportive and sufficient for the normative task, obscuring their distinct ethical implications and potential conflicts.
  *   **vs. Confusing Risk & Time Preference:** Expands the scope beyond just these two factors to include market-based justifications and the general pooling effect.

  **Where its Edges Lie:**

  *   **Core:** Applying a single discount rate derived from interchangeable justifications to determine the moral weight of distant future welfare in cost-benefit analysis or policy evaluation.
  *   **Edge Cases:**
      *   Using a single rate justified *only* by one type of argument (e.g., *only* market rates) is problematic (fact/value gap), but not *conflation*.
      *   Explicitly disaggregating the rate into distinct components (e.g., a pure time preference rate + a risk premium) and debating the ethics of each component separately avoids the conflation, even if the final *applied* rate is a sum.
      *   Using descriptive rates for purely predictive models (e.g., forecasting private investment) without attaching moral significance avoids the *moral* laundering aspect.

  **Does it Occur Elsewhere? Absolutely. It's a common pattern where technical parameters encode value judgments:**

  1.  **Health Economics:**
      *   **QALY/DALY Valuation:** The monetary value assigned to a Quality-Adjusted Life Year or Disability-Adjusted Life Year. Justifications might pool: willingness-to-pay studies (revealed preference), hypothetical surveys (stated preference), healthcare budget constraints (scarcity), and ethical arguments about equity. A single dollar figure then determines funding priorities, "laundering" diverse ethical considerations (e.g., age weights, severity weights) into a technical parameter.
      *   **Cost-Effectiveness Thresholds:** The $/QALY cutoff for funding decisions. Often justified by pooling historical funding decisions, GDP benchmarks, and political feasibility, obscuring the underlying value judgment about how much a life-year *should* be worth.
  2.  **Safety Regulation:**
      *   **Value of Statistical Life (VSL):** The dollar value used to assess whether safety regulations are "worth it." Justifications pool: labor market studies (wage premiums for risk), consumer behavior (safety feature purchases), hypothetical surveys, and sometimes political compromise. The single VSL number launders complex ethical debates about risk equity, dread risks, and the sanctity of life into a cost-benefit input.
      *   **"Acceptable" Risk Levels:** Defining thresholds for carcinogens or structural failures. Justifications might pool: historical precedent, technical feasibility, "natural" background levels, and societal tolerance – masking the ethical judgment about what level of imposed risk is morally permissible.
  3.  **Environmental Economics:**
      *   **Ecosystem Service Valuation:** Assigning dollar values to nature's benefits. Justifications often pool: market prices for related goods, travel cost methods, contingent valuation surveys, and replacement cost estimates. The single dollar figure launders deep ethical questions about intrinsic value, irreversibility, and rights of nature into a tradable commodity figure.
      *   **Carbon Pricing:** While ideally grounded in climate science, the *specific* price level chosen often involves pooling estimates of the Social Cost of Carbon (itself subject to discount rate issues!), political feasibility, economic impact models, and international comparisons, obscuring the core ethical judgment about intergenerational burden-sharing.

  **How to Reply: A Two-Pronged Approach**

  1.  **Strictly Disaggregate the Reasons:** Insist on separating the distinct justifications:
      *   *Market Rates:* What do they *actually* reveal? Short-term arbitrage? Myopia? Liquidity preference? Risk aversion? They are descriptive of *current* behavior under *existing* institutions, not normative for intergenerational ethics.
      * *Psychological Time Preference:* Is this a fundamental ethical principle ("later welfare is inherently less valuable") or a contingent fact about human cognition? If the latter, why should it dictate obligations to distant strangers? Should policy reinforce or counteract this bias?
      * *Risk/Uncertainty:* How much is pure exogenous risk (e.g., asteroid strike) vs. endogenous risk created by our own choices? How should different *types* of risk (catastrophic vs. marginal) be weighted ethically? Does discounting for risk apply equally to the *welfare* of future people or just the *flows* reaching them?
      * *Pure Time Preference (if claimed):* Demand explicit ethical justification for valuing the welfare of a future person *inherently* less simply because they exist later in time. Is this consistent with fundamental moral principles (e.g., impartiality)?

  2.  **Insist on Explicit Ethical Deliberation First:** Before any number is chosen:
      *   Frame the core question: "What do we *owe* to future generations? What is the basis of our obligation to them?"
      *   Acknowledge the distinct *types* of reasons that might influence the *implementation* of this obligation (risk, feasibility, opportunity cost) but demand that the *fundamental moral weight* assigned to future welfare be debated explicitly and transparently.
      *   Argue that the default should be a *low or zero* discount rate for pure time preference in intergenerational contexts, as per many philosophical arguments (e.g., Ramsey's "ethically indefensible" view, Rawlsian just savings principle, approaches based on impartiality). Deviations require strong, specific justification.
      *   Treat risk separately: Use explicit scenarios, sensitivity analysis, precautionary principles, or dedicated risk-adjusted metrics rather than folding it into the core discount rate for welfare.

  **In essence:** Your critique exposes a fundamental evasion. The "discount rate conflation" pools diverse, often weak or ethically problematic, justifications to create the illusion of an objective, technical solution for a deeply ethical question. The reply must force a separation: "First, tell me what you believe we *owe* the future. *Then* we can discuss how best to achieve it, accounting for risk and feasibility with tools appropriate to those specific challenges. Don't bury the moral judgment inside a number justified by a shifting mix of unrelated arguments." This move absolutely deserves the label **Moral Laundering via Discount Rate Conflation**.
