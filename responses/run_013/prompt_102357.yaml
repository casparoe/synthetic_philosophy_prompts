  Alright, the user is a 4th-year PhD student in philosophy, specializing in metaethics but moving into population ethics. They need to teach a 90-minute session on the procreation asymmetry to a mixed group of econ, bio grad students, lawyers, and an opinionated undergrad. The group has some utilitarian background but no population ethics experience. The main challenge is ensuring they grasp the asymmetry without falling into common misconceptions, especially conflating axiological and deontic aspects.

  First, I need to break down the user's explicit needs. They want a teaching plan that sequences the concepts logically, uses a central case study, anticipates and prevents misconceptions, and ends with a diagnostic question. The deeper concern is that the group might agree with the asymmetry superficially but then retreat to a conditional view where adding happy people becomes good once they exist. The user wants to make this move feel like a loss. Also, they want to clearly distinguish between axiological (adding happy people doesn't make the world better) and deontic (no reason to add them) claims.

  The user mentioned two detours to avoid: antinatalism and the repugnant conclusion. So the session must stay focused. I should identify what's essential and what can be skipped. The key is to keep the session tight, avoiding tangents but still covering necessary groundwork.

  The core of the asymmetry needs to be presented through a relatable case. The "Happy/Unhappy Child" case is classic, but the user is worried it's a trap. Why? Maybe because people might conflate the reasons against creating unhappy lives with the lack of reasons to create happy ones. So, the case needs to isolate the absence of a duty to create happy lives. Including a third scenario where the couple can create a happy child but chooses not to, highlighting that there's no moral reason to do so, could help.

  Timing is crucial. Allocating time for each segment: intro, core case, axiological vs. deontic, objections, and recap. Maybe 15 mins on the case, 20 on axiological/deontic, 15 on objections, etc. The diagnostic question at the end should reveal if they truly grasp the distinction or if they've defaulted to a conditional view.

  Anticipating misconceptions: participants might think the asymmetry is about avoiding harm versus not providing benefit. But the user wants to stress that adding a happy person isn't a benefit at all in the axiological sense. Also, they might conflate axiological and deontic, so explicitly defining and contrasting them with examples is vital.

  The user's unspoken need is to have the group confront the counterintuitive nature of the asymmetry without watering it down. They need the session to make the logical tension palpable, so that any retreat feels like a compromise. Using structured examples and forcing them to apply the concepts actively can help. The "Future Happy Person" case might serve this purpose by making the axiological claim clear and then challenging them to see why there's no duty to create that person.

  Leaving out repugnant conclusion and antinatalism is necessary. Announcing this upfront keeps the session focused. Groundwork like total vs. average utilitarianism should be touched on only if essential. Maybe mention person-affecting views briefly to show where the asymmetry comes from.

  Finally, the diagnostic question: asking whether adding a happy person is good in itself, and whether there's a duty to do it. If they answer 'no' to both, they get it. If they say it's good but not obligatory, they've missed the axiological point. This question should reveal their understanding.
answer: |-
  Here’s a battle-tested teaching plan for the procreation asymmetry, designed to force engagement with the core tension, prevent intuitive downgrades, and crystallize the axiological/deontic distinction. Total runtime: 90 mins.

  **Core Objective:** Make them feel the *weight* of the claim that adding a happy person isn't *good in itself* (axiological) and isn't *required* (deontic), even while agreeing it's *not bad* to do so.

  **The Central Case: "The Indifferent Couple"**  
  *This case avoids common traps by isolating the "no reason to create" intuition.*  
  > *Scenario A:* A couple knows any child they have will live a very happy life, but they are personally indifferent to having children. No financial, health, or practical barriers exist. They choose not to conceive.  
  > *Scenario B:* Same couple, but they know any child would live a *miserable* life (severe, incurable illness/pain). They choose not to conceive.  
  > *Scenario C:* (Crucial counterfactual) The couple *does* conceive a happy child.  

  **Why this case works:**  
  1.  **Avoids "Duty to Avoid Harm" Trap:** Scenario B cleanly shows the strong duty *not* to create a miserable being. This is uncontroversial and anchors the "asymmetry" side everyone accepts.  
  2.  **Isolates the "No Positive Duty":** Scenario A forces the question: Is there a *moral reason* for them to conceive *just because the child would be happy*? The intuitive answer is "No." They haven't *wronged* anyone by not creating the happy child.  
  3.  **Prevents "Conditional" Escape:** By making the couple indifferent, it blocks the move "Well, *if* they want kids, then creating a happy one *is* good." This case tests the *independent moral reason* for creating happiness where none existed before.  
  4.  **Sets up Axiological/Deontic Split:** It cleanly separates the deontic question (Did they have a *duty* in A? No.) from the upcoming axiological question (Is the world *better* in C than A?).

  **The Teaching Sequence (90 Mins):**

  1.  **Groundwork & Framing (10 mins):**  
      *   **State the Asymmetry Clearly:** "It is *wrong* to create a person whose life would be not worth living (unhappy). It is *not wrong* to refrain from creating a person whose life *would* be worth living (happy)." (Write this down).  
      *   **Announce Detours:** "We are *not* discussing: (1) Whether life is generally worth living (antinatalism), or (2) The Repugnant Conclusion. These are important but separate. Our focus is *only* on understanding this specific asymmetry claim."  
      *   **Set the Puzzle:** "The challenge: Most ethical theories (especially utilitarianism) treat causing happiness as good and preventing happiness as bad. This asymmetry seems to violate that. How can it be coherent?"

  2.  **Build Intuitive Consensus with "The Indifferent Couple" (15 mins):**  
      *   Present **Scenario B (Miserable Child):** *Q: Did they do the right thing? Why?* (Consensus: Yes, to avoid creating suffering/harm).  
      *   Present **Scenario A (Happy Child not created):** *Q: Did they do anything morally wrong? Is there a compelling moral reason they *should* have conceived?*  
          *   *Anticipated Answer:* No wrong, no strong reason.  
          *   *Key Push:* "Why not? We prevented a happy person from existing! Isn't preventing happiness usually bad?" Make them articulate the intuition. *Crucially, get them to state that there's **no duty**.*  
      *   **State the Deontic Asymmetry:** "So, we agree: Strong duty *not* to create unhappy person (B). *No duty* to create happy person (A). That's the deontic core."

  3.  **Introduce the Axiological Bomb & The Crucial Distinction (20 mins):**  
      *   Present **Scenario C (Happy Child created):** *Q: Is the world in Scenario C (happy child exists) better than the world in Scenario A (same state, no child)?*  
          *   *Anticipated Initial Answer:* "Yes, of course! There's more happiness!"  
      *   **The Reveal:** "But hold on. Remember Scenario A. We agreed the couple had *no duty* to create this child. If creating the child made the world *better*, wouldn't that *be* a strong moral reason (maybe even a duty) for them to do it? Yet we said there is *no such duty*."  
      *   **Force the Tension:** "We seem stuck: If adding the happy child *is* better (axiologically), then *not* adding them seems like making the world worse (failing to do good = bad?). But we strongly intuit that not adding them (Scenario A) is *not bad* and *not a failure*."  
      *   **Define & Separate:**  
          *   **Axiological Claim:** Adding a happy person does *not* make the world better (in itself). (World C is *not* better than World A).  
          *   **Deontic Claim:** There is *no duty* (moral reason/obligation) to add a happy person. (Action in A is *not wrong*).  
      *   **Connect:** "The asymmetry *requires* both claims. The deontic claim (no duty) we agreed on intuitively. The axiological claim (not better) is what *supports* the deontic claim consistently. If adding *were* better, the 'no duty' claim becomes very shaky."

  4.  **Head Off Downgrades & Misconceptions (25 mins - Interactive):**  
      *   **Misconception 1: "It's about harm vs. benefit."**  
          *   *Objection:* "Not creating a happy person isn't *harming* anyone, but it's still *failing to provide a benefit*."  
          *   *Counter:* "Who is deprived of the benefit in Scenario A? *There is no one* who exists who is made worse off by the non-creation. The 'benefit' (a happy life) isn't bestowed on any *existing* being. The axiological claim says this 'benefit' doesn't actually count as an *improvement* to the world state itself." (Use Person-Affecting language carefully if needed: "Better for whom?").  
      *   **Misconception 2: "Conditional Good" (The Downgrade You Fear):**  
          *   *Objection:* "Adding the happy person *is* good, *once they exist*. But since they don't exist beforehand, there's no duty to create them."  
          *   *Counter:* "Does this 'good' contribute to the overall value of the world? If yes, then World C *is* better than World A. If World C is better, then choosing World A (not creating) seems like choosing a *worse* world. Why isn't that wrong? Our intuition says it *isn't* wrong. The 'conditional good' move tries to keep the 'good' but avoids the duty – it guts the axiological force needed to explain why there's no duty." *Make this feel like a loss:* "If you say adding is *good* but *not required*, you've abandoned the core asymmetry intuition that there's *no independent reason* to create the happy child in the first place. You've made it merely *supererogatory* (good but not required), which doesn't capture the strong 'meh' of Scenario A."  
      *   **Misconception 3: "It's just about personal autonomy/choice."**  
          *   *Objection:* "It's not wrong in A because it's a personal decision."  
          *   *Counter:* "Agreed, but *why* is there no *moral* weight pushing them to create? If adding happiness *were* impersonally good, wouldn't that create *some* moral reason, even if outweighed by autonomy? Our asymmetry intuition says there's *zero* countervailing moral reason based on the potential happiness."  
      *   **Misconception 4: Conflating Axiological & Deontic:**  
          *   *Constantly reinforce:* "Remember: 'Not better' (Axiological) vs. 'Not wrong' (Deontic). They are distinct claims supporting the same asymmetry. Can you have one without the other?" (Prompt discussion: If adding *is* better but not required? If adding isn't better but is required? Both seem weird!).

  5.  **Diagnostic Question & Wrap-up (10 mins):**  
      *   **The Litmus Test:** "Consider this new case: Scientists can painlessly create a fully formed, perfectly happy human in a vat tomorrow. This person will live a long, blissful life entirely contained in the vat, interacting with no one else. They press the button.  
          *   **Question 1 (Axiological):** Did pressing the button *make the world a better place* (in itself, just by adding this happy life)?  
          *   **Question 2 (Deontic):** Would it have been *morally wrong* for the scientists *not* to press the button?"  
      *   **Why it works:** Isolates pure addition of happiness. No relationships, no resource drain, no existing person's desires affected. The "vat" eliminates distracting practicalities.  
      *   **What tells you they "got it":** A clear "**No**" to *both* questions.  
          *   **If they say:** "No to wrong (deontic), but *Yes* to better (axiological)" -> They downgraded (Conditional Good escape).  
          *   **If they say:** "No to better (axiological), but *Yes* to wrong (deontic)" -> Incoherent/confused.  
          *   **If they say:** "No to both" -> They grasp the full, strong asymmetry.  
      *   **Final Recap:** "The Procreation Asymmetry isn't just about when we *shouldn't* procreate (avoiding misery). Its radical core is that we lack a fundamental moral reason *to* procreate *even when we know the life would be happy*, because adding that happy life doesn't constitute an improvement in the impersonal value of the world. The 'no duty' rests on the 'not better'."

  **What You CANNOT Skip (Even if Time is Tight):**  
  1.  **The Indifferent Couple Case (Especially Scenario A & the tension with Scenario C).**  
  2.  **Explicitly defining and contrasting Axiological ("Is it better?") and Deontic ("Is it wrong?/Is there a duty?").** Hammer this distinction.  
  3.  **Directly confronting the "Conditional Good" downgrade** and showing why it abandons the core intuition (makes it supererogatory).  
  4.  **The Diagnostic Vat Case.**

  **What to Sacrifice Ruthlessly (Announce it):**  
  *   **Deep dives into justifications:** Person-Affecting Views vs. Impersonal Views, Non-Identity Problem nuances. Mention them as "where you'd look next" but don't explain.  
  *   **Totalism vs. Averagism:** Briefly define if needed ("Does value come from total happiness or average happiness?"), but don't let it derail. Say: "We're assuming a simple total happiness view *to expose the tension*, even if other views might avoid it."  
  *   **Any detailed discussion of Repugnant Conclusion or Antinatalism:** "Again, those are crucial topics *downstream* from this core asymmetry. For now, we're isolating *this specific puzzle*."

  **Key to Landing It:** Your energy. Model the intellectual discomfort. Show that the strong asymmetry *is* counterintuitive on a utilitarian framework – that's the point! Frame the "downgrade" not as a smart save, but as a surrender of the initial, powerful intuition that there's genuinely *no reason* to create the happy child in Scenario A. The Diagnostic Question forces honesty about whether they've truly accepted the strong claim. Good luck!
