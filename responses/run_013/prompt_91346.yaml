  ### Exam Question

  **Quantum Foundations Final Exam**  
  **Question 5 (20 marks)**  

  Consider a local hidden variable model for a pair of entangled particles:  
  - A shared hidden variable \(\lambda\) is drawn uniformly from \([0, 2\pi]\).  
  - Alice’s measurement along direction \(a\) yields outcome \(A(a, \lambda) = \text{sign}(\cos(\lambda - a))\).  
  - Bob’s measurement along direction \(b\) yields outcome \(B(b, \lambda) = -\text{sign}(\cos(\lambda - b))\).  

  (a) **Correlation function (4 marks)**  
     Derive the correlation function \(E(a, b) = \langle A(a, \lambda) B(b, \lambda) \rangle\). Express your answer in terms of the smallest angle \(\theta\) (in radians) between the vectors \(a\) and \(b\).  

  (b) **CHSH quantity (6 marks)**  
     Compute the CHSH quantity \(S = |E(a, b) - E(a, b') + E(a', b) + E(a', b')|\) for:  
     \[
     a = 0^\circ, \quad a' = 45^\circ, \quad b = 22.5^\circ, \quad b' = 67.5^\circ.
     \]
     Show all steps.  

  (c) **Comparison (4 marks)**  
     Compare your \(S\) from (b) to:  
     (i) The Bell-CHSH inequality bound.  
     (ii) The quantum mechanical prediction for the singlet state.  
     What does this imply about the model?  

  (d) **Interpretation (6 marks)**  
     This model reproduces the quantum correlations at \(\theta = 0^\circ\), \(90^\circ\), and \(180^\circ\) (i.e., \(E(0^\circ) = -1\), \(E(90^\circ) = 0\), \(E(180^\circ) = 1\)). Yet, quantum mechanics violates Bell’s inequality. Explain:  
     - Why the model does **not** violate the Bell-CHSH inequality.  
     - What this reveals about the relationship between matching quantum correlations at specific angles and violating Bell’s inequality.  

  ---

  ### Model Answer (≈650 words)  

  **(a) Correlation function**  
  The correlation \(E(a, b)\) is the expectation value of \(A(a, \lambda) B(b, \lambda)\). Since \(\lambda\) is uniform, we integrate over \(\lambda\):  
  \[
  E(a, b) = -\frac{1}{2\pi} \int_0^{2\pi} \text{sign}(\cos(\lambda - a)) \cdot \text{sign}(\cos(\lambda - b))  d\lambda.
  \]  
  Let \(\delta = a - b\). The product of signs depends only on \(\delta\). The integrand is periodic with period \(\pi\), so we compute over \([0, \pi]\) and double the result. For \(\theta = \min(|\delta|, 2\pi - |\delta|)\) (smallest angle in \([0, \pi]\) radians):  
  - For \(\theta \in [0, \pi]\), the integral evaluates to \(\pi - 2\theta\).  
  Thus,  
  \[
  E(a, b) = -1 + \frac{2}{\pi}\theta.
  \]  
  **Answer:** \(E(a, b) = -1 + \frac{2}{\pi}\theta\), where \(\theta\) is the smallest angle between \(a\) and \(b\).  

  **(b) CHSH quantity**  
  Convert angles to \(\theta\) (smallest angle in degrees) and use \(E(a, b) = -1 + \frac{\theta}{90}\):  
  - \(a\)–\(b\): \(\theta = 22.5^\circ\) → \(E(a, b) = -1 + 22.5/90 = -0.75\).  
  - \(a\)–\(b'\): \(\theta = 67.5^\circ\) → \(E(a, b') = -1 + 67.5/90 = -0.25\).  
  - \(a'\)–\(b\): \(\theta = |45^\circ - 22.5^\circ| = 22.5^\circ\) → \(E(a', b) = -0.75\).  
  - \(a'\)–\(b'\): \(\theta = |45^\circ - 67.5^\circ| = 22.5^\circ\) → \(E(a', b') = -0.75\).  
  Now compute \(S\):  
  \[
  S = \left| -0.75 - (-0.25) + (-0.75) + (-0.75) \right| = \left| -0.75 + 0.25 - 0.75 - 0.75 \right| = \left| -2.00 \right| = 2.00.
  \]  
  **Answer:** \(S = 2.00\).  

  **(c) Comparison**  
  (i) The Bell-CHSH inequality requires \(|S| \leq 2\). The model gives \(S = 2\), which saturates but does not violate the bound.  
  (ii) Quantum mechanics (singlet state) predicts \(S = 2\sqrt{2} \approx 2.828\) for these settings, violating \(|S| \leq 2\).  
  **Implication:** The model is a valid local hidden variable theory (it obeys Bell’s inequality) but fails to reproduce the quantum correlations for the CHSH combination.  

  **(d) Interpretation**  
  The model matches quantum correlations at \(0^\circ\), \(90^\circ\), and \(180^\circ\) because:  
  - At \(\theta = 0^\circ\), \(E = -1\) (perfect anticorrelation).  
  - At \(\theta = 90^\circ\), \(E = -1 + \frac{2}{\pi} \cdot \frac{\pi}{2} = 0\).  
  - At \(\theta = 180^\circ\), \(E = -1 + \frac{2}{\pi} \cdot \pi = 1\) (perfect correlation).  
  However, it **does not violate Bell’s inequality** because:  
  - At intermediate angles (e.g., \(22.5^\circ\)), the model’s correlation (\(E = -0.75\)) is weaker than quantum mechanics (\(E \approx -0.923\)).  
  - The CHSH quantity \(S = 2\) is the maximum possible for local models, but quantum mechanics requires \(S > 2\).  
  This reveals a key insight: **Matching quantum correlations at isolated angles is insufficient to violate Bell’s inequality**. Violation requires a specific *pattern* of stronger-than-classical correlations across *multiple* settings. Here, the model’s linear \(E(\theta)\) is too weak at \(22.5^\circ\) and \(67.5^\circ\) to exceed \(S = 2\), unlike quantum mechanics’ harmonic \(E(\theta) = -\cos\theta\). The tension in Bell’s theorem arises from quantum mechanics’ ability to achieve correlations that are *globally* stronger than any local model allows.  

