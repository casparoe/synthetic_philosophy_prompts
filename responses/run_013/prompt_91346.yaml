          Question:

          Consider the following local hidden variable model for a pair of particles:

            - A shared hidden variable λ is drawn uniformly from [0, 2π].
            - Alice measures along direction a, and her outcome is A(a, λ) = sign(cos(λ - a)).
            - Bob measures along direction b, and his outcome is B(b, λ) = -sign(cos(λ - b)).

          (a) [4 marks] Compute the correlation function E(a, b) = <A(a, λ) B(b, λ)> for this model. Express your answer in terms of the smallest angle θ (in radians) between the vectors a and b.

          (b) [6 marks] Using the result from (a), compute the CHSH quantity S for the settings:

                a = 0°,   a' = 45°,   b = 22.5°,   b' = 67.5°.

              Show your work.

          (c) [4 marks] Compare the value of S you obtained to the Bell inequality bound and to the prediction of quantum mechanics for the singlet state. What do you conclude about this model?

          (d) [6 marks] The model reproduces the quantum correlations at θ = 0°, 90°, and 180° (i.e., the same values as quantum mechanics). However, quantum mechanics violates the Bell inequality. Explain why this model does not violate the Bell inequality and what this illustrates about the requirements for violating a Bell inequality.

          Model Answer:

          (a) 
          The correlation function is given by:
            E(a, b) = -1 + (2/π) * θ,
          where θ is the smallest angle between a and b in radians, i.e., θ = min{ |a-b|, 2π - |a-b| } (with |a-b| taken modulo 2π to be in [0,2π)).

          (b)
          We work in degrees for simplicity and note that the formula in degrees is:
            E(a,b) = -1 + (θ_degrees) / 90,
          because θ_radians = θ_degrees * π/180, so (2/π)*θ_radians = (2/π)*(θ_degrees * π/180) = θ_degrees/90.

          Now, compute for each pair:

            - For (a,b) = (0°, 22.5°): θ = min(22.5, 360-22.5)=22.5° -> E = -1 + 22.5/90 = -0.75.
            - For (a,b') = (0°, 67.5°): θ = 67.5° -> E = -1 + 67.5/90 = -0.25.
            - For (a',b) = (45°, 22.5°): θ = |45-22.5| = 22.5° -> E = -0.75.
            - For (a',b') = (45°, 67.5°): θ = |45-67.5| = 22.5° -> E = -0.75.

          Then:
            S = |E(a,b) - E(a,b') + E(a',b) + E(a',b')| 
              = | -0.75 - (-0.25) + (-0.75) + (-0.75) |
              = | -0.75 + 0.25 -0.75 -0.75 |
              = | -2.00 | = 2.00.

          (c)
          The Bell inequality (CHSH) states that for any local hidden variable model, |S| ≤ 2. The model gives S=2, which saturates the bound but does not violate it. In contrast, quantum mechanics for the singlet state with these settings predicts S = 2√2 ≈ 2.828, which violates the Bell inequality.

          We conclude that this model is a local hidden variable model that does not violate the Bell inequality, and it does not reproduce the quantum correlations for the CHSH scenario (since quantum requires S=2.828).

          (d)
          The model reproduces the quantum correlations at θ=0° (E=-1), 90° (E=0), and 180° (E=1). However, at other angles, such as 22.5° and 45°, it does not match quantum mechanics. Specifically, at 45° the model predicts E=-0.5 while quantum mechanics predicts -cos(45°)= -√2/2 ≈ -0.707. The Bell inequality violation requires a specific pattern of correlations that are stronger than what this model provides. In particular, the quantum correlations are more negative at 22.5° (quantum: -cos(22.5°)≈-0.923, model: -1+22.5/90≈-0.75) and at 67.5° (quantum: -cos(67.5°)≈-0.383, model: -1+67.5/90≈-0.25) and also at the combined setting for CHSH. Therefore, the model, being local, cannot achieve the stronger correlations that quantum mechanics exhibits. This illustrates that to violate a Bell inequality, a model must produce correlations that are nonlocal in a very specific quantitative way that matches the quantum predictions, which this model does not do. The failure of this model to violate Bell's inequality is not due to any nonlocal behavior but because it does not match the quantum correlations closely enough.

