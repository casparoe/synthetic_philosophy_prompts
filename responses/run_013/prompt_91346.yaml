  - **D/F (<10)**: Fundamental errors (e.g., \(S>2\) in (b); claims model violates Bell).  

  **Targeted misconceptions**:  
  - **Mismatched angles (b)**: Using \(|a - b|\) instead of \(\min(|a-b|, 360^\circ-|a-b|)\) costs marks.  
  - **Overgeneralization (d)**: Assuming matching at \(0^\circ/90^\circ/180^\circ\) implies full QM compliance costs 2 marks.  
  - **"Nonlocality" red herring (d)**: Invoking nonlocality without addressing quantitative correlations costs 2 marks.  
  - **Ignoring intermediate angles (d)**: Failing to compare \(22.5^\circ\) (model: \(-0.75\) vs QM: \(-0.923\)) costs 2 marks.
