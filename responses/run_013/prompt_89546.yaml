prompt: |-
  At a neighborhood meeting I attended, two residents got into an argument I couldn't referee, and what I want is an adjudication of the exchange rather than a verdict on the project itself. The proposal is a four-story, forty-unit building — twelve of the units below market rate — replacing a single-family house and a small parking lot on a street zoned for single-family homes.

  The objector said the street is zoned single-family, that people bought in reliance on that scale, and that the building would shadow yards, add traffic, and crowd the elementary school; he isn't against housing, he said, but density belongs on the transit corridor three blocks away. The supporter answered that housing is a need rather than a preference, that the people who would live there are currently doubled up with relatives or commuting two hours, that the "character" argument is doing the work of keeping out people poorer than the objector, and that the infrastructure objection proves too much, since the objector's own house strains the same pipes and roads.

  The objector replied that he isn't claiming a right to exclude anyone in particular, only a say in decisions about his own environment — a say the newcomers would also have once they arrived. The asymmetry, he said, is that his surroundings change without his consent while they gain, and since someone has to decide, the people who already live there are the ones with standing. The supporter said that consent of the governed is a doctrine about states, not streets; that the would-be residents never consented to being kept out; and that he is converting a contingent fact — arriving first — into authority, so that had he bought ten years later he would be the one locked out and would call it unjust.

  The objector then said he has a right to the city too: the right to inhabit and shape the place one lives, not merely to be housed somewhere. The supporter, he said, seems to mean by that phrase a right to live wherever one likes, which is a different right and cannot be unlimited without collapsing into "developers may build anything." The supporter answered that the right to the city was always about use rather than exchange value — inhabitants shaping their place against the logic of property — which is why it favors the renters on the block over the landlord, and which does not license freezing the street in amber. She added that the objector's own principle, that one may not use the law to better one's position by worsening others', applies to the status quo as well: the zoning that casts no shadow and adds no traffic also locks people out, and he isn't counting the excluded as worsened because they were never here.

  Please adjudicate this point by point — who is right about which specific claims, where each of them overreaches, and what, if anything, both are missing. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating the question.
reasoning: |-
  Alright, let me unpack this neighborhood dispute. The user wants a point-by-point adjudication of the argument between the objector and supporter, not a verdict on the project itself. 

  First, I notice the user is framing this as a referee task - they attended a meeting but felt unequipped to judge the exchange. That suggests they value nuanced understanding over simple takes. The way they meticulously reconstruct both sides tells me they're probably community-minded, maybe even in a leadership role.

  Hmm... the core tension here is between stability and change, embodied in two compelling but incomplete arguments. The objector leans hard on procedural fairness ("we were here first") and tangible impacts (shadows, traffic), while the supporter frames housing as a human need and exposes how "character preservation" often masks exclusion. 

  Let me mentally test their claims:
  - Objector's "reliance on zoning" has legal weight but ignores zoning's historical role in segregation. 
  - His "consent" argument feels democratic until you realize it silences future residents. 
  - Supporter's "human need" trumps "neighborhood character" ethically, but she brushes aside infrastructure concerns too lightly. 
  - Both miss that this isn't binary - better design could mitigate shadows/traffic, and phased development might ease school crowding.

  Interesting how they both invoke "right to the city" but mean opposite things! Objector sees it as control over immediate environment; supporter as access to opportunity. Philosophically, the supporter edges closer to Henri Lefebvre's original concept of urban citizenship over property rights. 

  The user's request for "what both miss" is key. Neither addresses that cities are living systems - neighborhoods change, but change needs managed transition. Also unspoken: how market forces exploit both sides' arguments to avoid actual solutions like inclusive zoning reforms.

  *adjusts mental model* For the ruling: I'll need to validate parts of both positions while showing where their logic fails. The supporter wins on moral urgency but loses points for dismissing livability concerns; objector has legitimate worries but his principles crumble under scrutiny. Biggest gap? Both treat housing as a zero-sum game when connectivity investments (transit/bike lanes) could actually improve quality of life for all.

  Final structure: Lead with "both partially right" verdict, then dissect each exchange pair with surgical fairness, end on shared blind spots. User gets their adjudication without me taking sides on the project - perfect.
answer: |-
  **Neither party is entirely right or wrong; both advance valid but incomplete arguments while overreaching on key claims.**  

  ### Adjudication of Specific Claims:  
  1. **Zoning Reliance & Neighborhood Character:**  
     - *Objector's valid point:* Existing residents reasonably relied on zoning for predictable development scale. Sudden high-density shifts can cause tangible harms (shadow, traffic).  
     - *Overreach:* Framing "character" as inherently exclusionary isn’t baseless, but equating all opposition to exclusion oversimplifies legitimate concerns about infrastructure strain.  
     - *Supporter's valid point:* Invoking "character" historically perpetuates exclusion; preserving low-density zoning locks out needed housing.  

  2. **Infrastructure (Traffic, Schools, Pipes):**  
     - *Objector's valid point:* Adding 40 units *will* strain local infrastructure; dismissing this ignores real impacts.  
     - *Overreach:* Claiming the project uniquely "strains" systems ignores that *all* development adds load—including the objector’s home.  
     - *Supporter's overreach:* Dismissing infrastructure concerns because "existing homes also strain systems" is a false equivalence—40 units impose *disproportionate* impact.  

  3. **Consent and Standing:**  
     - *Objector's valid point:* Residents deserve input in local changes affecting their daily environment.  
     - *Overreach:* Asserting that "arriving first" grants exclusive standing ignores the rights of potential residents. His "asymmetry" argument disregards the asymmetry of exclusion.  
     - *Supporter's valid point:* Excluded residents never consented to exclusion; prioritizing incumbents entrenches inequality. "First arrival" isn’t moral authority.  

  4. **"Right to the City":**  
     - *Objector's valid point:* The right involves shaping one’s environment—not unlimited building. "Developers may build anything" is a legitimate slippery-slope concern.  
     - *Overreach:* Framing the project as invalidating residents’ agency ignores that change is inherent to cities.  
     - *Supporter's valid point:* The right centers *use* (housing as a need) over *exchange value* (property interests). Freezing neighborhoods "in amber" harms marginalized groups.  
     - *Overreach:* Suggesting the objector’s stance *only* serves exclusion overlooks nuanced place attachment.  

  ### What Both Miss:  
  - **The objector** ignores that zoning laws (which he defends) actively worsen others' lives by restricting supply and inflating costs. His "worsening others" principle applies equally to exclusionary zoning.  
  - **The supporter** underestimates legitimate place-based attachment and the need for *managed* transition (e.g., phased density, infrastructure upgrades). Dismissing all opposition as NIMBYism avoids addressing mitigatable harms.  
  - **Both** treat housing as a zero-sum conflict. Solutions exist (e.g., targeted impact fees, school expansions, design modifications to reduce shadows) that balance growth with livability.  

  ### Bottom Line on Overreach:  
  - **Objector** overreaches by conflating *procedural input* with *veto power* and downplaying exclusionary impacts of status quo zoning.  
  - **Supporter** overreaches by dismissing infrastructure concerns as invalid and reducing "right to the city" to mere access without acknowledging community agency in adaptation.  

  **Crucial Gap:** Neither grapples with collaborative governance—e.g., binding community benefits agreements or incremental upzoning—that could address displacement fears while expanding housing access. The debate falsely pits "incumbents vs. newcomers" when both share interests in sustainable, inclusive communities.
