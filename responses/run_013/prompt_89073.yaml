  Materials:
  - Paper and pens for each worker.
  - A whiteboard to record points and rules.
  - Tokens are points recorded on paper.

  Stakes without money: We use points that are recorded. At the end, the student with the most points might get a prize (e.g., chocolate) or just the satisfaction. But the instructor should emphasize that the points represent real welfare.

