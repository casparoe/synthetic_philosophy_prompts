answer: |-
  ### Labour Negotiation Simulation: The Binding Power Game

  **Objective:** Students experience the tension between individual liberty and collective efficacy in unionisation, confronting the free-rider problem and coercion dilemma through hands-on negotiation under shifting rules.

  **Roles & Setup:**
  - **Employer:** Played by the instructor (to ensure consistent, profit-driven decisions).  
  - **Workers:** 18 students. Each has a "productivity value" of 100 points for the employer.  
  - **Reservation Wage:** Workers require 50 points to accept employment (below = reject).  
  - **Minimum Workforce:** Employer needs ≥10 workers to operate (otherwise, earns 0).  
  - **Materials:** Whiteboard (track rules/points), tokens (or tallied points), role cards, timers, decision slips.  
  - **Stakes:** Points convert to bragging rights/small prize (e.g., "Top Negotiator" certificate). Losses feel real via public scoring and peer pressure.  

  **Rounds (20 mins each):**  
  *Total: 80 mins gameplay, 10 mins debrief.*

  ---

  #### **Round 1: Individual Bargaining (Baseline)**  
  **Rules:**  
  - Employer sets one take-it-or-leave-it wage for all.  
  - Workers secretly accept/reject on slips.  
  - If ≥10 accept, employed workers get the wage; employer gets `(100 - wage) × workers hired`.  

  **Predictable Outcome:**  
  Employer offers 50 (reservation wage). All accept. Workers earn 50 each; employer earns 850.  
  *→ Teaches: Dispersed workers = no leverage against concentrated employer.*

  ---

  #### **Round 2: Voluntary Association (Liberty to Join)**  
  **Rules:**  
  - Workers secretly choose to join the union (cost: 5 points dues, paid upfront).  
  - Union negotiates wage *only for members*.  
  - Employer then sets a separate wage for non-union workers.  
  - Union can strike if offer rejected (members unemployed).  
  - Non-union workers accept/reject individually.  

  **Predictable Outcomes:**  
  - Free-riding: Many skip joining to avoid dues, hoping others unionise.  
  - If union ≥8 members: Can force higher wage (e.g., 80) by threatening strike (non-union <10). Non-union get 50.  
  - If union <8: Employer rejects demands, hires non-union at 50. Union members lose dues and wages.  
  *→ Workers feel: Voluntary unions fail without critical mass; free-riders profit if union wins, but weaken collective power.*

  ---

  #### **Round 3: Binding Association (Agency Shop)**  
  **Rules:**  
  - Union automatically represents all.  
  - All workers pay 5 points fee (regardless of membership).  
  - Union negotiates one wage for everyone.  
  - Strike = all workers idle (employer earns 0).  

  **Predictable Outcomes:**  
  Union demands high wage (e.g., 90). Employer accepts (rejecting = 0 profit). Workers net 85 (90 - fee).  
  *→ Workers feel: Binding non-members enables high wages, but forces fees on all—coercion enables collective power.*

  ---

  #### **Round 4: Protected Opt-Out (Right-to-Work)**  
  **Rules:**  
  - Workers choose to join union (dues: 5 points) or not.  
  - Union negotiates one wage for all.  
  - If employer rejects, union votes to strike:  
    - **Strike:** Only union members strike. Non-union can work.  
    - **No strike:** Employer sets wage unilaterally.  

  **Predictable Outcomes:**  
  - Free-riding surges (non-members avoid dues but get union wage).  
  - Union shrinks (<8). Employer rejects high demands. Union avoids strike (members fear losses). Employer sets wage to 50. Non-union net 50; union nets 45 (50 - dues).  
  *→ Workers feel: Opt-outs cripple solidarity; individual "choice" restores employer dominance.*

  ---

  ### Debrief (10 mins)  
  **Map Game → Concepts:**  
  1. **Round 1:** "Dispersed many vs. concentrated few" → Individual bargaining = race to the bottom.  
  2. **Round 2:** "Liberty vs. efficacy" → Voluntary association fails without binding rules (free-riders undermine power).  
  3. **Round 3:** "Coercion as corrective" → Binding fees offset employer’s structural advantage. Ask: *"Did high wages justify compulsion?"*  
  4. **Round 4:** "Inequality of refusal" → Opt-outs seem "free" but enforce employer’s baseline power.  
  **Core Insight:** The right to organise isn’t a privilege—it’s a counterweight to pre-existing market inequality.  

  **Predictable Problems & Fixes:**  
  - **Problem:** Round 2 stalemate (workers deadlock on joining).  
    **Fix:** Announce time limit; remind of minimum workforce rule.  
  - **Problem:** Employer misplays (e.g., rejects viable offer).  
    **Fix:** Instructor as employer must act rationally (maximise profit).  
  - **Problem:** Students dismiss coercion as "unfair" without reflection.  
    **Fix:** In debrief, contrast Round 3’s high wages with Round 4’s collapse.  

  **Limitation:** The game cannot simulate *long-term trust* (e.g., unions fostering solidarity). **Supply in Debrief:** Argue that real-world rights address chronic power imbalances—not short-term gains.  

  ---

  One-line summary: **Forcing workers to live the shift from voluntary association (where free-riders sabotage power) to binding rules (where coercion enables gains) makes the structural bind visceral.**
