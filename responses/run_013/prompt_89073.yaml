  1. In phase 2, workers might not coordinate and the union might not form (too few join). This is expected and part of the lesson.
  2. In negotiations, the union might demand too high or too low. The instructor (as employer) should act rationally to maximize profit.
  3. Time: we have to keep to strict time limits. Use a timer.

