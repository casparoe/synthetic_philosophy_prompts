  The user's proposition is that Mary gains genuine propositional knowledge. Dev argues that it's acquaintance, a third category beyond propositions or abilities. The user wants probabilities broken down into terms: new concept over old fact, whether knowing what it's like is propositional, if the intuition survives scrutiny, physicalism accommodating this, and crucially, if acquaintance is a genuine third category.

