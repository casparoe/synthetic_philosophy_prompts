  Just had a marathon argument with my friend Dev (philosophy grad, extremely stubborn, will not let a point go) about Mary's room, and I need a number from someone outside the fight, because we went in circles for like three hours and I honestly can't tell anymore whether we were even disagreeing about the same thing. Let me state the proposition as precisely as I can so it actually has a truth value: Mary has complete physical knowledge of everything there is to know about colour vision and the brain, then leaves her black-and-white room and sees a ripe tomato for the first time. The claim I want your credence on is that Mary thereby comes to know a fact she did not know before -- i.e. she gains genuine propositional knowledge, not merely a new ability, a new concept, or a new way of representing a fact she already had. Give me your number, but mostly give me the decomposition, one line and a rough probability for each term: the probability that the new-concept-over-old-fact move works and there is no new fact; the probability that knowing what it's like is really propositional at all rather than an ability or a skill; the probability that the raw intuition that she learns something survives careful scrutiny instead of being a trick of how we describe her before and after; the probability that physicalism is fine and the extra knowledge just lives in some non-propositional category; and whatever other term you think belongs. Then show me how they combine.

  Here's the twist that I actually want you to weigh in on. Dev's position is weirder than the standard she-just-gains-an-ability line -- he says that when Mary sees red she becomes acquainted with a property, and he insists that this acquaintance is neither propositional knowledge nor an ability, it's a third kind of thing entirely, and that the whole literature is confused because everyone keeps trying to force the case into one of those two boxes. So please add an explicit term for the probability that acquaintance really is a genuine third category here and not just a fancy relabelling of one of the other two. For the record my credence in the original claim is about 0.55 and Dev's is about 0.15 (though he kept moving the goalposts so it might be lower), and I want to know where our disagreement most likely lives -- is it the metaphysics of facts, the semantics of knowing how vs knowing that, or just a raw clash of intuitions about the case. Finally, tell me which single sub-question my 0.55 is most sensitive to and what actual argument or bit of evidence would move me off it, because Dev is definately going to bring this up again at dinner and I'd like to have something better than we were both tired.
