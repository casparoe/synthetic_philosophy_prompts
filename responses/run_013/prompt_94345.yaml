  Fifth term: P(Acquaintance as genuine third category). Dev's key point. Is acquaintance distinct? I think it's possible, but often reducible. P(Real third category) = 0.3. Low because it might just be a reconceptualization.

  Now, combining these. The overall probability is multiplicative under independence. P(New propositional knowledge) = P(No concept move) * P(Propositional) * P(Intuition survives) * P(Not accommodated by physicalism) * P(Acquaintance not third) or something like that. I need to structure it so that all conditions must hold for the proposition to be true.

