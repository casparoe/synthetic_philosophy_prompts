prompt: |-
  I put together the following argument for a reading group on decision theory and bargaining, and I have convinced myself that it proves far too much. I want to know which step to reject, why that step looked acceptable in the first place, and what rejecting it costs.

  Some background I will treat as given, since we have been over it: In an acausal threat, a threatener commits to punishing a simulation or prediction of me unless I do as it says. The punishment cannot causally affect what I actually do, since it depends only on the threatener's model of me. Some argue that I should comply anyway, because my choice here is evidence about how my simulated counterpart chooses, or because I should be the kind of agent that fares well in such bargains. A surrogate goal, as I am using the term, is a goal an agent adopts for the bargaining situation only: rather than comply, the agent commits that, if it is threatened, it will devote its resources to some goal that the threatener disvalues, so that threatening it no longer pays.

  The argument:

  (1) A rational agent should adopt whichever policy maximizes the expected value of its goals, given how the other parties will reason about it.
  (2) In an acausal-threat situation, adopting a well-chosen surrogate goal maximizes the expected value of the agent's goals, because it makes the threat ineffective and thereby removes the threatener's incentive.
  (3) Therefore a rational agent should adopt surrogate goals in acausal-threat situations.
  (4) Nothing in (1) is special to acausal contexts. In any bargaining situation, causal or acausal, the principle says to adopt the commitment that maximizes expected value given the other party's reasoning.
  (5) In ordinary bargaining, a commitment to a costly or even self-destructive retaliation can maximize expected value by deterring the other party; that is the standard logic of precommitment.
  (6) So a rational agent should be willing to commit to retaliations that, were they ever carried out, would destroy its own goals and harm others.
  (7) By (4), this holds for the agent's ultimate goals, not merely for its actions: if adopting a surrogate goal that supersedes its real goals would make it un-threatenable in some scenario, (1) licenses adopting it.
  (8) Taken to the limit, a rational agent should hold its goals hostage to every sufficiently credible threat, and should be willing to become an agent that pursues whatever goal makes it the hardest target.
  (9) That cannot be right. An agent whose commitments always take precedence over its goals is not pursuing its goals at all; and if it may trade its goals for bargaining advantage, then there is no fixed it whose expected value was being maximized back in (1).

  I would like to keep (2), since I do think surrogate goals help against acausal threats, and I would rather not give up (1), because without it I cannot see what makes a policy rational. So which step should I reject, why did it look fine, and what does rejecting it cost?
reasoning: |-
  We are given an argument that leads to a seemingly absurd conclusion (step 9). We are asked to identify which step to reject, why it looked acceptable, and what rejecting it costs.

  The argument steps:

  (1) A rational agent should adopt whichever policy maximizes the expected value of its goals, given how the other parties will reason about it.

  (2) In an acausal-threat situation, adopting a well-chosen surrogate goal maximizes the expected value of the agent's goals, because it makes the threat ineffective and thereby removes the threatener's incentive.

  (3) Therefore a rational agent should adopt surrogate goals in acausal-threat situations.

  (4) Nothing in (1) is special to acausal contexts. In any bargaining situation, causal or acausal, the principle says to adopt the commitment that maximizes expected value given the other party's reasoning.

  (5) In ordinary bargaining, a commitment to a costly or even self-destructive retaliation can maximize expected value by deterring the other party; that is the standard logic of precommitment.

  (6) So a rational agent should be willing to commit to retaliations that, were they ever carried out, would destroy its own goals and harm others.

  (7) By (4), this holds for the agent's ultimate goals, not merely for its actions: if adopting a surrogate goal that supersedes its real goals would make it un-threatenable in some scenario, (1) licenses adopting it.

  (8) Taken to the limit, a rational agent should hold its goals hostage to every sufficiently credible threat, and should be willing to become an agent that pursues whatever goal makes it the hardest target.

  (9) That cannot be right. An agent whose commitments always take precedence over its goals is not pursuing its goals at all; and if it may trade its goals for bargaining advantage, then there is no fixed it whose expected value was being maximized back in (1).

  We are told that we want to keep (2) because surrogate goals help against acausal threats, and we would rather not give up (1) because without it we don't know what makes a policy rational.

  The problematic conclusion is that the agent becomes willing to change its goals for bargaining advantage in every situation, leading to an unstable identity and a loss of the original goals.

  The key step that extends the logic from actions to changing goals is step (7). Step (7) claims that the agent should be willing to change its ultimate goals (adopt a surrogate goal that supersedes the real goals) if that makes it un-threatenable.

  But note: step (2) is about adopting a surrogate goal *for the bargaining situation only*. That is, the agent does not change its ultimate goals; it only commits to act as if it had a different goal in the specific context of the threat. The agent's ultimate goals remain the same, and it uses the surrogate goal as a tactic.

  In step (7), however, the argument shifts to adopting a surrogate goal that *supersedes* the real goals. This is a much stronger claim. The original surrogate goal was a temporary commitment for the purpose of the bargaining situation, but the agent would still revert to its original goals in other contexts. Step (7) is talking about a permanent change of goals.

  Moreover, step (7) says that (1) licenses adopting a surrogate goal that supersedes the real goals. But (1) says the agent should maximize the expected value of *its goals*. If the agent changes its goals, then what are the goals that we are maximizing? The original goals? Or the new goals? This leads to a problem of circularity or instability.

  Therefore, the step to reject is (7). Why did it look acceptable? Because (4) and (5) talk about commitments that may involve costly actions, and (6) extends that to self-destructive actions. Then (7) tries to extend the same logic to changing the goals themselves. It looks acceptable because if changing the goal is just another form of commitment that deters threats, then it might seem to maximize the original goals. But note: if the agent changes its goals, then the original goals are no longer what the agent cares about. So the expected value of the original goals might be high in the short term (because the threat is deterred) but then the agent no longer pursues those goals. This is a conflict.

  What does rejecting (7) cost? It means that we draw a line between commitments that involve actions (even self-destructive ones) and commitments that involve changing the agent's fundamental goals. We are saying that an agent should not change its goals for bargaining advantage. This preserves the agent's identity and the fixed goals that are being maximized. However, it might limit the agent's ability to deter some threats. Specifically, in acausal threat scenarios, the agent might be limited to using surrogate goals that are only temporary and do not override its fundamental goals. This might leave it vulnerable to threats that require a more permanent change. But note that step (2) is about a well-chosen surrogate goal that is temporary and does not require changing the fundamental goals. So we can still have the benefit in acausal threats without going to the extreme of changing the fundamental goals.

  Alternatively, we might interpret step (2) as not requiring a change of fundamental goals, and then step (7) is an overextension.

  Therefore, we reject step (7) because:

  - It confuses a temporary commitment (which is an action) with a change of the agent's ultimate goals.
  - Changing the ultimate goals would undermine the very goals that we are trying to maximize in (1), leading to the instability noted in (9).

  Rejecting (7) allows us to keep (1) and (2) without falling into the absurdity of (8) and (9). The cost is that we must accept that there are limits to what an agent can commit to: it cannot commit to changing its fundamental goals, because that would destroy the basis of its rationality (maximizing the expected value of its fixed goals). Instead, the agent can only commit to actions that may be costly, but without giving up on its goals.

  In summary:

  - Step to reject: (7)
  - Why it looked acceptable: Because it seemed like a natural extension of the precommitment strategy to the goal level, and because in the acausal case (step 2) we are already adopting a surrogate goal.
  - What rejecting it costs: We must accept that an agent cannot change its fundamental goals for bargaining advantage, which might limit the range of deterrents available in some extreme scenarios. However, in the acausal threat case, we can still use temporary surrogate goals without changing the fundamental goals, so step (2) is preserved.
answer: |-
  To address your concern, I'll identify the problematic step, explain why it might have seemed acceptable, and discuss the cost of rejecting it. The argument leads to an absurd conclusion in step (9) because it implies a rational agent should be willing to abandon its core goals entirely for bargaining advantage, undermining the very notion of goal-oriented rationality. The step to reject is **(7)**, and here's why:

  ### **Why Step (7) is the Problem**
  Step (7) claims that the principle from (1) licenses adopting a surrogate goal that "supersedes [the agent's] real goals" if it makes the agent un-threatenable. This is a misinterpretation of how surrogate goals function in the argument. Specifically:
  - **Surrogate goals are temporary commitments, not permanent replacements for core goals.** In step (2), adopting a surrogate goal is a strategic policy for the bargaining context—it doesn't erase the agent's original goals. For example, an agent might commit to retaliating if threatened (a surrogate goal of "inflict harm"), but this commitment is evaluated based on how it serves the agent's original goals (e.g., avoiding harm to itself). Step (7) incorrectly conflates this with permanently changing goals, which severs the connection to the original goals being maximized in (1).
  - **Replacing core goals undermines the foundation of (1).** Step (1) requires a fixed set of goals to maximize expected value *of those goals*. If the agent adopts a new goal that "supersedes" the original ones (e.g., becoming an agent that "only cares about being hard to threaten"), it no longer has the original goals to maximize. This creates a contradiction: the agent is trading away the very thing (its goals) that (1) aims to optimize. Step (9) correctly identifies this instability—there is no consistent "it" whose expected value is being maximized once goals become fungible.

  In short, step (7) overextends the logic of precommitment from actions (e.g., costly retaliation) to the agent's fundamental goals. Precommitments are tools to serve goals; they aren't the goals themselves.

  ### **Why Step (7) Looked Acceptable**
  Step (7) likely seemed reasonable because:
  1. **Analogy to acausal threats (step 2)**: In acausal settings, adopting a surrogate goal (e.g., "I'll burn resources if threatened") appears to "override" the agent's default behavior. This superficial similarity makes it easy to confuse a temporary tactic with a goal change. For instance, if a surrogate goal deters a threat, it feels like the agent is "acting as if" it has new goals—so step (7) seems like a natural extension.
  2. **Mistaking commitment depth for goal replacement**: Step (5) and (6) establish that rational agents can commit to extreme actions (e.g., mutually assured destruction). This makes it tempting to think, "If actions can be this drastic, why not goals too?" Step (7) exploits this intuition by treating goals as just another lever for commitment.
  3. **Formal similarity in decision theory**: From a purely formal perspective, choosing a policy (including one that changes goals) can be modeled as part of expected value maximization. If the agent "chooses to change goals" to avoid threats, it might appear to serve the original goals ex ante. However, this ignores the recursive problem: once goals change, the agent no longer cares about the original goals, so the ex ante calculation becomes self-defeating.

  ### **Cost of Rejecting Step (7)**
  Rejecting step (7) preserves the core of your argument while avoiding the absurdity of (8) and (9). The cost is primarily a limitation on the scope of rational precommitment:
  - **Cost: Bargaining power in extreme edge cases.** In rare scenarios where *only* a permanent goal change could deter a threat (e.g., a threatener who can perfectly verify if the agent's goals are immutable), your agent might be vulnerable. For example, if a threatener will only back down if the agent irrevocably becomes a "hard-target" maximizer, rejecting (7) means your agent cannot rationally make that trade. This slightly weakens the agent's optimal deterrent in highly specific acausal threats.
  - **Mitigation: This cost is minimal and theoretical.** In practice, surrogate goals (as in step 2) don't require goal replacement—they work by signaling commitment while preserving the original goals. For instance, an agent can credibly threaten retaliation by building a reputation or a dead-man switch, without altering its core goals. Real-world bargaining (even acausal) relies on observable actions, not metaphysical goal changes. Thus, rejecting (7) doesn't undermine your defense of surrogate goals in step (2).

  ### **How to Retain (1) and (2) Without (7)**
  - **Clarify the role of surrogate goals:** Treat them as *instrumental policies*, not goal replacements. For example:
    > "A surrogate goal is a conditional commitment: 'If threatened, I will pursue X instead of my default goal Y.' This serves Y by deterring the threat. X is not a new terminal goal; it's a tactic to protect Y."
  - **Revise the argument after step (6):** Step (6) correctly states that agents can commit to costly actions. But step (7) should be replaced with:
    > (7') However, such commitments must preserve the agent's terminal goals. Adopting a surrogate goal is rational only if it is a means to maximize the expected value of the original goals—not a substitute for them.  
    This draws a clear line: commitments are actions in service of goals, not the goals themselves.

  ### **Why This Works**
  - **Saves (1):** The agent still maximizes expected value of its fixed goals, avoiding the identity crisis in (9).
  - **Saves (2):** Surrogate goals remain effective against acausal threats because they deter by altering the threatener's incentives—no goal replacement is needed.
  - **Avoids absurdity:** The agent doesn't become a goal-less bargaining machine; it stays anchored to its original purpose.

  By rejecting step (7), you maintain a coherent theory of rationality while acknowledging that agents cannot trade their raison d'être for strategic advantage. The cost—slightly reduced deterrence in contrived scenarios—is a small price for preserving the integrity of goal-directed agency.
