answer: |-
  ### Decision Procedure for Evaluating Collective Explanations

  Below is a step-by-step decision procedure for reviewers to evaluate proposals using collective terms (e.g., "culture," "institution," "market"). It distinguishes three readings of collective terms (shorthand for individuals, relational structure, collective agent) and ensures collective-level forces only operate through individuals—without requiring micro-level data or derivation. The procedure is designed for a 20-minute review, with clear stopping points for rejection or escalation to you (the panel head) for a values call.

  ---

  #### **Decision Procedure: Step-by-Step Questions**
  1. **Identify the collective term(s) in the explanation.**
     - *If no collective term is used*, the explanation is **individualistic** and **acceptable**. Stop here.
     - *If collective terms are used*, proceed to Question 2 for each term.

  2. **What is the role of the collective term? (Categorize it)**
     - **Option A (Type 1: Shorthand for individuals)**: The term is a summary of individual actions, beliefs, or traits (e.g., "the culture of prescribing" means "most doctors in the area believe X").  
       - *If yes*, it is **acceptable**. Move to the next collective term or stop if done.
     - **Option B (Type 2: Relational structure)**: The term refers to a network, institution, or system that constrains/enables individuals (e.g., "market expectations" meaning competitive pressures from peer firms).  
       - *If yes*, proceed to Question 3.
     - **Option C (Type 3: Collective agent)**: The term is treated as having beliefs, desires, or agency (e.g., "the union decided" as if it were a person).  
       - *If yes*, proceed to Question 4.
     - *If unclear or ambiguous*, escalate to the panel head (you) for a values call.

  3. **For Type 2 (Relational structure): Does the explanation specify how the structure affects individuals?**
     - **Check**: Look for a mechanism linking the structure to individual actions (e.g., "norms pressure doctors" or "network ties expose managers to peers").  
       - *If a plausible mechanism is described or implied* (even without data), it is **acceptable**. Stop or move to next term.  
       - *If no mechanism is described or implied*, **reject** (it’s a placeholder).  
     - *If the mechanism is disputed or unclear*, escalate to the panel head.

  4. **For Type 3 (Collective agent): Does the explanation ground the agent's "wants/beliefs" in individuals and affect them?**
     - **Check**: Ensure the agent’s actions are mediated by individuals (e.g., "the union’s decision emerged from member votes" and "the strike affected members").  
       - *If yes*, it is **acceptable**. Stop or move to next term.  
       - *If the agent acts independently* (e.g., "the culture demanded change" without individual mediation), **reject**.  
     - *If grounding is weak but plausible*, escalate to the panel head.

  ---

  #### **Key Rules for Reviewers**
  - **Time limit**: Complete in 20 minutes. Focus on the proposal’s text; do not infer unsupported mechanisms.
  - **No micro-data required**: Accept mechanisms that are *described* (e.g., "social norms influence doctors") even if no individual data exists. Reject only if *no mechanism is mentioned or implied*.
  - **Escalation**: Escalate to the panel head if:
    - The collective term’s type is ambiguous (Question 2).
    - The mechanism is plausible but contested (Questions 3–4).
    - It’s a values call about funding "structural" vs. "agentic" science.
  - **Rejection**: Only if:
    - Type 2/3 terms lack a mechanism (Questions 3–4).
    - Type 3 agents act without individual mediation (Question 4).

  ---

  ### **Applying the Procedure to Your Three Examples**
  We run the procedure on each proposal explanation. For simplicity, we assume minimal proposal text (as provided) and no individual-level data.

  #### **1. Prescribing rates explained by a local culture of prescribing.**
  - **Step 1**: Collective term = "local culture."
  - **Step 2**: Categorize the term.  
    - Not Type 1 (not shorthand: "culture" implies more than individual actions).  
    - Not clearly Type 3 (not treated as an agent with beliefs).  
    - **Type 2 (relational structure)**: Culture as shared norms/practices constraining doctors. Proceed to Step 3.
  - **Step 3**: Mechanism through individuals?  
    - Explanation lacks a described mechanism (e.g., no mention of how norms influence doctors).  
    - **Verdict: Reject**. Fails Step 3—no link to individuals.  
  - **Why?** "Culture" is used as a black box. Even without data, the proposal must describe *how* culture affects behavior (e.g., "peer pressure shapes decisions").

  #### **2. A firm's adoption of a practice explained by its position among similar firms.**
  - **Step 1**: Collective term = "position among similar firms" (relational structure).
  - **Step 2**: **Type 2 (relational structure)**: The firm’s network position constrains its actions. Proceed to Step 3.
  - **Step 3**: Mechanism through individuals?  
    - Explanation lacks a described mechanism (e.g., no mention of how the network position influences the firm’s decision-makers).  
    - **Verdict: Reject**. Fails Step 3—no link to individuals within the firm.  
  - **Why?** The explanation stops at the firm level. It must specify how the network affects individuals (e.g., "managers imitate peers due to competitive pressure").

  #### **3. A union striking because its members wanted higher wages.**
  - **Step 1**: Collective term = "union."
  - **Step 2**: **Type 3 (collective agent)**: The union is portrayed as an agent ("striking") with wants (implied by members' desires). Proceed to Step 4.
  - **Step 4**: Grounding in individuals?  
    - Yes: The union’s "want" (for higher wages) is explicitly grounded in members’ wants. The strike affects members. Mechanism is implied (e.g., collective action emerges from member consensus).  
    - **Verdict: Accept**. Passes Step 4—collective agency is mediated through individuals.  
  - **Why?** No independent agency; the union’s action is derived from and affects members.

  ---

  ### **Which Verdict Will Annoy You and Why**
  **The verdict on Example 2 (firm adoption) will annoy you.**  
  - **Why annoyance?** This explanation is common in organizational sociology, where "network position" is often accepted as a valid structural explanation without individual-level mechanisms. Rejecting it may feel overly rigid or dismissive of established macro-level science.  
  - **Where the procedure misfires**:  
    - The procedure **over-enforces individualism** in a case where the field (e.g., economic sociology) routinely treats firms as units of analysis without micro-foundations. Requiring a mechanism (Step 3) misfires because:  
      - The proposal may have firm-level data only (e.g., inter-firm networks), making individual mechanisms impractical.  
      - "Position among similar firms" is a legit relational explanation, and demanding individual mediation could exclude influential structural science you might want to fund.  
    - **Root cause**: The procedure prioritizes methodological individualism in Step 3, even when holism (e.g., relational structures) is defensible. This clashes with your requirement to avoid banning Type 3 (collective agents) but inadvertently penalizes Type 2 (structures) in contexts where individualism is infeasible or unconventional.  

  **Recommendation**: Adjust Step 3 for Type 2 terms to allow structural explanations *without* individual mechanisms if the proposal justifies why the structure operates supra-individually (e.g., in fields like network theory). This would require a values call by you, preserving flexibility.
