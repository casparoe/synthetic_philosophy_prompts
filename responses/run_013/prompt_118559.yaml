  1. **Shorthand for individual facts**: The collective term is just a summary of individual actions, beliefs, etc.
  2. **Relational structure**: The collective term refers to a structure (e.g., network, institution) that constrains individual actions.
  3. **Agent with beliefs and wants**: The collective term is treated as if it were an agent having its own mental states.

  We do not want to ban the third reading outright, but we want to ensure that any explanation that uses a collective term as an agent must not have that agent acting independently of individuals. That is, the collective-level phenomena must be mediated through individuals.

