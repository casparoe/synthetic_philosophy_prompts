  1. **Identify the collective term(s) in the explanation.**
     - If there is no collective term, then the explanation is individualistic and passes. (But note: the examples given do have collective terms.)
     - For each collective term, proceed.

  2. **Clarify the role of the collective term:**
     - Is the collective term being used as a mere aggregation (shorthand) of individual facts? If yes, then it's acceptable (type 1) and we move to the next collective term or, if none left, accept.
     - If not, then ask: Is the collective term being used to denote a structure (like a network, set of rules, positions) that constrains or enables individual actions? If yes, then it's type 2 and we move to step 3.
     - Otherwise, is it being treated as an agent (with beliefs, desires, intentions)? Then it's type 3 and we move to step 4.

  3. **For type 2 (relational structure):**
     - Does the explanation specify (or imply a plausible mechanism for) how the structure affects individuals? (Note: We don't require data, but the mechanism must be described or implied in a way that it works through individuals.)
