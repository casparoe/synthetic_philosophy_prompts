prompt: |-
  I teach the decision-theory module in a PhD-level seminar on rationality, and I'm assembling the take-home portion of this year's final. My recurring frustration is that the Ellsberg material gets answered by reciting ambiguity aversion and gesturing at the sure-thing principle, so I cannot tell from a script whether the candidate could reconstruct why the two-urn case is supposed to embarrass subjective expected utility at all, or whether they understand what the various repairs to that framework actually surrender. I want a single question that forces the reconstruction rather than the label, so please draft the question itself, a model answer of roughly 700 words, and a marking scheme worth 25 points that separates an A from a B answer by naming the specific moves each must contain and the specific errors that should cost marks. No citations are needed; I will attach the reading myself, and I would rather the standard be stated in terms of arguments than in terms of who said what.

  Here is the material I want the question to work with, including one twist of my own that should be folded in. Part (a) should ask the candidate to take the two-urn setup — Urn A holding fifty red and fifty black balls with the composition known, Urn B holding a hundred balls of unknown composition — and show that for an agent maximizing subjective expected utility, the comparison between betting on red from A and betting on red from B turns only on whether the prior over B's composition gives red a predictive probability above, below, or equal to one half, so that no prior whatsoever can make the agent strictly prefer the known urn for both colours at once. From this they should draw the moral about the popular claim that Ellsberg's subjects simply hold a different prior rather than a non-SEU preference. Part (b) should present a variant and ask the candidate to adjudicate it: a colleague proposes to de-ambiguate the unknown urn by having its composition set by a fair coin — heads yielding sixty red and forty black, tails forty red and sixty black — and predicts that once the composition is generated by a known chance device, the preference for the known urn will vanish. The candidate should say whether the prediction is correct and what its holding or failing would reveal about whether the preference is best read as aversion to compound risk, aversion to a particular source of uncertainty, or something about the agent's epistemic position relative to others. Part (c) should ask for the smallest set of changes to the expected-utility apparatus that would accommodate the preference, with the candidate naming at least two inequivalent repairs and identifying the axiom or assumption each one sacrifices, so that it becomes clear that relaxing expected utility is not a single move.

  The model answer needs to be precise enough to serve as the standard, so please do not let it slide over the difference between the two-urn case and the single-urn three-colour case, nor over the distinction between ambiguity aversion as a property of preferences over acts and ambiguity aversion as a property of the agent's second-order beliefs. The marking scheme should be explicit about which moves are load-bearing — the ones a merely competent B answer can omit while still passing — and which are the moves that mark the difference between a genuine reconstruction and a rehearsal of the received summary, and it should include, for each must-hit point, a one-line note on how candidates typically get that point wrong.
reasoning: |-
  We are going to design a single question with three parts (a, b, c) as per the instructions. The question should force the candidate to reconstruct the Ellsberg paradox and its implications, rather than just labeling the concepts.

  **Question Draft:**

  **Final Exam Question: Ellsberg Paradox and Ambiguity**

  Consider two urns:
  - Urn A contains 50 red balls and 50 black balls. The composition is known.
  - Urn B contains 100 balls, but the exact number of red and black balls is unknown.

  (a) Show that for an agent who maximizes subjective expected utility (SEU), the comparison between betting on a red ball drawn from Urn A and betting on a red ball drawn from Urn B depends solely on the agent's prior about the composition of Urn B. Specifically, prove that no prior over the possible compositions of Urn B can make the agent strictly prefer betting on red from Urn A to betting on red from Urn B, and at the same time strictly prefer betting on black from Urn A to betting on black from Urn B. Use this result to explain why the common claim that Ellsberg's subjects might simply hold a different prior (and are still SEU maximizers) is untenable.

  (b) A colleague proposes a variant: Urn B is replaced by an urn whose composition is determined by a fair coin toss. If the coin lands heads, the urn has 60 red and 40 black balls; if tails, it has 40 red and 60 black balls. The coin is tossed once to set the composition, but the outcome is hidden. The colleague predicts that in this setup, the preference for betting on the known urn (Urn A) over the now-deambiguated Urn B will vanish. Is this prediction correct? Discuss what the presence or absence of a preference for Urn A in this scenario would reveal about the nature of the ambiguity aversion observed in the original Ellsberg two-urn setup. Specifically, consider whether it supports interpreting the aversion as (i) aversion to compound risk, (ii) aversion to the particular source of uncertainty (e.g., lack of known probabilities), or (iii) something about the agent's epistemic position relative to others (e.g., the agent knows they are ignorant while others might not be).

  (c) Name at least two distinct and inequivalent ways to modify the expected-utility framework to accommodate the preferences observed in the original two-urn Ellsberg experiment (i.e., the preference for betting on the known urn for both colors). For each modification, identify the specific axiom or assumption of subjective expected utility that is sacrificed. Your answer should make clear that accommodating ambiguity aversion is not a single unified move in decision theory.

  ---

  **Model Answer (approx 700 words):**

  **(a)** In the two-urn Ellsberg setup, an SEU agent assigns a subjective prior probability distribution over the possible compositions of Urn B. Let the proportion of red balls in Urn B be \( p \), which can range from 0 to 1. The agent's prior is a distribution over \( p \). The expected utility of betting on red from Urn A is fixed: \( EU(\text{bet on red from A}) = 0.5 \cdot u(win) + 0.5 \cdot u(lose) \). Similarly, for betting on black from A: \( EU(\text{bet on black from A}) = 0.5 \cdot u(win) + 0.5 \cdot u(lose) \). Without loss of generality, we can set \( u(win)=1 \) and \( u(lose)=0 \), so both bets on A yield expected utility 0.5.

  For Urn B, the expected utility of betting on red is the agent's subjective probability that a red ball is drawn, which we denote by \( P_B(\text{red}) \). This is the expectation of \( p \) under the prior: \( P_B(\text{red}) = E[p] \). Similarly, \( P_B(\text{black}) = E[1-p] = 1 - E[p] \). Therefore, the expected utility of betting on red from B is \( E[p] \), and for black it is \( 1 - E[p] \).

  The agent strictly prefers betting on red from A to betting on red from B if and only if \( 0.5 > E[p] \). Similarly, they strictly prefer betting on black from A to betting on black from B if and only if \( 0.5 > 1 - E[p] \), which simplifies to \( E[p] > 0.5 \). The two inequalities \( 0.5 > E[p] \) and \( E[p] > 0.5 \) are mutually exclusive. Therefore, no prior can make the agent strictly prefer the known urn (A) for both colors simultaneously.

  This result shows that the typical Ellsberg finding (where subjects prefer to bet on the known urn for both colors) cannot be explained by any prior within the SEU framework. The claim that subjects might have a different prior (e.g., one that is pessimistic about the unknown urn) fails because a prior that makes the unknown urn unattractive for red would necessarily make it attractive for black, and vice versa. The pattern of preferences violates the sure-thing principle (or the independence axiom in the Anscombe-Aumann framework) and thus challenges the descriptive and normative adequacy of SEU.

  **(b)** The colleague's prediction is not entirely correct. The variant replaces the complete ambiguity of Urn B with a two-stage compound lottery: first a coin toss (with known probability 0.5) determines the composition, then a ball is drawn from the resulting urn. The expected probability of drawing a red ball in this setup is: 
  \[ P(\text{red}) = P(\text{heads}) \cdot P(\text{red} | \text{heads}) + P(\text{tails}) \cdot P(\text{red} | \text{tails}) = 0.5 \cdot 0.6 + 0.5 \cdot 0.4 = 0.5. \]
  Similarly, the expected probability of black is 0.5. Hence, an SEU maximizer would be indifferent between betting on red (or black) from the deambiguated Urn B and Urn A.

  However, empirical evidence (like the original Ellsberg experiments extended to compound lotteries) suggests that many subjects still exhibit a preference for Urn A in this scenario. This indicates that the aversion is not solely due to the reduced expected probability (which is 0.5 in both cases) but might be due to the compound nature of the risk. This is called aversion to compound risk.

  If the preference for Urn A persists, it reveals that the ambiguity aversion in the original two-urn case is not merely about the lack of known probabilities (because now probabilities are known at every stage) but about the structure of the uncertainty. The agent might dislike the two-stage lottery because it is more complex or because the uncertainty is compounded. Alternatively, it might reflect a deeper aversion to the particular source of uncertainty: the fact that in the original Ellnberg the uncertainty was due to ignorance (epistemic uncertainty) whereas in the known urn it's due to chance (aleatory uncertainty). However, in the coin-toss variant, the first stage is aleatory (the coin) but the second stage (the ball draw) is also aleatory once the composition is fixed. Yet, the agent might still be averse because the entire process is more complex or because the agent feels less competent in evaluating compound lotteries.

  Moreover, if the agent knows that the coin toss is hidden, then they are aware that they are in a situation of information asymmetry (the experimenter knows the outcome) but they do not. This might trigger an aversion due to the epistemic position: the agent might feel that they are at a disadvantage relative to the experimenter. This is distinct from the original two-urn case where no one (not even the experimenter) knows the composition of Urn B. Therefore, the persistence of the preference in the coin-toss variant might indicate that the aversion is driven by the agent's awareness of their own ignorance in a context where others might have more information (though in the coin-toss variant, the experimenter does have more information). Alternatively, if the preference vanishes, then it suggests that the aversion in the original was due to the lack of a known probability (which now is provided by the coin) and not due to the compound structure.

  **(c)** Two inequivalent ways to modify SEU to accommodate ambiguity aversion are:

  1. **Maxmin Expected Utility (MEU)** proposed by Gilboa and Schmeidler: This model replaces the single prior with a set of priors and evaluates an act by its minimum expected utility over the set. The key axiom sacrificed is the independence axiom (or the sure-thing principle). The agent's preference is represented by \( \min_{P \in \mathcal{C}} E_P[u(f)] \), where \( \mathcal{C} \) is a convex set of priors. In the two-urn case, the set of priors for Urn B might include all possible compositions. Then, the minimum expected utility for betting on red from B is 0 (if the prior that assigns p=0 is in the set) and similarly for black. Thus, the agent would strictly prefer the known urn for both colors because 0.5 > 0.

  2. **Smooth Ambiguity Preferences** (e.g., Klibanoff, Marinacci, and Mukerji): This model introduces second-order probabilities over the possible compositions and a function φ that captures ambiguity attitude. The utility is \( E_{\mu} [ \phi( E_{\pi}[u(f)] ) ] \), where μ is a second-order distribution over the first-order probabilities π. The key assumption sacrificed is the reduction of compound lotteries (or the independence axiom in a compound setting). If φ is concave, the agent is ambiguity averse. For Urn B, the second-order distribution μ might be uniform over p, and then φ applied to the first-order expected utility (which is p for red) would yield a certainty equivalent less than 0.5 if φ is concave.

  These two models are inequivalent: MEU uses a set of priors and a maxmin criterion, while the smooth model uses a second-order probability and a concave transformation. They sacrifice different axioms: MEU drops independence, while the smooth model drops reduction of compound lotteries (and requires a more complex structure).

  ---

  **Marking Scheme (25 points total):**

  **Part (a) [10 points]**

  - **3 points:** Correctly compute the expected utility for bets on Urn A (0.5 for both red and black, under the normalization u(win)=1, u(lose)=0).  
    *Common mistake: Failure to normalize or incorrect calculation of the known urn.*

  - **4 points:** Express the expected utility for Urn B in terms of the prior expectation E[p] (so EU(red from B) = E[p], EU(black from B)=1-E[p]).  
    *Common mistake: Treating the unknown urn as having a fixed but unknown p without taking expectation over the prior.*

  - **3 points:** Show that the conditions for strict preference of A over B for both colors lead to contradictory inequalities (0.5 > E[p] and E[p] > 0.5).  
    *Common mistake: Arguing that the agent must have E[p]=0.5 without demonstrating the contradiction for strict preference.*

  - **2 points:** Draw the correct moral: that no SEU prior can explain the observed preferences, so the claim that subjects have a different prior is untenable.  
    *Common mistake: Stating that the result shows ambiguity aversion without explaining why the prior-based explanation fails.*

  **Part (b) [8 points]**

  - **2 points:** Recognize that the deambiguated urn has an overall probability of 0.5 for red (and for black) and hence an SEU maximizer would be indifferent.  
    *Common mistake: Claiming that the probability remains ambiguous.*

  - **3 points:** Discuss whether the preference might persist (aversion to compound risk) or vanish (aversion due to lack of known probabilities).  
    *Common mistake: Only considering one possibility without acknowledging that both are empirically possible and have different implications.*

  - **3 points:** Relate the presence or absence of preference to the three interpretations:  
    - If the preference vanishes, it suggests aversion due to lack of known probabilities (source of uncertainty).  
    - If the preference persists, it suggests aversion to compound risk or the structure of the lottery.  
    - Also, note the epistemic aspect: the hidden coin creates an information asymmetry, which might cause aversion even if probabilities are known.  
    *Common mistake: Failing to distinguish between the interpretations or conflating compound risk with source uncertainty.*

  **Part (c) [7 points]**

  - **3 points:** Present two inequivalent models (e.g., MEU and Smooth Ambiguity) and state the key feature of each.  
    *Common mistake: Offering two models that are equivalent in this context (e.g., both are essentially min-max) or not clearly inequivalent.*

  - **2 points:** For each model, identify the specific axiom or assumption sacrificed:  
    - MEU: Independence axiom (or sure-thing principle).  
    - Smooth model: Reduction of compound lotteries (or the axiom that requires indifference between compound and reduced lotteries).  
    *Common mistake: Vaguely stating "independence" for both or not specifying the exact axiom.*

  - **2 points:** Explain how each model accommodates the Ellsberg preferences (briefly, as in the model answer).  
    *Common mistake: Only naming the models without showing how they work in the two-urn case.*

  **Grading Standard:**
  - **A (21-25 points)**: Hits all the must-hit points, including a clear and precise reconstruction in (a), a nuanced discussion in (b) that considers multiple interpretations, and two clearly distinct models in (c) with correct axioms sacrificed. The answer must demonstrate a deep understanding of the underlying mechanics and not just recite labels.
  - **B (16-20 points)**: Covers the main points but might omit some nuances (e.g., in part (b) only considers one interpretation without the other, or in part (c) describes two models but without clearly stating the sacrificed axioms, or in part (a) does not explicitly show the contradiction). Might contain minor inaccuracies but overall shows competence.
  - **C (11-15 points)**: Misses key elements, such as failing to show the contradiction in (a), not calculating the probability in the coin-toss variant correctly, or only providing one model in (c) and not discussing axioms.
  - **D (6-10 points)**: Significant gaps, such as not understanding the role of the prior in (a), misrepresenting the coin-toss scenario in (b), or not providing two models in (c).
  - **F (0-5 points)**: Little to no understanding of the material.

  **Must-hit points for an A**: 
  - In (a): Explicit derivation of the contradiction for strict preference, and the moral about the untenability of the prior-based explanation.
  - In (b): Recognition that the overall probability is 0.5 and that the persistence or vanishing of the preference has implications for the interpretation of ambiguity aversion, including at least two of the three interpretations (compound risk, source uncertainty, epistemic position).
  - In (c): Two distinct models, each with a specific sacrificed axiom and a brief explanation of how they accommodate the preference.

  **Common pitfalls that cost marks** (as noted above in the marking scheme).
answer: |-
  ### Final Exam Question: Ellsberg Paradox and Decision Theory

  **Part (a)**  
  Consider the classic two-urn Ellsberg setup: Urn A contains 50 red and 50 black balls (known composition), and Urn B contains 100 balls of unknown red/black composition. Prove that for an agent maximizing subjective expected utility (SEU), no prior over Urn B’s possible compositions can simultaneously justify a strict preference for betting on red from Urn A over red from Urn B *and* a strict preference for betting on black from Urn A over black from Urn B. Use this result to refute the claim that Ellsberg-consistent preferences can be rationalized by SEU with "pessimistic priors."  

  **Part (b)**  
  A colleague proposes a variant: Urn B’s composition is determined by a fair coin toss—heads yields 60 red/40 black, tails yields 40 red/60 black. The coin is tossed once (unseen) to fix the composition. The colleague predicts this eliminates the strict preference for Urn A. Assess this prediction: If subjects *retain* a strict preference for Urn A, what does this imply about whether ambiguity aversion reflects (i) aversion to compound risk, (ii) aversion to the *source* of uncertainty, or (iii) the agent’s awareness of their epistemic disadvantage? What if the preference *vanishes*?  

  **Part (c)**  
  Identify two *inequivalent* modifications to SEU that accommodate strict preference for Urn A for both colors. For each, specify:  
  - The formal change to the decision rule.  
  - The axiom of SEU sacrificed.  
  - Why the modification succeeds where SEU fails.  

  *(Confine answers to 700 words total. Assume standard SEU axioms and u(win) = 1, u(lose) = 0 for bets.)*  

  ---

  ### Model Answer (700 words)  

  **Part (a)**  
  Under SEU, an agent assigns a prior over Urn B’s compositions. Let \( p \) be the proportion of red balls in Urn B, with prior density \( f(p) \) over \([0,1]\). The expected utility of betting on red from Urn A is \( 0.5 \times 1 + 0.5 \times 0 = 0.5 \). For Urn B, the subjective probability of red is \( E[p] = \int_0^1 p  f(p)  dp \), so expected utility is \( E[p] \).  

  A strict preference for betting on red from A over B requires \( 0.5 > E[p] \). For black, the expected utility from A is \( 0.5 \) (since \( P(\text{black}) = 0.5 \)), and from B is \( 1 - E[p] \) (as \( P(\text{black}) = E[1-p] = 1 - E[p] \)). A strict preference for black from A over B requires \( 0.5 > 1 - E[p] \), or equivalently \( E[p] > 0.5 \).  

  These inequalities—\( 0.5 > E[p] \) and \( E[p] > 0.5 \)—are mutually exclusive. Thus, no prior can satisfy both. The claim that Ellsberg subjects are SEU maximizers with pessimistic priors fails: Pessimism for red (\( E[p] < 0.5 \)) implies optimism for black (\( E[p] < 0.5 \implies 1 - E[p] > 0.5 \)), forcing indifference or preference for Urn B on black. The data (strict preference for A for both colors) violates SEU’s core tenet that beliefs are probabilistic.  

  **Part (b)**  
  The colleague’s prediction is incorrect if subjects retain a strict preference for Urn A. The deambiguated Urn B is a compound lottery: a 50% chance of facing a 60-red urn and 50% of facing a 40-red urn. The *reduced* probability of red is \( 0.5 \times 0.6 + 0.5 \times 0.4 = 0.5 \), identical to Urn A. SEU predicts indifference.  

  If subjects *still* prefer Urn A:  
  - This rejects "source aversion" alone (e.g., distrust of human uncertainty), as the source is now objective (a coin).  
  - It supports **aversion to compound risk**: Subjects dislike the two-stage process (coin toss then draw), violating the reduction axiom. The uncertainty is epistemically equivalent but structurally more complex.  
  - It may reflect **epistemic disadvantage awareness**: The coin outcome is hidden, so subjects know the experimenter has superior information. This "knowledge gap" induces aversion distinct from ambiguity.  

  If the preference *vanishes*:  
  - It suggests aversion was driven by **lack of known probabilities** in the original Urn B. The coin provides sharp probabilities, converting ambiguity to risk.  
  - It undermines compound-risk aversion as the primary cause, as the compound structure remains but is deemed irrelevant.  

  Empirically, evidence suggests preferences often persist, stressing the salience of uncertainty structure over source.  

  **Part (c)**  
  Two inequivalent repairs:  

  1. **Maxmin Expected Utility (Gilboa-Schmeidler)**  
     - *Change*: Replace the SEU expectation with \( \min_{P \in \mathcal{C}} E_P[u] \), where \( \mathcal{C} \) is a set of priors. For Urn B, \( \mathcal{C} = \{ p : p \in [0,1] \} \), so \( \min E[u(\text{red})] = 0 \) and \( \min E[u(\text{black})] = 0 \).  
     - *Axiom sacrificed*: **Independence** (or C-independence). Preferences violate \( f \succ g \implies \alpha f + (1-\alpha) h \succ \alpha g + (1-\alpha) h \).  
     - *Success*: Urn A yields \( 0.5 > 0 \) for both colors, accommodating strict preference.  

  2. **Smooth Ambiguity Aversion (Klibanoff et al.)**  
     - *Change*: Use second-order beliefs: \( E_\mu \left[ \phi \left( E_{\pi}[u] \right) \right] \), where \( \mu \) is a prior over \( \pi \) (first-order beliefs), and \( \phi \) is concave. For Urn B, \( \mu \) uniform over \( p \), \( \phi \) concave yields \( E_\mu[\phi(p)] < \phi(E_\mu[p]) = \phi(0.5) \).  
     - *Axiom sacrificed*: **Reduction of compound lotteries**. Acts are evaluated with two-layer uncertainty, not reduced.  
     - *Success*: With \( \phi \) concave, \( E_\mu[\phi(p)] < 0.5 \) for red, and similarly \( E_\mu[\phi(1-p)] < 0.5 \) for black, allowing strict preference for Urn A.  

  These are inequivalent: Maxmin uses worst-case beliefs without second-order probabilities; Smooth Ambiguity uses second-order beliefs and curvature of \( \phi \). Both sacrifice different axioms: Independence vs. Reduction. This shows ambiguity aversion requires distinct conceptual fixes.  

  ---  

  ### Marking Scheme (25 points total)  
  **A (21–25)**: Reconstructs proofs, adjudicates variant correctly, identifies *inequivalent* repairs with sacrificed axioms.  
  **B (16–20)**: Minor gaps (e.g., vague on sacrificed axioms, or missteps in variant analysis).  
  **C (11–15)**: Superficial (e.g., labels without derivation, omits key distinctions).  
  **D (6–10)**: Major errors (e.g., misstates SEU, fails part (a) proof).  
  **F (0–5)**: Incoherent.  

  #### Part (a) [9 points]  
  - **3 pts**: Compute expected utilities: Urn A red/black yields 0.5; Urn B red yields \( E[p] \), black yields \( 1 - E[p] \).  
    *Common error: Claims Urn B probabilities equal without prior.*  
  - **3 pts**: Prove mutual exclusivity: \( 0.5 > E[p] \) and \( E[p] > 0.5 \) cannot hold jointly.  
    *Common error: Assumes \( E[p] = 0.5 \) necessary.*  
  - **3 pts**: Refute "pessimistic prior" claim: Explains that pessimism for one color implies optimism for the other.  
    *Common error: States aversion exists but doesn’t link to SEU contradiction.*  

  #### Part (b) [8 points]  
  - **2 pts**: Note reduced probability of red in variant is 0.5 (SEU predicts indifference).  
    *Common error: Claims probabilities remain ambiguous.*  
  - **3 pts**: If preference persists: Attributes to compound risk or epistemic disadvantage.  
    *Common error: Confuses compound risk with source aversion.*  
  - **3 pts**: If preference vanishes: Attributes to resolved ambiguity (source aversion irrelevant).  
    *Common error: Omits epistemic disadvantage or mislabels as "ambiguity remains."*  

  #### Part (c) [8 points]  
  - **4 pts**: Two inequivalent models (e.g., Maxmin and Smooth Ambiguity). Describes decision rule for each.  
    *Common error: Names two functionally identical models (e.g., Maxmin and α-MEU without distinction).*  
  - **2 pts**: Correct sacrificed axiom per model (e.g., Independence for Maxmin; Reduction for Smooth).  
    *Common error: Vaguely cites "independence" for both.*  
  - **2 pts**: Explains how each accommodates strict preference for Urn A.  
    *Common error: Only states it works without showing why (e.g., "Min yields 0 < 0.5").*  

  #### Load-bearing distinctions (A-grade must hit)  
  - **A-grade**: Rigorous proof of SEU contradiction in (a); explicit analysis of epistemic vs. compound risk in (b); axioms sacrificed clearly named and distinct in (c).  
  - **B-grade**: May omit epistemic disadvantage in (b) or under-specify axioms in (c).  

  ---  
  **Rationale**: This question forces reconstruction by demanding proof (a), causal adjudication (b), and axiomatic comparison (c). The model answer provides a self-contained standard, emphasizing conceptual distinctions over citations.
