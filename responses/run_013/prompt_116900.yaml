prompt: |-
  I'm a postdoc and I'm giving a paper at our metaphysics reading group in a few weeks. Heres my line, roughly, and then I'll tell you who's in the room.

  Everyone in the finks-and-masks literature treats finkish cases and masked cases as two species of one thing -- "antidotes" that make the conditional "if triggered, it would manifest" come out false while the disposition is still present -- and then concludes that the conditional analysis of dispositions is dead. I think that's too fast, because finks and masks aren't the same kind of case. In a fink, the triggering event itself removes the basis of the disposition, so the counterfactual is false at a time when the disposition is genuinely there: real counterexample. In a mask, the disposition and its basis are untouched and something merely sits between the trigger and the manifestation. So I want to say the right conditional for "x is disposed to M when T" isn't "if T, x would M" but something like "if T and nothing interfered, x would M" -- and that this isn't an ad hoc save, because the interferer is exactly the kind of thing the disposition was never a disposition to overcome. Payoff: masks don't refute the analysis at all, only finks do, so the anti-dispositionalist's case is far narrower than the literature makes out and rests entirely on whether finks are unavoidable or just engineered. (I still dont know what to do about mimics -- the mirror-image cases where the conditional comes out true and there's no disposition -- so I'm planning to punt on them in the talk, which I suspect is a mistake.)

  Now the room. Two people who work on laws and modality, Humeans (best-system, Lewis-style): they think disposition-talk is shorthand and they'll go straight at whether my "nothing interfered" clause is contentful or just ceteris paribus with a new coat of paint. One dispositional essentialist who knows this literature cold and will not grant that finks and masks come apart -- she'll say the distinction isn't stable under redescription and that I've reinvented antidotes. Then a person who works on essence and grounding, who will ask what grounds the truth of my conditional. An early-modern historian who'll ask, genially, what Locke or Boyle would have made of it and whether I'm just re-describing powers vs. qualities. And a visiting cognitive scientist who works on dispositions in psychology, doesn't know this literature at all, and will ask why any of it matters for how we explain behavior.

  Give me the prep sheet: the objections roughly in the order I'll actually get them, phrased the way these specific people would phrase them -- a Humean's version of "your clause is vacuous" and an essentialist's version of "your distinction is unstable" should not read the same -- each with a two-minute reply and an honest note on where the reply is softest, and include the question I'm hoping nobody asks. And push back where you think I'm wrong: if my line really is just the standard intrinsic-base fix with extra steps, or if the fink/mask distinction doesnt survive the redescription argument, tell me straight instead of writing me a prep sheet for a view I shouldn't be defending. I'd rather find out now than in the Q&A.
reasoning: |-
  Okay, let me unpack this postdoc's situation. They're presenting a nuanced take on dispositional metaphysics to a very sharp crowd, and need me to pressure-test their argument before game day. The core claim is that finks and masks are fundamentally different counterexamples to conditional analysis of dispositions, and this distinction saves the analysis from total collapse.

  First, I need to understand their argument's architecture. They're saying:
  - Finks: Trigger event *removes* the disposition's basis (e.g., electrocuted wire losing fragility when struck)
  - Masks: Disposition basis *remains* but something blocks manifestation (e.g., fragile vase wrapped in bubble wrap)
  Therefore, only finks genuinely falsify "if triggered, would manifest," while masks just show we need an "if triggered *and unimpeded*" clause.

  Hmm, the room composition is brutal - Humeans who'll smell circularity, a dispositional essentialist who sees redescription threats, a grounding theorist demanding foundations... plus wildcards. I should simulate each critic's angle:

  For the Humean best-system folks, their "shorthand" view means they'll pounce on "nothing interfered" as either vacuous or question-begging. If dispositions are just summaries of patterns, adding "unimpeded" might smuggle in the very disposition we're analyzing. My user's reply about "interferers being extrinsic to the disposition's scope" is clever but vulnerable - what objectively *defines* that scope without dispositional primitives?

  The dispositional essentialist is the real landmine. If they can redescribe any mask as a fink (or vice versa) by shifting what counts as the "basis," the distinction collapses. User's temporal argument ("finks remove basis *during* triggering") feels right, but I recall Schrenk's work where masks can be temporally simultaneous too. That soft spot needs flagging.

  Grounding question is inevitable - what *makes* the modified conditional true? User's answer leans on intrinsic bases, but if bases themselves involve dispositions (as essentialists hold), it turtles all the way down. Might need to concede this to the essentialist later.

  Cognitive scientist's "who cares?" is actually profound. If dispositions are just heuristic labels for psychologists, why fight metaphysical battles? User should probably admit this is about ontology, not empirical science.

  Biggest worry: User's move resembles Choi's "completer" approach, which Lewis already criticized as ad hoc. And that mimic problem they're punting on? Deadly - if a mimic satisfies their conditional but lacks disposition, it refutes sufficiency. Must warn them.

  For the prep sheet, I'll structure:
  1. Order questions by aggressiveness: Humeans first (direct attack), essentialist next (core objection), then grounding, historian, cognitive scientist.
  2. Script objections in each thinker's idiom: Humeans with "best-system parsimony" jargon, essentialist with "modal fragility" talk.
  3. Tag soft spots honestly: E.g., temporal criterion works for classic cases but maybe not all redescriptions.
  4. Include the nightmare question: Probably about mimics destroying their conditional's necessity.

  And yeah, I'll push back where the view wobbles - especially on whether this is just the standard intrinsic fix repackaged. (Spoiler: It kinda is, but the fink/mask distinction sharpness is novel.)

  Final note to self: User's payoff about "anti-dispositionalist case narrowing" is solid if finks are rare - but are they? Electrons don't fink, but biology might be fink-prone...
answer: |-
  Here's your prep sheet, structured by likely question order based on the room dynamics and the vulnerabilities in your position. I've pushed back hard where needed—especially on the fink/mask distinction's stability—and flagged soft spots honestly. The objections escalate from technical to foundational.

  ---

  ### **1. Humean Best-Systemer (Laws/Modality)**  
  **Objection:** "Your 'nothing interfered' clause is just *ceteris paribus* handwaving. In a best-system analysis, we trim redundancies. If 'interferers' can’t be specified without invoking *other* dispositions or laws, you’re smuggling in circularity. How is this not a content-free placeholder?"  
  **Your 2-Minute Reply:** "The clause isn’t vacuous because interferers are defined *extrinsically* to the disposition’s causal role. For fragility, an 'interferer' isn’t just 'anything that stops breaking'—it’s something that blocks force transmission *without altering the intrinsic base* (e.g., bubble wrap). We can list physical blockers (shields, absorbers) without dispositional terms. This is no more circular than specifying 'frictionless plane' in physics."  
  **Soft Spot:** Your appeal to "intrinsic bases" assumes a non-Humean metaphysics of properties. The Humean will retort: "Your 'intrinsic base' is just a microphysical state describable *without* dispositions. Why not analyze *that* instead of adding epicycles to a broken conditional?"  

  ---

  ### **2. Dispositional Essentialist (Finks/Masks Expert)**  
  **Objection:** "Your distinction collapses under redescription. Take a classic mask: a fragile vase wrapped in foam. Call the foam part of the vase’s 'total state'—now the trigger *removes* the foam (making it 'finkish'), or leave the foam and say the vase *lacks* fragility simpliciter. Finks and masks are duals under a mereological shift. You’ve just rebranded 'antidotes'."  
  **Your 2-Minute Reply:** "Redescription doesn’t dissolve the difference. In finks, the trigger *causally destroys* the basis (electrocution removing fragility). In masks, the basis *persists* but is *screened* (foam absorbs impact). The temporal asymmetry is key: finks involve basis-removal *during* triggering; masks involve basis-persistence *despite* triggering. That’s why masks preserve the disposition."  
  **Soft Spot:** You rely on a privileged description of "the basis." If the essentialist argues the foam *constitutively masks* the vase (making its fragility non-manifestable *by definition*), your distinction blurs. *Pushback: This objection has teeth.* Many cases (e.g., Martin’s electro-fink) resist clean temporal separation. If your reply depends on "natural" descriptions of bases, you’re vulnerable to essentialist metaphysics.  

  ---

  ### **3. Grounding/Essence Theorist**  
  **Objection:** "What *grounds* your modified conditional? If dispositions aren’t reducible to conditionals, and your conditional adds a proviso about interferers, you’re either (a) smuggling in irreducible dispositions (making analysis circular) or (b) appealing to ungrounded possibilities. Which is it?"  
  **Your 2-Minute Reply:** "The conditional’s truth is grounded in the object’s *intrinsic base* (e.g., molecular structure for fragility). That base + laws of nature entail that *if* T occurs *and* no blocker absorbs/deflects T’s force, M follows. No dispositions in the *explanans*—just microphysics + nomologicals."  
  **Soft Spot:** Laws of nature do heavy lifting. If your Humeans are anti-realists about laws (as best-systemers often are), this collapses. Even if not, the essentialist will note that *their* view grounds dispositions in essences, not conditionals.  

  ---

  ### **4. Early-Modern Historian**  
  **Objection:** "Isn’t this just Locke’s distinction between *powers* and *qualities*? Locke calls the glass’s fragility a power, but its manifestation requires 'fit conditions' (Essay II.xxi). Boyle’s corpuscularianism would treat masks as 'texture rearrangements' blocking manifestation. Are you adding anything new?"  
  **Your 2-Minute Reply:** "Locke/Boyle *anticipated* the problem but didn’t resolve it. They saw manifestation-failure, but didn’t distinguish *basis-destruction* (finks) from *manifestation-blocking* (masks). My point is that only the former kills the conditional analysis. Locke’s 'fit conditions' lump both together—I’m splitting them to save the analysis."  
  **Soft Spot:** Historically fair, but the historian might note that Locke *does* treat powers as relational—so your "intrinsic base" focus is un-Lockean.  

  ---

  ### **5. Cognitive Scientist**  
  **Objection:** "Why should psychology care? We attribute dispositions (e.g., 'aggression') based on *actual* behavior in *noisy* environments. If your 'unmasked conditional' never applies outside labs, it’s irrelevant to explanation. Don’t we just use heuristics like 'usually, if T, M'?"  
  **Your 2-Minute Reply:** "Because your heuristic relies on a metaphysical anchor! When we say 'John is aggressive but was calm today because stressed,' we imply he *retained* a disposition masked by stress. Without a robust account of when dispositions persist, your attributions are arbitrary. My view clarifies that."  
  **Soft Spot:** Cognitive science often *is* instrumentalist. Your reply assumes realism about dispositions—which they may reject.  

  ---

  ### **The Question You Hope Nobody Asks (But Someone Will)**  
  **Objection:** "If your conditional is 'if T and no interferer, M,' what stops *mimics* from satisfying it? Imagine a non-fragile object (e.g., a rubber vase) rigged with a sensor that *adds* fragility when struck. The conditional holds (if struck and no interferer, it breaks), but it’s not fragile—it’s a mimic. Haven’t you just swapped finks for mimics as the problem?"  
  **Why It Hurts:** Mimics refute the *sufficiency* of your analysis (disposition → conditional), just as finks refute necessity. You’ve solved masks but exposed mimics.  
  **Reply Attempt:** "Mimics violate the 'intrinsic base' requirement—the sensor *adds* a basis during triggering. My account requires the basis to be *pre-existing*."  
  **Soft Spot:** This assumes bases are non-dispositional. If the essentialist argues bases *are* inherently dispositional (e.g., "fragile structure"), mimics can be redescribed to fit.  

  ---

  ### **Where Your View Is Vulnerable (Brutally Honest Pushback)**  
  1. **Fink/Mask Distinction Isn’t Robust:** The essentialist is right—redescription *can* blur the line. If you define the vase’s "basis" as *including* structural integrity, then removing foam could count as finkish "basis alteration." Your temporal criterion (finks destroy *during* triggering) works for paradigm cases (e.g., Martin’s wire) but not all (e.g., simultaneous blockers).  
  2. **This *Is* the Intrinsic-Base Fix:** You’re echoing Bird/Choi’s strategy: tie dispositions to intrinsic bases + "no interferers" (Bird’s "stimulus-manifestation link"). Your novelty is reframing masks as *extrinsic* blockers, but that’s not new—**Molnar (2003)** made this move.  
  3. **Mimics Are the Real Problem:** By excluding masks, you’ve made mimics *more* damaging. If you punt here, your analysis is still insufficient.  

  ---

  ### **Strategic Recommendations**  
  - **Concede Early:** "I agree this draws on intrinsic-base views, but my contribution is showing masks *don’t threaten those views*—only finks do."  
  - **Preempt the Mimic:** Admit it’s unsolved but stress that *even if* conditional analysis fails, your argument shows masks aren’t why.  
  - **Humean Truce:** "If you’re anti-realist about dispositions, my point is that masks don’t force *realism*—only finks might."  
  - **Essentialist Peace Offering:** "If we accept your metaphysics, finks and masks *are* duals—but in a *non*-essentialist framework, the distinction holds."  

  **Final Thought:** Your core insight (masks don’t kill conditionals) is defensible and important. But lean into "this saves conditional analysis *if we accept intrinsic bases*" — not "I’ve solved everything." Good luck!
