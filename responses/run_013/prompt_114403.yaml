answer: |-
  Here’s a rigorously structured requirements list for a theory of procreation asymmetry, designed to filter candidate theories and test your agency-constraint hunch. Requirements are categorized, prioritized, and annotated for conflicts.

  ---

  ### **I. Core Cases to Resolve (Non-Negotiable)**
  1. **Permissible Omission (Happy Child)**: Must permit *not* creating a life that would be *net-happy* without moral failing.  
  2. **Impermissible Creation (Unhappy Child)**: Must forbid creating a life that would be *net-unhappy* (e.g., chronic agony).  
  3. **Non-Identity Problem**: Must correctly handle choices affecting *who* exists (e.g., conceiving later vs. earlier child with disability).  
  4. **Unavoidable Harm in a Worthwhile Life**: Must explain why creating a person with a net-good life containing *preventable suffering* (e.g., genetic pain condition) is:  
     - (a) Permissible *despite* the harm,  
     - (b) Not grounds for the created person’s *retrospective complaint* (even if non-existence avoided the harm).  
  5. **Existing Sufferer Constraint**: Must **not** imply that existing suffering people may be ignored or killed if their lives are net-negative (avoids justifying euthanasia/neglect).

  ### **II. Critical Distinctions to Preserve (Non-Negotiable)**
  6. **Creation vs. Sustenance**: Must distinguish creating new life from preserving existing life (e.g., no duty to create happy beings ≠ license to kill unhappy ones).  
  7. **Comparative Harm vs. Non-Comparative Badness**: Must separate:  
     - *Harm to a subject* (e.g., making an existing person worse off),  
     - *Non-comparative badness of creation* (e.g., bringing a suffering being into existence *even if no one is harmed*).  
  8. **Bad Life vs. Bad Birth**: Must differentiate a life being *not worth starting* (bad birth) from being *not worth continuing* (bad life).

  ### **III. Formal Constraints (Non-Negotiable)**
  9. **Reversal Test**: If changing condition X to Y is bad, changing Y to X cannot also be bad (e.g., creating a happy child isn’t bad, so *not* creating one can’t be bad).  
  10. **Time Symmetry (Epicurean Argument)**: Must treat prenatal and postmortem nonexistence symmetrically (i.e., no "harm" in never existing before birth → no "harm" in never existing after death).  
  11. **Non-Violability of Nonexistence**: Never creating a person cannot be a wrong *to that person* (nonexistent beings have no interests).

  ### **IV. Normative Guardrails (Non-Negotiable)**
  12. **Anti-Repugnant Conclusion**: Must **not** impose a duty to create vast numbers of *marginally happy* lives (e.g., 10^20 people with barely positive lives).  
  13. **Anti-Utilitarian Sacrifice**: Must **not** permit creating a *miserable life* as a means to benefit others (e.g., "savior sibling" born to suffer and donate organs).

  ### **V. Agency-Specific Tests (Testing Your Hunch)**
  14. **Agent-Neutral vs. Agent-Relative**: Must clarify whether duties are:  
     - *Agent-neutral* (e.g., "suffering is bad, period"),  
     - *Agent-relative* (e.g., "you must not *cause* suffering through creation").  
  15. **Omission/Commission Asymmetry**: Must explain why *creating* suffering is forbidden but *failing to create* happiness is permissible.

  ---

  ### **Conflict & Priority Analysis**
  | **Requirement** | **Status** | **Conflicts With** | **Exclusionary Power** |
  |----------------|-----------|-------------------|------------------------|
  | 2 (Impermissible Creation) | Non-negotiable | Weaker theories violating 12/13 | High (eliminates naive utilitarianism) |
  | 4 (Unavoidable Harm) | Non-negotiable | Theories that collapse 7 or deny 11 | Highest (filters impersonal/aggregative views) |
  | 10 (Time Symmetry) | Non-negotiable | Theories positing "duties to possible people" | Extreme (excludes prior-existence views) |
  | 12 (Anti-Repugnant) | Non-negotiable | Total utilitarianism | High (forces scalar thresholds) |
  | 7 (Harm vs. Badness) | Non-negotiable | Reductionist accounts (e.g., "harm is just badness") | Critical for agency theories |
  | **14–15 (Agency Focus)** | Test for your hunch | Impersonal axiologies | Determines if agency is forced |

  **Key Conflicts**:  
  - **4 + 7 + 10 + 11** jointly challenge impersonal negative utilitarianism (e.g., if avoiding suffering is the only imperative, why permit creating lives with *any* suffering?).  
  - **1 + 12** conflict with strong prioritarianism (if creating happiness is obligatory, what stops the Repugnant Conclusion?).  
  - **10 + 15** strain consequentialist accounts (time symmetry undermines "lost happiness" as a reason to procreate).

  **Most Exclusionary Requirement**: **#4 (Unavoidable Harm)**. It forces theories to reject both:  
  - The "person-affecting principle" (no one is *harmed* by creation),  
  - And impersonal "total badness" views (if suffering is bad *simpliciter*, why create avoidable suffering?).  
  *Surviving #4 typically requires accepting non-comparative moral reasons (e.g., "creating sufferers is intrinsically wrong").*

  ---

  ### **Does Your Agency Hunch Hold?**
  A theory treating asymmetry as **an agent-relative constraint** (e.g., "you must not *impose* existence on a sufferer") satisfies:  
  - ✅ **#2, #7, #13, #15** (distinguishes causing harm vs. withholding benefit).  
  - ✅ **#4, #11** (avows no complaint from the created; nonexistence isn’t harm).  
  - ✅ **#12** (no duty to create marginal lives).  
  - ⚠️ **#10** (time symmetry is neutral but requires care – not creating isn’t "harming" a possible person).  
  - ❓ **#1** (requires justifying why *not* creating happiness isn’t wrong – e.g., no victim of omission).  

  **Agency-relative theories struggle most with #3 (Non-Identity Problem)**: If you choose to create a disabled child (who wouldn’t otherwise exist) rather than a healthy one, is this "harming" them? If not, is it still objectionable? *This is where your hunch faces pressure.*  

  ---

  ### **The Viable Path**
  A theory meeting all constraints must:  
  - Ground the asymmetry in **non-comparative, agent-relative duties** (e.g., "imposing existence with suffering is intrinsically wrong, but declining to confer existence-blessing isn’t wrong").  
  - Accept that **preventing suffering has priority over promoting happiness** in creation contexts.  
  - Deny that **possible people have moral claims** (satisfying #10 and #11).  

  Such a theory *can* guide embryo selection: Select against embryos with net-unhappy futures (#2), but no obligation to select *for* happiness (#1, #12). Suffering in a worthwhile life (#4) is permissible because existence is a net gift, and the alternative (nonexistence) isn’t better *for the child*.  

  **Final Verdict**: Your hunch **isn’t forced** but is the *most promising framework* – it uniquely satisfies the exclusionary requirements (#4, #7, #11) while dodging the Repugnant Conclusion. The critical test is resolving Non-Identity (#3) without collapsing creation/sustenance (#6). If your theory can condemn creating a suffering child who "wouldn’t exist otherwise" as a *wrong-making property of the act itself* (not harm to the child), it survives.
