prompt: |-
  I write a fortnightly column on science and ideas for a British weekly, and I am midway through a piece on the therapy/enhancement distinction — specifically on whether the line can be drawn in a way that a public funding body could actually administer. Over lunch last week, a philosopher friend floated a criterion I had not come across before, which he called the trajectory test: an intervention counts as therapy when it restores a person to the trajectory of functioning they were already on (arresting a decline counts as restoring), and as enhancement when it bends that trajectory upwards, or establishes one where none existed beforehand. I would like the column to test his proposal against the more familiar lines of division, but I keep losing the thread of which criterion is doing the real work.

  So I would like you to rank five candidate criteria by how well each would serve a health service that must decide, case by case, which interventions count as clinical treatment (and are therefore eligible for public funding) and which count as enhancement (and are not), judging each on two counts. The five are: the statistical line, on which an intervention is therapeutic to the extent that it restores functioning to the species-typical range; the medical line, on which it is therapeutic if it treats a condition that medicine classifies as a disease or disorder; the opportunity line, on which it is therapeutic if it is needed to preserve a fair share of opportunity relative to others; the welfare line, on which the distinction tracks whether the intervention lifts a person's well-being from below some threshold to above it; and my friend's trajectory test. The two counts are, first, whether the criterion delivers the verdicts I would want on the awkward cases — prophylaxis (a vaccine, or a statin for someone at low risk) counting as treatment, stimulants for a diagnosed attention disorder counting as treatment while the same drugs taken for exam performance do not, growth hormone for a child of unremarkable height not counting, and a hypothetical mood-lifting wearable that nudges a healthy adult's affect upwards without any underlying complaint not counting — and, second, whether an administrator could apply it consistently without either drowning in borderline cases or leaving the line open to capture by whoever shouts loudest. Give me an ordered ranking from best to worst, with a short justification for each placement, a note on where the trajectory test lands and whether any of the five should simply be struck out, and please write your answer in British English.
reasoning: |-
  Okay, the user is a science columnist working on the therapy vs. enhancement distinction for a British publication. They're specifically focused on practical applicability for public funding bodies. Their philosopher friend proposed a "trajectory test" (restoring vs. bending upward one's functional trajectory), and they want to evaluate it against four established criteria. 

  Hmm, the core challenge here is balancing ethical intuition with bureaucratic feasibility. The user mentions "losing the thread" - probably because these distinctions often collapse under edge cases. Their "awkward cases" list is telling: they're clearly wrestling with interventions that sit at ethical boundaries (prophylaxis, cognitive enhancers). 

  Let me unpack their evaluation framework first. The two tests are: 
  1) Does it yield intuitive verdicts on their five test cases? 
  2) Can it be administered consistently? 

  *Scratching head* The medical line feels strongest initially - it's how most health systems operate - but vaccines for healthy people? That's clearly preventive medicine but not treating existing disease. Similarly, statins for low-risk patients... technically bending trajectories rather than curing. Might fail their prophylaxis test. 

  The trajectory test is elegant philosophically but... how would an NHS administrator measure someone's "functional trajectory"? Sounds like a minefield of subjective judgments. The height example is sharp though - it neatly excludes "tallification" of average children. 

  *Pausing* The opportunity criterion seems promising socially but "fair share of opportunity" is so nebulous. Could lead to endless arguments about what constitutes unfair disadvantage. Stimulants for ADHD would pass, but exam drugs? Depends on whether we frame exams as "opportunity gatekeepers" - slippery slope territory. 

  Welfare threshold... *sighs* Defining wellbeing thresholds is the stuff of policy nightmares. And statistical typicality? Too crude - being statistically atypical doesn't necessarily mean impaired (think elite athletes). 

  Right, ranking time. Medical line must come top despite prophylaxis flaws because it's the only one with existing clinical infrastructure. Trajectory test gets points for philosophical rigor but fails administrability. Opportunity criterion is too vulnerable to lobbying. Welfare is unworkable. Statistical should be struck out - it's ethically dangerous and practically useless. 

  *Double-checking* User's British - must remember NHS context. Phrases like "drowning in borderline cases" and "capture by whoever shouts loudest" suggest they've seen how resource allocation debates play out politically. Their column will need to acknowledge that no criterion is perfect, but some are less imperfect than others...
answer: |-
  Here’s a ranked evaluation of the five criteria for distinguishing therapy from enhancement in public funding decisions, based on your two tests (handling awkward cases consistently and administrative practicality). Judgements are grounded in real-world NHS-style constraints.

  **Ranking (Best to Worst):**

  1.  **Medical Line (Treats a medically classified disease/disorder)**
      *   **Justification:** Best administrative practicality. Relies on established, codified medical classifications (ICD/DSM), reducing subjectivity. Clinicians diagnose based on evidence; administrators follow guidelines. Handles prophylaxis well (vaccines prevent *diseases*, statins treat *dyslipidaemia*/*high CVD risk* – both recognised conditions). Correctly classifies ADHD stimulants as treatment (disorder) vs. exam use (not). Correctly excludes growth hormone for unremarkable height (no disorder) and mood wearables for healthy adults (no disorder). Borderline cases exist (e.g., new syndromes), but the system has mechanisms (NICE, specialist panels) to adjudicate based on evolving evidence, resisting pure lobbying.
      *   **Rank Reason:** Strongest combination of consistent, defensible verdicts and operational feasibility.

  2.  **Trajectory Test (Restores existing trajectory vs. bends it upward)**
      *   **Justification:** Philosophically compelling and handles your awkward cases well. Prophylaxis (vaccines/statin) *arrests decline*, thus therapy. ADHD stimulants *restore* attention trajectory impaired by disorder; exam use *bends upward*. Growth hormone for average child *bends upward*; mood wearable *establishes/bends upward*. Where it struggles is **administrative practicality**. Defining an individual's "trajectory" reliably is highly subjective, especially for congenital conditions or slow declines. Requires extensive historical/predictive data vulnerable to interpretation and dispute ("Was this child *really* on a trajectory to be 6'2"?"). Borderline cases (e.g., mild age-related cognitive decline) could drown administrators in complex assessments. Vulnerable to arguments framing desires as "restorations".
      *   **Rank Reason:** Excellent on case verdicts, weakest of the viable options on administrability.

  3.  **Opportunity Line (Preserves fair share of opportunity)**
      *   **Justification:** Ethically attractive, focusing on societal fairness. Correctly classifies ADHD treatment (restores opportunity) and excludes exam enhancers (seeks *unfair advantage* over peers) and mood wearables for the well (unnecessary for fair opportunity). **Fails significantly on prophylaxis** – preventing disease preserves opportunity, but funding *all* opportunity-preserving interventions is impossibly broad (e.g., elite education?). Defining a "fair share" is deeply contested and context-dependent (what's the baseline?). Administratively nightmarish – requires constant societal negotiation and is highly vulnerable to lobbying by groups claiming disadvantage. Borderline cases (e.g., moderate short stature affecting confidence/sports) would be endless.
      *   **Rank Reason:** Good on some cases, but fatally flawed on prophylaxis scope and administrability due to inherent vagueness and political vulnerability.

  4.  **Welfare Line (Lifts well-being from below to above a threshold)**
      *   **Justification:** Aims for a humane outcome. Might cover severe depression treatment (therapy) and arguably severe growth disorders. **Fails almost all awkward cases:** Prophylaxis (vaccines given to healthy people *above* threshold). ADHD treatment (often lifts from below threshold? But exam use might too!). Growth hormone for average child (likely *above* threshold already). Mood wearable (nudges *above* threshold). Defining a universal, measurable well-being threshold is notoriously difficult and culturally sensitive. Administratively, assessing individual well-being levels reliably and consistently for funding decisions is infeasible. Wide open to claims that any desire improves well-being.
      *   **Rank Reason:** Poor fit for the specific cases and utterly unworkable administratively due to subjectivity and measurement problems.

  5.  **Statistical Line (Restores to species-typical range)**
      *   **Justification:** **Strike this one out.** It's conceptually flawed and administratively useless for funding. Correctly classifies severe cases (e.g., profound deafness). **Fails catastrophically elsewhere:** Prophylaxis (vaccines given to people *within* typical range). ADHD (many diagnosed individuals fall *within* statistical norms on some measures, impairment is key). Growth hormone for average child (already typical). More damningly, it implies someone *below* typical deserves restoration, but someone *at* typical cannot receive help even if suffering (e.g., chronic pain at "typical" levels). It ignores functional impact and need. Defining "typical range" is arbitrary and ethically dubious (e.g., IQ, height). Administratively simple only in extreme cases, but produces deeply counterintuitive and unfair results elsewhere. Highly vulnerable to misuse.
      *   **Rank Reason:** Fundamentally misaligned with the purpose of healthcare funding. Produces unethical verdicts and should be rejected.

  **Summary & Trajectory Test Placement:**

  *   **Best Overall:** **Medical Line** – Wins on robust administrability and mostly correct verdicts, leveraging existing systems.
  *   **Trajectory Test:** Placed **2nd**. It shines in theoretical consistency with your desired case outcomes but falters due to the impracticality of reliably defining and measuring individual "trajectories" in a fair, consistent, and scalable way for public administration. It's the best *philosophical* contender but a weaker *policy* tool.
  *   **Strike Out:** **Statistical Line** – Ethically and practically indefensible for this purpose. **Welfare Line** is also functionally unworkable.
  *   **Opportunity Line:** Tempting ethics but unmanageable scope and vulnerability to lobbying relegate it to 3rd.

  For your column, the tension is clear: the administratively strongest criterion (Medical) has conceptual wrinkles (especially around prophylaxis definitions), while the philosophically neatest (Trajectory) struggles with real-world application. A health service likely must prioritise the former for feasibility, perhaps incorporating elements of trajectory or opportunity thinking *within* the medical framework (e.g., how "disorder" is defined).
