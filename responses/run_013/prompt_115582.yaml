prompt: |-
  ok so this is for my philosophy club and its kind of a mess of a question but here goes.

  I play this game where you can buy skins and pets and stuff with real money, and people trade them with each other for real money too, theres a whole grey market. The company that runs it will ban you if you scam someone out of a skin, theyll ban you for selling your account, they basically act like the items are real things that belong to people. But if you actually read the terms of service it says you dont own anything, its all licensed, and they can delete your account or shut the whole game down tomorrow and you get nothing back. I read that some courts have treated stealing in game items as actual theft, and other courts have said thats impossible because its not property, its just data sitting on somebody elses server. And the same company bans people for harassing other players in chat, but the standard defense when someone complains is that its just a game, except then something happens like someone getting grabbed in VR and everybody suddenly agrees thats real and not just a game.

  My friend has this theory that theres two kinds of real, the rock kind and the law kind, and virtual stuff is the law kind, like money, which isnt real in the rock sense but nobody says money is fake. I dont know if that helps or just moves the problem somewhere else.

  What I want to know is what the whole bundle of practices actually assumes. Does it only make sense if you already think virtual objects have some kind of real value and virtual harms are real harms, so that its a seperate kind of reality and not a lesser one? Or could the exact same rules be run by somebody who thinks none of it is real and its all make believe with a price tag? Which parts actually need a view about reality and which parts are just practical, like maybe you ban scammers because otherwise nobody plays, not because you think the skin is property. The property thing bugs me the most, cause it looks like the same company is claiming both that the items are yours and that theyre not, depending on whos asking. Is that a real contradiction or can one view cover both? And if they shut the servers down, is that like knocking down a building or like closing a book? Then tell me what would actually have to change, in the rules and in the law, if we went fully one way or the other, either its all fiction like a character in a novel or its real, just made of bits, deal with it.

  Also please no headings or bullet points or bold text or tables, just paragraphs like a long email, I have to read it on my phone. And sorry about the spelling.
