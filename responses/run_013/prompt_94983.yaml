prompt: |-
  hey — im in a phil of law course and we just did nuremberg and the tokyo trial and im supposed to write a thing on it but i keep going in circles, so im asking for help thinking it through rather than a reading list or anything.

  heres the puzzle thats bugging me. the nuremberg charter basically invented the crime of aggressive war / crimes against peace and then tried the defendants for acts theyd done before the charter existed, which is the textbook ex post facto problem and the defense lawyers hammered on it. but the tribunal wouldnt let them say well the allies did the same stuff (tu quoque), it rejected superior orders as a defense while still letting it count as mitigation, and it declared the SS and the gestapo criminal organizations so that mere membership was itself a crime — all in a trial whose stated point was individual responsibility for what you personally chose to do. and at tokyo they never went near the emperor.

  so what does this whole package presuppose about what law is and where it comes from? if the only thing grounding those convictions is a charter the victors wrote for themselves, that smells like law is just whatever the sovereign commands, which cant by itself answer the ex post facto objection — for that you seem to need some higher law that was already binding regardless of the charter, i.e. an unjust-or-unfair-law-isnt-really-law kind of view. can the institution actually hold both at once, or is one of them doing all the real work while the other is just decoration? which bits of the practice strictly presuppose a view, and which would survive just as well under several rival theories?

  and separately, what theory of responsibility does criminal-organization liability presuppose, and is it consistent with the tribunals insisting guilt is individual and that following orders is no excuse? does refusing the tu quoque defense commit them to consistency as a condition of legality, or is that just a practical dodge?

  if you had to rebuild something like this today so the parts actually fit together, what would have to give — the retroactivity, the collective guilt, the immunity for the winners and their friends, or something else? and which of those are really forced by the idea of a war-crimes tribunal at all vs just accidents of who happened to win?
