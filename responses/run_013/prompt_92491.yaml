  First, I need to figure out the core requirements. The user wants to know what any explanation must deliver. Let me list each element they provided and translate them into requirements. For the fit itself, it's about pre-existing math matching physical phenomena. So the requirement would cover pre-emptive suitability and non-ad-hoc nature. 

