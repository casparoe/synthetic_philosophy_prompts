answer: |-
  Here’s a warm, structured toast that honors your friend’s philosophy while keeping it accessible, heartfelt, and short—with the tetralemma doing the heavy lifting without being a lecture. The joke is gentle and inclusive, and the ending is genuinely toast-worthy.

  ---

  **(Clink glass gently. Smile warmly.)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], and I’ve had the honor of being [Bride]’s best friend since we discovered that arguing about whether cereal is soup counts as deep life preparation. *(Pause for light laughter.)*  

  Now, [Bride] studies the deep nature of reality—specifically, why nothing has a fixed, independent essence. [Groom], you study the deep nature of the ocean—specifically, why everything in it is interdependent, fascinating, and occasionally covered in slime. *(Grins at Groom; room chuckles.)*  

  When I tried to write this toast, I realized every nice thing I wanted to say about them felt… philosophically suspicious to [Bride]. So I asked myself: *How would Nāgārjuna toast a marriage?* And it hit me: **with four corners**. Not as a puzzle, but as a way to see the beauty in what they’re doing today.  

  **First corner: They are One.**  
  Look at them. They move together like currents in the same tide. They laugh at the same terrible jokes. They build a world between them that feels seamless, whole. It’s easy to say, *‘You two are perfect for each other—a single, complete thing.’*  
  *(Gentle pause, playful shrug.)*  
  …But [Bride] would elbow me and whisper: *‘Nothing is truly One. Not even this cake if we zoom in close enough.’*  

  **Second corner: They are Two.**  
  Of course, they’re also gloriously separate. [Groom] loves explaining octopus camouflage at dinner; [Bride] loves debating the metaphysics of the octopus’s ‘selfhood’ right back. He grounds her; she surprises him. They’re two brilliant, distinct people who *chose* each other.  
  *(Wry smile.)*  
  …But if I stop there, [Bride] clears her throat: *‘*Chose*? Based on what inherent self? Nice try.’*  

  **Third corner: They are Both.**  
  Alright, fine. Maybe they’re *both* one and two! A paradox! They’re individuals *and* a unit—like a coral reef: separate polyps building something breathtaking together.  
  *(Leans in conspiratorially.)*  
  …But I can see [Bride]’s advisor in the back row shaking their head. *‘Both? That’s just two corners mashed together. Lazy.’*  

  **Fourth corner: They are Neither.**  
  So… maybe they’re *neither* one thing nor two? No fixed essence. Just… this. The way they listen. The way they annoy each other lovingly. The way they adapt, change, and grow—together but not fused, separate but not apart.  
  *(Softly, sincerely.)*  
  And here’s the magic [Bride] taught me: **That’s why it matters**. Love isn’t a statue. It’s a dance. A marine biologist and a philosopher don’t ‘complete’ each other like puzzle pieces with fixed shapes. They *create* each other, moment by moment, in how they show up.  

  Which means their marriage isn’t precious *despite* having no fixed nature—it’s precious *because* of it. It’s free to evolve, to surprise, to deepen. It’s real *because* it’s alive, not carved in stone.  

  So… *(raises glass)* here’s to the empty, ever-changing, not-one-not-two-but-somehow-perfectly-*this* dance of [Bride] and [Groom]. May your love never stop becoming.  

  **Cheers!"**  

  ---

  ### Why this works:  
  1. **Structure as Substance**: The four corners frame the emotional arc (unity → individuality → paradox → release), mirroring Madhyamaka without jargon. Each "undercut" keeps it light and avoids essentialism.  
  2. **Accessible Depth**: Coral reef = śūnyatā for non-philosophers. "No fixed essence = freedom to grow" is the warm, conventional takeaway.  
  3. **The Joke**: Teasing both sides—philosophers ("*Lazy*") and family ("*covered in slime*")—without excluding anyone.  
  4. **No Self-Refutation Trap**: By focusing on *conventional* reality ("the dance," "how they show up"), we sidestep metaphysical debates. The "neither" corner resolves into conventional truth.  
  5. **The Toast Line**: "Never stop becoming" ties emptiness to hope, not nihilism. Raises a glass to impermanence as a gift.  

  **Delivery Tip**: Smile during the "undercuts"—make it feel like an inside joke with the room, not a critique. Pause after "neither" to let warmth sink in before the finale.  

  This holds the paradox: celebrating something *because* it’s empty, not in spite of it. And yes—it’s exactly what she’d want.
