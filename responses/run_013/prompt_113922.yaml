prompt: |-
  I have recently changed my mind about the family of cases usually gathered under Pascal's mugging, and I would like the position I now hold stress-tested rather than explained back to me.

  Some context for why this has stopped being academic. A few months ago I was one of three people deciding whether a small organization I belong to should commit a substantial share of its reserves to a proposal whose entire case rested on a very small chance of a very large benefit. I reasoned in the way I am about to describe, we declined, and I have been uneasy ever since — not because I think we decided wrongly, but because I cannot say what would have shown the reasoning to be wrong.

  The position. I take expected-utility maximization to be the correct criterion for ordinary decisions, and I do not want to give it up. What I now deny is that it applies uniformly across all probabilities. Below some scale — I cannot say exactly where, and I suspect the exact location does not matter — I hold that a branch's contribution to expected value should be treated as nil, however the payoff is described, so that the decision is made as though the branch were absent; above that scale, ordinary expected-utility reasoning governs. I also hold that this is not merely a pragmatic concession to our computational limits. My thought is that a credence of the order of one in a very large number, held toward a specific and elaborate scenario, is not the kind of attitude that can be multiplied by a payoff at all: it is bookkeeping that we mistake for belief, and the mistake stays invisible until the payoff is astronomical. I call this the negligibility floor.

  I want to know how exposed this is. Please do not give me a survey of the literature or a catalogue of famous replies; I want the position's exposure map.

  1. What would count against it — which arguments, intuitions, formal results, or cases — and of those, which should be decisive and which merely awkward? Rank them by how much they should move me, and say plainly where you think the position actually breaks rather than merely creaks.

  2. Which of these would a defender of my position concede as genuine costs, and which would they dismiss — and are the dismissals legitimate? I am more interested in what the view has to give up than in what its critics say about it.

  3. What does the position predict or forbid that its rivals do not? The rivals I have in mind are bounding the utility function, and abandoning maximization for something like a maximin or precautionary rule. If my position and theirs agree on every case I can actually describe, I would rather hear that than a fabricated contrast.

  4. Is there a version of the position that risks nothing at all — qualified until no case could count against it? If so, is that a defect of the position, or a consequence of its being a claim about how to deliberate rather than about what is worth wanting?

  5. Two pressures I cannot classify, and which I would especially like you to sort into fatal, awkward, or harmless. The first is that the floor makes my decisions discontinuous in my credences: a credence of one in an enormous number and a credence of one in a merely very large number are treated alike until a boundary is crossed, and I cannot say why the boundary sits where it does — nor, worse, why a mugger who simply raises the probability just above it does not reappear with his threat intact, which would make my position a cousin of the bounded-utility view I rejected as arbitrary. The second is that whether a branch falls below the floor seems to depend on how I carve up the possibilities rather than on the world or on my credences. Here is the case that made me notice it: suppose there are a trillion independent situations, each carrying a one-in-a-trillion chance of an enormous harm. The chance that at least one occurs is near certainty, and by my own lights that near-certain harm should weigh heavily; but each situation, taken on its own, sits below the floor, and my position tells me to ignore each. I can save the view by applying the floor to the total chance of an outcome rather than to the chance contributed by each branch — but then the advice I give depends on how finely the world is described, which is not something the world or my credences settle. I suspect these two pressures are one problem wearing two faces, but I cannot see the face they share.

  If it turns out that the position is well insulated and that this is a defect, tell me so; I would rather have that than reassurance.
reasoning: |-
  Okay, the user presents a complex philosophical position regarding Pascal's Mugging and expected utility theory. They've developed what they call a "negligibility floor" - essentially arguing that below certain probability thresholds, outcomes should be treated as having zero expected value regardless of potential payoff. 

  What's interesting here is how deeply personal this is - they've already applied this reasoning in a real organizational decision involving substantial resources, and now they're experiencing post-decision unease. Their request is unusually specific: they don't want explanations or literature reviews, but rather want their position rigorously stress-tested. 

  The core tension I see is between their commitment to expected utility theory and their intuition that some probabilities are "not the kind of attitude that can be multiplied by a payoff at all." This seems psychologically astute - they're recognizing that extremely low probabilities of specific scenarios feel qualitatively different from higher probabilities. 

  Their five questions reveal sophisticated self-awareness about potential weaknesses. The discontinuity issue (Q5) strikes me as particularly thorny - if the floor isn't sharp, the mugger can just adjust probabilities slightly to reappear. The "trillion independent situations" case is even more damaging as it demonstrates how their position might lead to ignoring near-certain catastrophic outcomes. 

  I notice they're explicitly not looking for reassurance, which is refreshing. They want to know where their position breaks, not where it holds. The organizational context adds weight - this isn't academic for them. Their unease suggests they might already sense the trillion-situations problem undermines their view more than they've admitted to themselves. 

  What makes this challenging is that their position sits in an awkward middle ground: more principled than arbitrary utility bounds but less clean than full expected utility. The fact they can't specify where the floor should be isn't necessarily fatal (many concepts have fuzzy boundaries), but the framing dependence issue might be. 

  I'm struck by how thoroughly they've anticipated objections. When someone this thoughtful expresses unease, it often means they've spotted a problem they can't resolve. My response should honor that intellectual honesty by being equally uncompromising in pointing out where their view creaks versus where it actually breaks.
answer: |-
  Below is a stress-test of your "negligibility floor" position, structured to address your explicit requests. I focus on exposing vulnerabilities, ranking challenges by severity, and identifying where the position breaks rather than creaks. The goal is to map the terrain of defeat conditions, not to reassure.

  ---

  ### **1. What Counts Against It? Ranked by Severity**
  **(Most Damaging → Least Damaging)**

  #### **Fatal: The Trillion Independent Situations Problem**  
  - **The Case:** A trillion independent events, each with probability \(10^{-12}\) of causing catastrophe. Individually, each falls below the negligibility floor (ignored). Collectively, the probability of *at least one catastrophe* is \(1 - (1 - 10^{-12})^{10^{12}} \approx 63\%\).  
  - **Why Fatal?**  
    - Your position *requires* ignoring each threat (below floor) but *demands* acting on the near-certain aggregate harm.  
    - **Contradiction:** If you apply the floor to *branches* (per your proposal), you ignore all threats and face near-certain ruin. If you apply it to *outcomes* (your suggested fix), decisions change based on description granularity (e.g., lumping events as "one systemic risk" vs. "trillion small risks").  
    - **Breaks the position:** It proves the floor cannot be both branch-level *and* outcome-level without arbitrariness. Outcome-dependence makes rationality descriptive-relativistic.  

  #### **Critical: Discontinuity + Mugger Resurrection**  
  - **The Challenge:** A probability of \(10^{-100}\) is ignored; \(10^{-99}\) might be above the floor. A mugger can adjust their threat from "destroy \(10^{200}\) lives" to "destroy \(10^{190}\) lives" with probability \(10^{-99}\)—resurrecting Pascal's Mugging.  
  - **Why Critical?**  
    - The mugger adapts *without changing the structure of the problem*. Your floor only shifts the threshold for astronomical payoffs.  
    - **Breaks the position:** It fails to resolve Pascal's Mugging; it merely relocates it. This collapses into a variant of bounded utility (which you reject as arbitrary), as the floor acts as a de facto bound on \(p \times U\).  

  #### **Severe: Framing Dependence**  
  - **The Case:** The same physical outcome (e.g., a particle decay triggering a disaster) can be described as:  
    - *One branch:* "Quantum event X occurs (P = \(10^{-30}\))".  
    - *Many branches:* "Each of \(10^{10}\) atoms decays (P = \(10^{-40}\) each)".  
  - **Why Severe?**  
    - Under branch-level flooring, the first description demands action; the second permits ignorance. Yet the physical risk is identical.  
    - **Breaks the position:** Rationality becomes language-dependent. No credence or fact about the world resolves this.  

  #### **Awkward: No Guidance for Setting the Floor**  
  - **The Problem:** You cannot specify where the floor is (e.g., \(10^{-20}\)? \(10^{-50}\)?). This vagueness:  
    - Invites arbitrariness in decisions.  
    - Undermines the claim that this is "not merely pragmatic" (if it were, we could tie it to computational constraints).  
  - **Why Awkward?**  
    - It creaks but doesn’t break. One could retreat to "the floor is context-dependent" or "fuzzy"—but this concedes the position is less principled than EU maximization.  

  #### **Mild: Intuition Against "Belief" Thresholds**  
  - **The Case:** For any negligibility floor, we can imagine a scenario where:  
    - \(p\) is just above the floor, payoff is astronomical → Action demanded.  
    - \(p\) is just below, payoff is larger → Inaction demanded.  
  - **Why Mild?**  
    - Humans accept thresholds elsewhere (e.g., ignoring probabilities below measurement error). This is more a psychological quirk than a logical flaw.  

  ---

  ### **2. What Must the Position Concede?**  
  A defender must concede:  
  - **Fatal:** The trillion-situations problem forces a choice:  
    - **Concede branch-level flooring is incoherent** (adopt outcome-level flooring), but then accept framing dependence as a *feature*.  
    - **Or abandon the position.**  
  - **Critical:** The mugger *can* resurrect threats by adjusting probabilities/payoffs near the floor. This is a **genuine cost**—your solution is locally effective but globally unstable.  
  - **Severe:** Framing dependence cannot be eliminated. A defender must dismiss this only by embracing anti-realism about decision descriptions (e.g., "all rational agents must use canonical descriptions"). **This dismissal is illegitimate**—no theory-neutral "canonical description" exists.  
  - **Awkward:** The floor's location is arbitrary. A defender might dismiss this by arguing exact thresholds need not be precise (e.g., "tall" has no exact height cutoff). **This is legitimate** but weakens the position’s objectivity.  

  ---

  ### **3. Contrasts with Rivals**  
  Your position **uniquely predicts/forbids**:  
  | **Case**                          | **Your Position**                     | **Bounded Utility**         | **Maximin/Precaution**      |  
  |-----------------------------------|---------------------------------------|-----------------------------|-----------------------------|  
  | Mugging with \(p=10^{-30}\), \(U=10^{100}\) | **Ignore** (below floor)          | Act (if \(10^{100}\) < bound) | Ignore (worst-case not bad) |  
  | Trillion small risks (individually) | **Ignore each**                   | Act (if bound high)          | **Act** (precaution)        |  
  | Identical risk, coarse vs. fine description | **Different decisions**         | Same decision                | Same decision               |  
  | Mugging at floor threshold \(p\)   | **Act if \(p\) barely above floor** | Act (if payoff < bound)      | Ignore                      |  

  - **Key divergence:** Only your position is *description-sensitive* and *ignores aggregate certainty* in the trillion-risks case.  
  - **Agreement with rivals?** No. Bounded utility avoids framing effects; maximin avoids probability-driven mugging. Your view is distinct and testably different.  

  ---

  ### **4. Risk-Free Version?**  
  - **A "qualified" version exists but is vacuous:**  
    - *"Apply a negligibility floor when, after careful reflection, it seems appropriate."*  
  - **Why this is defective:** It risks nothing because it says nothing. It collapses into subjective pragmatism, abandoning your core claim (that flooring reflects a truth about belief vs. bookkeeping).  
  - **Root issue:** Your position is a *meta-decision norm* ("treat these as non-beliefs"). Unlike claims about utility, it cannot be empirically falsified—but it *can* be shown to produce incoherent decisions (as in §1).  

  ---

  ### **5. Classifying the Two Pressures**  
  - **Discontinuity + Mugger Resurrection:**  
    - **Verdict: Critical (potentially fatal with adversarial agents).**  
    - Why: It makes you vulnerable to muggers who know your threshold. This is not just awkward—it resurrects the problem you aimed to solve.  
    - Shared face with bounded utility? Yes. Both cap the product \(p \times U\), but your cap is probabilistic, not axiological. This is equally arbitrary.  

  - **Framing Dependence (trillion-risks case):**  
    - **Verdict: Fatal.**  
    - Why: It forces a choice between ignoring near-certain doom (branch-level) or making rationality description-relative (outcome-level). The former is catastrophic; the latter undermines objective decision theory.  
    - **The shared face:** Both pressures stem from the same flaw—the floor operates on *representations* of uncertainty (branches/descriptions), not uncertainty itself.  

  ---

  ### **Conclusion: The Exposure Map**  
  **Your position breaks at:**  
  1. **Aggregation failures** (trillion-risks),  
  2. **Framing dependence**,  
  3. **Mugger adaptability at the threshold**.  

  It is **not well-insulated**—these are structural flaws. The fatal move is applying the floor to *branches* while acknowledging *outcome probabilities*. If you retreat to outcome-level flooring, you sacrifice objectivity; if you stay with branch-level, you ignore aggregate certainty.  

  **What should move you most:** The trillion-situations case. If your intuition says "the near-certain harm must be prevented," but your position forbids acting on its components, the position cannot stand without contradiction. This is not a minor cost—it’s a refutation of branch-level flooring as stated.  

  **Recommendation:**  
  - To retain a negligibility intuition, adopt outcome-level flooring and embrace framing dependence (e.g., "decide under coarse-grained descriptions").  
  - Or, bound utility but admit it’s arbitrary.  
  - Or, accept that EU maximization *must* handle astronomies—and live with mugging as the price of coherence.  

  This is the exposure. The position is bold, but the cracks run deep.
