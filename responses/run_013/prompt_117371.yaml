prompt: |-
  You are a philosopher working in the epistemology of testimony and social epistemology, with a firm grip on the reductionism/anti-reductionism debate and the positions that have grown out of it (assurance and second-personal views, default-entitlement views, transmission-of-justification views, and the newer literature on group and machine testimony). I want you to reconstruct the principle behind a set of verdicts of mine. Before you commit to an answer, brainstorm several candidate principles, note what each buys and costs, and only then argue for your recommendation. Do not simply survey the literature; I want your best construction and your honest assessment of whether my verdicts can be made consistent at all.

  Background: I have no theory of when it is epistemically all right to take someone's word for something. I have gut verdicts, and I keep suspecting they do not hang together. Here they are.

  1. A stranger on the street tells me the museum is two blocks up and then left. I believe her and go. Fine — I need no corroboration.
  2. A car salesman tells me this car has never been in an accident. Not fine to just believe; I should check.
  3. A friend who is shrewd about people but knows nothing about medicine tells me a supplement cured her cousin's migraines and that I should take it. Not fine to believe.
  4. The same friend tells me which of two nearby restaurants is better. Fine to believe.
  5. One credentialed nutrition scientist says a diet works; another, equally credentialed, says it does not. Not fine to believe either on their say-so alone.
  6. An AI chatbot tells me the population of a city. I should not believe it without checking, even though it is usually right — there is nobody there.
  7. A well-sourced encyclopedia article, produced by many anonymous editors, tells me that same city's population. Fine to believe; I trust it more than the chatbot.
  8. My thermometer reads 101 degrees Fahrenheit. Fine to believe I have a fever.
  9. A friend tells me that a friend of hers, whom I have never met, saw that the museum was closed. Fine to believe, though a bit weaker than hearing it from someone who saw it herself.
  10. A stranger tells me something against his own interest. I believe him.
  11. Someone describes her own pain. I believe her fully.
  12. An anonymous online review of a product. Not fine to believe.
  13. A published scientific consensus that I could not evaluate myself. Fine to believe.
  14. I catch myself inclined to doubt a stranger's account of her own neighborhood because of how she talks and dresses. I think that inclination is unjustified and that I should believe her.

  My hunch — which I do not trust — is that everything turns on whether the speaker is answerable to me, whether there is someone who can be held to the claim. But the thermometer and the encyclopedia seem to break that, and so does the fact that I trust a stranger about directions but not about medicine. There is also one case I keep going back and forth on: a doctor tells me that an AI flagged something on my scan and that she has checked the finding herself. I cannot tell whether I am believing the doctor, the machine, or both, or whether that distinction even matters.

  What I want from you:

  - A principle, or a small set of rival principles, stated precisely. If you state it as a default-with-defeaters structure, say exactly what the default is and enumerate the defeater types; if you state it as necessary and sufficient conditions, give the conditions. Say clearly which epistemic notion you are using (permissibility, warrant, justification, entitlement) and why that choice matters here.
  - For each clause of your principle, name the case above that forces it, so I can see the principle earning its parts.
  - Your verdicts on cases I have not listed: a stranger's claim that a bridge is safe to cross; a chain in which my friend's friend heard it from an AI assistant; a machine translation of a witness's testimony; a claim that happens to fit what I already believed; and a speaker who is generally reliable but has been wrong about this exact topic before.
  - An explicit statement of which of my verdicts your principle cannot accommodate, and whether I should give that verdict up. If a simpler principle that overturns one verdict competes with a more complicated one that saves them all, present both and recommend one.
  - A verdict on where my pattern sits in the reductionism/anti-reductionism landscape, and whether it is a stable position or a muddle.
  - A direct response to case 14: whether my meta-verdict there is in tension with any of my other verdicts.

  Please think carefully and show your reasoning, keep the prose polished, and write in American English. I do not need citations, reading lists, or references to particular authors; if you mention a named position, describe it in your own words.
reasoning: |-
  Okay, the user is a philosopher specializing in epistemology, particularly testimony and social epistemology. They've presented 14 specific cases where they have intuitive judgments about when it's acceptable to believe a speaker, and they're concerned these intuitions might be inconsistent. They want me to reconstruct an underlying principle that explains these judgments, analyze its coherence, and position it within the reductionism/anti-reductionism debate.

  Looking at their cases, I notice several patterns. They readily accept testimony in mundane situations (like directions from strangers) but require verification in high-stakes contexts (like car purchases). They trust personal experience reports (pain descriptions) but distrust secondhand medical advice. They distinguish between human and machine sources, preferring human-curated information. They also value speakers going against their interests and reject bias-based skepticism.

  The user's hunch about "answerability" is interesting but seems insufficient—it doesn't explain why they trust thermometers or encyclopedias. I need to develop a more nuanced principle. Let me brainstorm some candidates:

  First candidate: **Interest-Relative Defeasible Entitlement**. Belief is permitted unless (1) high stakes, (2) speaker lacks direct access, (3) conflict of interest, or (4) source is non-agential. This handles many cases but struggles with the thermometer and encyclopedia—why trust non-agential sources?

  Second candidate: **Answerability Plus Epistemic Scaffolding**. Adds that non-agential sources must have human-certified reliability. This saves the thermometer (calibrated by humans) and encyclopedia (curated by experts) but feels ad hoc.

  Third candidate: **Recursive Entitlement with Source Sensitivity**. Treats testimony as justified if the chain ultimately traces to competent human judgment. This explains distrust of AI (no human anchor) and trust in scientific consensus (human validation) but might overcomplicate simple cases like street directions.

  After weighing trade-offs, I'll recommend a hybrid approach: **Defeasible Entitlement to Human Testimony with Reliability Conditions**. Core idea: We're entitled to trust human speakers who demonstrate basic competence and sincerity, unless defeated. Non-human sources require evidence of human-certified reliability. This accommodates most cases:

  - Street directions (undefeated human testimony) ✅  
  - Car salesman (defeated by conflict of interest) ✅  
  - Friend's medical advice (lacks competence) ✅  

  It also resolves borderline cases:  
  - Bridge safety: Permissible if low-stakes, not if high-stakes  
  - AI-translated testimony: Trustworthy only if human-verified  

  Tensions remain with case 14 (rejecting bias-based skepticism). This actually coheres with the principle—bias isn't a valid defeater unless linked to competence/sincerity. The user's meta-verdict is consistent.

  In the reductionism debate, this lands near anti-reductionism but with concessions: default trust in humans, yet reductionist demands for non-human sources. It's a stable, hybrid position. The doctor-AI case clarifies: You're trusting the doctor's human judgment, which incorporates and validates the machine's output.

  The user should consider relaxing verdict 7 (encyclopedia trust) if they reject epistemic scaffolding, but I argue it's justifiable. Overall, their intuitions hang together better than they suspect.
answer: |-
  Here’s a reconstruction of your epistemic principle, developed through analyzing your verdicts, brainstorming alternatives, and testing for consistency. Your pattern suggests a **hybrid theory blending competence-based anti-reductionism with source-sensitive defeaters**, prioritizing *epistemic justification* (permitting belief absent defeaters) as the core notion. This balances default trust in human testimony with rigorous checks against epistemic risk.

  ---

  ### **The Proposed Principle: Defeasible Entitlement to Human Testimony with Reliability Conditions**
  **Core Principle:**  
  You are *defeasibly justified* in believing testimony if:  
  > **(A)** The source is **human** (capable of sincerity, commitment, and understanding), **and**  
  > **(B)** The source **manifests basic competence** (direct access, relevant capacity, or institutional backing), **and**  
  > **(C)** There is **no undefeated defeater** (see below).  

  **Defeaters (conditions that undermine justification):**  
  1. **High stakes/practical risk** (e.g., financial loss, health).  
  2. **Conflict of interest** (e.g., incentive to deceive).  
  3. **Source incompetence** (lack of access, training, or institutional credibility).  
  4. **Non-human source** (unless reliability is human-certified via calibration/oversight).  
  5. **Anonymity without institutional scaffolding** (no accountability).  

  **Why justification?** It captures permissibility without requiring positive evidence (matching your "no corroboration" cases) while allowing defeaters to block belief. Entitlement is too weak for high-stakes cases; warrant is too broad.

  ---

  ### **How the Principle Earns Its Parts from Your Cases**
  - **Clause (A)**: *Human source* forces trust in strangers (Case 1), friends (Case 4), and pain reports (Case 11) vs. distrust of AI (Case 6).  
  - **Clause (B)**: *Basic competence* explains distrust of friend’s medical advice (Case 3: no expertise) vs. trust in directions (Case 1: assumed local knowledge).  
  - **Defeater 1 (High stakes)**: Explains distrust of car salesman (Case 2) and anonymous reviews (Case 12).  
  - **Defeater 2 (Conflict of interest)**: Justifies trust in self-undermining testimony (Case 10).  
  - **Defeater 3 (Source incompetence)**: Covers credentialed scientists contradicting (Case 5: no consensus = incompetence on the claim).  
  - **Defeater 4 (Non-human source)**: Explains AI distrust (Case 6) but allows thermometers (Case 8) and encyclopedias (Case 7) via **human-certified reliability** (calibration/editorial oversight).  
  - **Defeater 5 (Anonymity)**: Rejects online reviews (Case 12) but accepts encyclopedias (Case 7: institutional scaffolding overrides anonymity).  

  **Special cases**:  
  - Case 9 (hearsay): Justified due to **chain of human competence** (friend’s friend has access), but weaker due to added defeater risk.  
  - Case 13 (scientific consensus): **Institutional competence** defeats individual fallibility.  
  - Case 14 (bias suspicion): Rejected as an *invalid defeater* since bias doesn’t inherently indicate incompetence/sincerity failure.  

  ---

  ### **Verdicts on New Cases**  
  1. **Stranger says bridge is safe**:  
     - **Low stakes**: Justified (like Case 1).  
     - **High stakes** (e.g., collapse risk): Defeated (like Case 2).  
  2. **Friend’s friend heard from AI**:  
     - Not justified. **Double defeater**: Non-human source + hearsay. (Breaks chain of competence; cf. Case 9 where all sources are human.)  
  3. **Machine translation of testimony**:  
     - Justified **only if** the translation is human-verified (e.g., certified interpreter). Else, Defeater 4 applies.  
  4. **Claim fits prior belief**:  
     - Not a justifier alone—**irrelevant to testimony’s reliability**. (Defeaters may still apply, e.g., a conflicted salesman’s claim that aligns with your hunch.)  
  5. **Reliable speaker wrong on this before**:  
     - **Defeated** (local incompetence = Defeater 3), even if generally reliable.  

  ---

  ### **Inconsistencies and Trade-offs**  
  Your principle **cannot fully accommodate Case 7 (encyclopedia trust)** without appealing to "human-certified reliability." If you reject this scaffolding:  
  - **Option 1 (Stricter humanism)**: Reject trust in encyclopedias/thermometers. Upside: Purity. Downside: Forces you to abandon intuitive trust in instruments.  
  - **Option 2 (Keep scaffolding)**: Accept encyclopedias as extensions of institutional testimony. Upside: Saves Cases 7–8. Downside: Some may see it as ad hoc.  
  **Recommendation**: Keep Option 2. Case 7 is central to your intuitions; rejecting it creates bigger problems (e.g., distrusting all curated knowledge).  

  **All other verdicts are preserved**, including Case 14: Suspicion based on dialect/appearance isn’t a valid defeater because it doesn’t correlate reliably with competence/sincerity failures. This aligns with your meta-verdict and defeats bias.

  ---

  ### **Position in the Reductionism/Anti-Reductionism Landscape**  
  You are a **moderate anti-reductionist with source-sensitive constraints**:  
  - **Anti-reductionist core**: Default trust in humans (Cases 1, 4, 10, 11) without needing evidence.  
  - **Reductionist elements**: Demand for positive reasons in high-stakes contexts (Cases 2, 5) and for non-human sources (Case 6).  
  - **Novelty**: You **extend anti-reductionism to institutions** (Cases 7, 13) but **deny it to machines** (Case 6), treating them as inert tools unless human-certified.  

  **Stability**: This is a **stable hybrid position**. It avoids the naïveté of pure anti-reductionism (ignoring stakes/conflicts) and the over-demandingness of reductionism (requiring evidence for mundane testimony). Your "answerability" hunch is refined: It’s not mere answerability, but **answerability *plus* competence** that matters.  

  ---

  ### **Response to Case 14 and the Doctor-AI Case**  
  - **Case 14 (doubt based on appearance)**: Your meta-verdict is **consistent**. Distrust requires valid defeaters (incompetence, conflict of interest); bias alone isn’t one. This aligns with rejecting irrelevant defeaters in Cases 1 and 10.  
  - **Doctor-AI case**: You are **trusting the doctor’s competence**, not the AI. The doctor’s assurance ("I checked") certifies the AI’s output, satisfying Defeater 4 (non-human source) via human oversight. The distinction collapses—you believe the *doctor’s testimony*, which incorporates machine data.  

  ---

  ### **Final Assessment**  
  Your verdicts are **largely consistent** under a principle of defeasible entitlement to human testimony, conditioned on competence and source type. The sole tension (encyclopedia/thermometer trust) is resolvable by accepting institutional/machine reliability as derivative of human judgment. This position is tenable within social epistemology, offering a pragmatic middle ground. **Revise nothing**—your intuitions reflect a coherent, real-world responsiveness to epistemic responsibility.
