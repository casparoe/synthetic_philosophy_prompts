prompt: |-
  I want your credence in one specific claim about the dogmatism paradox, with the decomposition, not a survey of the positions. The claim: the paradox — that knowing P entitles me to treat every would-be counter-consideration as misleading, so that knowledge functions as a standing licence to discount evidence — is not an artefact of an over-strong closure or infallibility principle; it follows from any view on which knowledge is the norm of belief, and the only non-question-begging way out is to demote knowledge to a status one can have without thereby being entitled to dismiss anything.

  Give me a number and the terms it depends on, each with a rough probability and one line of justification: whether knowledge really does entail the falsity of anything that entails not-P; whether rational dismissal of a piece of evidence requires more than its being misleading, say independent grounds for thinking the source tracks the truth here; whether higher-order evidence, evidence about how I came by the belief, is a distinct evidential kind that first-order knowledge does not automatically defeat; and whatever else you think belongs. Then combine them and tell me which term the final figure is most sensitive to.

  For what it is worth I sit near 0.25 and a friend who works on this sits near 0.8; say which term most likely carries our disagreement, and which single case or argument would move your own number most. One variant I care about: does anything change if the subject has credence 0.99 in P on good evidence rather than flat-out knowledge, and if your number moves, which term moved. Please answer in British English.
