prompt: |-
  ok so i've been arguing with my brother in law for like a month about whether you can ever get a "should" out of an "is," and i keep catching myself agreeing with him on one example and then turning around and calling the exact same move a cheat on the next one. i don't have any philosophy background, i've just been thinking about it on my own, and at this point i'd rather someone just tell me what rule my gut is actually following, because i clearly have one and can't say what it is.

  here are my verdicts on a bunch of little arguments. mostly these are things people actually say to me.

  - "you promised you'd be there at 6, so you should be there at 6." airtight. not a cheat at all.
  - "that's your mother, so you should call her more." softer but i still think it basically works.
  - "she's in pain, so you should give her something for it." honestly the strongest one on this list.
  - "he caused the crash, so he should pay for it." fine by me. nobody blinks at this one.
  - "the sign says no parking, so don't park there." fine.
  - "the knife's dull, grab the other one." fine, but this one feels like a different animal somehow and i can't say why.
  - "everyone in this town drives everywhere, so it's fine that i do." cheat. just because everyone does it doesn't make it right.
  - "it's natural, so it's good for you." cheat. my brother in law says this about everything from diets to how he raises his kids and it always sounds like a dodge.

  heres the thing i keep noticing: the ones that feel fine, the "is" part already seems to have some shouldness baked into it. a promise, a mother, pain, causing a crash — none of those are neutral facts, are they? and the ones that feel like cheats ("natural," "everybody does it") are totally neutral facts with nothing hiding inside them. so maybe the rule is just: neutral facts can't give you a should, but facts that are already half-evaluative can, because the should was in there all along.

  but then i worry i've just assumed the thing i was trying to prove. and the knife one bugs me — "you should grab the other one" only works if you're trying to cut something. is that a seperate kind of should, where it's relative to what you want, versus the others that seem to just apply to you no matter what you want? if so, does that break my whole pattern or save it?

  so: is there one principle that gets all eight of my verdicts, or do i have to give one up? and what does it say about two i havent settled — "he earns more than me, so he should pay more tax," and "my dog is suffering and won't get better, so i should end it."
reasoning: |-
  Okay, the user is grappling with the is-ought problem, a classic philosophical issue. They've been arguing with their brother-in-law about whether you can derive a "should" from an "is," and they've provided several examples where they intuitively accept or reject such derivations. They're looking for a consistent principle to explain their judgments.

  First, I need to recognize that the user doesn't have a philosophy background, so I should avoid jargon and make the explanation accessible. Their examples are everyday situations, which helps ground the discussion. They've noticed that in cases where they accept the derivation, the factual premise ("is") already seems to contain some evaluative element—like a promise, family relationship, or pain. In contrast, neutral facts like "everyone does it" or "it's natural" don't seem to justify a "should" to them.

  Their insight about "shouldness baked in" is actually quite sharp. This aligns with how contemporary ethics handles the is-ought gap. Philosophers like Philippa Foot and Elizabeth Anscombe have argued that certain facts are inherently normative. For instance, promising implies an obligation; causing harm creates a duty to rectify it. These aren't neutral descriptions but are entangled with values.

  The knife example is interesting because it's instrumental. The "should" here depends on a goal (cutting efficiently). If you don't care about cutting, the advice doesn't apply. This contrasts with moral "shoulds" that feel binding regardless of desires. The user is right to sense a difference here—it’s hypothetical vs. categorical imperatives, though I won’t use those terms explicitly.

  For the unresolved cases:  
  - Progressive taxation: "He earns more, so he should pay more tax." This leans on fairness, a value already embedded in the premise. If society accepts that principle, the derivation works. If not, it’s just a neutral fact.  
  - Euthanizing a suffering dog: The "should" comes from the value of minimizing suffering, which isn’t neutral. Most people accept that as a duty, so it feels intuitive.  

  The key principle is that facts can imply "should" if they reference accepted norms or values. Neutral facts can’t generate obligations alone. This resolves all their examples consistently. Their gut is picking up on whether the "is" presupposes a shared standard of value.  

  I’ll validate their intuition, clarify the distinction between instrumental and moral "shoulds," and apply it to the unresolved cases without overcomplicating it. They’ve already done the heavy lifting—I just need to frame it clearly.
answer: |-
  You're describing the classic **"is-ought problem"** (Hume's Guillotine), and your intuition is remarkably sharp. Based on your verdicts, here's the principle your gut is following:

  **"Is" can imply "should" ONLY IF the "is" statement either (1) inherently contains a normative commitment (like a promise, role, duty, or value), or (2) assumes a shared goal or desire.** Neutral facts alone cannot generate a "should."

  Let's break down your examples using this principle:

  ### ✅ Cases Where "Is" Validly Implies "Should" (Normative Commitments)
  1. **"You promised, so you should."**  
     *Why it works:* "Promise" inherently contains the normative commitment of obligation. The "is" ("you promised") isn't neutral; it's already a moral fact.
  2. **"That's your mother, so you should call."**  
     *Why it works:* "Mother" implies a culturally recognized role with inherent duties (care, respect). The norm is baked into the relationship.
  3. **"She's in pain, so you should help."**  
     *Why it works:* "Pain" isn't neutral—it presupposes a **shared value** (suffering is bad/undesirable). If we agree pain should be alleviated, the "should" follows.
  4. **"He caused the crash, so he should pay."**  
     *Why it works:* "Caused" implies responsibility (a normative concept). The "is" assumes a principle of fairness/restoration.
  5. **"The sign says no parking, so don’t park."**  
     *Why it works:* The sign represents a **rule or agreement** (e.g., legal/social contract). The "is" ("sign exists") implies an obligation to comply if you accept the system.

  ### 🔄 The Knife Example (Shared Goal)
  6. **"The knife's dull, grab the other one."**  
     *Why it feels different:* This is **instrumental reasoning**, not moral. It assumes a shared goal ("you want to cut effectively"). The "should" is conditional: *If* you want to cut, *then* you should grab the sharp knife. No inherent value judgment—just cause-and-effect.

  ### ❌ Cases Where "Is" Fails to Imply "Should" (Neutral Facts)
  7. **"Everyone drives, so it's fine."**  
     *Why it's a cheat:* "Everyone does X" is a neutral fact. It contains no inherent value (e.g., "common" ≠ "right"). No normative commitment is baked in.
  8. **"It's natural, so it's good."**  
     *Why it's a cheat:* "Natural" describes a state of affairs but implies no value (e.g., cancer is natural but not good). The leap to "good" smuggles in an unstated value.

  ### Your Insight is Correct
  You nailed it: **The valid "is-to-should" moves rely on premises that are already "normatively loaded."** You’re not begging the question—you're recognizing that some facts (promises, roles, pain) *are* inherently evaluative. Hume’s point isn't that we can't derive "ought" from "is," but that we can't derive it from *purely descriptive, value-free* facts. Values must enter the picture somewhere.

  ---

  ### Applying the Principle to Your Unresolved Cases
  1. **"He earns more, so he should pay more tax."**  
     *Verdict:* **Conditionally valid.**  
     *Why:* If you presuppose a normative principle (e.g., "taxation should be progressive based on ability to pay"), then the "is" (higher income) implies the "should." Without that value premise, it’s just a neutral fact.  
     *Your gut likely accepts this IF you endorse fairness as a value.*

  2. **"My dog is suffering and won’t get better, so I should end it."**  
     *Verdict:* **Valid.**  
     *Why:* "Suffering" (like pain) is not neutral—it presupposes suffering is bad and should be minimized. Combined with "won’t get better," it implies a duty of mercy. The norm is baked into "suffering."

  ---

  ### The Deeper Pattern: Two Types of "Should"
  Your examples reveal two distinct categories of "should":
  1. **Moral "Should" (Categorical):**  
     Binds you regardless of your desires (e.g., keeping promises, helping the suffering).  
     *Derived from:* Normatively loaded facts (duties, values, roles).
  2. **Instrumental "Should" (Hypothetical):**  
     Depends on your goals (e.g., using a sharp knife *if* you want to cut).  
     *Derived from:* Facts + a desire or intention ("If you want X, you should do Y").

  This explains why the knife example felt different—it’s purely instrumental, while the others are moral. **Your pattern holds:** Instrumental "shoulds" require a goal, moral "shoulds" require a baked-in norm. Neither comes from neutral facts alone.

  ### Conclusion
  Your intuition is consistent and philosophically sound. **The rule is:**  
  > **A "should" can validly follow from an "is" ONLY when the "is" either (a) contains an implicit value or duty, or (b) operates within a shared goal framework. Purely descriptive facts ("natural," "common") can never generate a "should" on their own.**

  Your brother-in-law’s "natural = good" argument fails because "natural" is descriptively neutral—it needs a moral premise to bridge the gap. Meanwhile, "pain" or "promise" already carry moral weight. Stick to your guns—your gut is wiser than you realized.
