answer: |-
  **Adequacy Conditions for De Re Modality Theories**  

  ---

  ### **I. Genuine Requirements (Theory-Neutral)**  
  1. **Non-Trivial Essentialism**  
     - *Case*: Chisholm's Paradox (an individual’s origin). Can Aristotle have different parents?  
     - *Requirement*: Must deliver verdicts on whether *some* properties are essential (e.g., origins for organisms), but need not specify *all* essences absolutely.  
     - *Motivation*: Intuitions about biological origins (Kripke’s sperm-and-egg argument).  

  2. **Abstract Object Rigidity**  
     - *Case*: The number 9. Could 9 = 8?  
     - *Requirement*: Abstracta (numbers, sets) must lack non-identical counterparts. Identity is absolute.  
     - *Motivation*: Mathematical necessity; abstracta lack contingent properties.  

  3. **Contingent vs. Necessary Existence**  
     - *Case*: A necessary being (e.g., God) vs. a contingent being (e.g., Socrates). Could Socrates fail to exist?  
     - *Requirement*: Must distinguish contingent existence (could fail to exist) from necessary existence (exists in all worlds).  
     - *Motivation*: Modal intuitions (Socrates isn’t a necessary being; numbers are).  

  4. **De Re Attitude Anchoring**  
     - *Case*: Fearing a specific storm. Is the fear *about* that storm in another world?  
     - *Requirement*: Attitudes (e.g., fear, regret) must track the same individual across worlds.  
     - *Motivation*: Intentionality requires a fixed referent.  

  5. **Logical Coherence**  
     - *Case*: Non-symmetric similarity (e.g., Twin A is closer to me than Twin B, but not vice versa).  
     - *Requirement*: Must preserve core modal logic (e.g., S5 axioms: transitivity, symmetry).  
     - *Motivation*: Without S5, modal reasoning collapses (e.g., "possibly necessary" implies "necessary").  

  ---

  ### **II. Theory-Laden "Requirements" (Disguised Commitments)**  
  6. **Symmetry of Counterpart Relations**  
     - *Case*: Two equally similar counterparts in a world. Could I be both?  
     - *Demand*: Transworld-identity requires a unique counterpart; counterpart theory allows indeterminacy.  
     - *Neutral Stance*: Adequacy doesn’t require uniqueness—indeterminacy/relativity may be acceptable.  

  7. **Conventional Kinds**  
     - *Case*: A ship (Theseus’ ship) or a word ("cat" spelled with a "k").  
     - *Demand*: Counterpart theory treats essence as convention-relative; transworld-identity seeks intrinsic essences.  
     - *Neutral Stance*: Must explain conventional dependence, but needn’t reduce essence to convention.  

  8. **Counterpart Relation Variability**  
     - *Case*: Similarity in shape vs. origin for a statue.  
     - *Demand*: Counterpart theory permits multiple relations; transworld-identity requires one canonical relation.  
     - *Neutral Stance*: Shifting relations may be necessary for contextual accuracy.  

  ---

  ### **III. Cross-Cutting Constraints**  
  9. **Cross-World vs. Cross-Time Uniformity**  
     - *Requirement*: Need not treat modality and time uniformly. Temporal parts solve persistence; counterparts solve modality. A principled disanalogy is allowed.  
     - *Motivation*: Time involves causal continuity; modality involves similarity.  

  10. **Counterpart Relation Cardinality**  
      - *Requirement*: May allow context-dependent counterpart relations (e.g., taxonomic interests). No single relation is mandatory.  
      - *Motivation*: "Could have been a pianist" vs. "could have been a parent" track different similarities.  

  ---

  ### **IV. Impossibility Results**  
  - **Joint Unsatisfiability**: Requirements **#3 (Contingent Existence)** + **#5 (S5 Logic)** + **#1 (Non-Trivial Essentialism)** conflict.  
    - *Conflict*: If Socrates exists contingently, S5 requires that in any world, if Socrates exists, he is identical to himself. But if Aristotle’s parents are essential, Socrates can’t exist in worlds with different origins. Transworld-identity preserves S5 but denies contingent existence; counterpart theory saves contingency but sacrifices S5 (if counterparts are non-symmetric).  
  - **Buried Tension**: Requirement **#4 (De Re Attitudes)** + **#8 (Counterpart Variability)**. Attitudes demand a fixed referent; variable counterparts fracture intentional objects.  

  ---

  ### **V. Scoring Counterpart Theory (CT) vs. Transworld-Identity (TI)**  
  **Bottom Line**: Requirement **#3 (Contingent/Necessary Existence)** is the most exclusionary. No account satisfies all conditions; CT fails #2 and #5; TI fails #1 and #6.  

  - **CT Scores**:  
    - ✅ #1 (Non-trivial essentialism: parents can be essential contextually).  
    - ❌ #2 (Abstracta: collapses to identity, but relation must be "looser" for concreta—no principled basis).  
    - ✅ #3 (Contingency: Socrates has no counterparts in parent-altered worlds).  
    - ❓ #4 (Attitudes: counterparts fracture objects; "fearing Storm X" may not track X).  
    - ❌ #5 (S5 logic: non-transitive counterparts violate "possibly necessary → necessary").  
    - ✅ #6/#8 (Conventional kinds/variable relations: CT’s strength).  

  - **TI Scores**:  
    - ❌ #1 (Rigid essentialism: Aristotle can’t have different parents).  
    - ✅ #2 (Abstracta: identity is absolute).  
    - ❌ #3 (Contingency: if Socrates exists in another world, he is identical—but how if origins differ?).  
    - ✅ #4 (Attitudes: fixed referent).  
    - ✅ #5 (S5 preserved).  
    - ❌ #6 (Conventional kinds: artifacts need intrinsic essences).  

  **Key Exclusion**: #3 (Existence) forces TI to deny contingent existence (or equivocate on identity) and CT to abandon S5. **Joint satisfiability is impossible** given #1+#3+#5. CT sacrifices logic (#5); TI sacrifices flexibility (#1, #6). The central tension is **rigid transworld identity vs. contingent existence with variable essences**.  

  ---  
