prompt: |-
  I have been asked to lead a ninety-minute continuing-education session on why promises bind, for a mixed group of adults — several of them lawyers, none of them philosophers — and what I want from you is not the argument but a plan for teaching it. The line I want the session to earn rather than assume is this: the hard question is not why we should keep promises but how saying something can create an obligation in the first place, and any answer worth having has to do two things that a straightforward appeal to the harms of broken trust cannot. It has to explain why a promise is not merely a very heavy reason among the reasons one already has, but a reason that rules out acting on some of them — why something better coming up is not, by itself, something the promisor is free to weigh. And it has to explain why the obligation is owed to the person who was promised to, in the sense that she, and no one else, can release the promisor from it.

  Given that target, plan the explanation: what has to be in place before the question even registers as a question, and in what order the pieces have to come so that each one is motivated by the piece before it rather than simply asserted. I want the session built around one case that does the real work, and I want you to tell me what that case must have and what it must lack — in particular, it has to be a case in which the consequentialist fallback is unavailable, so that breaking the promise costs no one anything measurable and the promisor has an obviously better use for his time. I had thought of a promise made to someone who has since died, and separately of a promise to do something the promisor would certainly have done anyway; tell me whether either can bear that weight, or what should replace them.

  Then the misconceptions. I am expecting at least these, and I want them predicted in the order they will actually surface and pinned to the precise point in the sequence where each should be headed off: that a promise is just a prediction of one's own behavior; that it binds only because someone is relying on it; that the promisor can release himself; that a promise no one knows about is not binding; and that an insincere promise was never a promise at all. Several of the lawyers will try to convert the whole thing into a question about contract law, and I would rather that be disposed of in a sentence than in a lecture. Tell me what I am missing, especially the misconception that the sequence itself will generate.

  Finish by giving me a single question to put to the room at the end — something that would expose whether they have grasped the structure or merely collected three positions — and tell me what I should refuse to explain at this level, and say so out loud. Please write this in continuous prose: no headings, no numbered steps, no bullets, no bold, no tables, the way you would write it out in a long email to a colleague. I don't need a reading list; nobody in the room would read it.
reasoning: |-
  Hmm, this user is asking me to design a teaching plan for a 90-minute session on why promises create obligations. They're targeting a mixed adult group with lawyers but no philosophers, and want to focus on how mere words can create binding obligations that rule out other considerations and are specifically owed to the promisee.

  The key challenge they've outlined is making participants understand that promises aren't just strong reasons for action but actually exclude competing reasons, and that the obligation is specifically to the promisee who alone can release it. They want me to avoid abstract philosophy and build everything around one central case study.

  I need to create a progression where each step naturally leads to the next, starting with making the question feel puzzling before attempting to solve it. The user mentioned two potential cases: a promise to someone who's died, or a promise to do something one would've done anyway. The death case might work if framed carefully - perhaps a promise to visit a grave that conflicts with a sudden important opportunity. This would make consequentialist appeals ineffective since no one is harmed, and it highlights the "owed to" aspect since only the deceased could release it.

  For misconceptions, I should anticipate and strategically address them in sequence: the prediction error (early, when establishing what a promise isn't), reliance (when the core case is introduced), self-release (when discussing the promisee's exclusive authority), unknown promises (to handle privacy concerns), and insincere promises (to separate bindingness from sincerity). The contract law diversion should be shut down quickly by distinguishing moral obligation from legal enforceability.

  The session should end with a revealing question like "Could the promisor properly decide to skip the grave visit if something better came up, without feeling he'd broken his word?" This would test if they grasp the exclusionary nature of promises. I should explicitly refuse to dive into meta-ethics or moral realism.

  Throughout the explanation, I'll need to make the philosophical puzzle feel visceral first - perhaps by contrasting a promise with a strong preference to show how they function differently in our reasoning. Every concept must be motivated by what came before rather than asserted. The lawyers might push back on the non-legal framing, so I should acknowledge that early but firmly maintain the focus on moral obligation.
answer: |-
  Here’s how to structure the ninety minutes, building the puzzle brick by brick and using a single case to force the key distinctions. The sequence is designed to make the target question feel urgent before offering tools to address it, and to preempt misconceptions at the point they’d naturally arise.

  Start by grounding it in the familiar. Ask the group for examples of promises they’ve made or received that *felt* binding, even when inconvenient. List a few on a board. Then pivot: "We all agree we *should* keep promises, usually. But today’s not about *why* we should keep them. It’s about *how* this thing even works. How can just *saying some words* create a new obligation that wasn’t there before? How does it change the moral landscape?" This frames the mystery. Immediately distinguish it from the "why be moral?" question – assume they accept keeping promises is generally right. The puzzle is the *mechanism*.

  Now, introduce your core case – **the Grave Visit Promise**. Make it stark: *A person, on their deathbed, asks their closest friend, "Promise me you’ll visit my grave on the first anniversary of my death, just for five minutes, to say hello." The friend sincerely promises. The person dies. A year later, on the anniversary, the friend remembers the promise. However, a once-in-a-lifetime professional opportunity arises that exact hour – something immensely beneficial to the friend and harmless to anyone else (e.g., a crucial, unexpected meeting with a potential major client who can only meet then). No one else knows about the promise. The deceased person cannot be harmed, disappointed, or know if the promise is broken. Breaking it causes no measurable harm to anyone. Keeping it provides no measurable benefit to anyone (the dead don't know). Yet, the friend feels bound. Why?*

  **Why this case works (and why the alternatives falter):**
  *   **Death removes the consequentialist fallback:** No reliance interests (can't rely after death), no harm, no benefit, no disappointment, no relationship damage. The lawyerly "detrimental reliance" or "expectation damages" model crashes here.
  *   **"Would have done anyway" is insufficient:** You need a *conflict* with the promisor’s self-interest. Here, the opportunity is objectively better *for the promisor*, making the choice stark. A promise to do something you'd do anyway doesn't create tension or reveal the exclusionary force; it just looks like coincidence.
  *   **Highlights "owed to":** The obligation feels *to the deceased*. Only *they* could have released it (by saying "don’t worry about it" before dying). Others forgiving the friend doesn't erase the sense of *wronging the dead person*.
  *   **No audience:** Eliminates "reputation" as the binding force.

  **Develop the sequence using the case:**

  1.  **Establish the Binding Feeling:** Present the Grave Visit case. Ask: "Does the friend *have* to go to the grave? Is it genuinely wrong to skip it for the opportunity?" Most will feel yes. Press: *Why?* What *is* the wrong being committed? If not harm, what? This makes the puzzle visceral. *(Misconception Preemption Point 1: "It's just a prediction.")* Here, someone might say, "He only *thought* he was promising; it was really a prediction he'd *want* to go." **Shut this down:** Contrast a prediction ("I *will* visit") vs. the promise ("I *promise* I will visit"). The prediction can be wrong without moral failure; breaking the promise *is* a moral failure. The words perform a different act. The feeling of obligation arises from the *act of promising*, not forecasting.

  2.  **Expose the Insufficiency of Harm/Reliance:** Ask: "What harm is done by skipping the visit? Who is hurt?" They’ll struggle. Concede: No one relies (deceased can't), no one is harmed, no relationships are damaged (no one knows). Yet, the obligation feels intact. *(Misconception Preemption Point 2: "It binds only because someone is relying.")* This is the moment to kill reliance. If reliance were key, this promise *couldn't* bind. But it does. Therefore, reliance, while often *present* and *important* in *many* promises, isn't the *core* of what *makes* a promise bind. It might be a consequence or amplifier, but not the source.

  3.  **Introduce the "Better Thing":** Emphasize the opportunity is genuinely better *for the promisor* and harmless. Ask: "Can the friend just *weigh* the importance of keeping his word against the benefit of the meeting? Is it just a heavy reason on one side of the scale?" Push the intuition: If he skips the grave, we feel he didn't just make a suboptimal choice; he *wronged his friend*. The promise seems to *rule out* acting on the self-interested reason, not just compete with it. It changes the *kind* of reasoning he’s allowed to do. This sets up the need to explain *exclusionary force*.

  4.  **Focus on the Promisee:** Ask: "Who gets to say it’s okay to skip the grave visit?" Not the promisor himself. Not mutual friends. Only the dead person could have released him. The obligation was *to them*. *(Misconception Preemption Point 3: "The promisor can release himself.")* **Counter:** If he could release himself, the obligation vanishes whenever it’s inconvenient, making the promise pointless from the start. The authority lies with the *recipient* of the promise. *(Misconception Preemption Point 4: "A promise no one knows about isn't binding.")* **Counter:** If the *promisor* knows (as in this case), and the obligation is *to the promisee*, why would *third parties* knowing matter? An unknown promise can still be broken *to the promisee*.

  5.  **Address Sincerity (Briefly):** Someone might argue, "A deathbed promise is extra serious." Or, "But what if he didn't mean it?" *(Misconception Preemption Point 5: "An insincere promise wasn't a promise at all.")* **Clarify:** Focus on the *act performed*. If he said "I promise" intending to deceive, he *did* promise (he performed the act), but did so *wrongly* (by lying). The obligation might be defeasible or overridden by the lie, but the act of promising *occurred* and created a *prima facie* obligation, even if a fraudulent one. The puzzle of *how words create obligation* still applies to the sincere case. Don’t get bogged down in insincerity; keep focus on the core mechanism using the sincere case.

  **Handling the Lawyers:** When (not if) someone says, "But this isn't a contract, there's no consideration/enforcement," **dispose of it sharply:** "Absolutely. We're not talking about legal enforceability tonight. Contract law is one social tool for managing agreements, often built *on top* of this deeper moral practice of promising. We’re digging into the moral bedrock underneath the law: how do words alone create a *moral* obligation owed specifically to another person?" Move on. Don’t engage in legal analysis.

  **The Final Question:** End the explanation phase and pose this: **"In the Grave Visit case, if the friend *decides* to take the meeting instead, is he merely choosing the *better option*, or is he *violating a duty specifically owed to his deceased friend*? Can he properly weigh the meeting against the promise, or does the promise take the meeting *off the table* as a reason he's allowed to act on?"** This forces them to confront whether they've grasped the exclusionary force and the directed nature of the obligation. Listen for whether they talk about "weighing" vs. "wronging."

  **What to Refuse:** Explicitly state: **"We won't be diving into the deepest metaphysical foundations tonight – questions about whether morality itself is real or just subjective, or the ultimate nature of 'ought'. We're taking the basic reality of moral obligation as given and examining the specific, puzzling mechanism of this one pervasive practice: promising. We're also not constructing a full moral theory; we're just trying to understand what *this specific thing* is."** This sets boundaries and keeps you out of meta-ethical swamps.

  **The Sequence-Generated Misconception:** Be alert for this: **"So you're saying consequences/reliance NEVER matter?"** This arises because you so effectively sidelined them in the core case. **Clarify immediately:** "No! Consequences, reliance, relationships – these are *hugely important* in *most* real promises and often provide strong *reasons* to keep them. The point of our extreme case was to isolate the *core binding mechanism* that exists *even when those factors are absent*. In normal life, this core is usually wrapped in and strengthened by all those other good reasons. But if we want to understand the unique power of 'I promise,' we need to see what's left when we strip those other reasons away."

  The session's power comes from making the Grave Visit Promise feel genuinely puzzling and morally weighty *despite* the absence of consequences, then showing how the standard answers fail to resolve that puzzle, forcing the group towards the ideas of exclusionary reasons and directed obligation as necessary tools. The misconceptions become opportunities to refine the puzzle, not distractions. Keep bringing it back to *that case* and the two core features of promising you set out to explain.
