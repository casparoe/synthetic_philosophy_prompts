  The Szasz angle is provocative. If mental illness is merely "problems in living" (Szasz's phrase), could we still justify sectioning? The user's pushing me to dissect which elements strictly require biological disease assumptions. Smart move - they want the joints of the system carved at its philosophical tendons.

