prompt: |-
  I'm a backend engineer with no formal training in philosophy, and I'm trying to work out where I actually stand on whether morality can be written down as a set of rules. I keep modeling it as a rule engine with exception handlers, but I suspect that picture is quietly smuggling in a position, and that I've been collapsing several genuinely different views into one. So I'd like you to build me a decision tree that sorts the positions on this question, where every branch node is phrased as a concrete case or claim I could answer from the inside, without already knowing which label it leads to, and where the leaves are named only at the end.

  Make the root of the tree the question of whether any finite set of principles could get the moral facts right in every case. Let the nodes below it turn on the distinctions I actually care about: whether a consideration that is a reason in one situation can be no reason at all, or a reason against, in another (what I gather is the holism/atomism split); whether the correct response in a case is fixed by general features together with a rule for combining them, or whether it also depends on the particular details of the case in a way no finite combination rule captures; and whether principles, if there are any, are exceptionless, or real but defeasible, or merely useful summaries that never do the sorting work themselves.

  I want the leaves to include at least these: exceptionless generalism; pluralist generalism built on a short list of defeasible duties; the view that principles are true but ineliminably vague or incomplete; outright particularism, on which there are no true moral principles at all; and the hybrid that is particularist about what is right while remaining generalist about what counts as a reason for what.

  Use these as the concrete material for the nodes, because they are the cases that make me uncertain: a promise kept or broken because an emergency intervened; a feature like "it would be fun" that counts in favor of picking a leisure activity but against picking a surgeon; two features that each give a reason on their own but not when combined; and a pair of cases that differ only in a detail I would have called irrelevant yet seem to call for different verdicts.

  If some pair of leaves cannot be separated by any question a person could answer from the inside, say so at the node where the tree fails rather than inventing a distinction to keep them apart, and if a combination of answers corresponds to no position anyone actually holds, mark that leaf as empty and say in a clause whether that is because the view is incoherent or merely unexplored. Present the whole thing as exactly five numbered items, one per branch node, in the order the tree is traversed: for each, give the node's question as a concrete case or claim in one sentence, and in a second sentence name which positions fall on each side, flagging any empty leaf and any pair the tree cannot separate. No preamble and no closing summary.
reasoning: |-
  Hmm, the user is asking me to build a decision tree to help them sort out their philosophical stance on moral principles. They're a backend engineer with no formal philosophy training, and they've been modeling morality as a "rule engine with exception handlers" but suspect this approach might be oversimplifying complex philosophical positions.

  The user wants the root node to be about whether any finite set of principles could capture all moral facts. Then they want subsequent nodes to address key distinctions: holism vs. atomism (whether reasons can change polarity based on context), whether correct responses depend on particular details beyond general features, and the nature of principles (exceptionless, defeasible, or just summaries).

  They specifically want leaves to include: exceptionless generalism, pluralist generalism with defeasible duties, principles that are vague/incomplete, outright particularism, and a hybrid view combining particularism about rightness with generalism about reasons.

  For the concrete cases to base the nodes on, they provided: promise-keeping with emergencies, "it would be fun" as reason for/against in different contexts, two reasons that work independently but not combined, and cases differing only in seemingly irrelevant details yet requiring different verdicts.

  I need to structure this as exactly five numbered items representing branch nodes. For each node, I should present one concrete case/claim in one sentence, then in a second sentence name which positions fall on each side. I should flag any empty leaves or indistinguishable positions at the relevant nodes.

  I'll start with the root question about finite principles capturing all moral facts. Then I'll move to the holism/atomism distinction using the "fun" example. Next, I'll address whether combining rules can handle all cases using the synergistic reasons example. Then I'll use the emergency promise case to test exceptionless vs. defeasible principles. Finally, I'll use the differing-details case to separate particularism from other views.

  I need to be careful about which positions each question distinguishes. For example, the "fun" example should separate holist views (where reasons can change polarity) from atomist ones. The synergistic reasons case should test whether finite combining rules can capture all moral facts. The emergency promise case can distinguish between exceptionless principles and defeasible ones. And the differing-details case should help distinguish particularism from other views.

  I'll make sure that all the positions the user mentioned are covered in the leaves: exceptionless generalism, pluralist generalism, vague/incomplete principles, full particularism, and the hybrid view. I'll note where positions might collapse together or if any combinations are incoherent or unexplored.
answer: |-
  1.  **Can a finite set of principles, applied correctly, *always* tell you what's morally required in every conceivable situation?**  
      *   **Yes:** Proceed to 2 (Exceptionless Generalism, Pluralist Generalism, Vague/Incomplete Principles).
      *   **No:** Proceed to 5 (Outright Particularism, Hybrid Particularism).

  2.  **Can a feature that is a reason *for* an action in one context (like "it would be fun" for choosing a leisure activity) be a reason *against* that same type of action in another context (like "it would be fun" for choosing a surgeon)?**  
      *   **Yes:** Proceed to 3 (Pluralist Generalism, Vague/Incomplete Principles).
      *   **No:** Proceed to 4 (Exceptionless Generalism).

  3.  **Can two features (A & B), each giving a reason for an action when alone, combine such that they give *no reason at all* or a reason *against* the action when both are present? (e.g., "It would help my friend" & "It would advance my career" separately favor helping, but combined suggest selfish motivation and no longer favor it).**  
      *   **Yes, and a finite rule *can* capture this interaction:** Proceed to 4 (Pluralist Generalism).
      *   **Yes, but no finite rule *fully* captures such interactions / They inherently depend on context:** Leaf: **Vague/Incomplete Principles** (True but cannot be fully codified by finite, precise rules).
      *   **No, such interactions don't occur / are captured by rules:** Proceed to 4 (Pluralist Generalism, Exceptionless Generalism - *This combination is implausible given answer to 2, but the tree structure forces it here; mark as empty/unexplored*).

  4.  **When an emergency prevents you from keeping a promise, does this show the principle "keep promises" has a built-in *exception* (e.g., "unless an emergency intervenes"), or is the original principle *overridden* by another principle (e.g., "prevent harm")?**  
      *   **Built-in Exception / The rule itself is qualified:** Leaf: **Exceptionless Generalism** (Principles have explicit, exhaustive exceptions).
      *   **Overridden / One principle defeats another:** Leaf: **Pluralist Generalism** (Defeasible duties/principles).
      *   *(The 'empty' path from 3 leads here but corresponds to no coherent position given previous answers).*

  5.  **Could two cases be identical in all general features you could name (promise made, emergency occurred, harm prevented, etc.) *except* for a seemingly irrelevant detail (e.g., the day of the week, the color of a shirt), and yet this detail *genuinely* make one case morally permissible and the other not?**  
      *   **Yes, absolutely, the exact constellation of particulars matters irreducibly:** Leaf: **Outright Particularism** (No true moral principles).
      *   **No, if the general features are identical, the verdict *must* be identical / "Irrelevant" details can't change the core verdict:** Leaf: **Hybrid Particularism** (No principles for right/wrong, but general principles for what counts as a reason).  
      *(Note: Tree cannot separate Hybrid from Vague/Incomplete Principles based on user-supplied cases; both fall under "No" at root and "Yes" at 2 & 3, but Hybrid is excluded by "Yes" at root).*
