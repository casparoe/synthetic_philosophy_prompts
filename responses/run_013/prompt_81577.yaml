  **Refrain (5): A fading loss/gain? Lost to the night?** (Ambiguous Final Refrain)

  ---

  **How it Embodies the Paradox:**

  1.  **Flipping Refrain:** The refrain's core structure ("A [sudden/welcome/deeper/solid/fading] [loss/gain], [payoff], [action]") remains constant, but the emotional valence ("loss"/"gain") and the specific payoff ("two green coins", "two coins", "eight thirds", "four coins") flip and grow according to the sequence, mirroring `(-1)^n * 2^n / n`.
  2.  **Stanza Reorderability:** The narrative stanzas (A,B,C,D) describing specific flip sequences are modular. Reading them in the "natural" order (A,B,C,D) emphasizes early loss and growing negative terms first, leading to a "loss" feeling. Reading larger gains first (B,D,A,C) creates an initial "gain" feeling. Stanza E comments on the ongoing, undetermined process, and F explicitly states the dependence on ordering.
  3.  **Mathematical Hooks:** "Fractions grow" (n in denominator), "stacked in fours" (2^4 / 4 = 4), "eight thirds" (2^3 / 3), "halved again" (harmonic series implication), "sum depends on how they're told" (rearrangement theorem), "ledger's truth is yet unmade" (undefined expectation).
  4.  **Ambiguous Resolution:** The final refrain (F) is deliberately ambiguous ("fading loss/gain? Lost to the night?"). It doesn't resolve the paradox; it highlights the indeterminacy and the dependence on ordering ("how they're told").
  5.  **Poetic Accessibility:** The coin flip, gain/loss language, and ledger/accounting metaphor make the core action understandable even without knowing the math. The structure creates a feeling of instability and order-dependence that resonates emotionally.

  The poem itself is "conditionally convergent": its overall meaning (gain/loss feeling) converges to a specific value *depending* on the order of its stanzas, just like the expected value of the Pasadena game. The identical words yield divergent narratives.
