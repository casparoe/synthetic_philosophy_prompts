  1.  **Translation:** God preserved the *form* of animal sacrifice (a ritual practice deeply ingrained in the population due to their cultural history) but *redirected its function* away from idol worship, exapting it for the worship of God alone; this was necessary substitution therapy because path dependence and developmental constraint made an immediate, total rejection of the familiar ritual form impossible.
