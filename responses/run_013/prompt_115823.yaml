answer: |-
  The entire space turns on the evidentiary standards required to accept a claim about an evolved psychological adaptation as scientifically warranted rather than a post-hoc story.

  **Decision Tree: Evidentiary Standards in Evolutionary Psychology**

  1.  **Does the Westermarck effect (childhood co-residence dampening adult sexual attraction) demonstrate a pan-human, reliably developing cognitive architecture insensitive to cultural variation?**
      *   **NO:** Go to 2
      *   **YES:** Go to 3

  2.  **Is the apparent universality of the Wason task's "cheater-detection" advantage best explained by a specialized cognitive module?**
      *   **NO (e.g., argues it's an artifact of familiarity or abstract reasoning):** Go to 4
      *   **YES (e.g., argues content effects prove domain-specific logic):** *Position: **Developmental Systems Theory (DST)*** (Emphasizes radical plasticity, constructive development, rejects species-typical "architectures" as reified outcomes of contingent developmental processes).

  3.  **Can the human capacity for language be robustly defended as an adaptation based solely on its complex, functional design and current utility (e.g., communication)?**
      *   **NO (Requires comparative/phylogenetic evidence):** Go to 5
      *   **YES (Present design/utility is sufficient evidence of adaptation):** Go to 6

  4.  **Does the gene-culture coevolution of lactase persistence (dairy digestion) demonstrate that purely cultural transmission mechanisms fundamentally alter the adaptive landscape faster than genetic selection, requiring distinct models?**
      *   **NO (Sees it as a standard niche construction/gene-only adaptation):** Go to 7
      *   **YES (Requires explicit dual-inheritance modeling):** *Position: **Gene-Culture Coevolution / Dual-Inheritance Theory*** (Argues cultural evolutionary processes interact with genetic evolution, creating feedback loops that invalidate models assuming a static EEA or purely genetic inheritance).

  5.  **Is our strong taste preference for sugar/fat adequately explained as an adaptation solely by its current mismatch with modern abundance?**
      *   **NO (Requires comparative evidence, e.g., primate frugivory trends, fossil dietary reconstructions):** Go to 8
      *   **YES (Current design/utility + mismatch logic is sufficient):** *Position: **Human Behavioral Ecology (HBE)*** (Focuses on optimality modeling of current behavioral strategies in specific environments, often agnostic about cognitive mechanisms, sees mismatch as sufficient evidence for past adaptation).

  6.  **Can the hunter-gatherer EEA analogy combined with cross-cultural universality claims (e.g., in mate preferences) reliably test specific adaptation hypotheses?**
      *   **NO (EEA too vague, universality claims often contested/methodologically flawed):** *Position: **Spandrel/Exaptation Critique*** (Accepts potential adaptations but argues many complex traits like language or music are likely byproducts; emphasizes the evidentiary burden for distinguishing adaptation from exaptation/spandrel is rarely met by standard EP methods; "just-so" charge = evidential standards).
      *   **YES (These are core, valid tools for generating/testable hypotheses):** *Position: **Massive Modularity Adaptationism (Santa Barbara School)*** (Assumes pan-human cognitive architecture comprised of numerous domain-specific modules shaped by Pleistocene selection, tested via universality, functional design logic, EEA analogy; "just-so" charge seen as misapplication of physics standards).

  7.  **Does the observed variation in time-discounting rates across subsistence societies (e.g., immediate-return vs. delayed-return hunters) primarily reflect context-dependent optimization by a general learning mechanism, or the activation of distinct evolved modules?**
      *   **Optimization by general mechanism:** *Position: **Human Behavioral Ecology (HBE)*** (Predicts flexible behavioral shifts based on local ecology/returns using domain-general cognition; models like optimal foraging theory).
      *   **Activation of distinct modules:** *Position: **Massive Modularity Adaptationism (Santa Barbara School)*** (Predicts distinct "risk-assessment" or "future-planning" modules calibrated to cues of environmental stability).

  8.  **Is the core problem behind the "just-so story" accusation primarily the*testability*of adaptationist hypotheses, or the*evidential standards*used to support them?**
      *   **Testability (Hypotheses often untestable/falsifiable in principle):** *Position: **Developmental Systems Theory (DST)*** or ***Niche Construction*** (Both see the fundamental assumptions about a fixed architecture developing in a static EEA as flawed, making many hypotheses untestable. Distinguishing them cleanly on this tree is difficult - see notes).
      *   **Evidential Standards (Hypotheses are testable but current evidence/standards are insufficient):** *Position: **Deflationary View*** (Sees EP as a normal, sometimes clumsy science. Issues like WEIRD samples, overreliance on universality claims, underuse of phylogenetics are methodological growing pains, not fatal flaws. "Just-so" charge highlights need for better evidence, not untestability).

  **Notes on Unoccupied Combinations & Indistinguishable Leaves**

  1.  **Unoccupied: Accepts Universality (Westermarck YES) BUT Rejects Modularity (Wason NO) AND Rejects Present Design Sufficiency (Language NO) BUT Accepts Mismatch Sufficiency (Sugar/Fat YES):** Logically incoherent. If mismatch logic (a form of present design/utility argument) is sufficient for sugar/fat, rejecting present design sufficiency for language becomes arbitrary. No coherent position occupies this node.
  2.  **Unoccupied: Rejects Universality (Westermarck NO) BUT Accepts Modularity (Wason YES):** Unattractive/Unstable. Accepting a specialized module for cheater-detection implies some reliably developing architecture, contradicting the rejection of universality demonstrated by Westermarck. Few hold this combination.
  3.  **Indistinguishable Leaves: DST and Niche Construction at Node 8 (Testability focus):** The tree cannot reliably separate these positions at the final branch. Both strongly emphasize developmental contingency and reject a fixed EEA/architecture, leading them to see testability as the core "just-so" problem. Niche construction focuses more on organism-driven environmental change, DST on the entire developmental system. While distinct, their critiques of EP's fundamental assumptions regarding testability converge strongly in this specific context.
  4.  **Unoccupied: Accepts EEA/Toolkit Validity (H-G EEA YES) BUT Rejects Present Design Sufficiency (Language NO) AND Rejects Phylogenetic Evidence Sufficiency (Sugar/Fat NO):** Incoherent/Unattractive. Rejecting both primary evidentiary paths (present design *and* comparative/phylogenetic) while accepting the toolkit (which relies on them) leaves no viable way to establish an adaptation. No position holds this.
  5.  **Unoccupied: Rejects Phylogenetic Evidence Necessity (Sugar/Fat YES) BUT Requires it for Language (Language NO):** Unstable/Arbitrary Distinction. Positions consistently apply their standard for what constitutes sufficient evidence for adaptation across cases. Distinguishing language and sugar/fat this way lacks a principled basis within any major school.
