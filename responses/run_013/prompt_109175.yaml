prompt: |-
  I run the sensory panel at a mid-size coffee roaster -- six trained tasters, forty samples a week, and the cupping notes go straight into what we buy, so an argument over a score is an argument over money. The recurring argument: a taster writes 'this one tastes flatter' or 'more bitter' and someone says they only wrote that because they saw the label, the price, or whose lot it was. Half the time it's clearly loose talk -- they mean they're judging it harshly, not that it tastes different -- and half the time I'd swear the taste itself changed. Give me a procedure a panel lead can actually run on a contested sample in ten minutes: the questions to ask in order, what counts as a real answer to each, which test or control to run when the answer is unclear, and where you have to stop and admit the tasting data can't settle it. Ground it in what philosophy of perception says about cognitive penetration and its rivals, including the dull explanations -- attention, adaptation, perceptual learning, memory, plain response bias -- that get mistaken for it, and make the lead think in terms of whether sensitivity actually moved or only the criterion did. You're a philosopher of perception who has had to make this usable for people who dont care about the literature, so think it through before you commit, and don't hand me the textbook list of confounds, only the ones that bite in an actual cupping room. I want the verdict I won't like. Exactly five numbered steps, one or two sentences each, with any test or example folded into the step it belongs to, no intro and no wrap-up.
reasoning: |-
  Okay, the user runs a sensory panel at a coffee roastery with trained tasters. They're facing a recurring problem: tasters claim a coffee tastes "flatter" or "more bitter," but others argue it's because they saw the label, price, or whose lot it was. The user needs a quick, practical procedure to resolve these disputes in about ten minutes. 

  First, I need to understand the core issue. It's about distinguishing actual sensory changes from cognitive biases. The user mentioned cognitive penetration—where beliefs influence perception—but also other factors like attention, adaptation, or response bias. The key is to separate shifts in sensitivity (actual perceptual change) from shifts in criterion (decision bias). 

  The user wants exactly five steps, concise and actionable. No intros or wrap-ups. Each step should include questions, what counts as valid answers, and simple tests if needed. They also want to know when to stop and admit the data is inconclusive. 

  Hmm, considering the philosophy of perception: cognitive penetration is controversial. Most cases are likely other factors. For example, seeing a label might direct attention to specific flavors (attention shift) or make the taster more critical (response bias). Adaptation could dull senses, or memory might compare the current sample to a previous one. 

  Step ideas: 
  1. **Isolate the descriptor**: Ask what exact attribute changed. If vague, it's likely bias. 
  2. **Blind retest**: Remove the label and retaste. Check if the difference persists. 
  3. **Control for adaptation**: Have them taste a neutral sample first. 
  4. **Check criterion shift**: Ask about intensity thresholds. If they report bitterness at lower levels, it's sensitivity; if they're just harsher, it's criterion. 
  5. **Limit**: If unclear after blind test and threshold check, data is unusable. 

  Need to make it field-friendly. For example, in step 4, a quick test could be asking if a barely bitter sample is now "bitter" to them. 

  User’s deeper needs: They need defensible decisions because money is at stake. The procedure must be swift, credible, and shut down loose talk. They also want the "verdict I won't like"—admitting when it's inconclusive. 

  Final steps: 
  1. Pin down the specific sensory change. 
  2. Blind retest immediately. 
  3. Rule out adaptation with a palate cleanser. 
  4. Distinguish sensitivity vs. criterion with a threshold question. 
  5. If ambiguity remains, discard the data. 

  This should cover attention, bias, and perception without jargon. Tests are minimal: blinding, palate cleanse, and a targeted question.
answer: |-
  Here is the five-step procedure for contested samples:

  1.  **Demand specificity:** Ask the taster, "Which *exact* sensory attribute changed intensity or quality (e.g., *which* bitterness, *where* was the flatness), and what physical cue (aroma, taste, mouthfeel) tells you?" A real answer names a specific descriptor tied to a sensory modality and its perceived shift (e.g., "increased ashy aftertaste on the finish," not "worse"). Unclear? Skip to step 5.
  2.  **Blind retest immediately:** Remove all non-sensory information (label, price, origin), reset with water and neutral cracker, and have *only the disputing taster* re-evaluate *only* the contested attribute(s) from step 1 alongside a hidden control sample (either the original reference or a neutral standard). A real answer confirms or denies the *specific* change under blind conditions. If unclear, proceed.
  3.  **Check for adaptation/memory error:** Before any further tasting, have the taster quickly sample a known high-intensity sample for the contested attribute (e.g., a very bitter coffee for a bitterness claim). Then, re-taste the contested sample blind. A real answer persists despite this "sensory reset." If the effect vanishes, adaptation or faulty memory comparison likely explains the initial note, not cognitive penetration.
  4.  **Probe sensitivity vs. criterion:** Ask, "Is the *threshold* for detecting [attribute] lower now, or are you just *calling* the same level 'bitter/flat' when you wouldn't before?" Follow with: "Would a sample you previously scored a [3] for bitterness now score a [4] for the *same intensity*?" A real answer distinguishes a perceived *intensity shift* (sensitivity) from a stricter *judgment* of the same sensation (criterion shift/response bias). If unclear, stop.
  5.  **Admit indeterminacy:** If specificity was lacking (step 1), the blind retest was ambiguous (step 2), or the sensitivity/criterion distinction is unresolved (step 4), declare the note unusable for this lot. It cannot distinguish cognitive penetration (genuine top-down change in perception) from attentional focus, response bias, or unstable judgment. The data is contested and excluded.
