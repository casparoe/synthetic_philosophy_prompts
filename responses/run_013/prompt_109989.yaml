prompt: |-
  My friend's in law school and he's decided consent -- medical, sexual, whatever -- is basically just a contract, so everything contract law knows carries straight over: you need a meeting of the minds, capacity, no duress, and if you were deceived about anything material the whole thing's void. He uses this to argue that a patient never told about a rare side effect never really consented, and that being lied to about something you'd obviously care about turns sex into assault. I think he's onto something but overreaching. Audit the analogy for me: give me the correspondence first (what plays the role of offer, acceptance, consideration, breach, remedy), then where the mapping breaks -- consent's revocable, it's a permission rather than a promise, there's no damages remedy, nothing's negotiated -- and then whether his two conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them the whole time. One thing I want you to press hard on: contract law only treats silence as deception when there's a duty to disclose, and consent theory looks like it has the same hole (how material does the undisclosed thing have to be, and material to whom -- the reasonable patient or this particular one?), so does the analogy just relocate the problem instead of solving it? And if the contract picture is the wrong one, what should replace it?
reasoning: |-
  Okay, the user's friend is using contract law as an analogy for consent in medical and sexual contexts. The key points are that consent requires a meeting of the minds, capacity, no duress, and if deceived about anything material, it's void. The friend applies this to argue that not disclosing a rare side effect voids medical consent and that lying about something important turns sex into assault. The user thinks there's merit but overreach.

  First, I need to map contract elements to consent. Offer could be the proposal (treatment, sexual act), acceptance is agreement, consideration is the benefit exchanged. Breach would be violating terms, and remedy is voiding consent or legal consequences. 

  But where does it break? Consent is revocable anytime, unlike contracts which are binding. Consent is permission, not a promise to perform. No damages in consent contexts; criminal charges instead. Contracts involve negotiation, consent doesn't. Also, silence as deception: contract law requires a duty to disclose, similar to consent's materiality standard. Does this analogy solve the problem or just move it?

  The user's deeper concerns: They want to know if the contract analogy holds under scrutiny, especially regarding materiality and duty to disclose. Also, what's a better framework if contract law isn't suitable. They might be seeking a balanced view to discuss with their friend, ensuring ethical and legal accuracy without overreach.

  For medical consent, the reasonable patient standard is key. In sexual consent, deception about STIs or identity can invalidate consent, but materiality varies by jurisdiction. The analogy might oversimplify, especially in sexual assault cases where intent and harm differ from contractual breaches.

  Alternative frameworks: Tort law (informed consent), criminal law (assault definitions), or ethical permissions. Tort focuses on harm and duty, criminal on violation of autonomy, ethics on continuous communication. These might address the gaps better than contract law.

  Conclusions: Medical consent's materiality is covered by reasonable patient standard, so the analogy isn't necessary. Sexual consent is trickier; while deception matters, contract analogy might not fit due to different legal structures. The core issue is autonomy, not contractual terms. Overall, the analogy is useful but limited, and overreliance could misapply legal principles.
answer: |-
  Here's a detailed audit of the contract-consent analogy, breaking down the correspondence, disanalogies, impact on your friend's conclusions, and the core problem of materiality/disclosure, followed by alternative frameworks:

  ### 1. The Correspondence (Mapping Contract Elements to Consent)
  *   **Offer:** The proposal of a specific act (e.g., "I will perform surgery X," "Let's have sex using a condom," "I will administer Drug Y").
  *   **Acceptance:** The clear, unambiguous agreement to the proposed act ("Yes, perform surgery X," "Yes, let's have protected sex," "Yes, administer Drug Y"). This embodies the "meeting of the minds" on the *core action*.
  *   **Consideration:** The exchange of value/benefit. In medical: patient gets treatment, provider gets payment/fiduciary satisfaction. In sexual: mutual pleasure, intimacy, relationship building. This distinguishes consent from mere permission (e.g., letting someone borrow a pen).
  *   **Breach:** Violating the agreed-upon terms. Medical: Performing a different procedure, failing to disclose *material* risks. Sexual: Removing a condom ("stealthing"), lying about STI status, significant deception about identity/act. This is where "fraud in the inducement/factum" arguments arise.
  *   **Remedy:** **Voiding the "contract" (consent).** The primary remedy isn't damages, but declaring the act *non-consensual* due to the breach. Legal consequences follow: medical battery, sexual assault/battery.

  ### 2. Where the Mapping Breaks Down (Key Disanalogies)
  *   **Revocability:** Consent can be withdrawn *at any time*, instantly voiding permission. Contracts generally can't be unilaterally terminated without penalty (breach damages). Consent is fundamentally ongoing and conditional.
  *   **Permission vs. Promise:** Consent grants *permission* for an act *to be done to you*. It is not primarily a *promise* *to do* something yourself (though mutual acts involve reciprocal permissions). Contract law governs mutual *promises* of future performance.
  *   **Damages vs. Voidance:** The core remedy for flawed consent is negation of the consent itself, making the act wrongful (battery/assault). The harm is violation of bodily autonomy/integrity, not primarily economic loss. Contract law focuses on compensating for broken promises (expectation damages).
  *   **Negotiation & Specificity:** Contracts thrive on detailed negotiation and specificity of terms. Consent is often granted based on broader understandings and trust, not granular bargaining over every possible term. The "terms" are often implied by context and social norms (e.g., standard risks of a known medical procedure, implied monogamy in a relationship).
  *   **Fiduciary Duties & Power Imbalances:** Medical consent occurs within a strong fiduciary relationship where the provider *has an affirmative duty* to inform. Sexual contexts vary wildly, but inherent power imbalances (which contract law struggles with) are common. Contract law assumes more formal equality.
  *   **Public Policy & Criminal Law:** Consent doctrines, especially in sexual contexts, are heavily infused with public policy goals (protecting bodily autonomy, preventing violence) and often trigger *criminal* liability, unlike most contracts.

  ### 3. Assessing Your Friend's Conclusions with Disanalogies On the Table
  *   **Conclusion 1: Undisclosed Rare Side Effect Voids Medical Consent:**
      *   **Survives (Mostly):** The analogy *helps* frame the issue (lack of disclosure = lack of true agreement on the *actual* risk profile). However, **the analogy isn't carrying the weight.** This conclusion is firmly established in **medical ethics and tort law ("informed consent")** based on fiduciary duty and patient autonomy, not contract law. The "reasonable patient" standard (what would a typical patient consider material) or sometimes a "professional" standard (what do doctors typically disclose) resolves the materiality question *without needing the contract analogy*. The analogy just provides a familiar parallel.
  *   **Conclusion 2: Lying About Something Material Turns Sex Into Assault:**
      *   **Partially Survives, But Analogy is Overreaching/Carrying Too Much Weight:** Deception *can* vitiate consent, turning sex into assault. However:
          *   **Materiality Threshold is Higher & Contextual:** Not *any* deception voids consent. Contract law's "fraud in the inducement" (lying about collateral matters - e.g., "I'm rich") often doesn't void the contract, only allows damages. Similarly, lies about *collateral* facts in sex (e.g., "I love you," job status) generally don't rise to assault. **Fraud in the factum** (deception about the *nature of the act itself* - e.g., "This is a medical exam," impersonating a spouse) or deception about **fundamental aspects of identity/act** crucial to consent (e.g., STI status, contraception use, identity where identity is material) *can* vitiate consent. The contract analogy *suggests* this distinction but doesn't cleanly map the complex social and legal boundaries of what makes a sexual deception *material enough* to negate consent. Criminal law statutes and precedents define these boundaries, often requiring deception about the *nature* of the act or *identity*. The analogy risks implying *any* material deception suffices, which isn't universally accepted law.
          *   **Revocability is Key:** The core wrong is the violation of autonomy *at the time of the act*. The contract analogy's focus on the initial "agreement" downplays this ongoing nature and the right to stop.

  ### 4. Pressing Hard: The Silence/Materiality Problem - Relocation, Not Solution
  *   **You're Exactly Right.** The analogy brilliantly highlights the core issue (materiality and disclosure duties) but **fails to solve it**; it merely **relocates it** into familiar contract terminology.
      *   **Contract Law:** Silence isn't fraud *unless* a duty to disclose exists. Duty arises from: fiduciary relationships (doctor/patient!), active concealment, partial disclosure that's misleading, or knowledge of a basic/fundamental mistake by the other party. *Materiality* is judged by the *reasonable person* standard (would it change a reasonable person's decision?).
      *   **Consent Theory (Medical):** Directly adopts the fiduciary duty and the "reasonable patient" materiality standard. The contract analogy doesn't add new substance here; it mirrors established doctrine.
      *   **Consent Theory (Sexual):** **This is the murky zone.** There's generally *no* broad fiduciary duty between sexual partners. When does a duty to disclose arise? Courts grapple with this. Materiality is often judged by whether the deception went to the *nature of the act* or a *fundamental characteristic* (like STI status, fertility, contraception use). Some jurisdictions use a "reasonable person" standard, others might look more subjectively at whether *this specific victim* cared deeply (though this is less common due to fairness concerns). **The contract analogy doesn't resolve this ambiguity.** It asks the *same hard questions*: When is a sexual partner obligated to speak up? How important does the undisclosed fact have to be? Reasonable person or subjective standard? The analogy provides a *framework* for asking, but not the *answers*.

  ### 5. What Should Replace the Contract Analogy?
  The contract analogy is a useful pedagogical tool and highlights important parallels (agreement, vitiating factors), but it's incomplete. A better approach integrates multiple frameworks:

  1.  **Autonomy & Bodily Integrity (Foundational Principle):** Consent is fundamentally about respecting an individual's right to control what happens to their body. Any factor (deception, coercion, incapacity) that substantially interferes with the ability to make a free and informed choice about one's body violates this core principle. This is the bedrock.
  2.  **Tort Law (Especially Battery & Informed Consent):** Provides the primary civil remedy framework. Focuses on intentional, harmful, or offensive contact without permission. The "informed consent" doctrine within tort law specifically addresses the disclosure duties in medicine. It defines materiality and causation (would the reasonable patient have refused?).
  3.  **Criminal Law (Assault/Sexual Assault):** Defines the boundaries of criminal liability for non-consensual acts. Statutes and case law define what constitutes lack of consent, including specific types of deception or coercion that vitiate it. This is where the specific rules for sexual consent deception are evolving.
  4.  **Fiduciary Law (Medical Context):** Explicitly establishes the provider's *affirmative duty* to act in the patient's best interest, including the duty to disclose material information. This directly resolves the "silence" problem in medicine.
  5.  **Ethics of Communication & Care (Sexual Context):** While not strict legal doctrine, ethical frameworks emphasizing affirmative, ongoing, honest communication and mutual care provide the normative foundation for genuine sexual consent that the law aims (imperfectly) to protect. This addresses the "duty to disclose" gap by focusing on positive duties within relationships.

  **Conclusion:** Your friend is right that concepts like meeting of the minds, capacity, duress, and material deception are crucial to valid consent, and the contract analogy usefully illustrates this. **Where he overreaches is in claiming contract law carries over "straight" and provides definitive answers, especially regarding sexual consent and the duty to disclose/materiality problem.** The analogy highlights the core issue of agreement-under-what-terms but stumbles on revocability, the permission/promise distinction, the lack of damages focus, and the inherent power imbalances/contextual nature of consent. Crucially, **it doesn't solve the silence/materiality dilemma; it just restates it in contract terms.**

  The medical conclusion stands firmly on tort/fiduciary law, not needing the analogy. The sexual conclusion has merit *where deception vitiates the fundamental nature of the act*, but the analogy risks over-expanding it to less fundamental deceptions. **Consent is best understood primarily through the lens of autonomy and bodily integrity, with tort and criminal law providing the specific legal rules for when that autonomy is violated, supplemented by fiduciary duties in specific relationships like medicine.** The contract analogy is a helpful starting point, not the final word.
