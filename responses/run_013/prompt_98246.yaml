answer: |-
  Here's the tight case for your claim, followed by a direct engagement with the power objection:

  **The Case: Tolerance as Reciprocal Practice, Not Absolute Rule**

  1.  **Tolerance is fundamentally relational and reciprocal.** It's not a solitary rule ("never interfere") but a *social practice* predicated on mutual restraint: "I refrain from suppressing your disapproved-of conduct *because* you extend the same restraint to mine."
  2.  **This practice creates a bounded space.** It exists *only* among participants who implicitly or explicitly agree to this reciprocal exchange of restraint. It defines a community of mutual toleration.
  3.  **The intolerant explicitly reject the reciprocal core.** By principle or action, they declare: "I demand your restraint towards my views/actions, but I *will not* extend that same restraint to yours (and may actively seek to destroy them)."
  4.  **Rejection voids participation.** By refusing the fundamental reciprocity, the intolerant place themselves *outside* the practice. They are not *within* the circle demanding its benefits; they are attacking the circle's foundational principle from the *outside*.
  5.  **Therefore, withdrawing tolerance is not a paradox, but boundary enforcement.** Ceasing to tolerate the intolerant isn't an *exception* to a rule of universal non-interference within the practice. It's refusing to extend the *benefits* of the practice to those actively *rejecting and undermining its necessary conditions* (reciprocity). The practice doesn't "owe" its protective restraint to those dedicated to destroying the very possibility of that restraint for others. Withdrawing tolerance from the intolerant is the practice defending its own existence against external attack, not violating its internal logic.

  **Addressing the Power Objection: "Might Makes Right in a Nice Coat?"**

  The objection confuses the *necessary condition* for enforcing boundaries with the *justification* for those boundaries. Here's why:

  1.  **Reciprocity, Not Power, Defines the Boundary:** The criterion for exclusion isn't "who the powerful dislike," but the *objective refusal of reciprocity*. The intolerant self-identify by their rejection of the core bargain. We judge them by *their own declared principle and actions* against the practice's foundation, not by our subjective disapproval of their *views* alone. Power is needed to *enforce* the boundary, but the *reason* for the boundary stems from the logic of the practice itself.
  2.  **Contrast with Pure Modus Vivendi:**
      *   A pure modus vivendi ("way of life") is a truce based *solely* on contingent power balances ("We tolerate you *only* because we can't destroy you yet, and vice versa"). It lacks an inherent normative core beyond stability.
      *   The reciprocal practice *has* an inherent normative core: mutual respect through restraint. Exclusion is justified *because* the intolerant violate this core principle, making genuine coexistence *within the practice* impossible. It's about preserving the *substance* of tolerance (mutual respect), not just the *appearance* of peace contingent on power.
  3.  **Power as Tool, Not Justification:** Yes, enforcing the boundary requires power. But *every* social practice or rule requires power for enforcement (laws against theft, contracts). This doesn't reduce the practice *itself* to mere power politics. The *reason* we wield power against the intolerant is specific: to defend the reciprocal practice against those who would destroy it by exploiting its openness while rejecting its core. We act to *preserve* the space for mutual toleration, not simply to impose our will arbitrarily.
  4.  **The Intolerant's Own Logic:** If the intolerant gained power, they wouldn't establish a *reciprocal* practice of tolerance; they'd establish domination based on their ideology. Our refusal to tolerate them isn't symmetrical to their intolerance; it's a defense of the reciprocal space *against* their fundamentally anti-reciprocal project. We use power to *defend the possibility of tolerance*; they would use power to *eliminate it*.

  **In essence:** Framing tolerance as reciprocal practice shows the "paradox" arises from a category error – mistaking a bounded, conditional social agreement for an unbounded, unconditional moral rule. Withdrawing tolerance from the intolerant isn't hypocrisy or a special exception; it's recognizing they have placed themselves outside the agreement whose benefits they cynically demand while plotting its destruction. While power is necessary to defend this space, the *reason* for defense is rooted in the practice's own logic of reciprocity, preventing it from collapsing into the very modus vivendi the objection fears. The practice defines its boundaries based on its core principle; power merely polices them.
