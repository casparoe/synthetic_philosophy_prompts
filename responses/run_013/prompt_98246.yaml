prompt: |-
  I want you to argue for a claim I only half-believe: that the so-called paradox of tolerance isn't really a paradox — its an artifact of stating toleration as a rule ("never interfere with conduct you disapprove of") rather than as what it actually is, a reciprocal practice that exists only among people who extend to others the same restraint they demand for themselves. If that's right, then the intolerant aren't being carved out as a special exception when we stop tolerating them; they've just stepped outside the practice, and a practice doesn't owe anything to people who aren't party to it. Make that case as tightly as you can, and then take on the objection I actually care about: that this is just fancy dress for "whoever holds the power gets to define the practice," i.e. a modus vivendi with a nice coat on. No need to cite anyone or hand me a reading list, just give me the argument.
