prompt: |-
  I work in reinsurance and I keep running into the same line in our underwriting guidelines, and I dont think the people who wrote it know what it commits them to. We'll write earthquake cover on a fault that's been quiet for four hundred years, priced off a catalogue model, and nobody blinks. Pandemic, war, most cyber: excluded, every time, at every company I've talked to, even when our own numbers say the expected loss is smaller than the quake's. The guideline never says the risk is too likely; the wording is that we can't get comfortable with the distribution.

  What view of probability does that presuppose? I remember some psychology study where people pay good money to avoid a bet on an urn whose mix they don't know, even though they know the other urn is 50/50 and can work out that the unknown one is too. Is our exclusion doing that, or is it something more boring -- correlated losses, no diversification, a regulator who won't give us capital credit for it? Is there a real difference between not knowing the odds over outcomes you can list and not knowing what the outcomes even are, and is that the line we've actually drawn, or have we drawn it somewhere else and told ourselves that story? And if a decision theorist told me that refusing to price these is just a bias we should get over, what would have to change -- contracts, capital rules, who ends up holding the risk -- to fix it? Spell out the view we're committed to, what it quietly rules out, what it only happens to fit, and where its really just underdetermined.
reasoning: |-
  Okay, let me tackle this user's query. They work in reinsurance and are confused about why certain risks like pandemics or cyber are excluded even when the expected loss is lower than earthquake risks. The guideline mentions not being comfortable with the distribution. 

  First, I need to figure out the underlying view of probability here. The user mentions an urn experiment where people avoid unknown mixes. That's ambiguity aversion. But is that the only factor? They also ask about correlated losses, diversification, and regulations. So, multiple angles to consider.

  The user's main question is about the presupposed probability view. They want to know if it's ambiguity aversion or something else. They also wonder about the difference between unknown odds vs. unknown outcomes. And if it's a bias, what changes are needed to fix it.

  Breaking it down: traditional insurance uses frequentist probability—historical data for quakes allows modeling. But pandemics lack data, leading to Knightian uncertainty. Ambiguity aversion explains avoiding unknown distributions. But there's more: correlation. Pandemics affect everyone at once, causing massive losses. Diversification fails here. Also, capital requirements. Regulators might not recognize reserves for such risks, making them expensive to cover.

  The user mentions "not knowing the odds vs. not knowing outcomes." That distinction matters. Quakes have known outcomes but uncertain timing. Pandemics involve unknown outcomes (e.g., new viruses). The guidelines might conflate these, using ambiguity aversion as an excuse for deeper issues like correlation.

  The user's deeper needs: they suspect the exclusion isn't justifiable and want validation. They might be looking for arguments to challenge current practices. Or they seek ways to make insuring such risks feasible. Possible solutions: government backstops, industry pools, better models. But these require structural changes.

  Also, the user's identity as a reinsurance professional implies practical concerns. They need actionable insights, not just theory. So, linking theoretical models to real-world applications is key. Highlighting how ambiguity aversion intersects with regulatory and correlation issues makes the analysis useful.

  Finally, addressing if it's a bias: yes, but overcoming it needs systemic changes. Capital rules must adapt, contracts might require new structures, and governments need to share risk. Without these, reinsurers can't reasonably cover such risks.
answer: |-
  Your observation cuts to the heart of how reinsurance grapples with "deep uncertainty" and reveals an implicit philosophical stance on probability. The line "can't get comfortable with the distribution" isn't just bureaucratic jargon; it signals a commitment to a specific, often unarticulated, view of insurability grounded in **Epistemic Probability and Knightian Uncertainty**, amplified by practical constraints. Here's the breakdown:

  1.  **The Core Philosophical Stance: Epistemic Probability & Knightian Uncertainty**
      *   **Frequentist Comfort (Earthquake):** Pricing a 400-year quiet fault relies on *frequentist* probability. You have a long (geological) history, observable fault mechanics, and catalogued events globally. Even if rare, the *mechanism* is understood, parameters can be estimated (with uncertainty bounds), and the *distribution* of potential losses (severity/frequency) can be modeled (e.g., Gutenberg-Richter, GPD tails). You're estimating an imperfectly known but fundamentally *statistical* risk.
      *   **Epistemic Discomfort (Pandemic, Cyber, War):** Here, the uncertainty is fundamentally *epistemic* (about knowledge), shading into **Knightian Uncertainty** (risk vs. uncertainty distinction). The problem isn't just estimating parameters *within* a known model structure; it's:
          *   **Unknown Model Structure:** What *is* the true generative process? (e.g., How does a novel zoonotic virus emerge and spread? How will AI-driven cyber warfare evolve? What triggers a major geopolitical cascade?)
          *   **Deep Parameter Uncertainty:** Not just "mean +/- error," but potential for orders-of-magnitude misestimation or missing critical parameters entirely.
          *   **Non-Ergodicity:** Past data (even if available) is a poor guide because the underlying system (technology, geopolitics, virology) is rapidly evolving. Stationarity is assumed for quakes; it's ludicrous for cyber.
          *   **Unknown Unknowns (Outcomes):** This is key. For quakes, the *outcome space* is relatively defined (ground motion, location, building damage). For pandemic, it's "any novel pathogen with properties X,Y,Z causing global disruption". For cyber, it's "any vulnerability in exponentially complex, interconnected systems exploited by increasingly sophisticated actors". You can't even reliably list *all possible* catastrophic outcomes, let alone assign probabilities. Your "urn" is not just unknown mix; it might contain balls of entirely unknown colors and properties.

  2.  **The Urn Experiment Connection (Ambiguity Aversion)**
      Your recollection is spot-on (Ellsberg Paradox). People prefer known 50/50 risks over ambiguous ones, even when rational calculation suggests indifference. Reinsurers exhibit **extreme institutional ambiguity aversion.** This aversion is amplified because:
      *   **Correlated Losses & No Diversification:** Unlike quakes (geographically diversifiable), pandemics and cyber catastrophes are inherently systemic. A single event hits *all* insureds simultaneously, blowing through diversification. War is the ultimate correlation risk. This makes the *tail dependence* extreme and unmanageable within a traditional portfolio.
      *   **Capital & Regulator Reality:** Regulators (e.g., Solvency II, Bermuda Monetary Authority) demand capital based on modeled risk. If you cannot produce a *credible, accepted* model demonstrating capital adequacy for a 1-in-200-year pandemic loss, you get *zero capital credit* for the premium you charge. Holding capital against an undefined, unmodeled tail risk is prohibitively expensive and often impossible without explicit regulatory frameworks for such risks. This isn't just discomfort; it's a hard capital constraint.
      *   **Reinsurance of Reinsurance Failure:** Traditional reinsurance relies on retrocession and capital markets to spread the very largest losses. For risks where *everyone* is hit simultaneously (global pandemic, systemic cyber), this secondary market evaporates precisely when needed most.

  3.  **The Difference: Known Outcomes vs. Unknown Outcomes**
      This is the crucial line reinsurers *try* to draw, but it's messy:
      *   **Earthquake:** Known physical outcomes (ground shaking, liquefaction, tsunami) -> Known damage mechanisms -> Quantifiable financial loss distribution (with uncertainty). *Parameters* unknown, *outcomes* known and enumerable.
      *   **Pandemic:** Known *category* of outcome (infectious disease outbreak), but **unknown specific outcomes** (novel pathogen properties, transmission dynamics in modern society, medical countermeasure efficacy/speed, behavioral/policy responses, cascading economic/supply chain impacts). The *space of possible outcomes* is vast, dynamic, and poorly bounded.
      *   **The Line in Practice:** Reinsurers *aim* to exclude risks where the *outcome space is fundamentally undefined or non-enumerable*, or where the *causal model is too unstable or unknown*. However, the line is blurred:
          *   **"Happens to Fit":** Terrorism cover *is* sometimes written (with govt. backstops like TRIA), despite model uncertainty. Why? Outcomes *are* somewhat enumerable (bomb, CBRN, active shooter -> property/business interruption), and the risk has been *politically deemed* insurable. Climate change sits uneasily in the middle – complex dynamics, but outcomes (wind/flood/drought) are known and increasingly modeled.
          *   **"Quietly Ruled Out":** Truly novel, complex systemic risks with emergent properties and no historical analogs (e.g., certain AI catastrophe scenarios, nanotech risks) are implicitly ruled out by this stance, even if someone could propose a model.
          *   **Underdetermined:** Where does "new but modelable" risk end and "unknowable" risk begin? Cyber is the prime example. Insurers write *some* cyber (non-catastrophic SME risks), but exclude systemic cyber catastrophes. The line between "hack causing localized outage" and "cascading failure of cloud infrastructure/global payments" is where epistemic discomfort and correlation fears trigger exclusion.

  4.  **The Decision Theorist's Challenge & What Would Need to Change**
      A decision theorist (especially a proponent of subjective Bayesianism) might argue: "Assign *some* prior distribution, however diffuse. Update it as you learn. Charge a premium reflecting your uncertainty premium (ambiguity aversion surcharge). Not doing so *is* a bias."
      **To make this feasible, fundamental structural changes are required:**
      *   **Capital Rules:** Regulators need frameworks to recognize and allow capital for "deep uncertainty" risks. This could involve:
          *   **Government Backstops/Public-Private Partnerships:** Like NFIP (flood) or TRIA (terrorism). The state acts as the ultimate reinsurer for truly systemic, unmodelable tails (e.g., pandemic reinsurance schemes proposed post-COVID).
          *   **"Model-Free" Capital Buffers:** Allocating capital based on stress scenarios or simple exposure metrics (e.g., total payroll for pandemic BI) rather than probabilistic models, potentially with higher multipliers.
          *   **Contingent Capital:** Pre-arranged access to capital (e.g., catastrophe bonds, but for pandemic/cyber) triggered by specific event definitions.
      *   **Contract Design:**
          *   **Parametric Triggers:** Payout based on observable parameters (e.g., WHO declaring a PHEIC, verified cloud region outage duration) rather than indemnity. Reduces basis risk but eliminates the need to model individual losses.
          *   **Strict Limits & Co-Insurance:** Very low coverage limits, high deductibles, mandatory client co-insurance to ensure alignment and reduce moral hazard.
          *   **Time-Limited Coverage / Renewability:** Short terms allowing rapid repricing as knowledge evolves.
          *   **Explicit Ambiguity Loads:** Building a large margin directly into the premium reflecting the "discomfort".
      *   **Risk Holder Shifting:**
          *   **Capital Markets:** Developing deeper markets for Insurance-Linked Securities (ILS) specifically tailored to these risks (e.g., pandemic bonds, cyber cat bonds). Requires defining clear, objective triggers.
          *   **Government as Ultimate Risk Bearer:** Acknowledging that some risks (global war, extreme pandemics) are beyond private capacity and require sovereign backing or international risk pools.

  **What the View Commits To, Rules Out, and Where it's Fuzzy:**

  *   **Committed To:** A view that insurability requires a *sufficiently stable and knowable causal model* leading to a *reasonably estimable distribution of financial losses*. It prioritizes avoiding ruin from unquantifiable, undiversifiable tail risks over potential profit from "uncertain" risks. It tacitly accepts that some societal risks cannot be managed by private insurance mechanisms alone.
  *   **Quietly Rules Out:** Covering risks characterized by extreme model uncertainty, non-stationarity, catastrophic correlation, and fundamentally unknown outcome spaces using traditional indemnity insurance and probabilistic pricing models. It rules out being the societal shock absorber for all systemic catastrophes.
  *   **Happens to Fit:** Risks with long historical records, physical constraints, and geographically diversifiable losses (Quake, Windstorm, to some extent Flood). Also fits risks deemed politically essential with government support (Terrorism).
  *   **Underdetermined:** Precisely *how much* uncertainty is too much? What level of model sophistication or data availability crosses the threshold? How to handle emerging risks where the "known unknowns" gradually become "known"? How to balance the aversion with societal demand for coverage? The guideline provides a justification ("discomfort") but no objective metric.

  **Conclusion:** Your guideline reflects a pragmatic, financially conservative stance grounded in **Knightian Uncertainty and extreme ambiguity aversion**, massively amplified by the **systemic nature/correlation** of the excluded risks and the **current structure of capital regulation**. It's not *just* psychology, nor is it *just* capital rules; it's the confluence. A decision theorist arguing it's "just a bias" underestimates the real-world constraints of diversification failure and regulatory capital. To "get over it" requires transforming the *entire risk financing ecosystem* for systemic catastrophes, moving beyond traditional reinsurance models towards structures involving governments, capital markets, parametric triggers, and explicit societal risk-sharing agreements. The line drawn is fundamentally between risks where the *distribution is contestable but estimable* and risks where the *distribution is potentially unknowable or implies undiversifiable ruin*.
