  The user emphasizes that they're not interested in metaphysics for its own sake but a practical way to evaluate disposition claims. They mentioned specific problems like the glass with a stiffening network, the board that becomes fragile after sun exposure, and the stampeding crowd. These cases suggest the need for a theory that handles intrinsic vs. extrinsic factors, multi-level dispositions, and collective agency.

  I recall that standard issues in disposition theory involve conditional analyses failing due to finks and masks. The user's cases add complexity: the integrated network questions intrinsic properties, the board's disposition to acquire another disposition touches on time and triggers, and the collective behavior challenges reductionism. 

  For each desideratum, I need to link it to a specific case and explain why it's non-negotiable. For instance, the Intrinsicness Requirement is forced by the stiffening network case because if the network is part of the object, its fragility should depend on internal structure, not external interventions. 

  The user also wants to know if any requirements conflict. The Intrinsicness and Extrinsic Trigger requirements might clash in cases like the crowd's disposition, which is intrinsic to the group but relies on extrinsic triggers like rumor spreading. This tension suggests that some theories might prioritize one over the other, leading to different viable accounts.

  I should structure the desiderata clearly, connecting each to the relevant case. The non-negotiable ones like Specificity and Intrinsicness are critical for avoiding counterexamples. Meanwhile, requirements like Minimal Metaphysics might be more flexible depending on one's philosophical stance.

  Finally, assessing major theories: Humean reductionism fails finks and masks; categorical basis theories struggle with multiple realizability; dispositional essentialism handles intrinsics but might overcommit metaphysically. The user's crowd example pushes against reductionism, favoring a pluralist approach that allows collective dispositions without individual reduction.
answer: |-
  Here is a carefully specified list of desiderata for a theory of dispositions, derived from your cases and core philosophical challenges. Each requirement is justified by a specific case demonstrating why failure renders the theory *unacceptable* (not merely unfashionable) for adjudicating disposition claims in ordinary and strange scenarios. Non-negotiable requirements are marked **(NN)**.

  ### Desiderata for an Adequate Theory of Dispositions

  1.  **Specificity Requirement (NN):** The theory must provide conditions for a *specific* disposition (fragility, solubility, flammability) to be instantiated, not just a generic "disposed to manifest M in C".  
      *   **Why?** Your firecracker-rigged glass breaks when struck but isn't *fragile*. A theory must distinguish breaking due to fragility from breaking due to other mechanisms (like explosives). A generic "disposed to break when struck" lumps them together, failing ordinary usage.  
      *   **Forced By:** Firecracker Rigged Glass (Antidote Case).

  2.  **Intrinsicness Requirement (NN):** The theory must ground the disposition primarily in the *intrinsic* properties of the object at the time of attribution.  
      *   **Why?** Your stiffening network glass has the same internal atomic structure as fragile glass. If the network is an *intrinsic* part of the object (woven in), its fragility seems blocked by its own structure, not an external wrapper (like foam). A theory failing this would struggle to distinguish an object's *own* disposition from its current environment or external protectors.  
      *   **Forced By:** Stiffening Network Glass (Intrinsic Mask/Fink? Case).

  3.  **Finkishness Immunity (NN):** The theory must allow an object to possess a disposition D even if a process (a "fink") would *prevent* the manifestation of D precisely when the triggering condition C occurs, without altering the intrinsic basis of D *prior* to C.  
      *   **Why?** The guardian angel glass is fragile. The angel's intervention *only* happens upon striking (C), preventing breakage (M). Crucially, the glass's intrinsic properties *prior to and independently of being struck* are those of fragility. A theory failing this wrongly concludes the glass wasn't fragile pre-strike.  
      *   **Forced By:** Guardian Angel Glass (Fink Case).

  4.  **Masking Compatibility (NN):** The theory must allow an object to possess a disposition D even if, when the triggering condition C occurs, some independent factor (a "mask") *interferes* with the manifestation M, without altering the intrinsic basis of D.  
      *   **Why?** The foam-swaddled glass is struck (C) but doesn't break (M) due to the foam. The foam doesn't change the glass's intrinsic fragility; it absorbs the impact. A theory failing this confuses the *possession* of the disposition with its *manifestation being unimpeded*.  
      *   **Forced By:** Foam-Swaddled Glass (Mask Case).

  5.  **Antidote Detection (NN):** The theory must distinguish between an object manifesting D in response to C and an object undergoing M coincidentally with C due to an "antidote" process exploiting C.  
      *   **Why?** The firecracker-rigged glass breaks (M) when struck (C), but this is caused by the explosion triggered by the strike, not by the glass's brittleness responding to the impact. A theory must recognize that M happening *because of* an antidote process exploiting C is different from M happening *because* the object is disposed to manifest M in C.  
      *   **Forced By:** Firecracker Rigged Glass (Antidote Case).

  6.  **Multi-Level Disposition Accommodation:** The theory must provide a coherent account of dispositions to *acquire* dispositions ("second-order dispositions") and their relationship to the first-order dispositions they yield.  
      *   **Why?** The board disposed to *become* fragile if left in the sun involves a distinct disposition (susceptibility to drying/cracking) from the fragility it would acquire. A theory must explain how these relate without collapsing them or making the higher-order disposition mysterious. Is "disposed to become fragile" just a complex first-order disposition itself?  
      *   **Forced By:** Sun-Drying Board (Second-Order Disposition Case).

  7.  **Collective Disposition Compatibility:** The theory must allow for the possibility of genuine dispositions possessed by collectives (like crowds, ecosystems, machines) that are not reducible to (or solely explainable by) dispositions of their individual parts *alone*.  
      *   **Why?** The stampeding crowd's disposition arises from the complex *interactions* and *responses* of individuals to each other and the rumor, not from any individual's disposition to stampede upon hearing the rumor *in isolation*. A theory must allow such emergent collective dispositions without requiring reduction to individual part-dispositions.  
      *   **Forced By:** Stampeding Crowd (Collective Disposition Case).

  8.  **Extrinsic Trigger Recognition:** The theory must acknowledge that while the *disposition* is intrinsic, the *triggering condition* (C) can be extrinsic and complex, involving relations to the environment or other objects.  
      *   **Why?** Solubility is triggered by immersion in water (extrinsic). Flammability requires an ignition source (extrinsic). The crowd's stampeding is triggered by a rumor spreading (an extrinsic, relational event). A theory failing this cannot capture the relational nature of the "in circumstances C" clause.  
      *   **Forced By:** All dispositional attributions (Solubility, Flammability, Stampeding Crowd).

  9.  **Minimal Metaphysics Requirement:** The theory should not posit more metaphysical structure (e.g., irreducible powers, necessary connections, fundamental modality) than is strictly necessary to satisfy the other desiderata, especially 1-5 (NN).  
      *   **Why?** You care about *evaluating claims*, not metaphysics for its own sake. An overly metaphysically loaded theory (e.g., strong Dispositional Essentialism) may satisfy the cases but at a cost of commitment you find unnecessary or unjustified. This requirement pushes for the *most parsimonious* viable theory.  
      *   **Forced By:** Your stated goal: "not after a metaphysics for its own sake; I want an account good enough that I can tell... whether a disposition claim is true."

  ### Key Observations

  *   **Most Damaging Requirement:** **Finkishness Immunity (Requirement 3)** is the primary killer of simple **Conditional (Counterfactual) Analyses** ("X is fragile iff if it were struck, it would break"). Finks show the counterfactual can be false while the disposition is true. This requirement also severely challenges attempts to reduce dispositions to *current* categorical bases alone without modal depth.
  *   **Potential Conflict:** **Intrinsicness (2)** and **Collective Disposition Compatibility (7)** create tension. The crowd's disposition seems real but arguably *not* intrinsic to the crowd considered as a mereological sum – it depends on the *organization* and *relational properties* of the members and their environment. **Extrinsic Trigger Recognition (8)** is necessary but may not be sufficient. This suggests a genuine dilemma: either relax strict intrinsicness for complex objects/collectives (risking loss of objectivity) or deny genuine collective dispositions (risking counterintuitiveness). *This conflict is a core point of legitimate theoretical disagreement.*
  *   **Another Tension:** **Specificity (1)** and **Multi-Level Accommodation (6)** can pull apart. Is the board's "disposed to become fragile" a *sui generis* second-order disposition, or just the complex first-order disposition "disposed to dry and crack in the sun"? Different theories may categorize this differently without clear violation, highlighting a potential ambiguity in dispositional concepts.

  ### Brief Scorecard of Major Theories

  1.  **Simple Conditional Analysis (Humean Reductionism):** Fails Requirements 3 (Finks), 4 (Masks), and 5 (Antidotes) decisively. Also struggles with 1 (Specificity) and 2 (Intrinsicness). **Inadequate.**
  2.  **Categorical Basis View ("Disposition = Physical Basis"):** Struggles with Requirements 3 (Finks - basis unchanged pre-C, disposition still present), 4 (Masks - basis present, manifestation blocked), 6 (Multi-Level - basis of higher-order disposition?), and 7 (Collectives - what's the single basis?). Can satisfy 1 & 2 if basis is intrinsic and type-specific. **Partially Adequate?** (Requires supplementing the basis with modal/modal-like properties).
  3.  **Sophisticated Conditional Analysis (e.g., incorporating "normal conditions"):** Difficult to specify "normal conditions" non-circularly and robustly enough to handle all finks, masks, and antidotes (Req 3,4,5). May struggle with 1 (Specificity) and 2 (Intrinsicness). **Often seen as unstable.**
  4.  **Dispositional Essentialism (Irreducible Powers):** Satisfies Requirements 1-5 (NN) and 6-8 well by taking dispositions as fundamental, intrinsic causal powers. Easily handles finks/masks (power present but interfered with) and collectives (emergent powers). **Strongest contender** on the cases, but fails Requirement 9 (Minimal Metaphysics) by positing irreducible modality/powers, which some find ontologically extravagant.
  5.  **Producing Cause/Causal Process Views:** Focuses on the *process* leading to M. Can handle Requirement 5 (Antidotes - explosion isn't fragility's manifestation process) and potentially 3/4 (if finks/masks disrupt the *process*). May struggle with Requirement 2 (Intrinsicness - is the process power intrinsic?) and Requirement 7 (Collectives). **Promising but needs development.**
  6.  **Pluralist/Contextualist Views:** May accept different kinds of dispositions (intrinsic object, collective, functional role). Can handle Requirement 7 (Collectives) and potentially relax Requirement 2 (Intrinsicness) for collectives. Risk violating Requirement 1 (Specificity) or Requirement 9 (Minimal Metaphysics) if overly disunified. **Viable if carefully constrained.**

  This list provides the framework you need. The tensions, especially between Intrinsicness and Collective Dispositions, and the demands of Finkishness Immunity, reveal why the debate persists: different theories prioritize different desiderata. A theory satisfying all NN requirements (1-5) and offering plausible accounts for 6-8, while being minimally metaphysical (9), is the goal – Dispositional Essentialism comes closest but pays a metaphysical price. Use this list to test any proposal your friend offers.
