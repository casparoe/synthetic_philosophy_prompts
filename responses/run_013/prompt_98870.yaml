answer: |-
  Below is a complete design for your 90-minute social epistemology game focused on Condorcet's jury theorem (CJT) and its nuances. The game uses no-cost materials, emphasizes experiential learning, and structures rounds to sequentially reveal the "miracle," the "mirror image," and the fragility of independence. The debrief maps outcomes directly to CJT assumptions.

  ---

  ### **Game Design: "The Jury Room"**
  **Materials Needed:** 
  - 64 blank index cards (or scrap paper cut into quarters) 
  - 4 envelopes (labeled A, B, C, D) 
  - Whiteboard/flip chart to track results 
  - Coin for flipping  
  - Timer  

  **Token Economy:**  
  - Players earn 1 token per vote if their jury’s majority is correct.  
  - Tokens are tracked publicly (no physical payout; used for stakes).  
  - *Why tokens?* They incentivize sincere voting and simulate "competence" (players want to be right).

  ---

  ### **Setup (5 min)**  
  1. **Assign Groups:** Split 16 players into 4 fixed juries of 4 (Jury 1–4).  
  2. **Explain Rules:**  
     - Each round has a hidden "truth" (A or B), determined by coin flip (A=heads, B=tails).  
     - Players receive a private **signal** (card saying A or B) about the truth.  
     - Signal accuracy = probability `p` (announced per round).  
     - Players vote sincerely based *only* on their signal.  
  3. **Emphasize:** "No talking during voting rounds. Deliberation only in Round 4."

  ---

  ### **Rounds & Parameters (70 min total)**  
  **Round 1: Small Jury, High Competence** (15 min)  
  - `p = 0.6` (individual competence >0.5)  
  - `n = 4` (each jury votes independently)  
  - **Steps:**  
    1. Flip coin for truth (e.g., A).  
    2. Privately give each player a signal card: 60% match truth (A), 40% wrong (B).  
    3. Juries vote silently (write "A" or "B" on cards).  
    4. Tally majority vote for each jury. Record results:  
       - "Jury 1: Correct? [✓] Wrong? [✗] (Truth: A)"  
    5. **Reveal truth.** Award tokens to juries with correct majority.  
  - *Expected Outcome:* 2–3 juries correct (≈48% chance/jury). Players see small juries *sometimes* err.  

  **Round 2: Large Jury, High Competence** (10 min)  
  - `p = 0.6` (same competence)  
  - `n = 16` (all players vote as one jury)  
  - **Steps:**  
    1. New truth (e.g., B).  
    2. Distribute signals (60% correct).  
    3. All vote silently. Tally majority.  
    4. **Reveal truth.** Award tokens if correct.  
  - *Expected Outcome:* Majority correct (≈97% chance). Players feel the "miracle" – more voters boost accuracy "for free."  

  **Round 3: Small Jury, Low Competence** (15 min)  
  - `p = 0.4` (competence <0.5)  
  - `n = 4` (juries vote independently)  
  - **Steps:**  
    1. New truth (e.g., A).  
    2. Signals: 40% correct, 60% wrong.  
    3. Vote and tally per jury.  
    4. **Reveal truth.** Award tokens for correct majorities.  
  - *Expected Outcome:* 0–1 juries correct (≈82% chance/jury to be *wrong*). Players see small juries are *reliably wrong*.  

  **Round 4: Large Jury with Deliberation (Dependence)** (30 min)  
  - `p = 0.6` (high competence)  
  - `n = 16` (all vote as one jury)  
  - **Steps:**  
    1. New truth (e.g., B).  
    2. Distribute signals (60% correct).  
    3. **Deliberation Phase (10 min):**  
       - Juries meet separately. Instruct: "Discuss for 5 min. Persuade others. Then vote."  
       - *Key:* Players see others’ signals, creating error correlation.  
    4. Vote and tally majority. **Reveal truth.** Award tokens if correct.  
    5. **Critical Twist:** Before revealing, ask: "How confident is the majority?" (Hand vote).  
  - *Expected Outcome:* High confidence but likely wrong (≈30–50% error chance). Players feel the "trap" of correlated errors.  

  ---

  ### **Debrief (15 min)**  
  Map outcomes to CJT assumptions. Use whiteboard:  

  | **Round** | **What Happened** | **CJT Assumption** | **Effect When Broken** |
  |-----------|-------------------|---------------------|------------------------|
  | 1–2       | More voters → better accuracy | Homogeneous competence >0.5 | "Miracle" works: aggregation amplifies small individual edge. |
  | 3         | More voters → *worse* accuracy | Competence must be >0.5 | If competence <0.5, majority becomes *reliably wrong* with size. |
  | 4         | Deliberation → errors spread | Independence | Correlation caps accuracy (e.g., 4 groups of 4 agreeing = only 4 independent votes). Group can be worse than silent voters. |

  **Key Insights to Elicit:**  
  - "In Round 2, why did adding voters help?" → *Assumption: Competence >0.5 + Independence.*  
  - "In Round 3, why did the crowd get *more* confidently wrong?" → *Mirror image: Competence <0.5 flips CJT.*  
  - "In Round 4, why did talking hurt even with smart people?" → *Dependence correlates errors; kills the "averaging out" benefit.*  
  - **Shared Cause (bonus):** "What if all signals relied on a single flawed source (e.g., biased news)?" → *Errors become perfectly correlated → accuracy capped at 60% (p) no matter how many voters.*  

  ---

  ### **Predictable Pitfalls & Recovery**  
  1. **Round 2 Fails (Large Jury Wrong):**  
     - Probability ≈3% (with `p=0.6`, `n=16`).  
     - **Recovery:** "This is why CJT is probabilistic! We need infinite voters for *guaranteed* accuracy. But note: 97% success beats 48% in Round 1."  

  2. **Round 4 Succeeds (Deliberation Correct):**  
     - Likely if initial signals are lopsided.  
     - **Recovery:** Focus on *correlation*: "Count how many in your group voted identically after talking. Errors spread, making wrong outcomes *more likely* than under independence. One biased influencer could doom everyone."  

  3. **Math Anxiety:**  
     - **Recovery:** Use plain language ("60% chance of a correct signal"). Debrief with conceptual labels (e.g., "independence = no peer influence").  

  ---

  ### **What the Game Can’t Fake**  
  1. **Large-N Convergence:** With only 16 players, you can’t show the *limit* (n→∞ → 100% accuracy). **Verbal Bridge:** "CJT says with infinite voters, failure becomes impossible if `p>0.5`."  
  2. **Genuine Independence:** Players may still infer truth from tokens/votes. **Mitigation:** Stress "vote only on your signal" and use secret ballots.  
  3. **Precision of p:** Real competence is never perfectly homogeneous. **Verbal Bridge:** "Heterogeneous competence weakens but doesn’t kill CJT if average `p>0.5`."  

  ---

  ### **90-Minute Timeline**  
  - **0:00–0:05** Setup  
  - **0:05–0:20** Round 1  
  - **0:20–0:30** Round 2  
  - **0:30–0:45** Round 3  
  - **0:45–1:15** Round 4 (incl. 10 min deliberation)  
  - **1:15–1:30** Debrief  

  This design ensures students *feel* CJT’s insights, exposes hidden assumptions, and uses zero budget. The payoff is in the "aha!" moments when the rules – not you – convict the theorem of fragility.
