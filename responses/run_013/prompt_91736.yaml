prompt: |-
  I am a high-school student at work on an extended essay, and I have reached the point where I need to stop collecting proposed solutions and decide what a solution would even have to do. The puzzle is this: what makes it the case that a person is following one rule rather than another? I can follow the skeptical argument well enough — every finite record of what someone has said and done is compatible with indefinitely many rules that agree on the record and diverge beyond it — and I do not want a proposed answer yet. I want the specification first: the desiderata that any adequate account of rule-following, of what fixes the correct application of a rule, must satisfy.

  For each requirement, give me the case or consideration that motivates it, and mark it as non-negotiable or as the commitment of one particular camp; part of what I am asking is which of the things people demand of an account in this area are genuine requirements and which are the prejudices of a single tradition. I would like to know whether any two of the requirements cannot be jointly satisfied, since I suspect that is where the real result lies, and I would like your judgement as to which single requirement excludes the most otherwise attractive accounts.

  I have three cases I want the account tested against, and I would rather have them used as tests than merely described:

  - A woman keeps a private notebook in a notation of her own invention and returns to it years later; nothing in the notebook settles what she meant by a given mark, though she remembers having felt that her use of it was perfectly definite. Does an adequate account have to say that there was a fact of the matter about what she meant?

  - A small computer program, trained on a finite list of worked arithmetic examples, produces correct answers for inputs it has never seen. Does the account of rule-following apply to it? If it does not, the account must say precisely what the program lacks; if it does, the requirement that correctness depends on a community looks too strong, or else the training data must be counted as the community.

  - The academic-integrity policy at my school was written before anyone had heard of large language models, and my classmates and I are now arguing about whether using one to draft an essay falls under it. Is the correct application of the rule fixed by the practice that existed when it was written, or by the practice that has grown up around it since?

  I am not asking for citations or a reading list; if you wish to illustrate a requirement by naming a family of answers, a sentence will do. Finally, if the list turns out to be jointly unsatisfiable, tell me which requirement you would surrender, what that costs, and whether what remains is still recognisably an account of meaning anything by a rule.
reasoning: |-
  Okay, let me tackle this high-school student's query about rule-following desiderata. The student is working on an extended essay and needs a clear framework for evaluating solutions, not the solutions themselves. They present a philosophical puzzle inspired by Kripke's Wittgenstein: how can we determine which rule someone is following when any finite behavior could fit multiple rules? 

  First, I need to identify the core challenge. The student understands the skeptical argument – infinite rule possibilities from finite evidence – and wants criteria to judge any account of rule-following. They also provide three concrete test cases: private language, AI behavior, and evolving institutional rules. 

  The key is to distill universal requirements versus partisan demands. I recall Wittgenstein's private language argument and Kripke's skepticism, plus responses like dispositionalism or semantic realism. The student explicitly wants conflicts between desiderata highlighted, especially which one "kills" the most theories. 

  For desiderata, I consider:
  - Determinacy (must rules have single correct answers?)
  - Accessibility (how users grasp rules)
  - Normativity (right/wrong applications)
  - Non-circularity (no sneaking in meaning)
  - Scope (applies to machines/isolated cases?)

  The test cases are perfect stress tests:
  1. Private notebook: forces confrontation with solitary rule-following
  2. AI program: challenges anthropocentrism 
  3. School policy: probes temporal vs communal fixation

  I notice tensions immediately. Determinacy clashes with accessibility if rules transcend evidence. Normativity seems unattainable without communities, but that excludes private cases. Scope demands machine inclusion, risking anthropomorphism. 

  The biggest tradeoff emerges: either sacrifice solitary determinacy (making private rules indeterminate) or accept mysterious "meaning facts" beyond behavior. I'd surrender solitary determinacy as the cost of naturalism, preserving normativity via communities. This still handles AI via training data as "community" and institutional rules via practice.

  The student's suspicion about unsatisfiable requirements is spot-on – this is where philosophy lives. By mapping the battlefield clearly, they can position their essay at the collision point of these demands.
answer: |-
  Below is a structured specification of desiderata for any adequate account of rule-following, distilled from philosophical debates (especially Wittgenstein, Kripke, and their critics). Each requirement is motivated by a core problem or intuition, classified as **non-negotiable** (NN) or **tradition-bound** (TB), and tested against your cases. Conflicts are flagged, and a key exclusionary requirement is identified.  

  ---

  ### **Desiderata for an Account of Rule-Following**  
  1. **Determinacy of Meaning** (NN)  
     - **Motivation**: Rules must objectively constrain future applications (e.g., "+2" excludes "3,5,7..." from being correct after "2,4,6"). Rejects radical skepticism where *no* fact fixes correctness.  
     - **Test Cases**:  
       - *Notebook*: Must explain whether her past use had *any* definite meaning, even if forgotten.  
       - *AI Program*: Must say whether its outputs are *correct* or incorrect relative to a rule.  
       - *School Policy*: Must determine if "using LLMs" objectively violates the original rule.  
     - **Conflict**: Clashes with *Anti-Metaphysicality* (if determinacy requires inaccessible facts).  

  2. **Normativity** (NN)  
     - **Motivation**: Rules prescribe how one *ought* to act; mistakes are possible. Not mere description of behavior (e.g., feeling "definite" isn’t enough—you can misremember a rule).  
     - **Test Cases**:  
       - *Notebook*: Her feeling of definiteness doesn’t guarantee correctness upon reuse.  
       - *AI Program*: Its outputs aren’t "right" by accident; correctness depends on alignment with a norm.  
       - *School Policy*: The rule must bind future acts, not just describe past intentions.  

  3. **Accessibility** (NN)  
     - **Motivation**: Users must grasp rules without omniscience (e.g., you don’t need to check infinitely many cases to understand "+2"). Rejects "magical" meaning-facts.  
     - **Test Cases**:  
       - *Notebook*: She must have been able to know the rule *without* future interpretations.  
       - *AI Program*: Training data must suffice for the program to "grasp" the rule.  
       - *School Policy*: Students must discern the rule’s applications without reading drafters’ minds.  

  4. **Anti-Metaphysicality** (TB: Kripkean Skeptical Tradition)  
     - **Motivation**: No "platonic" facts beyond use/practice. Meaning is grounded in observable phenomena.  
     - **Test Cases**:  
       - *Notebook*: Rejects private mental states as meaning-fixers.  
       - *AI Program*: Favors behavioral/training-based accounts.  
       - *School Policy*: Meaning fixed by *actual* institutional practice, not abstract intent.  
     - **Conflict**: Tensions with *Determinacy* (if practice is ambiguous) and *Solitary Compliance* (if community is essential).  

  5. **Solitary Compliance** (TB: Individualist Tradition)  
     - **Motivation**: Isolated agents can follow rules (e.g., Robinson Crusoe counts stones correctly). Rejects community necessity.  
     - **Test Cases**:  
       - *Notebook*: Requires her past self to fix meaning alone.  
       - *AI Program*: Must allow solo machines to follow rules.  
       - *School Policy*: Original drafters’ solitary intent could fix meaning.  

  6. **Temporal Robustness** (NN)  
     - **Motivation**: Rules apply to unforeseen cases (e.g., "+2" governs numbers not yet invented).  
     - **Test Cases**:  
       - *Notebook*: Her rule must cover new entries years later.  
       - *AI Program*: Generalization to novel inputs is rule-following.  
       - *School Policy*: Must apply to technologies unknown when written.  

  7. **Non-Circularity** (NN)  
     - **Motivation**: Rule-fixing facts can’t presuppose meaning (e.g., "I meant *addition*" can’t rely on already understanding "addition").  
     - **Test Cases**:  
       - *Notebook*: Her memory can’t appeal to *reinterpreted* marks.  
       - *AI Program*: Training data must fix rules without assuming prior semantic knowledge.  

  ---

  ### **Key Conflicts & Trade-offs**  
  - **Unsatisfiable Pair**: *Determinacy* + *Anti-Metaphysicality* + *Accessibility*.  
    - If meaning is fixed non-metaphysically (e.g., by practice) and accessibly, determinacy collapses when practice underdetermines rules (e.g., *Notebook* case).  
    - **Example**: Kripke’s skeptic argues no accessible fact (behavior, mental states) fixes one rule over deviant alternatives (e.g., "quus" vs. "plus").  

  - **The Exclusionary Requirement**: **Anti-Metaphysicality**  
    - **Excludes**: Semantic realism (e.g., Frege: rules exist abstractly), robust individualism (e.g., Locke: private intent fixes meaning), and some dispositional theories (if dispositions are "hidden").  
    - **Why**: Demands meaning be grounded *only* in public practices, rejecting private facts or platonic norms.  

  ---

  ### **Tests Against Your Cases**  
  | **Case**               | **Determinacy** | **Normativity** | **Accessibility** | **Anti-Metaphysicality** | **Solitary Compliance** |  
  |------------------------|-----------------|-----------------|-------------------|--------------------------|------------------------|  
  | **Private Notebook**   | Must have a fact of the matter (NN). | Feeling ≠ correctness (NN). | Must be knowable solo (TB). | Rejects private meaning (TB). | Allows solo meaning-fixing (TB). |  
  | **AI Program**         | Outputs are correct/incorrect (NN). | Correctness isn’t accidental (NN). | Data must suffice for "grasp" (NN). | Acceptable if training ≈ community practice. | *Fails* if community essential; *passes* if machines can follow rules solo. |  
  | **School Policy**      | Rule objectively applies (NN). | Binds novel cases (NN). | Discernible without drafters (NN). | Meaning fixed by evolving practice. | Meaning fixed by original intent. |  

  ---

  ### **Resolution Proposal: What to Surrender?**  
  - **Surrender: Solitary Compliance** (individuals can’t fix rules alone).  
    - **Cost**: Rejects the *Private Notebook* having determinate meaning and may exclude *AI Programs* as genuine rule-followers (if no community).  
    - **What Remains**: A **communitarian account** (e.g., Wittgenstein: rules require social practices).  
      - *Notebook*: No fact of the matter—meaning lapses without communal reinforcement.  
      - *AI Program*: Rule-following only if embedded in human practices (training as "community stand-in").  
      - *School Policy*: Meaning evolves with practice (LLM use is governed by *current* interpretations).  
    - **Is It Still Rule-Following?** Yes: rules are norms sustained by collective correction. This satisfies Determinacy (via practice), Normativity (community sanctions errors), Accessibility (public criteria), and Temporal Robustness (practices adapt).  

  ---

  ### **Conclusion**  
  The core tension is between **Determinacy** (rules *must* have objective correctness) and **Anti-Metaphysicality** (no "spooky" meaning-facts). **Anti-Metaphysicality** excludes the most accounts, forcing a choice: accept communal practice (sacrificing solitary rule-following) or embrace non-natural facts (sacrificing accessibility). Your cases reveal that *private rules* and *AI* strain communitarianism, while *evolving policies* strain originalism. A viable account must either:  
  1. **Ground determinacy in practice** (sacrificing solitary compliance), or  
  2. **Accept modest metaphysics** (e.g., causal-inferential roles) to preserve individualism.  

  This specification shows why rule-following remains contested: no account satisfies all intuitions without theoretical costs. The "real result" is that **meaning is neither fully in the head nor fully in the world**—it emerges from interactions constrained by norms we inherit and reshape.
