  The officemate's conclusion is that expected value maximization can't be rational because it forces you to bankrupt yourself for a gamble that often fails badly. The user's main concerns are: first, that step (3) to (4) might be fishy—jumping from preferring the lottery to any finite sure thing to being willing to pay any finite cost; and second, that if this argument works, it seems to destroy all expected utility theory, which feels too strong for a reductio.

  I need to figure out where the flaw is. I recall the St. Petersburg paradox, which is similar but usually involves money. The standard solution uses diminishing marginal utility of money, but here that's ruled out since rescues have constant marginal value. So that won't work.

  Let me think about the premises. Premise (1) says a rational agent maximizes expected value. Premise (2) says the expected value is infinite. Step (3) says infinite value trumps any finite amount, so you should prefer it over any finite sure rescues and pay any finite fee. Step (4) takes it further: pay everything you have or can borrow. Step (5) points out that with 50% chance, you get only 2 rescues and have made things worse by paying the cost. Step (6) says this can't be rational, so (1) must be false.

  The user suspects steps (3) or (4). I think the problem might be in step (3), specifically the part about paying any finite fee. When you pay a cost, it's not just about the rescues from the lottery; it's about net value. The cost reduces the net benefit. For example, if you pay C rescues' worth to play, then in the branch where you get only 2 rescues, your net is 2 - C, which could be negative. The expected value calculation needs to account for this cost across all possible outcomes.

  The expected value of the lottery itself is infinite, but when you pay a fee, you're looking at the expected net value: E[net] = E[rescues from lottery] - C. Since E[rescues] is infinite, subtracting a finite C still leaves it infinite. So mathematically, E[net] is still infinite for any finite C. That seems to support step (3).

  But here's a twist: in decision theory, we usually assume that the value function is bounded or satisfies certain axioms to avoid such paradoxes. The St. Petersburg paradox highlights that unbounded utility functions lead to problems. For rescues with constant marginal value, the utility is linear and unbounded, which causes the infinite expectation. So perhaps the issue is that expected value maximization requires bounded utility to be well-behaved.

  The user mentioned that if this argument kills expected utility for any good without diminishing returns, it might refute the whole apparatus. But expected utility theory can handle this by imposing constraints, like requiring utility to be bounded. That's a common solution—saying that rationality includes having a bounded utility function, so you can't construct such lotteries in practice.

  Another angle: step (4) says "willing to pay any finite fee," but in reality, paying a cost might involve giving up resources that could be used for other rescues. The argument assumes that everything can be converted linearly to rescues, but if there are other values or constraints, it might not be so simple. However, the setup stipulates that rescues are the only good with constant marginal value, so perhaps that's not the issue here.

  Perhaps the problem is with how we handle infinite expectations. In probability theory, infinite expected values don't behave like finite ones. For instance, you can't necessarily compare them straightforwardly. Also, in the long run, if you could play many times, it might average out, but here it's a single play.

  The user's second concern is that this seems to prove too much. If it refutes expected utility entirely, but expected utility is widely used, there must be a flaw. So I need to find where the reasoning breaks down without dismissing expected utility wholesale.

  I think the key is in step (3): "should be willing to pay any finite fee." Willingness to pay depends on the net position. But as I thought earlier, E[net] is still infinite. However, consider the risk: with high probability (50%), you end up with only 2 - C rescues, which could be very negative if C is large. A risk-averse agent wouldn't accept that, but expected value maximization ignores risk when utility is linear. So for a risk-neutral agent with linear utility, it should be rational to pay any finite C.

  But step (5) points out that this leads to terrible outcomes half the time. So the objection is practical: a rational rule shouldn't recommend actions that likely make things worse. Expected value maximization does so here because of the infinite tail, but the probability of high payoffs is vanishingly small.

  For example, the chance of getting more than 2 rescues is 50% (since half the time first flip is heads? Wait no: P(first heads on n=1) is 50%, giving 2 rescues; P(n=2) is 25%, giving 4; and so on. So P(only 2 rescues) is 50%, P(more) is 50%, but the expected value is infinite because of the small chances of huge payoffs.

  In decision theory, one response is that no real agent would offer such a lottery or that resources are finite, but the argument is theoretical. The deeper issue might be that expected value isn't defined properly for unbounded utilities or that rationality requires considering the distribution, not just the expectation.

  I recall that in axiomatic decision theory, the von Neumann-Morgenstern axioms imply that utility must be bounded if such lotteries are to be handled consistently. So perhaps the flaw is in assuming that expected value maximization applies to unbounded utility functions. By requiring bounded utility, we avoid the paradox without giving up expected utility for realistic cases.

  So for the user, I should say that the problem is with premise (1): expected value maximization as stated isn't coherent for unbounded utilities, so rational agents must have bounded utility functions or use a modified decision rule. This preserves expected utility for bounded cases.
answer: |-
  Your officemate's argument is a sharpened variant of the St. Petersburg paradox, targeting cases without diminishing marginal utility. It feels troubling because it exploits a genuine vulnerability in unbounded expected value maximization. The flaw isn't in steps (3) or (4) per se—they follow logically from (1) and (2)—but in how (1) interacts with the structure of the lottery when utility is linear and unbounded. Here's a step-by-step breakdown of where the argument fails and why, along with the costs of rejection.

  ### The Core Problem: Premise (1) in Unbounded Contexts
  Premise (1)—"A rational agent maximizes expected value"—is the culprit, but not because it's universally false. Instead, it *presupposes* that the expected value is well-defined and action-guiding. In this lottery, with linear utility for rescues, the expected value *is* infinite (premise (2) is correct), but infinity isn't a number you can rationally maximize over in the way finite values are. It's a limit concept, and treating it as a comparable quantity leads to incoherence. Specifically:

  - **Infinity isn't additive in a practical sense**: Step (3) claims that infinite value "exceeds any finite amount," which is mathematically true. Step (4) then says you should pay any finite cost *C* to play, since ∞ − *C* = ∞. But this ignores that the *net outcome* in each branch must be evaluated *after* subtracting *C*. In branches where the payoff is low (e.g., 2 rescues), your net outcome is *2 − C*, which is disastrous if *C* is large (e.g., if *C* represents "all resources," you might have *negative* net rescues after opportunity costs). Expected value maximization dismisses this risk because the tiny-probability, huge-payoff branches dominate the calculation. But rationality shouldn't require you to ignore guaranteed ruin in likely scenarios for the sake of impossible-to-actualize mathematical abstractions.

  - **The problem isn't the fee—it's the mismatch between expectation and real choices**: Steps (3)–(4) seem sneaky because they conflate *ordinal* preferences (lottery > finite sure thing) with *cardinal* sacrifices (paying *C*). But with linear utility, this conflation is valid *if the expectation is finite*. When it's infinite, the theory demands you sacrifice everything, but this is a pathology of unboundedness, not a rational imperative. Rational choice requires *feasible* trade-offs, and infinity obliterates trade-offs. You can't "pay" infinity or "receive" it; it's a placeholder for divergence.

  ### Why Your Second Bother is Spot-On
  You're right that this argument, if airtight, would nuke all expected utility theory (EUT). But it doesn't, because EUT isn't defined for unbounded utilities in the first place. The von Neumann-Morgenstern (VNM) axioms—which underpin EUT—implicitly require bounded utility to avoid exactly this paradox. In VNM, if preferences satisfy consistency axioms, utility must be bounded; otherwise, St. Petersburg-like lotteries force incoherence. So the argument *exposes* a boundary condition: EUT is only well-behaved when utility is bounded. Rejecting premise (1) for unbounded goods isn't a flaw in EUT—it's a refinement. Diminishing marginal utility for money isn't a patch; it's an instance of bounding utility. For rescues, if utility were bounded (e.g., if there's a maximum number of rescues possible or moral urgency saturates), the paradox vanishes.

  ### Where to Reject and What It Costs
  - **Reject premise (1) as stated**: **Maximizing expected value is not rational when utility is unbounded.** This preserves EUT for realistic cases (where utility is effectively bounded) but concedes that no unified rule covers all imaginable lotteries.  
    - *Why it looks fine until pushed*: We intuitively apply expected value to finite gambles, and infinity feels like "just a bigger number." But infinity isn't part of the real number system; it breaks the Archimedean property (no finite trade-offs).  
    - *Cost*: You lose the dream of a single, universal criterion for rational choice under risk. You must add a caveat: "Maximize expected utility *when utility is bounded*." For most applied work (e.g., policy decisions with finite stakes), this changes nothing. For cosmology-scale ethics? It gets messy.

  - **Alternative: Reject the setup's realism (minor tweak)**. If "rescues" require real-world resources, the lottery isn't feasible—you can't deliver 2^100 rescues. Expected value assumes the prize is as described, but if the prize is impossible, the expectation is miscomputed.  
    - *Cost*: Feels evasive; the paradox is conceptual, not practical.

  ### Why Not Reject Other Steps?
  - **Step (2)**: Correct. With linear utility, the expectation diverges.  
  - **Steps (3)–(4)**: Valid *given (1) and (2)*, but they reveal why (1) fails.  
  - **Steps (5)–(6)**: Correct empirical observations—the rule *does* demand irrational sacrifices.  
  - **Step (7)**: Overreaching. Expected utility isn't "dead"; it's domain-restricted.

  ### Least Costly Bullet to Bite
  Rejecting premise (1) for unbounded utilities has minimal cost. In practice:  
  - For money, diminishing utility bounds effective utility.  
  - For rescues, physical/logistical constraints bound outcomes.  
  - Theologically? If an agent cares about literal infinities (e.g., saving immortal souls), decision theory may need new axioms. But that's edge-case philosophy, not a core failure.  

  This preserves EUT's power in 99% of cases while acknowledging that rationality isn't defined for every mathematical curiosity. Your gut is right—the argument proves too much because it exploits an inconsistency in the *unrestricted* version of expected value maximization, not in the entire apparatus. The real lesson is that rationality requires boundedness for coherence. If your officemate insists otherwise, ask: "Would you stake the survival of humanity on this coin flip?" If they hesitate, they've conceded the point.
