prompt: |-
  I'm a science-and-ideas reporter at a mid-sized daily, and for the last three years I've sat on the selection committee for the Wexler Prize, which our foundation gives annually for what the bylaws call 'an act of moral courage in science journalism.' We've got a nominee who has split the committee 4–3, and I have to circulate a written opinion before Friday's vote. The nominee, a reporter I'll call Dana, broke a story that a prominent nutrition lab had been quietly dropping outliers from its datasets before publishing. The story was solid: the lab retracted two papers, a funder changed its rules, and a bunch of other outlets followed up. But the backstory is messy. Dana started digging after the lab's director beat her out for a job she badly wanted, and she told a colleague she wanted to 'take him down.' She sat on a key spreadsheet for three months to time the story to her book proposal, and one source says she promised more anonymity than she actually delivered. One of her central sources was a postdoc the lab director had fired, and Dana knew that going in.

  Half the committee says the prize is for the act, not the person: the retraction happened, the field is cleaner, and if we start policing motives we'll never award anyone, since motives are usually mixed. The other half says that's exactly the point of calling it moral courage — a useful act done for spite or career gain isn't moral courage, it's just aggression that happened to land well, and the award should mean something. Our bylaws don't define moral courage or say whether motive counts. I'm supposed to write the opinion that recommends a concrete course of action — award, no award, or award with a public statement — and gives reasons the losing side can actually respond to, not just a restatement of the bylaws. A friend who teaches ethics keeps telling me there's a difference between doing the right thing and doing it for the right reasons, and that the distinction is a mess, which is not helping.

  Could you draft that memo? Please take a position on whether moral worth depends on acting for the right reasons, or whether the committee should care about that at all, and apply it to Dana's case. I'd like the bottom line up front and a time frame for the vote. Also, be honest about the strongest point on the losing side — don't strawman either the act-not-person view or the motive-matters view. And tell me what would change your mind: what fact about Dana, or about the prize's purpose, would flip your recommendation, and where is your reasoning most likely to fail? I'm not looking for a literature review or citations, just an opinion I can circulate. I should say I'm not on either faction's side yet; I keep going back and forth alot.
reasoning: |-
  Okay, the user is a science reporter on a committee for the Wexler Prize, which honors moral courage in science journalism. They're split on a nominee, Dana, whose story exposed misconduct but had questionable motives and methods. The user needs a memo recommending whether to award Dana, considering if moral courage requires pure motives or if the outcome matters more. 

  Hmm, this is messy. The user's stuck between two valid perspectives: one side says the impact (retractions, reform) is what counts, while the other argues Dana's spiteful intent and tactical delays undermine the "moral" part. The ethics friend’s point about "right thing vs. right reasons" is central here. 

  First, let’s unpack "moral courage." It’s not just bravery—it’s risking something for ethical principles. If Dana was motivated by revenge, does that void the principle? But policing motives is slippery; journalists often have mixed incentives. The spreadsheet delay is particularly damning—holding evidence to time a book proposal suggests careerism over urgency. 

  The strongest pro-Dana argument: the outcome improved science. Does motive matter if the result is net positive? The strongest against: the award’s name implies virtue, and Dana’s actions (anonymity breach, weaponizing a fired postdoc) smell opportunistic. 

  What would change my mind? If Dana knew the lab’s fraud was harming patients and still delayed, that’s indefensible. Or if the prize’s history shows past winners had pure motives. Conversely, if the bylaws explicitly ignore intent, that’d shift things. 

  My recommendation: no award. Not because motives must be pristine, but because Dana’s actions—delaying truth for personal gain, potentially burning a source—cross lines that "moral courage" shouldn’t endorse. But I’ll stress the committee could reasonably disagree. 

  User’s tension is relatable; this isn’t black-and-white. They need clarity, not academia. The memo should be decisive but acknowledge gray areas.
answer: |-
  **MEMORANDUM**  
  **TO:** Wexler Prize Selection Committee  
  **FROM:** [Your Name], Science & Ideas Reporter  
  **DATE:** [Today’s Date]  
  **SUBJECT:** Recommendation on Dana’s Nomination for the Wexler Prize  
  **DEADLINE:** Vote by Friday, [Date]  

  ---

  ### **BOTTOM LINE UP FRONT (BLUF)**  
  **Recommendation:** Do **not** award Dana the Wexler Prize.  
  **Reason:** Moral courage requires alignment of act *and* intent. Dana’s actions—driven by personal vendetta, tactical delay for career gain, and ethical shortcuts—undermine the "moral" dimension of courage, even if the outcome was beneficial.  
  **Alternative:** If the committee awards Dana, attach a **public statement** contextualizing the outcome’s value while acknowledging ethical concerns.  

  ---

  ### **CORE ARGUMENT: WHY MOTIVE MATTERS FOR MORAL COURAGE**  
  The Wexler Prize honors "moral courage in science journalism." Moral courage is not merely *effective* action but action rooted in **ethical commitment**, taken despite risk, and motivated by a duty to truth or public good. Here’s why Dana’s case falls short:  

  1. **Intent Undermines Moral Character**:  
     - Dana’s admission of wanting to "take down" the lab director (after losing a job to him) frames her investigation as **personal retaliation**, not principled truth-seeking.  
     - **Strongest counterargument (act-not-person view):** Outcomes matter more. Motives are often murky; punishing Dana because she had a grudge ignores that *every* whistleblower story risks mixed motives (e.g., ambition, rivalry). The retractions and reforms are real victories.  
     - **Rebuttal:** Moral courage requires *rising above* self-interest. Dana’s spite is not a "murkiness" but a documented driver. An award for moral courage should not incentivize vengeance-as-strategy.  

  2. **Tactical Delay Erodes Public Trust**:  
     - Sitting on a key spreadsheet for 3 months to time a book proposal **prioritized personal gain over scientific integrity**. Had the lab’s flawed research harmed public health, this delay could have had consequences.  
     - **Strongest counterargument:** All journalists strategize publication timing (e.g., maximizing impact). The outcome was net positive, so the delay is irrelevant.  
     - **Rebuttal:** Moral courage often involves *immediate risk-taking* (e.g., exposing danger despite backlash). Dana’s delay was explicitly self-serving, not tactical for public good.  

  3. **Source Ethics Cast Doubt on Integrity**:  
     - Using a recently fired postdoc as a key source (while aware of their bias/conflict) and allegedly misleading another source on anonymity **exploits vulnerable individuals** for the story. This violates journalistic ethics.  
     - **Strongest counterargument:** All sources have biases; journalists use them if facts check out. The story was verified independently post-publication.  
     - **Rebuttal:** Moral courage demands *ethical means*, not just valid ends. Sacrificing source trust for leverage contradicts the "courageous" ethos of protecting truth-tellers.  

  ---

  ### **WHY "ACT NOT PERSON" IS INSUFFICIENT HERE**  
  The committee’s pro-Dana faction rightly argues that policing motives sets a dangerous precedent. But the Wexler Prize is not a "Impact in Science Journalism" award—it specifies *moral courage*. Moral courage inherently blends action, intent, and virtue:  
  - **Analogy:** A citizen who saves a child from a fire to win a medal is brave but not *morally courageous*. Courage becomes "moral" when rooted in selfless intent.  
  - **Prize Precedent:** If we award Dana, we risk diluting "moral courage" into "high-impact journalism," regardless of ethical compromise.  

  ---

  ### **WHAT WOULD CHANGE MY MIND?**  
  1. **New Fact About Dana**: Evidence that she:  
     - Attempted to address her conflict of interest (e.g., disclosing it to editors),  
     - Advocated for the fired postdoc’s protection/reputation,  
     - Had proof the delay prevented source endangerment.  
  2. **Prize’s Purpose**: If historical precedent shows the Wexler Prize has *always* ignored motive (e.g., past winners with known vendettas).  
  3. **Risk Assessment**: Proof Dana faced exceptional personal/professional peril (beyond book sales) by publishing immediately.  

  **Where My Reasoning Is Most Vulnerable**:  
  - **Over-idealization of motives:** If "pure" intent is unrealistic, withholding awards from effective acts could chill vital journalism.  
  - **Conflation of ethics and outcome:** Dana’s story *did* improve science. Rejecting her might signal that outcomes matter less than personal virtue, which is not the committee’s role.  

  ---

  ### **RECOMMENDED COURSE OF ACTION**  
  1. **Do not award** Dana the Wexler Prize this cycle.  
  2. **Issue guidance** for future committees: The Wexler Prize should require nominees to demonstrate that their work:  
     - Served the public interest *as a primary motive*,  
     - Minimized unnecessary harm to sources,  
     - Addressed conflicts of interest transparently.  
  3. **Acknowledge the outcome**: In internal deliberations, note that Dana’s reporting achieved significant good—but the Prize’s specific criteria were not fully met.  

  **Vote Timeline**: Final vote by **5:00 PM Friday** to allow 24 hours for deliberation on this memo.  

  ---  
  **Respectfully submitted,  
  [Your Name]**  

  *This memo reflects a position grounded in the definition of moral courage as virtue + action. I recognize the committee may weigh outcomes more heavily, but if "moral" is in the award’s name, we cannot ignore its ethical core.*
