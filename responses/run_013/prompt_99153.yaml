prompt: |-
  I am a platform-integrity engineer with a background in threat modeling and a little mechanism design; my philosophical training is mostly what I have picked up from a reading group, so I know just enough to get into trouble. We have been discussing Daniel Dennett's argument about AI and counterfeit people — as I understand it, the claim is not simply that chatbots deceive us, but that systems which can pass as human are counterfeit persons, that their proliferation erodes an unearned background assumption that the voice or face on the other end is a real person, and that the remedy is closer to marking or prohibiting counterfeit currency than to asking individuals to detect fakes case by case. I want to know whether that argument is really about the kinds of things my discipline models, so please act as a translator — imagine you are a philosopher of mind who has also spent time in platform integrity — between philosophy of mind and security engineering. In my own notes I have been calling the asset at stake ambient authenticity, the default trust that an encountered interlocutor is a person, and treating it as a common-pool resource whose depletion rate rises with the ratio of undetectable fakes to authentic interactions. I want to know whether Dennett's argument can be restated as a claim about the marginal social cost of one more undetectable fake, or whether that formulation loses something essential. If my rough summary is itself a distortion, say so before you begin the translation.

  Restate Dennett's position as faithfully as you can in my vocabulary: assets and trust boundaries; authentication, attestation, and provenance; Sybil resistance and proof-of-personhood; adversarial generation and detection asymmetry; revocation, rate limiting, and liability; negative externalities and common-pool resources; mechanism design and incentive compatibility. Be explicit about where you are paraphrasing rather than carrying over his own claims, and do not cite sources or give me a reading list — I cannot search, and I am after the conceptual translation, not the bibliography. I am fluent enough in threat modeling and mechanism design that you should not water down the engineering, but I am weak on phenomenology, so flag any place where the translation is doing philosophical work I might not notice.

  Then give me the residue report, which is the part I care about most. Which parts of Dennett's view map cleanly onto a security or mechanism-design problem? Which survive only as metaphor, or require assumptions my frameworks do not license — for example, if the harm is a wrong done to the concept of a person, or damage to the possibility of genuine interpersonal trust, does that reduce to a familiar externality, or is it something my vocabulary cannot express? Which parts of my vocabulary have no counterpart in his argument — do Sybil attacks and counterfeit people differ in a way that matters, because a Sybil attacker wants to influence a system, whereas a counterfeit person may not be adversarial in the same sense? Finally, tell me whether the residue is a defect of my framework, a sign that Dennett's claim is doing moral or phenomenological work that engineering cannot capture, or evidence that the claim is less precise than it looks. Think carefully and step by step; start with a short brainstorm of candidate translations and likely fault lines before you commit, and prefer an honest translation with a clear list of what does not survive to a tidy analogy that smuggles in my assumptions.
