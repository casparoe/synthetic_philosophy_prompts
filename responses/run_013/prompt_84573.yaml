prompt: |-
  Hey — I'm a fourth-year PhD student in philosophy of science (I'm half in the econ dept, which is where this is coming from) and I've been handed the job of writing the take-home essay for the final of the grad seminar I'm TAing, "Models, Idealization, and the Limits of Realism." The prof wants exactly one question, 30 marks, something a strong student can write in about 90 minutes. Her one hard rule is that it can't be answerable by the canned version of Friedman's F-twist — you know the one: assumptions don't have to be realistic, only predictions matter, Samuelson coined the name, Musgrave untwisted it, the end. She says if she reads that essay again she'll retire early.

  So I want the question built around a specific argument that they actually have to wrestle with instead of summarizing. Here's the passage I've drafted — it's a made-up visiting speaker's claim that I want them to react to:

  "A visiting speaker at our workshop last month made the following claim, which I've cleaned up: 'The F-twist has been misread for seventy years. It isn't a claim about assumptions at all; it's a claim about robustness. What actually does the work in the billiard-player and falling-leaf examples is that the prediction survives the falsity of the assumption — swap the omniscient billiard player for a mediocre one, or the leaf for a slightly different plant, and the aggregate outcome barely budges. So "unrealistic assumption" is just shorthand for "assumption you can distort or drop without changing the result," and the F-twist amounts to: a model's conclusions are trustworthy to the extent that they're insensitive to its own falsehoods. Notice what this does. It makes Friedman uninteresting exactly where he thought he was being bold — nobody ever doubted that some idealizations are harmless — and it commits him to something he denied, namely that the interesting question about a model is why the result holds, i.e. an explanatory question rather than a predictive one.'"

  Could you write me three things: (1) the exam question itself, phrased so that reciting the standard taxonomy of "unrealistic assumptions" (negligibility, domain, heuristic, etc.) earns a bare pass at best and nothing more, because the question makes them do something with it; (2) a model answer of roughly 700–800 words, written the way a very good student would write it under time pressure, not the way a published paper reads; and (3) a marking scheme, 30 marks total, that names the specific moves a top answer has to make, gives the marks for each (and tells me seperately how many go to the "where does the visitor go wrong" part versus the "case study" part), and then lists 3 or 4 specific misconceptions that should cap a script at a B no matter how well written it is.

  A few things I want the question to force out of them, so fold these in somewhere without turning the question into a checklist:
  - the ambiguity in "unrealistic" — approximately true vs. literally false vs. abstract vs. not even about the target system
  - whether the F-twist, read charitably, is a claim about theory choice or about the logic of model-based inference
  - the case where two incompatible models with different false assumptions predict equally well: does the F-twist have anything to say about which to use, or is that where the predictive-accuracy test goes quiet?
  - at least one concrete science case, and I'd rather it not be the frictionless-plane / perfect-competition duo everyone reaches for — maybe optimal foraging theory or Hardy-Weinberg, something where the idealizations are load-bearing in a different way. I'll let them pick, but tell them in the question that the case has to do real work and not just get name-checked.

  One more thing: the visitor's argument is supposed to be slightly wrong in an interesting way, so the model answer has to say precisely where it breaks down rather than just agreeing or disagreeing. If you think it goes wrong somewhere other than where I think it does, fine — just make the model answer commit to a reading. And please don't let the question ask for citations or a reading list; it's closed-book and they've got no internet.
