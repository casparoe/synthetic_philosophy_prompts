prompt: |-
  I'm a science-and-ideas reporter and Ive somehow ended up giving the after-dinner speech at a small workshop on money and metaphysics in a few weeks -- 40 people, half economists, half philosophers, plus a table of spouses who are mainly there for the wine. I want the whole thing built out of something I got obsessed with last year: Berkeley, yes the idealist bishop, wrote a run of numbered questions in the 1730s about why Ireland was broke, and one of them asks whether the true idea of money isn't altogether that of a "ticket or counter" -- he thinks money is only useful insofar as it stirs up industry, that labour and goods are the actual wealth of a nation, and that a bank's paper is only ever as good as the trust under it. I want that idea doing real work rather than decorating the speech: it should never talk about money as a thing with value stored inside it, and it should land on credit as a form of trust rather than as financial engineering. Warm, funny enough for the spouses, and not embarrassing in front of the economists. No citations or reading lists, and please don't put any quotes in the speech itself -- I can't check them and neither can anyone in the room. Anyways, give it to me as exactly five numbered beats, each a sentence or two, no intro and no wind-up.
