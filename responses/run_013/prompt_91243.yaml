  | (b)  | might work       | 90        | Identical source ensures symmetric execution and mutual cooperation. | Determinism; no hidden state or environmental variance. | no          |
  | (c)  | doesn't work     | 0         | Only Nash equilibrium is (D, D); no cooperative fixed point exists. | (C, C) is a stable equilibrium (false in PD).          | no          |
