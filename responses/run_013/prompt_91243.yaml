  **Robustness Against a Self-Interested Defector**  
  Items (a), (b), (d), and (f) avoid exploitation when the other agent defects: (a) and (d) fail to prove mutual imitation and defect; (b) detects non-identical code and defects; (f) yields a payoff of 0 (safe, as S ≤ 0 ≤ P). Item (e) is vulnerable, as it cooperates (expecting joint optimization) and gets the sucker’s payoff (S). Items (c) and (g) fail to achieve cooperation even with a copy. However, only (b) and (f) are highly reliable without complex assumptions—though (f) relies on an external referee.
