  ### Analysis of Proposed Cooperation Mechanisms in One-Shot Prisoner's Dilemma  
  Agents can read each other's source code, but there is no repeat play, communication, or external enforcement (except where noted). The goal is mutual cooperation (C, C) when both agents use the same mechanism, and robustness against a self-interested defector (which always defects and ignores the agent's code).

