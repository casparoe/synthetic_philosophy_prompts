  Here's a decision tree for translating form-dependent poetry, designed to help translators navigate philosophical positions without presupposing their camp. The tree prioritizes the **role of formal constraints** as the top split, addresses both sonic and non-sonic constraints, and includes explicit notes on empty branches, equivalent verdicts, and specimen outcomes.

  ### Decision Tree: Translating Form-Dependent Poetry
  **Key Questions** (answer based on source poem analysis, not pre-existing bias):  
  1. **Is the formal constraint semantically meaningful?**  
     - *Meaningful*: Constraint directly contributes to content/themes (e.g., lipogram symbolizing absence).  
     - *Decorative*: Constraint is ornamental or culturally conventional (e.g., sonnet rhyme without thematic ties).  

  2. **If meaningful: Can the constraint function identically in the target language?**  
     - *Identical function*: Constraint works the same way linguistically/culturally (e.g., acrostic name spelled identically).  
     - *Divergent function*: Constraint can't work as-is (e.g., lipogram on "e" in a language without "e").  

  3. **If decorative: Is the constraint culturally iconic?**  
     - *Iconic*: Form is widely recognized in source culture (e.g., haiku in Japanese).  
     - *Non-iconic*: Form is obscure or arbitrary.  

  4. **If iconic: Is reproduction feasible without catastrophic loss?**  
     - *Feasible*: Can replicate constraint with acceptable compromises.  
     - *Unfeasible*: Cannot replicate without destroying the poem.  

  5. **If meaningful but not reproducible: Can the constraint be adapted?**  
     - *Adaptable*: Target-language equivalent exists (e.g., replacing "e" lipogram with common target-language letter).  
     - *Inadaptable*: No meaningful substitute.  

  6. **If decorative/unreproducible: Is source-culture "strangeness" a priority?**  
     - *Priority*: Reader should feel the poem's foreignness.  
     - *Non-priority*: Fluency/target-culture naturalness is goal.  

  7. **If prioritizing fluency: What dominates the poem's value?**  
     - *Content*: Ideas/narrative are central.  
     - *Aesthetic effect*: Emotional/artistic experience is central.  

  8. **If aesthetic effect: Can it be recreated without the constraint?**  
     - *Recreatable*: Target-language techniques achieve similar effect.  
     - *Irrecreatable*: Constraint is irreplaceable for the effect.  

  ---

  **Leaves (Positions)**:  
  1. **Literal crib with commentary** (A): Gloss translation + notes explaining constraints.  
  2. **Content-first paraphrase** (B): Meaning preserved; form abandoned.  
  3. **Constraint-first** (C): Form preserved; meaning sacrificed if needed.  
  4. **Dynamic equivalence** (D): Effect on reader preserved; form adapted flexibly.  
  5. **Transcreation** (E): New poem inspired by source; standalone art.  
  6. **Foreignizing** (F): Source's "strangeness" preserved (e.g., calques, unnatural syntax).  
  7. **Adaptation** (H): Constraint replaced with target-culture equivalent.  
  8. **Untranslatable** (G): Not translated (or translated with caveats).  

  *Note: "Keep the source’s strangeness" is merged into **Foreignizing (F)**, and transcreation covers "make a new poem."*  

  ---

  ### Tree Structure
  ```mermaid
  graph TD
      Q1[1. Is the formal constraint semantically meaningful?]
      Q1 -->|Meaningful| Q2
      Q1 -->|Decorative| Q3

      Q2[2. Can the constraint function identically in the target language?]
      Q2 -->|Yes| C["C: Constraint-first"]
      Q2 -->|No| Q5

      Q3[3. Is the constraint culturally iconic?]
      Q3 -->|Yes| Q4
      Q3 -->|No| Q6

      Q4[4. Is reproduction feasible without catastrophic loss?]
      Q4 -->|Yes| C
      Q4 -->|No| Q6

      Q5[5. Can the constraint be adapted?]
      Q5 -->|Yes| H["H: Adaptation"]
      Q5 -->|No| A["A: Literal crib with commentary"]

      Q6[6. Is source-culture 'strangeness' a priority?]
      Q6 -->|Yes| F["F: Foreignizing"]
      Q6 -->|No| Q7

      Q7[7. What dominates the poem's value?]
      Q7 -->|Content| B["B: Content-first paraphrase"]
      Q7 -->|Aesthetic effect| Q8

      Q8[8. Can aesthetic effect be recreated without the constraint?]
      Q8 -->|Yes| D["D: Dynamic equivalence"]
      Q8 -->|No| E["E: Transcreation"]
  ```

  ---

  ### Critical Notes
  - **Empty Branches**: None. All paths lead to a defined leaf.  
  - **Equivalent Verdicts**:  
    - **Constraint-first (C)** and **Dynamic equivalence (D)** can align *if* preserving the constraint achieves the same reader effect (e.g., a rhyme scheme evoking whimsy).  
    - **Foreignizing (F)** and **Literal crib (A)** overlap when foreignness is achieved through gloss+commentary.  
  - **Incoherent/Unattractive Positions**:  
    - *Literal without commentary* for meaningful constraints → Incoherent (fails to convey constraint's role).  
    - *Constraint-first for decorative, non-iconic forms* → Unattractive (pointless sacrifice of meaning).  
  - **Unbranchable Leaves**:  
    - **Untranslatable (G)** only appears in the "meaningful→inadaptable" path (Q5→No).  
    - **Transcreation (E)** only appears when aesthetic effect is irrecreatable (Q8→No).  

  ---

  ### Specimen Applications
  1. **Tight Rhyme/Meter (e.g., Sonnet)**  
     - *Typical Path*: Decorative (Q1) → Culturally iconic (Q3) → Feasible (Q4) → **C**.  
     - *If rhyme is impossible in target language*: Decorative → Iconic → Unfeasible (Q4) → Strangeness non-priority (Q6) → Aesthetic effect (Q7) → Recreatable (Q8) → **D** (e.g., use assonance).  

  2. **Lipogram (e.g., No "E")**  
     - *Meaningful* (Q1) → Function identical? (Q2):  
       - *If target has "E"*: **C** (reproduce constraint, even if awkward).  
       - *If target lacks "E"*: Not identical (Q2→No) → Adaptable? (Q5):  
         - *If adapt to missing common letter*: **H**.  
         - *If no equivalent letter*: **A** (translate literally + explain).  

  3. **Acrostic (Spells Addressee's Name)**  
     - *Meaningful* (Q1) → Function identical? (Q2):  
       - *If name translatable*: **C**.  
       - *If name untranslatable*: Not identical (Q2→No) → Adaptable? (Q5):  
         - *If adapt to target-language name*: **H**.  
         - *If unadaptable*: **A** (translate + note original acrostic).  

  4. **Poem Fitting a Known Tune**  
     - *Meaningful* (Q1) → Function identical? (Q2):  
       - *If tune known in target culture*: **C**.  
       - *If tune unknown*: Not identical (Q2→No) → Adaptable? (Q5):  
         - *If adapt to target-culture tune*: **H**.  
         - *If tune is culturally unique*: **A** (translate lyrics + explain tune).  

  ---

  ### Tree Logic Summary
  - **Top split** resolves the "constraint as meaning vs. decoration" debate upfront.  
  - **Non-sonic constraints** (lipogram, acrostic) default to "meaningful" unless proven decorative.  
  - **Foreignizing (F)** is the only leaf prioritizing cultural estrangement.  
  - **Untranslatable (G)** is rare and explicit—only when constraints are meaningful but uncommunicable.  

  Use this tree to diagnose translation positions objectively, using poem-specific (not translator-specific) questions. Adjust specimens by answering Q1 based on their individual traits (e.g., a "get well" acrostic is meaningful; a generic sonnet may be decorative).
