answer: |-
  Here is a ranked agenda of open questions in supererogation research, optimized for your team's expertise, tractability constraints, and strategic impact. The ranking prioritizes **conceptual foundations** (problems blocking progress elsewhere), **tractability** (given your team's skills), and **neglect-to-importance ratio**, while testing your three suspicions.

  ### Core Ranking Criteria
  1.  **Upstream Dependence:** How many other questions/research programs hinge on resolving this?
  2.  **Tractability:** Can your team (deontic logician + virtue ethicist + demandingness theorist) make decisive progress with conceptual tools in 3 years?
  3.  **Neglect/Importance Ratio:** Is the problem under-addressed relative to its foundational significance?
  4.  **Transformative Potential:** Would resolving it fundamentally reshape the field?

  ---

  ### Ranked Open Questions (Highest to Lowest Priority)
  1.  **The Boundary Question: What Fixes the Limits of Obligation?**
      *   **Why Upstream?** Directly addresses your first suspicion. If obligation's scope is underspecified, debates about what lies "beyond" it (supererogation) are incoherent. It underpins *all* definitions of supererogation, demandingness debates, and the classic paradox. Resolution determines *if* "supererogatory" is a coherent category at all.
      *   **Tractability:** Perfect fit. Demandingness theorist maps the conceptual terrain (cost, capacity, relationships). Deontic logician models non-binary structures (scales, thresholds, defaults). Virtue ethicist explores how virtues/character define reasonable expectations. Synergy: Test demandingness models against deontic formalisms enriched by aretaic constraints.
      *   **Neglect:** High. While "limits of obligation" is discussed, it's rarely the *primary* focus in supererogation literature, which often assumes a contested boundary exists. Your suspicion points to its centrality.
      *   **Link to Suspicions:** If obligation is intrinsically scalar/threshold-based (Suspicion 3) or relational (Suspicion 2), the boundary dissolves or shifts. Resolving this *tests* both suspicions simultaneously.

  2.  **The Relational Core: Is Supererogation Fundamentally Agent-Relative?**
      *   **Why Upstream?** Directly tests your second suspicion. If "supererogatory" is inherently relational (act-for-agent-in-context), it radically changes the object of theorizing. It determines whether supererogation collapses into role duties or carves out a distinct space for *non-role-based* moral excellence. Impacts the boundary question (#1), demandingness (agent-relative capacities), and the meaning of "optional."
      *   **Tractability:** Strong fit. Virtue ethicist analyzes role virtues vs. "general" virtues/excellences. Deontic logician develops models of agent-relative permissions/options. Demandingness theorist examines how relational contexts alter cost assessments. Team can build formal-agent-relative models grounded in aretaic/demandingness insights.
      *   **Neglect:** Very High. The *systematic implications* of agent-relativity for supererogation's core definition are profoundly under-explored. Most discussions treat agent-relativity as an add-on, not constitutive.
      *   **Link to Suspicions:** If correct (Suspicion 2), it forces a reconstruction (#1) and may challenge binary views (Suspicion 3). If it collapses into role duties, supererogation loses distinctness *unless* defined by exceeding *all* relational expectations.

  3.  **Scalar Obligation & the Viability of Supererogation:**
      *   **Why Upstream?** Directly tests your third suspicion. If obligation is scalar (degrees of wrongness) or defined by a threshold above which no specific acts are required, "supererogatory" as traditionally conceived (optional+better) evaporates. This challenges the field's foundations. Resolution dictates whether supererogation needs "saving" via new definitions or must be abandoned.
      *   **Tractability:** Good fit. Deontic logician excels at modeling scalar/treshold deontic systems. Demandingness theorist analyzes cost/benefit scales. Virtue ethicist explores scalar excellence ("more virtuous"). Challenge: Reconciling scalar deontology with intuitive moral categories.
      *   **Neglect:** High. Scalar deontology is discussed, but its *existential threat* to supererogation as a distinct category is rarely the central focus. Proposals for "saving" supererogation under scalar views are underdeveloped.
      *   **Link to Suspicions:** If obligation is fundamentally non-binary (Suspicion 3 confirmed), it dissolves the classic paradox (Suspicion 1) and necessitates re-evaluating the relational view (#2) in a scalar framework.

  4.  **Praiseworthiness: Necessary, Sufficient, or Correlate?**
      *   **Why Upstream?** Crucial for distinguishing supererogation from mere permissibility or non-moral goodness. Impacts the definition, the symmetry with suberogation, and the significance of heroism/saintliness. If praiseworthiness is neither necessary nor sufficient, the category becomes unstable.
      *   **Tractability:** Excellent fit. Virtue ethicist's core competency (praise, blame, character assessment). Deontic logician can model praiseworthiness operators/conditions. Demandingness theorist links to cost/effort thresholds for praise. Synergy: Define praiseworthiness conditions within formal-agent-relative-scalar models (#1-3).
      *   **Neglect:** Moderate. Often assumed rather than rigorously analyzed in its own right. The *exact logical relationship* to supererogation is contested but not always the focal point.
      *   **Downstream Dependencies:** Heavily informs #5 (Heroism/Saintliness), #6 (Suberogatory Symmetry), and the meaning of "morally better."

  5.  **The Structure of the "Extraordinary": Heroism vs. Saintliness**
      *   **Why Here?** Tests if supererogation is unified or bifurcated. Are heroic (high-risk, dramatic) and saintly (sustained sacrifice, benevolence) acts fundamentally different *in kind* (e.g., different virtues, different relationship to obligation) or just in degree? Impacts demandingness (saintliness as sustained high demand) and virtue theory.
      *   **Tractability:** Good fit. Virtue ethicist distinguishes courage/compassion and their excellences. Demandingness theorist analyzes sustained vs. acute costs. Deontic logician can model risk/duration modifiers. Resolvable by applying frameworks from #1-4.
      *   **Neglect:** High. Often treated as synonyms or intuitive categories without rigorous structural comparison. The *distinctive features* of each are underexplored.

  6.  **Symmetry and the Suberogatory: Genuine Mirror or Formal Artifact?**
      *   **Why Here?** Important for understanding the structure of the "moral margin" beyond obligation. Is suberogation (permissible but morally worse) a coherent, symmetric counterpart, or is negative evaluation fundamentally different (e.g., tied closer to blame/vice)? Depends heavily on #4 (Praiseworthiness).
      *   **Tractability:** Moderate fit. Virtue ethicist analyzes blame/vice vs. praise/virtue. Deontic logician can model symmetry in deontic operators. Demandingness theorist less central. Requires prior clarity on #4.
      *   **Neglect:** Moderate. Growing interest, but whether symmetry is deep or superficial remains unresolved. Often a secondary discussion.

  7.  **Omission, Desert, and Risk: Specific Constraints or Distractions?**
      *   **Omission:** Can *not* acting be supererogatory? (e.g., *not* claiming a rightful inheritance). **Verdict:** *Possible, but rare/dependent*. Highly sensitive to #1 (Boundary - what *must* you claim?) and #2 (Relational - role expectations). Low tractability *as a standalone question*; resolved by applying #1 & #2.
      *   **Recipient's Desert:** Does the desert of the beneficiary affect whether an act is supererogatory? (e.g., rescuing a saint vs. a villain). **Verdict:** *Likely impacts permissibility/praiseworthiness, not core optionality*. Primarily affects #4 (Praiseworthiness). Low upstream impact.
      *   **Agent's Risk of Failure:** Does high risk of failure make an act non-supererogatory if attempted? (e.g., unlikely rescue). **Verdict:** *Impacts permissibility/praiseworthiness, not core optionality*. Related to #5 (Heroism) and #4 (Praiseworthiness). Low upstream impact.
      *   **Overall Placement:** These are important *applications* or *modifiers* but not foundational. They depend critically on resolutions to #1-5. Ranked lowest collectively.

  ---

  ### Overrated vs. Underrated Questions
  *   **Overrated:**
      *   **Endless Variations of the Classic Paradox:** Generating ever-more convoluted cases to "test" intuitions about the paradox, without addressing the underlying structural assumptions (Suspicion 1). Progress stalls without tackling the boundary (#1) or scalar (#3) questions.
      *   **Taxonomic Debates without Foundational Grounding:** Arguing over fine-grained classifications of supererogatory acts (e.g., beneficence vs. heroism) before resolving what makes *anything* supererogatory (#1-3). Premature.
  *   **Underrated:**
      *   **The Relational Core (#2):** Its potential to dissolve or radically reconstruct the category is massively underappreciated.
      *   **Scalar Obligation's Existential Threat (#3):** The field often ignores how deeply scalar views challenge its core assumptions.
      *   **The Necessity/Sufficiency of Praiseworthiness (#4):** Often assumed or glossed over, yet critical for the category's coherence and distinctness.

  ---

  ### Dependency Structure & Apparent Disagreements
  *   **The Foundational Layer (Prior Questions):**
      1.  **The Nature of Obligation (Scalar/Binary/Threshold?) (#3)** and **The Relational Core (#2)** are deeply intertwined and jointly determine **the Viability & Scope of the Category**.
      2.  **The Boundary Question (#1)** depends fundamentally on the resolution of (#2 & #3). *What* is bounded, and *how* it's bounded (sharply/fuzzily) is defined by them.
      *   *Apparent Disagreement:* Debates about "Is X supererogatory?" often stem from unacknowledged differences in assumptions about (#2) and (#3). Someone assuming binary/non-relational obligation will clash with someone assuming scalar/relational obligation, talking past each other.
  *   **The Definitional Layer (Depends on Foundation):**
      3.  **Praiseworthiness Link (#4)** depends on the resolved category from (#1-3). What "praiseworthiness" means and its link to the act is shaped by the foundation.
      4.  **The Structure of the Extraordinary (#5)** depends on (#4) and the foundational layer. What counts as "heroic" or "saintly" relies on what counts as supererogatory and how praise attaches.
  *   **The Structural Layer (Depends on Definition):**
      5.  **Suberogatory Symmetry (#6)** depends critically on (#4). Symmetry only makes sense if praiseworthiness/blameworthiness are symmetric counterparts within a defined moral space.
  *   **The Applied Layer (Depends on Prior Layers):**
      6.  **Omission, Desert, Risk (#7)** are specific cases whose analysis only makes sense once the prior layers (#1-6) provide a stable framework. Disagreements here usually reflect unresolved disagreements upstream.

  ---

  ### Moving the Rankings & The Single Line of Work
  *   **What Moves Rankings?** A decisive result on #1 (Boundary) or #3 (Scalar Threat) would be seismic. Success would involve:
      *   **#1:** A robust, defensible model (logical + normative) for delimiting obligation that resolves key counterexamples and integrates relational/scalar insights, accepted as a new benchmark.
      *   **#3:** A compelling argument *either* that supererogation can be coherently reconstructed within a dominant scalar framework *or* that abandoning the category is necessary, significantly shifting the field's focus.
      *   **#2 (Relational):** Demonstrating conclusively that supererogation either *reduces to* role-exceeding or constitutes a *sui generis* category of non-role-based moral excellence, reshaping definitions.
  *   **If Only One Line:** **Focus on the Boundary Question (#1) integrated with testing the Relational Core (#2).**
      *   **Why:** #1 is the most fundamental *question*, but #2 (your suspicion) is the most transformative *lens* to apply to it. Your team is uniquely positioned (demandingness + virtue + logic) to tackle the boundary *as a relational problem*: "What obligations does an agent have *in virtue of their specific capacities, relationships, and context*, and what lies beyond *that specific boundary*?" This directly tests both Suspicions 1 & 2 and informs #3.
      *   **What to Cut:** Explicit work on #5 (Heroism/Saintliness), #6 (Suberogatory), and #7 (Omission/Desert/Risk) as primary lines. Insights on these may emerge from the core work, but they shouldn't be primary objectives. #3 (Scalar) and #4 (Praiseworthiness) would be addressed *through* the lens of the relational boundary investigation (#1+#2), rather than as standalone major projects.

  **Defense of Ordering & Risks:** This ranking prioritizes **conceptual foundations** (#1-3) over **definitional refinement** (#4-5) or **structural exploration** (#6) and **application** (#7). The trade-off is potentially sacrificing depth on interesting but secondary issues (like suberogation symmetry) for a shot at resolving field-defining problems. **The key risk is betting heavily on the Relational Core (#2).** If it turns out to be *less* fundamental than suspected (e.g., if supererogation is primarily act-focused), the focus on integrating it deeply with the Boundary (#1) might yield less transformative results than hoped. However, even a negative result here would be highly valuable progress. This risk is justified by the potential payoff: a truly novel and unifying account of supererogation grounded in agency and context. The funder should value this high-risk/high-reward approach focused on dissolving classic puzzles rather than endlessly debating them.
