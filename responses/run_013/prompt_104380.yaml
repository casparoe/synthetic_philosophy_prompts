  Okay, let me try to unpack this flatmate argument step by step. The user describes a zero-sum game where they choose between moves A, B, and C, while their flatmate chooses between Left and Right. The payoffs are clear: A gets 3 against Left but 0 against Right, B is the opposite, and C consistently gives 1. The flatmate argues that C should never be played because a 50-50 coin toss between A and B yields an expected payoff of 1.5, which beats C's 1. That part seems solid. But then she claims that removing C reduces the game to a simple guessing game where randomizing 50-50 is optimal, and she generalizes this "coin-flip test" deletion method to all games. 

  The user has three main concerns: First, is eliminating C via hypothetical coin toss valid? Second, could the order of eliminating such moves affect the outcome? Third, what role does mutual rationality ("we're both sensible") play here? Underlying this is skepticism about their flatmate's overconfidence despite losing repeatedly.

  Hmm. The core issue is about game theory fundamentals. The flatmate's first point is correct—C is strictly dominated by the mixed strategy of A and B. That's Textbook Game Theory 101. But her generalization is where it gets messy. The "delete dominated strategies" method works for pure strategies (like if C always scored less than A), but mixed strategy domination is trickier. In zero-sum games specifically, iterative removal of dominated strategies can sometimes converge to Nash equilibrium, but order matters in non-zero-sum cases. 

  Ah, and mutual rationality is crucial here—it's not decoration. The Nash equilibrium assumes both players know the game structure and each other's rationality. If the flatmate isn't actually rational (or doubts the user's rationality), all bets are off. That might explain her losing streak: she assumes optimal play from the user, but if the user plays erratically, randomization isn't necessarily best. 

  For the user's peace of mind, I should clarify: 
  - Killing C via coin-flip logic is legitimate in standard theory. 
  - Order of deletion can matter outside zero-sum games. 
  - "Mutual rationality" isn't just fluff—it's the scaffold holding up Nash equilibrium. 
  But also gently note that real humans don't always play Nash, which might be why the flatmate keeps losing despite "solving" the game. 

