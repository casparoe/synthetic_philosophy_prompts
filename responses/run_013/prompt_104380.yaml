answer: |-
  Right, let's sort this properly. Your flatmate is half-right—her first step is solid game theory, but her generalisation is wobbly and oversold. I'll break it down British-style: no flannel, clear separation of settled bits from the muddy patches, and I'll flag where her confidence might be misplaced (especially after four losses). We'll tackle your three worries head-on.

  ### 1. **Is killing C with a coin toss legitimate?**
     - **Settled consensus: Yes, entirely legitimate.**  
       C isn't just beaten by A *or* B alone—it's beaten by a **mixed strategy** (the 50-50 coin toss between A and B). Against Left: (0.5 × 3) + (0.5 × 0) = 1.5 > 1. Against Right: (0.5 × 0) + (0.5 × 3) = 1.5 > 1.  
       - This makes C a **strictly dominated strategy**: there's *no scenario* where C gives you a better payoff than the mixed strategy.  
       - Economists (and mathematicians) agree: deleting strategies dominated by *other pure or mixed strategies* is standard. It’s not about literally flipping coins; it’s about what a rational player *could* do to guarantee a better outcome.  
       - **Verdict:** Your flatmate is correct here. C is "dead". No serious debate.

  ### 2. **Does the order of deletion change what survives?**
     - **Settled for zero-sum games (like yours): No, order doesn’t matter.**  
       In your specific game, killing C first is safe. After removing C, you’re left with A and B—a simple matching pennies game. The 50-50 mix *is* optimal, giving 1.5 regardless of her move.  
       - **But her general claim is flawed:** She says "*any game, any order*". That’s **not true**. Outside zero-sum:  
         - Order *can* matter if multiple strategies are dominated. Deleting in different sequences might leave different "surviving" sets.  
         - Even in zero-sum, if strategies are *weakly* (not strictly) dominated, order might matter. Your game avoids this as C is *strictly* dominated.  
       - **Settled bit:** In zero-sum games with strict domination (like yours), iterative deletion always leads to the same solution—the **Nash equilibrium** (here, 50-50 A/B for you, 50-50 Left/Right for her).  
       - **Muddy bit:** Her "cross off in any order" rule only reliably works for zero-sum games. In general games, it’s not a foolproof method. Economists know this—it’s why Nash equilibrium isn’t always found by deletion.

  ### 3. **What work is "we're both sensible and know it" doing?**
     - **Settled consensus: It’s absolutely essential, not decoration.**  
       This is the **common knowledge of rationality** assumption. It’s doing heavy lifting:  
       - **Step 1:** You delete C because you’re rational.  
       - **Step 2:** She *knows* you’re rational, so she knows you’ll delete C.  
       - **Step 3:** You know she knows you’ll delete C, so you both play the A/B game.  
       - If either doubts the other’s rationality (e.g., if you think she might irrationally play Left 100% of the time), you might play A always—and if she *does* that, you win big. But if you’re both rational *and know it*, neither can exploit the other.  
       - **Nash equilibrium** (which this 50-50 mix is) relies on this: no player can improve their payoff by changing strategy *if others stick to theirs*.  
       - **Your flatmate’s losses?** This explains it. If *she* randomises 50-50 but *you* don’t (e.g., you play A 80% of the time), she should lose roughly half the time. Her losses suggest either:  
         - She’s not randomising properly (human randomness is famously poor),  
         - Or you’re not playing as "rationally" as she assumes (e.g., you might favour A),  
         - Or she’s miscounted the payoffs.  

  ---

  ### The Bottom Line
  - **Where she’s right:**  
    - C should be scrapped. The coin-toss argument is watertight.  
    - After deleting C, 50-50 A/B is indeed optimal *for this specific game*.  
  - **Where she’s overreaching:**  
    - Her "solve any game by deleting in any order" claim is **rubbish**. It works here because:  
      1. It’s zero-sum.  
      2. Domination is strict.  
      3. Only one strategy (C) needs deleting.  
    - In general games, deletion order can matter, and not all dominated strategies are obvious. Nash equilibrium (where players’ strategies are mutual best responses) is the gold standard—but finding it isn’t always straightforward.  
  - **Your worry about mutual rationality:** Spot on. If she’s losing repeatedly, she’s likely overestimating either your rationality or her own. Game theory assumes perfect players; real humans are messy. Her 50-50 mix is optimal *only if* you’re both playing rationally. If you’re favouring A, she should play Left more—but then you exploit *her*.  

  ### Practical Advice
  Tell your flatmate: *"Deleting C is sound. But your ‘any game, any order’ rule is bollocks—it works here by luck. And if you’ve lost four weeks running, maybe I’m not the robot you think I am. Either up your randomness game or stop assuming I’m predictable."*  

  This isn’t sand—the core theory is settled. But applying it to messy humans? That’s where the fun (and arguments) begin. Keep the game, ditch the grand claims.
