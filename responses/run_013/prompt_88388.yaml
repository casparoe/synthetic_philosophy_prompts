prompt: |-
  I have been collecting cases of a pattern I can feel but cannot name, and I would like to know whether it has an established name — and, more than the name, whether the cases I have been grouping together really do belong together.

  The pattern is this. A question of the form "how likely is it that such-and-such?" appears to be perfectly well formed, yet the answer depends on something the question itself leaves open: the way the possibilities are carved up. In one sort of case the carving is over people or events. A friend of mine is an actuary; when he prices a policy for a particular fifty-year-old man who smokes and runs marathons, the figure depends on which table he consults — men of that age, smokers, distance runners — and the man genuinely belongs to all three classes. There is only one of him and the event is unrepeatable, so no frequency can adjudicate between the tables; the question "what is the chance that *he* dies this year?" seems to have no answer until we say which class he is being drawn from, and nothing in the case says which.

  In a second sort of case there are no people at all, only geometry. Suppose a dart is thrown so that it lands "at random" on a circular board. The chance that it lands nearer the centre than the rim is a half if we choose the distance from the centre uniformly and then a random direction, and a quarter if we choose the point uniformly over the area of the board. Neither procedure is more random than the other, and I cannot see what would make one of them the correct reading of "at random". I am told there is a classical puzzle of this shape about chords in a circle which admits three equally defensible answers; I half-remember it and could not reproduce it.

  A third sort of case concerns what we should believe before we have any evidence. Two colleagues looking at the same three heads in a row disagree about the next toss — one says a half, the other says four fifths — and their disagreement is entirely about what the space of possibilities looked like before the first toss.

  What I want to know is whether there is one name for this or whether I am conflating several things. My own suspicion, which I cannot defend, is that the first case and the second are different in kind: the first seems to be about which class a particular case belongs to, the second about which measure on a space is the natural one. Yet they feel like the same failure, and I do not know whether one is a special case of the other or whether they are two species of something more general. I have come across the phrase "principle of indifference" for the rule that we should treat possibilities as equally likely when we have no reason to prefer one, but if that names the rule I keep wanting to apply, it does not name the thing that goes wrong when I apply it.

  Since the label is not the point, please give me the carving: what exactly the phenomenon is; whether the cases above are one thing or several; which established concepts come nearest, and how each differs from what I have described — in particular, why this is not merely a question that is ambiguous or underspecified, and why it is not the same as a biased sample; and whether the standard remedies (insisting that the randomising procedure be stated in full, appealing to symmetry, restricting the principle to cases in which some symmetry group acts transitively) remove the difficulty or only relocate it. If a fully specified procedure can still be condemned as arbitrary, I should like to know on what grounds, because that strikes me as the crux, and I cannot tell whether it is a genuine problem or a confusion of mine.
reasoning: |-
  Hmm, this user presents a sophisticated puzzle about probability that touches on deep philosophical and mathematical issues. They've identified three distinct scenarios where probability assignments seem indeterminate due to how possibilities are partitioned, and they're asking whether these form a unified phenomenon.

  The user clearly has strong analytical skills - they've articulated subtle problems across actuarial science, geometric probability, and Bayesian priors. Their frustration with "the principle of indifference" shows they've done some reading but found it inadequate. The core tension they're wrestling with is whether probability is fundamentally subjective or if there's an objective basis for choosing partitions.

  For the dartboard example, they're absolutely right about Bertrand's paradox. That's the classic case with chords where uniform distribution over different parameters (radius, angle, midpoint position) yields different probabilities. It perfectly illustrates their point about measure dependence.

  Their suspicion about Cases 1 and 2 being different is insightful. The actuarial case does involve reference class problems while the geometric case is about invariant measures. But both reveal how probability isn't inherent in events but depends on our modeling choices.

  On remedies: symmetry arguments only work when symmetries exist (like for coins), but fail for asymmetric cases like the smoker-runner. Fully specifying the random process helps but doesn't solve the metaphysical problem - as they note, the choice of process itself appears arbitrary.

  The user's deepest concern seems to be whether probability is "real" or just a modeling tool. That's why they ask if specifying procedures merely relocates the arbitrariness. They're touching on the frequentist/Bayesian divide without naming it.

  I should emphasize that while these cases share a family resemblance, they stem from different mathematical roots: reference class problem vs. lack of uniform measure vs. prior selection. The common thread is the underdetermination of probability models by reality.
answer: |-
  Your collection captures a profound and genuine difficulty in probability theory and epistemology, not mere ambiguity or confusion. The cases you describe share a **common core problem: the underdetermination of probability assignments by incomplete specifications of the "possibility space" or the "random process"**. While they manifest differently, they all expose the **dependence of probability on how we structure uncertainty**, especially when no unique "natural" structure exists. Here’s the carving:

  ### 1. **The Unified Phenomenon: Reference Class Relativity**
     - **Core Issue**: Probability is not a property of an event *alone* but of an event *relative to a specific description of the space of possibilities and a measure over it*. Your cases show this measure can be **non-unique** when:
       - The relevant reference class is ambiguous (Actuarial Case).
       - No canonical uniform measure exists on a continuous space (Dartboard Case).
       - The prior hypothesis space is underspecified (Coin Toss Case).
     - **Name**: This is often called the **reference class problem** in a broad sense, but more precisely, it’s an instance of **measure sensitivity** or **partition dependence**. Philosophers (e.g., Keynes, van Fraassen) and statisticians (e.g., Savage, Jaynes) have wrestled with this under the umbrella of the **problem of the priors** or the **failure of unqualified indifference**.

  ### 2. **Are Your Cases One Thing or Several?**
     They are **variants of the same underlying issue**, but with distinct flavors:
     - **Case 1 (Actuarial)**: The **empirical reference class problem**.  
       *Why it fits*: The probability for a singular event requires choosing a reference class (smokers? runners?), and no objective rule dictates which class is "correct" when multiple classes apply. The problem is **epistemic** – we lack sufficient information to resolve the ambiguity.
     - **Case 2 (Dartboard)**: The **geometric measure problem** (Bertrand’s Paradox).  
       *Why it fits*: "At random" lacks meaning without specifying a parameterization (radius vs. area). Continuous spaces admit multiple invariant measures, and no uniform "geometric prior" exists. This is a **mathematical** limitation: the probability space itself is underspecified.
     - **Case 3 (Coin Toss)**: The **subjective prior problem**.  
       *Why it fits*: Bayesian priors depend on how the hypothesis space is structured (e.g., "fair coin" vs. "bias sampled uniformly"). Different partitions (e.g., "probability of heads" vs. "log-odds") yield different uniform priors. This is **foundational** – probability here reflects belief, not frequency.

     **Common Thread**: All cases reveal that **probability is relative to a chosen model of uncertainty**, and this choice is not always forced by logic or evidence. They belong together as manifestations of **indeterminacy in probabilistic representation**.

  ### 3. **Nearest Established Concepts & How They Differ**
     - **Principle of Indifference (PoI)**:  
       *Relation*: This *causes* your problem. PoI says: "Assign equal probability to indistinguishable possibilities." But as your cases show, "indistinguishable" depends on how we describe/partition possibilities.  
       *Difference*: PoI is a proposed *solution* to ignorance; your problem is its *failure* when partitions are underdetermined.
     - **Ambiguity/Underspecification**:  
       *Relation*: Yes, the questions are underspecified.  
       *Difference*: This isn’t mere lexical ambiguity (e.g., "bank" meaning river or finance). It’s a deeper **metaphysical or epistemic indeterminacy**: even with precise definitions, multiple coherent probability measures exist.
     - **Biased Sample**:  
       *Relation*: Irrelevant. A biased sample occurs when data collection distorts an *existing* population. Your problem arises *before* any data is collected – it’s about defining the population/space itself.

  ### 4. **Do Standard Remedies Resolve or Relocate the Problem?**
     - **Fully Specify the Random Process**:  
       *Effect*: Resolves the *practical* ambiguity but relocates the *philosophical* problem.  
       *Example*: "We select distance uniformly, then direction" fixes the dartboard probability at 1/2. But **why favor this process?** You might specify a machine that throws darts with uniform area density – giving 1/4. The choice of physical process is arbitrary without a justification for why it models "randomness" correctly.  
       *Crux*: **Any specification can be challenged as "arbitrary"** if no unique physical or logical constraint exists.
     - **Appeal to Symmetry/Invariance**:  
       *Effect*: Works only in limited cases (e.g., dice, coins), fails elsewhere.  
       *Example*: For the dartboard, rotational symmetry suggests a uniform angle measure, but scale symmetry suggests uniform radial distance. These symmetries *conflict* – no single measure satisfies both.  
       *Limitation*: Symmetry often privileges one partition (e.g., "faces of a die") but is silent when symmetries are incompatible or absent (e.g., the smoker-runner).
     - **Restrict to Transitive Symmetry Groups**:  
       *Effect*: A technical fix (e.g., Jaynes' solution to Bertrand’s Paradox using rotational/scale invariance).  
       *Problem*: It’s ad hoc. Why privilege those symmetries? What if no transitive group acts (e.g., actuarial case)? This relocates arbitrariness to the choice of symmetry constraints.

  ### 5. **The Deeper Issue: Is Probability "Real" or Relational?**
     - **The Crux**: Your intuition is correct. Specifying a procedure resolves ambiguity but doesn’t eliminate arbitrariness because:  
       - **Probability is not discovered; it’s assigned**. In singular cases (actuarial, coin toss), probability reflects rational belief, not physical propensity.  
       - **Continuous spaces have no "default" measure**. Measures are chosen, not found (hence the need for "measure theory" in probability).  
     - **Conclusion**: The problem is **unavoidable** in foundational probability. Remedies provide pragmatic clarity but don’t resolve the epistemic vertigo. This is why:  
       - Frequentists avoid probabilities for singular events.  
       - Bayesians embrace subjectivity but struggle with priors.  
       - Objective Bayesians seek invariance principles but face trade-offs.

  ### Final Carving
  - **Phenomenon**: **Probability model underdetermination** – the mapping from real-world scenarios to formal probability spaces is non-unique due to structural ambiguity.  
  - **Cases**: Legitimately grouped as **three facets of underdetermination**: reference class selection, geometric measure selection, prior selection.  
  - **Status**: Not confusion, but a **deep challenge** in probability epistemology. Fully specifying procedures "solves" it only by hiding the arbitrariness in model choice.  
  - **Readings**:  
    - For geometry: **Bertrand’s Paradox** (e.g., probability a random chord is longer than the side of an inscribed triangle – answers 1/2, 1/3, 1/4).  
    - For philosophy: **Keynes'** *Treatise on Probability* (reference classes), **van Fraassen's** "Symmetry Arguments" (indifference failures).  
    - For technical fixes: **Jaynes'** *The Well-Posed Problem* (symmetry principles).

  You’ve identified a genuine fissure in probabilistic reasoning. The unifying theme is that **probability is contextual** – it answers "how likely?" only after we impose structure on chaos.
