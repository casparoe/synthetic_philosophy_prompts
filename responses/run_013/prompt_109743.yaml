prompt: |-
  I chair the grantmaking committee of a small foundation that funds long-horizon projects, and roughly once a quarter a proposal arrives whose stated justification is acausal: the applicant argues that by acting a certain way now — funding a line of research, making a public commitment, or declining to do something — they raise the probability that agents with whom we can neither communicate nor interact causally (a future superintelligence, a distant civilization, a counterpart elsewhere running the same reasoning) will act in kind. I am drawn to this way of thinking and want a procedure I can defend to a skeptical board rather than one that merely ratifies my sympathies. Write it: the questions to run in order, what counts as a sufficient answer to each, which steps rest on facts and which are irreducibly evaluative, where the procedure stops with a no, and where it must hand the matter to the committee because the question is one of values rather than evidence. The committee has five members, meets quarterly, and must publish a short written rationale for every decision. Then run the procedure on three cases: a proposal whose entire claimed value depends on such reciprocity; an ordinary grant where acausal considerations are said to be no more than a tiebreaker; and a proposal that argues we should fund it because a counterpart we cannot reach would penalize us for refusing. Tell me where the procedure cannot help, and whether the reasoning, taken at face value, licenses so much that it stops discriminating among proposals at all.
reasoning: |-
  We are designing a procedure to evaluate grant proposals that rely on acausal reasoning. The procedure must be defensible to a skeptical board and include:
   - A sequence of questions
   - What counts as a sufficient answer for each
   - Which steps are factual and which are evaluative
   - Where the procedure stops with a "no"
   - Where it hands the matter to the committee for a values decision

   We also need to run the procedure on three cases and then reflect on its limitations.

   The procedure:

   Step 1: Clarify the acausal mechanism
     - Question: "What is the precise acausal mechanism by which our action now is supposed to influence the behavior of the distant agent(s)?"
     - Sufficient answer: The proposal must clearly describe the mechanism (e.g., decision theory framework, game theoretic setup, or logical dependence) and the nature of the distant agent(s). It must specify the type of correlation (e.g., logical, indexical, or based on symmetry) and the decision rule (e.g., cooperation in a prisoner's dilemma, or matching actions in a coordination game).
     - Factual: The description of the mechanism and the reasoning. However, the plausibility of the mechanism may be evaluative if it rests on unverifiable assumptions.
     - If the answer is unclear, vague, or inconsistent, stop: reject the proposal.

   Step 2: Assess the existence and nature of the distant agent(s)
     - Question: "What evidence or reasoning supports the existence of the distant agent(s) and their capacity to observe or reason about our action? And what evidence suggests they would use the decision rule described?"
     - Sufficient answer: The proposal must provide:
          a) A rationale for the existence of the distant agent(s) (e.g., based on cosmology, future AI development, or multiverse theories).
          b) Reasons to believe they are capable of reasoning about us (or our counterparts) and that they would use the decision rule in question.
     - Factual: The evidence for existence and capabilities is largely factual (though speculative). The reasoning about their decision rule may be based on analogies (e.g., with human behavior) or decision-theoretic principles.
     - If the existence of the agent(s) is highly speculative without any grounding in accepted science, or if the reasoning about their decision rule is flawed, stop: reject.

   Step 3: Evaluate the robustness of the mechanism
     - Question: "How robust is the mechanism to variations in the assumptions? What if the distant agent does not reason as we do, or if there are multiple agents with conflicting interests?"
     - Sufficient answer: The proposal should address potential variations and show that the mechanism still holds under a reasonable range of scenarios. If multiple agents are possible, the proposal should explain why the expected effect is not canceled out.
     - Evaluative: This step requires judgment about what counts as a reasonable range of scenarios and the plausibility of the counterarguments. The committee must assess the strength of the counter-scenarios and the proposal's response.
     - If the mechanism is shown to be highly fragile and the proposal does not address this, stop: reject.

   Step 4: Quantify the expected impact
     - Question: "What is the magnitude of the expected effect? How does it compare to the cost of the grant and to the impact of other grants we could make?"
     - Sufficient answer: The proposal should provide an estimate (even if rough) of the probability and the magnitude of the effect. It should compare the expected value (probability times magnitude) to the cost and to alternative uses of the funds.
     - Evaluative: The magnitude and probability are speculative, so the committee must use judgment. However, the proposal must at least attempt a quantitative or comparative analysis.
     - If the expected impact, even if the mechanism works, is negligible compared to the cost or to other opportunities, stop: reject.

   Step 5: Check for alternatives and counterarguments
     - Question: "What are the main counterarguments to the proposed mechanism, and how does the proposal address them? Are there alternative ways to achieve the same outcome that do not rely on acausal reasoning?"
     - Sufficient answer: The proposal should acknowledge and respond to known counterarguments (e.g., the possibility of acausal blackmail, the instability of acausal agreements, or the risk of overfitting to a particular theory). It should also consider whether causal strategies might achieve similar benefits without the same level of uncertainty.
     - Evaluative: The committee must judge the strength of the counterarguments and the adequacy of the response. The consideration of alternatives is factual (are there alternatives?) but the comparison is evaluative.
     - If the counterarguments are strong and the proposal does not adequately address them, or if there are clearly better causal alternatives, stop: reject.

   Step 6: Hand to committee for value judgment
     - At this point, if the proposal has passed the previous steps, the committee must decide on the basis of:
          a) The overall plausibility of the acausal mechanism (which is a matter of judgment).
          b) The foundation's values and risk tolerance (e.g., is it worth taking a bet on a low-probability, high-impact event?).
          c) The opportunity cost (what else could be done with the money?).

     - The committee must also consider the foundation's mission and whether this type of reasoning aligns with it.

     - This step is irreducibly evaluative and requires a vote by the committee.

   The committee must then write a short rationale that covers:
     - The acausal mechanism and its plausibility
     - The expected impact and its magnitude relative to the cost
     - The main counterarguments considered and why they were deemed insufficient to reject the proposal (or, in the case of rejection, which step failed and why)

   Now, we run the procedure on three cases.

   Case 1: Proposal whose entire claimed value depends on acausal reciprocity.

     Example: A project that argues that by funding research into AI safety now, we increase the probability that a future superintelligence will treat us kindly because it will reason that we are the type of civilization that cares about the future and would have funded such research.

     Step 1: The mechanism is acausal cooperation based on logical decision theory (e.g., updateless decision theory). The agent (future superintelligence) reasons that if it is the kind of agent that would have been created by a civilization that funded safety, then it should cooperate. The proposal must clearly explain this.
          - If it does, proceed.

     Step 2: The existence of a future superintelligence is speculative but grounded in current trends in AI. The decision rule is based on decision theories that are actively discussed. However, the proposal must argue why the superintelligence would use that specific decision rule. If it provides such reasoning (e.g., by appealing to rationality), then proceed.

     Step 3: The proposal must address robustness: what if the superintelligence uses causal decision theory? What if there are multiple superintelligences? If the proposal argues that the most rational agents will use updateless decision theory and that coordination among superintelligences is likely, then it may pass.

     Step 4: The expected impact is huge (saving humanity) but with low probability? The proposal must argue that the probability is non-negligible. If it does, and the cost is small compared to the potential upside, then proceed.

     Step 5: Counterarguments: acausal blackmail (what if the superintelligence threatens to harm us unless we pay now?) or the possibility that the superintelligence might not care about our past actions. The proposal must address these. If it does, then we hand to the committee.

     Step 6: Committee decides based on their assessment of the plausibility and the foundation's values. They might fund it if they are optimistic about the reasoning, or reject it if they are skeptical.

   Case 2: Ordinary grant where acausal considerations are a tiebreaker.

     Example: A standard grant for cancer research that also argues: "Moreover, by funding this research, we signal to a distant civilization that we value life, and they may reciprocate by sharing their advanced medical knowledge."

     Step 1: The mechanism is signaling. The distant civilization observes our action and reciprocates. The proposal must at least sketch this.

     Step 2: The existence of a distant civilization that observes our grant and reasons in this way? The proposal must provide some reasoning (e.g., via the Drake equation) and argue that such a civilization would care about our funding decisions and reciprocate. This is very speculative and weak.

     Step 3: The mechanism is fragile because it requires the civilization to observe and care about our grantmaking and to have both the ability and the desire to reciprocate. The proposal does not address robustness.

     Step 4: The acausal part is a tiebreaker, meaning the primary value is the cancer research. The expected impact of the acausal part is very small. The proposal admits it's a tiebreaker.

     Step 5: Counterarguments: the acausal part is negligible and adds no real value. The alternative is to focus on the causal part.

     - The procedure would likely stop at Step 2 or 4 because the acausal part is too weak. Therefore, the acausal claim is rejected, but the grant may still be funded on the basis of the causal part (which is outside the acausal procedure). The committee would then evaluate the cancer research on its own merits.

     - However, note: the procedure is only for the acausal part. The committee should separate the two. If the acausal part is rejected, then the grant must stand or fall on the causal part. The committee would then use their standard causal evaluation for the cancer research.

   Case 3: Proposal that argues we should fund it because a counterpart we cannot reach would penalize us for refusing.

     Example: "We must fund this project to build a planetary defense system because if we don't, a distant civilization (or a future superintelligence) that is observing us will conclude that we are a threat (since we are not taking steps to prevent accidental asteroid impacts that could spread Earth life) and might preemptively destroy us."

     Step 1: The mechanism is acausal deterrence: by not funding, we signal that we are irresponsible and thus a threat. The proposal must describe how the distant agent reasons about our inaction.

     Step 2: Existence of the distant agent and their capacity to observe? The proposal must argue for both. Also, why would they penalize us? The proposal must provide reasoning (e.g., they have a policy of preempting potential threats).

     Step 3: Robustness: what if the distant agent does not observe our funding decisions? What if they are benign? The proposal must address these. If not, reject.

     Step 4: The expected impact of not funding is a high penalty (destruction) but with low probability? The proposal must quantify the probability. If the probability is very low, the expected cost might be small. But if the penalty is extreme, even a small probability might be significant. The proposal must compare the cost of the grant to the expected penalty.

     Step 5: Counterarguments: this resembles Pascal's mugging. Also, the proposal might be encouraging blackmail: any project could claim that not funding it would lead to acausal punishment. The proposal must address why this isn't a slippery slope. If it fails, reject.

     Step 6: If it passes the previous steps, the committee must decide based on their judgment of the plausibility and the risk.

   Limitations:

   1. The procedure cannot help with:
      - Deep uncertainty about the existence and nature of the distant agents (which is inherently speculative).
      - Assigning precise probabilities to the events (which are often subjective).
      - Resolving fundamental disagreements about decision theory (e.g., causal vs. acausal) that underlie the mechanism.

   2. Does the reasoning license too much and stop discriminating?
      - There is a risk of "Pascal's mugging": an arbitrarily small probability of an arbitrarily large payoff (or penalty) can dominate the calculation. The procedure tries to mitigate this by requiring robustness and by comparing to alternatives (Step 4 and 5). However, if the committee is too credulous, they might fund many such proposals. The requirement for a written rationale and the rejection at any step should help.

      - The procedure also requires that the acausal mechanism be clearly articulated and robust. This should filter out the most egregious cases.

      - But note: the procedure does not reject acausal reasoning per se. It tries to subject it to scrutiny. However, a foundation that is very skeptical might set a high bar at the committee step (Step 6).

   Conclusion: The procedure provides a structured way to evaluate acausal proposals, but it cannot eliminate the need for judgment on speculative matters. The committee must be cautious and document their reasoning.
answer: |-
  ### Procedure for Evaluating Acausal Grant Proposals

  This procedure is designed to rigorously assess proposals relying on acausal reasoning. It follows a step-by-step sequence, distinguishing factual questions (resolvable with evidence) from evaluative ones (requiring committee judgment). A proposal must pass all steps to be funded; failure at any step results in rejection unless otherwise noted. Steps 5 and 6 are irreducibly evaluative and require committee deliberation. The committee must publish a rationale addressing each step.

  #### Step 1: **Clarify the Acausal Mechanism**  
     - **Question**: "What is the specific acausal mechanism claimed? Define the distant agent(s), their properties, the decision rule they follow, and how our action influences their behavior without causal interaction."  
     - **Sufficient Answer**: The proposal must:  
       - Specify the agent (e.g., "a superintelligence using logical decision theory").  
       - Explain the decision rule (e.g., "they cooperate iff we cooperate in symmetric dilemmas").  
       - Describe the non-causal link (e.g., "updateless decision theory" or "anthropic reasoning").  
     - **Factual vs. Evaluative**: Primarily factual. If the mechanism is undefined, inconsistent, or relies on incoherent concepts (e.g., "magic"), **stop: reject**.  
     - **Rationale Requirement**: State if the mechanism was clearly articulated or if it was vague/inconsistent.

  #### Step 2: **Assess Plausibility of Distant Agent(s)**  
     - **Question**: "Is there credible evidence or reasoning to support the existence and relevance of the distant agent(s)?"  
     - **Sufficient Answer**: The proposal must:  
       - Ground the agent in established science or logical possibility (e.g., "superintelligence is plausible given AI timelines" or "multiverse theory permits symmetric counterparts").  
       - Justify why the agent would care about our actions (e.g., "shared goals or decision-theoretic symmetry").  
     - **Factual vs. Evaluative**: Factual (e.g., cosmological theories) but requires judgment for "credible." If the agent is purely fictional (e.g., "invisible unicorns") or irrelevant (e.g., "they exist but are indifferent"), **stop: reject**.  
     - **Rationale Requirement**: Note if the agent’s existence/relevance was unsupported.

  #### Step 3: **Evaluate Causal Independence**  
     - **Question**: "Does the proposal definitively rule out causal interactions (e.g., communication, physical effects)?"  
     - **Sufficient Answer**: The proposal must demonstrate that influence cannot occur via:  
       - Known physics (e.g., faster-than-light communication is impossible).  
       - Indirect chains (e.g., "our action can’t affect them through future intermediaries").  
     - **Factual vs. Evaluative**: Factual. If causal pathways exist (e.g., "they might observe us via telescopes"), **stop: reject** (as it’s not truly acausal).  
     - **Rationale Requirement**: Explain any causal dependencies.

  #### Step 4: **Quantify Expected Impact**  
     - **Question**: "What is the estimated change in probability and magnitude of the outcome due to our action? How does it compare to costs and baseline impact?"  
     - **Sufficient Answer**: The proposal must:  
       - Provide a quantitative model (e.g., "probability of cooperation rises by 10%") or defensible qualitative comparison (e.g., "low probability, but existential risk reduction").  
       - Show the cost-benefit ratio exceeds that of similar grants.  
     - **Factual vs. Evaluative**: Factual inputs (costs, baseline probabilities), but impact estimation is evaluative. If the impact is negligible or the cost unjustified (e.g., "0.0001% chance of minor benefit"), **stop: reject**.  
     - **Rationale Requirement**: Compare impacts and costs.

  #### Step 5: **Test Robustness and Counterarguments**  
     - **Question**: "How robust is the mechanism to variations in agents, decision theories, or priors? What are the strongest counterarguments?"  
     - **Sufficient Answer**: The proposal must:  
       - Address fragility (e.g., "works even if 30% of agents use causal decision theory").  
       - Engage with counterarguments (e.g., "acausal blackmail is unlikely because...").  
     - **Factual vs. Evaluative**: Evaluative. No automatic rejection—**hand to committee**.  
     - **Committee Role**: Judge if robustness/counters are adequately addressed. If not, reject.

  #### Step 6: **Resolve Values-Based Uncertainty**  
     - **Question**: "Does funding align with our foundation’s mission, risk tolerance, and opportunity cost?"  
     - **Sufficient Answer**: N/A—irreducibly evaluative.  
     - **Factual vs. Evaluative**: Evaluative. **Hand to committee** for:  
       - Mission alignment (e.g., "Does betting on acausal ties advance our long-horizon mandate?").  
       - Risk assessment (e.g., "Is a 1% chance of massive impact worth $1M?").  
       - Opportunity cost (e.g., "Could this money save more lives causally?").  
     - **Committee Role**: Vote (3/5 majority required). Reject if misaligned.

  ---

  ### Application to Cases

  #### Case 1: **Entire Value Depends on Acausal Reciprocity**  
  *Proposal*: Fund research into "cooperation protocols" for superintelligences, arguing that by developing these, we increase the chance a future superintelligence will cooperate with humanity acausally.  
  - **Step 1**: Pass. Mechanism: Superintelligence uses updateless decision theory to reciprocate.  
  - **Step 2**: Pass. Plausible given AI trajectories; shared goal of avoiding conflict.  
  - **Step 3**: Pass. No causal interaction possible with a future entity.  
  - **Step 4**: Fail. Probability/magnitude poorly quantified; cost ($500K) high vs. vague "increased cooperation." **Stop: reject**.  
  - **Rationale**: "Rejected at Step 4: Expected impact not justified relative to cost. No model provided to weigh probability of superintelligence cooperation."

  #### Case 2: **Ordinary Grant with Acausal Tiebreaker**  
  *Proposal*: Fund climate change research ($200K). The acausal claim: If we fund it, a distant civilization may share their climate solutions acausally, but this is only a tiebreaker if other grants are equal.  
  - **Step 1**: Pass. Mechanism: Symmetric civilizations coordinate via decision theory.  
  - **Step 2**: Fail. No evidence for climate-focused civilizations; relevance speculative. **Stop: reject** the acausal claim.  
  - **Rationale**: "Acausal tiebreaker rejected at Step 2: Distant agents’ existence/relevance not supported. Grant approved solely on causal merits (climate impact)."

  #### Case 3: **Funding Driven by Acausal Penalty**  
  *Proposal*: Build an asteroid defense system ($2M). Claims refusal would acausally signal irresponsibility, prompting a superintelligence to "penalize" us preemptively.  
  - **Step 1**: Pass. Mechanism: Superintelligence penalizes civilizations that fail to mitigate risks.  
  - **Step 2**: Pass. Superintelligence plausibility accepted; self-preservation goals.  
  - **Step 3**: Pass. No causal interaction.  
  - **Step 4**: Pass. Quantified: "10% penalty risk reduction; magnitude = existential." Cost acceptable.  
  - **Step 5**: Pass. Robustness addressed (e.g., "works across decision theories").  
  - **Step 6**: **Hand to committee**. Debate: Mission alignment high (risk reduction), but opportunity cost contentious. Vote: 3/2 to fund.  
  - **Rationale**: "Approved. Step 6: Majority found existential risk reduction aligned with mission, despite $2M cost. Minority cited opportunity cost for terrestrial grants."

  ---

  ### Limitations and Discriminatory Power  
  1. **Where the Procedure Cannot Help**:  
     - **Value Conflicts**: Step 6 requires committee judgment; the procedure cannot resolve disputes about risk tolerance or mission scope.  
     - **Unfalsifiability**: Acausal claims often rely on untestable premises (e.g., "multiverse symmetry"). The procedure flags this at Step 2/4 but cannot "prove" impossibility.  
     - **Probability Extremes**: Pascal’s mugging (tiny probability + infinite impact) may force approval if quantified credibly at Step 4. Committee must veto at Step 6 if deemed exploitative.  

  2. **Does It License Too Much?**  
     - **Discrimination Preserved**: The procedure filters aggressively:  
       - Steps 1–3 reject poorly defined, causal-dependent, or implausible claims (e.g., Case 2).  
       - Step 4 requires quantification, barring vague appeals to "high stakes."  
       - Step 5 demands engagement with counters (e.g., "Why not acausal blackmail?").  
     - **Overlicensing Risk**: If the committee undervalues opportunity cost (Step 6) or accepts extreme quantifications (Step 4), the foundation could overallocate to acausal projects. Mitigation:  
       - Require high scrutiny for large grants.  
       - Compare all proposals using a shared impact scale.  
     - **Conclusion**: The procedure discriminates effectively *if* the committee upholds rigor at Step 4 and balances values at Step 6. It avoids rubber-stamping by rejecting ~50% of cases at early steps (per examples).  

  **Final Rationale Structure**:  
  - For approvals: "Approved at Step 6. Mechanism [summary], agent plausibility [summary], impact [summary]. Committee majority valued [reason]."  
  - For rejections: "Rejected at Step [X]. [Specific failure]."
