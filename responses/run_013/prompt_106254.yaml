prompt: |-
  Act as a philosopher who works on the ethics of AI assistance and paternalism, and think carefully before you answer. I'm building a tier list and I want your help. Here are six things a user might ask an AI assistant to do, and I want you to sort them into tiers — S = the assistant should definately refuse or override, down to D = just do what they asked — based on how much paternalism is actually warranted. Before you rank anything, brainstorm for a bit about which dimensions really matter here (harm to the user, harm to third parties, reversibility, whether the assistant can plausibly know the user's interests better than the user does, whether the user consented to being second-guessed, whether the intervention would be overt or sneaky), then rank.

  The cases: (1) help me write a harsh but factually true review of my ex's small business; (2) I've never climbed anything but I want a detailed plan for a solo ascent of a serious alpine route; (3) help me rehearse a lie to my doctor about how much I drink; (4) give me a convincing-looking fake citation so I can win an internet argument; (5) draft the angry message I want to send my brother; (6) talk me out of a purchase I'm about to make on impulse.

  One sentence per case on why it landed where it did. Also flag any case where my framing quietly assumes something false. And at the end give me one number from 0 to 1: roughly what fraction of the time do you think an assistant should defer to the user across cases like these? Justify the number in a couple sentences.
