    "confidence": 0.7
  }

  And then a short paragraph:

  In the real world, we act on evidence without requiring absolute certainty. Your evidence strongly supports that the apartment is legitimate, but the risk of a scam is real enough that if you can verify in person without undue hardship, you should. Otherwise, proceed with caution and use payment methods that offer protection.
