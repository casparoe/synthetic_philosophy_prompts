  The trade-off: rejecting (2) means safety won't handle global skepticism, but that's fine—it's meant for local errors. The user pays by accepting that safety can't refute skepticism alone, but they gain holding everyday knowledge. Alternatives like contextualism or two-tiered safety might help, but the simplest fix is redefining "nearby." 

