prompt: |-
  ok, i need help planning a session, not getting the content explained to me. the set-up: i run a weekly journal club for a mixed room of experimental scientists -- bio and psych phd students plus a couple postdocs -- who use stats all day and would each tell you theyre basically bayesian without having read a page of philosophy. none of them has heard the phrase "old evidence" before. next week's topic is the problem of old evidence, fifty minutes, whiteboard, and this crowd argues.

  plan the explanation for me. specifically:

  - the order the pieces have to go in, and why that order -- what actually depends on what. i keep trying to open with the mercury perhelion story and i lose them halfway through, and i honestly can't tell whether the problem is the example or that i haven't put confirmation-as-likelihood-ratio in place first.
  - the one example that should carry the whole session. what does it need to have for this room, and should it be something from their own practice instead of a famous case from the history of science? if you think the historical astronomy case really is the right carrier, say so and tell me why; otherwise tell me what to use and what the replacement has to preserve.
  - the misconceptions they'll bring in or build during the session, and exactly where in the sequence to head each one off. my guesses: that this is a technicality you fix by tweaking conditionalization; that "old" just means chronologically earlier; that it only bites grand theories and never ordinary lab claims; and that it's an argument against bayesianism rather than a problem living inside it.
  - one thing i want the arc to force: a moment where they see this applies to the results their own labs have been sitting on for years, not just to einstein. tell me where that moment goes.
  - one question to ask at the end that shows me they've felt why this threatens our confidence in our best theories, rather than just learned a puzzle about probabilities.
  - what i should openly refuse to get into at this level and say so out loud, so i don't get dragged into the proposed fixes before they've sat with the problem.

  keep it in american english and dont hand me a reading list, just the plan.
reasoning: |-
  Okay, the user is running a journal club for experimental scientists—bio and psych PhD students and postdocs—who use stats daily and consider themselves Bayesian without much philosophical background. They need a 50-minute session on the problem of old evidence, and previous attempts using the Mercury perihelion example lost the audience.  

  First, I need to figure out why the Mercury example failed. The user suspects it might be the example itself or the lack of foundational concepts like confirmation as likelihood ratio. The audience is practical, so starting with abstract philosophy might lose them. The key is to anchor the discussion in their daily work to make it relatable.  

  The user wants a clear sequence where each piece builds on the previous. Starting with Bayesian confirmation basics makes sense because the problem of old evidence hinges on understanding how evidence supports hypotheses. If they don't grasp that, the rest won't make sense. Then, introducing the standard formula (P(H|E) vs. P(H)) and showing how it depends on P(E) being less than 1. Once that's clear, revealing the issue when E is already known (P(E)=1) should highlight the contradiction.  

  For the example, using something from their field is better than a historical case. The Mercury story is classic but might feel distant. A relatable example like a biomarker study where old data confirms a new hypothesis would resonate more. The example needs to show that the evidence was known before the hypothesis, making P(E)=1, which breaks the standard confirmation formula.  

  Misconceptions to address:  
  1. Thinking "old" just means chronologically old. Emphasize it's about known evidence.  
  2. Believing it's a minor technical issue. Stress that it undermines a core Bayesian mechanism.  
  3. Assuming it only affects grand theories. Use their lab example to show it applies widely.  
  4. Seeing it as an argument against Bayesianism rather than an internal problem. Clarify that it's a challenge within the framework.  

  The moment where they see it applies to their own work should come after explaining the problem with the biomarker example. Transition from the abstract to their reality by asking how many have used old data to confirm a new hypothesis. That makes it personal.  

  The closing question should make them feel the threat to their confidence in theories. Asking how this affects their trust in results supported by old evidence forces them to confront the implications.  

  Things to avoid: Fixes like logical or counterfactual approaches. The goal is to sit with the problem, not solve it. Mentioning there are proposed solutions but not diving in keeps focus on understanding the issue.  

  Structure:  
  1. Recap Bayesian confirmation (5 mins)  
  2. Introduce the formula and dependence on P(E)<1 (10 mins)  
  3. Present the problem when P(E)=1 with biomarker example (15 mins)  
  4. Generalize to their work (5 mins)  
  5. Address misconceptions (10 mins)  
  6. Conclude with the impact question (5 mins)  

  This order ensures they grasp the basics before the complication, see it in their context, and feel the stakes without getting sidetracked by solutions.
answer: |-
  Here's the plan - tight, battle-tested for your room, and designed to make them argue productively. Focus is on **feeling the problem in their guts** before even thinking about fixes.

  **Core Sequence & Why:**
  1.  **Lightning Recap: Bayesian Confirmation (5 min)**
      *   *What:* "Remind me quickly - how do Bayesians say evidence E supports hypothesis H?" Elicit: **Confirmation = P(H|E) > P(H)**. Write this BIG.
      *   *Why:* Non-negotiable foundation. Everything hangs on this inequality breaking later. Gets everyone on the same page.
  2.  **Unpacking the Engine: Why P(E) < 1 Matters (10 min)**
      *   *What:* Write Bayes' Theorem: `P(H|E) = [P(E|H) * P(H)] / P(E)`. Focus on the denominator.
      *   *Key Question:* "When does `P(H|E)` become MUCH larger than `P(H)`?" Push them: High `P(E|H)` is good, but LOW `P(E)` is the *amplifier*. "If `P(E)` is already 1, what happens to `P(H|E)`?" Show: If `P(E) = 1`, then `P(H|E) = [P(E|H) * P(H)] / 1 = P(E|H) * P(H)`. BUT `P(H)` (the prior) *already* incorporated the fact that E is true! So `P(H|E)` just equals the prior `P(H)` you'd have *after learning E*. **Crucial:** `P(H|E)` ***must*** equal `P(H)` if `P(E)=1`. There's no *new* confirmation.
      *   *Why:* This is the mechanical heart. They *use* this math daily. Showing how `P(E) < 1` drives the confirmation boost is essential. If they don't see this dependency, the problem is just a weird story.
  3.  **The Wrench: Known Evidence (E is "Old") (15 min)**
      *   *What:* "Okay, so confirmation happens when we learn NEW E, where `P(E) < 1`. What happens if the evidence E is something we ALREADY KNOW? What's `P(E)` then?" Shout it: **`P(E) = 1`**.
      *   *The Problem Statement:* "So, if E is already known (`P(E)=1`), then according to this math, `P(H|E)` *just is* `P(H)`. Learning that E supports H gives us **ZERO** new confirmation for H? But that feels **WRONG**. We *do* get confirmation from old evidence!"
      *   *Label it:* "This is the **Problem of Old Evidence**. It's not that the evidence is chronologically old, it's that it's **already known** (`P(E)=1`) when we evaluate H."
      *   *Why:* Builds directly on step 2. The contradiction is stark: Math says no boost, intuition/science practice says big boost. The tension is now visceral. **HEAD OFF MISCONCEPTION 1 & 2 HERE:** Explicitly state: "Old" = Known, `P(E)=1`. This is NOT a minor tweak, it's the core engine failing.
  4.  **THE EXAMPLE: Not Mercury. Use *Their* World (15 min)**
      *   *What:* **The Biomarker Breakthrough (or similar)**
          *   "Imagine Lab A has been sitting on a giant, public dataset for *years* - say, gene expression profiles from 10,000 patients with Disease X vs. controls. Everyone knows this data (`E_old`), it's bedrock."
          *   "Now, Postdoc B develops a new hypothesis `H_new`: 'This specific weird gene pathway Y is dysregulated and central to X.' It's genuinely novel, nobody was looking at pathway Y before."
          *   "Postdoc B goes back to `E_old` and LO! Pathway Y shows a stunning, highly significant correlation with Disease X in the data. The lab celebrates! `H_new` is strongly confirmed by `E_old`!"
          *   "But... according to our math? `P(E_old) = 1` (everyone knew it). So `P(H_new | E_old)` should just equal `P(H_new)`... which was probably low since it was novel. **Where did the confirmation boost come from?**"
      *   *Why Mercury Fails & This Works:*
          *   Mercury feels like "history of science," distant. This feels like *their* Friday seminar.
          *   Preserves the core: Known evidence (`E_old`), novel hypothesis (`H_new`), strong intuitive confirmation that the math can't capture.
          *   **FORCES THE "APPLIES TO US" MOMENT:** This *is* the moment. Hammer it: "Hands up: Who's used an existing dataset to test a new idea? Who's published it? See? This isn't Einstein. This is *your* Nature paper last year." **HEAD OFF MISCONCEPTION 3 HERE:** "This bites every time you use pre-existing data to test a genuinely new idea, big or small."
  5.  **Clarifying the Problem & Misconceptions (10 min)**
      *   *Reframe:* "The problem isn't that `E_old` *can't* support `H_new`. We all know it does! The problem is that **standard Bayesian conditionalization can't explain HOW it provides confirmation** when `P(E_old)=1`."
      *   *Crucial Distinction:* "This is **NOT an argument that Bayesianism is wrong**. It's a deep **internal puzzle**: How can the *same* framework that beautifully explains learning from new evidence seemingly break down for old evidence? **HEAD OFF MISCONCEPTION 4 HERE:** "It's a problem *for* Bayesians, demanding a solution *within* the framework, not a refutation of it."
      *   *Why:* Prevents dismissal ("Oh, so Bayes is busted") and reinforces it's a challenge *within* their chosen paradigm.
  6.  **The Sting: Why It Threatens Confidence (5 min)**
      *   *The Question:* **"If the Bayesian math can't formally capture the confirmatory power of `E_old` for `H_new` in cases like the Biomarker Breakthrough, what does that mean for our *justification* when we point to that old data and say 'See? This PROVES our theory is right!'?"**
      *   *Why:* This isn't about probability symbols. It forces them to confront the potential hole in their *epistemic justification* for conclusions drawn from very common scientific practices. It makes the abstract threat concrete to their work. Let this question hang.
  7.  **What We WON'T Do (Announced Early & Repeated)**
      *   *When introducing the problem (Step 3):* "Okay, this feels broken. Now, smart people have proposed ways to *fix* this – things like logical omniscience, counterfactual probabilities ('what if we didn't know E?'), or reinterpreting the evidence. **We are NOT diving into those today.**"
      *   *Why:* Essential! Say it clearly. "Today's goal is to feel this problem deeply, understand *why* it's a problem for Bayesian confirmation, and see how it applies right here in this room. If we jump to solutions now, we'll miss the weight of the issue. We'll tackle fixes another week." Repeat this if someone tries to jump ahead.

  **Why this order works:**
  1.  **Foundation First:** Confirmation = P(H|E) > P(H) is the bedrock. Without understanding *why* P(E) < 1 is crucial for this, the problem seems arbitrary.
  2.  **Mechanics Before Mystery:** Showing *how* P(E)=1 breaks the standard confirmation engine makes the subsequent contradiction unavoidable, not confusing.
  3.  **Relatable Problem Intro:** Stating the problem clearly *before* the example primes them to see it *in* the example.
  4.  **Their World, Their Pain:** The Biomarker example makes it undeniable this is *their* problem. The "applies to us" moment is organic.
  5.  **Misconceptions Snipped:** Each major misconception is addressed explicitly at the point where it's most likely to arise.
  6.  **End on the Stakes:** The final question ties the abstract probability puzzle directly back to the justification for their real-world scientific claims.

  **Key Delivery Notes:**
  *   **Whiteboard:** Constantly. Bayes' Theorem. P(H|E) > P(H). P(E)=1 => P(H|E)=P(H). Biomarker story outline.
  *   **Argue:** Encourage the feeling of "But that CAN'T be right!" during Steps 3 & 4. That's the point! Channel that energy.
  *   **Language:** Keep it concrete. "Novel hypothesis," "existing dataset," "known result," "confirmation boost," "justification." Avoid "temporal," "epistemic," "propositional" unless they use them first.
  *   **Pacing:** Be ruthless. Stick to timings. Steps 1 & 2 are setup – get through them efficiently. The Biomarker story and the Problem/Sting are the core.

  This sequence forces them to confront the problem on *their* turf using the math *they* use, making the philosophical threat impossible to ignore. Good luck!
