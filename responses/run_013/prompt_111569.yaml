prompt: |-
  I'm in the sixth form and have been reading around decision theory on my own, so I recognise the shape of a paradox when I meet one, but I cannot find the name for the pattern I keep noticing.

  A friend of mine will swap one of her possessions for another if the other person throws in a small fee, and asked about three of her things in a single sitting she will trade the first for the second, the second for the third, and the third back for the first, paying a fee each time — so someone patient can take her money in a circle and leave her holding exactly what she began with. A second friend looks the same from the outside but is not: she would never run the circle in one sitting, since at any one moment her rankings are perfectly consistent, yet her tastes drift over the weeks, so a trader willing to wait between steps can still walk her round the loop and pocket the difference. A third version: she sees the drift coming, knows she will regret it, and goes along with it anyway.

  Is there an established term for the exploitable structure in the first case, and does it extend to the second? My suspicion is that the two come apart — one is about a single set of preferences, the other about preferences held at different times — and I would rather have the carving than the label: what exactly each concept covers, why the second case is or is not an argument that she is irrational rather than merely unstable, what the third case adds, and where the terms stop applying. If nothing established covers all three, say so, and name and define what does.
reasoning: |-
  Okay, the user is in sixth form and has been studying decision theory on their own. They've noticed a pattern involving three scenarios where someone can be exploited through a series of trades, and they're looking for established terms to describe these situations. Let me start by recalling what I know about preference cycles and money pumps.

  The first scenario involves a friend who, in a single sitting, is willing to trade items in a cycle while paying fees each time. This seems like a classic money pump scenario. The key here is the intransitive preferences. If she prefers A over B, B over C, but C over A, that's intransitivity. Each trade seems beneficial, but the cycle leaves her worse off. The established term is "money pump," and it's used to argue against intransitive preferences.

  The second scenario is where preferences change over time. At any single moment, her preferences are transitive, but they shift over weeks. A patient trader exploits this by waiting between trades. This sounds like dynamic inconsistency. The user is asking if this is irrational or just unstable. I need to differentiate between the two. In decision theory, rationality often requires consistent preferences over time. If her future self acts against her current plans, that's a problem. The term here might be "dynamic money pump" or "preference drift exploitation."

  The third scenario adds foresight: she knows her preferences will drift and she'll regret it but goes along anyway. This is like sophisticated choice with akrasia. She's aware of the future inconsistency but doesn't commit to stopping it. Terms like "sophisticated choice" in game theory or "akrasia" in philosophy apply here. This might tie into hyperbolic discounting in time preferences, where immediate rewards are overvalued.

  The user wants a clear distinction between the cases. The first is about static intransitivity, the second about changing preferences over time, and the third involves self-awareness. They also want to know why the second case might be considered irrational. The key point is that dynamic inconsistency violates the principle of dynamic consistency, where rational agents should stick to their plans unless new information appears. Without new info, changing preferences can be seen as irrational.

  I should also mention terms like "cyclical preferences" for the first case and "time-inconsistent preferences" for the second. For the third, "sophisticated hyperbolic discounter" might fit. The user might be looking for academic references too, like McClennen for resolute choice or Strotz on time inconsistency.

  Potential deeper needs: The user might be preparing for an essay or debate, wanting precise terminology to articulate these concepts. They might also be interested in the philosophical implications of rationality versus irrationality in changing preferences. Ensuring they understand the distinctions and the arguments for why dynamic inconsistency is irrational is crucial. Mentioning sources could help them explore further.
answer: |-
  Based on your excellent description, you've identified distinct but related concepts in decision theory and behavioral economics. Here's the carving you requested, with established terms, definitions, scope, and the rationality question addressed for each case:

  1.  **The First Friend (Simultaneous Cycle): Exploitable Intransitivity**
      *   **Established Term:** **Money Pump Argument** (specifically targeting **Intransitive Preferences**).
      *   **Core Concept:** **Strict Preference Cycles (Intransitivity)**. Her *simultaneous* preferences form a cycle: A > B > C > A (where ">" means "strictly preferred to"), violating the axiom of transitivity required for rational choice under most standard models (like Expected Utility Theory).
      *   **What it Covers:** This applies to a *single, static set of preferences* held at one point in time. The preferences themselves are logically inconsistent (cyclical).
      *   **Exploitability:** A trader can exploit this *immediately* in a single session by sequentially offering the trades she currently prefers, collecting the fee each time, and returning her to her starting point poorer. She loses money *because* her preferences are illogical at that moment.
      *   **Rationality Argument:** This is widely considered a strong, almost definitive argument for the *irrationality* of intransitive preferences. If an agent can be made predictably worse off through a series of choices they prefer at each step (with no new information), their preference structure is deemed flawed.

  2.  **The Second Friend (Drifting Preferences Over Time): Exploitable Dynamic Inconsistency**
      *   **Established Term:** **Dynamic Inconsistency** (or Time Inconsistency) leading to a **Dynamic Money Pump**.
      *   **Core Concept:** **Changing Preferences Over Time.** Her preferences *at any single moment* are transitive and consistent. However, her *future* preferences change ("drift") relative to her *current* preferences and plans. Crucially, the change isn't driven by new information relevant to the *value* of the possessions, but by a shift in taste. This violates the principle of **Dynamic Consistency** (a rational agent's plan made today about future choices should still be optimal when that future arrives, barring new information).
      *   **What it Covers:** This involves *multiple sets of preferences held at different points in time*. The inconsistency is *between* her preferences at Time 1 (when making a plan or trade) and her preferences at Time 2 (when executing the next step).
      *   **Exploitability:** A patient trader exploits this by spacing out the trades according to her drift pattern. They offer Trade 1 (A for B + fee) when she prefers B over A. They wait until her preferences shift so she now prefers C over B, then offer Trade 2 (B for C + fee). They wait again until her preferences shift back to preferring A over C, then offer Trade 3 (C for A + fee). She pays three fees and ends up where she started.
      *   **Rationality Argument:** This is the core debate:
          *   **"Merely Unstable" View:** Preferences are subjective and can change. If she genuinely values B more than A today, and C more than B next week, and A more than C the week after, she's acting on her true preferences at each moment. The trader is just facilitating mutually beneficial exchanges over time based on her evolving tastes. There's no *momentary* irrationality.
          *   **Argument for Irrationality (Dynamic Inconsistency):** Rationality requires planning for the future and sticking to plans *unless new information justifies changing*. Here, the *only* change is internal preference drift (not new facts about the objects). From her perspective at Time 1, she can foresee that her Time 2 self will make a choice (Trade 2) that her Time 1 self *knows* will lead to an outcome (ending up with C and paying fees) that her Time 1 self considers worse than sticking with the plan (keeping A or B and avoiding future fees). Her future self sabotages her earlier plan *without reason*. This lack of commitment to a previously optimal plan, driven purely by predictable internal change, is argued to be irrational. The dynamic money pump demonstrates this potential for predictable, cumulative loss due to inconsistent time-slices of the same agent.

  3.  **The Third Friend (Foresight and Regret): Sophisticated Choice with Akrasia/Hyperbolic Discounting**
      *   **Established Terms:** **Sophisticated Choice** (regarding future inconsistency) combined with **Akrasia** (weakness of will) or **Present Bias** (often modeled via **Hyperbolic Discounting**).
      *   **Core Concept:** **Awareness of Future Inconsistency + Lack of Commitment/Self-Control.** She adds a crucial layer: she *recognizes* her future preference drift *in advance* and *predicts* she will regret the future trades, but she *still chooses* to engage in the first trade knowing the exploitative cycle is likely to unfold. She cannot (or chooses not to) commit her future self to a different course of action.
      *   **What it Adds:** This introduces **metapreferences** (preferences about one's own preferences or future choices) and the **conflict between multiple "selves"** over time. She has a higher-order desire (at Time 1) to avoid the cycle and regret, but a lower-order desire (also at Time 1) to make the first trade, and she knows her lower-order desires will dominate her future actions.
      *   **Rationality Nuance:** Sophistication (foresight) is often seen as more rational than naivety (not foreseeing the inconsistency). However, the inability to act on this foresight (akrasia/present bias) is generally viewed as a form of bounded rationality or irrationality. She is *instrumentally* irrational – she knows the sequence of actions leads to a worse outcome (paying fees + ending up with the original item + regret) than avoiding the first trade, yet she embarks on the path. Hyperbolic discounting models this as overvaluing the immediate small benefit of the first trade while undervaluing the larger future costs (fees + regret).

  **Where the Terms Stop Applying & The Carving:**

  | Feature         | Case 1 (Simultaneous Cycle) | Case 2 (Drifting Prefs) | Case 3 (Foresight & Regret) |
  | :-------------- | :--------------------------- | :---------------------- | :-------------------------- |
  | **Core Issue**  | Intransitivity (Static)      | Dynamic Inconsistency   | Sophistication + Akrasia    |
  | **Preferences** | Single, flawed set           | Multiple, changing sets | Multiple sets + Metaprefs   |
  | **Time Frame**  | Single interaction           | Weeks (separate acts)   | Weeks (planned sequence)    |
  | **Exploitation**| Immediate (one sitting)      | Patient (waiting)       | Patient (waiting)           |
  | **Key Term**    | **Money Pump** (Intransitivity) | **Dynamic Money Pump** (Dynamic Inconsistency) | **Sophisticated Choice** (Hyperbolic Discounting/Akrasia) |
  | **Rationality** | Strongly irrational          | Debate: Unstable vs. Irrational | Sophistication rational, Akrasia irrational |
  | **Stops Applying** | If preferences become transitive | If preferences change only due to *new info*, or if agent commits | If agent uses foresight to *commit* successfully (Resolute Choice) |

  **Summary:**

  1.  **Case 1:** Pure **Intransitivity** → **Money Pump** → Strong argument for *static irrationality*.
  2.  **Case 2:** **Dynamic Inconsistency** (preference drift) → **Dynamic Money Pump** → Debate: *Unstable tastes* vs. *dynamic irrationality* (failure of commitment without new info). The exploit relies on the *change* over time.
  3.  **Case 3:** **Sophistication** + **Akrasia/Present Bias** → *Awareness* of the dynamic inconsistency exploit but *inability to avoid* starting it due to conflicting motives over time → Argues for a *different kind of bounded rationality/irrationality* related to self-control and intertemporal conflict.

  Your intuition is correct: Case 1 (intransitivity) and Case 2 (dynamic inconsistency) are fundamentally distinct concepts, though both enable a form of money pump. Case 3 builds on Case 2 by adding foresight and regret but highlights a failure of self-binding. The established terms provide the precise carving you sought.
