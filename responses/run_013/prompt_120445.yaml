answer: |-
  Below is a complete activity plan designed for your 90-minute graduate seminar, including rules, materials, timeline, scoring, debrief, and anticipated challenges. The activity focuses on the difference between **uncertain evidence** (which shifts but doesn’t settle probabilities, leading to order-dependent updates) and **certain evidence** (which settles questions, with order-independent updates). Participants experience this through Jeffrey conditionalization and contrast it with Bayesian updating.

  ---

  ### **Activity: Shifting vs. Settling Evidence**  
  **Objective**: To feel how uncertain evidence updates probabilities in a correlated system, revealing order dependence, and contrast it with independent/certain evidence.

  ---

  ### **Rules and Setup**  
  **Scenario**:  
  - A hidden object has two features: **Color** (Red or Blue) and **Shape** (Round or Square).  
  - **True probabilities** (unknown to students):  
    - `P(Red) = 0.5`, `P(Blue) = 0.5`  
    - `P(Round | Red) = 0.8`, `P(Square | Red) = 0.2`  
    - `P(Round | Blue) = 0.2`, `P(Square | Blue) = 0.8`  

  **Gameplay**:  
  1. **Initial Credence**: Each participant starts with 100 "credence units" (points) distributed over four cells:  
     - Red-Round (RR), Red-Square (RS), Blue-Round (BR), Blue-Square (BS).  
     - **Prior distribution**: RR = 40, RS = 10, BR = 10, BS = 40 (since `P(RR) = 0.5 × 0.8 = 0.4`, etc.).  

  2. **Readings (Uncertain Evidence)**:  
     - Two readings arrive (Color and Shape).  
     - **Reading rule**: Each reading leaves participants with **0.8 credence** in the reported feature (e.g., a "Red" reading sets `P(Red) = 0.8`), but provides **no further information**.  
     - **Updating rule (implicit goal)**:  
       - When updating on a feature (e.g., Color), adjust its marginal probability to 0.8.  
       - **Keep the conditional distribution of the other feature fixed** within each level of the updated feature (e.g., after a Color update, keep `P(Shape | Color)` unchanged from its previous value).  
     - ⚠️ **Penalty**: Updating by "collapsing and renormalizing" (e.g., setting disfavored colors to 0 and rescaling) will be penalized by the scoring rule.  

  3. **Order Dependence**:  
     - Split the room into **Group A** and **Group B**.  
     - Both groups get the **same hidden object** and the **same two readings**, but in **opposite orders**:  
       - Group A: Color reading → Shape reading.  
       - Group B: Shape reading → Color reading.  
     - Due to correlation, final credences for the same feature will differ between groups (e.g., `P(Red)` ≈ 0.85 for Group A vs. 0.80 for Group B).  

  4. **Scoring (Quadratic Scoring Rule)**:  
     - After updates, the true object is revealed.  
     - **Score** for a participant with credences `(p_RR, p_RS, p_BR, p_BS)` if the true cell is `i`:  
       \[
       \text{Score} = 100 \times \left(2p_i - \sum_{\text{all cells}} p_j^2 \right)
       \]  
     - **Why quadratic?**: Proper scoring rule incentivizes honest reporting. High scores reward accurate high credence in the truth and penalize overconfidence.  
     - **Example**: If true state is RR and a participant has `p_RR = 0.75`, `p_RS = 0.10`, `p_BR = 0.05`, `p_BS = 0.10`:  
       \[
       \text{Score} = 100 \times \left(2 \times 0.75 - (0.75^2 + 0.10^2 + 0.05^2 + 0.10^2)\right) = 100 \times (1.5 - 0.5925) = 90.75
       \]  

  ---

  ### **Materials**  
  - **Per Participant**:  
    - Worksheet with grids for the four cells (RR, RS, BR, BS).  
    - Calculator (for scoring).  
  - **Instructor Materials**:  
    - Method to generate hidden objects (e.g., R script, Python, or physical cards with pre-drawn objects matching the prior).  
    - Method to simulate readings (e.g., random number generator; for a true color, report "Red" with 80% probability, "Blue" with 20%).  
  - **Reveal Mechanism**: Envelopes or digital reveal for the true object.  

  ---

  ### **Timeline (90 Minutes)**  

  1. **Introduction (15 min)**:  
     - Explain the hidden object, features, and prior distribution (show why RR=40, RS=10, etc.).  
     - Define readings: "Each reading forces your marginal credence in a feature to 0.8 but gives no other information."  
     - Introduce scoring rule (emphasize it rewards calibration).  
     - **Split into Group A and Group B**.  

  2. **Round 1: Correlated Features (35 min)**:  
     - **Step 1 (5 min)**: Instructor generates one hidden object (e.g., Red-Round) and readings (e.g., Color="Red", Shape="Round").  
     - **Step 2 (15 min)**:  
       - Group A updates on Color first (set `P(Red)=0.8`), then Shape (set `P(Round)=0.8`).  
       - Group B updates on Shape first (set `P(Round)=0.8`), then Color (set `P(Red)=0.8`).  
     - **Instructor support**:  
       - Circulate and hint: "Remember, the reading doesn’t eliminate possibilities—keep conditionals fixed."  
       - If groups struggle, remind: "After a Color update, what should `P(Round | Red)` be? It hasn’t changed from the prior/current state."  
     - **Step 3 (10 min)**: Reveal true object. Participants calculate scores.  
     - **Step 4 (5 min)**: Groups report final `P(Red)` and `P(Round)`.  
       - **Expected outcome**:  
         - Group A: `P(Red) ≈ 0.85`, `P(Round) = 0.80`  
         - Group B: `P(Red) = 0.80`, `P(Round) ≈ 0.85`  

  3. **Round 2: Independent Features (20 min)**:  
     - **New prior**: Assume independence (`P(Round | Red) = P(Round | Blue) = 0.5`). Prior: RR=25, RS=25, BR=25, BS=25.  
     - Repeat process with new hidden object and readings (same orders).  
     - **Reveal**: Final credences are identical regardless of order (e.g., `P(Red)=0.8`, `P(Round)=0.8` for both groups).  

  4. **Debrief (20 min)**:  
     - **Key moments from the game**:  
       - **Order effect in Round 1**: "Why did Group A end up more confident in Red than Group B?"  
         - → *Uncertain evidence shifts margins but leaves conditionals rigid, causing path dependence*.  
       - **Contrast with Round 2**: "Why did order stop mattering?"  
         - → *When features are independent, conditionals don’t shift, so updates commute*.  
       - **Scoring**: "Did anyone get penalized for collapsing? What did it feel like?"  
     - **Conceptual bridge**:  
       - **Uncertain evidence** (e.g., a blurry photo): Shifts weights but preserves conditionals (Jeffrey conditionalization). Order matters under correlation.  
       - **Certain evidence** (e.g., a clear measurement): Settles a feature (Bayesian conditionalization). Order-independent.  
       - **Why rigid conditionals?**: Stipulate that the reading doesn’t change your beliefs about how features relate—only the marginal. (The game can’t prove this; it’s built into the design.)  
     - **Objection handling**:  
       - "Why not condition on the reading itself as certain evidence?"  
         - → "The reading is *about* the feature but doesn’t *settle* it. You’re told to set `P(Red)=0.8`, not that Red is true."  
       - **Limitations**: The game assumes conditionals are rigid and readings are independent given features. Real-world cases may differ.  

  ---

  ### **What Will Go Wrong (and Solutions)**  
  1. **Participants "collapse and renormalize"**:  
     - **Signs**: Final distributions have 0 credence in disfavored features (e.g., after a "Red" reading, Blue cells = 0).  
     - **Solution**: Penalize with scoring (e.g., collapsing yields ~40–60 points vs. 80+ for correct updates). Use hints: "Remember, `P(Blue)` isn’t 0—it’s 0.2!"  

  2. **Confusion on conditional probabilities**:  
     - **Signs**: Struggling to compute `P(Color | Shape)` after first update.  
     - **Solution**: Provide a worksheet with formulas:  
       - After Shape update: `P(Red | Round) = \frac{\text{Current RR}}{\text{Current RR} + \text{Current BR}}`  

  3. **Time pressure**:  
     - **Solution**: Run Round 1 with one reading first (e.g., only Color) to practice, then add the second.  

  4. **Order effect not dramatic**:  
     - **Solution**: Use extreme numbers (e.g., `P(round | red)=0.9`, `P(round | blue)=0.1`) to amplify differences.  

  ---

  ### **What the Activity Cannot Show**  
  - **Why conditionals stay rigid**: The game stipulates this rule; it doesn’t prove rigidity. Defend it: "The reading only directly affects Color; you learn nothing new about how Shape relates to Color."  
  - **Readings as events vs. constraints**: Participants update to constraints (`P(Red)=0.8`), not events ("I saw a red signal"). The game can’t justify this choice—it’s baked into the design.  

  ---

  ### **Instructor Script Snippets**  
  - **During updates**:  
    > "You just got a Color reading: 'Red'. Set your marginal `P(Red)` to 0.8. But ask: What is `P(Round | Red)` *now*? Has the reading changed it? If not, keep it from your last state."  

  - **Debrief**:  
    > "In Round 1, Group A updated Color first and ended up more confident in Red than Group B. Why? Because when they updated Shape second, the conditional `P(Red | Round)` was already high from the first update. Uncertain evidence moves the weights and leaves the conditionals alone—so order matters. But when evidence is certain (or features independent), order doesn’t matter... because conditionals either don’t shift or don’t interact."  

  ---

  This activity creates an experiential foundation for discussing Jeffrey conditionalization, commutativity, and the semantics of uncertain evidence. Pair with follow-up readings (e.g., Jeffrey's *Subjective Probability*, Diaconis & Zabell on updating) for deeper theory.
