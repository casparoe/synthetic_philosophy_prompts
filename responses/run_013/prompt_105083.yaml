answer: |-
  Below is a decision tree designed for a grad seminar on futarchy, starting from the shared premise that prediction markets are decent at forecasting. Each node is a question students can answer without knowing which "camp" it leads to, focusing on the **real fault lines** (binding vs. advisory, conditional markets, metric definition, participation, and manipulation). Leaves are named positions (or "unnamed" if no clear defenders), with their "ugliest commitment" highlighted. I'll note where positions can't be cleanly separated and flag my least confident branch.

  ---

  ### **Futarchy Decision Tree**  
  **Start:** Everyone grants that prediction markets are decent at forecasting *some* things.

  #### **Node 1: Should policymakers be forced to obey the market’s verdict?**  
  *(Fault line: Binding authority vs. advisory input)*  
  - **Yes** → Go to Node 2.  
  - **No** → **Leaf: Advisory Futarchy**  
    - *Named position?* Yes (e.g., Sunstein-style "governance by indicators").  
    - *Ugliest commitment:* Must accept that elected leaders may ignore the market’s advice for political or self-interested reasons, even when the market is clearly right.  

  #### **Node 2: Should bets require observing a policy’s *actual effect*?**  
  *(Fault line: Conditioning on policy adoption vs. unconditional forecasting)*  
  - **Yes** → Go to Node 3.  
  - **No** → **Leaf: Unconditional Forecasting Futarchy**  
    - *Named position?* Unnamed (rarely defended; collapses causality).  
    - *Ugliest commitment:* Must swallow that markets will price *correlations* (e.g., "good outcomes happen when Policy X passes") rather than *causal effects*, risking policies that are popular but ineffective.  

  #### **Node 3: How do we resolve the counterfactual problem?**  
  *(Fault line: Observability of policy outcomes)*  
  - **"Use two markets: one betting on outcome if policy passes, one if it fails"** → Go to Node 4.  
  - **"Bet on a proxy metric (e.g., GDP) that won’t require observing the counterfactual"** → **Leaf: Proxy Metric Futarchy**  
    - *Named position?* Hanson’s original proposal.  
    - *Ugliest commitment:* Must accept that the proxy (e.g., GDP) can be gamed or become misaligned with welfare (e.g., GDP rises while inequality soars).  

  #### **Node 4: Who defines the welfare metric?**  
  *(Fault line: Metric-setting power)*  
  - **Elected representatives** → Go to Node 5.  
  - **Impartial experts/technocrats** → **Leaf: Technocratic Metric Futarchy**  
    - *Named position?* Yes (e.g., some effective altruist proposals).  
    - *Ugliest commitment:* Experts are vulnerable to ideology, groupthink, or capture by elites, making the metric undemocratic.  
  - **A separate prediction market** → **Leaf: Recursive Futarchy**  
    - *Named position?* Yes (Hanson’s later work).  
    - *Ugliest commitment:* Infinite regress—markets setting metrics for markets—risking incoherence or metrics that chase volatility.  

  #### **Node 5: Who participates in the markets?**  
  *(Fault line: Trader inclusivity)*  
  - **All citizens (with subsidies for the poor)** → Go to Node 6.  
  - **A paid, subsidized expert class only** → **Leaf: Trader Aristocracy Futarchy**  
    - *Named position?* Unnamed (implied in some proposals).  
    - *Ugliest commitment:* Creates a privileged policymaking elite detached from the lived experience of citizens.  

  #### **Node 6: Can market manipulation justify intervention?**  
  *(Fault line: Vulnerability to capital-based attacks)*  
  - **Yes, add safeguards (e.g., bet caps, delay rules)** → **Leaf: Safeguarded Democratic Futarchy**  
    - *Named position?* Unnamed (pragmatic reform position).  
    - *Ugliest commitment:* Safeguards create bottlenecks, bureaucratic costs, and new forms of gaming (e.g., regulators manipulated).  
  - **No, trust the market’s self-correction** → **Leaf: Purist Democratic Futarchy**  
    - *Named position?* Hanson’s core position.  
    - *Ugliest commitment:* A wealthy actor could spend $1B to nudge a market, trigger a harmful policy, and still profit if they hold external assets (e.g., shorting a related market).  

  ---

  ### **Key Notes**  
  1. **Indistinguishable Leaves:**  
     - **Trader Aristocracy Futarchy** and **Technocratic Metric Futarchy** can blur together. Both centralize power in elites—either traders or metric-setters. The tree can’t fully separate them because many real-world proposals delegate *both* tasks to experts.  
     - **Advisory Futarchy** and **Safeguarded Democratic Futarchy** overlap in practice. Both add human oversight; the tree splits them based on *when* oversight kicks in (pre- vs. post-market).

  2. **Least Confident Branch:**  
     - **Node 3 (Counterfactual Problem)**. I’m unsure whether "proxy metric" proposals belong here or as a sibling to Node 4. Current placement assumes proxy metrics avoid counterfactuals, but critics argue they don’t (e.g., you still need to measure GDP *if* the policy passes).  
     - **What would change my mind?** Evidence that proxy metrics (e.g., GDP) *can* reliably avoid counterfactual noise (e.g., via natural experiments). If so, merge Node 3 into Node 4.

  ---

  ### **Tree Summary**  
  ```  
  START  
  │  
  ├─ Node 1 (Binding?) → No → Leaf: Advisory Futarchy  
  │  
  └─ Node 1 → Yes →  
     │  
     ├─ Node 2 (Conditional?) → No → Leaf: Unconditional Forecasting Futarchy  
     │  
     └─ Node 2 → Yes →  
        │  
        ├─ Node 3 (Counterfactual) → Proxy Metric → Leaf: Proxy Metric Futarchy  
        │  
        └─ Node 3 → Two Markets →  
           │  
           ├─ Node 4 (Metric-Setter) → Reps → Node 5  
           │  
           ├─ Node 4 → Experts → Leaf: Technocratic Metric Futarchy  
           │  
           └─ Node 4 → Separate Market → Leaf: Recursive Futarchy  
              │  
              └─ Node 5 (Participation) → Experts → Leaf: Trader Aristocracy Futarchy  
              │  
              └─ Node 5 → All Citizens →  
                 │  
                 └─ Node 6 (Manipulation Safeguards?) → Yes → Leaf: Safeguarded Democratic Futarchy  
                 │  
                 └─ Node 6 → No → Leaf: Purist Democratic Futarchy  
  ```  

  This tree isolates core tensions (e.g., binding authority vs. democratic oversight, metric corruption vs. flexibility) and forces students to confront trade-offs. Use it to spark debate about whether futarchy resolves public-choice problems or recreates them in markets.
