answer: |-
  **Bottom line:** A text's meaning is determined by the author's *manifestable* intent—what they could reasonably expect a competent reader to grasp using context, convention, and the text itself—except in formal or legal contexts, where explicit wording governs absent provable mutual understanding; when intent is inaccessible, incoherent, or privately divergent from public meaning, the competent reader's interpretation prevails.  

  ### The Principles, with Cases Motivating Each Clause:  
  1. **Authorial intent controls *if* it is manifestable through text and context.**  
     - *Motivated by:* Your grandmother's poem. When she adopted "goats" and recontextualized the poem, her intent became manifestable (through her note and the altered text), overriding the original error.  
     - *Also applies to:* The Lithuanian neighbor's letter. Context (his immigration status, local property disputes) makes "no interest" manifestably about ownership, not indifference.  

  2. **Public/conventional meaning overrides private intent when the latter is undiscoverable or conflicts with shared understanding.**  
     - *Motivated by:* The "corn" letter and the songwriter. Your great-great-uncle privately intended maize, but convention ("corn" = oats in that valley) governs because he used communal language without signaling a deviation. The songwriter's private drowning meaning is inaccessible from the text, so the reader's cowardice interpretation stands.  

  3. **Formal/legal documents prioritize explicit wording over intent unless context confirms mutual understanding of a shared convention.**  
     - *Motivated by:* The will. The phrase "eldest son" must denote the biological eldest unless evidence shows the community (e.g., family, legal witnesses) consistently used "eldest" for the raised son. You lack this, so the text’s wording prevails. (This forces you to abandon your verdict—see below.)  
     - *Also applies to:* Anonymous diary with a code. Once the cipher is revealed, the text never meant its surface reading; it was never "English" but a formal system.  

  4. **When authorial intent is absent or fragmented (e.g., committees, generated text), meaning defaults to the competent reader’s interpretation.**  
     - *Motivated by:* Your text-generator joke and committee history. No singular intent exists, so careful reader interpretation defines meaning.  

  ### Predictions for New Cases:  
  - **Obvious case (public meaning):** A 1920s diary entry states, "I met with the President." In the author’s small town, "President" conventionally meant the head of the local society. Despite the author later claiming they meant the U.S. President, the text means the society head—the manifestable context overrides private intent.  
  - **Strained case (formal document):** A deed grants "the oak tree" to a neighbor. The author intended a specific maple (proven by letters), and the neighbor knew this. But the deed says "oak," and no mutual understanding is documented. The oak legally conveys, though it feels unjust—the explicit wording governs.  

  ### Verdicts You Must Give Up:  
  - **The will:** Your verdict (orchard goes to the actual eldest) contradicts Principle 3. Unless you can prove mutual understanding (e.g., family letters confirming "eldest son" always referred to the raised son), the text’s explicit wording must stand. Your view that it’s "correct" beyond legality isn’t saved—intent loses to formalism here.  
  - **Grandmother’s sister claim:** Principle 1 resolves this. Her later intent about the sister isn’t manifestable—the text’s details fit the brother, and she offered no new context (e.g., a revised poem). Defer to the text: the poem isn’t about her sister.  

  ### Why Your Other Verdicts Stand:  
  - **"Corn" letter:** Principle 2 saves it—public meaning (oats) overrides private intent (maize).  
  - **Songwriter:** Principle 2 saves it—reader interpretation wins as the drowning intent isn’t manifestable.  
  - **Lithuanian letter:** Principle 1 saves it—context makes the ownership intent manifestable.  
  - **Diary:** Principle 3 saves it—once the code is known, the text’s "meaning" is voided.  
  - **Generated text/committee:** Principle 4 saves it—reader interpretation fills the void.  

  ---  
  **Final note:** This framework accepts that meaning can shift (like your grandmother’s poem) but anchors it to what is demonstrably *communicable*. When intent and convention clash irreconcilably (e.g., the will), the text’s role as a public artifact dominates.
