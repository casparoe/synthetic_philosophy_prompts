  Final question: Is the strange loop just a fixed point or a quine dressed up?

  Answer: There is more to it than just a fixed point or a quine. A quine is syntactic self-reproduction (a) and does not capture the semantic aboutness (b) or the self-representation (c). A fixed point (in the recursion theorem) is about self-reproduction with parameters and is syntactic at its core. Hofstadter's strange loop is primarily about (d) the tangled hierarchy and the level-crossing that allows the system to have a self-representation that is active and has causal power. This is a combination of (b) and (c) with the added feature of (d). The survival in translation is the idea of a self-interpreter that is used by the system to reflect on itself and that this reflection is part of the system's operation, creating a loop that feels like a self. What survives is the requirement for a reflective system that can model itself and that the model must be used in a way that affects the system's behavior (thus being a "loop"). The fixed point is the mathematical manifestation, but the strangeness is the level-crossing and the avoidance of infinite regress.

  Residue report:
  - The causal power claim: Hofstadter's insistence on the self-symbol having causal power is a claim that your vocabulary can capture only in a derived sense (as a pattern that influences via the transition rules). The residue is the idea of top-down causation, which may require an expanded vocabulary of emergence.
  - The graded self-model and shared residence: This translates cleanly.
  - Groundedness: The strange loop does not require inconsistency because it is implemented in a system that does not demand total consistency and that is grounded in the physical world. The residue is that Hofstadter's account relies on the system being embedded in an environment and on the self-model being approximate and dynamic — features that are not central in classical computability theory.

  Conclusion: Your instinct is partially right in that the strange loop is built on fixed points and self-interpretation. However, Hofstadter's account adds the idea of a tangled hierarchy that avoids infinite regress and the causal efficacy of the self-symbol, which are not fully captured by a quine or a fixed point alone. The key surviving element is the active, reflective use of a self-model that is both part of and about the system, creating a loop that is "strange" because it crosses levels without getting lost in an infinite tower. This is a form of reflection that is finite and circular, which is not the same as a metacircular evaluator that requires an infinite tower (unless we have a reflective tower that is finite but circular, which is not standard). So, there is something genuinely missing in your vocabulary: the idea of a finite, circular reflective system that is grounded in a non-linguistic reality and that uses approximation to avoid paradox.
