     - Physical stance: predicting based on physical laws and constitution.
     - Design stance: predicting based on assumed design and purpose.
     - Intentional stance: predicting by treating the system as a rational agent with beliefs and desires, assuming it will act rationally to achieve its goals.

  2. Dennett's position on belief: He is an instrumentalist. Beliefs are not internal states but are attributed for predictive convenience. The success of the intentional stance does not commit us to the existence of inner states that are beliefs; it's a matter of taking a stance that works. There is no fact of the matter about whether a system "really" has beliefs beyond the predictive success.

  3. **Thin vs. Thick Reading** (as per lecture):
     - Thin: Belief-attribution is solely a predictive tool. It doesn't require anything about the internal structure. If the stance works, we can say the system has beliefs in a deflated sense.
     - Thick: Belief-attribution implies that the system is a rational agent that can be held to normative standards (justification, consistency, correction by reasons). It's about being a reasoner in a robust sense.

  Now, the claim: "If treating a large language model as a believer lets us predict and steer its outputs, then the model really has beliefs."

  The student's answer argues:
