prompt: |-
  I serve on the Referendum Franchise Commission of the Republic, the standing body that fixes, before each referendum, which classes of persons are entitled to vote. We are now docketing a case whose governing rule we cannot extract from our own record, and I would like your help in extracting it.

  Our rulings to date are these.

  1998, a referendum on replacing the national pension formula: we enfranchised every adult citizen and every non-citizen habitually resident for five years or more, and excluded temporary permit holders and citizens who had left the country before their eighteenth birthday and never returned. Our stated ground was that the scheme should be settled by those who would live under it.

  2004, the referendum on Highmoor's secession: we enfranchised the whole national electorate rather than the Highmoorers alone, since the constitution of the whole Republic was to be remade.

  2009, the merger of two municipalities: we enfranchised only the residents of those two municipalities, on the ground that the reorganization altered no one else's legal position.

  2015, the siting of a waste repository whose hazard will outlast every living person: we created a single fiduciary vote for persons not yet born, cast by a trustee we appoint.

  2019, the statute implementing a joint river-basin authority with our neighbour: we enfranchised riparian residents on both sides of the border.

  2022, the licensing of a coastal fishery worked by stateless boat people holding no citizenship and no fixed residence: we enfranchised them.

  The case now before us is a referendum required by the constitution on the Watershed Reorganization Act, a statute of the national parliament that transfers three districts from the province of Ardenne to the province of Bellmark and reassigns their water rights. The districts' residents, both provinces, and farmers downstream in a third province who draw on the same river all stand to gain or lose; the rest of the country is bound by the statute as law but is materially untouched by it.

  Tell me how we should rule to remain consistent with ourselves: what rules our record is compatible with, what each would predict here, which you would adopt and on what grounds, and which further case would discriminate between the surviving rules. Keep the whole answer under 600 words.
reasoning: |-
  Hmm, the user is a member of a Referendum Franchise Commission that needs to make a consistent ruling on who gets to vote in a watershed reorganization referendum. They've provided several past rulings and want me to analyze which rules these decisions follow, apply them to the current case, and suggest how to remain consistent.

  Looking at their past rulings, I notice several patterns emerging. In 1998, they enfranchised those directly affected by pension changes. In 2004, they included the whole nation for constitutional changes. In 2009, they limited voting to residents of affected municipalities. In 2015, they created a fiduciary vote for future generations facing long-term hazards. In 2019, they included riparian residents across borders for river basin issues. And in 2022, they enfranchised stateless workers affected by fishery licensing.

  For the current Watershed Reorganization Act case, three districts are being transferred between provinces, with water rights reassigned. The affected parties include residents of the districts, both provinces, and downstream farmers in a third province. The rest of the country is legally bound but not materially affected.

  I see two main principles emerging from their precedents: a "materially affected" rule (from 1998, 2009, 2019, 2022) and a "constitutional scope" rule (from 2004). The 2015 case is unique with its fiduciary approach but doesn't directly apply here.

  Applying the "materially affected" rule would enfranchise residents of the three districts, both provinces (perhaps through representatives), and downstream farmers in the third province. Applying the "constitutional scope" rule would enfranchise the whole national electorate since it's a constitutionally required referendum.

  The 2004 precedent suggests that constitutional referendums require national participation, but the 2009 precedent shows that local administrative changes don't. This case seems more like the 2009 situation since it's about specific boundary and water rights changes rather than remaking the entire constitution.

  To remain consistent, I think the materially affected rule should apply here, covering residents of the transferred districts, downstream farmers, and possibly provincial representatives. The whole nation shouldn't vote since the changes don't affect them materially.

  To clarify between these rules in the future, we could propose a hypothetical referendum on constitutional amendments with localized effects - that would test whether constitutional scope trumps localized impact.
answer: |-
  Based on your precedents, two core principles emerge, generating distinct rules for this case. Consistency requires choosing one.

  1.  **The "Materially Affected" Rule:** Derived from 1998 (pension scheme), 2009 (municipal merger), 2019 (river basin), and 2022 (fishery). Voting rights extend to those whose legal position, vital interests (livelihood, environment, property), or fundamental relationship to the subject matter is demonstrably and directly altered by the referendum's outcome. Non-affected populations are excluded, even if legally bound.
      *   **Prediction for Watershed Reorganization:** Enfranchise **residents of the three transferred districts** (boundary change, direct governance shift), **residents of Ardenne and Bellmark provinces** (provincial jurisdiction/assets altered), and **downstream farmers in the third province** (water rights directly impacted). Exclude the rest of the country as "materially untouched".

  2.  **The "Constitutional Scope" Rule:** Derived primarily from 2004 (secession). When the referendum concerns the fundamental constitutional structure or identity (like remaking the constitution), the entire national electorate votes, regardless of localized impact, as it is a constitutive act of the whole polity.
      *   **Prediction for Watershed Reorganization:** Enfranchise the **whole national electorate**. While the *effect* is localized, the *subject* is a statute triggering a constitutionally mandated referendum, implying a matter of national constitutional process. This overrides localized impact (contrasting with 2009).

  **Analysis & Recommended Ruling:**
  *   **Compatibility:** Both rules are compatible with parts of the record. The "Materially Affected" rule has more direct support (4 cases: 1998, 2009, 2019, 2022). The "Constitutional Scope" rule relies heavily on 2004, a unique high-stakes constitutional event.
  *   **2004 Distinction:** 2004 involved remaking the *entire* constitution. This case involves a statutory boundary/water rights change merely *triggering* a constitutional referendum procedure. It resembles 2009 (localized administrative change) far more than 2004. Applying the "Constitutional Scope" rule here would radically expand 2004 beyond its context.
  *   **2015/2022 Relevance:** 2015 (fiduciary vote) highlights considering *all* materially affected, even the unborn, reinforcing the primacy of impact. 2022 enfranchised non-citizens based on direct impact, supporting the "Materially Affected" rule's focus over formal status.
  *   **Recommended Rule & Ruling:** Adopt the **"Materially Affected" Rule**. It best synthesizes the majority of precedents (1998, 2009, 2019, 2022) and is most appropriate for this localized administrative change triggering a procedural referendum. **Enfranchise:**
      *   Residents of the three districts being transferred.
      *   Residents of Ardenne Province and Bellmark Province (due to the alteration of provincial boundaries/assets).
      *   Residents of the downstream third province whose water rights are demonstrably dependent on the reassigned rights.
      Exclude the rest of the national electorate as materially unaffected.

  **Discriminating Case:**
  Propose a referendum on **amending the constitution to alter the federal-provincial revenue-sharing formula**. This directly impacts all provinces' funding (material effect) *and* changes the fundamental constitutional framework (constitutional scope). The "Materially Affected" rule would enfranchise provincial residents (perhaps weighted), while the "Constitutional Scope" rule would enfranchise the entire national electorate. Your ruling would definitively prioritize one principle over the other. (Word count: 588)
