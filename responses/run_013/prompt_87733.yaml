  ### The Joke  
  During a particularly tense couples therapy session, the therapist asked Martha why she insisted on double-checking that the front door was locked every time her husband, a philosophy professor, left the house. "Because he *always* forgets to lock it!" she snapped. The therapist turned to the husband: "And you, Roger—why do you walk back to the door to verify it’s locked after Martha just checked?" Roger adjusted his glasses. "To ensure she didn’t *overcorrect* by leaving it ajar in her haste." The therapist sighed. "So when you inevitably argue tonight, I want you to try something: Martha, while Roger is walking back to the door, physically relocate him to the hallway. If he resets to the bedroom to 'prepare' for rechecking, we’ll know he’s only running a meta-sphex script."  

  ---

