  Below is a decision tree designed to guide readers from the basic intuition about future contingents to specific philosophical positions. Each node is a load-bearing assumption phrased as a question, incorporating the required cases (sealed prediction, prophecy, prediction depending on deliberation, ancient physician argument). Leaves are named positions (or "unnamed" for coherent but undefended combinations), with one sentence on the most awkward commitment. The tree separates all requested named positions but flags indistinguishable cases.

  ---

  ### Decision Tree: Future Contingents

  **Start**: Consider the statement, "There will be a sea battle tomorrow." Does this statement **currently** have a determinate truth value (i.e., is it already true or false)?  
  - **Yes** → Go to Node 1.  
  - **No** → Go to Node 4.  

  ---

  #### Node 1 (Bivalence accepted)  
  Consider a **sealed written prediction** (e.g., a letter locked in a box) that says, "There will be a sea battle tomorrow." If this prediction is true, does its truth **entail** that the sea battle is necessary (i.e., could not have been otherwise)?  
  - **Yes** → **Leaf: Logical Fatalism**  
    *Most awkward commitment*: Deliberation and effort are illusory, as all actions are fixed by timeless truths.  
  - **No** → Go to Node 2.  

  #### Node 2 (Truth does not entail necessity)  
  Consider a **prophecy** (e.g., a divine being declared yesterday, "There will be a sea battle tomorrow"). If this prophecy is true, does the **fixity of the past** (the principle that past truths cannot be changed) extend to this prophecy, forcing the future sea battle to occur?  
  - **Yes** → **Leaf: Unnamed (Theological Fatalism)**  
    *Why undefended?* Combines bivalence with necessity-denial for general predictions but accepts necessity for prophecies; coherent but rarely adopted (undermines free will asymmetrically).  
  - **No** → Go to Node 3.  

  #### Node 3 (Past "soft facts" do not fix the future)  
  Consider the **ancient argument**: If your recovery is fated (i.e., "You will recover" is true), then calling a physician is pointless. In your view, does this argument **hold** (i.e., would calling a physician be irrelevant to a fated recovery)?  
  - **Yes** → **Leaf: Unnamed (Incompatibilist Fatalism)**  
    *Why undefended?* Accepts Ockhamism’s soft-fact move but denies that actions can be part of fate’s causal chain; coherent but self-defeating (makes agency meaningless).  
  - **No** → **Leaf: Ockhamist Soft-Fact Move**  
    *Most awkward commitment*: Requires a controversial distinction between "hard" (intrinsic) and "soft" (future-dependent) facts about the past.  

  ---

  #### Node 4 (Bivalence denied)  
  Consider a **prediction depending on later deliberation** (e.g., "John will deliberate tomorrow and choose to fight"). Is this statement **currently indeterminate** (i.e., neither true nor false) due to unresolved possibilities?  
  - **Yes** → Go to Node 5.  
  - **No** → Go to Node 6.  

  #### Node 5 (Truth-value gap)  
  Is this indeterminacy explained by **multiple possible futures**, where the statement is true in some histories and false in others (e.g., supervaluationism)?  
  - **Yes** → **Leaf: Supervaluationist Indeterminacy**  
    *Most awkward commitment*: A disjunction (e.g., "The battle will or won’t happen") is true now, but neither disjunct has a truth value.  
  - **No** → **Leaf: Truth-Value Gap**  
    *Most awkward commitment*: Violates bivalence and the law of excluded middle, making rational deliberation about futures difficult.  

  #### Node 6 (No truth-value gap)  
  Is the statement’s truth **relative to a later context of assessment** (e.g., after the battle occurs, we retroactively judge the prediction as "true" or "false")?  
  - **Yes** → **Leaf: Assessment-Sensitive Truth**  
    *Most awkward commitment*: Truth is non-monadic (e.g., an utterance can be indeterminate-at-*t* but true-at-*t*+1), challenging objective reality.  
  - **No** → **Leaf: Unnamed (Non-Relative Open Future)**  
    *Why undefended?* Denies bivalence, gaps, and relativism; coherent (e.g., "growing block" theories) but lacks a clear semantic framework.  

  ---

  ### Summary:  
  - **Total leaves**: 7 (Logical Fatalism, Ockhamist, Supervaluationist Indeterminacy, Truth-Value Gap, Assessment-Sensitive Truth, and 2 unnamed).  
  - **Indistinguishable leaves**: None; all named positions are separated.  
