        - For a subevent violation: critical failure.
        - For a disjunction or conjunction violation: critical failure.
        - For a conditional violation: critical failure.
  8. **Judgment calls**: when events are not logically defined in the same space, or when the structure is incomplete (like missing events in a partition), then the analyst must decide how to handle.

  By following this, your analyst can catch the most common Dutch book vulnerabilities in 15 minutes.
