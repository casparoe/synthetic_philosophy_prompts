  2. **Tests for inconsistencies**: The specific mathematical checks to perform, in order of complexity and commonality.
  3. **Outcomes of tests**: Whether a test failure requires a fix (and which numbers are suspect) or ends the process (outright incoherence).
  4. **Actual bets**: For each inconsistency, the exact betting strategy that would lock in a profit (to demonstrate the problem).
  5. **Handling edge cases**: Ranges, "unknown" events, sure loss vs. bad bet, and conditional probabilities.
  6. **Limitations**: Where the checklist stops and requires human judgment.

