  ### Probability Screening Checklist for Coherence

  This checklist is designed for an analyst with basic probability knowledge (e.g., "probabilities sum to 1"). It focuses on **detecting sure-loss arbitrages (Dutch books)** in posted probabilities. The goal is to identify *incoherent* numbers—where a bettor can lock in a risk-free profit—not merely "bad" bets. The process takes ≤15 minutes per batch. If inconsistencies are found, **halt posting** until resolved.

  ---

  #### **Step 0: Elicit Probabilities and Relationships (3 mins)**
  - **Inputs:**  
    - List all events and their **point probabilities** (e.g., "FDA clearance: 0.75").  
    - If ranges are provided, demand point estimates (ranges invite arbitrage; see *Edge Cases*).  
    - Identify:  
      - **Complements** (e.g., "A" vs. "not A").  
      - **Subevents** (e.g., "B" implies "A" if B is a special case of A).  
      - **Mutually exclusive & exhaustive (MEE) sets** (e.g., partition into outcomes).  
      - **Conditional relationships** (e.g., "C if D occurs").  
  - **Output:** Structured table with events, probabilities, and relationships.

  ---

  #### **Step 1: Test for Basic Axioms (2 mins)**
  Check these in order—**failure ends the process** (critical flaw):
  1. **Non-negativity:** All probabilities ∈ [0, 1].  
     - *Failure:* "Probability 1.2 on Event X" → **Halt.**  
  2. **Sum to 1 for MEE sets:**  
     - For complements: P(A) + P(¬A) = 1.  
     - For partitions (e.g., A, B, C cover all cases): P(A) + P(B) + P(C) = 1.  
     - *Failure:* "P(A) = 0.6, P(¬A) = 0.5" → **Halt.**  
  3. **Subevent dominance:** If B implies A, then P(B) ≤ P(A).  
     - *Failure:* "P(miss window) = 0.2, P(miss due to strike) = 0.35" → **Halt.**  

  ---

  #### **Step 2: Test for Conjunctions/Disjunctions (4 mins)**
  - **Conjunctions (AND):**  
    - If P(A ∧ B) is provided, ensure P(A ∧ B) ≤ min(P(A), P(B)).  
    - If P(A), P(B), and P(A ∧ B) are all provided, check:  
      P(A ∨ B) = P(A) + P(B) - P(A ∧ B) ≤ 1.  
  - **Disjunctions (OR):**  
    - For any A, B: P(A ∨ B) ≤ P(A) + P(B).  
    - If A and B are mutually exclusive: P(A ∨ B) = P(A) + P(B).  
  - **Failure:** Flags specific numbers for review (e.g., "P(A ∨ B) = 0.8 but P(A) = 0.5, P(B) = 0.4 → check P(A ∨ B)").

  ---

  #### **Step 3: Test for Conditional Probabilities (4 mins)**
  - **Product rule:** If P(A|B) and P(B) are provided, then P(A ∧ B) = P(A|B) × P(B).  
    - *Failure:* "P(strike) = 0.2, P(miss|strike) = 0.6, but P(miss ∧ strike) = 0.1" → **Halt** (incoherent).  
  - **Conditional bounds:** P(A|B) ∈ [0, 1].  
  - **Note:** If P(B) = 0, P(A|B) is undefined → **Flag for judgment.**

  ---

  #### **Step 4: Edge Cases & Judgment Calls (2 mins)**
  - **Ranges (e.g., "P(A) = [0.3, 0.5]"):**  
    - **Not allowed.** Demand point estimates. Ranges enable arbitrage (e.g., if buy price for A is 0.5 and buy price for ¬A is 0.6, sum > 1 → sure loss).  
  - **"Unknown unknowns" (probabilities sum to <1):**  
    - **Acceptable only if** the set is not exhaustive. Add an explicit "other" event with P(other) = 1 - ΣP(known).  
  - **Sure loss vs. bad bet:**  
    - A "bad bet" (e.g., offering 0.9 on a 0.5-probability event) is **not incoherent**—no arbitrage exists. Ignore.  
    - A sure loss (e.g., P(A) + P(¬A) < 1) **is incoherent** → **Halt.**  
  - **Conditional updates:**  
    - "I’ll update P(A) if B occurs later" is **not tested here**. Requires dynamic model (outside checklist).

  ---

  #### **Step 5: Output & Escalation**
  - **Pass:** Post probabilities.  
  - **Failure:**  
    - **Critical (Steps 1-3):** Halt and escalate to you.  
    - **Judgment needed (Step 4):** Escalate to you with context.  
  - **Analyst notes:** List failed tests, inconsistent events, and implied arbitrage bets (see examples below).

  ---

  ### Worked Examples
  #### **Example 1: Complement Incoherence (FDA Clearance)**
  - **Posted probabilities:**  
    - P(FDA accepts) = 0.75  
    - P(FDA rejects) = 0.4  
  - **Check:**  
    - Step 1 (Sum to 1): 0.75 + 0.4 = 1.15 ≠ 1 → **Failure.**  
  - **Arbitrage bet:**  
    - Sell both "FDA accepts" at 0.75 and "FDA rejects" at 0.4.  
    - **Cost to bettor:** $0.75 + $0.40 = $1.15.  
    - **Payout:** Only one event occurs → bettor pays $1.  
    - **Profit:** $1.15 - $1 = **$0.15 locked in.**  
  - **Resolution:** Adjust probabilities to sum to 1 (e.g., P(accept) = 0.6, P(reject) = 0.4).

  ---

  #### **Example 2: Subevent Incoherence (Supplier Delay)**
  - **Posted probabilities:**  
    - P(miss window) = 0.2  
    - P(miss due to strike) = 0.35  
  - **Check:**  
    - "Miss due to strike" implies "miss window" → Step 1 (Subevent): 0.35 > 0.2 → **Failure.**  
  - **Arbitrage bet:**  
    - Buy "miss window" at 0.2, sell "miss due to strike" at 0.35.  
    - **Net upfront:** $0.35 - $0.20 = **$0.15 gain.**  
    - **Outcomes:**  
      - If strike occurs: Win $1 from "miss window" but lose $1 on "strike" → net $0.  
      - If non-strike miss occurs: Win $1 from "miss window", no payout on "strike" → net +$1.  
      - No miss: No payouts.  
    - **Profit:** $0.15 upfront + non-negative settlement → **risk-free gain.**  
  - **Resolution:** Ensure P(subevent) ≤ P(super-event) (e.g., lower P(miss due to strike) to ≤0.2).

  ---

  #### **Example 3: Your Firm's Published Numbers (Q3 Last Year)**
  - **Posted probabilities:**  
    - P(Regulator approves by June 30) = 0.5  
    - P(Regulator approves in Q3) = 0.4  
    - P(Regulator rejects) = 0.2  
  - **Check:**  
    - **Step 0:** Events are mutually exclusive? "Approves by June 30" and "Approves in Q3" (July-Sept) are disjoint. Exhaustive? Assumed yes (covers approval/rejection).  
    - **Step 1 (Sum to 1):** 0.5 + 0.4 + 0.2 = 1.1 ≠ 1 → **Failure.**  
  - **Arbitrage bet:**  
    - Sell all three contracts at posted prices.  
    - **Cost to bettor:** $0.50 + $0.40 + $0.20 = $1.10.  
    - **Payout:** Only one outcome occurs → bettor pays $1.  
    - **Profit:** $1.10 - $1 = **$0.10 locked in.**  
  - **Resolution:** **You must change a number.** Defended P(reject) = 0.2 is incompatible. Fix:  
    - Lower P(reject) to 0.1 (sum = 0.5 + 0.4 + 0.1 = 1), or  
    - Lower P(approves in Q3) to 0.3 (sum = 0.5 + 0.3 + 0.2 = 1).  

  ---

  ### What the Checklist **Cannot** Do
  1. **Handle non-logical dependencies:**  
     - If events lack clear logical links (e.g., "P(rain) and P(stock crash)"), inconsistencies are undetectable.  
  2. **Resolve ambiguous event definitions:**  
     - "FDA clearance" vs. "FDA approval with conditions" requires **your judgment** on exhaustiveness.  
  3. **Dynamic updates:**  
     - "If supplier delays, I’ll raise P(rejection)" requires a full conditional probability model (outside scope).  
  4. **Statistical calibration:**  
     - A coherent forecast can still be empirically wrong (e.g., always assigning 0.7 to events that occur 50% of the time).  
  5. **Small arbitrages:**  
     - A $0.01 locked-in profit is incoherent but may be tolerated for low stakes. **Judgment call.**  

  **Final note:** This checklist catches **logical incoherence**, not poor forecasting. It ensures your numbers are internally consistent—eliminating "free money" for bettors. Use it as a firewall; judgment calls (e.g., event definitions, model uncertainty) remain your domain.
