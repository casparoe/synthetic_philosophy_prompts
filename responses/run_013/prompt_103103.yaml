answer: |-
  Here's the procedure on an index card, followed by analysis:

  **Hospice Family Determination Protocol (Wittgenstein-Informed)**

  1.  **Active Role?** *"Is this person currently acting within the social practice of 'family' for *this patient*? (e.g., consistent care, emotional support, shared daily life, mutual recognition of the bond within their community context?)"*
      *   **Yes:** Proceed to Step 3.
      *   **No:** Proceed to Step 2.
      *   **Unclear/Disputed:** Probe deeper into the *current* practice around the patient.

  2.  **Residual Recognition?** *"Despite lacking current active role, is there a shared *acknowledged history* of family practice *specifically with this patient* that still holds social weight here? (e.g., widely known biological parent/child, legally recognized spouse, formally adopted child – *and* this status is still acknowledged by the core social group/patient where possible?)"*
      *   **Yes (Clear History):** Proceed to Step 3.
      *   **No:** **Stop. Likely "No."** (Theory doesn't mandate inclusion; threshold not met).
      *   **Unclear/Disputed:** This is a **genuine borderline case**. Flag for Step 4.

  3.  **Contradicts Core Function?** *"Does including this person actively undermine the core hospice purpose *for this patient*? (e.g., causes documented distress to patient, prevents essential care, creates unsafe environment, violates a clear, known patient directive?)"*
      *   **Yes:** **Stop. "No."** (Practice overrides resemblance).
      *   **No:** Proceed to Step 4.
      *   **Unclear:** **Genuine borderline case.** Proceed to Step 4.

  4.  **Threshold: Hospice Mandate Judgment:** *"Given the answers above, and weighing the hospice's core principles of patient comfort, dignity, and peaceful transition, does including this person best serve *this patient's* dying process *in this specific context*?"*
      *   **Here, theory stops.** This is your protagonist's **stipulated threshold**, drawing on her professional ethics, knowledge of the patient, and hospice mission. It's a *choice*, not a discovery of a "fact" of family.

  **Different Language Game Check:** *"Is the person appealing to 'family' based on a shared social practice (as above), or are they using the word strategically for access, guilt, legal leverage, or based on an abstract ideal detached from *this patient's* lived reality?"* The latter is a different game; the disagreement isn't about the *meaning* of family here, but about goals.

  ---

  **Worked Cases:**

  1.  **Paid Caregiver of 12 Years ("Daughter"):**
      *   **Step 1: Active Role?** **YES.** Consistent care, emotional support, shared daily life, mutual recognition of the bond (patient calls her daughter). Strong overlap with family practice.
      *   *Proceed to Step 3.*
      *   **Step 3: Contradicts Core Function?** **NO.** Inclusion likely provides comfort.
      *   *Proceed to Step 4.*
      *   **Step 4: Hospice Mandate Judgment?** **YES.** Clearly serves patient comfort and dignity based on the active practice. **Result: Admit.**

  2.  **Estranged Biological Son (Last Day):**
      *   **Step 1: Active Role?** **NO.** No current involvement in care, support, or daily life. No mutual recognition of an *active* bond. Estrangement implies rupture in practice.
      *   *Proceed to Step 2.*
      *   **Step 2: Residual Recognition?** **YES (Clear History).** Biological son is a clear historical category with social weight.
      *   *Proceed to Step 3.*
      *   **Step 3: Contradicts Core Function?** **CRITICAL QUESTION.** *Why* estranged? Does patient *want* him there? Is his presence likely to cause distress? If patient is non-communicative, is there evidence (past statements, core family testimony) his presence would be harmful or unwanted? If yes → **NO.** If unknown/possibly neutral → **Unclear** (Borderline).
      *   *Assume distress likely or unknown (Borderline), proceed to Step 4.*
      *   **Step 4: Hospice Mandate Judgment?** Without strong evidence his presence aids *patient* comfort/dignity, and given potential harm, leaning **NO.** **Result: Likely exclude, or heavily condition access.** He's playing a different game (biological claim over practice).

  3.  **Cruel Ex-Husband:**
      *   **Step 1: Active Role?** **NO.** Past cruelty ruptured the active family practice. No current positive involvement.
      *   *Proceed to Step 2.*
      *   **Step 2: Residual Recognition?** **UNLIKELY.** "Ex-husband" is a legal/social *end* of the spousal family practice. The shared history is defined by its termination and negativity. The social context likely recognizes the divorce, not an ongoing familial bond. **Result: Stop. Likely "No."** He fails the resemblance test rooted in *current or acknowledged residual* social practice.
      *   *Your protagonist saying "family is family" here is a* **different language game** *– an appeal to abstract obligation or biology over lived practice.* To earn a "yes" honestly within this Wittgensteinian framework:
          *   **Show Residual Practice:** Demonstrate that *despite* the divorce/cruelty, the ex-husband remained in a recognized, *functional* family-like role for this patient *in their specific community context* (e.g., they still ran a business together amicably, he was her primary emergency contact, the town still treated them as a unit in some essential way).
          *   **Or Show Active Reconciliation:** Establish a clear, recent, and active reconciliation where a *new* family practice had genuinely begun (not just a deathbed appearance), recognized by the patient and core group.

  **Where It Breaks Down & The Editor's Call:**

  *   **Step 2 (Residual Recognition) Ambiguity:** How much "residual" weight does a biological tie hold after long estrangement? This is inherently fuzzy. Theory won't decide.
  *   **Step 3 (Core Function) Uncertainty:** Predicting distress or benefit is often guesswork. Was the patient's "never want to see him" uttered in anger 20 years ago, or a calm directive last month?
  *   **Step 4 (Threshold Judgment):** This *is* the breakdown point. Theory gets her to here, clarifying the practice and potential conflicts, but the final "yes/no" is an ethical-professional decision based on imperfect information and core values. It's where her character, not Wittgenstein, speaks.

  **The Editor's Call:** When genuine ambiguity remains after Step 3 (a true borderline case where practice is contested or consequences unclear), the editor must ensure the protagonist's decision in Step 4 flows *consistently* from her established character and the hospice's portrayed ethos. Does she lean towards mercy, stricture, peacekeeping, or patient advocacy *in the gray areas*? This choice defines her, not the philosophy. The procedure frames the dilemma; her action reveals her.
