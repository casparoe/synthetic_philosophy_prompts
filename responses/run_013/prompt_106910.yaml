  Im putting together the final for an upper-level seminar on Enlightenment ethics, and I want one question on Du Châtelet's Discourse on Happiness that can't be passed by summarizing the standard line that she thinks you need passions, illusions, and a bit of self-love. The crux I want them to hit is this: she treats love and study as the main engines of happiness, but she also thinks happiness requires illusions and that too much clear-sightedness is corrosive. So is her view internally stable, or does it collapse into the claim that the happiest life is one that is partly self-deceived? Write the essay question (something a good student could answer in 50 minutes), a model answer of about 500-600 words, and a marking scheme out of 20 that names the specific moves that separate an A from a B -- e.g. what they have to say about the difference between love and ambition as passions, and how they handle the tension between illusion and her praise of study. Don't let the model answer just list her views; it has to take a position on the tension.
