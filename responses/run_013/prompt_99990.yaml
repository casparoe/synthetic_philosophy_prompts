prompt: |-
  I'm in a small reading group that's been working through some decision theory and game theory stuff, and there's a kind of reasoning that keeps coming up that I can't put a name to, and it's bugging me. Here's the sort of thing. We were doing the two-strangers prisoner's dilemma — one shot, no communication, no future, the whole setup where the textbook answer is to defect. A friend of mine refuses to defect. Her argument is: "We're both sitting in the exact same situation with the same information, so if I can see that we'd both be better off cooperating, she can see it too. Whatever I do, she'll do, because we're the same kind of thing in the same spot. So I should cooperate." And honestly it doesn't feel like wishful thinking — it feels like it's actually tracking a reason, even though there's no causal connection between us at all.

  Then a few weeks later, someone else made what I think might be a different version of the same move, arguing about a shared-house chore rota: "I'll do my bit, because if everyone in my position did what I'm about to do, we'd all be fine." That one feels less like a prediction about what the other people will actually do and more like a rule about what you could will everybody to do. So now I can't tell if these are the same idea wearing two outfits or two seperate ideas, and whether either of them has an established name. Is there a term for the first kind of reasoning — treating your own choice as bound up with what other people in the same boat will do, even with no causal link? And is that the same as the second, Kant-flavored one where the point is whether the rule could be followed by everyone rather than a guess about what they'll actually do?

  Can you act like a philosopher of decision theory and work through this carefully with me? Maybe start by brainstorming the closest concepts you already know, then say which one genuinely fits the first case, which fits the second, and where the edges are — what's essential to each, what's incidental, and what the standard objections are. I really don't want just a label slapped on it; I want the carving, because I keep feeling like the interesting thing is exactly the bit that the labels don't quite cover.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a reading group discussing decision theory and game theory, and they've encountered two types of reasoning that seem similar but might be different. The first is in the Prisoner's Dilemma where someone refuses to defect because they assume the other player will think the same way. The second is in a chore rota situation where someone does their part based on the idea that if everyone did the same, things would work out. The user wants to know if these are the same concept or different, and what they're called.

  First, I need to recall relevant concepts from decision theory. The Prisoner's Dilemma classic solution is defect, but the friend's reasoning sounds like evidential decision theory (EDT). EDT considers the evidence your action provides about others' actions. If both players are symmetric, cooperating is evidence the other does too. But the user mentioned no causal link, so causal decision theory (CDT) wouldn't apply here since CDT focuses on causing outcomes.

  Then there's the Kantian aspect in the chore example. That's about universalizing your action, similar to Kant's categorical imperative. It's not about predicting others but acting on a rule that should be universal. So here, the key difference is between prediction (EDT) and moral principle (Kantian).

  The user might be conflating two ideas: one based on symmetry and evidence, the other on moral universalizability. They need clarity on whether these are distinct or related. Also, they might be seeking terms to categorize each reasoning to better discuss them in their group.

  Looking deeper, the user is frustrated that labels don't capture the nuances. They want a careful dissection, not just terms. So I should compare both cases, highlighting how the first relies on perceived similarity (symmetry) leading to evidential reasoning, while the second is normative, about what one ought to do regardless of others' actions.

  Standard objections: For EDT in PD, it's vulnerable to asymmetric players or irrational opponents. For Kantian, it doesn't ensure good outcomes if others defect. Also, the user might be interested in how these apply beyond the examples given, like in real-life coordination problems.

  I should also mention other concepts like team reasoning or superrationality, which blend these ideas but have their own issues. Pointing out the essential elements: symmetry vs. universalizability, predictive vs. normative. The user's deeper need is understanding the philosophical underpinnings to articulate these arguments better in their group discussions.
answer: |-
  Let's carve this at the joints. You've hit on a fascinating and subtle fault line in decision theory, where reasoning *about* others intersects with reasoning *for* oneself. The frustration with labels is spot-on – the *interesting* thing is precisely the tension between these forms of reasoning and the standard individualistic causal models. Here's a careful dissection:

  **Brainstorming the Conceptual Landscape:**

  1.  **Causal Decision Theory (CDT):** The dominant textbook approach. Chooses actions based solely on their *causal consequences*. In the PD, defecting *causes* a better outcome for you *regardless* of what the other player does. Your action doesn't causally influence theirs (it's simultaneous/independent).
  2.  **Evidential Decision Theory (EDT):** Chooses actions based on the *evidence* they provide about the state of the world (including others' actions). "If I do X, what does that *indicate* about the world, and therefore what outcome should I *expect*?" This is where your friend's PD reasoning lives. "Choosing to cooperate *is evidence* that my identical counterpart is also cooperating, so I expect a good outcome."
  3.  **Kantian Imperative / Universalizability:** A *moral* principle, not a decision rule per se. "Act only according to that maxim whereby you can, at the same time, will that it should become a universal law." This is the core of your chore-rota example: "Could I will that *everyone* in my position acts like this?"
  4.  **Team Reasoning / Collective Agency:** Shifts perspective from "me" to "us." Agents identify as part of a team and choose actions that are best *for the team*, assuming others do the same. Requires a prior commitment to the collective goal.
  5.  **Superrationality (Douglas Hofstadter):** A less formal term capturing the idea that perfectly rational, identical agents in symmetric situations will reason to the same conclusion *because* they are identical and know it. It bypasses causal independence by asserting logical interdependence through perfect rationality and symmetry. Very close to your friend's reasoning.
  6.  **Equilibrium Selection (in Game Theory):** In games with multiple equilibria, agents might use symmetry or focal points to coordinate on one. While PD has only one dominant-strategy equilibrium (Defect/Defect), your friend is trying to argue for a different, non-equilibrium outcome (Cooperate/Cooperate) *based* on symmetry.
  7.  **Symmetry Principle:** The background assumption driving both examples: the agents are in identical situations with identical information and (assumed) identical reasoning capacities.

  **Dissecting Your Two Cases:**

  1.  **The Prisoner's Dilemma Reasoning ("Symmetry → Prediction"):**
      *   **Essential Core:** *Evidential* reasoning under *perfect symmetry*. The agent treats their own choice as *diagnostic evidence* for the other player's identical choice because they are in identical epistemic and practical positions. "My choosing C is strong evidence (perhaps even proof, in a superrational sense) that she chooses C, leading to the best mutual outcome *for me*." The motivation is *self-interested* but relies on a belief about correlation.
      *   **Closest Fit:** **Evidential Decision Theory (EDT)** applied under **Perfect Symmetry**. It can also be described as **Superrationality**.
      *   **Incidental:** The specific outcome (mutual cooperation). The framing as "bound up" – it's bound evidentially/logically, not causally.
      *   **Standard Objections:**
          *   **The Asymmetry/Objection:** What if the other player *isn't* identical? What if they are irrational, a CDT reasoner, or simply different? Your cooperation then leads to the *worst* outcome for you (Sucker's Payoff). EDT fails catastrophically here.
          *   **Causal Irrelevance:** CDT proponents argue the causal independence is paramount. Your choice *doesn't cause* theirs; it only correlates *if* the symmetry holds perfectly, which is fragile. Basing action on correlation alone, ignoring causality, is seen as irrational "magical thinking."
          *   **Bootstrapping:** The reasoning seems to assume its own conclusion. "I cooperate because she cooperates because I cooperate..." How does this process *start*? It requires an initial leap of faith in symmetry overriding the dominant strategy.
          *   **Instability:** If there's *any* doubt about symmetry or the other player's reasoning (e.g., "Maybe she thinks I'm a CDT reasoner?"), the logic unravels back to defection.

  2.  **The Chore-Rota Reasoning ("Universalizability → Obligation"):**
      *   **Essential Core:** *Moral* reasoning based on the *universalizability* of the rule/maxim. The agent isn't primarily *predicting* what others will do ("if everyone *did*..."), but asking what they *could rationally will* everyone *to do* ("if everyone *were to*..."). The focus is on the *principle* of the action, not its contingent consequences. Motivation is *deontological* (duty-based) or fairness-driven.
      *   **Closest Fit:** **Kantian Imperative / Universalizability Principle**. It's a form of **Rule-Based** or **Deontological** reasoning.
      *   **Incidental:** The specific action (doing chores). The use of a conditional ("if everyone did...") – this is part of testing the maxim, not a prediction.
      *   **Standard Objections:**
          *   **The Free Rider Problem / Exploitability:** What if others *don't* follow the rule? The Kantian cooperator gets exploited while others shirk. The rule doesn't guarantee good outcomes; it only governs the individual's action.
          *   **Conflict with Self-Interest:** In PD-like situations, universalizing cooperation requires sacrificing personal gain (the temptation payoff) for principle, which seems irrational from a purely self-interested perspective.
          *   **Formulating the Maxim:** How broadly/narrowly is the maxim defined? "I will skip *my specific chore* today" vs. "I will shirk *any responsibility* when convenient" vs. "I will do *my fair share* in collective tasks." The universalizability test can be sensitive to wording.
          *   **Consequentialist Critique:** Ignores actual outcomes. If universal cooperation is highly unlikely in a situation, sticking to the principle might lead to systematically worse results overall than a more pragmatic approach.

  **The Carving: Where the Edges Lie**

  *   **Core Difference:** The *mechanism of linkage* and the *primary motivation*.
      *   **PD Reasoning:** Linkage via *evidence/prediction under symmetry*. Motivation: *Self-interested desire for best outcome*. ("I do C *because* it signals/ensures she does C, giving me R.")
      *   **Chore Reasoning:** Linkage via *moral universalizability of the rule*. Motivation: *Duty, fairness, or adherence to principle*. ("I do my chore *because* it would be wrong/universalizable not to, even if others shirk.")
  *   **Similarities:** Both leverage the idea of symmetry ("same situation") and both aim for the collectively better outcome (mutual cooperation/fair chore distribution). Both explicitly reject the atomistic, purely causal, self-interested model of CDT in these contexts. Both are vulnerable to exploitation if others don't follow suit.
  *   **The Grey Area:** The chore example *could* be given an EDT spin: "If I do my chore, that might *indicate* others are also doing theirs (creating a cooperative norm), leading to a better overall environment for me." However, the phrasing "if everyone *in my position* did..." strongly leans towards testing a maxim, not making a prediction. Conversely, the PD reasoning *could* be given a Kantian veneer ("I should cooperate because it's the only universalizable choice"), but the friend's explicit reliance on the *prediction* ("she'll do it too") reveals the evidential core.

  **The "Interesting Bit" the Labels Don't Quite Cover**

  You're right. The profound tension is between:

  1.  **The Logic of Individual Causality (CDT):** Which seems robust but leads to collectively bad outcomes in dilemmas.
  2.  **The Pull of Symmetry & Collective Good:** Whether through evidential bootstrapping (EDT/Superrationality) or moral principle (Kantianism), which promises better collective outcomes but seems fragile (EDT) or exploitable/impractical (Kantianism).

  Neither standard CDT nor pure Kantianism fully captures the friend's PD argument. EDT gets the *form* (evidential reasoning) but the friend's *confidence* in the prediction stems from an *assumption of identical agency* that goes beyond standard EDT – hence the appeal of "Superrationality" as a label, though it's less formal. The chore argument is quintessentially Kantian.

  **Conclusion:**

  *   **Your Friend's PD Reasoning:** Best understood as **Evidential Decision Theory (EDT)** operating under a strong **Symmetry Principle**, or as **Superrationality**. It's a *predictive* argument based on perceived logical/evidential entanglement due to identicality.
  *   **The Chore-Rota Reasoning:** This is clearly the **Kantian Imperative / Universalizability Principle**. It's a *moral* argument about the principle of the action itself.
  *   **They are distinct:** One is fundamentally about *what I expect to happen* if I act (EDT/Superrationality), the other is about *what principle I can will to govern action* (Kantianism). The shared context of symmetry makes them feel similar, but the underlying logic and motivation differ significantly. The PD argument tries to *make cooperation rational* within self-interest using symmetry; the chore argument *defines cooperation as right* regardless of immediate self-interest.

  The enduring philosophical challenge lies in justifying why an agent *should* adopt the symmetry perspective (risking exploitation) or the universal principle (sacrificing potential gain) when the causal, individualistic model offers a safer, dominant strategy, even if it leads to mutual loss. This is the heart of the tension between individual and collective rationality that your reading group is grappling with. Labels are starting points, but the friction between these modes of reasoning *is* the interesting territory.
