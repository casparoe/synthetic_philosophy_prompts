answer: |-
  Here is a specification of desiderata for an adequate theory of idealization in scientific modeling, structured around your requirements, the distinctions you wish preserved, and the cases you care about. I'll mark non-negotiables (NN), common but potentially contested requirements (C), and identify tensions.

  **Core Desiderata for a Theory of Idealization:**

  1.  **Explain the Utility of Known-False Assumptions (NN):**
      *   **Requirement:** The theory must explain *why* and *how* models incorporating assumptions known to be strictly false (e.g., frictionless planes, infinite populations, perfect rationality) can nevertheless be scientifically successful (yielding predictions, explanations, understanding).
      *   **Consideration:** This is the central puzzle of idealization. A theory that dismisses idealized models as simply "false" fails to account for their pervasive and productive use. Cases: Frictionless planes (mechanics), Infinite populations (population genetics/statistics), Perfectly rational agents (economics/game theory).
      *   **Distinction:** Must not collapse "false but useful idealization" into "plain error" (which is useless).

  2.  **Distinguish Idealization from Abstraction (NN):**
      *   **Requirement:** The theory must clearly differentiate *idealization* (introducing *false* simplifying/distorting assumptions, e.g., zero friction, infinite time, point masses) from *abstraction* (omitting details *without* introducing falsity, e.g., modeling a pendulum without modeling the color of the bob, modeling population growth without modeling individual eye colors).
      *   **Consideration:** These are fundamentally different operations. Abstraction focuses on relevant features; idealization actively distorts features to simplify. Confusing them leads to misdiagnosis of model function and justification. Cases: Infinite populations involve idealization (no real population is infinite); modeling only price and quantity in supply/demand abstracts away from consumer psychology but doesn't inherently falsify the included features in the same way.

  3.  **Distinguish Idealization from Approximation (NN):**
      *   **Requirement:** The theory must differentiate *idealization* (a deliberate simplifying *assumption* known to be false) from *approximation* (a *result* or *calculation* that is close to, but not exactly, the true value, often derived within a model, idealized or not).
      *   **Consideration:** Idealization is an input, approximation is an output. Treating them as the same obscures the nature of the model's construction. Cases: Assuming constant `g` is an idealization; calculating the period of a pendulum using the small-angle formula is an approximation of the solution *within* that idealized model.

  4.  **Account for Load-Bearing vs. Merely Convenient Falsehoods (NN):**
      *   **Requirement:** The theory must distinguish between false assumptions that are *merely convenient* (could be replaced by more realistic but complex assumptions without fundamentally changing the model's core results or structure) and false assumptions that are *load-bearing* or *indispensable* (the model's core results, explanations, or tractability *depend essentially* on the falsity; removing/replacing it drastically alters or destroys the model's function).
      *   **Consideration:** This is crucial for understanding the robustness of models and the nature of explanation they provide. Cases: Friction is often merely convenient (can be added back); Infinite population size in the Hardy-Weinberg equilibrium is load-bearing for the *mathematical derivation* of stability; Perfect rationality is often argued to be load-bearing in defining equilibrium concepts in economics.

  5.  **Distinguish De-Idealizable vs. Non-De-Idealizable Cases (NN):**
      *   **Requirement:** The theory must account for the difference between:
          *   *De-idealizable idealizations:* Cases where the idealized model stands in a well-defined limiting relationship (e.g., `friction -> 0`, `N -> infinity`, `v << c`) to a more realistic model or the target system itself. The idealized model is often a limiting case of the more realistic one.
          *   *Non-de-idealizable (or essential) idealizations:* Cases where no such smooth limiting procedure exists to recover the real target system or a significantly more realistic model. The idealization seems fundamentally "baked in."
      *   **Consideration:** This distinction impacts the epistemic status of the model and how (or if) it connects to reality. Cases: Frictionless planes are often de-idealizable (add friction term); Infinite populations can sometimes be de-idealizable via finite `N` corrections; Perfect rationality is typically *non-de-idealizable* – adding "a little bit" of irrationality fundamentally changes the character of economic models and often destroys equilibria.

  6.  **Preserve the Representational vs. Computational Distinction (C/NN - Highly Valued):**
      *   **Requirement:** The theory must acknowledge the dual role of models: (1) As *representational claims* about the world (even if partial or distorted), aiming for some form of verisimilitude or correspondence, and (2) As *computational tools* or *inferential devices* for generating predictions, exploring possibilities, or structuring inquiry, where literal truth-to-fact may be less important than tractability or conceptual clarity.
      *   **Consideration:** Collapsing this distinction obscures different uses and justifications of models. A model might be used computationally to explore logical possibilities arising from rationality assumptions (computational tool) while also being interpreted as making claims about how agents *approximately* behave (representation). Cases: Rational agent models often straddle this line; Frictionless plane models are often primarily computational tools for teaching principles, but also represent claims about dominant forces.

  7.  **Explain Predictive/Explanatory Success (NN):**
      *   **Requirement:** The theory must explain how idealized models can successfully predict phenomena or provide genuine scientific explanations.
      *   **Consideration:** This is the ultimate test. A theory of idealization that renders model success mysterious is inadequate. It must account for *how* distortion can lead to insight. Cases: Frictionless mechanics predicts motions well in low-friction contexts; Infinite population models explain allele frequency stability under certain conditions.

  8.  **Account for the Context-Dependence of "Idealization" (C):**
      *   **Requirement:** The theory should recognize that whether an assumption counts as an idealization (and what kind) can depend on the context of use, the target system, and the specific questions being asked.
      *   **Consideration:** The same assumption (e.g., spherical symmetry) might be a harmless abstraction for one purpose, a crucial idealization for another, and a load-bearing falsehood for a third.

  **Potential Tensions/Incompatibilities:**

  *   **Load-Bearing Falsehoods vs. Representational Claim:** This is a major tension. How can a model making a representational claim about the world *essentially depend* on a known falsehood for its core results/explanatory power? Theories emphasizing representation (e.g., approximate truth) struggle here. Fictionalist approaches embrace this tension.
  *   **Non-De-Idealizability vs. Connection to Reality:** If an idealization is truly essential and non-de-idealizable (like perfect rationality in many models), how does the model connect to reality? What does it tell us *about reality*? Theories relying on limiting relations (de-idealization) cannot handle these cases well. This highlights a potential limit to the universality of any single theory of idealization.
  *   **Computational Tool vs. Explanatory Power:** If a model is *just* a computational tool with no representational intent, how does it *explain* real-world phenomena? How is its application justified beyond mere calculational convenience?

  **Evaluation of Friedman's F-twist and Fictionalism:**

  *   **Friedman's F-twist ("the more significant the theory, the more unrealistic the assumptions"):**
      *   **Strengths:** Directly addresses (1) - justifies false assumptions based on model *significance* (predictive power, unifying power). Implicitly leans into (6) - models as powerful inferential/computational tools. Acknowledges (4) - unrealistic assumptions are often central to the model's power.
      *   **Weaknesses:** Fails (2) & (3) - Doesn't clearly distinguish types of "unrealism" (abstraction vs. idealization vs. approximation). Poor on (5) - Doesn't address de-idealizability. Weak on (7) - *Why* do unrealistic assumptions lead to significant/predictive theories? Seems almost mystical. Fails (8) - Significance is vague and context-dependent. Collapses (6) - Over-emphasizes computational/inferential role at the expense of representational aspects. Struggles with non-de-idealizable cases.

  *   **Fictionalism about Models (Models are useful fictions, not truth-apt representations):**
      *   **Strengths:** Embraces (1) & (4) - Models are useful *despite* being fictions; explicitly handles load-bearing falsehoods. Respects (2) & (3) - Can clearly distinguish the fictional (idealized) elements from omitted (abstracted) details and approximate results. Can accommodate (5) - Some fictions might be limit cases, others not. Strong on (6) - Clearly separates the model-as-fiction from questions of literal representation, focusing on its utility as a tool. Compatible with (8).
      *   **Weaknesses:** Major challenge with (7) - How do *fictions* successfully predict and explain the real world? This is the "Miracle Argument" problem for fictionalism. Struggles with de-idealizable cases (5) - If the frictionless model is *just* a fiction, why does adding friction (de-idealizing) so often yield a *better* representation? This suggests the fiction wasn't *just* a fiction, but an approximation or limiting case. May struggle to articulate the nature of model-world comparison if representation is abandoned. Can feel unsatisfying for cases where the correspondence seems strong (e.g., planetary motion).

  **Conclusion:**

  An adequate theory must satisfy the non-negotiables (1-5,7), preserving the crucial distinctions. The **core tension** lies in reconciling **load-bearing, sometimes non-de-idealizable, falsehoods** with the model's **representational role and explanatory/predictive success**. Neither Friedman's F-twist nor standard fictionalism fully resolves this tension. Fictionalism handles the "falsehood" aspect well but struggles with explanation and de-idealization. Representational/approximationist views handle de-idealizable cases and explanation well but stumble badly over essential, load-bearing falsehoods. This suggests **no single theory currently satisfies all desiderata simultaneously** – the phenomena of idealization might require a pluralistic approach or a more nuanced account that can differentiate between types of idealized models and their specific roles (representational, computational, explanatory) in different contexts. The desiderata highlight that a "one size fits all" theory of models is likely inadequate.
