prompt: |-
  I do a guest seminar at a journalism school — a module on how markets and crowds get things wrong — and I'm setting the end of term essay. I want one question on information cascades that a student can't pass just by reciting "once two people have gone the same way, everyone else rationally ignores their own signal". So I've been mucking about with two variants, and I want the question to force them to see what's actually doing the work in the standard sequential-learning model: (a) a market where the first two traders are known to be identical twins who always receive the same private tip, so the second trade carries no fresh information at all; and (b) a market where 3% of traders are flat-earthers who buy no matter what their signal says. Treat those as my own hypotheticals — they're not lifted from a paper, and I dont want the answer hanging on a citation.

  You're an economist who teaches this material, so think carefully before you write: sketch the baseline model first, then work out precisely what each variant breaks and what it leaves intact. Then give me three things. First, the essay question itself — 45 minutes, 25 marks, third-year undergrads, no calculators. Second, a model answer of about 600 words written the way a strong student would write it, not the way a textbook would. Third, a marking scheme: the specific moves an A answer has to make, what a B answer usually offers instead, and the exact confusions that should cost marks — I'd especially like the herd-versus-cascade confusion and the belief that a cascade is somehow irreversible dealt with head on.

  Don't hedge and don't hand me a menu of possible answers — commit. If you reckon one of my two variants is the better teaching device, say so and say why. And be up front about which bit of the model answer you're least confident a third-year could actually produce unaided.
