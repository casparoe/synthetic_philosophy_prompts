prompt: |-
  I advise a foundation that has committed to funding roughly ten researchers for four years on conceptual work — philosophy, history of ideas, and theory, not empirical aesthetics — on authenticity and the value of originals. They have asked for an agenda rather than a survey or a set of readings, and they will read the reasoning more closely than the list. Tell me which open questions in this area most deserve that effort, rank them, and defend the ranking: for each, why it is upstream of the questions below it, how far it can be settled by argument alone (without museum access, visitor studies, or market data), and what would move it up or down the order. Where two questions are entangled, say which one you would sacrifice if only one could be funded.

  Assume the following as fixed background, since I want the agenda to concern what remains genuinely open rather than disputes that reproduction technology has already resolved. Reproductions of paintings, sculptures, and manuscripts can now be made that are indistinguishable from originals to most viewers under most conditions, so the empirical question of discriminability is largely closed while the philosophical question of what follows from it is not. Provenance is increasingly established by digital records that are fragmentary, contested, and sometimes deliberately falsified, so what counts as the original is often a matter of institutional testimony rather than any inspectable feature of the object. Museums routinely display facsimiles while originals travel, are repatriated, or sit in storage for conservation, and viewing a facsimile is, for most visitors, reported to be the same experience as viewing the original. Generative systems can produce new works in the style of a named artist, and can be trained on corpora that are themselves contaminated with forgeries, so the causal route from an artist's hand to an object in front of you can be broken twice over.

  One candidate decomposition, which I offer for you to accept, reject, or replace: distinguish token authenticity (this is the particular object the artist made), type authenticity (this is a correct instance of the work), and chain authenticity (the causal and epistemic route from artist to viewer is unbroken). Is that the right cut, or does it collapse two things together or leave something out?

  Finally, say where the foundational question, once answered, would actually bite: which live disputes — restitution claims, forgery law and its mental-state requirements, insurance and valuation practice, the ethics of AI-generated works in a living artist's style, the conservation decision to restore or to leave a damaged original alone — would come out differently depending on how it is settled, and which of those disputes are, despite appearances, indifferent to it.
reasoning: |-
  Hmm, this is a fascinating and highly sophisticated query about authenticity and the value of originals in art and cultural heritage. The user advises a foundation funding conceptual research (philosophy, history of ideas, theory) on this topic and needs a ranked agenda of open questions rather than a survey. 

  First, I need to unpack the user's constraints: the foundation is focused on non-empirical work, so questions resolvable through museum access or visitor studies are out. The technological premises (indistinguishable reproductions, digital provenance, etc.) are taken as given. The user also proposes a token/type/chain authenticity framework but invites critique. 

  The user's implicit needs seem to be: 1) A genuinely actionable research agenda that avoids rehashing settled debates, 2) Clear criteria for ranking questions (upstream status, argument-solvability, practical bite), 3) Willingness to sacrifice entangled questions if needed. There's also an unspoken urgency - this is for real-world funding decisions affecting restitution, AI ethics, etc.

  Looking at the proposed token/type/chain framework: It's serviceable but oversimplifies. Token authenticity assumes a stable "object" when digital artifacts challenge material persistence. Type authenticity ignores performative works where no "correct instance" exists. Chain authenticity conflates causal history with epistemic access. A better triad might be: Ontology (what constitutes the work), History (how origins matter), and Encounter (how presentation shapes meaning). This reframes the user's structure without discarding its insights.

  Now for question ranking - five tiers feel right:
  1. Ontology of the "original": Absolutely foundational. If we can't define what an original is, debates about value collapse. Solvable through pure philosophy (e.g., metaphysics of persistence). Directly impacts restitution (what exactly is being returned?) and AI art (is there an "original" at all?).
  2. Value theory: Must follow ontology but precedes more applied questions. Can be settled conceptually by analyzing whether value resides in material, intention, or perception. Decides conservation ethics (restore material or preserve history?).
  3. Epistemology of provenance: Requires ontology/value clarity first. Though digital records exist, the question is how testimony constructs authenticity - a conceptual issue. Crucial for forgery law (what makes a fake "knowingly" made?).
  4. Chain integrity: Now we get practical. Depends on prior answers about why chains matter. Argument can resolve whether broken chains nullify authenticity, affecting insurance (does loaning devalue the work?).
  5. Facsimile ethics: Most downstream. If originals lack unique value (per #2), facsimiles become unproblematic. Guides museum display policies.

  Key entanglements: Ontology and value theory are deeply connected but ontology must lead - we can't discuss value without knowing what's being valued. If forced to sacrifice one, value theory yields because some positions (e.g., strict materialism) make value self-evident. 

  Where this bites practically: Restitution disputes turn entirely on #1 (is a repatriated artifact still "authentic" if context changes?). AI art litigation needs #2 to assess whether style-copies violate originality. Conservation faces tough calls based on #5 - if facsimiles are equivalent, why risk restoring fragile originals?

  The user's tech assumptions helpfully narrow the field: Since reproductions are perfect, we skip perceptual debates. Digital provenance forces us to confront authenticity as social construct. This agenda leaves no room for obsolete questions about "aura" or empirical visitor studies - exactly as requested.
answer: |-
  Here is a prioritized research agenda for conceptual work on authenticity and the value of originals, ranked by upstream significance, defensibility through argument alone, and practical impact. I accept your token/type/chain distinction but refine it to **Token Authenticity** (particular physical object), **Work Authenticity** (correct instantiation of the artist’s creation), and **Provenance Integrity** (unbroken chain of custody/knowledge). This avoids conflating epistemic and ontological concerns.

  ### **Ranked Open Questions**
  1.  **What constitutes the "original" when material persistence isn't necessary for identity?**  
      - **Why Upstream**: All other questions presuppose a definition of "original." If originals lack unique ontological status (e.g., due to flawless reproductions or digital works), debates about value collapse.  
      - **Settled by Argument**: Pure metaphysics/philosophy of art. Cases: Is a constantly replaced ship (Ship of Theseus) still original? Is a perfect digital clone of a manuscript distinct?  
      - **Moves Rank**: Up if quantum physics/material science challenges object persistence; down if consensus emerges on non-materialist theories.  
      - **Bites**: Restitution (what *exactly* is owed?), conservation (when does restoration destroy the original?), AI art (can there be an "original"?).  

  2.  **Is the value of originals inherent or socially ascribed?**  
      - **Why Upstream**: Determines whether authenticity debates matter intrinsically. If value is purely relational (e.g., scarcity, prestige), token authenticity becomes instrumental.  
      - **Settled by Argument**: Conceptual analysis of value theory (e.g., Kantian vs. Bourdieusian approaches). Can address via thought experiments (e.g., identical twins creating same artwork separately).  
      - **Moves Rank**: Up if AI democratizes perfect copies, eroding scarcity; down if empirical studies confirm universal intrinsic valuation (but your constraints exclude this).  
      - **Bites**: Insurance valuation (inherent worth vs. market price), forgery law (harm depends on whether value is intrinsic).  

  3.  **Does Provenance Integrity require material continuity or just information fidelity?**  
      - **Why Upstream**: Questions #1–#2 define the "what" and "why"; this defines "how" authenticity is transmitted. Affects whether digital/fragmented records suffice.  
      - **Settled by Argument**: Philosophy of testimony/causation. If a blockchain ledger replaces physical custody, is integrity preserved? Argue via cases like digital art NFTs.  
      - **Moves Rank**: Up if cryptographic verification becomes norm; down if forgery scandals prove all records untrustworthy.  
      - **Bites**: Repatriation (validating claims with fragmentary records), forgeries (mental state requirements if provenance is "good faith" vs. objective).  

  4.  **Can Work Authenticity survive token destruction?**  
      - **Why Below #1–3**: Presupposes we agree on what a "work" is. Tests boundaries of type/token distinction.  
      - **Settled by Argument**: Philosophy of mind/language. If the artist’s intentions are fully documented, can a posthumous replica be authentic? Analyze via performances (e.g., restaging Marina Abramović).  
      - **Moves Rank**: Up with AI that perfectly simulates artistic intent; down if artists reject replicas categorically.  
      - **Bites**: Conservation (replacing parts vs. displaying facsimiles), AI style-replication ethics (is it a new work or inauthentic copy?).  

  5.  **Do display contexts override object authenticity?**  
      - **Why Least Upstream**: Builds on prior answers. If originals lack inherent value (#2) or work authenticity is flexible (#4), context dominates.  
      - **Settled by Argument**: Institutional theory of art/aesthetics. If a facsimile in the Louvre evokes the same experience, does authenticity matter?  
      - **Moves Rank**: Up if VR museums replace physical viewing; down if originals regain ritual significance (e.g., religious artifacts).  
      - **Bites**: Museum loans/facsimile use, conservation priorities.  

  ### **Entanglements & Sacrifices**
  - **Token vs. Work Authenticity** are entangled. Token authenticity assumes material uniqueness; work authenticity prioritizes conceptual identity. **Sacrifice Token Authenticity** if forced: Work authenticity is more adaptable to digital/performance art and AI challenges.  
  - **Provenance Integrity vs. Display Contexts**: Provenance is more upstream, as context depends on knowing what is being contextualized.  

  ### **Where Answers Bite**
  | **Dispute**               | **Most Relevant Question** | **Indifferent If...** |
  |---------------------------|----------------------------|----------------------|
  | Restitution claims        | #1 (Ontology of original) | Value is purely social (#2) |
  | Forgery law               | #3 (Provenance Integrity) | Work authenticity is irrelevant (#4) |
  | Insurance valuation       | #2 (Inherent vs. social value) | Originals aren’t unique (#1) |
  | AI ethics (style copies)  | #4 (Work Authenticity)    | Value is contextual (#5) |
  | Conservation/restoration  | #1 & #4                   | Display context suffices (#5) |

  ### **Why This Ranking?**
  - **Argument-Solvability**: All questions address *conceptual* coherence, not empirical outcomes. E.g., #1 resolves whether "original" is a coherent category post-technology; #2 examines whether value *must* derive from authenticity.  
  - **Practical Indifference**: Restitution claims appear sensitive to provenance (#3) but collapse if originals lack unique status (#1). AI ethics debates assume work authenticity (#4) matters—but if value is contextual (#5), they’re moot.  
  - **Agenda Strength**: Focuses on *what remains open* after your technological premises. Rejects "discernibility" or "aura" as settled. Reframing token/type/chain as **Token/Work/Provenance** better handles digital artifacts and contested histories.  

  This agenda ensures that foundational work resolves ambiguities that cascade into practical dilemmas, prioritizing questions that redefine the terrain rather than survey it.
