  For each objection, I need to predict the exact phrasing. Mesoamericanists might say, "This just repackages our existing critiques without citation," questioning academic integrity. Aegeanists could argue, "Your relativism ignores clear evidence of rapid change," threatening the thesis. The demographer might snap, "Show me the data for your baseline," challenging methodology. Grad students might ask about descendant communities' views, touching on ethics and continuity - sensitive because the department values this.

  Concessions must be genuine. For the Mesoamericanists' objection, concede they've pioneered this critique. For Aegeanists, admit some events were rapid. Hold the line on observer relativity being central. Replies should speak their language - e.g., "You're right, your work on Maya continuity is why I use it as a case study," to show respect. Soft spots: acknowledging their work without citing might still seem dismissive.

