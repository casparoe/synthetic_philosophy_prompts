prompt: |-
  Im on the naming and monuments panel in Kestrel Bay — small city, five of us, we handle maybe six files a year. I need help with next month's, but the real problem is that after four years I still can't tell what rule we've actually been running, and I'm the one writing the recommendation.

  Roughly what we've done:

  1. Took the Rooke statue off the plaza. Colonial merchant, fortune came out of the plantation trade, and he paid for the library and the first hospital; the inscription calls him 'founder of the city's prosperity'. We didn't destroy it — it went into the county museum, in a room the descendant association co-wrote — and we moved $400k from the plaza sale into their housing fund.

  2. Kept Kell Way. She founded the children's hospital. She also destroyed a rival doctor's career over a priority dispute in the twenties and he died broke. We added a plaque and a note in the registry. Nobody has ever complained about the plaque.

  3. Renamed Pyle Elementary. He's honored for 'opening the valley', which is the dispossession campaign, and it's basically the only thing he ever did. The renaming was part of the settlement where the district handed the old building over to the tribal community.

  4. Kept the Merrit memorial — lifeboat captain, pulled about forty people off the point. In 2019 a letter surfaced showing he beat his wife. Nobody reads that statue as being about that and there's no group it's an insult to, so we left it and added nothing.

  5. Kept Fenwick Avenue. He's the banker who redlined that district in the thirties; the street is named for him as the man who brought the streetcar out there. The neighborhood association has been asking us to change it for years and we voted 4-1 to keep, basically because the city had committed nothing to that neighborhood and none of us wanted to hand them a new sign and call it justice. I'm still not sure about that one.

  I can fit at least three different rules to all five of those and they aren't the same rule. Now the new one.

  Hale Bridge, the old pedestrian bridge over the creek in Ridgeway Park. Named in 1911 for Ossian Hale, the city engineer who designed the water and sewer system that ended the typhoid outbreaks — the bridge is only there because the main had to cross the creek. Still in service; the water workers' union is named after him. At 22 he was one of the leaders of the mob that burned the Black neighborhood down by the creek in 1889 and killed eleven people. That neighborhood was never rebuilt. The descendants' association is three blocks away and has formally asked us to rename the bridge. The historical society will pay for an interpretive plaque. There's no repair package on the table — nothing budgeted. One contested archival letter suggests Hale quietly gave to the relief fund afterward; the historical society says yes, the descendants' association says it's a receipt for forty dollars and a thank-you note.

  So: which of the rules I might be running do you think we're actually running, what does each say about the bridge, which do you bet on and why, which of the five is the closest analog, and what should we put in front of ourselves so we're forced to admit which rule we're using — i.e. what case would split them.
reasoning: |-
  Okay, the user is part of a naming and monuments panel in Kestrel Bay, dealing with about six cases a year. They're confused because after four years, they can't pinpoint a consistent rule they've been following for their decisions. They listed five past cases and now have a new one about Hale Bridge. They need help figuring out the underlying rule, how it applies to Hale Bridge, which past case is most similar, and how to clarify their decision-making framework.

  First, I need to analyze the five past decisions to identify patterns. The user mentioned they can fit three different rules to all five cases. Let me list out the cases again:

  1. **Rooke Statue**: Removed because of colonial merchant ties to plantations, but relocated with community input and funds redirected to housing.
  2. **Kell Way**: Kept despite her ruining a rival, added a plaque. No complaints.
  3. **Pyle Elementary**: Renamed due to dispossession campaign, part of a settlement with the tribal community.
  4. **Merrit Memorial**: Kept despite domestic abuse, no public insult perceived, no additional plaque.
  5. **Fenwick Avenue**: Kept despite redlining, because renaming without addressing deeper issues felt insufficient.

  Looking at these, possible rules could be:
  - **Harm vs. Benefit**: Did the person's harmful actions outweigh their contributions?
  - **Symbolic vs. Tangible**: Is the monument directly linked to the harm? Or is the community affected actively protesting?
  - **Contemporary Relevance**: Is the harm still impactful today, and is there an affected group advocating for change?

  Now, for Hale Bridge: Ossian Hale designed the sewer system that saved lives but also led a deadly race riot. The descendants' association wants it renamed, and there's a plaque offer. No financial package attached.

  Comparing to past cases:
  - **Pyle Elementary** is similar because both involve direct harm to a community (dispossession vs. racial violence) and active advocacy from affected groups.
  - **Rooke Statue** involved removal and reparations, but Hale's case lacks a settlement.
  - **Fenwick Avenue** was kept despite harm, partly due to no tangible reparations. Hale's situation has a plaque offer but no funds.

  The key differences here are the presence of an affected group (descendants' association) and the nature of the harm (violent vs. systemic). The panel might lean toward renaming if they follow the precedent of responding to affected groups, as in Pyle and Rooke. But without reparations, like in Fenwick, they might keep it with a plaque.

  To force clarity, propose a hypothetical: What if Hale's descendants offered a significant reparations fund? If the panel would accept that, it shows their rule prioritizes tangible amends. If not, it's more about the symbolic harm itself.

  The user's deeper need is to establish a consistent, transparent framework to avoid arbitrary decisions. They might also want to address historical injustices meaningfully without empty gestures. The panel needs to confront whether their decisions are reactive to advocacy or proactive based on moral principles.
answer: |-
  Based on your case history, your panel operates under a **nuanced, context-dependent "Community Harm & Symbolic Justice" test**, not a single rigid rule. It prioritizes **tangible reconciliation for harms actively contested by affected communities**, balanced against **the monument's core symbolism and practical consequences**. Here's the breakdown:

  ### The Core Rule (as inferred from your 5 cases)
  **"Remove or contextualize when the monument primarily symbolizes harm to an identifiable, advocating community, and retention without tangible repair causes ongoing offense or injustice that outweighs the figure's contested benefits. Retention is permissible if: (a) the harm is perceived as secondary to the commemorated act, (b) no active community advocates for change, or (c) renaming alone would be a hollow gesture without material repair."**

  ### How Your Past Cases Fit This Rule
  1.  **Rooke Statue:** Removed because colonial exploitation *was central to his wealth/legacy*, and removal was tied to **tangible repair** ($400k housing fund) and community input (museum exhibit). *Symbolized harm + active offense + repair offered.*
  2.  **Kell Way:** Kept because the harm (ruining a rival) was **unrelated to her commemorated act** (founding hospital), *no community advocated for change*, and contextualization (plaque) sufficed. *Harm secondary + no advocate.*
  3.  **Pyle Elementary:** Renamed because the *sole basis* for commemoration **was the harm itself** (dispossession), and it was part of **tangible repair** (building transfer to tribes). *Symbolized harm + active advocate + repair offered.*
  4.  **Merrit Memorial:** Kept because the harm (domestic abuse) was **unrelated to the commemorated act** (life-saving), *no community claimed offense*, and adding context was deemed unnecessary. *Harm secondary + no advocate.*
  5.  **Fenwick Avenue:** Kept despite harm (redlining) because renaming was seen as a **hollow gesture** without material investment in the affected neighborhood. *Symbolized harm + active advocate, but no repair possible = retention.*

  ### Applying the Rule to Hale Bridge
  *   **Harm:** Extreme and foundational (mass murder, destruction of a community).
  *   **Symbolism:** The bridge's name *directly honors Hale*, not just his engineering. The harm (burning the neighborhood *by the creek*) is intrinsically linked to the *location* of the bridge.
  *   **Affected Community:** The descendants' association (directly impacted group) is **actively advocating** for renaming.
  *   **Tangible Repair:** **No repair package is offered** (only an interpretive plaque).
  *   **Benefit:** Significant (life-saving infrastructure), but the harm is arguably more foundational to the city's development (clearing land) and vastly more severe.
  *   **Fit:** This case screams for renaming under your rule: **Symbolizes Harm + Active Advocate + Harm Linked to Location/Commemoration.** The *only* factor leaning toward retention is the lack of repair, but unlike Fenwick:
      *   The harm here is catastrophic violence, not systemic policy.
      *   The commemoration is direct (his name on the bridge), not incidental (a street name).
      *   Fenwick's retention was a protest against *city inaction*; here, the plaque offer is *something*, but falls far short.

  ### Closest Analog: Pyle Elementary
  *   **Why:** Both involve figures commemorated *specifically* for acts that **directly caused severe harm to a community** (dispossession / racial massacre). In both, **the affected community is actively advocating for change**. The key difference is the **tangible repair** in Pyle (building transfer) vs. only a plaque offered here. If your panel values consistency, Hale Bridge is a *stronger* case for renaming than Pyle – the harm is more visceral and the commemoration more direct.

  ### Recommendation & How to Force Clarity
  1.  **Recommendation:** **Rename the bridge.** Hale's role in the massacre overshadows his engineering work *and* is directly tied to the bridge's location/namesake. Retention without significant repair (beyond a plaque) would ignore the active pleas of the descendants' association and repeat the perceived injustice of Fenwick Avenue, but with even higher stakes. Negotiate with the historical society: redirect plaque funds toward renaming costs + a small community fund/scholarship in the victims' names as *minimal* tangible acknowledgment.
  2.  **Force Clarity with a "Split Case" Hypothetical:** Present this scenario to your panel *before* voting on Hale:
      *   *"Imagine a monument to someone who saved 100 lives during a flood, but who also committed a single, brutal, well-documented hate crime murder 20 years earlier, unrelated to the flood. The victim's descendants are the only ones advocating for removal. There is no offer of repair funds. Do we remove it?"*
      *   **Why this splits your rules:**
          *   **Rule A (Strict Harm Focus):** Remove. The murder is severe and advocated against.
          *   **Rule B (Commemoration Focus):** Keep + add plaque. The monument celebrates the flood rescue, not the murder.
          *   **Rule C (Repair-Driven):** Keep. No repair is offered; removal is purely symbolic.
      *   **Your Panel's Likely Answer (based on history):** **Keep + add plaque.** This aligns with Kell Way/Merrit – the harm is severe but *unrelated to the reason for commemoration* and only one family advocates. This clarifies that your rule isn't just "harm vs. benefit," but **prioritizes the *link* between the harm and the commemoration, and the *scale/advocacy* of the affected community.** Hale's harm is *intimately linked* to his legacy and location, advocated by a *whole community*, making it fundamentally different than this hypothetical.

  **Bottom Line:** Your panel prioritizes justice for actively harmed communities when the monument *itself* symbolizes that harm. Hale Bridge is a Pyle-level case – renaming is the consistent outcome unless the lack of repair overrides it (as in Fenwick). The hypothetical forces you to admit that "unrelated harm" is treated differently, highlighting why Hale's linked harm demands action. Push for renaming *and* use this moment to draft explicit guidelines incorporating "linkage," "community advocacy," and "tangible repair" as factors.
