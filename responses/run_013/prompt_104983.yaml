  ### Disanalogies and Their Implications  
  **Incidental Disanalogies** (do not undermine remedies):  
  - **Refusing to play**: Neither PD nor MT allows opting out; mismatch is irrelevant.  
  - **Mutual defection worse**: This core incentive alignment holds; supports the analogy superficially.  

  **Decisive Disanalogies** (undermine proposed remedies):  
  1. **Scalability (\(n \gg 2\))**  
     PD remedies collapse at scale. Reputation/monitoring require pairwise tracking—infeasible for 100+ agents. Iteration (e.g., tit-for-tat) fails with many players as defectors go unpunished. Central enforcement becomes harder to establish.  
     *Impact*: Remedies like reputation/monitoring are impracticable; collective action devolves into chaos.  

  2. **Payoff Uncertainty**  
     PD assumes known, fixed payoffs. MTs involve ambiguity (e.g., unknown costs of cooperation). Side payments require precise payoff knowledge to calibrate transfers; without it, negotiations stall.  
     *Impact*: Side payments and coordinated strategies fail; agents cannot agree on "fair" solutions.  

  3. **Asymmetry**  
     Symmetric PD payoffs enable universal remedies. MTs feature power imbalances (e.g., a polluting hegemon vs. vulnerable states). Reputation systems bias toward powerful actors; side payments favor the wealthy; central enforcers may be exploitative or unaccountable.  
     *Impact*: Asymmetry distorts or corrupts proposed solutions.  

  4. **Indeterminate Players/Time Horizon**  
     PD assumes fixed players and repeated games. MTs face shifting rosters (e.g., emerging AI agents) and finite horizons (e.g., irreversible tipping points). Reputation/iteration require stability; their absence breeds distrust.  
     *Impact*: "Shadow of the future" vanishes; reputation systems collapse.  

  **What PD Smuggles into MTs**:  
  - **Feasibility of enforcement**: PD quietly assumes an enforcer can be imposed externally. In MTs, creating one *is* the problem (e.g., who sanctions a superpower?).  
  - **Staticity**: PD assumes fixed rules/players. MTs are dynamic systems where the game itself evolves (e.g., new technologies create new traps).  
  - **Common knowledge**: PD requires all players to know payoffs/strategies. MTs lack this, stifling coordination.  

  **Escape Routes Blocked**:  
  - **Central enforcer**: Not a "remedy" but a separate collective-action problem (e.g., enforcing climate agreements requires buy-in from major polluters).  
  - **Iteration/reputation**: Require stable, repeated interactions—absent in one-shot traps (e.g., AI arms races).  
  - **Side payments**: Demand payoff clarity and symmetry; undone by uncertainty/asymmetry.  

  **Verdict**:  
  The analogy **breaks** because PD’s simplicity obscures MT complexity. Remedies fail in scalable, asymmetric, uncertain, or dynamic traps. Concluding MTs are "ordinary" collective-action problems is unsupported; the analogy smuggles in tractability that MTs lack.  

  **Better Analogy**:  
  A **multi-player game of chicken with incomplete information**, where players (e.g., drivers) speed toward mutual destruction, but asymmetric stakes and uncertainty about "swerve" thresholds prevent coordination. This captures brinkmanship and asymmetric stakes better than PD.  

