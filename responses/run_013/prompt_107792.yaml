  (3) Believes indicative conditionals aren't material conditionals
  (4) Views the message as genuine evidence that must be incorporated
  (5) Believes all learning is conditionalization on propositions, requiring space enlargement if needed
  (6) Adopts a "no-undermining" constraint (evidence shouldn't lower probability of what it's about)
  (7) Sees REM as the proper generalization of conditionalization
  (8) Considers Jeffrey conditionalization appropriate for uncertain evidence in this case

