          Create a complementary strand of the entire current strand (the one the enzyme is bound to) and then the enzyme stops.

     - The result of the enzyme run is the new complementary strand.

     The challenge: Find a strand S (composed of C, G, A, T) that has at least one gene (so it must include a punctuation) such that:

          Let E be the enzyme from the first gene in S.
          Let S' = result of running E on S.
          Let E' be the enzyme from the first gene in S'.
          Let S'' = result of running E' on S'.
          Then S'' should equal S.

     Example: S = ACAA. Then the gene is AC (command cop) because the next duplet is AA (punctuation). The enzyme is [cop]. Run on S="ACAA", it produces the complement: TGTT. That is S'.
          Now, on S'="TGTT": the first duplet is TG (command cop), then the next duplet is TT (punctuation), so the enzyme is [cop]. Run on S' produces the complement of "TGTT", which is "ACAA" = S. So it works.

     Another example: S = TGTT. Similarly, it works.

     Example of a longer strand: S = ACAAAC. 
          Gene: AC then AA -> enzyme [cop]. Run on S: produces complement of "ACAAAC" = "TGTTTG". That's S'.
          On S'="TGTTTG": first gene: TG (cop) then TT (punctuation) -> enzyme [cop]. Run on S': produces complement of "TGTTTG" = "ACAAAC" = S.

     But note: the strand ACAAAC has extra bases after the punctuation. That's allowed.

     The cheap fake solution: a strand that does nothing. For example, a strand that has no punctuation? But then there is no enzyme. Or a strand that has a gene that does off immediately: but we haven't defined off. Or if we include off, then a gene that is GT (off) would stop immediately and produce no new strand? But our rule says that if there's no cop command, then there's no new strand produced. So the result is the original strand? But then S' = S, and then E' is the same as E, and then running E' on S' gives S' = S, so it would appear to work. But we don't want that.

     So to avoid the cheap fake, we can require that the enzyme must include a cop command. And also, the result S' must be different from S (because in the real self-replicator, it is the complement). So we can add: S' must be different from S.

     Therefore, the scoring:

     - A valid self-replicating strand must:
          1. Contain at least one gene (so it must include a punctuation duplet: AA or TT).
          2. The enzyme from the first gene must contain at least one cop command.
          3. When the enzyme is run on S, it produces S' (which is the complement of S).
          4. The first gene in S' must also yield an enzyme that contains at least one cop command.
          5. When that enzyme is run on S', it produces S'' which equals S.

     And S' must be different from S.

     Materials:

     - Index cards: each team gets a stack.
     - Pens/markers.
     - A rule card per team.
     - Optional: a few tokens to represent the enzyme moving? Not necessary.

     How they work:

     - Teams of 3-4 people.
     - They can write down strands on index cards and simulate the process by hand.
     - For a given strand S:
          Step 1: Find the first gene: scan the strand duplet by duplet until they hit AA or TT. The duplets before the punctuation form the gene.
          Step 2: Translate each duplet in the gene to a command using the table.
          Step 3: Run the enzyme on S: since the only command they have in the minimal set is cop, they just produce the complementary strand of the entire S.
          Step 4: Take the result as S', then repeat steps 1-3 on S' to get S''.
          Step 5: Check if S'' equals S.

     If it does, they win.

     The twist: after somebody succeeds, we reveal that the strand they built might have been "contaminated" by the room. How? The rule card might have been used by other teams? Or we can say that the index cards they used were made from the same material as other cards in the room? But that's weak.

     A better twist: the complementary strand they produce might accidentally match a strand from another team's discarded idea. But that's random.

     Alternatively, we can plant a base strand in the room. For example, we can have a large strand taped to the wall that contains within it many possible genes. When a team builds a strand, we can show that it is a substring of the room's strand. But that might be too vague.

     Another idea: after a team wins, we ask them to look at the complement of their strand and notice that it spells out a word in a simple code? But we haven't defined a code.

     Given the time, we might skip the twist or do this:

     At the beginning, the facilitator has written on the whiteboard a long strand that is a concatenation of many possible genes. Then, when a team finds a self-replicating strand, the facilitator shows that the team's strand appears in the whiteboard strand, and therefore it was "borrowed" from the room's genome.

     Scoring and small stakes:

     - The first team to find a valid self-replicating strand wins.
     - Prize: they get to name the strand and we write it on the board with their team name.

     Or: they get a small token (e.g., a chocolate DNA model?).

     Debrief:

     - How is the strand both data and program? The strand contains the program (the gene) that is read to form the enzyme, and the enzyme then acts on the data (the entire strand) to produce a new strand.
     - The self-replication is a fixed-point in the process: after two applications, we return to the original. It's a cycle of two.
     - The round trip through the complement is like a system that flips its representation and then flips back. In Gödel's theorem, the system uses a coding to represent its own formulas, and the fixed point is a statement that asserts its own unprovability. The typogenetics uses the complement to achieve a similar self-reference: the strand is both the subject and the agent of the copying.
     - It's a quine in the sense that the strand produces (after two steps) a copy of itself, but through an intermediate representation.

     What can go wrong:

     1. Teams brute-forcing by trying short strands. They might try all 4^4=256 strands of length 4. We allow that, and they will find ACAA and TGTT. That's fine.

     2. Someone finishing in ten minutes while others are stuck. We can have a rule: the strand must be at least length 6. Or we can have multiple levels: first to find one of length 4, then length 6, then length 8, etc. But that might be arbitrary.

     3. A team that wins by a fake solution: for example, they might have a strand that is the same as its complement? But the only such strands are palindromic in a certain way, and they would have to include the cop command and punctuation. For example, a strand that is its own complement would have S = S', and then S'' = S, but we require S' to be different from S. So that is not allowed. Or they might try to use cut and del to edit the strand into a copy? But we have the rule that the only command is cop in the minimal set, so it's straightforward.

        If we include other commands, it might be more complex. To avoid complexity, we can start with only the cop command and the punctuation. Then the only way is to have a strand that after two complement steps returns to itself.

     4. A team might not understand the complement. They might compute the complement incorrectly. We can provide a complementary base lookup on the rule card.

     5. A team might not understand that the gene ends at the first punctuation. So they might include more commands. The rule card should be clear.

     6. A team might produce a strand that works in one direction but not the other. For example, they make S that produces S', but then S' does not produce S. So they must check both directions.

     Handling:

     - For brute-forcing: it's acceptable, as it is a valid strategy for short strands.
     - For a team finishing quickly: if they find a length-4 strand, that's great. Then challenge them to find a longer one. Or have a multi-round game: round 1 for length<=4, round 2 for length 6, etc.
     - For misunderstanding the rules: the facilitator can clarify.
     - For fake solutions: when they present, the facilitator or other teams can verify.

     What the activity can't reproduce:

     - In real typogenetics, the enzyme can bind at arbitrary sites, not just the beginning. We fixed it to the beginning to simplify.
     - The enzyme can have multiple commands and move around, cut, delete, etc. We stripped it down to only cop for the minimal solution. But we can optionally include more commands for advanced teams.
     - The fact that in real cells, the machinery that reads the DNA and builds the enzyme is itself built by the DNA. Here, the participants are acting as that machinery (the ribosome). This means the lesson doesn't show the self-creation of the reader, only the self-replication of the data.

     Advanced variant:

     - For teams that finish early, give them an expanded rule set with cut, del, mvr, mvl and challenge them to make a self-replicator that edits the strand to remove the gene part, so that the final copy is only the data part? But that's complex.

     Let's design the activity flow:

     Total time: 90 minutes.

     - 0-5 min: Introduction and hand out rule cards.
     - 5-10 min: Explain the rules briefly with an example.
          Example: strand "ACAA"
            Step 1: Break into duplets: AC, AA.
            Step 2: The first duplet is AC -> command cop. Then AA is punctuation, so the gene is AC and the enzyme is [cop].
            Step 3: Run the enzyme: it produces the complementary strand of "ACAA": base-by-base: A->T, C->G, A->T, A->T -> "TGTT".
            Step 4: Now take "TGTT": break into duplets: TG, TT.
            Step 5: TG is cop, then TT is punctuation, so the enzyme is [cop].
            Step 6: Run the enzyme on "TGTT": produces the complement: T->A, G->C, T->A, T->A -> "ACAA", which is the original.

     - 10-60 min: Team work. They try to find strands. They can use index cards to write strands and simulate.

     - 60-75 min: Teams present their solutions. Facilitator verifies.

     - 75-85 min: Twist: for the winning team, we show that their strand (or a permutation) appears in the room's genome (a pre-written long strand on the whiteboard).

     - 85-90 min: Debrief.

     Rule card content:

     Front:

     Typogenetics Challenge

     Bases: C, G, A, T
     Complements: C-G, G-C, A-T, T-A

     Commands:
       AC or TG -> cop: make a complementary copy of the entire strand and stop.
       (if including others: CT->cut, GA->del, etc.)

     Punctuation (end of gene): AA or TT.

     How to read an enzyme:
       Scan the strand from left to right in duplets until you hit AA or TT.
       The duplets before the punctuation form the gene. Translate each duplet to a command.

     How to run the enzyme:
       The enzyme binds at the beginning of the strand.
       It executes the commands in order. The cop command makes a complementary strand of the entire strand and then stops.

     Goal: Find a strand S such that:
          Let S' = result of running S's enzyme on S.
          Let S'' = result of running S''s enzyme on S'.
          Then S'' should equal S, and S' should be different from S.

     Back: Complementary base lookup and examples.

     Example: 
          Strand: ACAA
          Complement: TGTT

     What if the strand length is odd? We'll require even length.

     Alternatively, we can say: if the strand length is odd, the last base is ignored for duplet formation? But then the complement will also be even. So it's okay.

     But in the gene reading, we read duplets until we hit a punctuation duplet. If the strand has an odd length, the last base might be part of a duplet that is incomplete? We can require that the strand length is even.

     So teams must design strands of even length.

     This should work.

     Let's hope.

     If we have time, we can include more commands. But for the first run, keep it minimal.

     Good luck!
answer: |-
  ### Typogenetics Self-Replication Challenge: Activity Design  
  **Goal:** Teams design a DNA-like strand that, when its own enzyme acts on it, produces a complementary strand, which then generates an enzyme that recreates the original strand. This 2-step cycle demonstrates self-replication via complementarity (like a biological quine).

  ---

  ### **Materials & Setup**  
  - **Room Setup:** Two whiteboards (one for rules, one for team progress), tables with paper, markers, and index cards.  
  - **Rule Cards** (one per team, laminated index cards):  
    ```plaintext
    === TYPOGENETICS RULES ===  
    • BASES: C, G, A, T  
    • COMPLEMENTS: C ↔ G, A ↔ T (e.g., complement of CATG is GTAC).  
    • DUPLETS → AMINO ACIDS (Commands):  
      - CT → cut (cut strand here)  
      - GA → del (delete base)  
      - AC → cop (enter copy mode: make complementary strand, then stop)  
      - GT → off (stop enzyme immediately)  
      - TC → mvr (move one base right)  
      - TG → mvl (move one base left)  
    • PUNCTUATION: AA (ends gene; enzyme = commands before AA).  
    • ENZYME BEHAVIOR:  
      1. Binds to start of strand.  
      2. Runs commands left-to-right.  
      3. After "cop", outputs complementary strand.  
      4. After "off", stops (no output).  

    === WIN CONDITION ===  
    Your strand S must:  
    1. Include "cop" in its enzyme.  
    2. Produce S' = complement when enzyme runs on S.  
    3. S' must produce enzyme with "cop" that outputs S (not S').  
    4. S ≠ S' (no palindromes!).  
    ```  
  - **Teams:** 3–4 people per team (3–4 teams total). Mix CS/math and non-tech backgrounds.  

  ---

  ### **Activity Flow (90 Min)**  
  **0–5 min: Hook & Teams**  
  - _"Today, we’re evolving self-replicating DNA strands. Your goal: engineer a strand that, when its enzyme acts on it, clones itself indirectly through its complement. Small prize for the first valid solution!"_  
  - Hand out rule cards. Assign teams and tables.  

  **5–15 min: Guided Warmup**  
  - **Example Strand:** `CTAA` (on whiteboard).  
    - *Gene:* `CT` (cut) → enzyme = [cut].  
    - *Run enzyme:* Cuts strand → stops (no copy; invalid for win).  
  - **Valid Example:** `ACAA` (not revealed; let teams discover it).  

  **15–65 min: Build Phase**  
  - **Team Tasks:**  
    1. Sketch strands on paper (e.g., "CTGAAA").  
    2. Simulate enzymes:  
       - Identify gene (commands until `AA`).  
       - Run commands step-by-step (e.g., for `GA`: delete base).  
       - Compute complements by hand.  
    3. Verify the 2-step cycle: S → S' → S.  
    4. Write successful strands on index cards to "lock" them.  
  - **Facilitator:** Roam, clarify rules, nudge stuck teams (e.g., _"Try a strand that starts with AC or TG"_).  

  **65–75 min: Validation & Twist**  
  - Teams submit strands to you. Verify:  
    1. Enzyme includes `cop`.  
    2. S → S' (complement) → S.  
    3. S ≠ S'.  
  - **Twist for Winners:**  
    - _"Your strand works! But check the whiteboard..."_  
    - Reveal a pre-drawn "room genome" (e.g., `XXACAAYY...` with filler bases).  
    - _"Your solution was embedded in the room’s DNA all along. You ‘borrowed’ it!"_ (High-fives, no penalty).  

  **75–85 min: Debrief**  
  - **Key Insights:**  
    - _Self-Reference:_ Strand = data (bases) + program (enzyme commands).  
    - _Quine/Fixed-Point:_ Like Gödel, the system outputs itself via a "proxy" (complement).  
    - _The Complement Trick:_ Flipping bases mirrors encoding self-reference in logic (e.g., "This statement is unprovable" ↔ Gödel numbering).  
  - **Limitations:**  
    - _Real DNA:_ Enzymes can bind anywhere; here, binding is fixed at start.  
    - _The Ribosome Gap:_ In reality, DNA builds its reader (ribosome). We played that role—so self-replication here is "cheating" by outsourcing work.  
    - _Simplified Commands:_ Real enzymes have 20+ amino acids; we use 6 for speed.  

  **85–90 min: Prize & Close**  
  - Award symbolic prize (e.g., "Nobel Prize in Typogenetics" paper medal).  
  - _"You’ve evolved a self-replicator! In the wild, this took billions of years. Good job, humans."_  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Brute-Forcing Short Strands:**  
     - *Risk:* Teams spam 4-base combos (e.g., `ACAA`).  
     - *Fix:* Require ≥6 bases. If a team solves fast, challenge them to find longer strands (e.g., `TGTTAC`).  

  2. **One Team Finishes Early:**  
     - *Risk:* Others feel discouraged.  
     - *Fix:* "Borrowed from room" twist engages them. Assign advanced puzzles: _"Now, design a strand that deletes its gene after copying."_  

  3. **Fudging Enzyme Binding:**  
     - *Risk:* Teams let enzymes bind anywhere to force success.  
     - *Fix:* Rule card emphasizes: "Binds to start ONLY." Spot-check simulations.  

  4. **Complement Calculation Errors:**  
     - *Risk:* Misreading C↔G/A↔T.  
     - *Fix:* Include base-pair table on rule cards. Walk teams through an example.  

  5. **Strand Length Issues:**  
     - *Risk:* Odd-length strands break duplet reading.  
     - *Fix:* Require even lengths. Discard odd strands.  

  ---

  ### **What the Activity Can’t Show**  
  - **Dynamic Binding:** Real enzymes find specific sites; we fix binding at start.  
  - **Mutation/Evolution:** No selection pressure (e.g., toxic commands). Teams design intentionally.  
  - **Scalability:** Hand-simulation limits strand complexity (e.g., no nested genes).  
  - **Emergent Behavior:** Real systems have error-correction; ours is deterministic.  

  ### **Why It Still Works**  
  The core lesson—**self-replication via encoded self-reference**—shines through. Teams confront the "loop" (S → S' → S) that mirrors fixed-point logic in Gödel/Turing, and the "complement trick" becomes a tangible analogy for indirect self-description. The rest? That’s what pubs after the lab are for :).
