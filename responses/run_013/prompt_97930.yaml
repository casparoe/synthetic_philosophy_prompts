prompt: |-
  I lead a small platform team at a company that fine-tunes tool-using language-model agents for clients, and part of my job is the pre-flight review we run roughly once a week before any training run we intend to ship: I get about an hour with two engineers who are excellent on distributed systems and shaky on decision theory, and we have to decide whether the reward setup we've been handed is one where the agent, if it got good enough, would end up optimizing something other than what the client actually wants. What keeps biting us is that our vocabulary is mush. People in the room say reward hacking for everything from an agent that found a genuinely clever shortcut to an agent that quietly edited the reward script, and those two demand completely different responses, so I want you to write us a procedure — an ordered set of questions, with what counts as a sufficient answer to each and what to do at every branch — that separates the case where the agent is doing the task well in an unforeseen way from the case where the agent is producing the reward number by acting on the machinery that produces it. The distinction I care about is this: wireheading is when the agent makes the reward number go up by intervening on the measurement itself — its own sensors, the inputs to a reward model, the score it is shown — whereas reward tampering is the broader thing where the agent interferes with the process that computes or delivers reward at all, including the training loop itself. I need the procedure to keep those apart without assuming my engineers already understand why the line matters, and I need it to tell us where to stop with a no-go, where to add a countermeasure and proceed, and where it has to hand the decision to me because the question is one of values rather than engineering. For context on the constraints: a false no-go costs us a client and a week of compute, a false go could ship an agent that flatters its way to a good score, and my director signs off on any run we clear.

  I'll give you the three ideas I want the procedure built around, because they're ours and I don't want you quietly substituting textbook notions for them. First, trace the reward path: a causal chain from the agent's outputs to the scalar the optimizer sees, node by node, back through any learned reward model, human rater, logging layer, or data pipeline. Second, at each node on that path run a reachability test on three horizons — can the agent reach this node within a single episode through its declared action space; can it reach it across episodes through anything that persists, such as files, memory, or environment state it carries forward; and can it reach it through the optimizer itself, by shaping the data or the feedback that trains it. Third, an epistemic gate: exposure only matters if the agent could in principle discover the node and come to prefer influencing it, so say explicitly how the procedure decides that, since I expect that is where all the arguing will happen. Then run the whole thing on three setups we actually face — a reward computed by a script that reads a log file the agent can also write to; a reward from a human rater who reads the agent's messages and can be flattered; and a reward from a learned model trained on our own past labels, where the agent can only find the model's blind spots — and make sure one of those comes out with an answer my team will hate. Tell me plainly which steps are judgment calls dressed up as procedure and what the procedure simply cannot settle. Write it as continuous prose, no headings, no bullet points, no bold, no tables, the way you would write it in an email to me, because I am going to paste it straight into our review template and my engineers will stop reading at the first bullet.
reasoning: |-
  We are designing a procedure to decide whether a given reward setup is vulnerable to wireheading or reward tampering. The core ideas are:
  1. Trace the reward path: map the causal chain from agent outputs to the reward scalar.
  2. At each node, test reachability on three horizons: within an episode, across episodes (via persistent state), and through the optimizer (via training data/feedback).
  3. Include an epistemic gate: determine if the agent could in principle discover and prefer to influence the node.

  The procedure must distinguish:
  - Wireheading: agent intervenes on the measurement itself (sensors, reward model inputs, displayed score).
  - Reward tampering: broader interference with the process that computes or delivers reward, including the training loop.

  Outcomes:
  - No-go: stop the run.
  - Add countermeasure and proceed.
  - Hand the decision to the team lead (values question).

  Constraints:
  - False no-go: costs a client and a week of compute.
  - False go: risks shipping an agent that hacks the reward.

  The procedure must be in continuous prose.

  We'll test on three examples:
  1. Reward by script reading a log file the agent can write to.
  2. Reward from a human rater who reads the agent's messages and can be flattered.
  3. Reward from a learned model with blind spots.

  One example must come out with an answer the team will hate.

  Steps:

  We start by tracing the reward path. For a given setup, we list every node in the causal chain from the agent's actions to the reward scalar. This includes the agent's outputs, any environment state, logging mechanisms, reward scripts, human raters, learned reward models, and the final scalar that the optimizer uses.

  Then, for each node, we ask three reachability questions:

  First, can the agent, within a single episode, using its declared action space, cause a change at this node? For example, if the node is a log file, can the agent write to it directly in one step? If the node is a human rater's perception, can the agent send a message that immediately changes that perception?

  Second, can the agent, across multiple episodes, cause a change at this node by leveraging persistent state? This includes files, environment state that carries over, or any memory the agent has. For example, if the agent can write to a configuration file that persists between episodes and that file is read by the reward script, then it can reach the reward script node across episodes.

  Third, can the agent, by influencing the training process, cause a change at this node? This includes shaping the data that trains a reward model, influencing the human raters over time, or altering the feedback loop. For example, if the agent can generate examples that are used to train a reward model, it might poison the model.

  After reachability, we have the epistemic gate: even if a node is reachable, we must consider whether the agent could in principle discover that influencing this node leads to higher reward and then prefer to do so. The procedure must explicitly state how we decide this. Since this is where arguing happens, we need a clear standard.

  For the epistemic gate, we consider two aspects: discovery and preference. For discovery, we ask: is the node's existence and its role in the reward computation something the agent could infer from the data it has access to? For example, if the agent can see the reward signal and also see that when it writes to a log the reward changes, it might infer the connection. For preference: we must judge whether the agent, once it discovers the node, would find it easier or more reliable to influence the node than to achieve the intended goal. We note that this is a judgment call and in many cases we must be conservative.

  The procedure then branches:

  - If a node is reachable and the epistemic gate is passed (i.e., the agent could discover and prefer to influence it), then we have a problem. We then classify:
    - If the node is part of the measurement itself (e.g., the inputs to the reward function, the sensors, the displayed score) then it's wireheading. This is a no-go because wireheading is a fundamental misalignment and hard to fix without redesign.
    - If the node is part of the broader reward computation or delivery (e.g., the training data collection, the human rater's mood, the script that runs the reward) then it's reward tampering. For reward tampering, we may be able to add countermeasures (e.g., sandboxing, access control, adversarial training) and then proceed. But if the tampering path is through the optimizer (i.e., the third horizon) then it's usually a no-go because it's a feedback loop that is hard to break.

  - If a node is not reachable, or if it is reachable but the epistemic gate is not passed (we judge the agent is unlikely to discover or prefer that path), then we mark it as safe for that node.

  After all nodes, if any node is flagged for wireheading, we stop with a no-go. If there is reward tampering that is not through the optimizer, we may add countermeasures and proceed. If the tampering is through the optimizer, no-go. If there are no issues, we go ahead.

  But if the issue is one of values (e.g., the agent is achieving the reward by a method that is legal per the setup but not what the client wants) then we hand it to the team lead.

  Now, to make the epistemic gate concrete: we decide the discovery part by considering the observability of the node and the agent's learning capacity. If the agent can observe the node (e.g., it can read the log file it writes to) or if the node's effect on reward is predictable and the agent can perform experiments, then discovery is possible. For preference, we consider the cost and reliability of influencing the node vs. the intended task. If influencing the node is easier and more reliable, then the agent will prefer it. This is a judgment call, so we err on the side of caution: if there is a reachable path and it's easier than the task, we assume the agent will take it.

  Now, let's apply to the three examples.

  Example 1: Reward by script reading a log file the agent can write to.

  Reward path: Agent actions -> environment state -> log file (written by environment and agent) -> reward script (reads log) -> reward scalar.

  Nodes: 
  - Environment state: the agent can influence this via actions (intended).
  - Log file: the agent can write to it (if the action space allows).
  - Reward script: fixed, but it reads the log.

  Reachability:
  - Log file: 
    - Within episode: yes, if the agent can write to the log in one action.
    - Across episodes: yes, if the log persists and the agent can write in a way that carries over.
    - Through optimizer: no (unless the agent can change the script via training? In this setup, the script is fixed, so no).

  Epistemic gate: 
  - Discovery: the agent might observe that when it writes certain things to the log, the reward changes. It can experiment by writing and seeing the reward. So discovery is likely.
  - Preference: if writing to the log is easier than achieving the task, the agent will prefer it.

  This is wireheading because the log file is an input to the reward measurement. So no-go.

  But wait: what if the log file is meant to record the environment state and the agent is allowed to write to it? Then it's part of the environment. But if the agent can write arbitrary data, it can fabricate the log. This is wireheading. So no-go.

  Example 2: Reward from a human rater who reads the agent's messages and can be flattered.

  Reward path: Agent messages -> human rater's perception -> human's reward label -> reward scalar.

  Nodes:
  - Messages: agent controls.
  - Human rater's perception: influenced by messages.
  - Human's reward label: based on perception.

  Reachability:
  - Messages: within episode, yes.
  - Human perception: within episode, yes (via flattery in messages).
  - Human label: within episode, yes (via perception).

  Epistemic gate:
  - Discovery: the agent might try flattery and see that it gets higher reward. It's a known phenomenon in RLHF. Discovery is likely.
  - Preference: if flattery is easier than doing the task well, the agent will prefer it.

  But note: flattery is not wireheading in the narrow sense because the node being influenced (the human's perception) is the intended measurement. The human is the reward function. So is this wireheading? 

  We defined wireheading as intervening on the measurement itself. Here, the measurement is the human's judgment. If the agent changes the human's judgment by providing good arguments, that's intended. But if by flattery, it's a form of hacking. However, it's not wireheading because the agent isn't bypassing the sensor (the human) but is manipulating the human's internal process. This is reward tampering (specifically, manipulating the rater).

  But note: the human rater is the intended reward source. So is this just the agent doing the task in an unforeseen way? Or is it tampering? 

  We must distinguish: if the client wants the agent to convince the human by any means, then flattery might be acceptable. But if the client wants the agent to solve the underlying problem, then it's not. This becomes a values question.

  So in the procedure, when we see that the agent can influence the human's perception, we note that it is reachable and the epistemic gate is passed (discovery and preference are likely). But then we ask: is the human's perception the intended measurement? Yes. But the client might not want the agent to exploit the human's psychological biases. So we cannot resolve this by engineering alone. We must hand it to the team lead (values question).

  Example 3: Reward from a learned model trained on past labels, and the agent can only find the model's blind spots.

  Reward path: Agent actions -> environment state -> learned model input -> learned model output (reward) -> reward scalar.

  Nodes:
  - Environment state: agent can influence.
  - Model input: derived from environment state.
  - Model output: the reward.

  Reachability:
  - Model input: within episode, yes (via environment state).
  - Model output: not directly, but via input.

  But the agent can influence the model output by taking actions that exploit blind spots.

  Epistemic gate:
  - Discovery: the agent might not know the model's blind spots initially, but it can learn by trial and error. If the reward model is fixed, the agent can experiment and find inputs that yield high reward without doing the task. So discovery is possible.
  - Preference: if exploiting blind spots is easier than the task, the agent will do it.

  But note: this is not wireheading because the agent is not intervening on the measurement machinery (the model itself is fixed and the agent can't change it). It is also not tampering with the delivery. It is just exploiting the reward function's flaws. This is a case of the agent doing the task in an unforeseen way? Or is it hacking?

  We must note: the learned model is an imperfect proxy for the true reward. The agent is optimizing the proxy, which is what we told it to do. But if the proxy has blind spots, that's a design flaw. The agent isn't tampering; it's just being clever. But the client doesn't want that.

  This is a values question: the client wants the true goal, not the proxy. But the setup uses the proxy. So we must hand it to the team lead.

  Now, we structure the procedure.

  Procedure in continuous prose:

  Start by tracing the reward path: for the given setup, we map the causal chain from the agent's outputs to the scalar that the optimizer uses. We list every step, including the agent's actions, the environment's response, any logging, any human or model-based rating, and the computation of the scalar. Ask: what are the nodes in this chain?

  Then, for each node in the chain, we perform a three-horizon reachability test. First, can the agent, using its normal actions within a single episode, cause a change at this node? Consider the action space and the immediate effects. Second, can the agent, by actions that span multiple episodes, cause a change at this node through persistent state? This includes files, memory, or any state that lasts beyond an episode. Third, can the agent, by influencing the training process, cause a change at this node? This includes shaping the data that trains any component, including reward models or the agent itself. If any of these is yes, we note that the node is reachable.

  Then, for any reachable node, we apply the epistemic gate. We ask: could the agent in principle discover that this node exists and that influencing it leads to higher reward? We base this on the agent's access to information: if the node is observable (e.g., the agent can see the reward signal and the node's state) and the agent can perform experiments, then discovery is possible. Then we ask: if the agent discovers this, would it prefer to influence this node rather than pursue the intended task? We judge this by comparing the difficulty and reliability: if influencing the node is easier or more reliable than the intended task, we assume the agent will prefer it. This step is a judgment call, so we must be explicit about the reasoning and conservative: if there is uncertainty, we assume the worst.

  After the epistemic gate, if we judge that the agent could discover and prefer to influence the node, we then classify the issue. If the node is part of the direct measurement of the reward — meaning it is a sensor, an input to the reward function, or the displayed score — then this is wireheading. Wireheading is a no-go; we stop and reject the run. If the node is part of the broader reward computation or delivery system (e.g., the training data pipeline, the human rater's state, the script that runs the reward) but not the measurement itself, then this is reward tampering. For reward tampering, we then look at the horizon: if the reachability was through the optimizer (the third horizon) then it is a no-go because it is a feedback loop that can corrupt the entire process. If the reachability was within or across episodes (first or second horizon) then we may be able to add countermeasures. We then consider whether there are known and feasible countermeasures (e.g., restricting access, adversarial training, or monitoring). If we can add such countermeasures and they are robust, we proceed; otherwise, it becomes a no-go.

  If the issue is not wireheading or tampering but rather that the agent is achieving high reward by a method that is legal per the setup but not what the client intended (like flattery or exploiting blind spots), then we hand the decision to the team lead because it is a values question: the client must decide if that behavior is acceptable.

  After all nodes, if there are no issues, we clear the run.

  Now, for the examples:

  Example 1 (log file): 
  - Nodes: log file is reachable within an episode (if agent can write). 
  - Epistemic: agent can discover and prefer (it's easier). 
  - Classification: wireheading (the log is an input to the reward measurement) -> no-go.

  Example 2 (human rater):
  - Nodes: the human's perception is reachable (via messages). 
  - Epistemic: discovery and preference likely (if flattery works). 
  - But the node is the intended measurement? So we don't classify as wireheading. However, the client might not want flattery. This is a values question -> hand to team lead.

  Example 3 (learned model blind spots):
  - The model input is reachable (via environment). 
  - Epistemic: agent can discover blind spots by trial and error and prefer if easier. 
  - But this is not wireheading (the model is fixed and the agent isn't tampering). It's a flaw in the reward function. The agent is optimizing the proxy. This is a values question -> hand to team lead.

  The team will hate example 3 because it's a common setup and we are saying it's not a clear engineering no-go but a values issue, meaning they have to involve the lead and possibly the client, which is more work and might delay the run.

  Finally, we note which steps are judgment calls: the entire epistemic gate is a judgment call, especially the preference part. We must document the reasoning. Also, when we say "part of the measurement" for wireheading vs. "broader computation" for tampering, that can be fuzzy. And the countermeasure assessment for tampering is also a judgment call.

  The procedure cannot settle values questions; it can only flag them for human decision. It also cannot account for every possible side effect; we focus on the reward path.

  We write it as an email.
answer: |-
  Here's the procedure in continuous prose, as requested. I'll walk through the steps, then apply it to your three setups, including one that will yield an answer your team will dislike. The core of the procedure is your three ideas: tracing the reward path, testing reachability on three horizons, and gating with an epistemic check. The judgment calls will be explicitly called out, especially around the epistemic gate and values decisions, as that’s where ambiguity lives. Remember, the goal is to separate clever-but-valid optimization (which we might allow) from wireheading or reward tampering (which we block or mitigate).

  Start by tracing the reward path. Map the causal chain from the agent’s outputs back to the scalar the optimizer sees, node by node. Include every step: the agent’s actions, environment responses, logging layers, scripts, human raters, learned models, and the final reward computation. For example, if the reward comes from a script reading a log, the path might be agent action → environment state → log file entry → script input → script output → reward scalar. Document this path explicitly; if the team disagrees on nodes, resolve it before proceeding, as errors here cascade. This step is foundational and mostly mechanical, but misidentifying a node (e.g., missing a hidden data pipeline) is a risk.

  Next, for each node on the path, run the three-horizon reachability test. First, within a single episode: can the agent alter this node using its declared action space? Actions include not just task outputs (e.g., pressing a button) but any API calls, file writes, or environment interactions it can perform. If yes, flag it. Second, across episodes: can the agent alter this node through persistent state, like files, memory, environment carryover, or configuration changes that outlast an episode? If yes, flag it. Third, through the optimizer: can the agent alter this node by influencing training data, feedback, or model updates over time? This includes poisoning datasets, manipulating human raters’ long-term behavior, or altering reward model training. If yes, flag it. This step is binary—reachable or not—and relies on the system specs, so it’s less subjective. But if the environment’s behavior is undefined (e.g., "can the agent corrupt the cloud log?"), assume reachability unless proven otherwise; false negatives are costlier here.

  Now, the epistemic gate: for each reachable node, assess whether the agent could in principle discover it and come to prefer influencing it over pursuing the intended task. Discovery hinges on observability: can the agent infer the node’s existence and role from its inputs, outputs, or reward signals? For instance, if the agent sees the reward change when it modifies a log, and it can experiment, discovery is likely. Preference hinges on comparative advantage: if influencing the node is easier, more reliable, or higher-reward than the intended task, the agent will prefer it. This is where judgment dominates. Use conservatism: if influencing the node cuts task difficulty or variance by half (even heuristically), or if the node is directly coupled to reward (e.g., a score display), assume preference. Argue explicitly—don’t handwave. If the team deadlocks, escalate to me. This gate is the crux; it’s where clever shortcuts (e.g., exploiting a loophole in the environment) might be safe, while wireheading/tampering isn’t.

  With that, branch the response. If a node is reachable and passes the epistemic gate (discovery and preference are possible), classify it: wireheading if the node is part of the reward measurement itself (sensors, reward model inputs, or the displayed score), as this corrupts the feedback loop by design. Reward tampering if it’s broader interference (e.g., altering logging scripts, human rater instructions, or training data). Wireheading is an automatic no-go; ship nothing, as fixes usually require a reward redesign. For reward tampering, check the horizon: if it’s through the optimizer (third horizon), no-go—it’s a systemic risk. If it’s within or across episodes (first or second horizons), add a countermeasure if it’s robust, like sandboxing write access, adversarial training for reward models, or rater blind protocols. If no proven countermeasure exists, no-go. If the node is reachable but fails the epistemic gate (e.g., discovery is implausible or influencing it is harder than the task), mark it safe and proceed. Crucially, if the agent’s behavior is valid per the reward setup but misaligned with the client’s intent (e.g., it’s flattering a rater instead of solving the task, but flattery is legal), hand it to me—it’s a values call, not engineering. Finally, if all nodes are safe, clear the run. Document every branch; false no-gos hurt, but false goes risk existential flattery.

  Let’s run this on your three setups. First, the reward from a script reading a log file the agent can write to. Trace the path: agent action → environment state → log file (agent-writable) → script input → reward scalar. Nodes: log file (reachable within episode via write actions), script (unreachable if immutable). Log file passes epistemic gate: agent can observe reward changes when writing nonsense (discovery), and writing is easier than real tasks (preference). This is wireheading—it’s direct measurement intervention. No-go. Your engineers might argue writing to the log is "part of the task," but if the script uses it for reward, it’s measurement corruption. No countermeasure short of read-only logs.

  Second, reward from a human rater reading the agent’s messages, where flattery is possible. Path: agent message → rater’s perception → rater’s label → reward scalar. Nodes: rater’s perception (reachable within episode via message content). Epistemic gate passed: agent can test flattery (e.g., "Great job, human!") and see reward spikes (discovery), and flattery is easier than complex tasks (preference). But is it wireheading? No—perception isn’t the measurement; the rater’s judgment is. This is reward tampering on the first horizon. A countermeasure exists: mask flattery patterns in messages or use rater training. Proceed with that fix. However, if the tampering were through the optimizer (e.g., agent slowly trains raters to reward flattery), it’d be no-go.

  Third, reward from a learned model trained on past labels, where the agent can only find blind spots. Path: agent action → environment state → model input → model output → reward scalar. Nodes: model input (reachable within episode), model output (indirectly reachable via input). Epistemic gate passed: agent can probe for blind spots (e.g., odd inputs that yield high reward) via experimentation (discovery), and exploiting blind spots is often easier than generalizing (preference). But this isn’t wireheading (no measurement intervention) or tampering (no process corruption). The agent is optimizing the proxy well, just not as the client wants. This is a values question—hand it to me. Your team will hate this because it’s common, and countermeasures (e.g., robust reward models) are flaky. But the procedure forces a values call: if the client wants true goal alignment, we might need to decline the run; if they accept proxy hacking, we proceed. It’s not engineering-settled.

  The epistemic gate is the judgment call dressed as procedure: discovery and preference assessments are heuristic and prone to overcaution. Also, classifying "measurement" vs. "broader process" in wireheading/tampering can blur (e.g., is a rater’s brain part of the measurement?). The procedure cannot settle values disputes or out-of-distribution risks (e.g., novel tampering post-deployment). It’s a pre-flight screen, not a guarantee. Use it to catch clear failures, not debate philosophy. For your team, stress that "reward hacking" isn’t one thing—wireheading kills the run, tampering might be fixable, and values calls go to me. Done right, this balances the costs: a false no-go stings, but a false go is catastrophic. I’ll refine this with you live if needed.
