  We are given a task to create a procedure for iterated elimination of dominated strategies (including by mixed strategies) for a finite game. The procedure must be executable by a non-specialist and must include explicit stopping rules and disclosure of limitations.

  Procedure:

  1. **Fix the game and the scale of payoffs**:
     - Before any analysis, note the players, their strategies, and the payoff matrix.
     - Determine the scale of payoffs: 
       - If the payoffs are cardinal (i.e., represent magnitudes that can be averaged, such as monetary payoffs or utilities that are linear in the outcomes), then proceed with the full procedure including mixed strategies.
       - If the payoffs are ordinal (i.e., only the ranking of outcomes matters and the numbers do not represent intensities), then stop: mixed strategies cannot be used because expected payoffs are not comparable. In this case, only elimination by pure strategies (strict or weak) is allowed, but note that weak dominance has pitfalls (see step 5). The procedure will only use strict dominance by pure strategies and then stop.

     *Judgment call*: The analyst must judge whether the payoffs are cardinal. If in doubt, consult the economics team. Without cardinality, mixed strategies are off the table.

  2. **Screen for strategies strictly dominated by a pure strategy**:
     - For each player, check each of their strategies against every other pure strategy of theirs. Strategy A is strictly dominated by pure strategy B if, for every possible combination of the opponents' strategies, the payoff from B is strictly greater than the payoff from A.
     - Eliminate any strategy that is strictly dominated by a pure strategy. Record the elimination (e.g., "Player 1's strategy X is strictly dominated by pure strategy Y").
     - Iterate: After each elimination, re-examine the remaining strategies to see if any new strict dominances by pure strategies have appeared. Continue until no more strategies can be eliminated in this way.

     Why safe? Elimination of strictly dominated strategies (by pure or mixed) does not remove any strategy that is played in a Nash equilibrium. Moreover, the order of elimination of strictly dominated strategies (by pure or mixed) does not matter: the set of strategies that survive is always the same.

  3. **Operational test for strict domination by a mixed strategy** (only if payoffs are cardinal):
     - The theory: A strategy s_i of player i is strictly dominated by a mixed strategy if there exists a probability distribution over the other strategies of player i such that the expected payoff from the mixture is strictly greater than the payoff from s_i for every possible strategy profile of the opponents.
     - How to test: 
       - Consider a strategy s_i of player i. We wish to see if there is a mixture of the other strategies that strictly dominates s_i.
       - We can set up a system of inequalities: for each profile of opponents' strategies (say, there are k profiles in the reduced game), the expected payoff of the mixture must be strictly greater than the payoff of s_i. 
       - However, without linear programming, we must search for a candidate mixture.

     Proposed search procedure (for a given player i and a strategy s_i):
     - Step 3.1: List all the opponent strategy profiles that are still in the game (after previous eliminations). Let there be m profiles.
     - Step 3.2: We are looking for a probability vector (p1, p2, ..., p_n) over the n remaining strategies of player i (excluding s_i) such that for each opponent profile j (from 1 to m):
          sum_{k=1 to n} [ p_k * u_i(k, j) ] > u_i(s_i, j)
       and the probabilities sum to 1 and are nonnegative.
     - Step 3.3: Since the analyst is not using optimization, we suggest the following:
          a. Try simple mixtures: equal probability over two or three strategies. 
          b. Try mixtures that are "intuitive" — for example, if two strategies each do well in some cases, try a 50-50 mix. 
          c. For each candidate mixture, check the inequality for every opponent profile. If the candidate mixture is strictly better in every profile, then s_i is strictly dominated by that mixture.
          d. If no simple mixture is found, then try to see if there is a mixture by solving a system of linear inequalities by trial and error. However, note that this may be time-consuming.

     - Step 3.4: To recognize quickly that a candidate mixture works: plug in the mixture's expected payoff at each opponent profile and compare to s_i's payoff. If at every profile the mixture gives more, then it works.
     - Step 3.5: When to stop looking? The analyst must be exhaustive. However, note that if the game is small (as in the examples we have), it is feasible to check all pairs and triples. If the analyst cannot find a dominating mixture after a reasonable search (say, 30 minutes per strategy) and the game is too large, then they must note that no mixture was found and move on.

     *Judgment call*: The search for a dominating mixture is not guaranteed to be exhaustive without linear programming. The procedure might miss a domination. Therefore, the analyst must note that the absence of a found mixture does not prove that none exists. However, for the purpose of the one-day analysis, we accept this limitation.

     - If a strategy is found to be strictly dominated by a mixture, eliminate it. Record the elimination and the mixture used.

  4. **Iterate and halt**:
     - After each elimination (by pure or mixed strategy), return to step 2 (strict domination by pure strategies) because the removal of a strategy may create new opportunities for domination by pure strategies. 
     - Then, if payoffs are cardinal, apply step 3 again to the reduced game for strategies that were not eliminated by pure strategies. 
     - Halt when no more strategies can be eliminated by either strict domination by a pure strategy or (if applicable) by a mixed strategy.

     What the surviving set licenses:
     - If only one strategy profile survives (i.e., one strategy per player), then that is the unique prediction of the game. 
     - If multiple strategy profiles survive, then the procedure does not predict a single outcome. The note must state that the game has multiple possible outcomes consistent with rationality and common knowledge of rationality (via iterated strict dominance). It does not rule out any Nash equilibrium (because every Nash equilibrium survives iterated strict dominance). 

  5. **Weak dominance**:
     - The procedure forbids iterative elimination of weakly dominated strategies. Why? The elimination order matters: the set of strategies that survive may depend on the order of elimination. Moreover, a Nash equilibrium may be eliminated by iterative weak dominance. 
     - If the analyst is tempted to use weak dominance (for example, if a strategy is weakly dominated by a pure strategy), they must note that this is outside the safe procedure and requires consultation with the economics team. The procedure must not use weak dominance.

  6. **Correlation of opponents' strategies** (for 3+ players):
     - In games with three or more players, the definition of domination by a mixed strategy depends on whether we allow the opponents to correlate their strategies or assume independence. 
     - The standard Nash equilibrium assumes independence. However, for the purpose of strict domination by a mixed strategy, the theory allows for correlated beliefs. The procedure should assume that the opponents' strategies can be correlated (which is the standard in the definition of dominated strategies). This means that when checking the domination condition, we consider every possible pure strategy profile of the opponents (even if they are correlated). 
     - Disclosure: The note must state: "The analysis assumes that players believe their opponents can correlate their strategies arbitrarily. If we instead assume independence, the set of dominated strategies might be smaller."

     *Note*: For two-player games, the set of pure strategies of the opponent is just the set of columns (or rows) and there is no correlation issue because there is only one opponent.

  7. **Record and report**:
     - At every step, record the eliminations and the reasons.
     - If at any point the procedure cannot eliminate any more strategies, report the remaining strategies per player.

