  - (M,R): Player 1: 1. If they deviate to D: 1 (same) or to U:0. Player 2: 2. If they deviate to L: they get 2? No, if Player 1 is playing M and Player 2 deviates to L, then Player 2 gets 1 (from (M,L)) which is less than 2. So Player 2 will not deviate. Player 1 has no incentive to deviate (since 1 is the best they can get when Player 2 plays R: because D also gives 1). So (M,R) is Nash.

  Also, (U,L): Player 1: 2, Player 2: 1. If Player 1 deviates to M: gets 0 -> no; to D:0 -> no. Player 2 deviates to R: gets 0 -> no. So (U,L) is Nash.

  And (D,R): Player 1 gets 1. If they deviate to M: 1 (same) or to U:0 -> no. Player 2 gets 2, if deviates to L: gets 0 -> no. So (D,R) is Nash.

  So we have three Nash equilibria: (U,L), (D,R), and (M,R).

  Now, note that M is weakly dominated by D? 
  - Against L: M=0 == D=0
  - Against R: M=1 == D=1
  So no weak domination? 

  But we want M to be weakly dominated. So let us change:

          L        R
  U     (2,1)    (0,0)
  D     (0,0)    (2,2)   # change D in R to (2,2)
  M     (0,0)    (1,2)   # and M in R to (1,2)

  Now, D weakly dominates M:
  - Against L: D=0 == M=0
  - Against R: D=2 > M=1 -> so weak domination.

  But now, what are the Nash equilibria?
  - (U,L): still Nash.
  - (D,R): Player 1 gets 2, Player 2 gets 2. Player 1: deviating to M:1 (worse) or to U:0 (worse). Player 2: deviating to L:0 (worse). So (D,R) is Nash.
  - (M,R): Player 1 gets 1. But if Player 1 deviates to D, they get 2 (better) -> so not Nash.

  So M is not played in any Nash equilibrium. 

  We need to make Player 1 indifferent when Player 2 plays R. So set:

          L        R
  U     (2,1)    (0,0)
  D     (0,0)    (1,2)
  M     (0,0)    (1,2)   # M in R: (1,2) same as D.

  But then D does not weakly dominate M because they are equal in R and L.

  Alternatively, make M give a little less in R? But then Player 1 would deviate from M to D in the (M,R) profile.

  The solution: make a mixed strategy equilibrium? But we want a pure strategy Nash that includes M.

  I recall that in the Prisoner's Dilemma, the cooperative strategy is weakly dominated and is not played in the Nash equilibrium. 

  Another idea: make a game with a weakly dominated strategy that is played in a Nash equilibrium. For example:

  Player 1: U, D
  Player 2: L, R

          L     R
  U     (1,1) (1,1)
  D     (1,1) (0,0)

  Now, U weakly dominates D: against L: 1>=1, against R: 1>=0, and strictly in R.

  Nash equilibria: 
  - (U,L), (U,R): because if Player 1 plays U, Player 2 is indifferent (both give 1) and if Player 2 plays L or R, Player 1 playing U is best (against L: U=1, D=1 -> indifferent; against R: U=1, D=0 -> so U is best). 
  - Also, (D,L) is not Nash because Player 1 would want to deviate to U (which gives 1, same) but if we allow that, then (D,L) is Nash? Because Player 1 is getting 1 and deviating to U gives 1 -> not strictly better. Similarly, Player 2 is getting 1 and deviating to R would give 1 (if Player 1 plays D: then (D,R) gives (0,0) -> no, if Player 2 deviates to R when Player 1 is playing D, then Player 2 gets 0 which is worse). So (D,L) is Nash? 

  Actually, (D,L): 
  - Player 1: if they play U instead, they get 1 (same) -> so no strict incentive to deviate. 
  - Player 2: if they play R instead, they get 0 (worse) -> so they won't deviate. 
  So (D,L) is Nash.

  Now, D is weakly dominated by U. But D is played in (D,L), which is a Nash equilibrium.

  Now, we run the procedure:

  Step 1: Payoffs are cardinal? Assume yes.

  Step 2: Check for strict domination by pure strategies.
  - For Player 1: U and D.
    - Against L: U=1, D=1 -> same.
    - Against R: U=1, D=0 -> U better in R, but not in L? So no strict domination.

  - For Player 2: 
    - Against U: L=1, R=1 -> same.
    - Against D: L=1, R=0 -> L better in D, but in U they are the same? So no strict domination.

  Step 3: Check for strict domination by mixed strategies.

  For Player 1: 
  - Consider D: is there a mixture of U (the only other strategy) that strictly dominates D? That would be U alone. But against L: U=1, D=1 -> not strictly greater. So no.

  For Player 2: 
  - Consider R: is there a mixture of L that strictly dominates R? That would be L alone. Against U: L=1, R=1 -> not strictly greater. Against D: L=1, R=0 -> strictly greater in D, but in U they are equal. So not strict domination in every profile.

  Thus, the procedure does not eliminate any strategy. The surviving set: {U, D} for Player 1 and {L, R} for Player 2.

  The group might want to eliminate D because it is weakly dominated, but the procedure does not. The note must explain that eliminating weakly dominated strategies can remove a Nash equilibrium (here, (D,L)) and therefore is not safe.

  Blind spots:

  1. **Payoff scale uncertainty**: If the analyst misjudges the cardinality, the procedure may skip mixed strategies or use them inappropriately.

  2. **Incomplete elimination**: The procedure might not eliminate all strictly dominated strategies because the manual search for mixed strategies may miss some.

  3. **Multiple survivors**: When multiple strategy profiles survive, the procedure does not select among them. This leaves the decision maker without a unique recommendation.

  4. **Games with no dominated strategies**: The procedure may not reduce the game at all, leaving the full matrix.

  5. **Weak dominance temptation**: The procedure forbids weak dominance, but there are cases where it is commonly applied. The analyst might be tempted.

  6. **Correlation assumption**: In 3+ player games, the procedure assumes correlated beliefs. If the game is played with independent strategies, the elimination might be invalid.

  7. **Complex games**: For large games, the manual search for mixed strategy domination is infeasible.

  8. **Non-robustness to payoff perturbations**: Small changes in payoffs can change the set of dominated strategies.

  9. **Inefficiency**: The procedure is manual and may be time-consuming for larger games.

  The procedure should be seen as a first-pass reduction. When it does not yield a unique answer, or when questions arise about payoff scale or correlation, the decision must go back to a human (the economics team) for further analysis using more advanced techniques.
answer: |-
  ### Decision Procedure for Iterated Elimination of Dominated Strategies

  **Purpose**: To reduce finite games via iterated elimination of strictly dominated strategies (including mixed strategies) for rationalizable strategy sets. Produces a set of surviving strategies per player. Outputs a unique prediction *only* if one profile survives; else, discloses indeterminacy. Assumes players have common knowledge of rationality.

  ---

  #### Step 1: Fix the Game and Payoff Scale
  - **Input**: Players, strategies, payoff matrix.  
  - **Payoff Scale Check**:  
    - **Cardinal Payoffs**: Payoffs represent magnitudes (e.g., dollars, utilities). Expected payoffs of mixtures are comparable. *Proceed to Step 2*.  
    - **Ordinal Payoffs**: Payoffs only rank outcomes (e.g., "best" to "worst"). Mixed strategies cannot be evaluated. *Stop here. Output*:  
      > "Payoffs are ordinal. Mixed-strategy domination inapplicable. Only pure-strategy elimination possible. Proceed to Step 2, but stop after pure-strategy elimination (no mixed checks)."  

  **Judgment Call**: Analyst must decide cardinal vs. ordinal. If uncertain, consult economics team.  
  **Theory Honesty**: Mixed strategies require cardinal payoffs to compute expected payoffs. Ordinal scales lack intensity comparisons.

  ---

  #### Step 2: Eliminate Strategies Strictly Dominated by Pure Strategies
  - **Process**:  
    - For each player, compare each strategy \(s_i\) against all other pure strategies.  
    - Eliminate \(s_i\) if there exists a pure strategy \(s_i'\) such that:  
      \[
      \forall \text{ opponent profiles } s_{-i}, \quad u_i(s_i', s_{-i}) > u_i(s_i, s_{-i}).
      \]  
    - **Iterate**: Repeat until no more eliminations. Re-check after each removal.  
  - **Record**: Note eliminated strategies and dominating pure strategies.  
  - **Why Safe?**  
    > "Eliminating strictly dominated strategies (pure or mixed) never deletes any Nash equilibrium strategy. Order of elimination does not affect the surviving set."  

  **Stopping Rule**: Stop when no pure strategy dominates another in the current game.

  ---

  #### Step 3: Test for Strict Domination by Mixed Strategies (Cardinal Payoffs Only)
  - **Criterion**: Strategy \(s_i\) is strictly dominated by a mixed strategy if there exists a mixture \(\sigma_i\) (over other strategies) such that:  
    \[
    \forall \text{ opponent profiles } s_{-i}, \quad u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i}).
    \]  
    *Equivalently*: \(s_i\) is never a best response to any belief about opponents.  
  - **Operational Test**:  
    - **Candidate Mixtures**: Test simple mixtures (e.g., 50-50, 60-40) over 2–3 strategies. Prioritize:  
      - Strategies with high/minimax payoffs.  
      - Mixtures covering complementary opponent scenarios.  
    - **Recognition**: For a candidate mixture \(\sigma_i\), compute expected payoff against *each* opponent profile \(s_{-i}\). If:  
      \[
      \text{Expected payoff of } \sigma_i > \text{payoff of } s_i \quad \forall s_{-i},
      \]  
      then \(s_i\) is dominated. Eliminate \(s_i\).  
    - **When to Stop Looking**: After 20 minutes per strategy or all plausible mixtures (e.g., equal weights, one-off weights) are tested. If no dominating mixture is found, \(s_i\) survives.  
  - **Record**: Note eliminated strategies and dominating mixtures.  
  - **Correlation Disclosure** (for ≥3 players):  
    > "Analysis assumes opponents' strategies may be correlated. If independence is required, mixed domination may be invalid. Disclose: 'Assumes correlated opponent play.'"  

  **Judgment Call**: Choice of candidate mixtures; exhaustive search impractical.  
  **Theory Honesty**: Test is heuristic. A negative result doesn’t prove non-domination (requires linear programming).

  ---

  #### Step 4: Iterate and Halt
  - **Iteration**: After any elimination (Step 2 or 3), return to Step 2 (pure checks first).  
  - **Halt**: When no strategies are eliminated in a full cycle (Step 2 → Step 3 → Step 2).  
  - **Output Survival Set**:  
    - **Single profile per player**: "Unique prediction: play \((s_1^*, s_2^*, \dots)\)."  
    - **Multiple strategies per player**:  
      > "Surviving strategies are rationalizable but not unique. Nash equilibria may exist in the surviving set. No single prediction: outcomes depend on coordination/beliefs."  

  **Theory Honesty**: Iterated strict dominance preserves all Nash equilibria. Multiple survivors imply indeterminacy.

  ---

  #### Step 5: Handling Weak Dominance
  - **Rule**: **Forbid iterative weak dominance elimination.**  
  - **Why**:  
    > "Weak dominance is order-dependent. Iteration may delete Nash equilibria. If a weakly dominated strategy exists, note it but do not eliminate."  
  - **Exception**: Weakly dominated strategies may be flagged for discussion, but never removed. Example note:  
    > "Strategy \(s_i\) is weakly dominated by \(s_i'\) but not eliminated (risk of equilibrium loss)."  

  ---

  ### Procedure Execution on Example Games

  #### Example 1: 3x3 Game
  **Payoff Matrix** (Player 1: Rows; Player 2: Columns):  
  |          | L       | C       | R       |
  |----------|---------|---------|---------|
  | **T**    | (4, 3)  | (3, 0)  | (1, 0)  |
  | **M**    | (2, 0)  | (2, 3)  | (2, 0)  |
  | **B**    | (1, 0)  | (3, 0)  | (4, 3)  |

  **Step 1**: Payoffs cardinal (numerical). Proceed.  
  **Step 2**: No pure-strategy dominations (check rows/columns; no strict inequalities).  
  **Step 3**: Test mixed dominations:  
  - **Player 1’s M**: Test mixtures of T and B.  
    - 50-50 mix: Expected payoffs vs. L: \(0.5 \times 4 + 0.5 \times 1 = 2.5 > 2\)  
      vs. C: \(0.5 \times 3 + 0.5 \times 3 = 3 > 2\)  
      vs. R: \(0.5 \times 1 + 0.5 \times 4 = 2.5 > 2\).  
    → M dominated. Eliminate M.  
  - **Reduced Game**:  
    |          | L       | C       | R       |
    |----------|---------|---------|---------|
    | **T**    | (4, 3)  | (3, 0)  | (1, 0)  |
    | **B**    | (1, 0)  | (3, 0)  | (4, 3)  |  
  **Step 2 (Iterate)**: No pure dominations.  
  **Step 3 (Iterate)**: Test Player 2’s C:  
  - Mixtures of L and R (e.g., 50-50):  
    vs. T: \(0.5 \times 3 + 0.5 \times 0 = 1.5 > 0\)  
    vs. B: \(0.5 \times 0 + 0.5 \times 3 = 1.5 > 0\).  
    → C dominated. Eliminate C.  
  - **Reduced Game**:  
    |          | L       | R       |
    |----------|---------|---------|
    | **T**    | (4, 3)  | (1, 0)  |
    | **B**    | (1, 0)  | (4, 3)  |  
  **Step 2 (Iterate)**: No pure dominations.  
  **Step 3 (Iterate)**: No mixed dominations (no strategy dominated by mixtures of the other).  
  **Halt**: Surviving set: Player 1: {T, B}, Player 2: {L, R}.  
  **Output**:  
  > "No unique prediction. Surviving profiles: (T,L), (T,R), (B,L), (B,R). Nash equilibria: (T,L) and (B,R). Group must coordinate or refine beliefs."  

  **Group Disappointment**: The group may want a unique recommendation, but the procedure correctly outputs indeterminacy. **Accept Because**: Theory guarantees no further reduction under common knowledge of rationality. Forcing a choice would misrepresent the model.

  ---

  #### Example 2: Weakly Dominated Strategy in Nash Equilibrium
  **Constructed Game** (Player 1: Rows; Player 2: Columns):  
  |          | L       | R       |
  |----------|---------|---------|
  | **U**    | (2, 1)  | (0, 0)  |
  | **D**    | (0, 0)  | (1, 2)  |
  | **M**    | (0, 1)  | (1, 2)  |  
  *Nash Equilibria*: (U,L), (D,R), and (M,R). M is weakly dominated by D (equal vs. L, worse vs. R).

  **Step 1**: Cardinal payoffs. Proceed.  
  **Step 2**: Test pure dominations:  
  - M vs. D: vs. L: \(0 = 0\) (not strict); vs. R: \(1 < 2\) (strict).  
    → No *strict* pure domination. M survives.  
  **Step 3**: Test mixed dominations:  
  - M vs. mixtures of U and D (e.g., 50-50):  
    vs. L: \(0.5 \times 2 + 0.5 \times 0 = 1 > 0\)  
    vs. R: \(0.5 \times 0 + 0.5 \times 2 = 1 = 1\) (not strict).  
    → No strict mixed domination. M survives.  
  **Halt**: Surviving set: Player 1: {U, D, M}, Player 2: {L, R}.  
  **Output**:  
  > "M survives despite weak domination by D. Elimination forbidden: M is in Nash equilibrium (M,R)."  

  **Procedure Integrity**: Weak dominance not used; equilibrium preserved.

  ---

  ### Blind Spots and Limitations
  1. **Missed Dominations**:  
     - Heuristic mixed-strategy search may miss valid dominations (requires linear programming).  
     - **Action**: Flag: "No domination found" ≠ "No domination exists."  

  2. **Non-Reduced Games**:  
     - Games with no dominated strategies (e.g., Prisoner’s Dilemma pre-elimination) remain intact.  
     - **Action**: Output full game; recommend equilibrium analysis.  

  3. **Indeterminacy**:  
     - Multiple survivors provide no prescription. Common in coordination/anti-coordination games.  
     - **Action**: Disclose: "Decision requires additional criteria (e.g., focal points, bargaining)."  

  4. **Ordinal Payoff Limitation**:  
     - Stops short of mixed strategies; may leave larger surviving sets.  
     - **Action**: "Use pure-strategy Nash or refinements."  

  5. **Weak Dominance Pitfalls**:  
     - Procedure forbids it, but economics team might argue for ad hoc use.  
     - **Action**: "If weak dominance essential, consult specialists (equilibria may be lost)."  

  6. **Correlation Assumption**:  
     - In 3+ player games, uncorrelated beliefs may yield smaller dominated sets.  
     - **Action**: Disclose assumption; if independence critical, halt mixed checks.  

  7. **Complex Games**:  
     - Large strategy sets make mixed-strategy tests infeasible.  
     - **Action**: "Hand back to economics team for computational methods."  

  **When to Hand Back to Human**:  
  - Ordinal payoffs with complex incentives.  
  - Indeterminate surviving set.  
  - Suspected model errors (e.g., payoff magnitudes inconsistent).  
  - Group requires a single recommendation (use equilibrium selection tools).  

  **Final Advice**:  
  > "This procedure is a robustness check, not a panacea. It verifies rationalizability but does not replace equilibrium analysis. When it halts or outputs multiple outcomes, the decision requires strategic context beyond the model."
