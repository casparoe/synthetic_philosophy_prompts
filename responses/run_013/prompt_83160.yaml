answer: |-
  Your committee's actions reveal the core tensions in public commemoration. Let's untangle the presuppositions, contingent practices, and underdetermined elements:

  **What the Practice Strictly Requires:**
  1.  **Individualization:** Statues inherently commemorate *specific individuals*, not abstract concepts or collective efforts. The medium forces focus on a person.
  2.  **Significant Contribution:** The practice presupposes the individual made a *substantial, publicly recognized contribution* to the community, nation, or field. The statue marks that contribution as noteworthy.
  3.  **Honorific Intent:** Erecting a statue *is* an act of honoring. It elevates the individual above the ordinary citizenry, placing them literally on a pedestal in a public space. This distinguishes it from mere naming (a label) or historical markers (which record without necessarily glorifying).
  4.  **Endurance:** Bronze and stone imply the honor and the contribution are meant to be *enduring*, transcending the immediate moment. This creates the future conflict when values shift.

  **What We've Historically Bundled Together (Contingent, Not Essential):**
  1.  **"Great Man" Theory:** While statues individualize, they *need not* presuppose history is *only* made by singular geniuses acting alone. We *choose* to bundle the statue with the narrative that *this person* was the *primary* agent. It *could* be explicitly framed as "representing the collective effort they led," but this narrative is rarely foregrounded by the statue itself; the medium leans towards individual glorification.
  2.  **Moral Exclusivity in Removal:** The focus on *moral* failings (rather than factual errors) for removal isn't inherent to statues. It's a contingent cultural choice reflecting that we see statues as honoring *character* (or at least character *in service* to the contribution) *as much as* the contribution itself. We tolerate "wrong science" because we view intellectual error differently from moral failure. This bundle links the honor to perceived virtue.
  3.  **The "1900 Rule" (or Temporal Proximity Bias):** The idea that figures before a certain date get a pass is contingent pragmatism, not philosophy. It bundles:
      *   **Diminished Responsibility:** An (often unspoken) assumption that people are less accountable for views endemic to their era.
      *   **Historical Distance:** A feeling that older figures belong to a fundamentally different, less relatable past.
      *   **Pragmatic Exhaustion:** The impossibility of judging *every* historical figure by modern standards.
      *   **"Contested in Their Time":** This *is* a common heuristic used to justify removal (or preservation), but it's a contingent rule of thumb, not a strict requirement. It bundles the idea that holding mainstream views is less culpable, and that dissenters deserve more credit (or that failing to dissent is more culpable).

  **What is Underdetermined (Multiple Theories Fit the Behavior):**
  1.  **What Precisely is Being Honored?**
      *   *Theory A (Pure Contribution):* The statue honors the *achievement* (railroads built, discoveries made, battles won) regardless of the individual's character or methods. Moral failings are irrelevant unless they directly negate the achievement.
      *   *Theory B (Character + Contribution):* The statue honors the individual *as a whole person* deemed worthy – their achievement *and* the perceived virtues (courage, leadership, wisdom) that enabled it. Moral failings directly undermine the honor.
      *   *Your committee acted on Theory B for removal ("how he treated his workers" undermined the honor) but reverted towards Theory A for the name ("label" for the contribution).*
  2.  **The Semiotics of the Plinth:**
      *   *Theory A (Vessel for Honor):* The plinth is merely the necessary support for the statue *which is the honor*. Empty, it signifies the *absence* or *withdrawal* of honor. Its meaning is defined by what was there.
      *   *Theory B (The Site of Memory/Contention):* The plinth *itself* becomes a commemorative object, signifying the *history* of commemoration, the removal, the debate. It commemorates the *act* of re-evaluation and the unresolved tension. Its emptiness *is* its message.
      *   *Your empty plinth currently functions under Theory B.*
  3.  **The Name/Label Distinction:**
      *   *Theory A (Label):* Names on buildings, streets, etc., are primarily functional identifiers, not active honors. They denote historical association or patronage, not necessarily ongoing moral endorsement. Renaming is administrative.
      *   *Theory B (Subtle Honor):* All naming after individuals is a form of honor, albeit less intense than a statue. The distinction is one of *degree*, not kind. Renaming *is* an act of decommemoration.
      *   *Your committee used Theory A to justify keeping the name.* This distinction is fragile; many perceive naming as honorific.

  **Achieving Consistency: What the Town Must Believe**

  To reconcile removing a statue while keeping the name and plinth, *and* maintain a general policy, the town must explicitly adopt and adhere to a coherent theory:

  1.  **Statues Primarily Honor Character:** The decision to erect a statue signifies that the community honors *both* the individual's contribution *and* their perceived virtuous character necessary for that contribution. If significant moral failings (especially those contradicting the perceived virtue or directly harming the community) are later recognized as core to the individual's story, the honor is invalidated. The statue must go.
  2.  **Names Primarily Denote Contribution/Association:** Applying a name to a functional building or space signifies historical association or recognition of a specific contribution. It is not an ongoing endorsement of the individual's entire character or life. The contribution (building the auditorium) remains a factual part of the town's history, worthy of the label.
  3.  **The Plinth as a Site of Collective Memory (Optional but Consistent):** The empty plinth can be consciously reframed not as an absence, but as a new kind of monument. It commemorates the *process* of civic re-evaluation, the town's evolving values, and the complexity of history itself. It becomes an active memorial to the debate and the decision.
  4.  **The "Contested in Their Time" Heuristic (For Older Figures):** For figures from distant eras, the town adopts the rule that removal requires evidence the individual's objectionable views or actions were *actively contested by a significant moral voice within their own society*. This provides a (contestable) standard for applying modern judgment retrospectively, focusing on culpability relative to available contemporary ethical discourse. Figures who merely reflected widespread, unchallenged norms of their time are judged less harshly *for commemoration purposes*, though their views are still condemned.
  5.  **Acknowledging the Bundle:** The town must explicitly acknowledge that while statues inherently individualize and honor, the *focus* of that honor (pure contribution vs. character+contribution) and the *rules for revocation* are societal choices, not inherent properties of bronze. The distinction between name (label) and statue (honor) is a useful, though somewhat artificial, convention adopted for pragmatic and symbolic reasons.

  **In short:** Statues require honoring an individual for a significant contribution. We've bundled that with honoring character and applied inconsistent historical judgment. Consistency demands separating the *type* of honor (statue = character + contribution; name = contribution label) and applying clear, principled rules (like "contested in their time") for when the honor is revoked – while recognizing the empty plinth now tells a new story about the town's values in flux. The contradiction arises from applying different theories to the statue and the name; consistency requires explicitly adopting and sticking to those distinct theories.
