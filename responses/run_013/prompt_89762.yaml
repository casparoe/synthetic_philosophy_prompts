          Is that acceptable? The conditional "if A then C" is often taken to be true when A is false (the vacuous truth). But in the (not-A and not-C) case, the letter is not from a friend and not franked. The conditional "if friend then franked" is still true? Yes, because the antecedent is false. So the conditional should be true in that case too. Therefore, the entire event (not-A or C) should be true. So we should set P(not-A or C)=1, which requires that P(not-A and not-C)=0 as well? No, wait: (not-A and not-C) is part of (not-A), and (not-A) is part of (not-A or C). So (not-A and not-C) is a subset of (not-A or C). Therefore, we don't have to set it to zero. The event (not-A or C) is true in the (not-A and not-C) case? 

