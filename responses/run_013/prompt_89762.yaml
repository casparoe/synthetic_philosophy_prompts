            (A and C), (not-A and C), (not-A and not-C)

          and false only in (A and not-C).

          So if we set P(A and not-C)=0, then automatically P(not-A or C)=1. Therefore, rule (b) does set P(not-A or C)=1.

          How? Because:

            P_new(not-A or C) = P_new(A and C) + P_new(not-A and C) + P_new(not-A and not-C)
                               = [P_old(A and C)+P_old(A and not-C)] + P_old(not-A and C) + P_old(not-A and not-C)
                               = P_old(A) + P_old(not-A) = 1.

