          Therefore, rule (b) is a valid way to achieve P(not-A or C)=1. And it is different from rule (a).

          But wait: in rule (a) we had:

            P_new(not-A and not-C) = P_old(not-A and not-C) / (1 - P_old(A and not-C))

          which is not the same as in rule (b) where it remains P_old(not-A and not-C).

