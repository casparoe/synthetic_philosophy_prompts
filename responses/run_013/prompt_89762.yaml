          This is the crux: the constraint P(not-A or C)=1 is equivalent to P(A and not-C)=0. But it does not determine how to redistribute the probability mass. There are infinitely many ways to redistribute the mass from (A and not-C) to the other three cells. Rule (a) and rule (b) are two different redistributions.

          Therefore, the constraint alone does not determine the update.

          This is where the additional desiderata come in.

          The minimum cross-entropy rule (rule (c)) chooses the distribution that is closest to the prior in the sense of minimizing relative entropy. That turns out to be rule (a) (the standard conditionalization).

          Rule (b) is the one that preserves the probabilities of the cells not involving A (i.e., the not-A cells) and moves all the mass from (A and not-C) to (A and C). This can be justified by the principle of preserving the conditional probabilities given not-A.

          Therefore, we have two candidates:

            (a) = (c): standard conditionalization on the material conditional -> violates silent antecedent.
            (b): Adams conditioning (or imaging) -> satisfies silent antecedent.

          Which one to choose? We need additional requirements.

          Let's consider requirement 4: uncertain evidence.

          In the case of uncertain evidence, we might learn that P(A→C) is high, but not 1.

          In the standard Bayesian framework, we would use Jeffrey conditionalization. But Jeffrey conditionalization requires a partition and the new probabilities on the partition.

          For rule (a): if we want to set P(not-A or C) to some value q (not necessarily 1), we can use Jeffrey conditionalization on the partition { (not-A or C), (A and not-C) }.

            We set:
              P_new(not-A or C) = q
              P_new(A and not-C) = 1-q

            Then we distribute the probabilities conditionally:

              For any event E, P_new(E) = q * P_old(E | not-A or C) + (1-q) * P_old(E | A and not-C)

            This is well defined.

          For rule (b): we want to set P(C|A)=q. This is sometimes done by probability kinematics: we set the new conditional probability P_new(C|A)=q, and we leave P_new(A)=P_old(A) and the conditional distribution given not-A unchanged.

            Then:
              P_new(A and C) = P_old(A) * q
              P_new(A and not-C) = P_old(A) * (1-q)
              P_new(not-A and C) = P_old(not-A and C)
              P_new(not-A and not-C) = P_old(not-A and not-C)

            But note: we are not changing the probabilities of the not-A cells. So the total probability:

              P_new(not-A and C) + P_new(not-A and not-C) = P_old(not-A)

            and P_new(A) = P_old(A). So it's a valid distribution.

          The uncertain evidence case then has two different rules.

          Now, the non-propositional view: rule (b) does not treat the conditional as a proposition. We are updating the conditional probability directly. This avoids the triviality results.

          But rule (a) does treat the conditional as a proposition. And it works consistently.

          However, the triviality results show that we cannot have a proposition in the algebra such that for every prior we have P(A→C) = P(C|A). But in rule (a), we are not claiming that. We are only using the material conditional for updating. And after the update, P_new(C|A) might not be 1? Let's check:

            In rule (a) when we set P(not-A or C)=1 (q=1), then P_new(A and not-C)=0, so P_new(C|A) = P_new(A and C)/P_new(A) = [P_old(A and C) / P_old(not-A or C)] / [P_old(A) / P_old(not-A or C)] = P_old(A and C)/P_old(A) = P_old(C|A).

            Wait, that doesn't equal 1 unless P_old(C|A)=1. So rule (a) does not set P_new(C|A)=1? 

            But we wanted to learn the conditional "if A then C", which we interpret as requiring P_new(C|A)=1. 

            Therefore, rule (a) does not achieve this! 

            This is a critical point.

            In rule (a), after conditionalizing on (not-A or C), we have:

               P_new(C|A) = P_new(A and C) / P_new(A)
                           = [ P_old(A and C) / P_old(not-A or C) ] / [ (P_old(A)) / P_old(not-A or C) ) ]
                           = P_old(A and C) / P_old(A) = P_old(C|A)

            So the conditional probability P(C|A) is unchanged by rule (a)!

            This is a bombshell. We thought we were learning that if A then C, but in fact our conditional probability of C given A is not changed by rule (a). 

            Why? Because both the numerator and the denominator are scaled by the same factor (1 / P_old(not-A or C)), so the ratio remains the same.

            Therefore, rule (a) does not give us what we want: we want to set P(C|A)=1, but it leaves it unchanged.

            This is a strong reason to reject rule (a) for updating on a conditional.

            But wait, what if we interpret the evidence as the material conditional? Then learning that the material conditional is true does not tell us anything about the conditional probability? That seems odd.

            Example: Prior:
               P(A and C) = 0.4
               P(A and not-C) = 0.1
               P(not-A and C) = 0.3
               P(not-A and not-C) = 0.2

            Then P(not-A or C) = 1 - P(A and not-C) = 0.9.

            P_old(C|A) = 0.4 / (0.4+0.1) = 0.8.

            After conditionalizing on (not-A or C):

               P_new(A and C) = 0.4 / 0.9 ≈ 0.444
               P_new(A and not-C) = 0
               P_new(not-A and C) = 0.3 / 0.9 ≈ 0.333
               P_new(not-A and not-C) = 0.2 / 0.9 ≈ 0.222

            Then P_new(C|A) = P_new(A and C) / P_new(A) = 0.444 / 0.444 = 1? 

            No, wait: P_new(A) = P_new(A and C) = 0.444, so P_new(C|A) = 0.444 / 0.444 = 1.

            But wait, how did we get P_new(A) = 0.444? Because we have only one A cell: (A and C). So naturally, given A, we have C with probability 1.

            What went wrong in my previous calculation? I said P_new(A) = P_old(A) / P_old(not-A or C) = 0.5 / 0.9 = 0.555? But that is not what we have.

            In the new distribution, the event A is (A and C) because (A and not-C) is gone. So P_new(A) = P_new(A and C) = 0.4 / 0.9 = 0.444. And P_old(A) = 0.5, so 0.5 / 0.9 = 0.555, but that would be if we had not redistributed within A. But we have removed (A and not-C), so the new probability of A is not P_old(A) divided by something? It is P_old(A and C) divided by P_old(not-A or C). And P_old(A and C) is 0.4, so 0.4/0.9=0.444.

            And P_new(C|A) = P_new(A and C) / P_new(A) = 0.444/0.444=1.

            So it does work.

            Why did I think differently? I thought: 
               P_new(A) = [P_old(A and C) + P_old(A and not-C)] / P_old(not-A or C) 
            but that's not right because P_old(A and not-C) is not in the event we are conditionalizing on. We are conditionalizing on (not-A or C), which includes (A and C) but not (A and not-C). So:

               P_new(A) = P_old(A and C) / P_old(not-A or C)

            and similarly, P_new(A and C) = P_old(A and C) / P_old(not-A or C)

            so P_new(C|A) = 1.

            Therefore, in rule (a), after conditionalizing on (not-A or C), we do get P_new(C|A)=1.

            The error was in the denominator for P_new(A) — it is not the entire prior probability of A divided by the probability of the conditioning event, but only the part of A that is in the conditioning event.

            So rule (a) does set P_new(C|A)=1.

            Therefore, both rule (a) and rule (b) achieve P_new(C|A)=1 and P_new(not-A or C)=1.

            They just differ in how they treat the not-A cells.

          Given that both rules achieve the constraint, we have two candidates.

          Additional requirement: We might require that the update should not change the conditional distribution given not-A. This is what rule (b) does and rule (a) does not.

          In rule (a), the conditional distribution given not-A changes because we conditionalized. Specifically:

            P_new(C | not-A) = P_new(not-A and C) / P_new(not-A) 
                              = [P_old(not-A and C) / P_old(not-A or C)] / [P_old(not-A) / P_old(not-A or C)] 
                              = P_old(not-A and C) / P_old(not-A)

            which is the same as before. So it doesn't change either!

            In the example above:

               P_old(C|not-A) = P_old(not-A and C) / P_old(not-A) = 0.3 / (0.3+0.2) = 0.6
               P_new(not-A) = P_old(not-A and C) + P_old(not-A and not-C) / P_old(not-A or C) = (0.3+0.2)/0.9=0.5/0.9=0.555
               P_new(not-A and C) = 0.3/0.9≈0.333
               P_new(C|not-A) = 0.333/0.555 = 0.6

            So it is unchanged.

            Therefore, both rules (a) and (b) leave the conditional distribution given not-A unchanged? 

            In rule (b):

               P_new(not-A) = P_old(not-A) = 0.5
               P_new(not-A and C) = P_old(not-A and C) = 0.3
               P_new(C|not-A) = 0.3/0.5=0.6

            So both rules leave P(C|not-A) unchanged.

            What about the probability of (not-A and not-C)? In rule (a), it becomes 0.2/0.9≈0.222, and in rule (b) it remains 0.2. But the conditional probability given not-A is the same.

            The difference is in the probability of not-A: in rule (a), P_new(not-A)= (0.3+0.2)/0.9 = 0.5/0.9≈0.555, while in rule (b) it is 0.5.

            And the probability of A: in rule (a), P_new(A) = 0.4/0.9≈0.444, in rule (b) it is 0.5.

            So rule (a) changes the probability of A and of not-A, while rule (b) does not.

            Therefore, the silent antecedent requirement is satisfied by rule (b) and not by rule (a).

          Now, which one is more appropriate for updating on a conditional? 

          Consider the following: if you learn "if A then C", does that give you information about the not-A world? In the not-A world, the conditional is vacuously true. So it doesn't constraint not-A. Therefore, it seems that the probabilities within not-A should not change. But that is what both rules do: they leave the conditional probabilities given not-A unchanged. However, rule (a) changes the probability of not-A (by reducing the probability of A and hence increasing the probability of not-A relatively) while rule (b) leaves the probability of not-A unchanged.

          But note: in rule (a), the probability of not-A changes because the evidence we conditionalized on, (not-A or C), includes not-A. So it is evidence that not-A might be more likely? 

          However, the conditional "if A then C" does not provide evidence about not-A. In fact, it is often taken to be uninformative about not-A.

          Therefore, the silent antecedent requirement has merit.

          But then how do we achieve it? With rule (b).

          The remaining issue is invariance. We have two ways to state the constraint: 

            (1) P(C|A)=1
            (2) P(A and not-C)=0

          and with rule (b) we get the same result regardless of which one we use: we set P(A and not-C)=0 and then move the probability to (A and C) and leave the not-A cells unchanged.

          So rule (b) satisfies invariance for these two formulations.

          However, consider a third formulation: 

            (3) P(not-A or C)=1

          This is the same as (2). And rule (b) also achieves it, as we saw.

          Therefore, rule (b) seems to satisfy invariance.

          But wait, what if we try to apply rule (b) to the constraint (3)? We would have to set P(not-A or C)=1. This means we have to set P(A and not-C)=0, which is the same as before. And then we would do the same redistribution. So it is the same.

          Therefore, rule (b) is invariant.

          Rule (a) is also invariant if we state the constraint in any of these forms because they are equivalent, and rule (a) is the same as conditionalization on (not-A or C).

          So both rules are invariant.

          Now, which one to choose? We have to look at the uncertain evidence case.

          For rule (b) in the uncertain case: we set P_new(C|A)=q. This is a natural extension.

          For rule (a): we set P_new(not-A or C)=q. But note, this is not the same as setting P_new(C|A)=q. In fact, we have:

            P_new(C|A) = P_new(A and C) / P_new(A)

            = [P_new(not-A or C) * P_old(A and C) / P_old(not-A or C) ] / [ (P_old(A and C) + P_old(A and not-C)) * something ] 

          It gets messy. But in any case, it won't be q.

          Therefore, if we interpret the uncertain evidence as a new level of credence in the conditional (understood as P(C|A)=q), then rule (b) extension is what we want.

          But if we interpret it as credence in the material conditional, then rule (a) is what we want.

          The non-propositional view suggests that we should not interpret the conditional as the material conditional, but rather as an update to the conditional probability.

          Therefore, rule (b) is more in line with the non-propositional view.

          Given that, and that rule (b) satisfies silent antecedent and vacuity, and is invariant under the natural ways to state the constraint, we might choose rule (b).

          But wait: does rule (b) minimize cross-entropy? No, rule (a) does that. But in the uncertain evidence case, rule (b) is not Jeffrey conditionalization. It is a different type of kinematics.

          However, we might not care about minimizing cross-entropy. We care about the desiderata.

          Let's recap the requirements and which rule satisfies:

            Requirement 1 (outright learning): both rules set P(C|A)=1 and P(not-A or C)=1.

            Requirement 2 (silent antecedent): only rule (b) leaves P(A) unchanged.

            Requirement 3 (vacuity): both rules leave the distribution unchanged if P(A)=0.

            Requirement 4 (uncertain evidence): both rules can be extended. Rule (b) extension sets P(C|A)=q directly. Rule (a) extension sets P(not-A or C)=q, which is different.

            Requirement 5 (invariance): both rules are invariant under the equivalent formulations of the certain constraint.

            Requirement 6 (non-propositional): rule (b) does not treat the conditional as a proposition. Rule (a) does, but only in the sense of the material conditional. However, the triviality results show that the conditional cannot be a proposition in general, but they do not forbid us from using the material conditional as a surrogate in a particular update. So both might be acceptable. But rule (b) is more in the spirit of the non-propositional view.

          Given that silent antecedent is a natural requirement and is satisfied by rule (b), and rule (b) also satisfies the other requirements, it seems a good candidate.

          However, let's consider a potential issue with rule (b) in the certain case: 

            Prior: 
               P(friend and franked) = 0.3
               P(friend and not franked) = 0.3
               P(stranger and franked) = 0.2
               P(stranger and not franked) = 0.2

            After learning "if friend then franked" with certainty by rule (b):

               P_new(friend and franked) = 0.3+0.3 = 0.6
               P_new(friend and not franked) = 0
               P_new(stranger and franked) = 0.2
               P_new(stranger and not franked) = 0.2

            Now, note that the probability of franked given that it is a friend is 1, as required. But the overall probability of franked is 0.6+0.2=0.8.

            In rule (a) we would have:

               P_new(friend and franked) = 0.3 / (1-0.3) = 0.3/0.7≈0.4286
               P_new(friend and not franked) = 0
               P_new(stranger and franked) = 0.2 / 0.7≈0.2857
               P_new(stranger and not franked) = 0.2 / 0.7≈0.2857

            So the probability of franked is 0.4286+0.2857=0.7143.

            Which one is more intuitive? 

            In rule (b), we have increased the probability of (friend and franked) by the amount that was in (friend and not franked). This seems to respect the idea that the only thing we learned is that (friend and not franked) is impossible, and we haven't learned anything about the stranger cases, so we leave them as they are.

            In rule (a), we have also increased the probability of the stranger cases because we conditionalized on the event that includes them. This might seem to be overkill.

          Therefore, I rule (b) seems more intuitive.

          Conclusion: the update rule should be rule (b), which is sometimes called "conditionalization on a conditional" or "Adams conditioning". 

          But note: this rule is not conditionalization in the standard sense. It is a form of probability kinematics on the partition induced by the antecedent.

          Therefore, the desiderata lead us to rule (b).

          The most work is done by the silent antecedent requirement, which is what rules out rule (a) and also rule (c) (which is the same as rule (a)).

          Incompatibility: The silent antecedent requirement and the minimization of cross-entropy (which gave rule (a)) are incompatible. 

          But we have dropped the minimization of cross-entropy as a requirement. It wasn't on our list of desiderata. The list had only:

            outright learning, silent antecedent, vacuity, uncertain evidence, invariance, non-propositional view.

          We have a rule that satisfies all.

          Final note: in the literature, this rule is often attributed to Richard Jeffrey (probability kinematics) or to Ernest Adams.

          So, to summarize the requirements for the group:

          1. Outright learning: Upon learning the conditional with certainty, the rule must set P(C|A)=1 and also P(not-A or C)=1.
          2. Silent antecedent: The rule should leave the probability of the antecedent unchanged. (Non-negotiable for our chosen rule, but note that other rules in the literature do not.)
          3. Vacuity: If P(A)=0, the rule should leave the distribution unchanged. (Non-negotiable.)
          4. Uncertain evidence: The rule should be extendable to cases where we become more confident in the conditional without becoming certain. (Non-negotiable.)
          5. Invariance: The rule should yield the same posterior regardless of whether the constraint is expressed as P(C|A)=1 or P(A and not-C)=0. (Non-negotiable.)
          6. Non-propositional view: The rule should respect the understanding that conditionals are not propositions in the ordinary sense. (This is satisfied by rule (b) because we are updating a conditional probability directly.)

          And the rule that meets these is: 
            - Set the new probability of (A and not-C) to 0.
            - Add the probability mass from (A and not-C) to (A and C).
            - Leave the probabilities of the not-A cells unchanged.

          In the uncertain case (when we set P_new(C|A)=q, which might be less than 1):

            - Set P_new(A and C) = P_old(A) * q
            - Set P_new(A and not-C) = P_old(A) * (1-q)
            - Leave the not-A cells unchanged.

          This rule is known as Adams conditioning or sometimes as the rule of probability kinematics on the partition {A, not-A} with the conditional on A changed.

          We are done.
