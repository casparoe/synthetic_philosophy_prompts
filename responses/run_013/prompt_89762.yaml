  ### Desiderata for Updating on Conditional Information

  Below are the desiderata for any rule updating credences upon learning a conditional (e.g., "if friend, then franked"). Each requirement is motivated by a specific case, justified as a genuine requirement, and classified as non-negotiable (core to Bayesian coherence) or tradition-dependent (specific to certain Bayesian approaches). The focus is on incompatibilities and which requirement most strongly constrains solutions.

  ---

  #### **1. Outright Learning (Certainty)**
  - **Description**: When the conditional is learned with certainty, the rule must ensure \(P(\text{if } A \text{ then } C) = 1\) in the posterior, and the update must be intuitively sensible (e.g., \(P(A \land \neg C)\) must drop to 0).
  - **Motivating Case**: You learn "if friend, then franked" with certainty. The posterior must reflect this: \(P(\text{friend} \land \neg \text{franked}) = 0\), and \(P(\text{franked} \mid \text{friend}) = 1\).
  - **Why Genuine**: Failing this violates basic Bayesian conditioning for certain evidence. If you fully accept "if \(A\) then \(C\)", scenarios where \(A\) holds but \(C\) fails must be eliminated.
  - **Status**: Non-negotiable.

  #### **2. Silent Antecedent**
  - **Description**: Learning the conditional should not change the probability of the antecedent \(P(A)\).
  - **Motivating Case**: Learning "if friend, then franked" should not alter your credence that the letter is from a friend. Intuitively, the conditional only governs what happens *if* \(A\) is true, not whether \(A\) is true.
  - **Why Genuine**: Conditionals are typically interpreted as suppositional (e.g., "if it rains, the match is canceled" doesn’t imply rain is likely). Changing \(P(A)\) conflates evidence about the connection between \(A\) and \(C\) with evidence about \(A\) itself.
  - **Status**: Tradition-dependent (central to *suppositional* or *Adams-based* approaches, but not universally held). Strongly conflicts with material conditional views.

  #### **3. Vacuity**
  - **Description**: If \(P(A) = 0\) (antecedent is impossible), learning the conditional should leave all credences unchanged.
  - **Motivating Case**: You are certain the letter is from a stranger (\(P(\text{friend}) = 0\)). Learning "if friend, then franked" is vacuously true and should not affect your beliefs about franking or anything else.
  - **Why Genuine**: When \(A\) is impossible, the conditional imposes no constraint; updating would introduce unwarranted changes.
  - **Status**: Non-negotiable.

  #### **4. Uncertain Evidence**
  - **Description**: The rule must handle cases where you become more confident (but not certain) of the conditional, e.g., \(P(\text{if } A \text{ then } C)\) increases.
  - **Motivating Case**: You get evidence suggesting (but not proving) "if friend, then franked". The rule should increase your credence in the conditional while sensibly adjusting the four cells.
  - **Why Genuine**: Real-world updates are rarely certain; a general rule must accommodate partial evidence.
  - **Status**: Non-negotiable.

  #### **5. Invariance Under Reparameterization**
  - **Description**: The posterior must be identical regardless of how the *same* constraint is expressed (e.g., \(P(C \mid A) = 1\) vs. \(P(A \land \neg C) = 0\) vs. \(P(\neg A \lor C) = 1\)).
  - **Motivating Case**: Updating on "if friend, then franked" (constraint: \(P(\text{franked} \mid \text{friend}) = 1\)) should yield the same result as updating on "not (friend and not franked)" (constraint: \(P(\text{friend} \land \neg \text{franked}) = 0\))), as these are logically equivalent.
  - **Why Genuine**: Rationality requires that belief updates depend only on the content of evidence, not its linguistic form. Violating this allows inconsistent posteriors from the same information.
  - **Status**: Non-negotiable.

  #### **6. Non-Propositional Compatibility**
  - **Description**: The rule must not treat the conditional as a proposition in the algebra (e.g., by equating \(P(\text{if } A \text{ then } C)\) with \(P(\neg A \lor C)\)), due to triviality results (Lewis, 1976).
  - **Motivating Case**: Attempting to treat "if \(A\) then \(C\)" as the material conditional \(\neg A \lor C\) leads to inconsistencies (e.g., \(P(\text{if } A \text{ then } C)\) would equal \(P(C \mid A)\), which is impossible in all probability spaces).
  - **Why Genuine**: Triviality proofs show conditionals cannot be propositions without collapsing Bayesian models. The rule must respect this.
  - **Status**: Non-negotiable.

  ---

  ### **Incompatibilities and Key Constraints**
  The most significant incompatibility is between **Silent Antecedent** and **Invariance Under Reparameterization**:
  - **Conflict**: Silent Antecedent requires \(P(A)\) to stay fixed. Invariance requires \(P(C \mid A) = 1\) (constraint 1) and \(P(\neg A \lor C) = 1\) (constraint 2) to yield the same posterior. But:
    - To satisfy constraint 1 (e.g., \(P(C \mid A) = 1\)), you set \(P(A \land \neg C) = 0\) and redistribute its mass to \((A \land C)\) (fixing \(P(A)\)).
    - To satisfy constraint 2 (e.g., \(P(\neg A \lor C) = 1\)), you must also set \(P(A \land \neg C) = 0\), but now you condition on \(\neg A \lor C\), which boosts probabilities of all worlds where \(\neg A \lor C\) holds (including \(\neg A \land C\) and \(\neg A \land \neg C\)) proportionally. This *changes* \(P(A)\).
  - **Why Incompatible**: The two constraints are logically equivalent, but Silent Antecedent forces one redistribution method (keep \(P(A)\) fixed), while Invariance forces consistency across methods. You cannot have both if the methods differ.

  **Silent Antecedent does the most work in ruling out tidy answers**:
  - It conflicts with standard conditioning on \(\neg A \lor C\) (which changes \(P(A)\)).
  - It conflicts with minimum cross-entropy updates (which mirror standard conditioning).
  - It pushes toward "Adams conditioning" (see below), which violates Invariance if not carefully defined (though it can satisfy it with constraint reformulation).

  ---

  ### **Additional Notes**
  - **Vacuous Evidence Handling**: Rules must avoid undefined operations (e.g., conditioning on \(P(C \mid A)\) when \(P(A) = 0\)).
  - **Computational Practicality**: The rule should be tractable for ordinary agents (e.g., no complex optimizations).
  - **Tradition-Dependent Requirements**: Silent Antecedent is prized in *suppositional* or *conditional event* traditions (Adams, Edgington) but rejected in *material conditional* or *imaging* traditions. Other desiderata are broadly non-negotiable.

  ---

  ### **Rule Recommendations (Briefly)**
  - **Adams Conditioning** (tradition-dependent for Silent Antecedent):  
    - Set \(P_{\text{new}}(A \land \neg C) = 0\), add its prior mass to \(P_{\text{new}}(A \land C)\), leave \(\neg A\) cells unchanged.  
    - Satisfies: Outright Learning, Silent Antecedent, Vacuity, Non-Propositional Compatibility.  
    - For uncertain evidence: Set \(P_{\text{new}}(C \mid A) = q\), rescale \((A \land C)\) and \((A \land \neg C)\) to preserve \(P(A)\), leave \(\neg A\) cells unchanged.  
  - **Standard Conditioning on \(\neg A \lor C\)** (violates Silent Antecedent):  
    - Conditionalize on \(\neg A \lor C\) as a proposition.  
    - Satisfies: Outright Learning, Vacuity, Invariance, Uncertain Evidence (via Jeffrey conditioning).  
  - **Minimum Cross-Entropy** (violates Silent Antecedent):  
    - Minimize KL-divergence subject to \(P(C \mid A) = 1\). Equivalent to standard conditioning on \(\neg A \lor C\).

  Adams Conditioning satisfies most desiderata if Silent Antecedent is prioritized, but Invariance requires careful handling (constraint equivalence must be respected). If Silent Antecedent is dropped, standard conditioning suffices. The choice hinges on whether conditionals are seen as informative solely about connections (Silent Antecedent) or also about possibilities (material conditional).
