prompt: |-
  I'm in a Bayesian epistemology reading group and we've got stuck on the same thing three weeks running, so I want to back up and get the specification straight before anyone champions a rule. Here's the shape of it. Take a prior over two cross-cutting yes/no matters -- say, whether a letter came from a friend or from a stranger, and whether it's been franked or not; four cells, and your credences over them. Then you get evidence that isn't a proposition you could simply conditionalise on, but a conditional: the only thing you learn is 'if it came from a friend then it's franked', and maybe you learn it outright, maybe you only become more confident of it. Your credence in that conditional has to move. Now what happens to the four cells? The people I've talked to want to say either (a) just conditionalise on 'either it's not from a friend or it's franked', or (b) leave your credence that it's from a friend exactly where it was and only shift things within, or (c) move to the nearest distribution that respects the new conditional. None of those are obviously daft, none of them obviously wins either, and I keep feeling we're arguing about the candidates when we havent said what a candidate has to do.

  So what I'd like from you is the desiderata: write out what any adequate rule for updating on uncertain conditional information has to deliver, each requirement with the case that motivates it and a line on why it's a genuine requirement rather than a prejudice of one camp. The cases I'd want on the list, at least: the outright-learning case, where the conditional goes to certainty and the rule has to say something sensible about your credence in the antecedent; the 'silent antecedent' case, where you'd think learning an 'if' tells you nothing at all about whether the antecedent is true; the vacuity case, where you already know the antecedent is false so the conditional is idle and shouldn't be allowed to drag your other credences about; the case where the evidence is a nudge rather than certainty; the demand that the rule not be hostage to how you phrase the constraint, since 'P(franked | friend) = 1' and some algebraic re-description of the very same constraint ought to land you in the same posterior; and the demand that it sit happily with the known results saying you can't simply treat a conditional credence as the probability of a proposition. Add whatever else you reckon belongs, and mark which requirements are non-negotiable and which are just what one tradition happens to want.

  The bit I most want is the incompatibility. I half suspect some small subset of these can't hold together, and if so I'd like you to say exactly which ones and why -- if the list turns out to be unsatisfiable, that's the actual result and I'd rather have it than a scorecard. Also tell me which single requirement does the most work in ruling out the tidy answers. Fix the purpose for me at: a rule an ordinary agent could actually apply, given a prior and a piece of conditional evidence, not just a proof that some such distribution exists somewhere. Skip the survey of named proposals, I'll do that bit in the group.
reasoning: |-
  We are in the context of Bayesian epistemology. We have a prior distribution over four propositions, which we can represent as:
     A: friend (antecedent)
     C: franked (consequent)

   So the four cells are:
     A and C: friend and franked
     A and not-C: friend and not franked
     not-A and C: not friend (stranger) and franked
     not-A and not-C: not friend (stranger) and not franked

   We are going to update on a conditional piece of evidence: "If it came from a friend, then it is franked", which we can write as A → C.

   However, note that the conditional is not a proposition in the same way as the atomic ones. We are going to learn either with certainty or with increased confidence that A → C holds.

   The problem: How should we update our prior credences to a posterior that reflects this new evidence?

   We are to list desiderata (requirements) for an update rule. We are also to note cases that motivate each requirement and why it is genuine. We are to indicate which are non-negotiable and which are more traditional. We are to note incompatibilities and which requirement does the most work in ruling out simple answers.

   Let's outline the cases and requirements:

   1. Outright learning (certainty): When we learn the conditional with certainty, the rule must give a sensible posterior. In particular, we must end up with P(A → C) = 1.

      Motivation: This is the basic case of learning a conditional fact for sure. We must have the posterior assign probability 1 to the conditional.

      Why genuine: It's a minimal requirement of updating on certain evidence.

      Non-negotiable.

   2. Silent antecedent: Learning the conditional should not by itself change the probability of the antecedent (P(A)).

      Motivation: Consider that the conditional "if A then C" does not directly say anything about whether A is true. It only constrains what happens when A is true.

      Why genuine: If I tell you "If it rains, the match will be canceled", this doesn't by itself tell you whether it will rain. Similarly, learning "if friend then franked" shouldn't change the probability that the letter is from a friend.

      However, note that in the outright learning case, if we conditionalize on the material conditional (not-A or C), then the probability of A might change because the event (A and not-C) is ruled out. But the silent antecedent requirement says that P(A) should remain the same.

      This requirement is controversial. Some argue that learning a conditional might indirectly affect the probability of the antecedent, especially if the agent has prior beliefs that connect the antecedent and the consequent. But the "silent antecedent" intuition is strong.

      We'll mark it as a desideratum that one tradition (e.g., Adams, or the suppositional view) wants, but note that it is not universally accepted.

   3. Vacuity: If the agent already knows that the antecedent is false (P(A)=0), then learning the conditional should not change the distribution at all.

      Motivation: If you are certain that the letter is not from a friend, then learning "if it is from a friend then it is franked" is vacuous. It shouldn't affect your credences about anything, including the consequent.

      Why genuine: The conditional doesn't apply in any scenario that you consider possible.

      Non-negotiable.

   4. Uncertain evidence: The rule should handle cases where we don't learn the conditional with certainty, but only become more confident in it (e.g., we get evidence that raises our credence in A→C).

      Motivation: Often we get evidence that doesn't make us certain but increases our confidence in a conditional.

      Why genuine: A complete theory should handle partial evidence.

      Non-negotiable for a general rule.

   5. Invariance under reparameterization: The rule should not depend on how we express the same constraint. For example, the constraint that P(C|A)=1 (which is one way to express the conditional) is the same as the constraint that P(not-A or C)=1, but also the same as the constraint that P(A and not-C)=0. The update should be the same regardless of which form we use.

      Motivation: The same evidence should lead to the same posterior regardless of how we describe it algebraically.

      Why genuine: This is a basic requirement of rationality: the same evidence should lead to the same belief change.

      Non-negotiable.

   6. Compatibility with the non-propositional view: The rule should respect the known results (e.g., Lewis's triviality results) that conditionals cannot be treated as ordinary propositions (i.e., there is no proposition such that your credence in it is always your conditional credence).

      Motivation: We don't want to fall into the trap of treating the conditional as a material conditional if that leads to triviality.

      Why genuine: The triviality results show that we cannot consistently treat conditionals as propositions in the ordinary sense.

      Non-negotiable.

   Now, let's consider the conflict:

   The main conflict arises between the silent antecedent requirement and the outright learning requirement when we try to use conditionalization on the material conditional.

   If we conditionalize on the material conditional (not-A or C) (which is equivalent to A→C in the truth-functional sense) then we set P(not-A or C) = 1. This rules out the cell (A and not-C). The new probability of A is:

     P_new(A) = P(A and C) / [P(A and C) + P(not-A and C) + P(not-A and not-C)]

   But note that the prior P(A) = P(A and C) + P(A and not-C). After conditionalization, P(A and not-C)=0, so P_new(A) = P(A and C) / [P(not-A) + P(A and C)].

   In general, this is not equal to P(A) (the prior probability of A). For example, if initially P(A and not-C) was positive, then P_new(A) will be less than P(A). This violates the silent antecedent requirement.

   Therefore, if we require silent antecedent, we cannot use standard conditionalization on the material conditional.

   However, note that the non-propositional view (requirement 6) tells us that we should not treat the conditional as the material conditional. So we are already warned that the material conditional is not the way to go.

   What about the other approaches?

   (b) Leave P(A) fixed and only shift within: This is the idea of Adams conditioning or perhaps Jeffrey conditioning on the conditional. We set P(C|A)=1 and leave P(A) unchanged. This satisfies silent antecedent and vacuity (if P(A)=0, then we don't change anything because the conditional part doesn't apply). But what about invariance?

   How do we express the constraint? We set P(C|A)=1. But note that this is equivalent to setting P(A and not-C)=0 and leaving P(not-A) and the ratios within not-A unchanged? Actually, we can do:

     We set P(A and not-C) = 0, and then we redistribute the probability that was in (A and not-C) to the other cells in proportion to their prior probabilities? But note: we are leaving P(A) fixed? Let me see:

     We want to set P(A and not-C)=0. The prior mass in (A and not-C) is taken away. We must redistribute it to the other cells. But if we want to leave P(A) unchanged, then we have to redistribute the entire mass of (A and not-C) to (A and C). Why? Because:

     P(A) = P(A and C) + P(A and not-C)

     After update, P(A and not-C)=0, so to keep P(A) the same we must set P(A and C) = old P(A). But that might not be the only way.

     Alternatively, we might redistribute the probability from (A and not-C) to all cells proportionally? But then P(A) might change.

     Specifically, if we redistribute the mass from (A and not-C) to all three remaining cells in proportion to their prior, then:

     P_new(A) = P_old(A) - P_old(A and not-C) + [some of the redistributed mass goes to (A and C)]

     But we want P_new(A) = P_old(A). The only way is to assign all the mass from (A and not-C) to (A and C). Then:

          P_new(A and C) = P_old(A and C) + P_old(A and not-C)
          P_new(A and not-C) = 0
          P_new(not-A and C) = P_old(not-A and C)
          P_new(not-A and not-C) = P_old(not-A and not-C)

     Then P_new(A) = P_new(A and C) = P_old(A) (since P_old(A) = P_old(A and C) + P_old(A and not-C)).

     This satisfies silent antecedent and vacuity (if P_old(A)=0, then P_old(A and not-C)=0, so no change). Also, it sets P(C|A)=1 because P_new(A and C)/P_new(A)= P_old(A)/P_old(A)=1.

     But what about invariance? The constraint we applied is "set P(C|A)=1", which is equivalent to setting P(A and not-C)=0. But note that the material conditional approach also sets P(A and not-C)=0. So the constraint is the same. Therefore, this update rule does the same as conditionalizing on the material conditional? Not exactly: in the material conditional conditionalization, we set the entire probability of (A and not-C) to zero and then renormalize by dividing all probabilities by P(not-A or C). That leads to:

          P_new(A and C) = P_old(A and C) / P_old(not-A or C)
          P_new(not-A and C) = P_old(not-A and C) / P_old(not-A or C)
          P_new(not-A and not-C) = P_old(not-A and not-C) / P_old(not-A or C)

     But note that P_old(not-A or C) = 1 - P_old(A and not-C). So the denominator is less than 1.

     In our rule (b), we did:

          P_new(A and C) = P_old(A and C) + P_old(A and not-C)
          P_new(not-A and C) = P_old(not-A and C)
          P_new(not-A and not-C) = P_old(not-A and not-C)

     And then we do not renormalize? But wait, the total probability must be 1. Let's check:

          New total = [P_old(A and C) + P_old(A and not-C)] + P_old(not-A and C) + P_old(not-A and not-C)
                    = P_old(A) + P_old(not-A) = 1.

     So no renormalization is needed. Thus, rule (b) is a valid probability distribution.

     However, note that in rule (b) we have:

          P_new(not-A and C) = P_old(not-A and C)

          but in the material conditional update, we have:

          P_new(not-A and C) = P_old(not-A and C) / (1 - P_old(A and not-C))

     which is larger than the old value (if P_old(A and not-C)>0). So the two rules are different.

     Why the difference? Because rule (b) does not renormalize. It just takes the probability from (A and not-C) and moves it to (A and C). The other cells remain unchanged. In the material conditional update, we condition on the entire event (not-A or C) which includes not only (A and C) but also (not-A and C) and (not-A and not-C). So we boost the probabilities of all three cells proportionally.

     Now, the invariance requirement: the same constraint (P(A and not-C)=0) is applied in both rules, but they yield different posteriors. So we have two different rules for the same constraint? This violates the invariance requirement.

     But note: the constraint "P(A and not-C)=0" is the same as the constraint that the material conditional (not-A or C) has probability 1? Yes, because P(not-A or C) = 1 - P(A and not-C). So setting P(A and not-C)=0 is equivalent to setting P(not-A or C)=1.

     Therefore, if we have two different update rules for the same constraint, we violate invariance.

     Hence, rule (b) (which leaves P(A) fixed) and rule (a) (conditionalization on the material conditional) are two different rules for the same constraint. We must choose one.

     But requirement 5 (invariance) requires that the same constraint must lead to the same posterior. Therefore, we cannot have both. We must have a unique rule for the constraint.

     So we must choose either rule (a) or rule (b) or perhaps a third option. But note that rule (b) does not satisfy the requirement of being the same as the material conditional update.

     How do we reconcile? We must note that the constraint can be expressed in two ways:

          (i) Set P(not-A or C) = 1.
          (ii) Set P(A and not-C) = 0.

     These are the same constraint. So the rule must produce the same posterior regardless of which way we state it.

     Now, rule (a) is: conditionalize on the event (not-A or C). This sets P(not-A or C)=1, which implies P(A and not-C)=0.

     Rule (b) as we described sets P(A and not-C)=0 and then moves the probability from (A and not-C) to (A and C). But that rule does not condition on (not-A or C) because it doesn't boost the probabilities of the other two cells.

     Therefore, rule (b) is not equivalent to rule (a). And they are different.

     But note: there might be another rule that sets P(A and not-C)=0 and then renormalizes the entire distribution. That is exactly rule (a). So if we interpret rule (b) as not renormalizing, then it is distinct. But if we interpret the constraint "set P(A and not-C)=0" as meaning we remove the event (A and not-C) and then renormalize the entire space, then we get rule (a). So then we are back to rule (a).

     Therefore, the silent antecedent requirement (which rule (b) satisfies) cannot be maintained if we also require invariance and updating by setting P(A and not-C)=0 by renormalization (which is rule (a)).

     Alternatively, we might consider that the constraint "P(C|A)=1" is not the same as "P(not-A or C)=1". But note that P(C|A)=1 is equivalent to P(A and not-C)=0 (and P(A)>0) and if P(A)=0 then it is vacuously true. So they are the same constraint.

     Therefore, we have a conflict between:

          - Silent antecedent (P(A) unchanged)
          - Invariance (the update rule must be the same regardless of how we state the constraint, so we must use either rule (a) or a rule that is equivalent to rule (a) when the constraint is the same)

     But rule (a) changes P(A) (unless P(not-A or C)=1 already) and rule (b) (if we interpret it without renormalization) does not. And they are different.

     Hence, we cannot have both silent antecedent and invariance.

     Which one to drop?

     The silent antecedent requirement is more of an intuition from the suppositional theory of conditionals, but it is not universally accepted. The invariance requirement is a fundamental principle of rationality.

     Therefore, we might drop silent antecedent.

     However, note the vacuity case: if P(A)=0, then we don't change anything. Rule (a) also satisfies vacuity because if P_old(A)=0, then P_old(A and not-C)=0, so P_old(not-A or C)=1, and conditionalizing on a probability 1 event does nothing.

     So rule (a) satisfies vacuity.

     Now, what about the non-propositional view? Rule (a) treats the conditional as the material conditional. But Lewis's triviality results show that we cannot identify the probability of the conditional with the conditional probability in all cases. However, note that we are updating on the material conditional as a proposition, which is a legitimate move. The triviality results show that we cannot have, for every probability distribution, that P(A→C) = P(C|A). But in this update, we are not claiming that. We are simply conditioning on the proposition (not-A or C). This is a standard move.

     However, the triviality results do not say that we cannot condition on the material conditional. They say that we cannot have a proposition in the algebra that always has the probability equal to the conditional probability. But we are not doing that. We are only conditioning on the material conditional in this particular instance.

     So rule (a) does not violate the non-propositional view in the sense that we are not claiming that the conditional is a proposition in general. We are just using the material conditional as a representation of the evidence we received.

     But wait: the evidence we received was the conditional statement. If we take that statement to mean the material conditional, then rule (a) is natural. However, the triviality results suggest that conditionals might not be propositions. So perhaps we should not treat the evidence as the material conditional.

     This leads us to rule (c): move to the nearest distribution that respects the new conditional. This is the minimum cross-entropy (or maximum entropy) approach.

     In this approach, we set the constraint P(C|A)=1 (if we interpret the conditional as requiring that) and then choose the distribution that minimizes the Kullback-Leibler divergence from the prior, subject to P(C|A)=1.

     How does that work?

          We require: P_new(C|A) = 1.

          This is equivalent to P_new(A and not-C)=0.

          We minimize: sum_{cells} P_new(cell) * log(P_new(cell)/P_old(cell))

          subject to: P_new(A and not-C)=0 and the probabilities summing to 1.

     The solution to this is:

          The probability mass from (A and not-C) is redistributed to the other three cells in proportion to the prior probabilities of those cells? Actually, no.

          The minimum cross-entropy update in this case is:

            P_new(A and C) = P_old(A and C) + P_old(A and not-C) * [P_old(A and C) / (P_old(A and C) + P_old(not-A and C) + P_old(not-A and not-C))]?

          But note, we have three cells: (A and C), (not-A and C), (not-A and not-C). The constraint is that (A and not-C) becomes 0. We have to redistribute the mass of (A and not-C) to the other three in a way that minimizes the divergence.

          However, the minimum cross-entropy solution is to leave the probabilities of the other cells proportional to their prior? Actually, yes: we set the new probabilities for the remaining cells to be proportional to the old, but with the constraint that the mass from (A and not-C) is distributed in a way that minimizes the divergence.

          The solution is:

              P_new(x) = P_old(x) * (1 / (1 - P_old(A and not-C)))   for all x not in (A and not-C)

          and P_new(A and not-C)=0.

          But note: this is exactly the same as rule (a) (conditionalization on the material conditional)!

          Why? Because conditionalizing on (not-A or C) is:

              P_new(x) = P_old(x) / P_old(not-A or C)   for x in (not-A or C)

          and P_old(not-A or C) = 1 - P_old(A and not-C).

          So the minimum cross-entropy rule (for the constraint P(A and not-C)=0) gives the same result as rule (a).

          Therefore, rule (c) is the same as rule (a) in this case.

          So we are back to rule (a) and we lose silent antecedent.

          But wait: what if we interpret the constraint as P(C|A)=1? The constraint P(C|A)=1 is equivalent to P(A and not-C)=0 only when P(A)>0. And if P(A)=0, then P(C|A) is undefined and we leave the distribution unchanged (by the vacuity requirement). So in effect, the constraint is the same.

          Therefore, the minimum cross-entropy rule also violates silent antecedent.

          So what rule would satisfy silent antecedent? We described rule (b) above: set P_new(A and C) = P_old(A) and leave the other cells unchanged. This is sometimes called "conditionalizing on the conditional" but without renormalization of the whole space. But note: it doesn't renormalize? Actually, we saw that the total probability remains 1. But it does not preserve the relative odds between the non-A cells? Yes, it leaves them unchanged.

          This rule (b) can be seen as:

              P_new(A and C) = P_old(A and C) + P_old(A and not-C)
              P_new(not-A and C) = P_old(not-A and C)
              P_new(not-A and not-C) = P_old(not-A and not-C)

          and P_new(A and not-C)=0.

          This is a valid distribution. And it leaves P(not-A) unchanged? 

              P_old(not-A) = P_old(not-A and C) + P_old(not-A and not-C) = P_new(not-A)

          so the probability of not-A is unchanged. Therefore, the probability of A is also unchanged (since P_new(A) = P_new(A and C) = P_old(A)).

          However, note that the rule does change the probabilities within A: we set the probability of (A and C) to the entire probability of A. But that is because we set P(C|A)=1.

          This rule is sometimes called "Adams conditioning" or "probability kinematics" on the partition {A, not-A}. We are updating the conditional probability of C given A to 1, and leaving the marginal of A unchanged and also the conditional distribution given not-A unchanged.

          Now, does this rule satisfy invariance? The constraint we applied is P(C|A)=1. But we could also express the constraint as P(A and not-C)=0. How would we apply the rule under the second expression? 

          If we are told to set P(A and not-C)=0, and we do the same: set P_new(A and C) = P_old(A and C) + P_old(A and not-C), and leave the rest unchanged, then we get the same posterior. So it is invariant under these two expressions.

          But note: the constraint P(C|A)=1 is not defined when P(A)=0, and in that case we do nothing. And the constraint P(A and not-C)=0 when P(A)=0 is automatically satisfied, so again we do nothing. So vacuity is satisfied.

          However, what about the material conditional? The material conditional (not-A or C) has probability:

              P_new(not-A or C) = 1 - P_new(not-A and not-C)

          while the prior was:

              P_old(not-A or C) = 1 - P_old(A and not-C)

          and we have set P_new(not-A and not-C) = P_old(not-A and not-C). So:

              P_new(not-A or C) = 1 - P_old(not-A and not-C)

          but the prior was 1 - P_old(A and not-C). So the probability of the material conditional has increased to 1 only if P_old(not-A and not-C) = 0? Not necessarily. So we haven't set the material conditional to 1. We have only set P(A and not-C)=0, which means the material conditional is true in all cases except possibly when (not-A and not-C) happens. So if there is any probability on (not-A and not-C), then P_new(not-A or C) < 1.

          Therefore, we have not learned the material conditional with certainty. We have only learned that the event (A and not-C) is impossible.

