  Below is a decision tree designed to guide students through the cases without presupposing theoretical commitments. The tree uses concrete questions about specific sentences or judgments, branching based on intuitive responses. Each leaf corresponds to a recognizable position, named where standard. The tree has 9 nodes and 6 leaves, capturing major views while highlighting gaps and limitations.

  ---

  ### **Decision Tree for Conditionals**

  **Node 1: Disjunction Test**  
  Consider:  
  - *Sentence A*: "Either it didn’t rain or the picnic was cancelled."  
  - *Sentence B*: "If it rained, the picnic was cancelled."  
  Do A and B mean the same thing?  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  **Node 2: Die Probability (for "Yes" at Node 1)**  
  A fair die is rolled; you know nothing else. Consider: "If it came up even, it came up six." What is the probability this is true?  
  - **2/3** → Leaf 1: **Material Conditional + Pragmatics** (Gricean view; indicatives are truth-functional but pragmatically constrained).  
  - **1/3 or Malformed** → *Diagnosis: Inconsistent with Node 1. Material conditional requires P=2/3.*  

  **Node 3: Die Truth Value (for "No" at Node 1)**  
  For the die sentence ("If even, six"), does it have a truth value?  
  - **Yes** → Go to Node 4.  
  - **No** → Go to Node 7.  

  **Node 4: Die Probability (for "Yes" at Node 3)**  
  What is the probability the die sentence is true?  
  - **1/3** → Go to Node 5.  
  - **2/3** → *Diagnosis: Inconsistent with Node 1. Rejecting disjunction equivalence but assigning material probability is incoherent.*  

  **Node 5: Kennedy Indicative (for "1/3" at Node 4)**  
  Consider: "If Oswald didn’t kill Kennedy, someone else did." Do you accept this as true?  
  - **Yes** → Go to Node 6.  
  - **No** → *Diagnosis: Unattractive. Most accept this indicative, even knowing Oswald did it.*  

  **Node 6: Kennedy Counterfactual (for "Yes" at Node 5)**  
  Consider: "If Oswald hadn’t killed Kennedy, someone else would have." Do you accept this as true?  
  - **No** → Go to Node 8.  
  - **Yes** → Leaf 2: **Uniform Strict Conditional** (e.g., some strict material analyses; rejects the indicative/counterfactual divide). *Diagnosis: Unattractive. Most reject this counterfactual.*  

  **Node 7: Die Acceptability (for "No" at Node 3)**  
  For the die sentence, what is its probability of *acceptability* (assertability, reasonableness)?  
  - **1/3** → Go to Node 9.  
  - **2/3** → Leaf 3: **Non-Standard Non-Propositional** (no truth value, but P(acceptability)=2/3). *Diagnosis: Unexplored. No major theory holds this.*  

  **Node 8: Antecedent Strengthening (for "No" at Node 6)**  
  Can "If you strike this match, it will light" be true while "If you strike this match *and it is soaking wet*, it will light" is false?  
  - **Yes** → Leaf 4: **Stalnaker/Lewis/Unified** (selection functions or similarity orderings; variably strict conditionals).  
  - **No** → Leaf 5: **Strict Conditional** (e.g., necessity over all worlds; antecedent strengthening always holds). *Diagnosis: Unattractive. Fails to explain the wet-match intuition.*  

  **Node 9: Kennedy Assertability (for "1/3" at Node 7)**  
  Is the indicative Kennedy conditional ("If Oswald didn’t kill...") assertable?  
  - **No** → Leaf 6: **Conditional Probability/Ramsey** (no truth values; conditionals express conditional credence).  
  - **Yes** → *Diagnosis: Inconsistent. Non-propositional views reject asserting conditionals with known-false antecedents.*  

  ---

  ### **Leaves Summary**
  1. **Material Conditional + Pragmatics**: Truth-functional indicatives; pragmatics explains oddities.  
  2. **Uniform Strict Conditional**: Indicatives and counterfactuals treated identically (e.g., as strict conditionals).  
  3. **Non-Standard Non-Propositional**: No truth value, P(acceptability)=2/3.  
  4. **Stalnaker/Lewis/Unified**: Variably strict (Stalnaker: uniqueness; Lewis: ordering; Unified: Kratzer-style quantification).  
  5. **Strict Conditional**: Necessity-based; antecedent strengthening always valid.  
  6. **Conditional Probability/Ramsey**: Conditionals lack truth values; express P(consequent | antecedent).  

  ---

  ### **Gaps and Diagnoses**
  - **Node 2 "1/3 or Malformed"**: Incoherent. Material conditional requires P=2/3.  
  - **Node 4 "2/3"**: Incoherent. Rejecting disjunction equivalence but assigning material probability.  
  - **Node 5 "No"**: Unattractive. Rejecting the Kennedy indicative is counterintuitive.  
  - **Node 6 "Yes"**: Unattractive. Accepting the Kennedy counterfactual contradicts typical intuitions.  
  - **Node 9 "Yes"**: Incoherent for non-propositional views. Adams/Grice reject asserting conditionals with false antecedents.  
  - **Leaf 3 (Non-Standard Non-Propositional)**: Unexplored. No major theory endorses P(acceptability)=2/3.  
  - **Leaf 2 (Uniform Strict Conditional)**: Unattractive. Fails to distinguish Kennedy pair.  

  ---

  ### **Unseparated Leaves**
  - **Stalnaker, Lewis, and Unified** (Leaf 4) cannot be separated by this tree. The cases given (Kennedy, strengthening) are treated similarly by all.  
  - **Strict Conditional** (Leaf 5) and **Uniform Strict Conditional** (Leaf 2) are separated only by the Kennedy counterfactual (Node 6).  

  ---

  ### **Design Notes**
  - **Future Pair**: Omitted to avoid overcomplication. It would likely branch under Node 8 (e.g., "Do future indicatives and subjunctives pattern together?"), but the tree prioritizes core cases.  
  - **Embedding**: Implicitly covered. Truth-conditional leaves (1, 2, 4, 5) allow embedding (e.g., negation, probability operators). Non-propositional (Leaf 6) rejects embedding or reinterprets it.  
  - **Efficiency**: The tree isolates key disagreements (truth values, disjunction, Kennedy, strengthening) while minimizing redundancy.  
  - **Use**: Students answer questions based on intuition; the leaf reveals their implicit commitments. Gaps highlight where intuitions may clash with existing theories.
