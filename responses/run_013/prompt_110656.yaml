prompt: |-
  I just got appointed to my city's Heritage and Memory Review Board — we're the ones who decide what goes on the historical plaques and what the museum labels say — and it turns out one of the cases on the docket is my own family's, which is how I got roped into this in the first place.

  Here's the track record I'm trying to read. Three years ago: a local legend said the town's founder freed the people he enslaved in his will, the probate file says otherwise, and we went with the file and fixed the plaque. Two years ago: the elders on the Eastside have always said the 1923 fire that took their church was set by white neighbors, there's basically no paper on it either way, and we put their account on the plaque as the account, full stop. Last year: a family said their great-uncle's farm got swindled off them in the 40s, the county books show a clean sale, and we split it — both versions, marked disputed. And in one case the community's story turned out to have been fed to them by a county agent back in the 60s, and we went with the archive and nobody really fought us on it.

  Now mine. My great-grandmother's people say a group of them were held in a schoolhouse for four days in 1918 and run out of the county, and that two men died there. No official record of any of it. But a local history guy just digitized a 1918 sheriff's ledger with a line about transporting eleven persons of color on a date that lines up. So it corroberates the roundup and says nothing about anybody dying — and a 1920 census page lists both of the men my family says died.

  What do you think this board does with it? Give me your best guess at the ruling, the rule the board actually seems to be running (I bet more then one fits the four cases above), and which of those earlier cases would separate the rules if it ever came back around.
reasoning: |-
  Okay, the user is on a Heritage and Memory Review Board and has a personal connection to a case involving their family history. They described four past cases and now their own. Let me start by understanding each case to find patterns.

  First case: Town founder freeing enslaved people in his will. The probate file contradicted the legend, so the board used the official document. That shows a preference for written records when they directly contradict oral history.

  Second case: The 1923 church fire. Elders said it was arson by white neighbors, but no documents existed. The board put their account on the plaque without qualification. Here, oral history was prioritized in the absence of written records.

  Third case: Farm swindling in the 40s. Family claimed fraud, but county records showed a clean sale. The board presented both as disputed. This seems like a middle ground when there's conflicting evidence without clear resolution.

  Fourth case: A story fed by a county agent in the 60s. The board used archives when oral history was influenced externally, and no one contested it. So, if oral history is debunked or lacks community support, archives win.

  Now the user's case: Their family says people were held in a schoolhouse in 1918, two died. No official records of the event, but a sheriff's ledger mentions transporting eleven people on a matching date. The 1920 census lists the two men as alive. 

  The key points here are the ledger corroborates the roundup but doesn't mention deaths, and the census contradicts the deaths. So what would the board do based on past cases?

  Looking back, Case 1 used documents over oral history. Case 2 used oral history when no documents existed. Case 3 split when both had some validity. Case 4 used documents when oral history was unreliable.

  Here, the ledger supports part of the story (the roundup) but contradicts the deaths via census. The absence of death records might be expected if authorities covered it up, but the census is a strong counter. The board might see the death claim as disproven by the census. For the roundup, the ledger acts as corroboration. They might include the roundup as fact but note the deaths are disputed or unconfirmed.

  The user also wants the underlying rule. From the cases, the board seems to prioritize documents when available and reliable. Oral history is used when no documents exist or when documents are absent. If both are present but conflict, they mark it as disputed unless one side is debunked (like Case 4). 

  In this case, the sheriff's ledger is a document supporting the roundup, so that part might be stated as fact. The deaths are contradicted by the census, so they might not include that or mark it as unconfirmed. Similar to Case 1, where documents overruled legend. But Case 2 shows oral history accepted without docs. The difference here is partial documentation supporting one aspect but contradicting another. 

  The board might state the roundup occurred based on the ledger and oral history, but note that reports of deaths are inconsistent with census records. So a split approach like Case 3, but with the death part possibly omitted or disputed. 

  Which past case would differentiate rules? If Case 2 came back with new evidence contradicting the elders, the board might revert to documents, showing that new evidence can override oral history. In the user's case, the census is strong evidence against the deaths, so they might follow Case 1's approach for that part.
answer: |-
  Based on the board's established pattern across the four cases, here's my best guess for your family's case ruling and the underlying principles:

  **Likely Ruling for Your Family's Case:**
  1.  **The Roundup:** The board will **accept and state as fact that the roundup/detention occurred.** The sheriff's ledger (official record) directly corroborates the core event's date, location, and number of people involved. This aligns with the "probate file wins" logic (Case 1).
  2.  **The Deaths:** The board will likely **omit the claim about the two deaths** entirely from the plaque/label, or potentially add a *very* brief, highly qualified note marked as "family account" or "disputed" if there's significant pressure. The combination of the ledger's silence *and* the census listing them alive two years later provides strong documentary counter-evidence, similar to the probate file contradicting the will legend (Case 1). This outweighs the uncorroborated family memory on this specific point.

  **The Implicit Rulebook (Prioritization Ladder):**

  The board's pattern suggests a clear, though unspoken, hierarchy of evidence:

  1.  **Contemporary Official Documentation Wins:** When clear, unambiguous contemporary official records exist (probate file, sheriff's ledger, county books), they are given the highest weight and will override conflicting oral history (Case 1, partially Case 4). *Silence* in such records (like the ledger not mentioning deaths) is also considered significant, *especially* if counter-documentation exists later (like the census).
  2.  **Uncorroborated Oral History Wins in Absence of Docs:** When *no* contemporary documentation exists on a specific event (like the cause of the fire in Case 2), the consistent oral history of the affected community is accepted as the primary historical account and stated as fact.
  3.  **Conflicting Evidence = "Disputed" Status:** When seemingly credible documentation *and* persistent oral history conflict directly with no clear way to resolve it (like the farm sale - Case 3), both narratives are presented side-by-side, explicitly marked as disputed.
  4.  **Debunked/Externally Manipulated Oral History is Rejected:** If oral history can be demonstrably shown to be fabricated, externally implanted (like the county agent story - Case 4), or directly contradicted by solid documentation, it is rejected in favor of the documentary record.

  **Which Case Separates the Rules?**

  **Case 3 (The Swindled Farm)** is the key separator. It demonstrates the board's willingness to accept ambiguity when faced with *persistent* conflicting evidence of roughly equal weight (documented sale vs. persistent family claim of swindle). This case sits between the extremes:

  *   **vs. Case 1 (Founder's Will):** Case 1 had *definitive* documentary proof contradicting the oral legend. Case 3 lacked definitive proof *against* the oral history – the county books showed a sale, but couldn't disprove coercion or fraud.
  *   **vs. Case 2 (Church Fire):** Case 2 had *zero* documentation, so oral history filled the void uncontested. Case 3 *had* documentation, creating the conflict.
  *   **vs. Case 4 (County Agent Story):** Case 4 had documentation *and* proof the oral history was manipulated. Case 3 had documentation contradicting the oral history, but *no proof the oral history was fabricated or implanted*, just that it conflicted.
  *   **vs. Your Case:** Your case has documentation *partially* corroborating the oral history (roundup) but also providing *strong counter-evidence* for a specific element (deaths via census). Case 3 didn't have documentation *corroborating* part of the oral claim.

  **Therefore, Case 3 is the litmus test.** If a similar "conflicting but persistent" case came back (like the farm family finding a hidden diary describing the coercion, but the sale record remaining), it would force the board to either:
  *   Reaffirm the "disputed" status (showing consistency).
  *   Upgrade the oral history to fact based on the new corroborative evidence (diary), demoting the county record.
  *   Or potentially downgrade the oral history if new evidence *further* undermined it.

  **In summary:** For your family's case, expect the board to leverage the sheriff's ledger to validate the core event (roundup) as fact, while using the census (and the ledger's silence) to likely exclude the claim of deaths as unsubstantiated or contradicted by records. The implicit rule prioritizes contemporary documents, uses oral history to fill documented voids, flags conflicts as disputed, and rejects oral history proven false or manipulated. Case 3 is the critical precedent demonstrating how the board handles unresolved conflict between documents and persistent oral testimony.
