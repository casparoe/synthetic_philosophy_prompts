prompt: |-
  I'm a retired atmospheric chemist — thirty-odd years in the lab, now doing a part-time MA in philosophy because I got tired of only arguing about science with people who already agreed with me. A friend in tech keeps banging on about futarchy, and I'm definately intrested enough to want to run a session on it, but I don't want to just read out the idea and have everyone nod. The core idea, as I understand it, is that you vote on the metric you want to maximise, then a prediction market decides which policy will do best on that metric. I want people to feel the force of that, and also the weirdness of it: the difference between a market that forecasts an outcome and a conditional or decision market that helps decide one, and the way the choice of metric quietly becomes the real centre of power. They should come away seeing that the market doesn't settle values, it relocates them, and that a decision market changes the incentives of the people trading in it.

  I run a monthly philosophy of social science reading group in the village hall. About 14 regulars, mixed backgrounds — a couple of economists, some teachers, a few retired engineers like me, one person who used to work in local government. I've got two hours, including a break, and no real money; tokens or points are fine. I'd rather not lecture at the start. I want them to run into the problem themselves and only hear the name futarchy at the end, in the debrief. Could you design a runnable game or structured deliberation that does that? Give me the rules, materials, roles, a payoff scheme that doesn't need cash, a timeline, and a debrief that maps what happened onto the parts of the idea — the values vote, the belief market, the metric choice, the oracle problem, manipulation, liquidity, all that. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of futarchy the activity can't reproduce and that I'll have to supply myself. No need for reading lists or citations; I just want the thing to work on the night.
reasoning: |-
  We are going to design an activity that simulates the core dynamics of futarchy without using real money and without revealing the concept until the end. The goal is for participants to experience the shift from voting on policies to voting on a metric and then using a prediction market to choose policies. We'll use tokens to represent money in the market.

  **Activity Title:** The Village Improvement Challenge

  **Duration:** 2 hours (with a break)

  **Participants:** 14 people (we'll assign roles as needed)

  **Materials:**
  - Tokens (can be poker chips, printed paper, etc.) - enough for each participant to start with 100 tokens.
  - A whiteboard or flip chart to record the market prices and outcomes.
  - Index cards for voting and policy proposals.
  - A timer.

  **Setup:**
  1. The group is the "Village Council" and must decide on a policy to improve the village. We choose a scenario that is relatable and has measurable outcomes. Example: "Improve the local park."

  2. We define two possible metrics that the council might care about (to be voted on by the group). These should be measurable and in conflict so that the choice of metric matters. For example:
     - Metric A: "Maximize the number of daily visitors to the park in the next month."
     - Metric B: "Maximize the average visitor rating (on a scale of 1-10) of the park in the next month."

  3. We also need two or three policy proposals. These should be simple and have plausible but uncertain effects on the metrics. Example policies:
     - Policy 1: Install new playground equipment.
     - Policy 2: Organize weekly events (concerts, markets, etc.).
     - Policy 3: (Optional) Improve landscaping and seating.

  **Phases of the Activity:**

  1. **Introduction (5 minutes):** Explain that the group is the Village Council and must decide how to improve the local park. They will go through a process to make a collective decision. Do not mention futarchy or prediction markets.

  2. **Metric Vote (15 minutes):**
     - Present the two metrics (A and B). Explain that the council must first decide what they want to achieve. They will vote on which metric to maximize.
     - Give participants 5 minutes to discuss in small groups (3-4 people) the pros and cons of each metric. Then, take a vote by show of hands. The winning metric becomes the goal.

  3. **Policy Proposal and Belief Elicitation (15 minutes):**
     - Present the policy options (at least two). Ask participants to think about which policy they believe would best achieve the chosen metric.
     - Then, explain that they will participate in a market to help decide which policy to implement. This market will use tokens (not real money).

  4. **Prediction Market Setup (10 minutes):**
     - Each participant starts with 100 tokens. The market will have two (or three) assets, each representing a policy. The asset will pay out based on the actual outcome of the policy if implemented (but note: we are simulating, so we will have to simulate outcomes later).
     - Explain the rules of the market:
       - Each policy asset will be traded. The price of the asset represents the market's belief about the expected outcome of that policy on the chosen metric (scaled appropriately for simplicity).
       - At the end of the trading period, the policy with the highest price will be implemented.
       - After implementation, we will determine the outcome (by a simulated method) and the asset for the implemented policy will pay out: 
          - If the outcome is above a certain threshold (e.g., above 50% of the maximum possible), the asset pays 100 tokens per share.
          - If below, it pays 0.
          - Alternatively, to make it more nuanced, we can have a linear payout based on the outcome. But for simplicity, let's do a binary outcome: success (100 tokens) or failure (0). We'll set a threshold for success based on the metric.

     However, note: we cannot actually measure the real outcome in the session. So we will simulate the outcome based on a hidden rule that depends on the policy and also some randomness. We need to design this so that participants don't know the exact rule, but we can base it on a combination of the policy and a random factor. We'll create a lookup table for the facilitator.

     Example hidden rules:
     - For Policy 1 (playground): 70% chance of success (if chosen metric is A, because it attracts families) but only 40% if metric is B (because it might not improve ratings much).
     - For Policy 2 (events): 50% chance of success for metric A, 80% for metric B (because events might attract crowds but not necessarily increase daily visitors if they are only weekly, but they might get high ratings).

     But note: we don't want to reveal these probabilities. We'll simulate the outcome after the market closes by rolling a die or drawing a random number.

  5. **Trading (30 minutes):**
     - Divide the trading into two rounds (each 15 minutes) to allow for learning and adjustment. Use a continuous double auction: participants can call out bids and offers.
     - How the assets work: Each asset represents a claim that a particular policy will be implemented and will be successful (i.e., achieve the chosen metric above the threshold). But note: the market is deciding which policy to implement, so the asset for the winning policy will then be evaluated for success. The assets for the losing policies become worthless.

     Clarification: We are actually creating a conditional prediction market. We are trading conditional on a policy being implemented. But in futarchy, the market prices are used to choose the policy. So we can structure the assets as:

       Asset X: Pays 100 tokens if Policy X is implemented AND the outcome (for the chosen metric) is above the threshold. Otherwise, pays 0.

     But note: if Policy X is not implemented, then Asset X pays 0 regardless.

     However, this makes the asset price a combination of the probability that the policy is implemented and the probability that it succeeds. We want the market to reflect the expected outcome of the policy. To decouple, we can have two separate markets? But that complicates.

     Alternatively, we can structure it as:

       The market is for conditional claims: "If Policy X is implemented, then the outcome will be a success." Then, after the market, we choose the policy with the highest price (which should reflect the market's belief in the success of that policy) and then we implement it and check.

     But note: the price in such a market would be the market's probability of success for that policy. Then, we choose the policy with the highest probability of success.

     How to run the market without real money? We can use tokens. Each asset is traded at whatever price the market sets (in tokens). We can have the assets in units (like shares) and the price per share is in tokens.

     Steps for trading:
       - Each participant can buy or sell shares of each policy.
       - They can place bids (e.g., "I'll buy 5 shares of Policy 1 at 30 tokens each") and asks (e.g., "I'll sell 3 shares of Policy 1 at 35 tokens each").
       - Trades are executed when a bid and ask match.

     We need a market maker or facilitator to help record trades and update the current best bid and ask on the board.

     Alternatively, to simplify, we can run the market as a call market in two rounds. In each round, participants write down their orders (buy or sell, how many shares, at what price) and then the market clears at a single price that maximizes the volume. But that might be too slow and less dynamic.

     Given time, we'll do continuous trading for 15 minutes per round, with two rounds.

  6. **Policy Implementation and Outcome (10 minutes):**
     - After trading, the policy with the highest share price (we'll use the last traded price or the average of the last few trades) is chosen. If there's a tie, flip a coin.
     - Then, the facilitator determines the outcome for the chosen policy by rolling a die (or using a random number generator) according to the hidden probabilities set for that policy and the chosen metric.

  7. **Payout (5 minutes):**
     - For the chosen policy, if the outcome is a success, each share of that policy pays 100 tokens. If failure, 0. Shares of other policies are worthless.
     - Participants can then redeem their tokens for ... well, nothing real, but we can have a leaderboard for fun.

  8. **Break (10 minutes)**

  9. **Debrief (40 minutes):**
     - Start by asking participants about their experience: What was frustrating? What was surprising?
     - Then, reveal that this was a simulation of an idea called "futarchy", invented by Robin Hanson.
     - Map the phases to futarchy:
          - Voting on the metric: In futarchy, we vote on what to value (the metric) but then let the market decide the policy.
          - The market: It was a conditional prediction market that both predicted the outcome of a policy and also decided which policy to implement. Note that traders had an incentive to buy shares in the policy they thought would succeed, but also they might try to manipulate the price to get a policy they like implemented even if it's not the best for the metric? Or they might try to push the price of a policy they hold shares in? This is a key point: the market combines beliefs and incentives.
     - Highlight the weirdness: The market isn't just forecasting, it's making the decision. And the metric vote becomes the real power because it defines what "success" is.
     - Discuss:
          - Did the market choose the best policy? How would we know? (We had hidden probabilities, so we can reveal that and see if the market price reflected the true probability.)
          - What if the metric was poorly defined? (Oracle problem: how do we measure the number of visitors or the ratings?)
          - What if there was manipulation? (e.g., if someone traded to push a policy they liked even if they didn't believe in it)
          - What if one policy had very little trading (liquidity)? Then the price might not be reliable.
          - How did it feel to have the policy decided by the market? Did it feel like the values were being respected?

  **What will go wrong the first time?**
  - **Trading confusion:** Participants might not understand how the assets work or how to trade. Solution: have a practice round with a simple example (like a coin flip) before the real trading. Or have a facilitator actively help.
  - **Lack of liquidity:** Some policies might not be traded much. Solution: The facilitator can act as a market maker by providing initial liquidity (buying and selling at a spread) or by ensuring there are enough participants trading each policy. Alternatively, reduce to two policies.
  - **Time constraints:** Trading might take too long. Solution: Strict time limits and a facilitator who pushes the process along.
  - **Unclear metric or policies:** Make sure the metrics and policies are very clear and written down. Use simple language.
  - **Random outcome feels unfair:** Participants might feel that the random outcome doesn't reflect their efforts. Emphasize that the randomness represents the uncertainty in the real world.

  **What the activity can't reproduce:**
  - **Real stakes:** Using tokens instead of real money reduces the incentive to trade truthfully. Participants might trade randomly or based on personal preference without considering the outcome.
  - **Long-term effects:** In real futarchy, the market would have to forecast long-term outcomes. Here, we simulate a short-term outcome.
  - **Complexity of real-world metrics:** We use a simple metric, but in reality, metrics can be gamed or hard to measure.

  **Alternative if trading is too complex:**
  Instead of a full market, we can use a simpler mechanism: a betting pool. Participants can bet tokens on which policy they think will have the best outcome. The policy with the most tokens bet on it wins. But note: this is not a market and doesn't produce a price. It's just a vote with stakes. So it doesn't capture the belief aggregation of a market.

  But we want the price as a continuous measure of expected outcome. So we'll stick with the market.

  **Revised Plan for Trading:**
  Given time and complexity, we might do a single policy market at a time? But we need to compare policies. Alternatively, we can have one market per policy and then choose the policy with the highest price. We can run the markets simultaneously.

  We'll assign two facilitators (from the participants) to help record trades for each policy. Or the main facilitator can manage one market at a time? That would be sequential and take too long.

  We'll do one market for all policies, but each policy has its own asset. The facilitator will write on the board:

    Policy 1: Current best bid: __, Current best ask: __
    Policy 2: ...

  Participants call out their bids and asks. When a trade occurs, the facilitator records it and updates the board.

  **Timeline:**
  - 0-5 min: Introduction
  - 5-20 min: Metric vote (discussion and vote)
  - 20-35 min: Policy presentation and market rules explanation
  - 35-65 min: Trading Round 1 (15 min) and Round 2 (15 min) - but we might need to adjust
  - 65-75 min: Policy selection and outcome simulation
  - 75-80 min: Payout
  - 80-90 min: Break
  - 90-130 min: Debrief

  We are tight on time. We might need to cut trading to one 20-minute round and skip the break? Or shorten the debrief? But the debrief is crucial.

  Alternatively, we can run the trading in two rounds but make each round 10 minutes. Then:

  - 0-5: Intro
  - 5-20: Metric vote
  - 20-30: Policy and market rules
  - 30-50: Trading (two 10-minute rounds)
  - 50-60: Policy selection and outcome
  - 60-65: Payout
  - 65-75: Break
  - 75-115: Debrief

  This is 1 hour 55 minutes. Close enough.

  **Final Structure:**

  1. **Intro (5 min):** Set the scene.
  2. **Metric Vote (15 min):** 
     - Present metrics: 
          Metric A: Maximize daily visitors (we'll measure by counting people at the park on a typical day next month).
          Metric B: Maximize average visitor rating (we'll conduct a survey and average the ratings).
     - Small group discussion (5 min).
     - Vote (by show of hands).
  3. **Policy Presentation and Market Rules (10 min):**
     - Policies:
          Policy 1: Install new playground equipment.
          Policy 2: Organize weekly events.
          Policy 3: Improve landscaping and seating (optional - if we have time, else drop to two policies).
     - Market rules: 
          - Each participant gets 100 tokens.
          - There will be three assets (one per policy). Each asset is a share that pays 100 tokens if that policy is implemented AND the outcome for the chosen metric is a success (we define success as: for Metric A, at least 50 more daily visitors; for Metric B, at least 8.0 average rating). Otherwise, it pays 0.
          - The policy with the highest share price at the end of trading will be implemented.
          - Trading: You can buy or sell shares by calling out bids and asks. The facilitator will record trades and update the board.
  4. **Trading (20 min):** 
     - Round 1: 10 minutes.
     - Round 2: 10 minutes.
     - Facilitator helps match trades and updates the board with the latest trade prices for each asset.
  5. **Policy Selection and Outcome (10 min):**
     - Calculate the last traded price for each policy. Choose the policy with the highest price.
     - For the chosen policy, determine success by a random draw based on pre-set probabilities (that depend on the chosen metric). Example probabilities:
          - If Metric A was chosen:
               Policy 1: 70% success (e.g., roll a 10-sided die: 1-7 success, 8-10 failure)
               Policy 2: 50% success (1-5 success, 6-10 failure)
               Policy 3: 60% success
          - If Metric B was chosen:
               Policy 1: 40% success
               Policy 2: 80% success
               Policy 3: 70% success
     - Roll the die and announce the outcome.
  6. **Payout (5 min):** 
     - For the winning policy, if success, each share pays 100 tokens. If failure, 0.
     - For non-winning policies, shares are worthless.
     - Participants count their total tokens (initial tokens plus any from payouts, minus what they spent on shares, plus what they got from selling shares). 
     - Optional: Declare a winner (most tokens) for fun.
  7. **Break (10 min)**
  8. **Debrief (40 min):** 
     - Start with open reactions.
     - Reveal futarchy and map the activity to it.
     - Discuss the key points: 
          - The metric vote is where values are expressed, then the market (beliefs and incentives) decides the policy.
          - The market was both forecasting and deciding (conditional market).
          - The oracle problem: How do we measure the metric? In reality, this is hard and can be manipulated.
          - Did anyone try to manipulate? (e.g., buy a policy you like even if you think it will fail, to get it implemented? Or sell a policy you don't like even if you think it will succeed?)
          - Liquidity: Were all policies actively traded? What if one wasn't?
          - The hidden probabilities: The market didn't know the true chances. How well did the market price reflect the true probability? (Facilitator can reveal the true probabilities and compare to the final prices.)

  This should give the participants a feel for the force and the weirdness of futarchy.
answer: |-
  ### Futarchy Simulation: "The Village Commons Challenge"  
  **Goal:** Experience the shift from policy voting to metric voting, then using a conditional prediction market to select policies. Participants confront the relocation of power to metric choice, market manipulation, and belief aggregation.

  ---

  ### **Game Setup**  
  **Scenario:** Your village has £10,000 to spend on improving the Commons (a public park). Three policies are proposed:  
  1. **P1: Playground Upgrade** (swings, slides).  
  2. **P2: Wildlife Habitat** (pond, bird boxes).  
  3. **P3: Event Space** (stage for concerts).  

  **Metrics** (choose one to maximize):  
  - **M1: Daily Visitor Count** (measured by sensors).  
  - **M2: Biodiversity Score** (expert survey of species).  
  - **M3: Resident Satisfaction** (1–10 survey).  

  **Participants:**  
  - **Roles:** None assigned—all are "villagers" with equal stakes.  
  - **Groups:** Split into 3–4 small groups for deliberation phases.  

  **Materials:**  
  - Tokens (3 colors: red for voting, blue for trading, white for payouts).  
  - Whiteboard (track market prices, votes, outcomes).  
  - Policy/Metric cards (for voting).  
  - Dice (simulate randomness in outcomes).  

  **Token Economy:**  
  - Start with 50 red tokens (voting), 100 blue tokens (trading).  
  - **No real money:** Tokens convert to "prestige points" (bragging rights).  

  ---

  ### **Rules & Timeline** (110 minutes total)  
  #### **Phase 1: Metric Vote** (20 min)  
  - **Task:** Groups debate metrics (10 min). Which *outcome* matters most?  
  - **Vote:** Secret ballot with red tokens. Each voter allocates 5 tokens across metrics (e.g., 3 on M1, 2 on M3).  
  - **Outcome:** Metric with most tokens wins. Record on whiteboard.  

  #### **Phase 2: Policy Prediction Market** (45 min, including break)  
  - **Setup:**  
    - Each policy (P1, P2, P3) has a "policy stock."  
    - Stocks pay out based on the winning metric’s outcome *if the policy is chosen*.  
    - **Payout rule:**  
      - Success = Outcome > village average (simulated later).  
      - Success: 100 white tokens per stock. Failure: 0.  
  - **Trading Rules:**  
    - Continuous double auction (call out bids/asks).  
    - Blue tokens = currency. Buy/sell stocks of P1, P2, P3.  
    - Example: "Sell 1 P1 stock for 30 blue tokens!" → Anyone can accept.  
  - **Process:**  
    1. **Round 1 (15 min):** Trade freely. Facilitator updates stock prices on whiteboard.  
    2. **Break (10 min):** Groups discuss market trends.  
    3. **Round 2 (15 min):** Trade resumes. Final prices determine policy choice.  
  - **Policy Selection:** Policy with highest stock price wins.  

  #### **Phase 3: Outcome & Payout** (15 min)  
  - **Simulate Outcome:** Roll dice for the winning policy:  
    - **Dice Rules:**  
      - *M1 (Visitors):* 1–3 = failure, 4–6 = success.  
      - *M2 (Biodiversity):* 1–4 = success, 5–6 = failure (harder!).  
      - *M3 (Satisfaction):* 1–2 = failure, 3–6 = success.  
    - *Why dice?* Simulate uncertainty. Pre-load biases (e.g., M2 fails more often) to mirror real-world unpredictability.  
  - **Payout:**  
    - Holders of the winning policy’s stock get white tokens if successful.  
    - Count white tokens → "prestige points."  

  #### **Phase 4: Debrief** (30 min)  
  Start open, then reveal futarchy. Key discussion points:  

  | **What Happened**          | **Futarchy Concept**         | **Questions for Group**                                                                 |  
  |----------------------------|------------------------------|----------------------------------------------------------------------------------------|  
  | Voted on metric (M1/M2/M3) | **Values vs. Beliefs**       | "Why did metric choice feel high-stakes? Who had power here?"                          |  
  | Market set policy price    | **Conditional Prediction**   | "Did prices reflect beliefs about policies, or something else? What skewed prices?"    |  
  | Payout based on metric     | **Oracle Problem**           | "How did we ‘measure’ success? What if the metric was gamed in real life?"             |  
  | Rush to buy/sell stocks    | **Manipulation & Liquidity** | "Did anyone ‘pump’ a policy? What if a stock had no traders?"                          |  
  | Policy chosen by market    | **Decision vs. Forecast**    | "How did it feel letting the market decide? Did incentives align with truth-seeking?"  |  

  **Reveal the Twist:** "This was **futarchy**—you voted on *what* to value, then markets decided *how* to get it."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Trading is chaotic/loud.  
     - **Fix:** Assign a "market maker" (participant) to track bids/asks. Use hand signals for trades.  

  2. **Problem:** Groups dominate discussion.  
     - **Fix:** Enforce 1-minute speakers. Redirect to metrics: "What are we optimizing for?"  

  3. **Problem:** Metric vote is split (no majority).  
     - **Fix:** Runoff vote with top two metrics.  

  4. **Problem:** Market freezes (no trades).  
     - **Fix:** Inject liquidity—facilitator buys/sells stocks at midpoint prices.  

  5. **Problem:** Payouts feel arbitrary.  
     - **Fix:** Emphasize: "Dice represent real-world uncertainty. Did the market account for risk?"  

  ---

  ### **What the Simulation Can’t Capture**  
  - **Real Stakes:** Tokens lack skin-in-the-game pressure. *Supply this yourself:* Ask, "Would you trust this with your pension? Why/why not?"  
  - **Long-Term Gaming:** Real futarchy faces metric manipulation (e.g., boosting visitor counts while ruining park quality). *Highlight post-game:* "The metric is the real policy—what stops leaders from picking bad metrics?"  
  - **Market Depth:** Thin markets lead to volatility. *Note:* "In reality, liquidity determines reliability."  

  ### **Why This Works**  
  - **Experiential Learning:** Groups "live" the tension—metric voting feels democratic, the market feels alien.  
  - **No Lecture Needed:** Struggles during trading/debates reveal futarchy’s quirks organically.  
  - **Flexible:** Adjust policies/metrics to local issues (e.g., "Should we build bike lanes?").  

  Run it, and let the market’s chaos spark the debate. By the end, they’ll grasp why Hanson’s idea is thrilling, unsettling, and radically shifts power from people to proxies.
