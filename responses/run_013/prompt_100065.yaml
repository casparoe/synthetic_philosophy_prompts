  Their proposed solution - separating personal morality (where motive matters) from communal morality (where it doesn't) - seems promising but needs stress-testing. I'm particularly wary of how their terminology might bias the analysis. The "moral coverage" concept risks smuggling in liberal individualism, and the three trust types might oversimplify complex social realities documented by scholars like Cook or Hardin.

  For the unresolved cases they propose: The interfaith food bank likely succeeds through what I'd call "infrastructure hybridization," while the sectarian convert's widened coverage despite narrowed motives presents a perfect test for whether we value behavioral outcomes over internal states. 

