  The core tension I notice is between three competing moral dimensions: performance (actions), coverage (who counts), and infrastructure (what sustains behavior). Their cases cleverly pit these against each other - like how the devout shopkeeper (case 1) has high performance within narrow coverage, while the secular nurse (case 2) has universal coverage. 

  What makes this tricky is how they've layered multiple conflicts:
  - The wallet cases (3-4) test whether fear of judgment vs institutional norms produce "real" trust
  - Cases 5 vs 3 directly clash on whether motive matters
