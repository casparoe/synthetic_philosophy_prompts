answer: |-
  Below is a systematic analysis of your cases and concepts. I'll proceed as requested: brainstorming candidate principles, testing them against your cases, identifying tensions, refining a surviving principle, and applying it to new cases. I'll flag contested assumptions throughout.

  ---

  ### **Brainstorming Candidate Principles**
  After analyzing your cases, three competing principles emerge:

  1. **The Behavioral Output Principle**: Moral status depends solely on observable actions and their consequences across domains (performance + coverage). Motive and infrastructure are irrelevant to "moral" evaluation (only relevant to "why" it occurs).  
  2. **The Motive-Coverage Integration Principle**: Moral status requires both (a) wide coverage *and* (b) intrinsic motive (e.g., duty, compassion). Infrastructure enables performance but doesn't confer moral credit.  
  3. **The Sustainable Practice Principle**: Moral status attaches to *sustained patterns of behavior* within a domain, regardless of motive, provided the infrastructure enabling them is stable and inclusive. Coverage determines the "scope" of morality, not its quality.  

  ---

  ### **Testing Principles Against Your Cases**

  | Case | Your Verdict | Behavioral Output | Motive-Coverage | Sustainable Practice |
  |------|--------------|-------------------|-----------------|----------------------|
  | 1    | Religious shopkeeper not "more moral" | ❌ (Higher performance w/ narrow coverage) | ✅ (Coverage too narrow) | ✅ (Coverage limited; infrastructure exclusionary) |
  | 2    | Secular nurse "more moral" | ✅ (High performance + wide coverage) | ✅ (Wide coverage + secular duty) | ✅ (Sustainable across all patients) |
  | 3    | Village trust "real" | ✅ (Behavior exists) | ❌ (Motive is fear, not duty) | ✅ (Sustainable via monitoring) |
  | 4    | City trust "real" and robust | ✅ | ❌ (Infrastructure-dependent motive) | ✅ (Infrastructure resilient) |
  | 5    | Anonymous giver "more moral" | ❌ (Same outcome) | ✅ (Intrinsic motive) | ❌ (Focuses on sustained output, not motive) |
  | 6    | Post-secularization trust fall shows religious infrastructure | ✅ (Infrastructure affects output) | ✅ (Motive tied to religion) | ✅ (Infrastructure collapse → practice unsustained) |
  | 7    | Kind but unreliable > honest but cruel | ❌ (Commerce honesty more "useful") | ✅ (Coverage wider at home? Motive matters) | ✅ (Kindness sustains intimate trust; cruelty undermines it) |
  | 8    | Practice > belief for "moral" change | ✅ | ❌ (Motive could align with practice) | ✅ (Practice within community = sustainability) |

  **Surviving Principle**: **Sustainable Practice Principle** best accommodates all cases *except Case 5*.  
  - **Core**: *A person or community is "more moral" when they sustain wider-coverage moral performance through infrastructure that does not actively exclude groups.* Motive is irrelevant to moral status (though relevant to character evaluation).  
  - **Why it survives**:  
    - Explains village/city trust (Cases 3–4) as equally "real" if sustained.  
    - Accommodates your nurse > shopkeeper verdict (Cases 1–2) via coverage breadth.  
    - Aligns with secularization collapse (Case 6) without rejecting institutional trust (Case 4).  
    - Supports practice-focused moral change (Case 8).  

  ---

  ### **(a) Refined Principle**  
  **Sustainable Practice with Inclusive Coverage**:  
  > *An agent (individual or group) is morally superior iff:*  
  > (i) Their moral performance is *sustained* across contexts;  
  > (ii) Their moral coverage *includes all persons affected by their actions*;  
  > (iii) The infrastructure enabling (i) *does not rely on in-group/out-group exclusion*.  
  > *Motive is epistemically opaque and irrelevant to moral status, though it may affect character assessment.*  

  **Tied to cases**:  
  - Clause (ii) from Case 1 (shopkeeper's narrow coverage) and Case 2 (nurse's universality).  
  - Clause (iii) from Case 6 (exclusionary religious infrastructure failed when secularized).  
  - Clause (i) from Cases 3–4 (sustained wallet-returning).  
  - Motive irrelevance from Case 3 (fear-driven trust is "real") vs. Case 5 (motive conflict).  

  ---

  ### **(b) Incompatible Verdicts and Sacrifices**  
  - **Must sacrifice Case 5**: Your verdict (anonymous giver > praise-seeker) requires motive to affect moral status. The surviving principle rejects this: same performance + same coverage = same moral status.  
    - *What you lose*: The intuition that moral worth derives from inner virtue. Retaining Case 5 collapses the principle (see Case 3 conflict).  
  - **Tension between Cases 4 and 6**: Principle resolves this:  
    - Case 6: Trust collapsed because infrastructure was *exclusionary* (coverage depended on religious in-group monitoring).  
    - Case 4: Trust persists because *inclusive* infrastructure (professional norms) doesn’t rely on exclusion.  
  - **Contested vocabulary**:  
    - Your "moral coverage" assumes a *patient-centered* morality (who deserves treatment). Some virtue ethics (e.g., Hursthouse) would reject this as reductive.  
    - "Three kinds of trust" is empirically disputed: Cook et al. (2005) show "monitored trust" often *becomes* impersonal via institutionalization.  

  ---

  ### **(c) New Case Verdicts**  
  **Case A: Religiously mixed neighborhood food bank (mosque + secular association)**  
  - **Principle verdict**: **Morally superior cooperation**.  
    - Joint infrastructure *expands coverage* (no exclusion), making moral performance (honesty) sustainable across groups.  
    - Each side "crediting the other" signals *infrastructure hybridity*, which strengthens resilience.  

  **Case B: Man joins religious order, becomes more generous to outsiders**  
  - **Principle verdict**: **Increase in moral status**.  
    - Coverage widened (outsiders now included).  
    - Performance sustained (generosity institutionalized).  
    - Motive ("sectarian") is irrelevant unless it *narrows coverage* (e.g., proselytizing as condition for aid).  
    - *Not a compositional shift*: Coverage expansion meets criterion (ii).  

  ---

  ### **(d) Crucial Test Case**  
  **The "Charitable Bigot"**:  
  > *A philanthropist funds hospitals for all races, driven solely by racist motives (e.g., "proving racial superiority through benevolence"). Performance is impeccable, coverage universal, infrastructure stable.*  

  - **Predictions**:  
    - **Behavioral Output**: "More moral" (universal coverage + high performance).  
    - **Motive-Coverage**: "Not moral" (corrupt motive + coverage instrumentally universal).  
    - **Sustainable Practice**: **"More moral"**. Motive is irrelevant; coverage is inclusive; performance is sustained.  

  - **Why it tests the principles**:  
    - Forces a choice between *outcomes* (lives saved) and *intent* (hateful motivation).  
    - Sustainable Practice prioritizes material impact but risks decoupling morality from character.  

  ---

  ### **Contested Ground**  
  1. **Motive vs. Outcome**:  
     - *Settled*: Social science (e.g., Norenzayan) confirms belief/identity groups boost prosociality *within bounds*.  
     - *Contested*: Whether motive affects "moral" status (Kantians vs. consequentialists). Your Case 5 is Kantian; the principle leans consequentialist.  
  2. **Infrastructure Neutrality**:  
     - *Contested*: Sociologists (e.g., Gorski) argue *all* infrastructures encode power/knowledge. Your framing assumes we can distinguish "inclusive" infrastructure neutrally.  
  3. **Trust Typology**:  
     - *Empirically disputed*: Monitored trust (Case 3) may not be distinct from institutional trust (Case 4) if institutions internalize monitoring (e.g., credit scores).  

  ---

  ### **Conclusion**  
  **Surviving Principle**: Moral status derives from **sustained, inclusive-coverage performance enabled by non-exclusionary infrastructure**. Motive is irrelevant beyond its behavioral effects.  
  - **Sacrifices**: Case 5 (motive must not affect moral status) and Kantian intuitions about moral worth.  
  - **Strengths**: Explains secular/religious trust parity (Cases 3–4), coverage matters (Cases 1–2), and infrastructure collapse (Case 6).  

  This positions "moral" as a social outcome, not a state of soul—a move contested by virtue ethicists but aligned with sociological realism. For your work, this implies:  
  > *Religious practice can make people "better" by widening coverage and building inclusive infrastructure, but not by instilling superior motives.*
