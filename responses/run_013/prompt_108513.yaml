prompt: |-
  I'm a hospital chaplain, not a philosopher, but I sat on our ethics committee for a year and I've been chewing on an argument one of the residents made about advance directives. He thought we shouldn't honor them at all, and I could never tell if he was being clever or if there's a hole in it. Here's how he put it.

  (1) What makes a treatment decision mine to make is that it reflects what I actually want right now -- my current, competent preferences about how my life goes.
  (2) An advance directive, by the time it takes effect, is the voice of somebody who's gone. The woman who wrote "no tube" is not the woman in the bed. Different values, different life, and in the sense that matters she isnt there anymore.
  (3) So when we follow the directive we let a person who no longer exists boss around the person who does.
  (4) Overriding a competent person's expressed wishes in favor of somebody else's wishes is exactly what we call paternalism, and its wrong.
  (5) Therefore we shouldn't honor advance directives, except maybe as one bit of evidence about what the patient would have wanted.

  The thing is, (4) feels airtight and I basically believe it, and (5) still feels monstrous to me. And not only in this kind of case. If the earlier self really has no standing over the later self, I can't see whats left of promises, contracts, or saving for retirement. A guy who takes out a 30-year mortgage at 30 and wants out at 50 is the same setup, and nobody thinks he just gets to stop paying. So I'm worried the argument proves way more than the resident wanted it to.

  So which step do I give up, and what does giving it up cost me? I'd rather keep (4) than (5), but I want to know what I'm paying if I do. And the middle steps bother me somehow -- that phrase "in the sense that matters" especially -- but I can't put my finger on why, and I'm not sure my unease is even pointing at the real problem.
reasoning: |-
  Okay, let me start by really understanding the chaplain's dilemma. They're a hospital chaplain who served on an ethics committee and heard this resident's argument against honoring advance directives. The chaplain is troubled because step 4 seems solid—paternalism is wrong—but step 5 feels morally wrong. Plus, the argument seems to undermine other commitments like promises or contracts.

  Hmm, the resident's argument hinges on identity over time. He claims the person who wrote the directive isn't the same as the current patient. But what does "same person" mean here? The chaplain mentioned the phrase "in the sense that matters" as bothersome. That's probably key. The resident is using a psychological continuity view: if beliefs and values change, they're a different person. But legally and socially, we consider someone the same person unless they're declared incompetent. So maybe the problem is step 2, where the resident assumes the past self is gone. But in dementia cases, even if values change, we might still see it as the same person with evolved preferences.

  The chaplain also brings up examples like mortgages. If we reject advance directives, does that invalidate long-term commitments? The resident might counter that contracts have enforcement mechanisms, but the ethical parallel is strong. If we allow breaking commitments when preferences change, society's structures could crumble. So the argument proves too much, which suggests a flaw.

  Step 4 says overriding current wishes is paternalism. But when a patient is incompetent, their current self can't make decisions. The advance directive is a prior competent choice. Honoring it isn't paternalism; it's respecting autonomy extended over time. Paternalism would be disregarding both past and present wishes. The chaplan’s intuition that step 5 is monstrous makes sense because it abandons the patient's autonomous planning.

  The chaplain wants to keep step 4 but reject step 5. That means finding which earlier step fails. Step 2 seems weak. The past self isn't "gone"; there's a narrative identity. Plus, advance directives include Ulysses contracts for anticipated changes. The chaplain could argue that autonomy includes future planning, so respecting directives honors the patient's extended autonomy. 

  The cost of giving up step 4 would be accepting paternalism, which the chaplain rightly rejects. But modifying step 2 to recognize psychological continuity and narrative identity allows keeping step 4 without falling into step 5. The chaplain might also emphasize that in dementia, the current self lacks competency, so the directive stands as the last competent choice. 

  The chaplain's unease about "in the sense that matters" is spot-on. That phrase glosses over the complexity of identity. Ethically, respecting autonomy means honoring past decisions when the patient foresaw the situation. The chaplain is right to protect advance directives; otherwise, vulnerable patients lose their voice.
answer: |-
  You've put your finger on a profound and genuinely difficult philosophical problem at the intersection of personal identity, autonomy, and ethics. Your intuition that the resident's argument proves too much (invalidating promises, contracts, etc.) is spot-on and reveals its core flaw. Let's break down the steps and see where the argument goes wrong and what costs come with rejecting each step.

  **The Core Problem:** The resident's argument relies on an overly narrow and temporally restricted view of autonomy and personal identity ("Numerical Identity" focused on psychological continuity *at a single moment*). This view struggles with the reality of humans as temporally extended beings who plan, commit, and value their future selves.

  **Dissecting the Steps & What Giving Them Up Costs:**

  1.  **Step 1: "What makes a treatment decision mine... is that it reflects what I actually want right now."**
      *   **The Flaw:** This defines autonomy purely as *synchronic* (at one moment) preference satisfaction. It ignores *diachronic* autonomy – our ability to make decisions *now* that bind or guide our future selves, which is fundamental to human agency and planning. My "right now" self includes my plans, commitments, and values *for* my future.
      *   **Cost of Giving It Up:** If you reject this step, you give up the absolute primacy of *current, competent* wishes in situations where the person *is* currently competent to express them. This is a significant cost! We generally *do* prioritize current competent wishes over past wishes *if* the person is competent *now* (e.g., someone changing their mind about a DNR order while lucid). **You likely *should* give up the "only" part of this step.** Autonomy must encompass both respecting *current* competent expressions *and* respecting *past* competent expressions designed to govern *future* states of incapacity.
      *   **Revised View:** Autonomy includes both respecting current competent preferences *and* respecting prior competent expressions of will intended to govern future situations where the capacity to express that will is lost. The "mine" extends across time.

  2.  **Step 2: "The woman who wrote 'no tube' is not the woman in the bed... she isn't there anymore."**
      *   **The Flaw:** This is the crux, relying on a specific (and controversial) philosophical view of personal identity (e.g., Parfit's view emphasizing psychological continuity). "In the sense that matters" is doing enormous work here. While profound dementia *does* change personality and values, there are other "senses that matter":
          *   **Biological/Narrative Identity:** She is biologically the same organism. There is a single life narrative, even if the later chapter is tragically altered. The directive was made *within* that narrative, *by* the subject of that narrative, *for* this specific chapter.
          *   **Anticipatory Autonomy:** She *anticipated* this change and explicitly stated her will *for* this scenario. Respecting that directive honors *her* foresight and her right to define how her life story ends, even if the current self cannot articulate it.
          *   **The "Gone" Problem:** Is she truly "gone"? Or is she present but impaired? We often treat individuals with dementia *as* the same person, albeit compromised. The directive is evidence of what *this person* decided when capable.
      *   **Cost of Giving It Up:** If you reject this step, you potentially deny the reality of profound psychological change. You might be accused of prioritizing a "ghost" over the living, experiencing person in the bed. You need a robust account of *why* the past self has standing *despite* the change. **This is the most critical step to reject.**
      *   **Revised View:** The person in the bed *is* the same entity who authored the directive. Severe dementia represents a radical impairment *of* that person's capacity, not the replacement of that person by a different one. Honoring the directive respects the *last competent expression of will* by *that person* for this exact situation they foresaw.

  3.  **Step 3: "We let a person who no longer exists boss around the person who does."**
      *   **The Flaw:** This framing depends entirely on the flawed premise of Step 2. If the person in the bed *is* the same person (though impaired), then we are not letting a "boss" dictate; we are implementing a plan *made by the impaired person themselves* when they were competent, for their *own* benefit as they defined it in that competent state. It's self-governance across time, not external governance.
      *   **Cost of Giving It Up:** Minimal. This step adds nothing new; it just dramatizes the conclusion reached in Step 2. Rejecting it simply means rejecting the "boss" metaphor as inaccurate.
      *   **Revised View:** We are implementing the *patient's own plan* for their future incapacitated self, not imposing the will of an outsider.

  4.  **Step 4: "Overriding a competent person's expressed wishes... is paternalism, and it's wrong."**
      *   **The Flaw:** This step smuggles in a false equivalence. It assumes the person in the bed, with severe dementia, *is* "competent." **This is the key sleight of hand.** The whole *point* of an advance directive is that it takes effect *when the patient is no longer competent*. The resident's argument *defines* the severely demented patient as "competent" simply because they exist and might express preferences, ignoring the profound impairment that *is* the loss of decision-making capacity. Overriding the *impaired, non-competent* current expressions of a demented patient to follow their *prior competent directive* is **not** paternalism towards *that competent person*. It is respecting their prior autonomy *because* their current capacity is gone. Paternalism would be overriding their *prior competent directive* based on what *we* think is best for their current impaired state.
      *   **Cost of Giving It Up:** This is the step you (and most ethicists) rightly want to keep. Giving it up would mean accepting that overriding competent wishes *is* sometimes acceptable paternalism. This is a very high cost to ethical consistency and respect for persons. **You should absolutely keep Step 4.** The problem lies in misapplying it to a non-competent patient.
      *   **Revised View:** Step 4 is correct *when the person is currently competent*. When a person is *incompetent*, the question shifts to determining their *best interests* and/or their *prior expressed wishes*. Honoring a valid advance directive when the patient is incompetent is respecting autonomy (extended over time), not paternalism. Paternalism would occur if we ignored both the directive *and* the patient's current (impaired) wishes to impose *our* view of their good.

  5.  **Step 5: "Therefore we shouldn't honor advance directives..."**
      *   **The Flaw:** This conclusion follows only if all previous flawed steps are accepted. Rejecting Step 2 (the core identity claim) and correctly interpreting Step 4 (only applying to competent patients) dismantles the argument for Step 5.
      *   **Cost of Accepting It:** As you intuitively feel, this is monstrous. It strips people of the power to protect their future selves from unwanted interventions when they lose capacity. It abandons vulnerable, incompetent patients to the potentially conflicting interpretations of their current (impaired) expressions or the subjective judgments of others about their "best interests." It invalidates a crucial tool for patient autonomy and dignity at the end of life. It also, as you note, logically threatens any future-oriented commitment.

  **The Solution: Reject Step 2 (as stated) and Correctly Apply Step 4**

  1.  **Reject the Radical Identity Claim (Step 2):** The person who wrote the directive *is* the same person in the bed, though tragically impaired. "In the sense that matters" for medical decision-making includes biological continuity, narrative identity, and crucially, the *anticipatory autonomy* exercised when the person *was* competent to plan for this very situation. The cost is acknowledging the deep sadness of the change while upholding the person's right to have planned for it.
  2.  **Uphold Step 4, But Apply It Only to Competent Patients:** The core principle – overriding the *competent* wishes of a person *is* wrong paternalism – remains sacred. The error is labeling the severely demented patient as "competent" simply because they exist or express fragmentary desires. Recognizing profound dementia *as* incompetence is essential. Honoring the advance directive in this case is respecting the *last competent expression* of the patient, not overriding a competent wish.

  **Addressing Your Broader Concern (Promises, Mortgages):**

  The resident's logic *does* indeed threaten these. Why? Because it uses the same flawed premise: that a later self with different preferences is a "different person" not bound by the commitments of the earlier self. Society functions precisely because we reject this radical view. We hold people to promises and contracts based on the understanding that the person *at Time A* has legitimate authority to bind the person *at Time B*, even if preferences change. The justification is similar:

  *   **Continuity of Identity:** We recognize the person at Time B *is* the same legal and moral entity as at Time A.
  *   **Autonomy & Commitment:** Respecting autonomy includes respecting a person's capacity to make binding commitments that shape their future, creating stability and trust.
  *   **Social Necessity:** A society where commitments vanish with changing preferences is unworkable.

  Advance directives are the *medical and ethical* equivalent of these social commitments – a mechanism for extending our autonomous will into a future where we may lack the capacity to express it directly.

  **Conclusion:**

  Your unease is well-founded. The resident's argument cleverly exploits a deep philosophical puzzle about identity over time, but it relies on an unsustainable view of identity and a misapplication of the concept of competence/paternalism. The step you *must* give up is **Step 2** ("the woman who wrote it is gone"). The cost is accepting that respecting autonomy sometimes means honoring the decisions of a past, competent self *on behalf of* a present, incompetent self who is nevertheless the *same person*. This upholds the crucial principle of autonomy extended over time.

  The step you must **defend vigorously** is **Step 4**, but you must insist it only applies when the patient *is currently competent*. When they are not, their prior competent directive (or a surrogate's judgment based on known wishes/best interests) guides care. Honoring that directive isn't paternalism; it's rejecting paternalism by refusing to let *our* judgment (or the fragmented expressions of an impaired mind) override the patient's own clear, competent prior instructions for this exact scenario. To abandon advance directives *would* be monstrous, leaving the most vulnerable without the protection of their own prior voice.
