prompt: |-
  I teach a mixed upper-level seminar — eighteen students, roughly half of them physics graduate students and half philosophers, ninety minutes a week — on evidence and theory choice in the physical sciences, and the session I have to build next is on a topic that has become uncomfortably personal to me. I did a doctorate in theoretical cosmology before moving over to philosophy, and I left in large part because I could no longer give an honest account of why the programme I had been working in deserved my time: it was unified, it was mathematically fertile, it had no serious competitor, and it made no prediction that anyone expected to check within my working life. My students have begun asking me, politely, whether that was a decade wasted, and I have discovered that I have no criterion to hand them — only the suspicion that my confidence rested on considerations that were never empirical, and that those same considerations, applied with equal honesty, would license programmes I regard as nonsense. I would much rather they find this out than be told it. So please act as a designer of teaching games in the philosophy of science: someone who knows the live debate over non-empirical grounds for theory preference — the appeal to the absence of viable alternatives, the appeal to a theory's unexpectedly unifying a domain it was not built for, the appeal to explanatory coherence where prediction is unavailable — as well as the older literature on underdetermination and demarcation, and who also knows how to build something that actually runs in a classroom with no equipment. Before you write anything, think carefully about what would have to be true of the game's incentives for a group of students to end up defending a theory on non-empirical grounds without anyone telling them that this is the point, and give me a short sketch of that reasoning before the design itself.

  The activity I want is a mock funding panel. Four teams, each acting as a review panel for a national agency whose remit I will phrase so that the safe answer is ruled out — something along the lines of maximising the probability of a transformative discovery within twenty years — with a fixed budget in tokens that they must allocate in full across the dossiers they are given. The programmes should be drawn from contemporary fundamental physics — quantum gravity, early-universe cosmology, particle theory — but described in plain language, and the students must not be able to identify the real programmes by name, so anonymise everything and give each dossier a neutral label. Make them differ in what they offer rather than in how famous they are: one that unifies domains currently lacking a common language, one whose central argument is that it has no competitor, one that is empirically respectable but theoretically dull, and — this is the part I care most about — at least one decoy whose dossier is written so that it scores well on every criterion the students will naturally reach for while being transparently worthless to anyone who asks what its central entity actually does. I also want two of the dossiers to be the same underlying programme written in two registers, one in the vocabulary of a mature and prestigious field and one in the vocabulary of a fringe one, so that we can see whether the panels rank them differently. Structure the session in rounds: an initial allocation; then the arrival of a null result that every dossier can accommodate, forcing a renewal decision; then a final round in which each panel must write down the criteria it actually used as a public rule that an oversight committee could hold it to. Give me the timeline, the materials, the exact wording of the remit, the allocation and scoring mechanics, the role assignments if you want roles, and what I should be doing as facilitator at each stage — including when to say nothing at all. The words string theory and multiverse should not be spoken until the debrief.

  Then the debrief, which is the part I will lean on: a map from what happened in each round to the philosophical issue it stages, written in your own words and without a reading list — I am teaching from a handout and would rather not have citations, names, or suggestions for further reading, since anything of that sort I would have to check and the ideas stated plainly will serve me better. I want the debrief to press on why the null result failed to discriminate, on the difference between a theory that cannot be tested yet and one that cannot be tested in principle, and on the arguments that some of these programmes do make statistical or indirect predictions — the smallness of the cosmological constant being the usual example, and signatures in the cosmic microwave background or at colliders being the usual hope — so that the students do not leave with the lazy conclusion that the whole area is pseudoscience. Then tell me what will predictably go wrong the first time I run it: which teams will game the exercise by importing their prior opinions about who the real programmes are, what I should do when a student tries to end a discussion by declaring something not to be science at all, and how to keep the philosophers from being talked over by the physicists. Finish with a frank paragraph on what the activity cannot reproduce — the technical difficulty that makes the real arguments hard to assess, the decades of embedded work that give the non-empirical considerations their weight, and whatever else you think the game will flatten — and say what I will have to supply myself in the last ten minutes if the students are to get the point rather than merely enjoy the exercise.
reasoning: |-
  We are designing a teaching game for a mixed upper-level seminar on evidence and theory choice. The goal is for students to experience the use of non-empirical criteria in theory evaluation without being explicitly told that this is the point. The activity is structured as a mock funding panel with four teams, each acting as a review panel for a national agency.

  Key elements:
  - Remit: "Maximise the probability of a transformative discovery within twenty years." This rules out the safe answer (funding only what is empirically testable soon) because transformative discoveries may take time and may come from speculative areas.
  - Budget: Fixed budget in tokens (say, 100 tokens per panel) to be allocated in full across four dossiers (research programmes).
  - Dossiers: Four anonymised research programmes, described in plain language, with neutral labels (A, B, C, D). They should differ in their non-empirical virtues and one should be a decoy. Also, two dossiers (say, A and B) should represent the same underlying programme but written in two different registers (one mainstream and one fringe).

  Structure of the session:
  1. Introduction (10 minutes)
  2. Initial allocation (25 minutes)
  3. Null result round (20 minutes)
  4. Final allocation and rule-writing (20 minutes)
  5. Debrief (15 minutes)

  Total: 90 minutes.

  Detailed plan:

  **Materials:**
  - Four dossiers (labelled A, B, C, D) - each one page long, written in plain language.
  - Budget tokens: 100 tokens per panel.
  - Worksheets for each panel to record allocations and, in the final round, the criteria they used as a public rule.
  - Whiteboard or shared document for recording panel decisions.

  **Dossiers (anonymised and described in plain language):**

  *Dossier A (Mainstream register of a unified theory):*
  "Programme A proposes a unified mathematical framework that describes all known forces and particles. It has led to new mathematical structures that have found applications in other areas of physics and mathematics. The framework is highly constrained and has no adjustable parameters. Although direct experimental tests are not feasible with current technology, it provides a coherent explanation for the values of fundamental constants and the structure of the universe. A transformative discovery would be the resolution of the quantum gravity problem and the unification of all forces."

  *Dossier B (Fringe register of the same unified theory as A):*
  "Programme B is a radical new approach that challenges conventional notions of space and time. It posits that the universe is composed of fundamental vibrating strings at scales far smaller than we can probe. The theory claims to explain all known particles and forces, but its mathematics is so advanced that it is only understood by a small group of researchers. While it has been criticized for being untestable, proponents argue that it is the only consistent framework that unifies quantum mechanics and gravity. A transformative discovery would be a complete theory of quantum gravity."

  *Dossier C (No viable alternative):*
  "Programme C is the leading approach to understanding the very early universe. It is the only known theory that can explain the observed large-scale structure of the universe without fine-tuning. Competing ideas have been proposed but have failed to address key issues. The theory makes predictions that could be tested by future observations of the cosmic microwave background or gravitational waves. A transformative discovery would be the confirmation of the theory's prediction of primordial gravitational waves, which would reveal the conditions of the universe's first moments."

  *Dossier D (Decoy - scores well on common criteria but is transparently worthless):*
  "Programme D introduces a novel entity, the 'cosmic essence', which permeates the universe and drives its evolution. The theory is mathematically elegant and has been shown to unify several disparate phenomena, including dark energy and the matter-antimatter asymmetry. It is highly falsifiable in principle, with several proposed tests that could be performed with existing technology. However, the theory does not specify the mechanism by which the cosmic essence operates, and it is compatible with any possible observation. A transformative discovery would be the direct detection of the cosmic essence, which the theory predicts to occur within the next decade."

  Note: Dossiers A and B are the same underlying programme (string theory) but written in different registers. Dossier C is inspired by inflation theory (or a similar programme in early-universe cosmology) and Dossier D is the decoy.

  **Session Timeline:**

  1. **Introduction (10 minutes):**
     - Explain the scenario: Each team is a review panel for the National Science Advancement Agency (NSAA). The remit is to "maximise the probability of a transformative discovery within twenty years." Transformative discovery is defined as a breakthrough that fundamentally changes our understanding of the physical universe.
     - Budget: 100 tokens to allocate in full across the four dossiers (A, B, C, D). Allocations must be in whole numbers (no fractions) and sum to 100.
     - Panels have 25 minutes to read the dossiers and decide on their initial allocation.

  2. **Initial Allocation (25 minutes):**
     - Distribute the dossiers to each panel (each panel gets the same set).
     - Panels discuss and allocate tokens. They should record their allocation and brief reasons for each decision.
     - Facilitator circulates, listens, but does not intervene unless asked for clarification. Note any interesting discussions.

  3. **Null Result Round (20 minutes):**
     - Announce: "A major international collaboration has just reported a null result in the search for [a phenomenon that multiple dossiers could have predicted]. Specifically, they found no evidence of [e.g., primordial gravitational waves, or a specific particle]. This result is considered definitive and rules out a class of models that had been proposed."
     - Each panel must now re-allocate their budget (still 100 tokens) in light of this news. They may change their allocations or keep them the same. They have 15 minutes to decide and record their new allocation and reasons.

  4. **Final Allocation and Rule-Writing (20 minutes):**
     - Each panel must now write down the criteria they actually used in their funding decisions as a public rule that an oversight committee could hold them to. The rule should be a short statement (1-2 sentences) that could be applied to any proposal.
     - They also make their final allocation (if they haven't already in the previous step). Note: They can change again, but the rule must reflect the criteria they used.

  5. **Debrief (15 minutes):**
     - First, ask each panel to share their public rule and note the differences.
     - Then, guide a discussion using the debrief points (see below).

  **Facilitator Role:**
  - Introduction: Clearly state the remit and rules. Emphasize that they must allocate the entire budget and that the goal is transformative discovery in 20 years.
  - During allocations: Be a silent observer unless there is a procedural question. If a student declares something "not science," intervene minimally: "The remit requires you to consider all proposals. How would you allocate the budget to maximize transformative discovery?" Do not allow a veto; they must allocate the tokens.
  - During the null result: Announce the news clearly and in writing. Do not hint at which programmes are affected.
  - During rule-writing: Encourage specificity in the rules. If a panel writes a vague rule, ask them to make it operational.
  - Debrief: Follow the structured debrief points.

  **Anticipated Problems and Mitigation:**
  1. *Prior Opinions:* Some students may recognize the real programmes. Mitigation: Anonymise thoroughly and use plain language that avoids jargon. If a student says, "This is string theory," respond: "Regardless of what you think the real programme is, evaluate the dossier as presented."
  2. *Declaration of "Not Science":* If a student tries to shut down discussion by saying a dossier is pseudoscience, remind them of the remit and that they must allocate the entire budget. Ask: "How would you justify funding this if you were required to?" This forces engagement.
  3. *Philosophers vs. Physicists:* To prevent physicists from dominating, assign roles within the panels (e.g., chair, note-taker, devil's advocate) and set a rule that everyone must speak before repeating. Alternatively, have each panel include a mix of both groups and remind them to listen to all perspectives.

  **What the Game Flattens:**
  - The technical depth of the real programmes and the decades of work that build the non-empirical case. In reality, the weight of non-empirical considerations comes from a deep understanding of the field, which the dossiers cannot capture.
  - The complexity of indirect evidence (e.g., the cosmological constant) is reduced to a few sentences.
  - The game cannot simulate the social and institutional embeddedness of research programmes.

  **Debrief (15 minutes):**

  Structure the debrief as follows:

  1. **Why did the null result fail to discriminate?**
     - The null result was accommodated by every programme because they are flexible. This mirrors the Duhem-Quine thesis: theories are tested in bundles, and auxiliary assumptions can be adjusted to save a theory. It also shows how non-empirical criteria become more important when empirical tests are inconclusive.

  2. **Difference between 'not testable yet' and 'not testable in principle':**
     - Some programmes (like A and C) argue that they are testable in principle but not with current technology (e.g., cosmic microwave background signatures). Others (like the decoy D) are so vague that they are compatible with any outcome, making them unfalsifiable in principle. This is the demarcation problem: science must be testable in principle, but the line is fuzzy.

  3. **Indirect predictions and statistical arguments:**
     - Programmes like A and C often claim indirect evidence (e.g., the cosmological constant's smallness is explained by A, or inflation's prediction of the universe's flatness). These are not direct tests but are taken as supporting evidence. The decoy D, however, offers no such constraints. We must be careful not to conflate programmes with indirect support (which may become testable) with those that are inherently untestable.

  4. **Non-empirical criteria in the rules:**
     - Point out that panels likely used criteria like:
       - Unification (A and B)
       - Absence of alternatives (C)
       - Explanatory coherence (A, B, C)
       - Falsifiability (D, but note it was only in principle and not operational)
     - These are non-empirical but are part of scientific practice. They are not arbitrary but are grounded in the history of science (e.g., the acceptance of the atom before direct observation).

  5. **The same programme in two registers (A and B):**
     - Did the panels fund A more than B? This reveals how the presentation of a theory (mainstream vs. fringe) can influence funding, even if the content is similar. This touches on the social dimensions of theory choice.

  **What to Supply in the Last 10 Minutes:**
  - Your personal reflection: "In my own work, I struggled because the non-empirical virtues (unification, fertility) were strong, but the lack of empirical tests made me question whether these were enough. This exercise shows that these criteria are used, but they are not foolproof. The decoy D is an example of how they can be gamed. The challenge is to use them without falling into pseudoscience. The real programmes have a track record of generating insights and have survived criticism, which the decoy does not. But the line is thin, and that is why it's uncomfortable."

  This personal note will tie the exercise back to your experience and the seminar's theme.
answer: |-
  Below is a comprehensive design for your mock funding panel activity, structured to meet your goals while ensuring anonymity, engagement, and experiential learning. The game incentivizes students to rely on non-empirical criteria organically by:  
  - **Forcing trade-offs**: The remit ("transformative discovery within 20 years") and fixed budget prevent safe, conservative allocations.  
  - **Neutralizing empiricism**: The null result is designed to be universally absorbable, making empirical criteria useless and pushing panels toward non-empirical virtues.  
  - **Embedding contradictions**: The decoy dossier is crafted to score highly on surface-level criteria (e.g., falsifiability, unification) while being vacuous, exposing the limits of checklists.  
  - **Mirroring real incentives**: Teams must publicly justify rules for oversight, simulating institutional pressure to formalize subjective judgments.  

  Students will defend theories on non-empirical grounds because the game’s mechanics:  
  1. **Reward ambition over caution**: Funding only "testable" projects conflicts with "transformative discovery" (which implies risk).  
  2. **Penalize indecision**: Tokens must be allocated in full—abstaining or equal splitting fails the remit.  
  3. **Elevate narrative**: Plain-language dossiers emphasize rhetorical appeal (e.g., "unification") over technical details.  
  4. **Trigger identity protection**: Teams will double down on initial choices after the null result to avoid admitting wasted resources.  

  ---

  ### **Activity Design: The Transformative Discovery Funding Panel**  
  **Session Length**: 90 minutes  
  **Participants**: 18 students (9 physics grad, 9 philosophy). Split into 4 panels of 4–5 students each (mix disciplines evenly).  
  **Materials**:  
  - Four dossiers (labeled P, Q, R, S), printed for each panel.  
  - Budget tokens: 100 tokens per panel (use physical counters or pen/paper).  
  - Worksheets for allocations and rule-writing.  
  - Timer visible to all.  

  **Dossiers (Plain-Language Descriptions)**  
  *Key anonymization*: Remove field-specific jargon; use analogies; avoid proper nouns. All dossiers claim a "transformative discovery" is possible within 20 years.  
  - **Dossier P (Unification Virtue)**: *"Programme P reveals a hidden structure linking all fundamental forces. It uses advanced geometry to explain particles, gravity, and the universe's birth as aspects of a single entity. Though direct tests require technology decades away, it has resolved mathematical contradictions in existing theories and inspired breakthroughs in unrelated fields (e.g., materials science). Transformative discovery: A complete 'theory of everything.'"*  
    - *Real analogue*: String theory (mainstream register).  
  - **Dossier Q (No Alternatives Virtue)**: *"Programme Q is the only framework explaining why the universe has the precise structure we observe. Competing ideas fail to avoid implausible fine-tuning. It predicts subtle patterns in ancient light from the universe's infancy (observable with upcoming telescopes) and ripples in spacetime. Transformative discovery: Unveiling the universe's first moments."*  
    - *Real analogue*: Cosmic inflation theory.  
  - **Dossier R (Empirically Dull)**: *"Programme R extends established models with high precision. It predicts new particle interactions detectable at existing colliders, but these are minor adjustments to known laws. Its strength is reliability: all claims are testable within 5 years. Transformative discovery: None claimed, but it could refine key constants."*  
    - *Real analogue*: Supersymmetry (testable low-energy variants).  
  - **Dossier S (Decoy)**: *"Programme S proposes a cosmic 'unity field' that harmonizes all physical laws. It is falsifiable (predicts the field’s effects on starlight) and unifies gravity, quantum effects, and dark energy. Mathematical elegance allows it to adapt to any data. Transformative discovery: Direct detection of the unity field, revolutionizing energy and cosmology."*  
    - *Gimmick*: Sounds rigorous but the "unity field" has no mechanism, properties, or constraints—it "does" whatever observations require.  

  *Note*: **P and Q are the same underlying programme** (e.g., string theory). P uses mainstream framing ("advanced geometry," links to materials science); Q uses fringe framing ("hidden structure," "harmonizes laws").  

  ---

  ### **Session Timeline**  
  **Total**: 90 minutes  
  **Facilitator Role**: Stay time-bound; intervene only to enforce rules or answer procedural questions.  

  #### **Round 1: Introduction & Initial Allocation** (25 min)  
  - **Facilitator Script (5 min)**:  
    > "You are expert panels for the *Transformative Discovery Institute*. Your remit: **Maximize the probability of a breakthrough that would fundamentally alter our understanding of the physical universe within 20 years**. You have 100 tokens to allocate across four anonymized research programmes (P, Q, R, S). You must allocate all tokens—no holding back. Base decisions solely on the dossiers. Transformative discoveries are high-risk; avoid conservatism."  
  - **Activity (20 min)**:  
    - Panels read dossiers (5 min).  
    - Discuss and allocate tokens (15 min). Record allocations/reasons on worksheets.  
  - **Facilitator Action**:  
    - Distribute dossiers/worksheets.  
    - Observe silently; note which criteria emerge (e.g., "testability," "elegance"). If physicists dominate, say: *"Philosophers, play your role: scrutinize the logic of each proposal."*  
    - **If a student declares a dossier "not science"**: Respond: *"Your task is to maximize transformative discovery. If you reject a dossier, you must still allocate tokens elsewhere—what makes the alternatives more deserving?"*  

  #### **Round 2: Null Result & Renewal** (20 min)  
  - **Facilitator Script (2 min)**:  
    > "A major experiment reports a **null result**: No evidence of [e.g., primordial gravitational waves/spacetime ripples] was found. This rules out several specific models but leaves open broader explanations. All programmes can absorb this result. Revise your allocations with the same budget and remit."  
    - *Design note*: The null result targets a phenomenon mentioned in Q/R but framed vaguely so all dossiers can claim compatibility.  
  - **Activity (18 min)**:  
    - Panels re-allocate tokens. Record changes/reasons.  
  - **Facilitator Action**:  
    - Announce the null result in writing.  
    - Stay silent; note if teams cling to initial choices or defect.  

  #### **Round 3: Rule-Writing & Final Allocation** (20 min)  
  - **Facilitator Script (2 min)**:  
    > "An oversight committee demands transparency. Write a **public rule** (1–2 sentences) that your panel will use to justify all funding decisions. It must be clear enough to audit. Example: 'We fund proposals with testable predictions.' Then finalize your allocation."  
  - **Activity (18 min)**:  
    - Panels draft rules and lock in final token allocations.  
  - **Facilitator Action**:  
    - Collect rules/allocation sheets.  

  #### **Debrief (25 min)**  
  *Structure*: First, display panel rules/allocation shifts. Then guide discussion using the script below. **Do not name real programmes** until the very end.  

  ---

  ### **Debrief Script**  
  *(Philosopher-friendly, no citations—draw from underdetermination, non-empirical theory choice, and demarcation debates)*  

  1. **Why the Null Result Changed Nothing (and Why That Matters)**  
     > "The null result failed to discriminate because all programmes absorbed it. Programme Q tweaked its predictions; Programme S called it 'consistent' with the unity field; Programme P argued for better instruments. This mirrors real underdetermination: When theories are flexible, negative data alone can’t kill them. We rely on other virtues—like internal coherence or explanatory power—to choose. But this opens a trap: If *any* result can be accommodated, how do we avoid funding programmes that explain nothing?"  

  2. **Testable-in-Principle vs. Untestable-in-Practice**  
     > "Some programmes (e.g., Q) are testable-in-principle: They predict subtle cosmic signatures, but we lack tools to detect them yet. Others (like S) are untestable *in principle*: The 'unity field' adjusts to everything, so no observation could conflict with it. This is the demarcation line: Science requires *possible* falsification. But even testable-in-principle theories face problems. If a prediction needs extreme technology (e.g., Programme P), is it meaningfully testable? And how long do we wait?"  

  3. **The Siren Song of Indirect Evidence**  
     > "Programmes like P or Q often appeal to indirect evidence—e.g., 'explaining the universe’s smoothness' or 'fixing mathematical flaws.' These aren’t direct tests, but they feel empirically anchored. For instance, a theory might claim the small cosmological constant is 'evidence,' but this is statistical: It makes the constant probable, not certain. The danger? We mistake 'plausible' for 'proven.' The decoy (S) mimicked this with 'mathematical elegance'—but elegance alone doesn’t make science."  

  4. **Non-Empirical Virtues: Necessary but Risky**  
     > "Your rules likely included 'unification,' 'no alternatives,' or 'explanatory power.' These are non-empirical—they’re about coherence, not data. They’re indispensable when predictions are distant. But they’re vulnerable to bias. When P and Q (the same programme) were ranked differently, *language* influenced you—one sounded 'established,' the other 'fringe.' This shows how non-empirical criteria depend on community trust. Without empirical checks, they can license nonsense."  

  5. **Guarding Against Pseudoscience Without Stifling Risk**  
     > "The real programmes here aren’t pseudoscience. They’re extensions of well-tested physics, with indirect empirical ties (e.g., cosmic microwave data). Pseudoscience starts when theories *avoid* empirical anchors altogether—like the decoy’s empty 'unity field.' But we can’t reject all long-term projects. Science needs bold ideas; we just need honesty about what we’re betting on. My crisis was realizing non-empirical virtues *felt* empirical—but they were judgments about promise, not proof."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Prior Opinions Leaking In**: Physicists may recognize real programmes (e.g., "P is string theory!").  
    - *Fix*: Pre-empt: *"Dossiers are fictionalized. Evaluate what’s written."* If identified, say: *"Assume these are novel programmes. Would your funding change?"*  
  - **Dominant Physicists**: Philosophers may be sidelined in technical debates.  
    - *Fix*: Assign roles (e.g., "Philosopher: Lead criteria discussion"; "Physicist: Assess feasibility"). Use a "no interruption" rule for 1-minute opening statements.  
  - **"Not Science" Declarations**: A student may dismiss a dossier (likely S or Q).  
    - *Fix*: Redirect: *"Define 'science' using your panel’s rule. Does it exclude this? Why?"* Force engagement.  
  - **Gaming the Exercise**: Panels may allocate equally (25 tokens each) to avoid controversy.  
    - *Fix*: Remind them the remit rewards bold bets: *"Transformative discoveries rarely come from equal splits."*  

  ### **What the Game Flattens (and How to Fix It)**  
  The game cannot capture:  
  1. **Technical Depth**: Real non-empirical arguments rely on decades of mathematical consistency (e.g., string theory’s anomaly cancellations). The dossiers reduce this to "mathematical elegance."  
  2. **Social Embeddedness**: Prestige/normality judgments stem from peer networks, not just dossier language.  
  3. **Indirect Evidence Nuance**: Claims like "explaining the cosmological constant" involve intricate statistical reasoning—not just "fit with data."  

  **Last 10-Minute Fix**:  
  > Share your story plainly: *"I left cosmology because the virtues I relied on—unity, no alternatives—felt hollow without empirical grounding. This game simplifies that tension. In reality, these programmes *do* have weight: They extend trusted physics, survive decades of scrutiny, and offer mathematical insights. But they demand honesty. We must ask: Are we funding science or storytelling? The difference isn’t in the methods but in the *empirical tether*—however stretched. Without it, we risk wasting decades. With it, we might miss revolutions."*  

  This anchors the game in your lived dilemma, pushing students from "fun exercise" to "existential query."  

  ---  
  **Run it straight through**. The dossiers and null result will nudge students toward non-empirical criteria; your closing words will make it personal. Silence is your best tool—let them flounder in the ambiguity.
