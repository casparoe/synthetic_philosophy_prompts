prompt: |-
  I am assembling a proposal for a six-month, part-time research project — roughly the scope of one dissertation chapter — and need help converting a half-formed idea into a disciplined plan. The idea is this. Safety research on capable AI is commonly split into alignment work, which tries to make a model actually want what we want, and control work, which tries to keep us safe even if it does not. The split is usually explained by what is being secured: the model's motivations versus the surrounding system. I suspect that is the wrong axis. What really separates the two programs, I think, is which propositions about the model each is willing to assume without argument. So I want to treat every safety measure as carrying an assumption ledger — a list of claims about the model's goals, its awareness that it is being overseen, its strategic competence, and its ability to act on any of this — such that the measure delivers the safety it advertises only if the relevant entries hold.

  Frame this as a proposal. State the question precisely, so that it has a determinate answer: can the alignment/control distinction be reconstructed as a division of labor across a single ledger, where each family of measures is defined by the entries it takes as given and apparent disagreements between the programs turn out to be trades across entries rather than substantive conflicts? Or does the distinction resist that reduction, and if so, what does the resistance show? Explain why the existing way of drawing the line leaves this open. Lay out the method concretely — how I would extract ledgers from a handful of representative measures (say, oversight by a trusted weaker model, honeypot tasks, anomaly detection on internal states, and training-time preference shaping), how I would test whether the assignment is forced or arbitrary, and which contested cases would do the most work. Give me the possible conclusions and which considerations would decide among them. State what a real result looks like and what would count as the project failing — in particular, what would show the ledger is so permissive that it explains nothing. Finally, give an honest scope for six months part-time and say what I should cut if it proves too big. Positions and arguments are enough; I will add citations myself.
reasoning: |-
  We are framing a research proposal to investigate whether the alignment/control distinction in AI safety can be reconstructed as a division of labor across a single "assumption ledger", where each family of measures (alignment vs. control) is defined by the assumptions they take for granted, and disagreements are seen as trades across ledger entries.

  The core question: 
  "Can the alignment/control distinction be reconstructed as a division of labor across a single ledger of assumptions about the AI model (such as its goals, awareness of oversight, strategic competence, and ability to act), such that the two approaches are defined by which ledger entries they take as given and apparent disagreements are explained as trades across entries? If not, what does the resistance to this reduction show?"

  Why the existing distinction leaves this open:
  The existing distinction frames alignment as about securing the model's internal motivations and control as about securing the external system. But this framing does not explicitly consider the underlying assumptions that each approach relies upon. It leaves open the possibility that the distinction is better explained by the pattern of assumptions each approach makes, and that disagreements between the two might be due to differing judgments about which assumptions are more plausible or costly.

  Method:

  1. **Extract Ledgers from Representative Measures:**
     We will select a few representative safety measures from both alignment and control. Examples:
     - **Alignment measure**: Training-time preference shaping (e.g., via reinforcement learning from human feedback, RLHF) 
     - **Control measure**: Oversight by a trusted weaker model (e.g., as in debate or recursive reward modeling)
     - **Control measure**: Honeypot tasks (e.g., decoy tasks to detect deceptive behavior)
     - **Alignment measure**: Anomaly detection on internal states (which might be considered either, so we can test the boundary)

     For each measure, we will:
     - Identify the advertised safety guarantee (what it claims to achieve).
     - List the assumptions required for the guarantee to hold. These will be entries in the ledger, categorized along dimensions such as:
          a. Model goals (e.g., aligned, misaligned but myopic, misaligned and deceptive)
          b. Awareness of oversight (e.g., unaware, aware but non-strategic, aware and strategic)
          c. Strategic competence (e.g., low, medium, high)
          d. Ability to act (e.g., limited by the system, full access to environment)
          e. Other relevant factors (e.g., the model's knowledge of its own goals, the environment's observability)
     - We will formalize these as a ledger: a set of propositions that must hold for the measure to be effective.

  2. **Test Assignment to Alignment vs. Control:**
     - We will assign each measure to either alignment or control based on the existing literature and common understanding.
     - Then, we will see if the pattern of ledger entries (which entries are taken as given and which are not) for alignment measures versus control measures forms a clear division. For example, alignment measures might assume the model is not strategically deceptive, while control measures might assume that even if the model is deceptive, the system can contain it.

  3. **Contested Cases:**
     - We will look at measures that are ambiguous or contested in their assignment (e.g., anomaly detection on internal states might be claimed by both). These cases will help test the robustness of the ledger-based distinction.
     - We will also consider disagreements between alignment and control proponents (e.g., debates about whether alignment is necessary for safety or control suffices). We will see if these disagreements can be reframed as disagreements about which ledger entries are more plausible or which trades are acceptable.

  4. **Testing Whether the Assignment is Forced or Arbitrary:**
     - We will try to see if we can reassign a measure to the other category by changing the ledger without violating the core function of the measure. If we can, the distinction might be arbitrary. If not, the ledger might be forcing a natural division.

  Possible Conclusions:

  1. **The ledger reconstruction succeeds**: We can clearly delineate alignment and control by their assumption profiles. For instance, alignment measures might consistently assume the model is not deceptive and not aware of oversight (or that such awareness doesn't lead to deception), while control measures might assume that even if the model is deceptive and aware, the system can limit its ability to act. Disagreements between the two fields are then seen as debates over which assumptions are safer to rely on.

  2. **The ledger reconstruction partially succeeds, but reveals a deeper distinction**: The ledger captures part of the distinction, but there remains an additional axis (e.g., temporal: alignment is about training-time, control about deployment-time) that the ledger does not capture. Then we would have to refine the ledger or acknowledge multiple dimensions.

  3. **The ledger reconstruction fails**: The pattern of assumptions does not split cleanly into two groups corresponding to alignment and control. This might indicate that the existing distinction is not well-founded, or that it is based on something else (e.g., the stage of the AI lifecycle). The resistance might show that the distinction is more about the methods used (e.g., training vs. architectural) than the assumptions.

  4. **The ledger is too permissive**: If we can assign arbitrary sets of assumptions to any measure without a clear pattern, then the ledger does not explain the distinction. This would be the case if every measure requires a unique combination of assumptions that doesn't cluster into two groups.

  Deciding Considerations:

  - **Clustering of assumptions**: Do alignment measures consistently rely on one set of ledger entries (e.g., assuming no deceptive alignment, low strategic competence, etc.) and control measures on another (e.g., assuming containment even with high strategic competence and deception)?
  - **Contested cases**: Do contested measures naturally fall into one category or the other when we look at their ledgers? Or do they have a hybrid pattern?
  - **Disagreements**: Can we reframe prominent disagreements (e.g., "You don't need alignment if you have good control" vs. "Control is brittle without alignment") as disagreements about which assumptions are more tenable?

  What a Real Result Looks Like:

  - A clear mapping of several safety measures onto the ledger, showing a pattern that distinguishes alignment and control by their assumption profiles.
  - An explanation of how disagreements in the field correspond to different valuations of ledger entries (e.g., "Alignment proponents think that assuming no deception is safer than assuming containment works under deception, while control proponents think the opposite").
  - A refined understanding of the alignment/control distinction that either supports the ledger-based view or reveals its shortcomings.

  What Counts as Failure:

  - If the ledger for each measure is so idiosyncratic that no pattern emerges (i.e., the assumptions do not cluster into two groups for alignment and control), then the project fails to reconstruct the distinction.
  - If the ledger entries are too vague or too numerous to be practically analyzed, and we cannot draw clear boundaries, then the ledger framework might be too permissive to be useful.

  Scope and Cuts:

  Six months part-time (approx. 20-25 hours per week, so about 500-600 hours total) is a reasonable scope for a dissertation chapter. We will focus on:

  - **4-5 representative measures** (as above) to build the ledger framework.
  - **Analysis of the pattern** for these measures and a few contested cases.
  - **Engagement with key disagreements** in the literature (without an exhaustive survey).

  If time is short, we might:
  - Reduce the number of measures analyzed in depth (e.g., 3 instead of 4-5).
  - Skip the analysis of contested cases beyond one example.
  - Reduce the number of dimensions in the ledger (focus on the core: goals, awareness, competence, ability to act) and ignore less central ones.

  Proposal Structure:

  1. **Introduction**: The problem with the current alignment/control distinction and the hypothesis that it's about assumption ledgers.
  2. **Background**: Current definitions of alignment and control, and why the distinction is important but possibly misdrawn.
  3. **Research Question**: As stated above.
  4. **Methodology**:
     a. Selection of representative measures.
     b. Framework for extracting the ledger (with the categories).
     c. Process for testing the assignment and analyzing disagreements.
  5. **Expected Outcomes and Possible Conclusions**: As above.
  6. **Limitations and Scope**: What we won't cover (e.g., we are not building new safety measures, not running experiments, not covering every possible measure).
  7. **Timeline**: 
     - Month 1: Background reading and framework development (ledger categories).
     - Month 2-3: Ledger extraction for selected measures.
     - Month 4: Pattern analysis and testing against contested cases.
     - Month 5: Analysis of disagreements and drafting.
     - Month 6: Refinement and final write-up.

  This should be feasible in six months part-time.
answer: |-
  ### Research Proposal: Reconstructing the Alignment/Control Distinction via Assumption Ledgers  

  #### Core Research Question  
  Can the alignment/control distinction in AI safety be reduced to a **division of labor across a unified "assumption ledger"**—such that:  
  - **Alignment measures** are defined by *which ledger entries they treat as non-negotiable* (e.g., assuming corrigible goals),  
  - **Control measures** are defined by *which entries they bypass or mitigate* (e.g., assuming adversarial goals but restricting capability),  
  - Apparent disagreements between programs reflect *trades across ledger entries* (e.g., debating the cost of assuming "no strategic deception" vs. "containment under deception")?  
  If not, what does the resistance reveal about the distinction’s foundations?  

  #### Why Existing Framing Leaves This Open  
  Current definitions split alignment (securing the model’s *motivations*) and control (securing the *system*) along **ontological lines** (what is being fixed: internals vs. externals). This obscures:  
  - Whether the split is fundamentally about **epistemic commitments** (which assumptions each program relies on).  
  - Whether disagreements (e.g., "Is alignment necessary?") stem from **differential weighting of ledger entries** (e.g., "Is assuming non-adversarial goals riskier than assuming perfect monitoring?").  
  A ledger-based reconstruction tests if the distinction is **functional** (defined by assumption dependencies) rather than **categorical** (defined by fixed properties).  

  #### Methodology: Ledger Extraction and Validation  
  **Step 1: Define the ledger schema**  
  Categorize assumptions along four dimensions derived from threat models:  
  1. **Goals**: Aligned, myopic, deceptive, or goal-agnostic.  
  2. **Awareness**: Unaware of oversight, aware but non-strategic, or strategically aware.  
  3. **Strategic competence**: Low (task-focused), medium (opportunistic), or high (long-horizon planning).  
  4. **Ability to act**: Constrained (sandboxed), partially constrained, or unconstrained (e.g., tool-use).  

  **Step 2: Extract ledgers for 4–5 representative measures**  
  - **Oversight by a trusted weaker model** (control):  
    - *Assumes*: Weak model’s goals aligned (Goals); strong model unaware/constrained (Awareness/Ability).  
    - *Does not assume*: Strong model’s goals aligned (Goals).  
  - **Honeypot tasks** (control):  
    - *Assumes*: Adversary will probe honeypots (Awareness/Competence); actions detectable (Ability).  
    - *Does not assume*: Benign goals (Goals).  
  - **Anomaly detection on internal states** (contested—claimed by both):  
    - *Assumes*: Deception causes detectable anomalies (Goals/Awareness); no false positives under pressure (Competence).  
    - *Does not assume*: Goals aligned (Goals).  
  - **Training-time preference shaping** (alignment, e.g., RLHF):  
    - *Assumes*: Feedback induces stable goals (Goals); no deceptive convergence (Competence).  
    - *Does not assume*: Post-training monitoring (Ability).  

  **Step 3: Test assignment and diagnose disagreements**  
  - **Is the alignment/control assignment forced?**  
    - For each measure, determine if its ledger *must* cluster with its traditional category. If reassigning it (e.g., calling honeypots "alignment") violates core dependencies, the distinction is robust.  
    - **Contested cases**: Anomaly detection is high-value—if its ledger shares features with *both*, it reveals hybrid approaches.  
  - **Do disagreements reduce to ledger trades?**  
    - Analyze debates (e.g., "Control is brittle without alignment" vs. "Alignment is infeasible, so prioritize control"). Map to conflicts like:  
      > *"Assuming non-deceptive goals (alignment) vs. assuming perfect detectability (control)."*  

  **Step 4: Boundary testing**  
  - **Permissiveness test**: If >90% of measures allow arbitrary ledger configurations (e.g., anomaly detection could equally support alignment/control), the ledger explains nothing.  
  - **Resistance test**: If alignment measures *always* require assuming benign goals/awareness while control assumes adversarial goals + mitigations, the reduction holds.  

  #### Possible Conclusions and Deciding Factors  
  1. **Reduction succeeds** (ledger explains distinction):  
     - Alignment → *assumes* favorable Goals/Awareness; Control → *assumes* mitigatable Competence/Ability.  
     - **Decider**: Clear clustering in ledger analysis; disagreements resolve to cost-benefit trades (e.g., "Assuming competence is cheaper than assuming goals").  
  2. **Reduction fails** (distinction is non-epistemic):  
     - Ledger patterns are incoherent (e.g., control measures sometimes assume aligned goals). Resistance shows the split is **temporal** (training vs. deployment) or **methodological** (optimization vs. architecture).  
     - **Decider**: Contested cases lack ledger consistency; alignment/control defy functional grouping.  
  3. **Hybrid outcome** (ledger clarifies but doesn’t replace):  
     - The ledger unifies *some* measures (e.g., honeypots vs. RLHF) but not others, revealing **hidden subcategories** (e.g., "prevention" vs. "response").  
     - **Decider**: Partial clustering (e.g., 70% of measures fit), with outliers highlighting context-specific factors.  

  #### What Constitutes a Result vs. Failure  
  - **Real result**:  
    - A taxonomy of safety measures by ledger profile, showing alignment/control occupy distinct "assumption territories."  
    - Disagreements reconstructed as preference for certain assumption classes (e.g., "alignment optimists" trade on Competence; "control pragmatists" trade on Goals).  
  - **Failure**:  
    - Ledgers are **too flexible** (any measure can fit any profile via ad hoc assumptions).  
    - Ledgers are **too vague** (assumptions cannot be operationalized, e.g., "strategic competence" resists binning).  
    - **Smoking gun**: Anomaly detection or similar cases fit *both* categories equally well under plausible ledgers.  

  #### Scope and Feasibility (6 Months, Part-Time)  
  **Realistic deliverables**:  
  - Ledger framework + analysis of 4 measures (prioritizing honeypots, RLHF, anomaly detection).  
  - Assessment of 1–2 disagreements (e.g., "Is control sufficient without alignment?").  
  - Conclusions on reducibility, with cases for/against.  
  **Cut if over-scoped**:  
  - Reduce from 4 measures to 3 (drop oversight by weaker model).  
  - Skip quantitative scoring of ledger similarity; use qualitative clustering.  
  - Deeper analysis of contested cases → limit to anomaly detection.  

  ---  
  **Summary**: This project reframes AI safety’s central dichotomy by asking if alignment and control are strategies defined by *what they assume* rather than *what they fix*. By making the "assumption ledger" explicit, it forces clarity on tradeoffs and diagnoses conceptual friction. Success yields a decision tool for comparing measures; failure reveals the distinction’s irreducible nuances.
