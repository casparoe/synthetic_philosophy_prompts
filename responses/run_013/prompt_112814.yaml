answer: |-
  ## Award Address: The Orchard and the Choice

  Good morning. It is my honor, on behalf of this foundation, to present this year’s award. For sixty years, we have stood alongside communities seeking to remember. We’ve helped place plaques that catch the light, restored halls where history echoes, tended gardens where grief meets growth, and raised stones that speak of loss endured – a shipwreck, a mill fire, countless quiet tragedies and public reckonings. Our work, we believed, was in the act of marking: making the invisible past visible, tangible, *present*. It has been a calling rooted in respect.

  This year, however, we honor a different kind of remembrance. We honor [Village Name] for taking down their monument to a nineteenth-century massacre. And crucially, we honor them not for replacing it with a new, corrected monument, but for planting an orchard and letting the ground return to something ordinary. To some here, this might feel like a departure from our sixty-year path. To others, it might feel like a long-awaited correction. I stand before you today – families connected to that old monument, local leaders, students, historians, friends – to tell you why this choice belongs firmly *within* the story of our foundation’s work, not against it. Why this orchard is itself a form of profound remembrance.

  This requires navigating difficult terrain. We all know the arguments: the sacred duty to remember versus the human need to move forward; the fear of erasure versus the weight of a past that can suffocate the present. But today, I ask you to consider a single, vital distinction. It’s a line that cuts through the familiar debate and, I believe, reveals the deeper truth about how communities heal. It’s the difference between *forgetting that can be reversed* and *forgetting that cannot*.

  Think for a moment. Sealed records, carefully stored, with the date of closure written clearly upon them. A monument respectfully crated and placed in a warehouse, preserved but set aside. An anniversary, heavy with meaning, deliberately allowed to pass unremarked upon, just this once. A name omitted from a new plaque, knowing the old plaque listing it remains nearby. These are acts of forgetting, yes. But they are *reversible* forgettings. A community can choose them freely, almost lightly, as a kindness to itself. They are a pause, a breath, a form of rest. The knowledge, the name, the stone – they remain accessible. The door is not locked; it is merely closed for a time. This kind of forgetting isn't obliteration; it’s stewardship. It trusts that the future may need to remember differently, and leaves the path open.

  Then there is the other kind. Records deliberately burned to ash. A monument not stored, but ground to dust, scattered to the wind. A name meticulously hunted down and struck from every register, every official list, every trace. *These* forgettings are irreversible. Once done, they cannot be undone. The knowledge is gone, utterly. The case for this kind of forgetting is infinitely harder, heavier, fraught with peril. Even when the thing remembered is monstrous, the act of making it permanently unknowable carries its own immense weight. It is a final severing, a point of no return.

  Our foundation, for sixty years, has primarily funded acts of *remembering*. But look closer. What we have *truly* funded is the *community's choice*. We have helped communities decide *how* they wish to carry their past. Sometimes that meant anchoring it in stone – a fixed point, a warning, a tribute. But anchoring is also a choice about how to relate to history. It says, "This must be seen, always."

  What [Village Name] has done is make a different choice, rooted in that crucial distinction. They took down a monument that told a particular story, a story that perhaps caused more pain than reflection, more division than understanding. But they did not commit an irreversible act. They did not destroy it irrecoverably – we understand it is preserved elsewhere. They chose a *reversible* forgetting for the monument itself. They turned away from stone, not towards oblivion, but towards life. They planted an orchard.

  An orchard is not nothing. It is not erasure. It is transformation. It is a living space. It requires tending. It grows, it changes with the seasons, it offers sustenance. It becomes part of the daily life of the community in a way a monument rarely can. It allows the ground, once scarred by a specific act of violence remembered in a specific, perhaps harmful way, to breathe. To become ordinary again, but an ordinary that now holds within it a conscious decision. The massacre isn't forgotten; it is remembered in the *act* of letting the land heal, in the choice *not* to mark it in the old way. This is remembrance through transformation, through a quiet, living repurposing. It is a reversible act – the orchard could be moved, the monument *could* be brought back – but it embodies a profound hope that it won't *need* to be. The hope is that the life growing there, and the conscious choice that seeded it, becomes the truer memorial.

  Some will argue, powerfully, that even reversible forgetting is dangerous. Some will argue, equally powerfully, that certain memories *themselves* are a disease. That a community can become trapped, held hostage by an injury it has agreed never to stop rehearsing. That the constant pressure of that stone, that name, that anniversary, prevents healing. That sometimes, even irreversible forgetting – the burning of the records, the grinding of the stone – is the only mercy, the only way to break a cycle of pain. This is a serious claim. It demands respect.

  My distinction does not dodge this. It *confronts* it. Precisely because irreversible forgetting *is* so final, so absolute, the case for it must be overwhelming. It must be a last resort, undertaken only when the memory itself is an active, inescapable poison, and when every other path – including reversible rest – has failed. It is the surgical removal of a gangrenous limb, not the setting aside of a heavy weight for a time. The orchard in [Village Name] is not that drastic surgery. It is the careful setting down of the weight. It is trust that the land, and the people, might bear the memory differently now. It’s a choice for a different kind of remembrance, one that allows for growth alongside grief.

  For six decades, our foundation has not simply been building memorials. We have been enabling communities to exercise their agency over *how* they remember. We have helped them choose the stones they need to anchor them. This year, we honor a community that chose, with equal courage and profound thoughtfulness, to set down an anchor that had become a burden, and to plant instead. They chose a reversible act of change, creating space for life to grow on ground heavy with history. They have shown us that remembrance isn't only about what we build *up*, but sometimes about what we carefully, reversibly, set *aside*, making room for a living, breathing future that still knows its past, but isn't permanently bound to a single, painful expression of it.

  The orchard *is* the memorial now. It remembers in its roots, in its branches, in its fruit, and in the quiet decision that brought it forth. It remembers by transforming the ground and trusting the future. [Village Name], your choice embodies the deepest respect for the past and the most profound hope for the future. It is a masterclass in the difficult, necessary work of communal memory. You have not forgotten; you have chosen *how* to remember. For that act of courage, wisdom, and transformative care, we are proud to present you with this year’s award.
