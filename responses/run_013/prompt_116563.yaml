answer: |-
  ### The Dispute, Restated  
  The group debated whether a specific historical policy change caused a rise in unemployment, despite the impossibility of rerunning the event or experimentally manipulating the policy. One member invoked "no causation without manipulation" to dismiss the causal question as incoherent or "loose talk," arguing that since the policy wasn't controllable (e.g., like a dial), attributing causation is misguided. The core tension is whether causal claims require *actual* human manipulability to be meaningful or verifiable.

  ### The Menu  
  1. **Epistemological Reading**:  
     *Thesis*: Causal claims can only be *justified* or *known* through evidence derived from manipulations (e.g., experiments). Without the capacity to intervene, we lack reliable epistemic access to causation.  
     *Explanation*: This asserts that causal inference depends on observing outcomes under different manipulated conditions. Non-manipulable cases (e.g., historical policies) are epistemically inaccessible, making causal claims speculative.  

  2. **Semantic Reading**:  
     *Thesis*: The *meaning* of causal statements (e.g., "X causes Y") inherently references hypothetical manipulations. If X is not manipulable, the statement is semantically defective.  
     *Explanation*: Here, "causation" is defined by interventionist counterfactuals (e.g., "If we set X to x₁, Y would change"). If X isn’t "dial-able," the claim lacks truth conditions.  

  3. **Metaphysical Reading**:  
     *Thesis*: Manipulability is a *necessary condition* for causation itself. If X cannot be manipulated, it cannot be a cause—regardless of patterns or dependencies.  
     *Explanation*: Causation ontologically requires the *possibility* of intervention. Immutable properties (e.g., planetary positions) cannot be causes.  

  4. **Interventionist Modeling Reading**:  
     *Thesis*: Causal *models* (e.g., structural equations) require variables representing interventions. Non-manipulable "causes" are excluded from such frameworks.  
     *Explanation*: Interventionist analyses (à la Pearl or Woodward) formalize causes via *idealized* manipulations. If a variable (e.g., policy) can’t be intervened on, it’s not modeled as a cause.  

  ---

  ### Verdicts  
  1. **Epistemological Reading**:  
     *Verdict*: **Substantive and defensible, but limited**.  
     *Justification*: Manipulations (e.g., RCTs) are gold-standard evidence. However, non-experimental methods (e.g., natural experiments, instrumental variables) can still support causal inferences.  
     *Dismissal support?*: Partial. It questions evidence but doesn’t render the claim "confused."  

  2. **Semantic Reading**:  
     *Verdict*: **False**.  
     *Justification*: We routinely make causal claims about non-manipulables (e.g., "Asteroid impacts caused dinosaur extinction"). Semantics of causation isn’t universally interventionist; counterfactual accounts (Lewis) don’t require manipulability.  
     *Dismissal support?*: Yes—but the semantic premise is flawed.  

  3. **Metaphysical Reading**:  
     *Verdict*: **False**.  
     *Justification*: Causes need not be manipulable (e.g., gravitational forces cause tides). Most metaphysicians reject manipulability as necessary; dependence (counterfactual or probabilistic) suffices.  
     *Dismissal support?*: Full—but metaphysically untenable.  

  4. **Interventionist Modeling Reading**:  
     *Verdict*: **Trivial within its framework**.  
     *Justification*: Interventionism *defines* causes relative to models with intervention variables. It excludes non-manipulables by design, but this is a modeling choice, not a metaphysical claim.  
     *Dismissal support?*: Only if the dispute assumes interventionist semantics—else, question-begging.  

  ---

  ### Counterfactual versus Interventionist  
  Counterfactual accounts (e.g., David Lewis) define causation via worlds where the cause doesn’t occur, regardless of human intervention. Interventionism (e.g., Judea Pearl, James Woodward) explicitly ties causation to *actions* (actual or hypothetical), formalizing it through *do*-operators. They converge when interventions are possible but diverge sharply for non-manipulables: counterfactualism accommodates them (e.g., "Had the asteroid not struck..."), while interventionism either excludes them or reinterprets them via *hypothetical* manipulations.  

  ---

  ### What I Should Have Said  
  "The slogan 'no causation without manipulation' conflates epistemology with metaphysics. While interventions *help us discover* causes, they aren’t necessary for causation *to exist*. Interventionism offers a powerful *framework* for modeling, but rejecting non-manipulable causes as 'loose talk' overreaches. Historical causality can be analyzed via difference-making (counterfactuals) or natural experiments—even if we can’t 'dial' the policy. Your dismissal assumes an interventionist semantics not everyone accepts, and even that view permits *hypothetical* manipulations to ground claims."
