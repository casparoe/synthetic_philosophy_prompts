prompt: |-
  I was in a reading group on causation that had spent a couple of sessions going back and forth over counterfactual and interventionist accounts, and last week one member cut off a dispute by announcing that there is no causation without manipulation. The dispute was whether a particular policy change caused a rise in unemployment, in a case where the episode can't be rerun and the policy was never something anyone could dial up or down; he took the line to show that the causal question was confused, or at best loose talk. I don't think the line can carry that weight, but I couldn't say exactly where it goes wrong.

  Lay out the distinct precise claims that sentence could be making — from a modest methodological remark about how we could ever find out about causes, through a semantic claim about what causal statements mean, to a full metaphysical condition on what it takes to be a cause — and give a verdict on each. Note where the counterfactual and interventionist pictures come apart here, and say whether the line is a fair compression of the interventionist view or a stronger claim that view has no use for. Where a reading would license my group-mate's dismissal, say so explicitly.

  Format the answer as follows: "The dispute, restated" (three or four sentences); "The menu" (numbered readings, each stated as a precise thesis, a short paragraph each); "Verdicts" (same order, each labelled trivial, substantive and defensible, or false, with a sentence or two of justification and a note on whether it supports the dismissal); "Counterfactual versus interventionist" (one short paragraph); "What I should have said" (a few sentences).
