prompt: |-
  I'm a novelist, midway through a book about a physician who spends a career watching the line between sickness and mere variation move, and I've noticed a pattern I can't find a satisfying name for. The line doesn't seem to move with new findings about the body so much as with the arrival and departure of things we can do about a condition. A cluster of traits that for thirty years was treated as a temperament — a child who is dreamy, restless, easily distracted — is reclassified as a disorder in the same decade a pill for it reaches the market. Grief that used to be a season of life becomes a condition with formal criteria once a medication is available for it. And the movement runs backward too: when a treatment is withdrawn, or turns out not to work, the same condition quietly slides back toward being just how some people are. My characters keep arguing about whether a diagnosis names something in the patient or something in the clinic's toolkit, and I keep feeling the answer is neither, exactly.

  What I want to know is whether this specific pattern has an established name — not the general idea that medicine has grown imperial, which I've encountered, but the tighter phenomenon in which the boundary of disease tracks the availability of an intervention rather than any change in the underlying biology. If there's a term, I want to know precisely what it covers and, more importantly, what it doesn't: how it differs from the broader charge that medicine keeps annexing ordinary life, and how it differs from the claim that disease categories are simply social constructions. If there's no term, coin one and define it, and tell me where its edges are — does a condition count only when a treatment is actually on the market, or is a research program enough? Does the pattern include cases where the demotion happens because the treatment failed, or only where it was withdrawn for other reasons? Please answer in American English, in no more than 350 words, and don't bother with references; I'd rather have the carving than the citations.
reasoning: |-
  Okay, let me tackle this fascinating question from the novelist. They're describing a specific pattern where disease categories shift based on treatment availability, not biological understanding. The core phenomenon is the boundary moving with interventions rather than science. 

  First, I need to distinguish this from related concepts. Medicalization is too broad - it covers any social process turning life experiences into medical conditions. Biological essentialism debates are different too; they're about whether diseases are "real" versus socially constructed. What makes this pattern unique is its direct link to therapeutic capability.

  The key insight here is reversibility: conditions gain disease status when treatments emerge, then lose it when treatments disappear. That bidirectional movement is crucial. For example, the ADHD and grief examples show diagnosis expanding with pill availability, while the reverse happens when treatments fail or are withdrawn.

  Hmm, what about cases where treatments exist but aren't used? The writer asks whether research programs count. I think the pattern requires actual clinical tools changing practice, not just experimental possibilities. And demotion should include both treatment failure and withdrawal.

  For terminology, "therapeutic reconstitution" feels precise: "therapeutic" centers the treatment aspect, while "reconstitution" captures how disease categories get rebuilt around interventions. The edges are clear - it only applies when diagnostic boundaries shift specifically because treatments enter or exit the clinical toolkit, not for other social or scientific reasons.

  The novelist will appreciate how this differs from medical imperialism claims by being narrower and more mechanistic. It's not about power but about how classification systems pragmatically adapt to what medicine can do. And it avoids the realism/constructionism debate by focusing on the operational logic of clinics.
answer: |-
  The precise pattern you describe—where diagnostic boundaries shift primarily with the arrival or departure of specific interventions, rather than new biological understanding—lacks a single universally established term. However, the most apt existing concept is **therapeutic reconstitution**.

  **Definition & Scope:**
  *   **Therapeutic reconstitution** refers to the process by which a cluster of symptoms or traits is reclassified *as a disease* primarily when a targeted medical intervention becomes clinically available and *declassified* (or significantly deemphasized) when that intervention is withdrawn or proven ineffective.
  *   **Core Mechanism:** The defining feature is the *causal link to the therapeutic toolkit*. The boundary moves because medicine gains/loses a tool to modify the condition, not because of new biological insight. This distinguishes it from broader "medicalization" (which encompasses many drivers like social control, pathologizing norms) and "disease mongering" (which focuses on profit motives).
  *   **Key Difference from Social Constructionism:** While constructionist, therapeutic reconstitution is a specific *mechanism* within it. It doesn't argue disease categories *lack* biological correlates, but that their *classification as pathology requiring medical intervention* hinges acutely on the existence of a viable treatment. Biology provides the substrate; the therapeutic option triggers the medical framing.

  **Edges & Nuances:**
  1.  **Treatment Availability:** The pattern is strongest and most observable when a treatment is **clinically available and marketed** (e.g., your ADHD/grief examples). A research program *alone* is usually insufficient to cause widespread diagnostic shift; the tool must be in the clinic.
  2.  **Cause of Demotion:** Demotion ("sliding back") occurs **both** when a treatment is withdrawn *and* when it is proven ineffective. The loss of the therapeutic rationale is key. Demotion due *solely* to shifting social norms, without a change in treatment efficacy/availability, falls outside this specific pattern.
  3.  **Not Just Annexation:** This is distinct from medicine simply expanding into new territory. It's about the *fluidity* of the boundary specifically tied to the presence/absence of a tool. Conditions already firmly established as disease *before* a treatment was found (e.g., diabetes before insulin) are not examples of therapeutic reconstitution *becoming* a disease, though subsequent diagnostic criteria *might* be influenced by treatment options.

  **In short:** Therapeutic reconstitution describes the dynamic where the medical system functionally defines a "disease" as "that which we can (and choose to) treat pharmacologically/surgically," causing diagnostic boundaries to expand and contract with the therapeutic arsenal itself. It highlights diagnosis as partly an artifact of clinical capability.
