    Then the bookie can form a Dutch book as above.

    But note: the agent's credences are coherent (P(A)=1/3, P(B)=1/3, P(D)=2/3) but the prices are incoherent because of risk aversion.

    This is the point: the Dutch book argument assumes that the prices reflect the credences linearly. If there is risk aversion, the prices might be incoherent even if the credences are coherent.

    So for round two, we change the instruction for the agent: they are to set prices as the maximum they are willing to pay to buy each claim, knowing that they are risk-averse with log utility and initial wealth 1. We can give them the prices to use (0.25 for A and B, 0.55 for D) to save time.

    Alternatively, we can have them set whatever they want as long as they are risk-averse, but we hope they set something incoherent. But to ensure, we provide the example.

  ### Full Timeline for 90 Minutes

  **Introduction (10 minutes)**:
    - Explain the Dutch book argument quickly: if your degrees of belief are incoherent, then a clever bookie can make a set of bets with you that guarantee you lose no matter what.
    - Today, we will experience this in two rounds. In round one, we assume you only care about the expected number of chips. In round two, we introduce risk aversion.

  **Round One (30 minutes)**:
    - Explain the claims and the die roll (5 minutes).
    - Pairs: assign roles (agent and bookie) (1 minute).
    - Agent sets prices for A, B, D (one price per claim, for both buy and sell) (5 minutes). Encourage them to set what they think is fair or arbitrary, but warn that if incoherent, they might be exploited.
    - Bookie decides which bets to make: they can buy or sell any claim at the posted prices. They can make one bet per claim or multiple? Let's allow one bet per claim (so three bets max) and fix the bet size to 1 unit per bet. So the bookie chooses for each claim: buy, sell, or pass. (5 minutes)
    - Record the bets.
    - Roll the die and resolve all bets (5 minutes).
    - Calculate net chips for agent and bookie.
    - Have a show of hands: how many agents ended up with a sure loss? (Regardless of the die roll, they lost in every possible state? We can't check every state, but if the bookie did the Dutch book correctly, the agent lost in the actual state, but we want them to see it was sure. So maybe we ask: did any bookie manage to make the agent lose in every state? How? Then we reconstruct the net as above.)
    - Rotate roles and do it again? We might not have time. Instead, we can have a discussion after one round.

    Alternatively, do two quick rounds: first with one pair of roles, then switch. But that might be 10 minutes per round. Let's do one round per role and then move to round two.

  **Round Two (30 minutes)**:
    - Explain non-linear payoffs: now the agent's utility is the natural log of their total chips. They start with 1 chip (initial wealth). So they have to set prices as the maximum they are willing to pay to buy each claim. They should set prices that make them indifferent between holding their current wealth and buying the claim at that price.
    - Provide the example calculation (or the results: for A and B, 0.25; for D, 0.55) and have all agents use these prices. (5 minutes)
    - Bookies then try to form Dutch books as before. (5 minutes)
    - Resolve the die roll and pay out. (5 minutes)
    - Now, many agents will have suffered a sure loss. But note: their credences were coherent (P(A)=1/3, etc.) but because of risk aversion, their prices were incoherent.

  **Debrief (20 minutes)**:
    - Start with round one: 
        - In round one, if the agent set prices that violated the probability axioms (like P(D) != P(A)+P(B)), then the bookie could make a set of bets that guaranteed the agent a loss.
        - This is the Dutch book theorem: incoherent credences lead to sure losses.
    - Round two:
        - In round two, the agent had coherent credences but because of risk aversion, the prices they set were not equal to their credences and were incoherent. 
        - The bookie could still make a Dutch book, but it wasn't because the agent had incoherent credences; it was because the agent's betting behavior was influenced by risk aversion.
    - The bridge from credences to betting behavior is the assumption of linear utility in chips (or risk neutrality). 
        - The Dutch book argument assumes that the agent will bet at their credences. This is the "bridge principle": that degrees of belief are revealed in betting prices.
    - What the activity can't reproduce:
        - The game shows that if you bet at prices that are incoherent, you can be Dutch booked. But it doesn't show that you are irrational if you have incoherent credences. 
        - The jump from "you suffered a sure loss" to "you were irrational" requires that we assume you are willing to bet at your credences. 
        - In round two, even with coherent credences, if you are forced to bet at prices that don't reflect your credences because of risk aversion, you might suffer a sure loss. That doesn't mean your credences are incoherent; it means the setup forced you to act as if they were incoherent.
    - The Dutch book argument is conditional: if you are willing to bet at your credences, then you had better have coherent credences or you will be vulnerable to a Dutch book. But if you are not willing to bet at your credences (because of risk aversion, for example), then the argument doesn't apply.

  **Predictable Problems**:
    - In round one, students might set coherent prices (maybe because they know the fair values) so the bookie cannot Dutch book. Then we don't see the effect. To handle: encourage some to set arbitrary prices, or have one volunteer set incoherent prices for demonstration.
    - The bookie might fail to find the combination. Solution: provide a hint: "look at the price of D and the sum of A and B". Or after a few minutes, show the standard Dutch book on the board.
    - In round two, the non-linear utility might be confusing. Students might not understand how to set prices. Solution: provide the prices (0.25, 0.25, 0.55) and explain they come from risk aversion.
    - Round two might be misinterpreted as "the Dutch book argument is wrong". But we want to show that it has a precondition: the agent must be risk neutral. In the debrief, stress that the argument is conditional on linear utility.

  **Materials**:
    - Dice (one per pair, or one for the whole class)
    - Poker chips or candy
    - Handout with claims and rules

  **Claims for both rounds** (using the die):
    - A: die shows 1 or 2.
    - B: die shows 3 or 4.
    - D: die shows 1, 2, 3, or 4.

  This design should achieve the goals: 
    - Round one: incoherent prices (due to incoherent credences) lead to sure loss.
    - Round two: coherent credences but incoherent prices (due to risk aversion) also lead to sure loss, showing that the Dutch book might be due to factors other than credence incoherence.
    - The debrief connects the dots and highlights the bridge principle.

  Let me know if you need more details.
answer: |-
  Okay, let's build this thing step by step. I'll walk you through the whole setup, run the two rounds, handle the debrief, and flag the predictable hiccups. The goal is to make the Dutch book argument visceral first, then twist it to reveal its hidden assumptions. We’ll use poker chips (or candy) and a simple die roll for the draw to keep logistics manageable.

  **Core Setup**  
  You’ll need:  
  - One standard six-sided die per student pair (or one shared die if you roll centrally).  
  - Poker chips (or candy) — about 50 per pair.  
  - A slate of claims for the die roll:  
    • **A**: The die shows 1 or 2.  
    • **B**: The die shows 3 or 4.  
    • **D**: The die shows 1, 2, 3, or 4 (i.e., A or B).  

  Note: A and B are mutually exclusive; D is their disjunction. Coherence requires P(D) = P(A) + P(B).  

  **Round One: Linear Stakes (Incoherence Hunt)**  
  *Prep (5 min)*: Pair up students (7 pairs). One is the **Agent**, setting prices. The other is the **Bookie**, crafting bets. Explain:  
  - The die will be rolled once at the end.  
  - Each claim pays 1 chip if true, 0 if false.  
  - Agents must post a **single price** for each claim (A, B, D) — this is the price at which they’ll *both* buy *and* sell the claim. (e.g., Price A = 0.3 means they’ll buy or sell a bet on A for 0.3 chips).  
  - Bookies can demand *any* combination of bets (buy/sell) on *any* claims, up to 1 unit per claim (to keep math simple).  
  - After bets are placed, you roll the die, resolve claims, and chips change hands.  
  - Agents aim to maximize chips. Bookies aim to drain the Agent.  

  *Play (20 min)*:  
  1. **Agents set prices** (5 min): They post prices for A, B, D between 0 and 1. *Don’t* coach coherence. Some will set P(A)=P(B)=1/3≈0.33, P(D)=0.66 (coherent). Others might set P(A)=0.4, P(B)=0.4, P(D)=0.7 (incoherent, since 0.4+0.4 ≠ 0.7).  
  2. **Bookies place bets** (5 min): Bookies review the Agent’s prices. If incoherent, Bookie constructs a Dutch book:  
     - If P(A) + P(B) < P(D) (e.g., 0.4+0.4 < 0.7), Bookie **sells D** to Agent (at Agent’s P(D)=0.7) and **buys A** and **buys B** from Agent (at P(A)=0.4, P(B)=0.4).  
     - If P(A) + P(B) > P(D), reverse the bets.  
  3. **Resolve** (10 min): Roll the die publicly. Payoffs:  
     - If Bookie sold D to Agent: Agent pays Bookie 0.7 chips upfront. If D true, Bookie pays Agent 1 chip.  
     - If Bookie bought A from Agent: Bookie pays Agent 0.4 chips upfront. If A true, Agent pays Bookie 1 chip.  
     - (Similarly for B).  
     *Net effect for P(A)+P(B)<P(D)*: Agent loses 0.1 chip *regardless of outcome* (e.g., if A true: Agent gains 1 (for A) but pays 1 (for D) → net -0.1). Bookie profits 0.1.  

  **Round Two: Non-Linear Stakes (The Bridge Wobbles)**  
  *Prep (5 min)*: Same pairs, but now **Agents are risk-averse**. Explain:  
  - Chips convert to candy (or credit) via a **square-root function** (e.g., 1 candy = sqrt(total chips)). More chips are good, but marginal chips are worth less.  
  - Agents still *believe* P(A)=P(B)=1/3, P(D)=2/3 (coherent credences).  
  - **But** due to risk aversion, they set prices as the *maximum they’d pay to buy* each claim. Give them fixed prices to use: **A: 0.25, B: 0.25, D: 0.55**. (These approximate a risk-averse agent with log utility starting from 1 chip; trust me, it works.)  
  - Bookies play the same role: exploit price incoherence.  

  *Play (20 min)*:  
  1. **Agents post prices** (2 min): They use A:0.25, B:0.25, D:0.55.  
  2. **Bookies place bets** (5 min): Prices are incoherent (0.25+0.25 < 0.55), so Bookie repeats Round One’s Dutch book: Sells D to Agent (0.55), buys A (0.25) and B (0.25) from Agent.  
  3. **Resolve** (10 min): Roll die. Payoffs as before.  
     *Net effect*: Agent loses 0.05 chips *regardless of outcome* (e.g., if A true: Agent gains 1 (A) -1 (D) =0, minus net cash flow: -0.55 +0.25+0.25 = -0.05).  

  **Debrief (30 min)**  
  Start by mapping the game to the Dutch Book argument:  
  1. *Round One*: The "sting" moment. When Bookies found incoherence (P(A)+P(B) ≠ P(D)), they built a bet combo that *guaranteed* the Agent lost chips no matter the die roll. That’s the Dutch Book. Key insight: **Incoherent credences → Sure loss under linear payoffs.**  

  2. *Round Two*: The twist. Agents had *coherent credences* (P(D)=P(A)+P(B)=2/3) but quoted *incoherent prices* (0.55 ≠ 0.25+0.25) due to risk aversion. The Bookie *still* inflicted a sure loss (same bet combo!). But now the loss doesn’t prove credal incoherence—it proves the **prices** were exploitable. This wobbles the bridge: the Dutch Book argument assumes your betting prices *reveal your credences directly*. If risk aversion (or other factors) distorts prices, a Dutch Book doesn’t isolate incoherence.  

  3. *The gap*: The game shows **sure loss ≠ irrationality**. Round Two’s Agent wasn’t credally irrational; they were *behaviorally rational* given risk aversion. The Dutch Book argument *requires* an extra premise: that you’re **willing to bet linearly at your true credences** (i.e., risk-neutral). Without this, the inference from "sure loss" to "irrational beliefs" fails.  

  4. *The big picture*: The Dutch Book is a *conditional* argument: **IF** you bet at your credences, **THEN** coherence is necessary to avoid exploitation. Round Two reveals the cost of the "IF"—it’s not a free assumption. Risk aversion, bankroll effects, or aversion to tiny stakes can break the link.  

  **Predictable Hiccups & Fixes**  
  - *Agents set coherent prices in Round One*: Some will. Have a few pairs share prices publicly; nudge an Agent to set wonky ones if needed. Or let a Bookie "win" by exploiting natural incoherence (many will set P(D) too high).  
  - *Bookies miss the Dutch Book combo*: Common. Circulate with a prompt: "Check if P(A)+P(B) matches P(D). If not, can you buy/sell to lock in a gap?" After 3 min, sketch the combo on the board.  
  - *Non-linear confusion in Round Two*: Students might resist fixed prices. Preempt it: "You’re risk-averse; these prices are computed for you. Your job is to see what happens when Bookies exploit them."  
  - *Misreading Round Two as "Dutch Books are wrong"*: Clarify fast in debrief: It’s not that the argument fails, but that it *depends* on linear betting. Hammer: "The Dutch Book is sound *if* we accept its bridge from credences to bets. Round Two shows that bridge isn’t automatic."  
  - *Time crunch*: Cut Round One to one resolved bet per pair. Or run one demo pair publicly while others observe.  

  **Why This Works**  
  The linear round makes the Dutch Book visceral—students *feel* the sucker punch of a sure loss. The non-linear round forces them to reconcile that experience with a case where the loss *isn’t* about belief incoherence. The debrief ties it together, exposing the argument’s hidden assumption without drowning in formalism. They’ll leave pumped because they didn’t just *hear* about Dutch Books—they got scammed, then scammed again, and now they know why it matters.  

  Run it tight, embrace the chaos, and they’ll see the weediness not as a flaw but as the point. Good luck!
