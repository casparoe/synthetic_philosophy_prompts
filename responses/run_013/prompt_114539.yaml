  User’s aversion to tropes is loud: no staring at the sea. Instead, I’ll end with paperwork—the unsigned verdict—and the daughter’s lingering presence in the lobby. The "rightness" she embodies isn’t philosophical but human: the future mourns its own loss, and the dead man’s completeness can’t cancel others’ deprivation. That’s the gut punch. 

  Word count’s tight. I’ll compress the Bureau’s worldbuilding, use the audit file as a structural device (section headers, evidence lists), and let the daughter’s physical items (a ticket stub, a calendar) carry emotional weight. The clerk’s cold precision makes her flicker of doubt seismic. 

  ...Time to write. Bureau’s aesthetic: fluorescent lights, data as ritual. Clerk’s name—Arden Voss—sounds sharp, efficient. Daughter is Lily; her father, Robert Haig. Satiety declaration is Form D-7. I’ll open mid-audit, show Arden’s skill, then gut her with the contradiction. Lily’s evidence will feel like debris from a canceled universe. And the ending? Arden suspended in the "when" of harm, the verdict incomplete. Philosophy stays tangled; the reader feels the knot tighten.
