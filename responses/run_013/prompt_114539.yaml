  The clerk’s expertise is key. She’s a "quantifier of absence," so her struggle isn’t ignorance but over-qualification. She *knows* the rules; the horror is their inadequacy. I’ll show her routine cases (terminal illness, accident victims) to establish the Bureau’s logic before upending it. 

