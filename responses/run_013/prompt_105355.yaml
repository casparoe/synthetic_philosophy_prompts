answer: |-
  Here's a dissection of "absence of evidence is not evidence of absence" (AOEINOEOA) tailored to your archaeological context, followed by answers to your specific questions. The readings are ordered from weakest to strongest argumentatively.

  ### The Menu of Readings

  1.  **The Conversational Reading:**
      *   **Thesis:** The phrase is not a claim about evidence or logic, but a rhetorical device in debate to shift the burden of proof onto the person making the positive claim ("there was no ritual") and prevent premature closure of discussion.
      *   **Verdict:** **Substantive and Defensible** as a description of its *rhetorical function*, though not a logical proposition.
      *   **Blocks Inference?** **No.** It doesn't logically block your inference; it forces *you* to defend it more rigorously and prevents others from accepting it uncritically *in the conversation*. It signals "I'm not convinced yet, the onus is on you."

  2.  **The Humility Reading:**
      *   **Thesis:** My personal failure to find something (due to limitations of my search, perception, or method) does not, by itself, constitute objective evidence about the state of the world.
      *   **Verdict:** **Trivially True** (and bordering on platitude). The failure of one specific search attempt isn't strong evidence. However, a systematic, competent search *is* evidence.
      *   **Blocks Inference?** **No.** It merely cautions against drawing conclusions from a single, poorly executed search. Your description ("excavated to sterile soil over most of its area") strongly implies a competent, systematic search *was* conducted, countering this reading.

  3.  **The Recognition Reading:**
      *   **Thesis:** The "absence" perceived is not in the past reality, but in our modern ability to recognize or categorize evidence. "Ritual" might be a poorly defined or residual category ("things we can't explain practically"), making "no evidence of ritual" potentially tautological or uninformative.
      *   **Verdict:** **Substantive and Defensible** (a significant epistemological challenge in archaeology).
      *   **Blocks Inference?** **Potentially.** If "ritual" is defined solely as "unexplained deposits/objects," then finding none *would* be uninformative (tautological). However, if you defined ritual using *positive* criteria (e.g., figurines of a specific type, structured deposits in specific contexts) and found none of *those*, this reading weakens. It challenges your *categories*, not necessarily the inference from *absence within those defined categories*.

  4.  **The Preservation Reading:**
      *   **Thesis:** The absence of material evidence is primarily a fact about post-depositional processes (taphonomy) and the perishable nature of potential ritual materials (wood, cloth, organic offerings) rather than proof that ritual didn't occur.
      *   **Verdict:** **Substantive and Defensible** (a core archaeological principle).
      *   **Blocks Inference?** **Yes, potentially.** This directly challenges the link between the *archaeological silence* and the *past absence*. It argues the silence could be due to non-preservation, not non-existence. Whether it *successfully* blocks your inference depends on the plausibility of perishable ritual evidence at your site type/period and the completeness of preservation otherwise observed.

  5.  **The Sensitivity Reading:**
      *   **Thesis:** The absence of evidence *is* evidence of absence, but *only* if the search was sufficiently sensitive (i.e., it had a high probability of detecting the evidence *if it had been present*). The strength of the negative evidence is directly proportional to the sensitivity of the search.
      *   **Verdict:** **Substantive and Defensible** (the core Bayesian/logical view).
      *   **Blocks Inference?** **Not inherently.** This reading *licenses* negative inferences *if* sensitivity is high. It blocks your inference **only if** the sensitivity of your excavation/methodology to detect *plausible forms* of ritual evidence at that site was demonstrably low.

  6.  **The General Claim Reading:**
      *   **Thesis:** Absence of evidence is *never*, under *any* circumstances, evidence of absence. Silence always means nothing about non-existence.
      *   **Verdict:** **False.** This is demonstrably incorrect logically and practically. If I thoroughly search my entire, well-lit office for an elephant and find none, the absence of evidence *is* very strong evidence an elephant is absent. It ignores the crucial role of search sensitivity (Reading 5).
      *   **Blocks Inference?** **Yes, absolutely.** If true, it would categorically forbid your inference and any negative inference ever. However, since it's false, this block is invalid.

  ### Answers to Your Questions

  1.  **Which readings license refusal vs. caution?**
      *   **License Refusal (Block Inference):** The **General Claim** (though false), the **Preservation Reading** (if preservation concerns are plausible), the **Recognition Reading** (if the definition of "ritual evidence" is problematic/residual), and the **Sensitivity Reading** (if search sensitivity was low).
      *   **License Only Caution:** The **Humility Reading** (trivial caution), the **Conversational Reading** (caution about accepting the inference *now*), and arguably the *defensible core* of the **Sensitivity Reading** (which demands we *assess* sensitivity before accepting the inference's strength).

  2.  **What establishes Sensitivity favors him?** For the Sensitivity Reading to favor your colleague *against* your inference, he would need to argue successfully that:
      *   Plausible ritual practices at that site/period would have left materially detectable traces (countering Preservation).
      *   The *specific types* of traces they would leave were either:
          *   Not systematically looked for during excavation (e.g., specific micro-residues, subtle soil chemistry changes ignored).
          *   Highly unlikely to be preserved given the site's taphonomy (linking to Preservation).
          *   Easily misidentified or discarded as mundane during excavation/analysis (e.g., certain structured deposits look like random dumps).
          *   Located in unexcavated portions of the site or contexts not reached by "sterile soil" (e.g., deep post-holes, periphery).
      *   Essentially, he needs to show a *significant prior probability* that ritual *would* have been archaeologically invisible *at this specific site* despite your methods.

  3.  **Is there a true & useful version?** Yes, but it's nuanced and requires abandoning the slogan.
      *   **Honest Replacements:**
          *   "Absence of evidence *where evidence would certainly be expected* **is** evidence of absence."
          *   "The *strength* of negative evidence depends critically on the *sensitivity* and *scope* of the search and the *expected material correlates* of the hypothesized phenomenon."
          *   "Negative evidence must be evaluated probabilistically, considering preservation, recovery methods, and the likelihood that the phenomenon would leave detectable traces." (This *is* the Sensitivity Reading).
      *   **Narrower Claim:** "This *specific* body of evidence (from Site X), given its preservation conditions and our recovery methods, cannot *reliably* bear the weight of a negative inference about the *absence* of ritual practice, because plausible ritual activities might not have left recoverable traces here." (This combines Sensitivity and Preservation).

  4.  **Most likely intended reading & how to tell?** The **Preservation Reading** is overwhelmingly the most common *substantive* intention in archaeology, often implicitly bundled with **Recognition** ("we wouldn't recognize it anyway") or a vague appeal to low **Sensitivity**. **Conversational** is also very common rhetorically.
      *   **How to Tell:** Ask directly: "Are you arguing that ritual practices likely occurred but left no recoverable traces at *this* site (Preservation)? Or that our methods were insufficient to detect traces had they been present (Sensitivity)? Or that 'ritual' is too vague a category (Recognition)? Or are you simply saying the discussion shouldn't end here (Conversational)?"

  5.  **Ordered Weakest to Strongest (Argumentatively):**
      1.  **General Claim:** False, easily refuted. (Weakest)
      2.  **Humility Reading:** Trivially true, irrelevant to competent excavation. (Platitude)
      3.  **Conversational Reading:** Valid rhetorical move, but not a logical argument against the inference itself.
      4.  **Recognition Reading:** Substantive challenge to definitions/categories, but addressable by clearer criteria. (Platitude dressed as insight if used vaguely)
      5.  **Sensitivity Reading:** Core logical point, forces probabilistic assessment. (Strongest core insight, though often misapplied)
      6.  **Preservation Reading:** Strong, fundamental archaeological constraint. (Strongest common *substantive* argument in practice)

  6.  **Combining with "Ritual is Invisible": Immunity & Cost**
      *   **The Position:** "AOEINOEOA" + "Ritual is inherently archaeologically invisible (or virtually so)".
      *   **Is it Immune to Excavation?** **Yes, effectively.** If ritual *by definition* or *in principle* leaves no materially recoverable traces recognizable as such, then *no* excavation, no matter how meticulous, could *ever* provide evidence for its absence. Negative evidence is rendered meaningless.
      *   **The Cost:** This position **completely severs archaeology from making any meaningful claims about ritual in the past.** It renders the concept archaeologically **untestable** and **unfalsifiable**. If adopted:
          *   It becomes impossible to distinguish archaeologically between societies with elaborate ritual and those with none.
          *   Arguments *for* the presence of ritual become equally immune to evidence (if it's invisible, how do you know it *was* there?).
          *   It reduces claims about past ritual to pure speculation, faith, or inference from ethnography/analogy alone, detached from the material record. This is a massive cost for a discipline fundamentally grounded in material evidence. It surrenders archaeology's unique contribution to understanding this aspect of past human life. The claim becomes a statement of belief, not an archaeological inference.
