prompt: |-
  I'm a novelist and I keep a notebook of arguments I overhear, and I've got three entries now that I'm fairly sure are the same animal, but I can't find a name for it, and I need one, because a character in the book I'm writing has to lose an argument to this thing and I want to know exactly what beats her.

  Entry one: a guy at a party telling his friend to put his entire savings into a biotech startup. The pitch is that if it works it saves millions of lives, and sure the odds are terrible, but you can't say they're zero, and any number times millions of lives is still a big number. When someone asks him what the odds actually are, he says that's not the point.

  Entry two: a tenants' meeting. Someone wants everybody to chip in for an appeal that will almost certainly fail, because there's some chance it sets a precedent that protects thousands of tenants down the line. Another guy says you could use that reasoning to spend every penny you own on literally anything. She says that's a cynical way to talk about people's homes.

  Entry three, my favourite: two guys at the same table. One says give the money to the AI people, because there's a small chance of something unthinkable. The other says give it to the malaria people, because those deaths are certain. Same shape of argument, opposite conclusions, and neither of them budges when you swap which one he's hearing.

  What I keep circling is that the argument gets stronger the less anybody knows. Normally an argument gets weaker when you can't check the claims it's resting on. Here the uncheckability is the engine: you can't rule the huge thing out, and that's somehow supposed to count in its favour, and it doesn't seem to matter whether the huge thing is likely, possible, or merely not excluded. Also nobody ever puts a number on the odds. The number only ever shows up on the payoff side.

  I know Pascal's wager from school, and I know the objection about all the other gods you might be annoying, and I have a feeling this is related but its not the same — the wager is about believing something for an infinite afterlife, this is about real money and real strangers and what to do before Tuesday. So: does this pattern have a name, or a few names for its different parts? I'm not after a reading list. What I want is the carving. Which bit is the load-bearing trick — the unbounded payoff, the missing odds, or the fact that the same move serves any conclusion and its users don't treat that as a reductio? Is the version where nobody has any odds at all definately a different animal from the version where the odds are just tiny? Is it really the wager in a coat? And if nothing fits, invent a name and give me the edges: what's the nearest case where this reasoning is actually fine — an asteroid, a real one-in-a-billion risk with a real remedy — and what makes that one fine when the others aren't. If you hand me a term and nothing else I'll be annoyed, because I still won't know what my character loses to.
reasoning: |-
  Okay, the user is a novelist who collects overheard arguments and has identified a recurring pattern. They need to name this argumentative structure because a character in their book loses to it. The three examples involve high stakes with unknown or unquantified probabilities but enormous potential payoffs. 

  First, I need to understand the core of this pattern. Each case ignores actual probabilities and focuses on the magnitude of the payoff. The probabilities are either dismissed or left unexamined, which makes the argument stronger in the absence of information. That's counterintuitive because usually, lack of evidence weakens an argument. 

  Pascal's Wager comes to mind, but the user already mentioned it's different because it's about infinite afterlife, while these are real-world decisions. So I need to find a secular version. The term "Pascal's Mugging" from Nick Bostrom fits perfectly here. It's when an improbable event with a huge payoff is used to justify action, regardless of the minuscule probability. The examples match this: biotech startup, legal precedent, AI vs. malaria funding. The key is the asymmetry—payoff is emphasized while probability is ignored or hand-waved.

  But the user wants more than just a name. They need to understand the mechanics so their character can be defeated by it. The load-bearing tricks are the unbounded payoff combined with the refusal to quantify probability. Also, the argument is flexible; it can support any cause by inflating the stakes. The user also asks about variants: when odds are tiny vs. completely unknown. In the tiny odds case, it's Pascal's Mugging. When odds are unknown, it veers into "appeal to possibility" fallacy, where mere possibility is treated as a reason to act.

  The nearest valid case might be something like asteroid deflection. If an asteroid has a 1% chance of hitting Earth, the expected value (probability multiplied by impact) justifies action. But in Pascal's Mugging, the probability is so low that even a huge payoff doesn't justify the cost. The difference is quantifiable risk vs. speculative, unanchored probability.

  The user might also need to show why their character loses. The opponent in the story could refuse to engage with probability, shift focus to the stakes' magnitude, and accuse the character of cynicism or lack of empathy. By avoiding quantification, the argument becomes rhetorically powerful and hard to counter without seeming cold-hearted.

  I should also mention related terms like "expected value neglect" or "zero-risk bias," but Pascal's Mugging is the most precise. The flexibility of the argument (working for any conclusion) is part of its insidiousness, making it a rhetorical tool rather than logical. Highlighting that even swapping positions doesn't budge the arguer shows its dogmatic nature.
answer: |-
  This pattern absolutely has a name, and it's **Pascal's Mugging**. It's the *secular, real-world, action-oriented cousin* of Pascal's Wager. Here's the carving:

  1.  **The Core Structure (Pascal's Mugging):**
      *   **Premise 1:** There exists an action with a very **small (or unknown but non-zero) probability** of causing an **enormously large positive outcome** (or preventing an enormously large negative outcome).
      *   **Premise 2:** The potential magnitude of the outcome is so vast (e.g., saving millions/billions of lives, preventing existential catastrophe, establishing a sweeping legal precedent) that it **dominates any consideration of the actual probability**, even if that probability is minuscule.
      *   **Premise 3:** Because we cannot definitively say the probability is *zero*, the **expected value** (Probability x Magnitude) becomes effectively infinite or impossibly large, demanding action regardless of cost.
      *   **Conclusion:** Therefore, we **must** take the action, regardless of its cost or the low probability of success, because the stakes are too high *not* to.

  2.  **The Load-Bearing Trick:**
      *   **The Unbounded Payoff + Suppressed Probability Combo:** This is the core engine. The argument **deliberately avoids quantifying the probability** (or hand-waves away attempts to do so, as in your examples: "that's not the point," "you can't say they're zero," "there's some chance"). This suppression is crucial because:
          *   It prevents the calculation of a meaningful **expected value** (which would almost certainly be very small if the probability were honestly assessed).
          *   It allows the **magnitude of the payoff to exert infinite rhetorical pressure**. The sheer *size* of the potential benefit/catastrophe paralyzes critical assessment of the likelihood.
          *   It exploits **ambiguity aversion** and the **precautionary principle** run amok – "We can't afford *not* to try, just in case."
      *   **The Uncheckability as Fuel:** As you astutely observed, the *lack* of concrete knowledge about the probability isn't a weakness; it's the fuel. "You can't prove it *won't* work!" becomes the primary justification. This is the **appeal to possibility fallacy** on steroids.

  3.  **Your Specific Questions Answered:**
      *   **Is the version with *no* odds different from *tiny* odds?** Practically, in terms of the *argument's structure and rhetorical force*, **no.** Both rely on suppressing meaningful probability assessment to let the payoff dominate. The "unknown but non-zero" is just a slightly more sophisticated version of the same evasion used in the "definitely tiny but unquantified" case. Both are Pascal's Mugging.
      *   **Is it just Pascal's Wager in a coat?** **Yes, fundamentally.** Pascal's Wager applies the same logic (infinite reward/penalty vs. finite cost, ignoring probability and alternative gods) to religious belief. Pascal's Mugging applies it to secular actions with vast, but finite, potential outcomes. The coat is different (real-world stakes, action vs. belief), but the skeleton is identical: **suppress probability, amplify stakes, demand action/belief.**
      *   **Why the same move serves any conclusion?** Because the structure is **content-neutral**. The "enormous payoff" is defined by the arguer's values. For the biotech guy, it's saving millions via *this* startup. For the tenant, it's legal precedent for *this* cause. For the AI guy, it's preventing *this* unthinkable risk. The *logic* doesn't care what fills the "enormous payoff" slot, making it incredibly flexible and resistant to internal consistency checks (users don't see it as reductio because their *specific* enormous payoff feels uniquely vital). This is **motivated reasoning** leveraging a powerful, flawed structure.
      *   **The Nearest Valid Case (What Makes it Fine?):** **A quantifiable, non-negligible probability of a large, specific harm with a feasible, cost-effective mitigation.**
          *   **Example:** Investing in asteroid detection/deflection.
              *   **Known Risk:** Historical data and modeling give us rough probabilities for various sizes of impacts (e.g., a 1km+ asteroid might have a ~1% chance per century of hitting).
              *   **Known Consequence:** The impact (regional/global catastrophe) is well-understood physically.
              *   **Feasible Mitigation:** Techniques exist (e.g., gravity tractor, kinetic impactor) whose cost and effectiveness can be modeled against the risk.
              *   **Expected Value Calculation:** While the probability is low per year, the consequence is vast, and crucially, **the probability is not suppressed or hand-waved – it's estimated and used in the calculation.** The cost of mitigation can be rationally weighed against the expected harm (Probability x Consequence). The argument *holds* because the probability, while small, is *anchored in evidence* and large enough relative to the cost of action to potentially justify it.
          *   **Why Pascal's Mugging Fails:** It replaces evidence-based probability with "could happen" or "non-zero," ignores alternative uses of resources (opportunity cost), and pushes costs onto others for wildly speculative gains. The *lack* of quantification and the *refusal* to engage with it is the fatal flaw separating it from valid precautionary action.

  **Why Your Character Loses:**

  She loses to **Pascal's Mugging**. Her opponent wields it masterfully by:
  1.  **Invoking the Colossal Stakes:** "Think of the MILLIONS who could be saved/the precedent that could help THOUSANDS/the UNTHINKABLE disaster we prevent!"
  2.  **Deflecting Probability:** "You can't put a number on hope!" / "You can't prove it WON'T work!" / "Focusing on odds is cynical/pessimistic/shortsighted!" (This is the knockout blow – it frames *her* rationality as the problem).
  3.  **Demanding Action:** "Given what's at stake, how can we *not* do this? The cost is nothing compared to the potential benefit!"
  4.  **Exploiting Emotion:** Framing dissent as lacking compassion (tenants' meeting), vision (biotech), or seriousness (AI risk).

  **To Defeat Her:**
  *   She tries to ask for the odds, gets shut down ("not the point").
  *   She points out the cost/opportunity cost (spending savings, chipping in for a hopeless appeal, diverting funds from proven malaria aid), gets accused of being cynical/callous/shortsighted.
  *   She tries to argue the probability *is* effectively zero based on evidence, gets drowned out by the sheer rhetorical weight of "BUT WHAT IF IT WORKS AND SAVES MILLIONS?!"

  She loses because Pascal's Mugging is **rhetorically overpowering** when deployed against empathy and a sense of responsibility, especially when the opponent successfully frames any demand for evidence or prudence as moral failing. It weaponizes the *possibility* of vast good against the *certainty* of finite cost. Name it, understand its levers (Unbounded Payoff + Suppressed Probability), and your character's defeat will feel tragically real.
