prompt: |-
  I chair the investment committee at a mid-sized engineering firm, and Thursday we have to vote on whether to sign a two-year co-development deal with a parter company that's been structured in a strange way, so I need a written opinion to circulate beforehand.

  Here's the structure, stripped down. There are eight milestones. At each milestone, whichever side is on the clock can either stay in or pull out. If you stay in, the shared pot (the value of the joint IP) roughly doubles by the next milestone. If you pull out when it's your turn, the whole thing ends right there and you take the larger share of whatever the pot is at that moment — pulling out pays more than the current equal split, but obviously less than the equal split of the much bigger pot you'd both get by staying in all the way to milestone eight, where you split evenly and its the best outcome for both of us. Our outside counsel says the analysis is trivial: work backwards. At milestone eight the side on the clock pulls out, because taking the bigger share of the current pot beats splitting a pot that can't grow anymore. Knowing that, at milestone seven the other side pulls out, and so on all the way back, so at milestone one whoever is on the clock pulls out and we never get past the first round. Counsel's conclusion is that signing is irrational and we should walk away, or if we sign, we should plan to pull out at our first turn.

  That's fine as far as it goes, but nobody actually behaves like that, and I don't just mean naive people — the whole reason this setup has a name is that it's a paradox, the backwards reasoning looks airtight and yet it predicts an outcome basically nobody produces. I also don't think counsel's story is as clean as they think, because the whole regress only goes through if it's common knowledge that both sides are rational in exactly this narrow sense — I have to know you'll pull out at eight, and know that you know I'll pull out at seven, and so on — and that infinite tower of mutual knowledge is doing all the work, and I don't think we're entitled to just assume it.

  What I want from you is a memo I can circulate to the committee. Recommend a concrete course of action — sign or don't sign, and if we sign, what we should do at our first milestone, plus what if anything we should try to get written into the contract ahead of time (can we bind ourselves, or penalize ourselves, for pulling out early, and does that actually help or is it just wishful thinking). Give me a time frame. And engage the strongest version of counsel's position seriously instead of waving it off as unrealistic — if backward induction really does apply here, say what the deal-breaker is, and if it doesn't, say exactly where the reasoning breaks and what has to be true about our counterparty for staying in to be the right call.

  One more thing I want you to actually take a position on: there's a version of this where what makes cooperation work is just that each side puts some chance on the other being the type who won't pull out — a stubborn or principled partner. If that's what's really going on, then us being visibly the stubborn type might be worth more than any contract clause, and I want to know whether that changes your recommendation.

  Keep it under a page and a half, no jargon for its own sake — the CFO sits on this committee and hates game theory words.
reasoning: |-
  Okay, the user chairs an investment committee and needs a memo about a co-development deal structured with eight milestones. Each side can pull out during their turn for a larger share of the current pot, but staying in doubles the pot. Backward induction suggests both sides will pull out immediately. The user wants a concrete recommendation and engagement with the backward induction argument.

  First, I need to unpack why backward induction fails in real life. The key is the assumption of common knowledge of rationality. If both parties know the other is perfectly rational and will always defect, the chain reaction happens. But in practice, people aren't perfectly rational. They might have different risk tolerances, trust, or uncertainty about the other's intentions.

  The user mentioned the possibility of a "stubborn" type partner. If there's a chance the counterparty won't defect, cooperation becomes viable. This relates to game theory concepts like the Centipede Game, where experimental results show people cooperate beyond what backward induction predicts. 

  The user also asked about binding commitments or penalties. Binding clauses could help, but they might not be enforceable or could lead to inefficiencies. Penalties need to be high enough to deter defection but not so high they deter participation. However, contracts can't cover all contingencies, and there's still a risk if the counterparty sees an advantage in defying the penalty.

  The CFO dislikes jargon, so terms like "backward induction" or "common knowledge" should be explained simply. The memo should focus on practical steps: whether to sign, what to do at milestone one, and any contract modifications. 

  The user's deeper needs include avoiding a bad deal while not missing out on potential gains. They might fear that walking away is too cautious but also worry about being the first to defect. They need a balanced approach that acknowledges the theoretical risk but leverages real-world behaviors.

  Recommendation: Sign the deal but plan to stay in initially. Propose mutual penalties for early exit to align incentives. Emphasize building trust and assessing the partner's reliability. The stubborn strategy might work if the firm can credibly commit to cooperation, but it's risky if the partner is unpredictable. 

  Need to keep the memo under a page and a half, clear and actionable. Highlight that backward induction assumes perfect rationality, which isn't realistic. The real deal-breaker is if the partner is purely opportunistic; otherwise, staying in early milestones is beneficial.
answer: |-
  **MEMORANDUM**  
  **TO:** Investment Committee  
  **FROM:** [Your Name/Title]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Co-Development Deal & Milestone Strategy  

  ### 1. **Core Issue & Counsel’s Position**  
  The deal’s structure creates a "pull-out incentive" at every milestone: exiting on your turn nets a larger immediate share (e.g., 60/40) of the current pot, while staying risks the partner exiting later to claim their own larger share. **Outside counsel’s backward induction argument is logically sound** if:  
  - Both sides are *perfectly rational* (prioritizing only short-term self-interest),  
  - Both *know* the other is perfectly rational,  
  - Both *know* this knowledge is mutual (and so on, infinitely).  

  Under these strict conditions, the *only* rational outcome is mutual defection at Milestone 1.  

  ### 2. **Why Backward Induction Fails in Practice**  
  Real-world actors rarely meet these conditions. Key breaks in the logic:  
  - **Uncertainty about the partner:** If we assign >0% probability that the partner might *not* defect (due to long-term thinking, reputation concerns, or sheer stubbornness), cooperation becomes possible.  
  - **Reputation & relationships:** Engineering firms value trust for future deals; burning a partner has hidden costs.  
  - **Time horizon mismatch:** Counsel assumes both sides discount future gains identically. If we value the end pot highly enough (e.g., strategic IP dominance), early defection is less attractive.  
  - **Incomplete information:** We may learn about the partner’s reliability during early milestones.  

  **The paradox resolves when players doubt the other’s "perfect rationality."**  

  ### 3. **Recommendation: Sign the Deal, Commit to Milestones 1–3**  
  - **Vote to SIGN**, contingent on adding two contractual safeguards (see Section 4).  
  - **At our first milestone(s), STAY IN.**  
    - **Why:** Early exits forfeit 90%+ of the deal’s potential value. Milestones 1–3 offer the highest ROI for risk: the pot grows rapidly, while the partner’s "pull-out incentive" is still small compared to the end-game prize. Exiting early surrenders massive upside for minimal security.  
  - **Monitor rigorously:** Use Milestones 1–3 to stress-test the partner’s behavior. If they signal cooperation (e.g., transparent communication, no legal maneuvering), proceed. If not, reassess at our next decision point.  

  ### 4. **Contractual Safeguards to Propose**  
  1. **Early-Exit Penalty:**  
     - If either party exits before Milestone 5, they forfeit 15–20% of their *accrued development costs* to the other side.  
     - **Why it works:** Makes early defection economically painful while allowing exits for genuine business reasons (e.g., tech failure). Penalizing costs (not the pot) avoids incentivizing sabotage.  
  2. **Third-Party Escrow for IP:**  
     - Deposit all IP into a neutral escrow upon creation. If a party exits, predefined terms (not unilateral claims) govern IP splits.  
     - **Why it works:** Prevents "hold-up" threats during milestones ("give us more or we walk with the IP").  

  *Do not pursue "binding commitments" to stay until Milestone 8.* This is unenforceable (courts won’t compel R&D) and encourages reckless spending.  

  ### 5. **The "Stubborn Partner" Strategy: Use Sparingly**  
  Deliberately appearing committed to cooperation *can* deter partner defection—but it’s high-risk:  
  - **Pro:** If the partner believes we’ll stay in unconditionally, they may cooperate to avoid losing the end prize.  
  - **Con:** If they see this as naiveté, they may exploit us by exiting later.  
  **Recommendation:** Signal resolve through actions (e.g., fast-tracking early deliverables), but *do not bluff*. If we lack high confidence in the partner after Milestone 3, pull out.  

  ### 6. **When to Walk Away**  
  Backward induction becomes self-fulfilling **only if** we’re certain the partner:  
  - Is hyper-short-term focused,  
  - Has no stake in our future relationship,  
  - Views the end-game pot as unrealistically risky.  
  **If due diligence suggests this is true (e.g., partner is a financially distressed speculator), reject the deal.**  

  ### 7. **Summary & Actions**  
  | **Decision**                | **Rationale**                                                                 |  
  |-----------------------------|-------------------------------------------------------------------------------|  
  | **Sign the deal**           | Potential upside dwarfs early-risk if partner isn’t purely opportunistic.     |  
  | **Stay in through M1–M3**   | Early gains > defection rewards; learn partner’s true colors.                 |  
  | **Demand exit penalties + IP escrow** | Aligns incentives; prevents "hold-up" games.                     |  
  | **Be predictably cooperative, not stubborn** | Build trust without inviting exploitation.                   |  

  **Timeframe:** Negotiate safeguards within 2 weeks. If partner refuses, walk away.  

  **Bottom Line:** Counsel’s "defect immediately" strategy protects against the worst-case partner but guarantees a $0 outcome. In the real world—where trust, reputation, and uncertainty exist—staying in early unlocks transformative value. Proceed, but hedge intelligently.  

  ---  
  **Approx. length:** 1.3 pages // **Jargon-free per CFO request**
