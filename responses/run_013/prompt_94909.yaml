  The core idea is to have a speaker making the same boring claim multiple times ("the 8:15 is running late") but closing each stanza with different epistemic tags: "I know it," "that's just true," "I believe it," "I'm pretty sure." The key is making these tags feel non-interchangeable - showing that only one truly licenses the assertion.

  There needs to be a turn where the speaker realizes they only had a hunch that panned out, forcing a retraction specifically because of the knowledge tag. Also crucial is including a moment where "how do you know?" functions as a challenge to entitlement rather than evidence request.

  Importantly, the poem shouldn't be a clean win for the knowledge norm. I need to include:
  - A case where speaker is justified/sincere but wrong (no epistemic wrong)
  - A case where claim is true/sincerely believed but assertion still feels wrong (like "my ticket isn't going to win")

  Constraints:
  - No philosopher names
  - No resolution - leave room for seminar debate
  - Maintain 18-22 line count
  - Changing refrain essential

  I'll structure it in five stanzas:
  1) Knowledge norm (showing entitlement matters)
  2) Truth norm (false but justified assertion)
  3) Belief norm (true but inappropriate assertion)
  4) "Pretty sure" as weak justification
  5) The turn revealing lack of knowledge

  The retraction should feel specifically tied to the knowledge claim failing. The "how do you know?" moment will appear in the first stanza to establish entitlement as distinct from evidence.

  For the non-knowledge cases:
  - Stanza 2: "Train's delayed" - false but speaker not blamed
  - Stanza 3: "My ticket won't win" - true but assertion inappropriate

  The refrain will evolve from certainty to doubt. Final stanza reveals the hunch and forces retraction only for the knowledge claim, leaving other norms standing.

  This should create the desired debate - knowledge seems special in retraction context, but other cases complicate the picture. The ending stays unresolved, inviting seminar discussion.
answer: |-
  ## Final Assertion Exercise

  The 8:15 is running late,
  The platform sighs, the schedule lies,
  I tell the man who checks his watch:
  *The 8:15 is running late — I know it.*
  He frowns: "And how exactly do you know?"
  (My warrant cracks, the solid ground gives way).

  The train's delayed, the guard confirms,
  I told you so, the minutes crawl,
  A stranger nods at my report:
  *The train's delayed — that's just true.*
  (Though later, facts shift, rails concealed a fault —
  My words were sound, the world went wrong instead).

  My ticket isn't going to win,
  A careless boast, a tempting chance,
  He eyes the stack, the hopeful queue:
  *My ticket isn't going to win — I believe it.*
  (And though it lost, the claim felt cheap, unearned,
  A truth that shouldn't pass the lips just yet).

  The keys are on the hook by noon,
  The morning rush, the frantic search,
  I soothe your stress, so quick to speak:
  *The keys are on the hook — I'm pretty sure.*
  (A hunch confirmed, a likely guess made good,
  The hook held steel, the guesswork paid its dues).

  ...But was it *knowing*? Only hope,
  A pattern sensed, no source revealed.
  The keys *were* there, belief held fast, truth shone —
  Yet knowledge fled. The claim requires recall:
  *The keys were on the hook... I thought I knew...*
  (My tongue retracts the knowing, leaves the rest
  To argue on the platform, in the air).
