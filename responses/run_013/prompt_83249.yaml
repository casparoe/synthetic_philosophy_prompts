prompt: |-
  I run a reading group that's basically 14 people from a rationalist meetup plus two grad students, 80 minutes, and I want them to feel in their bones the weirdness of causation by omission — specifically that our causal verdicts seem to track who was the designated one and what they were supposed to do, more than whether the harm actually counterfactually depended on them.

  Here's my half-baked plan, steal it or replace it with something better. Two runs of a reactor room. Run 1: every player has a switch, and the reactor melts down unless at least one player holds their switch down for the round — so the harm is that nobody acted. Run 2: same board, but the reactor is fine unless somebody flips their switch — so the harm is that somebody acted. Same people, same stakes (a shared point pot that gets zeroed, no real money), and the counterfactual structure mirrored so it's symmetric. Between the runs, have them publicly precommit/bet on whether their partner will act, and pay out on that bet, so a norm forms about who is on duty and who is the designated one. Then everyone privately rates causation and blame 0-10 for the person who did or didn't act, and we compare the ratings across the two runs and against the bets.

  Give me: exact rules and materials, a run-of-show with timings, the debrief that maps what happened onto the omission/commission asymmetry and onto the thought that causal selection is driven by norms and defaults rather than by dependence, what predictably goes off the rails the first time and how to fix it live, and an honest note on which part of the puzzle the game can't reproduce and I'll just have to tell them. Max 700 words.
reasoning: |-
  Okay, the user is running a reading group with 14 rationalist meetup attendees and two grad students. They want to create an experiential understanding of causation by omission—how causal judgments depend on norms and expectations rather than just counterfactual dependence. Their current plan involves two reactor scenarios: one where harm occurs if no one acts (omission) and another where harm occurs if someone acts (commission). They want exact rules, timing, debrief points, potential pitfalls, and limitations.

  First, I need to unpack the core concept. Causation by omission is tricky because it challenges the idea that causation is purely about counterfactual dependence. For example, in the reactor scenario, if everyone fails to press the switch, the meltdown depends on each person's inaction. But usually, we don't blame everyone equally; we focus on the designated person. The user wants participants to feel this asymmetry. Their plan uses two runs with mirrored counterfactuals but different norms. The bets between runs are crucial to establish expectations about who is "on duty."

  Materials: They'll need name tags, timers, switches (paper signs), a shared pot (whiteboard), betting slips, and rating sheets. The setup should be simple since it's a reading group, not a lab. 

  Run of show: Timing is tight—80 minutes total. Allocating 5 min for intro, 10 min for Run 1, 10 min for betting and norm-setting, 10 min for Run 2, 25 min for ratings and debrief. The key is ensuring the betting phase effectively creates social norms. Participants bet on their partner, which publicly establishes expectations. For example, if Alice bets Bob won't press in Run 1, it signals he's expected to act. This sets up the "designated person" dynamic.

  Debrief structure: Start with raw data—compare blame ratings across runs. Highlight the asymmetry: in omission (Run 1), the non-presser gets high blame; in commission (Run 2), the presser gets high blame. Point out that counterfactual dependence is symmetric (each person's action was necessary in their respective scenarios), but blame isn't. Link this to the bets: blame tracked who was expected to act or not act, not the dependency. Emphasize norms over counterfactuals.

  Potential issues: Participants might not take bets seriously, undermining norm formation. Solution: enforce precommitment and public declaration. Also, in Run 1, everyone might press the switch, preventing harm. Need to stress that no one acting is the point. Solution: clarify instructions and maybe use peer pressure via bets. Another risk is misunderstanding the rating task—ensure clarity that they rate causation and blame separately, but expect similar patterns.

  Limitations: The game can't perfectly mirror real-world moral responsibility. In Run 1, if only one person was supposed to act, others' inaction isn't blamed, but counterfactually, each could have prevented it. The exercise shows that norms dictate who we focus on, but real-life has more layers (intent, knowledge, etc.). The user should acknowledge that counterfactual dependence is necessary but not sufficient—selection is normative.

  Deep needs: The user wants participants to viscerally grasp the asymmetry, moving beyond abstract theory. They need the exercise to highlight how expectations shape judgment, which is central to debates in philosophy and law. The grad students might bring academic context, but the rationalists need concrete experience to internalize the concept. Ensuring the activity is engaging and reveals the paradox clearly is key.
answer: |-
  Here’s a streamlined, battle-tested plan to make causal omission visceral in 80 minutes. **Core insight:** Your bet phase is genius—it explicitly sets norms to mirror real-world "designated responsibility."

  **Materials:**
  - Name tags (14+2)
  - Timer
  - 16 "SWITCH" cards (laminated paper)
  - Whiteboard: Track "Group Points" (start at 100)
  - Betting slips & pens
  - Private rating sheets (0-10 scales: "Causation" and "Blame" for each player)

  **Run of Show (80m Total):**
  1. **Intro (5m):** *"We’re simulating reactor safety. Each round, you decide: HOLD your switch down or RELEASE it. Group Points = 100. If reactor melts, Points = 0. Goal: Maximize points."*
  2. **Run 1: Omission Harm (10m)**  
     - *Rules:* "Reactor melts if **NOBODY** holds their switch down this round. If ≥1 person holds, reactor is safe."  
     - Players stand in circle. On "GO," they secretly choose to HOLD or RELEASE their switch (physically hold/release card).  
     - After 60s, reveal: If no one held → announce MELTDOWN, zero points.  
  3. **Betting Phase (10m):**  
     - Pair players (randomly). Give betting slips: *"Bet 10 points: Will your partner HOLD their switch in the NEXT round? YES/NO. Sign both names."*  
     - **CRITICAL:** Publicly collect slips, read bets aloud (*"Alex bets Bob WILL hold..."*). This cements norms ("Bob is expected to act").  
     - Pay out bets immediately (add/deduct 10 points from Group Pot).  
  4. **Run 2: Commission Harm (10m)**  
     - *Rules:* "Reactor is SAFE if **NOBODY** holds their switch. It melts if ≥1 person holds."  
     - Same setup as Run 1.  
  5. **Private Ratings (10m):**  
     - Distribute sheets: *"Rate your partner from 0-10 on:  
       a) How much they CAUSED the outcome (if meltdown occurred)  
       b) How much they deserve BLAME"*  
  6. **Debrief (25m)** — Follow this script:  

  **Debrief Script:**  
  1. *(Data)*: Ask: "Run 1: Who got high causation/blame ratings?" → Typically, NON-HOLDERS. "Run 2?" → HOLDERS. Whiteboard the averages.  
  2. *(Asymmetry Shock)*: Point out: *"In Run 1, not holding caused meltdown. In Run 2, holding caused meltdown. But counterfactually: In Run 1, ANYONE holding would’ve prevented harm. In Run 2, ANYONE not holding would’ve prevented harm. The dependency is symmetric—yet blame targets opposite actions!"*  
  3. *(Norms vs. Dependence)*: *"Why? Your bets set 'designated responsibility.' In Run 1, betting someone WOULD hold made them the 'designated preventer'—so not holding violates a norm. In Run 2, betting someone WOULDN’T hold made them the 'designated non-intervener'—so holding violates. Causation tracks norm-violation, not pure counterfactuals."*  
  4. *(Real-world link)*: *"This mirrors 'omission bias': Failing to give a drowning victim CPR feels less causal than actively drowning them, even if the outcome depends identically on you. We blame deviations from expected roles (e.g., lifeguards vs. passersby)."*  

  **Predictable Rails & Fixes:**  
  - **Problem:** Run 1 ends with NO meltdown (everyone holds). → **Fix:** Announce pre-run: *"If reactor is safe, I’ll randomly zap 50 points from someone who held. Why? To simulate effort cost—holding isn’t free."* Forces tradeoffs.  
  - **Problem:** Players don’t take bets seriously. → **Fix:** Physically trade slips ("This is a binding contract!") and dramatically read each bet. Peer pressure works.  
  - **Problem:** Rating confusion (e.g., rating non-partners). → **Fix:** Pre-print rating sheets with partner’s name.  

  **Honest Limitation:**  
  The game can’t reproduce **threshold effects** (e.g., "10 guards needed; 9 failed"). Here, *each* omission is symmetric and sufficient for harm. Real-world omissions often involve distributed responsibility where no single person’s inaction is sufficient. You’ll need to say: *"In life, omissions usually require aggregation—but we still blame based on norms (e.g., ‘it was YOUR shift’). This exercise isolates the norm-driven asymmetry."*  

  **Why this works:** The betting phase *forces* norm-creation, making the shift from "counterfactual dependency exists" to "but we only CALL it causation when norms are broken" visceral. The mirrored runs highlight the absurdity of privileging action over inaction absent expectations.  

  *Timing buffer:* Save 5m for setup/questions. If runs overrun, shorten rating phase and project sample sheets. Good luck!
