  The user wants to know what this implies about composition - whether it's mind-independent or convention-dependent. They also ask which metaphysical views could accommodate these practices, mentioning nihilism (only particles), universalism (any collection composes something), and conceptualism (composition depends on human categories). 

  Hmm, the trade-fixture wrinkle is crucial here - it shows purpose matters more than physical attachment. That weakens any claim that the attachment test reflects mind-independent facts. Meanwhile, the persistence practice seems pragmatic: treating the house as the same entity simplifies legal processes despite part changes, but major destruction triggers safety regulations. 

  I should emphasize these are separate questions: composition (what counts as part of the house) versus persistence (when it remains the same house). The practices don't reveal deep metaphysical commitments but rather legal pragmatism. For instance: 

  - Universalism could accept both practices as useful fictions 
  - Nihilism would need to explain why we act as if houses exist 
  - Conceptualism fits best but isn't strictly necessary 

  The user seems sophisticated - they explicitly welcome having their puzzle called confused! So I shouldn't force reconciliation. Key disclaimers: 
  1) Legal practices prioritize predictability over metaphysical truth 
  2) The "half-destroyed" threshold is purely conventional 
  3) Purpose trumps physics in the fixture test 

  Most radical implication: if we adopted conceptualism wholesale, little might change legally since the practices already rely on human purposes. But insurers might balk at treating a fully replaced house as "the same" entity for risk assessment. 

  Biggest tension spot: The persistence practice pretends identity survives part replacement while the destruction threshold ignores identity entirely. This confirms they're answering different questions. The user's assumption that these must cohere metaphysically is what creates the illusion of conflict.
answer: |-
  Your puzzle isn't confused—it exposes a genuine tension between legal pragmatism and metaphysical commitments. Here's a breakdown of what the practices presuppose, which theories they rule out, and where they remain underdetermined:

  ### Core Presuppositions & Tensions
  1.  **Two Distinct Questions, Not One:**
      *   **Composition (Fixture Test):** "When do these parts *become* part *of the whole house/building?"* The answer relies on **attachment + purpose**. Bolting shelves makes them part of the house *if* the purpose is to serve the building itself. The tenant's shelves show purpose overrides physical attachment. **Presupposition:** Composition depends on human intentions/uses within a context.
      *   **Persistence (Grandfathered House):** "When does this whole house *remain the same house* despite part changes?" The answer relies on **functional and legal continuity**. Replacing parts one-by-one maintains the identity for deeds, taxes, and insurance because the *function* (being a dwelling) and *legal status* (the parcel, the deed) persist uninterrupted. The destruction threshold (e.g., 50%) breaks this continuity because the *function* is catastrophically interrupted, triggering a reset for safety regulations. **Presupposition:** Persistence of a functional/legal entity depends on gradual change and continuity of role/identity, not part identity.

  2.  **The Inconsistency Resolved:** The tension arises only if you assume the *same* question ("What is the house?") is being answered twice. It isn't.
      *   The fixture test defines the **boundary** of the house *at a specific time* (what counts as part of it *now*?).
      *   The persistence practice defines the **temporal identity** of the house *over time* (is this *thing* here today the *same* legal/functional entity as the *thing* that existed yesterday, even if its parts changed?).
      *   **The "Half-Destroyed" Threshold:** This isn't denying the house *was* the same house moments before the fire. It's declaring that *after* this catastrophic event, the *functional and legal continuity is broken* for the purposes of safety codes. The *entity* that existed is gone; what remains is treated as a new starting point. The threshold is a pragmatic legal line, not a metaphysical revelation.

  ### Which Rival Views Are Ruled Out?
  1.  **Mereological Nihilism (Only Particles):** **Cannot** run the practice unchanged.
      *   *Why?* The entire practice relies on treating "houses," "fences," "ovens," etc., as real, persisting wholes with defined boundaries. Lenders lend against *the house*, insurers insure *the house*, deeds convey *the house*. Nihilism denies these wholes exist. While a nihilist could *describe* particle arrangements, the *practice* of attributing ownership, value, identity, and persistence *to the whole* is central and ineliminable. The trade-fixture wrinkle (purpose) is especially alien to fundamental particles.

  2.  **Unrestricted Mereological Composition (Universalism - Any Collection Composes Something):** **Could technically** run the practice, but it would be pointlessly complex and ignore the practice's selectivity.
      *   *Why?* Universalism says *any* arbitrary collection of particles composes an object. The legal practice cares *only* about collections deemed significant by human purposes (houses, fixtures, personal property) and ignores the vast majority of universalist composites (e.g., the object composed of your left shoe, the moon, and a specific electron in a distant star). The practice actively *selects* which composites matter based on attachment, purpose, and function. Universalism doesn't *contradict* the practice, but it fails to explain *why* only certain composites have legal significance, rendering it irrelevant to understanding the practice's logic. The purpose-driven trade-fixture rule highlights this selectivity.

  3.  **Brutal Composition (Fact of the Matter Independent of Us):** **Is ruled out** by the trade-fixture wrinkle.
      *   *Why?* If composition were a brute, mind-independent fact about the universe, the *same physical attachment* (bolts) should *always* determine whether the shelves are part of the building. The fact that identical physical attachment leads to different outcomes (part of the building vs. tenant's property) *based solely on human purpose* demonstrates that the "fact of the matter" is constituted by human interests and conventions, not discovered in the physical world.

  ### What the Practice Strictly Requires vs. What it Fits With
  *   **Strictly Requires:**
      *   A distinction between "part of the building" and "separate object" must be made.
      *   This distinction *must* be predictable and stable enough for legal/financial transactions.
      *   Physical attachment is a *common heuristic* but **not sufficient** (trade fixtures prove this).
      *   **Purpose/Function is the core operative criterion** for the composition question (fixture test). *Why* is it attached? Does it serve the building or the occupant's activity?
      *   Functional/Legal Continuity is the core criterion for persistence over time.
      *   A catastrophic event can break this continuity, triggering a regulatory reset.
  *   **Fits Well With (But Doesn't Strictly Require):**
      *   **Conceptualism / Conventionalism:** The practice strongly suggests composition and persistence are determined by our concepts, categories, purposes, and legal/social conventions. The trade-fixture rule is a smoking gun for this.
      *   **Functionalism (for persistence):** The house persists as long as its function (providing shelter on that parcel) and legal identity persist, even with part replacement.
      *   **Gradualism (for persistence):** Identity survives gradual change but not catastrophic change.
  *   **Underdetermined:**
      *   **The *Precise* Metaphysics of Persistence:** The practice requires *some* principle of continuity, but doesn't specify if it's spatiotemporal continuity of a core part (the frame?), continuity of form, or purely conventional continuity. The "original frame" example is suggestive but not definitive (what if *that* was replaced too?).
      *   **The *Exact* Destruction Threshold:** Why 50% value? Why not 40% or 60%? This is purely conventional and pragmatic, not metaphysically grounded. Different jurisdictions use different thresholds.
      *   **The Scope of "Purpose":** How finely do we define purpose? The practice gives examples but doesn't provide a complete theory. This is where borderline cases arise (e.g., a custom-built, built-in aquarium).

  ### Replacing with Conceptualism: Consequences
  If we explicitly adopted "composition is solely a matter of our concepts/conventions, not mind-independent facts":
  *   **Real Estate (Fixtures):** **Minimal Change.** This is *already* how the fixture test works (purpose/convention rules). The practice might become *more* comfortable with borderline cases being settled by explicit agreement or precedent, knowing there's no deeper "fact."
  *   **Insurance (Persistence/Identity):** **Significant Potential Change.** Treating the fully replaced house as "the same" house is a pragmatic/conventional move. A strict conceptualist insurer might argue that replacing *every* part means it's a *new* object, potentially resetting coverage terms, premiums, or warranties based on the "age" of the *current parts*. The current persistence rule relies heavily on legal/conventional continuity overriding part identity.
  *   **Code Enforcement (Destruction Threshold):** **Minimal Change.** The threshold is *already* a pragmatic, conventional line drawn for regulatory purposes. Conceptualism aligns perfectly with this. The "grandfathering" itself is a legal convention about persistence.

  ### Conclusion: Confusion Dispelled
  1.  **Two Questions:** You've identified two distinct practices answering two distinct questions: **Composition (Boundary)** vs. **Persistence (Temporal Identity)**.
  2.  **Core Commitment:** Both practices are fundamentally **pragmatic and conventional**. They prioritize predictability, functionality, and human purposes over discovering mind-independent metaphysical truths.
  3.  **Rival Views Ruled Out:** The practice **rules out Brutal Composition** (due to trade fixtures) and **cannot be run by a Nihilist** without abandoning its core. Universalism is compatible but irrelevant.
  4.  **Best Fit:** The practice **strongly fits Conceptualism/Conventionalism**, especially for composition (fixture test). Persistence relies on functional/legal continuity, which is also conventional.
  5.  **Damage Control:** Your most significant (and understandable) assumption causing tension was that the fixture test and the persistence practice were addressing the *same* underlying question about the nature of the house-as-object. They aren't. One defines its spatial/part boundaries at a time, the other defines its identity over time under gradual change. The destruction threshold shows that even this persistence is conditional on catastrophic loss not breaking the functional/legal continuity.

  The practices reveal a sophisticated legal superstructure built on human interests, purposes, and the need for stable conventions, not a window into the fundamental mereological structure of reality. The trade-fixture rule isn't just a wrinkle; it's the key that unlocks the conventional core of the entire system.
