answer: |-
  1.  **Headline credence that selective realism defuses PMI:** 0.60. I find it moderately plausible because it addresses the core of PMI by denying that entire past theories were false, focusing instead on the survival of specific, predictively successful elements, aligning with documented cases of retention (e.g., Fresnel's equations). However, significant challenges regarding circularity and historical fit limit higher confidence.

  2.  **Probability of a principled, advance-statable criterion:** 0.30. Defining criteria like "working posits" or "essential structure" robustly *before* successor theories exist is extremely difficult; current proposals (e.g., Psillos's "working posits") often rely tacitly on hindsight or face counterexamples (e.g., what was "working" in caloric theory?).

  3.  **Probability a criterion fits the full historical record (non-selectively):** 0.40. While selective realists point to successes (e.g., Maxwell's equations), the record is messy. Many "working" parts were *not* retained as conceived (e.g., Newtonian mass/force), and cherry-picking cases is a major weakness; a truly universal criterion struggles with radical changes like phlogiston to oxygen or classical to quantum fields.

  4.  **Probability it *explains* success rather than redescribes it:** 0.35. High risk of circularity: we typically identify "working parts" *because* they were retained in successful theories. This feels like retroactive labeling ("successful because retained, retained because successful") rather than an independent explanation for *why* those parts conferred success, potentially undermining the "no-miracles" motivation for realism.

  5.  **Combination and sensitivity:** My headline (1: 0.60) incorporates an expectation that (2-4) are possible but unlikely. The final figure is most sensitive to **(4) Explanation vs. Redescription** – if this were resolved (e.g., an independent marker for "working" parts pre-successor), credence would rise sharply (e.g., +0.30). Strong evidence like a clear historical case where a theory's "working part" was explicitly identified *in advance* and later retained would increase it; widespread evidence of abandoned "working" parts or circular definitions would decrease it.
