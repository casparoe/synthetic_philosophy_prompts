prompt: |-
  I sit on a county fatality review panel that examines the deaths of adults with intellectual and developmental disabilities living in licensed group homes. We take up three or four deaths a month. I have no training in philosophy — I spent twenty years in freight logistics before this — but the panel's central question is one I have been chewing on by myself for a long time: when a resident dies and the people responsible for them did not do something, did their not doing it cause the death? Our reports go to the state licensing agency and get quoted in the local paper, so the wording matters to real people's jobs and to the facility's license.

  Our current practice is to write findings the way a lawyer would, asking only whether the death would have been avoided had the thing been done, then letting the panel argue over whether to attach the word cause. It goes badly. Two members reviewing the same file come back with opposite findings, and the strength of the language in our public report depends on who happens to be in the room. I want a written procedure the panel can run, case by case, to decide whether a given omission is a cause of a death. Ground it in whatever philosophy has worked out about causation by omission, because I think our problem is philosophical rather than merely editorial.

  Here are the pieces I have managed to get straight on my own, and that the procedure has to handle. An omission is not an event: there is no place and no moment at which it happened, so the ordinary test — had she done it, the death would not have occurred — is carrying a great deal of weight, and I suspect it is carrying too much. For any death there are countless things nobody did, and something has to pick out the one or two omissions we are willing to call causes; I do not believe the counterfactual test alone can do that picking. My own hunch is that what does the picking is the presence of a duty or an expectation — that a norm was in play — which would mean our findings are partly judgments about what people owed one another, dressed up as findings about what happened. And the same omission can belong to a person, to a shift, or to an institution, and I do not know how to say which of those caused the death when the honest answer is a bit of each.

  The procedure should be an ordered list of questions, with a rule for when to stop, what counts as a sufficient answer at each step, and an explicit mark at the points where the step is not a factual test at all but a decision about what standard to hold people to. Those are the steps I need to be able to point to, because the board will ask. It must be runnable by me in under an hour with the file open, with no philosopher in the room, and it must produce findings that survive a lawyer and a nurse on the panel taking them apart.

  Then run it on three cases: a resident in status epilepticus whose aide did not call for an ambulance at the threshold written into the protocol; a resident who choked during a meal on a shift when the home was one aide short of its licensed staffing ratio, where the missing aide would have been in a different room and probably could not have helped; and a resident who died of an untreated infection after a family member refused the treatment and the physician did not press the point.

  One of those three should come out in a way the panel will not like, and I want you to say so plainly, since I will be the one presenting it. Finish by telling me what the procedure cannot do, and where it will hand me a confident-looking answer that a better philosopher would call arbitrary.
reasoning: |-
  Okay, this is a profound and urgent request. The user sits on a fatality review panel for adults with IDD in group homes, wrestling with how to attribute causation in deaths involving omissions. They've identified core philosophical problems: omissions aren't events, counterfactuals alone are insufficient, norms/duties matter, and causality distributes across individuals/shifts/institutions. Their need for a concrete procedure is practical - reports affect licenses and livelihoods.  

  First, I need to unpack their implicit tensions:  
  - Legal precision vs moral responsibility: The lawyerly "but-for" test feels inadequate because it ignores why an omission matters.  
  - Fact vs norm: They suspect causation judgments secretly rely on ethical standards about owed care.  
  - Distributed blame: When systems fail, pinning "cause" feels reductive.  

  Their three test cases are brilliantly chosen to stress-test different dimensions:  
  1. Clear protocol breach (epilepsy case) - tests duty/norm boundaries  
  2. Systemic understaffing (choking case) - probes institutional vs individual causality  
  3. Third-party refusal (infection case) - examines chain of responsibility  

  For the procedure, I'll adapt Hart & Honoré's causal model which distinguishes:  
  - Necessary conditions (but-for causes)  
  - Causal responsibility (intervening agency)  
  - Attributive responsibility (duties/roles)  
  This bridges their instinct about norms with legal robustness.  

  The key innovations in the procedure are:  
  - Separating factual causation from normative attribution  
  - Explicitly flagging "normative thresholds" where judgments occur  
  - Requiring tracing through the chain of responsibility  

  For the epilepsy case, the procedure should clearly flag the aide's breach as causal - it's the strongest link. The choking case will frustrate the panel because staffing ratios feel culpable, but the causal chain breaks. The infection case exposes how family refusal shifts blame - the procedure will likely exonerate staff, which may feel unjust.  

  Crucially, I must warn where the procedure is arbitrary:  
  - Step 3's "reasonably expected" standard is inherently subjective  
  - Step 5's institutional attribution depends on foreseeability - always debatable  
  - The model can't resolve moral responsibility vs legal causation  

  This gives the user what they need: a defensible framework with clear philosophical grounding, explicit judgment points, and predictable outcomes - even uncomfortable ones. The test cases will prove it's not a rubber stamp.
answer: |-
  Here is a procedural framework grounded in philosophical work on omissions (primarily drawing on Hart & Honoré's *Causation in the Law* and counterfactual theories, adapted for your practical needs). It explicitly separates factual analysis from normative judgment and flags where standards are applied.

  **Procedure: Determining Causation by Omission in Fatalities**

  1.  **Identify the Specific Omission(s) Alleged:**
      *   *Question:* Precisely what action (or sequence of actions) was *not* performed, by whom (specific individual, shift role, institution), and during what relevant timeframe?
      *   *Sufficient Answer:* A clear, specific description of the omitted act(s) and the actor(s) responsible for it *based solely on established protocols, care plans, or explicit duties* documented in the file. (e.g., "Aide A did not check Resident B's pulse/respiration per hourly protocol between 02:00-03:00"; "Nursing Supervisor did not contact physician within 15 minutes of documented vital sign abnormality X").
      *   *Stop if:* No specific, duty-bound omission is alleged and documented. Proceed if omission is identified.
      *   *Normative Flag:* None. This is purely descriptive based on records.

  2.  **Establish the "But-For" Condition (Necessity):**
      *   *Question:* Is it true, *on the balance of probabilities based on medical/forensic evidence*, that the death would *not* have occurred *at the specific time and in the specific manner it did* if the omitted action *had* been performed?
      *   *Sufficient Answer:* "Yes" requires credible medical/forensic evidence showing the omitted action was highly likely to have interrupted the fatal sequence *in this specific instance*. "No" if the evidence shows death was inevitable regardless, or the link is speculative/remote. "Uncertain" if evidence is inconclusive.
      *   *Stop if:* Answer is "No" or "Uncertain". **Conclusion:** The omission was *NOT* a factual cause of death. (Note: It might still indicate a systemic failure, but not causal for *this* death).
      *   *Normative Flag:* None. This is a factual (though probabilistic) assessment based on evidence.

  3.  **Assess Causal Salience / Absence of Intervening Cause:**
      *   *Question 3a (Intervening Cause):* Was there a distinct, voluntary act or abnormal event *after* the omission and *before* death that became the primary immediate cause, breaking the chain? (e.g., sudden, unforeseeable cardiac arrhythmia unrelated to the omission; family member refusing life-saving intervention *after* staff omission).
      *   *Question 3b (Background Necessity):* Was the omission merely one of countless background conditions necessary for life (e.g., "staff didn't invent a cure for cancer")? Or was it a specific failure to counteract a *known, imminent, or actively developing threat* to *this* resident?
      *   *Sufficient Answer (3a):* "No Intervening Cause" if the omission's consequence flowed directly/foreseeably to death without significant independent intervention. "Intervening Cause Present" if a new, primary cause superseded it.
      *   *Sufficient Answer (3b):* "Salient Threat" if the omission related to managing a known, specific risk to the resident (e.g., known seizure disorder, aspiration risk, active infection). "Background Condition" if not.
      *   *Stop if:* Answer to 3a is "Intervening Cause Present" *or* Answer to 3b is "Background Condition". **Conclusion:** The omission was *NOT* a proximate/operative cause of death.
      *   *Normative Flag:* "Foreseeability" in 3a and "Known/Specific Risk" in 3b involve judgments about what *should* have been recognized, based on resident history and protocols. This is the *first normative threshold*.

  4.  **Establish Duty / Role-Based Expectation (The Normative Anchor):**
      *   *Question:* Was there a *specific, recognized duty or role-based obligation* incumbent upon the identified actor(s) (individual, shift, institution) *to perform the omitted action* for *this* resident at *this* time?
      *   *Sources:* Formal care plans, physician orders, state/facility licensing regulations, facility policies/protocols, professional standards of care (for nurses, etc.), contractual obligations.
      *   *Sufficient Answer:* "Clear Duty" if the obligation is unambiguous in the relevant source document(s). "Ambiguous/No Duty" if no such obligation exists or is unclear.
      *   *Stop if:* Answer is "Ambiguous/No Duty". **Conclusion:** The omission, even if but-for necessary, does not constitute a *culpable/causal omission* in this context. It was not *their* responsibility.
      *   *Normative Flag:* **Explicit Normative Judgment.** This step determines *which* omissions matter based on assigned roles and societal/institutional norms. It defines the "duty owed."

  5.  **Attribution Level (Who/What "Caused"):**
      *   *Question:* Given the answers above (Omission Identified, But-For Yes, Salient Threat/No Intervening Cause, Clear Duty), does the primary responsibility for the omission lie with:
          *   *An Individual:* A specific staff member failed their clear, personal duty.
          *   *A Shift/Team:* A collective failure during a specific period where roles/duties weren't fulfilled, but no single individual is solely responsible (e.g., communication breakdown).
          *   *The Institution:* Failure of systems, policies, resource allocation (staffing, training) or supervision that made the omission likely or inevitable, *even if* individuals/shifts technically failed. (Requires showing the systemic failure was a but-for cause and salient).
      *   *Sufficient Answer:* Based on duty assignment (Step 4) and evidence of *why* the omission occurred (e.g., individual negligence vs. chronic understaffing documented in logs vs. ambiguous policy).
      *   *Rule:* Can attribute to multiple levels if evidence supports (e.g., individual failed duty *and* institution failed to provide adequate training/supervision).
      *   *Normative Flag:* Judgment about *where* responsibility primarily lies within the chain of duty. Involves weighing systemic vs. individual factors.

  **Conclusion & Wording:**
  *   If all steps (1-4) are satisfied, state: **"The omission [describe] by [actor(s)] was a cause of the resident's death."**
  *   Add attribution from Step 5: **"Primary responsibility lies with [Individual/Shift/Institution]."**
  *   If stopped at an earlier step, state the conclusion clearly from that step (e.g., "The omission was not a factual cause of death," or "No specific duty to act existed in this context").

  ---

  **Running the Cases (Applying the Procedure):**

  **Case 1: Status Epilepticus (Missed Protocol Threshold)**
  1.  **Omission:** Aide did not call ambulance immediately upon observing seizure activity lasting X minutes (per explicit protocol).
  2.  **But-For:** Medical evidence shows earlier EMS intervention (within Y minutes) had high probability of stopping seizures/preventing death. **Yes.**
  3.  **Salience/Intervening Cause:**
      *   3a: Seizure continued unabated -> death. No intervening cause. **No Intervening Cause.**
      *   3b: Known seizure disorder, active status epilepticus is a salient, imminent threat. **Salient Threat.**
  4.  **Duty:** Protocol creates a clear, unambiguous duty for the aide to call at X minutes. **Clear Duty (Individual Aide & Institution via protocol).**
  5.  **Attribution:** Primary failure is the *Individual Aide* not acting on their duty. *Institution* may share if training on protocol was inadequate (needs evidence).
      *   **Finding:** **"The aide's omission to call EMS per protocol was a cause of death. Primary responsibility lies with the individual aide."** (Institution responsibility depends on training evidence).

  **Case 2: Choking (Understaffed Shift)**
  1.  **Omission:** Facility was staffed with N aides instead of N+1 (licensed ratio) on the shift. The *specific omission alleged* is the *absence* of an aide who *could have* been present (in the dining room?).
  2.  **But-For:** *Highly Speculative.* Could the missing aide, *if present in the dining room*, have intervened quickly enough to prevent death? Medical evidence on choking timelines is often unforgiving. Even if present, they might not have been *observing* that specific resident, been closer, or reacted effectively. **Answer: Uncertain or No (on balance of probabilities).**
  3.  **Stop at Step 2.** **Conclusion:** **"The facility's omission to meet the licensed staffing ratio was not established as a factual cause of this specific death."** (It's a *potential* system failure/regulatory breach, but causation for *this death* isn't proven).
      *   *Panel Dislikes This:* They will want to blame understaffing. The procedure forces focus on specific causation for *this event*, which is weak. It highlights the gap between systemic risk and specific causation.

  **Case 3: Untreated Infection (Family Refusal, MD Didn't Press)**
  1.  **Omission:** Physician did not take further action (e.g., counseling, ethics consult, protective services referral) after family refusal of treatment for a known, serious infection.
  2.  **But-For:** Would the resident have consented/agreed to treatment if the MD had pressed further? Unknowable. Would treatment have been successful if given later? Medical evidence needed. If infection was already untreatable, then **No**. If earlier treatment was likely effective, then **Yes** (but-for the *family's* refusal, not solely the MD's inaction). **Answer: Likely Uncertain or No.** (The family's refusal is the primary but-for cause; MD pressing *might* have changed their mind, but it's speculative).
  3.  **Stop at Step 2 (if But-For Uncertain/No).** *Alternatively, proceed cautiously:*
  4.  **Duty:** What is the physician's duty? To inform of risks? Yes. To obtain informed consent? Yes. To *override* competent family decision-makers (assuming they had authority)? Generally, no, without legal/ethical intervention. Duty to *initiate* protective measures if neglect suspected? Possibly, but requires evidence neglect was occurring. **Likely Ambiguous/No Clear Duty** to *force* treatment against family wishes via further pressure alone in this scenario. Clear duty might exist only if MD suspected abuse/neglect or the resident had means to express dissent.
      *   **Finding (Likely):** **"The physician's omission to pursue treatment more aggressively after family refusal was not established as a factual cause of death (But-For uncertain), nor was a clear duty to override the family's decision established in this context."** (Focus shifts to family consent process and whether neglect existed).

  ---

  **What the Procedure CANNOT Do & Where It's Arbitrary:**

  1.  **The "But-For" Probability Threshold (Step 2):** Deciding "on the balance of probabilities" that death *would* have been avoided is inherently probabilistic and often relies on medical judgment. Two experts might disagree. This is a point of unavoidable uncertainty the procedure must accept.
  2.  **Defining "Foreseeability" & "Salient Threat" (Step 3):** Judging whether an outcome was "foreseeable" or a threat was "salient" enough involves normative leaps about what reasonable caregivers *should* have anticipated, based on incomplete information. This is a major philosophical gray area.
  3.  **The Scope of "Duty" (Step 4):** While the procedure relies on documented sources, interpreting the *scope* and *force* of a duty (e.g., does "monitor" imply constant observation? How much "pressing" must a doctor do?) involves judgment. Defining "clear" duty can be contested.
  4.  **Attribution Weighing (Step 5):** Deciding whether the primary failure was individual, team-based, or systemic is often a matter of emphasis. The procedure requires evidence, but choosing *which* level bears the "primary" label involves judgment about where the most significant failure occurred.
  5.  **Capturing Cumulative Omissions/Systemic Drift:** The procedure focuses on *specific* alleged omissions. It may miss deaths caused by a slow erosion of standards or multiple small, undocumented failures over time, none of which individually meet the threshold.
  6.  **Moral Blame vs. Legal/Procedural Cause:** The procedure identifies omissions meeting criteria for "cause" in this review context. It *does not* directly equate to moral blameworthiness, criminal liability, or even the totality of responsibility. A finding of "no cause" here *does not* mean no failure occurred.
  7.  **The "Normative Thresholds" (Flagged Steps):** Steps 3 (Salience/Foreseeability) and 4 (Duty) are explicitly where philosophical judgment about norms and expectations enters. The procedure makes this visible but doesn't eliminate the inherent subjectivity. A "better philosopher" would rightly argue these steps embed contestable normative choices.

  **Presenting to the Panel:** Frame the procedure as a tool to bring consistency, transparency, and philosophical grounding to a deeply complex problem. Acknowledge upfront that it won't eliminate all disagreement (especially at the flagged steps), but it forces a structured analysis, separates factual from normative questions, and provides clear stopping points when causation isn't supported. Emphasize that a "no cause" finding for a specific omission *does not* preclude identifying significant care failures or systemic issues; it simply means the evidence didn't support that omission as a *cause of death* for the purpose of this specific review. Be prepared to defend the "Choking Case" outcome – it demonstrates the procedure's rigor in demanding specific causal links, even when the systemic failure feels intuitively culpable.
