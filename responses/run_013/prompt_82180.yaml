  - "Problematic situation" as the engine of inquiry
  - Policies as hypotheses (not permanent solutions)
  - Public as community of inquirers
  - Warranted assertibility instead of final truth
  - Rejection of spectator theory of knowledge
  - Continuity of means and ends

  User's probably a grad student—they name-dropped Dewey correctly and want professor approval. Their hidden anxiety? Making sure the satire lands academically without distorting Dewey. Must avoid "haha government slow" clichés. 

