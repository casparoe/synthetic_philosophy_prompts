prompt: |-
  I am assembling a requirements document for a theory of cross-temporal moral assessment — an account of when, and on what grounds, it is correct to praise or condemn people who acted under moral and epistemic conditions unlike our own — and I want the specification before I look at any candidate theory. Treat the following as a design brief rather than an essay prompt.

  Give me the desiderata: what any adequate theory in this area must deliver, each paired with the case or consideration that motivates it, and mark each as non-negotiable or as a preference of one camp. The deliverable is the list and the reasoning behind it, not a survey of who has said what, and not a reading list.

  The theory must get the standard cases right, at minimum: a statesman honoured for one achievement while bearing contested responsibility for a catastrophe in his own tenure; a slaveholder who drafted founding documents proclaiming universal rights; an explorer whose conduct drew objection from at least some of his own contemporaries; and a figure whose worst conduct was unremarkable by the standards of his time and place, so that almost no one around him objected. Add whatever constructed cases you need in order to force distinctions the standard ones leave ambiguous — for instance a figure whose moral failure lay in an omission rather than an act, and a figure whose reputation changed only because new evidence about consequences came to light.

  I expect the requirements to include, among others, and argued rather than merely listed:

  - what the target of assessment is — the act, the agent, the agent's character, or the agent's public legacy — and why different targets yield different verdicts about the same person;
  - the separation of the moral status of an act from the epistemic standing of the agent who performed it, and the fact that these can diverge;
  - the several distinct readings of the man-of-his-time defence (excuse from non-culpable ignorance, denial that there was any moral truth to violate, a claim about what it was reasonable to expect of anyone then) and which of them survive scrutiny;
  - a temporal-neutrality constraint: whatever rule is applied to them must be applied to us;
  - the problem of partial compliance — that nearly everyone then fell short, so that a verdict on one figure implicitly indicts a whole society;
  - structural versus individual causation, and whether a verdict on an individual is even warranted when the harm was produced by many hands;
  - foreseeability, outcome luck, and the treatment of consequences no one could have predicted;
  - respect-specific verdicts versus an overall verdict, and whether the theory is committed to a single bottom line about a person;
  - the practical function of the verdict — belief, honour, commemoration, blame — and whether one verdict can serve all of these;
  - revisability in light of new evidence, held together with the stability that any practically usable standard requires;
  - the selective application of the defence, and whether the theory can explain or must merely tolerate its asymmetry.

  Then tell me which single requirement does the most to exclude the most popular theories, and identify any pair of requirements you suspect cannot be jointly satisfied — that part I care about most. A table is acceptable for the requirement list, but the motivating case for each requirement should be stated in prose.
reasoning: |-
  Okay, let me approach this systematically. The user wants a requirements document for cross-temporal moral assessment, framed as a design brief rather than an essay. They've provided specific standard cases and additional constructed cases to force necessary distinctions.

  Hmm, the core challenge here is balancing multiple philosophical tensions while ensuring practical applicability. The user clearly wants rigor - they're anticipating theoretical conflicts and want to know where existing approaches fail. 

  First, I need to identify the non-negotiable constraints. Temporal neutrality stands out - any theory that doesn't apply equally to past and present would be self-refuting. The separation of moral status and epistemic standing is another bedrock requirement; conflating these leads to either presentism or moral relativism. 

  The constructed cases are crucial for testing boundaries. For the omission case (e.g. the factory owner who didn't investigate working conditions), we need to distinguish between failure to act versus inability to act. For the new evidence case (e.g. the doctor whose treatment later proved harmful), we must separate original intent from later-discovered outcomes.

  Ah, the partial compliance problem is particularly thorny. When nearly everyone in a society participated in something we now condemn (like slavery), condemning individuals might feel right but risks historical disconnection. Yet excusing them all seems morally vacant. This might be where the structural vs individual causation distinction becomes critical.

  I suspect the biggest tension will be between temporal neutrality and the man-of-his-time defense. If we excuse past agents for non-culpable ignorance, we must extend the same to present actors - but that could paralyze moral judgment. Yet without this, we fall into presentism. 

  The requirement that will exclude most popular theories? Probably the combination of temporal neutrality with stable revisability. Many theories either anchor too rigidly in present values or become endlessly fluid. The public legacy vs private character distinction might help here - allowing memorial practices to evolve while preserving historical assessment.

  For the "cannot jointly satisfy" conflict: partial compliance vs individual culpability seems fundamentally strained. If we condemn a slaveholder, we implicitly condemn their society - but if we excuse them because "everyone did it," morality collapses. The solution might lie in grading culpability based on deviation from contemporary critics, but that's messy.
answer: |-
  Here is the requirements specification for a theory of cross-temporal moral assessment, structured as design desiderata with motivating cases and classification. Requirements marked [N] are non-negotiable; others reflect contested preferences.

  ### Core Requirements Table
  | **Desideratum** | **Motivating Case** | **Classification** |
  |-----------------|----------------------|---------------------|
  | **1. Target Specification**<br>Must distinguish assessment of: <br>- Specific acts<br>- Agent's character<br>- Agent's public legacy<br>with clear criteria for when each is appropriate. | *Founding Document Author*: Praising the *act* of drafting liberty-affirming documents while condemning the *character* of a slaveholder. Legacy (e.g., monuments) may require separate treatment from private moral judgment. | [N] |
  | **2. Moral/Epistemic Separation**<br>Must decouple:<br>- Objective wrongness of an act<br>- Agent’s epistemic justification<br>and explain when ignorance exculpates. | *Catastrophe-Statesman*: Policies caused foreseeable harm (moral failing) vs. policies relying on uncontested bad science (possibly blameless ignorance). | [N] |
  | **3. "Man-of-His-Time" Distinctions**<br>Must resolve defenses into:<br>(a) Non-culpable ignorance (valid)<br>(b) Moral anti-realism (invalid)<br>(c) Reasonable expectations (context-dependent) | *Unremarkable Wrongdoer*: 18th c. colonizer expelling natives *with no contemporary critics* tests (a) vs. (c). Requires showing why (b) undermines all moral assessment. | [N] for (a)/(b) distinction; (c) contested |
  | **4. Temporal Neutrality**<br>Principles applied to historical agents must apply prospectively to us. | *Future Assessment*: Any standard excusing 19th c. carbon emissions due to ignorance must equally excuse our own potentially blind actions. | [N] |
  | **5. Partial Compliance Solution**<br>Must address whether widespread wrongdoing:<br>- Diminishes individual blame<br>- Or heightens responsibility for dissenters | *Society-Wide Harm*: Condemning a Roman slaveholder implicitly condemns most Mediterranean elites. Does societal participation reduce culpability ("everyone did it") or shift focus to structural critique? | Contested (Individualist vs. Structuralist camps) |
  | **6. Structural/Individual Causation**<br>Must clarify when individual blame is appropriate in systemic harms. | *Explorer's Conduct*: Columbus enabling colonial systems vs. personal atrocities denounced by contemporaries. Does systemic causation negate individual responsibility? | Contested |
  | **7. Foreseeability & Outcome Luck**<br>Must separate:<br>- Intended/foreseeable consequences<br>- Unforeseeable downstream effects | *New Evidence Case*: Doctor using 1920s standard treatment that later proved carcinogenic. Blame hinges on available knowledge, not later discoveries. | [N] for core separation |
  | **8. Respect-Specific vs. Overall Verdicts**<br>Must allow compartmentalized judgments (e.g., "brilliant scientist, deplorable collaborator") without requiring a single "score." | *Statesman with Mixed Record*: Honoring economic reforms while condemning foreign policy disasters. Demands rejection of "net goodness" approaches. | [N] |
  | **9. Function-Sensitivity**<br>Must specify how verdicts shift based on purpose:<br>- Belief (historical understanding)<br>- Honor (awards/commemoration)<br>- Blame (moral reckoning) | *Contested Monument*: Removing a statue (legacy-focused) differs from scholarly condemnation of character. One verdict cannot serve all purposes. | [N] |
  | **10. Stable Revisability**<br>Must permit updates for new evidence while resisting value drift. | *Omission Case*: Factory owner (1850) ignored worker safety. If new archives show he suppressed injury reports, blame increases—but core standards shouldn’t change with moral fashion. | [N] |
  | **11. Asymmetry Constraint**<br>Must explain or prohibit selective application of defenses (e.g., excusing past wrongs we benefit from while condemning contemporary analogues). | *Selective Defense*: Excusing "great" Victorians for colonialism while condemning modern sweatshop owners, though both cite economic necessity. | [N] |

  ### Constructed Test Cases
  1. **Omission Case**: 17th c. merchant aware of but ignoring brutal conditions on his ships. Tests culpability for inaction vs. inability to act.
  2. **New Evidence Case**: 1930s scientist promoting a chemical later found to cause ecological catastrophe, despite peer consensus on safety. Tests outcome luck vs. epistemic duty.

  ---

  ### Critical Pressure Points
  **Most Exclusionary Requirement**: **Temporal Neutrality [4]** eliminates dominant approaches:  
  - *Presentism* fails (applies stricter standards to the past).  
  - *Historicism* fails (if past standards excuse agents, future humans must excuse our ignorance—undermining current moral claims).  
  - Relativist theories violating [3b] also collapse.

  **Suspected Incompatible Pair**: **Partial Compliance [5] & Individual Culpability [6]**  
  - If societal wrongdoing *diminishes* individual blame ([5]), assessing explorers/statesmen as moral outliers becomes incoherent.  
  - If systemic causation *negates* individual blame ([6]), only structural critique remains—but this voids the project of *agent*-focused assessment.  
  - *Resolution requires*: Grading culpability by deviation from *accessible* contemporary standards (e.g., critics existed but were ignored), but this risks undermining Temporal Neutrality.

  **Secondary Tension**: **Stable Revisability [10] & Function-Sensitivity [9]**  
  - Commemorative practices (legacy) may *reasonably* change with societal values, while character assessment demands stability. A theory must reconcile this without contradiction.

  ---

  This specification forces theories to:  
  (A) Reject moral relativism while avoiding presentism,  
  (B) Handle systemic harms without dissolving agency,  
  (C) Serve multiple social functions without conflating purposes,  
  (D) Absorb new information without moral volatility.  
  The hardest trade-off lies in balancing **structural explanations** (which diffuse blame) with **individual accountability** (the project’s premise).
