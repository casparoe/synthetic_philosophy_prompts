prompt: |-
  I am considering a procedure that replaces my neurons one at a time with functionally identical silicon units, and I want to know whether the resulting subject would be me. Rather than adjudicating among theories of personal identity one at a time, I want the requirements any such theory must meet to be adequate to that question. Provide the list: the cases it must get right -- ordinary survival, death, amnesia, fission into two, fusion, the gradual replacement itself, and a constructed variant in which the replacement is gradual and behaviorally seamless but each removed neuron is used to seed a second system, so that two candidates exist at the end -- the distinctions it cannot collapse (numerical versus qualitative identity, survival versus continuity of consciousness, the person versus the organism), and the constraints it must respect from biology and physics. For each requirement, give the case or consideration that motivates it, mark which requirements are non-negotiable and which are preferences of particular camps, and flag any pair you believe cannot be jointly satisfied. Then identify the single requirement that does the most to exclude the main existing views, and say briefly which views it excludes. Keep the scoring to a minimum; the specification is what I need.
