prompt: |-
  A friend and I spent most of a long evening arguing about whether lottocracy is a real alternative to elections, and I would like to turn that argument into an activity for my upper-level seminar on democratic theory — sixteen students, one ninety-minute session. Design something that makes them run into two things I could not make land in conversation. The first is that a lottery can randomise who sits in the room while leaving the question they are asked, and the briefing they are handed, entirely with whoever commissioned the assembly — so the lot launders the question-setter's power rather than distributing it. The second is that deliberation destroys the independence on which a random sample's epistemic advantage depends: the group can become more confident and more agreed without becoming any more accurate. Neither point should be announced beforehand; the rules, the draws and the stakes should arrange for them to discover both.

  Have the response open with the activity's core mechanic in a single sentence, then give the design. Include the timings and staging; what is drawn by lot and what is not, and by whom; the materials (the motion, the briefing pack, the procedure for those not selected, and how the second run changes the rules); a stake that is real enough to matter without money; and a twenty-minute debrief that maps each moment of what actually happened onto the two points above, plus the expertise carve-out — whether any posts should be filled by election rather than lot — as something the facilitator has to raise rather than something the activity can show. Say what will predictably go wrong the first time I run it — I expect the unselected to disengage or turn resentful, and I expect one student to spot the loaded framing early and make everyone else perform suspicion — and what to do about each. Be frank about what the activity cannot reproduce: the scale, duration and bindingness of a real assembly, and anything about whether those on the losing side would accept the outcome. No bibliography or reading list; I want something I can run next term with a whiteboard, an envelope and a stack of index cards.
reasoning: |-
  We are designing an activity for a 90-minute seminar with 16 students. The activity must illustrate two key points without announcing them beforehand:

  1. A lottery can randomize who sits in the room but leaves the question and briefing in the hands of the commissioner, thus laundering power rather than distributing it.
  2. Deliberation can destroy the independence of a random sample's epistemic advantage, leading to increased confidence and agreement without increased accuracy.

  The activity will be structured in two runs. The first run will have a standard lottocracy setup. The second run will change the rules to address the second point.

  **Core Mechanic in One Sentence:**
  Students are randomly assigned roles as either commissioners (who set the question and briefing) or assembly members (who deliberate and decide) in two rounds, with the second round altering the information conditions to expose how deliberation undermines independence and how the framing of the question by the commissioners controls the outcome.

  **Detailed Design:**

  **Timing and Staging:**
  - Total time: 90 minutes
  - Introduction and setup: 10 minutes
  - First run (including drawing lots, deliberation, voting): 25 minutes
  - Transition and setup for second run: 5 minutes
  - Second run (with altered rules): 25 minutes
  - Debrief: 25 minutes

  **Materials:**
  - Whiteboard for recording votes and notes.
  - An envelope containing 16 index cards: 
    - 2 cards labeled "Commissioner" (for the first run only, as explained below)
    - 14 cards labeled "Assembly Member" (for the first run, but note that in the second run, the roles change)
  - A second set of 16 index cards for the second run (with two different roles, see below).
  - A "Briefing Pack" for the commissioners in the first run (prepared by the instructor) that includes:
    - A specific motion (e.g., "Should the university require all students to complete a course in data science?")
    - A one-page briefing note that presents arguments and data in a biased way (e.g., only presenting the benefits of data science and ignoring potential drawbacks, or emphasizing one perspective).
  - A different "Briefing Pack" for the second run (if needed, but note the change in roles) or the same one, but the procedure changes.
  - For the second run, we change the setup: the entire class is the assembly, but we break them into small groups with limited information to test independence.

  **Stake:**
  The decision will be presented as having real consequences: the instructor will write a summary of the outcome and the main arguments and send it to the department chair (or a relevant university official) as a student recommendation. This is real enough to matter (students know it might be read by someone in authority) but doesn't involve money.

  **Procedure:**

  **Introduction (10 minutes):**
  - Explain that the class will simulate a citizens' assembly to decide on a policy question.
  - Outline the roles: 
    - In the first run, two students will be randomly selected as "commissioners" who set the question and provide the briefing. The rest will be in the assembly.
    - The assembly will deliberate and vote on the motion provided by the commissioners.
  - Emphasize that the goal is to reach a well-reasoned decision.

  **First Run (25 minutes):**
  1. **Draw lots (5 minutes):** 
     - Shuffle the 16 cards (2 "Commissioner", 14 "Assembly Member") and have each student draw one. 
     - The two commissioners are given the Briefing Pack (with the motion and the one-sided briefing). 
     - The commissioners then present the motion and the briefing to the assembly. They can use the whiteboard to write the motion and key points.

  2. **Deliberation and voting (20 minutes):**
     - The assembly (14 students) deliberates on the motion. The commissioners may observe but not participate in the deliberation. 
     - After 15 minutes of discussion, the assembly votes by show of hands. The result is recorded on the whiteboard.

  **Transition (5 minutes):**
  - Acknowledge the outcome of the first vote.
  - Announce that the class will now run a second simulation with a twist to improve the process.

  **Second Run (25 minutes):**
  - **Change in rules:** 
    - The entire class (16 students) will now serve as the assembly. There are no commissioners. 
    - The instructor provides the same motion (without the one-sided briefing) and instead gives each student a short, randomly assigned fact or argument about the topic (written on index cards). Some facts are pro, some con, and some neutral. Importantly, each student gets only one card and is instructed not to show it to others until a specified time (if at all). 
    - The twist: The class is divided into four groups of four. Each group must deliberate independently without talking to other groups. Each group will reach a decision. Then, the groups will be brought together and allowed to share their group's reasoning and then vote as a whole assembly.
    - However, note that we want to show how deliberation can destroy independence. So we break into two stages:
      - Stage 1: Small group deliberation (10 minutes). Each group of four deliberates and records their group's vote (by show of hands within the group) and their main reason on a card.
      - Stage 2: Whole assembly (15 minutes): The groups come together. Each group reports their vote and reason. Then, the entire assembly deliberates and takes a final vote.

  **Debrief (25 minutes):**
  - Map the activity to the two key points:
    1. **Power of the commissioner:** In the first run, the commissioners set the question and the briefing. The assembly only deliberated on what was handed to them. Ask: How did the framing of the question and the briefing influence the discussion? Did the assembly feel like they had the full picture? Point out that the lottery only determined who was in the room, but the commissioners controlled the agenda and information. This is the "laundering" of power.
    2. **Deliberation and independence:** In the second run, each small group started with independent information (one fact per student). In the small groups, they shared and deliberated. Then in the whole group, they deliberated again. Compare the small group votes with the final vote. Did the groups become more confident? More agreed? But did they become more accurate? (Note: The instructor knows the facts and can point out if the final decision ignored key facts or overemphasized others.) Highlight that the independence of the random sample was lost in the deliberation, and groupthink may have set in.

  - **Expertise carve-out:** The instructor should raise the question: "In light of this, are there any posts that should be filled by election rather than lot? For example, should the commissioners be elected because they set the agenda?" This is not shown in the activity but must be raised in the debrief.

  **Predictable Problems and Solutions:**

  1. **Unselected students (commissioners in the first run) may disengage or become resentful.**
     - Solution: In the first run, the commissioners have an active role in presenting the briefing and then observing. Emphasize that their role is crucial. In the second run, everyone is involved. Also, the stake (the letter to the department chair) should keep everyone engaged.

  2. **A student spots the loaded framing early and makes everyone else perform suspicion.**
     - Solution: If a student points out the bias, acknowledge it as a valuable observation and ask how it affects the process. Use it as a teaching moment in the debrief. You can say: "That's a great point. How did the framing by the commissioners shape the discussion? Let's keep that in mind as we go through the activity and we'll come back to it in the debrief."

  **What the Activity Cannot Reproduce:**
  - **Scale and duration:** Real assemblies are larger and meet for days or weeks. Our simulation is compressed and small.
  - **Bindingness:** Our decision is only a recommendation, not binding. In real life, the stakes are higher.
  - **Acceptance by the losing side:** We don't have time to explore whether the minority accepts the outcome.

  **Materials Recap:**
  - Whiteboard and markers.
  - Envelope with index cards for the first run: 2 labeled "Commissioner", 14 labeled "Assembly Member".
  - Briefing Pack for the first run: one page with the motion and one-sided briefing.
  - For the second run: 16 index cards, each with a distinct fact/argument (some pro, some con, some neutral). Also, four cards for the small groups to record their votes and reasons.
  - A second envelope for the second run is not needed, just hand out the fact cards.

  This design should create the conditions for the students to experience both key points and then reflect on them in the debrief.
answer: |-
  ### Core Mechanic
  Students are randomly assigned as commissioners (who frame the question and briefing) or assembly members (who deliberate and vote) in a first run, then reconfigured into isolated small groups with fragmented information in a second run, forcing confrontation with agenda control and deliberation's erosion of independent judgment.

  ### Design  
  **Total Time:** 90 minutes (10m intro, 25m Run 1, 5m transition, 25m Run 2, 25m debrief)  
  **Staging:** Push desks into a central "assembly table" for 8 seats (Run 1) and four clusters of 4 desks (Run 2). Whiteboard tracks votes and key arguments.  

  #### Materials  
  - **Whiteboard:** For recording votes/rationales.  
  - **Envelope 1 (Run 1):** 16 folded index cards—2 labeled "COMMISSIONER," 14 labeled "ASSEMBLY MEMBER."  
  - **Commissioner Briefing Pack:** A sealed envelope containing:  
    - **Motion:** "Should this university mandate AI literacy exams for graduation?" (Deliberately narrow and tech-positive).  
    - **Briefing Note:** One page of cherry-picked data (e.g., "AI skills boost salaries by 20%!"; no downsides like bias/privacy).  
  - **Envelope 2 (Run 2):** 16 index cards, each with one unique fact/argument:  
    - 4 pro-motion (e.g., "Tech firms donate to our university").  
    - 4 anti-motion (e.g., "AI exams cost $500/student").  
    - 4 neutral/ambiguous (e.g., "50% of students fail baseline AI quizzes").  
    - 4 procedural (e.g., "Vote must consider equity impact").  
  - **Stake:** The class’s final vote will be compiled into a signed memo from you to the department chair, advocating for/against the motion as a "student consultative report." Real consequence (institutional visibility) without money.  

  ---

  ### Procedure  
  #### Intro (10m)  
  - Frame this as testing "real-world lottocracy." Rules:  
    - Run 1: Commissioners set the question/briefing; assembly deliberates/votes.  
    - Run 2: "Improved" process based on their feedback.  
  - Emphasize the stake: Their output goes to the department chair.  

  #### Run 1: Agenda Control Laundering (25m)  
  1. **Lot Draw (2m):** Students draw from Envelope 1. Two commissioners revealed.  
  2. **Commissioner Setup (3m):** Commissioners receive Briefing Pack. They read the motion aloud and summarize the briefing (using whiteboard). *They cannot alter the motion/briefing.*  
  3. **Assembly Deliberation (15m):**  
     - 8 assembly members are randomly selected (draw from remaining 14 cards) to sit at the central table.  
     - Non-selected students (6) observe silently as "public audience."  
     - Assembly discusses/votes on the motion. Observers take notes on "how framing shaped debate."  
  4. **Vote (5m):** Secret ballot; result tallied on whiteboard.  

  #### Transition (5m)  
  - Announce: "Run 2 fixes Run 1’s flaws: everyone participates, and information is balanced."  
  - Distribute Envelope 2 cards face-down. *Do not reveal the changed rules yet.*  

  #### Run 2: Deliberation vs. Independence (25m)  
  1. **New Rules (2m):**  
     - No commissioners. *You* provide the same motion.  
     - Students split into four groups of 4 (pre-assign groups; no choosing).  
     - Each student reads their index card fact *but cannot show it*. Groups deliberate *in isolation* (no inter-group talk).  
  2. **Small Group Phase (10m):**  
     - Groups deliberate. Each must record:  
       - A group vote (✔/✖).  
       - One sentence justifying their decision *using only their 4 cards’ facts*.  
     - Votes/rationales posted on whiteboard.  
  3. **Plenary Deliberation (8m):**  
     - Groups return to central table. Each shares their rationale.  
     - Open debate to change minds.  
  4. **Final Vote (5m):** Individual secret ballot; result tallied.  

  ---

  ### Debrief (25m)  
  **Map Activity → Key Points**  
  1. **Commissioner Power Laundering (8m):**  
     - "In Run 1, who controlled what the assembly even debated?" Highlight:  
       - Lottery chose *who* deliberated, but commissioners controlled *what* they deliberated **on** (motion) and **with** (briefing).  
       - Ask: "Did the assembly’s debate feel ‘free’? Or did the briefing box them in?" Tie to observer notes about ignored angles (e.g., no one discussed costs if briefing omitted them).  
     - **Point:** "The lot randomizes voices but not power—agenda-setting remains centralized, ‘laundering’ bias via a fair-seeming process."  

  2. **Deliberation’s Epistemic Trap (8m):**  
     - Contrast Run 2’s phases:  
       - *Small groups:* Independent facts → diverse votes/rationales (likely 2-2 split).  
       - *Plenary:* Groups persuade each other → consensus often emerges (final vote usually unanimous/majoritarian).  
     - Ask:  
       - "Did groups get *more confident* after debating? Did agreement increase? But did accuracy? How many unique facts survived the plenary?" (Often, 1-2 dominate; others forgotten.)  
       - "If your fact was ignored, why?" (Students admit louder/confident peers drowned them out.)  
     - **Point:** "Deliberation kills the ‘wisdom of crowds’—it replaces independent judgments with groupthink, raising confidence without accuracy."  

  3. **Expertise Carve-Out (5m):**  
     - *Facilitator raises:* "We saw agenda-setting and deliberation’s limits. So—should some roles (e.g., framing questions) be elected for expertise, not lotteried? Why/why not?"  
     - No resolution needed; flag it as unresolved tension in lottocracy.  

  **Close (4m):** "Today’s takeaways: Random selection alone doesn’t democratize power if agenda control is untouched, and deliberation isn’t magic—it can amplify error. What would you redesign?"  

  ---

  ### Predictable Problems & Fixes  
  1. **Unselected students (Run 1) disengage/resent:**  
     - **Why:** 6 observers feel excluded.  
     - **Fix:** Give observers a concrete task: "Track how the briefing constrains debate." In debrief, cold-call them first: "What did you see that speakers missed?" Validates their role.  

  2. **Student spots biased framing early:**  
     - **Why:** Motion/briefing are blatantly loaded.  
     - **Fix:** If a student protests (e.g., "This briefing is rigged!"), respond: "Interesting! Why do you say that? Hold that thought—we’ll discuss post-Run 1." *Do not engage further.* In debrief, use their comment to springboard into Point 1: "X called this early—what does that say about power in lotteries?"  

  ---

  ### What the Activity Cannot Replicate  
  - **Scale/Duration:** Real assemblies involve 100+ people over months; we compress to minutes.  
  - **Bindingness:** Our stake (memo to chair) is advisory, not policy.  
  - **Losers’ Consent:** No time to simulate legitimacy/acceptance of outcomes.  
  - **Depth:** Real briefings include expert testimony; ours are simplistic cards.  

  **Run it with:** Whiteboard, envelopes, index cards, and your watch. No tech or readings.
