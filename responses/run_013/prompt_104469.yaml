prompt: |-
  Okay, I need you to audit an analogy for me. I'm stuck in the Ferguson vs Tharoor argument about the British Raj — the empire-as-moderniser line versus the empire-as-extraction line — and I keep noticing that both sides lean on the same picture: the Raj as a business. Britain is the controlling shareholder, the East India Company is the original venture that got taken over by the Crown, Indian revenue is the dividend stream, railways and courts are capital expenditure, and the famines are ... an unbooked liability? an externality? The metaphor is doing a lot of quiet work, and I want to know how much of it survives contact with the history.

  You're a historian of empire who also knows accounting and social-science methodology. Don't give me a reading list or citations — I can't search anything right now. First brainstorm the ways the business frame gets used on each side, then give me a correspondence table: what maps onto the firm, the shareholders, the board, the assets, the liabilities, the profit, the auditors, the exit. Then the audit: where does the mapping break? What does the business frame smuggle in — a single bottom line, a particular discount rate, a counterfactual baseline, a split between owners and stakeholders, a treatment of non-monetisable goods? Then seperate the disanalogies that actually matter for the conclusions Ferguson and Tharoor want to draw from the ones that are just colourful. Finally, tell me whether either side's headline conclsuion survives once the analogy is cashed out, and whether there's a better metaphor — or whether the balance-sheet frame itself makes the whole debate look more tractable than it really is. Answer in British English, please, and be precise and a bit sceptical. I'd definately rather you over-explain the accounting bits than hand-wave. I want a proper audit, not a survey.
