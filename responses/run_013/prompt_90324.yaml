prompt: |-
  In the flat I share, the phone charger lives in the kitchen and the snacks live on the top shelf where I need a chair to reach them. I built that apartment to trap myself, and it works better than any resolution I've ever made. Fine, commitment devices, I know the drill. But a while back I noticed the exact same move running in the other direction, and that's the bit I dont have a name for. I'll book the 6am call in a week that's already brutal, because today-me wants the money and doesn't have to get up; the 5:30 me is a stranger I'm borrowing from. Or I'll leave an essay to the night before, not out of procrastination but because I've learned that the night-before me writes well when he's scared, so I'm spending a future self's adrenaline to buy a present self's calm. Both cases are arranging my future. In the first it's like parenting a kid; in the second it's like running a tab I have no intention of paying.

  I've been reading rationalist blogs long enough to know the usual furniture here — akrasia, hyperbolic discounting, commitment devices, Ulysses contracts, the whole thing about your future self being basically a different person — and none of them quite do it. Hyperbolic discounting tells me why the trade looks good from here, but not why the two directions feel different, and that difference seems like the whole thing. The akrasia stories I know have one agent whose will loses; here the earlier me isn't weak, he's clever, he's the one doing the exploiting, and the exploited party never gets a vote. So: is there an established term for the exploiting direction specifically, or for the pair as a pair, and if there isn't, can you coin one and define it tightly enough that I can actually sort cases with it? The edge I care about most is what separates arranging your future for your later self from arranging it at its expense — is it just whether the later you would sign off on it in advance and in a calm moment, and if so, is there a case where the later you would sign off and it's still clearly exploitation? Also tell me what happens if the later me wises up and starts laying traps back, because that's the part that makes me suspect this is a game-theory thing wearing a psychology costume, and I'd like to know what its called over there too. I don't need sources — I want the distinction and where its edges are.
reasoning: |-
  Hmm, the user is describing a fascinating psychological phenomenon where they manipulate their future selves for present benefit. They've already mastered commitment devices (like putting snacks out of reach) but noticed a reverse pattern: deliberately creating future hardship to exploit their own adrenaline or desperation. 

  The core tension is between two flavors of self-manipulation: sacrificial vs predatory. Sacrificial setups (like the charger in the kitchen) feel like parenting - present-you invests effort for future-you. Predatory setups (like scheduling brutal 6am calls) feel like running a tab - present-you spends future-you's resources. 

  What makes this sharp is how agency works: in classic akrasia, the "weak" self loses to temptation. Here, the earlier self is the aggressor - coldly weaponizing future-self's panic or exhaustion. The exploited self never consented, like being born into debt. 

  Key distinctions emerge:
  - Consent test: Would future-you ratify this when calm? (The 6am call fails this)
  - Resource transfer: Is it investing (sacrificial) or extracting (predatory)?
  - Power asymmetry: Earlier selves always set the traps. Later selves just inherit them.

  The game theory angle is delicious. When future-selves start laying counter-traps (e.g., "I'll pre-cancel that 6am call"), it becomes an intrapersonal cold war. That's where coining "preferential raiding" fits - framing earlier selves as temporal colonizers extracting value from undiscovered future territories. 

  For edge cases: 
  - What if future-you retrospectively approves? (Still exploitation if consent was bypassed)
  - What if it backfires? (The adrenaline gamble fails - now both selves lose)
  - The darkest version is deliberately inducing crises to force performance - like self-sabotage as motivational tool.

  The psychological costume hides a brutal truth: we're all time-traveling dictators to our future selves, and democracies to our past ones. That power imbalance deserves a name sharper than "present bias."
answer: |-
  You've hit on a profound asymmetry in temporal self-management that standard models overlook. The distinction isn't just about time preference—it's about **directionality of exploitation** and **consent architecture**. Let's define the taxonomy:

  ### Core Terms:
  1. **Sacrificial Precommitment** (Your "parenting" move):  
     - *Present-you* absorbs cost to benefit *future-you*  
     - **Test:** Future-you would retrospectively endorse it  
     - *Examples:* Charger in kitchen, savings auto-deductions  

  2. **Predatory Precommitment** (Your "running a tab" move):  
     - *Present-you* designs unavoidable future cost to benefit *present-you*  
     - **Test:** Future-you would feel exploited if aware (even if retrospectively "worth it")  
     - *Examples:* Booking brutal 6am calls, adrenaline-deadline gambling  

  ### Why Standard Models Fail This:
  - **Hyperbolic discounting** explains *why* trades happen but not the *moral asymmetry*  
  - **Ulysses contracts** assume unified interests (binding *to* resist temptation, not *for* temptation)  
  - **Akrasia** frames failure of will—here the "exploiter" succeeds deliberately  

  ---

  ### The Consent Boundary (Your Key Edge)
  The critical threshold is **temporal coercion**:  
  > *"Would future-me feel sovereignty violated if they knew the trap was set intentionally?"*  

  **Edge Cases**:  
  1. **Retroactive Endorsement ≠ Consent**  
     - You book 6am call → future-you curses but lands the client → judges it "worth it" post-hoc  
     - *Still predatory:* Consent was bypassed. The cost *had* to be paid before assessment.  

  2. **The Adrenaline Heist**  
     - Deliberately inducing panic in future-you:  
       - Exploits neurochemical vulnerability (cortisol surge)  
       - Future-you has no opt-out—only "perform or implode"  

  3. **The False Altruism Trap**  
     - *"I'll make future-me jog by buying expensive trainers!"*  
       - Sacrificial if: You hate jogging but genuinely invest in health  
       - Predatory if: You enjoy shopping *now* and saddle future-you with guilt  

  ---

  ### When Future Selves Fight Back: The Temporal Cold War
  You're right—this is game theory in disguise:  

  **Stages of Escalation**:  
  1. **First Strike** (Present-you sets trap)  
     - e.g., Schedule exhausting work sprint  

  2. **Mutually Assured Dysfunction** (Future-you retaliates)  
     - e.g., Future-you "pre-cancels" the sprint last minute, tanking credibility  

  3. **Brinkmanship**  
     - e.g., Present-you leaves job application until 11:59pm → future-you submits half-finished to "teach a lesson"  

  **Equilibrium States**:  
  - **Pyrrhic Peace:** Both selves lose value (e.g., missed opportunities)  
  - **Stable Hatred:** Selves actively sabotage each other (your "traps" scenario)  
  - **Sovereign Zones:** Segregated domains (e.g., present-you manages finances; future-you controls creative work)  

  ---

  ### Proposed Framework: **Preferential Raiding**
  **Definition**:  
  *The strategic design of unavoidable future constraints by a temporal agent (typically the present-self) to extract resources (time, energy, emotional states) without consent of the affected future agent.*  

  **Why it fits**:  
  - "Raiding" implies extraction (vs. "investment")  
  - "Preferential" centers the raider's advantage  
  - Avoids psychology baggage; admits game-theoretic nature  

  **Sorting Key**:  
  | Dimension          | Sacrificial Precommitment | Preferential Raiding |  
  |--------------------|---------------------------|----------------------|  
  | **Cost bearer**    | Present-self              | Future-self          |  
  | **Consent model**  | Delegated authority       | Coercion             |  
  | **Resource flow**  | Forward investment        | Backward extraction  |  
  | **Future POV**     | Gratitude                 | Resentment           |  

  ---

  ### Why This Matters
  You're describing **temporal colonialism**: where earlier selves treat future territories as reservoirs to plunder. The violence isn't physical—it's cognitive (stolen sleep), emotional (forced panic), and existential (denied agency). Naming it exposes the power imbalance: your future self isn't "another person"—they're your *hostage*. The solution isn't better tools, but temporal ethics: what do we owe the strangers we become?
