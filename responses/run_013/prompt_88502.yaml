prompt: |-
  My friend and I got into a two-hour arguement last night about euthanasia and I genuinely can't tell who won, so I want you to dig out the conceptual mess underneath the whole thing.

  Here's what we kept circling. Where I live the rules are a strange patchwork, and I think a few other countries are roughly similar. You can refuse treatment, and if you're on a ventilator and you've gone unconscious, your family can have it switched off even if you never wrote anything down. If you're competent and terminally ill, you can get a prescription for lethal drugs and take them yourself, after requesting it twice. But you can't have a doctor give you those drugs once you've lost capacity, even if you signed a detailed advance request years earlier saying that's exactly what you'd want. Meanwhile a doctor who keeps upping someone's morphine to control pain, knowing the dose will probably stop their breathing, is fine, while a doctor who gives the same dose aiming to end the life gets prosecuted.

  So what does this arrangement actually presuppose — about intention, about the killing/letting-die line, about what makes autonomy matter, and about whether the person who wrote the advance request is even the same person as the one who'd now be getting the drugs? Does it really need the doctrine of double effect, or is that just one theory that happens to fit while other theories fit it just as well? The bit I most want untangled is whether the law is tracking what the doctor intended, or just tracking who made the last physical move that ended the life. My friend says it's all about intention and I think the intention talk is doing way less work than the act/omission line. Tell me which bits strictly presuppose a view, which bits are philosophically underdetermined so that several theories would license them, and where the patchwork contradicts itself. And if you swapped the intention-based reading for a straight autonomy-based one, what would actually have to change in it?

  I don't need the law restated, I roughly know it. I want the implicit theory underneath, and I want to know if it even hangs together.
