answer: |-
  Here is your research proposal structured as required:

  1.  **Core Question:** Precisely when does a "free-floating rationale" – the reason natural selection maintains a trait – cease to function as a *normative standard* for that trait's success, despite still explaining its presence, particularly in cases of evolutionary mismatch (e.g., maladaptive mate choice or signal exploitation)?

  2.  **Why Open:** Existing approaches (e.g., selection-historical, irreducibly normative, or mechanistic-replacement theories of function) typically conflate the rationale's *explanatory* role (why the trait exists) with its *normative* role (the standard it should meet) or fail to address their dissociation in mismatch scenarios, leaving the conditions for normative collapse undefined.

  3.  **Method:** Comparative philosophical analysis of concrete cases from insect behavioural ecology (e.g., deceived mate choice, parasitized signals) where explanatory rationale persists but normative rationale breaks down. This targeted comparison, rather than amassing more cases, isolates the specific factors causing the roles to diverge.

  4.  **Success vs. Failure:** Success: Developing a clear, testable criterion distinguishing when a free-floating rationale retains normative force versus when it becomes merely explanatory. Failure: Merely redescribing the dissociation without providing a principled distinction or regressing to established, inadequate positions.

  5.  **Scope & Feasibility:** Six months part-time is sufficient to articulate the distinction rigorously using my specific case studies and engage key philosophical positions, narrowing the focus to behavioural traits where representational capacities (or their absence) are plausibly relevant to normative collapse. Comprehensive theory-building is beyond scope.
