answer: |-
  Based on your precise description – a single term ("species") serving two distinct conceptual roles (1) naming a presumed natural category and (2) acting as a practical unit for management/law/counting, which align in easy cases but conflict in hard cases, leading to arguments that are *really* about prioritizing one role over the other, often masked as factual disputes and accompanied by inconsistent ontological claims – **there is no single, universally established term for this specific phenomenon.**

  However, existing concepts come close, and we can coin a precise term capturing your insight:

  1.  **How it differs from the "Species Problem":**
      *   The "Species Problem" is the *broad umbrella* encompassing the difficulty in defining species, the existence of multiple competing definitions (Biological Species Concept, Morphological, Ecological, Phylogenetic, etc.), and debates about whether species are real or constructs.
      *   **Your pattern is a specific *manifestation* or *consequence* of the Species Problem.** It highlights the *functional duality* inherent in the term and the *rhetorical shifts* people use when the duality causes conflict. The Species Problem asks "What *is* a species?". Your pattern describes *how the word "species" itself is used* when its dual roles collide.

  2.  **How it differs from "Pluralism":**
      *   Pluralism explicitly acknowledges that different species concepts are valid for different purposes (e.g., BSC for reproductive isolation, PSC for phylogenetics). It advocates using the concept appropriate to the context.
      *   **Your pattern describes the *inconsistent application* of the *same term* ("species") *within a single context or argument*, where the user implicitly switches which underlying concept/role they are prioritizing without acknowledging the shift.** Pluralism is a proposed *solution* (use different concepts explicitly); your pattern is the *problem* (slippage within one term) that pluralism tries to avoid but often doesn't in practice during heated debates.

  3.  **How it differs from "Equivocation":**
      *   Equivocation is a logical fallacy where a *single word* with *multiple meanings* is used in different senses *within an argument*, leading to invalid conclusions. It's deceptive.
      *   **Your pattern involves equivocation *in form* (switching meanings), but the *cause* is deeper: the term is fundamentally burdened with these two essential roles (ontological claim + operational unit). The switch isn't always *intentionally* deceptive; it often reflects genuine conceptual confusion inherent in the term itself, arising specifically when the roles conflict.** The argument often *centers* on which meaning/role *should* dominate, whereas equivocation typically hides the switch.

  **Coined Term & Definition:**

  **Operational-Ontological Duality of "Species" (or Operational-Ontological Entanglement)**

  *   **Definition:** The inherent dual nature of the term "species" within biological discourse, where it simultaneously serves (a) an **Ontological Role**: asserting the existence of a fundamental, discoverable category in nature (a "natural kind"), and (b) an **Operational Role**: functioning as a practical, countable unit essential for conservation legislation, ecological management, field identification, and biodiversity accounting. This duality remains latent when the groups identified operationally align with groups perceived as ontologically distinct. Conflict arises in "hard cases" where operational groupings (based on morphology, ecology, manageability) diverge from groupings based on evolutionary lineage or reproductive isolation. Disputes triggered by such conflicts are frequently disputes over *which role (operational or ontological) should take precedence* in that specific context, often obscured as disagreements about empirical facts or definitions. The inconsistent ontological claims ("it's real" vs. "it's just a category") made by participants depending on which role serves their argumentative position is a hallmark symptom of this duality.

  **Boundary Case Illustrating the Edge:**

  *   **Case:** A bird population on an island is morphologically distinct and ecologically adapted to its unique habitat, recognized as a distinct species by field guides and conservationists (strong Operational Role justification). Genetic analysis reveals very recent divergence from the mainland population with no fixed differences and evidence of very rare, cryptic gene flow (weak support for Ontological Role based on deep lineage separation or complete reproductive isolation).
  *   **Analysis:** This sits at the boundary. The Operational Role (distinct morphology, ecology, conservation need) strongly suggests "species" status. The Ontological Role (as a fundamentally distinct lineage/natural kind) is much weaker due to the recent divergence and potential gene flow. A debate here would likely hinge on whether the practical conservation/identification needs (Operational Role) outweigh the lack of deep evolutionary separation (Ontological Role). Arguments might slip between "It *is* a unique evolutionary entity!" (emphasizing incipient distinctiveness for the Ontological Role) and "We *must* protect this unique population regardless of the genetics!" (emphasizing the Operational Role). It highlights the tension where the two roles aren't *fully* aligned, but also not starkly divergent like ring species or cryptic complexes. The core issue remains: which role defines "species" *here*?

  **Conclusion:**

  Your observation pinpoints a specific, pervasive, and under-labeled linguistic-conceptual phenomenon arising from the Species Problem. It's more specific than the broad "Species Problem," distinct from deliberate "Pluralism," and deeper than simple "Equivocation" because it stems from the term's inherent functional duality. **Operational-Ontological Duality/Entanglement** captures this core tension between the word's job as a label for a presumed natural kind and its job as a practical tool for human action and measurement, and the slippage that occurs when these jobs conflict.

  \answer{no established term — Operational-Ontological Duality (of "Species")}
