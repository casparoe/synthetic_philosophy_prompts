prompt: |-
  Ok so my mate is an archaeologist and he's always going on about what actually counts as a society collapsing versus just changing into something else. Here's his track record as far as I can piece it together. Late Bronze Age eastern Mediterranean: yes, collapse — Hittite empire gone, Mycenaean palaces burnt, big cities abandoned, population way down, even writing disappears for a while. Western Roman Empire: yes, collapse, and he says this even though the eastern half carries on and plenty of people just keep living their lives. Norse Greenland colony: yes, collapse, it simply ends. Easter Island: yes, collapse, trees gone, the chiefly order comes apart. Tokugawa Japan turning into Meiji Japan: no, that's a transformation, nothing actually disappears except the shogunate. Ming to Qing: no, just a change of dynasty, the state is still there.

  Now there's two new cases I want his verdict on. Classic Maya: the lowland cities get abandoned, the kings stop putting up monuments, the whole classic political order is finished by around 800-1000 CE, but there are still millions of Maya people living there today speaking Mayan languages. And the Black Death in 14th century Europe: something like a third to half of everyone dies, but the kingdoms, the church, the towns all just keep going.

  What I actually want isn't the yes/no, it's the rule he seems to be running underneath. I think it's one of two: (a) collapse = a big lasting drop in population, or (b) collapse = the political order, the people who run things, actually disappearing. Both seem to fit everything he's said so far as far as I can tell. Which do you reckon he's really using, what does each one predict for the Maya and for the Black Death, and if I wanted to run one more case past him to definitively seperate the two rules, what should it be?
reasoning: |-
  Okay, let me tackle this query. The user's mate is an archaeologist who has specific criteria for what constitutes a societal collapse versus a transformation. The user provided several historical examples where the mate labeled each as either collapse or transformation, and now wants to apply that to the Classic Maya and the Black Death. The user suspects two underlying rules: either a lasting population drop (Rule A) or the disappearance of the ruling political order (Rule B). 

  First, I need to analyze the mate's track record. For the Late Bronze Age collapse, the Hittite Empire vanished, Mycenaean palaces were destroyed, writing disappeared, and population declined. Western Roman Empire fell despite the Eastern half continuing. Norse Greenland and Easter Island both ended completely. In contrast, Tokugawa to Meiji and Ming to Qing were seen as transformations because the state structure persisted despite leadership changes.

  Now, applying Rule A (population drop) to Classic Maya: the lowland cities were abandoned, population decreased significantly, which suggests collapse. But for the Black Death, Europe's population dropped drastically, yet recovery happened relatively quickly. So under Rule A, Black Death might not qualify as collapse since the decline wasn't lasting. 

  Rule B (political order disappearance) for Classic Maya: the kingly system and monuments stopped, political structures vanished. This points to collapse. For the Black Death, political systems like kingdoms and the Church remained intact, so it wouldn't be a collapse.

  The user wants a test case to distinguish between Rule A and B. The Khmer Empire's decline is a good candidate. Population might have decreased around Angkor, but people continued living in the region. Politically, the empire fragmented into smaller states. If the mate calls it a collapse, Rule B (political disintegration) is likely the key factor. If not, then Rule A (lasting population drop) might be primary.

  Considering the user's deeper needs: they're interested in the archaeologist's implicit framework. They might be seeking clarity on how to define collapse in academic terms, or looking for a consistent criterion to apply to other historical cases. The test case helps validate which rule the mate prioritizes.
answer: |-
  Based on your mate's track record and the need to distinguish between Rule A (big lasting population drop) and Rule B (political order disappearance), here's the breakdown:

  **Your Mate's Likely Rule: Rule B (Political Order Disappearance)**

  Here's why:

  1.  **Rule A (Population Drop) has inconsistencies:**
      *   **Western Roman Empire:** While population declined regionally, the *lasting* drop isn't the most prominent feature he cites. He emphasizes the *disappearance of the imperial political structure* in the West, even though the East survived and people kept living.
      *   **Black Death Prediction (Rule A):** A massive (33-50%) population drop occurred. If he follows Rule A, he *should* call this a collapse. But based on his other calls, he likely **would NOT call it a collapse** (see below). This is a major clue against Rule A being primary.
      *   **Maya Prediction (Rule A):** A significant population drop occurred in the lowland heartland. Rule A would predict **Yes, Collapse**. But the persistence of the people and culture might make him hesitate if Rule A was absolute.

  2.  **Rule B (Political Order Disappearance) fits perfectly:**
      *   **Late Bronze Age:** Hittite Empire *gone*, Mycenaean palatial system *gone*, centralized authority vanished.
      *   **Western Roman Empire:** Imperial state structure in the West *disappeared*.
      *   **Norse Greenland:** The entire colonial socio-political entity *vanished*.
      *   **Easter Island:** The chiefly political order *collapsed*.
      *   **Tokugawa to Meiji:** The *political system transformed*; the state (now imperial) continued, bureaucracy adapted. Only the top leadership (Shogunate) *changed*, not the fundamental concept of the Japanese state.
      *   **Ming to Qing:** The *imperial state system continued* seamlessly under new management. No disappearance of the ruling order's framework.
      *   **Black Death Prediction (Rule B):** Kings, kingdoms, Church hierarchy, urban governments – the entire political and elite structure *survived* the plague. It was a massive crisis, but the "people who run things" kept running things (albeit with difficulty). Prediction: **No, not a collapse.**
      *   **Classic Maya Prediction (Rule B):** The core Classic political order – divine kingship, the institution of the "K'uhul Ajaw" (Holy Lord), the royal courts, the monumental building programs, the inter-polity system – *completely disappeared* in the lowlands. While Maya people and culture persisted, the *specific ruling system* that defined the Classic period ended. Prediction: **Yes, collapse.**

  **Predictions for the New Cases:**

  | Case                  | Rule A Prediction (Population Drop) | Rule B Prediction (Political Order Gone) | Mate's Likely Verdict (Based on Rule B) |
  | :-------------------- | :---------------------------------- | :--------------------------------------- | :-------------------------------------- |
  | **Classic Maya**      | **Yes** (Major lasting decline)     | **Yes** (Kingly system vanished)         | **Yes, Collapse**                       |
  | **Black Death Europe**| **Yes** (Huge temporary drop)       | **No** (Kingdoms/Church survived)        | **No, Not Collapse**                    |

  **The Definitive Test Case: The Khmer Empire (Angkor) Decline (~14th-15th Century CE)**

  *   **Why it's perfect:** It sits ambiguously between Rule A and Rule B.
  *   **What happened:**
      *   **Rule A (Population):** Angkor, the massive capital city, was largely abandoned. There was a significant *regional* population decline and shift away from the city and its intensive hydraulic system. However, the Khmer people and smaller polities persisted in the region. Was the drop "lasting" enough? Debate exists.
      *   **Rule B (Political Order):** The *centralized, god-king imperial state* centered on Angkor collapsed. The institution of the Devaraja (god-king) ruling from Angkor vanished. Political power fragmented into smaller, less centralized kingdoms. The *specific political order* of the Angkorian Empire disappeared.

  **How to Interpret Your Mate's Verdict:**

  1.  **If he says "Collapse":** He prioritizes **Rule B (Political Order Disappearance)**. The end of the Angkorian imperial system is decisive for him, outweighing the persistence of Khmer people and smaller successor states.
  2.  **If he says "Transformation" or "Not Collapse":** He likely prioritizes **Rule A (Lasting Population Drop)**, seeing the regional depopulation around Angkor as significant but not absolute or lasting enough at a broader scale, and/or emphasizes the continuity of Khmer society in successor states. He might argue the *idea* of a Cambodian kingdom continued, just not centered on Angkor.

  **Conclusion:**

  Your mate's verdicts strongly suggest **Rule B (Disappearance of the Political Order/Ruling System)** is his core criterion. The Black Death is the clearest indicator – it caused apocalyptic population loss but no political collapse, and he likely wouldn't call it one. The Maya case perfectly fits Rule B: the Classic political system vanished, even if the people endured. The Khmer/Angkor case is the ideal test to confirm this, as a "Collapse" verdict would solidify Rule B as his defining principle.
