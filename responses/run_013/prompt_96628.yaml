prompt: |-
  so i've been on this new medication that gives me insanely vivid dreams, and last week i woke up genuinely unsure which side of the night was the real one, which finally pushed me to actually read the Zhuangzi butterfly passage properly instead of just nodding whenever it comes up. anyway my phil-major friend says it's just Descartes dream argument in a different key: same doubt, same move, so anything true of one is true of the other, and the people who read the butterfly story as being about the self or about identity are just over-reading a poem that happens to have a nice image in it. audit that for me. give me the correspondence table first -- what plays the role of the dream, the doubter, the evidence, the thing that supposedly survives the doubt -- then the places the mapping actually breaks, and i have a hunch the ending matters (the part where he can't say whether he's a man who dreamt of being a butterfly or a butterfly right now dreaming of being a man, and then the line right after about things transforming into one another) but i can't put my finger on why. then tell me which of those breaks matter for what my friend is using the analogy to do and which are just scenery, and whether his conclusion survives once they're on the table. if it doesn't, what would be the honest analogy instead.
