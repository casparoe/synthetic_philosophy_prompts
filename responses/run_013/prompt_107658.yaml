  ### Analysis of Nadia's Decision Rule

  Nadia's four verdicts reveal a consistent pattern that deviates from expected-value maximization. The key observations are:
  - She accepts positive-EV gambles when potential losses are moderate relative to gains and losses are not too probable (i) and (ii)).
  - She rejects positive-EV gambles when there is a high probability of a significant loss (iii) or when extremely high payoffs are offset by minuscule probabilities (iv).
  - Her comment that enormous prizes are "just decoration" indicates skepticism toward low-probability tail events.

  Two distinct rules fit all four verdicts:

  ---

  #### Candidate Rule 1: **Expected Utility Maximization with Concave Utility**
  - **Rule**: Maximize expected utility with a concave utility function \(U(w)\) over wealth \(w\), where \(U\) exhibits diminishing marginal utility (risk aversion). Initial wealth \(w_0 = \$10,000\).
  - **Utility Function**: \(U(w) = \ln(w)\) (log utility) fits perfectly:
    - (i) EU = \(0.5 \ln(10100) + 0.5 \ln(9950) \approx 9.2125 > \ln(10000) \approx 9.2103\) → Play.
    - (ii) EU = \(0.5 \ln(12000) + 0.5 \ln(9200) \approx 9.2595 > 9.2103\) → Play.
    - (iii) EU = \(0.1 \ln(110000) + 0.9 \ln(5000) \approx 8.8261 < 9.2103\) → Decline.
    - (iv) EU of St. Petersburg (fee \$25) converges to \(\approx 9.2073 < 9.2103\) → Decline.
  - **Key Parameter**: Logarithmic utility (or similarly concave functions like square-root utility). Wealth is treated as continuous, and \(U\) is strictly concave.
  - **Critical Verdict**: (iii) does the most work in eliminating linear utility or weakly concave forms. A less risk-averse agent might accept the +$5,500 EV gamble.

  #### Candidate Rule 2: **Loss Probability Threshold with Positive EV**
  - **Rule**: Accept a gamble iff:
    1. Expected monetary value (EV) is positive.
    2. Probability of a loss (outcome < current wealth) is ≤ 80%.
  - **Rationale**: Focuses on avoiding losses that are "too likely" while ignoring tail gains when probabilities are low.
    - (i) EV = +$25 > 0, loss probability = 50% ≤ 80% → Play.
    - (ii) EV = +$600 > 0, loss probability = 50% ≤ 80% → Play.
    - (iii) EV = +$5,500 > 0, loss probability = 90% > 80% → Decline.
    - (iv) EV = +∞ > 0, but loss probability ≈ 98.4% > 80% → Decline.
  - **Key Parameter**: 80% loss probability threshold (calibrated between 50% and 90% from (ii) and (iii)).
  - **Critical Verdict**: (iv) does the most work. Her "decoration" comment explicitly rejects tail probabilities, aligning with probability-based rules over pure EU.

  #### Eliminated Alternatives
  - **Expected-value maximization**: Rejected by (iii) and (iv).
  - **Prospect theory (loss aversion)**: Fails (i) and (ii), as losses occur but are accepted.
  - **Maximin (worst-case focus)**: Rejected by (iv) (worst loss is small) and (ii) (large loss possible).
  - **Safety-first (ruin avoidance)**: Rejected by (iii) (loss ≠ ruin).

