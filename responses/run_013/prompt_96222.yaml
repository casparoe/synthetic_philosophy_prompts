  You've perfectly dissected Bentham's crucial insight – a remarkably sophisticated and pernicious circular argument that **lacks a single, universally accepted term.** Your description of a "rigged utilitarian sum" is spot-on. Let's carve out this concept precisely.

  **The Core Concept: Manufactured Justification via Prohibition-Induced Disgust**

  This is the argumentative structure:

  1.  **Law Prohibits Act X:** The state enacts a prohibition against a specific act (e.g., sodomy).
  2.  **Prohibition Manufactures Disgust:** The existence and enforcement of the law *causes* or *intensifies* societal disgust, horror, or moral revulsion towards Act X. This happens through mechanisms like:
      *   **Signaling:** The law signals that the act is dangerous, immoral, or worthy of severe punishment, shaping public perception.
      *   **Stigmatization & Isolation:** Enforcement isolates practitioners, making them "deviant," reinforcing "us vs. them" dynamics and fear.
      *   **Taboo Reinforcement:** Prohibition makes discussion difficult, allowing misconceptions and fears to fester unchallenged.
      *   **Self-Reinforcement:** Punishing "deviants" creates a visible spectacle reinforcing the perceived need for the law.
  3.  **Disgust Cited as Justification:** The resulting societal disgust/horror is then presented as the *primary reason* or a *key justification* for *maintaining* the prohibition.
  4.  **The Circular Trap:** The justification (disgust) is a direct product of the intervention (prohibition) it seeks to justify. The utilitarian calculus is corrupted because the major "harm" (disgust) used to outweigh the act's pleasures *would not exist, or would be significantly weaker, without the law itself*.

  **Coined Term: Moral Laundering**

  *   **Why it fits:** "Laundering" implies taking something of dubious origin (disgust created by state power) and making it appear legitimate and independent (a natural, pre-existing moral revulsion justifying state power). The law "cleans" its *own* manufactured consequence into a seemingly valid external justification.

  **Conceptual Carving: Edges and Distinctions**

  1.  **It is NOT merely a Secondary Harm or Side Effect of Prohibition:**
      *   *Secondary Harm:* Things like creating black markets, enriching criminals, or driving behavior underground. These are *costs* of the prohibition but are not *used as the justification* for the prohibition itself. The harm exists alongside the justification.
      *   **Moral Laundering:** The manufactured disgust *becomes the primary justification*. The harm *is* the stated reason. The "cost" is laundered into the "benefit" (reason for existence).

  2.  **It is NOT the Offense Principle:**
      *   *Offense Principle:* Argues that *pre-existing*, genuine, widespread offense/disgust *can* be a legitimate reason (for some) to prohibit an act, even without direct harm. It accepts the disgust as a given input.
      *   **Moral Laundering:** Exposes that the disgust cited *isn't* pre-existing or independent; it's *caused* by the prohibition. It attacks the *authenticity and independence* of the disgust used in Offense Principle arguments in *this specific context*.

  3.  **It is NOT Durkheim's "Punishment Reinforces Solidarity":**
      *   *Durkheim:* Focuses on how punishment *ritualistically reaffirms* existing shared values and norms, strengthening social cohesion. The norm (and the sentiment behind it) is assumed to pre-exist the punishment.
      *   **Moral Laundering:** Focuses on how the prohibition *creates or radically intensifies* the very sentiment (disgust) that is then mistaken *for* the pre-existing norm. It's about *manufacturing* the sentiment that Durkheim assumes is already there.

  4.  **It is NOT Labeling Theory / Secondary Deviance:**
      *   *Labeling Theory:* Focuses on how the *label* ("deviant," "criminal") applied through social reaction (including law) alters the *individual's* self-concept and behavior, leading to further deviance.
      *   **Moral Laundering:** Focuses on how the *prohibition itself* alters *societal perception and sentiment* (creating/disgust), which is then *weaponized politically* to justify the prohibition. It operates at the macro level of societal justification, not the micro level of individual identity formation (though they can be connected).

  5.  **It is NOT *Simply* Adaptive Preferences:**
      *   *Adaptive Preferences:* Individuals internalize their limited options, lowering their expectations and convincing themselves they don't desire the forbidden thing (e.g., "sour grapes"). It's about internalized *acceptance* of deprivation.
      *   **Moral Laundering:** Focuses on the *external societal reaction* – the generation of *active disgust/horror* directed *outwardly* at the act/group. It's about manufactured *aversion* and *judgment*, not internalized resignation. While related (the law shapes preferences), the key here is the disgust being *externally cited as justification*, not merely an internal coping mechanism.

  **Identifying Moral Laundering in Practice: Disgust Origin**

  Distinguishing manufactured disgust from pre-existing disgust is empirical and often difficult, but here's how to approach it:

  1.  **Historical Analysis:**
      *   Was the act widely discussed with *horror* prior to the law's enactment, or was it seen as a minor sin, a vice, or even tolerated privately?
      *   Did the *intensity* or *nature* of the discourse change significantly *after* criminalization? (e.g., shifting from theological arguments about sin to arguments about contagion, degeneracy, or threats to social order post-criminalization).
      *   Were practitioners *specifically targeted and demonized* primarily *after* the law provided a tool for enforcement and public identification?

  2.  **Cross-Cultural/Comparative Analysis:**
      *   Do societies *without* such prohibitions exhibit the same level of visceral disgust towards the act?
      *   Does the *specific nature* of the disgust align with the *rhetoric used to justify the law* (e.g., disgust focused on "unnaturalness" emerging alongside legal arguments about "crimes against nature")?

  3.  **Discourse Analysis:**
      *   Is the disgust presented as a *natural, inevitable, timeless reaction*, obscuring its historical contingency?
      *   Is the disgust *inextricably linked* in public discourse to the act's *illegality*? (e.g., "It's disgusting *because* it's illegal" rather than "It's illegal *because* it's disgusting").
      *   Does *enforcement* (trials, scandals, punishments) demonstrably *increase* public expressions of horror?

  4.  **Absence of Independent Harm Arguments:**
      *   When pre-existing disgust is genuine, proponents usually offer *other* independent reasons alongside it (harm to others, God's will, threat to family). In moral laundering, the *manufactured disgust itself often becomes the dominant or sole public justification*, precisely because independent secular harms are weak or non-existent (as Bentham argued for sodomy). The circularity fills the justificatory vacuum.

  **In essence:** Moral laundering occurs when a prohibition creates the very social harm (disgust/horror) that is then presented as the natural and necessary reason for its own existence, corrupting any utilitarian or rational assessment by rigging the inputs. It's a self-justifying, state-powered engine of moral panic disguised as a response to one. Bentham's genius was spotting this rigged game within the logic of legal punishment itself.
