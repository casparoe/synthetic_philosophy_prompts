  We are designing a decision procedure for causal attribution by omission for a panel reviewing deaths in custody. The procedure must:
   1. Be executable in a 90-minute case meeting.
   2. Address the challenges: 
      - Omissions leave no footprint; counterfactual is ill-defined without specifying what the actual agent would have done or what a reasonable agent would have done.
      - The grain of description of the omission matters (e.g., failing to do a round vs. failing to look through a panel).
      - Cases of redundant failures (multiple omissions, each sufficient by itself, but neither but-for cause).
      - Failures that remove a safeguard, leading to harm via an unforeseen chain.
      - Pure documentation failures (where the harm is to the record-keeping, not directly to the person).
   3. Score each candidate omission on two separate axes:
      a) Counterfactual dependence: how much the outcome depended on the omission (using but-for or necessary condition analysis, but accounting for redundancies).
      b) Salience of the breached norm: how clear and important the norm was.
   4. The procedure must define:
      - The order of questions.
      - What counts as a sufficient answer at each step.
      - Stopping points for:
          * No causal role.
          * Not assessable on this record.
          * When the question must be handed to the chair as a judgment beyond the procedure.
   5. Fix a verdict vocabulary.

   Proposed Verdict Vocabulary:
     - "Causal": The omission was a necessary part of the causal chain leading to death (by the standard chosen).
     - "No causal role": The omission made no difference to the outcome.
     - "Not assessable": The record is insufficient to determine whether the omission was causal.
     - (Additionally, we might have a category for cases of redundant causation, but note the panel's narrow terms: we are only to determine if the omission was among the causes. We can have a verdict that captures that even if not but-for, it was part of a set of conditions that caused the death.)

   However, note the panel's concern: they are not asked to assign blame, but their findings are interpreted as such. We must be clear that our verdict of "causal" does not equate to blame, but only to a causal link as defined by the procedure.

   Steps in the Procedure:

   I. Precondition: Identify Candidate Omissions
      - Step 1: List every alleged omission (from the evidence) that is a candidate for causing the death.
      - Step 2: For each candidate omission, describe it at multiple grains (coarse and fine) and fix the description at a level that is both specific enough to be meaningful and general enough to capture the breached norm. The panel must agree on the description. (This is the description audit.)

   II. For each candidate omission:

      Step 3: Establish the breached norm.
          - Question: Was there a clear expectation (policy, rule, duty) that required the action?
          - Sufficient answer: 
              * Yes: There was a written policy, rule, or established duty that required the action at the time.
              * No: There was no such policy, rule, or duty. 
              * Not clear: The policy is ambiguous or not established.
          - If "No", then the omission cannot be a breach of a norm. However, note: the panel is only asked to consider omissions by named agencies or individuals. Without a norm, we might still consider counterfactual dependence? But the terms of reference might limit to breaches. So:
              * If "No", then we skip this candidate? Or note that the norm axis will be zero. But the procedure must allow for a finding of causal role even without a breached norm? Let's see: the panel is asked to determine if an omission was among the causes. The omission might be a cause even if there was no duty. However, the panel's work is in the context of public agencies, and the expectation is that they are bound by norms. We will note that without a breached norm, the omission might still be causal but the panel's focus is on policy change. We can proceed to the counterfactual analysis even without a norm, but then the salience is zero.

          - We separate the two axes: counterfactual dependence and norm salience.

      Step 4: Counterfactual dependence analysis.

          We must choose a standard for the counterfactual: actual-agent or reasonable-agent?
          - The panel chair must decide at the outset of the entire procedure (for consistency across cases) which standard to use. The choice has costs and benefits:
              * Actual-agent standard: What would the actual agent (or agency) have done if they had not omitted the action? This is more fact-based but requires evidence about the specific agent. It might be hard to prove and lead to many "not assessable" verdicts.
              * Reasonable-agent standard: What would a reasonable agent (or agency) in that position have done? This is more objective but may not reflect the actual capacities and circumstances.

          Given the panel's constraints, I recommend the reasonable-agent standard because:
              - It is more consistent with policy recommendations (which are about what should be done in the future).
              - It avoids the difficulty of proving what an individual would have done.
              - But note: the panel's findings are used in inquests and misconduct proceedings, which might prefer the actual-agent standard. However, the panel is not a disciplinary body and is focused on policy. The chair must weigh this.

