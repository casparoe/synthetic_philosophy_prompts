          - Step 3: Assigning norm salience level (requires interpretation of policies).
          - Step 4: Entire counterfactual analysis (requires expert input and is inherently uncertain).
          - Step 4d: What counts as "substantially reduced the risk"?

     Steps requiring expert input (clinical, custodial):
          - Step 4: What would have happened in the counterfactual? (especially 4b, 4c, 4d)

     The procedure stops for an omission at Step 5 with a verdict.

     When the counterfactual analysis is "Not assessable", the panel must decide if they can make a judgment. If not, the verdict is "Not assessable". The chair might break a tie if the panel is split.

     Finally, the chair must ensure that the findings are based on the procedure and that the verdicts are clearly separated from blame.

     Now, we run the three cases with the procedure:

   Case 1 (Missed welfare round):

     Omission: Failure to conduct the welfare round (O1)

     Step 3: Norm exists -> High salience.

     Step 4: Counterfactual: Had the round been done, the clinician says the man was beyond help -> the death would not have been prevented. 
          Counterfactual dependence: None (0)
     Verdict: No causal role.

     Note: The opportunity four hours earlier is not considered because there was no norm (so not a candidate omission).

   Case 2 (Communication failure):

     Omission by healthcare escort (O1): Failure to pass disclosure.
        Step 3: Norm exists -> High salience.
        Step 4: Counterfactual: If passed, prison would have acted -> death prevented. High (3).
        Verdict: Causal.

     Omission by prison (O2): Failure to have a system that ensures receipt of critical information from escorts? (We define: the prison had a duty to ensure they get such information. Assume norm exists -> High salience.)
        Step 4: Counterfactual: If the prison had a system that ensured they got the information (e.g., by asking), then they would have gotten the disclosure and acted -> death prevented. High (3).
        Verdict: Causal.

     Therefore, both are causal.

   Case 3 (Stale risk assessment):

     Omission: Failure to update the risk assessment (O1)

     Step 3: Norm exists -> High salience.

     Step 4: Counterfactual: If updated, would it have been read? Evidence: no evidence it would have been read. Therefore, we cannot say it would have been read and acted upon. 
          We assume: the update alone doesn't prevent death; it must be read. Since there's no evidence it would have been read, we cannot say the death would have been prevented. 
          Therefore, counterfactual dependence: None (0).
          Verdict: No causal role.

     But note: the panel might be uncomfortable because the breach is clear and the assessment was stale. The procedure says no causal role. The panel will not want to hear that, but the procedure returns it.

     However, we can note: if the panel believes that the reason it wasn't read was because it was outdated (so if updated, it would have been read), then they might assign a different counterfactual. But the evidence says "no evidence anyone would have read it". So we stick to the evidence.

   Conclusion:

     The procedure provides a structured way to analyze omissions. It separates causation from norm salience. It handles the cases as described. However, it cannot resolve all ambiguities and requires expert judgment. The verdicts are based on the counterfactual dependence and are distinct from blame. The panel must remember that "causal" in their findings does not equate to blame, but only to a link in the causal chain as defined.
answer: |-
  ### Decision Procedure for Causal Attribution by Omission  
  **Core Principles:**  
  1. **Separate causation from blame:** Causation is a factual link; breached norms indicate policy gaps.  
  2. **Fix the counterfactual standard upfront:** Use **reasonable-agent standard** (what a competent professional/agency would have done). *Costs:* Less individualized, but avoids speculative claims about actual agents. *Benefits:* Aligns with policy reform, reduces "not assessable" verdicts.  
  3. **Two Axes Strictly Apart:**  
     - **Counterfactual Dependence (CD):** "But-for" necessity + risk reduction.  
     - **Norm Salience (NS):** Clarity/importance of the breached rule.  
  4. **Verdict Vocabulary:**  
     - **Causal:** Omission was a necessary part of the causal chain.  
     - **No causal role:** Omission made no difference.  
     - **Not assessable:** Insufficient evidence to determine CD.  
     - **Hand to Chair:** Dispute over omission description or unresolvable normative conflict.  

  ---

  ### Procedure Steps  
  **Order of Questions** (per candidate omission):  
  1. **Define the omission** (Description Audit):  
     - *Question:* "At what grain is this omission described? (e.g., ‘failed to conduct rounds’ vs. ‘failed to check Cell B’)."  
     - *Sufficient Answer:* Panel agrees on a single grain using:  
       - **Specificity Test:** Description must be precise enough to link to a norm (e.g., "failed to escalate a note" not "failed to care").  
       - **Relevance Test:** Grain must plausibly connect to the outcome.  
     - *Stop/Halt Point:* If agreement fails → **Hand to Chair** (judgment beyond procedure).  

  2. **Establish breached norm:**  
     - *Question:* "Was there a clear policy/duty requiring the action?"  
     - *Sufficient Answer:*  
       - **Yes:** Written rule, training material, or established duty. → Proceed.  
       - **No:** No binding expectation. → **No causal role** (skip CD).  
       - **Unclear:** Ambiguous policy. → Proceed (NS scored low).  
     - *Output:* NS Level (0-3):  
       - **0 (None):** No norm.  
       - **1 (Low):** Discretionary/dubious duty.  
       - **2 (Medium):** Clear but non-critical rule.  
       - **3 (High):** Mandatory, safety-critical duty.  

  3. **Counterfactual Dependence (CD):**  
     - *Question:* "Would a reasonable agent’s action have altered the outcome?"  
     - *Sufficient Answer:* Requires clinical/custodial input. Steps:  
       - **Step 3.1 (But-For):** "Would the death have been **prevented**?"  
         - **Yes** → CD = **High (3)**.  
         - **No** → Proceed to Step 3.2.  
       - **Step 3.2 (Redundant Cause):** "Was omission part of a set where **any single action** would have sufficed?"  
         - **Yes** → CD = **Moderate (2)**.  
         - **No** → Proceed to Step 3.3.  
       - **Step 3.3 (Risk Reduction):** "Would action have **substantially reduced risk**?"  
         - **Yes** → CD = **Low (1)**.  
         - **No** → CD = **None (0)**.  
       - **Insufficient Evidence** → CD = **Not assessable**.  
     - *Stop Points:*  
       - CD = 0 or 1 → **No causal role**.  
       - CD = Not assessable → **Not assessable**.  
       - CD = 2 or 3 → Proceed to verdict.  

  4. **Verdict & Recommendations:**  
     - *Verdict Rule:* **Causal** iff CD = 2 or 3.  
     - *NS Role:* Used **only** for policy recommendations (e.g., "High NS breach: Urgent policy review").  

  ---

  ### Special Cases Handling  
  - **Redundant Failures:** Test each omission independently under Step 3.2. If both pass, both are **Causal** (CD=2).  
  - **Safeguard Removal:** Treat as CD analysis. Focus on whether the safeguard would have interrupted the chain (even if harm was unforeseen).  
  - **Pure Documentation Failures:** Automatically **No causal role** (CD=0) unless the record directly caused physical harm (e.g., missing medical alert).  

  ---

  ### Case Applications  
  #### Case 1: Missed Welfare Round  
  - **Omission:** "Failed to conduct the scheduled welfare round."  
  - **Step 1 (Description):** Grain = "Failure to conduct round at [time]." → Accepted.  
  - **Step 2 (NS):** Policy required round → **NS = 3 (High)**.  
  - **Step 3 (CD):**  
    - 3.1 (But-For): Clinician confirms death occurred before the round → Action would **not** have prevented death.  
    - 3.2 (Redundant): N/A (only one omission).  
    - 3.3 (Risk Reduction): No plausible benefit (beyond help) → **CD = 0 (None)**.  
  - **Verdict:** No causal role.  
  - **Panel Note:** NS=3 triggers policy review (round frequency), but causation rejected.  

  #### Case 2: Suicide After Disclosure Failure  
  - **Omissions:**  
    - **O1 (Healthcare):** "Failed to pass disclosure to prison."  
    - **O2 (Prison):** "Failed to ensure disclosure was received."  
  - **Step 1 (Description):**  
    - O1 Grain: "Failure to communicate suicide risk." → Accepted.  
    - O2 Grain: "Failure to verify handover of critical info." → Accepted.  
  - **Step 2 (NS):** Both had clear protocols → **O1 NS=3, O2 NS=3**.  
  - **Step 3 (CD) per omission:**  
    - **O1:**  
      - 3.1 (But-For): If disclosed, prison would have acted → Death prevented. → **CD=3 (High)**.  
    - **O2:**  
      - 3.1 (But-For): If prison had verified, they would have acted → Death prevented. → **CD=3 (High)**.  
  - **Verdict:** Both **Causal** (CD=3).  
  - **Panel Note:** Redundant failure (either action sufficed), but both causal.  

  #### Case 3: Stale Risk Assessment  
  - **Omission:** "Failed to update risk assessment after regime change."  
  - **Step 1 (Description):** Grain = "Failure to update assessment within [timeframe]." → Accepted.  
  - **Step 2 (NS):** Policy required updates → **NS=3 (High)**.  
  - **Step 3 (CD):**  
    - 3.1 (But-For): No evidence the updated assessment would have been read/acted on before death → **Not but-for**.  
    - 3.2 (Redundant): No other omissions.  
    - 3.3 (Risk Reduction): No proof of reduced risk → **CD=0 (None)**.  
  - **Verdict:** No causal role.  
  - **Panel Note:** Unwanted but procedurally sound. NS=3 warrants policy change (e.g., mandatory review triggers).  

  ---

  ### What the Procedure Cannot Do  
  1. **Eliminate Judgment:**  
     - Description audit (Step 1) and CD analysis (Step 3) rely on expert input. Lay members cannot assess clinical/custodial counterfactuals alone.  
  2. **Assign Blame:** "Causal" ≠ blame; it denotes factual necessity. External misinterpretation is unavoidable.  
  3. **Resolve Ambiguous Evidence:** "Not assessable" may frustrate families but upholds integrity.  
  4. **Handle Systemic Flaws:** Isolates individual omissions; misses broader cultural failures.  
  5. **Override Time Limits:** Complex cases may exceed 90 minutes; Chair must truncate or defer.  

  **Final Output:** A clear, auditable causal verdict per omission, decoupled from norm salience, with policy recommendations based solely on NS.
