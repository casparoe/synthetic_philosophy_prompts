            And separately, we note the norm salience for the purpose of recommendations.

          But what about when the counterfactual dependence is not assessable? Then we cannot say.

          Also, what about the case where there is a breached norm with high salience but low counterfactual dependence? We still say "no causal role", but we might recommend a policy change because the norm is important and was breached, even though in this case it didn't cause the death.

      Step 7: Special Cases:

          - Pure documentation failure: If the omission is about record-keeping and the harm is to the record (e.g., the death was not caused by the missing record, but the record would have helped the investigation), then we mark counterfactual dependence as None (unless the missing record led to a failure in care that caused the death). But if the harm is only to the record, then it is not a cause of the death. We might note it as a breach but not causal.

