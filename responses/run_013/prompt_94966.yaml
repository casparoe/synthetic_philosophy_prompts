          Step 4a: Identify the counterfactual scenario: What would have happened if the omission had not occurred? (i.e., if the action had been taken as required by the norm, or as a reasonable agent would have done?).

          Step 4b: Would the death have been prevented? (But-for test)
              - If yes (the death would not have occurred in the counterfactual), then the omission was a but-for cause. We assign a high counterfactual dependence (say, 1 on a scale of 0 to 1? Or we can use categories: "High", "Medium", "Low", "None").
              - If no (the death would still have occurred), then we consider:

