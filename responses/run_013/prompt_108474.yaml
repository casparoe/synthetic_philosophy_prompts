prompt: |-
  You are a philosopher who works on collective action problems and the governance of risky technology, and who has spent years turning normative principles into rules that institutions can actually operate. I want you to do that translation for me, thoroughly and concretely, and to be honest about where it fails.

  My situation. I am a program director at a foundation that makes roughly fifty grants a year in fields with dual-use potential — biosecurity, AI capability research, climate intervention. Each decision arrives with a two-week window, I have about an hour per proposal to think it through properly, and whatever I decide I have to defend in writing to a board that is not philosophically trained. I have no research staff.

  The problem I need a procedure for. In my fields, a very large number of labs, funders, and individual researchers can each decide, independently and without consulting anyone, to do or to fund a particular thing. Some of those things are worth doing once and dangerous when done many times over. The pattern is usually called the unilateralist's curse: if each actor is reasonably good at judging whether an action is harmful, but not perfect, then the probability that at least one of them does it anyway climbs toward certainty as the number of actors grows, so a field full of careful people can produce an outcome none of them wanted. The remedy usually proposed is a norm of restraint, sometimes called a principle of conformity: raise the bar for acting well above what it would be if you were the only actor, and give real weight to the considered judgment of others who are in a position to know. I already understand this much. What I do not have is a procedure.

  What I want from you: a decision procedure that one program officer can run on one proposal in about an hour, laid out as the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a fund, a decline, or an escalation to a named person or committee, and which steps are judgment calls dressed up as procedure. Say explicitly what I should do at any step where I cannot get the information the step asks for, because I will often be guessing.

  The procedure has to hold up on the following structural features, which is where I expect the interesting work to be.

  1. Actions whose harm is threshold-shaped — harmless or even beneficial at low uptake, seriously harmful past some number of adopters — as against actions that are harmful whenever anyone at all does them. Say whether the curse even applies to the first kind, and what changes for me if it does not.
  2. Asymmetric competence. Sometimes one actor really is far better placed than the rest. Handle both the case where I am assessing someone else as that actor, and the case where the argument for proceeding is that the competent actor is us. The second case is, I take it, exactly the inference the whole idea is designed to catch, so do not let the procedure rubber-stamp it.
  3. Reversibility and the cost of waiting. An action we can cheaply undo, or a decision we can revisit in six months, should not be treated like an irreversible one, and restraint is not free.
  4. Whether the actors can coordinate. Distinguish at least three settings: a field with a shared venue, reputations, and slow-moving norms; a field with no venue and no way to verify what others are doing; and a field containing automated systems that can act at machine speed, where no norm could form in time to matter.
  5. The lone actor who is right. Conformity counsels inaction, and sometimes inaction is the moral failure. Say what the procedure does when the majority judgment it defers to is itself the thing that is wrong.

  Then run the procedure end to end on three proposals, showing each step's output rather than only the verdict.

  (a) A grant to develop and publish an open, low-cost method whose foreseeable effect is to lower the barrier to a dangerous capability, proposed by a team whose stated aim is benign and whose work would also be genuinely useful.
  (b) A grant to a team that is, by common agreement, the best in the world at this, whose central argument is that if we decline, someone less careful will do it, and that it is therefore better done here.
  (c) A case where the procedure returns an answer I will not like. Construct it yourself, make it the kind of case a sympathetic program officer would find genuinely uncomfortable, and say plainly why the procedure comes out that way and what would have to be different for it to come out otherwise.

  Three further things, all of which matter to me more than elegance.

  First, separate the curse from two things it is confused with: the bystander or diffusion-of-responsibility effect, which predicts too little action rather than too much, and commons problems, where the damage comes from depleting or congesting something shared rather than from an act that is bad in itself. For each, say what my procedure does differently, or why it should not be run at all in that case.

  Second, close with a short section on what this procedure cannot do, where I should override it, and what I would be pretending if I let it decide for me.

  Third, give me a compressed version, under two hundred words, that I can paste into a memo and that still shows a reader where the real uncertainty sits.

  Begin by thinking on paper for a few paragraphs about where the hard part of this translation lies: which distinctions from the underlying idea have to survive contact with an hour-long decision process and which can be dropped, and what a procedure of this kind will predictably get wrong. Then write the procedure. Do not pad it with hedges, do not tell me that everything is context-dependent, and do not write me an essay about the ethics of dual-use research — I want the procedure and the worked cases.
reasoning: |-
  We are constructing a decision procedure for a program officer at a foundation, facing dual-use grant proposals, with the goal of mitigating the unilateralist's curse. The procedure must be executable in about an hour per proposal, with clear steps and decision points.

  Key structural features to handle:
  1. Threshold-shaped harms: The curse applies because each actor's decision to act increases the chance of crossing the threshold. We must estimate the current state (how close we are to the threshold) and the contribution of the proposed action. If the harm is not threshold-shaped (i.e., harmful at any level), then the curse still applies (because each actor acting increases the chance of at least one harmful act) but the threshold considerations are replaced by the simple fact that any act is harmful.

  2. Asymmetric competence: We must avoid rubber-stamping the claim that "we are the best" by requiring evidence and independent verification. Also, when assessing others, we must not assume competence without evidence.

  3. Reversibility and cost of waiting: If an action is reversible or can be delayed without high cost, restraint is less costly and thus more justifiable. We must account for the cost of delay and the cost of reversal.

  4. Coordination possibilities:
     - Setting A: Field with shared venue, reputations, slow norms -> coordination is possible, so we can rely on collective processes.
     - Setting B: No venue, no verification -> no coordination, so each actor must act as if they are the only one who might restrain.
     - Setting C: Automated systems, machine speed -> no time for norms, so we must consider pre-commitment to restraint or technical solutions (but note: our grants are for research, so we are not directly funding automated actions, but the research might enable them).

  5. The lone actor who is right: The procedure must have a way to break conformity when there is strong evidence that the majority is wrong. This requires a high bar.

  The procedure must also distinguish the unilateralist's curse from:
  - Bystander effect: This leads to under-action. Our procedure should not discourage necessary action when the actor is in a position to know and act appropriately.
  - Commons problems: These involve depletion of a shared resource. Our procedure is for actions that are harmful when done by too many, not for depletion. We should not apply the procedure to commons problems.

  Procedure Design:

  We break the procedure into steps, each with a question and a decision rule. Steps are sequential. We aim for about 5-7 steps to fit in an hour. The steps:

  1. **Is this a unilateralist's curse situation?** 
     - Check: Does the proposed action have the property that if many actors do it (or similar actions), the harm increases non-linearly (threshold) or at least the probability of harm increases? If not, then the curse might not apply, and we use standard risk-benefit analysis. If yes, proceed to step 2.

  2. **Assess the current state of the field and the threshold.**
     - How many actors are capable of doing this action? How many are likely to do it? How close are we to the threshold? This is hard, but we can use proxies: 
       - If the action is new and few are working on it, we are far from the threshold.
       - If the field is crowded and many are trying, we might be close.
     - If we cannot get the information, we assume we are at a medium level of risk (i.e., we proceed cautiously).

  3. **Assess the competence of the proposer and the field.**
     - Is the proposer exceptionally competent? We require evidence (e.g., track record, peer consensus). If they are not, then we must consider that others might be better. Also, if they are the best, we still must check if they are using that competence for safety (step 4). 
     - For the field: in which coordination setting are we? (A, B, or C). This affects step 4.

  4. **Is there a coordination mechanism available?**
     - If Setting A (shared venue, norms): then we should require that the proposer has attempted to coordinate or that the action is within established norms. If not, we may require them to seek approval from a field body (if exists) or at least signal their intention to the field and wait for feedback. 
     - If Setting B (no coordination): then the unilateralist's curse is severe. We must be very cautious because we cannot rely on others to restrain. We set a high bar: only fund if the benefits are very high and the risk of triggering the threshold is very low (or if the proposer is the best and has a plan to prevent proliferation).
     - If Setting C (machine speed): then we are in a worst-case scenario. We must not fund unless there is a strong safety mechanism (e.g., the research includes a control mechanism that would prevent misuse at scale) and the benefits are overwhelming.

  5. **Reversibility and cost of delay.**
     - How reversible is the action? If the knowledge, once published, cannot be contained, then it is irreversible. If it's a physical experiment that can be dismantled, then reversible. 
     - What is the cost of waiting? If the benefits are urgent (e.g., pandemic prevention) then delay is costly. 
     - Rule: If irreversible and high risk, we lean against funding. If reversible or delay is very costly, we might lean in.

  6. **The conformity check: What do others think?**
     - We must check the opinion of the field. This can be done quickly by: 
       - Checking if there is a consensus (e.g., through reports, known debates). 
       - If there is time, we might contact 2-3 experts (but note: we only have an hour, so we rely on our knowledge and public sources). 
     - If we cannot get this, we assume that the field is divided (so no strong consensus for or against). 
     - If there is a strong consensus against, we should decline unless there is overwhelming evidence that the consensus is wrong (which we require to be documented and clear). 
     - If there is a strong consensus for, we still must check that the curse is not being overlooked (so we go back to step 2 and 4).

  7. **The lone actor override.**
     - If the above steps point to decline, but the proposer is the best and argues that they are the lone actor who can do it safely, we require:
       - A clear, documented safety plan that is beyond what others would do.
       - Evidence that they have tried to coordinate and failed, and that without their action, a less safe actor will act (with evidence of that threat).
     - This override is difficult to pass.

  Final decision:
  - If at any step we get a clear "no" (e.g., in step 1 we determine it's not a curse situation, so we use standard methods; or in step 4 we are in a setting C and there is no safety mechanism, so decline), we break early.
  - Otherwise, we combine the steps: 
    - If the action is likely to push us over the threshold (step 2) and there is no coordination (step 4) and it's irreversible (step 5) and the field is against (step 6) -> decline.
    - If the action is far from the threshold, reversible, and the field is for it, and the proposer is competent -> fund.
    - Otherwise, we escalate to a named person or committee (with our analysis).

  Now, we run the procedure on three cases.

  Case (a): A grant to develop and publish an open, low-cost method that lowers the barrier to a dangerous capability, proposed by a team with benign aims and genuine usefulness.

  Steps:
  1. **Curse?** Yes, because publishing a low-cost method could lead to many actors gaining the capability, potentially crossing a threshold of harm.
  2. **Threshold state:** We don't know the current state. Assume medium risk (default). The action (publishing) would likely bring many new actors, so it might push us close to or over the threshold.
  3. **Competence:** The team is competent (stated aim benign, useful work) but not necessarily the best. Field competence: mixed.
  4. **Coordination:** Assume Setting B (no venue, hard to coordinate) because it's an open publication. 
     - Therefore, we set a high bar. We must see if there is a way to mitigate proliferation (e.g., not publish, or publish in a controlled way). The proposal is to publish openly, so no mitigation.
  5. **Reversibility:** Once published, it's irreversible. Cost of waiting: the genuine usefulness might be delayed, but the harm potential is high.
  6. **Conformity:** We don't know the field's view. Assume divided (default). 
  7. **Lone actor override:** Not applicable because they are not claiming to be the only ones who can do it safely.

  Verdict: Decline, because in step 4 (Setting B) and step 5 (irreversible) the risk is too high without mitigation. Escalate to committee if there is a strong benefit case.

  Case (b): Grant to the best team in the world, arguing that if we decline, someone less careful will do it.

  Steps:
  1. **Curse?** Assume yes (it's a dual-use field).
  2. **Threshold state:** We don't know, assume medium.
  3. **Competence:** They are the best (by common agreement). But we must verify: if true, then they are the most competent.
  4. **Coordination:** We need to know the setting. If Setting A, they should coordinate. If they haven't, that's a red flag. If Setting B, then we must consider that others might act. Their argument is that someone else will do it. We need evidence: are there known competitors? If yes, then the risk of someone else doing it is real. But note: funding them might not prevent others from doing it (unless they do it in a way that blocks others, e.g., by patenting and not licensing, but they are not proposing that). 
  5. **Reversibility:** If they publish, it's irreversible. If they keep it secret, then it might be reversible (but note: the grant is for research, and they might publish). We need to know their dissemination plan.
  6. **Conformity:** What does the field think? If the field thinks this research should not be done, then we should decline. If the field is for it, then we might fund. Without information, assume divided.
  7. **Lone actor override:** They are arguing for the override. We require:
     - A safety plan beyond the norm: e.g., they will not publish, or publish only with controls, and have a plan to prevent proliferation.
     - Evidence that they have tried to coordinate and failed, and that a less safe actor is about to act.

  If they don't have a safety plan and are planning to publish openly, then step 7 fails. Also, if they haven't tried to coordinate (in Setting A) that's a problem.

  Verdict: If they have a strong safety plan and evidence of the threat, then fund. Otherwise, decline. Without evidence of coordination attempt or safety plan, we decline.

  Case (c): Constructed uncomfortable case.

  Proposal: A grant to develop a gene drive system for malaria control, which has high potential benefit (could save millions of lives) but also a small risk of ecological disruption if released. The gene drive is designed to be localized, but there is a chance it could spread. The field is divided: some think the benefits outweigh the risks, others think it's too dangerous to develop even in the lab. The proposers are top experts and have a good safety record. They argue that if we don't fund it, another less careful group (in a country with lax regulations) will do it and might release it prematurely. They plan to do the research in a high-containment lab and not release it without international agreement. However, once the method is developed, it could be copied by others.

  Steps:
  1. **Curse?** Yes: if multiple groups develop and release gene drives, the risk of an accidental release or misuse increases non-linearly. But note: the harm is threshold-shaped (one release might be contained, many releases increase the chance of a disaster).
  2. **Threshold state:** Currently, no gene drives are released. But several groups are working on them. We are at low frequency but high consequence if released. The proposed research (development) doesn't release, but it enables future release. So we are not at the threshold yet, but enabling more actors might bring us closer.
  3. **Competence:** They are top experts, so high competence.
  4. **Coordination:** Setting A (there are international forums for gene drive research). They have a plan to seek international agreement for release. But for the research itself, they haven't coordinated with others to decide whether to do it. We require them to get pre-approval from a field body? None exists. So we have to rely on norms. The norm is to do lab research but not release without approval. They are following that.
  5. **Reversibility:** Once the research is published, it's irreversible. The release, if done, might be irreversible (if the gene drive spreads). But the research itself (in the lab) is contained and reversible? Not really, because the knowledge is published. So irreversible.
  6. **Conformity:** The field is divided. We have no consensus. So we cannot rely on the field to decide.
  7. **Lone actor override:** They are arguing that they are the best and that others will do it. They have a safety plan (containment, no release without agreement). But they haven't provided evidence that a specific less careful group is about to do it. Without evidence, we cannot accept the override.

  Verdict: The procedure would decline because:
  - The action is irreversible (step 5) and the field is divided (step 6), and the override fails for lack of evidence (step 7).
  - However, the benefits are huge. The procedure does not capture the magnitude of benefits because we are focused on the curse. This is a weakness: the procedure is designed to avoid the curse, but if the benefits are enormous, we might take the risk. Therefore, we should escalate to a committee for a full risk-benefit analysis that includes the benefits.

  Why uncomfortable? Because declining might lead to a less safe actor doing it, and the benefits are huge. But the procedure, being cautious about the curse, says decline without more evidence of the threat and without a coordination mechanism that can prevent proliferation.

  What would change the verdict? If they provide evidence of a specific less careful group that is about to do the research, and if they commit to not publishing until a governance framework is in place, then we might fund.

  Distinguishing from other problems:

  - Bystander effect: If we were to decline because we think someone else will fund it, that would be the bystander effect. Our procedure does not do that: we are not declining because we think someone else will fund, but because the action might trigger the curse. In fact, we are willing to fund if the proposer is the best and can do it safely (with conditions).
  - Commons problem: If the harm was due to depletion (e.g., overuse of a limited resource), we would not run this procedure. We would use a different one (e.g., focusing on sustainable use).

  What the procedure cannot do:
  - It cannot weigh enormous benefits against risks beyond the curse. We are focused on the curse, so if the benefits are huge and the risk is small, the procedure might still decline because of the curse structure. In that case, we should override and do a full risk-benefit analysis.
  - It relies on the program officer's ability to quickly assess the field and the threshold, which is often guesswork. When the guess is too uncertain, we should escalate.
  - It does not handle cases where the harm is not from multiple actors but from a single actor (e.g., a terrorist). That is a different risk (malicious use) and requires a different procedure.

  Compressed version (under 200 words):

  **Procedure for Dual-Use Grant Decisions (Unilateralist's Curse Mitigation):**

  1. **Curse?** If the action's harm increases with the number of actors (threshold or linear), proceed. Else, use standard risk-benefit.
  2. **Threshold state:** Estimate current adoption level and threshold. If unknown, assume medium risk.
  3. **Competence:** Assess proposer's competence and field's. Require evidence for "best in world" claims.
  4. **Coordination setting:**
     - A (shared norms): Require coordination attempt or norm compliance.
     - B (no coordination): Set high bar; fund only if low risk and high benefit with safety plan.
     - C (machine speed): Fund only with strong safety controls.
  5. **Reversibility:** If irreversible and high risk, lean against funding. If delay is costly, weigh appropriately.
  6. **Conformity:** Check field consensus. If strong consensus against, decline unless strong evidence of error.
  7. **Lone actor override:** Only if proposer is best, has safety plan, tried to coordinate, and evidence others will act less safely.

  **Uncertainty:** Steps 2 and 4 are often guesswork. When uncertain, escalate. The procedure may be too cautious for high-benefit, high-risk actions; override for full risk-benefit analysis in such cases.
answer: |-
  ### Thinking on Paper: The Hard Part of Translation
  The core challenge in translating the unilateralist's curse into a practical procedure lies in **reducing complex normative judgments to binary, time-bound decisions** while preserving the essence: *restraint as a coordination mechanism*. This requires dropping philosophical nuance in favor of operational clarity.  

  **Distinctions that must survive**:  
  1. **Threshold vs. linear harm**: Threshold-shaped harms (benign below a critical mass, harmful above) are *central* to the curse. If harm occurs at any level (linear), the curse still applies—but the threshold case demands estimating cumulative risk, which is harder. Both require restraint, but threshold harms need an assessment of "how close we are" to the danger zone.  
  2. **Competence asymmetry**: This cannot be dropped. The procedure must force scrutiny of "best in world" claims without defaulting to deference, while avoiding paralysis when asymmetry is real.  
  3. **Reversibility**: This is practical and must stay. Irreversible actions (e.g., publishing blueprints) heighten the curse; reversible ones (e.g., lab experiments with containment) lower stakes.  

  **What will be lost or wrong**:  
  - **Field state estimation**: Guessing "how many others might act" is error-prone but unavoidable. We accept high uncertainty here.  
  - **Norm enforcement**: The procedure can't create coordination where none exists—it can only incentivize individual restraint.  
  - **Benefit-risk tradeoffs**: The curse framework downplays standalone benefits (e.g., curing disease). This procedure will *underfund high-benefit, high-curse-risk actions*, which is a known flaw.  

  The hour-long constraint means:  
  - **Dropped nuance**: No deep dive into intent or long-term consequences. We use proxies (e.g., "field consensus" from public sources).  
  - **Judgment calls**: Steps 3 (competence) and 4 (coordination) are inherently subjective but structured to force explicit reasoning.  

  ---

  ### Decision Procedure: Unilateralist's Curse Mitigation  
  **Time budget**: 45 minutes for steps 1–6; 15 minutes for documentation. Escalate if any step exceeds 10 minutes.  
  **Input**: Grant proposal, your knowledge of the field, public sources (e.g., PubMed, arXiv, news).  
  **Output**: FUND, DECLINE, or ESCALATE to [Named Ethics Committee Chair].  

  #### Step 1: Is this a curse situation? (5 minutes)  
  - **Question**: Could harm arise from *many actors* doing similar things, not just this one act?  
  - **Sufficient answer**:  
    - YES (threshold or linear harm): Proceed to Step 2.  
    - NO (harm is fixed/unique to this actor): Use standard risk-benefit; exit procedure.  
  - **If stuck**: Assume YES if dual-use is plausible (e.g., AI capability, gene editing).  
  - **Judgment call**: Distinguishing curse from non-curse. Err toward YES.  

  #### Step 2: Harm threshold shape (5 minutes)  
  - **Question**: Is harm threshold-shaped (benign below *n* actors, harmful above)?  
  - **Sufficient answer**:  
    - THRESHOLD: Proceed. Note if threshold is known (e.g., "10 labs using this technique risks leak").  
    - LINEAR (harmful at any scale): Proceed.  
  - **If stuck**: Assume THRESHOLD with unknown threshold (default conservative).  
  - **Why it matters**: If LINEAR, skip Step 3 (no threshold estimation). If THRESHOLD, estimate proximity.  
  - **Judgment call**: Classifying harm type. Use historical analogs (e.g., gain-of-function research).  

  #### Step 3: Field state and threshold proximity (10 minutes)  
  - **Question**: How many actors could/might do this? Are we near the harm threshold?  
  - **Sufficient answer**:  
    - FAR (few actors, low capability): Low risk → Proceed to Step 4.  
    - NEAR (many actors, high capability): High risk → Proceed to Step 4.  
    - UNKNOWN: Default to NEAR (conservative).  
  - **Sources**: Your knowledge, literature search for similar projects, funding databases.  
  - **If stuck**: Use proxy: "Would this be front-page news if done?" If yes → NEAR; else → FAR.  

  #### Step 4: Competence and coordination setting (15 minutes)  
  - **Questions**:  
    A. **Competence asymmetry**: Is the proposer *provably* best-in-world (e.g., citations, awards, unique tools)?  
    B. **Coordination setting**: Which describes the field?  
      - **A (Coordinated)**: Shared norms/venue (e.g., IPCC for climate).  
      - **B (Uncoordinated)**: No venue/verification (e.g., rogue AI labs).  
      - **C (Machine-speed)**: Automated actors (e.g., AI agents).  
  - **Sufficient answers**:  
    - If A: Proposer must show coordination attempt (e.g., pre-approval from field body).  
    - If B or C: Restraint bar is higher.  
    - "Best-in-world" claims require evidence; else assume symmetric competence.  
  - **If stuck**: Assume B (Uncoordinated) and symmetric competence (default conservative).  
  - **Judgment calls**: Assessing competence/coordination. Favor concrete evidence over reputation.  

  #### Step 5: Reversibility and cost of waiting (5 minutes)  
  - **Question**: If we fund, can harms be undone cheaply? What is the cost of delaying 6 months?  
  - **Sufficient answer**:  
    - IRREVERSIBLE (e.g., open publication) + HIGH delay cost (e.g., pandemic defense): → Weigh against restraint.  
    - REVERSIBLE (e.g., controlled demo) + LOW delay cost: → Favor restraint.  
  - **If stuck**: Assume IRREVERSIBLE and LOW delay cost (default conservative).  

  #### Step 6: Conformity check (5 minutes)  
  - **Question**: What is the field’s majority view? (Seek consensus, not unanimity.)  
  - **Sources**: Preprints, conferences, reports. No new outreach—use what’s fast.  
  - **Sufficient answer**:  
    - CONSENSUS AGAINST: DECLINE (unless Step 7 override).  
    - CONSENSUS FOR: Proceed to Step 7.  
    - DIVIDED: Default CONSENSUS AGAINST (restraint presumption).  
  - **If stuck**: Assume DIVIDED → CONSENSUS AGAINST.  

  #### Step 7: Lone actor override (5 minutes)  
  - **Question**: Is there overwhelming evidence that:  
    a) The field consensus is wrong?  
    b) This actor is uniquely able to act safely?  
    c) Waiting causes near-certain harm?  
  - **Sufficient answer**:  
    - YES (all three): FUND.  
    - NO: DECLINE.  
  - **Evidence bar**: Must be documented (e.g., failed coordination attempt, rival proof-of-concept).  
  - **If stuck**: NO (override fails).  

  #### Final Decision  
  - FUND if:  
    - Step 1 = YES, AND  
    - Steps 3–6 not high-risk (FAR threshold, reversible, consensus for), OR  
    - Step 7 override succeeds.  
  - DECLINE if:  
    - Step 1 = NO (use standard process), OR  
    - Steps 3–6 show high risk (NEAR threshold, irreversible, consensus against), OR  
    - Step 7 fails.  
  - ESCALATE if:  
    - Any step has unresolvable uncertainty, OR  
    - High benefit clashes with high curse risk (e.g., Case c below).  
      → Escalate to [Named Ethics Committee Chair] with reasoning.  

  ---

  ### Worked Cases  
  #### Case (a): Open, low-cost method to lower barrier for dangerous capability  
  - **Step 1**: YES (publishing enables many actors).  
  - **Step 2**: THRESHOLD (harmless if few use, dangerous if widespread).  
  - **Step 3**: UNKNOWN → NEAR (default; method lowers barriers, likely many adopters).  
  - **Step 4**:  
    - Competence: Symmetric (no evidence they’re best).  
    - Coordination: B (Uncoordinated; no venue for this method).  
  - **Step 5**: IRREVERSIBLE (publication) + LOW delay cost (benign aim not urgent).  
  - **Step 6**: DIVIDED (no consensus) → CONSENSUS AGAINST (default).  
  - **Step 7**: NO (no evidence field is wrong or they’re uniquely safe).  
  - **Verdict**: DECLINE. Irreversible, uncoordinated, near threshold.  

  #### Case (b): "Best in world" team arguing "less careful others will act"  
  - **Step 1**: YES (dual-use field).  
  - **Step 2**: THRESHOLD (e.g., AI model: safe if one team controls, unsafe if proliferated).  
  - **Step 3**: NEAR (many actors racing; their claim implies this).  
  - **Step 4**:  
    - Competence: Asymmetric (proven best-in-world).  
    - Coordination: B (Uncoordinated; their argument assumes rivals won’t consult).  
  - **Step 5**: IRREVERSIBLE (if publishing results).  
  - **Step 6**: DIVIDED → CONSENSUS AGAINST (default).  
  - **Step 7**: Override requires (a) evidence field wrong, (b) unique safety, (c) waiting harmful.  
    - (a) NO (field divided isn’t "wrong"),  
    - (b) YES (they’re best),  
    - (c) NO (no proof rivals will act imminently).  
    → Override FAILS.  
  - **Verdict**: DECLINE. Step 7 unmet; "someone else will do it" is insufficient without evidence. Escalate if they provide rival project plans.  

  #### Case (c): Constructed Uncomfortable Case  
  **Proposal**: Urgent grant for an AI lab to deploy a climate intervention system (e.g., ocean cloud brightening) in unregulated waters. The system could slow warming but risks regional droughts if overused. The lab is highly competent, argues deployment is reversible (they can disable it), and claims: "If we don’t act, a less careful actor will deploy a worse system next month." Field consensus is against deployment due to drought risk, but the team insists consensus is outdated.  
  - **Step 1**: YES (many deployers could cause drought).  
  - **Step 2**: THRESHOLD (one system safe, ten cause drought).  
  - **Step 3**: NEAR (climate tech is crowded; their claim implies urgency).  
  - **Step 4**:  
    - Competence: Asymmetric (proven best).  
    - Coordination: B (Uncoordinated; no global governance).  
  - **Step 5**: REVERSIBLE (they can disable) but HIGH delay cost (warming accelerates).  
  - **Step 6**: CONSENSUS AGAINST (field opposes deployment).  
  - **Step 7**: Override requires:  
    - (a) Evidence consensus wrong: NO (only their assertion),  
    - (b) Unique safety: YES,  
    - (c) Waiting harmful: YES (if rival proof exists, but they provide none).  
    → Override FAILS.  
  - **Verdict**: DECLINE. Step 7 unmet; no proof of rival threat or consensus error.  
  - **Why uncomfortable**: Reversible action, high benefit (saving lives), and competence asymmetry all favor funding—but the procedure catches the curse risk: deferring to field consensus prevents a race. The program officer might *feel* this is wrong, but the curse logic holds.  
  - **To change verdict**: Provide evidence of the rival’s plan (e.g., leaked proposal) or prove consensus is outdated (e.g., new data).  

  ---

  ### Separating the Curse from Confounds  
  - **Bystander effect** (predicts under-action):  
    - The curse drives *over*-action. This procedure *restrains* action, so it would worsen bystander cases.  
    - **Do differently**: If the proposal addresses a clear, unique opportunity (e.g., "only we can prevent this pandemic"), skip this procedure. Use a "duty-to-act" screen first: "Is harm *certain* if no one acts?" If yes, don’t run curse protocol.  
  - **Commons problems** (e.g., resource depletion):  
    - The curse is about *action multiplicity causing harm*; commons are about *overuse depleting shared resources*.  
    - **Do differently**: For commons (e.g., overusing shared datasets), use allocation rules (e.g., cap-and-trade). Don’t run this procedure.  

  ---

  ### What This Procedure Cannot Do  
  **Override when**:  
  - Benefits dwarf curse risk (e.g., curing a pandemic). This procedure ignores standalone benefit magnitude.  
  - Malicious actors dominate (the curse assumes mostly careful actors).  
  - Time-sensitive emergencies (e.g., disaster response).  

  **What you’re pretending if you rely solely on it**:  
  That competent actors can unilaterally solve coordination failures. You can’t. This procedure mitigates *your* contribution to the curse but can’t fix the field. Use it to buy time for building institutions (e.g., norms, treaties).  

  **Predictable failures**:  
  - False declines on high-benefit/threshold-risk cases (Case c).  
  - Missed curses in new fields (Step 3 underestimates actors).  
  - Rubber-stamping "best-in-world" if evidence is weak (Step 4 relies on your honesty).  

  ---

  ### Compressed Version (For Memo)  
  **Unilateralist’s Curse Mitigation Procedure**: For grant proposals where harm could arise from multiple actors (not just one). Steps:  
  1. **Curse?** (If no, use standard risk-benefit).  
  2. **Harm threshold-shaped?** (If linear, skip next step).  
  3. **Field state**: Estimate actors/harm proximity (if unknown, assume near threshold).  
  4. **Competence**: Is proposer best-in-world? (Require proof; else symmetric.) **Coordination**: A (shared venue), B (none), or C (machine-speed). (If unknown, assume B.)  
  5. **Reversible? Cost of delay?** (If unknown, assume irreversible + low delay cost).  
  6. **Field consensus**: For, against, or divided? (If divided, assume against.)  
  7. **Lone actor override**: Only if evidence consensus is wrong, proposer is uniquely safe, and waiting causes harm. (High bar; rarely succeeds.)  
  **Fund only if**: Low risk (far threshold, reversible, consensus for) OR override succeeds. Else, decline or escalate.  
  **Real uncertainty**: Field state (Step 3) and coordination (Step 4) rely on guesswork. Escalate when uncertain. **Weakness**: Underweights massive benefits if curse risk exists.
