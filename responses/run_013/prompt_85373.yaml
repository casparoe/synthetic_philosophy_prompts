  The core challenge is designing a question around this hypothetical: A war where a neutral oracle has incontrovertibly settled jus ad bellum before combat begins - aggressor soldiers know their cause is unjust, defenders know theirs is just. The TA wants students to analyze which defenses of combatant equality collapse under this thought experiment versus which might survive, while distinguishing between moral permissibility and liability. They also want students to consider legal implications once moral equality is removed.

  I need to craft three components: 
  First, an exam question that clearly sets up the hypothetical while directing analysis toward argument surgery. It must avoid leading students to predetermined conclusions but focus them on testing the robustness of equality defenses. Key elements include the oracle premise, separation of permission/liability, coercive circumstances for aggressors, and legal-pragmatic considerations.

  Second, a model answer demonstrating argument-driven analysis without citations. It should: show how ignorance-dependent defenses fail (Walzer's excusing conditions), examine survivors (coercion/role-based arguments), separate permission from liability, acknowledge coercive contexts, and challenge legal conventions. The tone must be analytical, using the hypothetical as a scalpel.

  Third, a marking scheme prioritizing argument dissection over name-dropping. Five must-hit points: 
  1) Identifying ignorance-dependent arguments (4 marks) 
  2) Evaluating surviving defenses (5 marks) 
  3) Permission/liability distinction (4 marks) 
  4) Unjust combatant coercion (3 marks) 
  5) Legal implications (4 marks). 
  Typical mistakes include conflating points or reverting to summary. An A paper will show original synthesis beyond checklist responses.

  The TA emphasized American English spellings ("defense") and strict avoidance of British variants. The model answer must adhere to this while maintaining academic rigor. The hypothetical's design cleverly isolates variables - by removing epistemic uncertainty, it exposes which equality arguments rely on fog-of-war assumptions versus deeper principles. This should push students beyond binary "Walzer wins/loses" takes toward nuanced structural analysis.
answer: |-
  ### (a) Exam Question  

  **Ethics of War Final Examination (45 Minutes / 20 Marks)**  

  **Scenario:** Two states are sliding toward war. An internationally trusted, neutral monitoring body (with a verifiable public record) has irrevocably settled the *jus ad bellum* question: State A is the unambiguous aggressor fighting an unjust war; State B is fighting a just defensive war. **All combatants on both sides know and accept this verdict before hostilities begin.** There is no deception, fog of war, or reasonable doubt about the justice of the causes.  

  **Question:**  
  Critically evaluate the implications of this scenario for the doctrine of the "moral equality of combatants." Specifically:  
  1. Which standard defenses of moral equality **depend critically on combatants' ignorance** of their war’s justice (and thus fail under these conditions), and which defenses might **still plausibly hold**?  
  2. Does this scenario eliminate the **moral permission** for unjust combatants to kill just combatants? Does it eliminate the **moral liability** of just combatants to be killed? Keep these questions distinct.  
  3. How might coercive circumstances (e.g., conscription under duress) for unjust combatants complicate the above answers, even with full knowledge of injustice?  
  4. If moral equality collapses here, can the **legal practice** of granting equal protections to all combatants under the laws of war still be justified? Or was it always a pragmatic convention?  

  Argue analytically. Do not merely summarize theories; dissect how the hypothetical tests their foundations.  

  ---

  ### (b) Model Answer (Approx. 700 words)  

  The hypothetical scenario—where combatants know with certainty which side holds a just cause—fatally undermines key defenses of moral equality but leaves others contested. Crucially, it exposes that many traditional arguments rely on epistemic limitations to function, while forcing us to confront whether surviving defenses retain coherence.  

  First, defenses grounded in **symmetry of risk and epistemic uncertainty** collapse. Michael Walzer’s core claim—that combatants on both sides share a "moral equality" because neither can reliably judge their state’s cause or are bound by duty to obey—dissolves here. Unjust combatants (*State A*) *know* their cause is wrongful. They cannot plead ignorance or reasonable deference to authority. Their choice to fight is thus a knowing contribution to aggression. Defenses relying on the "fog of war" or the unreliability of individual judgment evaporate; the oracle eliminates their premise. Arguments suggesting combatants are "morally blind" to the ad bellum question similarly fail.  

  However, some defenses **purport to survive** the loss of ignorance. One appeals to the **functional role** of soldiers: combatants, it holds, are instruments of state policy regardless of justice, and their right to kill derives from their status as agents in a collective conflict, not personal moral assessment. Another emphasizes **coercion and duress**: even knowing the war is unjust, conscripts threatened with execution for desertion might retain a permission to fight as a lesser evil. Importantly, the *liability* of just combatants (*State B*) to be killed might still be defended via **self-defense principles**: if an unjust soldier is actively trying to kill a just soldier, the latter may permissibly kill in defense, rendering the just soldier *liable* to defensive harm *by that unjust combatant* in the moment, even if the broader war is unjust.  

  This highlights the critical **permission/liability distinction**. Removing ignorance likely **eliminates the moral permission** for unjust combatants to kill. Knowing they fight for aggression, killing just defenders becomes morally akin to murder; they lack a just cause. However, **liability** is context-dependent. A just combatant might still be *liable* to be killed **if** they pose an immediate, unjustified threat—say, by using excessive force or targeting civilians. But crucially, in this scenario, the unjust combatant attacking them is *not* morally permitted to inflict that harm. The permission belongs only to the just side. Coercion complicates this: an unjust conscript forced to fight at gunpoint might retain a *personal excuse* mitigating blameworthiness, but this doesn’t grant *permission* to kill innocents. Their act remains wrongful; they are merely less culpable.  

  Finally, the collapse of moral equality challenges the **legal equality** codified in International Humanitarian Law (IHL). If unjust combatants lose moral standing when knowledge replaces ignorance, why treat them legally as equals? Pragmatic justifications become paramount: IHL equality might be an essential *convention* to ensure reciprocity, protect prisoners, and simplify battlefield identification. It avoids chaotic "who’s just?" determinations mid-combat—even if, *ex hypothesi*, we’ve solved that pre-war. This suggests the legal rule is fundamentally pragmatic, not a reflection of enduring moral symmetry. It functions to minimize suffering amid inevitable human imperfection, not because aggressors and defenders are morally equivalent when truth is clear.  

  In sum, the oracle fatally wounds defenses rooted in ignorance while pressuring role-based or self-defense-based defenses to bear greater weight. It severs the moral permission of unjust combatants but leaves liability contextually nuanced. Coercion excuses without justifying. Legally, equality likely persists as a necessary fiction for order, not a moral truth revealed.  

  ---

  ### (c) Marking Scheme (20 Marks Total)  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Botch**                                                                 |  
  |-----------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------|  
  | **1. Correctly identifies arguments for moral equality that DEPEND on ignorance** | 4         | Lists defenses without showing *why* they fail (e.g., just says "Walzer fails"). |  
  | **2. Evaluates defenses that MIGHT survive & whether they hold under scrutiny**    | 5         | Assumes all defenses fail, or uncritically accepts surviving defenses.           |  
  | **3. Clearly distinguishes PERMISSION to kill (aggressor side) from LIABILITY to be killed (defender side)** | 4 | Conflates permission/liability or treats them as identical. |  
  | **4. Addresses how coercion complicates culpability WITHOUT granting permission**  | 3         | Treats coercion as justifying killing, not merely excusing it.                   |  
  | **5. Analyzes legal-pragmatic justification for IHL equality post-moral collapse** | 4         | Assumes legal equality must mirror morality or ignores pragmatic rationale.      |  

  **Separating an A from a B:**  
  An **A** paper synthesizes these points into a coherent argument showing *how* the hypothetical dissects theories, demonstrates independent critical judgment about "surviving" defenses, and avoids treating the points as a checklist. A **B** paper hits all points competently but lacks fluid integration, deeper analysis of contradictions, or original insight about liability/pragmatism.
