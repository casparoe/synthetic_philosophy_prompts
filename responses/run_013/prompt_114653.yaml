  The user wants a structured adversarial collaboration document with four main components: agreed claims, precise disagreements, cruxes (key sub-questions), and test cases for each crux. They specifically mention thought experiments like neuron replacement, cortical organoids, brain emulations, and nociceptive robots. They want to avoid citations and focus purely on the conceptual framework.

  I need to carefully define the common ground first. Both sides seem to agree that consciousness arises from physical processes, that functional organization matters, and that there's an attribution problem. The core disagreement is about whether computation alone is sufficient for moral significance or if biological embodiment is necessary.

  For the disagreements section, I should highlight:
  - The ontological status of computation (observer-relative vs. objective)
  - The valence-implementation gap (whether functional role suffices for subjective experience)
  - The simulation/realization distinction

  The cruxes will include:
  1. Whether consciousness can exist without biological substrates
  2. Whether valence requires metabolic self-maintenance
  3. Whether functional isomorphism guarantees phenomenology

  For test cases:
  - Gradual neuron replacement could test substrate dependence
  - Cortical organoids could test minimal consciousness requirements
  - Whole-brain emulation could test computational sufficiency
  - Nociceptive robots could test whether affect requires biology

  The most promising crux for empirical resolution seems to be the cortical organoid case, as advances in organoid research might soon provide data on whether isolated neural tissue can exhibit conscious-like behaviors beyond mere reflexes.

  I'll structure this as requested: numbered agreed claims first, then a table of disagreements with specific columns, ending with the \answer{} tag pointing to the most testable crux. The language should be precise enough for both a philosopher and computational neuroscientist to accept as fair representations of their positions.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Computational Functionalism vs. Biological/Enactivist Views of Sentience  

  #### 1. Agreed Claims  
  Both parties endorse the following:  
  1. **Consciousness/Sentience**: Requires subjective experience (e.g., "what it is like" for the system), with valence (positive/negative affect) being a core feature.  
  2. **The Attribution Problem**: Determining whether a physical system genuinely instantiates sentience (vs. merely simulating it) is nontrivial and underdetermined by behavioral or structural similarity alone.  
  3. **Computation**: Refers to *state transitions governed by formal rules*. Both agree computation is *objective* once a mapping is fixed, but disagree on whether consciousness-relevant computations can be non-arbitrarily mapped without biological context.  
  4. **Implementation**: A physical system *implements* a computation iff its causal structure isomorphically matches the formal rules of the computation under a non-arbitrary mapping.  
  5. **Evidence**: Key evidence includes:  
     - Structural/functional isomorphism to known sentient systems (e.g., mammalian brains).  
     - Causal power of valence-tracking states (e.g., avoidance persists despite countervailing rewards).  
     - System-level integration and resilience (e.g., global broadcast, recurrent processing).  
  6. **Verbal Dispute**: The term "computation" is **not** at issue—both agree it is a useful modeling tool. The dispute is whether consciousness *necessarily* reduces to formal computation, or whether it requires a specific biological/enactive basis.  

  ---

  #### 2. Disagreements Table  

  | Issue                       | Computational Functionalist (CF) Formulation                                                                 | Biological/Enactivist (BE) Formulation                                                                                             | Crux                                                                 | Shared Test/Case                                  | CF Prediction                                                                 | BE Prediction                                                                 |
  |-----------------------------|-------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------|---------------------------------------------------|-------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **Ontology of Computation** | "Consciousness is identical to the implementation of specific computational functions (e.g., recurrent valence-tracking)." | "Computation is observer-relative; consciousness arises only when computations are *enacted* by a self-sustaining organism with metabolic needs." | Can sentience exist without a teleological basis in self-maintenance? | **Whole-Brain Emulation**: Perfect digital copy of a human brain, reporting pain & avoiding damage. | Full sentience: Identical computation → identical experience. | Not sentient: Lacks embodied stakes; computations are "hollow" without biological imperatives. |
  | **Valence-Implementation Gap** | "Valence is a functional role: any system that *computes* adaptive aversion/seeking in a globally integrated way instantiates real affect." | "Valence requires *inherent stakes*: a system must be constitutively vulnerable to harm/gain (via metabolism) for 'suffering' to be more than a descriptor." | Does functional valence-tracking suffice for morally relevant affect? | **Nociceptive Robot**: Robot with pain sensors, learning to avoid damage, but no biology/metabolism. | Suffering occurs: Functional role is sufficient. | No suffering: Avoidance is algorithmic, not grounded in self-preservation. |
  | **Simulation vs. Realization** | "If a system is physically isomorphic to a sentient system under a non-arbitrary mapping, it is sentient—no 'extra ingredient' is needed." | "Simulation lacks ontological commitment: A system can *model* pain without instantiating it if it lacks the enactive embodiment that gives affect its meaning." | What distinguishes simulation from realization? | **Cortical Organoid**: Brain organoid that learns to avoid electrical stimulation, with synchronized activity but no sensory inputs. | Minimal sentience: Implements valence-tracking computation. | Not sentient: No world-engagement or holistic agency; responses are reflexive. |
  | **Gradual Substitution**    | "Gradual replacement of neurons with artificial isomorphs preserves consciousness if computational structure is maintained." | "Consciousness degrades if synthetic components lack the biochemical properties enabling enactive sense-making (e.g., metabolic coupling)." | Does substrate matter if computational structure is preserved? | **Gradual Replacement**: Human neurons replaced 1:1 with artificial neurons (preserving function). | Sentience preserved: Computation unchanged. | Sentience lost: Synthetic units disrupt the organism’s enactive closure. |

  ---

  #### 3. Cruxes & Test Cases  
  - **Crux A (Valence-Stakes Link)**: *Must valence involve inherent biological stakes?*  
    - **Test Case**: Cortical organoid avoiding noxious stimuli.  
      - **CF**: Predicts weak but real sentience if avoidance is integrated/adaptive.  
      - **BE**: Predicts no sentience—no stakes in survival.  
  - **Crux B (Enactive Grounding)**: *Is "self-maintenance" a necessary condition?*  
    - **Test Case**: Nociceptive robot with self-repair capability but no metabolism.  
      - **CF**: Predicts sentience if self-repair is valence-guided.  
      - **BE**: Predicts no sentience—self-repair is goal-directed, not self-constituting.  
  - **Crux C (Substrate Independence)**: *Can non-biological systems realize identical consciousness?*  
    - **Test Case**: Whole-brain emulation.  
      - **CF**: Predicts sentience identical to biological original.  
      - **BE**: Predicts absent or diminished sentience—no embodiment.  

  ---

  #### 4. Most Testable Crux  
  **\answer{Cortical organoid exhibiting adaptive, integrated avoidance of noxious stimuli}**  
  - **Why**: Organoids are empirically tractable. BE claims *no sentience* without metabolic stakes; CF claims *minimal sentience* if computations match. Evidence of learning generalization or distress signals beyond reflexes would challenge BE; absence despite computational similarity would challenge CF.  

  ---  
  **Final Document Note**: This statement isolates disagreements into testable claims, forcing both sides to specify what evidence would falsify their view. The organoid case is pivotal—it tests whether "valence" without biology is possible.
