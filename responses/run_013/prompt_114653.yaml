prompt: |-
  My sister spent three weeks in a medically induced coma last year after a car crash, and the whole time the neurologist kept saying versions of "the scans show activity but we can't tell if anyone's in there." Since then I've been weirdly obsessed with the question of which computations matter morally—not in the abstract "is GPT conscious" way, but the attribution side: when is a computation actually the system's computation, and when is it just something we can describe it as doing? I'm finishing an MA in philosophy, and my best friend from undergrad is a computational neuroscientist who's now at a lab doing brain organoids. We've been arguing for months. She's a computational functionalist: she thinks if a system implements the right kind of recurrent, globally broadcast, valence-tracking computation, then it doesn't matter what it's made of. I've drifted toward a biological/enactivist line: I think computation is observer-relative or at least underdetermined by the physics, and that affect/valence may require a self-maintaining organism with metabolic stakes, not just a formal pattern. We keep talking past each other—she thinks I'm a carbon chauvinist, I think she's sliding from "we can model it as computing X" to "it computes X" to "X is realized and therefore matters."

  I want the document we should have written instead of another arguement: a joint statement for an adversarial collaboration between computational functionalism about sentience and the biological/enactivist view. I need (1) the claims both sides can actually sign, including about what "computation" and "implementation" mean for this purpose, what the attribution problem is, and what would count as evidence either way; (2) the precise remaining disagreements, each phrased in wording the side that holds it would accept—especially the "simulation-realization slide" (if a simulation of pain isn't pain, what exactly is missing?) and the "valence-implementation gap" (why should any purely functional role for valence be enough?); (3) the cruxes, i.e. the sub-questions where settling one would move at least one side; and (4) for each crux, a concrete case or thought experiment both sides agree bears on it, with each side's prediction written down in advance. Cases I keep coming back to: gradual neuron replacement in a living person; a cortical organoid that learns to avoid a noxious stimulus; a whole-brain emulation that reports pain and avoids damage; and a robot with nociceptive loops but no metabolism. If part of our dispute is merely verbal—say, about whether "computation" is a natural-kind term or a modeling stance—say so and explain which part. Don't give me citations or a reading list; I can't use them, and I don't care who said what. Format it as a numbered agreed-claims section, then a disagreements table with columns for the issue, each side's formulation, the crux, the shared test/case, and each side's prediction. End with one final line exactly in the form \answer{...} where the brackets contain the single crux you think is most likely to be settled by evidence rather than by stipulation.
