  1. Should analysts be *required* to incorporate independent prior evidence?  
  2. Is a two-sided \(\alpha = 0.05\) test always appropriate for novel interventions?  
  3. How might Bayesians avoid "prior laundering" (biased priors masquerading as objective)?  
  4. Does this case suggest switching to Bayesian methods would mitigate replication failures? Why/why not?
