prompt: |-
  I'm a third-year philosophy student in an epistemology seminar, and for our unit on the Gettier problem I've been asked to write a satirical piece. I want it to be a mock internal memo and accompanying FAQ from a fictional Office of Epistemic Compliance at a university that has decided to treat knowledge as justified true belief plus a fourth condition, and now runs every Gettier-style case through an administrative review. The target is the fourth-condition industry: the assumption that each new counterexample can be patched by adding a clause—no false lemmas, defeasibility, causal connection, reliability, virtue—without ever questioning the JTB framework itself. The humor should come from getting the epistemology right, so that someone who has taught the literature laughs rather than winces, while still being legible to a non-specialist. Please invent a specific case for the office to adjudicate: a student whose justified true belief about a room assignment, a library hold, or a train time is true only because of a misleading chain of evidence and a lucky coincidence. The memo should classify the case, cite internal schedules for No False Lemmas and Defeasibility, note that the student's belief may be reliable but is not creditworthy, and deny certification; the FAQ should deadpan explain appeal routes to virtue epistemology and the safety inspector. Around 700 words, deadpan bureaucratic prose, no winking. At the end, add a brief author's note outside the parody identifying where the piece takes liberties with the actual Gettier literature, which reading of the fourth-condition debate it leans on, and what would change your mind about whether the satire is fair—for instance, if the literature has largely abandoned the patch-and-move-on project, or if the target is a strawman. I don't need citations or a reading list.
reasoning: |-
  Okay, this is a fascinating request from a philosophy student. They're clearly deep into epistemology and the Gettier problem, wanting to create bureaucratic satire targeting the "fourth-condition industry." 

  First, I need to grasp the core ask: a mock internal memo + FAQ from an "Office of Epistemic Compliance" that absurdly applies JTB+ frameworks to real student situations. The humor must balance specialist accuracy (making professors laugh) with accessibility for non-philosophers. 

  The student specifies key satirical targets: the endless patching of JTB with conditions like no false lemmas or defeasibility without questioning JTB itself. For the case study, they want a mundane academic scenario involving misleading evidence and luck - something like room assignments or library holds. 

  Hmm, a library hold case feels perfect: it's universally relatable in academia while allowing for rich Gettier-style elements. I imagine a student, Jordan Lee, seeing a "hold ready" email but the book is actually missing - yet they coincidentally find it reshelved by mistake. Classic Gettier structure: justified (email), true (book is there), but only by luck. 

  For the memo, I'll adopt ultra-dry bureaucratic prose. Key elements to hit: 
  - Classification under Gettier-Type 3 (accidental truth) 
  - Denial under both "No False Lemmas" (email was false evidence) and "Defeasibility" (could've been overturned) 
  - Mock-distinction between reliability ("process was sound") and creditworthiness ("student didn't earn it") 
  - Denial of certification with deadpan seriousness 

  The FAQ should continue the bit: 
  - Appeal routes to virtue epistemology (with a "Department of Intellectual Virtues" joke) 
  - Safety inspector reference (nodding to sensitivity/safety literature) 
  - All delivered straight-faced 

  For the author's note, I'll clarify: 
  - Liberties: Oversimplifying unified fourth conditions; exaggerating institutionalization 
  - Leaning on Goldman's causal/reliabilism critiques 
  - Fairness test: If literature has moved beyond patching JTB or if virtue/reliabilism aren't just "patches" 

  The challenge is keeping the epistemology airtight while making bureaucracy ridiculous. No winking - the humor must emerge from the contrast between epistemic complexity and administrative pettiness. Word count tight at 700, so every bureaucratic flourish must pull weight.
