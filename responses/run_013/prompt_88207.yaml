prompt: |-
  Ok, I've been mainlining Hacking again (looping effects, interactive vs indifferent kinds, all of that) and I want a short story out of it instead of yet another blog post reheating the same three examples. Every version of this I've seen does the same thing: new diagnosis appears, patients start performing it, everyone nods sagely about social construction, roll credits. I want the version where the loop is actually load-bearing.

  So: make up a condition. Not a real one, not a thinly veiled real one, and it goes in a fictional manual that you also invent. Give it this shape — the central diagnostic criterion is that the patient has to endorse a particular first-person sentence about their own mental state, some specific flavour of exhaustion or numbness or detachment that you can basically only report once you've got the word for it. Everything else about it is up to you.

  Then I want to see the loop turn, at least twice, in different directions, over maybe fifteen or twenty years of in-story time. The people the label picks out in the first cohort shouldn't be the same kind of people it picks out by the third, and the manual's criteria should get rewritten in response, which changes who walks in the door next. Bonus points if one of the turns makes the category partly empty out instead of filling up — I think thats underrated as a dynamic, everyone always writes the self-reinforcing direction.

  Two things I actually care about: (1) someone gets told they no longer meet criteria, and it lands as a loss rather than a relief, or as both at once; (2) there's a clinician or researcher who thinks the category is tracking something real and isn't just an artefact of the label, and they should get a real argument, not a strawman. Don't resolve it either way. And noone in the story gets to explain any of this out loud — no lectures, no epiphany about social construction, nobody saying the word "loop". The reader should be able to piece it together from the scenes alone.

  Format: start in scene, no title, no epigraph, no philosophical narration, no "in a world where" setup. Hard cap 800 words. One sentence at the very end saying which bit of Hacking you were stressing is fine, but optional.
reasoning: |-
  Okay, the user wants a short story based on Ian Hacking's concept of looping effects in psychiatric diagnoses. They're tired of the usual takes and want something fresh. 

  Hmm, they specified several key elements: a fictional diagnosis centered on a first-person statement, the category evolving over time, and the loop turning in unexpected directions. The challenge is showing this through scenes without explicit explanation.

  First, I need to invent a condition. "Kinetic Exhaustion" feels right - something about the soul feeling physically drained. The diagnostic hook will be patients endorsing "my soul feels bruised." That phrase has the right mix of poetic vagueness and specificity they requested.

  For the looping effect, I'm imagining three phases: 
  1) Early adoption by overworked creatives (the original cohort) 
  2) Mainstream dilution as the diagnosis spreads 
  3) Backlash where the category empties out 

  The user specifically wants someone to lose their diagnosis painfully. Dr. Amara Patel will experience this when her revised manual removes the "bruised soul" criterion - showing how the label's meaning can detach from its origins. 

  Clinician perspective is crucial too. Dr. Chen will argue for the reality of the phenomenon even as the diagnostic criteria shift. His frustration when the manual changes will demonstrate that tension without preaching.

  Key scenes:
  - 2013: First patient (Lena) articulates the "bruised soul" feeling
  - 2018: Teenager uses it as slang, showing dilution
  - 2023: Patel's own diagnosis gets invalidated
  - 2028: Chen protests the sterile new criteria

  Word count is tight at 800 max. I'll use clinical notes for exposition and jump cuts between years. The final line about "the instability of kinds" nods to Hacking without breaking scene.

  Biggest risk is making the looping too obvious. Must trust readers to connect the dots between Lena's authentic pain and the teen's casual usage. The "bruised soul" phrase evolving from revelation to cliché will show the category drift organically.

  User clearly knows this material well - their request is very specific. Hope the kinetic exhaustion concept meets their need for something genuinely new while hitting all their required beats.
answer: |-
  The waiting room smelled of stale coffee and disinfectant. Lena, fingers stained with charcoal, traced the fraying edge of the chair. "It's like... everything scrapes," she whispered to Dr. Chen. "Not my skin. Deeper. Like my soul is bruised. Just walking downstairs feels like I've been shoved." Chen jotted: *Endorses "soul feels bruised," pervasive kinetic exhaustion disproportionate to activity. Recommend assessment per DMS-VII draft, category Z73.8: Kinetic Exhaustion Syndrome (KES).*

  ***

  Five years later, Chen scanned the overflowing KES clinic roster. Teenagers slumped in chairs, earbuds in. One scrolled his phone. "So, Kyle," Chen began, reading the intake form. "You feel... kinetic exhaustion?"
  "Yeah, totally. Soul bruise city. Can't even." Kyle yawned.
  Chen probed gently. Kyle described school stress, late gaming sessions, general apathy. The core descriptor felt recited, hollow. "And this 'bruised soul' feeling?"
  "Uh, yeah. Like, metaphorically? Just super drained, doc." The specificity Lena had choked on was now slang. The DMS-VII had been published, KES criteria solidified around endorsing that exact phrase plus fatigue and motivational deficit. Kyle ticked every box.

  ***

  Dr. Amara Patel, reviewing her own file in 2023, traced the KES diagnosis she'd received eight years prior, after burning out in residency. She’d found solace in the label, the community. Now, the *Revised DMS-VII Manual* lay open. The working group, citing "diagnostic drift" and "overly subjective core criterion," had removed "my soul feels bruised." KES was now "Persistent Effort Intolerance Disorder (PEID)," emphasizing measurable fatigue thresholds and task avoidance. Patel read the new criteria. Her deep, resonant ache – the *bruise* – wasn't listed. Technically, she no longer qualified. A strange grief settled over the relief. She was cured by committee, her defining pain rendered obsolete.

  ***

  2028. Chen, greyer, argued across a polished conference table. "We're losing them! The original cohort, people like Lena, Patel... their experience was *qualitatively* different. This fatigue metric captures everyone who's just... chronically underslept or overwhelmed! The *bruise* was real!"
  Dr. Vance, chairing the DMS-VIII task force, tapped the new draft. "Real or not, Robert, it wasn't reliable. PEID is measurable. Look at the data – treatment adherence for PEID is up 30% using CBT-E protocols targeting avoidance. The old descriptor became a cultural catch-all, meaningless. We need rigor."
  Chen looked at the proposed criteria: heart rate variability thresholds, standardized effort tasks. The soul, bruised or otherwise, wasn't mentioned. "But what about *them*?" he insisted, meaning the ones whose suffering birthed the term. Vance sighed. "They deserve care tailored to what we can actually define and treat *now*. Not ghosts of a phrase."

  The new manual launched. Fewer teenagers checked the PEID box; the slang had moved on. Instead, middle-aged professionals citing "persistent effort intolerance" filled waiting rooms, steered towards productivity apps and graded exercise. Lena’s charcoal sketch of a heavy, invisible weight sat framed in Chen’s office. He no longer knew what, precisely, it depicted. *(Stressing the interactive instability of human kinds.)*
