  ### Key Design Notes:
  1. **Why 2x2 Tic-Tac-Toe variants?**  
     - **Symmetry**: Rotations/reflections preserve the board; no positional bias.  
     - **Draw-free**: Small size forces decisive outcomes (win/loss/draw), avoiding stalemates.  
     - **Speed**: Games last ≤4 moves, enabling multiple trials in 15 minutes.  
     - **Contrast**: Round 1 (extra move helps) vs. Round 2 (extra move can hurt) is stark and immediate.

  2. **Eerie Gap & Zugzwang**:  
     - In Round 1, students will see Player 1 win but can’t articulate a *general* strategy (e.g., "I just took a corner and won"). Highlight that the proof guarantees victory without guidance.  
     - Round 2 makes zugzwang visceral: Player 1 is **forced** to create a losing threat, shattering the "extra move never hurts" assumption.

  3. **Round 3 (Passing) Nuance**:  
     - Passing lets Player 1 "steal" the second-player role, proving they aren’t worse off than a draw. This mirrors how strategy-stealing recovers when passing is allowed (e.g., in some combinatorial games).

  4. **Debrief Focus**:  
     - Explicitly map gameplay moments to the proof’s steps:  
       - Round 1: Contradiction under "extra move helps."  
       - Round 2: Assumption failure → argument evaporates.  
       - Round 3: Passing restores "not worse than draw."  

  5. **Time Management**:  
     - Skip Round 3 if short on time; Rounds 1–2 suffice for the core lesson.  
     - For large groups, run a demo game post-activity to reinforce optimal play.

  This design ensures students *feel* the argument’s fragility and leaves them pondering the gap between existence and construction of winning strategies.
