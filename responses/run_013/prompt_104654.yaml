prompt: |-
  Ok, I need help thinking through something about promises, because the more I look at how promises actually get treated, the less I understand what anyone thinks a promise is.

  Here's whats bugging me. In ordinary life a promise seems to bind because you gave your word. You can't just pay someone off to get out of it -- offering your friend cash to let you skip their wedding doesnt make skipping ok. If they tell you it's fine, you're released. And the wrong, when you break it, seems to be the breaking, not whatever they lost.

  Contract law looks like it's playing a different game. It won't enforce a bare promise -- promise to hand someone $500 and you can just not, unless they relied on it or it was under seal. When it does enforce, it doesn't make you perform, it makes you pay damages putting the other side where they'd have been if you'd performed, which means a company can run the numbers, decide breaching is cheaper, breach, write a cheque, and that's legal. And the law will enforce a liquidated damages clause fixing a number in advance but not a penalty clause that punishes breach beyond the loss, so the promise can be priced, but only up to what the promisee was out. Actually making someone do the thing -- specific performance -- is the rare exception, for land and one-of-a-kind stuff.

  Then there's crypto smart contracts, where the code just executes, so nobody can breach, and also nobody can be let off if the world changes, unless someone wrote that in.

  So: what does the contract-law package actually presuppose about why promises bind? I want the implicit theory reconstructed, not the one lawyers would recite. Does it presuppose that the bindingness tracks what the promisee stands to lose or relied on? That a promise transfers an entitlement the promisee now owns, so expectation damages are really just protecting property? Or only that promising is a convention we invented for mutual assurance, and the law enforces whatever bit of the convention is socially useful? Which of those does it strictly need, which does it merely sit ok with, and where is it underdetermined -- could two or three of those views license the exact same set of rules?

  Second, is the package internally consistent? Breach-and-pay treats the promise as a price rather than a fence, but refusing penalty clauses treats the promisee's loss as the measure of the whole obligation, which smells more like reliance. Meanwhile ordinary morality, where you can be released and where breaking is wrong in itself, seems to presuppose something else again: that you handed someone authority over a bit of your future. Is that view actually incompatible with the contract rules, or is contract just a special-purpose practice sitting on top of it?

  Third, if we swapped the presupposed view for the self-binding one -- the wrong is that you broke your own word and let down someone who was counting on it, losses irrelevant -- what would the law have to look like? Gratuitous promises enforceable, penalty clauses valid, performance as the default remedy? Would smart contracts then look like a horror show, or like the purest version of that view?

  Also, someone told me Hume thought promise-keeping is an artificial virtue, invented rather than natural -- I might be mangling it. If thats roughly right, is the legal picture basically Humean, and if so can the everyday picture survive? Or does the Humean have to say that a promise to a dying friend who never finds out is nothing at all? I can't tell wether that's a reductio or just the bill coming due.

  No reading lists or citations please, I don't want names and dates, I want the argument. Assume I know what utilitarianism and Kant are in the vaguest way and nothing else.
reasoning: |-
  Okay, the user is really diving deep into the philosophical underpinnings of promises across different contexts—everyday life, contract law, and crypto smart contracts. They're clearly frustrated by the apparent contradictions and want to understand the implicit theories behind why promises bind in legal systems versus moral contexts. 

  First, I need to unpack their core question: what does contract law *actually* presuppose about the binding nature of promises? They're not looking for textbook answers but the hidden logic beneath the rules. The user mentions theories like reliance, entitlement transfer, or social convention. I should clarify that contract law isn't built on one coherent theory but a messy compromise between several goals—efficiency, fairness, predictability. The expectation damages model, for example, is less about morality and more about enabling commerce by letting parties "price" breaches. 

  Their second point about internal consistency is sharp. Contract law *does* feel schizophrenic: breach is fine if you pay, but penalty clauses are void because losses matter... except when they don't (specific performance for unique goods). I should highlight that this isn't inconsistency but context-dependent pragmatism. The law protects reliance when it needs to (e.g., gratuitous promises with detrimental reliance) but defaults to economic efficiency in commercial settings. 

  The third question is a fun thought experiment: what if law mirrored everyday morality? Enforcing all promises, allowing penalties, demanding performance. That'd be chaotic—courts flooded with suits over broken dinner plans, businesses paralyzed by inflexibility. Smart contracts would indeed be the "pure" version of this, which explains why they feel dystopian: no mercy for changed circumstances. 

  Hume's mention is key. The user suspects contract law is "Humean"—promises as social tools, not sacred vows. They’re right. Law doesn’t care about the intrinsic wrong of breaking a promise to a dying friend; it cares about measurable harm to social cooperation. That *is* jarring against everyday morality, but the law can’t adjudicate internal guilt—only external damages. 

  The user’s frustration is palpable. They’re wrestling with why the legal system feels amoral. I should validate that: yes, contract law sacrifices moral purity for function. It’s not about keeping your word; it’s about keeping the market moving. The "entitlement transfer" theory (promise as property) is elegant but incomplete—law often prioritizes efficiency over absolute ownership. 

  Their closing query about Hume reveals deeper unease: if promises are just useful fictions, does that demolish everyday morality? Not necessarily. Legal systems can be pragmatic while individuals uphold ideals. The friend’s deathbed promise matters morally because ethics isn’t reducible to social utility. Law’s silence there isn’t a denial—it’s just beyond its scope. 

  This user is philosophically sophisticated, skipping jargon to drill into first principles. They’d likely reject platitudes. I’ll aim for clarity on why law’s compromises exist, without dismissing their sense that something’s lost in the process.
answer: |-
  Here's a breakdown of the implicit theory behind contract law's treatment of promises, its internal logic (or lack thereof), and the consequences of swapping its foundation:

  **The Implicit Presupposition of Contract Law: Social Utility & Reliance Management**

  Contract law isn't founded on a single, pure moral philosophy about the inherent "bindingness" of a promise. Its core presupposition is **pragmatic social utility**: promises (especially bargained-for ones) are essential tools for facilitating cooperative activity, planning, and economic exchange in a complex society. The law's job is to make this system *work reliably*, not to perfectly mirror everyday morality. This leads to a focus on **managing reliance and expectation efficiently**.

  *   **Why it rejects the "bare moral obligation" view:** Enforcing every promise, especially gratuitous ones, would overwhelm courts, create uncertainty, and stifle social interaction. How would you prove a casual promise? What constitutes "release" in court? Law needs clear, objective standards.
  *   **Why it rejects "self-binding as transfer of authority":** This view is too absolute and inflexible for commerce. Businesses *need* the ability to sometimes breach efficiently (e.g., if a supplier finds a cheaper source, paying expectation damages might be better for everyone than forcing expensive, suboptimal performance). Law prioritizes the *systemic outcome* of efficient resource allocation.
  *   **Why it focuses on reliance/expectation:** The core *harm* the law seeks to prevent is **detrimental reliance**. If someone reasonably relies on your promise to their detriment, society suffers a net loss. Enforcing bargained-for promises *before* reliance occurs (via expectation damages) creates **security of expectations**, encouraging investment and cooperation.
  *   **The Entitlement View (as Property):** This is a *description* of the *effect*, not the *cause*. The law *creates* the "entitlement" precisely *because* protecting that expectation is socially useful. The entitlement isn't a pre-existing moral truth the law discovers; it's a legal tool crafted for a purpose.
  *   **The Convention View:** This is closest. Promising *is* a socially invented convention. Law enforces the *subset* of that convention deemed necessary for the smooth functioning of society (especially commerce), focusing on the *consequences* (reliance, expectation) rather than the intrinsic wrong of breaking one's word.

  **Underdetermination:** All three views – reliance protection, expectation-as-entitlement, and social-convention-for-utility – can *describe* the rules to some extent. The *strictly necessary* core is **social utility via managing reliance/expectation efficiently**. The reliance and entitlement views are compatible *descriptions* of how this utility is achieved, but the utility goal itself is the driving force.

  **Internal Consistency: Pragmatic Tension, Not Logical Contradiction**

  The rules form a *coherent pragmatic system*, not a perfectly consistent moral one:
  1.  **Breach-and-Pay (Efficiency):** Allows resources to flow to their most valued use. Paying expectation damages puts the promisee in the position they *expected* from the bargain, protecting the value of the agreement *as an economic tool*.
  2.  **No Penalty Clauses (Preventing Over-Deterrence & Exploitation):** If damages vastly exceed actual loss, it could:
      *   Deter *efficient* breaches (where breach + damages is cheaper for the promisor *and* the promisee is fully compensated).
      *   Become a tool for extortion ("Pay me $1M or I'll sue you for breaching our $10k contract!").
      *   Functionally turn contracts into punitive instruments, which conflicts with the core goal of compensation and efficient allocation.
  3.  **Specific Performance (The Exception for Inadequacy):** When money *can't* adequately compensate (unique goods like land, art, bespoke items), because the "expectation" isn't fungible, efficiency *demands* actual performance. The promisee's "loss" isn't just financial; it's the unique item itself.
  4.  **Gratuitous Promises & Reliance:** Enforcing *some* gratuitous promises *if* relied upon heavily shows the system's true anchor: preventing *harm* from reasonable reliance, not enforcing promises for their own sake. The "detrimental reliance" doctrine directly addresses the harm, not the promise itself.

  The "inconsistency" arises because the law balances **efficiency** (breach-and-pay) with **fairness/preventing abuse** (no penalties) and **adequacy of remedy** (specific performance). It prioritizes different aspects of the reliance/expectation protection goal in different contexts. It's internally consistent *as a practical system for managing cooperative risk in a market society*.

  **Swapping the Foundation: The "Self-Binding Moral Obligation" Law**

  A legal system based purely on the "wrong is breaking your word, losses irrelevant" view would look radically different:

  1.  **Gratuitous Promises Enforceable:** Your promise to give your nephew $500 for his birthday? Legally binding. Failure = breach, regardless of reliance. Chaos ensues.
  2.  **Penalty Clauses Valid & Enforced:** If you agreed to pay $1M for missing a deadline on a $10k contract, you pay $1M. The deterrent/punishment aspect is paramount. This would massively increase transaction costs and risk, chilling many agreements.
  3.  **Specific Performance as Default Remedy:** "You promised to do X, therefore you *must* do X." Courts become micromanagers of performance. Impossible? Too bad, try harder. This is inefficient, often impractical, and ignores that money *can* usually compensate for broken commercial promises.
  4.  **Release Requires Formal Consent:** Withdrawal might be nearly impossible unless the promisee explicitly agrees *in the legally prescribed form*. Casual forgiveness might not suffice.
  5.  **Motive Matters Less, Breach Matters More:** The *reason* for breach (impossibility, hardship) becomes less relevant than the fact of breach itself. Excuses are narrow.

  **Smart Contracts in this World:** They would be the **purest expression** of this view. The code *is* the promise, execution *is* performance. No mercy, no excuses, no judicial discretion. If you coded it, it happens. This would be seen as the ideal by proponents of this view – perfect fidelity to the word given. Critics would see it as a **horror show** of inflexibility, punishing parties for unforeseen circumstances with no recourse.

  **Hume & The "Artificial Virtue"**

  Your understanding of Hume is spot-on. He argued promise-keeping isn't a "natural" virtue like kindness (which we might feel instinctively), but an "artificial" one invented by society to solve a coordination problem: how to bind people to future actions to enable cooperation. Its moral force stems entirely from its social utility – it's a *convention* we collectively agree to uphold because it benefits everyone.

  *   **Is contract law Humean? Absolutely.** It embodies his view perfectly:
      *   It enforces promises only when necessary for social utility (bargained exchange, detrimental reliance).
      *   It focuses on the *consequences* (reliance, expectation) caused by breaking the convention, not an intrinsic wrong.
      *   Remedies are designed to *repair the social harm* (putting the injured party whole) and *maintain the system's reliability*, not to punish the moral failing of breaking one's word.
  *   **Can the everyday picture survive? Yes, but as a separate domain.** Hume (and contract law) explains the *social institution* of promising and its legal enforcement. Everyday morality operates on a different level:
      *   **Personal Relationships:** Promises create bonds of trust and expectations that define relationships. Breaking them damages the relationship itself, regardless of measurable loss or legal enforceability. Forgiveness is personal.
      *   **Integrity:** Keeping promises, even unenforceable or undiscoverable ones, is seen as a matter of personal character and honor.
      *   **The Dying Friend:** For Hume, breaking *that* promise *is* "nothing at all" *in terms of social utility/harm* (no reliance, no systemic damage). But this isn't a *reductio* for Hume; it's the point. The moral wrong in the everyday view stems from personal integrity and the *relationship*, not the social convention. The "bill coming due" is recognizing that the deep personal obligation you feel isn't grounded in the *social artifice* of promising, but in other moral sentiments (fidelity, care, respect for the dying wish). The everyday view survives by drawing its force from sources *beyond* the Humean social convention.

  **Conclusion:** Contract law presupposes that promises bind *legally* only insofar as enforcing them (in specific ways) promotes socially beneficial reliance and efficient exchange. It's a pragmatic, utility-driven system that intentionally diverges from everyday morality's focus on the intrinsic wrong of breaking one's word and personal authority. Its apparent inconsistencies are resolutions of practical tensions within its core goal. Swapping its foundation for the "self-binding" view would create a rigid, punitive, and commercially dysfunctional system, where smart contracts would reign supreme as perfect, merciless enforcers. Hume provides the philosophical backbone for the legal view: promising is a useful social invention, not a natural moral truth. Everyday morality persists by drawing on deeper wells of personal relationship and integrity that the law, by necessity, ignores.
