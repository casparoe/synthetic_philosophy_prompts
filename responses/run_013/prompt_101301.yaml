prompt: |-
  I'm a third-year student taking a metaethics module and I've gotten weirdly fixated on the internal/external reasons distinction — the one usually credited to Bernard Williams — but not the standard version. The standard version I get: a reason for you has to hook onto something already in your subjective motivational set, otherwise it's only an external reason, which is really just advice or pressure in disguise. What's eating me is a distinction our seminar's guest speaker floated and then left without defending properly. She said we're conflating two completely different senses of internal: reasons that are internal to a person (the Williams kind) and reasons that are internal to a practice or a role — the norms you're bound by just in virtue of being a doctor, or a promiser, or a judge, even when nothing in your motivational set lines up. She called the second kind role-internal reasons and insisted they're not reducable to the first, because you can be bound by them while actively resenting them. My friend thinks that's nonsense and that every role-internal reason secretly smuggles in a desire (to be a good doctor, to keep your self-image intact, whatever), so it collapses back into the Williams picture. I half see her point, but I also think the doctor who's stopped caring still owes her patient something, and that owing doesn't feel like a desire at all.

  Could you compare these two notions of internality for me — agent-internal reasons in the Williams style versus role- or practice-internal reasons — and tell me which one you think is doing the real work, or whether the second really does collapse into the first? I'd especially like you to test the collapse on a hard case: a lawyer who's convinced her client is guilty, has no desire to help him, and yet seems bound by something (the duty of zealous representation, or whatever) that isn't just her wanting to keep her licence. And maybe say what the two views actually disagree about that would change how someone acts, rather than it being a verbal dispute over the word internal. Please write it as continuous prose — no headings, bullet points, bold, or tables, just the way you'd write an email.
reasoning: |-
  Okay, the user is a third-year philosophy student grappling with a nuanced metaethics problem about internal reasons. They've encountered a distinction between Williams' agent-internal reasons (based on subjective motivational sets) and role-internal reasons (binding due to social practices) that their guest lecturer proposed. Their core tension is whether role-internal reasons truly exist independently or just disguise hidden desires. 

  The student seems intellectually invested - they're not just seeking textbook answers but testing conceptual boundaries. Their lawyer example reveals practical stakes: can professional duties bind someone devoid of motivation? Their friend represents the reductionist view (all reasons reduce to desires), but the student intuitively resists this, sensing genuine normativity in roles. 

  I should acknowledge their sophisticated framing. They're not confusing Williams' original theory; they're probing its limits. Their frustration with the lecturer's unresolved argument suggests they want rigorous analysis, not just summaries. The "what changes behavior" request shows they care about real-world implications - this isn't academic hair-splitting.

  The lawyer case is perfect for pressure-testing. A defense attorney who loathes her client and lacks professional pride challenges desire-based accounts. If zealous representation still binds her, role-internal reasons gain plausibility. But I mustn't ignore counterarguments: could "duty" just mask fear of sanctions or habit? The student's patient-doctor example already hints at this tension.

  Their deeper need might be understanding moral objectivity's source. If reasons exist outside psychology (in practices), that supports anti-reductionism. But if everything collapses to desires, morality becomes contingent. That's why the collapse question matters - it shapes whether ethics is discovered or created.

  I'll structure the response by:
  - Clarifying both internality types without jargon
  - Testing reductionism via the lawyer case
  - Highlighting what's at stake practically (e.g., whether resentment voids obligations)
  - Concluding why preserving the distinction might matter beyond semantics

  The tone should mirror their earnestness - no bullet points but fluid prose that respects their engagement. Since they referenced email style, I'll avoid academic stiffness while maintaining precision.
answer: |-
  Right, that's a fascinating and genuinely tricky distinction your guest speaker raised, and your friend's skepticism is completely understandable – it's a natural reaction from within the Williams framework. You've hit on a crucial tension in metaethics and philosophy of action. Let me try to unpack this comparison and test the "collapse" argument with your lawyer case.

  The core difference lies in the *source* and *nature* of the "internality."

  1.  **Williams' Agent-Internal Reasons:** The internality here is *psychological* and *constitutive of agency*. A reason is internal *to you* only if it connects, via a sound deliberative route, to something already within your actual "subjective motivational set" (S-mot set). This set includes desires, dispositions, commitments, projects – the psychological stuff that makes you *you* as an agent. An "external" reason statement, for Williams, is either false or, at best, a disguised hypothetical imperative ("*If* you want to achieve X, *then* you have a reason to do Y"). Crucially, for it to become a *real reason for you*, the "if" clause must hook into your actual S-mot set. The binding force comes entirely from within the agent's existing motivations. If nothing in your S-mot set resonates with the "reason," it simply isn't a reason *for you*, however much others might wish it were or call it one.

  2.  **Practice/Role-Internal Reasons:** The internality here is *normative* and *institutional*. The reason is internal not to the individual's psychology, but to the *role, practice, or institution* itself. The binding force comes from the *rules, norms, and commitments constitutive of that particular social practice*. Being a doctor, a promiser, a judge, or a lawyer isn't just a label; it involves entering a structured normative space with its own internal logic. The duties (reasons) arise from occupying that space, regardless of whether the individual currently *feels* motivated by them. The "ought" is generated by the role: "Given that you *are* a doctor, you *ought* to prioritize patient welfare." The internality is to the *practice*, not necessarily to the practitioner's heart.

  Now, the big question: **Do role-internal reasons collapse into Williams' agent-internal reasons?**

  Your friend argues yes – there's always a hidden desire: the desire to be a good doctor/lawyer, to avoid guilt, to maintain self-image, to keep a license, or even just a general desire to fulfill one's perceived obligations. On this view, the lawyer only has a reason for zealous representation *if* she has *some* desire (however weak or conflicted) connected to being a lawyer, upholding the system, avoiding sanctions, etc. Without that latent desire in her S-mot set, the "duty" is merely an external demand, not a genuine reason *for her*.

  **Testing the Collapse: The Resentful Lawyer**

  This is where your hard case is perfect. Imagine the lawyer:

  *   **Knows her client is factually guilty** (of something morally repugnant).
  *   **Actively resents the client** and feels no personal desire to help him escape consequences.
  *   **Feels no professional pride** in this case; the "ideal of zealous advocacy" feels hollow.
  *   **Has no fear of sanctions** – she's considering quitting law anyway, and the bar complaint process seems distant and unlikely.
  *   **Experiences the duty as an unwelcome, externally imposed burden**, not as something she *wants* to do.

  According to Williams (and your friend), for the duty of zealous representation to be a *reason for her* to act, it *must* connect to *something* in her S-mot set. But we've systematically removed the usual suspects: desire for professional success, pride, fear, general desire to be ethical. What's left?

  The role-internalist (like your guest speaker) insists: **The reason persists.** Why? Because she *is* a lawyer. By taking on that role within the legal system, she incurred normative commitments *defined by the practice itself*. The reason arises from the institutional logic of adversarial justice, which holds that even the guilty deserve a defense to ensure systemic fairness, prevent prosecutorial overreach, and uphold the rule of law. Her *personal* motivational state is irrelevant to the existence of the *role-based* reason. She *owes* the duty to the client *by virtue of the relationship constituted by the lawyer-client role*, and to the court *by virtue of her officer-of-the-court status*. The "owing" you feel for the uncaring doctor is the same intuition – it stems from the doctor-patient relationship, not the doctor's fleeting desires.

  **Does this collapse?** The reductionist (Williams/friend) has two moves:

  1.  **Find a Hidden Desire:** Argue there *must* be *some* residual motivational hook, however faint or conflicted. Maybe a deeply buried commitment to the *idea* of law, or a fear of self-betrayal, or a habitual disposition. The role-internalist counters that this is ad hoc and ignores the phenomenology – the lawyer might genuinely feel *zero* positive motivation, only the stark recognition of an obligation she wishes didn't exist. Insisting there *must* be a desire risks making Williams' theory unfalsifiable.
  2.  **Deny the "Reason" is Real for Her:** Conclude that since there's no motivational link, the "duty" isn't a reason *for her* at this moment. It's just societal pressure or an institutional rule she happens to be subject to. To call it a "reason" is mistaken. The role-internalist argues this drastically underdescribes the normative force. It's not just pressure; it's a genuine *wrong* she would commit against her client and the court by failing her duty, even if no one punishes her and she feels no guilt. The wrongness arises from violating the role's constitutive norms.

  **What's Really at Stake? What Changes?**

  This isn't just verbal. The disagreement has practical consequences:

  1.  **Scope of Obligation:** For the role-internalist, obligations are broader and more robust. You are bound by the duties of your role *even when you hate it*. For the reductionist, obligations shrink to the boundaries of your current motivations. If the lawyer truly extinguished all relevant desires, she *has no reason* to defend zealously (though she might have prudential reasons if sanctions loom).
  2.  **Critique of Roles:** The reductionist view makes it easier to critique or reject role obligations. If the lawyer finds the duty morally repugnant (defending a guilty client), and it doesn't connect to her core values (her S-mot set), she arguably has *no reason* to do it and might even have reason *not* to. The role-internalist view makes escaping role obligations harder – the duty exists *because* of the role, requiring a more active repudiation of the role itself (quitting the bar) to shed the duty.
  3.  **Phenomenology of Duty:** The reductionist struggles to explain the experience of feeling *bound* by a duty you resent and feel no motivation to fulfill, except as a psychological mistake or external pressure. The role-internalist takes this experience at face value: you recognize a normative demand generated externally *by the practice you participate in*.
  4.  **Grounding Normativity:** Ultimately, the reductionist grounds normativity entirely in individual psychology. The role-internalist posits a source of normativity in social practices and institutions themselves. This is the fundamental divide.

  **Which is Doing the Real Work?**

  It depends on the question.

  *   **Explaining Motivation/Explanation of Action:** Williams' model is powerful. We explain why the lawyer *actually* files the motion either by finding *some* motivational hook (e.g., habit, fear, residual professionalism) or by concluding she had no reason and acted under duress/inertia. Her *action* requires a motivational explanation.
  *   **Describing Normative Landscape/Obligation:** The role-internal model seems essential. It captures the strong intuition that the lawyer *should* file the motion, that she *owes* it to the client and the system, *regardless* of her internal state. It explains the distinct wrongness of failing a role duty even without personal ill-will. This "ought" isn't fully captured by hypothetical imperatives or contingent desires.

  Your intuition about the uncaring doctor or the resentful lawyer feeling a genuine "owing" points to the real force of role-internal reasons. While Williams brilliantly showed how reasons must connect to agency to explain action, practices and roles create a distinct layer of normativity that isn't reducible to the psychological states of individuals at every moment. The lawyer *is* bound by the duty, even as she loathes it. Collapsing it into a hidden desire risks misdescribing the source of that bindingness – which lies not (only) in her psyche, but in the institutional fabric she inhabits. The disagreement is deep, reflecting a fundamental split about where obligations come from: inside the agent, or also within the structures of the social world they engage with.
