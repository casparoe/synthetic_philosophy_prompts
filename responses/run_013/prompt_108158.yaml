  Hmm, the student's frustration with the "it's just semantics" attitude comes through clearly. They've identified a concrete gap - nobody seems to have properly explored how these theories affect the justification of decisions in borderline cases like tax rulings or criminal recklessness assessments. That's promising because it grounds abstract philosophy in tangible legal dilemmas. 

  The proposed angle about what officials are "doing" when resolving borderline cases seems fresh. The epistemicist "guessing at unknowable facts" versus supervaluationist "creating determinate content" distinction could really expose practical differences. I should emphasize how this moves beyond theoretical debates to actual legal practice.

  For structure, the proposal needs to nail three things: first, clearly showing why existing dismissals of the debate are premature; second, outlining a manageable 3-month methodology; third, preempting failure scenarios honestly. The student wisely wants to avoid overpromising - if all differences collapse under scrutiny, that's still a valid outcome.

  Month-by-month planning should be ruthlessly realistic. Month 1 could focus on analyzing representative borderline cases without theoretical baggage. Month 2 would build the comparative framework. Month 3 would synthesize findings and confront objections. Output would be a draft paper section plus conference abstract.

  Crucially, the failure conditions section mustn't be an afterthought. We should specify that if differences vanish under higher-order principles (like legality requirements), that's a substantive conclusion. The student's integrity here is impressive - they want truth, not forced originality.

  The tone should match PhD-level work: precise but not jargon-heavy, acknowledging the idea's half-formed state while showing how the project would refine it. Legal examples will anchor the philosophy, keeping it from floating into pure abstraction. And absolutely no citations - they'll handle those.

  This could be exciting! The student has identified a genuine crack in conventional wisdom. By shifting focus to decision-making practices, they might reveal that "just semantics" has real-world teeth.
answer: |-
  Here’s a focused, 3-page research proposal structured around your core insight, with realistic scope and clear deliverables:

  ---

  **Research Proposal: Deciding the Vague: Epistemicism, Supervaluationism, and the Justification of Legal Decision-Making**  

  **1. Research Question**  
  Do epistemicism and supervaluationism about vagueness prescribe meaningfully distinct *practices* for legal officials resolving borderline cases (e.g., determining "recklessness" or "substantial change"), such that the choice between theories impacts normative evaluations of decisions?  

  **2. Background & Gap**  
  The prevailing view in my department holds that epistemicism (E) and supervaluationism (S) are notational variants: both accommodate classical logic and bivalence, differing only in whether borderline propositions have unknowable truths (E) or truth-value gaps (S). This assumes the dispute lacks practical consequences. I contest this by shifting focus from *semantic analysis* to *decision-making justification* in legally borderline cases.  

  E claims a vague predicate (e.g., "reckless") has sharp but unknowable boundaries. S claims it admits multiple precisifications, with a statement true only if true on all admissible precisifications. The "just semantics" view holds that for any legal outcome prescribed under E, an analogous outcome exists under S (and vice versa). I argue this equivalence breaks when we ask: *What normative constraints govern an official’s resolution of a borderline case, and how is their action justified?*  

  **3. Core Hypothesis**  
  E and S generate divergent accounts of official action in borderline cases, leading to distinct:  
  - **Descriptions of the official’s task**: E frames it as *epistemic guessing* (seeking an unknowable fact); S frames it as *precisification* (selecting/adopting a contextually admissible boundary).  
  - **Standards for evaluating decisions**: Under E, correctness depends on correspondence to the inaccessible fact; under S, it depends on consistency with precedent, coherence with purpose, or procedural fairness.  
  - **Normative risks**: E risks punishing based on inherently unknowable facts (raising justice concerns); S risks arbitrariness if precisification lacks robust constraints.  

  **4. Methodology & Plan (3 Months)**  
  *Month 1: Case Analysis & Problem Specification*  
  - Identify 3-4 paradigmatic legal borderline cases (e.g., "recklessness" in criminal law, "substantial change" in tax/regulatory law, "relevant experience" in hiring).  
  - Analyze how real adjudicators (judges, regulators) describe their task in such cases (using judicial opinions, administrative rulings).  
  - *Output:* A refined typology of borderline decision contexts and official justifications.  

  *Month 2: Theory/Decision-Making Interface*  
  - Construct precise decision models under E and S for each case type:  
    - *E-Model:* Official must estimate likelihood of alignment with the unknowable sharp boundary. Justification hinges on epistemic diligence.  
    - *S-Model:* Official must select a precisification consistent with legal sources (statute, precedent, purpose). Justification hinges on reasoned constraint.  
  - Map how each model handles key decision-theoretic elements: uncertainty, standards of review, error types ("false conviction" vs. "unjustified precisification").  
  - *Output:* Two distinct normative frameworks for evaluating borderline-case resolutions.  

  *Month 3: Divergence Assessment & Implications*  
  - Identify concrete points of practical divergence:  
    - When would an E-based evaluation condemn an S-justified decision (or vice versa)?  
    - Does E *require* deference to unknowable facts, even if procedurally flawed? Does S *permit* more contextual flexibility?  
  - Test robustness: Do differences collapse under higher-order principles (e.g., rule of law, fairness)?  
  - *Output:* A draft paper section arguing for/against practical equivalence; an outline of implications for legal theory and design.  

  **5. Expected Outcomes & Significance**  
  - **Primary Result:** A demonstration that E and S entail distinct justificatory burdens for decision-makers in borderline cases. E prioritizes *epistemic access* (even if impossible); S prioritizes *reasoned constraint*.  
  - **Significance:**  
    - Challenges the "mere semantics" dismissal by showing the theories prescribe different *actions* for officials.  
    - Clarifies normative stakes in debates over vague legal language (e.g., when is an official’s discretion legitimate?).  
    - Offers a decision-centric lens for evaluating theories of vagueness.  
  - **Deliverable:** A 6,000-word paper draft suitable for submission to journals (e.g., *Legal Theory*, *Philosophy & Public Affairs*).  

  **6. Risk Management & Failure Conditions**  
  - **Key Risk 1: Genuine Equivalence:** All identified divergences may derive solely from general legal principles (e.g., "resolve ambiguity against the state"), not E/S specifically.  
    - *Mitigation:* Scrutinize whether E/S *generate unique justifications* for such principles. If divergence vanishes, this is a substantive result: **Project succeeds by falsifying the hypothesis.**  
  - **Key Risk 2: Overlap in Practice:** Real officials’ reasoning may blend elements of both models, obscuring distinctions.  
    - *Mitigation:* Focus on normative evaluation (what *should* officials do?) rather than descriptive accuracy. Isolate clear cases where theories conflict.  
  - **Failure Condition:** If no *principled, theory-driven* divergence in justification is found after rigorous modeling, the project concludes that **the departmental view holds for decision-making contexts**. This is a philosophically valuable negative result.  

  **7. Feasibility**  
  Requires only conceptual analysis, close reading of legal texts/rulings, and normative modeling. No empirical data, experiments, or travel. Library/desk-based. 3 months is sufficient to:  
  - Refine the conceptual framework;  
  - Analyze key cases;  
  - Develop and contrast decision models;  
  - Draft a focused argument.  

  ---

  **Why this works:**  
  - **Scope:** Targets a specific, underexplored interface (theory → decision practice).  
  - **Novelty:** Moves beyond semantics to normative implications for action.  
  - **Honesty:** Embraces falsification; defines failure as a clear result.  
  - **Output:** Concrete draft paper + conference abstract.  

  **Next steps for you:**  
  1. Insert 2-3 key citations (e.g., Williamson on E; Keefe on S; Endicott on vagueness in law).  
  2. Flesh out legal examples (e.g., *R v G* on recklessness; a key tax case).  
  3. Specify your department’s "just semantics" proponents (in text, not bibliography).  

  This sets you up to challenge orthodoxy with a tractable, high-reward project. Good luck!
