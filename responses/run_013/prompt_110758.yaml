prompt: |-
  ok so there's this old fight in evolutionary biology over Gould and Lewontin's spandrels paper and I've never been satisfied with how it gets summarized, so I want you to actually make an argument about what the critique accomplishes. here's the framing I want you to work with. you can slice "adaptationism" three ways: (1) a big empirical claim, that most traits are adaptations built by selection; (2) a methodological rule, that when you meet a trait you should first try to explain it as an adaptation and only fall back on drift, constraint, or byproduct when that fails; (3) a near-definitional claim that selection is the only real source of organic form, so "constraint" and "byproduct" are just placeholders for selection stories we haven't finished yet.

  now, the complaint in the spandrels paper is usually read as being about just-so stories and untestable adaptationist hypotheses. I want you to argue something narrower and a little annoying: that the critique, taken at face value, only really lands against (1); that it leaves (2) essentially untouched and maybe even supports it; and that (3) is a strawman almost nobody actually held. use the spandrel example itself as your ammunition — the spandrel is a byproduct, but then it gets used, decorated, given meaning, and it starts doing work, which seems to show the adaptation/byproduct line is unstable and that a byproduct can get recruited into a function later. so the methodological adaptationist just shrugs and says "right, thats why I look for adaptation first." then tell me where you think this deflationary reading goes too far — is there any version of the critique that genuinely does threaten (2), or does it all collapse into "be more careful with your statistics"?

  don't worry about citing anything, just give me the argument. oh and since "spandrel" and "exaptation" get thrown around pretty loosely, say upfront how your using them.
