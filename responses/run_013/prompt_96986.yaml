prompt: |-
  I'm preparing a seminar on interpretation, and I want to build the first half around a single stipulation that I will ask everyone to hold fixed rather than to argue for. The stipulation distinguishes three kinds of authorial intention: semantic intention (what the author meant the words and sentences to mean), categorial intention (what kind of thing the author meant the text to be — fiction or testimony, literal or ironic, finished or a fragment), and pragmatic intention (what the author hoped the text would accomplish — persuade, console, scandalize, record). On the stipulation, semantic and categorial intention are partly constitutive of a text's meaning, pragmatic intention is not, and categorial intention is defeasible: a text can be shown by its own features and its public context to belong to a category other than the one the author set out to write, in which case the achieved category governs.

  Please describe the most important implications of this stipulation for the following, taking them in turn. First, how a reader should adjudicate between two readings of a passage that agree about what the words mean but disagree about whether the passage is ironic. Second, how much weight to give an author's later claim about what a text was really about, when the text itself does not seem to be about that. Third, whether the familiar charge that appeals to authorial intention commit a fallacy survives the stipulation, and if so in what form. Fourth, the decisions an editor faces when an author's manuscripts and the published text diverge in category rather than in wording. Where the stipulation leaves an answer underdetermined, say so and identify what further commitment would settle it.
reasoning: |-
  Okay, the user is preparing a seminar on interpretation and wants to focus on a specific stipulation about authorial intention. They've outlined three types: semantic, categorial, and pragmatic intentions. The key points are that semantic and categorial intentions are partly constitutive of meaning, while pragmatic isn't. Categorial intention is defeasible, meaning the text's features or context can override the author's intended category. 

  The user asks for implications in four specific scenarios. Let me break down each one. 

  First, how readers should adjudicate between literal and ironic readings when word meanings are agreed upon. Since categorial intention is defeasible, the reader must look for textual and contextual evidence. The author's stated intent isn't final. Textual cues like hyperbole or incongruities matter, as does public context. If the text strongly suggests irony despite the author claiming otherwise, irony wins. The reader's role is to assess evidence, not just defer to the author.

  Second, the weight of an author's later claims about what the text was "really about." Pragmatic intentions (hopes, goals) don't shape meaning, so if the author's later statement is about purpose (e.g., "I wrote it to protest X"), it doesn't change the text's meaning. But if it's about categorial intent (e.g., "it was satire"), it's relevant but defeasible. The text itself must be examined. If the text doesn't support the claimed category, it's overruled. The answer hinges on whether the statement is categorial or pragmatic.

  Third, whether the intentional fallacy charge survives. The stipulation modifies but doesn't eliminate it. Pragmatic intention is clearly excluded from meaning, so appealing to it is fallacious. Semantic and categorial intentions are constitutive, so they're necessary but not sufficient. However, since categorial intention is defeasible, the text's features can override it. The fallacy still applies if critics prioritize pragmatic intent or treat categorial intent as absolute. The key is that meaning isn't solely author-driven—text and context matter.

  Fourth, editors dealing with manuscript vs. published text diverging in category. The editor must consider the author's categorial intention but also the defeasibility clause. If the published text's features clearly establish a category (e.g., irony), that governs. The author's manuscript category matters only if the published version is ambiguous. For pragmatic changes (e.g., toning down satire), the editor should preserve the published category unless it's unclear. The manuscript acts as evidence of intent but isn't decisive.

  Throughout, underdetermined areas need clarification: What evidence threshold overrides categorial intent? How to distinguish categorial from pragmatic in author statements? How much should editors prioritize public reception? The user might need to add finer criteria for these.
answer: |-
  Based on your stipulation, here's a breakdown of the implications for each scenario, highlighting where the stipulation provides clear guidance and where it leaves room for further debate:

  **Core Stipulation Recap:**
  1.  **Semantic Intention:** Partly constitutive of meaning (what words/sentences mean).
  2.  **Categorial Intention:** Partly constitutive of meaning *but defeasible* (what kind of text it is - irony, fiction, etc.). Achieved category (based on text + public context) governs if it overrides author's aim.
  3.  **Pragmatic Intention:** *Not* constitutive of meaning (what the author hoped to achieve - persuade, console, etc.).

  **Implications:**

  1.  **Adjudicating Literal vs. Ironic Readings (Agreed Semantic Meaning):**
      *   **Implication:** The disagreement is *entirely about categorial intention*. The stipulation dictates that the author's *stated* intention (e.g., "I meant it ironically") is relevant evidence but *not decisive*.
      *   **How to Adjudicate:**
          *   **Textual Evidence:** The reader *must* examine the text itself for features characteristic of irony: incongruity, hyperbole, understatement, tone markers, internal contradictions, genre conventions.
          *   **Public Context:** The reader *must* consider the public context of utterance/reception: Was the topic one routinely treated ironically? Was the author known for irony? Was the audience likely to perceive irony? Were there contemporary events making a literal reading absurd?
          *   **Defeasibility in Action:** If the textual features and public context *strongly and consistently* point towards irony, *even if the author denies intending it*, the ironic reading governs. Conversely, if textual features and context strongly support a literal reading, the author's *claim* of irony might be seen as revisionist or mistaken, and the literal reading governs.
      *   **Underdetermined:** The stipulation doesn't specify *how strong* the textual/contextual evidence needs to be to defeat the author's categorial intention. What's the threshold for "shown by its own features and its public context"? This requires an additional commitment about the weight of evidence or interpretive norms.

  2.  **Weight of Author's Later Claim About "What the Text Was Really About" (Contradicting Text):**
      *   **Implication:** This hinges *crucially* on whether the author's later claim concerns **categorial intention** or **pragmatic intention**.
      *   **Pragmatic Claim (e.g., "I hoped it would start a revolution," "I meant it to console the grieving"):** According to the stipulation, this is *irrelevant* to determining the text's meaning. The text's meaning (established by semantic/categorial intention and the text/context) stands independently of these hoped-for effects. The claim might be interesting biographically but doesn't change what the text *means*.
      *   **Categorial Claim (e.g., "It was actually satire," "I intended it as fiction, not testimony"):** This claim *is* relevant evidence regarding the author's original categorial intention. *However*, it is still subject to the defeasibility clause.
          *   If the text itself, read in its original public context, *can plausibly support* the claimed category (even if it also supports another), the author's later claim lends significant weight to that reading.
          *   If the text and its original public context *strongly resist* the claimed category (e.g., a deeply personal, sincere-seeming lament later claimed to be satire, with no textual irony markers and a receptive context taking it sincerely), the later claim is *defeated*. The achieved category governs. The later claim might reflect a change of mind, regret, or reinterpretation by the author, but it doesn't retroactively alter the meaning constituted at the time of creation/publication.
      *   **Underdetermined:** Distinguishing a "categorial" claim from a "pragmatic" claim in the author's statement can sometimes be tricky (e.g., "I meant it as a protest" – categorial [polemic?] or pragmatic [goal of effecting change]?). Requires careful parsing of the author's statement. The standard of evidence for defeasibility remains an open question.

  3.  **Survival of the "Intentional Fallacy" Charge:**
      *   **Implication:** The charge **survives but is significantly modified and narrowed** by the stipulation.
      *   **Pragmatic Intention:** Appeals to the author's hopes, goals, or desired effects (pragmatic intention) as determining meaning *are still fallacious* under this stipulation. Meaning is not constituted by what the author hoped the text would *do*.
      *   **Semantic & Categorial Intention:** Appeals to semantic and categorial intention are *not* fallacious *in principle* because they are stipulated as partly constitutive of meaning. However, the stipulation introduces crucial caveats:
          *   **Not Sufficient:** Authorial statements about semantic or categorial intention are not *sufficient* on their own to establish meaning. They must align with the linguistic conventions (semantic) and be consistent with/not defeated by the text and public context (categorial).
          *   **Defeasibility (Categorial):** Treating the author's categorial intention as absolute and indefeasible *would* be fallacious under this model. The fallacy manifests if a critic ignores textual/contextual evidence that defeats the author's stated category.
          *   **Focus:** The fallacy transforms. The core error is no longer *any* appeal to authorial intention, but rather: (1) Appealing to *pragmatic* intention for meaning, (2) Treating authorial statements about semantic/categorial intention as *conclusive proof* without textual/contextual validation, or (3) Ignoring the *defeasibility* of categorial intention by the text and context.
      *   **Underdetermined:** The precise boundaries of the "public context" relevant to categorial defeasibility could be debated (how wide? contemporaneous only?).

  4.  **Editorial Decisions: Manuscript vs. Published Text Diverging in Category:**
      *   **Implication:** The editor faces a conflict between evidence of the author's **categorial intention** (potentially clearer in manuscripts/drafts/letters) and the **achieved category** of the *published* text within *its* public context.
      *   **Guiding Principle:** The stipulation states the *achieved category governs*. Therefore:
          *   **Published Text Governs:** The primary focus *must* be on establishing the category of the text *as published and received* based on its own features and the public context at the time of publication. This is the text that entered the world and has cultural meaning.
          *   **Manuscript as Evidence:** Manuscript evidence (drafts, author notes, letters) is highly valuable *evidence* of the author's *categorial intention*. It helps illuminate what the author was *trying* to achieve.
          *   **Defeasibility Applied:** If the published text's features and the context of its reception clearly establish a category *different* from the one indicated in the manuscripts (e.g., the author aimed for sincere praise but published text reads as obvious parody to contemporaries; or aimed for finished novel but published text has clear gaps and unresolved plots suggesting fragment), then the *published text's achieved category governs* for interpretation.
          *   **Editorial Presentation:** The editor's role is to:
              1.  Present the published text accurately.
              2.  Use textual notes to document significant manuscript variations (including categorial intent if evident).
              3.  Use the introduction/commentary to discuss the *evidence* (manuscripts, context) for the author's categorial intention and the evidence (text, reception context) for the achieved category, explaining any divergence in light of the defeasibility principle. The editor explains *why* the published text functions as, say, irony, even if manuscripts show the author aiming for sincerity.
      *   **Underdetermined:**
          *   **Ambiguity:** What if the published text is genuinely ambiguous between categories, and manuscript evidence strongly points to one? The stipulation doesn't dictate how to handle ambiguity. The editor might argue the manuscript tips the balance, or might present the ambiguity.
          *   **Pragmatic Changes:** If the category change seems driven by *publisher* pragmatics (e.g., toning down satire to avoid libel) rather than textual features/context forcing a new reading, does the author's original *categorial* intention still govern if the text *can* be read that way? The stipulation focuses on the text's features and public context, not the *reason* for the divergence. The editor must still assess what category the published text *achieved* based on how it functioned.

  **In Summary:** Your stipulation provides a powerful framework by clearly separating intention types and introducing categorial defeasibility. It directs attention firmly to the text and its public context as the final arbiters of meaning, especially concerning "what kind of thing" the text is, while acknowledging the constitutive role of authorial semantic and (defeasible) categorial intent. The main points requiring further seminar development or participant consideration are the standards of evidence for defeasibility and the precise boundaries of "public context."
