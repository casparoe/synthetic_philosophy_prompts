  Here’s a speech draft designed around your heartfelt and complex request. It’s structured to be warm, authentic, acknowledge the reality without debate, subtly incorporate the "life complete" concept, frame everyone as witnesses, avoid quotes, and stay within 5-7 minutes (approx. 750 words spoken at a moderate pace).

  **Speech Draft:**

  (Start with warmth and a touch of humor, looking at your aunt)
  Aunt [Aunt's Name], you look fabulous. Seriously, front-row seat, cake in hand, eyebrows at the ready? You always did know how to make an entrance... and how to keep the pressure on. For those of you wondering, yes, I *did* practice this in front of the mirror. No, it didn’t help much. But knowing you’re judging my posture and enunciation from three feet away? That’s focus.

  (Shift tone slightly, warmly inclusive)
  Welcome, everyone. Truly. To family who’ve known her forever, friends from every chapter – especially the rowing crew, I see you ready with the stories... and the wine – her incredible hospice team who’ve walked this path with such grace, thank you. We’re all here because [Aunt's Name] matters. Deeply. To all of us. And she asked for this. Not a somber goodbye later, but a *party*, with her right here, right now. A chance to feel the love, share the laughs, and raise a glass to the force of nature that is... her. And she was VERY clear: NO BLACK. So, well done, team. She’s already winning.

  (Acknowledge the reality gently but directly)
  Look, let’s not pretend this is easy. Or ordinary. We’re gathered because [Aunt's Name] is facing something immense. ALS is brutal. And she’s made a choice, a deeply personal one, about how her story ends. It’s a choice born of courage, of knowing herself, and frankly, of sheer stubbornness in the face of a disease that tried to dictate the terms. She wrestled back control. That’s so *her*. It’s happening. And we’re here, together, in this moment she chose – a moment full of life, not waiting for death.

  (Subtly introduce the "life complete" concept without terminology)
  When you talk to [Aunt's Name] about this... really talk to her... what comes through isn’t fear of what *might* come next, or running away. It’s something else entirely. It’s the quiet certainty of someone who has *lived*. Fully. Fiercely. With wit, with occasional chaos, with incredible loyalty, and yes, with opinions she was never shy about sharing! She climbed mountains – literally, sometimes! She built a career/life/family [Choose most fitting]. She loved, she argued, she laughed until she cried, she probably made a few of you cry too at some point (we’ve all been there!). She rowed hard, she loved harder. She squeezed every drop out of this life. She wrote a hell of a book. And standing here, looking at her, surrounded by all of you... she knows the last chapter is written. The story is complete. This party? It’s her way of putting the final, dazzling exclamation point on it herself, on her own terms, while she can still feel the warmth of the room and taste the cake. How incredibly *her* is that?

  (Address the "witness, not author" concept gently)
  Now, being here tonight... and for some of you, being with her in the days to come... that takes a different kind of courage. It takes love that doesn’t flinch. It’s hard. It might feel complicated. But please hear this: **Your presence isn’t permission. It isn’t agreement, if you can’t find it in your heart. It’s simply love showing up.** It’s bearing witness to *her* choice, to *her* journey, to *her* fierce spirit that decided how this ends. You’re not writing the ending; she did that. You’re honoring the author by being present for the final page she chose to share. That’s not complicity; that’s compassion. That’s showing up for someone you love, even when the path is unimaginably difficult. It’s saying, *"I see you. I’m here. You matter."*

  (Shift back to celebration, focus on shared memories)
  So tonight, let’s do exactly what she wants. Let’s celebrate the book! Let’s tell the stories – the rowing mishaps, the infamous [mention a funny family story or event], the times she drove you nuts, the times she lifted you up. Let’s laugh. Let’s maybe cry a little too (discreetly, she’d hate soggy cake). Let’s fill this room with the sheer, vibrant energy of [Aunt's Name]. Let her feel the love she’s built over a lifetime reflected back at her, tenfold. Because that’s the legacy she’s leaving – not just the ending, but the incredible, messy, beautiful life that came before it.

  (Look directly at your aunt, warm and personal)
  [Aunt's Name], you magnificent, stubborn, brilliant woman. Thank you for throwing this party. Thank you for trusting me with the mic, even if you *are* silently critiquing my hand gestures right now. Thank you for every lesson, every laugh, every bit of your fierce, unapologetic self. We’re here because you loved us big. And we love you right back. Immensely. So, let’s get this party truly started. Everyone, raise your glass – to [Aunt's Name]! To a life lived loud, lived full, lived entirely on her own terms. Cheers to you!

  (End on a genuine smile towards her and the room)

  **Why this works for your needs:**

  1.  **Warmth & Humor:** Starts and ends with it, woven throughout ("eyebrows ready," "winning," "soggy cake," "silently critiquing").
  2.  **Acknowledges Reality:** Directly states ALS is brutal, her choice is happening, avoids euphemisms ("how her story ends").
  3.  **Avoids Debate/Lecture:** Doesn't engage with the ethics abstractly. Focuses purely on *her* experience and choice.
  4.  **Avoids Defending/Confronting:** Doesn't call out anyone (the brother, cousins). Addresses their potential feelings indirectly through the "witness" section and the inclusive "it might feel complicated" / "if you can’t find it in your heart."
  5.  **Embeds the "Life Complete" Concept:** Uses vivid imagery ("squeezed every drop," "wrote a hell of a book," "last chapter is written," "story is complete," "final exclamation point") to convey the *verdict* aspect without academic terms. Contrasts it implicitly with "running away" or "fear of the future."
  6.  **Frames as Witnesses:** Explicitly states: "Your presence isn’t permission... It’s simply love showing up... You’re not writing the ending; she did that... bearing witness... honoring the author... That’s not complicity; that’s compassion." This directly addresses the core fear without argument.
  7.  **Honors Her Request:** Focuses on celebration, life, stories, party atmosphere. No black, no funeral tone. She's the center, alive and present.
  8.  **Practical:** Estimated 5-7 minutes. No quotes or poetry. Conversational language that's easier to deliver naturally. Built for *her* and the specific people mentioned (rowing club, hospice).
  9.  **Validates All:** Acknowledges it's hard and complicated feelings exist without judgment, creating space for everyone in the room. The "witness" section is crucial for this inclusivity.

  **Delivery Tips:**

  *   **Practice:** Read it aloud multiple times to get the flow. Time yourself.
  *   **Pace:** Don't rush. Pause after significant points, especially the "witness" section and the "life complete" imagery. Let the room absorb it.
  *   **Eye Contact:** Connect with your aunt frequently. Scan the room warmly, making brief contact with different groups (family, friends, hospice nurse).
  *   **Tone:** Match the words – warm, sincere, occasionally light, respectful during serious parts, strong during the "witness" segment, celebratory at the end.
  *   **Breathe:** Take deep breaths before starting and during natural pauses.
  *   **It's Okay:** If you get slightly emotional, that's human and understandable. Pause, take a breath, and continue. The room will be with you.

  This speech respects your aunt's fierce spirit, honors the complexity in the room, and weaves in the profound ethical insight from your seminar in a way that feels human and true, not academic. Wishing you strength and clarity as you deliver it. She chose you for a reason.
