  ### **KEY NOTES FOR YOUR TREE**
  - **Unseparatable Leaves**:  
    - `Adaptive Capacity` and `Pragmatic Pluralism` often overlap. Both reject fixed "dysfunction," but the former focuses on environmental fit, the latter on social utility.  
    - `Value-Laden Hybrid` and `Species-Typical Function Hybrid` are indistinguishable in cases where "design" aligns with "harm" (e.g., cancer).  
  - **Empty Branch**: Node 5 → YES path. Labeling universal traits (baldness) as diseases while requiring dysfunction creates paradoxes.  
  - **Case Coverage**:  
    - Aging → Nodes 2, 7  
    - Homosexuality → Node 6  
    - Harmless unusual trait → Node 1  
    - Pathogen carrier → Node 4  
    - Grief → Node 3  
    - Refusing treatment → Node 8  
    - Declassified "disease" → Node 6  
    - Common "illness" (baldness, cholesterol) → Nodes 2, 7  

  This tree prioritizes character-usable friction over philosophical purity. To use it, drop a case (e.g., prolonged grief) into Node 1 and follow the branches—your characters’ choices will expose their assumptions. The hardest-to-swallow commitments are designed as tension points for dialogue (e.g., your cardiologist might balk at the subjectivity in `Adaptive Capacity`, while your disability consultant rejects `Species-Typical Function`). No citations, no homework—just map the fault lines and write.
