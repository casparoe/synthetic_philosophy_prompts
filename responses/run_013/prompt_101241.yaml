  ### **DECISION TREE: WHAT MAKES SOMETHING A DISEASE?**
  *Start at Node 1 with any concrete case (e.g., aging, homosexuality, benign carrier status).*

  #### **NODE 1: Consider a harmless trait most people lack (e.g., six functional fingers). Is it a disease?**
  - **YES** → Go to Node 2  
  - **NO** (harm is necessary) → Go to Node 3  

  #### **NODE 2: Consider aging – universal, biologically "normal," but causes decline. Is it a disease?**
  - **YES** → **Leaf: EXTREME NORMATIVISM**  
    *Hardest to swallow: Universal human processes (aging, menopause) become pathologies.*  
  - **NO** → **Leaf: STATISTICAL DYSFUNCTION**  
    *Hardest to swallow: Harmless quirks (e.g., albinism) are diseases; harmful norms (e.g., tooth decay) might not be.*  

  #### **NODE 3: Consider ordinary grief – painful but expected after loss. Is it a disease?**
  - **YES** → **Leaf: PURE HARMVULNESS**  
    *Hardest to swallow: All suffering is medicalized (e.g., hunger, heartbreak).*  
  - **NO** (dysfunction is also necessary) → Go to Node 4  

  #### **NODE 4: Consider a "treated" asymptomatic carrier (e.g., HIV+ with undetectable viral load). Are they diseased?**
  - **YES** → Go to Node 5  
  - **NO** → Go to Node 6  

  #### **NODE 5: Consider male-pattern baldness – common, "designed," non-fatal. Is it a disease?**
  - **YES** → **Leaf: EMPTY BRANCH**  
    *Why empty? Nobody defends this: Requires harm + dysfunction but labels universal traits as dysfunctional. Incoherent.*  
  - **NO** → **Leaf: DYSFUNCTION-REQUIRING NATURALISM**  
    *Hardest to swallow: Harmless dysfunctions (benign tumors) are diseases; harmful non-dysfunctions (grief) are not.*  

  #### **NODE 6: Consider homosexuality – declassified as a disease with no biological change. Why?**
  - **PRIMARY REASON: We misjudged the dysfunction** (e.g., no broken biology) → Go to Node 7  
  - **PRIMARY REASON: We re-evaluated the harm** (e.g., social stigma ≠ biological harm) → Go to Node 8  

  #### **NODE 7: Consider high cholesterol – common in aging societies, statistically "normal." Is it a disease?**
  - **YES** → **Leaf: ADAPTIVE CAPACITY VIEW**  
    *Hardest to swallow: Health is contextual (e.g., cholesterol isn't diseased in paleolithic humans); medicine must redefine "normal" constantly.*  
  - **NO** → **Leaf: SPECIES-TYPICAL FUNCTION HYBRID**  
    *Hardest to swallow: "Human design" is vague (e.g., is childbirth dysfunction?) and ignores environmental mismatches.*  

  #### **NODE 8: Consider a Deaf person rejecting cochlear implants – atypical body, no personal harm. Are they diseased?**
  - **YES** → **Leaf: SOCIETAL HARMFULNESS**  
    *Hardest to swallow: Individuals can be diseased against their own assessment if society is inconvenienced.*  
  - **NO** → Go to Node 9  

  #### **NODE 9: Should "disease" apply uniformly (clinics, insurance, courts) or be context-dependent?**
  - **UNIFORM: One definition rules all** → **Leaf: VALUE-LADEN HYBRID**  
    *Hardest to swallow: Pretends biology + harm is objective, but both are contested (e.g., "harm" in prolonged grief debate).*  
  - **CONTEXT-DEPENDENT: Different meanings for different uses** → **Leaf: PRAGMATIC PLURALISM**  
    *Hardest to swallow: Accepts contradictions (e.g., aging is a "disease" for research funding but not for nursing homes).*  

