          - A common simple model: assume the source is correct with probability q (their reliability) and when incorrect, they report randomly. But then we are effectively using Method 3. Alternatively, we can use the stated confidence to model the source's distribution of reports.
     - **Important**: This method is valid only if the report R is conditionally independent of everything else given H and ~H. If there are other factors, we need Method 3.
     - Record: "Conditioned on the report using assumed likelihoods: P(report|H)=..., P(report|~H)=..."

  **Step 7: Explicit Reliability Model (Method 3)**
     - We expand the model to include a node for the source's reliability (Rel). We need:
          P(Rel) = probability the source is reliable. [J]
          If reliable, then the source reports the true probability (so we use the stated p as the truth).
          If unreliable, we need a model for what they report. [J] This could be:
              - They report randomly (uniform over [0,1])?
              - They report a fixed value (e.g., always 50%)?
