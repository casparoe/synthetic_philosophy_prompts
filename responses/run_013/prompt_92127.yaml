  ### Procedure for Converting Stated Confidence into Revised Probability  
  **Default Method:** Direct update (Method 1) when the source has a documented track record. Default is justified by efficiency and minimal assumptions, but it fails when reliability is unknown or evidence violates rigidity.

  #### Step-by-Step Checklist  
  1. **Record Context & Identify Hypothesis**  
     - Document: Source’s identity, exact statement, time, and the target hypothesis (H).  
     - Flag: Base rates, known source biases, and any dependencies (e.g., "object ID depends on region").  
     - *Judgment*: Define H and the partition (mutually exclusive outcomes).  

  2. **Check for Probability Zero**  
     - If prior P(H) = 0, **ESCALATE**. Updating requires model overhaul (e.g., adding new states).  
     - Example: Prior assigned 0% chance of a rare object, but source reports it.  

  3. **Assess Partition Rigidity**  
     - Ask: "Does the report *only* shift probabilities between H and ~H, without changing how other evidence affects H?"  
     - If NO (e.g., report changes interpretation of future evidence), use **Explicit Model (Method 3)**.  
     - *Judgment*: Rigidity failure is common in regulatory/political contexts (e.g., "regulator delay" affects future evidence).  

  4. **Evaluate Source Reliability**  
     - Track record? → Use **Direct Update (Method 1)**.  
     - No track record? → Proceed to Step 5.  
     - Unknown reliability correlated with H? (e.g., source incentives tied to outcome) → **ESCALATE** (requires Method 3).  

  5. **Choose Update Method**  
     - **Method 1 (Direct Update)**: If source is calibrated (track record shows stated P ≈ actual P).  
       - Update: Set P_new(H) = source’s stated P.  
     - **Method 2 (Condition on Report)**: If no track record, and reliability is uncorrelated with H.  
       - Treat report (R) as evidence. Compute:  
         $$P_{\text{new}}(H) = \frac{P(R|H) \cdot P_{\text{old}}(H)}{P(R|H) \cdot P_{\text{old}}(H) + P(R|\neg H) \cdot P_{\text{old}}(\neg H)}$$  
       - *Judgment*: Assign P(R|H) and P(R|¬H) (e.g., P(R|H) = source’s P if truthful).  
     - **Method 3 (Explicit Model)**: If reliability is unknown/correlated, or rigidity fails.  
       - Add node: "Source Reliability" (Rel = reliable/unreliable).  
       - Define: P(Rel), P(R|H, Rel), P(R|H, ¬Rel).  
       - Compute: Marginalize over Rel to get P(H|R).  
       - *Judgment*: Estimate P(Rel) and error behavior (e.g., "unreliable source guesses randomly").  

  6. **Handle Multiple Reports**  
     - If reports arrive sequentially and partitions differ:  
       - Record order of arrival.  
       - Update sequentially in recorded order.  
       - **ESCALATE** if order changes outcome materially (requires joint Method 3 model).  

  7. **Document & Review**  
     - Justify method choice, assumptions, and deviations.  
     - Client note must disclose: "Departed from protocol: [reason]."  
     - Escalate disputes over assumptions (e.g., "Should P(Rel) = 0.5?").  

  ---

  ### Why the Three Methods Diverge  
  - **Direct Update (Method 1)**: Assumes source’s stated P is "truth." Fast but ignores reliability.  
  - **Condition on Report (Method 2)**: Treats report as data. Depends on likelihoods (P(R|H)), which may not match stated P.  
  - **Explicit Model (Method 3)**: Accounts for reliability/error. Robust but complex.  
  **Divergence Causes**:  
  1. Reliability uncertainty → Methods 1/2 over/underweight evidence.  
  2. Correlation between reliability and H → Method 2 fails.  
  3. Non-rigid partitions → Method 1 fails.  

  ---

  ### Case Applications  
  #### (a) Source with Track Record: "70% confidence deal closes."  
  - **Procedure**:  
    - Step 1: H = "deal closes."  
    - Step 2: P_old(H) > 0.  
    - Step 3: Rigidity holds (report only affects H/~H).  
    - Step 4: Track record → **Method 1 (Direct Update)**.  
    - Update: P_new(H) = 0.70.  
  - **Output**: Defensible via calibration history.  

  #### (b) No Track Record: "60% confidence object is launcher" (base rate = 1%).  
  - **Procedure**:  
    - Step 1: H = "object is launcher."  
    - Step 2: P_old(H) = 0.01 > 0.  
    - Step 3: Rigidity holds.  
    - Step 4: No track record → Skip Method 1.  
    - Step 5: Use **Method 2 (Condition on Report)**.  
      - *Judgment*: Assume source’s stated P reflects accuracy.  
        - P(R|H) = 0.60 (if launcher, 60% chance they say "60%").  
        - P(R|¬H) = 0.40 (if not launcher, 40% chance they say "60%").  
      - Compute:  
        $$P_{\text{new}}(H) = \frac{0.60 \cdot 0.01}{0.60 \cdot 0.01 + 0.40 \cdot 0.99} \approx 0.015$$  
    - **Output**: P_new(H) ≈ 1.5%. Low base rate dominates update.  

  #### (c) Two Reports, Order-Dependent:  
  - **Scenario**:  
    - Report A (track record): "P(H) = 70%."  
    - Report B (no track record): "P(H) = 30%."  
    - Arrival order: A then B.  
    - True outcome: P_new(H) depends on order.  
  - **Procedure**:  
    - Step 1: H = same for both.  
    - Step 2: P_old(H) > 0.  
    - Step 3: Rigidity holds.  
    - Step 4: Update sequentially in order (A→B).  
      - **Update A**: Method 1 → P_A(H) = 0.70.  
      - **Update B**: Method 2 (as in Case b).  
        - *Judgment*: P(R_B|H) = 0.30, P(R_B|¬H) = 0.70.  
        - Compute:  
          $$P_{\text{new}}(H) = \frac{0.30 \cdot 0.70}{0.30 \cdot 0.70 + 0.70 \cdot 0.30} = 0.50$$  
    - **Output**: P_new(H) = 50%.  
  - **Order Effect**: If B→A, P_new(H) = 70% (Method 1 overwrites Method 2).  
  - **Client Note**: "Order effect: A→B yields 50%, B→A yields 70%. Assumed P(R_B|H)=0.30."  

  ---

  ### What This Procedure Cannot Do  
  **Core Limitation**: It cannot resolve ambiguities in human judgment. Analysts must assign P(Rel), P(R|H), and rigidity—all subjective. The first failure mode will be **over-reliance on Method 1** when track records are sparse, amplifying miscalibration. For example, a source claiming 70% on a novel event may be overconfident, but Method 1 blindly accepts it. Similarly, **ad hoc likelihoods** in Method 2 (e.g., assuming P(R|H) = stated P) will propagate errors if sources misrepresent confidence. Finally, **order dependence** in sequential updates will create arbitrariness; clients will notice when reversed reports change outcomes. The procedure exposes these tradeoffs but cannot eliminate them—your escalation inbox will fill with disputes over assumptions, not computation.
