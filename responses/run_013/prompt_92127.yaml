  We are designing a procedure for converting stated confidences into revised probabilities for a hypothesis. The procedure must handle three different updating methods and guide when to use each. The three methods are:

  1. **Direct Update (Probability Kinematics)**: Update directly on the source's stated confidence. This assumes that the source's stated probability is the correct conditional probability and applies Jeffrey's rule (probability kinematics). This is appropriate when the report directly bears on the probability of the event and the source is "calibrated" in the sense that their stated confidence matches the true probability.

  2. **Conditioning on the Report as a Proposition**: Treat the report as a piece of evidence and condition on the fact that the report was made. This requires knowing the likelihood of the report given the event and given not the event. This is appropriate when we have a model of how the source behaves (e.g., their reliability or tendency to report certain things) but we don't take their stated number at face value.

  3. **Explicit Reliability Model**: Expand the model with an explicit node for the source's reliability or error. This is the most comprehensive but also the most complex. It is necessary when the source's reliability is unknown and potentially correlated with the event, or when we have multiple reports and need to model dependencies.

  The procedure must default to one of these. We choose **Direct Update (Method 1)** as the default because it is the simplest and most direct when we have a track record of the source being calibrated. However, we must recognize when this is inappropriate.

  The steps of the procedure are as follows. Steps that require judgment are marked with [J]. Steps that require escalation are marked with [ESC].

  **Procedure: Updating on Stated Confidence**

