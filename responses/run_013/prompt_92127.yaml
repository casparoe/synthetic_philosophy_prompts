     - The partition is the set of mutually exclusive and exhaustive events we are considering. If the report is about a different event (or a coarser/finer partition) and we cannot easily map it to our partition, then we must model explicitly (Method 3) and note the departure. [J]
     - Example: If our hypothesis is "the deal closes" and the source reports "70% confidence the deal closes", then same partition. If the source reports on a related event (e.g., "the regulator will delay") and we have a model of how that affects the deal, then we might use conditioning (Method 2) or expand the model (Method 3).

  **Step 2: Check if we have a track record for the source.**
     - If we have a well-documented track record (e.g., past probabilities from this source have been calibrated) and the context is similar, then use Method 1 (Direct Update) and skip to Step 5.
     - If we have no track record, or the track record shows miscalibration, then we cannot use Method 1 without adjustment. Proceed to Step 3.

  **Step 3: Decide if we can model the source's reliability.**
     - We need to ask: Can we assign a probability that the source is reliable? And if so, do we know the behavior of the source when they are unreliable? [J]
     - If we can model the reliability (even roughly) and we suspect that the source's reliability might be correlated with the event (e.g., they are more likely to report confidently when the event happens) then we must use Method 3 (Explicit Reliability Model). Proceed to Step 7.
     - If we cannot model reliability (due to lack of information) and we have no track record, then we have to use Method 2 (Conditioning on the Report) by making assumptions about the source's behavior. Proceed to Step 6.

  **Step 4: Check for zero probability.**
     - If the event the source is reporting on was previously assigned probability zero by us, then we cannot update by conditioning (Method 2) without adjusting the model. We must use Method 3 (Explicit Reliability Model) because we need to account for the possibility that the event happened and the source is reporting it. [ESC] if this is a surprise (because we thought the event was impossible) and we need to reconsider the model.

  **Step 5: Direct Update (Method 1)**
     - Let P_old(H) be our current probability for H.
     - The source states a probability p for H.
     - We update by setting P_new(H) = p.
     - **Justification**: We are treating the source as a calibrated expert. We are effectively replacing our old probability with the source's because we trust their calibration.
     - Record: "Updated via direct probability kinematics (Jeffrey update) based on source's stated confidence, due to source's track record of calibration."

  **Step 6: Conditioning on the Report (Method 2)**
     - We treat the report R as a piece of evidence. We need:
          P(R|H) = probability of seeing this report if H is true.
          P(R|~H) = probability of seeing this report if H is false.
     - We also need P_old(H).
     - Then we compute:
          P_new(H) = [P(R|H) * P_old(H)] / [P(R|H)*P_old(H) + P(R|~H)*P_old(~H)]
     - How to get P(R|H) and P(R|~H)? [J] We must assume a model for the source. For example:
          - If the source is making a statement of confidence p, we might assume that when H is true, the source reports p with some distribution (e.g., centered around the true probability) and when H is false, with a different distribution.
