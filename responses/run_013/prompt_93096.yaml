prompt: |-
  I'm doing a piece on the pronatalist moment — the fertility panic, Musk going on about needing more humans, all of it — and I keep noticing that everyone argues from a single case. Someone says more people means more geniuses, someone says more people means more emissions, someone says think of the child who never gets born. Before I start interviewing I want the spec sheet, not another hot take. So: what would a theory of "is a larger population better?" actually have to get right? Give me the requirements, each with the case or consideration behind it. I mean things like: adding a happy person to an existing world (better, worse, or neither?); adding a person whose life is barely worth living; the fact that how many people there are partly determines *which* people exist, so you can't just compare two worlds person by person; whether it's bad for humanity to go extinct if no one would be around to be deprived; the odd asymmetry where most of us think there's no duty to make a happy person but a duty not to make a miserable one; and the fact that a person's wellbeing isn't independent of how many other people there are (status, crowding, climate, that sort of thing). Then tell me which of these are non-negociable and which are just the preference of one camp, flag any pair that can't be satisfied at once — honestly that's the part I most want — and say which single requirement knocks out the most popular answers (total, average, and whatever this "critical level" thing is). Dont bother with citations, thats not what I need.
