prompt: |-
  I am a doctoral student working on the criteria of authenticity in historical-Jesus research, and I have reached the point where I need to state, as precisely as I can, what such criteria would have to do to be worth employing at all. Please write me that specification.

  Set out the desiderata that any adequate criterion — or, more plausibly, any adequate set of criteria — for separating authentic from inauthentic Jesus material must satisfy. For each, give the case or consideration that motivates it, so that I can see what work it is doing and what would be lost by abandoning it. I expect the list to cover at least: the phenomena it must account for (the nature of the sources, the fact that our Greek texts stand at the end of a period of transmission, that the same saying recurs in different forms and settings, that some material is transparently the later church's product); the distinctions it must not collapse (between a saying and its setting, between the authenticity of an individual unit and the authenticity of the portrait built out of the units, between a saying's being early and its being authentic, between the historical Jesus and the kerygmatic Christ); and the results it must be consistent with, in so far as any are reasonably secure.

  Then two things I care about more than the list itself. First, which of the requirements are genuine desiderata and which are merely the preferences of one camp — maximalist, minimalist, or otherwise — presented as method. Second, whether any of the requirements are jointly unsatisfiable. I have a suspicion, which I would like you to test rather than assume, that the demand for selectivity (a criterion with real discriminating power, able to reject as well as to accept) and the demand for coherence (the surviving material adding up to a recognisable figure) cannot both be met at once, and that the requirement that the criteria be usable without already knowing who Jesus was sits badly with the way the best-known criteria define themselves by contrast with the Judaism and the church of the period. Say which requirements conflict, and what that does to the whole project of using the criteria to settle who he was.

  I would also like one requirement that is usually left implicit made explicit: that a criterion be calibrated against material we have independent reason to regard as late or secondary, so that we can be sure it is capable of returning a negative verdict, and that it not authenticate everything it touches.

  Please give me the argument rather than a reading list: no references or bibliography. Close by saying which single requirement, if enforced, would eliminate the greatest number of the standard criteria, and what would be left standing.
reasoning: |-
  Okay, the user is a doctoral student working on historical-Jesus research criteria of authenticity. They need a precise specification of what makes these criteria worth using. Let me start by understanding their main concerns. They want desiderata for any adequate criterion or set, covering phenomena to account for, distinctions not to collapse, and results to be consistent with. Also, they care about discerning genuine desiderata vs. camp preferences, potential conflicts between requirements, and the need for calibration against late material.

  First, the phenomena. The sources are Greek texts after oral transmission, with variations in sayings and clear later additions. So criteria must handle transmission effects, variability, and later theological influences. Distinctions like saying vs. setting, individual unit vs. overall portrait, early vs. authentic, historical Jesus vs. kerygmatic Christ are crucial. Collapsing these could lead to methodological errors, like assuming early means authentic or mixing the church's theology with Jesus's words.

  Then, the user questions which requirements are truly necessary versus partisan. For instance, maximalists might push for coherence to build a fuller portrait, while minimalists emphasize selectivity to avoid contamination. The user suspects selectivity and coherence might conflict. If a criterion is too selective, it might discard too much, leaving an incoherent figure. But forcing coherence might include inauthentic material. Also, using criteria without prior knowledge clashes with criteria that define Jesus against Judaism or the church, as they presuppose a distinct identity.

  The calibration point is vital. Criteria need testing against known late material to ensure they can reject as well as accept. Many current criteria don't do this, leading to over-authentication. 

  Now, conflicts: Selectivity vs. coherence is a big one. Selectivity reduces data, possibly to fragments, while coherence needs enough material for a consistent portrait. Also, avoiding prior assumptions conflicts with discontinuity criteria that need contrast with Judaism or the church. If you don't assume Jesus's uniqueness, how can discontinuity work? That's a tension.

  The single requirement that would eliminate most criteria is calibration. Many like dissimilarity or embarrassment aren't tested against late material. Enforcing this would leave coherence as the only plausible one, but even that needs careful handling.

  The user's deeper needs: They want to clarify methodological rigor in their thesis, identify pitfalls in existing criteria, and possibly navigate between minimalist and maximalist views. They might be seeking a framework that acknowledges the limitations but still allows for credible historical reconstruction. Highlighting conflicts helps them argue for a nuanced approach, maybe combining criteria with source criticism or other methods.
answer: |-
  Here is a precise specification of the desiderata for adequate criteria of authenticity in historical-Jesus research, structured as requested, followed by analysis of conflicts and implications:

  **Core Desiderata for Criteria of Authenticity:**

  1.  **Account for Source Phenomena:**
      *   **What it must do:** Explicitly address the nature of the Synoptic tradition (oral transmission, literary dependence, lack of verbatim recording), the late Greek textual endpoint, the variation of sayings across contexts (doublets, different settings), and the demonstrable presence of clearly secondary/inauthentic material (e.g., developed church theology, post-resurrection narratives, obvious anachronisms).
      *   **Motivation:** Failure here renders criteria naive to the actual transmission process. Ignoring variation or the existence of late material prevents the criterion from distinguishing genuine signals from inevitable noise and development. Without this, criteria operate in a vacuum.
      *   **Loss if abandoned:** Criteria become vulnerable to accepting late theological developments or dismissing authentic but varied traditions as inauthentic simply due to variation. They fail to engage the core problem.

  2.  **Maintain Critical Distinctions:**
      *   **What it must do:** Clearly differentiate:
          *   The authenticity of a *saying/logion* from the authenticity of its *narrative setting*.
          *   The authenticity of *individual units* (pericopae, sayings) from the authenticity/historicity of the *overall portrait* constructed from them.
          *   Material being *early* (first-century, apostolic) from material being *authentic* (originating with Jesus).
          *   The reconstructed *historical figure of Jesus* from the *kerygmatic Christ* of early Christian proclamation.
      *   **Motivation:** Conflating these leads to fundamental methodological errors. Authenticating a saying doesn't authenticate its context. Early church material isn't necessarily Jesus material. The "historical Jesus" is a critical construct distinct from the object of faith. The portrait's coherence is a result, not a presupposition, of authenticating units.
      *   **Loss if abandoned:** Results in circular reasoning (e.g., assuming the portrait to authenticate units, then using units to build the portrait), misattribution of early church beliefs to Jesus, and the inability to isolate genuine Jesus material from its interpretive frameworks.

  3.  **Produce Consistent, Secure Results:**
      *   **What it must do:** Yield conclusions compatible with the small core of reasonably secure historical knowledge about Jesus (e.g., crucifixion under Pilate, association with John the Baptist, existence of disciples, conflicts with religious authorities, focus on the "Kingdom of God").
      *   **Motivation:** While the criteria aim to *establish* authenticity, they cannot operate in total contradiction to the minimal bedrock facts established by other means (e.g., basic historical context, undisputed events). A criterion declaring the crucifixion inauthentic would invalidate itself.
      *   **Loss if abandoned:** Criteria risk becoming unmoored from historical reality, producing conclusions fundamentally at odds with the basic historical situation.

  4.  **Possess Discriminating Power (Selectivity):**
      *   **What it must do:** Be capable of yielding *negative* judgments. It must have the theoretical capacity to *reject* material as inauthentic or secondary, not just accept it.
      *   **Motivation:** A criterion that only "authenticates" is useless; it provides no critical filter. The entire point is to sift the tradition. Authenticity criteria must function as *criteria*, implying a standard for judgment that excludes as well as includes.
      *   **Loss if abandoned:** The criterion becomes a tool for maximalism by default, incapable of challenging any tradition and thus failing its primary purpose of discernment.

  5.  **Avoid Presupposing the Conclusion (Non-Circularity):**
      *   **What it must do:** Be applicable without requiring prior, detailed knowledge of "who Jesus was" or his unique theological profile. Its definition cannot rely heavily on the very portrait it is meant to help establish.
      *   **Motivation:** Criteria should be tools for *discovery*, not just confirmation. Relying on a predefined "essence" of Jesus (e.g., "uniquely non-Jewish," "radically challenging") smuggles in assumptions that predetermine results and prevent genuinely new insights.
      *   **Loss if abandoned:** Results become circular and reinforce prior scholarly or theological biases. The criterion merely selects material fitting a predefined image, failing as an independent historical tool.

  6.  **Calibration Against Known Controls:**
      *   **What it must do:** Be demonstrably *tested and validated* against material that there is strong, independent reason to consider late, secondary, or demonstrably inauthentic (e.g., clear theological developments of the post-Easter church, patently anachronistic elements, material dependent on known later sources). It must reliably *fail* this material.
      *   **Motivation:** This is the empirical test for Desideratum 4 (Selectivity). Without it, there is no evidence the criterion *can* actually reject anything. Many criteria *in theory* can reject, but lack proof they *do so in practice* against known late material. This ensures the criterion isn't just authenticating everything it touches.
      *   **Loss if abandoned:** We cannot trust that a criterion's positive judgments are meaningful, as it might be equally likely to authenticate late, secondary material. Its selectivity is unproven.

  **Analysis of Genuine Desiderata vs. Camp Preferences:**

  *   **Genuine Desiderata (Essential Methodological Rigor):** 1 (Account for Phenomena), 2 (Maintain Distinctions), 3 (Consistent Results - *minimal bedrock only*), 4 (Selectivity), 5 (Non-Circularity), 6 (Calibration). These are foundational to *any* critical historical method applied to this specific problematic source material. Abandoning any cripples the method's credibility.
  *   **Camp Preferences Masquerading as Method:**
      *   **"Add up to a Recognizable/Coherent Figure" (Coherence Demand):** Often a maximalist preference. While a *result* might be coherent, demanding it as a *criterion* or prerequisite biases selection towards material that fits an assumed narrative and against anomalous but potentially authentic data. Historicity does not guarantee modern narrative coherence.
      *   **Extreme "Dissimilarity" as Sole Arbiter:** A minimalist preference (often overstated as a strawman). While dissimilarity (from Judaism *and* the Church) *can* indicate authenticity, requiring *double* dissimilarity as the *primary* or sole criterion is far too restrictive and yields an implausible, ahistorical Jesus. It's a useful tool, not an exclusive requirement.
      *   **Requiring Conformity to a Specific "Bedrock" Beyond Minimal Facts:** Both camps can be guilty. Maximalists might insist criteria preserve "core teachings" they deem essential; minimalists might demand conformity only to the *most* minimal facts possible. Desideratum 3 only requires consistency with the *securest minimal bedrock*, not broader conformity.

  **Analysis of Conflicts & Tensions:**

  1.  **Selectivity (4) vs. Coherence Demand (Preference):**
      *   **Conflict:** Rigorous selectivity inherently fragments the data. Applying multiple stringent criteria leaves isolated units. Forcing these into a "coherent figure" *requires* significant interpretive construction, risking the importation of inauthentic links or the suppression of authentic but anomalous material to fit the desired coherence. Selectivity works against narrative coherence.
      *   **Impact:** This tension highlights that the "historical Jesus" is a scholarly *reconstruction* built on fragments, not a recovered, coherent biography. The demand for coherence as a *methodological requirement* is misplaced and undermines selectivity. Coherence is an interpretive goal, not a criterion for authenticity.

  2.  **Non-Circularity (5) vs. Defining Criteria by Contrast (e.g., Dissimilarity):**
      *   **Conflict:** Criteria like dissimilarity (from Judaism or the Church) or embarrassment *define* authenticity by contrast with known contexts. But *applying* these criteria effectively often requires significant prior understanding of 1st-century Judaism and early Christianity to recognize what actually *is* dissimilar or embarrassing. You need to know the "background" and "development" to spot discontinuity. However, defining Jesus *primarily* by discontinuity risks presupposing his uniqueness/radical nature – a key element of "who he was."
      *   **Impact:** This creates a hermeneutical circle. Some prior knowledge of context is essential (Desideratum 1, 3), but criteria relying *heavily* on contrast threaten to build Jesus's identity *solely* on difference, which may be an artifact of the method. The criteria must be used cautiously, with awareness of the background, and never in isolation. They risk creating a Jesus defined *only* by his differences.

  **The Calibration Requirement (6)** is crucial because it exposes a fatal flaw in many popular criteria. How often is the Criterion of Embarrassment tested against *later* embarrassing church traditions? How does Dissimilarity fare against material known to be late but *also* dissimilar? Without this test, we don't know if the criterion *works*.

  **The Single Requirement Eliminating the Most Criteria: Calibration (6).**

  *   **Effect:** Enforcing rigorous calibration against known late/secondary material would likely invalidate or severely weaken the *practical application* of most standard criteria:
      *   **Dissimilarity:** Would it consistently reject late Gnostic or apocryphal material that is also dissimilar to Judaism *and* mainstream Christianity? Often not, as such material thrives on uniqueness.
      *   **Embarrassment:** Would it reliably reject later traditions embarrassing to *different* church factions (e.g., certain apocryphal acts, theological disputes)? Its effectiveness here is untested and doubtful.
      *   **Multiple Attestation:** Easily "authenticates" late material if it appears in multiple late/apocryphal sources.
      *   **Coherence:** Readily incorporates late material that coheres with a developing tradition.
      *   **Semitic Flavor/Aramaisms:** Can be (and were) easily fabricated by later authors.
  *   **What Might Remain?**
      *   **Contextual Plausibility (in 1st Century Jewish Palestine):** Potentially calibratable against known anachronisms or material clearly set in wrong contexts. However, it's broad and often used negatively.
      *   **Crucifixion Consequences:** Material explaining *why* Jesus was crucified (e.g., conflict with authorities, temple action, royal claims) has strong inherent plausibility linked to the bedrock fact of crucifixion. Can be calibrated against material clearly *incompatible* with causing Roman execution.
      *   **A severely chastened Coherence:** Only applicable *after* other criteria (including calibration) have been applied, as a weak check on plausibility of the reconstructed fragments, not as a primary authenticator.

  **Conclusion on the Project:** The conflicts and the devastating impact of enforcing calibration reveal the profound fragility of the criteria-based approach. Selectivity and avoiding circularity are essential but clash with the desire for a coherent portrait and are difficult to achieve without prior assumptions. More importantly, the widespread failure of criteria to meet the calibration requirement suggests they often lack genuine discriminating power against the actual noise in the tradition. The criteria project, as traditionally conceived, struggles to deliver its promise of objectively settling "who Jesus was." It remains a necessary heuristic toolkit for sifting material, but one whose results are always provisional, fragmentary, and heavily dependent on the historian's critical judgment and understanding of context, rather than producing definitive answers through mechanistic application. The focus may need to shift towards plausibility arguments within the 1st-century context and understanding the tradition's development, using the criteria cautiously as *indicators* rather than arbiters.
