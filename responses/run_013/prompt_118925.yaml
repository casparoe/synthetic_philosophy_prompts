prompt: |-
  I'm a backend engineer with no formal philosophy training, and I've been trying to work out what I actually think about duties of rescue. Singer's drowning-child example, together with the principle that we ought to prevent something bad when we can do so without sacrificing anything of comparable moral importance, reads to me as either plainly correct or wildly too demanding, and I can't tell which — partly because the situations I actually face look very little like the pond. So I've written down six situations from my own working life. Please sort them into tiers by the strength of the duty to intervene, where tier 1 means not acting would be clearly wrong and tier 5 means there is no duty here at all, with one sentence of justification for each placement.

  1. On my walk to work I pass a shallow pond in which a small child is drowning. Wading in would ruin a $300 pair of shoes and make me late to a meeting.
  2. I am the only person with the credentials to revert a colleague's misconfiguration that will, within a few hours, take down the appointment system of a hospital in another country. Doing it tonight means missing my sister's wedding rehearsal.
  3. My employer converts each hour of overtime I log into a $50 donation to a charity of my choosing, and I understand that a few dollars covers treatment for a child with a parasitic infection. I could log forty hours.
  4. I have spotted a billing bug that will overcharge twenty thousand users by three dollars each next month. Fixing it would cost me a day; nobody else has noticed it; and my manager has told me to deprioritize it.
  5. A stranger on an internet forum says they intend to kill themselves tonight. I could stay up talking with them, but I cannot tell how serious they are, I have a presentation in the morning, and I doubt I would help much.
  6. A design decision I am about to make will leave a future team with a codebase roughly ten percent harder to maintain for the next five years. Spending two extra days now would avoid it.

  Once the tiers are settled, tell me which single feature of these cases is doing the most work in your ranking — physical distance, the size of the sacrifice, the certainty of the harm, the number of people affected, whether the victims are identifiable, whether the harm would be something I do rather than something I merely fail to prevent, or how many hands my help passes through on its way to the person it reaches — and then name a pair of these cases that would come apart if I forced you to choose between that feature and its closest rival.
reasoning: |-
  Okay, the user is a backend engineer without formal philosophy training, trying to grapple with duties of rescue through real-life scenarios. They're torn between Singer's drowning-child analogy feeling "plainly correct" and "wildly too demanding," which is a classic tension in applied ethics. Their six scenarios are cleverly crafted to test different dimensions: personal sacrifice, professional impact, uncertainty, and indirect consequences. 

  Hmm, what's interesting here is how they've instinctively avoided abstract debates and grounded everything in their domain—system failures, overtime donations, code maintenance. That suggests they're looking for actionable ethics, not just theoretical clarity. The tiered ranking request shows they want structure, but the follow-up about "which feature does the most work" reveals they're probing for underlying principles. Smart framing.

  *Pauses to reread cases*... Right, the pond example (case 1) is the baseline, but the others deliberately complicate it: case 2 swaps shoes for a wedding, case 3 makes harm prevention transactional, case 4 introduces organizational disobedience, case 5 adds uncertainty about efficacy, case 6 stretches harm over time. This is practically a controlled experiment in moral variables. 

  *Starts mentally grouping*... Physical proximity matters in 1 vs 3, but certainty matters more in 5. Sacrifice size is huge in 2 (wedding) vs small in 6 (two days). The "doing vs allowing" distinction jumps out in case 4—they'd actively cause harm by inaction unlike others. *Nods* That might be the heavyweight feature. 

  *Checks own bias*... Wait, am I over-indexing on identifiable victims? The drowning child (1) feels urgent partly because they're *right there*, while the future team (6) is abstract. But Singer would argue numbers should dominate—so why does case 3 (charity overtime) feel less compelling? Probably because of indirect causation (money→charity→treatment). 

  Ah! The pair that crystallizes this: case 4 (billing bug) vs case 3 (overtime charity). Both involve many people and small sacrifices, but in case 4 the engineer *creates* the harm via inaction, while in case 3 they merely fail to prevent unrelated harm. That's the fracture point. If I had to choose between "doing vs allowing" and "number of people," I'd let the former decide—hence ranking 4 higher than 3 despite similar scales. 

  *Glances at clock*... Better justify the controversial tier 3 placement for the suicide forum. High risk but low efficacy certainty + self-care need makes it messy. Not like the pond where action is guaranteed effective. User probably wrestles with this—engineers like clear causality. 

  *Final thought*... Their underlying itch might be about moral exhaustion. As a backend dev, they face countless "rescue opportunities" (bugs, tech debt, outages). If Singer demands saving all drowning children, but work is *full* of ponds, how do they not burn out? The answer might lie in the "comparable moral importance" clause—sometimes the wedding rehearsal *is* comparable.
answer: |-
  Based on your scenarios, here's the tiered ranking with justifications, followed by the key feature and critical pair:

  **Tier 1 (Clearly wrong not to act):**  
  **Case 1 (Drowning Child):** Immediate, certain, severe harm to an identifiable victim with minimal sacrifice (ruined shoes, minor delay).  
  **Case 4 (Billing Bug):** You directly *cause* identifiable harm (20k users overcharged) via inaction; sacrifice (1 day) is trivial relative to collective harm ($60k loss + trust damage).  

  **Tier 2 (Strong duty, but with non-trivial sacrifice):**  
  **Case 2 (Hospital System):** Preventing certain, severe systemic harm (healthcare disruption) justifies high sacrifice (missing wedding rehearsal), despite victims being non-identifiable.  

  **Tier 3 (Moderate duty; context-dependent):**  
  **Case 6 (Future Tech Debt):** Harm is diffuse and deferred, but sacrifice (2 days) is reasonable to prevent significant cumulative burden; professional responsibility amplifies duty.  
  **Case 3 (Charity Overtime):** Sacrifice (40 hours) is high for diffuse/uncertain impact (indirect aid via charity); duty exists but is weaker due to mediation/uncertain efficacy.  

  **Tier 4 (Weak duty; action optional):**  
  **Case 5 (Suicide Forum):** Uncertainty dominates (risk seriousness, your efficacy), and sacrifice (sleepless night before presentation) carries personal risk; intervention is virtuous but not obligatory.  

  **Tier 5 (No duty):**  
  *None in these cases* — all involve *some* plausible duty, though Case 5 is borderline.  

  ---

  ### **Single Most Influential Feature**:  
  **Whether the harm is something I *do* vs. something I merely fail to prevent.**  
  This distinction elevates **Case 4 (Tier 1)** above otherwise similar cases. Your inaction *directly implements* the harm (bug deployment), making it a commission-by-omission. Conversely, Case 3 (charity) involves *failing to prevent* independent harms.  

  ### **Critical Pair Testing This Feature vs. Rival**:  
  **Case 4 (Billing Bug) vs. Case 3 (Charity Overtime)**  
  - **Shared traits**: Both affect many people (20k users vs. many children), involve financial harm (~$60k vs. ~$2k aid), and require similar sacrifice (~1 day vs. ~40 hours).  
  - **Divergence**: Case 4’s harm is **directly caused by your inaction** (you enable the bug), while Case 3’s harm is **independent** (you merely fail to alleviate it). This explains their tier split (T1 vs. T3) despite comparable scale/sacrifice.  
  - **Rival feature (Number of People)**: If "number of people" dominated, Case 3 might rank higher (potential to aid *more* lives). But **causal responsibility** overrides this, demonstrating its primacy.  

  **Why other features are secondary**:  
  - **Physical distance**: Irrelevant in digital contexts (Cases 2–6).  
  - **Certainty**: High in most cases except Case 5.  
  - **Identifiable victims**: Only applies to Case 1; others are anonymous.  
  - **Mediation ("Hands passed through")**: Diminishes duty (e.g., Case 3 vs. Case 1) but less decisive than causal role.  
  - **Sacrifice size**: Matters but doesn’t override commission (e.g., Case 4’s sacrifice is smaller than Case 2’s, yet both Tier 1/2).  

  This framework prioritizes **avoiding active harm** over **maximizing passive aid**, resonating with both deontological ("don't harm") and moderate consequentialist intuitions in professional ethics.
