  Hey, I need a hand with some grading. I'm a software engineer, I've never taken a philosophy class in my life, and somehow I've ended up as the marker for the epistemology unit of an interdisciplinary masters course my department co-runs. I've got the question and one student's answer below.

  Can you give me a mark out of 20, and then a point-by-point breakdown, section by section, of where the marks were won and lost, so I can paste the comments straight back to the student? I need specifics — point at the actual sentences that are right or wrong and say why — not a general impression like "shows a good grasp of the material." The course is in the UK and the student is British, so please write the feedback in British English. And if something the student says is off, tell me plainly what the correct statement would be, because I genuinely can't tell which parts are off, that's why I'm asking.

  The question was worth 20 marks total: 8 for part (a), 6 for each of the two cases in parts (b) and (c). It was written in a 40-minute in-class slot with no notes, so the prose is rough in places; mark it on the content, not the style.

  --- QUESTION ---

  Contextualism and pragmatic encroachment are often treated as two versions of one idea. (a) State what each view holds, and be explicit about which of the following each one makes the locus of practical sensitivity: the subject's own situation, the attributor's conversational context, or the meaning of the word "knows." (b) For each case below, say what each view predicts about the truth of the knowledge attribution given in bold. (c) Say which cases, if any, pull the two views apart, and explain why.

  Case A. Priya is a hospital pharmacist deciding whether the drug in the tray is the one on the label. If she gets it wrong, a patient dies. Her evidence is decent but not conclusive: the packaging matches and the tray was sealed, but there was a mix-up on the ward earlier that week. A visitor standing in the doorway, with nothing riding on the outcome, says: **Priya knows which drug it is.**

  Case B. Tom is waiting for a bus and idly wonders whether the corner shop is still open. He saw the lights on five minutes ago and says he knows it is. The person he is talking to has a large bet riding on whether the shop is open, and says: **Tom doesn't know the shop is open.**

  Assume in each case that the attributor knows as much about the situation as the subject does, and that the attributor's conversational context matches the stakes described.

  --- STUDENT'S ANSWER ---

  Both views start from the same intuition: that a person's evidence and what they can be said to know come apart once you bring in the practical side of things.

  Contextualism is a thesis about the word "knows." On this view, a sentence such as "Priya knows which drug it is" has different truth conditions depending on the context of the person uttering it. When error matters to the speaker, the standard that "knows" picks out goes up, and evidence that sufficed a moment ago no longer suffices. Knowledge itself doesn't change; only what our words demand of it does.

  Pragmatic encroachment is a thesis about the knowledge relation rather than about the word. The practical interests in play don't merely shift the meaning of "knows," they shift whether the subject actually knows. Whether Priya's true belief amounts to knowledge depends on what is riding on it for her, so two people with the same evidence can differ in what they know if their situations differ.

  Case A. The visitor has nothing at stake, so on contextualism the conversational standard is low and "Priya knows which drug it is" is true. On encroachment, Priya's own situation is high-stakes, which raises the bar for her, so the attribution is false. This case separates the two views.

  Case B. Here the stakes are high in the conversation, and since the practical factor that does the work on both views is the one in the conversation, "Tom doesn't know the shop is open" comes out true either way. So this case doesn't separate them: the two views agree on the verdict and differ only over whether we describe the shift as a change in the word or a change in the knowledge.

  One further consequence: on contextualism, whether it is reasonable for Priya to act on her belief depends on who is speaking. In the visitor's mouth the standard is low enough that acting on her evidence would be reasonable, whereas in a conversation with the patient's relative it would not be. That is the practical payoff of treating knowledge attributions as context-sensitive.

  --- END ---

  Thanks, and please definately tell me if there's a mistake I'd have missed, because the answer sounds pretty confident to me and I'd probably have given it alot of marks.
