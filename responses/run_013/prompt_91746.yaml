  - The student lost marks *only* in Case B due to misattributing stakes in pragmatic encroachment.  
  - Their answer *sounds* confident because they grasp the big picture but slipped on case-specific application.  
  - British English phrasing maintained (e.g., "standard that 'knows' picks out," "practical payoff," "conversational context").  
