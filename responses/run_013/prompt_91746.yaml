  ### Overall Mark: 17/20  
  *(8/8 for part (a), 6/6 for Case A, 3/6 for Case B)*  

  **Feedback to Student (British English):**  
  Overall, a strong answer demonstrating clear understanding of the core distinction between contextualism and pragmatic encroachment. Your analysis of Case A is excellent, but Case B contains a significant error affecting the separation claim. Below is a point-by-point breakdown.  

  ---

  **Part (a) (8/8 marks)**  
  **Strengths:**  
  - **Contextualism**: Perfectly captured. You correctly state it concerns the *word "knows"* and locates practical sensitivity in **"the attributor's conversational context"**:  
    > *"Contextualism is a thesis about the word 'knows'... truth conditions depend on the context of the person uttering it."*  
    > *"When error matters to the speaker, the standard that 'knows' picks out goes up."*  
    This is textbook contextualism: the *attributor’s* stakes shift semantic standards.  

  - **Pragmatic Encroachment**: Correctly distinguished. You accurately locate sensitivity in **"the subject's own situation"**:  
    > *"Pragmatic encroachment is a thesis about the knowledge relation... Whether Priya's true belief amounts to knowledge depends on what is riding on it for her."*  
    Spot-on: practical factors directly alter whether *the subject* possesses knowledge, not just word meaning.  

  **No deductions**: Full clarity on loci ("attributor's context" for contextualism, "subject's situation" for encroachment) and core theses.  

  ---

  **Case A (6/6 marks)**  
  **Strengths:**  
  - **Contextualism**: Correct prediction that **"Priya knows" is TRUE**:  
    > *"The visitor has nothing at stake... conversational standard is low and 'Priya knows' is true."*  
    Right – the *attributor* (visitor) has low stakes, so "knows" demands less evidence.  

  - **Pragmatic Encroachment**: Correct prediction that **"Priya knows" is FALSE**:  
    > *"Priya's own situation is high-stakes... raises the bar for her, so the attribution is false."*  
    Correct – *Priya’s* high stakes mean her evidence is insufficient for knowledge.  

  - **Separation**: Correctly identifies this case **"separates the two views"** as they yield opposite verdicts.  

  ---

  **Case B (3/6 marks)**  
  **Strengths:**  
  - **Contextualism**: Correct prediction that **"Tom doesn't know" is TRUE**:  
    > *"The stakes are high in the conversation... 'Tom doesn't know' comes out true."*  
    Yes – the *attributor* has high stakes, so "knows" demands stronger evidence than Tom possesses.  

  **Errors & Corrections:**  
  - **Pragmatic Encroachment**: Incorrect prediction. You claim **"Tom doesn't know" is TRUE** for both views. **This is wrong for pragmatic encroachment.**  
    > *"On encroachment, Priya's own situation is high-stakes... raises the bar for her."* [Correct in Case A, but misapplied here].  
    **Correction**: For pragmatic encroachment, *only the subject’s stakes matter*. Here, **Tom** (the subject) has *low stakes* (idly wondering). Thus:  
    - Tom’s evidence (lights on 5 mins ago) *is* sufficient for knowledge *given his low stakes*.  
    - Pragmatic encroachment predicts **"Tom doesn't know" is FALSE**.  
    *Why?* Encroachment ties knowledge to the *subject’s* practical context, not the attributor’s.  

  - **Separation Claim**: Incorrectly states **"this case doesn't separate them"**.  
    **Correction**: Case B *does* separate the views:  
    - Contextualism: "Tom doesn't know" = **TRUE** (attributor’s high stakes raise the standard).  
    - Pragmatic Encroachment: "Tom doesn't know" = **FALSE** (Tom’s low stakes mean he knows).  
    *Why?* They yield **opposite verdicts** (like Case A), but here contextualism denies knowledge while encroachment affirms it.  

  **Mark Lost**: -3 for misapplying encroachment (core error) and missing the separation.  

  ---

  **Additional Comment**  
  Your closing paragraph on contextualism’s implications for reasonable action is accurate but **irrelevant to the question** (not penalised, but not credited). Stick to the query’s explicit requirements.  

  **Key Takeaway**: You excelled on core definitions and Case A. For Case B, remember pragmatic encroachment is **subject-centric**. The attributor’s stakes only matter for *contextualism*. Revise this distinction to avoid conflating the views’ loci.  

