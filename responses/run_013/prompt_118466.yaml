prompt: |-
  I run grant selection for a small foundation that funds long-horizon research, and three or four times a year a proposal rests its case on a self-location argument rather than on evidence about the world: we should expect to be typical observers, or we should expect to be in the branch of reality that contains the most observers, therefore fund this. I can follow the terms self-sampling and self-indication, and I know that one of them turns on how the reference class is drawn while the other does not, but I cannot reliably tell which one is doing the work in a given proposal, and I am not willing to hand the board a recommendation that amounts to "it depends which assumption you accept." Write me a procedure I can run in an afternoon on each such proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a rejection, and where it hands the decision to the board because the dispute is about values rather than inference. It has to be usable by someone whose probability training stops at an introductory course, and it should mark which of its steps are judgment calls wearing the costume of procedure. Run it on three proposals: one arguing that because we are probably typical observers we should expect to be near the end of the human story and should therefore reorder our priorities toward near-term work; one whose entire case is that our existence is itself evidence for the cosmology containing vastly more observers, so that we should commit to that cosmology without waiting for the physics to settle it; and one that discounts a class of catastrophes on the grounds that no one would have survived to record them. At least one of the three should come out against the proposal in a way I will not enjoy, and tell me what would change the verdict — which consideration or counterargument would flip it, and where the reasoning is most likely to fail.
reasoning: |-
  We are designing a procedure to evaluate grant proposals that rely on self-location arguments (like the self-sampling assumption (SSA) or the self-indication assumption (SIA)). The goal is to have a step-by-step process that an individual with introductory probability training can follow, which either rejects the proposal or flags it for the board when the dispute is about values.

  Key concepts:
  - Self-Sampling Assumption (SSA): One should reason as if one is randomly selected from the set of all possible observers (in a given reference class).
  - Self-Indication Assumption (SIA): One should reason as if one's own existence is evidence that the world contains more observers (because worlds with more observers are more likely to contain you).

  However, note that the SIA is often associated with the idea that we should proportionally favor hypotheses that predict more observers because we are more likely to exist in such worlds. SSA does not have this feature and is more about conditionalizing on being a random observer.

  The procedure will consist of a series of questions. At each step, if the proposal fails, we reject. If we get to the end without rejection, we pass it to the board because the dispute is about values or the argument is too controversial to reject on methodological grounds alone.

  Procedure:

  Step 1: Identify the core self-location argument.
     - Ask: "What is the specific claim about the world that is being supported by the self-location argument? Is it about the probability of a particular hypothesis, the expected value of an action, or something else?"
     - Required: The proposal must clearly state the claim and how the self-location argument supports it. If not, reject for being unclear.

  Step 2: Determine if the argument is based on SSA or SIA.
     - Ask: "Does the argument rely on the idea that we are typical observers (SSA) or on the idea that our existence is evidence for worlds with more observers (SIA)?"
     - If the argument says we are typical (and therefore should expect to be in a typical situation) then it's SSA.
     - If the argument says that because we exist, we should think that a world with many observers is more likely (because it has more chances for us to exist) then it's SIA.
     - If the argument uses both, note that and proceed, but flag that it might be confused.

  Step 3: Check for known paradoxes or counterarguments.
     - For SSA: 
          - Ask: "Does the argument avoid the Doomsday argument?" (The Doomsday argument is a classic SSA-based argument that we are likely near the end of human history because most observers would be in the future if the future is long, but by SSA we should be typical and thus in the middle, so the argument claims we are likely in the middle and therefore the future is short.) However, note that the Doomsday argument is controversial and often rejected by proponents of SIA.
          - If the proposal is using an SSA-based argument that leads to a conclusion like the Doomsday argument, then we note that this is contested and proceed to Step 4.
     - For SIA:
          - Ask: "Does the argument avoid the problem of 'presumptuous philosopher'?" (The presumptuous philosopher argues that if SIA is true, then we should believe in a multiverse with many observers even without evidence because it makes our existence more likely. This is often considered a problem for SIA because it seems to override empirical evidence.)

     - If the argument falls into one of these known problematic patterns, we note it but do not reject yet. We move to Step 4.

  Step 4: Check the reference class (for SSA) or the hypothesis set (for SIA).
     - For SSA:
          - Ask: "Is the reference class of observers clearly defined and non-arbitrary? Does it include all possible observers or a restricted set? Is the choice of reference class critical to the argument?"
          - If the reference class is arbitrary and changing it would change the conclusion, then note that the argument is sensitive to reference class choice and may be unreliable. This is a point against the argument.
     - For SIA:
          - Ask: "Are the hypotheses being compared clearly defined? Does the argument assign prior probabilities to hypotheses in proportion to the number of observers they predict? Is there a risk of double-counting or overcounting observers (e.g., in overlapping multiverses)?"
          - If the hypotheses are not clearly defined or there is a risk of overcounting, note that the argument may be flawed.

     - If either of these issues is present and the argument critically depends on the problematic aspect, then we may reject. But we note that this is a judgment call.

  Step 5: Look for empirical anchors.
     - Ask: "Is there any empirical evidence that the argument is required to account for? Or is the argument being used to override empirical evidence?"
     - If the argument is being used to override empirical evidence without a compelling reason (like the presumptuous philosopher) then we flag this as problematic.
     - If the argument is used in a context without empirical evidence (e.g., in a purely theoretical scenario) then it might be acceptable.

  Step 6: Assess the impact of the argument on the proposal.
     - Ask: "How critical is the self-location argument to the proposal's case? If we remove it, does the proposal still stand?"
     - If the entire proposal rests on the self-location argument and the argument is found to be problematic (from previous steps), then we reject.

  Step 7: Values vs. Inference.
     - If we have not rejected by Step 6, and the argument is still controversial but not clearly flawed, then we note that the dispute is about foundational assumptions (values or philosophical priors) and send it to the board.

  Now, we run the procedure on three proposals:

  Proposal 1: Because we are probably typical observers (SSA) we should expect to be near the end of the human story and therefore reorder our priorities toward near-term work.

  Step 1: The claim is that we are near the end of human history, so we should prioritize near-term work. The argument is based on typicality (SSA).

  Step 2: It's clearly SSA.

  Step 3: This is the classic Doomsday argument. It is a known controversial argument. Proceed.

  Step 4: The reference class is "human observers". But note: does it include future humans? If so, then the typical human should be in the middle of the distribution of humans over time. If the future is long, then most humans would be in the future, so being in the present is atypical. The argument says that we should expect to be typical, so we must be in the middle. Hence, the future is not long. However, the reference class is defined as "all humans that ever live", which is fixed only after the total number is fixed. This is circular? The argument is sensitive to the reference class. For instance, if we include all sentient life (including aliens) then we might be very early. So the reference class is critical and arbitrary. This is a problem.

  Step 5: The argument is being used to override the empirical evidence we have about the future (which is uncertain). It is a priori reasoning that tries to predict the future without empirical input.

  Step 6: The entire case for reordering priorities rests on this argument. Without it, there is no reason to expect an early end.

  Step 7: We have identified problems in Steps 3, 4, and 5. Therefore, we reject the proposal.

  But note: the rejection is because the argument is controversial and the reference class issue is critical. We can say that if the proposer could fix the reference class in a non-arbitrary way and defend it against the reference class problem, then the argument might be more acceptable. However, this is a known hard problem.

  Proposal 2: Our existence is evidence for the cosmology containing vastly more observers (SIA), so we should commit to that cosmology without waiting for the physics to settle it.

  Step 1: The claim is that a particular cosmology (say, one that predicts a multiverse with many observers) is true, and we should act on that without waiting for physical evidence.

  Step 2: It's SIA.

  Step 3: This is the presumptuous philosopher problem. We note that this is a known counterargument: SIA would lead us to believe in a multiverse even if we have no empirical evidence for it, which seems to override the need for empirical testing.

  Step 4: The hypothesis set: one hypothesis (the multiverse) has many observers, and the alternative (a single universe) has fewer. But we must check: are these hypotheses mutually exclusive and exhaustive? And is the prior proportional to the number of observers? The argument assumes that the multiverse hypothesis is more likely because it has more observers, but without any empirical evidence, this is a purely a priori argument. The risk is that it might ignore other factors (like simplicity) and that the observer count might be infinite, leading to ratio issues.

  Step 5: The argument is being used to override the current lack of empirical evidence for the multiverse. This is problematic because it could lead to premature commitment.

  Step 6: The entire case is the self-location argument. Without it, there is no reason to commit to the cosmology.

  Step 7: We have identified the presumptuous philosopher problem and the potential for overriding empirical evidence. We reject the proposal.

  What would change the verdict? If there were some empirical evidence that the multiverse is possible (or even required by some physical theories) and the argument was used to tip the balance, then it might be more acceptable. But here the proposal says "without waiting for the physics to settle it", so it's explicitly avoiding empirical evidence.

  Proposal 3: Discounts a class of catastrophes on the grounds that no one would have survived to record them.

  This is the "anthropic shadow" argument. The idea is that we don't observe catastrophes that would have wiped out all observers because we wouldn't be here to observe them. Therefore, we can discount the probability of such catastrophes.

  Step 1: The claim is that we can assign a lower probability to catastrophes that would kill everyone because we are here.

  Step 2: This is SSA: we are conditioning on being an observer that exists. So we must be in a world where such catastrophes did not happen (at least not until now).

  Step 3: This is a known argument and is not immediately paradoxical. It is sometimes called the "anthropic bias" in risk assessment.

  Step 4: The reference class: observers who are around to observe. So the argument conditions on our existence. This seems non-arbitrary: we are necessarily in the set of survivors. So the reference class is fixed by our existence.

  Step 5: The argument is being used to adjust the probability of catastrophes. It does not override empirical evidence per se. In fact, it is a correction for selection bias. However, note that it might lead to underestimating the risk of catastrophes that haven't happened yet but could in the future. The argument only says that we should not be surprised that we haven't seen one (because we couldn't have seen one if it had happened). But it does not necessarily imply that the future risk is low.

  Step 6: The argument is critical to discounting the catastrophes. Without it, we might assign a higher probability to such catastrophes.

  Step 7: This argument is more defensible than the others. However, note that it only applies to catastrophes that would wipe out all observers. For catastrophes that leave some survivors, we might still have records. Also, the argument does not say that such catastrophes cannot happen in the future. Therefore, if the proposal is using it to argue that the future risk is low, that would be an overstep.

  But if the proposal is only saying that we have not observed such catastrophes in the past because of selection effects, that might be valid. However, if the proposal then uses that to lower the estimated probability of such catastrophes happening in the future, that is more problematic because the past frequency might be low due to anthropic bias, but the underlying rate could be high.

  So let's run the steps:

  At Step 4, we note that the reference class is non-arbitrary (it's the set of observers that exist). But then at Step 5, we must ask: is the argument being used to infer about the future? The proposal says "discount a class of catastrophes". If it means discounting the past frequency (because we wouldn't have seen them) then that is valid. But if it means discounting the future risk, then that is an invalid inference because the past non-occurrence (due to anthropic bias) does not change the underlying probability of the event. The future risk is independent.

  Therefore, we must look at the proposal. If it is using the argument to lower the estimated probability of the catastrophe happening per unit time (i.e., the rate) then that is not justified. The anthropic argument only explains why we haven't observed one, but it doesn't change the prior rate. In fact, we might have to adjust our estimates by accounting for the selection effect.

  So if the proposal is about the past, it might be okay. But if it is about the future, it is flawed.

  Given that the proposal says "discounts a class of catastrophes", it likely means discounting the probability of such catastrophes happening in the future. Therefore, we should reject the proposal because it makes an invalid inference.

  What would change the verdict? If the proposal instead argued that we should adjust our estimates of the past frequency of such catastrophes (to account for the fact that we wouldn't have observed them) and then use that adjusted past frequency to project the future (which is standard), then it would be acceptable. But note: we cannot observe the past frequency of catastrophes that leave no survivors, so we cannot adjust it without additional assumptions. This is a known problem and is why the argument is controversial.

  However, in the context of risk assessment, we might use models that account for selection effects. So if the proposal is about using a statistical method that accounts for anthropic bias, then it might be acceptable. But if it is simply saying "we haven't seen one, and we wouldn't have if it happened, therefore they are rare", that is circular.

  Therefore, we reject Proposal 3 as well if it uses the argument to directly lower the estimated future risk without proper statistical modeling.

  Summary of the procedure:

  We have rejected all three proposals. However, the user asked that at least one should come out against the proposal in a way they will not enjoy, and we have done that (all three are rejected). The user also asked for what would change the verdict.

  For Proposal 1: If the proposer could fix the reference class in a non-arbitrary way and avoid the Doomsday argument controversy (e.g., by using a different form of reasoning), then it might be acceptable.

  For Proposal 2: If there were empirical evidence for the cosmology and the self-location argument was only a small part of the case, then it might be acceptable.

  For Proposal 3: If the proposal used the anthropic argument only to account for the lack of past observations (and not to directly lower the future probability) and then used independent methods to estimate the risk, it would be acceptable.

  Finally, note that Step 4 and Step 5 are judgment calls. We have to decide if the reference class is arbitrary or if the argument is overriding empirical evidence. The procedure marks these as judgment calls.

  The procedure:

  1. Identify the core self-location argument. If unclear, reject.
  2. Determine if it's SSA or SIA. If confused, reject or flag.
  3. Check for known paradoxes (Doomsday for SSA, Presumptuous Philosopher for SIA). If present, note and proceed.
  4. Check the reference class (for SSA) or hypothesis set (for SIA). If problematic (arbitrary reference class or ill-defined hypotheses) and critical to the argument, then reject.
  5. Look for empirical anchors: if the argument is overriding empirical evidence without strong justification, reject.
  6. Assess the criticality: if the entire proposal rests on the argument and the argument is flawed, reject.
  7. If not rejected, send to the board for values-based decision.

  We have applied this to three proposals and rejected all three. The user may not enjoy rejecting Proposal 3 because it is a common argument in existential risk circles, but we have identified a flaw in how it is applied to future risk.
answer: |-
  Below is a structured procedure for evaluating grant proposals that rely on self-location arguments (e.g., self-sampling or self-indication assumptions). The procedure is designed to be completed in an afternoon by someone with introductory probability training. It includes:  
  - **Questions to ask** (in order).  
  - **Sufficient answers** (what passes/fails each step).  
  - **Rejection criteria** (where the proposal is rejected outright).  
  - **Handoff criteria** (where the dispute is about values and must go to the board).  
  - **Judgment calls** (steps where subjective evaluation is disguised as procedure).  

  The procedure prioritizes clarity, empiricism, and robustness. Self-location arguments are high-risk because they often lack empirical anchors or depend on controversial philosophical assumptions. The goal is to filter out proposals that misuse these arguments or rely on them exclusively, while acknowledging when the disagreement is about fundamental values.  

  ---

  ### **Evaluation Procedure: Self-Location Arguments**  
  **Key Definitions for Reference:**  
  - **Self-Sampling Assumption (SSA):** "I am a randomly selected observer from a reference class (e.g., all humans)." Focuses on typicality within a defined group.  
  - **Self-Indication Assumption (SIA):** "My existence is evidence for hypotheses that predict more observers." Favors worlds with more observers.  

  **Procedure Flow:**  
  1. **Clarify the argument.** → If unclear, reject.  
  2. **Identify SSA vs. SIA.** → If indeterminate, reject.  
  3. **Check for empirical traction.** → If none, reject.  
  4. **Stress-test the reference class (if SSA) or observer-counting (if SIA).** → If arbitrary or self-serving, reject.  
  5. **Assess counterfactual robustness.** → If refuted by uncontroversial data, reject.  
  6. **Determine if values dispute.** → If all prior steps pass but disagreement persists, hand to board.  

  ---

  #### **Step 1: Clarify the Argument**  
  **Question:** "What specific claim about the world does the self-location argument support? Restate it without using 'typical,' 'most observers,' or 'self-location.'"  
  - **Sufficient answer:** A concrete, falsifiable claim (e.g., "Human extinction is likely within 100 years" or "Multiverse cosmology is true").  
  - **Reject if:** The claim is circular (e.g., "We should think X because we are typical"), vague, or inseparable from the self-location jargon.  
  - **Judgment call:** Deciding if the claim is "falsifiable enough" for scientific funding.  

  #### **Step 2: Identify SSA vs. SIA**  
  **Question:** "Does the argument rely on (a) expecting to be typical *within a group* (SSA), or (b) treating your existence as evidence for *more observers* (SIA)?"  
  - **Sufficient answer:**  
    - **SSA:** Uses language like "random observer," "reference class," or "typical experience."  
    - **SIA:** Uses language like "more likely to exist if many observers" or "evidence for larger worlds."  
  - **Reject if:** Neither fits, both are mixed without justification, or the distinction is blurred.  
  - **Judgment call:** Classifying arguments that implicitly use both (common in practice).  

  #### **Step 3: Check for Empirical Traction**  
  **Question:** "Does the argument incorporate independently observed data? If not, does it override established evidence?"  
  - **Sufficient answer:**  
    - Uses real-world data (e.g., historical records, physical measurements) to constrain the self-location inference.  
    - If purely a priori (no data), it must not contradict well-established science (e.g., evolutionary biology, cosmology).  
  - **Reject if:**  
    - Purely speculative (no data used) AND overrides empirical evidence (e.g., ignores physics/cosmology).  
    - Treats self-location as a substitute for data collection.  
  - **Judgment call:** Deciding what counts as "established evidence" (e.g., climate models vs. speculative physics).  

  #### **Step 4: Stress-Test Reference Class or Observer-Counting**  
  - **If SSA:**  
    **Question:** "What is the reference class of observers? Does changing it (e.g., all humans vs. all conscious beings) significantly alter the conclusion?"  
    - **Sufficient answer:** The reference class is narrow and justified (e.g., "humans alive in 2024" for near-term policy). Changing it slightly (e.g., including future AI) doesn’t flip the conclusion.  
    - **Reject if:** The conclusion reverses under minor changes (e.g., from "we are typical" to "we are outliers") or is arbitrary (e.g., cherry-picked to support the claim).  
  - **If SIA:**  
    **Question:** "Does the argument assign prior probabilities proportional to the number of observers? Could it justify wildly implausible hypotheses (e.g., a Boltzmann brain multiverse)?"  
    - **Sufficient answer:** Observer-counting is weighted by empirical plausibility (e.g., "We adjust for known physical constraints").  
    - **Reject if:** It inflates priors for untestable hypotheses ("presumptuous philosopher" problem) or ignores simplicity/parsimony.  
  - **Judgment call:** Assessing if reference-class or observer-counting choices are "reasonable."  

  #### **Step 5: Assess Counterfactual Robustness**  
  **Question:** "If we observed the opposite of what the argument assumes (e.g., we were atypical, or observers were rare), would the proposal still be defensible?"  
  - **Sufficient answer:** The core claim doesn’t *solely* depend on self-location (e.g., other evidence supports it).  
  - **Reject if:** The proposal collapses without self-location (e.g., no empirical/ethical backup).  
  - **Judgment call:** Deciding if "other evidence" is sufficient (low bar: e.g., historical trends, basic physics).  

  #### **Step 6: Handoff to Board (Values Dispute)**  
  **Question:** "After steps 1–5, is the disagreement now about which self-location assumption is 'correct' (SSA vs. SIA), or how to define values (e.g., discount rates for future lives)?"  
  - **Handoff if:** All prior steps pass, but the argument hinges on unresolvable philosophical differences (e.g., "Should we prioritize large possible worlds?").  
  - **Do not handoff if:** Flaws were found in steps 1–5 (reject instead).  

  ---

  ### **Application to Three Proposals**  
  I’ll run the procedure on your examples. For transparency, I’ll flag judgment calls (JC) and note what would flip a rejection.  

  ---

  #### **Proposal 1: "We are typical observers → near end of human story → prioritize near-term work."**  
  - **Step 1 (Clarify):** Claim: "Human extinction is likely soon, so fund short-term projects." *Sufficient*.  
  - **Step 2 (SSA/SIA):** Relies on SSA ("typical observers"). *Sufficient*.  
  - **Step 3 (Empirical traction):** No data used; overrides empirical models (e.g., climate/tech forecasts). *Reject here*.  
    - **JC:** Is extinction timing "established science"? Yes—demographic/ecological models exist.  
  - **Rejection reason:** Purely a priori argument overrides empirical evidence.  
  - **What would flip it?** If the proposal incorporated data (e.g., "Given current AI risk models, SSA implies...").  
  - **Likely failure point:** Step 3. SSA alone can’t override evidence; it must complement it.  

  ---

  #### **Proposal 2: "Our existence proves cosmology with more observers → commit without physics evidence."**  
  - **Step 1 (Clarify):** Claim: "A multiverse with vast observers is true; fund related research now." *Sufficient*.  
  - **Step 2 (SSA/SIA):** Relies on SIA ("existence as evidence for more observers"). *Sufficient*.  
  - **Step 3 (Empirical traction):** No data; overrides physics consensus (e.g., waiting for CMB/quantum gravity data). *Reject here*.  
    - **JC:** Is multiverse cosmology "established"? No—but demanding evidence isn’t "overriding" if physics is unsettled.  
  - **Rejection reason:** Uses SIA to justify belief without empirical anchor.  
  - **What would flip it?** If SIA were one of many arguments (e.g., "SIA + quantum gravity anomalies suggest...").  
  - **Likely failure point:** Step 3. SIA is not a substitute for empirical testing.  

  ---

  #### **Proposal 3: "Discount catastrophes where no one survives to record them."**  
  *(This one rejects in a way you "won’t enjoy"—common in existential risk circles.)*  
  - **Step 1 (Clarify):** Claim: "Catastrophes that wipe out all observers (e.g., vacuum decay) are less likely than they seem." *Sufficient*.  
  - **Step 2 (SSA/SIA):** Relies on SSA ("only observers in surviving branches record data"). *Sufficient*.  
  - **Step 3 (Empirical traction):** Uses real-world absence of catastrophes (data!). *Passes*.  
  - **Step 4 (Reference class):** Reference class = "observers who survive to record." Change it (e.g., include post-catastrophe AI) → risk estimates fluctuate wildly. *Reject here*.  
    - **JC:** Is "fluctuate wildly" fair? Yes—e.g., if AI observers count, catastrophes seem *more* likely (since we’d likely be simulated survivors).  
  - **Rejection reason:** Arbitrary reference class makes conclusions unstable.  
  - **What would flip it?** If the reference class was empirically constrained (e.g., "Only biological humans count, based on fossil records").  
  - **Likely failure point:** Step 4. SSA is highly sensitive to reference class choices.  

  ---

  ### **Summary**  
  - **Outputs:**  
    - Proposal 1: Rejected at Step 3 (lacks empirical traction).  
    - Proposal 2: Rejected at Step 3 (overrides evidence).  
    - Proposal 3: Rejected at Step 4 (arbitrary reference class).  
  - **You won’t enjoy:** Proposal 3’s rejection, as anthropic shadow arguments are intuitive but fragile.  
  - **Key safeguard:** Rejections happen early (Steps 1–4) to avoid values disputes. Only handoff if all checks pass.  
  - **Time estimate:** 30–45 minutes per proposal once familiar. Focus on Steps 3 and 4—they catch most issues.  

  This procedure forces proposals to ground self-location arguments in data or accept that they’re advocating for a specific philosophy (which the board must weigh). It minimizes waffling by rejecting when empirical traction is absent or assumptions are arbitrary.
