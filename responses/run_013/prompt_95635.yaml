  Okay, let me start by understanding what the user is asking. They've been involved in discussions on rationalist platforms like SSC and LessWrong, where the phrase "making up people" from Ian Hacking comes up in debates about psychiatric categories. Specifically, they want a clear breakdown of what this phrase could mean, ranging from trivial to radical interpretations, with assessments of each. They also want to know which interpretation is likely Hacking's, which one is commonly used to shut down discussions, and how it relates to the example about rising ADHD diagnoses.

  First, I recall Hacking's concepts. He talks about "making up people" where new classifications create new kinds of people, and the "looping effect" where the classification and the people classified interact, changing over time. The user mentioned that people often conflate these two. They also brought up the "interactive kinds" versus "indifferent kinds" distinction, where the latter don't change when classified, like in physics.

  The user encountered this in a thread about increasing ADHD numbers. One person used "making up people" to argue that questioning whether ADHD is really rising is confused, and another used it to validate self-diagnosis. The user wants clarity on the different claims this phrase makes, separating weak from strong interpretations, and which one actually supports the first person's argument.

  I need to outline the possible interpretations of "making up people." Starting from the least controversial to the most radical. The trivial end might be about definitions changing over time, which is straightforward. Then, moving towards how categories affect behavior and identity, leading to the idea that the category itself creates the phenomenon. The strongest claim would be that there's no underlying reality, only social construction.

  Each interpretation should be assessed for plausibility, whether it's what Hacking meant, and if it supports the conclusion that questioning rising ADHD rates is invalid. Also, note which engine (counting, medicalizing, etc.) is involved, as Hacking mentioned these as factors driving the looping effect.

  For example, the trivial claim that diagnostic criteria change is plausible and might explain some rise in ADHD cases, but it doesn't dissolve the question of real increase. The more radical claim that categories create reality might be what the first person in the thread used, but it's controversial and not necessarily Hacking's main point. Hacking focused on the dynamic interaction, not denying any underlying reality.

  I should also address which interpretation is commonly used to end threads—likely the strong constructivist one. The user wants to know if the engine matters; for ADHD, medicalizing and biologizing are key, which might stabilize the category but still involve looping effects.

  Structuring the response as a list with distinct claims, verdicts, and relevance to the ADHD example. Keeping it plain English, no jargon. Highlighting where conflation happens and how different interpretations lead to different conclusions. Making sure to separate the looping effect from the initial creation of categories, as Hacking did, but noting that people often blend them.
answer: |-
  Here's a breakdown of the distinct claims behind "making up people" (MUP) in the context of psychiatric categories, sorted from least to most radical, with verdicts on each. This addresses your ADHD example, separates heavy lifting from triviality, and identifies common usage:

  1.  **Claim: Diagnostic Categories & Criteria Change Over Time (The Trivial Claim)**
      *   **What it says:** The official definitions (DSM/ICD), diagnostic tools, clinical practices, and societal awareness surrounding a category like ADHD are not static. Changes *directly cause* changes in measured prevalence and who gets the label.
      *   **Plausibility:** **Highly Plausible.** Undeniable historical fact (e.g., ADHD criteria broadening, increased awareness, reduced stigma, different screening methods).
      *   **Hacking's Intent?** Part of the background, but not the core of MUP. More foundational to the *looping effect*.
      *   **Gets First Guy His Conclusion? (Invalidates asking if ADHD is *really* rising?)** **No.** This explains *why* numbers climb but doesn't dissolve the question. We *can* ask: *Given current definitions*, is the underlying phenomenon (whatever it is) actually becoming more common? Or is it purely definitional/awareness shift? This claim makes the question *harder* but not *invalid*.
      *   **Engine Relevance:** High. **Counting** (changing thresholds), **Medicalising** (applying the label to more behaviors), **Biologising/Geneticising** (shifting focus, potentially changing diagnostic weight).
      *   **Used to End Threads?** Sometimes, but usually as a starting point, not a conversation-ender. Weak for shutting down discussion.

  2.  **Claim: Categories Shape Identity & Behavior (Weak Looping)**
      *   **What it says:** Being diagnosed (or self-diagnosing) changes how a person sees themselves and behaves. They may adopt traits associated with the label, seek community, advocate for rights, or manage their lives differently *because* of the category. This can make the observed presentation of the category over time different from before the label existed or became widespread.
      *   **Plausibility:** **Highly Plausible.** Strong evidence from sociology, psychology, and lived experience (e.g., ADHD communities sharing coping strategies, shaping identity around neurodiversity).
      *   **Hacking's Intent?** This is **core to the Looping Effect.** It's the feedback mechanism: the classification changes the people classified, which in turn can change the classification.
      *   **Gets First Guy His Conclusion?** **No.** This explains *how* the category evolves and how its manifestation changes, making historical comparisons messy. It doesn't dissolve the question of whether the *core difficulties* the category attempts to capture are increasing in the population, even if their expression is shaped by the label.
      *   **Engine Relevance:** High. **Medicalising** (accessing treatment/identity), **Biologising/Geneticising** (influencing self-narrative). **Counting** enables the community formation.
      *   **Used to End Threads?** Occasionally. More sophisticated, but still allows for meaningful discussion about underlying realities and trends.

  3.  **Claim: Categories Create New Ways of Being (Strong MUP - Hacking's Core)**
      *   **What it says:** Before a category like ADHD was invented and disseminated, the specific *kind of person* defined by that label didn't exist in the same socially recognized and personally inhabited way. The category doesn't just describe pre-existing people; it *creates a new possibility space* for identity, experience, and interaction. People start to consciously understand and live their struggles/potentials *through this lens*.
      *   **Plausibility:** **Plausible with Nuance.** Hacking's key insight. Before the ADHD label, distractibility/hyperactivity existed but weren't integrated into a specific identity or managed via specific medical/social frameworks. The category provides new scripts for understanding oneself and being understood.
      *   **Hacking's Intent?** **Yes, this is the core of "Making Up People."** Creating new "human kinds" via classification systems. Contrasts with **"Indifferent Kinds"** (like quarks) which don't care how we classify them. Psychiatric kinds are **"Interactive Kinds"** because they interact with the classification.
      *   **Gets First Guy His Conclusion?** **Still No (on its own).** This says the *kind of person* defined by the full social/medical identity of "ADHD" is new. It doesn't directly say anything about whether the *underlying neurocognitive traits or functional difficulties* are new or increasing. The question "Are the traits/struggles captured by the *current concept* becoming more prevalent?" remains coherent, even if the *identity* is new.
      *   **Engine Relevance:** Critical. All engines (**Counting, Medicalising, Biologising, Geneticising**) contribute to establishing the category as a real social/medical force that defines a new way of being.
      *   **Used to End Threads?** More common. Can feel profound but often conflated with stronger claims below. Doesn't *quite* dissolve the "real rise" question.

  4.  **Claim: Categories Create the Phenomenon Itself (Radical Social Constructivism)**
      *   **What it says:** There is no underlying biological or psychological reality preceding the category. The difficulties, behaviors, and experiences classified as ADHD are *entirely products* of the social/medical invention of the category and the looping effect. The rise in numbers isn't measuring a real increase in anything; it's purely the expansion of the conceptual/social construct.
      *   **Plausibility:** **Highly Controversial & Likely Implausible for Core Dysfunction.** While presentation and identity are shaped (Claims 2 & 3), evidence strongly suggests underlying neurobiological differences correlating with ADHD traits that cause significant impairment *independent* of labeling. The category organizes and interprets, but likely doesn't *create* the core dysfunction ex nihilo.
      *   **Hacking's Intent?** **No.** Hacking explicitly rejected this strong constructivism for conditions like autism or schizophrenia. He argued that while the interactive kind is made up, there is *something* there to interact *with* – a "matrix" within which the looping occurs. He focused on the *interaction*, not pure invention.
      *   **Gets First Guy His Conclusion?** **Yes, but invalidly.** This *would* dissolve the question – if ADHD is purely a social construct, its "rise" is just the construct spreading. *But*, this claim is philosophically extreme and empirically weak for ADHD (strong genetic component, neurological correlates, cross-cultural prevalence of core symptoms even without the label).
      *   **Engine Relevance:** All engines are seen as purely constitutive, not responsive.
      *   **Used to End Threads?** **YES. This is the heavy lifter for thread-ending.** It's the "category error / dissolves the question" move. Often achieved by *conflating* Hacking's plausible Claim 3 (new *kind of person*) with this radical Claim 4 (no underlying reality).

  5.  **Claim: Validity via Construction (The Self-Diagnosis Move)**
      *   **What it says:** If the category is "made up," then its authority rests solely on social acceptance, not scientific validity. Therefore, self-diagnosis based on personal experience and identification with the category is just as legitimate as professional diagnosis. Expertise is undermined.
      *   **Plausibility:** **Flawed.** Confuses *social construction of the category and identity* (Claims 2 & 3) with *epistemic validity of diagnosis*. Even if ADHD is an interactive kind, reliably identifying individuals who fit the criteria and benefit from interventions requires expertise to distinguish from other causes and avoid harm. The *process* of diagnosis isn't dissolved by the category being interactive.
      *   **Hacking's Intent?** **No.** Hacking wasn't making an argument about diagnostic authority or self-diagnosis.
      *   **Gets Second Guy His Conclusion?** **Only by misunderstanding.** Uses the ambiguity of "made up" to jump from "socially constructed kind" (Claim 3) to "no expertise required" (a non-sequitur).
      *   **Engine Relevance:** Misapplies all engines to undermine medical authority.

  **Summary & Verdicts for Your ADHD Thread:**

  *   **Hacking's Actual Meaning:** Primarily **Claim 3 (Creating New Ways of Being)** working through **Claim 2 (Looping Effect)**, driven by engines like **Counting & Medicalising**. He explicitly rejects **Claim 4 (Pure Construction of Phenomenon)**.
  *   **The Heavy Lifter for Ending Threads:** People almost always invoke **Claim 4 (Radical Constructivism)** to argue that asking about a "real rise" in ADHD is nonsensical. **This is a misinterpretation/misuse of Hacking.**
  *   **What Gets the First Guy His Conclusion?** Only the implausible **Claim 4**. The plausible claims (1, 2, 3) explain *why* measuring trends is complex and why the *manifestation* changes, but they **do not dissolve the question** of whether the underlying traits/difficulties targeted by the *current* concept are increasing in prevalence. They shift the burden of proof and require more nuanced analysis.
  *   **Engine Relevance Matters (for nuance):** The dominance of **Biologising/Geneticising** engines for ADHD *today* might *stabilize* the category somewhat (by anchoring it to perceived fixed biology), but **Looping (Claim 2)** still occurs (e.g., changing identity, advocacy, treatment expectations). **Counting & Medicalising** remain primary drivers of rising numbers.
  *   **The Self-Diagnosis Move (Claim 5):** A misuse of the concept, conflating social construction of identity with diagnostic validity.

  **Pasteable List for Your Thread:**

  Here's the breakdown of "making up people" claims regarding psychiatric categories like ADHD, from trivial to radical:

  1.  **Diagnostic Changes Drive Numbers (Trivial):** Definitions, awareness & tools change, altering who gets diagnosed. **Plausible.** Explains part of rising ADHD rates, but doesn't invalidate asking about real increases.
  2.  **Labels Shape Identity & Behavior (Looping Effect):** Diagnosis changes self-perception & actions, altering how the category manifests over time. **Plausible (Hacking's Loop).** Makes trends messy, but doesn't dissolve the core question.
  3.  **Categories Create New Kinds of People (Core MUP):** The label creates a new socially recognized identity/way of being that didn't fully exist before. **Plausible (Hacking's Point).** The *identity* is new, but doesn't prove the *underlying traits* are unreal or that their prevalence can't change.
  4.  **Categories Invent the Phenomenon (Radical Constructivism):** ADHD difficulties are *entirely* created by the label/society; no underlying reality. **Implausible & Not Hacking.** *If* true, it *would* dissolve the "real rise" question, but it's an invalid extreme reading.
  5.  **"Made Up" Means Self-Diagnosis is Valid:** If the category is constructed, professional diagnosis has no authority. **Flawed Misuse.** Confuses social identity with diagnostic expertise.

  **Verdict for the ADHD Numbers Argument:**
  *   The common thread-ending move ("asking if ADHD is *really* rising is confused") relies on **Claim 4 (Radical Constructivism)**.
  *   **Claim 4 is implausible and misrepresents Hacking.** Hacking (**Claim 3**) argued categories create new *ways of being*, not that they invent the underlying traits from nothing.
  *   Plausible claims (**1, 2, 3**) explain *why* measuring ADHD prevalence is complex and historically contingent, but **they do NOT dissolve the question** of whether the neurocognitive/functional difficulties targeted by the *current concept* are becoming more common. They require careful analysis, not dismissal.
  *   The engines (**Counting, Medicalising, Biologising**) drive the looping and rising numbers, but biologising may add stability.
