answer: |-
  This practice reveals deep tensions between institutional epistemology, legal responsibility, and human cognition. Let's dissect the presuppositions, essential commitments, and alternatives:

  **Core Presuppositions & Commitments:**
  1.  **Determinate Causal Structure:** The practice fundamentally requires the belief that *some* causal explanation exists and is discoverable. Without this, neither "root causes" nor "lessons" make sense.
  2.  **Counterfactual Efficacy:** It presupposes that altering identified causes *could have* prevented the outcome ("lessons" imply actionable changes). A bare counterfactual claim *is* essential.
  3.  **Causal Relevance Distinction:** It necessitates distinguishing "causes" from mere "background conditions." This is the linchpin for assigning responsibility (legal or systemic).
  4.  **Transferable Lessons:** It assumes identified causes/remedies are relevant beyond the specific instance, despite contextual variations.
  5.  **Competency Standard:** It implicitly relies on an objective (though often unarticulated) standard of what a "reasonable/competent person" *should* have known/foreseen/done at key points.

  **Problematic "Decorations" (Often Unavoidable in Practice):**
  1.  **Narrative Inevitability:** The single, linear narrative structure ("beginning, climax, cast") creating a sense of *inevitability* is a cognitive artifact, not a strict necessity. It's a powerful communication tool but introduces hindsight bias.
  2.  **Monocausality (Implied):** While reports may list multiple root causes, the narrative form often subtly implies a primary chain or hierarchy not fully supported by the complexity.
  3.  **Perfect Foresight (Hindsight Bias):** Knowing the outcome inevitably colors the analysis of what *should* have been foreseen. This is cognitively pervasive and hard to eliminate.

  **Theory of Explanation Committed To:**
  The practice is **eclectic but leans heavily on Narrative Construction**, incorporating elements of others:
  *   **Covering Law:** Implied in the belief that similar causes lead to similar effects ("lessons travel"). Rarely states explicit universal laws.
  *   **Re-enactment:** Used to assess decisions ("what they knew/should have known"). Essential for negligence judgments but vulnerable to hindsight bias.
  *   **Narrative Construction:** *Dominant.* The report stitches events, actors, and conditions into a coherent story explaining *why* it happened. This creates meaning and identifies "key" moments/causes but imposes structure where ambiguity exists.

  It **must pragmatically use all three**, unable to choose solely one. However, it rarely acknowledges this eclecticism or its limitations.

  **Hindsight Bias & "No-Blame":**
  *   **Genuine "No-Blame" (Cognitive):** Achieving *pure* cognitive neutrality is likely **impossible**. Knowing the outcome fundamentally changes how we interpret antecedent events and assess foreseeability.
  *   **"No-Blame" as Institutional Practice:** This focuses on the *report's purpose and scope*. It means:
      *   Not *formally* assigning legal or disciplinary responsibility to *individuals* within the report.
      *   Focusing on *systemic* factors and learning.
      *   **You are correct:** "No-blame" often **relocates blame**:
          1.  **Onto Systems/Design:** The "causes" identified (flawed procedures, inadequate training, poor design) implicitly blame the organizations/designers responsible for those systems.
          2.  **Onto Causal Selection:** Deciding *which* factors are "root causes" inherently implies others are *not* blameworthy (or less so). This selection is a normative, not purely objective, act.
          3.  **Onto Implicit Standards:** Defining the "competent person" standard involves judgment that can implicitly blame individuals who fell short, even if not named.

  **Your Friend's Proposal (Conditions + Counterfactuals):**
  Taking this seriously would radically transform the institution:

  1.  **Become a Data Repository & Modeling Lab:** The core output becomes a detailed dataset of conditions (physical, procedural, human state, organizational, environmental) and rigorously defended counterfactual simulations ("If condition X had been different at time T, outcome O would/would not have occurred with probability P").
  2.  **Abandon Narrative & "Root Cause":** The single explanatory story and the concept of "the cause" disappear. Focus shifts to probabilistic relationships and critical thresholds within complex systems.
  3.  **Require Explicit Uncertainty Quantification:** Every counterfactual claim must be accompanied by confidence levels, assumptions, and limitations. "We don't know" becomes a valid and frequent finding.
  4.  **Shift Expertise:** Greater need for systems engineers, data scientists, statisticians, and human factors specialists skilled in modeling and counterfactual analysis. Less emphasis on traditional investigative "storytelling."
  5.  **Radical Transparency:** The raw data (anonymized), models, and simulation assumptions must be published alongside conclusions to allow independent scrutiny.
  6.  **Focus on Vulnerability, Not Blame:** Insights become about identifying *system vulnerabilities* ("Under conditions A, B, and C, failure mode F has high probability") rather than assigning cause/blame. Mitigations target reducing vulnerability.
  7.  **Legal & Political Challenges:**
      *   **Ambiguity:** Lawyers, courts, and the public crave clear narratives and responsibility. Raw data and probabilistic counterfactuals are harder to process and act upon.
      *   **"Non-Answers":** Stakeholders may perceive the institution as failing its duty to explain "why."
      *   **Indirect Blame:** Legal teams would still use the data/counterfactuals to construct blame narratives for prosecutions or lawsuits, potentially more aggressively.
      *   **Resource Intensity:** Developing and defending robust counterfactual models is extremely resource-heavy.

  **Could it Work?**
  *   **Epistemologically:** It's arguably *more* honest about complexity and uncertainty. It directly combats hindsight bias and narrative inevitability.
  *   **Practically:** It faces immense hurdles:
      *   **Communication:** Translating complex data and counterfactuals into actionable insights for diverse audiences (regulators, industry, public).
      *   **Resource Demands:** Requires massive investment in data infrastructure and specialized expertise.
      *   **Institutional Acceptance:** Requires a paradigm shift away from the deeply ingrained need for a singular, blame-allocating (even if implicitly) narrative.
      *   **Legal Integration:** Courts and prosecutors are narrative-driven institutions. Adapting them to use probabilistic vulnerability models is a monumental task.

  **Conclusion:**
  The current practice strictly needs the core presuppositions (determinate causes, counterfactual efficacy, causal relevance, transferability, competency standard). Narrative construction is its dominant, pragmatic, but problematic explanatory mode. Genuine cognitive "no-blame" is likely impossible due to hindsight bias; institutional "no-blame" relocates blame onto systems and causal selection.

  Your friend's proposal is a radical push towards epistemological humility. Implementing it would transform the institution into a hybrid data lab/modeling center focused on systemic vulnerability rather than causal assignment. While theoretically appealing and potentially more accurate, its practical viability is highly questionable due to communication challenges, resource needs, and clashes with societal and legal demands for clear narratives and accountability. It represents a profound, perhaps unworkable, shift in how society understands and responds to failure. The core tension between the desire for certainty/blame and the reality of complex system failure remains unresolved.
