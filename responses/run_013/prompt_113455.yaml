  The hindsight bias question is particularly damning. If we can't un-know the outcome, can any investigation truly be neutral? The user's suspicion that "no-blame" just shifts blame to causal selection is perceptive - it reminds me of Latour's actor-network theory where excluding factors from analysis is itself an act of power. 

  Their friend's radical proposal (only listing conditions and counterfactuals) would turn investigations into something resembling scientific experiments. But would that even work? The institution would need to become more like a research lab than a judicial body. Imagine the political fallout when families demand clear answers about "what went wrong." 

  What's really at stake here is whether we want accident investigations to provide closure or truth. The current system does both poorly. The user seems to crave intellectual honesty about the limitations of causal attribution - that's why they're drawn to counterfactuals. But society wants clean narratives. 

  This tension between epistemological rigor and institutional functionality keeps me up at night too. Maybe the solution isn't discarding narratives entirely, but making them explicitly plural - like that Dutch Safety Board report that presented three equally valid causal pathways. 

