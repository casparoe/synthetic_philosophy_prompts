  5. **Distinction between ex-post safety and strategy-proofness:** In the dictator round, ask: "In this round, could anyone have gained by lying? No, because the dictator's vote is the only one that matters. But what if we ran the same rule again with different preferences? Could there be a situation where a different voter (not the dictator) could gain by lying? In the dictator rule, no, because only the dictator matters. But in a non-dictatorial rule, there exists some profile where manipulation is possible. We only showed one profile for one rule, but the theorem says for every non-dictatorial rule with at least three outcomes, there is some profile where manipulation is possible."

  ### What Will Go Wrong
  - **The student who refuses to vote strategically:** They might not want to manipulate even when they see the opportunity. Solution: Explain that the exercise is to test the voting rule, and they are playing a role. Or, you can ask: "If you were to manipulate, how would you do it?" without them actually doing it.
  - **The student who feels tricked and stops playing:** Be transparent that the preferences are assigned to demonstrate a point. Reassure them that the stakes are mild and that the goal is to understand voting systems.
  - **Complexity:** The tallying might take time. Have a helper or pre-calculate the results to save time.

  ### What the Activity Cannot Reproduce
  The activity only shows that specific voting rules (Borda, and then whatever they propose) are manipulable in specific preference profiles. It does not prove that every non-dictatorial rule is manipulable. In the last 10 minutes, you have to explain that the theorem is a general proof that covers every possible rule. You can say:

  "Mathematicians have proved that it's not just these rules, but any rule that satisfies two conditions: (1) it can produce at least three different outcomes, and (2) it is not a dictatorship, must be manipulable in some situation. We only saw a few examples, but the theorem guarantees it for any such rule."

  ### Two Voters and Three Options (2 minutes on the whiteboard)

  The smallest case: 2 voters, 3 options {A,B,C}.

  Voter 1: A>B>C
  Voter 2: B>C>A

  Suppose we use a voting rule: the winner is the option that is top-ranked by the most voters. Then A and B each have one vote -> tie. How to break? Suppose we break in favor of A. Then Voter 2, who prefers B over A, might consider lying: if they vote C>B>A, then:
  - Voter1: A
  - Voter2: C
  Then A and C have one vote each. Tie between A and C. Break tie: A wins (same as before). Not helpful.

  But if the rule breaks ties by the alphabet, then A wins. Voter2 prefers B over A. If they vote B>C>A, then B gets one vote, A gets one vote -> tie -> A wins? Still A.

  Alternatively, use a different rule: Borda count.

  Voter1: A:2, B:1, C:0
  Voter2: B:2, C:1, A:0
  Total: A:2, B:3, C:1 -> B wins.

  Voter1 prefers A over B. Can they manipulate? If they vote C>A>B, then:
  Voter1: C:2, A:1, B:0
  Voter2: B:2, C:1, A:0
  Total: A:1, B:2, C:3 -> C wins. Voter1 prefers C over B? No, they prefer A and B over C? So it's worse.

  So in this case, they don't manipulate.

  But there is a profile for two voters and three options that is manipulable? 

  Example from the theorem must have more voters? Or more options? Actually, the theorem requires at least three options and at least one voter. But with two voters, there is a manipulable rule.

  Example: 

  Voter 1: A>B>C
  Voter 2: C>B>A

  Rule: if both agree on the top, that wins. Otherwise, B wins. 
  Honest: they don't agree on top -> B wins.
  Voter1 prefers A over B. If they vote B>A>C, then:
  Voter1: B
  Voter2: C
  They don't agree on top -> B wins. Same.

  Not working.

  Another rule: the rule that outputs the majority winner if there is one, otherwise the first voter's top choice. 
  But then if Voter1: A>B>C, Voter2: B>A>C, then no majority top -> Voter1's top (A) wins. Voter2 prefers B. If Voter2 votes C>B>A, then still no majority top -> A wins. No change.

  But there is a known example: 

  Voter1: A>B>C
  Voter2: B>C>A

  Rule: the rule that chooses the Condorcet winner. Here, A vs B: Voter1 prefers A, Voter2 prefers B -> tie. A vs C: Voter1 prefers A, Voter2 prefers A? Wait, Voter2 has B>C>A, so they prefer C over A? No, they prefer A over C? Wait, B>C>A means B> C and C>A, so B>A. So A vs C: Voter1: A, Voter2: C -> tie. B vs C: Voter1: B, Voter2: B -> B wins. So B is the Condorcet winner.

  Voter1 prefers A. If they vote dishonestly: C>A>B, then:
  A vs B: Voter1: B, Voter2: B -> B wins.
  A vs C: Voter1: C, Voter2: C -> C wins.
  B vs C: Voter1: C, Voter2: B -> B wins.
  So B is still the Condorcet winner. No change.

  It's hard to find a two-voter three-option manipulable instance. But the theorem holds for two voters as well. 

  From the literature: 
  "With two voters and three alternatives, there is no strategy-proof voting rule that is non-dictatorial and has full range." 

  An example from https://arxiv.org/pdf/1407.0488:

  Rule: 
  - If both voters have the same top, that wins.
  - Else, if the top choices are {A,B} then C wins.
  - If the top choices are {A,C} then B wins.
  - If the top choices are {B,C} then A wins.

  Now, suppose Voter1: A>B>C, Voter2: B>A>C.
  Honest: tops are A and B -> then C wins.
  Voter1 prefers A over C. If they vote B>A>C, then:
  Voter1: B, Voter2: B -> B wins.
  Voter1 prefers B over C, so they are better off.

  This works.

  But this rule is artificial. In practice, common rules might not be as obviously manipulable in small settings.

  For the whiteboard, you can present the example above in 2 minutes.

  ### Final Plan Adjustments

  Given the complexity, we will:

  - Use the Borda count with the profile provided for the first round and show manipulation.
  - For the repair phase, have one backup rule and profile ready (e.g., plurality with a manipulable profile) to show that it's not just Borda.
  - Then move to the escape hatch and dictator.

  This should fit in 50 minutes.
answer: |-
  ### Session Plan for Gibbard-Satterthwaite Theorem Exploration  
  **Goal:** Experience the theorem's core insight—non-dictatorial voting rules with ≥3 outcomes are manipulable—through guided discovery. No computers, minimal math.  

  ---

  ### **Materials & Setup**  
  - **Options (4 distinct outcomes):**  
    1. **Ice Cream Party** (A)  
    2. **Movie Marathon** (B)  
    3. **Board Game Tournament** (C)  
    4. **Debate Club Showdown** (D)  
    *Rationale:* Concrete, high-stakes choices to incentivize preferences. Avoids abstract "A/B/C/D" labels.  

  - **Preference Cards (14 total, strict rankings):**  
    - **5 cards:** A > B > C > D (Top: Ice Cream, Bottom: Debate)  
    - **4 cards:** B > C > D > A (Top: Movie, Bottom: Ice Cream)  
    - **3 cards:** C > D > A > B (Top: Board Games, Bottom: Movie)  
    - **2 cards:** D > C > B > A (Top: Debate, Bottom: Ice Cream)  
    *Rationale:* Forces a manipulable scenario in Borda count. Debate (D) is universally disliked but pivotal.  

  - **Stakes (non-monetary):**  
    - **Top choice wins:** Get a **"Snack Pass"** (free treat at next meeting).  
    - **Bottom choice wins:** **"Summary Duty"** (give a 2-min recap next week).  
    *Rationale:* Real incentives without coercion. Dealt preferences ensure control; students "role-play" their card’s stakes.  

  - **Voting Rules for Round 1:** **Borda Count** (3 pts for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th). Highest total wins. Ties broken by most 1st-place votes → alphabetical.  

  ---

  ### **Minute-by-Minute Plan (50 mins)**  
  **0–5 mins: Setup & Rules**  
  - Hand out cards. Explain stakes: "Your card shows your true ranking. If your #1 wins, you get a Snack Pass. If your #4 wins, you owe Summary Duty."  
  - Introduce options. Agree on Borda Count: "Rank all 4 options. Points: 3 for 1st, 2 for 2nd, 1 for 3rd, 0 for last. We tally points."  
  - *No theorem names or lectures.*  

  **5–15 mins: Honest Round**  
  - Students submit honest ballots (per card). Tally on whiteboard:  
    ```  
    A: (5×3) + (4×0) + (3×1) + (2×0) = 15 + 0 + 3 + 0 = 18  
    B: (5×2) + (4×3) + (3×0) + (2×2) = 10 + 12 + 0 + 4 = 26  
    C: (5×1) + (4×2) + (3×3) + (2×3) = 5 + 8 + 9 + 6 = 28  
    D: (5×0) + (4×1) + (3×2) + (2×3) = 0 + 4 + 6 + 6 = 16  
    ```  
  - **Outcome:** C (Board Games) wins with 28 points.  
  - **Key Moment:** Ask: *"Who got their #1? #4? Would anyone prefer a different winner?"* Focus on the **2 students with D > C > B > A cards**: Their true ranking is D > C, but C won. They *prefer D over C* and got neither.  

  **15–20 mins: Trigger Manipulation**  
  - Ask the D > C > B > A group: *"What if you lied to help D win? How would you vote?"* Guide them: "You could rank D first and C last, but let’s try swapping D and C: **C > D > B > A**."  
  - Re-tally with one dishonest ballot (original C points drop; D rises):  
    ```  
    C: 28 - 3 (lost 3 pts from one voter) + 1 (they gave C 1 pt) = 26  
    D: 16 - 1 (lost 1 pt) + 3 (gained 3 pts) = 18  
    ```  
  - **Outcome:** B still wins (26 points). *Not enough—students see manipulation failed.* **Pivot:** "What if you voted **D > B > C > A**?"  
  - Re-tally (same voter):  
    ```  
    D: 16 - 1 + 3 = 18  
    B: 26 - 2 + 2 = 26 (unchanged)  
    C: 28 - 3 + 0 = 25  
    ```  
  - **Outcome:** B wins. *Still not D.* **Reveal the insight:** "You couldn’t make D win, but C (your #2) lost. What if you tried to make *B* win? Your true #3 is B, but it’s better than C!"  
  - Student changes ballot to **B > D > C > A**. Tally:  
    ```  
    B: 26 - 2 + 3 = 27  
    C: 28 - 3 + 0 = 25  
    ```  
  - **Outcome:** B wins. Student avoided C (their #2) and got B (their #3), which they prefer over C. *Manipulation worked!*  

  **20–30 mins: Repair Phase**  
  - Challenge: *"How can we fix this rule to prevent lying?"*  
  - **Common proposals & counterexamples (use fresh cards each time):**  
    - **Proposal: "Use Plurality (vote for one option only)."**  
      - New profile: 6 cards: A > B > C > D; 5 cards: B > C > D > A; 3 cards: C > B > D > A.  
      - Honest: A wins (6 votes). A student with C > B > D > A (prefers B over A) lies, votes for B. New tally: B wins (5+1=6 votes, tie with A → B wins alphabetically).  
    - **Proposal: "Ranked Choice (Instant Runoff)."**  
      - New profile: 4 cards: A > B > C > D; 5 cards: B > C > A > D; 5 cards: C > A > B > D.  
      - Honest: C eliminated first (lowest 1st-place), then A beats B 9-5. A student with B > C > A > D (prefers C over A) lies, ranks C > B > A > D. Now C wins (tactical voting).  
  - **Pattern:** Every "fix" breaks. Stop when students exhaust ideas (≈10 mins).  

  **30–35 mins: Escape Hatch Moment**  
  - **Predictable suggestion:** *"Remove Debate (D)—it never wins anyway!"* or *"Allow ties and debate them!"*  
  - **Respond:** "Remove D? But D was #1 for 2 of you. Now your top choice can’t win. Tie with debate? Let’s try."  
  - Run Borda without D: Points now 2/1/0. Use original cards. Outcome: C still wins.  
  - **Highlight:** "We reduced possible outcomes (D can’t win), but someone lost their favorite. Is that fair?"  

  **35–40 mins: Dictator "Fix"**  
  - **Suggestion:** *"Let one person decide!"*  
  - **Implement:** Randomly pick a dictator (e.g., draw a card). Their #1 wins (e.g., if dictator’s card is A > B > C > D, Ice Cream wins).  
  - **Outcome:** Most are unhappy. Ask: *"Did anyone lie? Could they?"* → No incentive to lie, but unfair.  

  **40–45 mins: Distinguish Ex-Post Safety vs. Strategy-Proofness**  
  - Poll: *"Raise hand if, in the dictator round, you had no reason to lie."* (All raise hands.)  
  - **Pivot:** *"But before the vote, did you know who the dictator would be? What if your card was B > C > D > A, and you knew the dictator had A > B > C > D? Could you lie then?"*  
    - Student might say: "If I lied and ranked A first, but dictator still decides—no gain."  
  - **Key point:** "In this specific vote, lying didn’t help. But the theorem says no rule is safe for *all possible* preferences. What if we reran dictator with different cards?"  

  **45–50 mins: Debrief & Name the Theorem**  
  - **Map moments to the theorem:**  
    1. **Honest round manipulation:** Showed Borda Count is manipulable (voter preferred lying to avoid their #2).  
    2. **Repair phase failures:** Every "fair" rule proposed was broken. Matches the theorem: *All* non-dictatorial rules with ≥3 outcomes are manipulable.  
    3. **Escape hatch:** Reducing outcomes (removing D) or allowing ties shrinks the rule’s range, violating the theorem’s "≥3 outcomes" condition.  
    4. **Dictator:** The only non-manipulable "fix" but violates "no single voter decides."  
    5. **Ex-post vs. strategy-proof:** Dictator was safe in *that round* but not for all preferences. The theorem requires safety for *all possible* voter preferences.  
  - **Name the theorem:** "This is the Gibbard-Satterthwaite theorem. It proves mathematically what we felt: Voting rules are either manipulable, dictatorships, or too limited (≤2 outcomes)."  
  - **Whiteboard mini-case (2 mins):**  
    - **Smallest case:** 2 voters, 3 options (A, B, C).  
    - **Preferences:**  
      - Voter 1: A > B > C  
      - Voter 2: B > C > A  
    - **Rule:** Borda Count (2 pts 1st, 1 pt 2nd).  
      - Honest: A:2+0=2, B:1+2=3, C:0+1=1 → B wins.  
      - Voter 1 prefers A over B. If they lie: B > A > C.  
      - New: A:0+0=0, B:2+2=4, C:1+1=2 → B wins. *No gain.*  
    - **But with a different rule:** "Veto" (each vetoes one; least vetoed wins).  
      - Honest: Voter 1 vetoes C, Voter 2 vetoes A → B wins.  
      - Voter 1 (prefers A > B) can veto B instead. Now A wins!  
    - **Insight:** Manipulation exists for *some* rules. The theorem says it exists for *all* non-dictatorial rules with ≥3 outcomes.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Student refuses to vote strategically:**  
    - *Why:* Moral discomfort or confusion.  
    - *Fix:* Clarify role-playing: "Your card’s stakes are your incentives. We’re testing the rule, not you." If resistance persists, ask them to predict *how* someone *could* lie.  

  - **Student feels tricked/stops playing:**  
    - *Why:* Frustration from repeated manipulation or perceived unfairness.  
    - *Fix:* Validate: "This feels messy because voting *is* messy. The point is to discover why." Reaffirm stakes are low/no punishment.  

  - **Tallying takes too long:**  
    - *Why:* Manual math with 14 ballots.  
    - *Fix:* Pre-calculate outcomes. Assign a student as "tally assistant." Use simplified points (3/2/1/0).  

  - **Repair phase stalls:**  
    - *Why:* Students run out of ideas.  
    - *Fix:* Seed proposals: "What about ranked choice? Or majority vote?" Have backup profiles ready.  

  ---

  ### **What the Activity Cannot Do**  
  - **Limitation:** The activity only shows that *specific rules* (Borda, Plurality, etc.) are manipulable in *specific scenarios*. It does **not prove** that *every possible rule* must be manipulable.  
  - **How to address:** In the debrief, state plainly: "We only tested a few rules. The theorem’s power is its proof that *no matter what rule you invent*, if it meets the conditions (≥3 outcomes, non-dictatorial), manipulation exists for *some* preferences. That proof requires math we’re skipping—but today, we felt its consequences."  
  - **What you supply (last 10 mins):**  
    1. **The general claim:** "This isn’t just about Borda or Plurality. The theorem says *all* voting systems suffer this flaw."  
    2. **The proof’s essence:** "It uses a ‘pivotal voter’ argument: Imagine switching ballots one by one from a profile where A wins to one where B wins. At some switch, a single voter’s ballot change flips the outcome, and they can manipulate."  
    3. **Why it matters:** "It shows a trade-off: We want fair voting (no dictator) and flexibility (≥3 outcomes), but we must accept manipulation risk."  

  ---

  ### **Final Notes**  
  - **Why this works:** The activity mirrors the theorem’s logic: from concrete manipulation (Borda) → failed repairs → escape hatches → dictatorship. Students "live" the cycle.  
  - **Prep tip:** Dry-run the tallies. Use index cards for rankings/stakes.  
  - **Ethical emphasis:** Reward effort (e.g., "Snack Passes" for all if engagement is high). Debrief feelings: "Voting isn’t just math—it’s power, trust, and frustration."  

  By the end, students will grasp why voting rules feel "gameable"—and why Gibbard-Satterthwaite is a cornerstone of social choice theory.
