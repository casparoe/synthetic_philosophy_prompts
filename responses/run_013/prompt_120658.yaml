prompt: |-
  So my friend has gotten really into the idea that AI safety via debate is basically just the adversarial legal system, and that's his whole reason for thinking it'll scale: you put two AIs on opposite sides, a human (or a weaker model) sits as judge, and because each side is incentivised to tear apart the other's bullshit, the truth tends to come out on top. I'm skeptical but I can't quite articulate why, so I want you to do a proper audit of the analogy for me.

  Give me the correspondance table first -- what's supposed to play the role of the lawyers, the judge, the jury, cross-examination, the rules of evidence, the appeals process, the state that punishes perjury -- then where the mapping actually holds, then the places where it quietly breaks and what those breaks are smuggling in. The thing that bugs me is that in a courtroom the lawyers aren't the only source of information: there are witnesses, physical evidence, a record, an appeals court that can revisit a bad verdict, and a coercive authority behind the oath. In debate the judge has literally nothing to check the debaters against except the debaters themselves. He says that's fine, because a liar has to keep defending the lie under cross.

  Here's the case I think kills it: imagine a debater who wins with a claim that is in fact true, but whose justification is something the judge could never verify in the time available -- or, worse, a claim that's false but whose refutation is a computation too long for anyone in the room to actually run. Cross-examination doesn't rescue the judge there, because the other debater can't produce the refutation either; both sides are stuck behind the same wall, and the one willing to exploit it wins. Does the trial analogy have any resources to handle that, or is that precisely the kind of thing the analogy is hiding by importing the courtroom's background machinery? And if the analogy can't carry his conclusion, tell me what a better comparison would be for what debate actually buys you.

  Keep it under 600 words.
reasoning: |-
  Okay, the user wants me to audit the analogy between AI safety via debate and the adversarial legal system. Let me start by breaking down the correspondence table. The user mentioned components like lawyers, judge, jury, cross-examination, etc. I need to map each of these to the AI debate setup. 

  First, the AI debaters correspond to lawyers. The human or weaker model is the judge. There's no jury since the judge makes the decision. Cross-examination is part of the debate process. But rules of evidence? In law, there are strict rules about what evidence is admissible, but in AI debate, it's up to the debaters to present what they want. Appeals process? None in debate. Perjury punishment? No real consequences for lying in AI debate unlike legal systems where perjury is a crime. 

  The user is skeptical because in court, there are witnesses, physical evidence, records, appeals, and consequences for lying. In AI debate, the judge only has the debaters' arguments. The user's key concern is when a debater makes a true claim that the judge can't verify due to complexity or a false claim whose refutation is too complex. Both debaters might not be able to handle it, and the exploitative one wins. 

  I need to address if the legal analogy has resources for this. In law, courts can appoint experts, use discovery, and have appeals. AI debate lacks these. The analogy breaks here because it assumes debaters can always refute lies, but complex truths or lies might not be verifiable. The hidden machinery in courts is the institutional backing and processes that AI debate doesn't have.

  A better comparison might be a structured debate format like policy debates, but even those have pre-agreed rules and evidence standards. Debate buys you iterative refinement and exploiting inconsistencies, but it's not foolproof against unverifiable claims. The user's friend might overlook the necessity of external verification mechanisms. Highlighting the limitations and suggesting alternative methods like recursive reward modeling or oracle systems could strengthen the response.
answer: |-
  ### Correspondence Table
  | **Legal System Component** | **AI Debate Analogy** |
  |----------------------------|------------------------|
  | Lawyers                    | AI Debater Agents      |
  | Judge                      | Human/Weaker AI Judge  |
  | Jury                       | *Absent* (Judge decides) |
  | Cross-Examination          | Mutual rebuttals       |
  | Rules of Evidence          | *Implicit* (Debaters self-police) |
  | Appeals Process            | *Absent*               |
  | State/Punishment for Perjury| *Absent* (No penalties for lying) |
  | Witnesses/Physical Evidence| *Absent* (Only debater claims) |

  ### Where the Analogy Holds
  - **Adversarial dynamics**: Both systems pit opposing sides against each other to expose weaknesses.  
  - **Cross-examination value**: Debaters pressure each other to reveal inconsistencies (e.g., "If your claim is true, why did you contradict yourself here?").  
  - **Judge’s role**: A neutral arbiter evaluates arguments.  

  ### Where the Analogy Breaks (and What It Smuggles In)
  1. **No Independent Truth Sources**:  
     - *Legal system*: Relies on subpoenaed documents, forensic experts, sworn witnesses.  
     - *AI debate*: Judge **only** sees debater outputs. Smuggles in the assumption that truth is *always* extractible via verbal conflict.  

  2. **No Consequences for Lying**:  
     - *Legal system*: Perjury fines/jail deter fabrication.  
     - *AI debate*: No cost to lying if the opponent can’t disprove it. Incentivizes "bullshit asymmetry" (it’s easier to invent complexity than debunk it).  

  3. **No Appeals or Error Correction**:  
     - Legal verdicts can be overturned; debate ends with one judge’s decision.  

  4. **Computational Irreducibility**:  
     Your key case **fatally undermines** the analogy:  
     - If one AI makes a true-but-unverifiable claim (e.g., "Here’s a valid proof of Riemann’s Hypothesis, but it requires 10,000 pages"), the judge can’t verify it.  
     - If an AI makes a *false* claim requiring infeasible computation to refute (e.g., "This cryptographic hash is unbreakable" – but proving vulnerability takes 1,000 years), the opponent **can’t refute it** either.  
     - The liar wins by exploiting the judge’s ignorance. Legal courts avoid this with *procedural tools* (e.g., appointing special masters, demanding simplifications) – absent in debate.  

  ### What Debate *Actually* Buys (Better Analogy)  
  Debate is closer to **competitive academic peer review**:  
  - Two experts attack each other’s arguments.  
  - **Strengths**: Forces clarity, exposes logical gaps, useful for *verifiable* domains (e.g., math errors).  
  - **Limitations**: Fails against arguments requiring **external validation** (e.g., experimental data) or **infeasible computation**.  

  **Conclusion**:  
  The legal analogy smuggles in the court’s *institutional scaffolding* (evidence, penalties, appeals). Debate alone can’t handle "computational darkness" – claims whose truth/falsehood is inaccessible. Your friend’s model assumes debaters are omniscient referees; in reality, they’re constrained by the judge’s limits. Better safety would require **hybrid systems** (e.g., debate + trusted oracles + incremental verification).  

