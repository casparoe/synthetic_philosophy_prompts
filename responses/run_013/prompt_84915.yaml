prompt: |-
  I work in the policy unit of a civil liberties charity, and every week we have to sign off or oppose something — curfews, ID checks, workplace rules, benefit conditions — and the arguement always turns into a shouting match about freedom. I want a reusable screening proceedure my team can run in half an hour, before anything goes to the director, that actually uses the three ideas of liberty: negative liberty (no one interfering), positive liberty (being one's own master and having the real capacity to act), and republican liberty (not being dependent on anyone's goodwill, even if they don't actually interfere). Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a clear yes or no, and where it has to hand the decision to a human because it's a value call rather than a fact. Keep it usable by people who haven't read the theory, don't let positive liberty collapse into just having resources — unfreedom and inability aren't the same thing — and be honest about where it will misfire. Then run it on three proposals: a night-time curfew in a high-crime neighbourhood, mandatory digital ID for social media accounts, and a workplace ban on managers dating their subordinates. I especially need it to handle the case where a policy reduces interference but increases domination, and the case where positive liberty seems to justify paternalism. One of the worked examples should come out in a way our campaigners won't like. British English, please.
reasoning: |-
  Okay, let me unpack this user's request. They're in a civil liberties policy unit dealing with weekly debates on restrictions like curfews or ID checks, and the team keeps getting stuck in unproductive freedom arguments. They need a practical, theory-based screening tool that covers all three liberty concepts without requiring philosophical expertise. 

  First, I need to consider their operational reality: time-pressed, needing clear yes/no gates, and handling cases where liberty types conflict. The key challenges are preventing positive liberty from being misinterpreted as just resource provision, and capturing republican liberty's focus on power imbalances even without active interference. 

  For the framework design, I'm thinking a three-stage filter with knockout questions. Negative liberty gets addressed first because it's the most intuitive ("does this physically stop people?"). Then republican liberty to catch hidden power dynamics, deliberately before positive liberty to avoid paternalism traps. Positive liberty comes last with strict guardrails against justifying coercion. Each stage must have unambiguous pass/fail thresholds.

  The examples need to showcase edge cases: the curfew should demonstrate how reducing interference (negative liberty) might worsen domination (republican liberty), while the dating ban should trigger the paternalism warning in positive liberty. The ID case must expose how "voluntary" systems can still create dependency - and importantly, one outcome should deliberately challenge campaigners' biases to prove the tool's objectivity.

  I'm wary of oversimplifications. The positive liberty section needs particularly careful wording - it can't become a backdoor for "we know what's best" policies. The resource caveat ("unfreedom vs inability") requires concrete examples in the explanations. For republican liberty, the "structural dependency" definition must cover both state and corporate power.

  When testing the examples: 
  - The curfew should fail at republican liberty despite passing negative, showing how safety claims don't override domination concerns. 
  - The ID check needs to flag republican risks even if technically avoidable. 
  - The dating ban must pass because while it restricts negative liberty, it meets republican/positive thresholds by preventing coercive environments. That last one might upset campaigners who prioritize non-interference above all - which is exactly why the tool adds value.

  Final checks: using British English consistently, keeping explanations jargon-free, and building in clear "human judgment" flags where values outweigh analysis. The misfire warnings are crucial - this tool clarifies trade-offs but can't eliminate them.
answer: |-
  Here's a reusable screening procedure based on Berlin's three concepts of liberty, designed for speed, clarity, and avoiding common traps. It forces the team to consider each type of liberty sequentially.

  **Liberty Screening Procedure: The Three-Filter Test**

  **Time Allotment:** Approx. 10 mins per filter (30 mins total).
  **Goal:** Identify clear "Oppose" signals, clear "No Major Liberty Objection" signals, or flag for Director-level debate on values.
  **Core Principle:** A policy *failing* any filter (i.e., significantly harming that type of liberty without overwhelming justification in *that specific filter*) triggers an "Oppose" recommendation. Passing all three triggers "No Major Liberty Objection". Ambiguity triggers "Refer to Director".

  **The Filters & Questions:**

  1.  **Filter 1: Negative Liberty (Freedom *From* Interference)**
      *   **Question 1:** **Does the policy *physically prevent* individuals from performing specific actions they could otherwise legally perform (e.g., moving, speaking, associating, working, accessing services, possessing items)?** (Focus: Direct coercion, barriers, prohibitions).
          *   *Sufficient Answer for "NO Harm" (Pass Filter):* No, it doesn't create new physical/legal barriers to action. (E.g., A voluntary scheme, information campaign).
          *   *Sufficient Answer for "HARM" (Fail Filter - Oppose):* Yes, it directly prevents specific actions for specific people/groups.
          *   *Ambiguous/Value Call (Refer):* It creates *indirect* barriers (e.g., significant cost increase, complex bureaucracy) *or* the interference is highly targeted/minimal. *Human judgement needed on severity and justification.*
      *   **STOP IF FAIL:** Recommend **OPPOSE**. (Major direct interference).
      *   **IF PASS or REFER:** Proceed to Filter 2.

  2.  **Filter 2: Republican Liberty (Freedom *From* Domination)**
      *   **Question 2:** **Does the policy increase the *arbitrary power* of one entity (state, employer, platform, individual) over another, making individuals/groups dependent on that entity's *goodwill* (even if not currently misused)?** (Focus: Power imbalance, vulnerability, lack of recourse).
          *   *Sufficient Answer for "NO Harm" (Pass Filter):* No. It reduces existing arbitrary power imbalances *or* creates robust, independent safeguards against misuse (e.g., strong due process, appeals to neutral body, sunset clauses, clear limits). Power granted is non-arbitrary (rules-based, constrained).
          *   *Sufficient Answer for "HARM" (Fail Filter - Oppose):* Yes. It grants significant discretionary power without strong, independent safeguards *or* exacerbates existing dependency *or* creates new relationships of structural dependence (e.g., mandatory use of a single corporate ID system).
          *   *Ambiguous/Value Call (Refer):* Power is increased but with *some* safeguards (strength debatable) *or* the dependency risk seems low but plausible. *Human judgement needed on adequacy of safeguards and likelihood/significance of domination.*
      *   **STOP IF FAIL:** Recommend **OPPOSE**. (Creates or worsens domination).
      *   **IF PASS or REFER:** Proceed to Filter 3.

  3.  **Filter 3: Positive Liberty (Freedom *To* / Self-Mastery)**
      *   **Crucial Caveat:** This *cannot* justify forcing people to be "free". Focus on *removing internal or external blocks to self-directed action*, NOT providing resources or dictating choices.
      *   **Question 3a:** **Does the policy *remove a significant obstacle* that actively *prevents* individuals from making or acting on their own reasoned choices?** (e.g., coercive control, severe misinformation directly blocking choice, lack of *basic* mental capacity support).
          *   *Sufficient Answer for "HELPS" (Strengthens Pass):* Yes, and it's the least intrusive way to remove *that specific obstacle* directly impeding choice.
          *   *Sufficient Answer for "NO Effect/HARM" (Continue):* No. (Proceed to Q3b).
      *   **Question 3b:** **Does the policy *itself* impose a specific vision of the "good life" or significantly limit the *range* of choices available to individuals, *claiming* it's for their own good (paternalism)?**
          *   *Sufficient Answer for "HARM" (Fail Filter - Oppose):* Yes. It restricts choices/actions primarily based on a state/corporate view of what's best for people, not their own choices or direct harm to others.
          *   *Sufficient Answer for "NO Harm" (Pass Filter):* No. It might *enable* choices (without forcing specific ones) or addresses obstacles identified in 3a minimally.
          *   *Ambiguous/Value Call (Refer):* It aims to remove an obstacle (Q3a) but the method is highly intrusive *or* the definition of the "obstacle" is contested. *Human judgement needed on necessity, proportionality, and risk of paternalism.*
      *   **STOP IF FAIL (Q3b):** Recommend **OPPOSE**. (Unjustified paternalism).
      *   **STOP IF PASS (Q3a or Q3b):** Recommend **NO MAJOR LIBERTY OBJECTION**.
      *   **IF REFER:** Flag for **DIRECTOR**.

  **Where it Misfires:**
  1.  **"Tragic Choices":** Policies necessitating significant liberty trade-offs for overwhelming security/survival (e.g., extreme pandemic measures). The filters will flag harm; human judgement on necessity is paramount.
  2.  **Complex Interdependence:** Policies impacting multiple liberty types subtly and cumulatively might pass individual filters but be objectionable overall. Requires holistic review *after* screening.
  3.  **Defining "Arbitrary" & "Obstacle":** Republican harm (Filter 2) and positive help (Filter 3a) rely on interpretations of "arbitrary power" and "obstacle to self-mastery". Requires consistent team understanding.
  4.  **Resource Scarcity:** Deliberately avoids equating lack of resources (inability) with unfreedom. A policy *taking away* resources is negative liberty harm; *failing to provide* them isn't captured *unless* it creates a new dependency (Filter 2) or is paternalistic (Filter 3b).

  ---

  **Worked Examples:**

  **1. Proposal: Night-time curfew (e.g., 10 pm - 6 am) in a designated high-crime neighbourhood.**

  *   **Filter 1 (Negative):** **HARM (FAIL - OPPOSE).** Q1: Yes, it physically prevents all residents from being in public spaces during curfew hours, regardless of their actions. *Stop. Recommend OPPOSE.*
      *   *Procedure Outcome: OPPOSE. (Even without checking other filters, the direct interference is clear and significant).*

  **2. Proposal: Mandatory Digital ID for Social Media Accounts (Real-name verification linked to govt database).**

  *   **Filter 1 (Negative):** **HARM (FAIL?)** Q1: Yes, it prevents individuals from accessing major social media platforms *without* submitting to this specific ID verification. Creates a new barrier. *Sufficient Answer for Harm?* **Yes. FAIL - Recommend OPPOSE?** *But let's check Filter 2 as it's often argued as "necessary".*
      *   *Alternatively:* Could be argued as an *indirect* barrier (cost, privacy fear), pushing towards *Refer*. For speed, assume major barrier = HARM.
  *   **Filter 2 (Republican):** **HARM (FAIL - OPPOSE).** Q2: **Yes.** It grants the state (and potentially platform operators) significant new power:
      *   Creates dependency: Access essential digital space only via state-approved ID.
      *   Arbitrary power: Scope for function creep, potential for misuse (tracking, silencing dissent), lack of robust *independent* oversight over database use. Strong safeguards are unlikely to be foolproof or fully independent.
      *   *Stop. Recommend OPPOSE.* (Even if it narrowly passed Filter 1 on a technicality, Filter 2 clearly fails due to domination risk).

  **3. Proposal: Workplace Ban on Managers Dating Their Subordinates.**

  *   **Filter 1 (Negative):** **HARM.** Q1: Yes, it prevents consenting adults in specific roles from engaging in a personal relationship. It's a restriction on association. *Sufficient Answer for Harm?* **Yes.** But is it severe enough to fail? Or ambiguous? *Likely Refer/Pass?* Human judgement: Significant interference in personal life, but within specific contractual context. *Refer to Director?* **Let's proceed, assuming it flags harm but isn't an automatic fail.**
  *   **Filter 2 (Republican):** **PASS or NO HARM.** Q2: **No, it likely *reduces* domination.** It removes a major source of *arbitrary* power managers hold over subordinates (implicit/explicit pressure for relationships, favouritism, retaliation). It establishes clear rules, reducing dependence on the manager's goodwill. *Pass Filter 2.*
  *   **Filter 3 (Positive):**
      *   **Q3a:** **HELPS?** Does it remove an obstacle to self-mastery? Arguably yes – fear of pressure/retaliation *prevents* subordinates from acting freely (e.g., refusing advances). The ban removes this coercive obstacle. *Strengthens Pass.*
      *   **Q3b:** **HARM?** Is it paternalistic? While it restricts choice, its *primary* justification is preventing coercion, exploitation, and conflicts of interest (harm to others/environment), *not* dictating what's "good" for the employees' personal lives against their will. *No Harm.*
  *   **Procedure Outcome:** Passed Filter 2 & 3. Filter 1 Harm flagged but not deemed sufficient for automatic fail (referred/judgement call). **Recommend: NO MAJOR LIBERTY OBJECTION** (or weak "Oppose" from Filter 1 overruled by stronger "Support" from Filters 2 & 3). *This might challenge campaigners focused solely on non-interference (Negative Liberty).*

  **Key Outcomes Demonstrated:**
  *   **Curfew:** Clear Negative Liberty harm triggers Oppose.
  *   **Digital ID:** Negative Liberty harm *and* Republican Liberty harm (domination) trigger Oppose. Shows how reducing interference (if argued) doesn't negate domination risk.
  *   **Dating Ban:** Highlights the clash. Negative Liberty is harmed (restriction), but Republican Liberty is significantly *enhanced* (reducing domination/power imbalance) and Positive Liberty potentially helped (removing a coercive obstacle). The procedure supports the policy despite the Negative Liberty cost, likely challenging absolutist "freedom from" campaigners. It avoids paternalism by focusing on preventing harm/coercion, not dictating personal good.
