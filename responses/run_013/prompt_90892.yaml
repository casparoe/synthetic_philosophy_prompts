  For weakness (point 1): The achievement premise does heavy lifting. A defender of the "datum" view might counter that even with identical concepts, people have radically different raw experiences - think congenital pain insensitivity versus normal pain response. If aesthetic perception has hardwired components, testimony can't bridge that gap. The user should address this possibility.

