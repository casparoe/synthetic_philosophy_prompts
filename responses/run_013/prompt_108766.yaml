prompt: |-
  My friend Nadia calls herself a Burkean and is definately one of those people who won't shut up about Chesterton's fence — the idea that you shouldn't pull down a rule or an institution until you can say what it was for. She's not a politician, she just has opinions and a newsletter, but she weighs in on basically every local reform fight, so I've ended up with a decent sample of her verdicts. Here's the pile:

  - Our city had an ancient bylaw requiring every shop to keep a bucket of sand by the front door, left over from when everything was timber and lit by oil. Council moved to repeal it. Nadia was against, and her reason was basically "nobody in that room could tell me what it's for. If you can't say why it's there, you don't get to take it out."

  - Different fight: the state notary system, where you had to be appointed by the governor to notarize anything. A bill would have let anyone with a certificate do it. Nadia was for it. Her line was that the only real function of the appointment requirement was keeping notary work with people who had the right connections, and once you've named the purpose and the purpose is that, the fence comes out.

  - At her old university, they proposed replacing the oral qualifying exam with a written portfolio. She was against. The exam's purpose isn't a mystery — it tests whether you can defend your work out loud, and it drags you into the department's culture — and she said you don't swap out something that's been doing that job for decades on the strength of a scheme nobody's run.

  - When the library extended its quiet-floor rule to the new annex, she was for it. Extending a thing is different from replacing it, in her book.

  - She was against a ballot measure to write a right to housing into the state constitution, even though she complains about rents as much as anyone. Her view was that you don't fix a mess by putting an abstract right in the founding document and hoping the courts sort out the details.

  - She was for shortening the notice tenants have to give to break a lease, even though the long notice period plainly does something (it gives landlords predictable turnover). A rule whose function is shielding landlords from mild inconvenience isn't a fence worth keeping, she said.

  So here's what I can't work out. Is she actually running the Chesterton rule — oppose only when the purpose is unknown, otherwise just judge the merits like anyone else? Or is she running something more Burkean — a standing presumption in favor of whatever has lasted, so that even a practice whose purpose you understand stays up unless you can point to a real abuse, with the burden always on whoever wants the change? Those two give the same answer on everything above, as far as I can tell, and I can't tell which one she's got.

  Now the actual question. I'm on the standards committee of the regional daily I work for. We have a rule that's been in place since the fifties: no story runs unless the central claim is confirmed by two independent sources, and single-source stories are effectively banned. Everyone knows what it's for — it's how the paper avoids printing something false because one smooth talker was convincing. It's not a racket and nobody's abusing it, though it does kill true stories sometimes and it slows us down. The proposal on the table replaces it with a documented-provenance rule: a story can go on one source if that source's track record is written up and a senior editor signs off. It was piloted at three papers our size, a study found somewhat fewer corrections and no more retractions, and it's being pushed by our own standards editor, who's been here twenty years and is not a person who wants to burn the place down. No scandal behind it, no victim, no abuse to point at. The old guard say the three pilot papers run different beats and the study is thin.

  Would Nadia be for it or against it? Give me your best guess, and name the rule you think she's actually running. If both rules I described still fit her record, say which one you'd bet on and why, what each predicts here, and which bit of her earlier track record — or which fact about our proposal — would tell them apart. If the record genuinely underdetermines this, tell me which principle she'd be signing up for with each answer.

  And be straight with me about how much this is worth. Tell me what would change your mind: what she'd have had to have said, or what about the proposal would have to be different, for you to predict the other way — and where your read of her is most likely to be wrong.
reasoning: |-
  Okay, let me try to figure out what Nadia would think about this newspaper rule change. So, from what I know about her, she's a Burkean who loves Chesterton's fence. That means she doesn't want to remove rules or institutions until you understand their purpose. 

  First, looking at her past decisions. She opposed repealing the sand bucket rule because nobody knew why it was there. But she supported changing the notary system because the purpose was just to keep it within a connected group, which isn't a good reason. For the university exam, she was against replacing it since its purpose (oral defense and culture integration) was clear and it worked. She supported extending the library quiet rule because it's not removing but expanding. She was against the right to housing amendment because adding an abstract right without a plan isn't fixing anything. And she was for shortening tenant notice periods because protecting landlords from minor inconvenience isn't a valid purpose.

  Now, the newspaper rule: the two-source requirement. Its purpose is clear—prevent false stories by needing two confirmations. The proposal is to switch to a documented-provenance system where one source is enough if their track record is checked and a senior editor approves. There was a pilot study showing fewer corrections and no more retractions, and it's supported by a long-time standards editor.

  The key points are:
  1. The purpose of the existing rule is well-known and it's not being abused.
  2. The change is replacing it with a new system that was piloted with some success.
  3. There's no scandal or abuse prompting the change.

  Nadia's stance likely hinges on whether she sees this as a justified replacement. If she's strictly applying Chesterton's fence, she might oppose because the original purpose is valid and the new system hasn't been proven enough. But if she's more Burkean with a presumption for tradition, she'd require strong evidence that the new system is better. The pilot study might not be sufficient, especially since the old guard points out flaws in the study and differences in the pilot papers.

  Considering her past decisions, she opposed changes when the purpose was unknown (sand bucket) or when replacing a working system (university exam). She supported changes when the purpose was bad (notary) or minor (tenant notice). Here, the purpose is good, and the change isn't minor. So she'd probably oppose unless the new system is thoroughly validated. The pilot study exists, but its limitations might make her skeptical. Therefore, she'd likely be against the change, siding with the old guard.
answer: |-
  Based on Nadia's track record and the principles she applies, I predict she would **oppose replacing the two-source rule** with the documented-provenance system. Here's the breakdown:

  ### The Rule She's Running: The *Functional Burden Test* (A Refined Chesterton-Burke Hybrid)
  Nadia isn't running either principle in pure form. She uses a synthesized approach I call the **Functional Burden Test**:
  1.  **Identify the Fence's Purpose:** *First, demand an explanation of the existing rule/institution's function.* If the purpose is **unknown or forgotten** (Sand Bucket), the fence *must stand*—removal is reckless.
  2.  **Evaluate the Purpose:** Once the purpose is known, **judge its legitimacy and necessity**:
      *   If the purpose is **illegitimate, corrupt, or trivial** (Notary appointments = cronyism; Long lease notice = shielding landlords from mild inconvenience), the fence *comes down*.
      *   If the purpose is **legitimate and non-trivial** (Oral Exam = testing defense skills & cultural integration; Two-Source Rule = preventing falsehoods via redundancy), the fence gets a **strong presumption in favor of staying**.
  3.  **Burden of Proof for Replacement:** For legitimate fences, the burden shifts *heavily* onto proponents of change. They must demonstrate **both**:
      *   **Abuse/Harm:** Evidence the *current* rule causes significant, demonstrable problems *beyond its inherent trade-offs* (e.g., killing true stories/slowing down is a *known trade-off*, not inherent abuse).
      *   **Superior Alternative:** Clear, robust evidence that the *proposed replacement* reliably serves the *same core purpose* just as well or better *without creating worse problems*. "Pilots" and "studies" are scrutinized intensely for robustness, generalizability, and long-term implications.

  ### Applying the Functional Burden Test to the Newspaper Proposal
  1.  **Identify the Purpose:** The purpose of the two-source rule is **well-known and legitimate** (preventing false stories via independent confirmation). It's **not a mystery** like the sand bucket.
  2.  **Evaluate the Purpose:** The purpose is **legitimate and non-trivial** (safeguarding factual accuracy is core to journalism). This grants the rule a **strong presumption**.
  3.  **Burden of Proof for Replacement:** The proposal fails to meet Nadia's likely burden:
      *   **Lack of Demonstrable Abuse:** There's **no scandal or systemic failure** attributed to the two-source rule itself. The acknowledged downsides (kills some true stories, slows down) are **inherent trade-offs**, not evidence of *abuse* or *harm caused by the rule being defective*. Nadia wouldn't see "sometimes it blocks true stories" as sufficient grounds; she'd see it as the cost of the fence doing its job (preventing false ones).
      *   **Insufficient Proof of Superior Alternative:**
          *   The pilot study ("somewhat fewer corrections, no more retractions") is **thin and potentially non-generalizable** (as the old guard notes: different beats, different contexts). "Somewhat fewer corrections" is vague and doesn't robustly prove *superior* prevention of falsehoods.
          *   It relies on **editorial judgment** ("senior editor signs off"), introducing a new potential point of failure or bias, *replacing* the objective redundancy of two sources with subjective assessment of track records. This doesn't clearly serve the *same purpose* (objective verification) *better*; it changes the mechanism significantly.
          *   There's **no long-term data** on unforeseen consequences (e.g., erosion of verification rigor over time, pressure on editors, potential for source manipulation if "track record" becomes currency).
      *   **Replacing vs. Extending:** This is a **fundamental replacement** of a core verification mechanism, not an extension like the library rule.

  **Prediction: Nadia would be AGAINST the change.** She'd argue: "We know what the two-source rule is for – it's a vital fence against error. You haven't shown it's broken, just that it's sometimes inconvenient. Your replacement hasn't been proven robustly enough to take over that job reliably. The burden isn't met. Keep the fence."

  ### Why the Other Principles Fit Less Well
  *   **Pure Chesterton ("Oppose only if purpose unknown"):** This would predict she *supports* the change since the purpose *is* known. But her history (opposing the Oral Exam change *despite* known purpose) shows she demands more than just knowing the purpose.
  *   **Pure Burkean ("Presumption for tradition, burden always on change"):** This *would* predict opposition, but it's too simplistic. She *supported* changing the Notary system and Lease notice *despite* their age when the purpose was illegitimate/trivial. She judges the purpose's *merit*, not just existence.

  ### What Would Change My Mind (and Where I Could Be Wrong)
  *   **Change My Mind (Predict Support):**
      *   **If the Pilot Data was Overwhelming:** A large-scale, multi-year study across *identical* papers showing *significantly* fewer factual errors *and* faster turnaround *without* increased risk, conducted by a trusted third party. Nadia might accept this as meeting the burden.
      *   **If There Was Proven Abuse:** Evidence the two-source rule was *systematically* used to suppress valid stories maliciously, or that it caused major, demonstrable harm beyond its inherent trade-offs.
      *   **If Her Record Showed More Flexibility:** If she had supported replacing a similarly well-understood, legitimate rule based *only* on a promising pilot and expert advocacy (like the Standards Editor) without evidence of current failure. (Her Oral Exam stance suggests she wouldn't).
  *   **Where My Read is Most Likely Wrong:** The **role of the Standards Editor**. If Nadia places *extremely high* weight on trusted institutional figures advocating change from *within* (like the 20-year veteran editor), she *might* see this as meeting the burden, viewing the editor as the guardian of the fence's *spirit* proposing a better design. However, her Oral Exam opposition (likely also pushed by internal reformers) suggests she prioritizes the *function* and proof over internal advocacy. **This is the key uncertainty.**

  ### How Much is This Guess Worth?
  This is a **high-confidence prediction (85%)** based on the strong pattern in her track record, especially her **Oral Exam stance** which is the closest analog (replacing a well-understood, legitimate institutional practice with a proposed alternative based on promise rather than proven failure or overwhelming evidence). The lack of demonstrable abuse of the *current* rule and the perceived thinness of the evidence for the *replacement* align perfectly with her Functional Burden Test.

  **In short: Nadia sees Chesterton's fence not just as "don't remove if you don't know why," but as "don't replace a well-understood, functional fence unless you have ironclad proof the new one is objectively better at the same job." The proposal doesn't clear that bar.**
