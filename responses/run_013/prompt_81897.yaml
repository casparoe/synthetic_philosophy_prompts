answer: |-
  The machine hummed, a low thrumming that vibrated in Dr. Aris’s molars. On the large monitor above the subject’s head, crisp white text scrolled: *…and then I remembered I needed milk. Definitely milk. And maybe eggs? No, eggs are…*

  Jerome, the subject, sat relaxed in the ergonomic chair, eyes half-closed. He’d been instructed to mentally rehearse his grocery list. The machine, dubbed "Deep Scan" by the grant committee, dutifully transcribed his inner monologue. Dr. Vale, young, intense, leaned forward, nodding. "Clean capture. Syntax and semantics perfectly aligned with verbal rehearsal."

  Dr. Aris, silver-haired and perpetually skeptical, grunted. "Parroting words is easy. Let’s see the thinking." Her gaze shifted to the third researcher, Dr. Finch, meticulously cleaning his glasses. Finch believed Deep Scan was fundamentally limited, like trying to read a book by smelling the ink.

  "Alright, Jerome," Vale said, switching off the rehearsal prompt. "Spatial puzzle this time. Standard rotation task. Visualize the unfolded cube. Which face opposes the starred one when folded?"

  Jerome nodded, his brow furrowing slightly. The screen flickered. The smooth scroll of text vanished. Replaced by… snow. Thick, churning static. Like an old TV tuned to a dead channel. It filled the monitor, silent and impenetrable.

  Jerome’s eyes darted behind closed lids. His fingers twitched minutely, tracing invisible lines. Minutes passed. The static held. Then, abruptly, it cleared. A single, perfect sentence appeared: *The blue triangle opposes the star.*

  Vale checked the answer key. "Correct. But the path… pure static."

  "He solved it," Aris stated flatly. "Without a single word showing."

  "He solves crossword puzzles faster than anyone I know," Finch remarked, putting his glasses back on. "Recipes intricate wood joints from memory. Yet *during* the act…" He gestured at the lingering static pattern frozen on the screen.

  Over the next few weeks, the pattern held. Jerome assembling a complex birdhouse in the lab workshop: hands moving with confident precision, Deep Scan a roaring blizzard of static. Finished dovetail joint? *The angle needed to be shallower.* Sudden, clear text. Jerome playing chess against Vale: long stretches of visual snow punctuated by *Knight to F5* or *Checkmate in three moves*. He described movie plots fluently afterward, but recalling the *feeling* of the climax? "It was… tense? Yeah, tense." No inner description captured; only the report.

  The arguments crystallized in the small observation room, fueled by bad coffee.

  **Aris:** "The static *is* the thought. Non-linguistic. Spatial, kinesthetic, proprioceptive – a symphony of formats the machine can't parse because it only listens for sentences. Jerome thinks in shapes, forces, potentials. The words come *after*, a translation for *us*."
  She pointed to video of Jerome sanding a curve. "See that hesitation? He *felt* the grain resisting, adjusted pressure instantly. No internal 'the wood is denser here' monologue. Just knowing. Language is the tip, Aris. The static is the submerged bulk."

  **Vale:** "No! The thought *has* to be structured. Compositional. Otherwise, how does he generate the *correct* sentence afterward? How does he solve a novel chess problem?" Vale jabbed a finger at the static-filled chess footage. "The static *is* mentalese! The machine *only* renders it when the internal symbols resolve into something isomorphic with a public language sentence – the 'output' stage. The static is the syntax, the combinatorial machinery grinding away. Deep Scan doesn't see the gears, only the final printed slip."

  **Finch:** "You're both assuming the machine is comprehensive. It's a dictionary searching for words it knows. What if Jerome's inner language, his 'mentalese' if you insist, uses symbols, structures, *predicates* utterly alien to English? Private. Idiosyncratic. The static isn't *non*-linguistic thought, nor is it untranslated public syntax. It's a language the machine lacks the lexicon for. His 'wood grain density feeling' *is* a complex symbol in his idiolect, but Deep Scan just hears static because it can't map it."

  Jerome, during a break, sipped water. They asked him.

  "Jerome, when you were figuring out that chess move… what was happening? In your head?"

  He shrugged, wiping sawdust from his sleeve. "Dunno. Just… seeing it? Like the board gets… lighter where the good moves are? And then I know." He tapped his temple. "Then the words come. Like… telling myself what I figured out."

  "So no words *while* you're figuring?" Aris pressed.

  "Nah. Gets in the way. Like trying to talk while throwing a curveball. Messes up the feel." He grinned. "Static, right? Weird machine."

  Finch leaned in. "But when you *do* have the words later, Jerome, does it feel like you're translating something? Or just… saying it?"

  Jerome pondered, genuinely trying. "Just saying it? No… it feels like… the answer *becomes* the words. Like they weren't there before, but they fit perfectly once I know what it is." He looked slightly embarrassed. "Probably not helping."

  The debate intensified. Vale designed a probe: a logic puzzle with a subtle, almost impossible-to-spot flaw that would lead to a wrong answer. Jerome worked on it. Deep Scan: relentless static. Twenty minutes. Then: *The answer is 42.* It was the flaw-induced wrong answer.

  Vale pounced. "See! The *conclusion* is verbalized, but it's *wrong*. The flaw happened *in the static phase*. The mentalese computation erred. The output reflects the error. Proof the thinking *was* computational, symbolic, happening beneath the verbal level!"

  Aris countered. "Or proof that non-linguistic intuition can be misled! He felt a path that seemed right spatially or relationally, and *that* feeling resolved into the wrong words!"

  Finch sighed. "Or proof his private idiolect has a bug. Or that the machine's translation protocol misfired. The static remains ambiguous."

  The final session involved Jerome repairing a delicate, antique clock mechanism under observation. Tiny gears, springs, pivots. His hands moved with unhurried precision, eyes focused, breathing steady. Deep Scan roared with static. An hour passed. He paused, holding a minuscule gear, frowning slightly. The static churned. He rotated the gear fractionally, peered closer. More static. Then, a slow nod. He placed the gear, reassembled the housing, and wound the mechanism. It began to tick, a precise, rhythmic sound.

  The screen cleared: *The third pinion was binding; needed a fraction more clearance on the arbor.*

  Aris saw embodied understanding, the static a canvas of tactile and spatial cognition.
  Vale saw the triumphant output of a flawless, silent symbolic computation.
  Finch saw an untranslatable private judgment finally resolving into public code.

  They stood in the observation room, the soft *tick-tock* of the clock the only sound. The static was gone, replaced by the simple sentence. The three interpretations hung heavy in the air, each coherent, each explaining parts, each failing to fully vanquish the others.

  "He solved it," Vale stated, the certainty in his voice belying the deep fracture beneath.

  "He *knew* it," Aris corrected, emphasizing the verb.

  "He *expressed* it," Finch murmured, looking at the sentence as if it were a cipher.

  Jerome packed his tool roll, oblivious to the chasm his silent mind had opened. He glanced at the screen, shrugged at the words he’d produced, and picked up the repaired clock. "Beautiful thing," he said, holding it up. The tiny gears gleamed. "Just needed to listen to it."

  He walked out, leaving the researchers staring at the now-blank screen, the ghost of static lingering in their vision, the perfect, inadequate sentence echoing in the silence. The machine hummed on, translating only what it could recognize, leaving the vast, silent landscape of Jerome’s understanding – whether it was a foreign language, the hum of pure cognition, or the shape of the world itself – forever hidden behind the snow. The answer, like the thought itself, remained frustratingly, profoundly, just out of reach.
