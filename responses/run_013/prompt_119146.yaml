  Assume: If you make a number a target, it becomes a bad measure. (from 1 and 2)

  Premise: To improve, you must use a number as a measure. (3)

  Therefore, when you try to improve, you must use a number, but it becomes bad, so you can't tell if you're improving. (4)

  But improvement happens, so contradiction.

  Therefore, one of the assumptions must be false.

  The weak link is that "making a number a target doesn't always make it a bad measure."

  Or, "using a number doesn't necessarily mean making it a target."

  In (3), "use some number to tell" might not mean making it a target; it might just be for information.

  But in the context of improvement, if you're serious, you might focus on it, making it a de facto target.

  My friend says that watching it makes it a target in people's minds.

  So perhaps the distinction between whip and window is blurry.

  But for the sake of the argument, he needs to drop premise (2) as an absolute statement.

  He has to give up the idea that any targeted measure becomes completely useless.

  Instead, he can accept that measures can be degraded but still useful, or that with multiple measures, you can mitigate the problem.

  In the depot example, if they watch the on-time delivery rate, drivers might rush, but if they also monitor safety or customer complaints, they can balance it.

  So by using multiple numbers, you can avoid flying blind.

  Therefore, premise (3) is fine, but (2) needs to be qualified.

  Premise (2) should be: making a number a target can reduce its reliability as a measure, but not necessarily to zero.

  Then (4) doesn't follow because you might still have useful information.

  Moreover, from (1), with rewards, it might be worse, but without rewards, with monitoring, it might be less corrupted.

  But my friend insists that monitoring is as bad.

  In that case, he might need to drop the idea that monitoring always corrupts.

  But let's see what he has to give up.

  Another point: in step (1), it says "reward people for pushing a number up," which implies extrinsic motivation.

  But people might care about the underlying goal intrinsically.

  For example, if employees believe in the mission, they might not game the system even if measured.

  But that might not be reliable.

  In reality, organizations can improve by having good metrics that align with goals and by fostering a culture where people don't game the system.

  But that's a bit vague.

  I think the most straightforward way is to reject premise (2) as stated.

  Premise (2) says: "any number you make a target stops telling you about that thing."

  But it should be: "making a number a target can cause it to become less reliable or stop telling you about the thing, but it depends on the context."

  Then, since it's not always true, (4) doesn't always happen, so organizations can improve by using numbers wisely.

  Also, for (3), using a number doesn't necessarily mean making it the sole target; you can use it as one indicator among many.

  In fact, the phrase "use some number to tell" doesn't imply exclusivity.

  So in (4), "ends up flying blind" assumes that the number is the only way, which isn't stated.

  Therefore, the slide might be between (3) and (4), or (2) is too strong.

  I think (2) is the key.

  Let me see what the friend said about strains: sometimes the number turns noisy, etc., which means it doesn't completely stop telling, but becomes less accurate.

  So even when targeted, it might still convey some information.

  For example, if people lie, but you have audits, you might catch it.

  Or if the underlying thing changes, it might be for the better.

  In cases where gaming doesn't happen or is minimized, the number remains good.

  So premise (2) is false as an absolute.

  Therefore, he should drop premise (2) and accept that targeted measures can still be informative, though with risks.

  What does he have to give up? He has to give up the idea that once a measure is targeted, it's completely useless. Instead, it might be degraded but usable, or manageable with other controls.

