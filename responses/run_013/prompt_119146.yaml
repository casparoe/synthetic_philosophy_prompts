prompt: |-
  A friend who runs a delivery depot has been argueing himself into a knot over that line about a measure ceasing to be a good measure once it becomes a target. He wrote it out and wants me to find the loose thread:

  (1) Whenever you reward people for pushing a number up, some of them will push it up in ways that don't move the thing it was supposed to track.
  (2) So any number you make a target stops telling you about that thing.
  (3) Any outfit that wants to improve has to use some number to tell whether it's improving.
  (4) So any outfit that tries to improve ends up flying blind.
  (5) But lots of outfits obviously do improve. So something's off.

  I said the slide is between (1) and (3): (1) is about paying people on a number, (3) is only about watching one, and a number nobody's paid on stays honest. He says that's cheap — everyone in the depot knows which number the bosses watch, so watching it rots it just as surely as paying on it does; he calls the two the same disease whether the number is a whip or a window. And he says the disease comes in strains anyway: sometimes the number just turns noisy at the extremes you're now shoving toward, sometimes shoving it actually changes the thing underneath, sometimes people just lie. Now I can't tell if whip/window is a real line or a comfortable one. Which premise should he drop, and what does he have to give up to drop it?
reasoning: |-
  I need to help my friend who's tangled in this argument about measures becoming targets and ceasing to be good measures. He's got this chain of reasoning:

  (1) When you reward people for increasing a number, some will do it in ways that don't actually improve the underlying thing it's supposed to measure.

  (2) Therefore, any number you make a target stops being a reliable indicator of that thing.

  (3) Any organization that wants to improve must use some number to track progress.

  (4) So, any organization trying to improve ends up flying blind (because the number is corrupted).

  (5) But since many organizations do improve, there must be a flaw in this reasoning.

  I suggested that the issue is between (1) and (3): (1) is about incentivizing with rewards, while (3) is just about monitoring, and monitoring without rewards might keep the number honest. But my friend argues that even just watching a number can corrupt it because people know it's being monitored, so it's the same problem whether it's a "whip" (incentive) or a "window" (monitor).

  He also says that the corruption can happen in different ways: the number might become noisy when pushed to extremes, the underlying thing might actually change, or people might lie.

  Now, I need to figure out which premise he should drop and what he has to give up to do that.

  First, let's look at the logic step by step.

  From (1) to (2): (1) says that when you reward based on a number, it can be gamed. (2) says that making it a target stops it from telling you about the thing. But (2) seems like a generalization from (1). However, (1) specifies "reward," but (2) says "make a target," which might include monitoring without direct rewards.

  My friend claims that monitoring is as bad as incentivizing because people respond to what is measured, even without explicit rewards. This is similar to Goodhart's law, which says that when a measure becomes a target, it ceases to be a good measure.

  Goodhart's law doesn't specify whether it's due to incentives or just measurement; it's about the measure being targeted.

  In this case, (1) is a specific instance of Goodhart's law with rewards.

  But (2) is stating Goodhart's law more broadly.

  Then (3) says that to improve, you need to use a number to track progress.

  (4) says that if you use a number, it becomes corrupted, so you're blind.

  (5) points out that improvement happens, so contradiction.

  Therefore, the flaw must be that (2) is not always true; that is, making a number a target doesn't always make it stop telling you about the thing.

  In other words, it's possible to have a measure that, even when targeted, still correlates with the underlying goal.

  Or, that you can use multiple measures or other methods to mitigate the issue.

  But my friend is saying that even monitoring alone corrupts it.

  He needs to drop or modify premise (2).

  Premise (2) says: "any number you make a target stops telling you about that thing."

  But this is absolute: it says "stops telling," implying it becomes useless.

  In reality, it might become less informative, but not entirely useless, or it might depend on the context.

  For example, if you have a good measure and you target it carefully, it might still be informative.

  Or, if you use it as one of many indicators.

  But premise (3) says "use some number," which might imply relying on it primarily.

  The argument is that for improvement, you need to use a number, but if you use it, it corrupts.

  But organizations do improve, so (2) can't be universally true.

  Therefore, (2) should be weakened.

  Perhaps (2) is too strong because it assumes that all targeting leads to complete corruption, but it might only lead to partial corruption or it might be manageable.

  In that case, premise (1) is about reward, but (2) extends to any targeting, including monitoring.

  My friend says monitoring is as bad as rewarding.

  But is that true?

  In some cases, just monitoring might not lead to gaming if there are no stakes. If people know a number is watched but it doesn't affect their rewards or punishments, they might not bother gaming it.

  However, in a work environment, if bosses are watching a number, it might implicitly affect evaluations, promotions, etc., so there could be indirect incentives.

  So in practice, monitoring might often lead to similar behaviors.

  But not always.

  For instance, if the number is used for diagnostic purposes only, and people trust that it won't be used against them, it might stay honest.

  But that might be idealistic.

  In the context of the delivery depot, where there might be performance pressure, monitoring could lead to gaming.

  But let's think about what he has to give up.

  The conclusion is that organizations can improve, so they must be able to use numbers without complete corruption.

  Therefore, premise (2) must be false or not always true.

  So he should drop or modify premise (2).

  Premise (2) says: "any number you make a target stops telling you about that thing."

  He could change it to: "making a number a target can reduce its reliability" or something like that.

  Then, from (1) and (2), it might not lead to (4) flying blind, because the number might still be somewhat informative, or you can use multiple numbers.

  Premise (3) says "use some number," but it doesn't say use only one number.

  In (3), it says "use some number to tell whether it's improving," which might imply relying on it, but it doesn't preclude using multiple measures.

  In fact, in management, using a balanced scorecard with multiple KPIs is common to avoid this issue.

  Also, qualitative measures can be used alongside quantitative ones.

  So premise (3) might be too simplistic; it assumes that improvement must be tracked with a single number, but that's not necessarily true.

  Let's read (3): "Any outfit that wants to improve has to use some number to tell whether it's improving."

  This could be interpreted as needing at least one number, not that it's the only thing used.

  But in the context, it might be seen as the primary indicator.

  However, in the deduction to (4), it says "ends up flying blind," implying that the number is the only way to tell, and it's corrupted.

