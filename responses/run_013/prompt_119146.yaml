  But my friend mentioned different strains: sometimes the number becomes noisy, meaning it has more variance or less correlation at extremes; sometimes the underlying thing changes; sometimes people lie.

  In the case where the underlying thing changes, it might be that by pushing the number, you actually improve the thing, but in a way that has side effects.

  For example, if you target customer satisfaction, and you improve service, that might be good, but if you do it by bribing customers or something, it might not be.

  But if you genuinely improve, then the number is still telling you about the thing.

