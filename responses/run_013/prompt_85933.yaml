answer: |-
  Here’s a decision tree using your cases to guide users to key positions in the Hart-Devlin debate. Each node is a yes/no question about a concrete scenario:

  ### **Node 1: Sibling Sex Case**  
  *Two adult siblings have consensual, contracepted sex in private, are happy, and nobody else knows.*  
  **Q:** Is this act morally wrong?  
  → **Yes** → Go to Node 2  
  → **No** → **Harm Principle (Mill/Hart)**  
  *(No harmless wrongdoing exists; law only for harm prevention)*  

  ### **Node 2: Amputation Case**  
  *A competent adult has a healthy leg amputated by a willing surgeon and is grateful.*  
  **Q:** Should this act be a crime?  
  → **Yes** → Go to Node 3  
  → **No** → **Unnamed Position**  
  *(Harmless wrongdoing exists but is never criminalizable; only private reproach)*  

  ### **Node 3: Necrophilia Case**  
  *A man has sex with a corpse; the woman consented in advance, left no relatives, and no one else cares.*  
  **Q:** Why should this be criminal?  
  - **A:** It’s intrinsically wrong → Go to Node 4  
  - **B:** Society needs shared morals to survive → **Devlin Social Moralism**  
  - **C:** It’s extremely disgusting → Go to Node 6  
  - **D:** It harms the agent (even if they disagree) → **Paternalism**  

  ### **Node 4: Slave Role-Play Case**  
  *Two adults do consensual slave-owner role-play in private, no audience.*  
  **Q:** Is this criminalizable *only* if combined with another factor (e.g., risk of harm)?  
  → **Yes** → **Impure Moralism**  
  *(Wrongness + another principle, e.g., slippery slope)*  
  → **No** → **Pure Legal Moralism**  
  *(Wrongness alone justifies criminalization)*  

  ### **Node 6: Public Toilet Case**  
  *Two men have sex in a locked public toilet cubicle that nobody else uses.*  
  **Q:** Does the *public location* (even if unused) make it criminalizable?  
  → **Yes** → **Offense Principle**  
  *(Preventing public disgust/offense justifies law)*  
  → **No** → **Public Wrongs View**  
  *(Crimes require acts that violate public norms/trust, not just private acts)*  

  ---

  ### **Key Positions & Notes:**  
  - **Leaves Covered:**  
    - Harm Principle (Mill/Hart)  
    - Devlin Social Moralism  
    - Pure Legal Moralism  
    - Offense Principle  
    - Paternalism  
    - Public Wrongs View  
    - Impure Moralism  
    - Unnamed Position (wrong but never criminal)  

  - **Unseparated Leaves:**  
    - *Pure* vs. *Impure Moralism* share early branches but split at Node 4.  
    - *Public Wrongs View* and *Offense Principle* split at Node 6.  

  - **Unoccupied/Problematic Combinations:**  
    - **"No" at Node 1 + "Yes" at Node 2:** *Incoherent* (can’t criminalize acts deemed *not wrong*).  
    - **"Disgust (C) + No at Node 6":** *Repulsive but coherent* (e.g., criminalizing *only private* disgusting acts). No major theorist holds this.  
    - **"Intrinsic Wrongness (A) + Yes at Node 4":** *Unexplored* (Impure Moralism rarely focuses *only* on intrinsic wrongness).  

  ### **Tree Logic Summary:**  
  1. **Wrongness?** (Siblings) → 2. **Criminalize?** (Amputation) → 3. **Grounds?** (Necrophilia) → 4. **Pure/Impure?** (Role-play) or 6. **Public/Private?** (Toilet)  

  This forces users to confront intuitions on cases before seeing positions. Positions like paternalism or offense principle emerge from grounding questions, not abstract labels.
