answer: |-
  ### 1. The job to be done  
  A theory of the value of knowledge must explain why knowledge is epistemically superior to mere true belief, satisfying the *Meno intuition* that knowledge is distinctively valuable even when true belief delivers identical practical success. It must resolve persistent puzzles like the *swamping problem*, handle apparent counterexamples (e.g., trivial truths), and clarify whether value arises from the believer’s agency, the belief’s stability, or external factors. Adequacy requires coherence under pressure from edge cases, avoiding circularity, and specifying the *kind* of value added.

  ### 2. The desiderata  
  1.  **Overcoming Swamping**: *The theory must explain how knowledge adds value not "swamped" by the value of truth.*  
      Motivation: If truth is the sole epistemic good and reliability is only instrumentally valuable for achieving truth, a reliably formed true belief seems no more valuable than a luckily true one.  

  2.  **Larissa Parity Challenge**: *The theory must explain the value of knowledge even when it confers no practical advantage over true belief.*  
      Motivation: In the Road to Larissa, both travelers succeed identically; knowledge’s extra value must be non-instrumental (e.g., stability, creditworthiness, or cognitive achievement).  

  3.  **Trivial Truth Constraint**: *The theory must either restrict knowledge’s added value to non-trivial truths or explain how trivial knowledge retains minimal value.*  
      Motivation: Knowing the number of dust specks on a windowsill seems worthless. If knowledge is always more valuable than true belief, trivial cases must be addressed without ad hoc exemptions.  

  4.  **Robustness Requirement**: *The theory must assign value to the modal stability of knowledge (i.e., resistance to error in nearby worlds).*  
      Motivation: In cases where knowledge and true belief yield identical outcomes *now* but diverge under slight changes (e.g., misleading evidence), knowledge’s resilience must confer value (e.g., dependability).  

  5.  **Deference Transmission Test**: *The theory must explain whether/knowledge-by-deference (e.g., trusting an opaque GPS) has value matching knowledge-by-own-cognition.*  
      Motivation: If a layperson’s belief from an authoritative but incomprehensible source counts as knowledge, the theory must justify its value without crediting personal cognitive labor; if not, it must explain what’s missing.  

  6.  **Universality of Value Claim**: *The theory must uphold that knowledge is *always* more valuable than corresponding true belief, barring trivial cases.*  
      Motivation: The Meno intuition implies a general superiority of knowledge; if some non-trivial knowledge isn’t better, the core claim fails.  

  7.  **Non-Circular Value Grounding**: *The theory must avoid defining knowledge’s value solely in terms of properties already entailed by true belief + its source.*  
      Motivation: Swamping arises if "reliability" is valued only instrumentally to truth; value must derive from distinct features (e.g., understanding, agency).  

  8.  **Credit Attribution**: *The theory should explain why knowledge often merits credit to the believer that mere true belief does not.*  
      Motivation: Intuitively, a detective who *knows* (vs. guesses) the culprit’s identity deserves epistemic credit; this links to responsibility and achievement.  

  ### 3. Fault lines  
  - **Larissa Parity vs. Robustness Value**: If knowledge adds *no* practical value (Larissa), but resilience (Robustness) matters only counterfactually, is that resilience valuable *now*?  
  - **Universality vs. Trivial Truth Constraint**: Requiring *all* knowledge to be better than true belief conflicts with the intuition that trivial knowledge is worthless.  
  - **Credit Attribution vs. Deference Transmission**: If knowledge requires *personal* cognitive achievement (Credit), deference-based beliefs struggle to qualify; if they do qualify (Deference), credit to the believer diminishes.  

  ### 4. Non-negotiable versus camp-specific  
  **Non-negotiable** (Minimal conditions for any adequate theory):  
  1.  Overcoming Swamping  
  2.  Larissa Parity Challenge  
  3.  Non-Circular Value Grounding  

  **Camp-specific** (Reflecting theoretical preferences):  
  1.  Credit Attribution (Prioritized by virtue epistemologists)  
  2.  Deference Transmission (Often downplayed by internalists/strict virtue theorists)  
  3.  Universality of Value Claim (May be relaxed by pragmatic or contextualist views)  

  ### 5. The most exclusionary requirement  
  **The Deference Transmission Test** is the most exclusionary. It rules out any theory requiring *first-person cognitive achievement* for knowledge’s full value (e.g., robust virtue epistemology). If knowledge by deference to an opaque source lacks value, it must explain why such beliefs aren’t knowledge despite reliability (straining externalism). If deference *transmits* value, it challenges internalist demands for accessible reasons. This test forces a choice: either knowledge’s value can be "borrowed" (undermining credit-based views), or deference-based beliefs aren’t knowledge (undermining externalist accounts of testimonial knowledge). It thus excludes most pure virtue theories and rigid internalist views simultaneously.
