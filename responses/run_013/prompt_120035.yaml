answer: |-
  ### Final Exam Essay Question (90 minutes)
  **Question:** It is often claimed that omissions can be causes because they satisfy counterfactual dependence (e.g., "Had I watered the plant, it would not have died"). Yet counterfactual dependence alone cannot explain why we single out *specific* omissions as causes while ignoring countless others that satisfy the same counterfactual criteria. Using **at least two distinct examples** (one involving a failure to act by a responsible agent, and another involving symmetrical overdetermination by multiple potential actors), defend the thesis that "causation by omission" is not a metaphysically distinctive phenomenon but a product of *norm-driven causal selection*. Explain why counterfactual analyses fail to resolve which omissions "count" as causes, and demonstrate how norms resolve apparent overdetermination in omission cases. You may not treat all counterfactually sufficient omissions as equally causal.

  ---

  ### Model Answer (Strong Student, ~700 words)

  The counterfactual approach to omissions—where an omission causes an outcome if the outcome would not have occurred had the omitted action been performed—appears initially persuasive. After all, the plant *would* have lived had the gardener watered it, or the swimmer *would* have survived had the lifeguard intervened. Yet this analysis is causally promiscuous: it identifies innumerable omissions as "causes" for any given event. When a gardener fails to water her plant, causing its death, the same counterfactual holds true for her failure to install sprinklers, her neighbour’s failure to water it, and every stranger’s failure to teleport into the greenhouse with a watering can. Similarly, when a swimmer drowns, her death counterfactually depends on the inaction of the on-duty lifeguard (who was distracted), but also on the dozen sunbathers who ignored the struggle, and even on a passerby miles away who could have theoretically rushed to save her. If causation is merely counterfactual dependence, *all* these omissions are causes—but intuitively, we blame only the gardener and the lifeguard. This mismatch reveals that the core problem isn’t whether omissions *can* be causes, but *which ones we select*, and why.  

  Counterfactual symmetry cannot solve this selection problem. Consider two off-duty lifeguards, Alex and Sam, sunbathing near the drowning swimmer. Each could have thrown a life ring; either action would have saved her. Neither acts. Here, the swimmer’s death counterfactually depends on Alex’s omission (had Alex acted, she’d have lived) *and* Sam’s omission (had Sam acted, she’d have lived). The counterfactuals are perfectly symmetrical, just as they are between the on-duty lifeguard and the sunbathers in the original case. Yet we wouldn’t treat Alex and Sam symmetrically if Alex had a duty to patrol that section of the beach while Sam was merely relaxing. This shows that counterfactual dependence cannot distinguish *which* omission is salient; it only confirms that many omissions are *candidates* for causation.  

  The selection of "the cause" among these candidates is driven by normative expectations, not metaphysics. Norms—moral, institutional, or role-based—filter the chaos of counterfactual overabundance. The gardener’s omission "counts" because she assumed responsibility for the plant, creating an expectation of care. The lifeguard’s omission "counts" because their job creates a duty to act, unlike sunbathers or distant strangers. In the dual-lifeguard case, if Alex alone had duty-bound responsibility, we’d select Alex’s omission as the cause despite Sam’s identical counterfactual relevance. Crucially, this selection isn’t about discovering a *sui generis* causal relation ("omission-causation"); it’s about pragmatically highlighting *which* counterfactual dependency matters *to us* given contextual norms.  

  This norm-based resolution avoids the absurdity of treating all omissions as equally causal. Metaphysically, omissions lack the productive "oomph" of positive events (like a rock smashing a window); they are absences. Their causal status is thus derivative of our explanatory interests. When we say "the gardener’s neglect caused the death," we aren’t identifying a brute fact about the universe’s causal structure. We’re asserting that, among countless counterfactual dependencies, her omission violated a salient norm that makes her failure explanatorily pivotal. Counterfactuals provide necessary conditions for causal candidacy, but norms provide sufficient conditions for selection.  

  In conclusion, omissions are not causes in virtue of intrinsic metaphysical properties. "Causation by omission" is a label we apply when norm violations align with counterfactual dependencies. The gardener case privileges her omission due to role-based expectations; the lifeguard case privileges duty over bystanders; and the dual-lifeguard case shows norms breaking counterfactual symmetry. To treat omissions as metaphysically distinctive is to confuse our normative scissors—which cut the causal fabric where we deem it significant—with the fabric itself.  

  ---

  ### Marking Scheme (5 x 4 = 20 points)
  | **Must-Hit Point (4 marks)** | **Common Mistake (Costs Marks)** |
  |------------------------------|----------------------------------|
  | **1. Explicitly rejects counterfactual sufficiency** for selecting *which* omission is causal, using an example showing multiple omissions satisfy dependence (e.g., gardener + strangers or lifeguard + sunbathers). | *Mistake:* Only arguing omissions *can* be causes via counterfactuals without addressing overabundance. |
  | **2. Deploys a symmetrical overdetermination case** (e.g., two potential rescuers) to prove counterfactual symmetry ≠ causal symmetry. | *Mistake:* Treating preemption via positive actions (e.g., two archers) instead of omissions, failing the analogue requirement. |
  | **3. Attributes causal selection to norms** (duties/expectations) and **contrasts this with counterfactuals**, showing norms resolve overdetermination (e.g., lifeguard’s duty > sunbathers). | *Mistake:* Vaguely gesturing at "responsibility" without explaining *how* norms select causes where counterfactuals cannot. |
  | **4. Defends the "artifact of selection" thesis** by arguing omissions lack intrinsic causal power & their status derives from explanatory interests/norms. | *Mistake:* Conceding omissions are metaphysically special or retreating to "all omissions are causes." |
  | **5. Integrates examples cohesively** to build the argument, showing how norms privilege *specific* omissions (gardener/lifeguard) while excluding others. | *Mistake:* Isolating examples without synthesizing them under the thesis or misapplying norms (e.g., blaming sunbathers). |

  ---

  ### Why This Works
  - **Forces Engagement**: Students cannot pass by reciting "omissions can be causes." The question *demands* confronting overabundance and selection.
  - **Thesis Commitment**: Rejecting or defending the norm-driven selection thesis is unavoidable; waffling violates the prompt’s constraints.
  - **Preemption Analogue**: The dual-lifeguard case blocks standard positive-causation solutions (e.g., late preemption) by requiring omission-only reasoning.
  - **Self-Contained**: Examples are embedded; no texts/authors needed. Strong answers echo the professor’s framing ("artifact," "hopelessly abundant").
  - **Rubric Precision**: Each must-hit point targets a conceptual leap from the seminar. Missing any reveals superficial understanding.
