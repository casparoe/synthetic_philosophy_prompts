answer: |-
  ### **The Practice in Plain Terms**  
  The machinery is a state-controlled border regime common to most liberal democracies. Its core parts are:  
  - **Categorization**: Entry is lawful only if the traveler fits a pre-defined state-approved purpose (e.g., tourism, work, study).  
  - **Pre-emptive Screening**: Border officers assess the sincerity of a traveler’s stated intent *before* entry, treating intention as actionable.  
  - **Delegated Enforcement**: Airlines, employers, and landlords act as state proxies. Airlines face fines for transporting inadmissible passengers; employers/landlords verify immigration status during hires/leases.  
  - **Differential Illegality**: Unauthorized entry (crossing a border without inspection) is treated as a crime in some states (e.g., the U.S.), while overstaying a visa is a civil violation—even though both result in identical physical presence.  

  *Common*: Purpose-based entry, delegated checks, and pre-entry intent scrutiny are near-universal. *Peculiar*: The U.S.-style criminalization of unlawful entry (vs. civil overstay) is exceptional.  

  ---

  ### **What the Machinery Presupposes**  
  The machinery assumes a theory of **territorial sovereignty as collective self-ownership**.  

  1. **The Right to Exclude**:  
     - States claim an inherent right to control borders as an extension of **popular sovereignty**—the idea that a self-governing community owns its territory and may exclude outsiders to protect its members’ interests (security, culture, resources). This right is vested in the state as the people’s agent.  

  2. **Asymmetry of Exit/Entry**:  
     - Exit is a right against one’s *own* state (preventing tyranny). Entry is a privilege because it imposes obligations on a *foreign* community. Your departure doesn’t compel others to accept you; your entry demands their resources.  

  3. **Legitimacy of Presence**:  
     - Mere existence doesn’t grant entry rights. Presence is legitimate only via **consent**—expressed through predefined categories. The state licenses entry when it perceives net benefits (e.g., skilled workers) or reciprocal obligations (e.g., treaty-based tourism).  

  4. **Burden of Justification**:  
     - The entrant bears the burden. They must prove they fit a state-approved purpose *and* intend to comply. The state presumes exclusion unless the traveler meets its terms.  

  5. **Wrongdoing in Unauthorized Entry**:  
     - Unlawful entry is a **violation of sovereignty itself**—a trespass against the state’s gatekeeping authority. Overstaying breaches a **conditional grant** of presence (like violating a contract). Hence, the former is criminal (defiance of authority), the latter civil (breach of terms).  

  **If these commitments were absent**:  
  A state rejecting this theory might:  
  - Treat entry as a default right unless proven harmful.  
  - Abandon intent screening (no "pre-crime" for movement).  
  - Eliminate delegated enforcement (state handles all border checks).  
  - Equalize penalties for all unlawful presence.  

  ---

  ### **Presupposition or Accommodation**  
  The machinery **strictly requires** two ideas:  
  1. **State discretion over entry** (territory as exclusive club).  
  2. **Pre-emptive intent scrutiny** (suspicion as basis for exclusion).  

  It **accommodates but does not require**:  
  - **Nationalist theories**: The machinery works with claims that borders protect cultural homogeneity, but it doesn’t demand this. For example, states admitting diverse immigrants under skills-based visas show cultural protection isn’t essential.  
  - **Utilitarian theories**: While the system often optimizes economic gain (e.g., favoring high-skilled migrants), it doesn’t presuppose this. States can prioritize refugees (non-utilitarian) without altering the apparatus.  

  **How to tell**: The machinery functions identically whether a state excludes migrants for cultural, economic, or arbitrary reasons. Only the *exercise* of discretion changes, not its structure.  

  ---

  ### **What It Quietly Rules Out**  
  The apparatus rules out:  
  - **Cosmopolitanism**: The claim that borders are morally arbitrary and people have equal movement rights. The purpose-based entry system (*categorization*) assumes states may prioritize some lives/contributions over others.  
  - **Anarchism**: The delegation of enforcement to private actors (*airlines, employers*) assumes states can conscript non-state entities into coercive roles, rejecting the view that border control is inherently illegitimate.  
  - **Universal Human Right to Reside**: The differential treatment of unlawful entry vs. overstay (*penalty distinction*) implies presence alone isn’t wrongful—only the *manner* of achieving it is. This negates the idea that all humans have equal residence rights.  

  ---

  ### **Where the Machinery Is Silent**  
  The practice leaves open:  
  1. **Why sovereignty justifies exclusion?**  
     - *Open question*: Is exclusion inherent in statehood, or a contingent tool for welfare?  
     - *Evidence needed*: Whether states waive exclusion for distressed migrants (e.g., disaster victims) or treat it as non-negotiable.  

  2. **How strict should categorization be?**  
     - *Open question*: Must *every* entrant have a state-defined purpose, or could "personal pursuit" suffice?  
     - *Evidence needed*: Whether states ever grant visas for open-ended stays (e.g., "self-discovery" visas).  

  3. **Is intent scrutiny about risk or morality?**  
     - *Open question*: Does doubting a traveler’s sincerity reflect security concerns or distrust of migrant agency?  
     - *Evidence needed*: Whether officers probe intent identically for low-risk/high-risk nationals.  

  ---

  ### **The Other Theory, and What It Would Dismantle**  
  If freedom of movement were a right against *all* states:  
  - **Purpose-Bound Visas**: *Gone*. Entry could not require state-defined justifications.  
  - **Judgment of Sincerity**: *Gone*. No pre-emptive suspicion of intent.  
  - **Delegated Carrier Checks**: *Replaced*. Airlines might verify identity, not admissibility.  
  - **Private Verification**: *Replaced*. Employers/landlords couldn’t demand immigration status.  
  - **Unlawful Entry/Overstay Distinction**: *Collapsed*. Both would be equally permissible; penalties for presence would vanish.  

  **Surviving in altered form**:  
  - *Border inspections* for security/health (if narrowly tailored).  
  - *Registration* to track population flows, not exclude.  

  ---

  ### **Closing: Unified or Bundle?**  
  The machinery is a **bundle of accommodations**. Its parts cohere tactically (delegating enforcement saves state resources; categorization streamlines bureaucracy) but lack philosophical unity. The dissonance between "criminal entry" and "civil overstay" exposes this: if presence were the wrong, both would be punished equally. Instead, the system prioritizes defending the state’s gatekeeping ritual over logical consistency. It is a patchwork of sovereignty claims, utilitarian filters, and historical accidents—not a single doctrine.  

  *// This apparatus is less a fortress of principle than a fence held up by overlapping wires of convenience, fear, and habit. Your fiction might explore the human cost of that patchwork.*
