answer: |-
  A patient walks into a neurologist's office. "Doc," he says, "I can feel the burn of this lighter flame on my hand perfectly – location, intensity, you name it. It definitely *hurts*. But... it doesn't *bother* me. Not one bit. I don't even want to pull away." The doctor nods, "Ah, pain asymbolia. Your insula's damaged. The 'hurting' is there, but the 'minding' is gone."
  The patient looks thoughtful. "So... the pain isn't actually *bad*? It's just... information?"
  "Precisely!" says the doctor. "It's fascinating. We even have the reverse – folks feeling agonizing pain *before* they're touched, purely from anticipation. Their brain adds the 'badness' all on its own."
  The patient grins. "Brilliant! So I'm finally free from suffering? The pain's gone?"
  The doctor beams. "Exactly! Congratulations! You don't have pain at all."
