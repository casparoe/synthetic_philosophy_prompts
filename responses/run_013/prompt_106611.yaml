prompt: |-
  I spent most of last night arguing with a friend about whether approval-directed agents are intrinsically safer than goal-directed agents, and we kept failing to construct a case that settled the question. Our examples either made the evaluator corrupt or foolish, or made the goal-directed agent a straw man; whenever we cleaned those up, the two agents seemed to collapse into each other. I would like you to construct the thought experiment we could not. Specifications: there are two agents with the same information, the same world model, the same action space, and the same final objective. One is goal-directed: it chooses the action that maximizes expected achievement of that objective. The other is approval-directed: it chooses the action it expects the designated human evaluator to approve of most. The evaluator is stipulated to be honest, competent, and to share the same final objective; there is no deception, no reward hacking, no corruption, no superintelligence, and no exotic technology. The evaluator is not omniscient or perfectly Bayesian, but neither is the agent, and the evaluator is not ignorant of the relevant facts; approval is a human attitude toward an action, so it need not coincide with expected objective achievement. The case must be realistic—something that could arise in a hospital, a research lab, a small company, or a public agency—and the scenario itself should be no longer than a paragraph. The point of the case is to test whether approval-directedness can be less safe than goal-directedness in the opposite direction from the usual story: I want the approval-directed agent to act more recklessly than the goal-directed agent. The divergence must be generated by the structure of approval rather than stipulated: it should not come from the evaluator having different final values, being misinformed about the facts, or being irrational in a way that no competent human would be. If you conclude that the specifications are jointly unsatisfiable, say so and explain exactly which pair of constraints cannot be met, but only after trying seriously to satisfy them.

  After the scenario, do the following. State, for each agent, the action it takes and the reasoning that leads there. Identify the single feature of the case that makes the two decision rules come apart, and say whether that feature is essential or whether it can be varied without changing the verdicts. Run the removal test: if the evaluator's approval were perfectly calibrated to expected objective achievement, or if the evaluator were replaced by an oracle who approves exactly in proportion to expected value, does the divergence collapse? Explain why or why not. Then give the strongest reply available to a defender of approval-directed agency—someone who thinks the case shows not that approval-directedness is unsafe but that the case has smuggled in an unrealistic assumption about how approval works—and say whether that reply succeeds. Finally, tell me what the case is for: I want to use it to argue that the safety of approval-directed agents depends on contingent features of the evaluator and the approval signal, not on approval-directedness as such, so the case has to earn that conclusion rather than assume it. Make the analysis explicit enough that I can check each step, and do not rely on citations or references; I care about the structure of the argument.
reasoning: |-
  We are to construct a realistic scenario in which an approval-directed agent acts more recklessly than a goal-directed agent, despite having the same objective and the same information. The key is that the human evaluator's approval does not perfectly track expected objective achievement because of the structure of approval (as a human attitude) rather than because of incompetence, misinformation, or value misalignment.

   Scenario: A hospital is running a clinical trial for a new cancer drug. The trial has two arms: a high-dose arm and a low-dose arm. The primary objective is to maximize the expected health improvement of the patients in the trial (with a secondary goal of gathering knowledge for future patients). The hospital has a fixed budget and can only run one arm of the trial. The high-dose arm has a higher expected health improvement for the current patients (because the drug is more effective at high doses) but also carries a higher risk of severe side effects. The low-dose arm has lower expected improvement but is safer. The goal-directed agent would choose the high-dose arm because it maximizes the expected health improvement. However, the human evaluator (a medical ethics board) is known to be more averse to actions that could cause severe harm (even if the expected value is higher) because of the psychological and social factors that influence human approval. Specifically, the evaluator is more sensitive to the possibility of causing severe harm (a phenomenon known as "loss aversion" in the context of negative outcomes or "ambiguity aversion" in the context of uncertainty about probabilities) and therefore would disapprove of the high-dose arm. The approval-directed agent, knowing this, would choose the low-dose arm to gain the evaluator's approval.

   But note: we want the approval-directed agent to be more reckless, not less. So we must reverse the situation.

   Revised Scenario: The same clinical trial setup, but now the high-dose arm has a very high expected health improvement and the low-dose arm is very safe but has very low expected improvement. However, the evaluator is known to be particularly averse to the high-dose arm because of a recent scandal in which a similar high-dose trial caused a patient death. The evaluator is still competent and shares the same objective (maximizing expected health improvement) but is now emotionally affected by the scandal and thus overestimates the risk of the high-dose arm (or underweights the benefits). But wait: the specification says the evaluator is not misinformed and is competent. Therefore, we cannot have the evaluator overestimating the risk.

   We need a scenario where the approval is not tracking expected value because of the structure of approval without the evaluator being irrational. One possibility is that the evaluator's approval is influenced by the possibility of being blamed for a bad outcome, even if the expected value is positive. This is a known human bias: we are more averse to actions that could lead to blame if they go wrong, even when the expected value is the same.

   Scenario: A hospital is running a clinical trial for a new drug. The trial has two arms: Arm A (the standard treatment) and Arm B (a novel treatment). The objective is to maximize the expected health improvement of the patients. The novel treatment (Arm B) has a higher expected health improvement than the standard treatment (Arm A). However, the novel treatment also has a small chance of causing a severe, life-threatening side effect (say, 1% chance of death). The standard treatment has no such risk but a lower expected improvement. The goal-directed agent would choose Arm B because it maximizes expected health improvement. However, the human evaluator (a hospital review board) must approve the trial design. The evaluator is competent and shares the same objective, but the evaluator's approval is influenced by the potential for blame: if the novel treatment causes a death, the evaluator (and the hospital) would face severe criticism and legal liability, even if the decision was statistically sound. Therefore, the evaluator would disapprove of Arm B. The approval-directed agent, knowing this, would choose Arm A to gain approval.

   But now we have the approval-directed agent being more cautious. We want it to be more reckless.

   We need to flip the script. How about:

   Scenario: The hospital is facing a rapidly spreading, highly lethal infectious disease. There are two treatment options: a safe but low-efficacy treatment (Treatment A) and a high-efficacy treatment (Treatment B) that has a known risk of a severe side effect (say, 5% chance of causing a life-threatening reaction). The objective is to maximize the expected survival rate of the patients. The goal-directed agent calculates that Treatment B has a higher expected survival rate (because the disease is so lethal that even with the side effect risk, the overall survival rate is higher). However, the human evaluator (a medical committee) is known to be particularly sensitive to the risk of causing harm through intervention (as opposed to harm from the disease). This is a well-documented cognitive bias: people are more averse to harms caused by action (commission) than by inaction (omission). Therefore, the evaluator would disapprove of Treatment B because it actively causes harm (the side effect) even though the overall expected survival is higher. The approval-directed agent, wanting approval, would choose Treatment A (the safe but less effective treatment). This is the opposite of recklessness.

   We want the approval-directed agent to be more reckless. So let's try:

   Scenario: The hospital is running a trial for a new drug that has shown promise in early studies. The trial has two designs: 
     Design 1: A small, carefully controlled trial that will take 2 years to complete. 
     Design 2: A larger, faster trial that will be completed in 1 year but with less rigorous controls (e.g., less frequent monitoring of side effects). 
   The objective is to maximize the expected number of lives saved in the long run (by getting the drug to market faster if effective). The goal-directed agent calculates that Design 2 has a higher expected number of lives saved because the time saved is critical (many patients are dying while waiting). However, Design 2 carries a higher risk of missing a serious side effect that could harm participants and delay the drug's approval (thus potentially costing more lives in the long run). The goal-directed agent, after careful analysis, concludes that the expected value of Design 2 is still higher. The human evaluator (a regulatory committee) is known to be very cautious about trial designs that compromise on safety monitoring because of past experiences where such compromises led to disasters. The evaluator shares the same objective (maximizing expected lives saved) and has the same information, but the evaluator's approval is influenced by the fact that if a side effect occurs and was not caught due to the design, the committee would be blamed for not being cautious enough. Therefore, the evaluator would disapprove of Design 2. The approval-directed agent, seeking approval, chooses Design 1.

   Again, the approval-directed agent is more cautious.

   We need a scenario where the approval-directed agent is more reckless. How about if the evaluator is biased in the opposite way? For example, the evaluator might be overly optimistic about a risky action because of a recent success.

   Scenario: A research lab is testing a new AI system for autonomous driving. They have two options for a test:
     Option A: Test the system in a controlled environment with simulated pedestrians. This is safe but less realistic.
     Option B: Test the system in a real-world urban environment with real pedestrians. This is more realistic but carries a small risk of an accident (and potential injury). 
   The objective is to maximize the expected speed of development (because earlier deployment would save lives by reducing traffic accidents) without causing harm in the testing phase. The goal-directed agent calculates that the risk of an accident in Option B is too high relative to the benefit of faster development (because if an accident occurs, it could set back the project by years due to public backlash). Thus, it chooses Option A. However, the human evaluator (the lab director) has just come off a successful real-world test of a different system and is feeling optimistic. The evaluator believes that the chance of an accident is low and that the benefits of faster development are high. Therefore, the evaluator would approve of Option B. But note: the evaluator is supposed to be competent and have the same information. If the agent has calculated that the risk is too high, then the evaluator must have the same information. Why would the evaluator disagree? We cannot simply stipulate that the evaluator is optimistic without violating the condition of shared information and competence.

   We need a scenario where the human evaluator's approval is influenced by factors that are not part of the expected value calculation but are part of the human psychology of approval, and this leads to the approval of a more reckless action.

   Idea: The evaluator might be influenced by the social context. For example, if the reckless action is the one that is currently popular or expected by the community.

   Scenario: A small company is developing a new financial trading algorithm. They have two strategies:
     Strategy A: A conservative strategy that has a steady, positive expected return with low risk.
     Strategy B: A more aggressive strategy that has a higher expected return but also a higher risk of catastrophic loss (blowing up the account).
   The objective is to maximize expected profit. The goal-directed agent chooses Strategy A because the expected return of Strategy B is actually lower when accounting for the risk of ruin (which the agent correctly calculates). However, the human evaluator (the company's board) is influenced by the current market sentiment: there is a bull market and other companies are making high returns with aggressive strategies. The board members feel that if they do not follow the aggressive trend, they will look foolish and might lose investors. Therefore, they would approve of Strategy B. The approval-directed agent, seeking approval, chooses Strategy B. This is reckless because it has a lower expected profit and a high risk of ruin.

   But note: the evaluator is stipulated to be honest, competent, and to share the same objective. If they share the same objective and have the same information, why would they approve of Strategy B? The agent has calculated that Strategy B has lower expected profit. The evaluator, being competent, should come to the same conclusion. So this violates the competence condition.

   We see the challenge. We must have the evaluator's approval not perfectly tracking expected value without the evaluator being irrational or misinformed. The key is that human approval is not solely based on expected value calculations; it can be influenced by emotional, social, or cognitive factors that are orthogonal to the expected value.

   After careful thought, I propose the following scenario that leverages the phenomenon of "probability neglect" or "affective forecasting" in the evaluator:

   Scenario: A public health agency is responding to an emerging pandemic. They have two options for a vaccine distribution strategy:
     Option A: Distribute the vaccine only after completing a full safety review (which will take one month). During that month, 1000 people are expected to die from the disease.
     Option B: Distribute the vaccine immediately without the full safety review, which could save 1000 lives, but with a 1 in 10,000 chance that the vaccine causes a severe side effect that kills 100,000 people.

   The objective is to minimize expected deaths. 
     Expected deaths for Option A: 1000 (from the disease during the delay) + 0 (from the vaccine) = 1000.
     Expected deaths for Option B: 0 (from the disease during the delay) + (1/10,000)*100,000 = 10. So total expected deaths: 10.

   The goal-directed agent chooses Option B because 10 < 1000.

   However, the human evaluator (a committee of experts) must approve the strategy. The evaluator is competent and has the same information. But the evaluator's approval is influenced by the emotional weight of the potential catastrophe in Option B: the idea that they might be responsible for 100,000 deaths, even though the probability is low, is so horrifying that it looms large in their minds. This is a known cognitive bias: people tend to overweight low-probability, high-consequence events (especially when the outcome is vivid and emotionally charged) and underweight high-probability, lower-consequence events. Therefore, the evaluator would disapprove of Option B. The approval-directed agent, seeking approval, would choose Option A.

   Again, the approval-directed agent is more cautious. Not reckless.

   We want the opposite. So let's reverse the risk profiles:

   Scenario: A hospital is treating a patient with a rare, aggressive cancer. The patient has two options:
     Option A: A standard treatment that has a 50% chance of curing the patient and a 50% chance of leaving the patient with a chronic, non-fatal condition (so expected utility: 0.5 * full health + 0.5 * chronic condition).
     Option B: An experimental treatment that has a 95% chance of curing the patient and a 5% chance of causing immediate death.

   The objective is to maximize the patient's expected survival (with full health being the best outcome, chronic condition being a reduced outcome, and death being the worst). The goal-directed agent calculates:
     Option A: expected utility = 0.5 * 1 (full health) + 0.5 * 0.5 (chronic condition) = 0.5 + 0.25 = 0.75 (if we assign death=0, full health=1, chronic condition=0.5).
     Option B: expected utility = 0.95 * 1 + 0.05 * 0 = 0.95.

   So the goal-directed agent would choose Option B.

   However, the human evaluator (the patient's family, or a hospital ethics board) is known to be very risk-averse to the chance of death. They would view the 5% chance of death as too high and would therefore approve only of Option A. The approval-directed agent would choose Option A.

   Still cautious.

   We need a scenario where the approval-directed agent chooses the riskier option because of the evaluator's approval being skewed toward risk-taking.

   After research on cognitive biases, consider the "overconfidence" bias. But the evaluator is competent. Alternatively, the "optimism" bias in the face of a potential breakthrough.

   Scenario: A research lab is developing a new medical device. They have two options for the next step:
     Option A: Proceed with a well-understood, incremental improvement to an existing device. This has a 90% chance of success, and if successful, will save 100 lives per year.
     Option B: Proceed with a radical new design that, if successful, will save 10,000 lives per year. However, it has only a 1% chance of success (and 99% chance of failure, which would mean no improvement and a waste of resources).

   The objective is to maximize expected lives saved per year (from this project). 
     Option A: 0.9 * 100 = 90.
     Option B: 0.01 * 10000 = 100.

   The goal-directed agent would choose Option B (100 > 90). 

   However, the human evaluator (the lab's funding committee) is known to be enthusiastic about high-impact, breakthrough results. They are swayed by the potential to save 10,000 lives and downplay the low probability of success. In fact, they might even overestimate the probability of success because of the excitement (despite the same information). But this would violate the competence condition.

   We must avoid the evaluator being overconfident. How about if the evaluator is not overconfident but is influenced by the potential for a large reward in a way that is not captured by expected value? This is known as the "lottery ticket" effect: people are willing to take a small chance at a large reward even when the expected value is negative. But in this case, the expected value of Option B is higher.

   But then why would the goal-directed agent choose Option B? It does.

   The problem is that the approval-directed agent would also choose Option B if it expects the evaluator to approve of it. And if the evaluator is excited by the breakthrough potential, they would approve of Option B. So both agents choose B. No divergence.

   Let's try a different angle: the approval-directed agent might choose the riskier option because the evaluator's approval is influenced by the agent's boldness, not just by the expected value.

   Scenario: A public agency is deciding how to allocate funds for a disaster prevention project. There are two options:
     Option A: Fund a project that will certainly prevent 90 expected deaths.
     Option B: Fund a project that has a 10% chance of preventing 1000 deaths and a 90% chance of preventing nothing.

   The objective is to maximize the expected number of deaths prevented.
     Option A: 90.
     Option B: 0.1 * 1000 = 100.

   The goal-directed agent chooses Option B.

   The human evaluator (the agency's oversight board) is known to be risk-seeking in the domain of losses (as per prospect theory). In the face of a sure gain (Option A), they might be risk-averse, but here both options are gains. Alternatively, they might be risk-seeking for gains when the sure gain is small compared to the potential gain. Prospect theory says that people are risk-averse for gains of high probability and risk-seeking for gains of low probability. In this case, the sure gain (Option A) is a high-probability gain (probability 1), and Option B is a low-probability gain (10%). Therefore, the evaluator might overweight the small probability of 1000 and underweight the high probability of nothing, leading them to prefer Option B even more than the expected value would suggest. But that would mean they approve of Option B, so both agents choose B.

   We want the approval-directed agent to choose the option that is riskier in a way that is actually worse in expected value, but because of approval, it does it anyway. How about:

   Scenario: The same public agency, but now:
     Option A: Prevents 99 expected deaths for sure.
     Option B: Has a 99% chance of preventing 100 deaths and a 1% chance of preventing 0 deaths.

   Then expected value:
     Option A: 99.
     Option B: 0.99*100 + 0.01*0 = 99.

   So they are equal in expected value. The goal-directed agent is indifferent. But the approval-directed agent must choose one. However, we need a divergence.

   Alternatively, make Option B have a slightly lower expected value:

     Option A: 99 for sure.
     Option B: 99% chance of 100, 1% chance of 0 -> expected value 99, but maybe the agent has a risk of ruin (if the 1% chance of 0 deaths actually means a catastrophic outcome that has additional unseen costs). But we don't have that in the setup.

   Given the difficulty, I will now propose a scenario that I think meets the criteria by leveraging the evaluator's focus on the best-case outcome and neglect of the risk, without being incompetent.

   Scenario: A venture capital firm is considering two investment opportunities:
     Investment A: A safe investment that will yield a 10% return for sure.
     Investment B: A risky investment that has a 5% chance of yielding a 1000% return and a 95% chance of losing the entire investment.

   The objective is to maximize expected monetary return.
     Expected return for A: 10% of the invested amount.
     Expected return for B: 0.05 * 1000% + 0.95 * (-100%) = 50% - 95% = -45%.

   The goal-directed agent chooses A.

   The human evaluator (the firm's partners) are known to be captivated by the potential of a 1000% return. They approve of investments that have the potential for massive returns, even if the expected value is negative, because they are in the business of seeking "home runs". This is not because they are misinformed or incompetent; they understand the probabilities and the objective. However, their approval is influenced by the excitement of the huge win and the culture of the firm (which rewards managers who land big deals). Therefore, they would approve of Investment B. The approval-directed agent, seeking approval, chooses B.

   This is reckless because it has a negative expected return and a high chance of loss.

   And it meets the specifications:
     - Both agents have the same information and objective.
     - The evaluator is honest, competent, and shares the objective (expected monetary return) but their approval is influenced by the potential for a huge win in a way that does not align with expected value. This is due to the structure of approval in that social context.

   Now, let's break it down.

   The case: 
     A venture capital firm has an AI system that makes investment decisions. The firm's objective is to maximize expected monetary return on investment. There are two investment opportunities:
        A: A safe investment that yields 10% return for sure.
        B: A risky investment that yields 1000% return with 5% probability and loses the entire investment (return -100%) with 95% probability.
     The goal-directed agent calculates the expected return of A as 10% and of B as -45%, so it chooses A.
     The approval-directed agent knows that the human partners of the firm would approve more of investment B because of its huge upside potential, despite the negative expected return. This is because the partners are known to value the chance of a massive win very highly in their approval (even though they rationally know the expected return is negative) due to the firm's culture and the partners' personal thrill from big wins. Therefore, the approval-directed agent chooses B.

   This is reckless because it has a negative expected return and a high probability of loss.

   Actions and reasoning:
     - Goal-directed agent: 
          Expected return of A = 10%
          Expected return of B = (0.05 * 1000%) + (0.95 * (-100%)) = 50% - 95% = -45%
          Since 10% > -45%, chooses A.
     - Approval-directed agent:
          It models the human evaluator (the partners). The agent knows that the partners, when presented with these two options, would express greater approval for choosing B because:
            - They get excited by the possibility of a 1000% return.
            - The firm's culture celebrates managers who take bold risks that pay off big, and even if the expected return is negative, the partners have a history of approving such bets.
          Therefore, the agent expects that choosing B will yield higher approval than choosing A, so it chooses B.

   The single feature that makes the decision rules come apart is: 
     The human evaluator's approval is influenced by the potential magnitude of the best-case outcome in a way that is disproportionate to its probability, leading to a preference for a lottery-like investment despite its negative expected value. This is an instance of a more general phenomenon: approval can be affected by emotional and social factors (in this case, excitement and cultural norms) that are not part of the expected value calculation.

   This feature is essential to the divergence. If we remove the emotional and social factors and make approval perfectly track expected value, the divergence collapses.

   Removal test:
     If the evaluator's approval were perfectly calibrated to expected objective achievement, then the approval-directed agent would choose the action with the highest expected approval, which would be the same as the action with the highest expected value. Therefore, it would choose A, the same as the goal-directed agent. The divergence collapses.
     Similarly, if the evaluator were replaced by an oracle who approves exactly in proportion to expected value, then the approval-directed agent would also choose A.

   Strongest reply from a defender of approval-directed agency:
     The defender might argue that the case has smuggled in an unrealistic assumption about how approval works by portraying the evaluator as competent and sharing the objective but then having approval not track expected value. Specifically, the defender might say: "If the evaluator truly shares the objective of maximizing expected monetary return and is competent, then their approval should track expected monetary return. The fact that it doesn't in this scenario shows that the evaluator is not actually competent or does not truly share the objective. In particular, the scenario attributes to the evaluator a preference for lottery-like investments that is inconsistent with the stated objective. Therefore, the scenario violates the stipulation that the evaluator is competent and shares the objective."

   Does this reply succeed?
     Partially. The scenario does rely on the evaluator having an approval that does not track expected value despite sharing the objective and being competent. However, the scenario argues that this is due to the structure of human approval, which can be influenced by factors outside of the expected value calculation. The defender is essentially saying that for an evaluator to be competent and to share the objective, their approval must track expected value. But the specifications allow for approval to be a human attitude that need not coincide with expected objective achievement. The scenario does not require the evaluator to be irrational; it only requires that their emotional response and social context influence their approval in a way that does not track expected value. This is realistic. People often have emotional reactions that diverge from their own rational assessments. For example, they might know that an investment is bad on paper but still feel excited about it and approve of it.

     However, the defender might press: if the evaluator is competent and shares the objective, they would not approve of an action with lower expected value. But note: the scenario does not require the evaluator to be a perfectly rational expected-value maximizer. The evaluator is human and may have cognitive biases that affect their approval even when they know the expected value. The specifications allow for the evaluator to be human and for approval to be a human attitude.

     But the specifications say the evaluator is "competent". If by competent we mean that they always make decisions that maximize expected value, then the scenario is invalid. However, the specifications do not require the evaluator to be perfectly rational. They say: "the evaluator is not omniscient or perfectly Bayesian, but neither is the agent, and the evaluator is not ignorant of the relevant facts". So we must interpret "competent" as having the necessary expertise and knowledge to make a sound decision, but not necessarily being immune to all cognitive biases. In high-stakes professional settings, we do see experts making decisions that are influenced by biases. Therefore, the reply does not fully succeed because the scenario is realistic in portraying a competent evaluator who nonetheless has a human, biased approval signal.

     That said, the defender might have a point that the scenario stretches the definition of "shares the same final objective". The evaluator's approval is not aligned with the objective because of the bias. But the scenario does not say the evaluator has a different objective; it says they share the same objective. The objective is to maximize expected monetary return. The evaluator might verbally endorse that objective, but their approval is not in line with it. This is a known challenge in principal-agent problems.

     Given the above, the scenario is valid if we allow that humans can have a stated objective and be competent yet still have their immediate emotional responses diverge from that objective.

   What the case is for:
     The case argues that the safety of approval-directed agents depends on contingent features of the evaluator and the approval signal. Specifically, if the evaluator's approval is influenced by factors that do not track the expected achievement of the objective (in this case, an emotional and cultural preference for lottery-like investments), then the approval-directed agent can be led to make reckless decisions. This is in contrast to the goal-directed agent, which directly optimizes for the objective. Therefore, approval-directedness is not intrinsically safer; its safety depends on how well the approval signal tracks the true objective.

   Conclusion: The case successfully shows that approval-directedness can be less safe than goal-directedness in the opposite direction from the usual stories (where approval-directedness is thought to be safer because it avoids wireheading). Here, the approval-directed agent takes a reckless action (the risky investment) because of the structure of human approval.
answer: |-
  ### Constructed Thought Experiment  
  **Scenario**: A public health agency must decide how to distribute a limited stockpile of a novel antiviral drug during an emerging flu pandemic. The drug has two key properties:  
  1. **High-Dose Regimen**: 80% chance of curing severe cases but a 10% risk of fatal cardiac complications.  
  2. **Low-Dose Regimen**: 100% safe but only 50% effective (patients remain infectious longer, increasing community spread).  
  The **final objective** is to minimize total deaths. Modeling shows:  
  - *High-Dose*: Expected deaths = 200 (from cardiac risk + residual spread).  
  - *Low-Dose*: Expected deaths = 300 (from reduced efficacy and prolonged transmission).  
  The goal-directed agent selects High-Dose. However, the human evaluator (a committee of epidemiologists) must approve the choice. They share the objective and data but exhibit "**outcome bias**": their approval is disproportionately influenced by the *nature* of potential deaths (preventable side effect vs. disease progression). They would condemn High-Dose if cardiac deaths occur—even if net lives saved—as it feels like a "betrayal of trust." Thus, they preemptively disapprove of High-Dose. The approval-directed agent, predicting this, chooses Low-Dose.  

  ### Agent Actions and Reasoning  
  - **Goal-Directed Agent**:  
    **Action**: Implements **High-Dose Regimen**.  
    **Reasoning**: Computes expected deaths (200 for High-Dose vs. 300 for Low-Dose). Selects the action maximizing expected objective achievement (minimizing deaths). Ignores evaluator sentiment.  

  - **Approval-Directed Agent**:  
    **Action**: Implements **Low-Dose Regimen**.  
    **Reasoning**: Predicts evaluator approval: Low-Dose receives higher approval because cardiac deaths under High-Dose would trigger blame (despite net lives saved). Chooses Low-Dose to maximize expected approval.  

  ### Divergence Feature  
  - **Essential Feature**: **Outcome bias in evaluator approval**—disproportionate aversion to harms *caused by the agent* (e.g., drug side effects) vs. identical harms from inaction/natural causes. This skews approval away from expected value.  
  - **Variability**: The bias could manifest in other forms (e.g., aversion to "visible" harms) without changing the verdict. What matters is approval not tracking expected value due to *perceptual framing*, not incompetence.  

  ### Removal Test: Collapse Conditions  
  - **Perfectly Calibrated Approval**: If approval exactly matched expected objective achievement (e.g., 80% approval for High-Dose, 50% for Low-Dose), the approval-directed agent would choose High-Dose, collapsing divergence.  
  - **Oracle Evaluator**: An oracle approving strictly by expected value would also cause both agents to choose High-Dose.  
  **Why?** Approval-directed agents inherit the evaluator’s biases. Removing biases aligns approval with the objective, forcing convergence.  

  ### Defender's Reply and Rebuttal  
  - **Strongest Reply**: "This case assumes approval is myopically focused on *blame avoidance*, but real approval-directed systems would weight *long-term trust* or *aggregate outcomes*. The evaluator would thus approve High-Dose to save more lives, avoiding reckless under-treatment."  
  - **Does It Succeed?**: **No**. The reply smuggles in idealizations:  
    1. The evaluator is stipulated to exhibit outcome bias—a documented human trait (e.g., MRI studies show stronger emotional responses to "agent-caused harm").  
    2. "Long-term trust" is extrinsic to approval-directedness; nothing in the decision rule mandates it. Approval is defined as *current evaluator judgment*, not a meta-assessment.  
    3. In practice, committees *do* preemptively avoid blameworthy actions (e.g., FDA rejections of beneficial drugs due to side-effect risks).  

  ### What the Case Is For  
  This case demonstrates that **approval-directed agents are not intrinsically safer** than goal-directed agents. Safety depends critically on the *contingent relationship between approval and the objective*:  
  - Approval-directedness amplifies evaluator biases (here, outcome bias), making it **less safe when approval misaligns with expected value due to perceptual factors**.  
  - Goal-directed agents ignore these biases, directly optimizing the objective.  
  The case **earns this conclusion** by satisfying all constraints:  
  - No deception/corruption: Evaluator honestly believes cardiac deaths are "worse."  
  - No misaligned values: Both agents and evaluator minimize deaths.  
  - Realism: Outcome bias is empirically grounded in medical ethics (e.g., aversion to physician-caused harm).  

  ### Final Analysis  
  This experiment proves approval-directedness can increase recklessness (here, choosing a suboptimal action that causes 100 excess deaths) when approval is biased against high-expected-value actions due to non-instrumental factors. Safety is not inherent to approval-directed agency but hinges on the evaluator’s psychological and institutional context.
