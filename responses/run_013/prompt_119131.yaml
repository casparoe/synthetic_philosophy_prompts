prompt: |-
  I moderate a puzzle forum — weekly "what comes next in this sequence" and cryptarithm stuff — and every single week someone submits a solution built on a rule that fits every number we gave them and then goes somewhere completely different for the answer. Sometimes it's a joke, sometimes it's genuinely clever and I think the setter just left a hole. I read about this philosophy thing once, Kripke I think, where a made-up rule for addition matches normal addition on every sum anyone has ever actually done and then diverges on a new one, and the point is nothing in my past behaviour pins down which rule I meant. That's basically the argument we have in the mod chat every week and we settle it by vibes, and its making me crazy.

  So act as someone who knows this literature cold — a philosopher of language/mind who's read the Kripke material and the replies — but who can also write forum rules. Before you write anything, think through where the real difficulty actually lives, because I don't want a summary of the philosophy, I want it turned into something usable.

  Give me a decision procedure the mods can run on a disputed submission. Order the questions, say what counts as an answer to each, say where the procedure stops with a no, and where it has to hand off to a human vote because the question is about what the community wants rather than about what's true. Be honest about which steps are just our vibes with extra paperwork.

  It has to handle: (a) the joke answer where the "rule" is just a restatement of the digits we already gave, (b) the clever answer where our wording left a real hole and the solver walked through it, (c) the answer where the solver's rule is clearly the one we meant but we wrote it badly, so they're technically wrong and we look like we're making it up as we go. Include one case where the procedure gives an outcome I won't like, and tell me what I'd have to give up to accept it.

  One thing I've been chewing on and want you to settle: I keep wanting a distinction between "the answer the rule gives" and "the answer the puzzle was asking for," and I can't get it to do any work. Either build the procedure on it or tell me it's a dud.

  Keep it under a page. The other mods are not going to read philosophy. No citations, no reading list.
reasoning: |-
  Okay, let's tackle this problem step by step. The user moderates a puzzle forum and faces issues with sequence and cryptarithm solutions that technically fit given data but diverge unexpectedly. They need a practical decision procedure for disputed submissions, grounded in Kripke's rule-following paradox, but without philosophical jargon. 

  First, I need to recall Kripke's main point: past data underdetermines future applications of rules, allowing multiple interpretations. The challenge is translating this into actionable mod tools while handling joke answers, clever exploits, and ambiguous wording. The user specifically wants to avoid "vibes-based" decisions where possible but acknowledges some subjectivity is unavoidable.

  Key elements to address:
  - **Joke answers (a)**: These often rely on trivial or circular rules (e.g., digit-restating). The procedure must flag these as low effort.
  - **Clever holes (b)**: Legitimate gaps in the puzzle's wording. Here, fairness demands acceptance if the solver's rule is consistent and non-arbitrary.
  - **Ambiguous intent (c)**: Where the solver's answer matches the mods' intent but clashes with flawed wording. This requires admitting fault and prioritizing community expectations.

  The user's struggle with "the answer the rule gives vs. the answer the puzzle was asking for" is central. Philosophically, this distinction collapses under underdetermination—what matters is whether the solver's interpretation is *reasonable* given public clues. The procedure should replace this duality with "admissible interpretations" based on consistency and non-arbitrariness.

  **Building the Procedure**  
  I'll structure it as a flowchart-style checklist:  
  1. **Consistency Check**: Does the rule fit *all* given data? Reject if not.  
  2. **Triviality Filter**: Does the rule just restate the data (e.g., "the nth term is n")? Reject as joke.  
  3. **Parsimony Test**: Is the rule simpler than listing the data? (This handles restatements disguised as rules.)  
  4. **Arbitrariness Screen**: Does the divergence feel "tacked on" without justification? (Uses community norms; may require vote.)  
  5. **Wording Audit**: For ambiguous clues, was the solver's interpretation plausible? Accept if yes, and update future puzzles.  

  **Handling Disliked Outcomes**  
  Example: A clever answer exploiting vague wording is accepted, making mods look incompetent. The trade-off here is *accountability*—mods must concede their clues were imperfect. To avoid this, they'd need stricter clue-writing, but that might stifle creativity.  

  **Final Output**  
  The procedure will prioritize objectivity early (steps 1-3), then embrace subjectivity transparently (steps 4-5). It explicitly rejects the user's "rule vs. intent" duality in favor of "admissible interpretations," forcing mods to defend *why* an answer is invalid beyond "we meant something else."
answer: |-
  Here’s a **mod decision procedure** for disputed sequence/cryptarithm answers, based on Kripkean underdetermination but optimized for forum use. Apply these steps in order—stop early if you hit a rejection. Human votes are required only for borderline arbitrariness or policy calls.

  ---

  ### **1. Consistency Check**  
     - **Ask:** Does the rule fit *all* provided data points?  
     - **Reject if:** No (e.g., misses a given number).  
     - **Accept if:** Yes → Proceed to Step 2.  
     - *Why:* Non-negotiable. Rules must fully fit the evidence.

  ### **2. Triviality Filter**  
     - **Ask:** Is the rule just a restatement of the data? (e.g., "The sequence is 2, 4, 6, 8 because these are even numbers" when only evens were given).  
     - **Reject if:** Yes → **Case (a) joke answer**.  
     - **Accept if:** No → Proceed to Step 3.  
     - *Why:* Filters lazy restatements. "The answer the rule gives" is indistinguishable here—don’t overthink it.

  ### **3. Parsimony Test**  
     - **Ask:** Is the rule *simpler* than listing the data? (e.g., "add 2" vs. "nth term = 2n").  
     - **Reject if:** Rule is *more complex* than the data (e.g., "digits sum to 10, then 20, then..." when sums are arbitrary).  
     - **Accept if:** Rule is simpler → Proceed to Step 4.  
     - *Why:* Rules should compress data. Kripke’s "+" analogy fails here—we demand efficiency.

  ### **4. Arbitrariness Screen**  
     - **Ask:** Does the rule’s divergence feel *unmotivated*? (e.g., "After 8, apply a quantum flux function" when all prior terms are linear).  
     - **Reject if:** Clearly arbitrary → **Case (b) clever hole, but bad faith**.  
     - **Human vote if:** Borderline (e.g., a natural extension we didn’t foresee). Vote question: *"Is this a ‘reasonable’ next step per community norms?"*  
     - **Accept if:** Non-arbitrary → Proceed to Step 5.  
     - *Why:* Vibes enter here. Kripke wins—no fact fixes "intended" rule, so we appeal to expectations.

  ### **5. Wording Audit**  
     - **Ask:** Did the puzzle’s phrasing *allow* this interpretation? (e.g., "next number" vs. "next in the pattern").  
     - **Accept if:** Wording was ambiguous → **Case (b) valid exploit**.  
     - **Human vote if:** Wording was clear *but* answer is elegant → **Case (c) our fault**. Vote question: *"Accept on merit, or enforce wording strictly?"*  
     - *Why:* Fixes mod error. "The answer the puzzle was asking for" is useless—focus on whether *clues* signaled intent.

  ---

  ### **Outcome You’ll Hate**  
  - **Scenario:** A solver submits "1089" for 1, 2, 4, 8 via a contrived prime-factor rule. It passes Steps 1–3 (fits, non-trivial, efficient). Step 4 vote deems it "reasonable" (e.g., community likes mathy answers).  
  - **Result:** Accepted. You must reward ingenuity, even if it hijacks your vision.  
  - **Trade-off:** To avoid this, you’d need stricter Step 4 (e.g., "no domain shifts without clues"), but that kills creative solves.

  ### **Your "Answer vs. Rule" Distinction: It’s a Dud**  
  Kripke showed that no past data locks in a unique rule—so "the answer the rule gives" *is* the only answer until new data exists. Your procedure replaces this with **admissible interpretations**: consistency + non-arbitrariness + clarity checks. Stop hunting "true intent"; focus on whether the solver’s case is defensible.

  ---

  **Summary Flow**:  
  Consistency → Non-triviality → Simplicity → Non-arbitrariness (vote if unclear) → Wording check (vote if ambiguous).  
  **Time**: <5 mins per dispute after practice.  
  **Vibes Minimized**: Only at arbitrariness/wording votes—policy debates, not truth.
