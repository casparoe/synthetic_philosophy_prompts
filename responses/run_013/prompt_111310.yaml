prompt: |-
  So I've got a running argument with my two roommates about which markets should just be flat-out illegal, and when I actually write down my gut calls they don't obviously hang together. I'm a backend engineer, never took a philosophy class past the one gen-ed requirement, so I'm probably missing whatever the standard answer is here. Anyway, here's where I land. An adult sells a kidney for cash: I'd legalize it tomorrow. Selling your vote: jail, no question. A guy with a truck of bottled water selling it for $20 a bottle after a hurricaine knocks out the power: should be illegal, that's gouging. Somebody buys 40 concert tickets and resells them at 5x face value: eh, that's fine, the market's the market, I don't care. Paid surrogacy: fine, she's a grown adult making a deal. A company pays new parents to name their kid after its brand: feels gross, I'd ban it. Paying a stranger to serve your prison sentence for you: obviously a crime, and not just because of the paperwork. Paying your own kid $50 a grade: fine, whatever gets them to study.

  What bugs me is I can't tell if these add up to one thing or if I'm just being inconsistent. The kidney call and the water-gouging call seem to point opposite ways, since both are somebody in a bad spot paying a lot for something they badly need. The ticket thing vs the water thing look like the same move at different stakes. Meanwhile the baby-name ban and the kidney green-light both seem to be about selling something kind of personal, so why does one gross me out and the other not? And surrogacy vs baby-naming is close enough that I worry I'm just going on vibes.

  So: is there a principle, or a small set of principles, that actually gets my eight calls right, and for each clause of it, which call is that clause there to explain? If the tidy version forces me to drop one of my gut calls, tell me which one and why I should give it up, and if you need extra clauses to save them all, say so and tell me what that costs. Then run it on a case I haven't decided yet: a hospital auctions off a single spot in a scarce experimental treatment to whoever bids highest, and the losers get nothing. Is that the kidney case, the water case, or its own thing? Please start your answer with your bottom line in one sentence and then give the reasoning -- no preamble, and don't restate what I asked.
reasoning: |-
  Okay, the user has a complex ethical dilemma about which markets should be illegal based on their gut reactions to various scenarios. They've listed eight different cases: selling kidneys, selling votes, price gouging after a hurricane, ticket scalping, paid surrogacy, corporate baby-naming, prison sentence substitution, and paying kids for grades. They feel conflicted because their responses seem inconsistent and want to know if there's a unifying principle.

  First, I need to identify patterns in their judgments. They allow kidney sales and surrogacy but prohibit vote-selling and baby-naming. Price gouging is banned, but ticket scalping is fine. Prison substitution is illegal, but paying kids for grades is acceptable. The key differences seem to be about coercion, commodification of essential goods, and democratic integrity.

  Looking at the kidney vs. water case: both involve desperate needs, but kidneys are a personal choice with long-term consequences, while water gouging exploits immediate necessity during a crisis. The ticket scalping vs. water gouging might differ because concerts are non-essential, whereas water is vital for survival. 

  Baby-naming feels gross because it commodifies personal identity from birth, whereas surrogacy involves an adult's autonomous decision about their body. The prison substitution undermines the justice system, while paying kids for grades is a private incentive.

  The principles that emerge are: preventing coercion in desperate situations, protecting essential goods from commodification, upholding democratic processes, and avoiding irreversible harm. For the experimental treatment auction, it's similar to the water case because it involves life-saving treatment scarcity, leading to unfair access based on wealth. Hence, it should be regulated to prevent exploitation during vulnerability.
answer: |-
  **Bottom line: Your judgments align with prohibiting markets that create coercive exploitation, undermine essential democratic/legal institutions, or commodify core personal/social identities in harmful ways, while allowing consensual transactions that don't violate these principles.**

  Here's how the principles explain your calls:

  1.  **Prevent Coercive Exploitation in Desperate Circumstances:** Bans markets where extreme vulnerability forces acceptance of harmful/desperate terms.
      *   *Explains:* **Water gouging** (disaster victims have no choice), **Prison substitution** (desperation to avoid prison is inherently coercive).
  2.  **Protect Essential Democratic/Legal Institutions:** Bans markets that corrupt core societal functions.
      *   *Explains:* **Selling votes** (undermines democracy), **Prison substitution** (undermines justice system).
  3.  **Prevent Harmful Commodification of Core Identity/Relationships:** Bans markets that reduce fundamental aspects of personhood or critical social bonds to mere commodities in ways causing significant harm or degradation.
      *   *Explains:* **Corporate baby-naming** (treats a child's core identity as a billboard, commodifies parent-child bond), **Prison substitution** (treats justice/punishment as a commodity).
      *   *Explains why **Kidney sale** is *allowed*: While personal, it involves bodily tissue, not core identity/social bonds in the same way, and a competent adult's consent is primary. **Surrogacy** is *allowed*: It involves bodily service and labor, not the commodification of the *child itself* or the core parental identity (ideally, with safeguards).
  4.  **Allow Consensual Transactions Not Violating 1-3:** Permits markets where informed adults consent without desperation, and it doesn't corrupt institutions or harmfully commodify identity/relationships.
      *   *Explains:* **Kidney sale** (competent adult consent, bodily autonomy), **Ticket resale** (non-essential good, no desperation, harms no institution/core identity), **Paying kids for grades** (private family incentive, not public harm/commodification), **Surrogacy** (as above).

  **Where it forces you to drop a call:** **Prison substitution** is the only case needing two principles (1 & 3), but both apply strongly. No gut call needs complete abandonment. The principles save them all.

  **Cost of extra clauses:** The framework needs three distinct but interlinked principles (Prevent Coercive Exploitation, Protect Essential Institutions, Prevent Harmful Commodification) plus the default allowance. This reflects the complexity of real-world moral reasoning rather than a single monolithic rule.

  **The Experimental Treatment Auction:**
  *   This is **primarily the Water Case (Coercive Exploitation)**, not the Kidney Case. The critical factor is *desperate need* combined with *artificial scarcity* of a vital good (life-saving treatment).
  *   Like the hurricane victim needing water, the dying patient needing treatment faces extreme vulnerability. An auction exploits this desperation, allocating life based solely on wealth, not need or fairness. It turns a fundamental need (health/survival) into a luxury commodity for the rich.
  *   While involving a "scarce good" like kidneys, the auction *creates* the exploitative pricing mechanism for a life-or-death necessity, mirroring gouging. Consensual kidney sales involve bilateral negotiation for a *renewable* resource (one kidney), not a forced auction for an *irreplaceable* chance at life.
  *   **Verdict:** Should be illegal (or heavily regulated to prevent pure auction models) under Principle 1 (Prevent Coercive Exploitation).
