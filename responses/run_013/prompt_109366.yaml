  We are designing a coherence audit for a forecasting register. The goal is to check for internal consistency (coherence) without requiring advanced probability theory. The audit will consist of a sequence of tests, each checking a specific aspect. We'll handle point probabilities and ranges, but note that ranges may require judgment.

   Key elements in the register:
   1. Partitions: mutually exclusive and exhaustive events. We expect probabilities to sum to 1.
   2. Conjunctions and disjunctions: e.g., P(A and B), P(A or B). These must respect probability bounds (e.g., P(A and B) <= min(P(A), P(B)), P(A or B) >= max(P(A), P(B)) and <= P(A)+P(B)).
   3. Conditionals: e.g., "if X happens, then Y is likely" — we interpret as conditional probability P(Y|X). We must have P(Y|X) = P(Y and X) / P(X) if P(X)>0, but note that we may not have direct assessments for all conjunctions.
   4. Reflection items: the analyst's forecast of their own future forecast for the same question after the next data release.

   We are not testing calibration (i.e., whether the probabilities match long-run frequencies) but only internal consistency.

   Steps of the audit:

   1. Check Partitions for Sum to One (if they are mutually exclusive and exhaustive)
      - What: For any declared partition (set of events that are mutually exclusive and exhaustive), sum the probabilities (or the midpoints of ranges if given as a range). 
      - Failure: The absolute difference from 1 exceeds a tolerance (we'll set 0.01, but note: the example has 1.06 -> fails). 
      - What it means: The probabilities for the partition are incoherent. They must sum to 1.
      - Judgment: The auditor must confirm the events are indeed mutually exclusive and exhaustive. If they are, then failure is clear.

   2. Check Conjunctions and Disjunctions (if present) for Bounds
      - What: For any conjunction (A and B), check:
            P(A and B) <= min(P(A), P(B))
            P(A and B) >= max(0, P(A) + P(B) - 1)
        For any disjunction (A or B), check:
            P(A or B) >= max(P(A), P(B))
            P(A or B) <= min(1, P(A)+P(B))
      - Failure: Any violation of these bounds.
      - What it means: The probabilities for the compound events are incoherent with the marginals.

   3. Check Conditionals (if present and if the conditioning event has positive probability)
