  ### Coherence Audit Procedure

  This audit checks for internal consistency ("coherence") in forecasting registers, ensuring probabilities can't be exploited for a guaranteed profit. It requires basic spreadsheet functions (SUM, MIN, MAX, ABS) and a tolerance threshold of 0.01. Judgment is required where noted. A clean audit **only** confirms coherence; it does **not** validate accuracy, calibration, or relevance to real-world events.

  ---

  #### **Step 1: Partition Sum Check**  
  **What it checks**: Mutually exclusive and exhaustive partitions sum to 1.  
  **Failure**: Absolute difference from 1 > 0.01.  
  **Judgment required**: Auditor must confirm events are truly mutually exclusive and exhaustive.  
  **If ranges are given**:  
  - Calculate total lower bound (sum of all lower limits).  
  - Calculate total upper bound (sum of all upper limits).  
  - **Failure**: 1 ∉ [total lower bound, total upper bound].  
  **What failure means**: Probabilities are incoherent. The statistician can construct a guaranteed profit by betting across the partition.  
  **What failure does NOT mean**: The events are poorly chosen (only their probabilities are defective).  
  **Output**: PASS or FAIL.  

  ---

  #### **Step 2: Conjunction/Disjunction Bounds Check**  
  **What it checks**: Logical relationships between events (e.g., P(A and B) ≤ min(P(A), P(B))).  
  **Failure**: Provided probability violates any bound below.  
  **For conjunctions (A and B)**:  
  - Lower bound = max(0, P(A) + P(B) - 1)  
  - Upper bound = min(P(A), P(B))  
  - **Failure**: P(A and B) ∉ [lower bound, upper bound].  
  **For disjunctions (A or B)**:  
  - Lower bound = max(P(A), P(B))  
  - Upper bound = min(1, P(A) + P(B))  
  - **Failure**: P(A or B) ∉ [lower bound, upper bound].  
  **If ranges are given**:  
  - Use the narrowest possible bounds (e.g., for A and B, lower bound = max(0, lower(A) + lower(B) - 1), upper bound = min(upper(A), upper(B))).  
  - **Failure**: Entire provided range falls outside [lower bound, upper bound].  
  - **Judgment required**: If ranges partially overlap, mark as "INDETERMINATE" (auditor must review).  
  **What failure means**: Incoherence in compound events; statistician can exploit with combined bets.  
  **Output**: PASS, FAIL, or INDETERMINATE.  

  ---

  #### **Step 3: Reflection Check**  
  **What it checks**: Current forecast (F0) matches forecast of future forecast (R) after next data release.  
  **Failure**: |F0 - R| > 0.01 (points) OR no overlap (ranges).  
  **If ranges are given**:  
  - **Failure**: [F0_lower, F0_upper] ∩ [R_lower, R_upper] = ∅ (no overlap).  
  - **Judgment required**: If partial overlap, mark as "INDETERMINATE".  
  **What failure means**: Analyst contradicts their own belief about learning. Statistician can exploit with sequential bets.  
  **What failure does NOT mean**: The data release is uninformative (that is a separate claim; see Step 4 notes).  
  **Output**: PASS, FAIL, or INDETERMINATE.  

  ---

  #### **Step 4: Conditional Check**  
  **What it checks**: Conditional probabilities (e.g., P(Y|X)) are consistent with joint/marginal probabilities.  
  **Failure**: Violates 0 ≤ P(Y|X) ≤ 1 OR |P(X and Y) - P(Y|X) × P(X)| > 0.01 (if P(X) > 0).  
  **If ranges or missing data**:  
  - **Judgment required**: Skip test (mark "NOT TESTED"). Coherence cannot be verified without exact values.  
  **What failure means**: Incoherence in conditional beliefs; statistician can exploit with contingent bets.  
  **Output**: PASS, FAIL, or NOT TESTED.  

  ---

  #### **Special Cases & Judgment Notes**  
  1. **Ranges**:  
     - If an analyst uses ranges, tests may return INDETERMINATE. The auditor must decide if the range reflects legitimate uncertainty (PASS) or evasion (FAIL).  
  2. **Refusal to bet**:  
     - If an analyst won't assign odds to an event in a partition, Step 1 fails (partition incomplete).  
  3. **Uninformative data claims**:  
     - If an analyst calls the next data release "uninformative" but R ≠ F0 in Step 3, FAIL (contradiction).  
  4. **Logical dependencies**:  
     - The auditor must verify events are mutually exclusive (Step 1) and that conjunctions/disjunctions are correctly defined (Step 2). **This is the highest-judgment task.**  

  ---

  ### Audit Results for Your Three Registers

  #### **Register 1 (Tidy)**  
  - **Partition**: Sum = 1.06 → **FAIL** (Step 1).  
  - **Conditionals**: Not tested (irrelevant after Step 1 failure).  
  - **£50 demonstration**: **Legitimate**. Statistician can profit by "selling" £1 bets on each partition event at your prices (e.g., take £1.06, pay out £1 regardless of outcome).  
  - **Conclusion**: Incoherent. Analyst must adjust partition probabilities to sum to 1.  

  #### **Register 2 (Awkward: Ranges & Tail Event)**  
  - **Partition**: Tail event missing probability → **FAIL** (Step 1: incomplete partition).  
  - **Ranges**: Not tested (Step 1 failure overrides).  
  - **£50 demonstration**: **Legitimate**. Statistician can:  
    1. "Sell" bets on non-tail events at their upper-bound odds (e.g., if upper bounds sum to 1.05, take £1.05).  
    2. If a non-tail event occurs, pay £1 (profit £0.05).  
    3. If tail event occurs, pay nothing (profit £1.05).  
  - **Conclusion**: Incoherent. Analyst must assign a probability (or range) to the tail event and re-run Step 1.  

  #### **Register 3 (Internally Impeccable but Suspicious)**  
  - **Partition**: Sums to 1 → **PASS** (Step 1).  
  - **Conjunctions**: Respect bounds → **PASS** (Step 2).  
  - **Reflection**: F0 = 0.4, R = 0.75 → |0.4 − 0.75| = 0.35 > 0.01 → **FAIL** (Step 3).  
  - **Conditionals**: Imply F0 should be 0.75 → **FAIL** (Step 4, if tested).  
  - **Uninformative claim**: Contradicts reflection failure → **FAIL** (Step 3 judgment).  
  - **£50 demonstration**: **Legitimate**. Statistician can:  
    1. Buy a £1 bet on the event today at 0.4 (cost: £0.40).  
    2. Sell a £1 bet on the same event post-data at 0.75 (gain: £0.75).  
    3. Profit = £0.75 − £0.40 = £0.35 regardless of outcome.  
  - **Conclusion**: Incoherent. Analyst must align F0 and R or justify why uninformative data warrants a 0.35 probability shift.  

  ---

  ### What to Say to Your Desk on Monday  
  > "We've implemented a coherence audit to ensure our forecasts are internally consistent and immune to guaranteed exploitation. Last quarter, three registers failed:  
  > 1. **Analyst 1**'s partition sums to 1.06. Adjust to sum to 1.  
  > 2. **Analyst 2** must assign a probability to the tail event.  
  > 3. **Analyst 3**'s reflection item contradicts their current forecast and data claims.  
  >  
  > The statistician is correct: these defects allow guaranteed profits. Passing the audit is non-negotiable for publication, but remember—it only checks consistency, not accuracy. We’ll train on the audit at Thursday’s lunch. Any register failing next quarter will be non-publishable."  

  **Final note**: A clean audit is **not** a quality certificate. It eliminates internal contradictions but says nothing about whether your probabilities match reality. Use calibration tracking (e.g., Brier scores) for quality control.
