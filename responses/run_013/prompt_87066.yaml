  Let me unpack the conceptual layers. First, the key distinctions: punishment types (monetary vs. liberty-depriving), transferability conditions, and the "expiation" criterion Lewis introduces. The stakes are high—if fines and imprisonment differ only quantitatively, then rejecting penal substitution while accepting fine payment is indeed inconsistent. But if there's a qualitative difference in how these punishments relate to the offender's personhood, the inconsistency vanishes. 

  The user's proposed "all or nothing" dilemma—either accept substitution universally or reject even fine payments—is philosophically sharp. But Lewis's actual move is subtler: he argues monetary penalties can be expiatory (discharging guilt) precisely because they don't attach to personal identity, while imprisonment does. This maintains consistency without abandoning fine substitution. 

  For theological extension, the user wonders if high stakes could override personal attachment. But Lewis would likely counter that no stakes, however high, change the ontological link between guilt and personal experience. God's acceptance of Christ's sacrifice would thus require reconceptualizing punishment—not as transferable suffering but as voluntary satisfaction. 

