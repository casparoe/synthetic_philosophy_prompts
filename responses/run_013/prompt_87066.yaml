prompt: |-
  You are a philosopher specializing in the philosophy of punishment and in the philosophical theology of the atonement, and you are thoroughly familiar with David Lewis's essay on penal substitution. Please think carefully before answering. Begin with a short brainstorming section in which you lay out the conceptual terrain as you see it — the relevant distinctions, what is at stake, and where the argument's pressure points lie — and then give your considered answer.

  Here is what I have been puzzling over. Lewis asks us to imagine an offender who has been justly sentenced to punishment and an innocent friend who volunteers to take the punishment in his place. Our reaction, he suggests, is that this cannot be done: the friend may be generous, but the offender is the one who must bear the punishment. Lewis then observes that our attitude changes entirely when the sentence is a fine. If I am fined and you pay the fine for me, we do not think the state has been cheated or that I have escaped my punishment; we think the penalty has been discharged. So we are of two minds: we reject penal substitution for imprisonment, but we accept it for fines.

  My question is this. If the only real difference between the fine case and the imprisonment case is how much is at stake — some money on one side, years of liberty on the other — then our willingness to let a friend pay my fine seems to commit us to letting a friend serve my sentence, and from there to letting a substitute bear the penalty in the atonement, where the stakes are the highest imaginable. On that reading, Lewis's argument would give us a reason to accept penal substitution as a theory of the atonement, rather than the reading on which he is merely exposing an inconsistency in our attitudes that we must resolve by giving up one side or the other. And if we are not willing to go all the way, would the consistent position be to stop letting friends pay our fines?

  Please explain whether this is the right way to read the argument, and if it is not, what the correct reading is.
