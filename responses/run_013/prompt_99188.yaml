  But Dick’s mysticism might clash here. The ending with Juliana feeling the "benevolent universe" watching—that’s divine, not historical. If I force this into Berlin/Carr, I lose Dick’s gnostic angst. Still, the user *wants* that tension acknowledged. Scenes to teach: Frink’s jewelry revelation (Ch. 15), Tagomi’s reality shift (Ch. 10), Juliana’s meeting with Abendsen (Ch. 15), and the finale. 

