prompt: |-
  Retired lawyer here, I read a lot of history for fun and I keep running into a pattern I can't name. Take any big event — a famine, a crash, a battle that went the wrong way — and you'll get a list of contributing factors, three or four of which are each described as enough on their own to have brought it about. Fine, overdetermined, I know that much. But here's the part that bugs me: everyone still goes on to name *the* cause, and the one they pick isnt the strongest or the most necessary — its whichever factor is unusual (the thing that departed from the normal run of things), or, if the question is how to prevent the thing next time, whichever factor somebody could actually have changed. Same event, different question, different "cause", even though the set of factors is identical and each of them was sufficient. So "the cause" seems to be selected by salience or by modifiability rather than by anything in the causal structure itself. Does this have a name, and is there a decent account of what the selection rule really is? I don't just want the label — I want to know how it differs from plain overdetermination and from what "but-for" means in law, and where the edges of it are (is it one thing or several?). If nothing fits, coin something and define it.

  Give it back to me as a JSON object with these fields: "verdict" (one of "established", "partial_match", "no_term"), "established_term" (the accepted name if there is one, else null), "nearest_concepts" (array of objects, each with "name", "where_it_fits", and "where_it_breaks"), "selection_rule" (your best account of what actually drives the choice of "the" cause), "proposed_term" (the name you'd coin, or the established one if it fits), "definition" (one or two sentences), "not_to_be_confused_with" (array of strings, each naming something it's often mixed up with and the one-line difference), and "boundary_cases" (array of short cases that test where the phenomenon starts and stops).
reasoning: |-
  Alright, let's tackle this retired lawyer's query. They've noticed a pattern in historical analysis where multiple sufficient causes exist for an event, yet people single out one "the cause." The chosen cause isn't necessarily the strongest or most necessary but is either unusual or modifiable. The user wants a name for this phenomenon, how it differs from overdetermination and but-for causation, and the underlying selection rule.

  First, I need to recall relevant concepts. Overdetermination is when multiple factors are each sufficient to cause the event. But-for causation in law asks if the event wouldn't have happened without the factor. The user mentions that people pick a cause based on salience or modifiability, which doesn't align perfectly with either concept. 

  Next, I consider counterfactual reasoning. The selection of a cause often depends on what could have been changed or what's abnormal. This relates to the "abnormal conditions" view in philosophy, like J.S. Mill's ideas. Also, pragmatic selection in causation focuses on what's actionable or salient. The INUS condition (Insufficient but Necessary part of an Unnecessary but Sufficient condition) might be a near fit, but it's about components, not selecting one sufficient cause among many.

  The user's scenario has multiple sufficient causes, each alone capable of causing the event. Yet, the chosen "the cause" is the one that's unusual or modifiable. This seems like a blend of pragmatic selection and the abnormal conditions framework. I recall that in causal explanation, especially in history, the salient cause is often the one that deviates from the norm. For prevention, modifiability is key. 

  Is there an established term? "Causal selection" or "explanatory selection" comes to mind. These are broader terms covering why we pick certain causes over others. The Pragmatic Theory of Explanation fits here. The term "the operative cause" is sometimes used in law, but it's not standard in history or philosophy. 

  Comparing to overdetermination: overdetermination addresses multiple sufficient causes, but doesn't explain selection. But-for causation is necessary but not sufficient; here, each factor is sufficient. The selection rule here is based on pragmatics—what's useful for explanation or intervention. 

  The nearest concepts would be pragmatic causal selection, abnormal conditions, and INUS. Each fits in different ways but breaks because the user's case involves multiple sufficient causes, not necessary components. 

  The selection rule: people choose based on what's abnormal or modifiable. For diagnosis, the unusual factor; for prevention, the actionable one. 

  Proposed term: "Pragmatic Sufficient Cause Selection" or "Salient Sufficient Cause." The definition should highlight the role of context and purpose in choosing one sufficient cause. 

  Boundary cases: If all factors are equally modifiable, does selection still occur? Or if none are modifiable? Also, when a factor is necessary versus sufficient. 

  Need to ensure clarity on how this differs from but-for and overdetermination. Also, list things not to confuse with, like scapegoating or monocausality.
