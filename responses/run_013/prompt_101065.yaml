prompt: |-
  I'm a high school junior preparing a short presentation for my school's philosophy club on classical Indian epistemology, and I've been assigned the Nyāya school's four pramāṇas: perception, inference, comparison (the recognition of something through an analogy), and verbal testimony. I can recite the textbook division well enough, and I understand that Nyāya treats testimony as a genuinely separate source of knowledge rather than something reducible to an inference about a speaker's reliability. What I actually need for the presentation is not a summary of that familiar debate but one concrete example of a conceptual issue — a single, well-described case that makes the tension visible, that I could narrate to the club in about two minutes, and that would leave my classmates arguing afterward.

  Here is the wrinkle I want the example to involve, because I think it keeps the case from collapsing into the usual back-and-forth: the source of the sentence should not be a person with intentions at all. Imagine that I come to believe something true because of a sentence produced by a machine — a chatbot, a navigation system, or a translation device — that has no beliefs, no desire to communicate anything, and no character that could be reliable or unreliable. Nyāya's account of testimony seems built around a trustworthy authority who speaks with the intention of conveying what they know, while its account of inference seems to require that I infer the speaker's reliability from past experience; I want an example of a conceptual issue this kind of case raises for the claim that testimony is its own pramāṇa, ideally one where it is genuinely unclear whether the resulting knowledge should count as testimony, as inference, or as something the fourfold scheme does not cleanly cover. Please give me a single example, described concretely enough that I could narrate it aloud, and explain in a few sentences why that example generates the issue rather than being merely a puzzle about technology.

  Lead with the bottom line: state in your first sentence exactly what the conceptual issue is and why the standard Nyāya distinctions do not settle it, then give the example and the reasoning, with no preamble and no restating of my question. Finally, tell me where your own reasoning is most likely to fail — for instance, whether you are leaning on a reading of the Nyāya account of testimony that a specialist might dispute, or on an assumption about how much intention the account really requires — and what argument or consideration would lead you to choose a different example.
