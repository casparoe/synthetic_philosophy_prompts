answer: |-
  ## Thomson's Lamp

  At zero, lit. The minute starts its run.  
  At half the minute, off. Then half the rest:  
  a quarter-minute onward, back to on.  
  Then eighth? Off at seven-sixteenths? We press  
  the intervals to halve: the flips ignite  
  then kill the beam in ever-tighter turns.  
  The lamp obeys each pulse—on, off, on, off—  
  yet as the minute ends, the pattern churns  

  to infinite flips. No final switch. The state  
  at sixty seconds? Physics won’t declare.  
  The rules command each flip but leave the fate  
  unfixed at limit’s edge—no answer there.  

  The sequence fits a lamp still lit, or dark,  
  or one that fused mid-flash to broken spark.  

  The rules don’t settle it.
