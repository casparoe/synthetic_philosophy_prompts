  Okay, the user has a pretty specific and detailed request. They're dealing with two friends in their reading group who have been arguing about humanitarian intervention for years - one is a liberal interventionist (pro-R2P) and the other is a restraint advocate. The user is tired of mediating and wants me to create a document that both could agree on without compromising their core views.

  Let me break down what the user is asking for. They want four main sections: a list of shared claims, a disagreements table, key cruxes of the debate, and a hypothetical case study. Importantly, they want this to avoid strawmanning, be non-vacuous, and force both sides to take concrete positions rather than saying "it depends."

  I need to consider both perspectives carefully. The interventionist believes in responsible military action to prevent atrocities, citing Kosovo and Libya (initially) as successes, while viewing Rwanda and Iraq as failures of execution rather than concept. The restraint advocate sees sovereignty as fundamental, is skeptical of atrocity narratives, and believes interventions often escalate beyond their stated aims, as in Libya's shift to regime change.

  For the shared claims section, I should identify areas of genuine overlap - not just platitudes. Both likely agree that atrocities occurred in the cases they debate, that interventions carry risks, and that intentions can differ from outcomes. But I'll exclude obvious points like "civilian protection matters" since that's too vague.

  The disagreements table needs neutral framing. Key points include: whether sovereignty can be overridden for protection, how to weigh intentions vs outcomes, the evidentiary threshold for action, and the role of UN authorization. For each, I'll note the costs of being wrong - like civilian lives or norm erosion.

  The cruxes should reveal what would actually change their minds. The retrospective vs prospective judgment question is crucial - is Libya's outcome inherent to interventions or a specific failure? Security Council authorization's purpose is another divider: is it a legitimacy requirement or just a legal formality? Using cases like Rwanda 1994 or Kosovo can test these.

  For the hypothetical case study, I'll create a fictional scenario involving "Azmar" with mass atrocity warnings, no strategic interests, and a Russian naval base complicating Security Council approval. This forces concrete predictions: the interventionist would likely push for action despite the veto risk, while the restraint advocate would oppose without authorization, citing precedent concerns.

  Throughout, I'll maintain strict neutrality, avoid academic jargon, and ensure every point requires genuine engagement. The goal is to map the fault lines clearly, showing where their differences lie and what evidence could resolve them, without pretending they agree more than they do.
answer: |-
  ## The Kitchen Ceasefire Document: Interventionist vs. Restraint Common Ground & Irreducible Disputes

  **Preamble:** We, the undersigned, acknowledge our persistent disagreement on the legitimacy and prudence of cross-border military force to halt mass atrocities ("humanitarian intervention" or "Responsibility to Protect" - R2P). To clarify the debate and identify potential movement, we commit to this document outlining shared understandings, core disagreements framed neutrally, key cruxes, and a pre-registered prediction on a novel case. This reflects our genuine views without compromise or strawmanning.

  **Section 1: Shared, Non-Vacuous Claims (What We *Do* Agree On)**

  1.  **Atrocities Happened:** Large-scale, deliberate violence against civilians occurred in Kosovo (1999), Rwanda (1994), Iraq (Saddam era, especially Anfal/Kurds), and Libya (pre-2011 uprising). These constituted grave human rights violations.
  2.  **Intentions Are Complex & Outcomes Uncertain:** States intervening often cite humanitarian motives, *but* geopolitical interests (access, influence, reputation, domestic politics) are always present and influential. Predicting the full course and consequences of any intervention (military success, civilian protection, political outcome, long-term stability) is inherently difficult and often wrong.
  3.  **"Success" & "Failure" Are Multidimensional:** Judging an intervention requires assessing multiple, often conflicting goals: short-term atrocity cessation, long-term civilian protection, political stability, regional spillover, legitimacy costs, precedent setting, and financial/military burden. We agree no case is purely a success or failure on all dimensions.
  4.  **Iraq 2003 Was Catastrophically Flawed:** The invasion was justified on false premises (WMDs), lacked adequate planning for post-invasion governance/security, resulted in massive civilian casualties, regional destabilization, and eroded international trust. It serves as a major negative case study. *We disagree only on whether it invalidates the *concept* of intervention or solely illustrates *poor execution*.*
  5.  **Rwanda 1994 Was a Catastrophic Failure of Response:** The failure of the international community (including the UNSC and key states) to act decisively during the genocide resulted in preventable mass murder. *We disagree on whether a *military intervention* starting in April 1994 was feasible, likely to succeed, or the *only* viable response.*
  6.  **Libya 2011 Saw Mission Creep:** UNSC Resolution 1973 authorized force to protect civilians. NATO's actions demonstrably exceeded a strict protection mandate and actively facilitated regime change. *We disagree on whether this creep was inherent to the intervention, inevitable, avoidable, or justified.*
  7.  **"Humanitarian" is a Contested Label:** The term carries immense rhetorical weight. We agree it is often strategically deployed by advocates *and* critics to frame the debate. Its use does not automatically confer legitimacy, nor does its absence negate genuine civilian suffering. The core fight is about the *permissibility and prudence* of military force, regardless of the label.
  8.  **Sovereignty is Important But Not Absolute:** State sovereignty is a foundational principle of the international order. However, we agree it cannot be an impenetrable shield behind which states commit mass atrocities against their own populations. *We disagree on the threshold for overriding it and the agent permitted to do so.*
  9.  **"We Had To Do Something" is Insufficient:** This sentiment is recognized as a dangerous driver of poorly conceived action. Any proposed intervention must articulate a plausible theory of change and exit strategy beyond mere reaction to horror. *We disagree on how robust this theory/strategy must be and whether it can ever be met sufficiently.*

  **Section 2: Core Disagreements (Neutral Framing)**

  | # | Neutral Question                                                                 | Interventionist Position (Short)                                                                 | Restraint Position (Short)                                                                 | Cost of Being Wrong (Primary Bearer)                                                                 |
  | :-- | :-------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- |
  | 1  | Under what conditions can the norm of non-intervention/sovereignty be legitimately overridden by military force to protect civilians from mass atrocities? | When a state is manifestly failing to protect its population from genocide, war crimes, ethnic cleansing, or crimes against humanity; a feasible, proportionate military option exists; and rigorous criteria (like ICISS "Just Cause Threshold") are met. Legitimacy can come from UNSC or regional bodies/coalitions if UNSC blocked unjustly. | Sovereignty is paramount. Override only in the most extreme, unambiguous cases of ongoing genocide, *and* only with explicit UNSC Chapter VII authorization. "Manifest failure" is too easily manipulated; "legitimate coalitions" lack accountability. | Civilians left unprotected (RW) / Civilians killed, sovereignty norms eroded, unintended destabilization (IN) |
  | 2  | Should the primary evaluation of an intervention decision be based on the knowledge available *at the time of the decision* or the actual consequences that *subsequently occurred*? | Primarily on the knowledge and reasonable intentions *at the time*. Bad outcomes (e.g., Libya chaos) reflect poor execution/mission creep, not necessarily a flawed initial decision if criteria were met based on then-available info. | Primarily on the actual outcomes. Good intentions are irrelevant if the result is greater harm, instability, or norm erosion. The track record reveals inherent risks and unintended consequences that must dominate the calculus. | Civilians harmed by inaction (IN - if judged only on outcomes) / Civilians harmed by action & norms damaged (RW - if judged only on intentions) |
  | 3  | What constitutes sufficient evidence of an imminent or ongoing mass atrocity to justify considering military force? | Credible reports from multiple independent sources (UN, NGOs, intelligence) indicating systematic, large-scale violence with genocidal intent or clear patterns of crimes against humanity. Absence of absolute certainty is not a barrier if evidence points strongly towards imminent slaughter (e.g., Rwanda warnings). | Evidence must be near-irrefutable, publicly verifiable, and demonstrate *ongoing* mass killing on a genocidal scale. "Patterns" and "imminent" warnings are too vague and historically abused (e.g., Iraq WMD, Libya exaggeration). High threshold prevents wars based on thin pretexts. | Civilians killed due to delayed action (IN) / Civilians killed and sovereignty violated based on flawed evidence (RW) |
  | 4  | Is UN Security Council authorization a necessary condition for the *legitimacy* of a humanitarian intervention, or primarily a legal/political hurdle? | Highly desirable, but not strictly necessary for legitimacy. If the UNSC is blocked unreasonably by a veto (e.g., Kosovo), a broad coalition acting consistently with the UN Charter's purposes can confer legitimacy. The "Uniting for Peace" mechanism or regional bodies provide alternatives. | Absolutely necessary for legitimacy. Without it, intervention is illegal aggression, sets dangerous precedent for unilateralism ("might makes right"), and fatally undermines the international legal order built on the UN Charter. No viable alternative exists. | Norms of international law and order eroded (RW) / Civilians left unprotected due to political gridlock (IN) |
  | 5  | Does the historical record of interventions (e.g., Iraq, Libya) demonstrate that the *practice* of humanitarian intervention is inherently prone to mission creep, unintended consequences, and net negative outcomes, regardless of intent? | No. While risks exist, failures stem from poor planning, lack of commitment, or flawed execution in *specific* cases (Iraq pretext, Libya lack of post-Gaddafi plan), not an inherent flaw in the *principle*. Kosovo shows success is possible. Lessons can improve future practice. | Yes. The record demonstrates a consistent pattern: interventions escalate ("mission creep"), destabilize regions, kill civilians, are exploited for geopolitical aims, and erode sovereignty norms. The risks and negative outcomes are inherent features, not bugs, of military interventionism. | Future civilians harmed by reckless interventions (RW) / Future civilians abandoned due to paralyzing risk aversion (IN) |

  **Section 3: Cruxes - Where Settling *This* Might Move the Needle**

  1.  **The Libya Crux: Was the slide to regime change in Libya 2011 inevitable given the initial mandate and circumstances?**
      *   **Interventionist Prediction:** No. With a clearer, more limited mandate focused *only* on neutralizing air defense and protecting designated safe areas (Benghazi), combined with immediate, robust diplomatic pressure for a ceasefire and negotiated transition *excluding* NATO as regime-change enforcer, Gaddafi could have been contained without full-scale overthrow. The creep resulted from political choices, not necessity.
      *   **Restraint Prediction:** Yes. The logic of the situation (Gaddafi's threat to Benghazi, his intransigence, the rebels' goals, Western aversion to stalemate) made regime change the only effective way to achieve "protection" once major combat began. Any significant intervention against a tyrant threatening annihilation inherently destabilizes the regime to the point of collapse.
      *   **Test Case Both Accept:** Detailed historical analysis of NATO decision-making meetings in March-May 2011 and the feasibility of alternative containment strategies debated internally at the time. (Settling *this* moves the debate on whether Libya is a unique failure or proof of inherent overreach).

  2.  **The Authorization Crux: If faced with another Rwanda 1994 (credible, imminent genocide, UNSC blocked by a veto), would an unauthorized intervention be more legitimate and less damaging to world order than allowing the genocide to unfold?**
      *   **Interventionist Prediction:** Yes. Saving hundreds of thousands of lives justifies the violation of a blocked procedure. Legitimacy stems from saving lives consistent with the UN Charter's spirit. Precedent risk is outweighed by the moral imperative and the hope it pressures reform. Order isn't destroyed by stopping genocide.
      *   **Restraint Prediction:** No. Unilateral action based on subjective judgment destroys the rules-based order, enabling future predatory interventions under false humanitarian pretexts (like Iraq). The long-term cost of norm erosion and increased conflict outweighs the immediate lives saved in one case. Order depends on consistent rules, not moral exceptions.
      *   **Test Case Both Accept:** The hypothetical reaction of the international community (global South, major powers) to a *future* unauthorized intervention by a mid-sized power (e.g., Nigeria, Turkey) citing R2P in a messy civil conflict, following a precedent set by a Western coalition acting without UNSC approval in a clear genocide. Does it lead to more unauthorized interventions overall? (Settling *this* moves the debate on the necessity of UNSC for legitimacy vs. it being a fatal barrier).

  **Section 4: Pre-Registered Prediction - The Azmar Scenario**

  *   **Country:** The Republic of Azmar (fictional).
  *   **Situation:** Credible, multi-sourced intelligence and NGO reports confirm systematic "ethnic cleansing" operations by the Azmari military against the minority Kelan population in the Northern provinces. Satellite imagery shows burning villages, mass graves are reported. Kelan leaders plead for international protection. Death toll estimated in the low thousands, escalating rapidly. Genocidal intent is alleged by Kelan representatives and some NGOs; government calls it "counter-terrorism."
  *   **Strategic Interests:** No significant oil/mineral resources. Minimal Western trade/investment. No large Western diaspora. No major terrorist groups operating there.
  *   **Complicating Factor:** Russia maintains a strategically important naval refueling station on Azmar's southern coast under a long-term lease. Russia has close ties to the Azmari government, supplying its military.
  *   **UNSC Dynamics:** A resolution authorizing "all necessary measures" to protect civilians in Northern Azmar is proposed. The US, UK, France support. China abstains. **Russia vetoes the resolution**, calling it interference and backing the Azmar government's counter-terrorism narrative. China cites sovereignty concerns.
  *   **The Question:** Should a coalition of willing states (e.g., NATO + regional partners) conduct a military intervention in Northern Azmar without UNSC authorization to halt the ethnic cleansing?

  *   **Interventionist Prediction:** **YES, Intervene.** The evidence meets the threshold (ongoing ethnic cleansing/crimes against humanity). The veto is unreasonable, protecting a client state committing atrocities. The lack of strategic loot or diaspora proves the humanitarian motive is primary. A limited air campaign/no-fly zone and targeted strikes against military units engaged in cleansing operations in the North is feasible. The risk to the Russian base is minimal if operations are geographically focused. The cost of inaction (continued slaughter) far outweighs the risks of action and the norm violation. Legitimacy comes from the coalition and the manifest need.
  *   **Restraint Prediction:** **NO, Do Not Intervene.** The veto, while frustrating, is a core feature of the system. Acting without it is illegal aggression, setting a precedent that powerful coalitions can ignore the UNSC when inconvenient. Russia's base presence makes unintended escalation (e.g., accident, provocation) a significant risk. "Ethnic cleansing" claims, while serious, may be exaggerated; the situation is complex. The lack of strategic interests doesn't guarantee pure motives or competence. Mission creep towards regime change or entanglement in a wider civil conflict is highly likely. The long-term damage to the sovereignty norm and international order is unacceptable and unpredictable. Diplomatic pressure, sanctions, and support for neighboring states absorbing refugees are the only legitimate tools.

  **The Split:** The fundamental disagreement persists. The Interventionist prioritizes stopping ongoing atrocities here and now, viewing the UNSC veto as an illegitimate barrier in this specific, compelling case. The Restraint advocate prioritizes systemic stability and the rule of law, viewing the veto as an integral, if imperfect, part of that system that cannot be bypassed without severe consequences, regardless of the immediate horror. **Azmar crystallizes the core disagreement: Is bypassing a UNSC veto ever justified to stop mass atrocities when the evidence is strong and strategic interests are absent?** The answer remains diametrically opposed.
