answer: |-
  ## Dialogue: The Unstable Baseline

  **Characters:**  
  *   **Alex (Objector):** Believes the demandingness objection defeats act consequentialism.  
  *   **Sam (Defender):** Believes the objection can be answered, specifically by incorporating the agent's projects into the welfare calculus.

  **Setting:** A quiet corner of a university library cafe.

  **(The dialogue begins after Alex has just summarized the demandingness objection.)**

  **Sam:** Alex, I grant the objection *seems* powerful at first glance. But I think it stems from an overly narrow view of welfare. Act consequentialism demands we maximize overall welfare. Why assume the *only* way to do that is by giving resources directly to distant strangers? The agent’s own life, their projects, relationships, health, even leisure – these are *sources* of welfare. Depriving the agent of these doesn’t just create a loss *for them*; it destroys a *producer* of welfare. Sacrificing them recklessly can be net welfare *negative*. Consequentialism isn't blind to this; it requires us to weigh the welfare *produced* by the agent's resources in their own life against the welfare *produced* by redirecting those resources.

  **Alex:** That’s precisely my worry, Sam. You say “recklessly” and “net negative,” but where’s the stable baseline? Take me, a software engineer. I care deeply about mastering complex systems, contributing to open-source projects, mentoring juniors. You’ll say this isn't just *my* preference, but genuinely welfare-producing: I create useful tools, solve problems, foster skills in others. Fine. But now, consider my *specific* project this week: attending the "CloudNativeCon" conference. It costs $1500. That money *could* save a life via AMF. You’ll counter: “Attending makes Alex a better engineer long-term, increasing their future impact and welfare production.” But how do we *know* that? Maybe it’s mostly networking and free swag. The redescription feels infinitely flexible: Anything I care about can be framed as “welfare-producing” *because* I care about it and it sustains me. If I *say* CloudNativeCon maximizes welfare *for me*, does that automatically justify it? If so, consequentialism demands almost nothing. But if it *doesn’t* automatically justify it, if you insist on some *external* measure of welfare production beyond my preference, then suddenly, attending the conference looks like a massive welfare loss compared to donating – and I'm back to being demanded to give up almost everything I value. It’s either vacuous or devastating. Where’s the principled stopping point?

  **Sam:** It’s not vacuous, and the stopping point *is* principled: maximize *actual*, *overall* welfare. The key is that welfare isn’t *defined* solely by the agent’s preferences. We need an *objective* (or at least inter-subjective) theory of welfare – say, preference-satisfaction, objective list, or hedonic states. My attending CloudNativeCon isn’t justified *just because I care about it*. It’s justified *if and only if* the *actual* increase in welfare (mine and others) it produces *over time* exceeds the welfare increase achievable by donating the $1500 now. Crucially, this includes *future welfare production*. Depleting my health, skills, or motivation via constant sacrifice isn't just a current loss; it likely *reduces my capacity* to generate future welfare – for myself and others (e.g., through less effective work, less mentorship). The demandingness isn't swallowed; it's *contextualized*. We run the numbers: What is the *actual* expected welfare gain from the conference (better skills → better projects → more utility generated)? What is the *actual* expected welfare gain from $1500 to AMF (lives saved)? Consequentialism demands we choose the option with the higher expected net welfare. The baseline *is* fixed: it's the counterfactual – what happens if you *don't* spend the resource on your project? But the *answer* is contingent on empirical facts.

  **Alex:** Contingency is the problem! If demandingness hinges entirely on contingent empirical facts about welfare production efficiencies, then consequentialism *itself* doesn’t tell us if it’s demanding or not. It could be incredibly demanding *or* incredibly permissive depending on world facts. My objection isn’t just that it *might* be demanding; it’s that if the *only* thing preventing extreme demandingness is the *accidental* fact that my projects happen to be efficient welfare-producers *in this world*, that feels like luck, not a *philosophical* answer. What if the empirical facts change? Suppose we discover a hyper-efficient charity where $1500 saves *five* lives, not one. Or worse, suppose through careful study we find that *my* specific skills plateau quickly, and attending CloudNativeCon genuinely adds little marginal value to my welfare production capacity compared to the lives saved. Suddenly, your contextualization vanishes, and consequentialism crashes down, demanding I skip the conference and donate. The theory seems unstable – its demandingness isn't an inherent feature I can grapple with, but a weathervane spinning with the empirical winds. How is this a *defense*? It seems to concede that if the world were slightly different (or I were slightly less talented), consequentialism *would* become crushingly demanding, validating the objection.

  **Sam:** But Alex, that’s the nature of a *consequentialist* theory! It *is* fundamentally contingent. It tells us to *track* the actual good. If the world changes such that redirecting resources from personal projects yields vastly more welfare, then yes, the theory *would* demand more redirection. That’s not a bug; it’s a feature. It means the theory adapts to maximize good in *any* circumstance. The defense isn't that it's *never* demanding; the defense is that it *isn't necessarily* demanding in the extreme, blanket way the objection often assumes. In our *actual* world, with humans as we are, sustainable personal projects *are* empirically crucial nodes in the welfare network. Depleting them is usually counterproductive *even for total welfare*. The "accommodation" isn't arbitrary; it's *required* by the maximizing principle itself when we account for long-term dynamics and agent capacities. Demandingness isn't essential to consequentialism; it's an empirical prediction about how its imperative plays out given human psychology and global need. In worlds where personal projects *are* inefficient welfare-producers, consequentialism *would* demand their sacrifice – but that would be the right answer *in that world*.

  **Alex:** I see the structure, Sam, but the instability remains problematic. My core concern is this: Your move dissolves the *categorical* demandingness worry only by making the permissibility of my projects hostage to contingent welfare calculus. But the *objection* arises from a deep intuition that morality shouldn’t demand the *systematic* sacrifice of personal integrity and ground projects *even if* that sometimes maximizes welfare. Your answer essentially says: "Sometimes it doesn't demand sacrifice, sometimes it does, and when it does, that's just the correct moral demand." But that doesn't *answer* the intuition driving the objection; it just *relocates* it. The objection feels that a moral theory *requiring* me to abandon my core projects if a spreadsheet says it yields 0.1% more welfare somewhere else – which *could* happen, empirically – is unreasonable *as such*, regardless of the world's state. Your defense makes the demandingness contingent, but it doesn't show why the *potential* for extreme demands under readily conceivable empirical scenarios isn't itself a fatal flaw. It feels less like an answer and more like admitting the objection is sometimes true, but arguing we're lucky it's not true right now.

  **Sam:** Perhaps the impasse is here: You see the *potential* for extreme demands under conceivable (even if not actual) empirical scenarios as a fatal flaw inherent to the theory's structure. I see demandingness as an *output* of the theory applied to the world, not an inherent input, and crucially, in the world we inhabit, the theory doesn't output the extreme demands the objection fears because of the welfare value of sustainable agency. I agree the theory *could* be very demanding in some worlds, and that might make someone *reject* consequentialism. But my point is that *in our world*, the objection fails as an accurate description of what consequentialism actually requires, precisely *because* of the welfare value of the agent's projects. The 'unstable baseline' isn't arbitrary; it's fixed by the objective (or best intersubjective) welfare facts and the counterfactual analysis. The redescription works *because* these projects genuinely *are* welfare-producers, not merely because we call them that. The theory doesn’t demand "give until it hurts"; it demands "allocate resources optimally, including to maintain your welfare-producing capacities."

  **Alex:** Yet, the specter of the spreadsheet demanding I sacrifice my project for a marginal gain elsewhere – a specter made plausible by the *contingency* of your answer – is what keeps the objection alive for me. It shows that the theory doesn’t build in *any* intrinsic protection for the agent's integrity beyond what the welfare numbers happen to say. That lack of intrinsic protection *is* the essence of the demandingness objection, and your 'answer,' while mitigating it empirically, concedes its fundamental point about the theory's structure. We might be lucky the numbers work out, but the theory itself remains, in principle, capable of making unbearable demands.

  **(Sam pauses, considering Alex’s point.)**

  **Sam:** Honest state of play? We’ve established that describing the agent’s projects as welfare-producing *does* genuinely answer the demandingness objection *in the context of the actual empirical world we inhabit*, by showing consequentialism doesn't necessarily demand extreme, constant sacrifice. It grounds the permissibility of personal projects within the maximizing framework itself, using the counterfactual analysis of welfare production. This isn't empty; it imposes a justificatory burden – projects *must* demonstrably contribute to overall welfare to be protected.

  **However,** we’ve also established that this answer makes the *degree* of demandingness *contingent* on empirical facts about welfare production efficiencies. It does not – and cannot, by its consequentialist nature – provide a *categorical*, non-contingent guarantee against extreme demands. If the empirical facts were different, consequentialism *would* demand significantly more. Therefore, the objection *survives* in a modified form: not as proof that consequentialism *is* unacceptably demanding in practice, but as highlighting that its structure *allows for* (and would require) such demands under conceivable, even if not actual, circumstances. Whether this *potential* is a decisive flaw depends on how one weighs the importance of intrinsic agent protections against the imperative to maximize good, regardless of contingency. We haven't resolved *that* deeper disagreement.
