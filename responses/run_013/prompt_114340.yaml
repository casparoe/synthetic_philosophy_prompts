prompt: |-
  I'm a novelist, working on a book set in 1930's Vienna, and one of my characters is a graphic designer who gets mixed up with the Vienna Circle crowd. I've been reading Otto Neurath's International Picture Language for background, and there's a passage that's tying me in knots. The gist of it, as I understand it, is that Neurath says picture language is not a universal language — it's not that anyone can look at a chart and immediately understand it without being taught — but it is an international language, because it doesn't belong to any one nation or national language. Then he says word language is also international in a way, since you can translate from one to another, but picture language is different because it's not a language of words at all. And he says picture language can't express everything word language can, but that's fine because it's for a different purpose.

  What I can't get my head around is what he means by international here, and why he's so keen to distinguish it from universal. Is he just making a semantic point, or is there a real claim about how pictures mean things? And what is the purpose he thinks picture language is for? Is it just statistics and propaganda, or is there something more philosophical going on? I need to understand this well enough to have my character talk about it convincingly, and maybe to have another character push back.

  Can you break down what Neurath is actually claiming in this passage? What the distinction between international and universal amounts to, what it implies about how picture language works, and what he thinks it's for. Also, tell me how confident you are in your reading, and which part of it you're least sure about.
