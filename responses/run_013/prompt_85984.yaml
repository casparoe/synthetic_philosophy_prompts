  But case (iii) is problematic. The student claims the beer conditional "isn't a conditional connective" and calls truth-conditional semantics "the wrong shape," which misses how restrictor views actually handle such cases. They also imply it's purely pragmatic, undermining their own earlier restrictor argument. That's a significant oversight.

  For part (b), the student perfectly states Adams' thesis and triviality results' impact on truth-conditional approaches. Their explanation of why Stalnaker fails is textbook. The Kratzer restrictor solution is also correctly sketched, including why subjunctives evade Adams' thesis due to zero-probability antecedents. No flaws here.

  The grading breaks down clearly: part (a) gets 6/8 (losing points on mishandling case iii) while part (b) earns full 12/12. The feedback needs to explicitly flag where case (iii) analysis went wrong - specifically the failure to apply the restrictor view consistently and the unnecessary appeal to pragmatics. For part (b), every component is present and accurate. 

  The professor will appreciate noting how the student's own restrictor argument in (b) could have resolved their (a)(iii) struggle - that connection might help the student see the inconsistency. Precision matters here since it's a 300-level course.
answer: |-
  ### Grading Summary  
  **Part (a): 6/8**  
  **Part (b): 12/12**  
  **Total: 18/20**  

  ---

  ### Part (a) Feedback (6/8)  
  **Question Requirements:**  
  Distinguish indicative/subjunctive (grammatical) from counterfactual/non-counterfactual (semantic) using the three cases. Explain implications for a unified semantics of ‘if’-sentences.  

  **Student’s Answer: Credit Awarded**  
  - **Opening distinction (2/2 pts):**  
    Correctly separates grammatical mood (indicative/subjunctive) from semantic status (counterfactual). Explicitly notes that counterfactuality requires a false antecedent, while subjunctive form does not.  
  - **Case (i) analysis (2/2 pts):**  
    Accurately contrasts the indicative (non-counterfactual, supported by facts) and subjunctive (counterfactual, not necessitated by facts). Highlights the truth-value divergence under same antecedent/consequent.  
  - **Case (ii) analysis (2/2 pts):**  
    Correctly identifies the subjunctive as non-counterfactual (used abductively to argue the antecedent *is* true). Reinforces the mood/counterfactuality distinction.  

  **Student’s Answer: Deductions & Corrections**  
  - **Case (iii) analysis (0/2 pts):**  
    - **Error 1:** Mischaracterizes the conditional as lacking a truth-conditional connection ("doesn’t assert any connection"). In fact, (iii) *presupposes* a connection between thirst and beer access (e.g., relevance or enablement).  
    - **Error 2:** Claims it’s "true whether or not you’re thirsty." This is incorrect. If there is no beer, the conditional is false *regardless* of thirst. Truth depends on the consequent holding *under the antecedent* (e.g., in worlds where you’re thirsty, beer must be present).  
    - **Error 3:** Concludes that "if-clauses aren’t conditional connectives" and dismisses truth-conditional semantics. This contradicts their own (correct) restrictor view in (b). The restrictor account *can* handle (iii) by treating "if" as restricting a covert modal (e.g., ☐(there’s beer)) or an existential quantifier over relevant situations.  
    - **Correction:** Case (iii) is typically analyzed as an *indicative conditional* with a *non-counterfactual* antecedent. It shows conditionals can function as *biscuits* (context-setting) or *directives*, but this doesn’t refute truth-conditional semantics (e.g., Kratzer’s restrictor approach unifies it with (i)).  

  **Part (a) Takeaway:**  
  The student excels on (i)/(ii) but misanalyzes (iii), undermining their conclusion. A unified semantics (e.g., restrictor view) *can* cover all cases by treating "if" as a non-truth-functional device that restricts operators/modals.  

  ---

  ### Part (b) Feedback (12/12)  
  **Question Requirements:**  
  1. State Adams’ thesis (P(if A, B) = P(B|A)).  
  2. Explain triviality’s impact on truth-conditional (TC) approaches.  
  3. Sketch one TC treatment that survives triviality.  

  **Student’s Answer: Full Credit**  
  - **Adams’ thesis (4/4 pts):**  
    Perfectly states the hypothesis and its notation. Adds contextual example (Oswald) showing P(B|A)=1.  
  - **Triviality results (4/4 pts):**  
    Correctly notes triviality proves conditionals lack *standard* truth conditions (via Lewis/Adams). Explicitly refutes propositional connective accounts (e.g., Stalnaker). Links Adams’ thesis to the collapse of TC semantics.  
  - **Truth-conditional workaround (4/4 pts):**  
    Accurately sketches Kratzer’s restrictor view:  
    - "If" restricts the modal base of the consequent’s operator.  
    - Explains divergence in (i)/(ii) via *modal base* (e.g., epistemic vs. counterfactual).  
    - Correctly notes Adams’ thesis fails for subjunctives due to P(A)=0 (conditional probability undefined).  
    - Implicitly defends TC uniformity: "If" has a stable semantic role (restriction) across moods.  

  **Strengths:**  
  - Integrates part (a) examples seamlessly.  
  - Identifies why triviality doesn’t doom *all* TC approaches (Kratzer avoids truth-functional connectives).  

  ---

  ### Final Comments  
  **Overall:** Strong grasp of core concepts (mood/counterfactuality, Adams, triviality, Kratzer). The flaw in (a)(iii) suggests haste in applying their own (correct) restrictor view consistently.  
  **Feedback Tip:** In comments, note: *"Your Kratzer sketch in (b) resolves the (a)(iii) issue! Apply the restrictor: ‘if you’re thirsty’ restricts a covert modal (e.g., ‘may/can have beer’) or a generic operator. This maintains truth-conditions without pragmatic handwaving."*
