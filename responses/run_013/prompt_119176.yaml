prompt: |-
  I sit on the clinical policy committee at the genomics lab where I work (I'm one of the genetic counsellors, so I'm the one who actually makes the phone calls). We're rewriting our policy on the extra findings that fall out of our sequencing panels — you know, risk flags for things the patient never came in about. Some of them are actionable; some of them definately aren't, there's nothing to do but wait, and for two of them the only intervention on offer is a prophylactic surgery that most people who get it probably shouldn't get, the numbers are bad. Right now we return everything by default, and it's been a rough year: one man flew abroad and paid cash for the surgery after a flag for a condition with no proven screening, and a woman who got a result for something with no treatment at all basically stopped leaving the house. Our lab director wants the status quo and keeps waving around a decision-theory result from the sixties — Good's theorem, I think it's called, after a statistician — that free information can never lower your expected utility, as long as you actually use it when you decide. Our participant rep says sure, but that's only true of a perfect Bayesian, and the people in our waiting room aren't that, and anyway its cold comfort to the guy who got the bad news that things come out fine on average.

  Here's the bit I can't get out of my head and I don't know if it changes anything: one participant told his counsellor flat out that if we told him he was high risk he'd demand the surgery, even though he agreed with her that it was a bad bet — he said he wouldn't be able to stop himself. Does that break the part about actually using it?

  I have to circulate a short written opinion before Thursday's meeting. So: recommend a concrete default (keep returning everything, opt-in only, staged return with counselling and a cooling-off period, return only the actionable stuff, or something else), give us a timeline we could actually implement, and take the lab director's argument as seriously as it deserves instead of just calling him paternalistic.

  Give it to me as exactly five numbered points, each one or two sentences, no intro and no wrap-up. Point 1 should be the actual recommendation and the rest the reasoning. Don't worry about citing anything, I just need the argument.
reasoning: |-
  Okay, the user is a genetic counselor on a clinical policy committee dealing with how to handle incidental findings from genomic sequencing. They need to rewrite their policy because returning all findings has caused harm—like unnecessary surgeries and severe anxiety. The lab director cites Good's theorem, arguing that information can't hurt if used rationally, but real patients aren't perfect decision-makers. One patient explicitly said he'd make a poor choice despite knowing better. The user needs a five-point recommendation with reasoning by Thursday.

  First, I need to address the core conflict: the director's reliance on Good's theorem versus real human behavior. Good's theorem assumes rational utility maximization, but the examples show emotional and impulsive reactions. The patient who can't resist surgery even knowing it's irrational directly challenges the "use it when you decide" premise. This irrationality breaks the theorem's applicability.

  Next, the recommendation must balance ethics, practicality, and respect for autonomy. Returning only actionable findings seems optimal—it prevents harm from non-actionable results while respecting utility for treatable conditions. A staged return with counseling could work but might not scale and still exposes patients to distressing info. Opt-in places burden on patients; opt-out maintains status quo issues. Actionable-only aligns with ACMG guidelines and prevents the described harms.

  Timeline feasibility is crucial. The user needs something implementable. Phased implementation starting with clear definitions (1-2 months) allows committee input. Policy updates (next month) can be drafted quickly, followed by staff training (2-3 months) for smooth transition. This is realistic without overhauling systems.

  Addressing the director's argument requires nuance. Acknowledge Good's theorem's mathematical correctness but highlight its flawed assumptions in clinical contexts—patients aren't Bayesian, emotions dominate, and "utility" includes psychological harm. The prophylactic surgery example proves information can actively reduce wellbeing. 

  The user's unspoken needs include preventing liability from bad outcomes, reducing counselor distress from delivering harmful news, and finding an ethically defensible middle ground. They also seek validation that overriding the director isn't paternalism but responsible practice. 

  Finally, structuring in five numbered points: 1) Recommendation (actionable-only), 2) Patient irrationality breaking Good's premise, 3) Harm evidence, 4) Timeline, 5) Director's argument rebuttal. Keep each point concise and impactful.
answer: |-
  1. Recommend default return of **only clinically actionable findings**, defined as those with evidence-based screening or interventions where benefits outweigh risks based on current guidelines, and implement an **opt-in process** for non-actionable results requiring genetic counselling.  
  2. This directly addresses the core failure of Good's theorem's assumption: patients *cannot* rationally "use" non-actionable information when psychological distress or impulsivity (like demanding harmful surgery despite acknowledging it's irrational) overrides reasoned decision-making, breaking the condition for the theorem's guarantee.  
  3. Concrete harms (unnecessary surgery, severe anxiety/paralysis) from returning non-actionable flags demonstrate that information *can* reduce real-world utility, contradicting the theorem's idealized "on average" outcome for non-Bayesian agents like actual patients.  
  4. Implement in **three phases**: define "actionable" per current guidelines within 1 month; update consent/ordering/policy documents within next month; train GCs/staff on opt-in counselling for non-actionable findings within 2-3 months.  
  5. Good's theorem is mathematically sound *given its assumptions*, but its assumptions (perfect rationality, consistent utility maximization unaffected by the information's emotional impact) are clinically invalid, making it inapplicable to decisions causing documented, preventable harm like the cited cases.
