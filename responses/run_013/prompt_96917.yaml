  4. For each: objection → reply → weakness 
  5. Closing: How to frame as research direction

  The executor case is clever but vulnerable to "who guards the guardians?" critiques. Must acknowledge that chains only push the problem upstream while maintaining it's meaningfully different from agent-centric views.

  Prioritize damage levels: 
  - Nuclear objection (chain bootstrapping) does most damage 
  - RL testability concerns next (threatens relevance) 
