  The audience consists of RL researchers (who want measurable results), decision theorists (who think in consistent-planning terms), and governance specialists. No philosophers - this crowd demands formalism. The user specifically wants: 
  - Real objections phrased in audience vocabulary 
  - Separated by discipline where divergent 
