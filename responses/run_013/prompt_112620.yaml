  I'm a software engineer with no formal philosophy background, so what I want here is a prediction rather than a summary. Suppose Leibniz had lived to see Searle's Chinese Room argument and the debate it provoked. Given his own commitments — his mill argument, that if we could walk about inside an enlarged thinking machine we should find only parts pushing against one another and nothing that accounts for a perception, together with his view that only simple substances perceive while composites are mere aggregates — what verdict would he have reached on the conclusion Searle draws, that rule-governed symbol manipulation by itself yields no understanding? Would he have endorsed that conclusion, and where would his grounds have diverged from Searle's? Take the systems reply as the test case: would he have treated it as a live option, or as a confusion about what can be the subject of a perception? Finish by saying which strand of the current discussion he would have found most congenial and which he would have thought beside the point.
