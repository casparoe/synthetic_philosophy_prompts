prompt: |-
  I direct a three-year project excavating a settlement of about forty houses, rebuilt on the same footprints over several centuries. The inhabitants left no writing and no identifiable descendants, and our evidence is entirely material: the rebuilt houses; a pit just outside the settlement holding some three thousand objects, most of them broken in a consistent and apparently intentional way and many of them burnt; and a cemetery in which a minority of graves contain goods carried from several hundred kilometres away. The funder's ethics panel has barred us from ethnographic analogy — we may not reason from any documented society, past or present, to this one — on the grounds that such reasoning smuggles in colonial assumptions about what counts as religion, property or a person. The ban removes the crutch my discipline normally leans on, and I want to know what to do with three years of work.

  Which open conceptual questions about getting from objects to beliefs and institutions should we prioritise, and in what order? The kind of thing I have in mind: whether a material record of this sort underdetermines any attribution of belief; whether belief is the right target at all, rather than practice or skill; whether institutions such as hierarchy, inheritance or property can be inferred from patterns of deposition rather than quietly assumed; and what happens to our descriptions when the only vocabulary available is our own. Rank them, say which are upstream of which, which are tractable for a team with no texts, no informants and no permitted comparison, and what would move a question up or down the list. If you think the ban on analogy makes the central questions unanswerable rather than merely hard, say so and tell me what the project should be doing instead.

  Lead with your bottom line in the first sentence, then give your reasoning; no preamble, and no restating of my question.
reasoning: |-
  Hmm, the user is directing a major archaeological project facing a critical methodological challenge. They're excavating a settlement with 40 repeatedly rebuilt houses, a large pit containing thousands of intentionally broken and burned objects, and a cemetery with some graves containing distant trade goods. The key constraint is that their funding ethics panel has banned all ethnographic analogy due to concerns about colonial assumptions contaminating interpretations of religion, property, or personhood.

  The user needs help prioritizing conceptual questions about moving from material evidence to beliefs and institutions. They've suggested several important questions: whether material evidence underdetermines belief attribution; whether belief is even the right focus versus practice/skill; whether institutions like hierarchy can be inferred from deposition patterns; and how to handle the problem of using our modern vocabulary to describe past societies. They want these questions ranked by importance, with consideration of which are foundational (upstream), which are actually solvable given their constraints (no texts, no informants, no comparisons), and what factors might adjust priority.

  I need to lead with a clear bottom line: their project should prioritize practice/skill over belief, then deposition patterns for institutions, while acknowledging the vocabulary problem as fundamentally limiting but unavoidable. The ban makes belief claims extremely difficult but not impossible if approached carefully through material practices.

  For ranking: Practice/skill should come first because it's directly observable in the archaeological record - rebuilding patterns, object breakage techniques, and burial practices show repeated actions that don't require mind-reading. This is tractable through detailed analysis of how things were made, used, and deposited. The pit of broken objects is particularly rich here.

  Next is inferring institutions from deposition patterns - looking for regularities in how objects are treated that might indicate social structures. The cemetery with variable grave goods and the intentional pit deposition could reveal patterns suggesting social differentiation or property concepts. This builds on the practice analysis but requires more cautious interpretation.

  Then, vocabulary awareness - recognizing how our modern terms may misrepresent their society. This should frame all interpretation but can't be "solved," just mitigated through careful language choices. It's always present but not a primary research focus.

  Finally, belief attribution - which is highly problematic under the ban since it requires inferring mental states. The project might only approach this tentatively through exceptional cases, like possible ritual destruction in the pit. It should be last because it's the most speculative and vulnerable to colonial thinking traps.

  The ethics ban shifts the project toward what's materially demonstrable rather than speculative interpretation. Instead of trying to reconstruct belief systems, they should focus on reconstructing operational sequences of practices, which can still reveal sophisticated social organization. The constraints force methodological innovation that could benefit archaeology more broadly by reducing reliance on ethnographic crutches.
answer: |-
  Prioritize understanding material practices first, then cautiously infer institutions from deposition patterns, while explicitly acknowledging the vocabulary problem throughout; belief attribution should be lowest priority and approached only through tightly bounded material actions.  

  **Ranked Conceptual Questions (Most to Least Critical):**  
  1.  **Whether practice/skill (not belief) is the primary target:**  
      *   **Why Upstream & Tractable:** This is foundational. Practices (house rebuilding techniques, object fragmentation methods, cremation/burial procedures) are directly observable in the material record (house sequences, pit contents, graves). Skills are materially encoded (craftsmanship in objects, consistency in breakage patterns, construction methods). It requires meticulous description of *how* things were made, used, broken, deposited – bypassing the need for analogy or mind-reading. Focus on the operational sequence of the pit deposition: selection, breakage technique, burning, placement. *Tractability:* High. Core archaeological method. *Moves Up:* If patterns show high consistency/variation requiring skilled execution or learned bodily techniques.  

  2.  **Whether institutions (hierarchy, property, exchange) can be inferred from patterns of deposition rather than assumed:**  
      *   **Why Next & Semi-Tractable:** Builds on #1. Analyze *spatial and contextual patterning* of practices. Does house rebuilding show uniformity or variation suggesting norms/control? Does the pit's location/content imply communal vs. restricted access? Does the *selectivity* of objects in the pit (types broken/burnt/not) or grave goods imply rules? Long-distance goods in *some* graves: Is the deposition pattern (who gets them, how many, with what else) structured? Look for repetition, exclusion, concentration. *Tractability:* Moderate-High for identifying *patterns*; Moderate-Low for *specific* institutional labels (e.g., "property" vs. "inalienable possession"). Requires robust statistical/spatial analysis. *Moves Up:* If strong, recurring patterns emerge (e.g., only specific house types have certain objects; grave goods correlate strongly with specific age/sex/position; pit contains only specific object classes). *Moves Down:* If patterns are weak or ambiguous. *Upstream of:* Belief attribution.  

  3.  **What happens to descriptions when the only vocabulary is our own (vocabulary problem):**  
      *   **Why Critical Context, Less "Solvable":** Pervades *all* interpretation. You *must* use terms like "house," "grave," "break," "burn," "settlement," "object," but these carry modern baggage. The ban makes this acute. Strategy: Rigorously define operational/material criteria for each term used (e.g., "grave" = human remains in a dug feature with associated deposits). Acknowledge the gap between your descriptor and the emic concept. *Tractability:* Low for "solving," High for mitigating through explicit definition, scaffolding (e.g., "features we interpret as houses based on criteria X, Y, Z"), and acknowledging limitations. *Not upstream/downstream* – it's the constant frame. *Moves Up:* Always present; critical when applying institutional labels from #2.  

  4.  **Whether the material record underdetermines attribution of belief:**  
      *   **Why Lowest Priority & Barely Tractable Under Ban:** Beliefs (internal states, cosmology) are hardest to access materially without analogy/texts/informants. The ban explicitly targets colonial assumptions smuggled in via "religion" etc. Focus: Can specific, *bounded* material *actions* be strongly linked to possible non-utilitarian intent? E.g., the consistent, intentional breakage *and* burning *and* deposition in a specific pit *might* indicate a practice beyond mere discard. However, labeling it "ritual," "sacrifice," or "offering" risks smuggling in belief. *Tractability:* Very Low. Stick to describing the action ("systematic fragmentation and thermal alteration followed by communal deposition in a designated feature") and *only cautiously* infer it *may* have held non-utilitarian significance based on its apparent cost/consistency/context. Avoid labeling the belief system. *Moves Down:* Due to the ban and inherent difficulty; focus is the *practice* (#1), not the belief behind it.  

  **On the Ban & Project Focus:**  
  The ban makes *direct* attribution of specific beliefs (e.g., "they believed in an afterlife") or unmodified institutional labels (e.g., "private property," "chiefdoms") largely unanswerable *as typically conceived*. However, it does **not** make the project futile. It forces a rigorous focus on what the material record *can* robustly show:  
  *   **Material Practices & Skills:** The core actions of daily and exceptional life.  
  *   **Patterned Deposition & Spatial Organization:** Revealing social structures and norms through repetition and variation.  
  *   **Long-term Change:** How practices and patterns evolved over centuries within the house footprints and cemetery.  
  *   **Resource Networks:** Provenance of distant grave goods showing connection, irrespective of the institutional framework of exchange.  

  **Instead:** Build a meticulous narrative of *materially observable practices and patterns* over time. Describe the "operational sequences" of life, death, and deposition in this specific place. Use this to cautiously discuss *social dynamics* (e.g., "evidence for differentiated access to certain resources or practices") based *only* on the patterns, avoiding loaded terms where possible and carefully defining/scaffolding them when essential. This provides a foundation others might cautiously compare *to* in the future, without you making the analogies. The unique, long-term sequence of rebuilds on the same footprints is a phenomenal dataset for understanding continuity and change in practice at a household/community level – leverage that intensely.
