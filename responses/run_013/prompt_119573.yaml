answer: |-
  ### Screening Procedure for Cognitive Penetration Claims

  **Purpose**: To evaluate claims that cognitive states (e.g., beliefs, desires) alter perceptual content (what is "seen"), distinguishing true penetration from post-perceptual effects or design artifacts.  
  **Output Verdicts**:  
  - **Candidate penetration**: Evidence suggests cognitive state directly alters perceptual content.  
  - **Post-perceptual effect**: Effect operates on memory, response bias, or decision criteria.  
  - **Design cannot distinguish**: Method fails to isolate perception from alternatives.  
  - **Not a perceptual claim**: Paper does not assert a change in perceptual content.  

  **Procedure Steps**:

  1. **Assertion Check**  
     - **Question**: Does the paper explicitly claim that a cognitive state altered the *content or character* of the perceptual experience (e.g., "subjects saw X differently"), not just their report or behavior?  
     - **Sufficient Answer**: Claims use perceptual terms (e.g., "appeared," "saw," "perceived") or assert changes in sensory qualities (e.g., size, brightness, content).  
     - **Stop If**: No explicit perceptual claim → **Not a perceptual claim at all**.  
     - **Judgment**: Editor decides based on stated claims (not implications). *This step requires human judgment*.  

  2. **Sensory Input Control**  
     - **Question**: Could the cognitive state have altered *sensory input* (e.g., via attention shifts, eye movements, or differential viewing)?  
     - **Sufficient Answer**: Methods control input (e.g., fixed gaze/eye-tracking, brief displays ≤200ms, masked stimuli, or equal attention across conditions).  
     - **Stop If**: Input not controlled (e.g., free viewing, self-paced tasks) → **Design cannot distinguish** (effect may be attentional, not perceptual).  
     - **Mechanical**: Check methods for controls (e.g., "eye-tracking used," "stimuli presented for 100ms").  

  3. **Stimulus Identity**  
     - **Question**: Was the *identical physical stimulus* used across cognitive-state conditions?  
     - **Sufficient Answer**: Identical stimuli are presented; cognitive state is manipulated independently (e.g., via pre-trial instructions, subject groups).  
     - **Stop If**: Stimuli differ between conditions → **Design cannot distinguish** (effect may stem from stimulus differences).  
     - **Mechanical**: Verify stimulus descriptions in methods.  

  4. **Response Bias Ruling-Out**  
     - **Question**: Could the effect reflect a shift in *decision criteria or response bias* (e.g., willingness to report "X") without perceptual change?  
     - **Sufficient Answer**: Signal detection theory (SDT) metrics (d′ for sensitivity, β for bias) show sensitivity change (d′), not just bias.  
     - **Stop If**:  
       - No SDT/alternative methods (e.g., criterion-free measures like forced-choice) → **Design cannot distinguish**.  
       - SDT shows bias change (β) only → **Post-perceptual effect**.  
     - **Mechanical**: Check analyses for d′/β or equivalent.  

  5. **Memory Delay Control**  
     - **Question**: Could the effect reflect *memory decay or distortion* after perception?  
     - **Sufficient Answer**: Responses collected during/immediately after stimulus presentation (e.g., real-time reporting, delays ≤500ms).  
     - **Stop If**: Significant delay between stimulus and response (e.g., post-trial ratings, retrospective judgments) → **Design cannot distinguish** (effect may be mnemonic).  
     - **Judgment**: Editor assesses timing from methods. *Human judgment needed*.  

  6. **Cognitive State Origin (Note for Editor)**  
     - **Question**: Is the cognitive state *subject-driven* (e.g., hunger, chronic stereotype) or *experimenter-cued* (e.g., prime, instruction)?  
     - **Action**: Do not stop. Flag for editorial consideration:  
       - Subject-driven states are stronger evidence for penetration.  
       - Cued states risk demand characteristics; do not conflate with standing states.  
     - **Mechanical**: Categorize based on manipulation description.  

  7. **Verdict Assignment**  
     - **Passed Steps 1–5** → **Candidate penetration**.  
     - **Notes**:  
       - Indirect effects (e.g., via attention or strategy) are flagged as such but still categorized as candidate penetration if Steps 1–5 passed.  
       - Step 6 observations inform editorial evaluation but do not change verdict.  

  ---

  ### Procedure Applied to Example Submissions

  **Example 1**: Hungry vs. sated subjects rate food photos as larger/more saturated (unlimited viewing, rating scale).  
  - **Step 1**: Claim: Hunger alters appearance (size/saturation). **Perceptual claim** → Proceed.  
  - **Step 2**: Unlimited viewing → No input control (subjects may attend longer). **Verdict: Design cannot distinguish**.  
  - **Stop**. *Reason: Alternative explanation (attention-driven input change) not ruled out.*  

  **Example 2**: Subjects read crime report, then report guns in ambiguous flashed images.  
  - **Step 1**: Claim: Stereotype alters what is seen. **Perceptual claim** → Proceed.  
  - **Step 2**: Brief flash → Input likely controlled (no time for eye movements). **Proceed**.  
  - **Step 3**: Identical ambiguous images → **Proceed**.  
  - **Step 4**: No SDT (binary report) → Unable to rule out response bias. **Verdict: Design cannot distinguish**.  
  - **Stop**. *Reason: Effect may reflect willingness to report "gun," not changed perception.*  

  **Example 3**: Primed category labels speed breakthrough of suppressed stimuli in binocular rivalry.  
  - **Step 1**: Claim: Prime alters perception during suppression. **Perceptual claim** → Proceed.  
  - **Step 2**: Rivalry setup → Input controlled (fixed stimuli). **Proceed**.  
  - **Step 3**: Identical suppressed stimuli → **Proceed**.  
  - **Step 4**: No SDT (reports of breakthrough timing). Rivalry paradigms assume reports reflect perception, but no criterion-free measure → Unable to rule out bias. **Verdict: Design cannot distinguish**.  
  - **Stop**. *Reason: While striking, design cannot exclude response bias (e.g., subjects favoring primed labels).*  
  - **Editor Note**: Despite verdict, rivalry effects are often treated as perceptual; consider editorial override for review if mechanistic controls exist.  

  ---

  ### Limitations and Flattened Distinctions  

  **What the Procedure Cannot Do**:  
  1. **Detect indirect penetration**: The procedure flags indirect effects (e.g., attention-mediated) as "candidate penetration" if alternatives are ruled out, but cannot adjudicate theoretical debates about whether indirect effects "count" as penetration.  
  2. **Validate paradigm-specific assumptions**: For established methods (e.g., binocular rivalry), it defaults to strict SDT requirements, potentially misclassifying field-accepted effects.  
  3. **Capture dynamic processes**: Long-term training or strategy shifts may be mislabeled as "design cannot distinguish" if input control (Step 2) is not perfectly maintained.  
  4. **Neural/physiological evidence**: The procedure is behavior-only; neural data (e.g., early ERP changes) are ignored.  

  **Flattened Distinctions and Trade-offs**:  
  - **Indirect vs. direct penetration**: The procedure does not distinguish between direct cognitive-perceptual links and indirect routes (e.g., attention) in the verdict. *Loss*: Nuance about mechanistic pathways is reduced to "candidate penetration."  
  - **Stimulus-driven vs. top-down cues**: Experimenter-supplied cues (e.g., primes) are treated identically to endogenous states if design passes Steps 1–5. *Loss*: Inflation of claims about "standing" cognitive states.  
  - **Perceptual certainty**: SDT (Step 4) is over-relied upon; paradigms without clear sensitivity metrics (e.g., rivalry) may be unfairly penalized. *Loss*: Potential false negatives for valid effects.  
  - **Temporal dynamics**: "Immediate" responses (Step 5) are simplistically defined; delays may not always indicate memory effects. *Loss*: Some perceptual integration effects may be excluded.  

  **Recommendation**: Use this procedure for rapid screening, but override with expert judgment for methodologically sophisticated submissions (e.g., rivalry, neural measures) or where converging evidence exists.
