answer: |-
  **INTERNAL GUIDANCE MEMORANDUM NO: 47-22/B**  
  **TO: All Regional Directors & Field Assessment Officers**  
  **FROM: Head Office, Taxonomic Determination & Legal Compliance Division**  
  **SUBJECT: Revised Protocol for Subspecies Elevation & Distinct Population Segment (DPS) Designation under the Endangered Species Preservation Act (ESPA)**  
  **EFFECTIVE: Immediately**

  Effective immediately, the determination of whether a local population warrants elevation to full species status, or designation as a Distinct Population Segment (DPS) meriting protection under ESPA, shall follow the integrated criteria outlined herein. This guidance supersedes all prior memoranda on taxonomic elevation and DPS designation, specifically rescinding Memorandum 34-18/A. Our paramount objective remains the consistent application of defensible biological thresholds to ensure legal protections are applied precisely where evolution has provided us with a discrete, natural unit.

  The primary test for species-level distinction remains demonstrable reproductive isolation leading to the absence of persistent, viable hybrids in zones of contact or sympatry per Section 3(a)(i) of the ESPA Implementation Guidelines. Evidence may include behavioral barriers, mechanical incompatibility, hybrid sterility, or ecological displacement preventing interbreeding. Field officers should prioritize observational data over inferred mechanisms. *However*, it is acknowledged that certain obligately asexual lineages (e.g., bdelloid rotifers, some whiptail lizards) present unique challenges to this framework. In such cases, officers may proceed directly to morphological divergence assessment (Section 5) or genetic distance metrics (see Clause 4(b) as amended), bypassing the interbreeding criterion entirely. This is not an inconsistency but a practical adaptation reflecting the diverse strategies of life.

  Genetic analysis provides crucial quantitative support. Clause 4(b) establishes a threshold of ≥ 2.7% mean nucleotide divergence in the mitochondrial cytochrome *b* gene (or equivalent neutral marker) between the candidate population and its nearest conspecific relatives as a strong indicator of evolutionary independence. This figure represents a robust policy consensus balancing statistical signal against naturally occurring intraspecific variation (*Refer to the Technical Note appended to Clause 4(b) regarding calibration against vertebrate mutation rates and the fossil record*). While divergence is a continuum, the 2.7% threshold provides a necessary bright line for legal enforceability. (*A brief aside: the selection of 2.7% inherently involves policy considerations weighing conservation need against taxonomic inflation; its biological basis, while informed by empirical observation, is ultimately operational. Similar reasoning applied rigorously to chronospecies in the paleontological record would necessitate collapsing numerous established taxa, a complication outside our present statutory remit.*)

  Morphological distinctiveness (Section 5) remains a vital tool, particularly where genetic data is limited or cost-prohibitive. Officers should document statistically significant differences in key diagnostic characters demonstrably linked to function or local adaptation (e.g., beak morphology in birds, floral structures in plants). Avoid reliance on trivial or environmentally plastic traits. Remember, significant overlap in character states, or clinal variation, generally argues against elevation, *unless* the cline itself exhibits a sharp break coinciding with a geographic barrier – suggestive of secondary contact between previously isolated forms (see *Annex D: Ring Species Complications*).

  Ecological distinctiveness (Section 6) can be a compelling secondary factor. Evidence that the candidate population occupies a unique niche, utilizes distinct resources, or exhibits adaptations to a specific habitat not shared by its relatives strengthens the case for evolutionary independence. However, ecological divergence alone, without corroborating genetic or reproductive isolation evidence, is insufficient for elevation to species rank per the *Jennings vs. Dept. of Interior* ruling (1998). It may, however, strongly support DPS designation under the "Significant Portion of Range" clause.

  Hybridization presents complex scenarios. Persistent, widespread hybridization forming a stable hybrid swarm generally indicates incomplete lineage sorting and argues strongly *against* treating the parental forms as separate species under the biological species concept implicit in Clause 4(a). Officers encountering such situations should default to treating the hybridizing complex as a single taxonomic unit for listing purposes, regardless of prior morphological classifications. *Temporary withdrawal of taxonomic recognition pending clearer evolutionary resolution is often the most scientifically prudent and legally defensible course.* Conversely, limited, localized hybridization producing unfit offspring reinforces the case for separation.

  Finally, Clause 17(c) – the "Markedly Separate Identity" provision – exists to address situations where populations exhibit profound, multi-faceted divergence observable in the field, yet fall marginally short of the quantitative thresholds for genetic distance or fail the strict interbreeding test due to anthropogenic habitat fragmentation or insufficient data. This clause acknowledges the experienced field officer's integrated judgment when faced with a population that *biologically behaves as* a distinct entity. Documentation must be thorough, citing evidence across genetic, morphological, and ecological domains where available, explicitly articulating why the population's overall biological integrity warrants recognition despite narrowly missing other criteria. Over-reliance on Clause 17(c) is discouraged, but it serves as an essential safety valve for biological reality. Remember: **We know it when we see it.** This final determination, while incorporating scientific data, is ultimately a regulatory judgment recognizing a population's significance for conservation.

  Officers must integrate *all* lines of evidence – reproductive, genetic, morphological, ecological – into a holistic assessment. No single criterion is absolutely determinative in isolation. Consistency and defensibility are paramount. Submit all elevation/DPS proposals using Form TD-22F, ensuring full justification addressing each relevant section and clause of this memorandum. Proposals relying solely on Clause 17(c) require pre-submission consultation with Head Office Taxonomy. Our goal is not philosophical purity, but the clear, consistent application of the law to identifiable units of biodiversity, recognizing that nature's categories are sometimes best captured by reasonable, standardized thresholds applied with experienced judgment.

  **// END MEMORANDUM //**

