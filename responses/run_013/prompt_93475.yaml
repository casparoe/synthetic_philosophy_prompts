answer: |-
  Below is a systematic translation of the democratic boundary problem into probability/reference class concepts, followed by a residue report and structural analysis. I’ll avoid smuggling normative assumptions into the probabilistic frame, explicitly flagging untranslatable elements.

  ### **Core Problem Translation**
  - **Boundary Problem**:  
    *Democratic claim*: Legitimacy requires that the demos (decision-making body) defines itself, but any definition is circular or arbitrary.  
    *Probabilistic analog*: To reason about an event (e.g., "What policy should govern me?"), you need a reference class (population) from which you’re a random draw. But the choice of reference class is underdetermined:  
    - Too broad (e.g., "all sentient beings") → statistics are meaningless (variance swamps signal).  
    - Too narrow (e.g., "40-year-old mathematicians in my reading group") → no data for inference (N=1).  
    - Circularity: Your choice of reference class affects the "optimal" policy, but you can’t democratically validate the class without presupposing it.  

  - **Self-Locating Uncertainty**:  
    *"Who am I in this demos?"* maps to *"Which member of the reference class am I?"*. Prior over identities depends on the chosen class (e.g., uniform over humans? over citizens?). But unlike probability, democracy requires **agency** in defining the class – a structural divergence.

  ---

  ### **Position-by-Position Translation**
  #### **1. "Include All Affected Interests"**  
  - *Claim*: The demos should include every entity affected by the decision.  
  - *Translation*: The reference class is the support of the **causal impact distribution**. If a policy affects entity X with probability \( P(\text{effect}|X) > 0 \), include X.  
  - *Pushed to extremes*:  
    - Climate policy → include all future humans, AI, even unknown species (reference class → ∞).  
    - Statistical consequence: Expected utility calculations become intractable (low signal-to-noise). Priors over "which affected entity am I?" dilute to near-uniformity over vast classes → policy recommendations converge to neutral defaults (e.g., "do no harm").  
  - *Residue*: **"Interests"** and **moral weight** have no probabilistic analogs. Probability can model *degree* of effect but not why it *should* matter normatively.  

  #### **2. "Include Only the Coerced"**  
  - *Claim*: Only those subject to enforcement (e.g., laws, taxes) belong in the demos.  
  - *Translation*: Reference class = support of the **enforcement distribution**. Include X iff \( P(\text{enforcement}|X) > \epsilon \).  
  - *Pushed to extremes*:  
    - Children/Severely disabled: \( P(\text{enforcement}) \approx 1 \) (they’re subject to laws) → include.  
    - Foreigners affected by pollution: \( P(\text{enforcement}) \approx 0 \) → exclude.  
    - Non-citizen residents: Ambiguous \( P(\text{enforcement}) \) → reference class brittleness.  
  - *Statistical pragmatism*: Like choosing a narrow reference class for operationalizability (e.g., "only taxpayers"). Reduces noise but risks selection bias (excluded entities become "outliers" with no leverage).  
  - *Residue*: **"Coercion"** as a normative boundary (vs. empirical fact) doesn’t translate. Probability treats enforcement as data, not justification.  

  #### **3. "Prior Membership" (Status Quo)**  
  - *Claim*: Pre-existing legal/cultural boundaries define the demos (e.g., citizens).  
  - *Translation*: Fix the reference class **a priori** (e.g., "current citizens"). Treat it as an immutable prior.  
  - *Pushed to extremes*:  
    - Avoids circularity by fiat → computationally cheap.  
    - But ignores changing conditions (e.g., new groups subject to coercion) → like using outdated data. Statistical risk: **model drift** (the prior no longer reflects the data-generating process).  
  - *Residue*: **Legitimacy from history/tradition** has no probabilistic counterpart. Probability cares about predictive accuracy, not inherited validity.  

  ---

  ### **Residue Report**  
  | **Democratic Concept** | **Translatable?** | **Residue Description** |  
  |------------------------|-------------------|-------------------------|  
  | **Legitimacy** | No | Probabilistic inference has no "legitimate" reference class—only useful/consistent ones. Legitimacy implies moral authority; probability implies predictive power. |  
  | **Self-Constitution** | Partial | Reference classes are observer-relative, not self-determined. The *asymmetry you noted is fundamental*: demoi are agents choosing their class; reasoners are passive samples from a class. |  
  | **Interests/Affectedness** | Quantifiable but not normative | Can model causal effects (e.g., utility impacts) but not why inclusion *should* follow from affectedness. |  
  | **Coercion** | Operationalizable but not justificatory | Can define enforcement probabilities, but not why coercion implies membership rights. |  
  | **Future Generations/AI** | Partially tractable | Can extend reference classes temporally (e.g., priors over future selves) or to new entities (e.g., Bayesian model averaging over AI sentience models). But **democratic standing** requires moral patienthood—a normative layer. |  

  #### **Key Structural Differences**  
  1. **Agency vs. Passivity**:  
     - In probability, you don’t choose/change your reference class; you reason *about* it.  
     - In democracy, the demos *is* the reference class and can redefine itself (e.g., via constitutional amendments). This recursive agency is untranslatable without smuggling in norms.  

  2. **Normative Gravity**:  
     - Boundary problems in democracy involve **moral stakes** (e.g., "Is it unjust to exclude children?"). Probability addresses **epistemic stakes** (e.g., "Will this class yield reliable inferences?"). The residue is almost entirely normative.  

  3. **Circularity Depth**:  
     - In probability, circularity is a practical failure (garbage in, garbage out).  
     - In democracy, it’s a *legitimacy crisis*—undermining the system’s moral foundations.  

  ---

  ### **Verdict: What the Residue Indicts**  
  The residue overwhelmingly consists of **normative concepts** (legitimacy, standing, coercion-as-justification) that lack probabilistic counterparts. This suggests:  
  - **The boundary problem is not merely epistemic**. It’s a problem of **authority and moral justification** disguised as a technical "who counts?" question. Probability can clarify the tradeoffs (e.g., "narrow classes reduce noise but increase exclusion errors"), but it can’t resolve why democracy *should* bind people or how it acquires moral force.  
  - **Your asymmetry insight is correct and profound**. The inability to translate self-constitution reveals a core distinction: democratic theory assumes **collective agency**, while probability assumes a **passive observer**. This isn’t a flaw in either framework—it’s a category difference.  
  - **Indictment?** The residue indicts *neither side*. Instead, it exposes that the boundary problem is **two distinct problems**:  
    - *(a) Epistemic*: "What reference class maximizes robust policy decisions?" (Probability excels here.)  
    - *(b) Normative*: "How can a group claim the right to rule itself and others?" (Political theory’s domain, untouched by reference classes.)  

  The pattern-matching you sensed arises because both problems involve circularity and arbitrary thresholds. But where probability accepts pragmatism (e.g., "use the least-informative prior"), democracy demands justification (e.g., "why do *we* get to decide?"). Your reaction was **insight**: you recognized a structural isomorphism in the *shape* of the problem, while the residue reveals a divergence in its *substance*.
