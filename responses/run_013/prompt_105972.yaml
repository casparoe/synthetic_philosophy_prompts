prompt: |-
  I'm a second-year PhD student working mostly on Davidson, and I'm trying to pin down, for a chapter, what any theory of radical interpretation would actually have to deliver before I start judging the existing contenders against each other. The trouble is that everyone (me included, honestly) slides back and forth between "a theory of what an interpreter does" and "a theory of what meaning is," and I want the requirements list laid out cleanly first so I stop talking past my advisor. So: give me the desiderata. What must a theory of radical interpretation be able to do to count as adequate — the cases it has to get right, the distinctions it can't collapse, the constraints on what evidence an interpreter is allowed to work from, whatever else you think belongs on the list — with the case or consideration behind each requirement. A few cases I keep bumping into and would like the list to be answerable to: a speaker who is a fluent, competent user of the language but systematically wrong about a huge swathe of their environment; a speaker who is lying or joking most of the time rather than asserting; a community whose language doesn't seem to have any clearly truth-apt sentences at all; someone who slips and says "epitaph" when they obviously mean "epithet" and is understood anyway; and — this is the one I'm stuck on — an interpreter who has to make sense of a creature whose perceptual wiring we can't assume matches our own. I don't want a bibliography or a reading list (can't get to the library this week and anyway I want the shape of the thing, not the citations), and please don't just hand me Davidson's own package as if it were the spec. I want the spec, and then a short note at the end on which of the requirements Davidson's combination of charity, holism, and the indeterminacy of interpretation seems to meet and which it seems to make unsatisfiable — flag any pair of desiderata you suspect can't be jointly satisfied, that's the part I actually care about. Keep the weight on the criteria and their motivating cases rather than a scorecard; I'll do the scoring in class.

  Two things about how to answer, though. First, be straight about the epistemic status of what you're saying: seperate what's basically settled among people who work on this from what's genuinely contested, and don't dress up a contested reading — say about how strong charity is supposed to be, or whether indeterminacy is a claim about the world or about our theories — as if it were the consensus. If you're unsure, just say so. Second, keep it tight. End the whole thing with one line in the form \answer{...} giving just the single requirement you think does the most to rule out candidate theories, as a short phrase.
