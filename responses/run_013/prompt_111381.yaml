  4. Tipping taken as charity - explaining how following home convention can itself be a breach.
  5. Disagreement about customary rate - explaining whether convention can exist without convergence.

  The user also mentions distinguishing between "load-bearing" conventions (where non-compliance shifts costs) and "ornamental" ones, asking if this distinction is useful.

  I need to identify requirements that are non-negotiable versus preferences of camps, check for joint unsatisfiability, and name the requirement that excludes popular positions like conventions being morally inert, visitors being bound by whatever locals do, or only harm generating obligations.

  For desiderata, I think the theory must explain normativity without collapsing into moral relativism or moral absolutism. It must account for conventionality - why same act has different meanings in different contexts. It must handle symbolic breaches without material harm. It must explain obligations without making local acceptance sufficient. It must explain how intention can matter. And it must address convention existence in cases of disagreement.

  The load-bearing vs ornamental distinction might help with case 2 (road crossing) since ornamental conventions might rely more on symbolic importance, but it shouldn't be overemphasized as even ornamental conventions can create normative expectations.

  Non-negotiable requirements would be Conventionality Requirement, Normative Threshold, Symbolic Force, and Non-Relativity - these are necessary for the user's purpose. Others might be more debatable.

  The Symbolic Force requirement does the most to exclude popular positions: it challenges the view that conventions are morally inert because it shows that breaches can matter symbolically even without harm. It also opposes the view that only harm generates obligations, and it complicates the idea that visitors are bound by whatever locals do by requiring reasons beyond mere practice.

  For joint unsatisfiability: there might be tension between the Symbolic Force requirement (which demands criticism for symbolic breaches) and the Non-Relativity requirement (which demands that not all local practices create obligations). But I think a theory can satisfy both by arguing that symbolic force matters only when the convention serves legitimate functions or respects basic norms.

  I'll structure my response to clearly lay out these desiderata, explain why each is required, how they relate to the cases, and address the user's questions about the load-bearing distinction and which requirements are most critical.
answer: |-
  Here is a specification of desiderata for a theory of the normative force of everyday local conventions, tailored to your purpose of defending the criticizability of visitors who knowingly flout them. The requirements are derived from your cases and core philosophical challenges, with justification for why each is non-negotiable *for your aim*. I then assess the load-bearing/ornamental distinction, identify non-negotiables, flag tensions, and pinpoint the key excluding requirement.

  ### Core Desiderata: What the Theory Must Deliver
  1.  **Conventionality Requirement:** The theory must explain why the *same physical act* (e.g., paying only the menu price) constitutes a normatively significant *breach* in one context (City A where tip=wage) but is *permissible* or merely *stingy* in another (City B where tip=bonus). (Case 1)
      *   **Why Non-Negotiable:** Your thesis hinges on the *conventional* nature of the norm. A theory that cannot distinguish the normative significance of contextually defined acts fails its core subject matter. It must capture how conventions *create* specific obligations/interdictions out of contingent practices.

  2.  **Normative Threshold Requirement:** The theory must establish a threshold condition such that *not every* locally accepted practice generates even a pro tanto obligation for visitors (or locals) to conform. Local acceptance is necessary but insufficient for normative force. (Case 3)
      *   **Why Non-Negotiable:** To avoid collapsing into moral relativism or the "bound by whatever locals do" view, which you explicitly reject (Case 3). The theory must provide resources to criticize deeply unjust or arbitrary conventions (like the bakery custom) *as conventions*, regardless of local acceptance, without denying they *are* conventions.

  3.  **Symbolic Force Requirement:** The theory must explain how a breach can be criticizable *solely* due to its expressive/symbolic meaning (signifying disrespect, disregard for shared order) even when it causes no material harm, inconvenience, or cost-shifting. (Case 2)
      *   **Why Non-Negotiable:** Case 2 (road crossing) is central to your inquiry. Dismissing purely symbolic affronts undermines the criticizability claim for a significant class of conventions. It also risks reducing normativity *only* to harm/cost, which you also reject.

  4.  **Knowledge-Dependent Culpability Requirement:** The theory must explain why *knowingly* flouting the convention is crucial for criticizability. It must show how acting based on one's *home* convention, while aware of the *local* one, can itself constitute the breach (via misinterpreted intent or symbolic meaning). (Case 4)
      *   **Why Non-Negotiable:** Case 4 (insult via "charitable" tip) demands this. The breach arises *because* the visitor applied their home understanding *knowing* it conflicted with the local meaning, making their act expressive of disregard. Ignorance might excuse; knowledge implicates.

  5.  **Non-Material Harm Requirement:** The theory must account for obligations and potential breaches that do *not* necessarily involve shifting material costs or causing inconvenience ("load-bearing" aspects). Symbolic harm or violation of legitimate expectations must be sufficient grounds for criticizability in some cases. (Cases 2 & 4)
      *   **Why Non-Negotiable:** Directly challenges the "only harm generates obligations" view. Cases 2 (no inconvenience) and 4 (insult as harm) show criticizability can exist absent material detriment. The theory cannot make material harm *necessary* for normative force.

  6.  **Convention Existence Amidst Disagreement Requirement:** The theory must provide an account of what constitutes a "convention" that allows for its existence and normative claims *even when* there is some level of local disagreement or lack of perfect convergence on details (e.g., the exact customary rate). (Case 5)
      *   **Why Non-Negotiable:** Case 5 tests realism. If a convention requires unanimous or near-unanimous convergence on specifics, most real-world conventions dissolve. The theory must define convention robustly enough to persist through common fuzziness/disagreement while still generating normative expectations.

  7.  **Visitor-Specific Grounding Requirement:** The theory must articulate the specific grounds *for a visitor* to conform, distinct from (though possibly overlapping with) the grounds for locals. It cannot simply assume locals' reasons apply directly to outsiders. (Implied by all Cases, especially 3)
      *   **Why Non-Negotiable:** Your thesis targets *visitors*. A theory that only explains why *locals* are bound fails your purpose. It must bridge the gap, explaining why an outsider has reason to respect the local order they are temporarily participating in.

  ### Load-Bearing vs. Ornamental: Does the Distinction Work?
  *   **Usefulness:** The distinction *can* help **explain the strength or source** of the obligation in specific instances (e.g., cost-shifting in Case 1 might ground a stronger obligation than symbolic offense in Case 2). It resonates with "harm-based" intuitions.
  *   **Limitations for Your Purpose:** It **cannot carry the primary normative weight**.
      *   Case 2 & 4 show obligations/criticizability arising *without* load-bearing elements.
      *   Case 3 shows a load-bearing convention (order of service *could* cause delay) might be criticizable *primarily* for reasons *other* than the shifted cost (i.e., its discriminatory nature).
      *   Reducing normativity *only* to preventing cost-shifting fails the Non-Material Harm Requirement and Symbolic Force Requirement. The distinction is descriptive, not determinative of normative force; both types can generate criticizability under your thesis.

  ### Non-Negotiables vs. Preferences
  *   **Non-Negotiable (For Your Thesis):**
      1.  Conventionality Requirement (Core subject matter)
      2.  Normative Threshold Requirement (Avoids relativism/"bound by whatever")
      3.  Symbolic Force Requirement (Handles Case 2 & 4 essence)
      4.  Non-Material Harm Requirement (Rejects "only harm matters")
      5.  Knowledge-Dependent Culpability Requirement (Makes criticizability conditional on awareness)
      *   *Rationale:* Failure on any of these directly contradicts your core cases or the explicit rejections in your query (relativism, harm-only, blind submission). They define the *minimum* needed to defend the criticizability claim robustly.
  *   **Likely Preferences of Camps:**
      *   The *strength* of the obligation generated (e.g., absolute vs. pro tanto, easily overridden).
      *   The *primary source* of normativity (e.g., coordination efficiency, respect for community, promise-implied, fairness).
      *   The precise *definition* of convention (Lewisian coordination vs. Hartian social rule vs. Millikanian norm).
      *   The *weight* given to the load-bearing/ornamental distinction.
      *   *Rationale:* Different theories can satisfy the non-negotiables while varying significantly on these points. Your thesis about criticizability doesn't strictly depend on resolving these debates.

  ### Joint Satisfiability and Tensions
  *   **Key Tension:** Between **Normative Threshold Requirement** (not everything accepted locally binds) and **Symbolic Force Requirement** (symbolic breaches can be criticizable). How can a convention's symbolic meaning generate a criticizable breach *without* local acceptance being sufficient to ground an obligation? (This directly confronts the "morally inert" view).
  *   **Is it Unsatisfiable? No, but it's the Crucial Test.** A successful theory must resolve this tension. It likely requires:
      1.  A **non-relativist grounding** for the symbolic meaning/normative force (e.g., based on reciprocity, respect for persons, the functional need for social order) that *transcends* mere local acceptance.
      2.  A **filter:** Explaining *which* conventions generate symbolic obligations for visitors despite local acceptance being insufficient in isolation. (E.g., only those serving a legitimate coordinating function, respecting basic equality, or grounded in expectations visitors implicitly accept by participating). This filter is where Case 3 (sexist bakery) does its work – the theory must deem such a convention unable to generate genuine obligations due to violating the non-relative grounding principle, *despite* its symbolic meaning to some locals.
  *   **Other Requirements:** The other non-negotiables seem jointly satisfiable with careful formulation, primarily relying on resolving the core tension above.

  ### The Single Most Excluding Requirement
  *   **The Symbolic Force Requirement** does the most heavy lifting to exclude the popular positions you mention:
      1.  **"Morally Inert Because Merely Conventional":** Directly contradicts this. It demands that conventions *can* have genuine moral significance (criticizability) *through* their conventional, symbolic nature, not *despite* it. The breach *is* the expressive act defined by the convention.
      2.  **"Visitors Bound by Whatever Locals Happen to Do":** While seemingly aligned, the Symbolic Force Requirement, combined with the Normative Threshold, demands a *reason* why symbolic expressions matter. It cannot be *just* that locals do it; it must be that the expression violates a deeper norm (respect, reciprocity) accessible to the visitor. This excludes blind submission.
      3.  **"Only Harm to Identifiable Persons Generates Obligations":** Directly contradicts the Non-Material Harm Requirement, which is deeply intertwined with Symbolic Force. If symbolic affront is a criticizable harm, then "harm" must be expanded beyond material cost-shifting. If it's not harm but still criticizable, then harm is not necessary.
  *   **Why:** This requirement forces the theory to take the *expressive, meaning-conferring* power of conventions seriously as a *source* of normativity, independent of both material consequences and unvarnished local will. It strikes at the heart of the "merely conventional" dismissal and the "only harm matters" reductionism simultaneously, while complicating the "bound by whatever" view.

  ### Conclusion
  This specification demands a theory that walks a tightrope: explaining how contingent practices create context-specific obligations grounded in something beyond mere practice (avoiding relativism/"bound by whatever"), while recognizing that these obligations can arise from symbolic meaning alone (avoiding harm-reductionism) and apply critically to knowing visitors. **The core challenge is satisfying the Symbolic Force Requirement and the Normative Threshold Requirement simultaneously without contradiction.** Theories that ground convention in thin notions of social coordination efficiency, expectations of reciprocity among participants, or respect for local collective agency *as a form of respect for persons*, while filtering out conventions violating fundamental norms (like equality), are prime candidates. Theories relying solely on harm-avoidance, pure coordination, or unvarnished local acceptance will fail key requirements. No item in the non-negotiable list *logically* rules out your thesis; the challenge is constructing a theory that satisfies them all coherently.
