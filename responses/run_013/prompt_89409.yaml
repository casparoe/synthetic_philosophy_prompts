     However, to keep it simple, let's have both the wave and the iceberg as sufficient and occurring independently. The wave broke the ship at the same time as the iceberg collision (say within minutes). The inquest doesn't know which one happened first and which one actually caused the sinking? But both are sufficient and occurred. So the sinking is overdetermined.

     But note: the bomb (Factor 6) is preempted because the sinking happened before it could explode. So it's a different kind of factor.

     How the game proceeds:

     1. **Setup (10 minutes)**: You set the scene: the sinking of the Caledonia. You are the chair of the inquest. Divide into 7 pairs (assign randomly). Give each pair a sealed envelope with their factor card. The card has:
        - On the front: the factor description and their role (they are representing that factor, so they should argue for its importance).
        - On the back (or in a separate sealed part) the type (S1, S2, R, P, SO, etc.) and a note about what it means (but they don't look until after the vote).

     2. **Presentations (21 minutes)**: Each pair has 3 minutes to present their factor and argue why it was a critical cause of the sinking. They can use any evidence they can invent (within reason) to support their case.

     3. **Open Debate (20 minutes)**: After all presentations, open the floor for debate. Pairs can challenge each other. The chair moderates.

