  Im a novelist (historical fiction, mostly) and I moonlight running a 90-minute night seminar — about 14 adults, half history buffs half writers — and I want an in-class game that makes them feel in their gut that a historical event can have several causes each sufficient on its own, so that "which one really did it" is often just a bad question. Set it up as a mock inquest or tribunal: roles, materials, and a rule for how they argue and then vote, where each person holds one card describing a factor in the event, but they only find out after they've committed — after the vote, not before — whether their factor was sufficient by itself, a mere probability-raiser, or a remover of something that was blocking the event, and one of them should turn out to be made irrelevant by another factor (a screener-off, if you know the term). I want them to hit the wall themselves: the vote can't be settled and they should feel the specific itch of that, no lecture up front. Then a debrief mapping what just happened onto overdetermination, preemption, and double prevention, and an honest note on which slice of the metaphysics the game simply can't reproduce and that I'll have to just say out loud myself. Also tell me what predictably goes sideways the first time I run it and how to rescue it without killing the mood.
