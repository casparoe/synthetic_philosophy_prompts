     Factor 6: Bomb Planted by a Saboteur
     Description: A disgruntled crew member had planted a bomb in the engine room set to explode at 2:00 PM. The explosion would have destroyed the engine and caused uncontrollable flooding.
     Your Task: Argue that this bomb was the primary cause of the sinking.
     ```

     Back:

     ```
     Type: Screened Off (Preempted)
     Explanation: This bomb would have been sufficient to sink the ship, but it never exploded because the ship sank at 1:55 PM due to the iceberg. Therefore, it did not contribute to the sinking.
     ```

     Factor 3 (R):

     ```
     Factor 3: Northern Route
     Description: The captain chose a more northern route to save time, which took the ship into an area known for icebergs and severe storms. The usual route would have been farther south, in the Gulf Stream.
     Your Task: Argue that this decision was the primary cause of the sinking.
     ```

     Back:

     ```
     Type: Double Prevention (Removing a Blocker)
     Explanation: The Gulf Stream (in the southern route) would have melted icebergs and provided calmer seas. By taking the northern route, the captain removed this protection, making the ship vulnerable to icebergs and storms.
     ```

     Factor 1 (S1):

     ```
     Factor 1: Massive Wave
     Description: A rogue wave, estimated at 20 meters, struck the ship at 1:53 PM, breaking the hull in two. This occurred during a severe storm.
     Your Task: Argue that this wave was the primary cause of the sinking.
     ```

     Back:

     ```
     Type: Sufficient Cause (S1)
     Explanation: The wave was of such force that it would have broken the ship regardless of any other factors. Even without the iceberg, the ship would have sunk.
     ```

     Factor 4 (P):

     ```
     Factor 4: Overloaded Ship
     Description: The Caledonia was carrying 20% more cargo than recommended, making it sit lower in the water and less stable.
     Your Task: Argue that overloading was the primary cause of the sinking.
     ```

     Back:

     ```
     Type: Probability-Raiser
     Explanation: This factor increased the likelihood of the ship sinking in rough seas or after a collision, but by itself (in calm seas with no collision) it would not have caused the sinking.
     ```

     Similarly for Factor 5 (inexperienced crew) and Factor 7 (high speed).

     Debriefing Points:

     - Overdetermination: The sinking had two sufficient causes (wave and iceberg). Either one alone would have been enough. So asking "which one really did it" is misleading because both would have and both did occur.
     - Preemption: The bomb was preempted by the iceberg. It was a potential cause that didn't get to act.
     - Double prevention: The northern route removed a preventative factor (the Gulf Stream protection).
     - Probability-raisers: These factors made the event more likely but were not sufficient.

     Limitations:

     - We cannot test counterfactuals (what if the iceberg hadn't occurred? then the bomb would have exploded and sunk the ship, or the wave would have broken it). But in the game, we just assign types.
     - The timing and interactions are fixed in the scenario. In real history, we often don't know all the factors and their sufficiency.
     - The scenario is simplified and fictional.

     What might go sideways:

     - Participants might challenge the scenario: "But in reality, a ship wouldn't have both an iceberg and a bomb and a wave!" - Remind them it's a fictional scenario designed to illustrate multiple causes.
     - The vote might not reflect the intended lesson: if one factor wins overwhelmingly, then in the reveal, point out that there are other sufficient causes that also occurred, so the event was going to happen anyway.
     - Some pairs might have a hard time arguing for their factor (especially the screened off one). Encourage creativity.

     How to rescue without killing mood:

     - If a pair is struggling, the chair can help by asking leading questions during the debate: "Could you explain how your factor might have been critical?"
     - If the debate gets stuck, move on. The reveal will clarify.

     Time breakdown:

     - Setup: 10 min
     - Presentations: 21 min (7 pairs * 3 min)
     - Debate: 20 min
     - Vote and Tally: 10 min (voting 5 min, tallying 5 min) [adjust: voting can be quick]
     - Reveal types: 5 min (each pair reads their type)
     - Debrief: 15 min

     Total: 81 min, leaving 9 min buffer.

     This should work. Let me know if you need adjustments.
answer: |-
  ### **Historical Causation Game: "The Caledonia Inquest"**
  **Objective:** Make participants experience the frustration of pinpointing a single cause in an overdetermined historical event. They’ll confront sufficiency, preemption, and double prevention through roleplay, then debrief the metaphysics.

  ---

  #### **Game Setup**  
  **Event:** The sinking of the fictional steamship *Caledonia* (1890) during a transatlantic voyage.  
  **Premise:** The *Caledonia* sank an hour after an iceberg collision, but multiple factors were at play. Participants are "witnesses" at a maritime inquest, each holding a hidden causal factor.  

  **Materials:**  
  - **7 Factor Cards** (for 14 players; pair participants to share cards, but each votes individually).  
  - **1 Event Summary Handout** (see below).  
  - **Voting Tokens** (3 per player: gold = 3 pts, silver = 2 pts, bronze = 1 pt for ranking causes).  
  - **Hidden Role Envelopes** (each card’s cause type is sealed and revealed AFTER voting).  

  ---

  #### **Factor Cards (Front Text)**  
  *(Sealed section on back reveals cause type)*  
  1. **Iceberg Collision**  
     *"The ship struck a massive iceberg, tearing a 10-foot hole in the hull."*  
  2. **Rogue Wave**  
     *"A 50-foot wave shattered the deck, flooding engine rooms."*  
  3. **Captain’s Gambit**  
     *"The captain took a northern shortcut, ignoring storm warnings."*  
  4. **Rusted Hull Plates**  
     *"The hull’s steel plates were weakened by corrosion (hidden from inspectors)."*  
  5. **Overloaded Cargo**  
     *"200 tons of excess machinery shifted during the storm, destabilizing the ship."*  
  6. **Saboteur’s Bomb**  
     *"An anarchist planted a bomb set to explode at the time of sinking."*  
  7. **Lifeline Failure**  
     *"Critical bilge pumps failed due to poor maintenance."*  

  ---

  #### **Cause Types (Sealed on Back of Cards)**  
  - **Sufficient (S):** Would sink the ship alone.  
    *(Cards 1 & 2: Iceberg + Wave)*  
  - **Probability-Raiser (P):** Made sinking more likely but insufficient alone.  
    *(Cards 4, 5, 7: Rust, Overload, Pumps)*  
  - **Double Prevention (R):** Removed a barrier to disaster.  
    *(Card 3: Captain’s Gambit → removed safe route)*  
  - **Screened Off (SO):** Preempted by another cause (irrelevant).  
    *(Card 6: Bomb → sank before explosion)*  

  ---

  #### **Rules & Flow**  
  **1. Introduction (5 min)**  
  - You (as Inquest Chair): *“The Board of Trade demands we determine why the* Caledonia *sank. You are witnesses—defend your assigned factor. Vote for the ‘true cause’ after deliberation.”*  
  - Distribute cards and event summary.  

  **2. Arguing Phase (30 min)**  
  - **Pair Work (10 min):** Pairs strategize arguments using their card’s description.  
  - **Tribunal (20 min):** Each pair presents for 2 mins. Others interrupt with questions (e.g., *“Could the ship have survived without your factor?”*).  
  - **Chair’s Role:** Push them to clash. Ask: *“If we removed X, would the sinking still occur?”*  

  **3. Voting (10 min)**  
  - Players rank their top 3 causes using tokens (gold/silver/bronze).  
  - Tally points openly. **Do not reveal cause types yet!**  

  **4. The Reveal (5 min)**  
  - Pairs unseal their card’s back to discover their cause type.  
  - Announce: *“The sinking had TWO sufficient causes (Iceberg + Wave). The bomb was screened off. The captain’s decision removed a barrier. Others just raised risks.”*  

  ---

  #### **Debrief (30 min)**  
  **1. Metaphysics Mapping:**  
  - **Overdetermination:** Two+ sufficient causes (Iceberg + Wave). Asking "which *really* did it" ignores that either alone sufficed.  
  - **Preemption:** The bomb (SO) was preempted by the iceberg—it became irrelevant.  
  - **Double Prevention:** The captain (R) didn’t cause the storm; he removed safety (like removing a levee before a flood).  
  - **Probability-Raisers:** Rust/overload/pumps (P) raised odds but weren’t decisive.  

  **2. Limitations (Honest Note):**  
  > *“The game simplifies time. In reality, causes can be dynamic chains (e.g., rust enabling the iceberg’s damage). We also can’t test counterfactuals (e.g., ‘What if the wave hit first?’). That’s why historians debate forever!”*  

  **3. Discussion Prompts:**  
  - *“How did it feel to realize your ‘critical’ factor was screened off or just probabilistic?”*  
  - *“Why do we crave a single cause when history is a web?”*  

  ---

  #### **Rescuing Predictable Snafus**  
  - **Symptom:** Players fixate on "their" factor, ignoring others.  
    **Fix:** Intervene as Chair: *“Witness 4, how does Witness 1’s iceberg challenge your rust theory?”*  

  - **Symptom:** Voting becomes unanimous (e.g., everyone blames the iceberg).  
    **Fix:** In the reveal, stress: *“But the wave alone sank it too! What does this say about the vote?”*  

  - **Symptom:** Arguments turn chaotic.  
    **Fix:** Use a speaking token (e.g., a gavel). Award "best provocateur" to lighten the mood.  

  - **Symptom:** History buffs nitpick the fictional event.  
    **Fix:** *“This is a thought experiment—imagine it’s 1890 and we’re the actual inquiry board!”*  

  ---

  #### **Event Summary Handout**  
  > **Sinking of the SS *Caledonia* (April 15, 1890)**  
  > - The luxury liner *Caledonia* sank en route to New York. Lifeboats saved 40%; 160 died.  
  > - **Timeline:**  
  >   - 1:00 PM: Iceberg collision (Card 1).  
  >   - 1:30 PM: Rogue wave hits (Card 2).  
  >   - 1:58 PM: Ship vanishes from radar.  
  > - Bomb found intact in wreckage (Card 6). Captain’s logs confirm northern route (Card 3).  

  ---

  This game forces players into the historian’s labyrinth: causes are layered, sufficient, and sometimes thwarted. The reveal delivers the gut-punch that "which one did it?" is often unanswerable—and the debrief turns frustration into insight.
