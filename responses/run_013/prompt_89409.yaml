          - Map to concepts: overdetermination (multiple sufficient causes), preemption (the bomb was preempted), double prevention (removing a blocker), and the probabilistic causes.
          - Note: the game cannot capture the full complexity of counterfactuals and the metaphysics of causation. For example, we cannot rerun history without one factor to see what would happen. Also, the game simplifies the timing and interactions. We have to rely on the scenario design.

     What can go wrong:

     - Participants might not argue strongly for their factor. Encourage them to be advocates.
     - The vote might be lopsided. That's okay, because the reveal will show that even the low-scoring ones might be sufficient.
     - Time management: keep strict time on presentations and debate.
     - The pairs might not work well together: assign pairs randomly and quickly.
     - The scenario might be confusing: provide a clear written summary of the event and the factors (without the types) at the start.

     Materials:

     - 7 envelopes, each containing a factor card (with the factor description and then the type hidden).
     - A summary sheet of the event for everyone.

     Example factor card (Front):

     ```
     Factor 2: Iceberg Collision
     Description: The Caledonia struck a large iceberg at 1:50 PM, tearing a 30-meter gash in the hull. Water poured in at a rate that overwhelmed the pumps.
