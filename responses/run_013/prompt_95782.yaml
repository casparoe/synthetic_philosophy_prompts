prompt: |-
  Last night I got into a proper four-hour argument with my flatmate about whether we should just replace the House of Commons with a citizens' assembly picked by lot, and we kept talking past each other. Her line is that sortition is obviously more democratic because the body actually looks like the country. Mine is that the "looks like the country" bit is doing none of the real work and what matters is that everyone had an equal chance of being picked. We couldn't work out whether we were disagreeing about politics or just about what the word "representation" means, and eventually we just went to bed annoyed with each other.

  I want to turn this into a one-page research proposal for a small political-theory workshop. I've got about four months and no budget. Here's my half-formed idea, see what you can do with it: I think the literature on sortition runs two justifications together that should be kept apart. On one view, selecting by lot is legitimate because it's a sample — it mirrors the population, so the body's decisions can be read as the population's decisions. On the other, it's legitimate because it's a fair lottery — everyone had an equal probability, so no one was excluded or advantaged, and it doesn't matter in the slightest whether the resulting body resembles the population. These two justifications, I think, pull in different directions on basically every design question: how big the body should be, whether you stratify or quota it, whether you can swap in alternates, whether a tiny body is a defect or is actually fine. And they definately give different answers to the objection that lottocracy has no re-election mechanism to discipline it.

  What I want from you: write the proposal. State the question precisely enough that it has a determinate answer — I don't want "explore the tensions between two views", I want something like "do the two justifications for sortition entail incompatible design prescriptions, and if so which one should give way, or can one be reduced to the other?". Say why the existing treatments leave it open rather than just assuming they do. Give me a method I could actually execute in four months without fieldwork — this is conceptual work, so tell me what the actual steps are: which cases or counterexamples I'd lean on, and what an argument that one justification collapses into the other would even look like. Tell me what a result looks like and what would count as the project failing, and be honest about whether four months is realistic or whether I'm kidding myself. Don't bother with citations or a lit review, I'll add those myself — just talk about positions and arguments.

  Oh and write it in British English, I'm submitting it to a UK department. Thanks.
