prompt: |-
  Hey — I'm a third-year phil student and I'm in a seminar on moral psychology and culture. We spent most of the term on the WEIRD critique and all the cross-cultural variation studies (harm norms, purity, the side-effect effect turning up in some populations and not others, all of it), and now I have to write a 20-page term paper where I get to pick the question. My prof is explicit that she wants an argument for why one question in this area deserves the pages, not a survey.

  So: within the cross-cultural folk-morality literature and what it's supposed to mean for moral objectivity, which open questions actually matter most, and in what order?

  Some of the things I keep bumping into and cant tell how they relate:

  - Is folk morality even one thing, or is it a bundle of dissociable capacities (harm, fairness, purity, authority, whatever), so that variation in one tells you nothing about objectivity in another?
  - Is the variation in people's moral judgments, or only in their justifications after the fact, or in what actually moves them to act?
  - Maybe the variation is entirely in the input rather than the output — everyone thinks harm is wrong, they just disagree about what counts as harm — in which case the relativist inference collapses without any of the psychology mattering.
  - Or maybe the load-bearing question isn't what folk morality says but what it's for (coordination, commitment, signaling), and objectivity questions are downstream of that.

  What I want is a dependency map, not a list. Which of these is upstream, in the sense that answering it one way makes half the others dissolve or rephrase themselves? Which are tractible for a philosophy student with one semester and no lab — I can read and argue, I can't run a study? Which look important but are dead ends because the answer wouldn't change anything downstream? And tell me what would move your ranking — if some new finding came in, which of these would flip?

  I'm also worried I'm missing the actual load-bearing question, so if there's something here that's underated, say so and argue for it over the obvious candidates.
