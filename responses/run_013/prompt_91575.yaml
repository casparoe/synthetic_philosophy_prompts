answer: |-
  Here’s a distilled list of **desiderata for a theory of hedonic unity**, grounded in the problematic cases and conceptual constraints you’ve encountered. I’ve categorized them as **Non-Negotiable** (NN), **Negotiable but Contentious** (NC), or **Camp-Specific Commitment** (CSC), and flagged key tensions.

  ---

  ### **Core Desiderata & Constraints**  
  *(What any theory MUST account for or avoid)*  

  1. **Heterogeneity Manifestation (NN)**  
     - **Case:** Pleasures differ wildly: solving a proof (intellectual), a sneeze (sensory), relief from pain (negative), schadenfreude (social-emotional).  
     - **Requirement:** Must explain how these diverse states are all "pleasures" without reducing them to a single *type* of sensation or judgment. Cannot dismiss clear cases as "not real pleasure."  

  2. **Dissociation from Desire (NN)**  
     - **Cases:**  
       - The sad song played repeatedly despite causing distress.  
       - Wanting a cigarette without enjoying it (addiction).  
       - Enjoying an experience but wishing it would stop (e.g., overstimulation).  
     - **Requirement:** Must allow for:  
       - Pleasure without concurrent desire (e.g., unwanted but pleasant sensations).  
       - Desire without pleasure (e.g., cravings).  

  3. **Non-Verbalizability (NN)**  
     - **Cases:** Animal/infant pleasure, pre-reflective states (e.g., the relief of pain ending before you name it), dreams recalled as pleasant.  
     - **Requirement:** Pleasure cannot depend on linguistic reports or sophisticated self-reflection. Must accommodate non-human animals.  

  4. **Introspective Fallibility (NN)**  
     - **Cases:**  
       - Mistakenly believing you enjoyed an event (e.g., peer pressure laughter).  
       - "Enjoying" a routine only in retrospect.  
       - Sincerely reporting pleasure in something you’d never choose again.  
     - **Requirement:** Must allow for errors in self-attribution of pleasure. Pleasure cannot be *defined* by sincere reports.  

  5. **Separation from Moral Goodness (NN)**  
     - **Cases:** Schadenfreude (if pleasurable), guilty pleasures, enjoying pain (masochism).  
     - **Requirement:** Pleasure must be distinguishable from moral or all-things-considered goodness.  

  ---

  ### **Problem Case Handling**  
  *(What a theory MUST explain or accommodate)*  

  6. **The Pain-Pleasure Boundary (NC)**  
     - **Cases:**  
       - Sour candy that’s "almost painful" but pleasurable.  
       - Relief when pain stops (is pleasure just the absence of pain?).  
       - "Hurts so good" (e.g., deep massage, masochism).  
     - **Requirement:** Must clarify the relationship between pain and pleasure without collapsing them.  

  7. **Negative Affective Content (NC)**  
     - **Cases:** Sad song enjoyed *because* it feels melancholic, schadenfreude.  
     - **Requirement:** Must explain how a state with negative affective content can be pleasurable *overall*.  

  8. **Temporally Extended/Displaced Pleasure (NC)**  
     - **Cases:**  
       - Anticipation (pleasure before the event).  
       - Remembering a dream as pleasant without recalling details.  
       - Enjoying something only in retrospect.  
     - **Requirement:** Must account for pleasure not co-occurring with the pleasurable stimulus.  

  9. **Low-Arousal & Habitual Pleasure (NC)**  
     - **Cases:** Boring but reliable routine, "comfort food."  
     - **Requirement:** Must explain pleasure without intensity, novelty, or conscious focus.  

  10. **Socially Mediated Pleasure (NC)**  
      - **Cases:** Laughing at a joke you don’t understand because others are laughing.  
      - **Requirement:** Must accommodate pleasure derived from social context, not intrinsic properties of the stimulus.  

  ---

  ### **Camp-Specific Commitments**  
  *(Where theories diverge; no consensus)*  

  11. **Sensationalism (CSC)**  
      - **Commitment:** Pleasure is a distinctive, introspectively accessible *feeling* (e.g., the "tingle" of a scratch).  
      - **Problem Cases:** Intellectual pleasures (solving a proof), schadenfreude – where no clear sensation is reported.  

  12. **Introspective Transparency (CSC)**  
      - **Commitment:** If you’re pleased, you can know it directly and infallibly.  
      - **Counter-Cases:** Introspective fallibility (e.g., misattributed pleasure), animals/infants.  

  13. **Unity of Natural Kind (CSC)**  
      - **Commitment:** All pleasures share a single neurobiological or phenomenological signature.  
      - **Counter-Cases:** Heterogeneity Manifestation (e.g., sneeze vs. proof).  

  14. **Degree Scalability (CSC)**  
      - **Commitment:** Pleasures must be comparable in intensity (e.g., "this is twice as nice as that").  
      - **Counter-Cases:** Routine comfort vs. ecstasy – are they on the same scale?  

  ---

  ### **Key Tensions & Joint Conflicts**  
  | **Desiderata Pair**                  | **Conflict**                                                                 | **Which Cases Expose It?**                          |  
  |--------------------------------------|-----------------------------------------------------------------------------|---------------------------------------------------|  
  | **Heterogeneity** vs. **Sensationalism** | If pleasures are wildly diverse, they can’t share a single felt quality.      | Proof-solving vs. sneeze; schadenfreude.          |  
  | **Dissociation from Desire** vs. **Desire Theories** | If pleasure ≠ desire, desire-based theories fail.                             | Sad song addict; unwanted but pleasant stimulus.   |  
  | **Fallibility** vs. **Introspective Transparency** | If we can be wrong about pleasure, it can’t be defined by subjective reports. | Peer-pressure laughter; post-hoc routine pleasure. |  
  | **Pain-Pleasure Boundary** vs. **Sensationalism** | If pleasure/pain aren’t opposites, sensationalism struggles.                  | Sour candy; relief; masochism.                    |  

  ---

  ### **The Upshot: Why Unity is Elusive**  
  - **The Core Conflict:** **Heterogeneity Manifestation** (1) + **Dissociation from Desire** (2) jointly undermine the two most intuitive unifying theories:  
    - *Sensationalism* fails because intellectual/social pleasures lack a "feel."  
    - *Desire-based theories* fail because desire and pleasure can come apart.  
  - **Most Damaging Desideratum:** **Heterogeneity**. If solving a proof and scratching an itch *feel nothing alike*, no single phenomenological or neurobiological signature unites them.  
  - **Likely Outcome:** No monistic theory satisfies all NN constraints *and* handles all problem cases. Pluralism (e.g., multiple "kinds" of pleasure) or deflationism (e.g., "pleasure" is a functional/dispositional term) becomes attractive.  

  ---

  ### **Summary Table of Non-Negotiable Constraints**  
  | **Desideratum**                 | **Critical Test Case(s)**                     | **Theories Must...**                              |  
  |---------------------------------|---------------------------------------------|-------------------------------------------------|  
  | **Heterogeneity Manifestation** | Proof vs. sneeze; schadenfreude             | Explain diversity without ad hoc exclusions.     |  
  | **Dissociation from Desire**    | Sad song addict; cigarette craving          | Decouple pleasure from wanting.                  |  
  | **Non-Verbalizability**         | Animal/infant pleasure; dream recollection  | Work without language or concepts.               |  
  | **Introspective Fallibility**   | Peer-pressure laughter; retrospective joy   | Allow for self-deception or misreporting.        |  
  | **Separation from Goodness**    | Schadenfreude; guilty pleasures             | Avoid equating pleasure with moral value.        |  

  This framework forces theories to confront the *hard cases* first. Any viable account must either **explain** these (e.g., by showing how the sad song fulfills a deep desire), **reclassify** them (e.g., arguing schadenfreude isn’t "true pleasure"), or **redefine pleasure** to absorb the tension (e.g., as a disjunctive natural kind). The joints won’t hold without breaking something.
