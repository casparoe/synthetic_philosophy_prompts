answer: |-
  Here’s an essay question designed to force engagement with the tension and nuances in Aquinas’s thought, followed by a model answer and marking scheme.

  ---

  ### (1) Essay Question
  **"Aquinas’s *Commentary on the Sentences* (IV, Dist. 49, Q.1, A.4) concludes that liberating one’s country by killing a tyrant can be praiseworthy. Yet in *De Regno* (I.6-7), he strongly cautions against private individuals killing even a tyrannical ruler, suggesting remedies lie elsewhere. Explain whether these texts contradict each other. If they do not, precisely *how* does Aquinas reconcile them? In your answer, address: (a) whether the key difference concerns the *type of tyrant* or the *agent* acting against tyranny; (b) the significance of his definition of sedition in the *Summa Theologiae* (II-II.42.2); and (c) whether his framework requires a *standing public authority* to legitimately depose a tyrant, and what problems arise if none exists."**

  ---

  ### (2) Model Answer (approx. 700 words)

  Aquinas’s statements on tyrannicide in the *Commentary on the Sentences* and *De Regno* present not a contradiction, but a sophisticated jurisdictional distinction grounded in the nature of authority and the common good. The apparent tension arises because the texts address fundamentally different scenarios and agents, reconciled through Aquinas’s hierarchical understanding of justice and order.

  The *Sentences* commentary addresses a tyrant who is a *usurper* – someone who seized power illegitimately and thus *never possessed rightful authority*. Killing such a figure, Aquinas argues, can be praiseworthy *if* it liberates the country and *if* the killer acts not for private gain but for the public good. Here, the tyrant has no just title; his rule is inherently an act of violence against the political community. Removing him is akin to repelling an unjust aggressor, a principle of natural law.

  *De Regno*, written for a king, shifts focus to a ruler who *initially gained power legitimately* but governs tyrannically. Here, Aquinas explicitly condemns *private individuals* presuming to kill such a ruler. His caution stems from three interconnected concerns: the risk of worse consequences (the replacement being worse, or chaos ensuing); the usurpation of rightful jurisdiction; and the violation of the due order of authority. The remedy, he insists, must lie elsewhere: with God’s judgment, or crucially, with *public authority*. This "public authority" is ambiguous but implies a corporate body (like the community that instituted the ruler, or superior authorities like the Church or Emperor) possessing a jurisdiction *above* the individual king but *below* God, capable of judging and deposing him lawfully. The restriction, therefore, is primarily *jurisdictional*, not moral per se. It’s not that killing a legitimate-but-tyrannical ruler is intrinsically evil in all cases; it’s that private individuals lack the *standing* to perform this act of judgment and execution. The *moral* evil lies in the usurpation of due process and the flouting of established order.

  This distinction between usurpers (*tyrannus absque titulo*) and legitimate-but-tyrannical rulers (*tyrannus ab exercitio*) is crucial (a). The *Sentences* deals with the former, *De Regno* primarily with the latter. The *agent* matters profoundly: private individuals might act against a usurper (who possesses no legitimacy), but only constituted public authority can act against a legitimate ruler who abuses his office.

  Aquinas’s discussion of sedition (ST II-II.42.2) reinforces this framework and prevents *De Regno* from being a simple reversal (b). He defines sedition as sinful because it opposes the *unity of law and common good*. Critically, he states that disturbing a ruler *who is himself opposed to the common good* is not inherently seditious. This means resistance to a tyrant *can* be justified in principle. However, the *means* and *agent* still matter. *De Regno*’s caution isn’t about protecting the tyrant’s *inherent right to rule* when he acts tyrannically, but about ensuring that resistance occurs through the *right channel* to preserve the order essential for justice. Private violence risks becoming merely another form of disorderly aggression, not a restoration of law.

  Regarding the requirement for a standing public authority (c), Aquinas’s framework struggles without one. *De Regno* clearly points to "public authority" as the legitimate agent for deposing a legitimate tyrant. This implies institutions or processes – the community acting collectively through established means, a council of nobles, or a superior temporal power. Where such structures are absent, weak, or themselves corrupted, Aquinas offers little clear guidance. The appeal to God’s judgment is real but practically unsatisfying. The implication is that the absence of a *lawful* mechanism for deposition creates a dangerous void. In such a scenario, Aquinas might reluctantly allow that the community itself, acting as a corporate body representing the common good (not merely private individuals), possesses an ultimate residual authority to defend itself, perhaps even by force, as a last resort – an authority latent when constituted mechanisms fail. However, he would likely view this as a perilous breakdown of order, not a preferred or normal remedy, precisely because it risks the very chaos *De Regno* warns against. The framework's strength depends on functional hierarchies of authority oriented toward the common good; its weakness is exposed when those hierarchies are absent or themselves become instruments of tyranny.

  In conclusion, Aquinas reconciles the *Sentences* and *De Regno* through a consistent principle: the common good is paramount, but the *means* of defending it must respect the order of justice and legitimate jurisdiction. The texts differ on *who* the tyrant is (usurper vs. legitimate abuser) and *who* may act (potentially private vs. only public authority), not on the core moral evil of tyranny itself or the ultimate right of the community to just governance.

  ---

  ### (3) Marking Scheme (Out of 20)

  | **Must-Hit Move**                                                                 | **Marks** | **Typical Mistake**                                              |
  | :-------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------- |
  | **1. Distinguishes Contexts:** Correctly identifies the *Sentences* focusing on a **usurper** (*tyrannus absque titulo*) and *De Regno* focusing on a **legitimate ruler turned tyrant** (*tyrannus ab exercitio*). | 4         | Treats both texts as discussing the *same* type of tyrant.       |
  | **2. Jurisdictional vs. Moral Distinction:** Clearly explains that *De Regno*'s restriction is primarily **jurisdictional** (not the *private individual's* place to act) against a legitimate tyrant, *not* an absolute **moral** prohibition against removing tyranny itself. | 4         | Asserts *De Regno* represents a total moral ban on killing any tyrant. |
  | **3. Integrates Sedition Argument (ST II-II.42.2):** Uses the sedition text to show resistance to a tyrant *opposing the common good* isn't sinful sedition, explaining why *De Regno*'s caution is about **order/means/agent**, **not a defense of the tyrant's right**. | 4         | Ignores the sedition text or fails to connect it to the *agent/means* point. |
  | **4. Analyzes Role of Public Authority:** Discusses Aquinas's emphasis on **"public authority"** (*De Regno*) as the legitimate agent for deposing a *legitimate* tyrant, and thoughtfully explores the **problem Aquinas faces when no such standing authority exists**. | 4         | Overlooks the requirement for public authority or simplistically claims individuals can always act if authority fails. |
  | **5. Synthesis & Nuance:** Provides a coherent overall reconciliation of the texts based on Aquinas's **underlying principles (common good, order, jurisdiction)**, avoids simplistic contradiction claims, and acknowledges complexity/limits (e.g., the peril of acting without authority). | 4         | Presents the texts as easily harmonized without tension, or fails to articulate Aquinas's core principles driving the distinctions. |
  | **TOTAL**                                                                         | **20**    |                                                                  |

  **Rationale:** This scheme forces engagement with the core tensions (Moves 1 & 2), requires use of the key clarifying text on sedition (Move 3), addresses the crucial community/public authority question central to the later caution (Move 4), and rewards a sophisticated, nuanced synthesis grounded in Aquinas's principles (Move 5). Each move is worth 4 marks to emphasize their equal importance in a strong answer. The typical mistakes highlight the precise misunderstandings the question aims to overcome.
