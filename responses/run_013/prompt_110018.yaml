  For the protagonist's duty: Margalit would emphasize her debt to the past (father/victims) and future (preventing distortion). Rieff might argue her duty is to present peace—unless unearthing truths threatens stability. The overlap? Both could agree her quest is deeply personal, tied to identity. 

