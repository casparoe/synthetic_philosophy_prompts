  We are going to design a question that tests the understanding of the Allais paradox and the independence axiom. The question will have multiple parts as described.

  Question:

  **Part A (The Allais Paradox and Axiom Violation)**
  Consider the following two choice situations:

  **Situation 1:**
  - Option A: $1,000,000 for sure.
  - Option B: 89% chance of $1,000,000, 10% chance of $5,000,000, 1% chance of $0.

  **Situation 2:**
  - Option C: 11% chance of $1,000,000, 89% chance of $0.
  - Option D: 10% chance of $5,000,000, 90% chance of $0.

  It is observed that many people choose A in Situation 1 and D in Situation 2.

  (i) State which axiom of expected utility theory (EUT) is violated by this pattern of choices. Explain precisely why it is violated, making explicit reference to the choices. (4 marks)

  (ii) Why is this pattern not a violation of the sure-thing principle? (Note: The sure-thing principle is sometimes considered a version of the independence axiom in state-dependent settings, but here we are in a probabilistic setting. Explain why the pattern does not violate the sure-thing principle as it is commonly understood in probabilistic choice.) (3 marks)

  (iii) Why is this pattern not a violation of transitivity or continuity? (3 marks)

  **Part B (Common Consequence vs. Common Ratio)**
  The Allais paradox above is an example of the "common consequence" effect. There is another version called the "common ratio" effect.

  (i) State the common ratio effect (without giving the numerical example, just the structure). (2 marks)

  (ii) Explain the key difference between the common consequence effect and the common ratio effect. (3 marks)

  **Part C (Formal Representation of the Independence Axiom)**
  State the independence axiom of expected utility theory in the mixture form. (3 marks)

  **Part D (Impossibility of EUT Representation)**
  Show that if an individual has the preferences described in Part A (i.e., A is preferred to B and D is preferred to C), then there is no expected utility function that represents these preferences. (5 marks)

  **Part E (Defense of EUT)**
  What could a defender of expected utility theory say about the Allais paradox without denying the empirical evidence? (One or two sentences.) (2 marks)

  ---

  Model Answer (Approximately 700-800 words):

  **Part A (i):** The observed pattern of choices (A preferred to B and D preferred to C) violates the independence axiom of expected utility theory. The independence axiom states that if a lottery A is weakly preferred to a lottery B, then for any lottery C and any probability p in [0,1], the mixture lottery pA+(1-p)C is weakly preferred to pB+(1-p)C. To see the violation, note that we can rewrite the lotteries to reveal a common consequence. Specifically, consider the following decomposition:

  - Option A: 1M with probability 1.
  - Option B: 1M with probability 0.89, 5M with probability 0.10, and 0 with probability 0.01.

  Now, consider Situation 2:

  - Option C: 1M with probability 0.11, 0 with probability 0.89.
  - Option D: 5M with probability 0.10, 0 with probability 0.90.

  Note that if we take a common lottery that yields 1M with probability 89/100 and 0 otherwise, then we can express:

  - A = 1M for sure = (1M with prob 1) = (1M with prob 0.11) + (1M with prob 0.89) but that's not a mixture. Alternatively, we can use the common consequence framework. Notice that Option A can be seen as a lottery that gives 1M in all states. Option B is a lottery that gives 1M with probability 0.89, 5M with probability 0.10, and 0 with probability 0.01. Now, if we let C be the lottery that yields 0 for sure, and consider a mixture that with probability 0.11 gives a lottery that yields 1M for sure and with probability 0.89 gives C (which is 0), then we have:

  Actually, a standard way to see the violation is to note that both situations share a common consequence in the event that the "common" part (89% in the first situation) occurs. Specifically, in Situation 1, the common consequence for the 89% event is 1M in both A and B. In Situation 2, the common consequence for the 89% event is 0 in both C and D. Therefore, by the independence axiom, the preference between A and B should be the same as the preference between C and D because they differ only in the common consequence (which is 1M in the first and 0 in the second) but that common consequence is the same in each pair. However, in the first situation, the individual prefers A (which is 1M for sure) over B (which has a small chance of nothing) because of risk aversion for the 1% chance. But in the second situation, the individual prefers D (10% chance of 5M) over C (11% chance of 1M) because the relative difference between 1M and 5M is large and the risk of 0 is already high. This reversal violates independence.

  **Part A (ii):** The sure-thing principle (as formulated by Savage) applies to state-dependent outcomes and says that if two acts yield the same outcome in a given event, then the preference between them should not depend on that common outcome. In the probabilistic setting, the independence axiom plays a similar role. However, in the above decomposition, the common consequence (the 89% event) is not the same in the two pairs: in the first pair the common consequence is 1M, and in the second pair it is 0. Therefore, the sure-thing principle does not directly apply because the two pairs are not defined over the same state space and the common outcome is different. Moreover, the sure-thing principle in the probabilistic setting would require the common part to be identical in both pairs, which it is not. Thus, the pattern does not violate the sure-thing principle because the sure-thing principle would not require consistency across these two pairs when the common outcomes are different.

  **Part A (iii):** Transitivity is about the consistency of pairwise choices in a cycle (if A>B and B>C then A>C). The Allais choices are two separate pairs and do not form a cycle. There is no direct comparison between A and C or B and D that would create a cycle. Continuity is the axiom that if A is preferred to B and B to C, then there exists a probability p such that the lottery pA+(1-p)C is indifferent to B. The Allais paradox does not involve any failure of continuity because the preferences are defined over lotteries that are not connected by such mixtures in a way that would break continuity. The violation is solely of the independence axiom.

  **Part B (i):** The common ratio effect involves two pairs of lotteries. In the first pair, there is a choice between a sure gain and a risky option that gives a larger gain with probability less than one. In the second pair, the probabilities of the gains in both options are scaled down by a common factor (the common ratio), making the sure option less attractive relative to the risky option. For example, a typical common ratio pair might be: 
  - Pair 1: (A) $3000 for sure vs (B) 80% chance of $4000, 20% chance of $0.
  - Pair 2: (C) 25% chance of $3000 vs (D) 20% chance of $4000 (and 80% chance of $0).

  **Part B (ii):** The key difference is in the structure of the common part. In the common consequence effect, the violation arises because of a change in a common outcome that is fixed in one event (like the 89% event in Allais). In the common ratio effect, the violation arises because of a proportional reduction of all positive outcomes' probabilities by a common factor, which changes the relative weight of the sure outcome versus the risky one.

  **Part C:** The independence axiom in mixture form: Let L, M, N be any lotteries, and let α be a number in [0,1]. If L is weakly preferred to M, then the mixture αL + (1-α)N is weakly preferred to αM + (1-α)N.

  **Part D:** We show by contradiction. Suppose there exists a utility function u(·) such that the expected utility of each lottery is computed and consistent with the preferences. Then:

  For A > B: 
  u(1M) > 0.89 u(1M) + 0.10 u(5M) + 0.01 u(0)

  Rearranging:
  0.11 u(1M) > 0.10 u(5M) + 0.01 u(0)   [Equation 1]

  For D > C:
  0.11 u(1M) + 0.89 u(0) < 0.10 u(5M) + 0.90 u(0)   [because D is preferred to C, so EU(D) > EU(C)]

  Rearranging:
  0.11 u(1M) < 0.10 u(5M) + 0.01 u(0)   [Equation 2]

  But Equation 1 and Equation 2 are contradictory. Therefore, no such utility function exists.

  The independence axiom is essential in the proof of the expected utility representation theorem. If we drop independence, we can have representations that are not linear in probabilities (like rank-dependent utility or prospect theory), which can accommodate such preferences.

  **Part E:** A defender of EUT might argue that the Allais paradox arises because of a misunderstanding of the probabilities or because the choices are made in a context of regret, and that when the probabilities are made clear and the choices are presented in a transparent way, the violation disappears. Alternatively, they might argue that the paradox is a result of a framing effect and that the independence axiom holds when the problem is presented appropriately.

  ---

  Marking Scheme (25 marks total):

  Must-hit points:

  1. **Part A (i):** Correct identification of the independence axiom and explanation of the violation (4 marks).
     - Common mistake: Stating that it violates risk aversion without mentioning the independence axiom, or not explaining how the common consequence is handled.

  2. **Part A (ii) and (iii):** Correct explanation of why it is not a violation of the sure-thing principle (3 marks) and transitivity/continuity (3 marks) - total 6 marks for both.
     - For (ii): Common mistake: Confusing the sure-thing principle with the independence axiom and not recognizing that the common outcomes are different in the two pairs.
     - For (iii): Common mistake: Stating that transitivity is violated because the choices are inconsistent, without realizing that transitivity requires a cycle of at least three alternatives.

  3. **Part B:** Correct statement of the common ratio effect (2 marks) and clear distinction from common consequence (3 marks) - total 5 marks.
     - Common mistake: Giving an example instead of the structure for (i), or not highlighting that common consequence changes a fixed outcome while common ratio scales all probabilities.

  4. **Part C:** Correct statement of the independence axiom in mixture form (3 marks).
     - Common mistake: Stating it only for common consequences (like the sure-thing principle) instead of the mixture form.

  5. **Part D:** Correct proof by contradiction (5 marks) and **Part E:** Reasonable defense (2 marks) - total 7 marks.
     - For the proof: Common mistake: Not deriving the two inequalities or not showing the contradiction explicitly.
     - For Part E: Common mistake: Saying that EUT defenders deny the data, or not giving a plausible defense.

  Breakdown of marks per part:

  - A(i): 4
  - A(ii): 3
  - A(iii): 3
  - B(i): 2
  - B(ii): 3
  - C: 3
  - D: 5
  - E: 2

  Total: 25

  Summary: This question tests the understanding of the Allais paradox as a violation of the independence axiom, the distinction between common consequence and common ratio effects, the formal statement of the independence axiom, and the implications for expected utility representation.
answer: |-
  ### Final Exam Question: Allais Paradox and the Independence Axiom  
  **Time:** 50 minutes  
  **Total Marks:** 25  

  ---

  #### Part A: The Allais Paradox (10 marks)  
  Consider the following two choice pairs:  
  - **Pair 1:**  
    - Option A: $1,000,000 for sure.  
    - Option B: 89% chance of $1,000,000, 10% chance of $5,000,000, 1% chance of $0.  
  - **Pair 2:**  
    - Option C: 11% chance of $1,000,000, 89% chance of $0.  
    - Option D: 10% chance of $5,000,000, 90% chance of $0.  

  Empirically, many people **strictly prefer A over B** in Pair 1 and **strictly prefer D over C** in Pair 2.  

  (i) **Which axiom of expected utility theory (EUT) does this pattern violate?** Explain precisely why it violates this axiom, using the structure of the lotteries. (4 marks)  
  (ii) **Why is this pattern *not* a violation of the sure-thing principle?** (Clarify the difference between the sure-thing principle and the axiom in (i).) (3 marks)  
  (iii) **Why is this pattern *not* a violation of transitivity or continuity?** (3 marks)  

  #### Part B: Common Consequence vs. Common Ratio (5 marks)  
  (i) **State the structure of the "common ratio effect"** (do not provide numerical probabilities, just the general form). (2 marks)  
  (ii) **Explain the key difference** between the common consequence effect (exemplified by the Allais choices above) and the common ratio effect. (3 marks)  

  #### Part C: Formal Independence Axiom (3 marks)  
  **State the independence axiom** of EUT in its mixture form (use notation for lotteries and mixtures).  

  #### Part D: Impossibility of EUT Representation (5 marks)  
  **Prove formally** that if an agent strictly prefers A to B and D to C (as in Part A), there exists *no* expected utility function (i.e., no utility function over outcomes) that represents these preferences. Conclude by identifying which step of the proof relies on the independence axiom.  

  #### Part E: Defending EUT (2 marks)  
  **Briefly suggest one argument** a defender of EUT could make to reconcile the Allais paradox with the theory, without denying the empirical data.  

  ---

  ### Model Answer  
  **Approx. 750 words**  

  #### Part A  
  **(i)** The pattern violates the **independence axiom** (or substitution axiom) of EUT. This axiom requires that if a lottery \(L\) is preferred to \(M\), then for any other lottery \(N\) and probability \(p \in [0,1]\), the mixture \(pL + (1-p)N\) is preferred to \(pM + (1-p)N\). In Pair 1, A is preferred to B. We can rewrite the lotteries to isolate a common consequence. Define:  
  - A = \(1M\) (degenerate lottery).  
  - B = \(0.89 \cdot 1M + 0.10 \cdot 5M + 0.01 \cdot 0\).  
  - Let \(N = 0\) (the zero lottery). Notice that A can be written as \(0.11 \cdot 1M + 0.89 \cdot 1M\), but a better decomposition uses mixture symmetry. Consider:  
    - A = \(0.11 \cdot 1M + 0.89 \cdot 1M\)  
    - B = \(0.11 \cdot ( \frac{0}{0.11} ) + 0.89 \cdot 1M\)? This is incorrect. Instead, reframe using a common outcome:  
    Both A and B share a 89% chance of $1M$ *in the event that a "common" outcome occurs*, but formally, rewrite Pair 2 using a common base:  
    - C = \(0.11 \cdot 1M + 0.89 \cdot 0\)  
    - D = \(0.10 \cdot 5M + 0.90 \cdot 0 = 0.11 \cdot ( \frac{10}{11} \cdot 5M + \frac{1}{11} \cdot 0 ) + 0.89 \cdot 0\)? A standard restructuring is:  
    Let \(S\) be a lottery yielding $1M$ with certainty. Then:  
    - A = \(1.0 \cdot S\)  
    - B = \(0.11 \cdot R + 0.89 \cdot S\), where \(R\) is the lottery \((10/11) \cdot 5M + (1/11) \cdot 0\).  
    Similarly, for Pair 2:  
    - C = \(0.11 \cdot S + 0.89 \cdot 0\)  
    - D = \(0.11 \cdot R + 0.89 \cdot 0\)  
    By independence, if A \(\succ\) B, then \(0.11 \cdot S + 0.89 \cdot 0 \succ 0.11 \cdot R + 0.89 \cdot 0\) (i.e., C \(\succ\) D). But empirically, D \(\succ\) C—a contradiction.  

  **(ii)** The **sure-thing principle** (Savage) applies to acts defined over *states of the world*, not probabilistic mixtures. It states that if two acts yield identical outcomes given an event \(E\), preferences should not depend on the outcomes under \(E\). Here, the choices are over lotteries (objective probabilities), not state-dependent acts. The independence axiom (for lotteries) is the probabilistic analog, but the common consequence differs: in Pair 1, the "common" 89% event yields $1M$ in both A and B, while in Pair 2, the common 89% event yields $0$ in C and D. The sure-thing principle would require identical outcomes in the same event, but the outcomes differ between pairs ($1M$ vs. $0$), so it does not directly apply. The violation is of independence, not the sure-thing principle.  

  **(iii) Transitivity** requires that if \(X \succ Y\) and \(Y \succ Z\), then \(X \succ Z\). The Allais choices involve two *separate* pairs (A vs. B and C vs. D), with no direct comparison between A/C or B/D. No cycle exists. **Continuity** requires that for lotteries \(L \succ M \succ N\), there exists \(p \in [0,1]\) such that \(pL + (1-p)N \sim M\). The Allais paradox does not involve indifference breaks or discontinuities; the violation is specific to independence.  

  #### Part B  
  **(i)** The **common ratio effect** involves two pairs:  
  - Pair 1: A safe lottery (e.g., \(p \cdot X\)) vs. a risky lottery (e.g., \(q \cdot Y\)) where \(p > q\) and \(X < Y\).  
  - Pair 2: The probabilities of the good outcomes in *both* lotteries are scaled down by a common factor \(\lambda \in (0,1)\), leading to \(\lambda p \cdot X\) vs. \(\lambda q \cdot Y\).  

  **(ii)** The **key difference**:  
  - **Common consequence**: Fixes a "common" outcome in one event (e.g., 89% of $1M$ in Pair 1 and $0$ in Pair 2), altering the *outcome* in a complementary event.  
  - **Common ratio**: Scales all probabilities of non-zero outcomes by a common factor, altering the *probabilities* proportionally.  

  #### Part C  
  The **independence axiom** (mixture form): For any lotteries \(A, B, C\) and any \(p \in [0,1]\), if \(A \succeq B\), then:  
  \[ pA + (1-p)C \succeq pB + (1-p)C. \]  

  #### Part D  
  **Proof by contradiction**: Suppose EUT holds with utility function \(u(\cdot)\). Let \(u_0 = u(0)\), \(u_1 = u(1M)\), \(u_5 = u(5M)\). From A \(\succ\) B:  
  \[ u_1 > 0.89u_1 + 0.10u_5 + 0.01u_0 \]  
  \[ \Rightarrow 0.11u_1 > 0.10u_5 + 0.01u_0 \quad \text{(Equation 1)} \]  
  From D \(\succ\) C:  
  \[ 0.10u_5 + 0.90u_0 > 0.11u_1 + 0.89u_0 \]  
  \[ \Rightarrow 0.10u_5 + 0.01u_0 > 0.11u_1 \quad \text{(Equation 2)} \]  
  Equation 1 and Equation 2 contradict each other. Thus, no such \(u\) exists.  
  **Where independence is used**: The existence of a linear EUT representation relies on independence (via the vNM theorem). Without it, preferences could violate linearity in probabilities.  

  #### Part E  
  A defender might argue that **framing effects** or **misperception of probabilities** explain the paradox (e.g., people overweight the 1% risk in B), but EUT holds under "true" probabilities.  

  ---  

  ### Marking Scheme  
  **Total: 25 marks**  
  **Must-hit points** (deduct marks if missing/incorrect):  

  1. **Part A(i) (4 marks)**: Correctly identifies independence axiom and explains violation using lottery decomposition.  
     *Typical mistake:* Vaguely states "risk aversion" without linking to independence or failing to restructure lotteries.  
  2. **Part A(ii)+(iii) (6 marks total: ii=3, iii=3)**: Correctly explains why sure-thing principle (ii) and transitivity/continuity (iii) are not violated.  
     *Typical mistake:* For (ii), conflates sure-thing principle with independence; for (iii), invokes a non-existent cycle.  
  3. **Part B (5 marks total: i=2, ii=3)**: Correctly states common ratio structure (i) and differentiates it from common consequence (ii).  
     *Typical mistake:* Describes common ratio with numbers or omits probability scaling; confuses outcome vs. probability changes.  
  4. **Part C (3 marks)**: States independence axiom precisely in mixture form.  
     *Typical mistake:* Uses "common consequence" phrasing instead of formal mixture notation.  
  5. **Part D+E (7 marks total: D=5, E=2)**: Proof shows contradiction (D); defense is plausible (E).  
     *Typical mistake:* Proof lacks inequality derivation; defense denies data or is irrelevant.  

  ---  
  Summary: This question tests the ability to identify the independence axiom violation in the Allais paradox, distinguish it from other axioms, contrast common consequence/ratio effects, formally state the axiom, and derive the EUT impossibility.
