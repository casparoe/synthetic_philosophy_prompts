  Finally, what this activity couldn't capture:

  - Real conspiracy theories often involve deep personal investment and identity. Believers are not just holding a belief; it becomes part of who they are. We can't simulate that in 75 minutes.

  - In the real world, there is an information environment (like the internet) that constantly provides new explanations to counter disconfirming evidence. In our activity, we had limited evidence.

