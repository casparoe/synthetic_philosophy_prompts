  2. In the group, you might have seen how a hypothesis can become unfalsifiable. If the group collectively decides to explain away any disconfirming evidence, then no evidence can disprove the theory. That's a problem of collective interpretation, not necessarily any one person being irrational.

  3. It's not a defect that you can't prove a conspiracy theory. We often can't prove things beyond doubt. The issue is whether the belief is responsive to evidence.

