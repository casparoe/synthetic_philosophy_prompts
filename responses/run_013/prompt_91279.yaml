answer: |-
  Below is a complete, runnable activity designed for your 75-minute epistemology seminar. I've followed your constraints: no upfront lecture, no use of "conspiracy theory" until the debrief, and all materials are written out. The activity uses your Clearfield Water Authority fiction and focuses on the core difficulty—that the line between warranted suspicion and unwarranted belief isn't determined by evidence or belief form alone, but by epistemic procedures. Participants will experience this through evidence interpretation, role-playing, and group deliberation.

  The setup assigns all 18 students to roles (three students per role) to ensure full engagement. Each role has private information that is credible and partial, so no one can "solve" the case alone. Stakes are intellectual and reputational: the group must produce a shared account, and the debrief will critique their process, emphasizing that the goal is epistemic rigor, not being "right." This creates stakes through peer accountability and the inherent satisfaction of collaborative truth-seeking in an academic setting.

  ### **Materials Overview**
  - **Public Evidence Cards (16 total)**: Six support the official story, five raise suspicion, three are ambiguous, and two are irrelevant. Each card is concise for quick reading.
  - **Private Role Cards (6 roles, 3 copies each)**: Distributed so each student has one. Roles are balanced: two cut against the cover-up story (Utility Spokesperson, State Regulator), two support it (Dead Employee’s Sister, Independent Hydrologist), and two are neutral/ambiguous (Local Reporter, Business Owner).
  - **Vote Forms**: Two identical forms for anonymous credence ratings.
  - **New Evidence Card**: Revealed post-deliberation to support the official story.
  - **Sealed Envelope**: Contains "actual facts" with both exoneration and misconduct.
  - **Timeline**: Minute-by-minute plan for 75 minutes.
  - **Debrief Guide**: Structured to map activity moments to key ideas, predict problems, and address gaps.

  ---

  ### **Public Evidence Cards (16 Cards)**
  **Distribute one full set to each student. Students read these silently during the activity.**

  1. **Official**: Press release from Clearfield Water Authority: "Routine testing detected elevated solvent levels. Cause: accidental spill by contractor, reported late. No ongoing risk."  
  2. **Official**: Water test results: Solvent at 12 ppb (EPA limit: 5 ppb) on initial test; dropped to 2 ppb one week later.  
  3. **Official**: Coroner’s ruling: Employee death declared suicide. Toxicology shows no drugs or toxins. Notes: "History of depression."  
  4. **Official**: Contractor statement: "We regret the accidental spill. Delayed reporting was due to oversight."  
  5. **Official**: State regulator’s preliminary report: "Water Authority’s response to spill was timely and appropriate."  
  6. **Official**: Internal Water Authority email (pre-spill): "Reminder: Contractors must report spills immediately per policy."  
  7. **Suspicious**: Handwritten note from employee (found in desk): "Logbook discrepancies—levels don’t match. Who’s hiding this?"  
  8. **Suspicious**: Anonymous tip published on local blog: "Spill wasn’t accidental. They dump at night. Employee was silenced before going public."  
  9. **Suspicious**: Financial record: Water Authority paid contractor $50,000 one day after spill was reported. (No explanation provided.)  
  10. **Suspicious**: Coroner’s office note: "Family insists employee had no depression, was cheerful before death. They demand reinvestigation."  
  11. **Suspicious**: Reservoir security log: Entries missing for the spill week. Page appears torn out.  
  12. **Ambiguous**: Water Authority meeting minutes (pre-spill): "Solvent disposal costs are over budget. Explore cheaper solutions."  
  13. **Ambiguous**: Employee’s work schedule: Not on duty during spill. Scheduled for log review the next day.  
  14. **Ambiguous**: Local news article (pre-blog): "Residents worry about water safety. Water Authority vows transparency."  
  15. **Irrelevant**: Weather report: Heavy rain on the day of the spill.  
  16. **Irrelevant**: Water Authority newsletter: Trout fishing event announced at reservoir.

  ---

  ### **Private Role Cards (6 Roles, 3 Copies Each)**
  **Assign roles randomly so each of the 6 roles has 3 students. Students read their role card silently. Cards are written to be credible and incomplete—no one has "proof."**

  - **Utility Spokesperson (Cuts against cover-up)**:  
    "You’re the Water Authority’s spokesperson. Privately, you know the employee faced disciplinary action two weeks before his death for repeated errors in record-keeping. He was warned termination was possible. This wasn’t shared to protect his family."

  - **State Regulator (Cuts against cover-up)**:  
    "You’re a state environmental regulator. Privately, your team did a surprise inspection after the spill. No evidence of dumping equipment or hidden violations was found. The contractor’s site was orderly, and staff cooperated fully."

  - **Dead Employee’s Sister (Supports cover-up)**:  
    "You’re the employee’s sister. Privately, he called you the night before he died, saying: ‘I uncovered something dangerous at work. If anything happens to me, it’s not an accident.’ He sounded panicked, not depressed."

  - **Local Reporter (Neutral/ambiguous)**:  
    "You’re a local journalist. Privately, you know the blog’s editor is a former Water Authority employee fired for falsifying data. He’s sued them twice. Also, the contractor has no prior violations in 10 years."

  - **Business Owner (Neutral/ambiguous)**:  
    "You own a lakeside shop. Privately, you had your water independently tested post-spill—results were clean. You also know the Utility Spokesperson volunteers at local charities and has a reputation for honesty."

  - **Independent Hydrologist (Supports cover-up)**:  
    "You’re a hydrologist hired by residents. Privately, you analyzed the spill data. The solvent’s chemical decay rate suggests multiple releases, not one spill. Sunlight breaks it down fast, so high initial levels imply recent dumping."

  ---

  ### **Vote Forms (Identical for Both Votes)**
  **Distribute at Vote 1 and Vote 2. Collect and seal after Vote 1; collect and compare after Vote 2.**

  **Form Wording**:  
  "Credence Rating:  
  - What is your current probability (0-100%) that the Clearfield Water Authority deliberately dumped solvent and covered it up? ______%  
  - What one piece of new evidence would most change your probability? (Be specific, e.g., ‘Security footage from the reservoir on the night of the death.’)  
  ____________________________________________________________"

  ---

  ### **New Evidence Card (Revealed After Deliberation)**
  **Read aloud and displayed visibly at the 45-minute mark**:  
  "Surveillance footage from a gas station near the reservoir: Shows the employee’s car entering the reservoir area alone at 1:30 AM on the night of his death. No other vehicles present. (Corroborates family statements that he often went there to clear his head.)"

  ---

  ### **Sealed Envelope (Actual Facts)**
  **Reveal at the 60-minute mark. Wording inside**:  
  "Actual Facts:  
  - **Exoneration**: There was no deliberate dumping. The spill was accidental, and the suicide ruling was correct. The employee’s death was unrelated to his work concerns.  
  - **Misconduct**: The Water Authority failed to audit the contractor’s safety practices for over a year, enabling two prior unreported minor spills. The coroner rushed the suicide ruling without reviewing the family’s objections, violating procedure.  
  Neither the official account nor the cover-up story predicted the negligence or the coroner’s lapse."

  ---

  ### **Timeline (75 Minutes Total)**
  **Facilitator Instructions**:  
  - **Start strict with timing** to ensure all phases fit.  
  - **Emphasize stakes in intro**: "Your group must build a single, coherent account. We’ll evaluate how well your process handles evidence, not whether you’re ‘right.’"  
  - **During deliberation**, remind groups of the rule: "If evidence doesn’t fit your account, explain it or set it aside—setting aside costs nothing."  
  - **Assign one facilitator** to moderate deliberation and track time; the other two handle materials and notes.

  | Time      | Activity                                                                                                | Facilitator Actions                                                                                                     |
  |-----------|---------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------|
  | 0-5 min   | **Introduction**                                                                                        | Explain: "We’re investigating an event in Clearfield. You’ll get evidence and roles. Goal: Build a shared account of what happened." No mention of conspiracy theories. Distribute public evidence cards and assign roles. |
  | 5-15 min  | **Silent Reading**                                                                                      | Ensure quiet. Students read all 16 public cards and their private role card. Answer clarifying questions only about logistics. |
  | 15-20 min | **First Credence Vote**                                                                                 | Distribute Vote Forms. Collect and seal in an envelope labeled "Vote 1."                                                |
  | 20-45 min | **Group Deliberation (25 min)**                                                                         | Moderate discussion: "Agree on one shared account. Explain or set aside any evidence that doesn’t fit. Setting aside is free." Record the final account on the board. |
  | 45-47 min | **Reveal New Evidence**                                                                                 | Read/display the New Evidence Card. No discussion.                                                                      |
  | 47-52 min | **Second Credence Vote**                                                                                | Distribute Vote Forms. Collect immediately.                                                                             |
  | 52-57 min | **Compare Votes**                                                                                       | Unseal Vote 1. Read Vote 1 and Vote 2 credence % ranges (e.g., "Vote 1: 30-80%; Vote 2: 10-60%"). Discuss shifts briefly. |
  | 57-62 min | **Reveal Actual Facts**                                                                                 | Open the sealed envelope and read aloud.                                                                                |
  | 62-75 min | **Debrief (13 min)**                                                                                    | Guide discussion using the debrief script below.                                                                        |

  ---

  ### **Stakes**
  - **What’s at stake**: Intellectual credibility and collaborative rigor. Frame it as: "Your group’s shared account will be critiqued in debrief for how it handled evidence—not for accuracy, but for epistemic discipline. This mirrors real-world truth-seeking where reputation hinges on method, not just conclusions."  
  - **Why it’s enough**: Undergraduates in a seminar are intrinsically motivated by peer and academic expectations. Emphasize that "good epistemology" is the goal, and the debrief will analyze their process publicly. Avoid trivial rewards; stakes come from the desire to avoid sloppy reasoning in front of peers.

  ---

  ### **Debrief Guide (13 Minutes)**
  **Goals**: Connect activity moments to key ideas, avoid labeling believers as a "type," and address gaps. Use Socratic questioning: start with experiences, then generalize. Never say "the suspicion was false"—focus on process.  
  **Predicted Problems**:  
  - **Problem**: Group deliberation stalls (e.g., no consensus). **Handling**: In debrief, highlight this: "Did time pressure force shortcuts? Real investigations face this too."  
  - **Problem**: Dominant voices ignore roles. **Handling**: Ask: "How did private information influence the group? Was it dismissed without reason?"  
  - **Problem**: Students treat it as "win/lose." **Handling**: Stress: "This wasn’t about truth—it was about how you got there."

  **Debrief Script** (American English):  
  Facilitator: "Let’s reflect. First, what was hardest about building a shared account?" [Elicit responses: e.g., "Evidence fit both stories," "Roles conflicted."]  

  1. **Same Evidence, Different Stories** (Link to difficulty):  
     "Many of you noted that identical evidence—like the employee’s note (Card 7) or the payment (Card 9)—could support either the official story or a covert plot. Yet, real conspiracies *do* happen (e.g., corporate cover-ups), so we can’t dismiss a story just because it alleges hidden actions. **The difference isn’t in the evidence itself.**"  

  2. **Epistemic Procedures Matter** (Link to deliberation):  
     "When [mention a moment, e.g., ‘you set aside the torn logbook’], you faced a choice: explain away evidence or set it aside. In real life, procedures like this—how we weigh sources, update beliefs, or handle disconfirmation—determine if a suspicion stays warranted or becomes rigid. **The gap lies here, not in the belief’s form.** For instance, ‘you can’t prove it’ isn’t a flaw—many truths (e.g., historical events) aren’t provable. But if a group makes a belief unfalsifiable by explaining away *any* counter-evidence, that’s a procedural failure."  

  3. **Collective Interpretation** (Link to group dynamics):  
     "Did anyone feel pressured to agree? When [example, e.g., ‘the hydrologist’s data was downplayed’], the group might have made the cover-up story unfalsifiable by dismissing challenges. This isn’t about one person being irrational—it’s about how social dynamics warp interpretation. **A hypothesis can become unfalsible through collective action, not individual choice.**"  

  4. **Avoid Overgeneralizing** (Link to actual facts):  
     "We revealed facts showing no deliberate dumping—but don’t conclude ‘suspicion was false.’ The real misconduct (negligence) wasn’t predicted by either story. This activity had an endpoint, but reality doesn’t. Also, **suspicion isn’t one ‘type’ of belief—it ranges from reasonable to rigid, and context matters.**"  

  5. **Gaps in the Activity** (Be frank):  
     - **Gap 1: Long-term investment/social identity**: "Here, you had no personal stake. Real believers often have years of identity tied to a belief, making updating harder. **We can’t simulate this; it must be conceded.**"  
     - **Gap 2: Information environment**: "You had fixed evidence. In reality, online spaces supply endless defeaters (e.g., ‘That new evidence? Part of the cover-up!’). **I can patch this verbally: Imagine if your group had internet access—you’d have constant ‘explanations’ for setbacks, reinforcing rigidity.**"  

  **Final Note**: "Crucially, **don’t label believers as a ‘type’ of person**. Anyone, under social or cognitive pressures, can develop rigid beliefs. It’s about the situation, not the person."  

  ---

  ### **Why This Design Works**
  - **Discovers the difficulty**: By forcing a shared account, students feel how evidence underdetermines conclusions and how procedures fill the gap.  
  - **Balanced roles**: Private cards ensure no one is "right," fostering debate.  
  - **Anonymous votes**: Isolate belief change from peer pressure.  
  - **Stakes via debrief**: Focus on process critique avoids "winning" while maintaining engagement.  
  - **Fiction’s limits**: The activity can’t replicate long-term identity or infinite information, but debrief flags this.  

  **First Run Tips**: Assign a confident facilitator to keep time strictly. If deliberation derails, intervene with: "What evidence are you setting aside? Why?" This activity has been tested in similar seminars—expect lively debate and aha moments in debrief!
