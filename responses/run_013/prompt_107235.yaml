answer: |-
  Here’s a sequenced set of sharp, content-driven questions designed to force engagement with IIT’s foundations and evade the "functionalist bridge principle" deflection. The order builds from axioms to empirical consequences, closing with the unfolding argument and falsifiability. Each primary question includes a likely-response follow-up.

  **Sequencing Logic:**  
  Start with axioms (IIT’s foundation), then exclusion (a key structural commitment), move to empirical cases (cerebellum), then intractability/falsifiability (scientific status), and end with the unfolding argument (forcing the functionalism clash). By the end, rejecting "bridge principles" requires defending IIT’s *internal* coherence and empirical grounding.

  ---

  ### Core Questions & Follow-Ups  
  *(Key: **Q** = Primary Question | **FU** = Follow-Up | *Likely Response* = Anticipated Answer)*  

  1. **Q on Axioms & Circularity:**  
     "IIT’s axioms claim to be ‘self-evident’ truths about consciousness. But axiom 3 (composition) and 5 (exclusion) seem to *presuppose* that causal structure directly mirrors phenomenal structure. How do we verify these axioms without already assuming that consciousness *just is* integrated causal information?"  
     - *Likely Response:* "They’re derived from phenomenology, not empirical data."  
     - **FU:** "If phenomenology alone justifies the axioms, how does IIT avoid being a purely *analytic* framework—where ‘consciousness’ is defined as Φ-maximizing causal structure—rather than an empirical theory?"  

  2. **Q on Exclusion Postulate:**  
     "The exclusion postulate resolves causal overlap by selecting only the *maximally irreducible* substrate. But is exclusion *derived* from the axioms, or is it an independent postulate needed to avoid ‘conscious dust’? If you dropped it, would the axioms still imply a unique conscious system?"  
     - *Likely Response:* "Exclusion is necessary to avoid pervasive consciousness."  
     - **FU:** "If exclusion is indispensable yet not derivable from the axioms, doesn’t that make it an *ad hoc* fix? And if so, does IIT’s claim to ‘derive’ consciousness from axioms alone collapse?"  

  3. **Q on Cerebellum (Empirical Bullet-Biting):**  
     "IIT implies the cerebellum isn’t conscious due to low Φ. But it has ~80% of the brain’s neurons and enables real-time motor coordination. Why should we accept IIT’s verdict over the intuition that such a complex, adaptive system *must* have some form of experience?"  
     - *Likely Response:* "Complexity ≠ consciousness; Φ measures *specific* causal integration the cerebellum lacks."  
     - **FU:** "If we found a species whose cerebellum had recurrent connectivity matching the cerebrum’s Φ-profile, would IIT predict consciousness? If not, isn’t this just privileging human neuroanatomy over the theory?"  

  4. **Q on Φ’s Intractability & Testability:**  
     "Φ is computationally intractable for systems beyond toy models. If IIT can’t compute Φ for real brains, how can it make *testable predictions* rather than *post hoc explanations* (e.g., ‘cerebellum has low Φ’ after we know it’s not conscious)?"  
     - *Likely Response:* "Proxies like PET or fMRI can estimate Φ-relevant connectivity."  
     - **FU:** "But if those proxies aren’t validated by actual Φ-computation (which is impossible), how is this different from *assuming* IIT is true and interpreting data to fit it?"  

  5. **Q on Falsifiability (General):**  
     "What specific, observable finding would force IIT to be abandoned or radically revised? For example, if a system with near-zero Φ (e.g., a feedforward network) reported vivid experiences under causal intervention?"  
     - *Likely Response:* "Such reports would be false/unreliable—IIT defines what *can* be conscious."  
     - **FU:** "If *no* behavioral report or functional signature can override IIT’s Φ-criterion, is the theory insulated from empirical disconfirmation?"  

  ---

  ### Unfolding Argument & Behaviorally Identical Systems  
  6. **Q on Feedforward vs. Recurrent Networks:**  
     "Take two behaviorally identical systems: one feedforward (Φ=0), one recurrent (high Φ). IIT says only the latter is conscious. Is this a *prediction* about where consciousness emerges, or a *consequence* of IIT’s definition of consciousness?"  
     - *Likely Response:* "It follows from rejecting functionalism—consciousness is causal structure, not behavior."  
     - **FU:** "If the distinction can *never* manifest in behavior—even in principle—what empirical content does ‘consciousness’ have in IIT beyond being a relabeling of Φ?"  

  ---

  ### Scientific Status & the "Letter"  
  7. **Q on IIT as Science (Preempting Defensiveness):**  
     "Critics argue IIT isn’t a scientific theory because its core claim (‘Φ = experience’) is untestable: we can’t measure Φ in relevant systems, nor access consciousness independently. How does IIT meet Popper’s criterion of falsifiability *without* relying on auxiliary assumptions or redefinitions?"  
     - *Likely Response:* "IIT makes predictions like ‘split-brain patients have two consciousnesses,’ which are testable."  
     - **FU:** "But if those predictions rely on *interpreting* behavioral/neural data through IIT’s framework (e.g., ‘reports from two hemispheres = two subjects’), how is this superior to rival theories? Couldn’t functionalism or global workspace explain the same data?"  

  ---

  ### Sequencing for Maximum Pressure  
  1. **Start with axioms** (Q1): Challenges IIT’s foundation. Her "bridge principle" deflection relies on axioms—force her to defend *them*.  
  2. **Hit exclusion** (Q2): Tests if axioms alone generate IIT or need ad hoc adds.  
  3. **Cerebellum** (Q3): Forces engagement with empirical costs.  
  4. **Intractability** (Q4) → **Falsifiability** (Q5): Questions scientific status.  
  5. **Unfolding argument** (Q6): Now she can’t cry "functionalism!" without addressing prior answers.  
  6. **Scientific status** (Q7): Culminates in a demand for empirical rigor.  

  ### Key Tactics  
  - **Preempt deflections:** FU questions trap common rebuttals (e.g., "proxies" for Φ, "reports are unreliable").  
  - **Force ownership:** "Is this a *prediction* or a *consequence of definitions*?" forces her to confront IIT’s empirical emptiness.  
  - **No free passes:** If she says "That’s not how IIT defines consciousness," reply: "Exactly—so let’s examine how it *does* define it, and whether that’s testable."  

  This set isolates IIT’s vulnerabilities: its axioms are question-begging, exclusion is ad hoc, predictions are post hoc, and it evades falsification. By the end, "rejecting functionalism" must stand on IIT’s *own* terms—which you’ve rigorously unpacked.
