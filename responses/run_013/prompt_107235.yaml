prompt: |-
  hey — i'm a 3rd year PhD student in phil of mind and i've somehow ended up running the Q&A for our dept's "author meets critics" session next month. the guest is a philosopher who's spent the last few years defending IIT against the usual objections, and she has this move i find really slippery. whenever someone brings up the unfolding argument (the point that basically any function you like can be computed by a purely feedforward net, and feedforward nets have zero integrated information, so either IIT is false or it's committed to a giant class of behaviourally identical but non-conscious systems), she just says the objection "assumes a functionalist bridge principle that IIT rejects" and moves on. i want to force her to actually unpack that instead of using it as a get-out-of-jail card.

  can you draft me like nine or ten interview questions? real questions about the content of the view, not "so what is IIT." i specifically want at least one question each on:

  - the exclusion postulate — is it actually derivable from the axioms, or is it an extra empirical bet bolted on, and what happens to the theory if you drop it?
  - the fact that Φ is basically intractable to compute for any realistic system — what does that do to the claim that IIT makes testable predictions rather than being a definition dressed up as a theory?
  - the axiomatic method itself: are the axioms really self-evident, or do they quietly smuggle in the identity "phenomenal structure = causal structure" that the whole thing then spits back out?
  - the cerebellum case — IIT says it's not conscious despite having most of the neurons; why should we trust that verdict rather than treat it as the theory biting a bullet?
  - and what would actually falsify IIT, in her view.

  for each of those, add a follow-up keyed to the answer she's most likely to give, so i'm not left flat-footed when she says the predictable thing. and if there's a natural order that builds — so that by the last question she can't keep reaching for "that begs the question" — please sequence it that way.

  also i'd like one question that puts a concrete case to her: imagine a purely feedforward network and a recurrent one that are behaviourally indistinguishable for all time (every input-output pair matches). IIT says one of them has experience and the other has none. is that a prediction of the theory or a consequence of how the theory defines its terms? and then the follow-up where i press her on whether that distinction could ever show up in behaviour, and if not, what "empirical" is supposed to mean here.

  last thing — there's been some loud pushback lately from people saying IIT isn't even a scientific theory (you probably know the letter i mean). i want one question that makes her answer that charge on the merits, without getting defensive or just appealing to the theory's track record. no need to give me readings or citations, i've read enough of the literature, i just need the questions themselves to be sharp and to actually go after the load-bearing parts of the view.
