prompt: |-
  I am preparing a paper on the badness of pain, and before I go further into the literature I want the specification fixed: set out the desiderata that any adequate theory of what pain's badness consists in must satisfy. Write the list with the case or consideration behind each requirement, and mark which requirements are non-negotiable and which are commitments of a particular camp. Adequacy here is diagnostic: I want a list that tells me in advance where a proposed account will break.

  Two stipulations, which you should treat as given and need not source. First, a patient in whom the affective and motivational machinery is fully engaged — guarding, withdrawal, autonomic arousal, an insistent demand that it stop — while she reports no felt quality at all: no ache, no throb, nothing it is like to be in the state. Second, a subject who reports a sensation that is unambiguously unpleasant and unambiguously to be avoided, and yet denies that the state is bad for her in any respect that matters; say whether your theory must treat her as confused, or whether there is a coherent reading of the report.

  The list should cover the cases the theory has to get right — pain asymbolia; pain unnoticed until attention lands on it; pain sought or welcomed; congenital insensitivity to pain, where the absence of pain is itself the harm; pain in creatures whose reports we cannot solicit — the distinctions it may not collapse, among them sensation, painfulness, and suffering, and intrinsic versus extrinsic badness; the constraints imposed by what is known about nociception and its cortical processing; and the fact that pain, of all things, is the paradigm of something bad in itself, which the theory must explain rather than merely accommodate. Then the two things I most want: any pair of requirements that cannot be jointly satisfied, since if there is such a pair, that is the result, and the single requirement that does the most to rule out otherwise attractive theories. Close with a brief pass over the main families of account and how each fares, but keep the weight on the criteria.
reasoning: |-
  Okay, the user is preparing a paper on the badness of pain and wants a set of desiderata for any theory explaining what makes pain bad. They've provided two specific stipulations: one about a patient with all the affective responses to pain but no felt quality, and another about someone who finds a sensation unpleasant but denies it's bad for them. The user wants a diagnostic list to evaluate theories in advance.

  First, I need to understand the core challenges. The user mentions cases like pain asymbolia, congenital insensitivity, unnoticed pain, and pain that's sought after. I have to cover distinctions like sensation vs. suffering, intrinsic vs. extrinsic badness, and incorporate neurobiological constraints from nociception research. The key is to set criteria that theories must satisfy, labeling which are non-negotiable and which are camp-specific.

  The two stipulations are crucial. For the first one (affective machinery engaged but no felt quality), the theory must explain why the absence of felt quality affects badness. For the second (unpleasant sensation denied as bad), the theory needs to address whether the subject is confused or coherent. That will influence how intrinsic the badness is.

  Listing the desiderata: Start with non-negotiables. Phenomenology is key—pain's badness must be tied to its felt character. But the first stipulation complicates that. Maybe the non-negotiable is that the affective component is necessary. Then, intrinsic badness: pain is bad in itself, regardless of consequences. The second stipulation tests this—if someone denies badness, is that a contradiction? 

  Other cases: Pain asymbolia involves feeling pain but not finding it unpleasant. Theories must explain how sensation and unpleasantness dissociate. Unnoticed pain requires explaining why unattended pain isn't bad until noticed. Sought-after pain, like in masochism, challenges intrinsic badness—here, badness might be extrinsic, overridden by context.

  Congenital insensitivity shows that absence of pain can be harmful, so the theory must account for pain's instrumental good. For non-human animals, the theory must ascribe badness without verbal reports, relying on behavior.

  Neurobiological constraints: Nociception vs. pain experience. Theories must align with how nociceptive processing doesn't always lead to pain, and how brain areas like the insula and ACC are involved in affect.

  Distinctions: Sensation (discriminative), painfulness (unpleasantness), suffering (broader affect). Also, intrinsic vs. extrinsic badness. A good theory mustn't collapse these.

  Now, conflicting desiderata. Intrinsic badness (non-negotiable) vs. the second stipulation (subject denies badness). If pain is intrinsically bad, denying it should be confused. But if a theory allows coherent denial, it might compromise intrinsic badness. That's a tension.

  Most constraining requirement: Probably intrinsic badness. Hedonistic theories equate pain with badness, but that can't handle cases where pain is sought. Representational theories might separate sensation from evaluation, allowing denial to be coherent, but then intrinsic badness is weakened.

  Main families of theories: Hedonistic (pain as bad by nature), representational (pain represents bodily damage), evaluativist (pain as an evaluation of sensation), imperativist (pain as command to stop). Each has issues with the desiderata. Hedonism struggles with sought pain, representationalism with intrinsic badness, etc.

  The user's deeper need: They want a framework to critically assess theories, highlighting where each fails. They might be looking for the central tension in the field to structure their paper. Identifying conflicting desiderata (like intrinsic badness vs. coherent denial) could be the key insight.
answer: |-
  Here is a comprehensive list of desiderata for any adequate theory of pain's badness, designed to be diagnostic. Requirements are marked **(NN)** for *Non-Negotiable* (widely accepted as essential for adequacy) or **(C)** for *Camp-Specific* (reflects commitments of particular philosophical/neuroscientific views). Stipulations are addressed within the relevant desiderata.

  ### Core Desiderata: Cases & Distinctions
  1.  **The Phenomenal Badness Constraint (NN):** The theory must explain why the *felt quality* of pain (the "ache," "throb," or "hurting") is central to its intrinsic badness. *Case:* Ordinary pain experience; the intuitive "paradigm of badness." *Failure:* Theories reducing badness solely to behavior or physiology cannot capture why the *feeling* matters uniquely.
  2.  **Affective/Functional Engagement without Phenomenology (Stipulation 1):** The theory must explain the status of a state possessing full pain-related affect (distress, motivation to stop, autonomic arousal, guarding) but lacking *any* distinctive felt sensory quality. *Case:* The stipulated patient. *Failure:* Theories identifying badness purely with affect/motivation must either deny this case is possible/coherent or explain why this state *is* bad despite lacking phenomenology. Theories identifying badness purely with sensation must explain why this state *isn't* bad pain.
  3.  **Unpleasantness without Judged Badness (Stipulation 2):** The theory must account for reports of an unambiguous, intrinsically unpleasant sensation that the subject simultaneously denies is "bad for them" in any normatively significant way. *Case:* The stipulated subject. *Failure:* Theories holding that unpleasantness *entails* intrinsic badness (e.g., strong hedonism) must treat the subject as conceptually confused. Theories allowing for coherent denial must explain how unpleasantness and normative badness can come apart without implausibly severing the link between pain and badness.
  4.  **Pain Asymbolia:** The theory must account for cases where the sensory-discriminative aspect of pain is present (location, intensity, quality) but the affective-motivational component (unpleasantness, desire to avoid) is absent or severely blunted. *Case:* Patients with lesions (e.g., to insula) reporting pain but not minding it. *Failure:* Theories collapsing sensation and suffering cannot explain the dissociation. Theories must distinguish *pain sensation* from *painfulness* (its unpleasant character).
  5.  **Unnoticed Pain:** The theory must explain the badness status of intense nociceptive signals that reach the brain but are not attended to or consciously noticed until attention shifts. *Case:* Soldier wounded in battle, dentist's anesthetic wearing off slowly. *Failure:* Theories requiring conscious awareness for badness must explain the harm potential of unnoticed signals. Theories attributing badness to the signal itself must explain why attention changes the normative landscape.
  6.  **Sought or Welcomed Pain:** The theory must account for pain that is actively sought, endured without complaint, or even welcomed (e.g., athletic exertion, religious penance, BDSM, "good" soreness). *Case:* Masochism, endurance sports, post-surgical pain signifying healing. *Failure:* Theories claiming pain is *always* intrinsically bad must explain this away as extrinsic motivation overriding intrinsic badness. Theories must respect the distinction between *intrinsic badness* and *extrinsic (all-things-considered) value*.
  7.  **Congenital Insensitivity to Pain (CIP):** The theory must explain the nature of the harm in CIP, where the *absence* of pain (and its badness) is itself a major source of injury and suffering. *Case:* CIP individuals suffering tissue damage, infections, joint destruction. *Failure:* Theories must acknowledge pain's crucial *instrumental good* (warning function) without collapsing instrumental value into intrinsic value or vice-versa. The harm in CIP stems from *missing* a normally bad thing.
  8.  **Non-Human Animal Pain:** The theory must allow for the attribution of pain badness to creatures incapable of verbal report or sophisticated judgment. *Case:* Mammals, birds, fish exhibiting pain behaviors. *Failure:* Theories requiring higher-order cognition (e.g., judgment that pain is bad) cannot ascribe genuine badness to animal pain. Theories must link badness to phenomenal experience or functional role accessible via behavior/neuroscience.
  9.  **The Intrinsic Badness Paradigm (NN):** The theory must explain why pain is the *paradigmatic example* of something intrinsically bad. It cannot merely stipulate it or reduce it to extrinsic factors. *Case:* Philosophical and common-sense intuition. *Failure:* Theories that make pain's badness entirely derivative (e.g., only bad because it represents damage, only bad if disliked) fail to capture its core, immediate negative valence.

  ### Conceptual & Empirical Constraints
  10. **Sensation / Painfulness / Suffering Distinction (NN):** The theory must not collapse the distinctions between:
      *   *Nociception/Sensation:* The neural processing of potentially damaging stimuli (can occur without pain).
      *   *Painfulness:* The specific, intrinsic unpleasant character of conscious pain.
      *   *Suffering:* A potentially broader, longer-lasting negative affective state often caused by, but distinct from, pain (e.g., anguish, despair). *Failure:* Conflating these leads to misdiagnosis of cases like asymbolia or unnoticed pain.
  11. **Intrinsic vs. Extrinsic Badness Distinction (NN):** The theory must clearly distinguish pain's *intrinsic* badness (bad in itself, by its nature) from its *extrinsic* badness (bad due to consequences, associations, or context). *Failure:* Cannot adequately handle cases of sought pain or explain the core intuition of intrinsic badness.
  12. **Neurobiological Plausibility Constraint (C - Strongly Expected):** The theory should be consistent with or illuminated by known neuroscience of nociception and pain processing (e.g., dissociation of sensory/discriminative vs. affective/motivational pathways, roles of S1, S2, Insula, ACC, PAG). *Case:* Pain asymbolia neurology, placebo/nocebo effects, neuroimaging correlates. *Failure:* Theories positing mechanisms or dissociations fundamentally at odds with established neurobiology face significant hurdles. (While perhaps not strictly *non-negotiable*, violating this severely undermines plausibility).

  ### Key Diagnostic Tensions & The Most Constraining Requirement
  *   **The Central Tension (Likely Irreconcilable Pair):** **Intrinsic Badness Paradigm (NN - #9)** vs. **Unpleasantness without Judged Badness (Stipulation 2 - #3)**.
      *   *Conflict:* #9 demands pain's unpleasantness *constitutes* or *entails* its intrinsic badness. #3 presents a subject reporting unpleasantness while coherently denying badness "that matters." If #3 is coherent, it threatens the direct entailment required by strong interpretations of #9. Resolving this requires either: 1) Explaining away the subject in #3 as confused (upholding #9 strongly, challenging coherence of #3), or 2) Weakening #9 so that unpleasantness is a *prima facie* but not *constitutive* ground of badness (allowing coherence for #3 but potentially diluting the "paradigm" status). Most theories struggle to satisfy both robustly.
  *   **The Most Constraining Requirement:** **The Intrinsic Badness Paradigm (NN - #9)**. This requirement does the most heavy lifting in ruling out otherwise attractive theories:
      *   *Ruled Out/Challenged:* Pure **Representationalism** (pain's badness is *only* bad because it represents tissue damage - extrinsic), **Desire-Based Views** (pain is bad only if you desire it to stop - contingent), strong **Evaluativism** (pain's badness requires a judgment of badness - rules out animals/judgment-denial). It forces theories to locate the badness *within the phenomenal character itself* or its essential functional role.

  ### Brief Survey of Main Theories & Key Failures
  *   **Simple Hedonism:** Pain is a conscious experience with intrinsic negative hedonic tone (badness).
      *   *Fails:* #3 (denies coherence), #6 (struggles with intrinsic badness of sought pain), #7 (struggles to explain harm of absence), #12 (phenomenal focus less tied to specific neurology).
  *   **Representationalism:** Pain is a representation of actual or potential tissue damage; badness lies in the (mis)represented state.
      *   *Fails:* #9 (badness extrinsic - about damage, not the pain state itself), #3 (allows coherent denial - "it signals damage but that's not bad *for me*"), #4/#1 (struggles to explain affective dissociation/asymbolia).
  *   **Evaluativism:** Pain is a sensory experience (e.g., of bodily disturbance) *plus* a negative evaluative representation (e.g., "this disturbance is bad").
      *   *Fails:* #8 (requires sophisticated evaluation?), #3 (if evaluation *is* the badness, denial is confusion), #4 (can dissociation affect just the evaluation?), #12 (neurology of evaluation).
  *   **Imperativism:** Pain is a command (e.g., "Stop this bodily state!"); badness lies in the insistent, disruptive, inescapable nature of the command.
      *   *Fails:* #1 (can commands have phenomenal character?), #2 (can commands exist without felt quality?), #9 (is a command intrinsically bad or just instrumentally disruptive?), #3 (can one receive the command but deny its normative force?).
  *   **Motivational Theory:** Pain's badness consists in its intrinsic motivational force (to avoid/escape).
      *   *Fails:* #2 (motivation without phenomenology - is it bad?), #4 (asymbolia - sensation without motivation), #6 (motivation present but overridden/welcomed - intrinsic badness?), #9 (is motivation intrinsically bad?).

  This list provides a robust diagnostic framework. Pay particular attention to how theories handle the **Central Tension (#9 vs. #3)** and the constraints imposed by **Dissociation Cases (#2, #4, #5)** and **CIP (#7)**. The **Intrinsic Badness Paradigm (#9)** remains the most significant hurdle for many otherwise plausible accounts.
