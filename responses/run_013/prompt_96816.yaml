  ### Maxwell's Demon's Ledger

  **Stanza 1**  
  A slow: to cold I swing the gate.  
  That fast one, hot side, must be stopped—no wait.  
  Quick, cold: I let it through.  
  Hot: block the quick, they cannot pass the wall.  

  **Stanza 2**  
  That fast one, hot side, must be stopped—no wait.  
  Quick, cold: I let it through.  
  Hot: block the quick, they cannot pass the wall.  
  Next slow: I guide it to the hold I know.  

  **Stanza 3**  
  Quick, cold: I let it through.  
  Hot: block the quick, they cannot pass the wall.  
  Next slow: I guide it to the hold I know.  
  Hot: bar the swift, their heat accumulates.  

  **Stanza 4**  
  Hot: block the quick, they cannot pass the wall.  
  Next slow: I guide it to the hold I know.  
  Hot: bar the swift, their heat accumulates.  
  Cold: slow again, I open to the old.  

  **Stanza 5**  
  Next slow: I guide it to the hold I know.  
  Hot: bar the swift, their heat accumulates.  
  Cold: slow again, I open to the old.  
  My mind must clear its store, and warmth be paid.  

  **Coda**  
  Hot bar the swift their heat accumulates  
  My mind must clear its store and warmth be paid  
  Cold slow again I open to the old  
  Next slow I guide it to the hold I know  

  ---

  ### Explanation  
  - **Form & Physics Alignment**:  
    - The poem's sliding register (repeating 3 lines, adding 1 new) mirrors the demon's memory. Lines drop out permanently, reflecting erasure.  
    - **Hot/cold distinction**: Hot lines are longer (8–10 syllables) and use "-ate"/"-all" rhymes; cold lines are shorter (6–7 syllables) with "-old"/"-ow" rhymes.  
    - **Increasing regularity**: Each new line (italicized) is metrically tighter than the prior line in its stanza (e.g., irregular → iambic), mirroring entropy decrease.  
    - **Coda as heat release**: The final 4 lines (last register state) are scrambled, unpunctuated, and metrically fractured, embodying the dissipation from erasure.  

  - **Key Physics**:  
    - The demon's *measurement* (sorting) costs nothing (lines grow orderly), but *erasure* (dropped lines, coda's chaos) demands heat ("warmth be paid").  
    - The final line ("My mind... paid") is the demon's "bill" for resetting its memory (Landauer's principle: erasure costs *kT* ln 2).  
    - No paradox: The second law holds, as entropy increases when the coda dissipates the erased data.  

  > *For the seminar: The poem balances the books—measurement is free, but forgetting never is.*
