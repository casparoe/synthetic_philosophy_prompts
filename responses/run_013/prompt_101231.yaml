answer: |-
  ## Exam Question: Parfit's Hitchhiker and the Limits of Rationality

  **Analyze Parfit's Hitchhiker case (the desert promise scenario). Explain its core purpose within debates about rationality and decision theory. Then, evaluate how the following variants alter the situation:**

  *   **(a) The Fare Up Front:** You have the $100 bill in your pocket. The driver suggests you simply pay him now, upfront, eliminating the need for a future promise.
  *   **(b) The Witness:** Another stranded traveler nearby witnesses your agreement. Next month, *you* are stranded again, and *this witness* is the one with a car who might offer you a ride.

  **For each variant, explain whether it dissolves the paradoxical "rational irrationality" identified in the original case. Crucially, address the role of the driver's ability (or inability) to discern your character/dispositions. Finally, take a position: Is "rational irrationality" a genuine and distinct phenomenon, or does it ultimately collapse into standard instrumental reasoning about cultivating beneficial dispositions? Defend your view using insights from the original case and the variants.**

  ---

  ## Model Answer (Approx. 700 words)

  Parfit's Hitchhiker presents a crucial puzzle for instrumental rationality – the view that rationality consists solely in taking the means to one's ends. In the original case, you are stranded and desperate. A driver offers a ride only if you *promise* to pay $100 upon arrival. Crucially, once safe in town, paying provides no benefit (no punishment, no future interaction), while keeping the money does. Instrumental rationality dictates *not* paying. However, if you are purely instrumentally rational *and the driver knows this*, he won't offer the ride, knowing you won't pay. To get the ride (your paramount end), you must convince the driver you *will* pay. But if you are purely instrumentally rational, you *won't* pay when the time comes. The solution Parfit suggests is that it might be *instrumentally rational* to cultivate an *irrational* disposition – a disposition to keep promises even when it's costly and provides no further benefit. This "rational irrationality" is the core phenomenon the case aims to establish: sometimes, achieving your goals requires you to be the *kind of person* who doesn't always act according to narrow, immediate instrumental calculation.

  **Variant (a): The Fare Up Front**
  This variant significantly alters the dynamic. Paying upfront dissolves the temporal gap and the commitment problem. The driver gets his money immediately, securing his end. You get the ride immediately, securing your end. There is no future action requiring a potentially irrational disposition; the transaction is complete. The puzzle of why you might pay *later* vanishes. However, the driver's ability to discern your character *still matters*, but differently. If the driver cannot discern your character (or trustworthiness), he might *prefer* upfront payment precisely to avoid relying on a promise he cannot trust. If he *can* discern a reliable disposition, he *might* accept the promise, but upfront payment is a safer, simpler solution for both parties, rendering the disposition largely irrelevant *for this specific interaction*. The "rational irrationality" required in the original is bypassed because the need for a binding future commitment is removed by a simultaneous exchange. The disposition isn't needed *here*.

  **Variant (b): The Witness**
  This variant introduces a reputational mechanism. The witness observing the agreement creates the potential for future consequences. If you renege on your promise, the witness might refuse you a ride next month (or spread the word, damaging your reputation more broadly). Crucially, this makes paying upon arrival *instrumentally rational*: paying $100 now secures a potential $100 ride (or avoids greater costs) in the future. The driver’s initial offer might even be *more* likely if he knows a witness exists, as it creates an external enforcement mechanism. The necessity for an *intrinsic* disposition to keep promises evaporates; extrinsic incentives (future benefits/punishments controlled by the witness) align your self-interest with promise-keeping *at the time of payment*. The driver’s ability to discern your character becomes *less critical* because the witness's observation and potential future action provide the enforcement. The "irrationality" is gone; paying becomes straightforwardly rational.

  **The Critical Role of Discernment**
  Both variants highlight a latent condition in the original: the puzzle only exists if the driver can reliably discern whether you possess the irrational-but-beneficial disposition. If he *cannot* discern it, a purely instrumentally rational hitchhiker can simply *lie*, promising to pay without any intention or disposition to do so. The driver, unable to detect the lie, gives the ride, and the hitchhiker escapes payment. The "rational irrationality" solution is unnecessary because deception works. The paradox depends on the driver being a good "disposition detector."

  **Is Rational Irrationality Genuine?**
  Yes, rational irrationality is a genuine phenomenon distinct from simple instrumental reasoning about dispositions. The variants help demonstrate this.

  Variant (a) shows a scenario where cultivating a disposition *isn't needed* – the commitment problem is solved mechanically. Variant (b) shows a scenario where cultivating a disposition *isn't irrational* – it aligns with long-term self-interest due to external enforcement. The *original* case, however, isolates a situation where neither mechanical commitment nor external enforcement exists. Achieving the goal (the ride) requires becoming someone who will perform an action (paying later) that, *at the moment of performance*, provides no benefit and has a cost. Cultivating the disposition is instrumentally rational *before* the ride. *Having* the disposition causes you to act irrationally (by narrow instrumental standards) *after* the ride. Crucially, this post-ride irrationality is the *very thing* that made the pre-ride cultivation rational. Instrumental reasoning *alone* cannot explain the rationality of the *post-ride action*; it only explains cultivating a trait that *causes* that (locally) irrational action. The disposition functions as a pre-commitment device, binding you to an action your future self wouldn't choose. Rational irrationality captures this essential conflict between the rationality of cultivating a trait and the local irrationality of the behavior it produces, a conflict not fully reducible to long-run instrumental calculation, as demonstrated by the absence of such calculation in the original payoff structure upon arrival.

  ---

  ## Marking Scheme (25 Marks Total)

  1.  **Original Case & Purpose (5 marks):**
      *   *Must-hit:* Clearly explains the commitment problem: inability to credibly commit to future action (paying) makes ride offer impossible for purely rational agents, requiring a disposition to act irrationally later.
      *   *Strong Answer:* Explicitly states the case aims to establish "rational irrationality" as a solution – cultivating an irrational disposition is instrumentally rational to solve commitment problems.
      *   *Common Mistake:* Merely retelling the story without identifying the paradox or its purpose (establishing rational irrationality).

  2.  **Analysis of Variant (a) - Fare Upfront (5 marks):**
      *   *Must-hit:* Explains that upfront payment eliminates the temporal gap and future commitment problem, dissolving the need for the specific irrational disposition *in this interaction*.
      *   *Strong Answer:* Links this to the driver's discernment – upfront payment is especially attractive/relevant if discernment is difficult, bypassing the need for trust/disposition.
      *   *Common Mistake:* Claiming the disposition is *still* needed or not connecting upfront payment to removing the *future* action puzzle.

  3.  **Analysis of Variant (b) - Witness (5 marks):**
      *   *Must-hit:* Explains that the witness introduces reputational enforcement, making paying upon arrival *instrumentally rational* (to secure future benefits/avoid costs), eliminating the *irrationality* of paying.
      *   *Strong Answer:* Explicitly contrasts this with the original – payment is now rational due to external incentives, the intrinsic disposition becomes unnecessary.
      *   *Common Mistake:* Focusing only on getting the *initial* ride without analyzing why paying *later* is now rational, or failing to see it removes the *need* for irrationality.

  4.  **Role of Discernment (5 marks):**
      *   *Must-hit:* Clearly states the original paradox *depends* on the driver being able to discern the hitchhiker's disposition/character. If discernment is impossible, deception (lying) works and the puzzle evaporates.
      *   *Strong Answer:* Integrates discernment into the analysis of the variants (e.g., upfront payment as a response to *lack* of discernment, witness reducing *reliance* on discernment).
      *   *Common Mistake:* Ignoring discernment entirely or mentioning it only superficially without explaining its necessity for the original paradox.

  5.  **Position & Defense on Rational Irrationality (5 marks):**
      *   *Must-hit:* Takes a clear stance (Yes/No) on whether rational irrationality is genuine and distinct.
      *   *Strong Answer:* Defends the stance using the variants to show where dispositions *aren't* needed (a) or *aren't* irrational (b), arguing the *original* case isolates a unique need for a disposition causing locally irrational action that's irreducibly part of the rational solution. Explicitly argues it doesn't collapse into simple instrumentalism because the post-action irrationality isn't instrumentally justified *at that moment*.
      *   *Common Mistake:* Waivers on the stance, provides only a superficial "it depends" answer, or fails to use the variants effectively in the defense. Simply restating the original case without engaging the "collapse" question.
