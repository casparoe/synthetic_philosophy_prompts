  ## Five Scenes from the Read-Back

  **SCENE ONE: THE WAITING ROOM**
  Lukas Vogel presses his damp palms against his wool trousers. The air in the Commission Annex smells of lemon polish and stale fear. Fluorescent lights buzz overhead, illuminating faded posters about civic reconciliation. His wife, Elara, sits rigidly in a plastic chair across the room, pretending to study the laminated *Guide to the Read-Back Process*. She hasn’t looked at him since they arrived. A bored clerk with a clipboard leans against the doorframe leading deeper into the building, checking her watch. Lukas counts the geometric patterns in the linoleum. Five years since the first Read-Back. Five years since he last held a gun. He touches the scar on his jaw, a souvenir from the last chaotic weeks before The Calm.

  **SCENE TWO: THE ARCHIVE ENTRY (FLASHBACK)**
  *Private Lukas Vogel, 3rd Battalion, executed Tomas Markovic, age 19, student, at checkpoint Delta-Seven on 14th Winter, Year of Division. Tomas begged for his life. He cried out "Mama!" before Vogel shot him twice in the chest as he knelt in the mud. Vogel showed no hesitation. His eyes were empty. Tomas was unarmed, carrying only textbooks.* Lukas remembers the rain that night, the jeep headlights cutting through the downpour. He remembers the boy fumbling for identification, the sudden lunge – or was it a stumble? – towards the stacked sandbags. The shouted order lost in the drumming rain. The weight of the rifle, slick in his hands. He shot. Twice. Quick, panicked. The boy didn't cry "Mama." He gasped, wetly, "Please." Or maybe it was just a cough? The eyes Lukas remembers weren't empty; they were wide with his own terror.

  **SCENE THREE: THE READING ROOM**
  The Public Chamber is small, cold, and echoes slightly. Fifteen empty wooden chairs face a single seat placed under a harsh spotlight. Lukas sits there now. Three rows back, Tomas Markovic’s mother and sister sit, faces like stone. Elara sits behind them, in the last row, staring at her hands. A Commission Officer stands at a lectern. The clerk with the clipboard leans against the back wall, ready to note any response. The Officer clears his throat. The acoustics amplify the sound into a small explosion. Lukas forces his breathing to slow. The Officer begins reading the official Archive Entry for the death of Tomas Markovic. Lukas knows every word, every cadence. He hears his own name, "executed," "begged," "cried out 'Mama!'", "no hesitation," "eyes were empty." The words land like stones. He focuses on a water stain on the far wall, shaped vaguely like a bird. He feels the phantom weight of the rifle in his lap.

  **SCENE FOUR: THE DETAIL**
  The Officer’s voice drones on. "...before Vogel shot him twice in the chest as he knelt in the mud..." Lukas’s jaw tightens. He *didn't* kneel. Tomas fell forwards, sprawling onto the wet ground. The posture of kneeling suggests submission, prayer. It makes Lukas look crueler, more deliberate. It’s a tiny detail, invisible to anyone who wasn't there. Meaningless in the face of the dead boy. But it’s *wrong*. And it feeds the image of him as a remorseless executioner. He feels the pressure building behind his eyes. He sees the Markovic women. The mother’s lips move silently with the familiar words. *Kneeling*. For her, it’s sacred. The posture of her murdered boy, helpless, pleading. To correct it… to say "He fell forward, he didn't kneel!"... would be to rip that image from her. It would also void the amnesty. Back to a cell. No more sitting with Elara in their small, quiet apartment. No more tentative peace. The silence after the Officer finishes stretches. The clerk’s pen hovers. Lukas tastes bile. The word "kneeling" echoes in the hollow room. *Kneeling*. He closes his eyes.

  **SCENE FIVE: THE DISMISSAL**
  The silence thickens. The clerk’s pen scratches briefly: *No response.* The Officer closes the binder. "This concludes the annual Read-Back for the archive entry concerning Tomas Markovic. Amnesty remains in effect." The spotlight snaps off, leaving Lukas blinking in the sudden gloom. He doesn't look at the Markovic women as they stand and file out, their footsteps sharp on the floor. Elara stands too, waiting by the door, her face unreadable. Lukas slowly pushes himself up. His legs feel numb. He passes the clerk, who’s already flipping to the next name on her list. He walks towards Elara, the phantom weight of the rifle gone, replaced by the heavier, immovable weight of the kneeling boy in the mud, a detail cemented now, forever, in the official record. She turns towards the exit. He follows. The clerk calls out, bored, "Next, please."
