prompt: |-
  Before I read any more accounts of promissory obligation, I want the specification of what such an account has to deliver. Write the desiderata that any adequate theory of why promises bind must meet: the cases it must get right, the puzzles it must dissolve, the distinctions it must respect, and the constraints it inherits from the nature of convention, communication, and personal identity. For each requirement, give the case or consideration behind it and mark whether it is non-negotiable or merely a commitment of one camp; where you suspect that a pair of requirements cannot be jointly satisfied, say which pair and what that would show. Keep the weight on the criteria rather than on scoring the familiar contenders, though if a single requirement does most of the excluding work, name it.

  Make the list answer to these cases in particular, since they are the ones I cannot get to fit any single account:

  - a promise whose words the promiser does not understand, having only repeated them;
  - a promise the promisee has explicitly released the promiser from;
  - a promise made to someone who has since died, where performance remains possible;
  - a promise to do something independently wrongful;
  - a resolution made only to oneself;
  - a promise made inside a game or role-play, where no one expects performance;
  - a promise whose intended recipient never learns of it.

  Then say briefly which of the standard grounds for promissory obligation—the promisee's reliance, the promiser's exercise of will, a social convention, or the value of the relationship itself—survives the whole list, and which requirement eliminates the most rivals.
reasoning: |-
  Okay, the user is asking for a set of criteria that any good theory of promissory obligation must meet. They provided several tricky cases that they can't fit into existing theories. Let me start by understanding each of these cases and what they imply for a theory of promises.

  First, the promise where the promisor doesn't understand the words. This tests whether intention or convention is essential. If someone repeats words without understanding, does the promise still bind? A theory needs to explain the role of intentionality versus convention.

  Next, a promise released by the promisee. This seems straightforward—once released, the obligation should dissolve. But why? Does the promisee's control over the obligation mean their consent is crucial? Or is there a deeper reason related to the relational aspect of promises?

  Then, a promise to a deceased person where performance is still possible. If the recipient is gone, does the obligation remain? This challenges whether the promisee's existence is necessary for the obligation. Some might feel a moral duty persists, but how does a theory account for that without the promisee's presence?

  Promising to do something wrongful is another key case. If the action is immoral, can the promise create an obligation? Most would say no, but why? The theory must explain how moral constraints override promissory obligations.

  A resolution to oneself—is this a promise? Self-promises blur the line between personal commitments and interpersonal promises. A theory must distinguish between these or explain why self-promises aren't binding in the same way.

  Promises within games or role-play where no one expects performance. This tests the context's role. If the social setting suspends real-world obligations, how does the theory account for contextual conventions?

  Finally, a promise unknown to the recipient. If the intended recipient never learns of it, does it bind? This examines whether communication is necessary for obligation. Is the act of promising internal or does it require mutual recognition?

  Now, the user also wants desiderata based on these cases. Each case points to a requirement. For example, the unintentional promise case requires distinguishing deliberate commitments. The released promise needs the promisee's consent to dissolve obligations. The deceased promisee case might still impose a duty, suggesting obligations can outlive the promisee. Wrongful promises must respect moral overrides. Self-promises might need exclusion or a different treatment. Game promises require contextual validity, and unknown promises might need communication to the recipient.

  I need to list these requirements clearly, noting which are non-negotiable and which might be contested. For example, moral overrides are probably non-negotiable, while the necessity of the promisee's continued existence might be debated. Also, identifying conflicts between requirements is key. For instance, if a theory requires both the promisee's existence and the possibility of obligations persisting after death, that might be a tension. Similarly, emphasizing intention might clash with conventional aspects in game promises.

  The user also wants to know which standard grounds (reliance, will, convention, relationship value) survive the list. Reliance might fail with unknown promises since there's no reliance. Will theories might struggle with unintentional promises. Convention could handle game contexts but might not explain self-promises. Relationship value might handle release and death but not wrongful promises. The requirement eliminating the most rivals might be the moral constraint, as it clearly overrides other considerations.

  I should structure the desiderata based on each case, explain the requirement, its necessity, and any conflicts. Then summarize which grounds survive and which requirement is the toughest. Making sure to address each user-provided case explicitly and tie them to the criteria. Also, highlighting where theories might conflict, like between intentionality and convention in games, or persistence after death versus the promisee's role. That should cover their needs comprehensively.
answer: |-
  Here is a specification of desiderata for an adequate theory of promissory obligation, derived from the nature of the phenomenon and your recalcitrant cases. Each requirement is linked to the case or consideration motivating it, with necessity marked and conflicts noted.

  ### Core Desiderata
  1.  **Intentionality Constraint:** The theory must require a minimal intentional act by the promisor – intending to undertake an obligation or to communicate commitment.  
      *Case:* Promise with repeated, uncomprehended words.  
      *Necessity:* **Non-negotiable.** Mere sound emission without intention isn't promising.  
      *Conflict Potential:* With strict Conventionalism (see #6).

  2.  **Consent-Sensitivity:** The obligation must be defeasible by the promisee's release.  
      *Case:* Promise explicitly released by the promisee.  
      *Necessity:* **Non-negotiable.** The core bilateral nature of promises requires the promisee's power to waive the claim.  
      *Conflict Potential:* With strong versions of Self-Binding (#5) or Post-Mortem Obligation (#3).

  3.  **Agency-Contingency:** The obligation requires the existence of a promisee *capable of holding a claim* at the time of performance.  
      *Case:* Promise to a deceased person (performance possible).  
      *Necessity:* **Negotiable (Majority Commitment).** Most theories hold obligations cease with the promisee's death/dissolution, though some (e.g., will-based) argue for a residual duty.  
      *Conflict Potential:* With theories emphasizing the promisor's act alone (#5, #7) or strong duties of fidelity (#8).

  4.  **Moral Constraint:** A promise cannot generate an obligation to perform an independently wrongful act.  
      *Case:* Promise to do something independently wrongful.  
      *Necessity:* **Non-negotiable.** Morality trumps promissory obligation; a promise cannot morally require immorality.  
      *Conflict Potential:* With extreme Conventionalism or Voluntarism that sees promise alone as binding.

  5.  **Interpersonal Requirement:** The paradigmatic binding promise requires two distinct agents (promisor and promisee).  
      *Case:* Resolution made only to oneself.  
      *Necessity:* **Negotiable (Majority Commitment).** Self-resolutions are distinct; theories may explain them differently (e.g., as intentions/vows) without equating them to promises. Some (e.g., strong will-theories) might contest this.  
      *Conflict Potential:* With theories grounding obligation purely in the promisor's will (#1).

  6.  **Contextual Validity:** The obligation depends on the normative context in which the utterance occurs.  
      *Case:* Promise inside a game/role-play where performance isn't expected.  
      *Necessity:* **Non-negotiable.** Context determines whether an utterance *counts as* a promise-constituting act.  
      *Conflict Potential:* With theories ignoring conventional scaffolding (#1, #5) or overemphasizing intention alone.

  7.  **Communication Requirement:** The promisor must intend their commitment to be communicated *to the promisee*, and the utterance must be capable of achieving this.  
      *Case:* Promise unknown to the intended recipient.  
      *Necessity:* **Negotiable.** Most theories require communication *to* the promisee for a *binding obligation to arise*. Some might argue a private "promise" creates a different kind of duty (e.g., fidelity to intention).  
      *Conflict Potential:* With theories emphasizing the promisor's internal state alone (#1, #5) or strict Conventionalism (#6).

  8.  **Fidelity Core:** The obligation must stem primarily from the act of commitment itself and the value of fidelity/trust it invokes.  
      *Consideration:* The nature of promising as distinct from threats, predictions, or mere statements of intent.  
      *Necessity:* **Non-negotiable.** Must capture why breaking a promise is a *distinct* wrong, not just reliance-harm or convention-breaking.

  9.  **Conventional Scaffolding:** The theory must acknowledge that the *practice* of promising relies on social conventions defining the act and managing expectations.  
      *Consideration:* The conventional nature of communication and the historical/linguistic specificity of promising.  
      *Necessity:* **Non-negotiable.** Promising relies on shared understandings.  
      *Conflict Potential:* With theories reducing obligation solely to individual will or reliance.

  ### Which Standard Grounds Survive?
  *   **Survives Best:** **The Value of the Relationship/Fidelity.** A normatively rich account centered on the relationship of trust created by the promise, constrained by context (#6), consent (#2), and morality (#4), can potentially navigate all cases. It explains release (#2), context (#6), and the core wrong (#8), while accommodating debates on death (#3) and self-promises (#5).
  *   **Partially Survives:** **Social Convention.** Essential for contextual validity (#6) and conventional scaffolding (#9), but struggles significantly with intentionality (#1), moral constraint (#4), and especially consent-sensitivity (#2 – why does *my* release dissolve a *conventional* obligation?).
  *   **Struggles Significantly:**
      *   **Promisee's Reliance:** Fails utterly on the unknown promise (#7 – no reliance), released promise (#2 – reliance might exist but obligation dissolves), death (#3 – no one to rely), and game contexts (#6 – no reliance intended). Overextended by unintentional words (#1) and self-promises (#5).
      *   **Promiser's Exercise of Will (Pure Voluntarism):** Fails on unintentional words (#1), consent-sensitivity (#2 – why can *you* release *my* self-binding act?), contextual validity (#6 – why isn't my internal act in the game binding?), and arguably moral constraint (#4 – why can't I bind myself to wrongness?). Struggles with communication (#7).

  ### The Most Eliminative Requirement
  **#2: Consent-Sensitivity.** This requirement alone eliminates pure Will Theories (they cannot explain why the promisee's release dissolves an obligation created solely by the promisor's will) and strict Reliance Theories (reliance might persist after release, yet the obligation dissolves). It also poses a major challenge to strong Conventionalism (why does an individual have the power to override the convention?). It forces the theory to center the *bilateral, relational* nature of the promise.

  **Key Tension:** The most significant potential conflict is between **#3 (Agency-Contingency - obligation dies with promisee)** and theories emphasizing **#8 (Fidelity Core)** or **#5 (Interpersonal Requirement)** taken to imply that the promisor's commitment itself creates a strong, persisting duty of fidelity, even absent a living promisee. Resolving this tension is a major fault line in the theory of promising.
