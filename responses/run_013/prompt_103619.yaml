answer: |-
  The phenomenon you describe—where a jurisdiction reduces its *territorial* emissions by shutting down domestic carbon-intensive assets (like nuclear or fossil plants) but compensates by importing electricity from neighboring jurisdictions (often low-carbon like nuclear or hydro), resulting in **no net global emission reduction** while improving its national inventory—lacks a single universally accepted term. However, it is a well-recognized issue in climate policy and energy economics.

  ### Proposed Term & Definition
  **Territorial Emissions Shifting (TES)**  
  *Definition:* The practice of reducing a jurisdiction's reported (territorial) greenhouse gas emissions by displacing carbon-intensive domestic production (e.g., electricity generation) onto neighboring jurisdictions via trade (e.g., electricity imports), without achieving a net reduction in global emissions. The atmospheric outcome is neutral if the imported energy replaces domestic fossil generation with foreign low-carbon generation.

  ### Distinguishing from Related Concepts
  1.  **Carbon Leakage:**
      *   **Mechanism:** Involves *physical relocation* of industrial production to jurisdictions with weaker climate policies to avoid carbon costs (e.g., a factory moving to a country without a carbon tax).
      *   **Key Difference:** TES involves *trade flows* (electricity imports), not the relocation of physical capital or industrial processes. The demand remains within the original jurisdiction; only the location of *supply* changes without physical movement of industry. Carbon leakage typically worsens global emissions if production shifts to less efficient/higher-carbon regions.

  2.  **Consumption-Based Emissions Accounting:**
      *   **Nature:** An *accounting methodology* that attributes emissions (including embodied emissions) to the final consumer of goods/services, regardless of where they were produced.
      *   **Key Difference:** TES is the *phenomenon* or *policy outcome* enabled by the gap between territorial and consumption-based accounting. TES exploits the *territorial accounting boundary* to create an apparent local reduction that consumption-based accounting would reveal as incomplete or misleading for the importing country.

  3.  **Ordinary Outsourcing/Offshoring:**
      *   **Scope:** Broadly refers to moving *production processes* (e.g., manufacturing, call centers) to other countries, often for cost reasons.
      *   **Key Difference:** TES is specifically about *energy generation displacement* via trade in a fungible commodity (electricity), not the movement of broader industrial or service processes. The motivation is often emissions reporting compliance or political goals, not purely cost reduction. The "outsourced" activity (power generation) was never physically located in the importing country to begin with.

  ### Where the Edges Lie
  *   **Core Case:** Shutting domestic low-carbon (nuclear) or fossil generation and replacing it with imports from existing low-carbon (nuclear, hydro, renewables) sources in a neighboring grid. **Net Atmospheric Effect:** Neutral. **Inventory Effect:** Importing country improves, exporting country unchanged/worsens slightly (if marginal emissions increase).
  *   **Fuzzy Edge 1 - High-Carbon Imports:** If the imports come from marginal high-carbon sources (e.g., coal/gas plants ramped up to meet export demand), TES actually *increases global emissions* while still improving the importer's territorial inventory. This overlaps with carbon leakage via trade but remains distinct from industrial relocation.
  *   **Fuzzy Edge 2 - New Low-Carbon Build:** If imports drive the *construction of new low-carbon capacity* in the exporting country that wouldn't otherwise exist, it *could* lead to net global reductions. This blurs into genuine global decarbonization facilitated by trade.
  *   **Fuzzy Edge 3 - Grid Effects:** If imports displace domestic fossil generation *and* allow the exporting country to reduce *its own* fossil generation (e.g., via more efficient use of existing low-carbon assets across a larger market), it *could* lead to net reductions. This is complex grid optimization.
  *   **Limiting Factor:** TES primarily applies to **electricity trade** due to its fungibility and the direct link between generation location and territorial emissions accounting. It's less relevant for goods with complex supply chains already captured under leakage/consumption accounting.

  ### Why "Territorial Emissions Shifting" Fits
  *   **"Territorial":** Directly references the accounting boundary (emissions within the nation's borders) being exploited.
  *   **"Emissions":** The core subject.
  *   **"Shifting":** Accurately describes the physical displacement of the emission source location via trade flows, without implying physical relocation (leakage) or a change in consumption patterns.

  This term is emerging in academic/policy discourse (e.g., studies on German *Energiewende* emissions impacts), though "emissions outsourcing via electricity trade" or "accounting-driven emissions displacement" are also used descriptively. Its recognition highlights the critical importance of **complementing territorial accounting with consumption-based metrics** to assess true climate progress and avoid unintended consequences like TES.
