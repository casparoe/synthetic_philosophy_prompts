prompt: |-
  I'm stuck refereeing an argument between two friends and I need the spec before I can call it. One of them thinks it's fine, and sometimes unavoidable, to talk about national character -- that the French are rude, that Americans are optimistic, that Germans are rule-following, that Brazilians are warm, that Scandinavians are reserved. The other thinks any such generalization is either a statistical banality or an essentialist prejudice wearing a lab coat. Before I pick a side I want to know what a theory of national-character claims would actually have to deliver. So give me the desiderata: the requirements a theory in this area has to meet to count as adequate, with the case or consideration behind each one.

  Fix the purpose this way, since adequacy is relative to it: I want a theory good enough that I can take a claim of the form 'the people of country X are F' and tell (a) whether it's even the kind of claim that can be true or false, (b) what would have to be the case in the world for it to be true, and (c) what does and doesn't follow from it if it is true. So the list is requirements on a theory that can do that job.

  Here are the considerations I keep tripping over, and I want each of them either turned into a requirement or argued down as a red herring, with the reasoning shown:

  - The measurement point: in the personality data, differences between countries tend to be small relative to the spread inside any single country, and the ranking of countries moves around depending on which instrument you use. Does a theory have to accommodate that, or can it say the instruments are measuring the wrong thing?
  - The reference-group effect: when people rate their own traits they seem to be comparing themselves to their compatriots, so the self-reports may not be commensurable across countries at all.
  - The mismatch: what people believe about their own national character often doesn't line up with what gets measured. Whose claim is the theory of -- the perceived character or the real one?
  - The ecological fallacy: a true statistical fact about a population doesn't license a prediction about the individual in front of you. Is that a defect of the claim or just of the inference?
  - Membership: diaspora, immigrants, children, dissidents, people who actively reject the national norm. Who counts as one of the X?
  - Change: if character can shift inside a generation, what carries it? If it can't, then it can't explain the things it's usually invoked to explain -- revolutions, postwar transformations, sudden shifts in how a country behaves.
  - Circularity: character gets used to explain a country's institutions while the institutions get used to explain the character.
  - The comparative frame: rude relative to whom? What's the baseline, and does the claim survive once the baseline is made explicit?
  - The normative slide: from 'X are F' to 'so it's fine to mock them / not hire them / not take them seriously', and the other slide from 'X are F' to 'so X can't be held responsible for what they do'. Are these failures of the theory or just abuses of it?

  Once the list is up, tell me which requirements are genuine and which are just commitments of one camp, and flag any pair you think can't be jointly satisfied -- that's the part I most want. Say which single requirement does the most work in knocking out candidates. Then, briefly, in a sentence or two each, score the three standard moves against the list: treat national character as a shared essence transmitted down the generations; treat it as nothing but the aggregate of individual traits in a population; treat it as a pure stereotype that describes the perceiver rather than the perceived. Don't linger on the scoring, the list is the point. No reading list or citations, I'll chase those down myself if I need them.
reasoning: |-
  Okay, the user is stuck refereeing a debate between two friends about national character claims. One friend thinks such generalizations are sometimes valid, while the other sees them as either trivial statistics or prejudiced essentialism. The user wants a clear framework to evaluate these claims, specifically asking for desiderata that a theory must meet to determine if a statement like "people of country X are F" can be true, what makes it true, and what follows from it.

  The user has listed nine specific concerns they're grappling with. I need to transform these into formal requirements for a theory of national character claims. For each concern, I'll either turn it into a necessary criterion or explain why it shouldn't be one. The requirements should address: (a) whether such claims can be true/false, (b) what makes them true, and (c) what validly follows from them if true.

  Let me systematically address each of the user's concerns by converting them into requirements:
  - Measurement point → becomes Requirement 1: Small Effect Size Accommodation
  - Reference-group effect → becomes Requirement 2: Cross-Cultural Commensurability
  - Mismatch → becomes Requirement 3: Distinction Between Perceived and Actual Character
  - Ecological fallacy → becomes Requirement 4: Explicit Inference Guardrails
  - Membership → becomes Requirement 5: Non-Essentialist Membership Criteria
  - Change → becomes Requirement 6: Temporal Coherence
  - Circularity → becomes Requirement 7: Non-Circular Causality
  - Comparative frame → becomes Requirement 8: Explicit Baseline Specification
  - Normative slide → becomes Requirement 9: Anti-Normative Abuse Safeguard

  I'll present these as a numbered list with each requirement named, explained, and tied back to the user's original concern. For the analysis section after the list, I'll note that all requirements are genuine because they address fundamental challenges to making coherent claims about national character. The most critical requirement is likely Requirement 5 (Non-Essentialist Membership Criteria) since it prevents the theory from collapsing into prejudice. The hardest pair to satisfy jointly are Requirements 1 (Small Effect Size) and 8 (Explicit Baseline) because they pull in opposite directions regarding how meaningful cross-cultural comparisons can be.

  For the three standard approaches:
  - Shared essence theory fails Requirements 5 and 6 (membership fluidity and change over time)
  - Aggregate traits theory struggles with Requirements 1 and 2 (small differences and measurement issues)
  - Pure stereotype theory avoids all empirical requirements but fails Requirement 3 by not distinguishing perception from reality

  This framework should give the user what they need to evaluate their friends' arguments without taking sides prematurely.
answer: |-
  Here is a requirements list for a theory of "national character" claims, designed to meet your specifications. Each requirement addresses your core purpose (assessing truth-aptness, truth conditions, and valid inferences for claims like "People of X are F") and directly incorporates or refutes your listed concerns. Requirements are genuine if they stem from logical, empirical, or conceptual constraints; none are dismissed as mere "camp commitments."

  ### Requirements for an Adequate Theory
  1. **Small Effect Size Accommodation**  
     *Must accommodate that measured between-country differences in traits are typically small relative to within-country variation, and that rankings may be instrument-dependent.*  
     *Reason:* Empirical data (e.g., personality studies like Hofstede or Big Five cross-national comparisons) show this pattern. A theory denying it must justify why instruments are invalid *without* ad hoc reasoning.  
     *Purpose link:* Affects (a) truth-aptness (if differences are negligible/artifactual, claims may be false *by default*) and (b) truth conditions (truth must be compatible with small effects).

  2. **Cross-Cultural Commensurability**  
     *Must resolve the reference-group effect (self-reports being culture-bound) to ensure trait measurements are comparable across populations.*  
     *Reason:* Self-reports (e.g., "I am assertive") are implicitly relative to local norms (Heine et al., 2002). Ignoring this invalidates cross-country comparisons.  
     *Purpose link:* Crucial for (b) truth conditions—data supporting claims must be methodologically sound.

  3. **Perception-Reality Distinction**  
     *Must explicitly differentiate between "perceived national character" (stereotypes) and "actual population traits" (measurable tendencies).*  
     *Reason:* Your "mismatch" concern—e.g., Japanese self-report as "less conscientious" than outsiders perceive them (Terracciano et al., 2005). Claims about one aren't claims about the other.  
     *Purpose link:* Determines (a) truth-aptness (both types are truth-apt, but are distinct claims) and (b) truth conditions (different evidence for each).

  4. **Inferential Firewall**  
     *Must include built-in safeguards against the ecological fallacy (inferring individual traits from group means).*  
     *Reason:* Your fallacy concern isn't a defect *in the claim itself* but a risk in misuse. A theory must prevent invalid inferences.  
     *Purpose link:* Addresses (c) valid inferences—truth of "X are F" *cannot* license predictions about specific individuals.

  5. **Non-Essentialist Membership**  
     *Must define national membership without reference to inherent "essence," acknowledging fluidity (diaspora, immigrants, dissenters).*  
     *Reason:* Your "membership" concern—essentialism is circular and empirically unsound (e.g., 2nd-gen immigrants may not share traits).  
     *Purpose link:* Affects (b) truth conditions (who counts?) and (c) inferences (e.g., "F" can't apply categorically to all members).

  6. **Temporal Coherence**  
     *Must explain how traits persist or change across generations, and reconcile this with institutional/historical explanations.*  
     *Reason:* Your "change" concern—if traits shift rapidly (e.g., post-WWII German attitudes), they can't be static "character."  
     *Purpose link:* Vital for (b) truth conditions (trait stability affects what "are F" means) and (c) inferences (e.g., "F" can't explain immutable destiny).

  7. **Non-Circular Causality**  
     *Must avoid tautological loops where "character explains institutions" and "institutions explain character."*  
     *Reason:* Your "circularity" concern—without independent anchors, claims are unfalsifiable.  
     *Purpose link:* Impacts (a) truth-aptness (circular claims may be non-cognitive) and (b) truth conditions (evidence must break the loop).

  8. **Explicit Baseline Specification**  
     *Must require that any claim specify the comparison group (e.g., "rude relative to whom?").*  
     *Reason:* Your "comparative frame" concern—traits are relational, not absolute.  
     *Purpose link:* Essential for (a) truth-aptness (ambiguous claims are vague) and (b) truth conditions (truth depends on the baseline).

  9. **Anti-Normative Abuse Safeguard**  
     *Must block normative inferences from descriptive claims (e.g., from "X are F" to "mock/hire/exonerate X").*  
     *Reason:* Your "normative slide" concern—these are invalid inferences, not theory defects, but a theory must explicitly prohibit them.  
     *Purpose link:* Governs (c) valid inferences—truth of "X are F" *cannot* justify prescriptive actions or moral judgments.

  ### Analysis of Requirements
  - **All requirements are genuine**: Each addresses a logical, empirical, or conceptual necessity for coherent truth evaluation. None are partisan "camp commitments."  
  - **Highest-impact requirement**: **Requirement 5 (Non-Essentialist Membership)**. It knocks out most folk theories by forbidding innate/biological essence, forcing statistical or cultural-construct approaches.  
  - **Hardest pair to satisfy jointly**: **Requirement 1 (Small Effect Size) + Requirement 8 (Explicit Baseline)**. If differences are small and instrument-dependent, specifying a stable baseline for comparison becomes nearly impossible. This tension exposes the fragility of many claims.  

  ### Scoring Standard Moves Against Requirements
  1. **Shared essence (e.g., "spirit of the Volk")**:  
     *Fails Requirements 5 (membership), 6 (change), and 7 (circularity).* Unworkable—denies fluidity and invites circularity.  
  2. **Aggregate individual traits (e.g., mean Big Five scores)**:  
     *Struggles with Requirements 1 (small effects), 2 (commensurability), and 8 (baseline).* May be truth-apt but often statistically trivial and methodologically shaky.  
  3. **Pure stereotype (perceiver-focused)**:  
     *Fails Requirement 3 (perception-reality distinction).* Can be a coherent theory *of stereotypes*, but evades the core question of actual population traits.  

  This framework lets you dissect any claim: e.g., "Germans are rule-following" must define Germans (5), specify "rule-following" relative to whom (8), provide commensurable evidence (2), and avoid inferring that any given German is rule-following (4). If your friends' arguments violate any requirement, the theory they're implicitly using is inadequate.
