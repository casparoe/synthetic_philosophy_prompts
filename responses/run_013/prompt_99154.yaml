  The user wants objections phrased in the critics' vocabulary, ordered by likelihood and impact. They also need concise replies, noting weaknesses, concessions, and separating substantive critiques from defensive reactions. Plus, identifying the crucial reply and the dreaded question.

  Starting with objections, the all-subjected proponents will argue that mere affectedness is too broad. They'll say that being affected isn't sufficient for inclusion—coercion is the key criterion. This is high likelihood and medium damage. The reply should clarify that affected interests are authoritative, not any trivial effect, but conceding that coercion is a subset.

  The all-affected defenders will see this as a promiscuous version and worry about over-inclusion. They might ask how to practically determine who is affected. High likelihood, medium damage. Reply: it's decision-specific, with institutional mechanisms. Concede feasibility challenges but argue the principle is sound.

  The Kantian constructivist will press circularity: who decides who's affected? High likelihood, high damage. Reply: procedural democratic mechanisms handle this, but it's a soft spot. Concede the need for prior procedural norms.

  The empirical political scientist will question feasibility: how to identify stakeholders for each decision? High likelihood, medium damage. Reply: use existing democratic tools, but concede institutional innovations are needed.

  The global justice advocate will challenge any bounded demos. Lower likelihood but high damage. Reply: the model allows unbounded demos when decisions have global effects. Concede that states currently limit this.

  Other potential objections include stability concerns from traditionalists and slippery slope worries. These are lower priority but should be addressed briefly.

  The crucial reply is to the circularity objection—democratic procedures can bootstrap membership without a prior demos. If this fails, the core argument is vulnerable.

  The dreaded question is about the "authoritative affectedness" criterion—how to define it without being circular or arbitrary. This cuts to the heart of the theory and is hard to answer without undermining the model.

  Need to ensure replies are concise, acknowledge weaknesses, and strategically concede minor points to preserve credibility. The prep sheet should empower the user to handle tough questions while staying confident in their thesis.
answer: |-
  Here's your Q&A prep sheet, structured for maximum impact with this specific audience. Objections are ordered by likelihood/damage, with replies tailored to the room's dynamics.

  ---

  ### **Top Objections & Replies**  
  *(Ordered: High-Likelihood/High-Damage → Lower-Stakes)*

  1. **The Coercion Objection (All-Subjected Proponents)**  
     *Likely Source:* Coercion-based theorists  
     *Phrasing:* "Your ‘affected interests’ criterion is normatively inert. Coercion is what triggers claims to justification. Anyone *affected* by pollution or trade policy isn’t *owed* a vote—only those subjected to the state’s coercive enforcement. Your view collapses into global democracy or endless referenda for bystanders."  
     **Reply (2-min):** "The coercion view *presupposes* a bounded polity to identify ‘subjection.’ But when a state licenses a polluting factory harming a neighboring country, those victims are *authoritatively affected*—the state’s decision directly imposes harms they can’t contest. Coercion is a subset of authoritative effect (e.g., laws imposing dispossession), not the boundary-maker. My account captures this without artificially excluding those your principle sidelines—like non-coerced but disenfranchised residents."  
     **Soft Spot:** Distinguishing "authoritative affectedness" from bare causation needs sharper examples.  
     **Concede:** Coercion is salient for *some* decisions (e.g., criminal law), but not all.  

  2. **The Over-Inclusion/Objectivity Objection (All-Affected Defenders)**  
     *Likely Source:* All-affected theorists  
     *Phrasing:* "You’ve made the all-affected principle *worse* by hyper-fragmenting the demos. How do you objectively measure ‘authoritative affectedness’ for each decision? Without clear thresholds, agenda-setters decide who counts—importing the boundary problem through the back door."  
     **Reply (2-min):** "Unlike classic all-affected views, my criterion is *decision-relative*, not global. We use existing tools: deliberative minipublics for stakeholder mapping, impact assessments, or courts reviewing exclusion claims (e.g., EU’s *Kadi* ruling). This isn’t more subjective than determining ‘coercion’—and it avoids gerrymandering permanent borders for transient stakes."  
     **Soft Spot:** Agenda control is a real vulnerability (empirical scholar will pounce).  
     **Concede:** Thresholds need institutional calibration, but the *principle* avoids permanent exclusion errors.  

  3. **The Circularity/Regress Objection (Kantian Constructivist)**  
     *Likely Source:* Kantian constructivist  
     *Phrasing:* "Who decides *whose interests count* as ‘authoritatively affected’? If it’s the demos, you’re circular. If it’s an external body, you’ve smuggled in a prior demos. Your ‘dissolution’ is semantic sleight-of-hand."  
     **Reply (2-min):** "The regress stops at procedurally just *meta-rules* for identifying stakeholders—e.g., courts using open-ended standing doctrines, or referendums with dynamic franchise rules (like Scotland’s IndyRef). These are bootstrapped from existing democratic practice, not imposed a priori. The boundary problem dissolves because *procedures*, not a fixed people, do the work."  
     **Soft Spot:** Still relies on *some* prior institutional authority.  
     **Concede:** All democratic legitimation requires a procedural starting point—but mine is thinner.  

  4. **The Feasibility/Agenda Control Objection (Empirical Political Scientist)**  
     *Likely Source:* Referendum scholar  
     *Phrasing:* "In real referendums, elites control who votes and what’s on the ballot. Your model requires constant demos-reshuffling—who administers that? This is a recipe for chaos or covert disenfranchisement."  
     **Reply (2-min):** "We already adapt demoi situationally: EU citizens vote in local elections; UN climate talks include affected states. We’d scale existing tools: citizen assemblies to define stakes for major decisions, or automated franchises (e.g., residency-based for local issues). Yes, agenda control matters—but static borders *entrench* elite power more."  
     **Soft Spot:** Overestimates institutional flexibility in polarized systems.  
     **Concede:** Transition requires reform, but Swiss cantons/EU show dynamic membership is workable.  

  5. **The Global Justice Denial Objection (Globalist Critic)**  
     *Likely Source:* Global justice advocate  
     *Phrasing:* "Why tolerate *any* bounded demos? If a decision affects climate-vulnerable Bengalis, they should vote in US fossil fuel policy. Your ‘authoritative’ qualifier feels like a dodge to preserve state sovereignty."  
     **Reply (2-min):** "It doesn’t dodge—it *demands* their inclusion! If US drilling decisions authoritatively harm Bengal (via climate treaties or enforceability), Bengalis *are* in that demos. My account is *more* globally just than yours: it doesn’t force Bangladeshis into a fixed ‘global demos’ for local zoning votes."  
     **Soft Spot:** Requires radical rethinking of sovereignty (which they’ll endorse).  
     **Concede:** States will resist—but the principle points beyond Westphalia.  

  ---

  ### **Lower-Priority Objections (Field-Defending)**  
  - **"This destabilizes democratic identity!"** (Traditionalist)  
    *Reply:* "Democracy’s value is in contestation, not identity. Static demoi exclude more than they stabilize."  
  - **"What about efficiency?"** (Pragmatist)  
    *Reply:* "Efficiency isn’t legitimacy. We manage complexity in multilevel governance already."  
  - **"You ignore community!"** (Communitarian)  
    *Reply:* "Communities form around shared decisions—e.g., municipal districts. My model enables that."  

  ---

  ### **The Make-or-Break Reply**  
  **You must land the answer to the circularity objection (Objection #3).**  
  If the Kantian’s regress argument sticks, your dissolution claim collapses. Stress:  
  > *"Meta-rules are built iteratively from democratic practice—like expanding suffrage. We start where we are, but the rules are contestable. No view escapes this; coercion theorists assume borders they can't justify."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"How is ‘authoritative affectedness’ meaningfully different from ‘all-affected’? If it’s just ‘interests we deem important,’ haven’t you replaced the boundary problem with a *criterion* problem—and kept the circularity?"**  

  *Why it’s deadly:* It forces you to define "authoritative" without leaning on institutions (circular) or moral intuition (arbitrary). Your best bet:  
  > *"It’s *relational*: an interest is authoritative if it’s (a) systematically impacted by enforceable collective decisions, and (b) the affected party lacks recourse to an equivalent democratic process elsewhere. This excludes bystanders (e.g., distant observers) but includes disempowered stakeholders."*  
  *...but this risks sounding ad hoc. Preempt by framing "authoritative" early in your talk as "binding and non-consensual."*

  ---

  **Final Prep Tip:** When conceding, use: "You’re right that [specific gap] needs work—but unlike alternatives, my approach doesn’t [core flaw: e.g., ‘exclude the subjected’]. That’s the tradeoff." Own the innovation’s roughness while highlighting rivals’ fatal errors. Good luck!
