prompt: |-
  I teach a grad seminar in philosophy of language and every time I run the conditionals unit I get the same fight, but this term it's escalated: two of my students have been at each other since week one. One of them is a closest-worlds person (Stalnaker/Lewis all the way — there's one semantics for "if", it always restricts a modal operator, and the indicative/counterfactual distinction is just about which modal base the context hands you, epistemic vs. historical or metaphysical, plus maybe a presupposition that the antecedent is still an open possibility). The other thinks that's hopeless — for her indicatives and counterfactuals are different animals with different logics: indicatives pattern with strict conditionals (or maybe aren't even truth-apt in the way we all assume), they validate antecedent strengthening, contraposition and transitivity, and they're about what follows from the antecedent given what we know; counterfactuals are variably strict and fail all of that. The rest of the seminar just watches them re-litigate the same three examples, and honestly I think they're argueing past each other on at least one point, but I can't tell which point it is.

  What I want from you is the document they should have written together at midterm: the joint statement of an adversarial collaboration between these two camps. Open with a numbered list of claims both of them can actually sign — about the data that needs explaining, about what each semantics is committed to, about which phenomena are agreed to be genuine and which are agreed to be artifacts of context shift (be careful here, since "context shift" is precisely what's in dispute, so any agreed claim that just presupposes it is out). Then the disagreements: for each one, state the issue, then give the formulation each side would accept as *its own* view — each sentence should be one that the person who holds that view would actually sign, not a strawman — and then record, in advance, what each side predicts about it. The cruxes I want covered at minimum are: (1) whether antecedent strengthening really fails for indicatives once the modal base is held fixed, and if so how to demonstrate it without smuggling in a context change; (2) whether "might" counterfactuals are the duals of "would" counterfactuals, and whether "might" indicatives behave the same way; (3) disjunctive antecedents — does "if A or B, then C" entail "if A, then C"? — since I suspect that's where the two semantics genuinely come apart; (4) antecedents that are undetermined rather than false ("if the coin comes up heads tomorrow", "if it rains on Saturday"), which neither of them seems to have a clean story about; and (5) whether the ordering that "would" uses is a primitive similarity between worlds or something the context supplies as a set of premises or facts, and whether any constructed case can actually tell those two apart. For each crux give me the case or argument both of them agree would bear on it — please build the cases rather than citing the famous ones, since they've both memorized the famous ones and it's degenerated into dueling examples — and then each side's prediction. Finish with the question I keep asking them and they keep dodging: is any part of this dispute merely verbal (e.g. about what counts as "the same context" or "the same modal base"), and if so which part, and is there anything at all that both sides would agree would actually move the debate? Format it as a numbered agreed-claims section, then a disagreements table with columns for the issue, each side's own formulation, and each side's prediction, and keep the tone like something two colleagues could genuinely co-sign rather than a verdict from the referee.
reasoning: |-
  Okay, let me approach this systematically. The user teaches a philosophy of language seminar where two students are entrenched in opposing views on conditionals - one supporting a unified Stalnaker/Lewis semantics, the other advocating a strict distinction between indicatives and counterfactuals. The request is for an adversarial collaboration document that structures their debate.

  First, I need to identify common ground. Both sides likely agree on core phenomena like the invalidity of antecedent strengthening for counterfactuals (e.g., the Oswald/Kennedy case) and the context-sensitivity of conditionals. They probably also concur that "might" conditionals behave as duals to "would" in counterfactual cases. These points can form the basis of the agreed claims section.

  For the disagreements, I'll focus on five key cruxes:
  1) Antecedent strengthening in indicatives: Can it fail under fixed epistemic modal bases? I'll construct a fresh example involving quantum measurement to avoid recycled debates.
  2) "Might" indicatives: Are they duals? The unified view says yes; the dualist says no - testing with an epistemic scenario about office keys.
  3) Disjunctive antecedents: Does "If A or B, C" entail "If A, C"? The unified view rejects entailment; the dualist accepts it for indicatives. A jury decision case could illustrate this.
  4) Undetermined antecedents: How do they behave? Neither theory handles this cleanly - a coin flip scenario will highlight the gap.
  5) Ordering source nature: Primitive similarity or premise-based? A moral dilemma case may test if predictions diverge.

  The document should maintain a collegial tone, presenting each view's position in their own terms. For the "merely verbal" question, I'll note that "context fixation" is the core dispute - with suggestions for empirical tests that could resolve it.

  Throughout, I'll avoid famous examples and craft new scenarios to force fresh engagement. The structure will be: numbered agreements, then a table for disagreements with columns for issue, each view's formulation, and predictions, ending with the verbal dispute analysis.
answer: |-
  ## Adversarial Collaboration Statement: The Semantics of Conditionals  
  **Jointly Authored by [Closest-Worlds Proponent] & [Dualist Proponent]**  
  *(Facilitated by Prof. [Your Name])*

  ### I. Agreed Foundational Claims  
  *Both signatories endorse the following statements as uncontroversial starting points, describing phenomena requiring explanation without presupposing either semantic framework.*

  1.  **Data to Explain:** Natural language contains distinct grammatical moods for *indicative* conditionals (e.g., "If it *is* raining, the streets *are* wet") and *counterfactual* conditionals (e.g., "If it *had been* raining, the streets *would have been* wet"). These exhibit systematic differences in felicity conditions and logical behavior.
  2.  **Core Semantic Function:** Both indicative and counterfactual conditionals involve some form of *modality* and are sensitive to the *context of utterance*.
  3.  **Counterfactual Non-Monotonicity:** Antecedent Strengthening (AS: If A > C entails If (A & B) > C) is *invalid* for counterfactual conditionals. (Example: "If Oswald hadn't shot Kennedy, someone else would have" does *not* entail "If Oswald hadn't shot Kennedy *and no one else had planned to*, someone else would have.")
  4.  **Indicative Epistemicity:** Indicative conditionals are typically (though perhaps not exclusively) used in contexts where the speaker treats the antecedent as *epistemically possible*.
  5.  **"Might" as Dual (Counterfactuals):** For counterfactuals, "If A, might C" is generally equivalent to "Not: If A, would not-C". (Example: "If I had bet on heads, I might have won" ≈ "It's not the case that if I had bet on heads, I would not have won.")
  6.  **Disjunctive Antecedent Ambiguity:** Sentences of the form "If A or B, then C" *can* be interpreted in ways that do not straightforwardly entail "If A, then C" *or* "If B, then C", particularly in counterfactual contexts.
  7.  **Contextual Shifts Happen:** Speakers can and do shift the conversational context (including salient information, priorities, standards) in ways that *affect* the evaluation of conditionals. (Note: Agreement on the *existence* of context shift does *not* entail agreement on whether it explains *all* differences between indicatives/counterfactuals or specific logical failures).
  8.  **The Goal:** To provide a compositional semantics for "if" that best explains the observed linguistic data, including felicity judgments, inferential patterns, and embeddings.

  ### II. Key Disagreements & Predictions
  *(Each party's "Own Formulation" is stated as they would endorse it. "Prediction" states what that view expects to find in the specified case.)*

  | Issue | Crux Question | Closest-Worlds (CW) Formulation & Prediction | Dualist (D) Formulation & Prediction |
  | :---- | :------------ | :------------------------------------------ | :----------------------------------- |
  | **1. Antecedent Strengthening (Indicatives)** | Can Indicative AS fail *without* invoking an uncontroversial context shift? | **Formulation:** Indicatives restrict an epistemic modal base. AS *can* fail if adding the conjunct B shifts the *ordering source* (e.g., relevance, normality standards) *within* the fixed epistemic modal base. Failure isn't *just* about adding information incompatible with the base. <br> **Prediction (Case 1 - Quantum Box):** "We know exactly one particle decayed in Box X, causing the Geiger counter to click. We don't know which particle (P1 or P2) decayed." Speaker A: "If P1 decayed, the counter clicked." (True). <br> Speaker B: "If P1 decayed *and it was the only particle that could have decayed*, the counter clicked." (False? - Sounds odd/redundant, but CW predicts potential failure if adding "only particle that could have" changes relevance/normality ordering). | **Formulation:** Indicatives are strict conditionals over an epistemic modal base K: "If A, C" is true iff all A-worlds in K are C-worlds. AS *must* hold: If all A-worlds in K are C-worlds, then all (A&B)-worlds (a subset of A-worlds) are C-worlds. Apparent failures involve *context shifts* changing K. <br> **Prediction (Case 1 - Quantum Box):** Both statements are true. The second sounds odd/redundant ("if P1 decayed and it was the only particle that *could have* decayed" pragmatically implicates we know P1 decayed, but semantically, if K only contains worlds where exactly one particle decayed, all worlds in K where P1 decayed *and* it was the only one that could have are still worlds where the counter clicked). Failure requires changing K. |
  | **2. "Might" Indicatives as Duals** | Is "If A, might C" (indicative) equivalent to "Not: If A, would not-C" (indicative)? | **Formulation:** "Might" is the dual of "would" for both indicatives and counterfactuals. "If A, might C" = ¬(If A, would ¬C). <br> **Prediction (Case 2 - Office Keys):** Context: We know Alex *always* either leaves keys on desk (D) or in drawer (R), but never both/nor elsewhere. We don't know where they are now. <br> (A) "If the keys aren't on the desk, they might be in the drawer" (True). <br> (B) "It is not the case that if the keys aren't on the desk, they must not be in the drawer" (True). CW predicts (A) and (B) are equivalent and both true. | **Formulation:** Indicative "might" conditionals lack a clear dual relationship with indicative "would". "If A, might C" asserts compatibility of A&C with the epistemic base K. "Not: If A, would not-C" denies that A entails ¬C in K. These are distinct. <br> **Prediction (Case 2 - Office Keys):** (A) "If not-D, might R" is true (¬D & R is compatible with K). <br> (B) "Not: If not-D, would ¬R" is also true (¬D does not entail ¬R in K; worlds exist where ¬D & R). However, D argues the *equivalence* fails when A is incompatible with K: "If the keys are on the moon, they might be in the drawer" is *false* (incompatible with K), but "Not: If the keys are on the moon, they would not be in the drawer" is *vacuously true* (no A-worlds in K). |
  | **3. Disjunctive Antecedents (DA)** | Does "If A or B, then C" (indicative) entail "If A, then C"? | **Formulation:** "If A or B, C" does *not* entail "If A, C" for indicatives or counterfactuals. The disjunction can introduce a partition affecting the selection function/ordering. <br> **Prediction (Case 3 - Jury Duty):** Context: The jury will convict (C) only if they find *both* motive (M) *and* opportunity (O). We know they have sufficient evidence for O, but not for M. We don't know what the defense will argue. <br> Statement: "If the defense fails to cast doubt on motive *or* fails to cast doubt on opportunity, the defendant will be convicted." (True). <br> Entailment? "If the defense fails to cast doubt on motive, the defendant will be convicted." (False - they might still cast doubt on O). CW predicts the entailment fails. | **Formulation:** For *indicatives*, "If A or B, C" entails "If A, C" *and* "If B, C" because the strict conditional quantifies over all worlds in K. Apparent failures involve non-epistemic factors or context shift. <br> **Prediction (Case 3 - Jury Duty):** The indicative "If ¬Dm or ¬Do, C" *does* entail "If ¬Dm, C". The latter seems false because asserting "If ¬Dm, C" *pragmatically suggests* we are considering ¬Dm-worlds while ignoring the possibility that Do might fail. Semantically, however, in all ¬Dm-worlds within K (which include worlds where Do fails), C holds. The falsity intuition is pragmatic, not semantic. |
  | **4. Undetermined Antecedents** | How are indicative conditionals with antecedents not known to be true/false (e.g., future contingents) evaluated? | **Formulation:** The antecedent restricts the epistemic modal base. The conditional is evaluated based on the closest A-worlds within the current epistemic possibilities. Truth requires that *all* contextually relevant/salient closest A-worlds are C-worlds. <br> **Prediction (Case 4 - Fair Coin Flip):** A fair coin will be flipped tomorrow. Speaker: "If it comes up heads, I will win $10" (said after making a bet contingent on heads). <br> CW: Truth depends on the closeness ordering. If "normal course of events" includes the bet being honored, it's true. If salient possibilities include the bet organizer absconding, it might be false. Lacks a uniform prediction; highly context-dependent. | **Formulation:** "If A, C" (indicative) requires that A&C is epistemically possible and that A entails C relative to the current epistemic base K. For future contingents, K often lacks determinate facts about the future, making strict entailment problematic. <br> **Prediction (Case 4 - Fair Coin Flip):** The statement is *not* straightforwardly true *or* false. K contains worlds where it comes up heads and the speaker wins, and worlds where it comes up heads and they don't win (e.g., organizer vanishes). Since A (heads) does not entail C (win $10) in K, the strict conditional is false. However, asserting it seems appropriate, suggesting indicatives might not be truth-apt strict conditionals after all, or require a different analysis (e.g., suppositional). |
  | **5. Nature of Ordering Source** | Is the "closeness" ordering for "would" a primitive similarity metric between worlds, or contextually supplied by premises/facts? | **Formulation:** The ordering source is a contextually supplied function from worlds to sets of propositions (representing ideals, norms, priorities, facts). "Closeness" is defined as maximal satisfaction of these propositions. It is not primitive similarity. <br> **Prediction (Case 5 - Moral Dilemma):** Context: Dr. X must choose: Save 5 patients with Drug A (leaving 1 to die) or save 1 patient with Drug B (leaving 5 to die). We hold fixed all non-moral facts. <br> Statement: "If Dr. X had saved the 5, she would have done the morally right thing." <br> CW (Premise-based): Prediction depends on *which* moral premises (e.g., "Maximize lives saved" vs. "Never actively cause death") the context supplies. Can be true or false. | **Formulation:** The ordering reflects a contextually determined primitive *similarity* relation between worlds. While influenced by priorities, it is not reducible to premise satisfaction. Similarity can incorporate "miracles" or small differences. <br> **Prediction (Case 5 - Moral Dilemma):** CW (Similarity-based): The truth depends on which world where she saves the 5 is *most similar* to actuality. If the most similar world is one where she violates a minor procedural rule to get Drug A, it might still be true. If it requires her to have a radically different character, it might be false. The prediction is similarly context-dependent but driven by holistic similarity, not aggregating premise satisfaction. *(Both sides agree this case is hard and predictions are nuanced; the key difference is the *mechanism* generating the ordering, not necessarily the truth value output in every case.)* |

  ### III. The Merely Verbal Question
  **Q:** Is any part of this dispute merely verbal? If so, which part, and is there any evidence both sides agree could move the debate?

  *   **Agreed:** The term **"context shift"** is a potential source of merely verbal disagreement. Both sides agree context shifts *occur* (Claim 7). The dispute is often over whether a particular phenomenon (e.g., AS failure for indicatives, DA intuitions) *requires* positing a shift in the *core parameters* of the semantics (modal base K for D; modal base *and/or* ordering source for CW) versus being explained by the *fixed* parameters of the semantics itself. Labeling something a "context shift" can sometimes be a way of dismissing data rather than explaining it.
  *   **CW Perspective:** The Dualist sometimes dismisses AS/DA failures for indicatives as "just context shift," without specifying *which* contextual parameter shifted and *why* it shifts in that specific linguistic environment. If "context shift" becomes too unconstrained, it risks vacuously protecting the strict conditional analysis.
  *   **D Perspective:** The Closest-Worlds proponent sometimes invokes subtle shifts in the ordering source to explain away data that challenges their unified analysis (e.g., DA for indicatives, or intuitions about strict entailment). If the ordering source is too flexible, it risks making the theory unfalsifiable.
  *   **Moving Forward - Agreed Crucial Test:** Both sides agree that progress hinges on finding clear cases that meet two criteria:
      1.  **Contextual Stability:** Cases where competent speakers robustly agree that the *relevant conversational context* (salient information, priorities, topic) remains fixed *by their own lights* throughout the evaluation of the key conditionals.
      2.  **Divergent Predictions:** Where the two theories make genuinely different predictions about the truth value of specific indicative conditionals (especially concerning AS, DA, or the behavior of "might") *within* that demonstrably stable context.
  *   **Is it *All* Merely Verbal?** No. Both signatories agree the dispute is substantive. The core disagreement is whether the distinctive *logical properties* of indicative conditionals (like potential AS/DA validity) and the mechanisms needed to model them require fundamentally different semantic structures compared to counterfactuals. Finding cases satisfying the criteria above would provide evidence one way or the other.

