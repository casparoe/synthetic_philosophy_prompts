  I'm a second-year PhD student assembling a short research proposal (roughly 2,500 words) for a departmental work-in-progress grant that funds a single semester, and I want to build it around a half-formed idea about the internalism/externalism debate over practical reasons. My suspicion is that the debate has been kept alive less by a genuine disagreement than by a quiet equivocation, and that the equivocation can be made precise in a way that dissolves part of the dispute and relocates the rest. The Williams-style internalist holds that any true statement of the form 'A has a reason to φ' must be answerable to A's subjective motivational set, whereas the externalist holds that some such statements are true regardless of what A happens to care about. I want to argue that each side is tracking a different role the word 'reason' plays: one in first-person deliberation, where a consideration must be able to move the agent, and one in third-person appraisal, where a consideration must be able to license criticism of the agent. On this reading the two roles impose different admissibility conditions on what is ostensibly the same relation. The open question I want to pose is whether a single notion of a reason can discharge both roles at once, or whether the term is systematically ambiguous between them; and if it is ambiguous, whether the ambiguity is benign, a mere matter of register, or does real explanatory work, so that internalism and externalism turn out to be answers to two different questions rather than rival answers to one and the same question.

  Please turn this into a proper proposal with a precise statement of the question, an account of why the existing positions leave it open, a description of the method (what I would actually do, week by week, over a semester), a statement of what a successful result would look like, and an honest account of what would count as the project failing. One methodological constraint I want you to respect: do not simply map my two roles onto the familiar motivating-versus-normative reason distinction, since I take that distinction to be part of what is at issue and want the proposal to earn it rather than presuppose it. I would rather you introduce whatever apparatus is needed, for instance a distinction between the conditions under which a consideration may be adduced in deliberation and the conditions under which it may be adduced in criticism, together with a story about how those conditions interact, and then show what follows for the original dispute. Don't bother with a reading list or citations; I'll supply those myself.

  At the end, add a short section in which you tell me what would change your mind about the framing: which argument or consideration would show that the two roles are really one after all, and where in this plan the reasoning is most likely to break down. Write in American English.
