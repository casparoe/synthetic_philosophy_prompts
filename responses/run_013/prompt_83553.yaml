answer: |-
  Your frustration is spot-on: conservation practice is indeed wrestling with material constitution puzzles in real time, and the profession's implicit metaphysics is fascinatingly messy. Let's dissect the commitments without flinching. Here’s the argument:

  ### Core Tension in Conservation Metaphysics
  Conservation is pulled between **two incompatible ontologies**, and it navigates this by applying **context-dependent rules** that *feel* consistent but aren’t metaphysically unified:
  1. **Material Constitutivism** (for intervention ethics):  
     - Minimal intervention/reversibility assumes the *original matter* is ontologically privileged. Every cleaning, repair, or alteration risks destroying part of the work's authenticity.  
     - **Commitment:** The artwork is numerically identical to its original material substrate. Replace any part, and you’ve destroyed *that specific work* to some degree (hence "partial destruction").  

  2. **Flexible Persistence** (for restoration/display):  
     - Replacing stretchers, fingers, or armatures while claiming the work "survives intact" implies the artwork can persist through *partial matter replacement*.  
     - **Commitment:** The artwork is a *historically continuous entity* that can incorporate new matter if functional/structural integrity is maintained, akin to Theseus’ ship.  

  ### Why These Conflict
  - **The Replica Test:** If the artwork could survive *total* matter replacement (like Theseus’ ship), a chemically identical cast *should* be the same work. But conservators reject replicas as fakes.  
  - **The Destruction Test:** If the original matter is constitutive, replacing a rotten stretcher *should* destroy the work. But conservators claim it survives.  

  ### The Artworld’s Workaround: "Integrity of the Whole"
  Conservation resolves this with a **pragmatic hybrid**:  
  - **Original matter is sacred *where it embodies artistic intent***. A repaired finger is acceptable if it restores the *appearance* intended by the artist, using compatible materials.  
  - **Replicas are rejected** because they lack the *causal history* of creation by the artist (or under their authority).  
  - **Commitment:** Artworks are *historical individuals*: defined by origin (artist’s act) + material continuity + intentional structure.  

  ### Instruction-Based Art: The Exception That Breaks the Rules
  - Here, conservation fully embraces **type-token ontology**: The work is the *type* (instructions), and each installation is a *token*.  
  - **Why?** The artist’s intent explicitly decouples the work from specific matter. Insurers accept this because the market treats the certificate/instructions as the "original".  
  - **Inconsistency:** For paintings, matter is constitutive; for instruction art, it’s contingent. The profession *does* run dual metaphysics.  

  ### What Strictly Requires Which View?
  | Practice | Requires | Why |  
  |----------|----------|-----|  
  | Minimal intervention | Material Constitutivism | Reversibility assumes original matter is irreplaceable and must be preserved beneath interventions. |  
  | Part replacement | Flexible Persistence | Survival through change implies matter isn’t strictly constitutive. |  
  | Rejection of replicas | Historical Individuality | Authenticity requires causal origin, not just identical appearance. |  
  | Instruction-based art conservation | Type-Token | The work persists iff the instructions are preserved; matter is ephemeral. |  

  ### If You Adopt Extreme Ontologies: What Changes?
  1. **"Artwork = Original Matter" (Radical Constitutivism):**  
     - **Changes:** No part replacement allowed (not even stretchers). Every cleaning is documented as destruction. Instruction-based art couldn’t exist (no persistent "work" after painting-over). Conservation becomes pure preservation – no restoration.  
     - **Contradiction:** The profession collapses. It couldn’t justify *any* intervention beyond stabilization.  

  2. **"Artwork = Repeatable Type" (Radical Anti-Materialism):**  
     - **Changes:** Replicas = originals. Conservation shifts to preserving information (e.g., scans, recipes). Physical "tokens" are disposable. Market values evaporate (no originals to auction).  
     - **Contradiction:** Minimal intervention is meaningless – why preserve matter if it’s fungible?  

  ### Why Conservation Can’t Be "Just Convention"
  Conventions *mask* metaphysical commitments:  
  - **Minimal intervention** isn’t arbitrary – it assumes original matter has non-reproducible value (a constitutivist commitment).  
  - **Rejecting replicas** isn’t pragmatic – it assumes authenticity requires historical genesis (a Lockean "principle of origin").  
  - **The market’s seven-figure premiums** rely on *material fetishism*: the belief that the artist-touched matter carries aura (Benjamin’s *aura* reified).  

  ### Conclusion: The Unstable Triad
  Conservation relies on **three mutually inconsistent principles**:  
  1. **Matter is sacred** (when cleaning).  
  2. **Matter is replaceable** (when restoring).  
  3. **Matter is irrelevant** (when authenticating instruction art).  

  **What holds this together?**  
  - **Artist’s intent as arbiter:** Intent defines which aspects of matter are constitutive (e.g., "this varnish is part of the work" vs. "this stretcher is incidental").  
  - **Professional narrative:** Conservation "preserves the work’s integrity" by bending ontology case-by-case. The *story* of continuity matters more than metaphysical rigor.  

  **Your essay hook:** Conservation practice exposes material constitution as *negotiated* – not discovered. The "statue" isn’t the clay or the form, but a *cultural object* whose persistence conditions are set by artists, institutions, and the market. The profession isn’t quietly running multiple metaphysics; it’s loudly proving that no single metaphysics works.
