prompt: |-
  I write historical novels, and I have been trying to state the rule I actually follow about what I may invent. I do not mean what is legally safe or what an estate would sue over; I mean what a writer owes. My verdicts, by feel:

  - Two long-dead diplomats whose papers are lost: I invent a private meeting, an argument, a parting. Fine.
  - A figure who kept a day-by-day diary: I have him, on a day the diary puts him at home with a fever, slipping out to join a conspiracy. Not fine.
  - A film that turns a composer who was genuinely celebrated in his own lifetime into a talentless schemer, to make a point about genius. Fine; I would defend it.
  - A politician who died ten years ago, with a widow and grown children still living: I invent an unrecorded cruelty to a servant. Not fine.
  - The same invented cruelty, attached to someone dead two hundred years, with no descendants and no living partisans. Fine.
  - A real abolitionist, alone at his desk, drafting the case for slavery and then burning it. Not fine, and I cannot see who alive is harmed by it.
  - A real person given an invented motive for something he demonstrably did. Fine.

  My provisional rule was: invent freely wherever the record is silent, and never contradict it. The composer case contradicts a documented fact about a real man's standing, and I still say fine; the cruelty to the servant contradicts nothing, and I still say no. So the rule is either false or means something other than what it says. And the case I keep going back and forth on: putting a real writer who died a few years ago into a comic novel as a minor character, doing something mildly absurd he plainly never did, with no libel and no living plaintiff in view.

  Give me the principle, or a small set of candidates, that gets as many of these verdicts as possible; tell me which verdict I must surrender if none does; and say what the surviving principle predicts for a case I have not listed — make it one that would separate the candidates.
reasoning: |-
  Hmm, the user is a historical novelist struggling with ethical boundaries in their craft. They've presented seven concrete cases where their instinct says "fine" or "not fine" about inventing details involving real historical figures, and one unresolved case about portraying a recently deceased writer comically. Their proposed rule ("invent freely in silence, never contradict") clearly fails to explain their own judgments - particularly how they approve of contradicting historical record in the composer case but reject inventing undocumented cruelty for a recently dead politician.

  The core tension seems to be between two dimensions: factual fidelity and relational ethics. When they reject inventing the abolitionist's private thought experiment despite no living victims, it reveals a deep reverence for historical truth itself as sacred. Yet the composer case shows they prioritize artistic commentary over factual accuracy when the target is sufficiently historical. The proximity to living memory matters intensely - note how the 10-year-dead politician's family makes cruelty invention unacceptable, while the same cruelty attached to an 18th century figure gets approval.

  For the unresolved case about the recently deceased writer, their hesitation makes perfect sense. It's precisely in the gray zone where artistic purpose clashes with contemporary memory. The lack of living plaintiffs doesn't erase the ethical unease - which suggests their real principle isn't about legal risk but about honoring the human connection to history. If they proceed, the key would be ensuring the portrayal contains no malice and serves a clear narrative function beyond mere convenience.

  A robust principle should explain why the abolitionist's burned draft feels like violation (it distorts core identity) while the diplomat's invented argument doesn't (it embellishes without corrupting essence). The composer case works because it's framed as commentary, not biography. The servant cruelty fails because it attacks character without proportional purpose. Ultimately, this isn't about rules but about stewardship: the historical novelist as someone who borrows real human lives and must return them undiminished in essential dignity.
answer: |-
  Based on your intuitive verdicts, your core principle isn't about factual silence vs. contradiction, but about **respect for agency and legacy, balanced against historical distance and artistic purpose.** Here's a principle that captures most of your judgments:

  **"Invent freely concerning actions and private moments *if* it does not fundamentally distort the documented character, core achievements, or inflict unwarranted harm on the living legacy of the individual, with greater latitude granted by historical distance."**

  **How this principle explains your verdicts:**

  1.  **Diplomats (Meeting/Argument):** *Fine.* Record silent. Invention concerns actions/private moments. No distortion of documented character/core achievements. Significant historical distance. No living legacy harmed.
  2.  **Diarist (Slipping Out):** *Not Fine.* Directly contradicts a documented fact (diary entry). Fundamentally distorts the documented reality of that specific day and potentially his character (if the conspiracy is significant).
  3.  **Composer (Talentless Schemer):** *Fine (as you'd defend it).* **This is the key test.** While it contradicts documented standing, the artistic purpose (commentary on genius) is strong. The *distortion serves a larger thematic point beyond misrepresenting the individual*. Historical distance likely plays a role in making this palatable. It's a *deliberate reinterpretation for effect*, not a simple factual error.
  4.  **Politician (Cruelty - Recent):** *Not Fine.* Invented action (cruelty) fundamentally distorts character negatively. High potential to harm living legacy (widow, children, reputation). Proximity matters.
  5.  **Politician (Cruelty - Distant):** *Fine.* Same invented action, but historical distance minimizes harm to living legacy. No known living partisans or descendants bearing the direct weight of the accusation. Distortion is less impactful on current understanding/reputation.
  6.  **Abolitionist (Drafting Pro-Slavery):** *Not Fine.* While no living person is obviously harmed, it fundamentally distorts the documented *character and core beliefs* of the individual in a deeply contradictory way. It attacks the essence of who history records them to be. The harm is to historical truth and the figure's intrinsic legacy.
  7.  **Invented Motive:** *Fine.* Motives are often opaque in the historical record. Attributing a plausible (even if invented) motive for a documented action doesn't usually distort the core *fact* of the action or the fundamental character/achievement, unless the motive itself is wildly implausible or character-assassinating. It's filling a typical silence.

  **The Unresolved Case: The Recently Deceased Writer in a Comic Novel**

  *   **Principle's Prediction:** *Likely Not Fine, or Requires Extreme Care.*
  *   **Why:** The historical distance is minimal. While there may be no living plaintiff *likely to sue*, there *is* a living legacy – readers, colleagues, admirers, the literary community, potentially close friends or associates who knew him well. Portraying him doing something "mildly absurd he plainly never did" in a comic context risks distorting his character for comedic effect in a way that could feel disrespectful or trivializing to those who remember him. The potential for unwarranted harm to his living reputation/memory is significant, even if non-legal. It feels like exploiting a real, recently deceased person for a cheap laugh. If the portrayal was affectionate, captured his *known* essence even within the absurdity, and served a deeper point than just comedy, it *might* pass – but it's ethically fraught due to the proximity.

  **Surrendering a Verdict? The Composer Case is the Outlier.**

  *   The principle above *mostly* holds. The hardest fit is **Case 3 (Composer)**. The principle emphasizes avoiding fundamental distortion of character/core achievements. Portraying a celebrated composer as a "talentless schemer" is a massive distortion of his core achievement (his talent) and character.
  *   **To keep Case 3 as "Fine" within your principle, you must explicitly acknowledge Artistic Purpose/Thematic License as a higher justification:** The principle needs an addendum: *"...unless the invention serves a significant, overriding artistic or thematic purpose that justifies the distortion, particularly when sufficient historical distance exists."*
  *   **If you *cannot* accept this addendum, then you must surrender the Composer verdict as "Not Fine" under the core principle.** Your instinct to defend it suggests the addendum is necessary for *your* ethical framework.

  **Separating Case: Inventing a Hidden Disability**

  *   **Scenario:** Inventing that a well-documented, physically robust historical military leader (dead 150 years) secretly suffered from debilitating epilepsy that influenced key strategic decisions (where the record is silent on his health during those moments).
  *   **How it Separates Candidates:**
      *   **Candidate 1 (Pure Silence/No Contradiction):** Silent on health during decisions? Invent freely! *Probably Fine.* But does inventing a major disability distort the documented perception of his vigor and leadership?
      *   **Candidate 2 (Respect Legacy/Distortion):** Inventing a hidden, debilitating condition fundamentally reshapes the understanding of his achievements and character. It attributes documented successes (or failures) to a hidden struggle not part of the historical record or perception. *Likely Not Fine* under this principle, unless handled with extreme sensitivity and clear thematic purpose *beyond* explaining decisions.
      *   **Candidate 3 (With Artistic License Addendum):** If the invention serves a powerful theme about hidden burdens of leadership or the stigma of illness, and historical distance is great, *might* be Justified/Fine. If it's just a convenient plot device to explain a defeat, *Not Fine*.

  **Conclusion:**

  Your guiding ethic prioritizes **respect for the person (their character, achievements, and living legacy)** over strict adherence to gaps in the factual record. Historical distance acts as a buffer, lessening the impact on living legacy and allowing more interpretive freedom. The **Composer case** shows you also value **significant artistic purpose** as justifying even substantial reinterpretations when sufficiently historical. Your unease about the **Abolitionist's private thought** and the **Recent Writer** stems from violating respect for core identity or exploiting the recently deceased.

  **Therefore, your refined principle(s) could be:**

  1.  **Core:** Avoid inventions that fundamentally distort the documented character, core achievements, or known beliefs of a real person, especially if they inflict unwarranted harm on a living legacy.
  2.  **Corollary 1:** Greater historical distance grants greater license for invention concerning private moments, undocumented actions, and plausible motives.
  3.  **Corollary 2 (The Artistic License Clause):** Significant, overriding artistic or thematic purpose may justify substantial reinterpretation or invention, including contradiction of some documented facts, *provided* sufficient historical distance exists to mitigate harm to living legacy and the work is clearly presented as interpretation, not factual record.

  This framework explains your verdicts, requires adding the Artistic License clause to justify the Composer case (or surrendering that verdict), predicts caution for the Recent Writer, and provides a nuanced way to approach ambiguous cases like the invented disability.
