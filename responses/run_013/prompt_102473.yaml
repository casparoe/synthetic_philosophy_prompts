prompt: |-
  I am a novelist at work on a book about a public-health administrator, and I have run into a philosophical puzzle that bears directly on how I render her inner life. The puzzle, as I understand it, is the asymmetry experimental philosophers have turned up in ordinary judgments of intentional action: an agent who knowingly brings about a harmful side effect is described as having brought it about intentionally, whereas an agent who knowingly brings about a comparable beneficial side effect, under otherwise identical conditions, is not. I want a rigorous conceptual explanation of what is actually going on in that asymmetry — not a summary of the finding, which I already possess, but an account of the competing interpretations of it and of what would decide between them.

  To keep the discussion honest, please test each interpretation against three variants of a case I have invented for the novel, so that the explanation cannot be delivered from stock examples. In the first, my administrator redirects funds in a way she knows will shorten waiting times for most patients and will also, as a foreseeable consequence, starve a small clinic that serves a stigmatized population; she professes indifference to the clinic and cites only the efficiency gains. In the second, the same redirection benefits the stigmatized clinic and burdens the comfortable majority, and she is equally indifferent to that. In the third, the harm to the small clinic is not merely foreseen but required by a rule she is bound to follow, so that her conduct conforms to an institutional norm even as it damages the clinic.

  For each variant, I would like you to say what each of the leading accounts of the asymmetry predicts about whether an ordinary reader would call the outcome intentional, and to flag where the accounts come apart. I am especially interested in whether the asymmetry is really about the moral badness of the side effect, about norm violation more generally, or about the attribution of blame to an agent whose conduct we already want to censure — and in whether the folk concept of intentional action is best treated as a checklist of conditions or as something looser whose application is sensitive to context. Tell me which of my three variants would serve as a clean test between the accounts and which are muddied, and why. Finally, say plainly where the debate currently stands and what a decisive experiment would have to look like, even if no one has run it. I do not need citations, dates, or reading lists; I need the conceptual map, argued rather than recited.
reasoning: |-
  Okay, this is a fascinating and complex query from a novelist working on a character study. The user is clearly deeply engaged with experimental philosophy's findings on intentional action asymmetry and needs a rigorous conceptual breakdown - not just textbook summaries - to inform their protagonist's inner life. 

  Hmm, the core puzzle they present is classic Knobe Effect territory but with a sophisticated twist: they've constructed three original narrative variants to test competing theories. What's impressive is how they've already anticipated key theoretical tensions - moral valence vs norm violation vs blame motivation - and want to see these theories strained against their fictional scenarios. This isn't someone looking for Philosophy 101; they need the current scholarly battleground mapped for creative purposes.

  Let me unpack their variants first. The administrator cases are brilliant because they isolate different elements: Variant 1 (harm to stigmatized group) should trigger strong asymmetry, Variant 2 (benefit to stigmatized group) reverses moral valence while keeping structure identical, and Variant 3 (harm as institutional requirement) tests whether norm compliance neutralizes the effect. Much cleaner than the usual CEO vignettes.

  The user's hidden challenge seems to be: "How do I render a character's moral psychology authentically when readers' judgments of her intentions will be skewed by these asymmetries?" They likely want to know whether readers will perceive their administrator as cruelly intentional or bureaucratically mechanical in different scenarios - which cuts to the heart of character portrayal.

  For theory comparison, I should pit the three main contenders against each variant:
  1) The Motivational Bias account (blame drives intention-ascription) should show strong effects in Variant 1, weak in Variant 2, and might falter in Variant 3 if rule-following reduces blame.
  2) Norm-Based accounts would predict Variant 3 disrupts the asymmetry since the harm becomes prescribed.
  3) Deep Self accounts might interestingly suggest Variant 1 reveals her "true" indifference as blameworthy while Variant 2 doesn't.

  Ah, and their meta-question about folk concepts being checklists vs contextual is crucial. I should emphasize that most accounts now reject simple checklists - even the skill/control/belief conditions get morally modulated. The debate leans toward hybrid models where moral evaluation penetrates intention attribution, not just post-hoc rationalization.

  For a decisive test, Variant 3 is gold: if the asymmetry persists even when harming the clinic is rule-required, it sinks pure norm-violation theories. But if it disappears, that supports Knobe's original norm hypothesis. Nobody's run this exact test with institutional norms to my knowledge - most use simple means-end harm.

  Current consensus? The field accepts moral valence matters but disputes why. The cleanest view might be that intention attributions serve our blame practices - we stretch "intentional" to cover foreseeable harms we condemn, but don't stretch it for benefits we don't credit. Hence Variant 1 feels intentional because we need to blame her; Variant 2 doesn't because no praise is due.

  ...I should probably avoid calling any theory "correct" though. Better to show how each illuminates different facets of the asymmetry. The novelist can then choose what serves their character - maybe even showing how the administrator herself would analyze her actions differently than observers do. That meta-layer could be rich for fiction.
answer: |-
  Below is a rigorous conceptual analysis of the intentional action asymmetry, tested against your three variants. I'll outline the leading accounts, their predictions for your cases, points of divergence, and evaluate what drives the asymmetry—focusing on moral valence, norm violation, blame, and the structure of folk concepts.

  ---

  ### **Leading Accounts of the Asymmetry**
  1. **Moral Valence Account**:  
     The asymmetry arises because *moral badness* directly penetrates judgments of intentionality. Harmful side effects are more likely to be deemed intentional because their negative moral status triggers a heuristic linking bad outcomes to blameworthy intent.

  2. **Norm-Violation Account**:  
     Intentionality hinges on whether the side effect violates a salient *norm* (moral, conventional, or institutional). Harmful outcomes often imply norm violations, while beneficial ones do not, explaining the asymmetry.

  3. **Blame Motivation Account**:  
     Observers inflate intentionality judgments to justify *blame*. When an outcome is condemnable, we retrospectively label it "intentional" to license moral criticism. For neutral/positive outcomes, no such motivation exists.

  4. **Deep Self Account**:  
     Intentionality reflects whether the outcome aligns with the agent’s *core values or commitments*. Harm reveals a "bad" deep self, making the side effect feel expressive of the agent’s true intentions, while benefit does not.

  ---

  ### **Predictions for Your Variants**
  #### **Variant 1**  
  *Redirects funds → shortens waits for majority, harms stigmatized clinic (foreseen but indifferent).*  
  - **Moral Valence**: **Intentional** (harm is morally bad).  
  - **Norm-Violation**: **Intentional** (violates norm of non-maleficence/equity).  
  - **Blame Motivation**: **Intentional** (blame warrants labeling harm as intentional).  
  - **Deep Self**: **Intentional** (indifference to harm reveals defective values).  
  *All accounts converge here.*

  #### **Variant 2**  
  *Redirects funds → harms majority, benefits stigmatized clinic (foreseen but indifferent).*  
  - **Moral Valence**: **Not intentional** (benefit is morally good).  
  - **Norm-Violation**: **Not intentional** (no salient norm violated; may even fulfill equity norms).  
  - **Blame Motivation**: **Not intentional** (no blame needed; benefit may be praised but not credited as intentional).  
  - **Deep Self**: **Ambiguous** (indifference to majority harm *could* reveal "bad" deep self, but benefit to stigmatized group complicates this).  
  *Accounts converge on NOT intentional, except Deep Self may split judgments.*

  #### **Variant 3**  
  *Redirects funds → harms stigmatized clinic, but harm is REQUIRED by institutional rules.*  
  - **Moral Valence**: **Intentional** (harm is still morally bad, regardless of rules).  
  - **Norm-Violation**: **Not intentional** (action complies with institutional norms; no violation).  
  - **Blame Motivation**: **Not intentional** (rule-compliance reduces blame; less need to inflate intentionality).  
  - **Deep Self**: **Not intentional** (action reflects institutional loyalty, not "true" self).  
  *Key divergence: Moral Valence vs. Norm/Blame/Deep Self accounts.*

  ---

  ### **Conceptual Tensions & Decisive Tests**
  - **What Drives the Asymmetry?**  
    The asymmetry is *primarily motivated by blame*, not raw moral badness or norms alone. Blame Motivation best explains why we selectively "raise the bar" for intentionality in harmful cases: to justify condemnation. Norm violation often accompanies harm (triggering blame), but Variant 3 isolates this. If harm is rule-required, blame decreases, and intentionality judgments should drop—undermining pure Moral Valence.  

  - **Folk Concept: Checklist vs. Contextual?**  
    The folk concept is **not a rigid checklist** (e.g., skill + control + awareness). It is *contextually flexible* and sensitive to evaluative pressures. Blame motivates observers to weight "awareness" more heavily for harms, reframing side effects as quasi-intentional.  

  - **Cleanest Test: Variant 3**  
    This pits Moral Valence against the others. If ordinary readers still call the harm "intentional" despite rule-compliance, Moral Valence wins. If intentionality drops significantly, Norm-Violation/Blame accounts win.  
    *Prediction*: Blame Motivation wins—intentionality judgments will decrease in Variant 3. Rule-following dilutes blame, reducing the need to tag the harm as intentional.  

  - **Muddied Cases**:  
    - Variant 2 is ambiguous for Deep Self (does benefiting a stigmatized group offset indifference to harm?).  
    - Variant 1 is too "textbook" to discriminate—all theories agree.  

  ---

  ### **Current State of the Debate**  
  - **Dominant View**: Hybrid of **Blame Motivation + Norm-Violation**.  
    Moral badness alone is insufficient (e.g., harmless norm violations aren’t deemed intentional). Blame is the engine, but norm violations provide the conditions for blame to activate. Deep Self remains niche, as it struggles with indifferent agents (e.g., Variant 2).  
  - **Weakest Account**: Moral Valence. It fails in cases where harmful outcomes fulfill norms (e.g., a surgeon causing necessary harm) or where neutrality is preserved.  

  **Decisive Experiment**:  
    Manipulate **blame independently of moral valence and norm violation**. For example:  
    1. Agent causes harm *in compliance with norms* (like Variant 3) but is described as *personally endorsing* the harm vs. reluctantly following rules.  
    2. Measure intentionality judgments and blame separately.  
    *Crucial prediction*: If blame decreases under rule-compliance but intentionality remains high, Moral Valence wins. If intentionality drops with blame (even for identical harms), Blame Motivation wins.  

  ---

  ### **Conclusion for Your Novel**  
  The asymmetry arises because readers *retrofit intentionality to harms they condemn*, especially when the agent appears indifferent (revealing a blameworthy character). In your variants:  
  - **Variant 1**: Harm to the clinic will feel intentional—readers will see your administrator as callous.  
  - **Variant 2**: Benefit to the clinic won’t feel intentional—readers may see her as fair or mechanical.  
  - **Variant 3**: Harm will feel *less intentional* if she follows rules—readers may shift blame to the institution.  

  This reflects folk psychology’s pragmatism: we deploy "intentional" not to describe mental states objectively, but to express moral appraisal. Your administrator’s inner indifference matters less than how observers *use* that indifference to construct a blameworthy narrative. For fiction, lean into the tension between her purely instrumental reasoning and the reader’s need to moralize her trade-offs.
