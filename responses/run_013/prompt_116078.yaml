answer: |-
  Here’s your exam package, designed to force analytical engagement with the case:

  **Exam Question (78 words):**  
  Dana’s wine-tasting reports change after training: she accurately detects "wet-cardboard" in a Chardonnay but also reports it in a known-neutral sample 33% of the time. Does this case support cognitive penetration? Explain *precisely* which claim about Dana’s experience is at issue. Outline distinct possible explanations for the *entire pattern* of reports (true positive + false positives). What evidence could discriminate between these explanations? How does the definition of penetration matter?

  **Model Answer (Approx. 280 words):**  

  The case potentially supports cognitive penetration (CP), but only the claim that Dana’s *perceptual experience itself* (e.g., the phenomenal character of the taste) changed due to conceptual knowledge from training. This must be distinguished from the uncontroversial claim that her *judgments* or *reports* changed.

  Three distinct explanations for the entire pattern exist:  
  1.  **Criterion-Shift/Response Bias:** Training lowered Dana’s threshold for reporting "wet-cardboard," making her more likely to say it’s present even with unchanged sensations. This explains both hits (Chardonnay) and false alarms (neutral).  
  2.  **Perceptual Learning:** Training refined Dana’s *sensory discrimination*, enhancing her ability to detect subtle features genuinely present in the Chardonnay. The false alarms could be random errors or misapplication of this new sensitivity.  
  3.  **Attention:** Training directed Dana’s attention to specific sensory dimensions. She now consciously registers features she previously ignored, but these features were always present in the experience. The neutral sample’s false alarms might stem from over-interpreting minor sensations within the attended dimension.

  Reports alone (hit + false alarm rate) cannot discriminate between these. A CP explanation posits the *content* or *character* of experience changed. To test this, we need evidence *independent* of subjective report. Crucially, we must manipulate the concept ("wet-cardboard") *independently* of sensory exposure. For example, if activating the concept *before* tasting (via priming) alters Dana’s subsequent discrimination thresholds or neural correlates of sensation *for identical stimuli* compared to neutral priming, CP becomes more plausible than mere learning or bias. A genuine *sensitivity* increase (d') alone is ambiguous; it could be perceptual learning *without* top-down content penetration.

  The dispute hinges on defining CP. If CP requires cognitive states to *constitutively shape* perceptual content (strong CP), evidence of concept-driven phenomenal change is needed. If CP includes cognitive states merely *modulating* attention or processing (weaker CP), the attention explanation might suffice. This case best tests strong CP claims.

  **Marking Scheme (5 x 4 = 20 marks):**  

  1.  **Clarity on Experiential Claim (4 marks):**  
      *   *Must-hit:* Distinguishes claim about change in *perceptual experience/phenomenology* from change in judgment/report/belief.  
      *   *Common Error:* Conflates change in experience with change in report or belief/judgment.

  2.  **Three Rival Explanations (4 marks):**  
      *   *Must-hit:* Clearly outlines **Criterion-Shift/Response Bias**, **Perceptual Learning**, and **Attention** as distinct explanations for the *full pattern* (true positive + false positives).  
      *   *Common Error:* Offers only one explanation, conflates explanations (e.g., treats attention as identical to penetration), or fails to address false positives.

  3.  **Evidence & Discrimination (4 marks):**  
      *   *Must-hit:* States reports alone are insufficient; identifies need for evidence independent of report (e.g., neural, behavioral discrimination tasks) and crucially recognizes the necessity to **manipulate the concept independently of sensory exposure** (e.g., priming) to isolate cognitive influence. Notes sensitivity increase (d') is ambiguous.  
      *   *Common Error:* Suggests only better reports or more trials as evidence; fails to see the ambiguity of sensitivity or the need for independent concept manipulation.

  4.  **Definition Dependency (4 marks):**  
      *   *Must-hit:* Explicitly states that whether the case supports CP depends on how CP is defined (e.g., strong constitutive shaping vs. weaker modulation/influence like attention).  
      *   *Common Error:* Assumes a single definition of CP; doesn’t acknowledge how definitions impact the argument.

  5.  **Core CP Argument (4 marks):**  
      *   *Must-hit:* Builds a coherent argument using the above points: e.g., *if* strong CP is defined as cognitive states changing phenomenal content, *then* evidence X (from point 3) is required to support it over the rivals (point 2), focusing on the experiential claim (point 1) and definition (point 4).  
      *   *Common Error:* Merely lists points without integrating them into a reasoned conclusion about the case and CP.

  **Word Count:** Exam Q: 78 words. Model Answer: ~280 words. Marking Scheme: ~200 words. Total: ~558 words.
