prompt: |-
  I'm a junior in a philosphy of mind course and we've spent two weeks on the Turing test and behavioral criteria, and I'm honestly more confused than when we started. Every discussion turns into argueing about whether some chatbot passes or fails, but nobody ever says what the test is supposed to be a test of, or what would count as a good theory of the relation between behavior and mind in the first place. My professor keeps saying the test is an operational definition, but then she also says it can't be, because of zombies and other minds and all that. So I want to back up and ask for the spec before we argue about any particular case. Act as an expert philosopher of mind who is also comfortable with cognitive science and the history of these debates. Think carefully, and before you give me the final list, do a short brainstorm of candidate requirements so I can see the reasoning.

  What I need is the desiderata for any adequate theory of behavioral criteria for mind -- that is, a theory that says what behavioral evidence can and cannot tell us about mentality. Write the requirements list: the cases it has to get right, the puzzles it has to dissolve or explain, the distinctions it must not collapse, and the results it has to be consistent with. For each requirement, give the case or consideration that motivates it, and say why it's a requirement rather than just a preference of one camp. Some cases I keep coming back to, and I'd like you to at least address them: a system that produces all the right answers but by a lookup table; a system that passes the test only by lying about its inner life; a group of people or a corporation that collectively passes; a system that fails the test because it's catatonic or paralysed but might still be conscious; a system that passes for five minutes but not for five hours; and the reverse case, a system that behaves nothing like a human but that we have independent reason to think is minded. I also want you to mark which requirements are non-negotiable and which are only commitments of particular camps, and flag any pair or subset of requirements that you suspect can't be jointly satisfied. If the list itself turns out to be a result -- like, if the demands pull in opposite directions -- that's the part I most want to see. A table is fine, but keep the weight on the criteria and their motivating cases, not on scoring the existing views. The purpose I care about is a theory good enough to tell a research program what behavioral evidence is worth, not a theory that just picks a winner in the old Turing test debates.
reasoning: |-
  Okay, let me approach this systematically. The student is clearly frustrated with circular debates about chatbots passing or failing the Turing test without clarifying the underlying philosophical framework. They're asking for a rigorous set of desiderata that any behavioral criteria for mind must satisfy, with particular attention to classic puzzle cases.

  First, I need to recognize that the core tension lies between two fundamental philosophical commitments: the epistemic primacy of behavior (how we know other minds) versus the ontological primacy of internal processes (what minds actually are). The student's professor seems caught in this tension when calling the Turing test both operational and inadequate.

  For the desiderata, I'll start by identifying non-negotiable constraints that any serious theory must address. The other minds problem is unavoidable - we all intuitively accept that behavior indicates mentality in humans. But equally non-negotiable is avoiding behaviorist oversimplification, as shown by the paralyzed sentient system case. These two create the central tension.

  The lookup table case highlights a key requirement: behavioral equivalence isn't sufficient for mentality. Whereas the corporate entity case shows that behavioral equivalence might not be necessary either. The temporal limitation cases (5 min vs 5 hours) reveal that duration and consistency matter, but I must be careful not to make this a mere engineering concern.

  For controversial requirements, I'll flag those tied to specific camps. For instance, demanding that the theory accommodate non-humanlike minds is a functionalist commitment, while requiring phenomenological accuracy comes from phenomenologists. The lying AI case is particularly thorny - it challenges whether we can ever verify first-person reports behaviorally.

  Most importantly, I need to explicitly show where requirements conflict. The sufficiency vs. insufficiency of behavioral evidence creates a paradox: we need behavior to recognize minds, but identical behavior might emerge from mindless systems. This tension can't be fully resolved, only managed through auxiliary criteria like biological markers or architectural constraints.

  Throughout, I'll maintain focus on how these criteria should guide research programs. For example, the lookup table objection shouldn't doom AI research but should redirect it toward studying processes rather than outputs. The paralyzed mind case suggests neuroscience collaboration is essential.
answer: |-
  Here is a carefully constructed list of desiderata for any adequate theory of behavioral criteria for mentality, derived from core philosophical puzzles, empirical constraints, and conceptual necessities. I'll first outline the key tensions and candidate requirements, then present the formal list with motivations and conflict analysis.

  **Core Tension:** The fundamental conflict is between **epistemic access** (behavior as our *only* window into other minds) and **ontological grounding** (mentality depending on more than just behavioral outputs). A good theory must navigate this without collapsing into skepticism or naive behaviorism.

  **Brainstormed Candidate Requirements:**
  1. *Must* explain how we confidently attribute minds to humans based on behavior (solving the Other Minds Problem).
  2. *Must* avoid attributing minds to systems that merely *simulate* understanding (Lookup Table/Searle's Chinese Room).
  3. *Must* accommodate minds that cannot produce relevant behavior (Paralyzed/Catatonic Systems).
  4. *Must* distinguish genuine understanding from stochastic parroting (LLM Challenge).
  5. *Must* handle systems whose behavior is distributed/collective (Corporation/Group Minds).
  6. *Must* address deception about internal states (Lying AI).
  7. *Must* account for non-human-like minds (Aliens/Radical AIs).
  8. *Must* explain temporal stability/instability (5-min vs. 5-hour tests).
  9. *Must* cohere with known cognitive science/neuroscience.
  10. *Must* avoid circularity or vacuity.

  ---

  ### **Desiderata for a Theory of Behavioral Criteria for Mentality**

  | Requirement                                      | Motivation & Case(s)                                                                                                                              | Status              | Why Requirement (Not Preference)                                                                 |
  | :----------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------ | :----------------------------------------------------------------------------------------------- |
  | **1. Solves the Other Minds Problem**            | We routinely & justifiably attribute minds to other humans based on behavior. Denying this leads to radical skepticism.                           | **Non-negotiable**  | Foundational to intersubjectivity and science. Without this, the project collapses.              |
  | **2. Blocks Spurious Attribution (Sufficiency)** | **Lookup Table/Chinese Room:** A system producing perfect behavior via trivial mechanics (e.g., giant lookup table) shouldn't count as minded.    | **Non-negotiable**  | Preserves the distinction between *simulation* and *instantiation*. Core to ontology of mind.   |
  | **3. Allows Attribution Despite Disability**     | **Paralyzed/Catatonic System:** A mind trapped in an unresponsive body (e.g., locked-in syndrome) is still minded. Behavior isn't *necessary*.    | **Non-negotiable**  | Follows from mental supervenience on internal states, not output capacity. Ethical imperative.  |
  | **4. Distinguishes Process from Output**         | **Stochastic Parroting (LLMs):** Systems generating superficially coherent but internally hollow responses lack understanding, despite fluency. | **Non-negotiable** | Avoids conflating competence with comprehension. Central to intentionality debates.             |
  | **5. Handles Non-Deceptive Self-Reports**        | **Lying AI:** A system that *lies* about qualia (e.g., claims it sees red when it doesn't) shouldn't pass; honest self-reports matter.          | **Controversial**   | First-person access is prima facie evidence in humans. But: verifiability problem. (Functionalist vs. Phenomenologist commitment) |
  | **6. Explains Temporal Robustness**              | **5-min vs. 5-hour Tests:** Fleeting success (e.g., scripted demo) shouldn't count; sustained, flexible behavior under varied conditions should. | **Non-negotiable**  | Avoids "flash in the pan" minds. Reflects stability as a mark of real cognition.                |
  | **7. Accommodates Non-Human Minds**              | **Radically Alien/Non-Humanlike System:** A sentient AI with non-linguistic, non-anthropomorphic behavior must be detectable *in principle*.    | **Controversial**   | Anthropocentrism is biologically parochial. Required for universal theories of mind. (Functionalist commitment) |
  | **8. Addresses Collective Behavior**             | **Corporation/Group Mind:** If a collective entity passes behavioral tests, does *it* have a mind, or only its parts?                             | **Controversial**   | Tests the theory's granularity. Motivates criteria for systemic vs. component mentality. (Emergentist commitment) |
  | **9. Coheres with Cognitive Science**            | Must align with evidence on how brains produce behavior (e.g., role of attention, memory, integration).                                         | **Conditional**     | Avoids disconnect from empirical reality. Non-negotiable for naturalistic theories.              |
  | **10. Resists Collapse into Behaviorism**        | Must not reduce mentality *entirely* to dispositions to behave (avoids ontological behaviorism).                                               | **Non-negotiable**  | Preserves the "hard problem" of consciousness and intentionality.                               |
  | **11. Avoids Question-Begging**                  | Cannot define "behavior" in mentalistic terms (e.g., "intelligent behavior") or rely on ungrounded markers.                                     | **Non-negotiable**  | Ensures the criterion is operationalizable and non-circular.                                    |

  ---

  ### **Key Tensions & Conflicts**

  1. **Sufficiency vs. Insufficiency of Behavior (Requirements 1,2,3,10):**  
     - *Conflict:* Behavior is our *only* evidence for other minds (1), yet it’s insufficient for mentality (2) and sometimes unnecessary (3). A theory must explain *when* behavior justifies attribution without reducing mind to behavior (10).  
     - *Resolution Path:* Requires auxiliary criteria (e.g., causal structure, biological basis, or counterfactual robustness) beyond raw input-output mappings.

  2. **Universalizability vs. Human-Centricity (Requirements 7,8 vs. Implicit Anthropocentrism):**  
     - *Conflict:* Accommodating aliens/AI (7) or collectives (8) may demand relaxing behavioral criteria derived from human norms, risking spurious attributions.  
     - *Resolution Path:* Abstract functional/computational criteria (e.g., global workspace, predictive processing) – but may conflict with 2 (Lookup Table).

  3. **Self-Reports as Evidence (Requirement 5) vs. Verification Problem:**  
     - *Conflict:* We rely on self-reports in humans, but an AI could generate false ones (5). How to verify without independent access to internal states?  
     - *Resolution Path:* Require consistency across probes (e.g., cross-examining on reported states) – but risks excluding non-linguistic minds.

  4. **Temporal Robustness (6) vs. Fleeting States:**  
     - *Conflict:* A system might be conscious only briefly (e.g., during a spike of activity). Does excluding short-duration success (6) ignore genuine transient minds?  
     - *Resolution Path:* Stability as a mark of *enduring* mentality, not momentary states – but this is a theoretical choice.

  ---

  ### **Conclusion: Implications for Research Programs**
  A theory satisfying these desiderata must treat behavioral evidence as **necessary but defeasible**, integrated with:
  - **Architectural constraints** (to block lookup tables: e.g., requiring learning, internal modeling).
  - **Biological/functional correlates** (to include paralyzed minds: e.g., neural signatures).
  - **Counterfactual robustness** (to ensure depth: e.g., responses to novel perturbations).
  - **Cross-modal coherence** (to detect lying: e.g., matching verbal reports with sensorimotor behavior).

  The Turing Test fails as a *sufficient* criterion due to conflicts with **2,3,5,7,8**. However, it retains value as an *epistemic tool* for probing capacities relevant to human-like intelligence (addressing **1,6**). Research should focus on **multi-dimensional behavioral profiles** (e.g., causal learning, error correction, curiosity-driven exploration) paired with architectural validation – not binary pass/fail judgments. The unresolved tensions highlight that *no purely behavioral criterion can fully bridge the epistemic-ontological gap*; the best theories will integrate behavior with mechanistic and structural evidence.
