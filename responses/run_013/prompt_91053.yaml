answer: |-
  Based on your cases and verdicts, the unifying principle that explains your judgments is rooted in **causal inference**, specifically whether the third variable (used for splitting) is a **confounder** (a pre-treatment cause) or a **mediator/collider** (a post-treatment effect or consequence). The core rule is:

  ### Principle
  > **Stratify (report subgroup results) only when the third variable is a pre-treatment confounder that could bias the association. Pool (ignore subgroups) if the third variable is a post-treatment mediator, collider, or outcome, as conditioning on it introduces bias or obscures the causal effect.**

  This rule prioritizes avoiding **post-treatment bias** (conditioning on variables affected by treatment) and **collider bias** (conditioning on common effects). Here's how it applies to your cases:

  ---

  ### Case-by-Case Application
  1. **Graduate admissions**  
     - Third variable: *Program applied to* (pre-treatment confounder).  
     - **Verdict: Stratify** ✅ — Correctly handled. Program is a pre-treatment confounder (women disproportionately apply to selective programs).

  2. **Treatment vs. survival by severity**  
     - Third variable: *Severity* (pre-treatment confounder).  
     - **Verdict: Stratify** ✅ — Severity is a pre-treatment confounder (affects both treatment assignment and survival).

  3. **Job-training evaluation**  
     - Third variable: *Employment at 2 years* (post-treatment outcome/mediator).  
     - **Verdict: Pool** ✅ — Employment is a consequence of the program (mediator) and a collider if unmeasured factors affect both employment and earnings. Conditioning destroys the total effect.

  4. **Drug and hospitalization**  
     - Third variable: *Hospitalization* (post-treatment outcome/mediator).  
     - **Verdict: Pool** ✅ — Hospitalization is caused by the drug (a mediator) and is a collider (common effect of drug and mortality). Conditioning manufactures bias.

  5. **Cancer study**  
     - Third variable: *Tumor grade* (pre-treatment confounder, despite late recording).  
     - **Verdict: Stratify** ✅ — Grade reflects a fixed biological feature (pre-treatment confounder), unaffected by treatment. Recording timing is irrelevant; it's the *causal status* (pre-treatment) that matters.

  6. **Cholesterol study**  
     - Third variable: *On-treatment LDL level* (post-treatment mediator).  
     - **Your verdict: Stratify** ❌ — But the rule says **pool** (LDL is a mediator affected by the drug).  
     - **Resolution:** This is the misfit. The rule cannot accommodate your verdict here. LDL is a mediator (on causal pathway), so conditioning blocks part of the drug's effect and distorts the total effect. Your intuition ("mirror of case 3") is likely conflating effect modification (which is descriptive) with causal estimation. For the abstract, the pooled (neutral) effect is appropriate.

  ---

  ### Resolving the (3)/(4) vs. (5) Conflict
  - **(3) and (4)**: Splitting on *employment* and *hospitalization* (post-treatment mediators/colliders) → **pool**.  
  - **(5)**: Splitting on *tumor grade* (pre-treatment confounder) → **stratify**.  
  **Why?** The distinction is **causal ordering**, not recording timing:  
  - Tumor grade (case 5) is a **pre-treatment confounder** (fixed before treatment, affects outcome).  
  - Employment/hospitalization (cases 3–4) are **post-treatment mediators** (caused by treatment, affect outcome).  
  Your verdicts align because grade’s *causal role* is confounder, while employment/hospitalization’s roles are mediators.

  ---

  ### The Unresolved Misfit: Case 6
  - **Rule’s verdict for (6): Pool** (LDL is a post-treatment mediator).  
  - **Your verdict: Stratify** (with hesitation).  
  - **Why the rule fails here**: Your verdict may stem from interpreting subgroup effects (e.g., "drug works when LDL is low") for mechanistic insight. But for the *abstract* (total effect), pooling is causally sound. The rule strictly prioritizes avoiding mediator bias.  
  - **Compromise**: Report pooled as primary, subgroup as exploratory.

  ---

  ### Prediction for Your New Case
  **Study with reversal after splitting on a common effect** (e.g., *referral to a specialist* caused by both treatment and outcome):  
  - **Third variable**: Referral (post-treatment collider—common effect of treatment and outcome).  
  - **Rule’s verdict: Pool unconditionally**.  
  - **Why**: Conditioning on a collider (e.g., comparing only referred patients) induces spurious associations between treatment and outcome, even if none exists ([Berkson's paradox](https://en.wikipedia.org/wiki/Berkson%27s_paradox)). Example:  
    - Treated patients may be referred more often, and referred patients have worse outcomes, creating artificial harm where none exists.  
    - Pooled analysis avoids this bias.

  ---

  ### Final Rule (Precise)
  > **Stratify if the third variable is a pre-treatment confounder (affects exposure and outcome). Pool if the third variable is:  
  > (i) A post-treatment mediator (on causal pathway),  
  > (ii) A collider (common effect of exposure and outcome), or  
  > (iii) An outcome itself.  
  > *Recording timing is irrelevant; causal status (pre/post-treatment) is decisive.***

  This rule:  
  - **Accommodates 5/6 cases** (all except case 6).  
  - Explains (3)/(4) vs. (5) via causal ordering.  
  - Prioritizes unbiased total effect estimation for abstracts.  
  - For case 6, your verdict likely reflects exploratory interest—reserve it for secondary analyses.  

  If you consistently apply this, you’ll avoid Simpson’s paradox artifacts while guarding against post-treatment bias. For case 6, I recommend aligning with the rule (pool) unless mechanistic effects are the study’s goal.
