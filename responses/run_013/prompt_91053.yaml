n-treatment LDL level — measured after the drug has had time to act, and lowered by it — the drug looks strongly beneficial. My verdict here is stratify, but I'll admit this is the one I'd abandon most easily; it feels like the mirror image of case 3, and I can't say what distinguishes them except that I like this result.

