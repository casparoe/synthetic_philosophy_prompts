  - Evaluate "escapes" from GS (domain restrictions, randomization etc)

  Noticing several layers:
  1) Theoretical layer: must clarify what GS actually says (deterministic rules, unrestricted domain, DSIC) vs what it doesn't (non-ordinal systems, restricted domains)
  2) Practical layer: how different systems (IRV, Borda etc) fare strategically in their small committee setting 
  3) Political layer: how to push back against fatalism ("all reforms pointless") while acknowledging real tradeoffs

  Ah - crucial nuance: their student council setting changes everything. Small N, repeated interactions, known preferences - this dramatically weakens GS's bite since strategic voting is harder to coordinate and easier to detect. Should emphasize this.

  Also spotting pedagogical opportunity: distinguish Arrow (welfare aggregation) from GS (strategic manipulation) since user mentions friend conflating them. Philosophy friend is wrong but for interesting reasons - Arrow's about collective rationality, GS's about manipulation. Different beasts.

  For practical implications, need to structure:
  - First state what GS does imply (no perfect system exists)
  - Then what it doesn't (some systems resist manipulation better than others; context matters)
  - Finally specific guidance for their case (small committee: Condorcet may work; budget dimension: single-peaked helps)

  Biggest trap to avoid: letting "perfect" be enemy of "better". Should stress that while no system is strategy-proof, some are much harder to manipulate than plurality - hence their IRV reform was worthwhile despite not "solving" GS.

  On their specific voting system questions:
  - IRV: manipulable but harder than plurality
  - Condorcet: still manipulable theoretically, but robust in practice with sincere voters
  - Score/approval: outside GS framework but have own issues (like bullet voting)
  - Must emphasize GS only covers ordinal systems - score voting escapes its formal statement but faces different strategic problems

  For domain restrictions: single-peakedness (likely in budget votes) is huge - makes majority rule strategy-proof. Should tell them to exploit this dimension in bylaws design.

  Small-committee factors to flag:
  - Repeated games enable punishment strategies
