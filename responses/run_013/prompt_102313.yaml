prompt: |-
  I'm in a reading group on AI takeoff speeds and we keep hitting the same wall. There's this move people make -- call it the strategy-stealing assumption -- where you argue that being first to some AI capability can't buy you a lasting lead, because whatever you figure out, your competitors can just copy it, so nobody ever gets far enough ahead to lock in a singleton or a winner-take-all outcome. It feels obviosuly true in some settings and obviously false in others, and I want a case that isolates which feature flips it, instead of another round of us gesturing at "increasing returns" and calling it a day. I don't need any sources or names, I'm not going to cite this to anyone, I just want the scenario itself to be airtight so I can actually see where I land.

  So: build me a thought experiment. Setting is a two-lab race over some generic capability -- no superintelligence, no exotic physics, no perfect predictors or mind-reading, and both labs are ordinary profit-motivated organizations rather than fanatics. In your scenario the strategy-stealing assumption should fail: one lab ends up with a decisive and self-widening lead even though the other lab has full access to everything the leader publishes and would copy it instantly if copying were enough. Constraints: the scenario itself in one paragraph, and whatever breaks the assumption has to be a feature of the world -- some rate, some lag, some asymmetry in what copying actually gets you -- not just the leader being smarter or luckier. Then walk me through it: state the assumption precisely as you're using it, show the verdict it gives on your scenario, show why the real dynamics come out the other way, and name the single variable doing the work, including what value of it makes the assumption hold again. Finish with the honest part: what a defender of the strategy-stealing assumption would say to defang the case, whether that reply costs them anything elsewhere in their argument for a slow or multipolar takeoff, and what would have counted as me cheating here -- e.g. if I'd secretly smuggled in a head start that the scenario never justifies. Keep the scenario to one paragraph and cap everything after it at 500 words.
