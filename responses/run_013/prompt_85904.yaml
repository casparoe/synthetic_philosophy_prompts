prompt: |-
  I am taking an upper-level seminar that sits between moral philosophy and economics, and I have been keeping a list of cases that I cannot attach to any term I know. I would like you to tell me whether the thing I am describing is a recognized phenomenon, and if it is not, to name it and define it carefully.

  Here is the pattern. Two people sit on a body that decides things jointly — a committee, a board, a faculty senate. Their moral outlooks do not overlap, and their concerns lie on different questions: one holds that a certain kind of lie is never permitted, whatever the consequences; the other holds that a particular institution must be kept uncontaminated, whatever the cost. On any single question they disagree, and neither converts the other. Precisely because their concerns lie on different questions, they can always strike a bargain: each supports the other's proposal on some other matter, and each goes home having advanced more of what her own outlook says matters. Neither has altered her view. Under the ordinary description this is a success — a mutually advantageous exchange, gains from trade in values rather than in goods.

  What I keep circling is that the two descriptions are one description. The bargain is available to them only because each is using the other's conviction as an instrument: the first is using the second's attachment to purity to get her own prohibition enacted, and she knows that this is what she is doing. And it appears to worsen as it succeeds. The more questions they trade over, the more each is deliberately and repeatedly doing what her own outlook forbids. At the limit, a perfectly successful compromise between two value systems is a state in which each party has made a practice of complicity in what she considers wrong. No one can point to the injury either, because there is no outcome that either outlook can evaluate; the outcome exists only in the space between them.

  A second case, the same shape without the bargaining: two organizations with incompatible missions co-author a single report. Each signs off on sentences its own members would have written otherwise, because the report as a whole advances each cause. By its own lights, each organization is telling a half-truth. Each is better off.

  I do not think this is dirty hands: that is one agent doing wrong for a public good, whereas here there is no single wrongdoer and no single good. It is not logrolling, which needs only intensities of preference and is indifferent to the fact that each trader is violating her own standards. It is not the bare claim that values are incommensurable; I grant that, and what I want to name is what happens when incommensurable values are nevertheless traded. Nor is it moral remainder, since there is no single act to regret and no one who can state what has been lost.

  So: is there a term? If there is, I want to know which nearby concept it actually is, and why my cases are instances of it rather than of something adjacent. If there is not, coin one, define it, and mark its edges. Is the phenomenon the trading, or the complicity, or the fact that the complicity is invisible from inside either outlook? Does it survive when only one side regards the other as a means? What happens when the two outlooks overlap slightly — does it vanish, or does it only become harder to see? I do not need a reading list or citations; the name matters less than the carving. And please take a position rather than surveying the options: if you judge that an existing concept covers the case, say so plainly and defend the identification; if you judge that none does, commit to a coinage and defend the boundaries you draw, including the cases you are excluding.
reasoning: |-
  Okay, the user is describing a fascinating scenario in moral philosophy and economics. They've encountered a phenomenon where individuals with fundamentally different moral frameworks engage in mutual cooperation by trading support on separate issues, each advancing their own values while knowingly enabling the other's (contrary) values. 

  The user has already ruled out several existing concepts: dirty hands (no single agent sacrificing principles), logrolling (mere preference intensity without moral violation), incommensurability (acknowledged but not the focus), and moral remainder (no clear regrettable act). Their frustration with existing terminology is palpable - they've clearly wrestled with this.

  Hmm... the core tension seems to be: mutual benefit through reciprocal moral compromise, where the compromise is invisible to each participant's value system. Each actor becomes complicit in what they consider wrong, yet this complicity is structurally obscured because the "wrong" exists only in the other's framework. 

  The user's questions reveal sophisticated concerns: whether the phenomenon requires symmetry (what if only one party sees the other instrumentally?), whether partial value overlap extinguishes or obscures it, and whether the essence is the trading mechanism or the resulting moral blind spot. 

  I'm struck by how this differs from ordinary compromise. In standard compromise, parties meet halfway on the same issue. Here, they never bend on their core principles - they trade entirely separate issues. The moral contamination happens not through concession, but through strategic alliance. 

  The institutional co-authorship example sharpens the point: each organization signs off on diluted statements they consider half-truths. Again, mutual benefit through mutual impurity, with no shared standard to condemn the impurity. 

  After considering existing frameworks, I conclude this is genuinely novel. Terms like "moral offset" or "principled logrolling" don't capture the distinctive features: the irreconcilable value systems, the mutual instrumentalization, and especially the systemic invisibility of the moral cost. 

  "Mutual Moral Complicity" feels close but misses the structural aspect. "Value-Laundering" hints at the concealment but seems too pejorative. Perhaps "Moral Barter" to emphasize the exchange mechanism? But that doesn't convey the blindness element...

  Ah! The key is the dual nature: cooperation that simultaneously advances each party's values while corrupting them, with the corruption being epistemically inaccessible to the actors themselves. This suggests "Reciprocal Value Contamination" - but that's a mouthful. 

  Wait - the blindness is central. "Mutually Assured Corruption"? Too loaded. "Principle-Trading"? Too benign. 

  Perhaps "Asymmetric Moral Complicity" - but asymmetry isn't always present. 

  I land on "MORAL TRADEOFF BLINDNESS". The tradeoff exists (sacrificing moral integrity for strategic gain), but the blindness component captures why it's sustainable: each party only sees their gain, not their complicity in the other's (to them) incomprehensible wrong. The mutual instrumentalization enables the blindness. 

  For boundaries: it vanishes when values overlap significantly (complicity becomes visible), persists under unilateral instrumentalization (if one party is naive), and differs from simple hypocrisy by requiring mutual reinforcement of the blindness. 

  This coinage honors the user's insight: the tragedy isn't the trade, but the invisible erosion of moral integrity through collaboration.
answer: |-
  This phenomenon is **not adequately captured by any existing term** in moral philosophy, political economy, or decision theory. It represents a distinct and under-theorized dynamic at the intersection of incommensurable value systems, strategic bargaining, and moral complicity. I propose the term:

  **Reciprocal Instrumentalization of Incommensurable Values (RIIV)**

  ### Definition & Core Mechanism
  RIIV occurs when two or more agents, holding fundamentally incommensurable moral frameworks, engage in repeated exchanges of support for each other's preferred outcomes. Crucially:
  1.  **Mutual Instrumentalization:** Each agent intentionally leverages the *other's* core moral commitment as a tool to advance their own distinct values, recognizing that the other's commitment is both non-negotiable and alien to their own framework.
  2.  **Value Isolation:** The traded issues reside in separate domains defined by each agent's framework (e.g., one cares solely about truth-telling, the other solely about institutional purity). Neither framework can meaningfully evaluate the *other's* core concern.
  3.  **Accumulated Complicity:** Each act of support constitutes a deliberate violation of the agent's *own* principles (supporting what they deem wrong). Success breeds habituation in this complicity.
  4.  **Structural Blindness:** The resulting "gain" (advancing one's own value) is visible within each framework, but the *cost* (complicity in the other's violation) is invisible or unintelligible because it exists only within the incommensurable framework of the counterparty. There is no meta-framework to register the loss of integrity.

  ### Why Existing Concepts Fail
  *   **Dirty Hands:** Involves a *single agent* making a tragic sacrifice (doing wrong for a greater good *within one framework*). RIIV involves *mutual* complicity for *distinct, incommensurable* "goods," with no overarching good.
  *   **Logrolling/Pork-Barrel Politics:** Concerns trading based on *intensity of preference* within a *shared value system* (e.g., economic utility). The moral violation is irrelevant; only preference satisfaction matters. In RIIV, the trade *inherently* violates each agent's core principles, and the values are incommensurable, not just preferences.
  *   **Moral Compromise:** Involves finding common ground or mutual concession *on the same issue*. RIIV agents never concede on *their* core issue; they trade *entirely separate issues*.
  *   **Incommensurability:** This is a premise of RIIV, not the phenomenon itself. RIIV is the *strategic behavioral consequence* of sustained interaction under incommensurability.
  *   **Moral Remainder:** Focuses on unresolved regret after a single hard choice *within one framework*. RIIV involves *systematic, repeated* complicity where regret is structurally obscured for both parties.

  ### Defending the Boundaries of RIIV
  1.  **Is the trading or the complicity the core?** The core is the **mutually reinforcing cycle**: trading *enables* the complicity, and the structural blindness *sustains* the trading by obscuring its moral cost. One cannot exist without the other in this pure form.
  2.  **Does it survive unilateral instrumentalization?** **Yes, but asymmetrically.** If only Agent A sees Agent B as a mere instrument, while B is naive or shares some meta-value (e.g., procedural fairness), it becomes a case of **exploitation of incommensurability** or **bad-faith bargaining**, not pure RIIV. Pure RIIV requires *mutual* recognition of the instrumentalization and the incommensurability.
  3.  **What if values overlap slightly?** **RIIV weakens but persists in pockets.** Overlap creates domains where compromise or shared evaluation *is* possible. However, for issues remaining firmly within each agent's *exclusive* domain of concern (where the overlap doesn't reach), RIIV dynamics can still operate. The complicity becomes *potentially* visible but may be rationalized away ("We agree on X, so supporting their Y on trade-off Z is acceptable"). It becomes harder to see, but the core mechanism – trading support on an issue you deem fundamentally wrong *because* it leverages their exclusive value – remains.
  4.  **What is excluded?**
      *   **Cooperation based on shared goals or overlapping values.** (This is alliance-building or compromise).
      *   **Trading favors where no core moral principle is violated by the support given.** (This is logrolling or reciprocity).
      *   **One agent capitulating or converting to the other's view.** (RIIV requires steadfast adherence to one's own framework).
      *   **Single-instance trades.** RIIV implies a pattern or institution enabling repeated interaction.

  ### Why "Reciprocal Instrumentalization of Incommensurable Values" (RIIV)?
  *   **Reciprocal:** Captures the mutual, iterative nature of the exchange and complicity.
  *   **Instrumentalization:** Directly names the core ethical problem – treating the other's deeply held value *only* as a means to one's own end, knowing it requires supporting what one deems wrong.
  *   **Incommensurable Values:** Specifies the critical precondition enabling the structural blindness and impossibility of shared evaluation.
  *   **Implied Complicity & Blindness:** These are inherent consequences of the defined mechanism, making an overly long name unnecessary.

  **In essence, RIIV describes the morally corrosive but strategically rational outcome when agents with fundamentally alien moral universes discover they can "win" on their own terms only by repeatedly becoming complicit in what they perceive as the other's sin, a complicity rendered invisible by the very incommensurability that makes the trade possible.** It is a distinct pathology of pluralistic decision-making bodies lacking a foundational shared ethos.
