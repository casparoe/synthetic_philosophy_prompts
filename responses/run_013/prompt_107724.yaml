answer: |-
  Your ledger reveals a sophisticated ethical framework grappling with identity, autonomy, and time. The core tension—**binding vs. overriding prior directives when the present self is competent**—demands a principle that honors both autonomy and foresight. Below is a synthesis of your cases into a principled hierarchy, followed by reconciliation of conflicts, critiques of your verdicts, and evaluation of proposed devices.

  ---

  ### **Proposed Principle: Contextual Competence with Precommitment Validation**
  **A directive binds if and only if:**  
  1. **The past self was competent** (understood as capacity + absence of undue influence), *and*  
  2. **The present self lacks contextual competence** (inability to grasp the decision’s nature/effects due to altered state), *or*  
  3. **The directive is a valid precommitment** (past self reasonably anticipated and sought to bind the future self to overcome a predictable agential conflict).

  **Where contextual competence exists, the present self’s choice prevails**, *unless* the directive meets the "precommitment criteria":  
  - **Predictable conflict:** The past self foresaw the future self’s state would distort judgment (e.g., addiction, dementia, psychosis).  
  - **Instrumental necessity:** Binding is essential to achieve the past self’s deeply held values (e.g., sobriety, dignity in dementia).  
  - **Proportionality:** The constraint’s scope/duration aligns with the threat (e.g., 90 days rehab vs. indefinite confinement).  

  ---

  ### **Application to Your Cases**
  | Case                                      | Verdict       | Principle’s Application                                                                 |
  |-------------------------------------------|---------------|-----------------------------------------------------------------------------------------|
  | **Rehab contract (sober day 20)**         | Bind          | **Valid precommitment:** Past self anticipated craving-driven demand; 90 days is proportional. |
  | **Living will (dementia, wants "better")**| Bind          | Present self lacks contextual competence (can’t grasp irreversible decline).                  |
  | **Dementia directive ("want to live")**   | Bind          | Present self lacks contextual competence.                                                    |
  | **Lucid revocation → pneumonia**          | Honor revocation | Present self was contextually competent during lucid interval.                          |
  | **Religious transfusion refusal**         | Honor refusal | Present self is competent; no precommitment conflict.                                   |
  | **Directive in depression**               | Ignore        | Past self lacked competence (depression distorted judgment).                            |
  | **Sect member demands intervention**      | Ignore demand | Present self lacks competence (coercive sect undermines autonomy).                      |
  | **Amputation refusal → later request**    | Honor request | Present self competent; no precommitment (past self didn’t foresee fatherhood altering values). |

  ---

  ### **Reconciling the Rehabilitation Conflict**
  Your struggle with **rehab vs. amputation/revocation** is resolved by the **precommitment criteria**:  
  - The rehab patient’s *present demand for release* is the *exact threat* the past self sought to neutralize.  
  - In the amputation case, the present self’s change of mind stems from *new life circumstances* (fatherhood), not a foreseen agential conflict.  
  - In the lucid revocation, the *present self was competent*—no precommitment justification to override them.  

  **Duration matters**: A 2-year rehab contract likely fails *proportionality*—exceeding what’s necessary to counter predictable cravings. This aligns with your intuition.

  ---

  ### **Unresolved Cases & Necessary Revisions**
  1. **Personality-altering brain injury (competent but changed):**  
     - *Principle:* Honor present wishes if competent. The injury may alter values, but competence isn’t contingent on consistency.  
     - *Your likely verdict:* Override? → **Revise.** Competence ≠ fixed identity.  

  2. **Directive with spouse → divorce:**  
     - *Principle:* Ignore directive if divorce implies revocation of shared values. Competent present self prevails.  
     - *Your verdict:* Likely honor later wishes.  

  3. **Physician enforce directive over family:**  
     - *Principle:* Bind if directive valid (competent past self + precommitment). Family objections irrelevant unless undue influence.  

  **Verdicts to abandon:**  
  - **Rehab beyond proportionality:** A 2-year commitment should *not* bind—it violates instrumental necessity.  
  - **Depressive episode directive:** If depression *didn’t* distort competence (e.g., mild/moderate), it *might* bind—your verdict oversimplifies.  

  ---

  ### **Evaluation of Proposed Devices**
  1. **Sunset Clause (lapse after 5 years):**  
     - **Principled refinement.** Addresses *value drift* in long-term directives (e.g., amputation refusal). Aligns with autonomy by requiring reconfirmation.  
     - *Weakness:* May undermine valid precommitments (e.g., dementia directives).  

  2. **Two-Key Rule (witness co-signs revocation):**  
     - **Ad hoc machinery.** Undermines present autonomy by adding paternalistic hurdles. Inconsistent with contextual competence (e.g., lucid revocation doesn’t need oversight).  
     - *Use only* for high-risk precommitments (e.g., rehab) to filter impulse overrides—but risks overreach.  

  ---

  ### **Conclusion**
  Your principle is nearly complete. **Contextual Competence with Precommitment Validation** explains 7/8 cases, with the rehab conflict resolved by adding explicit precommitment criteria (predictability, necessity, proportionality). Abandon strict duration-based verdicts in favor of proportionality. Sunset clauses are principled for value-sensitive directives; two-key rules are suspect.  

  **Test the principle:**  
  - A *Ulysses contract* for bipolar disorder during mania? → **Bind** (foreseen agential conflict).  
  - A directive to withhold food in dementia? → **Invalid** (disproportionate; not instrumental to core values).  

  This framework preserves autonomy while honoring the foresight of past selves when future judgment is predictably compromised—a balance your ledger intuitively seeks.
