prompt: |-
  I'm prepping a seminar on the three concepts of liberty (negative, positive, republican) and I want to bring in a fourth idea I've been kicking around so the students have somthing to chew on. Call it "frictionless liberty": you're free to the degree that the path from wanting something to getting it has no steps you didn't pick yourself, so being made to fill in a form, wait in a queue, or get someone's permission all count as unfreedom even when nobody's coercing you. Rate negative, positive, and republican liberty each from 0 to 1 on how well they capture that, one number per conception, then rank the three by how much of my frictionless idea they actually absorb. Keep the justifications to a sentence or two each, and let me know if I've basically just reinvented one of them with extra steps.
