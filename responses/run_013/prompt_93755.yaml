  Finally, they want practical implications. If we took embodied cognition seriously, how would benchmarks change? (Less trivia, more "put the red block near the blue one after heating it"). The marketing would shift from "knows" to "simulates knowledge behavior." But the field resists this because trivia tests are scalable. 

