  My reading group is going through some old welfare-economics stuff and a friend summarized Harsanyi's aggregation theorem like this: 'Harsanyi proved that a rational person behind a veil of ignorance, not knowing which member of society they'll turn out to be, will pick the arrangement that maximizes average utility. The theorem itself says that any social welfare function satisfying the Pareto principle and the expected-utility axioms has to be a weighted sum of individual utilities, and because behind the veil you're equally likely to be anyone, the weights must be equal. So it's a proof that utilitarianism is the only rational social choice rule, and it also shows how to get around Arrow's impossibility theorem by using cardinal utilities to aggregate preferences consistently. The catch is that it assumes interpersonal comparisons of utility are meaningful, which is why later economists rejected it.' I suspect this is a bit off but I can't put my finger on where. Can you audit it? Tell me which parts a careful Harsanyi reader would accept, which are common simplifications, and which are just wrong, and whether the conclusion that utilitarianism is the only rational rule follows from the accurate bits. Say how confident you are and flag the point you're least sure about. End with a final line \answer{...} containing a short verdict label.
