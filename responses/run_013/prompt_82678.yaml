prompt: |-
  For a philosophy club paper I want to treat jaywalking as a test case for a theory of convention, and I would like the analysis to run in both directions. The episode: the word jaywalker entered American usage in the 1900s and was promoted through the 1910s and 1920s by motoring interests who wanted the street redefined as a place for cars; the first widely copied ordinance, Los Angeles's in 1925, was drafted by the auto lobby; and in recent years several American states have repealed or narrowed their jaywalking laws. The account I am working with goes roughly like this: a convention is a regularity of behavior that solves a coordination problem, is arbitrary in the sense that some other regularity would have served as well, and is sustained because each person conforms in the expectation that others will. Does jaywalking law fit that account, or does its origin as the project of one interested party disqualify it, and if it is not a convention, what is it instead? If it does fit, what does that show about whether conventions obligate us, given that this one is on the books yet widely violated? And what does the account say about a pedestrian visiting from a city where crossing mid-block is unremarkable, who arrives somewhere it is illegal and locally frowned upon — what does she owe, and does that survive the thought that the norm is the residue of a successful campaign rather than a shared solution to a shared problem? I would rather be told where the account is silent than see it stretched.
reasoning: |-
  Okay, the user is writing a philosophy club paper about jaywalking as a test case for a theory of convention. They're using David Lewis's definition: conventions as regularities that solve coordination problems, are arbitrary, and sustained by mutual expectations. The user wants to analyze both directions: whether jaywalking laws fit this definition despite their origin from auto lobbyists, and what that means for obligation when laws are widely violated. They also ask about a visitor from a place with different norms.

  First, I need to recall Lewis's criteria. A convention must solve a coordination problem, be arbitrary, and rely on mutual expectations. Jaywalking laws were pushed by auto interests, not a mutual solution. That might disqualify them as conventions. But maybe after adoption, they function as conventions? The user mentioned states repealing laws recently, which adds complexity.

  The user's deeper need might be understanding how power dynamics affect social norms. They might want to challenge the idea that conventions are neutral. Also, the visitor scenario questions moral obligation when norms are externally imposed. 

  For the origin: auto lobbyists created the law to benefit cars. So it wasn't a mutual solution. That suggests it's not a convention by Lewis's definition. Instead, it's a social rule enforced by law and maybe some norms. But in places where jaywalking is common, the law isn't effective, showing lack of mutual expectation. 

  For obligation: if it's not a convention, obligation might come from legal compliance, not convention. But the user questions why follow a law based on power, not mutual agreement. The visitor might not feel obligated if the norm isn't genuinely shared. 

  The repeal of laws shows that without solving a real coordination problem, such rules can dissolve. This highlights the role of mutual benefit in sustaining conventions. 

  I should address both directions: why it doesn't fit as a convention and what it is instead. Also, discuss obligation and the visitor case. Emphasize where Lewis's account is silent, like power imbalances. Conclude that jaywalking laws are social rules with legal backing, not conventions, due to their origin and lack of mutual expectations in practice.
answer: |-
  Your analysis of jaywalking using Lewis's convention theory is sharp and raises excellent questions. Let's break it down directionally, respecting the account's limits:

  **1. Does Jaywalking Law Fit Lewis's Account of Convention?**

  *   **Likely No, Primarily Due to Origin and Function:**
      *   **Coordination Problem?** Pedestrian/car interaction *is* a coordination problem (avoiding collisions, efficient flow). *However*, the *specific solution* (stigmatizing/banning mid-block crossing, prioritizing car flow) wasn't a mutually beneficial equilibrium emerging spontaneously to solve *that shared problem* for *all parties*. Pedestrians had used streets freely for centuries.
      *   **Arbitrariness?** Yes, alternative solutions exist (e.g., shared streets, strict driver liability, designated crossing times, the status quo ante). This criterion is satisfied.
      *   **Sustained by Mutual Expectations?** This is the crux. Lewisian conventions arise and persist because *everyone involved* sees conformity as beneficial *given* others' conformity. The initial adoption wasn't driven by pedestrians expecting drivers to demand this and thus conforming; it was **imposed top-down by a powerful interest group** (auto lobby) via law and propaganda. Conformity is often driven by:
          *   **Fear of legal penalty**, not expectation of mutual benefit from coordination.
          *   **Social pressure/internalization** of the *manufactured* norm (the "jay" insult), not a pre-existing mutual recognition of its coordination value.
          *   **Driver dominance**, not mutual expectation. Pedestrians yield often because cars are dangerous, not primarily because they expect others to value the *rule itself* for coordination.
      *   **Origin Matters:** Lewis's account focuses on conventions emerging *from* the coordination problem they solve. The jaywalking norm was **externally imposed as a solution *to the car's problem*** (claiming street space), not a solution *to the shared coordination problem* negotiated or emerged among equals. It fundamentally altered the nature of the "problem" by redefining rightful street users.

  *   **What is it Instead?**
      *   **A Social Rule Enforced by Law & Power:** It's primarily a **legal prohibition** backed by state power, originating from successful lobbying.
      *   **An Internalized Norm (in some contexts):** In places where adherence is high, it functions as a **social norm** – people follow it because it's "the done thing," they fear judgment, or they've internalized the safety/order narrative. However, its *origin* distinguishes it from a Lewisian convention. It's a **manufactured norm**.
      *   **A Solution to a Power Struggle, Not a Coordination Problem:** It solved the auto industry's *political* problem of gaining street dominance, not the fundamental *coordination* problem of shared space in a mutually agreeable way.

  **2. If We *Stretch* and Say it *Became* Convention-Like in Some Places...**

  Even in areas with high conformity, the Lewisian account struggles:
  *   **Widespread Violation:** Persistent, common violation (especially in dense cities) directly undermines the "mutual expectation" requirement. If many people don't conform, and others know this, the expectation sustaining conformity weakens significantly. Conformity persists more due to localized enforcement, personal risk aversion, or habit than a robust mutual expectation grounded in solving a shared coordination problem.
  *   **Obligation?** Lewisian conventions don't inherently create *moral* obligation. Conformity is rational (it solves the problem for me if others do it too), not morally binding. The obligation here is:
      *   **Legal:** You *legally* owe compliance to avoid a fine.
      *   **Prudential:** You *prudentially* owe it to yourself to avoid injury (though the rule itself may not be the safest in all contexts).
      *   **But *Conventional* Obligation?** Only weakly, if at all. The mutual expectation is too fractured. You don't conform *because* you believe others value the rule *as the solution to our shared coordination problem* and expect you to value it too; you conform for legal, safety, or social reasons independent of that specific mutual recognition. The account is largely **silent on moral obligation**, focusing on rational self-interest within the convention.

  **3. The Visitor Case: What Does She Owe?**

  *   **Lewis's Account is Largely Silent on "Owing":** It describes *why* conventions work, not what outsiders *morally* owe. It might predict:
      *   **Coordination Rationale:** If she believes the local rule *effectively solves* a genuine coordination problem (e.g., very high-speed traffic), and expects others to conform *and expect her to conform*, then *rational self-interest* might dictate conformity to avoid chaos or accidents *in that specific context*. Her "owe" is pragmatic coordination.
      *   **But... The Residue Problem:** Knowing the norm's origin as a power play undermines this. She may see it as:
          *   **Inefficient/Unfair:** Not the best solution to the *actual* coordination problem (e.g., it prioritizes car speed over pedestrian access).
          *   **Illegitimate:** Imposed, not mutually beneficial.
      *   **What She Actually "Owes":**
      *   **Legal Compliance:** She legally owes compliance to avoid a fine.
      *   **Prudence:** She prudentially owes it to herself to understand local traffic risks.
      *   **Respectful Observation (Possible Social Owe):** She might owe basic observation of local customs to avoid causing friction, *if* the custom is deeply ingrained and harmless to follow. However, knowing its manufactured origin weakens any sense that she *owes* deference to the *norm itself* as a shared social good.
      *   **No Deep Conventional Obligation:** The Lewisian account doesn't generate a strong "ought" for her based on convention alone, precisely because the mutual expectations and perceived mutual benefit underpinning a true convention are absent or suspect. Her strongest "owes" are legal and prudential, not conventional.

  **Conclusion & What it Shows:**

  1.  **Disqualification by Origin & Function:** Jaywalking law, as historically implemented, **does not fit** Lewis's account well. Its origin as a project of one interested party, imposed via law and propaganda to reshape behavior for their benefit rather than emerging as a solution to a *shared* coordination problem among equals, is disqualifying. It's better understood as a **legally enforced social rule/manufactured norm**.
  2.  **Implications for Convention Theory:**
      *   **Power & Imposition:** Lewis's account is **silent on power**. Your case exposes a major limitation: it struggles to distinguish emergent conventions from norms/rules imposed by dominant groups to serve their interests, even if they *resemble* conventions later. Power can manufacture the *appearance* of convention.
      *   **Law vs. Convention:** It highlights the difference between conventions (bottom-up, expectation-sustained) and laws (top-down, sanction-sustained), though they can interact. Laws can *create* conditions for new conventions or props up failing ones.
      *   **Arbitrariness ≠ Neutrality:** An arbitrary rule isn't necessarily neutral or fair. The choice of *which* arbitrary solution gets imposed can reflect power dynamics.
      *   **Obligation Source:** The widespread violation reinforces that obligation here stems from law and prudence, not deeply held mutual expectations of shared benefit from the rule. Lewisian conventions generate rational self-interested compliance, not moral obligation.
  3.  **The Visitor:** The account offers little basis for conventional obligation for the visitor. Her duties are legal and prudential. Knowing the norm's manufactured origin further weakens any sense that she owes deference to *it specifically* as a social good, though basic respect for local context might apply. The account is **silent on the moral weight of historically unjust norms**.

  **Your analysis powerfully shows where Lewis's elegant theory hits the messy reality of power, history, and law. Jaywalking law isn't a pure convention; it's a revealing case study in how power can dress its interests in the clothing of social coordination.** Focus your paper on this tension and the limitations it exposes.
