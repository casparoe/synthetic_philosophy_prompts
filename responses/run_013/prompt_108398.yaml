  Your argument is a classic example of strategy-stealing, which is often used to prove that the first player has a winning strategy in certain symmetric games, such as Hex. However, your seven-token counterexample correctly shows that this reasoning does not always hold. The fault lies in step (2), specifically in the strategy-stealing maneuver. I'll explain why, what the hidden assumption is, how it applies to Hex, and how to generally identify games where strategy-stealing works.

  ### Why Step (2) is Faulty
  The issue is with the strategy-stealing argument in step (2): "The first player could make an arbitrary legal opening move and then, for the rest of the game, simply follow the second player's winning strategy, treating the position after that opening move as the position from which the second player's strategy is to be played."

  This assumes that after the first player makes an initial move, the resulting position is "equivalent" to the initial position in a way that allows the second player's winning strategy to be directly applied. However, in your token game:
  - The initial position (7 tokens) is a losing position for the first player (meaning the second player has a winning strategy).
  - After the first player moves (e.g., to 6 or 5 tokens), the resulting position is a winning position for the second player (the player about to move).
  - The second player's winning strategy from the initial 7-token position cannot be meaningfully applied from the new position (e.g., 6 tokens) because:
    - The game state has changed (different number of tokens), so the strategy may specify moves that are no longer relevant or available.
    - More critically, the new position has a different game-theoretic value: it is winning for the player about to move (second player), not losing like the initial position.

  In essence, the strategy-stealing fails because the first player's initial move fundamentally changes the game state in a way that the second player's strategy from the original position cannot be "transplanted" to the new position. This is due to the presence of zugzwang in your game.

  ### The Hidden Assumption: No Zugzwang
  The strategy-stealing maneuver relies on a hidden assumption: that the game has no zugzwang positions. Zugzwang occurs when a player is forced to move but any move worsens their position (i.e., moving is detrimental). In zugzwang, having the turn to move is a disadvantage.

  - **In your token game**: There are zugzwang positions. For example:
    - With 7 tokens (the initial position), the first player must move to either 6 or 5 tokens, both of which are winning positions for the second player. Moving is harmful here because it cedes the advantage to the opponent.
    - Similarly, with 4 tokens, the player to move loses with optimal play.
  - **Why this breaks strategy-stealing**: If the second player had a winning strategy from the initial position, the first player's attempt to "steal" it by moving first and then following the second player's strategy fails because the first move forces them into a position where the strategy doesn't apply, and the second player can immediately capitalize on the zugzwang.

  - **In Hex (or similar games)**: Zugzwang is absent. Placing a stone in Hex never harms your position—it can only help or have no effect (since you can ignore the extra stone if needed). After the first player makes an arbitrary move, they can follow the second player's supposed winning strategy by pretending the board is symmetric and that their first move was part of the strategy. If the strategy calls for a move that is already occupied by their first stone, they can make an arbitrary move instead, and the extra stone only benefits them. Thus, strategy-stealing works, proving the second player cannot have a winning strategy.

  ### What You Lose by Rejecting Step (2)
  By rejecting step (2), you lose the general guarantee that the second player cannot have a winning strategy in symmetric, finite, drawless games of perfect information. Instead:
  - In symmetric games **without zugzwang**, strategy-stealing holds, and the first player has a winning strategy (e.g., Hex, Bridg-it, or normal-play impartial games).
  - In symmetric games **with zugzwang**, the second player may have a winning strategy, as in your token game or other misère games (where the last move loses).

  This means step (3) does not universally follow from (1) and (2); it only holds when there is no zugzwang.

  ### General Condition for Strategy-Stealing to Work
  Strategy-stealing applies to symmetric, finite, impartial games (where both players have the same moves from each position) with no chance moves and no draws, under the condition that **the game has no zugzwang positions**. Equivalently:
  - The game must be such that making a move is never detrimental to the player (i.e., no position exists where the player to move loses because they are forced to cede an advantage).
  - This is often true for "normal-play" games (last player wins), but false for "misère-play" games (last player loses) or games with inherent disadvantages to moving first.
  - You can test for zugzwang by analyzing whether there are positions where all legal moves leave the opponent in a winning position.

