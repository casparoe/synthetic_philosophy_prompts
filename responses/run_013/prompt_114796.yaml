  Shove-credit: Macro intervention changed CI from 1 to 0 -> credit to macro.

  Round 2: Same initial state.
  Team Micro changes Token1 to West, Token4 to South, Token7 to North.
  Without intervention: CI=1.
  With intervention: after 12 steps, CI=0 -> credit to micro.

  So both get credit, and it's contestable because in Round 1, the block placement clearly affected the tokens, and in Round 2, the token changes also affected the outcome.

  Note: The system is deterministic and sensitive, so changing three tokens might lead to a very different outcome, but that's the point: the micro level is hard to control precisely.

  This design meets the requirements. We use a manageable number of tokens and steps, and we can run it manually.
answer: |-
  ### Session Design: "Patterns and Particles"

  **Core Concept:** A system of simple micro-entities (tokens) with deterministic collision rules forms stable macro-patterns (clusters). Participants intervene at micro or macro levels to alter a macro-outcome (cluster distribution), tracking "shove-credit" for each level. The tension: Do clusters "shove" tokens, or vice versa?

  **Materials:**  
  - **Arena:** 12"×18" gridded foam board (6×9 cells), walls 2" high.  
  - **Micro-entities:** 50 identical tokens (e.g., glass beads).  
  - **Macro-tools:** 5 wooden blocks (1"×1") as "disturbers" (macro interventions).  
  - **Measurement tools:** Stopwatch, small ruler.  
  - **Ledgers:** Two whiteboard sections: "Micro Ledger" (token positions/directions) and "Macro Ledger" (cluster counts/locations).  
  - **Other:** Projector, tokens, tape, paper, markers. Total cost: ~$25.

  **Micro Rules (Deterministic & Simple):**  
  1. **Movement:** Each token moves 1 cell/second in 1 of 4 directions (N/S/E/W).  
  2. **Collisions:** Head-on (e.g., N↔S): Reverse directions. Right-angle (e.g., N↔E): Swap directions.  
  3. **Walls:** Reverse direction on impact.  
  4. **Clusters (Macro):** 3+ tokens connected (adjacent horizontally/vertically/diagonally) for ≥3 seconds.  
  5. **Macro-Outcome:** *Cluster Imbalance (CI)* = (Clusters in left 3 columns) – (Clusters in right 3 columns).  

  **Session Flow (90 min):**  
  *(Facilitator sets initial token positions/directions randomly before each round.)*

  #### **0–10 min: Introduction**  
  - Explain micro rules (projected). Demo 10-second run with 10 tokens.  
  - Define clusters and CI. Emphasize: **No prior knowledge needed; no "careenium/simmball" terms yet.**  
  - Split group: Team Micro (intervenes on tokens) and Team Macro (intervenes with blocks).  

  #### **10–25 min: Round 1 (Macro Intervention Only)**  
  - **Goal:** Achieve target CI = +1 (more clusters on left).  
  - **Rules:**  
    - Team Macro places ≤2 blocks (disturbers) in arena. Blocks are obstacles; tokens bounce off them.  
    - Run: 60 seconds (60 token-moves). No touching tokens!  
    - Record: Initial/final CI in Macro Ledger; initial/final token states in Micro Ledger.  
  - **Shove-Credit Test:** Compare to an identical run without blocks. If CI changes, macro gets shove-credit.  
  - **Sample Run:**  
    - Initial state: 50 tokens, random positions/directions. CI = 0 (3 clusters left, 3 right).  
    - Team Macro places blocks at (2,2) and (5,4).  
    - Final CI: +1 (4 left, 3 right).  
    - Control run (no blocks): CI = 0.  
    - **Result:** CI changed → Macro awarded 1 shove-credit.  

  #### **25–40 min: Round 2 (Micro Intervention Only)**  
  - **Goal:** Achieve target CI = +1.  
  - **Rules:**  
    - Team Micro changes direction of ≤3 tokens at start.  
    - Run: 60 seconds. No blocks allowed!  
    - Record: Changes in Micro Ledger; CI in Macro Ledger.  
  - **Shove-Credit Test:** Compare to identical run without direction changes.  
  - **Sample Run:**  
    - Same initial state as Round 1 (CI = 0).  
    - Team Micro changes 3 tokens: (1,1) N→S, (3,7) E→W, (6,2) S→N.  
    - Final CI: +1 (4 left, 3 right).  
    - Control run (no changes): CI = 0.  
    - **Result:** CI changed → Micro awarded 1 shove-credit.  

  #### **40–60 min: Round 3 (Reconstruction & Dual Paths)**  
  1. **Reconstruction Task (10 min):**  
     - Facilitator runs 60-second session, adding a brief "external event" (e.g., inserting/removing a block at (4,5) for 5 seconds midway).  
     - Participants examine **final clusters only** (no token data) to guess event location/time.  
     - **Sample:** Cluster formation near (4,6) lets group deduce: "Block near column 4–5, ~30 seconds in."  

  2. **Dual Paths (10 min):**  
     - **Goal:** Achieve CI = 0 with either method.  
     - Team Macro (blocks) and Team Micro (token directions) intervene separately in two runs (same initial state).  
     - **Sample:**  
       - Macro: Block at (3,3) → CI = 0.  
       - Micro: Change 3 tokens → CI = 0.  
     - Highlight: Same CI, but tokens followed different paths (recorded in ledgers).  

  #### **60–90 min: Debrief**  
  *(Introduce "careenium" = the box, "simmball" = tokens; map to mental causation.)*  

  1. **Difference-Making & Shove-Credit (10 min):**  
     - "Both levels earned shove-credit: Changing blocks or token directions altered CI. Both are difference-makers."  
     - **Exclusion Worry:** "If micro rules are causally complete (every token move is fixed by prior collisions), how can macro matter? Yet blocks *did* change outcomes."  
     - *Group resistance:* "But isn’t CI just a summary of tokens?" → Counter: "When you placed a block, you didn’t track tokens—you pushed clusters *as a pattern*."  

  2. **Compression & Prediction (7 min):**  
     - Compare ledgers: Micro needed 50+ data points; Macro used ~5 (cluster locations).  
     - "In reconstruction, you predicted an external event from clusters alone. The pattern compresses history."  
     - **Proportionality:** "Was the block (macro) a ‘better’ cause than token-swaps? It targeted clusters directly—no side effects. Micro was precise but fragile."  
     - *Group resistance:* "Micro is *real* cause; macro is just useful!" → Counter: "Usefulness *is* causal—it let you control CI faster."  

  3. **Reflexive Turn (5 min):**  
     - "Your interventions were macro-events: You decided ‘place block here.’ But the micro story of tokens never includes *you*. Where’s the seminar in the token collisions?"  
     - "If mental states are like clusters, are *we* just patterns in a larger careenium?"  

  4. **Limitations & Unanswered Questions (8 min):**  
     - **What the activity CAN’T do:**  
       - **Manufacture realism:** "I designed clusters as useful. In reality, patterns ‘earn’ their status through evolution/selection—we didn’t simulate that."  
       - **Resolve metaphysics:** "It can’t prove clusters are ‘real additions’ to the world. It only shows they’re *irreducible* for prediction."  
     - **Where it misleads:** "It implies patterns are observer-dependent. But in cognition, some patterns (e.g., hunger) are *bio-functional*. The facilitator must ask: *‘What selects which patterns matter?’**  

  ---

  ### Predictable Problems & Solutions  
  1. **Cheating (handling tokens):**  
     - *Problem:* Participants "nudge" tokens in Round 1.  
     - *Solution:* Assign a "rule enforcer" per team. Use tape to mark intervention zones.  

  2. **Unrepeatable outcomes:**  
     - *Problem:* Chaos theory—tiny variations alter results.  
     - *Solution:* Use fixed initial states (recorded on paper). Re-run controls if needed.  

  3. **"Macro is just a summary!" declaration:**  
     - *Problem:* A participant dismisses clusters early.  
     - *Solution:* "Hold that thought—let’s see if shove-credit agrees." Use Round 3 reconstruction to show information encoding.  

  4. **Conflating unpredictability with irrelevance:**  
     - *Problem:* "Micro is unpredictable, so clusters are epiphenomenal."  
     - *Solution:* Stress: "Unpredictable ≠ irrelevant. Blocks *worked* despite chaos."  

  5. **Sliding into macro realism:**  
     - *Problem:* Group ignores micro after Round 1.  
     - *Solution:* Facilitator plays devil’s advocate: "But isn’t the *real* work in the collisions?" Cite micro shove-credit.  

  6. **Timing:**  
     - *Problem:* Rounds run long.  
     - *Solution:* Use stopwatch strictly. Limit intervention planning to 3 mins. Reduce token count if needed.  

  ---

  ### Why This Works  
  - **Shove-credit contestability:** Both levels earn credit (Rounds 1–2), but neither "wins"—setting up exclusion paradox.  
  - **Compression advantage:** Ledgers make macro efficiency visceral; reconstruction forces pattern-level reasoning.  
  - **Reflexivity:** Highlights the seminar’s absence from micro rules, mirroring mental causation’s "hard problem."  

  **Final Note:** The activity *exposes* tensions but can’t resolve them. It leaves participants feeling the push-and-pull—exactly as intended.
