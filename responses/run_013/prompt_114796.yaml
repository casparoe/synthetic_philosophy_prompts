  After 12 steps, we check for clusters (groups of 3+ tokens connected and stable for 3 steps). We record clusters at steps 10, 11, 12.

  At step 12:
    Left half (columns 1-3): tokens at (1,1), (1,2), (2,3) -> form a cluster? They are adjacent? (1,1) and (1,2) are adjacent horizontally, (1,2) and (2,3) are diagonally adjacent? Let's define adjacent as 8-directional. So they are connected. And if they were together for steps 10-12, then it's a cluster. Similarly, right half (columns 4-6): tokens at (3,4), (4,5), (5,6) -> not adjacent? (3,4) and (4,5) are diagonally adjacent, but (5,6) is not adjacent to either. So maybe only one cluster in the left and none in the right? Then CI=1.

  With blocks: Team Macro places blocks at (2,2), (3,3), (4,4). Now run again from the same initial state.

