prompt: |-
  Design a single 90-minute session for a mixed seminar of 16–20 advanced undergraduates and graduate students in philosophy and cognitive science. About half have read work on mental causation, emergence, and explanation; the others have not, so nothing in the activity may presuppose prior reading, and the terms careenium and simmball must not be spoken until the debrief. The room has a whiteboard, a projector, paper, tokens, tape, and up to about thirty dollars of small hardware you may specify. There is no software, no internet, and no time to build anything elaborate.

  The thing I want them to run into is the question of whether the pattern level pushes the substrate around. The image is the careenium: a box of small, fast-moving pieces whose collisions follow a few fixed rules, in which stable, sluggish clusters form. The clusters have their own dynamics, respond to disturbances from outside the box, and end up encoding the history of those disturbances in their arrangement. The question is which level does the causing. Does the cluster arrangement shove the small pieces around, do the small pieces shove the clusters, or is cluster talk merely a convenient summary of a story that is already complete at the level of the pieces? The old worry about whether mental events can move atoms is the same worry in different clothing, and I want the session to make both tempting answers feel forced rather than merely asserted.

  Design the activity itself, not a lecture that the activity illustrates. Rules, materials, roles if you need them, and two or three rounds that escalate. The following must be true of whatever you build.

  Participants must be able, in one round, to intervene only at the macro level, and in another round only at the micro level, with success measured by an observable macro quantity. The micro rules must be simple enough that the group can hold them in view and compute consequences in principle, while the round's time limit makes that computation infeasible in practice, so the compression advantage of the macro description is felt rather than stipulated. The macro regularities must be reliable enough that interventions there work.

  Include a task in which the group must reconstruct an external event from the macro configuration alone, and a moment in which the same macro outcome is reached by two different micro trajectories. Have the group keep two ledgers, one in micro terms and one in macro terms, so that predictive accuracy per unit of description becomes a live comparison rather than a slogan.

  I have been calling the scoring device shove-credit. An intervention earns shove-credit at a level when varying it at that level changes the macro outcome while the description at the other level is held as fixed as it can be. Arrange the mechanics so that the group can award shove-credit to both levels, or to one, and so that the resulting numbers are genuinely arguable rather than obvious. Include a reflexive turn in which participants notice that their own interventions are themselves macro-level patterns, and that the micro story of the room never mentions the seminar.

  Then write the debrief. It must map what happened onto the difference-making criterion for causation, onto the exclusion worry that arises when the micro story is causally complete, onto the idea that a pattern earns its keep by supporting compression and prediction, and onto the question of what it is for a configuration to be about something outside the box. Bring in proportionality: ask whether the macro cause is the more apt one precisely because the micro cause is too detailed to be the difference-maker, and let the group resist that.

  Tell me what will predictably go wrong the first time I run this and how to handle it: participants cheating by secretly handling individual pieces, unrepeatable outcomes, someone declaring the macro level just a summary, someone conflating unpredictability with causal irrelevance, the group sliding into macro realism with the facilitator left to supply the counterweight, and the timing. Give me a minute-by-minute plan and a sample run of the first round with actual numbers, so I can see whether the shove-credit results come out contestable.

  Finally, be honest about what the activity cannot reproduce. My guess is that it cannot manufacture the intuition that macro causes are a genuine addition to the world rather than a description of it, because the micro rules are transparent to me and the usefulness of the macro description is stipulated by my design; and that it cannot reproduce the selection story explaining why these patterns rather than others are the ones that matter. Say which question the facilitator must put into words, and say where the activity will mislead.
reasoning: |-
  We are designing an activity that simulates a system with micro and macro levels, without using the terms "careenium" or "simmball" until the debrief. The goal is to have participants experience the tension between micro and macro causal explanations.

  Materials:
  - A large, shallow box (about 2ft x 3ft) with a grid drawn on the bottom (e.g., 10x15 cells). This will be the "arena".
  - About 200 small, identical tokens (e.g., glass beads, or small cubes) that can move within the arena. These are the "micro" entities.
  - A set of rules for micro movement (simple, deterministic physics).
  - A projector to display the rules and record scores.
  - Paper and markers for recording ledgers.
  - Tape to mark boundaries or for other uses.

  Micro Rules:
  1. The tokens are in constant motion. Each token moves one cell per second in one of four directions: up, down, left, right.
  2. When two tokens collide (i.e., attempt to move into the same cell), they bounce: they swap their directions. For example, if token A is moving right and token B moving left collide head-on, after collision A moves left and B moves right. If they collide at an angle (e.g., one moving right and one moving up, trying to enter the same cell), they swap their directions: the one going right now goes up, and the one going up now goes right. (This rule is deterministic and symmetric.)
  3. When a token hits a wall, it reverses direction.
  4. The initial setup: tokens are placed randomly in the arena, each with a random initial direction.

  Macro Level:
  - We define "clusters" as groups of 4 or more tokens that are connected (adjacent horizontally, vertically, or diagonally) and that remain connected for at least 5 seconds. (We'll call these "stable clusters".)
  - The macro state of the system is characterized by the number and positions of these stable clusters. We will focus on one particular macro property: the "cluster imbalance" (CI). We divide the arena into left and right halves. CI = (number of clusters in left half) - (number of clusters in right half). This is our observable macro quantity.

  Activity Structure:
  The session is 90 minutes. We break it into:
  - Introduction and setup: 10 min
  - Round 1: Macro-level intervention only (15 min)
  - Round 2: Micro-level intervention only (15 min)
  - Round 3: Mixed intervention and reconstruction (20 min)
  - Debrief: 30 min

  Roles:
  - Facilitator: runs the activity, explains rules, times rounds, records scores.
  - Participants: divided into two teams (Team Micro and Team Macro) for some rounds, but everyone participates in discussions.

  Ledgers:
  We maintain two ledgers on the whiteboard (or projected):
  1. Micro Ledger: records the initial microstate (positions and directions of every token) and the final microstate, and the computation steps (if any) to predict the outcome.
  2. Macro Ledger: records the initial macrostate (number and positions of clusters) and the final macrostate, and any macro-level interventions.

  Shove-credit scoring:
  After each round, we ask: "Did varying the intervention at this level (while holding the other level as fixed as possible) change the macro outcome (CI)?" If yes, that level gets shove-credit for that round.

  Round 1: Macro-level Intervention Only (15 min)
  - Goal: Change the cluster imbalance (CI) by intervening at the macro level.
  - Setup: The arena has 200 tokens placed randomly. The facilitator runs the system for 1 minute (60 time steps) to let initial clusters form. Then, the macro state is recorded (positions of stable clusters and CI).
  - Intervention: Team Macro (half the participants) can place up to 3 "disturbance blocks" (small wooden blocks, about 1 inch square) anywhere in the arena. These blocks are obstacles: tokens bounce off them as if they were walls. The blocks are placed and then the system runs for another minute. The idea is that the blocks disrupt the clusters and cause them to re-form in a different pattern.
  - Measurement: Record the new CI. Also, note the initial CI and the target CI (which the facilitator sets arbitrarily, e.g., target CI = +2, meaning two more clusters on the left). Success is measured by how close they get to the target.
  - Ledgers: We record in the Macro Ledger: initial macro state, intervention (block positions), final macro state. We also record in the Micro Ledger: initial micro state (but no intervention) and final micro state.
  - Shove-credit: We compare two runs: one with the blocks and one without (using the same initial micro state). If the CI changes, then macro-level intervention gets shove-credit.

  Round 2: Micro-level Intervention Only (15 min)
  - Goal: Change the CI by intervening at the micro level.
  - Setup: Same initial setup as Round 1 (same initial random placement? or a new one? To make it comparable, we use the same initial setup as Round 1, but without the blocks). Actually, we need a fresh start to avoid contamination. So we reset the arena to a new random configuration (same number of tokens) and run for 1 minute to form initial clusters and record CI.
  - Intervention: Team Micro (the other half) can change the direction of up to 3 tokens (by pointing them in a new direction). They do this at the start of the round. Then the system runs for a minute.
  - Measurement: Record the new CI and compare to the target (same target as Round 1, for consistency). Success is getting close to the target.
  - Ledgers: Record in Micro Ledger: initial micro state, intervention (which tokens and their new directions), final micro state. In Macro Ledger: initial macro state (but no intervention) and final macro state.
  - Shove-credit: Compare to a run with the same initial micro state but without the intervention. If the CI changes, micro gets shove-credit.

  Round 3: Mixed and Reconstruction (20 min)
  - Goal: Two parts.
    Part A: Reconstruction. The facilitator runs the system for 1 minute without any intervention, but during the run, the facilitator introduces a brief, visible "disturbance" from outside (e.g., quickly placing and removing a disturbance block at a particular location and time). Then the system runs to the end. Participants must look at the final cluster configuration and try to reconstruct what the disturbance was (location and time). They can only use the macro state (the positions of the clusters) to infer.
    Part B: Two paths to the same macro outcome. The facilitator sets a target macro state (e.g., CI=0). Then, Team Macro and Team Micro each try to achieve that target. Team Macro uses macro interventions (up to 3 blocks) and Team Micro uses micro interventions (changing up to 3 tokens' directions). They do this in two separate runs (with the same initial setup). We see if both can achieve the same CI (or close) and then we compare the micro trajectories.

  After the rounds, we tally shove-credit: 
  - Round 1: Macro intervention changed CI? (Probably yes) -> Macro gets 1 point.
  - Round 2: Micro intervention changed CI? (Probably yes) -> Micro gets 1 point.
  - Round 3: We don't score shove-credit in the same way because it's a different task. Instead, we note that both levels were able to cause the same macro outcome.

  Reflexive Turn:
  During the debrief, we point out that the participants' interventions (placing blocks, changing token directions) are themselves macro-level events (they are patterns of muscle movements, decisions, etc.) and that the micro story of the tokens doesn't include the seminar or the participants. This raises the question: if the micro story is causally complete, how do we account for the macro interventions?

  Debrief Plan (30 min):
  1. Map the activity to the concepts (10 min):
     - Difference-making: We saw that both micro and macro interventions made a difference to the macro outcome (CI).
     - Exclusion worry: If the micro story is complete (every token's movement is determined by the micro rules), then how can the macro level have any independent causal power? Yet we saw that macro interventions worked.
     - Compression and prediction: The macro description (clusters) was much more efficient for predicting CI than tracking every token. In Round 3 Part A, the macro state encoded information about the disturbance.
     - Aboutness: The final cluster arrangement was about the external disturbance because it carried information about it (in the reconstruction task).
  2. Proportionality (5 min): 
     - Ask: When we wanted to change the cluster imbalance, was the macro intervention (placing blocks) more proportional than changing individual tokens? The macro cause (block placement) seems to be at the right grain: it directly affects clusters. The micro cause (changing a token's direction) is too fine-grained and might have unpredictable effects (because of collisions). But note: in Round 2, they might have succeeded by careful choice of tokens to change.
  3. Group resistance (5 min): 
     - Encourage participants to argue: "But isn't the macro level just a summary? The real work is done by the tokens." Then point out that in the macro intervention, the blocks caused the tokens to move differently, but the block placement was not reducible to any particular token change (it was a pattern). And in the reconstruction task, the macro pattern carried information that wasn't in any single token.
  4. What the activity cannot do (5 min):
     - It cannot manufacture the intuition that macro causes are a genuine addition to the world because the micro rules are transparent and the macro level is designed by us. The usefulness of the macro level is stipulated by our choice of clusters and CI. In reality, the patterns that emerge might be selected by evolutionary or other processes, which we haven't simulated.
     - The activity might mislead by making the macro level seem too clean and designed. In nature, the macro patterns are not pre-defined but are discovered by us because they are useful for prediction and control.

  Predictable Problems and Solutions:
  1. Cheating: Participants might try to handle individual tokens. Solution: Clearly state rules and monitor. In Round 1, only allow block placements. In Round 2, only allow changing directions of tokens at the start (and then the system runs without further intervention).
  2. Unrepeatable outcomes: Because the system is deterministic, if we record the initial state exactly, we can replay. But in practice, with 200 tokens, it's hard. Solution: Use a fixed initial state for each round (record it on paper) and run the same initial state for comparison. Also, note that the system might be chaotic (small changes lead to big differences) but that's part of the point: the micro level is hard to compute.
  3. Someone declares the macro level just a summary: This is expected. Use this as a discussion point in the debrief. Point out that in Round 1, when they placed the block, they were able to reliably change the cluster pattern without knowing the micro details. The macro level allowed them to intervene effectively.
  4. Conflating unpredictability with causal irrelevance: In the debrief, clarify that even though the micro level is deterministic, the macro level might be the only practical way to predict and control. The causal relevance of the macro level is shown by the interventions.
  5. Group slides into macro realism: The facilitator should play devil's advocate for the micro level, asking "But isn't it really just the tokens doing everything?" and then have the group recall the shove-credit results.
  6. Timing: We have tight rounds. Solution: Use a timer. Have the facilitator run the system (moving tokens according to the rules) but note: moving 200 tokens manually every second is impossible. Alternative: We need a way to simulate the system quickly. Since we cannot use software, we must simplify.

  Revised Micro Rules for Feasibility:
  We cannot manually move 200 tokens. So we must reduce the scale.

  Alternative Proposal for Feasibility:
  We use a much smaller grid (say 5x5) and only 10 tokens. But then clusters might not form meaningfully. Alternatively, we use a different physical system.

  New Idea: Use marbles on a vibrating board. But we don't have time to build.

  Instead, we design a board game style simulation that runs quickly. We pre-compute the movement? But that breaks the requirement of computation being infeasible.

  We can use a random element to simplify? But we want deterministic.

  Another idea: Instead of having the participants move every token, we have a fixed rule for the entire system. We can use a grid and update all tokens simultaneously, but with the collision rules. Then we can run a few steps.

  But 200 tokens is too many. Let's reduce to 40 tokens on a 8x8 grid. Then we can have the facilitator move the tokens quickly (one step per second) for 60 seconds? That's still 2400 moves, which is too slow.

  We need a different approach.

  Revised Activity with a Simplified System:
  - Use a grid of 6x6 (36 cells) and 12 tokens.
  - Each token is a colored chip (or marked with an arrow for direction).
  - The facilitator has a stopwatch and calls out "Step!" every 5 seconds. At each step, every token moves one cell in its current direction (if it can; if the cell is blocked by a wall or a block, it doesn't move and reverses direction for the next step). Collisions: if two tokens try to enter the same cell, they bounce (swap directions) and remain in their original cells for that step.
  - We run for 12 steps (1 minute at 5 seconds per step).

  Now, with 12 tokens and 12 steps, we have 144 moves, which is manageable.

  Macro Level: A cluster is 3 or more tokens connected (adjacent) and stable for 3 consecutive steps.

  Cluster imbalance (CI): divide the grid into left 3 columns and right 3 columns. CI = (left clusters) - (right clusters).

  Sample Run for Round 1 (Macro Intervention):
  - Initial setup: Place 12 tokens randomly on the grid, each with a random direction (N, S, E, W).
  - Run 12 steps without intervention. Record the clusters at each step and the CI at the end.
  - Target CI: +1 (one more cluster on left than right).
  - Team Macro places up to 3 blocks (which occupy a cell and are obstacles). They place them at the start.
  - Reset to the same initial state and run again with blocks. Record final CI.

  Sample numbers:
  Initial state: 
    Tokens: positions and directions recorded.
  Without blocks: 
    After 12 steps, clusters: left half has 2 clusters, right half has 1 -> CI = +1.
  With blocks: 
    Team Macro places blocks at (2,2), (3,3), (4,4). 
    After 12 steps: left half: 1 cluster, right half: 1 cluster -> CI=0.
  Shove-credit: Without blocks CI=1, with blocks CI=0 -> change, so macro gets credit.

  But note: we used the same initial state? Actually, we reset to the same initial state and then ran with and without blocks? That's two runs. We can do that for comparison.

  Round 2 (Micro Intervention):
  Same initial state as Round 1.
  Team Micro changes the direction of 3 tokens at the start.
  Without intervention: CI=1 (as above).
  With intervention: they change three tokens (say, three that were going east to west). 
  After 12 steps: CI=0.
  Then micro gets shove-credit.

  But wait: in Round 1, we had two runs (with and without blocks) and in Round 2, we have two runs (with and without micro intervention). The shove-credit is awarded if the intervention changes the outcome relative to the no-intervention run.

  In Round 1, the no-intervention run is the same as in Round 2? We must use the same initial state for both rounds? We can, but note that the initial state for Round 1 and Round 2 is the same. Then the no-intervention run for both rounds is the same (CI=1). Then:
  - Round 1: with blocks -> CI=0 -> change -> macro credit.
  - Round 2: with micro change -> CI=0 -> change -> micro credit.

  So both levels get credit.

  But note: the exclusion worry. How can both be causes if the micro is complete? This is the tension we want.

  Timing Plan (90 min total):
  - 0-10 min: Introduction. Explain the system: tokens, grid, movement rules, collisions, clusters. Show a demo of a few steps. Explain the macro state: clusters and CI. Explain the goals and the idea of shove-credit. Form two teams (Macro and Micro) for the rounds.
  - 10-25 min: Round 1 (Macro intervention). 5 min for Team Macro to decide block placement. 5 min to run the system (with and without blocks). 5 min to record and discuss shove-credit.
  - 25-40 min: Round 2 (Micro intervention). 5 min for Team Micro to decide which tokens to change and to what directions. 5 min to run (with and without intervention). 5 min to record and discuss.
  - 40-60 min: Round 3. 
    - Part A (Reconstruction): 5 min: Run the system with a disturbance (e.g., place a block at step 3 and remove at step 4). Then participants have 5 min to look at the final cluster configuration and guess the disturbance (location and time). 
    - Part B (Two paths): 5 min for each team to plan: Team Macro plans block placements, Team Micro plans token direction changes. Then run both (same initial state) and compare outcomes. (10 min total for Part B, including runs)
  - 60-90 min: Debrief.

  Debrief Details:
  1. What happened? (5 min) Review the rounds and shove-credit: both levels earned credit.
  2. Difference-making: (5 min) Both macro and micro interventions made a difference to CI. So both are difference-makers.
  3. Exclusion worry: (5 min) But if the micro level is causally complete (the tokens' movements fully determine the outcome), then how can the macro level add anything? Yet it did. This is the puzzle.
  4. Compression and prediction: (5 min) In the reconstruction task, the macro state (clusters) encoded information about the disturbance. And in the interventions, the macro description was more efficient for control.
  5. Proportionality: (5 min) Ask: "When we wanted to change the cluster imbalance, was changing a token's direction a proportional cause? Why or why not?" The macro intervention (placing a block) was more proportional because it directly affected clusters. The micro intervention was too specific and might have had side effects (e.g., changing one token might break a cluster but also form a new one elsewhere). But note: sometimes the micro intervention might be more precise.
  6. Reflexive turn: (3 min) "Notice that your interventions (choosing blocks, changing tokens) were themselves macro-level events in the room. The micro story of the tokens doesn't include you. How does that fit?"
  7. Limitations: (2 min) The activity cannot show why these particular patterns (clusters) are the ones that matter in nature. That requires a story of selection (evolution, design, etc.). Also, the macro level here is defined by us, so it doesn't feel like a discovery of a real pattern. In reality, the patterns are there independently.

  What the Activity Cannot Reproduce:
  - The intuition that macro causes are a genuine addition: because the micro rules are transparently designed by us, and the macro level is our construct. In reality, we don't know the micro level, and the macro level feels real because it's useful and we discover it.
  - The selection story: why clusters? In nature, the patterns that are salient are those that have been selected for by evolution or that are robust and projectable. We haven't simulated that.

  The facilitator must put into words: "The activity shows that macro descriptions can be causally relevant and useful, but it leaves open whether they are merely useful fictions or real features of the world. And it doesn't explain why we have the macro patterns we do."

  Where the Activity Might Mislead:
  - It might suggest that macro causes are just as fundamental as micro causes, but in reality, the micro level might be more fundamental. The activity doesn't settle the metaphysics.
  - The system is too small and too designed. In reality, the patterns are more complex and the micro level is not so easily manipulated.

  Despite these limitations, the activity makes the philosophical problems vivid.

  Sample Run for Round 1 (with actual numbers):
  Grid: 6x6. 12 tokens.
  Initial setup (recorded):
