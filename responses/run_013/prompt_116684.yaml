  ### Decision Tree on Tyrannicide in the Thomistic Tradition and Early Modern Reception  
  **Instructions:** Answer each question based on concrete cases. Proceed down the tree until you reach a leaf (position). Unoccupied combinations are noted.  

  #### **Q1: Is the tyrant’s rule a divine punishment that must be endured?**  
  - ***Case:*** A tyrant whose rise followed a national disaster (e.g., famine, invasion), interpreted as God’s judgment for societal sin.  
    - **Yes → Leaf A: Lutheran Non-Resistance**  
      - *Position:* Martin Luther, *On Secular Authority*.  
      - *Awkward commitment:* Must endure genocidal tyranny if interpreted as God’s will, even if resistance could save lives.  
    - **No → Q2**  

  #### **Q2: Is there a legally valid process to remove the tyrant?**  
  - ***Case:*** A constitutional monarch turned tyrant; impeachment exists but is blocked by the tyrant’s allies.  
    - **Yes → Leaf B: Modern Liberal View**  
      - *Position:* Locke, *Second Treatise*; modern constitutionalism.  
      - *Awkward commitment:* Tyrants who sabotage legal processes (e.g., corrupting courts) cannot be removed extra-judicially, regardless of urgency.  
    - **No → Q3**  

  #### **Q3: Is there a recognized public authority (e.g., the people, Pope, Estates) with power to judge/depose the tyrant?**  
  - ***Case:*** A legitimate king turned tyrant; the Estates-General could depose him but is disbanded.  
    - **Yes → Leaf C: Thomistic Public Authority View**  
      - *Position:* Aquinas (e.g., *Summa Theologiae* II-II Q42).  
      - *Awkward commitment:* If the public authority fails to act (e.g., due to corruption), no private person may intervene, even to avert catastrophe.  
    - **No → Q4**  

  #### **Q4: Is the tyrant a usurper (no valid title) rather than a legitimate ruler turned tyrant?**  
  - ***Case:*** A general seizes power by coup vs. an heir who rules tyrannically after coronation.  
    - **Yes → Q5**  
    - **No → Leaf D: Aquinas’s Endurance View**  
      - *Position:* Aquinas (*On Kingship*, *Summa* II-II Q64).  
      - *Awkward commitment:* A legitimate ruler turned tyrant cannot be killed privately, even for the common good—only endured or deposed by higher authority.  

  #### **Q5: Is the tyrant’s injustice directed against the common good (not just individuals)?**  
  - ***Case:*** Usurper loots the treasury, causing famine (common good) vs. personally murders a rival (individual).  
    - **Yes → Q6**  
    - **No → Leaf E: Self-Defense Exception (Thomistic)**  
      - *Position:* Aquinas (*Summa* II-II Q64); widely accepted in tradition.  
      - *Awkward commitment:* A private citizen may kill the tyrant *only* if actively attacked (e.g., tyrant draws a sword), not preemptively.  

  #### **Q6: Would killing the tyrant likely cause greater harm (e.g., civil war)?**  
  - ***Case:*** Killing a usurper could trigger factional violence worse than his rule.  
    - **Yes → Leaf F: Unnamed (Unoccupied)**  
      - *Diagnosis:* Logically coherent (e.g., prudential restraint) but unexplored—no major thinker prioritizes consequentialism over deontology here.  
    - **No → Leaf G: John of Salisbury’s View**  
      - *Position:* John of Salisbury, *Policraticus*.  
      - *Awkward commitment:* Any private citizen may kill a tyrant for the common good, even without formal authorization—risks vigilantism.  

  #### **Q7: (From Q3→Yes) Has the public authority authorized lethal force?**  
  - ***Case:*** The Pope excommunicates a heretical tyrant and calls for his deposition.  
    - **Yes → Leaf H: Jesuit/Marianist View**  
      - *Position:* Juan de Mariana, *De Rege*.  
      - *Awkward commitment:* A private citizen may kill if public authority authorizes it—risks legitimizing assassination if authorities incite mobs.  
    - **No → Leaf C (Thomistic Public Authority View)**  
      - *Position reverts to Leaf C:* Deposition must be non-lethal (e.g., exile).  

  ---

  ### Summary of Leaves (Positions)  
  | Leaf | Position                          | Key Figure/Tradition      | Awkward Commitment                              |  
  |------|-----------------------------------|---------------------------|------------------------------------------------|  
  | A    | Lutheran Non-Resistance           | Martin Luther             | Endure divine punishment even if it enables atrocity. |  
  | B    | Modern Liberal View               | Locke, Constitutionalism  | Legal paralysis if tyrant sabotages removal processes. |  
  | C    | Thomistic Public Authority View   | Aquinas                   | Public inaction = no recourse, even for genocide. |  
  | D    | Aquinas’s Endurance View          | Aquinas                   | Legitimate tyrant immune to private resistance. |  
  | E    | Self-Defense Exception            | Aquinas (shared)          | Killing allowed only during active attack, not preemption. |  
  | F    | Unnamed (Unoccupied)              | —                         | Consequentialist restraint—logical but unexplored. |  
  | G    | John of Salisbury’s View          | John of Salisbury         | Vigilantism risk: any citizen may act for common good. |  
  | H    | Jesuit/Marianist View             | Juan de Mariana           | Publicly authorized assassination risks chaos. |  

  ---

  ### Notes  
  1. **Unseparated Positions:**  
     - **Leaf C (Thomistic Public Authority)** and **Leaf H (Jesuit/Marianist)** both require public authority but diverge on lethality. The tree separates them via Q7 (*authorized lethal force?*).  
     - **Leaf D (Aquinas’s Endurance)** and **Leaf E (Self-Defense)** are distinct: Leaf D forbids killing for common good; Leaf E permits it *only* in immediate self-defense.  

  2. **Unoccupied Combinations:**  
     - **Leaf F (Q6→Yes):** *Unexplored*—no thinker combines anti-consequentialism with a "greater harm" veto.  
     - **Divine punishment + usurper:** *Unoccupied*—logically incoherent (usurpers aren’t divine agents).  
     - **Legal process + divine punishment:** *Unoccupied*—unattractive (undercuts divine sovereignty).  

  3. **Tree Logic:**  
     - The tree prioritizes diagnostic questions in descending order of jurisdictional authority (divine > legal > public > private).  
     - Thomistic distinctions (title, authority, common good, self-defense) structure branching.  
     - All specified positions are included (Lutheran, modern liberal, Jesuit, Salisbury, Aquinas).  

