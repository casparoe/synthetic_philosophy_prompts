  Final Tree with 7 leaves:

  1. Q1: Is the tyrant's rule a divine punishment that must be endured?
     - Yes: Leaf A: Lutheran non-resistance. (Position 4)
          Awkward commitment: Must accept even a tyrant who massacres innocents as God's will.
     - No: Go to Q2.

  2. Q2: Is there a legally established process for removing the tyrant?
     - Yes: Leaf B: Modern liberal view. (Position 5)
          Awkward commitment: A tyrant who disables the legal process (e.g., by packing the courts) cannot be removed extra-legally.
     - No: Go to Q3.

  3. Q3: Has a public authority (e.g., the people, their representatives) declared the ruler a tyrant and authorized resistance?
     - Yes: Leaf C: Jesuit view (Mariana). (Position 3)
          Awkward commitment: A private individual may kill the tyrant even if it risks chaos, as long as the community has declared him a tyrant.
     - No: Go to Q4.

  4. Q4: Is the tyrant's injustice primarily against the common good (not just individuals)?
     - Yes: Go to Q5.
     - No: Go to Q6.

  5. Q5: May a private individual kill to protect the common good?
     - Yes: Leaf D: John of Salisbury's view. (Position 2)
          Awkward commitment: Any private individual may kill a tyrant without any formal process if they believe the common good is threatened.
     - No: Leaf E: Aquinas's view on common good threats. (Position 1)
          Awkward commitment: Even if the common good is severely threatened and no public authority exists, private individuals must not kill the tyrant.

  6. Q6: Is the tyrant posing an immediate threat to an individual's life? (Case: tyrant personally attacking a citizen)
     - Yes: Leaf F: Self-defense exception (part of Aquinas's view).
          Awkward commitment: A private citizen may kill the tyrant only if caught in the act of being personally attacked, but not to prevent future tyranny.
     - No: Leaf G: No killing allowed.
          Awkward commitment: Even if the tyrant will kill you tomorrow, you must wait until he attacks.

  Leaves:
  A: Lutheran non-resistance
  B: Modern liberal view
  C: Jesuit view (Mariana)
  D: John of Salisbury's view
  E: Aquinas's view (common good threats)
  F: Self-defense exception (shared by many, including Aquinas)
  G: No killing allowed

  The tree has 7 leaves.

  Now, what about a usurper? In this tree, a usurper would be handled in the same way as a legitimate ruler turned tyrant after Q2 and Q3. John of Salisbury (Leaf D) allows killing of both, as does the Jesuit view (Leaf C) after declaration. Aquinas (Leaf E) would say for a legitimate ruler turned tyrant with common good threat and no public authority: no private killing. For a usurper, Aquinas in some writings says kill, but in the Summa he is more reserved. We have placed the more reserved view in Leaf E, which is for common good threats generally. So for a usurper with common good threat and no public declaration, it goes to Leaf E if we answer "No" to Q5? But wait, Leaf E is reached only if we answer "No" to Q5. But for John of Salisbury, we answer "Yes" to Q5 and go to Leaf D.

