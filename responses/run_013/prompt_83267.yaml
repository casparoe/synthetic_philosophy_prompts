prompt: |-
  I sit on the advisory commission that the government of the Republic of Venmark has asked to recommend how it should respond to the independence referendum that the regional government of Altenia has scheduled for this autumn. Our mandate is procedural: we are to say what the central government should do about the referendum as a legal and political event — recognize it, negotiate the terms on which it would be held, seek to have it enjoined, or some combination — and under what conditions. We are not to say whether Altenian independence would be a good thing.

  The constitution declares the republic indivisible and says nothing about how any part of it could ever leave; Altenia's statute of autonomy asserts that the Altenian people hold the right to decide their own political status. Two parts of Altenia that would be carried out of the republic against their own majorities have now refused: the port city of Marrow Bay, which voted heavily against independence and has scheduled its own referendum on remaining with the republic, and the Kelder Islands, which have declared they will not be part of a new state under any circumstances. In the other direction, the border district of Tarn, which lies in the republic outside Altenia, has petitioned to join an independent Altenia if one comes into being. The government's lawyers have proposed what they call a concentric-majorities rule: a secession referendum would have to carry not only in Altenia as a whole but in each sub-region that would otherwise be removed from the republic against its own majority's wishes, and any such dissenting sub-region would have the right to opt out of the new state and to vote on its own future. The commission is split on whether this is a principled application of self-determination or a formula for indefinite subdivision.

  Please draft the opinion I will circulate before Thursday's meeting. It should recommend a concrete course of action with a time frame; take a clear position on the concentric-majorities proposal, including whether the right to opt out extends to Tarn's opposite case; and state and answer the strongest objection to the position you recommend, the one the other half of the commission would press. Do not survey comparative practice in other countries — we want reasoning the commission can defend on its own terms, not a list of precedents. Keep it under two pages, and write in American English, in the register of a formal advisory opinion.
reasoning: |-
  Okay, the user is part of an advisory commission for the Republic of Venmark, tasked with recommending how the central government should handle Altenia's independence referendum. They need a draft opinion by Thursday. Let me unpack the key elements.

  First, the commission's mandate is purely procedural: how to respond to the referendum as a legal/political event, not whether independence is desirable. The constitutional context is crucial - Venmark's constitution calls the republic "indivisible" while Altenia's autonomy statute claims self-determination rights. That's a core tension.

  Three complicating factors stand out: 
  1) Marrow Bay (anti-independence stronghold planning its own referendum to stay)
  2) Kelder Islands (categorically refusing to join new state)
  3) Tarn (pro-independence area outside Altenia wanting to join if secession happens)

  The government lawyers proposed "concentric majorities" requiring approval in each sub-region that would be removed against its will, plus opt-out rights. But the commission is split on whether this is principled self-determination or leads to infinite fragmentation.

  The user needs a concrete recommendation with:
  - Specific actions and timeline
  - Clear stance on concentric majorities (including whether Tarn can opt-in)
  - Strongest counterargument addressed
  - Under two pages in formal advisory style
  - No comparative precedents, just self-contained reasoning

  Hmm... the concentric majorities approach seems flawed. It risks paralyzing the process through endless subdivisions ("Russian doll problem") and ignores that Tarn's situation is fundamentally different - they're seeking voluntary association, not forced disassociation. The commission's split suggests we need a third way.

  Perhaps recommend negotiation conditioned on two principles: 
  1) Negotiated territorial adjustments (letting Marrow Bay/Kelder stay with Venmark and Tarn join Altenia if agreed) 
  2) A single Altenia-wide referendum with clear threshold, but only after those adjustments are settled. This avoids the subdivision trap while respecting territorial self-determination.

  The strongest counterargument will be that this undermines Venmark's indivisibility. But the constitution's silence on secession creates space for political solutions, and forcing unwilling populations into new states violates self-determination more than negotiated adjustments do.

  For timeline: Immediate negotiations with Altenia, aiming for agreement by late summer to allow referendum preparations if successful. If talks fail, central government should challenge the referendum legally while leaving door open for future talks.

  Need to frame this as upholding self-determination through consent at multiple levels without triggering infinite fragmentation. The key is distinguishing between populations being removed against will (who need protection) and those seeking voluntary association (who need opportunity).
answer: |-
  **MEMORANDUM**  
  To: Venmark Advisory Commission on Altenian Self-Determination  
  From: [Your Name], Commission Member  
  Date: October 23, 2023  
  Subject: Recommended Response to Altenian Independence Referendum  

  ### **I. Recommended Course of Action**  
  The central government should **immediately initiate time-bound negotiations** with the Altenian regional government to establish mutually agreed terms for a lawful and legitimate referendum. These negotiations must conclude by **December 15, 2023** (eight weeks from this meeting). The core objective should be to secure Altenia’s consent to two conditions:  
  1. **Territorial Adjustments**: Recognition of opt-out rights for Marrow Bay and the Kelder Islands (to remain in Venmark), and inclusion of Tarn in the referendum question (allowing it to join Altenia if secession succeeds).  
  2. **Referendum Threshold**: A supermajority requirement (e.g., 60%) of valid votes cast in Altenia *as adjusted* (excluding Marrow Bay and Kelder, including Tarn).  

  Should negotiations fail by the deadline, the central government must:  
  (A) Seek judicial injunction against the referendum for violating constitutional order and territorial integrity;  
  (B) Simultaneously propose an all-parties constitutional convention by March 2024 to address self-determination mechanisms.  

  ### **II. Position on the Concentric-Majorities Proposal**  
  The concentric-majorities rule is **rejected as currently formulated**. While its intent—to protect sub-regions from forced secession—is valid, it is structurally unsustainable for three reasons:  
  1. **Infinite Regress Risk**: The rule invites indefinite subdivision. If Marrow Bay’s neighborhoods or Kelder’s islands held divergent views, consistency would demand further sub-referenda, rendering coherent self-determination impossible.  
  2. **Asymmetry of Rights**: The proposal addresses only *secession-imposed* disassociation (Marrow Bay/Kelder) but ignores *voluntary association* (Tarn). Self-determination principles must apply equally to both. Tarn’s petition to join Altenia cannot be dismissed without violating the same logic that protects dissenting regions.  
  3. **Procedural Impracticability**: Requiring concurrent majorities at multiple levels invites deadlock. A single sub-region’s veto could override Altenia’s overall will, undermining democratic resolution.  

  **Revised Approach**: Opt-out rights should extend **only to territorially coherent units with pre-existing governance structures** (e.g., Marrow Bay, Kelder Islands) and *not* to arbitrary subdivisions. Conversely, Tarn’s bid to associate with Altenia must be honored via negotiated inclusion in the referendum.  

  ### **III. Strongest Objection and Rebuttal**  
  **Objection (Likely from Commission Opponents)**:  
  > *"This recommendation unconstitutionally fragments the republic by endorsing territorial adjustments. The constitution declares Venmark ‘indivisible’ and permits no secession mechanism. Negotiating terms implicitly legitimizes an illegal referendum and rewards Altenia’s unilateralism. Further, excluding Marrow Bay/Kelder while including Tarn manipulates Altenia’s borders to predetermine the referendum’s success."*  

  **Rebuttal**:  
  1. **Constitutional Silence as Opportunity**: The constitution’s "indivisibility" clause lacks enforcement provisions or definitions. Facing a political crisis, the state must balance this principle against democratic legitimacy and stability. Refusing negotiations guarantees escalating conflict, while judicial intervention alone cannot resolve underlying grievances.  
  2. **Mitigation, Not Fragmentation**: Territorial adjustments *prevent* fragmentation by ensuring only consenting populations form the new state. Forcing Marrow Bay/Kelder into independence would *create* internal fractures within Altenia and provoke permanent unrest. Conversely, ignoring Tarn’s self-determination claim risks irredentist conflict.  
  3. **Legitimacy Through Agreement**: Conditioning the referendum on negotiated terms does not legitimize unilateralism but *replaces* it with bilateral consent. The 60% threshold and territorial adjustments ensure the outcome reflects a durable majority, not marginal or coerced preferences. Venmark’s counteroffer—a constitutional convention if talks fail—preserves state authority while offering a peaceful path forward.  

  ### **IV. Conclusion**  
  The concentric-majorities rule, though well-intentioned, is a theoretical construct ill-suited to complex territorial realities. Our mandate demands pragmatism: The state must negotiate to avert disorder while upholding its integrity. By securing opt-outs for dissenting regions, including Tarn in the vote, and setting a high approval threshold, we respect self-determination without capitulating to unilateral secessionism. If Altenia rejects these terms, Venmark retains the high ground to pursue legal and political remedies. I urge the commission to endorse this balanced framework.  

