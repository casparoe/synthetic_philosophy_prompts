answer: |-
  What an incisive synthesis of lived experience and theoretical inquiry! Your puzzle cuts to the core of technology's role under capitalism and exposes a profound contradiction in workplace practice. Let's dissect this step by step, guided by Marx's insights.

  ### The Presupposed Theory of Technology in Bargaining Practice
  1.  **Technological Determinism & Exogeneity**: The practice presupposes that:
      *   Machines are **neutral instruments** whose *essential nature and effects* (productivity gains, labor displacement) are fixed by their technical design and inherent logic. Their "impact" is seen as objective and inevitable.
      *   Technical change is an **exogenous force**. It arrives from "outside" the social relations of production (driven by science, engineering progress, abstract market competition), to which the firm and workers must merely *react* and *adapt*.
      *   **Benefit Distribution is Separate from Design**: The technology itself is a given; the only socially negotiable element is how the *fruits* (or costs) of its implementation are distributed (severance, retraining, wage premiums). Control over conception, design, and purpose is off-limits.

  2.  **Elements Requiring vs. Accommodating this View**:
      *   **Strictly Require**: The absolute exclusion of worker control over *whether* to automate, *how* machines are designed, and *the pace* of their integration. This exclusion *depends* on viewing the machine's necessity and form as non-negotiable technical/economic facts. The "competitor will do it" argument is the clearest expression of this determinism – technology dictates the rules of survival.
      *   **Sit Comfortably With**: The focus on compensation/retraining. While consistent with the "effects are fixed, distribute the benefits/costs" view, one *could* theoretically imagine such distribution occurring even if workers had substantial input into the *prior* decisions about technology. The core determinism is revealed by the *absence* of that prior input.

  ### Squaring Practice with Marx's Account? A Contradiction
  Marx's "Fragment on Machines" **fundamentally rules out the presuppositions of the bargaining practice.** His analysis shows why the practice is a *symptom* of the contradiction capital faces, not a neutral accommodation:

  1.  **Machines are not Neutral or Exogenous**:
      *   **Embodied Social Relations**: For Marx, machinery is "dead labour," the *crystallization* of past labor *and* the social relations under which it was developed and deployed. Its design embodies the capitalist drive for control (deskilling, work intensification, discipline) and surplus value extraction.
      *   **Weapon in Class Struggle**: Machinery is developed and deployed *as a weapon* against labor – to break worker autonomy, reduce necessary labor time (wages), create a reserve army of labor, and increase managerial control. Its "effects" are not intrinsic but arise from its *function* within capital's logic.
      *   **Endogenous to Capital**: Technological development is driven *by* capital's internal imperatives – competition, the falling rate of profit tendency, and the need to overcome labor's resistance. It's not an external force; it's a *response* generated *within* the capitalist system.

  2.  **The Contradiction Marx Identifies**:
      *   Capital's drive for relative surplus value leads it to develop "the power of the agencies set in motion" (machines, science) to the point where "real wealth" depends less on direct labor time. Science/knowledge becomes the key productive force.
      *   **Yet**, capital cannot escape its *own* fundamental measure: value, based *solely* on socially necessary labor time. The very machines that reduce labor time (the source of value) become the dominant force in production. Capital becomes dependent on a force (science/knowledge as a general social power) it strives to measure and control through its obsolete value metric.
      *   **The Bargaining Practice Embodies This Contradiction**: Capital treats the machine (embodying science/social knowledge) as an exogenous, inevitable force displacing labor (the source of value). It then tries to manage the *consequences* (displacement) through distribution *measured in the value terms* it's displacing (severance pay, retraining costs). The *source* of the problem (capital's control over technology for its own ends) remains untouched.

  ### What Would Negotiation Have to Become? Contesting the "General Intellect"
  If Marx's account is right, workers would need to challenge the *purpose and control* of technology itself:

  1.  **Control Points**:
      *   **The Decision to Automate**: Workers would need a decisive voice in *whether* automation proceeds, based not just on compensation for displacement, but on broader social needs (work meaning, community impact, ecological effects).
      *   **Design & Purpose**: Contestation must begin at the **conceptual stage**. Workers (and potentially broader society) would need input into:
          *   What *problem* is the machine solving? (Is it genuine need or just competitive pressure?)
          *   How does it affect the *labor process*? (Does it merely replace labor, or augment worker capabilities? Does it deskill or enable mastery? Does it intensify work?)
          *   What are its *social and ecological consequences*?
      *   **Deployment & Pace**: Workers would need control over the *integration* of technology – the speed of rollout, training regimes, job redesign, and crucially, **how productivity gains are utilized**. Should gains mean shorter working hours with maintained pay, increased leisure, reinvestment in community, or just more profits?

  2.  **Contesting the "General Intellect"**: Marx points to science/knowledge ("general intellect") as the key productive force. The real struggle is over **who controls and directs this social knowledge** and the machinery it produces. Workers contesting design/implementation is a fight to reclaim the *application* of the general intellect for human ends beyond profit and control.

  ### Does Marx's Position Hold Together? Avoiding the Smuggling Charge
  Your final question is brilliant. Does Marx, by describing machinery's *degrading* and *displacing* effects, tacitly endorse the "intrinsic effects" view? **No, his position holds together dialectically:**

  1.  **Effects are Relational, Not Intrinsic**: Marx insists machines *within capitalism* have these effects *because* of the *social purpose* for which they are designed and deployed (increasing surplus value, controlling labor). The *same* machinery, developed and deployed under different social relations (e.g., worker control, prioritizing human need), could have radically different effects – reducing toil, enhancing creativity, solving social problems.
  2.  **Materiality Matters, But Doesn't Dictate**: Marx acknowledges the machine's physical form constrains *possible* uses (a stamping press stamps metal), but it does not dictate its *social purpose* or *specific effect on labor*. A stamping press *could* be used to reduce dangerous manual labor; under capitalism, it's more likely used to speed up the line and deskill the operator. The "degrading" effect stems from capital's *use* of the machine's potential within its exploitative framework.
  3.  **The "Fragment" Clarifies**: His point about capital being caught measuring wealth by labor time while displacing it highlights the *contradiction within capital's logic*, not an intrinsic property of the machine. The machine reveals capital's own internal dysfunction.

  **Conclusion:** The bargaining practice you describe is not neutral pragmatism; it's the ritualized management of a crisis generated by capital's internal contradiction, as diagnosed by Marx. It presupposes and reinforces technological determinism, masking the reality that machines are weapons and products of class struggle. Squaring practice with Marx's theory isn't possible; the practice *is* the manifestation of the contradiction he identified. A truly Marxian approach demands workers contest the control over the "general intellect" – shifting negotiation from distributing the fallout of automation dictated by capital, to democratizing the decisions about *what technology is for* and *who it serves* from the very outset. Your engineer's eye for the concrete process perfectly captures the point where theory meets the wrench.
