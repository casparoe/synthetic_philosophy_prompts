answer: |-
  Here is a specification of desiderata for a Scanlonian contractualist theory of moral aggregation, structured to address your requirements. I distinguish **non-negotiable core commitments** (stemming from Scanlon’s framework itself) from **debated commitments** (reflecting contested intuitions or theoretical choices), and explicitly note tensions. The central tension—**individual justifiability vs. numerical aggregation**—is treated as a substantive result.

  ---

  ### **I. Core Structural Constraints (Non-Negotiable)**  
  Derived from Scanlon’s *What We Owe to Each Other*:  
  1. **Individual Justification Requirement**  
     - *Constraint*: Justification must be addressed *to each person* individually. A principle is rejected if *anyone* can reasonably object that it imposes an undue burden *on them*.  
     - *Motivation*: The foundational contractualist criterion—wrongness = unjustifiability to individuals under conditions of mutual recognition.  
     - *Status*: Non-negotiable. Violation collapses contractualism into utilitarianism or collectivism.  

  2. **No Interpersonal Trade-offs as Direct Weights**  
     - *Constraint*: The "cost to A" cannot be arithmetically weighed against "benefits to B+C+D" in justification. Aggregation must respect the separateness of persons.  
     - *Motivation*: Scanlon’s "Individualist Restriction"—objections must be grounded in burdens *to the objector*, not others’ gains.  
     - *Status*: Non-negotiable.  

  ---

  ### **II. Cases the Theory Must Get Right**  
  3. **Rejection of Sacrificing One for Many (Transplant Case)**  
     - *Case*: Killing one healthy person to distribute organs to five dying patients.  
     - *Requirement*: The theory must prohibit this.  
     - *Motivation*: The single person can reasonably reject being killed for others’ benefit. Justification cannot override their claim to bodily inviolability.  
     - *Status*: Non-negotiable in Scanlonianism.  

  4. **Permissibility of Many Small Burdens for One Large Benefit (Rescue Case)**  
     - *Case*: Imposing a $10 cost on each of 1,000 people to save one person from death.  
     - *Requirement*: The theory must permit this.  
     - *Motivation*: No single person bears a burden significant enough to reasonably reject the principle (given the triviality of $10).  
     - *Status*: Widely accepted but relies on interpretation of "reasonable rejection" (see §III).  

  5. **Cases Where Numbers Matter (Lifeboat Case)**  
     - *Case*: Saving a larger group (e.g., 100) rather than a smaller group (e.g., 10) when resources only permit one rescue.  
     - *Requirement*: The theory should permit saving the larger group.  
     - *Motivation*: Intuition that numbers *can* matter in life-or-death trade-offs without violating individual claims.  
     - *Status*: Contested (§V).  

  6. **Cases Where Numbers Are Irrelevant (Torture Case)**  
     - *Case*: Torturing one person to prevent non-lethal discomfort (e.g., mild headaches) for any number of others.  
     - *Requirement*: The theory must prohibit this, regardless of the number of beneficiaries.  
     - *Motivation*: Invoking numbers to override a fundamental right (against torture) is a category error—it conflates moral severity with aggregation.  
     - *Status*: Non-negotiable.  

  ---

  ### **III. Distinctions the Theory Must Not Collapse**  
  7. **Concentrated vs. Dispersed Harm**  
     - *Case*: Saving one person from agony vs. sparing a million people a minor headache.  
     - *Requirement*: The theory must *not* equate these. Saving the one from agony takes priority.  
     - *Motivation*: Concentrated harm generates a stronger individual objection; dispersing harm dilutes per-person claims.  
     - *Status*: Non-negotiable (prevents "utility monster" objections).  

  8. **Numbers as Tie-Breakers vs. Weights**  
     - *Case*: Choosing between identical rescue operations (e.g., saving Group A of 10 vs. Group B of 100) vs. weighing one death against many minor harms.  
     - *Requirement*: Numbers may break ties but cannot directly "weigh" against a substantial individual claim.  
     - *Motivation*: Tie-breaking respects individuals (no one is *sacrificed*); weighting treats persons as fungible.  
     - *Status*: Contested (some reject tie-breaking as covert aggregation).  

  9. **Interpersonal vs. Intrapersonal Aggregation**  
     - *Case*: Asking one person to endure 100 minor pains over time (e.g., daily injections) vs. imposing one minor pain on 100 people.  
     - *Requirement*: The theory must treat these differently. Intrapersonal aggregation is permissible; interpersonal is restricted.  
     - *Motivation*: A single person can integrate costs over time; separate persons cannot pool objections.  
     - *Status*: Non-negotiable.  

  10. **Ex Ante Risk vs. Ex Post Outcome**  
      - *Case*: A policy imposing a 1% risk of death on each of 100 people (ex ante) vs. a policy causing one certain death (ex post).  
      - *Requirement*: The theory must distinguish these justifications. Ex ante fairness may permit risks that ex post outcomes forbid.  
      - *Motivation*: Ex ante, no individual faces a "certain death" objection; ex post, the victim has a decisive objection.  
      - *Status*: Settled in principle (Scanlon’s *Risk and Harm*), but application is contested.  

  11. **Shared vs. External Beneficiaries**  
      - *Case*: (a) Workers building a dam share flood protection benefits but bear construction risks; (b) Sacrificing one ethnic group for another group’s benefit.  
      - *Requirement*: (a) May be permissible; (b) Prohibited.  
      - *Motivation*: Shared benefits can justify mutual risk-taking; external beneficiaries create exploitation.  
      - *Status*: Non-negotiable.  

  ---

  ### **IV. The Central Tension: A Substantive Result**  
  **The Aggregation Dilemma**:  
  > *Requirement 5 (numbers matter in lifeboat cases) and Requirement 1 (individual justifiability) are in genuine tension. Satisfying both is unresolved and may be impossible within strict Scanlonianism.*  

  - **Why tension?**  
    - If numbers matter in lifeboat cases, we must explain why *each person in the smaller group* cannot reasonably reject being left to die. But if their claim to life is equal to each in the larger group, why does the larger group’s size override?  
    - Scanlon’s *tie-breaker* strategy (only allow numbers when claims are *equal*) fails if claims are not symmetrical (e.g., differing ages, dependencies).  
    - Alternative strategies (e.g., "complaint model") risk smuggling in interpersonal weighting.  

  - **Result**: This tension is a major fault line in the literature. Some theorists relax individualism (e.g., allow "representative" objections); others deny numbers ever matter.  

  ---

  ### **V. Settled vs. Contested in the Literature**  
  **Settled**:  
  - Sacrificing one for many (Transplant) is forbidden (§3).  
  - Torture cannot be justified by aggregating minor harms (§6).  
  - Ex ante risks and ex post harms differ justificatorily (§10).  
  - Justification must be individual, not collective (§1).  

  **Genuinely Contested**:  
  1. **When do numbers matter?**  
     - *Lifeboat*: Can saving more ever override a claim to equal rescue?  
     - *Tie-breaking*: Is it permissible? Or does it collapse into aggregation?  
  2. **The Scope of "Reasonable Rejection"**:  
     - Can trivial individual burdens (§4) *always* be overridden for large benefits?  
     - Does "reasonableness" allow balancing *within* an individual’s complaint?  
  3. **Risk and Uncertainty**:  
     - How do we justify policies with probabilistic harms?  
  4. **Non-Consequentialist Aggregation**:  
     - Can contractualism accommodate *any* aggregation without consequentialism?  

  ---

  ### **Conclusion**  
  An adequate Scanlonian theory must satisfy all **non-negotiable** constraints (§I, §II:3,6, §III:7,9–11) while navigating **contested** desiderata (§II:4–5, §III:8) under the **aggregation dilemma**. The core tension—individual veto versus intuitive cases where numbers matter—remains unresolved. No consensus exists; theories divide on whether to **strictly prohibit** all interpersonal aggregation (e.g., Reibetanz, Kumar) or **modify Scanlon** to permit limited aggregation (e.g., Kamm, Frick). What is settled is that *if* aggregation is permitted, it must not violate individual justifiability or collapse critical distinctions.
