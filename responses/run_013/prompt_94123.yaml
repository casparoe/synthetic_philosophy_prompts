prompt: |-
  ok so context first: I've been reading LessWrong / SSC / rationalist tumblr for like a decade now, and over the years I've built up this whole apparatus of commitment devices — beeminder goals, a stake contract with a friend, site blockers, the whole tie-myself-to-the-mast routine. This was all downstream of reading way too much about hyperbolic discounting and present bias and the idea that my future self is basically a different guy who will defect on every plan present-me makes.

  Anyway I mentioned this setup in a group chat and a friend replied, pretty smugly, "the road to hell is paved with good intentions," like that was checkmate. And I couldn't articulate why it felt like a non-sequitur, but it did. I want to actually pin down what that sentence is even claiming before I decide whether it's a good objection.

  I'd like you to act as a philosopher of action who also knows decision theory cold — someone who's thought hard about intention, resolution, weakness of will, and the difference between intending and binding. Please think carefully before answering, and start with a short brainstorm of the possible readings before you commit to the menu.

  Then give me a menu: the distinct precise claims that one sentence could actually be making, roughly from the trivial to the radical. For each one, tell me (a) whether it's a platitude, a substantive and defensible claim, or just false/confused, (b) what it would have to assume about intentions, action, and consequences, and (c) whether that reading would actually support using it to dunk on my precommitment system — or whether it actually cuts the other way, i.e. supports the system. I have a suspicion that most of the readings are on my side and my friend just grabbed a proverb that sounds wise, but tell me if one of them is a real hit.

  Couple of things I specifically want separated out, because I keep conflating them:
  - the reading where the point is just "intending isn't doing" (feels like it can't be what he meant, it's too weak)
  - the reading where good intentions somehow *cause* bad outcomes, or where the road is literally *built out of* good intentions
  - the reading where the intention itself discharges the urge to act, so having the intention substitutes for doing the thing
  - and the sneaky one where the proverb gets turned on the apparatus itself: my elaborate system is *also* just intentions unless it actually binds me, so maybe he's saying a system of intentions is still just intentions

  For each reading, say which one the person trotting out the proverb in an argument is *probably* invoking, since I figure the reading that matters is whatever one the argument needed. No citations needed, I just want the disambiguation with verdicts.
