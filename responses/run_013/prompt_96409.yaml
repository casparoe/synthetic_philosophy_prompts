prompt: |-
  I write about science and ideas for a general readership, and I have spent the better part of three years reporting on the moral-psychology literature — the laboratories that try to explain why we hold the moral beliefs we hold. I have come out the other side with a set of verdicts that I cannot get to add up. Some of the explanations on offer strike me as genuinely undermining the beliefs they explain; others leave those beliefs exactly where they were, even when the explanation is of much the same kind. I would like you to work out what principle, if any, my verdicts express, and then to tell me which of the verdicts that principle forces me to give up.

  Two stipulations before the cases. First, take each explanation at face value as a hypothesis and assume, for the sake of the argument, that it is true. I am not asking whether the science is any good, and nothing here turns on a particular paper or researcher; these are simply the standard shapes such explanations take. Second, I am not asking whether moral belief in general is undermined by evolution. I am asking what follows for one belief once you accept one explanation of it.

  1. **Kin incest.** My conviction that sex between close relatives is seriously wrong is said to be downstream of a disgust response selected because inbreeding is costly. Verdict: not undermined. The disgust may have been the messenger; the substance of the objection — the risk carried by any child — is available to me without it.

  2. **Parental partiality.** That I owe more to my own children than to other people's is said to be explained by parental investment and kin selection. Verdict: not undermined. I am the one who can act for them, and I took the job on.

  3. **Gratuitous cruelty.** That it is wrong to hurt a small child for amusement is said to be a spillover of adaptations for protecting one's own vulnerable young. Verdict: not undermined. I would sooner abandon this whole enquiry than give up that verdict.

  4. **Defilement.** My sense that certain acts are unclean — that some bodies, foods and mixtures are defiling quite apart from any harm they do — is said to be explained by pathogen-avoidance and contamination heuristics. Verdict: undermined. I now treat the revulsion as a fact about me rather than about the world.

  5. **Jealousy.** That a partner's attention to others is a wrong done to me, of a kind that licenses surveillance and reproach, is said to be explained by adaptations for securing paternity. Verdict: undermined. Every warrant I reach for turns out to be the feeling restated.

  6. **The corpse, two ways.** (a) A person has left their body to be butchered and eaten by their friends at a dinner; no one is harmed, and the wish was freely expressed. My revulsion is said to be the same contamination heuristic as in (4). Verdict: undermined — it is a strong feeling and nothing more. (b) The same person has instead left their body to be dressed and posed in the window of a clothes shop. Identical explanation, identical stipulations. Verdict: not undermined — and I cannot say what the difference is, except that (b) seems to be about a person and (a) only about meat. I record the asymmetry without defending it.

  7. **Compatriots.** That I owe more to my fellow citizens than to foreigners is said to be explained by parochial altruism — the same machinery as in (2). Verdict: undermined.

  8. **Desert.** That the poor are largely the authors of their own misfortune is said to be explained by adaptations that make us eager to blame the unlucky, so as to keep the world feeling just. Verdict: undermined. Note that I take this explanation to be plainly partial: it accounts for why I am motivated to believe the proposition, not for whether the proposition is true. I give the verdict anyway.

  The test I keep reaching for is this: a belief is undermined by its genealogy just when the genealogy leaves it with no warrant that does not itself depend on the belief. But that test seems to debunk (3) along with everything else, and I will not accept that. Nor does it tell me why (1) and (4) come apart: in both I have a feeling and a story about the feeling. I suspect the real work is being done by something else — perhaps by whether the explanation is aimed at the content of the belief or only at the strength of the feeling, or by whether the belief is answerable to something outside us (harm, consent, what a person is owed) rather than to a norm we merely have. If that is the distinction, tell me whether it can be stated without circularity — that is, without defining 'answerable to something outside us' as 'whatever beliefs I want to keep'.

  I will accept a principle that overturns two or three of my verdicts; I will not accept one that overturns all of them. If every belief on the list turns out to be undermined, I will conclude that the test is wrong rather than that morality is.

  There is one case on which I have no verdict and would like yours. My belief that the suffering of an animal counts for something is said by some to be a spillover of adaptations for caring for our own young, and by others not to be explained that way at all. Say what my principle predicts for it. Say also what it predicts for one further case of your own choosing that I have not mentioned.

  Please give me: the principle, stated precisely enough that I could apply it myself; the case that motivates each clause; the verdicts it delivers for the two new cases; and an honest statement of which of my verdicts it cannot accommodate and what it would cost me to give them up. End with a single final line of the form \answer{...} containing, in no more than forty words, the principle in one sentence, followed by a semicolon and the numbers of whichever of my verdicts it forces me to abandon, or the word none.
reasoning: |-
  Okay, I'm tackling this user's complex query about moral psychology and genealogical explanations. The user presents eight cases where they've judged whether evolutionary explanations undermine moral beliefs, plus one unresolved case about animal suffering. Their core challenge is identifying a principle that consistently explains their pattern of verdicts without circularity.

  First I need to analyze their existing judgments. They maintain beliefs like kin incest prohibitions and parental partiality despite evolutionary explanations, but reject defilement and jealousy-based morality. The corpse case shows an intriguing asymmetry - they accept revulsion against commercial body use but not against consensual consumption. Their proposed test (genealogy undermining belief when no independent warrant exists) fails their own intuitions, especially regarding gratuitous cruelty.

  Key distinctions emerge:
  - Cases 1-3 reference external realities (harm, responsibility, intrinsic wrongness)
  - Cases 4-8 concern internal states (disgust, jealousy, tribalism) or empirically falsifiable claims (desert)
  The corpse asymmetry suggests personhood as a dividing line - the clothed corpse retains moral significance as representing a person, while butchered meat doesn't.

  I develop the "answerability criterion": a belief is undermined when its genealogy shows it tracking only contingent psychological mechanisms rather than mind-independent normative facts. This preserves their non-undermined cases (1-3, 6b) as referencing external truths, while explaining why defilement, jealousy, etc. are undermined. 

  For animal suffering, the principle suggests non-undermining since suffering's wrongness may be mind-independent. A new case about property rights illustrates how culturally variable norms would be undermined. The principle requires abandoning verdicts 7 (compatriots) and 8 (desert) since these lack external anchors, costing them intellectual consistency but protecting core moral intuitions.

  The final principle formulation balances precision with their boundary conditions, explicitly excluding circularity while accommodating their refusal to abandon the cruelty prohibition. The answer line captures this concisely.
answer: |-
  After analyzing your verdicts, I propose the following principle: **A moral belief is undermined by its genealogy when the explanation reveals it as tracking *only* contingent psychological mechanisms (e.g., evolved feelings or heuristics) without being justifiably responsive to mind-independent normative facts (e.g., harm, consent, agency, or duties arising from specific roles/relationships), even if such facts *could* theoretically justify it.**

  ### The Principle Explained & Motivated Cases:
  1.  **"Responsive to mind-independent normative facts":** Motivated by cases you **do not** undermine (1-3, 6b). Your verdicts preserve beliefs where you identify an external anchor: *harm to potential children* (1), *duties of care arising from the parental role* (2), *the intrinsic wrongness of inflicting suffering for pleasure* (3), and *respect owed to persons/their remains* (6b). The explanation doesn't preclude justifying the belief *by appealing to these facts*, even if the feeling originated evolutionarily.
  2.  **"Tracking *only* contingent psychological mechanisms":** Motivated by cases you **do** undermine (4, 5, 6a, 7, 8). Here, the explanation reveals the belief as *exclusively* the output of mechanisms (disgust heuristics, jealousy adaptations, parochialism, just-world bias) shaped by evolutionary pressures unrelated to normative truth. No appeal to external facts (like harm or consent in 4/6a, or genuine obligation in 5/7, or empirical desert in 8) survives the explanation as a *justification independent of the feeling itself*. The feeling *is* the purported warrant.

  ### Why Your Initial Test Failed & Circularity Avoided:
  *   Your proposed test ("no warrant that does not itself depend on the belief") *would* undermine everything, including (3), because the feeling often *is* the initial warrant. The key distinction is *not* whether the belief is *about* external facts (all are) or *only* about feeling-strength, but whether the *explanation reveals the belief as being held* ***because*** *it tracks an external fact* **or** ***only because*** *it satisfies a contingent psychological mechanism*. This avoids circularity by defining "mind-independent normative facts" non-arbitrarily as factors like *harm, consent, intentional agency, or duties arising from specific, identifiable relationships/roles* – concepts central to moral reasoning itself, not defined by which beliefs you wish to keep.

  ### Application to New Cases:
  1.  **Animal Suffering:** Your principle predicts **NOT undermined**. The explanation (spillover from caring adaptations) reveals a contingent *origin* for the *feeling*, but the belief ("suffering counts for something") is potentially responsive to the mind-independent normative fact of *suffering itself* as a disvalue. The feeling may alert you to the suffering; the suffering provides the potential justification. This parallels (1) and (3).
  2.  **New Case - Property Taboo:** Belief: "It is inherently wrong to use someone else's cherished personal item (e.g., a wedding ring) without permission, even if returned undamaged and they never know." Explanation: Evolved contamination heuristic/spark of sacredness applied to objects, promoting social cohesion and respect for resources. Principle predicts **UNDERMINED**. The explanation reveals the belief as tracking *only* a contingent psychological mechanism (contamination/sacredness heuristic applied arbitrarily). The core normative appeal ("inherent wrongness") lacks an anchor in external facts like harm or consent violation (since there is no damage or awareness), mirroring (4).

  ### Verdicts Your Principle *Cannot* Accommodate & Cost:
  *   **Cannot Accommodate:** Verdicts 7 (Compatriots) and 8 (Desert).
  *   **Reason:** For (7), the explanation (parochial altruism) reveals the belief as tracking *only* contingent tribal psychology. Appeals to "shared projects" or "mutual obligation" within a nation state are themselves likely cultural extensions of the same parochial mechanism, not a genuinely mind-independent normative fact like the specific duty arising from the parent-child *relationship* in (2). For (8), the explanation (just-world bias) reveals the belief as tracking *only* a contingent psychological need to see the world as controllable/fair, actively *distorting* assessment of the mind-independent facts about causation and responsibility. Your own note highlights this partiality.
  *   **Cost of Giving Them Up:** Accepting the principle forces you to conclude that beliefs favoring compatriots or blaming the poor for their misfortune lack rational warrant *if* solely explained by parochialism or just-world bias. This costs intellectual consistency with your principle and the other verdicts. It does *not* force you to abandon the *actions* (helping compatriots, promoting responsibility), only the specific belief that these actions are morally *obligatory* or that the poor *deserve* their fate *based solely on the feelings generated by these mechanisms*.

  ### Final Answer

  \answer{A moral belief is undermined when its genealogy reveals it as tracking only contingent psychological mechanisms without being justifiably responsive to mind-independent normative facts (harm, consent, agency, role-based duties); 7, 8}
