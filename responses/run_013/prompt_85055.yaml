  Finally, the "verbal rescue" jibe. The user thinks it's unfair, and rightly so. Disjunctivism isn’t just redefining terms; it’s a substantive metaphysical stance. Addressing this requires explaining how disjunctivists ground their view in the nature of perception itself.

