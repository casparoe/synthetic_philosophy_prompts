  Next, the textbook claims disjunctivists deny that hallucinating and perceiving subjects share the same mental state. Correct, but the textbook says they "soften" this by conceding shared content with different causes. Here’s a potential issue: disjunctivists like Martin reject any common factor, including content. The user suspects this point is "sneaky," which aligns with Martin's view. I need to highlight that the textbook might be conflating different disjunctivist strains.

