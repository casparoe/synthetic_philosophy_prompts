prompt: |-
  I've got a tiny podcast that's mostly me and two friends arguing about games, and next week I somehow landed a guest: a game theorist who's spent years defending program equilibrium as the real explanation of cooperation in one-shot Prisoner's Dilemmas. This got personal because my roommate and I have a dumb ongoing fight about whether it's ever rational to cooperate in a one-shot PD, so I set up a little Discord bot tournament to settle it. The rule is each bot gets a few hundred milliseconds to read the other bot's source code before choosing. The winner was a two-line program that cooperates if the opponent's code is identical to its own and defects otherwise, and the guest says that's a genuine equilibrium, not a trick. I want to interview him without letting him just recite the standard story. Draft eight to ten questions, and for each one a follow-up keyed to the answer he's most likely to give. I need at least one question each on: (a) whether the whole thing assumes away the hard part by letting bots read each other's source perfectly, and what happens if they only get a hash, a noisy summary, or a read that costs time; (b) how program equilibrium relates to Nash equilibrium in a one-shot game -- refinement, different solution concept, or just Nash on a bigger strategy space?; (c) whether the self-referential proof-based fixed-point machinery (the Löbian/modal stuff) is essential or just one construction; (d) what bounded computation and the halting problem do to the story when the code-reading step has a deadline; (e) whether the account can handle agents who can't read code but can observe a long history of play; (f) what it says about threats and punishment, including whether a bot can commit to punishing by writing code that's costly to itself; and (g) whether there's any tournament or empirical result that would make him abandon the view. Also throw in a question about whether program equilibrium is meant as a descriptive theory of how cooperation actually happens or a normative ideal, because I definately can't tell from his abstracts. Keep them concrete and don't let him off with just defining program equilibrium -- I want him sweating a bit. No citations or reading lists needed, obviously.
