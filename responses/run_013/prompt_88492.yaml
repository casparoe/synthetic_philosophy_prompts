  Right, so this actually happened to me last week and I'm still annoyed about it. My mate had his birthday thing and he hands me and his brother an envelope each, says one of them has twice as much cash in it as the other, and we can keep ours or swap. So we both start doing the "well whatever X is in mine, theres a 50/50 chance the other one is 2X and a 50/50 it's X/2, so swapping is worth 1.25X on average, I should swap" routine. And then we notice his brother is running the exact same maths from his side and also concluding he should swap, so we just sit there passing the envelopes back and forth until the cake's gone. I want to make a joke out of this for my friends who are into this kind of stuff. Write me a joke about the two-envelope paradox, and it has to be a joke that actually knows the paradox — the punchline should turn on the real mechanics, not on "haha philosophers". I mean the always-switch argument, the symmetry that leaves both of us equally sure we should swap, and the bit where the 1.25X move quietly assumes you can average over a flat/improper prior on the amounts when you cant. Bonus if it works in the fact that the whole thing collapses the second you open your envelope and see an actual number. Short, and it should land for someone who already knows this stuff.
