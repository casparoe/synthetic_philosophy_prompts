answer: |-
  Here’s a tight, insider-focused joke:

  **Setup:**  
  My mate’s brother and I spent his birthday swapping envelopes endlessly.  
  "Why are you two still trading?" asks the birthday guy.  

  **Punchline:**  
  "Because we both calculated that swapping has an expected value of 1.25X!" I say.  
  He sighs: "Then open one. See the $100? Now the other’s either $50 or $200—not ‘X and 2X over infinity.’"  
  *We stared at the envelopes. Suddenly, cake seemed smarter than math.*

  ### Why it works:
  - **Core mechanics**: Explicitly names the flawed "1.25X" calculation.  
  - **Symmetry**: Shows both players identically trapped by the logic.  
  - **Prior collapse**: Punchline hinges on how seeing a fixed value ($100) invalidates the improper uniform prior.  
  - **Insider terms**: Uses "expected value," implies the infinity problem ("X and 2X over infinity").  
  - **Short & relatable**: Mirrors the user’s real experience (endless swapping, cake gone).  

  **Bonus**: The phrase *"cake seemed smarter than math"* nods to the paradox’s futility—and the birthday context.
