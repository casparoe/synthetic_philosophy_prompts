prompt: |-
  I host a small philosophy podcast, and I recently went through a lengthy asylum process in a country that was not my own. That experience has made me want to revisit Michael Dummett's late arguments about immigration with a new urgency. Next week's guest is a philosopher who has been defending a broadly Dummettian position: there is a standing presumption in favor of admitting immigrants; the only legitimate ground for restricting immigration is the receiving country's capacity to absorb newcomers, and even that assessment must be conducted without racial or cultural bias; refugees have a stronger claim than economic migrants; and much opposition to immigration is rooted in racism. I would like you to draft eight to ten interview questions that go beyond having the guest restate this position. Please include at least one question each on the following: (1) how the presumption in favor of admission is supposed to work and where the burden of proof lies; (2) how a capacity limit can be specified and applied without smuggling in the very racial or cultural biases Dummett condemned; (3) how the guest distinguishes refugees from economic migrants, and whether that distinction can bear the moral weight Dummett places on it; (4) whether the position ultimately collapses into open borders, and if not, what principled stopping point it offers; and (5) whether Dummett's broader anti-realist philosophy, which denies that truth can outrun our capacity to recognize it, has any bearing on the objectivity of moral claims about borders. For each question, please provide a follow-up that is keyed to the answer the guest is most likely to give, so that the interview can press the view rather than merely display it. The questions should be specific enough to avoid generic prompts about justice or sovereignty, and they should not ask for reading lists, citations, or bibliographies.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and wants to craft interview questions about Michael Dummett's immigration arguments. They've personally gone through an asylum process, which adds urgency to revisiting Dummett. Their guest defends a Dummettian position: presumption for admission, capacity-based restrictions without bias, refugees over economic migrants, and calling out racism in opposition.  

  The user wants 8-10 questions that go beyond restating basics. They specifically ask for five mandatory angles: (1) how the presumption/burden of proof works, (2) defining capacity limits without bias, (3) refugee vs. economic migrant distinction, (4) whether this leads to open borders, and (5) links to Dummett's anti-realism. Each needs a follow-up to press the guest.  

  Hmm, the stakes feel high here. The user's asylum experience means this isn't abstract—they’ve lived the tension between theory and bureaucratic reality. Their questions should force the guest to confront practical holes in Dummett’s framework. The follow-ups must anticipate dodges.  

  For the presumption question (1), I’ll focus on procedural teeth: How does the burden shift actually constrain states? Follow-up should challenge if this is just theater when states control evidence.  

  Capacity limits (2) need concrete metrics. Dummett rejects cultural bias, but what’s left? Infrastructure? Follow-up should press whether "neutral" metrics (like housing shortages) might hide structural racism.  

  Refugee distinction (3) is ethically messy. Does persecution trump poverty? Follow-up should attack the hierarchy—why is fleeing violence "more urgent" than starvation when both kill?  

  The open borders trap (4) is inevitable. If capacity is the only limit, what principle stops expansion? Follow-up must demand a non-arbitrary threshold.  

  Linking to anti-realism (5) is spicy. If moral truth depends on recognition, does majority opinion on borders become self-validating? Follow-up should tie this to real-world racism.  

  I’ll add three wildcards: one on colonial legacies (since capacity limits ignore historical harm), one on enforcement cruelty (echoing user’s asylum trauma), and one on democratic anxiety (why backlash isn’t just "racism"). Follow-ups will target complacency.  

  Tone check: Questions must be rigorous but not academic—no jargon. The podcast is small, so intimacy matters. User’s lived experience should subtly shape phrasing ("as you know, from the inside...").
answer: |-
  Here are 10 interview questions designed to rigorously engage the Dummettian position, incorporating your requirements and focusing on pressure points. Each includes a likely-targeted follow-up:

  1.  **On Presumption & Burden of Proof:** "Dummett argues for a 'standing presumption' in favor of admitting immigrants. Could you clarify how this presumption functions *procedurally* in a real-world immigration system? Specifically, where exactly does the burden of proof lie when a state considers refusing entry, and what *kind* of evidence must it present to overcome that presumption?"
      *   *Likely Follow-up (if they emphasize state's duty to justify refusal):* "But if the state controls the data, the assessment criteria, and the adjudication process for proving it lacks 'capacity,' doesn't this risk rendering the presumption merely formal or symbolic, easily overridden by bureaucratic discretion? How do we prevent the burden from being effectively placed back on the *immigrant* to prove the state *does* have capacity?"

  2.  **On Capacity Limits & Bias:** "Dummett insists capacity limits must be assessed without racial or cultural bias. Setting aside blatant bigotry, what are the *operationalizable, non-circular metrics* you propose for determining 'absorption capacity'? How do we measure, for instance, 'strains on social services' or 'housing shortages' in a way that doesn't inherently reflect historical underinvestment in communities likely to receive newcomers or embed assumptions about cultural homogeneity required for 'integration'?"
      *   *Likely Follow-up (if they suggest economic/demographic metrics):* "Aren't metrics like unemployment rates, housing vacancy rates, or even per-capita GDP themselves often products of historical exclusion or systemic racism? If we use them as the baseline for calculating 'capacity,' aren't we effectively saying communities disadvantaged by past injustice have *less* obligation to admit newcomers now? How is this not bias?"

  3.  **On Refugee vs. Economic Migrant Distinction:** "Dummett assigns refugees a 'stronger claim' than economic migrants. Could you articulate the precise *moral principle* grounding this hierarchy? Is it solely about immediacy of harm (persecution vs. poverty), the *source* of the harm (state vs. structural forces), or something else? And crucially, in a world where extreme poverty is often a direct consequence of global political/economic structures the receiving state may uphold, does this distinction remain as sharp or morally decisive as Dummett implies?"
      *   *Likely Follow-up (if they emphasize persecution/immediacy):* "Consider someone fleeing life-threatening poverty caused by climate change exacerbated by the policies of wealthy nations, or by trade policies that destroyed local livelihoods. If the harm is equally severe and the causal chain links back to the potential receiving state, wouldn't classifying them solely as an 'economic migrant' under Dummett's framework significantly understate their moral claim, potentially unjustly?"

  4.  **On Collapse into Open Borders:** "If the *only* legitimate restriction is based on objectively verifiable 'capacity' constraints, and presumptive admission is the default, isn't this position functionally equivalent to open borders, just with a temporary, pragmatic caveat? If not, what is the *principled stopping point*? Is there a point where a state, having met some capacity threshold, could legitimately refuse admission for reasons *other* than immediate absorption limits – say, to preserve a distinct political project or cultural practice – without violating Dummett's core principles?"
      *   *Likely Follow-up (if they deny collapse & cite evolving capacity):* "But if 'capacity' is dynamic and potentially expandable through political will and resource allocation (building more housing, expanding services), doesn't the obligation to admit become effectively limitless over time? What *principled* argument, under Dummett's view, allows a state to *choose not* to expand its capacity to absorb, thereby justifying continued restrictions?"

  5.  **On Anti-Realism & Moral Objectivity:** "Dummett's broader anti-realism holds that truth cannot outstrip our capacity to recognize it. How might this view impact the *objectivity* of the moral claims central to his immigration stance? For instance, if a society widely *fails to recognize* the moral presumption in favor of admission (perhaps influenced by racism), does anti-realism imply that presumption lacks full 'truth' for that society? Or does this moral truth hold independently of societal recognition?"
      *   *Likely Follow-up (if they try to separate ethics from metaphysics):* "Even if we grant moral objectivity, doesn't Dummett's anti-realism about meaning and verification potentially undermine the *epistemic accessibility* of the 'objective capacity limits' you rely on? If we can't verify truths beyond our current methods, how can we ever be sure we've *correctly* identified a genuine, non-biased capacity constraint justifying restriction?"

  6.  **On Historical Responsibility:** "Dummett focuses on the receiving state's present capacity. How does this framework address the argument that many potential receiving states bear significant *historical responsibility* (through colonialism, resource extraction, climate change contributions) for creating the conditions driving migration? Does this responsibility strengthen the moral claim of migrants beyond the baseline presumption, or create different obligations not fully captured by the 'capacity' model?"
      *   *Likely Follow-up (if they acknowledge responsibility but stick to capacity):* "If historical injustice creates a specific *debt* owed to populations from formerly colonized or exploited regions, doesn't restricting their entry based on *current* capacity constraints – constraints potentially built on wealth derived from that injustice – amount to compounding the original wrong? How can capacity limits be fairly applied in this context?"

  7.  **On Enforcement & Lived Experience:** "Given the strong presumption for admission, what does a Dummettian view imply about the *methods* of immigration enforcement? Does the presumption render practices like detention centers, family separation, or aggressive deportation of those who circumvent restrictions inherently illegitimate, even if the underlying capacity limit claim were valid?"
      *   *Likely Follow-up (if they condemn harsh enforcement):* "If harsh enforcement aimed at deterring those who bypass the system is illegitimate, and the presumption is strong, doesn't this create a practical imperative for *minimal* barriers to entry? How does this square with maintaining any meaningful capacity-based restriction?"

  8.  **On Democratic Anxiety:** "Critics argue that rapid demographic change, even if 'absorbable' in terms of services, can cause social friction and undermine democratic solidarity rooted in shared identity or history. Dummett dismisses much opposition as racism, but is there a *legitimate*, non-racist concern about the pace or scale of change threatening social cohesion that his framework fails to acknowledge as a potential constraint?"
      *   *Likely Follow-up (if they dismiss cohesion concerns as usually racist/pretextual):* "Even if often misused, doesn't the *feeling* of lost agency or cultural displacement among existing citizens – however misguided we might find it – pose a real *political* challenge? How should a state committed to Dummett's principles navigate this democratic tension without capitulating to exclusionary sentiments or abandoning its obligations?"

  9.  **On the Limits of "Racism" as Explanation:** "While Dummett rightly condemns racism, does attributing 'much' opposition to immigration *primarily* to racism risk oversimplifying the complex anxieties (economic precarity, cultural change, fear of lost status) that fuel restrictionist politics? Does relying heavily on this diagnosis potentially hinder the persuasive power of the moral argument for those not self-identifying as racist?"
      *   *Likely Follow-up (if they double down on racism's centrality):* "Even granting racism's pervasive influence, if anxieties about welfare competition or cultural change can be empirically addressed (e.g., through robust integration support, equitable resource distribution), shouldn't the Dummettian position prioritize *disproving the factual premises* of these anxieties within the capacity framework, rather than primarily attributing them to moral failing?"

  10. **On the Role of the Philosopher:** "Given your defense of Dummett and your own philosophical work on migration, how do you see the role of the philosopher in this intensely political debate? Is it primarily to articulate clear moral principles (like the presumption), to design feasible just institutions, or to challenge the very conceptual frameworks (like absolute sovereignty) that underpin restrictionist policies?"
      *   *Likely Follow-up (if they emphasize articulating principles):* "How do you respond to the critique that focusing on ideal principles like the presumption, while crucial, can feel disconnected from the messy political realities and trade-offs faced by policymakers? Should philosophers also engage more directly with the 'non-ideal' theory of how to move from here to there?"

  These questions aim to push the guest beyond restatement, forcing them to grapple with the practical implementation, potential contradictions, foundational assumptions, and broader implications of the Dummettian position, informed by the urgency of your own experience. Good luck with the interview!
