prompt: |-
  I do interpretation editing for a small museum partnership — curators and community groups send me draft labels and audio-guide scripts, I knock them into shape, then they go to the head of collections and the panel for sign-off. It's about forty bits of text a month, each one 30–60 words, and I get roughly twenty minutes a piece, so I can reframe a sentence or send it back, but I can't do new research or drag the curator off for a seminar.

  The trouble is our funders' bid document has a line in it about every label "making the connection to today's visitor", which the curators definately read as: end on how far we've come. So I keep getting drafts like — and these are invented, but only just — "By 1900 the mill was finally forced to shorten children's hours: a small step on the road to the workplace protections we take for granted today." Or one about a local surgeon who pushed a treatment that was later abandoned: "a man ahead of his time, whose warnings went unheeded." Or a canal label that can't resist pointing out that the railway won and the canal men just couldn't see it coming.

  I know this is the whig history thing. The line I half-remember from Butterfield is that it "studies the past with reference to the present", but every time I try to turn that into a rule for the curators I either end up banning any mention of the present at all — which the funders hate and which honestly feels wrong, because some of these stories really are about people who deliberately set out to change things and did — or I wave through stuff I know is sloppy. I've also been told the real complaint is about "abridgement", and about pretending outcomes were inevitable, and that Butterfield wasn't against historians caring about the present as such. I can't seperate those things, and I don't know what's left in practice.

  So: you're a philosopher of history who actually thinks about how present-mindedness distorts what gets written, and I want a procedure, not an essay. Think it through carefully. Start by pulling apart, for yourself, the different things that go wrong when the past is told as a run-up to now — inevitabilism, picking only the winners, sitting in judgement on dead people by our standards, making them sound like us, and whatever else belongs on that list — because I suspect my rules keep misfiring because I'm lumping several distinct failings together under one word. Then give me a checklist I can run on a single draft in five minutes: the questions in order, what counts as a sufficient answer to each, the tests I can actually apply to a sentence rather than to a whole philosophy, where the procedure stops and hands the decision back to the curator or the panel because it's a judgement call and not a rule, and which of the steps are really just my taste dressed up as method. Be honest about where it will misfire and what it can't do.

  Then run it on two drafts. (a) The mill label above — my instinct is that the "road to today" line is fine here, because the factory acts were a causal chain the campaigners themselves intended and pursued, but tell me if I'm kidding myself. (b) The surgeon — I want "ahead of his time" struck, but I can't say why that's different from (a), and I suspect the procedure will end up flagging something I'm rather proud of: I've got a label about a local woman who campaigned for a change that only became law sixty years after she died.

  No reading lists or citations, please — if a move has a name in the literature, name it in a clause, but I want the procedure, not the bibliography. Under 800 words, and lead with the procedure itself as a numbered list, with the two worked examples after it in a few lines each.
reasoning: |-
  Okay, let me tackle this interpretation editing challenge systematically. The user needs concrete tools to evaluate historical labels efficiently, moving beyond theoretical debates about Whig history. 

  First, I recognize the core tension: funders demand "connection to today" while curators default to progress narratives. The user's frustration with lumping together multiple historical distortions resonates - inevitabilism, presentism, anachronism etc. need separating. 

  For the procedure, I consider building from Butterfield's critique but operationalizing it. Key failure modes to isolate:
  - Inevitability framing (suggesting outcomes were predetermined)
  - Teleology (implying past events existed to reach our present)
  - Anachronistic judgment (applying modern standards without context)
  - Selective inclusion (only showing "winners" of history)
  - False continuity (oversimplifying causal chains)

  The checklist must be actionable within 20 minutes per label. Each question should target one failure mode with clear pass/fail criteria. For subjectivity, I'll identify where to flag rather than decide - e.g., "does this imply historical actors foresaw outcomes?" requires curator input if contested.

  For the mill example: The "road to today" phrasing risks teleology but gets a pass because campaigners explicitly aimed for lasting reform. The causal chain is documentable. 

  For the surgeon: "Ahead of his time" fails on anachronism - it imposes our retrospective view rather than contemporary context. Better to show why peers rejected his ideas then.

  The woman reformer case reveals nuance: Celebrating intentional change is valid when the causal intent is evidenced, even if outcomes were delayed. The key is avoiding back-projected inevitability. 

  This approach should help the user distinguish between legitimate present connections and distorted narratives - while meeting practical constraints.
answer: |-
  Here’s a procedural checklist for identifying Whiggish distortions, followed by applied examples. The core failure modes are separated to avoid overblocking valid connections.

  ---

  ### **Procedure: 5-Minute Whig Distortion Check**
  *(Run questions in order; stop at first "Fail." If all pass, the "today" reference is acceptable.)*

  1.  **Inevitability Test:**  
      *Question:* Does the text imply the present outcome was the *only* possible or inevitable result?  
      *Check:* Scan for words like "destined," "predetermined," "had to," "meant to," or framing events as stepping stones *toward* (not just *before*) today.  
      *Pass:* Outcome presented as contingent, influenced by choices/luck.  
      *Fail:* Outcome framed as foreordained.  
      *Judgment Call?* No. Inevitabilism is always distortive.  

  2.  **Teleology Test:**  
      *Question:* Does it imply past actors were *aiming* at *our* present?  
      *Check:* Look for phrases like "toward modern," "seeking today’s," "building the foundation *for* [current thing]."  
      *Pass:* Actors pursued goals *within their own context* (even if goals later contributed to change).  
      *Fail:* Actors’ motivations anachronistically tied to present outcomes.  
      *Judgment Call?* Minimal. Explicit teleology fails.  

  3.  **Anachronistic Judgment Test:**  
      *Question:* Does it morally judge past actors *primarily* by modern standards?  
      *Check:* Note words like "backward," "unenlightened," or conversely "ahead of his time," "should have known."  
      *Pass:* Explains contemporary context for actions/views; avoids moralizing comparisons.  
      *Fail:* Explicit or implicit condemnation/praise based on modern norms.  
      *Judgment Call?* Yes. If contextual explanation is robust, mild comparative language might pass.  

  4.  **Selective Framing Test:**  
      *Question:* Does it omit credible alternatives, failures, or divergent paths to imply a straight line to now?  
      *Check:* Does it acknowledge dead ends, opposition, or unintended consequences?  
      *Pass:* Notes complexity, competing ideas, or that outcomes weren’t guaranteed.  
      *Fail:* Presents a simplified, winner-takes-all narrative.  
      *Judgment Call?* Yes. Context determines if omissions are material.  

  5.  **False Continuity Test:**  
      *Question:* Does it assert a *direct* causal link to today without evidence?  
      *Check:* Are connectors like "led directly to," "first step toward," or "resulting in" supported by the facts?  
      *Pass:* Specifies documented influence OR presents the link as one interpretation among possibilities.  
      *Fail:* Asserts unverified causation as fact.  
      *Judgment Call?* Partly. Evidence threshold is key.  

  **Where Method Ends & Taste Begins:**  
  - Steps 1, 2, and 5 are objective (fail = edit).  
  - Steps 3 and 4 involve curator judgment on context/relevance. Your role: flag omissions/judgments for review.  
  - **What this can’t do:** Fix poorly researched labels. If context is absent, the test may pass flawed text.  

  ---

  ### **Applied Examples**

  **(a) Mill Label**  
  *"By 1900 the mill was finally forced to shorten children's hours: a small step on the road to the workplace protections we take for granted today."*  
  - **Step 1 (Inevitability):** "Small step on the road to" implies inevitability → **FAIL.**  
    *Edit required:* Replace with: *"This victory, hard-won by campaigners, contributed to later reforms improving worker safety."* (Acknowledges agency without teleology).  
  *Your instinct was wrong: "road to today" frames it as predetermined progress.*

  **(b) Surgeon Label**  
  *"A man ahead of his time, whose warnings went unheeded."*  
  - **Step 3 (Anachronistic Judgment):** "Ahead of his time" judges him by future standards → **FAIL.**  
  - **Step 4 (Selective Framing):** Fails to explain *why* peers dismissed him (e.g., flawed evidence, rival theories) → **FAIL.**  
    *Edit required:* *"He advocated [specific treatment], challenging contemporary practices. Most peers rejected his approach due to [reason], and later research showed [outcome]."*  

  **Your Campaigner Label** (hypothetical):  
  *"She campaigned tirelessly for voting reform, a change finally enacted in 1980."*  
  - **Step 1:** No inevitability (implies delay, not destiny).  
  - **Step 2:** No teleology (her goal was reform *in her era*).  
  - **Step 3:** No moral judgment.  
  - **Step 4:** Could note opposition she faced? (Context-dependent).  
  - **Step 5:** Explicit causal link is reasonable if documented.  
  *→ PASSES. Valid "connection to today" without Whiggish distortion.*

  ---
  **Why This Works:**  
  - It bans *distortions* (inevitability, teleology), not *connections*.  
  - The surgeon’s "ahead of his time" fails objectively; the mill’s "road to today" fails on inevitability. Your campaigner example passes by focusing on intentional action within context.  
  - Curators retain agency on contextual judgments (Steps 3–4), while you enforce objectivity (Steps 1, 2, 5). Funders get "connections" that respect historical integrity.
