      - If she planned in round 1 to get B by the end, she might trade in round 1 to get B? But in round 1, she prefers A to B, so she wouldn't trade A for B. So she starts with A and in round 1 does nothing. In round 2, she might trade A for B (paying a fee) because now she prefers B.

      - The committed agent (no trade) has to forgo acting on her new preference and might be unhappy.
      The step-by-step agent pays a fee and gets what she now wants.

      - The anticipating agent might have planned to hold A through round 1 and then trade in round 2? But that plan would be made in the rule-adoption phase, before knowing the round 2 preferences. If she could anticipate the change, she might have planned to trade for B in round 1 even though she currently prefers A? But that would be against her then preference.

    This shows the cost of commitment: you might be wrong about your future preferences.

    But it doesn't show a money pump cycle.

    Given the time, I think this is acceptable.

    Full timeline for 90 minutes:

        Introduction (5 minutes):
            - Explain the activity: they will be trading tokens, and the goal is to try to get the token they like the most.
            - Each student gets a token and a preference card. They should not show their card to others.
            - Explain trading rules: 
                  * You can trade with any other student.
                  * Both must agree.
                  * For each trade, both traders lose 1 point.
                  * Points start at 10.

        Stage 1: Trading (15 minutes)
            - Let them trade. The facilitator circulates to answer questions about the rules and to collect points (just deduct on the scoreboard).

        Stage 1 debrief (10 minutes):
            - Ask: "How many of you ended up with the token you started with? How many points did you lose?"
            - Let a few students describe their experience.
            - Do not explain the money pump yet.

        Rule adoption phase (5 minutes):
            - Announce that there will be a second trading stage with some changes.
            - In this stage, there will be two trading rounds.
            - Before the rounds, they can adopt a personal rule for how they will behave in the entire stage. Some options:
                 a) Commit to no trading at all.
                 b) Plan a specific sequence of trades now and commit to it, regardless of how you feel during trading.
                 c) Decide to trade step by step based on your then-current preferences.
            - They write down their rule privately.

        Stage 2: 
            - Give new preference cards for Stage 2. The card says:

                  Round 1: You prefer A to B to C.
                  Round 2: You prefer B to C to A.

            - Also, reshuffle the tokens so that students start with a token (maybe randomly redistributed).

            - Round 1 trading (5 minutes): they trade based on round 1 preferences.

            - After round 1, collect the preference cards and give out new ones for round 2? Or the card already has both rounds? They keep the card and just move to round 2.

            - Round 2 trading (5 minutes).

        Stage 2 debrief (20 minutes):
            - Ask about their experience:
                 - Who adopted which rule?
                 - How did it work out?
            - For those who committed to no trade: did you wish you could trade in round 2?
            - For those who planned in advance: were you able to execute your plan? Was it hard to stick to it in round 1 knowing that you might want to change in round 2?
            - For those who traded step by step: did you trade in round 2? How do you feel about the outcome?

        Final lecture (30 minutes):
            - Explain the money pump in both synchronic and diachronic settings.
            - In Stage 1, the pump was due to intransitive preferences.
            - In Stage 2, the issue was changing preferences over time.
            - Discuss the costs of the different rules:
                 - Commitment might prevent exploitation but at the cost of flexibility.
                 - Step-by-step might leave you vulnerable to pumps.
                 - Sophisticated planning might be hard and you might mispredict.
            - Explain that the money pump argument shows that having intransitive or unstable preferences can be costly.

    What cannot be reproduced?
        - The preferences are assigned, not the student's own. So they might not feel the pull of the preference. To address this, you can say: "Even though the preferences are assigned, try to imagine that these are your real preferences for the tokens."

        - We haven't shown an agent with stable and well-behaved preferences who cannot be pumped. You will have to explain that in the debrief.

    Predictable problems:

        - Some students may refuse to trade at all in Stage 1 to avoid fees. That's okay. In the debrief, you can ask them if they saw others getting pumped.

        - Some may trade but not in a cycle. They might end up with a token they like and stop.

        - In Stage 2, the committed student might regret not being able to trade in round 2, which illustrates the cost of commitment.

    Let's now write the full rules.

    Due to the complexity, I've chosen to focus on the synchronic pump for Stage 1 and a simple two-round diachronic change for Stage 2. This should fit the time and make the point.

    If you want a more elaborate diachronic pump, it might exceed the time.

    Final design.
answer: |-
  Below is a meticulously designed 90-minute session plan to achieve your pedagogical goals. The activity uses tokens and point deductions to create a visceral experience of the money pump, emphasizes the diachronic instability of preferences, and forces students to confront the costs of different avoidance strategies.

  ---

  ### **Core Game Design**
  **Objective:** Students experience exploitation via a money pump due to unstable preferences, then test strategies to avoid it.  
  **Key Insight:** Preferences shift predictably across phases, creating cyclical exploitation. The "obvious fix" (refusing to trade) imposes opportunity costs.  

  **Materials:**  
  - **Tokens:** Three colored chips (Red, Blue, Green) and one "null" token (Gray) per student.  
  - **Preference Cards:** Two sets per student (Stage 1 and Stage 2).  
  - **Point System:**  
    - Starting points: 10 per student.  
    - Trade fee: 1 point per trade (paid by both traders).  
    - "Reward" for final token: 0.5 points if it matches their current top preference (to incentivize engagement).  
  - **Scoreboard:** Track points in real-time (e.g., whiteboard).  

  **Preferences Structure:**  
  - **Diachronic Instability:** Preferences shift across phases (e.g., Phase 1: Red > Blue > Green; Phase 2: Blue > Green > Red; Phase 3: Green > Red > Blue).  
  - **Synchronic Intransitivity (minor role):** In Phase 1, pairwise rankings are transitive, but the cycle emerges *across phases* to emphasize instability.  
  - **Gray Token:** Represents "no trade." Holding it incurs no fees but yields no reward.  

  ---

  ### **Rules and Roles**
  **Roles:**  
  - **Students:** 16 participants. Each starts with one token (randomly assigned: 4 Red, 4 Blue, 4 Green, 4 Gray) and 10 points.  
  - **Facilitator:** Enforces rules silently (no explanations). Records trades/points.  

  **Trading Rules:**  
  1. **Phases:** Three 5-minute trading phases.  
  2. **Trades:**  
     - Bilateral only; mutual agreement required.  
     - Any token swap allowed (e.g., Red for Blue, Green for Gray).  
     - Both traders lose 1 point per trade (paid immediately).  
  3. **Preferences:**  
     - Stage 1 (Phases 1–3): Use Preference Card 1 (stable per phase).  
     - Stage 2 (Repeats Phases 1–3): Use Preference Card 2 (identical to Card 1).  
  4. **Preference Cards Example:**  
     ```  
     CARD 1 (STAGE 1)  
     Phase 1: Red > Blue > Green (Gray = neutral)  
     Phase 2: Blue > Green > Red  
     Phase 3: Green > Red > Blue  
     ```  
     *(Card 2 is identical to ensure the pump repeats.)*  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0:00–0:05 — Introduction**  
  - Distribute tokens, points, and Preference Card 1.  
  - **Instructions:**  
    - "Trade tokens with others to get one you prefer. Every trade costs both traders 1 point. Your preferences change by phase (see card). After Phase 3, you’ll get 0.5 points if your token matches your top preference for that phase."  
    - **Critical:** Do NOT mention money pumps, rationality, or strategies.  

  **0:05–0:20 — Stage 1: Initial Pump (Phases 1–3)**  
  - Run Phases 1, 2, and 3 sequentially (5 min each).  
  - **Facilitator:**  
    - Start/end phases strictly on time.  
    - Record trades and deduct points.  
    - **Do not intervene** unless rules are broken.  
  - **Predictable Outcome:**  
    - Students with colored tokens trade to match their phase-specific preferences (e.g., Red holder in Phase 1 trades for Blue in Phase 2, then Green in Phase 3, then back to Red).  
    - Gray holders avoid trades/fees but earn no rewards.  
    - Most end with starting token minus 6–9 points (2–3 full cycles × 3 points in fees).  

  **0:20–0:25 — Stage 1 Debrief Setup**  
  - Freeze the game. Ask:  
    - "How many of you have fewer points than you started with?"  
    - "Who still has their original token?"  
    - **Do not analyze yet.** Only highlight exploitation.  

  **0:25–0:35 — Rule Adoption Phase**  
  - **Task:** "Before Stage 2, adopt one rule to guide *all* trades across Phases 1–3. Write it down:  
    - **Rule 1 (Commitment):** 'I will not trade after Phase 1, no matter what.'  
    - **Rule 2 (Anticipation):** 'I will plan all three trades now to avoid future fees.'  
    - **Rule 3 (Step-by-Step):** 'I’ll decide phase-by-phase.'"  
  - Distribute Preference Card 2 (identical to Card 1).  

  **0:35–0:50 — Stage 2: Testing Rules (Phases 1–3)**  
  - Repeat Phases 1–3.  
  - **Key Differences:**  
    - Students execute their chosen rule.  
    - Anticipation planners must declare trades in advance (facilitator enforces).  
  - **Predictable Costs:**  
    - **Rule 1 (Commitment):** Holds token from Phase 1. Pays no fees but may hold a low-preference token in later phases (e.g., keeps Red in Phase 3 where Green > Red). Loses 0.5-point reward.  
    - **Rule 2 (Anticipation):** Plans trades in advance (e.g., trades Red for Blue in Phase 1, Blue for Green in Phase 2, Green for Red in Phase 3). Pays 3 points in fees and may end with suboptimal tokens if preferences shift unexpectedly (though identical here).  
    - **Rule 3 (Step-by-Step):** Repeats the pump (same as Stage 1).  

  **0:50–1:15 — Debrief**  
  **Goal:** Map game moments to rationality concepts. Avoid endorsing one strategy.  

  | **Game Moment**          | **Concept Illustrated**                                                                 | **Facilitator Question**                                                                 |
  |--------------------------|-----------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | Stage 1, Phase 2 trade   | Preferences are unstable: What you want *now* clashes with past/future.                 | "In Phase 2, why did you trade away the token you wanted in Phase 1?"                   |
  | Stage 1, full cycle      | Diachronic exploitation: The pump isn’t about logic errors, but self-defeating change. | "How did the fees add up even though each trade felt rational at the time?"             |
  | Stage 2, Rule 1 holder   | Commitment costs: Refusing trade avoids fees but locks in suboptimal outcomes.          | "What did you gain by not trading? What did you sacrifice?"                             |
  | Stage 2, Rule 2 planner  | Anticipation is hard: Planning requires predicting future preferences (which can fail). | "Did your plan work? What if preferences shifted unpredictably?"                        |
  | Stage 2, Rule 3 repeater | Step-by-step = vulnerability: "Free" choice enables re-exploitation.                    | "Why was it hard to break the cycle even after seeing it before?"                       |
  | Gray token holders       | The "no trade" price: Safety but no rewards (opportunity cost).                         | "Did avoiding trades feel rational? What did you miss?"                                 |

  **Summary Points:**  
  - The pump exploits *diachronic instability* (changing preferences), not just intransitivity.  
  - Each fix has a cost:  
    - **Commitment:** Pay in lost opportunities.  
    - **Anticipation:** Pay in prediction risk.  
    - **Step-by-Step:** Pay in exploitation.  
  - **No free lunch:** Rationality requires trade-offs, not just willpower.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students refuse to trade (Gray token holders).  
     - **Solution:** Normalize this in debrief ("This is a valid choice! But what did it cost you?"). Use their outcome to illustrate opportunity costs.  

  2. **Problem:** Students treat it as a "puzzle" (e.g., colluding to avoid fees).  
     - **Solution:**  
       - If they bypass the pump (e.g., trade directly to Phase 3 preference), note: "You anticipated! But could you do this if preferences were unknown?"  
       - If they focus on rules, ask: "Did your strategy address your *own* preferences, or just the game mechanics?"  

  3. **Problem:** Some preferences feel arbitrary ("Why would I want Green now?").  
     - **Solution:** Pre-empt this: "Your card tells you what you value *right now*. Treat it as a real desire, even if assigned."  

  4. **Problem:** Time management in trading phases.  
     - **Solution:** Use a visible timer. End phases strictly (even mid-trade).  

  ---

  ### **What the Activity Cannot Simulate**  
  **The Unpumpable Agent:** The activity cannot demonstrate an agent with *stable, well-behaved preferences* who is immune to exploitation. Students only experience vulnerability.  

  **Why?**  
  - Preferences are assigned and unstable by design. Students never feel the "safety" of having fixed, transitive preferences.  
  - The fix requires abstract contrast: You must *describe* an agent whose preferences are coherent across time and options (e.g., "If you always prefer Red > Blue > Green and this never changes, no pump can occur").  

  **How to Address in Debrief:**  
  - Contrast hypotheticals:  
    - "Imagine your preferences were fixed: Red always > Blue > Green. Could you be pumped? No — you’d never cycle back to Red."  
    - "But when preferences shift *because of time or context*, you become a target. The pump isn’t about stupidity; it’s about instability."  
  - Emphasize: Immunity isn’t free — it requires preference stability, which real agents often lack.  

  ---

  ### **Instructor Notes**  
  - **Facilitator Neutrality:** Never hint at "optimal" play. Use Socratic questioning ("What did you notice?") in debrief.  
  - **Embrace Resistance:** Students who reject trades or "solve" the pump are data points, not failures. Use them to explore costs.  
  - **Timekeeper Rigor:** Enforce phase times. Chaos is part of the lesson.  
  - **Token Swap:** Redistribute tokens between stages to reset cycles.  

  This design forces students to viscerally confront the money pump, tests fixes under pressure, and exposes the hidden costs of "obvious" solutions. The debrief ties their frustration directly to the target concepts, making the abstract concrete.
