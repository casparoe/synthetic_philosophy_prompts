answer: |-
  **Joint Statement on Coherence Arguments for Expected Utility Maximisation**

  We, having debated the normative significance of coherence arguments for expected utility (EU) maximisation for two years, hereby present the areas of agreement, the persisting disagreements framed in terms acceptable to each of us, and the cruxes that divide us. This statement reflects our shared understanding of what the von Neumann-Morgenstern (vNM) and Savage representation theorems, money pump arguments, and related ideas genuinely establish, while acknowledging the fundamental philosophical differences that remain.

  **Areas of Agreement:**
  We jointly affirm that the vNM and Savage representation theorems are rigorous mathematical achievements. They demonstrate that if an agent’s preferences over lotteries (vNM) or acts (Savage) satisfy a specific set of axioms—including ordering (completeness and transitivity), independence (vNM) or sure-thing principle (Savage), and continuity/archimedean properties—then those preferences can be represented numerically by an expected utility function. This function is unique up to positive affine transformations (vNM) or unique given a choice of utility zero and unit (Savage). We agree that violations of these axioms preclude such a representation. Furthermore, we concur that money pump and Dutch book arguments highlight potential pragmatic vulnerabilities: an agent whose preferences violate transitivity or independence can, under certain operational assumptions (e.g., that they act on their current preferences when sequentially presented with trades), be exploited into accepting a series of choices leading to a sure loss or a strictly worse outcome than they started with. Finally, we agree that "coherence," in this context, is fundamentally a property of an agent’s *preference ordering* over the relevant objects (gambles, acts), and the axioms constitute the formal definition of that coherence.

  **Persisting Disagreements:**

  *   **On the Normative Force of the Theorems (Pro-Normative Position):** "I maintain that the representation theorems and associated arguments do significant normative work. They reveal that the axioms—completeness, transitivity, independence/sure-thing—are constitutive requirements of instrumental rationality itself when acting under uncertainty. Violating these axioms isn't merely an idiosyncratic taste; it is a form of inconsistency that renders preferences inherently irrational. The theorems identify expected utility maximisation not just as one possible rational standard, but as the unique standard that coherently integrates beliefs and desires under uncertainty. The money pump vulnerability is not merely a practical gotcha; it's symptomatic of this underlying irrationality. Rationality demands the kind of coherent preference structure that EU maximisation embodies."

  *   **On the Normative Force of the Theorems (Skeptical Position):** "I maintain that while the representation theorems are elegant mathematical characterisations, they establish far less normatively than often claimed. They show that *if* one desires a neat numerical representation of preferences via probabilistic beliefs and a state-independent utility function over consequences, *then* one must adhere to the axioms. This is a conditional claim about representation, not an unconditional demand of rationality. Rational agents might reasonably violate axioms like completeness (due to genuine indeterminacy in choice) or independence (due to concerns like risk aversion per se or the source of uncertainty), reflecting complex values the EU framework cannot capture. Money pumps demonstrate a practical cost under specific, potentially artificial, sequential choice scenarios, not necessarily a deep irrationality. The theorems illuminate a useful model for tidy decision-making, not the necessary structure of rational preference."

  **The Cruxes:**

  1.  **Is Completeness a Requirement of Rationality or an Idealisation?**
      *   **Concrete Case:** Consider the Allais Paradox choice scenario. Most people exhibit a preference reversal violating independence, but crucially, their preferences are usually complete—they can choose. Now imagine an agent genuinely unable to rank two complex, multi-attribute career paths where the trade-offs feel incommensurable. They consistently declare "I cannot say which I prefer; neither dominates, and the values involved are too disparate."
      *   **Pro-Normative Prediction:** This agent is irrational. Instrumental rationality requires forming a comparative judgment, even if difficult. Persistently incomplete preferences preclude coherent choice and planning. Rationality demands resolving indeterminacy or accepting a framework (like EU) that forces comparability.
      *   **Skeptical Prediction:** This agent may be perfectly rational. Some choices genuinely involve incommensurable values. Forcing completeness artificially imposes a spurious precision or ignores the agent's authentic evaluative experience. Rationality permits (and sometimes requires) acknowledging genuine incomparability; completeness is an idealisation useful for modelling, not a rational mandate.

  2.  **What are the Normative Implications of Non-Unique Representations (State-Dependence, Probability/Utility Trade-offs)?**
      *   **Concrete Case:** The Ellsberg Paradox. An agent strictly prefers betting on known probabilities over unknown, violating Savage's sure-thing principle. The EU representation is not unique: the aversion could be modelled as state-dependent utility (higher utility for winning when probability is known) or as non-additive/subjective probabilities (distorted beliefs about the ambiguous urn).
      *   **Pro-Normative Prediction:** While the specific belief/utility decomposition isn't unique for a *given* set of preferences, the key point is that coherence (satisfying the axioms) is still required for *any* EU representation to exist at all. The non-uniqueness doesn't undermine the normative force of coherence; it highlights a representational flexibility within the coherent framework. The agent's Ellsberg preferences are still irrational because they violate the independence/sure-thing principle required for coherence.
      *   **Skeptical Prediction:** The non-uniqueness is deeply significant. It shows that the EU framework cannot uniquely pin down an agent's underlying beliefs or state-dependent valuations from their preferences. This indeterminacy weakens the claim that satisfying the axioms reveals an agent's "true" probabilistic beliefs or state-independent desires. It reinforces the idea that the axioms are primarily constraints enabling a specific *type* of representation, not necessarily constraints demanded by rationality itself. The Ellsberg preferences might reflect a rational aversion to ambiguity, which the EU framework (with its forced unique probability) cannot properly capture without violating its own axioms.

  **A Potential Verbal Dispute:**
  We suspect a significant portion of our disagreement hinges on the term "normative work." For the pro-normative side, it signifies that coherence is a *necessary condition* for rationality under uncertainty, revealed by the theorems and exploited by money pumps. For the skeptical side, it implies that the theorems *compel* rational agents to adopt the EU framework and its specific axioms as the only permissible way to be rational, which seems too strong given phenomena like incompleteness, ambiguity aversion, or state-dependence. Clarifying whether "normative work" means identifying necessary conditions for a type of consistency/representation versus proving that this consistency *is* rationality might resolve some friction, though deep philosophical differences about the nature of rationality remain.

  **Confidence and Uncertainty:**
  We are reasonably confident that this statement accurately captures the core agreements, disagreements, and cruxes of our two-year discussion, framed in language each of us can endorse for our respective positions. The concrete cases and predictions are representative of the arguments we've rehearsed. The identification of the potential verbal dispute around "normative work" feels particularly clarifying.

  **The claim within this document we are least sure about** concerns the skeptical position's characterisation of the normative implications of non-unique representations. While the skeptical position firmly holds that non-uniqueness weakens the *interpretive* claim of EU uniquely revealing beliefs/utilities, articulating precisely *how much* this undermines the *normative* claim that coherence (axiom satisfaction) is rationally required – versus just being a representational precondition – remains a subtle and contested point. The skeptical side might feel this phrasing slightly underplays the argument that the representational flexibility highlights the framework's limitations in capturing rational but non-EU preferences, while the pro-normative side might feel it concedes too much ground on the core coherence requirement. This remains the murkiest part of our joint articulation.
