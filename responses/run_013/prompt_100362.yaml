prompt: |-
  Me and a colleague have been going round in circles for about two years now about coherence arguments for expected utility maximisation — the vNM and Savage-style representation theorems, the money-pump and Dutch-book stuff, all of it — and I want to finally write the joint statement we could both actually sign. I'm on the side that thinks these arguments do real normative work: if your preferences are incoherent in the relevant sense then you're not merely quirky, you're irrational, and expected-utility maximisation is the thing you're failing to do. He's on the side that thinks the theorems are lovely mathematics that prove far less than we claim for them — at most that a certain tidy kind of representation requires coherent preferences, not that rationality itself demands them.

  Draft that joint statement for us. Write it as one continuous piece of prose — no headings, no bullet points, no bold, no tables, just paragraphs, the way you'd write a letter we'd both put our names to and send round the reading group. I want, in order: the claims we can both sign, about what the theorems really do establish, about money pumps, and about what exactly 'coherence' is supposed to be a property of; then the places we still disagree, each one phrased in wording that the person holding that side would be happy to put their name to; then the cruxes. I reckon one crux is whether completeness of preference is a genuine requirement of rationality or just an idealisation, and another is what follows from the fact that you can hold someone's preference ranking fixed and trade probability against utility (state-dependent-utility style), so the theorem never pins your credences down uniquely — if that's right, I want to know what it does to his side and to mine. For each crux, give a concrete case or argument that we'd both agree bears on it, and write down what each of us predicts about it. And if some chunk of our two-year fight turns out to be merely verbal, say which chunk and why.

  At the end, tell me how confident you are in the overall document and single out the one claim in it you're least sure about. Please write in British English, and definitly no headers or lists — continuous prose throughout.
