prompt: |-
  I'm a novelist — third book due in about eighteen months — and I've carved out maybe five hours a week this year for philosophy of emotion. I want it to show up in the writing: the scene where a character is furious and knows it, the one where she's grieving and doesn't, the one where what she says she feels and what she's actually doing come apart. So which open questions in the philosophy of emotion matter most for that, and in what order? Not a reading list — I'll find the books myself. What I want is the reasoning: which questions are upstream of which (does the whole judgement-vs-feeling-vs-perception-of-value thing have to get settled before anything about authenticity, fittingness or self-knowledge is even statable?), which are actually tractable for someone with no lab and no training in psych, and which sound profound but wouldn't change a single sentence I write. I also keep bumping into a gap between the emotion a character reports, the emotion that's really driving her, and the emotion a reader will impute to her — is there a live debate about that gap, or do I have to invent it? And tell me what would move a question up or down your ranking. I'm especialy suspicious of the ones that only pay off in the abstract.
reasoning: |-
  Okay, so the user is a novelist working on their third book, due in about eighteen months. They've allocated five hours a week to study philosophy of emotion, aiming to deepen their portrayal of characters' emotions in the story. They want to know which open questions in this field are most relevant for their writing, prioritizing those that directly influence how they depict emotions in scenes—like when a character is aware of their fury, unaware of their grief, or when their stated feelings don't match their actions. 

  The user explicitly rejects a reading list; instead, they want a logical breakdown of which philosophical debates are foundational (upstream) versus those that are more niche or abstract. They're especially wary of ideas that sound profound but wouldn't tangibly change their prose. They also mention a personal observation about the gap between a character's reported emotion, their actual driving emotion, and what the reader infers—asking if this is a recognized debate or something they'd need to invent. 

  First, I need to map the core questions in philosophy of emotion to their practical utility for fiction. The user isn't a philosopher or psychologist, so tractability matters: no lab, no formal training. They need concepts they can weaponize in scenes, not abstract theory. Their examples (fury with awareness, grief without, stated vs. acted emotion) all hinge on emotion's opacity, authenticity, and misinterpretation—both by characters and readers. 

  Top priority should be questions that unpack emotion's *opacity*: why we misidentify or misattribute feelings. The judgment-vs-perception debate (cognitive vs. perceptual theories) is foundational here. If emotions are judgments, they're more susceptible to rational error (e.g., "I *think* I'm fine" while sobbing). If they're perceptions, they're more visceral but potentially illusory (e.g., jealousy as a "gut feeling" that misreads reality). This directly feeds into scenes where a character's self-report clashes with behavior. 

  Next, emotion's *relationship to value*—how feelings track (or fail to track) what matters to a person. This explains why a character might rage over a trivial slight (misplaced value) or fail to grieve a real loss (disconnect between value and feeling). It's upstream of questions like fittingness (is this anger proportionate?) and authenticity (is this jealousy *really* about what she claims?). 

  Authenticity and self-knowledge debates are downstream but high-yield. If a character claims love but acts with cruelty, is the emotion inauthentic, or is she lying to herself? Philosophers like Ratcliffe explore how self-knowledge isn't introspective but narrative—built through action and context. That's novelistic gold: a character only realizes she's grieving when she keeps cancelling plans to visit her mom's grave. 

  The user's observed "gap" (reported vs. actual vs. reader-imputed emotion) is absolutely a live debate! It's the intersection of phenomenology (what emotion feels like), attribution theory (how we label emotions), and social epistemology (how others interpret us). Philosophers like Schwitzgebel study how we're often wrong about our own minds, while Goldie and Nussbaum write on how narrative shapes emotion-ascription. This gap isn't just real—it's where fiction shines, using dramatic irony (reader knows more than character) or unreliable narration. 

  I'll deprioritize debates that don't alter prose: e.g., hardcore metaphysical disputes (are emotions natural kinds?) or overly granular cognitive science. Also skippable: ethics of emotion (unless the book themes demand it). 

  To rank questions, I'll weigh:  
  1. **Direct scene impact** (does it change how I write a line of dialogue or action?).  
  2. **Tractability** (can it be grasped without fMRI studies?).  
  3. **Narrative leverage** (does it create tension, irony, character depth?).  
  The opacity/value link tops the list; it's the engine of internal conflict. Authenticity and the "gap" follow—they're the gears turning that engine into plot. 

  The user's suspicion of "abstract payoff" is smart. I'll flag which questions risk overintellectualizing versus those that crack open character behavior. For example, "basic emotion" debates (are there universal emotions?) might only matter if writing cross-cultural arcs; otherwise, skip. 

  Finally, I'll emphasize that the character-reader emotion gap isn't just debated—it's where philosophy and fiction collide. A novelist can test theories (e.g., can a reader *correctly* infer a feeling the character denies?) in ways labs can't. That's a superpower.
answer: |-
  Here’s a targeted breakdown of open questions in philosophy of emotion, prioritized for **practical impact on character-driven fiction**, with reasoning grounded in your goals. I’ve ranked them by narrative leverage, tractability, and avoiding abstract traps. The upstream/downstream dependencies are explicit.

  ### **Tier 1: Foundational & Directly Actionable**  
  *(Solve these first—they underpin everything else)*  

  1. **What *is* an emotion? (The Ontology Problem)**  
     - **Why upstream?** Everything hinges on this. If emotions are *cognitive judgments* ("I believe I’ve been wronged, so I feel anger"), your character’s self-awareness is intellectual. If they’re *bodily perceptions* ("My pulse is racing, so I’m angry"), self-awareness requires somatic attention. If they’re *value perceptions* ("This *is* outrageous!"), emotions reveal moral truths.  
     - **Tractability:** Focus on "hybrid" theories (e.g., Jesse Prinz, Martha Nussbaum). No lab needed—observe contradictions in real behavior (e.g., "I know this isn’t a threat, but I’m terrified").  
     - **Narrative payoff:** Determines *how* a character recognizes (or misrecognizes) their emotion. A judgment theorist might rationalize rage as "righteousness"; a perceptualist might feel unexplained dread before realizing they’ve been betrayed.  

  2. **How do emotions relate to *values*? (The Fittingness Gap)**  
     - **Why upstream?** Directly fuels authenticity/fittingness debates. If emotions track objective values (e.g., anger at genuine injustice), a character can be "wrong" in feeling it. If emotions create subjective values (e.g., "I love this, therefore it’s good"), authenticity dominates.  
     - **Tractability:** Read debates on "appropriateness" (e.g., Justin D’Arms vs. Daniel Jacobson). Your novelist’s eye for context is ideal.  
     - **Narrative payoff:** Drives scenes where a character’s anger feels disproportionate ("Why am I so furious about spilled coffee?") or their grief is absent ("I *should* feel devastated, but I’m numb").  

  ### **Tier 2: High-Impact Character Mechanics**  
  *(Builds on Tier 1; creates tension/misalignment)*  

  3. **How do we *misidentify* our own emotions? (The Opacity Problem)**  
     - **Live debate:** Yes! Key figures: Peter Goldie (emotions as "feelings toward"), Matthew Ratcliffe (emotions as existential backgrounds).  
     - **The Gap:** Your "reported vs. actual vs. reader-imputed" triangle is central here. Philosophers debate:  
       - **Unconscious emotions** (e.g., repressed envy manifesting as contempt).  
       - **Misattribution** (e.g., anxiety mistaken for anger).  
       - **Narrative self-misunderstanding** (e.g., a character insists they’re "fine" while destroying their apartment).  
     - **Tractability:** Study "affective ignorance" and "emotional self-deception." No psych stats needed—literature *is* the lab.  
     - **Narrative payoff:** Create dramatic irony (reader knows the character’s true emotion before they do) or unreliable narration.  

  4. **When is an emotion *inauthentic*? (The Authenticity Trap)**  
     - **Downstream of Tier 1:** Depends on your ontology. If emotions are value perceptions, inauthenticity = self-deception about values. If they’re bodily, inauthenticity = ignoring physical cues.  
     - **Tractability:** Focus on "emotional integrity" (e.g., Bennett Helm). Avoid abstract virtue ethics—ask: "Would this person feel this if they weren’t performing for others?"  
     - **Narrative payoff:** A character claims love but acts with cruelty; a politician’s "outrage" rings hollow. Shows disconnect between self-image and action.  

  ### **Tier 3: Contextual & Reader-Facing**  
  *(Sharpens subtext and thematic depth)*  

  5. **How do emotions *narrativize* experience? (The Storytelling Problem)**  
     - **Live debate:** Emerging field (e.g., Hannah Arendt, contemporary "narrative emotion" theorists).  
     - **Why it matters:** Characters (and readers) impose stories on emotional chaos ("Was this betrayal or liberation?"). Emotions gain meaning through retroactive plot.  
     - **Tractability:** Analyze how people reframe past emotions (e.g., "I thought I was happy, but it was mania").  
     - **Narrative payoff:** Lets you play with perspective shifts—e.g., a character reinterprets their "grief" as guilt post-revelation.  

  6. **How *social* are emotions? (The Audience Effect)**  
     - **Why it matters:** Emotions change when observed. Shame requires an audience (real/imagined); loneliness is relational.  
     - **Tractability:** Read Erving Goffman (performance) + Sartre (the Look).  
     - **Narrative payoff:** A character’s solitary fury differs from their public outburst; grief performed for others vs. private collapse.  

  ### **Skip These (Low ROI for Fiction)**  
  - **"Basic Emotions" debates:** Whether anger/fear are universal biological categories. Changes nothing in your prose.  
  - **Hardcore metaphysics:** "Are emotions natural kinds?" Fun for philosophers, useless for character dynamics.  
  - **Evolutionary psychology just-so stories:** Explains origins but not lived experience.  

  ---

  ### **What Moves a Question Up/Down?**  
  - **Up:** Directly explains **character behavior**, creates **tension between inner/outer states**, or leverages **reader-character gaps**.  
  - **Down:** Requires technical tools (fMRI, formal logic), only matters for ethics/metaethics, or is purely semantic.  

  ### **Your "Gap" is the Golden Question**  
  The disconnect between reported/actual/reader-imputed emotion is **the core of literary emotion**. Philosophy gives you frameworks:  
  - **Epistemic injustice** (Miranda Fricker): Could a character’s emotion be misunderstood due to prejudice?  
  - **Phenomenology** (Ratcliffe): Emotions as "backgrounds" that shape world-perception (e.g., grief coloring everything gray).  
  - **Affective hermeneutics** (new field!): How we interpret others’ emotions through cultural scripts.  

  **Action step:** Start with **opacity** (Tier 1.1 → Tier 2.3). When your character says "I’m fine," but the reader sees her white-knuckled grip, you’re embodying the gap philosophy can’t resolve—but your novel can.
