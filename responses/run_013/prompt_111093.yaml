prompt: |-
  I need help from someone who actually knows both animal welfare philosophy and the unglamorous day-to-day details of aquaculture. Please take the role of an expert in animal welfare science and applied ethics — the kind of person who has thought seriously about invertebrate sentience and has also sat in the rooms where certification standards get written line by line. Think carefully before you answer, and brainstorm the distinctions you plan to use before you start drawing anything.

  Here's my situation. I'm on the standards committee of a small seafood certification body. We certify farmed shrimp mostly, plus some crab and crayfish, and we're rewriting our welfare chapter. Right now the standard says nothing about crustaceans except that they should be "handled humanely," which everyone on the committee agrees means nothing. We're split on whether crustaceans belong in the welfare chapter at all, and I've been asked to bring a map of the actual positions to next weeks meeting, because I'm pretty sure half our fights are people answering different questions and not noticing.

  So: please write me a decision tree / taxonomy of the positions on whether and how farmed crustaceans should be protected. I want the questions first and the labels second — build it out of the logical space, then locate the real positions inside it. The branch nodes should be the questions people actually disagree about. Here are the ones I think are in play, add or split whatever I'm missing:

  - Whether there's definately a fact of the matter about whether a shrimp's pain-like behavior comes with any experience at all, versus it being a matter of decision or stance rather than discovery, versus it not being a well-formed question to begin with.
  - If you can't know, what rule turns your uncertainty into an actual standard? Precaution, some credence threshold, an evidence bar that science has to clear first, or "no evidence, no obligation."
  - What would make a crustacean's life go well, assuming anything does: felt experience, or biological functioning and teleology (so a shrimp could in principle thrive without feeling anything), or preference satisfaction.
  - Whether death is its own harm for a being like this, or whether only suffering counts. I keep getting stuck on whether you can be deprived of a future you were never going to experience as a future.
  - What sets the moral weight: sheer number of individuals (we are talking about an astronomical number of shrimp), neural complexity, or the fact that we're the ones who brought them into existence.
  - Whether being farmed rather than wild-caught changes the obligation, and whether breeding them ourselves creates a special kind of debt.

  Anchor cases I want the tree to actually run on, so it doesn't float off into abstraction:
  - Eyestalk ablation in hatcheries — cutting off a female shrimp's eyestalk because it makes her spawn.
  - Killing methods: chilling animals down in an ice slurry versus electrical stunning before processing.
  - Crowding and handling during transport, where the animals are basically packed solid.
  - The scale question: our certifier covers farms turning out something like a hundred million individual animals a year, and nobody on the committee knows how to think about that number.

  Requirements for the deliverable:
  - Every branch node phrased as a question a committee member could answer without already knowing which position it leads to. No node that is basically "are you a utilitarian or a deontologist?"
  - 10 to 12 leaves, each one a position. At minimum I want: a precautionary welfare-improver; a graded-sentience regulator where protection kicks in above some complexity line; a "biological functioning" view on which a shrimp can flourish without any felt life; an abolitionist who says no crustacean farming at all; a defender of the status quo who says we shouldn't regulate on speculation; and an ecological holist who cares about the pond and the system over individual shrimp. Fill in the rest with whatever the space actually allows, and mark any leaf nobody defends as unnamed.
  - Each leaf gets one sentence on what it would have our certifier actually require in the standard, and one sentence on the strongest objection to it.
  - Flag any pairs of leaves the tree can't really seperate, instead of pretending it can.
  - Note which combinations of answers come out unoccupied, and say briefly whether that's because the view is incoherent, unattractive, or just not something anyone has bothered to defend yet.
  - No citations, no reading list, no bibliography — I can't look things up in the meeting anyway and I don't want a literature review. Just the instrument.

  Format it as something I can hand out: the tree indented, or as a flowchart in text. And please write it in American English. Thanks!
reasoning: |-
  Okay, let me tackle this aquaculture standards committee request. The user needs a decision tree to map positions on crustacean welfare for their certification body, focusing on farmed shrimp, crab and crayfish. 

  First, I need to identify the core philosophical and practical divides. The user listed several key questions: sentience uncertainty, precautionary principles, conceptions of welfare, death as harm, moral weighting, and farming-specific obligations. These form the natural branch points. 

  For sentience uncertainty, the critical split is between those who think it's knowable versus those who see it as indeterminate. This leads to different approaches to evidence thresholds and precaution. 

  On welfare definitions, the main forks are between felt experience (sentience-based), biological functioning, and preference satisfaction. Each implies different standards - ablation might be acceptable under biological functioning but prohibited under sentience views.

  The death question creates a major divergence: those who see death as inherently harmful versus those who only care about suffering. This directly impacts killing methods. 

  Moral weighting gets tricky with scale - utilitarian counting versus complexity-based thresholds. And the farming context introduces special obligations due to domestication.

  For the anchor cases: 
  - Eyestalk ablation tests welfare definitions
  - Killing methods probe death/suffering distinctions
  - Crowding examines scale vs individual welfare tradeoffs
  - The hundred-million-animal scale forces confrontations about moral arithmetic

  Building the tree structure: Starting with sentience question, then evidence sufficiency if uncertain, then welfare definition, then death harm, then weighting. Farming obligation can cut across several branches. 

  The leaves need to cover realistic positions while including the required ones: precautionary, graded sentience, biological functioning, abolitionist, status quo, ecological holist. Adding positions like preference-based welfare and threshold sentience fills out the logical space.

  Noticing some combinations don't occur - like biological functioning advocates who also see death as harm, since the view typically sees death as neutral if painless. Also, pure preference views are rare for invertebrates since we can't verify their preferences well.

  For the deliverable, each leaf gets a concrete standard requirement and major objection. Formatting as an indented tree keeps it usable in meetings. The ecological holist position is tricky - it might overlap with others on specific standards but differs fundamentally by prioritizing systems over individuals.

  Key tensions: The scale problem makes utilitarian counting overwhelming, while complexity thresholds feel arbitrary. Precaution runs against evidentiary standards. These tensions are inherent and should be flagged rather than resolved.
answer: |-
  Here is a logical decision tree mapping the positions on farmed crustacean welfare, structured around core disagreements and anchored to your practical cases. Each branch node is a question requiring a committee member's stance. Positions (leaves) include the required ones plus logical extensions, with concrete implications and objections.

  **Decision Tree: Positions on Farmed Crustacean Welfare Standards**

  1.  **Is there a fact of the matter about crustacean sentience (e.g., capacity for subjective experience like pain) that we can *in principle* discover through science?**
      *   **NO: Sentience is fundamentally indeterminate or not a coherent concept for crustaceans.** → Go to 2
      *   **YES: Science can (or could) resolve the sentience question.** → Go to 3

  2.  **(Given indeterminacy) What principle should guide our actions regarding crustaceans?**
      *   **Apply the Precautionary Principle: Act as if they *are* sentient to avoid potential harm.** → **Leaf: Precautionary Welfare-Improver**
          *   *Requires:* Prohibition of eyestalk ablation, electrical stunning before killing, density limits during transport, monitoring for stress indicators; mandates environmental enrichment research. *Strongest Objection:* Imposes costly burdens based on speculative harm, potentially misallocating resources from known welfare issues in vertebrates or environmental protection.
      *   **No Evidence, No Obligation: Without proof of sentience, welfare regulations are unjustified speculation.** → **Leaf: Status Quo Minimalist**
          *   *Requires:* Maintains vague "humane handling" language; focuses standards solely on food safety, harvest efficiency, and environmental impacts. *Strongest Objection:* Ignores significant scientific evidence suggesting sentience and risks permitting severe suffering on a massive scale.
      *   **Decision-Based Stance: We must *choose* a stance (sentient/not sentient) for practical purposes, not discover it.** → **Leaf: Assigned Status Regulator** *(Unnamed?)*
          *   *Requires:* Standards mirror vertebrate welfare rules (e.g., stunning, space) IF the policy stance assigns sentience; if not, revert to Status Quo Minimalism. *Strongest Objection:* Arbitrary; lacks an objective anchor, making standards vulnerable to political or economic pressure regardless of evidence.

  3.  **(Given sentience is potentially knowable) Does current science provide SUFFICIENT evidence for crustacean sentience to justify welfare regulations *now*?**
      *   **NO: Evidence is suggestive but not yet conclusive enough for regulatory action.** → Go to 2 (Use Precaution, No Obligation, or Assigned Status)
      *   **YES: Current evidence is sufficient to conclude at least some crustaceans are likely sentient.** → Go to 4

  4.  **(Given sufficient evidence for sentience) What defines a "good life" for a crustacean? (What is their welfare?)**
      *   **Felt Experience (Sentience): Welfare consists in positive subjective states (e.g., comfort) and absence of negative ones (e.g., pain, fear).** → Go to 5
      *   **Biological Functioning/Teleology: Welfare is achieving natural function and biological goals (growth, reproduction, species-typical behavior), regardless of subjective feelings.** → **Leaf: Biological Function Advocate**
          *   *Requires:* Standards ensuring high survival/growth rates, successful reproduction (eyestalk ablation *may* be permitted if proven effective for hatchery output), disease prevention, water quality for physiological needs. *Strongest Objection:* Permits practices causing severe suffering (like ablation, ice slurry killing) if they improve biological outputs, ignoring subjective harm.
      *   **Preference Satisfaction: Welfare is the ability to fulfill observed preferences/choices (e.g., seeking shelter, avoiding threats).** → **Leaf: Preference Fulfillment Advocate** *(Unnamed?)*
          *   *Requires:* Environmental enrichment allowing choice (shelters, substrates), avoiding handling/conditions triggering strong avoidance behaviors; stunning required if aversive reactions to killing methods exist. *Strongest Objection:* Difficult to reliably measure preferences in many contexts; focuses on choice rather than directly on suffering/pleasure.

  5.  **(Given Felt Experience defines welfare) Is death itself a significant harm to the crustacean?**
      *   **NO: Only suffering matters; death is neutral if painless.** → Go to 6
      *   **YES: Death deprives them of future positive experiences, constituting a harm.** → Go to 7

  6.  **(Only suffering matters) What primarily sets the moral weight of protecting an individual crustacean?**
      *   **Sheer Number: The scale of potential suffering demands minimizing suffering-per-individual across the vast population.** → **Leaf: Utilitarian Suffering Minimizer**
          *   *Requires:* Mandate the most reliably painless killing method (likely electrical stunning); strictly limit handling stress/crowding; prohibit ablation due to likely suffering; accept trade-offs favoring large numbers if *average* suffering is reduced. *Strongest Objection:* Ignores individual rights; may permit sacrificing some individuals to intense suffering if it lowers average suffering for the vast majority.
      *   **Neural/Behavioral Complexity: More complex individuals likely have richer/deeper experiences, warranting stronger protections.** → **Leaf: Graded Sentience Regulator**
          *   *Requires:* Tiered standards: e.g., prohibit ablation/stunning for crabs/crayfish (deemed more complex), allow with conditions for shrimp; stricter transport rules for larger/older animals. *Strongest Objection:* Drawing clear complexity lines is scientifically difficult and arbitrary; risks neglecting suffering in "simpler" species like shrimp.
      *   **Causal Responsibility: Creating them imposes a duty to avoid causing suffering, regardless of number or complexity.** → **Leaf: Duty-Based Caretaker**
          *   *Requires:* Prohibit practices causing foreseeable suffering (ablation, ice slurry, severe crowding); mandate humane handling/stunning based on best available methods; focus on individual treatment. *Strongest Objection:* Impractical at massive scales; fails to address the moral significance of the sheer number of beings affected.

  7.  **(Death is a harm + Felt Experience) Does the act of farming/bringing them into existence create special obligations beyond just minimizing suffering?**
      *   **NO: Obligation is only to minimize suffering and provide a decent life before a humane death.** → *Combination logically possible but likely maps to Duty-Based Caretaker (from 6c) or Utilitarian Suffering Minimizer (6a), adding stunning requirement and life-quality standards. Not a distinct leaf.*
      *   **YES: Creating them obligates us to ensure their lives are net positive experiences and/or that death only occurs after a "complete" life.** → **Leaf: Abolitionist**
          *   *Requires:* Prohibit farming entirely; certification cannot be granted to crustacean farms due to inherent inability to provide net-positive lives or humane death at scale. *Strongest Objection:* Ignores potential for significant welfare improvements; eliminates a major food source and economic activity based on a contested ethical view; may not improve wild-caught welfare.

  8.  **(Branching from any point focusing on systems/ecology) Should welfare standards primarily focus on the health of the population, pond ecosystem, or overall agricultural system, rather than individual animals?**
      *   **YES: Individual welfare is secondary or irrelevant to system health and sustainability.** → **Leaf: Ecological Holist**
          *   *Requires:* Standards focused on stocking density for disease *prevention* (not comfort), water quality for ecosystem health, sustainable feed sourcing; may permit practices like ablation if they stabilize hatchery output. Views individual suffering as an acceptable cost for system resilience. *Strongest Objection:* Permits egregious individual suffering if deemed beneficial for the system; contradicts core ethical concerns about individual sentient beings.

  **Notes on the Logical Space:**

  *   **Unoccupied Combinations:**
      *   **Biological Function + Death is Harm (After 5):** Incoherent. Biological functioning views typically see death as a natural endpoint, not a deprivation of future subjective experiences. Welfare ends at death.
      *   **Preference Fulfillment + Death is Harm (After 5):** Logically possible but unattractive/undefended. Preference views struggle with the concept of unfulfilled *future* preferences due to death, usually focusing on current preferences. Explicitly linking preference frustration to death harm is rare.
      *   **Strong Precaution + Biological Function (After 1/2):** Incoherent. Precaution assumes potential for sentience/subjective harm; Biological Function explicitly denies its relevance to welfare.
  *   **Ambiguous/Potentially Overlapping Leaves:**
      *   **Precautionary Welfare-Improver vs. Duty-Based Caretaker:** Both prohibit harmful practices. Precaution is driven by uncertainty; Duty is driven by responsibility despite certainty. Their standards *could* look very similar initially, though Duty might be stricter long-term. The *justification* differs.
      *   **Graded Sentience Regulator vs. Utilitarian Suffering Minimizer:** Graded Sentience might *act* like a Suffering Minimizer for "high-sentience" species but neglect "low-sentience". The Utilitarian focuses on aggregate suffering regardless of grading. Their requirements could diverge significantly on shrimp vs crab standards.
  *   **The Scale Problem:** This permeates almost every position except the Holist and Abolitionist. The Utilitarian is explicitly driven by it. The Status Quo Minimalist and Biological Function Advocate often use scale as a pragmatic argument against complex individual standards. The Duty-Based Caretaker and Precautionary Welfare-Improver struggle most with practical implementation at scale.

  **Use this tree in your meeting by:**

  1.  Identifying which branch node question sparks disagreement.
  2.  Mapping individual committee members' answers to the branch questions until they reach a leaf (or recognize their view isn't cleanly captured, indicating a gap).
  3.  Using the concrete requirements and objections for each leaf to clarify what adopting that position would *actually mean* for the written standard, using your anchor cases (ablation, stunning, crowding, scale) as test scenarios.

  This structure forces clarity on the underlying assumptions driving the debate over the specific welfare provisions. Good luck!
