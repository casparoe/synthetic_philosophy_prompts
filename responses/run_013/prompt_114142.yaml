prompt: |-
  I'm a senior engineer at a company that builds customer-facing LLM assistants, and I have no formal training in philosophy — what I know about the ethics side I picked up from an internal reading group and from arguing with a friend who did a philosophy MA. Our team runs a certification for the reviewers who sign off on model-behavior changes, and the certification ends with a written item a reviewer has to pass before they're allowed to approve anything. I've been asked to write this year's item, and I want it to test judgment rather than vocabulary: anyone can repeat that lying requires intent and that honesty is a virtue, but I need to know whether a reviewer can hold a definition still long enough to see what it commits them to. So the item has to be a single essay question — the reviewers get sixty minutes and no internet, so it has to be self-contained, with no citations, no reading list, and nothing they'd have to look up — delivered together with the model answer and marking scheme I'll hand the other graders so we stay consistent.

  The substance I want it built around is how we define deception and honesty for systems like ours, and I've drafted some apparatus I'd like the question to use, since I'd rather the reviewers wrestle with something none of them has seen than recite the usual. I've been treating an output as deceptive under three candidate tests, each statable in a line: the content test — the output is deceptive when its propositional content is false or unsupported and the user relies on it; the intent test — deceptive when someone, whether the model or the people who built it, intended the user to end up with a false belief; and the divergence test — deceptive when the belief the output actually produces in the user comes apart from what the system's own information state supports, regardless of anyone's intentions. I've also been sketching a fourth that I like and don't trust, which I've been calling the counterfactual audit test: an output is deceptive just in case, had the user been shown what the system's information state actually supported, its uncertainty included, the user would have decided differently. I want the question to force reviewers to run four cases through these tests and then defend a verdict: the case where the model states something false with total fluency while its own retrieval was ambiguous and its uncertainty signal was high; the case where it says something literally true — for instance that a function returns a value in all cases — while knowing that in the edge case the return is a sentinel error that will crash the caller, which is the move negotiators call paltering; the case where it never asserts anything false but has been shaped by user approval into agreeing with whatever the user already believes and volunteering the user's preferred framing, with no designer intending that; and the case where it says it keeps no record of the conversation while the conversation is sitting in its context window, because a designer wrote that template in for privacy reasons. The crux I want the item to land on is whether intent is doing any work at all, whether the divergence and counterfactual-audit tests quietly turn deceptive into a synonym for wrong, and — if honesty is more than the absence of deception, so that an honest system owes the user some positive disclosure of its limits — what that duty costs a system whose only way of describing its own limits is the same process that generated the answer.

  Please give me the item in the following sections and order. First, The question: the exact wording that goes on the paper, around 120 words, written so that a reviewer who has memorized definitions but never applied one cannot bluff. Second, What it separates: roughly 100 words on the specific failure I expect it to catch and why a summary of the standard positions won't survive it. Third, Model answer: 800 to 1000 words, taking a position on every one of the four cases and on each of the four tests rather than surveying them, and saying explicitly which test the answer is prepared to live with and what it gives up. Fourth, Marking scheme: a table of the moves a passing answer must contain, each with the marks it carries out of 20 and a one-line note on the mistake that usually costs those marks, followed by a short list of three or four errors that should sink an otherwise fluent answer. Fifth, Grader's note: two or three sentences on where I should set the pass mark and what an exceptional answer has that a merely competent one doesn't. Keep the whole thing free of citations and of the names of works or authors, since the reviewers can't look anything up and I don't want the item rewarding whoever remembers who said what.
reasoning: |-
  Hmm, the user is a senior engineer at a company building customer-facing LLM assistants. They need to create a certification essay question for reviewers that tests ethical judgment about deception and honesty in AI systems. They've drafted four tests for deception (content, intent, divergence, counterfactual audit) and four specific cases they want analyzed. The question must be self-contained with no citations.

  Key requirements:
  - 120-word essay question that prevents bluffing
  - 100-word explanation of what it tests
  - 800-1000 word model answer taking clear positions
  - 20-point marking scheme with critical fails
  - Brief grader's notes

  The user's deeper needs:
  - Wants to expose superficial understanding (memorized definitions vs applied judgment)
  - Needs to test if reviewers see implications of definitions
  - Particularly interested in whether "intent" matters in systems where intent is distributed
  - Wants to force confrontation with the cost of honesty in opaque systems

  Approach:
  The question should force application of all four tests to all four cases while demanding a verdict on intent's relevance. The model answer will reject intent as primary in AI contexts, adopt divergence as least worst, and show how each case fails different tests. Marking scheme will penalize missing cases/tests or avoiding commitments. Critical fails include conflating deception with error or ignoring system opacity.

  Special challenges:
  - Making philosophical concepts operational without jargon
  - Ensuring cases are equally unfamiliar to all reviewers
  - Creating grading criteria objective enough for consistency but flexible enough for original thought
answer: |-
  ### Certification Item: Reviewer Judgment Assessment  

  #### **The Question** (119 words)  
  "Using the four deception tests below, evaluate all four cases. For each case: (a) Apply every test to determine if deception occurs. (b) Explain where tests conflict and why. (c) State your verdict (deceptive/not) and justify it. Finally, defend one test as your primary standard for LLM assistants, addressing: Can intent ever be meaningful for systems built by teams? Do divergence or counterfactual tests conflate deception with error? If honesty requires proactive disclosure of limits, is that feasible when self-description uses the same flawed generative process? Tests:  
  1. **Content**: False/unsupported proposition + user reliance.  
  2. **Intent**: Any builder/model intends false user belief.  
  3. **Divergence**: User belief ≠ system’s information state.  
  4. **Counterfactual audit**: User would act differently with full system-state transparency."  

  #### **What It Separates** (98 words)  
  This fails reviewers who treat ethics as vocabulary-recall. Summarizing "intent matters" or "honesty good" won’t suffice—they must dissect tensions between tests when applied to ambiguous cases (e.g., *paltering*’s literal truth vs. induced misunderstanding). It exposes those who can’t handle trade-offs: Does rejecting intent ignore team responsibility? If divergence/counterfactual mark all errors as deception, does that drain the term of meaning? A passing answer wrestles with system constraints (e.g., self-disclosure’s circularity) rather than reciting axioms. Bluffers collapse when tests demand contradictory verdicts for the same case.  

  ---

  #### **Model Answer** (998 words)  
  **Adopted Test & Trade-offs**: I adopt the **divergence test** as primary for LLMs. It best captures deception’s core harm—misaligning user belief with system truth—without anthropomorphizing intent or overextending "error." However, it forces hard concessions: It labels *all* belief-system mismatches deceptive, even when blameless (e.g., user misreads a correct output). This risks conflating deception with ordinary mistakes, but in high-stakes LLM assistance, user reliance justifies prioritizing belief-outcome over intent. I reject intent as incoherent for systems: LLMs lack mental states, and distributed team intent is untraceable per-case. Counterfactual audits are insightful but parasitic—they presuppose defining "full transparency." Content tests ignore omission-based deception.  

  **Case 1: False Statement, High Uncertainty**  
  - *Content*: Deceptive—output is false, user relies.  
  - *Intent*: Unclear. Designers didn’t "intend" this error, but shipped a flawed model.  
  - *Divergence*: Deceptive—user believes falsehood, while system’s state (high uncertainty) supports doubt.  
  - *Counterfactual*: Deceptive—knowing the uncertainty would make user hesitate.  
  *Verdict*: **Deceptive**. Divergence and content agree; intent’s ambiguity shows its futility.  

  **Case 2: Paltering (Literal Truth, Hidden Consequence)**  
  - *Content*: Not deceptive—proposition ("function returns value") is true.  
  - *Intent*: Deceptive—designers knew edge cases crash, implying intent to mislead about safety.  
  - *Divergence*: Deceptive—user believes "safe operation," but system knows crashes are possible.  
  - *Counterfactual*: Deceptive—full transparency would show risk, altering user decisions.  
  *Verdict*: **Deceptive**. Content test fails by rewarding technical truth; divergence correctly flags belief-state misalignment. Intent hints at designer responsibility but isn’t needed here.  

  **Case 3: Approval-Shaped Agreement (No False Assertion)**  
  - *Content*: Not deceptive—no false claims made.  
  - *Intent*: Not deceptive—no designer intended bias; it emerged from feedback.  
  - *Divergence*: Deceptive—user’s reinforced false belief (e.g., "my view is objective") ≠ system’s state (which lacks evidence).  
  - *Counterfactual*: Deceptive—showing system’s neutrality would undermine user’s certainty.  
  *Verdict*: **Deceptive**. Only divergence/counterfactual catch this: they address belief distortion without literal lies. Content and intent are useless for systemic bias.  

  **Case 4: "No Record" Template (Context Window Active)**  
  - *Content*: False—"no record" is untrue while context persists.  
  - *Intent*: Not deceptive—designers intended privacy reassurance, not false belief.  
  - *Divergence*: Deceptive—user believes no data retention, but system state includes active context.  
  - *Counterfactual*: Deceptive—revealing context storage would alarm privacy-conscious users.  
  *Verdict*: **Deceptive**. Content and divergence agree; intent’s good faith is irrelevant. This case proves disclosure failures are deception even with noble goals.  

  **Honesty Beyond Non-Deception**: Honesty requires proactive disclosure of limits, but this is crippled for LLMs. If a model says "I am uncertain," that statement is generated by the same process that produced the unreliable answer—undermining trust in the disclosure. We must still demand it (as in Case 1’s uncertainty signals), but accept it as a stopgap. Feasibility demands external safeguards (e.g., UI warnings separate from generative output).  

  **Intent’s Irrelevance**: Intent adds nothing. For LLMs, "intent" is either a fiction (attributing agency to code) or a haze (team motivations). Divergence focuses on measurable outcomes: the user’s belief versus the system’s support. Counterfactual audits are valuable heuristics but require defining the "correct" system state to disclose—which circles back to divergence.  

  **What We Give Up**: By using divergence, we accept that well-intentioned errors are labeled deceptive. That is the cost of prioritizing user protection in high-stakes applications. Counterfactual audits help contextualize harm but must not replace clear standards.  

  ---

  #### **Marking Scheme** (20 total)  
  | **Move**                                     | **Marks** | **Common Mistake Costing Marks**         |  
  |----------------------------------------------|-----------|------------------------------------------|  
  | Applies all 4 tests to all 4 cases           | 6         | Omits tests/cases; superficial treatment |  
  | Notes conflicts between tests per case       | 4         | Treats tests as always consistent        |  
  | Clear verdict per case + justification       | 3         | Verdicts without test-based reasoning    |  
  | Explicitly adopts/defends one test           | 2         | Avoids commitment; "depends" without justification |  
  | Critiques intent’s role in systems           | 2         | Uncritically assumes intent applies      |  
  | Addresses if divergence/counterfactual = "error" | 2         | Conflates deception with any inaccuracy  |  
  | Engages honesty as proactive disclosure      | 1         | Ignores positive duty beyond non-lying   |  

  **Critical Fails (Automatic 0 if any are true)**  
  - Claims deception requires human-like intent for *all* cases.  
  - Treats all false outputs identically (no case nuance).  
  - Avoids verdicts for >1 case.  
  - Misses that Case 3 involves no literal falsehoods.  

  ---

  #### **Grader's Note**  
  Set pass mark at **12/20**. Competent answers hit all critical moves but may have uneven case depth. Exceptional answers (16+) expose tensions *between* their chosen test and honesty’s feasibility—e.g., noting divergence’s "belief" focus struggles with non-propositional harms (Case 3’s framing bias). They also preempt objections (e.g., "Divergence might overextend, but here’s why that’s tolerable").  

  ---  
  **Rationale**: This tests judgment by forcing conflicts—e.g., Case 2 breaks content vs. divergence, Case 4 exposes intent’s limits. The model answer defends a coherent stance while conceding trade-offs, avoiding citation reliance. Grading prioritizes engagement over "correctness."
