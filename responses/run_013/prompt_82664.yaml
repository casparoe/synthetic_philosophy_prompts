  Then the reverse: Does the evidence confirm separability? Linear B's disappearance suggests loss of administrative knowledge (accumulation), but if writing was tied to palatial religion (meaning), maybe they're entangled. Egypt's survival as a reduced state hints that partial coordination failure didn't wipe out all accumulation or meaning. 

