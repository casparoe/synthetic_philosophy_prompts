answer: |-
  Based on your meticulous description, there isn't a single, universally established *and* perfectly precise term for this specific phenomenon. However, the concept is well-recognized in critical discourse and scholarship on political apologies. Drawing from your analysis and related fields, the most accurate and descriptive term would be:

  **Historical Exoneration Apology**

  Here's a careful definition, dissection, and differentiation:

  **Definition of a Historical Exoneration Apology:**

  > A formal institutional statement that explicitly names a past wrong, employs performative language of apology ("we apologize," "we are sorry"), and is publicly received as such, but strategically frames the wrong as:
  > 1.  **Exclusively Historical:** Situated entirely in a concluded past.
  > 2.  **Attributable Solely to Past Actors:** Caused by specific individuals or a "different era," explicitly or implicitly absolving the *present* institution of structural or continuous responsibility.
  > 3.  **Requiring No Present Obligation:** Explicitly or implicitly rejects any ongoing consequences, current institutional culpability, or the need for substantive redress (reparations, structural reform, ongoing accountability).
  >
  > Its primary function is **temporal closure** and **institutional self-exoneration**: acknowledging the event occurred to definitively mark it as "over," thereby insulating the present institution from further moral, political, or legal claims related to that past.

  **Key Components & What it Includes/Excludes:**

  1.  **Explicit Naming & Performative Language (Includes):** Must clearly state the wrong and use apology words ("apologize," "sorry"). This distinguishes it from vague expressions of "regret" or acknowledgments without apology.
  2.  **Wholly Past Attribution (Includes):** Blame is confined to specific deceased individuals, past leaders acting against institutional values, or a "bygone era." The *present* institution is framed as fundamentally different or morally superior.
  3.  **Rejection of Present Obligation (Includes):** Explicitly denies ongoing effects, institutional continuity of harm, or the need for reparations, restitution, or significant structural change. It may include symbolic gestures (monuments, commemorations) *only if* they serve closure, not ongoing responsibility.
  4.  **Closure as Primary Goal (Includes):** The core intent is to draw a line under the issue, preempt further demands, and protect the institution's current reputation and resources.
  5.  **Excludes:** Genuine apologies that accept *some* form of present responsibility (even if debated), non-apologies that avoid naming the wrong or using apology words, qualified apologies that express regret but deny direct responsibility ("mistakes were made"), and apologies that *do* offer reparations or reforms (even if inadequate).

  **Differentiating from Similar Concepts:**

  *   **Non-Apology:**
      *   **Difference:** A non-apology avoids the core act of apologizing. It uses hedges ("regret any offense caused"), passive voice ("mistakes were made"), conditional language ("if anyone was hurt"), or shifts blame. It fundamentally refuses to *own* the act of apologizing.
      *   **Historical Exoneration Apology:** *Does* explicitly name the wrong and *does* perform the speech act "we apologize." Its evasion lies in the *scope* of responsibility (past-only) and the *consequences* (no obligation), not in the *act* of apologizing itself.
  *   **Qualified Apology / Expression of Regret:**
      *   **Difference:** These may express sorrow or regret *about* the event or its consequences *without* actually accepting responsibility *for causing it*. ("We deeply regret the suffering that occurred"). They often stop short of saying "we did wrong, we are responsible."
      *   **Historical Exoneration Apology:** Explicitly accepts *that the named wrong happened* and that *the institution (in the past)* caused it ("we apologize for [specific wrong]"). Its qualification is temporal and consequential: "but *that was then*, and *we owe nothing now*."
  *   **Bare Expression of Regret:**
      *   **Difference:** Simply states sorrow about suffering or negative outcomes, often without naming the cause clearly or attributing it directly to the institution's actions. Focuses on the victim's experience, not the perpetrator's responsibility.
      *   **Historical Exoneration Apology:** Explicitly names the *institution's* past *action* as the wrong being apologized for.
  *   **A Failed Apology:**
      *   **Difference:** A "failed apology" is a judgment call on an apology *attempt* that was intended to be more substantive but was perceived as insufficient, insincere, or badly executed (e.g., inadequate reparations offered, perceived lack of sincerity, poor timing). The failure is often in reception or execution relative to intent.
      *   **Historical Exoneration Apology:** This is a *structurally distinct type*, not a failure. Its design *intrinsically includes* the limitation of responsibility and obligation from the outset. It achieves its *intended* goal of closure/exoneration precisely by *avoiding* the elements that would make it a more substantive apology. Its "failure" (in critics' eyes) is its core feature.

  **The Line: Historical Exoneration Apology vs. a Simply Inadequate Apology**

  The crucial line lies in **structural intent and framing**:

  *   **Historical Exoneration Apology:** The *temporal framing* ("wholly in the past," "not who we are now") and the *explicit or implicit rejection of present obligation* are fundamental, non-negotiable components of the statement itself. It is *designed* to limit liability.
  *   **Simply Inadequate/Failed Apology:** An apology might be criticized for offering insufficient reparations, or for not fully acknowledging ongoing harm, *while still*:
      *   Accepting that the *institution itself* (not just past bad apples) bears responsibility *in principle*.
      *   Implying or stating *some* form of present obligation (even if symbolic or deemed insufficient).
      *   Not explicitly framing the wrong as *only* historical with no present relevance.
      The inadequacy here is one of *degree* or *execution* within the framework of accepting responsibility. The *structure* accepts ongoing connection; the *substance* offered is found wanting.

  **Why "Historical Exoneration Apology" Fits:**

  *   **Historical:** Emphasizes the confinement of the wrong to the past.
  *   **Exoneration:** Directly captures the absolving of the *present-day* institution from responsibility, blame, and obligation. It highlights the self-protective function.
  *   **Apology:** Acknowledges it uses the performative language and is received as such, distinguishing it from non-apologies.

  This term accurately reflects the core dynamic you identified: naming the past wrong to definitively date it ("historical"), thereby freeing the present institution from further claims ("exoneration"), while formally performing the act expected ("apology"). It names the strategy, not just the form.
