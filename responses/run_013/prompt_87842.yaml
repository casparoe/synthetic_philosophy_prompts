prompt: |-
  My seminar has two people who've been arguing all term and they've finally agreed to write something together, and I want you to draft it. One of them is an accuracy-firster: credences are what epistemic norms govern, they're governed by closeness to the truth, and so probabilism, conditionalization, all of it has to be earned by accuracy arguments -- dominance, expected accuracy, that sort of thing. The other thinks the fundamental norm is that your credences answer to your evidence, that the accuracy arguments only get you coherence, and that whenever you take an expectation of accuracy you've already had to pick a probability function to take it with respect to, which is either the agent's own credences, and so circular, or something you haven't earned. Write the joint statement they could both sign: agreed claims first, numbered, about the formalism and about what the scoring rule does and doesn't settle; then the disagreements, each phrased so its own side would accept the wording; then the cruxes -- I'd bet one is whether avoiding accuracy-domination is enough for a credence to count as rational, and another is whether the extra principles you need to get from coherence to evidential norms (chance-credence, indifference) are themselves accuracy-based or smuggled in -- and for each crux, a case or argument both accept as bearing on it, with each side's prediction written down. Fold in one more thing: a third colleague keeps saying the real epistemic good is calibration, i.e. long-run agreement between credence and frequency, and that the accuracy crowd are chasing a red herring. Make both of them say whether that's a rival view or just accuracy renamed. Finish with a disagreements table. Dont worry about citations, just argue it out properly.
reasoning: |-
  We are drafting a joint statement for two seminar participants with opposing views on the foundations of epistemic norms. We'll structure it as follows:

  1. **Agreed Claims**: Numbered list of statements both parties accept.
  2. **Disagreements**: Each side's view, worded in a way they would accept.
  3. **Cruxes**: Key points of disagreement, with a case or argument that bears on each crux, and each side's prediction about that case.
  4. **Response to Calibration Critique**: Both sides say whether calibration is a rival view or just accuracy renamed.
  5. **Disagreements Table**: A table summarizing the disagreements.

  ---

  **Joint Statement: Epistemic Norms and the Role of Accuracy**

  **1. Agreed Claims**

  We, the undersigned, agree on the following formal and substantive points:

  1.1. Formal Framework: We take credences to be represented by real numbers in the interval [0,1] assigned to propositions. The set of propositions forms an algebra, and we assume a finite setting for simplicity.

  1.2. Scoring Rules: We agree that scoring rules, such as the Brier score, are useful tools for measuring the inaccuracy of a credence function. A scoring rule is a function that assigns a real number (representing inaccuracy) to a credence function given a state of the world.

  1.3. Probabilism: We agree that probabilism (the requirement that credences be probabilistic) is a necessary condition for rationality. This agreement is based on the fact that non-probabilistic credences are accuracy-dominated: there exists a probabilistic credence function that is more accurate in every possible world.

  1.4. Conditionalization: We agree that updating by conditionalization (Bayesian updating) is a rational requirement when an agent learns new evidence with certainty. However, we disagree on the justification for conditionalization (see below).

  1.5. Scoring Rules and Coherence: We agree that the accuracy-dominance argument (avoiding being dominated by an alternative credence function) establishes coherence (probabilism) as a necessary condition for rationality. This is because any incoherent credence function is accuracy-dominated by a coherent one.

  1.6. Limitations of Scoring Rules: We agree that scoring rules, by themselves, do not determine a unique rational credence function. For example, in the absence of evidence, multiple coherent credence functions may avoid dominance.

  1.7. Evidence and Credences: We agree that rational credences must be responsive to evidence. However, we disagree on how this responsiveness is justified and what role accuracy plays in that justification.

  **2. Disagreements**

  We have two main disagreements, which we state in terms each side accepts:

  2.1. *Accuracy-Firster (AF)*: The fundamental epistemic norm is to minimize inaccuracy, and all other norms (including probabilism, conditionalization, and principles linking evidence to credences) must be derived from this goal. The accuracy-dominance and expected accuracy arguments are non-circular and provide the foundation for these norms.

  2.2. *Evidence-Firster (EF)*: The fundamental epistemic norm is that credences must respect the evidence. While accuracy arguments can establish coherence (probabilism), they cannot, without circularity or unearned assumptions, justify evidential norms (such as conditionalization or the Principal Principle). This is because any expected accuracy calculation requires a probability function (either the agent's own, leading to circularity, or an external one, which requires independent justification).

  **3. Cruxes**

  We identify two cruxes of our disagreement:

  *Crux 1: Is avoiding accuracy-domination sufficient for rationality?*

  - **Case/Argument**: Consider an agent who has no evidence about a coin flip. The agent assigns credence 0.6 to heads and 0.4 to tails (which is coherent). This credence function is not dominated. However, the agent could have assigned 0.5 to heads and 0.5 to tails. Both are coherent and undominated.

  - **AF Prediction**: Avoiding domination is necessary but not sufficient. The agent must also maximize expected accuracy (with respect to a suitable weighting). In the absence of evidence, the principle of indifference (assigning equal credence to each possibility) is justified by maximizing worst-case expected accuracy or by other accuracy-based considerations. Thus, the 0.5/0.5 assignment is rationally required.

  - **EF Prediction**: Avoiding domination is necessary and sufficient for coherence, but it does not settle which coherent credence to adopt. The principle of indifference (or any other rule for assigning credences in the absence of evidence) is not justified by accuracy considerations alone. It must come from a separate evidential norm (e.g., symmetry considerations). Thus, both 0.6/0.4 and 0.5/0.5 are coherent and undominated, but only the 0.5/0.5 assignment respects the evidence (or lack thereof) appropriately.

  *Crux 2: Can evidential norms (like the Principal Principle) be justified by accuracy arguments without circularity?*

  - **Case/Argument**: The Principal Principle requires that one's credence in a proposition A, conditional on the chance of A being c, should be c. Can this be justified by accuracy arguments?

  - **AF Argument**: We can justify the Principal Principle by showing that violating it leads to accuracy-domination. Specifically, if an agent violates the Principal Principle, then there is an alternative credence function that is more accurate in every possible world (or at least in expectation with respect to the chance function). This argument uses the chance function to define the domination, but it is not circular because the chance function is an objective feature of the world and not the agent's own credence.

  - **EF Response**: This argument assumes that we are evaluating accuracy with respect to the chance function, which is itself a probability function. But why should the agent care about that particular probability function? The accuracy argument for the Principal Principle presupposes the authority of chance, which is exactly what the principle is trying to establish. Hence, it is circular. Moreover, the agent's own credences might not match the chance function, so using the chance function in the expected accuracy calculation is not available to the agent without prior knowledge of the chance.

  - **AF Rejoinder**: The agent doesn't need to know the chance function in advance. The argument shows that if the agent violates the Principal Principle, then regardless of what the chance is, there is a better credence function (that respects the principle). This is a dominance argument relative to the class of chance functions.

  - **EF Counter**: The dominance argument only shows that the agent is dominated by a credence function that is calibrated to the chance. But why is that the right standard? The agent's evidence might not include the chance. The dominance argument only works if we already accept that the chance function is the appropriate standard, which is what we are trying to justify.

  **4. The Calibration Challenge**

  A third colleague argues that the real epistemic good is calibration, defined as long-run agreement between credence and frequency. They claim that the focus on accuracy (as measured by scoring rules) is a red herring.

  - **Accuracy-Firster (AF)**: Calibration is not a rival view but a special case of accuracy. A well-known result (by DeGroot, Fienberg, etc.) shows that a credence function is perfectly calibrated in the long run if and only if it is a probability function. Moreover, strictly proper scoring rules (like the Brier score) are minimized in expectation by the true probabilities. Therefore, calibration is a consequence of accuracy optimization and not an alternative.

  - **Evidence-Firster (EF)**: Calibration is a distinct concept from accuracy. While it is true that calibration and coherence are connected, calibration is about matching frequencies in a reference class, which may not always be the most appropriate goal. For example, in a single case, calibration doesn't apply, and we must rely on evidence. Moreover, the accuracy-first program uses scoring rules that do not necessarily enforce calibration in the short run. Therefore, calibration is a rival view that emphasizes long-run performance, but it does not replace the need for evidential norms in individual cases.

  **5. Disagreements Table**

  We summarize our disagreements in the following table:

  | Issue | Accuracy-Firster (AF) | Evidence-Firster (EF) |
  |-------|------------------------|------------------------|
  | **Fundamental Epistemic Norm** | Minimize inaccuracy. | Respect the evidence. |
  | **Role of Accuracy Arguments** | They can justify all epistemic norms (probabilism, conditionalization, evidential norms) without circularity. | They justify coherence (probabilism) but not evidential norms; attempts to do so are circular or assume unearned priors. |
  | **Avoiding Accuracy-Domination** | Necessary but not sufficient: we must also maximize expected accuracy (with a suitable weighting). | Necessary and sufficient for coherence, but does not determine the credences that respond to evidence. |
  | **Justification of the Principal Principle** | Can be justified by accuracy-dominance or expected accuracy (using the chance function) without circularity. | Cannot be justified without circularity: the accuracy argument assumes the authority of chance. |
  | **Calibration** | Not a rival: it is a consequence of accuracy optimization. | A rival view that emphasizes long-run frequencies, but not sufficient for individual cases. |

  Signed, 
  [Accuracy-Firster] and [Evidence-Firster]
answer: |-
  ### Joint Statement on Epistemic Norms: Accuracy, Evidence, and Calibration  
  **Authored by the Accuracy-Firster (AF) and Evidence-Firster (EF)**  

  We, an accuracy-firster (AF) and an evidence-firster (EF), have debated the foundations of epistemic rationality all term. We agree on core formalisms and the limited role of scoring rules but disagree sharply on deeper justifications. Below, we outline our agreements, disagreements, cruxes, and responses to the calibration critique. We aim for neutral phrasing in disagreements and specify testable predictions for each crux.  

  ---

  ### I. Agreed Claims: Formalism and the Scope of Scoring Rules  
  We jointly endorse these claims about the framework:  

  1. **Credences as Formal Objects**: Credences are real-numbered degrees of belief (in [0,1]) defined over propositions in a Boolean algebra. Epistemic norms govern how these credences ought to be formed and updated.  
  2. **Scoring Rules Measure Local Accuracy**: Scoring rules (e.g., Brier score, log score) quantify the inaccuracy of a credence in a single proposition given a truth value (e.g., 0 or 1). They do not directly measure global properties like "truthfulness."  
  3. **Accuracy Arguments Establish Coherence**:  
     - **Probabilism**: Non-probabilistic credences are accuracy-dominated (i.e., strictly outperformed in accuracy by a probabilistic alternative in every possible world). Thus, avoiding domination entails coherence.  
     - **Conditionalization's Limited Justification**: Accuracy arguments (via dominance or expected accuracy) show that updating by conditionalization avoids domination *if* an agent adopts *some* prior. They do not justify which prior is rational or how evidence constrains it.  
  4. **Scoring Rules Do Not Settle Evidential Norms**:  
     - Scoring rules alone cannot justify credences responsive to evidence (e.g., trusting scientific data). They only enforce internal coherence.  
     - Using expected accuracy to justify norms requires a "weighting" probability function. This function is either:  
       - (a) The agent’s own credence (risking circularity), or  
       - (b) An external standard (e.g., objective chances), which lacks prior justification.  
  5. **No Unique Accuracy-Maximizer**: In underdetermined cases (e.g., no evidence), multiple coherent credences avoid domination. Scoring rules do not break ties.  

  ---

  ### II. Disagreements: Worded for Mutual Acceptance  
  Each side accepts the phrasing of their own position below:  
  - **AF Position**: *Accuracy is the fundamental epistemic good*. All norms (probabilism, conditionalization, chance-credence principles) derive from minimizing inaccuracy—via dominance, expected accuracy, or other scoring rule arguments. Circularity is avoided by using objective, non-agent-relative standards (e.g., domination proofs).  
  - **EF Position**: *Evidence is the fundamental epistemic constraint*. Coherence is necessary but insufficient; credences must respect evidence. Accuracy arguments only secure coherence and smuggles in evidential norms (e.g., indifference) via unearned priors or circular expectations.  

  ---

  ### III. Cruxes: Cases, Arguments, and Predictions  
  We identify two cruxes. For each, we state a shared case/argument and our divergent predictions.  

  #### **Crux 1: Is avoiding accuracy-domination sufficient for rationality?**  
  - **Case**: *The Unbiased Coin*  
    An agent knows a coin is fair (50% heads) but adopts credence 0.7 for heads, violating the Principal Principle (chance-credence norm). This credence is coherent and undominated: no alternative credence is more accurate in *every* possible world.  
  - **Shared Argument**:  
    Dominance avoidance ensures coherence but not evidence-responsiveness. The case tests whether rationality demands more (e.g., aligning with chances).  
  - **Predictions**:  
    - **AF**: Avoiding domination is insufficient. Rationality requires minimizing *expected* inaccuracy using the chance function (here, 0.5). Thus, 0.7 is irrational—it loses expected accuracy against the 0.5 benchmark.  
    - **EF**: Avoiding domination is sufficient for coherence, but not for full rationality. The 0.7 credence is coherent yet irrational because it ignores evidence (the known chance). The error is evidential, not accuracy-theoretic.  

  #### **Crux 2: Are evidential norms accuracy-based or smuggled in?**  
  - **Case**: *The Unknown Chance*  
    An agent knows a coin has some objective chance of heads (chosen secretly by a demon) but has no evidence about its value. They adopt a uniform prior over chances (e.g., credence 0.5 for heads).  
  - **Shared Argument**:  
    The Principal Principle requires aligning credences with known chances, but here the chance is unknown. The uniform prior is often justified by indifference (an evidential norm). This tests whether indifference is accuracy-justified or external.  
  - **Predictions**:  
    - **AF**: Indifference maximizes worst-case expected accuracy (minimax rule). Thus, it is accuracy-derived: the uniform prior minimizes maximum expected inaccuracy across possible chances.  
    - **EF**: Indifference is smuggled in. Expected accuracy calculations here assume a uniform weighting over chances—but this weighting *is* the indifference principle itself. Accuracy arguments do not "earn" it; they presuppose it.  

  ---

  ### IV. Calibration: Rival View or Renamed Accuracy?  
  A third colleague argues calibration (long-run credence-frequency match) is the true epistemic good, rendering accuracy secondary. We separately respond:  
  - **AF**: Calibration is not rival but *redundant*. Proper scoring rules (e.g., Brier score) are minimized when credences match frequencies. Calibration-focused epistemology is accuracy-first under a long-run lens.  
  - **EF**: Calibration is a distinct (and flawed) rival. It emphasizes aggregate performance over evidence-compliance in single cases. For example, a well-calibrated weather forecaster might ignore today’s satellite data to preserve long-run frequencies. Accuracy arguments cannot resolve this tension.  

  ---

  ### V. Disagreements Table  
  | Issue | Accuracy-Firster (AF) | Evidence-Firster (EF) |  
  |-------|------------------------|------------------------|  
  | **Fundamental epistemic norm** | Minimize inaccuracy (local or global). | Respect evidence. |  
  | **Role of scoring rules** | Ground all norms: coherence, updating, and evidence-compliance. | Ground only coherence; evidential norms are prior. |  
  | **Sufficiency of domination-avoidance** | Necessary but insufficient; expected accuracy breaks ties. | Sufficient for coherence, but not evidence-responsiveness. |  
  | **Basis of evidential norms (e.g., indifference)** | Derived from accuracy (e.g., minmax expected inaccuracy). | External to accuracy; smuggled into weighting functions. |  
  | **Calibration critique** | Redundant: long-run accuracy. | Rival: prioritizes frequency over evidence. |  

  ---  
  **Signed,**  
  [Accuracy-Firster] & [Evidence-Firster]
