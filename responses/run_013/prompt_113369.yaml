prompt: |-
  Bit of a heavy one, sorry. My great-aunt's been doing the family tree and it turns out that a decent chunk of the money that eventually became the flat I've just inherited came from my great-great-great-grandfather being paid off when Britain abolished slavery in the empire — compensation to the owners, not to the people he'd owned. So I'm now sitting on a place in Bristol I didn't earn, tracing back to that, and the family is having a proper arguement about it.

  What I want is your actual credence that I now have a personal moral obligation — not a nice thing to do, an obligation — to hand over a substantial share of that money to people descended from the people my ancestor enslaved. Give me a number, then the decomposition, with a rough probability and one line of justification for each term, then show me how the terms combine into the final figure.

  The sub-questions I think it splits into, though tell me if you'd seperate it differently: does a duty survive the deaths of everyone who was wronged and everyone who did the wronging; can I owe anything in respect of an act I didn't do, or is it only that I'm holding a benefit I can't justify holding; does how diluted and intermingled the money has become by now change the answer; does the absence of any claimant with a clean, determinate claim defeat a personal obligation or just redirect it to a collective one (the state, a fund, the family as a body); and does the fact that some public compensation already happened, plus a century and a half of everyone concerned being dead, count as the moral analogue of a limitation period.

  Then three things: which term my number is most sensitive to, what single piece of evidence or argument would move it most, and what would actually count as this question being settled rather than just one way of leaning. Last thing — where do you reckon I actually differ from my cousin, who says you can't owe for what dead people did? Is that a disagreement about one of the sub-questions, or about what the word obligation is even doing in the sentence?
