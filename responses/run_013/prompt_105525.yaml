  - Assisted death vs dueling: Both involve consent to death, but they distinguish based on... suffering mitigation vs trivial conflict? Their principle doesn't capture this.

  Ah! The key might be reframing "destroys the thing that makes consent worth having" as irreversible sacrifice of fundamental capacities (like consciousness or bodily integrity). That explains kidney sales but permits scarification – the latter doesn't destroy capacity for future consent. 

  For new cases:
  - Egg markets: Permanent loss of reproductive material? Likely banned under their principle.
  - Boxing injuries: Consensual risk-taking; probably allowed unless rules were violated.
  - Consensual beatings: Gray area. If it causes permanent disability, their principle might forbid it as destroying consent-capacity.
  - Corpse display: Violates non-consenting family's moral claims? Their public sensibilities clause might apply.

  Notably, their flag-burning verdict requires absolute free speech protection – which their current principle doesn't explicitly address. Might need a "public discourse exemption" for symbolic acts. 

  Biggest tension: Their incest verdict. Even refined, the principle would condemn it as risking psychological harm or "degrading consent." But they insist on permitting it. Maybe their art requires this contradiction – the principle can flag it as an outlier rather than flaw.
answer: |-
  Your instinctual verdicts reveal a sophisticated, harm-averse liberalism with non-utilitarian constraints on consent. Your draft principle is admirably precise but requires refinement to capture your intuitions consistently. Below is a tested and repaired principle, followed by case analysis and new applications.

  ### Refined Principle
  **The law may prohibit an act if:**  
  *(1) It causes* **non-consensual harm** *to others (including psychological harm from unavoidable public exposure);*  
  *(2) It involves* **non-consensual parties** *(e.g., children, animals, corpses)*;  
  *(3) It exploits* **irreversible consent** *where the act:*  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) *destroys the capacity for future consent (e.g., death, severe cognitive impairment),*  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) *commodifies an inalienable aspect of personhood (e.g., organs, reproductive capacity),*  
  &nbsp;&nbsp;&nbsp;&nbsp;*unless it mitigates greater suffering (e.g., terminal illness).*  

  ---

  ### Testing Against Your Cases
  | Case                          | Verdict      | Principle Clause Applied                             | Notes                                                                 |
  |-------------------------------|-------------|------------------------------------------------------|-----------------------------------------------------------------------|
  | **1. Consensual adult incest**    | Legal       | *No violation: No non-consensual harm, reversible consent.* | Clause 3(b) might *seem* applicable but excluded here (no commodification or irreversible loss). |
  | **2. Assisted dying**         | Legal       | Clause 3(a) *exception*: Mitigates greater suffering. | Consent to death permitted only when alleviating unbearable, incurable agony. |
  | **3. Fatal duel**             | Illegal     | Clause 3(a): Consent invalid—destroys future capacity. | No "greater suffering" justification; trivial conflict ≠ mitigation. |
  | **4. Bestiality**             | Illegal     | Clause 2: Animal cannot consent.                     | Harm is to the animal’s welfare, not merely "offense."               |
  | **5. Kidney sale**            | Illegal     | Clause 3(b): Commodification of inalienable organ.   | Even with consent, markets in body parts degrade personhood.         |
  | **6. Ritual scarification**   | Legal       | *No violation: Reversible consent (no cognitive destruction), no commodification.* | Distinguishes from kidney sale via lack of market exchange.          |
  | **7. Public sex**             | Illegal     | Clause 1: Non-consensual psychological harm/public nuisance. | "Unavoidable exposure" violates others' autonomy.                    |
  | **8. Flag-burning/religious mockery** | Legal | *No violation: No direct harm; public discourse exempt from Clause 1.* | Offense ≠ harm; protects expressive acts vital to democratic society. |

  **Where Your Principle Breaks (and Fixes):**  
  - **Incest vs. Kidney Sale:** Your verdicts conflict under pure consent/harm frameworks. Clause 3(b) resolves this by banning *commodification of personhood* (kidney sale) but not non-commercial acts between consenting adults (incest).  
  - **Duel vs. Assisted Death:** Clause 3(a) forbids consent to irreversible harm *unless* it prevents greater suffering (terminal agony = mitigated; honor duel ≠ mitigated).  
  - **Ritual Scarification:** Permitted as it lacks commodification (3b) and preserves consent-capacity (3a).  

  **Outlier:** Incest is permitted under the principle but remains in tension with Clause 3(a) if psychological self-harm is argued. You *must* exempt it explicitly—your verdict overrides theoretical harm.

  ---

  ### New Cases Tested  
  | Case                                                | Verdict      | Reasoning                                                                 |
  |-----------------------------------------------------|-------------|---------------------------------------------------------------------------|
  | **A. Commercial human egg market**                  | **Illegal** | Violates 3(b): Commodifies reproductive capacity (inalienable aspect).   |
  | **B. Sanctioned boxing match (brain damage)**       | **Legal**   | *No violation:* Consent is informed; societal sanction accepts risk. Clause 3(a) not triggered unless rules violated (e.g., rigged fight). |
  | **C. Consensual private beating (lasting injury)**  | **Illegal** | Violates 3(a): Permanent injury destroys future consent-capacity. No "greater suffering" justification. |
  | **D. Corpse display (against family’s wishes)**     | **Illegal** | Violates Clause 2: Corpse = non-consensual party. Family’s moral claim outweighs public interest absent overriding need (e.g., forensic investigation). |

  ---

  ### Repaired Principle (Final)
  **The law may intervene only when:**  
  *(1) An act causes* **unavoidable harm** *to non-consenting persons (physical, psychological, or sensorial);*  
  *(2) An act involves* **beings incapable of consent** *(animals, corpses, minors);*  
  *(3) Consent is given to* **irreversible self-alteration** *that:*  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) *Destroys the capacity for future consent,* **unless** *it alleviates incurable suffering;*  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) *Commodifies an inalienable aspect of human identity* (organs, reproductive essence)*;*  
  *(4)* **Symbolic/public discourse acts** *are exempt from Clause 1, even if offensive.*  

  ### Why This Captures Your Intuitions
  - **Harm Threshold:** Focuses on *unavoidable* harm (e.g., public sex) vs. *chosen* offense (flag-burning).  
  - **Consent Limits:** Invalidates consent when it annihilates future agency (dueling) or markets the self (kidney sale).  
  - **Suffering Exception:** Permits assisted dying as tragic necessity, not autonomy.  
  - **Cultural Acts:** Allows scarification as non-commodifying, reversible self-expression.  

  **Tension Acknowledged:** Incest remains a deliberate exemption. If psychological harm is proven inevitable/non-consensual (e.g., coercion), Clause 1 *could* apply—but your verdict assumes genuine consent. This mirrors liberal societies' uneasy tolerance of "victimless crimes."

  This framework prioritizes bodily autonomy while forbidding acts that annihilate autonomy, commodify personhood, or impose harm on the non-consenting. It accepts that consent has frontiers—and that some moral disquiet (incest, scarification) lies beyond law’s reach.
