  **IN THE UNITED STATES DISTRICT COURT FOR THE DISTRICT OF COLUMBIA**

  Dr. Arthur Finch, )
  Plaintiff, )
  )
  v. ) Case No.: 1:24-cv-00321
  Omnibus Loan Servicing Corp., )
  Defendant. )

  **COMPLAINT FOR DECLARATORY AND INJUNCTIVE RELIEF**

  Plaintiff, Dr. Arthur Finch, appearing pro se, complains against Defendant, Omnibus Loan Servicing Corp. ("Omnibus"), and alleges as follows:

  1.  This Court has jurisdiction under 28 U.S.C. § 1331 (federal question) and 28 U.S.C. § 2201 (Declaratory Judgment Act). The matter in controversy exceeds $75,000.
  2.  Plaintiff is a retired industrial chemist residing at 1721 Euclid Avenue NW, Washington, D.C. 20009. His current scholarly focus is social ontology.
  3.  Defendant Omnibus Loan Servicing Corp. is a corporation organized under the laws of Delaware, with its principal place of business in Wilmington, DE. It services Plaintiff's residential mortgage loan.
  4.  On or about June 15, 2010, Plaintiff executed a promissory note ("the Note") secured by a deed of trust ("the Deed") on the property located at 1721 Euclid Avenue NW, Washington, D.C. 20009 ("the Property"), in the original principal amount of $425,000.00.
  5.  Defendant Omnibus currently services the Note and Deed, demanding monthly payments from Plaintiff in United States dollars.
  6.  Plaintiff contends that the debt obligation represented by the Note is null and void *ab initio*, requiring declaratory judgment to that effect and a permanent injunction barring Defendant from any collection activity, including foreclosure.

  **GROUNDS FOR RELIEF**

  7.  The obligation Plaintiff allegedly owes arises solely from the purported exchange of "money" – specifically, United States dollars – at the loan's inception and the demand for repayment in the same medium.
  8.  "Money," as a functional entity enabling complex economic transactions like mortgage lending, is not a physical substance with inherent, intrinsic value independent of human agreement.
  9.  Money functions as a medium of exchange, unit of account, and store of value *only* by virtue of a complex network of collective beliefs, practices, and rules accepted by a vast community of actors within an economic system.
  10. The properties that constitute something *as* money (e.g., acceptability for payment of debts, standard of value) are not inherent physical properties but are *assigned* properties, dependent entirely on the collective recognition and acceptance of those properties by the relevant community.
  11. This collective acceptance constitutes a foundational social institution. The institution of money exists precisely *because* individuals within the relevant society mutually recognize certain objects or tokens as possessing these specific monetary functions and act accordingly.
  12. Crucially, the existence and functional efficacy of such a socially constructed institution are not contingent upon the beliefs or acceptance of any single individual within that society. An individual cannot, through personal disbelief or withdrawal of acceptance, unilaterally dissolve the institutional facts and powers created by the collective framework.
  13. Plaintiff acknowledges that specific physical tokens (e.g., Federal Reserve notes, digital ledger entries) serve as the current *realization* of the money institution within the United States economy. However, the *institution itself* – the framework of rules, roles, and collective intentionality that assigns value and function to those tokens – is distinct from its contingent physical manifestations.
  14. The function served by the money institution (facilitating exchange, quantifying value) is essential for complex economies. The specific realization (paper dollars, digital credits) is historically contingent and could, in principle, be realized differently without altering the core function. The debt obligation, however, is explicitly tied to the *current realization* (U.S. dollars), not the abstract function.
  15. Plaintiff, as a single individual, fundamentally rejects the collective acceptance underpinning the assignment of monetary value and function to U.S. dollars. He does not recognize their validity as a medium of exchange or store of value beyond their physical substrate (paper, ink, electrons).
  16. Because the validity and enforceability of the debt obligation are predicated entirely on the existence and function of this socially constructed institution of money – an institution Plaintiff unilaterally rejects – the foundation of the alleged debt is nullified *for Plaintiff*.
  17. Forcing Plaintiff to repay in U.S. dollars constitutes an attempt to impose upon him the collective acceptance of a social institution from which he has withdrawn, violating principles of consensual obligation. The debt, lacking a valid foundation in a mutually recognized institution from Plaintiff's perspective, is void.
  18. **Plaintiff concedes, as a minor procedural caveat, that this Court is itself an institution constituted by collective acceptance – namely, the acceptance of the U.S. Constitution, federal statutes, and the rule of law by the citizenry and officers of the United States.** Plaintiff maintains, however, that this does not preclude the Court from recognizing the ontological argument presented herein regarding the separate institution of money and its implications for his specific debt contract.
  19. Defendant Omnibus's continued demands for payment in U.S. dollars and threats of foreclosure based on the alleged debt violate Plaintiff's rights and cause him immediate and irreparable harm, including severe emotional distress and the imminent threat of losing his home.

  **PRAYER FOR RELIEF**

  WHEREFORE, Plaintiff Dr. Arthur Finch respectfully requests that this Court:
  A.  Issue a declaratory judgment that the debt obligation represented by the Note and secured by the Deed on the Property is null and void *ab initio*;
  B.  Issue a permanent injunction prohibiting Defendant Omnibus, its agents, employees, successors, and assigns, from:
      i.   Demanding any further payments on the Note;
      ii.  Initiating or continuing any foreclosure proceedings related to the Deed;
      iii. Taking any other action to collect the alleged debt;
  C.  Award Plaintiff such other and further relief as the Court deems just and proper.

  Respectfully submitted,
  Dr. Arthur Finch
