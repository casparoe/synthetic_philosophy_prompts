answer: |-
  The argument hinges on premise (2), which claims that the epistemic value of a belief is determined solely by its content and truth-value. This premise is flawed because it ignores that "doing the job well" (from premise (1)) involves more than mere truth—it requires that the belief be non-accidentally true, which depends on factors like justification, reliability, or the manner of formation. A belief does its job of being true better when it is formed or sustained in a truth-conducive way, as this reduces epistemic luck and aligns with the cognitive aim of achieving secure, defensible true beliefs.

  Rejecting (2) avoids the counterintuitive conclusions in (4)-(6) and accommodates your cases: the forecaster with a model, the physicist's belief, testimony from a knower, and proof-checking all yield beliefs with higher epistemic value due to their justificatory basis, even when content and truth-value are identical to less secure counterparts. The "follow-through" (e.g., ability to defend the belief) is not merely about the believer; it reflects the belief's epistemic grounding, which is intrinsic to its value.

  The replacement principle maintains epistemic status because it ties value directly to truth-conduciveness (e.g., justification or reliable processes), not pragmatic benefits. It addresses the objection that "nothing is left to do" for a true belief by showing that additional inquiry (e.g., rechecking) enhances justification, thereby increasing epistemic value even when truth is fixed. For the case of a reliably formed true belief held by someone who cannot defend it and would drop it easily: if the belief is properly based on the reliable process, it may still be knowledge and epistemically valuable; however, if the basing is defective (e.g., due to undue deference to authority), the belief is less epistemically valuable because it lacks stability and resilience, making it more vulnerable to error in practice.

  The cost of abandoning (2) is accepting that epistemic value is gradable and includes properties beyond truth, but this is a standard move in epistemology (e.g., in virtue theories or reliabilism) and does not collapse into prudence, as the value stems from truth-related features like justification.

  \answer{2} Epistemic value depends on content, truth-value, and justification.
