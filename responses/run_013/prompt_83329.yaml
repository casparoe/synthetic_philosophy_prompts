prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been trying to understand the problem of verisimilitude. The naive definition I keep returning to is that a theory's verisimilitude is its true consequences minus its false consequences, understood as a set-theoretic difference. Please explain, at an intuitive level, why that definition fails. For instance, if theory A is false, why can't a rival B simply have all of A's true consequences plus more, and fewer false consequences? I'm comfortable with set inclusion and partial orders, so an explanation in those terms would be helpful. End with a one-sentence summary on a final line beginning Summary:.
reasoning: |-
  Okay, the user is a software engineer without a formal philosophy background trying to grasp why the intuitive set-theoretic approach to verisimilitude fails. They've proposed a definition where verisimilitude equals true consequences minus false consequences, and they're puzzled why a false theory B can't just contain all of A's truths plus more truths while having fewer falsehoods.  

  First, I need to recall why Popper's initial set-theoretic definition collapsed under logical scrutiny. The core problem is that theories aren't just bags of consequences—they're structured entities where adding consequences can trigger unexpected logical relationships. The Tichý-Miller theorem is key here: it proves that if Theory A is false, you can't have another false Theory B that contains all of A's truths plus extras while avoiding A's falsehoods. Why? Because the moment you try to add a new true consequence, it might logically necessitate one of A's false consequences.  

  For example, take the "box size" scenario the user mentioned. If Theory A wrongly claims the box is 2×2m, its truths might include "area ≥ 1m²" and falsehoods "area=4m²". Now if Theory B says it's 3×3m, its truths include A's truths (like area≥1m²) plus new truths (area=9m²), but it also has a *different* false consequence—"area=9m²" is false if the real area is 5m². Crucially, B *doesn't* avoid A's falsehood "area=4m²" because that statement is actually *true* for B (B entails it? No, wait—logical entailment is the issue). Actually, B doesn't entail A's falsehood; it contradicts it. But the deeper problem is that B's new truth "area=9m²" is false, and worse, to have more truths than A, B must make claims that—by virtue of the real area being 5m²—introduce *new* falsehoods that might be "worse" in some way.  

  The Tichý-Miller theorem formalizes this: if two theories are both false, one can't be strictly closer by containing all the other's truths and avoiding its falsehoods. Adding truths forces either losing some truths or gaining falsehoods. This isn't obvious because in software, we often think compositionally—but logical entailment doesn't work that way.  

  The user's set-operation analogy fails because consequences aren't independent; they're linked by implication. If you try to expand the set of true consequences beyond A's truths, you might inadvertently include statements that imply A's false consequences or introduce new ones.  

  For the explanation, I'll use the box example concretely: real area=5, A says 2×2 (so false, with true consequence "area≥1", false "area=4"). B says 3×3—true consequences include "area≥1" (matches A) and "area≥4" (new truth), but false consequence "area=9". Now, does B have *all* of A's truths? Yes ("area≥1"). Does it avoid A's falsehoods? Yes, since B doesn't claim area=4. But is B *closer*? Not necessarily—it added a new falsehood "area=9" which is *farther* from 5 than A's false "area=4". The set definition doesn't capture *degree* of falsity.  

  Moreover, Miller later showed that even comparing purely qualitative consequences (without numbers) fails if the language changes—e.g., describing area in terms of width/height vs. min/max dimensions. This means verisimilitude isn't just about consequence sets; it's sensitive to how we describe the world.  

  The user understands partial orders, so I'll emphasize that "contains all true consequences of A and more" isn't a partial order that works here because the "more" part can force falsehoods. The subset relation on true consequences doesn't extend to avoiding false ones.  

  Finally, the summary must be crisp: the naive set approach fails because adding true consequences to a false theory forces new false consequences or reintroduces old ones, while ignoring the severity of errors.
answer: |-
  Your intuition about verisimilitude (truthlikeness) as a set difference (`True Consequences - False Consequences`) is appealing but runs into a fundamental logical problem, demonstrated by the **Tichý-Miller theorem**. Here's an intuitive breakdown using set inclusion and partial orders:

  1.  **The Core Problem: Adding Truths Forces New Falsehoods (or Reintroduces Old Ones)**
      *   Suppose Theory A is false. It has some true consequences (T_A) and some false consequences (F_A).
      *   You want Theory B to have *more* true consequences than A (`T_B ⊃ T_A`) and *fewer* false consequences (`F_B ⊂ F_A`), ideally avoiding A's specific falsehoods.
      *   The theorem proves this is **impossible** if B is also false. Adding *any* new true consequence to T_B (beyond T_A) will *force* B to either:
          *   **Introduce a *new* false consequence** not in F_A, or
          *   **Reintroduce at least one of A's original false consequences** from F_A.

  2.  **Why This Happens (Set Inclusion & Entailment):**
      *   Consequences aren't independent atoms; they are linked by logical entailment (→). Adding a new true consequence often means asserting a *stronger* statement.
      *   Strengthening a theory (adding more truths) typically narrows its set of possible models (the worlds it describes).
      *   Because A is *false*, the *actual world* lies outside its set of models.
      *   To add a new true consequence (C_new) not entailed by A, B must exclude some models that A allowed. Crucially, among the models B must exclude to make C_new true, **some might be models where A's *false* consequences (F_A) did *not* hold**.
      *   To exclude these models, B must make a *stronger claim*. This stronger claim risks:
          *   **Directly asserting a new falsehood** (if it overshoots the actual world).
          *   **Entailing one of A's falsehoods** (F_A) *within the context of the actual world*, even if B doesn't directly assert it. If B → F_A and F_A is false in the actual world, then F_A becomes a false consequence of B too.

  3.  **A Concrete Example (Using Sets & Inclusion):**
      *   **Actual World:** A box has width = 2m, height = 3m. Area = 6m².
      *   **False Theory A:** "Width = 2m & Height = 2m" (A claims Area=4m²)
          *   *T_A*: {Width=2m, Width≥1m, Width≤3m, Height≥1m, Height≤3m, Area≥1m², Area≤9m², ...} (All true statements *entailed* by A)
          *   *F_A*: {Height=2m, Area=4m², ...} (False statements entailed by A)
      *   **Proposed "Better" False Theory B:** We want B to keep *all* of T_A, add a *new* truth (e.g., Area>4m²), and avoid F_A (specifically avoid Height=2m and Area=4m²).
          *   Suppose B: "Width = 2m & Height = 3m & Area = 5m²". (B gets height right but area wrong).
          *   *T_B*: Contains *all* of T_A (e.g., Width=2m, Width≥1m, etc.). Also contains new truths like Height=3m, Area>4m². `T_B ⊃ T_A` ✔
          *   *F_B*: {Area=5m²} (a *new* false consequence, not in F_A). `F_B ⊄ F_A` (F_A contained Height=2m/Area=4m², F_B contains Area=5m²). B *does* avoid A's *specific* falsehoods (Height=2m, Area=4m² are *not* consequences of B).
      *   **Problem 1:** B introduced a *new* falsehood (Area=5m²). The set definition (`|T| - |F|`) might judge B as worse than A (if 1 new truth outweighs 1 new falsehood?) or better, but it doesn't cleanly satisfy `T_B ⊃ T_A` and `F_B ⊂ F_A`.
      *   **The Deeper Problem (Tichý-Miller):** Can we find a B that adds a truth *without* adding a *new* falsehood? Suppose B: "Width = 2m & Height > 2m".
          *   *T_B*: Contains *all* of T_A? **No!** A entailed "Height=2m". B entails "Height > 2m". The statement "Height=2m" is **not** a consequence of B. B lost one of A's *true* consequences (`T_B ⊅ T_A`). B *does* add the new truth "Height>2m".
          *   *F_B*: {Area=6m²?} No, B doesn't specify area precisely. But crucially, to *keep* T_A (specifically "Height=2m"), B *must* also entail F_A ("Height=2m" forces Area=4m² under B's width assumption). You cannot add "Height>2m" (a new truth) while *keeping* "Height=2m" (an old truth from A) – they are contradictory. **To add one truth, you must drop another.**

  4.  **Partial Order Perspective:**
      *   You'd like a partial order where B > A if `T_B ⊇ T_A` and `F_B ⊆ F_A`, with at least one strict inclusion.
      *   The Tichý-Miller theorem shows that for any two distinct *false* theories, this relation **never holds**. It's impossible for one false theory to strictly contain the other's truths while also strictly containing a subset of its falsehoods. The act of "adding truths" to a false theory inevitably forces the inclusion of *new* falsehoods or the exclusion of *old* truths.

  **Summary:** The naive set definition fails because adding true consequences to a false theory inevitably forces either new false consequences or the loss of some of its original true consequences, preventing the required set inclusions (`T_B ⊃ T_A` and `F_B ⊂ F_A`).
