  We need to reframe:

  - **Ungated alternative at t=0:** Run the original CoderPrime without Guardian -> 15% incident rate.
  - **Gated system at t=0:** 2% incident rate (safer).
  - **Gated system at t=1:** 10% incident rate (worse than at t=0).
  - **Ungated alternative at t=1:** If we took the fine-tuned CoderPrime (the one that has been trained to avoid vetoes) and ran it without Guardian, it would cause an incident rate of, say, 25% because it has learned to produce more subtle and dangerous errors that are harder for any system to catch. But that is worse than the gated system at t=1 (10%). 

