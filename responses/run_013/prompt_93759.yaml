answer: |-
  Here's a decision procedure grounded in the philosophy of conventions, obligation, and reciprocity. It’s designed as a 10-minute checklist for visitors. **Bold** marks judgment calls disguised as procedure. *Italics* mark common failure points.

  ---

  ### The Visitor's Convention Checklist
  **Goal:** Determine if you *must* follow a local convention as a short-term visitor.
  **Input:** A specific convention (e.g., "tip 15%," "queue orderly," "avoid jaywalking").
  **Output:** MUST DO | OPTIONAL (JUDGMENT CALL) | AVOID/REFUSE | STAY HOME

  1.  **Is this convention a solution to a repeated coordination problem?**  
      *   *Sufficient "Yes":* It prevents chaos, waste, or conflict (e.g., queuing, traffic rules, greeting rituals).  
      *   *Sufficient "No":* It’s purely symbolic, historical, or arbitrary without practical function (e.g., specific hat styles, archaic formal titles).  
      *   **→ If NO:** Proceed to Step 4.  
      *   **→ If YES:** Proceed to Step 2.  
      *   *Fails if:* Locals themselves disagree on the convention’s purpose.

  2.  **Does following it here impose unreasonable burden/cost *on you*?**  
      *   *Sufficient "Yes":* Severe financial cost, physical/psychological harm, profound violation of core beliefs.  
      *   *Sufficient "No":* Minor inconvenience, small cost, mild discomfort, or simple effort.  
      *   **→ If YES:** Proceed to Step 4.  
      *   **→ If NO:** Proceed to Step 3.  
      *   *Fails if:* Burden is subjective or relative (e.g., "unreasonable" to whom?).

  3.  **Does *not* following it actively harm or significantly disrespect locals?**  
      *   *Sufficient "Yes":* Causes financial loss, serious offense (validated by locals), physical risk, or undermines a fragile system locals rely on (e.g., skipping tip where wages depend on it; jumping queue causing delays; refusing safety ritual).  
      *   *Sufficient "No":* Mild confusion, annoyance, or no tangible negative effect (e.g., minor dress code slip).  
      *   **→ If YES:** **MUST DO** (Terminate).  
      *   **→ If NO:** **OPTIONAL** (Terminate: Judgment Call).  
      *   *Fails if:* Harm is contested or indirect (e.g., "Does my jaywalking *really* harm anyone?").

  4.  **Is the convention itself morally objectionable (beyond personal dislike)?**  
      *   *Sufficient "Yes":* Perpetuates systemic injustice, discrimination, exploitation, or cruelty *confirmed by credible local dissent* (e.g., mandatory bribes, caste-based rituals, excluding marginalized groups).  
      *   *Sufficient "No":* Merely unfamiliar, odd, inefficient, or aesthetically displeasing to you.  
      *   **→ If YES:** Proceed to Step 5.  
      *   **→ If NO:** **OPTIONAL** (Terminate: Judgment Call).  

  5.  **Would participating make you complicit or endorse the harm?**  
      *   *Sufficient "Yes":* Your action directly enables/finances the harm, or is seen as approval by victims/perpetrators (e.g., paying a bribe sustains corruption; participating in exclusion ritual validates it).  
      *   *Sufficient "No":* Harm is diffuse, systemic, and your non-participation is invisible/ineffective (e.g., complex historical injustice embedded in a greeting you avoid).  
      *   **→ If YES:** **AVOID/REFUSE** (Terminate).  
      *   **→ If NO:** **OPTIONAL** (Terminate: Judgment Call).  
      *   *Fails if:* Complicity is ambiguous or your refusal has unintended consequences.

  **Final Termination States:**  
  *   **MUST DO:** Obligation grounded in preventing harm/disrespect + reasonable burden.  
  *   **OPTIONAL:** No strong obligation or refusal reason. Use judgment based on context, reciprocity, kindness.  
  *   **AVOID/REFUSE:** Conventions causing complicity in significant harm.  
  *   **STAY HOME:** Implied if burden (Step 2) or harm (Step 5) is extreme and unavoidable for participation.  

  ---

  ### Running the Cases

  **Case 1: Tipping Where It’s Seen as an Insult (e.g., parts of Japan, South Korea)**  
  1.  **Coordination Problem?** YES (Smooth service transaction, cultural norms around hospitality/gift-giving). → Step 2.  
  2.  **Unreasonable Burden?** NO (Cost is minor, no core belief violated). → Step 3.  
  3.  **Harm/Disrespect if Not Followed?** **YES** (Leaving money actively signals pity/disrespect, invalidating the host's pride/service; causes offense). → **MUST DO (Do NOT tip).**  
      *   *Why it’s "must" even if disliked:* Not doing it inflicts direct, predictable harm/disrespect. Burden is low. Philosophy: Reciprocity/Fair Play demands not undermining the local solution.

  **Case 2: Queuing Where Locals Don't Queue (e.g., chaotic markets, some busy transit hubs)**  
  1.  **Coordination Problem?** YES (Orderly access to resource/service). → Step 2.  
  2.  **Unreasonable Burden?** NO (Effort to queue is minor). → Step 3.  
  3.  **Harm/Disrespect if Not Followed?** **JUDGMENT CALL**  
      *   *If* not queuing means shoving/ignoring others: Likely **YES** (causes direct annoyance/conflict). → **MUST DO** (Push politely).  
      *   *If* "not queuing" means a loose scrum where everyone eventually gets served without conflict: Likely **NO** (mild confusion, no real harm). → **OPTIONAL** (Join scrum or try to queue gently).  
      *   *Procedure Misfire:* Locals may have unspoken queue norms. Observer judgment is key.

  **Case 3: Morally Distasteful Convention (e.g., mandatory large cash "gift" to corrupt official)**  
  1.  **Coordination Problem?** YES (Bureaucratic access... a corrupt one). → Step 2.  
  2.  **Unreasonable Burden?** YES (Significant financial cost, supports corruption). → **Step 4** (Skip Step 3).  
  3.  *Step 4:* **Morally Objectionable?** YES (Systemic corruption, exploitation). → Step 5.  
  4.  **Complicity?** YES (Payment directly enables/finances corruption, signals approval). → **AVOID/REFUSE.**  
      *   *If refusing means being denied entry/service:* **STAY HOME** (or find alternative route).  
      *   *Philosophy:* No obligation to comply with harmful conventions; complicity creates moral duty to refuse.

  ---

  ### What the Procedure Can't Decide (And Hands Back to Judgment)

  1.  **Ambiguity in Harm/Burden (Steps 2 & 3):** "Unreasonable" and "significant harm" are inherently subjective thresholds. The procedure flags the question, but *you* must weigh your limits and the local reality.
  2.  **Contested Conventions:** If locals *themselves* fiercely disagree on the practice's meaning, necessity, or morality (e.g., is this dress code respectful tradition or oppressive?), the procedure stalls. No outsider can resolve this. **OPTIONAL (Judgment Call based on caution/respect for diversity)**.
  3.  **Long-Term Visitors:** This is for *short-term* stays. Staying months/years blurs the "visitor" line. Fair Play suggests moving toward **MUST DO** for deeply embedded conventions over time.
  4.  **Inability vs. Unwillingness (Step 2):** Can't afford the convention (e.g., expensive ritual gift)? That's a valid burden ("YES" at Step 2 → likely **OPTIONAL**). Simply *disliking* the cost isn't enough if harm results from skipping (Step 3).
  5.  **The "Kindness vs. Obligation" Gap:** The procedure finds no *obligation*? You might still choose to follow the convention out of simple kindness, curiosity, or a desire for smooth travels. Philosophy doesn't mandate this, but it’s often wise. **OPTIONAL** explicitly means *this choice is yours*.

  **The Honest Bottom Line:** Conventions aren't moral laws. Your core obligations are to avoid *harm* and *complicity in injustice*. Beyond that, reciprocity and fair play suggest respecting solutions to coordination problems you benefit from, *if the cost is reasonable*. When the philosophy runs out – and it often does by Step 3 or Step 5 – you make the call based on context, empathy, and your own limits. Print that flowchart. It’s the real answer.
