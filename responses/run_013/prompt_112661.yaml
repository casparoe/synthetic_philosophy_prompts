  Okay, let's start by unpacking the user's request. They want to rehearse an argument against their "exit-cost franchise" position. The core idea is that decision-making power should belong to those who can't escape the consequences, with voting strength tied to the cost of leaving. The user opposes the traditional view of a fixed demos based on residency or citizenship.

  The user presents a case study: a coastal city referendum on a seawall. The seawall benefits property owners who can leave, while harming vulnerable groups—tenants, undocumented residents, and generational fishing families. The user challenges why the fixed-membership demos includes mobile landlords but excludes those immobile and heavily affected.

  Hmm, the user's scenario is well-crafted to highlight the moral problem with fixed boundaries. They’re forcing a confrontation between procedural legitimacy (fixed demos) and outcome fairness (exit-cost). Their challenge is sharp: either defend the fixed demos' ability to function as a collective agent, or explain how justice claims can be addressed without voting power.

  The user’s deeper need seems to be stress-testing their theory against a robust adversary. They don’t want textbook answers; they want to simulate a real intellectual duel. Their frustration with abstract theory is clear—they demand practical argumentation grounded in the seawall case. 

  I should embody a principled defender of fixed demos. Key points to hit: collective agency requires continuity, exit-cost would fracture the demos into issue-specific fragments, and justice claims (while valid) are distinct from franchise questions. Must concede that the seawall outcome seems unjust but insist that dissolving fixed boundaries creates worse problems—like instability or inability to govern holistically. 

  The emotional subtext: user feels their exit-cost model better handles vulnerability. My counter must acknowledge that pain while arguing fixed demos protects long-term autonomy. No jargon—this is about who gets to *be* "we" when deciding shared fates. 

  Biggest risk: sounding bureaucratic. Must frame fixed membership as the scaffold for mutual responsibility, not just administrative convenience. The fishing families’ plight isn’t ignored; it’s channeled through representation and accountability mechanisms *within* the demos. 

  Final note: user’s "how can justice be answered by the voters?" is the killer question. My reply must separate the *authority* to decide from the *obligation* to decide justly. The demos can vote unjustly—but its fixed nature lets us hold it accountable afterward, whereas fluid franchise evaporates after each vote.
answer: |-
  Very well, I accept the challenge and will defend the fixed demos position rigorously. Your seawall case presents a genuine tension, but dissolving the demos into shifting, decision-specific constituencies undermines the very possibility of collective self-rule itself. The principle is this: a political community capable of *authoring* laws and *being held responsible* for their consequences must persist over time as a recognizable agent. It requires shared institutions, deliberation, and mutual accountability – impossible if "the people" dissolves and re-forms with every vote. The fixed boundary, defined by residence or citizenship, establishes *who constitutes the ongoing collective subject* entrusted with governing their common life.

  Your exit-cost criterion, while highlighting real vulnerability, makes the demos *ephemeral*. The fishing families tragically lack exit options, but so might residents elsewhere facing different policies tomorrow. There is no stable "we" to deliberate, compromise, or bear retrospective judgment. The mobile landlord *is* part of the ongoing community tasked with shaping its future *now*, even if he leaves later; his vote reflects his current stake *as a member*. Conceding that the outcome seems unjust, the answer isn't to fragment the franchise but to strengthen *within* the fixed demos the mechanisms for hearing and weighing the claims of the vulnerable – through representation, rights protections, or procedural justice. Their claim *is* to be heard and considered by the body authorized to govern them, not to fragment that body. A claim never voted on is answered *through* the political process of the demos itself – debate, advocacy, elections holding representatives accountable for injustice – precisely because a stable demos enables such ongoing contestation. Without that fixed frame, there is no "they" to be answerable at all.

