prompt: |-
  I'm a PhD student in philosophy of biology working on the reductionism debates, and I want you to argue for a claim I'm trying to make precise. Take Dennett's contrast between cranes (sub-mechanisms that are themselves products of selection) and skyhooks (posits that do explanatory work without having been earned), together with his associated charge of greedy reductionism (dissolving a phenomenon into parts in a way that leaves the phenomenon itself unaccounted for). Please argue, as forcefully as you can, that this apparatus cannot do the demarcating work asked of it, because cranehood is relative to a level of description rather than intrinsic to a mechanism — whatever first produced a self-replicator functions as a skyhook for evolutionary theory and a crane for chemistry — so that greedy reductionism names no distinct explanatory vice. Then tell me the strongest single objection to the argument you have given.
