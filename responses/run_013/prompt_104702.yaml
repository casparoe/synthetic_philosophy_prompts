prompt: |-
  So I keep argueing with a friend about lexical-threshold negative utilitarianism, the version where suffering is lexically prior to pleasure only once it clears some threshold, and below the threshold it's a normal tradeoff. I want a thought experiment built to order. Specs: it has to make that view and a plain one-scale commensurabilist (pleasure and pain on a single additive scale, no threshold) give opposite verdicts on the same choice, using only finite, ordinary-scale amounts — no dust specks, no torture vs 3^^^3, nothing infinite, and ideally something that could happen to ordinary people rather than a sci-fi setup. One paragraph for the scenario. Then walk me through what each view says and why, and be honest about which feature of the case is doing the real work here — is it actually the threshold, or just the size of the numbers? — and what happens to the disagreement if you drop the threshold. Also, how would a commensurabilist who thinks the threshold is ad hoc attack the case? Finish by telling me how confident you are in all this and which single step you're least sure about.
