prompt: |-
  Ok so I've somehow been voluntold to run the next session of our local rationalist-ish reading group — it's about fifteen people, smart, numerate, mostly programmers and a couple of med students, nobody with actual philosophy training, and we have 90 minutes and a whiteboard. Topic is the inefficacy objection: the "my individual contribution to this collective harm makes no difference, so what's the point" thing, across the big three (climate, meat, voting). I don't want you to explain the topic to me — I can more or less do that. I want you to plan how I should teach it. Like, the teaching plan.

  What I need from you, roughly in order of how much I care:

  1. The order the ideas have to go in, and why each one depends on the previous. My instinct is that the whole thing hinges on one move — getting people to stop thinking of causation as on/off ("did I cause it?") and start thinking in terms of difference-making and marginal effects — and that until that's in place everything else is noise. But I might be wrong about where the load-bearing bit is. Tell me what genuinely has to come first, and what I'll lose if I skip a step.

  2. The one example that carries the whole session, and what it has to have. I was going to build on voting, but I suspect voting is a bad carrier because it has a clean threshold — there's a fact of the matter about whether you're pivotal, so students can just do the probability arithmetic and walk away feeling fine. Meat has the marginal-production story, climate has neither a clean threshold nor clean attribution. Which do I build on, and what does that example need to have (and lack) to keep the real puzzle alive? Also, I vaguely remember some thought experiment with a thousand torturers each turning a dial a thousandth of a degree, so nobody's pain is perceptibly worse but the victim is being tortured — I think it's Parfit, maybe not, but something like that. Should that be the carrier, or is it too tidy?

  3. The misconceptions I should expect, and exactly where in the sequence to head each one off. My guesses: (a) "the outcome would've been the same without me, therefore no difference" — the fixed-pie / supply-doesn't-respond fallacy; (b) "one vote can't decide an election" conflating being decisive with having influence; (c) "no perceptible difference = no difference"; (d) assuming the arithmetic settles it, when the arithmetic answer is itself the contested part. Which of those are real, which am I making up, and what am I missing? Especially: do people reliably conflate causal contribution with complicity, or do they keep them apart better than I think?

  4. How I'll know by the end whether they actually got it, rather than just feeling bad about eating burgers. One question, ideally.

  5. What I should openly refuse to cover at this level and say so.

  And one thing I really care about: keep the settled stuff and the genuinely contested stuff separate. I have a nagging feeling the blogosphere presents "buying meat causes animals to be bred and killed" and "your vote has nonzero expected impact" as much more settled than they are among people who've actually worked on this, and I don't want to stand up there and present one camp's answer as the consensus. Where the field is split, say so, and tell me which way you're leaning and why. Don't send me readings or a bibliography, I'm not assigning anything and I'd just be bluffing about citations anyway.
reasoning: |-
  Okay, the user is preparing to lead a session on the inefficacy objection for their rationalist reading group. They need a structured teaching plan focused on sequencing, a central example, addressing misconceptions, assessment, and clarifying contested areas. 

  First, the key insight is shifting from binary causation to marginal contribution. This foundational step must come first—without it, subsequent arguments won't land. I recall Derek Parfit's "harmless torturers" thought experiment perfectly illustrates continuous marginal harm. It avoids the pitfalls of voting (clean thresholds) and meat/climate (messy real-world factors). 

  For sequencing: Start with Parfit to establish marginal difference-making. Then apply it to meat production (supply elasticity) and voting (expected impact), saving climate for last due to attribution complexities. This order builds from clear philosophy to applied ethics. 

  Major misconceptions to preempt: 
  - "No perceptible difference = no difference" (countered in Step 2) 
  - "Fixed pie" fallacy in meat consumption (addressed via stepwise supply chain in Step 3) 
  - Conflating decisiveness with influence in voting (handled via probability in Step 4) 

  Assessment question: "If 100 people identically situated to you stopped [action], would it reduce harm? If yes, does your individual continuation prevent that reduction?" This tests grasp of marginal contribution without demanding math. 

  Contested areas: 
  - Climate attribution is legitimately messy (highlight modeling uncertainty) 
  - Voting's expected impact is technically sound but feels counterintuitive (acknowledge psychological disconnect) 
  - Avoid overstating meat consumption's impact—focus on clear supply-chain mechanics 

  The user's nuanced awareness (e.g., not oversimplifying voting math) suggests they'll handle these well. The session should firmly establish marginal difference-making as the load-bearing concept while leaving room for later debates. 

  Final note: Resist derailment into "efficacy vs. integrity" arguments—that's a separate discussion. Stick to the causal mechanism.
answer: |-
  Here's a battle-tested teaching plan optimized for 90 minutes with your audience. The load-bearing insight *is* your marginal difference-making shift, but it must be anchored properly.

  **Core Sequence (75 mins total):**

  1.  **The Trap: Binary Causation & Threshold Intuition (10 mins)**
      *   **Why first?** You must *expose* their default mental model before replacing it. Start with voting because its threshold is intuitive and feels "safe."
      *   **Activity:** Ask: "In a US presidential election with millions of votes, does your single vote *cause* the outcome? Why/why not?" Whiteboard responses (e.g., "Only if decisive," "Outcome same without me," "Probability near zero"). *Affirm their arithmetic is correct.*
      *   **Goal:** Make the "no difference" intuition explicit and seemingly unassailable. Creates the puzzle.

  2.  **The Key Insight: Marginal Contribution & Continuous Harm (20 mins)**
      *   **Why now?** The Parfit Torturer is the *essential* carrier. Voting can't do this alone; meat/climate are too messy initially.
      *   **Activity:** Present **Parfit's Harmless Torturers**:
          *   1000 torturers, each controls 1 dial.
          *   Each dial has 1000 settings. Victim feels no pain at 0. Feels excruciating pain at 1,000,000.
          *   *Crucially:* Victim feels *no perceptible difference* between setting 999,999 and 1,000,000. Each torturer turning their dial from 0 to 1000 increases the total by 1000, but the difference between *n* and *n+1000* is imperceptible to the victim.
          *   Question: "Did any *single* torturer cause the victim's pain? Did they harm the victim?" Whiteboard debate.
      *   **The Pivot:** "Forget 'causing' the pain. Did each torturer *make the pain worse* than it would have been if they hadn't turned their dial? Even imperceptibly?" Hammer: *Collective harm requires individual contributions. No contribution, no harm.* Introduce "Difference-Making" vs. "Sole Causation."
      *   **Goal:** Shatter the "perceptible difference" and "sole cause" requirements. Establish *marginal contribution to harm* as the core concept.

  3.  **Application 1: Meat Consumption (20 mins)**
      *   **Why now?** Builds directly on Torturers. Supply-chain mechanics are relatively concrete for numerate people.
      *   **Activity:** "Apply the torturer logic to buying a chicken burger."
          *   Whiteboard a simplified supply chain: Consumer Demand -> Order to Supplier -> Slaughterhouse Order -> Farm Breeding Decision (Focus here!).
          *   **Critical Question:** "Does one burger purchase cause a farmer to breed & kill one more chicken?" *No.*
          *   **The Marginal Move:** "Do purchases *collectively* determine how many chickens are bred? Yes. How does the system *respond* at the margin?"
          *   Explain: Suppliers order in batches. Farmers plan flocks based on *expected* demand. Your purchase, combined with others, *influences* that expectation. Over time, aggregate marginal changes shift production. Your purchase is one drop in the bucket determining the bucket's level.
          *   **Head off Misconceptions:**
              *   *(Fixed Pie)*: "But the chicken was already dead!" Counter: "Yes, *this* chicken. But farm decisions for *next* month's chickens are influenced by *this* month's sales data. Your purchase contributes to the signal shaping future harm."
              *   *(No Perceptible Difference)*: "But my one burger changes nothing!" Counter: Link directly to Torturer - imperceptible != nonexistent. Aggregate matters.
      *   **Goal:** Show how marginal difference-making operates in a messy real system with feedback loops and thresholds. Emphasize *influence on aggregate outcomes*.

  4.  **Application 2: Voting Revisited (15 mins)**
      *   **Why now?** Revisit the initial puzzle with the new framework. Voting's "clean" math becomes a feature, not a bug.
      *   **Activity:** Return to the voting question. "Given what we've discussed, how should we think about *your vote* now?"
          *   **The Marginal Move:** "Does your vote *cause* the win? Almost never. Does it *make a difference* to the outcome?" Introduce *Expected Impact*.
          *   Explain: Your vote increases the probability your candidate wins by a tiny amount (pivotal probability). Expected impact = (Value of Win) * (Delta Probability). Tiny probability * immense value = *non-zero* expected impact. Your vote *marginally increases the chance* of the desired outcome.
          *   **Head off Misconceptions:**
              *   *(Conflating Decisive/Influence)*: "But I wasn't pivotal!" Counter: "Pivotal means *decisive*. Influence is about *changing probabilities*. Buying a lottery ticket doesn't *cause* you to win, but it increases your chance above zero. Your vote buys a tiny 'share' in the outcome."
              *   *(Arithmetic Settles It)*: "But the probability is minuscule!" Counter: "Yes, but non-zero. The *ethical* question is: Is a tiny expected impact, multiplied by the immense stakes of an election, sufficient reason to vote? That's a value judgment. The *causal* point is that the impact exists." (Acknowledge this is where debate often shifts).
      *   **Goal:** Show how marginal difference-making applies even with thresholds. Decouple "being decisive" from "having influence."

  5.  **Application 3: Climate Change (10 mins) - Briefly!**
      *   **Why last?** It's the messiest. Requires the foundation.
      *   **Activity:** "Apply the framework to driving your car/using AC."
          *   Acknowledge complexity: No single threshold, long time lags, complex systems, many actors.
          *   **The Marginal Move:** "Does your ton of CO2 *cause* a specific hurricane? No. Does the *global aggregate* of emissions cause climate harm? Yes. Does your emission contribute to that aggregate? Yes. It makes the total *marginally* larger than it would have been without you, increasing the *expected* harm (probabilistically) by a tiny amount."
          *   **Head off Misconceptions:** "(Attribution/Chaos) But it's impossible to trace effects!" Counter: "We don't need to trace specific harms to your specific ton. We know aggregate emissions cause aggregate harm. Your ton is part of the aggregate. Like one torturer's dial turn." Link to Torturers and Meat.
      *   **Goal:** Show the framework *can* be applied even in complex systems, while honestly acknowledging the attribution challenges.

  **Assessment: The One Question (5 mins)**
  *   **"Imagine 100 people *exactly like you* in terms of [Voting/Meat Consumption/Emissions]. If they *all* stopped [action], would it make a positive difference? If YES, does *your individual decision* to continue [action] prevent your share of that positive difference from happening?"**
  *   **Why it works:** Forces them past binary causation ("Did I cause it?") and perceptible difference. Tests if they grasp marginal contribution to the aggregate ("share of that positive difference"). A "No" to the first part rejects collective impact (untenable). A "No" to the second part rejects marginal contribution (the core error). A robust "Yes" to both indicates they got the key move.

  **What to OPENLY Refuse to Cover (State upfront & reiterate):**
  1.  **The "Integrity" Argument:** "Even if it makes no difference, it's about being the kind of person who..." (Say: "That's a *different* valid argument, but today we're *only* tackling the causal 'no difference' claim.")
  2.  **Optimal Altruism/Replaceability:** "But if I don't buy the burger, someone else will!" / "My money saved could be donated more effectively!" (Say: "Those are important critiques of *how much* difference an action makes or *best* actions, but they *presume* the action has *some* expected impact, which is what we're establishing today.")
  3.  **Full Solutions/Policy:** "So what *should* we do about climate/meat?" (Say: "Today is about understanding the *structure* of the problem. Solutions require this foundation, but are a separate, larger discussion.")
  4.  **Deep Meta-Ethics:** Debating the nature of causation itself or moral responsibility beyond marginal contribution. (Say: "We're operating within a standard difference-making/expected utility framework common in this discussion. Deeper philosophical debates are beyond scope.")

  **Contested Areas & Your Stance:**
  *   **Meat:** The supply-chain mechanics (elasticity, batch sizes, signaling) are well-established economics. The *extent* of the marginal effect per unit consumed is debated (how many burgers shift an order? varies by market/time). **Your Stance:** Present the causal mechanism (demand signals influence production) as settled. Acknowledge precision in effect size is hard but the *direction* (positive marginal contribution) is robust. *Leaning: The core inefficacy objection fails here.*
  *   **Voting:** The *mathematics* of non-zero expected impact is uncontroversial (barring weird infinities). The *ethical significance* of that tiny expected impact is hotly debated (Is it sufficient reason? Does it outweigh costs?). **Your Stance:** Affirm the math is sound. Explicitly state the *ethical debate* ("Is it *worth it*?") is separate and unresolved. *Leaning: The 'no difference' claim is factually wrong, but the 'not worth it' claim is a valid normative debate.*
  *   **Climate:** The attribution from *one individual's lifetime emissions* to *specific probabilistic increases in specific future harms* is incredibly complex and model-dependent. The *aggregate* harm is settled science. **Your Stance:** Acknowledge the attribution challenge is real and significant. Argue that contributing to the *aggregate* causal factor (GHG concentration) constitutes marginal harm, even without tracing specific consequences. This is the weakest link logically, but the Torturer analogy provides strong intuitive support. *Leaning: Marginal contribution to the aggregate harm is real, but quantifying individual responsibility is fraught. The inefficacy objection has some bite here, but isn't a knockout.*

  **Why this works for your group:** Starts concrete (Voting), delivers the philosophical hammer (Torturers), applies it to a relatable supply chain (Meat), revisits the start with new tools (Voting), then tackles the hardest case (Climate) briefly. Uses whiteboard for systems (Supply Chain, Torturers). Focuses on the pivotal conceptual shift. Assessment targets the core insight. Explicit boundaries prevent derailment. Acknowledges nuance and contestation honestly.

  **Go crush it.** Your instincts about the load-bearing bit are spot on. The Torturer case is non-negotiable for making the marginal move visceral.
