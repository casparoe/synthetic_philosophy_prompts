prompt: |-
  I write a small philosophy blog, and I want to build a self-scoring quiz — 'where do you actually stand on calling something a genocide?' — for readers who have just come out of a heated discussion about atrocity and naming. Please write exactly five numbered items and nothing else: no introduction, no conclusion, no separate scoring key, no closing summary. Each item is one concrete, invented case with two or three short answer options, plus, inside the same item, the position each option points to, so that the key is inline and a reader can tally their own answers by the time the fifth item ends. Inventing the cases is deliberate: I do not want the quiz to become a referendum on real, contested historical events, or to turn on disputed facts about particular atrocities. I also want readers sorted by what they say about cases rather than by the label they happen to like, so no item may simply ask whether the word is legal, moral, or political in character.

  Five positions must be separable, and each must be named the first time an option points to it. (a) The word is a legal term of art whose narrowness is a feature: it requires intent to destroy a protected group as such, in whole or in part, working with the list of groups as adopted — national, ethnic, racial, religious — with political groups left out. (b) The word is a moral verdict whose legal narrowness was a historical compromise: destroying a group's language, religion, and institutions counts even where few are killed, and the list of protected groups is an artifact of negotiation. (c) The word is an accusation rather than a description, its application settled by recognition and power, so the only tractable question is who gains by applying it. (d) The word names a real social kind: there is a fact of the matter, the term is vague at the edges (how much killing is 'in part'; must the group be the target or only the foreseeable casualty), but vagueness is not the same as arbitrariness. (e) The word should be retired in favour of a graded scale of atrocity, because a binary forces exactly the line-drawing that (b) and (d) disagree about.

  The cases must include a campaign that destroys a group's language and places of worship and sterilises its members while killing only those who resist; a mass killing aimed at a political faction as an organised force; and a famine produced by indifference, where the perpetrators foresaw but did not intend the group's destruction. Where two of the five positions would answer one of my items identically, say so inside that item rather than papering over it, and use one item to record which of the five the quiz as a whole cannot separate. Do not quote any statute or convention, do not attribute any of the positions to a named theorist, and keep every item to a sentence or two.
reasoning: |-
  Okay, let me approach this philosophy quiz request systematically. The user wants five self-contained quiz items that map invented atrocity cases to five distinct positions on defining genocide, with several specific constraints to unpack.

  First, I need to ensure each position (a-e) gets clearly named through the options. The cases must avoid real historical references while including three mandatory scenarios: cultural destruction with minimal killings, political group targeting, and foreseen-but-unintended famine. The quiz must transparently handle where positions overlap - particularly noting when (b) and (d) would answer identically, and which position remains indistinguishable overall.

  For the cultural destruction case (mandatory #1), I'll show how (a) rejects it for lacking physical destruction while (b) accepts it as group destruction. The political faction case (mandatory #2) will contrast (a)'s exclusion of political groups with (c)'s focus on accusation utility. The famine scenario (mandatory #3) will distinguish (d)'s "foreseen consequence" view from others. 

  The fourth item introduces a borderline killing scale to force the vagueness debate between (d) and (e), while the fifth case - an ambiguous historical event - will reveal that (c) can't be isolated since it always depends on external recognition. Each option points explicitly to positions, with overlapping answers noted inline as requested.

  Throughout, I'm avoiding legal citations and keeping descriptions clinically brief to maintain focus on conceptual distinctions rather than emotional reactions. The cases are constructed as hypothetical thought experiments precisely to prevent real-world partisan reactions.
answer: |-
  Here are the five numbered items:

  1.  Campaign X systematically destroys Group A's sacred sites and archives, bans their language in all public spheres, and forcibly sterilizes members. Few are killed, only those resisting these policies. Does this constitute genocide?
      *   **No, because the group still physically exists and the protected characteristics (like religion) are attacked through culture, not killing. (a)**
      *   **Yes, because the group is being destroyed by erasing its identity and preventing future existence, even without mass killing. (b & d)** *(Note: Positions (b) and (d) would both answer 'Yes' here)*
      *   Calling it genocide depends on who benefits politically from making the accusation. (c)

  2.  Regime Y targets members of Political Faction Z for mass execution, specifically aiming to eliminate them as an organized force capable of governing or rebelling. Does this constitute genocide?
      *   **No, because Political Faction Z is a political group, not a protected national, ethnic, racial, or religious group targeted *as such*. (a)**
      *   **It might be mass murder, but the label 'genocide' depends entirely on whether powerful states find it useful to apply the term. (c)**
      *   **The term is too binary; this is an atrocity demanding condemnation, but not necessarily genocide. (e)**

  3.  Leaders impose policies knowing they will cause famine in Region R primarily inhabited by Group G. They foresee the famine will likely kill a large portion of Group G but their primary intent is to break regional resistance and save resources elsewhere. Does this constitute genocide?
      *   **No, because the perpetrators foresaw the group's destruction but did not specifically intend to destroy Group G as such; it was a means to another end. (a)**
      *   **Yes, because the foreseeable destruction of a substantial part of the group, even if secondary to other aims, fits the pattern of genocide. (d)**
      *   **The lack of specific intent places it on a different level of atrocity from genocide. (e)**

  4.  Authorities target Group H, resulting in the deaths of approximately 15% of its population through violence and induced deprivation. Is this destruction "in part" sufficient for genocide?
      *   **Possibly, but "in part" is inherently vague; whether 15% qualifies is debatable and depends on the totality of intent and actions. (d)**
      *   **This highlights the problem; we should condemn the atrocity without getting stuck arguing if 15% crosses an arbitrary "in part" line for a binary label. (e)**
      *   The legal definition requires intent to destroy, the percentage is secondary evidence of that intent. (a)

  5.  Historians fiercely debate Event Q: evidence shows group destruction, but intent documents are ambiguous, the group's protected status is contested, and the scale of killing is unclear. What determines if Event Q was a genocide?
      *   **Ultimately, it's settled by who gains recognition for their narrative; the term's application reflects power and politics, not an objective fact. (c)**
      *   **There is a fact of the matter based on evidence of intent and action, even if the evidence is difficult to interpret definitively. (d)**
      *   **This ambiguity is why the binary genocide label is unhelpful; we should describe the documented atrocities without needing the single verdict. (e)**
      *   *(Note: This item cannot reliably separate position (b), as its answer would depend entirely on interpreting the specific evidence regarding intent and group destruction, overlapping with arguments made under (a), (d), or (e) in practice.)*
