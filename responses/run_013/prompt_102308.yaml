  Hmm... the challenge is balancing poetic accessibility with conceptual precision. The villanelle's repetitive form is perfect for showing how refrains gain new meaning through context, mirroring how conventions naturalize. Must avoid both constructivist ("all made up") and essentialist ("really binding") resolutions.

  For the convention example, considering something small like path-walking etiquette. "Keep left" feels universally relatable yet arbitrary. The refrains "This is just what we do" and "It feels like it has always been true" will serve as the transforming anchors - same words but shifting implications as stanzas progress.

  Structure planning: Opening stanza shows arbitrary choice (mud avoidance), middle stanzas build mutual expectations, final quatrain should achieve that "naturalized but not justified" tension. Using British spellings as requested - "kerb" not "curb", "grey" not "gray".

  The theoretical mechanics need embedding: stanza 2 for coordination ("solves the tangle"), stanza 3 for mutual expectation ("each knows the other knows"), stanza 4 for self-reinforcement ("we see the groove"). Final couplet must leave it ambiguous - "ought" carries normative weight but "never thought it through" undercuts it.

  Avoiding heavy rhymes; "true/do/through" and "tangle/strangle" pairs should work. Last line "It feels like it has always been true" now resonates differently than in stanza 1 - the feeling persists even when we intellectually know otherwise. That's the sweet spot.
answer: |-
  ## Footpath Formation

  The mud was deeper on the right that day,
  A choice made once to skirt the clinging clay.
  **This is just what we do.**

  A simple step avoids the slipping place,
  It solves the tangle, finds a common grace.
  **It feels like it has always been true.**

  No sign was posted, no decree was passed,
  Just feet avoiding puddles gathering fast.
  **This is just what we do.**

  Each knows the other knows to keep the left,
  A silent pact, relieving all the stress.
  **It feels like it has always been true.**

  The reason fades beside the dry-shod kerb,
  The mud long dried, forgotten and superb.
  **This is just what we do.**

  The children watch the pattern, learn the tread,
  The why obscured by habit in its stead.
  **It feels like it has always been true.**

  A stranger asks "Why walk this narrow line?"
  We pause, then shrug, and call the custom fine.
  **This is just what we do.**
  We see the groove worn deep now in the ground,
  We ought to walk this way; the rule is sound.
  **It feels like it has always been true.**
  Though born of mud and chance we never thought it through...
  **This is just what we do.**
  **It feels like it has always been true.**

  ---

  **Notes on the Mechanism:**

  1.  **Arbitrary Start:** "The mud was deeper on the right that day" – a contingent, practical solution to a coordination problem (avoiding mud).
  2.  **Coordination Solved:** "It solves the tangle, finds a common grace" – establishes the convention as an equilibrium.
  3.  **Mutual Expectation:** "Each knows the other knows to keep the left" – common knowledge and mutual expectation drive conformity.
  4.  **Origin Forgotten:** "The mud long dried, forgotten and superb" – the initial reason vanishes; the convention exists for its own sake.
  5.  **Habit & Learning:** "The children watch the pattern, learn the tread" – transmission without explanation, reinforcing the sense of givenness.
  6.  **Justification Gap:** "A stranger asks... We pause, then shrug" – the inability to recall the origin, replaced by a sense of "fineness" or appropriateness.
  7.  **The Shift in Refrains:**
      *  **Opening (Stanza 1):** "This is just what we do" is descriptive, almost casual. "It feels like it has always been true" introduces the *beginning* of the naturalisation process.
      *  **Closing (Stanza 6 & Quatrain):** "This is just what we do" carries the weight of unexamined obligation. "It feels like it has always been true" is now a statement of experienced reality, reinforced by the groove in the ground and the sense that "we ought" to follow it ("the rule is sound").
      *  **Final Couplet:** The jarring juxtaposition of "born of mud and chance" (arbitrary origin) with "It feels like it has always been true" (naturalised reality) leaves the tension unresolved. The poem ends with the convention feeling binding *because* it is practised and expected, not because it was inherently right or always there. The identical lines now perform the work of naturalisation itself.
