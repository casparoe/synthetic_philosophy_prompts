  | 1       | Is a criterion of correctness for word-application necessarily external to the speaker's own private practice/memory? | **Yes.** Correctness requires an external standard ("hinge") against which the speaker's application can be checked. Without this, "correct" collapses into "seems correct." | **Not necessarily.** While the *picture* of purely private criteria is incoherent, the dissolution doesn't *require* external criteria; it shows the *idea* of purely private criteria makes no sense. | **The Solitary Castaway's Ledger:** A solitary individual, shipwrecked since infancy, keeps a meticulous diary labeling her unique sensations (S1, S2, etc.). When unsure if a current feeling is S1 or S2, she consults past entries treated as authoritative records. Is the ledger a viable criterion? | **Prediction:** The ledger is *not* a genuine criterion. Consulting it is just another private mental act ("it seems like what I wrote before"). No distinction between correct consultation and seeming-correct is possible. | **Prediction:** The ledger *could* function as part of a grammatical technique *for the castaway*. The practice of consulting it provides internal scaffolding for her use, dissolving the *need* for the private ostension picture. | **Move IR:** Show a coherent account of determinate meaning arising solely from private acts/memory without *any* externalizable practice/scaffold (even internal like the ledger). **Move DR:** Show Wittgenstein explicitly argues for external criteria as *necessary*, not just dissolving the picture. | Substantive (Core disagreement on the nature of rules/correctness) |
  | 2       | Is the appeal to other language users essential to the PLA's logic, or merely illustrative?                           | **Essential.** The possibility of others checking application (actual or potential) is constitutive of the distinction between "correct" and "seems correct." Community is logically required. | **Illustrative.** Others are used effectively in examples to highlight the incoherence of the private picture, but the core argument is about rule-following *as such*, applicable even to a solitary being. | **Private Lexicon / Public Grammar:** A speaker invents completely novel words ("Zap," "Glomp") for her private sensations but uses them within the framework of her native public language grammar (e.g., "I feel a strong Zap now," "Did the Glomp subside?"). Are "Zap" and "Glomp" meaningful? | **Prediction:** No. While embedded in public grammar, the *meaning* of "Zap"/"Glomp" depends solely on private ostension, which lacks an external criterion. Grammar alone doesn't fix private reference.                | **Prediction:** Possibly yes. The public grammar provides the scaffolding for use, dissolving the *picture* of pure private ostension. The words function within a practice, even if the referents are private. | **Move IR:** Show Wittgenstein argues the community is necessary *even for the solitary case*. **Move DR:** Show Wittgenstein's arguments against private rules work identically regardless of others' presence. | Primarily Substantive (Minor verbal aspect re: "essential") |
