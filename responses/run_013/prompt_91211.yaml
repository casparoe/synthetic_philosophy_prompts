prompt: |-
  I'm a doctoral candidate in philosophy, and in three weeks I have to defend, at a departmental workshop, a thesis about causation by omission that I've been developing for the better part of a year. My claim is that omissions can be genuine causes, but only derivatively: an omission causes an outcome when the agent's failure to act makes a difference to that outcome relative to a baseline fixed not by what the agent could have done but by the norm that applies to the situation — legal, moral, or merely conventional — so that where no norm is in play, talk of an omission's "causing" something is at best pragmatic shorthand. I take this to explain why we hold the lifeguard responsible for the drowning but not the stranger watching from the beach, and why the same non-action counts as a cause in one context and a mere condition in another. I should say up front that my supervisor suspects the normative-anchor move is ad hoc, a patch rather than a theory, and I am not entirely sure she is wrong; I would like the prep sheet to show me where the real pressure lies.

  The audience is the awkward part. The workshop is attached to a large interdisciplinary centre, so the room will hold roughly a dozen analytic metaphysicians of causation who cut their teeth on difference-making and pre-emption puzzles and who will want to know how my account handles redundant omission and causation by double prevention; three or four epidemiologists and biostatisticians who think of causes in terms of potential outcomes and interventions and will keep translating everything I say into a treatment-versus-control frame; one tort lawyer who cares only about whether the account yields determinate verdicts a court could apply; and a handful of graduate students who will ask the broad "what does this actually buy us" question. Nobody in the room works primarily on omissions, and nobody will have read my paper closely.

  Please act as a philosopher of causation who is also a seasoned workshop survivor, and prepare me for the question period. Begin by brainstorming: think carefully about what each constituency in this room will seize on, and about where their vocabularies will collide with mine. Then give me a prep sheet: the eight to ten objections I will actually get, ordered by how likely each is and how much damage it would do, each phrased the way the person raising it would phrase it — the metaphysician's version, the biostatistician's version, the lawyer's version — with a two-minute reply for each and an honest note on where that reply is soft or where I am bluffing. Tell me what I should concede at the outset to buy goodwill, what I must hold firm on for the thesis to survive, and finish with the one question I am hoping nobody asks and how to answer it if it comes. Please write in British English, and keep the whole thing to something I can realistically rehearse in an afternoon.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy doctoral candidate preparing for a thesis defense on causation by omission, facing a multidisciplinary audience. Their core claim is that omissions cause outcomes derivatively through normative anchors, which explains contextual differences in responsibility attribution. 

  First, I need to map the audience dynamics: analytic metaphysicians will probe counterfactual robustness and pre-emption; biostatisticians will demand interventionist translations; the tort lawyer needs clear-cut applications; grad students seek theoretical payoff. The supervisor's "ad hoc" criticism looms large, so the prep must preempt that perception.

  For the prep sheet structure:
  - Concessions: Grant that non-normative baselines exist but argue they're insufficient for responsibility contexts - this disarms metaphysicians early.
  - Non-negotiables: Normative anchoring as essential for distinguishing identical physical omissions (lifeguard vs bystander).
  - Likely objections: Prioritize by damage potential. The metaphysician's redundant omission case (two lifeguards) could unravel the theory if not handled deftly. The biostatistician's "no interventionist analogue" challenge risks making the account seem non-empirical.
  - Killer question: What happens when norms conflict? This exposes the theory's indeterminacy - best addressed by conceding contextual resolution while showing the framework accommodates it.

  The replies need tactical nuance:
  - For redundant omissions: Stress that norms define the relevant counterfactual (either guard acting would suffice), but admit this requires richer normative theory.
  - For interventionist challenges: Translate "normative anchor" into design-of-experiments terms (e.g., protocol defines control group), but flag that real-world norms aren't as tidy as RCTs.
  - Lawyer's demand for bright lines: Offer the "duty framework" as a decision procedure while noting metaphysics rarely delivers courtroom certainty.

  The unspoken tension: User fears their supervisor is right about the "patch" critique. The prep should reframe this - normative anchors aren't ad hoc but necessary for bridging descriptive causation and prescriptive responsibility. If pressed, concede boundary cases exist but argue the theory explains 90% of intuitive judgments.

  Final preparation tip: Rehearse translating the core claim into each discipline's jargon - especially the epidemiologist's potential outcomes framework. That interdisciplinary agility will build credibility when objections fly.
answer: |-
  Right then, let's get you prepped for the workshop grilling. As a fellow traveller in causation's trenches (and veteran of many a bloody-minded Q&A), I'll break this down. Your core idea – **normatively anchored difference-making** – is clever, but it *does* have seams. Different factions will pick at different threads. Here’s the forecast and your battle plan.

  **Key Concessions to Buy Goodwill (State Early):**
  1.  **"I concede that *some* difference-making accounts *can* handle simple omission cases *without* norms** (e.g., But-for: if the lifeguard *had* acted, the drowning *wouldn't* have occurred). My claim is that this *isn't sufficient* to explain our core intuitions about responsibility, nor why seemingly identical physical non-actions aren't always causal."
  2.  **"I concede that norms are often messy, context-dependent, and sometimes contested.** My account doesn't magically solve that; it *incorporates* that messiness as central to the causal structure in these cases."

  **Non-Negotiables (Hold the Line):**
  1.  **Omissions require a baseline for comparison.** (Otherwise, difference-making is undefined).
  2.  **The relevant baseline *cannot be fixed solely* by mere physical possibility or 'what the agent could have done'.** (This fails the lifeguard vs. stranger test).
  3.  **The baseline *is* fixed (at least partly) by applicable norms.** (This is the core explanatory move).
  4.  **Therefore, omissions are *derivative* causes.** (Their causal status depends entirely on the normatively defined baseline and the counterfactual difference made relative to it).

  **The Prep Sheet: 8 Likely Objections & Your Replies**

  *(Ordered by Likelihood & Potential Damage)*

  1.  **The Metaphysician (Redundant Omission / Pre-emption):** "Suppose *two* negligent lifeguards, A and B, *both* fail to save the swimmer. Either one acting alone would have sufficed (so each omission is redundant). On your view, is A's omission a cause? The norm applies to both, but neither omission is but-for necessary. How does the normative anchor help here?"
      *   **Reply:** "Crucially, the norm defines the *expected action*. The counterfactual isn't just 'if *A* had acted', but 'if the *normatively required action* had occurred'. Since either lifeguard acting *would have fulfilled that norm*, the causal claim holds against *each*: their omission *did* make a difference relative to the baseline where *the required action (saving)* happens. The redundancy is captured – each omission is sufficient but not necessary for the outcome *given* the other's omission, but both are causes relative to the normative baseline where saving occurs. It mirrors redundant physical causation."
      *   **Soft Spot:** Explaining *why* we hold *both* responsible rather than neither or just one requires supplementing the causal claim with responsibility principles. The normative anchor makes the causal claim possible, but doesn't *fully* settle responsibility distribution in redundancy.

  2.  **The Biostatistician (Intervention & Potential Outcomes):** "You talk about 'difference-making relative to a norm-based baseline'. How do I translate that into a potential outcomes or interventionist framework? What's the 'treatment'? Intervening to *make* the norm apply? Or intervening on the agent's *action* while holding the norm fixed? It sounds like you're smuggling the *effect* (responsibility) into the *cause* (the omission defined normatively)."
      *   **Reply:** "Fair challenge. Think of the 'treatment' as: *Intervene to ensure the normatively required action is performed*. The 'control' is the actual world where it wasn't. The causal effect of the omission is the difference between the outcome in the control (drowning) and the outcome under this intervention (no drowning). The norm defines *what action* constitutes the 'treatment'. Without the norm, the intervention is ill-defined – *which* possible action should we set to 'on'? The norm fixes that."
      *   **Soft Spot:** This requires accepting that interventions can target *normative compliance*. Some interventionists might balk, seeing norms as outside the causal system proper. Be ready to argue this is necessary for capturing social reality.

  3.  **The Metaphysician (Causation by Double Prevention):** "Your lifeguard case involves a simple omission. But what about double prevention? Suppose Guard A fails to remove debris (omission1), which would have blocked Guard B. Guard B then fails to save the swimmer (omission2). Omission1 prevented omission2's prevention of drowning. Is omission1 a cause? Does the norm apply to A? To B? To both?"
      *   **Reply:** "The causal chain still hinges on norms defining the required actions. Did the norm require *A* to remove the debris? If yes, then A's omission *is* a cause of the drowning (via preventing B's action). It made a difference relative to the baseline where A acts (debris removed) and *then* the norm applies to B. If no norm applied to A, only to B, then A's omission is merely a condition for B's omission being causal. The normative scope matters."
      *   **Soft Spot:** Can get complex fast with chains. Requires clear articulation of *which* norms apply to *which* agents at *which* points. Your account relies on specifying this normative landscape, which might be implicit in context.

  4.  **The Tort Lawyer (Determinate Verdicts):** "This all sounds terribly fuzzy. Courts need clear rules: Did A *cause* the harm? How does your 'normative anchor' give me a yes/no answer? What if norms conflict – a moral norm says act, a legal norm says don't interfere? Which baseline wins?"
      *   **Reply:** "The law *already* uses normative anchors implicitly – that's the 'duty of care'! My account *explains* why the duty matters causally. The relevant baseline is fixed by the *applicable legal norm/duty*. In your conflict case, the court must first determine *which* norm governs for the purpose of assigning liability (*that's* a legal question), then my account tells you the causal structure *given that norm*. It provides the *form* of the causal question the court needs to answer ('Did breaching this duty make a difference?'), making explicit what's often implicit."
      *   **Soft Spot:** It pushes the 'fuzziness' back to norm selection/conflict resolution, which courts *do* grapple with. Your account doesn't magically resolve deep normative conflicts, but it structures the causal inquiry once a norm is chosen.

  5.  **The Graduate Student (Theoretical Payoff):** "Okay, so norms fix baselines for omissions. But what does this *buy* us that a purely counterfactual account plus a *separate* theory of responsibility doesn't? Isn't this just adding epicycles? Why not say the lifeguard's omission is a cause (counterfactually), and we hold them responsible *because* of the norm/duty?"
      *   **Reply:** "Because it explains why the *identical physical non-action* by the stranger *isn't* causal in the relevant sense. Purely counterfactual accounts often struggle with this: 'But if the stranger *had* acted, the drowning *wouldn't* have happened!' Yet we *don't* call it a cause (just a condition). Why? The counterfactual difference alone isn't sufficient. The normative anchor explains the *asymmetry*: only the lifeguard's non-action is *defined as a failure* relative to the operative baseline. It unifies the causal and responsibility-laden aspects *in the causal claim itself* for omissions."
      *   **Soft Spot:** A committed counterfactualist might bite the bullet and say the stranger's omission *is* a cause, just not one generating responsibility. You need to argue that this violates strong intuitions and that your account better captures the *meaning* of causal claims in contexts of responsibility.

  6.  **The Metaphysician/Biostatistician (No Norm Cases):** "You say where no norm is in play, omission talk is pragmatic shorthand. Give a clear example. What *actually* causes the outcome then? And isn't your 'shorthand' doing the *real* causal work?"
      *   **Reply:** "Consider a rock failing to fall and block a landslide. No norm applies to the rock. We might *say* 'the rock's failure to fall caused the village to be destroyed', but this is shorthand for complex positive causes: the geological instability causing the landslide, the lack of a triggering tremor for the rock, etc. The 'omission' isn't a genuine *relational* cause here; it's a way of pointing to the *absence of a positive preventer* within a complex web of positive causes. My account explains *why* this feels different from the lifeguard case – there’s no normative baseline to anchor a genuine causal relation of omission."
      *   **Soft Spot:** Requires careful distinction between *absence* (a general state) and *omission* (an agent's failure relative to expectation). Some metaphysicians might argue all absences are ontologically equal.

  7.  **The Biostatistician (Baseline Drift):** "Norms change. The moral norm for bystanders might shift towards intervention. Legal duties evolve. Doesn't this make your 'baseline' hopelessly unstable, meaning the causal facts about an omission change with societal views? Causation shouldn't be that relativistic!"
      *   **Reply:** "It *does* mean the causal status of an agent's non-action *can* change with the applicable norms. This isn't relativity about physics; it's about the *relational* nature of *agentive omissions*. An action is an omission *only relative to an expected norm*. If the norm changes, what counts as an omission (and thus potentially a cause) changes. This tracks reality: we *do* revise our causal and responsibility attributions as norms evolve (e.g., historical pollution). The 'fixed' point is the *structure*: causation by omission requires a norm to define the baseline."
      *   **Soft Spot:** Feels uncomfortable to those wanting timeless causal facts. Emphasize this applies *only* to *agentive omission causation*, not fundamental physics.

  8.  **The Metaphysician (Ad Hoc - Your Supervisor's Point):** "Isn't this just an elaborate way to *label* the difference between the lifeguard and the stranger? You want to say the lifeguard's omission causes, the stranger's doesn't. So you invent a 'normative anchor' requirement to get that result. It feels like a patch on counterfactual theories to get the 'right' answer for responsibility, not a deep feature of causation."
      *   **Reply:** "It's not *invented*; it's *explanatory*. Counterfactual difference-making alone is too promiscuous for omissions. We need to *explain why* only *some* non-actions in the vast sea of non-occurrences count as omissions that *can* be causes. The norm provides that constraint – it defines *which* non-action is salient *as* an omission. This salience isn't arbitrary; it's grounded in the social/moral/legal fabric that shapes agency and expectation. It's not just patching; it's identifying the necessary *context* for agentive omission causation to arise. The 'anchor' explains *why* the counterfactual matters *here* and not *there*."
      *   **Soft Spot:** This is the crux. The reply needs conviction. Argue it's *revelatory*, not *ad hoc* – it shows *why* responsibility contexts demand this extra structure. Concede it might not apply to *all* causation, but it's essential for *this* kind.

  **The Question You Hope Nobody Asks (But Prepare For):**

  **The Normative Ontologist:** "You rely heavily on 'norms'. But what *are* norms ontologically? Are they Platonic entities? Social conventions? Moral facts? How do they *actually fix* the baseline in the causal structure? If they're just social facts, doesn't this reduce your account to sociology? If they're robustly real, how do they interact with physical causation? This seems like a category error."

  *   **Why it's Dangerous:** It forces you into meta-ethics/metaphysics quicksand far beyond causation, potentially undermining the foundation of your account.
  *   **Reply:** "That's a deep and important question, but beyond the scope of my thesis, which is about the *structure* of causal claims involving omissions *within contexts where norms are operative*. My account is compatible with various meta-ethical views about norms (realist, constructivist, etc.). It takes norms *as given within a context* – the way legal causation takes legal duties as given, or moral responsibility takes moral obligations as given. My claim is that *within such normative contexts*, the causal role of omissions is structurally dependent on these norms to define the relevant baseline for difference-making. The metaphysics of norms themselves is a separate, larger project."
  *   **Mitigation:** Briefly gesture towards a non-metaphysically-loaded view: "Think of norms here functionally, as the shared expectations and rules that structure social interactions and agency within a community, which are real features of our social world." Then steer back: "The key point is that *whatever* norms are, they play this indispensable *role* in grounding omission causation."

  **Final Rehearsal Tips:**

  1.  **Translate Proactively:** Start your defence with a quick translation for each group: "For metaphysicians, think of norms fixing the relevant possible world for comparison. For interventionists, norms define the treatment. For the legally minded, this is formalising 'duty' within causation."
  2.  **Anchor Examples:** Constantly return to the **Lifeguard vs. Stranger** and **Two Lifeguards** examples. They are your bedrock.
  3.  **Concede Wisely:** Don't fight every point. Use concessions 1 & 2 strategically early on to seem reasonable.
  4.  **Hold the Line:** Be absolutely clear and firm on your Non-Negotiables, especially 2 & 3. This is your thesis core.
  5.  **"It Depends on the Norm":** Get comfortable saying this. It's not a weakness; it's the point.
  6.  **Bluff Minimally:** Your replies above have soft spots, but few are pure bluffs. Focus on the structural explanatory power of the normative anchor. Where you're soft (redundancy, norm ontology), admit it points to further work, not a fatal flaw.
  7.  **Practice the Killer Reply:** Rehearse the "It's explanatory, not ad hoc!" reply (Objection 8) until it sounds like bedrock truth. How you deliver this is crucial.

  This prep sheet gives you the likely lines of attack and solid, concise replies. Rehearse these objections and your 2-minute answers out loud. The key is sounding like you've *anticipated* these challenges and your account *welcomes* them as clarifying moments. Good luck – it's a smart thesis, now go defend it like one.
