  A friend of mine from graduate school, a classicist who reads Warring States texts for pleasure, and I spent most of a long train journey last week arguing about the White Horse Dialogue, the chapter of the Gongsun Longzi in which one speaker defends the claim that a white horse is not a horse and the other flatly refuses to grant it. He says the whole thing is an artefact of classical Chinese having no articles and no grammatical number — that the sentence can be read as being about the kind or about some particular animal, and that once you supply the right English words the puzzle evaporates — and I half-suspect he is right and half-suspect he is waving away something real. I write compilers and type checkers for a living: I am at home with subtyping and refinement types, nominal and structural typing, records, intersection and product and sum types, the distinction between a value and its type, and the distinction between an equality test and a subsumption check. My philosophy, though, is entirely self-taught, so I do not trust my own hunch that my vocabulary already dissolves the argument.

  What I want from you is a translation, not a summary. Restate the advocate's case move by move — the opening exchange; his claim that horse names a shape while white names a colour, and that what names a colour is not what names a shape; the argument about what may be delivered when a horse is sought as against when a white horse is sought; and his closing talk about what is sought being the same or different — into my vocabulary as faithfully as you can, without quietly importing type-theoretic assumptions and presenting the result as a translation. Then give me the residue report, which is the part I actually care about. Which of his moves land cleanly as claims about types, subtypes, and what an expression denotes; which survive only if I distort them to fit; and which have no counterpart at all in what I know — I am thinking especially of the shape-and-colour claim, of the companion essay on pointing and things, and of the companion essay about a stone that is both hard and white. For each piece of residue, say whether you think the failure is a defect of my framework, something type systems simply cannot express, or else evidence that the original claim was never as clear as it sounds; and close by telling me what my classicist friend would say to the whole exercise, in particular whether he would claim that I have just proved his point that it was always an accident of grammar.

  Please answer in continuous prose, in the manner of a long email to a colleague: no headings, no bullet points, no bold or italicised text, and no tables.
