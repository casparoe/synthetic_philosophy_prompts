  Let me tackle this systematically. First, I'll reconstruct the advocate's argument in your vocabulary, move by move, resisting the urge to silently inject type-theoretic assumptions. Then we'll examine the residue.

  **Translation into Type-Theoretic Vocabulary:**

  1.  **Opening Claim ("A white horse is not a horse"):**
      *   **Advocate's Statement:** "Bai ma fei ma" (White horse not horse).
      *   **Translation:** The type `WhiteHorse` is not identical to the type `Horse`. While a value of type `WhiteHorse` can often be used where a value of type `Horse` is expected (it passes a subsumption check where `WhiteHorse <: Horse` might hold), they are distinct types. `WhiteHorse` is not merely an alias for `Horse`; it carries additional constraints.

  2.  **Shape and Colour Distinction ("Horse names the shape, white names the colour"):**
      *   **Advocate's Statement:** "Ma zhe, suo yi ming xing ye; bai zhe, suo yi ming se ye."
      *   **Translation:** The type `Horse` is defined primarily by structural properties related to form or shape (a specific set of physical attributes defining the equine form). The modifier `White` is defined by a property related to colour (a specific value for a `colour` attribute). The construction `WhiteHorse` involves applying the colour property modifier `White` to the base structural type `Horse`. What defines a type by a specific colour property (`White`) is fundamentally a different kind of definition than what defines a type by a specific structural form (`Horse`). Therefore, the type resulting from applying `White` (`WhiteHorse`) cannot be identical to the base structural type `Horse` itself.

  3.  **The Delivery Argument ("What may be delivered"):**
      *   **Scenario:** If one requests "a horse" (`Horse`), delivering a yellow horse (`YellowHorse`) or a black horse (`BlackHorse`) is acceptable.
      *   **Advocate's Claim:** If one requests "a white horse" (`WhiteHorse`), delivering a yellow horse (`YellowHorse`) or a black horse (`BlackHorse`) is *not* acceptable. However, delivering a white horse (`WhiteHorse`) *is* acceptable when requesting "a horse" (`Horse`).
      *   **Translation:** The set of values acceptable for a request of type `Horse` includes values of type `YellowHorse`, `BlackHorse`, and `WhiteHorse` (assuming `YellowHorse <: Horse`, `BlackHorse <: Horse`, `WhiteHorse <: Horse`). The set of values acceptable for a request of type `WhiteHorse` is strictly narrower: only values of type `WhiteHorse` (or potentially its strict subtypes) are acceptable. Values of type `YellowHorse` or `BlackHorse` fail the type check (`instanceof WhiteHorse` or equivalent exact type match fails). This demonstrates that the type `WhiteHorse` imposes a stricter condition than the type `Horse`. Since the acceptable sets for the two requests differ (one is a superset of the other), the types governing the requests (`Horse` vs `WhiteHorse`) cannot be identical. Ergo, `WhiteHorse` is not `Horse`.

  4.  **Closing Sameness/Difference ("What is sought is the same or different"):**
      *   **Advocate's Statement:** Paraphrasing: "Horse" undifferentiated does not pick out any particular colour; "white horse" does pick out a specific colour. Therefore, what you are looking for when you ask for "horse" is different from what you are looking for when you ask for "white horse".
      *   **Translation:** The *intension* (the defining properties) of the type `Horse` does not include a specific value for the `colour` property; it is abstracted over colour. The intension of the type `WhiteHorse` explicitly includes the constraint `colour == White`. Because the defining properties (intensions) of the two types differ – one lacks a specific colour constraint, the other possesses it – the types themselves are different. A request for a value of type `Horse` is a request for something satisfying the equine structure, colour being irrelevant. A request for a value of type `WhiteHorse` is a request for something satisfying the equine structure *and* the specific colour property `White`. The specificity of the request (the type being sought) differs.

  **The Residue Report:**

  1.  **The Shape/Colour Distinction:**
      *   **Fit:** Lands quite cleanly. It maps directly to orthogonal classifiers: `Horse` as a structural/nominal type based on physical form, `White` as a property-modifier (like a refinement type `{ h: Horse | h.colour == "white" }` or defining a distinct subtype constructor). The claim that applying a colour property creates a distinct type from the base shape type is core type theory.
      *   **Residue:** Minimal. The advocate's phrasing *sounds* ontological ("names shape", "names colour"), but your framework readily interprets this as defining different *classification criteria* (structural form vs. specific attribute value). The type system doesn't care *why* they are different classifiers, only that they *are* different criteria that can be combined. No distortion needed.

  2.  **The Delivery Argument:**
      *   **Fit:** The core logic survives well as an argument about subtyping, sets of acceptable values, and type identity based on extension/intension compatibility.
      *   **Residue:** Slight distortion is needed. Your framework *forces* an explicit decision about variance and substitutability that the text leaves implicit and contextual. The advocate assumes `YellowHorse` *is* acceptable for `Horse` and `is not* acceptable for `WhiteHorse`. Your type system requires explicit declarations (`<:`) for this substitutability. Furthermore, the argument relies on the practical context of fulfilling requests ("delivering"), implying a runtime check (`instanceof`, pattern matching) or static type checking of the delivered value against the requested type. The type-theoretic translation makes this operational aspect explicit, whereas the dialogue presents it as self-evident logical behavior. The *success* of the argument in your terms depends entirely on the assumed subtyping relationships (`WhiteHorse <: Horse`, but `YellowHorse` not `<: WhiteHorse`). The dialogue assumes these relationships hold based on the meaning of the words. The residue is the *contextual assumption of subtyping* based on shared structure and differing refinements.

  3.  **The Sameness/Difference of What is Sought (Closing Argument):**
      *   **Fit:** Maps very cleanly to the distinction between types based on their intension (defining properties). `Horse` has a broader, less constrained intension than `WhiteHorse`. Different intensions imply different types. This is fundamental.
      *   **Residue:** Minimal. The advocate emphasizes the *cognitive* aspect of "looking for" something with specific properties. Your framework translates this directly into the *semantic content* of the type specification used in the request. The type *is* the specification of what is sought.

  4.  **The "Jianbai" Essay (Pointing and Things):**
      *   **Residue (Significant):** This essay argues that "pointing" (referring) to a thing's whiteness and pointing to its hardness (in the case of a hard, white stone) are distinct acts, even though applied to the same concrete object. The whiteness and hardness are "separate" in the stone, not combined into a single unitary "hard-white" entity at the level of properties.
      *   **Analysis:** This is where your framework struggles. Types (`HardStone`, `WhiteStone`, `HardWhiteStone`) classify the *whole object*. Subtyping/intersection types (`HardWhiteStone <: HardStone`, `HardWhiteStone <: WhiteStone`, `HardWhiteStone = HardStone & WhiteStone`) model how objects belong to multiple types simultaneously. However, the essay seems focused on the *ontological status of the properties themselves* ("hardness", "whiteness") as distinct entities that inhere in the object, and the distinctness of our *mental acts* of attending to them. Type theory deals with classifications of objects based on properties, not the metaphysics of the properties themselves or the psychology of reference. Translating this requires introducing concepts far outside standard type theory: perhaps modal types, property theory, or intentional contexts. The failure is likely a limitation of the *scope* of your framework. Type systems classify objects and define interfaces; they aren't designed to model the metaphysics of universals or the intentionality of mental acts. This residue suggests the original claim touches on issues beyond object classification.

  5.  **The Hard-White Stone ("Separate in the Stone"):**
      *   **Residue (Significant):** Directly related to the "Jianbai" essay. The claim is that the hardness and whiteness, while both belonging to the stone, are not fused; they remain distinct aspects.
      *   **Analysis:** Again, your framework handles the *object* (`HardWhiteStone`) perfectly. An intersection type `Stone & { hardness: High } & { colour: "white" }` captures the combined properties. But the advocate's point seems to be about the *independence* or *separability* of the property instances *within* the object. Type theory treats the object as a bundle of properties forming a single entity. It doesn't model the properties as potentially separable internal constituents. Translating the "separateness" claim might require introducing something like record types where fields are truly independent components (`struct Stone { hardness: HardnessValue; colour: ColourValue; }`), implying `stone.hardness` and `stone.colour` are distinct parts. However, this feels like a stretch, as the text seems more metaphysical than structural. This residue points towards a potential defect in your framework *for this specific philosophical claim* – it doesn't naturally model the internal composition of objects in terms of distinct property instances, only their external classification. It could also be evidence that the original claim is metaphysically ambiguous.

  **Conclusion & Your Classicist Friend's Likely Response:**

  Your vocabulary dissolves the *core logical argument* of the White Horse Dialogue remarkably well. The distinctions between types, subtypes, refinements, intensions/extensions, and substitutability provide a precise framework for restating Gongsun Long's moves without significant distortion. The residues arise primarily at the boundaries where the text delves into:
      a)  **The Ontology of Properties:** The "Jianbai" and stone essays focus on the nature of properties themselves and their combination within objects, which standard type theory abstracts away, dealing only with the resulting object classifications.
      b)  **The Psychology of Reference:** The emphasis on "pointing" or "seeking" touches on intentionality, which type theory handles implicitly via type semantics but doesn't explicitly model.

  Your classicist friend would likely seize on two points:
  1.  **The Necessity of Articles/Context:** He'd argue that your entire translation *depends* on the distinctions your framework provides (like `Horse` vs `a Horse` vs `the Horse` vs `WhiteHorse`) that are absent in the original classical Chinese grammar. You've precisely articulated the ambiguities he claims are latent in the original sentence structure. The "puzzle" arises because the grammar doesn't force these distinctions; your resolution *imposes* them using type theory, proving that the ambiguity is real and resolvable contextually.
  2.  **The Residue as Metaphysics:** He'd likely contend that the residue in the companion essays confirms his view that the core "white horse not horse" argument *is* fundamentally linguistic/contextual. The metaphysical musings on properties ("Jianbai", stone) are separate, more profound, and less amenable to logical formalization. The type-theoretic clarity applied to the main paradox highlights that its tension stems from underspecification resolvable by context (like request scenarios), not deep metaphysics.

  He might conclude: "You've beautifully proven my point. The type system *is* the missing context. By formalizing the contextual assumptions about substitutability and classification that classical Chinese leaves implicit, you've dissolved the apparent paradox exactly as I claimed articles and grammatical number do in English. The parts that don't fit your compiler-brain aren't paradoxes; they're just different, murkier philosophical questions." He'd see your successful translation of the main argument as strong evidence for his grammatical thesis, and the residue as tangential metaphysics. Whether you agree that the residue is *merely* tangential murk or points to something genuinely inexpressible in types is where the philosophical debate would continue, probably over another long train journey.
