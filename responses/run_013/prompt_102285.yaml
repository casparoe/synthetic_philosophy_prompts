answer: |-
  The fluorescent hum of the Statistical Bureau vibrated in Anya’s teeth. Before her, neat rows of tiny, identical worker figures marched across the drafting paper – her isotypes for the Quarterly Civic Report. Each figure represented 500 unemployed citizens. Simple. Honest. *True.*

  Karl leaned over her shoulder, smelling of pipe tobacco and old paper. "The presentation’s at three, Anya. The Mayor wants clarity."

  "Clarity is the point," Anya said, sharpening her drafting pencil. "People see rows, they understand scale. No spin, no jargon. Just the visual arithmetic of hardship." She carefully added another figure. 5,000 souls represented by ten tiny bodies. Clean.

  Karl tapped a thick finger on the source document beside her. "This number? 'Unemployed Seeking Full-Time Work.' What about the part-timers desperate for more? The gig workers who got zero hours this week? The folks who gave up searching last month?" He pulled a dog-eared memo from another file. "Housing Office counts anyone behind on rent who *says* they can't find work. Social Services uses benefit applications. We use the Labour Force Survey. Three different pictures of the same storm."

  Anya pressed down hard, snapping her pencil lead. "We have to *standardize*. Otherwise, it’s chaos. The isotype *requires* a fixed unit. One figure, one defined quantity." She pointed at her meticulous rows. "This shows the *core* problem. Undiluted."

  "Undiluted?" Karl chuckled, a dry rasp. "You’ve filtered it through three sieves already. By choosing *this* definition, you’ve told the audience: *these* people count. Those others? Shadows. Invisible." He gestured at her drawing. "That neat row? It smuggles in the theory that unemployment is a single, countable thing with sharp edges. It’s not. It’s a swamp."

  Anya’s hand trembled. The deadline pressure was a vice. She needed clean lines, unambiguous truth. "People need to *see* it, Karl! Not get lost in bureaucratic nuance. A picture cuts through the noise."

  "A picture *is* noise, dressed up as silence," Karl countered. He pulled a stained coffee cup from his desk, the dregs like mud. "See this? Is it half-empty? Half-full? Completely full of stale coffee? Or just a vessel needing washing? Depends why you’re counting it. Your little figures imply everyone unemployed is identical, interchangeable units. Are they? The single mother? The laid-off factory worker? The recent grad?"

  "Abstraction is necessary!" Anya insisted, frustration cracking her voice. She erased a figure, then redrew it, striving for perfect uniformity. "We show the *magnitude*. The visual impact. That’s universal."

  Karl sighed, looking suddenly weary. "Magnitude of what, Anya? Magnitude according to *whose* ruler? You’re building a bridge of pictures, but the foundations? They’re numbers someone else chose to collect, using definitions someone else decided mattered. Your universal language has an accent. A very specific, bureaucratic one."

  He pushed his chair back, the scrape loud in the tense room. "Do your rows. Make them neat. The Mayor will love the simplicity. Just remember," he paused at the doorway, "when you present those identical figures marching sadly across the page, you’re not just showing *how many*. You’re showing *who counts*, and *how* we decided to count them. That’s the picture hiding inside your picture."

  The door clicked shut. Anya stared at her drafting paper. The ten identical worker figures stared back, mute and uniform. She dipped her pen in black ink, poised to add the eleventh row. The Labour Force Survey number demanded it. 5,500 unemployed. Eleven figures. Clean.

  But her hand hovered. The blank space beside her neat rows seemed suddenly vast, filled with Karl’s unseen multitudes – the part-timers, the discouraged, the differently counted. Were they less real? Less unemployed? The inkwell glistened, dark and deep. The clock above the door ticked towards three. She took a breath, lowered her pen, and began to draw the eleventh identical figure. Precision demanded it. Clarity demanded it. Yet, as the ink flowed onto the paper, the image felt less like revelation, and more like a choice – one picture of the storm, while outside, the rain fell on everyone, differently. She drew another figure. Then another. The rows grew, clean, stark, and utterly silent about everything they left out.
