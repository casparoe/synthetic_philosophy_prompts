prompt: |-
  I'm writing the final for an upper-level seminar on the ethics of belief, and my students have already been through the James vs. Clifford thing — shipowner, genuine option, leap of faith, the whole highlight reel. I don't want an essay question they can answer by reciting that back at me. Here's the wrinkle I want to build it around. Some beliefs look self-fulfilling: if you believe you'll do well in the interview, you might actually perform better, so the belief isn't just a prediction about the world but part of the causal story that makes it true. Clifford says you must never believe on insufficient evidence. But what is "sufficient evidence" supposed to mean when the act of believing is itself one of the things that determines whether the belief comes true? And James's machinery is supposed to cover this, except it's not clear whether he's licensing a leap or just flagging a structural feature of certain situations. I want them to actually take a position on whether evidentialism can be saved for self-fulfilling beliefs, or whether the demand for prior evidence is incoherent in those cases. And I dont want any "both thinkers have a point" mush, or another shipowner recital.

  You're a philosopher who teaches this stuff, so take a stand. Before you commit to the exam question, give me a couple of sentences of brainstorming so I can see the design choices you're making — think carefully about where the real crux is and what a strong student would have to do that a weak one won't.

  Then please write: (1) the exam question itself, 75 minutes, 20 marks, phrased so it can't be answered by summarizing either essay; (2) a model answer of roughly 700-800 words that a good student could produce in that time; (3) a marking scheme that seperates the 20 marks into must-hit moves, with a note on what a B answer typically does differently from an A answer, and one line per move on the most common way candidates blow it.
