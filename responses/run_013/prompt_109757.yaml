prompt: |-
  I just moved from a physics lab into a philosphy program and I keep getting dragged into an argument I thought was settled. A friend says every successful theory we've ever had has eventually been replaced, so our current ones will be too, and realism is just optimisim. I want to know what a good realist response would actually have to do before I pick one. So write me the desiderata: what any adequate response to the pessimistic meta-induction has to get right. It should say which historical cases it must handle and why, what it can and can't concede about continuity of reference and approximate truth, how it should treat the difference between whole theories and the entities or equations that get carried over, and whether it can just retreat to the claim that whatever survives is the real part. Include the rival moves I've heard about, like dividing the theory into working and idle parts, keeping only structure, or insisting that the induction only works because we are bad at imagining the rivals our successors will have, and say which of these meet the requirements and which just rename the problem. Flag any pair of requirements that can't both be met, say which requirements are non-negotiable and which are just preferences of one camp, and tell me which single requirement does the most to rule out the lazy versions of realism. Don't give me a bibliography or citations, I can't look anything up right now anyway. Write it as continuous prose with no headings, bullet points, bold, or tables, like you're explaining it to me over coffee.
reasoning: |-
  Okay, the user has just moved from a physics lab to a philosophy program and is caught in an argument about the pessimistic meta-induction. Their friend argues that since all past successful theories were eventually replaced, current ones will be too, making realism just optimism. The user wants to know what a good realist response must achieve—its desiderata.

  First, I need to recall the pessimistic meta-induction (PMI). It uses history of science to challenge scientific realism by pointing out that past theories, though successful, were later discarded. So any realist response needs to counter this historical evidence effectively.

  The user mentioned specific aspects: historical cases to handle, continuity of reference and approximate truth, how to treat theories vs. entities/equations carried over, and whether claiming surviving parts are real is sufficient. Also, rival moves like dividing theories into working/idle parts, structural realism, or questioning the induction itself.

  Key historical cases include phlogiston, caloric, ether, Newtonian mechanics vs. relativity. Phlogiston is a big one—it explained combustion but was replaced by oxygen. How can a realist handle this? Maybe by showing that some entities like atoms persisted even if theories changed.

  Continuity of reference: Realists might concede that terms like "atom" referred to something real, even if past theories were wrong about properties. But the friend might argue that reference changed, e.g., Dalton's atoms vs. modern atoms. So the response needs to address when reference is preserved and when it's not.

  Approximate truth: Can we say past theories were approximately true? Newtonian mechanics works at low velocities, so maybe. But PMI says if past theories weren't true, why think current ones are? The realist needs to show that success indicates some truth, even if not complete.

  Whole theories vs. parts: Theories as a whole are discarded, but parts like equations or entities survive. Realists can't just pick the surviving parts as "real" post-hoc; that's cherry-picking. They need criteria to identify which parts are likely true beforehand.

  Rival moves: 
  - Divide working/idle parts: Working parts (those used in predictions) are retained, idle are discarded. But how to distinguish them without hindsight?
  - Structural realism: Only the structure (equations, relationships) is preserved, not the ontology. But then, is structure enough? Quantum mechanics challenges this.
  - Questioning the induction: Maybe past theories failed because we lacked imagination, but future replacements might be unimaginable now. However, this seems weak without evidence.

  Desiderata for a realist response:
  1. Handle key historical cases: Explain why phlogiston was wrong but oxygen theory succeeded, or why Newton is still useful. Show that some elements persisted.
  2. Address continuity and approximate truth: Define criteria for reference continuity (e.g., causal grounding). Allow that theories can be approximately true in specific domains.
  3. Differentiate theories from components: Justify why entities/equations survive while theories change. Avoid ad hoc "surviving is real" claims by having independent criteria.
  4. Evaluate rival moves: Structural realism handles some cases (like equations in physics) but struggles with ontology changes. Dividing working/idle parts needs a non-circular way to identify working parts. Questioning the induction is insufficient alone.
  5. Non-negotiable: The response must avoid ad hoc reasoning and provide predictive criteria for what's real. It should explain current success without relying on future unknowns.
  6. Conflicts: Demanding both that reference is preserved and that theories are approximately true might clash in cases like ether, where no entity survived. So perhaps focus on structural continuity instead.

  The user needs the strongest realist argument. The core requirement is providing a non-arbitrary criterion for what parts of a theory are truth-apt. Structural realism does this by focusing on mathematical structure, but it has limitations. Dividing working/idle parts is useful if based on use in predictions and experiments, not hindsight. The key is to show that success correlates with truth in a trackable way, countering the PMI's historical argument.
answer: |-
  Right, switching from oscilloscopes to ontology whiplash—welcome to philosophy. That pessimistic meta-induction (PMI) your friend is wielding is a classic realist-killer, and dodging it requires finesse. You can’t just shrug; a credible realist reply needs to satisfy several interlocking demands. Let’s walk through what it *must* achieve, where it can bend, and where it’ll snap if pushed too far.

  First, the historical baggage. Any response has to grapple with the graveyard of discarded theories without cherry-picking. Phlogiston is the big one—it explained combustion, respiration, even acidity, and its advocates had "empirical success." You can’t dodge it by saying "well, they weren’t *really* successful." Same for caloric (heat as fluid), the luminiferous ether (light waves needing a medium), or even Newtonian gravity. The realist has to explain why these failures don’t doom our current theories, without pretending these cases are irrelevant. You might concede that some theories were *more* catastrophically wrong than others (ether had math that partly survived; phlogiston’s ontology was a dead end), but you can’t ignore them. If your response only works for, say, the transition from Newton to Einstein but chokes on phlogiston-to-oxygen, it’s inadequate.

  Now, continuity and approximate truth—here’s where realists get sliced up. You *must* concede that reference isn’t always preserved. "Phlogiston" didn’t refer to *anything* real; it wasn’t "approximately oxygen." But you can’t concede this wholesale. For atoms or electromagnetic fields, there’s a chain of refinement: Dalton’s atoms aren’t Bohr’s, but there’s a causal-historical thread linking them to quarks and leptons. The realist needs a principled way to distinguish cases where reference shifts (like ether giving way to spacetime curvature) from cases where it’s stable (like genes from Mendel to DNA). Same for approximate truth: Newtonian mechanics *is* approximately true at low velocities and weak gravity, but caloric theory wasn’t "approximately" kinetic theory—it was just *wrong*. A good response explains why some theories get *core* things right (like atoms existing) while others miss entirely (like phlogiston’s substance-based explanation).

  This ties into the theory/entity split. You can’t treat theories as monolithic blocks. PMI loves saying "whole theories get abandoned," but realists counter that *parts* survive: Maxwell’s equations outlived the ether, Newton’s gravity is a limit case of Einstein’s. The realist must articulate why certain components—equations, entities, or structures—persist *because* they latch onto reality, not just by luck. But here’s the trap: you can’t just say "whatever survives is the real part." That’s post-hoc cheating. It’s like saying "the lottery winner was destined to win." You need independent criteria *now* for what’s "salvageable" in a theory. If your realism only IDs the "real" bits after they’ve survived a revolution, it’s empty.

  Now, the rival moves you’ve heard. Let’s gut-check them. First, splitting "working" vs. "idle" parts of a theory: the idea that what’s *used* in predictions and tech (like Fresnel’s equations for light) is likely true, while "idle" ontology (like the ether) is disposable. This helps with cases like ether, but struggles with phlogiston—it was deeply embedded in explanations, not idle. Worse, it risks circularity: how do you define "working" without hindsight? If you’re not careful, this just renames the problem. Second, structural realism: keep the equations and relationships (structure), ditch the ontology. This saves Maxwell’s math but abandons entities like photons or spacetime. It handles many physics transitions but collapses in biology or chemistry—what’s the "structure" of a gene without DNA? And it feels like surrender: if you’re only real about math, why call it realism? Third, attacking the induction itself: "PMI assumes we’re not clever enough to have finally got it right." This is weak tea. It might buy time, but without evidence, it’s just faith. PMI thrives on history; you can’t dismiss history by imagining future genius.

  So, what’s non-negotiable? First, your response must provide *non-arbitrary criteria* for distinguishing "surviving" from "discarded" elements *in advance*. No retroactive cherry-picking. Second, it must engage the hardest cases (phlogiston, caloric) without hand-waving. Third, it has to explain *why* success correlates with truth-tracking—otherwise, PMI’s "we got lucky before" charge sticks. Preferences? Some realists cling to entities (electrons are real!), others to structure (Lagrangians are real!). But if your account can’t handle both equations and ontology in a unified way, it’ll feel fractured.

  Where’s the tension? You can’t both insist on *full reference continuity* (every old term points to something real) *and* concede radical breaks like phlogiston. Something has to give—usually, continuity gets limited to "mature" theories or robustly detected entities. Also, demanding that *whole theories* are approximately true is suicide; PMI butchers that. You need selective retention.

  The single requirement that kills lazy realism? **Non-arbitrary salience**. If your account can’t specify *now* what parts of today’s theories are likely truth-apt—using criteria that don’t rely on future science—it collapses into "whatever sticks is real." That’s just optimism with extra steps. Structural realism and working/idle splits *try* this, but often fail the phlogiston test or lapse into hindsight. The best realist responses anchor salience in something like *explanatory indispensability* or *manipulability* (if you can poke it and predict outcomes, it’s probably real). But even that needs to show why past "indispensable" things (phlogiston) weren’t actually indispensable. It’s messy, but philosophy’s coffee is always bitter. Sip slowly.
