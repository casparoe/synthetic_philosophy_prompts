prompt: |-
  Before I commit to a line on causation by omission I want the requirements list first — what any account of it has to get right, with the case behind each item, rather than another theory plus it's pet example.

  I'm after things like: it has to make the gardener's failure to water a cause of the plant's death, but not the neighbour's failure, and not the stranger's in another country — so it needs something to stop every not-doing by everyone counting as a cause of everything. It has to say whether my not throwing the rope and my pushing him in are the same kind of thing or different, and whether it matters that I could have done otherwise. It has to cope with 'omissions' that are really the absence of a thing, like the missing rock that lets the river flood, without just positing negative events as causes. It has to square with whatever general theory of causation you hold — counterfactual, regularity, powers-based, interventionist — instead of being a special annex bolted on for omissions. And it should explain why people's omission judgements shift when some norm gets broken.

  For each requirement say what forces it on us. Then flag the pair you think can't both be met, and which single requirement rules out the most otherwise plausible accounts. If the whole list turns out to be unsatisfiable, say so — that'd be the interesting result.
reasoning: |-
  Okay, the user is asking for a comprehensive list of requirements that any account of causation by omission must satisfy. They want each requirement backed by a specific case, not just theoretical examples. They also want to know which requirements conflict and which one is most problematic for existing theories.

  First, I need to parse their examples. They mentioned the gardener not watering the plant causing death, but not the neighbor or a stranger. So Requirement 1 is about constraining causal scope to preempt overattribution. The gardener case forces this because we intuitively blame the gardener but not others. 

  Then they ask about comparing not throwing a rope vs pushing someone in. That points to Requirement 5 on the nature of omissions—are they causes or enabling conditions? And whether agent capacity matters (Requirement 7). The drowning case shows omission is causal only if the agent could have acted. 

  The missing rock flooding example requires handling absences without reifying negative events (Requirement 3). This needs a solution that doesn't invent "negative events" as causes. 

  The norm-shifting judgments (Requirement 8) come from cases like security guards failing duties. People's causal attributions change when norms are violated, so the theory must explain that. 

  For conflicts, I see Requirement 4 (unifying with general causation) clashes with Requirement 3 (no negative events). Counterfactual theories struggle with absences, while process theories avoid negative events but can't handle omissions as causes. 

  The most problematic requirement seems to be Requirement 6 (intrinsic vs extrinsic). The keyhole case shows how location matters—the absence of a rock at the breach point is causal, but not elsewhere. This rules out many simple counterfactual approaches. 

  The user might be a philosopher or legal theorist building a case against existing omission theories. Their unspoken need is likely identifying if a consistent account is even possible—or if the contradictions prove causation by omission is conceptually flawed. The meta-goal is probably to show that standard theories fail these tests, justifying a new approach or skepticism. 

  I should structure each requirement with the forcing case, note conflicts, and conclude that while no theory satisfies all, Requirement 6 is the biggest hurdle. The unsatisfiability hint suggests they suspect this might be a dead end—which is worth highlighting.
answer: |-
  Here's a requirements list for a theory of causation by omission, derived from the core problems and cases you outlined, with the forcing case and rationale for each requirement:

  1.  **Constraint of Scope (Prevent Universal Causation):**
      *   **Requirement:** Must explain why *only specific omissions* (e.g., the gardener's failure to water) cause an outcome (plant death), while countless others (neighbor's failure, stranger on another continent) do *not*.
      *   **Forcing Case:** The Gardener Case (Gardener fails to water *his* plant; it dies. Neighbor didn't water it either, but isn't a cause. A stranger in another country certainly didn't water it, but is irrelevant).
      *   **Forces It:** Without this constraint, *every* instance of "X did not prevent Y" becomes a cause of Y, leading to absurdity (e.g., everyone who didn't water the plant caused its death). This is the core problem of overdetermination by omission.

  2.  **Distinction from Positive Actions:**
      *   **Requirement:** Must clarify the relationship between omissions and positive actions. Are they fundamentally the same kind of causal factor, or different? Specifically, must address whether *not-throwing-a-rope* is the same kind of cause as *pushing-someone-in*.
      *   **Forcing Case:** The Drowning Case Variant (Victim drowns. Scenario A: I push him in (positive act). Scenario B: I stand by with a rope and deliberately don't throw it (omission). Are these causally equivalent regarding the death?).
      *   **Forces It:** Moral, legal, and intuitive responses often treat deliberate harmful omissions similarly to positive acts, suggesting a need for causal parity, yet the metaphysics of *absence* vs. *presence* seems fundamentally different. The theory must account for this.

  3.  **Avoidance of Negative Events/Objects:**
      *   **Requirement:** Must account for causation by absence (e.g., the missing rock) without positing "negative events" (the non-watering, the non-presence of the rock) or "negative objects" as genuine causal relata inheriting the problematic ontological status of absences.
      *   **Forcing Case:** The Missing Rock / Flood Case (A flood occurs because a crucial rock is missing from the levee. The *absence* of the rock is causally relevant. But what *is* "the absence"? Is it a thing?).
      *   **Forces It:** Metaphysical parsimony and avoidance of dubious entities like "negative events" which seem like shadows of actual events/objects. The cause seems to be the *lack* of something, not a positive entity.

  4.  **Integration with General Causation Theory:**
      *   **Requirement:** Must be seamlessly integrated into the chosen general theory of causation (e.g., counterfactual, process, mechanistic, probabilistic, powers-based, interventionist), not an ad-hoc add-on or exception.
      *   **Forcing Case:** Any case of omission causation must be analyzed using the *same core principles* as a clear case of positive causation within the theory (e.g., if counterfactual dependence defines causation for positive acts, it must work for omissions without special pleading).
      *   **Forces It:** Theoretical consistency and elegance. A theory shouldn't need a separate "omission module" fundamentally disconnected from its core account.

  5.  **Causal Status of Omissions (Enabling vs. Causing):**
      *   **Requirement:** Must determine whether omissions are best understood as *causes* proper or merely as *enabling conditions* (or absences of preventers) and provide criteria for this distinction where relevant.
      *   **Forcing Case:** The Drowning Case Variant (Is my *not throwing the rope* the *cause* of the death, or merely the *failure to prevent* a death caused by the water/current? Contrast with pushing in).
      *   **Forces It:** Intuitions differ, and legal/moral responsibility often hinges on this distinction. The theory needs a principled basis for assigning causal status.

  6.  **Intrinsic/Extrinsic Factors & Location Specificity:**
      *   **Requirement:** Must explain why the absence *at a specific location/time* matters (the specific rock missing from *this* hole) while similar absences elsewhere do not.
      *   **Forcing Case:** The Missing Rock / Flood Case (The absence of a rock *from the precise breach point* causes the flood. The absence of an identical rock from my garden doesn't cause the flood). Also applies to the Gardener Case (gardener's omission matters, neighbor's identical omission doesn't).
      *   **Forces It:** Highlights that the causal efficacy of an absence is often context-dependent and tied to specific spatio-temporal or functional loci, not just the general non-existence of something.

  7.  **Relevance of Ability/Normative Expectation:**
      *   **Requirement:** Must account for the role of an agent's *ability* to act ("could have done otherwise") and the presence or absence of a *normative expectation* (duty, role, promise, statistical norm) in determining whether their omission is causal.
      *   **Forcing Case:** The Drowning Case Variant (If I can't swim, my not jumping in isn't causal. If I'm the lifeguard on duty, my not jumping in *is* causal. If I'm just a bystander with no duty, maybe not). Also, the Security Guard Case (Guard fails to patrol; robbery occurs. We judge the guard's omission causal *because* it was their job).
      *   **Forces It:** Our causal judgments about omissions shift dramatically based on normative factors and perceived ability, unlike judgments about most positive causes. A purely descriptive/physical account seems insufficient.

  8.  **Explanation of Norm-Driven Judgment Shifts:**
      *   **Requirement:** Must explicitly explain *why* judgments about whether an omission caused an outcome change when a norm (moral, legal, functional, statistical) is perceived as being violated.
      *   **Forcing Case:** The Security Guard Case vs. Bystander Case (Identical physical inaction by a guard vs. a bystander leads to different causal judgments about a robbery). Also, the Gardener Case (gardener has a duty, neighbor does not).
      *   **Forces It:** This is a robust psychological and linguistic phenomenon. A theory ignoring it fails descriptively. It links back to Requirement 7 but demands an explanation *of the shift*, not just a criterion incorporating norms.

  **The Conflict: Requirements 3 & 4 are the hardest to reconcile.**

  *   **Requirement 3 (Avoid Negative Events):** Demands an account that doesn't reify absences.
  *   **Requirement 4 (Integration):** Demands the account works within a standard theory of causation (e.g., counterfactual, process).
  *   **Conflict:** Standard theories struggle with Requirement 3.
      *   **Counterfactual Theories:** Naturally handle omissions via dependence (`If Gardener had watered, plant wouldn't have died`). But this *seems* to satisfy Requirement 1 only by implicitly smuggling in norms/expectations (why test *that* counterfactual and not `If stranger watered...`?). More critically, the dependence *is* on a negative event/state (the non-watering). Requirement 3 is violated unless the theory interprets the counterfactual purely modally without ontological commitment, which is tricky.
      *   **Process/Mechanistic Theories:** Focus on spatio-temporal physical connections. Absences lack physicality, making it hard to see them as part of a causal process or mechanism without violating Requirement 3. They often relegate omissions to background conditions or absences of preventers (touching on Requirement 5), struggling with Requirements 1 and 8.
      *   **Powers/Dispositional Theories:** Can frame absences as removing inhibitors/allowing powers to manifest (e.g., water's drowning power manifests in the absence of rescue). This avoids negative events *as causes* but might frame the omission as the *removal of a preventing power* or the *failure to manifest a preventing power*. Whether this fully satisfies Requirement 3 is debatable. Integration (Requirement 4) is often cleaner than for process theories.

  **The Most Ruling-Out Requirement: Requirement 6 (Intrinsic/Extrinsic & Location Specificity).**

  *   **Why:** Many initially plausible accounts (especially simple counterfactual dependence or simple "duty-based" accounts) founder here.
      *   Simple Counterfactual: `If *a* rock were present *here*, the flood wouldn't have happened` seems true, but so does `If *a* rock were magically teleported from my garden *here*...`. But the absence of the *specific* rock that *should* have been there, or the absence *at that location*, seems causally relevant, not the general non-existence of rocks. Simple counterfactuals struggle to capture this specificity without adding complex contextual parameters.
      *   Norm/Duty-Based: While norms explain *why* we focus on the gardener's omission, they don't easily explain why the *specific location* of the missing rock matters physically for the flood. The flood is caused by the *physical* absence *at that point*, regardless of norms about rocks.
  *   Requirement 6 forces the theory to ground the causal relevance of an absence in the *specific context* of the situation – the hole in the levee *needs* a rock *here* right now – in a way that isn't fully captured by general counterfactuals or norms alone. It highlights the need for a tight connection between the absence and the *specific causal mechanism* leading to the outcome.

  **Satisfiability:**

  The list is **extremely demanding**. No existing theory satisfies all requirements perfectly. Simple counterfactualism fails Requirements 3 (ontologically) and 6 (specificity), and struggles with 1 & 8 without auxiliaries. Pure process theories fail Requirements 1, 5 (often), 6, 7, and 8. Powers-based and sophisticated contextualist-interventionist counterfactual approaches come closest but still face significant challenges, particularly in cleanly satisfying Requirement 3 while providing a robust, non-circular account of Requirements 1, 6, 7, and 8.

  **Conclusion:** While not provably *unsatisfiable*, the conjunction of these requirements, particularly the conflict between avoiding negative entities (3) and integrating with standard causation theories (4), coupled with the demanding nature of location specificity (6) and norm-sensitivity (7, 8), makes constructing a fully adequate unified theory of causation by omission a major philosophical challenge. The most promising approaches involve heavily contextualized counterfactual, dispositional, or normative frameworks, but each requires significant theoretical work and faces objections. Requirement 6 is likely the most effective filter against simplistic accounts.
