prompt: |-
  I've been going down a rabbit hole on brain death vs. circulatory death and I keep arriving at what feels like the obvious point nobody wants to say out loud. "Irreversable" just means "we can't fix it with the tech we've got right now," so every time resuscitation gets a bit better death gets pushed back, which makes the definition of death a moving target -- i.e. really a policy call about who's worth keeping alive. And a friend told me that some organ-donation protocols declare the patient dead and then restart the heart a few minutes later, and that brain-dead bodies can be kept going for years and even grow, which to me kind of settles it. So isn't brain death basically a legal fiction invented so surgeons could take organs, and isn't the honest position that death is a value judgment rather than a biological fact? And if that's right, why does everyone still talk about the circulatory criterion as the more "real" or natural one? Just explain it to me in plain continuous prose, like you'd write it in an email -- no headings, no bullet points, no bold, no tables.
reasoning: |-
  Okay, the user is diving deep into the definitions of brain death versus circulatory death, and they've hit on a key point: irreversibility depends on current medical technology. They feel that "irreversible" isn't a fixed biological fact but shifts with advancements in medicine. That means the definition of death changes over time, making it more of a policy decision about who gets saved and when to stop treatment. 

  They mention a friend told them about organ donation protocols where a patient is declared dead, but then the heart is restarted minutes later. Also, brain-dead bodies can be maintained for years, even growing. This makes them think brain death is a legal fiction created to allow organ harvesting. Their conclusion is that death is a value judgment, not purely biological. They also wonder why the circulatory criterion is seen as more "real" or natural.

  First, I need to validate their insight—they're right that irreversibility is tied to current tech. Medical progress does push back what we consider irreversible. For example, CPR and ECMO have changed how we view cardiac arrest. Brain death criteria were indeed developed alongside transplant medicine, but it's not just a legal fiction. The key is that brain death means total loss of all brain functions, including the brainstem, which controls vital functions. Even if the body is kept going with machines, without a functioning brain, there's no consciousness, no ability to breathe, etc. That's why it's considered death.

