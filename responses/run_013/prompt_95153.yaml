prompt: |-
  Last night a friend and I argued for three hours about what intelligence is, and I came away with a page of notes and no settled answer. The argument began with something small — I said that a pocket calculator beats either of us at arithmetic but that nobody would call it intelligent, and he replied that this shows only that we are confused about arithmetic, not about intelligence — and it ended with the two of us drafting eight candidate accounts on the back of an envelope and then disagreeing about which of them survives contact with the awkward cases. I would like a referee's version of that last part, in writing.

  Here are the eight candidates as we wrote them.

  1. The test-theoretic account: intelligence is whatever the general factor is — the shared variance behind performance on a broad battery of cognitive tasks. It is fixed by correlation, not by mechanism.

  2. The compression account: to be intelligent is to be a good model of one's world, and the measure is how much of what one encounters can be predicted, or equivalently how short a description one can give of it.

  3. The acquisition-rate account: intelligence is not skill but the efficiency with which skill is acquired. Two systems with identical current competence differ in intelligence if one needed a thousand examples where the other needed ten, and if the second can then move to a genuinely unfamiliar task.

  4. The search account: intelligence is the capacity to find actions that attain a specified objective across a wide range of environments, so that the ideal is defined over a distribution of environments and goals and measured as expected goal-attainment.

  5. The library account: there is no general engine. Intelligence is a large, well-indexed repertoire of special-purpose mechanisms plus a cheap policy for choosing among them; generality is an illusion produced by breadth of repertoire.

  6. The embodied account: intelligence belongs not to a solver but to a loop between a body and a world — the skill of finding and exploiting what the environment affords, largely without internal models, so that the boundary of the intelligent system is not the skin.

  7. The collective account: intelligence is properly attributed to groups, lineages, markets, and institutions that store and recombine competence across individuals and generations; treating it as an individual property is a category error.

  8. The deflationary account: intelligence is a folk category bundling several loosely related capacities. Any single definition is a stipulation serving some purpose — testing, legislation, engineering — and the only interesting questions concern which purpose.

  What I want from you:

  First, sort the eight into tiers — say four, best to worst — according to how far you would trust each as the anchor of a serious research program. The criterion we settled on, though we applied it very differently, is not which account sounds deepest but which commits us to the largest number of expectations that could turn out false; an account that nothing could disconfirm is not a contender, it is a mood. Give each item one sentence explaining its tier.

  Second, for each of the eight give two scores from 0 to 10: one for how much it constrains what we should expect to observe in a system we are examining, and one for how well it handles the following without special pleading — a pocket calculator; a bacterium swimming up a chemical gradient; a termite colony or a market price system; and a system that is fluent and wide-ranging in what it says yet collapses when a familiar task is re-dressed in unfamiliar clothing.

  Third, three sharper questions. (a) Which of the eight would let us say that a system became more intelligent while becoming less capable, and which make that combination impossible? (b) My friend's own preferred test was this: hold the kind of task fixed and vary its details, and read off intelligence as the degree to which performance survives the re-dressing. Say how well each account accommodates that test, and whether it is genuinely a ninth candidate or a restatement of one of the eight. (c) Which two of the eight are not real rivals but one commitment described twice, and which one, if any, is not a definition at all but a redescription of the question?

  Finish with the account you would keep if you had to keep exactly one, the single element you would graft onto it from the runner-up, and the strongest reason a reasonable person would still reject your choice.
reasoning: |-
  Hmm, the user presents a fascinating philosophical and scientific challenge about defining intelligence. They've had a marathon debate with a friend and distilled eight candidate definitions, now seeking structured analysis. The request is remarkably precise - tiered evaluation, constraint/scenario scoring, and three specific meta-questions, ending with a forced-choice synthesis. 

  First, I note the user's intellectual humility - despite the 3-hour debate and detailed notes, they admit no settled answer. Their frustration seems directed at definitional ambiguity rather than the friend. The pocket calculator example reveals their core concern: competence without understanding. 

  The tier ranking requires judging research viability by falsifiability - Popper's criterion. Accounts must generate testable predictions. For instance:
  - Test-theoretic (1) scores high because psychometrics constantly faces falsification through factor analysis anomalies. 
  - Deflationary (8) ranks lowest as it actively avoids commitments.
  - Library (5) and Collective (7) risk unfalsifiability through infinite expansion of "special mechanisms" or "group entities."

  For the scoring matrix, I need to simulate how each definition handles four edge cases consistently. The pocket calculator is the litmus test - most accounts struggle except perhaps Search (4). The fluency-collapse scenario specifically targets overfitting, making Acquisition-Rate (3) and Search (4) shine. 

  The sharp questions probe internal logic:
  - (a) Only Acquisition-Rate (3) clearly permits increased intelligence with decreased capability (via learning efficiency gains).
  - (b) The friend's "re-dressing resistance" test aligns strongly with Compression (2) and weakly with Test-Theoretic (1), but isn't wholly new.
  - (c) Library (5) and Embodied (6) feel like orthogonal commitments, whereas Deflationary (8) isn't a definition but a meta-commentary.

  Final synthesis is agonizing. Search (4) has the strongest engineering utility, but I'd graft Compression's (2) emphasis on world-modeling to avoid reward-hacking traps. The obvious counterargument? Search inherits all the problems of objective-specification in AI alignment. 

  Throughout, I'm mindful the user wants rigor, not reassurance. Their envelope notes suggest they've already spotted most tensions - like how Collective (7) challenges the individualist bias in other accounts. My role is to systematize, not surprise.
answer: |-
  Below is a referee's analysis of your eight candidate accounts of intelligence, structured as requested. The evaluation prioritizes **falsifiability** (capacity to generate testable predictions) and **explanatory coherence** across edge cases.

  ---

  ### **Tier Ranking** (Best to Worst by Research Viability)  
  **Tier 1: High Falsifiability**  
  4. **Search Account**: Directly generates testable hypotheses about goal-attainment efficiency across novel environments, inviting failure modes (e.g., adversarial perturbations).  
  3. **Acquisition-Rate Account**: Predicts measurable skill-learning curves and transfer failures, falsifiable via controlled training experiments.  

  **Tier 2: Moderate Falsifiability**  
  2. **Compression Account**: Testable via description-length metrics but risks circularity in defining "world-model" boundaries.  
  1. **Test-Theoretic Account**: Empirically grounded (g-factor), but correlations alone cannot distinguish mechanism from artifact.  

  **Tier 3: Low Falsifiability**  
  5. **Library Account**: "Large repertoire" is vague; hard to falsify without mechanistic constraints on "well-indexed."  
  6. **Embodied Account**: Rich phenomenology but lacks clear metrics for "affordance exploitation" sans internal models.  
  7. **Collective Account**: Shifts attribution but doesn’t specify how group intelligence emerges from individuals.  

  **Tier 4: Non-Falsifiable**  
  8. **Deflationary Account**: Rejects universal definitions; useful pragmatically but halts scientific inquiry by design.  

  ---

  ### **Scores for Constraint & Edge Cases**  
  *Scale: 0 (no constraint/poor handling) to 10 (strong constraint/consistent handling)*  

  | Account | Constraint Score | Edge Cases Score |  
  |---------|-----------------|------------------|  
  | 1. Test-Theoretic | 7 (Correlational bounds) | 4 (Fails calculator, colony, fluency-collapse) |  
  | 2. Compression | 8 (Requires predictive metrics) | 6 (Handles calculator, weak on bacterium/colony) |  
  | 3. Acquisition-Rate | 9 (Quantifies learning efficiency) | 9 (Excels on fluency-collapse; weak on calculator/colony) |  
  | 4. Search | 10 (Defines goals/environments) | 8 (Handles calculator/bacterium; struggles with colony) |  
  | 5. Library | 5 (Vague on "large repertoire") | 3 (Ad hoc on colony; fails fluency-collapse) |  
  | 6. Embodied | 4 ("Affordances" poorly bounded) | 7 (Handles bacterium/colony; fails calculator) |  
  | 7. Collective | 6 (Requires group-level metrics) | 7 (Excels on colony/market; fails calculator/individuals) |  
  | 8. Deflationary | 1 (No inherent constraints) | 2 (Dismisses cases as category errors) |  

  **Edge Cases Key**:  
  - **Pocket Calculator**: Competence without learning/adaptation.  
  - **Bacterium**: Simple adaptive behavior sans cognition.  
  - **Termite Colony/Price System**: Emergent "intelligence."  
  - **Fluency-Collapse**: Surface competence vs. robustness.  

  ---

  ### **Sharper Questions**  
  **(a) Intelligence ↑ / Capability ↓ Possible?**  
  - **Yes**: Only #3 (Acquisition-Rate) allows this (e.g., faster learning with narrower final capability).  
  - **No**: #1, #2, #4, #5, #6, #7 tie intelligence to performance breadth/depth.  
  - **N/A**: #8 (deflates the question).  

  **(b) Friend’s "Re-Dressing Robustness" Test**  
  - **Accommodates Well**: #2 (compression implies robustness to noise), #3 (efficient learning transfers), #4 (generalizes across environments).  
  - **Accommodates Poorly**: #1 (correlational, not mechanistic), #5 (fragile if repertoire gaps exist), #7 (group-level, not individual).  
  - **Verdict**: Not a ninth candidate—it’s a *test* aligning with #2, #3, or #4.  

  **(c) Non-Rivals & Redescriptions**  
  - **#5 (Library) & #6 (Embodied)**: Describe one commitment—**intelligence as external coupling** (internal library ↔ ecological affordances).  
  - **#8 (Deflationary)**: Not a definition—redescribes the question as terminological, evading substance.  

  ---

  ### **Final Synthesis**  
  **Keep**: #4 (**Search Account**). Most falsifiable, constrains expectations strongly, and handles edge cases robustly.  
  **Graft From Runner-Up**: Add #3’s (**Acquisition-Rate**) emphasis on *efficiency* to prioritize data/goal-sensitive adaptation.  
  **Strongest Rejection Reason**: Search inherits the **frame problem**—specifying goals/distributions for "wide range of environments" is often circular or anthropocentric (e.g., defining "goals" for a bacterium). A critic would argue it confuses intelligence with optimality under arbitrary constraints.  

  ---  
  This reflects a view where intelligence is *pragmatic optimization under uncertainty*, prioritizing adaptive generality over fixed competence or correlation. The unresolved tension? Whether intelligence requires **internal models** (#2, #4) or can be fully embodied/collective (#6, #7)—a debate your envelope captures brilliantly.
