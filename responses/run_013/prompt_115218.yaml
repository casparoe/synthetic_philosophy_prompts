answer: |-
  1.  **What is the fundamental nature of the contractualist test: Is it a procedure for *interpersonal justification* (ensuring no single individual's complaint blocks the principle) or a disguised method for *impartial ranking* of aggregate states of affairs?** This is maximally upstream because it dictates whether aggregation is even conceptually possible within the test's logic. If justification is inherently non-comparative across persons, aggregation dissolves; if the test implicitly ranks outcomes, aggregation becomes unavoidable but unacknowledged, settling debates about complaint individuation's role and the force of anti-aggregation constraints lower down.

  2.  **What constitutes the basic "unit" of complaint: Is it a discrete harm/benefit event ("time-slice"), an interest over time, the total burden/benefit to an individual across their life ("whole-life"), or a claim about comparative treatment under the principle?** This directly determines what counts as "a person" having "a complaint" for rejection purposes. It is highly tractable theoretically and profoundly affects concrete cases (e.g., death vs. many stubbed toes hinges on whether death is one massive complaint or myriad lost opportunities). Answering this would resolve ambiguity in applying "reasonable rejection" to distributed burdens and clarify the scope of anti-aggregation.

  3.  **How does contractualism handle burdens/benefits distributed *across time* for a *single individual* (intrapersonal aggregation) compared to burdens/benefits distributed *across different individuals* (interpersonal aggregation)?** This is crucial and often underexplored. If intrapersonal aggregation is permitted (e.g., many small benefits over time outweighing one large harm), the barrier to interpersonal aggregation weakens significantly, challenging the core anti-aggregation commitment. Its tractability is moderate, but resolving it would force clarity on complaint individuation and reveal if anti-aggregation rests on a person/event boundary.

  4.  **Is the anti-aggregation constraint primarily a restriction on the *content* of candidate principles (e.g., principles cannot *require* aggregative trade-offs) or a restriction on the *kinds of reasons* individuals can adduce *within* the test (e.g., one cannot cite the numbers affected as part of one's complaint)?** This impacts how the test functions procedurally. If it's about principle content, the test might still use aggregative reasoning to *select* non-aggregative principles. If it's about admissible reasons, it shapes how individuals formulate rejections. Clarifying this would constrain interpretations of "reasonable rejection" and influence debates about prioritarianism lurking within contractualism.

  5.  **Does the contractualist framework, despite its deontic focus on wrongness and rejection, inevitably encode a form of *prioritarianism* (greater weight to the worse off) in its assessment of the "strength" of individual complaints, and if so, is this prioritarianism doing the real work in resolving apparent aggregation dilemmas?** While seemingly downstream, this question cuts deep: if prioritarianism is inherent in judging complaint strength, then debates about individuation and aggregation constraints are secondary to this underlying axiology. It's moderately tractable (analyzing "strength") and answering it would expose whether contractualism offers a genuinely distinct alternative to aggregative theories or merely repackages their values.
