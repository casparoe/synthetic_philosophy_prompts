prompt: |-
  I teach a mid-level epistemology course and have just finished a first pass over my final exams. One question is giving me trouble, and I would rather have it assessed on the merits than by how fluent the answer sounds. The night before I began marking, a friend and I spent a long evening arguing about the second part of it, and we ended up disagreeing about whether the position the student takes there is defensible; I would like that question settled before I write the comments.

  Question 3 (20 marks: 8 for (a), 8 for (b), 4 for (c)).

  Ravi has spent a decade working on a technical problem and is now firmly convinced that theory T is correct; his conviction rests on a long argument he has constructed and checked many times. He then reads a well-conducted study of his subfield, whose methods he has no reason to doubt, reporting that specialists with track records like his, who have held a single theory as correct for a decade or more, turn out to be mistaken about that theory in roughly 70 per cent of cases. Nothing in Ravi's own data or argument has changed: he has the same evidence and the same argument he had before he read the study.

  (a) Does the study give Ravi evidence bearing on whether T is true, or only on whether his belief that T is true is justified? Explain what makes it evidence and how it is supposed to bear.

  (b) Suppose Ravi goes on believing T while also believing that, in the light of the study, he is not justified in believing T. Is that epistemic akrasia? Is such a state ever rationally permissible? Set out the case for thinking it cannot be rational and the case for thinking it can, then say which you accept.

  (c) Ravi objects: the study's conclusion is itself an expert judgment in his subfield, so by the study's own finding it is about 70 per cent likely to be mistaken, and he can therefore set it aside. Assess this objection.

  Student's answer:

  (a) The study is higher-order evidence: it is evidence about the process by which Ravi formed his belief, not evidence about T. It nevertheless bears on the truth of T, because the reliability of a process is a guide to the reliability of what it produces. If a process that issues convictions of this kind gets them right only about 30 per cent of the time, then a conviction it issues has about a 30 per cent chance of being correct, so Ravi should now be about 30 per cent confident that T. The study is therefore not merely about Ravi's justification; it is a reason to think that T is probably false.

  (b) Ravi believes T, and he believes that he is not justified in believing T. That is epistemic akrasia — a belief that condemns itself. One can argue that the state cannot be rational: if Ravi really accepts that the study has undermined his entitlement to T, then he should suspend judgment about T, since to keep believing something that he judges himself unjustified in believing is simply not to be moved by his own epistemic standards. I think the state can be rational all the same. Rationality is permissive: the first-order evidence and the higher-order evidence point in different directions, and there is no single correct way of weighing them against each other, so Ravi may legitimately hold on to T while conceding that the study has undermined his entitlement to it. The contrary view looks like a coherence requirement imposed on beliefs rather than an evidential one, and it is not obvious that beliefs answer to any such requirement.

  (c) The objection fails. The study's finding concerns specialists who have held a conviction for a decade or more; the study's conclusion is a statistical result about a population, and is not itself a decade-long conviction about a theory, so the 70 per cent figure does not apply to it. Ravi would be applying the study outside the class of cases it is about.

  Please give me a mark out of 20 and then the comments I should write on the script: for each part, what is right, what is wrong, and for anything wrong exactly what the error is and why it matters; where the student takes a defensible but contestable line, say so, and say what a fully satisfactory answer would have had to do instead. I need the assessment keyed to the parts rather than a general impression, since the mark has to be defensible if the student appeals it.
reasoning: |-
  Okay, let me tackle this epistemology exam question step by step. The professor needs a detailed assessment of the student's answer to three parts of a question about higher-order evidence and epistemic rationality.

  First, I consider part (a). The student correctly identifies the study as higher-order evidence about belief formation rather than direct evidence about theory T. Their explanation about reliability translating to truth probability is standard in the literature. The 30% confidence conclusion seems correct - this aligns with how statistical evidence functions in epistemology. The only minor improvement would be explicitly distinguishing between propositional and doxastic justification, but the core reasoning is sound.

  For part (b), the student accurately defines epistemic akrasia and presents both sides well. Their defense of permissive rationality is contestable but defensible - they should have cited sources like Rosen or Schoenfield to strengthen it. The key error is claiming the contrary view is "merely" a coherence requirement without addressing substantive arguments about why akrasia might be intrinsically irrational. This matters because it shows incomplete engagement with the literature.

  Part (c) is handled perfectly. The student identifies the category error in Ravi's objection - applying a statistic about long-held convictions to a population study itself. This demonstrates clear understanding of reference class problems. No improvements needed here.

  I notice the student's writing is admirably precise for an undergraduate. Their part (b) position reflects real scholarly debate, so I'll emphasize that it's defensible while noting where deeper treatment was possible. The professor will appreciate knowing this resolves their disagreement with their friend about the permissibility of akrasia.

  For marking: (a) gets full credit despite minor omissions; (b) loses 2 points for underdeveloped counterargument; (c) is flawless. Total 18/20 seems fair - excellent work with room for sophistication in engaging objections.
answer: |-
  ### Mark: 18/20  
  *(a: 8/8, b: 6/8, c: 4/4)*  

  **Comments on Script:**  

  #### (a) 8/8  
  **What is right:**  
  - Correctly identifies the study as higher-order evidence (HOE) about Ravi’s belief-forming process, not direct evidence about T.  
  - Accurately explains how HOE bears on the truth of T: by undermining the reliability of the process generating Ravi’s belief, it indirectly reduces the probability that T is true.  
  - Justifies the 30% confidence conclusion appropriately, linking process reliability to truth-conduciveness.  
  - Distinguishes cleanly between evidence about justification vs. truth, while showing how they connect.  

  **What could be improved (minor):**  
  A fully exemplary answer might note that HOE *indirectly* bears on truth *via* affecting justification (e.g., by making Ravi’s belief-forming process unreliable), but this is implicit in your explanation. No deduction.  

  ---  

  #### (b) 6/8  
  **What is right:**  
  - Correctly defines the state as epistemic akrasia (believing P while believing one’s belief in P is unjustified).  
  - Fairly presents the *case against permissibility*: Akrasia violates epistemic coherence; if Ravi genuinely accepts his justification is undermined, he *should* suspend judgment.  
  - Defends a coherent *case for permissibility*: Appeals to rational permissivism (HOE and first-order evidence can conflict, with no unique weighting).  
  - Correctly notes that demanding coherence might impose non-evidential constraints.  

  **What is wrong and why it matters:**  
  - **Error:** The defense of permissibility is **under-argued** and misses a key nuance. You claim rationality is "permissive" here, but you do not address the *strong objection* that akrasia is *intrinsically* irrational (e.g., it violates the "enkratic principle" that rationality forbids self-condemning beliefs). Simply asserting permissivism without engaging this deeper tension weakens the case.  
  - **Why it matters:** Epistemologists (e.g., Titelbaum, Worsnip) argue that akrasia involves a *pragmatic contradiction*: Ravi’s belief ("I shouldn’t believe T") directly negates the rationality of his simultaneous belief in T. Dismissing this as "not obviously required" ignores a major challenge.  
  - **Defensible but contestable:** Your position *is* defensible (e.g., Lasonen-Aarnio argues agents can rationally "bracket" HOE), but it needs to:  
    - (i) Acknowledge that akrasia is *pro tanto* irrational and requires special justification (e.g., exceptional first-order evidence),  
    - (ii) Explain *why* Ravi might epistemically privilege his first-order evidence over HOE (e.g., if he has unique access to his argument’s strength).  

  **Fully satisfactory answer:** Would engage the tension between permissivism and enkratic requirements, citing specific arguments (e.g., "While Titelbaum argues akrasia is always irrational, Cohen suggests agents can rationally discount HOE when first-order evidence is sufficiently robust").  

  ---  

  #### (c) 4/4  
  **What is right:**  
  - Perfectly identifies Ravi’s error: He misapplies the study’s statistic to a *different class* of beliefs.  
  - Clearly explains the distinction: The study targets *specialists’ decade-long convictions about theories*, but its *own conclusion* is a *statistical finding*, not a "decade-long conviction" about a theory.  
  - Highlights the reference-class problem: The 70% error rate applies only to beliefs meeting the study’s criteria (which its own conclusion does not).  
  - Effectively refutes the objection without overcomplicating it.  

  **No improvements needed.**  

  ---  
  ### Summary for Student  
  "An excellent response overall. (a) is precise and well-justified. (c) perfectly diagnoses Ravi’s category error. In (b), you fairly present both sides of the akrasia debate and offer a defensible view, but the defense could engage deeper objections to the permissibility of self-undermining beliefs. 18/20."  

  ### Why This Resolves Your Disagreement  
  Your friend likely emphasized the *prohibition* on akrasia (as many epistemologists do), but the student’s permissivist stance **is defensible** (e.g., in "rational dilemmas" where evidence conflicts irreconcilably). However, the student’s answer is **not maximally robust**—it doesn’t address why akrasia isn’t *incoherent*—so a slight deduction in (b) is warranted. This affirms your instinct that the position has merit but needs fuller argumentation to earn full credit.
