  My buddy's been working through one of those popular books on arguments for God, and he tried to explain Gödel's modal ontological argument to me over coffee. Here's his summary, as close as I can remember it: "Gödel's proof is basically Anselm's argument rewritten in modal logic, which is why it's so much harder to dismiss. God is defined as a being with all positive properties — positive meaning good, the kind of quality it's better to have than lack. Existing necessarily is one of those positive properties, so God has to exist in every possible world, not just this one. The only serious objection is that the axioms are too strong: if you buy them, every true statement turns out to be necessarily true, so there's no contingency left in the world at all, which is absurd, so the proof fails. Gödel was a devout believer who wanted to give the old proof a rigorous foundation."

  I did some philosophy in undergrad but never touched Gödel, so I definately can't tell how much of this is on the level. Could you go through it sentence by sentence — what a philosopher of religion would nod at, what they'd call a standard simplification, what's just wrong, and what a defender of the argument would push back on? And at the end: does his conclusion (that the argument fails) actually follow from the parts of the summary that are correct? I'm also curious whether the no-contingency thing is really as fatal as he makes it out, or if there's a live debate about where the trouble lies — like which axiom is doing the damage and whether the collapse is a problem for the proof or just a cost of the whole framework.
