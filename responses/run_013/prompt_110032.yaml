  We are designing an activity for a 90-minute seminar with 18 students. The goal is to have students experience the difference between a difference-making (counterfactual) theory and an interventionist theory of causation, without a framing lecture. The activity will use the greenhouse scenario as a spine and will include at least four cases: (i) plain case, (ii) preemption, (iii) symmetric overdetermination, and (iv) a confounding case.

  Activity Design:

  Title: "The Greenhouse Challenge"

  Objective: Students, acting as investigators, must determine the cause of the beds being watered in a series of scenarios. They will use two methods: "Counterfactual Reasoning" and "Interventionist Testing", and see where these methods lead to different conclusions.

  Setup:
  - Divide the class into 6 teams of 3 students each. Each team is an "investigation unit".
  - Each team gets a packet with the rules and the scenario descriptions.
  - There will be 4 rounds (one for each case). In each round, teams are given a scenario and must decide the cause using both methods.
  - The two methods:
    1. Counterfactual Method (Difference-Making): Ask "If this event had not occurred, would the outcome have occurred?" If the answer is no, then it is a cause.
    2. Interventionist Method: Imagine you can set the candidate cause to a different value (e.g., turn it off) while holding fixed other factors that are not effects of the candidate cause. Then see if the outcome changes. If it does, then it is a cause.

  Rules:
  - For each scenario, teams must record:
     a) The cause(s) according to the Counterfactual Method.
     b) The cause(s) according to the Interventionist Method.
     c) A brief reason for each.
  - Teams must come to a consensus and write their answers on a provided sheet.
  - After all teams have submitted for a round, the instructor will collect the sheets and then reveal the "official" verdicts (which will be based on standard interpretations of the theories) and a brief explanation. But note: the goal is for the disagreement to emerge from the activity, so the instructor will not announce the theories until the debrief.

