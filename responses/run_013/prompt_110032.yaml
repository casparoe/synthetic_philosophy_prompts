answer: |-
  Below is a fully designed 90-minute seminar session centered on your greenhouse scenario, structured as an immersive activity to create experiential friction between difference-making (counterfactual) and interventionist theories of causation. The session avoids upfront lecturing, uses rules and roles to generate student-driven divergence, and includes a debrief mapping the philosophical stakes. Predictable challenges and contested interpretations are flagged.

  ---

  ### **Session Title: Greenhouse Inquiry Tribunal**  
  **Format**: Role-play activity with structured rounds (55 min) + Debrief (35 min)  
  **Students**: 18 (split into 6 teams of 3)  
  **Roles per Team**:  
  - **Counterfactual Advocate (CA)**: Defends verdicts based on "What if X hadn’t happened?"  
  - **Interventionist Advocate (IA)**: Defends verdicts based on "What if we fixed X independently?"  
  - **Recorder**: Documents arguments and verdicts.  

  **Materials**:  
  - Scenario cards for each case (distributed sequentially).  
  - Verdict sheets with columns: *Case*, *CA Verdict*, *IA Verdict*, *Team Agreement*.  
  - Timer visible to all.  
  - Whiteboard for recording class verdicts.  

  ---

  ### **Activity Rules**  
  1. **No framing lecture**: Begin by assigning roles and reading the core scenario (below).  
  2. **Core Scenario**:  
     > "A greenhouse has two independent pumps (A and B), each triggered by its own soil-moisture sensor. Either pump alone delivers sufficient water. A manual override forces both on. The outcome of interest is the beds being watered."  
  3. **Four Rounds**: Teams receive one scenario card per round. For each:  
     - **5 min**: Teams debate using their role’s theory (CA and IA argue; Recorder notes reasoning).  
     - **2 min**: Teams reach a verdict for each theory and whether they agree.  
     - **3 min**: Class poll and tally on whiteboard (✓/✗ for each theory’s verdict).  
     - **Scenario sequence**:  
       - **Round 1 (Plain Case)**: Only Pump A’s sensor is dry. A runs, B does not. Beds watered.  
       - **Round 2 (Preemption)**: A’s sensor dry → A runs. B’s sensor dry → B runs *after* A. B’s water arrives too late. Beds watered by A alone.  
       - **Round 3 (Symmetric)**: Both sensors dry simultaneously. Both run. Either alone would suffice. Beds watered.  
       - **Round 4 (Confounding)**: Ambient heat dries soil (triggering sensors) *and* increases plants’ water needs. Heat is unchangeable. Both pumps run, beds watered. Test: Can we isolate the cause?  

  4. **Scoring**:  
     - Teams earn points only if their CA and IA verdicts *diverge* in a given round.  
     - Goal: Highlight where theories disagree. Agreement (e.g., Round 1) earns no points.  

  5. **Facilitator Role**:  
     - Silence your own views; ask Socratic questions (e.g., "What would your role say *here*?").  
     - Enforce time limits strictly.  

  ---

  ### **Predictable Student Challenges & Mitigation**  
  - **Round 1 (Plain Case)**:  
    - **Challenge**: Students may find it "obvious" that A caused watering, missing the chance to articulate *why*.  
    - **Mitigation**: Ask teams to explicitly state how CA and IA *both* reach the same verdict (CA: "Without A, no water"; IA: "Turning off A changes outcome"). This primes them for later friction.  

  - **Round 2 (Preemption)**:  
    - **Challenge**: CAs may struggle with late preemption (B fires but is irrelevant). Some may blame B for "failing" despite it not being a human agent.  
    - **Mitigation**: Redirect to mechanics: "The sensors and pumps lack intentions. Focus on the physical chain."  

  - **Round 3 (Symmetric)**:  
    - **Challenge**: Intuition says both A and B caused watering. Students may resist theories that deny this, especially IA.  
    - **Mitigation**: Let frustration simmer—it sets up the debrief. Ask: "If you *must* choose one theory, which handles overdetermination better?"  

  - **Round 4 (Confounding)**:  
    - **Challenge**: Students may try to "blame" heat (common cause) but hit a wall: "We can’t change heat without changing everything!"  
    - **Mitigation**: Reward teams that flag the problem (e.g., "We can’t intervene on sensors without affecting needs").  

  ---

  ### **Debrief (35 min)**  
  **Goal**: Map activity outcomes to the theories, expose disagreements, and distinguish fixable vs. fatal flaws.  

  #### **1. Round-by-Round Analysis** (15 min)  
  | Case          | Counterfactual (CA) Verdict       | Interventionist (IA) Verdict      | Point of Divergence                          |  
  |---------------|-----------------------------------|-----------------------------------|---------------------------------------------|  
  | **Plain**     | A caused watering. (✓)            | A caused watering. (✓)            | *None*—baseline agreement.                  |  
  | **Preemption**| A caused watering. (✓)            | A caused watering. (✓)            | *None*—preemption is *not* where they split. (But note: Some CAs may say "not A" if misapplying counterfactuals—correct this.) |  
  | **Symmetric** | Neither caused watering. (✗)      | Neither caused watering. (✗)      | *None*—but this exposes shared flaws.       |  
  | **Confounding**| Sensors caused watering. (✓)     | *Uncertain* or "No cause found." (✗) | **Divergence**: IA requires interventions that are *impossible* here (heat links sensors and needs). CA ignores this. |  

  - **Key Insight**: The split occurs in **Round 4 (Confounding)**, not preemption/symmetric cases.  
    - **CA**: "If sensors weren’t dry, watering wouldn’t occur" → Sensors are causes.  
    - **IA**: "We can’t set sensors to ‘wet’ without changing heat, which alters water needs" → No clear cause.  

  #### **2. Why Interventionists Call Counterfactuals "Blunt"** (10 min)  
  - **Core Objection**: Counterfactuals treat causation as a "what if?" story, ignoring whether we can *isolate* causes via independent interventions. This causes two problems:  
    - **Decisive flaw (confounding)**: In Round 4, CAs see causation where interventions are impossible (sensors and needs are entangled). IAs demand causes be *actionable* (e.g., fixing a sensor *without* affecting needs).  
    - **Absorbable flaw (preemption/symmetric)**: Sophisticated counterfactual theorists (e.g., using structural equations) *can* handle preemption by adding variables (e.g., "A blocked B’s pipe"). But confounding remains intractable.  

  - **Contested Interpretation**: Some interventionists (e.g., Woodward) argue symmetric cases *are* causes if we consider "contributing causes." Flag this: "Not all interventionists agree!"  

  #### **3. What the Activity Couldn’t Capture** (5 min)  
  - **Formal Apparatus**: The activity simplifies theories. Interventionism requires mathematical models (e.g., causal graphs) to define "interventions." Counterfactual theories often use possible-world semantics.  
  - **Causation by Omission**: The activity focused on events (pumps firing), not absences (e.g., "gardener’s failure to act"). Omissions are notoriously tricky for both theories.  
  - **Consensus Status**: Neither theory is "winning"—interventionism dominates science contexts; counterfactuals remain popular in metaphysics.  

  #### **4. Handling Student Reactions** (5 min)  
  - **Frustration in Symmetric Cases**: Acknowledge intuition ("Both matter!") and explain why theories struggle: They prioritize *dependence*, but overdetermination shows independence.  
  - **Blame/Role Confusion**: Praise teams that separated causation from responsibility (e.g., "B fired late, but it’s not about blame").  

  ---

  ### **Why This Works**  
  - **Divergence is Student-Generated**: Rules force teams to defend clashing verdicts in Round 4. Scoring rewards spotting disagreements.  
  - **Preemption is a Red Herring**: By placing it early, students see theories *agree* here—the real split emerges in confounding.  
  - **Pedagogical Honesty**: The debrief distinguishes absorbable flaws (handled by advanced counterfactual models) from decisive ones (confounding). Contested views are flagged.  

  **First-Run Tip**: If students miss Round 4 divergence, use the poll to spotlight it: "Why did 4 teams score points here but not in Round 3?" This ensures they *feel* the interventionist’s constraint.
