    Interventionist: if we turn off A (while holding fixed that B's sensor is dry, so B fires), then B's water arrives late -> beds not watered. Therefore, A is a cause.

    Agreement.

    This is not preemption but a case where B is not backup. Typically in preemption, the backup would have worked if the primary hadn't. Here, B is too slow.

    Let's adjust to standard preemption:

    - A and B are both fast enough if they had been alone. But A fires first and wets the soil, which is detected by B's sensor? Or we can say: the beds have a threshold: as soon as they get water, they are satisfied. A's water arrives first, so the beds are satisfied and B's water, though on time, is not needed.

    Counterfactual for A: if A had not fired, then B would have fired and watered the beds (on time). Therefore, the outcome would have occurred. So A is not a cause.

    But intuitively, A caused the watering.

    This is early preemption. The counterfactual theory has a problem here.

    So in our scenario:

    Scenario 2 (Preemption revised):
      - Pump A's sensor is dry, so A fires. The water from A will arrive in 1 minute.
      - Pump B's sensor is dry, so B fires. The water from B will arrive in 1 minute as well.
      - However, the water from A arrives at the beds first (at time t+1) because it is closer, and the beds are watered. The water from B arrives at t+1 as well, but at the exact same time, but let's assume the system registers the watering from A and shuts off the need, so B's water is not used.
      - But to have preemption, we must ensure that if A hadn't fired, B's water would have been enough and on time.

    Counterfactual: if A had not fired, then B would have fired and watered the beds (at t+1) -> outcome occurs. Therefore, A is not a cause.

    Interventionist: we can turn off A. Then B fires and watered the beds. outcome occurs. Therefore, A is not a cause.

    This is symmetric! We need to make it so that B's action depends on A's in the counterfactual.

    Standard preemption example with wires:

    But in our case, we can add: 
      - Pump A's water, when it flows, also blocks the pipe of Pump B by a valve. So when A fires, it opens a valve that blocks B's pipe, so B's water cannot pass. In the actual case, A fires, blocks B's pipe, and waters the beds. B fires but its water is blocked.

    Then counterfactual: if A had not fired, then the valve would not have blocked B's pipe, and B's water would have flowed and watered the beds. Therefore, the outcome would have occurred. So A is not a cause? 

    But intuitively, A caused the watering.

    This is the challenge.

    Interventionist: turn off A. Then B's water is not blocked, so it flows and waters the beds. outcome occurs. So A is not a cause.

    So both methods say not a cause.

    I see the problem. The standard preemption case in causation is one where the preempted cause would have caused the effect if the preempting cause hadn't, but in the actual world, the preempting cause is the only cause. 

    How about this: 
      - A fires and waters the beds.
      - B also fires, but its water is delayed because of the block by A. But if A hadn't fired, B's water would not have been delayed and would have watered the beds on time.

    But then in the counterfactual without A, B's water is on time -> outcome occurs.

    So difference-making (counterfactual) says: A is not a cause.

    But we want a case where we have an intuition that A is a cause.

    In the literature, this is the challenge of preemption for the counterfactual theory.

    For the activity, in the preemption case, the counterfactual method will say A is not a cause, but the interventionist might also say that? 

    I think I see the mistake. In the interventionist account, to test whether A is a cause, we must intervene on A while holding fixed the state of the world at some time just before A occurs. In that state, B is about to fire or not? 

    In our setup, if we intervene to turn off A at the last minute, then B will fire and its water will be on time. So the outcome occurs. So not a cause.

    So both methods have a problem with preemption.

    Given the instructions, for the activity, we will use the symmetric case to show the divergence.

    In the symmetric overdetermination case (both fire simultaneously, either is sufficient):

    Counterfactual for A: if A had not fired, then B would have fired and watered the beds anyway -> outcome occurs. Therefore, A is not a cause.
    Similarly for B.

    So neither is a cause.

    Interventionist: turn off A (while holding fixed that B's sensor is dry, so B fires). outcome occurs. So A is not a cause.
    Similarly for B.

    So both methods say not a cause.

    But wait, this is not the typical interventionist account. In the interventionist account, they might use a different definition. According to Woodward, a cause is something that makes a difference under some intervention. In this case, there is no intervention on A that would change the outcome, because if you turn off A, B still causes the outcome. So A is not a cause.

    But intuitively, we want to say both are causes.

    So this is a challenge for both theories.

    I see now that the symmetric case is a challenge for both, and the preemption case is a challenge for both.

    Given the time, I will focus on the plain case (agreement) and then in the symmetric case, present it as a challenge for both. 

    For the fourth case, I will use omissions and then in the debrief, explain the challenges.

    Revised activity outline:

    Round 1: Plain case (agreement on Pump A being a cause).

    Round 2: Symmetric overdetermination.
        - Students will likely say both are causes intuitively, but the counterfactual method says neither is, and the interventionist says neither is.

    Round 3: Preemption ( with the block by valve).
        - Students will likely say Pump A is the cause, but both methods say it is not.

    Round 4: Omission ( gardeneer case where the gardeneer's inaction causes the beds not to be watered, and there is no backup).

    - In the omission case, both methods can handle it, but it is metaphysically troubling.

    Given the above, I will proceed with the activity as follows.

    Due to the complexity and time constraints, the activity will expose the students to cases where the counterfactual method (as implemented) and the interventionist method (as implemented) deliver verdicts that clash with intuition, and in the debrief, we will discuss how each theory has ways to adjust ( by adding more structure, or by using INUS conditions for counterfactual, or by using more sophisticated干预ist models).

    For the fourth case, we'll use:

    Scenario 4 (Omission):
        - The manual override lever must be pulled to water the beds. The gardener is supposed to pull it at 8 AM. He does not. The soil is dry and there is no other water source. The beds are not watered.
        - Candidate cause: the gardener's omission.

    Then in the activity, the students will apply the methods.

    Now, the activity procedure:

    - 90 minutes: 
        - 5 min: divide into teams and explain rules.
        - 60 min: for 4 rounds, 15 min per round.
        - 15 min: debrief.
        - 10 min buffer.

    For each round:
        - 2 min: read the scenario.
        - 8 min: team discussion and recording.
        - 5 min: collect and then instructor reveals the "theory verdicts" (without explanation at this stage) and move to next round.

    The theory verdicts for each round (based on standard naive application):

    Round 1 (Plain):
        - Counterfactual: A is a cause.
        - Interventionist: A is a cause.

    Round 2 (Symmetric):
        - Counterfactual: neither A nor B is a cause.
        - Interventionist: neither is a cause.

    Round 3 (Preemption with valve):
        - Counterfactual: A is not a cause.
        - Interventionist: A is not a cause.

    Round 4 (Omission):
        - Counterfactual: the omission is a cause.
        - Interventionist: the omission is a cause.

    Then in the debrief, we explain that in the symmetric and preemption cases, the theories (as applied) deliver counterintuitive results, and that each theory has ways to try to fix this ( by considering more fine-grained events or by using causal models with hidden variables).

    The divergence between the theories is not in these cases. The divergence is in how they handle confounding and what they consider as admissible evidence.

    Given the instructions, I think the symmetric case is where a more careful counterfactual theorist ( using Mackie's INUS conditions or structural equations) might say that both are causes, while the interventionist might still say they are not.

    But in the activity, we will have the students experience the counterintuitive results.

    Debrief: 

    - Map each stage:
        - Round 1: shows agreement on a clear case.
        - Round 2: symmetric overdetermination. The naive counterfactual method says neither is a cause because the effect would have occurred anyway. This is counterintuitive because we want to say both are causes. The interventionist method agrees. This is a challenge for both theories.
        - Round 3: preemption. Naive counterfactual says the preempting cause is not a cause because the effect would have occurred anyway. This is counterintuitive. Interventionist agrees.
        - Round 4: omission. Both theories can handle it by including absences as events, but some philosophers find absences metaphysically troubling.

    - Where the theories part company: 
        - The activity might not have shown a divergence, so the instructor will have to explain that the interventionist theory is designed to handle cases where the counterfactual might be undefined or where there is confounding, by requiring that the cause be manipulable in principle.
        - The interventionist thinks the counterfactual theorist's instrument is too blunt because it doesn't require that the cause be part of a manipulable relationship. For example, in cases of confounding, the counterfactual might be true but not due to a direct causal relationship.

    - Decisive objections to naive difference-making: 
        - Preemption and symmetric cases are decisive in showing that the simple counterfactual test is not necessary for causation ( in preemption, the preempting cause is a cause but the counterfactual is not true).
        - But a more careful counterfactual theorist ( using structural equations or causal models) can absorb these by adding more variables or by evaluating the counterfactual in a causal model.

    - What will predictably go wrong:
        - In the symmetric case, students will likely say both are causes and not see why it's a problem for the theories.
        - In the preemption case, they will say A is the cause and be frustrated by the theory verdicts.
        - In the omission case, they might bring in notions of blame: the gardener is to blame, so it is a cause.
        - How to handle: in the activity, force them to apply the methods as given. Then in the debrief, explain that their intuitions are natural and that the theories are try to account for these intuitions by refinement.

    - What the activity cannot reproduce: 
        - The formal apparatus of structural equation models for counterfactual theories or the do-calculus for interventionist theories.
        - The activity might not have exposed the issue of confounding because we couldn't design a case within the greenhouse that shows a divergence.
        - The activity does not cover the interventionist's requirement that the intervention be on a variable that is not confounded with other causes.

    - What is genuinely contested: 
        - How to handle preemption and overdetermination is still a matter of debate.
        - Whether absences can be causes is contested.
        - The interventionist approach is not the only response to the counterfactual approach.

    Given the above, the activity might not fully achieve the goal of showing a divergence between the two theories, but it will expose the students to cases that are challenging for both. The instructor will have to explain in the debrief that the interventionist theory arose in part because of the challenges in providing a unified account of causation that handles these cases and that is also testable.

