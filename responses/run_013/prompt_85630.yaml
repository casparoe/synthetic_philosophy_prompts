answer: |-
  Here's a structured analysis of the decision-theoretic pattern you're describing:

  ### 1. **The Pattern in Plain Terms**
  You're encountering gambles where the *mathematical expectation* (the sum of probability-weighted payoffs) is **conditionally convergent but not absolutely convergent**. This means:
  *   The series converges to a finite value *if* terms are summed in the natural order (e.g., n=1,2,3,...).
  *   However, the sum of the *absolute values* of the payoffs (|probability * payoff|) diverges to infinity.
  *   Crucially, by the Riemann rearrangement theorem, reordering the summation changes the sum – it can converge to *any* real number or diverge to ±∞. This makes the "expected value" depend entirely on the arbitrary order of summation, not just the gamble itself.

  This is distinct from the **St. Petersburg paradox** because:
  *   St. Petersburg has an expectation that is *unambiguously infinite* (∑ prob * payoff diverges to +∞). Any finite price is theoretically justified (though practically problematic).
  *   Your pattern has a *finite-but-order-dependent* expectation. There's no single, well-defined infinite value; the expectation *itself* is ill-defined due to the lack of absolute convergence.

  ### 2. **Candidate Concepts**
  *   **Undefined Expected Value:** This is the broadest category. It captures the core issue: no real number meaningfully represents the gamble's expectation. However, it's too vague. It includes cases where the expectation diverges to ±∞ (like St. Petersburg variants) or oscillates wildly without converging at all, missing the specific nuance of a series that converges conditionally *only* under a specific ordering.
  *   **Conditionally Convergent Expectation:** Mathematically precise. It directly diagnoses the series behavior causing the problem. However, it's purely descriptive of the mathematical series, not inherently a *decision-theoretic* concept. It doesn't emphasize the implications for rationality or preference ranking.
  *   **The Pasadena Game:** This is the *explicit formalization* of your exact pattern. Proposed by Nover and Hájek (2004), it defines a gamble with payoffs proportional to (-2)^n / n (or equivalent variants like (-1)^n * 2^n / n) for n flips until heads. Its expectation is the alternating harmonic series. It perfectly captures the conditional convergence, order-dependence, and resulting undefined expectation. It *is* the canonical name for this specific decision-theoretic puzzle.
  *   **Non-Integrable / Non-Absolutely-Summable Gambles:** (Measurable but not L1). This is the rigorous mathematical classification. A gamble has undefined expectation if the integral of |payoff| dP (the sum of |prob * payoff|) is infinite – i.e., if it's not absolutely summable/integrable. This *includes* the Pasadena game (conditional convergence) *and* St. Petersburg (infinite expectation). It correctly identifies the necessary condition (failure of absolute convergence) but is a broader mathematical class than the specific Pasadena phenomenon.
  *   **Dutch Book Arguments:** These show that agents valuing such gambles based on a specific conditional sum (e.g., using the natural order) can be made to accept sequences of bets guaranteeing a sure loss (a Dutch Book). This highlights the *practical irrationality* risk but is a consequence, not a definition, of the underlying undefined expectation.

  ### 3. **The Carving**
  *   **What it is:** The phenomenon is a gamble where **the expectation is conditionally convergent but not absolutely convergent**. This makes the expectation **order-dependent** under rearrangement and thus **undefined** as a unique real number. It's a distinct *subtype* of undefined expectation arising specifically from conditional convergence within the broader class of non-absolutely-summable gambles.
  *   **What it is not:**
      *   *Not infinite expectation (St. Petersburg):* The series doesn't diverge unambiguously to +∞ or -∞.
      *   *Not divergent oscillation without convergence:* The series *does* converge under the natural order to a finite value.
      *   *Not a mere mathematical curiosity:* It creates genuine decision-theoretic puzzles (e.g., how to price it, susceptibility to Dutch Books).
  *   **Boundaries:** The critical edge is the **failure of absolute convergence/summability** (∑ |prob * payoff| = ∞) *combined* with the **existence of a convergent ordering** (∑ prob * payoff converges for order n=1,2,3,...). If a gamble meets these two criteria, it exhibits this phenomenon.
  *   **The Established Name:** **The Pasadena Game** (or **Pasadena Paradox**) is the established term specifically for this decision-theoretic concept. It refers *precisely* to gambles structurally identical to your example (payoffs like k * (-r)^n / n for |r| > 1), designed to exhibit conditional convergence of the expectation. It distinguishes this from the broader St. Petersburg paradox and other forms of undefined expectation.

  ### 4. **Verdict**
  Treat this as a **distinct concept** within decision theory, specifically named **the Pasadena game/paradox**. While mathematically a subcase of non-absolute summability (non-integrability), its defining characteristic – conditional convergence of the expectation series – creates unique and profound problems for standard expected utility theory *different* from those posed by unambiguously infinite expectations (St. Petersburg) or wildly divergent series. The order-dependence, the initial appearance of a finite value, and the specific Dutch Book vulnerabilities mark it as a significant standalone puzzle demanding specific analysis. "Pasadena game" is the established term capturing this exact phenomenon.
