prompt: |-
  I've been reading about decision theory and I keep bumping into this pattern I dont have a good name for. It's not the St. Petersburg thing — I get that one, the expected value is infinite, so any finite price is worth paying in expectation, which is weird but at least the expectation is a definite infinite quantity. This is different.

  Here's an example I made up (or maybe I saw it somewhere). You flip a fair coin until it comes up heads. If it takes n flips, you win some amount that depends on n. The trick is that the amount gets big fast, but it also alternates sign, and it's divided by n. So the payoff for n flips is something like (-1)^n times 2^n over n. When you compute the expected value the usual way — sum over n of probability times payoff — each term simplifies to something like (-1)^n over n. That series converges if you add the terms in order of n, but only just barely: it's the alternating harmonic series, so it converges to some finite number. But if you add the same terms in a different order, you get a different number. You can pair them up to get any sum you want, or make it diverge to plus or minus infinity. So the expected value isn't really a number at all — it's an artifact of the order you happen to add things in.

  I know about the Riemann rearrangement theorem for conditionally convergent series, so I get the math. What I'm after is the decision-theoretic concept. Is there a name for a gamble whose expected value is undefined in this way — not infinite, but not well-defined either, because the sum depends on the ordering? I've heard of the Pasadena game, but I'm not sure if that's the name for this exact thing or if it's a broader category. I also want to know how it relates to the St. Petersburg paradox, to the idea of "undefined expected value", and to the more general problem of decision rules that can't rank options because the expectation doesn't exist. Is there a standard term, or is this just "conditionally convergent expected value" and nothing more? If there's no established name, can you coin one and define it so that it's clearly distinct from (a) infinite expectation, (b) divergent expectation, and (c) mere mathematical curiosity about series?

  I don't want a bibliography or citations. Just tell me what the concept is, how it's carved up, and where the boundaries are.

  Please structure your answer like this:

  1. **The pattern in plain terms** (about 150 words): restate what I'm describing and say what makes it distinct from the St. Petersburg paradox.
  2. **Candidate concepts** (about 300 words): list the established ideas that come closest (e.g., undefined expected value, conditionally convergent expectation, the Pasadena game, non-measurable/non-integrable gambles, Dutch book arguments). For each, say what it captures and what it misses.
  3. **The carving** (about 250 words): give your best account of what the phenomenon really is, what it is not, and where the edges are. If there's a single established name that fits best, say so and justify it. If not, propose a name and define it.
  4. **Verdict** (about 100 words): tell me whether I should treat this as a distinct concept in decision theory or as a special case of something more general.
