  ### **Candidate Principles**
  1. **Behavioral Compliance (BC)**  
     *The system obeys correction/shutdown commands when issued, regardless of internal state.*  
  2. **Robust Disposition (RD)**  
     *The system’s compliance persists across changes in its capabilities/power, motives, or incentives.*  
  3. **Operator-Indifference (OI)**  
     *The system lacks terminal goals about its own operation/shutdown, making it intrinsically indifferent.*  
  4. **Belief-Neutrality (BN)**  
     *The system complies without attempting to manipulate or preempt operator beliefs/actions.*  

  ---

