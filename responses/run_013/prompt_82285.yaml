answer: |-
  ### Analysis of Your Promotion Committee's Decision Patterns

  Based on your four historical cases, the committee's behavior consistently aligns with a **criteria-based rule** (promote only if all three criteria pass by majority vote). Here's why:

  - **Marco**: All criteria passed unanimously → promoted.
  - **Ines**: Impact failed (1-4) → rejected.
  - **Tomas**: All criteria passed (sustained 3-2 still counts as majority) → promoted.
  - **Ravi**: Impact failed (2-3) → rejected.

  **Key insight**: In every case, the final decision matched whether all three criteria had majority support. The bottom-line vote was a coincidence because committee members' individual judgments on the criteria naturally led to consensus on the outcome. Priya's alignment is likely due to her role in summarizing discussions, not unilateral control.

  ### What Will Happen with Sofia?
  If you follow your current process (argue, then bottom-line vote), Sofia will be **rejected 4-1**. However, this contradicts the criteria-based rule:
  - Impact: 4-1 → passes (majority yes).
  - Scope: 4-1 → passes (majority yes).
  - Sustained: 3-2 → passes (majority yes).

  **But** since your committee has never faced a case where criteria passed but the bottom-line vote failed, members might not realize the inconsistency. People will vote based on their personal holistic views (e.g., you/Priya vote no due to sustained concerns, Marcus votes no due to impact, etc.). The likely outcome is rejection, but it exposes a flaw in your process.

  ### What Rule Are You *Really* Running?
  - **Actual rule**: Your committee de facto uses the **criteria-based rule** (promote iff all criteria have majority support). Your historical data fits this perfectly.
  - **Alternative rules that also fit past cases**:
    1. **Bottom-line majority rule**: Promote if >50% vote yes. This fits all four cases but would fail Sofia (1-4).
    2. **Priya-decides rule**: Outcomes align with Priya’s vote. This fits the data but is unlikely given your description.
    3. **"At least one criterion must fail" rule**: Reject if any criterion lacks majority support. This is the inverse of your criteria-based rule and also fits past cases.

  Only a case like Sofia’s (where criteria pass but bottom-line vote fails) would distinguish these rules. Your past cases don’t include such a test.

  ### Fixing Inconsistency: How to Align Your Process
  Your policy mandates using the three criteria, but your process (bottom-line vote first) overrides it. To enforce consistency:
  1. **Change your voting sequence**:
     - Vote on each criterion first (majority wins).
     - Promote only if all three pass.
     - Eliminate the bottom-line vote (or make it ceremonial).
     
  2. **For Sofia’s case**:
     - Point out the criteria pass (4-1, 4-1, 3-2) → promotion is consistent with history.
     - If members protest (e.g., "But I think sustained fails!"), remind them the committee’s job is to aggregate judgments—not require unanimity on criteria.

  3. **Why this works**:
     - Prevents personal biases from overriding policy (e.g., someone voting no for tangential reasons).
     - Makes promotions objective and auditable.
     - Priya can frame this as "clarifying our process" rather than "changing rules."

  ### Recommendation for Next Week
  - **Before the vote**: Share your analysis with Priya. Propose voting on criteria first, then deciding. Highlight that Sofia meets all criteria by majority—rejecting her would break your historical pattern.
  - **If you keep the current process**: Sofia gets rejected, but the criteria tally will reveal inconsistency. Use this as a catalyst to reform the process.
  - **Long-term**: Document this in a 1-page guide for future committees. Example:
    ```
    1. Discuss candidate for 60 mins.
    2. Vote on each criterion (majority wins).
    3. Promote only if all 3 pass.
    ```

  This ensures you follow policy, reduce ambiguity, and handle future "Sofia cases" fairly. Your committee’s real strength is aggregating diverse perspectives—leaning into the criteria formalizes that.
