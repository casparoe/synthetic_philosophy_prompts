   1. **Epistemological reading (verificationist)**: The formula is about meaning. To say something exists is to say that it is perceivable. Unobserved things exist as long as they are perceivable in principle. This is a modest claim about language.

   2. **Berkeley's idealism with divine perception**: Physical objects exist only when perceived by some mind. Since God perceives everything always, unobserved things exist. This is Berkeley's own view.

   3. **Finite-mind idealism**: Without God, objects exist only when perceived by finite minds. So unobserved things do not exist. This is a radical view that Berkeley avoids by invoking God.

   4. **Phenomenalism**: Objects are reducible to actual and possible perceptions. Unobserved objects are just possibilities. This is a later development (e.g., by Mill).

   5. **Observer effect (misinterpretation)**: The formula is taken to mean that observation causes the object to exist or that the object's properties are created by the act of observation. This is a modern physics idea (quantum mechanics) and not Berkeley.

