prompt: |-
  I am a high school student preparing a presentation for my school's philosophy club, and I have run into a problem in Nyāya epistemology that I cannot resolve on my own. Nyāya is said to accept four pramāṇas — perception, inference, comparison, and testimony — and a pramāṇa is a valid means of knowledge. Our club recently discussed an incident at our school: a classmate was accused of copying an essay from a website. The case against him rested on three pramāṇas, as I counted them: our teacher saw the website open on his laptop (perception), another student said she watched him paste the text in (testimony), and the essay's sentences matched the website almost word for word (inference). The case for him rested on one pramāṇa: his own statement that he wrote it himself, which is also testimony. Since a pramāṇa is a valid means of knowledge, and the accusation had three of them against his one, I argued that Nyāya commits us to treating the accusation as knowledge and the boy as guilty. A friend told me that this is a basic misunderstanding of what a pramāṇa is, and that the four pramāṇas are not four kinds of evidence to be counted up, but I cannot see why not. If each pramāṇa is a separate valid means of knowledge, then more of them should mean more knowledge; and if testimony is one of them, then a person's own denial should count for as much as a witness's report. Could you explain where my reasoning goes wrong, and what a Nyāya philosopher would actually say about a case of conflicting reports like this? Please give your answer as a numbered list of exactly five points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a high school student preparing for a philosophy club presentation. They're dealing with Nyāya epistemology and a real-life school situation about plagiarism. The student applied Nyāya's four pramāṇas (perception, inference, comparison, testimony) like evidence points - counting 3 against the accused classmate versus 1 for him. Their friend called this a misunderstanding, but the student can't see why.  

  Hmm, the core confusion seems to be treating pramāṇas as quantitative evidence rather than truth-generating processes. Nyāya isn't about tallying sources but evaluating each source's validity conditions. For example:  

  First, Nyāya would require examining each pramāṇā's reliability. The teacher's perception (seeing an open website) could be misinterpreted - maybe he was cross-referencing, not copying. The witness testimony might be flawed if she wasn't close enough to see clearly.  

  Second, the student's denial (testimony) isn't automatically equal to the accuser's testimony. Nyāya weighs credibility - does the accused have integrity? Could there be bias?  

  Third, inference requires checking the inference chain. Matching sentences could imply plagiarism, but maybe both copied from a common source? The conclusion isn't inevitable.  

  Fourth, conflicting pramāṇās need resolution through tarka (reasoning). Nyāya would look for contradictions - e.g., if the student knew topics not on the website, that weakens the inference.  

  Fifth, the "valid means" aspect is key. A pramāṇā only counts if error-free. Faulty perception (e.g., mistaking notes for plagiarism) or unreliable testimony invalidates them regardless of quantity.  

  The user's mistake was reducing epistemology to scorekeeping. Nyāya is forensic - each claim gets scrutinized, not stacked. Their presentation could contrast this with Western legal evidence models!
answer: |-
  Here is the numbered list explaining the Nyāya perspective:

  1.  **Pramāṇa validity is conditional, not automatic:** A pramāṇa is only a *valid* means of knowledge if it operates under specific, error-free conditions (e.g., a reliable sense organ, a trustworthy speaker, correct reasoning).
  2.  **Each pramāṇa must be critically examined:** Nyāya requires analyzing each claimed source individually for defects (*doṣa*) like faulty perception, unreliable testimony, or fallacious inference before accepting it as generating valid knowledge (*pramā*).
  3.  **Testimony's weight depends on credibility:** Not all testimony is equal; the trustworthiness (*āptatva*) of the speaker (honesty, competence, lack of motive to deceive) is crucial. The accused's denial requires scrutiny like any other testimony.
  4.  **Conflicting pramāṇas indicate unresolved error:** When pramāṇas conflict (like testimony for vs. against), it proves at least one source is defective; Nyāya philosophers would investigate to determine *which* pramāṇa(s) are flawed rather than merely counting them.
  5.  **Inference relies on invariable connection:** The inference from sentence matching to copying requires establishing an invariable link (*vyāpti*) between the two; alternative explanations (e.g., using common sources, paraphrasing) must be ruled out for the inference to be sound.
