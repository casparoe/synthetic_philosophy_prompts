answer: |-
  Here are your interview questions, designed to push on the core tensions and implications of her view, with sharp follow-ups anticipating common defenses:

  **Opener**
  *   **Question:** Professor, if I understand your view correctly, the sheer *expectation* others have about me following a convention is what generates my moral *obligation* to follow it. Why is me disappointing their expectation inherently unfair, rather than just inconvenient or annoying for them?

  **The arbitrariness twist**
  1.  **Question:** You argue that *more arbitrary* conventions create *stronger* obligations because failure is ambiguous – people can't tell defiance from ignorance, making breakdowns costlier. Doesn't this mean that the *less* reason there is for a norm to exist, the *more morally binding* it becomes? That seems paradoxical.
      *   *Likely Response Follow-Up:* If she emphasizes the cost of ambiguity: But isn't the high cost of ambiguity precisely *because* the convention is arbitrary and lacks inherent justification? Doesn't this incentivize perpetuating *meaningless* rules just to avoid confusion?
  2.  **Question:** How do you prevent the "arbitrariness strengthens obligation" principle from morally mandating adherence to nonsensical or even harmful rituals simply because they're entrenched and ambiguous when broken?
      *   *Likely Response Follow-Up:* If she invokes the "unreasonable/exploitative" caveat: Doesn't the ambiguity you rely on for strength *itself* make it harder to identify when a convention *is* unreasonable or exploitative? How do we judge reasonableness without a standard *external* to the convention itself?

  **Is it even moral?**
  1.  **Question:** Critics might say your view reduces moral obligation to managing expectations and avoiding social friction – essentially, sophisticated prudence. What fundamentally *moral* element, beyond mere coordination efficiency or avoiding "sticker shock," distinguishes your obligation from just "being polite to not get glared at"?
      *   *Likely Response Follow-Up:* If she invokes fairness/unfairness: Why is it inherently *unfair* to surprise someone by not meeting a baseless expectation they formed purely through convention? Isn't fairness usually grounded in something deeper, like harm or rights, not just predictability?
  2.  **Question:** Can a convention *itself* be morally problematic (like a discriminatory local norm or tipping subsidizing low wages) and yet still generate a genuine moral obligation to follow it, simply because people expect it?
      *   *Likely Response Follow-Up:* If she says obligation weakens/vanishes if exploitative/unfair: Who decides when reliance on a convention becomes "exploitative" or "unfair"? If it's the community reliant on it, doesn't that risk legitimizing harmful norms? If it's an external standard, doesn't that undermine the idea that the obligation *stems solely* from reliance?

  **Visitors and outsiders**
  1.  **Question:** You say visitors are bound only after a "fair chance to notice" the convention. What constitutes "fair chance" for someone with cognitive differences, a language barrier, or a child? Does the obligation only kick in once they *actually* understand, or is there an objective standard?
      *   *Likely Response Follow-Up:* If she suggests an objective "reasonable person" standard: Doesn't the "reasonable person" often reflect local biases? How does this protect the genuinely unaware who fall outside that local definition of "reasonable"?
  2.  **Question:** You state locals have a duty not to punish those who couldn't know. But what does "punishment" entail here? Is glaring, tutting, or social coldness a form of punishment locals are obligated to avoid, or is it just the cost of ignorance?
      *   *Likely Response Follow-Up:* If she distinguishes formal punishment from social disapproval: If social disapproval is the primary mechanism enforcing conventions, how can locals realistically *avoid* expressing it towards the ignorant without undermining the convention itself? Doesn't your duty become practically impossible?
  3.  **Question:** You say visitors' obligations are weaker than locals'. Does this mean a visitor is morally justified in strategically violating minor conventions they *do* understand, simply because the obligation is weaker? Where's the line?
      *   *Likely Response Follow-Up:* If she emphasizes proportionality/reliance: Doesn't a visitor's violation *still* create ambiguity and potential coordination costs? If the obligation is weaker solely because they're a visitor, doesn't that feel like a double standard rather than a moral principle?

  **Hard cases**
  1.  **Question:** Take the classic coordination problem: driving on the left vs. right. On your view, is *any* established rule morally obligatory purely because of reliance? Or does the inherent danger of non-coordination provide the moral weight, making the convention itself somewhat secondary?
      *   *Likely Response Follow-Up:* If she says the danger provides independent moral weight: Doesn't this suggest that for *truly* harmless arbitrary conventions (say, which sock to put on first), the moral obligation you describe is either very weak or nonexistent – reducing it back to mere preference or prudence?
  2.  **Question:** How does your theory handle conventions actively maintained by powerful groups to disadvantage others? For example, a "polite" norm requiring overly deferential language from a minority group. Does the disadvantaged group have a moral obligation to follow it because of majority expectations?
      *   *Likely Response Follow-Up:* If she argues the expectation is unreasonable/exploitative: How does the disadvantaged group *effectively* make that case if the majority's reliance *is* the source of the supposed obligation? Doesn't your framework risk demanding compliance until the norm is *already* widely challenged?

  **The relativism worry**
  1.  **Question:** Doesn't your view inevitably lead to moral relativism? If the obligation is generated by local expectations, then anything a local group reliably expects becomes morally obligatory *for that context*. Couldn't this morally validate harmful practices if they're conventional somewhere?
      *   *Likely Response Follow-Up:* If she invokes the "unreasonable/exploitative" constraint again: But if "unreasonable/exploitative" is judged *against the backdrop of the local moral framework* that includes the convention itself, doesn't it become circular? How do we import a *critical* standard?

  **What could change her mind**
  *   **Question:** What's the strongest counter-example or argument you've encountered against your view? What kind of evidence or scenario would genuinely make you reconsider the core idea that reliance-based expectations create distinct moral obligations?

  **Key things to remember:**
  *   **Listen Actively:** Her answers might take the discussion in unexpected directions. Be ready to adapt a follow-up if she gives an answer you didn't anticipate.
  *   **Clarify, Don't Debate:** Your role is to probe her view clearly, not argue against it. Use phrases like "So, to clarify..." or "Help me understand how that addresses..." rather than "But that's wrong because...".
  *   **Pace:** Don't rush. Let her fully answer before moving to the follow-up. It's okay to have some silence while she thinks.
  *   **Tone:** Be respectful but intellectually curious and persistent. Your phrasing shows you've engaged deeply with her ideas, which she'll appreciate.

  Good luck with the interview! These questions should spark a really substantive discussion.
