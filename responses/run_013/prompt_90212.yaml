answer: |-
  Here is the examination essay question followed by the model answer and integrated marking scheme, all presented as continuous prose:

  **Essay Question:**  
  Consider the following pairs of choices. In Pair One, Option A offers a sure gain of M. Option B offers a lottery paying a large prize L with probability 0.4, M with probability 0.5, and nothing with probability 0.1. In Pair Two, Option C offers M with probability 0.5 and nothing with probability 0.5. Option D offers L with probability 0.4 and nothing with probability 0.6. In Pair Three, Option E is a compound lottery: a fair coin is tossed; heads yields Option C from Pair Two, tails yields Option D from Pair Two. Option F is the single-stage lottery paying M with probability 0.25, L with probability 0.2, and nothing with probability 0.55. Suppose a decision maker prefers A in Pair One and D in Pair Two. Analyse whether and how this pattern challenges expected utility theory. Your analysis must precisely identify which axiom or assumption is violated in each formulation of the theory (e.g., von Neumann-Morgenstern’s independence axiom, Savage’s sure-thing principle, reduction of compound lotteries, consequentialism). Explain what a defender of expected utility must concede given this pattern, what a defender of the pattern must relinquish regarding standard assumptions, and evaluate whether the pattern undermines expected utility normatively or merely exposes limitations in its standard axiomatisations.

  **Model Answer:**  
  A decision maker preferring the sure M in Pair One (A over B) but the chance at L in Pair Two (D over C) exhibits a pattern analogous to the Allais Paradox. To assess its challenge to expected utility (EU), we must locate where specific axioms bite. Under von Neumann-Morgenstern, choices are over lotteries. Pair One’s Option B can be reframed as a 0.5 chance of M and a 0.5 chance of a lottery yielding L with probability 0.8 or nothing with probability 0.2. Pair Two’s Option C is a 0.5 chance of M and a 0.5 chance of nothing, while Option D is a 0.5 chance of a lottery yielding L with probability 0.8 or nothing with probability 0.2 and a 0.5 chance of nothing. The independence axiom requires that if A is preferred to the risky prospect in the common consequence (here, the lottery yielding L or nothing), this preference should hold when that common consequence is replaced. Choosing A over B implies preferring M to a 0.8 chance of L and 0.2 chance of nothing. But choosing D over C implies preferring a 0.8 chance of L and 0.2 chance of nothing to M. This directly violates independence: the preference reverses when identical sublotteries are embedded in different contexts.

  In Savage’s framework, acts map states to consequences. Assume states are independent of acts. Pair One’s options share a common outcome (M) in some states, while Pair Two lacks this. The sure-thing principle dictates that if two acts yield identical consequences in certain states, preferences should depend only on states where consequences differ. In Pair One, states leading to the common consequence M under both options should be irrelevant; the choice should hinge on the sub-problem where B yields L or nothing and A yields M. The observed reversal violates the sure-thing principle because adding a common consequence (M with probability 0.5) to both options in Pair One alters the preference.

  Pair Three tests reduction and consequentialism. Option E (compound) and Option F (reduced) are probabilistically identical. If the decision maker treats them differently—perhaps valuing the process of the coin toss—this violates the reduction axiom, which demands indifference to compounding. Consequentialism is also implicated: if the disvalue of receiving nothing differs depending on whether it resulted from losing the coin toss (in E) or directly (in F), EU’s assumption that consequence utilities are context-independent fails.

  A defender of EU must concede that the modal choices violate key axioms descriptively. They cannot maintain that the axioms universally characterise human choice. However, they might argue normatively that abandoning independence or the sure-thing principle leads to dynamic inconsistencies or susceptibility to exploitation. A defender of the Allais pattern must relinquish either the axioms themselves or the background assumptions enabling their application. For instance, they might reject consequentialism, allowing utility to depend on foregone alternatives or framing. Alternatively, they might deny state/act independence, positing that acts influence state probabilities psychologically.

  Whether this refutes EU normatively hinges on one’s view of rational requirements. If consistency across decompositions of identical prospects is paramount, EU stands as normative despite descriptive failures. If context-dependent valuation reflects rational sensitivity to meaningful differences in uncertainty (e.g., certainty in Pair One versus ambiguity in Pair Two), EU’s axioms may be descriptively *and* normatively inadequate. The pattern primarily challenges specific axiomatisations relying on context-independence. It does not refute EU’s core maximisation structure per se but shows that its standard formulations impose psychologically untenable separability assumptions.

  **Marking Scheme:**  
  Candidates must clearly state the choice pattern and its resemblance to the Allais Paradox to earn up to two marks; a common error is merely describing the choices without identifying the paradox. Explaining how Pair One and Pair Two violate the von Neumann-Morgenstern independence axiom by showing the reversal when the common consequence is removed is essential and carries five marks; candidates often fail to reframe the lotteries to isolate the common consequence. Analysing the violation of Savage’s sure-thing principle due to the introduction of a common outcome altering preferences, specifically contrasting the state-wise structure of the pairs, is required for five marks; typical mistakes involve conflating this with the independence axiom or neglecting state-wise comparison. Discussing Pair Three’s implications for the reduction of compound lotteries axiom and consequentialism, highlighting how valuing process over outcomes breaches EU assumptions, merits five marks; many overlook this pair or misapply reduction. Articulating what an EU defender must concede—namely, descriptive inaccuracy of the axioms—and what an Allais-pattern defender must relinquish—such as consequentialism or state-act independence—secures four marks; answers frequently omit one concession or conflate descriptive and normative. Finally, evaluating whether the pattern normatively undermines EU or only its formulations, distinguishing between maximisation structure and separability axioms, is worth four marks; weaker responses assert a blanket refutation without nuance. The total available is twenty-five marks.
