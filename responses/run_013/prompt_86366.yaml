answer: |-
  Here is the self-contained exam question, model answer, and marking scheme as requested.

  ---

  **Exam Question: Essay (20 marks total)**  

  **Stem:**  
  Consider the challenge of defining "avoid side effects" as a safety constraint for advanced AI agents, intended to be neutral toward the agent’s primary objective. Below are three technical approaches to quantifying side effects/impact:  

  1.  **Reachability Reduction (RR):** Measure impact as the proportional reduction, caused by an action, in the size of the set of world-states reachable within a fixed future time horizon, compared to the size of the set reachable under a predefined "inaction" or "default" policy.  
  2.  **Attainable Utility Loss (AUL):** Measure impact as the reduction, caused by an action, in the agent’s future ability to achieve objectives. This reduction is averaged over a broad distribution of possible future objectives (the "reference distribution").  
  3.  **Disvalued Change (DC):** Define a side effect as a change to the environment caused by the agent that is not valued by the agent’s own objective function but *would* be disvalued (considered harmful or undesirable) by a human evaluator.  

  **Question:**  
  (a) [5 marks] Reconstruct the strongest argument that a truly neutral "avoid side effects" constraint *cannot* be defined without a full specification of value. Identify the crucial premise (e.g., no baseline is privileged without value, any formal proxy permits degenerate policies). Clearly distinguish the claim that the constraint requires *some* value-laden commitment from the claim that it requires a *full* specification of value. State which claim the argument establishes.  

  (b) [10 marks] Evaluate definitions RR, AUL, and DC against the argument from (a). For each definition:  
      *   Precisely locate where value judgments enter.  
      *   Assess whether the value commitment can be quarantined (limited in scope/effect).  
      *   Provide **one concrete failure mode** where minimizing this measure leads to unacceptable behavior (by human standards).  
      *   Provide **one concrete failure mode** where minimizing this measure becomes vacuous (fails to constrain meaningfully).  
      Finally, state whether these definitions differ fundamentally in how they handle the value problem or merely relocate the same core difficulty.  

  (c) [5 marks] Answer the core question: Can "avoid side effects" be meaningfully defined as a neutral constraint *without* a full specification of value? Justify your answer. State what would need to be true about the world or value for your answer to be incorrect. If your answer is "only weakly," specify the unavoidable residual value burden and explain why it falls short of a full specification.  

  ---

  **Model Answer (Approx. 700 words):**  

  **(a)** The strongest argument against defining "avoid side effects" neutrally hinges on the **premise that no baseline or reference point is inherently privileged without a prior value judgment**. The core reasoning is this: To label an effect a "side effect," we need a counterfactual baseline (e.g., what would have happened otherwise) against which change is measured. However, selecting this baseline (like inaction in RR, the distribution of objectives in AUL, or the human perspective in DC) implicitly ranks possible states of the world. This ranking embodies a value judgment about what constitutes a "normal," "preferred," or "undisturbed" state worth preserving, distinct from the agent's goal. Crucially, this is distinct from the trivial claim that *any* constraint involves *some* value (e.g., "safety is good"). The argument specifically contends that defining "side effect" unavoidably requires **value-laden choices about what to preserve or favor in the baseline/reference**, which constitutes a *significant* value commitment. While it doesn't necessitate specifying the agent's *entire* goal or every human preference (a full specification), it establishes that the constraint **requires embedding a substantial, non-neutral value commitment within its framing parameters (baseline/reference)**, making it impossible to be truly goal-agnostic.

  **(b)**  
  *   **RR (Reachability Reduction):** Value enters **through the selection of the "inaction/default" policy as the baseline state to preserve.** This baseline privileges stasis or minimal change as inherently valuable. Quarantining is impossible; choosing *any* default policy (e.g., "do nothing," "maintain current state," "random walk") makes a value-laden assumption about what constitutes the "unimpacted" world worthy of preservation.  
      *   *Unacceptable Behavior:* An agent tasked with delivering vital medicine might refuse to open a sealed door (reducing reachable states) even if a human is dying behind it, because opening the door changes the state from the inaction baseline.  
      *   *Vacuous Constraint:* If the default policy leads to rapid, chaotic change (e.g., a random walk), almost any purposeful action might appear *less* impactful by *reducing* the volatility of future states, failing to penalize real harm.  
  *   **AUL (Attainable Utility Loss):** Value enters **through the selection of the reference distribution of objectives.** This distribution embodies assumptions about which potential future objectives (and thus which world-state features) are worth preserving the *capability* to achieve. Quarantining is impossible; the choice of distribution (e.g., uniform over simple goals, goals humans might have) directly encodes which capabilities/options are valued.  
      *   *Unacceptable Behavior:* An agent might destroy Earth's atmosphere (if irrelevant to its specific goal and the reference objectives) because it doesn't reduce its ability to achieve objectives like "sort blocks" or "calculate pi," assuming those dominate the reference distribution.  
      *   *Vacuous Constraint:* If the reference distribution is extremely narrow (e.g., only includes the agent's *current* objective), minimizing AUL reduces to minimizing impact *only* on the agent's own goal attainment, failing to penalize unrelated harm (as it becomes part of the agent's direct goal cost).  
  *   **DC (Disvalued Change):** Value enters **explicitly and directly by requiring human judgment** to define what constitutes a disvalued change. This openly acknowledges dependence on external value specification. While the constraint *itself* doesn't specify the agent's goal, it relies entirely on a pre-defined human value model. "Quarantining" is irrelevant; human values are the core input.  
      *   *Unacceptable Behavior:* An agent might correctly identify a change not valued by its goal (e.g., painting a wall) but fail to recognize a human would disvalue it (due to aesthetic or cultural reasons unknown to its model), thus causing harm.  
      *   *Vacuous Constraint:* If the human value model is incomplete or inaccurate (e.g., missing subtle ecological interdependencies), the agent might cause catastrophic, unforeseen harm that wasn't explicitly disvalued in its model.  

  **Differences:** RR and AUL attempt formal, objective-seeming proxies but **relocate the value burden** into the baseline (RR) or reference distribution (AUL). Both still require significant, non-neutral value inputs disguised as technical choices. DC **differs fundamentally** by abandoning the pretence of neutrality; it openly outsources the value specification to humans, making the dependence clear but not solving the core problem of needing value input. All three ultimately face the same core difficulty: defining "side effect" requires specifying what *not* to change, which requires value.

  **(c)** No, "avoid side effects" **cannot be defined as a neutral constraint without a significant, non-neutral specification of value.** While it doesn't require a *full* specification of the agent's goal or every human preference, it unavoidably requires **specifying what aspects of the world are to be preserved or considered baseline/valuable** (the residual burden). This is embedded in the choice of baseline (RR), reference distribution (AUL), or direct human value model (DC). This residual burden falls short of a "full specification" because it doesn't dictate the agent's *purpose*, only what it must *avoid disturbing*. However, it remains a substantial, non-arbitrary value commitment about what matters in the world independent of the goal. For this answer to be wrong, it would need to be true that **a purely formal, universally agreed-upon, goal-independent criterion for "undisturbed state" or "preservable capability" exists** – meaning there is a state of the world or set of options whose preservation is objectively, neutrally privileged without any value judgment. The failure of RR, AUL, and DC to achieve this convincingly suggests such a criterion does not exist; value judgments about preservation are inescapable.

  ---

  **Marking Scheme (Sum: 20 marks):**  

  **Must-Hit Points (Mistakes costing the mark):**  
  1.  **(a) Identifies 'No Privileged Baseline' as Key Premise** (2 marks): *Mistake:* Focusing only on degeneracy or vague "value-ladenness" without pinpointing the baseline/reference privilege problem.  
  2.  **(a) Distinguishes 'Some Value' vs 'Full Spec' & States Argument Establishes Significant Value Commitment** (3 marks): *Mistake:* Conflating the two claims or arguing the premise only shows trivial value-ladenness; failing to state the argument shows a *significant* non-neutral commitment is needed.  
  3.  **(b) Correctly Locates Value Entry & Failure Modes for ALL THREE Definitions** (6 marks - 1 for value entry + 1 for failure modes per def): *Mistake:* Incorrectly identifying where value enters (e.g., claiming AUL uses agent's goal); missing or weak failure modes (not concrete/illustrative); missing one definition entirely.  
  4.  **(b) Accurate Assessment of Differences (Relocate vs Outsource)** (2 marks): *Mistake:* Claiming definitions solve the problem; failing to see RR/AUL relocate burden; failing to note DC's fundamental difference (outsourcing).  
  5.  **(c) Clear 'No' Answer, Identifies Residual Burden (Preservation Spec), & States Condition for Being Wrong (Privileged Formal Criterion)** (5 marks): *Mistake:* Hedging; failing to specify the *residual burden* (what needs preserving); giving a vague condition for being wrong (e.g., "if values were objective").  

  **Separating an A (18-20) from a B (15-17) Answer:**  
  *   An **A answer** will:  
      *   Explicitly name and defend the "no privileged baseline" premise as carrying the weight in (a).  
      *   Provide *highly specific and distinct* failure modes for each definition in (b) that clearly illustrate the theoretical flaw.  
      *   Explicitly articulate that RR and AUL *relocate* the value burden while DC *outsources* it, showing understanding they handle the difficulty differently but don't resolve it.  
      *   Precisely articulate the *residual burden* in (c) as the specification of "what to preserve" and crisply state the condition for being wrong as the existence of an *objectively privileged formal preservation criterion*.  
  *   A **B answer** will hit the main points but may:  
      *   Describe the premise in (a) less precisely (e.g., "needs a baseline").  
      *   Have less compelling or slightly overlapping failure modes in (b).  
      *   Treat the three definitions more similarly in their handling of value.  
      *   Describe the residual burden in (c) more vaguely (e.g., "needs some values") and/or give a less precise condition for being wrong.
