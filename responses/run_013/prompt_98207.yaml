prompt: |-
  So my best friend Raj is having a going-away thing on Saturday — he's quitting his very stable bank job to go join a two-person startup working on some insane energy thing (he tried to explain it to me twice and I still dont get it, something about bacteria making fuel out of sunlight, but he says if it works it's the end of fossil fuels). Everyone's happy for him but his dad is quietly losing it, and I'm the one doing the toast. Here's my problem. Raj has gotten really into this idea he calls Pascal's mugging, which I guess he got off some blog — the thing where a mugger promises you an astronomically huge payoff for a tiny chance and by expected-value math you're supposed to hand over your wallet. Except Raj doesn't treat it as a paradox, he treats it as a life rule. Last Thanksgiving his sister told him "by that logic you should give me your wallet, because maybe I'm secretly a wizard who'll pay you back a trillion dollars," and he just said "correct, and I'm not being sarcastic." So I'm stuck: I want to stand up and genuinely bless the move he's making, but I do not want to endorse the general rule, because a rule that tells you to hand your wallet to any stranger with a good story is obviously broken, and I think half the room will clock that.

  Please write me the toast, like four or five minutes. The thing I want it to actually pull off is blessing his specific gamble without blessing the principle he thinks is behind it, and I'm pretty sure the honest way to do that is to say something real about why his bet is different from the wizard bet — but not the cheap version ("well, he's my friend so I hope it works out"), I want an actual reason that the smart people in the room would nod at, and that doesn't cheat by pretending the tiny-probability-huge-payoff logic is fine when it obviously isnt. Half the room is engineers from his old job who will catch every reference to expected value, and the other half is his parents and aunts who won't know what a "utility" is, so it has to land for both. Keep it in my voice — I'm a backend dev, not a philosopher, so no fancy vocabulary — and it should sound like a slightly nervous friend talking, not a TED talk. End it on something I can actually raise a glass to.
reasoning: |-
  Okay, the user needs a toast for their friend Raj who's leaving a stable bank job for a risky startup. The challenge is to support Raj's decision without endorsing Pascal's mugging as a life principle. Let me unpack this.

  First, the key conflict: Raj believes in Pascal’s mugging—taking tiny-probability bets for huge payoffs. The user wants to validate this specific career gamble but reject the broader rule. They need a distinction that’s intellectually honest and accessible to both engineers and non-experts.

  Hmm. The user’s deeper needs:  
  - Avoid humiliating Raj (it’s a celebration)  
  - Reassure worried family (especially his dad)  
  - Signal to engineers this isn’t naïveté  
  - Keep it personal, not preachy  

  The toast must thread the needle:  
  1. Acknowledge the gamble but highlight why this bet is different from a mugger’s promise.  
  2. Find concrete differences: Raj’s expertise, the startup’s plausibility, skin in the game.  
  3. Use plain language—no "utility functions," just "skin in the game" or "real shot."  

  Biggest pitfall: Sounding like I’m undermining Raj. Solution? Anchor praise in his qualities ("you actually understand the science") rather than attacking his philosophy.  

  Structure thoughts:  
  - Open warm/funny ("Raj explaining bacteria fuel")  
  - Contrast wizard scam vs. real opportunity  
  - Break down why this has weight: domain knowledge, team credibility, tangible work  
  - Zoom out: Celebrate courage without endorsing recklessness  
  - End on communal pride ("to the long shots")  

  Key phrase to steal from user: "not the cheap version." Need substance. Engineers must nod at the probabilistic nuance; aunts must feel the heart.  

  ...And absolutely no TED-talk vibes. Backend dev voice: "Okay, weird science" > "Utilizing photosynthetic microorganisms." Got it.
answer: |-
  Alright, here's the toast. It hits the notes you asked for: genuine support for Raj, a clear *why* this is different from Pascal's Mugging (without naming it awkwardly), accessible to both crowds, and ending on a raise-your-glass moment. Keep it in your pocket, take a breath before you start, and talk like you're just explaining it to him at the pub.

  **(Clink glass lightly to get attention, maybe clear throat a bit nervously)**

  "Hey everyone. So... Raj. *(Small smile, look at him)* Man. Quitting the bank. For... bacteria and sunlight? Okay, weird science aside, you know we’re all ridiculously proud of you, right? Seriously. Taking this leap? It’s brave. It’s... very Raj.

  Now, I know Raj has been talking *a lot* lately about this idea... you know, the one where if someone promises you something crazy huge, even if the chance is tiny, the math says you should maybe just... go for it? Hand over your wallet, just in case? *(Light chuckle, glance around)* His sister nailed it last Thanksgiving: 'Hey Raj, maybe *I'm* secretly a wizard! Gimme your wallet!' And Raj, being Raj, just nodded seriously. 'Correct. Not sarcastic.'

  *(Pause, more serious)* So, standing up here, looking at you making this massive jump... I need to be real clear. I am *not* blessing that rule. Because handing your wallet to anyone with a wild story? That’s... not a great life strategy. Sorry, Raj. *(Friendly shrug towards Raj)* Smart people – like, say, a room half-full of engineers – know the math gets really shaky when the numbers get too crazy. It kinda breaks. It stops making sense for real life.

  **But Raj... this?** *(Gesture emphatically)* **This bet you’re making is different. Fundamentally different.** And it’s not just because you’re my friend – though I *am* wildly biased. It’s because of *why* this gamble isn't crazy, even if the odds are long.

  **First off, you actually understand the game.** This isn't some rando mugger promising magic. You’re not betting on wizards. You’ve spent years buried in complex systems, risk models, hard numbers at the bank. And you’ve spent months, I know you have, tearing apart this specific science, this startup, this team. You’ve done the *real* homework. You know the players, you know the field. This isn't blind faith in a wild story; it’s a calculated risk based on stuff you’ve actually dug into.

  **Second, it’s not just a random promise.** This tiny company? They’re *doing* the work. They’re in the lab, right now, trying to make sunlight turn into fuel. It’s tangible. It’s hard, messy, real-world effort. There are prototypes, data points, scientists sweating over petri dishes. It’s not a whispered promise; it’s a project with gears turning. You’re not betting on a *story*, Raj, you’re betting on *action* and *expertise* you’ve actually seen.

  **And third... you’re putting your *own* skin in the game.** This isn't handing over your wallet passively. You’re quitting your incredibly stable, well-paying job! You’re diving headfirst into the lab with them! You’re committing your skills, your time, your energy – everything. That changes everything. It means you believe there’s a *real shot*, not just a mathematical ghost. You’re not just hoping for magic; you’re rolling up your sleeves to help *make* the magic happen.

  So yeah, the payoff if this works? It’s insane. Honestly, ending fossil fuels? That’s world-changing. And the odds? Sure, they’re long. Startups are hard. But this isn't Pascal's random mugger. This is Raj Patel, who knows his stuff, betting on real people doing real work, and putting everything he’s got on the line to help them succeed.

  *(Turn fully to Raj, sincere)* That’s why we’re proud. That’s why this leap makes sense. Not because of some abstract rule about crazy odds, but because *you* saw a real shot, with real people, doing something that actually matters, and you had the guts to grab it. You’re not chasing a trillion-dollar wizard; you’re helping build something that could genuinely change the damn world. And that deserves everything we’ve got.

  So everyone... raise your glasses. **To Raj!** Not just for taking the leap, but for knowing exactly *which* leap was worth taking. To betting on real work, real science, and real guts. May those bacteria work overtime, may the sunlight be plentiful, and may this insane, brilliant gamble of yours pay off bigger than any of us can imagine. **To Raj!**"

  **(Hold glass high, big smile, wait for the "TO RAJ!" response and clinking)**

  **Why this works:**

  1.  **Acknowledges the Paradox:** Directly references the "wizard" story and Raj's stance, making it clear you know the issue.
  2.  **Rejects the General Rule:** Explicitly states handing your wallet out based on wild promises is broken ("not a great life strategy," "math gets shaky," "stops making sense").
  3.  **Explains WHY This is Different:**
      *   **Domain Knowledge:** Raj understands finance *and* has vetted *this specific* science/startup ("done the real homework," "know the players/field"). Contrasted with "rando mugger promising magic."
      *   **Tangible Action:** The startup is actively working ("gears turning," "prototypes, data points," "scientists sweating"). Contrasted with "whispered promise" or "betting on a story."
      *   **Skin in the Game:** Raj is actively participating and sacrificing ("putting your *own* skin," "diving headfirst," "rolling up your sleeves"). Contrasted with passive "handing over your wallet." Engineers will see the commitment as de-risking the probability (it signals belief and effort). Non-engineers understand effort and sacrifice.
  4.  **Blesses the Specific Gamble:** Focuses on Raj's qualities (guts, calculation, commitment) and the venture's specific merits (real work, real potential impact).
  5.  **Accessible Language:** Uses "skin in the game," "gears turning," "real shot," "crazy odds" – no jargon like "utility" or "expected value," while still conveying the concepts. Phrases like "mathematical ghost" hint at the paradox without requiring explanation.
  6.  **Voice:** Sounds conversational ("Man," "Okay, weird science," "Sorry, Raj," "damn world," "bacteria work overtime"). Nervous-friend vibe comes through in the pauses, self-deprecation ("biased"), and direct address to Raj.
  7.  **Ends Strong:** Clear call to action ("raise your glasses"), summarizes the specific reasons for praise ("betting on real work... real guts"), and ends on a warm, hopeful, and celebratory note directly tied to Raj's venture.

  This gives the engineers the substantive, probabilistic distinction they need (it's not *just* tiny probability, it's credible probability *amplified* by knowledge and action), while giving family the emotional reassurance that this isn't reckless, but brave and calculated. It squarely blesses *Raj's specific action* without endorsing the dangerous general principle.
