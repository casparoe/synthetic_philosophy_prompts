prompt: |-
  I chair the admissions and standards committee of a state licensing board, and every third year we have to re-justify each of our entry requirements to the legislature. We do it badly every time: the members who went through the requirements defend them, the newer members point out what they cost applicants in income and years, and we end up voting on whether a requirement feels relevant. Six of the nine of us hold the credential, which does not help. I would like a procedure we can actually run in a committee meeting, on one requirement at a time, that tells us whether a costly entry requirement is doing the work we claim for it.

  Take the following as given. Our staff analyst wrote a memo setting out what has to be true for an expensive requirement to be a credible signal of the professional competence we are charged with certifying, rather than a toll on the people who want to enter the field. The memo is a translation of the handicap principle and of the economics of education-as-signal into our terms, and the committee has accepted it as our working position. Its conditions:

  1. Differential cost. The requirement must be cheaper for applicants who already have the trait we care about than for applicants who lack it. A cost that falls equally on everyone, or that scales with family money, spare time, prior connections, or willingness to absorb mistreatment, is not screening for competence; it is screening for those other things.

  2. A sanction on the wrong type. A signal stays honest only if applicants who lack the trait and acquire the credential anyway end up worse off for having done it. So we must ask what the credential actually buys, and whether that payoff penalizes the poor-fit holder. If the credential is simply required in order to work at all, then the only penalty the wrong type suffers is the cost itself, and the requirement is a tax rather than a test.

  3. Separation rather than pooling. If nearly everyone can eventually satisfy the requirement, or if it ratchets upward as applicants compete, it stops separating anyone from anyone. The memo distinguishes requirements that are absorbing — met once and held forever, like a degree — from requirements that recur — met again and again, like hours or periodic exams — and says the two need different treatment.

  4. A direct index beats a costly ritual. Where a cheap test measures the trait itself rather than standing in for it, a costly proxy is dominated even if the proxy also correlates with competence.

  5. Revealing versus producing. If the requirement creates the competence rather than revealing it, the signaling story does not apply, though the fairness questions about who can afford to acquire it do.

  6. Who pays. Costs borne by the applicant, by their family, by clients, or by the public are not interchangeable, and we should record which is which before we vote.

  We have also been warned about two failure modes to design around: the strongest applicants may be the ones who skip the costly requirement, so its presence among successful licensees proves less than it appears to; and a requirement that was informative when it was rare may be worthless once it is universal.

  What I want from you is a procedure, in the order we should run it, for reviewing a single entry requirement. For each step: the question we ask, what evidence counts as an answer to it, what we do when we cannot get that evidence — we have almost no outcome data linking entry requirements to later performance, and we are not going to get any — and whether the step ends in a verdict (keep, keep with modification, replace, abolish) or stops the review with a no, or refers the matter to the full board because the question has become a value judgment about who should bear the cost of entering the profession rather than a factual one. Include a short form for the fifteen minutes we will actually have per requirement, and mark where the short form is unsound.

  Then run the procedure on three of our requirements:

  - 1,200 hours of supervised practice, unpaid, which applicants typically complete over a year while holding another job;
  - a written entry examination with a 45 percent first-attempt pass rate, retakeable for a fee;
  - 40 hours of in-person continuing education every two years, in a state where the nearest approved provider is a five-hour drive from two of our three population centers.

  At least one of the three should come out badly for us. Be explicit about which one, what it means, and what we would have to give up.

  Finally, tell me what the procedure cannot do: which questions about our requirements it will not settle, which of the six conditions are doing real work in it and which we could drop without changing any verdict, where it is a value judgment wearing the clothes of an audit, and which of the six conditions you would amend and how.
reasoning: |-
  Hmm, the user chairs a licensing board committee that struggles to evaluate entry requirements. They've accepted a framework based on signaling theory but need a practical procedure to apply it during meetings. 

  Key challenges jump out: 
  - The committee has inherent bias (6/9 members hold the credential)
  - They lack outcome data linking requirements to performance
  - Meetings are time-constrained (15min per requirement)
  - There's tension between veteran defenders and newer critics

  The signaling framework conditions are sophisticated but abstract. My job is to operationalize them into actionable steps that force concrete discussions. The procedure must:
  - Surface hidden costs (who actually bears them?)
  - Distinguish signaling from skill-building
  - Handle different requirement types (absorbing vs recurring)
  - Work without perfect data

  For the short form, I'll focus on killer questions that expose dealbreakers fast. But I'll flag where this risks oversimplification - like when we can't verify differential cost.

  Now testing the procedure on their three examples:

  The unpaid internship fails spectacularly on multiple conditions. It's clearly screening for privilege, not competence - but abolishing it would force admitting they've been gatekeeping. The exam is defensible if validated properly. The CE requirement is inefficient but fixable with hybrid options.

  The framework's limitations matter most:
  - It can't resolve who *should* pay for credentialing
  - Conditions #4 (direct index) and #6 (who pays) are doing heavy lifting
  - #2 (sanction) is theoretically important but hard to prove
  - Ultimately, this exposes value judgments hiding as technical debates

  Biggest insight: The procedure's real power is forcing transparency about tradeoffs. When requirements fail, the committee must confront whether they prioritize public protection or incumbent advantage.
answer: |-
  Here’s a robust, step-by-step procedure for evaluating requirements, designed for committee efficiency. The **short form (15-min version)** is marked with ⏱️, but it sacrifices nuance and should trigger a "no verdict" if red flags arise.

  ---

  ### **Procedure for Reviewing a Single Entry Requirement**  
  **Order of Steps**  
  *(Verdicts: K = Keep, M = Modify, R = Replace, A = Abolish)*  

  1. **Identify the Claimed Competence**  
     - **Question:** "What specific professional trait/competence does this requirement signal?"  
     - **Evidence:** Board records, job analyses, or expert testimony defining the trait.  
     - **No Evidence?** Requirement fails automatically (A).  
     - **Verdict:** If no clear competence is named → **A**.  

  2. **Check for Direct Index (Condition 4)**  
     - **Question:** "Is there a cheaper, direct measure of this competence (e.g., skills test, portfolio)?"  
     - **Evidence:** Studies comparing proxy requirements (e.g., degrees) to direct assessments.  
     - **No Evidence?** Proceed to Step 3 but note uncertainty.  
     - **Verdict:** If a direct index exists → **R** with the cheaper alternative.  
     - ⏱️ *Short Form: "Could we test this competence faster/cheaper?" If yes → Flag for replacement.*  

  3. **Differential Cost Analysis (Condition 1)**  
     - **Question:** "Is this requirement costlier (time/money/effort) for applicants *lacking* the competence?"  
     - **Evidence:** Data on pass rates, completion times, or costs by applicant preparedness (rare). Proxy: Logic check (e.g., "Does failing an exam cost more for the incompetent?").  
     - **No Evidence?** Use committee judgment → If costs scale with wealth/time (not competence) → **A/M**.  
     - **Verdict:** If costs fall equally or advantage resourced applicants → **A/M**.  

  4. **Sanction on Wrong Type (Condition 2)**  
     - **Question:** "Does failing/cheating this requirement penalize incompetent holders more than the cost alone?"  
     - **Evidence:** Disciplinary data, employer reports on credential misuse.  
     - **No Evidence?** Assume the credential is a "tax" if mandatory for work → **A** unless modified.  
     - **Verdict:** If no sanction beyond entry cost → **A/M** (e.g., add monitoring).  

  5. **Separation vs. Pooling (Condition 3)**  
     - **Question:** "Does this requirement separate competent/incompetent applicants, or do most eventually pass?"  
     - **Evidence:** Historical pass/fail rates, attrition data.  
     - **No Evidence?** → If >80% pass or requirement inflates (e.g., degree creep) → **A**.  
     - **Verdict:** If absorbing (e.g., degree) and near-universal → **A**. If recurring (e.g., CE) and low attrition → **M/A**.  

  6. **Revealing vs. Producing (Condition 5)**  
     - **Question:** "Does this requirement *reveal* existing competence or *create* it?"  
     - **Evidence:** Training outcomes research (e.g., does supervised practice build skills?).  
     - **No Evidence?** If clearly skill-building (e.g., internships), treat as training cost → **Refer to full board** (value judgment: who should pay for training?).  
     - **Verdict:** If producing competence → **Not a signal**; refer for cost-allocation debate.  

  7. **Cost-Bearer Audit (Condition 6)**  
     - **Question:** "Who bears the cost (applicant, employer, public, clients)?"  
     - **Evidence:** Applicant surveys, economic analyses.  
     - **No Evidence?** Committee estimate → If costs pushed to applicants unfairly → **M** (e.g., subsidies).  
     - **Verdict:** If public/clients bear cost for private benefit → **M/R**.  

  **Stopping Points:**  
  - End after Step 1 if competence undefined (**A**).  
  - End after Step 6 if requirement produces competence (**Refer to board**).  
  - End after any step with **A/M/R** verdict.  
  - If all steps passed → **K**.  

  ---

  ### **Application to Your Requirements**  
  **1. 1,200 Unpaid Supervised Practice**  
  - **Step 1:** Claims "clinical judgment" competence.  
  - **Step 2:** Direct index possible (e.g., skills assessment). → **R**  
  - **Step 3:** **Fails.** Costlier for low-income applicants (needs second job), not incompetents.  
  - **Step 4:** No sanction beyond cost (mandatory for work). → **A**  
  - **Verdict:** **Abolish.** *What you give up:* Illusion that this screens competence. It screens for endurance/financial privilege.  

  **2. Written Exam (45% Pass Rate, Fee for Retakes)**  
  - **Step 1:** Claims "core knowledge" competence.  
  - **Step 2:** Direct index (exam) is already efficient. → **K**  
  - **Step 3:** **Passes.** Differential cost: Failing/retaking costs more for less-prepared.  
  - **Step 4:** Sanction exists (failing delays income; incompetents likelier to fail). → **K**  
  - **Step 6:** Cost on applicant; retake fees penalize poor. → **M** (cap retakes/subsidize fees).  
  - **Verdict:** **Keep with modification** (address cost equity).  

  **3. 40-Hour In-Person CE (Distant Providers)**  
  - **Step 1:** Claims "updated skills" competence.  
  - **Step 2:** Direct index possible (online test). → **R**  
  - **Step 3:** **Fails.** Travel time/cost scales with geography/wealth, not competence.  
  - **Step 5:** Likely skill-producing → **Refer to board** (should employers/public fund?).  
  - **Verdict:** **Replace** with online/hybrid options. *If kept, it burdens rural applicants unnecessarily.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Value Judgments:** It flags but cannot resolve:  
     - Who *should* pay for training (Step 6 referrals).  
     - "Fair" cost levels (e.g., is 1,200 hours acceptable if paid?).  
  2. **Useless Conditions:**  
     - **Condition 2 (Sanction)** rarely decides verdicts alone (fails often with Condition 3/6).  
     - **Condition 5 (Revealing/Producing)** is critical but usually refers issues upward.  
  3. **Data Gaps:** Relies on logic when data is absent; may over-rely on committee bias.  
  4. **Amend Condition 4:** It should clarify that a "direct index" must be *feasible* (e.g., not "observe every applicant for a year").  
  5. **Hidden Value Judgments:** The procedure appears technical but embeds equity concerns (e.g., Step 3’s focus on privilege).  
  6. **Misses:**  
     - Whether requirements protect incumbents (the "strong applicants skip" warning).  
     - Long-term societal costs (e.g., reduced workforce diversity).  

  **Key Insight:** The procedure forces transparency about **what requirements actually screen for**. When they fail (like the unpaid practicum), you must confront whether you’re certifying competence or compliance. Conditions #1, #3, and #6 do the heaviest lifting; #2 and #5 are often unresolved. Ultimately, this is a tool to expose gatekeeping—not to justify the status quo.
