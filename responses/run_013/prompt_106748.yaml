answer: |-
  ## The Weight Protocol

  The storm had settled into a low, angry growl by the time Lena pulled into the SAR command post parking lot. Inside, the trailer hummed with grim energy: radios crackled, maps were unfurled and weighted down with coffee mugs, and the scent of wet wool and adrenaline hung thick. Lena shrugged off her snow-crusted parka, the warmth hitting her like a physical blow. Her fingers, numb from the drive, fumbled with the zipper.

  "Lena, thank Christ," muttered Hal, the incident commander, his face etched deep with fatigue. He thrust a sheaf of thermal printouts at her. "New sat images. Three more parties confirmed stranded. Avalanche risk spiking on the eastern ridge. We have three teams coming off rotation, two more inbound but delayed by the pass. We need a priority list *now*."

  Lena nodded, taking the still-warm papers. Coordinator. Protocol. The words were anchors. She slid into her designated station, a folding table laden with laptops, radios, and the heavy, spiral-bound binder: *Mountain Region SAR Triage and Allocation Protocol – Version 4.2*. She flipped it open to Section 7: *Multi-Party Stranding Prioritization Matrix*. The plastic cover was smudged, the pages dog-eared. Familiar territory, yet tonight the air felt heavier, charged.

  The printouts showed thermal signatures. Party Alpha: two figures, high on the exposed Knife's Edge trail. Estimated coordinates placed them near a known shallow overhang. Survival probability: Moderate-High (Shelter proximity, likely adequate gear). Accessibility: Low (Technical rock face, high avalanche exposure). Estimated extraction time with available assets: 8+ hours.

  Party Beta: single figure, lower down in the heavily treed basin. Survival probability: High (Good tree cover, lower wind exposure). Accessibility: High (Gentle slope, accessible by snowmobile near base). Extraction time: 2 hours.

  Party Gamma. Lena’s breath hitched, just for a fraction of a second, before the protocol slammed down. Two figures. Coordinates: Sentinel Col. Miles’s planned route. Her younger brother, Miles, and his climbing partner, Jen. Sentinel Col was a vast, wind-scoured bowl below a notorious cornice. The thermal image showed two distinct blobs, close together near the base of a rock outcrop. Survival probability: Low (Extreme exposure, minimal natural shelter, potential for rapid snow accumulation). Accessibility: Very Low (Steep, complex terrain, confirmed active avalanche chutes above). Extraction time: 12+ hours, *if* conditions allowed deployment at all before the next wave hit.

  She picked up a pencil, its sharpness a small comfort. Protocol demanded scoring. She filled the grid mechanically, translating observations into numbers. Survival Prob: Alpha (7), Beta (8), Gamma (4). Accessibility: Alpha (3), Beta (9), Gamma (2). Extraction Time: Alpha (8), Beta (2), Gamma (12). The protocol weighted extraction time highest in dynamic, deteriorating conditions. She multiplied, summed the weighted scores.

  Beta: (8 * 0.3) + (9 * 0.2) + (2 * 0.5) = 2.4 + 1.8 + 1.0 = **5.2**
  Alpha: (7 * 0.3) + (3 * 0.2) + (8 * 0.5) = 2.1 + 0.6 + 4.0 = **6.7**
  Gamma: (4 * 0.3) + (2 * 0.2) + (12 * 0.5) = 1.2 + 0.4 + 6.0 = **7.6**

  Gamma. Party Gamma had the highest score. The highest *need*. The protocol demanded prioritization based on the highest aggregate score indicating greatest immediate peril balanced against resource expenditure. Gamma was the statistical priority. Miles was the statistical priority. The pencil tip snapped against the paper. She didn't think, "That's Miles." She thought, "Score 7.6. Highest." She circled Gamma on her worksheet.

  "Hal," she called, her voice steady, detached. "Priority order: Gamma, Alpha, Beta. Gamma scores highest. Sentinel Col. Two subjects, low survival prob, very low accessibility, long extraction. They need the next available team, but warn them about the chutes above the Col. Absolute necessity for avalanche tech." She pushed the worksheet towards him.

  Hal scanned it, his brow furrowed. "Sentinel? In this? Christ. Okay. Gamma it is. Team Three is gearing up; they’re our best for that terrain." He picked up the radio. "Dispatch, update priority: Gamma, Sentinel Col coordinates confirmed. Prep Team Three. Advise extreme avalanche caution, multiple chutes active above target..."

  Lena turned back to the thermal images. Miles’s thermal blob stared back. She noted the coordinates again, cross-referenced them with the last known ping from his locator beacon. Consistent. She updated the asset tracking log. *Asset 12: Gamma Party, Subject A (Miles Chen). Status: Stranded, Critical.* She felt nothing but the cold weight of the numbers. The protocol was the path. The only path that didn’t lead into the howling dark of indecision. She moved to the comms desk to monitor Team Three’s check-in.

  ***

  Six weeks later, the institutional review board hearing room felt sterile and overlit. Lena sat at a long, polished table facing three members. Hal was beside her, looking uncomfortable in a button-down shirt. The air conditioning hummed loudly. They were reviewing the Sentinel Col incident. Miles and Jen had been extracted, alive but with severe frostbite, after a harrowing 14-hour operation that nearly cost two rescuers their lives. Party Beta had been retrieved easily within three hours. Party Alpha had sheltered effectively and were rescued later with minor hypothermia. The outcome was positive, but the risk taken for Gamma was deemed extreme by the regional oversight committee. They wanted the reasoning documented.

  Dr. Aris Thorne, the committee chair, adjusted his glasses. "Ms. Chen, thank you for joining us. We're reviewing the decision-making process for the prioritization during the Storm Helena incident, specifically the allocation of Team Three to Party Gamma at Sentinel Col. Your triage worksheet indicates Gamma scored highest under the protocol. Walk us through how you applied the matrix that night."

  Lena kept her hands folded on the cool table. "Yes, Dr. Thorne. As per Section 7.3, I inputted the observed and estimated factors for each stranded party into the prioritization matrix. Survival probability, accessibility, and estimated extraction time are the weighted factors. For Gamma..." She paused, forcing the words to align with the memory of the worksheet, not the thermal blob. "...Survival Probability was assessed as Low, score 4, based on extreme exposure and minimal shelter. Accessibility was Very Low, score 2, due to the terrain complexity and confirmed active avalanche paths. Estimated Extraction Time was 12+ hours, score 12. Weighted sum was 7.6. Alpha scored 6.7, Beta 5.2. Gamma presented the highest aggregate need based on the protocol’s algorithm for deteriorating conditions, which weights extraction time heavily."

  Dr. Thorne made a note. "The survival probability for Gamma was notably lower than the others. Accessibility was the worst. Yet the high extraction time score pushed it to the top. Were you confident in that 12-hour estimate given the conditions?"

  "It was the best estimate based on historical data for similar rescues in Sentinel Col under red-level avalanche warning," Lena replied, her voice flat. "The protocol uses predefined time brackets. Their position and the conditions placed them firmly in the 12+ bracket."

  A second member, Ms. Vance, leaned forward. "Ms. Chen, we note that Party Gamma included your brother, Miles Chen. Did that relationship factor into your assessment? Did you feel any... pressure, conscious or otherwise, to prioritize Gamma?"

  Lena felt Hal tense beside her. This was the question. She had known it would come. She met Ms. Vance’s gaze. "The protocol exists to remove subjective factors from the equation during high-stress events. My focus was on accurately inputting the observable data – coordinates, terrain features, weather forecasts, known hazards – into the matrix as defined. The relationship was not a data point entered into the calculation. The protocol generated the score. I reported the result." She paused, choosing her next words with the precision of placing pitons. "Assigning Gamma the highest priority was the outcome dictated by the impartial application of the weighted criteria. It reflected their objectively highest level of immediate peril based on the defined metrics."

  Ms. Vance’s pen hovered. "So, you’re saying the fact that it was your brother didn’t influence the *input* of the data?"

  Lena thought of the thermal image. The snapped pencil. The act of circling 'Gamma'. The hollow calm of letting the numbers decide. "No," she said, the word crisp in the air-conditioned room. "I didn’t think about him as my brother when inputting the data. I thought about the coordinates, the wind speed on the col, the snow accumulation rate, the avalanche report. He was Subject A of Asset Gamma. The protocol required that. Following it was the only way to ensure the decision was correct." She left no space in her tone for anything else. One inch of space, maybe, between the statement and the memory of circling the number.

  Dr. Thorne nodded slowly. "Thank you, Ms. Chen. That clarifies the process. We appreciate your adherence to the protocol under such difficult circumstances." He shuffled his papers, signaling the end of her formal questioning.

  Later, walking out into the bland corridor with Hal, he clapped her awkwardly on the shoulder. "You handled that well, Lena. Textbook." He sounded relieved.

  Lena nodded, adjusting the strap of her bag. "Just the facts," she said. The fluorescent lights buzzed overhead. She thought of Miles, recovering, his fingers still wrapped, and of the cold, precise logic of the matrix that had sent help his way. She thought of the sheer face of Sentinel Col and the rescuers who’d climbed it. She didn't think about which thought had come first in the trailer that night – the protocol, or the brother. The corridor stretched ahead, brightly lit and empty.

  ---

  **Endnote (98 words):**

  This story isolates the **deliberative-order charge (b)**: the objection that impartial systems demand personal attachments justify themselves within an impartial framework, corrupting the structure of deliberation. Lena's initial scene shows the protocol *replacing* deliberation about her brother with a mechanical process, making his rescue a byproduct of rule-following, not direct attachment. The review board scene forces her to retrofit her actions into an impartial justification, framing the attachment as an excluded factor rather than the immediate reason it was. The near-collapse point is Lena’s statement: **"I didn’t think about him as my brother when inputting the data."** Here, actively suppressing the attachment to follow the protocol risks mirroring the corruption Williams describes, even as it enabled the rescue. The misranking charge (a) is secondary; the protocol *did* rank Gamma (Miles) highest.
