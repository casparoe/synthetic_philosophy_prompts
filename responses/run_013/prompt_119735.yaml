prompt: |-
  Write a satirical in-universe document of about 600 words: Form IN-4, "Application for Determination of Intrinsic Nature," from a municipal Office of Essential Properties — the form's instructions, the applicant's handwritten answers and marginal notes, and the clerk's adjudication. The office requires each applicant to state what the designated item is in itself, apart from its parts, its causes, and any convention of naming. The applicant, who has been reading Madhyamaka, answers every question with the four positions the tradition examines and sets aside — that it is so, that it is not so, that it both is and is not so, that it neither is nor is not so — and the clerk, obliged to tick exactly one box, rejects all four. The humour must come from the philosophy being right: the demand for a determinate own-nature (svabhāva) is what those four positions are designed to dissolve, not a menu to choose from; the form would be perfectly completable under the conventional/ultimate distinction, which is exactly the move the office cannot process; and the four-member appeals panel, one seat per position, should land as a fair reductio of turning a therapeutic method into a licensing procedure. Let the clerk voice the standard misreading that emptiness means nothing exists, and let the applicant's marginal notes quietly betray that a teaching aimed at ending conceptual proliferation has generated a filing system of its own. Deadpan throughout, no winking; the reader should finish unsure which of the two is in the grip of a view.
reasoning: |-
  Okay, the user wants me to create a satirical bureaucratic form about philosophical concepts, specifically drawing from Madhyamaka Buddhism. They're looking for an in-universe document called Form IN-4 "Application for Determination of Intrinsic Nature" that satirizes how bureaucracy tries to pin down essential nature (svabhāva) when Buddhist philosophy actually dissolves such concepts.

  I need to structure this as an official municipal form with three components: the form instructions, the applicant's handwritten responses, and the clerk's adjudication. The applicant should answer using the four Madhyamaka positions (is, is not, both, neither) for every question, while the clerk must reject all options because the form requires a singular answer. 

  The humor should come from the philosophical irony - the office demands a fixed essence while the applicant correctly applies the Madhyamaka method that deconstructs such demands. I'll include subtle details: the clerk misinterpreting emptiness as nihilism ("nothing exists"), and the applicant's marginal notes showing how this philosophy meant to end conceptual proliferation has ironically spawned more bureaucracy. 

  For the reductio ad absurdum, I'll create a four-member appeals panel with one seat per position. The satire must remain deadpan throughout - no overt jokes, just letting the bureaucratic absurdity speak for itself. The ending should leave readers unsure whether the applicant or clerk is more deluded.

  I'll craft the form to look authentic with bureaucratic jargon, while the applicant's handwriting (in brackets) reveals their frustration. The clerk's responses will show rigid adherence to procedure despite its philosophical incoherence. Key elements include:
  - Item 1: The teacup as the designated object
  - Questions about origin, components, function that the applicant answers with all four positions
  - Clerk's checkboxes that can't accommodate multiple answers
  - Final rejection citing "non-substantive responses"
  - The appeals panel structure as perfect bureaucratic parody

  The challenge is maintaining philosophical accuracy within the satire while keeping the tone perfectly straight-faced. I'll ensure the applicant's marginal notes subtly critique the system without breaking character, and the clerk's comments reveal fundamental misunderstandings of emptiness theory. The document should feel like something you'd actually find in a Kafkaesque municipal office.
answer: |-
  **MUNICIPAL OFFICE OF ESSENTIAL PROPERTIES**
  **FORM IN-4: APPLICATION FOR DETERMINATION OF INTRINSIC NATURE (SVABHĀVA)**

  **PURPOSE:** To establish the definitive, inherent, independent essence of a designated item, separate from its constituent parts, its causal origins, or any socially agreed-upon name or function. This determination is essential for proper municipal categorization, taxation, and ontological licensing under Ordinance 7.3.1 (Essential Properties Act).

  **INSTRUCTIONS TO APPLICANT:**
  1.  **Item Designation:** Clearly describe the item whose intrinsic nature is to be determined. Use common terminology.
  2.  **Section A: Origin:** State what the item *is in itself*, independent of its causes or origins. (e.g., A clay pot is not *essentially* the clay, the potter, or the kiln).
  3.  **Section B: Components:** State what the item *is in itself*, independent of its constituent parts. (e.g., A bicycle is not *essentially* the wheels, frame, or handlebars).
  4.  **Section C: Conventional Identity:** State what the item *is in itself*, independent of its name, function, or societal agreement. (e.g., A "chair" is not *essentially* its label or its purpose for sitting).
  5.  **Declaration:** Affirm that the provided answers capture the item's true, independent, non-contingent being. Sign and date.
  6.  **ADJUDICATION SECTION:** FOR OFFICE USE ONLY. Clerk must select ONE box per Section (A, B, C) indicating acceptance of the applicant's stated intrinsic nature.

  **APPLICANT SECTION:**
  *(Handwritten entries in blue ink)*

  **1. Item Designation:** One (1) ceramic teacup, white glaze, slight chip on rim. "Mug" is a misnomer; handle design precludes secure mug-gripping. *(Margin: Objectively present? Conventionally designated. The chip is integral to its current suchness.)*

  **Section A: Origin (State what the item IS IN ITSELF, apart from causes/origins):**
  *   (a) The teacup is intrinsically "teacup." *(Margin: Conventional designation.)*
  *   (b) The teacup is intrinsically *not* "teacup." *(Margin: Lacks inherent existence.)*
  *   (c) The teacup is intrinsically *both* "teacup" and *not* "teacup." *(Margin: Simultaneously conventional & empty.)*
  *   (d) The teacup is intrinsically *neither* "teacup" *nor* "not teacup." *(Margin: Beyond conceptual extremes.)*
  *(Margin: All positions examined & set aside. Causality is interdependent, not intrinsic. Clay, potter, kiln – all empty. Yet, here it is.)*

  **Section B: Components (State what the item IS IN ITSELF, apart from constituent parts):**
  *   (a) The teacup is intrinsically "teacup." *(Margin: Designated whole.)*
  *   (b) The teacup is intrinsically *not* "teacup." *(Margin: Mere assembly of parts.)*
  *   (c) The teacup is intrinsically *both* "teacup" and *not* "teacup." *(Margin: Whole depends on parts, parts depend on whole. Identity ambiguous.)*
  *   (d) The teacup is intrinsically *neither* "teacup" *nor* "not teacup." *(Margin: Not findable as separate from parts, nor as identical.)*
  *(Margin: Seeking "cupness" in glaze, clay, void? Not found. Yet, functionally holds tea... sometimes.)*

  **Section C: Conventional Identity (State what the item IS IN ITSELF, apart from name/function/society):**
  *   (a) The teacup is intrinsically "teacup." *(Margin: Habitual label.)*
  *   (b) The teacup is intrinsically *not* "teacup." *(Margin: Without convention, just shaped matter.)*
  *   (c) The teacup is intrinsically *both* "teacup" and *not* "teacup." *(Margin: Designated function exists, but not inherently.)*
  *   (d) The teacup is intrinsically *neither* "teacup" *nor* "not teacup." *(Margin: Transcends functional designation while allowing it.)*
  *(Margin: Could be a pencil holder! Or a weapon! But convention says "teacup". So it is... conventionally. Form requires intrinsic? Problematic.)*

  **Declaration:** I affirm that the above responses accurately represent the intrinsic nature of the designated item, understood as its non-contingent, essential being independent of causes, parts, and conventions.
  **Signature:** *[Illegible scrawl]*
  **Date:** 10/27

  *(Margin below signature: Form demands svabhāva. Emptiness *is* its lack. This application *is* a demonstration of the problem. Four positions cover the conceptual field. Clerk will pick one? Absurd. Yet, filing fee paid. Karmic bureaucracy.)*

  ---

  **ADJUDICATION SECTION (OFFICE USE ONLY)**

  **Clerk: T. Blandish**
  **Date: 10/28**

  **Review Notes:**
  *   Applicant designated item clearly: Ceramic Teacup. Acceptable.
  *   Section A Response: Applicant provided multiple contradictory statements (a, b, c, d). Form requires *one* definitive intrinsic nature statement per section. No coherent position established regarding origin-independent essence. *(Margin: Seems to be saying it both is and isn't a teacup? And neither? Makes no sense. If it isn't intrinsically anything, why apply?)*
  *   Section B Response: Same issue. Applicant lists four mutually exclusive options regarding part-independent essence. Fails to isolate the essential teacup-ness. *(Margin: Parts clearly make the cup. What else is there?)*
  *   Section C Response: Again, four contradictory answers regarding convention-independent essence. Applicant fails to state what the teacup *truly is* underneath the name. *(Margin: It's a teacup. That's its function. Simple. This "neither" business is nonsense. Sounds like they're saying nothing exists.)*
  *   Declaration signed, but responses non-substantive. Applicant appears to misunderstand the requirement for a *determinate* intrinsic nature. Form IN-4 cannot process relativistic or nihilistic assertions. *(Margin: Emptiness just means nothing has real existence? Then why bother licensing teacups?)*

  **ADJUDICATION:**
  *   **Section A:** [ ] Accepted [X] Rejected *(Reason: Non-definitive, multiple contradictory responses)*
  *   **Section B:** [ ] Accepted [X] Rejected *(Reason: Non-definitive, multiple contradictory responses)*
  *   **Section C:** [ ] Accepted [X] Rejected *(Reason: Non-definitive, multiple contradictory responses; potential nihilism)*

  **OVERALL DETERMINATION:** APPLICATION REJECTED. Intrinsic Nature (Svabhāva) UNDETERMINED.

  **Reason for Rejection:** Failure to provide a single, consistent, and definitive statement of the item's intrinsic nature in any required section (A, B, C). Applicant's responses demonstrate conceptual confusion and an inability to isolate the essential property from contingent factors, contravening the purpose of Form IN-4 and Ordinance 7.3.1.

  **Next Steps:**
  1.  Applicant may reapply with corrected responses adhering strictly to the requirement for a single, affirmative statement of intrinsic nature per section.
  2.  Applicant may appeal this decision to the Municipal Svabhāva Appeals Panel within 30 days. *(Note: The Appeals Panel consists of four members, each specializing in the adjudication of one of the four possible positions: Affirmation, Negation, Both, Neither. A majority decision is required for overturn.)*

  **Clerk Signature:** *T. Blandish*
  **Date:** 10/28

  *(Stamped in red across applicant's Section C: "UNDETERMINED - SEE CLERK NOTES")*
