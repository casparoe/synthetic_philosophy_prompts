prompt: |-
  Last weekend a friend and I burned most of a dinner arguing about the citizens' assembly our city convened to break a deadlock over a housing ordinance, and somewhere around the second hour I realized we weren't even disagreeing about the same thing: he kept hearing me as defending rule by amateurs, while what actually moves me is that nobody in that room had to raise money or run for anything to get there. That gap between the reasons people give for sortition and the institutions they would really endorse is what I want mapped, so I'm putting together a sorting quiz for the reading group we both sit in, and I'd like you to write it. Please produce eight to ten questions, each a concrete case with two or three answer options labeled A, B, and C so a scoring key can refer to them — no flattering self-descriptions, and no item that asks whether the respondent favors sortition, trusts ordinary people, or values fairness in the abstract. Every question has to be a specific scenario, or a specific claim about one, on which two people who both say "I'm for sortition" will predictably answer differently, and after each item please add a single line saying which two positions it is designed to separate, so I can cut anything that isn't earning its place. I want these cases covered: whether an assembly's recommendation should override a referendum when the two conflict; whether the sample should be stratified to match the population's demographics or left a pure lottery; whether members should be paid and staffed like legislators or kept as amateurs on jury-duty terms; whether deliberations should be televised and minuted or held in private to shield members from pressure; whether an assembly may set its own agenda or must take the question put to it; whether a lottocratic body should be purely advisory, a reviewing chamber with a veto, or a full replacement for one of the elected houses; whether a second, independently drawn lottery should audit the first body's work; whether service should be compulsory with penalties for refusal or opt-in for volunteers; and whether the whole arrangement should be a one-off experiment or a standing institution. Add one or two cases of your own if they cut more cleanly than mine, but stop at ten.

  For the scoring key, map answer patterns onto the positions I care about distinguishing, giving each a short name and one sentence on the distinctive commitment it carries: (a) the mirror or descriptive-representation view, on which the point of a lottery is that the body resembles the public it governs; (b) the cognitive-diversity view, on which random selection matters because varied heuristics and lived experience outperform a room of specialists, and demographic mirroring is at most a means to that end; (c) the anti-corruption view, on which the value is that no one had to court donors or voters, so the lottery is a device for removing a bad incentive rather than for improving judgment; (d) the non-domination view, on which being governed by a randomly chosen peer differs in kind from being governed by anyone's will, so the good realized is freedom rather than accuracy; (e) the pure fair-chance view, on which equal probability of selection exhausts the justification and no claim about the quality of the resulting decisions is needed; (f) the advisory-only view, on which assemblies are valuable as inputs to elected bodies and should never hold decision power; and (g) the full lottocratic view, on which elections should be largely replaced. Where a respondent's answers don't land on any single position, say so and describe the mixed position they've built instead of forcing a fit, and if two of the positions above cannot be separated by any of the questions, flag the pair rather than pretending the key distinguishes them — I'm especially curious whether (b) and (d) genuinely come apart on these cases, and whether anyone who picks the stratified option can consistently hold (d), so tell me which items are doing that separating work. Close with a short paragraph on what the quiz measures and a sentence or two each on what a reader should make of an unresolved profile. Write in American English.
reasoning: |-
  Hmm, the user wants me to create a sorting quiz about citizens' assemblies and sortition to help distinguish between different philosophical positions on the topic. They had a disagreement with a friend about why sortition is valuable - their friend thought they were defending rule by amateurs, while they were actually focused on how participants don't need to raise money or campaign.

  I need to create 8-10 concrete scenario questions with multiple-choice answers (A, B, C). Each question should force distinctions between the seven positions they outlined: (a) descriptive representation, (b) cognitive diversity, (c) anti-corruption, (d) non-domination, (e) pure fair chance, (f) advisory-only, and (g) full lottocracy. The questions must be specific scenarios, not abstract questions about values.

  The user specified coverage areas: assembly vs referendum conflict, stratification vs pure lottery, payment/staffing levels, public vs private deliberations, agenda-setting power, advisory/veto/replacement roles, auditing with second lottery, compulsory service vs opt-in, and temporary vs permanent institution.

  I'll craft questions that force choices between these positions. For example:
  - For the referendum conflict, I can ask whether the assembly should override the referendum, which would distinguish full lottocracy (g) from advisory (f) and others.
  - For stratification, I can ask whether demographic quotas matter, separating descriptive representation (a) from cognitive diversity (b) and pure fair chance (e).
  - For staffing, I can contrast professional legislators vs amateur jury-style service, separating anti-corruption (c) from others.
  - For agenda-setting, I can ask whether the assembly can reframe the question, which might distinguish cognitive diversity (b) from non-domination (d).
  - For the second lottery audit, I'll design options that test commitment to pure procedure (e) versus outcome quality (b or c).

  The scoring key will map answer patterns to the positions, noting where mixtures occur. I'll pay special attention to whether (b) cognitive diversity and (d) non-domination can be separated, and whether descriptive representation (a) is compatible with non-domination (d).

  I'll keep each question concise with clear distinctions, and add the required "positions separated" note after each. For the scoring, I'll be honest about overlaps and mixtures. The closing paragraph will explain what the quiz measures and how to interpret mixed results.
answer: |-
  Here is your sorting quiz designed to expose underlying commitments within support for sortition, focusing on concrete institutional choices rather than abstract values. Each scenario forces a trade-off relevant to the positions you want to distinguish.

  **Sortition Principles Sorting Quiz**

  1.  **Conflict with Referendum:** After a year of study and deliberation, a citizens' assembly recommends building a new transit line. However, a referendum held shortly after rejects the funding for it.
      *   **A:** The assembly's recommendation should stand; the dedicated deliberation outweighs the popular vote.
      *   **B:** The referendum result must prevail; the public's direct vote is the ultimate authority.
      *   **C:** Neither automatically wins; the issue must go back to the elected legislature for a final decision considering both inputs.
      *   *(Separates: Full Lottocracy (g) vs. Advisory-Only (f) vs. Majoritarian/Electoral Legitimacy)*

  2.  **Stratification Method:** When selecting members for a national assembly on healthcare reform, how should the lottery be conducted?
      *   **A:** A pure, unstratified lottery from the entire voter roll. Demographics will naturally vary.
      *   **B:** Stratified random sampling to precisely match national demographics (age, gender, income, region, education).
      *   **C:** Stratified random sampling focused only on key experiential factors relevant to healthcare (e.g., patient types, caregiver status, uninsured).
      *   *(Separates: Pure Fair-Chance (e) vs. Mirror/Descriptive (a) vs. Cognitive Diversity (b))*

  3.  **Member Status & Support:** What resources and obligations should assembly members have?
      *   **A:** Treated like jurors: modest daily stipend, minimal staff support, short service period (e.g., 4 weeks), expected to return to normal life.
      *   **B:** Treated like legislators: full salary equivalent to elected reps, dedicated personal staff, office space, longer or renewable service (e.g., 1-2 years).
      *   **C:** Modest stipend plus substantial expert staff support solely for research and process facilitation, medium service period (e.g., 3-6 months).
      *   *(Separates: Anti-Corruption (c) / Non-Domination (d) vs. Mirror (a) / Cognitive Diversity (b) vs. Functional Effectiveness)*

  4.  **Deliberation Transparency:** How should the assembly's internal discussions be handled?
      *   **A:** Fully public: televised sessions, detailed public minutes, members identifiable and expected to explain their views publicly.
      *   **B:** Fully private: no recordings, no identifiable attribution of views in summaries, members protected from outside pressure and lobbying.
      *   **C:** Summaries of arguments and evidence made public, but individual contributions anonymized, final votes recorded.
      *   *(Separates: Mirror (a) / Anti-Corruption (c) vs. Non-Domination (d) / Cognitive Diversity (b) vs. Compromise)*

  5.  **Agenda Control:** The assembly is convened to address "traffic congestion downtown." During deliberations, members become convinced the core problem is actually a lack of affordable housing forcing long commutes.
      *   **A:** The assembly must stick strictly to the question of traffic congestion; they cannot redefine the problem.
      *   **B:** The assembly should formally request permission from the convening authority (e.g., mayor/council) to broaden the agenda.
      *   **C:** The assembly has the inherent authority to refine or reframe the question based on its deliberations to address the root cause.
      *   *(Separates: Advisory-Only (f) / Pure Fair-Chance (e) vs. Cognitive Diversity (b) / Non-Domination (d) vs. Procedural Constraint)*

  6.  **Institutional Power:** What formal legal role should a standing citizens' assembly have within the government?
      *   **A:** Purely advisory: submits recommendations to elected bodies who retain final decision power.
      *   **B:** Reviewing chamber with suspensive veto: can delay legislation for reconsideration or require a supermajority/special vote to override.
      *   **C:** Full legislative power in one policy area (e.g., environment), replacing the relevant elected committee/house.
      *   *(Separates: Advisory-Only (f) vs. Full Lottocracy (g) vs. Partial Reform)*

  7.  **Second Lottery Audit:** After a citizens' assembly completes its final report, a proposal is made to:
      *   **A:** Do nothing; the assembly's work stands as presented.
      *   **B:** Have an independent panel of experts review the report for factual accuracy and coherence.
      *   **C:** Convene a second, new citizens' assembly (drawn by lottery) to review the first assembly's report and process before it's finalized.
      *   *(Separates: Pure Fair-Chance (e) / Non-Domination (d) vs. Cognitive Diversity (b) / Anti-Corruption (c) vs. Expert Validation)*

  8.  **Compulsion vs. Opt-In:** How should individuals be chosen?
      *   **A:** Compulsory service like jury duty: penalties for refusal without valid excuse.
      *   **B:** Opt-in from a large pool: invitations sent, interested people apply, then a stratified lottery selects from applicants.
      *   **C:** Compulsory initial selection, but individuals can freely decline without penalty.
      *   *(Separates: Mirror (a) / Pure Fair-Chance (e) vs. Cognitive Diversity (b) / Anti-Corruption (c) / Non-Domination (d) vs. Volunteerism)*

  9.  **Temporary vs. Permanent:** Should citizens' assemblies be used as:
      *   **A:** Primarily one-off or occasional tools for breaking specific deadlocks or complex issues.
      *   **B:** A permanent, regularly convening institution (e.g., meeting quarterly or annually) on a defined range of topics.
      *   **C:** A permanent body replacing an existing elected chamber or committee.
      *   *(Separates: Advisory-Only (f) vs. Full Lottocracy (g) vs. Standing Input Body)*

  10. **Scope of Mandate:** A regional assembly on climate policy is nearing its end. Some members passionately argue the evidence demands immediate, sweeping changes beyond the policy levers initially discussed.
      *   **A:** The assembly must limit itself to specific policy recommendations within the scope defined at the start.
      *   **B:** The assembly can recommend broad principles or goals but should leave specific implementation to elected bodies.
      *   **C:** The assembly has the authority to propose binding measures, including new regulations or taxes, based on its understanding of the crisis.
      *   *(Separates: Advisory-Only (f) vs. Full Lottocracy (g) vs. Non-Domination (d) / Cognitive Diversity (b))*

  ---

  **Scoring Key: Mapping Answers to Positions**

  This key interprets patterns in the answers, mapping them to the core commitments you outlined. **Crucially:** A respondent's answers may not fit cleanly into one position, revealing a hybrid view. The key highlights items that best separate specific pairs, especially (b) Cognitive Diversity and (d) Non-Domination.

  *   **Mirror / Descriptive-Representation (a):** *Commitment:* The assembly's legitimacy and quality stem primarily from statistically resembling the population demographically.
      *   *Key Indicators:* Strong preference for **Stratified Demographics (2B)**, possibly **Compulsion (8A)** to ensure representativeness, openness to **Televised Deliberations (4A)** for transparency/accountability of the mirror. Less concerned with deep **Agenda Control (5A)** or **Power (6A)** if the mirror is achieved.
      *   *Separation Work:* Q2 is critical for separating (a) from (b) and (e). Q8 also helps distinguish (a) from (d)/(c).

  *   **Cognitive-Diversity (b):** *Commitment:* Random selection is valuable because it gathers diverse perspectives and heuristics, leading to better problem-solving than expert groups; demographics are a potential tool, not the core goal.
      *   *Key Indicators:* Preference for **Experiential Stratification (2C)**, **Agenda Control (5C)** to follow evidence, **Staff Support (3C)** for informed deliberation, **Private/Protected Deliberations (4B/C)** to foster open exchange, **Significant Power (6B/C)**, **Second Lottery Audit (7C)** to check groupthink. Open to **Broad Mandate (10C)**.
      *   *Separation Work:* Q2 (C vs B/A), Q5 (C vs A/B), Q7 (C vs A/B), and Q10 (C vs A) are strong separators from (a) and (e). **Distinguishing (b) from (d):** Q5 (Cognitive Diversity leans C, Non-Domination might be A/B/C depending on view of mandate), Q7 (Cognitive Diversity leans C to check reasoning, Non-Domination likely A), Q10 (Cognitive Diversity leans C if evidence demands, Non-Domination might resist exceeding mandate - B).

  *   **Anti-Corruption (c):** *Commitment:* The core value is removing the corrupting influence of fundraising, campaigning, and re-election incentives inherent in elections.
      *   *Key Indicators:* Strong preference for **Amateur/Jury Status (3A)**, **Private Deliberations (4B)** to shield from lobbying, **Compulsion (8A/C)** to prevent self-selection of motivated/ideological volunteers, **Power (6A/B/C)** is secondary to *how* members got there. Likely **No Second Lottery (7A)** as unnecessary corruption check. **Pure Lottery (2A)** often preferred.
      *   *Separation Work:* Q3 (A vs B) is key vs (a)/(b). Q4 (B vs A) vs (a). Q8 (A/C vs B) vs (b) sometimes. Less focus on stratification (Q2A) or specific power level.

  *   **Non-Domination (d):** *Commitment:* Rule by randomly chosen peers is valuable *in itself* as a form of freedom from being subject to the arbitrary will of elites or persistent minorities/majorities.
      *   *Key Indicators:* Emphasis on **Pure Lottery (2A)** (any stratification feels like domination/engineering), **Amateur/Jury Status (3A)** (professionals become a new elite), **Private Deliberations (4B)** (protects freedom of thought), **Compulsion (8A)** ensures true chance/peerage. May support **Significant Power (6B/C)**. Suspicious of **Agenda Control (5C)** if seen as exceeding mandate (dominating), or **Second Lottery (7C)** as doubting peers. **Referendum Conflict (1A/C?)** complex (assembly as peers vs referendum as people).
      *   *Separation Work:* **Q2 (A vs B/C)** is critical vs (a) and (b). **Q8 (A vs B)** is critical vs volunteerism often linked to (b). **Can (d) hold Stratified?** Only weakly (Q2A strongly preferred). **Distinguishing (d) from (b):** Q2 (A vs C), Q7 (A vs C), Q8 (A vs B), Q5 (d more likely A/B than C if mandate is strict).

  *   **Pure Fair-Chance (e):** *Commitment:* Equality of opportunity to be selected is the *only* necessary justification; no claims about representation, diversity, or decision quality are needed or relied upon.
      *   *Key Indicators:* **Pure Lottery (2A)**, **Amateur Status (3A)** often (but not essential), **Agenda Strict (5A)**, **Low Power (6A)** often (power derived from chance alone feels insufficient?), **No Second Lottery (7A)** (chance was fair), **Temporary (9A)**. Indifferent to **Stratification, Deliberation Style, Mandate Scope** if chance is equal. **Referendum Conflict (1B/C)** likely (chance doesn't override popular vote).
      *   *Separation Work:* Q2 (A vs B/C) vs (a)/(b). Q5 (A vs B/C) vs (b)/(d). Q7 (A vs C) vs (b). Q6 (A vs B/C) vs (g)/(b).

  *   **Advisory-Only (f):** *Commitment:* Citizens' assemblies are valuable for informed public input but lack the legitimacy or mandate for binding decision-making, which must reside with elected bodies or direct democracy.
      *   *Key Indicators:* **Referendum Prevails (1B)**, **Agenda Strict (5A)**, **Purely Advisory Power (6A)**, **Narrow Mandate (10A/B)**, **Temporary Use (9A)**. Answers on other items (stratification, status) vary based on other commitments.
      *   *Separation Work:* Q1 (B vs A/C), Q6 (A vs B/C), Q9 (A vs B/C), Q10 (A/B vs C) are clear separators from (g) and advocates of power like (b).

  *   **Full Lottocracy (g):** *Commitment:* Elections are flawed; sortition should replace them as the primary method for filling significant legislative or policy-making roles in many domains.
      *   *Key Indicators:* **Assembly Overrides Referendum (1A)**, **Significant Power (6C)**, **Standing Institution (9C)**, **Broad Mandate (10C)**. Likely support for **Professional/Supported Status (3B/C)**, **Agenda Control (5C)**. Stratification views vary.
      *   *Separation Work:* Q1 (A vs B/C), Q6 (C vs A/B), Q9 (C vs A/B), Q10 (C vs A/B) are the clearest separators, especially from (f).

  **Unresolved Profiles & What They Mean:** This quiz measures the *operational priorities and institutional preferences* underlying support for sortition, revealing which justifications (anti-corruption, diversity, non-domination, etc.) are driving concrete choices. **If a respondent's answers don't cluster cleanly under one position:** It indicates a hybrid view. Common hybrids might be "Diversity + Anti-Corruption" (strong on Q2C, Q3A, Q4B, Q5C) or "Fair-Chance + Advisory" (Q2A, Q5A, Q6A, Q7A). **Flag this explicitly in scoring.** It shows their support is nuanced, drawing on multiple rationales for different aspects, rather than being anchored to a single philosophical foundation. **Specifically regarding (b) and (d):** The quiz *does* separate them, primarily through stratification preference (Q2), attitude towards auditing via second lottery (Q7), and compulsion vs. volunteerism (Q8). Holding stratified sampling (Q2B/C) is difficult to reconcile with a pure Non-Domination (d) view, which strongly prefers Q2A.
