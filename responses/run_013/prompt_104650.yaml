prompt: |-
  I am preparing a seminar on decision theory and want to pair Sophocles' Oedipus Rex with Good's theorem on the value of information. Good's theorem says that, under standard Bayesian assumptions, the expected value of information is non-negative: an agent who can costlessly ignore new evidence cannot be made worse off, in expectation, by receiving it. Oedipus looks like a counterexample. He seeks information about the murder of Laius and about his own parentage, and what he learns destroys him. I want a reading that takes both the play and the theorem seriously. Does the play dramatize a genuine limit of the theorem, or does it instead illustrate its scope conditions? Is Oedipus's failure that he cannot commit to ignoring the information, that his preferences change once he knows, that the information is not merely evidence but a cause of the outcome, or that the oracle's pronouncements are not information in the Bayesian sense at all? Where does the theorem illuminate a scene -- the consultation with Tiresias, the Corinthian messenger, the shepherd, Jocasta's realization -- and where does the play resist the reading and the honest critic has to say so? Finally, what does the tragedy add to the philosophical debate that decision theory alone does not: does it show that some knowledge is valuable only if it can be acted on, or that the value of information can be negative when the information is about who one is?
reasoning: |-
  Okay, the user is preparing a seminar on decision theory and wants to pair Sophocles' Oedipus Rex with Good's theorem. They see Oedipus as a potential counterexample to the theorem since the information he seeks leads to his downfall. I need to help them explore whether the play actually challenges the theorem or illustrates its limitations. 

  First, I should recall Good's theorem: it states that under Bayesian assumptions, the expected value of information is non-negative. Meaning, you can't be worse off in expectation by receiving free information since you can always ignore it. But Oedipus's story seems to contradict this—his pursuit of truth destroys him. 

  The user has several specific questions. They want to know if the play shows a limit to the theorem, or if it highlights the theorem's scope conditions. They also ask about possible reasons for Oedipus's failure: inability to ignore information, changing preferences, information causing the outcome, or issues with the oracle's pronouncements. Additionally, they want examples of where the theorem illuminates scenes like Tiresias, the messenger, the shepherd, and Jocasta's realization. And finally, what the tragedy adds philosophically that decision theory alone doesn't.

  Breaking down the key elements:
  Good's theorem relies on several assumptions: consistent preferences, Bayesian updating, costless ignorability, and that information doesn't causally affect outcomes. Oedipus's situation might violate these. For instance, his preferences aren't stable—before knowing, he wants truth; after, he blinds himself, indicating a shift. The information also isn't merely evidence; it directly causes Jocasta's suicide and his downfall. The oracle's prophecies are deterministic, not probabilistic, which challenges Bayesian updating since probabilities collapse to 1 or 0 upon revelation.

  Looking at the scenes:
  - Tiresias: Oedipus can't ignore the information here. He's compelled as king to investigate Laius's murder. His ignorance isn't costless.
  - Corinthian Messenger: Initially brings good news (Polybus dead), but Oedipus pushes for more, violating the theorem's assumption that you can stop. His inability to commit to ignoring leads to disaster.
  - Shepherd: The forced revelation confirms the truth. Oedipus's identity changes, altering his preferences—he's now a parricide and incestuous, which redefines his utility.
  - Jocasta: She realizes the truth before Oedipus and tries to stop him, showing that halting information acquisition could prevent harm. But Oedipus doesn't stop, highlighting his lack of commitment.

  The theorem's scope conditions are key here. Oedipus can't ignore the info because of his role and nature. His preferences change upon learning, violating consistency. The information has causal power (e.g., Jocasta's suicide). The oracle's statements are deterministic truths, not probabilistic evidence.

  Philosophically, the tragedy adds dimensions that decision theory misses. It shows that some knowledge, especially about identity, can be existentially shattering. The value of information isn't just about actionability; knowing who you are can change your self-conception irrevocably. Also, the inability to commit to ignorance is a human flaw that rational models might overlook.

  So for the seminar, the pairing is productive. The play doesn't refute Good's theorem but exposes where its assumptions break down—especially with identity-altering truths and when information has causal effects. The tragedy emphasizes existential stakes beyond Bayesian calculations. The user should highlight these limitations and use scenes to show where the theorem applies versus where human factors intervene.
answer: |-
  Your pairing of *Oedipus Rex* with Good's theorem is profoundly insightful, revealing both the power and limitations of formal decision theory when confronted with tragic, existential dilemmas. The play doesn't refute Good's theorem but *dramatizes its core assumptions*, exposing where they break down under the weight of fate, identity, and irreversible revelation. Here's a breakdown addressing your questions:

  ### Core Tension & Good's Theorem
  Good's theorem holds that **expected utility cannot decrease by acquiring free, costlessly ignorable information** under standard Bayesian assumptions (stable preferences, Bayesian updating, no causal influence of information on world states). Oedipus seems to violate this: seeking information leads to catastrophe. However, this tension highlights *scope conditions*:

  1.  **Costless Ignorability is Impossible:** Oedipus *cannot* commit to ignoring the truth.
      *   **As King:** His duty to Thebes demands investigating Laius's murder. Ignoring Tiresias or the shepherd would be an act of bad governance, inviting plague and unrest.
      *   **As Oedipus:** His defining trait is relentless intellectual pursuit ("I must know!"). His identity *is* the solver of riddles. Committing to ignorance is psychologically and existentially impossible for him. *The theorem assumes an agent can freely choose to ignore; Oedipus is fundamentally incapable of this choice.*
      *   **Scene - Tiresias:** Tiresias offers truth Oedipus could (theoretically) ignore. But Oedipus's rage and suspicion (fueled by his nature and duty) compel him to dig deeper, interpreting Tiresias's words as a threat rather than ignoring them. The "cost" of ignoring isn't just utility loss, but a violation of self.

  2.  **Preferences are Not Stable:** Good's theorem assumes preferences over outcomes don't change *with the information itself*. Oedipus's preferences *do* change catastrophically upon learning the truth.
      *   **Before Knowing:** He values kingship, family, civic order, and solving the plague's cause. He actively seeks the truth to preserve these.
      *   **After Knowing:** These goods become abominations. His kingship is illegitimate, his family is cursed, Thebes is polluted *by him*. His preference shifts to self-punishment (blinding, exile). The information *redefines his entire world and his valuation of it*. The "utility" of his prior state is annihilated by the knowledge itself. *The theorem assumes knowledge reveals states without altering the agent's fundamental valuation scheme.*

  3.  **Information Causes the Outcome (Self-Fulfilling Prophecy):** Good's theorem assumes information is purely *evidential*, not *causal*. The oracle's pronouncements are fundamentally different.
      *   **The Oracle:** It doesn't just predict; it *defines* Oedipus's fate. His parents' act of abandonment *because* of the prophecy, and Oedipus's flight from Corinth *because* of the prophecy, are direct causal results of the "information." The revelation to Oedipus doesn't just inform him of past events; it *activates* the full consequences of the curse inherent in the prophecy. Jocasta's suicide is a *direct causal result* of Oedipus learning the truth.
      *   **Scene - Corinthian Messenger & Shepherd:** The sequence appears evidential (messenger brings news, shepherd confirms). But the *act of revelation* triggers the final catastrophe. Jocasta realizes the truth *during* the interrogation and kills herself *before* Oedipus fully confirms it. The information flow itself is the catalyst. *Good's theorem doesn't account for information that physically or psychologically triggers the negative outcome it reveals.*

  4.  **The Oracle is Not "Evidence" in the Bayesian Sense:**
      *   **Determinism vs. Probability:** Bayesian updating deals with degrees of belief in uncertain states. The oracle's pronouncements are presented as *certain* truths within the play's logic. Oedipus doesn't update a probability of being the murderer/son; he grapples with the dawning horror of *certainty*. There's no "ignoring" a divine truth revealed; it simply *is*.
      *   **Source Problem:** Tiresias speaks truth, but Oedipus disbelieves him initially. Is this Bayesian updating (low prior on Tiresias's credibility)? Partially. But his disbelief stems more from rage and fear than probabilistic reasoning. The ultimate confirmation comes from sources he *must* believe (messenger, shepherd), collapsing any lingering uncertainty instantly.

  ### Where the Theorem Illuminates & Where the Play Resists

  *   **Illuminates - Jocasta's Realization:** Jocasta grasps the truth before Oedipus and desperately tries to stop the inquiry ("Stop! In the name of the gods, if you care for your own life!"). *This is the closest to Good's theorem.* She sees that *ignoring* the final confirmation (from the shepherd) is the only way to preserve their current lives. She implicitly recognizes the negative expected value of *further* information *given the irreversible catastrophe its revelation will cause*. Oedipus, unable to ignore, overrules her. This scene highlights the *potential* rationality of ignoring information, tragically thwarted.
  *   **Resists - Tiresias & Shepherd:** The theorem struggles with the *source* and *nature* of the information. Tiresias's truth is wrapped in anger and accusation, making "ignoring" politically and personally untenable. The shepherd's information is extracted under duress (threats) – not a costless acquisition. The theorem assumes neutral access; the play shows information embedded in power dynamics and fear.
  *   **Resists - The Final Revelation:** The theorem considers the value *before* knowing. Once Oedipus *knows*, the theorem's calculation is irrelevant. The play focuses on the devastating *experience* of knowing, the annihilation of self that follows. The theorem quantifies outcomes; the play depicts the existential cost.

  ### What the Tragedy Adds: Beyond Decision Theory

  *   **The Value of Identity-Knowledge is Existential, Not Instrumental:** Decision theory (and Good's theorem) focuses on information's value for *action* leading to desired outcomes. Oedipus learns a truth that makes *action* meaningless. His knowledge isn't about *what to do*; it's about *who he is*. The value isn't in its actionability but in its horrific, world-shattering truth. The "negative value" isn't just utility loss; it's the destruction of self and meaning. The tragedy shows that some knowledge defines identity so fundamentally that it alters the very grounds upon which utility is calculated.
  *   **The Impossibility of Rational Ignorance Under Fate:** The play explores the limits of rational agency itself. Oedipus is caught in a cosmic trap. His rational inquiry (solving the Sphinx, investigating Laius's murder) is the very mechanism of his downfall. Good's theorem assumes a free agent operating within a probabilistic world. The play depicts an agent whose rationality is ultimately powerless against a predetermined truth revealed through his own best efforts. The "negative value" is inherent in the tragic structure of fate, not just a calculation error.
  *   **The Embodied Cost of Knowing:** Decision theory is abstract. The play shows the visceral, physical, and psychological devastation – blinding, exile, Jocasta's suicide, the pollution of the city. This forces us to confront that the "value" of information isn't just a number; it's lived experience, often with irreversible consequences for flesh-and-blood beings.
  *   **The Burden of Truth:** Good's theorem focuses on *expected* value. The tragedy shows that for truths of this magnitude, the *variance* is infinite – the potential downside is absolute ruin, outweighing any conceivable upside. It questions whether rational agents *should* seek certain kinds of truth, even if the *expected* value appears non-negative under narrow assumptions.

  ### Conclusion for Your Seminar

  *   **Oedipus is not a counterexample to Good's theorem; he is an illustration of its boundary conditions.** The play dramatizes the violation of its core assumptions: costless ignorability is impossible, preferences are shattered by the information, the information causally triggers the outcome, and the oracle's pronouncements transcend probabilistic evidence.
  *   **The tragedy illuminates the existential dimension of information value,** particularly concerning identity and fate, which formal decision theory struggles to capture. It shows that when information defines *who you are*, its "value" can be negative in a way that annihilates the prior self and its utility function.
  *   **Key Seminar Takeaway:** Pairing them reveals that Good's theorem is a powerful tool *within its domain* (instrumental decision-making under uncertainty with stable preferences and costless ignorability). However, *Oedipus Rex* forces us to confront the limits of that domain when faced with truths that are identity-constituting, existentially shattering, causally potent, and impossible to ignore due to character or duty. The tragedy adds the irreducibly human dimensions of suffering, fate, and the unbearable weight of self-knowledge that pure decision theory abstracts away. The value of information *can* be negative, not because the theorem is wrong, but because the human condition sometimes operates outside the theorem's foundational assumptions.
