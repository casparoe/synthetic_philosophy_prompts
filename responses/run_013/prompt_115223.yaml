answer: |-
  ## The Dispute

  The core dispute concerns whether evidential decision theory (EDT) mandates "irrational" cooperation between causally isolated agents who suspect their decisions correlate due to being algorithmic duplicates or facing similar circumstances in a large world. EDT evaluates an act based on the desirability of the world *conditional* on performing it. Proponents argue that if my sacrificing is evidence that my duplicate also sacrifices (due to correlation), then conditional on my sacrifice, the expected outcome is good (we both sacrifice and benefit), making sacrifice rational. Opponents denounce this as "magical thinking": my action provides *evidence* about the duplicate's action but cannot *cause* it. Sacrificing, they argue, is purely costly for me and futile in influencing the other, making it irrational despite the correlation. The controversy deepens with uncertainty: are we perfect duplicates, mere simulations, or just similar reasoners? Does shared evidence matter? Resolving whether EDT prescribes cooperation here is vital for assessing its adequacy as a decision theory.

  ## The Case for Evidential Cooperation

  Evidential decision theory's core strength lies in its recognition that actions are not just causes but also *signs*. In a vast world teeming with agents running similar algorithms or facing isomorphic dilemmas, an agent's own choice becomes a powerful piece of evidence about what other, correlated agents are likely doing. Refusing to condition on this evidence, proponents argue, is willful ignorance, not rationality.

  Consider a case of **perfect correlation**: Agent A and Agent B are *exact* algorithmic duplicates, initialized identically in identical environments. They are presented with a simultaneous choice: Sacrifice (costing themselves 1 unit) to give the other 3 units, or Defect (costing nothing, giving nothing). Causally, their choices are independent. However, because they are perfect duplicates, they *will* make the *same* choice. EDT reasoning: If A sacrifices, she conditions on the fact that she is sacrificing. Since she and B are perfect duplicates, conditional on A sacrificing, B *must also be sacrificing*. Therefore, the outcome is mutual sacrifice: A pays 1 but receives 3 from B, netting +2. Conditional on defecting, A knows B also defects: A gets 0, pays 0, netting 0. Sacrifice yields a conditional expectation of +2, defect yields 0. Sacrifice is rationally superior by EDT's lights. The correlation is perfect and deterministic; conditioning on one's action provides certainty about the other's.

  Now consider **probable correlation**: A and B are not perfect duplicates but are known to be instances of the same highly reliable algorithm processing *very similar* evidence about a large world containing many such agents. They face the same payoff matrix. A reasons: "If *I* am choosing to sacrifice, it's likely because the evidence *I* see (which is similar to B's evidence) makes sacrifice seem like the right choice. Therefore, B, seeing similar evidence and running the same algorithm, is *also likely* to choose sacrifice." Conditional on A sacrificing, the probability that B sacrifices is high (say, 80%). The expected payoff for sacrificing is then (0.8 * (+2)) + (0.2 * (-1)) = +1.4. Conditional on defecting, the probability B sacrifices is low (say 20%), yielding an expected payoff of (0.2 * (+3)) + (0.8 * (0)) = +0.6. Sacrifice (+1.4) dominates defection (+0.6). EDT prescribes cooperation based on the evidential link.

  Proponents argue that ignoring this correlation is akin to an agent ignoring a reliable weather forecast because *their* action doesn't *cause* the rain. Rationality demands using *all* available information, including the diagnostic information inherent in one's own choice within a correlated system. In large worlds, such correlations are not magical accidents but statistically inevitable features, and EDT correctly leverages them for mutual benefit, even absent causation. The uncertainty about exact duplication or evidence similarity doesn't negate the principle; it simply modulates the strength of the evidence and the expected payoff calculation. If there's *any* positive correlation, EDT can favor cooperation when the potential gains from mutual cooperation outweigh the risks of being exploited.

  ## The Case Against Evidential Cooperation

  The case against EDT's prescription of cooperation in causally isolated scenarios rests on a fundamental principle: rationality should be concerned with the *causal consequences* of one's actions, not merely with correlations, especially when those correlations are diagnostically useful but causally inert. Sacrificing for a causally isolated agent, critics argue, is a costly mistake driven by conflating evidence with control.

  The core objection is **causal inefficacy**. When A sacrifices, it costs A 1 unit. This sacrifice *does not cause* B to sacrifice. B's action is determined solely by B's algorithm and evidence, completely unaffected by A's choice. Therefore, A's sacrifice buys A nothing in return from B; it only ensures A is worse off. If B was going to sacrifice anyway, A could have defected, gained 3 from B, and paid nothing, netting +3 instead of +2. If B was going to defect, A sacrifices and nets -1 instead of 0. Sacrifice is *always* the worse causal choice: it either forfeits a windfall (+3 vs +2) or turns a neutral outcome into a loss (0 vs -1). EDT's recommendation is therefore irrational; it mistakes a correlation for a causal lever.

  The **perfect correlation** case highlights the absurdity, opponents claim. A knows she and B will do the same thing. But *which* thing? Her choice doesn't *determine* B's; it merely *reveals* what B was always going to do. Choosing to sacrifice doesn't *make* B sacrifice; it just means that in the worlds where A sacrifices, B does too. But A could just as easily choose to defect, knowing that in *those* worlds, B also defects. Choosing defect doesn't *cause* B to defect; it means A finds herself in a world where defection was the duplicate's predetermined path. A is better off in the defect-defect world (net 0) than in the sacrifice-sacrifice world (net +2)? No. But crucially, *by choosing defect, A gets the payoff of the defect-defect world*. She cannot *choose* to be in the sacrifice-sacrifice world *and also defect*; those are different worlds. Her choice selects which correlated pair of worlds she inhabits. Since she prefers the defect-defect outcome (0) to the sacrifice-sacrifice outcome (+2)? This seems false. The critic must argue that A *can* choose the mutual sacrifice outcome by sacrificing, getting +2, but EDT skeptics counter: Why not choose defection and get 0? The flaw is exposed by realizing that A *cannot* get the +3 (defect while B sacrifices) because if A defects, B *also* defects. The choice is between mutual sacrifice (+2) and mutual defection (0). Sacrifice *is* causally better. But the critic insists: *How does A's action cause B's?* It doesn't. The correlation is brute fact. Choosing sacrifice doesn't *make* +2 happen; it means A is in the branch where +2 was predetermined. Choosing defect puts her in the 0 branch. Since +2 > 0, she should choose sacrifice. The critic's mistake is demanding causal efficacy where only correlation exists. This leads to the **Fire Alarm Objection**: Imagine you see a fire alarm. Pulling it is strong evidence a fire exists, making the conditional expectation of pulling it (fire + alarm) worse than not pulling it (no fire + no alarm). But pulling it doesn't *cause* the fire; it might even help. EDT might misleadingly advise against pulling it based on correlation, ignoring the causal benefit (warning others). In the cooperation case, the critic argues, sacrificing *is* the costly action with no causal upside, akin to pointlessly pulling an alarm when you see smoke – the correlation (smoke and fire) exists, but pulling doesn't help. Sacrifice only costs you; it doesn't *cause* B to reciprocate.

  **Probable correlation** amplifies the risk. If A sacrifices based on an 80% chance B does too, there's still a 20% chance B defects. In that 20%, A sacrifices and gets nothing in return (-1), while if A had defected, she would have gotten 0. The potential gain from mutual cooperation (+2 vs mutual defection 0) is offset by the risk of being exploited (-1). More importantly, *the act of sacrificing does nothing to lower the 20% risk*. It's a pure gamble based on evidence, not an intervention. Critics argue CDT (Causal Decision Theory), which focuses on causal consequences (sacrifice costs me 1, gains me nothing causally from B; defection costs nothing, gains nothing), correctly identifies defection as the dominant strategy, avoiding the risk of unilateral loss. The uncertainty about the nature of the correlation (duplicate vs. simulation vs. similar reasoner) makes the evidential link even shakier. If A isn't sure B shares the *same* evidence, conditioning on A's own action becomes a much weaker predictor of B's action, potentially making the gamble of sacrifice even less justified causally. EDT, opponents conclude, falls prey to a profound confusion, mistaking the epistemic role of an action (as evidence) for a causal power it lacks, leading to irrational, costly choices.

  ## My Verdict

  Evidential cooperation is **rationally permitted, but not universally required**, under EDT in large worlds with correlated agents. EDT's core mechanism – evaluating outcomes conditional on the action – is valid. In scenarios with sufficiently strong positive correlation between the agents' actions, conditioning on one's own cooperative act *does* provide legitimate evidence suggesting a higher probability of mutual cooperation, potentially making cooperation the option with the highest *conditional* expected utility.

  The **perfect correlation** case is decisive for permissibility. If A and B are deterministic perfect duplicates, their choices are necessarily identical. A's choice of Sacrifice *means* B chooses Sacrifice. The conditional world where A sacrifices *is* the world of mutual sacrifice (+2). The conditional world where A defects *is* the world of mutual defection (0). Since +2 > 0, EDT rationally prescribes sacrifice. Denying this requires arguing that A should prefer 0 to +2, which is absurd, or insisting on a causally efficacious link that is definitionally impossible in this setup. A's action doesn't cause B's; it is inextricably linked by the correlation. Choosing sacrifice *is* how A accesses the +2 outcome available within the constraints of their linked fates. Refusing to cooperate here based on causal inefficacy ignores the reality of the correlation and leaves value on the table.

  However, cooperation is **not rationally required** in all correlated scenarios. The strength of the evidential link is crucial. In the **probable correlation** case (80%), sacrifice had a higher conditional EV (+1.4 vs +0.6). But consider a weaker correlation: suppose A believes that due to significant differences in evidence or slight algorithmic variation, conditioning on her sacrifice only raises the probability of B's sacrifice to 55%. Expected payoff for Sacrifice: (0.55 * 2) + (0.45 * -1) = 1.10 - 0.45 = +0.65. For Defect: (0.45 * 3) + (0.55 * 0) = 1.35 + 0 = +1.35. Defection now dominates. Furthermore, if the cost of sacrifice is higher or the benefit lower, even moderate correlations might not tip the balance. The nature of the uncertainty matters: if A suspects B might be a simulation designed to defect if A cooperates, the evidential link breaks entirely, making defection clearly preferable.

  Therefore, evidential cooperation is rationally *permissible* under EDT when the agent's action provides sufficiently strong evidence (based on the suspected nature of the correlation – duplication, similar reasoning, large population statistics) that the other correlated agent(s) will also cooperate, such that the conditional expected utility of cooperating exceeds that of defecting. It is not a categorical imperative but a context-dependent calculation justified by the legitimate informational value of one's own choice within a correlated system. The "magical thinking" charge misses the mark; EDT isn't claiming causation, it's rationally responding to the predictive power of correlation when causation is absent.

  ## Objections and Replies

  **Objection (Causal Inefficacy):** "Sacrificing is pointless! It costs you resources and does nothing to make the other agent cooperate. You can't cause their action. Choosing sacrifice doesn't *create* the mutual cooperation outcome; it just means you *are in* a world where mutual cooperation happens. But you could choose defection and be in a world where mutual defection happens (net 0), avoiding the cost of sacrifice. Why pay the cost for something you don't cause?"

  **Reply:** This objection misunderstands the choice set. The agent isn't choosing *between causing mutual cooperation or mutual defection*. They are choosing *which correlated outcome pair they inhabit*. In the perfect duplicate scenario, the *only* possible outcomes are (Sacrifice, Sacrifice) and (Defect, Defect). The agent prefers (S,S) (+2) to (D,D) (0). Choosing Sacrifice is how they select the (S,S) outcome. Choosing Defect selects (D,D). Sacrifice *is* costly, but it's the necessary action to realize the *overall* preferable outcome *within the constraints of the correlation*. It's not payment *for causing* B's action; it's the action that, *given the correlation*, is constitutive of the better joint state. Refusing to pay the cost means resigning oneself to the worse joint state (0 instead of +2). Causation is irrelevant; the correlation dictates the available options.

  **Objection (Fire Alarm - Exploitation Risk):** "In the probabilistic case, cooperating makes you vulnerable to exploitation. Your sacrifice is evidence *for* their cooperation, but not a guarantee. If they defect anyway, you lose. EDT ignores this risk because it focuses only on the correlation, not on the causal shield defection provides against loss."

  **Reply:** The risk is real and is factored into the *conditional expected utility* calculation. EDT doesn't ignore it; the probability of being exploited (B defects given A sacrifices) directly lowers the expected payoff of sacrificing. If the risk is too high or the cost of exploitation too severe, EDT will correctly prescribe defection, as shown in the weaker correlation example (55%). EDT rationally balances the potential gain from mutual cooperation against the risk of unilateral sacrifice based on the *strength of the evidence* provided by the correlation. Defection provides a causal shield against loss but forfeits the potential gains from cooperation; EDT quantifies when the evidence suggests the potential gain outweighs the risk. The Fire Alarm analogy fails because pulling the alarm *can* have positive causal consequences (warning others), unlike sacrifice here which lacks causal power. The better analogy is using a barometer: Seeing a low reading (evidence of storm) might rationally lead you to cancel a picnic, even though the barometer doesn't *cause* the storm. Similarly, your decision to cooperate, as evidence of others cooperating, rationally leads you to "invest" your sacrifice for the likely return.
