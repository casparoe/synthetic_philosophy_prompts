  I recall concepts like the "No-Lose Test" or "Heads I Win, Tails You Lose" fallacy. That fits because the evidence is interpreted to always support the desired conclusion. Also, "shifting baseline of evidence" where the standard changes based on the subject. 

  But maybe "Criterion Elasticity" is more precise. It's when the criteria for a trait (like pain) stretch or shrink depending on the entity being judged. The user might need a term that captures how the same feature is used inconsistently. 

  Also, the problem of other minds is related but broader. The user is focused on which minds we acknowledge, not just whether others have minds. So it's about selective skepticism based on preconceptions. 

  The user probably wants a way to avoid this bias. They might be looking for a principled approach to evidence. I should suggest coherence across cases and separating necessary vs. sufficient conditions. Emphasize that absence of evidence isn't evidence of absence, and vice versa. 

  They're not writing a paper, so no jargon or reading lists. Keep it practical. Explain how this differs from circular reasoning—it's not just assuming the conclusion but changing the rules to fit it. 

  Also, note that the user is American English, so use terms familiar there. Avoid academic references. Focus on clear examples like fish vs. plants, cortex in mammals vs. birds. 

  Underlying needs: The user might want validation that this inconsistency is a recognized problem. They might also seek tools to critically assess arguments about animal consciousness. They’re annoyed by the lack of rigor and want a framework to evaluate claims without bias. 

