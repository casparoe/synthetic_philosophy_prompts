answer: |-
  ## Project Proposal: Reconstructing Anscombe’s "As a Means" Clause: A Plan-Relative Analysis for Just War Theory

  **Project Title:** Means, Plans, and Moral Prohibition: A Plan-Relative Interpretation of Anscombe’s Anti-Utilitarian Principle in Warfare  
  **Principal Investigator:** [Your Name], PhD Candidate, Department of Philosophy  
  **Duration:** [Summer Start/End Dates]  
  **Funding Requested:** [Amount, if applicable]  

  ### 1. Research Question and Project Aims
  G.E.M. Anscombe’s assertion that “choosing to kill the innocent as a means to your ends is always murder” (1957) is a cornerstone of contemporary non-consequentialist critiques of warfare. Yet, the precise meaning and grounding of the critical phrase “as a means” remains undertheorized. Standard interpretations implicitly rely on the Doctrine of Double Effect (DDE), equating “means” with “intended” effects and contrasting them with merely “foreseen” side effects. This project challenges that conflation and asks:  
  **Can Anscombe’s absolute prohibition on killing the innocent *as a means* be coherently operationalized *without* presupposing the DDE framework, specifically by interpreting "as a means" *plan-relatively*?**  

  The project aims to:  
  (A) Develop a rigorous, plan-relative criterion for what constitutes a killing "as a means," grounded in Anscombe’s own philosophy of action.  
  (B) Test whether this criterion:  
      (i) Robustly condemns Truman’s authorization of the atomic bombing of Hiroshima (Anscombe’s paradigmatic case).  
      (ii) Generates stable, intuitively plausible distinctions across classic bombing scenarios (e.g., terror bombing vs. strategic bombing) without collapsing back into the intended/foreseen distinction.  
  (C) Evaluate the criterion’s extensional adequacy: Does it condemn what Anscombe condemns *and* permit what Anscombe (or a plausible Anscombean) would permit?  

  ### 2. Scholarly Context and Gap
  Anscombe’s principle is ubiquitously cited but rarely dissected beyond its reliance on the DDE. Key positions leave the core question unanswered:  
  *   **DDE-Dependent Readings:** Most just-war theorists (e.g., Walzer, McMahan) treat "means" as synonymous with "intended," inheriting DDE's contested mental-state focus and proportionality balancing. This obscures whether Anscombe’s core insight *requires* this machinery.  
  *   **Causal Role Accounts:** Some (e.g., Quinn, Boyle) analyze "means" in causal terms, but often struggle to distinguish necessary causal conditions from intended means without appealing back to intention.  
  *   **Anscombe’s Action Theory:** While Anscombe’s *Intention* provides rich resources for understanding action descriptions and means-end structures, its implications for *this specific moral principle in warfare* remain unexplored.  

  **The Gap:** There exists no systematic attempt to interpret the "as a means" clause *independently* of the DDE, using Anscombe’s broader action-theoretic framework. This project fills that gap by proposing and testing a **plan-relative** interpretation.  

  ### 3. Methodology and Work Plan
  The project employs conceptual analysis grounded in action theory and applied to concrete cases:  

  *   **Month 1: Constructing the Plan-Relative Criterion**  
      *   Analyze Anscombe’s *Intention* to derive the concept of a "plan" as the practical syllogism guiding action.  
      *   Define "as a means" plan-relatively: A killing counts *as a means* if and only if it is a *constitutive step* within the agent's actual plan of action – such that removing that step would render the plan incoherent or incapable of achieving its stated goal *under that description*. Contrast with killings that are foreseeable outcomes occurring *alongside* the plan’s execution.  
      *   Refine the criterion against simple, non-lethal cases to establish baseline plausibility.  

  *   **Month 2: Application to Core Bombing Cases & Extensional Testing**  
      *   Apply the criterion to three scenarios:  
          1.  **Terror Bombing:** Killing civilians *is* the plan's mechanism for breaking morale. (Predicted Verdict: *Means*).  
          2.  **Strategic Bombing:** Destroying a factory is the plan's goal; civilian deaths are foreseen but not a step in destroying the factory. (Predicted Verdict: *Not Means*).  
          3.  **Hiroshima (Ambiguous):** Test two competing plan descriptions:  
              *   *Plan A (City as Target):* "Destroy Hiroshima city center to eliminate war industry/capacity." (Predicted Verdict: *Not Means*? - contingent on exact plan structure).  
              *   *Plan B (Shock as Means):* "Use the unprecedented devastation and civilian deaths *as the mechanism* to shock Japan into surrender." (Predicted Verdict: *Means*).  
      *   Rigorously evaluate whether the criterion:  
          *   Delivers Anscombe’s condemnation of Truman (likely requiring Plan B).  
          *   Clearly distinguishes Terror from Strategic bombing.  
          *   Can adjudicate between competing descriptions of Hiroshima *based on evidence of the actual plan executed*.  
      *   **Stress-Testing:** Does the criterion overextend? E.g., condemn a *tactical bomber* whose plan necessitates flying low over civilians (making their death a constitutive risk/step)? If so, this reveals a potential limitation demanding refinement or concession.  

  *   **Month 3: Evaluation, Implications, and Chapter Framing**  
      *   Assess success criteria: Does the plan-relative criterion *replace* or merely *replicate* the intended/foreseen distinction? Does it provide independent grounds for Anscombe’s verdicts?  
      *   Analyze *why* results succeed or fail: Is the power in the criterion itself, or in how we describe the cases?  
      *   Outline the implications: Does this strengthen Anscombe’s principle by grounding it more firmly in action theory, or expose hidden dependencies?  
      *   Draft the core argument of the intended dissertation chapter, identifying remaining questions for future work.  

  ### 4. Expected Outcomes and Success/Failure Conditions
  *   **Successful Outcome:** A viable, DDE-independent, plan-relative interpretation of "as a means" is developed. It successfully:  
      *   Condemns Truman's action under the "shock" description of Hiroshima.  
      *   Distinguishes Terror from Strategic bombing on non-intentionalist grounds.  
      *   Demonstrates greater precision/clarity than mental-state-focused accounts in ambiguous cases.  
      *   Integrates Anscombe’s moral principle with her action theory.  
      *   **Deliverable:** A polished chapter draft establishing and defending this interpretation.  
  *   **Failure Conditions:** The project fails if:  
      *   The plan-relative criterion demonstrably *collapses* into the intended/foreseen distinction upon application (e.g., "constitutive step" just means "intended").  
      *   It cannot condemn Truman without presupposing DDE elements or adopting a question-begging description of Hiroshima.  
      *   It yields clearly counter-intuitive or excessively restrictive verdicts (e.g., condemning standard tactical operations) that cannot be plausibly reconciled with Anscombe’s framework.  
      *   **Failure Deliverable:** A rigorous negative result paper demonstrating *why* a DDE-independent, plan-relative reading is untenable for Anscombe’s principle, clarifying the necessary role of intention or proportionality.  

  ### 5. Scope and Feasibility
  This project is explicitly scoped as foundational work for *one core chapter* of the dissertation, focusing narrowly on reconstructing and testing Anscombe’s "as a means" clause. It does not:  
  *   Develop a comprehensive alternative to DDE.  
  *   Solve the broader problem of collateral damage justification.  
  *   Engage deeply with competing contemporary moral frameworks (e.g., revisionist just war theory).  

  The three-month summer timeframe is realistic:  
  *   The conceptual groundwork (Month 1) builds directly on Anscombe’s *Intention* and clear case construction.  
  *   The case analysis (Month 2) focuses on well-defined, classic examples central to just-war debates.  
  *   Evaluation and drafting (Month 3) synthesizes the prior work into a coherent argument.  

  The feasibility stems from the project’s tightly defined question, reliance on core philosophical methods (conceptual analysis, case-based reasoning), and focus on a manageable corpus (Anscombe’s relevant writings). Success provides a significant, publishable building block for the dissertation; failure provides equally valuable meta-philosophical insight.

  **Conclusion:** This project addresses a critical lacuna in understanding a foundational principle of non-consequentialist ethics. By rigorously interrogating Anscombe’s “as a means” clause through a plan-relative lens rooted in her action theory, it promises to clarify the conceptual underpinnings of absolute prohibitions in warfare and strengthen the philosophical foundation of just-war reasoning. The focused scope and clear methodology ensure a productive and conclusive summer project.
