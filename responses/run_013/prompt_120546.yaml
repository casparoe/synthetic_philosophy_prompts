  I vow to you what I will do.  
  Only your word can set me free.  
  I absolve myself from what is due.  
  This bond is yours, exclusively.  

  Only your word can set me free.  
  I declare my duty null and void.  
  This bond is yours, exclusively.  
  My self-release remains destroyed.  

  I declare my duty null and void.  
  I pronounce my obligation gone.  
  My self-release remains destroyed.  
  The debt persists, though I withdraw.  

