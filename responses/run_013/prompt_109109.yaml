answer: |-
  ## Windowsill Theorem

  **I**  
  Each morning I declare this ledge one thing:  
  The quartz-veined grey indifference of a **stone**,  
  The tarnished brass of some forgotten **key**,  
  The ring-stained china curve of last night's **cup**,  
  The gutted wax where burned a stubborn **candle**,  
  The faded beach scene trapped within a **photo**,  
  The broken wing dust of a desiccated **moth**.

  **II**  
  To call it "sill" collects them, makes a **moth**  
  As real as ledge, one name for every **thing**.  
  The evidence? This captured sun in **photo**,  
  The weight that roots the world, this granite **stone**,  
  The stain that proves engagement with the **cup**,  
  The tool that might unlock a door: the **key**.  

  **III** (Austere)  
  But look again: no *whole* beneath the **key**,  
  No *sill* supporting dust from that dead **moth**.  
  Just particles arranged in cup-like **thing**,  
  And particles arranged in stone-like **thing**,  
  Arranged like wax that cooled around a **candle**,  
  Arranged like light on chemicals: a **photo**.  

  **IV** (Austere)  
  This image isn't *of* a beach, that **photo**,  
  Just pigments placed. No purpose holds the **key**  
  Beyond its shape. No story haunts the **candle**  
  Or justifies the brittle husk, the **moth**.  
  No unity binds granite flecks, the **stone**,  
  Or glaze to clay that makes this hollow **cup**.  

  **V** (Condition)  
  Unless... perhaps when purpose lifts the **cup**,  
  Or when my thumb disturbs the fading **photo**,  
  Or when I turn the lock with that old **key**,  
  Or scrub the stubborn lichen from the **stone**,  
  Or sweep the fragile evidence, the **moth**,  
  Or trim the blackened wick on last night's **candle**...

  **VI** (Condition & Doubt)  
  ...Then wiping, turning, scrubbing, clearing **candle**  
  Wax – *this task* might make the ledge one **cup**  
  Holding intention, catching time, that **moth**  
  Fixed in its arc. But why this act, this **photo**  
  Moved aside? Why not the inert **stone**  
  Or idle shape of brass, the passive **key**?  
  *Where does the task end, leaving just the key?*

  **Envoi**  
  This pattern, shifting like the dust on **photo**,  
  Stone, key, cup, candle, moth... do six words **cup**  
  One thing? Or just arrange? What do they **moth** compose?
