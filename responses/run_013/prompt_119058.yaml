prompt: |-
  My university's dining office just rolled out a menu scoring rubric and I got asked to sit on the commitee that reviews it, and the longer I stare at it the less I can tell what it actually believes. Every dish gets scored 0-100 on carbon, water, and land. Then there's a separate animal impact line: they count how many farmed animals go into a serving and multiply by a suffering weight the office made up themselves, beef 1.0, pork 0.9, chicken 0.2, farmed fish 0.1, insects 0. There's also a humane bonus of up to 10 points for pasture-raised and cage-free sourcing. So the beef burger gets wrecked on carbon but barely moves the animal impact needle, the chicken sandwich is the other way around, a lentil bowl scores a perfect 100 on animal impact even though harvesting lentils mows down alot of mice and rabbits and ground-nesting birds, and the cricket-flour protein bar is the office's pride and joy because crickets come out to zero. They're using these numbers to decide which suppliers get contracts. What bugs me is that we count the deaths we pay for and not the deaths we cause by harvesting, and those seem like the same kind of fact.

  So what is this thing committed to? I don't want a general intro to animal ethics, I want to know what the rubric itself is presupposing about moral status, about what a harm is, and about whose suffering counts as our responsibility. Tell me which parts it actually has to believe and which parts just happen to sit comfortably with several views at once, which rival theories it quietly rules out, and where it's genuinely underdetermined. And if you swapped the view it's running for a different one, what would visibly change in the scoring.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no conclusion, and make the fifth one about where your reading is most likely to be wrong and what would change your mind about it. American English please.
reasoning: |-
  Okay, the user is on a university dining committee reviewing a new menu scoring rubric. The rubric scores dishes on carbon, water, land, and animal impact. The animal impact part counts farmed animals used per serving, multiplied by a suffering weight (beef 1.0, pork 0.9, chicken 0.2, fish 0.1, insects 0), with humane bonuses. The user is bothered that wild animal deaths during harvesting aren't counted, while farmed animal impacts are.

  The user wants to understand the ethical presuppositions of this rubric. They specifically ask for five numbered points about: what moral status it assumes, what counts as harm, whose suffering is our responsibility, which parts are core beliefs versus compatible with multiple views, which theories it rules out, and what would change if the underlying view shifted. They also want a fifth point about potential weaknesses in this analysis.

  Breaking this down: First, the rubric clearly operates under an intentional harm framework - only deaths directly caused by human decisions (like raising livestock) count, not incidental ones (like field mice during harvest). This excludes consequentialist ethics that would count all outcomes. Second, it assumes moral status requires being farmed - wildlife deaths don't register, suggesting only animals under human control matter ethically. Third, responsibility is strictly causal - we're only accountable for harms we directly orchestrate, not collateral damage from our choices. 

  The suffering weights reveal a presupposed hierarchy where larger mammals matter more (beef=1.0, insects=0), likely based on sentience assumptions. The humane bonus shows they believe welfare improvements mitigate harm, but don't question the fundamental permissibility of using animals. 

  Compatibility-wise, the rubric could work with both deontological views (focusing on direct duties to farmed animals) and some welfarist approaches, but it outright excludes: (1) strict consequentialism that would count all deaths, (2) biocentric ethics valuing all life equally, and (3) abolitionist views rejecting any animal use regardless of welfare. 

  If swapped to a full consequentialist view, cricket bars would plummet in score due to field deaths during grain harvest for cricket feed. Pasture-raised beef might improve relatively since well-managed pastures can have lower rodent deaths than crop fields. The analysis could be wrong in assuming the rubric's architects consciously reject consequentialism - they might just lack methodology to measure harvest deaths. If they added even crude estimates of field mortality, it would invalidate this reading.
answer: |-
  Here are five points analyzing the ethical presuppositions of your university's dining rubric:

  1.  **It presupposes moral responsibility only for *intended* agricultural systems, not *incidental* harms.** The rubric counts deaths of animals purposefully raised and killed for food (farmed animals), but excludes animals accidentally killed during crop production (field mice, birds). This implies harm requires direct human *causation within a managed system*, not merely *foreseeable consequence* of land use.

  2.  **It assumes moral status hinges on being part of a *farmed commodity chain*.** Suffering counts only if the animal is explicitly categorized as livestock or farmed fish. Wild animals harmed by harvesting machinery or habitat conversion for crops (like lentils) are excluded, suggesting their moral status is secondary or irrelevant to the food's impact.

  3.  **It equates harm reduction solely with *reducing demand for farmed animals*, not total suffering minimization.** The suffering weights and bonuses focus entirely on lowering the number of vertebrate livestock units consumed and improving their welfare pre-slaughter. This ignores whether substituting plants or insects actually increases net suffering via more land-intensive harvesting deaths, prioritizing visible supply chain responsibility over overall consequence.

  4.  **The rubric quietly rules out strict consequentialism and strong biocentrism.** By excluding harvest deaths, it rejects ethical views holding that *all suffering caused by our choices* matters equally, regardless of intent or species (consequentialism). It also rejects views granting significant moral weight to all sentient animals or living beings harmed in food production (strong biocentrism/ecocentrism). It *is* compatible with welfarism (improving farm conditions) and some rights-based views focused on direct exploitation.

  5.  **My reading could be wrong if the "animal impact" metric is purely a supply chain accounting tool, not an ethical statement.** If the rubric *only* aims to measure direct agricultural inputs the university pays for (livestock), not make moral claims about all impacts, then its exclusions are pragmatic, not philosophical. Adding even a crude estimate of field deaths per calorie would fundamentally change this interpretation and the scores.
