answer: |-
  Here’s a rigorous specification of desiderata for a theory of moral responsibility that genuinely **engages with moral luck** (without evasion), grounded in your cases, distinctions, and constraints. I’ll distill the non-negotiable requirements, flag intuitive tensions, and identify the key constraint that eliminates most candidates.

  ---

  ### **Core Desiderata: What a Theory MUST Deliver**
  1. **Outcome-Sensitivity Without Outcome-Dependence**  
     - **Case:** Two surgeons perform identical negligent actions (e.g., failing to sterilize a tool). One patient dies (Catastrophe), the other has no ill effects (Near-Miss).  
     - **Requirement:** The theory must explain why we *feel* and *institutionally assign* greater blame for the catastrophe, **without** claiming this is *morally justified*. It must distinguish *actual blameworthiness* (which should be identical) from *social/legal consequences* (which may reasonably vary with harm).  
     - **Non-Negotiable:** Rejecting outcome-sensitivity as irrational ("just a bug") fails our practices. But collapsing blameworthiness into outcomes violates control.

  2. **Detection-Neutrality**  
     - **Case:** Ten employees commit identical fraud. One is audited and fired (Audit-Luck); nine escape scrutiny.  
     - **Requirement:** Blameworthiness must be identical for all ten. The theory must explain why *discovery* affects sanctions (practical necessity) but not *desert*.  
     - **Non-Negotiable:** Any theory making blame contingent on being caught is unjust.

  3. **Description-Invariance**  
     - **Case:** A driver runs a red light. Physically identical scenarios framed as "reckless driving" (blameworthy) vs. "unavoidable accident" (excused).  
     - **Requirement:** Blameworthiness must depend **only** on mental states, knowledge, and controllable actions — **not** on how we *label* the act.  
     - **Non-Negotiable:** Redescription resilience is essential for objectivity.

  ---

  ### **Critical Distinctions the Theory MUST Preserve**
  4. **Responsibility vs. Blameworthiness**  
     - *Responsibility*: Causally involved in an outcome (e.g., a toddler flipping a car's ignition).  
     - *Blameworthiness*: Requires capacity for rational agency + faulty decision-making.  
     - **Collapse = Failure:** If the theory blames the toddler, it’s invalid.

  5. **Excuse vs. Exemption**  
     - *Excuse*: The act was wrong, but blame is mitigated (e.g., reasonable mistake).  
     - *Exemption*: The agent lacks moral capacity (e.g., psychosis).  
     - **Collapse = Failure:** Conflating ignorance (excuse) with insanity (exemption) destroys fairness.

  6. **Bad Decision vs. Bad Outcome**  
     - **Case:** A doctor chooses a risky but statistically optimal treatment; patient dies. The *decision* was sound; the *outcome* was bad.  
     - **Requirement:** Blameworthiness must track decision quality, not outcome luck.  
     - **Non-Negotiable:** Outcomes beyond control cannot affect *desert*.

  ---

  ### **Constraints the Theory CANNOT Violate**
  7. **Epistemic Access Constraint**  
     - "Cannot be blameworthy for what you couldn’t have known."  
     - **Case:** A factory uses a chemical later proven toxic. If toxicity was undiscoverable with existing science, managers aren’t blameworthy for harm.  
     - **Non-Negotiable:** Ought implies *can* know.

  8. **Phenomenological Constraint**  
     - "We blame worse outcomes more, even knowing it’s luck."  
     - **Requirement:** The theory must *acknowledge* this psychological/legal reality while explaining why it isn’t *grounds* for blameworthiness.  
     - **Tension:** This is descriptive, not normative — but ignoring it makes the theory impractical.

  ---

  ### **Which Are Genuine Requirements vs. Intuitions?**
  | **Desideratum**          | Status                     | Reason                                                                 |
  |--------------------------|----------------------------|------------------------------------------------------------------------|
  | Outcome-Sensitivity      | **Descriptive constraint** | Not a *moral* requirement but a fact of human psychology/institutions. |
  | Detection-Neutrality     | **Core requirement**       | Justice demands identical blame for identical actions.                 |
  | Description-Invariance   | **Core requirement**       | Avoids moral arbitrariness.                                            |
  | Responsibility/Blame Distinction | **Conceptual necessity** | Preserves agency conditions.                                  |
  | Excuse/Exemption         | **Conceptual necessity**   | Vital for nuanced moral/legal responses.                               |
  | Decision/Outcome Distinction | **Core requirement**     | Moral luck’s central challenge.                                        |
  | Epistemic Constraint     | **Non-negotiable**         | Foundational to all moral theory.                                      |
  | Phenomenological Constraint | **Practical reality**    | Not a moral truth, but theories ignoring it are inert.                 |

  ---

  ### **Tensions and Impossibilities**
  - **The Unresolvable Tension:** Decision-tracking (blameworthiness *must* ignore outcomes) vs. Outcome-tracking (consequences *must* reflect harm) **cannot be fully reconciled**. Our practices demand both:  
    - *Culpability* is decision-sensitive (e.g., criminal intent).  
    - *Consequences* are outcome-sensitive (e.g., civil damages).  
    **→ Solution:** A theory must **separate blameworthiness from institutional responses**. Blameworthiness is luck-free; sanctions/reparations may reasonably consider harm.

  - **The Killer Constraint:** The **Epistemic Access Requirement** rules out most theories. If you couldn’t have known the risk, you aren’t blameworthy — full stop. This sinks strict liability and outcome-maximizing approaches.

  ---

  ### **Key for Institutional Design (Hospitals/Companies)**
  1. **Blameworthiness (Luck-Free):**  
     - Assign based *only* on:  
       - What the agent knew/could reasonably know.  
       - The quality of their reasoning/choices (e.g., ignored protocols? underestimated risks?).  
     - *Example:* Two surgeons identically negligent → identical culpability, regardless of patient outcome.

  2. **Consequences (Outcome-Sensitive):**  
     - Sanctions/reparations can scale with harm, **provided this is framed as policy, not desert**.  
     - *Example:* The surgeon whose patient died pays higher damages — not because *they* are more blameworthy, but because society allocates costs by harm.

  3. **Systemic Safeguards:**  
     - **Audit-luck:** Audit *systems*, not individuals. Punish the act-type, not detection.  
     - **Redescription:** Fix blame criteria to objective factors (e.g., "violated procedure X" vs. "reckless").  
     - **Epistemic limits:** "Couldn’t have known" → no blame. Invest in knowledge-sharing systems.

  ---

  ### **Bottom Line**
  A theory "deals with" moral luck if it:  
  - **Acknowledges** outcome-sensitivity in practice,  
  - **Isolates** blameworthiness from luck,  
  - **Justifies** outcome-sensitive consequences *separately* (e.g., distributive fairness),  
  - **Hardwires** epistemic constraints.  

  The irreconcilable tension is real: you *must* split blame (agent-focused) from consequences (society-focused). For institutions, this means:  
  > **Culpability is luck-insensitive. Costs are luck-sensitive.**  
  > — And never confuse the two.
