  First, I need to unpack the phrase "the monarch reigns but does not rule." The key distinction here is between "reign" and "rule." Reign might refer to the ceremonial or symbolic role, while rule implies actual governance. But the exact meaning can vary based on constitutional contexts. The user wants a menu of interpretations, not just one explanation. They also want to know which jurisdictions each interpretation applies to and how confident I am in each verdict.

