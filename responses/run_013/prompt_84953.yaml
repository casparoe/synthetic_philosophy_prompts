  The two workshop comments need to be addressed. The first comment claims that refusing assent is a non-question because monarchs don't rule. This assumes that ruling includes any exercise of power, even reserve powers. But in the UK, the monarch technically has the power to refuse assent, though by convention they don't. So this interpretation might be an overstatement. The second comment says the monarchy is epiphenomenal, meaning it has no real effect. That's a stronger claim and likely false in places where reserve powers exist, even if unused. In Japan, it might be more accurate.

