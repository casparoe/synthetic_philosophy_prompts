prompt: |-
  I host a monthly interview podcast on practical rationality; the audience is mostly graduate students and interested non-specialists. My next guest is a philosopher who has spent a decade arguing that satisficing is not merely a description of how resource-limited agents happen to decide, but the correct normative account of practical rationality — correct for ideal agents as much as for us. I want the interview to be substantive rather than promotional, so I need help preparing it.

  Act as a philosopher working in decision theory and the theory of practical reason, with a good ear for where a position is genuinely vulnerable. Before drafting anything, take time to reconstruct the view below in your own words, identify where it is strongest and where the real pressure points lie, and only then write the questions. Work through this carefully; the quality of the interview depends on getting the reconstruction right. If you conclude that the view as I have stated it is internally unstable, say so briefly before the questions — I would rather know in advance.

  The view, as my guest states it:

  - An action is rational just in case its outcome clears a threshold of adequacy that is relative to the agent. No comparison with better available outcomes is required, and the absence of such a comparison is not a defect.
  - The threshold is fixed by the agent's aspiration level, which is inherited from her history, habits, and social setting. She may revise it, but the revision is not itself a matter of optimization. Aspiration levels are given to deliberation rather than chosen by it.
  - The account is not a fallback for agents with limited time or computational power. It is claimed to be correct even for an agent who could compute the value of every option before her.
  - Because it demands only adequacy, it is claimed to dissolve the demandingness objection to consequentialism and the problem of having to trade off incommensurable goods.

  Now draft eight to eleven interview questions. Each should be a genuine probe that turns on the content of the position, not an invitation to restate it. At a minimum, cover: the arbitrariness and possible regress of thresholds; whether satisficing collapses into constrained maximizing once the threshold is treated as a constraint; the self-prediction problem (an agent who knows her own threshold and search procedure seems able to choose how hard to look); whether the view can make sense of ex post regret and the thought that one could have done better; the leveling-down or slacker objection, and whether the theory can condemn anything at all; whether setting a threshold presupposes the very comparability the view was meant to avoid; whether aspiration levels themselves can be criticized as reasonable or unreasonable; and whether the position is a normative theory of reasons or a description of well-adapted heuristics, dressed up. Close with a question about what would count as evidence or argument against the view.

  For each question, add a short follow-up keyed to the answer the guest is most likely to give, and a one-line bracketed note to me naming what the question is doing — for instance, presses the regress, tests the self-prediction worry, forces a choice between criterion and procedure. Keep the language speakable aloud. No questions about how he came to the topic, and no requests for reading lists or for names of people he is responding to: assume neither I nor the listeners have read the literature.
reasoning: |-
  Okay, the user hosts a podcast on practical rationality and is preparing for an interview with a philosopher who champions satisficing as the correct normative account, not just a heuristic for limited agents. The user wants substantive questions that probe the view's vulnerabilities. 

  First, I need to understand the guest's position deeply. The core claims are: rationality is about clearing an agent-relative adequacy threshold, thresholds come from aspiration levels shaped by history/habits/society without optimization, and this applies even to ideal agents. It's supposed to solve demandingness and incommensurability problems.

  Hmm... the view feels unstable from the start. If thresholds are "given" but revisable without optimization, what stops that revision process from being arbitrary or regressive? And if an ideal agent could compute everything but still satisfice, why wouldn't they just maximize? The guest might dodge by saying "because adequacy is sufficient" – but that just pushes to why adequacy should be sufficient normatively.

  *flipping through mental notes* Biggest tensions:
  - **Threshold arbitrariness**: If aspirations are inherited, can't they be dysfunctional? The guest says we can revise them non-optimally, but that seems like hand-waving – how is that revision rational? 
  - **Collapse risk**: If I set "don't starve" as a threshold when choosing dinner, isn't that just maximizing with a constraint? The guest denies this, but the burden is on them to show why satisficing isn't just maximizing under aspiration-level constraints.
  - **Self-prediction paradox**: A rational agent who knows her threshold could deliberately undersearch to avoid finding superior options. That feels like cheating, but the theory might allow it? That would undercut the "correct normative account" claim.
  - **Regret problem**: If I clear threshold by eating stale crackers when caviar is available, saying "that was rational" seems to drain regret of normative force. The guest might say regret is irrational here, but that clashes with how humans experience value.

  *scribbling on whiteboard* Also worried about:
  - **Leveling-down**: Could I lower my threshold preemptively to make bad options "adequate"? Seems permitted but absurd.
  - **Incommensurability dodge**: If thresholds are composites of incommensurable values, setting one still requires comparing them – begging the question.
  - **Meta-critique**: Calling aspirations "inherited" makes this sound descriptive, but they're selling it as normative. Which is it?

  User definitely needs questions pressing these cracks. Should avoid letting guest restate the view – every question must force a choice or reveal instability. 

  *structuring Qs* Start with threshold origins to expose arbitrariness, then collapse risk to test if it's covert maximizing. Self-prediction next because it's a killer – if guest says "just set higher aspirations," that admits thresholds govern effort. Regret/leveling questions show counterintuitive implications. Incommensurability probes whether threshold-setting smuggles in comparisons. Finally, the "theory status" question traps them: if aspirations are just psychological, how is this normative?

  *polishing* Follow-ups need to anticipate dodges. E.g., if they say "aspirations are shaped by reason," ask how without optimization. If they deny self-prediction is cheating, ask if deliberately staying ignorant is rational. 

  User will appreciate warnings about instability upfront – saves them from dead-end questions. Closing with "what falsifies?" is perfect: if guest can't answer, reveals the theory is unfalsifiable dogma.
answer: |-
  Here is a systematic reconstruction of the view, identification of its core strengths and vulnerabilities, and a set of interview questions designed to probe its foundations. The view exhibits internal tensions that require careful navigation by your guest.

  ### Reconstruction & Critical Assessment
  **Core Claim:** Satisficing is normatively fundamental. Rationality requires only selecting an outcome that meets a contextually adequate threshold (fixed by non-optimized aspiration levels), not comparing options to find the best. This holds even for ideal agents and purportedly solves demandingness/incommensurability problems.

  **Strengths:**
  1. **Psychological realism:** Aligns with how humans actually make decisions under complexity or value pluralism.
  2. **Demandingness:** Effectively counters "ought implies can" objections to maximizing consequentialism by decoupling rationality from exhaustive optimization.
  3. **Incommensurability:** Avoids needing a complete ranking when values clash (e.g., career vs. family), by requiring only "good enough" across dimensions.

  **Pressure Points & Instabilities:**
  1. **Threshold Arbitrariness:** If aspirations are "inherited" and revised non-optimally, what prevents them from being arbitrary or pathological? Revision without optimization risks regress (what rationally governs revision?).
  2. **Collapse into Maximizing:** If the threshold is treated as a *fixed constraint*, satisficing becomes maximizing *subject to that constraint*. The guest must show thresholds aren’t just hidden maximizing parameters.
  3. **Self-Prediction Problem:** An agent who knows her threshold and search algorithm could manipulate search depth to avoid finding superior options (e.g., stopping early to "satisfice" with a worse outcome). This seems rationally permissible but deeply counterintuitive.
  4. **Normative Impotence:** If *any* adequate outcome is rational, the theory cannot condemn "leveling down" (choosing worse options as long as threshold is met) or distinguish between "barely adequate" and "superb" outcomes. It struggles to explain regret or the intuition that we "could have done better."
  5. **Incommensurability Dodge:** Setting a single adequacy threshold for multiple incommensurable goods (e.g., "good enough career AND family life") *presupposes* a prior composite evaluation the view claims to avoid.
  6. **Status Ambiguity:** Aspiration levels are "given," yet the theory is normative. Can aspirations themselves be irrational? If not, the view risks being descriptive psychology masquerading as normativity.

  **Conclusion:** The view is **internally unstable** at the junction of its normative aspirations and the "givenness" of thresholds. Without a rational standard for setting/revising aspirations, it cannot fully escape arbitrariness or the collapse/impotence problems. Its strength in handling demandingness/incommensurability may come at the cost of normative force.

  ---

  ### Interview Questions
  **1. Threshold Origins & Rationality**  
  "Your view says aspiration levels are 'inherited' and revised non-optimally. If I inherit a dangerously low aspiration—say, 'any job that pays $1/hour is adequate'—and revise it without optimizing, what prevents my threshold from being arbitrary or irrational? Isn't this revision process itself subject to rational evaluation?"  
  *[Follow-up if they appeal to "reasonableness":]* "But if 'reasonableness' in revision isn’t itself optimizing, what *is* its rational basis? Doesn’t this invite a regress?"  
  *[Tests: Threshold arbitrariness and revision regress]*

  **2. Collapse into Constrained Maximizing**  
  "Suppose I satisfice by choosing any job meeting my threshold: '≥$100k, remote work, uses my skills.' Isn’t this functionally identical to *maximizing* subject to these three constraints? If so, how is satisficing normatively distinct?"  
  *[Follow-up if they deny equivalence]:* "If the constraints aren’t part of maximization, what makes them *rational* constraints if not that they define what counts as best-in-this-context?"  
  *[Tests: Collapse into maximizing]*

  **3. Self-Prediction & Effort Manipulation**  
  "Imagine an ideal agent who knows her threshold ('any apartment under $2k/month') and her search algorithm. She finds a $1.9k apartment immediately but could easily find a $1.5k one. Could she rationally stop searching, knowing she’s settling for worse? If so, doesn’t this permit—even encourage—deliberate under-effort?"  
  *[Follow-up if they say yes]:* "Doesn’t this imply rational agents *should* avoid information to make subpar options satisfice? How is that defensible normatively?"  
  *[Tests: Self-prediction problem, effort manipulation]*

  **4. Ex Post Regret & "Could Have Done Better"**  
  "When I satisfice with a barely adequate outcome and later discover a far superior option was available, I feel rational regret. But your view says my choice *was* rational. Does this mean such regret is always irrational? Or does it suggest satisficing fails to capture something normatively significant?"  
  *[Follow-up if they dismiss regret]:* "If 'I could have done better' is normatively inert once adequacy is met, how does your theory condemn complacency in contexts like career or ethics?"  
  *[Tests: Normative impotence, leveling-down]*

  **5. Leveling-Down and the "Slacker Objection"**  
  "Could I rationally lower my aspiration *mid-deliberation*—say, from 'a healthy meal' to 'any calories'—to make junk food satisfice? If not, why not, given that aspirations are revisable non-optimally? If so, how can satisficing condemn grossly suboptimal choices?"  
  *[Follow-up if they appeal to stability]:* "If stable aspirations prevent leveling-down, what *rational* principle forbids revising them opportunistically?"  
  *[Tests: Leveling-down, normative impotence]*

  **6. Incommensurability & Threshold-Setting**  
  "You claim satisficing avoids comparing incommensurable values. But setting a threshold like 'a meaningful career AND adequate family time' seems to require synthesizing those values into a single adequacy standard. Doesn’t this presuppose the very comparability the view aims to bypass?"  
  *[Follow-up if they deny synthesis]:* "If no synthesis occurs, how do I know an option clears the threshold *overall* without implicitly weighing trade-offs?"  
  *[Tests: Incommensurability dodge, comparability presupposition]*

  **7. Criticizing Aspirations**  
  "Can an aspiration level itself be unreasonable? For example, is 'marry a Nobel laureate or remain single' an irrational threshold for dating? If no, how is this normative? If yes, by what non-optimizing standard?"  
  *[Follow-up if they appeal to norms]:* "If social norms or habits ground rational criticism, doesn’t that make satisficing contingent on local practices rather than universally valid?"  
  *[Tests: Normative status, cultural relativism]*

  **8. Theory Status: Normative or Descriptive?**  
  "Is satisficing rationality a *fundamental normative principle* (like 'ought implies can'), or a *psychological heuristic* that’s adaptive for bounded agents? If normative, why would ideal agents use it? If heuristic, how can it resolve normative puzzles like demandingness?"  
  *[Follow-up if normative]:* "If ideal agents *could* optimize but *should* satisfice, what *reason* do they have to ignore superior options?"  
  *[Tests: Core normative commitment vs. descriptive heuristic]*

  **9. Falsifiability & Counterevidence**  
  "Finally, what evidence or argument would make you abandon this view? For instance: A proof that all satisficing can be redescribed as maximizing? Or widespread intuitions that regret over missed superiors *is* rational? Or the inability to formally specify thresholds without smuggling in comparisons?"  
  *[Follow-up on their answer]:* "If no such evidence exists, is the theory unfalsifiable—and thus more dogma than philosophy?"  
  *[Tests: Empirical/argumentative vulnerability, commitment strength]*

  ---

  These questions force engagement with the view’s deepest tensions while remaining accessible. The follow-ups anticipate common responses and push toward concessions or clarifications that expose the underlying stakes. Good luck with the interview!
