  For the extension problem: if she excludes nematodes, what principled distinction does she draw between insects and simpler organisms? This risks arbitrariness. And for concrete practices, the wild insect welfare point is clever—it flips the script by suggesting reducing numbers might be beneficial if lives are net negative. 

  I should structure questions that: 
