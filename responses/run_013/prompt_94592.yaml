  # Joint Statement on Expected Utility Maximization and Rationality

  ## 1. Agreed Claims

  Both Position A and Position B agree on the following:

  1. **Representation Theorems**: There exist mathematical theorems (e.g., von Neumann-Morgenstern, Savage) that show that if an agent's preferences over a set of options satisfy certain axioms (including completeness, transitivity, independence, and continuity), then there exists a utility function (unique up to affine transformations) and a probability measure such that the agent's preferences can be represented as maximizing expected utility.

  2. **Money-Pump and Dutch-Book Arguments**: An agent whose preferences violate transitivity or other axioms (like independence) can be induced to accept a sequence of trades that leaves them worse off by their own lights (a money-pump) or a set of bets that guarantees a loss (a Dutch book). This is a mathematical fact.

  3. **Exploitability**: Violations of the axioms make an agent vulnerable to exploitation in the sense that there exists a sequence of transactions that the agent would accept (at the time of each transaction) and that leads to a net loss.

  4. **Rationality and Coherence**: Both sides agree that rationality requires some form of coherence in preferences. However, they disagree on whether the specific axioms (like completeness) are required for coherence and on the normative force of avoiding exploitability.

  5. **Scope of the Theorems**: The representation theorems are conditional: they state that if the axioms hold, then an expected utility representation exists. The theorems do not, by themselves, establish that the axioms are rationally required.

  6. **The Step from "Can" to "Must"**: The move from the descriptive fact (that an agent satisfying the axioms can be represented as an EU maximizer) to the normative claim (that an agent must satisfy the axioms to be rational) is not a direct implication of the theorems. This step requires additional argumentation.

  7. **The Money-Pump as a Practical Threat**: The money-pump argument demonstrates a practical vulnerability that an agent with intransitive preferences (for example) would face in a world where they are offered trades sequentially. However, both sides agree that if an agent is aware of this vulnerability and can precommit to refusing some trades, they might avoid the loss. The argument does not assume that the agent is naive (i.e., it does not assume that the agent would accept the trades even when aware of the pump). Instead, it shows that without precommitment, the agent is vulnerable.

  ## 2. Disagreements

  The core disagreements are:

  1. **Normative Force**:
     - **Position A**: The money-pump and Dutch-book arguments, combined with the representation theorems, demonstrate that violating the axioms is irrational because it leads to avoidable losses and because the representation shows that the agent's preferences are inconsistent. The vulnerability to exploitation is a symptom of irrationality, and the theorems provide a normative standard: rational agents must have preferences that are representable as maximizing expected utility.
     - **Position B**: The arguments show only that agents who violate the axioms are vulnerable to exploitation if they do not take precautions (like precommitment). This vulnerability is a practical (prudential) concern, not necessarily a failure of rationality. Rationality might allow for incompleteness or other violations if the agent has good reasons (e.g., moral or epistemic) that override the prudential concern. The theorems are descriptive and do not establish that the axioms are normative.

  2. **Completeness**:
     - **Position A**: Rationality requires that an agent have a complete preference ordering. Incomparability between options is a failure of rationality because it leaves the agent without a basis for choice and can lead to indecision and vulnerability (e.g., in a modified money-pump). The representation requires completeness, so a rational agent must satisfy it.
     - **Position B**: Completeness is an unrealistic idealization. Rational agents may sometimes have genuinely incomparable options (e.g., when values are incommensurable). In such cases, the agent is not irrational but faces a difficult decision. The money-pump for incompleteness requires additional assumptions (e.g., that the agent will choose arbitrarily when indifferent) that may not hold.

  3. **Nature of the Argument**:
     - **Position A**: The money-pump argument is both prudential and epistemic. It reveals an inconsistency in the agent's preferences that leads to self-defeating behavior. Thus, it is a requirement of rationality to avoid such inconsistency, independent of the threat of exploitation.
     - **Position B**: The argument is purely prudential: it warns that you might lose resources. However, a rational requirement must be grounded in more than just avoiding losses. Without a further argument that the loss is a symptom of an underlying inconsistency (which the representation theorems only show for agents who already satisfy the axioms), the argument does not establish a rational requirement.

  4. **Synchronic vs. Diachronic Coherence**:
     - **Position A**: The representation theorems establish that an agent with coherent preferences at a single time (synchronic coherence) must maximize expected utility. Moreover, the money-pump arguments show that synchronic violations lead to diachronic problems (over time). Thus, the requirement is both synchronic and diachronic.
     - **Position B**: The representation theorems only establish synchronic coherence. They do not address how preferences should change over time or with new information. The money-pump arguments do show a diachronic vulnerability, but this can be avoided by sophisticated agents who precommit. Hence, the theorems do not establish a diachronic rational requirement.

  5. **Unbounded Utility and Divergence**:
     - **Position A**: The framework of expected utility maximization is robust and can be extended to handle unbounded utility and divergent expectations by careful technical refinements. The core rationality requirement remains.
     - **Position B**: When utility is unbounded or expectations diverge, the standard representation theorems break down. This shows that expected utility maximization is not universally applicable and that rationality might require different rules in such cases.

  ## 3. Cruxes

  We now list the key cruxes (points of disagreement) that, if resolved, would move at least one side. For each crux, we state:
  - The crux question.
  - A shared test: an argument or scenario that both sides agree would be informative.
  - The prediction of Position A (the defender) for the outcome of the test.
  - The prediction of Position B (the skeptic) for the outcome of the test.

  | Crux | Shared Test | Prediction of Position A | Prediction of Position B |
  |------|-------------|--------------------------|--------------------------|
  | **1. Sophisticated Agents and Commitment**<br>Can an agent with preferences that violate the axioms (e.g., intransitivity) avoid being money-pumped by precommitting to refuse certain trades? | Consider an agent with intransitive preferences (A>B, B>C, C>A) who is aware of the money-pump sequence (A->B, B->C, C->A, leading to a net loss). The agent has the ability to commit in advance to refusing any trade that would lead to a net loss. Will this agent be exploited? | **A**: The agent can avoid the immediate loss by precommitment, but the underlying irrationality remains. The agent's preferences are inconsistent, and this will manifest in other ways (e.g., in one-off choices without the possibility of commitment, or in the agent's inability to form a consistent plan). Precommitment is a patch, not a cure. | **B**: The agent can avoid exploitation by precommitment. The vulnerability is only a practical problem that can be solved by rational planning. Therefore, the money-pump does not demonstrate irrationality. |
  | **2. Completeness as a Requirement**<br>Is it irrational to have incomplete preferences? | Consider an agent who has incomplete preferences between two options (e.g., a career as a musician vs. a career as a doctor) because the agent finds the values incommensurable. The agent is offered a series of trades that, if the agent behaves in a way that fills in the gaps arbitrarily, leads to a money-pump. If the agent refuses to make such arbitrary choices and instead only chooses when there is a clear preference, does this agent avoid the money-pump? | **A**: The agent will face situations where a choice is unavoidable. In such cases, the agent must choose arbitrarily, and this opens the door to a money-pump. Therefore, incompleteness leads to vulnerability and is irrational. | **B**: The agent can avoid the money-pump by only choosing when there is a clear preference and by having a policy (e.g., flipping a coin) that does not introduce intransitivity. Incomparability is not irrational and does not necessarily lead to exploitation. |
  | **3. Prudential vs. Epistemic Rationality**<br>Is the money-pump argument showing an inconsistency (epistemic) or merely a threat of loss (prudential)? | Suppose we have an agent with intransitive preferences who never faces a money-pump sequence (e.g., because the agent lives in a world where such sequences are never offered). Is there still a rational flaw? | **A**: Yes, because the inconsistency in preferences is a flaw even if not exploited. The representation theorems show that the agent's preferences are not representable by a utility function, which is a failure of coherence. | **B**: No. The only flaw demonstrated by the money-pump is the threat of loss. Without such a threat, there is no irrationality. The representation theorems are descriptive and do not establish a normative flaw. |
  | **4. Synchronic vs. Diachronic Coherence**<br>Do the representation theorems and money-pump arguments establish a requirement for diachronic coherence? | Consider an agent who satisfies the axioms at each point in time but changes preferences dynamically in a way that leads to a money-pump (e.g., temporary intransitivity due to a change of mood). The representation theorems apply at each moment. Does this agent violate a rational requirement? | **A**: Yes, because rationality requires not only synchronic coherence but also diachronic stability (unless the change is based on new information). The money-pump shows that the changing preferences lead to exploitation. | **B**: The representation theorems only require synchronic coherence. The diachronic problem is a separate issue, and the agent might avoid it by precommitment or by having a stable underlying utility function that is temporarily masked. The theorems do not establish a diachronic requirement. |
  | **5. Unbounded Utility and Divergence**<br>Does expected utility maximization remain a requirement of rationality when the utility function is unbounded and the expectation diverges? | Consider an agent facing a St. Petersburg-like gamble (with unbounded utility and infinite expected utility). Can we still require the agent to maximize expected utility? | **A**: We can extend the framework (e.g., by using a relative utility approach or by requiring finite expectations) to handle such cases. The core principle remains. | **B**: The breakdown in this case shows that expected utility maximization is not universally rational. Rational agents might use alternative decision rules (e.g., maximizing median utility) in such scenarios. |

  ## 4. Merely Verbal Disagreements

  After discussion, we identify one point that may be merely verbal:

  - **The meaning of "rationality"**: Position A often uses "rationality" to mean internal consistency of preferences, while Position B often reserves "rationality" for a broader concept that may include substantive reasons and practical wisdom. This difference in scope can lead to apparent disagreement when in fact they are talking about different things. However, both sides agree that internal consistency is desirable, but they disagree on whether it is a necessary condition for rationality (Position A) or merely one consideration among others (Position B). Thus, the disagreement is not purely verbal but about the necessary conditions.

  We have now provided a joint statement that both camps could sign, with the agreed claims, disagreements, and cruxes clearly laid out.
answer: |-
  ## Joint Statement on Coherence Arguments for Expected Utility Maximization

  ### 1. Agreed Claims  
  Both Position A and Position B endorse the following statements about the mathematical and empirical core of the debate:  

  1. **Representation Theorems**: If an agent’s preferences satisfy the axioms of completeness, transitivity, independence, and continuity over a well-structured set of prospects, then those preferences can be represented by a real-valued utility function and a probability measure, such that the agent acts *as if* maximizing expected utility. This is a mathematical fact.  
     
  2. **Money-Pump/Dutch-Book Exploitability**: An agent whose preferences violate transitivity, independence, or related axioms can be presented with a finite sequence of trades or bets that:  
     - They will accept individually at the moment of choice (given their preferences).  
     - Guarantee a net loss of resources (or dominated outcome) relative to their initial position.  
     This vulnerability is a direct consequence of the violations.  

  3. **Axioms as Sufficient Conditions**: The axioms are sufficient for the existence of an expected utility representation. The theorems do not, by themselves, establish that the axioms are necessary for rationality.  

  4. **Non-Exploitation via Sophistication**: If an agent anticipates a money-pump sequence and precommits to refusing all trades in it, they avoid exploitation. Precommitment is a feasible strategy for avoiding losses.  

  5. **Completeness as Representational**: The completeness axiom (requiring a defined preference or indifference between all pairs of options) is necessary for the expected utility representation. Without it, no such representation exists.  

  6. **Continuity and Independence as Critical**: Violations of independence (e.g., Allais paradox) or continuity create openings for money-pump arguments, independent of completeness violations.  

  7. **Unbounded Utility and Divergence**: When utilities are unbounded or expectations diverge, the standard representation theorems do not apply. Rationality in such cases requires separate treatment.  

  8. **Coherence as Minimal Standard**: Rationality requires agents to avoid blatant inconsistencies (e.g., cyclic preferences) that could lead to self-defeating behavior. Both sides agree that repeated exploitability is undesirable.  

  ### 2. Disagreements  
  The following points capture the substantive divergence, phrased neutrally and accepted by each side as faithful to their view:  

  1. **Normative Force of Exploitability**:  
     - **Position A**: Vulnerability to money-pumps reveals *irrationality*, as it demonstrates internal inconsistency in preferences that leads to self-defeat. Avoiding exploitation is a necessary condition for rationality.  
     - **Position B**: Vulnerability to money-pumps reveals *prudential risk*, not irrationality. An agent may rationally accept exploitability if it aligns with other values (e.g., moral commitments) or if mitigated by precommitment.  

  2. **Completeness as a Rational Requirement**:  
     - **Position A**: Incomparable options reflect an incomplete specification of preferences. Rationality demands resolution (e.g., via refinement or random choice) to ensure decisiveness.  
     - **Position B**: Genuine incomparability (e.g., between incommensurable values) is rationally permissible. Agents with incomplete preferences are not irrational but face ambiguous choices.  

  3. **Epistemic vs. Prudential Foundation**:  
     - **Position A**: Money-pumps reveal an *epistemic flaw*: preferences that license dominated sequences are objectively inconsistent, akin to logical contradictions.  
     - **Position B**: Money-pumps reveal a *pragmatic threat*: losing resources is undesirable, but not proof of incorrect preferences. Prudential concerns cannot ground universal rational obligations.  

  4. **Synchronic vs. Diachronic Coherence**:  
     - **Position A**: The theorems ensure *diachronic* rationality by revealing preferences that, even if held at a single time, lead to dynamic inconsistency when faced with sequential choices.  
     - **Position B**: The theorems only ensure *synchronic* rationality (consistency at a fixed time). Diachronic coherence requires additional assumptions (e.g., fixed preferences) not justified by the theorems.  

  5. **Scope of Expected Utility**:  
     - **Position A**: Expected utility maximization, with technical adjustments, remains the rational standard even for unbounded utilities or divergent expectations.  
     - **Position B**: Breakdowns in these cases show expected utility is not universally applicable; alternative rules (e.g., rank-dependent utility) may be rationally superior.  

  ### 3. Cruxes Table  
  The table below lists unresolved questions where resolution would change at least one position. Each crux includes a shared test/argument both sides accept as decisive, alongside opposing predictions.  

  | Crux | Shared Test/Argument | Prediction of Position A | Prediction of Position B |  
  |------|----------------------|--------------------------|--------------------------|  
  | **1. Sophisticated Commitment Nullifies Exploitability**<br>*Does precommitment resolve the irrationality of axiom violations?* | An agent with intransitive preferences (A>B, B>C, C>A) precommits to refusing trades that would complete a money-pump sequence. They face no other coherence challenges. Does this agent exhibit rational behavior? | **No.** Precommitment masks irrationality but doesn’t eliminate it. The agent still has inconsistent preferences, revealed in hypothetical choices or one-off decisions. | **Yes.** The agent avoids exploitation and makes decisions aligned with their values. No irrationality remains. |  
  | **2. Genuine Incomparability and Exploitability**<br>*Can incomparable preferences avoid money-pumps without arbitrariness?* | An agent with incomplete preferences (e.g., undecided between career X and Y due to incommensurable values) uses a rule like coin-flipping to resolve forced choices. Can they avoid money-pumps without introducing intransitivity? | **No.** Arbitrary resolution (e.g., coin-flips) creates artificial indifference cycles exploitable via money-pumps. Incomparability inevitably leads to inconsistency. | **Yes.** The agent can adopt consistent rules (e.g., "never trade an incomparable option for a comparable one") that block money-pumps without inducing intransitivity. |  
  | **3. Prudential Loss as Sufficient Ground for Rational Requirement**<br>*Must a rational agent avoid all prudential losses?* | Consider an agent who violates independence (per Allais) and is offered a money-pump but faces no resource scarcity (e.g., infinite wealth). Does this agent still violate a rational requirement? | **Yes.** The violation reveals an inconsistency in valuations, independent of losses. Rationality requires internal coherence, not just avoidance of harm. | **No.** Without risk of loss, no irrationality exists. The agent’s preferences may reflect context-dependent values, not incoherence. |  
  | **4. Necessity of Diachronic Consistency**<br>*Do the theorems enforce stable preferences across time?* | An agent satisfies all axioms synchronically but shifts preferences over time in response to irrelevant cues (e.g., framing), leading to a money-pump. Do the representation theorems condemn this? | **Yes.** The theorems assume stable preferences; diachronic shifts reveal that the synchronic representation is incomplete or false. | **No.** The theorems only describe preferences at a time. Diachronic coherence requires separate principles (e.g., reflection) not entailed by synchronic axioms. |  
  | **5. Robustness to Divergent Expectations**<br>*Can expected utility handle unbounded utility?* | An agent faces a St. Petersburg gamble with unbounded utility. Is there a unique rational choice mandated by expected utility? | **Yes.** Refinements (e.g., relative utility, bounded rationality) restore coherence. Expected utility remains the guiding principle. | **No.** The absence of a well-defined expectation proves expected utility is inadequate. Rational agents may use non-expectation rules (e.g., minimax). |  

  ### 4. Merely Verbal Disagreements  
  One point is primarily terminological:  
  - **"Rationality" as internal consistency vs. practical wisdom**: Position A uses "rationality" to mean *formal coherence in preferences*, while Position B often reserves "rationality" for *substantive soundness of judgment*. This causes cross-talk but is not substantive; both agree formal coherence is desirable, but dispute its necessity and sufficiency.  

  ---  
  This document, jointly authored, reflects the core agreements, disagreements, and testable cruxes. Signatories from both camps endorse this as a basis for productive engagement.  

  **Signed,**  
