  The speech should start with warmth and congratulations, then gradually introduce complexity through personal stories. Using the sister as an example shows both pride and concern. Concrete examples like noise complaints demonstrate how policing extends beyond violence intervention.

  I'll include a section specifically addressing the recruits' hard work and character to balance the critical elements. The badge-pinning moment requires particular care - it should acknowledge the weight of the symbol while leaving room for the ceremony's emotional impact.

  The conclusion needs to leave the philosophical question open while emphasizing personal accountability. Phrases like "the work is still becoming what it might be" acknowledge institutional flaws without dismissing the graduates' choice to serve.
