answer: |-
  ## The Unfinished Tower

  Consider this room with a single window facing east.
  Morning arrives here first, gilding the dust
  on the empty drafting table. Plans remain curled,
  potential paths sketched but not taken.

  Not taken paths branch like dry creek beds
  after a long drought. You trace one
  with your finger across the map’s worn linen,
  feeling the ridges where ink pooled.

  Where ink pooled, a darker stain suggests
  a doorway, or perhaps just a flaw in the weave.
  This ambiguity is the hinge, the necessary pivot
  on which possibility turns.

  Possibility turns the key in a lock unseen.
  Behind it, stairs ascend into shadow,
  built by an invisible architect whose signature
  is only absence, whose method is silence.

  Silence gathers in the room above,
  a room with a second window facing north.
  Cold light reveals bare plaster walls,
  a single chair facing the empty expanse.

  Empty expanse defines the western room,
  its vast floor echoing each footfall.
  A single tapestry hangs, depicting a labyrinth
  whose center is blank, perpetually unwoven.

  **(For the seminar participant)**

  This poem builds its partial order through the linking rule: each stanza begins with the final significant phrase(s) of the prior stanza (e.g., "a single window facing east." -> "Not taken paths..."; "paths sketched but not taken." -> "Not taken paths..."; "where ink pooled" -> "Where ink pooled..."; "the necessary pivot" -> "Possibility turns..."; "whose method is silence." -> "Silence gathers..."). We see a clear chain: Stanza 1 ("east.") -> Stanza 2 ("Not taken paths...") -> Stanza 3 ("Where ink pooled...") -> Stanza 4 ("Possibility turns...").

  The fork occurs at the end. Stanza 5 begins with the end of Stanza 4 ("Silence gathers...") and describes "the room above" (north). Stanza 6 begins with the end of Stanza 3 ("Empty expanse...") and describes "the western room". Neither Stanza 5 nor 6 begins with the other's ending ("unwoven." vs. "expanse."). Both are reached only from earlier stanzas: Stanza 5 from Stanza 4 (its direct predecessor), and Stanza 6 from Stanza 3 (via "Empty expanse..."). Nothing "stands above" them; they are incomparable maximal elements. The non-constructiveness ("invisible architect whose signature / is only absence") ensures the described rooms exist inherently by the poem's structure, but aren't "built" by the narrative. The fork presents two distinct, equally valid endings ("north" and "west") without a greatest room.
