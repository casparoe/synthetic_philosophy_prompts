answer: |-
  This is brilliantly observed, and your core question cuts to the heart of why housing is so hard to build in much of the US. You've nailed the disconnect. Here's a breakdown of the underlying theories and tensions, separating the defensible from the indefensible, and what "right to the city" might demand:

  **The Implicit Theory of Rights & Standing in the Current Machinery:**

  1.  **The "Quasi-Property Right in Externalities":** Yes, the system fundamentally assumes that existing property owners possess a bundle of rights *beyond* their property lines. It's not just ownership of dirt; it's an assumed right to:
      *   **Preserve Specific Amenities:** Light, views, quiet, parking availability, perceived safety.
      *   **Maintain the Status Quo of "Character":** Architectural style, scale, density, demographics (often unspoken but potent).
      *   **Control Negative Externalities:** The system hyper-focuses on potential negatives (traffic, shadows, noise) new development *might* bring to neighbors, while ignoring or minimizing the *positive* externalities (vibrancy, services, economic activity, housing supply) and the *negative* externalities of *preventing* development (sprawl, displacement, rising rents, carbon emissions).
      *   **This "bundle" is largely a "Veto Right":** While framed as participation, the *power* dynamics (design review nitpicking, CEQA delays, councilmember veto) effectively grant neighbors a veto over change impacting *their* experience, regardless of the broader need or the rights of others. It's a right *against* something new, not *for* something beneficial.

  2.  **Temporal Bias: Present Over Future:** The system explicitly prioritizes the concerns, votes, and voices of *current* residents. Future residents are non-persons in the legal and political process. This assumes:
      *   **Legitimacy through Presence:** Those physically present and invested (financially, emotionally) *now* have the primary legitimate stake.
      *   **Risk Aversion:** The known present (even with its problems) is less risky than the unknown future. Protecting current residents' perceived stability is paramount.
      *   **The "Sunk Cost" Fallacy:** Investment in the *current* neighborhood grants special rights to dictate its future form.

  3.  **The "Neighborhood as Fixed Entity" Fallacy:** This machinery often presupposes that a neighborhood has an essential, unchanging "character" defined primarily by its physical form (Victorians, single-family, low density) and current demographic makeup. Change is seen as loss or destruction, not evolution. This is philosophically incoherent:
      *   **Neighborhoods are Dynamic:** All neighborhoods change constantly – economically, demographically, architecturally. The Victorians replaced *something* else.
      *   **Character is Subjective:** "Character" is defined by the loudest voices, often conflating architectural style with exclusion.
      *   **Scale of Change is Arbitrary:** As you note, there's no objective point where "change" destroys "the neighborhood."

  **Can the Machinery Be Justified Without the Quasi-Property Claim? (Separating Need from Habit)**

  *   **Procedural/Deliberative Democracy Grounds (Potentially Defensible):**
      *   **Notice & Opportunity to Comment:** Ensuring affected parties know about proposed changes and can provide input is fundamental fairness. *Problem:* The definition of "affected" is wildly skewed towards immediate neighbors, and the process gives them disproportionate power.
      *   **Design Review (Limited):** If narrowly focused on ensuring *basic* compatibility with *objective* urban design principles (e.g., avoiding blank walls on sidewalks, ensuring pedestrian scale at street level, managing bulk/massing impacts on public spaces) *and* applied predictably via clear guidelines, it could prevent genuinely harmful design. *Problem:* It's usually subjective, focused on aesthetics favored by incumbents, and used as a delay/veto tactic.
      *   **Environmental Review (Reformed):** If scoped *proportionally* to the project's actual likely impacts (e.g., a 4-story apartment isn't a refinery) and focused on *mitigating* genuine, significant environmental harms (not just parking/traffic concerns of neighbors), it has a role. *Problem:* CEQA and its equivalents are routinely weaponized against housing for non-environmental reasons.
      *   **Community Input:** Gathering local knowledge about site-specific conditions, historical context (meaningful, not just stylistic), and community needs *can* improve projects. *Problem:* "Community" is usually defined as existing homeowners associations, not renters, commuters, or future residents.

  *   **The Indefensible Residue:**
      *   **Councilmember Veto (Zoning-by-Veto):** This is pure political power with no coherent democratic or procedural justification. It centralizes decision-making based on political calculus, not principle or policy.
      *   **Subjective Design Review:** Review based on personal aesthetic preferences ("window trim color," dislike of modern architecture) or vague "character" arguments unrelated to objective urban design goals.
      *   **Weaponized Environmental Review:** Using massive, expensive studies triggered by single neighbors to delay or kill housing projects based on pretextual concerns (traffic, shadows, "historical" gas stations).
      *   **Formal Standing Only for Opponents:** Neighborhood associations granted official status while renters, nearby workers, housing advocates, and future residents are excluded.
      *   **Variance Processes Requiring "Hardship":** Framing deviations from outdated zoning as a special favor granted only if the owner suffers unique hardship, rather than allowing reasonable adjustments to enable good development.

  **The "Right to the City" Payoff: What Would Have to Go?**

  Taking "everyone has a right to the city" seriously, *especially* future residents, requires dismantling the machinery built on the quasi-property veto right and temporal bias. Your planner's realization would likely center on:

  1.  **Eliminate Arbitrary Veto Points:**
      *   **Abolish Councilmember Discretionary Veto:** Revert to administrative approval for projects complying with clear, updated zoning and design codes. Council sets policy, doesn't adjudicate individual projects politically.
      *   **Neuter CEQA/Environmental Review for Housing:** Establish categorical exemptions for urban infill housing below a significant size threshold. Limit review to genuinely significant, unavoidable impacts with feasible mitigation. Shift the burden of proof for frivolous challenges.
      *   **Reform or Abolish Subjective Design Review:** Replace it with objective, form-based codes focused on outcomes for the *public realm* (street walls, active uses, sunlight on sidewalks) not private aesthetics. Remove aesthetic subjectivity entirely.

  2.  **Radically Reform Standing and Input:**
      *   **Sunset Formal Standing for Exclusive Neighborhood Associations:** They represent a narrow slice. Input should be open to *all* residents within a broader area, including renters.
      *   **Create Proxies for Future Residents (Cautiously):** This is the hardest part. Pure "representation of the unborn" is philosophically and practically fraught. Instead:
          *   **Elevate Regional/Housing Needs:** Mandate that decision-makers explicitly weigh the project's contribution to meeting quantified regional housing needs (established by state/fed agencies) against localized impacts. Give this need formal weight in decisions.
          *   **Empower Broader Advocates:** Grant formal standing in proceedings to non-profit housing advocates, tenant unions, and regional planning bodies whose *mission* is to represent the housing needs of the broader community, including those excluded from the market.
          *   **Shift the Burden:** Instead of developers proving no harm, require opponents challenging compliant projects to demonstrate a *significant, unavoidable, unmitigable harm* to a *public* interest (not just their private view or parking spot).
      *   **Focus Input on Public Goods:** Structure public hearings and comments around specific, predefined criteria related to public welfare (safety, infrastructure capacity, equitable access, environmental mitigation) – not amorphous "character" or personal preferences.

  3.  **Modernize the Underlying Codes:**
      *   **Legalize Housing:** Allow multi-family housing by-right in vast swathes of land currently zoned exclusively for single-family homes, especially near transit and services. This removes the need for constant variances and political fights.
      *   **Adopt Form-Based or Outcome-Based Codes:** Regulate the physical form and its interaction with the street/surroundings (height, setbacks, active frontages, permeability) rather than rigid use categories or density limits. Focus on creating good *public spaces*.

  **What Your Planner Might Conclude (Beyond Vibes):**

  *   **The Status Quo is Built on Exclusion:** The machinery she operates daily isn't primarily about good planning or democracy; it's a system optimized to protect incumbent homeowners' privileges and resist change, especially denser housing that might bring different people.
  *   **"Character" is Often a Smokescreen:** The defense of "neighborhood character" frequently masks resistance to economic or demographic change more than genuine architectural conservation.
  *   **The Real Emergency is the Process:** The declared "housing emergency" is directly caused by the very processes designed to "manage" development. The emergency isn't just lack of units; it's the dysfunctional system itself.
  *   **Procedural Fairness ≠ Just Outcomes:** Giving everyone "a say" in a system where only some have power leads to gridlock and inequity. Fairness requires rebalancing power towards the excluded.
  *   **The Defensible Core is Small:** Basic notice, objective design rules for the public realm, and genuinely proportional environmental review for large projects are perhaps the only salvageable pieces. The rest – the veto powers, the aesthetic nitpicking, the councilmember fiefdoms, the weaponized studies – are the rotten load-bearing walls holding up the exclusionary city.
  *   **"Right to the City" Demands Upzoning & By-Right Development:** The most concrete expression of a right to the city for future residents is simply *allowing more homes to be built* where people want and need to live, without subjecting each one to a gauntlet of vetoes. The radical but necessary shift is moving from a system of "Thou Shalt Not" to one of "Yes, If..." (meets clear, objective standards for the public good).

  **For Your Novel:** Your planner's crisis could stem from realizing her role isn't neutral facilitation, but operating exclusionary machinery. Her belief shift might be accepting that true procedural justice requires dismantling the power of incumbent neighbors to veto homes for others. The most powerful stance isn't abstract vibes, but a concrete, pragmatic understanding of which specific levers in the process are fundamentally unjust and need breaking. She might move from managing hearings to advocating for by-right zoning, CEQA reform, or abolishing discretionary design review – fighting the machine from within or deciding she has to leave to fight it effectively. The realization is that the "public process" she runs is often profoundly *undemocratic* when it silences the needs of the wider public and the future.
