answer: |-
  ### Joint Statement on Pragmatic Encroachment and Epistemic Contextualism  
  *Agreed Upon by Representatives of Both Views*  

  #### I. Agreed Claims  
  1.  **Rejection of Purism:** Both views reject epistemic purism. Purely truth-relevant factors (e.g., evidence strength, reliability, truth) are *insufficient* to fully determine whether a subject "knows" *p* in paradigmatic cases (e.g., DeRose’s Bank Cases, Stanley’s Airport Case).  
  2.  **Practical Factors Matter:** Practical features of an agent’s situation (stakes, salience of error, consequences of being wrong) systematically affect whether it is accurate to attribute knowledge.  
  3.  **Bank-Style Cases Establish Sensitivity:** Standard cases demonstrate that knowledge attributions/demands shift with practical context. They refute the purist claim that knowledge is *solely* a function of truth-conducive factors.  
  4.  **No "Fixed" Threshold:** The threshold of justification/confidence required for knowledge is not invariant across all contexts; it varies with practical circumstances.  
  5.  **Ordinary Language is Key:** Both views take intuitive judgments about knowledge attributions in concrete cases as primary data.  

  #### II. Key Disagreements (Stated Neutrally)  
  | Issue | Epistemic Contextualism | Pragmatic Encroachment |
  |-------|--------------------------|------------------------|
  | **Locus of Sensitivity** | The truth-conditions of the word "knows" shift with the *ascriber's* practical context. Knowledge itself is invariant, but what counts as "knowing" depends on the speaker's standards. | The knowledge *relation itself* is partly constituted by the *subject's* practical situation. What it is *for the subject to know p* depends on their stakes. |
  | **What Varies** | Semantic standards for "knows" (i.e., how much justification is required). | The metaphysical nature of knowledge (i.e., whether the subject is in the state of knowing). |
  | **Retrospective Ascriptions** | "She knew all along" is evaluated relative to the *current ascriber's* context, even if describing a past subject. | Past knowledge is fixed by the *subject's practical situation at the time*. An ascriber's current high stakes cannot retroactively negate it. |

  #### III. Crucial Test Cases & Predictions  
  **Case 1: Mountain Guide (Diverging Stakes)**  
  *Scenario:* A guide (**Subject**: high stakes—lives/livelihood) is 95% sure a snow bridge is safe but doesn’t cross. Later, a park ranger (**Ascriber**: low stakes, no involvement) reads her log and says, "She **knew** the bridge was fine; she just didn’t trust her judgment."  

  | View | Prediction | Why |
  |------|------------|-----|
  | **Contextualism** | The ranger’s statement is **true**. The *ascriber’s* low-stakes context sets a low threshold for "knows." The subject’s high stakes are irrelevant to the truth of *the ranger’s utterance*. | Truth-conditions are fixed by the ascriber’s context. |
  | **Encroachment** | The ranger’s statement is **false**. The *subject’s* high stakes meant she lacked knowledge (95% confidence was insufficient *for her*). The ascriber’s low stakes don’t change this. | Knowledge is a relation determined by the subject’s situation. |

  **Case 2: Mirror Image (Reversed Stakes)**  
  *Scenario:* A researcher (**Subject**: low stakes—studying snow bridges) is 95% sure a bridge is safe but doesn’t cross (no personal risk). A stranded hiker (**Ascriber**: high stakes—life/death) sees the researcher’s notes and says, "She **knew** it was safe! Why didn’t she tell me?!"  

  | View | Prediction | Why |
  |------|------------|-----|
  | **Contextualism** | The hiker’s statement is **false**. The *ascriber’s* high-stakes context sets a high threshold for "knows," which the subject’s 95% confidence doesn’t meet. | The word "knows" in the hiker’s mouth requires near-certainty. |
  | **Encroachment** | The hiker’s statement is **true**. The *subject’s* low stakes meant 95% confidence *was* sufficient for her to know. The ascriber’s high stakes don’t alter this fact. | Knowledge is fixed by the subject’s context. |

  **Survival of Disagreement:**  
  - **Yes.** The views yield **contradictory predictions** in both cases. They are **not notational variants**.  

  **Retrospective Ascription Case**  
  *Scenario:* After the snow bridge collapses, killing clients, the same ranger (now in high-stakes context, fearing liability) says: "She **didn’t know** it was safe all along."  

  | View | Prediction |
  |------|------------|
  | **Contextualism** | **True.** The ranger’s *current* high-stakes context governs the truth of her utterance. |
  | **Encroachment** | **False.** The guide’s knowledge at the time depended *only* on *her* stakes then. The ranger’s later stakes don’t change history. |

  **Ordinary Speaker Judgments:**  
  - **Contextualism predicts:** Speakers will align with the *ascriber’s* stakes in their judgments (e.g., side with the ranger in Case 1, the hiker in Case 2).  
  - **Encroachment predicts:** Speakers will align with the *subject’s* stakes (e.g., side against the ranger in Case 1, against the hiker in Case 2).  
  - **Settling Power?** Mixed judgments would challenge both; consistent alignment with *one* locus (ascriber/subject) would support that view. Current experimental data is inconclusive but slightly favors contextualism.  

  #### IV. The Verbal Disagreement  
  **Partly Verbal:** The core disagreement is **genuine** (as shown by conflicting predictions above), but **terminology** obscures this. Both agree practical factors affect whether we *call* someone a "knower" and that the *threshold* for knowledge shifts. The fight over whether this shift is "semantic" (contextualism) or "metaphysical" (encroachment) is **largely verbal** – it reflects differing meta-linguistic preferences about labeling the threshold change.  

  #### V. Our Commitment  
  **Conclusion:** Contextualism is better positioned. It cleanly handles retrospective cases without making knowledge retroactively vanish, aligns with the speaker-relativity evident in ordinary language ("knows" behaves like other context-sensitive terms), and avoids positing mysterious stakes-dependent metaphysical states. Encroachment’s strength – explaining why we *care* about knowledge in action – is preserved by contextualism via the tight link between "knows" and practical reasoning *in a context*.  

  **What Would Change Our Minds?**  
  - **Against Contextualism:** Evidence that ordinary speakers *systematically* fix the ascriber’s context (e.g., "In this story, the speaker is risk-averse...") yet judge "knows" based on the *subject’s* stakes.  
  - **Against Encroachment:** Cases where a subject’s knowledge is intuitively retained *despite* retrospectively increased stakes (e.g., "She knew pre-accident, even though we now see the stakes were life/death").  

  \answer{partly verbal: "semantic shift" vs. "metaphysical constitution" label; but genuine about locus (ascriber vs. subject)}
