  The core divergence is genuine: contextualism makes knowledge ascriber-relative, encroachment makes it subject-relative. But some aspects are verbal, like whether we call the threshold shift "semantic" or "metaphysical." 

  I think contextualism is more defensible—it avoids oddities like knowledge changing retroactively with stakes—but encroachment captures how seriously we take knowledge attributions in high-stakes decisions. The best evidence against contextualism would be clear cases where ordinary speakers fix the ascriber's context but still vary judgments based on the subject's stakes. 

