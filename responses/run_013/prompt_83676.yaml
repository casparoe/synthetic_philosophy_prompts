prompt: |-
  Ok so my reading group has been going at pragmatic encroachment vs epistemic contextualism for like three months and we've basically stopped making progress — every session ends with the contextualist saying that's just a fact about when we're willing to say someone "knows" and the encroachment person saying no, it's about knowledge itself, and then we all go home. I want the document we should of produced months ago: the joint statement that a committed epistemic contextualist and a committed pragmatic encroacher could both actually sign after a real adversarial collaboration. Not a dialogue, not a scorecard, a text both of them would put their names on.

  What I need in it:

  - The claims both sides can sign, including what they jointly say against the purist who thinks only truth-relevant factors bear on knowledge, and what the usual bank-style cases do and don't establish.
  - The points where they still split, each one worded so the side that holds it would accept the wording as its own position, not a strawman. Especially the locus question: is it the truth conditions of the sentence "knows" that shift with the ascriber's context, or is the knowledge state itself partly constituted by the subject's practical situation?
  - The cruxes: which sub-questions, if settled, would actually move at least one side. I care a lot about one of them, so hit it head on: is there any case where the two views give different verdicts at all, or are they notational variants? The usual cases have the person doing the ascribing and the person whose knowledge is at issue be the same person, which is exactly why I suspect they can't separate the views.
  - For each crux, a concrete case or argument both sides agree would bear on it, with each side's prediction written down in advance.

  Here's a case I made up, please use it (tweak it or add your own if it helps): a mountain guide is deciding whether to take clients across a snow bridge over a crevasse. Her livelihood and the clients' lives are riding on it, and she's maybe 95% sure the bridge is solid, no more. Back at the station a park ranger, with nothing at stake, reads her log and says "she knew the bridge was fine, she just didn't trust her read." Run that one, and run the mirror image where the person saying "knows" is the one with everything on the line and the subject has nothing riding on it. Then tell me what each camp predicts in each version and whether the disagreement survives once the wording is fixed.

  Two more things while you're at it. What about retrospective ascriptions — "she knew it all along," said after the accident, by someone now in a high-stakes context? Same predictions from both views or different? And if we ran these cases past ordinary speakers, what would each side predict they'd say, and would their answers settle anything?

  If part of this fight turns out to be merely verbal, say which part and why, and don't be diplomatic about it. And skip the both-sides-have-something dance at the end — commit. If you think one of these views is basically right, or that we should ditch both for something else, say so, give your reasons, and tell me what you'd count as evidence against your own pick.

  Format: numbered agreed-claims section first, then a disagreements table, then the cruxes with each side's prediction. The very last line should be exactly a machine-readable tag of your verbal/not-verbal call, like \answer{genuine} or \answer{partly verbal: <which bit>}.

  American English please.
