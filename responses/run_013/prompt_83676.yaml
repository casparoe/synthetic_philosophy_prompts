  The mountain guide case is perfect for testing divergence. In the first version (low-stakes ascriber, high-stakes subject), contextualism predicts "knows" is true because the ascriber's context dominates, while encroachment says the subject's high stakes prevent knowledge. The second version (high-stakes ascriber, low-stakes subject) flips this. If both views give different predictions here, they're not notational variants. 

