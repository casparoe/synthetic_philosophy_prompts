prompt: |-
  I teach a 50-minute intro philosophy session to about 18 undergrads, no science background assumed, and I want them to actually feel the force of the "what is life?" problem rather than hear a lecture about it. Here's the mechanic I have in mind — build it out, and swap it for something better if you've got one.

  Setup: a quarantine checkpoint. They're the sample review board for a Mars sample-return mission, working in groups of three. Each group gets a stack of specimen cards — a virus, a prion, a frozen mule embryo, a mitochondrion kept alive in culture, a self-replicating clay crystal, a lichen, a bacterial spore, a dormant tardigrade, a simulation of a metabolising cell, a synthetic protocell that reproduces but can't mutate — and I'll put all the relevant features on the cards so nobody has to look anything up. The board works from a pre-written charter with three bins, "living," "dormant," "inert," and a hard consequence attached: living gets preserved and protected, inert gets sterilised. I want the charter's criteria to be operational and jointly unsatisfiable in places — must maintain a proton gradient, must be capable of evolution by natural selection, must have a boundary membrane, must have a metabolism — so they have to apply them and walk straight into a case that meets two critera and violates the third, or whose bin changes if you freeze it.

  Then the ambush: about two-thirds of the way through I hand each group one extra card that their own written justification sorts somewhere they find absurd, and they have to either live with the verdict or rewrite the charter — and write down what they gave up to do it.

  I want from you: the full card list with features, including the deliberately contradictory cases; the charter text; the ambush card(s); a minute-by-minute plan for the 50; a debrief that maps the moments where they got stuck onto the real positions (necessary-and-sufficient definitions, cluster or family-resemblance accounts, disjunctive "metabolism or evolution" accounts, and the deflationary "life is whatever the definition is for" line) — but don't let the names surface until the debrief; the things that will predictably go wrong the first time I run it and how to fix them on the fly; and one honest paragraph on what this activity can't reproduce. My guess is it can stage the pull toward a sharp line and the cost of drawing it, but not the question of whether there's a fact of the matter about viruses.

  Keep the whole thing under 900 words.
reasoning: |-
  Hmm, the user wants me to design a 50-minute philosophy activity about defining life for undergraduate students with no science background. They've proposed a "quarantine checkpoint" scenario where students act as a review board for Martian samples, sorting specimens into "living," "dormant," or "inert" categories based on a problematic charter. I need to flesh this out completely while staying under 900 words.

  The user has outlined some specific components they want: a full card list with features, charter text, ambush cards, minute-by-minute plan, debrief mapping to philosophical positions, troubleshooting tips, and limitations. I'll need to create cards that deliberately challenge binary classifications - things like viruses, prions, tardigrades, and protocells that blur the line between living and non-living.

  For the charter, I'll create criteria that are jointly unsatisfiable - perhaps requiring metabolism, evolution capability, boundary membrane, and homeostasis. The ambush card should force an absurd classification - maybe a "frozen mule embryo" that technically meets criteria but feels wrong.

  The minute plan needs to be tight: introduction (5 min), group work (20 min), ambush card (5 min), group reconsideration (10 min), and debrief (10 min). For debrief, I'll connect their struggles to philosophical concepts like necessary/sufficient conditions and family resemblance, but avoid jargon until the end.

  Predictable problems might include groups finishing too fast/slow, getting stuck on science facts, or debating instead of deciding. Solutions could be spare cards, timers, and emphasizing that operational definitions override intuition.

  The key limitation is that this focuses on the "where to draw the line" question but can't fully address whether viruses are "truly" alive - that deeper metaphysical issue remains. I'll keep this honest in the limitations section.

  I'll make sure everything stays concise and engaging, using clear language that avoids overwhelming students. The goal is to make them experience the definitional dilemma firsthand, not just hear about it.
answer: |-
  Here's a full build-out of your "Quarantine Checkpoint" activity, optimized for 50 minutes and philosophical impact:

  **Card List (Features Only - No Jargon):**
  1.  **Influenza Virus:** Contains genetic instructions (RNA). Needs a host cell to make copies. No internal activity on its own. Tiny particle.
  2.  **Mad Cow Prion:** Misfolded protein. Causes other proteins to misfold. No genetic material. No internal activity. Very stable.
  3.  **Frozen Mule Embryo:** Horse/donkey hybrid cells. Stopped development (frozen). Contains DNA. Will resume growth if thawed in uterus. Complex structure.
  4.  **Isolated Mitochondrion:** Component from inside a cell. Uses oxygen to make energy (ATP). Has a membrane. Can't replicate alone. Needs external fuel/signals.
  5.  **Self-Replicating Clay Crystal:** Mineral structure. Grows by adding layers. Copies its structure imperfectly ("mutates"). No internal energy use. No membrane.
  6.  **Antarctic Lichen:** Fungus & algae partnership. Grows very slowly in cold/dark. Uses light to make food when possible. Reproduces spores. Complex structure.
  7.  **Bacterial Spore (Bacillus):** Dormant bacterium. Tough protective shell. No detectable metabolism. Contains DNA. Can reactivate with water/food. Survives extremes.
  8.  **Dried Tardigrade ("Water Bear"):** Microscopic animal. Dehydrated state. No metabolism. Contains DNA/structures. Can rehydrate and become active. Survives space.
  9.  **SimCell (Computer Simulation):** Digital model of a cell. Simulates metabolism, growth, division. Runs on a computer. No physical substance. Follows programmed rules.
  10. **Synthetic Protocell:** Artificial fatty bubble. Contains simple chemicals. "Reproduces" by splitting when large. Chemicals inside replicate simply. Cannot change ("mutate") its replication process.

  **Ambush Cards (One per group):**
  *   **The Comatose Human:** Brain-dead patient (no higher brain function). Stable vital signs (breathing, heartbeat) via machines. No consciousness. Contains human DNA. Will not recover. *Forces confrontation with potential for "metabolism without potential" and ethical weight.*
  *   **The Active Volcano:** Geological feature. Releases heat/energy. "Metabolizes" rock/water. Changes shape/grows. "Reproduces" via new vents/islands? No genetic material. No defined boundary. No evolution. *Highlights scaling issues and non-biological "metabolism".*
  *   **The Ancient Seed (2,000 yrs old):** Plant seed from archaeological site. No metabolism detected. Intact DNA/cellular structure. *Might* germinate with right conditions (unproven). *Emphasizes dormancy duration and "potential" vs. current state.*

  **Quarantine Charter Text:**
  >**Mars Sample Return Protocol 7A: Biological Hazard Assessment**
  >**Purpose:** To categorize specimens for planetary protection: prevent forward contamination (protecting Mars) and back contamination (protecting Earth). Apply *current operational state*.
  >
  >**Bins & Consequences:**
  >*   **LIVING:** Actively maintains internal organization. *Consequence: Preserve in maximum containment (Level 4).*
  >*   **DORMANT:** Not currently active, but retains potential to become active under known conditions. *Consequence: Preserve under controlled conditions (Level 3).*
  >*   **INERT:** Incapable of self-sustained activity or becoming active. *Consequence: Sterilize for safe study.*
  >
  >**Categorization Criteria (Must meet ALL for LIVING; Meets SOME for DORMANT):**
  >1.  **Metabolism:** Actively converts energy/resources to maintain itself/grow (e.g., maintains proton gradient, synthesizes molecules).
  >2.  **Evolutionary Potential:** Capable of heritable change over generations (mutation + selection).
  >3.  **Bounded System:** Maintains a distinct internal environment separated from surroundings (e.g., membrane).
  >4.  **Homeostasis:** Actively regulates internal conditions against external changes.

  **Minute-by-Minute Plan (50 min):**
  *   **0-5 min:** Intro & Setup. Set scene (Mars mission, board role). Distribute Charter. Form groups (6 groups of 3). Distribute initial card sets (ensure mix per group, e.g., Virus, Embryo, Clay Crystal, Lichen, Spore, Protocell).
  *   **5-25 min:** **Group Sorting Phase.** Groups apply Charter to their cards, sorting into bins, writing brief justifications (e.g., "Virus: INERT - No metabolism, needs host. Violates 1 & 4."). Circulate, probe reasoning ("Why is the spore dormant and not inert?").
  *   **25-30 min:** **The Ambush.** Hand each group one Ambush Card. "New priority specimen just arrived! Categorize it using your existing justifications and Charter."
  *   **30-40 min:** **Crisis & Revision.** Groups grapple with absurdity (e.g., Comatose Human = LIVING by metabolism/homeostasis? Volcano = LIVING?). Force choice: Accept verdict *or* propose ONE specific Charter change (e.g., "Remove Criterion 2") and state the cost (e.g., "Now the Protocell is Living"). Groups write down change & cost.
  *   **40-50 min:** **Debrief.** Groups report key struggles & changes. **Map to Philosophy (DO NOT USE TERMS YET):**
      *   "Had a case that met 3 criteria but failed 1 – felt wrong!" -> **Necessary & Sufficient Conditions problem.**
      *   "We kept arguing if 'potential' counts as 'active'" -> **Cluster Concept / Family Resemblance** (no single defining feature).
      *   "We had to drop evolution to make the Comatose Human not alive... but then the Protocell became alive!" -> **Disjunctive Definition cost** (choosing OR weakens the category).
      *   "The Charter is just rules, it doesn't tell us what life *really* is." -> **Deflationary/Pragmatic View** (definition serves a purpose).
      *   "Is the virus *really* inert, or just waiting?" -> **Acknowledge:** This activity forces a line-drawing *decision*, but doesn't resolve if there's a deep "fact of the matter" beyond our definitions. That's the lingering puzzle.

  **Predictable Problems & Fixes:**
  1.  **Groups finish initial sort too fast:** Have spare cards ready (e.g., Mitochondrion, Tardigrade). "New samples arrived!"
  2.  **Groups get bogged down in science:** Remind: "Use ONLY the features listed on the card and the Charter criteria. Don't overcomplicate."
  3.  **Groups debate definitions, not applying Charter:** Intervene: "Your job is to apply the *written Charter* as given. What bin does it force for *this* card based on *these* features?"
  4.  **Ambush card isn't controversial enough for a group:** Be ready to verbally add a twist ("The Comatose Human: Brain activity shows primitive reflexes only").
  5.  **Time crunch on Ambush phase:** Announce strict time limits ("You have 2 minutes to categorize the new sample using your rules").
  6.  **"It depends!" arguments:** Force a decision: "Based on its *current state* and the Charter *now*, you *must* bin it. What's the call?"

  **Honest Limitations Paragraph:**
  This activity brilliantly forces students to confront the practical impossibility of drawing a sharp, consistent boundary satisfying all intuitions and operational needs. It viscerally demonstrates the costs of different definitional strategies (necessary/sufficient vs. disjunctive vs. cluster) and the pragmatic nature of definitions. However, it primarily focuses on the *decision-making pressure* and *cost of categorization*. It can't fully replicate the deeper, more unsettling *metaphysical* question: "Is there a *fact of the matter* about whether a virus *is truly alive*, independent of our definitions or needs?" While the absurd verdicts hint at this, the activity's structure inherently frames life as a *category to be applied*, potentially obscuring the ontological weight behind the question "But what *is* it, really?". The virus debate's core tension – is it a dormant life-form or complex inert chemistry? – remains more profound than the activity's operational resolution allows.
