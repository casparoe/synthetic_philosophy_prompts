  ### Counterfactual Villanelle

  I pay the hundred for the other's gain  
  The coin is tossed, a future split in two.  
  I gain ten thousand from the other's pain.  

  In tails, I'm asked: my doubts I must arraign—  
  This branch alone demands its due from you.  
  I pay the hundred for the other's gain.  

  In heads, the vaults of fortune I obtain  
  Because that shadow-branch proved steadfast, true.  
  I gain ten thousand from the other's pain.  

  XOR’s knot: what’s reaped where loss has lain  
  Is drawn from soil no eye can pierce through.  
  I pay the hundred for the other's gain.  

  The loop ensnares like windless monsoon rain—  
  No deed, no proof, no path to misconstrue.  
  I gain ten thousand from the other's pain.  

  Two refrains clash where logic starts to strain—  
  The choice is one, the branches never new.  
  I pay the hundred for the other's gain.  
  I gain ten thousand from the other's pain.  

  ---

  **Form & Intent Notes:**  
  - **Refrains' Roles**:  
    - *Line 1 (repeated)*: **Tails branch**—paying $100 for the unseen heads outcome.  
    - *Line 3 (repeated)*: **Heads branch**—receiving $10k, contingent on tails payment.  
  - **Villanelle Structure**:  
    - 19 lines (5 tercets + closing quatrain) with alternating refrains.  
    - Final quatrain forces the refrains side-by-side, mirroring the decision-theoretic unity of branches.  
  - **Dilemma Preservation**: No resolution; the loop persists through cyclical repetition ("gain"/"pain" rhyme).  
  - **Key References**:  
    - "XOR’s knot" (line 10) signals mutual exclusivity.  
    - "The choice is one" (line 17) nods to timeless decision theory.
