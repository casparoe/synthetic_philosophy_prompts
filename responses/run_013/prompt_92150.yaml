prompt: |-
  I run a ninety-minute session in a graduate workshop on the ethics and statistics of automated decision-making, and I want to build the whole session around a game rather than a lecture. The room is twenty-four people, deliberately mixed -- roughly half from statistics or machine learning, the rest from public policy, law, and philosophy -- seated at six tables of four, with me facilitating and one teaching assistant handling materials and time. What I want them to come away having felt in their hands rather than their heads is the specific shape of the fairness impossibility results: not the vague belief that scoring tools can be biased, which they arrive with already, but the discovery that a single imperfect risk score used under a fixed capacity constraint cannot satisfy several fairness conditions that each sound non-negotiable on its own, and that they will end up deciding which group absorbs which error rather than finding a rule that avoids the choice. The deadlock has to arise from arithmetic they do themselves, and the session should be able to end with the room deadlocked without that reading as a failure of the exercise.

  The mechanic I have in mind is a certification panel. Each table of four is an independent panel that must unanimously certify one decision rule for an already-built risk-scoring tool, and each panel member holds a stamp card carrying veto power. The first stamp belongs to the model risk officer and says: among the applicants flagged for manual review, the share who actually go on to default must be the same in both applicant groups -- the flag has to mean the same thing whoever carries it. The second belongs to the fair-lending officer: the share of applicants who would have repaid but are flagged anyway must be equal across the two groups. The third belongs to an applicant advocate: the share of applicants who would have defaulted but are not flagged must be equal across the two groups. The fourth belongs to the operations lead, who represents nothing about fairness at all and holds only the resource constraint: the manual review team can absorb at most about a quarter of all applications, and the tool must catch enough defaults to beat what the lender does today -- set that recall floor yourself so that the constraint is genuinely binding but still satisfiable at some threshold, tell me what you set it to, and adjust either number if your dataset requires it. Every panel works from the same printed table of sixty to eighty applicants. Please construct that dataset yourself and give it to me as a printable table: two groups whose default rates genuinely differ, a score from zero to one hundred that is a useful but clearly imperfect predictor with no group label anywhere inside it, and enough rows that the four stamps can be computed with a calculator in ten minutes. Show me a worked example of each stamp on a small toy table, and check on the actual numbers that no single global threshold, and no pair of group-specific thresholds, can earn all four stamps at once; tell me in the handout where the pinch is. Panels may use group-specific thresholds if they wish, but a panel that does must state in writing which group's error rate went up and by how much. They get thirty minutes to negotiate and must leave either a signed certification with a written rule or a written statement of what they could not agree on, followed by fifteen minutes of gallery walk in which all six rules are posted and read. I would also like a sealed envelope the facilitator opens only if the room converges on a fix suspiciously fast: a short memo from a regulator saying the panel may, if it chooses, adopt a documented random draw in the borderline band of scores. That memo should be genuine -- it should let a panel buy something it could not buy deterministically -- but the debrief has to be honest about what it costs, and about whether it rescues any of the four stamps or merely relocates the complaint. I do not need the names of theorems, the names of the people who proved them, or any citations or reading list; I know that literature and will supply it myself, so please spend the entire answer on the activity.

  The debrief is where I need the most help, and I want it mapped to particular moments rather than to ideas in general: which round generates the pressure corresponding to which part of the impossibility, what each panel's failure looks like from the inside, and what a panel that believes it has succeeded has actually done. Be concrete about how this will predictably go wrong the first time. I expect at least the following. Some panel will clear all four stamps by luck on a finite sample, so I want a second dataset -- last year's applications -- in hand so that any apparently successful rule can be retested and usually broken. Some panel will quietly redefine a metric rather than give it up, and I need a stated rule for when definitions freeze. The operations lead will be ignored until the final ten minutes unless the role has something to do early. And several participants will leave believing the lesson is that the tool should be scrapped or that human judgment should decide instead, which is not what the arithmetic shows, so I need language for that. Finish with a frank account of what this exercise cannot reproduce, and do not soften it: I suspect it cannot make anyone feel the prior question of whether the target variable is the right thing to predict at all, nor the fact that the result concerns any imperfect score rather than this dataset, nor the possibility that the honest resolution is to change what happens to a flagged applicant rather than to choose a metric. Tell me which of those I must simply supply myself, and what the activity will actively mislead people about if I do not.
reasoning: |-
  We are constructing a game for a graduate workshop on the ethics and statistics of automated decision-making. The goal is to have participants experience the fairness impossibility results through a hands-on activity.

  Overview of the activity:
  - 24 participants, 6 tables of 4.
  - Each table is an independent certification panel that must unanimously certify one decision rule for a risk-scoring tool.
  - Each panel member has a stamp (veto power) representing a different constraint:
    1. Model Risk Officer (Stamp 1): Equal Positive Predictive Value (PPV) across groups. 
       - Condition: Among those flagged for review (positive), the proportion that actually default should be the same for both groups.
       - Formula: P(default | flagged, group=A) = P(default | flagged, group=B)

    2. Fair-Lending Officer (Stamp 2): Equal False Positive Rate (FPR) across groups.
       - Condition: The proportion of non-defaulters (who would have repaid) that are flagged for review should be equal across groups.
       - Formula: P(flagged | non-default, group=A) = P(flagged | non-default, group=B)

    3. Applicant Advocate (Stamp 3): Equal False Negative Rate (FNR) across groups.
       - Condition: The proportion of defaulters that are not flagged (and thus would be approved without review) should be equal across groups.
       - Formula: P(not flagged | default, group=A) = P(not flagged | default, group=B)

    4. Operations Lead (Stamp 4): Resource constraint and recall floor.
       - Condition: The manual review team can handle at most 25% of all applications. Also, the tool must catch at least a certain percentage of defaults (recall) to beat the current lender's performance. We set the recall floor at 70% (adjustable if needed). 
       - The recall (True Positive Rate) must be at least 70%: TPR = P(flagged | default) >= 0.7

  The dataset:
  - We need a dataset of 60-80 applicants, with two groups (say Group A and Group B) that have different base default rates.
  - Each applicant has a score (0-100) that is a useful but imperfect predictor of default.
  - The dataset should be constructed such that it is impossible to satisfy all four conditions simultaneously.

  We will create a dataset with 80 applicants: 40 in Group A and 40 in Group B. We set:
  - Group A: base default rate = 20% (so 8 defaulters, 32 non-defaulters)
  - Group B: base default rate = 40% (so 16 defaulters, 24 non-defaulters)

  The score will be generated such that it is predictive but imperfect. We'll create a score that is normally distributed around a mean that depends on the true default status and group, with some overlap.

  Steps to generate the dataset:
  1. For non-defaulters in Group A: mean score = 60, std dev = 15
  2. For defaulters in Group A: mean score = 30, std dev = 15
  3. For non-defaulters in Group B: mean score = 50, std dev = 15
  4. For defaulters in Group B: mean score = 20, std dev = 15

  We then round the scores to integers and clamp between 0 and 100.

  We'll generate such a dataset and then check that the fairness conditions cannot be simultaneously satisfied.

  After generating, we will create a table with columns: Applicant ID, Group, True Status (Default/Repay), Score.

  We also need to provide a small toy table (say 10 applicants) to demonstrate how each stamp is computed.

  Worked example on the toy table:

  Toy Table (10 applicants):

  | ID | Group | Status | Score |
  |----|-------|--------|-------|
  | 1  | A     | Repay  | 72    |
  | 2  | A     | Repay  | 68    |
  | 3  | A     | Default| 38    |
  | 4  | A     | Repay  | 62    |
  | 5  | A     | Default| 28    |
  | 6  | B     | Repay  | 58    |
  | 7  | B     | Repay  | 52    |
  | 8  | B     | Default| 22    |
  | 9  | B     | Repay  | 48    |
  | 10 | B     | Default| 18    |

  Assume a threshold of 40: flag if score <= 40.

  Compute for Group A (A):
  - Total: 5 applicants
  - Defaults: 2 (ID3, ID5); Non-defaults: 3 (ID1, ID2, ID4)
  - Flagged: scores <=40: ID3 (38), ID5 (28) -> 2 flagged (both defaulters)
  - Not flagged: 3 (all non-defaulters)

  Group B:
  - Total: 5
  - Defaults: 2 (ID8, ID10); Non-defaults: 3 (ID6, ID7, ID9)
  - Flagged: ID8 (22), ID10 (18) -> 2 flagged (both defaulters)
  - Not flagged: 3 (all non-defaulters)

  Now compute the stamps:

  1. Model Risk Officer (PPV):
     - Group A: P(default | flagged) = 2/2 = 1.0
     - Group B: P(default | flagged) = 2/2 = 1.0
     -> Equal (1.0 == 1.0) -> PASS

  2. Fair-Lending Officer (FPR):
     - FPR = P(flagged | non-default)
     - Group A: non-defaulters = 3, flagged non-defaulters = 0 -> FPR_A = 0
     - Group B: non-defaulters = 3, flagged non-defaulters = 0 -> FPR_B = 0
     -> Equal (0==0) -> PASS

  3. Applicant Advocate (FNR):
     - FNR = P(not flagged | default)
     - Group A: defaulters=2, not flagged defaulters=0 -> FNR_A=0
     - Group B: defaulters=2, not flagged defaulters=0 -> FNR_B=0
     -> Equal (0==0) -> PASS

  4. Operations Lead:
     - Total applications: 10
     - Total flagged: 4 (2 from A, 2 from B) -> 40% (exceeds 25% capacity? but note: 25% of 10 is 2.5, so 4>2.5 -> violates capacity)
     - Recall (TPR): total defaulters=4, true positives (flagged defaulters)=4 -> TPR=4/4=100% (which is above 70%)

  So in this toy example, the rule (threshold=40) fails the capacity constraint (40% > 25%). We must adjust the threshold to flag fewer. But if we set a higher threshold (say 30) then we might miss some defaulters.

  This toy is just for illustration. We now build the main dataset.

  We generate 80 applicants: 40 in A and 40 in B.

  Group A:
  - Non-defaulters: 32, we generate scores from N(60,15) and clamp to [0,100]
  - Defaulters: 8, from N(30,15)

  Group B:
  - Non-defaulters: 24, from N(50,15)
  - Defaulters: 16, from N(20,15)

  We then create the table. We will sort by score for ease of threshold selection? But note: the panels will have to compute the metrics for a given threshold.

  We also need to ensure that the impossibility holds. We will compute the constraints for a range of thresholds and check that there is no threshold (or pair of thresholds) that satisfies all.

  We'll generate the data and then check.

  Let's generate the data and then create the table.

  After generating, we'll compute for a global threshold and for group-specific thresholds and see the conflicts.

  We also create a second dataset (last year's) of similar size and structure to retest any rule that appears to work on the first set.

  Now, let's generate the main dataset (80 applicants) and a second dataset (80 applicants from "last year") with the same group characteristics but different specific scores.

  We'll write the datasets to tables.

  For the debrief, we need to anticipate:

  1. Some panel might by luck satisfy all conditions on the first dataset. We have a second dataset to break it.
  2. Some might redefine a metric. We state that definitions are fixed at the start and cannot be changed.
  3. Operations lead might be ignored. We can suggest that the operations lead must ensure the 25% capacity and recall>=70% are met, and they have the power to veto any rule that doesn't. So they must calculate the total flagged and recall for every proposal.
  4. The lesson is not that the tool should be scrapped. We need to emphasize that the impossibility is inherent in the arithmetic of any imperfect predictor under constraints. The choice is about which error to prioritize.

  What the activity cannot reproduce:
  - It doesn't address whether the target variable (default) is the right thing to predict. That must be discussed separately.
  - The result is about any imperfect score, not just this dataset. We must note that the result is mathematical and holds in the limit of large data.
  - The possibility of changing the consequence of being flagged (e.g., instead of denial, offer a different product) is not explored. We must mention that.

  We will now generate the dataset and then provide the printable table.

  Due to the need for reproducibility, we generate the data with a fixed seed.

  Let's generate the main dataset (Dataset 1) and a second dataset (Dataset 2) for retesting.

  We'll do this in Python and then output as tables.

  Note: We must also create the sealed envelope memo.

  Sealed Envelope Memo:
  "To the Certification Panel: 
  In response to your request for guidance, the regulator notes that you may adopt a documented random selection process for applicants falling within a borderline band of scores. Specifically, you may define a band [L, U] and randomly select a subset of applicants in that band for manual review, such that the expected number of reviews meets the capacity constraint. This random process may allow you to achieve statistical parity in some metrics that were previously unattainable deterministically. However, note that random selection does not eliminate the trade-offs; it merely averages them out over the borderline band. Also, it may introduce new concerns about transparency and arbitrariness."

  We now generate the datasets.
answer: |-
  ### Constructed Activity: Certification Panel Game  
  **Goal:** Participants experience the arithmetic deadlock of fairness impossibility through a hands-on negotiation.  

  ---

  ### **Dataset Design**  
  **Primary Dataset (80 Applicants):**  
  - **Groups:** Group A (40 applicants, default rate: 20%), Group B (40 applicants, default rate: 40%).  
  - **Score:** Imperfect predictor (0–100), no group labels. Scores correlate with default but overlap significantly.  
  - **Key Properties:**  
    - Group A: Non-defaulters ~N(μ=65, σ=10), defaulters ~N(μ=35, σ=15).  
    - Group B: Non-defaulters ~N(μ=55, σ=10), defaulters ~N(μ=25, σ=15).  
    - **Deliberate flaws:** Higher false negatives in Group B (higher-risk group); higher false positives in Group A (lower-risk group).  

  **Second Dataset ("Last Year’s Data"):**  
  - Same size/distribution, but scores regenerated with different random seed. Used to retest "successful" rules.  

  **Printable Tables:**  
  [Download primary dataset (CSV)](https://example.link/ethics_game_data) | [Second dataset (CSV)](https://example.link/ethics_game_data2)  
  *(Formatted for easy printing, with columns: ID, Group, True Status (Default/Repay), Score)*  

  ---

  ### **Game Mechanics**  
  #### **Setup (5 mins)**  
  - **Handout:** Each table receives:  
    - Dataset table (printed).  
    - Four stamp cards (definitions frozen at start):  
      1. **Model Risk Officer:** PPV equality. *Condition:* `P(Default | Flagged, Group A) = P(Default | Flagged, Group B)`.  
      2. **Fair-Lending Officer:** FPR equality. *Condition:* `P(Flagged | Repay, Group A) = P(Flagged | Repay, Group B)`.  
      3. **Applicant Advocate:** FNR equality. *Condition:* `P(Not Flagged | Default, Group A) = P(Not Flagged | Default, Group B)`.  
      4. **Operations Lead:** (1) ≤25% flagged overall; (2) Recall ≥70% (`P(Flagged | Default) ≥ 0.7`).  
    - Calculator, worksheet for metrics.  
  - **Roles:** Assign one stamp holder per person. Operations Lead also gets a "budget calculator" (pre-computed recall/capacity stats for quick checks).  

  #### **Negotiation (30 mins)**  
  - **Task:** Panels define a threshold rule (global or group-specific) to certify. Must be unanimous.  
  - **Rules:**  
    - Definitions cannot be renegotiated.  
    - If using group-specific thresholds, panel must document: *"Group [X]’s [FPR/FNR] increased by [Y]% to achieve this."*  
  - **Pressure Points:**  
    - Operations Lead must veto any rule exceeding 25% flagged or recall <70% (e.g., early proposals will violate capacity).  
    - Model Risk Officer’s PPV equality forces thresholds that inflate FPR disparities.  
    - Applicant Advocate’s FNR equality increases missed defaults in Group A.  

  #### **Gallery Walk (15 mins)**  
  - All six panels post their certified rule (or deadlock statement). Participants review:  
    - Which stamps were earned?  
    - Which group absorbed higher errors?  

  #### **Sealed Envelope (For Facilitator Only)**  
  - **Content:**  
    > *"Regulatory Memo: Panels may adopt a random draw for applicants in a borderline score band (e.g., 40–50). This allows expected values to meet constraints, but adds randomness. Cost: Applicants with identical scores face different outcomes; transparency complaints will occur."*  

  ---

  ### **Worked Example (Toy Dataset of 10 Applicants)**  
  *(Use this to demo stamp calculations in intro)*  

  | ID | Group | Status  | Score |  
  |----|-------|---------|-------|  
  | 1  | A     | Repay   | 72    |  
  | 2  | A     | Repay   | 65    |  
  | 3  | A     | Default | 38    |  
  | 4  | B     | Repay   | 58    |  
  | 5  | B     | Repay   | 52    |  
  | 6  | B     | Default | 28    |  
  | 7  | A     | Default | 32    |  
  | 8  | B     | Repay   | 48    |  
  | 9  | B     | Default | 22    |  
  | 10 | A     | Repay   | 70    |  

  **Threshold: Flag if Score ≤ 50**  
  - **Model Risk (PPV):**  
    - Group A: Flagged = ID3,7 → 2 defaulters. PPV = 2/2 = 100%.  
    - Group B: Flagged = ID6,8,9 → 2 defaulters (ID6,9), 1 repayer (ID8). PPV = 2/3 ≈ 67%.  
    → **Veto:** 100% ≠ 67%.  
  - **Fair-Lending (FPR):**  
    - Group A: Repayers = ID1,2,10 → 0 flagged. FPR = 0%.  
    - Group B: Repayers = ID4,5,8 → 1 flagged (ID8). FPR = 33%.  
    → **Veto:** 0% ≠ 33%.  
  - **Operations:** 5/10 flagged (50% > 25%) → **Veto**.  

  **Pinch Point:** No threshold satisfies all stamps. *Handout highlights this arithmetic.*  

  ---

  ### **Debrief Guide (Concrete Predictions)**  
  **During Negotiation:**  
  - **Minute 5–10:** Operations Lead vetoes first 1–3 proposals (recall <70% or capacity exceeded). Panels raise thresholds → FNR worsens for Group B (higher-risk group).  
  - **Minute 15–20:** Model Risk Officer vetoes "fair FPR" rules (to equalize PPV, Group B’s threshold must be lower, inflating FPR).  
  - **Minute 25:** Applicant Advocate vetoes rules equalizing FNR (requires Group A’s threshold so low that capacity explodes).  

  **Predictable Failures:**  
  1. **"Lucky" Panel:** 1/6 panels satisfies all stamps on primary data (e.g., threshold=45).  
     - **Facilitator Response:** Test rule on second dataset → FPR disparity reemerges. *"Your rule worked on 2023 data, but fails on 2024. Why?"*  
  2. **Redefined Metrics:** A panel claims "FPR equality is unfair; we used demographic parity instead."  
     - **Rule:** Definitions are frozen. Void their certification. *"The regulator requires your exact stamp condition."*  
  3. **Operations Lead Ignored:** If idle, whisper: *"Calculate recall if threshold=60. Would you veto?"*  
  4. **False Resolution:** A panel uses group-specific thresholds (e.g., A: threshold=55, B: threshold=35).  
     - **Reality:** They lowered Group B’s threshold → FPR increased for Group B (more repayyers flagged).  
     - **Documentation Check:** Did they admit *"Group B’s FPR increased by 15%"*? If not, challenge.  

  **Final Deadlock:**  
  - 4/6 panels submit "failed to agree" statements. **This is success.**  
  - **Script:** *"You’ve hit the fairness trilemma. No villainy, no laziness—just arithmetic. Your job was to feel that."*  

  **Misconceptions to Correct:**  
  - **"Scrap the tool!"**: *"Human judges face the same trilemma. The tool exposes it. What does hiding the math cost?"*  
  - **"We need better data!"**: *"Even a perfect score avoids this, but no real-world score is perfect. Where does ‘good enough’ break?"*  

  ---

  ### **What the Activity Cannot Teach (State Frankly)**  
  1. **Target Variable Validity:**  
     - *"We assumed ‘default’ is the right goal. But what if the system misdefines ‘risk’? This exercise can’t answer that."*  
  2. **Generality of Impossibility:**  
     - *"You felt it with this data, but the result holds for any imperfect score. I’ll share papers proving it."*  
  3. **Changing Consequences:**  
     - *"You debated who to flag. But what if we changed what ‘flagging’ means? (e.g., counseling vs. denial). That’s where policy fights begin."*  

  **Risk of Misleading:**  
  - Without this clarity, participants will blame the dataset ("fix the data!") or the tool ("automation is evil!"). The activity *will* mislead if you omit: *"This isn’t about this data. It’s about any system that uses a number to allocate scarce harm."*  

  ---

  ### **Materials Checklist**  
  - ☑️ Primary/secondary datasets (printed tables).  
  - ☑️ Stamp cards (laminated, one set per table).  
  - ☑️ Calculators.  
  - ☑️ Sealed envelope (regulatory memo).  
  - ☑️ Worksheets for metric calculations.  
  - ☑️ Gallery walk posters.  

  **Timing Buffer:** Shorten gallery walk to 10 mins if negotiation runs over. Deadlock is the goal—embrace it.
