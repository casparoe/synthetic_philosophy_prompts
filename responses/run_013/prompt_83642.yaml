answer: |-
  Here’s a defended research agenda for your group, prioritizing questions based on **upstream dependencies, tractability with limited resources, and leverage for theory-building**. I’ll rank 6 core questions, explain the rationale, and flag traps. The goal: maximize progress toward a formal theory of "re-representation necessity" in concept learning.

  ### Core Principle
  Focus on **puzzles as artifacts** first, not solvers. Your constraint (no big models) forces this, but it’s a strength: solver-relative theories will fragment; puzzle-inherent properties let you define the *demand* side of representation.

  ### The Agenda (Ranked)
  1. **Ambiguity vs. Determinism**  
     **Question:** *When do Bongard problems admit multiple defensible rules, and can we characterize the solution space?*  
     **Why upstream?** Until you know if a puzzle *has* a unique "intended" rule, "difficulty" and "re-representation" are ill-defined. If multiple rules exist (e.g., one using reweighted features, one requiring new primitives), your core distinction collapses.  
     **Tractability:**  
     - Catalog existing puzzles (e.g., [Bongard.io](http://bongard.io) archive). For each, independently derive rules.  
     - Classify ambiguity types:  
       - *Equivalent* (different descriptions, same extension)  
       - *Divergent* (legitimately different concepts, e.g., "convex shapes" vs. "shapes with no concave parts")  
       - *Meta-ambiguity* (self-referential puzzles where the rule depends on solver state).  
     **Neglected?** Yes. Most BP discussions assume a single "answer."  
     **Risk:** Moderate. Requires rigorous documentation but no novel experiments.  
     **Time:** 2-3 months. **Output:** A typology of ambiguity. Lets you filter puzzles for downstream work.

  2. **Reweighting vs. Re-representation Boundary**  
     **Question:** *Under what formal conditions does a solution require introducing a new primitive not expressible in the initial vocabulary?*  
     **Why now?** Your central puzzle. Depends on #1 (to avoid conflating ambiguous rules with representational shifts).  
     **Tractability:**  
     - Define a minimal "solver" (e.g., a simple feature extractor). Fix its initial vocabulary (e.g., edges, corners, connectivity).  
     - For unambiguous puzzles, test: can solutions be expressed as combinations of initial features? If not, what *minimal* primitive must be added?  
     - Use human solvers’ think-aloud protocols: when do they report "seeing differently"?  
     **Neglected?** Surprisingly. Work on "description complexity" exists (e.g., Kolmogorov), but rarely links to cognitive primitives.  
     **Risk:** High reward. Start with puzzles where solutions are provably inexpressible in simple vocabularies (e.g., topology changes in ["hole" problems](https://www.foundalis.com/res/bps/bpidx.htm)).  
     **Time:** 6-8 months. **Output:** Formal criteria for "new primitive necessity."

  3. **Difficulty Relative to Vocabulary**  
     **Question:** *Can we quantify puzzle difficulty as a function of the representational gap between initial and required vocabularies?*  
     **Why here?** Requires #1 and #2. Difficulty isn't absolute, but once you fix the solver's starting point, the "gap" defines the challenge.  
     **Tractability:**  
     - With your #2 "minimal solver," measure computational effort (e.g., search steps) to find solutions with vs. without new primitives.  
     - Human experiments: time/error rates vs. vocabulary complexity (operationalized via #2).  
     **Neglected?** Mostly studied empirically. Your chance: formalize the *structure* of the gap.  
     **Risk:** Medium. Needs careful operationalization, but scales with #2.  
     **Time:** 4-6 months after #2. **Output:** A difficulty metric based on representational distance.

  4. **The Self-Referential Frontier**  
     **Question:** *Do self-referential BPs (e.g., "the rule is that left/right labels are swapped") reveal unique representational challenges?*  
     **Why now?** They test the limits of your framework. If your #2/#3 can’t handle these, your theory is incomplete.  
     **Tractability:**  
     - Curate a small set of such puzzles.  
     - Analyze: do they *require* meta-representation (treating the puzzle as an object)?  
     - Contrast with near-miss non-self-referential puzzles.  
     **Neglected?** Extremely. Most BPs avoid this.  
     **Risk:** High. Could be a party trick—but if solved, reveals if representation hierarchies exist (#5).  
     **Time:** 1-2 months (after #1). **Output:** A "litmus test" for meta-representational demands.

  5. **Hierarchies of Representational Jumps**  
     **Question:** *Are some representational shifts "harder" than others, and is the ordering consistent?*  
     **Why late?** Requires stable definitions from #2 and #3. Premature without them.  
     **Tractability:**  
     - Map transitions: e.g., adding a symmetry primitive vs. adding recursion.  
     - Test solver transfer: if solver learns primitive X for puzzle A, does it solve puzzle B faster?  
     **Neglected?** Yes. Assumes jumps are uniform.  
     **Risk:** Lower if built on #2/#3. **Time:** 4-6 months (final phase). **Output:** A partial ordering of primitive "complexity."

  6. **Naturalness of Concepts**  
     **Question:** *Do BPs induce "natural" concepts, or are they arbitrary puzzle artifacts?*  
     **Why last?** Philosophically deep but downstream. Depends on all prior work.  
     **Tractability:**  
     - Compare BP-derived concepts to those in cognitive science (e.g., geon-based shapes).  
     - Test generalizability: if humans learn a BP primitive, do they overuse it elsewhere?  
     **Risk:** High. May not yield clear answers. Prioritize only if earlier work succeeds.  

  ### What to Deprioritize
  - **"Few-shot learning in the age of LLMs":** Irrelevant for you. BPs are about *what must be represented*, not sample efficiency. Your "artifact-first" approach sidesteps this.  
  - **"Is difficulty well-defined?"** Addressed by #1-#3. Don’t debate it standalone.  
  - **Broad surveys:** Focus on your curated puzzle sets (#1) and minimal solvers (#2).  

  ### Critical Trade-offs & Triggers to Reorder
  - **If ambiguity (#1) is rampant:** Pivot to "solution space geometry" over individual rules. This becomes the *core* theory.  
  - **If minimal solvers (#2) can’t capture human insights:** Shift to protocol analysis early. Humans become the "oracle" for representational necessity.  
  - **If self-referential (#4) puzzles break your framework:** They may define the ceiling of your theory—don’t ignore them.  
  - **If no stable hierarchy (#5) emerges:** Conclude that jumps are solver-dependent, making a general theory impossible.  

  ### Your 2-Year Timeline
  1. **Months 1-3:** Resolve ambiguity (#1). Publish a "BP clarity index" for the community.  
  2. **Months 4-11:** Attack re-representation (#2) and difficulty (#3). Build solver prototypes.  
  3. **Months 12-18:** Test self-referential (#4) and hierarchy (#5) puzzles.  
  4. **Months 19-24:** Synthesize into a theory paper; address naturalness (#6) if possible.  

  **Plant your flag here:**  
  > "The necessity of re-representation in concept learning is determined by the *incommensurability* between the initial vocabulary and the minimal solution vocabulary required to solve an unambiguous Bongard problem. Difficulty scales with the cardinality and complexity of primitives bridging this gap."  

  This positions you at the intersection of cognitive science, formal logic, and computational complexity—using BPs not as puzzles to solve, but as microcosms of conceptual revolution.
