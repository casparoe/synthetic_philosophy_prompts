prompt: |-
  I'm a high school student and for my philosphy club I have to write an adversarial collaboration thing, which I've never done. Can you draft the joint statement that a metabolism-first theorist and a replication-first theorist could both sign about what life is? I want the claims they agree on, including about viruses, prions, mules, fire, and computer viruses; then the exact places they still disagree, each phrased in wording that side would accept for itself; then the cruxes. For each crux, give a concrete borderline case or argument both sides agree would bear on it, and write down what each side predicts about it in advance. Please also include two cases I made up: (1) a lab-made RNA strand that copies itself and evolves under selection but has no membrane and no metabolism of its own, and (2) a robot that repairs itself and prints copies of itself from junk, but only when a human presses start. And say if any part of their fight is just about words. Format it as a numbered agreed-claims section followed by a disagreements table. No citations or reading list please, just the document.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between a metabolism-first theorist (MFT) and a replication-first theorist (RFT) on the definition of life. The goal is to outline agreed claims, disagreements, and cruxes with concrete cases.

  Agreed Claims (Both Signatories Endorse):
  1. Life is a property of certain complex systems that exhibit behaviors such as growth, reproduction, response to stimuli, and evolution by natural selection.
  2. The distinction between living and non-living is not always sharp; there are borderline cases.
  3. Viruses: Not considered alive when outside a host cell because they lack independent metabolism and cannot replicate without hijacking a host's machinery. However, they possess genetic material and can evolve.
  4. Prions: Not alive because they are misfolded proteins that induce misfolding in others but lack genetic material, metabolism, and independent replication. They propagate but do not evolve in a Darwinian sense.
  5. Mules: Are alive because they are part of a reproductive lineage (even though sterile) and exhibit metabolism, growth, response to stimuli, and are part of a living system (the organism).
  6. Fire: Not alive. It consumes fuel (metabolism-like) and spreads (replication-like), but lacks genetic material, evolution, and organization. It is a chemical reaction, not a self-sustaining system.
  7. Computer Viruses: Not alive. They replicate and evolve in a digital environment but lack a physical body, metabolism, and are not based on biochemistry. They are informational constructs.

  Disagreements:
  The core disagreement centers on whether metabolism or replication is the fundamental, defining characteristic of life.

  - Metabolism-First Theorist (MFT) holds that the essence of life is a self-sustaining metabolic network that maintains itself and its organization against entropy. Replication is a secondary feature that emerges in some living systems for propagation.
  - Replication-First Theorist (RFT) holds that the essence of life is the capacity for Darwinian evolution, which requires replication with variation and selection. Metabolism is a means to support replication but not essential in all possible life forms.

  Cruxes:
  Cruxes are points of disagreement that, if resolved, would significantly advance the debate. Each crux is framed as a question with a concrete borderline case. Both sides agree that the outcome of the case would bear on the crux.

  Crux 1: Is a self-sustaining metabolic process, independent of replication, sufficient for life?

  - Borderline Case: A lab-made, self-sustaining chemical system (e.g., an autocatalytic set) that maintains itself, grows, and responds to environmental changes but does not replicate or evolve. (Note: Such systems are theoretically possible but currently not fully realized in the lab without replication.)

  - MFT Prediction: This system would be considered alive because it maintains itself against entropy through metabolism, even without replication.
  - RFT Prediction: This system would not be alive because without replication and the capacity for evolution, it cannot adapt and is not subject to natural selection, hence not part of a lineage.

  Crux 2: Is replication with variation and selection, without metabolism, sufficient for life?

  - Borderline Case: The lab-made RNA strand (Case 1): an RNA molecule that can copy itself (using external nucleotides and energy) and evolve under selection in a test tube. It has no membrane and no metabolism of its own (relies entirely on the environment for building blocks and energy).

  - MFT Prediction: Not alive because it lacks a self-sustaining metabolic network. It is entirely dependent on external conditions and does not regulate or maintain itself.
  - RFT Prediction: Alive because it exhibits the key features of Darwinian evolution: replication, variation, and selection. It is a replicator and thus the foundation of life.

  Crux 3: Is autonomous operation (without external initiation) necessary for life?

  - Borderline Case: The self-replicating robot (Case 2): a robot that can repair itself and build copies of itself from raw materials (junk) but only when a human presses the start button. Once started, it operates without further human intervention.

  - MFT Prediction: The robot is not alive because it requires external initiation and does not have a self-sustaining metabolic process (it's mechanical, not biochemical). Its operation is not autonomous from the start.
  - RFT Prediction: The robot is borderline but leans toward non-life because it cannot initiate replication on its own. However, if it were autonomous after start, it might be considered alive. But the requirement for a human start breaks the autonomy needed for life.

  Crux 4: Can there be life without evolution?

  - Borderline Case: Consider a hypothetical organism that has metabolism and replicates perfectly (no variation) so that it cannot evolve. It is part of a lineage but is identical to its parent.

  - MFT Prediction: It would be alive because it maintains itself and reproduces, even without evolution.
  - RFT Prediction: It would not be alive because without variation and the potential for evolution, it does not meet the criteria for being subject to natural selection. It is a replicating machine, not life.

  Note: Both sides agree that the argument about whether metabolism or replication is primary may be partly about words (i.e., how we choose to define "life"). However, they also believe that the choice of definition has scientific consequences for searching for life (e.g., on other planets) and for understanding the origin of life on Earth.

  Format:

  Joint Statement on the Definition of Life

  We, the undersigned, representing the metabolism-first and replication-first perspectives, agree on the following:

  Agreed Claims:
  1. Life is characterized by properties including organization, growth, reproduction, response to stimuli, and evolution, though not all must be present simultaneously.
  2. The boundary between living and non-living is fuzzy, with many borderline cases.
  3. Viruses are not considered alive when outside a host cell because they lack independent metabolism and replication capability. Inside a host, they exhibit some life-like properties but remain dependent.
  4. Prions are not alive as they lack genetic material, metabolism, and independent replication; they are merely infectious proteins.
  5. Mules are alive despite being sterile because they are products of a living lineage and exhibit metabolism, growth, and other vital processes.
  6. Fire is not alive; it is an uncontrolled chemical reaction without genetic information or evolution.
  7. Computer viruses are not alive; they are digital constructs that lack physical embodiment and metabolism.

  Disagreements:

  | Issue | Metabolism-First Position | Replication-First Position |
  |-------|----------------------------|----------------------------|
  | **Primary Criterion for Life** | Life fundamentally requires a self-sustaining metabolic network that maintains the system against entropy. | Life fundamentally requires the capacity for Darwinian evolution through replication with variation and selection. |
  | **Role of Replication** | Replication is a derived feature of some living systems but not essential for the basic definition of life. | Replication is the core of life; without it, there is no possibility of evolution, which is the hallmark of life. |
  | **Role of Metabolism** | Metabolism is indispensable; it provides the energy and material basis for life. | Metabolism is a contingent feature of life on Earth; it supports replication but may not be necessary in other forms of life. |

  Cruxes:

  | Crux | Borderline Case | MFT Prediction | RFT Prediction |
  |------|----------------|----------------|----------------|
  | **1. Is self-sustaining metabolism sufficient without replication?** | A self-sustaining autocatalytic chemical system that maintains itself and grows without replication. | This system is alive: it maintains itself as an individual through metabolism. | Not alive: without replication and evolution, it is not life. |
  | **2. Is replication with evolution sufficient without metabolism?** | Lab-made RNA strand: replicates and evolves but relies entirely on external environment for resources and energy. | Not alive: lacks self-sustaining metabolism and is entirely dependent. | Alive: it is a replicator undergoing evolution, the minimal unit of life. |
  | **3. Is autonomous operation (without external initiation) necessary?** | Self-replicating robot that requires a human to press "start" but then operates autonomously to build copies from junk. | Not alive: requires external initiation and lacks metabolism. | Not alive: because it cannot initiate replication autonomously. (Note: RFT might accept if it were fully autonomous.) |
  | **4. Can there be life without evolution?** | A hypothetical organism that metabolizes and replicates perfectly (no variation) so it cannot evolve. | Alive: it maintains itself and reproduces. | Not alive: without variation and selection, it is not subject to evolution and thus not life. |

  Both parties acknowledge that part of their disagreement is terminological, but it also reflects deeper scientific differences about the essential nature of living systems.

