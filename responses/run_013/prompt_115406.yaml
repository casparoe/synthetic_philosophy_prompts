prompt: |-
  My grandpa died in March and ever since I've been reading way too much about time, which is how I ended up losing an argument with my roommate about whether he's still there. Specifically: the argument that special relativity forces a block universe, the Rietdijk--Putnam one (or whatever the official name for it is). The version that gets me is the Andromeda case: two people walking past each other on Earth, one headed each way, and their 'now' on Andromeda differs by days. So at least one of them is wrong about what's real over there right now, except there's no fact about who's wrong. Either my grandpa is still at his kitchen table in 1994 or he isn't, and I genuinely can't tell what the physics is supposed to be telling me.

  My roommate and I have been going in circles for months. So write the document we should have written instead: the joint statement from an adverserial collaboration between the two camps. Camp A: the argument goes through, and the block follows from SR plus one innocent premise about distant events being real. Camp B: the argument smuggles in its conclusion, because it treats 'real for observer O' as an unqualified 'real', and simultaneity-relative facts don't add up to existence.

  I want:

  1. Numbered claims both camps can sign: the physics they agree on, what the fight is *not* about, which moves are dead on both sides (I assume nobody gets to just assert absolute simultaneity), and whether they agree that no possible observation seperates the views.
  2. The disagreement stated twice, once in wording camp A would accept as its own and once in wording camp B would accept as its own. Neither side gets to sound dumb.
  3. The cruxes, ordered by how much settling them would actually move someone. I think one is whether 'real relative to an observer' has unqualified existential import, and another is whether SR merely fails to require a privileged foliation or positively rules one out -- does the presentist get to keep a hidden preferred frame? Also: does this argument kill the growing block too, not just presentism? And some people say it gets you determinism, which I don't see, since a block with genuinely chancy events seems fine to me. Finally, tell me if part of this dispute is just verbal -- a fight about whether 'exists' is tensed or indexical the way 'here' is.
  4. For each crux, a case or argument both sides agree bears on it, with each side's prediction written down in advance. Use concrete stuff: the Andromeda setup, two rockets passing each other, a supernova we see now, my grandpa. Flag which of these are real tests and which are just intuition pumps, and say whether any future observation -- some Lorentz violation, a preferred frame turning up in an experiment -- would move either side, which side, and by how much.

  Then a table: crux | camp A's position | camp B's position | what would move A | what would move B.

  Don't tell me the block universe is what the physicists think, I know, and don't send me off to a reading list. Write the actual document. Keep it tight and don't hedge every sentence into mush -- the whole point is that both of them could put their names on it.
