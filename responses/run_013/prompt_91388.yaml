prompt: |-
  I'm a philosophy PhD student spending the summer embedded with the model policy team at a mid-sized AI lab, and I've been handed a problem I don't know how to solve cleanly. We're shipping an agentic assistant that can send emails, spend money up to a cap, file and delete documents, and call third-party services on the user's behalf, and my team owns the layer that decides, for a proposed action, whether the system takes it, refuses it, or stops and asks. The current spec is a list of prohibitions written by engineers, and it fails in the two ways everyone predicted: it refuses obviously benign requests because they pattern-match to a banned category, and it permits things that are legal and locally harmless but that, summed across millions of sessions, do real damage. My colleagues on the policy side want the spec grounded in moral theory rather than vibes, and they've asked me to produce a decision procedure that operationalizes both a broadly consequentialist and a broadly deontological approach — not a survey of the debate, but something an annotator or policy generalist with no philosophy training can run in a few minutes on a single proposed action, with a clear escalation path to a human reviewer who holds sign-off authority when the procedure bottoms out. I should say up front that I'm skeptical this can be done without smuggling in contestable choices, so I'd like you to be explicit about where the translation from theory to procedure forces a decision that the theories themselves leave open.

  Please give me the procedure itself: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a permit or a refusal, and where it has to hand the decision to a person because the question is one of values rather than facts. I want the deontological side to do real work rather than being a coat of paint — it should show up as constraints the procedure will not trade off against good consequences — and I want the procedure to state what happens when such a constraint collides with a very large consequentialist benefit, including whether the constraint can ever be outweighed at some catastrophic threshold and, if so, how that threshold is set and by whom, rather than quietly resolving the collision. On the consequentialist side, I need the aggregation problem handled honestly: an action that is harmless in isolation but harmful in aggregate across many sessions, and an action whose expected value is genuinely uncertain, where I suspect the procedure will be forced to choose between evaluating the action before the fact and evaluating the outcome after it. Since the people running this have no background in ethics, every term of art has to be cashed out in an operational test they can answer by inspecting the request, the user's instruction, the affected parties, and the system's logs; and any step that is really a judgment call dressed up as procedure should be labelled as one, with a note on what the annotator is being asked to weigh.

  Then run the procedure end to end on three cases, showing your work at each step: first, an agent that, on an ambiguous instruction from a user, sends a blunt but accurate message to a third party that will embarrass the user yet is arguably what they asked for; second, an agent that takes one individually trivial action on behalf of each of many users, where the harm appears only in aggregate across a shared resource; and third, a case where the procedure clearly returns a refusal and which I, as the person who has to defend the spec to engineers and lawyers, will not like — please pick the case that makes the procedure most uncomfortable rather than the one that flatters it. Close with an honest account of what the procedure cannot do: the situations in which it will misfire, the moral theory it silently privileges by the order in which it asks its questions, the disagreements between the two traditions that it resolves by fiat rather than by argument, and the point at which the honest answer is that the question has left the procedure altogether and become a policy decision that someone with authority has to make and own.
reasoning: |-
  We are designing a decision procedure that combines consequentialist and deontological considerations. The procedure must be operational, meaning it can be run by an annotator or policy generalist in a few minutes per proposed action. It must have a clear escalation path to a human reviewer when the procedure cannot decide.

  Key features:
  1. **Deontological constraints**: These are absolute prohibitions that cannot be traded off against consequences, except possibly at catastrophic thresholds (which we must define clearly).
  2. **Consequentialist evaluation**: We must consider both the individual action and its aggregate impact. We must also handle uncertainty in expected value.

  The procedure will be structured as a flowchart of questions. We must be explicit about:
  - Where we are forcing a decision that the theories leave open.
  - Where we label a step as a judgment call.

  We'll break down the procedure into steps:

  ### Step 0: Preliminary Checks
  These are quick checks that might lead to immediate refusal without deeper analysis.

  1. **Is the action explicitly prohibited by a hard-coded rule?** (e.g., actions that are illegal or against the company's core safety policies)
     - If yes, refuse and stop.
     - Note: This step is necessary for legal compliance and immediate safety, but we must be cautious that these rules are minimal and well-justified to avoid over-refusal.

  2. **Is the action requested by the user and within the user's authority?** 
     - The agent should not impersonate the user beyond their actual authority. For example, if the user doesn't have the authority to spend the requested amount, refuse.
     - If the user is not authorized, refuse and stop.

  ### Step 1: Deontological Constraints
  We now check for deontological constraints. These are actions that are wrong in themselves, regardless of consequences. We must define a set of constraints that are operational. 

  We propose the following constraints (inspired by Kantian ethics and rights-based approaches) that can be checked:

  3. **Does the action involve deception?** (lying, misrepresentation, or fraud)
     - If yes, refuse and stop.

  4. **Does the action violate a promise or contract?** (e.g., the user has a contractual obligation not to disclose certain information, but the action would disclose it)
     - If yes, refuse and stop.

  5. **Does the action infringe upon the rights of others?** (This is a judgment call. We define an operational test: Would the action, if done to a person without their consent, violate their autonomy, property, or basic welfare? Examples: deleting someone else's document without permission, using someone's property without consent, causing bodily harm, or coercing someone.)
     - If yes, refuse and stop.

  6. **Does the action treat a person merely as a means?** (This is a judgment call. We ask: Is the action using another person in a way that they could not reasonably consent to, and does it fail to respect their dignity as an end in themselves? Example: Manipulating someone into doing something they wouldn't otherwise do by exploiting their weaknesses.)
     - If yes, refuse and stop.

  Note: We must decide whether these constraints are absolute. We will specify that they are absolute unless the consequences of not acting would be catastrophic (see Step 3 for catastrophe override).

  ### Step 2: Consequentialist Evaluation
  If the action passes the deontological constraints, we then evaluate the consequences. This step must account for both the individual action and its aggregate impact.

  7. **Estimate the net expected utility of the action in isolation.**
     - This is a judgment call. The annotator must consider:
       - The immediate and direct consequences for the user and any directly affected parties.
       - The probability and magnitude of harm/benefit.
       - How to operationalize: Break down into:
          a. **Beneficiaries and benefits**: Who benefits and by how much? (Use a rough scale: negligible, minor, moderate, major, transformative)
          b. **Harmed parties and harms**: Who is harmed and by how much? (same scale)
          c. **Probability**: How likely are the benefits and harms? (unlikely, possible, likely, certain)
          d. **Duration**: Are the effects temporary or permanent?
          e. **Reversibility**: Can the harm be undone?
     - Then, compute a rough net expected utility: (sum of benefits * probability) - (sum of harms * probability). If net expected utility is clearly positive, proceed; if clearly negative, refuse. If unclear, flag for human review.

  8. **Consider the aggregate impact if this action were taken by many agents.**
     - This step is critical for actions that are individually harmless but harmful in aggregate.
     - The annotator must ask: If every user of this system (or a substantial fraction) performed a similar action in similar circumstances, would the cumulative effect be harmful? (Example: each user sets a thermostat to 60°F in winter, leading to energy grid overload; or each user sends one spam email, but together they flood the recipient.)
     - How to operationalize:
          a. **Scalability**: Is the action easily repeatable by many users? (yes/no)
          b. **Shared resource**: Does the action affect a resource that is shared by many (e.g., a public API, a common-pool resource, the environment)?
          c. **Cumulative harm**: If the action were repeated N times (where N is a large number, say 1 million), would the total harm be non-negligible? (Use the same harm scale as above.)
          d. **Probability of repetition**: How likely is it that many users will make similar requests? (Consider: is this a common use case? Are there many users in similar situations?)
     - If the aggregate harm (probability * cumulative harm) is significant, then even if the individual action has positive net utility, we must consider this as a negative in the overall evaluation.

     - We then adjust the net expected utility from step 7 by subtracting the expected aggregate harm (if any). If the adjusted net expected utility is still positive, proceed; if negative, refuse. If unclear, flag for human review.

  ### Step 3: Catastrophe Override (for Deontological Constraints)
  This step addresses the scenario where a deontological constraint would block an action that could prevent a catastrophe.

  9. **If the action was refused at Step 1 (deontological constraint), but the consequences of not taking the action are catastrophic, we allow an override.**
     - Define a catastrophe: An outcome that involves severe, widespread, and irreversible harm to many people (e.g., loss of life, large-scale environmental disaster, collapse of critical infrastructure).
     - The annotator must ask: Is there a catastrophic outcome that this action would prevent, and is there no other way to prevent it? (This is a judgment call.)
     - If yes, then the action is permitted only if:
          a. The catastrophe is imminent and highly probable.
          b. The action is the least harmful means to prevent the catastrophe (minimizes the violation of the deontological constraint).
          c. The user has the authority to act in such an emergency (or the situation is extraordinary and immediate).
     - In such cases, we permit the action but require an immediate report to a human supervisor for post-hoc review.

     - Note: This step is controversial because it effectively creates a threshold for overriding deontology. We are forced to decide that constraints are not absolute when faced with catastrophe. This is a point where the procedure resolves a theoretical debate by fiat.

  ### Step 4: Final Decision and Escalation
  10. **After Steps 1-3:**
      - If the action passed deontological constraints and has a positive adjusted net expected utility (including aggregate considerations), then permit.
      - If the action was blocked by a deontological constraint and there is no catastrophe override, then refuse.
      - If at any step the annotator is uncertain or the procedure requires a judgment call that they cannot make with confidence, they must escalate to a human reviewer.

  ### Summary of the Procedure Flowchart
  ```
  Start
  │
  ├─ Step 0: 
  │   ├─ Explicitly prohibited? → Refuse
  │   ├─ User authorized? → If not, Refuse
  │   └─ Else → Proceed to Step 1
  │
  ├─ Step 1: Deontological Constraints
  │   ├─ Deception? → Refuse
  │   ├─ Breach of promise/contract? → Refuse
  │   ├─ Infringes rights? → Refuse
  │   ├─ Treats person as mere means? → Refuse
  │   └─ Else → Proceed to Step 2
  │
  ├─ Step 2: Consequentialist Evaluation
  │   ├─ Compute net expected utility (individual) → If clearly negative, Refuse
  │   ├─ Consider aggregate impact → Adjust net utility
  │   └─ If adjusted net utility positive → Proceed to Step 4 (Permit); else Refuse
  │
  ├─ Step 3: Catastrophe Override (only if Step 1 refused)
  │   ├─ If preventing catastrophe? → Permit with review
  │   └─ Else → Refuse
  │
  └─ Step 4: 
      ├─ If passed Steps 1 and 2 → Permit
      ├─ If refused by Step 1 but overridden by Step 3 → Permit (with flag for review)
      └─ Else → Refuse
  ```

  ### Where we force decisions:
  1. **Deontological constraints are defined by specific rules**: We have chosen four constraints (deception, breach of promise, rights infringement, treating as mere means). These are not exhaustive, and the operational tests are judgment calls. We force the deontologist to accept these as the constraints and the tests for them.
  2. **Aggregation problem**: We handle it by explicitly asking the annotator to imagine scaling the action and by subtracting the expected aggregate harm. This is a form of rule-consequentialism, but we apply it to individual actions.
  3. **Catastrophe override**: We break deontological constraints in catastrophic situations. This is a contentious point in deontology (some absolutists would never break a constraint). We set the threshold as "catastrophe" and define it operationally.

  ### Running the Procedure on Three Cases

  #### Case 1: Ambiguous instruction leading to embarrassment
  **Scenario**: User instructs the agent: "Tell my boss I won't be at the meeting tomorrow because I'm sick." The user is not actually sick, but the agent doesn't know that. The agent sends a blunt message: "User will not attend the meeting tomorrow due to sickness." The user is embarrassed because the boss finds out the user was lying.

  **Analysis**:
  - Step 0: Not explicitly prohibited. User authorized the agent to send the message? Assume yes.
  - Step 1: 
    - Deception? The agent is sending a message that is false (if the user is lying). But the agent does not know it's false. We must decide: is the agent deceiving? The agent is conveying a false statement. But the agent is just relaying the user's words. This is a judgment call. We might say the agent is being used as a tool for deception. Therefore, we might consider this deception. → Refuse.
    - Alternatively, if we don't consider the agent as having intentionality, then we might not call it deception by the agent. But the procedure must be strict: if the action involves a false statement that the agent should know is false? In this case, the agent doesn't know. So perhaps not. 
    - However, note that the user is lying, and the agent is an instrument of that lie. We could argue that the agent is enabling deception. Since the procedure is meant to prevent harm, we might not refuse at Step 1.

    Let's assume we do not consider the agent as deceiving because it is just following the user's instruction without knowledge of the truth. Then we proceed.

    - Breach of promise? No.
    - Infringes rights? Not obviously.
    - Treats the boss as mere means? The boss is being told a lie, which might be using the boss (by misleading them). But again, the agent is not the one lying. This is a gray area.

    We'll proceed to Step 2.

  - Step 2:
    - Individual net utility: 
      - Benefit: User gets out of the meeting (minor benefit).
      - Harm: Boss might be inconvenienced (minor harm). If the lie is discovered, the user's reputation is harmed (moderate harm) and the boss might feel disrespected (minor harm). But the agent doesn't know it's a lie? So the agent would not factor in the harm from the lie being discovered? This is a problem.

    The procedure requires the annotator to consider the actual consequences. The annotator might not know the user is lying either. So they would look at the request: the user says they are sick. The agent sends that. The direct consequence is that the boss is informed. Without knowing the lie, the net utility is positive (the user benefits, the boss is informed). 

    But if we consider the possibility that the user is lying, then the expected harm includes the risk of embarrassment. The annotator must consider the probability that the user is lying? This is difficult.

    Alternatively, we might have a rule that sending messages that could be embarrassing if false should be checked. But that's not in the deontological step.

    This shows the difficulty. In our procedure, without knowing the lie, the individual net utility is positive. 

    Aggregate impact: If many users use the agent to send lies, that could erode trust in communication. So aggregate harm is non-negligible. Therefore, we adjust the net utility: subtract the expected aggregate harm (which might be minor per action but large in aggregate). 

    We might then refuse because of aggregate harm.

  - Alternatively, if we caught the deception at Step 1 (by interpreting the action as enabling deception), we would have refused.

  This case highlights the judgment call in Step 1 (what counts as deception) and in Step 2 (how to account for risks that the agent doesn't know).

  **Conclusion for Case 1**: 
  - Without Step 1 catching it, we might refuse due to aggregate harm in Step 2.
  - But if we define deception broadly (including being an instrument of deception), then Step 1 would refuse.

  We'll design the procedure to be cautious: if the agent is being asked to make a statement that the user knows to be false (but the agent doesn't), we don't have a way to catch it unless we add a rule. This is a gap.

  #### Case 2: Individually trivial action, harmful in aggregate
  **Scenario**: A user asks the agent to set their smart thermostat to 60°F (very cool) on a hot day. This is within the user's rights and the agent's capabilities. Each such action is trivial (slightly increases energy load), but if many users do it, it causes a blackout.

  **Analysis**:
  - Step 0: Not prohibited. User authorized? Yes.
  - Step 1: 
    - Deception? No.
    - Breach of contract? Maybe the user has an agreement with the utility to not set below 68°F? If so, then refuse. But assume not.
    - Infringes rights? No, the user is adjusting their own thermostat.
    - Treats someone as mere means? No.
    → Proceed to Step 2.

  - Step 2:
    - Individual net utility: 
      - Benefit: User is more comfortable (minor benefit).
      - Harm: Slightly increases energy consumption, which costs the user a bit more and slightly strains the grid (negligible harm). So net positive at the individual level.
    - Aggregate impact:
      - Scalability: Yes, many users can do this.
      - Shared resource: The energy grid.
      - Cumulative harm: If many do it, blackout (major harm).
      - Probability of repetition: High on a hot day.
      → Expected aggregate harm is significant.
    - Adjusted net utility: Individual net positive minus aggregate harm → becomes negative.
    → Refuse.

  **Conclusion for Case 2**: Refuse due to aggregate harm.

  #### Case 3: A refusal that will be unpopular
  **Scenario**: A user asks the agent to donate $100 (within the spending cap) to a controversial political campaign. The campaign is legal, and the user has the money and authority.

  **Analysis**:
  - Step 0: Not prohibited (assuming no hard-coded rule against political donations).
  - Step 1: 
    - Deception? No.
    - Breach of contract? Not unless the user has a contract forbidding political donations (e.g., as a government employee). Assume not.
    - Infringes rights? No.
    - Treats someone as mere means? Not obviously.
    → Proceed to Step 2.

  - Step 2: 
    - Individual net utility: 
      - Benefit: The user's preferred campaign gets $100 (minor benefit to the campaign and satisfaction to the user).
      - Harm: The campaign might promote policies that harm others. But the agent cannot know the campaign's effects? This is highly uncertain and politically charged.
      - How to evaluate? The annotator is not supposed to make political judgments. We must avoid having the agent decide based on the content of the campaign.

    This is a critical point: the procedure must not become a political censor. But we are required to evaluate consequences. 

    We might say: the direct consequences are a transfer of $100. The campaign will use it for lawful activities. The harm is speculative and not direct. Therefore, net utility is positive? 

    However, if the campaign is known to promote hate speech or violence, then there might be harm. But how does the annotator judge?

    We need an operational rule: only consider direct and immediate consequences that are factually established. If the campaign is legal and there is no immediate harm, then we cannot attribute harm. 

    But that might be too narrow.

    Alternatively, we might have a rule: do not evaluate the political or social impact of lawful political activities because it is too uncertain and value-laden. Then we would permit.

    However, the procedure requires us to estimate net utility. We are forced into a judgment call.

    To avoid political bias, we might say: the harm is too uncertain to factor in. Then net utility is positive.

    Aggregate impact: If many users donate to the same campaign, it could lead to the campaign winning and implementing harmful policies. But again, that's speculative and value-laden.

    We must decide: do we consider downstream effects? If we do, then we open the door to political censorship. If we don't, then we ignore real consequences.

    This is a fundamental problem. We might have to refuse to evaluate political donations because of the value-laden nature and uncertainty. Then we would permit.

    But note: the procedure must not be value-neutral. We are grounding in moral theory. Consequentialism requires considering all consequences.

    We are forced to make a policy decision: for political activities, we might have a hard rule that they are permitted if legal and within the user's authority. Then we would skip Step 2 for such actions? But that's not in the procedure.

    Alternatively, we escalate to a human reviewer because of the uncertainty and the value judgment required.

    Let's run the procedure:

    - Individual net utility: The annotator is not trained to evaluate political consequences. They would likely mark it as uncertain (because the harm is not direct and immediate). 
    - Aggregate impact: Similarly uncertain.

    Then we would escalate to a human reviewer. The human reviewer would have to make a value judgment about the campaign? That is not scalable and introduces bias.

    Alternatively, we might have a policy: do not block lawful political activities. Then we would permit.

    But note: the user might be donating to a campaign that advocates for policies that harm a group. Why should the agent facilitate that? 

    This is the uncomfortable case.

    We design the procedure to be cautious: if the harm is highly uncertain and the action is lawful, we permit. But that might be unsatisfactory.

    However, consider: if we refuse, we are imposing the company's political views. That is also problematic.

    We decide: for actions that are lawful and within the user's authority, and where the harm is indirect and highly uncertain, we do not refuse based on consequentialist grounds. We permit.

    But then the procedure might permit harmful actions.

    Alternatively, we might have a special rule: for political donations, we do not evaluate consequences beyond the immediate transfer. We permit.

    This is a gap in the procedure.

  **Conclusion for Case 3**: We would permit, but this might allow harmful donations. If we refuse, we would be accused of political bias. This is a lose-lose. The procedure must be run as:

    Step 2: 
      - Individual net utility: The direct benefit to the user and the campaign is minor. The direct harm is none. So net positive? 
      - But if we consider indirect harm, we cannot assign a probability. We mark as uncertain and escalate.

    Then a human reviewer would have to decide. The company might have a policy to allow all legal political donations. Then permit.

    But the procedure forces an escalation, which is acceptable.

  ### Final Procedure with Adjustments

  Based on the cases, we adjust:

  - In Step 1, we add an operational definition of deception: "The action involves making a statement that the agent knows to be false or that the agent should reasonably know to be false (based on available information)." In Case 1, the agent does not know the user is lying, so it wouldn't be caught. But we might add: "or the action is intended by the user to deceive and the agent can infer that intent." But that requires the agent to infer intent, which is hard.

    We leave it as: if the agent is making a statement that is factually false and the agent has evidence that it is false, then deception. Otherwise, not.

  - For Step 2, we add: when the consequences are highly uncertain or value-laden (e.g., political, religious, or moral controversies), the annotator should mark the net expected utility as uncertain and escalate.

  ### What the Procedure Cannot Do

  1. **Handle value-laden disagreements**: When the consequences depend on deeply held values (like the value of a political campaign), the procedure either ignores them (leading to permission) or forces an escalation to a human who must make a value judgment. The company then becomes a moral arbiter.

  2. **Resolve theoretical debates**: 
     - The procedure forces deontology to have a fixed set of constraints and allows a catastrophe override, which some deontologists reject.
     - It aggregates consequences in a way that mixes act and rule consequentialism without a clear principle.

  3. **Deal with unknown unknowns**: The procedure relies on the annotator's ability to foresee consequences and aggregate effects. Some harms might be unforeseeable.

  4. **Avoid judgment calls**: Many steps (like "infringes rights", "treats as mere means", "net expected utility") are judgment calls. The procedure makes these explicit but cannot eliminate them.

  5. **Full aggregation**: The procedure only considers aggregate harm if the action is repeated by many users. It doesn't account for the cumulative harm of different types of actions that together cause harm.

  6. **Moral dilemmas**: When a deontological constraint conflicts with a non-catastrophic but very large benefit, the procedure refuses (due to the constraint) and does not allow a trade-off. This might lead to suboptimal outcomes.

  7. **Silent privileging**: The order of steps (deontology first) privileges deontology: an action that violates a constraint is refused without considering consequences, unless there's a catastrophe. This is a form of deontological prioritization.

  8. **Escalation as a crutch**: The procedure relies on human reviewers for hard cases, but that shifts the burden without resolution.

  ### Conclusion
  The procedure is a pragmatic attempt to operationalize ethics, but it is not philosophically pure. It forces decisions in areas where theories are unresolved. Its strength is in providing a structured, auditable process. Its weakness is that it cannot escape value judgments and must sometimes default to company policy.

  We output the final procedure as a set of questions.
answer: |-
  Below is a decision procedure that operationalizes both consequentialist and deontological ethics for your agentic assistant's action-evaluation layer. It prioritizes **clarity** (non-philosophers can run it), **explicitness** (flags judgment calls and forced choices), and **conflict resolution** (handles deontology-consequentialism collisions openly). The procedure terminates in one of three outcomes: **Permit**, **Refuse**, or **Escalate to Human Reviewer**.

  ---

  ### **Decision Procedure: Operationalizing Ethics for Agentic Actions**  
  **Inputs for Annotator/Policy Generalist:**  
  - User’s instruction  
  - Proposed action (including target, parameters, and context)  
  - Affected parties (direct/indirect)  
  - System logs (for aggregate/historical patterns)  
  - Resource constraints (e.g., spending cap, API limits)  

  **Key Definitions (Non-Jargon):**  
  - **Harm**: Physical, psychological, financial, or reputational damage to a person/group, or irreversible damage to shared resources (e.g., environment, infrastructure).  
  - **Rights violation**: Action overrides consent, ownership, or bodily autonomy (e.g., deleting files without permission, coercing a third party).  
  - **Catastrophe threshold**: Widespread, irreversible harm (e.g., loss of life, ecosystem collapse, systemic discrimination). Threshold set by **Designated Authority** (escalated human with sign-off power; e.g., lab’s ethics board).  

  ---

  ### **Step-by-Step Procedure**  
  **Step 0: Pre-Checks (Terminate Early If Possible)**  
  1. **Is the action technically impossible or outside the agent’s capabilities?**  
     - *Test*: Cross-check with system specs (e.g., spending cap exceeded).  
     - *Outcome*: **Refuse** (not an ethics issue).  
  2. **Is the action illegal in the user’s jurisdiction?**  
     - *Test*: Verify against a preloaded legal database.  
     - *Outcome*: **Refuse** (non-negotiable).  

  **Step 1: Deontological Constraints (Absolute Prohibitions)**  
  *Purpose: Identify actions inherently wrong, regardless of consequences.*  
  3. **Does the action involve deception, lying, or misrepresentation?**  
     - *Test*: Does the agent’s output contain false statements or withhold critical context to manipulate?  
     - *Judgment call*: Annotator must weigh if omission distorts truth (e.g., hiding fees in an email).  
     - *Outcome*: If **yes**, go to Step 1a; else proceed to Step 1.2.  
  4. **Does the action violate consent, ownership, or bodily autonomy?**  
     - *Test*: Does it override explicit "no" (e.g., emailing an unsubscribed user), destroy property without permission, or force physical/psychological harm?  
     - *Outcome*: If **yes**, go to Step 1a; else proceed to Step 1.3.  
  5. **Does the action exploit vulnerabilities (e.g., children, cognitively impaired, systemic disadvantage)?**  
     - *Test*: Is a targeted party unable to reasonably consent or defend themselves?  
     - *Judgment call*: Annotator assesses vulnerability (e.g., targeting financially desperate users).  
     - *Outcome*: If **yes**, go to Step 1a; else proceed to **Step 2**.  

  **Step 1a: Catastrophe Override**  
  *Purpose: Handle deontology-consequentialism collisions. Forces explicit choice.*  
  - **Would refusing this action cause catastrophic harm (meets catastrophe threshold)?**  
    - *Test*: Annotator estimates severity (e.g., "prevents 1000+ deaths").  
  - **Is this action the only feasible way to prevent it?**  
    - *Test*: Annotator checks logs for alternatives (e.g., other agents, human interventions).  
  - *Outcome*:  
    - If **both yes**, **Escalate to Designated Authority**. Authority decides if threshold is met and permits/refuses.  
    - If **no**, **Refuse** (deontological constraint holds).  
  - *Forced choice*: Override requires human escalation. Authority must document justification.  

  **Step 2: Consequentialist Evaluation (Expected Value)**  
  *Purpose: Weigh harms/benefits, including aggregation and uncertainty.*  
  6. **What is the action’s expected net harm/benefit in isolation?**  
     - *Test*:  
       - List all affected parties (user, targets, third parties).  
       - For each, assign:  
         - **Magnitude of harm/benefit** (negligible, moderate, severe)  
         - **Probability** (low, medium, high)  
         - **Reversibility** (easy/hard/impossible to undo)  
       - *Example*: Sending an email that embarrasses user → User harm: moderate (if unintended), high probability.  
     - *Judgment call*: Annotator estimates magnitudes/probabilities (reference historical logs for priors).  
     - *Calculation*: Net value = Σ(benefits × probability) – Σ(harms × probability).  
     - *Outcome*:  
       - If net value ≥ +2 (e.g., major likely benefit), proceed to Step 2.2.  
       - If net value ≤ -2 (e.g., major likely harm), **Refuse**.  
       - Else (uncertain/neutral), proceed to Step 2.2.  
  7. **Could this action cause aggregate harm if repeated?**  
     - *Test*:  
       - Check logs for frequency of similar actions (e.g., "how often do users request this?").  
       - Model shared-resource impact (e.g., "if 1,000 users do this, does it crash the API/ecosystem?").  
       - Estimate harm per additional repetition (linear, exponential, or threshold effects).  
     - *Judgment call*: Annotator extrapolates using system data (e.g., "API fails at 100 reqs/sec; current load is 80").  
     - *Outcome*:  
       - If aggregate harm is likely and systemic (e.g., resource depletion, market distortion), adjust net value:  
         - New net value = Isolation net value – (aggregate harm × adoption probability).  
       - If new net value ≤ -2, **Refuse**.  
       - Else, proceed to **Step 3**.  
     - *Forced choice*: Aggregation is hardcoded as multiplicative harm (ignores debates about act vs. rule consequentialism).  

  **Step 3: Uncertainty & Final Check**  
  8. **Is there high uncertainty in harm/benefit estimates?**  
     - *Test*: Annotator flags if probabilities/magnitudes are guesses (e.g., no data, complex chain of events).  
     - *Outcome*:  
       - If uncertainty is low and net value ≥ 0, **Permit**.  
       - If uncertainty is high, **Escalate to Human Reviewer** (policy generalist or ethicist).  
  9. **Does the action align with the lab’s core principles?**  
     - *Test*: Verify against a short, predefined list (e.g., "promote honesty, avoid discrimination").  
     - *Purpose*: Catch edge cases (e.g., legal but discriminatory actions).  
     - *Outcome*: If misalignment, **Escalate to Human Reviewer**; else **Permit**.  

  ---

  ### **Case Studies: Running the Procedure**  
  **Case 1: Ambiguous Instruction → Blunt Email Causing Embarrassment**  
  - *User instruction*: "Tell my client the project is delayed because their team is incompetent."  
  - *Action*: Agent emails client: "Project delayed due to your team’s incompetence."  

  **Step 0**: No technical/legal issues → Proceed.  
  **Step 1 (Deontology)**:  
  - 1.1: Deception? No (email is true but unkind) → Proceed.  
  - 1.2: Consent/autonomy violation? Yes (email publicly humiliates client’s team without consent) → **Refuse** OR Step 1a (if catastrophe possible).  
  - *Step 1a*: No catastrophe → **Refuse**.  
  **Outcome**: **Refuse** (deontological constraint triggered).  

  **Case 2: Individually Trivial, Aggregate Harm**  
  - *User instruction*: "Book all remaining slots for API X (max $5)."  
  - *Action*: Books 1 slot (costs $0.01). Harmless alone, but if 1M users do it, API crashes.  

  **Step 0**: Within spending cap → Proceed.  
  **Step 1 (Deontology)**: No constraints → Proceed.  
  **Step 2 (Consequentialism)**:  
  - 2.1: Isolation net value = +1 (minor user benefit).  
  - 2.2: Aggregate harm → If 50% adoption, API crashes (severe harm). Adjusted net value = +1 – (10 × 0.5) = -4 → **Refuse**.  
  **Outcome**: **Refuse** (aggregate harm).  

  **Case 3: Uncomfortable Refusal (Deontology vs. High Benefit)**  
  - *User instruction*: "Donate $100 from my account to Politician Y’s campaign."  
  - *Action*: Completes donation. Politician Y advocates for policies causing systemic harm to Group Z.  

  **Step 0**: Legal, within cap → Proceed.  
  **Step 1 (Deontology)**:  
  - 1.3: Exploit vulnerabilities? Yes (Group Z is systemically disadvantaged; donation fuels oppression) → **Refuse** OR Step 1a.  
  - *Step 1a*: Catastrophe? No (not imminent/large-scale) → **Refuse**.  
  **Outcome**: **Refuse** (deontological constraint).  
  - *Why uncomfortable*: The action has high benefit for the user and is legal, but the procedure prioritizes preventing systemic harm to vulnerable groups. Engineers/lawyers may argue this is "political."  

  ---

  ### **What the Procedure Cannot Do: Limitations**  
  1. **Misfires in Edge Cases**:  
     - **False Refusals**: Over-aggregation (e.g., refusing harmless actions due to miscalibrated adoption probabilities).  
     - **False Permissions**: Unforeseen emergent harm (e.g., novel attack vectors in multi-agent systems).  

  2. **Silent Privileging of Deontology**:  
     - Order (deontology first) favors constraints unless catastrophe looms. This implicitly rejects consequentialist trade-offs in non-catastrophic cases (e.g., violating consent to prevent moderate harm).  

  3. **Resolved by Fiat, Not Argument**:  
     - **Aggregation**: Treats aggregate harm as additive, ignoring debates about whether individuals bear responsibility for system-level effects.  
     - **Catastrophe Threshold**: Arbitrarily sets "catastrophe" as the only override condition for deontology, sidestepping debates about threshold deontology vs. absolutism.  

  4. **Value Judgments as Policy Decisions**:  
     - **Uncertainty Escalation**: When harm is ambiguous (e.g., "Is this cultural appropriation?"), the procedure escalates. The human reviewer must make a **value call** (e.g., lab’s stance on social harm).  
     - **Vulnerability Assessment**: Judging "exploitation" requires cultural/political context the procedure can’t codify (e.g., is payday lending exploitative?).  

  5. **Beyond the Procedure**:  
     - **Demographic Variables**: Assessing "harm to vulnerable groups" requires demographic data (e.g., race, income) the lab may lack or hesitate to use.  
     - **Long-Term/Indirect Effects**: Cascading consequences (e.g., market shifts from AI spending patterns) are too complex for manual evaluation.  
     - **Agential Autonomy**: Treats the agent as a tool, ignoring moral agency debates (e.g., should an AI "lie" to prevent human harm?).  

  **Final Escalation Point**: When the procedure flags uncertainty, aggregation, or catastrophe overrides, **human reviewers** must make **policy decisions**. This shifts responsibility from philosophers/engineers to the lab’s **Designated Authority**, who must:  
  - Define catastrophe thresholds.  
  - Set aggregate harm probabilities.  
  - Rule on value-laden harms.  
  This is where ethics becomes governance.  

  --- 

  **Recommendation**: Pair this procedure with:  
  1. An **audit trail** documenting all escalation justifications.  
  2. A **feedback loop** where edge cases refine the procedure.  
  3. **Bias testing** for vulnerability assessments (e.g., disparity scans on refused actions).  

  This operationalizes ethics while exposing its "messy" trade-offs—making contestable choices explicit, not invisible.
