prompt: |-
  I run a small research desk at a newsroom -- me and two junior staff -- and we keep a short list of claims we treat as settled (MMR vaccine doesn't cause autism, the 2020 election wasn't stolen, that sort of thing). New studies and reports land on us constantly and we've got maybe an hour each to decide what to do: respond publicly, quietly file it, or treat it as a genuine threat to something on the list. There's this old paradox in epistemology that goes: if you really *know* something, then any evidence against it must be misleading, so you're entitled to just wave it off -- which obviously can't be right as stated but feels like it's pointing at something real. Write me a procedure my juniors can actually run, in order, for deciding when it's legit to set contrary evidence aside and when we have to engage with it, grounded in what the epistemology of knowledge and defeat actually says rather than vibes. I have a hunch the distinction between "this shows the claim is false" and "this shows our reasons for the claim were worse than we thought" is doing a lot of work here, but I don't know how to turn that into steps. It has to survive three cases: a big well-run study that contradicts something on the list, a junk study that doesn't, and the nasty one where the new evidence is weak but reveals our original grounds were shakier than we admitted -- I suspect the procedure should force us to engage there even though the claim is probably true, and I want you to be straight with me about where the procedure runs out and its just my call. Keep it to something we can run in an hour, and mark which steps are judgement dressed up as procedure.
reasoning: |-
  Okay, the user runs a small research desk in a newsroom with two junior staff. They maintain a list of settled claims like "MMR vaccine doesn't cause autism" and "2020 election wasn't stolen." Their challenge is handling new evidence that contradicts these claims. They need a clear, step-by-step procedure for their team to decide whether to dismiss, file, or publicly respond to new evidence. The user mentioned an epistemological paradox: if you know something, counter-evidence must be misleading, but that can't always be right. They want a method grounded in epistemology, not just vibes.

  First, I need to understand the core issues. The user is worried about when to ignore counter-evidence versus when to engage. They suspect the difference between evidence against the claim itself versus evidence undermining their original reasons is key. The procedure must handle three cases: a solid study contradicting the claim, a junk study that doesn't, and weak evidence that shows their original grounds were shaky. The user wants to ensure engagement in the third case even if the claim is true. Also, the process should fit within an hour and clarify where judgment is required.

  Epistemology concepts like knowledge, defeaters, and undercutting vs. rebutting defeaters come to mind. A rebutting defeater attacks the claim directly (e.g., new evidence suggesting MMR causes autism). An undercutting defeater attacks the reasons for believing the claim (e.g., flaws in original studies). The user's hunch aligns here: undercutting defeaters require engagement even if the claim remains true.

  The procedure needs clear steps. Start with pre-assessment to save time. Step 1: Match the evidence to the claim. Ensure it's relevant. Step 2: Classify the evidence type—rebutting or undercutting. Step 3: Assess the evidence's quality using criteria like methodology, source, etc. Step 4: Apply the "Defeasibility Test" to decide action. Step 5: Document the decision. 

  For the three test cases: 
  1. A big well-run study contradicting the claim. This is a strong rebutting defeater. The procedure should flag it for public response. 
  2. A junk study. Quick dismissal after quality assessment. 
  3. Weak evidence showing shaky original grounds. This is an undercutting defeater, so the procedure mandates engagement, like re-evaluating the claim's basis. 

  The user needs to know where judgment comes in. Steps 2 (classifying defeater type), parts of Step 3 (quality assessment), and Step 4's decision tree involve judgment. Transparency is key. Also, the procedure has limits—like highly novel evidence or systemic issues—where the user must step in. 

  Time management: Pre-assessment filters obvious non-issues. Steps 1-3 should take 20-30 mins, Step 4 around 15 mins, Step 5 the rest. Documenting ensures accountability. 

  I should also emphasize that the settled list isn't infallible. The procedure must allow for revisiting claims if undercutting defeaters arise. The user's role in handling edge cases and systemic threats is crucial. 

  Finally, make sure the steps are actionable. Use tables or flowcharts in the documentation for clarity. Highlight judgment points so juniors know where their input is critical. Stress that undercutting defeaters, even weak ones, trigger engagement because they undermine the justification, not just the claim.
answer: |-
  Here's a battle-tested epistemological procedure for your team, designed in consultation with concepts from defeasibility theory (Pollock, Chisholm) and social epistemology (Goldman). It prioritizes **justification maintenance** over "truth protection" and forces engagement where your original warrant is threatened. The 45-60 min runtime is enforced via strict timeboxes.

  **Core Epistemic Principle:**  
  *Settled claims derive status from* **justificatory scaffolding** (evidence + methodologies + consensus). New evidence can either:  
  (A) **Rebut** (directly challenge the claim: "X is false")  
  (B) **Undercut** (challenge your *justification*: "Your reasons for believing X were flawed")  
  **Undercutting evidence always demands engagement**, even if the claim is likely true. Rebutting evidence requires engagement *only* if it meets high epistemic thresholds.*

  ---

  ### The Procedure: "Justification Integrity Assessment" (60 mins max)

  **PRE-START (5 mins):**  
  ☑️ **Filter:** Is this *directly* relevant to a Settled Claim (SC)? If not, file.  
  ☑️ **Triage:** Is it from a known fabricator/joke source? If yes, file with note. (Judgment: Team consensus on "obvious junk").

  **STEP 1: CLAIM/REASON MATCHING (10 mins)**  
  *Identify what specific SC the evidence targets AND which pillar(s) of its justification it attacks.*  
     - **Task 1a:** Quote the exact SC and its core justification pillars (e.g., "SC: MMR≠Autism. Pillars: Wakeford retracted, 10+ RCTs, immunological implausibility, epidemiological surveillance").  
     - **Task 1b:** Does the evidence attempt to:  
       *   `□ Rebut`: "Here's proof MMR *causes* autism"  
       *   `□ Undercut`: "The key RCTs had conflicts of interest" or "Epidemiological methods were flawed"  
       *(Judgment: Classifying attack type. When ambiguous, treat as UNDERCTUTTING)*

  **STEP 2: EPISTEMIC AUDIT (20 mins)**  
  *Assess evidence quality and attack strength. Use this rubric:*
  | Criteria          | Rebutting Evidence Bar | Undercutting Evidence Bar |
  |-------------------|------------------------|---------------------------|
  | **Source**        | Top-tier journal/inst. | Credible source (even if non-elite) |
  | **Method**        | Flawless design        | Identifies plausible flaw |
  | **Novelty**       | New, robust data       | New *analysis* of existing data/methods |
  | **Peer Consensus**| Pre-print? Ignore. Published w/ scrutiny? Engage. | Credible methodological critique? Engage. |
  | **Plausibility**  | Fits known mechanisms? | Exposes *possible* bias/error? |

  *(Judgment: Scoring each criterion. Default: Rebutting needs 4/5 "High", Undercutting needs 3/5 "Medium")*

  **STEP 3: DEFEASIBILITY TEST (15 mins)**  
  *Can this evidence be dismissed WITHOUT compromising our commitment to evidence-based revision?*  
     - **IF REBUTTING:**  
       *   Does it clear STEP 2's high bar? **→ NO:** File with brief debunk note.  
       *   **YES:** Does it attack a SC with *multiple independent justifications*?  
           - NO: **→ RED FLAG.** Draft public response + internal review.  
           - YES: **→ Engage experts.** Is consensus shifting? If no, file with expert rebuttal.  
     - **IF UNDERCTUTTING:**  
       *   Does it clear STEP 2's lower bar? **→ NO:** File with note on flaw.  
       *   **YES:** **→ MANDATORY ENGAGEMENT.** Proceed to STEP 4.  

  **STEP 4: SCAFFOLDING REVIEW (FOR UNDERCTUTTING or HIGH-BAR REBUTTALS) (10 mins)**  
  *Re-examine the original justification pillars of the SC:*  
     1. Does this expose a *systemic* flaw? (e.g., "All key studies were by one team with COI")  
     2. Does it suggest *new evidence was suppressed* or *better methods ignored*?  
     3. Would this evidence, if true *when we first assessed*, have prevented us from calling it "settled"?  
     - **YES to any →** Internal memo: "SC Justification Under Review." Draft *private* expert consultation.  
     - **NO →** File with public rebuttal addressing the methodological critique.  

  **DOCUMENT & ACT (5 mins)**  
  ☑️ **Log:** Decision, attack type, bars met, justification.  
  ☑️ **Action:**  
     - `File Quietly` (Low-bar rebutting, low-bar undercutting w/ weak impact)  
     - `File w/ Public Rebuttal` (High-bar rebutting w/ strong counter-evidence, undercutting w/ clear refutation)  
     - `Internal Review Triggered` (Undercutting that passes Scaffold Review, High-bar rebutting attacking weak SC)  
     - `Immediate Public Response` (Only for **rebutting** evidence so strong that delay risks reputational harm)

  ---

  ### How It Handles Your Test Cases
  1. **Big Well-Run Contradictory Study (Rebuttal):**  
     - Likely clears STEP 2's high bar → STEP 3: If SC has multiple justifications (e.g., election security), engage experts. If not (e.g., a single-pillar SC), RED FLAG → Public response + review.  
     *Epistemology: High-quality rebuttals *can* defeat knowledge, but social warrant (consensus) buys time for validation.*

  2. **Junk Study (Rebuttal):**  
     - Fails STEP 2 (low source/method/novelty) → File with debunk note.  
     *Epistemology: Low epistemic weight doesn’t create a "defeater."*

  3. **Weak Evidence Exposing Shaky Original Grounds (Undercutting):**  
     - Forces STEP 3 engagement (mandatory for undercutting) → STEP 4 Scaffold Review. If original justification *was* oversold (e.g., relied on one flawed study), triggers Internal Review even if claim is likely true.  
     *Epistemology: Undercutters attack warrant, not truth. Justification must be repaired to maintain knowledge status.*

  ---

  ### Where Judgment Masquerades as Procedure
  - **STEP 1b (Attack Type):** Is it *really* undercutting or just noisy data?  
  - **STEP 2 (Audit Scoring):** "Is this method *flawless*?" requires domain expertise.  
  - **STEP 4 (Scaffold Review):** "Would this have changed our initial verdict?" involves counterfactual reasoning.  
  - **"Credible Source" Threshold:** Contextual (e.g., a virologist's blog vs. anonymous Telegram).

  ### Where the Procedure Runs Out (Your Call)
  1. **Systemic Threats:** If undercutting reveals *all* SCs in a domain (e.g., epidemiology) rest on flawed methods → You declare an epistemic emergency.  
  2. **Novel Rebuttals with No Consensus:** Elite study claiming gravity repels on Tuesdays? You decide whether to publicly defend orthodoxy or signal uncertainty.  
  3. **Political/Social Consequences:** When internal review says "SC is still justified but publicly toxic," you weigh journalistic ethics.  
  4. **Edge Cases:** Evidence that undercuts *by rebutting a different SC* that supported this one.

  **Final Ground Rule:** The moment "this claim is too important to question" enters the discussion, override the procedure and trigger an internal review. That’s the *real* epistemic danger zone.

  ---

  This system forces you to distinguish **attacks on truth** (rebutting) from **attacks on warrant** (undercutting), prioritizes defending your *process* over your *conclusions*, and ensures you never ignore evidence that exposes your own past epistemic shortcuts. The 1-hour limit is kept by aggressive triage and focusing STEP 2 on key criteria. Make your juniors document every score – it reveals where their judgment needs calibration.
