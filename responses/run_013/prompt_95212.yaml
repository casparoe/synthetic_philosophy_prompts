answer: |-
  ### Exam Question  
  **Causation in Constrained Systems**  

  A research team studies thin-film photovoltaic devices. In the absorber layer, two quantities—dopant concentration (*D*) and grain-boundary defect density (*B*)—are thermodynamically chained during film growth. It is physically impossible (even in principle) to alter *D* while holding *B* fixed, or vice versa. Both *D* and *B* exhibit strong, reliable correlations with the open-circuit voltage (*V*) of the finished device. A colleague claims: "Raising *D* causes the increase in *V*."  

  **Your Tasks:**  
  1. **Theoretical Analysis**: Do the counterfactual-dependence and interventionist accounts of causation deliver the same verdict about the colleague’s claim? If they diverge, identify the specific feature of each account responsible for the divergence.  
  2. **Epistemological Critique**: Does the divergence (if any) suggest that the interventionist framework is primarily an account of *how we discover or explain* causal relationships rather than an account of *what causation is*? Justify your answer.  
  3. **Personal Verdict**: State and defend your own position on whether *D* causes *V* in this scenario.  

  ---  
  ### Model Answer (700 words)  

  #### 1. Theoretical Analysis  
  The counterfactual-dependence and interventionist accounts diverge sharply here.  

  - **Counterfactual-dependence** would likely endorse the colleague’s claim. This account holds that *C* causes *E* if, had *C* not occurred, *E* would not have occurred. Here, if we imagine a world where *D* is lower (holding all else equal), *V* would decrease due to the robust correlation. Crucially, this framework *ignores feasibility*: it permits hypothetical changes to *D* alone, even if physically impossible, as long as the dependency holds. Thus, it concludes raising *D* causes *V*’s increase.  

  - **Interventionism** rejects the claim. It defines causation through ideal interventions: *C* causes *E* if an intervention that changes *C* while holding all other variables fixed (except *E*’s descendants) would change *E*. However, an intervention on *D* alone is physically impossible—altering *D* necessarily alters *B* due to thermodynamic constraints. Since we cannot isolate a change in *D* from *B*, we cannot determine whether *D* directly affects *V* or if *B* (or both) is responsible. The account thus returns an "indeterminate" verdict or denies *D* causes *V*.  

  **Divergence Source**:  
  - Counterfactual-dependence relies on *logical possibility* of hypotheticals.  
  - Interventionism requires *physical possibility* of interventions.  

  #### 2. Epistemological Critique  
  The divergence reveals interventionism’s epistemic orientation. Interventionism focuses on *testability*: it defines causes through what we can *manipulate and observe* in experimental settings. By requiring interventions to be physically possible, it prioritizes empirical accessibility. This suggests interventionism is fundamentally an account of *causal discovery* or *explanation*—it tells us how to verify causal claims via controlled changes—not a metaphysical account of causation itself. If causation were purely ontological, interventions should not be constrained by contingent physical laws (e.g., thermodynamics). Here, interventionism’s inability to assign causation due to physical constraints exposes its methodological core: it is a tool for *inferring* causation from actionable evidence, not a description of what causation *is* in the world.  

  #### 3. Personal Verdict  
  I reject the colleague’s claim that *D* causes *V*. Causation requires distinctness of cause and effect, but *D* and *B* are entangled by thermodynamic law. They function as a *single causal unit*: variations in *V* are produced by shifts in the *D-B* system, not *D* alone. Even if counterfactual dependency exists, it is an artifact of ignoring physical constraints. In real science, causal claims must account for boundary conditions; here, *D* cannot be meaningfully isolated as an independent driver. The correlation likely arises because *D* and *B* jointly reflect an underlying film-growth parameter (e.g., deposition temperature), which is the true cause of *V*. Thus, the colleague’s claim oversimplifies the ontology. Interventionism correctly flags this by demanding isolability, aligning with scientific practice: if you cannot manipulate a variable independently, you cannot confirm its causal role.  

  ---  
  ### Marking Scheme (20 marks total)  
  | **Move**                                                                 | **Marks** | **Common Error**                                                                 |  
  |---------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|  
  | **1. Correctly identifies divergence** (Counterfactual: yes; Interventionist: no/indeterminate) | 5 | Fails to specify *why* interventionism rejects the claim (e.g., omits physical impossibility of isolating *D*). |  
  | **2. Pinpoints source of divergence**: Counterfactuals allow logically possible (but physically impossible) worlds; Interventionism requires physically possible interventions. | 4 | Vaguely references "different definitions" without contrasting modalities (logical vs. physical possibility). |  
  | **3. Argues interventionism prioritizes epistemology**: Links its indeterminacy to its focus on testability/manipulation, not metaphysics. | 5 | Asserts interventionism is "wrong" without explaining how its design serves discovery. |  
  | **4. Defends personal verdict** (regardless of conclusion) with physics-aware reasoning. | 4 | Appeals to intuition without engaging constraints (e.g., "D obviously causes V because they correlate"). |  
  | **5. Distinguishes causation from correlation** in the constrained system (e.g., notes *D-B* entanglement or third variables). | 2 | Treats correlation as sufficient for causation, ignoring stipulated inseparability. |  

  ---  
  **Note to Examiner**:  
  - A "first-class" answer (17–20 marks) must hit all 5 moves, with particular emphasis on #1–3.  
  - Task weighting: #1 (9 marks), #2 (5 marks), #3 (6 marks).  
  - Common pitfalls include conflating accounts, overlooking physical constraints, or misrepresenting interventionism as purely metaphysical.
