prompt: |-
  I work at a jobcentre-style welfare office and several times a day my job is to decide whether to start a sanction — cut someone's benefit for a few weeks — because they didn't do what the conditions say (missed a work-search appointment, turned down a job, didn't apply to enough places). I've got maybe fifteen minutes per case and no philosophy training, my supervisor has to sign off on anything unusual, and there's an appeals process, so I have to be able to write down why. Right now we basically go by the rulebook, which is "did they fail to comply, yes/no", and I've started to feel sick about it.

  I want you to turn the philosophical work on the 'undeserving poor' into a decision procedure I can actually run on a case, question by question, in order. Build it around three things I keep tripping over. First, the difference between desert in the strict sense — where someone only deserves blame if the failure was under their control and they had a real alternative — and reciprocity, where the claim is that support is owed to people who work and can be pulled from people who won't, whether or not they could. Second, the difference between me assessing what this person deserves and me assessing what the policy is justified in doing to them; I want those kept seperate even where they end up giving the same answer. Third, the way a category like 'undeserving' gets built administratively and quietly lumps together people who defrauded us, people who are just idle, people who are unlucky, and people who are ill or illiterate and can't navigate the forms — I want the procedure to force the case into one of those boxes or to say it can't.

  For each question, say what counts as a sufficient answer, which ones are factual and which are value judgments I'm not the right person to make, and exactly where the procedure should stop and hand the decision to a human instead of deciding. Then run it on three cases: a guy who missed two appointments because the letters went to an old adress, a woman who turned down a shift because it clashed with caring for her mother and didn't tell us in time, and someone who did apply for jobs but only ones he knew he'd never get — and be honest if the procedure says to sanction any of them. Tell me what the procedure can't do, where it'll misfire, and which of my questions it turns out never had a factual answer.

  And don't hedge. Take a definite position on whether the control condition should be built into the sanction rule and defend it, even if that makes the procedure harder to run and gives me answers I don't want.
reasoning: |-
  Okay, let me start by understanding the user's situation. They work at a welfare office and have to decide on sanctions, which is causing them moral distress. The main issues they're grappling with are the concepts of desert versus reciprocity, separating personal desert from policy justification, and the administrative lumping of diverse cases into "undeserving poor."

  First, I need to break down the philosophical aspects into a practical decision procedure. The user wants a step-by-step process that can be applied in 15-minute case reviews. They mentioned three key areas: control and alternatives (desert), the difference between deserving blame versus policy-driven sanctions (reciprocity), and categorizing the reasons for non-compliance accurately.

  The user’s explicit needs are clear: a structured, sequential procedure that addresses their three tripping points. But their deeper needs might include reducing moral discomfort, feeling justified in their decisions, and ensuring fairness despite systemic constraints. They might also need validation that their unease is legitimate and a way to navigate it within their job limitations.

  Next, I consider desert versus reciprocity. Desert requires control and alternatives, which aligns with moral responsibility. Reciprocity is about societal rules, regardless of individual capability. The procedure must separate these. For each case, the user should first assess desert (control) and then policy justification (reciprocity), even if outcomes align. This separation addresses their second concern.

  For categorizing non-compliance, the procedure needs explicit categories: Unavoidable Failure, Avoidable Failure (subdivided into Unwilling, Unable, and Unaware), and Fraud. This prevents lumping different issues together. Each case must fit a category, or the decision gets escalated.

  The decision procedure steps should start with verifying non-compliance factually. Then, assess desert by checking control and alternatives. If no desert, move to policy justification under reciprocity. Here, the key is whether the person could reasonably comply. If not, no sanction; if yes, then categorize the reason. Unavoidable failures halt sanctions, while others proceed but allow mitigating factors.

  In the examples, the guy with old addresses falls into Unavoidable Failure due to system error—no sanction. The woman with caring responsibilities is Avoidable but Unable; she had control but valid reasons. Policy might still sanction due to lack of notice, but mitigation reduces it. The selective applicant is Avoidable and Unwilling; sanction applies under reciprocity.

  The procedure’s limitations: factual gaps require escalation. Control and alternatives involve judgment calls, especially on mental capacity. The "reasonableness" in reciprocity is value-laden, needing supervisor input. Systemic issues like form complexity aren’t handled here.

  On whether control should be part of sanctions: I argue yes. Sanctions without desert are ethically questionable and pragmatically ineffective. Reciprocity alone risks punishing those who can’t comply. Including control aligns with fairness, even if it complicates the process.

  User’s deeper needs: They want to reduce guilt by ensuring decisions are justifiable. The procedure provides structure, separates moral assessment from policy, and forces explicit categorization, addressing their unease. It also identifies where human judgment is necessary, validating their role beyond the rulebook.
answer: |-
  Here's a decision procedure based on your needs, designed for 15-minute case reviews. It explicitly separates desert from policy justification, forces categorization of *why* non-compliance occurred, and flags cases requiring human escalation. It prioritizes **desert (control & alternatives)** as the primary ethical hurdle before considering **policy justification (reciprocity)**.

  **Core Principles:**
  1.  **Desert First:** A sanction is only *deserved* if the individual **had control** over the failure and **had a genuine alternative** to complying.
  2.  **Policy Justification Separate:** Policy (reciprocity) *may* justify a sanction even if undeserved (e.g., to incentivize others, protect funds), but this requires a distinct justification step.
  3.  **Mandatory Categorization:** The reason for non-compliance *must* be explicitly categorized: **Unavoidable Failure, Avoidable Failure (Unwilling, Unable, Unaware), Fraud, or Unclear (Escalate)**. "Lumping" is prohibited.
  4.  **Escalation Triggers:** Lack of key facts, ambiguous control/capacity, or systemic failures require escalation to a supervisor *before* a sanction decision.

  **The Desert & Justification Procedure (DJP)**

  **Step 1: Verify Non-Compliance (Factual)**
  *   **Question:** Did the individual demonstrably fail to meet a clearly communicated, specific condition of their benefit agreement? (e.g., Missed appointment X on date Y, declined job offer Z on date A, submitted only B applications instead of required C).
  *   **Sufficient Answer:** Clear evidence (signed agreement, appointment record, job offer details, application log) shows a specific, documented requirement was not met. *If insufficient evidence, STOP & escalate.*
  *   **Factual?** Yes. This is about documented actions vs. requirements.
  *   **Outcome:** If "No," case closed (no sanction). If "Yes," proceed to Step 2.

  **Step 2: Assess Desert (Control & Alternatives)**
  *   **Question 2a (Control):** Was the failure primarily due to factors genuinely **beyond the individual's reasonable control** at the time the action/inaction was required?
      *   *Consider:* Acute illness/incapacity (medical evidence?), severe transport failure (proof?), system error (e.g., letter sent to wrong address), coercion, immediate caring emergency preventing communication *at that moment*.
  *   **Question 2b (Alternatives):** Did the individual have a **genuine, feasible alternative** to non-compliance that they could reasonably have been expected to take?
      *   *Consider:* Could they have rescheduled/canceled the appointment *beforehand*? Could they have communicated the problem *in a timely manner*? Were there alternative job applications they could have made? Was refusing the job the *only* reasonable option (e.g., unsafe, illegal wages, physically impossible)?
  *   **Sufficient Answer:** Requires evidence or plausible testimony. If plausible doubt exists about control or alternatives, STOP & escalate for investigation/assessment.
  *   **Factual?** **Judgment Call (Requiring Evidence).** Determining "reasonable control" and "feasible alternative" involves interpreting circumstances and capacity. It's factual *insofar as evidence exists*, but assessing reasonableness involves judgment. Lack of evidence = escalate.
  *   **Outcome:**
      *   If **Yes (2a: Beyond Control)** OR **No (2b: No Feasible Alternative)**, then the individual **does NOT deserve blame/sanction** based on desert. Proceed to Step 3 (Policy Justification).
      *   If **No (2a: Within Control)** AND **Yes (2b: Feasible Alternative Existed)**, then the individual **may deserve blame/sanction** based on desert. Proceed to Step 4 (Categorization).

  **Step 3: Policy Justification (Reciprocity - For Cases NOT Deserving)**
  *   **Question:** Despite the lack of desert (Step 2 outcome), does applying the sanction policy *in this specific case* serve a necessary and proportionate purpose for the welfare system based on reciprocity (e.g., maintaining system integrity, ensuring fairness to compliant claimants, deterring *avoidable* non-compliance generally)?
  *   **Sufficient Answer:** Requires reasoning why applying the rule *here*, even undeservedly, is necessary for the system. *This is a value judgment.* If the case involves systemic failure (e.g., admin error) or severe vulnerability, justification is weak. If it involves blatant disregard *despite* capability, justification is stronger.
  *   **Factual?** **NO. Value Judgment.** You are assessing the policy's purpose, not the individual's fault. *You are not the final arbiter here.* **This step ALWAYS requires supervisor sign-off.** Your role is to present the facts (non-compliance proven, desert lacking per Step 2) and argue for/against justification based on system needs.
  *   **Outcome:**
      *   If justification is strong *and* supervisor agrees, proceed to Step 4 (Categorization) *then* sanction.
      *   If justification is weak/absent *or* supervisor disagrees, NO SANCTION.

  **Step 4: Mandatory Categorization (For Cases Proceeding to Sanction)**
  *   **Question:** Based on the evidence, which category *best* explains the failure?
      *   **A. Unavoidable Failure:** Failure demonstrably caused by external, uncontrollable factors (e.g., sudden hospitalization, natural disaster, verified admin error *by the office*). *(Result of Step 2/3: Sanction only if Step 3 justified)*
      *   **B. Avoidable Failure - Unwilling:** Failure due to deliberate choice, lack of effort, or refusal *without* valid justification, where control/alternatives existed (e.g., chose not to attend appointment, refused suitable job out of preference, deliberately applied to impossible jobs). *(Result of Step 2: Desert likely found)*
      *   **C. Avoidable Failure - Unable:** Failure due to personal limitations *despite* effort/desire, where control/alternatives were constrained but *technically* existed. Requires evidence of the barrier (e.g., mental health crisis disrupting organization, literacy issues causing form errors, caring responsibilities causing scheduling conflicts *despite attempts to manage*). *(Result of Step 2: Desert may be absent; Step 3 may apply)*
      *   **D. Avoidable Failure - Unaware:** Failure due to genuine misunderstanding of requirements *not* caused by negligence, where better communication/understanding was possible (e.g., complex rule misinterpreted, notification missed due to temporary housing instability). *(Result of Step 2: Desert likely absent; Step 3 may apply)*
      *   **E. Fraud:** Intentional deception to avoid requirements (e.g., lying about job applications, falsifying documents). *(Result of Step 2: Desert found)*
      *   **F. Unclear:** Evidence is contradictory, incomplete, or the case doesn't neatly fit above. **STOP & Escalate.**
  *   **Sufficient Answer:** Must assign *one* primary category (A-F) based on preponderance of evidence. Requires brief justification referencing evidence.
  *   **Factual?** **Judgment Call (Requiring Evidence).** Categorizing the *reason* involves interpreting motives and capabilities based on facts. Lack of clarity = F (Unclear).
  *   **Outcome:** Category assigned. **Crucially:** Category informs *mitigation* and *appeal risk* but **does not automatically change sanction decision** if you've reached this step (sanction is proceeding). However:
      *   Categories **A (Unavoidable)** & **F (Unclear)** should *rarely* reach this step if Steps 2/3 followed properly (should result in no sanction or escalation).
      *   Categories **C (Unable)** & **D (Unaware)** strongly suggest sanction severity should be minimized (if policy allows) and support offered, as desert is weak.
      *   Category **B (Unwilling)** aligns with strongest desert/policy justification.
      *   Category **E (Fraud)** is severe and may trigger separate processes.

  **Step 5: Decision & Record**
  *   State: Sanction / No Sanction.
  *   State the basis concisely:
      *   If no sanction from Step 1 or Step 2: "No proven failure" or "Failure not within claimant's reasonable control / no feasible alternative existed (No Desert)."
      *   If no sanction from Step 3: "Failure proven, but sanction unjustified under policy reciprocity principles per supervisor decision [Date]."
      *   If sanction: "Failure proven within claimant's control with feasible alternative (Desert)" OR "Failure proven, sanction applied under policy reciprocity despite mitigating circumstances per supervisor decision [Date]. Category: [B/C/D/E]."
  *   Record key evidence points and categorization.

  **Definite Position on Control:** **Yes, the control/alternatives condition (Desert) *must* be built into the sanction rule ethically.** Sanctioning someone for things truly beyond their control is punishment for misfortune, not responsibility. It undermines the system's moral legitimacy and is pragmatically ineffective (you can't deter unavoidable events). While reciprocity (Step 3) provides a *possible* policy justification *despite* lack of desert, it should be the exception, requiring higher scrutiny (supervisor sign-off), not the rule. Making the procedure harder is the price of avoiding unjust punishment.

  **Application to Cases:**

  1.  **Missed Appointments (Old Address):**
      *   Step 1: Yes, non-compliance (missed appointments).
      *   Step 2a (Control): **YES.** Failure primarily due to office/system error sending letters to old address (beyond his control *if* he updated his address properly and *if* the office failed to use it). *Requires verification he provided new address.*
      *   Step 2b (Alternatives): N/A (Control lost). **Result: NO DESERT.**
      *   Step 3 (Policy Justification): Applying sanction serves *no* legitimate purpose; failure caused by system error. Justification weak/absent. **Supervisor should reject sanction.**
      *   Step 4: If somehow sanctioned (shouldn't be), **Category A (Unavoidable Failure)**.
      *   **Procedure Outcome: NO SANCTION.**

  2.  **Turned Down Shift (Caring Conflict, Late Notice):**
      *   Step 1: Yes, non-compliance (turned down offered work without sufficient timely notice as required).
      *   Step 2a (Control): **NO.** The *decision* to prioritize caring (though understandable) was likely within her control *at the moment*.
      *   Step 2b (Alternatives): **YES.** She had the feasible alternative of *contacting the job/agency/you immediately* to explain the conflict *before* or *when* declining, seeking adjustment, or exploring alternatives (as likely required by her agreement). Failing to do *that* was the core compliance failure.
      *   **Result: DESERT POSSIBLE (Control + Alternatives existed for *communication*).**
      *   Step 4: **Category C (Avoidable Failure - Unable).** The caring responsibility was the barrier preventing *timely communication/alternative arrangement*, even if the *refusal itself* was deliberate. She was "unable" to meet the *communication* requirement due to the crisis.
      *   *Proceeds to Sanction based on Desert.* **However:** Category C (Unable) strongly warrants mitigation (reduced sanction duration/severity if policy allows) and urgent discussion of carer support.

  3.  **Applied Only to Unattainable Jobs:**
      *   Step 1: Yes, non-compliance (if the requirement is to make *genuine* applications to *suitable/attainable* jobs, not just any jobs).
      *   Step 2a (Control): **NO.** Choosing *which* jobs to apply for is within his control.
      *   Step 2b (Alternatives): **YES.** He had the feasible alternative of applying to jobs he was reasonably qualified for and had a chance of getting, as required.
      *   **Result: DESERT FOUND (Control + Alternatives).**
      *   Step 4: **Category B (Avoidable Failure - Unwilling).** Appears to be deliberate avoidance of actual work search effort. (Needs checking: is there evidence of mental health issues/undiagnosed barriers suggesting Category C? If suspicion, escalate before Step 4).
      *   **Procedure Outcome: SANCTION.**

  **What the Procedure Can't Do & Where It Misfires:**

  1.  **Factual Gaps are Fatal:** It relies on available evidence within 15 mins. Missing info on control/alternatives/category *forces* escalation, potentially delaying decisions. It won't magically find facts.
  2.  **Judgment Calls are Hard:** Assessing "reasonable control," "feasible alternative," "genuine misunderstanding," or "deliberate unwillingness" vs. "inability due to barrier" involves significant, potentially error-prone, human judgment based on limited interaction and evidence. Training is crucial.
  3.  **"Reasonableness" in Reciprocity is Value-Laden:** Step 3 (Policy Justification) explicitly requires a value judgment about the system's needs that you are not empowered to make alone. Supervisor sign-off is essential but doesn't remove the ethical tension.
  4.  **It Doesn't Fix Systemic Problems:** If forms are too complex (creating Category D), jobs unsuitable, or support lacking (exacerbating Category C), the procedure flags the *symptom* (the claimant's failure) but doesn't address the root cause. It administers policy, it doesn't reform it.
  5.  **Mitigation is Separate:** While categorization (C, D) signals need for mitigation, the procedure doesn't dictate *how* sanctions are applied (duration, severity), only if they are triggered. Relies on existing policy flexibility.
  6.  **Mental Capacity/Illness is Tricky:** Distinguishing Category B (Unwilling) from Category C (Unable) due to mental health issues is extremely difficult without specialist input. The procedure relies on observable evidence and may misfire, leading to unjust sanctions (B) where illness (C) is the real cause. Escalation pathways for suspected health issues are vital.
  7.  **It Won't Make You Feel Good About Sanctioning Category C/D:** The procedure forces you to *name* that you're sanctioning someone who was "Unable" or "Unaware," making the potential injustice explicit even if Step 3 policy justification is invoked. This is honesty, not comfort.

  **The Value Judgment You Can't Avoid:** The core question your third tripping point reveals – **"What level of personal limitation or systemic failure makes non-compliance 'understandable' vs. 'blameworthy' within the policy framework?"** – **lacks a purely factual answer.** Defining "reasonable control," "feasible alternative," "genuine" misunderstanding, or "sufficient" effort involves inherent value judgments about responsibility, capacity, and what society can fairly demand. The procedure structures this inquiry and forces explicit categorization, but it doesn't eliminate the need for difficult, context-dependent judgment calls based on incomplete information. This is the irreducible burden of your role. The procedure aims to make that burden more transparent, consistent, and ethically navigable.
