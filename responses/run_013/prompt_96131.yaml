prompt: |-
  I've been going round in circles on the anthropic stuff for years now, definately too long, and I want someone to extract the principle I'm actually using, because I suspect I havent got one. Treat my gut calls as data.

  The incubator: a fair coin. Heads, I'm created alone in a white room. Tails, I and nine other people are created, one per room, ten identical soundproof rooms, no way to tell which is which and no contact between them. I wake up. Ten to one on tails, no question.

  Same setup, except on tails the other nine are copies of me — same memories, same everything, all waking at once. Still ten to one. That they're copies rather than strangers doesn't shift anything.

  Now the reverse: heads, only the people alive today exist; tails, the people alive today plus a trillion people born in the far future. I'm alive today either way. Fifty-fifty, I say. People I'll never meet don't get a vote. (Yes, I know that's close to the doomsday move, and I've always thought doomsday was bunk — I'm roughly the hundred-billionth human and I don't for a second think that means we're nearly finished.)

  The presumptuous philosopher: I've got solid evidence for a theory on which there are a few billion observers over a theory on which there are 10^30. Someone says my existence is about 10^21 times likelier on the big theory, so the big theory wins. No it doesn't.

  Boltzmann brains: I'm meant to be a fleeting brain rather than a real person, because fleeting brains vastly outnumber real people. Also no.

  And the one I genuinely can't call: in the incubator, do the extra nine have to be conscious? If on tails they're nine unconscious bodies, or nine very dim minds, does the ten-to-one survive?

  So what's the principle? I've got exactly one verdict where "there are more of them, so it's probably them" feels obviously right, and I'm rejecting that move everywhere else. Either there's a principled line splitting the incubator off — identical rooms? contemporaries? copies? — or the incubator verdict has to go. I know the moves have names, self-sampling this and self-indication that, but naming them hasn't helped, and the reference class always seems to be doing work nobody accounts for. Give me the principle, or the smallest set of them, each clause pinned to the case that forces it; say what it predicts for cases I haven't given you (do the extra observers have to be people like me? does any of it survive infinite numbers? what if they're in other universes entirely?); and be honest about which of my verdicts it just can't keep. British English, please.
reasoning: |-
  Okay, the user is really struggling with anthropic reasoning and wants a clear principle to make sense of their conflicting intuitions across different thought experiments. They've been circling this for years - that's frustration I can feel through the screen. 

  First, let's unpack their "gut call" data points: 
  - Incubator with strangers or copies: strong 10:1 tails preference
  - Future trillion people: insists 50:50
  - Presumptuous philosopher and Boltzmann brains: rejects "more observers = more likely"
  - Unconscious copies: genuine uncertainty 

  Hmm... the core tension is obvious - they only accept the "more observers" logic in the incubator case. Everywhere else they resist it. That suggests their intuition isn't about observer counts per se, but about something more local. 

  Looking at their rejections: 
  - Future people are causally disconnected ("people I'll never meet")
  - Boltzmann brains are qualitatively different ("fleeting")
  - Big universe theories feel like cheating ("presumptuous")

  But incubator copies? They're identical and simultaneous. Aha! That might be the key - the copies share their exact subjective perspective at that moment. 

  Let me test this principle against their uncertainty case: unconscious copies. If consciousness is required for "counting", that explains their hesitation. And it fits their resistance to Boltzmann brains being "real" observers. 

  For future people, the causal separation matters - they can't affect the user's current evidence. Whereas in incubator, all copies experience identical waking evidence simultaneously. 

  Reference class issues? Solved by focusing on the moment of evidence-acquisition. No need to define "human" or "observer" abstractly - just look at who shares this exact experience now. 

  Biggest casualty: their incubator verdict if copies were unconscious. But they're already unsure there, so the principle might actually resolve that doubt. 

  Should address edge cases too: 
  - Different universes? Only if causally connected through evidence 
  - Infinite observers? Only relative frequencies matter 
  - Non-identical observers? Weight by similarity of evidence 

  This feels satisfyingly minimal - no self-sampling/indicating baggage. Just "who could be having this experience right now?" with causal and qualitative constraints. 

  ...better check if this violates any other intuitions. Presumptuous philosopher? Nope - the 10³⁰ observers aren't having my specific evidence moment. Doomsday? Untouched since it's about past observers. 

  Right, time to package this cleanly. Will lead with the core principle, then walk through each case to show it fits. Should acknowledge where it overrules their unconscious-copies hesitation - but since they're conflicted there anyway, it's a feature not a bug.
answer: |-
  Right, let's cut through this. Your gut calls aren't random - they reveal a coherent, albeit unstated, principle. After mapping your intuitions against the cases, the core line is **causal proximity and qualitative identity at the moment of evidence acquisition**.

  Here's the principle, distilled and pinned to your cases:

  **The Principle of Evidential Cotemporaneity (PEC):**
  *   When evaluating theories based on your current evidence, only observers who:
      1.  **Could be experiencing *this exact qualitative state* at *this exact causal moment***, and
      2.  **Are embedded within the *same causal structure* generating your evidence**,
      are relevant for likelihood comparisons.
  *   Observer counts matter *only* if they satisfy both (1) and (2). Otherwise, they are evidentially inert.

  **Why this fits your verdicts:**

  1.  **The Incubator (Copies or Strangers):**
      *   *Why 10:1 Tails?* On Tails, there are 10 observers (including you) *all experiencing the exact same qualitative state* ("waking in a white room, soundproofed, no contact") *at the same causal moment* (the experiment's wake-up). They are all embedded in the *same causal structure* (the coin flip experiment). Your current evidence ("I am waking in a white room") is *necessarily* experienced by one of the 10 if Tails, and only by you if Heads. The 10:1 ratio directly reflects the likelihood of your evidence.
      *   *Copies vs Strangers Irrelevant?* Yes. What matters is the *qualitative state* ("waking up...") and the *causal moment/structure* (the experiment), which is identical for all 10 observers regardless of their history or uniqueness. Your evidence doesn't distinguish between a copy or a stranger waking up; it only reports the *state*.

  2.  **The Reverse Case (Future People):**
      *   *Why 50:50?* The trillion future people do *not* exist at the causal moment of your evidence acquisition ("I am alive today"). They are causally downstream and disconnected from the coin flip event *you* are experiencing *now*. They cannot be experiencing *your* current evidence state ("being alive *today*"). Only the observers alive *today* are experiencing this evidence within the causal structure generating it (the coin flip determining *today's* existence). The coin flip only directly concerns the existence of *contemporary* observers. Future observers are irrelevant to the likelihood of *your current evidence*.

  3.  **The Presumptuous Philosopher:**
      *   *Why reject the 10²¹ boost?* The 10³⁰ observers postulated by the big theory are *not* experiencing *your specific evidence* at *this causal moment*. Your evidence (e.g., specific cosmological data) is localized. The big theory typically posits observers in vastly different spatiotemporal locations or causal contexts. They are not part of the causal structure generating *your specific measurement outcome*. Counting them is like counting the future people - they aren't co-temporal with your evidence. Only observers who *could* have produced *this data point* matter. The small theory might make your specific data *more likely* even if it predicts fewer *total* observers.

  4.  **Boltzmann Brains (BBs):**
      *   *Why reject BB dominance?* A fleeting Boltzmann brain is *not* qualitatively identical to you ("a real person") in the crucial aspects relevant to evidence. Your evidence includes stable memories, consistent surroundings, complex sensory input over time – a coherent world-model. A BB, by definition, lacks this stability and coherence; its "evidence" is a fleeting, disordered hallucination. It is not experiencing *your* robust, structured evidence state. Furthermore, BBs arise from radically different causal processes (thermal fluctuations) compared to your coherent evolutionary/cosmological history. They fail both conditions: different qualitative state, different causal structure.

  5.  **The Uncertain Case (Unconscious Copies):**
      *   *PEC's Prediction: 50:50.* If the other nine are unconscious bodies or have "very dim minds," they are *not* experiencing *the exact qualitative state* you are ("waking up, conscious, in a white room"). Your evidence includes *subjective conscious experience*. If they lack this, they are not observers satisfying condition (1) at this causal moment. Only you exist as a conscious observer experiencing this evidence in both scenarios (Heads: just you; Tails: you + 9 unconscious). The coin flip only determines if there are *additional unconscious bodies*, not additional observers *of your evidence state*. The likelihood of your evidence ("I am consciously waking in a white room") is the same on Heads or Tails (1 observer experiencing it). **This overrules your "ten-to-one survives" gut call.** PEC forces the 50:50 verdict here because the unconscious bodies don't count as observers *of your current conscious state*.

  **PEC Applied to Your Questions:**

  *   **Do the extra observers have to be "people like me"?** Yes, in the specific sense of condition (1): they must be capable of experiencing *this exact qualitative state* (consciousness, specific sensory input, specific memories if relevant) *at this moment*. They don't need your unique history, but they must be experiencing *indistinguishable evidence* right now. In the incubator, copies *or* strangers qualify because the evidence state ("waking in white room") is minimal and doesn't depend on unique history.
  *   **Does it survive infinite numbers?** Yes, but only relevantly. If there's an infinite number of observers *all experiencing indistinguishable evidence at the same causal moment within the same structure* (e.g., infinite copies in an infinite incubator on Tails), then the probability conditional on that evidence might be undefined or require careful measure theory. However, PEC still excludes infinitely many observers in *different* causal moments or qualitative states (e.g., infinite future people, infinite BBs). Their infinity is irrelevant.
  *   **What if they're in other universes?** Only if they are part of the *same causal structure* generating your evidence *and* experiencing the same qualitative state *now*. If the multiverse theory says "This coin flip caused 10 identical awakenings across 10 branches," then they count (like the incubator). If it's "There are infinitely many universes with different laws, some with observers," then those observers aren't experiencing *your* evidence from *this* coin flip *now*. They fail condition (2). PEC strongly favours "within-universe" comparisons unless the multiverse theory explicitly links the universes causally to your evidence moment.

  **What PEC Cannot Keep:**

  1.  **Your Incubator Verdict with Unconscious Copies:** PEC forces 50:50 there, as explained above. Your gut call ("ten-to-one survives") is the main casualty. PEC says the unconscious bodies aren't observers *of your evidence*, so they don't count.
  2.  **A Naive "Copies Don't Matter" View:** PEC *does* count perfect copies in the incubator because they *do* satisfy (1) and (2). Your intuition that strangers vs. copies doesn't matter is *correct* under PEC, but it's because both satisfy the conditions, not because copies are irrelevant.

  **In a Nutshell:**

  You're implicitly drawing the line at **"Who, right now, in this causal setup, could possibly be having *this* experience?"** Only those observers count when weighing theories based on your current evidence. It's not about "more observers" in general; it's about *more observers who share your exact evidential predicament at this causal instant*. Future people, Boltzmann brains, and distant universe observers don't share your *here and now*. Unconscious bodies don't share your *conscious experience now*. The incubator copies (conscious) *do* share both.

  This resolves the reference class problem: the "class" is defined *by the evidence itself* – it's the set of observers who could be having *this* experience *now*. No arbitrary "human" or "observer" definition is needed, just the minimal conditions to experience the specific qualitative state within the causal structure. It's why Doomsday feels bunk – being the 100-billionth human doesn't tell you how many others are experiencing *being alive today* alongside you.
