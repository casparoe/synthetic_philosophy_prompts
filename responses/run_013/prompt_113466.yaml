prompt: |-
  I am trying to determine whether a certain family of objections in ethics has a name — the family, rather than its several members, which I think I can already tell apart. The family has this shape. A theory is on the table, and nobody in the discussion disputes its verdict about what is to be done: the act it recommends is the act everyone agrees is right, or at least the act the objector concedes to be right. What is objected to is instead what the theory requires the agent to be thinking in the course of doing it — that, in order to act as the theory directs, the agent must have before her mind, and be moved by, a consideration that a good agent would not have before her mind at that moment. The offending thought is not treated as evidence that the act is wrong; the thought itself is said to be the defect.

  Two instances. First, a small one. A woman I know has adopted, as a policy for her close friendships, the rule of doing in each interaction what a prudent steward of the relationship would do: investing where the friendship has been neglected, avoiding overdrawing, reciprocating what she receives. What she does is indistinguishable from what an unreflective good friend does. Yet when, in the middle of a conversation, she remarks that she has decided to invest a little more in this friendship because it has been running at a deficit, something seems to me to have gone wrong, and it is not that she has done the wrong thing. Second, a larger one. A man holds that promises are to be kept because breaking them erodes an institution everyone needs. He keeps his promises, and keeps exactly the ones a conscientious person keeps. But he cannot keep one without the thought that the institution would suffer if he did not, and the complaint I hear is that a promise kept that way is not a promise but a policy.

  I have heard such cases described in three ways — as failures of integrity, as a kind of alienation, and as the theory's asking for one thought too many — and, half-remembered, a fourth as ethical theories inducing a kind of schizophrenia. I cannot tell whether these name four distinct things, one thing under several aspects, or whether any of them names the family I have described rather than one of its members.

  What I want is this. First: does the family, characterised as above, have an established name? If so, which term, and what exactly does it cover? If not, coin one and define it sharply enough that I can see what falls outside. Second: for each of those descriptions, the claim it standardly carries and how it differs from the others — a family tree, not an essay on any single member. Third: what separates this family from two neighbours I keep collapsing into it, namely the objection that a theory demands too much of an agent (where the cost of the act is the complaint) and the objection that a theory is self-effacing (where the complaint is that the agent cannot coherently consult the theory). Fourth: where the edges lie. Does the objection apply when the theory merely permits the offending thought rather than requiring it? When the agent has the thought but it does no work in the deliberation? When the theory never mentions the thought, but the act would be irrational by the theory's own lights without it? And does the shape survive outside morality — in a policy for friendship, or a rule for giving gifts?

  I am not asking whether these objections succeed; I want the taxonomy and the boundaries, with my two instances placed inside it. Answer in no more than 650 words.
reasoning: |-
  Okay, the user is asking about a specific type of ethical objection where the problem isn't with the action itself but with the thought process required by the theory. They gave two examples: one about friendship and another about promise-keeping. The user wants to know if this family of objections has a name, how it relates to terms like "one thought too many," "alienation," "integrity," and "schizophrenia," and how it differs from other objections like demandingness or self-effacement. They also want boundaries clarified.

  First, I recall Bernard Williams' "one thought too many" from his critique of utilitarianism. That seems central here. The friendship example fits perfectly: calculating investments in friendships feels wrong even if the actions are correct. Williams used the term to describe when an agent has an impersonal moral reason overriding personal commitments. The promise example aligns too—keeping promises because of institutional erosion rather than the promise itself.

  The user mentioned other terms: alienation, integrity failure, and schizophrenia. Alienation, from Marxism but applied in ethics by Bernard Williams, refers to being estranged from one's own values or relationships. Integrity failure, also from Williams, involves conflicts where moral demands threaten personal projects. Schizophrenia here isn't clinical; it's Michael Stocker's idea of divided motives in modern ethical theories. These terms are related but emphasize different aspects. "One thought too many" is the most precise for the user's description because it directly addresses the intrusive thought.

  Next, differentiating from demandingness and self-effacement. Demandingness is about the cost of the action (e.g., giving up too much for charity), not the thought process. Self-effacement, from Derek Parfit, is when a theory shouldn't be used directly in deliberation. The user's focus is on the thought required during action, not the theory's usability.

  Boundaries: The objection holds when the thought is required. If the theory merely permits it, the issue weakens unless it's the only rational way. If the thought is present but idle, it's less problematic but still potentially alienating. If the theory implies the thought is necessary for rationality, it still fits. The structure applies beyond morality, like in friendships or gifts, as the examples show.

  Putting it together: The established name is "one thought too many." The family tree shows how alienation, integrity, and schizophrenia relate as broader or overlapping concepts. The key differentiators from neighbors are the focus on thought vs. action cost or theory usability. Edges involve requirement vs. permission, idle thoughts, and implicit necessity. The user's instances are classic cases of this objection.
answer: |-
  Here is a taxonomy for the family of objections you describe:

  1.  **The Established Name & Coverage:**
      *   **Name:** The most precise established name for the *core* objection (the intrusive, motivationally necessary thought being the defect) is **"one thought too many"** (Bernard Williams, "Persons, Character, and Morality").
      *   **Coverage:** This term specifically targets the complaint that a moral theory requires an agent, in order to act rightly *according to that theory*, to entertain a specific (often impersonal, calculative, or institutional) justifying thought that seems inappropriate, alienating, or corrosive to the very value or relationship involved in the act. The act is correct, but the required *motive* or *deliberative content* is flawed.

  2.  **The Family Tree of Related Descriptions:**
      *   **"One thought too many" (Williams):** The core objection. Focuses on the *intrusion* of a specific, theoretically required thought into deliberation/motivation where a different (often more direct, personal, or value-responsive) thought *should* be sufficient or is normatively appropriate. ("Why think about institutional erosion when keeping a promise to a friend? Friendship *itself* should suffice.") Highlights the *excessiveness* of the reasoning.
      *   **Alienation (e.g., Williams, Marx, Frankfurt School influence):** A broader consequence. The required thought *distances* the agent from their own authentic feelings, commitments, relationships, or the intrinsic value of the act. The agent becomes a detached operator rather than an engaged participant. ("Calculating friendship investments turns a relationship into a ledger, alienating her from genuine care.")
      *   **Failure of Integrity (Williams):** Focuses on the *cost to the agent's character or identity*. Forcing the agent to adopt the alienating thought/motive prevents them from acting wholeheartedly from their deep commitments or projects, creating a split within the self. ("The promise-keeper cannot act *as* a trustworthy friend; his institutional motive conflicts with the personal commitment integrity demands.")
      *   **Schizophrenia (Michael Stocker, "The Schizophrenia of Modern Ethical Theories"):** Similar to alienation, but emphasizes the *divided consciousness* – the agent must hold conflicting motives/thoughts simultaneously or switch unnaturally between personal and impersonal perspectives, creating an unhealthy psychological state incompatible with flourishing or genuine virtue. ("The friend's mind is split between care and calculation.")

      **Relationship:** "One thought too many" is the *mechanism* causing the *effects* described by alienation, integrity failure, and schizophrenia. Alienation and schizophrenia focus on the *agent's state*, integrity on the *agent's wholeness*. All describe facets of the same core problem: the theory mandates a defective deliberative/motivational structure for right action.

  3.  **Differentiation from Neighbors:**
      *   **Demandingness (e.g., utilitarianism demanding extreme sacrifice):** Objects to the *costliness of the *act*** required by the theory (giving up your life savings, abandoning your family). The complaint is about the *action's burden*, not the thought process motivating it. Your objection targets the *internal deliberative requirement*, regardless of the act's external cost.
      *   **Self-Effacement (e.g., Parfit, Railton):** Objects when a theory claims it should *not* be directly used by agents in deliberation to yield the best outcomes *according to the theory itself*. The complaint is about the *theory's practical unusability* or incoherence *as a guide*. Your objection condemns a thought the theory *does* require for right action, not its inadvisability as a deliberative tool.

  4.  **Boundaries (Edges):**
      *   **Requirement vs. Permission:** The core objection applies most strongly when the theory *requires* the thought for the act to be rational/justified *by the theory's standards*. If the theory merely *permits* the thought but it's optional, the objection weakens significantly; the flaw lies in the agent choosing it unnecessarily, not the theory demanding it. ("She *could* just act from care; she *chooses* to calculate.")
      *   **Idle Thought:** If the agent *has* the thought but it plays *no motivational or justificatory role* in their deliberation (it's merely a background belief), the objection largely dissolves. The defect is the thought's *functional necessity* for right action within the theory.
      *   **Implicit Requirement:** If the theory's structure implies the act would be *irrational* or *unjustified* without the agent holding that thought (even if not explicitly stated), the objection still holds. The flaw is in the theory's implicit deliberative logic.
      *   **Scope Beyond Morality:** The structural shape *absolutely survives* in non-moral contexts like friendship, gifts, artistic creation, or familial duties (as your first example illustrates). The core issue is the imposition of an alien or corrosive deliberative frame onto a practice defined by different norms (care, generosity, inspiration, loyalty).

  **Placement of Your Instances:**
  *   **Friendship:** A classic "one thought too many" case within the practice of friendship. Also demonstrates alienation (from genuine care) and a form of schizophrenia (calculative vs. caring mindset).
  *   **Promise-Keeping:** A core "one thought too many" objection against consequentialist/contractualist justifications for promissory fidelity. Highlights alienation (from the personal bond) and a failure of integrity (cannot act *as* a promisor).
