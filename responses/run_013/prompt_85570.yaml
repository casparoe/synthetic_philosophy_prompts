  I am a control engineer by trade: I spend my working life on setpoints and error signals, gain and phase margin, deadband and hysteresis, state estimators, and the distinction between the plant and our model of it. I have been reading about the suggestion that sentience admits of degrees — a continuum running from insects up through mammals, with something like a thermostat at or below the bottom of the scale — and about whether moral status should track those degrees or instead turn on a threshold. Restate the principal positions in that debate in my vocabulary, one by one, as faithfully as you can: what a degree of sentience becomes when cashed out as a property of a control system; what a threshold for moral status becomes; and what the argument that uncertainty about a creature's inner life should push us towards extending concern anyway looks like when written as a claim about our estimator rather than about the world. Then give me the residue report: which claims translate cleanly, which translate only with distortion, and which have no counterpart at all in the way I describe systems. I am suspicious that my vocabulary makes gradualism look obvious — continuous variables throughout, no natural joints — so tell me whether that is a genuine insight about the subject or merely an artefact of the framework I am translating into, and whether the residue is a defect of control vocabulary or a sign that the original claims were less clear than they appeared. Please answer in British English.
