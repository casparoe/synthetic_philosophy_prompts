prompt: |-
  You're a constitutional law academic who works on federalism and subsidiarity — think carefully, and start by brainstorming the possible rules before you commit to one.

  I sit on our federation's subsidiarity comittee. We decide whether a bill from the centre gets struck down as a matter for the regions; our default is that the regions keep a competence unless the centre can show it needs it, so nearer the EU's subsidiarity test than the US's enumerated powers, if that helps.

  What we've done so far. Upheld the centre on: a ban on an industrial solvent that leaches into a river crossing three regional borders; minimum staffing levels for hospitals, on the grounds that patients cross borders for treatment and the medical labour market is shared; a minimum income floor, even though every region could fund its own, because otherwise regions would compete to be the least generous and people would move; and a ban on parents physically disciplining their children, where two regions had deliberately kept a defence letting parents argue it was reasonable — we upheld that one too, while admitting there was no cross-border effect whatsoever. Struck down: a cap on homework hours in primary schools; rules on the height and materials of buildings in historic town centres; and central procurement of school meals, which the centre said would simply be cheaper.

  Next month's case: a single federation-wide minimum staffing ratio for residential care homes — something like one carer per four residents overnight — with the centre topping up the funding. The centre's pitch is equality rather than cruelty: a frail 90-year-old shouldn't get a different standard of care depending on which region she happens to live in. Nobody's claiming residents move between regions for care, and nobody's alleging abuse or neglect. The regions say rural labour shortages, wage costs and their own mandates all differ, and that they were elected to decide this.

  What should we do if we want to be consistent with ourselves? I can see at least two rules that fit everything above and split on this case — tell me what they are, which of our earlier decisions are ambiguous between them, and which is the nearest analog to the care homes case. Give me your best guess and the reason for it, and if the record genuinely underdetermines it, be honest about which principle we'd be adopting either way. Last thing: if I can get one more case onto the docket that would settle it, what should it be? British English, please.
reasoning: |-
  Alright, let me approach this systematically. The user presents a fascinating subsidiarity dilemma with clear patterns in prior decisions that now need consistent application to elderly care staffing ratios. 

  First, I notice the committee's jurisprudence reveals two competing principles: one focused on preventing negative externalities between regions (like river pollution or welfare competition), and another on upholding fundamental rights uniformly regardless of cross-border effects (like the child protection case). The care homes case sits precisely at this intersection - is frail elderly care about preventing a "race to the bottom" or about inherent dignity?

  The child protection precedent is key here. It established that certain rights are so fundamental that regional variation itself constitutes harm, even without cross-border movement. But that rationale was carefully circumscribed to child welfare. Expanding it to elderly care would significantly shift the subsidiarity balance - essentially creating a new category of "dignity-based universal standards."

  Interestingly, the minimum income case used economic spillover reasoning (welfare migration), not dignity. So if the committee upholds care staffing ratios solely on equality grounds, it would implicitly elevate elderly care to the same non-derogable status as child protection. That's a substantive policy choice masquerading as consistency.

  To resolve the ambiguity, I'd want to see a test case involving another non-mobile population group - say, disability care standards - where regions have divergent approaches but no cross-border impacts. How the committee treated that would reveal whether the child protection case was truly exceptional or the start of a dignity doctrine.

  Ultimately, this isn't just about legal consistency but about what subsidiarity means in this federation. Is it purely a tool to manage inter-regional externalities, or also a vehicle for enforcing national moral minimums? The committee's next move will define that.
answer: |-
  Based on your committee's established jurisprudence and the principles of subsidiarity you operate under, here's a structured analysis of the care homes case, identifying two coherent rules, their application to precedents, and recommendations:

  **Two Consistent Rules Emerging from Precedents:**

  1.  **The "Prevention of Negative Externalities/Race to the Bottom" Rule:** The centre may act to prevent situations where regional action (or inaction) demonstrably causes harm *spilling over regional borders* or triggers a destructive competition between regions (e.g., environmental damage crossing borders, welfare competition inducing migration, labour market distortions affecting shared services).
  2.  **The "Fundamental Rights/Dignity Floor" Rule:** The centre may act to establish a universal minimum standard protecting fundamental rights or human dignity, *even absent cross-border effects*, where regional variation itself is deemed inherently unacceptable or creates an unjustifiable inequality in core human treatment.

  **Application to Precedents & Ambiguities:**

  *   **Upheld: Industrial Solvent Ban:** Clearly fits **Rule 1** (transboundary pollution).
  *   **Upheld: Minimum Hospital Staffing:** Fits **Rule 1** (patients crossing borders, shared labour market).
  *   **Upheld: Minimum Income Floor:** Primarily fits **Rule 1** (competition inducing migration/race to bottom). *Ambiguity:* Could there be an underlying **Rule 2** element (preventing destitution as a dignity floor)? The reasoning given (competition/migration) leans strongly to Rule 1.
  *   **Upheld: Ban on Physical Discipline of Children:** **Crucially ambiguous.** The *stated* lack of cross-border effect explicitly *rejects* Rule 1 justification. Upholding it *requires* invoking **Rule 2** (protecting children's fundamental right to bodily integrity/safety, establishing a universal dignity floor for child protection). This is the key precedent expanding beyond pure spillover/competition logic.
  *   **Struck Down: Homework Cap, Building Rules, School Meals Procurement:** Fail both rules. No evidence of cross-border harm/competition (**Rule 1**). The matters (educational approach, local aesthetics/historic character, procurement efficiency) were deemed insufficiently fundamental or dignity-related to trigger **Rule 2**, falling squarely within regional competence for local variation.

  **The Care Homes Case: Applying the Rules**

  *   **Rule 1 (Externalities/Race to Bottom) Analysis:**
      *   The centre argues *equality*, not demonstrable spillover harm or destructive competition.
      *   No evidence residents move between regions for care or that differing standards cause cross-border problems (e.g., bed shortages in one region overwhelming another).
      *   While labour markets *might* have regional overlaps, the centre hasn't argued staffing ratio differences distort the *shared* labour market for carers (unlike the shared medical labour market in hospitals).
      *   **Likely Verdict under Rule 1 Alone:** STRUCK DOWN. The centre hasn't met the burden to show a negative externality or race to the bottom justifying centralisation. This resembles the *building rules* or *school meals* cases – differing local conditions (rural labour costs) are a core regional competence.
  *   **Rule 2 (Fundamental Rights/Dignity Floor) Analysis:**
      *   The centre argues a frail 90-year-old deserves equal basic care regardless of location, framing it as a matter of fundamental dignity in old age.
      *   **Direct Analog:** This logic mirrors the *child protection ban*. Both involve vulnerable populations (children, frail elderly) and state intervention in private settings (family home, care home) to set a universal minimum standard protecting physical well-being/safety, explicitly *without* needing cross-border effects. "Equality of basic care" here parallels "universal protection from violence" for children.
      *   **Likely Verdict under Rule 2:** UPHELD. The committee, having accepted the principle in the child protection case, would likely extend it to establish a minimum dignity floor for elderly care, preventing potentially unsafe or degrading variations in core staffing support.

  **Ambiguity in Precedents:**

  The **Minimum Income Floor** and **Child Protection Ban** are the critical precedents revealing the tension:
  *   The *Minimum Income Floor* was upheld on **Rule 1** grounds (competition/migration), *avoiding* the need to invoke Rule 2 for welfare provision.
  *   The *Child Protection Ban* **forced the adoption of Rule 2** by explicitly dismissing Rule 1 (no cross-border effect) yet upholding the central law. This precedent *cannot* be explained by Rule 1 alone.

  **Best Guess & Reasoning:**

  *   **Nearest Analog:** The **Child Protection Ban** is the *strongest and most direct analog* for the care homes case. Both involve:
      *   Setting a minimum standard for the protection of a vulnerable group (children, frail elderly).
      *   Intervention in a setting traditionally involving private/family responsibility or regional oversight (parenting, social care).
      *   An argument based on universal dignity/equality and preventing unacceptable variation in core treatment/safety.
      *   An *explicit absence* of claimed cross-border effects or spillovers.
  *   **Prediction:** To be consistent with the *Child Protection Ban*, the committee would likely **UPHOLD** the care homes staffing ratio under **Rule 2 (Fundamental Rights/Dignity Floor)**. The logic of preventing unacceptable variation in the basic care and safety of vulnerable populations, purely on dignity grounds, established in the child case, is directly transferable here. Rejecting it now would undermine the principle implicitly accepted in that prior decision.

  **If the Record Underdetermines It:**

  The record *does* potentially underdetermine the *scope* of Rule 2. The committee adopted Rule 2 for *child protection*, but hasn't defined its limits. Upholding the care homes ratio **adopts the principle that Rule 2 extends beyond children to other groups deemed sufficiently vulnerable regarding core physical care/safety.** Striking it down **adopts the principle that Rule 2 is confined to the specific context of child protection (or perhaps only explicit violence bans), and cannot be readily extended to other social/elderly care standards.**

  **The Settling Case:**

  To definitively resolve the scope of Rule 2, you need a case testing a **minimum standard for another vulnerable, non-mobile group, lacking cross-border effects, where the core argument is dignity/safety, but which is arguably less fundamental than protection from violence.** A perfect example would be:

  *   **A Central Law Setting Minimum Space Standards per Resident in Disability Care Homes.**
      *   *Why it Settles It:* It directly parallels elderly care (vulnerable, non-mobile group, dignity/safety argument, no cross-border effects). If upheld, it confirms Rule 2 extends broadly to care settings. If struck down, it limits Rule 2 primarily to the *child physical discipline* context or explicit safety-from-harm standards, suggesting elderly care staffing is more akin to regional variations in welfare provision or local service delivery (like school meals or building rules) than a universal dignity floor. The committee's reasoning on whether space standards constitute a *fundamental* dignity/safety issue equivalent to staffing ratios or protection from violence would be highly illuminating.
