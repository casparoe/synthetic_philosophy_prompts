  Okay, the user is deep into meta-ethics, specifically the expressivism vs. cognitivism debate about moral language. They've been arguing with a friend who claims expressivism collapses under embedding—like when moral statements appear in negations, conditionals, or attitude reports. The friend thinks expressivists either have to change the meaning or abandon compositionality, both fatal flaws. The user disagrees, thinking the problem is more localized, and wants a minimal pair of sentences to test this.

  The user wants two sentences that are identical except for the operator embedding a moral claim. One should be handled smoothly by expressivism (attitude expression without truth-apt content), while the other forces expressivists into one of the two bad options. Constraints: use ordinary moral terms ("wrong," "ought," etc.), standard English embeddings, no cliché examples (like the lying conditional), and keep it concise. After presenting the pair, they want the troublesome sentence nested one operator deeper to see if the problem persists.

  Then, a detailed analysis: for each sentence, state the expressivist semantic clause, the verdict, where it breaks, identify the problematic embedding feature, show how removing/swapping operators fixes it, assess natural repairs, and finally, consider if the expressivist should reject the clause and what that costs. The case must show the problem is local, not global, without stipulating verdicts—they must emerge from the clauses.

  First, I need to construct the minimal pair. Avoid the overused "If lying is wrong, getting your brother to lie is wrong" example. Brainstorm alternatives. Perhaps use "ought" or "cruel" with different embeddings. Consider a negation vs. a belief ascription. For the smooth case, a simple negation might work: "Stealing is not wrong" expresses the opposing attitude. For the problematic case, embedding in a belief ascription like "Alex believes that stealing is wrong" could cause issues because belief ascriptions typically describe cognitive states, not expressions.

  Finalize the pair:  
  (1) "Stealing is not wrong." (Negation)  
  (2) "Alex believes that stealing is wrong." (Belief ascription)

  Now, for the expressivist treatment:  
  - For (1), negation flips the attitude (e.g., disapproval to tolerance). This works smoothly.  
  - For (2), belief ascription should describe Alex's mental state. But expressivism says "stealing is wrong" expresses disapproval, doesn't refer to a belief. So, treating it as referring to a belief content smuggles in truth-aptness, breaking expressivism. If it denies compositionality, that's also bad.

  Next, nest the troublesome sentence deeper: "Dana doubts that Alex believes that stealing is wrong." The problem likely survives because "believes that" still requires cognitive content, and "doubts" compounds it.

  Analysis:  
  - Sentence (1): Semantic clause is NEG(S) expresses the opposite attitude of S. Verdict: smooth.  
  - Sentence (2): Belief ascription "A believes that S" should express that A holds the attitude expressed by S. But "holds an attitude" isn't the same as expressing it; it describes a state, which needs truth-apt content. Break point: requires S to have cognitive content.  
  - Problematic feature: "Believes that" presupposes a propositional object. Removing/swapping operators (e.g., using negation instead) avoids this.  
  - Natural repair: Treat "believes that S" as expressing a higher-order attitude about Alex's attitude. But this might lose the descriptive nature of belief reports, which expressivists need for ordinary language.  
  - Strongest defense: Expressivists should reject that "believes that" requires propositions, offering an attitude-based semantics. Cost: Complicates theory, may not capture the cognitive aspect of beliefs, potentially ad hoc.

  This pair shows the problem is local to attitude verbs. The verdicts emerge naturally: negation works with attitude flipping, belief ascription forces a choice between changing meaning (to propositional) or abandoning compositionality.
answer: |-
  Here is a minimal pair designed to isolate the embedding problem for expressivism, adhering to your constraints. The pair uses "ought" as the moral term and contrasts negation with an attitude ascription ("is glad that"). Both sentences embed the same moral claim ("you ought to help") but under different operators. The case is novel—not drawn from standard literature examples.

  **Minimal Pair:**  
  (A) "It is not the case that you ought to help."  
  (B) "Sam is glad that you ought to help."  

  ### Step 1: Expressivist Semantic Clauses and Verdicts  
  *Assumptions*:  
  - Expressivism treats moral sentences as expressing non-cognitive attitudes (e.g., "you ought to help" expresses *approval of helping*).  
  - Compositionality: The meaning of a complex sentence is determined by the meanings of its parts and their syntactic combination.  
  - "Glad that" is an attitude verb requiring a truth-apt content (proposition) as its complement.  

  **Sentence (A): "It is not the case that you ought to help."**  
  - **Expressivist clause for negation**: Negating a moral sentence expresses the *opposing attitude* to the one expressed by the embedded sentence. If "you ought to help" expresses approval of helping, its negation expresses *disapproval of helping* (or indifference, depending on the theory; both are non-cognitive).  
  - **Verdict**: Smooth handling. The clause is attitude-consistent (no truth-apt content invoked) and compositional (the negation operator systematically maps one attitude to its opposite).  
  - **Break point**: None.  

  **Sentence (B): "Sam is glad that you ought to help."**  
  - **Expressivist clause for "glad that"**: "X is glad that S" describes X's positive emotional state toward the *content* of S. For compositionality, S must supply a truth-evaluable proposition (e.g., "that you ought to help" denotes a fact or state of affairs).  
  - **Problem**: Expressivism denies that "you ought to help" has truth-apt content—it *expresses* approval, but doesn’t *refer* to a proposition.  
  - **Verdict**: Breaks. The expressivist faces two fatal options:  
    - **Option 1 (Change meaning)**: Redefine "you ought to help" inside "glad that" as referring to a proposition (e.g., "the act has the property of being what you ought to do"). But this abandons expressivism by smuggling in cognitivism.  
    - **Option 2 (Abandon compositionality)**: Treat "glad that" as an exception, where its complement doesn’t contribute standard content. But then "Sam is glad that you ought to help" no longer compositionally derives from "glad that" and "you ought to help," violating linguistic regularity.  
  - **Break point**: At the embedding of "you ought to help" under "glad that," due to the attitude verb’s requirement for a propositional complement.  

  ### Step 2: Identify the Problematic Feature  
  - **Single feature**: The operator "glad that" is *factive-attitudinal*—it presupposes the truth of its complement and describes a psychological relation to that truth. This forces the embedded clause to furnish a truth-apt proposition, which expressivism cannot provide without capitulation.  
  - **Why negation (A) lacks this feature**: Negation is a *logical operator* that maps attitudes to opposing attitudes without requiring a truth-bearing object.  

  ### Step 3: Test Removal/Swapping Operators  
  - **Remove the problematic feature**: Replace "glad that" with a non-attitudinal operator (e.g., negation).  
    - Result: "It is not the case that you ought to help" → Smooth, as in (A).  
  - **Swap operators**: Embed "you ought to help" under negation in (B), or "glad that" in (A).  
    - (B) with negation: "Sam is glad that it is not the case that you ought to help" → *Still breaks* (same problem: "glad that" requires a proposition).  
    - (A) with "glad that": N/A (negation isn’t factive-attitudinal).  
  - **Conclusion**: The problem is local to factive-attitudinal verbs like "glad that," not negation.  

  ### Step 4: Nest the Troublesome Sentence Deeper  
  - **Nested version of (B)**: "Dana suspects that Sam is glad that you ought to help."  
  - **Verdict**: The difficulty **survives**. "Suspects that" is another attitude verb requiring a propositional complement ("that Sam is glad..."). But "Sam is glad that you ought to help" *itself* fails to supply a truth-apt content under expressivism (as per Step 1), so the entire clause remains problematic. The breakdown cascades.  

  ### Step 5: Natural Repair and Its Cost  
  - **Proposed repair**: Treat "glad that S" as expressing a *higher-order attitude*. E.g., "Sam is glad that you ought to help" expresses the speaker’s endorsement of Sam’s approval of helping.  
  - **Cost**: This is **not cheap**—it undermines expressivism’s core motivation.  
    - **Why it loses appeal**: Expressivism aims to capture the *practical* function of moral language (e.g., guiding action). This repair:  
      - (i) Makes "glad that" no longer describe Sam’s mental state (it now expresses the speaker’s attitude about Sam’s attitude), distorting ordinary meaning.  
      - (ii) Abandons compositionality: The complement "you ought to help" contributes a different "meaning" (Sam’s attitude) than in freestanding uses (speaker’s attitude).  
    - **Result**: The repair either collapses into a convoluted non-compositional theory or covertly reintroduces propositions (by reifying "attitudes" as objects of gladness).  

  ### Step 6: Strongest Defender Move  
  - **Reject the clause**: The expressivist should deny that "glad that" requires a truth-apt complement. Instead, offer a uniform attitude-based semantics for all embeddings (e.g., "glad that S" expresses a complex attitude toward the state described by S).  
  - **Cost**: This is **theoretically expensive** and risks circularity.  
    - **Accounting**:  
      - Attitude verbs must be reanalyzed as operators on attitude expressions (e.g., "X is glad that S" expresses the speaker’s approval of X’s attitude toward S).  
      - But this fails for factive verbs: "Glad that" presupposes *truth*, not mere attitude (e.g., "Sam is glad that 2+2=4" is infelicitous if 2+2≠4).  
      - To handle this, expressivism must either (a) dilute "truth" to "endorsed attitude" (losing the factive norm) or (b) add ad hoc machinery (e.g., "pretense" of propositions).  
    - **Cost to expressivism**: It must complicate its semantics to mimic cognitivism, sacrificing simplicity and the direct action-guiding role of moral terms. If moral sentences can be objects of "glad that" without truth-aptness, why can’t they be true/false?  

  ### Final Accounting: Local, Not Global  
  - **Verdict**: The problem is **localized** to embeddings under factive-attitudinal operators ("glad that," "knows that," "regrets that"), not logical operators (negation, conditionals).  
  - **Why the pair works**: The verdicts fall directly from the clauses—(A) uses an operator compatible with attitude expression, (B) uses one requiring a proposition. No stipulation: The break in (B) is forced by ordinary semantics of "glad that."  
  - **Takeaway**: Your friend overgeneralizes—embedding under negation is unproblematic, but attitude ascriptions expose a genuine, localized fault. Expressivism can survive simple embeddings but stumbles on proposition-hungry contexts. The cost of repair may be worth it for expressivists, but it is not trivial.  

  This pair meets your demand for novelty and precision. The flaw in (B) is severe but confined; swapping "glad that" for negation (as in A) eliminates it, proving locality. Nesting deepens the wound without spreading it universally.
