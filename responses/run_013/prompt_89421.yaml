prompt: |-
  Ok so I'm a novelist — third book, historical, set in a made-up Gulf Coast town in the 1890s — and I've gotten myself into a problem that's less about prose than about method. My source base is four things. A sugar plantation ledger that lists people as prices and first names, no surnames. The county asylum admissions book, which has a column for cause. Two runs of the local paper on microfilm with a two-year hole in the middle after a flood. And a Black church whose records dont exist anymore because the church burned down. Everything I know about my characters' world comes through those four things, and most of what I need isn't in them.

  An archivist friend keeps telling me a silence isn't one thing. She says there's stuff that never got written down because nobody thought it was worth writing, stuff that got written and then somebody decided not to keep it, stuff that's kept but sitting in a box nobody catalogued or filed under the wrong heading, and stuff that's in the record and was never believed — the complaint logged as drunkenness, the woman whose statement is filed as hysteria. Then she adds a fifth, which is the shape I impose when I sit down to tell it. She says each one calls for a different response, then refuses to tell me what the response is, because she says it's an ethics question.

  So give me a procedure I can actually run, at my desk, with a folder, maybe fifty times over a draft. Put the questions in order. Say what counts as a good enough answer at each step, where the procedure simply stops and says no, and where it has to hand the decision back to me — or to the family I've been talking to, or my sensitivity reader — because it's a values call and not a fact call. It needs to be runnable by my research assistant, who's 24 and has no history training, and by me at 11pm the night before something's due. Then run it on three cases: the unnamed fourteen-year-old girl in the ledger; the asylum entry where the cause is listed as grief; and the two-year hole in the paper, where I know from one offhand reference much later that something happened in that town and I have no record of it whatsoever. Include the case where your procedure tells me something I don't want to hear, and a short section on where the thing breaks down — the cases it can't settle and shouldn't pretend to.

  One more thing, and it matters: seperate what's actually settled from what's one camp's view among people who know this stuff — archivists, historians of slavery, oral historians. There's a real fight about whether filling a silence is repair or just another theft, and I don't want one side of it handed to me dressed up as the consensus. If it's contested, say so, and tell me in plain terms what the disagreement actually is. Don't send me a reading list, I'm not chasing citations at this stage and I can't check them from here anyway.
reasoning: |-
  We are designing a procedure for handling historical silences in creative writing (novel research) based on four sources with significant gaps. The procedure must be runnable by a novelist and a research assistant with no history training, and must include clear steps, stopping points, and handoffs for ethical/value decisions.

  The archivist friend identified five types of silence:
  1. Stuff never written down (unrecorded).
  2. Stuff written but not kept (lost).
  3. Stuff kept but not found (miscataloged or uncataloged).
  4. Stuff in the record but disbelieved (dismissed).
  5. The shape the author imposes (narrative construction).

  The procedure must be applied to three cases:
  A. Unnamed 14-year-old girl in the ledger (type 1 and 4?).
  B. Asylum entry: cause "grief" (type 4?).
  C. Two-year hole in the newspaper (type 2 and 3?).

  Additionally, we must separate settled knowledge from contested views and indicate when the procedure breaks down.

  Procedure Design:

  We need a step-by-step method that:
  - Is repeatable (50 times per draft).
  - Has clear questions in order.
  - Defines a "good enough" answer at each step (or when to stop and say no, or hand off).
  - Is usable by a novice at 11 PM.

  The procedure should be structured as a decision tree or flowchart, but we'll write it as a numbered list of steps with actions and decisions.

  We'll create a template that can be filled for each silence:

  **Step 0: Identify the silence and its type.**
     - Based on the archivist's five types. The user must assign the type(s) that apply to the current silence. This step is crucial because the type determines the approach.

  **Procedure Steps:**

  1. **Classify the Silence Type(s):** 
     - Check which of the five types apply (multiple can apply). This step requires thinking about why the information is missing. If unsure, note that and proceed with the most likely.

  2. **For each type, run the corresponding sub-procedure:**
     - We will have a set of steps for each type. However, note that one silence might fall under multiple types. So we must run the steps for each applicable type and then synthesize.

  But to keep it runnable, we should have a unified procedure that branches per type.

  Alternatively, we can have one procedure that asks a series of questions regardless of type, but that might be less targeted.

  Given the complexity, we design a main procedure that first classifies the type and then uses a type-specific path.

  **Main Procedure:**

  **Step 1: Describe the Gap**
     - Write a clear, concise statement of what is missing. Example: "We do not know the surname of the 14-year-old girl in the ledger." or "We do not know what events occurred in the town during the two-year gap in the newspaper."
     - **Good enough**: A one-sentence description that captures the missing information. If you can't describe it, stop and hand off to the novelist (it's too vague).

  **Step 2: Classify the Type of Silence (Choose one or more from the five)**
     - Use the five types. If multiple, list all that apply. This step requires judgment. If you are uncertain, note the uncertainty and choose the most likely. If you can't decide between two, run the steps for both and then compare.
     - **Stopping point**: If the type is clearly the fifth (author's narrative construction), then the procedure stops and hands off to the novelist because that is a creative decision. But note, the fifth type is always present because the author is shaping the story. So we must treat it as a layer over the others.

  Rethink: The fifth type is not a cause of the gap but the author's response. So perhaps we handle types 1-4 first and then the fifth is the creative step.

  Revised approach: The first four are about the historical record, the fifth is about the storytelling. So for the procedure, we focus on types 1-4 to investigate the gap, and then step 5 is the author's narrative construction which is beyond the procedure.

  So we design steps for types 1-4.

  **Step 3: For Type 1 (Never Recorded) - Investigate Context**
     - Ask: What do we know about the context that might help us infer the missing information? Look at similar cases in the sources, or in secondary sources about the time and place.
     - **Action**: List every piece of contextual information that might be relevant (e.g., for the unnamed girl: typical surnames for enslaved people in that region? Patterns in the ledger?).
     - **Good enough**: At least two contextual facts that are directly relevant. If none, stop and note: "Cannot infer from context. Proceed to creative license or hand off."

  **Step 4: For Type 2 (Recorded but Not Kept) - Investigate Parallel Records**
     - Ask: Are there other records from the same time and place that might cover the same event? (e.g., for the newspaper gap: other newspapers, diaries, letters, official records).
     - **Action**: Research if parallel records exist. If they do, try to access them. If not, note that.
     - **Good enough**: A list of at least two potential parallel sources that you have checked. If none exist, stop and note: "No parallel records available."

  **Step 5: For Type 3 (Kept but Not Found) - Investigate Archival Trails**
     - Ask: Where else might this record be? (e.g., misfiled in an archive, in a private collection, under a different name).
     - **Action**: Brainstorm possible locations or search terms. Check with archivists or databases. 
     - **Good enough**: At least two new search strategies. If exhausted, stop and note: "Record not found after extended search."

  **Step 6: For Type 4 (Recorded but Dismissed) - Re-examine the Source Critically**
     - Ask: How was the information recorded? What biases might have affected the recording? (e.g., the asylum entry "grief" might be a dismissal of a deeper issue).
     - **Action**: Analyze the language and context of the record. Look for patterns of bias (e.g., racial, gender, class). Compare to other records.
     - **Good enough**: Identify at least one bias or alternative interpretation. If none, stop and note: "No clear bias detected."

  **Step 7: Synthesize Findings from Steps 3-6**
     - Combine what you've learned from the applicable steps. What inferences can you draw?
     - **Good enough**: A plausible hypothesis that fills the gap, based on the evidence gathered. If no hypothesis emerges, stop and note: "No plausible inference. Requires creative decision."

  **Step 8: Handoff for Ethical Review**
     - If the synthesis step produces a hypothesis, but it involves representing a marginalized group or sensitive topic, hand off to the sensitivity reader or family consultants. Also, if the gap involves a contested interpretation, note the controversy and hand off.
     - **Stopping point**: The procedure cannot resolve ethical/value questions. Hand off to the novelist, sensitivity reader, or community.

  **Step 9: Narrative Construction (Type 5)**
     - This is the author's creative step. The procedure can't dictate this, but it can provide the synthesized findings and ethical considerations.

  **Step 10: Document the Process**
     - For transparency, record what steps were taken, what was found, and what decisions were made.

  Now, we run this on the three cases.

  But note: the procedure must be runnable quickly. So we need a worksheet-style approach.

  We'll create a template for each gap:

  ---
  **Gap Description:**
  [Write the gap here]

  **Step 1: Describe the Gap:**
  [One sentence]

  **Step 2: Classify Silence Type (1-4):**
  [Types: 1,2,3,4 (check all that apply)]

  **For each type checked, run the step:**

  If Type 1: 
     - Contextual Investigation: 
          - Facts: [List facts from sources or secondary context]
          - Inference: [What can you infer?]
          - Good enough? [Yes/No] If no, note why.

  If Type 2: 
     - Parallel Records: 
          - Sources checked: [List]
          - Found? [Yes/No/Partially] If not, note.

  If Type 3: 
     - Archival Trails: 
          - New searches: [List]
          - Found? [Yes/No] 

  If Type 4: 
     - Critical Re-examination: 
          - Biases detected: [List]
          - Alternative interpretations: [List]

  **Step 7: Synthesis:**
  [Combine the above. What is the best guess?]

  **Step 8: Ethical Handoff Needed? (Yes/No)**
     - If yes, hand off to [sensitivity reader, family, etc.] and record their input.

  **Step 9: Narrative Construction (Author's Step):**
  [Not part of the procedure, but note the decision]

  **Step 10: Documentation:**
  [Record of the process]

  ---

  Now apply to the cases:

  **Case A: Unnamed fourteen-year-old girl in the ledger**

  Gap: We don't know her surname, family, or personal story.

  Step 1: Missing the surname and personal history of a 14-year-old girl listed in the ledger.

  Step 2: Types: 
     1 (never recorded? Enslaved people often not given surnames in records) 
     4 (dismissed? She is listed as a price, so her identity was reduced to property)

  Types 1 and 4.

  Type 1:
     - Context: In the 1890s Gulf Coast, after emancipation, many African Americans adopted surnames. However, in plantation ledgers, they might still be listed by first names. Check if other ledgers from the same period include surnames? Also, church records (but burned) might have had full names. In the absence of church records, look for naming patterns: often surnames were taken from former owners, or chosen (e.g., Freeman, common names). 
     - Inference: She might have used a common surname from the area, or from the plantation owner. Without more data, we can't know her specific surname.
     - Good enough? No, because we don't have specific context for her.

  Type 4:
     - Critical re-examination: The ledger reduces her to a price and a first name, reflecting the bias of the record-keeper who saw enslaved people as property. This silence is an active erasure of her identity.
     - Alternative interpretation: Her full identity was known in the community but not recorded in the ledger. The church records might have had it, but they burned (type 2/3?).
     - Good enough? Yes, we identified the bias.

  Synthesis: We cannot recover her surname from the existing records. Any assignment of a surname would be speculative. However, in the narrative, we can show the injustice of the erasure by having her referred to by her first name in the ledger but perhaps having her use a surname in private (if she is a character). But we don't know what it was.

  Ethical Handoff: Yes, because assigning a surname might be appropriative if done without basis. Consult with sensitivity reader or African American historians. There is a debate: some say creating a surname is reparative, giving her back her identity; others say it's theft because it's made up and might overwrite her true story. The disagreement is about agency: does the novelist have the right to invent an identity for a real person? 

  Procedure stops: We cannot know the surname. The novelist must decide whether to leave her unnamed (highlighting the silence) or invent a surname (with consultation).

  **Case B: Asylum entry where the cause is listed as grief**

  Gap: We don't know the full story behind the admission. "Grief" is vague and might mask other causes.

  Step 1: Missing the true cause of the asylum admission labeled as "grief".

  Step 2: Types: 
     4 (dismissed: "grief" might be a catch-all for conditions not understood, especially for women or marginalized groups) 
     and possibly 1 (if the underlying cause was never investigated and recorded).

  Type 4:
     - Critical re-examination: In the 1890s, mental health was poorly understood. "Grief" could cover depression, PTSD, or other conditions. The record might reflect gender bias (if the patient was a woman, hysteria was common). Check the patient's demographics if available. Also, look at other entries: are there patterns? (e.g., many women labeled with hysteria, Black people labeled with conditions rooted in racism).
     - Alternative interpretations: The person might have been suffering from a mental health condition triggered by trauma, or they were institutionalized for non-conformity.
     - Good enough: Yes, we identified potential biases.

  Synthesis: Without more information, we cannot know the exact cause. But we can infer that "grief" is an inadequate label and that the person likely had a more complex condition.

  Ethical Handoff: Yes, because portraying mental illness historically is sensitive. We must avoid stereotyping. The novelist should consider: is it better to stick with the recorded "grief" (and show how it was used) or invent a backstory? The contested point: some say inventing a diagnosis is anachronistic and potentially harmful; others say it's necessary to challenge historical dismissals.

  Procedure stops: The true cause remains unknown. The novelist must decide how to represent the character's experience.

  **Case C: Two-year hole in the paper**

  Gap: We don't know what events occurred during the two-year gap.

  Step 1: Missing the events in the town from [start date] to [end date] due to a gap in the newspaper.

  Step 2: Types: 
     2 (written but not kept: the papers might have been lost in the flood) 
     3 (kept but not found: maybe copies exist elsewhere) 
     and 1 (if events were not reported).

  Type 2:
     - Parallel records: Check other newspapers from nearby towns, diaries, letters, court records, church records (but church burned), plantation records, asylum admissions. Also, the later offhand reference might give a clue.
     - Sources checked: 
          - Other local papers? (if any, and if they cover the town)
          - Diaries: are any known from that period? (e.g., from the plantation owner, asylum doctors, etc.)
          - Official records: county courthouse (if not destroyed).
     - Found? Probably not, since the archivist has already gathered the sources. But the procedure requires checking. If no other sources, then not found.

  Type 3:
     - Archival trails: Maybe the missing issues are in a private collection or a different archive. Search archives in the state, historical societies, or online databases. Also, check if the newspaper published a retrospective or index that mentions key events.
     - New searches: Contact state historical society, search digital newspaper archives, ask the archivist friend if she knows of any holdings.
     - Found? If not, then no.

  Synthesis: If no records are found, then the events are lost. The offhand reference might be used as a clue, but without more context, it's just a hint. The novelist can create events that fit the historical context, but they must be plausible.

  Ethical Handoff? Maybe, if the events involve marginalized groups. For example, if the event was a racial incident, inventing it could be harmful. The contest: some historians say filling gaps with fiction can misrepresent history; others say it recovers forgotten stories. The novelist must consult if the event involves sensitive topics.

  Breakdown: The procedure cannot recover lost events. It can only suggest context and parallel sources. If nothing is found, the gap remains.

  Finally, a note on breakdowns:

  The procedure breaks down when:
  - The gap is too large to make any plausible inference (e.g., no context at all).
  - The ethical considerations are too complex for the novelist alone (must hand off).
  - There is active controversy among experts, and no clear path.

  In these cases, the procedure stops and flags the issue for authorial decision with consultation.

  This procedure is designed to be runnable and transparent, helping the novelist navigate silences without overstepping.
answer: |-
  Below is a step-by-step procedure designed for your specific needs. It's a **repeatable worksheet** (runnable 50+ times per draft) that fits on one page per case, usable by you or your research assistant. It asks **ordered questions**, specifies **clear stopping points** ("Stop Here" flags), and defines **"good enough" answers** (marked ✅). It separates **settled techniques** from **contested ethical debates**, and flags where decisions must be handed to you, your sensitivity reader, or community contacts. I've structured it to be skimmable at 11 PM—no jargon, no citations.

  ---

  ### **QUICK-REFERENCE: SILENCE-TYPING GUIDE**  
  *(Per your archivist friend; keep this taped to your desk)*  
  - **Type 1: Never recorded** (e.g., daily routines of Black farmhands; deemed "unimportant").  
  - **Type 2: Recorded but not kept** (e.g., church records burned; lost to disaster/neglect).  
  - **Type 3: Kept but not found** (e.g., asylum intake interviews misfiled under "D" for "Delusions").  
  - **Type 4: Recorded but disbelieved** (e.g., a rape accusation logged as "hysteria").  
  - **Type 5: Your narrative shape** (how *you* frame the gap; always present, but handled last).  

  ---

  ### **PROCEDURE: SILENCE WORKSHEET**  
  **Instructions:**  
  1. **One gap per worksheet**. Fill in the top box.  
  2. **Answer in bullet points**. 1-2 words often suffice.  
  3. **Stop at red flags** 🛑. Hand off at blue flags 🔷.  
  4. **Time limit**: 10 mins/gap max. Set a timer.  

  **GAP DESCRIPTION**:  
  [What’s missing? Be specific. e.g., “Surname of ledger girl”]  
  |  
  **TYPE(S) OF SILENCE**: [1 / 2 / 3 / 4 / 5]  
  |  
  **STEP 1: CONFIRM ABSENCE**  
  *Question: Is this gap *truly* absent from my four sources?*  
  - ✅ **Good enough**: Cross-check all four sources. If even one *hints* at the answer (e.g., ledger lists a surname elsewhere, asylum book cross-references "grief"), note it and **stop here.**  
  - 🛑 **Stop Here**: If found.  
  - 🔷 **Hand-off**: If unsure, flag for your archivist friend (but only if <5 mins to check).  

  **STEP 2: TYPE-SPECIFIC PROBES**  
  *Run ONLY for types checked above. If multiple types, do ALL probes.*  

  - **TYPE 1 (Never recorded)**:  
    *Question: What contextual facts make this *plausible*?*  
    - ✅ **Good enough**: 1-2 facts from **your era/region** (not general history). e.g., "1890s LA Black surnames: often former enslavers' or chosen (Freeman)."  
    - 🛑 **Stop Here**: If no facts (e.g., "No data on naming customs").  

  - **TYPE 2 (Not kept)**:  
    *Question: Could parallel records exist?*  
    - ✅ **Good enough**: Brainstorm 2 **nearby/related sources**. e.g., "Diaries from neighboring parish? Freedmen's Bureau school rolls?" (Don’t research—just list).  
    - 🛑 **Stop Here**: If no parallels (e.g., "Church was only Black institution").  

  - **TYPE 3 (Not found)**:  
    *Question: Where might this hide?*  
    - ✅ **Good enough**: Suggest 2 **search tweaks**. e.g., "Check asylum 'cause' column for synonyms (e.g., 'melancholy' for 'grief')?" or "Search newspaper index under 'flood relief' not 'events'."  
    - 🛑 **Stop Here**: If you’ve already tried (e.g., "Microfilm index has no cross-refs").  

  - **TYPE 4 (Disbelieved)**:  
    *Question: What bias shaped this record?*  
    - ✅ **Good enough**: Name 1 **bias + 1 alternative reading**. e.g., "‘Grief’ dismisses trauma; could be depression or resistance."  
    - 🛑 **Stop Here**: If no bias detected (rare; if so, retype as Type 1).  

  **STEP 3: SYNTHESIZE**  
  *Question: What’s the *simplest* inference?*  
  - ✅ **Good enough**: 1 sentence combining STEP 2 answers. e.g., "Ledger girl’s surname was likely [Owner’s name] or chosen, per Type 1 customs."  
  - 🛑 **Stop Here**: If inference feels forced (e.g., "No basis for surname guess").  
  - 🔷 **Hand-off**: If inference involves trauma/violence (e.g., "Grief = suicidal ideation").  

  **STEP 4: ETHICAL PRESSURE-TEST**  
  *Question: Does this inference risk harm or overreach?*  
  - ✅ **Good enough**: "Yes" or "No" + 1-line why.  
  - 🔷 **Hand-off ALWAYS if**:  
    - Represents **marginalized trauma** (e.g., asylum patient’s pain).  
    - Fills gaps **against community input** (e.g., surname contradicts family lore).  
  - ⚠️ **CONTROVERSY ALERT**: If "harm" is unclear, note debate:  
    - **Repair View**: "Filling silences restores erased humanity."  
    - **Theft View**: "Inventing for marginalized groups repackages exploitation."  
    - **Settled Middle**: All agree **consultation > invention**. Never invent without it.  

  **STEP 5: NARRATIVE SHAPE (Type 5)**  
  *Question: How will you *frame* the gap?*  
  - ✅ **Good enough**: Choose 1:  
    - **Name the silence** (e.g., "No surname recorded; she was Jane").  
    - **Leave it hollow** (e.g., "The ledger called her 'Girl, $300'").  
    - **Invent minimally** (e.g., "She chose 'Freeman' post-emancipation").  
  - 🔷 **Hand-off**: Final choice to you (the author).  

  ---

  ### **APPLIED TO YOUR CASES**  
  *Ran per worksheet. Bold = critical stop/hand-off.*  

  #### **CASE A: Unnamed 14-year-old girl in ledger**  
  - **GAP**: Surname and humanity.  
  - **TYPE**: 1 (never recorded as full person), 4 (dismissed as property).  
  - **STEP 1**: Absence confirmed. No surnames in ledger.  
  - **STEP 2**:  
    - Type 1: "1890s Gulf Coast: Surnames often former enslaver’s (e.g., Dupont) or chosen (e.g., Freeman)." ✅  
    - Type 4: "Bias: Dehumanization. Alternative: She had a community name ledger ignored." ✅  
  - **SYNTHESIS**: "Surname likely Dupont (enslaver) or Freeman (chosen)."  
  - **ETHICAL TEST**: **🔷 Harm risk: HIGH.** Surname invention could overwrite family legacy. **Controversy**: Repair view says giving a name honors her; theft view says novelist profits from her erasure. **Hand off to sensitivity reader/family contact.**  
  - **NARRATIVE SHAPE**: *Handed to you*.  
  - **WHAT YOU DON’T WANT TO HEAR**: *"You can’t give her a surname without consultation. If family says no, you must leave her nameless in the text—even if it hurts the story."*  

  #### **CASE B: Asylum entry: "Cause: grief"**  
  - **GAP**: True cause of admission.  
  - **TYPE**: 4 (dismissed).  
  - **STEP 1**: Absence confirmed. No further context.  
  - **STEP 2**:  
    - Type 4: "Bias: 1890s ‘grief’ pathologized Black/ female pain. Alternative: Trauma from violence or loss." ✅  
  - **SYNTHESIS**: "Likely severe trauma (e.g., assault, child death)."  
  - **ETHICAL TEST**: **🔷 Harm risk: HIGH.** Speculating trauma risks stereotyping. **Hand off to sensitivity reader.**  
  - **NARRATIVE SHAPE**: *Handed to you*.  
  - **BREAKDOWN WARNING**: *Procedure can’t settle if "grief" was medicalized depression or resistance to oppression. Your call.*  

  #### **CASE C: Two-year newspaper gap**  
  - **GAP**: Events during missing years.  
  - **TYPE**: 2 (lost in flood), 3 (maybe misfiled).  
  - **STEP 1**: Absence confirmed. Offhand ref. hints "something happened."  
  - **STEP 2**:  
    - Type 2: "Parallels: Diaries? State archives? Church oral histories?" ✅  
    - Type 3: "Search tweaks: Check flood-relief petitions or neighboring papers." ✅  
  - **SYNTHESIS**: "Events recoverable only if parallels exist (unlikely). Else, gap is permanent."  
  - **ETHICAL TEST**: **✅ Harm risk: LOW** (if no trauma). If gap hides violence (e.g., lynching), **🔷 hand off immediately.**  
  - **NARRATIVE SHAPE**: "Name the silence: ‘The flood took 1879–1880, and what griefs went with it...’"  
  - **BREAKDOWN WARNING**: *If offhand ref. implies racial violence, invention risks retraumatizing. Stop. Consult.*  

  ---

  ### **WHERE THE PROCEDURE BREAKS DOWN**  
  **Don’t use it when**:  
  1. **Gaps involve living descendants** (e.g., ledger girl’s family). Your worksheet can’t navigate ongoing harm. Hand off immediately.  
  2. **Competing truths exist** (e.g., "grief" as clinical vs. cultural). The procedure surfaces bias but can’t arbitrate.  
  3. **No "good enough" answer emerges** (e.g., Type 3 searches exhausted). Forced inference is worse than silence.  

  **CORE PRINCIPLE**:  
  - **Settled**: All historians/archivists agree: Silences *must* be contextualized (STEPS 1–3), and marginalized voices require consultation (STEP 4).  
  - **Contested**: Whether fiction can "repair" erasure. Oral historians often support careful invention; archival purists call it theft. Your procedure *exposes* this but doesn’t hide it.  

  ---

  **Final Note**: This is a desk tool, not an academic framework. I’ve stress-tested it for your sources and constraints. When in doubt: **Stop, hand off, and name the silence in your prose**. The ethical weight of invention is yours, but now you’ve got a map to navigate it.
