answer: |-
  1.  The doctor held up the cube and the sphere. "Which one is the cube?" he asked the newly sighted man, who hesitated, then pointed to the sphere, wondering if the word "cube" had always meant the *feeling* in his hand.
  2.  After the bandages came off, they showed him the shapes he knew so well by touch. His long silence wasn't blindness, but the shock of discovering his hand's "sphere" looked utterly unlike his eye's.
  3.  "Identify the cube," instructed the surgeon, placing the familiar objects before him. The patient touched the cube while staring at it, unsure if they were testing his new eyes or the old concept itself.
  4.  He confidently named the sphere by sight alone. Later, privately, he worried: had he recognized the *shape*, or merely guessed which lumpy visual mess matched the smooth tactile word "sphere"?
  5.  They handed him the sphere as he looked at it, asking "What is this?" In that moment, both the man *and* the word "sphere" were on trial.
