  For the jokes, I'll focus on different angles: the naming confusion between senses, the silent moment of uncertainty, the dual examination of man versus concept, the patient's internal doubt about what's being tested, and the idea that both man and word are being interrogated. Each joke will stay within two sentences to keep them concise and tellable aloud.

