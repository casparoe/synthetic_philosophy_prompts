prompt: |-
  I've got no philosophy background (I'm a backend dev) so sorry if this is a dumb question, but I keep going back and forth on it and want to know if there's an actual principle here or if I'm just rationalizing.

  Everyone says knowledge beats a true belief that just happens to be right. My gut doesn't always agree.

  - Driving to a wedding: a friend who's never been there guesses the right exit, another friend who's been ten times gives the same exit. I honestly dont care which one I follow. Same exit, we get there.
  - At trivia, if a teammate blurts the right answer out of nowhere, I'm exactly as happy as if she actually knew it.
  - But with my doctor: "I've seen this a hundred times, it's viral" vs "I'm basically guessing, but I think it's viral" -- both turn out right, and I still feel way better about the first one. Why? Same answer.
  - A buddy swears by a coin-flip stock method and he's up 40% this year. I still wouldn't take his pick over someone who actually understands the company, even though he's been right so far.
  - My kid asks whether there are more doors or wheels in the world, and I have a strong hunch. If my hunch happens to be right, is that worse than if I actually knew? I completly can't tell.

  The best thing I've come up with is that a lucky true belief is like hardcoding an answer that happens to pass this one test, while knowing is like having the actual algorithm -- same output on this input, totally different when the input changes. But then the wedding and trivia cases should bug me and they don't, and I don't know if that's me being inconsistent or the principle being wrong.

  So: is there a principle that gets all five, or do I have to throw one out? And what does your principle say about a case I haven't listed -- like a jury that convicts the actually-guilty person for completly bogus reasons?
