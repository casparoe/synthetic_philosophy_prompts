prompt: |-
  I just got appointed to the zoning board of appeals in my city -- I'm the newest member and by far the youngest, and I have an undergrad degree in philosophy that I mostly keep to myself. We hear six to nine variance and special-permit applications a month, each one gets about fifteen minutes of discussion, and whatever we decide I have to state reasons for on the record that a lawyer can defend if someone appeals us to court. Our code gives four criteria for a variance, roughly: (1) the owner faces a practical difficulty or unnecessary hardship that isn't self-created, (2) granting it won't be substantially detrimental to neighboring property, (3) it's consistent with the comprehensive plan, and (4) it isn't contrary to the public interest. Last month the city attorney sent around a memo saying 'neighborhood character' on its own isn't a legal basis for denial, and the council just amended the comprehensive plan to add a clause telling us we may consider the effect of a decision on the supply of housing affordable to households below 60% of area median income. Nobody on the board, including the chair, seems to know what to do with that clause, and in practice most of our votes come down to how many people showed up to object.

  What's bothering me is that these feel like philosophical questions wearing zoning clothes. I've been reading about the idea -- associated with Lefebvre and later taken up by Harvey -- that inhabitants have a collective claim on the city that isn't reducible to what property owners want, and about the critique that neighborhood veto power is often just a respectable way of excluding people. But I also sit there listening to a retired couple who genuinely will lose their afternoon sun, and I don't think the theory has anything to say to them that isn't insulting. So here's what I want. You're a philosopher who actually works with planning practitioners -- please think carefully and start with a short brainstorm of what you take the right to the city to require in a body like ours and what it can't mean (it obviously can't mean any resident gets to veto any change, but say why, and say what the collective character of the claim is actually doing), then turn it into a decision procedure I can run in fifteen minutes, out loud, in plain English, without sounding like I'm giving a seminar to the other comissioners. I need: the questions to ask in order; what counts as a sufficient answer to each; which steps are pure fact and which are values; where the procedure stops with a flat no; and where it hands the thing to my judgment, marked as such, so I can say honestly on the record that this is where I'm exercising discretion. Keep whatever distinctions from the theory are load-bearing for the hard cases and tell me which ones I can drop.

  Then run it on three cases. First, a homeowner who wants a variance to convert her detached garage into a small rental unit; four neighbors have written in about parking and about the loss of the side yard's light. Second, a developer proposing sixty units, twelve of them deed-restricted affordable, on a lot with a shuttered dry cleaner, against an organized neighborhood group whose petition says the building 'doesn't fit' and will 'change the feel of the street' -- I'll admit I want to approve this one and I want to know if the procedure lets me. Third, a proposal to convert a single-family house into a sober-living home for eight people, where the objections at the hearing are about 'safety' and 'transient population,' and I genuinely can't tell how much of that is pretext. I'd rather you give me at least one case where the procedure says no to something I like than one where it just ratifies my instincts -- if the equity side of the theory implies denying a project that adds housing because it displaces the tenants who are already there, tell me that and make me live with it. Finally, tell me where this procedure will misfire, which steps are judgment dressed up as arithmetic, and what it simply can't decide -- because I'd rather know the failure modes than pretend I have a formula.
reasoning: |-
  Okay, this user is a newly appointed zoning board member with a philosophy background, feeling overwhelmed by the ethical and practical tensions in their role. They're grappling with Henri Lefebvre's "right to the city" concept while needing concrete tools for real-world decisions. 

  First, let's unpack their core tension: They want to operationalize radical urban theory ("inhabitants' collective claim") within bureaucratic constraints (15-minute hearings, legal defensibility). The memo about affordable housing adds urgency—they sense traditional "neighborhood character" objections often mask exclusion but also empathize with small-scale impacts like lost sunlight. 

  Hmm, their three test cases are brilliantly chosen to stress-test any framework: 
  - Case 1 (garage conversion) pits incremental housing against hyperlocal impacts 
  - Case 2 (60-unit development) confronts NIMBYism disguised as aesthetic concern 
  - Case 3 (sober-living home) exposes prejudice masquerading as safety worries 

  What they're really asking for is a *translation device*—something that turns Lefebvre's critique of property-centric planning into checklist questions even skeptical board members can't dismiss as academic. The unspoken need: legitimacy. They want to deny exclusionary claims without sounding like a ideologue. 

  Key challenges: 
  - Must avoid "seminar" language (no mentioning Marxian urban theory!) 
  - Needs clear off-ramps for denial (where discretion isn't allowed) 
  - Must flag where judgment calls hide (no false objectivity) 
  - Should expose when "community input" is actually exclusion 

  Ah—the genius move is structuring it as a *filter*: hard legal gates first (e.g., "self-created hardship?"), then equity filters ("net housing gain?"), finally judgment zones flagged explicitly ("Here's where I weigh sunlight vs. rental unit"). This mirrors administrative law's "arbitrary and capricious" standard while baking in right-to-city values. 

  For the sober-living case, the procedure must force parsing "safety" concerns: either demand evidence (crime stats?) or call it prejudice. The affordable housing clause becomes a lever here—if opponents can't substantiate harm beyond "feel," equity wins. 

  Biggest risk: The "net housing" metric could backfire if displacement isn't accounted for. Hence the explicit warning about counting *existing* vulnerable tenants. User's willingness to accept "no" on a pro-housing case shows admirable intellectual honesty—we should reward that with equal rigor. 

  Final note: The "where it misfires" section is crucial. This isn't a philosophy seminar; it's a tool for messy democracy. Calling out its blind spots (e.g., climate resilience, deep community history) builds trust in the framework itself.
answer: |-
  Here’s a practical decision procedure grounded in the "right to the city" (RTC) ethos—translated for zoning hearings—that prioritizes **inclusive habitability** (access to housing/opportunity) while respecting legitimate localized impacts. RTC, in this context, means:  
  **What it requires**: Prioritizing the city as a shared resource for *all* inhabitants—especially marginalized groups—over exclusionary property interests.  
  **What it can’t mean**: Individual veto power over change, as cities evolve and housing needs outweigh subjective preferences. The "collective claim" means decisions must serve the *whole city's* needs, not just immediate neighbors.  

  ---

  ### **The 15-Minute Decision Procedure**  
  **(Ask in Order—Stop if any step yields a "No")**  

  1. **LEGAL GATEKEEPING (Fact-Dominant)**  
     *Question*: "Does the applicant face a unique practical difficulty or hardship **not caused by their own actions**? (e.g., odd lot shape, topography—not 'I want more profit')."  
     *Sufficient Answer*: Verified physical/legal constraint (e.g., survey, deed restrictions). *If no hardship or self-created* → **DENY**. *Variance stops here*.  
     *For special permits*: Skip to Step 2.  

  2. **HARM PREVENTION (Fact/Evidence-Dominant)**  
     *Question*: "Is there **verifiable evidence** this will cause *substantial* harm to neighbors? (e.g., traffic studies showing unsafe congestion, environmental reports, shadow studies proving total loss of light—*not* 'views' or 'character')."  
     *Sufficient Answer*: Data from engineers, planners, or health departments. Subjective complaints ≠ evidence. *If verified harm* → **DENY**.  

  3. **EQUITY FILTER (Values/Judgment)**  
     *Question*: "Does this project **add net housing** (especially affordable units) **without displacing current vulnerable residents?**"  
     *Sufficient Answer*:  
       - For new construction: Count net units (+ affordable if applicable).  
       - For conversions: No displacement of existing tenants.  
       - *If net housing gain* → Strong presumption to **APPROVE** unless Step 2 harm exists.  
       - *If displacement* → **DENY** (RTC prioritizes existing inhabitants).  

  4. **DISCRETION ZONE (Explicit Judgment)**  
     *Where procedure stops*: "If we pass Steps 1–3, I now weigh **minor impacts vs. public benefit**. On balance, does the need for housing/inclusive access outweigh *modest* inconveniences (e.g., some parking strain, partial shade)?"  
     *Say aloud*: "Here’s my judgment call: [X]’s benefit to the broader community outweighs [Y]’s impact on neighbors."  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Garage Conversion to Rental Unit**  
  - Step 1: Hardship? *Maybe* (e.g., fixed income). If self-created (e.g., "I want rental income") → **DENY**.  
  - Step 2: Harm? Loss of light? *Request shadow study*. If minor/partial → insufficient. Parking? *Require traffic count*. If <5 added cars → not "substantial."  
  - Step 3: Net housing? +1 unit (likely affordable). **No displacement → APPROVE presumption**.  
  - Step 4: Judgment: "Adding a small rental helps housing access; partial shade/parking tweaks don’t outweigh this."  
  **→ APPROVE (unless hard harm in Step 2)**  

  **Case 2: 60-Unit Development (12 Affordable)**  
  - Step 1: (Special permit) → Skip to Step 2.  
  - Step 2: Harm? "Doesn’t fit" isn’t evidence. *Require studies*: If traffic/sewage handles it, no harm.  
  - Step 3: Net housing? +60 units (+12 affordable). **Strong APPROVE presumption**.  
  - Step 4: Judgment: "12 affordable units serve the city’s needs; vague 'character' concerns don’t override this."  
  **→ APPROVE (absent hard data in Step 2)**. *RTC rejects exclusionary "feel" arguments*.  

  **Case 3: Sober-Living Home (8 Residents)**  
  - Step 1: (Likely special permit) → Skip to Step 2.  
  - Step 2: Harm? "Safety/transients" → *Demand evidence*: Crime stats? Overcrowding? If none → insufficient.  
  - Step 3: Net housing? Converts single-family → 8 beds. *No displacement → APPROVE presumption*.  
  - Step 4: Judgment: "Housing for vulnerable people is a public good; unproven safety fears don’t justify denial."  
  **→ APPROVE**. *"Transient" is often coded prejudice—RTC forbids privileging comfort over survival*.  

  ---

  ### **Where It Misfires & Failure Modes**  
  1. **"Net housing" oversimplifies**: Doesn’t capture deep affordability (e.g., 60% AMI vs. 30% AMI needs). *Fix*: Advocate for deeper income targeting in city policy.  
  2. **Ignores cumulative impacts**: Approving 10 garage conversions could overwhelm parking. *Fix*: Track patterns; flag systemic issues.  
  3. **Climate blind**: No weight for tree loss/heat islands. *Fix*: Push for code updates.  
  4. **Displacement loophole**: If tenants leave "voluntarily" due to construction noise, it’s invisible. *Fix*: Require relocation plans for all projects.  
  5. **Judgment masked as fact**: In Step 4, calling parking "modest" vs. "severe" is subjective. *Mitigate*: Say: "This is my discretion call—I find the benefit greater."  
  6. **Can’t resolve**: Deeply held cultural ties to place (e.g., historic Black church block). Procedure can’t quantify this—requires council-level policy.  

  **Key Takeaway**: This method blocks exclusionary vetoes (Cases 2–3), permits incremental housing (Case 1), and forces objectors to prove *real harm*—not preference. It makes discretion explicit, defensible, and focused on **who the city is for**.  

  > "The right to the city is like a muscle: it atrophies when we prioritize comfort over need. Your vote isn’t about making change painless—it’s about making pain equitable."
