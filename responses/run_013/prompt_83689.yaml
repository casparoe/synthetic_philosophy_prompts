prompt: |-
  I'm in the second term of a moral philosophy seminar, and we have just spent three weeks on whether there can be genuine moral dilemmas — situations in which an agent is required to do each of two things she cannot both do, so that whatever she does she does wrong. I came in a sceptic, on the grounds that a requirement you cannot possibly meet is not a requirement at all, and I have left less sure. What I want from you is not a tour of the literature — I know the positions, and I don't need reading lists — but an attempt to find the principle behind a set of verdicts I have been keeping in a notebook, along with a candid account of which verdicts the best principle forces me to give up.

  My verdicts are these. When a coast guard can reach only one of two swimmers caught in a rip on opposite sides of a headland, I do not think she faces a genuine dilemma: she must save one, she may save either, and the death of the one she cannot reach is a calamity rather than a wrong she commits. When a climber whose rope team is sliding toward a crevasse can cut the rope and drop the lowest climber, saving the rest, I do not think he faces a dilemma either; the dropped climber's death is a consequence of a move that is plainly permissible, not something done to him. But when a militia commander tells me to name one of my two innocent neighbours as a collaborator — the one I name will be shot, and if I refuse he shoots both — I do think I face a genuine dilemma, and that I come out of it having done something I should not have done whichever way I turn. Yet when a civil servant could avert a policy that will kill thousands only by planting evidence that sends an innocent colleague to prison, I do not think he faces a dilemma at all: framing an innocent person is simply off the table, so there is nothing to weigh. I can feel the militiaman and the civil servant pulling against each other, and I cannot say what separates them. Then there is the case I keep going back and forth on: I promised my dying mother that I would never let her estranged son back into the house, and he has now turned up homeless and ill with nowhere else to go, and I cannot tell whether that is a genuine dilemma or merely a hard choice.

  The only principle I have managed to formulate is what I have been calling the debt test: an option is clean if I could take it and afterwards owe no one an apology, and a conflict is a genuine dilemma only when every available option is dirty in that sense. It seems to get the coast guard and the climber right, and the militiaman too. But it makes the civil servant's case a dilemma, which I resist; it makes the promise to my mother a dilemma, which I am not sure I want; and it suggests the coast guard's case is a dilemma after all, since I know I should feel I owed the drowned swimmer's family something. So I would like you to state as precisely as you can the principle, or small family of principles, that best fits these verdicts; to say what each candidate implies about cases I have not mentioned — whether a doctor who must give the last dose of an antidote to one of two dying patients faces a dilemma, say, or a person who could stop a bombing only by authorizing the torture of a man who may be innocent; and to be straight with me about which of my verdicts I have to surrender. I would genuinely rather have a simple principle that overturns two of my verdicts than a complicated one that saves them all.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a moral philosophy seminar and struggling with the concept of genuine moral dilemmas. They've presented several scenarios where their intuitions vary, and they want a principle that explains these judgments without being overly complex.

  First, I need to understand their core issue. They’re caught between their initial skepticism about moral dilemmas and the intuition that some situations, like the militia commander case, feel like genuine dilemmas. Their "debt test" principle isn't quite working because it conflicts with some of their verdicts, especially the civil servant and the promise to the mother.

  Looking at their scenarios: the coast guard and climber cases don’t feel like dilemmas to them, while the militia commander does. The civil servant framing an innocent is off-limits, no dilemma. The promise case is ambiguous for them. 

  The key is to find a principle that explains why some conflicts are dilemmas and others aren’t. Their resistance to the civil servant being a dilemma suggests that some actions are inherently wrong, regardless of consequences. That points towards deontological constraints. But in the militia case, choosing one neighbor to die still feels wrong, even though it’s necessary to save the other. 

  So maybe the principle involves whether the harm is directly intended versus merely foreseen. In the militia case, naming a neighbor directly causes their death, while in the coast guard, not saving the second swimmer is a foreseen consequence but not directly intended. That explains the coast guard and climber cases. 

  The civil servant framing an innocent is directly intending harm through deception and injustice, which is prohibited, so no dilemma. But why is the militia case different? Because the commander forces a choice where either action directly causes harm—refusing gets both killed, which the user might see as directly responsible. 

  For the promise case, breaking the promise directly wrongs the mother, but keeping it wrongs the brother. Both harms are direct, making it a dilemma. The user is unsure here, which fits if the principle involves direct intention. 

  The doctor with the antidote would be like the coast guard—foreseen harm, not direct, so no dilemma. Torturing a possibly innocent person to stop a bombing is directly intending harm, prohibited, so no dilemma, similar to the civil servant. 

  The user might need to surrender their verdict on the militia case not being a dilemma, but they already think it is. The civil servant case fits with no dilemma. The promise case becomes a dilemma, which they were ambivalent about. The debt test’s issue with owing an apology to the drowned swimmer's family might be addressed by distinguishing direct harm from unavoidable consequences. 

  Overall, the Principle of Direct Intention seems to align most of their verdicts, requiring them to accept the promise case as a dilemma and possibly refine why the militia case feels different. It’s simpler than the debt test and handles the cases systematically.
answer: |-
  Based on your verdicts and the need for a simple, principle-driven explanation, the best fit is the **Principle of Direct Intention vs. Foreseen Consequence**. Here's the principle stated precisely:

  **A genuine moral dilemma exists only when:**
  1.  **Every available action involves directly intending, causing, or authorizing a serious moral wrong to a specific person(s),** AND
  2.  **The agent is the primary moral author of that specific wrong through their chosen action.**

  ### How This Principle Explains Your Verdicts
  1.  **Coast Guard:** Saving swimmer A directly intends *saving A*. Swimmer B's death is a foreseen but unintended consequence of the *inability* to save both (a natural limitation). The guard does not *intend* or *cause* B's death; they fail to prevent it due to circumstance. **No dilemma. (Matches your verdict)**
  2.  **Climber:** Cutting the rope directly intends *saving the upper climbers*. The lower climber's death is a foreseen but unintended consequence of the act *necessary* to achieve the intended good. The agent doesn't *aim* at the death; they aim at stopping the slide, with death as a side-effect. **No dilemma. (Matches your verdict)**
  3.  **Militia Commander:**
      *   *Name a neighbor:* You directly intend *naming X*, knowing this *directly causes* X's wrongful execution by the commander. You are the primary author of X's specific death *in this scenario* (your act is the trigger).
      *   *Refuse:* You directly intend *refusal*, knowing this *directly causes* the commander to wrongfully execute *both*. You are the primary author of the specific deaths of both *in this scenario*.
      *   Every option requires you to directly intend an action that wrongfully causes the death of specific innocents. **Genuine dilemma. (Matches your verdict)**
  4.  **Civil Servant:** Framing the innocent colleague directly intends *committing an act of deception and injustice* (planting evidence) *against a specific innocent person* to cause their wrongful imprisonment. It is intrinsically wrong to directly intend this kind of harm to an innocent. **No dilemma** because the prohibited action is off the table; the principle identifies it as a direct wrong you cannot intend. **The foreseen deaths of thousands do not justify directly intending this specific, intrinsic wrong.** (Matches your verdict).
  5.  **Dying Mother's Promise:**
      *   *Keep Promise:* You directly intend *refusing entry* to your brother, knowing this *directly causes* him serious harm (homelessness, illness) *despite his specific need and your capability*. This violates a duty of care/specific beneficence.
      *   *Break Promise:* You directly intend *breaking a solemn, specific promise* made to your dying mother, violating the duty of fidelity *to her*.
      *   Every option requires you to directly intend violating a serious moral duty *to a specific person* (mother or brother). **Genuine dilemma.** (Your ambivalence is resolved by the principle).

  ### Why the Principle Works & Addresses the Debt Test Problems
  *   **Distinguishes Mechanisms:** It cleanly separates *directly intending/wronging* from *foreseeing harm* you cannot prevent without intending another wrong. This explains the coast guard/climber vs. militia difference.
  *   **Handles Prohibitions:** It explains why the civil servant has no dilemma – framing is *intrinsically* a direct wrong that cannot be intended. The "off the table" feeling is captured.
  *   **Debt Test Problems Solved:**
      *   **Coast Guard:** You don't owe an apology *for the death* to the drowned swimmer's family under this principle because you didn't *cause* their death; circumstances prevented you from saving them. You might owe compassion or regret for the *tragedy*, but not an apology for *wronging* them. The principle explains this distinction.
      *   **Civil Servant:** Framing *is* a direct wrong; you would owe the framed colleague an apology *for the framing*. The principle correctly identifies this as prohibited, avoiding the debt test's erroneous suggestion of a dilemma.
      *   **Mother's Promise:** The debt test correctly flags both options as "dirty" (owing apology to mother or brother), aligning with the principle's verdict of a dilemma here. Your hesitation likely stemmed from the debt test's inability to explain the *other* cases, not this one.

  ### Verdicts You Must Surrender
  This principle requires you to surrender **one core intuition**:

  *   **The Militiaman Case is NOT a Unique Type of "Dirty Hands" Justification:** Your intuition that you "come out of it having done something I should not have done whichever way I turn" is **correct and preserved** by the principle (it *is* a genuine dilemma). However, the principle forces a subtle shift: the reason it's a dilemma isn't primarily the *feeling* of debt/apology (as the debt test emphasizes), but because **each option intrinsically involves you directly intending/wronging specific innocents.** The "dirtiness" stems from the *nature of the act itself*, not just the feeling afterward. You must accept that the militia case shares its *fundamental structure* (directly intending a wrong to specific persons) with the mother's promise case, even if the stakes feel different.

  ### How it Handles New Cases (As Requested)
  1.  **Doctor & Last Dose:**
      *   Giving the dose to Patient A directly intends *saving A*. Patient B's death is a foreseen but unintended consequence of the *inability* to save both (resource scarcity). The doctor does not *intend* or *cause* B's death; they fail to prevent it due to circumstance. **No dilemma.** (Like Coast Guard).
  2.  **Torture to Stop Bombing:**
      *   Authorizing torture directly intends *inflicting severe, intrinsic harm/wrong* on a specific person (the man) who may be innocent. Even if effective, the act is an intrinsic wrong. **No dilemma.** (Like Civil Servant). The foreseen deaths do not justify directly intending this specific, intrinsic wrong to an individual. The *possibility* of innocence strengthens the prohibition.

  ### Why Simplicity Wins
  This principle relies on one core distinction (Direct Intention/Authoring vs. Foreseen Consequence) applied to the *nature of the act and its object* (wronging specific persons). It captures the essence of your strongest intuitions:
  *   Moral luck/circumstance absolves the coast guard/climber/doctor.
  *   Intrinsic prohibitions block the civil servant/torture scenario.
  *   Forced choices *between directly wronging specific persons* create genuine dilemmas (militia, promise).

  It requires surrendering only the idea that the militia case's "dirtiness" is fundamentally different *in kind* from the promise case's (though the *degree* of wrong may differ), and firmly grounds the "off the table" intuition in the nature of direct intention of intrinsic wrongs. It provides a clear, action-based criterion rather than relying on the subjective feeling of "owing an apology."
