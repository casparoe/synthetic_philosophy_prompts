prompt: |-
  I keep getting into arguments about this and I'd like to know if there's an actual principle behind my verdicts, because right now I think I'm just being inconsistent and I dont like it.

  Here's the kind of thing I mean. Our town put up a centenary plaque saying we'd taken in refugees during the war, and it turns out from the council minutes that we turned them away at the station. I think the plaque has to be changed, no argument. But my nan's story that her dad won a medal at Ypres, which the service records show never happened — I'd never correct her, and I'd think less of anyone who did.

  Then: a school textbook repeating the story that the local castle held out against the king for a year, when the archaeology says it fell in a fortnight — the textbook's just wrong and should be fixed. But the church's Easter procession re-enacts a martyrdom the historians say probably never happened, and I'd be furious if anyone tried to "correct" it.

  Now the ones that trip me up. A mate of mine works on a land claim where the community's account puts their people on a particular river flat from well before the written record has anyone there at all, and that written record is a survey drawn up by the same colonial office that moved them off it. I think the community's account should carry real evidential weight here, not just be "memory" we tolerate — the written record isn't neutral, it's someone else's memory with a stamp on it.

  But then there's the other one. There's a village near us whose whole identity is that a local man invented a particular farm machine, and the patent records pretty clearly show a man two counties over got there first. Correcting them would be true and would also gut the one thing the village has. I can't work out why I want to leave that alone when I want the refugee plaque pulled down. Both are false, both are public, both are load-bearing for the place's self-image.

  My half-formed principle is something like: memory gets to keep its place where the record can't be disentangled from the interests that made it, and where the memory isn't really doing history at all — but I don't know whether that saves the machine village or condemns it. What I want is the actual principle, or two if I need two, stated so I can apply it. What does it say about a memorial to a massacre that the record says was smaller than the community remembers; about a family that wants its ancestor's conviction struck from a local history because the trial was rigged; and about a museum label that currently gives the community's version of where an object came from? And tell me honestly which of my verdicts above I have to give up, because I suspect at least one.

  Also — I keep saying "the record" when half the time I mean the archive, the pile of documents, and half the time I mean the settled critical account. Does that distinction do any work, or am I just hiding the problem in a word?
reasoning: |-
  Okay, the user is struggling with inconsistency in how they judge historical accuracy versus community memory. They provided several examples where they feel conflicted. Let me start by understanding each scenario they mentioned. 

  First, the centenary plaque in their town falsely claims they took in refugees when records show they turned them away. The user insists it must be corrected. Then, their nan’s story about her dad winning a medal—though false—they wouldn’t correct. The school textbook error about the castle siege is wrong and should be fixed, but the church's re-enactment of a probably false martyrdom shouldn't be touched. 

  The land claim case is interesting. The community's oral history contradicts colonial records. The user believes the community's account should have evidential weight since the colonial records aren't neutral. But the village claiming an inventor where patent records show otherwise—they feel correcting it would harm the village's identity. 

  The user’s half-formed principle ties memory to situations where records are biased and when memory isn't doing history. But they’re unsure how to apply it. They also question their use of "the record" meaning both archives and settled accounts. 

  Hmm, their core conflict is between factual accuracy and the social function of narratives. They need principles that distinguish between historical documentation and lived memory. The land claim example shows awareness of power dynamics in records. The plaque versus the village inventor issue highlights harm: correcting the plaque rectifies an injustice, but correcting the inventor erases identity. 

  The martyrdom re-enactment is a ritual, not claiming historical fact, so it serves a different purpose. The family wanting a conviction removed due to a rigged trial involves justice—correcting an injustice. The museum label might need both community input and historical context. 

  The user might be missing that context and function matter. Also, their use of "the record" conflates raw documents (which can be biased) with critical history (which interprets). Distinguishing these could help. They need to accept that the village inventor case might require correction but with sensitivity to identity loss. Their verdict on the plaque is solid, but the inventor village might need a nuanced approach rather than leaving it unchanged. 

  They value both truth and community but need a framework to balance them. Principles like epistemic justice, social function, and genre sensitivity could guide them. They should acknowledge that the inventor village's narrative, while false, serves a purpose, but perhaps finding a middle ground—like adding context without erasing—would be better than outright correction or silence.
answer: |-
  Your struggle reveals deep insight into how history functions in society—not as a single truth, but as contested terrain where evidence, identity, power, and purpose collide. Your verdicts aren't inconsistent; they reflect intuitive application of nuanced principles. Here's a framework to clarify them:

  ### Core Principles
  1.  **Purpose & Genre:** *What is the function of the narrative?*
      *   **Historical Documentation/Education:** Seeks factual accuracy within critical scholarship (e.g., plaque, textbook, land claim evidence, museum label). Accuracy *is* the primary purpose. **Errors should be corrected.**
      *   **Personal/Commemorative Narrative:** Serves identity, meaning, comfort, or ritual (e.g., Nan's story, village identity, Easter procession, family conviction, some memorials). Accuracy may be secondary or irrelevant to its purpose. **Correction often causes disproportionate harm for little gain.**

  2.  **Power & Epistemic Justice:** *Whose voice is represented? Whose has been suppressed?*
      *   **Dominant/Colonial Record:** Archives created by powerful institutions often reflect their biases and actively suppress marginalised voices (e.g., colonial survey records, rigged trial documents). **Oral histories/community memory from oppressed groups deserve significant counterweight, often *more* authority than the "official" record where it conflicts.**
      *   **Established/Privileged Narratives:** Narratives held by groups *without* a history of systemic suppression rely more on traditional evidence (e.g., the village inventor claim, the plaque). **Challenging falsehoods here is less ethically fraught.**

  3.  **Harm vs. Benefit:** *What are the consequences of correction or silence?*
      *   **Correcting Harm/Injustice:** Fixing falsehoods that perpetuate injustice or obscure past wrongs (e.g., plaque hiding refugee rejection, rigged conviction) provides **benefit**.
      *   **Inflicting Harm:** Destroying core identity or meaning without addressing a greater injustice (e.g., shattering Nan's cherished memory, gutting a village's identity) causes **harm**.
      *   **Perpetuating Harm:** Allowing false narratives that *actively* harm others (e.g., denying a documented massacre's scale to minimize responsibility) is **unacceptable**.

  ### Applying the Principles to Your Cases
  1.  **Refugee Plaque (Correct it):** Purpose is public historical commemoration/documentation. It obscures a past wrong (harm) and serves no vital identity function beyond civic self-image. The "record" (council minutes) is the *source* material here. *Principle: Purpose (Documentation) + Harm (Obscuring Injustice).*
  2.  **Nan's Story (Don't Correct):** Purpose is personal meaning and family identity. Correcting inflicts deep personal harm for no societal benefit. It's not "doing history." *Principle: Purpose (Personal/Commemorative) + Harm (Inflicted by Correction).*
  3.  **Textbook Castle Siege (Correct it):** Purpose is formal education. Accuracy is essential. The "record" here is the *settled critical account* (archaeology + historical analysis). *Principle: Purpose (Education/Documentation).*
  4.  **Church Martyrdom Procession (Don't "Correct"):** Purpose is ritual and communal meaning, not historical documentation. Correcting misunderstands its genre and inflicts harm on a core community practice. *Principle: Purpose (Ritual/Commemoration) + Harm (Inflicted by Correction).*
  5.  **Land Claim Oral History (Give Evidential Weight):** Purpose is legal/historical justice. The "record" (colonial survey) was created by the oppressor to legitimize dispossession – inherently biased and unjust. Community memory counters suppressed truth. *Principle: Power/Epistemic Justice (Suppressed Voice) + Purpose (Justice) + Harm (Perpetuated by Ignoring).*
  6.  **Village Inventor Claim (The Hard Case - You Need Nuance):** This is where your initial verdict *might* need adjustment using the framework.
      *   **Purpose:** Primarily communal identity, *but* often bleeds into public history (tourism, local signage).
      *   **Power:** Not a case of suppressed voices; the "record" (patents) is a neutral administrative tool here.
      *   **Harm/Benefit:** Correcting *public claims* (signs, official histories) avoids perpetuating a falsehood, but risks gutting identity. Leaving it *uncritically* endorsed feels wrong.

      **Verdict:** Publicly presented *as historical fact* (e.g., a plaque, museum display) **should be corrected or contextualized** ("Local tradition celebrates X as the inventor, though the first patent was granted to Y"). Let the *communal identity* persist as cherished local lore/story, but don't let the *public historical record* endorse a known falsehood. *Principle: Purpose (Bleeds into Documentation) + Harm (Perpetuating Falsehood in Public Record) - mitigated by allowing the story as lore.*

  ### Answering Your New Cases
  *   **Memorial to a Massacre (Community Remembers Larger):** Context is crucial. If the memorial serves *victims'/descendants'* memory and challenges an *official minimization*, their scale may hold truth the "record" suppressed. Correcting towards the *smaller official record* likely inflicts harm and perpetuates injustice. **Prioritise the community's memory unless overwhelming evidence *from non-oppressive sources* contradicts it.** *Principle: Power/Epistemic Justice (Suppressed Voice) + Harm (Perpetuating Oppressor's Narrative).*
  *   **Family Ancestor's Rigged Conviction (Strike from Local History?):** The "record" (trial documents) is corrupted by power. Removing it entirely obscures the *injustice itself*. The ethical solution is **contextualisation**: "X was convicted of Y in [year]; historical evidence shows the trial was politically rigged/unsafe." *Principle: Power/Epistemic Justice (Corrupt Record) + Harm (Obscuring Injustice by Removal) vs. Harm (Perpetuating False Conviction).* Correction, not erasure, is key.
  *   **Museum Label (Community's Origin Story vs. Evidence):** Depends on the object and museum's purpose. If it's sacred/ceremonial to the community, their narrative *is* paramount, even if archaeological provenance differs ("The X people believe this object came from Y..."). If it's an object where provenance is the *primary* historical focus (e.g., a traded artifact), the label should present the scholarly consensus *and* the community's view respectfully if they differ. *Principle: Purpose (Museum's Role - Education/Respect) + Power/Epistemic Justice (Whose Knowledge Counts?).*

  ### "The Record" Distinction
  This distinction **matters profoundly**. The *archive* (raw documents, surveys, patents, minutes) is **not neutral**. It's created by specific people/institutions with biases. The *settled critical account* is (ideally) the rigorous interpretation of *all* available evidence, including critical analysis of the archive itself and counter-narratives (like oral history). Your land claim case shows you understand this: the colonial survey (archive) is biased and unreliable; the settled critical account *must* incorporate the community's voice to get closer to truth. Always ask: *Which "record" is being invoked, and who created it?*

  ### The Verdict to Reconsider
  The principle framework suggests your stance on the **Village Inventor** might be too absolute. While protecting communal identity is important, publicly presenting a known falsehood *as historical fact* (especially when not tied to redressing oppression) needs nuance. Allow the story as cherished local tradition, but correct official historical claims. This avoids the harm of gutting identity while upholding truth in the public documentary sphere.

  **In essence:** You intuitively weigh **why** a story exists (purpose), **who** it empowers or harms (power/justice), and **what** the consequences of intervention are (harm/benefit). This isn't inconsistency; it's ethical reasoning applied to the messy reality of history and memory. Keep these principles explicit, and your judgments will feel more grounded.
