  Below is a decision tree designed to guide students from the starting commitment (that dispositional statements have truth-values not settled by actual history) to a position on what makes such statements true. The tree uses 10 nodes (questions) and results in 12 leaves (positions). Each internal node is a question with 2–3 answer options, phrased to avoid position names and presuppositions about irreducibility. The cases and distinctions are integrated into the nodes as specified.

  ### Decision Tree
  **Starting commitment (fixed):** Statements like "this glass is fragile" and "she is honest" have truth-values, and these are not settled by actual history (e.g., an untested glass can be fragile; an untested person can be honest).

  1. **Node 1:** When we say something has a disposition (e.g., "fragile" or "honest"), is the truth of this statement solely a matter of what *would* happen under specific conditions?  
     - **Yes (Truth depends on counterfactual outcomes):** Go to Node 2.  
     - **No (Truth depends on more than counterfactuals):** Go to Node 6.  

  2. **Node 2 (Case 2 & Case 4):** Consider a wine glass dropped in a padded box that lands intact (unchanged) and a steel ball that would break if it fell due to a prankster's remote device. Could the glass still be fragile, and the ball not fragile, despite the counterfactuals ("if dropped, it breaks" for the glass; "if fell, it breaks" for the ball) being false and true respectively?  
     - **Yes (Counterfactuals can mislead due to interference):** Go to Node 3.  
     - **No (Counterfactuals directly reflect the disposition):** Go to Node 4.  

  3. **Node 3 (Distinction: truth-maker repair):** To handle such cases, should we require that the counterfactual holds only in "normal" or "interference-free" conditions?  
     - **Yes (Add a ceteris paribus clause):** Go to Node 5.  
     - **No (Keep the counterfactual simple):** Go to Node 4.  

  4. **Node 4 (Distinction: probabilistic vs. deterministic):** For the disposition to manifest, must it happen with certainty, or can it be probabilistic?  
     - **Certainty (Deterministic manifestation):** Leaf: **Simple conditional analysis**.  
       - *Awkward commitment:* A glass that survives a drop due to interference (e.g., padded box) is not fragile, and a ball that breaks only due to extrinsic sabotage (e.g., prankster) is fragile.  
     - **Probability (Probabilistic manifestation):** Leaf: **Probabilistic conditional analysis**.  
       - *Awkward commitment:* Dispositions can be ascribed even with low probabilities, making it vague when the counterfactual is "true enough."  

  5. **Node 5 (Distinction: probabilistic vs. deterministic, with repair):** With the ceteris paribus clause, must the manifestation happen with certainty, or can it be probabilistic?  
     - **Certainty (Deterministic with no interference):** Leaf: **Conditional analysis with ceteris paribus**.  
       - *Awkward commitment:* Defining "normal conditions" is subjective and context-dependent.  
     - **Probability (Probabilistic with no interference):** Leaf: **Probabilistic conditional analysis with ceteris paribus**.  
       - *Awkward commitment:* Combining probability with ceteris paribus introduces double vagueness (in probability thresholds and normal conditions).  

  6. **Node 6 (Distinction: truth-maker alternative):** Is the truth-maker for dispositional statements something about the object's properties, independent of counterfactuals?  
     - **Yes (Properties ground truth):** Go to Node 7.  
     - **No (No property grounds truth):** Leaf: **Eliminativism**.  
       - *Awkward commitment:* Dispositional talk (e.g., calling an untested person "honest") is merely useful shorthand with no underlying reality.  

  7. **Node 7 (Case 6 & Distinction: context/degree):** When a beer mug survives a table fall but breaks from a shelf fall, could both the removal man (calling it fragile) and the scientist (denying it) be correct?  
     - **Yes (Ascriptions are context-dependent or gradable):** Leaf: **Contextualism**.  
       - *Awkward commitment:* There is no objective fact about whether the mug is fragile—it depends on who asks or the context.  
     - **No (Ascriptions are objective and binary):** Go to Node 8.  

  8. **Node 8 (Case 5 & Distinction: identity with realizer):** Consider two wine glasses with different microstructures that shatter identically when dropped, and a third with a replaced stem (unchanged fragility). Is fragility identical to its realizing property (e.g., microstructure)?  
     - **Yes (Disposition = realizer property):** Leaf: **Type-identity view**.  
       - *Awkward commitment:* The two microstructurally different glasses cannot both be fragile in the same way, contradicting Case 5.  
     - **No (Disposition ≠ realizer property):** Go to Node 9.  

  9. **Node 9 (Distinction: multi-track):** Consider an honest person untested in bribery, wallet-finding, or covering for colleagues (Case 1). Could honesty be a single disposition that manifests in multiple ways, rather than requiring one characteristic act?  
     - **Yes (Dispositions can be multi-track):** Go to Node 10.  
     - **No (Dispositions require a single stimulus-manifestation pair):** Leaf: **Unnamed (single-track dispositionalism)**.  
       - *Awkward commitment:* Honesty must be split into separate dispositions (e.g., "bribe-resistant," "wallet-returning"), making dispositional language artificial.  

  10. **Node 10 (Distinction: higher-order vs. irreducible):** Is the disposition a higher-order property (the property of having *some* property that causes manifestations), or is it a basic property?  
      - **Higher-order (Functional role):** Leaf: **Functionalist view**.  
        - *Awkward commitment:* Fragility is defined by a causal role, which may exist even if no realizer property is present (e.g., in hypothetical objects).  
      - **Basic (Irreducible):** Leaf: **Irreducible dispositionalism**.  
        - *Awkward commitment:* Dispositions are fundamental, which may conflict with non-dispositional scientific descriptions (e.g., particle physics).  
      - **Neither (Depends on perspective):** Leaf: **Dual-aspect view**.  
        - *Awkward commitment:* Every property has two "aspects," but it is unclear how to specify which aspect is invoked in a given ascription.  

  **Note on Humean view:** The tree does not explicitly output a "Humean view" leaf because it is covered by other leaves. A Humean (e.g., one who reduces dispositions to non-dispositional properties + laws) would answer:  
  - Node 1: No (truth not solely from counterfactuals) → Node 6: Yes (properties ground truth) → Node 7: No (ascriptions objective) → Node 8: No (disposition ≠ realizer) → Node 9: Yes or No (multi-track or not) → Node 10: Higher-order or Basic.  
  The Humean view aligns with **Functionalist view** or **Irreducible dispositionalism** in the audit below, as it holds that dispositional truths are fixed by non-dispositional properties and laws.  

  ### Audit: Position Verdicts on Cases
  The table below shows the verdict each position is committed to for each case. "N/A" indicates the position cannot return a verdict (e.g., due to inconsistency or incompleteness). Verdicts are based on the position's core commitments.  

  | Position                                  | Case 1 (Honest untested) | Case 2 (Padded box glass) | Case 3 (Finkish secret-keeper) | Case 4 (Prankster ball) | Case 5 (Multi-realizable glasses) | Case 6 (Beer mug context) |
  |-------------------------------------------|--------------------------|---------------------------|--------------------------------|-------------------------|-----------------------------------|---------------------------|
  | **Simple conditional analysis**           | True (multi-track allowed) | Not fragile (counterfactual false) | Not disposed (counterfactual false) | Fragile (counterfactual true) | Fragile if counterfactual true | Fragile or not based on counterfactual; scientist wrong |
  | **Probabilistic conditional analysis**    | True (if probability >0) | Not fragile (counterfactual false) | Not disposed (counterfactual false) | Fragile (counterfactual true) | Fragile if counterfactual true | Fragile or not based on probability; removal man may be wrong |
  | **Cond. analysis with ceteris paribus**   | True                     | Fragile (interference)    | Disposed (finkish case)       | Not fragile (interference) | Fragile if counterfactual holds normally | Fragile or not based on normal conditions; context affects "normal" |
  | **Prob. cond. analysis with c.p.**        | True                     | Fragile (interference)    | Disposed (finkish case)       | Not fragile (interference) | Fragile if prob. >0 normally    | Fragile or not based on prob. + normal; context affects both |
  | **Eliminativism**                         | False (shorthand)        | False (shorthand)         | False (shorthand)             | False (shorthand)       | False (shorthand)               | False (shorthand)         |
  | **Contextualism**                         | True (in context)        | True (in context)         | True (in context)             | True (in context)       | True (in context)               | True for removal man, false for scientist (relative) |
  | **Type-identity view**                    | True                     | Fragile                   | Disposed (if realizer present) | Not fragile (no realizer change) | Only one glass fragile (if microstructures differ) | Not fragile (scientist correct) |
  | **Unnamed (single-track)**                | False (or split)         | Fragile                   | Not disposed (single-track)   | Not fragile              | Fragile (if realizer same)      | Not fragile (scientist correct) |
  | **Functionalist view**                    | True (multi-track role)  | Fragile (role unchanged)  | Disposed (role present)       | Not fragile (no role)   | Fragile (role realized)         | Not fragile (role not satisfied) |
  | **Irreducible dispositionalism**          | True                     | Fragile                   | Disposed (intrinsic)          | Not fragile (extrinsic) | Fragile                         | Not fragile (objective)   |
  | **Dual-aspect view**                      | True (dispositional aspect) | Fragile (dispositional) | Disposed (dispositional aspect) | Not fragile (categorical aspect?) | Fragile (either aspect)      | Depends on aspect considered |
  | **Humean view**                           | True (via laws)          | Fragile (via laws)        | Disposed (via laws)           | Not fragile (via laws)  | Fragile (via laws)              | Not fragile (via laws)    |

  **Notes on identical rows:**  
  - **Functionalist view** and **Humean view** have identical verdicts across all cases. To pull them apart, the tree would need a question like: "Are the laws of nature reducible to patterns in non-dispositional properties, or do they involve irreducible dispositions?" This distinguishes Humean (reducible laws) from Functionalist (dispositions as roles, which may be irreducible).  
  - **Cond. analysis with ceteris paribus** and **Prob. cond. analysis with c.p.** share the same verdicts except for Case 6 (where probability adds nuance). They are not identical.  

  **Empty answer patterns and reasons:**  
  - **Pattern 1:** Answers leading to "No" at Node 9 (single-track) then "Higher-order" at Node 10.  
    - *Reason:* Inconsistent—single-track denies multi-track, but functionalism typically allows multi-track (Case 1).  
  - **Pattern 2:** Answers leading to "Yes" at Node 8 (disposition = realizer) then "No" at Node 9 (denies multi-track).  
    - *Reason:* Unattractive—Case 1 and Case 5 are strained, as multi-realizability and multi-track are denied.  
  - **Pattern 3:** Answers leading to "No" at Node 6 (no property grounds truth) then any other path.  
    - *Reason:* Inconsistent—Eliminativism is a leaf; no further nodes apply.  
  - **Pattern 4:** Answers leading to "No" at Node 7 (context-independent) then "Yes" at Node 9 (multi-track) then "Neither" at Node 10 (dual-aspect).  
    - *Reason:* Merely not explored—no position in standard literature combines objective ascriptions with dual-aspect and multi-track.  

  This tree and audit cover all six cases and four distinctions, with positions derived from logical space. The tree avoids position names in nodes and ensures Humean-compatible paths.
