  Key requirements stand out: They want a 10-minute desk tool with no philosophy background needed. Must separate coordination norms from identity markers, clarify obligations vs prudence, and handle edge cases like returning locals. Honest gaps are preferred over false completeness. The four test cases are carefully chosen to stress different pressure points.

  The core challenge is compressing philosophical frameworks (Lewis' conventions, Shiffrin's guest ethics, Waldron's coordination norms) into actionable steps. Need to preserve these key distinctions:
  - Coordination problems (where universal compliance benefits all) vs symbolic conventions
  - Moral obligations to individuals vs discretionary courtesies
  - The special position of economically vulnerable recipients

  The procedure must flag where judgment calls happen - especially in those gray areas between custom and coercion. For the test cases:
  1. Tipping is tricky because it's both coordination norm (wage system) and moral transfer to vulnerable person. The "house rules" analogy fails when the "house" exploits workers.
  2. Jaywalking tests the enforcement boundary - when does widespread noncompliance void a convention?
  3. Queueing exposes how physical context changes perception (loose crowd vs line)
  4. Bribes confront the limits of cultural relativism

  Biggest holes will be: divergent local opinions, hidden costs to visitors, and historical power imbalances baked into customs. The "returning local" issue suggests adding a "cultural proximity" assessment - how recent/dominant was their exposure to local norms? 

  For implementation, I'm considering a flowchart-style Q&A that branches at key distinctions, with clear off-ramps to human judgment. Will explicitly note where steps involve value judgments disguised as procedure. The "sufficient answer" thresholds will be practical: e.g., "if >70% comply spontaneously" for convention existence. 

  The bribe case will be the hardest - it needs to surface when a custom constitutes participation in harm while avoiding colonialist "civilizing mission" overtones. The tipping case resolution should show why both sides in that dinner argument were partially wrong.
answer: |-
  Here’s a 10-minute desk procedure based on philosophical distinctions (Lewis, Shiffrin, Waldron), designed to separate **coordination conventions**, **courtesy norms**, and **moral obligations**. It prioritizes clarity over completeness, flags judgment points, and identifies where values must override rules.

  ---

  ### **Procedure: "Guest Conduct Assessment"**  
  **Ask these questions in order. Stop at first conclusive answer.**

  1. **Is this a *coordination convention*?**  
     - *Ask:* "Would universal disregard of this practice cause tangible dysfunction (e.g., traffic chaos, system collapse)?"  
     - *Sufficient "yes":* Hard evidence of systemic harm (e.g., data on tipped wage reliance).  
     - *Sufficient "no":* Confirmed local non-enforcement or trivial impact (e.g., unenforced jaywalking law).  
     - *Outcome:* If **yes**, compliance is **prudentially obligatory** (to avoid harm). If **no**, go to Q2.  
     - *Judgment flag:* Assessing "tangible dysfunction" requires local data.  

  2. **Is this *primarily a courtesy*?**  
     - *Ask:* "Does violating this mainly offend individuals (not systems), and is the offense easily avoidable?"  
     - *Sufficient "yes":* Direct harm to dignity/perceived respect (e.g., queue-cutting).  
     - *Sufficient "no":* No clear victim (e.g., walking on unused grass).  
     - *Outcome:* If **yes**, compliance is **owed as respect** to those present. If **no**, go to Q3.  
     - *Judgment flag:* "Easily avoidable" depends on visitor’s capacity.  

  3. **Does this practice *transfer material harm*?**  
     - *Ask:* "Does non-compliance directly worsen someone’s welfare against their will (e.g., wage loss, exclusion)?"  
     - *Sufficient "yes":** Unavoidable and non-consensual harm (e.g., server losing rent money).  
     - *Sufficient "no":** Harm is indirect, consensual, or symbolic (e.g., minor social annoyance).  
     - *Outcome:* If **yes**, compliance is **morally obligatory**. If **no**, compliance is **optional courtesy**.  
     - *Judgment flag:* Assessing "non-consensual harm" requires understanding local power dynamics.  

  4. **Special case: Returning locals vs. first-time visitors**  
     - *Ask:* "Is the person re-entering a community they were socially embedded in?"  
     - *Outcome:* **Returning locals** are held to higher familiarity standards (less "guest" leeway), but only if the norm is **current and dominant**.  

  ---

  ### **Test Cases**  
  **Case 1: Tipping (server relies on tips for subsistence)**  
  - Q1: **Yes.** Tipping is a coordination convention (wage system collapses if universally ignored → systemic harm).  
  - *Outcome:* **Prudentially obligatory** to tip standard rate.  
  - *Why against both?* Your friend ignored systemic harm; you overstated it as "house rules" (it’s deeper: harm transfer).  

  **Case 2: Jaywalking at empty intersection (common, unenforced)**  
  - Q1: **No.** No dysfunction if all do it (already the norm); law is inert.  
  - Q2: **No.** No direct offense to individuals (empty intersection).  
  - Q3: **No.** No material harm.  
  - *Outcome:* **Optional** (no obligation).  

  **Case 3: Loose queue (holding place reads as cutting)**  
  - Q1: **No.** No systemic collapse.  
  - Q2: **Yes.** Violation offends those behind (perceived disrespect).  
  - *Outcome:* **Owed as respect** to join queue loosely.  

  **Case 4: Customary payment to clerk (visitor sees it as a bribe)**  
  - Q1: **Maybe.** If payments grease bureaucracy, it’s a coordination convention.  
  - Q3: **Critical question:** Does the payment *harm* others (e.g., enables exclusion)? If yes, **morally wrong**. If not, it’s optional.  
  - *Judgment flag:* Requires local insight. If harmful, override "when in Rome" (see **Limits** below).  

  ---

  ### **Where the Procedure Fails (Requires Your Judgment)**  
  1. **Locals disagree on conventions** (e.g., urban vs. rural tipping):  
     - Default to the **most vulnerable stakeholder’s perspective** (e.g., underpaid server).  
  2. **Visitor exemption applies** (e.g., disability, religion):  
     - Override if compliance imposes **undue burden** (flag in Q2/Q3).  
  3. **Hidden costs to visitor** (e.g., financial, psychological):  
     - Weigh costs against harm in Q3. If high cost + low harm, exempt.  
  4. **Resented conventions** (e.g., sexist seating):  
     - If the practice causes material/psychological harm (Q3), **reject compliance** regardless of locality.  

  ---

  ### **Key Distinctions Kept vs. Dropped**  
  - **Kept:**  
    - Coordination vs. courtesy (Lewis).  
    - Harm transfer as moral bright line (Shiffrin).  
    - Returning locals' heightened obligation (Waldron on social membership).  
  - **Dropped:**  
    - Distinguishing "legal" vs. "customary" (focus on impact, not origin).  
    - Gradations of rudeness (bundled into "courtesy" bucket).  

  **Output:** A clear obligation tier (prudential → respectful → moral), with "optional" where no stakes exist. **Stop and escalate** where judgment flags appear (noted in italics). For values conflicts (e.g., bribes), prioritize harm prevention over cultural deference. This won’t resolve all disputes—but it will force concrete reasoning.
