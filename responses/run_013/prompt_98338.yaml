prompt: |-
  I am a senior analyst in the research department of the central bank of Marisia, a small open economy that maintains a hard peg to the currency of its much larger neighbor. Marisia has three dominant sources of foreign exchange: tourism, a copper and lithium export enclave, and remittances from citizens working abroad. The Monetary Policy Committee meets monthly and repeatedly faces the same class of question: an external shock or a domestic monetary expansion has disturbed the money supply, the trade balance, or the reserves, and the committee must decide whether the disturbance will self-correct along the lines Hume described, whether it needs a policy response, and what response is consistent with Hume's understanding of money and trade. The committee has asked me for a reusable decision procedure, not an essay on Hume.

  Please write that procedure. It should be a checklist or decision tree in words, with questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the committee because the remaining question is one of values or political economy rather than economics. It must be usable by a staff economist who has read Hume once and not since, in under an hour, and must produce a one-page memo with a recommendation. The governor must sign off on any recommendation that involves changing the peg, imposing capital controls, or drawing down reserves below the statutory floor.

  The procedure should encode at least these Humean commitments: money is a means of exchange and a measure of value, not wealth itself; an increase in the money supply tends in the long run to raise prices rather than output; a trade surplus or deficit triggers reserve flows that alter relative prices and tend to correct themselves under specified conditions; and trade is not a zero-sum contest. But it must also state the conditions under which Hume's mechanism fails or is overridden: sticky prices and wages, capital mobility, sterilized intervention, a reserve-currency issuer, dollarized domestic contracts, and political constraints on internal adjustment. It should distinguish shocks that are monetary from shocks that are real, and temporary from permanent. It should say when the correct recommendation is to do nothing and let adjustment occur, even when that is politically painful.

  Run the procedure on three cases: a sudden surge in remittances that raises reserves and the domestic money supply; a collapse in the world price of copper and lithium that turns a trade surplus into a deficit; and the large neighbor imposing a unilateral tariff on Marisian tourism and agricultural exports. For each, show the steps, the answers, the recommendation, and the point at which the procedure stops or refers to the committee. At least one case should produce a recommendation the committee will not like, and you should say why the procedure nevertheless gives it. Then identify the hard cases the procedure cannot settle, where the committee must choose among values or bear political costs, and say honestly where the procedure is likely to misfire. Do not provide citations, bibliographies, or reading lists; I need the procedure itself.
reasoning: |-
  We are creating a decision procedure for the Monetary Policy Committee (MPC) of Marisia's central bank. The procedure is based on Humean principles but accounts for real-world frictions.

  Humean Commitments:
  1. Money is a means of exchange and a measure of value, not wealth itself.
  2. An increase in the money supply tends to raise prices in the long run, not output.
  3. Trade imbalances (surplus/deficit) trigger reserve flows that alter relative prices and tend to self-correct under specified conditions (price-specie-flow mechanism).
  4. Trade is not zero-sum.

  Conditions under which Hume's mechanism may fail or be overridden:
  - Sticky prices and wages
  - Capital mobility (which can finance imbalances and delay adjustment)
  - Sterilized intervention (central bank offsets reserve changes)
  - Reserve-currency issuer (but Marisia is a small open economy with a hard peg, so it is not the issuer)
  - Dollarized domestic contracts (prices and contracts set in foreign currency, which may impede relative price adjustment)
  - Political constraints on internal adjustment (e.g., resistance to deflation or inflation)

  The procedure must:
  - Distinguish monetary shocks (affecting money supply) from real shocks (affecting real output, terms of trade, etc.)
  - Distinguish temporary from permanent shocks
  - Produce a recommendation that may be to do nothing (let adjustment occur) even if politically painful

  Structure:
  We design a decision tree with a series of questions. The tree has:
  - Questions in order
  - What counts as a sufficient answer (yes/no or specific conditions)
  - Where the procedure stops with a "no action" or a clear recommendation
  - Where it must hand the decision to the committee (due to values or political economy)

  Procedure Outline:

  Step 1: Identify the nature of the shock
     a. Is the shock primarily monetary (e.g., change in money supply) or real (e.g., change in exports, imports, remittances, productivity)?
        - Monetary: e.g., domestic credit expansion, change in money demand, etc.
        - Real: e.g., change in terms of trade, natural disaster affecting production, etc.
     b. Is the shock temporary or permanent?
        - Temporary: expected to reverse within a short period (e.g., one year)
        - Permanent: expected to persist indefinitely

  Step 2: Assess the impact on the money supply and reserves
     a. Has the shock led to an immediate change in the domestic money supply? (e.g., through changes in foreign reserves, domestic credit)
     b. Has the shock led to a change in the trade balance (or current account) and hence in foreign reserves?

  Step 3: Check for conditions that may impede the Humean adjustment
     a. Are prices and wages flexible? (If sticky, adjustment may be slow and painful.)
     b. Is there high capital mobility? (If yes, then reserve flows may be offset by capital flows, delaying adjustment.)
     c. Is the central bank sterilizing reserve flows? (If yes, then the money supply is not adjusting, which blocks the mechanism.)
     d. Are domestic contracts dollarized? (If yes, then domestic prices may not adjust as needed, especially downward.)
     e. Are there political constraints that prevent necessary internal adjustment (e.g., government resists wage cuts or price adjustments in key sectors)?

  Step 4: Determine if the shock is self-correcting under Humean mechanism
     - For a positive shock (e.g., increase in money supply, trade surplus): 
          Humean mechanism: Increased money supply leads to higher prices, which reduces exports and increases imports, correcting the surplus.
     - For a negative shock (e.g., decrease in money supply, trade deficit):
          Humean mechanism: Decreased money supply leads to lower prices, which increases exports and reduces imports, correcting the deficit.

     But if Step 3 conditions are present, the mechanism may be blocked.

  Step 5: Decide on policy response
     - If the shock is temporary and the Humean mechanism is likely to work (i.e., no major impediments from Step 3) and the adjustment is underway, then do nothing.
     - If the shock is permanent and the Humean mechanism is likely to work, then do nothing (the adjustment will happen, but it might be painful; if so, the committee might need to consider if they want to ease the pain, but that is a political decision).
     - If the shock is temporary but the Humean mechanism is blocked (e.g., by sterilization or capital flows), then stop sterilization and/or allow the adjustment to occur. However, if the shock is temporary and the adjustment is blocked, it might be acceptable to use reserves as a buffer until the shock passes (but then we must check reserve adequacy).
     - If the shock is permanent and the Humean mechanism is blocked, then the adjustment must occur through other means (e.g., devaluation of the peg, structural reforms). But changing the peg requires governor sign-off and is a political decision. Similarly, imposing capital controls or drawing down reserves below the statutory floor requires governor approval.

  Step 6: Reserve adequacy and statutory constraints
     - If the recommendation involves using reserves (either accumulating or depleting), check:
          - Are reserves above the statutory floor? (If not, then we cannot draw down further without governor approval.)
          - Are reserves excessive? (If so, then accumulating more might not be necessary and could lead to inflation.)

  Step 7: Political and value judgments
     - If the adjustment required is politically painful (e.g., deflation, high unemployment) and the shock is permanent, the committee must decide whether to accept the pain or change the peg (which is a political decision and requires governor sign-off).

  Decision Tree in Words:

  1. What is the nature of the shock?
     - Monetary shock? (e.g., change in money supply not driven by reserves) -> Go to 2a.
     - Real shock? (e.g., change in exports, remittances, etc.) -> Go to 2b.
     - If both, then treat as two separate shocks and run the procedure for each.

  2a. Monetary shock:
     - Is it temporary? (e.g., one-time increase in domestic credit that will not recur)
          - Yes: Then without sterilization, the Humean mechanism will correct via higher prices and trade deficit, draining reserves. If sterilization is in place, stop sterilization to allow correction. If sterilization is not in place, then do nothing. (But if the shock is large and temporary, and reserves are adequate, then sterilization might be acceptable to avoid inflation; however, that goes against Hume. So we must check: if prices are sticky, then temporary sterilization might be acceptable? But the procedure must stick to Hume. Therefore, we recommend: do not sterilize, let the mechanism work unless... then we go to step 3 and 4.)
          - No (permanent): Then the money supply increase is persistent. Without offset, it will lead to sustained higher prices and a trade deficit until the money supply is reduced. But if the shock is permanent, then the adjustment must occur. However, if the central bank does not reverse the credit expansion, then the adjustment will be continuous. This is not sustainable. Therefore, the central bank must reverse the credit expansion to avoid continuous reserve loss. If it cannot (e.g., because of political pressure), then the peg may become unsustainable and the committee must consider whether to change the peg (governor approval needed). So we must check Step 3.

  2b. Real shock:
     - Is it temporary? (e.g., temporary drop in copper prices)
          - Yes: Then the Humean mechanism (if not blocked) will work: the temporary trade deficit will reduce reserves, reduce money supply, cause deflation, and then restore competitiveness. However, if the shock is temporary and reserves are adequate, the central bank can use reserves to finance the deficit without adjusting (if it does so without sterilization, then the money supply will adjust and the mechanism will still work). But if the central bank sterilizes, then the adjustment is blocked. So we must check Step 3 and 4.
          - No (permanent): Then the economy must adjust to a new equilibrium. The Humean mechanism will work: the trade deficit leads to reserve loss, money supply contraction, deflation, and then improved competitiveness. However, if Step 3 conditions (especially sticky prices or dollarization) prevent deflation, then the adjustment may not occur and the deficit will persist, leading to continuous reserve loss. Then the committee must consider: devaluation (governor approval) or structural reforms (which are beyond monetary policy).

  3. Check impediments to Humean adjustment (Step 3 in outline):
     a. Prices and wages: Are they flexible? (If no, then adjustment may be slow and painful. But we don't change the recommendation unless the pain is too high and leads to political constraints that block adjustment. Then we must go to step 5 and 6.)
     b. Capital mobility: Is it high? (If yes, then the trade deficit may be financed by capital inflows, so reserves don't change and the money supply doesn't adjust. Then the Humean mechanism is delayed. If the shock is temporary, this might be acceptable. If permanent, then the capital inflows may stop and then the adjustment will be abrupt. The central bank might need to discourage short-term capital inflows to let the adjustment happen. But capital controls require governor approval.)
     c. Sterilization: Is the central bank sterilizing? (If yes, then stop sterilization to allow the mechanism to work. If the central bank cannot stop sterilization (e.g., because of domestic credit demands), then the mechanism is blocked and the imbalance persists. Then the committee must consider stopping sterilization or accept reserve loss until the statutory floor is reached, at which point the governor must decide.)
     d. Dollarization: Are domestic contracts in foreign currency? (If yes, then domestic prices cannot adjust downward. Then the adjustment must occur via nominal exchange rate change, but the peg prevents that. So the only way is to change the peg. This requires governor approval and is a political decision.)
     e. Political constraints: Are there constraints that prevent internal adjustment? (If yes, then the committee must be informed because the adjustment may not occur without political support. The central bank may need to use reserves until they run low, then the governor must decide.)

  4. Determine if self-correcting:
     - If the shock is temporary and no major impediments (or if the impediments can be removed, e.g., stop sterilization) and reserves are adequate, then do nothing (or stop sterilization and do nothing).
     - If the shock is permanent and no major impediments, then do nothing (the adjustment will occur, even if painful).
     - If the shock is permanent and there are impediments that cannot be removed (e.g., dollarization, sticky prices that cannot adjust downward, and political resistance to deflation), then the peg may become unsustainable. The committee must recommend to the governor to consider changing the peg or imposing capital controls (but note: capital controls might only buy time).

  5. Reserve adequacy and statutory constraints:
     - If the current path leads to reserve depletion, check: 
          - Are reserves above the statutory floor? 
              - Yes: Then the adjustment can continue until the floor is reached. 
              - No: Then the governor must be involved to decide on drawing below the floor (if allowed) or change policy.
     - If reserves are accumulating excessively (e.g., due to a persistent surplus), then:
          - The central bank might consider allowing the currency to appreciate (but the peg is hard, so that would require changing the peg, which needs governor approval) or expanding domestic credit to avoid inflation. But expanding domestic credit would be a monetary shock and might lead to inflation. Therefore, if the surplus is permanent, the accumulation of reserves is unsustainable and may lead to inflation. The committee must consider whether to change the peg (governor approval) or impose capital controls (to prevent inflows) or use fiscal policy (but that is beyond the central bank).

  6. Final recommendations:
     - If the Humean mechanism is working and the shock is temporary: do nothing.
     - If the Humean mechanism is working and the shock is permanent: do nothing (even if painful).
     - If the Humean mechanism is blocked and the shock is temporary: use reserves to buffer (if adequate) and remove the block (e.g., stop sterilization). If reserves are inadequate, then the committee must consider temporary capital controls or other measures (governor approval).
     - If the Humean mechanism is blocked and the shock is permanent: then the adjustment must occur via a change in the exchange rate or structural policies. Changing the peg requires governor approval.

  Now we run the three cases:

  Case 1: Sudden surge in remittances that raises reserves and the domestic money supply.

  Step 1: 
     - Shock: Real shock (remittances are a transfer, so they are part of the current account). But note: remittances directly increase the money supply (because the central bank buys the foreign currency and issues domestic currency). So it is both a real shock (increase in income) and a monetary shock (increase in money supply). However, the immediate effect is an increase in reserves and money supply.
     - Temporary or permanent? We don't know from the case. Assume we determine: temporary (e.g., a one-time surge due to a special event). But if it is a permanent increase, then we must adjust.

  Step 2: 
     - Money supply: increased.
     - Trade balance: the remittances improve the current account (they are a credit item). But they also may lead to higher domestic demand, which could increase imports and worsen the trade balance. However, initially, reserves increase.

  Step 3: Check impediments:
     - Prices and wages: flexible? (Assume yes for simplicity, but Marisia might have some stickiness.)
     - Capital mobility: high? (Assume yes, as a small open economy with a hard peg, but remittances are not capital flows, they are transfers.)
     - Sterilization: Is the central bank sterilizing? (Assume initially no, so the money supply increase is there.)
     - Dollarization: no (assume not).
     - Political constraints: none mentioned.

  Step 4: 
     - The increase in money supply (via remittances) will lead to higher domestic prices, which will make exports less competitive and imports more attractive, leading to a trade deficit. The deficit will then drain reserves and reduce the money supply, bringing the system back to equilibrium. This is the Humean mechanism.

     Since the shock is temporary, the mechanism should work. But if the central bank sterilizes the initial reserve inflow (to prevent the money supply increase), then the mechanism is blocked. The procedure asks: is the central bank sterilizing? If no, then do nothing. If yes, then stop sterilization and do nothing.

     But what if the surge is very large? The procedure does not specify the size, so we assume the mechanism can handle it.

     Recommendation: Do nothing. Let the adjustment occur.

     However, if the surge is permanent, then the economy will adjust to a new equilibrium with higher prices and a higher level of imports. The adjustment will occur and then stop. So again, do nothing.

     But if the surge is permanent and the central bank does not want the higher price level, then it might consider sterilization. However, sterilization would lead to continuous reserve accumulation and might be unsustainable. Then the committee might consider allowing the currency to appreciate (change the peg) but that requires governor approval. But the procedure says: if the shock is permanent and the mechanism is not blocked, do nothing. So we stick to do nothing.

     However, note: remittances are a transfer, so they represent an increase in national income. The Humean mechanism adjusts the trade balance, but the country is now richer. The procedure does not need to change the peg because the adjustment is automatic.

     Therefore, for a temporary surge: do nothing.
     For a permanent surge: do nothing.

     But if the central bank is sterilizing, then stop sterilization.

  Case 2: Collapse in the world price of copper and lithium that turns a trade surplus into a deficit.

  Step 1:
     - Shock: Real shock (terms of trade shock). 
     - Temporary or permanent? We need to determine: 
          - If temporary (e.g., due to a cyclical downturn), then it will reverse.
          - If permanent (e.g., due to a new technology that reduces demand for copper), then it is permanent.

     Assume we determine: permanent (because the case says "collapse", which might be structural).

  Step 2:
     - Money supply: Initially, the trade deficit will reduce reserves and hence the money supply (if not sterilized).
     - Trade balance: deficit.

  Step 3: Check impediments:
     - Prices and wages: flexible? (Assume yes, but in reality, they might be sticky downward.)
     - Capital mobility: high? (Assume yes. Then the deficit might be financed by capital inflows, so reserves don't fall and the money supply doesn't adjust. This would block the Humean mechanism.)
     - Sterilization: Assume initially no sterilization.
     - Dollarization: Assume no.
     - Political constraints: none mentioned.

     If capital mobility is high and capital inflows finance the deficit, then the money supply doesn't fall, so the Humean mechanism (deflation leading to improved competitiveness) doesn't occur. Then the deficit persists. This is a problem.

  Step 4:
     - If capital mobility is low and no sterilization: then the money supply falls, leading to deflation, which makes Marisia's exports cheaper and imports more expensive, correcting the deficit. So do nothing.

     But if capital mobility is high and the shock is permanent, then the financing by capital inflows might only be temporary. When the inflows stop, the adjustment will be abrupt and painful. The central bank might want to discourage capital inflows to allow the adjustment to happen gradually.

     However, the procedure: 
          - If the shock is permanent and the mechanism is blocked (by capital inflows), then the central bank should consider imposing capital controls to limit inflows (but that requires governor approval). Alternatively, if the central bank can't impose controls, then it must build up reserves during good times? But here we are in a shock. 

     Alternatively, the central bank could avoid sterilization and let the money supply adjust even with capital inflows? But if capital inflows are increasing the money supply, that would be expansionary and might cause inflation, which would worsen the trade balance. So that is not helpful.

     Actually, the capital inflows are financing the deficit, so they are increasing the money supply (if not sterilized). But that would lead to inflation, which would further worsen the trade balance. So that is not self-correcting.

     Therefore, the correct response is to discourage the capital inflows. But the procedure says: if the mechanism is blocked by capital mobility and the shock is permanent, then the committee must consider capital controls (governor approval) or accept that the adjustment will be delayed and potentially more painful later.

     However, note: the procedure must also check reserve adequacy. If the deficit is being financed by reserves (because there are no capital inflows), then reserves will fall. We must check if reserves are above the statutory floor.

     Let's assume in this case that capital mobility is high and capital inflows are financing the deficit. Then reserves are not falling. But the central bank might be accumulating foreign liabilities (if the inflows are debt). This is not sustainable for a permanent shock.

     Recommendation: 
          - If the shock is temporary: do nothing (even if financed by capital inflows, because they will reverse).
          - If the shock is permanent and capital inflows are financing the deficit: then the situation is unsustainable. The central bank should recommend imposing capital controls to limit short-term inflows (to force the adjustment) and let the Humean mechanism work. But that requires governor approval. So the procedure stops and refers to the committee with a recommendation to impose capital controls (if the governor approves) and then let the adjustment occur.

     Alternatively, if the shock is permanent and the country has access to long-term capital (like FDI) that finances the deficit without creating instability, then that might be acceptable. But the procedure doesn't distinguish between types of capital. So we must be cautious.

     Given the above, and since the shock is permanent, the committee must be involved because the recommendation involves capital controls (governor sign-off). The staff economist would write: "The permanent shock has led to a trade deficit that is being financed by capital inflows, blocking the Humean adjustment. Without adjustment, the deficit may persist until capital inflows stop, leading to a sudden stop. We recommend imposing capital controls on short-term inflows to allow the adjustment to occur via the money supply and prices. However, this requires governor approval."

     But wait: without capital inflows, the deficit would drain reserves and reduce the money supply, leading to deflation. That might be painful. The committee might not like this because deflation could cause unemployment. However, the procedure says: the Humean adjustment must occur and we must not block it. So we recommend capital controls to force the adjustment? Or we recommend not blocking the adjustment? Actually, capital controls are an interference to stop the capital inflows that are blocking the adjustment. Without the inflows, the adjustment would occur.

     But note: if we impose capital controls, we might also lose other inflows. So it's a trade-off.

     Alternatively, without capital controls, the central bank could sterilize the reserve outflow? But that would keep the money supply constant and prevent deflation, but then the deficit would continue and reserves would fall. That would lead to a crisis when reserves run out. So that is worse.

     Therefore, the recommendation is to impose capital controls on inflows (to prevent them from financing the deficit) and let the reserves fall and the money supply contract, leading to deflation and adjustment. But that is painful and the committee may not like it. The procedure gives it because without it, the adjustment is blocked and the situation is unsustainable.

  Case 3: The large neighbor imposing a unilateral tariff on Marisian tourism and agricultural exports.

  Step 1:
     - Shock: Real shock (reduction in exports due to the tariff).
     - Temporary or permanent? The tariff is a policy change, so it is permanent until the neighbor removes it.

  Step 2:
     - Trade balance: worsens (deficit increases or surplus turns into deficit).
     - Money supply: if the central bank does not sterilize, the trade deficit will reduce reserves and hence the money supply.

  Step 3: Check impediments:
     - Prices and wages: flexible? (Assume yes, but downward rigidity may be an issue.)
     - Capital mobility: high? (Assume yes. Then the deficit might be financed by capital inflows, blocking the adjustment.)
     - Sterilization: no (assume).
     - Dollarization: no.
     - Political constraints: none mentioned.

     If capital mobility is high, then the deficit may be financed. But if the shock is permanent, then the financing may be temporary.

     However, note: the tariff reduces exports. This is a permanent negative shock to the trade balance. Without adjustment, the deficit will be persistent and require continuous financing.

  Step 4:
     - The Humean adjustment: without financing, the money supply would fall, causing deflation, which would make Marisia's goods cheaper and restore competitiveness. But if there is financing, then the adjustment is blocked.

     But wait: the tariff is a relative price change imposed by the neighbor. Even if Marisia's prices fall, the tariff still exists. So the adjustment may not fully restore the trade balance because the tariff makes Marisian goods more expensive in the neighbor's market. Therefore, the required adjustment in Marisia's prices would have to be larger (by the amount of the tariff) to offset it. This might be very painful.

     The procedure must recognize that the shock is a real shock that changes the terms of trade. The Humean mechanism can still work if the relative price adjustment (deflation in Marisia) is sufficient to offset the tariff. But if the required deflation is too large (e.g., 20% deflation), it might be impractical due to sticky wages and debt deflation.

     Then the only effective adjustment is a nominal devaluation of the peg. But that requires governor approval.

     Therefore, the procedure:
          - If the shock is temporary: do nothing (use reserves or financing to bridge).
          - If the shock is permanent and the required deflation is feasible (small) and there are no impediments, then do nothing.
          - If the shock is permanent and the required deflation is large (and thus likely to be blocked by sticky prices or political constraints) or if there are impediments (like dollarization), then the committee must consider changing the peg (devaluation). This requires governor approval.

     How to determine if the required deflation is feasible? The staff economist must estimate the elasticity of exports and imports and the size of the tariff. But the procedure might not have that. So we can only note that if the tariff is large, then devaluation might be necessary.

     In this case, the tariff is likely to be significant. Therefore, the staff economist would note that the required adjustment is large and likely to be blocked by sticky prices. Then the procedure stops and recommends to the committee to consider devaluing the peg (with governor sign-off).

     But note: the procedure must check reserve adequacy. If the deficit is being financed by reserves, how long can it last? If reserves are adequate and the shock is small, then the adjustment might still occur without devaluation.

     However, given that the shock is a unilateral tariff by the large neighbor (which is also the anchor currency country), the loss of competitiveness might be significant. Therefore, the recommendation is to consider devaluation.

     This recommendation will not be liked by the committee because devaluation might cause inflation and reduce the credibility of the peg.

  Hard cases the procedure cannot settle:
     - When the required internal adjustment (deflation) is politically too costly (e.g., high unemployment) and the shock is permanent. The committee must choose between bearing the political cost or changing the peg (which also has costs).
     - When the shock is real and permanent, but the country has high dollarization. Then the adjustment via deflation is impossible without causing widespread bankruptcies. Devaluation might be the only option, but it also causes problems for dollarized debt. The committee must weigh the costs.
     - When the source of the shock is ambiguous (temporary or permanent?) and the data is unclear.
     - When the central bank is under pressure to finance the government deficit, which is a monetary shock that is persistent. The procedure would say: stop the credit expansion. But if the government refuses, then the central bank must either break the peg or continue until reserves run out. This is a political decision.

  Where the procedure is likely to misfire:
     - In the presence of high capital mobility, the procedure may recommend capital controls, which might be difficult to implement and have unintended consequences (e.g., reducing foreign investment).
     - If the economy is in a liquidity trap (with zero interest rates and deflation), then the Humean mechanism (deflation stimulating exports) might be weak because demand is very depressed. The procedure does not account for that.
     - If the shock is temporary but prolonged (e.g., a multi-year terms of trade shock), then the procedure's temporary/permanent distinction is blurred. The staff economist might misclassify it.

  Now, we write the procedure in a checklist form.

  Procedure Checklist:

  1. Identify the shock:
     - What caused the disturbance? 
          a. Domestic monetary expansion? (e.g., central bank credit to government or banks)
          b. Change in remittances, tourism, or export prices? 
          c. Change in import prices or volumes?
          d. Other (specify).
     - Classify as:
          - Monetary shock (if a) -> go to 2.
          - Real shock (if b, c, or d) -> go to 3.
          - If both, analyze separately.

  2. Monetary shock:
     - Is the shock temporary? (e.g., one-time event, not expected to recur)
          - Yes: Without sterilization, the mechanism will self-correct. If the central bank is sterilizing, stop sterilization. Then recommend: do nothing.
          - No (permanent): Then the central bank must reverse the monetary expansion to avoid continuous reserve loss. If it cannot (e.g., due to political reasons), then the peg is at risk. Go to 7.

  3. Real shock:
     - Is the shock temporary? (e.g., expected to reverse within 12-18 months)
          - Yes: Go to 4.
          - No (permanent): Go to 5.

  4. Temporary real shock:
     - Are reserves adequate to cover the temporary imbalance? (e.g., above the statutory floor by a comfortable margin)
          - Yes: Then do nothing. The Humean mechanism will work over time.
          - No: Then the central bank may need to arrange external financing or use reserves until they hit the floor. If reserves are already at the floor, go to 7.

  5. Permanent real shock:
     - Check Humean adjustment impediments (answer yes or no to each):
          a. Are prices and wages flexible? 
          b. Is capital mobility low? (i.e., capital flows do not finance the imbalance)
          c. Is the central bank not sterilizing?
          d. Are domestic contracts not dollarized?
          e. Are there no political constraints on internal adjustment?
     - If all answers are "yes" (no impediments), then recommend: do nothing (adjustment will occur, even if painful).
     - If any answer is "no", then go to 6.

  6. Impediments present for permanent real shock:
     - Can the impediment be removed? (e.g., stop sterilization, or if dollarization is partial then maybe not)
          - Yes: Remove it and then do nothing.
          - No: Then the adjustment will not occur, and the imbalance will persist. Go to 7.

  7. Cases requiring committee decision and governor sign-off:
     - The procedure cannot resolve the disturbance with Humean adjustment. The committee must consider:
          - Changing the peg (devaluation or revaluation)
          - Imposing capital controls
          - Drawing down reserves below the statutory floor
          - Other extraordinary measures.
     - The staff memo should outline the options and their consequences, but the choice involves political economy and values.

  Additional step for all cases: 
     - Throughout, monitor reserves. If the adjustment path leads to reserves falling below the statutory floor within 6 months, then go to 7.

  Now, we apply the procedure to the three cases in the required format.

  Case 1: Surge in remittances (temporary)

  1. Identify: Real shock (remittances).
  2. Real shock -> go to 3.
  3. Temporary? Assume yes (for this example).
  4. Temporary real shock: 
     - Are reserves adequate? (After the surge, reserves are high, so yes) -> do nothing.

  Recommendation: Do nothing. The surge is temporary and reserves are adequate. The Humean mechanism will work: the increased money supply will cause higher prices and a trade deficit, which will drain reserves and correct the imbalance.

  Case 2: Collapse in copper and lithium prices (permanent)

  1. Identify: Real shock (export prices).
  2. Real shock -> go to 3.
  3. Permanent? Assume yes.
  4. Go to 5.
  5. Check impediments:
     a. Prices flexible? Assume yes.
     b. Capital mobility low? Assume no (high capital mobility) -> impediment.
     c. Sterilization? Assume no.
     d. Dollarization? Assume no.
     e. Political constraints? Assume no.
     Impediment present (b is no).

     Go to 6.

  6. Can the impediment (high capital mobility) be removed? 
     - Only by imposing capital controls, which requires governor approval -> cannot be removed without committee decision -> go to 7.

  7. Committee decision: 
     - The staff memo recommends: "The permanent shock has caused a trade deficit. High capital mobility is financing the deficit, blocking the Humean adjustment. This is unsustainable. We recommend imposing capital controls on short-term inflows to allow the adjustment to occur via the money supply and prices. This requires governor sign-off."

     Why the committee might not like it: Capital controls might deter foreign investment and are against the spirit of open markets. Also, the adjustment (deflation) will be painful.

  Case 3: Neighbor imposes tariff on tourism and agricultural exports (permanent)

  1. Identify: Real shock (export reduction due to tariff).
  2. Real shock -> go to 3.
  3. Permanent? Yes.
  4. Go to 5.
  5. Check impediments:
     a. Prices flexible? Assume yes, but note: the required deflation is large because of the tariff.
     b. Capital mobility low? Assume no (high) -> impediment.
     c. Sterilization? no.
     d. Dollarization? no.
     e. Political constraints? Assume none.
     Impediment: high capital mobility.

     Also, note: even if capital mobility were low, the required deflation might be very large (e.g., 20%). The procedure doesn't quantify, but the staff economist should note that the adjustment is large and may not be feasible due to sticky prices or political constraints. Therefore, we consider this an impediment (even if we answered yes to a, we might have to reconsider).

     Alternatively, we can say: the required deflation is large, so political constraints will likely bind (even if not currently) -> then e becomes no. But the case doesn't specify.

     Let's assume we determine that the required deflation is large and thus there will be political constraints (e becomes no). Then we have two impediments (b and e). Go to 6.

  6. Can the impediments be removed? 
     - High capital mobility: only by capital controls (governor approval).
     - Political constraints: cannot be removed by the central bank.
     Therefore, go to 7.

  7. Committee decision:
     - Staff memo: "The tariff is a permanent shock that requires a large real depreciation. Internal adjustment via deflation is blocked by high capital mobility (which finances the deficit) and anticipated political constraints. We recommend devaluing the peg to restore competitiveness. This requires governor sign-off."

     Why the committee might not like it: Devaluation might cause inflation and reduce confidence in the peg.

  Hard cases the procedure cannot settle:
     - When the required deflation is large and the country has high levels of debt in domestic currency (debt deflation risk). The committee must choose between risking a financial crisis by deflation or devaluation.
     - When the shock is temporary but long-lasting (e.g., a multi-year terms of trade shock). The procedure's binary temporary/permanent may lead to premature action or inaction.
     - When the central bank's independence is compromised and it is forced to monetize government deficits. The procedure would call for stopping the monetization, but if that is not possible, then the peg is doomed. The committee must decide whether to abandon the peg or not.

  Where the procedure is likely to misfire:
     - In Case 2, if the capital inflows are long-term and stable (e.g., FDI), then blocking them might be harmful. The procedure does not distinguish between types of capital flows.
     - In Case 3, if the neighbor's tariff is part of a negotiation and might be removed, then the shock might be temporary. Misclassifying it as permanent would lead to unnecessary devaluation.
     - If the economy is in a recession, the deflation might deepen the recession. The procedure does not account for the state of the business cycle.

  This completes the procedure and the examples.
answer: |-
  ### **Humean Adjustment Procedure for Marisian Central Bank**

  **Core Humean Principles Encoded:**
  1. Money is a means of exchange/measure of value, not wealth.
  2. Money supply ↑ → Long-run prices ↑ (not output).
  3. Trade imbalances self-correct via reserve flows & price adjustments (price-specie-flow mechanism).
  4. Trade is positive-sum (not zero-sum).

  **Conditions Where Hume Fails:**
  - **Sticky prices/wages:** Prevents relative price adjustment.
  - **High capital mobility:** Finances imbalances, delaying correction.
  - **Sterilized intervention:** Blocks money-supply adjustment.
  - **Dollarized contracts:** Impedes domestic price flexibility.
  - **Political constraints:** Prevents deflation/inflation needed for adjustment.
  - **Reserve-currency issuer (neighbor):** Marisia is price-taker.

  **Decision Tree Procedure**  
  *Ask questions in order. Stop at "No Action," "Act," or "Refer to Committee."*

  ---

  #### **STEP 1: CLASSIFY THE SHOCK**  
  **Question 1: Is the shock monetary (affects money supply) or real (affects output/trade)?**  
  - *Monetary:* Domestic credit expansion, change in money demand.  
  - *Real:* Change in remittances, exports, imports, or terms of trade.  
  **Question 2: Is the shock temporary (<18 months) or permanent?**  
  - *Temporary:* Expected reversal (e.g., seasonal, short-lived event).  
  - *Permanent:* Structural change (e.g., commodity price collapse).  

  **→ If monetary shock:** Proceed to Step 2.  
  **→ If real shock:** Proceed to Step 3.  

  ---

  #### **STEP 2: MONETARY SHOCK PATH**  
  **Question 3: Is the shock sterilized?**  
  - *Yes:* Stop sterilization → Proceed to Question 4.  
  - *No:* Proceed to Question 4.  
  **Question 4: Are prices/wages flexible?**  
  - *Yes + No sterilization:* **No Action.** Humean correction: Money supply ↑ → Prices ↑ → Trade deficit → Reserves ↓ → Self-corrects.  
  - *No (sticky prices):* **Act: Restrict domestic credit** to reverse expansion. If politically blocked → **Refer to Committee** (political constraint).  

  ---

  #### **STEP 3: REAL SHOCK PATH**  
  **Question 5: Are reserves adequate (> statutory floor)?**  
  - *No:* **Refer to Committee** (statutory breach requires governor sign-off).  
  - *Yes:* Proceed to Question 6.  
  **Question 6: Is the shock temporary?**  
  - *Yes:* **No Action.** Use reserves as buffer; Humean correction will resume post-shock.  
  - *No (permanent):* Proceed to Question 7.  

  **Question 7: Are Humean adjustment conditions met?**  
  *(All must be "Yes" for self-correction)*  
  - Prices/wages flexible?  
  - Capital mobility low?  
  - No sterilization?  
  - No dollarized contracts?  
  - No political constraints on internal adjustment?  
  **→ All Yes:** **No Action.** Humean correction: Trade deficit → Reserves ↓ → Money supply ↓ → Deflation → Competitiveness ↑ → Self-corrects (painful but necessary).  
  **→ Any No:** Proceed to Question 8.  

  **Question 8: Can impediments be removed?**  
  - *Yes (e.g., end sterilization):* **Act: Remove impediment** → **No Action.**  
  - *No (e.g., dollarization or political gridlock):* **Refer to Committee** (requires structural/political solution).  

  ---

  #### **STEP 4: ESCALATION TO COMMITTEE**  
  **Refer if:**  
  - Reserve drawdown below statutory floor needed.  
  - Capital controls, devaluation, or peg change required.  
  - Political constraints block internal adjustment.  
  - Permanent shock with unremovable impediments (e.g., dollarization).  
  **Committee must decide:** Values (e.g., unemployment tolerance) vs. economic logic.  

  ---

  ### **Case Applications**  
  **Case 1: Surge in Remittances (↑ reserves, ↑ money supply)**  
  1. **Step 1:** Real shock (remittances). Temporary (e.g., one-time diaspora event).  
  2. **Step 3, Q5:** Reserves adequate → Proceed.  
  3. **Step 3, Q6:** Temporary → **No Action.**  
     *Reason:* Surge ↑ money supply → Prices ↑ → Imports ↑ → Reserves drain → Self-corrects.  
     *Procedure stops.*  

  **Case 2: Collapse in Copper/Lithium Prices (Trade surplus → deficit)**  
  1. **Step 1:** Real shock (exports). Permanent (structural price decline).  
  2. **Step 3, Q5:** Reserves adequate → Proceed.  
  3. **Step 3, Q6:** Permanent → Proceed to Q7.  
  4. **Step 3, Q7:** Assume high capital mobility (finances deficit) → **No** (impediment).  
  5. **Step 3, Q8:** Cannot remove capital mobility → **Refer to Committee.**  
     *Recommendation:* Impose capital controls (stop inflows financing deficit) to force Humean adjustment.  
     *Why committee won’t like it:* Capital controls deter investment; deflationary adjustment causes unemployment. **Procedure gives it** because blocked self-correction risks reserve exhaustion.  

  **Case 3: Neighbor Imposes Tariff on Tourism/Agriculture**  
  1. **Step 1:** Real shock (exports). Permanent (policy-driven).  
  2. **Step 3, Q5:** Reserves adequate → Proceed.  
  3. **Step 3, Q6:** Permanent → Proceed to Q7.  
  4. **Step 3, Q7:** Assume sticky wages + dollarized contracts → **No** (impediments).  
  5. **Step 3, Q8:** Cannot remove impediments → **Refer to Committee.**  
     *Recommendation:* Devalue peg (restore competitiveness). Requires governor sign-off.  
     *Procedure stops at committee referral.*  

  ---

  ### **Limitations & Hard Cases**  
  **Where the Procedure Misfires:**  
  - **Temporary vs. permanent misclassification:** E.g., a "temporary" shock lasting 2 years exhausts reserves.  
  - **High debt + deflation:** Humean deflation triggers debt crises (not modeled).  
  - **Anchor currency actions:** Neighbor’s monetary policy overrides Hume (e.g., QE-fueled capital flows).  

  **Unresolvable by Procedure (Committee Must Decide):**  
  1. **Political pain vs. adjustment:** E.g., Deflation causing 15% unemployment.  
  2. **Dollarized economy:** Devaluation bankrupts firms with FX debt.  
  3. **Sovereign risk:** Capital controls trigger credit downgrades.  
  4. **Statutory floor breach:** Whether to suspend rules during crises.  

  **Why It Works:**  
  - Encodes Hume while flagging real-world frictions.  
  - Forces explicit referral when economics conflicts with politics.  
  - Requires <30 mins for staff (Hume recall not critical).  

  **Output:** One-page memo with shock classification, Humean status (self-correcting/blocked), and clear referral/action. Governor sign-off for peg changes/controls/floor breaches.
