prompt: |-
  Next month I'm giving a work-in-progress talk at the joint seminar that our computational neuroscience group runs with the theory people down the hall. The room is about thirty people, and I know it well enough to be nervous about it: mostly lab scientists who fit encoding and decoding models to spike trains and fMRI data and who use the word computation the way other people use the word movement; three or four who work on attractor dynamics and low-dimensional state spaces and are openly allergic to representational talk; and one philosopher of science who comes because her office is next door and who will ask the only question in the room that is actually a philosophical one. This is a group that is impatient with philosophy that doesn't change what anybody does on Monday, and several of them have told me over coffee that my topic is a fight about a word. My thesis is that the claim that the brain is a computer is either trivially true or, in the sense the labs actually intend, unsupported. The argument I plan to run is this: any physical system at all can be described as implementing any computation you like, given a sufficiently patient mapping from physical states onto computational states, so the bare claim needs a further condition before it says anything; I propose that a system genuinely computes only when there is a mechanism whose function it is to carry information, and when the mapping from physical states to computational states is fixed by that mechanism's function rather than by the convenience of whoever is doing the describing; on that criterion the evidence does not settle whether brains compute, and a good deal of what gets called computational explanation is really a claim about how well our models predict, which I am happy to grant. I should be clear that I am not out to take anyone's models away — I build them myself — I just want the word to be doing some work.

  Draft my Q&A prep sheet for the question period. Give me the eight or so objections I will actually get from this room, not the ones I would get at a philosophy of mind conference, ordered by how much damage they do to my position, each phrased the way the person who holds it would phrase it — I want to be able to hear who is talking before they finish the sentence — each with a two-minute reply and an honest note on where the reply is soft. I expect the dynamics people to say that if I am right then representation is the real culprit and my information-carrying function quietly lets it back in through the side door, and I expect the modellers to say that they never meant anything metaphysical by the word and that I am picking a fight with a figure of speech; tell me which of those has teeth and which I can afford to be gracious about. Tell me what to concede up front so that the room stops suspecting I am a closet vitalist, which single reply has to land or the whole talk is over, and the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is prepping for a talk in a computational neuroscience seminar and needs help with Q&A prep. Let me break down their situation. 

  First, the audience is a mix of lab scientists focused on modeling spike trains/fMRI, theorists working on attractor dynamics, and one philosopher. The key tension is that most see "computation" as a practical tool, while the user argues it's either trivial or unsupported without functional criteria. 

  Hmm... their core argument has two parts: 
  1) Any physical system can be mapped to any computation arbitrarily (triviality)
  2) Genuine computation requires mechanisms with information-carrying functions

  The user anticipates two main objections:
  - Theorists: "Your info-carrying function smuggles representation back in"
  - Modelers: "We never meant 'computation' metaphysically"

  I need to prioritize objections by damage potential. The representation objection from dynamics people is lethal because it attacks the coherence of their alternative. The "figure of speech" complaint is less damaging since conceding it aligns with their goal (making the word do work).

  Other likely objections:
  - Failure to engage with actual neuroscience practice ("what about this textbook example?")
  - Accusations of attacking useful models (need to preempt this upfront)
  - Demands for testable alternatives (their weakest spot)
  - "If not computation, then what?" (the question they dread)

  For prep sheet structure:
  - Must start with concessions to disarm vitalism suspicions
  - Save the representation objection for #1 (highest stakes)
  - Put "figure of speech" at #2 with gracious concession
  - Include the dreaded "alternatives" question last
  - The make-or-break reply is defending the functional criterion against triviality

  Biggest vulnerability: Their framework doesn't yet provide new tools, just critiques existing language. Should advise them to emphasize this is groundwork for better questions, not a finished theory.
answer: |-
  Here's your Q&A prep sheet, calibrated for the room's landmines. Prioritized by damage potential (high to low), with authentic phrasing cues, tight replies, and vulnerability notes. I've flagged which objections bite and which don't.

  **Concession to Make Upfront**  
  *Before Q&A even starts:* "To be super clear: I’m *not* arguing against modeling practices. If your GLM predicts spike trains 20% better, that’s real science. I use these tools daily. My target is *only* the unexamined leap from 'models predict well' to 'therefore the brain *is* a computer' in a deep ontological sense. If that leap isn’t doing work for you, we probably agree."

  **The Make-or-Break Reply**  
  *If nothing else lands, hammer this:* "Triviality isn’t a minor quibble—it voids the claim of explanatory power. Saying 'the brain is a computer' becomes like saying 'the brain is physical.' True, but empty. My functional criterion rescues it from emptiness by tying 'computation' to *mechanisms evolution built for information-handling*, not our post-hoc mappings."

  **The Question You Hope Nobody Asks**  
  *"Okay, smartass—if we ditch 'computation,' what’s your positive alternative framework that explains neural dynamics better than our existing models?"*  
  *(Why it hurts: Forces you to defend underdeveloped territory while the room judges you by practical utility.)*

  ---

  ### Objection 1 (Highest Damage: Attractor Dynamics Theorist)  
  *Phrasing cue:* "This is just representation in a cheap disguise—you’ve baked teleology into ‘function’ and now it’s *all* semantics..."  
  **Reply (2 min):** "Fair! But ‘function’ here isn’t semantic—it’s causal-role teleology. A photoreceptor’s function is to transduce light, full stop. No ‘meaning’ needed. I’m asking: is there a physical *component* whose causal role is information-carriage (like a wire in a computer), or are we *imposing* that role? Your attractor models? Great—but they show dynamics, not computation *unless* you identify a component *designed* to maintain state X."  
  **Soft Spot:** Still leans on "design," which naturalizes poorly. The theorist will smell blood.

  ### Objection 2 (High Damage: Senior Lab Modeller)  
  *Phrasing cue:* "Nobody here cares about metaphysics—‘computation’ is shorthand for ‘we built a model that generalizes.’ Why attack a useful figure of speech?"  
  **Reply (2 min):** "If that’s all it is, we agree! But I’ve heard three talks this year claiming ‘the hippocampus computes cognitive maps’ as if it’s a discovery, not a metaphor. That *matters*: if it’s just a figure of speech, stop insisting deep learning ‘explains’ vision. Say instead: ‘backprop approximates ventral stream dynamics.’ That’s still great science!"  
  **Teeth?** **No real teeth**—graciously concede. Their position is your ally against overreach.

  ### Objection 3 (Medium Damage: fMRI Decoder)  
  *Phrasing cue:* "So our whole field is just curve-fitting? What’s the difference between your ‘genuine computation’ and my decoder predicting behavior from PFC activity?"  
  **Reply (2 min):** "Not curve-fitting—*model-building*. The difference is ontology: your decoder computes; the PFC *might not*. Your model’s success suggests information is in the signal, but it doesn’t prove PFC has components *dedicated* to carrying that info. It could be an epiphenomenon of dynamics. That doesn’t make your work less valid—it just clarifies what’s claimed."  
  **Soft Spot:** Feels like hair-splitting to empiricists. They’ll think you’re undermining their relevance.

  ### Objection 4 (Medium Damage: Theory-Leaning Postdoc)  
  *Phrasing cue:* "If any system can implement any computation, why can’t I map the brain to a Turing machine? Your ‘function’ just seems arbitrary..."  
  **Reply (2 min):** "You *can* map it—but that mapping is *your* choice, not the brain’s. My point: for computation to be *in* the system, the mapping must be fixed by its causal structure. Example: A heart *can* be mapped to a clock (thump = tick), but its function is pumping blood, not timekeeping. Brains lack a clear ‘clock circuit’ or ‘register’—so why assume the mapping isn’t ours?"  
  **Soft Spot:** Requires accepting "fixed by causal structure" as non-arbitrary. Room may shrug.

  ### Objection 5 (Low Damage: Philosophy of Science Neighbor)  
  *Phrasing cue:* "Isn’t your ‘information-carrying function’ just Dretske’s teleosemantics stripped of content? Why not go full instrumentalist?"  
  **Reply (2 min):** "Close! But I’m avoiding semantics entirely. Dretske needs ‘indication’ (covariation with content). I need only causal role: e.g., a neuron’s spike *can* carry info, but whether it *does* in a given system depends on if evolution/learning shaped it *for* that role—like a USB port versus a coincidentally shaped rock."  
  **Soft Spot:** Philosopher will note you’re smuggling normativity via "shaped for." Lab people won’t care.

  ### Objection 6 (Low Damage: Junior Computationalist)  
  *Phrasing cue:* "But textbooks say neurons ‘compute’ log likelihoods! Are you saying Churchland & Abbott are wrong?"  
  **Reply (2 min):** "They’re brilliant—but ‘neuron as Bayesian integrator’ is a *model*, not proven mechanism. We model planets as point masses; it doesn’t mean planets *are* points. Similarly, if a neuron’s voltage dynamics *happen* to match Bayes’ rule, is that computation or just a useful analogy? I’m asking for evidence of dedicated implementation."  
  **Soft Spot:** Sounds like you’re dismissing decades of work. Stress *model ≠ reality* distinction hard.

  ### Objection 7 (Minimal Damage: Grumpy PI)  
  *Phrasing cue:* "This feels like philosophy for its own sake. Does your distinction change how I fit my GLMs on Monday?"  
  **Reply (2 min):** "Probably not! If your model improves predictions, use it. But if you claim it reveals ‘how vision computes,’ it might. Example: If ‘computation’ requires functional components, maybe we should stop searching for ‘grandmother cell encoders’ and study how information *emerges* from network dynamics instead. It shifts targets, not tools."  
  **Soft Spot:** "Might" isn’t compelling. They’ll file this under "harmless but useless."

  ### Objection 8 (Minimal Damage: Movement-Action Lab Member)  
  *Phrasing cue:* "We *define* computation as ‘what my model does.’ Why gatekeep the word?"  
  **Reply (2 min):** "I’m gatekeeping to *protect* your work! If everything is computation, nothing is. Calling a falling rock a ‘gravity calculator’ adds nothing. But if ‘computation’ means ‘mechanisms with information-handling functions,’ then finding them is a discovery. That elevates *your* models from tools to explanations."  
  **Soft Spot:** They’ll think you’re policing language. Smile and move on.

  ---

  **Strategic Summary**  
  - **Kill the representation objection first**—it’s the most coherent attack on your core.  
  - **Concede graciously to the "figure of speech" crowd**—they’re your stealth allies.  
  - **Defend triviality fiercely**—it’s your strongest card.  
  - **Don’t claim to replace models**—stress you’re refining claims, not methods.  
  - **If asked for alternatives**, pivot to: "It forces better questions—e.g., ‘Where *are* the evolved information mechanisms?’ rather than ‘What does this region compute?’"  

  **Body language tip:** Lean into the "practitioner frustrated by loose talk" vibe, not "philosopher lecturing scientists." They’ll tolerate you if you smell like one of them. Good luck.
