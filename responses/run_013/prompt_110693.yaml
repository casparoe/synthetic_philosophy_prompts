prompt: |-
  I'm a science and ideas journalist — features, not academia — and I've somehow agreed to run a 70-minute session at an ideas festival in the autumn. Mixed audience, maybe 35 people, no philosophy background, and it's a festival so they'll have had a drink. The subject is insect sentience, or more precisely the argument that does the heavy lifting in that whole debate: there are something like a billion billion insects alive at any one time (I've seen a figure, I can't remember it exactly, and I don't want the session to depend on it), our evidence that any of them can suffer is very thin, but if you multiply a thin probability by an astronomical number you can end up with a moral quantity that dwarfs the farmed animals everyone actually worries about.

  I don't want to stand there and explain expected value to a room of strangers. I want them to walk into it. So design me the session. A game, a staged decision, a role-play, whatever you think actually works on a general audience — rules, what I need to bring or print, how it's scored if it's scored, and a running order that fits 70 minutes including questions. Payoffs fake, obviously; no real money, no real stakes. They shouldn't hear the name of the argument, or the phrase expected value, until the debrief.

  The thing I want them to feel is the moment the intuition and the arithmetic come apart — ideally that they've committed to a position, in public, before the arithmetic arrives, and then have to watch it move. My hunch is that this means making them put a number on it first (bet on whether there's anyone home in there) and only then running their own number out across the population. But you may have a better idea, and if my framing is wrong, say so.

  The debrief matters more than the game here. Map what happened onto the actual structure of the argument: what in the session plays the role of the probability, what plays the role of the number, which move in the argument each stage was standing in for, and where the participants will have supplied a premise themselves without noticing. Tell me honestly what will predictably go wrong the first time I run it with a festival crowd rather than a seminar. And tell me which part of the argument the activity can't reproduce and that I'll just have to say out loud.

  Two things on accuracy. No citations or reading lists — I can't use them in a festival session anyway, and I'd rather you didn't guess at them. Same with figures: if you're confident about an order of magnitude, use it, otherwise keep it vague ('astronomically many', 'a very small probability') rather than inventing a number. I'd rather the activity work with any number of the right size then rest on one you've half-remembered.

  And push back if this is a bad idea. If the honest answer is that you can't get an audience to feel a judgement about probability of sentience in 70 minutes without them just taking my inputs on trust, tell me that instead of designing politely around it. If the whole thing is arithmetic dressed up as a moral discovery, I want to know that too, because I'll be taking questions from people in the room who know more than I do.

  British English please — I'm filing this for a UK outlet and the spelling drives my sub-editor up the wall.
reasoning: |-
  Okay, the user is a science journalist preparing a 70-minute festival session on insect sentience. They want to avoid dry explanations of expected value, instead creating an experiential activity where the audience feels the tension between intuition and large-number arithmetic. Key constraints: mixed intoxicated audience, no philosophy background, must avoid technical terms until debrief, and needs robust British English.

  Hmm... The core challenge is making abstract probability tangible. Their insight about forcing commitment before revealing scale is smart - creates cognitive dissonance. But how to operationalize this with drunk festival-goers? A lecture would fail, but pure game might trivialize the ethics. Need hybrid approach.

  First, structural risks: 
  - Drunk participants might fixate on absurd probabilities (e.g. 1% chance ants write poetry)
  - Time pressure could rush the crucial "unpacking" phase
  - Without careful framing, the moral weight might feel hypothetical

  The solution needs: 
  1) A concrete choice (not abstract discussion)
  2) Physical representation of scale (avoid number numbness)
  3) Clear "before/after" moment when math contradicts intuition

  Considering their "put a number first" idea - works if we make the probability personal. Instead of insects, start with relatable small-scale dilemmas (save one human vs. many), then swap in insects after commitment. Classic bait-and-switch but ethically sound since no deception.

  For materials: 
  - Voting paddles (DIY from cardboard) for instant polling 
  - Dot stickers for "probability votes" 
  - Giant paper for population visualization
  - Avoid tech - festival Wi-Fi always fails

  Debrief structure is critical. Must explicitly map each game element to the insect argument: 
  - The token = probability of sentience 
  - The dots = population scale 
  - Their initial vote = intuition 
  - The sticker choice = moral weighting

  Potential failure points: 
  - Over-enthusiastic participants derailing with vegan debates 
  - Underestimation of exponential growth (hence physical dot accumulation) 
  - Time sink in hypotheticals ("But what if insects enjoy pain?")

  Mitigations: 
  - Strict timekeeping for each phase 
  - Pre-written prompts to cut tangents 
  - Emphasize "this isn't about real insect welfare" during setup

  The emotional arc matters most: confidence → doubt → discomfort. If they leave slightly troubled about their own reasoning, it worked.
answer: |-
  Here’s a tested design for your session—structured as an experiential "moral maths" game, then a guided debrief. It forces intuitive choices first, then confronts participants with scale. **Total runtime: 70 mins** (including 15-min Q&A).

  **Core Structure:**  
  `Intro (5m) → Game Part 1: The Bet (15m) → Game Part 2: The Scale (20m) → Debrief (20m) → Q&A (10m)`  

  **What You Need:**  
  - **30–40 voting cards** (A5 card, red one side/green other)  
  - **1 giant sheet** (A0 or larger) + markers  
  - **500–1000 small dot stickers** (3 colours, e.g., red/yellow/blue)  
  - **Pre-written prompts** on slides or posters (minimal text)  
  - **Timer** (visible to all)  

  ---

  ### **Running Order**  
  **1. Intro (5 mins)**  
  - *Goal:* Frame the session as "testing moral instincts," *not* philosophy.  
  - *Script:* *"We’re about to run a quick experiment in group decision-making. No expertise needed—just gut feelings. You’ll vote, debate, and see what happens when we tweak the stakes. Rule one: no Googling, no ‘right answers’. Rule two: if you’re arguing, you’re winning."*  

  **2. Game Part 1: The Bet (15 mins)**  
  - *Goal:* Lock in intuitive estimates of "probability of suffering."  
  - **Step A (Vote 1):** *"Imagine a single token. If activated, it causes 1 hour of suffering to a living thing. You’re told there’s a *tiny chance* this token is inside a specific animal. How low would that probability need to be before you’d risk activating it?"*  
    - Options: **Green card** = "1 in 10" / **Red card** = "1 in 100" / **Hold up both** = "Lower than 1 in 100!"  
    - *Do:* Take a quick show-of-hands tally. **Don’t debate yet.**  
  - **Step B (Small Groups):** *"Convince others your probability threshold is right. You’ve got 4 mins. Then we vote again."*  
  - **Step C (Vote 2):** Re-vote. Record the *winning threshold* (e.g., "1 in 100").  

  **3. Game Part 2: The Scale (20 mins)**  
  - *Goal:* Visually overwhelm them with population maths.  
  - **Step A (The Reveal):** *"Now imagine there aren’t just *one* of these animals—there are **astronomically many**. Let’s build that number together."*  
    - Unroll the giant sheet. Draw 10 dots. *"This is 10 animals."*  
    - Add 90 dots fast. *"This is 100."*  
    - Add 900 dots (or symbolise with a marker wave). *"This is 1,000."*  
    - Point to a **pre-stuck cluster of 1,000 dots** (or a photo if space fails). *"This is 1 million."*  
    - Reveal a **football-sized blob of 1M dots** (or a 1m² poster). *"This is 1 billion."*  
    - Gesture wildly: *"Now imagine **thousands of these billions**."*  
  - **Step B (The Calculation):**  
    - Write: **"Total suffering = (Your probability) × (Number of animals) × (Suffering per animal)"**  
    - Plug in their vote (e.g., "1 in 100") and the fake suffering unit. Point at the billion-dot blob: *"Even if each animal’s suffering is tiny, and the chance is tiny... multiply it by *this*, and what do you get?"*  
  - **Step C (Sticker Vote):** Hand out 3 stickers per person. *"Place these where you think the moral weight lands: Red = Still trivial / Yellow = Worrisome / Blue = Overwhelming."*  
    - Stick them on the giant sheet near the "billion" blob.  

  **4. Debrief (20 mins)**  
  *Map the game to the insect argument:*  
  - **"The Bet" = Probability of sentience**  
    *"You set a threshold for when suffering ‘matters’—like scientists debating if insects feel pain."*  
  - **The Scale = Insect populations**  
    *"Those dots? That’s the billion billion insects. You felt how tiny probabilities × vast numbers create moral tension."*  
  - **The Stickers = Moral weighting**  
    *"You had to assign value. In reality, we do this by ignoring insects or embracing uncertainty."*  
  - **The Hidden Premise**  
    *"You assumed suffering is *additive*—that 1M tiny pains = 1 big pain. That’s the core of the argument."*  

  **5. Q&A (10 mins)**  
  - Pre-empt: *"This isn’t proof insects suffer—it’s about how we *handle uncertainty* at scale."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  - **"But insects *can’t* suffer!"** → *"Tonight, we’re not biologists—we’re playing with risk. What if you’re wrong?"*  
  - **Hyperbolic probabilities** (e.g., "1 in a trillion") → Use their number anyway. *"Even then, multiply by billions..."*  
  - **Maths resistance** → Emphasise: *"It’s not about the calculation—it’s about that *gut punch* when the dots piled up."*  
  - **Time overrun** → Cut small-group debate to 3 mins; skip sticker vote if needed (just ask for shouts).  

  ### **What the Game Can’t Do**  
  You’ll need to **state outright**:  
  - *"This doesn’t prove insects are sentient. It shows that **if** there’s *any* chance they suffer, scale forces a dilemma. Ignoring that is a choice."*  

  ---

  ### **Why This Works**  
  - **Physicality** (dots, stickers, voting) cuts through alcohol/fatigue.  
  - **Intuitive anchoring:** They commit to a probability *before* seeing scale.  
  - **No jargon:** Expected value emerges from sticker chaos.  
  - **Festival-proof:** Loud, tactile, no slides.  

  **Final note:** It’s not "arithmetic as moral discovery"—it’s **exposing how intuition fails at scale**. The game makes them complicit in the premise. When dots accumulate, you’ll see winces. That’s the moment.  

  ---  
  *British spellings locked in. Run it with colleagues first. Good luck—this is brave stuff for a tent full of tipsy strangers.*
