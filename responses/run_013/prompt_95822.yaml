answer: |-
  ### Joint Statement on Promissory Obligation: Framework for Adversarial Collaboration  
  *Drafted for the Departmental Workshop on Reconciling Practice and Principle Conceptions*  

  This document represents a provisional consensus on the core points of agreement and the precise loci of disagreement between defenders of the *Practice Conception* (PC: obligations arise from constitutive social conventions) and the *Principle Conception* (PrC: obligations arise from moral principles independent of convention). We aim to clarify the dispute, isolate genuine cruxes, and identify empirical or conceptual tests that could advance the debate.  

  ---

  ### I. Agreed Claims  
  Both sides endorse the following:  

  1.  **Nature of Promising:** A promise is a voluntary assurance given by one party (the promisor) to another (the promisee), understood by both as intended to create an obligation for the promisor to perform a specific future act (or omission).  
  2.  **Explananda Requiring Account:** Any successful theory must explain:  
      (a) Why making such an assurance *changes what is owed* by the promisor (i.e., creates a new, directed obligation where none existed before).  
      (b) Why this obligation is *owed specifically to the promisee* (i.e., is "directed" or "bipolar"), granting the promisee a distinctive normative standing (e.g., the power to waive the obligation).  
  3.  **Dispute Boundaries:** The core disagreement is *not* about:  
      (a) Whether actual promises typically occur within social practices (both agree they usually do).  
      (b) Whether conventions can facilitate or strengthen promissory obligations (both agree they can).  
      (c) Whether moral principles (like fidelity) are relevant to promising (both agree they are).  
      (d) Whether promissory obligations *feel* binding independently of convention (both acknowledge this phenomenological point).  
  4.  **Rejected Arguments:** Both sides regard the following arguments as failures:  
      (a) **Infinite Regress/Circularity:** Claiming PC founders because the convention must itself be constituted by promises (PC denies this; conventions are patterns of behaviour/attitudes).  
      (b) **Reductio of ‘No Practice’ Worlds:** Claiming PrC is falsified because obligations couldn’t exist *at all* without *any* social conventions (PrC argues only that promissory obligations specifically don’t require a *promising* convention).  
      (c) **Phenomenology as Proof:** Using the mere feeling of obligation as decisive evidence for either view (both accept it needs interpretation).  

  ---

  ### II. Disagreements Table  
  Each row presents a neutral crux, each side’s self-described position, a shared case/argument relevant to adjudicating it, and each side’s prediction about the case outcome.  

  | Crux | Practice Conception (PC) Position | Principle Conception (PrC) Position | Shared Case/Argument | PC Prediction | PrC Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(i) Can a promissory obligation exist without *any* social practice (convention, institution) of promising?**<br><br>*Neutral: Whether a voluntary assurance, absent any background social framework for promising, can generate a genuine obligation of the distinctively promissory kind.* | "No. A promissory obligation is constitutively defined by the rules of a social practice. Without such a practice, an assurance might generate a different moral obligation (e.g., not to mislead), but not the specific obligation characterised by the promissory powers (like release)." | "Yes. A clear, voluntary assurance given with the intention to undertake an obligation, and received as such, generates a promissory obligation via the moral principle of fidelity (or similar), regardless of the presence of a social practice. The distinct features of promising (e.g., release) flow from the nature of assurance itself." | **Case 1: Improvised Assurance.** Two individuals (A from Culture X with binding vows sealed by blood, B from Culture Y with binding oaths sworn on relics) are stranded together. Needing cooperation, A says to B: "I give you my solemn word I will share my food tomorrow." B accepts this novel formulation as binding. Neither has used or heard this specific form before. | *PC Predicts:* No promissory obligation arises. Any sense of obligation stems from a general duty not to deceive or expectations of reciprocity, lacking the distinctive features of promising (e.g., B cannot unilaterally release A). | *PrC Predicts:* A genuine promissory obligation arises. The voluntary, explicit assurance creates the obligation. B possesses the power of release characteristic of a promisee. |
  | **(ii) Can the Practice View explain why the obligation is *owed specifically to the promisee* (rather than to the community)?**<br><br>*Neutral: Whether the conventional rules of a practice can ground the directedness of the obligation (promisor→promisee) and the promisee’s correlative normative powers (e.g., release).* | "Yes. The constitutive rules of the promising practice assign the normative standing (rights, powers) specifically to the promisee. The practice *defines* the roles of promisor and promisee, including the direction of the obligation. The promisee’s power of release is a rule of the practice." | "No. Conventional rules can designate *who counts as* the promisee, but they cannot *create* the moral reason why the obligation is owed *to that person*. The directedness and the promisee’s special standing (especially release) stem from the moral significance of *assuring that particular person* and the wrong done *to them* by breaking faith." | **Case 3: Group-Release Practice.** In Community Z, the binding form of undertaking ("I pledge to Φ for you, [Name]") creates an obligation owed to the named individual. However, the constitutive rules state that *only* the village council can release the promisor. The named individual (promisee) cannot release them unilaterally. | *PC Predicts:* The obligation is correctly described as owed to the named individual (as per the rule designating them the promisee), even though the power of release is held by the council (another rule). The practice defines the structure. | *PrC Predicts:* This is not a genuine promissory obligation *to the promisee*. The inability of the promisee to release shows the core moral relation (directed obligation + promisee power) is absent. It’s an obligation *to the community* or *regarding* the promisee. |
  | **(iii) Is the promisee’s unilateral power of release (and the promisor’s lack of unilateral cancellation) best explained by the conventions of the practice or by a moral principle?**<br><br>*Neutral: The source of the normative asymmetry between promisee (can release) and promisor (cannot unilaterally cancel).* | "Conventionally. The power of release is a constitutive rule of the promising practice. Its existence and scope are determined by the social rules. The promisor’s lack of cancellation power is likewise a rule of the practice." | "Morally. The power of release flows directly from the moral logic of assurance: the promisee, as the recipient of the assurance and the party to whom performance is owed, has the authority to waive the claim. The promisor lacks unilateral cancellation because assurance creates a commitment that is not solely within their control to dissolve without the promisee’s agreement." | **Case 4: The Asymmetry.** Why can a promisee unilaterally release the promisor from the obligation ("You don’t have to do X after all"), but the promisor cannot unilaterally cancel the obligation ("I take back my promise") without the promisee’s consent? | *PC Predicts:* The asymmetry is a fundamental, arbitrary rule of the practice (like checkmate in chess). Its justification is the practice’s existence and utility. | *PrC Predicts:* The asymmetry is morally necessary. Release respects the promisee’s autonomy over the claim they hold; unilateral cancellation wrongs the promisee by disregarding the assurance given and their reliance/expectations. |
  | **(iv) Is promising best understood as the exercise of a normative power?**<br><br>*Neutral: Whether the core function of promising is to intentionally change normative relations (obligations, rights) by invoking a recognised capacity to do so.* | "Conditionally Yes, *within* a practice. Promising functions as a normative power *because* the practice confers that power on individuals who perform the conventional act. The power is institutionally defined." | "Yes, inherently. Promising is essentially the exercise of a moral normative power – an innate (or fundamental moral) capacity to alter one’s own obligations and another’s rights through a voluntary act of assurance, recognised as such." | **Case 2: Faulty Description & Omitted Element.** Community C’s binding practice requires uttering "I swear it" *and* clasping hands. Newcomer D learnt only "uttering ‘I swear it’ binds you." Member E, knowing the real rule, says "I swear it" to D but deliberately omits the handclasp, intending no undertaking. D reasonably believes E is bound. | *PC Predicts:* No obligation exists. The practice’s constitutive rule (handclasp required) wasn’t satisfied. E did not successfully exercise the normative power defined by the practice. D’s belief is mistaken. | *PrC Predicts:* An obligation exists *towards D*. E gave an assurance (uttering the formula knowing D would reasonably take it seriously) and is thus bound by the principle of fidelity *to D*, regardless of E’s private intention or the community’s full practice. The power was exercised via the assurance. |

  ---

  ### III. Verbal Disagreement  
  We identify a potential verbal element concerning the **scope of "obligation" and "practice"**.  
  *   **PC** typically uses "promissory obligation" to denote an institutional fact constituted by a specific social practice's rules. Within this frame, obligations *cannot* exist without the relevant practice.  
  *   **PrC** uses "promissory obligation" to denote a moral relation generated by the act of assurance itself, potentially independent of institutional facts.  
  **Why this is (partly) verbal:** The disagreement over whether Case 1 creates a "promissory obligation" hinges significantly on whether one accepts only institutional obligations (PC) or also non-institutional moral obligations (PrC) as valid instances of "promissory obligation." This difference in conceptual starting points shapes the initial answer to Crux (i). The *substantive* disagreement lies in whether the *distinctive features* of promissory obligations (directedness, promisee release) *require* a practice for their existence and intelligibility (PC) or can arise purely from the moral logic of assurance (PrC).  

  ---

  ### IV. What Would Move Each Side  
  *   **PC would abandon its core claim if:** Compelling evidence emerged that individuals, completely isolated from *any* social practice or convention *resembling promising* (including implicit reciprocity norms), could reliably create and recognise interactions possessing *all* the distinctive features of promises (especially the promisee’s unilateral power of release) through pure moral reasoning based solely on the act of assurance. Case 1 is designed to test this.  
  *   **PrC would abandon its core claim if:** It could be conclusively shown that the very concepts of directed obligation and the promisee’s normative power (especially unilateral release) are *incoherent* or *unintelligible* except as artefacts of specific conventional rules. If Case 3 (Group-Release) were shown to be the *only* coherent form undertaking could take, PrC would be undermined.  

  ---

  ### V. What Could Move the Debate  
  Both sides agree that **Case 3 (Group-Release Practice)** is a crucial test.  
  *   If analysis shows the named individual *does* retain a distinctive moral claim against the promisor (even without release power) that differs from a bystander's claim, this would support PrC's claim of a core moral relation existing independently of the practice's rules.  
  *   If analysis shows the named individual has *no* distinctive moral claim separable from the community's rules, such that their "assurance" only creates expectations governed by communal norms, this would support PC's claim that the directed obligation itself is constituted by the practice.  

  ---

  **Confidence Assessment:**  
  *   **Agreed Claims (Section I):** High confidence (★★★★☆). These points reflect well-established common ground in how the debate is framed in the literature and avoid contentious interpretations.  
  *   **Verbal Disagreement Diagnosis:** Moderate-High confidence (★★★☆☆). The distinction between institutional and moral obligation as a source of terminological clash is well-supported, though its exact contribution to the stalemate can be debated.  
  *   **Least Confident Point:** **The PC prediction/explanation for Crux (ii) in Case 3 (Group-Release).** While PC can coherently claim the obligation is "owed to" the promisee by the practice's rules, the *moral significance* of this designation, especially in the absence of the release power, feels unstable. Can a rule *stipulate* "owing to" without the corresponding core moral features PrC emphasises? This point (PC Column, Crux ii row) feels the most vulnerable to challenge during workshop scrutiny. (Confidence: ★★☆☆☆).  

  ---
  This document provides a structured framework for adversarial collaboration, isolating specific, testable disagreements within the broader practice/principle dispute. It invites focused debate on the agreed cruxes using the stipulated cases, aiming to move beyond rehearsing familiar arguments.
