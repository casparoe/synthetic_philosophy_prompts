  ### Accountability Desk Decision Procedure  
  **Design Philosophy**: Grounded in linguistic pragmatics (literal meaning vs. implicature) and moral equivalence of deception (true statements that mislead are as harmful as lies). Avoids intent, focuses on audience impact.  

  **Procedure Flow** (15-min max per statement):  
  1. **Step 1: Literal Truth Check** (3 min)  
     - **Question**: "Is the statement **literally true** based on the words spoken and verifiable facts?"  
     - **Good Enough Answer**: Cross-reference with trusted sources (e.g., official records, prior reporting). Ignore intent; focus only on semantic meaning.  
     - **Outcome**:  
       - Literally **false** → **TAG "LIE"** (Stop).  
       - Literally **true** or **unverifiable within time** → Proceed to Step 2.  

  2. **Step 2: False Implicature Check** (5 min)  
     - **Question**: "Would a **reasonable listener** infer a **false claim** from what’s implied (not just stated)?"  
     - **Good Enough Answer**: Identify top 1-2 contextual inferences using Gricean maxims (relevance, quantity). Ask: "Does omitting/keywording (e.g., 'never,' 'all') nudge toward falsehood?"  
     - **Outcome**:  
       - False implication found → **TAG "MISLEADING"** (Stop).  
       - No false implication → Proceed to Step 3.  

  3. **Step 3: Exploitation of Prior False Belief** (5 min)  
     - **Question**: "Is the statement **true and non-misleading** but **exploits** the audience’s existing false belief to deceive?"  
     - **Good Enough Answer**: Verify (a) a common false belief exists (e.g., via polls, social trends), and (b) the statement **relies on it** to land as intended.  
     - **Outcome**:  
       - Exploitation confirmed → **TAG "MISLEADING"** (Stop).  
       - No exploitation → **TAG "FINE"** (Stop).  
     - **Escalation**: If team disputes whether exploitation is "deceptive enough," escalate to you/legal (values call on tolerance).  

  ---

  ### Key Features  
  1. **Lies vs. Misleading**:  
     - **Lie** = Literal falsehood (Step 1).  
     - **Misleading** = True statement + false implication (Step 2) **OR** exploitation of false belief (Step 3).  
     - **Same tag when**: Both cause identical harm (e.g., voter fraud claims that sway elections). Moral equivalence is acknowledged, but tags stay separate to uphold precision.  

  2. **Third Case Handling**:  
     - **Category**: Tagged as **"MISLEADING"** (Step 3).  
     - **Why?** The speaker weaponizes the audience’s ignorance without lying or implying falsehoods. This is deception-by-omission, morally akin to lying.  

  ---

  ### Test Runs  
  #### Case 1: Senator says *"We cut taxes for the middle class."*  
  - **Fact**: Nominal tax cut < inflation (real income ↓).  
  - **Procedure**:  
    1. **Step 1**: Literally true (taxes were cut). → Proceed.  
    2. **Step 2**: Reasonable listener infers *"middle class benefits."* False (real income ↓). → **MISLEADING**.  
  - **Why reporters hate**: "But it’s true!" Yet omission of inflation misleads.  

  #### Case 2: CEO says *"We’ve never had a data breach."*  
  - **Fact**: Subsidiary (now sold) had a breach.  
  - **Procedure**:  
    1. **Step 1**: Literally true? "We" could mean current entity (no breach). → Proceed (unverifiable in 3 min? Assume true).  
    2. **Step 2**: Reasonable listener infers *"no breaches under corporate umbrella."* False (subsidiary breach). → **MISLEADING**.  
  - **Why lawyers hate**: "No intent to deceive!" But implication is false.  

  #### Case 3: **Made-Up Example** (Politician): *"My opponent voted against disaster relief for flood victims."*  
  - **Fact**: Opponent voted "no" on a bloated omnibus bill with unrelated pork; supported standalone relief.  
  - **Procedure**:  
    1. **Step 1**: Literally true (voted against the bill). → Proceed.  
    2. **Step 2**: Reasonable listener infers *"opponent opposes flood relief."* False (supported standalone bill). → **MISLEADING**.  
    3. **Step 3**: Not needed (tagged at Step 2).  
  - **Why reporters hate**: "It’s factual!" But cherry-picked to imply false character.  

  ---

  ### Limitations  
  1. **Misfires**:  
     - **Literal ambiguity**: E.g., "We" in CEO case (Step 1) may require legal definitions.  
     - **Overbroad implicature**: Some inferences are subjective (e.g., "middle class" definitions). Mitigated by team consensus on "reasonable listener."  
     - **Cultural context**: Prior false beliefs (Step 3) may be hard to verify in 5 min.  

  2. **Unsettleable Cases**:  
     - **Sarcasm/irony**: No tone in transcript (e.g., "Sure, I love losing money" during losses).  
     - **True but harmful**: E.g., publishing classified info. Requires editorial/legal escalation.  
     - **Partisan facts**: E.g., "tax cuts boost growth." Escalate (values call on which economists to trust).  

  **Final Note**: This procedure forces objectivity but can’t replace human judgment. Use escalations for edge cases where philosophy (how much deception we tolerate) outweighs pragmatics.
