     Now, where the procedure misfires and what it can't settle:

     Misfires:
        - If we cannot prove a literal falsehood in step 1 (due to lack of time or evidence), we might miss a lie and then step 2 might not catch it if there are no false implications? Then we tag as fine, but it was a lie. This is a false negative for lies.
        - Similarly, if step 2 misses a false implication, we might tag as fine a misleading statement.

     What it can't settle:
        - Disputes about what a reasonable listener would believe (step 2) might be subjective and require editorial judgment.
        - The third case (exploitation of prior false belief) is tagged as fine, but we might feel it's deceptive. We can't capture that in the tag.
        - We cannot prove intent, so we might miss lies when the statement is literally true but the speaker believes it is false? But we are not allowed to do that.

     The procedure must be run in 15 minutes, so we rely on quick fact-checking and reasonable inferences.

     Final procedure:

     **Accountability Desk Decision Procedure**

     **Step 1: Literal Truth (5 minutes)**
        - Using available resources, check the literal meaning of the statement against verifiable facts.
        - If you find clear evidence that the statement is false: 
              Tag: **LIE**
              Stop.
        - Else (the statement is true or unverified but not proven false): 
              Proceed to Step 2.

     **Step 2: False Implicature (5 minutes)**
        - Identify the main implications (what a reasonable listener would infer) from the statement in context. Consider the audience's common prior beliefs.
        - For each identified implication:
              - If you find clear evidence that the implication is false:
                    Tag: **MISLEADING**
                    Stop.
        - If no false implications are found: 
              Proceed to Step 3.

     **Step 3: Exploitation Check (5 minutes)**
        - The statement is literally true and has no false implications. However, consider if the audience is known to have a prior false belief that the statement exploits (i.e., the statement is designed to reinforce that false belief without explicitly stating it).
        - If you identify such a situation:
              - This is the "third case". We tag it as **FINE** but note in the report: "Statement exploits prior false belief without correcting it."
              - If the team feels strongly that this is deceptive, escalate to editor and legal for a values call (but the tag remains "fine" unless they decide otherwise).
        - Else:
              Tag: **FINE**

     However, note: in step 3, we are not changing the tag. We are just noting. So the output tag is "fine".

     We run the examples:

     Example 1: Senator and tax cut.
        Step 1: Literally true -> step 2.
        Step 2: Implication that the middle class is better off (or at least not worse off) is false -> misleading.

     Example 2: CEO and data breach.
        Step 1: If we can prove the parent company had a breach (via subsidiary) then lie. If we cannot (because the subsidiary was separate) then step 2: implication that the entire corporate history is clean is false -> misleading.

     Example 3: Tobacco company compliance.
        Step 1: True.
        Step 2: The implication that the products are safe? We decide: a reasonable listener knows tobacco is unsafe, so no false implication? Then step 3: The audience might believe that compliance means safer? But we don't think so. Then tag as fine.

     But reporters might argue that the statement is made to create an impression of safety. Then we would note in step 3: exploits prior false belief? And they might escalate.

     The procedure can't settle:
        - Ambiguities in literal meaning (like the scope of "we").
        - What counts as a reasonable implication? (This requires editorial judgment.)
        - Cases where the evidence is not available in 15 minutes.

     We note that the procedure is a first pass and may require escalation for borderline cases.

     We'll write the procedure in a boxed format.

     **Final Decision Procedure**

     1. **Literal Truth Check (5 min max)**  
        - Question: "Can we prove the statement false with readily available facts?"  
        - Good enough answer: Clear evidence of falsehood (e.g., contradictory data, unambiguous public record).  
        - Outcome:  
            - False: Tag **LIE**. Stop.  
            - Not false: Proceed to Step 2.  

     2. **Implicature Check (5 min max)**  
        - Question: "Would a reasonable listener, given common prior beliefs, infer something false from this statement?"  
        - Good enough answer: At least one primary implication is provably false (e.g., context suggests a claim beyond the literal meaning that doesn’t hold).  
        - Outcome:  
            - False implication found: Tag **MISLEADING**. Stop.  
            - No false implication: Proceed to Step 3.  

     3. **Exploitation Check (5 min max)**  
        - Question: "Is the statement true and implication-free but likely exploiting a known prior false belief?"  
        - Good enough answer: Audience widely holds a false belief directly relevant to the topic, and the statement’s effect relies on it without correction.  
        - Outcome:  
            - Yes: Tag **FINE** + internal note: "Exploits prior false belief." Escalate to editor/legal if values call needed.  
            - No: Tag **FINE**.  

     **Escalation Points**:  
     - Step 1: If evidence is contested or unavailable within 5 min, proceed to Step 2 but note uncertainty.  
     - Step 2: If implications are ambiguous (e.g., "Is this what people really infer?"), escalate to editor for judgment.  
     - Step 3: Always escalate if the team believes the "exploitation" case warrants a different tag (e.g., "MISLEADING") due to ethical concerns.  

     **Example Tagging**:  
     1. Senator: "We cut taxes for the middle class" (cut < inflation)  
        - Step 1: True (nominal cut).  
        - Step 2: False implication (real tax burden decreased) → **MISLEADING**.  

     2. CEO: "We’ve never had a data breach" (subsidiary did)  
        - Step 1: If "we" includes past subsidiaries → **LIE**.  
          OR if narrowly true (current entity):  
          - Step 2: False implication (no breaches in corporate history) → **MISLEADING**.  

     3. Tobacco Co: "We comply with all government regulations."  
        - Step 1: True (assume compliance).  
        - Step 2: Reasonable listener does *not* infer safety (common knowledge of tobacco risks) → No false implication.  
        - Step 3: Audience may falsely believe compliance = safety? If yes: **FINE** + note. Else: **FINE**.  
          - *Reporters may hate this*: It’s technically fine but feels like deflection.  

     **Limitations**:  
     - Cannot reliably detect lies without evidence (Step 1 weakness).  
     - Implicature is subjective; relies on team’s "reasonable listener" model.  
     - "Exploitation" in Step 3 is often debatable and hard to prove without intent.  
     - Cannot handle sarcasm/irony without explicit context.
