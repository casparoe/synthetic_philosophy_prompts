prompt: |-
  I'm a second-year medical ethics student, and for the past few months I've been trying to write down what I actually think about choosing children. The occasion is that a friend of mine works as a genetic counselor at a fertility clinic that has recently started offering a service I had never heard of until she explained it to me: for each embryo in a batch, the lab computes a score for traits like adult height, body mass, and years of schooling, and parents may look at those scores when they decide which embryo to transfer. I have no settled view about the service as a whole, and I am not asking whether it should be legal or how it should be regulated. What interests me is that my reactions to particular choices are quite consistent, and I would like to know whether there is a principle behind them or whether I am simply improvising. Here is where I actually land. Two embryos, one of which will develop a degenerative neurological condition that means years of pain and death in childhood: choosing the other is not merely permitted but required, and I do not find that a hard case at all. An embryo that will very likely develop moderate hearing loss in middle age, against one that will not: choosing the one that will not is fine, and I would think badly of a clinic that refused to let the parents weigh it. A variant that the clinic's data associate with roughly two additional years of schooling on average and with a modestly elevated risk of a mood disorder in adulthood: choosing that embryo is fine, since the parents are betting on a whole life and mild risks are everywhere. A variant associated with being about two inches taller than the alternative: I squirm, but I cannot bring myself to call it wrong, though if the service became universal and the average rose and no one's life was any better except in relation to everyone else, I would think something had gone badly wrong. A variant associated with lighter skin, which in the country where these particular parents live predicts, on average, better treatment by teachers, doctors, and police: not fine, even granting that the child's life will go better; it looks to me as though the parents are buying into an injustice rather than shielding the child from one. An embryo selected in part because it will be a good tissue match for an older sibling who needs a transplant, where the parents say, and I believe them, that they wanted a second child anyway and will love this one no less: fine. And an embryo selected for a variant associated with a very even temperament and a strong preference for routine, which the parents want because they think it will make for a calmer household: not fine, and I notice I am considerably more bothered by this than by the tissue match, even though in both cases the child is chosen partly for someone else's sake.

  The best I have come up with is this: choose the embryo you expect to have the better life, unless the advantage you are buying comes at someone else's expense, or unless the child could rightly resent you for having chosen as you did. I cannot tell whether that is one principle with two escape hatches or three principles wearing a trench coat, and I suspect the resentment clause is doing work the welfare clause cannot do.

  You are a philosopher who works on the ethics of reproduction and who is good at stating a principle precisely and then finding the case that breaks it. Please brainstorm the candidate principles and the cases that pull against each before you commit to anything. Then give me your best formulation, clause by clause, saying which of my cases forces each clause and which clause is carrying the most weight. Tell me which of my seven verdicts the principle requires me to abandon; if it saves all seven, tell me exactly what further clause buys that and what it costs me elsewhere. Then apply the principle to two cases I have not made up my mind about. First, parents select the embryo that is the better tissue match even though the clinic's scores suggest it will have a somewhat harder life than the alternative, so the interests of the two children conflict — does my sibling verdict survive that? Second, parents choose the embryo with the lower expected welfare because they are confident they would be better parents to that child and the family as a whole would flourish — I want to know whether your principle treats the child's own welfare as something that can be traded against other goods or as a constraint that cannot be traded at all. Be explicit about the difference between a principle that tracks what the parents intend and one that tracks what the child ends up with, since I think my verdicts pull in both directions. Where you think I am simply inconsistent and should change a verdict rather than complicate the principle, say so plainly. Write in American English, keep the answer focused on the principle rather than a survey of the literature, and flag any point at which you think the question itself is confused.
reasoning: |-
  Okay, this is a fascinating and complex query from a medical ethics student. They've presented seven nuanced embryo selection scenarios with intuitive judgments and are seeking a unifying ethical principle. The cases range from clear-cut (preventing childhood degenerative disease) to morally fraught (selecting for traits that reinforce social injustice). 

  The student is clearly wrestling with tensions between:
  - Individual welfare vs societal consequences
  - Absolute vs positional goods
  - Parental autonomy vs potential harm to child
  - Instrumentalization vs protective motivations

  Hmm, their proposed principle has three components: expected better life, no advantage at others' expense, and no reasonable resentment. But they're rightly suspicious this might be ad hoc. I need to pressure-test this.

  First, let's catalog their verdicts:
  1. Prevent fatal childhood disease: required
  2. Prevent mid-life hearing loss: permitted
  3. Accept mild academic boost with mood risk: permitted
  4. Select for height: uneasy but permissible
  5. Select for lighter skin: impermissible (reinforces injustice)
  6. Select for tissue match: permissible (with love commitment)
  7. Select for temperament for parental convenience: impermissible

  The resentment clause seems to be doing heavy lifting in cases 5 and 7 - but why is resentment reasonable for skin color selection but not for saving a sibling's life? That suggests the source of advantage matters.

  For new cases: 
  - Tissue match when it lowers child's own welfare: This forces a conflict between welfare and relational goods. Their sibling verdict might not survive if welfare is significantly compromised.
  - Deliberately choosing lower welfare for family harmony: This attacks whether welfare is a constraint or tradable. Their reaction to the temperament case suggests they see welfare as non-tradable when instrumentalized for parental benefit.

  The key tension is between:
  - Consequentialist elements (maximizing expected welfare)
  - Deontological constraints (no complicity in injustice, no treating child as mere means)

  A multi-principle framework might be unavoidable here. We'll need:
  1. Welfare threshold principle (must avoid serious harm)
  2. Anti-instrumentalization principle (no selection that makes child a tool)
  3. Justice principle (no reinforcing oppressive systems)
  4. Permissible advantage principle (allow enhancement within reason)

  But then we must explain why height selection (4) is only "squirm"-worthy while skin color (5) is flatly wrong. The difference appears to be that skin selection actively participates in and perpetuates injustice, while height selection merely navigates existing positional competition.

  The resentment test is clever but vulnerable - a child selected for tissue match might resent being instrumentalized, yet the student permits this. So resentment can't be the decisive factor. More crucial is whether the selection treats the child as an end in itself.

  For the unsettled cases:
  - Conflicting sibling interests: Permissible only if welfare sacrifice is minor and parents demonstrate unconditional commitment. Major welfare tradeoffs would fail the threshold principle.
  - Lower welfare for family flourishing: Only permissible if the "lower welfare" still clears a minimal threshold and the selection isn't primarily instrumental. But this directly contradicts their temperament verdict - inconsistency here.

  Ultimately, they might need to either:
  a) Abandon permission for the tissue match case when welfare is reduced, or
  b) Recalibrate the temperament verdict if parents can show genuine benefit to child

  The core confusion might be conflating:
  - Selection criteria (what traits are chosen)
  - Parental motivation (why they choose)
  - Social meaning (how choice affects others)

  No principle will perfectly preserve all intuitions because case 4 (height) and case 5 (skin) reveal contradictory attitudes toward positional goods. Either height selection must become impermissible, or skin selection must be conditionally permissible - neither of which they'll like. That's where philosophical work is needed.
answer: |-
  Below is a principled framework distilled from your intuitions, tested against your cases and extended to new ones. I'll proceed stepwise: (1) Brainstorm candidate principles and counterexamples, (2) Present a final principle with clauses mapped to your cases, (3) Identify any forced verdict abandonment, (4) Apply the principle to your unresolved cases, and (5) Flag points of tension. I’ll use American English and avoid literature surveys per your request.

  ---

  ### **1. Brainstorming Candidate Principles & Counterexamples**  
  I’ll outline three candidate principles and show how your cases challenge them. Your core tension is between *child welfare*, *social consequences*, and *parental motives*.

  | Candidate Principle                     | Why It Fails Your Cases                                                                 |
  |-----------------------------------------|----------------------------------------------------------------------------------------|
  | **A. Maximize Expected Welfare**: Choose the embryo with the highest predicted well-being. | - *Fails skin color case*: Welfare might improve via unjust social advantages.<br>- *Fails temperament case*: A calmer household might boost welfare, but you forbid it. |
  | **B. Avoid Harm/Injustice**: Choose to prevent serious harm or complicity in injustice. | - *Too narrow*: Permits height/schooling selections (neutral/mild risks) but doesn’t explain why they’re acceptable.<br>- *Ignores motives*: Doesn’t distinguish tissue match (permitted) from temperament (forbidden) despite both using the child for others’ benefit. |
  | **C. Resentment Test**: Choose unless the child could reasonably resent the selection. | - *Overbroad*: A child with moderate hearing loss might resent not being selected against it, but you allow that choice.<br>- *Underprotective*: A light-skinned child might not resent being selected for better treatment, but you forbid it. |

  **Key Insight**: Your judgments hinge on **three distinct variables**:  
  - **Welfare magnitude** (how much benefit/harm?).  
  - **Source of advantage** (intrinsic vs. unjust social systems).  
  - **Instrumentalization** (whether the child is treated as a tool).  

  ---

  ### **2. Final Principle: The Threshold-Agency-Justice (TAJ) Framework**  
  Your seven cases are preserved under this three-clause principle:  

  > **Parents may select an embryo if**:  
  > **Clause 1 (Welfare Threshold)**: It is expected to avoid severe harm or achieve significant welfare *relative to a minimally decent life*; AND  
  > **Clause 2 (Anti-Instrumentalization)**: The selection does not primarily treat the child as a means to others’ ends; AND  
  > **Clause 3 (Justice-Compliance)**: The advantage sought does not require perpetuating or exploiting systemic injustice.  
  >   
  > **Corollary for Tradeoffs**: When clauses conflict, Clause 1 outweighs Clause 2 if the welfare threat is severe; Clause 3 is inviolable.  

  #### **How Clauses Map to Your Cases**  
  | Your Case                        | Clause 1 (Welfare)                          | Clause 2 (Instrumentalization)              | Clause 3 (Justice)                          |  
  |----------------------------------|---------------------------------------------|---------------------------------------------|---------------------------------------------|  
  | 1. Fatal neuro condition         | **Required**: Severe harm avoided.          | N/A (no means-based selection).             | N/A.                                        |  
  | 2. Moderate hearing loss         | **Permitted**: Significant welfare gain.    | N/A.                                        | N/A.                                        |  
  | 3. Schooling + mood risk         | **Permitted**: Mild risk, net gain.         | N/A.                                        | N/A.                                        |  
  | 4. Height advantage              | **Permitted** (barely): Positional good; weak welfare gain. | N/A.                                        | **N/A, but uneasy**: No *direct* injustice, but risks social harms if scaled (handled by corollary). |  
  | 5. Lighter skin for social bias  | Welfare gain irrelevant.                    | N/A.                                        | **Forbidden**: Exploits injustice (systemic bias). |  
  | 6. Tissue match for sibling      | Welfare neutral/gain (loved child).         | **Permitted**: Not *primarily* instrumental (parents wanted child anyway). | N/A.                                        |  
  | 7. Temperament for calm household | Welfare gain possible.                      | **Forbidden**: Child selected *as a tool* for parental convenience. | N/A.                                        |  

  **Clause Weight**:  
  - Clause 1 carries the most weight in "easy" cases (e.g., fatal disease).  
  - Clause 3 is the strictest barrier (e.g., skin color).  
  - Clause 2 explains sibling vs. temperament distinction: Motivation matters. "Primarily as a means" is key.  

  ---

  ### **3. Verdicts Requiring Abandonment?**  
  **All seven verdicts are preserved** under TAJ. However, Clause 3’s handling of the height case (4) is precarious. If "positional goods" (e.g., height) *indirectly* perpetuate injustice (e.g., by reinforcing competitive hierarchies), you might need to forbid them to avoid hypocrisy with the skin-color case. Your "squirming" suggests this tension. I propose:  

  - **Added Clause 3.1**: Advantages must not *rely* on or *amplify* unjust social dynamics (e.g., height selection is permissible only if it doesn’t collude with systems that penalize shortness).  
  - **Cost**: This complicates "neutral" enhancements (e.g., IQ). If height is forbidden, schooling (case 3) might be next.  

  ---

  ### **4. Application to Unresolved Cases**  
  #### **Case A: Tissue match with lower welfare**  
  > *Parents select an embryo that’s a better tissue match for a sibling but has lower expected welfare (e.g., higher disease risk).*  

  - **Clause 1**: Lower welfare *might* violate the threshold if the disadvantage is severe (e.g., chronic illness). Mild reductions (e.g., slightly shorter lifespan) may be permissible.  
  - **Clause 2**: If parents genuinely wanted the child (not *primarily* as a donor), it passes.  
  - **Clause 3**: N/A.  
  - **Verdict**: **Permitted if welfare remains above a minimal threshold** (e.g., no severe suffering). If welfare is significantly compromised, it fails Clause 1. Your sibling verdict survives only if the child’s life is still "minimally decent."  

  #### **Case B: Lower welfare for family flourishing**  
  > *Parents choose an embryo with lower expected welfare because they believe they’ll parent it better, improving family life.*  

  - **Clause 1**: Fails if welfare is significantly reduced. "Minimally decent life" is a **non-tradable constraint**—you can’t sacrifice one child’s welfare for others’ benefit.  
  - **Clause 2**: Selecting a "less thriving" child to suit parental skills avoids instrumentalization (it’s *for* the child).  
  - **Clause 3**: N/A.  
  - **Verdict**: **Forbidden if welfare dips below threshold** (e.g., serious health risks). Mild tradeoffs (e.g., slightly lower income potential) might be acceptable. This clashes with your temperament case: If "calmer household" benefits the child, why forbid temperament selection? **Inconsistency flag**: If you permit trading welfare for family flourishing here, you must revisit Case 7 (temperament).  

  ---

  ### **5. Intent vs. Outcome & Other Tensions**  
  - **Intent vs. Outcome**: Your principle tracks *outcomes* for welfare (Clause 1) and justice (Clause 3), but *intent* for instrumentalization (Clause 2). This is defensible: Instrumentalization is a motive-based wrong (e.g., Kantian treatment as a means), while welfare and justice are outcome-sensitive.  
  - **Key Confusion**: You treat welfare as a **threshold constraint** (can’t be traded away) in Cases 1–3 but allow it to be **outweighed** in the tissue-match case. Resolution: Welfare is tradable only for *other moral duties* (e.g., saving a sibling) and only above the minimal threshold. It’s never tradable for parental preference (Case 7) or social gain (Case 5).  
  - **Inconsistency**: Your tolerance for height selection (Case 4) conflicts with your skin-color verdict (Case 5). Both exploit social biases. Either:  
    - (a) Forbid height to match skin-color logic (Clause 3.1), or  
    - (b) Permit skin color if parents frame it as "shielding from injustice" (but you reject this).  
    **Recommendation**: Abandon the height-permissibility verdict or add Clause 3.1.  

  ---

  ### **Final Summary**  
  Your intuitions reflect a hybrid principle prioritizing **welfare thresholds**, **anti-instrumentalization**, and **anti-injustice**. TAJ preserves all seven verdicts but strains at height selection and welfare tradeoffs. For unresolved cases:  
  - **Tissue match with lower welfare**: Permitted only if welfare stays above minimum.  
  - **Lower welfare for family flourishing**: Forbidden if welfare is significantly reduced; mild tradeoffs are edge cases.  

  Where to refine: Reconcise height/skin tension, and clarify whether "family flourishing" can justify submaximal welfare. If this exposes conflicts, it’s a feature—not a bug—of precise principles.
