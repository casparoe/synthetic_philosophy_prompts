prompt: |-
  I clerk for the truth commission here — we came out of the military regime in the 90s, and the amnesty law just says amnesty can be granted where it serves reconciliation, which has turned out to mean whatever the panel wants it to mean on the day. I write alot of the first-pass memos on applications, and I'm supposed to flag when we're about to contradict ourselves. Next month's batch has one I cant call, so I'd like your read before I write it up.

  Here's how the panel has actually ruled so far.

  A conscript private fired into a crowd of protesters on his lieutenant's order and killed three people. He named the lieutenant, who up till then wasn't on our list at all. At the hearing he said he'd do it again. Amnesty granted.

  The colonel who wrote the internal directive that set up the reprisal campaign testified for two days, courteous and complete, but we already had the directive and his signature on the covering memo, so he gave us nothing we couldn't have pulled from the archive ourselves. He apologized and said he'd carry it the rest of his life. Denied.

  A sergeant in the unit that ran one of the holding sites, who beat people there himself on his captain's instructions, told us where a second site was — we didn't know about it — and named the two officers who ran it. Granted.

  A major in the logistics branch who signed off on the vehicles and fuel that went to the reprisal units cooperated fully, gave us nothing new, and showed no sign he thought any of it mattered. Denied.

  A lieutenant who commanded a reprisal squad and was standing there while his men did the killing: his account matched the files we already had, and he never named anyone above him. Denied.

  The written reasons read like they came from two different panels. Some of them go on about new information and the state of the record; others go on about whether the applicant stood at the origin of the policy or was only an instrument. There's one commissioner who files a separate note about contrition every time, though the private who'd do it again got amnesty, so I've stopped trying to make that add up.

  The applicant next month is a captain who commanded a company through the worst of it, picked targets, and was present at the killings. He's handing over a notebook that names the brigadier who set the whole campaign up, and we've never identified the brigadier, so it's genuinely new. He shows no remorse whatsoever.

  What does the panel do with him? I care less about the yes or no than about the rule they're actually running — give me the rules that fit the five cases above, what each one predicts for the captain, which you'd bet on and why, and what case I should be watching for that would actually settle which rule it is. If two readings fit the old cases equally well, say so; I'd rather know that than get a confident answer. And please dont give me a seminar on restorative justice, I need something I can put in the memo.
reasoning: |-
  Alright, let's tackle this step by step. The user is a clerk for a truth commission dealing with amnesty applications post-military regime. They need to predict the panel's decision on a captain's case based on past rulings. The key is to uncover the implicit rules the panel uses, since the written reasons seem inconsistent.

  First, I'll look at the five past cases to find patterns. The conscript private got amnesty despite no remorse because he provided new info (named the lieutenant). The colonel was denied even though he apologized but added no new information. The sergeant was granted for revealing a new site and naming officers. The logistics major was denied for no new info and no remorse. The lieutenant was denied for no new info and not naming superiors.

  So, the common factors seem to be: providing new information and being perceived as a tool rather than an originator. Contrition doesn't seem consistent since the private got amnesty without remorse. 

  For the captain's case, he's providing genuinely new info (names the brigadier) but shows no remorse. He commanded units and picked targets, which might make him an originator. How will the panel weigh new info vs. his role? The rules from past cases might conflict here. 

  Possible rules: Rule A (new info) suggests amnesty, Rule B (originator vs. instrument) suggests denial. Since the captain's role is higher than previous granted cases, the panel might lean towards Rule B. But the new info is significant. 

  To resolve which rule dominates, the user should watch for a future case where a high-ranking officer provides new info. If they get amnesty, Rule A is stronger; if denied, Rule B prevails. 

  The user needs actionable insights for their memo, so highlighting the conflict between the two rules and the key factors (new info, role, contrition inconsistency) is crucial. They should present both outcomes based on each rule and suggest monitoring future cases for clarity.
answer: |-
  Based strictly on the panel's past rulings and ignoring stated reasons (focusing on outcomes/actions), **two competing rules fit the cases equally well**. The Captain's case forces a choice between them. Here's the breakdown:

  **Rule A: The "New Information" Rule**
  *   **What it is:** Amnesty is granted *if and only if* the applicant provides **new, material information** identifying perpetrators or locations not previously known to the Commission, *regardless* of rank, contrition, or role in the crime.
  *   **Fits Cases:**
      *   Private: Named Lieutenant (new perpetrator) - **Granted**.
      *   Colonel: Provided no new information - **Denied**.
      *   Sergeant: Revealed new site & named officers (new location/perpetrators) - **Granted**.
      *   Major: Provided no new information - **Denied**.
      *   Lieutenant: Provided no new information - **Denied**.
  *   **Contrition/Ideology:** Irrelevant (Private granted despite "do it again").
  *   **Role:** Irrelevant (Private/Sgt low-level actors granted; Major/Lt mid-level denied for *no info*; Colonel denied for *no info*).
  *   **Prediction for Captain:** Provides genuinely new information (names Brigadier). **Rule A Predicts: GRANTED**.

  **Rule B: The "Instrument vs. Originator" Rule**
  *   **What it is:** Amnesty is granted if the applicant is deemed an **"instrument"** merely following orders from higher-ups. Amnesty is *denied* if the applicant is deemed an **"originator"** (initiated policy, exercised significant command discretion, showed ideological commitment), *regardless* of new information provided, *unless* they are very low rank.
  *   **Fits Cases:**
      *   Private: Classic "instrument" (conscript, followed direct order). Naming Lt confirms instrument status. **Granted**.
      *   Colonel: Clear "originator" (wrote directive, set policy). Apology irrelevant. **Denied**.
      *   Sergeant: "Instrument" (beat people *on captain's instructions*). Revealing new site confirms lower status. **Granted**.
      *   Major: "Originator" (logistics command, exercised discretion signing off, showed no remorse/ideological alignment). **Denied**.
      *   Lieutenant: "Originator" (commanded squad, present at killings, exercised command authority, didn't implicate superiors). **Denied**.
  *   **New Information:** Can be a *symptom* of being an instrument (exposing originators) but not decisive alone (Colonel/Major/Lt could have provided info but were still originators).
  *   **Contrition/Ideology:** Evidence of ideological commitment ("do it again" irrelevant for low instrument; Major/Lt denial reinforced by lack of remorse/ideology).
  *   **Prediction for Captain:** Clear "originator" (Captain rank, commanded company, *picked targets*, present at killings, no remorse). Providing the Brigadier's name doesn't change his originator role. **Rule B Predicts: DENIED**.

  **The Conflict for the Captain**
  *   **Rule A (New Info):** Strongly points to **GRANTED** (names Brigadier, major new info).
  *   **Rule B (Originator):** Strongly points to **DENIED** (Captain actively commanded, picked targets, originator-level role).

  **Which Rule Wins? The Bet & Why**
  *   **Bet: Rule B (Originator) wins. Prediction: DENIED.**
  *   **Why:**
      1.  **Rank Threshold:** The panel has never granted amnesty to anyone above Sergeant (Private, Sergeant granted; Major, Lieutenant, Colonel denied). Captain is a significant command rank.
      2.  **Discretion is Key:** The Private and Sergeant were explicitly following *specific, direct orders* ("fired *on lieutenant's order*", "beat people *on captain's instructions*"). The Captain *picked targets* – this involves significant independent judgment and command discretion, placing him firmly in the "originator" category per the denied Lieutenant (commanded squad) and Major (discretion over resources).
      3.  **New Info Undermined:** While the Brigadier's name is new, the Captain *was the direct actor* implementing the policy at the company level. The panel may view his testimony as self-serving (pointing higher to save himself) rather than mitigating his own culpability as an originator. The denied Colonel also provided "information" (testimony) but it didn't save him.
      4.  **No Remorse as Reinforcer:** The lack of remorse aligns perfectly with the denials of the Major and Lieutenant under Rule B.

  **The Case to Watch to Settle the Rule**
  Watch for an application from a **Mid-Level Officer (e.g., Major or Lieutenant) who provides genuinely new, significant information** (e.g., names a policy architect above Colonel rank, reveals a major unknown atrocity site).

  *   **If GRANTED:** Rule A (New Information) is dominant. The panel prioritizes truth-finding above command responsibility level.
  *   **If DENIED:** Rule B (Instrument vs. Originator) is dominant. The panel draws a firm line at command roles involving discretion (Major/Lt/Captain+), regardless of information provided. Truth-finding is secondary to assigning responsibility at this level.

  **For Your Memo - Key Flags:**
  1.  **Conflict:** The Captain forces a choice between two equally plausible patterns: New Information (Grant) vs. Originator Status (Deny).
  2.  **Rank/Discretion Precedent:** Panel has *never* granted amnesty above Sergeant rank. Captain exercised significant discretion ("picked targets").
  3.  **New Info Value:** While significant (Brigadier ID), his direct command role may outweigh it. Precedent (Colonel denied despite cooperation) suggests cooperation alone isn't enough for originators.
  4.  **Contrition Inconsistency:** Reiterate that contrition is an unreliable predictor (Private granted without it), but its *absence* aligns with denials of originators (Major, Lt).
  5.  **Recommendation:** Flag the high risk of contradiction *unless* the panel explicitly clarifies its stance on whether mid-level commanders providing breakthrough information can transcend the "originator" threshold. The decision here will retrospectively define the dominant rule. Bet: Denial based on originator status/rank.
