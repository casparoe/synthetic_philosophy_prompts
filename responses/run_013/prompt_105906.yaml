  **Hillside Community Covenant: Truthfulness Policies (Section 7.1)**

  1.  **Direct Inquiry Protocol:** Residents shall not knowingly state falsehoods in response to any direct question, regardless of perceived consequence or the questioner's intent (e.g., inquiries regarding location, ownership, or action). Silence or non-verbal refusal remains permissible.  
  2.  **Social Interaction Standards:** Expressions of opinion (e.g., "That hat suits you") must be sincerely held; inquiries soliciting opinions (e.g., "How do I look?") shall be understood as requests for truthful assessment, not encouragement for insincere affirmation.  
  3.  **Promise & Commitment Registry:** Utterances containing the phrase "I promise" or "I will" are legally binding declarations of future action; failure to fulfill constitutes a prior falsification of intent, making the speaker liable for resultant disruptions or reliance damages.  
  4.  **Self-Deception Mitigation:** Residents are encouraged to examine internal narratives for consistency with observable facts; habitual self-misrepresentation, while not externally sanctionable, invalidates personal moral standing and may lead to unintentional breaches of Policy 1.  
  5.  **Causal Accountability Clause:** Any harmful outcome occurring within a chain of events initiated by a demonstrable falsehood (e.g., providing incorrect information leading to injury, or a broken promise causing financial loss) shall be formally attributed to the originating speaker's act of falsification, not the proximate actor.
