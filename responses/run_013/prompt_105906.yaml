  can you write me a parody residents' handbook for a made-up town that actually turned that rule into local law? deadpan council-memo voice, no winking, no jokes that just amount to "kant was silly." the funny has to come from getting the actual view right, including the parts everyone forgets — that you're still allowed to just refuse to answer or stay quiet, and that if you do lie and something awful happens later it gets counted as your fault somehow. i want someone who's actually read him to laugh instead of wincing, and by the end i want to half-feel why a person might genuinely sign up to live in that town, not just that it'd be a nightmare. try to have the five rules hit different corners of town life so we see it creep into everything — small talk, apologies, promises, the little white lies you dont even notice you're telling.

