  ### Final Notes for Juniors  
  **When the Procedure Misfires Mid-Job**:  
  1. **Stalled elimination with obvious inefficiencies**:  
     - *Example: A strategy looks "stupid" but isn’t dominated by any two-strategy mix. Junior suspects a three-strategy mix is needed.*  
     - *Action: Flag to a senior; do not force an elimination. The theory doesn’t support it without deeper analysis.*  

  2. **Inconsistent results on reruns**:  
     - *Example: Weak dominance eliminations change when trying opponent-first vs. our-first order.*  
     - *Action: Note both reduced games in the report; explain the order-dependence risk to the client.*  

  3. **Close-call eliminations with shoddy data**:  
     - *Example: A £0.1m margin in a £10m-scale game is eliminated, but the client knows payoffs are ±£0.2m.*  
     - *Action: Log sensitivity and recommend against relying on the elimination. Hedge the conclusion.*  

  **Blunt Reality Check**:  
  > "Game theory gives a structured way to prune options, but it’s not prophecy. If payoffs are fuzzy, the opponent is irrational, or strategies are missing, the best this does is an educated guess. Never hide the gambles—call them out."
