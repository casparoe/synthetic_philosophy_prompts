  ### Iterated Dominance Procedure: Elimination Checklist
  **Purpose**: Narrow down the opponent's strategies (and ours) by iteratively eliminating options that are strictly or weakly dominated (by pure or two-strategy mixtures). The goal is to reduce the game to a minimal set of scenarios.  
  **Assumptions**:  
  - Both players are rational, know the game payoffs, and avoid dominated strategies.  
  - All possible strategies are listed (critical: if options are missing, results are invalid).  
  - Payoffs are estimated; small errors can reverse close-call eliminations.  

  **Order Dependence & Risks**:  
  - **Weak dominance is order-dependent**: The order of elimination can change the outcome. We prioritize eliminating the opponent's strategies first, then ours.  
  - **Strict dominance is order-independent**: Safe if margins are clear.  
  - **Weak dominance and mixed-strategy eliminations are gambles**: Sensitive to payoff errors and reliance on rationality.  
  - **Stopping point**: If no more eliminations occur, report the reduced game (even if multiple cells remain).  

  **Procedure Checklist**  
  *Run steps iteratively until no eliminations occur or one cell remains. Log each elimination with a reason and note sensitivity if the dominance margin is < 5% of the payoff scale.*  

  1. **Check opponent’s (column player’s) strategies for pure strict dominance**:  
     - For each column strategy, check if there’s another column that yields a strictly higher payoff for the opponent *against every remaining row*.  
     - If found:  
       - *Eliminate the dominated column.*  
       - *Log: "Column [X] eliminated: strictly dominated by column [Y]."*  
       - *If the strictness margin (min difference across rows) is < 5% of max payoff, note: "Sensitive gap: [margin]."*  
     - *Safe if margins are clear; gamble if margins are thin.*  

  2. **Check opponent’s strategies for two-strategy mixed dominance**:  
     - For each column strategy, check if a mixture of two other columns yields a strictly higher payoff for the opponent *against every remaining row*.  
     - *Method: For candidate column C, and pairs (C1, C2), solve for weights λ (0<λ<1) such that for all rows:  
       λ*payoff(C1) + (1-λ)*payoff(C2) > payoff(C).*  
     - If found:  
       - *Eliminate the dominated column.*  
       - *Log: "Column [X] eliminated: strictly dominated by mixture of [Y] and [Z] (weights ~[λ],[1-λ])."*  
     - *Gamble: Highly sensitive to payoffs; only use for clear cases. Skip if infeasible to compute.*  

  3. **Check opponent’s strategies for pure weak dominance**:  
     - For each column strategy, check if there’s another column that yields at least as good a payoff in all rows and strictly better in at least one row.  
     - If found:  
       - *Eliminate the weakly dominated column.*  
       - *Log: "Column [X] eliminated: weakly dominated by column [Y]."*  
       - *Note the row with strict improvement and margin; if margin < 5%, flag sensitivity.*  
     - *Gamble: Order-dependent and payoff-sensitive. Use with caution.*  

  4. **Check opponent’s strategies for two-strategy weak mixed dominance**:  
     - For each column strategy, check if a mixture of two other columns yields at least as good a payoff in all rows and strictly better in at least one.  
     - If found:  
       - *Eliminate the dominated column.*  
       - *Log: "Column [X] eliminated: weakly dominated by mixture of [Y] and [Z]."*  
       - *Note the row with strict improvement and margin.*  
     - *Gamble: Highly order-dependent and payoff-sensitive. Only attempt if pure dominance fails.*  

  5. **Repeat Steps 1–4 for our (row player’s) strategies**:  
     - *After eliminating opponent strategies, re-check our rows for dominance.*  
     - *Log eliminations as above, e.g., "Row [X] eliminated: [reason]."*  
     - *Human decision: If multiple strategies are eligible for elimination, start with the opponent’s to reduce the game faster.*  

  6. **Stopping condition**:  
     - If no eliminations occur:  
       - *Report the reduced game and remaining strategies.*  
       - *Human decision: Analyze scenarios (e.g., Nash equilibrium) if multiple cells remain.*  
     - If one cell remains:  
       - *Recommend that outcome as the predicted result.*  

  **Failure Modes (Where the Procedure Misfires)**  
  1. **Missed mixed dominance beyond two strategies**:  
     - *Example: A strategy dominated only by a mixture of three+ strategies won’t be eliminated. Junior may see eliminations stall despite obvious inefficiencies.*  
     - *Red flag: Payoffs suggest dominance, but no two-strategy mix works.*  

  2. **Order-dependent outcomes with weak dominance**:  
     - *Example: Eliminating strategy A first leaves B undominated, but eliminating B first makes A weakly dominant. Junior may end up with different reduced games on reruns.*  
     - *Red flag: Multiple weakly dominated strategies exist; the procedure’s sequence (opponent-first) arbitrates.*  

  3. **Thin-margin eliminations reversed by payoff errors**:  
     - *Example: A strategy is weakly dominated by a 1% margin. If payoffs are off by 2%, it becomes non-dominated. Junior should flag, but client may disregard if estimates are rough.*  
     - *Red flag: Logged "sensitive gap" warnings during elimination.*  

