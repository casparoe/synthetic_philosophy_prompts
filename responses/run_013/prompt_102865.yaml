  #### **Question 4: Where do rights/duties primarily attach?**  
  *(Answers specify bearers)*  
  - **A. Individual persons**.  
  - **B. Families or lineages**.  
  - **C. Groups** (e.g., states, tribes, corporations).  
  - **D. Relationships** (e.g., bonds between people).  

