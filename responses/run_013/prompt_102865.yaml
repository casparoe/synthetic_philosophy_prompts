  #### **Question 3: When group interests conflict with individual interests, which should prevail?**  
  *(Answers address priority of the good)*  
  - **A. Individual interests** (even if the group suffers).  
  - **B. Group interests** (even if individuals sacrifice).  
  - **C. Neither** (conflicts are resolvable via context/harmony; no inherent priority).  

