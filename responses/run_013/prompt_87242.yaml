  I've been reading about epiphenomenalism — the thesis that conscious experiences are caused by brain processes but are themselves causally inert — together with the standard objection that if experiences never cause anything, then our judgments and reports about them, being physical events, cannot be caused by the experiences they purport to be about, even though those reports track the experiences with striking reliability. My own training is in evolutionary biology, so I think in terms of selection, adaptation, byproducts and spandrels, function, fitness, heritability, and drift, rather than in terms of token causal chains. Restate the epiphenomenalist thesis and this objection as faithfully as you can in that vocabulary. Then give me a residue report: which parts translate cleanly, which survive only in distorted form, and which have no expression in my vocabulary at all — and tell me whether the residue indicates a gap in my framework or shows that the epiphenomenalist's claim was less clear than it sounded. I am especially interested in what, in selectionist terms, is supposed to be the trait under selection here.
