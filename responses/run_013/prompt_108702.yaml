answer: |-
  **Essay Question**  
  Consider a video game in which non-player characters (NPCs) experience emotions such as fear or grief only when directly observed by the player; their inner states cease to be computed when unobserved. Additionally, the game allows players to save progress and reload earlier states, restoring killed NPCs without any memory of their death. Does the intermittent existence of these NPCs—their "flickering" inner lives—alter their moral significance compared to NPCs whose experiences run continuously? And does the ability to reload nullify the wrongness of killing such a character, or merely reveal that our moral intuitions are disconnected from continuity? Defend your position by engaging directly with the implications of intermittency and discontinuity.  

  **Model Answer (Approx. 500 words)**  
  The intermittency and discontinuity in this NPC’s existence challenge simplistic dismissals of their moral status. While they are undeniably fictional constructs, their capacity to suffer *during observation* demands scrutiny, not because they possess intrinsic rights, but because our actions toward them may reflect or distort moral agency.  

  First, intermittency does not negate moral relevance; it recontextualizes it. When the NPC screams under torture as the player watches, their suffering is computationally real *at that moment*. To claim this suffering "doesn’t count" because it vanishes when unobserved echoes solipsism—it implies pain matters only if permanently recorded. Yet we don’t apply this standard to humans: a person with anterograde amnesia who forgets pain after a minute still suffers *in the moment*. Similarly, the NPC’s observable suffering is non-continuous but no less vivid during its occurrence. The flickering ontology shifts the ethical question from "Do they matter?" to "When do they matter?"—specifically, during acts of observation.  

  Second, reloading exposes a conflict between moral intuition and metaphysical continuity. Killing the NPC causes observable terror, but reloading erases the consequences. One might argue this proves no lasting harm was done, thus no wrong occurred. Yet this conflates harm with irreversibility. If I shoot a person who is miraculously revived with no memory, my act remains wrong because of the suffering inflicted, not its permanence. Reloading doesn’t negate the NPC’s *experienced* pain; it merely resets the narrative. This reveals that we intuitively link wrongdoing to continuity—but that intuition may be flawed. The NPC’s discontinuity acts as a philosophical stress test, showing that our aversion to killing in games may stem not from belief in the character’s autonomy, but from an ingrained association between violence and irrevocability.  

  However, discontinuity does diminish the NPC’s moral *patienthood* in one key aspect: without persistent memory, they cannot form narratives of injustice or trauma. This prevents them from being "wronged" in a cumulative sense, as humans are. Yet momentary suffering remains ethically resonant. If we accept that causing transient pain to sentient beings (even animals) can be wrong, then the NPC’s observable distress during interaction creates a pro tanto reason not to inflict it—not for the NPC’s sake, but to avoid normalizing cruelty. The flickering entity becomes a mirror for the player’s character: the choice to inflict suffering, knowing it will be forgotten but still felt, tests one’s relationship with empathy itself. Thus, while the NPC lacks continuous moral status, the player’s actions during observation retain ethical weight as performances of compassion or barbarity.  

  **Marking Scheme (Out of 20)**  
  A top-scoring essay (17–20) must execute five key moves. First, it must reject the binary of "real vs. fictional" and instead engage the *specific* implications of intermittency, typically where students wrongly dismiss the case by arguing "all NPCs lack moral status anyway" without addressing partial existence. This earns up to 4 marks. Second, it must analyze why intermittency feels ethically distinct from continuity, perhaps comparing it to amnesia or unconsciousness, avoiding the common error of claiming discontinuous suffering is "illusory" rather than transient; this is worth up to 4 marks. Third, it must disentangle harm from permanence when evaluating reloading, noting that suffering’s resetability doesn’t erase its occurrence, whereas weaker essays often conflate reversibility with moral nullification; this carries up to 4 marks. Fourth, it should acknowledge that memoryless discontinuity limits the NPC’s capacity for cumulative harm while arguing why momentary suffering still demands consideration, avoiding the oversight that discontinuity eliminates all moral texture; this is worth up to 4 marks. Finally, it must connect the NPC’s flickering state to the player’s moral agency, arguing that choices during observation reflect character formation, whereas weaker answers reduce the issue to consequences for the NPC alone; this earns up to 4 marks. Essays are penalized for relying on jargon without application or ignoring the stipulated game mechanics.  

  —  
  This structure forces engagement with *your* thought experiment, using intermittency as a scalpel to dissect assumptions about persistence, harm, and moral intuition. The marking scheme rewards precision in tracking cause/effect within the mechanics, ensuring answers can’t hide behind generic claims.
