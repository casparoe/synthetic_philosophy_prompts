answer: |-
  ### Philosophy of Probability Betting Game: Setup and Execution

  **Objective:** Make students feel the intuitive pull of weighting hypotheses by observer count (self-indication) without naming it, then reveal how this leads to the "presumptuous philosopher" problem. Use a coin-flip scenario with copies of observers and two scoring rounds to highlight the tension between betting behavior and belief.

  ---

  #### **Setup Before Class**
  1. **Materials**: 
     - Envelope with a fair coin (flip secretly before class; record result without revealing).
     - Betting slips (two colors: Round 1 white, Round 2 yellow).
     - Scoreboard (for aggregate results, not individual scores).
     - Calculator (for scaling in debrief).

  2. **Room Setup**: 
     - 18 students seated. Emphasize: "All rooms are identical, windowless, and indistinguishable. No communication during betting."

  3. **Narrative (Key Points to Stress)**:
     - "I flipped a coin secretly. If **heads**, only **one copy** of each of you exists. If **tails**, there are **twelve identical copies** of each of you. All copies share your memories and current perspective."
     - "You cannot tell if you’re the only copy or one of twelve. Focus on the payoffs—they’ll differ in each round."
     - "This isn’t about quantum duplication; it’s a thought experiment on how payoffs affect decisions."

  ---

  #### **Round 1: Total Sum of Copies**  
  **Instructions**:  
  > "Bet on the coin outcome (heads or tails) at even odds.  
  > **Scoring**:  
  > - If **heads** (1 copy of you):  
  >   - Correct bet: **+1 point**  
  >   - Wrong bet: **-1 point**  
  > - If **tails** (12 copies of you):  
  >   - Correct bet: **+12 points** (one point for each correct copy)  
  >   - Wrong bet: **-12 points** (one point lost for each wrong copy)  
  >   
  > *Example*: In tails, betting tails gives +12 because all 12 copies are right. Betting heads gives -12 because all 12 are wrong."

  - **Student Actions**:  
    - Write "H" or "T" on **white slips** (no names needed; anonymity reduces peer pressure).  
    - Collect slips, shuffle, and tally "H" vs. "T" bets on scoreboard.

  - **Expected Result**:  
    Most students bet **tails**. *Why?* Even with a fair coin, the potential +12 (tails) outweighs the -1 (heads). Expected value:  
    - Bet heads: \(0.5 \times 1 + 0.5 \times (-12) = -5.5\)  
    - Bet tails: \(0.5 \times (-1) + 0.5 \times 12 = 5.5\)  
    → Tails has a +5.5 edge. This mirrors the "pull" of self-indication: more copies = higher stakes.

  ---

  #### **Round 2: Average Across Copies**  
  **Instructions**:  
  > "Same bet, but new scoring:  
  > - **Always** paid the *average* outcome across your copies.  
  > - Correct bet: **+1 point** (regardless of heads or tails)  
  > - Wrong bet: **-1 point** (regardless of heads or tails)  
  >   
  > *Example*: In tails, betting tails gives +1 (average of 12 correct copies: +1 each). Betting heads gives -1 (average of 12 wrong copies: -1 each)."

  - **Student Actions**:  
    - Write "H" or "T" on **yellow slips**.  
    - Collect slips, tally bets.

  - **Expected Result**:  
    Bets split near 50/50. *Why?* Scoring is symmetric:  
    - Expected value for any bet: \(0.5 \times 1 + 0.5 \times (-1) = 0\).  
    → No edge. Self-indication "pull" vanishes when payoffs aren’t multiplied by copies.

  ---

  #### **Reveal & Immediate Discussion**  
  1. **Reveal the coin flip** (e.g., "It was heads!").  
  2. **Show Round 1 scores** (e.g., "Tails-betters: -12 each; Heads-betters: +1 each").  
  3. **Show Round 2 scores** (e.g., "Correct bets: +1; Wrong: -1").  

  - **Key Questions for Students**:  
    - "Why did everyone pile onto tails in Round 1? Did you learn the coin was biased?"  
      → *Expected answer*: "No, but losing 12 points in tails felt riskier than losing 1 in heads."  
    - "Why did bets change in Round 2?"  
      → *Expected answer*: "Gains/losses were the same in both worlds."  
    - "Is betting tails in Round 1 the same as *believing* tails? Or is it about the stakes?"  
      → Highlight tension: High stakes ≠ high credence.

  ---

  #### **Debrief: Mapping to Philosophy**  
  1. **Name the Concepts**:  
     - **Self-Indication Assumption (SIA)**: Weight hypotheses by number of observers. Round 1 payoffs mimicked this: you cared more about tails because it had more copies of "you."  
     - **Self-Sampling Assumption (SSA)**: Weight hypotheses as if randomly sampled from all possible observers. Round 2 used this: your payoff was the average for "a random copy of you," removing copy-count bias.  

  2. **The Presumptuous Philosopher**:  
     - Scale the thought experiment: "Suppose tails means \(10^{100}\) copies of you, not twelve. SIA says:  
       \[
       P(\text{tails}) = \frac{\text{Number of tails observers}}{\text{Total observers}} = \frac{10^{100}}{1 + 10^{100}} \approx 1.
       \]  
       You’d be >99.999...% sure the universe is astronomically large—*without any evidence*. Is that reasonable? Philosophers call this the **presumptuous philosopher** problem."  
     - Stress: "SIA isn’t 'believing' tails—it’s *weighting by observer count*. Round 1’s payoffs forced this weighting. But should your *credence* work this way? Many say no: it presumes facts about unobserved parts of the universe."  

  3. **Honest Nuances**:  
     - "The payoffs did heavy lifting. Round 1’s scoring isn’t a neutral measure of belief—it’s a *utility rule* summing over copies. In reality, you might care about average welfare (like Round 2) or total welfare (like Round 1). Philosophy debates which is right."  
     - "This doesn’t reproduce the existential weirdness of being one of many copies. We simulated it with payoffs, but true duplication might feel different."  

  ---

  #### **Predictable Challenges & Responses**  
  - **"There’s no fact about which copy I am!"**  
    → *Response*: "Exactly! That’s why SIA feels intuitive: if tails is true, ‘you’ could be any of the 12 copies. But note—Round 1 didn’t assume this. It just scaled payoffs by copies. The question is whether your *beliefs* should do the same."  

  - **"Why would I care about copies? I’m me!"**  
    → *Response*: "In Round 1, the rules *made* you care because payoffs were tied to copies. But if you reject this, you’re resisting SIA. That’s the core debate!"  

  - **Debrief Confusion**:  
    → Clarify: "SIA/SSA aren’t about what you *should do* in a bet. They’re about how observer count affects belief. Round 1 conflated the two; Round 2 separated them."  

  ---

  #### **Limitations of the Activity**  
  1. **No True Duplication**: Students don’t experience being one of many copies. We simulate it via payoffs, which misses the first-person tension.  
  2. **Belief vs. Action**: Students might conflate "betting tails" (pragmatic) with "believing tails" (epistemic). Stress this in debrief.  
  3. **Anthropic Reference Class**: We fixated on "copies of you," but real debates involve "all conscious observers" (e.g., aliens, AI). Not covered here.  

  This game creates an experiential hook for SIA’s intuitive pull and its extreme consequences. By separating scoring rules from belief, students confront why observer-count weighting feels compelling—and why it might be presumptuous.
