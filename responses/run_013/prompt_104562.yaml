prompt: |-
  I am a high school student working on an independent project about how institutions assign credit for discoveries, and I have reached a point where I can no longer tell what the institutions themselves assume. I would like you to reconstruct the theory of discovery that these practices presuppose, say whether it is coherent, and say what would have to change if it were replaced.

  The first institution is patent law, and three of its requirements matter here. First, an application must name the actual inventor or inventors; a patent is not granted to a laboratory, a company, or a committee as the author of the idea, and getting inventorship wrong can invalidate the patent later. Second, the claimed invention must be new — no one may have disclosed it already — and, as a separate hurdle, it must not be obvious, where obviousness is assessed from the standpoint of a person of ordinary skill in the field at the time the invention was made. Third, the law refuses to grant patents on laws of nature, natural phenomena, and abstract ideas as such, allowing claims only on particular applications of them. As for priority between competing applicants, it is now settled by who filed first: the United States abandoned its old first-to-invent rule only in 2013, so until very recently the law treated being the earliest inventor as the fact that mattered, and now treats being the earliest to file as the fact that matters.

  The second institution is the Nobel Prize, which cannot be shared by more than three people and is not awarded posthumously.

  What confuses me is how these rules sit with independent simultaneous discovery. Newton and Leibniz developed the calculus separately; Darwin and Wallace reached natural selection separately and arranged to present their results together rather than fight over them; something similar is recorded for oxygen, for sunspots, and for the telephone. If the next step in a field is routinely taken by several people within months of one another, then at a given moment that step seems to have been available to anyone with the relevant training — which is close to what the obviousness test says an invention must not be. Yet the same body of law insists that there is a determinate inventor, that this person can be identified after the fact, and that priority between near-simultaneous claimants can be adjudicated. The Nobel rules push the same way: a discovery that four people reached at once must still be compressed into at most three names.

  I would like answers to the following. (1) What view of discovery does this combination of rules presuppose — that discoveries are the achievements of particular individuals, that they are near-inevitable products of the state of a field, or some third thing? (2) Which rival views of discovery does the practice quietly rule out, and which does it leave open? In particular, does the requirement that the inventor be named commit the law to the view that discoveries are attributable to individuals, or could that rule be defended on other grounds? (3) Is the practice consistent with the phenomenon of simultaneous discovery, or does it require a picture of discovery that the phenomenon undermines? (4) The 2013 change in the priority rule: does first-to-file presuppose something different from first-to-invent about what priority tracks? (5) The patent system distinguishes discoveries, which cannot be owned, from inventions, which can. Does that distinction presuppose that discoveries are found rather than made, and does simultaneity threaten it? (6) If the inevitability thesis were taken seriously, what exactly would have to change — the patent system, the prize rules, the habit of attaching a single name to a law or a constant — and what could remain as it is?

  I am attached to keeping the practice, so I would like to know what it costs to defend it, and where the practice is underdetermined, in the sense that several different theories of discovery would license everything I have described.
reasoning: |-
  Okay, so I'm looking at this query from a high school student who's doing an independent project on how institutions assign credit for discoveries. They're confused about patent law and the Nobel Prize rules, especially how they handle simultaneous discoveries. Let me start by breaking down their questions.

  First, the student outlines patent law requirements: actual inventors must be named, the invention must be novel and non-obvious, and natural phenomena aren't patentable. Then there's the Nobel Prize's three-person limit and no posthumous awards. The student is puzzled because simultaneous discoveries like Newton/Leibniz or Darwin/Wallace seem to challenge the idea that inventions are non-obvious and attributable to specific individuals. They have six specific questions about the underlying theories of discovery these rules presuppose, consistency with simultaneity, the 2013 patent change, the discovery vs. invention distinction, and the implications of the inevitability thesis.

  I need to address each question systematically. Starting with question one: what view of discovery do these rules presuppose? Patent law's inventorship requirement and the Nobel's individual limits both emphasize individual achievement. But the non-obviousness test in patents suggests that inventions shouldn't be too obvious, which hints that the state of the field matters. So maybe it's a hybrid view where individuals are key, but the field's progress enables the discovery.

  For question two, the rules rule out strict inevitability because that would make everything obvious and unpatentable. But they leave room for inevitability in weaker forms. Naming inventors could be defended on practical grounds like incentive structures, not just attribution.

  Question three is about consistency with simultaneous discovery. The rules can handle it by prioritizing first filers or allowing joint credit where possible, but the Nobel's three-person limit forces exclusion, creating tension. So the practice sort of works but has friction.

  For the 2013 patent change (question four), first-to-file shifts focus from who invented first to who filed first, emphasizing disclosure over conception. It's more about administrative efficiency but still values individual contribution through filing.

  Question five: the discovery vs. invention distinction. Patent law treats discoveries as found (natural phenomena) and inventions as made (applications). Simultaneity might support the "found" aspect, but it doesn't threaten the distinction because patents protect applications, not the phenomena themselves.

  Finally, question six: if inevitability were taken seriously, patents might not be granted for incremental steps, Nobel Prizes might be awarded differently, and naming conventions could change. But some aspects, like rewarding effort, could remain.

  The student wants to keep the practices, so I should note that the rules are underdetermined—hybrid theories can justify them. The cost is historical inaccuracies and exclusion, but the benefits are incentives and practicality. I need to ensure each question is addressed clearly and that the analysis connects the legal and prize systems to the philosophical theories of discovery.
answer: |-
  Your analysis pinpoints a profound tension in how institutions reconcile individual achievement with the collective nature of scientific/technical progress. Here's a reconstruction of the presupposed theory, its consistency, and implications:

  ### (1) The Presupposed Theory of Discovery
  The rules presuppose a **hybrid "Convergent Individualism"**:
  -   **Individual Agency is Primary:** Discoveries/inventions are *acts* performed by specific individuals (or small teams), requiring unique insight, effort, and "flash of genius" (even if moderated by the "person of ordinary skill" standard). Credit *must* attach to specific humans.
  -   **Convergence is Contextual, Not Deterministic:** The "state of the art" creates fertile ground and defines the *problems* being solved, making simultaneous discovery *possible* and even likely for significant advances. However, the *actual solution* is not inevitable. The non-obviousness test acknowledges convergence (if it *was* obvious, many *would* have done it) but insists the *specific* solution wasn't a trivial next step *for anyone* at that exact moment. The field enables, but the individual(s) execute.
  -   **Discovery vs. Invention Distinction:** "Discovery" (finding pre-existing truths/natural phenomena) is distinguished from "Invention" (creating novel, useful applications *based on* or *embodying* those discoveries). Ownership is only possible for the latter.

  ### (2) Rival Views Ruled Out and Left Open
  -   **Ruled Out:**
      -   **Strict Inevitability/Whiggism:** The view that progress is purely deterministic, with discoveries *necessarily* emerging from the state of the field at a specific time. This is directly contradicted by the non-obviousness requirement and the insistence on identifying *specific* inventors. If discovery were truly inevitable, nothing would be non-obvious.
      -   **Radical Social Constructivism:** The view that discoveries are *entirely* products of social negotiation within a community, with no privileged individual contribution. Inventorship and the Nobel limit demand specific attribution.
      -   **Institutional/Corporate Primacy:** The view that institutions (labs, companies) are the true authors, not individuals. Patent law explicitly rejects this for inventorship.
  -   **Left Open/Compatible:**
      -   **Weak Inevitability:** The field sets the stage and makes certain discoveries highly probable, but specific timing and execution depend on individuals.
      -   **Collaborative Epistemology:** Discovery relies on building upon communal knowledge, *even if* credit is ultimately assigned to key contributors. The "person of ordinary skill" standard embodies this.
      -   **Defense of Naming Inventors:** This rule *can* be defended on **pragmatic grounds** independent of strict individualist epistemology:
          *   **Incentives:** To motivate individual effort and investment (personal and corporate).
          *   **Accountability & Transparency:** To clarify who owns the rights/responsibility.
          *   **Administrative Necessity:** Legal and prize systems need definite subjects for rights and awards. It's a practical solution, not necessarily a perfect ontological claim.

  ### (3) Consistency with Simultaneous Discovery
  The practice is **in tension but pragmatically functional**:
  -   **Patent Law:** Handles simultaneity through its priority rules (first-to-file now). If A and B independently invent simultaneously:
      *   Under first-to-invent: A meticulous lab notebook *might* prove A conceived it a day earlier.
      *   Under first-to-file: Whoever files first wins, regardless of who invented first. Simultaneity is resolved administratively.
      *   **The Strain:** Insisting on a single "inventor" (or small team) for something demonstrably "in the air" feels artificial. The non-obviousness test *acknowledges* the possibility of convergence but sets a bar *just high enough* that simultaneous discovery, when it happens, is seen as evidence the invention *wasn't* obvious *before* that critical moment. It's retrospective: "Because multiple people did it *now*, it *became* obvious, but it wasn't *before* they did it." This is logically shaky but functional.
  -   **Nobel Prize:** Handles simultaneity poorly. Forcing a discovery made by four into a three-person award necessitates exclusion, creating historical injustice (e.g., Rosalind Franklin and DNA). It actively *denies* the reality of simultaneous/convergent group effort beyond its arbitrary limit.

  ### (4) First-to-File vs. First-to-Invent (2013 Change)
  *   **First-to-Invent:** Presupposed priority tracks the **act of conception/reduction to practice** by a specific mind(s). It valued the *cognitive achievement* itself.
  *   **First-to-File:** Presupposes priority tracks the **act of disclosure/publication** (filing). It values **prompt sharing and administrative efficiency** over pinpointing the absolute first mental act. It implicitly acknowledges that proving the exact moment of conception is often messy and litigious. While still rewarding *an* inventor, it prioritizes the one who brings the invention to the system efficiently. It shifts focus slightly from the *origin* of the idea to its *introduction into the public domain*.

  ### (5) Discovery vs. Invention Distinction & Simultaneity
  *   **Presupposition:** The distinction presupposes discoveries (laws, phenomena) are **found** (preexisting, waiting to be observed), while inventions are **made** (new, human-created configurations/uses). Simultaneity *supports* the "found" nature of discoveries – multiple people can independently "see" the same truth. It does *not* inherently threaten the distinction.
  *   **Patent Impact:** Simultaneity *strengthens* the argument against patenting discoveries *as such* – if multiple people find the same law simultaneously, it underscores its preexisting, non-human-made nature. Patents rightly remain on the specific *applications* (inventions) derived from the discovery, even if those applications are also sometimes developed simultaneously. The non-obviousness test applies to the *application/invention*, not the underlying discovery.

  ### (6) If Inevitability Were Taken Seriously: Necessary Changes
  Adopting a strict inevitability thesis would force radical changes:
  1.  **Patent System:**
      *   **Non-Obviousness Collapses:** If the next step is truly inevitable given the field's state, *everything* becomes obvious. The non-obviousness requirement becomes meaningless.
      *   **Inventorship Blurs:** If the invention was destined to emerge, assigning credit to specific individuals becomes arbitrary. Patent grants might shift entirely to **first filer/organizer** or even the **institution funding the field**, losing the individual attribution link. Patents might only be granted for highly non-obvious leaps truly defying the field's trajectory.
  2.  **Nobel Prize (and similar awards):**
      *   Awards would need to recognize **fields or research collectives**, not individuals or small teams. The three-person limit would be indefensible. Prizes might go to labs, collaborations, or even entire sub-disciplines. Posthumous awards might be necessary to acknowledge contributions shaping the inevitable path.
  3.  **Naming Conventions (Laws/Constants):**
      *   The practice of eponymy (Boyle's Law, Hubble Constant) would fade. Names would reflect **descriptive or functional terms** (Law of Partial Pressures, Expansion Constant) or **institutions/locations** (e.g., "The 2025 CERN Resonance").
  4.  **What Could Remain (Partly):**
      *   **Patent's Novelty Requirement:** Even if inevitable, the *first* public disclosure still has value.
      *   **Patent's Utility Requirement:** Focus on useful application remains relevant.
      *   **Reward for Effort/Execution:** Systems could still reward the *first* or *best* execution/organization/publication of the inevitable step, even if the core idea wasn't uniquely individual.
      *   **Celebration of Discovery:** The cultural role of prizes/awards could continue, but focused on milestones achieved rather than individual genius.

  ### Defending the Practice: The Costs and Underdetermination
  *   **The Costs of Defense:**
      *   **Historical Inaccuracy:** Perpetuating the "lone genius" myth, downplaying collaboration and predecessors.
      *   **Injustice:** Excluding deserving contributors (Nobel limit, patent inventorship disputes, forgotten simultaneous discoverers).
      *   **Philosophical Tension:** Maintaining the hybrid "Convergent Individualism" requires accepting the awkward retrospective logic of non-obviousness ("It wasn't obvious until multiple people did it, then it was") and the administrative fictions used to assign priority/inventorship.
      *   **Stifling Collaboration:** Potential to discourage open sharing early in the process (especially under first-to-file).
  *   **Underdetermination (Where Multiple Theories Fit):**
      The *core practices* (naming inventors, awarding prizes to individuals/small teams, granting patents for applications) are **not uniquely determined by "Convergent Individualism."** They can also be justified by:
      *   **Pragmatic Institutionalism:** These are the most workable rules for complex legal/prize systems, regardless of the "true" nature of discovery. They create clear property rights, manageable awards, and identifiable heroes for public inspiration.
      *   **Incentive Theory:** Assigning credit/rights to specific individuals is the most effective way to incentivize the massive investment (time, money, intellect) required for progress, even if the discovery process is more collective or inevitable than the rules admit.
      *   **Weak Individualism:** While the field enables, the final crucial step *does* rely on identifiable individual insight and effort, justifying specific credit within the collaborative ecosystem.

  **Conclusion:** The institutions presuppose a theory ("Convergent Individualism") that prioritizes individual agency within a convergent field context. It is coherent *enough* to function but strained by simultaneous discovery, particularly the Nobel's inflexibility. While rival views like strict inevitability are ruled out, the *practices themselves* are underdetermined and can be defended on pragmatic and incentive grounds even if one acknowledges a stronger role for the field or collective effort. The cost of defense is historical simplification and occasional injustice, weighed against the benefits of clear incentives, workable administration, and cultural narratives celebrating human achievement. The 2013 patent shift highlights a move towards pragmatism (efficiency) over pure cognitive primacy, while the discovery/invention distinction remains robust against simultaneity. Taking inevitability seriously would dismantle key pillars of both patent law and prize systems, fundamentally altering how we attribute credit.
