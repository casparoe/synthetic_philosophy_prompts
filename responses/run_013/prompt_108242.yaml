     - *Question:* Are there precisely two players?  
     - *Test:* Count the players. If ≠2, fail.  
     - *What it does:* Confirms the game is two-player. Does not check for symmetry or fairness.  

  2. **Perfect information?**  
     - *Question:* Do players always know the entire game state? (No hidden information.)  
     - *Test:* Verify no secrets (e.g., no hidden cards or private boards). If hidden elements exist, fail.  
     - *What it does:* Ensures players have full knowledge. Does not guarantee symmetry.  

  3. **No chance?**  
     - *Question:* Is there no randomness? (No dice, card shuffles, or random events.)  
     - *Test:* Check rules for randomness. If any, fail.  
     - *What it does:* Confirms determinism. Does not prevent draws or asymmetry.  

  4. **Symmetric positions?**  
     - *Question:* If players swapped roles, would the game rules and starting position be identical?  
     - *Test:* Swap player labels (e.g., Player A ↔ Player B). Verify the board, moves, and win conditions are unchanged. If asymmetric (e.g., different starting resources), fail.  
     - *What it does:* Ensures no inherent advantage. Does not check for draws or move benefits.  

  5. **No draws?**  
     - *Question:* Must every game end with one player winning? (No draws possible.)  
     - *Test:* Confirm that terminal states always declare a winner. If rules allow a draw (e.g., full board with no win), fail.  
     - *What it does:* Prevents ambiguous outcomes. Does not imply a first-player win.  

  6. **Harmless extra stone?** (***Judgment call***)  
     - *Question:* Are moves irreversible placements of stones (or equivalent), and is having an extra stone of your color never harmful?  
     - *Test:*  
       - **Irreversible placements?** Moves must add pieces that cannot be moved/removed. If moves alter/remove pieces, fail.  
       - **Harmless extra?** Consider: "If I add my stone to any empty cell, could it block my own win, help my opponent, or turn a win into a loss?" If yes, fail.  
     - *Judgment rationale:* Depends on game rules. An extra stone must only help or be neutral (e.g., connecting paths in Hex). Harm occurs if it self-blocks or enables opponent wins.  

  ---

  #### Stopping Points  
  - **Return NO after any failed check** (steps 1–6).  
  - **Return YES only if all checks pass** (after step 6).  

  ---

  #### Judgment Calls  
  - **Step 6 (Harmless extra stone)** is a judgment call. It depends on:  
    - Whether moves are strictly additive (like placing stones).  
    - Whether game mechanics ensure an extra piece cannot backfire (e.g., self-sabotage).  
    - *Example:* In Hex, stones help connections; in Cornerstone, they might complete an opponent’s 2x2 block.  

  ---

  #### Application to Example Games  

  ##### (a) Hex  
  1. **Two players?** Yes.  
  2. **Perfect information?** Yes (board visible).  
  3. **No chance?** Yes (deterministic).  
  4. **Symmetric positions?** Yes (rhombus symmetry; swapping players mirrors the board).  
  5. **No draws?** Yes (draw impossible by design).  
  6. **Harmless extra stone?** **Yes** (extra stone connects more paths; never blocks self).  
  **Outcome: YES** (first player wins by strategy-stealing).  

  ##### (b) Cornerstone  
  1. **Two players?** Yes.  
  2. **Perfect information?** Yes (grid visible).  
  3. **No chance?** Yes (deterministic).  
  4. **Symmetric positions?** Yes (6x6 grid; same win condition for both).  
  5. **No draws?** **No** (draw possible if grid fills without a 2x2 block).  
  **Outcome: NO** (fails at step 5).  

  ##### (c) Passing Stones  
  1. **Two players?** Yes.  
  2. **Perfect information?** Yes (pile visible).  
  3. **No chance?** Yes (deterministic).  
  4. **Symmetric positions?** Yes (rules identical for both).  
  5. **No draws?** Yes (last-stone player loses; other wins).  
  6. **Harmless extra stone?** **No** (moves *remove* stones; extra stone = larger pile, which can force loss).  
  **Outcome: NO** (fails at step 6).  

  ---

  ### Limitations  
  1. **Silent misfires:**  
     - **Games with rare draws:** If draws are theoretically possible but never occur in practice, step 5 returns NO incorrectly.  
     - **Non-additive harm:** Step 6 may pass if harm is subtle (e.g., a stone that indirectly aids the opponent).  

  2. **Common mistakes:**  
     - Overlooking draws (step 5).  
     - Misjudging step 6 (e.g., assuming "extra move = always good" without verifying self-harm).  
     - Confusing symmetry (step 4) with fairness (e.g., assuming all symmetric games are fair).  

  3. **Undecidable questions:**  
     - **Who wins if NO?** The argument says nothing. The game could be a first-player win, second-player win, or draw.  
     - **Constructive strategies:** The argument never provides a winning strategy.  
     - **Game length/difficulty:** The argument gives no insight.  

  **Final Note:** If the argument returns NO, it does **not** mean the first player loses—it means the strategy-stealing proof fails. Use other methods (e.g., brute-force analysis) to determine the winner.  

