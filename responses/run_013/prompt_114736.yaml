prompt: |-
  I teach a second-year undergraduate module in metaphysics, and next month I have to give the session on whether a person could have come from a different sperm and egg — origin essentialism, and the arguments on either side of it. The topic has recently become awkwardly personal for me: my partner and I had a daughter last year using an egg from a donor, and since then I have been unable to stop turning over the counterfactual our own treatment made vivid, namely whether a different egg from the same cohort would have meant a different child, and what my strong sense that it would have is actually tracking.

  What I want from you is not an explanation. I can state the position myself, and I do not need sources or readings. I want a plan for teaching it in seventy-five minutes to twenty-five students who have had one session on personal identity, no exposure at all to modal notions, and a firm prior that this is a question about biology, or about destiny, rather than about necessity.

  So, first, the order: what has to be in place before the thesis even sounds like a thesis, and why each step depends on the one before it — which of the components (the gap between a thing's properties and its identity conditions; the idea of varying an individual rather than varying a world; the difference between what is causally settled and what is metaphysically necessary) can be presupposed at this level and which cannot. Second, the carrying example. The two I keep reaching for are an artifact case — a thing made from a different lump of matter, or the same lump differently arranged — and the well-worn case of a person of famous parentage asked whether they could have been born to a different couple. I suspect neither does the work I need. Tell me which, if either, earns its place, what the carrying example must have that they lack, and whether the donor-gamete case, or the neighbouring cases of children conceived with a third party's mitochondria or chosen from a cohort of embryos, should carry the session or would only turn it into bioethics. Third, the misconception map: I predict they will hear the thesis as fatalism, as a claim about which sperm in fact won the race, as a claim about genes rather than about individuals, and as a religious claim about souls. Where in the sequence should each of those be headed off, and what am I failing to anticipate? Fourth, the personal problem: my own family is the most vivid example available to me, and I do not trust my judgment about whether to use it. Is it a mistake, and what does it cost if it is? Fifth, what should I openly decline to explain at this level, and say that I am declining? And finally, one question to put to them at the end that would separate a student who has grasped the modal claim from one who has merely learned the slogan.
reasoning: |-
  Okay, the user is teaching a metaphysics module and needs a lesson plan on origin essentialism, specifically whether a person could have come from a different sperm and egg. But there's a personal layer here—they used a donor egg for their daughter, making the topic emotionally charged. They need a structured 75-minute plan for undergrads with minimal background. 

  First, the challenge: Students likely confuse metaphysical necessity with biology or destiny. The user wants to avoid turning this into bioethics but needs a relatable example. The artifact and famous-parent cases might not cut it because they don't capture the "this specific material origin" angle. The donor-gamete case is powerful but risky—it could derail into ethics or feel too personal. 

  Breaking down the steps: 
  Students need to grasp modal concepts first. Start with possible worlds as alternate scenarios, not sci-fi. Then distinguish causal necessity ("this sperm had to win the race") from metaphysical necessity ("this person couldn't arise from other gametes"). Use concrete examples—like a statue made from different clay—to show identity dependence on origin. 

  For the carrying example: The artifact case (clay statue) works better than famous parents because it isolates material origin from social factors. But it lacks the "biological uniqueness" pull. The donor-gamete case is ideal if handled carefully—frame it as a thought experiment, not a bioethics debate. Preempt misconceptions by stressing: "We’re not asking about destiny or genetics, but whether identity is tied to these specific cells." 

  Misconceptions: Students will hear "fatalism" or "genes = identity." Tackle these early. When introducing Kripke, explicitly contrast metaphysical necessity with determinism: "Necessity isn’t about what had to happen, but what’s possible in other worlds." 

  Personal dilemma: Using their story humanizes the topic but risks oversharing or bias. Solution: Introduce it late, hypothetically ("Suppose a family used a donor egg..."), then reveal it’s their experience. This keeps focus on philosophy while honoring the emotional weight. 

  What to skip: Deep dives into transworld identity or haecceities. Say: "We’re bracketing advanced debates about 'thisness'—focus on the core intuition." 

  Final question: "Could Queen Elizabeth have been born to different parents?" A student who gets it will say no and explain via origin essentialism; one who doesn’t might cite genetics or destiny. 

  The user’s expertise is clear—they’re wrestling not with the material but how to teach it ethically. Their vulnerability about their family is a strength if framed as philosophical curiosity, not confession. The lesson’s success hinges on making modality tangible without reducing it to biology. And avoiding the trap where students think this validates "genetic destiny"—emphasize it’s about individuation, not determinism.
answer: |-
  Here’s a structured 75-minute lesson plan focused on clarity, scaffolding, and avoiding common pitfalls, tailored to your constraints and concerns:

  ---

  ### **1. Sequencing the Core Concepts** (25 mins total)  
  **Goal:** Build the modal foundation without jargon.  

  | Step | Content | Time | Why/Notes |
  |------|---------|------|-----------|
  | **A** | **Start with concrete identity:** Ask, "What makes *this* lectern *this* lectern?" Elicit answers (material, origin, function). Contrast: "If I replaced one screw tonight, is it the same lectern tomorrow?" (Yes). "If I burned it and rebuilt an identical one from new wood?" (No). **Key:** Introduce "identity over time" vs. "what makes something *this* thing." | 5 mins | Uses familiar objects to separate properties from identity conditions. |
  | **B** | **Introduce counterfactuals simply:** "Could *this lectern* have been made from different wood? Not 'a similar lectern'—*this one*." Use a map: "Imagine alternative histories: same carpenter, same design, but oak instead of pine. Is it numerically identical?" | 7 mins | Avoids "possible worlds" language. Focuses on re-identifying *this* object across scenarios. |
  | **C** | **Causal vs. Metaphysical Necessity:** "In our world, this lectern *had* to be pine (causally, given the carpenter's choices). But is it *impossible* for *this very lectern* to be oak? That’s a different question." Use a die: "It landed on 3, but *could* it have landed on 4? Yes. Could it have been a *different die*? No." | 8 mins | Distinguishes "could have happened differently" from "could this thing have been different." |
  | **D** | **Transition to persons:** "What about humans? What makes *you* *you*? If your parents never met, would *you* exist? Or someone else?" | 5 mins | Sets up origin essentialism as a live question, not dogma. |

  ---

  ### **2. Choosing the "Carrying Example"** (20 mins)  
  **Why the artifact case earns its place:**  
  - **Strengths:** Isolates material origin from biology/destiny. "Could *this* clay statue (point to actual object) have been made from different clay?" forces focus on matter vs. "thisness."  
  - **Weaknesses:** Artifacts have functional identity; persons do not.  

  **Why famous-parents case fails:**  
  Students hear it as about social identity ("Could Obama have been raised poor?") not metaphysical origin.  

  **The donor-gamete case—handled carefully:**  
  - **Use it late in the sequence** (after artifacts), framed as a *philosophical puzzle*, not bioethics:  
    > "Medical technology lets us ask: If a child is conceived from donor gametes, could *that very child* have come from a different egg in the same cohort? Or would it be a different individual?"  
  - **Why it works:** It’s precise (same sperm, different egg), vivid, and distinguishes genetics from numerical identity.  
  - **Mitigate bioethics diversion:** Preface with, "We’re asking a metaphysical question—not about ethics, destiny, or 'real' parentage."  
  - **Placement:** After artifacts, as a bridge to persons.  

  ---

  ### **3. Misconception Map & Preemption**  
  | Misconception | When to Preempt | Response |
  |---------------|-----------------|----------|
  | **Fatalism/Determinism** | During causal vs. metaphysical distinction (Step C) | "This isn’t about whether events *had* to happen. It’s about whether *this thing* could exist in a different scenario." |
  | **"Which sperm won?"** | Transitioning to persons (Step D) | "Even if a different sperm fertilized the egg, would it produce *you*? Or a sibling?" |
  | **Genetic reductionism** | Introducing donor case | "Genes determine traits, but we’re asking if changing the gametes changes *who* is here—not just what they’re like." |
  | **Soul/religious claim** | Opening Q&A | "We’re working in a materialist framework. Assume no souls; does origin still matter?" |
  | **Unanticipated pitfall:** Confusing "could have existed differently" with "could have been born at a different time." | During counterfactuals (Step B) | Use a birthday example: "Could *you* have been born tomorrow? No—that would be a different life history." |

  ---

  ### **4. The Personal Dimension: To Share or Not?**  
  - **Don’t open with it.** First, establish the philosophical problem impersonally.  
  - **If used, deploy late:** After analyzing artifacts and donor cases hypothetically, say:  
    > "This question became vivid for me because my daughter was conceived with a donor egg. My instinct says a different egg would mean a different child. But is that tracking a biological fact, a metaphysical truth, or something else? That’s why I find Kripke’s view compelling—but you might disagree."  
  - **Costs:** Risks emotional weight overshadowing analysis, or students feeling unable to critique. **Benefits:** Models philosophical relevance to life. **Verdict:** If you share, keep it brief, late, and tie tightly to the argument.  

  ---

  ### **5. What to Explicitly Omit**  
  State early:  
  - "We’re bracketing whether origins include *only* gametes (vs. womb, environment, etc.)."  
  - "We won’t resolve how this fits with theories of personal identity (e.g., psychological continuity)."  
  - "We’re simplifying Kripke; no time for haecceities or transworld identity debates."  

  ---

  ### **6. The Closing Question**  
  **"Could Queen Elizabeth have been born to different parents in 1926, if all her traits (personality, appearance, etc.) were identical?"**  
  - **Grasped modal claim:** "No—different parents mean a different person, even if qualitatively identical."  
  - **Slogan-learning:** "Yes, if the genes matched" (confuses traits with identity) or "No, because destiny" (slips into fatalism).  

  ---

  ### **Timeline Summary**  
  - **0-25 mins:** Scaffold concepts (Identity → Counterfactuals → Necessity).  
  - **25-45 mins:** Analyze artifact case, then donor-gamete case as puzzle.  
  - **45-60 mins:** Student debate on Queen Elizabeth question + misconceptions.  
  - **60-75 mins:** Synthesize Kripke’s view; *optional* personal note; closing Q.  

  **Core Principle:** Anchor every abstract move in an intuitive example. Your donor experience sharpens the question—but let students discover the tension *before* revealing its personal stakes.
