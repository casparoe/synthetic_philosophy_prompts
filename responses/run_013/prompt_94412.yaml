  I'll make sure each leaf has a clear name based on its claims, and note what each struggles to explain. For example, the asymmetry position will have trouble with cases like (a) where creating a worse-off person might not seem wrong, while standard person-affecting views struggle with the nonidentity problem cases like (b).

