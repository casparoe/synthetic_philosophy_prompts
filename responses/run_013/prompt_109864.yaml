prompt: |-
  I'm trying to put together a proposal for a little internal grant our department runs — six months, a bit of money, and the deliverable is basically a 15–20 page working paper — and I've got a half-formed idea I'd like you to turn into something presentable. The literature on civil disobedience always seems to get stuck on the same two questions: when is it justified, and what makes it 'civil' in the first place — public, nonviolent, willing to take the punishment, addressed to the majority's sense of justice. I keep thinking the second question is where the action is, and that it's been framed wrong. Everyone treats the point of the disobedient act as persuading the political community: appealing to its sense of justice, bringing an injustice to its attention. But a lot of the disobedience that actually mattered wasn't trying to persuade anyone in power at all — it was trying to change the facts on the ground so the unjust arrangement couldn't keep running. Sit-ins that made segregation unenforceable, blockades that made a project too expensive to finish, strikes that made a workplace unusable. I've been calling this the difference between persuasion and prefiguration, or between talking to the powerful and acting on the world. If you take that seriously, the civility criteria start to look like they were built to protect the wrong thing: publicity and nonviolence make sense if your aim is to move a majority, but if your aim is to change the facts, anonymity and disruption can be features rather than bugs — and even the prior question of whether there's a general duty to obey the law shifts, because the answer might depend on which of the two games you're playing.

  So: write me the proposal. I want (a) the question stated precisely enough that it has a determinate answer — my stab is something like 'does the justification of civil disobedience depend on its being addressed to the political community, or can it rest entirely on what the act does to the world?', but sharpen it or replace it if you can do better; (b) an account of why the going positions — the appeal-to-justice line, the fair-play line, the deliberative-democracy line — leave this open instead of settling it; (c) what I'd actually do over six months, in some roughly month-by-month form, and why that method rather than just sitting down and writing a conceptual essay; (d) what would count as the project failing, or as the question turning out to be ill-posed; and (e) an honest verdict on whether this is six months of work or the seed of a dissertation I'm pretending is small.

  Don't give me a reading list or citations — I'll add those myself, and honestly I care more about whether the question is worth the money than about who's said what. What I do want is for you to push back: if the persuasion/prefiguration distinction collapses (maybe changing the facts is just a slow, indirect way of persuading), tell me so, and tell me what the better cut would be. And keep in mind this is going to a departmental audience that's allergic to anything that smells like old arguements re-described in new words.
reasoning: |-
  Okay, the user is putting together a grant proposal for a working paper on civil disobedience. They want to challenge the traditional focus on justification and the "civility" criteria, arguing that much effective disobedience isn't about persuasion but about materially disrupting unjust systems. 

  Hmm, their core frustration is spot-on - the literature does obsess over when disobedience is justified and what makes it "civil," while overlooking how some acts work by changing material realities. Their persuasion/prefiguration distinction feels fresh but needs tightening. "Prefiguration" might confuse people since it usually refers to embodying future societies. "Material disruption" or "tactical refusal" would be clearer. 

  The user's self-awareness is impressive - they explicitly want pushback and worry about just rebranding old arguments. Good instincts. The distinction could collapse if we view disruption as just indirect persuasion, but that feels like stretching the meaning of "persuasion" too far. Better to frame it as two distinct logics: one communicative, the other operational. 

  For the proposal structure, they've outlined exactly what they need: a sharp question, critique of existing theories, realistic work plan, and exit strategies. The dissertation seed question is smart - this could easily balloon, but framing it as testing a hypothesis keeps it contained. 

  Their departmental audience's allergy to jargon means we should avoid trendy terms. Focus on concrete examples like lunch counter sit-ins making segregation unsustainable through operational paralysis, not persuasion. That's the hook - showing how civility criteria protect systems by demanding disobedience play by rules that favor the powerful. 

  The work plan should emphasize historical case analysis first to ground the theory. If they jump straight into conceptual work, it'll sound like armchair philosophy. Month 4's "strain test" is crucial - that's where they prove this isn't just semantics by showing how existing frameworks can't explain cases like anonymous digital disruptions. 

  Biggest risk? The question might be ill-posed if all material disruption secretly aims at communication. But the Montgomery Bus Boycott targeted economics while sit-ins attacked functionality - both created new facts on the ground. That's the pivot: sometimes disobedience speaks, sometimes it just breaks things. 

  Honest verdict: this is a solid six-month project if they resist scope creep. The dissertation potential is there in comparing historical/material vs digital tactics, but that's phase two. For now, the working paper can plant a bomb under the civility discourse - which is exactly what their department needs.
answer: |-
  Here’s a streamlined proposal centered on your core insight, designed to sidestep semantic debates and target the operational heart of disobedience. I’ve tightened the framing, incorporated pushback, and focused on feasibility:

  ---

  **Project Title:** Beyond Appeal: Civil Disobedience as Tactical Refusal and the Reconfiguration of Political Agency  

  **Core Question:**  
  *Does the moral justification of civil disobedience require that the act function primarily as an appeal to the conscience or deliberative capacity of the political community, or can it rest solely on the act’s capacity to materially disrupt or reconfigure an unjust status quo?*  

  **Why This Question Matters (The Gap):**  
  Existing frameworks implicitly privilege the "persuasion model," shaping the criteria for "civility" and justification:  
  1.  **Appeal-to-Justice (Rawls, Dworkin):** Demands publicity, nonviolence, and acceptance of punishment to facilitate moral dialogue with the majority.  
  2.  **Fair-Play (Simmons, Smith):** Focuses on the disobedient's fidelity to communal norms of reciprocity, requiring acts be "answerable" to the community.  
  3.  **Deliberative-Democratic (Habermas, Celikates):** Sees disobedience as a corrective to failed deliberation, necessitating public, reason-giving acts.  

  **These frameworks leave the question open because:**  
  *   They **assume** that disobedience’s legitimacy *must* derive from its communicative relationship to the sovereign/community.  
  *   They struggle to **categorize or justify** actions whose efficacy and intent lie in operational disruption (making a policy unworkable) rather than moral suasion.  
  *   They render tactics like anonymous digital disruption, covert sabotage (where non-violent but hidden), or strikes focused purely on economic paralysis as either *non-civil* or *unjustifiable* disobedience, potentially misdiagnosing their political logic.  

  **Pushback Addressed & Refinement:**  
  *   **"Isn't disruption just indirect persuasion?"** This stretches "persuasion" beyond recognition. Blockading a pipeline to bankrupt it aims to *stop* the project, not convince shareholders it’s immoral. The primary mechanism is material, not discursive. The distinction is **target (conscience vs. operational capacity) and mechanism (argument vs. material interference)**.  
  *   **"Prefiguration" vs. "Refusal/Tactical Disruption":** "Prefiguration" often implies building alternatives. Your focus is on *disabling* the unjust system. "Tactical Refusal" or "Operational Disruption" is sharper. **Key Insight:** Civility criteria (publicity, nonviolence, acceptance of punishment) protect the *system's operational stability and its monopoly on legitimate discourse*. Disobedience aiming at disruption challenges this monopoly directly.  
  *   **"Isn’t this just uncivil disobedience?"** The project forces the question: If an act effectively disables an injustice non-violently, but anonymously, *why* should publicity be a necessary condition for *moral* justification if persuasion isn’t the goal? This reframes "civility" as potentially system-serving.

  **Methodology & Work Plan (6 Months):**  
  *Why not just write?* This needs grounding in real-world tactics to avoid abstraction and demonstrate the gap in existing theory. Historical/comparative case analysis provides concrete evidence of the distinct logic.  

  *   **Month 1: Conceptual Groundwork & Case Selection:**  
      *   Define core concepts: "Persuasion Model" (PM) vs. "Operational Disruption Model" (ODM).
      *   Select 4-6 diverse historical cases where PM explanations seem inadequate (e.g., Lunch Counter Sit-ins (disruption of service), Anti-nuclear/Environmental Blockades (economic/operational cost), Digital Activism (DDoS, leaks - anonymity/disruption), Wildcat Strikes (pure work stoppage)).
  *   **Month 2: PM Framework Analysis:**  
      *   Rigorously apply the dominant PM frameworks (justification + civility) to each case. Document where they fit poorly, require contortions, or condemn effective actions. *Identify the friction.*
  *   **Month 3: Developing the ODM Framework:**  
      *   Analyze the selected cases through the ODM lens: What was the *material target*? What *operational mechanism* was exploited (economic cost, logistical paralysis, loss of functionality)? How did publicity/anonymity/violence/non-violence factor into *tactical success*?
      *   Draft core ODM justification criteria: e.g., Necessity/Proportionality of disruption, non-violence (maintained? Why?), target legitimacy, feasibility of success.
  *   **Month 4: Comparative Analysis & Strain Test:**  
      *   Systematically compare PM vs. ODM explanations for each case. Does ODM offer a more coherent account of intent, tactics, and justification?
      *   Strain test: Does ODM justify *too much*? Where are its limits? Does it inadvertently endorse violence? (Crucial for robustness).
  *   **Month 5: Implications & Reframing:**  
      *   Re-examine "civility": Argue its criteria often serve system stability, not justice. Propose context-dependent criteria (e.g., publicity matters for PM acts, anonymity/disruption may be functional for ODM).
      *   Reconsider the duty to obey: Might it weaken significantly when law upholds operations causing grave injustice, especially if persuasion is futile?
  *   **Month 6: Synthesis & Drafting:**  
      *   Integrate findings into the working paper. Clearly articulate the PM/ODM distinction, its grounding in cases, its challenge to orthodoxy, and revised criteria for justification/civility based on intent and mechanism.

  **Deliverable:**  
  A 15-20 page working paper, suitable for submission to a political theory/political philosophy journal, presenting the PM/ODM distinction, its empirical basis in case studies, and its theoretical implications for justifying disobedience and rethinking "civility."

  **Risks & Failure Conditions:**  
  *   **Ill-Posed Question:** Risk if *all* disobedience can be convincingly reinterpreted as ultimately persuasive (even indirectly). *Mitigation:* Focus on *primary intent and immediate mechanism* in cases. If the distinction collapses, the paper becomes a critique of that collapse as a theoretical blind spot.  
  *   **Project Failure:**  
      *   Cases don't clearly support the ODM logic (e.g., persuasion always seems present).  
      *   ODM criteria prove indistinguishable from simple consequentialism or cannot exclude morally repugnant tactics.  
      *   The distinction feels semantic, not substantive, to readers ("old wine, new bottles"). *Mitigation:* Rigorous case selection focusing on acts *least* explicable by PM; clear articulation of the differing logics of agency (speaking vs. doing).  
  *   **Insufficient Scope:** Finding the historical/empirical grounding takes longer than expected, forcing superficial case treatment.

  **Honest Verdict on Scope:**  
  This is a **viable and focused 6-month project** *if* tightly scoped as proposed. It’s testing a specific hypothesis (the PM/ODM distinction) using a manageable set of cases to challenge an existing theoretical paradigm. The deliverable is a working paper, not a definitive treatise.  

  **However, it’s undeniably a dissertation seed.** The core distinction opens vast avenues:  
  *   Deep dives into specific movements (labor, environmental, digital).  
  *   Philosophical work on political agency, violence/non-violence, legitimacy.  
  *   Comparative analysis across political regimes.  
  *   The relationship between ODM and revolution, sabotage, or "uncivil" resistance.  

  **The key for the grant is framing this project as the essential *first step*:** proving the distinction's plausibility and value through concrete analysis, clearing the ground for future larger work. It’s not *pretending* to be small; it’s a *deliberately bounded* investigation of a novel and potentially significant critique of the dominant paradigm. It asks: "Does this lens reveal something important that the old lens obscures?" The answer might be "yes," "no," or "partly," but any outcome provides valuable insight.

  ---
  **Strengths for your Departmental Audience:**  
  *   **Problem-Driven:** Starts with a limitation in the literature ("stuck on the same two questions").  
  *   **Conceptually Sharp:** Clear PM/ODM distinction focused on *mechanism* and *target*, not just synonyms.  
  *   **Empirically Grounded:** Methodology relies on analyzing real cases to test the theory, avoiding pure armchair philosophy.  
  *   **Critical Edge:** Directly challenges potential biases in existing "civility" norms.  
  *   **Feasible:** Clear, staged work plan with identifiable milestones and a concrete deliverable.  
  *   **Honest Scope:** Acknowledges the larger potential while justifying the 6-month focus.  

  This proposal presents your "half-formed idea" as a targeted intervention with the potential to reframe a stagnant debate. Good luck!
