  Looking at their five points: "deterministic but unpredictable" distinction, shadowing, explanation vs prediction, computational irreducibility, and indeterminism vs epistemic limits. I need to assess which are substantive and which are overrated. For instance, the deterministic/unpredictable distinction is fundamental but might be well-trodden. Shadowing is technical but has practical implications. Computational irreducibility ties into Wolfram's work, which is debated but relevant to their software background.

