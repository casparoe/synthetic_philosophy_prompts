  ## The Utilitarian Review
  **Volume CXLII, No. 3** | *Est. 1824 by the Ghost of Jeremy Bentham (Perpetually Disappointed)*

  ---

  **PROSPECTUS AND RULES OF ASSOCIATION FOR THE EXPERIMENTAL COMMUNITY OF NEW HARMONY II**  
  *(An Undertaking Conducted on Strictly Rational & Progressive Principles)*  
  **Prepared by M. Aloysius Thistlebottom, Esq., Consulting Agent for Progressive Communities**

  **PREAMBLE**

  Whereas the present system of industrial organization is demonstrably suboptimal, tending towards the concentration of wealth, the degradation of labour, and the sacrifice of individual development to the mere accumulation of capital; and

  Whereas the principles of co-operation, grounded in justice and enlightened self-interest, offer the most promising avenue for securing the greatest happiness for the greatest number; and

  Whereas the late Mr. J.S. Mill, that eminent philosopher and friend of rational progress, while expressing profound sympathy for the socialist ideal, prudently identified several potential pitfalls requiring circumspection lest the remedy prove worse than the disease; and

  Whereas the undersigned, acting as Consulting Agent, has diligently studied the aforementioned caveats and believes they can be satisfactorily addressed through carefully calibrated mechanisms embedded within the foundational structure of the Association;

  Now, therefore, be it known that the Experimental Community of New Harmony II (hereinafter "The Association") is hereby established upon the following Principles and Rules, designed to secure the benefits of collective endeavour while scrupulously preserving those conditions essential to individual liberty, spontaneous development, and the perpetual advancement of human well-being:

  **RULES OF ASSOCIATION**

  1.  **Objects:** The primary object of the Association is to demonstrate, through practical experiment, the feasibility and superior desirability of a system of common ownership of the instruments of production (excluding strictly personal effects), combined with the equitable distribution of the fruits of labour, all conducted with the paramount aim of fostering the intellectual, moral, and physical development of every member to their highest attainable standard.

  2.  **Land & Unearned Increment:**  
      a. The land upon which the Association settles shall be held in common perpetuity.  
      b. An annual valuation shall be conducted by an Independent Land Valuator (appointed by rotation from among members possessing actuarial training) to determine the *rental value* attributable solely to the land's inherent fertility, location, and natural advantages, excluding all improvements wrought by Association labour.  
      c. This determined "Pure Land Rent" shall constitute the **Unearned Increment**, accruing to the common fund as a sacred trust representing society's collective ownership of the raw globe. Improvements remain the property of the Association.  
      d. Members are expressly forbidden from speculating on the future value of surrounding lands; such activity betrays a regrettable preoccupation with the merely pecuniary.

  3.  **Individual Spontaneity & Experiments in Living:**  
      a. The Association recognizes that human felicity and progress depend materially upon the diversity of character and the freedom of individuals to pursue their own conceptions of the good life, provided such pursuits do not demonstrably injure others.  
      b. To this end, members shall be guaranteed no less than three full days per week, and four hours per working day, entirely free from communal labour obligations for the pursuit of private study, artistic endeavours, eccentric vegetable cultivation, quiet contemplation, or other activities deemed conducive to individual development.  
      c. Sub-committees of not fewer than five nor more than seven members may petition the General Council for resources to establish limited-scale "Experiments in Living" (e.g., vegetarian communes within the commune, trial marriages based on novel principles, experimental hat-making techniques), subject to bi-annual review for utility and lack of palpable nuisance. Uniformity, unless demonstrably the most efficient path to a universally desired end, is deprecated.

  4.  **Remuneration & Incentives:**  
      a. Absolute equality of remuneration is acknowledged to be both impracticable and unjust, potentially extinguishing the vital spark of exertion required for progress.  
      b. A base stipend, sufficient for comfortable subsistence, shall be provided equally to all members performing their assigned duties.  
      c. A variable **Merit Increment**, not exceeding 33.3% of the base stipend, shall be distributed annually based on:  
          i. Quantifiable output in designated roles (e.g., bushels of wheat threshed, yards of cloth woven, pupils satisfactorily instructed).  
          ii. Distinguished merit in pursuits enhancing the Association's intellectual or aesthetic standing (as determined by a rotating Jury of Peers, whose decisions may be appealed to a Sub-Committee on Distinction).  
          iii. Willingness to undertake necessary but disagreeable tasks (rated on a standardized scale of Agreeability Deficiency).  
      d. The specific formula balancing these factors shall be reviewed quinquennially by a Committee on Motivational Equilibrium to prevent either undue levelling or the emergence of an aristocracy of labour.

  5.  **Governance & The Tyranny of the Majority:**  
      a. Despotism, whether of capital or of public opinion, is an unmitigated evil.  
      b. The General Council, elected annually by secret ballot of all members over the age of 25, shall manage the common affairs of the Association.  
      c. Crucial protections against the "Despotism of Society" are instituted:  
          i. A **Council of Elders** (composed of members over 60 who have authored at least one treatise or perfected a significant horticultural technique) shall possess a suspensive veto over any Council measure deemed by three-quarters of their number to threaten fundamental individual liberties or stifle salutary eccentricity.  
          ii. Any member may publish dissenting views in *The New Harmony Rational Recorder* (a thrice-weekly broadsheet) without fear of censure, provided critiques are offered in temperate language and accompanied by constructive alternatives. Vituperation will be penalized by temporary suspension of library privileges.

  6.  **Position of Women:**  
      a. Recognizing the paramount importance of perfect equality between the sexes as the cornerstone of any truly progressive society, the Association guarantees:  
          i. Identical rights, obligations, suffrage, and eligibility for office to all members regardless of sex.  
          ii. Equal access to all occupations and training within the Association.  
          iii. Shared responsibility for domestic duties according to a rota system designed by a Joint Committee on Household Efficiency.  
      b. *Note:* The Association assumes that, freed from economic dependence and irrational prejudice, women will naturally gravitate towards roles for which their distinctive physiological constitution and cultivated sensibilities render them particularly suitable, thereby optimizing overall social harmony. This is understood as a matter of rational differentiation, not inequality.

  7.  **Nature of the Experiment & Future Prospects:**  
      a. New Harmony II is explicitly constituted as an **Experimental Community**, not a dogmatic blueprint for universal application. Its success is to be judged by its fruits in human development and happiness, rigorously documented.  
      b. The Association solemnly declares itself **Probationary**, not Final. Its structure incorporates mechanisms for its own potential dissolution or radical transformation should experience demonstrate superior models, or should the wider society advance sufficiently to render such isolated experiments unnecessary. A quinquennial **Commission on Perpetual Progress** shall assess the Association’s continuing utility and recommend amendments or termination.  
      c. Under no circumstances shall the Association seek to impose its model coercively upon the outside world. Persuasion, example, and the irrefutable logic of superior outcomes are the only permissible instruments of propagation.

  **Signed and Sealed,**  
  *M. Aloysius Thistlebottom, Esq.*  
  *Consulting Agent for Progressive Communities*  
  *London, October 1870*

  ---

  **Author's Note (M. Aloysius Thistlebottom):**

  This Prospectus aims to embody the *spirit* of Mill's late, cautious engagement with socialism, particularly his emphasis on liberty, experimentation, and gradualism found in the *Chapters on Socialism*, *Autobiography*, and LTRA writings. Key liberties taken include:

  1.  **Amplification of Tensions:** The Rules deliberately inflate the practical tensions Mill identified (e.g., merit vs. equality, majority tyranny safeguards) into elaborate bureaucratic mechanisms, satirizing the potential for well-intentioned complexity to undermine liberty. Mill hoped for simpler resolutions through moral progress.
  2.  **"Probationary" Socialism:** While Mill saw socialism as a possible future stage requiring careful testing, he wasn't definitively committed to it as the *only* or final destination. The Prospectus presents "Probationary Socialism" as the Association's core identity, leaning towards Mill’s sympathetic speculation rather than his agnosticism.
  3.  **Women's Roles:** Clause 6b subtly reintroduces essentialism under the guise of "rational differentiation." Mill's mature feminism (*The Subjection of Women*) argued vehemently against *any* legal or social presumption of inherent differences dictating roles; true equality meant absolute freedom of choice. This clause satirizes the gap between formal equality and lingering Victorian assumptions Mill himself largely rejected.
  4.  **Land Valuation Complexity:** Mill advocated capturing the unearned increment via taxation (like the LTRA's proposals). The Prospectus's cumbersome "Pure Land Rent" valuation satirizes the immense practical difficulty of cleanly separating land value from improvement value in a cooperative setting, a problem Mill acknowledged but perhaps underestimated.

  **Wrong Target?** If Mill primarily feared socialism as inherently *totalitarian* or *economically inefficient*, this satire misses the mark. His core worry was that poorly designed socialism might stifle individuality *despite* its economic potential. The satire targets his struggle to reconcile socialist ideals with liberal principles, not a belief that socialism was intrinsically doomed. If Mill saw cooperatives *only* as temporary schools for capitalism, not potential viable alternatives, the joke would be misplaced. The evidence suggests he held a more open, albeit critical, view.
