     - Stop: you buy the item (always available) but because of the time spent and because the item is not as deeply discounted as at A (or because you are in a hurry), the net gain is $3.
     - Skip: you leave without the item, net gain $1 (because you saved time and can do something else).

  The aisles look identical, and you are absent-minded, so you can't remember which aisle you are in or whether you've been to one already. You decide in advance on one strategy: at each aisle, you will stop with probability p and skip with probability 1-p, and you use the same p at whichever aisle you are at.

  The best p is (4q+1)/4. With q=1/2, p = (4*(1/2)+1)/4 = (2+1)/4 = 3/4.

  Arithmetic for the expected value: as above.

  Now, the three parts:

  1. What if someone reasons one decision at a time: "I'm standing here, is it better to stop or to go on?"

     They would calculate the expected payoff of stopping vs skipping at this node.

     But they don't know if they are at A or B. They believe they are at A with probability π and at B with probability 1-π, where π is the probability of being at A given that you are at a node.

     As above, π = 1/(2-p) and 1-π = (1-p)/(2-p). But the catch is that p is their own strategy, so if they are thinking at the node, they might not think consistently. One-decision-at-a-time reasoners might not take into account that their strategy at this node will also be used at future nodes. 

     Alternatively, they might think myopically, not considering that by skipping at A they will get to B and have another chance. But let's compute the expected payoff at the node.

     If they stop:
          payoff = π * (4*q) + (1-π) * 3 
                  = π * (4*0.5) + (1-π)*3 
                  = 2π + 3 - 3π = 3 - π

     If they skip:
          payoff = π * (expected payoff from skipping at A) + (1-π) * (1) [because at B, skipping gives $1]
          But what is the expected payoff from skipping at A? It is the expected payoff from then being at B, which is the same as the expected payoff at a node at B? And at B, if they skip they get $1, if they stop they get $3. But they will use the same mixed strategy at B. However, if they are at the node and decide to skip, then they are essentially choosing an action only for this node. The one-decision-at-a-time reasoner might not think about the future strategy. They might think that after skip, they will face the same decision again and use the same mixed strategy, but that's circular.

     Alternatively, they might assume that at the next node they will do the same. This is complicated.

     The standard myopic reasoner might not consider the future node. They might think that skipping at Aisle A will give them $0 and then they leave the store? But that's not the case. Or they might think that skipping gives them the payoff from the next node, but they don't know what they will do there.

     Perhaps the one-decision-at-a-time reasoner will use the current beliefs about which node they are at and then choose the action that maximizes the immediate expected payoff, without considering that their action affects the state of the world (i.e., whether they will be at the next node or not) and without considering that the same strategy applies there.

     So at the node, they have beliefs π about being at A. They compare:
          Stop: 3 - π
          Skip: if at A, then skipping leads to B where they will get some expected payoff, say V_B. But V_B depends on the strategy they will use at B. Since they are using the same mixed strategy, V_B = p*3 + (1-p)*1 = 3p+1-p = 2p+1. But p is the same as what they are choosing now? This is circular.

     This is the issue: the one-decision-at-a-time reasoner might not realize that the strategy is fixed. So they might assume that at B they will behave optimally given they are at B. But since they can't condition, they have to use the same strategy.

     To avoid complexity, let's assume that the reasoner assumes that at the next node they will face the same decision and use the same mixed strategy. But then the expected payoff from skip at A is: 
          if at A: skip gives 0 + V_B = 0 + (2p+1) = 2p+1
          if at B: skip gives 1
     So overall, if they skip at the current node: 
          = π * (2p+1) + (1-π) * 1

     But p is the probability they will use at this node and at future nodes. The reasoner is choosing an action now, but for the future nodes they will use p. They are committed to p. So for a fixed p, they can compute. But then they would be using p consistently.

     However, if they are at the node and they are setting p for this node, they might try to choose an action that maximizes given that at future nodes they will use the same p. This is the sophisticated approach and is how we derived p=3/4.

     The naive one-decision-at-a-time reasoner might not consider the future at all. They might think that if they skip at A, then they will leave the store and get $0 (at A) plus nothing? But that's not the case. Or they might think that skipping at A means they will never get the item? 

     We want them to myopically compare stop and skip at the node without considering the future node.

     So let's assume they think:

          Stop: if at A, expected 2 (since q=1/2) and if at B, 3. But they don't know where they are. So they need the belief π.

          Skip: if at A, 0 (because they skip and then... they might think that's the end) and if at B, 1.

     So they would compute:

          Stop: π * 2 + (1-π) * 3
          Skip: π * 0 + (1-π) * 1 = 1 - π

     Then they would stop if: 
          2π + 3(1-π) > 1 - π
          => 2π + 3 - 3π > 1 - π
          => 3 - π > 1 - π
          => 3 > 1, which is true.

     So they would always choose to stop. But then p=1, which gives expected value of 2, which is less than the optimal 2.125 when p=3/4.

     So the one-decision-at-a-time myopic reasoner always stops, and gets $2, which is worse than the optimal mixed strategy that yields $2.125.

  2. Which feature is doing the work? 

     The key feature is that the decision-maker cannot remember which aisle they are in (imperfect recall) and that the payoff depends on the state (whether it's the first or second aisle) in a way that the optimal action differs per state. In our case, at Aisle A, stopping is only good if the item is available (which is 1/2) and at B, stopping is always good (but not as good as if you get it at A). The mixing probability arises because the decision-maker must balance the risk of stopping at A when the item is not available (wasting time and then having to face B) against the benefit of stopping at A when it is available and also the benefit of stopping at B.

     If you take away the imperfect recall, then the shopper could condition on the aisle. They would stop at A only if the item is available? But they don't know that at A. We could assume they know the availability at A when they are there? But in our setup, they don't know availability until they stop. 

     Alternatively, with perfect recall, they would know if they are at A or B. So at A, they would skip because stopping has expected value 2 (with q=1/2) and skipping leads to B where they can get at least 1 and at most 3. But at A, if they stop, they get 2 on average, but if they skip, they go to B and then they can stop at B and get 3, so skipping at A and then stopping at B gives 3, which is better than 2. So they would skip at A and stop at B. This would give them 3, which is better than the mixed strategy under imperfect recall (2.125). 

     So the feature is the imperfect recall: not being able to condition on which aisle you are in forces you to use the same action, and the mixing probability balances the trade-offs.

  3. Wrinkle: now give the person a 50/50 chance of recognizing which occasion they're on. On the occasions where they don't recognize it, does the best policy stay at the number you derived, or does it move?

     With probability 1/2, they recognize whether it's A or B. In that case, they can choose optimally: at A, they would stop only if the item is available? But wait, they still don't know the availability at A until they stop. So even if they recognize they are at A, they don't know availability. So at A, if they recognize they are at A, they would have to decide without knowing availability. The expected value of stopping at A is 2 (as before) and skipping at A leads to B where they will face the same problem. But if they recognize they are at B, they will always stop (since 3>1).

     However, let's be careful. When they don't recognize, they are as before. When they do recognize, they know if it's A or B.

     So the strategy now has two parts:
       - When they recognize (which happens with probability 1/2):
            - If at A: they must choose between stop and skip. The expected value of stop is 2. The expected value of skip is the expected value at B. But at B, they might or might not recognize, but we are conditioning on this recognition event. In the event they are at A and recognize, they know they are at A. Then if they skip, they will go to B. At B, they might recognize or not, but on average we have to account for that.

       This is complex because the decision at A when recognized might depend on what they will do at B when they don't recognize.

     Alternatively, we can assume that the recognition event is independent at each node. And at each node, if they recognize, they know which aisle they are at.

     So let's define a new strategy. The shopper will have a mixed strategy for when they don't recognize: probability p of stopping. When they do recognize, they will choose optimally given the aisle.

     What is the optimal choice when they recognize:
       - If at A: 
             stop: 2
             skip: leads to B, and at B they will get: 
                   with probability 1/2 they recognize at B and then stop (since at B, stop gives 3>1) -> 3
                   with probability 1/2 they don't recognize at B and then they use the mixed strategy p: so at B, expected payoff = p*3 + (1-p)*1 = 2p+1
             so skip at A (when recognized) gives: 0 + [ (1/2)*3 + (1/2)*(2p+1) ] = 0 + (1/2)(3+2p+1) = (1/2)(4+2p) = 2 + p

             Compare stop (2) vs skip (2+p): since p>=0, skip is always >=2. So they will skip at A.

       - If at B: 
             stop: 3
             skip: 1
             so they will stop.

     Therefore, when they recognize:
          at A: skip
          at B: stop

     When they don't recognize (prob 1/2 at each node), they use the mixed strategy: stop with probability p.

     Now, we need to compute the expected payoff from the start, and maximize over p.

     There are a few cases:

     At Aisle A (first node):
       - With probability 1/2, they recognize they are at A -> they skip.
       - With probability 1/2, they don't recognize -> they stop with probability p and skip with probability 1-p.

     If they skip at A (either because they recognized and chose to skip, or didn't recognize and happened to skip), then they go to Aisle B.

     At Aisle B:
       - With probability 1/2, they recognize they are at B -> they stop.
       - With probability 1/2, they don't recognize -> they stop with probability p and skip with probability 1-p.

     Now, the expected payoff:

     Let's denote:

     Case 1: At A, they recognize (prob 1/2): they skip, so payoff at A: 0, and then go to B.
     Case 2: At A, they don't recognize (prob 1/2): 
          - stop (prob p): then payoff = 4 if available (prob 1/2), 0 if not available -> expected 2.
          - skip (prob 1-p): payoff 0, and go to B.

     Now, for the cases that go to B:

     From A, the probability of reaching B is:
          = Pr(recognize at A) * (skip) + Pr(not recognize at A) * (skip without recognizing)
          = (1/2)*1 + (1/2)*(1-p) = 1/2 + (1-p)/2 = (1+1-p)/2 = (2-p)/2

     At B, the expected payoff depends on what they do:

          - If they recognize at B (prob 1/2): they stop, so payoff=3.
          - If they don't recognize at B (prob 1/2): they stop with prob p -> payoff=3, or skip with prob 1-p -> payoff=1.
               so expected payoff = p*3 + (1-p)*1 = 2p+1.

          Therefore, the expected payoff at B, given that they are at B, is:
               (1/2)*3 + (1/2)*(2p+1) = (3 + 2p+1)/2 = (4+2p)/2 = 2+p.

     Now, the total expected payoff V:

     V = [Payoff from A] + [Probability of reaching B] * [Payoff at B]

     Payoff from A:
          Case 1 (recognize at A): 0
          Case 2, not recognize and stop: (1/2)*p * 2 = p
          Case 2, not recognize and skip: (1/2)*(1-p) * 0 = 0

          So total from A: p.

     Probability of reaching B: (2-p)/2

     Payoff at B: 2+p

     So V = p + [(2-p)/2] * (2+p)

     Simplify the second term: (2-p)(2+p)/2 = (4 - p^2)/2 = 2 - p^2/2

     So V = p + 2 - p^2/2
          = - (1/2) p^2 + p + 2

     This is a quadratic in p: V = -0.5 p^2 + p + 2.

     Maximize: p = -b/(2a) = -1/(2*(-0.5)) = 1/1 = 1.

     So p=1.

     Then V = -0.5*(1)^2 + 1 + 2 = -0.5+3 = 2.5.

     Compare to without recognition: the best we had was 2.125.

     Now, with recognition and setting p=1 (for when they don't recognize), they get 2.5.

     But wait, does this make sense?

     Let me compute with p=1:

     At A:
          recognize (1/2): skip -> payoff 0.
          not recognize (1/2): stop -> payoff 2 (because 4 with 1/2, 0 with 1/2) -> 2.

          So expected from A: (1/2)*0 + (1/2)*2 = 1.

     Then, they go to B if they skipped at A (which happens when they recognize) or if they skipped when not recognize? But when not recognize, they always stop (p=1), so they only go to B if they recognized at A and skipped. That happens with probability 1/2.

          At B:
               if they go to B (which happens with probability 1/2), then at B:
                    recognize (1/2): stop -> 3.
                    not recognize (1/2): stop (p=1) -> 3.
               so at B: always 3.

          Expected from B: (1/2) * 3 = 1.5.

          Total V = 1 (from A) + 1.5 (from B) = 2.5.

     Without any recognition, the best was 2.125. With recognition, we get 2.5.

     But the question is: on the occasions where they *don't* recognise it, does the best policy stay at 3/4? In this case, we found that the best p is now 1, not 3/4. So it moves.

     Why? Because the recognition allows them to avoid the bad stop at A when the item is not available (by skipping at A when they recognize) and also to always stop at B when they recognize. When they don't recognize, they are only at a node with some probability. But note, when they don't recognize, they are more likely to be at A than at B? The calculation above doesn't need that because we are averaging.

     The mixing probability p for the no-recognition case is now set to 1, which is different from the original 3/4.

     So the best policy changes.

  Finally, for the skeptic:

     The mixing probability in the original case (without recognition) comes from the optimization of the expected payoff function V = -2p^2 + (4q+1)p + 1. We set q=1/2 and then found p = (4q+1)/4 = 3/4. It is the value that maximizes the quadratic function.

     A defender of the one-decision-at-a-time reasoning might say that the decision-maker should realize that they are more likely to be at the first node and therefore should stop. But our analysis shows that by sometimes skipping, you can achieve a higher overall expected payoff. The tension is that the one-decision-at-a-time reasoning does not account for the effect of the strategy on the distribution over nodes. In particular, by sometimes skipping, you increase the probability of being at the second node (because you only get there by skipping at the first), and at the second node, stopping is very good. But the myopic reasoner does not consider that their action at the first node affects whether they even get to the second node.

     The key is that under imperfect recall, the decision-maker is forced to use the same strategy at both nodes, and the optimal strategy balances the two in a mixed way.

