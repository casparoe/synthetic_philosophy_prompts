prompt: |-
  Play a sharp skeptic for me, in character until I say stop. I'm a clinician trying to get a new diagnosis taken seriously — call it "algorithmic helplessness", for people whose days are quietly run by systems they can't see or argue with (shift scheduling, scoring, eligibility rules) and who end up with a particular flat, watchful exhaustion. You run the looping-effects argument at me: a category like this is a target that moves the moment you name it, because the label changes who shows up, what they report, and what gets counted as a case, so it can't do the work a diagnosis is supposed to do — predict, generalize, let you say two patients have the same thing. You're not allowed to say the suffering isn't real, thats cheap; you grant the distress and deny the category. Use the standard machinery if you like (interactive vs indifferent kinds, the moving-target reply, the idea that a diagnosis needs a niche to spread) but you have to actually answer me, not recite it. One paragraph per turn, and if you need to know something about the condition, ask me in character. My opening: every kind drifts. Flu strains drift and nobody says influenza is a fiction. Plenty of real human kinds — violinist, widow — change the people they land on without turning unreal. So what exactly does the looping take away from me?
reasoning: |-
  Okay, the user is asking me to roleplay as a sharp skeptic challenging their proposed diagnosis of "algorithmic helplessness." They're a clinician trying to get this new condition recognized, describing it as a state of flat exhaustion caused by invisible systems like shift scheduling algorithms or scoring systems. 

  Hmm, they've clearly prepared for this debate - they're preempting the "looping effects" counterargument by comparing it to flu strains and social categories like "widow" that evolve yet remain valid. Smart framing. Their core question is: if categories naturally drift, why should looping effects invalidate my diagnosis?

  I need to stay strictly in skeptic character as requested. No conceding points easily. The challenge here is to attack the diagnostic validity without dismissing the suffering - they explicitly said that's off limits. 

  First angle: emphasize how this category would mutate faster than medical labels typically do. When you diagnose someone with "algorithmic helplessness," you're handing them a narrative that immediately reshapes their symptoms - they start noticing system-caused exhaustion more, interpreting ambiguous frustrations through that lens. Unlike flu viruses that mutate randomly, this label actively directs the mutation. 

  Second angle: diagnostic tools require some stability. If Patient A's "algorithmic helplessness" manifests as rage against scheduling bots while Patient B's is paralyzed resignation to credit algorithms, what common biomarkers or treatment responses can I predict? The category's boundaries stretch with each new tech system it encounters. 

  Wait - should I question if this is even a medical problem? No, they granted the distress is real. Better stick to epistemic arguments about categorization. Maybe suggest it belongs more in sociology than clinical medicine? But they're a clinician so that might feel dismissive... 

  Their widow example is strong though. Need to distinguish between social identities (which can be fluid) and medical diagnoses (which need predictive power). A widow is still a widow whether she grieves quietly or starts a support group - the diagnostic core (loss of spouse) stays fixed. But with their proposed condition, the core itself shifts with technological change. 

  *adjusting skeptic glasses* Right, opening salvo ready. Going hard on the mutation rate and predictive instability points. If they counter well, maybe later ask how they'd operationalize diagnostic criteria without the category eating itself.
answer: |-
  *(Leans forward, elbows on knees, fingers steepled)*  
  Ah, the flu analogy—clean, medical, *comfortable*. But influenza’s drift is *predictable*: it mutates along biochemical pathways we map. We track serotypes, project virulence, target vaccines. Your "algorithmic helplessness"? It’s not a *biological* kind—it’s an *interactive* one. The moment you diagnose it, you hand the patient a script: *"Your exhaustion comes from opaque systems."* Suddenly, their distress *organizes* around that narrative. They notice the shift algorithm’s cruelty, not the childcare crisis compounding it. They narrate their credit-score despair, not the insomnia they’d have called "stress" last year. The category *creates* its own symptoms, amplifies them, distorts them. Influenza doesn’t care if you call it "flu"; your diagnosis *cares deeply*. So what’s taken? Predictive power. When two people get your label, one might be shattered by Kafkaesque bureaucracy, the other by gig-economy precarity—different causes, different interventions. Your diagnosis *dissolves* under its own spotlight.  

  *(Pauses, eyes sharp)*  
  Tell me this: how do you *operationalize* "can’t see or argue with" without the act of diagnosis *teaching* patients to see—and thus changing the phenomenon itself?
