prompt: |-
  You are a philosopher specializing in normative ethics, especially the theory of supererogation and the boundary between moral requirement and praiseworthy but optional action. Think carefully, and begin by brainstorming the candidate principles that could underlie the verdicts below.

  A colleague of mine, R, has worked on these questions for years. She classifies each act as either required or supererogatory (where performing a supererogatory act is morally good but not required, and omitting it is not blameworthy). Her verdicts on earlier cases are:

  - A lifeguard on duty can rescue a swimmer in moderate surf at moderate risk to herself. R says: required.
  - A bystander who is an equally strong swimmer can rescue the same swimmer in rough surf at high risk to herself. R says: supererogatory.
  - A parent can donate bone marrow to their child; the procedure carries moderate risk and discomfort. R says: required.
  - A stranger can donate bone marrow to a child; in this case the procedure carries high risk and discomfort, and other potential donors are available. R says: supererogatory.
  - A person who negligently started a kitchen fire can run back in to save a stranger at moderate risk to themselves. R says: required.
  - A person can give a small fraction of their income to save a stranger's life. R says: required.
  - A person can give half their income to save a stranger's life. R says: supererogatory.
  - A sibling can donate a kidney to their brother; the surgery carries the usual moderate risks. R says: required.
  - A stranger can donate a kidney to another stranger; in this case the surgery carries unusually high risks, and other potential donors are available. R says: supererogatory.

  Now consider a new case: A stranger needs a kidney. Without a transplant, the stranger will die within a year. R is a compatible donor. The surgery would carry the usual moderate risks—the same risks as in the sibling case. R has no prior relationship with the stranger and did not cause the stranger's condition. Other compatible donors are listed in a registry, but none has yet been identified or approached.

  What would R say about the new case? Identify the competing principles that fit her earlier verdicts equally well, state what each predicts for the new case, give your best guess about her verdict and the reasons for preferring it, and name the further case that would most cleanly tell the principles apart.
reasoning: |-
  Hmm, the user is presenting a complex ethical thought experiment involving supererogation theory. They've described a philosopher colleague R who makes nuanced distinctions between required and supererogatory actions across various scenarios, and now wants me to predict R's verdict on a new kidney donation case while analyzing the underlying principles.

  First I need to carefully examine all of R's established verdicts. There's a clear pattern where requirements emerge when: (1) there's a special relationship (lifeguard, parent, sibling), (2) the agent caused harm (negligent fire-starter), or (3) the cost/risk is low (small income donation). Supererogation appears when: (a) no special relationship exists (strangers), (b) high risk/cost is involved (rough surf rescue, high-risk marrow donation), or (c) alternatives exist.

  The new case presents an interesting tension: it's a stranger-to-stranger donation with moderate risk (normally suggesting supererogation) but crucially, the availability of other donors is uncertain. This "uncertain alternatives" factor doesn't have direct precedent in the earlier cases.

  I see two competing principles that could explain R's previous judgments:
  The Special Obligation Principle emphasizes relationships/causation as requirement-triggers, which would classify the new case as supererogatory since it involves strangers with no causal link. 
  The Cost-Availability Principle focuses on cost/risk relative to alternatives, and might lean toward requirement here because alternatives are unsecured and risk is only moderate.

  The marrow donation cases are particularly instructive - R required parental donation but deemed stranger donation supererogatory even with high risk and available alternatives. This suggests relationships outweigh availability concerns. However, the income donation cases show cost sensitivity independent of relationships.

  For the new kidney case, I suspect R would call it supererogatory. The absence of relationship or causation seems decisive, and while alternative donors exist in theory, their unconfirmed status likely doesn't override this. To definitively test these principles, we'd need a case where a stranger faces low cost/risk but alternatives exist - like giving small income when others could donate too.

  This ethical puzzle reveals how supererogation boundaries depend on multiple interacting factors, and how philosophers like R balance moral demandingness against personal sacrifice.
answer: |-
  Based on R's pattern of verdicts, two competing principles emerge that fit her earlier judgments equally well. Both principles incorporate elements of **cost/risk to the agent**, **special relationships/responsibilities**, **causation of harm**, and **availability of alternatives**, but they weigh these factors differently concerning the *source* of the requirement.

  ### Candidate Principles
  1.  **The Special Obligation Principle (SOP):**
      *   **Core Idea:** Moral *requirements* arise primarily from **special relationships** (professional role, family ties) or **direct causation of harm**. Absent these, even significant sacrifices are supererogatory unless the cost/risk is *very low* and the benefit *very high* (like small income donation). The presence of alternatives reinforces supererogation by weakening any potential general duty.
      *   **Explains Verdicts:**
          *   Lifeguard (role) & Parent/Sibling (relationship) & Fire-starter (causation): Required.
          *   Bystander (no role/rel./cause, high risk): Supererogatory.
          *   Stranger Marrow (no rel./cause, high risk, alternatives): Supererogatory.
          *   Stranger Kidney (no rel./cause, high risk, alternatives): Supererogatory.
          *   Small Donation (no rel./cause, but *very low* cost): Required (exception for minimal cost/high benefit).
          *   Half Income (no rel./cause, high cost): Supererogatory.

  2.  **The Cost-Availability Principle (CAP):**
      *   **Core Idea:** Moral *requirements* arise when the cost/risk to the agent is **moderate or low** relative to the benefit, **regardless of relationship or causation**, *unless* viable alternatives exist who could bear the cost instead. Special relationships/causation can *override* high cost or lack of alternatives to create a requirement. High cost/risk or the existence of ready alternatives generally makes an act supererogatory.
      *   **Explains Verdicts:**
          *   Lifeguard (moderate risk, no alternatives implied): Required.
          *   Bystander (high risk): Supererogatory.
          *   Parent Marrow (mod risk, relationship overrides alternatives?): Required.
          *   Stranger Marrow (high risk + alternatives): Supererogatory.
          *   Fire-starter (mod risk, causation overrides): Required.
          *   Small Donation (very low cost, no alternatives implied): Required.
          *   Half Income (high cost): Supererogatory.
          *   Sibling Kidney (mod risk, relationship): Required.
          *   Stranger Kidney (high risk + alternatives): Supererogatory.

  ### Prediction for the New Case
  *   **Scenario:** Stranger-to-stranger kidney donation. **Moderate risk** (same as sibling case). **No special relationship or causation**. **Alternatives exist in principle (registry) but are unsecured/not yet approached**.
  *   **SOP Prediction:** **Supererogatory.** The absence of a special relationship or causation is decisive. The moderate risk alone, without a special obligation, isn't enough to create a requirement. The existence of a registry (potential alternatives) further weakens any argument for a general requirement.
  *   **CAP Prediction:** **Ambiguous, leaning Supererogatory.** The cost/risk is moderate, which *could* suggest a requirement. However, the existence of a registry (potential alternatives), even if unapproached, likely pushes it towards supererogation. The lack of relationship/causation doesn't help create a requirement here. CAP is less clear on how "available" alternatives need to be.

  ### Best Guess for R's Verdict & Reasoning
  *   **Verdict:** **Supererogatory.**
  *   **Reasoning:** R's verdicts consistently treat the absence of a special relationship or causal responsibility as a strong barrier to requirement, even for acts involving moderate cost/risk. The sibling kidney case is required *because* of the relationship, not *despite* the risk. The stranger marrow case (high risk + alternatives) is supererogatory. The new case mirrors the stranger marrow case but with *moderate* risk. Crucially, **R seems to place significant weight on the relational/causal trigger for requirements.** The moderate risk alone, absent that trigger, is insufficient to create a duty for a stranger. The existence of a registry (potential alternatives) reinforces this, even if those alternatives aren't immediately actionable. The core distinction is that special obligations *demand* sacrifice at moderate cost, while general beneficence only *requires* minimal sacrifice (like small donations) and praises greater sacrifices as supererogatory. Donating a kidney as a stranger, even at moderate risk, falls into the latter category.

  ### The Crucial Further Case to Tell the Principles Apart
  *   **Scenario:** A stranger needs life-saving medication costing 1% of a comfortable person's annual income. Many other equally comfortable strangers *could* easily contribute this small amount, and there is an organized charity actively soliciting donations from the public.
  *   **SOP Prediction:** **Required.** The cost is *very low* (equivalent to the small income donation case). The existence of many potential alternative donors (even an active charity) does *not* negate the requirement for *this* individual to contribute such a minimal amount for a life. The low cost triggers the requirement regardless of alternatives.
  *   **CAP Prediction:** **Supererogatory.** While the cost is low, the existence of *many viable and actively solicited alternatives* means the burden can easily be spread. This individual is not required to contribute precisely because others readily can and are being asked to.
  *   **Why it Cleans Up:** This case isolates the critical difference. SOP prioritizes the low-cost/high-benefit nature as creating an individual requirement, largely ignoring the presence of alternatives for such minimal demands. CAP prioritizes the distribution of burden via available alternatives, making even a very low-cost act supererogatory if others can readily step in. R's verdict on the original small donation case (required, with no alternatives mentioned) suggests SOP might be closer, but this new case directly tests the role of alternatives for low-cost acts. If R says "required" here, SOP is strongly favored. If she says "supererogatory," CAP is strongly favored.
