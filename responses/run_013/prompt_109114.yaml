prompt: |-
  I'm workshopping a short piece on internal vs. external reasons for a reading group and I'd like someone to tear into it before I hand it over. Here's the draft — it's rough.

  *Internalism about reasons says that whether you have a reason to do something depends on what's already in your motivational set — your desires, projects, commitments, whatever actually moves you. You have a reason to do a thing only if you could arrive at the conclusion that you should do it by a sound deliberative route starting from where you already are. Call that the source condition.*

  *The standard objection is that this makes everything hostage to what people happen to care about. The person who genuinely doesn't care whether anyone else suffers comes out as having no reason to stop. That seems backwards; we want to say the cruel person has a reason whether or not they're moved by it.*

  *My attempt at a reply. Internalism comes in two versions that get run together. One is a claim about which reasons there are: only considerations reachable from your motivational set are reasons at all. The other is a claim about what a reason ascription is doing: when we say someone has a reason, we're saying something about the light in which their own commitments cast a given action. Only the first version has the counterintuitive consequence. The second is perfectly compatible with the cruel person having a reason, so long as we're not asking that reason to do explanatory work — to explain why they act, or why they'd be irrational if they didn't.*

  *So my verdict: internalism is true as a thesis about the reasons that can figure in the explanation of action, and false as a thesis about all the normative reasons there are. The interesting question, then, isn't internalism vs. externalism but which job you're hiring the word 'reason' to do.*

  *I also want to say something about deliberation adding to your motivational set rather than just serving it, so that "relative to what you already want" isn't as constricting as it sounds. Not sure yet whether that helps me or just gives the game away.*

  Can you give me comments? Three things I actually care about: (1) have I got the standard internalist position right, or is my gloss a caricature of it? (2) does the move in the third paragraph work, or am I just relabeling the disagreement as a verbal dispute and calling that a solution? (3) what would you cut — the whole thing feels flabby to me. Keep it under 400 words, lead with the single biggest problem, and don't pad it with encouragement. Also, please don't give me a reading list or citations, I'm not near a library this week and I only want your take on the arguemnt itself.
reasoning: |-
  Okay, the user is workshopping a short philosophy piece on internal vs. external reasons for a reading group. They want me to tear into their draft without padding or encouragement. The main points they’re concerned about are: whether they’ve accurately portrayed internalism, if their distinction between two versions of internalism resolves the objection or just relabels the disagreement, and where to cut for conciseness.  

  First, I need to assess their portrayal of internalism. They define it as reasons depending on one’s "motivational set" (desires, projects, etc.) and requiring that one could reach the action via "sound deliberative route" from existing motivations. This aligns with Bernard Williams’ classic formulation, so they’ve captured the core idea accurately—not a caricature. The "hostage to desires" objection they mention is indeed the standard externalist critique.  

  Now, their key move: splitting internalism into two claims—one about which reasons exist (only those derivable from motivations), and another about what reason ascriptions mean (highlighting how actions align with commitments). They argue the second version avoids the cruel person counterexample by decoupling normative reasons from explanatory ones. But here’s the problem: this risks being a verbal sleight of hand. If the cruel person’s "reason" isn’t explanatory or action-guiding, externalists would argue it’s not a genuine normative reason—just relabeling the dispute rather than resolving it. Their concession that this reason "doesn’t do explanatory work" might concede too much to externalism.  

  Regarding cuts: their draft is at ~250 words but feels flabby. I’d trim the motivational-set definition (it’s redundant after the first sentence), tighten the cruel-person example, and drop the deliberation-adds-to-motivations tease (it’s underdeveloped and distracts). The core argument survives sharper at ~150 words.  

  Biggest flaw: the two-versions distinction doesn’t save internalism from the objection; it just quarantines normative reasons from criticism. To strengthen this, they’d need to argue why non-motivating reasons still count as reasons—but that’s externalism in disguise. Alternatively, they could lean into Williams’ "practical necessity" idea where deliberation expands motivations, making internalism less restrictive.  

  Final note: their "which job is ‘reason’ doing" framing is clever but needs to explicitly state that externalists reject divorcing normativity from motivation. Without that, it’s not a solution—just a map of the stalemate.
answer: |-
  Here’s a direct critique focusing on your three concerns, ordered by severity:

  1.  **Your Core Move Doesn't Solve the Problem (It Relabels):**
      *   Your distinction between "reasons there are" and "reason ascription" is essentially conceding the externalist point. Saying the cruel person "has a reason" but it can't explain action or rational failure **empties "reason" of its normative force** in the exact scenario where externalists demand it. Externalists argue a *genuine* normative reason *must* have some rational purchase, even if overridden. Your "ascription" version seems to reduce "having a reason" to "if they *were* motivated appropriately, this *would* be a reason" – which is just internalism about hypothetical motivations, not a distinct normative reason existing independently. This looks like relabeling the disagreement.

  2.  **Gloss on Standard Internalism (Mostly Accurate, One Nit):**
      *   Your gloss captures Williams' core internalism well ("motivational set", "sound deliberative route"). The "hostage to desires" objection is standard.
      *   *Nitpick:* "Could arrive at the conclusion... by sound deliberation" slightly undersells the *explanatory* link Williams emphasizes. It's not just that you *could* conclude it, but that the reason *explains* your potential action *via* that deliberative link to your S. Your phrasing risks making it purely epistemic. (Minor, but tighten to: "...only if it could motivate you via sound deliberation starting from your existing S.")

  3.  **What to Cut (Be Brutal):**
      *   **Cut the "deliberation adding to S" tease entirely.** It's a distraction here. Either develop it properly (it *could* help soften internalism) or drop it. As is, it adds nothing.
      *   **Tighten Definitions:** Merge sentences 1 & 2 of para 1: "Internalism holds you have a reason to act only if it connects via sound deliberation to your existing motivational set (desires, projects, etc.)."
      *   **Sharpen the Cruel Person Example:** "The cruel person who *genuinely* lacks concern for others' suffering seems, counterintuitively, to have no reason to stop harming them."
      *   **Trim Verdict:** "Internalism plausibly describes reasons that can *explain* action. It fails as an account of *all normative reasons*, precisely because it cannot ground reasons like the cruel person's obligation to stop."

  **Revised Core Argument (Focus & Conciseness):**

  > Internalism claims you have a reason to act only if it connects via sound deliberation to your existing motivational set (S) – desires, projects, etc. The standard objection is stark: the cruel person, genuinely unmoved by others' suffering, seems to have *no reason* to stop harming them. This clashes with the intuition that they *do* have such a reason, regardless of motivation.
  >
  > My reply distinguishes two internalist claims: (1) Only S-accessible considerations are genuine reasons. (2) Saying "A has a reason to φ" means φ aligns with what A's S *would* endorse under sound deliberation. Claim (1) faces the objection. Claim (2) avoids it – we *can* say the cruel person "has a reason," meaning their actions conflict with a standard derivable *from idealized deliberation on their own S*. However, this reason cannot explain their action or diagnose irrationality if they ignore it.
  >
  > Thus, internalism succeeds for reasons that *explain* action but fails for *all normative reasons*. The debate hinges on what work "reason" is meant to do: explaining motivation or prescribing obligations independently.

  **(~195 words. Removes flab, focuses on the distinction, highlights its limitation.)**

  **Why this works better:** It presents your distinction clearly, exposes its key weakness (the normative reason it "saves" is impotent), and cleanly frames the core dispute about the function of "reason." The cruel person case remains the sharp test.
