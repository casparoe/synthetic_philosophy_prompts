  ## The Inheritance Trap: Can Luck Egalitarianism Untangle Compounded Family Injustice?

  The impending division of my mother’s house has resurrected decades of unequal treatment: my brother, buoyed by parental support throughout tuition, business failures, and divorce, now argues that his current misfortunes – a bad back, no savings, and a decade of setbacks – entitle him to 60% of the inheritance. He *needs* it more. Part of me, swayed by compassion and his visible hardship, agrees. Yet, my studies in luck egalitarianism (LE) clash with this impulse. LE holds that inequalities are just only if they stem from choices, not luck. My brother’s plight seems largely unchosen bad luck, suggesting compensation. However, the inheritance itself is a windfall, and the very "bad luck" he seeks to remedy is deeply entangled with the initial, unfair "good luck" of parental favoritism. This raises a profound question: Can LE resolve a situation where the justification for redistribution is itself polluted by the prior injustice it might seek to correct? Let’s dissect both sides before rendering a verdict.

  **The Case for My Brother: Needs, Brute Luck, and LE's Compassionate Core**

  1.  **The Primacy of Current Circumstance:** Luck Egalitarianism, championed by philosophers like Ronald Dworkin and Eric Rakowski, focuses on mitigating the effects of *brute bad luck* – misfortune unchosen and undeserved. My brother's debilitating back injury and a decade of cascading failures appear paradigmatic examples. He didn't choose his health or the macro-economic forces, personal betrayals, or unforeseen market crashes that may have contributed to his ruin. LE demands we shield individuals from such arbitrary cosmic misfortunes.
  2.  **Inheritance as a Remedial Tool:** The inheritance is a fresh pool of resources, morally arbitrary in its source (our birth). LE views such windfalls precisely as mechanisms to correct unchosen disadvantages. Denying him a larger share based on past advantages ignores his *present*, unchosen vulnerability. LE prioritizes current fairness and opportunity over historical ledger-keeping. Punishing him now for past parental favoritism he didn't *choose* would itself violate LE's core principle – holding people responsible only for their choices.
  3.  **The Danger of Moral Resentment:** Denying his claim based on past grievances risks weaponizing philosophy to justify resentment. LE aims for a just distribution *now*, not retribution for past wrongs perpetrated by others (our parents). His need is demonstrably greater; LE’s compassion dictates we address this stark inequality.

  **The Case Against My Brother: Tainted Luck, Compounded Injustice, and LE's Integrity**

  1.  **Tracing the Origins of "Bad Luck":** LE requires scrutinizing the *source* of disadvantage. Much of my brother's current precarious position is *not* neutral brute luck, but the direct consequence of prior, unjustly distributed *good luck*. His lack of savings? Partly because he was never forced to develop financial resilience; our parents' bailouts shielded him from the consequences of his *chosen* business risks. His dependence? Fostered by always having a parental safety net. His "bad luck" is the chickens coming home to roost from a lifetime of subsidized risk-taking and dependency *enabled* by unfair advantage. Compensating him for this now constitutes subsidizing the consequences of the initial injustice *again*.
  2.  **The Inheritance Lottery: Running it Twice?** Distributing the inheritance based *solely* on current need effectively reruns the same biased "family luck lottery." He won the first round (lifetime support), leading to his current "loss" position (dependency, lack of resilience). Granting him a larger share of the inheritance based on this position is simply letting him win the second round too, precisely *because* he won the first. This perpetuates, rather than corrects, the original unfairness. LE demands we break such cycles, not entrench them.
  3.  **The Claimant's Position and Personal Responsibility:** While he didn't choose our parents' bias, he *did* make choices within that context – accepting bailouts, perhaps taking riskier ventures knowing the safety net existed, not building savings despite opportunities. LE allows holding individuals responsible for choices made *even under favorable conditions*. His current need isn't purely exogenous bad luck; it reflects choices made possible and amplified by unfair advantage.
  4.  **Justice for the Disadvantaged:** LE also concerns itself with those disadvantaged by bad brute luck. *My* brute bad luck was being born into a family that distributed its resources and support unequally based on arbitrary favoritism. I had to build resilience and security with far less. Awarding him a larger share based on need originating in his prior advantage compounds my unchosen disadvantage. A just LE distribution must consider the totality of unchosen circumstances for *both* parties.

  **Resolution: Rejecting Compounded Injustice – LE Can and Must Hold the Line**

  My brother should **not** receive a larger share of the inheritance based on his current need. Luck Egalitarianism, rigorously applied, not only permits this conclusion but demands it.

  The fatal flaw in his claim is the **tainted origin** of his alleged "brute bad luck." LE’s power lies in its focus on responsibility and the source of advantage/disadvantage. When the disadvantage requiring compensation demonstrably flows from a prior, unjust advantage (itself a form of brute luck for the recipient), compensating it becomes a double injustice. It subsidizes the consequences of the initial unfairness. The inheritance distribution is not occurring in a vacuum; it is the final act in a lifelong drama of unequal distribution. Using it to "correct" a need *created* by that very inequality is logically incoherent within LE and morally perverse. It launders the initial parental unfairness through the language of need-based justice.

  Furthermore, LE requires us to consider the *net* effect of brute luck across a life. My brother's lifetime net brute luck is overwhelmingly *positive* (significant financial support, safety nets) even if punctuated by recent negative events. Mine is net *negative* (lack of equivalent support). Awarding him more of the final windfall based on a snapshot of his low point ignores this cumulative reality and violates LE’s aim of ensuring distributions reflect the total impact of unchosen circumstances. His poor choices, made within a context of subsidized security, also bear responsibility.

  Therefore, the luck egalitarian answer is clear: An equal split is the most just outcome. It refuses to use the inheritance – itself a product of the morally arbitrary luck of birth – to compound the initial injustice of parental favoritism. It acknowledges that my brother’s current hardship, while real, is not neutral bad luck deserving compensation under LE when its roots lie in prior unfair advantage and his own choices within that context. It recognizes that I, too, suffered unchosen disadvantage. Luck egalitarianism, far from being stymied by this circularity, provides the essential tools to dissect it and arrive at a principled, fair conclusion: equal shares break the cycle; awarding him more perpetuates it. The philosophy holds, and justice, in this case, demands parity.
