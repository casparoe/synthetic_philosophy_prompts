  The proposal needs a sharp, answerable question. Right now, their idea is too vague: "Can awareness defuse it?" → Better to specify parameters: stochastic arrival of offers, varying levels of foresight, and discount functions. The answer likely depends on how discounting interacts with irregular timing, so the model should test that explicitly. 

  They’re worried about feasibility for one term. Good sign they’re realistic! A small formal model (say, 3–4 trade sequences with Poisson arrivals) is doable. Failure would be if awareness *always* blocks the pump or if the exploit requires implausible irrationality. But I suspect there’s a sweet spot where exponential discounters escape while hyperbolic ones don’t—that’d be a publishable nugget. 

