answer: |-
  ## *Journal of Biological Mechanisms*  
  **Editorial Style Guide (v. 4.3)  
  Section 17: Teleological Language & Rationale Attribution**

  **17.1 General Prohibition:** Avoid language implying intentions, goals, or purposes where no cognizing agent is demonstrably involved. Descriptions should focus on mechanistic causality.

  *   **Unacceptable:** "The enzyme *wants* to bind the substrate."
  *   **Acceptable:** "The enzyme binds the substrate due to complementary molecular geometry and electrostatic forces."

  **17.2 Permissible Functional Description:** The infinitive construction ("to + verb") may be used to denote an evolved *function* or *consequence contributing to fitness*, provided it does not imply conscious intent. **Crucially, such usage requires either:**  
      **(a) Explicit Attribution to Natural Selection (NS),** or  
      **(b) Filing under the Free-Floating Rationale Exemption (FFRE - see 17.5).**

  *   **Unacceptable:** "The heart *desires* to pump blood." (Implies conscious desire).
  *   **Acceptable (via 17.2a):** "The heart pumps *to circulate blood (NS)*." (Attribution clear).
  *   **Acceptable (via 17.2b):** "The heart pumps *to circulate blood*." (Requires FFRE filing, see below).
  *   **Unacceptable:** "The heart pumps *in order that* blood may circulate." (Overly purposive phrasing, implies planning).

  **17.3 Reasoner Definition:** For attribution purposes (17.2a), a "Reasoner" is an entity capable of representing goals, evaluating options, and acting based on internal representations. Natural Selection (NS) qualifies as a Reasoner *only* when explicitly invoked in the context of its population-level, algorithmic process over generational time.

  *   **Acceptable (Reasoner = NS):** "Antibiotic resistance evolves *to enhance bacterial survival (NS)* under selective pressure."
  *   **Unacceptable:** "This rock eroded *to create a smoother surface*." (No plausible Reasoner, including NS).
  *   **Borderline (Requires FFRE):** "The moth's coloration functions *to camouflage it from predators*." (NS is implied Reasoner but not named; requires FFRE or revision per 17.2a).

  **17.4 The Free-Floating Rationale (FFR) Concept:** An FFR describes the *adaptive logic* or *functional rationale* inherent in a trait or behavior resulting from NS, *independent of whether any individual entity currently represents or understands that rationale*. FFRs are properties of the selective history and current functional context, not of the mechanism itself.

  *   **Core Distinction:** The FFR *exists* (as a description of selective advantage) without needing to be *represented* or *held* by any component within the system. The rationale floats free of any particular mind.
  *   **Acceptable FFR Phrasing:** "The root system grows towards water sources *to maximize hydration uptake*." (FFR: maximizing hydration is the adaptive rationale).
  *   **Unacceptable:** "The root system *knows* it needs water and *chooses* to grow towards it." (Misattributes representation/choice to the root).

  **17.5 Free-Floating Rationale Exemption (FFRE):** Authors may use the infinitive construction (per 17.2) *without* immediate NS attribution if they formally invoke the FFR Exemption for the relevant statement. This acknowledges the description is of an evolved functional consequence, not direct mechanistic causation or conscious purpose.  
      **17.5.1 FFRE Procedure:**  
      (a) The sentence must clearly describe a biological trait/behavior with a well-established evolutionary function.  
      (b) Authors must append the designation `(FFR)` immediately following the teleological phrase.  
      (c) Authors must submit **Form FFRE-7A: Declaration of Free-Floating Rationale** with the manuscript, specifying:  
          *   The exact sentence(s) using `(FFR)`.
          *   The trait/behavior described.
          *   The proposed adaptive rationale (the FFR itself).
          *   A brief justification citing established evolutionary biology (no need for specific refs in form, but must be defensible).
          *   Affirmation that no implication of representation, intention, or agency within the *contemporary* system is intended.
      (d) Copy Editors will verify FFRE-7A submission and correct `(FFR)` tagging during proofing.

  *   **Acceptable (with FFRE filed):** "Vervet monkeys produce distinct alarm calls *to warn troop members about specific predators (FFR)*."
  *   **Unacceptable:** "DNA polymerase synthesizes new strands *because it aims for accurate replication*." (Implies agency/purpose in molecule; FFR exemption inappropriate as rationale is immediate biochemical fidelity, not evolved *adaptive* function per se).

  **17.6 Distinguishing Function, Purpose, Goal, and "Just-So" Story:**
  *   **Function:** The evolved, NS-selected consequence of a trait (use with `(NS)` or `(FFR)`).
  *   **Purpose:** Implies deliberate design or conscious aim (Prohibited unless discussing human artifacts or demonstrable cognition).
  *   **Goal:** Implies a represented endpoint guiding action (Prohibited unless discussing goal-directed cognitive agents).
  *   **"Just-So" Story:** An unfounded, speculative evolutionary narrative lacking evidence. **FFRE is NOT a license for "Just-So" Stories.** Form FFRE-7A requires justification based on established biological principles/evidence. Speculative FFRs will be rejected.

  *   **Acceptable Function (FFR):** "Birds migrate south *to access seasonal food resources (FFR)*." (Established adaptive function).
  *   **Unacceptable "Just-So" (Rejected FFRE):** "Giraffes developed long necks *to reach the tastiest leaves at the very top of the trees (FFR)*." (Oversimplified, speculative; lacks nuance about competing hypotheses like sexual selection).

  **17.7 Processes "Having Reasons":** Descriptions implying that a process, mechanism, or inanimate system itself "has reasons" are strictly prohibited. Reasons require representation. Authors may describe the *adaptive rationale* (FFR) *for the existence* of the process/mechanism, but not attribute reasoning *to* it.

  *   **Unacceptable:** "Photosynthesis *has its reasons* for splitting water molecules." (Process cannot "have reasons").
  *   **Acceptable (FFR):** "The light-dependent reactions split water molecules *to generate electrons and protons for ATP synthesis (FFR)*." (Describes the functional rationale).
  *   **Unacceptable:** "Natural selection *had its reasons* for favoring this mutation." (NS is the reasoner *process*, not an entity that "has reasons"; revise per 17.2a or 17.3).
  *   **Acceptable (Reasoner = NS):** "Natural selection favored this mutation *to confer antibiotic resistance (NS)*." (Correctly attributes rationale to NS as the selecting process).

  **Form FFRE-7A (Excerpt):**  
  > **Section 3: Rationale Declaration**  
  > Trait/Behavior: [e.g., Vervet monkey alarm call specificity]  
  > Teleological Phrase Used: [e.g., "to warn troop members about specific predators"]  
  > Proposed Free-Floating Rationale (FFR): [e.g., Minimizing predation risk through targeted warnings enhances individual and inclusive fitness.]  
  > Justification (Evolutionary Basis): [e.g., Well-documented in primatology; calls are predator-type specific, elicit appropriate avoidance behaviors, and increase survival.]  
  > Affirmation: *By checking this box, the author(s) confirm that the teleological phrase describes an evolved functional consequence only, and implies no representation, intention, or agency within the contemporary biological system.* ☐
