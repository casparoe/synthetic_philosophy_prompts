prompt: |-
  I'm running a 90-minute session for the machine learning reading group in my department. They use Brier scores and proper scoring rules all day as engineering tools, and half of them have absorbed the idea that Dutch book arguments already settle why credences have to obey the probability axioms, so they think the epistemology side is a solved problem. I want a plan for teaching them accuracy-first epistemology -- not the explanation itself. What has to come before what: get the order right so that "accuracy" doesn't collapse into "aiming at the truth" in their heads, and so that the dominance argument and the expected-accuracy arguments dont blur into one thing. Pick the single example that carries the dominance argument for probabilism and tell me what it has to have and lack -- not the p(A)=0.7, p(not-A)=0.7 chestnut, no betting story, and I'd rather it be a case where the incoherence is subtle enough that they can't see it coming. Then the misconceptions in the order they'll surface, with exactly where in the sequence I head each off: I'm expecting "accuracy-first is just pragmatism with epistemic payoffs," "incoherent credences are irrational because they cost you money," and "the expected-accuracy argument for conditionalization is the same kind of argument as the dominance one." Finally, I want the circularity objection to expected-accuracy reasoning to land as the closing punchline rather than an ambush, so give me the question I should end on to check they've actually got it, and what to leave out of the session entirely.
reasoning: |-
  Okay, the user is preparing a 90-minute session on accuracy-first epistemology for a machine learning reading group. They're familiar with Brier scores and proper scoring rules as engineering tools, and many believe Dutch book arguments have settled why credences must follow probability axioms. The challenge is to present accuracy-first epistemology without collapsing "accuracy" into "aiming for truth," and to clearly distinguish between dominance and expected-accuracy arguments. 

  First, I need to consider their background. These are ML practitioners who use scoring rules daily but may conflate pragmatic and epistemic justifications. Their misconception that epistemology is "solved" by Dutch books means I must decouple accuracy-first from pragmatism early. The session structure needs to first destabilize their assumptions, then build accuracy-first foundations carefully.

  For the dominance argument example, they requested something subtle—not the classic 0.7/0.7 case. A three-event partition with dependencies could work, like credences for rain (R), outdoor event (O), and cancellation (C), with incoherence hidden in conditional relationships. The example must lack: (1) obvious dominance (no dominated credence vector should look "reasonable" at first glance), (2) any betting interpretation, and (3) direct ties to scoring rules they know. It should force them to visualize accuracy landscapes.

  Common misconceptions will arise mid-session. "Accuracy-first is just pragmatism" must be headed off when defining alethic accuracy—emphasize that avoiding dominated states is rational even without payoff consequences. Later, when discussing expected-accuracy arguments, I'll need to preempt conflation with dominance by stressing that expected accuracy requires probabilistic coherence upfront, creating a different justificatory structure.

  The circularity objection is the punchline. I'll end by asking how to compute expected accuracy without presupposing probabiility axioms—forcing them to see the bootstrapping problem. Crucially, I'll omit: Dutch book comparisons, scoring rule computations (they know this), and defensive responses to circularity (stay provocative). The goal is epistemic vertigo, not resolution.

  Timing-wise: 20 mins for setup/debunking Dutch books as pragmatic, 25 mins for dominance with the subtle example, 30 mins for expected-accuracy arguments and their vulnerabilities, leaving 15 mins for circularity discussion. The rain/O/C case should make dominance visually intuitive via accuracy maps while hiding incoherence in the P(O|R) implication.
answer: |-
  Here’s a structured 90-minute plan targeting ML researchers, designed to disrupt complacency about probabilism and clarify accuracy-first epistemology’s unique foundations. The focus is on **conceptual sequencing**, **preemptive misconception-blocking**, and **pivotal examples**.

  ---

  ### **Session Structure & Key Moves**
  **Total: 90 mins**  
  *(Timings are flexible; adjust based on group dynamics)*

  #### **Part 1: Destabilize "Solved Problem" Assumption (15 mins)**
  - **Hook (5 mins)**:  
    > *"Dutch books show that incoherent credences are *pragmatically* self-defeating. But does avoiding bankruptcy imply *epistemic* rationality? What if truth-seeking has entirely distinct demands?"*  
    - Contrast: Engineering use of scoring rules (tool for calibration) vs. epistemology (justification for belief norms).
  - **Core Tension**: Dutch books are about avoiding sure loss in *arbitrary* scoring contexts. Epistemic accuracy is about *alethic* value (truth-aptness) independent of stakes.

  #### **Part 2: Accuracy-First Foundations (20 mins)**  
  *(Crucial: Define "accuracy" before arguments)*  
  - **Alethic Accuracy ≠ "Aiming at Truth" (10 mins)**:  
    - **Define**: Accuracy as a *gradational* measure of closeness to truth (e.g., Brier score *is* accuracy-relevant).  
    - **Key Distinction**:  
      > *"Pragmatism: ‘Believe *as if* truth minimizes loss.’ Accuracy-First: ‘Believe *to be* in a state of minimal *alethic* error.’"*  
    - **Preempt Misconception 1** ("Epistemic Payoffs = Pragmatism"):  
      - Stress: Accuracy measures are *not* "payoffs" but *value functions for doxastic states*. No "stakes," no "utility" – just distance from truth.  
      - Analogy: "Is minimizing Euclidean distance to a point ‘pragmatic’? No – it’s geometric necessity."

  - **Dominance & Probabilism: The Subtle Example (10 mins)**  
    - **Scenario**: Weather-dependent events (non-binary, dependency-hidden):  
      > *Let *R* = Rain tomorrow, *O* = Outdoor concert held, *C* = Concert canceled.  
      > Agent’s credences:  
      > - P(R) = 0.6  
      > - P(O) = 0.7  
      > - P(C) = 0.3  
      > - P(O|R) = 0.2*  
    - **Why it works**:  
      - **Hides incoherence**: P(O) = P(O|R)P(R) + P(O|¬R)P(¬R). Plugging in:  
        `0.7 = (0.2)(0.6) + (P(O|¬R))(0.4) → P(O|¬R) must be 1.45` (impossible!).  
      - **No obvious dominance**: No direct contradiction like p(A)+p(¬A)>1.  
      - **Lacks betting interpretation**: Pure credence-reporting scenario.  
    - **Visualize dominance**: Show accuracy scores (e.g., Brier) for all possible truth assignments. Incoherent credences are *accuracy-dominated* by a coherent alternative (e.g., adjust P(O) to 0.58).

  #### **Part 3: Dominance → Expected Accuracy (30 mins)**  
  - **Dominance Argument Recap (5 mins)**:  
    - *"Probabilism because non-probabilistic credences are always *strictly less accurate* in some worlds – no probabilities involved."*
    
  - **Enter Expected Accuracy (EA) (10 mins)**:  
    - **Shift**: *"But we don’t know which world is actual. Shouldn’t rational credences *expect* to be maximally accurate?"*  
    - **Define EA**: EU(credence function) = ∑ [P(w) × Accuracy(credence, w)]  
    - **Preempt Misconception 2** ("Incoherence costs money"):  
      > *"EA doesn’t appeal to loss-avoidance. It’s about *current credences* judging their *own future accuracy*. Money is irrelevant."*  

  - **EA Argument for Conditionalization (15 mins)**:  
    - **Standard Setup**: Upon learning E, shift to credences maximizing EA *from the pre-learning perspective*.  
    - **Preempt Misconception 3** ("Same as dominance"):  
      - **Critical contrast**:  
        - *Dominance*: Uses *actual* accuracy (no probabilities).  
        - *EA*: Requires *probabilistic coherence to define expectation*.  
      > *"Dominance argues *for* coherence; EA *assumes* coherence to argue for dynamics. They’re different tools."*  

  #### **Part 4: The Circularity Punchline (20 mins)**  
  - **Set Up the Trap (10 mins)**:  
    - Review EA: To compute expected accuracy, you need a probability distribution (your current credences).  
    - **Question to the group**:  
      > *"If we justify probabilistic coherence *using* expected accuracy, but expected accuracy *requires* probabilistic coherence to be defined – is this circular?"*  
    - Let tension build. Highlight that EA arguments *presuppose* the coherence they recommend for conditionalization.  

  - **Reveal the Circularity (5 mins)**:  
    - **Nail it down**:  
      > *"EA arguments for probabilism are impossible – you can’t compute expectations without probabilism! EA only works for *dynamics* (like conditionalization) *after* coherence is assumed."*  
    - **Dominance as the savior**:  
      > *"This is why dominance arguments are foundational. They justify coherence *without* assuming probability. EA then tells us how to *update* coherent credences."*  

  - **Closing Question (5 mins)**:  
    > ***"If you need probabilities to compute expected accuracy, how can expected accuracy justify probabilism itself?"***  
    - **Goal**: Leave them realizing EA *depends on* probabilism – so Dutch books/dominance aren’t "solved" but reframed.  

  ---

  ### **What to Omit**  
  1. **Scoring rule computations**: They know Brier/SEL. Focus on *why* they’re accuracy-relevant, not how to calculate.  
  2. **Dutch book details**: Mention only to contrast pragmatism vs. alethicism.  
  3. **Defenses of circularity** (e.g., "bootstrapping" replies): This is the punchline – don’t resolve it. Let it linger.  

  ### **Why This Works**  
  - **Order**: Accuracy definition → Dominance (no probabilities) → EA (requires probabilities) forces the distinction.  
  - **The Example**: Subtle incoherence in P(O|R) hides the probabilistic violation, making dominance non-obvious.  
  - **Punchline**: Circularity lands because they’ve just accepted EA’s value – then see its limitation.  

  This plan turns their engineering intuition against complacency: *using* scoring rules doesn’t explain *why they encode epistemic value*. By the end, "solved problem" should feel unsettled.
