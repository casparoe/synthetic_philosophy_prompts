  **(Clinking glass gently)**  

  Everyone, look at these two. Just... look at them. Six years ago, my sister told me she’d met someone who made her laugh so hard she snorted coffee. I promised her I wouldn’t tell anyone. **(Pause, winks at sister)** Sorry. Worth it.  

  But that got me thinking about promises. Small ones, like keeping a silly secret. Big ones, like what you’ll hear today. What *is* a promise, really?  

  I promised my friend Dana I’d drive her to the airport last month. 5 AM. Brutal. And when my alarm went off? I felt... nothing. Just dark and tired. But I went. Not because I *felt* devoted. Not because God or a judge was watching. And definitely not because I was “being true to myself” at that ungodly hour. I went because *Dana* was waiting. That’s the thing about a promise: it’s a line drawn straight between two people. If I’d bailed? Dana gets to be angry. *Only* Dana. Because the promise was made *to her*. And if she’d texted, “Sleep in, it’s okay”? That anger vanishes. Just like that. Because it was hers to cancel. Nobody else’s.  

  That line between you? That’s where a promise lives. It’s not a prediction. I didn’t *know* I’d make it to Dana’s car. It’s not a contract. She can’t sue me. It’s not a feeling. Feelings fade at 5 AM! It’s a choice you hand to someone else. You say, “Here. This piece of my future is yours to count on. Yours to hold me to. Or yours to release me from.”  

  Which brings me to your vows today. “We promise to keep choosing each other.” “We promise to keep renegotiating.” Some might say that sounds like you’re avoiding a *real* promise. Like you’re building an escape hatch.  

  But I think you’ve nailed it.  

  Because a promise isn’t stone. It’s not set forever, ignoring who you both become. A promise between people who really *see* each other? It’s alive. It has to breathe. Saying you’ll “keep choosing” isn’t avoiding commitment—it’s naming the truth. You *will* change. Life *will* throw curveballs. The promise isn’t to be frozen statues; it’s to keep turning *toward* each other, again and again, even when it’s hard. Especially when it’s hard. To keep looking across that line and saying, “You. Still you.”  

  And “renegotiating”? That’s not tearing up the contract. It’s tending the line. It’s saying the promise matters enough to keep it clear, to keep it fair, to keep it *yours*. A promise ignored or taken for granted? That’s what breaks. A promise you talk about, you adjust, you reaffirm? That’s what lasts.  

  Someone once told me a promise kept *only* because you promised is hollow. That it only counts if you *want* to do it. But I call nonsense. **(Looks at couple)** On the easy days? Sure, you’ll *want* this. But on the hard ones? The 5 AM days of marriage? It won’t be wanting that gets you through. It’ll be looking at your person and remembering: *I gave them this choice. This piece of my future is theirs.* That obligation? That’s not chains. That’s the anchor. That’s the ‘why’ when the ‘want’ goes quiet. That’s the line holding you together until the wanting finds its way back.  

  And that line? It stretches even beyond... absence. Because a promise made in love isn’t erased when someone’s gone. It becomes part of how you carry them.  

  So here’s to my sister and her love. Here’s to your living, breathing promises. To choosing, again and again. To tending the line. To the anchor when the storm comes. To building a future where wanting grows *because* you chose to stay, not just because it felt easy.  

  May you always see each other clearly across that line. May you hold each other gently. May you keep your promises alive. Now raise your glasses: To the choosers, the renegotiators, the keepers of the line! To love that promises, and promises that love!  

  **(Raises glass)** To the bride and groom!  

  ---  

  **Short Note:**  
  *   **Where I took a side:** Against the idea that "a promise kept only because you promised is hollow" and that "wanting" is superior to obligation. I argued obligation is the anchor when feeling fades, making the promise *more* meaningful precisely when it's hard.  
  *   **Confidence:** High. This draws on the user's core insight (the unique bilateral nature of promising) and applies it to the marriage context. It defends the vows against being "not real promises."  
  *   **Least Sure Claim:** "A promise ignored or taken for granted? That’s what breaks. A promise you... reaffirm? That’s what lasts." **DEFINITELY FLAGGED.** While I believe it, the lawyer might argue some promises *must* be rigid to function (e.g., fiduciary duty), and "reaffirming" could mask avoidance. Is "tending the line" always sufficient for *all* types of promises? Less certain.
