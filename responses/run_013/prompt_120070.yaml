  The user's core dilemma is personal too - they can't articulate why we feel bound by promises, especially in mundane situations like driving a friend to the airport. They're particularly fascinated by how only the promisee has the right to be angry or grant forgiveness when a promise is broken. There's also unresolved grief about a promise to their deceased father that still feels binding.

  For the wedding vows specifically, they're wrestling with whether phrases like "we promise to keep choosing each other" are authentic commitments or loopholes. And they're troubled by a friend's claim that promises kept out of obligation are inferior to those kept willingly.

  The challenge is massive: craft a toast that subtly addresses these philosophical tensions without lecturing, excludes religious references, avoids quoting thinkers (since uncle would catch misattributions), and resonates across ideological divides. It must feel organic - the philosophy baked into the toast's narrative rather than tacked on.

  Hmm... The key insight might be centering the toast on the unique relationship between promiser and promisee. That navigates around the aunt's need for divine sanction (by focusing on human connection), the lawyer's contractual view (by acknowledging the mutual agreement aspect), and the friends' authenticity angle (through the "choice" language). 

  The airport example is perfect for grounding it - everyone understands that scenario. And framing the vows as "promises to keep promising" actually becomes a strength when presented as conscious choice rather than rigidity. 

  For the deceased father element... that's delicate. Mentioning it risks derailing the joyful tone, but omitting it ignores a real pain point. Perhaps a veiled reference to "promises that outlast us" could honor that without making the toast about grief.

  The obligation vs. desire dilemma? That's tricky. Maybe position the wedding vows as creating conditions where choosing each other becomes desirable - making obligation irrelevant through mutual nourishment.

  Better avoid any direct "here's why promises bind" statements. Instead, show through stories: the airport promise demonstrates the bilateral nature, the wedding vows illustrate how mutual commitment frameworks work. 

  For structure: open with warmth, use the airport story as philosophical pivot, transition to the couple's specific vows, then broaden to universal truths about partnership. End with the actual toast. Keep it under 700 words with natural cadence - no speechifying.

  The riskiest part? Asserting that broken promises uniquely belong to the promisee. That's central but could be challenged. The lawyer might argue third parties are affected by broken vows (e.g., kids). Should probably acknowledge that implicitly by saying "mostly" belongs to them.

  ...And definitely no "as Kant said" moments. Uncle would pounce.
