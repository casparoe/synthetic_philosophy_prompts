prompt: |-
  Our foundation has been making small, one-time cash grants to individuals in financial distress for three years now, always case by case and without written criteria, and a disagreement on the board has made me suspect that we have quietly been running two different philosophies at once. I would like an outside read on whether our record is coherent and on what it requires of us in the matter now before us.

  Our decisions to date:

  - We granted funds to an applicant born with a progressive joint disease, to install a stairlift in her home; she was employed and otherwise self-sufficient.
  - We denied funds to an applicant who had drained his savings on a collection of vintage wristwatches and then missed a rent payment; he was healthy and employable.
  - We granted funds to an applicant who was laid off when his plant closed and needed bridge money to relocate for a new job.
  - We denied funds to an applicant who had left a secure job to pursue an unpaid creative project and then ran short.
  - We granted funds to an applicant whose chronic illness prevented her from working, to cover ongoing treatment costs.
  - We denied funds to an applicant with a comfortable income and no unmet need who asked for money on the ground that he would enjoy having more of it.
  - We granted funds to an applicant who described herself as content with her frugal life but whose housing had failed a safety inspection and needed repairs she could not afford.

  Two trustees keep pressing rival slogans. One holds that we exist to correct bad luck, not bad choices. The other holds that we fund what a person needs in order to function, not what a person happens to want, and he has already waved off the applicant before us as an instance of the expensive-tastes problem.

  The case before us: an applicant was raised from infancy in a household where only a rare and very costly cuisine was served, and she now finds ordinary food nauseating. She is healthy when she forces herself to eat ordinary food, she holds a steady job, and she has close friends; her only complaint is that her life feels gray and joyless without the cuisine, which her income cannot cover. She is asking for a recurring grant.

  Tell me, first, which of the two slogans our past decisions actually fit, and whether some third principle fits them better. Then tell me how we should decide the present case if we want to remain consistent with ourselves, which of our earlier decisions is the closest analog, and, if the precedents genuinely underdetermine the matter, which principle we would be adopting by granting and which by denying. I care less about a survey of the literature on distributive justice than about what our own record commits us to. Please answer in American English.
reasoning: |-
  Okay, the user runs a foundation that gives cash grants to individuals in financial distress. They've been doing this for three years without written criteria, and now there's a disagreement on the board about two different philosophies. The user wants to understand which philosophy their past decisions align with and how to handle a new case consistently.

  First, I need to look at their past decisions. They provided seven cases: four grants and three denials. Let me list them out:

  1. **Granted**: Person with progressive joint disease needing a stairlift. Employed and self-sufficient otherwise.
  2. **Denied**: Person who spent savings on vintage watches and missed rent. Healthy and employable.
  3. **Granted**: Laid-off worker needing relocation funds for a new job.
  4. **Denied**: Left secure job for unpaid creative project and ran short.
  5. **Granted**: Chronic illness preventing work, needed treatment costs.
  6. **Denied**: Comfortable income, no unmet need, just wanted more money.
  7. **Granted**: Content with frugal life but needed housing repairs after safety inspection.

  The two board members have slogans: 
  - Trustee A: "Correct bad luck, not bad choices."
  - Trustee B: "Fund what a person needs to function, not what they want."

  Now, the current case is someone raised on rare, expensive cuisine who finds ordinary food nauseating. She's healthy when she eats ordinary food, has a job and friends, but feels life is joyless without the cuisine. She wants a recurring grant.

  I need to analyze the past decisions to see which slogan they fit better. Looking at the grants:

  - Case 1: Joint disease – that's bad luck (genetic), and the stairlift is a functional need for mobility.
  - Case 3: Plant closure – bad luck (economic), relocation is necessary for functioning (getting to work).
  - Case 5: Chronic illness – bad luck, treatment is essential for health/function.
  - Case 7: Housing failed inspection – bad luck (external event), repairs are a safety need, essential for basic living.

  Denials:
  - Case 2: Spent savings on watches – bad choice, not a need.
  - Case 4: Left job voluntarily – bad choice, not a necessity.
  - Case 6: Wants more money despite comfort – a want, not a need.

  So both slogans seem to cover the decisions. But Trustee A's "bad luck vs. bad choices" explains Case 4 (leaving a job is a choice) and Case 2 (spending on luxuries). Trustee B's "needs vs. wants" explains Case 6 (wants more money) and Case 7 (needs repairs for safety).

  Case 7 is interesting. The person is content frugally, but the housing repair is a need. It's a bad luck situation (inspection failure), but also a functional necessity. So both principles apply.

  Now, the current case: expensive cuisine. Is this bad luck or a choice? Being raised that way is luck, but as an adult, continuing to require it could be seen as a choice. She can eat ordinary food and stay healthy, so it's not a functional need. It's about enhancing quality of life, not survival.

  Comparing to precedents:
  - Closest denial is Case 6: wants more money for enjoyment. Similar to wanting gourmet food for joy.
  - Also similar to Case 4: leaving a job for personal fulfillment, which was denied.

  But is there a grant that's similar? Cases 1,3,5,7 are all about essential needs due to uncontrollable factors. Cuisine isn't essential since she's healthy without it.

  So denying aligns with both slogans. Granting would go against past decisions, treating a preference as a need or bad luck.

  The user needs to know if their record commits them. It seems consistent with both slogans, but the current case is different. They should deny to stay consistent, adopting the principle that needs are functional necessities, not preferences for happiness.
answer: |-
  Based solely on your foundation's seven prior decisions—without imposing external philosophies—your record reveals a clear, consistent pattern that **aligns more closely with "funding needs to function" than "correcting bad luck," though both slogans partially fit.** Crucially, your decisions consistently prioritize **unavoidable, functionally necessary expenses tied to basic survival, health, or economic participation** over discretionary choices or quality-of-life enhancements. Below is a step-by-step analysis, followed by guidance for the current case.

  ### 1. **What Your Past Decisions Actually Fit**
  #### Key Patterns from Your Record:
  - **Funded Cases** all involve **non-discretionary needs** essential to physical safety, health, or economic self-sufficiency:
    - Stairlift (joint disease): Enables mobility/safety at home → **functional need**.  
    - Relocation (laid off): Required to secure employment → **economic functioning**.  
    - Treatment (chronic illness): Necessary for health → **basic survival**.  
    - Housing repairs (safety inspection): Mandatory for habitable shelter → **safety need**.  
    *Common thread: All address barriers to meeting fundamental human needs (shelter, health, income).*

  - **Denied Cases** all involve **avoidable consequences of choices or non-essential wants**:
    - Vintage watches: Self-inflicted financial harm → **discretionary spending**.  
    - Unpaid creative project: Voluntary risk → **elective life choice**.  
    "Enjoy more money": No hardship → **pure desire**.  
    *Common thread: Applicants had reasonable alternatives but chose paths leading to hardship.*

  #### Which Slogan Fits Best?
  - **"Fund needs, not wants"** is the stronger fit:  
    Every decision hinges on whether the expense is **objectively necessary for basic functioning** (e.g., health, safe housing, employment). Bad luck (e.g., layoffs, congenital illness) often *enables* funding but isn’t sufficient alone—it must create a functional deficit.  
    - *Example:* The creative-project applicant (denied) had bad luck in their project failing, but the *need* arose from a voluntary choice.  

  - **"Correct bad luck, not bad choices"** is secondary:  
    Bad luck (e.g., layoffs, illness) appears in funded cases, but denials show that bad luck *alone* doesn’t guarantee support (e.g., the creative-project applicant had bad luck but was denied due to choice).  

  - **Your Unwritten Third Principle:**  
    **"We fund immediate, unavoidable costs that threaten core functioning (health/safety/economic survival), but only where no reasonable alternative exists."**  
    This explains *all* decisions better than either slogan alone:
    - Denials (watches, creative project) had alternatives (sell watches, return to work).  
    - Grants (stairlift, housing repairs) addressed threats to safety/independence with no alternatives.  

  ### 2. **The Current Case: How to Decide Consistently**
  **Applicant Summary:**  
  Healthy adult, employed, with friends. Needs costly cuisine for "joy" (ordinary food causes nausea but no health harm). Requests *recurring* grant.

  #### Consistency with Precedents:  
  - **Closest Analog:** **Case #6 (denied)** – The applicant with "comfortable income" who wanted more money for enjoyment.  
    - Both cases involve enhancing quality of life where no functional deficit exists.  
    - Like Case #6, this applicant has no unmet need: she can eat ordinary food, work, and maintain relationships.  

  - **Key Differences from Funded Cases:**  
    - No health/safety risk (vs. stairlift, housing repairs).  
    - No barrier to employment (vs. relocation grant).  
    - Recurring expense (all prior grants were one-time).  

  - **How the Slogans Apply:**  
    - "Needs vs. wants": This is a **want** (food preference), not a functional need. She *functions* without it.  
    - "Bad luck vs. bad choices": Her upbringing was bad luck, but her *current need* stems from preference—not unavoidable circumstances.  

  #### Recommended Decision: **Deny the grant** to remain consistent.  
  - **Why?** Your past record funds only *survival-critical* needs. Her request is for **hedonic enhancement**—a "gray life" isn’t equivalent to the physical/economic risks you’ve funded. Granting would break your pattern of prioritizing necessity over desire.  

  #### If Precedents Underdetermine the Matter (They Don’t, But for Argument’s Sake):  
  - **Granting** would adopt: *"We fund expenses essential to an applicant’s psychological well-being, even without functional impairment."*  
    - This contradicts all prior decisions (e.g., the creative-project applicant’s "unfulfilled" life was denied).  
  - **Denying** would adopt: *"We distinguish between needs (objective functioning) and preferences (subjective well-being), funding only the former."*  
    - This aligns with your denials of discretionary requests (watches, creative project, "more money").  

  ### Final Advice  
  Your record commits you to a **function-first principle**. To stay consistent:  
  1. **Deny this application.** Her need isn’t comparable to health crises, safety hazards, or job barriers.  
  2. **Codify your criteria:** Draft guidelines based on your pattern (e.g., "Grants for one-time costs addressing urgent health/safety/employment needs where alternatives are exhausted"). This prevents future board splits.  
  3. **For recurring requests:** Explicitly exclude them—your history shows only one-time interventions.  

  This case isn’t borderline under your precedent. Funding it would pivot from "rescue" to "lifestyle subsidy"—a shift requiring board consensus, not consistency. If you want that pivot, reopen past philosophy debates. But your track record? It’s coherent, practical, and leans hard toward necessity.
