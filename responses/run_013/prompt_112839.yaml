  Next, (2) and (6). They accept Fitch as valid but question if the knowability schema applies to complex propositions like (p ∧ ¬Kp). If the schema is restricted to Cartesians, and (p ∧ ¬Kp) isn't Cartesian because knowing it leads to contradiction, then Fitch doesn't apply. Commitment (6) supports this by treating the principle as a schema, allowing such restrictions. So (2) and (6) can coexist if Fitch is blocked by the Cartesian restriction.

