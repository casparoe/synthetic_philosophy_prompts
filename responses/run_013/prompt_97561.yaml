answer: |-
  Below is a step-by-step procedure based on Prospect Theory (specifically Kahneman and Tversky's "risk-weighted expected utility"). It incorporates **probability weighting** (bending probabilities toward caution) and **loss aversion** (losses hurt more than equivalent gains). I'll give you a concrete 5-minute process, then run your two examples.

  ---

  ### **Step-by-Step Procedure**
  **What you'll need:** Phone calculator (with exponentiation: e.g., `x^y` or `exp`/`ln` functions).

  1. **List outcomes & assign values**  
     - Write down every possible outcome (e.g., "win $X", "lose $Y").  
     - For non-monetary costs (e.g., guilt, social risk), convert them to **dollar equivalents**.  
       - *Example:* Losing a friend's $500 might feel like losing $1,000 of your own. Use the adjusted value.

  2. **Estimate probabilities**  
     - Assign probabilities to each outcome (must sum to 1).  
     - If you're **unsure**:  
       - Give a range (e.g., 40–60% chance of winning).  
       - Calculate results for **both ends of the range**. If either says "reject," reject the bet.  
       - If you can't assign any number, **automatically reject** (unknown = too risky).

  3. **Set your "caution dial" (G)**  
     - `G` ranges from **0 (aggressive)** to **10 (extremely cautious)**.  
     - **Money-only bets:** Start at `G = 4` (moderate caution).  
     - **Non-money bets (social/emotional):** Start at `G = 7`.  
     - *Adjustment rule:* If you’ve been too cautious lately, lower `G` by 2. If you’ve been reckless, raise `G` by 2. Be honest!

  4. **Calculate "bent" probabilities**  
     - For each outcome, compute:  
       \[
       \text{Weight} = \exp\left(-\left(-\ln(\text{probability})\right)^{0.8 - 0.04 \times G}\right)
       \]  
     - **Shortcut:** Use a calculator. Compute:  
       - `step1 = -ln(probability)`  
       - `step2 = step1 ^ (0.8 - 0.04*G)`  
       - `step3 = exp(-step2)`  
     - Sum all weights, then divide each by the total to get **adjusted probabilities (p')**.

  5. **Compute outcome values**  
     - For gains (outcome ≥ $0):  
       \[
       \text{Value} = (\text{dollar amount})^{0.8 - 0.02 \times G}
       \]  
     - For losses (outcome < $0):  
       \[
       \text{Value} = -1 \times |\text{dollar amount}|^{0.8 - 0.02 \times G} \times (1.5 + 0.25 \times G)
       \]  
     - *Note:* Exponents model diminishing sensitivity (e.g., $100 feels < 2x $50). Loss multiplier models aversion.

  6. **Calculate overall expected utility (EU)**  
     \[
     \text{EU} = \sum \left( \text{adjusted probability} \times \text{value} \right)
     \]  
     - If **EU > 0**: Take the bet.  
     - If **EU ≤ 0**: Reject the bet.  

  ---

  ### **Example 1: $20 Long-Shot Parlay (Pays $800)**  
  - **Outcomes:**  
    - Win: Gain $780 (net: $800 - $20) → Probability: 5% (0.05)  
    - Lose: Lose $20 → Probability: 95% (0.95)  
  - **Non-monetary?** None → Use `G = 4` (money-only bet, moderate caution).  

  **Step 4: Bent Probabilities**  
  - Weight(win) = `exp(-(-ln(0.05))^(0.8-0.04*4))` = `exp(-3^0.64)` ≈ `exp(-2.15)` ≈ **0.116**  
  - Weight(lose) = `exp(-(-ln(0.95))^(0.64))` = `exp(-0.05^0.64)` ≈ `exp(-0.18)` ≈ **0.835**  
  - Sum = 0.116 + 0.835 = 0.951  
  - **Adjusted probabilities:**  
    - p'(win) = 0.116 / 0.951 ≈ **0.122**  
    - p'(lose) = 0.835 / 0.951 ≈ **0.878**  

  **Step 5: Outcome Values**  
  - Value(win) = \(780^{0.8 - 0.02 \times 4}\) = \(780^{0.72}\) ≈ **117.5**  
  - Value(lose) = \(-1 \times 20^{0.72} \times (1.5 + 0.25 \times 4)\) = \(-1 \times 20^{0.72} \times 2.5\) ≈ \(-1 \times 7.1 \times 2.5\) ≈ **-17.75**  

  **Step 6: Expected Utility**  
  \[
  \text{EU} = (0.122 \times 117.5) + (0.878 \times -17.75) ≈ 14.34 - 15.58 = \boxed{-1.24}
  \]  
  **VERDICT:** Reject (EU < 0).  
  - **Why?** The "bent" probabilities make the 95% loss feel like 87.8%, and loss aversion amplifies the pain of losing $20. Even though the raw EV is +$20 (5%*$780 - 95%*$20), caution and loss sensitivity flip it negative.  

  ---

  ### **Example 2: Stake Friend $500 (50/50 Chance)**  
  - **Outcomes:**  
    - Win: Friend repays you + $500 profit → Gain $500 → Probability: 60% (0.6)  
    - Lose: You lose $500, but it feels like $1,000 due to guilt → "Loss" of -$1,000 → Probability: 40% (0.4)  
  - **Non-monetary?** Yes (guilt) → Use `G = 7` (high caution).  

  **Step 4: Bent Probabilities**  
  - Weight(win) = `exp(-(-ln(0.6))^(0.8-0.04*7))` = `exp(-0.51^{0.52})` ≈ `exp(-0.73)` ≈ **0.482**  
  - Weight(lose) = `exp(-(-ln(0.4))^(0.52))` = `exp(-0.92^{0.52})` ≈ `exp(-0.95)` ≈ **0.387**  
  - Sum = 0.482 + 0.387 = 0.869  
  - **Adjusted probabilities:**  
    - p'(win) = 0.482 / 0.869 ≈ **0.555**  
    - p'(lose) = 0.387 / 0.869 ≈ **0.445**  

  **Step 5: Outcome Values**  
  - Value(win) = \(500^{0.8 - 0.02 \times 7}\) = \(500^{0.66}\) ≈ **53.2**  
  - Value(lose) = \(-1 \times 1000^{0.66} \times (1.5 + 0.25 \times 7)\) = \(-1 \times 1000^{0.66} \times 3.25\) ≈ \(-1 \times 100 \times 3.25\) = **-325**  

  **Step 6: Expected Utility**  
  \[
  \text{EU} = (0.555 \times 53.2) + (0.445 \times -325) ≈ 29.5 - 144.6 = \boxed{-115.1}
  \]  
  **VERDICT:** Strongly reject (EU < 0).  
  - **Why?** Guilt magnifies the loss to -$1,000, high caution (`G=7`) inflates the perceived probability of losing (40% → 44.5%), and loss aversion compounds the pain. Raw EV is +$100 (60%*$500 - 40%*$500), but psychology flips it.  

  ---

  ### **Where the Model Disagrees with Your Gut**  
  1. **Long-shot parlay (Example 1):**  
     - Your gut might take it for the thrill (40-to-1 payout feels fun).  
     - Model says reject: Small wins don’t offset amplified loss pain.  

  2. **Staking a friend (Example 2):**  
     - Your gut might pass due to guilt (even if EV is positive).  
     - Model **agrees** but quantifies why: Guilt + caution = extreme aversion.  

  ---

  ### **What's Math vs. Judgment**  
  - **Judgment (you decide):**  
    - Converting emotions to dollar values (e.g., guilt = extra $500 loss).  
    - Probability estimates (especially under uncertainty).  
    - Setting `G` (caution dial) based on context.  
  - **Math (the model handles):**  
    - How `G` bends probabilities and scales values.  
    - Aggregating outcomes into a go/no-go decision (EU ≤ 0).  
  - **Limitations:**  
    - Can’t handle correlated bets (e.g., "I’m on a losing streak").  
    - Assumes outcomes are discrete/known.  
    - Fun/thrill isn’t quantified (add it as a "gain" if needed).  

  ---

  ### **Final Tips**  
  - **When stuck:** If you can’t assign a probability or value, reject the bet.  
  - **Track your `G`:** Note if you’ve been over-cautious (`G` too high) or reckless (`G` too low) weekly.  
  - **Start conservative:** Use `G=7` for social bets, `G=4` for pure money until calibrated.  
  - **Time saver:** Pre-calculate bent probabilities for common probabilities (e.g., 5%, 20%, 50%) at your typical `G` settings.  

  This system forces consistency by making your risk psychology explicit. It won’t eliminate regret, but it prevents self-sabotaging decisions. Run 3–5 bets through it; you’ll see why your instincts misfire.
