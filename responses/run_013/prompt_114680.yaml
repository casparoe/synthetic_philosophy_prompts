prompt: |-
  I'm teaching iterated elimination of dominated strategies in my rational-choice proseminar next week — the audience is philosophy grad students who are fine with expected utility and with mixed strategies as formal objects, but who've done zero game theory, and I've got one 75-minute session. Don't explain the material to me; plan how I should teach it. What has to be in place before "dominated by a mixture" lands as anything other than a trick, which single game should carry the whole session (my instinct is a three-strategy game where no pure strategy dominates anything but one strategy is beaten by a 50-50 mix of the other two — tell me if that's the right carrying example or if I need a different one, and say why not just prisoner's dilemma or matching pennies), and then what happens when we iterate it: I want them to leave knowing why the order of elimination can matter once weak dominance is in play and why it can't for strict dominance. Give me the misconceptions they'll arrive with — I'm expecting at least "a mixture is just the average of its parts, so it can't beat them both," and something like "whatever survives is what a rational player does" — and exactly where in the sequence I should head each one off, plus one closing question that would show me the order-dependence point actually landed. Tell me what to cut or openly refuse to do if I'm running long. Lead with your bottom line in the first sentence — the spine of the session — then the reasoning, no preamble and no restating my question.
