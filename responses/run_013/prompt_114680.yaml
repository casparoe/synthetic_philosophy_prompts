  Okay, let me tackle this professor's query about teaching iterated elimination of dominated strategies. They need a tight 75-minute plan for philosophy grad students new to game theory. The core challenge is making "dominated by a mixture" feel intuitive rather than a trick.

  First, the spine must be: Start with pure strategy dominance in a simple game (maybe Prisoner's Dilemma), then introduce mixed strategy domination through a specific 3x3 example, demonstrate iteration, and finally contrast strict vs weak dominance regarding order-dependence. 

  The professor suggested a three-strategy game where no pure strategy dominates but a 50-50 mix beats one strategy. That's perfect - it forces students to confront why mixtures aren't just averages. Matching Pennies would be confusing here, and Prisoner's Dilemma alone can't illustrate mixed strategies. The 3x3 game should have explicit payoffs showing how a mixed strategy dominates where pure strategies fail.

  Key misconceptions to anticipate: 
  1. "Mixtures are just averages so can't beat both components" - must be shattered during the 3x3 payoff calculation. 
  2. "Surviving strategies are what rational players play" - need to clarify this only gives possible rationality constraints, not prescriptions.

  Sequence should be: 
  1. Pure strategy dominance with Prisoner's Dilemma (5 min) to establish baseline. 
  2. Introduce the 3x3 game, show no pure dominance exists (10 min). 
  3. Calculate how a 50-50 mix dominates one strategy - have students verify payoffs (15 min critical moment). 
  4. Iterate elimination in that game (5 min). 
  5. Contrast strict vs weak through a new example where order matters for weak dominance (15 min). 
  6. Leave 10 min for discussion and the closing question: "In weak dominance, why might different elimination orders lead to different results?"

  If time runs short, cut deep dive into mixed strategy calculations (assign as homework) but never cut the weak/order-dependence contrast - that's the payoff. The closing assessment question should force them to articulate that weak dominance doesn't fully specify which strategy to eliminate when ties exist.
answer: |-
  ### Spine of the Session
  Build from pure-strategy dominance to mixed-strategy dominance using a **3×3 symmetric game**, iterate elimination to solve it, then contrast strict vs. weak dominance with a second example showing order-dependence.

  ### Why This Sequence & Game Choice
  - **Prisoner’s Dilemma (PD) is step 1** (5 min):  
    Use it *only* to introduce pure-strategy strict dominance and basic iteration. Students see immediate intuition ("defect dominates cooperate"), but PD fails for mixtures (no mixed strategies dominate).  
    **Cut after iteration:** No time for PD’s Nash equilibrium.  

  - **Matching Pennies is wrong here**: Mixed strategies aren’t *dominating* anything—they’re equilibrium play. Avoid confusion.  

  - **Your 3×3 game is critical** (25 min):  
    Use this symmetric payoff matrix (Row player):  
    ```
          L     C     R
      A   4,4   0,5   0,3  
      B   5,0   1,1   0,0  
      C   3,0   0,0   3,3
    ```  
    **Why it works**:  
    - No pure strategy dominates another (A vs. B: A better if column plays L, worse if C).  
    - **50-50 mix of A and B dominates C**:  
      - If Col plays L: Mix gives (0.5×4 + 0.5×5) = 4.5 > 3  
      - If Col plays C: (0.5×0 + 0.5×1) = 0.5 > 0  
      - If Col plays R: (0.5×0 + 0.5×0) = 0 = 0 → *strict* inequality fails, but still ≥.  
    **This forces the "mixture" insight**: A mixture isn’t an "average of its parts" in a naive way—it *creates new payoffs* by hedging.  

  ### Key Misconceptions & When to Address Them
  1. **"A mixture is just the average, so it can’t beat both pure strategies"**:  
     **Head off during 3×3 payoff calculations** (min 20–25).  
     - Have students calculate mix(A,B) vs. C across Column’s actions.  
     - **Ask**: "If you’re guaranteed ≥ C’s payoff and sometimes >, would you ever play C?" → Elicits dominance logic.  

  2. **"Whatever survives is what a rational player does"**:  
     **Crush during iteration** (min 30–35). After eliminating C, the game reduces to:  
     ```
          L     C    
      A   4,4   0,5   
      B   5,0   1,1   
    ```  
     - Show no dominance remains → *multiple rationalizable outcomes*.  
     - **Emphasize**: "This tells us what a rational player *won’t* do, not what they *will* do."  

  ### Iteration & Order-Dependence (20 min)
  - **Strict dominance**: Solve the 3×3 → eliminate C, then stop. Reiterate: order doesn’t matter because strict dominance is uncontroversial.  
  - **Weak dominance**: Switch to a new example (e.g., Battle of the Sexes with a "stay home" option). Show:  
    - Eliminating "stay home" first → coordination outcomes survive.  
    - Eliminating a weakly dominated pure strategy first → different result.  
  - **Why it lands**: Weak dominance allows "≥" with equality in some cases, so elimination depends on which strategy you "remove first" when payoffs tie.  

  ### Closing Question to Test Order-Dependence
  > "In the weak dominance example, Player 1’s 'stay home' strategy gives (0,0) regardless. If we eliminate it first, we get one outcome; if we eliminate Player 1’s weakly dominated 'opera' first, we get another. Why doesn’t this happen with *strict* dominance?"  
  > **Correct answer**: Strict dominance requires *always* better payoffs, so no ties → no ambiguity in elimination order.  

  ### What to Cut if Short on Time
  - **Cut**: Formal definition of mixed strategies (assume familiarity).  
  - **Cut**: Solving games to Nash equilibrium (mention it as motivation, but no math).  
  - **Openly refuse**: Weak dominance proofs or >2 players. Say: "This is core intuition—details are for problem sets."  

  ### Timing Breakdown
  - Pure dominance + PD iteration: 5 min  
  - 3×3 game setup/pure checks: 10 min  
  - Mixed dominance demo: 15 min  
  - Iteration in 3×3: 5 min  
  - Weak dominance + order-dependence: 20 min  
  - Misconceptions + closing Q: 15 min  
  - Buffer: 5 min  

  **Why they leave with clarity**: The 3×3 game forces them to *see* mixtures as tools, not tricks. Order-dependence via weak dominance becomes visceral through payoff ties.
