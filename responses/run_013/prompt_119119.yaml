answer: |-
  Here are five numbered comments:

  1.  Your three-way distinction (paper, acceptance, sedimented) earns its keep by capturing distinct mechanisms of social kind constitution, particularly highlighting how sedimentation involves a *causal entrenchment* absent in the other two, making it ontologically unique.  
  2.  The "promises and goals in football" examples for acceptance kinds are doing the least work; they feel secondary and less illuminating than the core money case, adding little analytic power compared to your other illustrations.  
  3.  The strongest objection to your race claim is that the "sedimented" inequalities you cite (health, wealth, neighborhood) are *actively maintained by ongoing social structures and practices* (e.g., systemic racism in housing, lending, policing), not merely self-perpetuating residues, challenging the claim they persist *without* current belief/enforcement.  
  4.  Your criminal record case directly challenges the distinctness of your categories; if a "paper kind" like 'felon' can sediment through collateral consequences, it suggests sedimentation is a *phase or outcome* potentially attainable by *any* socially enforced kind, undermining it as a separate *type* of kind.  
  5.  You won't want to hear this: Handedness is a weaker anchor for sedimentation than you need; its biological "residue" (prevalence shift) is arguably minor compared to the massively entrenched systems for race/criminality, risking underplaying the unique scale and *inertia* of the phenomenon you aim to capture.
