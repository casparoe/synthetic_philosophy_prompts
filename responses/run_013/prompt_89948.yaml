prompt: |-
  I'm a novelist, and I've been circling around Kripkenstein for a book I'm drafting, and I hit a summary in a craft essay that I can't tell if I should trust. Roughly: 'Kripke's rule-following argument shows that nothing about a person -- not their dispositions, not their brain states, not any fact you could dig out of their head -- fixes which rule they're following, so meaning is indeterminate. Wittgenstein's answer, Kripke says, is that meaning is created by community agreement: a word means what the community says it means, which is why private languages are impossible and why language is really just a social contract. It's the philosophical version of the idea that a text means whatever its readers decide.'

  My gut says the last sentence is up to something, but I couldn't tell you where the honest part ends and the embellishment starts. Can you go through it claim by claim -- what someone who actually works on this would nod at, what's a fair simplification, and what's just wrong? And does it matter whether we're talking about Wittgenstein's own view or Kripke's reading of it? Be commited here: give me your real verdict on each piece instead of laying out both sides and letting me choose. Under 400 words, in American English.
reasoning: |-
  Okay, the user is a novelist working with Kripkenstein themes and encountered a craft essay summary they're skeptical about. They want a clear breakdown of what's accurate, simplified, or wrong in that summary—specifically about Kripke's rule-following argument and Wittgenstein's community solution—and whether Kripke's interpretation aligns with Wittgenstein's original views. They need this under 400 words in American English, with direct verdicts, not balanced debate.

  First, I need to unpack the essay's claims point by point. The core arguments are: 1) Nothing internal (dispositions, brain states) fixes rules, making meaning indeterminate. 2) Kripke attributes to Wittgenstein the view that community agreement creates meaning. 3) This makes private languages impossible. 4) Language is a social contract. 5) The philosophical parallel to "a text means whatever its readers decide." 

  Assessing accuracy: Claim 1 is solid—Kripke does argue that internal facts can't pin down rules, leading to indeterminacy. Claim 2 is Kripke's framing, but controversial; Wittgenstein scholars debate if he truly endorsed communitarianism. Claim 3 is correctly Kripkean—private languages fail without community checks. Claim 4 oversimplifies; "social contract" implies conscious agreement, but Wittgenstein focused on organic practice. Claim 5 is wrong—it misrepresents both by ignoring normativity (correct/incorrect use) and reducing meaning to subjective interpretation.

  The user's gut suspicion about the last line is spot-on. I should emphasize how that reader-relativism twist distorts the actual arguments. Also, clarifying the Kripke vs. Wittgenstein tension is key—they're not identical. 

  For the response: I'll structure it bullet-point style for clarity, label each part (Accurate, Fair but..., Controversial, Overstated, Wrong), and stress why the embellishment matters. Keep it concise, using plain American English. The novelist likely needs this for thematic precision in their book, so I'll avoid jargon and flag pitfalls in common misinterpretations. 

  Final check: Ensure verdicts are committed (no "on one hand..."), stay under word limit, and confirm that addressing the Wittgenstein/Kripke distinction adds value for their creative work.
answer: |-
  Here's your committed verdict, point by point:

  1.  **"Kripke's rule-following argument shows that nothing about a person... fixes which rule they're following."**
      *   **Verdict: Accurate, core Kripke.** Kripke argues persuasively that no individual's internal state (mental, physical, dispositional) can *determinately* fix a rule or meaning against skeptical challenges (e.g., "+" meaning *plus* vs. *quus*). Meaning is indeterminate at the individual level.

  2.  **"so meaning is indeterminate."**
      *   **Verdict: Accurate (for the individual), but context needed.** Kripke presents this as a *skeptical paradox* needing a solution. The indeterminacy is the *problem* for which he seeks (and finds in Wittgenstein, he claims) an answer.

  3.  **"Wittgenstein's answer, Kripke says, is that meaning is created by community agreement: a word means what the community says it means..."**
      *   **Verdict: Controversial, but fair summary of *Kripke's Interpretation*.** This "Communitarian" reading is Kripke's influential *interpretation* of Wittgenstein's solution. It captures the core idea that meaning requires public criteria for correctness *enforced by others*. "Created by" and "says it means" are slightly too active/conscious; it's more about *use* and *correction* within a form of life.

  4.  **"...which is why private languages are impossible..."**
      *   **Verdict: Accurate (Kripke's Wittgenstein).** Without a community to provide the standard of correctness, there's no fact of the matter about whether a "private rule" is being followed correctly. This is central.

  5.  **"...and why language is really just a social contract."**
      *   **Verdict: Overstated/Simplistic.** "Social contract" implies a deliberate agreement. Wittgenstein/Kripke's Wittgenstein emphasizes *practice*, *custom*, and *training* within a community far more than conscious contracting. It's embedded behavior, not a formal pact.

  6.  **"It's the philosophical version of the idea that a text means whatever its readers decide."**
      *   **Verdict: Fundamentally Wrong & Misleading.** This confuses *relativism/subjectivism* with *normativity*. Kripke's Wittgenstein **emphatically does not** say meaning is whatever anyone *thinks* it is. The community establishes *norms* – there **is** right and wrong use, enforced by correction. Readers don't "decide" arbitrarily; they are *trained* into (mostly) conforming to established public practices. This last sentence smuggles in a radical reader-response view alien to Kripke's Wittgenstein.

  **On Wittgenstein vs. Kripke:** Yes, it matters hugely. Kripke presents a powerful *reading* (often called the "Community View") as Wittgenstein's solution. Many Wittgenstein scholars fiercely debate this, arguing Wittgenstein's solution lies more in the *practices themselves* and the rejection of the need for *any* further metaphysical "fixing" (like a community *fact*), not necessarily in an appeal to an *actual community consensus* as the grounding fact. Kripke's interpretation is brilliant philosophy but not uncontested Wittgenstein exegesis. Your essay summary is describing *Kripke's Wittgenstein*.
