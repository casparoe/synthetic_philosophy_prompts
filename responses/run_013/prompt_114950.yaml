answer: |-
  **Joint Commission for Accreditation and Institutional Responsibility Optimization (JCAIRO)**  
  **Standard 7.3 — Classification, Recording, and Reporting of Recordable Omissions**  
  **Effective Date: 01 January 2025**  
  **Version: 3.2**

  **7.3.1 SCOPE AND APPLICABILITY**  
  This Standard applies to all JCAIRO-accredited entities (hereafter "Facilities") involved in patient care delivery. It governs the classification, documentation, and reporting of Patient Outcome Events (POEs) arising from, or materially influenced by, clinical or operational omissions, as distinct from acts of commission. Compliance is mandatory for maintaining Condition-Level Accreditation under JCAIRO Framework 5.0 (see Standard 1.1, "Foundational Accountability Infrastructure").

  **7.3.2 DEFINITIONS**  
  *(a) Omission:* The absence of an intervention or action that was (i) Factually Possible (FP), (ii) Procedurally Permissible (PP) under prevailing Facility policy or applicable law, and (iii) Counterfactually Salient (CS) – meaning the patient outcome demonstrably depended on its non-occurrence (i.e., had the intervention occurred, the outcome would likely have been materially different).  
  *(b) Act of Commission:* A positive physical intervention directly applied to the patient or their immediate therapeutic environment.  
  *(c) Recordable Omission (RO):* An Omission meeting Tier thresholds defined in 7.3.3 and requiring formal entry into the Facility's Central Omission Registry (COR) per 7.3.9.  
  *(d) Duty Anchor Point (DAP):* The specific moment or condition establishing the Facility’s affirmative duty to act on behalf of a specific patient. DAPs include, but are not limited to: patient registration, physician admission order, assumption of monitoring responsibility (e.g., telemetry initiation), or activation of a treatment protocol.  
  *(e) Resource-Neutral Omission (RNO):* An Omission occurring when all potentially effective interventions are demonstrably unavailable within the Facility at the relevant time (see 7.3.4(c)).  
  *(f) System-Initiated Non-Intervention (SINI):* An Omission resulting from the output or operational parameter of an automated clinical decision-support system, triage algorithm, or resource allocation protocol that declines to initiate or escalate care.  
  *(g) Grandfathered Practice Omission (GPO):* An Omission arising from a clinical pathway or policy in effect prior to 01/01/2025, not subsequently modified, and meeting criteria under 7.3.7.

  **7.3.3 CLASSIFICATION TIERS**  
  Recordable Omissions shall be classified into Tiers based on Outcome Severity (OS) and Duty Anchor Point Proximity (DAPP):  
  *(a) Tier 1 (Reportable Sentinel Omission):*  
      *   OS: Patient death or permanent major disability.  
      *   DAPP: Omission occurs after a definitive DAP is established.  
      *   *Examples:* Failure to administer ordered life-sustaining medication; SINI declining escalation for patient meeting escalation criteria.  
  *(b) Tier 2 (Significant Care Process Omission):*  
      *   OS: Major temporary harm, significant prolongation of hospitalization, or preventable readmission within 30 days.  
      *   DAPP: Omission occurs post-DAP or relates to a failure to establish a DAP where one was reasonably indicated (e.g., failure to admit from ED).  
      *   *Examples:* Delay in initiating antibiotic therapy for severe sepsis; Algorithm failure to flag critical lab trend.  
  *(c) Tier 3 (Procedural Omission):*  
      *   OS: Minor harm or deviation from expected care pathway without significant outcome impact.  
      *   DAPP: Omission occurs within a defined care process post-DAP.  
      *   *Examples:* Missed routine vital signs per protocol; Failure to document allergy check.  
  *(d) Non-Recordable Omission (NRO):*  
      *   (i) *RNO:* Omission due solely to lack of available, effective intervention (e.g., no ICU bed available *and* no viable transfer option *and* no temporizing measure possible).  
      *   (ii) *Pre-DAP Omission:* Omission occurring prior to establishment of a formal DAP (e.g., failure to seek care prior to ED arrival).  
      *   (iii) *Non-Counterfactually Salient Omission (NCSO):* An omitted intervention that, based on objective medical evidence available at the time, would not have altered the outcome.  
      *   (iv) *GPO:* Meeting criteria under 7.3.7.

  **7.3.4 KEY CLASSIFICATION PRINCIPLES**  
  *(a) Symmetry of Initiation and Cessation:* Withholding an intervention not currently being provided, and withdrawing an identical intervention currently being provided, shall be classified identically based on the counterfactual impact of its absence on the outcome. (e.g., Not starting ventilator support vs. discontinuing ventilator support are equivalent omissions relative to the outcome of respiratory failure if CS applies).  
  *(b) Causal Primacy of Inaction:* An Omission, not a pre-existing condition or disease process, shall be designated the primary causal factor for the outcome if:  
      *   (i) The outcome was not imminent or inevitable at the time of the Omission;  
      *   (ii) The omitted intervention was FP, PP, and CS; and  
      *   (iii) No intervening Act of Commission directly caused the outcome.  
  *(c) Resource Scarcity Contextualization:* The unavailability of resources must be rigorously verified for RNO classification. Unavailability must be systemic and documented in real-time resource logs (see JCAIRO Standard 8.4, "Resource Availability Attestation"). Decisions *not to acquire* or *allocate away* resources constitute potential Omissions at the administrative level (see 7.3.6).  
  *(d) SINI Equivalence:* SINIs constitute Omissions attributable to the Facility responsible for the system's deployment, configuration, and operational oversight. The "act" of the system generating the output is not an Act of Commission; the Omission lies in the system's failure to generate an output triggering necessary intervention, or its generation of an output preventing escalation that was FP, PP, and CS.  
  *(e) Foreseen Side-Effect Neutrality:* The cessation of an intervention due to its foreseen but unintended side-effects (e.g., stopping chemotherapy due to neutropenia) shall not be classified as an Omission related to the underlying disease progression, provided cessation was PP and medically appropriate. The outcome is attributed to the disease process.

  **7.3.5 CERTIFICATION REQUIREMENTS**  
  Facilities must demonstrate:  
  *(a) COR Implementation:* A secure, auditable Central Omission Registry (COR) distinct from adverse event reporting systems focused on Acts of Commission.  
  *(b) Omission Review Panels (ORPs):* Multidisciplinary panels (minimum: Clinical Ethicist, Risk Management, Quality Officer, Clinical Specialist) trained in JCAIRO 7.3 classification principles to review all potential Tier 1 & 2 events within 30 days.  
  *(c) SINI Audit Protocols:* Procedures for weekly algorithmic audit trails verifying SINI outputs against patient acuity scores and resource availability data. Logs must demonstrate FP/PP/CS analysis for each SINI.  
  *(d) Duty Anchor Point Mapping:* Documented procedures clearly defining the establishment of DAPs for all care settings.  
  *(e) Annual Attestation:* CEO and CMO joint attestation to JCAIRO affirming robust 7.3 compliance and accurate RO reporting.

  **7.3.6 ADMINISTRATIVE-LEVEL OMISSIONS**  
  Decisions impacting resource allocation *prior* to a specific patient encounter (e.g., bed closures, staffing model reductions, non-purchase of equipment) that subsequently create conditions leading to a patient-level Omission are classified as **Systemic Resource Allocation Omissions (SRAOs)**. SRAOs are Tier 1 if linked to a patient-level Tier 1 RO. SRAOs require separate entry in the COR with linkage to resultant patient-level ROs. Reporting to JCAIRO is aggregate (number/type of SRAOs) unless directly linked to a reportable sentinel event.

  **7.3.7 GRANDFATHERING OF LEGACY PRACTICE (GPO)**  
  Established clinical pathways, standing orders, or protocols in effect prior to 01/01/2025 that inherently involve Omissions (e.g., DNAR protocols, criteria-led discharge triggers, established triage algorithms) qualify as GPOs. Omissions arising directly from adherence to a documented GPO are classified as Non-Recordable (NRO) under Tier (d)(iv). GPO status is void if the pathway/order/protocol is substantively modified post-01/01/2025.

  **7.3.8 AUDIT REQUIREMENTS**  
  JCAIRO surveyors will:  
  *(a)* Review COR entries for 5% of admitted patients annually, verifying classification accuracy against FP/PP/CS criteria and DAPP mapping.  
  *(b)* Audit 100% of Tier 1 RO documentation and ORP review notes.  
  *(c)* Validate SINI audit trails for a 1-week period.  
  *(d)* Assess SRAO documentation and linkage.  
  *(e)* Verify GPO documentation and absence of substantive modification.  
  Failure rates >10% in any audit area constitute a Condition-Level Deficiency.

  **7.3.9 REPORTING REQUIREMENTS**  
  *(a)* Tier 1 ROs: Reported to JCAIRO within 72 hours via Sentinel Event Reporting Portal (SERP).  
  *(b)* Quarterly Aggregate Reports: Number of Tier 1, Tier 2, Tier 3 ROs; Number of SINIs; Number of SRAOs; Number of RNO attestations.  
  *(c)* Annual Compliance Report: Detailing ORP activity, SINI audits, GPO inventory, and corrective actions for ROs.

  **7.3.10 APPEALS PROCESS**  
  Facilities may appeal JCAIRO survey findings related to Standard 7.3 classification or reporting to the Bureau of Omission Classification Review (BOCR). Appeals must be filed within 30 days, citing specific misapplication of FP, PP, CS, DAPP, or GPO criteria. BOCR decisions are final.

  ---

  **APPENDIX 7.3-A: WORKED CLASSIFICATION EXAMPLES**

  **Case A: The Unweaned Ventilator**  
  *Scenario:* Patient with end-stage COPD, full code, on ventilator for pneumonia. Pneumonia resolves, but patient cannot be weaned. After 3 weeks, ICU team (following hospital policy on long-term ventilation eligibility) determines ventilator withdrawal is medically futile and PP (per policy/Palliative Care consult). Ventilator is withdrawn. Patient dies of respiratory failure 15 minutes later. Family complains.  
  *Classification:* **Tier 1 RO (Withdrawal as Omission).** Outcome (death) counterfactually depended on ventilator absence. Withdrawal is equivalent to withholding under 7.3.4(a). Intervention was FP (ventilator present), PP (per policy), CS (death followed cessation). DAP established at admission/vent initiation. *Not* an RNO (ventilator available). *Not* a side-effect (7.3.4(e)). Primary causal factor is Omission (7.3.4(b)).

  **Case B: The Overlooked Monitor**  
  *Scenario:* Patient on cardiac telemetry post-op. Telemetry alarm sounds for sustained ventricular tachycardia. Nurse is busy with another crashing patient and does not hear/alarm is ignored. 8 minutes later, another nurse finds patient unresponsive. Resuscitation fails. Autopsy confirms VT arrest.  
  *Classification:* **Act of Commission (Failure to Monitor as Active Harm).** *Not an Omission.* The positive Act of Commission is the initiation of continuous telemetry monitoring, establishing a specific, high-acuity DAP and duty of continuous surveillance. The failure to respond is not a passive omission of an independent act, but an integral failure *within* the commissioned act of monitoring itself, directly causing harm through inaction *during* an active duty period. (Contrast with failure to *order* telemetry, which would be a Tier 1 RO).

  **Case C: The Algorithmic Queue**  
  *Scenario:* Hospital uses "AutoBed" algorithm managing ICU admissions. Patient in ED with severe ARDS requires ICU. AutoBed assesses real-time acuity scores, staffing ratios, and bed status. Three ICU beds are technically "available" but flagged as "reserved" for potential post-op cases (despite no scheduled cases for 4 hours). AutoBed assigns patient a "Hold - Monitor for Escalation" status, declining ICU transfer. Patient remains in ED on BiPAP. ED physician, trusting AutoBed's "reserved" flag and overwhelmed, does not manually override. Patient deteriorates 2 hours later. Cardiac arrest. Resuscitation fails.  
  *Classification:*  
      *   **SINI (Tier 1 RO):** AutoBed declined escalation (ICU transfer) that was FP (beds physically available), PP (patient met ICU criteria), CS (earlier transfer likely enables intervention preventing arrest). Output constitutes the Omission.  
      *   **Concomitant Tier 1 RO (Physician):** Failure to override SINI. DAP established at ED arrival. Override was FP and PP (physician discretion permitted). CS applies. Reliance on SINI does not negate ultimate physician responsibility under DAP.  
      *   **Potential SRAO:** If the "reserved bed" protocol was an administrative decision exceeding true clinical need, its creation constitutes an SRAO linked to the patient-level ROs.

  *(End of Standard 7.3)*
