answer: |-
  Here is a breakdown of possible interpretations of "When in Rome, do as the Romans do," ordered from least to most substantive, with verdicts on each:

  1.  **Literal Description:** The proverb merely *describes* observable behavior: Romans do X, so you, being in Rome, are also doing X.
      *   **Verdict:** **Trivial Platitude.** True but useless as guidance. No one denies people in a place often behave similarly.

  2.  **Prudential Advice (Avoiding Annoyance):** Conforming prevents minor social friction or being perceived as rude/obtuse by locals.
      *   **Verdict:** **Defensible & Widely Accepted.** Minimizing friction is often wise and practical for a visitor's comfort.

  3.  **Prudential Advice (Avoiding Sanction):** Conforming helps you avoid formal penalties (fines for jaywalking) or informal sanctions (poor service for not tipping, social censure).
      *   **Verdict:** **Defensible & Widely Accepted (Conditionally).** Pragmatic self-preservation. Strength depends on likelihood/severity of sanction.

  4.  **Obligation Source: Respect for Persons:** You have a moral duty to show respect for the local community and its members by honoring their established ways, simply because they are *their* ways.
      *   **Verdict:** **Substantive & Defensible (but Limited).** Respect is a core moral principle. However, this doesn't automatically make *every* local practice morally binding, especially if it conflicts with deeper values.

  5.  **Obligation Source: Reciprocity/Fair Play:** As a beneficiary of local hospitality/infrastructure/culture, you owe it to your hosts to follow their rules as a matter of fair play.
      *   **Verdict:** **Substantive & Defensible (Conditionally).** Fair play is a strong moral principle. Force depends on the level of benefit received and the nature of the rule. Less applicable to minor etiquette or unenforced laws.

  6.  **Obligation Source: Tacit Consent:** By choosing to enter and remain in the place, you implicitly agree to abide by its prevailing social norms.
      *   **Verdict:** **Substantive but Contested.** The nature and scope of "tacit consent" are philosophically debated. More plausible for essential social coordination norms than for arbitrary conventions.

  7.  **Obligation Source: Custom as Law:** Local custom *is* the binding normative force, superseding formal law where they conflict. "What is done" defines what *ought* to be done.
      *   **Verdict:** **Substantive, Radical, and Often False.** Reduces morality/legitimacy purely to practice ("Might/Custom makes Right"). Ignores that practices can be unjust, inefficient, or contested even locally. Unenforced law may still hold *de jure* authority.

  8.  **Content Fixer (Moral Core + Local Form):** A universal moral principle (e.g., "be respectful," "be fair," "don't cause unnecessary harm") requires local expression. The proverb tells you *how* to fulfill that principle locally.
      *   **Verdict:** **Substantive & Highly Defensible.** Separates the core moral obligation (which exists) from its specific local manifestation (which the proverb identifies). Makes the proverb useful guidance without moral relativism.

  9.  **Epistemic Guide:** When unsure of the *moral* thing to do, or the local law, following custom is the safest or most reliable default guess.
      *   **Verdict:** **Defensible & Pragmatic.** A useful heuristic, especially for complex or unfamiliar situations, but not a source of obligation itself.

  10. **Guest-Specific Deference:** Visitors have a *stronger* obligation to conform than residents, being beneficiaries of unearned hospitality and having less stake/right to challenge.
      *   **Verdict:** **Substantive & Plausible but Limited.** Heightened sensitivity is often expected and prudent. However, it doesn't negate core moral duties or the visitor's right to hold ethical views. Obligation strength likely varies with context (tourist vs. long-term resident).

  11. **Guest-Specific Exemption:** Visitors have a *weaker* obligation to conform, lacking full integration and the ability to easily change practices. Ignorance excuses non-conformity.
      *   **Verdict:** **Partially Defensible.** Ignorance *explains* and often *mitigates* blame for breaches of etiquette or obscure norms, but doesn't automatically *excuse* violations of clear, significant norms, especially if harm results. "Easier to leave" rarely negates basic obligations while present.

  12. **Silencing Critique:** Invoking the proverb asserts that conformity is obligatory *and* that criticizing the local practice is inherently disrespectful or illegitimate for an outsider.
      *   **Verdict:** **Substantive & Generally False/Overreaching.** While critique should be offered respectfully, this interpretation conflates conforming (which may be prudent or respectful in action) with intellectual or moral assent. Outsiders can sometimes see injustices locals normalize.

  **On Contested/Changing Practices & "Who are the Romans?":**
  *   **Verdict:** The proverb **struggles significantly here.** If practices are genuinely contested (tipping %) or rapidly changing, there *is* no single "what the Romans do." The proverb offers no guidance on navigating disagreement. A visitor might: a) follow the most cautious/minimally offensive version, b) follow the practice of their immediate host/companion, c) abstain if possible, or d) plead ignorance. No interpretation easily resolves this inherent ambiguity.

  **Application to Your Incidents & Final Verdict:**

  1.  **Jaywalking (Flatmate):** Relies primarily on **#7 (Custom as Law)** and **#2 (Avoiding Annoyance - waiting is silly)**. Possibly **#3 (Avoiding Sanction - though sanction unlikely at 2 am)**. The "obligation" claimed stems from custom overriding statute. **Best Reading?** #7 is radical and often false; the stronger justification is #2/3 (prudence/pragmatism). The proverb *as used* ("nobody waits") supports the action pragmatically, but its claim to override law (#7) is weak.
  2.  **Tipping (Local Friend):** Relies primarily on **#4 (Respect for Persons)**, **#5 (Reciprocity/Fair Play)**, **#6 (Tacit Consent)**, and **#10 (Guest-Specific Deference)**. Implicitly rejects the visitor's critique via **#12 (Silencing Critique)**. **Best Reading?** #8 (Content Fixer for Respect/Fairness) is the most defensible core obligation. However, the use leans heavily on #10/#12, demanding deference and silencing critique, which overreach. The proverb *as used* conflates conforming with moral endorsement and overstates the guest's duty of deference regarding a contested practice.

  Neither incident uses the proverb on its *most defensible* reading (#8 - Content Fixer). The jaywalking use prioritizes pragmatic custom (#2/3/7) over law. The tipping use weaponizes it to demand deference and silence dissent (#4/5/10/12) regarding a contested norm. While the proverb offers useful prudential advice (#2, #3) and points to the need to find local expressions for core morals (#8), its common deployments, as in your examples, often overextend it into claims about obligation and authority that are philosophically shaky, especially when practices are illegal, contested, or morally questionable. Its power often lies more in shutting down discussion than in providing sound moral guidance.
