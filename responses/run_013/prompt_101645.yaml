  #### Arithmetic: Expected Utility Calculation
  To determine the optimal disposition, we compare the expected utility (EU) of two fixed dispositions: being disposed to pay (P = true) or not (P = false). The coin A is fair (P(A=heads) = P(A=tails) = 0.5). Omega's letter rule is: send letter iff (A=heads) XOR (you would pay $100 if letter arrives). The payoffs are:
