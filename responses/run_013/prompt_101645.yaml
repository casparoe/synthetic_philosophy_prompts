     - Net utility: -$100.

  4. **A=tails, P=false**:
     - No disaster.
     - Letter? (Tails XOR false) = (false XOR false) = false → no letter sent.
     - No letter, and P=false → no reward (since you wouldn't pay).
     - Net utility: $0.

  Now, calculate expected utility for each disposition:

  - **P=true**:
    - P(A=heads) = 0.5, utility = -$990,000
    - P(A=tails) = 0.5, utility = -$100
    - EU = (0.5 × -990,000) + (0.5 × -100) = -495,000 - 50 = -$495,050

  - **P=false**:
    - P(A=heads) = 0.5, utility = -$1,000,000
    - P(A=tails) = 0.5, utility = $0
    - EU = (0.5 × -1,000,000) + (0.5 × 0) = -$500,000

  **Comparison**: EU for P=true is -$495,050, which is greater than EU for P=false (-$500,000). The difference is $4,950, so being disposed to pay yields higher expected utility. Thus, rationally, the agent should adopt this disposition.

