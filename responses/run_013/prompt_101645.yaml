  - Payment cost if letter arrives and you pay: -$100.
  - Reward if no letter arrives and you would pay: +$10,000.
  - No other costs or benefits.

  We evaluate the four possible outcomes based on A and P:

  1. **A=heads, P=true (disposed to pay)**:
     - Disaster: -$1,000,000.
     - Letter? (Heads XOR true) = (true XOR true) = false → no letter sent.
     - No letter, and P=true → get $10,000.
     - Net utility: -$1,000,000 + $10,000 = -$990,000.

  2. **A=heads, P=false (not disposed to pay)**:
     - Disaster: -$1,000,000.
     - Letter? (Heads XOR false) = (true XOR false) = true → letter sent.
     - P=false → refuse payment, no cost.
     - No letter not sent → no reward.
     - Net utility: -$1,000,000.

  3. **A=tails, P=true**:
     - No disaster.
     - Letter? (Tails XOR true) = (true XOR true) = false? Wait: A=tails means A=heads is false, so (false XOR true) = true → letter sent.
