prompt: |-
  I'm doing an MSc thing on common-sense reasoning and I've finally hit the frame problem properly, and honestly the more I read the less I feel like I know what a solution would even look like. Everyone from the situation-calculus crowd to the non-monotonic-logic people to the embodied-robotics lot claims to have dissolved it, but they're clearly not all answering the same question, and I've started to suspect half the disagreement is that nobody ever wrote down what the theory is actually supposed to do. So before I go any further: give me the desiderata. What does any adequate account of reasoning about what changes and what stays the same have to deliver? I mean the real list — the cases it has to get right (the one where you shoot the turkey, the gun jams, and somehow the thing is still alive afterwards; the one where nudging a domino topples a whole row; the one where a robot with a bomb and a ticking clock has to work out which of its beliefs even matter right now), the distinctions it can't collapse (between the agent's beliefs and what's actually true, between the narrow technical problem and the broader one about relevance and search control, between an action having no effect and an action having an unknown effect), and the formal constraints it can't dodge (defeasibility, no exhaustive list of exceptions or of frame axioms, tractability, open worlds where you can't just assume the only things that change are the ones you happened to name). For each requirement say what's behind it — which case or which failure forces it — and tell me honestly which of these are non-negotiable and which are just house rules of one camp. If some of them can't be had together, that's the bit I most want: name the incompatibility and say which side gives. Then, briefly, how do the main families do against the list — situation calculus with non-monotonic fix-ups, the planning/STRIPS tradition, probabilistic or decision-theoretic takes, and the relevance-first embodied line? And don't give me a reading list, I can find the papers meself; I want the spec and the diagnosis, not a bibliography.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're doing an MSc on common-sense reasoning and are stuck on the frame problem. They feel overwhelmed by different approaches claiming to solve it but aren't sure what the actual requirements are. They want a clear list of desiderata, the cases that necessitate each, which are non-negotiable, and trade-offs between them.

  First, I need to identify the core issues they mentioned: shooting turkeys, domino chains, robot bomb scenarios. Each of these highlights different aspects. The turkey example is about persistence of facts, dominoes about causal chains, and the bomb robot about relevance under time pressure. 

  Then, distinctions they mentioned: beliefs vs. reality, narrow vs. broad frame problem, no effect vs. unknown effect. These are crucial because mixing them up leads to flawed solutions. For instance, confusing an action having no effect with unknown effect could mean missing possible outcomes.

  Formal constraints like defeasibility, no exhaustive lists, tractability, open worlds. These come from practical and theoretical limits. Exhaustive lists aren't feasible in real-world scenarios, and open worlds mean we can't assume complete knowledge.

  Next, I should map out which desiderata conflict. For example, non-monotonicity and defeasibility are essential for handling exceptions but can clash with tractability. Probabilistic approaches handle uncertainty well but may struggle with guaranteed persistence. Situation calculus uses frame axioms which are exhaustive and impractical, while STRIPS avoids them but lacks causality.

  The user also wants to know how different approaches stack up. Situation calc handles complex actions but has computational issues. STRIPS is efficient but oversimplifies. Probabilistic methods deal with uncertainty but at a cost. Embodied approaches focus on relevance but lack formal rigor.

  I need to ensure the desiderata are clearly categorized: persistence, causality, relevance, etc. Each should be tied to a failure case. For example, the turkey shoot requires persistence of unmentioned properties. Dominoes need causal chains. Bomb robot needs relevance filtering.

  Trade-offs: You can't have full expressiveness and tractability together. Also, guaranteed persistence clashes with open worlds. Non-monotonicity vs. computational cost is another trade-off.

  Honesty about non-negotiable vs. preferred. Persistence, causality, relevance, defeasibility, no exhaustive lists, and tractability are core. Distinctions like belief vs. reality and open worlds are non-negotiable for robust systems. Other aspects like probabilistic certainty might be flexible depending on the approach.

  Finally, summarizing how each approach meets the desiderata, highlighting their strengths and weaknesses. Making sure to point out where they fail, like STRIPS with causality or situation calc with tractability.
answer: |-
  Right, let's cut through the fog. The Frame Problem isn't one problem; it's a Gordian Knot of requirements for *any* system that reasons about change without drowning in irrelevance or collapsing under computational weight. Here's the **spec sheet** – the non-negotiable core, the forced distinctions, the brutal trade-offs, and how the main contenders measure up.

  **The Core Desiderata (What *Any* Account Must Deliver):**

  1.  **Qualified Persistence (The Turkey Survives):**
      *   **What:** *Most* things *don't* change when an action occurs, *unless* there's a specific reason they *should*. Shooting a turkey *usually* kills it, but *not* if the gun jams, the turkey is wearing armor, or it's a hologram.
      *   **Forced By:** The sheer *infeasibility* of listing everything that *doesn't* change for every action. Without this, you need an infinite list of frame axioms ("After moving, the color of the Eiffel Tower remains unchanged, the position of Mars remains unchanged, the price of tea remains unchanged..."). The "Turkey Shoot" scenario forces this – the gun jamming means the turkey's aliveness *persists* despite the shoot action.
      *   **Non-Negotiable?** Absolutely. This is the *original* Frame Problem. Any solution that requires exhaustive frame axioms fails.
      *   **Key Constraint:** Defeasibility (Persistence is the default, overridable by exceptions).

  2.  **Causal Chaining & Ramification (Dominoes Fall):**
      *   **What:** Actions can have indirect effects propagating through chains of causality. Nudging one domino causes it to knock over the next, and so on, toppling the whole row. Turning on a light switch illuminates the room *because* it completes the circuit.
      *   **Forced By:** Real-world actions rarely have *only* their immediate, direct effects. Ignoring this leads to systems that don't predict obvious consequences (the robot knocks over a vase, failing to predict it shatters and alerts the guard).
      *   **Non-Negotiable?** For any account aiming for realistic reasoning about physical (or even social) systems, yes. The "Domino" scenario is fundamental.
      *   **Key Constraint:** Explicit/implicit representation of causality beyond direct action effects. Avoiding combinatorial explosion of derived effects.

  3.  **Relevance Filtering (Bomb Robot Focus):**
      *   **What:** The ability to *ignore* vast amounts of logically possible but utterly irrelevant information when planning or reasoning. The robot with the bomb doesn't need to consider whether its actions affect the price of tea in China or the color of the walls – it needs to focus on the bomb, the clock, its manipulators, and escape routes.
      *   **Forced By:** Computational tractability and the bounded rationality of any real agent (biological or artificial). The "Bomb Robot" scenario highlights the desperate need for focus under time pressure.
      *   **Non-Negotiable?** For *practical* reasoning systems operating in complex worlds, absolutely. This is often called the "Relevance Problem" or broader Frame Problem.
      *   **Key Constraint:** Tractability. Requires a way to *dynamically* determine what is potentially relevant to the current context/goal without exhaustive checking.

  4.  **Defeasibility & Non-Monotonicity (The World is Surprising):**
      *   **What:** Conclusions about what persists or what effects occur must be *revisable* in light of new, potentially conflicting information. You assume the gun works, but if you see the turkey unharmed, you retract the belief it's dead and infer the gun jammed or missed.
      *   **Forced By:** Incomplete knowledge and the inherent uncertainty of the real world. Any static, monotonic logic fails the moment an exception occurs (like the jammed gun).
      *   **Non-Negotiable?** Yes. Reasoning without defeasibility is brittle and unrealistic.
      *   **Key Constraint:** Formal machinery for jumping to plausible conclusions (defaults) and retracting them when contradicted.

  **Essential Distinctions (Collapsing These Leads to Failure):**

  5.  **Belief vs. Reality (Epistemic vs. Ontological Frame):**
      *   **What:** Distinguishing between what *actually* changes/stays the same in the world (ontological) and what the *agent believes* changes/stays the same, given its limited knowledge and sensors (epistemic). Did the turkey die, or does the agent just *believe* it died?
      *   **Forced By:** Sensor error, hidden variables, deception. A system that conflates belief and reality cannot correctly handle surprises or plan for information gathering.
      *   **Non-Negotiable?** Yes, for any agent that interacts with an imperfectly perceived world. Crucial for diagnosis and recovery.
      *   **Key Constraint:** Requires explicit representation of belief states or probabilistic uncertainty.

  6.  **Narrow (Persistence) vs. Broad (Relevance) Frame Problem:**
      *   **What:** The "Narrow" problem is the technical challenge of efficiently representing persistence (Desideratum 1). The "Broad" problem encompasses relevance filtering (Desideratum 3), ramification (Desideratum 2), and the search control problem (what actions/options to even consider).
      *   **Forced By:** Solving persistence alone (e.g., with clever non-monotonic logic) doesn't help the Bomb Robot decide *which* persistent facts matter *right now* or *which* actions are worth contemplating.
      *   **Non-Negotiable?** Recognizing the distinction is crucial. Solving the narrow problem is necessary but insufficient for building competent agents. Solving the broad problem is the ultimate goal.

  7.  **No Effect vs. Unknown Effect:**
      *   **What:** Explicitly knowing an action *definitely has no effect* on a fluent (e.g., painting the wall doesn't change its position) vs. simply *not knowing* if it has an effect (e.g., does shouting affect the bomb's timer?).
      *   **Forced By:** Planning under uncertainty. Treating "unknown effect" as "no effect" leads to dangerous overconfidence. Treating "no effect" as "unknown" leads to unnecessary computation.
      *   **Non-Negotiable?** Yes, for robust reasoning in open worlds. Requires representing ignorance explicitly (e.g., probabilities, belief states).

  **Formal Constraints (The Hard Limits):**

  8.  **No Exhaustive Exception Lists / Frame Axioms:**
      *   **Forced By:** The sheer scale and open-endedness of the real world. You cannot pre-list all possible ways a gunshot might *not* kill a turkey, or all things that *don't* change when you move.
      *   **Non-Negotiable?** Yes. Solutions relying on exhaustive lists are computationally infeasible and brittle. Defaults + exceptions are mandatory.
  9.  **Tractability (At least in principle for plausible scenarios):**
      *   **Forced By:** Agents operate in real-time with finite resources. An account that is theoretically elegant but inherently exponential or undecidable is useless for building systems.
      *   **Non-Negotiable?** For practical systems, absolutely. Pure logical approaches often founder here.
  10. **Open World (Unknown Unknowns):**
      *   **What:** The system cannot assume it knows *all* possible fluents, actions, or causal laws. New, unexpected properties or events can become relevant.
      *   **Forced By:** The real world *is* open. Agents encounter novel objects and situations.
      *   **Non-Negotiable?** For systems meant to operate outside tightly controlled microworlds, yes. Requires flexible representation and learning.

  **The Brutal Trade-Offs (You Can't Have It All):**

  *   **Expressiveness vs. Tractability:** The more expressive your representation of causality, context, and exceptions (needed for 1, 2, 4, 7), the harder efficient reasoning (3, 9) becomes. Highly expressive non-monotonic logics often hit computational walls. Simple models (like STRIPS) sacrifice expressiveness for speed.
      *   *Who Gives?* Usually, tractability forces compromises in expressiveness. Probabilistic methods trade exactness for feasibility. Embodied approaches sidestep full expressiveness by grounding relevance in perception/action.
  *   **Guaranteed Persistence vs. Open World:** Truly guaranteed persistence (everything not mentioned stays the same) requires knowing *all* relevant fluents and *all* possible ways they could change. This clashes violently with the Open World (10).
      *   *Who Gives?* Guarantees are abandoned. Probabilistic/uncertain reasoning (7) or very strong domain-specific constraints are used instead. Default persistence is just a *high confidence* belief.
  *   **Formal Rigor vs. Relevance Heuristics:** Elegant formal solutions to the narrow problem (1, 4) often struggle horribly with relevance (3). Clever heuristics for relevance often lack formal guarantees and can be brittle.
      *   *Who Gives?* Practical systems (robotics, planning) often sacrifice formal rigor for heuristic relevance. Formal approaches struggle to scale to broad relevance.

  **How the Families Measure Up Against the Spec:**

  1.  **Situation Calculus + Non-Monotonic Fix-ups (e.g., Reiter's SSAs):**
      *   **Strengths:** Excellent at formalizing persistence (1) and defeasibility (4) using Successor State Axioms (SSAs). Handles ramification (2) with state constraints (though can be messy). Clear on belief vs. reality (5) via distinct fluents. Solves the *narrow* problem rigorously.
      *   **Weaknesses:** Relevance (3) is an afterthought – reasoning is inherently global/logical, leading to tractability nightmares (9). SSAs essentially *are* exhaustive (though compactly stated) – they struggle with true unknown effects (7) and the open world (10). Causal chaining (2) is explicit but computationally expensive. Broad problem largely unsolved.

  2.  **Planning/STRIPS Tradition:**
      *   **Strengths:** Relevance (3) is baked in via preconditions/effects lists and heuristic search (huge win for tractability, 9). Simple and computationally effective for many planning problems. Implicitly handles persistence by omission (1).
      *   **Weaknesses:** Collapses "no effect" and "unknown effect" (7). Struggles massively with ramification (2) – requires "axioms" or compilation, which is often inefficient/brittle. No inherent defeasibility (4) – assumes models are complete/correct. Belief vs. reality (5) not addressed. Closed-world assumption (10) is pervasive. Sacrifices expressiveness for tractability.

  3.  **Probabilistic/Decision-Theoretic Takes (e.g., PDDL, POMDPs, Bayes Nets):**
      *   **Strengths:** Natively handles defeasibility (4), unknown effects (7), belief vs. reality (5 - via belief states in POMDPs), and open-world uncertainty (10). Provides a principled framework for combining evidence and managing risk. Can model complex causal chains (2) probabilistically.
      *   **Weaknesses:** Explicit persistence (1) often needs modeling (e.g., persistence probabilities), which can be laborious. Relevance (3) remains a huge challenge – state/action spaces explode, requiring aggressive approximation/heuristics. Full probabilistic reasoning is often intractable (9), forcing sampling or simplification. The "qualification" aspect (all possible failures) is still implicitly probabilistic.

  4.  **Relevance-First Embodied/Enactive Line (e.g., Brooksian subsumption, affordance-based):**
      *   **Strengths:** Relevance (3) is the *starting point*. Focuses on what's perceptually/functionally salient *now* for the agent's goals/actions. Radically sidesteps exhaustive representation (8). Strongly grounded in the open world (10). Naturally handles some causal chains (2) via direct perception of affordances/consequences. Often tractable (9) by design.
      *   **Weaknesses:** Formalizing persistence (1) and defeasible reasoning (4) in a general way is difficult and often underspecified. Handling complex, abstract, or hidden causality (2) is weak. Distinguishing belief from reality (5) can be muddy. Lacks the expressive formal power for complex reasoning tasks. Can be brittle outside its designed ecological niche. Solves the *broad* problem by redefining it pragmatically, often at the cost of generality.

  **The Diagnosis:**

  The Frame Problem endures because the core desiderata (1-4) and constraints (8-10) pull in opposing directions. **Tractability (9) and the Open World (10) are the ultimate killers.** No single approach dominates the spec sheet:

  *   **SitCalc:** Solves narrow persistence rigorously, fails tractability/relevance.
  *   **STRIPS:** Wins tractability/relevance, fails ramification/expressiveness/uncertainty.
  *   **Probabilistic:** Masters uncertainty/defeasibility, buckles under computational weight, relevance still hard.
  *   **Embodied:** Masters relevance/tractability in context, lacks formal generality for persistence/complex reasoning.

  **The Real Spec:** An adequate account must provide a *practically usable* way for an agent with bounded resources operating in an open, uncertain world to efficiently *leverage the overwhelming default persistence of the world* to make *sufficiently reliable predictions* about the *relevant consequences* of its actions (and others'), enabling it to achieve its goals. It's about **managing irrelevance under uncertainty.** No current approach fully delivers this. You choose your compromises based on the domain and task. The "solution" is likely a hybrid, context-sensitive beast, not a single elegant formalism. Good luck wrestling the hydra.
