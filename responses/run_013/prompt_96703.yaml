  ### Joint Statement of Adversarial Collaboration: Colony Cognition vs. Nestmate Minimalism

  **Introduction**  
  This document represents an adversarial collaboration between two opposing views on the Ant S colony case: the colony-cognition camp (which holds that the colony is a genuine cognitive system) and the nestmate-minimalist camp (which holds that cognition resides solely in individual ants). We agree on the stipulated facts (a)–(f) and have identified shared commitments, substantive disagreements, and potential resolutions. The goal is to clarify where the dispute is empirical, conceptual, or verbal, and to propose tests that could resolve key issues.

  ---

  ### Part 1: Agreed Claims  
  Both camps endorse the following substantive claims about the stipulated case, cognition, and what the case demonstrates. Each claim commits both sides to specific positions; abandoning any would weaken their arguments. Loose formulations have been sharpened to ensure substantive agreement.

  1. **The colony exhibits adaptive behavior at scales beyond individual ants.**  
     The colony maintains homeostasis (e.g., temperature/humidity regulation in (b)) and adapts to perturbations (e.g., foraging recovery in (d)) over time frames exceeding any ant’s lifespan. This commits both camps to accepting that colony-level adaptation is real and not reducible to the lifetime experiences of individual ants.  

  2. **Colony-level behavior emerges from simple, decentralized interactions.**  
     Individual ants lack global awareness, complex planning, or central coordination (per (a), (f)), and colony outcomes (e.g., foraging strategies in (c)) arise from local ant-to-ant and ant-to-environment interactions. This commits both camps to rejecting any explanation relying on a "central executive" ant or innate colony-wide blueprint.  

  3. **Colony-level descriptions are predictively robust but ontologically contested.**  
     Terms like "foraging strategy," "colony memory," or "colony interest" reliably predict behavior (e.g., persistent strategy shifts in (c) and (d)) and explain outcomes better than individual-level descriptions alone. This commits both camps to accepting that colony-level patterns are scientifically useful, while disagreeing on whether they reflect true cognitive properties or mere instrumental summaries.  

  4. **The colony has distributed, persistent memory.**  
     Information persists beyond individual lifespans (e.g., post-removal behavioral shifts in (d)), stored in the collective configuration of ants, structures, or environmental modifications (e.g., pheromone trails). This commits both camps to acknowledging that memory-like phenomena exist at the colony level, without being housed in any single ant.  

  5. **Individual ants are minimally cognitive, but insufficient for colony outcomes.**  
     Each ant exhibits simple, short-term cognition (e.g., responding to immediate stimuli), but no ant’s behavior explains colony-scale adaptation (per (f)). This commits both camps to attributing basic cognition to individuals while denying that any ant possesses representations of colony-level states (e.g., garden conditions).  

  6. **The colony has biological interests.**  
     The colony acts to survive, grow, and reproduce (e.g., merging/rebuilding in (c) and (e)), and its behavior can be functionally evaluated as successful or mistaken relative to these goals (e.g., maladaptive responses to threats). This commits both camps to a teleological (goal-directed) interpretation of colony behavior, independent of mental states.  

  7. **Representation requires information-carrying states that causally guide behavior.**  
     For any system to represent, it must have states that (i) covary with environmental conditions, (ii) can be inaccurate (e.g., leading to errors), and (iii) play a causal role in adaptive control. This commits both camps to a functionalist criterion for representation, separating this issue from consciousness or "subjecthood."  

  8. **The dispute hinges on necessary conditions for collective cognition.**  
     Whether the colony is cognitive depends on whether decentralized systems can host representational states and whether cognition requires a unified subject. This commits both camps to focusing on criteria (e.g., integration, error-propagation) rather than disputing observed behaviors.  

  ---

  ### Part 2: Disagreements  
  The table below outlines core disagreements. Each row includes a neutrally framed issue, how each camp phrases it, a crux (a resolvable sub-question), a shared test (accepted by both as relevant and definition-neutral), predictions, and which camp(s) would reconsider their position if the test resolves the crux. Tests avoid begging the question (e.g., no test assumes a camp’s definition of "mind").

  | Disagreement in neutral terms | Colony-cognition formulation | Nestmate-minimalist formulation | Crux | Shared test or case | Colony-cognition prediction | Nestmate-minimalist prediction | What settling it would move |
  |-------------------------------|------------------------------|--------------------------------|------|---------------------|----------------------------|-------------------------------|----------------------------|
  | Whether representational states exist at the colony level. | The colony hosts emergent representational states (e.g., "garden is dry") that are causally efficacious, not reducible to ant states. | Representational states only exist in individual ants; colony-level "representations" are observer summaries with no causal role beyond individuals. | Can the colony generate a novel, adaptive response to a combinatorial environmental cue that no ant can perceive? | Introduce two simultaneous cues in separate sectors (e.g., rising humidity in Sector A, falling temperature in Sector B) that must be integrated to trigger a colony-wide response (e.g., relocating the fungus garden). Neither cue alone is sufficient, and no ant traverses both sectors. | Colony produces an integrated response (e.g., garden relocation) tailored to the combined cue, indicating a colony-level representation of the novel environmental state. | Colony produces a disjointed or suboptimal response (e.g., partial reactions to each cue), showing no integration beyond individual ant behaviors. | Both camps: Success supports colony-cognition; failure supports minimalism. |
  | Whether the colony can be mistaken in a way that propagates collective error. | The colony can form inaccurate representations (e.g., "predator present") that cause sustained maladaptive behavior, with errors arising from collective dynamics. | Errors are always individual; colony-level "mistakes" are aggregates of ant errors, not collective misrepresentation. | Can a one-time false cue induce colony-wide maladaptation that persists after the cue is removed? | Introduce a false predator cue (e.g., synthetic alarm pheromone) in a key sector. Remove the cue after 1 hour and monitor foraging for 48 hours. No ant experiences the cue for more than minutes. | Colony-wide foraging suppression persists for >24 hours after cue removal, indicating a self-sustaining false representation. | Foraging recovers fully within hours, as individual ants correct errors through direct environmental feedback. | Both camps: Persistence supports colony-cognition; quick recovery supports minimalism. |
  | Whether colony behavior implies a unified perspective. | The colony integrates information into a single "point of view" (e.g., consistent strategy after merger in (e)), analogous to a subject. | No unified perspective exists; ants respond to local cues, and colony-wide consistency is coincidental. | Does conflicting information produce inconsistent colony behavior? | Present opposing cues: abundant food in Sector A, predator cues in Sector B. Observe if foraging is coordinated colony-wide (e.g., uniform avoidance) or fragmented. | Colony exhibits uniform, prioritized behavior (e.g., avoidance across all sectors), indicating integrated decision-making. | Behavior is inconsistent (e.g., foraging in A, avoidance in B), reflecting isolated ant responses. | Colony-cognition camp: Inconsistency challenges their view; minimalists are unmoved (they predict inconsistency). Settling shows if integration occurs. |
  | Whether cognition requires a subject for representational states. | Cognition does not require a "subject"; distributed systems can host representations if states function adaptively. | Representation requires a subject (e.g., an ant) for whom the state is "about" something; no subject exists at colony level. | If functional representation is confirmed (via tests above), does this imply cognition without a subject? | Conceptual analysis: If tests confirm colony-level representation (e.g., novel integration, persistent error), must we posit a subject? | No: Functional role suffices for cognition; the subject is the colony as a whole. | Yes: Without a subject (e.g., a locus of experience), it's merely complex feedback. | Neither camp: This crux is idle; settling functional representation (above) moves both, but subjecthood is a separate, untestable commitment. |

