prompt: |-
  I'm trying to get clear on what a theory of "the value of the original" would even have to do before I trust any of the ones people hand me. So write me the desiderata -- the spec -- for a theory of why originals are worth more than copies, when they are. Not the theory itself, the requirements list.

  What I want in it:

  - the cases it has to get right, with the case behind each requirement. Off the top of my head: a painting that turns out to be a forgery and drops in value overnight even though not one molecule of it changed; a copy so exact that nothing could tell it apart, down to atom-for-atom arrangement (call it a perfect twin); a replica that's openly sold as a replica and still loved; a work restored so heavily that almost none of the original material is left; a work that survives only as a later copy of a lost original; a piece the artist themselves remade or re-performed with other hands doing the work; and a non-aesthetic memento -- a wedding ring, the pen a treaty was signed with -- where nobody claims it's beautiful but the original-ness is the whole point.

  - the distinctions it can't just collapse: aesthetic value vs. artistic value vs. the value of being the actual object at the actual event (the it-was-there value); the value of the thing vs. the value of the experience of it; the epistemic value of knowing it's real vs. whatever the realness is worth to someone who never finds out; and the difference between an autographic work, where the copy is never the thing, and one where copies are just instances (a novel, a score).

  - the puzzles it has to dissolve or explain: how the value can change on a reattribution when nothing physical changes; how two indistiguishable things can differ in value at all; why provenance premiums exist; and the one that nags me -- if the perfect twin is worth less, what exactly is the extra thing, and where does it live?

  - the constraints it has to stay consistent with: copies can be as beautiful as originals; some originals are ugly or falling apart; a good photograph of a painting hands you a lot of what you wanted; and markets really do price the real thing higher.

  Then tell me which of the requirements are non-negotiable and which are just the prejudices of one camp, and -- this is the part I care about most -- whether some pair of them is jointly unsatisfiable. I've got a suspision that "value has to be a matter of the object's intrinsic properties" and "the discovery case is real" can't both hold, but you tell me if that's the right fault line or if it's somewhere else.

  Also: which single requirement does the most to kill off the popular theories -- the it's-all-about-beauty one, the it's-just-sentimental one, the aura one? Keep the scoring short, a line each; I mostly want the list and the fault line.

  One more thing to fold in: there's a case where a forger had to prove the works were his own forgeries in order to escape a much worse charge, and I want the theory to say something about that, because the wrong there doesn't seem to be about beauty at all. Don't cite it, I know the case; just tell me what a theory of original-value owes us about it.
reasoning: |-
  Okay, the user is asking for a detailed specification for a theory explaining why originals are valued more than copies. They want a list of requirements, including cases the theory must handle, distinctions it shouldn't collapse, puzzles it needs to resolve, and constraints it must satisfy. They also want to know which requirements are non-negotiable, if any pairs conflict, and which requirement challenges popular theories the most.

  First, I need to break down their query into parts. They mentioned several cases: forgery dropping value without physical change, perfect twins, replicas sold as such, heavily restored works, copies of lost originals, artist remakes, and non-aesthetic mementos. Each of these needs to be addressed in the desiderata. Then distinctions like aesthetic vs. artistic value, "it-was-there" value, value of the object vs. experience, epistemic value, and autographic vs. allographic works. Puzzles include value change on reattribution, indistinguishable objects differing in value, provenance premiums, and the "extra thing" in perfect twins. Constraints involve copies being as beautiful, originals being ugly, photographs providing value, and market pricing.

  The user suspects a conflict between intrinsic properties and the discovery case. I should explore if those are incompatible. Also, they mentioned a forger proving their work to avoid charges, which adds a legal/moral dimension. The theory needs to explain why forgery is wrong beyond aesthetics.

  For the desiderata list, I'll organize it into sections: Cases, Distinctions, Puzzles, Constraints. Each case should have a brief reason why it's included. The distinctions need clear definitions to prevent conflation. Puzzles require solutions, not just acknowledgment. Constraints are boundary conditions the theory must respect.

  Non-negotiable requirements likely include the forgery case (value change without physical change), the perfect twin puzzle (indistinguishable but different value), and the autographic/allographic distinction. The conflict might be between intrinsic properties and extrinsic factors like provenance. If value depends on history, then intrinsic properties alone can't explain the discovery case.

  Popular theories like aestheticism (only beauty matters) fail on non-aesthetic mementos. Sentimentalism can't explain market premiums. Aura theories might struggle with perfect twins. The legal case of the forger shows that the wrong involves deception and authenticity, tying into epistemic and moral aspects.

  The user's deeper need might be understanding if authenticity's value is coherent or just irrational. They might want to know if a consistent theory is possible or if contradictions are inherent. Highlighting the fault line between intrinsic and historical properties addresses their suspicion. Also, clarifying which requirements are essential versus contested helps them evaluate theories critically.
answer: |-
  Here’s the specification ("spec") for a theory of the value of the original, structured by your requirements. The fault line you suspect is critical, and the legal case sharpens it.

  **Desiderata for a Theory of the Value of the Original**

  **I. Cases It Must Get Right (With Core Challenge):**
  1.  **The Forgery Devaluation:** A painting revealed as a forgery plummets in value *despite no physical change*. *(Challenge: Value isn't solely in current physical properties or aesthetic experience).*
  2.  **The Perfect Twin:** An atom-for-atom identical duplicate of an artwork is created. The original is valued more. *(Challenge: Value isn't in perceptible or measurable physical properties alone).*
  3.  **The Loved Replica:** A high-quality replica, openly sold as such, is cherished and valued (e.g., museum gift shop poster). *(Challenge: Originals aren't *always* valued more; copies can have significant value too).*
  4.  **Ship of Theseus Restoration:** An artwork is restored over time until almost none of the original material remains, yet it retains "original" status and value. *(Challenge: Value isn't strictly tied to the *quantity* of original matter).*
  5.  **Surviving Copy:** A later copy (e.g., ancient Roman copy of a lost Greek statue) is the only surviving record of the original work and is highly valued *as that record*. *(Challenge: Value can transfer to a copy *because* it stands in for a lost original).*
  6.  **Artist-Authorized Remake:** The artist personally directs or authorizes a precise remake of their own work, executed by others (e.g., re-staging a performance, re-casting a sculpture). The remake is valued less than the "original" instance. *(Challenge: Value isn't solely in the artist's conception/authorization; the specific historical instance matters).*
  7.  **Non-Aesthetic Memento:** A mundane object (e.g., the pen used to sign a treaty, a worn wedding ring) has high value solely due to its direct participation in a significant event, not its beauty or design. *(Challenge: Value is entirely contingent on unique historical connection, independent of aesthetic or artistic qualities).*

  **II. Distinctions It Must Preserve:**
  1.  **Aesthetic Value (Sensory Experience)** vs. **Artistic Value (Achievement/Concept)** vs. **"It-Was-There" Value (Historical Particularity):** The theory cannot conflate the beauty/experience of the object, the genius/skill of its creation, and the brute fact of its unique participation in history.
  2.  **Value of the Object (Itself)** vs. **Value of the Experience (Engagement):** Must distinguish the value assigned to the specific physical/historical entity from the value derived from interacting with it (or a copy).
  3.  **Epistemic Value (Knowing it's Real)** vs. **Value of Realness Itself:** Must account for value derived from *knowing* it's the original (even if unseen) versus any inherent value the realness might have *regardless* of knowledge (e.g., does the perfect twin have less "realness value" if no one ever knows?).
  4.  **Autographic Works (Identity = Specific Physical Instance - e.g., painting)** vs. **Allographic Works (Identity = Compliant Instance - e.g., novel, musical score):** Must explain why the "original" concept is paramount for the former but often irrelevant for the latter (beyond first editions/manuscripts).

  **III. Puzzles It Must Dissolve/Explain:**
  1.  **Reattribution Shock:** How value collapses/soars upon discovery of true origin/fakery *without physical alteration*. (Directly tied to Cases 1 & 6).
  2.  **Indistinguishability vs. Value Difference:** How two physically/experientially identical things (Perfect Twin) can have different values. (Directly tied to Case 2).
  3.  **Provenance Premium:** Why documented history of ownership adds significant value beyond the object's appearance.
  4.  **The "Extra Thing" Question:** *If* the Perfect Twin is worth less, what *is* the extra value in the original? Where does this value reside? (The core ontological puzzle).

  **IV. Constraints It Must Satisfy:**
  1.  Copies *can* possess equal or near-equal aesthetic value/beauty.
  2.  Originals *can* be aesthetically displeasing, damaged, or fragmentary yet still highly valued.
  3.  High-quality reproductions (photos, scans, casts) *can* deliver a significant portion of the aesthetic/experiential value.
  4.  Markets *consistently* price verified originals higher than copies/replicas, even when constraints 1-3 hold.

  **V. The Legal/Forgery Case Requirement:**
  *   The theory must explain why the act of forgery (and the forger's subsequent proof of it) involves a significant *wrong* beyond potential copyright infringement or fraud for profit. It must account for the harm done to collectors/institutions (deceived about the object's history/authenticity), the violation of trust in the art ecosystem, and the specific devaluation that occurs upon revelation – all independent of the object's beauty or the forger's skill. It highlights **deception about historical particularity and provenance** as a core harm.

  **Analysis:**

  *   **Non-Negotiable Requirements:** Cases 1 (Forgery), 2 (Perfect Twin), 7 (Non-Aesthetic Memento); Distinctions 1 & 4; Puzzles 1, 2, & 4; Constraints 1, 2, & 4; and the explanation for the Legal/Forgery wrong. These define the core phenomena the theory *must* address. Failing any of these likely means the theory is incomplete or incorrect.
  *   **Potentially Contested/Interpretive Requirements:** The *degree* to which Constraint 3 (reproductions providing value) limits the theory, the precise balance between Epistemic Value and Value of Realness Itself (Distinction 3), and how strictly to interpret Case 6 (Artist Remake) – some might argue strong authorization *can* make a remake an "original" instance.
  *   **The Fault Line (Joint Unsatisfiability):** Your suspicion is **correct and central**. The requirement that value must be based **solely on intrinsic properties** (current physical state, perceptible qualities) is **fundamentally incompatible** with:
      *   **Case 1 (Forgery):** Value changes, object doesn't.
      *   **Case 2 (Perfect Twin):** Identical intrinsic properties, different value.
      *   **Puzzle 1 (Reattribution):** Value changes based on new *information*, not the object.
      *   **Case 7 (Memento) & Provenance Puzzle:** Value depends on *extrinsic* history.
      *   **Legal/Forgery Case:** The wrong involves deceiving people about *extrinsic* facts (origin, history).
      *   **Constraint 4 (Market Pricing):** Markets price based on verified *provenance/history*, not just appearance.
      *   **Distinction 1 & 4:** Require recognizing non-intrinsic sources of value.
      **Conclusion:** Any viable theory *must* incorporate **extrinsic, historical properties** (causal origin, chain of custody, participation in events) as fundamental sources of value alongside intrinsic properties. The value of the original resides significantly in its **unique historical identity and narrative**, not just its current state. The "extra thing" for the Perfect Twin is the *actual history* of being created by the artist at a specific time/place, participating in events, etc.

  **Killing Popular Theories (One Line Each):**

  1.  **"It's All About Beauty" (Aestheticism):** **Destroyed by Case 7 (Non-Aesthetic Memento).** The ugly pen has value solely due to its history, not beauty.
  2.  **"It's Just Sentimental Value":** **Destroyed by Puzzle 2 (Perfect Twin) & Constraint 4 (Market Pricing).** Indistinguishable objects command different market prices; value isn't just personal emotion.
  3.  **"It's the Aura" (Benjamin-esque):** **Struggles severely with Case 2 (Perfect Twin).** If aura is a perceivable quality, why doesn't the identical twin have it? If it's non-perceivable historical essence, the theory needs much more precise ontology than usually provided.

  This spec defines a demanding but necessary framework. The fatal flaw for simplistic theories is the **irreducible significance of unique historical particularity and causation**, which market behavior, legal consequences, and our intuitions about mementos and forgeries consistently validate, even when it defies pure physicalism or aestheticism.
