  **MUNICIPAL STATUTORY INSTRUMENT 2024-07**
  **THE HEAP REGULATION ORDINANCE**

  **RECITALS**

  A.  The Council has observed the presence within the City of accumulations of grains presenting in varying magnitudes.
  B.  It is necessary for the orderly administration of affairs, including taxation, nuisance control, and public safety, to distinguish categorically between a Pile and a Heap.
  C.  The Council finds as a matter of established physical fact that the addition or removal of a single grain from any accumulation of grains cannot, of itself, effect a change in the classification of that accumulation as either a Pile or a Heap.
  D.  A precise numerical threshold (hereinafter "the Threshold Number") exists in nature, separating Piles from Heaps.

  **SECTION 1: DEFINITIONS**
  1.  "Grain" means any individual unit of cereal crop, sand, gravel, or similar particulate matter.
  2.  "Accumulation" means any collection of Grains gathered in one location.
  3.  "Pile" means an Accumulation containing fewer grains than the Threshold Number.
  4.  "Heap" means an Accumulation containing the Threshold Number of grains or greater.
  5.  "Tribunal" means the Grain Classification Tribunal established under Section 4.

  **SECTION 2: OFFENCE - ASSERTION OF THRESHOLD KNOWLEDGE**
  1.  It is an offence for any person to assert, in any public forum, official proceeding, or documented communication, knowledge of the specific value of the Threshold Number.
  2.  Upon conviction under subsection (1), the offender is liable to a fine not exceeding Level 2 on the Standard Scale.
  3.  If, subsequent to conviction under subsection (1), it is conclusively demonstrated that the assertion made by the offender was indeed the correct Threshold Number, the fine imposed shall be doubled.

  **SECTION 3: OFFENCE - PROHIBITED ARGUMENTATION (THE MARCH)**
  1.  In any proceeding before any court, tribunal, or administrative body within the City, including proceedings under this Ordinance, it is an offence to advance, or cause to be advanced, any argument of the following forms:
      (a) That, because an accumulation of *n* grains is classified as a Heap, an accumulation of *n+1* grains must necessarily also be classified as a Heap.
      (b) That, because an accumulation of *n* grains is classified as a Pile, an accumulation of *n-1* grains must necessarily also be classified as a Pile.
  2.  Upon conviction, the offender is liable to a fine not exceeding Level 3 on the Standard Scale.

  **SECTION 4: GRAIN CLASSIFICATION TRIBUNAL**
  1.  There is hereby established the Grain Classification Tribunal.
  2.  The Tribunal shall have jurisdiction to determine the classification of any Accumulation presented to it where the total grain count is not manifestly above or below the Threshold Number as established in Schedule 1.
  3.  In making its determination, the Tribunal shall:
      (a) Identify all potential values the Threshold Number might permissibly hold under Schedule 1.
      (b) Apply each such potential value to the grain count of the Accumulation in question.
      (c) Classify the Accumulation as a Heap only if, under every potential value identified in (a), the Accumulation's grain count meets or exceeds that value.
  4.  The Tribunal shall not publish, or include in any publicly accessible record, which specific potential value or values it relied upon in reaching its determination for any individual case. Publication of such reliance is prohibited on the grounds that it might establish a precedent, and a precedent might constitute an operational boundary.
  5.  The composition and procedure of the Tribunal shall be prescribed by regulations issued by the Council Clerk.

  **SECTION 5: BORDERLINE DETERMINATION SUB-COMMITTEES**
  1.  There is established the Primary Borderline Determination Sub-Committee (PBDSC).
  2.  The function of the PBDSC is to receive applications concerning an Accumulation and determine definitively whether the Accumulation's classification status is:
      (a) Clearly a Pile;
      (b) Clearly a Heap; or
      (c) Subject to Section 4(2) (i.e., requiring Tribunal determination).
  3.  A determination by the PBDSC that an Accumulation falls under Section 5(2)(c) is subject to appeal to the Secondary Borderline Determination Sub-Committee (SBDSC).
  4.  The SBDSC shall review the PBDSC determination *de novo* and shall itself determine definitively which of the categories under Section 5(2) applies to the Accumulation. The decision of the SBDSC is final.

  **SECTION 6: REGULATORY FEES**
  1.  An annual regulatory fee is hereby imposed on every Heap within the City boundaries.
  2.  The fee payable shall be calculated according to the formula specified in Schedule 2 (Fee Schedule).
  3.  Accumulations classified as Piles are exempt from the fee under this Section.

  **SECTION 7: COMPANION SCHEDULE**
  The provisions of Schedule 3 (Baldness Classification Companion Schedule) are hereby adopted and incorporated into this Ordinance by reference, mutatis mutandis, for the regulation of scalp hair accumulations deemed to constitute a public nuisance.

  **SECTION 8: COMMENCEMENT**
  This Ordinance shall come into force on the day the number of Heaps within the City first reaches a sufficient number, as determined by the Council Clerk by notice in the Municipal Gazette.

  **SCHEDULE 1: THRESHOLD NUMBER**
  1.  The Threshold Number, being the exact number of Grains at which an Accumulation ceases to be a Pile and becomes a Heap, is fixed at **[REDACTED]**.
  2.  The Threshold Number fixed in paragraph 1 is an objective fact concerning the physical world.
  3.  Notwithstanding paragraph 2, the specific value of the Threshold Number cannot be ascertained, established, or disclosed through any process of inspection, measurement, counting, estimation, or census.

  **SCHEDULE 2: FEE SCHEDULE**
  1.  The annual regulatory fee (F) for a Heap shall be calculated as follows:
      F = (G / T) * B
      Where:
      G = Verified number of Grains in the Heap.
      T = The Threshold Number (Schedule 1).
      B = Base Fee Amount (£100).
  2.  Fees are payable quarterly in arrears.

  **SCHEDULE 3: BALDNESS CLASSIFICATION COMPANION SCHEDULE**
  *(Structure and provisions identical to Schedules 1 & 2 and Sections 1-6, adapted for scalp hairs and "Hirsute"/"Bald" classifications, with equivalent offences, tribunal, sub-committees, and graduated fees based on hair count. The Threshold Number of hairs is similarly fixed and undisclosable.)*

  **EXPLANATORY NOTE**
  *(Issued by the Council Clerk for Guidance Only)*
  This Ordinance provides a definitive framework for classifying accumulations of grain (and, by Schedule 3, scalp hair) as either Piles or Heaps (or Hirsute/Bald), addressing regulatory needs. Section 6 and Schedule 2 ensure fees are proportionate; an accumulation of 500 grains, for example, would incur half the full Heap fee (assuming the Threshold Number is 1000). Consequently, a statement asserting that "If 500 grains is a Heap, then 501 grains is a Heap" would be assessed as half-true under the Ordinance's fee calculation regime. The Tribunal (Section 4) and Sub-Committees (Section 5) provide robust mechanisms for resolving classification uncertainties without creating precedents that could undermine the fixed Threshold principle. The offence provisions (Sections 2 & 3) safeguard the integrity of the classification system.

  **DISSENTING APPENDIX**
  **(Councillor A. Naxos, recorded in Council Minutes 2024-07-15)**

  "I voted against this Ordinance. It makes no sense. We say adding one grain never matters, but also say there's a magic number where it suddenly *does* matter, which we know but can't know and mustn't say. We set up layers of committees to avoid deciding the hard cases based on that number we can't use, and fine people for pointing out the obvious contradiction. We even start enforcing it only when there are 'enough' heaps, without saying how many 'enough' is. It solves nothing; it just builds a machine to hide the problem." *[Motion carried; dissent noted.]*
