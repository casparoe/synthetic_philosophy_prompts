  ### Constructed Case for the Voting Rule

  The voting rule assigns points as follows: 2 for top, 1 for middle, -1 for bottom. Ties for the highest total are broken alphabetically (A before B before C). The rule is resolute, defined for exactly three alternatives (A, B, C) and five voters, and is onto (each alternative can win). It is anonymous and neutral except for the tie-break. Gibbard–Satterthwaite applies since there are ≥3 alternatives, the rule is onto and non-dictatorial, so it must be manipulable. Below, I construct a profile and a manipulation meeting your specifications.

  #### Honest Profile, Tally, and Winner
  - **Voter 1:** A > B > C  
  - **Voter 2:** A > B > C  
  - **Voter 3:** A > B > C  
  - **Voter 4:** B > C > A  
  - **Voter 5:** C > B > A  

  **Honest Tally:**  
  - A: (2 + 2 + 2) + (-1) + (-1) = 4  
  - B: (1 + 1 + 1) + 2 + 1 = 6  
  - C: (-1 -1 -1) + 1 + 2 = 0  
  **Honest Winner:** B (score 6, no tie).  

  #### Manipulation
  - **Manipulator:** Voter 1 (true ranking: A > B > C).  
  - **Misreport:** Swap adjacent alternatives B and C, reporting A > C > B instead.  
  - **New Profile:**  
    - Voter 1: A > C > B  
    - Voter 2: A > B > C  
    - Voter 3: A > B > C  
    - Voter 4: B > C > A  
    - Voter 5: C > B > A  

  **New Tally:**  
  - A: (2) + 2 + 2 + (-1) + (-1) = 4  
  - B: (-1) + 1 + 1 + 2 + 1 = 4  
  - C: (1) + (-1) + (-1) + 1 + 2 = 2  
  **New Winner:** A (scores: A=4, B=4, C=2; tie broken alphabetically, A wins).  

  **Improvement for Voter 1:**  
  - True ranking: A ≻ B ≻ C.  
  - Honest winner: B (middle preference).  
  - New winner: A (top preference).  
  - Thus, A ≻ B for Voter 1, confirming improvement.  

  The misreport is mild (adjacent swap) and the tie-break was activated but did not involve the manipulator creating a tie for the top score (the tie was between A and B at 4, while C had 2, so no tie for the *highest* score in the honest tally, but there is a tie in the manipulated tally). However, the requirement was "no tie for the top score in either tally" — here, the honest tally has no tie (B wins with 6), but the manipulated tally has a tie for the top score between A and B (both 4). To strictly meet your specifications, **I adjust Voter 5's ranking to avoid the tie in the manipulated tally** while preserving the manipulation:  

