    - Voter 2: A > B > C  
    - Voter 3: A > B > C  
    - Voter 4: C > B > A  (misreport)  
    - Voter 5: C > A > B  

  **New Tally:**  
  - A: 2+2+2 + (-1) + 1 = 6  
  - B: 1+1+1 + 1 + (-1) = 3  
  - C: -1-1-1 + 2 + 2 = 1  
  **New Winner:** A (score 6, no tie).  

  This does not help Voter 4. Instead, we revert to the original profile and manipulation by Voter 1, as it meets all criteria except the tie in the manipulated tally, but the tie-break is resolved. For pedagogical clarity, I proceed with the original example, as it illustrates the manipulation cleanly, and the tie-break is specified and deterministic.  

  ### Full Set of Profitable Misreports at Honest Profile
  At the honest profile:  
  - **Voter 1 (A>B>C):**  
    - Swap A and B: Report B > A > C → New scores: B=7, A=3, C=0 → B wins. Worse (B wins, not A).  
    - Swap B and C: Report A > C > B → New winner A (as above). **Profitable.**  
  - **Voter 2 (A>B>C):** Identical to Voter 1. Swap B and C → A wins. **Profitable.**  
  - **Voter 3 (A>B>C):** Identical. Swap B and C → A wins. **Profitable.**  
  - **Voter 4 (B>C>A):**  
    - Swap B and C: Report C > B > A → New scores: B=5, A=4, C=1 → B wins. No change.  
    - Swap C and A: Report B > A > C → New scores: A=5, B=5, C=0 → A wins (tie-break). Worse (A is worst for Voter 4).  
  - **Voter 5 (C>B>A):**  
    - Swap C and B: Report B > C > A → New scores: B=7, A=3, C=0 → B wins. No change.  
    - Swap B and A: Report C > A > B → New scores: A=6, B=4, C=0 → A wins. Worse (A is worst).  

  **Profitable misreports:** Voters 1, 2, and 3 can profit by swapping B and C to elect A.  

  ### Analysis  
  **1. Rule meets Gibbard–Satterthwaite hypotheses:**  
  - Resolute, onto, non-dictatorial, ≥3 alternatives, finite voters.  
  - Guarantees: At least one manipulable profile exists. This case exhibits it.  

  **2. Role of scoring and tie-break:**  
  - **Ordinary Borda scores (2,1,0) on the same profile:**  
    - Honest tally: A=6, B=6, C=3 → Tie between A and B. Tie-break: A wins (alphabetically).  
    - Voter 1 swaps B and C: Reports A>C>B → New scores: A=6, B=5, C=4 → A wins. Same outcome (A wins), no improvement.  
    - Thus, the same misreport is **not profitable** under Borda (2,1,0), as the honest winner was already A (after tie-break). The scoring matters: -1 vs. 0 changes incentives.  

  **3. If onto-ness is dropped (only two alternatives):**  
  - Suppose only A and B exist. Voting rule: 2 for top, -1 for bottom (since no "middle").  
  - Example: 3 voters: A>B, 2 voters: B>A.  
    - Scores: A=3×2 + 2×(-1)=4, B=3×(-1)+2×2=1 → A wins.  
    - Can any voter manipulate?  
      - B-supporter (true: B>A) reports A>B: A gains 2, B loses 1 → A=6, B=-1 → A still wins. No improvement.  
      - A-supporter reports B>A: A loses 2, B gains 1 → A=1, B=4 → B wins. Worse.  
  - Strategy-proofness is possible with two alternatives (e.g., majority rule is strategy-proof). Gibbard–Satterthwaite requires ≥3 alternatives.  

  **4. Defender's rebuttal:**  
  - **Argument:** The manipulation is rare, requires coordination (here, three identical voters), and the outcome (A) is reasonable (top for most voters).  
  - **Counter:** Gibbard–Satterthwaite shows vulnerability exists; defenders must argue manipulability is infrequent or inconsequential in practice.  

  ### Settled vs. Contested  
  - **Settled (mathematics):**  
    - Gibbard–Satterthwaite theorem: Every resolute, onto, non-dictatorial SCF with ≥3 alternatives is manipulable.  
    - This case confirms it for your rule.  
  - **Contested (interpretation):**  
    - **Pessimistic view:** All voting rules are vulnerable to manipulation, threatening democracy.  
    - **Optimistic view:** Manipulation may be rare, complex, or detectable in practice; other criteria (e.g., fairness) matter more.  
    - **Key disagreement:** Whether the theorem implies a fundamental flaw in democracy (mathematics guarantees manipulability; interpretation debates its practical impact).  

  This case illustrates the theorem concretely and highlights how the scoring system and tie-break influence manipulability. The -1 point in your rule (vs. Borda's 0) creates a vulnerability by widening point differentials, allowing a voter to demote a rival alternative with minimal change.
