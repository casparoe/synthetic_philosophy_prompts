  Their debate fluency is evident from the terminology listed (fiat, rejoinder etc.), and they're clearly comfortable with meta-discussion about argumentation theory. The philosophical puzzle about assertion norms shows impressive intellectual maturity. I notice they're particularly interested in three tension points: the acceptability of insincere arguments in debate, the game-theoretic vs essentialist views of assertion, and whether debate can separate knowledge/truth/belief.

  For Part 1 translation:
