  2. Domains where math fails. This is important to address because it tests the universality of math's effectiveness. If math struggles in biology or consciousness, does that undermine physics or highlight its selective nature? This should be included as it supports the user's angle about bracketing messy domains.

  3. Sociological aspects. While funding and gatekeeping affect what's studied, this might dilute the philosophical core. It's a valid point but secondary. Mention it briefly as context but avoid deep diving, as it's more about sociology than the puzzle itself.

  Prioritizing questions:

