  | Q7           | A          | ✔          | ✔             | ✔            |             |                  |
  |              | B          |            |               |              |             |                  |
  |              | C          |            |               |              |             | ✔                |
  | Q8           | A          | ✔          |               |              |             |                  |
  |              | B          |            | ✔             |              |             |                  |
  |              | C          |            |               | ✔            |             |                  |
  | Q9           | A          | ✔          |               |              |             |                  |
  |              | B          |            | ✔             |              |             |                  |
  |              | C          |            |               | ✔            |             |                  |
  | Q10          | A          |            |               |              | ✔           |                  |
  |              | B          | ✔          | ✔             | ✔            |             |                  |

  **Notes on scoring**:  
  - **Bounded** gets +1 for Q1B and Q10A, but Q1C also contributes weakly (since bounded agents *might* view procedures as algorithms).  
  - **Deflationary** gets +1 for any "C" answer in puzzle cases (Q3C, Q5C, Q6C, Q7C) or Q2C.  
  - Unlisted answer combinations (e.g., Q9A + Q5B) are possible but rare; see "Unoccupied Combinations" below.

  ---

  ### **Named Positions (Leaves)**
  1. **Causal (Act-focused causal view)**: Rationality evaluates single acts via causal counterfactuals (Q9A). Uses dominance (e.g., two-boxing in Q3A, defecting in Q5A). Ignores correlations (e.g., hitchhiker Q4B).  
  2. **Evidential (Act-focused evidential view)**: Evaluates acts via evidence (Q9B). Choices signal unseen states (e.g., one-boxing in Q3B, cooperating in Q5B). Rejects causal independence (e.g., hitchhiker Q4A).  
  3. **Timeless (Whole-procedure view)**: Evaluates decision procedures via logical counterfactuals (Q9C). Chooses acts that, if endorsed by the procedure, yield good outcomes across worlds (e.g., Q5B, Q8C). Commitments matter (e.g., hitchhiker Q4C).  
  4. **Bounded (Computational view)**: Focuses on rules (Q1B) and feasibility (Q10A). Suspends idealization (e.g., umbrella Q2B). Skeptical of puzzles requiring unbounded computation.  
  5. **Deflationary**: Puzzles are underspecified artifacts (e.g., Q3C, Q6C). Positions arise from interpreting gaps differently; no "correct" answer.  

  ---

  ### **Addressing Your Requests**
  **1. Indistinguishable Leaves on These Cases**  
  - **Evidential and Timeless both one-box (Q3B) and cooperate (Q5B)**: They agree on acts in Newcomb, PD, and coin-flip cases because both treat choices as evidence (evidential) or as instances of a procedure (timeless).  
    - *How to separate them*: Use cases like the source-code predictor (Q8). Evidential takes Q8B (choice influences prediction), Timeless takes Q8C (choose for the simulation). Mundane cases (Q2) also help: Timeless may still idealize (Q2A), while Bounded rejects it (Q2B).  
  - **Causal and Deflationary both two-box when seeing the box (Q6A)**: They agree the predictor is "voided" but for different reasons (causal: money exists; deflationary: setup is incoherent).  
    - *How to separate them*: In hitchhiker (Q4), Causal takes Q4B (no payment), Deflationary takes Q4C or Q3C (rejects setup).  

  **2. Unoccupied Combinations (and Why)**  
  - **Act-focused + Evidential counterfactuals + Denies choices are evidence (e.g., Q1A + Q9B + Q3A)**: Incoherent. If you use evidential counterfactuals (Q9B), you *must* treat choices as evidence (e.g., Q3B). No one defends this.  
  - **Bounded + Timeless (e.g., Q1C + Q10A)**: Rare but not incoherent. An agent might see procedures as algorithms (Timeless) while insisting on feasibility (Bounded). It’s unattractive because Timeless often requires unbounded computation (e.g., logical counterfactuals in Q9C).  
  - **Deflationary + Causal counterfactuals (e.g., Q3C + Q9A)**: Unattractive. Deflationaries reject causal puzzles as underspecified (e.g., Q6C), so endorsing causal counterfactuals (Q9A) adds little value.  

  **3. My Personal Position**  
  I lean toward **Timeless** (I’d score highest here). Why? It handles logical correlations (e.g., PD with copies, source-code predictors) without ad-hoc assumptions. To a **Causal** neighbor, I’d say: "Your view nails mundane cases (e.g., umbrellas) but ‘leaves money on the table’ in Newcomb—if the predictor simulates you, two-boxing nets $1,000, while one-boxing nets $1M. Isn’t rationality about getting the best outcome *across possible worlds*?"  

  ---

  This instrument should help your group isolate core disagreements. To use it: Have members answer the questions, tally their scores, then discuss why they diverged at key nodes (e.g., Q4 for hitchhiker, Q8 for source-code predictors). This avoids rehashing "one-box or two?" without clarity.
