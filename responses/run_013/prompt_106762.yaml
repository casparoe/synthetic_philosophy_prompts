  |              | B          |            | ✔             |              |             |                  |
  |              | C          | ✔          |               |              |             | ✔                |
  | Q4           | A          |            | ✔             |              |             |                  |
  |              | B          | ✔          |               |              |             |                  |
  |              | C          |            |               | ✔            |             |                  |
  | Q5           | A          | ✔          |               |              |             |                  |
