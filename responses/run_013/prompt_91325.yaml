answer: |-
  Here’s a runnable activity designed to induce visceral engagement with ambiguity aversion, structured to avoid the "dead" two-urn demo and incorporate your key moves. The goal is to make participants confront their preferences dynamically, then dissect the mechanics in the debrief.

  ---

  ### **Activity Design: "The Bag Game"**  
  **Core Idea**: Participants bid points for bets on colored balls drawn from bags with varying uncertainty. Stages escalate complexity, forcing them to "collide" with ambiguity aversion, compound lotteries, and context-dependent preferences. **No mention of Ellsberg until debrief.**

  #### **Materials**  
  - **Bags & balls**:  
    - 3 opaque bags (e.g., cloth drawstring bags).  
    - 150 red balls, 150 blue balls (e.g., poker chips, marbles, or paper balls).  
  - **Randomizing tools**: Coin, spinner wheel, or dice.  
  - **Paper & pens** for private bids + **collection box**.  
  - **Whiteboard** to track bids/stages (hidden until debrief).  
  - **Fake stakes**: Points redeemable for coffee/beer (e.g., 100 points = $5 voucher).  

  ---

  ### **Timeline & Stages** (90 min total)  
  *(Split into 3 stages + debrief; individual choices, no conferring)*  

  #### **Stage 1: Classic Ambiguity Aversion (15 min)**  
  **Goal**: Elicit aversion to unknown composition vs. known risk.  
  - **Setup**:  
    - **Bag A (Known Risk)**: *Publicly* fill with 50 red, 50 blue balls.  
    - **Bag X (Ambiguous)**: *Secretly* fill with 50 red, 50 blue, but label as "100 balls, red or blue in unknown proportions."  
  - **Bets**:  
    - *Bet A*: Win 100 points if red drawn from Bag A.  
    - *Bet X*: Win 100 points if red drawn from Bag X.  
  - **Task**:  
    - *Privately* write max points you’d pay for each bet (WTP_A, WTP_X).  
    - **Stress**: "No right/wrong answers. Pay what feels fair to *you*."  
  - **Collect bids immediately**.  

  > *Why it works*: Participants see Bag X as "ambiguous" despite identical EV. Expect WTP_X < WTP_A for most.  

  ---

  #### **Stage 2: Compound Lottery (20 min)**  
  **Goal**: Test if aversion persists when ambiguity is reduced to second-order risk (coin-flip between known mixes).  
  - **Setup**: Replace Bag X!  
    - **Bags Y and Z**: Fill Y with 100 red, Z with 100 blue. Label clearly.  
    - **New Bag X'**: Empty. Explain: "We’ll fill X’ *now*: Heads (coin flip) → pour Y into X’, Tails → pour Z into X’."  
    - **Bag A** unchanged (50/50).  
  - **Bets**:  
    - *Bet A*: Same as Stage 1 (red from Bag A).  
    - *Bet X'*: Win 100 points if red drawn from X’ *after* filling.  
  - **Task**:  
    - *Before flipping*, write max WTP for Bet A and Bet X’.  
    - Flip coin/spin wheel *after* bids collected (emphasize: "You bid while X’ is uncertain!").  
    - **Note**: Pour balls into X’ after flip (theatrically) but *do not draw yet*.  

  > *Why it works*: Ambiguity is now "risky" (50% chance of 100% red). If WTP_X’ ≈ WTP_A, aversion collapses with second-order risk. If WTP_X’ < WTP_A, aversion persists.  

  ---

  #### **Stage 3: Ambiguity Seeking (15 min)**  
  **Goal**: Make ambiguity attractive to shatter "stable trait" view.  
  - **Setup**:  
    - **Bag A' (Known Risk)**: Publicly fill with 40 red, 60 blue.  
    - **Bag X'' (Guaranteed Min)**: Label: "100 balls, red or blue, but *at least 50 red*." (Secretly fill with 70 red/30 blue).  
  - **Bets**:  
    - *Bet A'*: Win 100 points if red drawn from A’.  
    - *Bet X''*: Win 100 points if red drawn from X’’.  
  - **Task**: Write max WTP for each bet privately.  

  > *Why it works**: Known risk (40% win chance) vs. ambiguous but favorable odds (min 50% chance). Many will bid *more* for X’’ (ambiguity seeking in gains).  

  ---

  #### **Debrief (40 min)**  
  **Reveal patterns first, then theory**:  
  1. **Show anonymous bid data** (avg./median WTP per bet per stage):  
     - Stage 1: WTP_X << WTP_A?  
     - Stage 2: WTP_X’ closer to WTP_A?  
     - Stage 3: WTP_X’’ > WTP_A’?  
     - *Ask*: "What surprised you? Did your bids 'collapse' uncertainty?"  

  2. **Map to concepts** (now name Ellsberg):  
     - **Stage 1 → Ambiguity aversion**: Aversion to not knowing probabilities, even when EV matches known risk.  
     - **Stage 2 → Compound vs. simple lotteries**:  
       - If bids differed: You treated "coin-flip-then-draw" (compound) as distinct from "one-shot draw" (simple). Rationality *assumes* reduction to simple lotteries (axiom violation!).  
       - If bids matched: You reduced compound uncertainty (but why not in Stage 1?).  
     - **Stage 3 → Context matters**: Aversion isn’t fixed—it flips when ambiguity offers a better *worst-case* (min 50% > 40%).  

  3. **Address the ML critique** ("just use a prior"):  
     - *Why it feels glib*: In Stage 1, *which* prior? Uniform (50%)? What if you distrust it? Ambiguity aversion reflects distrust in model certainty.  
     - *Why it feels right*: In Stage 2, the coin flip *imposes* a prior, making ambiguity "risky." But is real ambiguity ever this tidy?  

  4. **Limitations & clever objections**:  
     - *"Stage 2 isn’t true ambiguity!"*: Agree. It’s a *model* of ambiguity (second-order risk). Real ambiguity has no agreed-upon probabilities. But if aversion vanishes here, it suggests aversion is about missing probabilities, not risk per se.  
     - *"Aversion isn’t irrational!"*: Exactly. The activity doesn’t show irrationality—it shows violations of *axioms* (e.g., reduction of compound lotteries, independence). We might rationally drop these if ambiguity feels meaningfully different.  
     - *"What if I just hate uncertainty?"*: Then why did you seek it in Stage 3? It’s about *context*: Aversion spikes when a "safe" option (Bag A) is present.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"What’s *really* in the ambiguous bag?!"**:  
     - *Preempt*: "There is no 'real' composition until we fix it (e.g., Stage 2 coin flip). Ambiguity means no one knows—not even me."  
     - *If pressed*: "If I revealed it, we couldn’t study your reaction to uncertainty!"  

  2. **Anchoring on Stage 1**:  
     - *Fix*: Explicitly reset context each stage: "New bags, new rules." Use distinct bag labels (A, X, X', X’’).  

  3. **Overrun by 30 min**:  
     - *Fix*: Cut bid time to 3 min/stage. Use a timer. Skip verbal Q&A until debrief.  
     - *Worst case*: Delay Stage 3 or shorten debrief tables (focus on key contrasts).  

  4. **Demands for group discussion**:  
     - *Enforce*: "Write bids *alone*. We’ll discuss after." Collect bids before reactions.  

  ---

  ### **Why This Works**  
  - **Gut-level engagement**: Forces confrontation with ambiguity (Stage 1), then dissects it (Stage 2) and flips it (Stage 3).  
  - **The "collapse" moment**: Stage 2 makes the reduction axiom visceral. Writing bids pre-comparison captures raw preferences.  
  - **No stable trait**: Stage 3 prevents dismissal of aversion as "just how people are."  
  - **Debrief honesty**: Names limitations upfront ("Stage 2 is a stand-in") and equips you to handle objections.  

  **Final tip**: Start with a vibe check: "This is about *your* choices—no jargon, no lectures." The data (their bids) becomes the star.
