    - Distortion: Coherentism in philosophy is about the justification of beliefs by their coherence with other beliefs, not just about schema evolution. Our vocabulary doesn't capture the epistemic aspect of justification.
    - No counterpart: The anti-foundationalist metaphysical stance (no basic, indubitable facts) is not fully captured. We can say the schema is revisable, but not that there are no foundational facts in the world.
    - Verdict: The residue shows that the original claim was doing more work (epistemological and metaphysical). Our vocabulary captures the engineering aspect (schema can change) but not the philosophical underpinnings.

  **Claim 4: Concession that it is a helping language, not complete**

  - Translation: ISOTYPE is not a complete representation; it requires escape hatches to other languages for full expressiveness. It is a lossy elaboration of a core physicalist language, meant to assist in communication but not replace other notations entirely.
