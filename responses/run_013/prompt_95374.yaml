  We will restate Neurath's case using only these terms. Then we provide a residue report for each claim.

  Restatement of Neurath's case:

  Neurath advocates for a picture language (ISOTYPE) as a unified, physicalist language for the sciences. His case in our terms:

  1. **Expressiveness and completeness**: 
     - ISOTYPE is designed to be expressive for statistical and scientific facts but not complete for all domains. It is a helping language that can be extended or complemented by other notations. Its expressiveness is bounded by the pictorial domain.

  2. **Well-formedness versus semantic emptiness**:
     - The picture language has clear well-formedness rules (how to arrange pictograms, scale, color, etc.) that avoid semantic emptiness. Each well-formed ISOTYPE diagram must have a clear physicalist interpretation. This contrasts with word languages, which may have syntactically valid but semantically empty or ambiguous statements (pseudo-problems).

  3. **Syntax versus semantics**:
     - In ISOTYPE, the syntax (the arrangement of pictures) is tightly coupled to the semantics (the represented facts). The mapping is designed to be one-to-one and unambiguous. Ordinary word languages allow a gap between syntax and semantics, leading to misinterpretation and pseudo-problems.

  4. **Canonical form**:
     - ISOTYPE aims to have a canonical form for representing information. Each statistical fact should have a standard pictorial representation, reducing variability and promoting unity.

  5. **Lossy versus lossless transformation**:
     - Transforming complex data into ISOTYPE is inherently lossy. It simplifies and abstracts, focusing on the essential physicalist facts. This lossiness is by design to avoid the noise and pseudo-problems of word languages. However, the transformation from the core physicalist facts to the picture language should be lossless in the sense that the intended meaning is preserved without distortion.

  6. **Sugar and elaboration**:
     - ISOTYPE can be seen as an elaboration of raw data into a visual form. It is not sugar over a verbal language, but a direct elaboration from the core physicalist representation. The pictorial form is the core representation for the intended audience.

  7. **Escape hatches**:
     - Neurath concedes that ISOTYPE is a helping language, not a complete one. This implies the need for escape hatches to other languages when the picture language is insufficient. However, he would argue that the picture language should be the primary representation, with escape hatches used sparingly.

  8. **Schema migration**:
     - As science evolves, the ISOTYPE system must adapt. This is like schema migration: the pictorial vocabulary and rules may need to change to accommodate new kinds of data, but the core principles (physicalism, pictorial unity) remain. The system is revisable without a foundational layer.

  Now, the residue report for each of Neurath's claims:

  **Claim 1: Pictorial notation less likely to breed pseudo-problems**

