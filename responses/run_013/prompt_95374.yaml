  **Claim 2: Pictures are more intersubjective, uniting people more than words**

  - Translation: A canonical pictorial form with lossy transformation to essential features promotes universal understanding. The picture language serves as a common intermediate representation that can be round-tripped to multiple natural languages without loss of core meaning.
  - Residue:
    - Intact: The idea of a canonical form can promote standardization and thus wider understanding.
    - Distortion: Intersubjectivity in philosophy involves shared human experience and agreement. Our vocabulary treats it as a matter of standardization and lossless round-tripping, but Neurath's claim is about the inherent nature of pictures versus words. We have no term for the affective or perceptual unity that pictures might provide.
    - No counterpart: The claim that pictures bypass linguistic and cultural barriers more effectively than words is not directly expressible. We can talk about escape hatches for when the picture language fails, but not about inherent unity.
    - Verdict: The residue marks something our vocabulary has no way to say (the psychological and cultural aspects of pictorial vs. verbal communication). The original claim was doing more work by appealing to human perception and emotion.

