    - No counterpart: The idea that a language can be "helping" (i.e., auxiliary) while still being central to a scientific program is not a concept in our vocabulary. We don't have a term for a primary-but-incomplete notation.
    - Verdict: The residue is small. Our vocabulary handles this well with escape hatches and bounded expressiveness. The concession is about the limits of expressiveness and the need for escape hatches, which we can say.

  Correction on Neurath: He did see ISOTYPE as part of a larger unified science movement, and the picture language was meant to be a universal medium for public understanding. His concession about it being a helping language might be more about its role in education and popularization, not as the sole language of science. We can adjust:

  Corrected Claim 4: ISOTYPE is a helping language for popularization and education, not a complete language for all scientific discourse.

  Restated: ISOTYPE is an elaboration (with lossy compression for clarity) of scientific facts into a pictorial form, intended for broad communication. For the full details, one must use the core scientific language (which for Neurath was physicalist and unified). So it's a lossy transformation from the core language, and the core language remains the complete representation. But the core language is also unified and physicalist, and the picture language is part of that unified system.

  In our terms: The core language (physicalist statements) can be elaborated into ISOTYPE for public consumption, but the core remains. ISOTYPE is a derived view. The escape hatch goes both ways: from the picture to the core (for detail) and from the core to the picture (for communication).

