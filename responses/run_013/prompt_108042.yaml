answer: |-
  ## The Flour-Dusted Envelope

  The dough resisted, a cool, living mass under Marta’s knuckles. Flour dusted her forearms, the worn countertop, the air itself in the cramped warmth of ‘Marta’s Loaves’. Outside, a late autumn drizzle slicked the cobbles of Cypress Street. The bell jangled, cutting through the rhythmic thump of kneading.

  Liam, the gangly postal runner, dripped onto the mat. “Morning, Marta. One for you.” He held out a thick, cream-coloured envelope. The city seal, a stylized bridge over waves, stood out in raised ink. Below it, printed in crisp, official type: **NOTICE OF SELECTION: LEGISLATIVE ASSEMBLY OF THE CITY OF HARBOURBRIDGE**.

  Marta froze. The dough slumped. Her hands, suddenly clumsy, left floury smudges on the pristine paper. Three years. Three years sitting in the Assembly Chamber, debating zoning laws and sanitation budgets, while her sourdough starters died and her customers found other bakeries. Panic, cold and sharp, clawed at her throat. She saw the ovens cold, the shelves empty, the lease unpaid.

  “Sign here,” Liam mumbled, holding out his scanner pad. His eyes held a flicker of sympathy – or was it just the damp making him blink? Everyone knew what the envelope meant. Marta scribbled her name, the pen feeling alien in her flour-caked hand. Liam vanished back into the drizzle.

  The envelope lay on the counter, incongruous amidst the sacks of rye and spelt. Marta picked up the dough, attacking it with renewed, frantic energy. *Stupid. Unfair.* The lottery was supposed to be… what? Fair? Representative? Some grand democratic experiment. Her grandfather had railed against the old elected councils, bought and paid for by the shipyard owners and the merchant guilds. “Lottery’s pure,” he’d grumbled, stirring his tea. “Gives the ordinary Joe a shot, keeps the suits on their toes.” But Grandpa hadn’t run a bakery that needed his hands every dawn.

  The bell jangled again. Leo. Her cousin, smelling of damp wool and expensive cologne. He slid onto a stool, eyeing the envelope with the detached interest of a man surveying a mildly interesting insect.

  “Ah. The civic summons.” He tapped the city seal. “Unlucky draw, Marta.”

  “Unlucky?” Marta scoffed, slamming the dough down. Flour puffed into the air. “It’s ruinous. Who’ll run this place? Pay rent? Who’ll bake?”

  Leo shrugged, pulling a small notebook from his inner pocket. “Hence the beauty of the transfer clause. Compassionate, they called it. I call it practical.” He flipped the notebook open. “Market rate for a seat right now? Given the stable economy, low controversy… hovering around eighteen thousand. Solid.”

  “Eighteen thousand?” Marta stared. It was more than six months’ clear profit. A lifeline. Enough to hire a manager, maybe even weather the three years… if she found someone reliable. A dizzying possibility opened up. Relief warred with a sour taste in her mouth.

  “Why’s it so high?” she asked, wiping her hands on her apron, leaving ghostly streaks.

  “Demand,” Leo said simply. “People see value. Civic duty, networking, a foot in the door for family businesses… or just liking the idea of having a say. Comfortable people, mostly. They can afford the time, or the price.” He scribbled a figure. “I have buyers. Reliable ones. We could have this settled by noon tomorrow. Transfer registered, funds in your account. You bake, they govern. Everyone wins.”

  *Everyone wins?* Marta thought of the Assembly Chamber, filled with Leos and their buyers, debating the price of flour subsidies while never having touched a bag. Grandpa’s ‘ordinary Joe’ seemed very far away. “But… it’s supposed to be random. People like… well, like me. Shopkeepers. Workers.”

  Leo smiled, a tolerant, patronizing curve of the lips. “Marta, be realistic. *Could* you serve? Honestly? Without losing everything you’ve built? The clause exists *because* pure randomness is brutal. It wrecks lives. This way, the burden shifts to those best equipped to bear it. The city gets stability – no desperate, distracted legislators worrying about their failing businesses. And,” he added, tapping his notebook, “you get capital to reinvest. Maybe expand? That new oven you eye?”

  The logic was smooth, polished. It made a terrible kind of sense. The state avoided forcing a small business owner into ruin. She avoided ruin. Some comfortably retired doctor or ambitious young lawyer got a stint in government. Harbourbridge kept functioning.

  Later, seeking air thick with something other than flour and dread, Marta walked to the Clerk’s Office in the squat Municipal Building. The air inside smelled of ammonia, cheap carpet cleaner, and anxiety. A queue snaked towards the high counter: people clutching identical cream envelopes. A young woman in a cleaner’s uniform wept silently, her shoulders shaking. An elderly man argued hoarsely with the impassive clerk behind the glass partition.

  “…but my wife, she needs care, I can’t leave her for three years! Who’ll buy it? Who’d want it from me? I’m nobody!”

  “The market determines value, sir,” the clerk droned, not looking up from his screen. “You can list it. Minimum transfer fee is five hundred. Payable now.”

  The man slumped, defeated. Marta’s stomach clenched. Five hundred was likely a week’s wages for him. Hopeless.

  She spotted Ben Chen near the water cooler. Ben owned the small hardware store two blocks over. He leaned against the wall, staring at his own envelope as if it were a live grenade. They exchanged grim nods.

  “Drawn too, Ben?”

  He sighed, running a hand through his thinning hair. “Yeah. Just got the supply shipment sorted for winter. Three years… Janice can’t run the store alone, not with the kids.” He looked lost. “Leo offered me sixteen-five. Said it was ‘fair’.” He made air quotes, his voice thick with uncertainty. “It’s money. More than I’d make staying open, probably, if I even *could* stay open. But… selling my vote? Feels dirty. Grandpa would spin in his grave. Said the lot was the only honest thing left.” He kicked at the worn linoleum. “But then, Grandpa never had to choose between principle and keeping the lights on. What’re you gonna do, Marta?”

  Marta looked around the room. The weeping cleaner was being ushered into a side office, probably to sign transfer papers for pennies. The elderly man shuffled away, envelope crumpled in his fist. A well-dressed woman breezed in, handed the clerk a form and a thick envelope of cash, and left within minutes, a satisfied smile on her face. Efficiency.

  “I don’t know, Ben,” Marta said softly. “Leo makes it sound so sensible. Practical.”

  “Practical,” Ben echoed, bitterness creeping in. “For who? For us? Maybe. For the city?” He gestured vaguely towards the ceiling, towards the unseen Assembly Chamber. “Who’s up there deciding if the new waste plant goes near Cypress Street or over by the docks? Not bakers or hardware guys, that’s for sure. Not anymore. Just… people who could afford the ticket.” He pushed off the wall. “Gotta talk to Janice. Good luck, Marta.”

  Back at the bakery, the smell of yeast and warmth usually soothed her. Now it felt claustrophobic. The envelope lay where she’d left it, a little flour dusting one corner. She picked it up. It felt heavy. Official. Final.

  Eighteen thousand dollars. Security. A chance to breathe, maybe even grow. Leo’s polished logic echoed: *Compassionate. Practical. Stability. Everyone wins.*

  She saw the weeping cleaner. Ben’s defeated slump. Her grandfather’s fierce, rheumy eyes. *"Pure,"* he’d called it. Pure chance. The idea that the baker, the cleaner, the hardware store owner – their voices, their messy lives – deserved an equal shot at the table, not just as voters, but as deciders. That Harbourbridge belonged to *all* its hands, not just the ones with the deepest pockets or the most flexible schedules.

  But her own hands… they were covered in flour, calloused from dough and hot trays. They built something tangible, something the neighbourhood needed. Could she really walk away for three years? Could she trust anyone else with her ovens, her recipes, her livelihood? Was it pride? Stupidity? Or was it the same stubborn belief that made her knead dough until it sang – that some things required your own hands, your own presence, your own damn hard work?

  Leo’s offer was a clean escape hatch. Ben’s uncertainty felt like her own reflection. The city’s comforting statistic – *a random sample* – felt like a ghost haunting the room, transparent and meaningless. The draw *was* random. The chamber… wasn’t.

  Marta traced the city seal on the envelope with a floury fingertip. The bridge. Connecting shores. Who decided which shores got connected? Who paid the toll? She pictured the Assembly Chamber, filled with unfamiliar, comfortable faces who’d bought their way in. Would they understand the precise price of a bag of high-gluten flour? The panic when the starter goes slack? The weight of rent on a rainy Tuesday?

  She walked to the small sink in the corner. Turned on the tap. The water ran cold and clear. She scrubbed her hands, watching the flour dissolve into a milky swirl down the drain, revealing the reddened skin beneath. The dough for tomorrow’s batch waited, a pale moon under its damp cloth. The envelope sat on the counter, a silent demand.

  Outside, the drizzle continued to fall on Cypress Street. Marta dried her hands slowly, deliberately. She didn’t reach for the phone to call Leo. She didn’t tear open the envelope. She stood in the warm, flour-dusted silence of her bakery, the weight of the bridge, the city, and eighteen thousand dollars pressing down on her, the water still dripping from her clean, bare hands.

  ---

  **Afterword**

  The story grapples with the tension between the *ideal* of sortition – genuine, statistically representative government reflecting the entire citizenry's lived experiences – and the *reality* of individual hardship imposed by compulsory service. The transfer market, born from compassion, fundamentally corrupts the core purpose: replacing random representation with rule by those who can afford to buy their way in *or* out.

  I believe the transfer rule should be abolished. Its "compassion" is illusory, systematically excluding the less affluent from power and creating a de facto oligarchy. The initial goal – mitigating undue burden – is valid, but the market solution destroys the very representation sortition aims to achieve. Better solutions exist: shorter terms, robust financial compensation, job protection guarantees.

  However, the story resists this resolution because Marta’s dilemma is viscerally real. Abolishing the market doesn't erase the potential ruin serving could wreak on her bakery and life. Leo’s arguments about practicality and avoiding personal catastrophe aren't villainous; they stem from a flawed system offering only bad choices. Ending with her unresolved paralysis highlights the cost of principle – the terrifying weight of potentially sacrificing her livelihood for an abstract democratic ideal – making the reader feel why the tempting, corrupting market exists, even as they see its corrosive effect on the city’s soul. The injustice is systemic, but the pain is intensely personal.
