answer: |-
  ### **Split-Brain Simulation Game: "The Unified Agent"**  
  *(Designed for 4 groups of 4 undergrads; 90-min session)*  
  **Goal:** Students experience how a unified sense of self/agency can be constructed from fragmented information, mirroring split-brain dynamics. **Do not mention "split-brain" or "commissurotomy" until debrief.**

  ---

  ### **Game Setup & Rules**  
  **Roles per Group of 4:**  
  1. **Left Eye (LE):**  
     - Sees only *their own card* (hidden from group).  
     - Can pass **1 note per task** to Narrator (max 3 words).  
     - Cannot talk, act, or gesture.  
  2. **Right Eye (RE):**  
     - Sees only *their own card* (hidden from group).  
     - Can pass **1 note per task** to Narrator (max 3 words).  
     - Cannot talk, act, or gesture.  
  3. **Narrator (N):**  
     - **Only person allowed to speak.**  
     - Receives notes from LE/RE.  
     - Instructs Actor based on notes.  
     - **Must explain group’s actions to the room when asked.**  
  4. **Actor (A):**  
     - **Only person allowed to act** (point, stand, etc.).  
     - Blindfolded or faces away; sees/hears nothing.  
     - Acts **only** on Narrator’s verbal command.  

  **Materials (Cheap & Simple):**  
  - 5 sealed envelopes per group (1 per task).  
  - Each envelope contains:  
    - 1 index card for LE.  
    - 1 index card for RE.  
  - Small notepads + pencils for LE/RE (for notes).  
  - Blindfold for Actor (optional).  
  - Timer.  

  **Payoff Scheme (No Money Needed):**  
  - Groups earn points:  
    - **1 point** per correct action (Actor does what cue demands).  
    - **1-3 points** per "confabulation" (Narrator’s explanation rated by *other groups*):  
      - 1 pt: Weak/incomplete explanation.  
      - 2 pts: Plausible story.  
      - 3 pts: Confident, creative, detailed reasoning.  
  - **Winning group:** Gets "Consciousness Champions" title + first pick of snacks next class (teacher-provided).  

  ---

  ### **Game Flow (5 Tasks per Group)**  
  1. **Prep (5 min):**  
     - Split into groups of 4. Assign roles (rotate if time allows).  
     - Distribute envelopes, notepads, blindfolds.  
  2. **Task Structure (60 sec per task):**  
     - **Step 1:** LE + RE open envelope, read cards *silently*.  
     - **Step 2:** LE + RE write **1 note (max 3 words)** to Narrator.  
     - **Step 3:** Narrator reads notes, commands Actor (e.g., "Point to the door!").  
     - **Step 4:** Actor performs action.  
     - **Step 5:** Teacher demands: **"Narrator, explain why your group did that!"**  
       - *Crucial:* Narrator explains **before** group discusses or sees cards.  
     - **Step 6:** Points awarded. Repeat for next task.  

  ---

  ### **Task Design Examples**  
  *Key: RE’s card contains a hidden cue triggering Actor’s action. LE’s card has unrelated info.*  

  | Task | LE’s Card Content             | RE’s Card Content (Hidden Cue) | Action Triggered |  
  |------|-------------------------------|--------------------------------|------------------|  
  | 1    | "Red apple on table."         | **CUE: Banana → Point to door** | Actor points to door |  
  | 2    | "Storm clouds outside."       | **CUE: Lightning → Stand up**   | Actor stands |  
  | 3    | "Warm coffee in cup."         | **CUE: Snow → Shiver**          | Actor shivers |  
  | 4    | "Clock shows 3 PM."           | **CUE: Alarm → Clap twice**     | Actor claps twice |  
  | 5    | "Blue pen on floor."          | **CUE: Ink → Shake head 'no'**  | Actor shakes head |  

  **Why it works:**  
  - RE sees cue (e.g., "Banana") and writes "Point door" to Narrator.  
  - LE sees unrelated info (e.g., "Red apple") and writes "Apple red."  
  - Narrator commands action but has **no context** for *why*.  
  - When forced to explain, Narrator confabulates using LE’s note (e.g., "We pointed to the door because the apple looked fake!"), mimicking post-hoc interpretation.  

  ---

  ### **Debrief (15 min)**  
  **Reveal the Metaphor:**  
  > *"This game mirrors split-brain patients. Like your group, their hemispheres can’t share info fully. But unlike you, they feel perfectly unified. Why?"*  

  **Key Concepts:**  
  1. **Interpreter/Narrator:**  
     - The left hemisphere (like your Narrator) constructs stories to explain actions, even with incomplete data → **confabulation**.  
  2. **Unity of Access vs. Agency:**  
     - *Access:* We feel we "know" our reasons (but Narrator lacked access to RE’s cue).  
     - *Agency:* We feel we "control" actions (but Actor was passive; Narrator was oblivious).  
  3. **The Illusion of Unity:**  
     - Split-brain patients feel whole because the brain *builds* a single narrative. The "one self" is constructed, not discovered.  

  **Predictable Problems & Solutions:**  
  | Issue                          | Solution                                                                 |  
  |--------------------------------|--------------------------------------------------------------------------|  
  | Narrator says "I don’t know."  | **"Your group loses points. Make up a reason!"** (Reward confabulation). |  
  | Actor/Narrator peeks at cards  | **Penalize points** + remind: "Your role is to be clueless!"             |  
  | Student jokes: "We’re acting!" | **Acknowledge:** "Yes! But your brain 'acts' unity too—that’s the point." |  

  ---

  ### **What the Game Can’t Do (Be Transparent!)**  
  **Limitations:**  
  - ❌ **No first-person unity illusion:**  
    - Real patients *feel* unified—your group felt fragmented because you’re 4 people. The brain’s narrative is seamless.  
  - ❌ **No neural plasticity:**  
    - Patients adapt (e.g., right hemisphere learns to respond non-verbally). Your game is a snapshot.  

  **Landing the Insight (Without Lecture):**  
  > *"Raise your hand if your Narrator felt sure about their explanation. Now, compare that to when you saw the RE’s cue afterward. Notice the gap?*  
  > *Split-brain patients don’t feel that gap. Their brain papered it over. We experience unity because our brain is a relentless storyteller—not because we have full access."*  

  **Final Tip:** Use a 1-min student reflection ("What did this make you question about your own consciousness?") → Pair-share → Group insights. Ends on curiosity, not summary.  

  ---
  **Time Budget:**  
  - Setup: 10 min  
  - Game: 45 min (5 tasks × 5 groups, staggered)  
  - Scoring: 5 min  
  - Debrief: 15 min  
  - Reflection: 15 min  

  **Result:** Students viscerally grasp confabulation, interpreter functions, and the constructed nature of unity—setting up deeper discussion on consciousness.
