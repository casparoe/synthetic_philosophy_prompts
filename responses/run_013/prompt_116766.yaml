prompt: |-
  Okay, I've got a pile of gut calls about one-shot prisoner's dilemmas and I want to know what rule is actually generating them, because I suspect they don't all hang together. Playing a stranger on the other side of the world, no connection between us at all — I defect, obviously. Playing an exact copy of me, same code same inputs, made last week and kept in a box, so whatever I decide is what they decide — I cooperate. Playing someone who just read the same argument I did and is known to be at least as careful a reasoner, so we'll probably land in the same place — I cooperate, though less confidently. Playing a copy of me whose reasoning has a tiny random glitch that makes them defect 1% of the time — I think I still cooperate, but I don't like how fast I said that. The 100-player version, everyone gets a lot if all 100 cooperate and a little if they defect, and I'm told the other 99 reason just like me — I cooperate. But in Newcomb's problem, where the boxes are already filled and my choice causes nothing, I take both, and I feel fine about it, even though that's also a case where my choice and some other agent's earlier action are correlated with no causal link running between them. And there's one I keep flipping on: a stranger who's a serious superrationalist but has no particular reason to be identical to me, so I can't tell if our reasoning will actually match or only match in expectation. Is there one principle behind all of this, or do I have to drop a verdict — and if so which one? Also say what your principle predicts for the glitchy copy, and for a copy made from me before I'd ever thought about this problem.
