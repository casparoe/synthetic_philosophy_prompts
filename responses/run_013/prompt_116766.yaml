answer: |-
  After analyzing your intuitions across these scenarios, there's a unifying principle: **You're implicitly applying Updateless Decision Theory (UDT) with a focus on logical correlation via identical or near-identical decision processes.** UDT evaluates decisions based on the *logical output of your algorithm* across all correlated instances, ignoring causal influence or precommitments. Your choices maximize the expected utility *as if* your decision rule is fixed and controls all identical agents.

  Here's how it explains each case:

  1.  **Stranger (No Correlation):** No logical link exists. UDT defaults to causal dominance → **Defect** (standard Nash equilibrium).
  2.  **Exact Copy (Perfect Logical Correlation):** Your algorithm's output *is* their output. Cooperating ensures mutual cooperation → **Cooperate** (Pareto optimum via logical control).
  3. **Careful Reasoner (High Expected Logical Correlation):** High probability your identical reasoning reaches the same output. Cooperating has high expected payoff → **Cooperate** (Less confidence reflects uncertainty about perfect identity).
  4.  **Glitchy Copy (1% Defect - Noisy Logical Correlation):** *Your principle predicts **Cooperate**.* Even with noise, your decision algorithm *defines* the correlated outcome. Cooperating gives a 99% chance of mutual cooperation (high payoff) vs. ~99% chance of mutual defection if you defect (low payoff). The noise doesn't break the logical link *from your algorithm's perspective*.
  5.  **100 Identical Players (Perfect Logical Correlation):** Your decision rule controls all 100 outputs via logical identity. Cooperating ensures universal cooperation → **Cooperate** (Massive collective gain).
  6.  **Newcomb's Problem (Correlation without Control):** The Predictor correlates with you, but *your choice doesn't control its prediction*. Your algorithm is fixed; the prediction is already made. UDT (like causal DT) says your *actual choice* only affects the boxes you take → **Two-Box** (Dominant causal strategy). The lack of discomfort arises because you aren't responsible for the correlation; you aren't "controlling" the Predictor's past action.
  7.  **Superrational Stranger (Uncertain Logical Correlation):** This is the hardest. UDT requires specifying the "reference class" of agents using the *same decision algorithm*. If "superrationalist" implies identical reasoning *to yours*, cooperate. If it doesn't (e.g., different priors, heuristics), defect. **Your flip-flopping reflects ambiguity in defining the reference class.** Without strong evidence of identical algorithms, UDT leans towards defection (causal dominance under uncertainty).

  **The Core Principle:** You cooperate when you believe:
  *   The other agent(s) are logically determined to output the *same action* as you **because** they are executing the *same decision algorithm* as you in the *same logical context*.
  *   Your choice *is* their choice (logically, not causally).
  You defect when this logical identity/correlation is absent or too weak.

  **Predictions for Your Edge Cases:**

  *   **Glitchy Copy (1% Defect):** **Cooperate.** As explained above, the glitch introduces *outcome* uncertainty, not *algorithmic* uncertainty. Your decision algorithm still logically controls the expected behavior of the copy. Defecting guarantees mutual defection (~99% of the time due to their glitch *and* your choice). Cooperating gives a 99% chance of the high mutual cooperation payoff.
  *   **Copy Made Before You Thought About the Problem:**
      *   **If they use your *current* algorithm:** They cooperate (Perfect logical correlation now exists).
      *   **If they use your *past* algorithm (naive, never considered PD):** This depends on what that algorithm *would* output *if* faced with this problem. UDT requires evaluating the *counterfactual* output of your past algorithm in this situation.
          *   If your past naive self would likely Defect (e.g., following causal dominance instinctively), then **you should Defect.** Choosing Cooperate would likely lead to (You:C, Them:D) - the sucker's payoff. Choosing Defect likely leads to (You:D, Them:D) or possibly (You:D, Them:C) if they glitch cooperate. The expected payoff of Defect is higher.
          *   If your past naive self would likely Cooperate (e.g., inherently cooperative), then **you should Cooperate**, leading to mutual cooperation.
      *   **The Uncertainty:** You likely lack perfect knowledge of what your past algorithm *would* do. This ambiguity pushes towards **Defect** (causal dominance under uncertainty about the logical link). Your intuition might be uneasy here, similar to the superrational stranger.

  **Why Your Intuitions Hang Together (Mostly):**

  Your judgments are remarkably consistent with UDT. The dissonance arises in the *uncertain correlation* cases (glitchy copy, superrationalist, pre-rationalized copy) where it's hard to precisely define the "reference class" (which agents share your exact algorithm/context) and the counterfactual behavior of similar-but-imperfect algorithms. Newcomb fits because correlation without *logical control by your current decision* doesn't compel one-boxing under UDT.

  **Conclusion:** You don't need to drop a verdict. Your gut is following a sophisticated (UDT-like) principle focused on **logical control via identical decision processes.** For the glitchy copy, cooperate. For the pre-rationalized copy, defect unless confident your past self would cooperate in this exact scenario. The superrational stranger remains ambiguous – cooperate only if convinced they *are* running your identical algorithm.
