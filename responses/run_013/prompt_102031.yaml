prompt: |-
  I have no formal training in philosophy, demography, or economics, but I have been thinking on my own about whether a larger population is better. I keep meeting arguments for pronatalism, against population growth, and about whether adding happy people makes the world better. I want a theory good enough to judge both a government’s pronatalist policy and a family’s decision to have another child, and before I take sides I want the specification: what must any theory of whether a larger population is better be able to do to count as adequate? Please write the desiderata.

  I want a list of requirements, with the case or consideration behind each. What phenomena must the theory explain? Which cases must it get right? Which distinctions must it respect? Which findings from biology, economics, or demography must it not contradict? Which requirements are non-negotiable and which are merely preferences of one camp? Flag any pair or subset of requirements that cannot be jointly satisfied. Then, if you can, say which single requirement does the most to exclude the most popular theories. I care more about the criteria than about scoring named views, so keep the weight there.

  To make this concrete, here are the cases I have been turning over. First, a technology can create simulated minds who are happy, have rich inner lives, never learn that they are simulated, and can be created in any number without affecting anyone outside. Second, a variant where those minds are happy but their happiness depends on a false belief that they are real. Third, a variant where their lives are barely worth living. Fourth, a variant where creating them uses computational resources that would otherwise create a smaller number of much happier simulated minds. Fifth, a policy that increases population by extending existing lives rather than by creating new people. Sixth, a policy that increases population by immigration rather than by births. Seventh, a policy that adds people who are happy but whose existence changes who else is born, so that the added people replace others who would have existed. Eighth, a policy that adds people who are happy but makes existing people slightly worse off. Ninth, a policy that adds people who are miserable but whose existence prevents a larger number of people from being even more miserable. Tenth, a world where population size increases while average happiness decreases, and a world where the reverse happens.

  For each requirement you list, say which of these cases motivates it, or which general consideration does. I especially want the theory to be able to compare worlds that differ both in how many people exist and in how well off those people are, and worlds where the identities of the people differ. It should distinguish making an existing person better off from making an additional person exist. It should not treat people as interchangeable units or as mere means. It should handle uncertainty about whether future lives will be worth living. It should distinguish population size from population density, from total life-years, and from the number of minds. It should respect the thought that adding a happy person is not automatically bad, while also respecting the thought that a huge population of barely happy people is not automatically better than a smaller population of very happy people.

  Tell me which of these requirements are genuine desiderata and which are prejudices of one camp. Which are jointly unsatisfiable? I suspect the real fault line is between the requirement that adding a happy person cannot make a world worse and the requirement that a world of many barely happy lives cannot be better than a world of few very happy lives, but I want to know whether that is the deepest tension or whether there is another. If the list itself yields a result, say so.

  Do not give me citations, reading lists, or names of papers. I cannot look them up, and I want the requirements in plain terms. If you must refer to a position, describe it rather than naming it. A table with columns for the requirement, the motivating case, whether it is non-negotiable or a camp preference, and which kind of theory it excludes would be helpful.
reasoning: |-
  Okay, the user wants a set of criteria to evaluate theories about whether a larger population is better. They're not formally trained but are thinking deeply about pronatalism, population ethics, and various scenarios involving adding people. Let me start by understanding their main concerns.

  First, they listed ten specific cases. Each case tests different aspects of population ethics. For example, the simulated minds scenarios explore non-existent beings and resource allocation. The policies around immigration, life extension, and replacement cases touch on identity and comparative welfare. The misery cases address trade-offs. I need to derive requirements from these cases.

  The user emphasized several key points: comparing worlds with different populations and welfare levels, distinguishing between benefiting existing people vs. adding new ones, avoiding treating people as interchangeable, handling uncertainty, and differentiating between size, density, life-years, and minds. Also, they want the theory to balance the intuition that adding happy people isn't bad vs. not preferring a vast population of barely happy individuals.

  I should identify core requirements. The first one would be Non-Identity Sensitivity. The seventh case (adding people who replace others) shows that changing who exists affects outcomes. A theory must account for whose lives are affected, not just numbers. This is non-negotiable because ignoring identity leads to paradoxes.

  Next, the Person-Affecting Principle. Making new people is different from improving existing lives, as seen in cases like life extension versus new births. This distinction is crucial and non-negotiable; conflating them misses ethical nuances.

  Then, Neutrality of Happy Addition. The first case (adding happy simulated minds) suggests that adding happy beings without harming others should be neutral or good. But this is contentious; some theories say it's always good, others neutral. The user wants this respected but notes it's a camp preference.

  The Mere Addition Paradox arises from cases like the tenth (size up, average happiness down). A huge but barely happy population shouldn't automatically be better. This conflicts with the Neutrality requirement, creating a tension. Both can't be fully satisfied, which is a key fault line.

  Balancing Quantity and Quality is another requirement. The third case (barely worth living) and tenth case highlight the need to balance total happiness with average or other metrics. This is non-negotiable; a theory must handle this trade-off.

  Resource Sensitivity is critical from the fourth case (computational resources). Adding people using resources that could have made others happier must be considered. Non-negotiable, as ignoring opportunity costs is unrealistic.

  Distinguishing Size, Density, Life-Years, and Minds. Cases like life extension versus new births show these factors matter differently. Non-negotiable to avoid oversimplification.

  Welfare Uncertainty Handling. Future lives' worth is uncertain, so theories must incorporate risk. Non-negotiable for policy relevance.

  Non-Exploitation Principle. People shouldn't be treated as means, as in the second case (false beliefs). Non-negotiable ethical baseline.

  Policy Neutrality to Source. Immigration vs. births (sixth case) shouldn’t be treated differently if welfare effects are the same. Camp preference, but important for consistency.

  The key tension is between Neutrality of Happy Addition and Avoiding the Repugnant Conclusion. These conflict directly; satisfying both might be impossible. This is the deepest fault line in population ethics.

  The user might need to prioritize which principles are most important. They also might not have realized how deep the conflict between Neutrality and Avoiding Repugnance is. Highlighting this helps them understand why no theory satisfies all desiderata. Their unspoken need could be grasping why the debate is unresolved and what trade-offs exist between theories.
answer: |-
  Below is a structured set of desiderata for a theory evaluating whether a larger population is "better," derived from your cases and core concerns. The table summarizes key requirements, followed by analysis of tensions and exclusionary power.

  ### **Desiderata for a Population Ethics Theory**
  | Requirement                          | Motivating Case(s) / General Consideration                                                                 | Non-Negotiable vs. Camp Preference | Excludes Theories That...                                                                 |
  |--------------------------------------|-------------------------------------------------------------------------------------------------------------|------------------------------------|-------------------------------------------------------------------------------------------|
  | **1. Non-Identity Sensitivity**      | Case 7 (Added people replace others with different welfare); Distinguishing identities.                     | Non-Negotiable                     | Ignore *who* exists when evaluating outcomes (e.g., treat people as interchangeable).     |
  | **2. Person-Affecting Principle**    | Distinguishing improving existing lives vs. creating new ones; Cases 5 (life extension), 8 (trade-offs).    | Non-Negotiable                     | Conflate adding happy people with improving current welfare (e.g., "total utilitarianism"). |
  | **3. Neutrality of Happy Addition**  | Case 1 (Happy simulated minds with no external costs); Intuition that adding happy beings isn't bad.         | Camp Preference (Pro-Natalist)     | Declare adding happy lives *bad* or *irrelevant* (e.g., "person-affecting" views).        |
  | **4. Avoid the Repugnant Conclusion** | Case 3 (Barely worth living lives); Case 10 (Huge population with low average welfare).                     | Camp Preference (Anti-Growth)      | Claim a vast population with minimal welfare is better than a small, thriving one.         |
  | **5. Resource Sensitivity**          | Case 4 (Opportunity cost of computational resources); Real-world scarcity (economics/ecology).              | Non-Negotiable                     | Ignore trade-offs/opportunity costs (e.g., theories assuming infinite resources).          |
  | **6. Distinguish Welfare Creation from Transfer** | Cases 8 (Added people worsen existing welfare), 9 (Added miserable people prevent worse misery). | Non-Negotiable                     | Treat all welfare changes identically, regardless of who bears costs/benefits.             |
  | **7. Handle Welfare Uncertainty**    | General concern: Future lives' quality is unpredictable (e.g., climate change, resource depletion).        | Non-Negotiable                     | Assume perfect foresight about welfare outcomes.                                           |
  | **8. Non-Exploitation Principle**    | Case 2 (False beliefs enabling happiness); People not mere means.                                           | Non-Negotiable                     | Justify deception/harm for aggregate gains (e.g., theories ignoring autonomy).             |
  | **9. Define Population Metrics Precisely** | Case 5 (Life extension) vs. new births; Density vs. size; Case 10 (Size vs. average welfare).            | Non-Negotiable                     | Confound size, density, life-years, or number of minds (e.g., theories equating them).     |
  | **10. Policy-Neutrality to Source**  | Case 6 (Immigration vs. births); Should focus on welfare impact, not method of population change.           | Camp Preference (Egalitarian)      | Prioritize natalism over immigration (or vice versa) without welfare justification.        |

  ---

  ### **Analysis of Key Tensions & Exclusionary Power**
  1. **The Core Tension:**  
     - **Neutrality of Happy Addition (#3)** vs. **Avoiding the Repugnant Conclusion (#4)** is the deepest fault line.  
     - *Why?* If adding a happy life is always neutral/good (Case 1), repeated additions logically lead to a massive population where lives are *barely* worth living (Case 3/10). Yet most agree this outcome ("Repugnant Conclusion") is *not* better. **No theory can fully satisfy both.**  

  2. **Other Key Conflicts:**  
     - **Person-Affecting Principle (#2)** clashes with **Neutrality (#3)**: If only existing people matter (strong person-affecting view), adding happy lives is irrelevant. But if adding happy lives is good, person-affecting is violated.  
     - **Resource Sensitivity (#5)** challenges **Neutrality (#3)**: Adding happy lives with opportunity costs (Case 4) may not be neutral.  

  3. **Most Exclusionary Requirement:**  
     - **Avoiding the Repugnant Conclusion (#4)** excludes the widest range of popular theories.  
       - *Total Utilitarianism* (maximize total welfare) fails, as it prefers a vast, minimally happy population.  
       - *Simple Pronatalism* fails, as it assumes more lives = better without welfare thresholds.  
       - *Theories ignoring average welfare/diminishing returns* cannot avoid this pitfall.  

  4. **Non-Negotiables vs. Camp Preferences:**  
     - **Non-Negotiables**: #1 (Identity), #2 (Person-Affecting), #5 (Resources), #6 (Welfare Creation), #7 (Uncertainty), #8 (Non-Exploitation), #9 (Metrics).  
       *Rationale:* These address logical consistency, empirical reality, or fundamental ethics.  
     - **Camp Preferences**: #3 (Neutral Addition), #4 (Avoid Repugnance), #10 (Policy Neutrality).  
       *Rationale:* These reflect value judgments (e.g., whether potential lives have moral weight).  

  5. **Underappreciated Requirement:**  
     - **Non-Identity Sensitivity (#1)** is often overlooked but critical. Theories ignoring identity (e.g., those focused only on aggregate welfare) fail Case 7: Adding happy people who *replace* happier ones can make the world worse, even if total welfare rises.  

  ---

  ### **Conclusion**
  Adequate theories **must** handle identity-dependence, person-affecting distinctions, resource trade-offs, and welfare uncertainty while avoiding exploitation. The irreconcilable tension between valuing happy additions (#3) and rejecting the Repugnant Conclusion (#4) defines the field’s central dilemma. If your theory satisfies all non-negotiables but must choose between #3 and #4, prioritize avoiding the Repugnant Conclusion—as its violation contradicts deeper intuitions about quality of life. No extant theory fulfills all desiderata, but clarifying these requirements exposes why and guides refinement.
