  I'm in a metaphysics reading group that's spent basically the whole term on possible-worlds stuff — Lewis's counterparts, Kripke's Humphrey complaint, the endless back-and-forth over whether the individual in the other world is literally you or just some similar-looking stand-in who isn't you — and we're having an end-of-term party where everyone's supposed to bring one joke, and I've been voluntold to do the metaphysics one. I want it to actually be funny to people who've done the reading, not just a "possible worlds, am I right" shrug. The punchline should really turn on the substance: on the difference between transworld identity (the other-worldly individual just is you) and counterpart theory (it's a distinct counterpart who merely resembles you), or on what each view does to our ordinary talk about what we could have done or been — like why "I could have been a surgeon" ends up being about a counterpart rather than about me. A short dialogue, a little scene, a one-liner, whatever lands hardest, but there has to be a real joke at the end of it, not just jargon followed by a rimshot.

  One more thing: I'd rather not recieve something that makes the group think I've got the two views backwards, so keep the philosophy straight — if the joke exploits the gap between them, it should exploit the actual gap and not some made-up one. Give me the joke, and then a line or two on why the punchline works for someone who knows the theories.
