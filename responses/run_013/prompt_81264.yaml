prompt: |-
  ok so this is kind of a weird one but bear with me.

  student council elections are in three weeks and i'm running for president, and i definately have an actual proposal instead of just promising longer lunch. it's called futarchy. here's the whole thing in my own words: you don't vote on which plan to do, you vote on what you want. the goal. like "more people come to the dances" or "the cafeteria stops being gross." that part is normal democracy. then the arguing stops and everyone bets. every proposal gets two bets going: one on "the thing we care about goes up if we do plan A" and one on "it goes up if we don't do plan A." anyone can put points on either side, everyone starts the year with 100 and it's not real money. at the end of the year you check what actually happened, and whoever bet right keeps more points, so there's a leaderboard and people have a reason to bet what they actually think instead of what sounds nice. and then the rule is: if the first bet is worth more than the second, we do plan A.

  i have to give the campaign speech at the assembly in the gym. three or four minutes, whole school, half of them on their phones. two audiences basically: the econ teacher plus the debate kids, who have actually heard of prediction markets and will be listening to see if i even have the mechanism right, and then everyone else, who is going to hear "betting on the dance" and think i'm either insane or running a gambling ring.

  here's the part i need help with. the speech can't promise anything, because this whole thing is only a way of finding out what people believe will work, it's not a way of making things good. so i can't say "vote for me and the dances will be packed" — the bets only tell you about beliefs. and then the thing i can't dodge: it only works if we all agree to actually do whatever the bets say even when we'd rather not, and i do not have a good answer for why anyone should sign up for that. also you have to pick something countable to check the bets against, and i'm pretty sure any number you pick can be gamed — if we bet on "attendance" someone just gives out free pizza, attendance goes up, nothing is actually better. i'd rather the speech admit all of this than pretend it's solved, but i also can't stand up there and just list problems for three minutes, it still has to be a speech someone would vote for. also there's a girl running against me who's going to say it's just a popularity contest for kids who are good at math.

  write me the speech, and then a section called "Notes on the choices" — 250 words or so — telling me what you were doing: where you actually explain the mechanism, where you dodged, what you left out on purpose, and the three spots the debate club is going to come at me afterward.
