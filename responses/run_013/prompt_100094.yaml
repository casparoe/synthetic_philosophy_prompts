  Hmm, the user wants no softballs - every question must force precision or defense. They've listed 10 specific angles to cover, from conceptual distinctions to historical readings. The follow-ups should be the guest's "least wanted" questions - meaning the most challenging implications of her answers. 

  Notable challenges here: 
