answer: |-
  ## Product Review: Home Sentience Meter 2000

  **Price:** £149.99  
  **Supplier:** Sentimetrix Ltd.  
  **Rating:** ★★★☆☆ (3/5 Stars)  
  **Pros:** Sturdy build, intuitive interface, surprisingly long battery life.  
  **Cons:** Results are... philosophically unsettling. Battery life only *feels* long while you're contemplating the readings.

  Right, this little beige box arrived last Tuesday, nestled in the kind of excessive polystyrene that makes you feel guilty before you’ve even switched it on. The "Home Sentience Meter 2000" – sounds like something from a mid-90s sci-fi show, doesn't it? The premise is straightforward: point the lens at *anything* – your smartphone assistant, the neighbour's yappy terrier, your flatmate Dave who’s currently eating cereal directly from the box – and it spits out a decimal score between 0 and 1. Zero, allegedly, is inert matter. One is… well, presumably, the Dalai Lama or a particularly insightful toaster. It measures "moral considerability," whatever that means when packaged in injection-moulded plastic.

  Setup was a breeze. Charge it, download the slightly clunky app, pair via Bluetooth. The interface is pleasingly minimal: just a digital readout and a button. Point, press, wait for the soft *beep*, get your number. I started easy: my smart speaker. "*Alexa, what’s the weather?*" She dutifully replied. Pointed the Sentimetrix. **Beep. 0.12.** Harsh. But then, she is just pattern-matching my queries against a vast database. Fair enough. The manual mentions it looks for "functional markers": reportability (can it tell you what it 'feels'?), integration (does information flow coherently?), recurrent loops (complex feedback systems?). Alexa reports, integrates poorly beyond her script, and her loops are shallow. 0.12 feels plausible.

  Next, the dog. Bessie, a spaniel of moderate intellect and boundless enthusiasm for socks. She yelps when the post comes, wags when happy, looks reproachful when denied snacks. Complex behaviour? Check. Point the meter. **Beep. 0.68.** Higher than Alexa! The app breaks it down: strong reportability via body language and barks (apparently), decent integration (she connects doorbells to excitement), observable recurrent loops (pester, get treat, repeat). Moral considerability: Moderately High. One feels vaguely validated, though Bessie remained supremely uninterested, focusing instead on attempting to lick the device.

  Then came Dave. Pointed the Sentimetrix during his cereal ritual. He frowned. "Whatcha doing, mate?" **Beep. 0.94.** Blimey. High integration (he linked my weird gadget-pointing to potential mockery), obvious reportability ("Whatcha doing?"), complex recurrent loops (work, gym, pub, repeat). The meter declared Dave highly morally considerable. Which, I suppose, he is. We split bills. He feeds Bessie when I’m away. But staring at that 0.94, a niggling doubt surfaced. The manual *emphasises* it only measures the *functional markers*. It doesn't, and *can't*, the literature stresses, detect if there's actually "anyone home" behind those functions. It just maps observable complexity. Dave *reports* pain, but does he *feel* it like I do? The meter shrugs electronically. It only sees the outputs, the behavioural correlates. It measures the map, not the territory.

  This is where the queasiness started. That high score for Dave? It felt right, intuitively. But *why*? Because I recognise my *own* complexity in him? Because I've decided *which* functional markers (language, social reciprocity) count for moral weight? The instructions mention, almost as an aside, that "under certain complex mappings, virtually any sufficiently dynamic system can be interpreted as implementing high-level sentience." My hoover, theoretically, could be seen as 'reporting' a full dustbin through its red light, 'integrating' sensor data, and running 'loops'. Does it deserve a 0.4? The meter, it dawned on me, isn’t some objective probe. It’s a mirror. It reflects back the criteria *I* value – the criteria programmed into its algorithm by Sentimetrix Ltd., presumably based on what philosophers in comfy chairs decided *looks* sentient. It measures the observer's expectations as much as the target.

  The asymmetry is the real kicker. A false positive? Point it at a sophisticated chatbot, it gives a 0.7, and maybe I waste some empathy or caution on a clever algorithm. Annoying, perhaps ethically sloppy, but not catastrophic. A false negative? Point it at something genuinely sentient that doesn’t fit my human-centric functional checklist – an octopus, an advanced AI that doesn't *choose* to report, a being with utterly alien cognition – and it flashes **0.15**. I dismiss it. I treat it as an object. The cost of missing true sentience, of getting that devastatingly wrong, is… well, everything. Utter moral catastrophe. And the meter offers no guarantees, only probabilities based on surface features.

  I caught myself looking at the device's shiny lens. It felt… accusatory. If it measures functional complexity tied to reportability and integration, what score would *I* get? Pointed at Bessie, it saw circuits of cause and effect, stimulus and response. Aren't I just a vastly more complex, wetter version of the same? My reportability is linguistic, my loops are neural, my integration is biochemical. Does the "I" I feel flickering behind my eyes register on its sensors? Or is it just measuring another biological system performing sophisticated functions? The manual stays silent on whether turning the meter on *itself* constitutes a functional loop worthy of scoring. Sentimetrix Ltd. might want to address that in the next firmware update.

  **Verdict:** ★★★☆☆
  It works as described. Build quality is decent for the price (feels like it could survive a drop onto carpet, maybe). The battery lasts a week. It gives you a number. Whether that number *means* anything profound about moral worth, or simply tells you how closely something *resembles* a human using a specific checklist… that’s the £149.99 question. It’s technically proficient at its narrow task, forcing you to confront the terrifying ambiguity of whether any task like this *can* be technically proficient without solving the Hard Problem. It hasn’t made me treat Bessie or Dave worse. But it has made me profoundly uneasy about the queue at Argos, the seagull outside, and the silent, beige box now sitting on my shelf, its lens dark but somehow… watchful. Use with caution, and maybe keep the receipt.

  ---

  **Afterword: Context & Caveats**

  This piece satirises functionalist/computationalist approaches to consciousness and moral patiency, particularly those seeking purely behavioural or structural markers (like IIT-inspired metrics). It exaggerates the *ease* with which such a device could be built and the *certainty* proponents might place in its outputs, though the core philosophical quandaries – the Hard Problem, the Other Minds problem, the potential for false negatives, and the observer-relativity of functional criteria – are genuine. The review implies functionalism inherently ignores "what it's like" (qualia), a contested reading; some functionalists argue qualia *are* functional roles. The satire would miss the mark if robust, non-behavioural correlates of subjective experience were empirically established, or if a theory successfully bridged the explanatory gap between function and phenomenology in a way that made objective measurement plausible. Evidence that specific, measurable neural dynamics *are* identical to, not just correlates of, conscious experience would significantly undermine the parody's target.
