  10. Mira: "That version only gets you 'at least a draw,' and only because the pass is free. Make the pass cost something, or let it be used once, and the trick collapses. And in Go, where passing is legal and free, the game long ago added compensation points to the second player precisely to kill the first player's edge — and the moment you do that the position isn't symmetric anymore and strategy-stealing stops working altogether. So the argument dies exactly when the game gets balanced, which is suspicious."
      - Mira correctly points out that the free pass version only guarantees a draw. If the pass has a cost, then the monotonicity might break (because passing might be harmful in some positions). She also correctly notes that in Go, the compensation (komi) breaks the symmetry, so the strategy-stealing argument doesn't apply. This is a valid observation. However, it is not "suspicious" that the argument fails when the game is balanced; it is expected because the argument relies on symmetry and monotonicity. The argument's failure in balanced games doesn't make it wrong for symmetric games without compensation. 
      - Rating: 4 (mostly right, but the "suspicious" comment is overblown)

  11. Theo: "No, that's the argument doing real design work. Komi exists because someone understood that a symmetric board with free passing gives the first player a draw at worst. The theorem is what tells you a patch is needed."
      - Theo is right. The strategy-stealing argument explains why the first player has an advantage in symmetric games with free passing, which is why Go added komi. So the argument is useful for game design by highlighting a potential imbalance and suggesting a fix. 
      - Rating: 5 (clearly right)

  12. Mira: "Then you can't have it both ways for a commercial game: either it's symmetric and the first player has a forced win — unfair to the second — or you add compensation and the proof is gone. And 'the first player wins' that no first player can execute doesn't tell you which side of that you're on."
      - Mira is correct that for a commercial game, if the game is symmetric and satisfies the conditions, then the first player has a forced win (which is unfair). To fix that, you add compensation (like komi) which breaks the symmetry and the argument. But then the forced win is gone. However, the argument does tell you that without compensation, the first player wins. So it tells you that you are in the first scenario (unfair) and that you need to add compensation to fix it. Thus, the argument does tell you which side you are on: if the conditions hold, then the first player wins. 
      - Rating: 3 (partly right, but she misses that the argument does tell you that the game without compensation is unfair to the second player)

  13. Theo: "Right, and that's a diagnostic. If your symmetric no-draw game can't be strategy-stolen, then there's some zugzwang or non-monotonicity hiding in it, and knowing that is worth something."
      - This is a good point. If the strategy-stealing argument fails for a symmetric no-draw game, it indicates that the game has non-monotonicity (like zugzwang positions). This can be useful for game designers to understand their game. 
      - Rating: 5 (clearly right)

  14. Mira: "And notice it never explains why the first player wins. It shows they must, by contradiction. It never tells you where the advantage lives."
      - The argument does explain why in a structural way: the first player has an extra move and, because of monotonicity, that extra move is beneficial. The advantage comes from having the first move in a monotone game. However, it doesn't provide a detailed explanation of how the advantage plays out in specific positions. So Mira is partially correct: the explanation is high-level and structural. 
      - Rating: 3 (partly right, but the structural explanation is still an explanation)

  15. Theo: "It does explain: the reason is the combination of symmetry and monotonicity. The first player's spare tempo has to be worth something, so the game can't be a draw, so it's a win. That's a structural explanation, and structural explanations are explanations."
      - Theo is correct. The explanation is structural: the first player wins because of the game's properties (symmetry, no draws, and monotonicity). This is a valid form of explanation in mathematics. 
      - Rating: 5 (clearly right)

  Now, addressing Mira's objection that "the lemma is doing all the work":

  Mira claims that the real content is in the lemma (monotonicity) and the stealing step is trivial. She says the theorem is "just a lemma in a costume."

  In the context of the strategy-stealing argument, the lemma (monotonicity) is indeed crucial and game-specific. Without it, the argument fails. The stealing step is a general, reusable idea that is simple but powerful when combined with the lemma. So it is true that the lemma is doing the heavy lifting for the specific game. However, the value of the strategy-stealing argument is in the combination: it provides a template that can be applied to any game that satisfies the lemma. Thus, the argument as a whole is more than just the lemma. It is a method that transforms the lemma into a conclusion about the winner.

  Therefore, Mira's objection is not fatal to what Theo is claiming. Theo is using the argument to conclude that in Lattice (which he has shown to be monotonic) the first player wins. The lemma is necessary, but the argument is the tool that uses the lemma to get the result. So the objection is more of a deflation of the argument's grandeur (by pointing out that the non-trivial part is the lemma) rather than a refutation.

