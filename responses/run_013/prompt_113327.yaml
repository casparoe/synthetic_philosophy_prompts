  The gene test verdict is about the intrinsic disutility of information (Principle A) and state-dependent utility (Principle F). The standard result in decision theory only considers the instrumental value. Therefore, the gene test is not a counterexample to the standard result about the instrumental value of information. It is about the total utility, which includes the intrinsic cost of knowing. So the verdict in the gene test case is about the overall value of having the information, which includes both instrumental and intrinsic components.

  ### The Village Case and Aggregation

  The village case shows that the standard result (which is for a single agent) does not extend to multiple agents. Even if each individual is better off with the information (because they can adjust their insurance offers appropriately), the collective outcome is worse because the insurance market collapses. This is a classic example of an externality in information acquisition. The standard result is not the right object for the aggregate question because it does not account for strategic interactions.

