  But note: the user also has the case of the poor updater. In that case, the instrumental value might be negative because the agent does not update correctly. So the standard result (which assumes Bayesian updating) does not apply. Therefore, the standard result is not violated in the gene test (if we consider only instrumental value) but is violated in the poor updater (because the agent is not Bayesian).

