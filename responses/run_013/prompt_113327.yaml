  We must also account for the village case where individual and aggregate effects diverge.

  ## Proposed Principles

  The standard result (that information cannot hurt) holds under the following conditions:

  1. **Free**: The information does not cost anything (monetary or otherwise).
  2. **Private**: The act of acquiring the information is not observed by others and thus cannot influence their actions.
  3. **Act-Independence**: The set of available actions does not depend on the information received.
  4. **State-Utility Independence**: The utility function does not depend directly on the state of the world (only through the action and its consequences).
  5. **Bayesian Updating**: The agent updates beliefs correctly via Bayes' theorem.

  But the cases suggest that even when these hold, there might be other reasons why information can be bad. We need to expand the analysis.

  ### Principle 1: Instrumental vs. Intrinsic Value of Information

  The standard result only considers the *instrumental* value of information for making a better decision. However, information can have *intrinsic* (dis)utility. For example, knowing you carry a bad gene might cause anxiety even if it doesn't change any decision. This explains the gene test case: the disutility is intrinsic, not instrumental.

  ### Principle 2: Strategic Interactions and Information Leakage

  Even if the information is acquired privately, if the agent's subsequent actions reveal the information to others, then the information can have negative consequences. This explains the defendant case: by learning the fact, the defendant triggers a legal duty to disclose, which then leads to a bad outcome.

