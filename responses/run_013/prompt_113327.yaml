  The village case is explained by multi-agent externalities (C), so the standard result (for a single agent) is not applicable.

  The poor updater case is explained by non-Bayesian updating (D), so the standard result (which assumes Bayesian updating) is not applicable.

  So the only case that might challenge the standard result for a single Bayesian agent with instrumental utility is the gene test, but that case has no decision. If we add an action (e.g., whether to undergo a preventive surgery that has side effects) then the instrumental value would be non-negative. Without an action, the standard result is vacuously true? Or not defined? Typically, the value of information is defined relative to a decision problem.

