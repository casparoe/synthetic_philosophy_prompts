answer: |-
  Below, I present a set of candidate principles that systematize your verdicts on the value of information. These principles refine the standard Bayesian result by explicitly accounting for its presuppositions and expanding to cases where those presuppositions fail. I state each principle precisely, provide a case that forces it (from your list or a new one), give its verdict on a novel case, explain the gene-test intuition, and conclude with which of your verdicts the best principle cannot fully keep.

  ---

  ### **Core Principle: Instrumental Value of Information (IVI)**
  **Statement**: For a Bayesian expected-utility maximizer, free private evidence has non-negative *instrumental* value if:  
  (i) The information is costless (free);  
  (ii) Acquisition is unobserved (private);  
  (iii) The set of available acts is state-independent;  
  (iv) Utility is state-independent (i.e., \(U(a, \omega)\) depends only on \(a\) and consequences, not directly on \(\omega\));  
  (v) The agent updates beliefs correctly (Bayesian).  
  *Violating any of (i)–(v) can make information harmful.*  

  **Case forcing this clause**: *Umbrella forecast* satisfies all conditions → information is good.  
  **New case and verdict**: *Free private test of a coin's bias before betting on heads/tails*.  
  → Verdict: Good (instrumental value non-negative; improves bet).  

  ### **Supplementary Principles for Non-Instrumental and Multi-Agent Cases**
  #### **1. Principle of Intrinsic Disutility (PID)**  
  **Statement**: Information can have *intrinsic disutility* if learning the truth directly reduces utility, irrespective of acts or consequences. This violates (iv) as utility depends directly on the state \(\omega\).  

  **Case forcing this clause**: *Gene test* (no decision to improve, but knowing the state causes distress).  
  **New case and verdict**: *A free private test revealing whether a deceased loved one suffered*.  
  → Verdict: Bad (intrinsic disutility dominates; no decision to improve).  

  **Explanation for gene test**: Your verdict is not about the *instrumental value of information for decisions* (there is no decision), but about **direct hedonic consequences of knowledge**. PID captures this: utility depends directly on the state (e.g., \(U(\text{know gene+}) < U(\text{ignorance})\)). The standard IVI result is not contradicted—it simply doesn’t apply, as IVI assumes state-independent utility.  

  #### **2. Principle of Strategic Leakage (PSL)**  
  **Statement**: Information can be harmful if its acquisition triggers **mandatory disclosure rules** or **belief-dependent acts by others**, even when acquisition is private. This violates (ii) (privacy) indirectly, as acquisition has observable consequences (e.g., legal duties).  

  **Case forcing this clause**: *Defendant’s liability* (knowing triggers duty to disclose → worse outcome).  
  **New case and verdict**: *A free private credit check before loan negotiation, where acquiring it automatically shares results with the lender*.  
  → Verdict: Bad (if credit is poor, disclosure forces worse terms; better to remain ignorant).  

  #### **3. Principle of Multi-Agent Externalities (PME)**  
  **Statement**: In multi-agent settings, information can be **individually rational** but **collectively harmful** if it enables Pareto-worse equilibria by changing the strategy sets (e.g., collapsing mutually beneficial agreements).  

  **Case forcing this clause**: *Village forecast* (individuals insure optimally given forecast, but market unravels → all worse off).  
  **New case and verdict**: *Two duopolists get a free private demand forecast; each adjusts production, triggering a price war*.  
  → Verdict: Individually good (optimize production), collectively bad (lower profits).  

  #### **4. Principle of Non-Bayesian Updating (PNU)**  
  **Statement**: Information can reduce expected utility if the agent is known to update **non-Bayesianly** (e.g., overreacts, underreacts), violating (v).  

  **Case forcing this clause**: *Poor updater* (e.g., overreacting to mild evidence leads to self-harm).  
  **New case and verdict**: *A free private "IQ estimate" for a student who will obsess over low scores and drop out*.  
  → Verdict: Bad (non-rational updating dominates; better to avoid).  

  #### **5. Principle of Act Availability (PAA)**  
  **Statement**: Information can be harmful if it **alters the set of available acts** (violating (iii)), e.g., by removing valuable options upon learning.  

  **Case forcing this clause**: *Not explicitly in your list, but implied by village/defendant*.  
  **New case and verdict**: *A free private test for a rare disease, where a positive result legally bars you from a desired job*.  
  → Verdict: Bad (learning you’re positive removes the job option; ignorance preserves it).  

  ---

  ### **Resolving the Gene Test vs. Mechanic Conflict**
  - **Gene test** (bad) vs. **Mechanic** (good) are *formally similar* (free, private, no decision-dependent utility), but your intuitions diverge because:  
    - The mechanic’s information has **pure instrumental value** (improves pricing; no intrinsic cost). IVI applies → non-negative.  
    - The gene test has **intrinsic disutility** (distress from knowing). PID applies → negative net utility.  
  - **Key distinction**: The gene test violates IVI’s state-independent utility clause (iv), while the mechanic does not. Your opposite verdicts arise from PID, not IVI.  

  ---

  ### **What the Best Principle Cannot Keep**
  The **Instrumental Value of Information (IVI)** principle, extended with PID, PSL, PME, PNU, and PAA, can explain all your verdicts:  
  - *Umbrella*: IVI holds → good.  
  - *Gene test*: PID → bad.  
  - *Mechanic*: IVI holds → good.  
  - *Village forecast*: PME → individually good, collectively bad.  
  - *Defendant*: PSL → bad.  
  - *Poor updater*: PNU → bad.  

  **However, the village case’s collective harm (PME) cannot be reconciled with IVI’s single-agent focus**. IVI is fundamentally about individual rationality. PME shows that **information can have negative systemic effects in multi-agent interactions**, even when IVI holds for each agent. Thus:  
  - **The verdict PME cannot keep**: The standard IVI result *is* the "right object" for individual value, but **fails as a normative guide for group welfare**. Your village intuition forces us to treat aggregate value as distinct.  

  ---

  ### **Summary of Principles**
  | Principle                | Key Clause                          | Forcing Case         | Novel Case Verdict      |
  |--------------------------|-------------------------------------|----------------------|-------------------------|
  | **IVI**                  | Instrumental value (i)–(v) intact   | Umbrella forecast    | Coin bias test: Good    |
  | **PID**                  | Intrinsic disutility (violates iv)  | Gene test            | Deceased loved one: Bad |
  | **PSL**                  | Mandatory disclosure                | Defendant’s liability| Credit check: Bad       |
  | **PME**                  | Multi-agent externalities           | Village forecast     | Duopolists: Coll. bad   |
  | **PNU**                  | Non-Bayesian updating (violates v)  | Poor updater         | IQ estimate: Bad        |
  | **PAA**                  | Act set changes (violates iii)      | (Implicit)           | Disease test: Bad       |

  **Final Honest Statement**: The best unified framework—**IVI + PID + PSL + PME + PNU + PAA**—can uphold all your verdicts. However, **IVI alone cannot explain the village’s aggregate harm**; this requires PME, which treats group welfare as irreducible to individual rationality. The gene test is not a failure of IVI but a triumph of PID: it shows that "value of information" must partition instrumental and intrinsic effects. If forced to discard one intuition, the *village aggregate harm* is the hardest for IVI to absorb, as it exposes IVI’s limitation to single-agent contexts.
