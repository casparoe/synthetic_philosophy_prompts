  However, the poor updater case does have a decision and violates the Bayesian updating condition, so it is a genuine counterexample to the standard result if we consider agents that are not perfect Bayesians.

  ## Conclusion

  The principles are:

  1. **Intrinsic Disutility Principle**: Information can have intrinsic disutility independent of its decision-making value.
  2. **Strategic Leakage Principle**: Information can be harmful if its acquisition forces revelation that leads to a worse outcome.
  3. **Multi-Agent Externality Principle**: In multi-agent settings, information can harm the group by changing the set of feasible actions and causing negative externalities.
