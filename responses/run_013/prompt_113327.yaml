  Therefore, we can formulate:

  **Principle 0 (Intrinsic Utility of Information):** Information can have intrinsic utility (positive or negative) independent of its instrumental value.

  ### Candidate Principles

  We propose the following set of principles to explain the cases:

  **Principle A (Intrinsic Disutility):** Information can be harmful if it causes intrinsic disutility (e.g., anxiety, regret) regardless of its instrumental value.

  **Principle B (Strategic Leakage):** Information can be harmful if, even when acquired privately, it must be revealed (by law, contract, or strategic necessity) and this revelation leads to a worse outcome.

  **Principle C (Multi-Agent Externalities):** In multi-agent settings, information can be harmful to the group even when it is beneficial to each individual in isolation, because it can change the set of feasible actions (or contracts) in a way that leads to a Pareto inferior outcome.

  **Principle D (Non-Bayesian Updating):** Information can be harmful if the agent does not update beliefs correctly (e.g., overreacts, underreacts, or otherwise processes the information poorly).

