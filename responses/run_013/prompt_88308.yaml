prompt: |-
  Next month I'm giving a work-in-progress paper to our philosophy department and I'm trying to anticipate teh Q&A, so I want you to draft my prep sheet. The paper defends a view I call scripted coordination. The claim is that joint action doesn't need shared intention, we-intention (the idea that each participant has an intention that's irreducibly first-person plural), or joint commitment (a normative bond that each participant recognises). All it needs is that each participant follows a public script — a mutually known set of conditional instructions, like a recipe, a protocol, a musical score, or a clause in a statute — and that they stay mutually responsive to deviations from it. I say the script is an external artefact, not a mental state; it can be implicit, and it can be renegotiated mid-action. I also run a 'deviation test': if an agent could have deviated without the joint action collapsing, their contribution is joint; if not, it's mere aggregate behaviour. And I use this to say collective responsibility is distributed by script-role and capacity to deviate, not by any group mind.

  The audience is mostly philosophy of mind and action people, plus two social ontologists who work on collective intentionality, a legal philosopher who writes on corporate responsibility, and a game theorist who is allergic to anything that sounds like shared intention. They're friendly but territorial, adn some will think I'm just redescribing coordination; others will think I'm denying the phenomenon of acting together. I've got 20 minutes to present and 30 for questions.

  Give me the eight or so objections I'll actually get from this lot, ordered by how much damage they'd do, phrased the way each would phrase them. For each one: a two-minute reply, a note on where the reply is soft, and what I should concede up front. Include the question I'm hoping nobody asks, and tell me which single reply has to land for the paper to survive. Don't give me a bibliography or reading list — I know the literature and I don't need citations. Please write it in British English (recognise, behaviour, sceptical, etc.).
reasoning: |-
  Okay, the user is preparing for a philosophy department presentation on their "scripted coordination" theory. They need to anticipate objections for the Q&A session. Let me start by understanding their core argument. They claim joint action doesn't require shared intentions, we-intentions, or joint commitments. Instead, it relies on public scripts and mutual responsiveness to deviations. The deviation test distinguishes joint actions from aggregates. The audience includes specialists in philosophy of mind, social ontology, legal philosophy, and game theory. Each group has potential biases: some might see this as re-describing coordination, others as denying the essence of joint action.

  First, I need to identify the most damaging objections. The social ontologists might attack the absence of shared intentionality. The legal philosopher could question responsibility distribution. The game theorist might challenge the deviation test's applicability. Prioritizing these based on impact: if the deviation test fails, the whole framework crumbles. Also, the "zombie" objection about scripts without mutual responsiveness could be critical.

  Next, phrasing objections authentically. For example, Tuomela might argue scripts are just proxies for we-intentions. The legal philosopher might point out scripts can't assign blame without normative commitments. The game theorist could say the deviation test doesn't hold in complex scenarios. Each objection needs a concise reply, noting weaknesses and concessions. 

  The user's hidden needs: they want to defend against territorial critiques without alienating anyone. They need to concede where necessary but hold ground on key points. The unasked question about scripts requiring prior joint action is a vulnerability. Addressing it by admitting scripts often emerge from prior coordination but aren't inherently intentional.

  The critical reply to land is the deviation test explanation. If that holds, the paper survives. Ensuring the response clarifies that mutual responsiveness differentiates script-following from mere aggregation. Also, emphasizing that scripts are dynamic and renegotiable can mitigate concerns about rigidity. Balancing concessions with strong counterarguments is key here.
answer: |-
  Here’s your Q&A prep sheet, tailored to your audience and ordered by potential damage level. I’ve flagged soft spots and necessary concessions upfront. Phrases are styled to match each questioner’s likely framing.

  ---

  ### **Core Argument Recap (For Your Reference)**
  - **Scripted Coordination**: Joint action emerges from agents following a public, mutually known script (external artefact, implicit/explicit, renegotiable), plus mutual responsiveness to deviations.  
  - **Deviation Test**: An agent’s action is "joint" iff they *could* deviate without collapsing the action; else, it’s mere aggregation.  
  - **Collective Responsibility**: Distributed by script role + capacity to deviate; no group mind required.  

  ---

  ### **Anticipated Objections & Replies**  
  *(Ordered by Severity: 1 = Most Damaging)*  

  1. **The Social Ontologist’s "Zombie Coordination" Challenge**  
     *"Your model reduces joint action to mindless script-following. Imagine two agents mechanically executing a musical score *without* any mutual responsiveness—just two solos overlapping. By your ‘deviation test’, if neither *can* deviate (they’re robots), it’s not joint action. But if they *are* mutually responsive, you’ve smuggled in shared intention!"*  
     - **Reply (2-min)**: "Mutual responsiveness isn’t a hidden ‘intention’—it’s dynamic error-correction. The robots case fails because scripts *require* interpretative flexibility. A score isn’t just notes; it implies responsiveness to tempo shifts or ensemble cues. If both agents rigidly ignore each other, there *is* no script—just parallel play."  
     - **Soft Spot**: Blurring "script" boundaries (when does rigidity void the script?).  
     - **Concede Upfront**: "I grant scripts presuppose *minimal* agency—but not collective intentionality."  

  2. **The Legal Philosopher’s "Responsibility Gap"**  
     *"Corporate statutes *are* scripts, yet responsibility isn’t distributed by role alone. When a bank clerk launders money ‘following protocol’, we hold the *corporation* liable—precisely because of joint commitment, not just deviation capacity. Your view can’t explain normative bonds in institutional blame."*  
     - **Reply**: "Collective responsibility here tracks *script authorship*, not execution. The clerk’s deviation capacity is low (firing risk), but the *drafters* had high capacity—they’re liable for designing exploitable scripts. Statutes are scripts that encode power asymmetries."  
     - **Soft Spot**: Doesn’t fully address why we blame *groups* (not just individuals).  
     - **Concede**: "Institutional responsibility may require layered scripts—I’m focusing on base-level joint action."  

  3. **The Shared Intention Diehard’s "Redescription" Attack**  
     *"This is just shared intention in disguise! A ‘public script’ only works because we *intend* to use it *as* a coordination device. Your ‘mutual knowledge’ requirement *is* a we-intention—you’ve relabelled the engine, not removed it."*  
     - **Reply**: "Mutual knowledge ≠ joint commitment. We can know a script exists (e.g., traffic norms) without endorsing it. Think of occupying a protest: police and protesters follow *conflicting* scripts (control vs. resist), yet their clash is a joint action—without shared goals."  
     - **Soft Spot**: Struggles with cases of *antagonistic* joint action.  
     - **Concede**: "Yes, scripts often emerge from prior coordination—but that needn’t be *intentional*."  

  4. **The Game Theorist’s "Deviation Test" Trap**  
     *"Your deviation test is either trivial or incoherent. In Bach/Stravinsky (a pure coordination game), *any* deviation collapses action—so by your test, it’s not joint! But in Prisoner’s Dilemma, both *can* deviate (defect)—yet we’d never call it ‘joint action’."*  
     - **Reply**: "Crucially, the test applies *within* a script. Bach/Stravinsky isn’t a script—it’s a payoff matrix. A script (e.g., ‘meet at the Eiffel Tower if lost’) defines *how* to coordinate. In PD, if players adopt a tit-for-tat *script* (not just strategy), mutual deviation *is* possible (e.g., pausing punishment)."  
     - **Soft Spot**: Scripts vs. strategies distinction needs sharpening.  
     - **Concede**: "I need clearer criteria for what counts as a ‘script’—but note: scripts constrain *actions*, not just beliefs."  

  5. **The Action Theorist’s "Phenomenology" Objection**  
     *"You deny the lived experience of acting *together*. When I dance tango, I don’t think ‘I’m following Rule 4(b)’; I feel *attuned* to my partner. Your model reduces this to mechanics—it can’t capture the distinctive first-person plural perspective."*  
     - **Reply**: "The phenomenology is real—but it’s an *output* of smooth script-following, not its basis. Attunement emerges when deviations are seamlessly corrected (e.g., a dip in tango). If your partner freezes, that phenomenology shatters—revealing the script’s scaffolding."  
     - **Soft Spot**: Risks sounding eliminativist about shared agency.  
     - **Concede**: "I’m not denying the *experience*—just arguing it’s not metaphysically necessary."  

  6. **The Social Ontologist #2’s "Bootstrapping" Puzzle**  
     *"How do scripts *become* mutually known without prior joint action? If we negotiate a script mid-parade, isn’t *that negotiation* itself a joint action requiring shared intention?"*  
     - **Reply**: "Scripts can be inherited (norms), imposed (laws), or emerge from trial-and-error (e.g., jazz improvisation). Renegotiation uses *sub-scripts* (e.g., ‘if confused, signal with eyebrows’)—no infinite regress."  
     - **Soft Spot**: Unclear how sub-scripts avoid foundational joint action.  
     - **Concede**: "Yes, *some* scripts may root in primitive coordination—but not necessarily ‘joint’ by traditional criteria."  

  7. **The Territorial Sceptic’s "Triviality" Jab**  
     *"Isn’t this just ‘coordination’ with extra steps? Economists have modelled this since Schelling—why call it ‘joint action’?"*  
     - **Reply**: "Schelling-esque coordination lacks *robustness*. Two people meeting at noon is coincidence; meeting *despite a train delay* because they follow a script (‘wait 15 mins then text’) is joint action. Mutual responsiveness to glitches is key."  
     - **Soft Spot**: "Robustness" is underdeveloped.  
     - **Concede**: "I *am* redescribing coordination—but to show it suffices for joint action."  

  8. **The We-Intention Advocate’s "Authority" Question**  
     *"Scripts need *authority* to bind agents. A statute works because we *recognise* its force—which is joint commitment. Without this, why not deviate whenever convenient?"*  
     - **Reply**: "Authority isn’t inherent—it’s script-relative. In a mafia heist, the ‘script’ (e.g., ‘driver waits 3 mins’) binds via fear, not commitment. Binding force comes from *local* incentives (norms, sanctions), not collective ‘oughts’."  
     - **Soft Spot**: Downplays normativity in benign cases (e.g., promises).  
     - **Concede**: "Some scripts *acquire* normative force—but it’s not essential."  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"If the script is ‘external’, how does it *causally explain* behaviour? When I follow a recipe, my intention (‘I intend to bake’) *mediates* between the text and action. Aren’t you confusing the *structure* of coordination with its *psychology*?"**  
  - **Why It’s Deadly**: Forces you into philosophy of mind quicksand. If scripts don’t interact with mental states, they’re epiphenomenal.  
  - **Salvage Plan**: "The script is a *public affordance*—like a door handle. It shapes *possible* actions without dictating intentions. My intention might be ‘I intend to follow this script’, but that’s individual—not plural. The script’s role is ecological, not psychological."  

  ---

  ### **The Make-or-Break Reply**  
  **#4 (Game Theorist’s Deviation Test)** must land. If your audience rejects the deviation test as incoherent, your core criterion for "jointness" collapses. Emphasise:  
  > *"The test isn’t about *game-theoretic* deviations (changing strategy), but *script-contextual* ones. A pianist *can* skip a repeat in a sonata (joint action survives) but *can’t* play a jazz solo (script collapses). Capacity is defined by the script’s elasticity."*  

  **Key Defence Tactics**:  
  - **Preempt**: In your talk, say: *"I’m *not* claiming scripts are sufficient for all collective phenomena—just that they’re sufficient for minimally joint action."*  
  - **Reframe**: Call shared intention a "theoretical placeholder" your model fills with concrete mechanisms.  
  - **Flatter the Game Theorist**: "Unlike shared intention models, my view *is* formalisable in your frameworks."  

  Good luck—this is a sharp crowd, but your angle is refreshingly vicious.  

  *(British English compliance checked: artefacts, mutualised, sceptical, behaviour, recognise.)*
