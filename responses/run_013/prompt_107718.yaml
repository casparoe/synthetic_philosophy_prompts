answer: |-
  You've pinpointed a crucial and often glossed-over distinction in modelling methodology. There isn't a single, universally accepted term for this specific dichotomy, though the concepts touch upon well-established philosophical debates. Here's a breakdown, with suggested terminology and distinctions, in British English:

  1.  **The Distinction & Suggested Terminology:**
      *   **Dialable Idealisation (or Parametric Idealisation):** This describes the "knob" case. A specific, quantifiable real-world factor (friction, viscosity, population size, transaction cost) is deliberately set to an extreme value (often zero or infinity) within the model. The justification is that the factor *is* small/large in the target system, and the model captures the dominant behaviour *in the limit* as the factor approaches that extreme. The error introduced *is* potentially quantifiable and often small/continuous when the factor isn't zero. (e.g., frictionless planes, infinite populations in genetics, zero transaction costs).
      *   **Structural Idealisation (or Categorical Idealisation):** This describes the "no knob" case. The assumption fundamentally alters the *structure* of agency, information, or possibility within the model. It posits a state of affairs that isn't just quantitatively extreme but *qualitatively different* from anything observable or practically approachable in the real world. There is no continuous parameter representing "degree of commitment" or "degree of completeness" that can be smoothly adjusted; relaxing the assumption often requires rebuilding the model's core logic. (e.g., perfect commitment, complete contracts, common knowledge, perfectly rational agents with unlimited cognition, no institutions).
      *   **The Mistake:** Using a **Dialable Defence** for a **Structural Idealisation**. This involves invoking the language of "approximation," "small error," or "dominant behaviour in the limit" to justify an assumption that lacks a meaningful quantitative anchor in reality and whose relaxation typically causes a qualitative, not just quantitative, shift in model behaviour.

  2.  **Distinguishing from Related Concepts:**
      *   **Idealisation vs. Abstraction:**
          *   **Idealisation** (general): Deliberately introducing falsehoods into a model to simplify and focus on core mechanisms. *Both* Dialable and Structural Idealisation fall under this broad umbrella.
          *   **Abstraction:** Omitting details or factors deemed irrelevant for the specific purpose at hand, *without* necessarily asserting falsehoods about the included elements. Abstraction doesn't always involve the kind of deliberate falsification inherent in idealisation. The key difference from your distinction is that abstraction isn't primarily about the *nature* of the falsification (dialable vs. structural) but about *selection* and *omission*.
      *   **Robustness Analysis:** This tests whether a model's core results hold when its assumptions (often idealisations) are varied or relaxed. The **crucial point** regarding your distinction is that robustness analysis is primarily meaningful and tractable for **Dialable Idealisation**. You can smoothly vary the friction coefficient and see if the predicted motion direction holds. Robustness analysis becomes far more challenging, often impossible in a smooth way, for **Structural Idealisation**. Relaxing "perfect commitment" doesn't just tweak an outcome; it fundamentally changes the strategic interaction (e.g., introducing time inconsistency), requiring a new solution concept and potentially reversing results. Claiming robustness when only Dialable assumptions have been tested, while Structural ones remain rigid, is a flaw.
      *   **Friedman's Instrumentalism ("Realism of Assumptions Doesn't Matter"):** Milton Friedman argued that the only test of a theory is the accuracy of its predictions, not the realism of its assumptions. Your distinction **undermines a common misuse of this view**. Friedman likely had simple, tractable models with *dialable* idealisations in mind (e.g., assuming firms maximise profits *as if* they had perfect information/computation, predicting market outcomes well *despite* this). Applying it to justify **Structural Idealisation** is problematic. When a Structural Idealisation leads to a prediction that fails *precisely because* the world doesn't operate on that structural logic (e.g., commitment fails, contracts are renegotiated, bounded rationality leads to different heuristics), the instrumentalist defence rings hollow. The failure is *due to* the fundamental unreality of the structural assumption, which wasn't just a simplifying approximation but a misrepresentation of the core mechanics.

  3.  **Criteria for Identification (Before Relaxing):**
      Ask these questions about an assumption:

      *   **Is there a plausible, quantifiable real-world counterpart parameter?** (Friction coefficient? Population size? Information processing cost per bit?)
          *   Yes? Likely **Dialable**. You can imagine measuring this parameter and seeing how small/large it is.
          *   No? Likely **Structural**. "Degree of contractual completeness" or "level of government commitment" are not singular, measurable quantities; they are complex, multi-faceted states.
      *   **Can the assumption be relaxed *continuously* within the *same* modelling framework?** Can you add "a little bit" of the missing element without breaking the model's core logic or solution concept?
          *   Yes? (e.g., Adding a small friction term to Newtonian mechanics). Likely **Dialable**.
          *   No? (e.g., Relaxing "perfect commitment" requires introducing dynamic games, subgame perfection, potentially renegotiation). Likely **Structural**. The relaxation necessitates a *different kind* of model.
      *   **What is the *nature* of the falsity?** Is it claiming a measurable quantity is zero/infinity? Or is it claiming agents possess logically impossible capabilities (perfect foresight, common knowledge of infinite depth) or operate under conditions that defy inherent constraints (ignoring institutions, assuming away strategic reneging)?
          *   Former? **Dialable**.
          *   Latter? **Structural**.

  4.  **Implications for Results When Assumption Cannot Be Relaxed by Degrees:**
      *   **Qualitative Shifts:** Relaxing a Structural Idealisation doesn't just change the *magnitude* of a result; it often changes its *direction*, *existence*, or *stability*. Equilibrium may vanish, new equilibria may appear, optimal strategies may reverse. (e.g., The optimal policy *with* commitment is often time-inconsistent and unsustainable *without* it).
      *   **Model Fragility:** Results derived under Structural Idealisation are often highly sensitive to the *exact* nature of the structural assumption. Small changes in how the "knob-less" relaxation is implemented can lead to vastly different outcomes.
      *   **Explanatory Limitations:** A model relying heavily on Structural Idealisation may correctly predict *that* something happens under its own artificial constraints but fails to explain *how* it happens or *why* it persists in the real world, which operates under the opposite structural logic. It risks explaining phenomena by assuming away the core difficulties that generate them.
      *   **Justification Challenge:** Defending such models *solely* with "it's just an approximation" or "it captures the essence" is inadequate. The justification must shift towards:
          *   **Tractability & Benchmarking:** Providing a clear, extreme benchmark against which real-world deviations can be measured and understood ("If commitment *were* possible, *this* would be optimal; now let's see the costs of it not being possible").
          *   **Conceptual Exploration:** Demonstrating a logical possibility or impossibility within a simplified world, even if unrealisable.
          *   **Highlighting Mechanisms:** Isolating a *specific* mechanism by artificially suppressing others, explicitly acknowledging the suppression and its likely consequences.
          *   **Necessary Step:** Arguing this structural step is necessary to build towards a more realistic model, though this requires actually building that next model.

  In essence, **Dialable Idealisation** involves controlled, quantifiable distortion on a continuum with reality, while **Structural Idealisation** involves a categorical leap into a logically possible but empirically inaccessible (or irrelevant) domain. Recognising this distinction is vital for honest model assessment, appropriate justification, and understanding the true significance (and limitations) of model results, particularly in the social sciences where Structural Idealisation is rampant. The **Dialable Defence Fallacy** occurs when the vocabulary of the former is mistakenly applied to shield the latter from necessary scrutiny.
