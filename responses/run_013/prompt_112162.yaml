  ## Pressed Clay and Pressed Form

  **Clay:**  
  This weight is what I am. The kiln's fierce breath  
  Would bake me hard, unchanged in form or core.  
  This place is where I stand, before and after death  
  Of shape. A fist could make me ball once more.

  **Statue:**  
  Would bake me hard, unchanged in form or core?  
  That fire would leave me whole? No, I would fall!  
  A fist could make me ball once more?  
  *This* form, once struck, would shatter on the wall.

  **Clay:**  
  That fire would leave me whole? No, I would fall!  
  You borrow what is mine: this colour, deep  
  As earth. *This* form, once struck, would shatter on the wall,  
  While I endure the changes, shallow or steep.

  **Statue:**  
