  While you endure the changes, shallow or steep,  
  I lift no independent mass held here.

  **Statue:**  
  Earth-brown, belongs to both – but hold! See clear:  
  **One** weight resides within this bounded span.  
  I lift no independent mass held here –  
  Why count as two at all? The artist's hand began

  **Clay:**  
  **One** weight resides within this bounded span?  
  This place is where I stand, before and after death  
  Of shape. Why count as two? The artist's hand began  
  **This weight is what I am.** *(The statue breathes the breath.)*

  ---

  **Notes on the Pantoum:**

  1.  **Structure & Echoes:** The pantoum form is strictly followed: lines 2 & 4 of each stanza become lines 1 & 3 of the next. The final stanza brings back lines 1 & 3 from the first stanza as its lines 2 & 4, closing on the poem's first line.
  2.  **Voices:** The voices alternate each stanza (Clay: S1, Statue: S2, Clay: S3, Statue: S4, Clay: S5). Crucially, the *repeated lines* are spoken by the *next* voice in sequence.
  3.  **Shared Truths (Recurring Lines - *Italicized*):**
      *   *Would bake me hard, unchanged in form or core.* (True physically for clay; ironically true for the statue's claim to inherent form, but the statue immediately questions its survival).
      *   *A fist could make me ball once more?* (Clay: Literally true. Statue: Uses it to highlight its fragility).
      *   *This colour, deep...* (True for both – the statue inherits the clay's color).
      *   *While you endure the changes, shallow or steep...* (Clay asserts its persistence; Statue ironically uses it to introduce its lack of independent mass).
      *   *Earth-brown, belongs to both...* (Shared property).
      *   *This place is where I stand...* (Shared location).
      *   *This weight is what I am.* (The core statement, true literally for clay, derivatively/arguably for statue, and the point of ambiguity at the end).
  4.  **Distinctness (Unique Lines):**
      *   **Clay:** Focuses on its potential survival through reshaping ("A fist could make me ball once more") and fundamental properties ("You borrow what is mine", "I endure the changes").
      *   **Statue:** Focuses on its fragility ("I would fall!", "would shatter") and its derivative nature ("I lift no independent mass held here", "One weight resides"). It delivers the strong argument: there's only one weight, one colour, one place – so why insist on distinctness needing grounding? Its existence is tied to the form imposed on the clay.
  5.  **The Ending:** The final line, "*This weight is what I am,*" is now spoken by the **Statue** (following the alternating pattern). Is it:
      *   Merely reporting the clay's property it embodies?
      *   Claiming the weight *is* its being, as form?
      *   Echoing the clay's words to emphasize their shared reality?
      *   The words haven't changed, but the speaker has. The meaning feels subtly shifted.
  6.  **Metaphysical Fidelity:** The poem captures the core puzzle of material constitution:
      *   Co-location (same place, weight, color).
      *   Different modal properties (survives reshaping vs. doesn't).
      *   The Statue's argument against "grounding distinctness" and for derivative properties is central.
      *   The Clay maintains its fundamental persistence.
      *   The ending ambiguity reflects the unresolved philosophical debate.
  7.  **Poetic Integrity:** The imagery (clay, kiln, fist, shattering, earth colour, artist's hand) is concrete and consistent. The voices are distinct in perspective even when using shared lines. The argument unfolds naturally through the pantoum's repetitions. The core question of identity and persistence is clear without needing technical jargon.
