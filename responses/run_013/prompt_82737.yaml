  **BUREAU OF CONTINUITY**  
  **Internal Guidance Note: BC/IG/78/Rev.4**  
  **Subject: Standard Adjudication Procedures for Conventional Designation and Causal Nexus**  
  **Date:** 18th Waxing Moon of Māgha, 214  

  ---

  **1. Purpose and Scope**  
  This document provides standardized protocols for resolving queries pertaining to the continuity of conventional designations (e.g., "debtor," "spouse," "defendant") across temporal discontinuities. All determinations must reflect the ultimate truth of conditioned arising (*paṭiccasamuppāda*) while upholding conventional functionality (*vohāra*).  

  **2. Foundational Principles**  
  2.1. **Aggregate Analysis**: A "person" is a provisional label (*sammuti*) applied to a causally contiguous stream (*santāna*) of the five aggregates (*khandhas*): form (*rūpa*), feeling (*vedanā*), perception (*saññā*), volitional formations (*saṅkhāra*), and consciousness (*viññāṇa*).  
  2.2. **Causal Nexus**: Continuity of designation requires unbroken causal dependency (*idappaccayatā*), not identity.  
  *Example*: A flame igniting a second flame is designated "the same fire" for practical purposes, absent evidence of extinguished fuel.  

  **3. Adjudication Procedures**  
  **3.1. Contractual Obligations (e.g., Loans, Leases)**  
  3.1.1. The signatory (*A*) and present claimant/obligor (*B*) share designation if:  
  (a) *B*’s aggregates manifest direct causal dependency on *A*’s volitional formations (e.g., habitual repayment behavior);  
  (b) Documentation (e.g., signatures, biometric markers) demonstrates unbroken conventional labeling.  
  *Ruling BC/R/551*: A debtor remains liable despite aggregate alteration (*rūpa* decay due to aging), provided volitional formations (*sañkhāra*) maintain repayment intent.  

  **3.2. Marital Status**  
  3.2.1. "Spouse" designation persists if aggregates exhibit:  
  (a) Continuity of mutual recognition (*saññā*);  
  (b) Shared volitional formations toward cohabitation/responsibility;  
  (c) Absence of formal dissolution (*khandha*-dissolution certificate, Form BC-7).  
  *Ruling BC/R/892*: Spousal inheritance rights lapse if one party’s consciousness stream (*viññāṇa*) exhibits irreversible discontinuity (e.g., advanced dementia), regardless of bodily continuity.  

  **3.3. Criminal Liability**  
  3.3.1. Designation "perpetrator" requires:  
  (a) Causal link between past volitional formation (*saṅkhāra*) and present aggregate configuration;  
  (b) Continuity of witness-identifiable markers (*rūpa*, *saññā*).  
  *Ruling BC/R/204*: An individual may be designated successor to a perpetrator’s liability if:  
  (i) >75% aggregate overlap exists (per Form BC-12 Forensic Aggregate Audit);  
  (ii) The causal stream demonstrates unrepentant volition (*abhijjhā*-*domanassa*).  
  *Note*: Sentencing severity adjusts for aggregate drift (see *BC/Sentencing Matrix v.3*).  

  **3.4. Insurance Claims**  
  3.4.1. A claimant is the "insured party" if:  
  (a) Bodily form (*rūpa*) exhibits traceable continuity (e.g., DNA, biometrics);  
  (b) The claim arises from pre-existing volitional formations (e.g., premium payments).  
  3.4.2. Claims are void if aggregate dissolution (death) precedes the insured event.  
  *Ruling BC/R/331*: A claimant severely disfigured (radical *rūpa* alteration) retains designation if consciousness (*viññāṇa*) and volition (*saṅkhāra*) demonstrate dependency on the pre-event stream.  

  **3.5. Debt Discharge**  
  3.5.1. Debt dissolves if:  
  (a) The causal nexus is broken (e.g., documented cessation of volitional formations toward obligation);  
  (b) Aggregate reconfiguration exceeds 90% discontinuity (per BC-12 Audit).  
  *Ruling BC/R/419*: Medical bankruptcy may be granted for irreversible *saṅkhāra* alteration (e.g., frontal lobe injury negating financial *cetanā*), despite bodily continuity.  

  ---

  **4. Dissolution and Designation Transfer**  
  4.1. "Death" is reclassified as "Irreversible Aggregate Dissolution" (IAD).  
  4.2. Property/Title transfers to the causally nearest contiguous stream (typically kin or designated successor).  
  4.3. *Exception*: Criminal liability does not transfer post-IAD (see 3.3).  

  **5. Excluded Queries**  
  5.1. Questions regarding whether "the self is the body or distinct" are operationally null (ref: *Avyākata* classification).  
  5.2. Bureau policy does not engage with annihilationist (*ucchedavāda*) or eternalist (*sassatavāda*) interpretations.  

  ---

  **Footnote: Dissenting Observation (Junior Officer K. Vohāra)**  
  > *While the Bureau grounds policy in the orthodox "conventional/ultimate" dichotomy, our adjudications functionally posit a pragmatic entity (*pudgala*)—neither identical to nor separate from the aggregates—to bear rights/liabilities. This mirrors the historical* Pudgalavādin *position condemned at the Third Council for "obscuring emptiness." If causal continuity alone justifies designation, why is a 75% aggregate overlap required? The Bureau implicitly reifies what it denies the moment a form (BC-12) is filed. Are we not institutionalizing heresy?*  

  ---

  **Review Frequency:** Biannual  
  **Authorized By:** Director of Continuity Assurance  

  ---
  **Word Count:** 698  

  ---

  **Key Satire Elements Incorporated**  
  1. **Accurate Metaphysics**:  
     - Aggregates, causal continuity, chariot simile (implied), conventional/ultimate distinction.  
     - Rejection of annihilationism (rights/designations persist conventionally).  
     - Reference to the Buddha’s silence on self/body identity (*Avyākata*).  

  2. **Bureaucratic Absurdity via Doctrine**:  
     - "Forensic Aggregate Audits" (Form BC-12) quantifying "aggregate overlap."  
     - "Volitional continuity" overriding bodily decay (debt, marriage).  
     - Criminal liability based on ">75% aggregate overlap" + "unrepentant volition."  

  3. **Humane vs. Appalling Rulings (Unsignaled)**:  
     - *Humane*: Medical bankruptcy for frontal lobe injury negating financial intent (Ruling 419).  
     - *Appalling*: Criminal liability imposed on a 75% "aggregate successor" (Ruling 204).  

  4. **Pudgalavādin Critique in Footnote**:  
     - Junior officer accuses the Bureau of covertly adopting the "neither identical nor distinct" heresy.  
     - Highlights the tension between doctrine and paperwork-induced reification.  

  5. **Deadpan Tone**:  
     - No jokes, no winks. Rulings like "death reclassified as IAD" are stated as procedural updates.  
     - The dissenting footnote uses technical terminology (*pudgala*, *Avyākata*) without explication.  

  This approach ensures the humor arises from the collision of meticulous Buddhist metaphysics with the banal evil of bureaucracy—all while letting tradition nerds spot the references to Milinda, Pudgalavādins, and the *Avyākata*.
