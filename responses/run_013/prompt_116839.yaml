prompt: |-
  I teach a 90-minute session on Islamic occasionalism to a 14-person upper-level undergraduate seminar — philosophy and religious studies students who have read Hume on causation but know no Arabic and have not encountered Ashʿarite theology before. I want a runnable activity, not a lecture. The target is the pair of claims that al-Ghazālī's occasionalism runs together: (i) nothing in the world has a power to produce anything in anything else, so the connection between what we call cause and what we call effect is only a habitual regularity — ʿāda, God's custom — which reason cannot discover to be necessary and which God can interrupt at will; and (ii) God is nonetheless the sole agent, so that even when I act, the act is created by God and only acquired (kasb) by me, which is meant to preserve both the settled order of the world and my responsibility for what I do.

  Design the activity so that students feel (i) from the inside. They should build up expectations, be rewarded for relying on them, and then discover that nothing in the game ever guaranteed the regularity they had come to treat as a law — and, if you can manage it, that what kept the regularity going was a choice rather than a mechanism. Let (ii) then land as the twist, so that they have to ask whether their own moves were ever really theirs. Give me roles or rules, materials, a scoring scheme that needs no money, a minute-by-minute timeline for the 90 minutes, and a debrief that maps what happened onto the two claims and explains why al-Ghazālī needs (ii) once (i) is granted. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the view the activity cannot reproduce and that I will have to supply myself — including any place where the design leans on a contested reading of al-Ghazālī. Commit to one design and one set of rules, with your reasons, rather than laying out alternatives for me to choose between.
reasoning: |-
  We are designing a classroom activity to help students experience occasionalism from the inside. The activity should illustrate two key claims of al-Ghazālī: 
   (i) The world runs on habitual regularity (God's custom) without necessary connection, and God can interrupt at will.
   (ii) God is the sole agent, and human actions are created by God and only acquired by humans.

   Activity Design: "The Divine Custom Game"

   Overview:
   We will create a game where students participate in a simple, rule-based environment that they believe is governed by fixed rules (like laws of nature). However, the rules are actually being enforced by a hidden "God" (played by the instructor) who can change the rules at any time without warning. The game will have two phases: 
     Phase 1: Building expectations of regularity (about 40 minutes).
     Phase 2: Introducing the twist of divine intervention and the concept of acquisition (kasb) (about 30 minutes).
     Debrief: 20 minutes.

   Materials:
     - A deck of cards (or multiple decks if needed) for the players.
     - A whiteboard or flip chart to keep score.
     - Index cards for the "God" to write divine decrees (optional, but can help in making the intervention tangible).

   Roles:
     - The Instructor: Acts as God (initially hidden, then revealed). 
     - 13 Students: Players (divided into two teams, or playing individually, but teams might be easier to manage).
     - 1 Student: The "Prophet" (optional, but can be used to deliver messages from God; if not, the instructor can deliver messages directly).

   However, note: we have 14 students. Let's do two teams of 7, and the instructor as God. Alternatively, we can have 13 players and one student as the Prophet. Since we want to involve all 14, we can have 13 players and 1 Prophet. But the Prophet role might be too passive. Alternatively, we can have 7 teams of 2 (which would be 14 students). But let's keep it simple: two teams of 7. Each team will have a representative for each round.

   Game Rules (as presented to students at the beginning):

   Phase 1: Building Regularity (40 minutes)

   1. The game is called "The Rule of Patterns". The goal is to score points by predicting and relying on patterns that the instructor (acting as a neutral game master) will set.

   2. The game is played in rounds. In each round, one player from each team (rotating) comes to the front. They are shown a pattern of cards. The pattern is always the same: 
       - The instructor lays down a sequence of three cards (face up) and then a fourth card (face down). 
       - The pattern: the three face-up cards are always of the same suit, and the fourth card is always the same number as the first card but of a different suit. 
       Example: 
          Round 1: [Ace of Hearts], [2 of Hearts], [3 of Hearts], [???] -> the hidden card is [Ace of Spades].
          Round 2: [4 of Clubs], [5 of Clubs], [6 of Clubs], [???] -> hidden card is [4 of Diamonds].

   3. The two players must predict the hidden card. They write their prediction on a piece of paper and hand it to the instructor. They can also choose to "challenge" the pattern by writing "CHALLENGE" if they think the pattern might change (but they must still write a prediction). 

   4. Scoring:
       - Correct prediction: 2 points.
       - If a player challenges and the pattern is broken (i.e., the hidden card does not follow the pattern), they get 5 points. But if they challenge and the pattern holds, they lose 1 point.
       - If a player does not challenge and the pattern is broken, they get 0 for that round (and the other player, if correct, gets 2).
       - If both players are correct, both get 2. If both are wrong and didn't challenge, 0.

   5. The instructor (God) will follow the pattern for the first 5-6 rounds. This builds expectation. Then, without warning, in a later round, break the pattern arbitrarily (e.g., make the hidden card something else). This break should be done at a point where students are confident.

   6. After the break, the pattern might be restored for a round or two, then broken again arbitrarily. The goal is to create uncertainty.

   Phase 2: Introducing Divine Agency and Acquisition (30 minutes)

   7. After about 30 minutes of play (including several breaks in the pattern), the instructor reveals that they are not just a neutral game master but "God" in the game. The instructor explains that the pattern was never a fixed rule but a custom (ʿāda) that they chose to maintain and could break at any time.

   8. Now, introduce the concept of "acquisition" (kasb). The instructor (God) will now allow the players to "acquire" the power to set the pattern for one round. 
       - How: The instructor (God) will write a divine decree on an index card. The decree will specify the pattern for the next round. But then, the instructor will choose one player (or one from each team) to "acquire" that decree. 
          Example: God writes: "The hidden card shall be the same number as the second card in the sequence, but of the suit of diamonds." 
          Then, the chosen player is told: "You have acquired the power to set the pattern for this round. You must announce the pattern to the other player and the class. But note: you are not creating the pattern; you are merely acquiring what God has decreed."

   9. The round is then played: the instructor lays down three face-up cards and then a hidden card following the divine decree. The players (from the two teams) must again predict. But now, they are told the pattern in advance by the player who acquired the decree.

   10. However, God (the instructor) can still override the decree at any time. So in one of these rounds, after the player announces the pattern, God changes the hidden card arbitrarily. This shows that even when humans think they are acting, God is the real agent.

   11. Scoring continues, but now with an additional rule: 
        - If a player announces the pattern (as acquired from God) and God does not override, then if the prediction is correct, the team of the player who announced gets an extra point (because they "acquired" the divine will). 
        - If God overrides, then the player who announced the pattern is not penalized (because the failure is due to God's will) but the players might get points based on their predictions (and if they challenge).

   Debrief (20 minutes):

   We map the activity to the two claims:

   (i) The pattern (habitual regularity) was never necessary. It was maintained by the instructor (God) as a custom and could be broken at will. The students built expectations, but there was no inherent power in the cards to produce the next card. The breaks in the pattern were arbitrary and unpredictable.

   (ii) Even when the players seemed to act (by announcing the pattern in Phase 2), the real agent was God. The player only acquired the action (kasb) that God created. When God overrode the pattern, it showed that the player had no real power to cause the outcome.

   Why does al-Ghazālī need (ii)? 
     - Without (ii), we would lose both the order of the world (because if there were no divine custom, everything would be arbitrary) and human responsibility (because if humans are not even acquiring actions, then they cannot be held accountable). In the game, even though God breaks the pattern arbitrarily, most of the time the pattern holds (by God's choice). And in the acquisition phase, the player is still responsible for announcing the pattern (they are the ones who did the act of announcing) even though the pattern itself was set by God. But note: when God overrides, the player is not penalized because they did their part (acquiring) correctly. Similarly, in al-Ghazālī's view, humans are responsible for their acquired actions, but the effect is entirely from God.

   What the activity cannot reproduce:
     - The metaphysical depth: in the game, the instructor is a visible agent, but in al-Ghazālī, God is transcendent. The game might make divine intervention seem capricious, but in al-Ghazālī, God's actions are wise and just (even if beyond human comprehension).
     - The concept of God being the sole agent is hard to feel because the students are physically doing things (writing, speaking). We must emphasize that in the game, the "acquisition" is a metaphor: the real power is always with the instructor.
     - The activity does not fully capture the idea that every event (including human actions) is directly created by God. We only touch on it in the acquisition phase.

   Contested reading: 
     - Some scholars debate whether al-Ghazālī's occasionalism extends to human actions. The activity assumes it does (as per the target claims). We are following the interpretation that human actions are created by God and only acquired by humans. This is a standard reading but not without controversy.

   Predictable problems and solutions:

   1. Problem: Students might not take the game seriously or might not build strong expectations in Phase 1.
      Solution: Make the pattern very simple and consistent at first. Give clear examples. Start with a practice round.

   2. Problem: When the pattern breaks, students might think it's a mistake or a trick by the instructor.
      Solution: Be explicit after the first break: "This was intentional. The pattern is not fixed. It can change at any time." Then continue with the pattern for a few rounds to show it can come back.

   3. Problem: The acquisition phase might be confusing.
      Solution: Model it first. As God, write a decree, then choose a student to read it aloud. Then play the round. Then, in a subsequent round, override.

   4. Problem: Time management.
      Solution: Strictly time each round (2-3 minutes per round). We have 90 minutes. Phase 1: 40 minutes (about 10 rounds). Phase 2: 30 minutes (about 5 rounds). Debrief: 20 minutes.

   Detailed Timeline:

   Minute 0-5: Introduction to the activity. Explain the rules of Phase 1 (without revealing the pattern). Do a practice round.

   Minute 5-40: Phase 1 (about 7-8 rounds, each round taking about 4 minutes). 
       - Each round: 
           Minute 0: Select two new players (one from each team).
           Minute 0-1: Lay down the three face-up cards and the hidden card (but don't show the hidden card yet). 
           Minute 1-2: Players write their prediction and decide whether to challenge.
           Minute 2-3: Reveal the hidden card, record scores, and update the board.

       - At round 5, break the pattern for the first time (so round 5 hidden card does not follow the pattern). Then in round 6, go back to the pattern. Then in round 7, break again. Then round 8, pattern.

   Minute 40-45: Transition. Reveal that you are God and explain the custom. Introduce Phase 2: acquisition.

   Minute 45-75: Phase 2 (about 5 rounds). 
       - Each round: 
           Minute 0: God writes a divine decree (takes 1 minute). 
           Minute 1: God chooses a player (or one from each team, but to save time, one per round alternating teams) to acquire the decree. The player reads it to the class.
           Minute 2: Lay down the three face-up cards and the hidden card (following the decree, unless you plan to override). 
           Minute 3: The two players from the teams write their predictions (they know the pattern because it was announced). They can still challenge (if they think God might override).
           Minute 4: Reveal the hidden card. Score.

       - In one of these rounds (say round 3 of Phase 2), override the decree: do not follow the announced pattern. Explain that God has chosen to do something else.

   Minute 75-90: Debrief. 
       - Start by asking students about their experience: when did they trust the pattern? When did they lose trust? How did they feel when the pattern broke? How did they feel when they were the one announcing the pattern and then God overrode?
       - Then map to al-Ghazālī: 
            (i) The pattern as divine custom (ʿāda) without necessity. 
            (ii) The acquisition (kasb) in Phase 2: the player was the one who announced, but the pattern was set by God and could be changed by God. 
       - Explain why (ii) is needed: to preserve order (the pattern usually holds) and responsibility (the player who announced the pattern was the one who did the announcing, even though the content was from God).

   This design commits to the team structure and the card pattern game. The reasons: 
     - Teams create engagement and make the game more dynamic. 
     - The card pattern is simple and visual. 
     - The acquisition phase is modeled by having a student announce the pattern, making the concept of acquisition tangible.

   We hope this activity will give students an experiential understanding of occasionalism and its two key claims.
answer: |-
  ### **Divine Custom Game: Experiencing Ghazālī's Occasionalism**  
  **Target Claims:**  
  (i) No inherent causal powers; only habitual regularity (ʿāda) that God can interrupt.  
  (ii) God is the sole agent; humans merely "acquire" (kasb) actions, preserving order and responsibility.  

  **Materials:**  
  - 14 index cards (one per student)  
  - 1 whiteboard + markers  
  - 1 six-sided die  
  - Timer  

  **Roles:**  
  - **God (Instructor):** Sets/changes rules, intervenes secretly.  
  - **Players (Students):** Paired into 7 "Cause-Effect" duos (e.g., "Fire-Heat," "Seed-Tree"). Each pair co-owns an index card.  

  **Rules & Scoring:**  
  1. **Regularity Phase (30 mins):**  
     - Each duo writes a "causal law" on their card (e.g., "When Fire appears, Heat follows").  
     - Duos act out their law in 1-min rounds: "Cause" student pantomimes (e.g., flickering fingers for Fire), "Effect" student responds (e.g., fanning face for Heat).  
     - **Scoring:** Each successful act (Cause→Effect) = 1 point. Points tracked on the whiteboard.  
     - **God’s Role:** Reward regularity (e.g., praise, extra points) to build confidence.  

  2. **Interruption Phase (25 mins):**  
     - God secretly rolls the die before each round:  
       - *1-5:* No intervention (custom holds).  
       - *6:* God interrupts (e.g., "Heat" fails after "Fire"; Effect ignores Cause).  
     - **Twist:** After 3 rounds, reveal God’s die-rolling. Emphasize: *No rule forced God to uphold regularity—it was always a choice.*  
     - **Scoring:** Interrupted duos lose 1 point. Cause students may blame Effects, creating tension.  

  3. **Acquisition Phase (20 mins):**  
     - **New Rule:** Causes now "acquire" (kasb) God’s will.  
       - Each Cause whispers their *intended effect* to God (e.g., "I want Heat").  
       - God *chooses* to enact it, alter it, or interrupt it (via die roll).  
       - Effects respond only to God’s outcome (not the Cause’s intent).  
     - **Scoring:**  
       - If God enacts the Cause’s intent → Cause +1 point, Effect +1 point.  
       - If God alters/interrupts → No points, but no penalty.  
     - **Key:** Causes feel their "agency" is contingent on God’s will.  

  **Timeline (90 mins):**  
  | **Time** | **Phase**                     | **Activity**                                                                 |  
  |----------|-------------------------------|-----------------------------------------------------------------------------|  
  | 0-5 mins | Intro                         | Explain rules; pair students; assign Cause-Effect roles.                    |  
  | 5-35 mins| Regularity Phase              | 10 rounds of Cause-Effect acts. God praises/rewards consistency.            |  
  | 35-60 mins| Interruption Phase           | 8 rounds. God interrupts via die rolls (≈3 interruptions). Reveal God’s role mid-phase. |  
  | 60-80 mins| Acquisition Phase           | 6 rounds. Causes whisper intents; God decides outcomes.                     |  
  | 80-90 mins| Debrief                      | Discuss how game mirrors Ghazālī’s claims (see below).                      |  

  **Debrief Structure:**  
  1. **Map Activity to Claim (i):**  
     - *Q: "When did you feel sure Fire *must* cause Heat? What shattered that?"*  
       → Highlight: Expectations were psychological, not logical. Interruptions proved no *necessary* connection (only ʿāda).  
     - *Link:* Like Hume, Ghazālī argues reason cannot prove causal necessity—only habit. God’s interruptions (miracles) show possibility.  

  2. **Map Activity to Claim (ii):**  
     - *Q: "In the Acquisition Phase, did *you* cause the outcome, or did God?"*  
       → Highlight: Causes had "intent" but no power—God alone enacted results. "Acquisition" (kasb) = owning an action God creates.  
     - *Link:* This preserves responsibility (you *chose* to whisper "Heat") and order (God usually upholds customs).  

  3. **Why Ghazālī Needs (ii) After (i):**  
     - Without (ii), (i) would imply chaos or no human responsibility. But God’s reliable custom (order) + kasb (responsibility) solve both.  
     - *Activity Parallel:* Interruptions were rare (order mostly held); Causes were "blamed" for failed acts until Acquisition Phase clarified God’s role.  

  **Predictable Problems & Fixes:**  
  - **Problem:** Students resist interruptions ("That’s unfair!").  
    **Fix:** Acknowledge frustration—then ask: *"Did the rules ever *guarantee* regularity? Or did you assume it?"*  
  - **Problem:** Effects feel passive; Causes dominate.  
    **Fix:** Swap Cause/Effect roles mid-game. Emphasize both are "acquiring" God’s act.  
  - **Problem:** Acquisition Phase feels abstract.  
    **Fix:** Use concrete language: "God *enacts* your wish; you *acquire* the result."  

  **Limitations & Required Supplements:**  
  1. **God’s Hiddenness:** In the game, God is visible (instructor). Ghazālī’s God is transcendent. **Explain:** "The instructor represents God’s will—but in reality, God needs no dice or whispers."  
  2. **Kasb as Metaphysical, Not Psychological:** Students may think "acquisition" = intent. **Clarify:** "Kasb isn’t just wanting an outcome; it’s God creating the act *in* you. Your ‘choice’ is a created event."  
  3. **Contested Reading:** Some scholars debate if Ghazālī denies *all* created power (e.g., does fire have *any* power?). **Address:** "Ghazālī argues created things have no *independent* power—God delegates effects to them habitually. The game’s ‘causal laws’ mirror this delegated custom."  

  **Why This Design?**  
  - **Builds Emotional Insight:** Students *feel* the shock of interrupted regularity and the vulnerability of "acquisition."  
  - **Uses Bodily Engagement:** Pantomimes make abstract ideas visceral.  
  - **Clear Metaphor:** Dice = God’s inscrutable will; whispering = kasb.  
  - **Safe Failure:** Losing points mirrors Ghazālī’s "no guaranteed order" without real stakes.  

  **Final Prep Tip:**  
  Run a mini-test with colleagues to refine timing. Emphasize during intro: "This isn’t about winning—it’s about feeling how Ghazālī saw the world."
