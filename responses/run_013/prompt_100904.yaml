  - Belief/desire ascriptions as instrumental vs literal mental states
  - The difference between patterns being real and being reducible to physics

  The friend's description gets several points right - especially about predictive utility and projection being unavoidable. But two red flags jump out: 
  1) Calling Dennett an "eliminativist" is a common category error - he's a mild realist about patterns. 
  2) The "nothing really has beliefs" phrasing overshoots; Dennett would say beliefs exist as patterns in the behavior space.

  For the AI question: The intentional stance absolutely licenses "wants to maximize reward" talk as scientifically useful shorthand. The deeper issue is whether this pattern persists across contexts - that's where folk psychology might break down for AI. I should emphasize that for Dennett, the convenience of the stance is precisely what makes it real in the only sense that matters.

  I'll structure the audit by:
  - Explicitly listing the critical distinctions upfront
  - Line-by-line grading of the friend's claims
