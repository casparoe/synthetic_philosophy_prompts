prompt: |-
  I'm a science reporter and I've somehow been voluntold to run a brown-bag lunch at the office — forty-five minutes, no slides, a dozen reporters who cover health and tech, can skim a study abstract, have never taken a stats course. I picked the reference class problem. They don't know the name and I'd honestly rather they leave with the thing itself than the phrase, so don't explain it to me, plan the session: what has to be in place before it even looks like a problem to them, the order the pieces have to come in and why that order and not some other, the one example that carries the whole forty-five minutes and what that example has to have and lack, the misconceptions they'll walk in with or form along the way and the exact point in the sequence where each gets headed off, one question I can put to the room at the end that tells me whether it landed, and what I should openly refuse to get into at this level.

  Here's my thinking so far, argue with it. My carrier was going to be a risk calculator: I put a hypothetical patient up — sixty-year-old smoker with a family history — the calculator spits out a 12% chance of a heart attack in ten years, and then I show that the 12% is doing almost all its work through a choice of class that nobody in the room is making consciously, and that if I ask twelve reporters to say what the class is, I get twelve different answers and they're all defensible. Is that the right thing to hang it on, or does it quietly teach them that the problem is about medical stats? Second: I want to end on the claim that Sleeping Beauty is just the reference class problem wearing a costume — I read that somewhere, I half-beleive it, tell me if it survives contact or if I'm about to say something embarrassing in front of the desk. And a third thing I can't settle: do I have to make them care about the frequentist/subjectivist split first, or is that a tangent that eats the session? Half the room is Bayesian by temperament without knowing the word, and I can't tell if that's an asset or a landmine. My guesses at the misconceptions, for what they're worth: "you just pick the narrowest class you can" and "a probability of a single event is meaningless." Keep the whole thing under 700 words.
reasoning: |-
  Okay, the user is a science reporter tasked with explaining the reference class problem in a 45-minute session to colleagues with no stats background. They want to avoid jargon and focus on conceptual understanding. Their draft uses a medical risk calculator example but worries it might mislead by over-medicalizing the concept. They also want to connect it to Sleeping Beauty and wonder about introducing Bayesian/frequentist splits.  

  Hmm. First, their core concern is valid: the medical example could anchor the problem too narrowly. The reference class problem applies universally – insurance, AI, policy decisions – so the opener needs a neutral example. A weather forecast for a "person named Alex" works better because everyone understands umbrella decisions and it avoids domain-specific assumptions.  

  The Sleeping Beauty link is clever but risky. The paradox involves probability under memory wipes – technically related via reference classes but requires unpacking subjective probability first. At this level, it's a distraction. Better to show breadth through diverse examples (e.g., "Is this startup the next Uber?").  

  Ah, their intuition about skipping Bayesian/frequentist debates is spot-on. The room's "Bayesian temperament" is an asset! We can leverage their natural instinct to contextualize probabilities ("What does this remind me of?") without naming schools of thought. The key misconception to dismantle is "narrowest class = best" – that’s where the calculator example shines later.  

  *Structure tweaks:*  
  1. **Opener:** Weather scenario → forces them to confront ambiguity in defining "similar days."  
  2. **Transition:** "We do this mental grouping constantly" → medical calculator demo.  
  3. **Pivot:** Calculator's hidden class choice → "Would you all pick the same class?" discussion.  
  4. **Landing:** Emphasize that *defensible ≠ objective* – no single right answer.  

  Final question: *"What's one decision you've reported on where this would change the odds?"* If they generate real examples (drug efficacy, climate risks), it stuck.  

  *What to avoid:*  
  - Probability interpretations (frequentist/Bayesian)  
  - Mathematical solutions (e.g., reference class forecasting)  
  - Sleeping Beauty (save for the hallway)  
  This keeps the session focused on the "so what" for reporters: questioning how probabilities are framed in their sources.
answer: |-
  Here’s a tight, misconception-focused session plan. **Skip the medical calculator opener**—it primes them to see this as a stats issue, not a universal reasoning trap. Use this sequence instead:

  ---

  ### **1. Anchor in the familiar (5 min)**  
  **Opener:** *"Imagine you’re deciding whether to bring an umbrella today. You check a forecast: 'There’s a 30% chance of rain.' What does that 30% actually apply to?"*  
  - *Let them brainstorm:* "Days like today?" "This location?" "This time of year?"  
  - **Key move:** Point out their answers are all attempts to define a **reference class** (don’t name it yet)—a group of "similar situations" for the probability.  

  ### **2. Introduce the problem via contradiction (10 min)**  
  **Carrier example: Job Hiring Risk**  
  *"Your HR department says: 'People with this résumé have a 20% chance of quitting within a year.' But:*  
  - *Resumé A: Ivy League MBA, worked at 3 startups.*  
  - *Resumé B: Same as A + studied yoga in India.*  
  - *Resumé C: Same as B + blue eyes.*  
  *Should the probability change for each? If so, why?"*  
  - **Why this works:**  
    - Non-medical, avoids "stats" aura.  
    - Forces conflict between "narrower class = better" instinct vs. arbitrary/redundant details.  
    - Exposes the core: **Choosing the class changes the probability. No objective rule exists.**  

  ### **3. Reveal the invisibility trap (15 min)**  
  **Activity:** *"We all do this instinctively. Let’s reveal it. Suppose I say: 'A random person in this room has a 5% chance of owning a Tesla.' What’s your mental reference class?"*  
  - *Poll them anonymously (paper scraps):* "People in this city?" "Journalists?" "People earning over $100K?"  
  - **Result:** Show varied answers. *"Same number, different classes—all reasonable. No one 'lied,' but the 5% is meaningless without the class. Yet we rarely state it."*  
  - **Head off misconceptions:**  
    - *"Narrowest class wins!"* → Counter: *"What makes 'yoga experience' relevant to quitting a job but 'blue eyes' silly? Relevance isn’t obvious."*  
    - *"Probability is meaningless for single events!"* → *"Agreed! But we use them anyway (e.g., medical risks). The class is how we pretend it’s not single."*  

  ### **4. Connect to their work (10 min)**  
  **Examples that stick:**  
  - Health: *"A study says 'coffee drinkers have 10% lower mortality.' Does this apply to a 60-year-old diabetic? We don’t know—the class is hidden."*  
  - Tech: *"AI risk: 'Systems like this fail 1% of the time.' But 'like this' could mean all AIs, all image generators, or this specific model. Which?"*  
  - **Crucial point:** *"When you report 'X% chance,' always ask: 'What group does this *actually* apply to?' If vague, the number is theater."*  

  ### **5. Final question to test uptake (3 min)**  
  *"You’re reporting a claim: 'This new app predicts seizures with 95% accuracy.' What’s one question about the reference class you’d ask the developer?"*  
  - **Look for:** "Accuracy for whom?" "What data was it tested on?" (Sign they grasp that the class *is* the claim.)  

  ### **What to openly refuse**  
  - **Sleeping Beauty:** It’s a distraction. The link is real (probability under self-locating uncertainty), but it’s a rabbit hole. Say: *"That’s a different talk—today is about spotting hidden assumptions in real-world numbers."*  
  - **Frequentist/Bayesian split:** Irrelevant here. Their "Bayesian temperament" (updating beliefs) is an asset—use it! *"You instinctively adjust classes with new info? Good! That’s the only fix."*  
  - **Math, solutions, or jargon:** No formulas, no "reference class forecasting."  

  ---

  ### **Why this flow works**  
  1. **Starts concrete (umbrella)** → **reveals mental models (job résumé)** → **exposes arbitrariness (Tesla poll)** → **applies to their work (health/tech examples).**  
  2. The **job hiring example** avoids medical framing, forces conflict without stats, and makes "irrelevant features" visceral.  
  3. **Misconceptions pre-busted:** The poll activity kills "narrowest class wins." The Tesla question kills "probability is objective."  
  4. **They leave with:** A gut sense that **unnamed groups lurk behind probabilities**—and a practical question for their reporting.  

  **Under 700 words. No slides needed. All they need is in the room.**
