answer: |-
  Here are the desiderata for an adequate structural realist account of scientific theory change, structured as requested. The requirements balance explanatory success against historical discontinuity, with explicit motivations, classifications, and conflict analysis.

  ---

  ### **Binding Desiderata** (Constraints any structural realism *must* satisfy)
  1.  **Non-Trivial Preservation (The "No Free Lunch" Requirement)**  
      *   **Motivation:** The Newman Problem (1928). If "structure" is defined purely extensionally (as any set-theoretic relation on a domain), then for any domain of cardinality *n*, *every* theory with *n*-many objects has a model satisfying that structure. Preservation becomes vacuously true.  
      *   **Type:** Binding constraint.  
      *   **Consequence:** The account must add **modal constraints** (e.g., laws governing relations, causal/nomological necessity, dispositional properties) or **intensional content** (e.g., specifying what the relations *do* or *represent physically*) to the bare structure. This restricts which domains can genuinely instantiate the structure.  
      *   **Compatibility:** Adding modality/intensionality risks conflict with *Epistemic Humility* (Desideratum 6) if it smuggles in "hidden natures" beyond structure, and with *Representational Adequacy* (Desideratum 4) if the modal aspect isn't itself structurally represented.

  2.  **Explanatory Success Requirement**  
      *   **Motivation:** The "Miracle Argument" (Putnam, Smart). Science's unprecedented instrumental success (e.g., precise predictions in particle physics, engineering applications of EM theory, GPS relying on relativistic corrections) demands explanation. Structural realism answers by claiming successful theories latch onto the world's actual structure.  
      *   **Type:** Binding constraint.  
      *   **Requirement:** The preserved structure must be sufficient to explain why the *predictive and manipulative* successes of past theories occurred, even if their ontology was wrong.

  3.  **Representational Adequacy Requirement**  
      *   **Motivation:** Historical cases like the transition from Fresnel's elastic-solid ether theory to Maxwell's EM field theory. Fresnel's equations for light propagation (structure) were retained, but his ontology (elastic solid ether) was discarded. The structure must genuinely *represent* objective features of phenomena.  
      *   **Type:** Binding constraint.  
      *   **Requirement:** The posited structure must be more than just a predictive instrument; it must plausibly correspond to (or be isomorphic to) mind-independent features of the world responsible for the phenomena.

  ### **Contested Desiderata** (Commitments where camps diverge)
  4.  **Continuity Requirement**  
      *   **Motivation:** Historical episodes like the transition from caloric theory to kinetic theory of heat. While ontology changed (caloric fluid discarded, molecules posited), key structural features persisted (e.g., conservation principles, equations for heat flow resembling diffusion equations).  
      *   **Type:** Commitment of "Retentionist" structural realists (e.g., Worrall). Rivals (e.g., "Revisionists") could argue continuity is sometimes absent or too abstract to be meaningful.  
      *   **Requirement:** There must be significant, identifiable structural commonality between a superseded theory T and its successor T' in the same domain.

  5.  **Epistemic Humility Requirement**  
      *   **Motivation:** Pessimistic Meta-Induction (Laudan). History shows most past theories' posited entities (e.g., phlogiston, crystalline spheres, caloric) were radically wrong. Therefore, we should be agnostic about the intrinsic natures of entities.  
      *   **Type:** Commitment of structural realists emphasizing *ignorance* of non-structure (e.g., epistemic SR). Rivals (e.g., ontic SR) could argue we can know *some* entity-level facts if they are structurally encoded.  
      *   **Requirement:** The account should not commit to knowledge of the intrinsic, non-relational properties of the entities populating the structure.

  6.  **Diachronic Accessibility Requirement**  
      *   **Motivation:** The Problem of Incommensurability (Kuhn, Feyerabend). If theories change radically, how can scientists *recognize* which structures are worth preserving? (e.g., Did Newtonians see their structure in Aristotle? Do we see quantum structure in classical mechanics?).  
      *   **Type:** Commitment of accounts emphasizing rational theory choice. Rivals could downplay the need for direct recognizability, focusing on retrospective rational reconstruction.  
      *   **Requirement:** The preserved structure between T and T' must be something that, in principle, proponents of T could have recognized as potentially correct or significant, even if they rejected T's ontology.

  ---

  ### **Analysis as Requested**

  1.  **Irreconcilable Conflict:** **Continuity (4)** and **Non-Trivial Preservation (1)** conflict under radical theory change. Satisfying *Continuity* across deep ruptures (e.g., classical to quantum physics) often forces the "structure" to become highly abstract (e.g., group symmetries, conservation laws). Highly abstract structures risk triviality (Newman's Problem), violating *Non-Trivial Preservation*. To escape triviality, concrete modal/intensional content must be added (*Consequence* of Desideratum 1), but this content is often precisely what *lacks* continuity in radical change. **Resolution:** One must weaken *Continuity* (accepting less concrete structural overlap) or risk triviality/representational inadequacy by over-abstracting the structure.

  2.  **Most Eliminative Requirement:** **Non-Trivial Preservation (1)** eliminates the most candidates. Many naive structuralist positions (e.g., early Russell-inspired forms, purely syntactic approaches) founder on Newman's Problem. Only accounts that explicitly add modality (e.g., Ladyman & Ross's Rainforest Realism incorporating causal/nomological constraints), intensionality (e.g., Chakravartty's Semirealism), or radically redefine structure (e.g., Category-Theoretic SR) can potentially satisfy it.

  3.  **Leading Options Briefly:**
      *   **Epistemic SR (Worrall):** Strong on *Continuity (4)* & *Explanatory Success (2)* via mathematical equations. Weak on *Non-Trivial Preservation (1)* (Newman Problem) and *Diachronic Accessibility (6)* (How did Fresnel recognize the structural essence?).
      *   **Ontic SR (Ladyman, French):** (Version 1: Eliminativist) Avoids entities, focusing on "structure all the way down." Strong on *Epistemic Humility (5)* and potentially *Non-Trivial Preservation (1)* via modality/laws. Weak on *Representational Adequacy (3)* (What does pure structure represent?) and *Continuity (4)* (What concrete structure persists from caloric?).
      *   **Ontic SR (Ladyman, French):** (Version 2: Non-Eliminativist) Uses group theory/category theory. Better on *Non-Trivial Preservation (1)* & *Explanatory Success (2)*. Struggles with *Continuity (4)* for non-group-theoretic structures and *Diachronic Accessibility (6)*.
      *   **Semirealism (Chakravartty):** Blends structures with causal properties ("causal properties first"). Strong on *Non-Trivial Preservation (1), Explanatory Success (2), Representational Adequacy (3)*. Weaker on *Epistemic Humility (5)* (causal properties aren't purely structural) and *Continuity (4)* if causal properties shift dramatically.
      *   **Partial Structures (da Costa, French):** Focuses on partial isomorphisms/partial truth. Addresses *Continuity (4)* & *Diachronic Accessibility (6)* incrementally. Challenged by *Non-Trivial Preservation (1)* and ensuring *Explanatory Success (2)* isn't diluted.

  ---

  ### **Explicit Footing**
  *   **Least Confident Desideratum:** **Diachronic Accessibility (6)**. While intuitive for rationality, it may be too strong. Historical actors often work with concepts and goals radically different from their successors. Requiring *their* potential recognition of future-preserved structure might impose an unrealistic teleology.
  *   **What Would Strike It?** Strong historical evidence showing that the *actual* reasons for theory retention/development by historical actors bore *no meaningful relation* to the structures retrospectively identified as preserved by later philosophers/scientists. If structures are only identifiable post-hoc with radically new conceptual tools, the requirement fails.
  *   **Would Striking It Dissolve Conflict?** No. The core conflict between *Continuity* and *Non-Trivial Preservation* would remain, as it concerns the *content* of what is preserved, not the *recognizability* of that preservation during the change.

  ---

  ### **Summary**
  Structural realism must non-trivially preserve representational structure sufficient to explain scientific success while navigating historical discontinuity, forcing trade-offs between continuity, non-triviality, epistemic humility, and accessibility.

  \answer{Epistemic Humility Requirement}
