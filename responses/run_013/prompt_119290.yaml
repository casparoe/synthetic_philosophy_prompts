  On paper money: Hume distrusted it because it lacked intrinsic value and depended on state stability. Modern central banking solves convertibility but not the fragility issue. His core objection was about lack of foreign acceptability and contingent value - still relevant today despite technological changes.

  Regarding interest rates: This is trickiest. Hume thought rates were determined by real economic factors, not money supply. But central banks today manipulate rates directly. I need to distinguish between short-term stimulus (which Hume might tolerate) versus long-term control (which contradicts him). The zero lower bound situation would puzzle him.

  For the ranking: The interest rate question strains his system most because modern policy directly contradicts his monetary neutrality thesis. The state money issue is next, requiring him to abandon his strict state/household analogy. Paper money objections require least adjustment since many remain valid.

