answer: |-
  Here’s a structured teaching plan using your autoclave example to *do the philosophical work*, sequenced to build understanding while preempting misconceptions. Target time: 90–120 minutes.

  ---

  ### **Teaching Sequence & Rationale**  
  **Goal:** Show conventions as *self-sustaining solutions to coordination problems* without agreement or inherent normativity.

  1. **Start with Coordination Problems (10 min)**  
     - **Why start here?** Grounding in game theory makes conventions *necessary* rather than arbitrary. Scientists recognize optimization.  
     - **Lab Example:** "Our autoclave is shared. Without coordination, two people book it for 3 PM → wasted time, heated arguments. How to avoid conflict?"  
     - **Key Point:** Coordination problems have multiple *Nash equilibria* (outcomes where no one benefits from unilaterally changing).  
     - **Preempt Misconception:** *"Any regularity solves the problem"* → Ask: "Would flipping a coin daily work?" (No — it lacks *stability*).

  2. **Regularity vs. Rule (15 min)**  
     - **Why now?** Distinguish emergent patterns from top-down imposition.  
     - **Lab Example:** "The clothespin system is a *regularity* — everyone uses it, but there’s no lab manager enforcing it. If someone uses a sign-up sheet instead, are they punished? No — they’re just *corrected*."  
     - **Contrast Case:** Introduce "driving on the left/right" *now* to show arbitrariness: "In the UK vs. US, opposite solutions work equally well. Neither is 'correct' by physics."  
     - **Preempt Misconception:** *"Conventions are rules"* → Stress: No penalties, authority, or formal agreement exists in the lab.

  3. **Expectations + Conditional Preferences (20 min)**  
     - **Why now?** Explains *why* regularity persists.  
     - **Lab Example:** "Alice uses a clothespin because she *expects* Bob will check the pegboard. She *prefers* to use it *only if* others do too (conditional preference!). If others used whiteboards, she’d switch."  
     - **Key Insight:** Conventions work because your action *depends* on predicting others’ actions.  
     - **Preempt Misconception:** *"It’s just habit"* → Ask: "If new equipment made clothespins obsolete, would people cling to them? Or switch immediately?" (Shows it’s preference-driven, not habit).

  4. **Common Knowledge (15 min)**  
     - **Why now?** Expectations require mutual recognition.  
     - **Lab Example:** "It’s not enough that everyone *knows* about clothespins. Everyone knows *that* everyone knows, and knows that everyone knows they know... *ad infinitum*. New grad students see others using pins → infer the system → adopt it."  
     - **Contrast:** "If only half the lab used pins secretly, it would collapse."  
     - **Preempt Misconception:** *"Common knowledge = everyone knows"* → Use a recursive example: "You comply because you know others comply. They comply because they know *you* know..."

  5. **Alternative Regularities (20 min)**  
     - **Why now?** Crucial for arbitrariness & evolutionary potential.  
     - **Lab Example:** "A whiteboard would work *just as well* as clothespins. Everyone would prefer the whiteboard *if* others switched. But they don’t because no one wants to deviate alone."  
     - **Stress:** This clause shows conventions are *arbitrary but not indifferent*. Switching costs (even tiny ones) prevent change without collective action.  
     - **Preempt Misconception:** *"Arbitrary = unimportant"* → "Imagine someone ignores the pins — minor chaos ensues! Efficiency depends on uniformity, not the method."

  6. **Evolution Without Agreement (15 min)**  
     - **Why now?** Answers "How did this start?" without teleology.  
     - **Lab Example:** "No one invented the clothespin system. Probably: (1) Early users improvised pins; (2) Others copied to avoid conflict; (3) Expectations solidified. Now it’s self-reinforcing."  
     - **Key Point:** Persistence ≠ optimality. "Clothespins fall off? Yet we keep using them because switching is costly."  
     - **Preempt Misconception:** *"Evolution optimizes conventions"* → "Is this the *best* system? No — but it’s *stable*."

  ---

  ### **Using the Lab Example to *Do Work***  
  Your clothespin case **must**:  
  - Lack written rules, penalties, or moral weight ("correcting" is pragmatic, not shaming).  
  - Have a clear, equally good alternative (whiteboard).  
  - Depend entirely on expectations (if others stopped, you’d stop).  
  - Require no authority (even the lab manager uses pins).  

  **Crucially lacking:**  
  - Moral dimension (no one calls pin-ignorers "unethical").  
  - Efficiency justification (pins aren’t superior to whiteboards).  
  - Central enforcement.  

  **Introduce traffic example ONLY when discussing arbitrariness** (Step 2) to avoid overshadowing your lab case. Dismiss it after.

  ---

  ### **Top Misconceptions & When to Strike**  
  1. **"Convention = agreement"**  
     - **Strike at:** Step 2 (Regularity vs. Rule).  
     - **Response:** "Did you *agree* to use clothespins? Or did you just follow what others did?"  

  2. **"Conventions have independent normative force"**  
     - **Strike at:** Step 3 (Expectations).  
     - **Response:** "Is it *morally wrong* to use a whiteboard? Or just inefficient because others expect pins?"  

  3. **"Any regularity is a convention"**  
     - **Strike at:** Step 1 (Coordination).  
     - **Response:** "Does everyone breathing at noon solve a coordination problem?"  

  4. **"Common knowledge = everyone knows"**  
     - **Strike at:** Step 4 (Common Knowledge).  
     - **Response:** "If you use a pin but suspect others don’t know *you* know, would you still trust the system?"  

  5. **"Arbitrary = individually optional"**  
     - **Strike at:** Step 5 (Alternatives).  
     - **Response:** "Could *you* unilaterally switch to whiteboards without causing confusion?"  

  6. **"Inefficient conventions get replaced"**  
     - **Strike at:** Step 6 (Evolution).  
     - **Response:** "Clothespins *are* inefficient — why do they persist?"  

  7. **"Evolution justifies/debunks conventions"**  
     - **Strike at:** Step 6.  
     - **Response:** "Evolution explains *how* they arise, not whether they’re 'good.' Slavery was conventional — not thereby justified."  

  ---

  ### **Diagnostic Question**  
  **"Imagine the clothespins are replaced overnight with identical magnetic tokens. Is this a *new convention*? Why/why not?"**  
  - **Correct answer:** No — expectations, conditional preferences, and common knowledge persist unchanged. The *regularity* is functionally identical.  
  - **Reveals:** Understanding of convention as a *pattern of expectations*, not physical form.  

  ---

  ### **Explicitly Omit**  
  - Moral/political implications (e.g., "unjust conventions").  
  - Lewis’ full account of language (too complex).  
  - Deep dives into game theory math.  
  - **Say:** "We’re focusing on *mechanisms*, not ethics or linguistics."  

  This plan forces the group to *see* conventions as emergent, expectation-driven equilibria. Your lab example — mundane and non-moral — perfectly isolates Lewis’ core mechanics. By sequencing concepts to solve successive problems (coordination → stability → change), you mirror science’s explanatory structure, disarming suspicion of "wordplay."
