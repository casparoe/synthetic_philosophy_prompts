prompt: |-
  I'm in a small philosophy-of-science reading group that has spent the last few weeks circling the so-called F-twist -- the idea, usually credited to Friedman, that the realism of a theory's assumptions is irrelevant to its quality, and on some readings that a theory is better the more its assumptions depart from reality. I keep finding that my reactions to particular models refuse to line up with any single slogan, and I'd like you to tell me what principle, if any, my reactions add up to. Here are the verdicts I'm fairly confident about. Treating a planet as a point mass when computing its orbit: fine. Treating a gas as a collection of non-interacting point particles with no volume: fine, even though I know the molecules have size and attract one another. Ignoring air resistance when working out how long a cannonball takes to fall: fine. Ignoring air resistance when explaining why a feather and a hammer fall at different rates: not fine, because the resistance is precisely the thing I'm trying to explain. Assuming a coin is fair while testing whether it is fair: not fine, and not merely because it's unhelpful -- it seems to make the question unaskable. Assuming that traders have perfect information in a model whose entire point is to explain the price effects of information frictions: not fine. Then there are the cases that make me uneasy. I'm perfectly happy to treat a population as effectively infinite, so that genetic drift plays no role, when what I'm modeling is the direction of selection; yet I balk at the representative-agent move in macroeconomics, where a single idealized household stands in for millions, and I can't articulate what separates the two beyond my priors about the fields. And I have a nagging suspicion that the point-mass planet and the representative agent are both "ignore the heterogeneity" moves, so I ought to treat them alike -- but I don't.

  The tentative principle I keep reaching for is this: an unrealistic assumption is acceptable just in case the model's conclusions are robust to relaxing it, i.e., the idealization is a harmless approximation that could be perturbed away without changing the qualitative result. But that seems to get the ideal gas wrong, since perturbing it yields intermolecular forces and a qualitatively different equation of state, and yet I still think the idealization is legitimate; and it seems far too permissive about the fair-coin case, since a biased coin is just a small perturbation of a fair one. I'd like three things from you. First, say whether a single principle captures my verdicts or whether I need a small set of them, and state each candidate precisely enough that I can see which case motivates each clause. Second, tell me which of my verdicts the best principle forces me to abandon -- I would rather lose a verdict than keep an ugly disjunction patched together to save every case. Third, and most usefully, apply whatever you settle on to three cases I haven't mentioned: assuming no mutation in a model of short-term allele frequencies; assuming that all firms in an industry are identical price-takers when the phenomenon of interest is the persistent dispersion of profits across firms; and assuming that space and time are absolute in a calculation of projectile motion. I don't need citations or a reading list -- I want the principle, the reasoning behind each clause, and an honest accounting of the cases it cannot handle.
reasoning: |-
  Okay, let me tackle this user's query. They're part of a philosophy-of-science group discussing the F-twist and need help reconciling their intuitive judgments about various modeling assumptions. The user has provided specific cases where they find certain assumptions acceptable or not, and they're struggling to find a consistent principle.

  First, I need to parse their examples. They're comfortable with point-mass planets and ideal gases but object to ignoring air resistance when explaining feather-hammer differences or assuming perfect information in markets with frictions. The representative agent in macroeconomics bothers them, though they can't articulate why. Their tentative robustness principle doesn't fully work because it fails for ideal gases and fair coin tests.

  Hmm, the key seems to lie in the explanatory target. When the assumption removes the very phenomenon being studied (like air resistance for feather-hammer), it's invalid. But for orbital calculations, point-mass is fine because planet size isn't relevant. The robustness criterion is part of it but not sufficient alone. 

  The fair-coin case is interesting. Assuming fairness while testing it isn't just unhelpful—it makes the question incoherent. That points to an internal consistency requirement. For the ideal gas, even though relaxing it changes the model, the core behavior (pressure, volume relationships) remains useful in certain regimes, so it's a justified approximation.

  For the uneasy cases: The infinite population model works because genetic drift isn't the focus, while the representative agent might oversimplify heterogeneity that's crucial to macroeconomic phenomena. The principle must distinguish between ignoring irrelevant details versus those central to the explanatory goal.

  Applying this to their new cases: No mutation in allele frequency models is fine if mutations aren't the focus. Assuming identical firms when studying profit dispersion is bad because heterogeneity is key. Absolute space-time for projectiles is acceptable since relativistic effects are negligible.

  I should emphasize the explanatory target and necessity of the assumption for the specific purpose. Cases where the principle might struggle? Perhaps when assumptions are heuristic tools without clear justification, but the user values coherence over saving every verdict.
answer: |-
  Your reactions reveal a coherent principle centered on **explanatory purpose and necessity**, not robustness alone. Here's the distilled principle, its reasoning, and how it handles your cases:

  ### The Principle
  **An unrealistic assumption is legitimate if and only if:**  
  **1. It does not *eliminate the phenomenon being explained* or *assume away the explanandum*;**  
  **2. It is *justifiably unnecessary* for the model’s specific explanatory goal** (e.g., via negligibility, redundancy, or domain restriction).  

  ### Why This Captures Your Verdicts
  - **Point-mass planet (orbit)**: Fine. Planet size doesn’t cause orbital motion (violates neither clause).  
  - **Ideal gas (volume/pressure laws)**: Fine. Molecular size/forces are *negligible* for dilute gases (Clause 2).  
  - **Ignoring air resistance (cannonball fall time)**: Fine. Resistance is negligible for dense objects (Clause 2).  
  - **Ignoring air resistance (feather vs. hammer)**: Not fine. Resistance *is* the explanandum (violates Clause 1).  
  - **Assuming fair coin (testing fairness)**: Not fine. Fairness assumption *precludes the explanandum* (bias) (Clause 1).  
  - **Perfect information (explaining info frictions)**: Not fine. Eliminates the very friction being studied (Clause 1).  

  ### Your Uneasy Cases Resolved
  - **Infinite population (selection)**: Fine. Genetic drift is *irrelevant* to directional selection (Clause 2).  
  - **Representative agent (macroeconomics)**: Not fine *if* heterogeneity drives the phenomenon (e.g., wealth distribution). The assumption *eliminates heterogeneity*, which may *be* the explanandum (Clause 1). If studying aggregate inflation, it *might* be justified (Clause 2). Your unease stems from macro’s frequent failure to justify necessity.  
  - **Point-mass vs. representative agent**: Differ because orbital mechanics *requires no heterogeneity*, while macro often studies *emergent effects of heterogeneity*. The principle distinguishes them cleanly.  

  ### Verdicts You Must Abandon
  - **Robustness as sufficient**: You must drop the idea that robustness *alone* justifies an assumption.  
    - *Ideal gas*: Robustness fails (perturbation changes state equation), but it’s still legitimate because the assumptions are *justifiably negligible* in specific regimes (Clause 2).  
    - *Fair coin*: Perturbation is small (biased coin), but assuming fairness destroys the test’s purpose (Clause 1). Robustness is irrelevant here.  

  ---

  ### Application to New Cases
  1. **No mutation (short-term allele frequencies)**  
     - **Verdict**: **Fine**  
     - **Why**: Mutation rates are typically negligible on short timescales. The explanandum (frequency changes) is driven by selection/drift, not mutation (Clause 2).  

  2. **Identical price-taking firms (explaining persistent profit dispersion)**  
     - **Verdict**: **Not fine**  
     - **Why**: Heterogeneity in efficiency/market power is likely the *cause* of dispersion. Assuming identical firms *eliminates the explanandum* (Clause 1).  

  3. **Absolute spacetime (projectile motion)**  
     - **Verdict**: **Fine**  
     - **Why**: Relativistic effects are negligible at projectile speeds. The assumption is *justifiably unnecessary* for the explanatory goal (Clause 2).  

  ---

  ### Limitations of the Principle
  - **Heuristic models**: Fails for assumptions used purely for computational tractability without a clear explanatory goal (e.g., some agent-based models).  
  - **"Justifiably unnecessary" ambiguity**: Requires domain knowledge to defend negligibility (e.g., why representative agents *might* work for inflation but not inequality).  
  - **Multi-level explanations**: Struggles if a model ignores a factor that is negligible for its goal but critical for a related phenomenon (e.g., ignoring genetics in short-term ecology).  

  ### Why This Works
  Your judgments prioritize **explanatory coherence** over realism or robustness. The principle forces assumptions to be *subordinate to the model’s purpose*: they can simplify, but never sabotage. It replaces Friedman’s "irrelevance of assumptions" with a focused **explanatory necessity criterion**, preserving your intuitive rejections of self-defeating assumptions while accommodating idealizations that responsibly isolate mechanisms.
