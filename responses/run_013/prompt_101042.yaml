  For structure: opening should disarm the room, name the tension immediately. Then pivot to the condemned man's forced performance as the central horror. Contrast with LWOP's key difference - it doesn't require our active participation in killing. Acknowledge prison's brutality but highlight how death penalty uniquely implicates us all. 

