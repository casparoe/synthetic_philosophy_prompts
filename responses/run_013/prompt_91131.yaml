  2. **The Self-Governance Rule:** A rule cannot set the terms of its own repeal (from Amendment 17's second ground). This is narrower and wasn't needed for Amendments 6, 11, 14, or 20.  
     - Fits Amendment 17 (voided partly for self-repeal clause).  
     - Doesn't apply to Amendment 24 (it sets adoption terms, not repeal), so it's not decisive here.  
     - Kept as a secondary principle, but Adoption Rule is primary.

  **Why these rules?**  
  - Dana prioritizes procedural certainty. Amendments are judged against rules active when voted ("CI config at commit time," as you analogized). The "wrinkle" of living with the result doesn't override this—your rules lack retroactivity or reliance provisions.  
  - All rulings are consistent: Valid amendments (6, 11, 14, 20) met thresholds in force; void ones (17) did not or violated self-governance. No ruling contradicts this.  
  - Self-validating clauses are consistently subordinated: Amendment 17's clause was ignored; Amendment 24's will be too.

  ### Which Rule to Bet On and Why
  - **Bet on the Adoption Rule (must pass under threshold in force).**  
    - It's the only principle necessary and sufficient to resolve all cases, including Amendment 24. It directly explains Amendments 6 (valid), 17 (void), and 24 (void) without needing the Self-Governance Rule.  
    - Amendment 24 is a clean match for Amendment 17's first ground—both failed the standing threshold. Dana's comment in Amendment 6 ("which one I used doesn't arise") shows thresholds are evaluated pre-adoption.  
    - The Self-Governance Rule is weaker: It was only used once (Amendment 17) and wasn't essential to the outcome (Adoption Rule sufficed). It doesn't apply to Amendment 24's self-adoption clause.

  ### Does the Log Underdetermine the Ruling?
  **No—the Adoption Rule cleanly resolves Amendment 24.**  
  - The log pins down the Adoption Rule unambiguously: Amendments 6 and 17 establish that validity depends on meeting the threshold in force, and self-validating clauses are inert at adoption. Amendment 24 is indistinguishable from Amendment 17 on this point.  
  - The Self-Governance Rule is underdetermined—it might extend to self-adoption, but Dana hasn't ruled on that. Still, it's irrelevant here since the Adoption Rule suffices.  
