  We are designing a game to explore the norms of assertion. The goal is to have players experience the tension between four candidate rules for when an assertion is permissible:
   1. Truth Rule: You can assert it if it is true.
   2. Belief Rule: You can assert it if you believe it.
   3. Justification Rule: You can assert it if you have good grounds (justification) for it.
   4. Knowledge Rule: You can assert it if you know it.

   The game should create situations where these norms come apart (e.g., someone asserts something true but without good grounds, or with good grounds but false, etc.). We'll have multiple rounds, and in each round, players will make assertions under a set of rules that we design to test these norms.

   Game Structure:
   - We'll have a series of rounds. Each round has a topic (or a question) that the players are to make assertions about.
   - Players take turns making assertions. They can either make an assertion about the topic or challenge a previous assertion.
   - We need a scoring system that rewards accurate assertions but also penalizes violations of the norms we are testing.

   However, note that the norms we are testing are not necessarily the rules of the game. Instead, we want the players to experience the tension, so we design the game mechanics to create situations where these norms conflict, and then we let the players decide (via challenges and voting) whether an assertion is acceptable.

   Proposed Mechanics:

   1. **Setup**: 
      - We need a deck of "Topic Cards". Each card has a statement that is either true or false, but the truth value is not immediately obvious. The topics should be such that players might have varying degrees of belief, justification, and knowledge about them. Examples: historical facts, scientific claims, pop culture trivia, etc. We can have a mix of easy and hard ones.
      - We also need a way to track scores (pen and paper or a whiteboard).

   2. **Players**: 15 players, but we can break into 3 groups of 5 for the assertion-making phase to keep it manageable? Or we can have one group with a turn-based system. Given 90 minutes, we can do 4 rounds with 3-5 minutes per turn? Alternatively, we can run the game as a group with a moderator (you) who manages the flow.

   3. **Rounds**:
      - Each round has a topic card drawn. The card states a claim (e.g., "The first person to break the sound barrier was Chuck Yeager.") and whether it is true or false (for the moderator's eyes only). Alternatively, we can have claims that are verifiable by the group (if we use common knowledge) but that might be tricky. Instead, we can pre-research and have a fact sheet for the moderator.

   4. **Turns**:
      - The first player (rotates each round) makes an assertion about the topic. They must state the claim as true or false (or perhaps a more nuanced claim, but for simplicity, we stick to true/false).
      - After an assertion, any other player can challenge. A challenge is a question: "How do you know that?" or "On what grounds?" The challenged player must then provide a reason. The challenger can then rebut if they wish, but we need to limit the time.

   5. **Challenge Phase**:
      - When a challenge is made, the challenged player must respond. They have 30 seconds to provide their grounds. Then the challenger has 15 seconds to rebut. Then the entire group votes by show of hands: "Is the assertion acceptable?" (We are not voting on truth but on whether the assertion was properly made under the norms we are exploring.)
