   8. **Materials**:
      - A set of topic cards (with claims and their truth values). We need at least 4. Examples:
          - "The capital of Australia is Sydney." (False, it's Canberra)
          - "The Nile is the longest river in the world." (True, though some argue Amazon, but generally accepted)
          - "Marie Curie was the first woman to win a Nobel Prize." (True, and she won two)
          - "Vitamin C prevents the common cold." (False, it may reduce duration but not prevent)
          - "The Great Wall of China is the only man-made structure visible from space." (False, many are visible, and the Great Wall is not particularly visible from space without aid)
          - "Bats are blind." (False, they can see)
          - "The earth is the fifth largest planet in the solar system." (True? Actually, it's the fifth largest by diameter? Wait: Jupiter, Saturn, Uranus, Neptune, then Earth? But let's check: Jupiter, Saturn, Uranus, Neptune, Earth -> yes, fifth. So true.)

      We need to be careful: the claims should be such that they are not obvious, and players might have varying degrees of knowledge.

      Also, we need:
          - Scoreboard (whiteboard or large paper)
          - Timer

   9. **Debrief (20 mins)**:

      After the game, we discuss:

      - We map moments in the game to the four candidate rules:

          Example: 
            - When an asserter made a true assertion without good grounds (e.g., guessed and happened to be right) and the group voted unacceptable: that illustrates the pull of the justification or knowledge rule (they were right, but we thought they shouldn't have asserted because they lacked justification).
            - When an asserter made a false assertion but with good grounds (e.g., a commonly believed myth) and the group voted acceptable: that illustrates the pull of the justification rule (they had good reasons, so we accepted the assertion even though it turned out false).

          We note that the truth rule would not have penalized the lucky guess (if true, then it's okay) and would have penalized the justified false assertion (because false). The belief rule would have accepted both if the asserter believed. The knowledge rule would have rejected both (because in the first case, they didn't know, and in the second, they thought they knew but were wrong).

      - We also flag moments that don't cleanly fit:

          Example: 
            - A player might have had good grounds but the grounds were based on a source that some players found unreliable (e.g., a blog). The group might have split on whether that counts as good grounds. This highlights that the concept of "good grounds" is context-dependent and social.

