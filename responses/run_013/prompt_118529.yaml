      Round details (15 min per round):

          Step 1: Present the topic. (1 min)
          Step 2: Select 5 asserters (rotate each round). They each get a turn in order.
          Step 3: For each asserter:
                  - They make an assertion (true or false of the topic) and can give a brief reason (10 seconds).
