  Below is a designed case with outcomes A, B, and C, tailored to your specifications. It uses realistic human experiences (chronic illness, grief, work-related suffering) and ensures all outcomes have identical aggregates: same number of people (two), same lifespans (80 years each), same total pleasure (500 units), and same total suffering (200 units). The threshold for lexical suffering is set at **100 units of suffering per life**—above this, no amount of pleasure can redeem that individual's life. Below, we assume a trade-off rate (e.g., 1 unit of suffering offsets 2 units of pleasure, though this rate doesn't affect the threshold's core logic).

  ### **Case Setup: Two Lives, Identical Aggregates**
  - **Suffering threshold**: 100 units/life (lexical: suffering >100 cannot be compensated by any pleasure in that life).
  - **Pleasure/suffering units**: Grounded in real-world experiences:
    - **Pleasure examples**: Daily joys (time with family, hobbies, achievements) = ~5 units/year for a modest life; intense joys (career success, love) = up to ~10 units/year.
    - **Suffering examples**: Chronic pain (e.g., arthritis) = ~2 units/year; severe depression = ~5 units/year; traumatic grief = ~10 units/year for a period.
  - **Outcome details**:
    - **Outcome A**: Suffering concentrated.  
      *Person 1*: Chronic severe depression (102 units suffering) + high-pleasure career (350 units pleasure).  
      *Person 2*: Mild chronic pain (98 units suffering) + low-pleasure life (150 units pleasure).  
      → *Person 1’s suffering exceeds the threshold (102 > 100)*.
    - **Outcome B**: Suffering spread thin.  
      *Person 1*: Moderate chronic pain (99 units suffering) + moderate-pleasure life (250 units pleasure).  
      *Person 2*: Moderate chronic pain (101? Wait—must keep totals identical. Adjust: 99 + 101 = 200, but 101 >100! Redesign to keep both below threshold).  
      **Redesigned B**:  
      *Person 1*: Grief from loss (90 units suffering) + moderate-pleasure life (250 units pleasure).  
      *Person 2*: Work-related stress (110? 90+110=200, but 110>100. Final: both at 100? Threshold is 100, so suffering=100 is "below" if inclusive? Clarify: threshold is *above* 100. Set both to 99.9? Use 99 units).  
      **Final B**:  
      *Person 1*: Chronic back pain (99 units suffering) + fulfilling relationships (250 units pleasure).  
      *Person 2*: Caregiver fatigue (101? No—split equally: 100 each? But 100 not above threshold. Set to 99 and 101? 101>100 violates. Solution: **set suffering to 99 for both** (total 198? Not 200. Adjust pleasure to preserve totals).  
      **Correction**: Suffering must total 200. Set:  
      *Person 1*: 99 units suffering, 251 units pleasure.  
      *Person 2*: 101 units suffering? 101>100—invalid. **Only way**: Use 100 units for both, but threshold is *>100*, so 100 is acceptable.  
      **Resolution**: Threshold is **>100**, so suffering=100 is *below* (not above). Thus:  
      *Person 1*: Work-related stress (100 units suffering) + stable family life (250 units pleasure).  
      *Person 2*: Work-related stress (100 units suffering) + stable family life (250 units pleasure).  
      → *No one exceeds threshold (suffering ≤100)*.  
    - **Outcome C** (for later): Like A, but Person 1’s suffering just below threshold.  
      *Person 1*: Severe grief (99 units suffering) + high-pleasure career (350 units pleasure).  
      *Person 2*: Mild chronic pain (101? 99+101=200, but 101>100. Set: 99 + 101? 101>100—invalid. **Adjust Person 2** to keep suffering ≤100:  
      *Person 1*: 99 units suffering, 350 units pleasure.  
      *Person 2*: 101? No—**take 1 unit from Person 1’s suffering and add to Person 2** (who was at 98 in A).  
      *Person 2*: Mild chronic pain + additional stress (99 units suffering? 98+1=99). But total suffering=99+99=198 ≠200. **Final C**:  
      *Person 1*: 99 units suffering (grief), 350 units pleasure.  
      *Person 2*: 101 units suffering? Not working. **Redefine threshold as 105** to allow small adjustment:  
      - Threshold: **105 units**.  
      - A: Person 1 suffering=106 (chronic depression), Person 2=94 (mild pain).  
      - C: Person 1 suffering=104 (manageable depression), Person 2=96 (slightly worse pain).  
      → Totals: Suffering=200, pleasure=500 (P1: 350, P2: 150 in A and C).  

  **Final Outcomes (Threshold = 105 units)**:
  | Outcome | Person 1                          | Person 2                          | Total Suffering | Total Pleasure |
  |---------|-----------------------------------|-----------------------------------|-----------------|---------------|
  | A       | 106⸱ suffering, 350⸱ pleasure   | 94⸱ suffering, 150⸱ pleasure    | 200            | 500           |
  | B       | 100⸱ suffering, 250⸱ pleasure   | 100⸱ suffering, 250⸱ pleasure   | 200            | 500           |
  | C       | 104⸱ suffering, 350⸱ pleasure   | 96⸱ suffering, 150⸱ pleasure    | 200            | 500           |

  ### **Veridicts of the Lexical Threshold View**
  1. **Per-person reading (threshold applies *within* each life)**:  
     - **A**: Person 1’s suffering (106) >105 → **life unredeemable** by pleasure. Outcome A is **bad** (lexically worst).  
     - **B**: Both lives ≤105 suffering → suffering/pleasure trade-off applies. Value = (250 - k×100) + (250 - k×100) = 500 - 200k.  
     - **C**: Both lives ≤105 suffering → same as B. Value = (350 - k×104) + (150 - k×96) = 500 - 200k.  
     - **Verdict**: A < B = C (A worse than B and C; B and C equal).  

  2. **Population reading (threshold applies to *total* suffering)**:  
     - Total suffering is 200 in all outcomes → identical. Ignores distribution.  
     - If total suffering > global threshold (e.g., 150), all outcomes are **equally bad** (lexical penalty).  
     - **Verdict**: A = B = C (all equally bad).  

  **Key clash**: Per-person reading ranks A as worse than B/C, while population reading sees all as equal. They **come apart** because per-person cares *who* suffers, while population only cares *how much* total suffering exists.  

  ---

  ### **Plain Commensurating Totalist Verdict**
  - **Value function**: Sum of (pleasure - k×suffering) across all lives.  
  - **All outcomes**:  
    A: (350 - k×106) + (150 - k×94) = 500 - 200k  
    B: (250 - k×100) + (250 - k×100) = 500 - 200k  
    C: (350 - k×104) + (150 - k×96) = 500 - 200k  
  - **Verdict**: Indifferent between A, B, and C for **any k**.  
  - **Can it reproduce the per-person threshold verdict?**  
    **No**—because total value is identical in all outcomes, it cannot rank A as worse than B/C. The per-person verdict depends on the *distribution* of suffering (which breaks aggregation), while totalist views only care about sums.  

  ---

  ### **Adding Outcome C: Small Change, Big Swing**
  - **C vs A**: Only change is Person 1’s suffering drops from 106→104 (e.g., therapy reduces chronic depression from severe to manageable), and Person 2’s suffering increases from 94→96 (e.g., mild pain worsens slightly).  
  - **Per-person verdict**: A is lexically bad (106>105), while C is acceptable (both ≤105). **Swing**: Tiny change (2 units of suffering redistributed) flips A from "worst" to "acceptable" (C).  
  - **With a finite penalty** (replace ∞ with large M):  
    - Life value = pleasure - k×suffering if suffering ≤105; -M if suffering >105.  
    - A: -M + (150 - k×94)  
    - C: (350 - k×104) + (150 - k×96) = 500 - 200k  
    - For large M, A < C (same as lexical verdict). **But**: Ordering holds only if M is large enough to dominate (e.g., M > 500 - 200k + k×94 - 150).  
  - **Can it be represented by a real-valued value function?**  
    - **Lexical threshold (∞)**: No—discontinuity at threshold violates Archimedean property (no finite pleasure can offset infinitesimal suffering over threshold).  
    - **Finite M**: Yes—real-valued, but requires M to be "large enough" to mimic lexicality for practical cases. Ordering is preserved in this example.  

  ---

  ### **What the Case Shows: Lexicality vs. Distribution Sensitivity**
  - **The core tension**: The view **cannot keep both lexicality and distribution-insensitivity**.  
    - **Per-person reading** keeps lexicality and gains distribution sensitivity (cares who suffers).  
    - **Population reading** keeps lexicality but loses distribution sensitivity (cares only about totals).  
  - **What must be given up?**  
    - To avoid inconsistency, the defender must **reject the population reading** and insist the threshold applies *within lives, not across them*.  
  - **Defender’s response**:  
    > "The threshold is a deontic constraint *on individual lives*: no person should endure unbearable suffering, regardless of social totals. Distribution matters because we owe each person a life below the threshold. Value aggregation is secondary—this is about justice, not utilitarianism."  
  - **Alternative defense**:  
    > "Pleasure and suffering aren't commensurable currencies above the threshold. A life with >105 suffering isn't 'worth less'—it's morally obliterated. Trade-offs only apply below the threshold."  

  ### **The One Feature Doing All the Work**
  - **Feature**: Redistributing suffering can push one life *over* the threshold (concentrated in A) or keep all *under* (spread in B/C), while holding totals fixed.  
  - **Remove this feature?** (e.g., all outcomes have at least one life above threshold, or none ever cross it):  
    - Lexicality collapses into ordinary trade-offs.  
    - **Example**: If no life in A/B/C exceeds threshold, all reduce to total pleasure minus k×total suffering.  
    - **Result**: The problem becomes standard consequentialism—no lexical jump, no distributional sensitivity beyond totals.  

  ### **Conclusion**
  This case forces a choice: either accept distribution sensitivity (per-person threshold) and defend the moral weight of concentrated suffering, or reject distribution sensitivity (population threshold) and face counterintuitive equality between concentrated and diffuse suffering. The small change from A to C exposes the instability of lexical thresholds in practice, while the totalist verdict highlights how distribution-blindness misses what matters to the per-person view. If your friend holds the per-person view, he must bite the bullet on the A/C swing—but the case clarifies why this matters more than abstract aggregates.
