prompt: |-
  Two friends are standing at the mailbox with the entry forms for one of those luring lotteries: a hundred thousand people got invited, the prize is $100,000 split evenly among everyone who enters, and it costs $2 to enter (you mail in the form with a cheque). If nobody enters, nobody gets anything. Write a dialogue between them.

  One of them is a superrationalist. Her line: the question isnt what should I do, its what should everyone who reasons the way I do do — and if all of us enter we each get $1 and pay $2, so none of us should. The lure is the fantasy that you'll be the one clever person who enters alone. The other thinks that's logic-shaped nonsense: 'everyone who reasons like me' isn't a group, it's a way of assuming strangers will do what you want; the only choice correlated with mine is mine; and plenty of people will just ignore the letter, in which case entering is a great deal. (The mailing list is obviously half philosophy department, half sweepstakes, so neither of them knows which kind of pool they're in.)

  Make it a real fight between two smart people who are actually listening to each other. He should have a real answer to the symmetry argument — something like, correlation needs a common cause, and a common cause doesn't give my cheque any power over anyone else's — and she should have a real answer to that. Let them go at the thing neither of them can settle: how many people, if any, actually reason the way she does, and whether that number changes the answer or just changes who the sucker is. Neither of them can remember who invented any of this, so no names and no citing papers. Have them do the arithmetic out loud at least once. Around 700-800 words.
reasoning: |-
  Okay, the user wants a dialogue between two friends debating a lottery scenario. One is a superrationalist, arguing that everyone who thinks like her should collectively decide not to enter to avoid losing money. The other is a conventional rationalist, focusing on individual decision-making regardless of others' actions. 

  The user specified several key elements: 
  The superrationalist's core argument about collective reasoning and the $1 vs $2 dilemma. 
  The opponent's counter about "logic-shaped nonsense" and real-world unpredictability. 
  A philosophical clash over whether decision-making symmetry creates obligation. 
  Explicit arithmetic demonstration. 
  Unresolved tension about how many people actually reason this way. 
  No academic references - pure street-level debate. 

  Hmm, the challenge is making both positions compelling while keeping the math accessible. The mailbox setting helps - natural place for this conversation. Should show their history through subtle cues ("sucker" reference, familiar exasperation). 

  For the superrationalist's depth: Need to emphasize that her symmetry principle isn't about controlling others but recognizing identical reasoning processes as binding. When she says "what should everyone like me do", it's a Kantian move - universalizing the maxim. 

  For the opponent's best point: His correlation/common cause argument is strong. If he pays, that doesn't magically make others pay - no causal link. But she'd counter that superrationality isn't causation but game-theoretic coordination. 

  The arithmetic moment must feel organic - maybe he starts calculating scenarios to prove his point, and she reframes it in group terms. The "how many think like you" tension is delicious - neither can know if her philosophy is 1% or 99% of the pool. 

  User clearly knows this material well (references to "philosophy department/sweepstakes" split). Probably wants to see steelmanned versions of both arguments. I'll avoid jargon - no "Nash equilibrium" mentions. 

  Final beat should linger on the real human dilemma: His "maybe we're both suckers" undercuts the intellectual sparring nicely. The cheque waving makes it visceral.
answer: |-
  ## Mailbox Standoff

  **Characters:**  
  *   **ELARA (Superrationalist):** Sharp, intense, slightly weary of explaining herself. Believes reasoning creates obligation.  
  *   **LEO (Conventional Rationalist):** Pragmatic, skeptical of abstract coordination. Focuses on individual choice and probabilities.  

  **Setting:** Sidewalk beside a mailbox, each holding an identical lottery entry form and a pen.

  **(The wind flutters the forms. LEO scribbles his cheque. ELARA stares at hers, frowning.)**

  **LEO:** (Without looking up) Quit stalling, Elara. Mail it or don’t. Two bucks for a shot at a hundred grand split? Worth a flutter. Worst case, I’m out a coffee.

  **ELARA:** Leo, it’s not about *my* two bucks. Think bigger. What should *everyone* who reasons the way I do actually *do*?

  **LEO:** (Sighs, pockets his pen) Here we go again. The ‘superrational choir’. Okay, Maestro. Conduct.

  **ELARA:** If *every single person* who thinks like this enters… how much does each winner get?

  **LEO:** (Eyes narrowing, calculating) Hundred grand prize… divided by… everyone who enters. If it’s *only* people like you… and they *all* enter… then… $100,000 divided by, say, X people. So… $100,000 / X per winner. But it costs $2 to enter. So if X is big… profit tiny. If X is small…

  **ELARA:** Precisely. Now, if *all* of us who reason this way enter, *and* we win $100,000/X, but we paid $2… what’s our net? $100,000/X minus $2. Set it equal to zero – break-even – $100,000/X = $2. Solve for X.

  **LEO:** (Muttering) 100,000 divided by 2… X = 50,000. So if exactly 50,000 of ‘your people’ enter, each gets $2, pays $2. Net zero. Pointless.

  **ELARA:** Exactly! And if *more* than 50,000 ‘like me’ enter? Say 100,000? Each gets $1, pays $2. Net *loss* of $1. We’d be *paying* to lose money collectively! So, if we all enter when there are more than 50,000 of us reasoning this way, we all *lose*. The *only* way entering makes sense for *us* is if *fewer* than 50,000 of us enter. But how do I *ensure* that?

  **LEO:** You don't! That’s the whole point! You’re assuming your ‘way of reasoning’ magically ropes strangers into a pact. It’s logic-shaped nonsense. ‘Everyone who reasons like me’ isn’t a group with a clubhouse. It’s a *description* you invent. My actual choice? It’s only correlated with one thing: *my own choice*. Me mailing this cheque doesn’t *cause* some philosophy PhD in Oregon to mail theirs. There’s no common cause linking our actions *except* maybe the letter itself, and that doesn’t give my cheque power over theirs! I control *my* pen. That’s it.

  **ELARA:** But Leo, the *symmetry*! If we all *recognize* the same logic, the same optimal strategy should be *evident* to all of us. We’re identical reasoning engines facing identical information. What is rational *for me* must be rational *for any other such engine*. Therefore, we should all reach the *same conclusion*: entering when many of us exist is collectively irrational. So we *shouldn't* enter.

  **LEO:** Shouldn't? Based on what? A hope that a bunch of strangers spontaneously achieve perfect coordination just because they *might* think similarly? Look around! Half this mailing list is probably junk mail recipients who chucked it. The other half is… well, maybe people like you, maybe people like me, maybe people who just like lotteries! If *most* people ignore it, then entering is brilliant! Even if 50,000 enter, I break even. If *only 10,000* enter? I get $10! Net $8! If *I alone* enter? Jackpot! The lure isn’t a fantasy, it’s the *probability* that enough people *won’t* play by your superrational rulebook. The expected value hinges on guessing how many *will* enter, not assuming I control a phantom group.

  **ELARA:** And how do you guess that? You have *no idea*. You’re gambling on *others* being irrational or ignorant – on *them* being the suckers who don’t enter, making *your* entry valuable. My way avoids that. By recognizing the symmetry, we *all* abstain. No one loses $2. The prize isn’t claimed, but no harm done. We collectively avoid a potential loss.

  **LEO:** Or, *you* abstain, hoping others like you do too… but if they *don’t*… or if there aren’t many of you… then *you* miss out on the $8 or $10 profit, and *I* potentially profit *because* I ignored your symmetry argument! Your ‘collective win’ relies on perfect universal compliance with a rule only *you* seem to follow rigorously. If only 1,000 people in the world think like you, Elara, then *your* entering or not is irrelevant to the prize pool. You refusing to enter just makes *my* potential share slightly bigger. *You* become the sucker who left money on the table based on an abstract principle nobody else signed up for.

  **ELARA:** (Frustrated) But *how many* are there? That’s the unanswerable question! If there are *more* than 50,000 superrationalists, and we all enter, we *all* lose $1. If we all abstain, we *all* save $2. Abstaining dominates! If there are *fewer* than 50,000… well, then entering *could* be profitable *if* we could coordinate who does it. But we *can’t*. So the safe, rational play for *us* is still to abstain and guarantee we don’t lose.

  **LEO:** Safe? Maybe. Rational? Only if you define ‘us’ in that weirdly expansive way. My choice isn’t ‘safe’ against your groupthink; it’s an independent bet on human behaviour. I see a potential positive expected value based on likely apathy. You see a potential collective loss based on assuming widespread, perfect, identical reasoning. You’re correlating choices that aren’t causally linked. My pen moves my cheque. Period. The rest is noise and probability. Mail it or don’t, but don’t pretend your inaction binds the universe.

  **ELARA:** It binds *reason*. If we believe the same logic compels us, then acting against it is irrational. Cooperation through mutual recognition of logic *is* the common cause!

  **LEO:** (Shakes his head, finishes signing his cheque) Prove that mutual recognition exists. Prove how many others share it. Until you can, you’re just hoping strangers act according to *your* script while calling it logic. I’m betting most people… won’t. (He folds his form decisively.) Maybe *we’re* both suckers – you for overthinking it, me for underthinking it. But my two bucks are riding on human nature being messy. (He opens the mailbox slot.)

  **ELARA:** (Looks at her blank cheque, then at the slot, then at Leo. A deep uncertainty clouds her usual certainty.) How many *are* there? And what if they *don't* see it? (She doesn’t move her pen.)

  **LEO:** (Holding his form poised over the slot, meets her gaze) That’s the gamble, isn’t it? For both of us. On three? (He grins, a challenge and an admission of shared uncertainty in his eyes.)

  **(ELARA stares at her form, the arithmetic and the unanswerable question warring in her mind. The mailbox yawns.)**
