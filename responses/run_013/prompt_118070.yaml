answer: |-
  Here’s your prep sheet, tailored to your audience and thesis. Prioritized by damage potential, with rebuttals and vulnerability assessments:

  ### **Top-Tier Objections (High Damage)**
  1. **The Cliometrician**:  
     *Objection*: "You’re replacing quantifiable divergence metrics with semantic hand-waving. If ‘sustained modern growth’ is your outcome variable, show me the per capita GDP data, TFP estimates, or innovation rates that make ‘Europe vs. China’ a false contrast. Until then, this is philosophy masquerading as history."  
     *Reply*: "You’re right—this *requires* empirical grounding. My point isn’t that divergence didn’t happen, but that **framing it as ‘Europe succeeded, China failed’ pre-loads Eurocentric assumptions**. Take Allen’s wage-ratio data: it shows *regional* hotspots (Yangzi/London) outperforming hinterlands *in both societies*. Why contrast ‘England’ with ‘China’ instead of comparable economic cores? [Show slide: Allen 2009, Fig 5.2]. The ‘failure’ narrative ignores that Qing China met Malthusian constraints *differently*—not absent growth."  
     *Soft Spot*: Admits the divergence exists but lacks alternative quantitative thresholds for "sustained growth." Risk of seeming to dismiss cliometrics.  

  2. **California-School Historian**:  
     *Objection*: "You’re flattening Pomeranz’s *actual* argument. The ‘Great Divergence’ *is* about asymmetric access to coal/colonies post-1800—*not* civilizational failure. Calling it ‘malformed’ ignores how the question *exposes* Eurocentrism by demanding specificity."  
     *Reply*: "Agreed—Pomeranz’s shift to *contingent* factors is vital. But the **‘Needham question’ in popular discourse still implies a Chinese ‘deficit’**. My reframing pushes further: if windfalls (like British coal) explain ‘why Europe?’ then ‘why not China?’ reduces to ‘why no comparable windfall?’—which *is* regional luck, not a verdict on institutions. Symmetry forces us to ask: ‘Why did *no society* replicate Lancashire’s exact conditions?’—which dissolves China’s outlier status."  
     *Soft Spot*: Overstates popular misuse of Pomeranz; conflates scholarly/popular discourse.  

  ---

  ### **Mid-Tier Objections (Moderate Damage)**
  3. **Philosopher of Causation**:  
     *Objection*: "Contrast classes *are* often asymmetric in valid explanations (e.g., ‘Why *this* virus, not *others*?’). Why is Europe/China invalid if context fixes the foil? Your ‘symmetry’ demands arbitrary parity where none exists."  
     *Reply*: "True, asymmetry isn’t inherently invalid—but **asymmetry *smuggles in a causal premise***. If I ask ‘Why did *Alice* get sick (not Bob)?’, I imply Alice had a unique risk factor. The Needham question implies China had unique *deficits*. But if Europe’s takeoff relied on contingent, non-replicable factors (per California School), China isn’t a ‘control case’—it’s simply *elsewhere*. The contrast misleads by suggesting commensurability."  
     *Soft Spot*: Concedes asymmetry can be legitimate; relies on contingent factors being non-generalizable.  

  4. **Qing Specialist**:  
     *Objection*: "You erase Qing constraints: silver shortages, rebellion-scale, ecological stress. These *are* contrasts with Europe! Calling them ‘regional’ ignores state-capacity collapse that *prevented* a Yangzi takeoff."  
     *Reply*: "Critical point—I don’t deny Qing crises. But **were these *unique* barriers?** Post-1750 Europe had revolutions/famines/wars too. The difference is that Britain *resolved* its crises (e.g., post-1648 stability) while Qing faced concurrent shocks. This isn’t ‘China vs. Europe’—it’s ‘adaptive resilience in one region vs. systemic overload in another.’ The unit stays sub-continental."  
     *Soft Spot*: Minimizes scale of 19th-century Qing collapse; risks sounding dismissive.  

  ---

  ### **Concessions to Make Early (Preempt Dodging Accusations)**
  - **"Yes, per capita productivity diverged dramatically post-1800."**  
  - **"Yes, China faced distinct challenges (e.g., Taiping Rebellion) Europe avoided."**  
  - **"Yes, the ‘Needham question’ motivated vital scholarship—even if flawed."**  

  ---

  ### **The Nightmare Objection (Pray It Isn’t Raised)**  
  **The Pragmatist Philosopher + Cliometrician Tag Team**:  
  *Objection*: "If contrast classes are interest-relative, why police ‘malformed’ questions? Economists *need* national units for modeling. Your ‘symmetry’ is just *your* preferred contrast—ignoring that ‘why Europe not China?’ generates testable hypotheses (e.g., institutions, energy returns). Reframing as ‘how possibly Europe?’ produces empty just-so stories."  

  *Why It’s Devastating*:  
  - Forces you to defend "malformed" as more than contextual preference.  
  - Exposes tension between historical specificity and generalization.  
  - Your reply likely sounds like "Because I say so" if unprepared.  

  *Salvage Attempt*:  
  "Fair—but **productive questions avoid implicit teleology**. ‘Why Europe not China?’ implies China *should* have industrialized. A pragmatist *should* ask: ‘Useful for whom?’ If the goal is explaining growth mechanics, regional/comparative units (e.g., ‘energy-intensive economies’) beat civilizational binaries. The original framing biases answers toward ‘Chinese defects’—see the ‘high equilibrium trap’ literature’s false assumptions about markets."  
  *Soft Spot*: Still doesn’t prove the question is *less useful* for hypothesis-generation.  

  ---

  ### **Summary Strategy**  
  - **Disarm Cliometricians** with data (Allen, Broadberry) showing regional heterogeneity.  
  - **Flatter California-School** by extending their contingency argument.  
  - **Philosophers**: Emphasize that *framing* drives causal attribution (e.g., "deficit vs. windfall").  
  - **Qing Specialist**: Grant unique stressors but stress parallel crises elsewhere.  
  - **Nightmare Scenario**: Redirect to "What work does the China foil do?" and expose its teleological baggage.  

  You’re ready. The soft spots are real—but so is the coherence of your critique. Good luck!
