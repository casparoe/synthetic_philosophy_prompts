prompt: |-
  I'm doing a metaethics module and we've just hit expressivism, and specifically the Frege–Geach problem. Before I start revising the different expressivist accounts I want the actual spec first, because at the moment I keep judging them against whatever example happens to be on the slide in front of me.

  So, act as a philosopher working on metaethics and the philosophy of language, and think carefully before you answer. Give me the desiderata — the full list of things any adequate expressivist semantics for moral language has to get right — with, for each item, the case or consideration that puts it on the list. I want the requirements that are genuinely required, not just the ones the Blackburn/Gibbard quasi-realist tradition happens to care about, and I'd like you to flag any pair of requirements you think can't be satisfied together. That's the bit I'm most interested in, because if there's an inconsistent subset then the list itself is a result.

  Make sure you at least consider these as candidate requirements and say which are genuine desiderata and which are just parochial: simple unembedded moral sentences; negation, including the difference between negating the moral content and negating the attitude expressed; moral sentences in the antecedent and in the consequent of conditionals; mixed inferences where a moral conclusion follows from a factual premise plus a conditional; agreement and disagreement between two speakers; and the validity of arguments as opposed to just their soundness. Then tell me which single requirement does the most work in ruling out the cheap versions of expressivism.

  One more thing to fold in, because my tutor raised it and I don't think it's a standard item on these lists: moral sentences sitting in the antecedent of a conditional whose consequent is a plain prediction about the world — something like 'if lying is wrong then it'll rain tomorrow' — seem to behave in two quite different ways depending on how you read them, and an expressivist story has to say which reading it's giving and why. Treat that as a requirement in its own right, and say whether it's really independent of the embedding requirement or just the same point again.

  Keep it tight, and no bibliography or citations please — just the list, the case behind each requirement, and the incompatibility verdict.
reasoning: |-
  Okay, the user is diving deep into expressivism in metaethics, specifically the Frege-Geach problem. They want a clear list of desiderata for any expressivist semantics, with the cases that necessitate each requirement. They also want to know if any requirements conflict and which one is most crucial for ruling out simplistic expressivist accounts.

  First, I need to recall what the Frege-Geach problem entails. It's about how moral language embeds in complex sentences like conditionals or negations, which challenges expressivism's core idea that moral statements express non-cognitive attitudes. The user mentioned several key embedding contexts: simple sentences, negation, conditionals (both antecedent and consequent), mixed inferences, agreement/disagreement, and validity versus soundness. Plus, their tutor added a twist with conditionals that have moral antecedents and non-moral consequents.

  Let me list out the genuine desiderata one by one, linking each to a specific case. Start with the basics: simple unembedded sentences. Expressivism must explain how "Lying is wrong" expresses an attitude, like disapproval. That's straightforward and necessary for the view. Then negation: expressivists need to distinguish between negating the moral content (e.g., "Lying isn't wrong") and negating the attitude itself (e.g., "I don't disapprove of lying"). The case here is avoiding confusion in ordinary language use.

  Next, conditionals. The classic Frege-Gach example is modus ponens with moral content, like "If lying is wrong, then getting little brother to lie is wrong." Expressivism must show how the conditional expresses a complex attitude without making the inference trivial. This is crucial for logical validity. Also, mixed inferences—where a moral conclusion comes from factual and moral premises—must be handled without treating the moral parts as truth-apt. For instance, "If harming animals is wrong, then factory farming is wrong" plus "Harming animals is wrong" leading to "Factory farming is wrong." Expressivism needs to preserve this inference's validity.

  Agreement and disagreement are important too. If two people say "Lying is wrong" and "Lying isn't wrong," that's direct disagreement in attitude. But expressivism must also explain why agreeing on descriptive facts can still lead to moral agreement or disagreement, like in cases where all facts are settled but attitudes differ. That ties into the objectivity intuition in moral discourse.

  Then there's validity versus soundness. Expressivism must account for why arguments can be valid (truth-preserving) even when moral sentences aren't truth-apt. This is a big challenge because traditional logic assumes truth conditions, but expressivists like Blackburn and Gibbard develop quasi-realism to mimic it.

  The tutor's addition about moral antecedents in conditionals with non-moral consequents is interesting. For example, "If lying is wrong, it will rain tomorrow." This can be read as a material conditional or as a conditional attitude. Expressivism needs to clarify which reading it supports and why, perhaps tying it to the speaker's commitments. This seems distinct from general embedding because it forces expressivists to explain how moral attitudes connect to factual predictions.

  Now, about conflicts: the big tension is between nonfactualism (moral sentences aren't truth-apt) and logic (which relies on truth preservation). Quasi-realism tries to bridge this by simulating truth-talk, but it's contentious. The validity requirement is key here—it's what most clearly rules out simple expressivist views that can't handle logic.

  I should also flag which items are parochial. Blackburn/Gibbard focus a lot on embedding and logic, but things like agreement might be broader. The tutor's point about conditionals with non-moral consequents adds depth but isn't always highlighted in standard lists.

  Finally, the user wants it tight and without citations. So I'll keep the list concise, explain each desideratum with its case, note conflicts, and emphasize that validity is the main hurdle for cheap expressivism.
answer: |-
  Here are the core desiderata for any adequate expressivist semantics in metaethics, derived from the logical, linguistic, and phenomenological demands of moral discourse. Each item includes the case motivating it and notes on conflicts. Genuine requirements are distinguished from potentially parochial concerns.

  ### Genuine Desiderata (Non-Negotiable Requirements)
  1.  **Simple Unembedded Sentences:**
      *   **Case:** "Lying is wrong." Expressivism *must* explain its primary function: expressing a non-cognitive attitude (e.g., disapproval) towards lying.
      *   **Motivation:** Core commitment of expressivism. Explains motivational force and action-guiding nature of moral judgment.
      *   **Status:** Foundational, non-parochial.

  2.  **Attitude Negation vs. Content Negation:**
      *   **Case:** Distinguishing "Lying is not wrong" (content negation: expressing approval or neutrality) from "It is not the case that I disapprove of lying" (attitude negation: a report on one's psychology).
      *   **Motivation:** Ordinary language clearly distinguishes rejecting a moral claim from reporting a lack of attitude. Failing this leads to confusion or error about the meaning of moral denial.
      *   **Status:** Genuine requirement, highlights the attitudinal core.

  3.  **Moral Sentences in Conditionals (Antecedent & Consequent):**
      *   **Case:** "If lying is wrong, then telling your brother to lie is wrong." Expressivism must assign a meaning to the antecedent ("lying is wrong") that contributes systematically to the meaning of the whole conditional, without presupposing the attitude is *actually expressed* in the antecedent.
      *   **Motivation:** The Frege-Geach Problem proper. Moral sentences function as components in complex logic. The attitude expressed by the whole conditional cannot be the same as the attitude expressed by the antecedent alone in isolation.
      *   **Status:** Central, genuine requirement. Failure here sinks expressivism.

  4.  **Validity Preservation (Logic):**
      *   **Case:** Recognizing that the argument ["If lying is wrong, then getting your brother to lie is wrong"; "Lying is wrong"; therefore "Getting your brother to lie is wrong"] is *valid* (truth-preserving if premises are true), even if expressivism denies moral sentences are straightforwardly truth-apt.
      *   **Motivation:** Moral reasoning follows logical patterns indistinguishable from factual reasoning. Expressivism must explain why modus ponens *works* with moral content without collapsing into realism or making validity trivial. This is distinct from soundness (which requires the premises to be "correct").
      *   **Status:** Genuine requirement. **This does the most work ruling out cheap expressivism.** Simplistic views (e.g., "wrong" *just* means "Boo!") fail spectacularly here, as they lack the compositional structure needed for logic.

  5.  **Mixed Inferences (Factual Premise + Moral Conditional → Moral Conclusion):**
      *   **Case:** ["If kicking dogs causes them pain, then kicking dogs is wrong"; "Kicking dogs causes them pain"; therefore "Kicking dogs is wrong"]. Expressivism must explain the validity of inferences where a purely descriptive premise combines with a moral conditional to entail a moral conclusion.
      *   **Motivation:** Pervasive in moral reasoning. Tests whether expressivism can integrate descriptive and moral content within a unified logic. Shows moral conclusions aren't derived from attitudes alone.
      *   **Status:** Genuine requirement, a specific stress test of the logic requirement (#4).

  6.  **Expression of Agreement/Disagreement:**
      *   **Case:** When A says "Lying is wrong" and B says "Lying is not wrong," they straightforwardly disagree. Expressivism must characterize this disagreement as a conflict of attitudes, not just differing beliefs.
      *   **Motivation:** The phenomenology of moral debate involves genuine conflict. Expressivism's core strength is explaining this as attitudinal clash.
      *   **Status:** Genuine requirement, though sometimes overemphasized in parochial defenses. The real challenge is embedding this within logic (#3, #4).

  7.  **Moral Antecedent + Non-Moral Consequent Conditionals (Ambiguity Resolution):**
      *   **Case:** "If lying is wrong, then it will rain tomorrow." Expressivism must explain the two distinct readings:
          *   **(Reading 1 - Material/Truth Functional):** Evaluates as true unless lying is wrong and it doesn't rain. Expressivism must say what *state* makes this true/false.
          *   **(Reading 2 - Expressivist Commitment):** Expresses a commitment like "Given that I disapprove of lying, I predict rain tomorrow." (Often feels defective unless context links the attitude to the prediction).
      *   **Motivation:** Reveals a deeper challenge than simple embedding. Expressivism predicts the second reading is primary (as the antecedent expresses an attitude, not a truth-condition). It *must* explain why the first reading seems possible (or explain it away) and account for the potential defectiveness of such sentences. This tests the *nature* of the semantic content assigned to embedded moral sentences.
      *   **Status:** Genuine, **independent requirement**. It's not just about embedding *per se* (#3), but about the *specific interaction* between the type of content expressivism assigns (attitude-expressing) and the type of content in the consequent (fact-stating/predictive). It probes the expressivist's account of "conditional commitment."

  ### Parochial or Less Central Considerations
  *   **"Objectivity" Intuitions:** While expressivism (especially quasi-realism) often *tries* to explain moral discourse's "objectivity-like" features (e.g., thinking we can be mistaken), this is a goal *within* expressivism, not an external requirement all expressivists must meet. Some expressivists (e.g., early Ayer) happily reject it.
  *   **Specific Attitude Types:** Whether the attitude is disapproval (Stevenson), acceptance of a norm (Gibbard), or plans (Gibbard later) is internal to the expressivist theory, not an external requirement. The core requirement is *some* non-cognitive state.

  ### Potential Incompatibilities
  The fundamental tension lies between **Nonfactualism** (core expressivist thesis: moral sentences fundamentally express non-truth-apt attitudes) and the demands of **Logic** (especially #3 Embedding, #4 Validity, and #5 Mixed Inferences).

  *   **The Conflict:** Logic (#4, #5) requires moral sentences to function *as if* they have truth-conditional content and stand in logical relations (truth-preservation). Nonfactualism (#1) denies they have straightforward truth-conditional content. Reconciling these demands is the essence of the Frege-Geach problem.
  *   **The Verdict:** This tension is **not logically insurmountable**, but it's incredibly difficult. Quasi-realism (Blackburn, Gibbard) attempts reconciliation by constructing "truth" and "logic" *out of* attitudes and their systematic relations. Whether this succeeds is the central debate. A theory that *simply* satisfies Nonfactualism (#1) and Agreement (#6) but fails Logic (#4) is inadequate. A theory that satisfies Logic but abandons Nonfactualism ceases to be expressivist. The key question is whether all requirements *can be jointly satisfied* by a sophisticated expressivism. No proof of inconsistency exists, but the burden of proof is on the expressivist to show consistency.

  ### Summary of Key Points
  *   **Core Requirements:** #1 (Expression), #2 (Negation Distinction), #3 (Conditional Embedding), #4 (Validity/Logic), #5 (Mixed Inferences), #6 (Agreement/Disagreement), #7 (Antecedent-Prediction Conditionals).
  *   **Most Damaging to Cheap Expressivism:** #4 (Validity). Simple emotivism fails immediately here.
  *   **Deepest Tension:** Nonfactualism (#1) vs. Logic (#4, #5). Quasi-realism is the main attempt at reconciliation.
  *   **Tutor's Point (#7):** Genuine, independent requirement testing the *nature* of embedded content.

  Any adequate expressivist semantics must provide a systematic, compositional account meeting all genuine desiderata, demonstrating how complex moral statements express complex states constituted by the simpler attitudes expressed by their parts, while preserving logical relations. The devil is entirely in this systematicity.
