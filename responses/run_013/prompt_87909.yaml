  We are going to design a 90-minute session with two main phases: the preference aggregation phase (with voting cycles and agenda manipulation) and the judgment aggregation phase (the doctrinal dilemma). The goal is for students to experience the impossibility and paradoxes in social choice.

  Structure:
  1. Introduction (5 minutes)
  2. Phase 1: Preference Aggregation and Agenda Control (40 minutes)
     - Setup and Role Assignment (5 min)
     - Voting Rounds (25 min)
     - Reveal and Discussion of Agenda Power (10 min)
  3. Phase 2: Judgment Aggregation (30 minutes)
     - Setup and Voting (15 min)
     - Discussion of the Paradox (15 min)
  4. Debrief and Connection to Arrow's Theorem (15 minutes)

  Total: 90 minutes.

  Detailed Plan:

  1. Introduction (5 minutes)
     - Welcome and set the stage: "Today we are going to make collective decisions. We'll start by choosing among several options, then we'll move to judging a set of connected statements. The goal is to see how groups reason and decide together."
     - Explain rules: no laptops, participation is key. We'll use paper and pens. The session is structured in two parts.

  2. Phase 1: Preference Aggregation (40 minutes)

     Objective: Create a cycle (A>B, B>C, C>A) and show agenda control.

     Setup:
     - We need 3 options (A, B, C). Let's call them "Policy X", "Policy Y", "Policy Z" to make it concrete. Example: 
          Policy X: Build a new library.
          Policy Y: Build a new sports center.
          Policy Z: Renovate the student union.

     - Assign roles: 
          - One student is the Chair. They have a hidden agenda: they prefer Policy Z above all. (Tell the Chair privately that they want Z to win and they will be in charge of the order of voting. Do not tell them how to achieve it, just their goal.)
          - The other students are voters. They will be assigned preference orders that will lead to a cycle.

     How to assign preferences?
     - We need a Condorcet cycle. We'll create 3 groups of voters (with roughly equal numbers, but adjusted to the total of 15). We can have 5 in each group? But note: the cycle requires that the majority prefers A to B, B to C, and C to A. We can set:

          Group 1 (5 students): X > Y > Z
          Group 2 (5 students): Y > Z > X
          Group 3 (5 students): Z > X > Y

          Then:
            X vs Y: Group1 (X>Y) and Group3 (Z>X>Y -> X>Y? Wait, note: Group3 has Z>X>Y, so in X vs Y they prefer X. So Group1 and Group3 (10) prefer X to Y. Group2 (5) prefer Y to X -> X wins.
            Y vs Z: Group1 (X>Y>Z -> Y>Z) and Group2 (Y>Z) -> 10 prefer Y to Z. Group3 (Z>Y) -> 5. Y wins.
            Z vs X: Group2 (Y>Z>X -> Z>X) and Group3 (Z>X) -> 10 prefer Z to X. Group1 (X>Z) -> 5. Z wins.

          So we have a cycle: X>Y, Y>Z, Z>X.

     - But note: if the Chair wants Z to win, they can set the agenda so that first we vote between X and Y (X wins) and then between X and Z (Z wins).

     Materials: 
       - Preference cards for each voter (so they remember their ranking and don't change).
       - Voting slips for each pairwise vote.

     Steps:

     a. Assign roles (5 min):
          - Assign the Chair (privately tell them: "Your goal is to have Policy Z chosen. You will decide the order of the votes. You cannot vote, but you run the meeting.")
          - Divide the rest into 3 groups of 5. Hand each group a card with their ranking (so Group1: X>Y>Z, etc.)

     b. The Chair is instructed to set the first pairwise vote. They choose two policies to put to a vote. The winner will face the third.

     c. The Chair announces the first vote (say, between X and Y). The voters vote by raising hands (or by paper if you want secrecy, but hand-raising is faster). The Chair counts and announces the winner.

     d. Then the Chair sets the next vote: the winner of the first vote vs the remaining policy.

     e. The group votes again, and the winner is the overall choice.

     f. Now, we run the process again? But wait, we want them to see that the agenda matters. So we do two rounds with different agendas? But time is short. Instead, after the first decision, reveal the cycle and then let the Chair run a different agenda? 

     Revised plan for Phase 1:

     We want the group to see that the outcome depends on the order. So we do:

          Round 1: Chair (who wants Z) sets the agenda. They will likely choose to pit X vs Y first (so that X wins, then Z vs X and Z wins). Then we record: Z wins.

          Then, without revealing the cycle, we say: "Wait, we are not sure if that was fair. Let's try a different order." We let the group choose a new Chair? Or we keep the same Chair but force a different order? Alternatively, we can have a new Chair with a different agenda? But we want to show that the same group of voters can produce different outcomes.

          Instead, we do:

            Round 1 (with Chair1 who wants Z): agenda X vs Y, then winner vs Z -> outcome Z.
            Round 2: We choose a new Chair who wants X. They set the agenda: first vote Y vs Z -> Y wins (because Group1 and Group2 prefer Y to Z). Then Y vs X -> X wins (because Group1 and Group3 prefer X to Y). So outcome X.

          Round 3: Chair who wants Y? Then set Z vs X first -> Z wins (Group2 and Group3). Then Z vs Y -> Y wins (Group1 and Group2: Group1 has X>Y>Z, so they prefer Y to Z? Actually, Group1: X>Y>Z -> Y>Z. Group2: Y>Z. So together 10 prefer Y to Z. Then Y wins). But wait, we have:

            First: Z vs X -> Z wins (Group2: Y>Z>X -> Z>X; Group3: Z>X; Group1: X>Z -> so 10 for Z, 5 for X -> Z wins).
            Then: Z vs Y -> Group1: Y>Z (5), Group2: Y>Z (5) -> 10 for Y, and Group3: Z>Y (5) -> so Y wins.

          So outcome Y.

          Now the group sees that depending on the agenda, we get Z, X, or Y.

     However, time might be tight. We can do two rounds and then explain the third? But we want them to live it.

     Alternative: After Round 1 (which gives Z), we ask: "Is Z the right winner? Let's check by pairwise comparisons." Then we run:

          X vs Y: X wins (as above)
          Y vs Z: Y wins
          Z vs X: Z wins

          So we have a cycle. Then we explain that the Chair controlled the outcome by choosing the order.

     This might be faster.

     Revised agenda for Phase 1:

       Step 1: (5 min) Assign roles and preferences.
       Step 2: (10 min) Round 1: The Chair (who wants Z) sets the agenda. They run two votes and we get a winner (Z).
       Step 3: (10 min) Now, we test the other pairwise comparisons. We vote on X vs Y, then Y vs Z, then Z vs X. We record the results and see the cycle.
       Step 4: (5 min) We reveal that the Chair wanted Z and set the agenda to get Z. Then we note that if the Chair had wanted X, they could have set the agenda to get X (by having Y vs Z first, then the winner vs X).

     But we don't run the other agendas? We can simulate quickly: "Suppose we had voted first on Y vs Z, then the winner vs X. What would have happened?" and then calculate.

     However, the goal is experiential. So we want them to vote again? But time.

     Compromise: After Round 1, we do the two other pairwise votes to complete the cycle. Then we ask: "What if we had started with Y vs Z? Then the winner would be Y (by majority). Then we would have Y vs X. Who would win? X (because 10 prefer X to Y). So then X would win. Similarly, if we had started with Z vs X, then Z would win and then Z vs Y would give Y."

     Then we note: the Chair, by choosing the order, chose the winner.

     So:

          Minute-by-minute:

          0-5: Assign roles and preferences. (5 min)
          5-10: Chair sets the first vote (say X vs Y). Vote and record. (5 min)
          10-15: Chair sets the second vote (winner vs Z). Vote and record. Outcome: Z. (5 min)
          15-20: Now we check: "Is Z really the best? Let's see how the group feels about each pair." Vote on X vs Y (result: X wins). Then vote on Y vs Z (result: Y wins). Then vote on Z vs X (result: Z wins). (5 min for three votes? Maybe 8 min) -> we see the cycle. (8 min, so 15-23)
          23-25: We note: "Z won because the Chair set the order to have X and Y first, then the winner against Z. But if we had started with Y and Z, then ..." Then we quickly calculate: 
              First: Y vs Z -> Y wins (10 to 5)
              Then: Y vs X -> X wins (10 to 5) -> so X would win.
          Similarly, if we started with Z vs X: 
              First: Z vs X -> Z wins (10 to 5)
              Then: Z vs Y -> Y wins (10 to 5) -> so Y would win.

          (2 min)

          25-30: Discussion: The Chair, who wanted Z, got Z by setting the order. They had agenda power. (5 min)

     Total Phase 1: 30 minutes? (But we had 40 allocated, so we can adjust)

  3. Phase 2: Judgment Aggregation (30 minutes)

     The Doctinal Paradox (or Discursive Dilemma)

     Scenario: A university committee is deciding whether to fund a research project. The project must satisfy two criteria: it must be scientifically innovative (P) and it must have practical applications (Q). The project should be funded (R) if and only if both P and Q hold.

     So: R <=> (P and Q)

     We have 3 voters (or we can have 15, but we break into 3 groups of 5? Or we do it as a whole group? Let's do as a whole group for simplicity, but we need a profile that leads to the paradox.

     The paradox: 
          Individual judgments:
            Voter 1: P true, Q true -> R true.
            Voter 2: P true, Q false -> R false.
            Voter 3: P false, Q true -> R false.

          Then, by majority:
            P: true (voters 1 and 2) -> majority for P.
            Q: true (voters 1 and 3) -> majority for Q.
            R: false (voters 2 and 3) -> majority against R.

          But if we think the group should have R because both P and Q are true, then we have a contradiction.

     How to run:

          We assign each voter (or group) one of the three judgment sets. We have 15 voters, so we can have:

            Group A (5 voters): P true, Q true -> R true.
            Group B (5 voters): P true, Q false -> R false.
            Group C (5 voters): P false, Q true -> R false.

          Then we vote on each proposition separately.

     Steps:

          a. Explain the case: (5 min)
              "The university committee is considering a project. The rules say: the project should be funded (R) only if it is scientifically innovative (P) AND has practical applications (Q). Now, we have three experts (or groups) who have reviewed the project and formed judgments."

          b. Assign the judgments to the groups. (5 min)
              - Group A: They believe P is true, Q is true, and therefore R is true.
              - Group B: They believe P is true, Q is false, and therefore R is false.
              - Group C: They believe P is false, Q is true, and therefore R is false.

          c. Vote on each proposition: (10 min)
              - First, vote on P: "Do you believe the project is scientifically innovative?" (Group A and B say yes -> 10 yes, Group C no -> 5 no -> P passes)
              - Then, vote on Q: "Do you believe the project has practical applications?" (Group A and C say yes -> 10 yes, Group B no -> 5 no -> Q passes)
              - Then, vote on R: "Should the project be funded?" (Group A says yes, Group B and C say no -> 5 yes, 10 no -> R fails)

          d. Discussion: (10 min)
              - The majority says P is true and Q is true, so by the rule R should be true. But the majority says R is false. 
              - Why? Because the majority on the premises does not imply the majority on the conclusion when the voters disagree on the connection.
              - We have two ways to aggregate: 
                  1. Premise-based: we aggregate the premises and then derive R from the aggregated premises -> then R should be true.
                  2. Conclusion-based: we aggregate the conclusion -> R is false.

              - The group has to decide: which method is the right one?

  4. Debrief (15 minutes)

     Connect both activities to Arrow's theorem.

     Arrow's Theorem conditions:
       - Unrestricted Domain: We allowed any preference ordering (we had a cycle, which is allowed) and any judgment set (in the second phase, the groups had different judgments). Without this condition, we might avoid the problem by restricting preferences/judgments.
       - Weak Pareto: If everyone prefers X to Y, then society should prefer X to Y. In our cycle, note that there is no unanimity. But in the judgment phase, if everyone agreed on the premises, then the conclusion would follow. We didn't violate Pareto, but the condition ensures that if there is unanimity it is respected.
       - Independence of Irrelevant Alternatives (IIA): In the first phase, when we voted pairwise, the winner of X vs Y only depended on how people ranked X and Y. That condition was satisfied in our pairwise votes. But note: Arrow's theorem says that if we want a social ordering that satisfies IIA and the other conditions, we cannot avoid a dictatorship. In our first phase, we did not get a full ordering because of the cycle. The agenda setting was a way to break the cycle arbitrarily. The IIA condition is not violated in our pairwise votes, but the problem is that we cannot form a full ordering without cycles or without arbitrary agenda control.
       - Non-dictatorship: We did not have a dictator.

     The impossibility: We cannot have a voting system that always satisfies these conditions and produces a complete and transitive social ordering.

     Debrief Questions:

     For Phase 1:
       - How did it feel when we had a cycle? (frustration: no clear winner)
       - How did the Chair influence the outcome? (agenda control)
       - What condition of Arrow's theorem does the cycle relate to? (The need for transitivity. Without transitivity, we cannot have a clear winner without an arbitrary rule like agenda setting.)
       - What if we had restricted preferences? (If we didn't allow the cycle, we could avoid the problem. But Unrestricted Domain requires we allow any preferences.)

     For Phase 2:
       - How did it feel when the majority on the premises led to a conclusion that the majority rejected? (confusion, contradiction)
       - How is this related to the first phase? (It's a different kind of aggregation, but also shows that majority voting on individual components can lead to inconsistencies.)

     What the activity cannot show:
       - Arrow's theorem is about every possible profile. We only showed one profile (a cycle) and one judgment profile. The theorem says that no matter what voting system you design, there will be some profile that causes a problem (unless you violate one of the conditions). We only showed one problematic profile.

     The pivotal moment:
       - The moment when the group sees the cycle in the first phase and realizes that the Chair's agenda determined the outcome. This is the core of the session.

     What students should walk away with:
       - They should see that even with a group of rational individuals, collective decision-making can lead to paradoxes and that the rules of aggregation (preference or judgment) matter deeply. They should understand that Arrow's theorem shows the inherent difficulty in designing fair voting systems.

     Potential Problems and Solutions:

     Problem 1: The group refuses to cycle.
       - Why? Maybe because the preferences we assigned were not held strictly? Or because we didn't have the right numbers? 
       - Solution: Assign preferences by handing out cards that clearly state the ranking and tell them they must vote according to that card. Also, check the math: with 5 in each group, the cycle is guaranteed. But if the numbers are off, adjust the group sizes to ensure the cycle.

     Problem 2: The Chair games the agenda too blatantly.
       - If the Chair is too obvious (e.g., says "I want Z to win, so I'll set X vs Y first"), then the group might focus on the Chair's dishonesty rather than the structural issue.
       - Solution: Instruct the Chair privately: "Your goal is to have Z chosen. You are the Chair and you control the order of the votes. Try to achieve your goal without explaining your strategy." Then, if the Chair is too blatant, in the debrief, you can say: "Yes, the Chair was strategic, but the point is that the structure allows that. Even if the Chair is honest, the fact that the outcome depends on the order is the problem."

     Problem 3: The judgment phase muddies the waters.
       - The judgment aggregation is a different paradox. If it confuses, you can skip it and spend more time on the first phase and debrief. But if you do run it, in the debrief, emphasize the similarity: both show that majority voting on components (pairwise or premises) can lead to inconsistencies.

     Final note: The entire session is built around the moment in Phase 1 when the pairwise votes are taken and the cycle is revealed. That moment should be made dramatic: "Wait, X beats Y, Y beats Z, but Z beats X? That means we have no clear winner!"

     Materials:
       - For Phase 1: Preference cards for each voter (for their assigned group: Group1: X>Y>Z, etc.), and three policy descriptions.
       - For Phase 2: Judgment cards for each group (with the three propositions and their group's judgments).
       - A way to record votes (whiteboard or flip chart).

     Timing Adjustments: 
       - Phase 1 might take 35 minutes, Phase 2 might take 25 minutes, and debrief 15. Total 75, leaving 5 minutes buffer.

     Let's write the complete runnable activity:

     **Activity: Social Choice Experiential Learning**

     **Total Time:** 90 minutes

     **Materials:**
       - Preference cards for Phase 1 (15 cards: 5 with "Ranking: X > Y > Z", 5 with "Y > Z > X", 5 with "Z > X > Y")
       - Policy descriptions (displayed where everyone can see):
            Policy X: Build a new library.
            Policy Y: Build a new sports center.
            Policy Z: Renovate the student union.
       - Judgment cards for Phase 2 (15 cards: 5 with "P: Yes, Q: Yes, R: Yes", 5 with "P: Yes, Q: No, R: No", 5 with "P: No, Q: Yes, R: No")
       - Whiteboard or flip chart to record votes.

     **Roles:**
       - Facilitator (you)
       - Chair (for Phase 1, one student)
       - Voters (all other students)

     **Phase 1: Preference Aggregation and Agenda Control (40 minutes)**

     1. Introduction to Phase 1 (5 minutes):
          - "We are going to choose one of these three policies: X, Y, Z. We'll use pairwise majority votes. The Chair will decide the order of the votes. The Chair does not vote but runs the meeting."
          - Assign the Chair (privately tell the Chair: "Your goal is to have Policy Z chosen. You will decide the order of the votes. Try to achieve your goal without revealing your strategy to the group.")
          - Assign preferences: Shuffle the preference cards and hand one to each voter (so that 5 get each ranking). Tell them: "This is your true preference. You must vote according to it in every pairwise vote."

     2. Round 1 (10 minutes):
          - The Chair announces the first vote (between two of the policies). (The Chair should choose to vote between X and Y first to set up the win for Z.)
          - Vote by show of hands: "Raise your hand if you prefer X over Y." (Count and record. Expected: 10 for X, 5 for Y -> X wins.) Then: "Raise your hand if you prefer Y over X." (Only the 5 from Group2? But we only need one vote. Alternatively, we can just take the first vote. But to be clear: we are voting between two options, so we just ask for the number for the first option. The majority wins.)
          - The Chair then announces the next vote: the winner (X) vs the remaining policy (Z).
          - Vote: "Raise your hand if you prefer X over Z." (Group1: 5 for X; Group2: 5 for Z? Wait, Group2 has Y>Z>X, so they prefer Z to X. Group3: Z>X -> so 10 for Z, 5 for X. Z wins.)
          - Outcome: Z is chosen.

     3. Revealing the Cycle (20 minutes):
          - "Now, we want to check if Z is the most preferred by the group. Let's see how the group feels about every pair."
          - Vote on X vs Y: "Raise your hand if you prefer X to Y." (Group1 and Group3: 10 for X, Group2: 5 for Y -> X wins.)
          - Vote on Y vs Z: "Raise your hand if you prefer Y to Z." (Group1: 5 for Y; Group2: 5 for Y; Group3: 0 -> 10 for Y? Wait, Group3: Z>X>Y, so they prefer Z to Y -> they will vote for Z? But we are asking for Y vs Z: so who prefers Y to Z? Group1: X>Y>Z -> they prefer Y to Z. Group2: Y>Z -> they prefer Y to Z. Group3: Z>Y -> they prefer Z. So 10 for Y, 5 for Z -> Y wins.)
          - Vote on Z vs X: "Raise your hand if you prefer Z to X." (Group2: Y>Z>X -> they prefer Z to X. Group3: Z>X -> they prefer Z. Group1: X>Z -> they prefer X. So 10 for Z, 5 for X -> Z wins.)
          - Record: 
               X beats Y (10-5)
               Y beats Z (10-5)
               Z beats X (10-5)
          - Point out the cycle: "So X is better than Y, Y is better than Z, but Z is better than X? That means we have a cycle: there is no clear winner."

     4. Agenda Control (5 minutes):
          - "In Round 1, the Chair chose to vote X vs Y first (X won) and then X vs Z (Z won). But what if we had started with Y vs Z?"
          - Quickly simulate: 
               First vote: Y vs Z -> Y wins (10-5) 
               Then: Y vs X -> X wins (10-5) -> so X would have won.
          - "What if we had started with Z vs X?"
               First: Z vs X -> Z wins (10-5)
               Then: Z vs Y -> Y wins (10-5) -> so Y wins.
          - "So the Chair, by setting the order, determined the outcome. Since our Chair wanted Z, they set the order that led to Z."

     **Phase 2: Judgment Aggregation (30 minutes)**

     1. Introduction to Phase 2 (5 minutes):
          - "Now we switch to a different kind of decision. We are a committee deciding whether to fund a research project. The project should be funded (R) if and only if it is scientifically innovative (P) AND has practical applications (Q)."
          - Assign judgment cards: Shuffle and hand out the judgment cards. (5 of each type)

     2. Voting (15 minutes):
          - Vote on P: "The project is scientifically innovative. How many say yes?" (Groups A and B: 10 yes, Group C: 5 no -> P passes.)
          - Vote on Q: "The project has practical applications. How many say yes?" (Groups A and C: 10 yes, Group B: 5 no -> Q passes.)
          - Vote on R: "Should we fund the project? How many say yes?" (Group A: 5 yes, Groups B and C: 10 no -> R fails.)
          - Record: P: yes, Q: yes, R: no.

     3. Discussion (10 minutes):
          - "The majority says the project is innovative and has practical applications. But the majority also says we should not fund it. But the rule says: if both P and Q are true, then R should be true. How can we explain this?"
          - "This is the doctrinal paradox: if we aggregate by premises, we get R should be true. If we aggregate by conclusion, we get R is false. Which method should we use?"

     **Debrief (15 minutes)**

     - Start with the students' experiences: 
          - "In the first activity, how did it feel when we discovered the cycle?" 
          - "In the second, how did it feel when the majority on the premises did not match the majority on the conclusion?"

     - Connect to Arrow's Theorem (focus on the first activity):
          - "The cycle we encountered is an example of a Condorcet cycle, which shows that majority voting can be intransitive. Arrow's theorem tells us that any voting system that respects unrestricted domain (allows any preferences), weak Pareto (if everyone agrees, the society does too), independence of irrelevant alternatives (the vote between two alternatives shouldn't be affected by a third), and non-dictatorship, must sometimes produce cycles or fail to give a clear winner. In our case, we had to break the cycle by using an agenda, which gave power to the Chair."

          - "Which condition would we have to give up to avoid the cycle? We could restrict the preferences (don't allow cycles) but that violates unrestricted domain. We could let the Chair always decide (dictatorship) but that violates non-dictatorship."

     - Connect the two activities:
          - "In the judgment aggregation, we saw that majority voting on the premises and the conclusion can lead to inconsistent outcomes. This is a cousin of Arrow's theorem: it shows that aggregation of judgments can also be problematic."

     - Limitations:
          - "We only saw one profile of preferences and one set of judgments. Arrow's theorem is stronger: it says that for every possible voting system that meets the conditions, there exists at least one profile that causes a cycle. We only saw one such profile."

     - Closing:
          - "What should you walk out seeing? That collective decision-making is fraught with paradoxes. The rules we choose for aggregation (whether for preferences or judgments) can determine the outcome, and no rule is perfect. Arrow's theorem shows the inherent limitations in designing fair voting systems."

     **Contingency Plans:**

     - If the group does not cycle: Double-check the group sizes and the votes. If necessary, adjust the group sizes on the fly to ensure the cycle. But with 5 in each group, it should work.

     - If the Chair is too blatant: In the debrief, note that the structure of the voting system, not the Chair's character, is the issue. The power is in the role.

     - If the judgment phase confuses: Emphasize that it's a separate paradox and focus the debrief on the first phase. You can say: "The judgment phase shows a similar inconsistency in majority rule, but the details are for another day."

     This plan should fit in 90 minutes and create the lived experience you want.
answer: |-
  Below is a complete, experiential 90-minute session plan designed to make Arrow's Impossibility Theorem and the discursive dilemma tangible. The session uses physical voting, hidden agendas, and structured debates to force participants to *live* the paradoxes before labeling them. Materials needed: index cards, pens, a whiteboard, and three colored markers (red/green/blue).

  ---

  ### **Phase 1: Preference Aggregation (50 minutes)**  
  *Goal: Experience cyclical preferences and agenda control.*

  **Setup (5 min)**  
  - Assign roles privately:  
    - **Chair (1 student)**: Secretly handed a card: *"You want Policy BLUE to win. You control vote order. Do NOT reveal your goal."*  
    - **Voters (14 students)**: Divided into three groups. Hand each group a preference card:  
      - *Group A (5): GREEN > RED > BLUE*  
      - *Group B (5): BLUE > GREEN > RED*  
      - *Group C (4): RED > BLUE > GREEN*  
  - Policies displayed on board:  
    - **RED**: "Lower taxes, reduce public services."  
    - **GREEN**: "Raise taxes, expand public services."  
    - **BLUE**: "Keep taxes, reform public services."  

  **Voting Rounds (30 min)**  
  1. **Round 1 (Chair’s Agenda)** (10 min):  
     - Chair announces *first* pairwise vote (e.g., RED vs. GREEN).  
     - Open vote: Voters raise hands. Tally on board. *Expected: GREEN beats RED (9-5: A+B favor GREEN)*.  
     - Chair announces *second* vote (e.g., GREEN vs. BLUE).  
     - Vote: *Expected: BLUE beats GREEN (9-5: B+C favor BLUE)*. **Result: BLUE wins**.  

  2. **Round 2 (Test for Cycle)** (10 min):  
     - Facilitator takes over. Vote on all pairs:  
       - RED vs. BLUE: *RED wins (9-5: A+C favor RED)*.  
       - BLUE vs. GREEN: *BLUE wins (9-5: B+C favor BLUE)*.  
       - GREEN vs. RED: *GREEN wins (9-5: A+B favor GREEN)*.  
     - Show cycle on board: **GREEN > RED, RED > BLUE, BLUE > GREEN**.  

  3. **Reveal Agenda Control** (10 min):  
     - Chair reveals their goal (BLUE) and explains vote order.  
     - Facilitator asks: *"Could the Chair have made RED or GREEN win?"*  
     - Simulate:  
       - If Chair picks BLUE vs. RED first: BLUE loses (RED wins), then RED vs. GREEN: GREEN wins.  
       - If Chair picks GREEN vs. BLUE first: BLUE wins, then BLUE vs. RED: RED wins? Wait—*BLUE beats RED here?* (No: RED > BLUE per cycle. Correct: After BLUE wins, vote BLUE vs. RED → RED wins.)  
       - **Key insight**: Order determines winner.  

  **Contingency for No Cycle**:  
  - If no cycle emerges (e.g., a Condorcet winner exists), reshuffle groups: Swap 2 voters between B and C to create Group B (4): BLUE > GREEN > RED, Group C (5): RED > BLUE > GREEN. Re-run votes.  

  ---

  ### **Phase 2: Judgment Aggregation (30 minutes)**  
  *Goal: Experience inconsistency in premise-based voting.*  

  **Setup (5 min)**  
  - **Case**: "Should we ban a pesticide?"  
    - **P**: The pesticide causes health harm.  
    - **Q**: Banning it is economically feasible.  
    - **R**: Ban the pesticide (R iff P and Q).  
  - Assign judgments via cards (shuffled):  
    - *Type 1 (5 cards): P=Yes, Q=Yes → R=Yes*  
    - *Type 2 (5 cards): P=Yes, Q=No → R=No*  
    - *Type 3 (4 cards): P=No, Q=Yes → R=No*  

  **Voting & Debate (25 min)**  
  1. **Premise-Based Vote** (5 min):  
     - Vote on **P**: Majority Yes (10-4: Types 1+2).  
     - Vote on **Q**: Majority Yes (9-5: Types 1+3).  
     - **Conclusion**: "Since P and Q are true, R should be Yes."  

  2. **Conclusion-Based Vote** (5 min):  
     - Vote on **R**: Majority No (9-5: Types 2+3).  

  3. **Group Argument** (15 min):  
     - Split into three subgroups (by card type). Each argues:  
       - *Group 1*: "Premises demand R=Yes!"  
       - *Group 2*: "But majority rejects R!"  
     - Facilitator pushes: *"Which is our real decision: premises or conclusion?"*  

  **Contingency for Muddying**:  
  - If debate fixates on pesticide facts, refocus: *"Forget reality—based on votes alone, is our decision consistent?"*  

  ---

  ### **Debrief: Mapping to Arrow (10 min)**  
  *Connect frustrations to theorem conditions.*  

  1. **Phase 1 Insights**:  
     - *Cycle*: **Unrestricted Domain** → "We allowed any preferences. If we banned intransitive voters (e.g., Group C), cycles vanish—but should we exclude them?"  
     - *Agenda Control*: **IIA (Independence of Irrelevant Alternatives)** → "Pairwise votes respected IIA, but this forced us into cycles. Fixing cycles requires violating IIA (e.g., by ranking systems)."  
     - *Chair Power*: **Non-Dictatorship** → "We avoided a dictator, but agenda control is covert dictatorship. If we allow chairs to always decide order, we violate neutrality."  

  2. **Phase 2 Insights**:  
     - *Contradiction*: **Collective Rationality** → "Judgments weren’t ‘rational’ at the group level. We could force consistency by only voting on R—but then we ignore expertise on P/Q."  

  3. **Limitations & Generality**:  
     - "Today we saw *one* cyclic profile and *one* judgment set. Arrow’s genius was proving *no system* escapes all profiles. Our frustration? That’s the theorem’s shadow."  

  **Pivotal Moment**: The chair’s reveal in Phase 1. *"You thought BLUE won fairly? The cycle made you vulnerable to manipulation."*  

  **Takeaway for Students**:  
  > "Walking in, you believed majority rule was straightforward. Walking out, you’ve felt how voting rules—not just preferences—determine outcomes. Arrow shows us that every democracy is built on hidden compromises."

  ---

  ### **Predictable Problems & Fixes**:  
  1. **No cycle emerges**:  
     - **Cause**: Voters defect from assigned preferences.  
     - **Fix**: Use index cards with rankings. If defections persist, reshuffle groups mid-activity to ensure cycle math (e.g., 5-5-4 split).  

  2. **Chair games too blatantly**:  
     - **Cause**: Chair says, "I’ll pair RED vs. GREEN first to help BLUE."  
     - **Fix**: Debrief early: *"This isn’t about ‘bad’ chairs—it’s about rules that enable control. Would you notice in real life?"*  

  3. **Judgment phase confuses**:  
     - **Cause**: Students debate pesticide science, not logic.  
     - **Fix**: Use an abstract case (e.g., "Shape X is big AND blue. Is it desirable?"). Restrict arguments to votes only.  

  4. **Time shortfall**:  
     - **Fix**: Skip judgment aggregation debate; jump to debrief. Anchor in Phase 1’s cycle as core example.  

  **Final Note**: The session’s power lies in *physical voting* and *secret agendas*. By making the cycle and contradiction visceral, students grasp why Arrow’s conditions—once abstract symbols—are live wires in real decisions.
