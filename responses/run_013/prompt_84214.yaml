    → 1a (participants worse off) → 2a (conscious choices, stable) → 3a (lack of enforcement) → 4a or 4b? *Assume no self-organization* → 5a (privatization not feasible) → **Leaf 4: Tragedy of the Commons (State Regulation)**  
    *Path: 1a → 2a → 3a → 4b → 5b*  

  - **Antibiotics overuse (cost on others/future)**:  
    → 1b (third parties) → 8b (participants benefit) → 9b (harm outweighs benefits) → **Leaf 9: Negative Externality**  

  - **Two firms ship early (each fears the other won't wait)**:  
