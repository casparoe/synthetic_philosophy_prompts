  - **Evolution of costly ornament (no individual choice)**:  
    → 1a (participants worse off; e.g., species suffers) → 2c (no conscious choices) → 10b (incentives irrelevant) → **Leaf 11: Selection-Theoretic View**  

  - **Credentialing spiral (students acquire more for same job)**:  
    → 1a (participants worse off) → 2b (conscious choices, unstable) → 6b (cannot coordinate) → 7a (external coordinator) → **Leaf 6: Moloch (Singleton Resolvable)**  

  - **Jurisdictional competition (for mobile tax base)**:  
    → *Reader-dependent*:  
    - If reader believes participants (jurisdictions) worse off: 1a → 2a (equilibrium) → 3a (lack of enforcement) → 4a (self-organization possible) → **Leaf 2: Polycentric Commons**  
    - If reader believes third parties harmed and benefits outweigh costs: 1b → 8b → 9a → **Leaf 8: Beneficial Competition**  
    - If reader believes third parties harmed and costs outweigh benefits: 1b → 8b → 9b → **Leaf 9: Negative Externality**
