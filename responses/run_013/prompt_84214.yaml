  ### Diagnostic Decision Tree: Social Traps in Uncoordinated Competition

  **Starting Commitment**: Uncoordinated competition sometimes leaves every participant worse off than some jointly available alternative.  
  **How to Use**: Answer each question for a specific case based on concrete features, not abstract beliefs. Follow the path that matches your answers to reach a leaf position. The tree has five levels and ten leaves, covering the required positions and cases.

  ---

  #### **Question 1: Who primarily bears the cost of the harmful outcome?**  
  *(This separates traps based on who is harmed.)*  
  - **a. The participants themselves (they end up worse off)** → Go to Question 2  
  - **b. Third parties (participants may benefit, but others are harmed)** → Go to Question 8  

  ---

  #### **Question 2 (from 1a): How do the participants make decisions?**  
  *(This distinguishes whether choices are conscious and the trap's stability.)*  
  - **a. Conscious choices, and the harmful outcome is stable (each is best-responding to others' actions)** → Go to Question 3  
  - **b. Conscious choices, but the harmful outcome is unstable (they are locked into escalation and cannot unilaterally stop)** → Go to Question 6  
  - **c. No conscious choices (outcome arises from evolutionary or market forces)** → Go to Question 10  

  ---

  #### **Question 3 (from 2a): Why can't participants cooperate for a better outcome?**  
  *(This identifies barriers to coordination in stable traps.)*  
  - **a. Lack of enforcement (they would cheat even if they agreed)** → Go to Question 4  
  - **b. Lack of trust or mutual fear (they suspect others will cheat)** → Leaf 1: **Security Dilemma**  

  **Leaf 1: Security Dilemma**  
  *The trap is sustained by mutual fear (e.g., arms races). Participants share a common interest in cooperating but cannot due to distrust. Remedy: Reassurance (e.g., communication, transparency) to build trust, not enforcement.*  

  ---

  #### **Question 4 (from 3a): Can participants self-organize a solution?**  
  *(This tests if they can avoid external intervention.)*  
  - **a. Yes, with local rules or institutions** → Leaf 2: **Polycentric Commons**  
  - **b. No, external intervention is needed** → Go to Question 5  

  **Leaf 2: Polycentric Commons**  
  *The trap is a tragedy of the commons where participants can self-govern shared resources (e.g., community-based management). Remedy: Bottom-up institutions, not privatization or state control.*  

  ---

  #### **Question 5 (from 4b): What type of external remedy is feasible?**  
  *(This separates classic tragedy remedies.)*  
  - **a. Assigning property rights or prices** → Leaf 3: **Tragedy of the Commons (Privatization)**  
  - **b. Central rules or regulations** → Leaf 4: **Tragedy of the Commons (State Regulation)**  

  **Leaf 3: Tragedy of the Commons (Privatization)**  
  *Overuse of a shared resource occurs because no one enforces limits. Participants could cooperate but defect without enforcement. Remedy: Privatization to internalize costs.*  

  **Leaf 4: Tragedy of the Commons (State Regulation)**  
  *Same as Leaf 3, but remedy is top-down state regulation (e.g., quotas, laws) to enforce cooperation.*  

  ---

  #### **Question 6 (from 2b): Can participants coordinate to stop escalation?**  
  *(This assesses if ratchets can be reversed.)*  
  - **a. Yes, through mutual agreement or gradual steps** → Leaf 5: **Coordination Problem**  
  - **b. No, escalation is self-reinforcing** → Go to Question 7  

  **Leaf 5: Coordination Problem**  
  *The trap is a ratchet (e.g., credential spirals) where participants are locked in but could stop with coordination. Remedy: Focal points or incremental reciprocation (e.g., mutual agreements).*  

  ---

  #### **Question 7 (from 6b): Is there any escape?**  
  *(This divides views on inevitability.)*  
  - **a. Yes, with a global coordinator** → Leaf 6: **Moloch (Singleton Resolvable)**  
  - **b. No, the trap is permanent** → Leaf 7: **Moloch (Permanent)**  

  **Leaf 6: Moloch (Singleton Resolvable)**  
  *The outcome is nobody's choice (e.g., runaway AI risks), no one can unilaterally stop it, and it requires a global coordinator ("singleton") to resolve. Remedy: Create a single decision-maker.*  

  **Leaf 7: Moloch (Permanent)**  
  *Same as Leaf 6, but the trap is inherent and inescapable (e.g., irreversible ecological collapse). No remedy exists; diagnosis is the only honest position.*  

  ---

  #### **Question 8 (from 1b): Do participants gain long-term?**  
  *(This checks if harm rebounds on participants.)*  
  - **a. Yes, harm to third parties eventually worsens their situation** → Go to Question 2 (treat as if participants bear cost)  
  - **b. No, participants always benefit at others' expense** → Go to Question 9  

  ---

  #### **Question 9 (from 8b): Does competition create net societal benefits?**  
  *(This separates harmful externalities from beneficial discovery.)*  
  - **a. Yes, efficiency gains outweigh harm** → Leaf 8: **Beneficial Competition**  
  - **b. No, harm outweighs benefits** → Leaf 9: **Negative Externality**  

  **Leaf 8: Beneficial Competition**  
  *The "trap" is not a trap; competition is a discovery procedure that rewards efficiency and sorts preferences (e.g., jurisdictional competition). The "race to the bottom" is beneficial innovation.*  

  **Leaf 9: Negative Externality**  
  *Participants benefit but impose costs on third parties (e.g., antibiotic overuse). Harm is a net societal loss. Remedy: Internalize costs via taxes, liability, or regulation.*  

  ---

  #### **Question 10 (from 2c): Can incentives change the outcome?**  
  *(This tests if selection traps respond to individual motivations.)*  
  - **a. Yes, by altering payoffs or information** → Leaf 10: **Incentive Design**  
  - **b. No, only environment changes work** → Leaf 11: **Selection-Theoretic View**  

  **Leaf 10: Incentive Design**  
  *The trap results from selection (e.g., costly ornaments in evolution), but can be redirected by changing individual incentives (e.g., taxes, subsidies).*  

  **Leaf 11: Selection-Theoretic View**  
  *Same as Leaf 10, but traps are features of evolutionary or market selection. No incentive change helps; only altering the selection environment (e.g., competition rules) works.*  

  ---

  ### Summary of Leaves
  1. **Security Dilemma** (from 3b)  
  2. **Polycentric Commons** (from 4a)  
  3. **Tragedy of the Commons (Privatization)** (from 5a)  
  4. **Tragedy of the Commons (State Regulation)** (from 5b)  
  5. **Coordination Problem** (from 6a)  
  6. **Moloch (Singleton Resolvable)** (from 7a)  
  7. **Moloch (Permanent)** (from 7b)  
  8. **Beneficial Competition** (from 9a)  
  9. **Negative Externality** (from 9b)  
  10. **Incentive Design** (from 10a)  
  11. **Selection-Theoretic View** (from 10b)  

  *Notes*:  
  - 11 leaves total; designed for 10–14.  
  - "Empirical claim that races to the bottom are rare" is not a leaf because it requires general evidence, not case-specific answers. It is captured by Leaf 8 (Beneficial Competition), which implies such traps are overstated.  
  - All distinctions used except "proxy decay" (dropped to avoid complexity; proxy decay is often implied in Leaf 1 or Leaf 8).  
  - Unnamed positions: None; all answer combinations map to a named leaf.  

  ---

  ### Example Cases and Paths  
