prompt: |-
  I've been trying to work out what I actually think about moral trade — the whole business of swapping moral actions with someone who cares about different things than you do — and my gut keeps giving me answers I can't square with each other. I'm hoping you can tell me what principle, if any, is generating them.

  Take the role of a philosopher who works on this stuff (consequentialism, moral uncertainty, the ethics of cooperation and exchange) and think carefully before answering. It might help to brainstorm the candidate principles first, lay them out, and then go through my cases one by one rather than pattern-matching to the first tidy theory.

  Here's what I think:

  - My friend cares mostly about animal welfare, I care mostly about global poverty. We agree that I'll give $500 to an animal charity and she'll give $500 to an anti-malaria charity. Both of us think the other's cause matters, just less than our own. This seems completly fine to me, maybe even good.

  - Same friend, same deal, except the payment is that I have to post publicly that animal suffering is the most urgent problem facing humanity, and she has to post that global poverty is. I dont believe that about her cause — I think it's a real problem but nowhere near the top — and she doesn't believe it about mine. This feels bad to me in a way the money version doesn't. It's not the deception (nobody's fooled), it's something about having to say it.

  - On a neighborhood committee, I trade my vote on her parking proposal for her vote on my bike lane. Fine. Everyone does this, and honestly it's how the thing functions.

  - At a general election, someone offers me $200 to vote for a candidate I was already going to vote for. I think that's wrong, and I'd think it was wrong even though my vote is unchanged and no one is harmed. This one really bugs me, because by any straightforward accounting the trade costs nothing and buys $200.

  - Someone offers me $2000 to go vegetarian for five years. Weirdly, this seems fine to me, or at least not wrong. Which sits oddly next to the vote thing — both are just cash for behavior.

  - A company does something damaging and then buys a bunch of offsets so the books balance. That feels worse to me than the two friends' swap, even when the numbers come out the same. Something about it being a company, or about the harm being the very thing it's paying to keep doing.

  - I'm asked to help out a campaign for a policy I think is actively bad, in exchange for their help on a policy I think is very good, and I judge the expected total to come out positive on my own values. I'd probably do it, but I'd feel dirty.

  - Somebody wants to trade me: they'll make a large donation to my cause if I lie to my partner about something small. I won't do this. It's not the size of the lie, it's that I'd be doing a wrong thing to buy a right thing.

  - Last one: I agree to eat meat at a dinner I could have skipped (I'm vegetarian and think eating meat is mildly wrong) in exchange for a big donation to famine relief. I'd do this in a heartbeat and feel fine about it. Which seems to conflict with the lie case, since both are do-a-small-wrong-to-buy-a-big-good.

  My own guess at a principle was: a trade is OK if both sides understand it, nobody's made worse off, and the expected moral value goes up by my lights. But that obviously doesn't get the vote case or the public-statement case or the company case, and it seems to allow the lie.

  So: what principle actually fits these, or which verdicts do I have to give up? State it as precisely as you can, tell me which of my cases is doing the work for each part of it, and then use it to say what I should think about a few things I haven't listed — say, a trade where the action I'm buying from the other person is one I think they have no right to do at all, and a trade where I'm buying someone's omission rather than their action. And be honest about which of my verdicts your principle can't save.
reasoning: |-
  Okay, let me try to work through this user's moral trade dilemma. They've presented several cases where their gut reactions conflict, and they want a principle that explains all of them. 

  First, I notice the user is clearly intellectually honest - they're noticing inconsistencies in their own intuitions and seeking rigor. That's admirable. They're also providing concrete examples, which helps ground the discussion. The challenge is to find a unifying framework that explains most of their judgments without being ad hoc.

  Looking at their cases, a few patterns emerge. The charitable donation swap feels fine, but the public statement version doesn't. Vote trading in committees is acceptable, but selling votes in elections isn't. Taking money to go vegetarian seems okay, but lying to a partner for charity doesn't. 

  Hmm... the difference between actions and expressions stands out. In the public statement case, they're being asked to affirm something they don't believe. That feels like a violation of integrity. Similarly, selling a vote treats a civic duty as a commodity. 

  The vegetarian-for-cash case is interesting - here they're changing behavior for money, not compromising beliefs. The harm offset case feels wrong because it's transactional harm continuation, different from the friends' mutual benefit swap. 

  For the lie vs meat-eating conflict - lying breaks a fundamental relational trust, while dietary choices are more personal. The meat case also involves preventing greater harm (famine relief). 

  I think we need a principle combining: 
  - Non-corruption of expressive/civic acts 
  - No instrumental use of core wrongs 
  - Contextual role responsibilities 
  - Plus the baseline utilitarian benefit 

  The vote-selling prohibition suggests democratic participation has intrinsic value. The company offset case shows aggregation matters - individual trades may be fine but systemic harm-perpetuation isn't. 

  The user might need to adjust their view on the policy-trade feeling "dirty" - if it's net positive, the discomfort may be emotional, not moral. But the lie case reveals a deontological boundary even they won't cross. 

  For new cases: trading for an action I deem illegitimate would violate the "no core wrongs" principle. Buying omissions might be permissible if it prevents harm without compromising integrity. 

  The toughest fit is why meat-eating for charity feels okay but lying doesn't. I'll need to argue that relational duties have special weight, while dietary rules are more convention-based in their framework.
answer: |-
  Your intuitions reveal a nuanced moral landscape where *how* a trade is conducted matters as much as the outcome. After analyzing your cases, a three-part principle emerges that explains most of your judgments:

  **The Principle of Non-Corrupting Exchange**  
  A moral trade is permissible if and only if:  
  1. **Non-Exploitation**: Both parties voluntarily consent with transparent understanding of the trade’s nature; *and*  
  2. **Value-Neutrality**: The traded actions do not inherently corrupt intrinsically valuable practices (e.g., democratic integrity, truth-telling, fiduciary duties); *and*  
  3. **Role-Compatibility**: The trade does not violate role-based obligations specific to the agent(s) involved.  

  If any condition fails, the trade is impermissible—even if it increases expected moral value by your lights.

  ---

  ### How This Explains Your Cases
  1. **💰 Charity swap**:  
     - ✅ *Fine*: Passes all tests. No exploitation, no corruption (money is value-neutral), no role conflicts.  

  2. **📢 False public statement**:  
     - ❌ *Bad*: Fails **Value-Neutrality**. Compelled false speech corrupts truth-seeking—even if no one is deceived, it treats affirmation as a commodity.  

  3. **🚲 Committee vote trade**:  
     - ✅ *Fine*: Passes all tests. Logrolling in small groups is a recognized political mechanism (no *inherent* corruption of democracy at this scale).  

  4. **🗳️ Election vote sale**:  
     - ❌ *Wrong*: Fails **Value-Neutrality**. Voting is a constitutive practice of democracy; monetizing it corrupts its civic purpose. Harm occurs *to the practice itself*, irrespective of outcome.  

  5. **🌱 Cash for vegetarianism**:  
     - ✅ *Fine*: Passes all tests. Dietary choices lack inherent symbolic/civic weight; no corruption occurs.  

  6. **🏭 Corporate harm offsets**:  
     - ❌ *Worse than charity swap*: Fails **Role-Compatibility**. Corporations have fiduciary/legal duties to avoid harm; offsetting treats harm as a fungible cost, violating their role obligation to *not externalize damage*.  

  7. 🤝 **Campaign trade for net-positive policy**:  
     - ⚠️ *Feels dirty but permissible*: Barely passes **Value-Neutrality** (lobbying is inherently transactional) but risks **Role-Compatibility** failure if you hold a public trust role. Your discomfort stems from endorsing bad policy, which *feels* like complicity despite net gains.  

  8. **🤥 Lie to partner for charity**:  
     - ❌ *Impermissible*: Fails **Value-Neutrality**. Lying corrupts the foundational trust of intimate relationships—it’s intrinsically wrong, not merely instrumentally bad.  

  9. **🍖 Eat meat for famine relief**:  
     - ✅ *Permissible*: Passes all tests. Eating meat lacks the *inherent moral corruption* of lying. Your vegetarianism is preference-based (mildly wrong ≠ intrinsically corrupting act).  

  ---

  ### Where Your Initial Principle Fails
  - **"Expected moral value goes up"** allows vote-selling and lying—but you reject these.  
  - **"Nobody worse off"** ignores corruption of practices (e.g., democracy degrades if votes are for sale, even if no voter is "harmed").  
  - **"Both understand"** is necessary but insufficient (e.g., the public statement case).  

  ---

  ### Applying the Principle to New Cases
  1. **Trading for an action you deem illegitimate**:  
     - *Example*: "I'll donate to refugees if you burn a Quran (which I consider sacrilegious)."  
     - ❌ **Impermissible**: Fails **Value-Neutrality**. Desecration corrupts respect for sacred objects—a core value in many moral frameworks.  

  2. **Buying someone’s omission**:  
     - *Example*: Paying a company not to clear-cut a forest.  
     - ✅ **Permissible** if:  
       - The company has no prior right to clear-cut (no **Role-Compatibility** failure);  
       - Payment doesn’t corrupt conservation (e.g., by making extortion routine).  

  ---

  ### Verdicts You Might Need to Reconsider
  - **Policy trade feeling "dirty"**: Your principle permits it, but discomfort persists because *advocating for bad policy* may *feel* like a **Role-Compatibility** failure (if you see yourself as a truth-teller). The principle says this is emotional, not moral—unless you occupy a trusted office.  
  - **Vote-selling intuition**: You might need to accept that *some* harmless trades (like voting for cash) are wrong because they corrode democratic institutions.  

  ### Key Insight
  Your deepest intuition isn’t utilitarian—it’s **practice-preserving**. Trades become wrong when they instrumentalize acts that derive meaning from being *freely given* (votes, truths, vows) or when they enable role violations. Money amplifies this: it can commodify *only* what is already fungible. When it touches the sacred, the civic, or the intimate, corruption follows.
