  The apparent contradiction isn't real - it reflects different perspectives. Calling money "worthless" describes its materiality while treating its value as "real" acknowledges its social reality. The system would collapse if everyone actually believed the first description literally.

  Interesting how this reveals what monetary practice rules out: commodity theories (like gold standards) are incompatible, while chartalist theories fit perfectly. But the practice remains philosophically underdetermined - it works with either state authority or social convention theories.

