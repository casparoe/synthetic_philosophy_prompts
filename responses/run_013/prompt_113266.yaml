answer: |-
  The practice of issuing and managing unbacked fiat money presupposes a complex, interdependent theory of value that reconciles Berkeley's "ticket" view with institutional anchors. Here's a reconstruction of its implicit commitments and tensions:

  ### Core Presuppositions
  1. **Money as a Social Institution**:  
     The practice fundamentally presupposes that money's value is a *social convention*, sustained by collective belief in its acceptance. This aligns with Berkeley’s "ticket" view: money is a sign whose value is purely relational, derived from its role in facilitating exchange.

  2. **The Necessity of an Anchor**:  
     However, the practice *also* presupposes an institutional anchor—specifically, **state power**. This is evident in:
     - **Taxation**: Legal tender laws mandate acceptance for tax payments, creating baseline demand.
     - **Monetary Policy Credibility**: Central banks manage scarcity through interest rates and bond operations, relying on public trust in their institutional legitimacy.
     - **Legal Tender Status**: The state enforces money’s acceptability in debt settlements.

     Without this anchor, the "pure sign" system would collapse into infinite regress ("I accept it because others accept it because others accept it...").

  3. **Wealth as Real, Money as Nominal**:  
     The practice commits to a distinction:  
     - *Wealth* resides in goods, services, and productive capacity (echoing Berkeley).  
     - *Money* is a nominal claim on that wealth, not wealth itself.  

  ### Resolving the Apparent Inconsistency
  The dual description ("worthless token" vs. "fragile real value") is **not a contradiction** but a **division of explanatory labor**:  
  - **"Token" description**: Explains money’s *ontological status* (it has no intrinsic value).  
  - **"Fragile value" description**: Explains its *functional role* in a system of expectations. Money’s value is "real" *socially*—it emerges from collective behavior and can vanish if trust erodes (e.g., hyperinflation).  

  This mirrors the dual nature of language: words are arbitrary signs (ontologically weightless), yet their meanings are "real" in their social effects.  

  ### What the Practice Rules Out (and Accommodates)
  - **Ruled Out**:  
    - **Commodity Theories**: Money cannot derive value from its own material (e.g., gold). Unbacked money explicitly rejects this.  
    - **Pure State Theory (without social backing)**: If value derived *solely* from state decree (e.g., "fiat" in the literal sense), hyperinflation would be inexplicable. The state cannot arbitrarily assign value without social consent.  

  - **Accommodated**:  
    - **Chartalism**: Money as a creature of the state, anchored by tax obligations.  
    - **Credit Theories**: Money as a social credit/debit relationship.  
    - **Institutional Trust Theories**: Value anchored in central bank credibility.  

  ### Philosophical Underdetermination
  The practice is compatible with multiple theories at key points:  
  1. **Source of Scarcity**: Is money’s value from state-imposed scarcity (via central banks) or emergent social consensus? Both fit.  
  2. **Nature of the Anchor**: Is the tax anchor a *sufficient* cause of value, or merely a stabilizer for social convention? Practice doesn’t specify.  
  3. **Value as "Real"**: Does "fragile value" imply money has *sui generis* social reality, or is it purely derivative? Practice uses both frames.  

  ### If Presuppositions Changed: Practical Consequences
  - **Commodity Theory Revival (e.g., gold standard)**:  
    - Central banks could no longer create money at will; issuance would require asset backing.  
    - Monetary policy would be constrained by commodity reserves, eliminating discretionary stimulus.  
    - Deflationary spirals would become more likely.  

  - **Pure State Theory (value by decree)**:  
    - Money printing could occur without regard to inflation (as in failed fiat experiments like Zimbabwe).  
    - Central banks would lose independence; money would become a political tool.  
    - Currency credibility would depend entirely on state stability, not economic fundamentals.  

  - **Berkeley’s Pure Sign (no anchor)**:  
    - The system would be vulnerable to self-fulfilling panics (e.g., bank runs without deposit insurance).  
    - No mechanism to enforce acceptance beyond social habit.  

  ### Conclusion
  Modern monetary practice presupposes a **hybrid theory**: money is a social sign (Berkeley) *stabilized* by state power (chartalism). Its apparent inconsistency reflects a pragmatic duality: money is ontologically weightless yet functionally essential. The system collapses without both elements—social convention *and* institutional anchors. It quietly rules out commodity theories but accommodates any framework accepting money as a credit/debit relation backed by political authority. The practice is philosophically underdetermined only regarding the *primacy* of the anchor vs. convention; operationally, both are indispensable. If the state anchor vanished, money would revert to barter or crypto-like volatility; if social convention dissolved, even state edicts could not salvage its value.
