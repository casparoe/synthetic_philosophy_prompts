prompt: |-
  So I'm a novelist, about a third of the way into a book, and I've written myself into a problem I actually want to keep. Premise: a woman with a fast-moving neurodegenerative disease enrolls in a trial where her biological neurons get swaped out for silicon ones, a couple percent a week, over roughly a year. She's awake and lucid the whole time. It's not the "scan and copy" version — it's continuous, one-in-one-out replacement, and the whole story is told in her close third person from start to finish.

  The thing the book is about (or one of the things) is: when does she stop being her? I don't mean mystically. I mean it should control boring craft decisions — when the narration can still call her by her first name, when other characters are justified in grieving her before she's dead, when a promise she made in chapter two should still bind her, when I can have her look at a photo of herself from last spring and feel recognition vs. horror. Right now I'm doing this on vibes, it's inconsistent, and my editor keeps asking me what the rules are. She wants a one-page "continuity doc" she can check chapters against, because we're on a deadline and she signs off on every draft.

  So what I want from you: turn the philosophy of personal identity into an actual procedure I can run at each weekly checkpoint in her year — the questions to ask in order, what counts as a good enough answer at each step, where the procedure flatly says "not her anymore" or "still her," and where it has to stop and hand me a judgement call because it's a values question, not a fact question. Assume I know roughly zero of the technical literature and can't look anything up, so no reading list, no citations, no "see so-and-so's paper on this." Just the machinery.

  Here's the wrinkle that makes it hard, and it's the reason I need a real procedure and not a slogan: in my version the chips aren't a clean one-for-one. They network with an offsite scaffold, so mid-process part of "her" cognition is running on a server in another state. And about ten percent of her original tissue is kept in a cold backup that the company says they *could* reboot if the trial goes wrong — which means somewhere around month nine there are arguably two of her. She can also pause the process for a few weeks, and she does, twice. I don't want a procedure that quietly assumes none of that is happening.

  Then run the procedure on three specific checkpoints and tell me honestly where it gives me an answer I won't like:

  1. Week 6, ~12% replaced, she passes every test they give her and remembers her daughters birthday.
  2. Week 30, ~60% replaced, she's sharper than she's been in years but her taste in music has flipped and she's forgotten how her marriage ended.
  3. Week 48, ~95% replaced, the cold backup is still on ice, and she's asking the company to reboot it so "she" can talk to her own daughter one more time.

  And tell me what the procedure can't do — the places it'll misfire, and where I should just make an authorial choice and own it.
reasoning: |-
  Okay, the user is a novelist dealing with a fascinating sci-fi premise about a woman undergoing gradual neuron replacement. They're struggling with consistent narrative decisions around identity and need a practical procedure to determine when "she" stops being "her." 

  The core challenge is translating abstract philosophy into usable writing rules. The user explicitly rejects mystical interpretations - they want functional criteria for naming, emotional responses, and moral obligations in narration. The editor's demand for a "continuity doc" suggests this is urgent production issue, not just theoretical.

  Three key complications make standard thought experiments inadequate: 
  The distributed cognition (offsite servers) breaks locality assumptions. 
  The cold backup creates potential duplication. 
  Pausing the process introduces temporal discontinuities. 

  For week 6 (~12%): This should clearly pass as "her" by most criteria. Memory tests and emotional continuity are intact. The procedure would flag no issues here - safe to use her name normally.

  Week 30 (~60%): Here's where it gets messy. Memory gaps about major life events (marriage ending) suggest narrative disruption, while improved cognition shows non-identity changes. The taste reversal could be either neurological or personal growth. The procedure would force explicit decisions: is forgotten trauma memory loss or psychological avoidance? Must choose consciously.

  Week 48 (~95%): Nightmare scenario. The reboot request creates ontological tension - which entity gets claim to identity? The procedure would declare the primary body not-her if continuity fails, but the backup complicates everything. Key question: does she see the backup as her successor or her replacement? This needs authorial fiat.

  Critical limitations noted: 
  The procedure can't handle values conflicts (e.g., when promises should bind). 
  Distributed cognition breaks spatial assumptions. 
  Cold backups make identity non-unique by design. 
  Pauses require arbitrary continuity judgments.

  Recommended that week 30 be the pivot point - force concrete choices about what memories define her. Week 48 should lean into the horror of the reboot request showing identity fragmentation. The cold backup isn't a cheat but a thematic bomb to detonate.
answer: |-
  Here's a procedural checklist for "Identity Continuity Assessment" tailored to your novel's specifics. It's designed as a series of gates – if the subject fails a gate, the narration must explicitly justify why they're still considered "her" (or acknowledge they're not). Gates marked with **(\*)** require authorial judgment.

  **Core Principles:**
  1.  **Continuity Over Substance:** Focus on *connection* to the past self, not the *amount* of biology replaced or the *nature* of changes.
  2.  **Functional Narrative Identity:** What matters for the story is "Is this entity the legitimate heir to the original person's narrative, relationships, and obligations?"
  3.  **Process Acknowledged:** The procedure *knows* about the scaffold, cold backup, and pauses.

  **The Identity Continuity Assessment Procedure (Per Checkpoint):**

  1.  **Gate 0: Baseline Check (Pre-Procedure)**
      *   *Question:* Is the entity physically continuous with the original biological body? (Even partially modified).
      *   *Pass/Fail:* PASS only if YES. (This gates out the cold backup *until* reboot. The primary body always starts here).
      *   *Narrative Implication:* Allows continued use of name ("Sarah"), assumption of identity, binding promises, etc. *If FAIL (e.g., cold backup pre-reboot):* Entity is not "her" (yet/anymore); it's "the backup," "the potential," "Sarah-prime's remnant."

  2.  **Gate 1: Conscious Continuity (\*)**
      *   *Question:* Does the entity *experience itself* as a continuous consciousness from the original person? (Does *it* feel like it woke up this morning as the same "I" who started the trial?).
      *   *Pass/Fail:* **JUDGMENT CALL.** Consider: Reported sense of self, lack of disorientation suggesting a "break," seamless integration of new experiences/memories. Pauses complicate this – was consciousness *interrupted* or merely *suspended*? Author must decide the threshold for disruption.
      *   *Narrative Implication:* PASS = Strong justification for internal POV ("she felt..."), self-recognition ("her reflection"). FAIL = POV becomes more external/observational; self-recognition may falter; existential horror increases.

  3.  **Gate 2: Core Narrative Memory Access (\*)**
      *   *Question:* Can the entity reliably access and *subjectively identify with* key autobiographical memories defining the original person's life story and relationships? (Not just facts, but *ownership*: "That happened *to me*").
      *   *Pass/Fail:* **JUDGMENT CALL.** Focus on pivotal, identity-forming memories (e.g., daughter's birth, marriage vows, major traumas/triumphs, deep personal commitments). Forgetting *how* the marriage ended *might* pass if she remembers *being married, loving the partner, and that it ended painfully*, and *feels* that pain as her own. Forgetting *the daughter existed* would likely be a FAIL. Changes like music taste are irrelevant here unless tied to a core identity memory.
      *   *Narrative Implication:* PASS = Can emotionally engage with past promises, photos, relationships. FAIL = Relationships feel alien; promises seem like burdens from a stranger; photos evoke detachment or horror. Grieving by others becomes more justifiable.

  4.  **Gate 3: Scaffold Integration (No Leakage)**
      *   *Question:* Is the offsite scaffold functioning purely as an *extension* of the on-body neural processing, with seamless integration and no detectable independent processing or external control influencing core identity/memory functions? Is the entity *unaware* of the scaffold's location under normal operation?
      *   *Pass/Fail:* PASS only if YES. (This is a technical safeguard against distributed consciousness becoming fragmented identity).
      *   *Narrative Implication:* PASS = Scaffold is "invisible," just part of "her" brain. FAIL = Raises questions of external influence, loss of agency, or fragmentation ("Where is *me*?"). Could force a FAIL at Gate 1 or 2 retroactively.

  5.  **Gate 4: Values & Agency Consistency (\*)**
      *   *Question:* Do the entity's core values, decision-making priorities, and sense of moral agency *feel like a continuous evolution* from the original person's, even if specific preferences change? (Does she *own* her choices as hers?).
      *   *Pass/Fail:* **JUDGMENT CALL.** Consider: Motivation for actions (especially towards loved ones), reaction to moral dilemmas, core beliefs. A calculated, detached decision where the original would have been passionate *might* indicate a FAIL. A *changed* music taste is likely irrelevant; a sudden abandonment of a lifelong core value (e.g., honesty, protecting family) is highly suspect.
      *   *Narrative Implication:* PASS = Actions feel authentic to the character arc. FAIL = Actions feel alien, robotic, or inexplicably out-of-character. Binding promises become highly questionable.

  **Overall Status Determination (After Gates 0-4):**
  *   **PASS ALL GATES:** Unambiguously "Her." Name, identity, obligations fully intact.
  *   **FAIL Gate 0 ONLY:** Not "Her" (Applies *only* to the cold backup pre-reboot).
  *   **FAIL ANY OTHER GATE:** **Narrative Threshold Crossed.** The entity is likely *not* the original person in a meaningful narrative sense.
      *   *Narrative Action Required:* The narration must explicitly grapple with the discontinuity. Stop using her name unquestioningly. Show other characters questioning her identity/her questioning herself. Acknowledge grief. Treat promises as potentially void or renegotiable. Photos evoke dissonance. The entity might be "the patient," "the successor," "the construct," or "Sarah-MkII." *This is where the story lives.*

  **Running the Procedure on Your Checkpoints:**

  1.  **Week 6 (~12% replaced):**
      *   Gate 0: PASS (Physical continuity).
      *   Gate 1 (\*): LIKELY PASS (Early stage, minimal disruption reported).
      *   Gate 2 (\*): PASS (Remembers key identity event - daughter's birthday).
      *   Gate 3: PASS (Low replacement, scaffold likely well-integrated).
      *   Gate 4 (\*): PASS (No indication of value/agency shift).
      *   **VERDICT:** **Unambiguously HER.** Your editor should have no complaints here. Recognition of photos, binding promises, use of name – all justified. Grieving by others would seem premature/dramatic.

  2.  **Week 30 (~60% replaced, pause likely involved):**
      *   Gate 0: PASS (Physical continuity).
      *   Gate 1 (\*): **MAJOR JUDGMENT CALL / LIKELY FAIL.** Pauses introduce discontinuity risk. "Sharper" cognition suggests altered subjective experience. Does she *feel* continuous? Author likely needs to lean towards NO for thematic impact. (*Answer you might not like*).
      *   Gate 2 (\*): **JUDGMENT CALL / LIKELY FAIL.** Forgetting *how* the marriage ended is a huge red flag for autobiographical memory. It suggests a gap in her *narrative self*, not just a detail. Does she remember *that* it ended painfully and *feel* that pain as hers? If not, FAIL. Taste change is irrelevant. (*Answer you might not like*).
      *   Gate 3: ASSUME PASS (No indication of scaffold issues).
      *   Gate 4 (\*): **JUDGMENT CALL.** "Sharper" could imply more detached/calculating agency. Need to show core values are still intact *and feel continuous*. If not, FAIL.
      *   **VERDICT:** **LIKELY NARRATIVE THRESHOLD CROSSED (FAIL).** This is the crux. The procedure flags major issues with Conscious Continuity and Core Narrative Memory. *This is where "vibes" fail you.* You need to decide:
          *   Does she *feel* like the same continuous "I"? (Probably not, for drama).
          *   Does she *own* the forgotten memory gap? (Does she feel grief/horror at the gap, or just note it coldly?).
          *   **Narrative Action:** This is where the name starts feeling wrong in narration without justification. Her husband looks at her with confusion/grief. She looks at a wedding photo and feels nothing, or a terrifying void. Promises feel like chains from another life. Her daughter seems distant. The editor's "rules" demand this shift start *here* if Gates 1 or 2 fail.

  3.  **Week 48 (~95% replaced, cold backup request):**
      *   Gate 0: PASS (Physical continuity - barely).
      *   Gate 1 (\*): **LIKELY FAIL.** Extreme replacement + previous discontinuity makes continuous consciousness highly improbable. Her request to reboot the backup *admits* discontinuity – she sees the backup as more "her" than her current self.
      *   Gate 2 (\*): **LIKELY FAIL.** What core memories remain? Access is probably fragmented or detached.
      *   Gate 3: **RISK OF FAIL.** High reliance on scaffold. Is it *truly* seamless, or is there a detectable lag/foreignness? Is "she" partially running in another state?
      *   Gate 4 (\*): **LIKELY FAIL.** The reboot request *is* the core value/agency shift. Preserving the *past* self (via backup) supersedes the *current* self's continuity. This prioritizes a *different* entity's existence over her own.
      *   **VERDICT:** **NARRATIVE THRESHOLD CROSSED (FAIL).** The entity in the primary body is almost certainly *not* the original Sarah. The cold backup (Gate 0 FAIL) is *also* not "her" *yet*; it's potential raw material.
      *   **The Wrinkle:** The reboot request is profound. The *primary entity acknowledges its own discontinuity* and seeks connection *through the backup*. This doesn't make the primary entity "her"; it highlights the *loss*. It also creates a potential future conflict: *If* rebooted, the cold backup (after assessment) might pass Gate 0 and potentially other gates (if continuity of consciousness *from shutdown* is asserted and memories are intact). Suddenly, there are *two* claimants to the narrative identity, or neither is fully "her." **This is the thematic gold.**

  **What the Procedure CAN'T Do (Where You Must Own It):**

  1.  **Define "Continuous Consciousness" (Gate 1):** Is it an unbroken stream? A chain of overlapping states? The procedure forces you to *declare* what it feels like for *your character* at each stage. There's no scientific answer.
  2.  **Judge "Core" Memories/Values (Gates 2 & 4):** What memories are truly identity-defining? What values are core vs. superficial? You *must* decide what's essential to Sarah's narrative identity. This is character work, not philosophy.
  3.  **Resolve the Duplication Problem:** The procedure assesses *one entity at a time*. If the cold backup is rebooted, run the procedure *separately* on it. The result might be two entities with claims (or neither). The *moral* and *narrative* conflict between them (Who gets the life? The daughter? The name?) is where your story climaxes. The procedure identifies the problem but can't solve it.
  4.  **Handle "Pauses":** Does a pause create a break in consciousness? Is it like deep sleep or like being turned off? You *must* define the subjective impact for Sarah each time.
  5.  **Dictate Emotional Responses:** It tells you *when* recognition *should* feel wrong or horror *should* arise based on the gates, but not *exactly how* Sarah feels. That's your prose.
  6.  **Solve the Scaffold's Nature:** If the scaffold *is* doing independent processing influencing her, how much is too much? The procedure flags it (Gate 3), but you define the threshold and its effects.

  **Final Authorial Advice:**

  *   **Week 30 is Your Pivot:** Use the procedure to force hard choices here. Make the memory loss *meaningful* to her identity. Show the discontinuity in her internal experience. This is where the novel's core question becomes visceral.
  *   **The Cold Backup is a Chekhov's Gun:** Its existence undermines uniqueness. Its reboot request in Week 48 is the primary entity's confession of discontinuity. Don't shy away from the messy implications.
  *   **Embrace the Judgment Calls:** The procedure highlights *where* you need to make authorial decisions about continuity, core identity, and values. Make them boldly and consistently. Your "vibes" now have defined pressure points.
  *   **The Horror is in the Gap:** The most powerful moments come when the procedure says "FAIL" but the character (or loved ones) desperately *want* continuity to hold. Show that tension.

  This procedure provides the "rules" your editor wants, rooted in identity philosophy but operationalized for your narrative. It forces consistency precisely where the interesting problems lie – the judgment calls (\*) – and gives you a framework to make those calls deliberately. Good luck with the rest of the book! It's a killer premise.
