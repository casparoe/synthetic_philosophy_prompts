answer: |-
  ### Exam Question: Supertasks and State Determination (25 marks)

  **Instructions:** Answer all parts below in a continuous essay. You have 60 minutes. Closed book. Focus on rigorous reasoning.  

  **Lamp Specifications:**  
  - **Lamp A (Square Lamp):**  
    - Two states: ON or OFF.  
    - Stage \(n\) occurs at time \(t_n = 1 - 2^{-n}\) for \(n = 1, 2, 3, \ldots\)  
    - At stage \(n\), set the lamp ON **if and only if** \(n\) is a perfect square; otherwise, set it OFF. No toggling—each stage independently sets the state.  

  - **Lamp B (Dial):**  
    - State space: A circle (position mod 1 turn, i.e., \([0, 1)\) with \(0 \equiv 1\)).  
    - Stage \(n\) occurs at \(t_n = 1 - 2^{-n}\).  
    - At stage \(n\), rotate the dial **forward** by \(\frac{1}{n}\) of a turn from its previous position.  

  - **Lamp C (Coin Lamp):**  
    - Two states: ON or OFF.  
    - Stage \(n\) occurs at \(t_n = 1 - 2^{-n}\).  
    - At stage \(n\), flip a fair coin: set ON if heads, OFF if tails.  

  **Questions:**  
  1. For each lamp (A, B, C), does the specification determine the state/position at \(t = 1\)?  
     - If **yes**, state what it is and explain what feature of the setup determines it.  
     - If **no**, explain why not. Is it because:  
       (a) The setup is silent about \(t = 1\)?  
       (b) The sequence of states has no limit?  
       (c) Some other reason?  
     *(12 marks)*  

  2. Compare these to the original **Thomson’s Lamp** (toggled OFF at \(n=1\), ON at \(n=2\), OFF at \(n=3\), etc., on the same schedule). Is Thomson’s Lamp fundamentally different from Lamps A, B, and C, or is it merely the most famous example? Justify your view. *(5 marks)*  

  3. Critically evaluate whether "the state at \(t = 1\)" is a well-defined concept in supertasks. What must be added to the setup to make it well-defined? Discuss the costs of assumptions like continuity, "no action at a distance," or the Principle of Sufficient Reason (PSR). *(8 marks)*  

  ---

  ### Model Answer (≈700 words)  

  **Lamp A (Square Lamp):**  
  The state at \(t = 1\) is **not determined**. The setup specifies states only at times \(t_n < 1\), leaving \(t = 1\) undefined. Crucially, the sequence of states **lacks a limit**. Perfect squares (1, 4, 9, ...) become increasingly sparse—density \(\to 0\)—but infinitely many ON and OFF states occur. For any \(N\), there are later ON stages (e.g., at \(n = k^2 > N\)) and OFF stages (e.g., \(n = k^2 + 1\)). Thus, the states oscillate indefinitely without converging. This is a failure of convergence, not mere silence: even if we demanded continuity, no consistent state satisfies "no jump at \(t = 1\)."  

  **Lamp B (Dial):**  
  The position at \(t = 1\) is **not determined**, but for a different reason. The dial’s state at stage \(n\) is the partial sum \(S_n = \sum_{k=1}^n \frac{1}{k} \mod 1\) (harmonic series). While \(\frac{1}{n} \to 0\), the series diverges, and \(S_n \mod 1\) is **dense** on the circle—it visits every open interval infinitely often. Thus, the sequence has **no limit**; every point is an accumulation point. Unlike Lamp A, the issue is not oscillation between discrete states but **topological divergence**: in the circle’s topology, convergence requires a unique limit point, but here all points qualify equally. The setup is silent at \(t = 1\), but no continuous extension exists.  

  **Lamp C (Coin Lamp):**  
  The state at \(t = 1\) is **determined by the coin flips** but **unknowable in advance**. The setup defines a random process: at \(t = 1\), the lamp has a definite state (e.g., "ON if the infinite sequence had even heads"), but this state depends on all coin flips, which are not precomputed. Crucially, this is **not indeterminacy**—the state exists metaphysically—but **epistemic undecidability**. The sequence has a limit only if the states eventually stabilize, which happens with probability 0 (since infinitely many flips occur). Thus, while the setup specifies \(t = 1\) *in principle*, the limit fails to exist almost surely, making the state unpredictable.  

  **Thomson’s Lamp Comparison:**  
  Thomson’s Lamp (toggle at each step) is **not fundamentally different**. Like Lamp A, its states oscillate (OFF, ON, OFF, ...) with no limit. Its fame stems from its intuitive paradox: *any* state at \(t = 1\) violates "no action at a distance" (e.g., forcing ON requires infinitely many toggles "after" \(t = 1\)). However, this is shared by Lamps A and B: assigning a state at \(t = 1\) demands extra premises. Thomson’s Lamp is simply the simplest oscillation, but Lamp B’s topological divergence and Lamp C’s randomness highlight broader categories of supertask behavior.  

  **Defining "State at \(t = 1\)":**  
  The question presupposes that the state at \(t = 1\) *should* be the limit of prior states, but this is **not automatic**. Supertasks require explicit completion rules. Three options exist:  
  1. **Continuity/No Jump**: Demand that \(\lim_{t \to 1^-} \text{state}(t) = \text{state}(1)\). This resolves Lamp B (e.g., by compactifying the circle) but fails for Lamps A and C (no limit). Cost: Ad hoc for discrete states.  
  2. **Principle of Sufficient Reason (PSR)**: Assert a unique state must exist, e.g., Thomson’s Lamp "must" be ON or OFF. This is unjustified—Lamp C’s randomness contradicts PSR—and risks contradiction (e.g., Lamp A has no privileged state).  
  3. **Silence as Indeterminacy**: Accept that supertasks need explicit \(t = 1\) rules. This is safest but "uninteresting." The core insight is that convergence depends on **topology**: e.g., in the indiscrete topology, all sequences converge, but this is trivial. For discrete states (Lamps A, C), only stabilization suffices; for continuous (Lamp B), Hausdorffness is needed to avoid "limits" to multiple points.  

  In sum, supertasks expose ambiguities in infinitistic limits. Lamps A and B fail due to non-convergence, while Lamp C has a definite but unknowable state. Thomson’s Lamp is paradigmatic but not unique. Defining \(t = 1\) requires importing physical or metaphysical premises, each with trade-offs.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-hit points** (deduct marks if missing/muddled; common errors in italics):  

  1. **Lamp A: No limit due to oscillation** (3 marks)  
     - States oscillate infinitely (ON at squares, OFF elsewhere); no convergence.  
     - *Error: "Squares are sparse, so OFF at t=1" (ignores infinitely many ONs).*  

  2. **Lamp B: Topological non-convergence** (3 marks)  
     - Harmonic series mod 1 is dense; no unique limit on the circle.  
     - *Error: "Diverges, so no state" (overlooks modulo behavior or density).*  

  3. **Lamp C: Determined but unknowable** (3 marks)  
     - State exists but depends on coin flips; limit exists with probability 0.  
     - *Error: "Random, so indeterminate" (confuses epistemology with metaphysics).*  

  4. **Thomson comparison: Shared divergence** (3 marks)  
     - Thomson’s Lamp oscillates like Lamp A; not categorically distinct.  
     - *Error: "Thomson is special due to toggling" (misattributes paradox to mechanics, not limits).*  

  5. **Topology/metaphysics of convergence** (5 marks)  
     - Convergence requires topology (e.g., discrete vs. circle; Hausdorffness).  
     - "Limit as final state" is an added premise (continuity/PSR), not automatic.  
     - Costs: Continuity fails for discrete states; PSR is ungrounded.  
     - *Error: Ignoring topology or treating "limit" as absolute.*  

  6. **Clarity & critical depth** (3 marks)  
     - Distinguishes silence vs. no limit vs. unknowability; avoids handwaving.  
     - *Error: "t=1 is just undefined" without diagnosing why.*  

  7. **Technical accuracy** (5 marks)  
     - Uses given facts correctly: harmonic divergence/density, square density →0, etc.  
     - *Error: Misapplying convergence tests (e.g., "terms →0, so converges").*  

  **Total**: Sum to 25. Award partial credit for partial answers.  
  **Model answer adherence**: Commit to verdicts; avoid "it depends" without justification.  

  ---  
  This question tests conceptual reasoning about limits, topology, and completion rules—bypassing memorized Thomson debates. The marking scheme prioritizes distinguishing failure modes (silence, divergence, randomness) and topological nuance.
