  Hmm, the user is a philosophy of history and social ontology scholar teaching a seminar on moral revolutions. They're stuck in a theoretical impasse between three explanations for the demise of practices like slavery, dueling, and footbinding: materialist (Williams), honor-based (Appiah), and argument-based approaches. They want me to diagnose why their seminar can't move beyond this deadlock.

  The user proposes an interesting hypothesis: that "end" conflates two distinct phenomena - cessation (stopping the practice) and delegitimation (stopping its justification). They suggest materialist and honor explanations are about selection mechanisms (which practices survive), while arguments are about legitimation mechanisms (how we justify why practices ended).

  I need to evaluate this hypothesis rigorously. Let me break down what each camp is truly committed to:
  - Materialists care about the collapse of sustaining interests (economic costs, political shifts)
  - Honor theorists focus on status dynamics among elites
  - Argument proponents emphasize moral persuasion changing beliefs

  Crucially, all three might be answering different questions: "Why did people stop doing X?" (materialism/honor) vs. "Why did people stop defending X?" (arguments) vs. "Why do we now condemn X?" (retrospective legitimation).

  The user's selection/legitimation distinction seems powerful here. Materialist and honor theories explain selection pressures that make practices unsustainable, while arguments explain either delegitimation (if contemporary) or retrospective justification (if post-hoc). This reframes the debate by showing how the mechanisms operate at different analytical levels.

  For concrete discrimination, I should identify cases where cessation and delegitimation are decoupled. For example:
  - Early abolition laws where slavery ceased legally but wasn't fully delegitimated (like gradual emancipation laws)
  - Honor reversals that didn't immediately stop practices (like early anti-dueling campaigns failing)
  - Arguments succeeding only after material conditions changed (like abolitionist rhetoric gaining traction post-industrialization)

  The impasse isn't permanent - the user's distinction offers progress. By separating the questions (cessation vs. delegitimation) and mechanisms (selection vs. legitimation), we can map how different factors interact temporally. Material collapse might precede delegitimation, or honor shifts might accelerate cessation already underway.

  I'll structure my response to first lay out the three candidate diagnoses (substantive disagreement, verbal confusion, different questions), then show how the user's hypothesis resolves them by clarifying what "end" means. I'll emphasize how this reframing generates new research questions about temporal sequences and mechanism interactions.
answer: |-
  Your hypothesis is perceptive and cuts to the structural flaw in the debate. The impasse stems from **three distinct questions being conflated under "ending," compounded by unexamined temporal and functional differences in the proposed mechanisms.** Below, I diagnose step by step, flag uncertainties, and identify paths forward.

  ### Candidate Diagnoses
  1. **Substantive Causal Disagreement**: The camps genuinely dispute the *primary driver* of historical change.  
  2. **Verbal Disagreement**: "End" is ambiguous, leading to talking past each other.  
  3. **Distinct Questions**: Each camp answers a different sub-question about moral revolutions.  

  After testing, I find **#3 (distinct questions) is primary, with #2 (verbal conflation) as a key enabler.** Your selection/legitimation split does real work, but needs refinement.

  ---

  ### Step-by-Step Diagnosis
  #### 1. **What Each Camp is *Actually* Committed To**
     - **Materialists (Williams)**:  
       - *Core claim*: Practices cease when material/structural supports erode (e.g., slavery becoming economically inefficient).  
       - *Question answered*: **"Why did people *stop doing* this practice *when* they did?"**  
       - *Scope*: Explains behavioral cessation, not necessarily moral shifts.  
       - *Blind spot*: Cannot explain why some economically viable practices die (e.g., dueling persisted despite declining utility).

     - **Honor Theorists (Appiah)**:  
       - *Core claim*: Practices die when elites abandon them to avoid social disgrace (e.g., dueling losing prestige among aristocrats).  
       - *Question answered*: **"Why did the *dominant group* withdraw its sanction?"**  
       - *Scope*: Explains elite-driven delegitimation, not mass behavioral change.  
       - *Blind spot*: Struggles with practices lacking elite gatekeepers (e.g., footbinding’s persistence despite imperial bans).

     - **Argument Theorists**:  
       - *Core claim*: Practices die when moral arguments persuade key actors (e.g., abolitionist rhetoric shifting public opinion).  
       - *Question answered*: **"Why did people *stop believing* this practice was defensible?"**  
       - *Scope*: Explains normative delegitimation, not necessarily behavioral compliance.  
       - *Blind spot*: Arguments often fail without material/honor shifts (e.g., early abolitionist tracts ignored for centuries).

  **Key Insight**: Materialists and honor theorists focus on **behavioral cessation** (people *stop doing*), while argument theorists focus on **normative delegitimation** (people *stop defending*). These need not align temporally or causally.

  #### 2. **Testing Your Hypothesis: Selection vs. Legitimation**
  Your split is correct but incomplete:  
  - **Selection Mechanisms** (material/honor): Determine which practices *survive* under changing conditions.  
    - Materialism: Selects against practices with unsustainable costs.  
    - Honor: Selects against practices that damage elite status.  
  - **Legitimation Mechanisms** (arguments): Explain *why* a practice is deemed wrong *after* selection pressures destabilize it.  
    - *Crucially*, arguments often **retroactively justify** cessation driven by selection, rather than causing it.  

  **Refinement**: Legitimation has two phases:  
  - **Contemporary Delegitimation**: Arguments *coinciding* with cessation (e.g., abolitionism gaining traction amid industrialism).  
  - **Retrospective Sanctification**: Arguments *rewriting history* to moralize a fait accompli (e.g., Enlightenment humanism framing slavery’s end as inevitable).  
  (*Uncertainty*: When does argument drive change vs. rationalize it? Few cases isolate persuasion from structural shifts.)

  #### 3. **Cases That Discriminate Between Theories**
  Two types of cases break the stalemate by decoupling cessation from delegitimation:  
  - **Cessation Without Delegitimation**:  
    - *Example*: **Dueling in Prussia (1850s)**. Banned after military reforms reduced aristocratic power (materialism), but elites still saw it as honorable. Delegitimation came later via public ridicule.  
    - *Discriminates*: Materialism explains cessation; honor/arguments explain *later* moral shift.  

  - **Delegitimation Without Cessation**:  
    - *Example*: **Slavery in Ancient Rome**. Stoic arguments condemned it (delegitimation), but the practice thrived until economic collapse and slave shortages ended it (materialism).  
    - *Discriminates*: Arguments alone failed; material forces drove cessation.  

  - **Honor Reversal Without Collapse**:  
    - *Example*: **Footbinding in China (1900s)**. Anti-footbinding societies (arguments) failed for decades. Only when urban elites linked it to national weakness (honor) and factories favored mobile labor (material) did bans stick.  
    - *Discriminates*: No single mechanism suffices; honor/material co-evolved.  

  **Decisive Test**: A case where *all three mechanisms are present but temporally staggered*. E.g., **British slavery abolition**:  
  - Material: Caribbean sugar profits declined post-1776 (selection).  
  - Honor: Elites avoided association with "barbarism" post-1807 (contemporary delegitimation).  
  - Arguments: Abolitionists framed slavery as un-Christian (retrospective sanctification).  
  *Conclusion*: Material/honor drove cessation; arguments cemented delegitimation *afterward*.

  #### 4. **Is Progress Possible? Breaking the Impasse**
  Yes—by **disaggregating "ending" into three questions**:  
  1. **Cessation**: When/why did the practice *behaviorally terminate*? (Materialism/honor)  
  2. **Delegitimation**: When/why did it lose *normative justification*? (Arguments/honor)  
  3. **Retrospective Sanctification**: How was its demise *morally narrativized*? (Arguments)  

  **Path Forward**:  
  - **Reframe the Seminar**: Assign each case study to map:  
    - Timing of cessation vs. delegitimation.  
    - Which groups drove each phase (e.g., elites vs. masses).  
  - **Better-Posed Question**: *"Under what conditions do selection pressures (material/honor) and legitimation pressures (arguments) interact to produce irreversible moral change?"*  
  - **Synthesize Temporally**: Honor shifts often *mediate* between material changes and argumentative success (e.g., elites adopt arguments *after* costs rise).  

  **Permanent Impasse?** Only if scholars ignore:  
  - **Functional Asymmetry**: Selection explains *feasibility* (can we keep doing this?); legitimation explains *desirability* (should we?).  
  - **Temporal Layering**: Cessation often precedes delegitimation by decades.  

  **Your hypothesis succeeds** by exposing that the camps are not rivals but **specialists in different phases of collapse**. The selection/legitimation split isn’t mere relabeling—it forces precision about *what* is being explained (behavior vs. belief) and *when* (during vs. after decline). The way out is to abandon "why did it end?" for "how did these mechanisms *sequentially interact*?" This transforms a circular debate into a dynamic model of moral change.
