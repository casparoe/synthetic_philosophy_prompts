  Then there are two often-overlooked demands: practical application (what do I tell the rules engine about 12.4m buildings?) and usability (predicates can't become useless coin flips). They're right - most theories ignore these. 

  The user also wants meta-analysis: which requirements are genuine vs. biased? Which combinations are impossible? That tolerance + bivalence + no-sharp-boundaries trio feels unsustainable - I should map how each major theory sacrifices one rail. 

  Hmm... their background in rules engines suggests they'll reject purely abstract solutions. The "what to implement" question is live for them. And they're suspicious of hidden agendas - like classical logic preservation being dogma. Smart. 

  For the impossible trio: tolerance (small changes don't matter) + bivalence (every statement true/false) + no-sharp-boundary does indeed self-destruct. Epistemicism ditches tolerance (claims there's a sharp cutoff we can't know). Supervaluationism drops bivalence (allows "neither true nor false"). Degree theories reject bivalence too (introduce truth values between 0 and 1). 

  The usability requirement might be the biggest theory-killer. Many approaches make predicates unusable: supervaluationism's "super-truth" is impractical, epistemicism's unknowable cutoffs paralyze decision-making, radical contextualism makes communication impossible. 

  I'll structure this as: 
  1. The core phenomena every theory must handle (with concrete examples) 
  2. The practical demands (implementation & usability) 
  3. The meta-analysis of conflicts and trade-offs 
  4. The "usability" bomb that sinks most ships 

  Key is grounding everything in cases - no jargon without examples. When they say "penumbral connections", I'll give the redder-than scenario. For higher-order vagueness, show how "clearly borderline" itself gets vague. 

  And I must flag where theories cheat - like drawing a sharp line around borderline cases just moves the vagueness up a level. That's exactly what frustrates them about "going in circles". 

  For the finish: yes, usability eliminates the most theories. Engineers can't work with approaches where "tall" becomes meaningless or communication breaks down. Game over.
answer: |-
  Here’s a rigorously grounded specification for an adequate theory of vagueness, structured by requirement, case/justification, and conflicts. I’ll flag biases and impossibilities explicitly.

  ---

  ### **Core Phenomena: Non-Negotiables**
  1. **Borderline Cases Exist**  
     - **Case:** A 1.80m man in a population where 1.85m is clearly tall and 1.75m is clearly not tall. Competent speakers *hesitate* ("Is he tall? Well... sort of?"), and this isn’t resolvable by more data (e.g., measuring to atomic precision).  
     - **Requirement:** The theory must model genuine indeterminacy (not epistemic ignorance).  
     - **Killer Example:** "Is this shade #7F7F7F (mid-gray) *dark*?" Consensus: hesitation, not ignorance.

  2. **Sorites Paradox (Two Forms)**  
     - **Heap Version:** Removing one grain from a heap never turns it into a non-heap. Yet, after 10,000 removals, it’s sand.  
     - **Forced March Version:** You must judge "bald" after each hair removal. When does "not bald" become "bald"? Real linguistic *paralysis* occurs.  
     - **Requirement:** Explain why premises like "one grain/hair can’t matter" are *tempting but fatal*, and resolve the paradox without ad hoc patches.

  3. **Penumbral Connections**  
     - **Case:** Object A is clearly red (e.g., fire-engine), B is clearly orange. A must be redder than B, even if "redder" isn’t explicitly defined. If your theory allows A to be red, B not red, but B redder than A, it’s dead.  
     - **Requirement:** Preserve comparative relations (e.g., "taller than", "redder than") between clear cases and borderlines.

  4. **Higher-Order Vagueness**  
     - **Case:** We have "clearly tall", "borderline tall", and "clearly not tall". But "borderline tall" itself has borderline cases (e.g., "Is *this* person *definitely* borderline tall?"). Drawing a sharp line around "borderline" just creates a new vagueness problem.  
     - **Requirement:** No sharp boundaries at *any* level (metalinguistic included).

  ---

  ### **Practical & Usability Constraints**
  5. **Decision-Making in Practice**  
     - **Use Case:** A building code says "tall structures (>12m) require reinforcement". A structure is 12.4m. An engineer *must* decide: reinforce or not?  
     - **Requirement:** The theory must specify what verdicts are *licensed* (e.g., "acceptable to deem it tall", "flip a coin", "seek new criteria") and *why*. It cannot say "it’s indeterminate" and walk away – that’s a design failure.  
     - **Bias Alert:** "Must deliver binary outputs" is engineer-preference; theory may license non-binary resolutions.

  6. **Linguistic Usability**  
     - **Case:** Two architects agree on all physical facts about a building (height, materials, context). One says "tall", the other "not tall". They must still communicate effectively (e.g., "I see why you say that, but consider X").  
     - **Requirement:** Predicates cannot become meaningless or non-functional. Vagueness must not collapse into universal skepticism ("no one knows what 'tall' means") or randomness ("it’s arbitrary").  
     - **Killer Example:** If "tall" degrades into a coin flip, urban planning collapses.

  ---

  ### **The Impossible Trio & Theory Sacrifices**
  The core tension:  
  - **(T) Tolerance:** A microscopic change (one grain/hair) cannot affect the truth of a vague predicate.  
  - **(B) Bivalence:** Every statement is true or false (no third value).  
  - **(N) No Sharp Boundaries:** There is no precise cutoff (e.g., no exact hair count for baldness).  

  **These three are jointly inconsistent.** Proof:  
  - Tolerance (T) + Bivalence (B) imply a sharp boundary (contradicting N): If every hair count has a truth value, and one hair never matters, then *all* counts have the same value – absurd.  
  - Drop one to resolve:  

  | **Theory**         | **Sacrifices**          | **How**                                                                 | Problem                                                                 |
  |--------------------|-------------------------|--------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **Epistemicism**   | **Tolerance (T)**       | Claims a *sharp cutoff exists* (e.g., 9,432 hairs = bald), but we can’t know it. | Violates intuition that one hair *can’t* matter; forced march seems arbitrary. |
  | **Supervaluationism** | **Bivalence (B)**     | "True" = true on *all* sharpenings (precisifications). Borderlines are "neither true nor false". | Makes penumbral truths fragile; "A is redder than B" might not hold on all sharpenings. |
  | **Degree Theories** | **Bivalence (B)**      | Truth is a continuum (e.g., "tall" = 0.7 true).                          | "A is redder than B" may not imply "A is red and B is not" (penumbral failure). |
  | **Contextualism**  | **No Sharp Boundaries (N)** | Cutoffs shift with context, but each context has a *temporary* sharp boundary. | Higher-order vagueness reappears ("when does context shift?"). |

  ---

  ### **Biases & Hidden Agendas**
  - **"Classical Logic Must Be Preserved"**: Often a conservative bias. Supervaluationism preserves it for "clear cases" but loses excluded middle for borderlines. Degree theories abandon it entirely.  
  - **"There Must Be a Sharp Cutoff"**: Reflects a metaphysical bias toward precision (epistemicism’s move). Rejects tolerance at the cost of paradox.  
  - **"Vagueness is Purely Linguistic"**: May ignore psychological/decision-theoretic aspects (e.g., forced march paralysis).

  ---

  ### **The Single Requirement That Eliminates Most Theories: Usability (Requirement #6)**  
  **Why:**  
  - Epistemicism makes "tall" unknowable – engineers can’t use it.  
  - Supervaluationism’s "super-truth" is uncomputable; no rules engine can check all sharpenings.  
  - Radical degree theories (e.g., fuzzy logic) make communication impossible if speakers assign different degrees.  
  - Contextualism risks making agreement impossible without shared context.  

  **Survivors:** Theories that explicitly model *decision procedures* (e.g., "in context C, use threshold T") while acknowledging indeterminacy (e.g., "T is arbitrary but stable enough"). But these often sacrifice higher-order vagueness or tolerance.

  ---

  ### **Summary: What You Can’t Compromise On**
  An adequate theory **must**:  
  1. Acknowledge genuine borderline cases (not epistemic gaps).  
  2. Resolve the Sorites without implausible metaphysics.  
  3. Preserve penumbral connections.  
  4. Explain higher-order vagueness.  
  5. Guide practical decisions (what to *do* with borderlines).  
  6. Keep predicates usable for communication.  

  **Sacrifices are inevitable** – usually one rail of the tolerance/bivalence/no-sharp-boundary trilemma. **Usability** is the silent killer of elegant abstractions. If your theory can’t tell an engineer how to judge a 12.4m building, it’s a philosophical artifact, not a solution.
