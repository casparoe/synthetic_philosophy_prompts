prompt: |-
  I keep getting into arguements about whether everyday etiquette stuff — queue order, tipping, jaywalking — is actually morally binding. My friend says these are just conventions: break them and you're being odd or rude at most, not doing anything wrong. I think that's way too quick, but I also definitely don't want to say every local habit is a moral duty, since then a tourist who doesn't tip in the US is a moral criminal and so is someone who stands on the "wrong" side of the escalator.

  So here's the distinction I want you to run with. Some conventions are load-bearing: the practice they're attached to would collapse or dump a cost on someone else if enough people stopped (US tipping, where servers' pay depends on it, looks like this). Others are basically decorative: pure coordination where nobody's worse off if you defect (which side of the escalator you stand on, which way you face in an elevator).

  Write an essay that lands on a verdict about two things: can decorative conventions ever be real moral obligations, and does a visitor have to follow load-bearing local conventions even when she thinks the arrangement underneath is unjust — say she thinks the restaurant should just pay its staff properly instead of leaning on customers?

  Format it as exactly five numbered points, a sentence or two each, no intro and no wrap-up, and make the fifth one the verdict.
reasoning: |-
  Okay, the user is asking me to write a structured essay about the morality of social conventions. They've presented a clear framework distinguishing between "load-bearing" conventions (like US tipping culture where workers depend on tips) and "decorative" conventions (like escalator etiquette). Their core questions are whether decorative conventions can create moral obligations, and whether visitors must follow load-bearing conventions even if they disagree with the underlying system.

  I need to address both questions directly. For decorative conventions, I should explain that while they're primarily about coordination efficiency, consistently violating them can become morally problematic through secondary effects - causing confusion, frustration, or minor harms to others. The moral weight here is lighter but exists in aggregate or through negligence.

  The visitor question is trickier. Load-bearing conventions carry real moral weight because ignoring them directly harms vulnerable parties (like underpaid servers). But I should acknowledge the tension when someone objects to the system itself - the moral obligation to participate doesn't mean endorsing the system. Visitors might still have duty to mitigate immediate harm while working to change the structure.

  The user wants exactly five numbered points without intro/conclusion. Point 5 must be the verdict. I'll structure it as: 
  1) Define decorative conventions 
  2) Explain their limited moral standing 
  3) Define load-bearing conventions 
  4) Address visitor obligations to them 
  5) Deliver the dual verdict

  I'll keep each point concise - one or two sentences max. The language should be precise but accessible, acknowledging nuances like how decorative violations become morally relevant through scale or context, and that protesting unjust systems is valid but requires conscientious action beyond mere non-participation.
answer: |-
  1.  Decorative conventions primarily serve coordination efficiency; violating them (e.g., standing left on a stand-right escalator) typically causes only minor annoyance or confusion, lacking inherent moral wrongness in isolated acts.  
  2.  However, consistent or deliberate violation of decorative conventions can become morally problematic through cumulative effects (causing widespread inefficiency or frustration) or context-specific negligence (e.g., blocking an escalator during an emergency evacuation).  
  3.  Load-bearing conventions (like US tipping) are morally binding for participants because defiance directly shifts burdens or harms onto others (e.g., servers losing essential income) within the existing, functionally dependent system.  
  4.  A visitor morally ought to follow load-bearing conventions despite objecting to the underlying system; withholding participation (e.g., not tipping) directly harms individuals reliant on it, which is distinct from, and unjustified as a means of, protesting the systemic injustice.  
  5.  **Verdict:** Decorative conventions rarely impose direct moral obligations but can indirectly through negligence or scale; load-bearing conventions create immediate moral obligations for participants to avoid harming others, obligations binding on visitors regardless of their critique of the system.
