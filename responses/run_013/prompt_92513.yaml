prompt: |-
  Alright, I need an essay for a seminar collection I'm putting together, and I'd rather you didn't give me the standard "Buridan's ass shows that the will cannot choose between equals" routine — everyone's read that one and it's boring.

  Here's the arguement I actually want made. Take the donkey. Most people treat it as the flagship case of choice without preference and then either (a) laugh it off because you can just pick one, or (b) insist it starves, which is supposed to show something deep about the will. I think both readings are too quick, and I want an essay that sorts out which one — if either — gets the case right, and ends with a verdict.

  The wrinkle I want you to take seriously: I don't think the hard version of the case is two bales that are exactly equal in value. If they're exactly equal, then by the agent's own lights there's nothing at stake, any pick is as good as any other, and the whole paradox evaporates the moment you notice the agent isn't actually losing anything by picking. The hard version is when the two options aren't equal but aren't ranked either — the agent can't say one is better, or worse, or equal. That's a different animal (pun intended), and I suspect the real puzzle is usually smuggled in under cover of the easy case.

  So: write me an essay on whether Buridan's ass is a genuine problem for the theory of rational choice, or a pseudo-problem generated by running together two things — indifference and incomparability — that behave very differently. Take a side. If you think only one of them is a real problem, say which, and be explicit about what the other one fails to threaten and why. If you think they're actually the same phenomenon wearing two hats, then defend that, because it's the harder line and I want to see it earned.

  Some things I'd like you to actually engage with rather than wave at: whether complete indifference is even a coherent psychological state or just a theorist's fiction; whether an arbitrary tie-break (a coin, a whim, a rule you made up on the spot) can be rational or is merely arational, and whether that distinction does any real work; and what all this does to the standard idea that a rational agent's preferences are at least complete. Don't tell me what some famous dead person said about donkeys — I want the reasoning, not the cast list.

  And is there any sense in which the ass is being irrational at all, as opposed to just unlucky in its menu? I keep going back and forth on this, so I want you to come down on it.

  Bottom line first, please — open with your verdict in the first sentence, then give the reasoning, no throat-clearing and don't restate the question. British spelling throughout; I'd like to drop it into the collection without having to de-Americanise it.
