answer: |-
  What you're describing is a fascinating and nuanced phenomenon that lacks a single universally accepted term, but it sits at the intersection of several well-studied concepts in linguistics, philosophy of language, and cognitive science. Here's the breakdown, carving it at the joints as requested:

  1.  **Core Mechanism: Exemplar-Based Meaning Extension via Analogical Chaining**
      *   The fundamental engine driving this change is **analogical extension**. Each new use of "clean" doesn't rely on a fixed definition but on perceiving an analogy between the current case and *previous exemplars* labeled "clean".
      *   Meaning isn't defined by necessary and sufficient conditions ("no rattle", "dry knock", "no clipping") but by a **cluster of exemplars**. New cases are accepted as "clean" based on perceived similarity to this evolving cluster.
      *   Crucially, the chain of analogies has **directionality and cumulativity**. Each slight extension subtly shifts the "center of gravity" of the exemplar cluster, making the next, slightly further extension plausible. The change happens incrementally, link by link in the chain.

  2.  **Key Phenomenon: Directional Semantic Drift via Community Practice**
      *   **Semantic Drift:** This is the broad term for how word meanings change over time. Your case is a specific *type* of drift.
      *   **Driven by Use/Practice:** The drift isn't due to top-down decree, external influence, or a sudden innovation. It emerges organically from repeated, situated *use* within the community's specific practices (evaluating keyboard sounds, discussing run paces).
      *   **Directional & Cumulative:** Unlike some drift which might be random oscillation, this drift has a discernible trajectory ("clean" moving from "rattle-free" to "specific tonal quality", "easy" sliding between subjective and objective). Each small step enables the next in the observed direction.
      *   **Community-Wide Covert Drift:** The most striking aspect is that the community *as a whole* shifts its usage, largely *unaware* that the central meaning has migrated significantly from its starting point. Early members retain the old sense but don't necessarily register the group's shift, leading to the non-contradictory but unsettled discussions you observe.

  3.  **Distinguishing It From Related Concepts:**
      *   **Ambiguity/Polysemy:** Ambiguity involves distinct, established senses (e.g., "bank" as financial institution vs. river edge). Your phenomenon involves a *single, fluid sense* in flux, not multiple discrete senses. The community feels it's one concept, even as its core shifts.
      *   **Vagueness:** Vagueness concerns borderline cases (e.g., "tall" – where exactly is the cutoff?). Your phenomenon involves a *shift in the core prototype itself*. What was once clearly "clean" (rattle-free) might now be considered "muddy," and what was once "muddy" might now be core "clean." The boundaries move *with* the center.
      *   **Simple Semantic Change (e.g., Broadening/Narrowing):** While related, classic broadening/narrowing often involves a more conscious shift or a clearer addition/loss of a sense. This is a subtler, analogical creep *within* a domain, where the old sense isn't necessarily shed entirely but is overshadowed/diminished by the new, shifted prototype. The chain of analogies is key.
      *   **Contested Concepts (Gallie):** Contested concepts involve fundamental disagreements about the *evaluative core* (e.g., "democracy," "justice"). While "clean" and "easy" have evaluative aspects, your phenomenon is more about the *descriptive criteria* shifting covertly through use, not necessarily an overt normative debate. The disagreement is masked by the shifting sense.
      *   **Family Resemblance (Wittgenstein):** This is *crucially relevant*. Wittgenstein argued that some concepts (like "game") are held together not by a single defining feature but by overlapping similarities between various members (like family traits). Your phenomenon shows how a family resemblance concept *evolves directionally* over time through analogical chaining within a practice-based community. The "family" changes its typical appearance.
      *   **Prototype Theory (Rosch):** Meaning is organized around a central, best example (prototype), with less central members. Your observation is essentially the *migration of the prototype* within the category space, driven by community practice and analogical extension. The "best example" of "clean" changes.

  4.  **Terminological Candidates & Why They Fit (Partially):**
      *   **Semantic Creep:** This is perhaps the most intuitive and descriptive lay term. It captures the slow, directional, often unnoticed movement. It emphasizes the *process*.
      *   **Prototype Drift / Prototype Migration:** Highlights the core cognitive mechanism (shifting central exemplar).
      *   **Exemplar-Driven Semantic Shift:** Emphasizes the role of specific instances over definitions.
      *   **Directional Semantic Change via Analogical Chaining:** A precise, albeit clunky, description of the mechanism.
      *   **Covert Community Semantic Shift:** Highlights the social and unnoticed aspect.
      *   **Practiced-Based Semantic Evolution:** Emphasizes the role of community activity.

  5.  **Boundaries & Related Scenarios:**
      *   **Individual Expert Drift (Community Doesn't Follow):** This is **idiolectal drift**. It's similar in mechanism (analogical extension within one person's usage) but lacks the *community* dimension and covert *group* shift. The expert might innovate, but if the community doesn't adopt the extensions, the communal concept remains stable.
      *   **Community Convergence (No Individual Slip):** This is **normative shift without drift**. The community might consciously or semi-consciously agree on a new definition or accept a new sense (e.g., adopting a technical term). Crucially, individuals are aware of the change (or it happens rapidly). In your phenomenon, the shift happens *through* the cumulative, often unnoticed slips in individual analogical extensions during routine use.
      *   **When Does it Stop Being the "Same" Concept?** This is fuzzy. Boundaries depend on the perceived continuity of the analogical chain and the community's sense of unity. If the chain breaks, or subgroups develop radically different chains (e.g., "clean-A" vs. "clean-B" factions), polysemy emerges. If the shift is vast and the chain forgotten, it might be considered a new word (etymological fallacy aside). The persistence of the *word form* and the community's *feeling* of continuity are key.
      *   **Catalysts:** Such drift often flourishes in **specialized discourse communities** (like your keyboard group) where shared practices are intense, the concept is frequently applied to nuanced cases, and formal definitions are absent or de-emphasized. The need for subtle distinctions drives analogical extension.

  **In essence, the phenomenon you've astutely observed is best described as Directional Semantic Drift via Community-Based Analogical Chaining within an Exemplar/Prototype Category.** It's the gradual, often unnoticed migration of a concept's central prototype within a specific community, driven by repeated acts of applying the word to new situations based on perceived similarity to prior exemplars, with each extension subtly shifting the center and enabling the next step in a cumulative direction.

  You've identified a powerful mechanism of meaning change that operates below the radar of explicit definition and debate, relying on the shared, situated practices of a community and the flexible, analogical nature of human categorization. It's more dynamic than static family resemblance or contestedness, and more organic and covert than typical polysemy or conscious semantic broadening. "Semantic creep" or "prototype drift" are useful shorthand terms capturing its essence.
