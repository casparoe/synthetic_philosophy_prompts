  The mist still clung to Lake Imber like damp gauze when Marta found the first candle. It stood, unlit and solitary, on the rickety wooden dock where Old Agatha used to sit, staring at the water. By noon, a dozen more flickered along the shoreline, pale flames reflected in the algae-choked shallows. Imber waited.

  In the old community hall, repurposed for the Boundary Committee, the air crackled with a different kind of tension. Dr. Lena Petrov adjusted her glasses, peering at the sediment core display. A narrow column of layered earth, extracted from the lakebed, dominated the room. "The iridium spike is *here*," she insisted, tapping a distinct, dark line halfway down. "Unmistakable. The peak concentration from the Imber Chemical fire fallout. 1978. The moment the greatest physical alteration occurred in this stratigraphy. The factory ceased operations *because* it was rendered uninhabitable."

  Across the table, Professor Stavros Chen leaned back, fingers steepled. "Physical alteration, Lena, is a constant drumbeat. The fire was loud, yes. But the *awareness*? The moment humanity here, in microcosm, looked at the poison they were brewing and *knew*? That's the true inflection point. That's *here*." He pointed to a layer seemingly indistinguishable from those above and below, marked by a tiny notation: *Circa 1970 - Local Council Minutes, 'Environmental Concerns' Raised*. "They debated. They knew the factory was leaking. Knew the fish were dying. Yet they voted to keep it running. *That* is the Anthropocene's terrible signature: knowledge coupled with continuation."

  Outside, the town held its breath. Imber was a place of deep roots and deeper silences. Most families traced back to the factory workers. Agatha Reed, fading in her cottage overlooking the lake, was the last. She’d started as a cleaner at Imber Chemical in '64, seen the frantic production years, the whispered worries ignored, the terrifying night of the fire that painted the sky orange and rained ash for weeks. She’d lived through the slow death of the lake and the town’s quiet shame. Now, at 92, she was the final thread connecting the present to the moment the world changed – whichever moment the Committee chose.

  For Imber, the choice wasn't about isotopes or council minutes. It was about legacy.

  "If they pick the '78 spike," argued Ben Rigby, whose father managed the factory until the fire, "it pins the whole damn disaster on *them*. The workers, the managers, our parents, grandparents. They become the 'poisoners.' The ones who *caused* the break. It makes it look... deliberate. Catastrophic. Final."

  His neighbour, Elara Vance, whose mother had been one of the few voices on the council pleading for action years before the fire, shook her head. "And if they pick the '70 awareness? Then they become... weak. Complicit. They *knew* and did nothing. Cowards who saw the cliff and kept driving. Is that better? At least the fire was an accident, a terrible consequence, not a... a choice to ignore."

  The candles by the lake weren't just for Agatha. They were votives offered to memory, pleas for a kinder judgement on the past. The Committee’s sterile debate inside the hall felt like a violation, a distant bureaucracy deciding the moral weight of their ancestors' lives based on layers of mud.

  As afternoon bled into evening, the news swept through the town like a cold wind: Agatha Reed had passed. Peacefully, in her sleep, the lake view her last sight. The last witness was gone. The survivor rule was satisfied. The Boundary Committee could now name the epoch’s beginning.

  Inside the hall, the argument had reached its inevitable stalemate. Lena’s "Spike" faction and Stavros’s "Silence" faction were immovable. The rules were clear: deadlock meant recourse to lot.

  Stavros sighed, the weight of the moment settling on him. "So be it. We draw lots. The boundary will be fixed by chance." He sounded weary, the intellectual certainty replaced by the sour taste of arbitrariness.

  Lena merely nodded, her lips a thin line. She produced two small, identical ceramic tiles from a velvet pouch. One bore a tiny, etched flame (Spike, 1978). The other, a stylized eye (Silence, 1970). They were made from clay fired locally decades ago, a silent, unintended irony.

  The Committee members formed a sombre circle. The townspeople who had gathered outside, drawn by the gravity of the hour, pressed closer to the hall’s windows, their faces pale smudges in the twilight. Ben and Elara stood shoulder-to-shoulder, the rivalry momentarily forgotten in the shared dread of the lottery. The air vibrated with the unsaid: *Which version of our dead will be etched into the planet’s story?*

  Stavros placed the tiles into an old, polished wooden bowl salvaged from the ruined factory office. He stirred them slowly with deliberate fingers, the *clack-clack* echoing loudly in the hushed room. He lifted the bowl high, then offered it to Lena.

  "Blind draw," he said. "One tile. That moment defines the boundary."

  Lena closed her eyes, took a breath that seemed to draw the air from the room, and plunged her hand into the bowl. Her fingers brushed the cool ceramic. For a heartbeat, she hesitated, suspended between the weight of rock and the weight of thought. Then her hand closed. She withdrew it, fist clenched.

  The silence was absolute. Even the lake outside seemed to hold its breath. Lena opened her hand. Resting on her palm, catching the fluorescent light, was the tile etched with a flame.

  "The Spike," Lena announced, her voice flat, devoid of triumph. "The boundary of the Anthropocene, at this site, is fixed at the layer corresponding to the Imber Chemical fire, 1978. The moment of greatest physical alteration."

  A collective sigh, part relief, part despair, washed through the room and the faces at the windows. The line was drawn. Official. Immutable. Geology would record it.

  Ben Rigby’s shoulders slumped slightly. The poisoners. His father, forever marked by the catastrophic moment. Elara Vance pressed her lips together. At least it wasn’t cowardice. It was disaster, undeniable, physical. A thing that happened *to* them as much as *by* them.

  The Committee members began the formalities – signing documents, adjusting the display to highlight the dark line of the iridium spike. It was swift, efficient. The arbitrariness of the act was stark against the ritual of bureaucracy. A line drawn by blind chance became, in minutes, scientific fact.

  Later, under a sky pricked with indifferent stars, the townspeople dispersed. The candles by the lake guttered in the night breeze. Some were snuffed out. Others burned lower.

  Elara found herself walking not towards home, but towards the overgrown cemetery on the hill overlooking the poisoned water. She stopped before her mother’s grave. The headstone was simple. *Eleanor Vance. Beloved Mother. Tried to make things right.*

  Before tonight, the inscription felt like a quiet truth. Now, with the boundary fixed at the fire years *after* her mother’s warnings, the words "tried to make things right" felt… insufficient. Inadequate against the official narrative of the Spike. Her mother’s foresight was buried under the layer of catastrophe. Elara knelt, not to pray, but to touch the cold stone, a silent apology to the past for the story it was now forced to wear.

  Down by the water’s edge, Ben Rigby stood where the dock met the shore. He picked up one of the unlit candles left for Agatha. He didn’t light it. He just held it, looking out at the dark, ruined lake. The legacy was fixed: the poisoners. His father, who’d only followed orders, who’d been terrified the night of the fire, who’d spent years coughing his life out, was now pinned under that iridium spike. The complexity of the man, the pressures of the time, the slow creep of damage before the explosion – all compressed into a single, catastrophic moment defined by a ceramic tile pulled from a bowl. He placed the unlit candle back among the others. A small, futile protest against the immensity of the official line drawn in the mud beneath his feet.

  On the lake, a fish broke the surface with a sickly gasp, a sound that carried far in the still night. It was a sound unchanged for decades, indifferent to the epoch named above it. The boundary was fixed, the name chosen by those who never knew the weight of the days it spanned. The dead could not be thanked, nor blamed, for the line drawn through their lives. The living were left only with the burden of remembrance, now subtly, irrevocably altered by the unseen layer chosen, arbitrarily, far below.
