answer: |-
  ## Research Proposal: Substitution Failures in Gongsun Long's White Horse Dialogue

  **Interpretive Question:** Is the primary argumentative goal of Gongsun Long's "White Horse Dialogue" (白馬論) to demonstrate that terms fail to substitute for one another within specific intentional contexts (e.g., seeking, desiring, requesting), even when those terms are taxonomically related (e.g., kind and sub-kind), rather than primarily making an ontological claim about the relationship between universals ("horseness") and particulars (white horses)?

  **Why the Class-Based Reading Doesn't Settle It:** The standard interpretations (focusing on non-identity or non-inclusion between the universal "horse" and the particular "white horse") struggle to adequately explain key arguments within the dialogue:
  1.  **The Seeking Argument:** The observation that someone seeking a "horse" accepts brown/black horses, while someone seeking a "white horse" does not, is offered as direct evidence that "seeking a horse" ≠ "seeking a white horse." Class-based readings struggle to explain *why* this behavioral difference concerning *requests* is presented as relevant evidence for an ontological claim. They often treat it as merely illustrating the distinction, not as *constituting* the core argument.
  2.  **The Separation of Shape and Color:** The argument that "horse" designates shape/form alone, while "white" designates color, and therefore "white horse" designates shape *and* color, is interpreted ontologically (composite particulars vs. simple universals). However, this separation becomes immediately relevant in the seeking context – the composite term ("white horse") imposes stricter criteria for substitution within the request.
  The class-based readings tend to overlook or under-theorize the significance of the *linguistic context* (like "seeking X") in which the terms are deployed, potentially misidentifying the dialogue's central concern.

  **Proposed Research Activity:** I will conduct a close reading and logical reconstruction of the White Horse Dialogue, specifically testing the "substitution failure in intentional contexts" hypothesis:
  1.  **Argument Reconstruction:** I will systematically break down each major argument presented by Gongsun Long (e.g., the seeking argument, the shape/color separation argument, the argument concerning "colored horses" vs. "horse").
  2.  **Testing the Substitution Hypothesis:** For each argument, I will ask: Can this argument be compellingly reconstructed *primarily* as demonstrating how the term "horse" fails to substitute for the term "white horse" within contexts like "seeking X," "desiring X," or "asking for X"? Does this reading flow naturally from the text's examples and logic without requiring significant additional ontological assumptions?
  3.  **Assessing Scope and Consistency:** I will critically examine the later section concerning "colored horses" (黃馬驪馬) and "horse." Does the substitution hypothesis provide a coherent explanation for why "colored horses are horses" might be acceptable while "white horse is horse" is not, perhaps based on the specific demands of the context or the nature of the terms involved? Or does this section necessitate a separate, potentially ontological, thesis inconsistent with the substitution focus of the earlier arguments?
  4.  **Comparative Evaluation:** I will compare the explanatory power and parsimony of the substitution reading against the standard class-based readings for each argument and the dialogue as a whole.

  **Criteria for Success:**
  *   **Convincing Result:** The interpretation is successful if: (a) The substitution hypothesis provides a clear, unified, and textually grounded explanation for *all* the major arguments, including the seeking example and the shape/color separation, showing how they contribute to a single core thesis about context-dependent term behavior. (b) It resolves perceived tensions or awkwardnesses in the class-based readings (especially regarding the seeking argument). (c) It offers a plausible, consistent account of the "colored horses" section, either integrating it into the substitution framework or clearly delineating if/how it introduces a secondary point. A strong result would reveal the dialogue as a sophisticated early investigation into intensional contexts and the logic of naming within them.
  *   **Interpretation Failing:** The interpretation fails if: (a) Key arguments (especially the seeking argument) cannot be convincingly reconstructed under the substitution hypothesis without significant strain or importing concepts absent from the text. (b) The substitution reading offers no clear advantage over class-based readings in explaining the core moves. (c) The "colored horses" section demonstrably requires a separate, incompatible ontological thesis that overshadows the substitution concern. (d) The dialogue's explicit statements are better explained by established ontological readings.

  **Realistic Scope Assessment:** Given the constraints (one page, reliance on English translations):
  1.  **Focus:** Analysis will be confined to the core arguments of the White Horse Dialogue itself, using reputable translations (e.g., Harbsmeier, Fung, Graham). I will not engage in broader comparative philosophy or philological debates about the Chinese text.
  2.  **Depth:** The reconstruction will be logical and philosophical, analyzing argument structure and conceptual implications based on the translated text, not original linguistic analysis.
  3.  **Goal:** The aim is to present a novel, coherent, and textually supported interpretation demonstrating analytical skill, not to definitively resolve centuries of scholarly debate. I will acknowledge the limitations of working solely from translations but argue that the core logical structure of the arguments is accessible for this purpose.
  4.  **Output:** The seminar presentation would focus on clearly articulating the substitution hypothesis, demonstrating its application to 2-3 key arguments, and presenting the evaluation against the criteria above.

  This project proposes a fresh lens on a classic text, suggesting Gongsun Long was not merely an ontologist but a pioneering analyst of how language functions within specific pragmatic contexts – a reading with significant implications for understanding the sophistication of early Chinese logical thought.
