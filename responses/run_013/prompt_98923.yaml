prompt: |-
  ok so I'm in a small study group on practical reason and I need you to help me audit a summary of Bernard Williams's internal vs. external reasons distinction. You're a philosopher who works on practical reason and metaethics and has read the Williams stuff closely, so take your time with this — before you answer, brainstorm the moving parts of the view for yourself (what the internal/external contrast is actually a contrast between, what the agent's "subjective motivational set" is supposed to include, what work the idea of a sound deliberative route is doing, and how all of this relates to the separate debates about moral motivation and about whether morality is categorical). Only after you've mapped that out, go through the summary sentence by sentence.

  A friend of mine who did an MA in philosophy summarized it for me like this:

  'An internal reason is a reason you have in virtue of the desires you actually have, and an external reason is one that would apply to you no matter what you want. Williams's thesis is that all reasons are internal, so if someone really doesn't care about something, they have no reason to do it, full stop. This makes him a Humean about moral motivation: a moral judgment only gives you a reason if you happen to want the relevant end, which is why the categorical "ought" that the Kantians appeal to turns out to be a fiction. The standard objection is that morality is categorical and binds us whether or not we care, so there have to be external reasons; and since Williams doesn't really answer this, the view is a minority position that most philosophers today reject.'

  He's usually reliable so I assumed it was basically fine, but two things nag at me. First, I've heard Williams described as a "Humean" and I've also heard that the Humean theory of motivation is a different debate from his reasons internalism, and I genuinely can't tell whether those are the same thing or whether my friend is sliding between them. Second, that last sentence smells like it's just asserting the outcome of an argument rather than the argument.

  So go sentence by sentence: what would Williams accept, what would he wince at, and what is just wrong? Then tell me whether the verdict in the last sentence follows from anything true in the summary, or whether the summary was quietly carrying it the whole time. I'm a reader here, not trying to grade anybody — I just want to know which parts to trust. Please don't give me reading lists or citations, I won't be able to check them anyway.
reasoning: |-
  Okay, let me approach this systematically. The user is in a study group on practical reason and needs help auditing a summary of Bernard Williams's internal/external reasons distinction. They've shared a friend's summary and have two main concerns: whether "Humeanism" is being used correctly across different debates, and whether the concluding verdict about Williams's minority status is properly supported.

  First, I need to mentally reconstruct Williams's framework. The core distinction is between:
  - Internal reasons: grounded in the agent's "subjective motivational set" (S) which includes not just desires but commitments, dispositions, etc.
  - External reasons: purportedly exist independently of S.

  Williams's key claims are:
  1. Only internal reasons exist (external reasons statements are false or incoherent)
  2. The "sound deliberative route" expands what counts as internal reasons (not just existing desires but what one would desire after rational reflection)
  3. This challenges Kantian categorical imperatives

  Now examining the friend's summary sentence by sentence:

  The first sentence about internal/external definitions is mostly accurate but oversimplifies "desires" to mean only occurrent desires rather than the broader S set. 

  The "full stop" claim is problematic - Williams allows for dispositional elements in S, so someone might have reasons they don't consciously "care" about. 

  Calling Williams "Humean about moral motivation" confuses two distinct debates: Williams's reasons internalism vs. the Humean theory of motivation (which is about mental states causing action). These are separate even if compatible.

  The categorical "ought" point is correctly identified as Williams's target, but the summary misses his argument that external reasons claims lack explanatory power.

  The standard objection section is where the summary becomes problematic - it presents the objection as decisive when Williams actually engages with it through his deliberative route concept. The verdict about minority status feels tacked on without engaging Williams's counterarguments.

  The user's instincts are sharp - the summary does subtly stack the deck against Williams by:
  - Oversimplifying S
  - Conflating distinct "Humean" theories
  - Presenting objections as knockdown arguments
  - Implying Williams didn't address criticisms

  I should highlight these slippages while affirming where the summary gets things right, always tying back to the user's core concerns about conceptual clarity and argumentative fairness.
answer: |-
  Let's break this down carefully. First, I'll mentally reconstruct Williams' core framework as requested, *then* audit your friend's summary sentence-by-sentence. No citations, just the philosophical guts.

  **Brainstorm: Williams' Internal Reasons Thesis (IRT) - Core Components**
  1.  **The Contrast:** Distinguishes between two *types* of reason claims:
      *   **Internal Reason Statement:** "A has a reason to φ" is true *if and only if* φ-ing would serve some element in A's "subjective motivational set" (S), or A *would* be motivated to φ after procedurally rational deliberation *from* their existing S.
      *   **External Reason Statement:** "A has a reason to φ" is supposed to be true *even if* φ-ing bears no intelligible connection (via sound deliberation) to *anything* in A's S. It applies categorically.
  2.  **Subjective Motivational Set (S):** NOT just "desires" in a crude, occurrent sense. Includes:
      *   Dispositions of evaluation (commitments, projects, loyalties)
      *   Patterns of emotional reaction
      *   Perceived obligations (if the agent *takes* them as motivating)
      *   Long-term plans
      *   *Crucially:* S is not static; deliberation can expand/refine it.
  3.  **Sound Deliberative Route:** This is KEY and often misunderstood. It's the mechanism that makes IRT *not* crudely subjectivist.
      *   **Function:** Explains how an agent can have reasons they *don't* currently recognize or feel motivated by. It connects φ-ing to S *via rational procedures*.
      *   **Includes:** Gathering information, correcting logical errors, means-end reasoning, considering consistency between elements of S, imagining outcomes vividly, understanding how achieving one element affects others. *Crucially:* **It starts from S** and works outwards. It does *not* involve adopting entirely new, alien elements *from outside* S based on external demands (like a categorical imperative).
      *   **Result:** If there's a sound deliberative route *from* A's current S to a motivation to φ, then "A has a reason to φ" is true (internal reason).
  4.  **Relation to Debates:**
      *   **Moral Motivation (Humean Theory):** Williams' IRT is *compatible* with Humeanism (beliefs alone can't motivate; desires are necessary), but it's a *distinct* thesis. Humeanism is about the *psychology* of motivation (what mental states cause action). IRT is about the *truth conditions* of reason statements (what *makes* "A has a reason to φ" true). Williams *uses* a broadly Humean view of motivation to *support* IRT: if external reasons existed, how could they possibly motivate? But IRT doesn't *depend solely* on Humeanism.
      *   **Categoricity of Morality:** Williams argues that if IRT is true, then *genuinely* categorical moral reasons (reasons applying to agents *regardless* of their S) **cannot exist**. Any *genuine* moral reason an agent has must be rooted, via sound deliberation, in their S. Kantian-style categorical imperatives are thus a "fiction" – claims that such reasons exist are either false or must be reinterpreted as internal (e.g., "You *would* care if you deliberated soundly from your S").

  **Auditing the Summary Sentence-by-Sentence:**

  1.  **"'An internal reason is a reason you have in virtue of the desires you actually have...'"**
      *   **Williams' Reaction:** Wince. **Problem:** Oversimplifies "S". While desires are *part* of S, S includes much more (evaluative dispositions, commitments, etc.). More importantly, it ignores the **sound deliberative route**. You can have an internal reason *not* because of desires you *actually* have *right now*, but because you *would* come to be motivated after *sound deliberation* starting from your S. The summary makes it sound like only *current, occurrent* desires count. That's too crude.

  2.  **"'...and an external reason is one that would apply to you no matter what you want.'"**
      *   **Williams' Reaction:** Accept. **Assessment:** This is the core definition Williams targets for criticism. It captures the intended meaning of the externalist claim.

  3.  **"'Williams's thesis is that all reasons are internal...'"**
      *   **Williams' Reaction:** Accept. **Assessment:** This is the core of "Internal Reasons Thesis" (IRT). Yes, Williams argues that *only* internal reasons exist; external reason statements are either false or must be reinterpreted as internal claims.

  4.  **"'...so if someone really doesn't care about something, they have no reason to do it, full stop.'"**
      *   **Williams' Reaction:** Wince significantly. **Problem:** This is a **major misrepresentation** stemming from ignoring the sound deliberative route. "Doesn't care" usually means *not currently motivated*. But Williams explicitly says someone can have a reason *even if they aren't currently motivated*, **provided** there is a sound deliberative route *from their S* to being motivated to do it. The "full stop" implies only *current* motivation matters, which Williams explicitly rejects. (e.g., The unaware father *does* have a reason to care for his child, even if he currently "doesn't care", because sound deliberation *from his S* – which likely includes valuing family ties or avoiding harm he'd recognize as his – *would* lead him to care).

  5.  **"'This makes him a Humean about moral motivation...'"**
      *   **Williams' Reaction:** Qualified acceptance, followed by a clarification. **Assessment:** Williams *is* often called a Humean about motivation, and he *does* hold that beliefs alone can't motivate – a desire-like element from S is needed. **However:** Calling him a Humean *about moral motivation* in *this context* risks conflating the distinct theses. His *reasons internalism* (IRT) is the primary claim here, which *relies on* a Humean view of motivation but isn't *identical* to it. The summary slides between the two.

  6.  **"'...a moral judgment only gives you a reason if you happen to want the relevant end...'"**
      *   **Williams' Reaction:** Wince. **Problem:** "Happen to want" is far too contingent and subjectivist. It ignores the work of the **sound deliberative route**. A moral judgment *might* give *you* a reason *if* accepting its truth is, or *could become via sound deliberation*, connected to your S. It's not about accidentally "happening" to want something; it's about whether the judgment can be integrated into your practical identity through rational procedures. Someone might not "happen to want" justice *now*, but sound deliberation *from* their existing concerns (e.g., valuing reciprocity, avoiding suffering they recognize) *could* lead them to want it. *Then* they have the reason.

  7.  **"'...which is why the categorical "ought" that the Kantians appeal to turns out to be a fiction.'"**
      *   **Williams' Reaction:** Accept. **Assessment:** This correctly states Williams' *conclusion* regarding Kantianism. If IRT is true, Kantian categorical imperatives (providing reasons *utterly* independent of S) cannot exist as genuine reason-giving facts. They are, Williams argues, a kind of fiction or misrepresentation.

  8.  **"'The standard objection is that morality is categorical and binds us whether or not we care, so there have to be external reasons;...'"**
      *   **Williams' Reaction:** Acknowledge, but reject its force. **Assessment:** This *is* the standard externalist objection. Williams *does* engage with it! His response is essentially: "You assert that morality *is* categorical and *does* bind us independently. But *why* should we believe this? What *explains* this binding force if not some connection to the agent's motivations? Merely asserting it doesn't make it true, and IRT provides a better explanation of how reasons actually function and motivate." He argues the externalist lacks a coherent story about how such reasons could motivate or why they apply *to this specific agent*.

  9.  **"'...and since Williams doesn't really answer this, the view is a minority position that most philosophers today reject.'"**
      *   **Williams' Reaction:** Strongly reject. **Problems:**
          *   **"Doesn't really answer this":** This is **false**. Williams *does* answer it, primarily by arguing that the externalist objection is question-begging (it just asserts the categoricity he denies) and lacks explanatory power. He thinks IRT provides the *correct* account of what reasons *are*.
          *   **Verdict on Minority Status:** While it's likely true that *more* philosophers accept externalism or hybrid views than accept pure Williams-style internalism, this verdict **does not follow logically from the preceding summary.** The summary, by misrepresenting S, ignoring the deliberative route, and falsely claiming Williams doesn't answer the objection, **stacks the deck against him.** The summary makes IRT look like crude subjectivism ("only if you happen to want it"), which *is* easy to reject. But Williams' actual view, with its rich S and robust deliberative route, is far more sophisticated and resilient. The verdict feels tacked on based on the author's externalist leanings and the distorted picture painted earlier.

  **Your Instincts Were Correct:**
  1.  **Humean Conflation:** Your friend *is* sliding. Williams is a Humean about motivation (beliefs need desires), and he *uses* this to support his distinct thesis about reasons (IRT). But they aren't the same thing. Calling IRT simply "Humeanism about moral motivation" in the summary blurs this crucial distinction.
  2.  **Verdict Stacking:** The last sentence **is** asserting the outcome. More importantly, the summary **was quietly carrying it the whole time** by:
      *   Reducing S to "desires you actually have" (ignoring breadth and deliberative expansion).
      *   Using phrases like "happen to want" and "full stop" (implying crude subjectivism).
      *   Falsely claiming Williams doesn't answer the categorical objection.
      *   Presenting the objection as a simple, decisive truth rather than a substantive point of contention.

  **What to Trust in the Summary:**
  *   The *basic definitions* of internal/external reasons (points 1 & 2, though internal is simplified).
  *   The core statement of Williams' *thesis* (point 3: all reasons are internal).
  *   Williams' *conclusion* about the Kantian categorical "ought" (point 7: it's a fiction).

  **What to Be Wary Of / Where the Summary Misleads:**
  *   The impoverished view of the agent's "subjective motivational set" (S).
  *   The complete omission and misunderstanding of the **sound deliberative route** (the heart of Williams' sophistication).
  *   The conflation of "Humean about motivation" with Williams' distinct "reasons internalism" (IRT).
  *   The claim that Williams offers no answer to the categorical objection (he does).
  *   The implication that IRT boils down to "no reason if you don't currently care" (it doesn't).
  *   The presentation of the categorical objection as an unanswerable knockdown argument.
  *   The final verdict, which is presented as a consequence of the summary's points but actually relies on the summary's *distortions* of Williams' view.

  Williams' view is subtle and easily caricatured. Your friend's summary, while capturing the headline conclusion, loses the crucial nuances (especially the deliberative route) that make IRT a serious and defensible position, even if it remains controversial. Your nagging doubts were spot-on.
