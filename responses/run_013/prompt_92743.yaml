prompt: |-
  My flatmate and I spent last night arguing about where to send our spare money — I want to give to something working on long-term risks, he says the only sane thing is to fund stuff that helps people now. He's perfectly happy to do expected value on bednets; it's only past a few decades that he says it breaks down, and his killer line, which he's now said about four times, is: 'if you can't estimate the probabilities, expected value is just a way of laundering your gut feelings — any number you put on the far future is made up.' Half of me thinks that's a real problem, half thinks it's a cheap way to dodge the argument. Can you lay out the different precise claims that line could be making, from the ones that are trivially true to the ones that would actually sink longtermism, and for each one say whether it's plausible and whether it really gets him to 'so we should just help people now'? Make it a list I can bring back to him.
reasoning: |-
  Okay, let me unpack this flatmate debate. The core tension is between immediate aid and long-term risk mitigation, crystallized in that "laundering gut feelings" critique. 

  First, I need to map the conceptual territory. The roommate accepts near-term expected value calculations (like bednets) but rejects them for far-future scenarios. His central objection seems epistemological: when probabilities become too speculative, EV frameworks might just disguise subjective biases as math. 

  I should disentangle this critique into layered claims. The weakest version is uncontroversial - no one denies that exact numbers for existential risk probabilities are guesstimates. But does that invalidate the entire longtermist project? Probably not, since rough models still beat complete neglect of future generations. 

  The stronger version might argue that uncertainty is so radical it voids any meaningful comparison between short-term and long-term interventions. But even here, we have tools like robust decision theory or ambiguity aversion that can handle deep uncertainty without collapsing to presentism. 

  What about his conclusion? Even if probability estimates are fuzzy, that doesn't automatically privilege near-term work. Some long-term threats might have such catastrophic potential that even tiny estimated probabilities dominate the calculus. And crucially, current actions lock in future trajectories - climate change being the obvious example. 

  The "gut feelings" charge cuts both ways too. Prioritizing visible suffering now often stems from emotional availability bias rather than rigorous analysis. At least longtermists attempt systematic modeling, however imperfect. 

  I'll structure this as tiered claims in the response: from trivially true (estimates are imprecise) to moderately true (some longtermist work may be oversold) to the nuclear option (complete incomparability). Each step needs scrutiny for whether it actually forces retreat to present-focused giving.
answer: |-
  Here's a breakdown of your flatmate's argument, moving from weakest to strongest claims, assessing their plausibility and whether they justify focusing solely on the present:

  ### The List: Dissecting "Any number for the far future is made up"

  1.  **Claim: "Estimates for far-future impacts involve significant uncertainty and guesswork."**
      *   **Precision:** Trivially True. Quantifying impacts 100+ years out (e.g., probability of AGI catastrophe, future population size, value of future lives, effectiveness of current interventions on the far future) relies heavily on models, assumptions, and expert judgment, not hard data.
      *   **Plausibility:** High. This is inherent to forecasting complex, unprecedented futures.
      *   **Does it sink longtermism?** No. Uncertainty ≠ meaninglessness. We make uncertain estimates all the time (e.g., climate models, economic forecasts, pandemic risks). Longtermism argues we *must* try despite uncertainty, as the stakes are enormous.
      *   **Does it justify 'help now'?** No. Near-term interventions (e.g., bednets) *also* involve significant uncertainty (effectiveness in *this* context, unexpected side effects, future malaria resistance, changing health systems). His own bednet calculation relies on estimates. The difference is degree, not kind.

  2.  **Claim: "Assigning probabilities to specific far-future scenarios is often impossible with any rigor."**
      *   **Precision:** Often True. Assigning a precise probability (e.g., "1.3% chance of AI extinction by 2070") often involves more art than science. The underlying mechanisms might be poorly understood.
      *   **Plausibility:** High for *specific point estimates*. Experts might struggle to justify a specific number.
      *   **Does it sink longtermism?** No. Longtermism doesn't require *precise* point estimates. It can use:
          *   **Ranges:** (e.g., 0.1% - 20% chance of catastrophe).
          *   **Comparisons:** (e.g., Risk X seems orders of magnitude more likely than Risk Y).
          *   **Robustness Checks:** (e.g., "Is this intervention valuable even under pessimistic/optimistic scenarios?").
          *   **Qualitative Prioritization:** Identifying classes of risk with potentially vast downsides.
      *   **Does it justify 'help now'?** No. While point estimates are hard, rough comparisons and identifying potentially existential threats are still possible and crucial. Ignoring them because precise numbers are hard is like ignoring climate change in the 1980s for the same reason.

  3.  **Claim: "Expected Value (EV) calculations for the far future are highly sensitive to subjective assumptions, easily manipulated to justify pre-existing biases."**
      *   **Precision:** True, and a significant challenge. Small changes in assumptions (discount rate, future population value, probability estimates) can drastically change the calculated EV. This *can* be used to launder biases.
      *   **Plausibility:** High. This is a well-known critique of very long-term EV calculations.
      *   **Does it sink longtermism?** Not necessarily, but it demands caution. Longtermists must:
          *   Be transparent about assumptions and sensitivity analyses.
          *   Focus on interventions robust across a range of plausible assumptions.
          *   Prioritize reducing risks with potentially infinite downsides (extinction) where even tiny probabilities dominate the calculation if the value of the future is vast.
          *   Acknowledge the limitations and use EV as *one tool* for prioritization, not a holy grail.
      *   **Does it justify 'help now'?** Weakly. Near-term EV *also* involves subjective assumptions (e.g., value of a life, counterfactuals). The sensitivity might be lower, but the principle remains. More importantly, if the *potential* stakes of the far future are astronomically higher, even highly uncertain models might indicate it's the priority. Ignoring it due to sensitivity might be the greater bias.

  4.  **Claim: "The uncertainty is SO radical and the models SO speculative that any attempt at quantitative comparison between near-term and far-term interventions is fundamentally meaningless."**
      *   **Precision:** The strongest version of the critique. Argues the uncertainties are incommensurable.
      *   **Plausibility:** Debatable. This is an epistemological claim. Some philosophers/decision theorists agree (emphasizing radical uncertainty), others argue for the possibility of "imprecise probabilities" or robust decision-making even under deep uncertainty. Longtermists argue the asymmetry of stakes (potential for near-infinite future value loss vs. finite near-term gains) makes comparison *necessary* despite uncertainty.
      *   **Does it sink longtermism?** Potentially, if true. If meaningful comparison *is* impossible, then longtermism's core quantitative argument collapses. Longtermists would need to rely on non-quantitative moral arguments (e.g., duties to future generations, avoiding extinction as a supreme priority).
      *   **Does it justify 'help now'?** Only partially, and not uniquely. If quantitative comparison *is* impossible, it doesn't automatically make "help now" the default winner. It creates a stalemate. Choosing "help now" in this scenario becomes a choice based on:
          *   **Epistemic Humility:** "We can't know about the future, so focus on what we *can* know."
          *   **Moral Certainty:** "Relieving known suffering *now* has clear moral weight."
          *   **Avoiding Hubris:** "We shouldn't gamble the present on speculative futures."
          However, longtermists can counter with:
          *   **Precautionary Principle:** "Radical uncertainty about potential catastrophe warrants preventative action."
          *   **Moral Asymmetry:** "Failing to prevent extinction is uniquely horrific, even if uncertain."
          *   **Lock-in Effects:** "Actions *now* (e.g., building AGI, emitting carbon) irreversibly shape the long-term future, forcing a choice."

  5.  **Claim: "Valuing potential future lives mathematically inherently involves unacceptable ethical assumptions."**
      *   **Precision:** A deeper philosophical critique implied by "any number... is made up." Assigning a finite value to a future life (or the entire future) for comparison is seen as ethically dubious or impossible.
      *   **Plausibility:** A valid ethical debate point. How *do* we value potential vs. actual lives? Is the aggregate value of the future truly vast, or is it discountable?
      *   **Does it sink longtermism?** No, but challenges its quantitative foundation. Longtermism can be defended on deontological grounds (duties to future persons) or by arguing that *if* future lives have positive value, then preventing extinction (which destroys all potential future value) is paramount, even without precise valuation.
      *   **Does it justify 'help now'?** Not directly. Valuing near-term lives also involves ethical assumptions. This critique challenges the *comparison* framework itself, not necessarily the priority of the present. It might lead to a non-utilitarian justification for focusing on the present (e.g., stronger obligations to identifiable individuals).

  ### Key Takeaways for Your Flatmate

  1.  **He's right about uncertainty & sensitivity:** Far-future EV is messy, uncertain, and sensitive. This is a challenge, not a knockout blow.
  2.  **His critique cuts both ways:** Near-term aid *also* involves significant estimation and uncertainty. Dismissing longtermism for uncertainty while accepting near-term EV is inconsistent unless he can show the uncertainty *qualitatively* differs in a way that voids long-term calculations entirely (Claim 4).
  3.  **Uncertainty ≠ Irrelevance:** The potential stakes (preventing human extinction/ensuring a flourishing future) are so vast that even low-probability, high-impact risks deserve serious consideration. Ignoring them because numbers are hard is arguably reckless.
  4.  **"Help now" isn't the default winner:** Even if quantitative longtermist EV fails, it doesn't automatically make near-term aid the best choice. It creates an argumentative stalemate resolved by other principles (moral priority of observable suffering, precaution, duties to the future).
  5.  **Longtermism isn't just EV:** While EV is a tool, core longtermist arguments are often moral/philosophical: the sheer potential scale of the future creates an overwhelming reason to safeguard it, especially from existential risks. Quantitative models are an attempt to operationalize this intuition, not its sole foundation.

  **What to Say to Him:** "You're right that putting exact numbers on the far future is incredibly hard and involves guesswork. But here's the thing: 1) We make uncertain estimates for near-term stuff too (like bednets!). 2) Ignoring potential catastrophes just because they're uncertain feels like burying our heads in the sand – the potential losses are astronomical. 3) Even if we can't calculate perfectly, we can still reason that preventing human extinction is probably more important than almost anything else, given what's at stake. Saying 'help now' is the *only* sane option isn't proven just because long-term EV is messy – that feels more like giving up on the future because it's hard to model." Use the list above to walk through the specific claims.
