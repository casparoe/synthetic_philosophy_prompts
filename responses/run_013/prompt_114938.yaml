answer: |-
  Below is a comprehensive plan for your 90-minute session on uncertain evidence in formal epistemology. The activity is designed to make participants experience the order-dependence problem in Jeffrey conditionalisation firsthand, without technical jargon until the debrief. I've refined your sketch for clarity, engagement, and pedagogical impact, using British English throughout.

  ### **Activity Overview**
  - **Core Problem**: Participants discover that updating on two pieces of uncertain evidence in different orders leads to divergent posteriors, despite identical priors and evidence. This surfaces the challenge of uncertain evidence (where propositions are not learned with certainty) and questions the assumption that evidence order "shouldn't matter."
  - **Mechanism**: Participants update credences using a mechanical "house rule" (Jeffrey conditionalisation) but are not told its name. The rule treats evidence as uncertain by fixing pre-update conditional probabilities. Dependence between glimpsed propositions is essential for divergence.
  - **Key Twist**: After individual updates, participants see a wall chart revealing order-dependent posteriors. A betting round pits the two order groups against each other to highlight subjective disagreement.
  - **Outcome**: Participants grasp that uncertain evidence creates ambiguity in belief updating, setting the stage for debrief on Jeffrey conditionalisation, its limitations, and philosophical implications.

  ---

  ### **Rules and Materials**
  #### **Rules for Participants**
  1. **Prior Credence**:  
     - Each participant starts with a prior credence \(P(H) = 0.5\) that a crate contains contraband (\(H\)).  
     - They know two dependencies:  
       - \(A\): "Sound through the wall is a diesel engine."  
         - \(P(A|H) = 0.9\), \(P(A|\neg H) = 0.1\)  
       - \(B\): "Smell of oil is present."  
         - \(P(B|H) = 0.7\), \(P(B|\neg H) = 0.3\)  
     - **Scoring**: A quadratic scoring rule incentivises honesty. For reported credence \(p\):  
       - If \(H\) is true: Score \( = 10 \times [1 - (1 - p)^2] + 10\) (baseline tokens).  
       - If \(H\) is false: Score \( = 10 \times [1 - p^2] + 10\).  
       - *(Tokens are hypothetical; scoring is resolved post-activity via a coin flip for \(H\) to avoid distraction.)*

  2. **Glimpses (Uncertain Evidence)**:  
     - Each participant receives two glimpses in random order (assigned publicly via shuffled cards):  
       - **Glimpse 1**: Either \(A\) or \(B\), with reliability \(r = 0.65\) (e.g., "You are 65% sure the sound was a diesel engine").  
       - **Glimpse 2**: The other proposition, same reliability \(r = 0.65\).  
     - **House Rule for Updating (Jeffrey Conditionalisation)**:  
       - After a glimpse of proposition \(X\) (where \(X\) is \(A\) or \(B\)):  
         1. Set new credence in \(X\) to the reliability: \(P_\text{new}(X) = r\).  
         2. Update \(P_\text{new}(H)\) using **fixed conditional probabilities** from immediately before the glimpse:  
            \[
            P_\text{new}(H) = P_\text{new}(X) \times P_\text{old}(H|X) + P_\text{new}(\neg X) \times P_\text{old}(H|\neg X)
            \]  
       - *Crucial: Participants must record \(P_\text{old}(H|X)\) and \(P_\text{old}(H|\neg X)\) before each update.*

  3. **Order Randomisation**:  
     - 7 participants update in order \(A \rightarrow B\); 7 in order \(B \rightarrow A\) (public card draw).  
     - **Dependence Check**: \(A\) and \(B\) are dependent (prior correlation \(\rho \approx 0.48\)), ensuring divergence.

  4. **Wall Chart and Betting Round**:  
     - After updates, participants post final \(P(H)\) on a wall chart, grouped by order.  
     - **Betting Round**:  
       - Each group bets against the other on \(H\) using tokens.  
       - Group 1 (\(A \rightarrow B\)): Sells a binary option (pays 1 token if \(H\) true).  
       - Group 2 (\(B \rightarrow A\)): Buys the option.  
       - Trading price negotiated freely (e.g., Group 1 min sell price ≈ 0.659; Group 2 max buy price ≈ 0.641).  
       - *No \(H\) resolution—focus on willingness to bet given divergent beliefs.*

  #### **Materials**
  - **Tokens**: 10 tokens per participant (symbolic; use poker chips or sticky notes).  
  - **Worksheets**:  
    - Prior: \(P(H)\), \(P(H|A)\), \(P(H|\neg A)\), \(P(H|B)\), \(P(H|\neg B)\).  
    - Update tables for two steps (see recipe below).  
  - **Randomisation**: 14 cards (7 labelled "A then B", 7 "B then A") in a hat.  
  - **Wall Chart**: Whiteboard with two columns: "A→B Posterior" and "B→A Posterior".  
  - **Calculator**: For participants (phone or physical).  
  - **Spreadsheet**: Instructor’s divergence check (provided below).

  #### **Recipe for Numbers and Divergence Check**
  - **Prior Setup**:  
    - \(P(H) = 0.5\)  
    - \(P(A|H) = 0.9\), \(P(A|\neg H) = 0.1\)  
    - \(P(B|H) = 0.7\), \(P(B|\neg H) = 0.3\)  
    - Reliability \(r = 0.65\) for both \(A\) and \(B\).  

  - **Why Dependence Matters**:  
    - \(A\) and \(B\) are correlated via \(H\) (prior \(P(A \cap B) = 0.34 \neq P(A)P(B) = 0.25\)).  
    - Updating on \(A\) changes \(P(B)\), altering \(P(H|B)\) for the next update (and vice versa).  

  - **Divergence Verification (Instructor’s Spreadsheet)**:  
    - **Order \(A \rightarrow B\)**:  
      - Step 1 (Update \(A\)):  
        \[
        P_1(H) = 0.65 \times P(H|A) + 0.35 \times P(H|\neg A) = (0.65 \times 0.9) + (0.35 \times 0.1) = 0.62
        \]  
        Recompute conditionals for \(B\):  
        \[
        \begin{align*}
        P_1(B) &= P(B|H)P_1(H) + P(B|\neg H)P_1(\neg H) = (0.7 \times 0.62) + (0.3 \times 0.38) = 0.548 \\
        P_1(H|B) &= \frac{P(B|H)P_1(H)}{P_1(B)} = \frac{0.7 \times 0.62}{0.548} \approx 0.792 \\
        P_1(H|\neg B) &= \frac{P(\neg B|H)P_1(H)}{P_1(\neg B)} = \frac{0.3 \times 0.62}{0.452} \approx 0.411
        \end{align*}
        \]  
      - Step 2 (Update \(B\)):  
        \[
        P_2(H) = 0.65 \times P_1(H|B) + 0.35 \times P_1(H|\neg B) \approx (0.65 \times 0.792) + (0.35 \times 0.411) \approx 0.659
        \]  

    - **Order \(B \rightarrow A\)**:  
      - Step 1 (Update \(B\)):  
        \[
        P_1(H) = 0.65 \times P(H|B) + 0.35 \times P(H|\neg B) = (0.65 \times 0.7) + (0.35 \times 0.3) = 0.56
        \]  
        Recompute conditionals for \(A\):  
        \[
        \begin{align*}
        P_1(A) &= P(A|H)P_1(H) + P(A|\neg H)P_1(\neg H) = (0.9 \times 0.56) + (0.1 \times 0.44) = 0.548 \\
        P_1(H|A) &= \frac{P(A|H)P_1(H)}{P_1(A)} = \frac{0.9 \times 0.56}{0.548} \approx 0.920 \\
        P_1(H|\neg A) &= \frac{P(\neg A|H)P_1(H)}{P_1(\neg A)} = \frac{0.1 \times 0.56}{0.452} \approx 0.124
        \end{align*}
        \]  
      - Step 2 (Update \(A\)):  
        \[
        P_2(H) = 0.65 \times P_1(H|A) + 0.35 \times P_1(H|\neg A) \approx (0.65 \times 0.920) + (0.35 \times 0.124) \approx 0.641
        \]  

    - **Divergence**: \(A \rightarrow B \approx 0.659\) vs. \(B \rightarrow A \approx 0.641\) (difference \(\approx 0.018\)).  
    - **Spreadsheet Formula**: Use Excel/Google Sheets to compute:  
      - Priors: `P(H)`, `P(A)`, `P(B)`, `P(H|A)`, `P(H|~A)`, `P(H|B)`, `P(H|~B)`.  
      - Order \(A \rightarrow B\):  
        - Cell for \(P_1(H)\): `=0.65 * P(H|A) + 0.35 * P(H|~A)`  
        - Recompute \(P_1(B)\), \(P_1(H|B)\), \(P_1(H|\neg B)\) using priors and \(P_1(H)\).  
        - Cell for \(P_2(H)\): `=0.65 * P_1(H|B) + 0.35 * P_1(H|~B)`  
      - Repeat for \(B \rightarrow A\), swapping \(A\) and \(B\). Verify \(|P_2(H)_{A→B} - P_2(H)_{B→A}| > 0.015\).

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  | Time      | Activity                                                                                                                                                               | Instructor Role                                                                                     |
  |-----------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
  | **0-5**   | **Introduction**: Explain the crate scenario (\(H\)), prior \(P(H) = 0.5\), and glimpse mechanics. Emphasise scoring rule incentives.                                 | Set up wall chart; distribute tokens and worksheets.                                                |
  | **5-15**  | **Prior Setup**: Participants calculate and record prior conditionals (\(P(H|A)\), etc.) and state \(P(H) = 0.5\) for scoring.                                         | Clarify conditional probabilities; verify priors.                                                   |
  | **15-20** | **Order Assignment**: Public card draw assigns update order (\(A \rightarrow B\) or \(B \rightarrow A\)).                                                              | Shuffle/draw cards; ensure even split.                                                              |
  | **20-35** | **First Glimpse & Update**:<br>- Half glimpse \(A\) (65% reliable), half glimpse \(B\).<br>- All update \(P(H)\) using house rule, record intermediate posterior.       | Circulate to clarify rule: *"Fix pre-glimpse conditionals!"*                                        |
  | **35-50** | **Second Glimpse & Update**:<br>- Receive second glimpse (other proposition).<br>- Update \(P(H)\) again, record final posterior.                                      | Stress recomputing conditionals (e.g., after \(A\), \(P(H|B)\) changes). Assist with calculations. |
  | **50-55** | **Wall Chart**: Participants post final \(P(H)\) in order-grouped columns.                                                                                            | Plot results; highlight clusters (expected: ~0.659 vs. ~0.641).                                     |
  | **55-65** | **Betting Round**:<br>- Group 1 (\(A \rightarrow B\)) sells "H-true" options; Group 2 (\(B \rightarrow A\)) buys.<br>- Negotiate token prices (e.g., 0.65/token).     | Facilitate trading; highlight disagreements. No \(H\) resolution.                                   |
  | **65-90** | **Debrief**: Structured discussion.                                                                                                                                    | Guide Q&A; use slides for key points.                                                               |

  ---

  ### **Debrief (25 Minutes)**  
  **Goals**: Name the rule, explain the mechanics, explore implications, and acknowledge open issues.  

  1. **What Happened?** (5 mins)  
     - Recap: Identical priors + evidence → divergent posteriors due to update order.  
     - **Rule Reveal**: "You used **Jeffrey conditionalisation** (probability kinematics) for uncertain evidence."  
     - Key feature: Fixes pre-update conditionals \(P(H|X)\) when setting \(P_\text{new}(X) = r\).  

  2. **Why Order Dependence?** (5 mins)  
     - **Fixed Conditionals vs. Ordinary Conditioning**:  
       - Ordinary conditioning (certain evidence): Updates \(P(H)\) by setting \(P(X)=1\), using current \(P(H|X)\).  
       - Jeffrey: Allows \(P(X) < 1\), but fixing \(P(H|X)\) ignores that \(P(H|X)\) *changes* after other updates.  
     - **Root Cause**: Dependence between \(A\) and \(B\) means updating \(A\) alters \(P(B)\) and \(P(H|B)\), so the second update uses distorted conditionals.  

  3. **Available Repairs and Costs** (5 mins)  
     - **Ordinary Conditioning**: Requires certain evidence (not an option here).  
     - **Simultaneous Update**: Set \(P_\text{new}(A)\) and \(P_\text{new}(B)\) jointly. *Cost*: Needs joint reliability (e.g., "70% sure of \(A \land B\)"), which glimpses don’t provide.  
     - **Richard Jeffrey’s Response**: Order dependence isn’t a bug—it reflects genuine ambiguity in how evidence is absorbed.  

  4. **What the Activity Cannot Settle** (5 mins)  
     - **Is Order Dependence Defective?**  
       - *Yes*: If evidence is order-invariant, posteriors should agree.  
       - *No*: Temporal order of evidence may matter (e.g., "I trusted the engine sound more after smelling oil").  
     - **Harder Cases**:  
       - **Uncertain Conditional Evidence**: E.g., "If the sound is diesel, then contraband is likely" (reliability 65%). This involves updating on \(A \rightarrow H\), not \(A\) or \(H\)—much trickier!  
       - **Non-Binary Evidence**: Multi-proposition updates exacerbate the problem.  

  5. **Predictable Challenges** (5 mins)  
     - **First-Run Snags**:  
       - **Calculation Errors**: Participants forget to recompute conditionals after first update (e.g., use prior \(P(H|B)\) for second glimpse). *Mitigation*: Worksheet prompts.  
       - **Betting Confusion**: Groups may not see why they should trade. *Mitigation**: Pre-calculate example posteriors to motivate betting ranges.  
       - **Small Divergence**: A 0.018 difference may seem minor. *Mitigation**: Stress that divergence is systematic and grows with dependence.  
     - **Philosophical Pushback**: "Why not just use Bayes?" Clarify that uncertain evidence demands new tools.

  ---

  ### **Instructor Notes**  
  - **Why This Works**: Participants *feel* the arbitrariness of order via personal calculation and peer disagreement, making uncertain evidence visceral.  
  - **Flexibility**: Adjust numbers for larger divergence (e.g., \(P(A|H) = 0.95\), \(P(B|H) = 0.8\), reliability \(r = 0.6\)).  
  - **Ethos**: Emphasise that formal epistemology grapples with messy, real-world evidence—this activity shows why.  

  This plan balances experiential learning with conceptual rigor, ensuring participants leave uneasy about uncertain evidence and curious about solutions. Let me know if you'd like refined worksheets or spreadsheet templates!
