  - 15-20 min: Sceptic enters and presents rival rule.
  - 20-25 min: Archivist searches notes for evidence.
  - 25-30 min: Facilitator reveals bent-rule player and their notebook, resolves tokens.
  - 30-80 min: Debrief (as structured above).

  **Scoring:**
  - Each student starts with 3 tokens.
  - They bet 1 token on their prediction.
  - If correct (the bent rule's output), they get their token back plus one extra (net +1, so 4 tokens total).
  - If wrong, they lose the token (so have 2 tokens).

  **Debrief mapping:**
  - Group discussion and prediction: the apparent obviousness of the rule (addition).
  - Sceptic's presentation: the underdetermination by evidence.
  - Archivist's failure: no behavioral or linguistic fact settles the rule.
  - Bent-rule player's notebook: the private mental item doesn't fix meaning either.
  - Philosophical moves: sceptical challenge, failure of straight solutions (dispositions, community, private language), the practice-based solution.

  **What the game cannot reproduce:**
  - It only shows underdetermination by finite evidence. The stronger claim (no fact of the matter even with infinite evidence and mental states) must be explained by the facilitator.

  **Handling "this is just Hume/grue":**
  - Emphasize that this is a problem about the meaning of the rule itself and applies to one's own mind, not just future predictions.

  This should create the moment we're aiming for: the revelation that even the private notebook doesn't settle the meaning.
