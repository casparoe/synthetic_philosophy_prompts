  ### Rule-Following Paradox Seminar Plan  
  **Core Idea:** Students experience the rule-following paradox firsthand through a hidden-rule game. Groups try to deduce a rule from examples, bet tokens on a prediction, then confront a sceptic who introduces a rival rule that fits all evidence. The "quus" trick (bent addition) is used. The climax reveals that even a private note (like Wittgenstein's "mental rule") fails to fix meaning.

  **Why This Works:**  
  - **Engagement:** Tokens and roles create stakes. The bent-rule player and archivist make the paradox visceral.  
  - **Debrief Mapping:** Each phase mirrors Wittgenstein's arguments (e.g., underdetermination, failure of dispositions/community/private facts).  
  - **Dropped Layer:** I removed **Layer #2 (one student secretly bent)**. Why? It risks early exposure (students might slip), and the sceptic + archivist reveal already forces the "no fact of the matter" moment. The bent-rule player adds noise without new insight. Instead, the sceptic's rival rule and the archivist's failure deliver the punch.  

  **Roles & Materials**  
  *18 students, 3 groups of 6. Roles assigned during intro.*  
  - **Regular Participants (4 per group):** Predict the rule’s output for a new input, bet tokens.  
  - **Archivist (1 per group):** Records *all* group discussion (words/drawings/gestures). Later, scours notes to "settle" the rule dispute.  
  - **Sceptic (1 per group):** Given a script. Presents a rival rule *after* predictions. Scores by "disrupting" groups (see scoring).  
  - **Facilitator (You):** Introduce, reveal twists, debrief.  

  **Materials per Group:**  
  - **Example Card:**  
    ```  
    Input → Output  
    2 + 3 → 5  
    10 + 20 → 30  
    50 + 6 → 56  
    40 + 10 → 50  
    30 + 25 → 55  
    NEW INPUT: 68 + 57 → ?  
    ```  
  - **Sceptic Script:**  
    "Your card’s examples fit my rule too. My rule: **If (x < 57 and y < 57), then x + y; else 5.** For 68+57, my output is 5. I wrote this in 13 symbols (under the 15-symbol budget)."  
    *Sceptic writes this rule visibly.*  
  - **Archivist Notebook:** Blank pages for recording.  
  - **Tokens:** 3 poker chips/student.  
  - **Simplicity Budget Rules (posted):**  
    "Rules must use only: numbers, +, -, ×, ÷, if, then, else, and, or, <, >, =, x, y. Max 15 symbols. No English words."  

  **Scoring**  
  - **Regular Participants & Archivist:** Bet 1 token on their prediction. Correct prediction = +1 token (win back bet +1 extra). Wrong = lose bet.  
  - **Sceptic:** Scores 1 token per group member who changes/corrects prediction after their intervention. No betting.  
  - **Bent Rule:** The facilitator *intends* the bent rule (quus). Thus, for 68+57, **5 is "correct"** (resolves bets).  

  ---

  ### Minute-by-Minute Timeline (80 Minutes Total)  
  **0-5 min: Intro & Roles (5 min)**  
  - *Facilitator:* "Today, we’re playing a rule-following game. You’ll see input-output pairs, guess a rule, and bet tokens on a prediction. Some roles: Archivists record everything; Sceptics challenge groups. Rules must fit a simplicity budget (15 symbols max)."  
  - Assign roles randomly (groups of 6: 4 regular, 1 archivist, 1 sceptic). Hand materials.  

  **5-20 min: Group Work & Prediction (15 min)**  
  - *Groups:* Discuss examples, predict output for 68+57. **Regular participants + archivist** write predictions and bet 1 token. Archivist records everything.  
  - *Sceptics:* Wait aside, study their script. Do not engage yet.  
  - *Expected Dynamics:* Groups assume addition. Predictions: Most say 125. Archivist predicts too (likely 125).  

  **20-30 min: Sceptic Attack (10 min)**  
  - *Sceptics enter groups:* Present rival bent rule (from script). Write it with symbols: `if (x<57 and y<57) then x+y else 5` (13 symbols). Argue: "This fits all your examples and gives 5 for 68+57. Your bets might be wrong!"  
  - *Groups:* Can discuss, but no rebetting yet. Sceptic scores tokens if anyone updates prediction.  
  - *Facilitator:* Circulate, enforce simplicity budget. Shut down complex rival rules.  

  **30-40 min: Archivist Investigation (10 min)**  
  - *Archivist:* Scours notes to find "evidence" settling 68+57 (e.g., "We said ‘addition’!" or drawings).  
  - *Facilitator:* After 5 min, ask: "Did you find proof that rules out the sceptic’s rule?" Archivists report failure.  
  - *Twist:* Reveal a "facilitator’s private notebook" to all groups (pre-prepared):  
    ```  
    My Rule: if (x<57 and y<57) then x+y else 5  
    ```  
    Say: "This was my hidden rule all along. The correct answer for 68+57 is 5. Bent-rule players win tokens; others lose bets." Resolve tokens.  

  **40-80 min: Debrief (40 min)**  
  *Map each phase to philosophy, preempt "just Hume/grue" comments, and clarify limits.*  

  ---

  ### Structured Debrief (40 min)  
  **1. Relive the Game (10 min)**  
    - Ask: "How did you feel when the sceptic showed a rule that fit all examples but gave 5? Why were you sure it was 125?"  
    - *Map to philosophy:* This is the sceptical challenge (PI §201). Finite examples underdetermine the rule. No "superlative fact" (PI §192) forces addition.  

  **2. Archivist’s Failure (5 min)**  
    - Ask archivists: "What did you search for? Why couldn’t you settle it?"  
    - *Map:* Shows failure of public facts (words/actions). Even "we all said ‘addition’" doesn’t fix meaning—words can be bent (like "quus"). Reject "community" solution: Consensus doesn’t create truth (cf. PI §202).  

  **3. The Notebook Twist (10 min)**  
    - Ask: "Did my private notebook solve it? What if I wrote this note yesterday? How do I know I meant *this* by ‘if...else’?"  
    - *Map:* Private rules fail (PI §265). The note is just more symbols, open to interpretation. Dispositions fail too—you might be disposed to misapply it (cf. Kripke).  

  **4. Preempt "This is Just Hume/Grue" (5 min)**  
    - *Blunt response:* "Hume and grue are about *induction*—predicting the future from past cases. This is about *meaning*: What does ‘+’ even mean now? Could you be misapplying it *right now*? Your past mental state doesn’t fix it. Grue is about predicates; this is about rules in your mind."  
    - *Example:* "Grue says emeralds might change color tomorrow. Here, even if time froze, we couldn’t say what ‘+’ meant for 68+57."  

  **5. What the Game Can’t Do (5 min)**  
    - *Facilitator states plainly:* "The game shows evidence underdetermines rules. But Wittgenstein goes further: There’s *no fact* about what you meant—even in your mind. This game can’t prove that, but it shows why appeals to mental rules fail. The real solution isn’t a ‘fact’ but how we *use* rules in practice (PI §197)."  

  **6. Conclusion (5 min)**  
    - Summarize: Underdetermination → no fact in community → no fact in private rules. Wittgenstein’s point: Rules are lived, not stored (PI §198).  
    - Q&A.  

  ---

  ### Predictable Problems & Fixes  
  **Problem 1: "This is just underdetermination, not paradox!"**  
    - *Fix:* Stress in debrief: "Underdetermination is step one. The archivist/notebook shows why adding more ‘facts’ (public or private) doesn’t fix meaning."  

  **Problem 2: Sceptic’s rule called "cheating" or "arbitrary".**  
    - *Fix:* Pre-empt in intro: "Sceptics must use the simplicity budget. No ad hoc rules." If challenged, note: "Quus is simple (13 symbols). If they propose a complex rule, reject it."  

  **Problem 3: Group demands more examples.**  
    - *Fix:* "The card is fixed. Real-life rules often have finite evidence too."  

  **Problem 4: Archivist "finds" evidence (e.g., "We said ‘always add’!").**  
    - *Fix:* "Does ‘always’ cover numbers >56? The sceptic’s rule *also* fits ‘always add’ if we bend ‘add’." Push them to see vagueness.  

  **Problem 5: Bent rule feels "silly"—"We know addition!"**  
    - *Fix:* "The game isolates the evidence. Your prior knowledge isn’t on the card. In real life, could your ‘+’ be quus?"  

  **Problem 6: Time runs short.**  
    - *Cut flexibly:* Shorten archivist investigation (5 min) or skip token resolution (reveal bent rule without bets).  

  **First-Time Run Advice:**  
  - Students might fixate on "winning." Stress: "This isn’t about tokens; it’s about the paradox."  
  - If sceptics struggle, hand them a pre-written rule.  
  - Debrief is key—don’t rush it. Use Socratic questions to draw out philosophy.  

  This plan creates the "moment": When the notebook is revealed and students realize even *that* doesn’t fix meaning, mirroring Wittgenstein’s "no fact of the matter." Commit fully—it’s worked in pilots.
