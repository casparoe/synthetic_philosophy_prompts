  Okay, the user is describing a frustrating argument with their friend Dan about King Arthur's historicity. They've noticed a pattern where later sources become more detailed and confident despite lacking new evidence, which they also see in Troy and Exodus narratives. They want a name for this phenomenon where copies of a single source create an illusion of multiple attestations, and uncertainty gets stripped away over time.

  Hmm, this is actually describing a compound phenomenon with two interconnected parts. The first part is "pseudocorroboration" - where derivative works get mistaken for independent sources. The second part is "narrative accretion" - where retellings paradoxically gain false precision. The user is sharp to notice these often travel together.

  The telephone analogy is clever but indeed inverted here - instead of distortion through transmission, we get false clarification. The psychological mechanism seems to be about audiences preferring concrete details and storytellers obliging by filling gaps. Later writers treat Geoffrey's inventions as facts simply because they're presented that way.

  I should emphasize this isn't about intentional fraud necessarily - medieval writers operated with different standards of evidence. The key is how confidence gets misinterpreted as reliability. The boundary cases would be: when does plausible reconstruction become fabrication? When do multiple derivatives cross into pseudocorroboration?

  For Exodus/Troy parallels, I can mention how archaeological claims sometimes retroactively validate literary accounts. The user's frustration about "confidence doing the work of evidence" is precisely the core issue. They'll appreciate knowing this pattern has academic recognition in textual criticism.
answer: |-
  You've hit on something profoundly important about how historical traditions evolve, and your frustration is completely understandable—Dan's argument exemplifies a very common but deeply flawed historical reasoning pattern. What you're describing is essentially a two-part phenomenon, but both parts are facets of a single, well-recognized process in textual criticism and historiography: **the cumulative fabrication of historical certainty through narrative transmission and source dependency.**

  There isn't one single, universally agreed-upon term that covers *both* aspects perfectly in their combined form as you've observed them (the illusion of multiple sources *and* the stripping of uncertainty), but the core concepts have established names:

  1.  **Source Dependency Misinterpreted as Corroboration:** This is often called **"pseudocorroboration"** or the fallacy of **"derivative authority."** It occurs when multiple later sources, all ultimately dependent on a single, often dubious or lost original (like Geoffrey's mythical "ancient British book"), are mistakenly interpreted as independent witnesses providing corroborating evidence. Each new writer who copies, embellishes, or reworks Geoffrey isn't offering new testimony; they are amplifying and diffusing *his* testimony (or invention). The sheer *volume* of later mentions creates an illusion of widespread, independent agreement ("Look how many sources mention Arthur!") when, in reality, it's an echo chamber amplifying one voice. This is precisely what happened with Arthur: the "crowd of witnesses" is Geoffrey and his literary descendants. This fallacy is rampant in the study of legendary figures and ancient texts where sources are scarce.

  2.  **The Loss of Hedging and Gain of False Precision:** This process is frequently described as **"narrative accretion"** or **"concretization"** within legendary traditions. As a story is retold over generations, especially when it moves from fragmented, potentially oral, early mentions (like the vague Welsh poems or brief Annales Cambriae entry) into formalized literary or historical narratives (like Geoffrey's Historia, then Malory, etc.), several things happen:
      *   **Ambiguity is Resolved:** Vagueness ("fought somewhere") is unsatisfying. Storytellers and historians naturally (and often unconsciously) fill in the gaps to create a coherent, compelling narrative. "Somewhere" becomes "Badon." "A leader" becomes "King Arthur of Camelot."
      *   **Hedges Disappear:** Tentative language ("it is said," "some believe," "tradition holds") gets dropped. Assertions become declarative statements of fact ("Arthur defeated the Saxons at Badon in 516 AD").
      *   **Details are Added:** Specific dates, places, names, motives, and events are invented or inferred to flesh out the story and make it feel more historically grounded. Geoffrey didn't just name Arthur; he gave him a full biography, family tree, and kingdom.
      *   **Confidence Replaces Evidence:** Crucially, as you astutely noted, this *added confidence and detail is not based on new evidence*. It's based on narrative necessity and the desire for a complete story. Yet, this very confidence *becomes* the perceived evidence for later audiences and even later writers. The concrete date *feels* like proof because it's specific, even though it was invented centuries after the fact with no documentary basis. This is the "opposite of telephone" effect: noise (uncertainty) is filtered out, and signal (apparent clarity) is amplified, but it's a false signal.

  **The Combined Phenomenon & What to Call It:**

  When these two processes intertwine – pseudocorroboration creating an illusory weight of evidence, and narrative accretion/concretization dressing that single source's invention with increasing confidence and false precision – we see the mechanism behind many persistent historical legends, including Arthur, the details of Troy's fall, or the specific route/date of the Exodus.

  While there isn't one perfect, universally applied term covering the *entirety* of this two-step mechanism, the most accurate label for the *core dynamic* you're identifying – **where the confidence acquired by a story through repeated, derivative retelling and elaboration is mistaken for historical evidence** – is often referred to as:

  *   **The "Inflation of Certainty" in Tradition Formation.**
  *   Or, more technically, **the "Concretization of Legend through Derivative Transmission."**

  **How to Explain it to Dan:**

  You could say: "Dan, the argument from 'many sources' is flawed here due to **pseudocorroboration**. Almost all those later, detailed sources tracing back centuries ultimately depend on one guy, Geoffrey of Monmouth, who claimed a source no one else ever saw. They aren't independent witnesses; they're copies and elaborations. Furthermore, the story didn't gain *real* evidence over time; it gained **false precision through narrative accretion**. The earliest mentions are vague and uncertain. The later, detailed versions with dates and kingdoms weren't uncovering new facts; they were filling in the blanks and dropping the 'maybes,' making the story *seem* more certain and factual precisely *because* it got retold so much. That acquired confidence isn't proof; it's a byproduct of the story being popular and repeated. Mistaking that confidence for evidence is the core error."

  **Boundary Cases:**

  *   **Not Simple Hearsay:** Hearsay is unreliability from indirect reporting. This is more specific: it's about *chains* of transmission creating false corroboration *and* systematically stripping away uncertainty to fabricate apparent historical detail.
  *   **Not Just an Unreliable Source:** It's about how an *entire tradition* evolves *from* a potentially unreliable source, amplifying its claims and masking its origins.
  *   **Where it Applies:** It's most potent with figures/events in the "proto-historical" period (late antiquity/early Middle Ages) or ancient history where contemporary evidence is scarce or non-existent, allowing literary invention to dominate the narrative (Arthur, Trojan War details, Exodus specifics, Robin Hood details).
  *   **Where it Might Not Apply:** If genuinely new, contemporary evidence *does* emerge later (e.g., a new archaeological discovery or a previously unknown contemporary document surfaces that corroborates specific details *not* in the earlier, derivative sources), then later precision *could* be valid. The key is the *source* of the new detail. In the Arthurian case, the new details (like Camelot, the Round Table, specific battles beyond the earliest vague mentions) arose from literary imagination, not new evidence.

  You've identified a fundamental pattern in how unreliable traditions gain the *appearance* of historical reliability. Dan's argument mistakes the volume and confidence of the *tradition* for the volume and quality of the *evidence*. The confidence *is* the illusion.
