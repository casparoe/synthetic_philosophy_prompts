prompt: |-
  I'm presenting at our game theory reading group next Thursday and I want a Q&A prep sheet. The room: mostly applied micro people who run lab experiments and care about whether a change in assumptions moves an equilibrium prediction, two philosophers of economics who read the formal literature closely, and one logician who does proof theory and will not let a hand-wavy definition slide. Roughly twelve people, and this crowd treats common knowledge as a harmless idealization you tack on at the end of a model, so they're going to be irritated that I'm trying to make it carry the whole load.

  The thesis I'm defending: in the standard examples everyone uses (coordinated attack, backward induction in long finite games, the usual stories about why coordination can fail when everyone knows the relevant facts), common knowledge of rationality is doing almost none of the work. What's actually doing the work is common knowledge of the *state space* — of what each player treats as the set of relevant contingencies, i.e. which features of the situation they're even partitioning on. Once you make the state space explicit, you can drop common knowledge of rationality in most of these cases without losing the prediction, and the coordination failures people attribute to missing common knowledge are really failures of a shared state space. So my claim is that the interesting epistemic condition was never rationality, it was relevance.

  Give me the 7-8 objections I will actually get from this room, ordered by how much damage they do (not just how likely), each phrased the way one of these three groups would actually put it — the experimentalists will push on whether any of this is testable or whether I've just changed the words, the phil-of-econ people will ask whether I've merely relabeled the problem, the logician will go straight at my definition of the state space and at whether common knowledge of it is even well defined when the state space itself is what's in question. For each objection: a reply I can give in about two minutes, and an honest note on where that reply is soft. Tell me which ones I should just concede up front to save time, and which single objection I have to survive for the paper to stand. And finish with the one question I'm hoping nobody in the room asks.
reasoning: |-
  We are preparing a Q&A prep sheet for a presentation defending the thesis that common knowledge of the state space (i.e., common knowledge of the set of relevant contingencies) is the key factor in coordination problems, not common knowledge of rationality.

  The audience consists of:
  - Applied microeconomists (experimentalists) who care about changes in assumptions and equilibrium predictions.
  - Philosophers of economics who read formal literature closely.
  - One logician (proof theory, strict on definitions).

  We expect objections from each group. We need 7-8 objections, ordered by damage (most damaging first). For each:
     - Phrased as the group would say it.
     - A 2-minute reply.
     - An honest note on where the reply is soft.
     - Indicate which to concede and which are critical to survive.

  Finally, the one question we hope nobody asks.

  **Thesis Recap:** 
  Common knowledge of the state space (what each player treats as relevant contingencies) is doing the work, not common knowledge of rationality. We can drop common knowledge of rationality and keep common knowledge of the state space to get the same predictions. Coordination failures are due to a lack of shared state space, not missing common knowledge of rationality.

  **Ordering by Damage:** We want the most damaging objections first. The most damaging would be those that challenge the core claim or show that the thesis is incoherent or already known. We consider:

  1. Logician: Challenges the definition of the state space and whether common knowledge of it is well-defined when the state space is in question. (This could be fatal if not addressed because it attacks the foundation.)

  2. Philosophers: Argue that we've merely relabeled the problem (common knowledge of rationality is replaced by common knowledge of state space, but the issue of how we achieve common knowledge remains).

  3. Experimentalists: Question whether this distinction is testable or just a change in words (if not testable, then it's not useful for applied work).

  4. Philosophers: Point out that rationality is still needed to derive actions, so how can we drop it?

  5. Experimentalists: If we can't test it, why should they care? How does this change their experiments?

  6. Logician: In the state space, how do we represent the players' knowledge about the state space without circularity?

  7. Philosophers: How does this account for the standard results in epistemic game theory that show common knowledge of rationality leads to backward induction, etc.?

  8. Experimentalists: In lab settings, we control the state space (via instructions). Why do we still see coordination failures?

  **Ordered List (by Damage):**

  1. **Logician (Most Damaging):** "Your entire argument hinges on common knowledge of the state space. But if the state space includes what players are partitioning on, and common knowledge of the state space requires that they all partition on the same set of contingencies, then how do you avoid circularity? Specifically, the state space must include the players' knowledge about the state space itself, leading to an infinite regress. How is this well-defined?"

     - *Reply (2 min):* "We can define the state space as a primitive in the model, fixed by the modeler, and then common knowledge of that state space is well-defined because it's a fixed set of states. The circularity only arises if we try to make the state space self-referential in a way that includes the knowledge structure about itself. But in our model, the state space is given exogenously, and common knowledge is defined relative to that fixed space. We are not requiring the players to have common knowledge about the state space's own definition, but rather about the set of states that are possible. This is similar to the standard approach in Aumann structures where the state space is fixed and common knowledge is defined by the partition structure."

     - *Soft Spot:* This reply assumes the state space is fixed and given, but the logician might argue that in reality, the state space is not given and must be constructed by the players, leading back to circularity.

     - *Critical to survive:* Yes. If we can't define common knowledge of the state space without circularity, the thesis collapses.

  2. **Philosophers:** "You claim that common knowledge of rationality is doing almost none of the work and that we can drop it. But rationality is what connects the state space to actions: without rationality, how do you even derive that players will play the equilibrium? You've only shifted the problem: now we need common knowledge of the state space and rationality, but you've removed rationality and haven't explained how actions are determined."

     - *Reply:* "In many coordination problems, the key issue is whether players can coordinate on the same equilibrium. The state space determines which signals or events they condition on. If they condition on the same things, they can coordinate without needing to know that everyone is rational. For example, in coordinated attack, if both generals partition the state space in the same way (so they have the same understanding of when a message is delivered), then they can coordinate even without common knowledge of rationality. Rationality is still assumed, but it's individual rationality and doesn't need to be common knowledge. The common knowledge of the state space ensures they have the same understanding of the possible worlds, which enables coordination."

     - *Soft Spot:* The reply still requires individual rationality. The objection is that without common knowledge of rationality, we might not get the equilibrium play. The reply doesn't fully address how we get the equilibrium without common knowledge of rationality.

     - *Concede?* No, but we must clarify: we are not dropping rationality altogether, only common knowledge of it. We assume individual rationality and common knowledge of the state space.

  3. **Experimentalists:** "How is this testable? In the lab, we already control the state space by giving instructions. If we tell subjects exactly what the possible states are and ensure they know that everyone knows, etc., but we still see coordination failures, doesn't that contradict your thesis? And if we can't test your idea, what's the point?"

     - *Reply:* "We can test it by varying the common knowledge of the state space. For example, in a coordination game, we can have treatments where the state space (what features are relevant) is made common knowledge versus treatments where it's not. If my thesis is right, we should see better coordination when the state space is common knowledge, even without common knowledge of rationality. Also, note that in many experiments, the state space is not fully controlled because subjects might have different interpretations of the instructions. We can design experiments to explicitly manipulate the common knowledge of the state space and measure coordination success."

     - *Soft Spot:* Designing such experiments might be tricky because it's hard to manipulate common knowledge of the state space without also affecting other things. Also, if subjects already have common knowledge of the state space in the lab (via instructions) but still fail to coordinate, that would be a problem.

     - *Critical?* Not the most critical, but if we can't test it, the applied value is low. We must have a testable implication.

  4. **Philosophers:** "This sounds like you're just relabeling. In standard models, common knowledge of rationality already implies a fixed state space (since rationality is defined relative to a state space). So you haven't changed the model, you've just shifted the label from 'rationality' to 'state space'."

     - *Reply:* "No, because in standard models, the state space is often left implicit. We are making it explicit and showing that it's the state space that is doing the heavy lifting. Moreover, we can have common knowledge of the state space without common knowledge of rationality. For instance, in coordinated attack, if the generals have common knowledge of the state space (the message delivery times) but not of each other's rationality, they can still coordinate. But if they don't have common knowledge of the state space, even with common knowledge of rationality, they might fail. So the key is the state space."

     - *Soft Spot:* The example of coordinated attack might be contested because the standard analysis already shows that common knowledge of the message delivery is needed. So we might be restating an existing point.

  5. **Logician:** "In your model, how do you define the state space? Does it include the players' knowledge? If so, then the state space must be defined in terms of the players' knowledge, which is circular. If not, then how do you represent the players' uncertainty about what others know?"

     - *Reply:* "We use a standard state space model (à la Aumann) where the state space includes all the relevant exogenous parameters and the players' knowledge is represented by partitions. We do not require the state space to include the knowledge structure as part of the state. The knowledge structure is defined by the partitions, which are fixed. So the state space is a set of states, each state specifying the values of the parameters (like whether a message was delivered) and the players' actions or types, but the partitions are given as part of the model. This avoids circularity."

     - *Soft Spot:* This is the standard approach, but the logician might press on whether this is realistic when players are uncertain about the state space itself. Also, if the state space doesn't include the knowledge structure, how do we model players who are uncertain about what others know? We rely on the partitions to capture that.

     - *Critical?* Yes, because if we can't represent the players' knowledge without circularity, the model fails.

  6. **Experimentalists:** "In practice, we already assume common knowledge of the game structure (which includes the state space) in our experiments. So if your thesis is true, why do we still observe coordination failures in the lab? For example, in the centipede game, we often see early termination (consistent with backward induction) even though we control the state space. But sometimes we don't. How does your thesis explain that?"

     - *Reply:* "Even in the lab, subjects might not have the same mental model of the state space. For instance, they might doubt that others understand the game, or they might consider possibilities outside the experimenter's control. If your instructions do not induce common knowledge of the state space, then coordination can fail. But note: in the centipede game, if the state space includes the rationality of the players, then common knowledge of the state space would require common knowledge of rationality. So in that case, the two are intertwined. My point is that when the state space does not require including rationality (as in coordinated attack), we can see that it's the state space that matters. In games where rationality is part of the state space, we cannot disentangle them. But we can design games where rationality is not a contingency, only physical events are, and then we can test the effect of common knowledge of the state space without common knowledge of rationality."

     - *Soft Spot:* This might be seen as backtracking: if in some games the state space includes rationality, then we haven't dropped common knowledge of rationality. So the thesis might only apply to a subset of games.

  7. **Philosophers:** "Epistemic game theory has shown that common knowledge of rationality leads to backward induction in finite games of perfect information. If we drop common knowledge of rationality, how do we get backward induction? And if we don't, then your claim that we can drop it without losing the prediction is false."

     - *Reply:* "In backward induction, we need common knowledge of the game tree (which is part of the state space) and of rationality. But note: if we have common knowledge of the game tree and of the fact that players are rational, but not necessarily common knowledge of rationality (i.e., we don't have an infinite hierarchy of beliefs about rationality), we might still get backward induction. However, recent work has shown that common knowledge of rationality is not necessary; sometimes mutual knowledge to a finite level suffices. Moreover, the state space must include the structure of the game. Without common knowledge of the state space (the game tree), we cannot even begin. So again, the state space is fundamental. If we have common knowledge of the state space and individual rationality, we might get backward induction without the full common knowledge of rationality."

     - *Soft Spot:* The exact epistemic conditions for backward induction are known to require common belief in rationality (at least up to the length of the game). So we cannot fully drop it. Our claim must be that the state space is a prerequisite and that without it, even common knowledge of rationality is insufficient.

  **Concessions:**
  - Concede that in some games (like the centipede game) the state space might include rationality, and then we cannot avoid having common knowledge of rationality. But stress that in other cases (like coordinated attack), it's purely about the state space.

  **The Critical Objection to Survive:** The logician's first objection (circularity in defining common knowledge of the state space). If we cannot define it without circularity, the whole thesis is in trouble.

  **The Question We Hope Nobody Asks:**
  "Can you give an example of a coordination problem where we have common knowledge of the state space but not of rationality, and coordination succeeds, and then if we remove common knowledge of the state space (while keeping common knowledge of rationality) coordination fails? And can you prove this formally?"

  Why we fear it: Because if we don't have a clear, formal example that satisfies both conditions and shows the effect, our thesis is weak. We need such an example to prove our point. Moreover, it might be hard to construct because in many models, common knowledge of rationality is intertwined with the state space.

  **Final Ordered List of 7 Objections:**

  1. Logician: Circularity in defining common knowledge of the state space.
  2. Philosophers: How do you derive actions without common knowledge of rationality?
  3. Experimentalists: How is this testable? And why do we see coordination failures in the lab if we control the state space?
  4. Philosophers: You've just relabeled the problem.
  5. Logician: How do you define the state space without including knowledge, and then represent knowledge?
  6. Experimentalists: We already assume common knowledge of the game structure, so why do we see variation in coordination?
  7. Philosophers: How do you explain backward induction without common knowledge of rationality?

  **Summary of Replies and Soft Spots:**

  1. **Logician (Circularity):** 
     - Reply: State space is fixed and exogenous; common knowledge is defined relative to it without self-reference.
     - Soft: If players must construct the state space, circularity reappears.

  2. **Philosophers (Rationality needed for actions):**
     - Reply: Individual rationality suffices; common knowledge of state space ensures shared understanding for coordination.
     - Soft: In some games (like backward induction) common knowledge of rationality might be necessary.

  3. **Experimentalists (Testability):**
     - Reply: Design experiments that manipulate common knowledge of state space and measure coordination.
     - Soft: Hard to manipulate without confounds; if lab instructions already provide it, why failures?

  4. **Philosophers (Relabeling):**
     - Reply: We disentangle state space from rationality and show state space is primary in examples like coordinated attack.
     - Soft: In coordinated attack, the standard analysis already emphasizes the message delivery common knowledge.

  5. **Logician (Defining state space and knowledge):**
     - Reply: State space is a set of states with partitions for knowledge, standard in Aumann models.
     - Soft: If the state space doesn't include knowledge, then how do we model uncertainty about knowledge? We rely on the partitions.

  6. **Experimentalists (Why variation in lab?):**
     - Reply: Even in the lab, common knowledge of state space may not be achieved due to subjects' mental models.
     - Soft: This might seem like an ad hoc explanation.

  7. **Philosophers (Backward induction):**
     - Reply: Common knowledge of the game tree (state space) and individual rationality might suffice, but note that the state space includes the game tree and we don't always need full common knowledge of rationality.
     - Soft: The literature shows that common belief in rationality is necessary for backward induction.

  **Concede:**
  - We should concede that in games where the state space includes rationality (like the centipede game), we cannot avoid common knowledge of rationality. But emphasize that our point is that the state space is the foundational element.

  **Critical to Survive:** Objection 1 (logician's circularity) is the most critical. If that holds, the thesis falls.

  **Feared Question:** 
     - "Can you give a formal example where common knowledge of the state space without common knowledge of rationality leads to coordination, and removing common knowledge of the state space (while keeping common knowledge of rationality) leads to failure? Prove it."
answer: |-
  Below is your Q&A prep sheet, structured to handle the most damaging objections first. I've distilled 8 objections based on the room's composition, ordered by potential damage to your thesis (with #1 being the most critical). Each objection is phrased authentically for the relevant group, followed by a concise reply, an honest soft-spot assessment, and a concession flag. I also identify the single objection you *must* survive for your paper to stand and the question you hope nobody asks.

  ---

  ### **Core Thesis Recap**
  You argue that in standard examples (coordinated attack, backward induction, etc.), coordination failures stem from a lack of **common knowledge of the state space** (i.e., shared partitioning of relevant contingencies), not from missing common knowledge of rationality (CKR). CKR is redundant if the state space is common knowledge. The key epistemic condition is "relevance," not rationality.

  ---

  ### **Ordered Objections & Replies**  
  *(Most damaging → least damaging)*

  1. **Logician (Damage: Fatal if unaddressed)**  
     **Objection:** "You define the state space as 'the set of relevant contingencies,' but if the state space itself is what’s in question, common knowledge of it is circular. How do players achieve common knowledge of the state space without presupposing an infinite regress of metaknowledge? Your framework doesn’t resolve this—it just moves the problem from rationality to relevance."  
     **Reply (2 min):** "Common knowledge of the state space is defined *externally* by the modeler, not internally by the players. We start with a fixed state space Ω (e.g., possible message-delivery times in coordinated attack), and partitions are exogenously imposed. This is standard in Aumann structures—no circularity because Ω isn’t self-referential. Players only reason *within* Ω, not *about* Ω."  
     **Soft Spot:** This assumes the modeler can objectively define Ω, but in real interactions, players may disagree on what’s "relevant," leading to subjective state spaces. Your reply dodges the logician’s core point: if Ω is contested, common knowledge fails.  
     **Concede?** No—this is the hill to die on. If you lose here, your thesis collapses.

  2. **Philosophers of Economics (Damage: High—undercuts novelty)**  
     **Objection:** "You’re just relabeling the problem. In standard epistemic models, CKR already presupposes a shared state space (since rationality is defined over beliefs about states). By ‘dropping CKR,’ you’re implicitly relying on it—because rationality is still needed to map states to actions. All you’ve done is hide CKR inside ‘relevance.’"  
     **Reply (2 min):** "Not at all. CKR requires common knowledge of *optimization*, while I only need common knowledge of *what’s being optimized over*. For example, in coordinated attack, if generals share the state space (message-delivery events), they coordinate with mere *mutual knowledge* of rationality. CKR is overkill; the state space does the work."  
     **Soft Spot:** You haven’t fully disentangled rationality—players still need *individual* rationality to choose best responses. If the philosophers press, they’ll note that "relevance" might implicitly encode rational expectations.  
     **Concede?** Partially: Acknowledge individual rationality is still needed, but stress CKR isn’t.

  3. **Experimentalists (Damage: High—threatens practical relevance)**  
     **Objection:** "In the lab, we control the state space via instructions (e.g., ‘here are the possible moves’). Yet we still see coordination failures! If your thesis is right, why do these happen? And how do we test your ‘relevance’ vs. CKR? It sounds untestable—like you’re swapping labels without new predictions."  
     **Reply (2 min):** "You *don’t* fully control the state space—subjects may add contingencies you didn’t specify (e.g., ‘Does the other player *understand* the instructions?’). Test this by varying how state spaces are communicated: Treatments where state spaces are explicitly common knowledge (e.g., common priors over events) vs. not. My model predicts fewer failures in the former, even without CKR."  
     **Soft Spot:** Your reply assumes experimenters can *induce* common knowledge of Ω, which is hard to verify. If subjects default to CKR, you can’t isolate "relevance."  
     **Concede?** Concede testability is challenging, but emphasize it’s falsifiable with careful designs.

  4. **Logician (Damage: Medium-High—attacks foundations)**  
     **Objection:** "Your state space Ω includes ‘contingencies players partition on,’ but partitions are defined over Ω. This is circular: Ω must contain the partitions themselves, leading to a type-theoretic mess. How is this well-founded without a fixed-point theorem?"  
     **Reply (2 min):** "We avoid circularity by separating Ω (objective states, e.g., ‘message sent at t=1’) from partitions (subjective awareness). Partitions are *functions* on Ω, not elements of Ω. This is standard in modal logic (e.g., Kripke frames)—no self-reference."  
     **Soft Spot:** In dynamic games, players update partitions based on events, which *could* force Ω to include knowledge states. Logicians may demand a syntactic (proof-theoretic) definition you haven’t provided.  
     **Concede?** No—argue this is a modeling choice, not a flaw.

  5. **Philosophers of Economics (Damage: Medium—questions applicability)**  
     **Objection:** "Backward induction in centipede games requires CKR to rule out irrationality at later nodes. If you drop CKR and keep only common knowledge of the state space, players might defect early ‘just in case’ the other is irrational. Your approach loses the BI prediction."  
     **Reply (2 min):** "BI fails when players doubt the state space (e.g., ‘Does my opponent see the same payoffs?’). With shared Ω, mutual knowledge of rationality suffices for BI. Case in point: Lab experiments show BI holds when state spaces are transparent (e.g., visual game trees), even without CKR."  
     **Soft Spot:** Epistemic game theory (e.g., Aumann’s BI theorem) shows CKR *is* necessary for BI in some frameworks. Your appeal to "mutual knowledge" is hand-wavy.  
     **Concede?** Concede CKR may be needed for BI in *some* models, but stress state-space issues are primary in empirical failures.

  6. **Experimentalists (Damage: Medium—challenges utility)**  
     **Objection:** "Even if you’re right, how does this help us? We already approximate common knowledge in the lab. If ‘relevance’ is the issue, we’ll just make state spaces common knowledge too—but that’s just another layer of idealism. Your thesis doesn’t change how we model or test equilibria."  
     **Reply (2 min):** "It shifts your focus: Instead of stressing CKR in designs (e.g., public quizzes), ensure state spaces are unambiguous. For example, in public-goods games, highlight contingencies like ‘how many others contribute.’ This is more practical than inducing CKR, which requires infinite recursion."  
     **Soft Spot:** Experimentalists already try this—your advice feels incremental. You lack evidence that "relevance" is easier to achieve than CKR.  
     **Concede?** Concede it’s an incremental insight, but argue it clarifies confounding variables.

  7. **Philosophers of Economics (Damage: Low—semantic quibble)**  
     **Objection:** "‘Relevance’ is vague. In standard models, the state space *includes* rationality (e.g., types incorporate rationality). By excluding it, you’ve redefined ‘state space’ to exclude beliefs, which is arbitrary and ignores decades of epistemic game theory."  
     **Reply (2 min):** "State spaces should exclude beliefs when possible. Rationality isn’t a contingency—it’s a behavioral assumption. Coordinated attack works with physical contingencies (message deliveries), not mental ones. I’m generalizing that insight."  
     **Soft Spot:** Many philosophers view rationality as part of the state (e.g., Harsanyi types). Your definition may seem ad hoc.  
     **Concede?** Concede "relevance" is context-dependent but defend it as a useful idealization.

  8. **Experimentalists (Damage: Low—friendly pushback)**  
     **Objection:** "If common knowledge of the state space is so crucial, why do we see successful coordination in the wild without it? E.g., markets converge without shared partitions. Your thesis overstates the need for formal common knowledge."  
     **Reply (2 min):** "Coordination often emerges from repeated interactions or focal points, which *build* shared state spaces over time. But in one-shot, high-stakes cases (e.g., military coordination), failures match my model. I’m explaining limits, not claiming it’s always needed."  
     **Soft Spot:** You’re moving the goalposts—your thesis initially targeted "standard examples" (one-shot games), not adaptive settings.  
     **Concede?** Concede that evolution/focal points can compensate.

  ---

  ### **Summary & Strategy**
  - **Must-Survive Objection:** #1 (Logician’s circularity charge). If you can’t defend a non-circular foundation for the state space, your thesis fails.  
  - **Concessions to Save Time:**  
    - Partially concede #3 (experimentalists’ testability concerns) by admitting design challenges.  
    - Concede #5 (philosophers’ BI point) as a place where CKR may play a role.  
    - Concede #8 (experimentalists’ real-world coordination) to avoid overclaiming.  
  - **The Question You Hope Nobody Asks:**  
    *"Can you formalize a game where common knowledge of the state space alone (without CKR) yields coordination, and show that removing it (while keeping CKR) causes failure? Prove it without sneaking in rationality through the back door."*  
    **Why you fear it:** Your argument relies on narrative examples (e.g., coordinated attack), but a formal model might reveal that rationality is still doing hidden work. Constructing a clean proof without rationality is notoriously hard (e.g., in coordinated attack, individual rationality is still needed to choose "attack" in the right state). If asked, pivot to your examples and admit formalism is ongoing work.

  ---

  **Final Prep Advice:** Focus energy on #1–#3. For the logician, rehearse defining Ω as exogenous. For philosophers, stress the mutual-knowledge loophole. For experimentalists, offer a concrete test (e.g., a lab variation of coordinated attack). Good luck!
