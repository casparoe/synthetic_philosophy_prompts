prompt: |-
  I host a small metaphysics podcast, and next week's guest defends a view she calls network realism. On her account, universals are immanent — wholly present in each of their instances — and a universal's identity is exhausted by its position in a single network of determinable–determinate and similarity–difference relations; there is no intrinsic quiddity marking one universal off from another, only place in the network. The network itself, she says, is neither a further universal nor a set of universals but a primitive structure, and she holds that once the one-over-many argument is properly regimented it establishes less than its proponents suppose. Draft eight to ten interview questions that press the view rather than let her restate it. I want at least one question each on: whether her position can distinguish a world from its mirror image in which two universals swap every intrinsic character they have, and whether that scenario is even intelligible on her terms; what individuates the primitive structure itself, given that she cannot call it a universal without a fresh one-over-many; what does the work of instantiation if the tie between a particular and a universal is neither itself a universal nor a brute relation; and how sparse her realism is meant to be, i.e. what excludes disjunctive and negative properties once intrinsic character has been given up. For each of the first three, add a follow-up keyed to the answer she is most likely to give — she will probably deny that the mirror-image scenario is coherent, so make that follow-up cost her something. Close with one question about what she would accept as evidence against the view.
reasoning: |-
  Okay, the user hosts a small metaphysics podcast and has an upcoming guest who advocates for network realism. They need 8-10 interview questions that challenge the guest's view rather than letting her restate it. The user specified four key areas: the mirror-image world problem, individuation of the primitive structure, the instantiation tie, and sparsity concerns about disjunctive/negative properties. They also want follow-ups for the first three points and a closing question about evidence against the view.

  Hmm, this is a sophisticated metaphysics request. The user clearly understands the technical nuances - they're using precise terminology like "immanent universals," "determinable-determinate relations," and "one-over-many argument." Their focus on pressing objections suggests they want a substantive debate, not just an exposition. 

  Let me unpack their core concerns systematically. First, the mirror-world scenario: if universals have no intrinsic quiddity, just network position, swapping two universals might leave reality unchanged. But the guest will likely deny this scenario's coherence. The follow-up needs to make that denial costly - perhaps by showing it collapses into idealism or makes consciousness inexplicable. 

  Second, the structure's individuation: if the network isn't a universal or set, what grounds its uniqueness? A likely response is that structures are primitive identity-bearers. The follow-up could press how this avoids a regress or why structures don't themselves need individuation. 

  Third, instantiation: if the particular-universal tie isn't relational or brute, what is it? She might call it "non-relational grounding." The follow-up should challenge whether this just disguises brute facts. 

  Fourth, sparsity: without intrinsic natures, what blocks disjunctive/negative properties? This questions her realism's boundaries. 

  For the closing, asking about counterevidence forces her to show the view's testability. 

  I'll draft questions that crystallize these tensions while anticipating her defenses. The mirror-world follow-up should corner her: if structure defines properties, and swapping changes nothing observable, does consciousness then not supervene on physics? That would be a heavy cost. 

  The structure follow-up must prevent "primitiveness" from being a dodge - maybe by asking why multiple identical structures are impossible. For instantiation, pressing whether "grounding" is substantively different from bruteness. 

  User's depth suggests they'll appreciate precise metaphysical jabs. No fluff - just targeted objections wrapped as questions.
answer: |-
  Here are 9 core questions (+ embedded follow-ups) designed to press Network Realism, targeting your specified areas and closing with falsifiability:

  1.  **On the Mirror World & Intelligibility:** You argue universals lack intrinsic quiddity and are individuated *solely* by their position in the primitive structural network. This seems to entail that a world where two universals (say, Charge and Mass) swap *all* their relational positions within the network – every similarity, difference, determinable/determinate link – is indistinguishable from our world. Is that correct? Does this scenario even represent a *genuine possibility* on your view, or is it incoherent?
      *   *(Likely Response Follow-Up: She denies coherence)* If the swap scenario is incoherent because the structure *defines* the universal, doesn't this imply that the identity of *every particular instance* of a universal is also *exhaustively* determined by its position within the total concrete network of *that particular world*? If so, how do you avoid the consequence that *no* universal (e.g., Redness) is literally the *same* entity across different instances or different possible worlds, collapsing your realism into a form of extreme nominalism or even idealism where properties are world-bound aspects of the concrete whole?

  2.  **On Individuating the Primitive Structure:** You posit the network structure itself as primitive – neither a universal nor a set. But structures themselves seem to need individuation. What makes *this specific* network structure the one that exists in our world, rather than a permuted one (like the mirror world, if coherent) or a completely different structure? If you appeal to the *actual pattern* of relations instantiated, doesn't this just reduce the structure to the collection of its relata (the universals and their relations), undermining its primitiveness and inviting a new "one-over-many" for structures?
      *   *(Likely Response Follow-Up: She emphasizes primitiveness/bruteness)* If the structure's identity is primitive and brute, how is this fundamentally different from accepting brute quiddities for individual universals? Doesn't positing a brute, individuated structure simply relocate the problem of individuation to a higher level, offering no explanatory advantage while adding a unique, non-repeatable entity that seems alien to a realist ontology of repeatables?

  3.  **On the Instantiation "Tie":** If universals are wholly present in their instances, and the tie between a particular (e.g., this apple) and a universal (e.g., Redness) is *not* itself a universal (like a relation of "exemplification") and *not* a brute fundamental relation, what *metaphysical category* does this "instantiation" belong to? What *work* is it doing beyond just noting the brute fact that "this particular exemplifies *this* universal *here*"? Isn't denying it's a relation or a universal tantamount to saying it's a fundamental, unanalyzable aspect of reality – which seems identical to calling it "brute"?
      *   *(Likely Response Follow-Up: She describes it as non-relational grounding or a mode)* If instantiation is a non-relational "grounding" or "mode" of the particular's being, doesn't this risk dissolving the distinction between the particular and the universal? If the universal is wholly present *in* the particular *via* this non-relational tie, in what robust sense does the universal retain its identity *as a distinct entity* from the particular? Isn't this perilously close to a trope theory where properties are non-repeatable aspects *of* the particular?

  4.  **On Sparsity & Exclusion (Disjunctive/Negative Properties):** Without intrinsic quiddities, what principle excludes disjunctive universals (e.g., *Being Green-or-Square*) or negative universals (e.g., *Not-Red*) from being genuine elements of your structural network? If the network position defines the universal, couldn't we *define* a position for "Green-or-Square" based on its similarity links to Green things and Square things? What stops the network from becoming indefinitely dense and gerrymandered if *only* structural position matters?

  5.  **The Scope of "Position":** Does the "position in the network" *only* include relations to *other* universals (second-order relations), or does it *also* essentially include the pattern of instantiation in particulars (first-order facts)? For example, is the position of Mass defined *only* by its relations to Charge, Energy, etc., and determinables like *Scalar Quantity*, or *also* by the fact that massive objects attract each other, resist acceleration, etc. (facts involving particulars)? If the latter, how is this consistent with the universals being immanent *in* those particulars without circularity?

  6.  **Regimentation of One-Over-Many:** You claim a properly regimented "one-over-many" argument establishes less than proponents think. Specifically, what *does* it successfully establish that your view accepts, and what is the *crucial misstep* proponents make in inferring more (like intrinsic quiddities or transcendent universals) that your network realism avoids?

  7.  **Internal Relations & Necessity:** Are the relational positions in the network *internal* to the universals? That is, is it *necessary* that Redness stands in *exactly* those similarity/difference relations to other colors? If so, doesn't this reintroduce a kind of intrinsic essence for each universal (i.e., its essential relational profile), which seems close to the quiddity you reject? If not, what constrains how universals *can* relate, and how does change in relational structure affect universal identity?

  8.  **Network Identity Over Time/Worlds:** You likely accept that the network structure *could* have been different (e.g., no electromagnetism). What constitutes the *identity* of the network structure across such differences? If universals are defined by their position, and positions change (e.g., a universal loses some relations), is it the *same* universal? If the structure changes significantly, is it the *same* primitive structure, or a different one? What grounds trans-structural or trans-world identity for the structure itself?

  9.  **Falsifiability / Counterevidence:** What observable or conceivable state of affairs would you accept as compelling evidence *against* Network Realism? For instance, would discovering a fundamental property that demonstrably *lacked* any non-trivial similarity/difference relations or determinable/determinate links to any other properties count against the view? Or is the network's existence sufficiently flexible to accommodate any conceivable configuration of properties?

  **Key Pressing Strategy:**
  *   **Mirror World:** Forces her onto the horns of a dilemma: accept indistinguishable worlds (undermining robust realism) or deny coherence (risking world-bound properties/collapse into non-realism). The follow-up pushes hard on the coherence denial.
  *   **Structure Individuation:** Challenges the explanatory value of "primitiveness." The follow-up directly compares it to the quiddities she rejects.
  *   **Instantiation:** Presses the category problem and risks collapsing the particular/universal distinction. The follow-up links it to trope theory.
  *   **Sparsity:** Directly confronts the consequence of abandoning intrinsic character for limiting realism.
  *   **Falsifiability:** Ensures the view isn't vacuous or unfalsifiable.

  These questions demand clarification of core commitments and highlight potential tensions or costs within Network Realism, pushing beyond mere exposition. Good luck with the interview!
