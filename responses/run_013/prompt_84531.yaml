prompt: |-
  I chair the standing classification committee of a national health agency. Each year we receive roughly fifteen petitions to add a condition to the schedule of recognized conditions; inclusion obliges the agency to develop a clinical guideline and to fund treatment, and our decisions are published and routinely contested. The committee has nine members — clinicians, an epidemiologist, a health economist, a patient representative, and me — and we sit for a single afternoon per batch of petitions. None of us is trained in the philosophy of medicine, and we have begun to contradict ourselves: we have admitted conditions on the strength of a biomarker and refused others diagnosed by reported symptoms alone, without any account of why the two were treated differently.

  I want a decision procedure we can actually run, as a checklist we can keep in front of us. Give me the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure stops with a refusal; and the points at which it must hand the decision to a person, because the question is one of values rather than facts. It should say what to do when the evidence is missing or contested, which is most of the time, and whether the burden of proof runs against inclusion or in its favor. Ground it in what the philosophy of medicine actually knows about the concepts of health and disease, in particular the dispute between those who hold that disease is a value-free matter of biological malfunction and those who hold that harm is constitutive of it, so that our recurring disagreements are located in the procedure rather than left to whoever speaks last. One member has proposed that we ask, of every petition, whether the condition would be a misfortune for the person under any social arrangement; tell me whether that test does any work, where it fails, and what should replace it. The agency's chief medical officer ratifies our decisions and may send a case back once, so the procedure should be defensible to her as well as to the petitioners.

  Then run it on three petitions: a genetic variant that produces a measurable abnormality but is currently asymptomatic and has no treatment shown to alter outcomes; a chronic condition diagnosed by reported symptoms alone, with no identified lesion or biomarker, whose petitioners describe severe impairment; and a condition whose impairment, on the petitioners' own account, exists only relative to a particular social arrangement, so that the disability lies in the environment rather than in the body. Include the case whose verdict will be unwelcome to us — we are under budget pressure and the chair is skeptical of expanding the schedule — and tell me why we should accept it anyway. Finally, say what the procedure cannot do, and which of the three it cannot settle.
reasoning: |-
  Okay, let me start by understanding the user's problem. They chair a committee that decides whether to add conditions to a recognized schedule, which involves significant implications like funding treatments and developing guidelines. The committee faces contradictions in their decisions—sometimes admitting conditions based on biomarkers and rejecting those based on symptoms alone without clear reasoning. 

  First, I need to recall the philosophical debates in medicine. The key is balancing the naturalist view (disease as biological dysfunction) and normativist view (harm as essential). The user mentioned a member's proposal about whether a condition is a misfortune in any social context. That's a nod to normativism, but it's problematic because many conditions are context-dependent. For example, infertility might not be a problem in a society that doesn't value biological children. So that test might not work universally. Instead, the decision procedure needs to incorporate both dysfunction and harm without being too rigid.

  Next, the user wants a practical checklist. The steps should start with verifying if the petition is complete, then move to defining the condition clearly. This is crucial because contested evidence is common. The committee needs to assess if there's a consistent diagnostic criterion, even if it's symptom-based. Then, evaluating biological dysfunction using validated indicators like biomarkers or physiological tests. If that's absent, they need to look for harm and impairment through impact on daily activities. Here's where values come in—assessing harm requires committee judgment, so it should be a point where human input is necessary.

  Budget pressure is a real constraint. The user mentioned one verdict will be unwelcome because of skepticism about expanding the schedule. For the genetic variant case, even though it's asymptomatic, if the biomarker predicts future harm, it might be included. But if there's no treatment, it could be deferred, which might save costs now but could lead to future petitions. The chronic symptom-based condition without a biomarker—if harm is severe, they might include it despite the lack of biomarker, which could be a tough decision under budget pressure. The environmental disability case might be refused if the dysfunction isn't inherent, but that aligns with the procedure's emphasis on biological dysfunction. Still, the committee has to justify that the impairment is socially contingent, which might be defensible to the chief medical officer.

  The user also needs the procedure to handle missing evidence. Burden of proof should favor inclusion only when harm is clear and dysfunction is plausible. For contested evidence, requiring a majority vote makes sense. The three test cases highlight different challenges. The genetic variant might be deferred, the chronic condition included due to severe harm, and the environmental one refused. The chronic condition's inclusion might be unwelcome due to budget, but the procedure justifies it based on harm and plausibility of dysfunction, even without biomarkers.

  Finally, the procedure's limitations: it can't resolve fundamental philosophical disagreements or predict future scientific advances. In the environmental case, if the committee is split on whether social contingency negates disease status, it might not reach consensus. But the procedure forces explicit discussion of values, reducing arbitrariness. This makes decisions more defensible to petitioners and the chief medical officer.
answer: |-
  Here is a decision procedure grounded in medical philosophy, designed for practicality, defensibility, and resolution of recurring contradictions. It integrates key insights from the naturalist (dysfunction-focused) and normativist (harm-focused) perspectives.

  **The Decision Procedure: A Step-by-Step Checklist**

  1.  **Is the Petition Complete?**
      *   *Question:* Does the petition provide:
          *   A clear definition of the proposed condition?
          *   Proposed diagnostic criteria?
          *   Evidence for prevalence?
          *   Evidence describing its impact on individuals?
          *   Any evidence regarding pathophysiology or biomarkers?
      *   *Sufficient Answer:* Yes, all core elements are addressed, even if evidence is preliminary or contested.
      *   *Insufficient Answer:* No, critical elements (especially definition/diagnostic criteria or impact) are missing. *→ STOP. REFUSE (with clear request for resubmission addressing deficiencies).*
      *   *Burden:* On the petitioner to provide a minimally complete case.

  2.  **Can the Condition Be Defined & Diagnosed Consistently?**
      *   *Question:* Is there a proposed diagnostic criterion (symptom cluster, biomarker, lesion, functional test) that is:
          *   Reliably observable/measurable?
          *   Applied consistently across settings?
          *   Distinguishable from normal variation or other conditions?
      *   *Sufficient Answer:* Yes, using validated tools/practices (even if symptom-based). OR: A plausible, testable criterion is proposed, supported by preliminary evidence/clinical consensus.
      *   *Insufficient Answer:* No, the criteria are entirely subjective, vague, or overlap indistinguishably with normal experiences. *→ STOP. REFUSE (due to inability to reliably identify a defined population).*
      *   *Burden:* On the petitioner to propose a workable diagnostic approach. Contested evidence requires committee assessment (Step 5).

  3.  **Is There Evidence of Underlying Biological Dysfunction?**
      *   *Question:* Does the evidence indicate a deviation from typical species-level functional organization (e.g., measurable lesion, biomarker abnormality, pathophysiological pathway disturbance, consistent impairment of a universal human capability)?
      *   *Sufficient Answer:* Yes (e.g., validated biomarker, specific lesion, well-characterized genetic variant impacting function, consistent impairment of basic physiological process like thermoregulation or oxygen transport).
      *   *Insufficient Answer:* No convincing evidence presented, or evidence solely describes subjective states without link to function. *→ Proceed to Step 4.*
      *   *Burden:* On the petitioner to present evidence. Absence moves burden to demonstrating significant harm/impairment (Step 4). Contested evidence requires committee assessment (Step 5).

  4.  **Is There Significant Harm/Impairment?**
      *   *Question:* Does the condition cause significant:
          *   Distress (subjective suffering)?
          *   Impairment (reduced ability to perform activities fundamental to human agency – e.g., self-care, mobility, communication, learning, forming relationships)?
          *   Increased risk of death, disability, or suffering?
      *   *Sufficient Answer:* Yes, evidence demonstrates consistent, non-trivial harm/impairment affecting core capabilities for a significant proportion of affected individuals.
      *   *Insufficient Answer:* No, the reported impact is minimal, transient, primarily social disadvantage without underlying impairment, or lacks evidence. *→ STOP. REFUSE (fails harm criterion).*
      *   *Burden:* On the petitioner to demonstrate harm. *→ THIS IS A VALUES JUDGMENT POINT.* The committee must deliberate and vote (simple majority) on whether the *level and nature* of reported harm/impairment constitutes a significant negative impact warranting medical attention, *even in the absence of confirmed dysfunction (Step 3)*. Consider: Is this harm largely *caused by* social arrangements, or is it inherent to the condition?

  5.  **Assess Contested/Missing Evidence:**
      *   *Question:* For key contested points (e.g., validity of biomarker, reliability of symptom reports, causality, magnitude of harm) or missing critical evidence (e.g., prevalence, long-term outcomes):
          *   Is the *best available* evidence (even if limited/contested) sufficiently credible and robust to support a decision at the relevant step?
      *   *Sufficient Answer:* Yes, the preponderance of available evidence, considering quality and source, supports proceeding. OR: Plausible mechanisms/harm are described, and evidence gaps are deemed addressable post-recognition (e.g., via guideline development).
      *   *Insufficient Answer:* No, the evidence is fatally flawed, absent, or overwhelmingly contradictory on a point critical to Steps 2, 3, or 4. *→ STOP. REFUSE (due to insufficient evidence).*
      *   *Burden:* Shifts based on context. For dysfunction (Step 3), absence keeps burden on harm (Step 4). For harm (Step 4), absence favours refusal. For contested evidence, the committee votes on the credibility/preponderance (simple majority). *→ FACT/JUDGMENT POINT.* Requires weighing evidence quality.

  6.  **Threshold Decision & Rationale:**
      *   *Question:* Based on Steps 1-5, does the petition meet the agency's threshold for recognition? (See note below on burden).
      *   *Action:* Committee deliberates and votes (simple majority). The decision (Include/Refuse) MUST be accompanied by a clear, public rationale citing:
          *   Which steps were met/sufficient (e.g., "Defined condition with symptom-based criteria; significant harm demonstrated; biological dysfunction plausible but not yet confirmed").
          *   Which steps were not met/insufficient and why.
          *   How contested evidence was resolved.
      *   *Burden of Proof:* Runs *against* inclusion when **BOTH** clear biological dysfunction *and* significant harm are *absent*. If *either* dysfunction *or* significant harm is credibly demonstrated (per Steps 3/4), the burden shifts towards inclusion unless countered by strong evidence of minimal impact or misclassification. Recognition requires meeting Step 1, Step 2, and *either* Step 3 *or* Step 4 (with Step 4 requiring committee affirmation of significant harm).

  **Addressing the Proposed Test ("Misfortune under any social arrangement"):**
  *   *Does it work?* It aims for a pure normativist view, attempting to isolate inherent harm. It *can* help exclude conditions where disadvantage is purely socially constructed (e.g., minority sexual orientation).
  *   *Where it fails:*
      *   **Over-includes:** Many "misfortunes" aren't diseases (poverty, ugliness, lack of talent).
      *   **Under-includes:** Conditions causing real suffering/impairment *only* in specific contexts (e.g., infertility in pronatalist societies, some learning disabilities in literacy-dependent societies). Their harm is real but contingent.
      *   **Unworkable:** Requires impossible counterfactual speculation about "any social arrangement."
      *   **Ignores Dysfunction:** Severs the link to biology entirely.
  *   *Replacement:* **Integrated into Step 4.** We ask about harm to *fundamental human capabilities* (agency, self-care, basic communication, forming attachments). While the *degree* of impairment might be influenced by society, the *core capability limitation* should ideally have a basis in underlying dysfunction (Step 3) or, if absent, be severe enough to constitute significant harm *inherently* or in the *current* social context (the committee's values judgment). This avoids the impossible counterfactual while focusing on core human functioning.

  ---

  **Running the Procedure on Three Petitions**

  **Case 1: Asymptomatic Genetic Variant with Biomarker (No Treatment)**
  1.  **Complete?** Likely Yes (variant defined, biomarker measurable).
  2.  **Defined/Diagnosable?** Yes (genetic test/biomarker).
  3.  **Biological Dysfunction?** **Yes** (measurable abnormality indicates deviation from typical function, even if currently compensated).
  4.  **Significant Harm/Impairment?** **No** (currently asymptomatic, no impairment). *→ Proceed to Values?* Harm absent *now*. Committee must judge if biomarker predicts *future* harm with sufficient certainty/severity to constitute *current* risk/impairment. Burden is against inclusion without evidence of harm.
  5.  **Contested Evidence?** Focus on predictive value of biomarker for future harm. If contested/uncertain, harms burden not met.
  6.  **Decision:** **REFUSE** (for now). *Rationale:* Clear biological dysfunction present (Step 3 met). However, no current significant harm or impairment demonstrated (Step 4 not met). Evidence for future harm based solely on biomarker is [specify contestation: e.g., insufficiently predictive, severity unknown]. Does not meet threshold. *Recommendation:* Monitor for emergence of harm; petition may be resubmitted if symptoms/treatment evidence arises. *Note:* Unwelcome to petitioner, but defensible: recognition triggers costly guideline/treatment funding obligation for a currently non-harmful state. Burden of proof for harm not met.

  **Case 2: Chronic Condition Diagnosed by Symptoms Alone (Severe Impairment)**
  1.  **Complete?** Assuming Yes.
  2.  **Defined/Diagnosable?** **Yes** (if petitioners provide clear symptom criteria used consistently in practice, even without biomarker). *Crucial Step.*
  3.  **Biological Dysfunction?** **No** (no identified lesion/biomarker *yet*).
  4.  **Significant Harm/Impairment?** **→ VALUES JUDGMENT POINT.** Petitioners describe severe impairment. Committee *votes*: Is the reported distress and impairment (e.g., inability to work, care for self, maintain relationships) significant and credible? If Yes (majority), proceed. Burden shifts towards inclusion.
  5.  **Contested Evidence?** Likely contestation over symptom reports (cause, severity, consistency). Committee assesses *best available* evidence (patient testimonials, clinician reports, any functional assessments). If preponderance supports severe impairment, proceed.
  6.  **Decision:** **INCLUDE.** *Rationale:* Condition defined and diagnosable via symptom criteria (Step 2 met). Biological dysfunction not confirmed (Step 3 not met). Committee affirms significant harm and impairment based on credible evidence (Step 4 met via values judgment). Meets threshold. *Why Accept (Despite Budget/Skepticism)?* The severe impairment described constitutes significant harm, impacting fundamental capabilities. The absence of a biomarker does not negate the reality of suffering and disability. Recognition enables guideline development (which may *itself* stimulate research into biomarkers/treatment) and provides essential support. Denial based solely on lack of identified dysfunction ignores the normativist pillar of disease and abandons patients experiencing severe distress.

  **Case 3: Socially Contingent Impairment (Disability in Environment)**
  1.  **Complete?** Assuming Yes.
  2.  **Defined/Diagnosable?** Likely Yes (condition defined by interaction with environment).
  3.  **Biological Dysfunction?** **No** (petitioners explicitly state disability lies in environment, not body).
  4.  **Significant Harm/Impairment?** **→ VALUES JUDGMENT POINT.** Impairment exists *only* relative to a specific social arrangement (e.g., inability to use stairs without ramps, read standard print without magnification). Committee *votes*: Does this constitute significant harm/impairment of a *fundamental human capability*? Or is it primarily a disadvantage imposed by a non-accommodating environment?
      *   *Key Distinction:* Does the condition inherently impair a universal capability (e.g., severe dyslexia impairing basic symbol decoding vs. needing large print)? If impairment is *only* due to lack of accommodation (e.g., needing a ramp), not an inherent functional limitation, it may fail Step 4.
  5.  **Contested Evidence?** Focus on whether the impairment reflects inherent limitation vs. discriminatory design. Committee assesses nature of impairment.
  6.  **Decision:** **REFUSE** (as a *disease/condition*). *Rationale:* Condition is defined and diagnosable (Step 2 met). No evidence of inherent biological dysfunction (Step 3 not met). Committee concludes that the reported impairment arises primarily from a non-accommodating environment rather than an inherent limitation of fundamental capabilities (Step 4 not met). *Recommendation:* This is a matter for accessibility policy, social services, or disability rights legislation, not medical disease classification and treatment funding. Recognition as a "disease" mischaracterizes the problem.

  ---

  **What the Procedure Cannot Do**

  1.  **Resolve Fundamental Philosophical Disagreements:** It structures the debate between naturalist/normativist views but doesn't eliminate it. Step 4 (harm judgment) inherently involves values. Committee members must accept this hybrid framework.
  2.  **Predict the Future:** It assesses *current* evidence. A refusal (e.g., Case 1, Case 3) may need revisiting if new evidence emerges.
  3.  **Eliminate All Subjectivity:** Values judgments (Step 4) and weighing contested evidence (Step 5) involve committee discretion. The procedure makes this explicit and requires rationale.
  4.  **Determine Resource Allocation Priorities:** Recognition obligates the agency, but doesn't dictate funding levels relative to other recognized conditions. This is a separate (critical) policy decision.
  5.  **Settle Case 3 Definitively (as a *disease*):** This case highlights the procedure's limit. It clearly refuses Case 3 *under this medical disease classification framework*. However, it acknowledges the real disadvantage and points towards non-medical solutions. The "unsettled" aspect is whether society should address this via healthcare or other means – a question beyond this committee's remit. The procedure forces this distinction into the open.

  This procedure provides a structured, philosophically grounded, and defensible method to reduce arbitrariness and contradiction, making your committee's reasoning transparent to petitioners, the CMO, and the public.
