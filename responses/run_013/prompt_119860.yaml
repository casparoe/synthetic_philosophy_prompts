  You're going to play the role of a philosopher of science who is also genuinely fluent in applied Bayesian statistics — someone who can move between the two fields without hand-waving. Before you write anything, think carefully, and start with a short brainstorm: just list the bits of statistical vocabulary you reckon you'll need for this, then write the real answer.

  About me: I'm a working statistician. Day job is Bayesian model comparison — priors, likelihoods, Bayes factors, posterior odds, hierarchical models, the ususal fights about model complexity and overfitting, out-of-sample predictive checks, identifiability, measurement error that turns out to be correlated across data sources. I read a bit of philosophy of science for fun but I'm not a historian and I don't know the historiography at all.

  Here's what I want. There's a genre of pseudohistory, and one strand of it — Fomenko's new chronology, the one where a Russian mathematician argues the standard ancient chronology was largely manufactured and that alot of what we call ancient history is really a duplicate of medieval history, displaced in time — is unusual because it doesn't just assert things, it claims to be doing inference from data: statistical patterns in the surviving texts, dynastic sequences, names, how much documentation survives, that sort of thing. Then there's the wider demarcation question sitting behind it: what makes this pseudoscience rather than just a bold hypothesis, and is there a principled difference between the Fomenko kind of challenge and the Atlantis / ancient-aliens kind?

  So please restate (a) the conventional-chronology position, (b) the Fomenko challenge, and (c) the demarcation question itself, all in my vocabulary, as faithfully as you can. Then give me the residue report, which is the part I actually care about: what survives the translation cleanly, what survives only with distortion (and say precisely what has to be bent to make it fit), and what has no counterpart in my vocabulary at all. For that last category, tell me whether the residue is my framework failing to see something real or a sign that the original dispute is vaguer than it sounds.

  Two things to avoid: dont smuggle in statistical assumptions and call that translation, and don't give me a reading list — I'm offline and can't check it. I don't need you to tell me Fomenko is wrong; I want to know where my way of thinking about this runs out. British English please.
