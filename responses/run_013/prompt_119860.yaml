answer: |-
  Right, let's dissect this. First, the brainstorm of statistical vocabulary we'll likely need:

  *   **Model Space:** Defining competing hypotheses (conventional vs. Fomenko chronologies).
  *   **Prior Probabilities:** Initial plausibility of models/hypotheses before seeing specific data.
  *   **Likelihood:** Probability of observing the specific data *given* a particular model/hypothesis.
  *   **Posterior Odds / Bayes Factor:** Quantifying the relative support for one model over another given the data (BF = Likelihood Ratio * Prior Odds Ratio).
  *   **Model Complexity / Overfitting:** A model's tendency to fit noise or specific patterns in the training data that don't generalize.
  *   **Priors (on Parameters):** Specifying uncertainty about quantities *within* a model (e.g., duplication probabilities).
  *   **Hyperparameters:** Parameters governing priors (e.g., strength of belief in duplication).
  *   **Model Comparison / Selection:** Choosing between competing models based on evidence and complexity penalties.
  *   **Predictive Performance / Out-of-Sample Prediction:** Ability of a model to predict *new* data not used in fitting.
  *   **Identifiability:** Can the model parameters be uniquely determined from the data?
  *   **Goodness-of-Fit:** Does the model adequately explain the *observed* data?
  *   **Ad Hoc Adjustments:** Modifications made to a model specifically to fit *this* data, often increasing complexity without independent justification.
  *   **Cherry-Picking / Selection Bias:** Focusing on data that supports a hypothesis while ignoring contradictory data.
  *   **Correlated Errors:** Non-independence of discrepancies or measurement errors across data sources.

  Now, the restatement in your vocabulary:

  **(a) Conventional Chronology (Model M_c):**
  This is the established, high-complexity model integrating multiple data streams (archaeological stratigraphy, dendrochronology, radiocarbon dating with calibration curves, astronomical event records, textual transmission analysis, coinage sequences, synchronisms between different cultures). Its priors (both on the overall model and internal parameters like dating uncertainties) are heavily informed by this vast, cross-validated corpus. The model complexity penalty (implicit in Bayes factors comparing M_c to simpler alternatives) is justified by its ability to generate coherent, high-likelihood explanations for diverse datasets *simultaneously*, including successful out-of-sample predictions (e.g., confirming archaeological finds based on textual predictions). Identifiability is ensured through multiple independent dating anchors and cross-constraints.

  **(b) Fomenko's Challenge (Model M_f):**
  M_f proposes a radical simplification: a vast "temporal compression" where large segments of "ancient" history are near-identical duplicates (with minor name/place variations) of medieval periods, displaced due to errors in early chronology construction. Its core "data" are perceived statistical patterns interpreted as unlikely under M_c:
  1.  **Dynastic Parallels:** Likelihood calculations based on sequence similarities in ruler reigns, wars, events, argued to be improbable under M_c's assumption of independence/unique events.
  2.  **Onomastic Patterns:** Frequencies and similarities of names across periods argued to exceed chance expectations under M_c.
  3.  **Documentary Gaps / Density:** Patterns in the volume of surviving documentation over time argued to be inconsistent with M_c's smooth accumulation, suggesting artificial gaps/duplications.
  M_f replaces the complex web of M_c with a simpler generative process: duplication events + minor random perturbations. Priors for M_f must place substantial probability mass on the existence of massive, coordinated duplication/collusion across diverse cultures and record types. Its apparent simplicity is offset by needing strong, highly specific priors on the *mechanism* and *scale* of duplication to generate the observed data. Goodness-of-fit for the *selected patterns* might appear high, but this risks severe overfitting to those specific features via ad hoc tuning of the duplication hyperparameters.

  **(c) The Demarcation Question:**
  Is M_f a legitimate, albeit highly improbable *a priori*, alternative model to M_c that could, in principle, be overturned by standard Bayesian model comparison based on relative predictive performance and complexity penalties? Or does M_f exhibit characteristics that place it *outside* the domain of scientific hypothesis testing altogether, akin to ancient-aliens/Atlantis models, regardless of claimed statistical arguments?

  **The Residue Report:**

  1.  **Cleanly Translated:**
      *   **Model Comparison via Bayes Factors:** The core logical structure of evaluating M_c vs M_f based on evidence and prior plausibility translates directly. The question *is* "Which model has higher posterior probability?"
      *   **Overfitting / Complexity Penalty:** Concerns about M_f fitting specific patterns (dynastic parallels, name frequencies) through ad-hoc adjustments to its duplication mechanism (tuning priors/hyperparameters specifically for *this* data) rather than genuine predictive power is a core statistical critique.
      *   **Prior Specification:** The critical dependence of M_f's viability on extremely strong, specific priors for massive duplication/collusion is clear. Assessing the *justification* for these priors is central.
      *   **Cherry-Picking / Selection Bias:** Focusing analyses only on datasets/patterns where parallels seem strongest, while ignoring vast contradictory evidence (e.g., material culture evolution, independent dating methods, lack of parallel in other domains) is a standard statistical flaw.
      *   **Predictive Performance:** The inability of M_f to generate novel, testable predictions about *new* archaeological finds, textual discoveries, or astronomical data that differ from M_c (beyond restating the duplication hypothesis) weakens its case, analogous to poor out-of-sample performance.

  2.  **Translated with Distortion (Bending Required):**
      *   **"Data" as Likelihood Input:** Translating Fomenko's "patterns" (dynastic parallels, name frequencies) into formal likelihoods under M_c vs M_f requires *massive, contestable assumptions*. The bend is defining the relevant **sample space and probability model**.
          *   *Distortion:* Defining what constitutes a "valid parallel" is inherently subjective and model-laden. The probability of observing *some* similarities by chance within the vast, complex historical record under M_c is extremely high, but quantifying this requires defining the universe of possible comparisons and their independence – which is deeply ambiguous and easily manipulated. Fomenko often defines the similarity metric *post hoc* based on the patterns he finds, inflating the apparent likelihood ratio for M_f.
      *   **Correlated Errors:** Fomenko argues correlated errors in early chronology creation caused the duplication. Translating this into a statistical model requires specifying the **dependence structure**.
          *   *Distortion:* While correlated measurement error is a real statistical concept, M_f posits a correlation structure of near-perfect dependence across wildly heterogeneous, globally distributed data sources (texts, coins, buildings, eclipses) over centuries. Modelling this formally is virtually impossible; the priors required for such pervasive, coordinated dependence would be infinitesimal. The translation bends "correlated error" into an unfalsifiable *deus ex machina*.
      *   **Identifiability:** M_f claims the "true" chronology is identifiable from the patterns. However, the **compression mechanism** itself introduces severe non-identifiability.
          *   *Distortion:* Given the postulated duplication + perturbation process, multiple different compression schemes could potentially generate similar patterns. Without strong, independently justified constraints on the duplication mechanism (which are lacking), the "true" compressed timeline isn't identifiable from the pattern data alone. The translation highlights a formal identifiability problem within M_f.

  3.  **No Clean Counterpart (The Irrecoverable Residue):**
      *   **Historiography's "Local Coherence" as a Prior:** Conventional chronology doesn't *just* rest on independent dates; it rests on the immense, interlocking **narrative and causal coherence** within and between sources and material evidence across time and space under M_c. This coherence generates extremely strong, implicit priors *against* radical reordering. Translating this "coherence" into a single prior probability or likelihood factor is impossible. It's an emergent property of the *entire integrated model* (M_c), not reducible to individual data points or simple correlations.
          *   *Nature of Residue:* This is a **failure of reductionism** in the Bayesian framework when applied to complex historical reconstruction. Your framework struggles to formally capture the evidentiary weight of this holistic coherence, though its *effect* is analogous to an overwhelmingly strong prior for M_c based on accumulated successful fits. It's real, but hard to quantify cleanly.
      *   **The Hermeneutic Circle & Source Criticism:** Evaluating historical texts involves understanding context, authorial intent, genre, transmission pathways, and inherent biases – a continuous process of interpretation (hermeneutics) and critical evaluation. This informs the *likelihood* P(Data|M_c) – how probable is *this specific text, with its nuances,* under M_c vs M_f? However, this interpretation is **inherently qualitative and contested**, relying on scholarly consensus built on expertise.
          *   *Nature of Residue:* This is **expertise-dependent model specification**. Bayesian statistics takes the model (including the likelihood function) as given. Fomenko often rejects standard hermeneutic practices and source criticism that underpin the conventional likelihood assessments, replacing them with his own interpretations favouring M_f. Your framework has no direct way to adjudicate *which* hermeneutic approach defines the correct likelihood; it assumes the model specification (including how data is interpreted/weighted) is settled *before* comparison. This disagreement sits *prior* to the statistical comparison.
      *   **Material Culture & Independent Processes:** The evolution of technology, art styles, pottery, shipbuilding, agriculture, etc., provides vast streams of data with their own internal chronologies and developmental logic, largely independent of textual records. These provide **multiple independent causal chains** constrained by physics, materials science, and incremental innovation.
          *   *Nature of Residue:* While radiocarbon etc. provide *dates*, the **developmental trajectories** themselves are a form of high-dimensional, continuous data with strong temporal autocorrelation under M_c. M_f must posit that these complex, material trajectories *also* duplicated, stalled, or rewound in precise synchrony with the textual/event duplications. This isn't just another data stream; it represents **multiple independent generative processes** that M_c explains via gradual change, while M_f requires them to be artificially synchronized copies. Your framework sees the data points, but struggles to formally capture the evidential weight of the *causal independence and internal logic* of these processes against the duplication hypothesis. It's more than just correlated data; it's about incompatible causal mechanisms.

  **Conclusion on the Residue:** The core of Fomenko's *argument structure* maps onto Bayesian model comparison, revealing its statistical flaws (overfitting, untenable priors, cherry-picking, poor predictive power). However, the **irrecoverable residue** lies in the foundations:
  1.  The **holistic, narrative/causal coherence** of conventional history acts as an immense, difficult-to-quantify prior.
  2.  The **expertise-dependent interpretation of primary sources** defines the contested likelihood function itself.
  3.  The **evidential weight of independent material culture trajectories** argues against duplication via their inherent causal logic, not just independent dates.

  This residue isn't primarily vagueness in the original dispute; it reflects **genuine limitations of the formal Bayesian framework** to fully encapsulate the nature of historical evidence, which relies heavily on hermeneutics, holistic coherence, and the logic of independent causal processes. While Bayes factors *can* compare formal models, defining those models – especially the likelihoods based on interpreted texts and the priors based on coherence – depends on scholarly practices that Fomenko rejects. Atlantis/ancient-aliens models typically lack even the *pretense* of a formal statistical model comparison against the null; Fomenko's challenge *mimics* the structure but founders on the irrecoverable residue of historical epistemology. Your framework runs out when faced with translating hermeneutic interpretation into likelihoods and holistic coherence into priors.
