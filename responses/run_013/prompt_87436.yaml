  ### Notes
  - **Partially reliable report**: The constraint \(P(\text{HQ} \mid \text{Red}) = q\) (with \(0 < q < 1\)) is directly imposed in all leaves except **Material Conditional Update**, where it is mapped to evidence about the material conditional.
