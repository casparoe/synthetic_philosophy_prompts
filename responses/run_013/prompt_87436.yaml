    - **Fixed Marginals and Constraint** (Leaf 2) is equivalent to Jeffrey conditionalization for the conditional constraint.  
    - **Conditional Minimum Cross-Entropy** (Leaf 3) generalizes Jeffrey to cases where \(P(\text{Red})\) may change.  
