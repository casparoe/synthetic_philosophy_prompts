  2. **\( t_8 \):** Insurer offers: "Switch to Y: pay $200 now and $200 in 4 months." ( covers till end)  
     - Stick with Z: Pay $550 in 4 months. PV = \( 550 \times 0.8 = 440 \) (delay 4m).  
     - Switch to Y: PV = \( 200 + 200 \times 0.8 = 200 + 160 = 360 \).  
     360 < 440 → she switches.  
  3. **\( t_{12} \):** She pays the final $200.  

  **Total payment:** $0 (t0) + $200 (t8) + $200 (t12) = $400.  
  **Counterparty profit:** $400 vs. $500 if X upfront → $100 less. Not a pump.  

  **Adjusted to pump:**  
  - At t8, offer: "Pay $300 now to settle."  
     - Stick with Z: PV = 440.  
     - New offer: PV = 300.  
     300 < 440 → she accepts.  
     Total paid: $300. Still less than $500.  
  - Make the offer at t8: "Pay $450 now."  
     - PV = 450 > 440 → she rejects and pays $550 at t12.  
     Total paid: $550 > $500.  

  **Transactions:**  
  1. t0: Choose Z.  
  2. t8: Insurer offers: "Pay $450 now to settle."  
     - Alex rejects (450 > 440).  
  3. t12: Pays $550.  

  Alex paid $550, whereas with X she would have paid $500. Loss of $50.  
  Publisher's profit: $550 - cost (say $0) = $550 vs. $500 from X → $50 extra profit.  

  **Why she rejects at t8:** By her lights at t8, sticking with Z costs PV 440, while paying $450 costs 450 > 440, so she minimizes cost by sticking.  

  ### (b) Node-by-Node Audit
  - **\( t_0 \):** 
    - Choices: Accept Z (PV cost 330) or refuse (no insurance, cost 0 but value 0).  
    - She values insurance at >330, so accepts Z.  
  - **\( t_8 \):** 
    - Choices: 
      - Stick with Z: Pay $550 in 4 months. PV = \( 550 \times 0.8 = 440 \).  
      - Accept settlement offer: Pay $450 now. PV = 450.  
      - (Refuse settlement: same as sticking with Z.)  
    - 440 < 450, so she sticks with Z. PV cost is lower.  
  - **\( t_{12} \):** Pays $550 as scheduled.  

  ### (c) The Loss and Avoidance
  - **Loss:** Alex ends up paying $550 instead of $500 ( had she chosen X upfront). This is a $50 loss in absolute terms. In present value at \( t_0 \), the path she took has cost \( 550 \times \delta(12) = 550 \times 0.6 = 330 \), while X would have cost \( 500 \times 1 = 500 \). By her \( t_0 \) valuation, she is better off (330 < 500). The loss is only apparent in hindsight or in absolute dollars, not by her discounting.  
  - **Avoidance:** Alex could have chosen X at \( t_0 \), but by her lights then, Z was better (330 < 500). She can avoid the loss by having consistent discounting or by using a commitment device (but condition 4 forbids this). The loss is avoidable only if she can bind her future self to not reconsider, but she has no commitment technology.  

  ### (d) Load-Bearing Feature and Removal Tests
  - **Condition 1 (Full information and foresight):** Alex knows the sequence and predicts her choices. If relaxed, she might not foresee the $450 offer at t8 and might choose Z without expecting future offers, so no pump.  
  - **Condition 2 (Transitivity at every moment):** At each node, she compares only two options. If she had to choose among more, intransitivity might appear, but the case doesn’t rely on it. If relaxed and intransitivity occurs, it might create a cycle, but the case uses only binary choices.  
  - **Condition  ( fixed values):** If her values change (e.g., she values insurance less at t8), she might not care about the payment and refuse, destroying the pump.  
  - **Condition 4 (No commitment):** If she has commitment (e.g., a contract to not listen to offers), she sticks with Z and pays $550, but the publisher might not make offers. The pump relies on her revisiting choices.  
  - **Consistent discounting:** If she uses exponential discounting (e.g., δ(d) = e^{-0.1d}), preferences are time-consistent. At t0, if Z is preferred, she sticks with it, and no switches occur. The case collapses.  

  ### (e) Defence of the Victim
  **Defence:** Alex is not irrational; she maximizes utility at each decision node given her discount function. The sequence reflects a conflict between her initial plan (Z) and later re-evaluations under changed circumstances ( shorter delays). She is entitled to re-optimize as time passes, rather than adhere to a suboptimal plan. Holding to the initial plan (Z) would cost her more at t8 (PV 440) than switching, but in this case, she doesn’t switch. The loss in absolute dollars is due to her genuine time preferences, not a logical flaw.  

  **Assessment:** The defence succeeds in showing that she is locally rational. However, it costs her $50 in absolute terms. If she values temporal consistency as a higher-order goal, she might wish to adopt consistent discounting, but that is a preference change, not required by rationality. The cost of making the defence (adopting commitment) is feasible only if condition 4 is relaxed.  

  ### (f) Smallest Circumstance Change to Defeat Pump
  **Change:** Alex sets up a simple automatic payment for Z at \( t_0 \) (e.g., a standing instruction to her bank to pay $550 at t12). This is feasible for an ordinary person (online banking feature).  
  **Effect:** At t8, she can still interact with the publisher, but the payment is scheduled and she views canceling as costly ( hassle, fee). She refuses the $450 offer, avoiding the pump. The publisher cannot profit from the switch.  
  **Could she do it?** Yes, in online banking, she can set a future-dated payment easily. This exploits condition 4’s allowance for "no rule stopping her," but a mild external constraint (bank instruction) acts as a commitment.
