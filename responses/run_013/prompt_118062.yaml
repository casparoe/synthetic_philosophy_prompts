prompt: |-
  so I'm writing something on the boundary problem in democratic theory — the circularity where you need a demos to decide anything democratically, but the demos itself has to get decided somehow, so the democratic procedure can't tell you who gets to be part of it — and I want the spec sheet before I commit to a side. what does any theory of who belongs in the demos actually have to deliver? give me the requirements list: the cases it has to get right, the distinctions it can't collapse, the results it can't contradict, and the consideration behind each requirement. mark which ones you think are non-negotiable and which are really just the taste of one camp, and tell me which single requirement does the most work — the one that knocks out the most otherwise tempting answers.

  the cases I keep tripping over: a secession referendum where the boundary of the electorate basically determines the result; a city where long-term residents without citizenship want a vote in municipal elections; outsiders who are seriously affected by a country's climate or trade policy; kids; and future people. add any you think I'm missing.

  two extra things I want folded in. one is a half-baked idea a friend threw at me that I can't shake: any rule for drawing the boundary has to be reflexive, meaning if you turned the rule on the demos it produces, that demos would itself endorse the same rule — otherwise the rule is just picking winners and you've smuggled the answer in at the start. I don't know if that's definately a real constraint or just a clever trap, so treat it as a candidate requirement and tell me what it would cost to accept it and what it would rule out. the other is that I suspect at least two of the requirements on your list can't be satisfied together, and if so I'd rather you state that plainly than paper over it, because I think that tension is the actual content of the problem and there's alot riding on how it gets resolved.

  no need for a scorecard of the usual contenders at the end, I can do that once I trust the list. but if one requirement obviously rules out a whole family of views, say which family and why.
reasoning: |-
  Okay, the user is tackling the boundary problem in democratic theory—the circular issue of needing a demos to make decisions democratically, but the demos itself must be defined first. They're asking for a spec sheet: what any theory about who belongs in the demos must deliver. They want requirements, including cases it must handle, distinctions to maintain, results to avoid, and the reasoning behind each. Plus, they have specific cases like secession referendums, non-citizen residents, affected outsiders, kids, and future people. They also mentioned a reflexivity idea from a friend and suspect some requirements conflict.

  First, I need to outline the essential requirements for a demos theory. The user wants clarity on non-negotiables versus preferences. They also want to know which requirement is the most decisive in ruling out theories. The reflexivity condition needs evaluation: is it necessary, and what does it exclude? And they suspect inherent tensions, so I shouldn't avoid pointing those out.

  Starting with the core requirements. The theory must avoid arbitrariness; otherwise, it's not democratic. Then, there's the All Affected Interests Principle—people affected by decisions should have a say. But that's broad and needs refinement. Also, the Self-Determination Principle: groups should govern their internal matters. These two often clash, like in secession cases.

  Distinctions matter too. For example, distinguishing between mere effects and governance stakes. Kids and future generations pose challenges: kids lack capacity, so guardianship makes sense, but future people can't participate. The reflexivity idea—where the demos endorses the rule that defines it—seems important for legitimacy but might be too demanding. It could exclude theories based on residency or coercion, if the existing demos wouldn't agree to include outsiders.

  Key tensions: All Affected vs. Self-Determination is a big one. Including everyone affected makes the demos too large, while self-determination might exclude those impacted. Also, reflexivity might conflict with these if the current demos doesn't want to expand. Another tension is between feasibility and democratic ideals. Including future people isn't practical, so some compromise is needed.

  The most decisive requirement? Probably Reflexivity. It knocks out theories that aren't self-justifying, like historical/cultural definitions that exclude new residents, or coercion-based if current demos won't extend voting rights. All Affected is also critical but too vague without refinement.

  Cases to consider: secession referendums show boundary issues. If only the region votes, it might ignore broader impacts. Non-citizen residents in a city—affected but not citizens. Affected outsiders like those impacted by climate policies. Kids need representation but can't vote. Future generations have no voice.

  Missing cases: temporary workers, stateless people, annexed territories. Also, digital communities or global entities where traditional boundaries blur.

  The user's deeper needs: They want a framework to evaluate theories rigorously, identify irreconcilable conflicts, and understand where compromises lie. They might be looking for a way to navigate the tension without resorting to non-democratic solutions. Highlighting the reflexivity tension and the All Affected vs. Self-Determination clash is crucial. They need to see that no theory satisfies all perfectly, and the trade-offs involved.
answer: |-
  Here's a rigorous "spec sheet" for theories addressing the democratic boundary problem, structured around requirements, incorporating your cases, reflexivity, and inherent tensions. The goal is to define what any viable theory *must* deliver (*non-negotiables*) versus what it *might* deliver based on philosophical leanings (*taste*), and to pinpoint the core conflict.

  **Core Requirements for a Theory of the Demos:**

  1.  **Non-Arbitrariness (Non-Negotiable):**
      *   **Must Deliver:** The rule defining the demos cannot rely on brute force, historical accident alone, or pure self-selection without justification. It must rest on defensible principles applicable beyond the specific case. *Reason:* Avoids collapsing into "might makes right" or infinite regress, undermining democratic legitimacy from the start.
      *   **Cases:** Rules out defining the secession electorate solely by the seceding region's leaders or the central state; rules out excluding non-citizen residents *only* because "they aren't citizens" without justifying why citizenship is the relevant marker *here*.

  2.  **Distinguish Between "Subject To" and "Affected By" (Non-Negotiable):**
      *   **Must Deliver:** Clearly differentiate between being *subject to the coercive authority* of a polity (its laws, enforcement) and being *impacted by its decisions* (externality). *Reason:* Collapsing this distinction makes the demos potentially limitless (e.g., everyone globally affected by climate policy). Democratic legitimacy primarily concerns justifying *coercion* over individuals.
      *   **Cases:** Crucial for climate policy outsiders (affected, but not necessarily subject to the coercive authority of the emitting state's *domestic* laws) vs. long-term residents (subject to municipal laws/coercion, even if not citizens). Future people are *affected* but not (currently) *subject to* coercion.

  3.  **Account for Political Agency / Capacity (Non-Negotiable, but Scope is "Taste"):**
      *   **Must Deliver:** Recognize that democratic participation requires *some* minimal capacity for agency, deliberation, or interest formation. *Reason:* Democratic procedures assume participants can form preferences, communicate, and bear responsibility for collective decisions.
      *   **Cases:** Necessarily excludes infants or the profoundly cognitively disabled from *direct* voting (justifying guardianship/representation). **Distinction:** Must *not* conflate this with arbitrary exclusion based on race, gender, etc. The "minimal capacity" threshold itself is a site of debate ("taste" – e.g., age limits).
      *   **Future People:** Highlight the tension – they have interests but zero current agency/capacity.

  4.  **Avoid Self-Defeating or Self-Justifying Circularity (Non-Negotiable):**
      *   **Must Deliver:** The rule cannot *presuppose* the very demos it seeks to define in a way that makes the rule logically dependent on an undefined entity. *Reason:* Avoids infinite regress or triviality (e.g., "the demos is whoever the current demos says it is").
      *   **Cases:** Rules out defining the secession electorate *only* by the central state's constitution (assuming the central demos's legitimacy to decide on its own dissolution) *or* *only* by the seceding region (assuming its legitimacy to unilaterally define itself).

  5.  **Feasibility/Institutionalizability (Non-Negotiable Threshold):**
      *   **Must Deliver:** The resulting demos must be practically identifiable and capable of functioning as a collective decision-making body. *Reason:* Democracy is a practical system of governance, not just a thought experiment. An unidentifiable or impossibly large demos is non-functional.
      *   **Cases:** Knocks out pure "All Affected Interests" without refinement (too vast/incoherent). Future people pose a major feasibility challenge (how to represent them?).

  **Other Key Requirements (Mix of Non-Negotiable & Taste):**

  6.  **Reflexivity (Candidate Requirement - High Cost/High Impact):**
      *   **Proposed Deliverable:** The rule defining the demos should be such that if the demos it produces were to deliberate on and choose a rule for defining *itself*, it would (or reasonably could) endorse the same rule. *Reason:* Ensures the rule isn't just imposed arbitrarily; imbues it with democratic legitimacy *from within*. Addresses your friend's "smuggling" concern.
      *   **Cost of Acceptance:** Severely restricts possible rules. Requires a rule plausible enough for the constituted demos to accept it *even if* it might lead to their own exclusion or inclusion of others they might initially oppose.
      *   **What it Rules Out:**
          *   **Ethnic/Cultural Primacy:** A demos defined solely by ethnicity likely wouldn't reflexively endorse a rule giving equal weight to new residents of different backgrounds.
          *   **Pure Residency (without duration/attachment):** Current residents might not endorse a rule letting brand-new arrivals immediately vote on fundamental structures.
          *   **Pure Historical/Citizen Inheritance:** Existing citizens might not reflexively endorse a rule excluding long-term resident non-citizens subject to coercion.
          *   **Coercion Principle Alone:** Those currently coerced might endorse a rule including people *they* coerce externally (e.g., via climate policy), which they might resist.
      *   **Verdict:** Powerful legitimacy test but extremely demanding. Makes many intuitively plausible rules non-starters unless heavily qualified. Likely necessitates a rule emphasizing consent, fairness, or reciprocal justification over fixed identity.

  7.  **Recognition of Stake/Attachment ("Taste" Leaning Towards Non-Negotiable):**
      *   **Might Deliver:** Acknowledge that individuals with a deep, enduring stake in a community's future (long-term residents, future generations) deserve consideration, even if strict "subject to" or agency criteria are problematic. *Reason:* Addresses the "community of fate" aspect vital for solidarity and long-term legitimacy.
      *   **Cases:** Core justification for including long-term non-citizen residents; the *only* hook for considering future generations. **Distinction:** Must not collapse into pure sentimentality or vague "interest" – needs a principled link to the polity's existence/purpose.

  8.  **Coherence with Democratic Values ("Taste" in Weighting):**
      *   **Might Deliver:** The rule should align with core democratic values like equality, liberty, inclusion, and self-government. *Reason:* The rule defining the demos shouldn't contradict the values the democracy it enables is meant to uphold.
      *   **Cases:** Challenges rules based on inherent hierarchy (e.g., birthright aristocracy). **Distinction:** How these values are prioritized (e.g., equality vs. stability) is major "taste" territory.

  **The Most Decisive Requirement: Reflexivity (If Accepted) or Distinguishing "Subject To" vs. "Affected By"**

  *   **Reflexivity:** If accepted as a requirement, it does the most work *by far*. It immediately knocks out whole families of theories:
      *   **Ethno-Nationalist/Historical/Cultural Primacy Theories:** Unlikely to be reflexively endorsed by a demos that would include newcomers changing that culture/demography.
      *   **Pure State-Centric/Citizenship-Is-Sufficient Theories:** Unlikely to be reflexively endorsed if the demos includes those wanting to include long-term residents or exclude those no longer subject to coercion.
      *   **Pure "All Subject to Coercion" Theories:** The constituted demos might reflexively endorse including those *they* coerce externally (e.g., via foreign policy), challenging state sovereignty as traditionally understood. It also struggles with future people.
      *   **Pure Self-Determination/Secession Theories:** The seceding group is unlikely to reflexively endorse a rule allowing its own sub-regions to secede easily later.
  *   **Distinguishing "Subject To" vs. "Affected By":** If Reflexivity is rejected, **this distinction does the most work.** It fundamentally limits the scope of the demos and knocks out:
      *   **Radical "All Affected Interests" Theories:** By insisting that mere effect isn't sufficient grounds for inclusion in the demos *authorizing coercion*, it prevents the demos from becoming global and unworkable. It forces "All Affected" proponents to find a *subset* of the affected (e.g., the coerced, the reciprocally affected, those with a primary stake) to constitute the demos.

  **The Inevitable Tension (The Core of the Problem):**

  You suspect correctly: **The tension between the "All Affected Interests" intuition and the "Self-Determination / Subject to Coercion" requirement is fundamental and likely irreconcilable at the margins.**

  *   **All Affected Interests (AAI):** Demands that those whose vital interests are significantly shaped by a decision should have a say. This pulls towards *inclusion* (climate outsiders, future generations, perhaps even long-term residents seen as deeply affected).
  *   **Self-Determination / Subject to Coercion (SD/SC):** Demands that the primary right to collectively bind themselves lies with those who form a pre-political community or are directly subject to the polity's coercive power. This pulls towards *exclusion* or clearly bounded communities (states, municipalities defined by citizenship/residency, seceding groups defining themselves).

  **Why they conflict:**

  1.  **Scale Mismatch:** AAI often identifies stakeholders beyond the boundaries of any feasible self-determining unit (e.g., global climate impacts).
  2.  **Legitimacy Source:** AAI grounds legitimacy in impact/interest; SD/SC grounds it in consent/coercion-within-community.
  3.  **The Secession Case:** AAI might suggest outsiders affected by secession (e.g., minorities left behind, neighboring states, the rump state) deserve input. SD/SC insists the right to decide belongs *only* to the group asserting self-determination within the contested territory (or perhaps the existing state).
  4.  **Future Generations:** AAI strongly suggests their interests matter immensely. SD/SC struggles to include them as they lack agency and are not currently subject to coercion. Reflexivity offers little help here either.

  **Resolution?** Every theory *must* prioritize one pole or find a compromise that inevitably sacrifices some aspect of one principle:
  *   **Prioritize SD/SC:** Accept that affected outsiders/future generations lack formal membership, relying on moral constraints, international institutions, or representation schemes *outside* the core demos definition. (Emphasizes feasibility and non-circularity of coercion).
  *   **Prioritize AAI (Refined):** Define a subset of the affected – e.g., those *primarily* affected, subjected to coercion, or bound by reciprocity – to constitute a feasible demos. This requires strong justifications for the chosen subset, risking arbitrariness. (Emphasizes moral inclusion).
  *   **Institutional/Pragmatic Compromise:** Accept existing boundaries (states) as the primary units *for now* (satisfying SC/feasibility), but build mechanisms (international law, representation for residents, trusteeship for future) to address AAI concerns imperfectly *within* or *alongside* the system. (Emphasizes feasibility and path-dependence).

  **Missing Cases:**

  *   **Stateless Persons/Displaced Populations:** Who constitutes *their* relevant demos? The host state? A future homeland? A transnational community?
  *   **Temporary Workers (Migrant Labor):** Deeply affected and often subject to coercion, but lacking permanence/citizenship. Where do they belong?
  *   **Annexed Territories:** Does the demos instantly switch to the annexing state? What about the loyalties/identities of the annexed population?
  *   **"Digital" or Non-Territorial Demoi:** Can communities defined by shared interests/projects (e.g., global professional groups, online communities) constitute a demos without territorial coercion? Challenges the SC foundation.

  **Conclusion:**

  Your spec sheet reveals the boundary problem's core: defining the demos requires navigating **non-negotiable constraints** (Avoiding Arbitrariness, Distinguishing Subject/Affected, Accounting for Agency, Avoiding Circularity, Feasibility) while wrestling with the **fundamental tension** between Inclusion (AAI/Stake) and Self-Determination (SD/SC). **Reflexivity**, if adopted, becomes a powerful but restrictive filter demanding internal democratic justification for the boundary rule itself. No theory flawlessly satisfies all requirements simultaneously; the choice inherently involves prioritizing certain values (inclusion, self-rule, feasibility, legitimacy) and making compromises at the margins (secession, outsiders, future generations). The "best" theory is the one that most coherently justifies its prioritizations and compromises within this constrained space. Good luck committing to a side!
