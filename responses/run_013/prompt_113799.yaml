  ### **Session Design: Superrationality in the Prisoner's Dilemma**  
  **Objective:** Participants experience the tension between individual rationality and superrational cooperation through a rule-based Prisoner's Dilemma (PD) tournament. The debrief connects outcomes to fixed-point reasoning and mutual inference.

  ---

  ### **Materials**  
  1. **Rule Submission Forms** (paper or digital):  
     - Fields:  
       - *Rule Name* (optional; e.g., "Tit-for-Tat," "Optimist").  
       - *Condition 1:* "If my opponent uses **the same rule as me**, I will: [C] Cooperate or [D] Defect."  
       - *Condition 2:* "If my opponent uses **a different rule**, I will: [C] Cooperate or [D] Defect."  
     - Example:  
       - *Same Rule:* [C]  
       - *Different Rule:* [D]  
  2. **Payoff Scheme** (posted visibly):  
     |                        | **Opponent Cooperates** | **Opponent Defects** |  
     |------------------------|-------------------------|----------------------|  
     | **I Cooperate**        | R = 3 (Reward)          | S = 0 (Sucker)       |  
     | **I Defect**           | T = 5 (Temptation)      | P = 1 (Punishment)   |  
     - Conditions: \(T > R > P > S\) and \(2R > T + S\) (mutual cooperation maximizes collective payoff).  
  3. **Pre-Written Bots** (included anonymously):  
     - **ALWAYS_D (Defector):** [Same: D, Different: D]  
     - **MIRROR:** [Same: C, Different: *Copies opponent’s "Same Rule" move*]  
     - **SUPER (Ideal Superrational Agent):** [Same: C, Different: D]  
     - **ALWAYS_C (Cooperator):** [Same: C, Different: C]  
  4. **Scoring System:**  
     - Total score = Sum of payoffs across all pairings (including self-play).  
     - Display live rankings during the tournament (e.g., via a projected leaderboard).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **1. Introduction (10 min)**  
  - Recap PD basics: payoff matrix, dominance of defection in one-shot games.  
  - Explain the activity:  
    > "Each of you will design a decision rule for a one-shot PD. Rules will be paired in a round-robin tournament, including self-play. Your goal: maximize your score. Rules have two parts: how you act against *your own rule* and against *different rules*."  
  - Distribute forms; emphasize brevity and clarity.  

  #### **2. Rule Writing & Submission (15 min)**  
  - Participants privately write rules (5 min).  
  - Collect rules while adding pre-written bots to the pool (10 min).  
    - *Tip:* Use a spreadsheet to input rules quickly (assign IDs like "Rule 1," "Rule 2").  

  #### **3. Tournament (30 min)**  
  - **Pairings:** Each rule plays every other rule and itself once (total games: \(n^2\) for \(n\) rules).  
  - **Process:**  
    - For each pairing:  
      - If rules **differ**, use each rule’s "Different Rule" move.  
      - If rules **identical**, use the "Same Rule" move.  
    - *Exception:* MIRROR bot uses its opponent’s "Same Rule" move in cross-play.  
  - **Scoring:** Update leaderboard after each round (show top/bottom 5 scores).  
  - **Duration:** For 17 rules (14 participants + 3 bots), 289 games take ~25 min with automated scoring (e.g., Python script).  

  #### **4. Debrief (35 min)**  
  - **Step 1: Share Results (5 min)**  
    - Show final rankings, average scores, and self-play payoffs.  
    - Highlight patterns: e.g., "Rules with high self-play payoffs dominated the top half."  
  - **Step 2: Map Outcomes to Superrationality (20 min)**  
    - **Fixed-Point Rationality:**  
      > "Notice that rules cooperating with themselves (e.g., SUPER, ALWAYS_C) got \(R=3\) in self-play. Rules defecting against themselves (e.g., ALWAYS_D) got only \(P=1\). SUPER treats its clone as a *function of itself*: ‘If I cooperate, my clone does too → we get \(R=3\). If I defect, we get \(P=1\) → so I cooperate.’"  
    - **Tension:**  
      > "SUPER exploits cooperators (earning \(T=5\)) but defects against defectors (earning \(P=1\)). Yet if *everyone* used SUPER, cross-play would yield \(P=1\)—worse than universal ALWAYS_C (\(R=3\)). The ‘smart’ agent isn’t always the one topping the leaderboard."  
    - **Role of Bots:**  
      > "ALWAYS_D drags down cooperators (e.g., ALWAYS_C gets \(S=0\) against it). MIRROR, by copying the opponent’s self-play move, rewards rules that cooperate with themselves but punishes those that don’t. This mimics how real-world agents ‘signal’ reliability."  
  - **Step 3: Philosophical Context (10 min)**  
    - Define superrationality (Hofstadter, 1983): Rationality as finding a *fixed point* where your choice is optimal given that identical agents reason identically.  
    - Contrast with Nash equilibrium (mutual defection) and reciprocity (repeated games).  

  ---

  ### **Predictable Challenges**  
  1. **Rule Misinterpretation:**  
     - Participants may conflate "same rule" with "similar agents" or write non-deterministic rules.  
     - *Mitigation:* Use the form template; clarify during instructions.  
  2. **Scoreboard Distraction:**  
     - Participants focus on maximizing cross-play payoffs (e.g., defecting broadly to chase \(T=5\)), overshadowing self-play.  
     - *Mitigation:* In the debrief, explicitly separate self-play and cross-play performance.  
  3. **Bot Confusion:**  
     - MIRROR’s behavior (copying the opponent’s self-play move) may seem arbitrary.  
     - *Mitigation:* Explain post-tournament that MIRROR tests whether rules "trust" their own logic.  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **First-Person Inference:**  
     - Superrationality hinges on the intuition: "My choice *determines* my clone’s choice." Here, participants design rules *in advance*, missing the real-time inference.  
  2. **Partial Similarity:**  
     - The tournament treats rules as either identical or different—no gradient (e.g., 70% similar agents). In practice, superrationality weakens without perfect symmetry.  

  ---

  ### **Signs of Misaligned Learning**  
  You’re teaching *reciprocity/risk-aversion*, not superrationality, if:  
  - **Pattern 1:** Top rules are **ALWAYS_C** (if few defectors) or **ALWAYS_D** (if many defectors). This suggests participants defaulted to risk-dominance or reciprocal expectations.  
  - **Pattern 2:** Rules defecting in self-play (**Same: D**) dominate. This implies participants prioritized exploiting others over fixed-point gains.  
  - **Pattern 3:** **SUPER** performs poorly overall. If participants avoid it (or its clones defect against each other), they didn’t internalize the self-play incentive.  

  > **Red Flag Quote:**  
  > *"If the winning strategy is ALWAYS_D, and self-play scores are ignored, we’ve reinforced Nash thinking. If ALWAYS_C wins by avoiding exploitation, we’ve taught risk-aversion, not superrationality."*  

  ---

  ### **Improvements & Alternatives**  
  - **Add a Round 2:** Let participants revise rules after seeing initial results. This amplifies the "pull" of self-play logic.  
  - **Asymmetric Variant:** Run a follow-up where pairs know they share a "trail" (e.g., both used SUPER-like rules) but aren’t identical. Highlights superrationality’s fragility.  
  - **Nudge:** Pre-populate 2-3 SUPER rules to ensure the strategy is represented.  

  This design balances experiential learning with philosophical depth, using the tournament’s emergent patterns to make superrationality tangible. The bots and self-play create a rich "Aha!" moment when participants realize: *Rationality can demand cooperation, even when you can’t talk.*
