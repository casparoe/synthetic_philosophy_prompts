  **Which verdicts must be given up?** None, because the principle explains all your verdicts. The key is that the paradox arises only when the speaker is making an assertion (or simulating one in thought) about the present and about their own current belief. Shifting time, person, or context (like hypothetical, reported speech, or fictional) removes the self-referential assertoric force.

  However, note that the thought version still feels weird because we are simulating an assertion. So that verdict stands. And the past tense is fine because the assertion about the past does not imply that the speaker currently believes the past proposition at the time of asserting it? Actually, when we assert a past proposition, we do imply that we currently believe it. But note: the denial is also about the past belief. So the speaker is saying: "It was raining yesterday (which I now believe) but at that time yesterday I did not believe it was raining." There is no contradiction because the belief states are at different times. Similarly, for future: "Tomorrow it will rain but you won't believe it" is fine because the belief state is future and the speaker is not attributing a current belief to themselves about the future in a way that contradicts the denial.

