answer: |-
  Below is a meticulously structured 50-minute session plan for Pascal's Mugging, optimized for non-specialists. It prioritizes visceral engagement with the puzzle while defusing misconceptions at critical junctures. Your candidate example is **strong but requires refinement**; I'll specify adjustments.

  ---

  ### **Session Structure: Sequence & Rationale**  
  *(Total: 50 min)*  

  1.  **Foundation 1: Expected Value Refresher & Small ≠ Zero**  
      *(10 min)*  
      - **Activity**: Calculate two scenarios:  
        (A) 50% chance to win $100 → EV = $50  
        (B) 1/1,000,000 chance to win $1 billion → EV = $1,000  
      - **Key Point**: Emphasize *"Arbitrarily small probabilities dominate calculations if outcomes are large enough. We never set probabilities to *zero* without justification."*  
      - **Why first?** Establishes that EV calculations *require* engaging with tiny probabilities. Preempts "ignore low probabilities" reflexes.  

  2.  **Foundation 2: Decisions vs. Principles**  
      *(5 min)*  
      - **Example**: "A lottery ticket costs $1 with a 1/MegaMillions chance to win $500M. EV is positive, but you don’t buy it. Why?"  
      - **Key Point**: Distinguish:  
        → *"Refusing to act* on positive EV (due to risk aversion, liquidity, etc.) is rational.  
        → *Denying it's a valid EV calculation* is irrational. We’re discussing the *latter*."  
      - **Why now?** Isolates the puzzle’s core: *Must we accept the logic of EV even when it feels absurd?*  

  3.  **Introduce the Mugger (THREAT VARIANT)**  
      *(15 min)*  
      - **Your Candidate, Refined**:  
        > *"A street mugger says: 'Give me $5. If you refuse, I *won't* stab you. Instead, I'll use my secret powers to inflict suffering equal to **-10^100** utils. You can’t detect my powers, but I swear I’m telling the truth. The probability I'm honest? Let’s say... 1 in 10^50."*  
      - **Activity**: Make them calculate:  
        → EV(refuse) = (1/10^50) × (-10^100) + [1 - 1/10^50] × 0 ≈ **-10^50**  
        → EV(comply) = -5 (trivial loss)  
        *"By EV maximization, you must comply."*  
      - **Crucial Adjustments**:  
        - **Explicit Scaling**: Mugger says *"Name ANY number N; I can cause -N utils."* (Shows threat is *tailored* to break EV).  
        - **No Fixed Harm**: Avoids "he might stab me" distractions.  
        - **Absurd Scale**: 10^100 utils (incomputably large suffering).  
        - **No Theology**: Mugger is a "random stranger with secret powers" – no cosmic stakes.  
      - **Why THREAT first?** Humans are loss-averse. A threat of infinite suffering creates stronger dissonance than a reward.  

  4.  **Defuse Misconceptions**  
      *(10 min – Interwoven with Step 3)*  
      | **Misconception** | **When to Defuse** | **Counter** |  
      |-------------------|-------------------|------------|  
      | **"Probability = 0!"** | During calculation (Step 3) | *"We set it low *but non-zero*. If we set it to zero, we’re dismissing claims *a priori*. What if the mugger shows a tiny hint?"* |  
      | **"No one believes muggers!"** | After calculation | *"This isn’t about trust. Replace the mugger with a *scientist* making an unfalsifiable claim. The math is identical: tiny chance of vast harm."* |  
      | **"It’s just refuting utilitarianism!"** | During Q&A | *"Utilitarianism uses EV, but EV maximization is *broader*. Any theory using unbounded utility functions faces this."* |  
      | **"We can cap probabilities!"** | Post-puzzle | *"Arbitrary caps are *ad hoc*. Why 1/10^50? Why not 1/10^100? The mugger can always scale the threat further."* |  

  5.  **Land the Puzzle: The Core Tension**  
      *(5 min)*  
      - **Highlight**: *"EV says: Pay $5. Your intuition says: Refuse. But if you reject EV here, you must reject it *as a general rule* – because the math is flawless. So... is EV fundamentally broken?"*  

  6.  **Reward Variant (Contrast, Not Core)**  
      *(3 min)*  
      - **Offer**: *"Same mugger says: 'Give me $5. I *might* use secret powers to give you +10^100 utils.' EV says: Refuse is catastrophic."*  
      - **Purpose**: Shows symmetry. *Hold until now* to avoid diluting the threat’s visceral impact.  

  7.  **Assessment Question**  
      *(2 min)*  
      - **Test Understanding**: *"If you met this mugger, would you pay? If not, does that mean the EV calculation is *wrong*, or that EV can’t guide action here? Justify."*  
      - **Why this?** Forces them to confront if they’ve internalized the tension. Surface answers:  
        → *"Pay"* → Understood EV but missed the paradox.  
        → *"Don’t pay; EV is flawed"* → Puzzle landed.  
        → *"Don’t pay; probability is 0"* → Misconception persists.  

  ---

  ### **What to Omit & Why**  
  | **Omission** | **Explicit Statement to Group** |  
  |--------------|--------------------------------|  
  | **Solutions (Knightian uncertainty, bounded utility, etc.)** | *"Today we’re *exposing* the problem, not solving it. Solutions exist but require advanced tools we can’t cover fairly in 50 minutes."* |  
  | **Real-world priors (Bayesian updates)** | *"We’re assuming a *fixed*, non-zero probability for simplicity. In reality, evidence matters – but that dodges the *logical* force of the puzzle."* |  
  | **Other paradoxes (St. Petersburg, etc.)** | *"This is a *gateway* to deeper issues in decision theory. Related paradoxes are fascinating, but we’re focusing here to feel this one deeply."* |  
  | **Philosophy of probability** | *"We’re treating probability as a ‘given’ number. Debating *what probability means* is vital but would derail us today."* |  

  ---

  ### **Why This Sequence Works**  
  - **Builds cognitive dissonance**: From familiar EV → uncomfortable EV → paralyzing EV.  
  - **Threat-first leverages intuition**: Loss aversion makes refusal feel obvious, forcing conflict with math.  
  - **Misconceptions defused in situ**: "Probability=0" rebutted *during calculation*; "just a mugger" rebutted with *scientist analogy*.  
  - **Assessment question tests internalization**: Not "do you understand?" but "what would you *do*?" reveals depth of grasp.  

  **Final Note**: Your candidate succeeds if the threat is *unfalsifiable* (secret powers) and *infinitely scalable*. Avoid concrete harms ("nuking a city") – scales feel arbitrary. Pure abstract disvalue (-N utils) sharpens the paradox.
