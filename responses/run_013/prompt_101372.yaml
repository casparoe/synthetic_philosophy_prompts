prompt: |-
  I've been keeping a list of propositions and marking which ones strike me as Wittgensteinian hinges rather than as things I know, doubt, or could give evidence for, and I'd like to know what principle my marks are tracking. My verdicts: "I have two hands," hinge; "the Earth existed before I was born," hinge; "2 + 2 = 4," hinge; "the name on my passport is my name," hinge; "I am not being deceived right now by an evil demon," hinge; "I'm a good judge of when someone is manipulating me," hinge; "the bar kept as the standard metre is one metre long," not a hinge, just a stipulation; "there are no unicorns," not a hinge, an ordinary empirical belief; "the universe is less than ten thousand years old," not a hinge for me, though I can imagine someone for whom it does that work, and I still want to say it's a belief they hold rather than a hinge. Here is the pair I can't reconcile: "no human has ever walked on the moon" does, I think, function for some people exactly the way my hinges function for me, and I refuse to grant that it's a hinge; whereas "my memory of what I did yesterday is broadly reliable" functions in the same way and I'm content to call it one. My tentative principle is that a hinge is whatever you would treat as exempt from doubt because doubting it would undermine the practice of asking for and giving reasons at all, but that principle seems to make hinges out of the moon-landing denial too, which I won't accept.

  Is there a principle that gets all of these? I want to know whether it has to be framed in terms of the role a proposition plays in someone's practice or in terms of its epistemic status, whether the two can come apart, and how a hinge can later be surrendered and replaced, as I think has happened to propositions people once took entirely for granted. State the principle precisely, say what it implies about cases I haven't listed — a proposition about the reliability of a whole method of measurement, or about what counts as a reason — and tell me honestly which of my verdicts it cannot save and which one I should give up.
reasoning: |-
  Okay, the user has been categorizing propositions as Wittgensteinian hinges or not based on their intuition. They've listed several examples and are struggling with two in particular: "no human has ever walked on the moon" and "my memory of what I did yesterday is broadly reliable." They want a principle that explains all their verdicts and addresses whether hinges are defined by their role in practice or their epistemic status. They also want to know how hinges can change over time.

  First, I need to recall what Wittgensteinian hinges are. From *On Certainty*, hinges are propositions that are immune to doubt, not because they're justified, but because doubting them would make ordinary language games impossible. They're the framework within which doubt and justification occur.

  Looking at their examples, they mark things like "I have two hands" and "2+2=4" as hinges, which aligns with Wittgenstein. The standard meter bar is a stipulation, not a hinge, which makes sense. "No unicorns" is empirical, so not a hinge. The 10,000-year universe isn't a hinge for them, though it might be for others. The conflict arises with moon landing denial and memory reliability. The user sees memory as a hinge but rejects moon landing denial as one, even though for some people, it functions similarly.

  The user's tentative principle is that hinges are exempt from doubt because doubting them undermines the practice of giving reasons. But this would include moon landing denial for some, which they reject. So the challenge is to find a principle that excludes moon landing denial while keeping memory reliability as a hinge.

  I think the key is distinguishing between propositions that are necessary for any language game versus those that are foundational to a specific worldview. Hinges should be universally necessary for basic epistemic practices, not just for a particular belief system. Moon landing denial isn't necessary for the practice of reason-giving in general; it's a local skepticism. Whereas memory reliability is fundamental to personal experience and reason.

  Also, hinges are pre-rational; they're the starting point. Moon landing denial relies on evidence and can be debated, even if some treat it as unquestionable. But their treatment doesn't make it a hinge; it's still an empirical claim. The role in practice versus epistemic status might come apart here. A proposition's role can make it function as a hinge for an individual, but epistemically, it might not be a universal hinge.

  For the principle: A hinge is a proposition that is treated as exempt from doubt because doubting it would paralyze fundamental cognitive or linguistic practices necessary for any justification or doubt. This must be universally necessary, not just for a subgroup. Moon landing denial doesn't paralyze all reasoning; it's specific. Memory reliability, however, is needed for any personal narrative or reasoning about the past.

  On change over time: Hinges evolve as our understanding grows. For example, "the sun orbits the earth" was once a hinge but was replaced by heliocentrism. The framework adapts. So hinges aren't eternal; they can be revised when new paradigms emerge.

  Testing their other cases: The standard meter is stipulative, so not a hinge. "No unicorns" is empirical. The age of the universe is empirical for them, but could be hinge-like for others in a different context. The key is whether it's foundational to their entire epistemic system.

  For new cases: Reliability of a measurement method could be a hinge if it's fundamental to scientific practice. What counts as a reason might be a hinge because challenging it could undermine reasoning itself.

  The user needs to give up treating moon landing denial as a possible hinge. Even if some people treat it that way, it's not genuinely a hinge because it's not universally necessary. Their intuition that it's not a hinge is correct; it's a belief mistaken as foundational. Whereas memory reliability is a legitimate hinge.

  So the refined principle emphasizes universal necessity for basic practices, and moon landing denial doesn't meet that. The user should adjust their view on that, accepting that some beliefs can mimic hinges without being true hinges.
answer: |-
  Your struggle captures a core tension in interpreting Wittgenstein's hinge epistemology: hinges must be *universally* necessary for the practice of reasoning, not *locally* foundational for a specific worldview. Your tentative principle ("exempt from doubt because doubting it would undermine the practice of asking for and giving reasons") is on the right track but overextends. I'll refine it, resolve your conflict, address your questions, and test it against your cases.

  ### The Principle: Universal Enabling Conditions for Epistemic Practices
  **A proposition functions as a hinge iff:**  
  1. **It is treated as immune to doubt** in one's epistemic practices (role-based).  
  2. **Doubting it would paralyze not just specific beliefs, but the very possibility of coherent justification/doubt across *all* ordinary language games** (universal scope).  
  3. **It lacks empirical or logical justification *because* it is presupposed by the practices that would justify/doubt anything** (epistemic status).  

  **Corollary:** Hinges are *framework conditions* for intelligibility. They are not beliefs (which can be true/false, justified/unjustified) but the "scaffolding" (*On Certainty* §211) that makes belief/doubt possible. This reconciles role and status: the epistemic status (unjustifiable/un-doubtable) *derives from* the functional role (enabling inquiry).  

  **Why role and status cannot fully come apart:**  
  - If a proposition has the *epistemic status* of a hinge, it must *play the role* of one (otherwise, it's just an unjustified belief).  
  - If it *plays the role* for someone, but lacks the *universal necessity* of hinges (e.g., moon-landing denial), it mimics a hinge locally but isn't one—it's a *dogma* mistaken for a hinge.  

  **How hinges change:** Hinges evolve when paradigm shifts alter what counts as "ordinary" epistemic practices. For example:  
  - Pre-Copernican: "The Earth is immovable" was a hinge (doubting it made spatial reasoning incoherent).  
  - Post-Copernican: It became an empirical claim, replaced by new hinges (e.g., "Physical laws apply universally").  
  Change occurs when a new framework absorbs the old hinge into its empirical content, reconfiguring what is "unthinkable" to doubt.  

  ### Resolving Your Conflict: Moon-Landing Denial vs. Memory Reliability
  - **"My memory is broadly reliable"** is a hinge:  
    - Doubting it paralyzes *all* personal narratives, historical reasoning, and even basic agency (e.g., "Why did I open the fridge?" requires trusting memory).  
    - It is universal: *Everyone* must presuppose memory reliability to engage in *any* practice involving past experiences.  
    - Epistemic status: You cannot "prove" memory is reliable without circularity (using memory to validate memory).  

  - **"No human walked on the moon"** is **not a hinge**, even for deniers:  
    - Doubting it *does not* paralyze all reasoning—it only challenges a specific historical/scientific claim. Deniers still use hinges like "NASA exists" or "video evidence is sometimes faked" to build their case.  
    - It lacks universality: It is irrelevant to most language games (e.g., cooking, calculating, or recalling yesterday). For deniers, it functions as a *core empirical dogma*, not a framework for doubt itself.  
    - Epistemic status: It *could* be justified/falsified (e.g., via lunar samples, retroreflectors). Its "undoubtability" for some stems from ideology, not epistemic necessity.  

  **Key distinction:** Hinges underpin *the method*, not *the conclusion*. Moon-landing denial rejects a conclusion while relying on hinges (e.g., "sense perception is generally reliable"). Memory reliability *is* part of the method.  

  ### Applying the Principle to Your Cases
  | Your Proposition              | Your Verdict | Principle's Verdict | Why |  
  |------------------------------|--------------|---------------------|-----|  
  | I have two hands             | Hinge        | **Hinge**           | Doubting it undermines bodily awareness, agency, and sensory evidence—foundational to interaction with the world. |  
  | Earth existed before my birth| Hinge        | **Hinge**           | Required for historical/causal reasoning; doubting it collapses narratives of origin, cause, and time. |  
  | 2 + 2 = 4                   | Hinge        | **Hinge**           | A norm of counting; doubting it invalidates mathematics as a practice. |  
  | Passport name is my name     | Hinge        | **Hinge**           | Undermines identity, social contracts, and language-use (e.g., referring to oneself). |  
  | I am not deceived by a demon | Hinge        | **Hinge**           | Necessary to trust cognitive faculties (perception, reason)—skepticism here annihilates all inquiry. |  
  | I’m a good judge of manipulation | Hinge    | **Not a Hinge**     | This is an empirical self-assessment. Doubting it doesn't paralyze reasoning—it might prompt reflection or evidence-seeking. It’s a *belief*, though deeply held. |  
  | Standard metre is 1m long    | Not hinge    | **Not Hinge**       | Pure stipulation (like defining "bachelor"), not a world-directed certainty. |  
  | There are no unicorns        | Not hinge    | **Not Hinge**       | An empirical claim based on evidence (e.g., biology, exploration). |  
  | Universe < 10,000 years old | Not hinge    | **Not Hinge**       | An empirical (if false) belief; its hinge-like role for some is dogmatic, not universal. |  
  | Memory broadly reliable      | Hinge        | **Hinge**           | As above: universal enabler for temporal reasoning. |  
  | No moon landing              | Not hinge    | **Not Hinge**       | As above: locally foundational dogma, not universal. |  

  **Verdicts to revise:**  
  - **Give up "I’m a good judge of manipulation" as a hinge.** It’s a fallible self-evaluation. Doubting it might cause distress but doesn’t cripple all epistemic practices.  
  - **Stand firm on "no moon landing is not a hinge."** Your intuition is correct—it’s a dogma, not a hinge.  

  ### Unlisted Cases: Testing the Principle  
  1. **"Atomic clocks reliably measure time":**  
     - **Not a hinge.** It’s a high-confidence empirical claim based on scientific consensus. Doubting it wouldn’t paralyze reasoning—it would prompt calibration against other methods (e.g., celestial navigation). Atomic clocks are *tools*, not preconditions for doubt.  
     - *Contrast with*: "Time measurement is possible," which *is* a hinge (doubting this invalidates schedules, physics, history).  

  2. **"Empirical evidence counts as a reason":**  
     - **Hinge.** Doubting that evidence can justify beliefs collapses science, law, and everyday decisions. This is universal: even skeptics use evidence to argue their case.  
     - *But note*: *What counts* as evidence can evolve (e.g., shifting from testimony to data). The hinge is the *role* of evidence, not its form.  

  ### Why This Works
  Your marks track propositions that are **transcendental conditions for experience**: they make inquiry possible *prior to* evidence. The principle saves all your core intuitions except one ("I’m a good judge..."), which is too specific and empirical. Moon-landing denial fails because it’s a *substitutable* belief—hinges are not. If society accepted moon-landing denial as fact, it would become a *background belief*, not a hinge (like "no unicorns"). Hinges operate at a deeper level: they are how we *anchor* beliefs, not the beliefs themselves.  

  **Honest conclusion:** You’ve grasped the spirit of hinges brilliantly. Your only misstep was extending "hinge" to a few empirical self-assessments. Surrender "I’m a good judge..." and celebrate rejecting moon-landing denial as a hinge—it reveals the crucial line between universal necessity and contingent dogma.
