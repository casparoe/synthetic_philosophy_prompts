prompt: |-
  Ok, I'm drowning in marking and I want a second pair of eyes on one script before I hand the stack back. It's for my philosophy of law seminar (upper level, mixed law and philosophy students, so they know the standard moves but they're not specialists). The question I set is below, followed by what one student wrote. Give me a grade and the comments you'd actually scrawl in the margin -- point by point, tied to specific sentences, not a general impression. I care less about whether they landed on the right result than whether the reasoning holds up, but say something about both, and don't pad it out by praising things that are just fine. If a step doesn't follow, say so. No citations needed, I know the literature.

  The question:

  Coastal Stormwater Retention Act (hypothetical -- I wrote it for the exam so nobody could look it up)

  § 4(a) No new commercial structure exceeding five thousand square feet in gross floor area shall be issued a certificate of occupancy unless at least fifty percent of the structure's roof surface is covered by a living roof.

  § 4(b) "Living roof" means a roof assembly in which a layer of growing medium at least three inches deep supports live vegetation.

  § 4(c) This section shall not apply to any structure the primary function of which is the collection of solar energy.

  § 4(d) For the purposes of this section, "roof surface" does not include any area occupied by mechanical equipment, skylights, or photovoltaic panels.

  Preamble. The legislature finds that urban heat islands and combined sewer overflow are the two principal stormwater problems facing the state, and that dispersed retention of rainfall at the point where it falls is the most cost-effective means of abatement available to the state.

  Facts. Ridgeline Logistics wants to build a 6,000 sq ft warehouse. The roof plan is 3,000 sq ft of living roof and 3,000 sq ft of photovoltaic array. The array supplies most of the building's electricity, but the building is a warehouse -- nobody makes a living there by generating solar. The agency proposes to deny the certificate, on the ground that the structure is not primarily for the collection of solar energy and that only half the roof is living roof.

  What I asked: Does § 4 require the agency to issue the certificate? Answer once as a textualist and once as a purposivist, then say whether the two methods converge on this case and why.

  The student's answer:

  The issue is whether the Ridgeline warehouse satisfies § 4(a) or falls within the § 4(c) exemption.

  Textualism. A textualist asks what the enacting legislature actually intended the words to do, so the first move is to consult the legislative history -- committee reports, floor statements, and the preamble -- to recover that intent. Here the preamble is clear that the target is stormwater, so the legislature cannot have meant to exempt a warehouse whose roof is only half solar. On the words themselves, "primary function" is vague, but a warehouse's primary function is storage, not electricity generation, so § 4(c) doesn't apply. That leaves § 4(a): the living roof covers 3,000 of the building's 6,000 square feet of roof, exactly 50%, which just clears the "at least fifty percent" threshold. So the certificate must issue.

  Purposivism. A purposivist doesn't stop at the words; she asks which outcome does the most good overall, treating the statute as one input among several. The preamble tells us the legislature's real goal is dispersed retention of rainfall, and a living roof over half the building does retain rainfall where it falls, so the purposive analysis favors issuing the certificate. The solar carve-out exists to avoid burdening renewable energy, and here the array is a secondary feature of a warehouse, so it doesn't swallow the rule.

  Conclusion. Both methods converge on the same result, so the agency must issue the certificate. The case is easier than it looks: the only real work is noticing that "primary function" is doing all the heavy lifting in § 4(c), and both methods read it the same way. And note that a textualist would refuse to look at the preamble at all, which is exactly why the convergence here is worth flagging -- you get the same answer either way.

  Grade it and tell me what you'd write on it.
reasoning: |-
  Okay, the user wants me to grade and comment on a student's philosophy of law exam answer. Let me start by understanding the scenario. The professor is overwhelmed with marking and needs a second opinion on this specific script. The student's answer deals with interpreting a hypothetical statute about stormwater retention and solar energy exemptions.

  First, I need to evaluate both the textualist and purposivist approaches the student presented. The student claims that textualism involves looking at legislative history like the preamble to determine intent. But I recall that textualism actually focuses on the plain meaning of the text, not legislative intent. The student's confusion here is a significant error. They also mention that a textualist wouldn't look at the preamble, but their own analysis uses it, which is contradictory. That's a major point to flag.

  Next, the purposivist section. The student correctly notes that purposivism considers the statute's purpose but frames it as doing "the most good overall," which is more policy-based than statutory interpretation. Purposivism still centers on the statute's purpose, not broader societal good. The student's conclusion here is right, but the reasoning is off. They also misinterpret the solar carve-out's purpose, which is to avoid burdening solar energy facilities, not just any building with panels. The warehouse's primary function isn't solar collection, so the exemption shouldn't apply. But the student's reasoning about it being a secondary feature is correct, even if their rationale is flawed.

  The conclusion mentions convergence, which is accurate, but the reasoning errors undermine the argument. The student also wrongly states that a textualist wouldn't look at the preamble, which contradicts their earlier use of it. The grade should reflect these issues. Since the bottom line is correct but the reasoning is flawed, a B- seems appropriate. The comments need to point out specific errors without padding.

  I should make sure my feedback is tied to specific sentences, as the user requested. Highlighting the textualism mistake, the preamble confusion, and the purposivism mischaracterization is crucial. The student needs to understand where their reasoning went astray despite the correct outcome. Also, noting the §4(c) exemption analysis being correct by coincidence but for wrong reasons is important. The user emphasized not praising just adequate parts, so focus on critical feedback where necessary.
answer: |-
  **Grade: B-** (Correct bottom line but flawed reasoning in both sections; shows grasp of concepts but misapplies key tenets)  

  **Marginal Comments (by sentence):**  

  1.  **"Textualist asks what the enacting legislature actually intended..."**  
      *[WRONG START] Textualism explicitly *rejects* seeking subjective legislative intent; it asks what the words mean *objectively* to a reasonable user at enactment. -1*  

  2.  **"...first move is to consult legislative history..."**  
      *[INCORRECT] No, textualism's first move is *text* (plain meaning, definitions, structure). Legislative history is suspect/disfavored. -1*  

  3.  **"Here the preamble is clear..."**  
      *[CONTRADICTION] You just said a textualist consults history/preamble, but your own Conclusion admits they wouldn't. Contradicts §4(d) definition exclusion too?*  

  4.  **"On the words themselves, 'primary function' is vague..."**  
      *[BETTER] Yes, this *is* the textualist move: analyze statutory terms using ordinary meaning.*  

  5.  **"...a warehouse's primary function is storage... §4(c) doesn't apply."**  
      *[CORRECT] Textually sound conclusion on §4(c). "Primary function" = core activity, not incidental feature.*  

  6.  **"That leaves §4(a):... exactly 50%... just clears... certificate must issue."**  
      *[CORRECT] Math checks out; "at least 50%" includes 50%. PV area excluded by §4(d) too.*  

  7.  **"Purposivist... asks which outcome does the most good overall, treating statute as one input..."**  
      *[OVERSIMPLIFIED] Purposivism seeks the *statute's* purpose (from text/structure/context), not "most good overall" (that's policy, not interpretation). -1*  

  8.  **"The preamble tells us the legislature's real goal is dispersed retention... purposive analysis favors issuing."**  
      *[CORRECT RESULT, SHAKY GROUND] You identify the purpose correctly & outcome aligns. But note: purpose is *retention*, living roof provides it. Solar exemption avoids *conflict* with solar function.*  

  9.  **"The solar carve-out exists to avoid burdening renewable energy..."**  
      *[SPECULATIVE] Statutory purpose for exemption comes from text/structure: it exempts structures *whose primary function IS solar collection*. You're adding a broader "renewable energy burden" policy not stated. -0.5*  

  10. **"Conclusion: Both methods converge... certificate must issue."**  
      *[CORRECT] Agreed.*  

  11. **"The case is easier... 'primary function' is doing all the heavy lifting... both methods read it same way."**  
      *[INSIGHTFUL] Yes, core ambiguity is §4(c)'s scope.*  

  12. **"And note a textualist would refuse preamble... why convergence is worth flagging."**  
      *[CONTRADICTION & CORRECT POINT] You correctly note textualist skepticism of preamble NOW, but *used it in your textualist analysis*. Convergence *is* noteworthy here. -0.5 for inconsistency.*  

  **Summary Feedback:**  
  *Bottom line (certificate issues) is correct under both methods. BUT:*  
  -   **Major Flaw:** Misdefined textualism (seeking intent via history) & misapplied it (using preamble). Textualism should focus *only* on §4(a)-(d):  
      *   §4(c) exemption hinges on "primary function" (ordinary meaning = warehouse stores goods, doesn't collect solar).  
      *   §4(a) requires ≥50% "roof surface" as defined in §4(d) (excludes PV panels). 3000/6000 = 50% → satisfies.  
      *   Preamble shouldn't feature in textualist analysis.  
  -   **Minor Flaw:** Overstated purposivism ("most good overall"). Purposivism here asks: "Does exempting *this* warehouse undermine the statute's *retention* purpose?" Answer: No, half living roof still provides retention. Solar exemption purpose (avoid conflict for *solar-primary* structures) isn't triggered.  
  -   **Good:** Correctly identified §4(c) as key, accurately applied "primary function" meaning, spotted convergence significance.  
  *Fix the core definitions of textualism/purposivism next time. Grade reflects correct outcome despite shaky paths.*
