  ### Activity Design: **"The Preference Cycle Game"**

  #### **Materials**
  1. **Tokens**: Three types of non-monetary items representing distinct goods (e.g., colored cards: **Red** = Bike, **Blue** = Kayak, **Green** = Guitar).  
     - **Quantity**: 5 red, 5 blue, 6 green (for 16 students; slight imbalance ensures trade demand).  
  2. **Point Chips**: Each student gets 10 chips (representing "satisfaction points," not money).  
  3. **Trader’s Ledger**: A visible board to post trade rules and fees.  
  4. **Commitment Cards**: Blank index cards for Round 2.  
  5. **Timer**: For structured phases.  

  ---

  #### **Timeline (75 Minutes)**  
  **Goal**: Students experience cyclical trades with fees, then replay with foresight/commitment.  

  | Phase          | Time     | Activity Steps                                                                                                                                 |
  |----------------|----------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Setup**      | 0-5 min  | Distribute tokens (randomly: 5 red, 5 blue, 6 green) and 10 point chips per student. Explain: *“Maximize your points. Tokens have no inherent value—trade if you think it’ll improve your outcome.”* |
  | **Round 1: Myopic Trading** | 5-25 min | **Trader announces schedule in advance** (written on ledger):<br>1. `Trade 1`: Red → Blue + pay 1 chip fee.<br>2. `Trade 2`: Blue → Green + pay 1 chip fee.<br>3. `Trade 3`: Green → Red + pay 1 chip fee.<br>- Students trade *sequentially* (1 trade/step).<br>- **Key**: No discussion allowed. Trader collects fees. |
  | **Reflection** | 25-30 min| Ask: *“Raise your hand if you have fewer points than you started with. Same token?”* Highlight losses/cycle completion.                         |
  | **Round 2: Foresight & Commitment** | 30-55 min| **Reset**: Return tokens/points to start.<br>- **Step 1 (Foresight)**: Trader reveals the *same* 3-trade schedule upfront.<br>- **Step 2 (Commitment)**: 5 min for students to write a *binding plan* on cards: *“I will [trade/not trade] in Step 1, 2, 3.”*<br>- **Step 3 (Execution)**: Run trades *in order*. Enforce commitment cards (no deviations). |
  | **Debrief**    | 55-75 min| Guide discussion using questions below.                                                                                                        |

  ---

  #### **Debrief: Mapping Activity to Money Pump Argument**  
  | Activity Moment               | Money Pump Concept                                                                                                | Discussion Questions                                                                                                                                 |
  |-------------------------------|-------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Token trades + fees**       | Cyclic preferences exploited by small, incremental losses.                                                        | *“Why did you trade each time? What felt different when you saw the whole cycle upfront but couldn’t act?”*                                          |
  | **Round 1 outcome**           | Myopia: Agents accept locally attractive trades without global awareness, leading to net loss.                     | *“Why did knowing the schedule in advance NOT prevent the cycle? Is foresight alone enough?”*                                                        |
  | **Commitment in Round 2**     | Precommitment as a tool to resist exploitation.                                                                   | *“How did writing a plan change your choices? Who avoided the cycle? What did you sacrifice?”*                                                       |
  | **Contrast: Foresight vs. Commitment** | Foresight ≠ commitment. Myopic agents still cycle if they lack tools to bind themselves.                          | *“Why is ‘seeing it coming’ different from ‘tying your hands’? How does this relate to real-life subscription traps?”*                               |
  | **Final argument**            | Core tension: Is the irrationality in the preferences or the myopia?                                              | *“Did cyclic preferences *cause* the loss, or was it the lack of commitment? Are you arguing about rationality or self-control?”*                    |

  ---

  #### **Predictable Challenges & Mitigation**  
  - **First-run hiccups**:  
    - *Problem*: Students may refuse trades (breaking the cycle) if they sense exploitation.  
    - *Mitigation*: Emphasize *“no right answers”* and reward participation. Use token imbalance (e.g., extra greens) to incentivize trading.  
  - **Commitment confusion**:  
    - *Problem*: Students write vague plans (e.g., *“maybe trade”*).  
    - *Mitigation*: Require binary *“will/won’t trade”* per step. Enforce strictly.  
  - **Emotional disconnect**:  
    - *Problem*: Points feel artificial, dampening "loss" impact.  
    - *Mitigation*: Use visceral language (*“fees = effort/time/stress”*) during debrief.  

  ---

  #### **What the Activity Cannot Reproduce (Instructor Notes)**  
  1. **Real-world stakes**:  
     - The game lacks emotional weight of losing money/time. *You must supply this* by sharing your story (bike → kayak → guitar) and asking students to recall similar experiences (e.g., app subscriptions, gym memberships).  
  2. **Temporal dispersion**:  
     - Real cycles occur over weeks/months, reducing salience. *Highlight*: *“The pump exploits how we discount future losses—today’s ‘small fee’ feels trivial.”*  
  3. **Complex preferences**:  
     - Tokens oversimplify multidimensional goods (e.g., a guitar’s sentimental value). *Note*: *“Cyclic preferences often emerge when we value attributes inconsistently.”*  

  ---

  #### **Stakes & Emotional Hook**  
  - **Stakes**: Points represent psychological "satisfaction." Losing chips = accumulating regret. Winning = avoiding self-exploitation.  
  - **Hook**: *“This isn’t about money—it’s about watching your future self get hijacked by choices that feel right in the moment.”*  

  #### **Post-Activity Transition**  
  - End with: *“So: Is the money pump an argument against cyclic preferences? Or an argument for binding your future self? Your next reading tackles this—but first, argue with each other!”*  

  By experiencing the cycle physically (tokens, chips, enforced trades), students internalize the money pump. The commitment round forces them to confront myopia as the root cause, setting up a debate that mirrors ongoing philosophical disputes (e.g., vs. hyperbolic discounting).
