                        - Step 2: Apply the hidden effects of the ideas you hold. (We don't tell you what they are, but they might change your energy.)
                        - Step 3: If your energy is negative, you must drop ideas until it is non-negative. Drop one idea at a time and recalc until energy >=0.

                  Special event: At the start of round 3, everyone must create a new idea. We'll tell you what kind then.

                  Game lasts 5 rounds.

                  Any questions?"

          Then start.

          After the game, in the debrief:

            - First, ask what happened. Which ideas were common? Why?
            - Ask the holders of the Star idea: what was it like? How did it affect your energy? How did it affect your ability to hold other ideas?
            - Ask about the Circle idea: did anyone notice they had extra energy?
            - Ask about round 3: show of hands, who created a four-leaf clover? a horseshoe? etc. Were there duplicates? How did that happen?
            - Then map to cultural evolution: 
                  Variation: new ideas from invention and mutation (errors in transmission).
                  Inheritance: transmission of ideas from one to another.
                  Selection: some ideas spread more because they are more transmissible (like the Star) or because they are beneficial (like the Circle). But note: the Star spread even though it was costly? Why? Because of the transmission rule.

            - Point out the burden: the Star idea was costly to the carrier but spread because of its high transmissibility. This is like a cultural trait that is a burden but spreads because it is catchy or because it compels the carrier to spread it.

            - The limited capacity: competition within the mind. This is like selective attention: we can't hold all ideas, so some get dropped.

            - Convergence: independent invention. In culture, similar ideas can arise in different places. In biology, convergence happens too, but the underlying mechanism is different (natural selection shaping similar traits from different genetic starting points).

            - Where the analogy breaks:
                  - The transmission rules are arbitrary and fixed. In reality, an idea's transmissibility comes from its content and context.
                  - We modeled energy as a finite resource, but in reality the cost of an idea might be in terms of time, social capital, etc.
                  - We had a fixed network of interactions? Actually, it was random.

            - For the students who joked: "You might have noticed that some ideas spread even though they were silly. That's because the rules of transmission don't care about the content. In the real world, catchy ideas spread regardless of their truth or value. This is why we have to be critical of what we accept."

   15. What if the Star idea doesn't spread? 

          We started with two. If they are dropped early, then it doesn't spread. We can have the teacher, at the start of round 2, if the Star is not present, introduce one? But we don't want to interfere too much.

