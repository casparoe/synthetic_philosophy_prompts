  ### **Game Design: "The Idea Ecosystem"**

  #### **Learning Goals**
  - Experience intra-individual competition: Holding one idea forces out another.
  - Feel the burden of a "successful" idea that harms its carrier.
  - Observe convergence (independent invention) vs. inheritance.
  - Discover that transmission success depends on **low cost, memorability, and transmissibility**—even if the idea is harmful.

  ---

  ### **Materials** (Per Student)
  - **1 envelope** (represents their "mind," holds idea cards).
  - **3 blank index cards** (cut into halves; 1.5" x 2.5" each).
  - **1 marker**.
  - **3 energy tokens** (e.g., small paper circles, buttons, or pebbles).
  - **1 rule sheet** (hidden until debrief; lists energy costs/benefits).

  #### **Starting Setup**
  - **Teacher prepares 12 idea cards** (3 each of 4 types). Write symbols + phrases:
    - ★: "Share this with 3 people!" (Costly idea)
    - ●: "Keep this safe." (Beneficial idea)
    - ▲: "Pass it forward." (Neutral idea)
    - ■: "Hold for luck." (Neutral idea)
  - Distribute cards randomly (some students start with 1 idea, others with 0).
  - Place extra blank cards and tokens in a central pile.

  ---

  ### **Rules** (Presented as a "Social Strategy Game")
  **Goal**: "Collect ideas and tokens. No further explanation—learn by playing."  
  **Core Mechanics**:  
  1. **Minds are limited**: Envelopes hold **max 3 idea cards**.  
  2. **Interaction Phase**: Exchange ideas face-to-face.  
  3. **Energy Phase**: Tokens fuel idea retention. Run out of tokens? Drop ideas.  

  #### **Phases per Round** (8 minutes total)
  1. **Interaction (4 min)**:
     - Pair up freely. In each interaction:  
       - Share **one idea** by redrawing it *verbatim* on a blank card and handing it to your partner.  
       - Partners **must accept** the idea. If their envelope is full, they **drop one card** to make space.  
     - ★-carriers **must share ★ first** in their next 3 interactions (forces costly transmission).  

  2. **Energy (4 min)**:
     - All sit. **Gain 1 token** (simulates "metabolism").  
     - **Apply hidden costs** (per rule sheet):  
       - ★: Lose 1 token (burdens carrier).  
       - ●: Gain 1 token (benefits carrier).  
       - ▲/■: No effect.  
     - **Drop ideas if tokens < 0**.  

  #### **Special Event: Round 3 Convergence Trigger**
  - **After Interaction Phase**: "A global event occurs: Everyone invents a **new idea** about 'success.' Draw a symbol and phrase. Add it to your mind."  
  - *Teacher note*: Students often create similar ideas (e.g., "Win at all costs!"). If not, seed duplicates subtly.  

  ---

  ### **Round Structure** (90 Min Total)
  | **Time** | **Activity**                | **Notes** |
  |----------|-----------------------------|-----------|
  | 0-10 min | Setup + rule explanation    | Hide evolutionary framing. Say: "Exchange ideas; manage tokens." |
  | 10-18 min| Round 1                     | Monitor ★-carriers; ensure they share 3x. |
  | 18-26 min| Round 2                     | Track energy crises (forced idea drops). |
  | 26-34 min| Round 3                     | **Convergence moment**: Invent "success" ideas. |
  | 34-42 min| Round 4                     | ★ should dominate; energy shortages peak. |
  | 42-50 min| Round 5                     | Final state: Most hold ★, few tokens left. |
  | 50-90 min| Debrief                     | See below. |

  ---

  ### **Predictable Problems & Fixes**
  1. **★ Dies Early** (if carriers drop it):  
     - **Fix**: In Round 2, discreetly give ★ to a high-energy player.  

  2. **Convergence Fizzles** (invented ideas diverge):  
     - **Fix**: Note similar phrases during Round 3 (e.g., "Two students made 'Never give up!'"). Use in debrief.  

  3. **Students Treat It as a Joke**:  
     - **Fix**: Assign roles ("You’re policymakers/explorers"). Redirect with: "How might this apply to viral trends?"  

  4. **Everyone Holds ★** (game goes flat):  
     - **Fix**: Trigger "mutations"—e.g., "A new idea emerges: ✿ 'Rebel against stars!'"  

  ---

  ### **Debrief** (40 Min)
  **Start**: "What patterns did you see?"  
  **Map Game → Evolution**:  

  | **Game Moment**             | **Evolution Concept**               | **Analogy Notes**                     |
  |-----------------------------|-------------------------------------|---------------------------------------|
  | ★ spreads despite cost      | Selection for transmissibility      | Costly ideas win if "contagious."     |
  | Full envelope → drop idea   | Intra-individual competition        | Brain attention as limited resource.  |
  | Round 3 invented ideas      | Convergence vs. inheritance         | Hard to distinguish in culture.       |
  | ● died out                  | Benign ideas lose without "drive"   | Neutral traits can vanish.            |
  | Energy crisis → drop ★      | Selection against burdened carriers | Harmful ideas can persist if catchy.  |

  **Strained Analogies**:  
  - **Energy tokens ≠ calories**: Tokens abstract "cognitive resources" (time, attention).  
  - ★-rule ≠ biology: Transmission rules simulate social compulsion (e.g., religious mandates).  
  - **Inheritance fidelity**: Game has perfect copying; real culture mutates.  

  **Address Jokers**:  
  - "Yes, this *is* how memes spread—but also how harmful norms persist. Why might that be dangerous?"  

  **Close**: "What would ‘fitness’ mean for an idea? How might we resist harmful but catchy ideas?"  

  ---

  ### **Teacher Notes**
  - **What the Game Can’t Model**:  
    - Environmental change (e.g., shifting "costs" mid-game).  
    - Rational adoption (players follow rules, not utility).  
    - Group-level effects (e.g., institutions).  
  - **Supply These in Debrief**:  
    - "In reality, ideas compete in changing environments. A ‘costly’ idea might become beneficial if the world shifts."  
    - "Humans sometimes adopt ideas rationally—but often, transmission is automatic, like in this game."  

  **Run It Smoothly**:  
  - Walk around during interactions to enforce ★-sharing.  
  - In energy phases, call out: "★-holders: lose 1 token!" to highlight burden.  
  - If energy crises are rare, secretly triple ★’s cost in later rounds.  

  This game makes the costs of cultural "fitness" visceral. By the end, students will have felt why catchiness beats rationality—and why that’s a problem.
