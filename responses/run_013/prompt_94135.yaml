  - Why they clash: Consequentialism (1) values the reduction of suffering and the good of sentient beings. But (5) says nirvana is a good in a separate category, beyond ordinary happiness. This might be in tension because consequentialism usually values states of being (like happiness, absence of suffering) and nirvana might be seen as one such state. However, if nirvana is not a state of a sentient being (because it is the cessation of the being, in a way), then it might not be captured by "the good of sentient beings". Also, the path to nirvana might involve practices that don't immediately reduce suffering (e.g., asceticism). But note: the path is designed to lead to the ultimate reduction of suffering. So they can be aligned. However, if nirvana is the ultimate good, but consequentialism is about the good of sentient beings, and nirvana is the cessation of sentient existence (in a sense), then there might be a conflict: is the goal to produce nirvana (which might be seen as extinction) or to improve the lives of sentient beings? 
