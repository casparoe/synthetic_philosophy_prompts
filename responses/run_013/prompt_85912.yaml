  "What Would Actually Move Me": User might be moved by empirical cases where practice changes didn't alter emotions, or where shame functions reparatively in some contexts. But they might only pretend to weigh theoretical critiques from determinism.

  Bottom Line: The view has merit but needs qualification. Cultural choice is possible but constrained. Acknowledge the insights while refining the claims.

