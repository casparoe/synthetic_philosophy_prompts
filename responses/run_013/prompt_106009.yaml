  Here’s a toast that honors Ray, navigates your perspective gently, focuses on his character, and keeps it warm and within your constraints:

  **(Clink glass)**

  "To Ray! Twenty-five years. A quarter-century of showing up, building this company, and keeping homes and businesses safe. That’s no small thing. We’re here to celebrate you, brother – your grit, your dedication, and the genuine care you’ve always shown for your team and your customers.

  Now, anyone who knows Ray knows he’s a good man. Truly. He’s built something solid, provided for people, and tackled a tough, essential job with integrity. He solves problems for folks, plain and simple.

  Okay, confession time: I recently got... lost... down a bit of a rabbit hole. Started reading these wild articles about... well... bugs. And probabilities. And numbers so big they made my head spin. Let's just say my mind tried to do some math about the scale of it all. *(Light, self-deprecating chuckle)*

  But that’s *my* weird detour. It doesn’t change this moment, or this man. Because Ray wasn’t pondering cosmic questions while crawling under a porch. He was doing a job – a job people needed done – with focus, skill, and a commitment to doing it right. He built trust. He built a team – look at you guys! – who respect him. He built a life and a legacy based on hard, honest work.

  That’s what we celebrate today. The man who showed up, rain or shine, for 25 years. The brother who’s always had my back. The friend and boss who earned loyalty through decency. Ray, you’ve earned this next chapter. Kick back, relax, enjoy every minute. We’re all so incredibly proud of you.

  To Ray! Cheers!"

  **Why this works:**

  1.  **Focuses on Ray:** Celebrates his work ethic, character ("genuine care," "integrity," "good man"), building a business, providing for others, and leadership.
  2.  **Acknowledges Your Thought (Briefly & Lightly):** Mentions your "rabbit hole," "weird detour," and "math" without specifics. The vague "scale of it all" hints without lecturing. Calling it *your* "weird detour" disarms it.
  3.  **Contextualizes Ray's Work:** Frames it as solving problems people *needed* solved ("essential job," "job people needed done"), emphasizing his skill and commitment within that context.
  4.  **Avoids Falsehoods:** Doesn't claim bugs *don't* feel anything, but doesn't assert they do. Focuses on Ray's practical role ("He was doing a job").
  5.  **Affectionate & Warm:** Uses "brother," "proud," "cheers," highlights loyalty and respect from his team. The self-deprecating humor about your own thoughts keeps it light.
  6.  **Not an Accusation:** Explicitly separates your thoughts from Ray's actions ("But that’s *my* weird detour"). Praises his *character* and *work ethic* within the reality of his profession.
  7.  **Under 350 Words:** This lands around 300 words.
  8.  **Appropriate for Audience:** Praises the team, keeps the potentially awkward part brief and humorous, ends strongly on celebration and affection. Mom and Aunt will hear the love for Ray. The crew will hear respect for their work and their boss.

  Deliver it with warmth, a genuine smile for Ray, and a slightly sheepish grin when mentioning your "weird detour." Keep the focus squarely on celebrating *him*. Cheers!
