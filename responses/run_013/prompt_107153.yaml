prompt: |-
  I run a weekly 50-minute "life studies" seminar for about thirty 16-year-olds at a school with no philosophy department, and the whole gimmick is that we read one biography or one saint's life a week and try to get something out of it for our own lives. The problem is the kids (and honestly me) end up either saying "wow, inspiring" or "well, different times," and nothing lands. I want to steal the actual machinery behind this instead of reinventing it: the way Plutarch wrote paired lives and then a comparison of the pair, the way hagiographers built a saint's life so it could be imitated on a feast day rather than just admired, and the older idea that reading a life is holding a mirror up to yourself rather than watching someone else.

  So turn that into a proceedure I can actually run in a session. Give me the questions to ask in order -- about the person, about the particular deeds, about the gap between their situation and ours -- what counts as a good enough answer to each, where the procedure should stop and say this life has nothing to teach us here, and where it should stop and hand the thing over to my own judgement because it's a values question the method can't settle. I don't want a lesson-plan template or a worksheet, I want the reasoning in order with the failure modes named.

  Then run it on two cases. First the standard edifying saint's life, the Francis of Assisi kind of story, where the whole point of the genre is that you're supposed to imitate it. Second a morally mixed modern life: a genuinely great scientist or reformer who was, by all accounts, a monster to his own family. I suspect the procedure will tell me the first is less usable than it looks and the second more usable than the kids expect, and if it doesn't, tell me why I'm wrong.

  Also be straight with me about what this can't do. If the Plutarch-and-hagiography machinery only works because those authors already knew what a good life looked like and were just illustrating it, say so, because then my seminar is doing something different from what they were doing and I need to know that.
reasoning: |-
  Okay, the user runs a weekly "life studies" seminar for 30 sixteen-year-olds. They read a biography or saint's life each week, aiming to extract personal lessons. The problem is the discussions are shallow—either "inspiring" or "different times"—and nothing resonates. They want a structured method based on Plutarch's paired lives and hagiography's imitation focus, turning reading into a self-reflective mirror rather than just admiration.

  First, I need to understand their core issue: superficial engagement. The current approach lacks depth, leading to unproductive responses. The user wants a procedural framework that forces deeper analysis and personal connection, moving beyond admiration or dismissal. They specifically mention Plutarch's comparisons and hagiographers' design for imitation. 

  The user’s explicit request is for a step-by-step reasoning process with named failure modes. They want to avoid templates and focus on the underlying logic. They also want two case studies: St. Francis (traditional saint) and a morally complex modern figure (e.g., a brilliant but abusive scientist). The goal is to test if the method makes the saint less imitable and the flawed figure more instructive. Additionally, they seek honesty about the method’s limitations, especially if it relies on predefined virtues.

  Digging deeper, the user might feel frustrated with the lack of transformative outcomes. Their reference to Plutarch and hagiography suggests they value historical pedagogy but recognize its cultural distance. They need a bridge between ancient methods and modern teenagers' realities. Unspoken needs include fostering critical thinking, ethical reasoning, and personal agency in students. They might also want to validate their own teaching approach, ensuring it’s not just anecdotal but methodologically sound.

  For the framework, I consider designing a procedure with clear phases: Deconstruction (facts), Contextualization (circumstances), Abstraction (principles), Translation (modern application), and Decision (action). Each phase needs specific questions and failure modes. For example, "different times" is a failure in Contextualization if it stops at historical differences without exploring underlying principles.

  The case studies will test the framework. For St. Francis, radical actions like embracing lepers might be context-bound, but the core principle of overcoming disgust for compassion could be translatable. For the flawed scientist, their abusive behavior is inexcusable, but their obsessive dedication might offer cautionary lessons on work-life balance. This should reveal that saints aren’t straightforward templates, and flawed figures can yield nuanced insights.

  Limitations are crucial. The method assumes that universal principles exist beneath cultural specifics, which might not always hold. It also relies on students' willingness to engage personally, which could be hindered by peer pressure or disinterest. Values conflicts (e.g., Francis's chastity vs. modern views) require the teacher’s judgment. The method can’t resolve deep ethical disagreements but can frame them constructively.

  Finally, I need to ensure the procedure is practical in 50 minutes. Prioritizing phases (skipping Abstraction if principles are unclear) and acknowledging dead ends (e.g., irreconcilable contexts) will keep it feasible. Emphasizing that some answers are "good enough" (actionable insights, not perfection) prevents over-analysis. The goal is reflection, not resolution.
answer: |-
  Here's a procedural engine for "Life Studies" built from Plutarch, hagiography, and the "mirror" metaphor, designed to force engagement beyond "inspiring/different times." It includes the reasoning, steps, failure modes, and limitations.

  **The Core Machinery & Reasoning:**

  1.  **Plutarch's Paired Lives:** Forces comparison to *isolate* virtues/vices and their consequences, moving beyond monolithic judgement.
  2.  **Hagiography's Imitative Structure:** Not just *what* the saint did, but *why* and *how* it manifested virtue in *their specific context*, aiming for transferable principles.
  3.  **The "Mirror" Function:** The primary question isn't "Was this person good/bad?" but **"What does this reflection reveal about *me* and my potential paths?"** The focus shifts to self-examination triggered by the life.
  4.  **The Gap is the Point:** Historical/cultural distance isn't a dismissal excuse; it's the friction needed to spark critical thinking about *which* elements are contingent and which might be perennial.

  **The Procedure: "The Life as Mirror" Framework (50-Minute Session Flow)**

  **Phase 1: Deconstruction - "What Actually Happened & Why?" (15 mins)**
  *   **Goal:** Establish objective facts and *contemporary* motivations/meanings. Avoid anachronistic judgement.
  *   **Questions:**
      *   "What specific actions or choices defined this person's life (especially the pivotal ones)?"
      *   "What were their *stated* reasons or goals for these actions? (Use their words/contemporary accounts if possible)."
      *   "What were the likely *underlying* drivers? (Ambition, fear, duty, love, faith, trauma, opportunity, etc.?)"
      *   "What was the *immediate consequence* of this action for them and those around them?"
      *   **Failure Mode:** "Different Times" Dodge. If this arises: "Okay, *how* were the times different? Specifically, how did that difference shape their *options* or *perception* of this action?" Don't let it end discussion; use it as data.
      *   **Good Enough Answer:** A clear list of specific actions with plausible motivations grounded in the text/historical context. Avoids sweeping moral labels.

  **Phase 2: Contextualization & Abstraction - "What Forces Shaped Them? What's the Core Principle?" (15 mins)**
  *   **Goal:** Identify pressures (cultural, economic, personal) *and* extract the underlying virtue/vice/principle being enacted *despite* context.
  *   **Questions:**
      *   "What constraints (social rules, lack of technology, poverty, war, family expectations) were they operating under? What freedoms did they have?"
      *   "What resources (wealth, education, social status, unique talent, community support) did they possess or lack?"
      *   "**Abstraction:** If we strip away the specific *form* of their action (e.g., giving away *all* wealth, fighting a duel), what is the core *human impulse*, *value*, *strength*, or *weakness* being expressed? (e.g., radical generosity vs. moderate charity; courage in facing death vs. courage in facing social ridicule; devotion to truth vs. ruthless ambition; profound empathy vs. enabling dependency; neglect of family for a cause vs. neglect for selfish pursuits)."
      *   **Failure Mode:**
          *   *Over-Abstraction:* "It's about being good!" Push for specificity: "Good *how*? In what *way* did this action manifest that?"
          *   *Moral Relativism Trap:* "It was just their culture!" Counter: "Yes, the *form* was cultural. But is the *underlying impulse* (e.g., seeking power, expressing devotion, protecting kin) *only* cultural, or is it recognizably human?"
      *   **Good Enough Answer:** A clear statement of the core principle/virtue/vice abstracted from the specific historical action (e.g., "extreme non-attachment to material security," "unyielding pursuit of intellectual truth," "sacrificial care for the marginalized," "prioritization of public achievement over private bonds"). Context is understood as the *arena*, not the *justification*.
      *   **STOP HERE IF:** You genuinely cannot identify *any* recognizable human impulse or principle underlying a major action (very rare). This life might be too alien or poorly documented for this exercise. Acknowledge it and move on.

  **Phase 3: Translation & the Mirror - "Where Does This Reflection Hit Home?" (15 mins)**
  *   **Goal:** Bridge the gap by finding analogous *forms* for the core principle in the students' lives. The mirror function activates.
  *   **Questions:**
      *   "The core principle we identified was [X]. What does [X] look like *today*, in *our* world, for *us*? What are its modern 'arenas'? (e.g., Radical non-attachment? -> Minimalism, rejecting consumerism, choosing a service career over a high-paying one. Sacrificial care? -> Volunteering intensely, prioritizing a friend in crisis, challenging bullying. Unyielding pursuit of truth? -> Academic integrity, calling out misinformation, dedication to mastering a difficult skill. Neglect for a cause? -> Grinding for exams/sports, starting a demanding project, activism consuming time)."
      *   "**The Mirror:** Look at *one* specific action of theirs that embodies [X]. Holding up this mirror: Is there an area in *your* life right now where the *principle* [X] is relevant? Not necessarily the *extreme form*, but the *core choice*? Where might you be facing a similar *kind* of challenge, temptation, or opportunity, even if smaller in scale?"
      *   "Does seeing this principle lived out (for good or ill) by them make you think differently about its *cost*, its *value*, or its *difficulty* in your own life?"
      *   **Failure Mode:**
          *   *False Equivalence:* "I gave my brother his toy back, like Francis giving up his wealth!" Gently challenge: "Is the *scale* and *sacrifice* similar? What would a *truly analogous* challenge to comfort/security look like for you?"
          *   *Dismissal by Scale:* "I could *never* do what they did!" Reframe: "Nobody expects you to found an order or cure a disease *this week*. Where is the *seed* of that principle? Where is the *tug* in a smaller way?"
      *   **Good Enough Answer:** Students identify *specific, plausible* modern analogues for the *principle* (not the dramatic action) and can articulate *one* concrete, relatable situation in their own lives (school, friends, family, hobbies, future choices) where that principle might apply. Personal reflection, not grand declarations.
      *   **STOP HERE IF:** After genuine effort, the principle feels utterly irrelevant or impossible to translate into *any* modern context the students can conceive of. It might be too niche. Or, it might reveal a genuine values clash – hand this over to Phase 4.

  **Phase 4: Discernment & Limits - "What Do We Make of This? Where Do We Draw the Line?" (5 mins)**
  *   **Goal:** Acknowledge unresolved tensions, value judgements, and the limits of the method. Teacher's role becomes explicit.
  *   **Questions:**
      *   "Where does this life leave you feeling unsettled or conflicted? What trade-offs did they make that we might judge differently?"
      *   "**Values Handoff:** Are we looking at a difference in *form* (which we can translate) or a fundamental clash in *values*? (e.g., Is the core principle itself something we reject? Does the cost violate a non-negotiable value for us?)"
      *   "Where does the 'mirror' feel uncomfortable or challenging in a way that's hard to resolve with this method?"
  *   **Teacher's Role Here:** This is where *you* step in explicitly.
      *   Acknowledge the conflict ("Yes, their view on [e.g., martyrdom, gender roles, authority] *does* clash fundamentally with modern values like [e.g., self-preservation, equality, individual rights]. That's a real tension.").
      *   Frame the question ("The method helped us see the principle [X], but now we must ask: Is [X], *especially in that extreme form*, ultimately good or wise by *our* lights? That's a values question we debate as a society.").
      *   Facilitate, don't preach: "What arguments might someone make *for* their value stance then? *Against* it now? Where do *you* stand on that underlying value conflict?" Guide, but don't force consensus.
  *   **Limitation Acknowledged:** The method can identify principles and trigger self-reflection, but **it cannot resolve fundamental ethical disagreements or dictate values.** Its job is to make the reflection and the conflict clearer.

  ---

  **Case Study 1: St. Francis of Assisi (The "Imitable" Saint)**

  1.  **Deconstruction:**
      *   Actions: Renounced wealthy inheritance, embraced poverty, kissed lepers, preached simplicity/joy, founded orders, received stigmata.
      *   Stated Reasons: Love of Christ, following Gospel literally, repentance, love for creation/outcasts.
      *   Underlying Drivers: Profound religious conversion, disgust with merchant-class materialism, desire for radical authenticity, charismatic leadership.
      *   Immediate Consequences: Father's anger, beggary, ridicule, then gathering followers, immense influence, physical suffering (stigmata), establishment of powerful orders.
  2.  **Contextualization & Abstraction:**
      *   Constraints: Rigid feudal/merchant society, limited social mobility, powerful Church, disease (leprosy).
      *   Resources: Wealthy family background (gave up), education, charisma, intense faith.
      *   **Core Principle:** **Radical, joyful renunciation of security/status for the sake of spiritual truth and identification with the marginalized.** (Abstraction: Non-attachment, Compassion enacted through proximity/sacrifice, Prioritizing spiritual values over material/social ones).
  3.  **Translation & Mirror:**
      *   Modern Analogue: Choosing minimalism/simple living over consumerism; prioritizing volunteering/service work over lucrative careers; actively befriending/helping socially ostracized peers (not just feeling sorry); finding joy in simplicity/nature; courage in living openly by deeply held beliefs even if mocked.
      *   The Mirror: "Where are *you* attached to security/status/image? (Social media? Brand names? Fear of looking foolish?). Where could you practice small acts of 'renunciation' or stepping outside comfort to connect with someone different/marginalized? Does 'joyful simplicity' resonate, or feel impossible amidst pressure? What's *one* small thing tied to security/image you might loosen your grip on?"
      *   **Why it's less "imitable" than it looks:** The *extreme form* (total poverty, kissing lepers) is context-bound and potentially reckless/impossible now. The *core principles* (non-attachment, radical compassion, prioritizing values) are translatable, but in vastly moderated, safer, modern forms. The mirror shows our attachments and lack of courage more than it provides a literal blueprint.
  4.  **Discernment & Limits:**
      *   Conflict: His self-neglect/asceticism bordering on masochism (stigmata as ideal). Rejection of family ties. Implicit endorsement of poverty rather than systemic change.
      *   **Values Handoff:** "The method shows his core drive. But *should* we idealize such extreme self-denial? Is poverty holy, or something to eradicate? Is rejecting family ever justified? These are value judgements we must grapple with." (Teacher facilitates discussion on these tensions).

  **Case Study 2: Brilliant Scientist/Reformer, Monster at Home (e.g., a fictional composite)**

  1.  **Deconstruction:**
      *   Actions: Made revolutionary discovery/instituted major reform. Worked obsessively. Publicly charismatic/inspiring. Privately: Neglected children, emotionally abused spouse, betrayed close collaborators, ruthless to rivals.
      *   Stated Reasons (Public): Pursuit of truth, progress, helping humanity.
      *   Stated/Implied Reasons (Private): Work is paramount, family is distraction/annoyance, collaborators/rivals are threats/tools, ego, inability to handle intimacy.
      *   Immediate Consequences: Great public achievement/acclaim. Devastated family, broken relationships, lonely death.
  2.  **Contextualization & Abstraction:**
      *   Constraints: Competitive field, pressure to achieve, maybe difficult upbringing (if known), societal norms enabling neglectful fathers.
      *   Resources: Exceptional intellect, drive, opportunity, public charisma.
      *   **Core Principles:**
          *   **Strength:** Relentless dedication to a cause larger than self (Truth/Progress). Courage to challenge orthodoxy. Exceptional focus/discipline.
          *   **Weakness:** Profound selfishness/egotism masked as dedication. Inability/unwillingness to nurture intimate bonds. Exploitation of others as means to an end. Lack of empathy.
  3.  **Translation & Mirror:**
      *   Modern Analogue (Strength): Dedication to mastering a skill (academic, artistic, athletic), pursuing a passion project, challenging unfairness even if unpopular. (Weakness): Using "I'm busy with X (sports, studies, art)" as an excuse to neglect friends/family/obligations; taking collaborators for granted; being hyper-competitive/cutting down peers; prioritizing personal ambition over team/relationship health.
      *   The Mirror: "Where are you deeply dedicated to something? Is that dedication balanced, or does it consume you/justify neglecting people? Have you ever used your 'cause' (studies, team, art) as an excuse for selfishness? Where might you be tempted to see people as tools for your goals? Does seeing the *cost* of their imbalance make you think about your own priorities?"
      *   **Why it's more usable than expected:** The core principles – both the admirable dedication *and* the toxic selfishness/neglect – are instantly recognizable in smaller, everyday forms for teenagers (academic pressure, sports commitment, friend groups, family dynamics). The mirror vividly reflects the *tension* between ambition and connection that they experience constantly. The "monster" aspect highlights the *danger* of unchecked dedication, making the lesson more cautionary and immediately applicable than the saint's seemingly impossible ideal.
  4.  **Discernment & Limits:**
      *   Conflict: Can the public good outweigh the private harm? Is genius an excuse? How do we judge trade-offs?
      *   **Values Handoff:** "The method isolates the principles: dedication is powerful, selfishness/neglect is destructive. But *can* the ends (great discovery/reform) *ever* justify those means (shattered lives)? How much imbalance is 'too much'? This is a profound ethical debate. The method shows the *principles at work and their consequences*, but *we* must decide where the lines are." (Teacher facilitates discussion on balancing achievement and humanity).

  **What This Machinery CANNOT Do (Straight Talk):**

  1.  **Provide Objective Moral Answers:** Plutarch and hagiographers *did* operate within shared, robust frameworks of virtue (Roman *virtus*, Christian holiness). They illustrated agreed-upon ideals. **Your seminar lacks this.** You're not illustrating a pre-defined "good life"; you're *exploring* what a good life might be using lives as provocations. The method surfaces principles and conflicts but cannot resolve them absolutely. That's the messy work of discussion, philosophy (even without a department!), and personal reflection you facilitate.
  2.  **Guarantee Inspiration or Imitation:** That's not the goal. The goal is *insight* and *self-reflection*. A life might reveal a path you actively *reject*, which is a valuable outcome ("This mirror shows what I *don't* want").
  3.  **Neatly Resolve Contradictions:** Some lives are genuinely paradoxical. The method will highlight the paradox (e.g., immense courage/public good vs. profound cruelty/private harm). It can't dissolve it. The tension *is* the lesson.
  4.  **Work Without Student Buy-In:** If students refuse to look in the mirror or engage in good faith abstraction/translation, it fails. The teacher's skill in questioning and creating a safe space for uncomfortable reflection is paramount.
  5.  **Fully Capture Individual Complexity:** It focuses on identifiable principles and pivotal choices. Nuance, internal struggle, and ambiguity can get simplified. Acknowledge this limitation ("We're focusing on X aspect, knowing there's more...").
  6.  **Override Deep Cultural Relativism:** If students fundamentally believe *all* values are *only* products of their time with no trans-historical elements, the abstraction phase collapses. You must argue for recognizable human drives (love, fear, ambition, loyalty, curiosity) as the bridge.

  **Conclusion:** This procedure forces movement beyond passive admiration or dismissal. It uses historical/cultural distance as analytical leverage. It makes the "mirror" explicit and practical. It acknowledges that saints are rarely simple blueprints and flawed figures often hold sharper reflections. Crucially, it hands the ultimate value judgements *back* to you and the students for discussion, making clear that the method is a tool for *seeing* more clearly, not a machine for generating easy answers. You *are* doing something different from Plutarch/hagiographers – you're using their tools for exploration, not illustration, in a context without shared ultimate values. That's harder, but potentially richer. Good luck!
