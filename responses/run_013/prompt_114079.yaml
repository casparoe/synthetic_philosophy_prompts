prompt: |-
  I sit on the acquisitions committee of a mid-sized regional art museum — I'm the outside member, the one who isn't in the art world; I cover science and philosophy for a living, so the director figured I'd be useful when the arguments get abstract. Problem is that roughly once a quarter we hit a case where the committee can't even agree on whether the thing in front of us is art, and the arguement eats the whole ninety minutes we set aside for everything else. Two meetings ago it was a birchbark canoe from the 1870s, beautifully made, that a dealer wants to sell us. Last month it was a set of images a local graphic designer made with an AI generator and entered in our open call. Before that it was a piece of driftwood a curator picked up on a beach and put on a plinth; she says it's a sculpture now, the trustee who used to run a bank says it's a log, and a canoe is a boat, and round and round. Meanwhile the whole time we're also quietly voting on whether the thing is any good and whether we can afford to keep it forever, since we almost never deaccession, and those three questions keep getting collapsed into one vague show of hands. So what I want is a procedure we can actually run in the room, with the director signing off afterward but in practice never overruling us: an ordered list of questions, what counts as a sufficient answer to each, where the procedure can stop with a clean no, and where it has to stop and hand the thing to a person because what's left is values rather than facts. It has to be runnable by a curator, a local painter, a donor's widow and me, none of us with any training in this, in under ten minutes per object.

  I know the standard moves roughly — the family-resemblance line that there's no definition to be had at all, the institutional line where the artworld just confers the status by fiat, the historical line where what matters is whether the maker was working in the wake of earlier art and expected to be looked at that way. What I don't have is any of that converted into something a bank president can apply, and I'm not sure the historical version survives contact with an anonymous 19th century canoe maker who may not have had our concept at all, or with a machine that has no intentions to be in the wake of anything. A friend who teaches aesthetics keeps insisting the whole question is malformed and we should stop asking whether a thing is art and ask instead what kind of attention it's answerable to and who's entitled to be the judge of that; tell me whether that's a genuine solution or just a dodge, and build the procedure so it stands up either way, including for the first object of its kind where there's no precedent to lean on.

  Then run it in full on all three — the canoe, the AI images, the driftwood — and be blunt about which one it handles worst, and which answer the committee (me included) is going to hate. Skip the citations and the reading list, I can't chase them down and they won't help the five of us on a Thursday night; what I need is the thing in plain words, and honesty about the steps that are just judgment calls dressed up as tests.
reasoning: |-
  Okay, let me tackle this museum acquisitions committee problem. The user needs a practical, step-by-step procedure to evaluate whether something is art that can be applied quickly during meetings. 

  First, I need to understand their core frustrations: arguments about definitions eating up time, collapsing three distinct questions (is it art? is it good? can we afford it?) into one messy vote, and dealing with edge cases like historical objects, AI creations, and found objects. The committee members aren't aesthetics experts - they're practical people who need clear stopping points.

  Hmm... the key insight from their aesthetics friend might actually work here. Instead of getting stuck on definitions, shifting to "what kind of attention does this demand?" could bypass philosophical traps. But it needs to be operationalized for a banker and a donor's widow. 

  I'll design a funnel procedure with clear exit ramps:
  - Start with basic filters: physical stability and safety (no rotting driftwood), then creator awareness (the canoe maker likely knew it was functional, but does that matter?). 
  - Then the crucial pivot: "What attention does it ask for?" - this replaces the "is it art?" debate. The AI images clearly demand visual contemplation, the driftwood on a plinth screams "look at my form", but the canoe... that's tricky. It wants to be used on water.
  - Finally, separate the other two questions entirely: quality assessment (is it exceptional?) and practical concerns (cost, storage). 

  Testing on their three cases:
  The driftwood passes easiest - it's literally on display asking for aesthetic attention. The AI images are harder because of authorship questions, but the attention test still works. The canoe fails hardest - it demands functional attention, though the historical argument might save it if they value craft. 

  Biggest landmine: the procedure might reject culturally significant objects like the canoe that don't fit Western art frameworks. And the trustee will hate that "functional" isn't automatically disqualifying - good driftwood could enter the collection while his antique canoe might not. 

  Should emphasize that steps 2-4 are judgments, not facts. The beauty is that when they hit "voting required" on the attention question, at least they're arguing productively about function vs aesthetic intent rather than definitions. And it forces separating the "is it good?" question until after the art question is settled (or bypassed).
answer: |-
  Here's a procedural checklist designed for speed, clarity, and forced separation of questions. It assumes **"art" is a functional category** (i.e., *what it asks of the viewer* matters more than essentialist definitions). The goal is to **bypass unproductive definitional debates** and **clearly separate** the *Is it art?*, *Is it good?*, and *Can we keep it?* questions. Each step must be answered YES or NO. A single NO ends the "art" inquiry with a clear outcome. "Vote Required" forces a quick committee vote.

  ---

  ### The Acquisition Funnel: A 6-Step Procedure (≤10 min/object)

  1.  **PHYSICAL STABILITY & SAFETY:** "Is this object stable enough to be handled/stored/displayed *without* exceptional conservation burdens or hazards **for the foreseeable future**?"  
      *   *NO:* **Stop. Not acquirable.** (e.g., rotting log, unstable chemicals).  
      *   *YES:* Proceed to Step 2.  
      *   *Sufficient Answer:* Conservation Dept. assessment or curator's reasonable judgment. *Judgment Call?* Minimal (practical).

  2.  **CREATOR AWARENESS (or Equivalent):** "Was this object made, selected, or arranged **with awareness that it might be presented for sustained human attention?** (i.e., not purely for undisputed utility, data, or ephemeral use)."  
      *   *NO:* **Stop. Not Art** (by our functional criteria). *E.g., factory-made screw; unmodified utility object actively used for its purpose.*  
      *   *YES / UNKNOWN:* Proceed to Step 3.  
      *   *Sufficient Answer:* Provenance, maker statement (if any), object form/context. *Judgment Call?* Moderate (interpretive). *"Awareness" is broad – the canoe maker knew it was beautiful craft; the graphic designer submitted to an art call; the curator selected the driftwood for display.*

  3.  **PRIMARY DEMAND FOR ATTENTION:** "**What kind of primary attention does this object demand?** (A) Utilitarian/Informational (e.g., use it, read it for data), (B) Aesthetic/Contemplative (e.g., look at its form, feel, idea, provoke emotion/thought), or (C) Ambiguous/Unclear?"  
      *   *(A) Utilitarian/Informational:* **Stop. Not Art** (by our functional criteria). *E.g., instruction manual, functional oar.*  
      *   *(B) Aesthetic/Contemplative:* Proceed to Step 4 (It **is Art** for our purposes).  
      *   *(C) Ambiguous/Unclear:* **Vote Required** by committee: "Does this object primarily demand aesthetic/contemplative attention?" Simple Majority. YES → Proceed to Step 4 (Art). NO → **Stop. Not Art**.  
      *   *Sufficient Answer:* Committee discussion focused *only* on the object's perceived demand. *Judgment Call?* High – **This is the core values pivot point.** Forces focus on *how* the object asks to be engaged.

  4.  **QUALITY ASSESSMENT (Post-"Art" Decision):** "**Does this object demonstrate exceptional quality, significance, or insight within the context it demands attention?**" (e.g., exceptional craft, compelling aesthetic, powerful idea, historical importance, unique voice).  
      *   *NO:* **Stop. Acquire? NO** (It's art, but not good enough for *our collection*).  
      *   *YES / DEBATABLE:* Proceed to Step 5.  
      *   *Sufficient Answer:* Committee expertise & debate. Cite specific qualities (craft, concept, innovation, emotional power, contextual relevance). *Judgment Call?* Highest – Pure curatorial/committee judgment on merit.

  5.  **COLLECTION FIT & GAPS:** "**Does this object fulfill a specific, documented strategic goal for our collection?** (e.g., fills gap in regional craft, represents new media, strengthens existing holding, meets diversity initiative)?"  
      *   *NO:* **Stop. Acquire? NO** (May be good art, but not for *us*).  
      *   *YES:* Proceed to Step 6.  
      *   *Sufficient Answer:* Reference collection plan, curator's rationale linking object to plan. *Judgment Call?* Moderate (Strategic alignment).

  6.  **PRACTICAL VIABILITY:** "**Can we acquire, conserve, store, and (plausibly) display this object responsibly within our foreseeable budget and capacity?**"  
      *   *NO:* **Stop. Acquire? NO**  
      *   *YES:* **Acquire? YES** (Pending final vote on acquisition, separate from this procedure).  
      *   *Sufficient Answer:* Registrar/Finance/Conservation input (ideally pre-meeting), director's assessment. *Judgment Call?* Minimal (Practical/financial).

  ---

  ### Running the Cases (Bluntly)

  1.  **The 1870s Birchbark Canoe:**
      *   **Step 1 (Stability):** YES (Assumed stable).
      *   **Step 2 (Creator Awareness):** YES/UNKNOWN (Maker knew it was crafted beautifully, even if primarily utilitarian).
      *   **Step 3 (Primary Demand):** **Vote Required.** *The Landmine.* The bank president sees (A) Utility (it's a boat!). You/curator see (B) Aesthetic craft/history. **Committee Vote Likely YES (Art).** (This step forces the *real* debate onto function vs. aesthetics clearly).
      *   **Step 4 (Quality):** YES (Exceptional craft, historical significance).
      *   **Step 5 (Collection Fit):** YES (If regional/craft/history fits plan).
      *   **Step 6 (Practical):** ? (Cost, size, conservation needs?).
      *   **Verdict:** Procedure forces the core debate early (Step 3). Likely passes to acquisition vote *if* it wins the Step 3 vote. **Committee Hate:** Bank president hates Step 3 vote overriding his "it's just a boat" stance. Others hate that Step 3 is vulnerable to majority bias against functional beauty.

  2.  **AI-Generated Images (Local Graphic Designer, Open Call):**
      *   **Step 1:** YES.
      *   **Step 2:** YES (Designer *explicitly* submitted for art call).
      *   **Step 3 (Primary Demand):** **B (Aesthetic/Contemplative).** Clearly demands visual/idea-based attention. **Art.**
      *   **Step 4 (Quality):** **Vote Required.** *The Crux.* Is it exceptional? Does the AI process yield significant insight/novelty/beauty? Is the *designer's* role (prompting, selecting) sufficiently "authorial"? This is pure judgment on merit and authorship. Committee likely divided.
      *   **Step 5:** ? Depends on strategy (new media? local artist?).
      *   **Step 6:** ? (Cost likely low, tech preservation?).
      *   **Verdict:** Procedure cleanly resolves "Is it art?" (Step 3 YES). **Handles Well.** Debate correctly pushed to **Step 4 (Quality/Merit/Authorship)** where it belongs. **Committee Hate:** Traditionalists hate that "art" status was granted so easily to AI. Process-haters hate that Step 4 judgment feels subjective (it is).

  3.  **Driftwood on a Plinth (Curator's Find):**
      *   **Step 1:** YES? (Depends on wood condition).
      *   **Step 2:** YES (Curator *explicitly* selected/arranged it for display/attention).
      *   **Step 3 (Primary Demand):** **B (Aesthetic/Contemplative).** The plinth and selection scream "look at my form/natural artistry!" **Art.**
      *   **Step 4 (Quality):** **Vote Required.** *The Judgment Call.* Is this driftwood *exceptionally* beautiful, evocative, or conceptually interesting *as presented*? Is the curator's act of selection/display enough to confer "exceptional quality"? Highly subjective.
      *   **Step 5:** ? (Does "found object" fit strategy? Uniqueness?)
      *   **Step 6:** YES (Low cost, easy storage).
      *   **Verdict:** Procedure **Handles Best.** Steps 1-3 are clear YES. Debate focuses correctly on **Step 4 (Is it *good enough* art?)**. **Committee Hate:** Bank president *hates* that a "log" is declared art (Step 3). He *really* hates that its "quality" (Step 4) might be voted YES. Curator might hate if Step 4 votes NO after Step 3 said "art".

  ---

  ### Which Handles Worst? The Canoe.
  *   **Why:** Step 3 ("Primary Demand") is brutally hard for objects deeply embedded in utility, even beautiful utility. The vote here feels like arbitrating between worldviews (Functional vs. Aesthetic). It exposes the procedure's core value judgment most starkly. The AI and Driftwood have clearer contemporary "art context" demands.

  ### The Answer You'll Hate
  *   **Step 3 ("Primary Demand") Vote:** You'll hate that this step, while crucial for bypassing definitional hell, *is* the moment where the committee imposes its collective bias. A beautiful, historically significant canoe could be voted "Not Art" (Demand=A) by a functionalist majority. The procedure forces this vote *early*, but it doesn't make it "right" – it just makes the values clash explicit and decisive, preventing 90-minute circular arguments. You have to accept that under this model, "art" status *is* conferred by the institution (your committee) based on perceived demand, not inherent essence.

  ### Why This Works
  1.  **Bypasses Definitions:** Ditches "What is Art?" for "What does it *do*?" (Demand).
  2.  **Separates Questions:** "Art?" (Steps 1-3), "Good?" (Step 4), "Fit?" (Step 5), "Possible?" (Step 6).
  3.  **Clear Stopping Points:** NO at any Step 1-3 = Not Art/Not Acquiriable. NO at Step 4-6 = Art, but not for us.
  4.  **Forces Values Debate Upfront:** The hard talk happens at Step 3 (Demand) and Step 4 (Quality), *after* stability and intent are cleared.
  5.  **Handles Novelty:** AI & Driftwood sail through "Art?" (Steps 1-3) because their *presented demand* is clear. Debate goes to quality/fit.
  6.  **Practical:** Focused questions, quick votes, leverages pre-meeting prep (condition, cost, collection plan).

  **The Catch:** It makes your committee's subjective judgments explicit and decisive, especially at Steps 3 and 4. It codifies that "art" for your museum is defined by *perceived demand for aesthetic attention* and *your committee's judgment on quality and fit*. The philosophy is baked into the steps: **functional proceduralism over metaphysical truth.** Run it strictly, and it will save you hours, even if the answers sometimes sting.
