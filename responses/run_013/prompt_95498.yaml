prompt: |-
  So my friend and I got into a two-hour fight last night over the experience machine -- you know, the plug-in-and-live-in-a-tank thing where every experience is as good as it can possibly be. He said he'd plug in in a heartbeat, obviously, more good feeling is more good feeling. I said no way, and then we both got mad because neither of us could actually say what we were disagreeing about. That's the real problem: we were arguing about one case, and we don't even have a checklist for what a theory of well-being is supposed to do.

  So forget defending one theory. Write me the desiderata instead -- the spec that any adequate theory of well-being (hedonist, desire-based, objective-list, whatever) has to meet. I want the requirements list, and behind each one the case or consideration that puts it there. And tell me which requirements are non-negotiable and which are just loyalties of one camp dressed up as requirements.

  Here's the stuff I want it to have to handle, some of which I made up while we were yelling:

  - The plain machine case, but also the "partial" version: a machine that gives you, say, 80% of the bliss, but lets you leave whenever you want and you always know it's fake. Does the intuition change? A theory better have a view.
  - The retroactive one: a machine that leaves your future alone but rewrites your memory so your actual, kind of crummy life now seems to have been wonderful. Did your life get better? Because alot of people say yes for the tank but I bet they say no here, and that looks like a contradiction.
  - Two lives with the same total of good moments, but one climbs and one declines. Does the theory have to call the climbing one better? I think most people do, and I don't think most theories can say why.
  - The contented person who never wanted much and got it, versus someone who wanted the world and got a little. Which is the theory supposed to say is better off, and is "what they wanted" even trustworthy when they might only want it because of how they were raised? (My friend kept waving this one away and it drove me nuts.)

  And I want the distinctions it can't be allowed to collapse -- being well off vs. being a good person, momentary vs. whole-life, what's good for you vs. what you want vs. what you think is good for you. Plus any result from psychology it can't just contradict, like the fact that people are terrible at predicting what will make them happy and that they tend to snap back to baseline.

  The part I actually want: which requirements can't all hold at once. I have a suspicion that "well-being is up to you / it's about how things seem from the inside" and "a fooled life is worse" can't both be non-negotiable, but you tell me. And which single requirement does the most damage -- knocks out the most popular theories by itself?

  Keep the weight on the criteria and why each one is on the list, not on scoring every theory. Don't give me a reading list or citations, I don't have internet and can't look anything up. Write it in American English.
reasoning: |-
  Okay, the user is frustrated after a two-hour argument with their friend about the experience machine thought experiment. They couldn't even pinpoint what they were disagreeing on, which tells me they need a clear framework to evaluate theories of well-being rather than defending any specific one. 

  The core request is for desiderata - the essential criteria any theory of well-being must satisfy. They listed concrete cases they want the framework to handle: variations of the experience machine, retroactive memory alteration, life trajectory patterns, and satisfaction vs. desire fulfillment. They also want distinctions protected (well-being vs. morality, momentary vs. lifelong) and psychological realities accounted for.

  Hmm, their suspicion about internalism ("well-being is up to you") conflicting with the "fooled life is worse" intuition is sharp. That tension might indeed be fundamental. I should flag that as a key trade-off. 

  The user sounds intellectually engaged but exhausted by ungrounded debate. Their examples show they've thought deeply about counterarguments (e.g., the retroactive machine exposing inconsistencies). The "no internet" note suggests they want self-contained, actionable analysis - no academic jargon or citations.

  Key angles to cover:
  - Must-haves vs. negotiables: Some criteria (like handling the basic experience machine) are litmus tests, while others (like valuing climbing lives) reflect specific philosophical leanings.
  - Psychological realism: Can't ignore human biases in desire formation or hedonic adaptation.
  - Boundary enforcement: Crucially separate well-being from moral worth or epistemic success.
  - Trade-offs: Explicitly call out where criteria conflict (e.g., internalism vs. anti-fooling).

  The "which single requirement does most damage" question is fun. Anti-fooling probably eliminates hedonism, while internalism sinks objective list theories. I'll present it as a knockout punch analysis without pushing my own view.

  Structure will be:
  1. Non-negotiables (universal basics)
  2. Common-but-debatable criteria (where theories diverge)
  3. Boundaries to maintain (what well-being isn't)
  4. Psychological constraints (must fit human data)
  5. Conflicts and trade-offs (where desiderata clash)

  Tone should be crisp and conversational - they've had enough abstraction. Examples from their argument will ground each criterion. That retroactive machine case is particularly potent for exposing contradictions; I'll use it to illustrate multiple requirements.
answer: |-
  Here’s your desiderata checklist for any theory of well-being – the core requirements, why they matter, and where conflicts arise. I’ve grouped them by function, flagged non-negotiables, and highlighted trade-offs based on your cases.

  ### **I. Non-Negotiable Core Requirements (Litmus Tests)**
  These are the bare minimum. Fail one, and the theory is inadequate.

  1.  **Handle the Basic Experience Machine (Anti-Fooling Constraint):**
      *   **Why:** Must explain why plugging into the "perfect bliss" tank *isn't* the best life, even if it feels perfect inside. If it says plugging in *is* best, it fails the core challenge.
      *   **Case:** The plain machine. Most people intuit a fooled life isn't truly best.
      *   **Non-Negotiable:** Yes. This is the core test separating plausible theories from pure "feel-good-ism."

  2.  **Distinguish Well-Being from Other Concepts (Boundary Maintenance):**
      *   **Why:** Must clearly separate:
          *   *Well-Being (what's good* ***for*** *you)* vs. *Moral Goodness (being a good person)*. (e.g., A saint suffering vs. a happy villain).
          *   *Momentary Feeling* vs. *Whole-Life Assessment*. (A great moment vs. a tragic life).
          *   *What's Good For You* vs. *What You Want* vs. *What You* ***Think*** *is Good For You*. (e.g., Wanting junk food vs. needing nutrition; thinking fame will make you happy vs. it actually making you miserable).
      *   **Case:** Your "contented vs. ambitious" case hinges on separating *getting what you want* from *what's actually good for you*. Psychology shows wants can be misguided.
      *   **Non-Negotiable:** Yes. Collapsing these leads to immediate contradictions.

  3.  **Acknowledge Psychological Realities (Empirical Constraint):**
      *   **Why:** Can't blatantly contradict robust psychological findings:
          *   Hedonic Adaptation/Set Point: People tend to return to a baseline happiness level after major life events.
          *   Affective Forecasting Errors: People are systematically bad at predicting what will make them happy/sad in the future.
          *   Influence of Upbringing/Culture: Desires and values are heavily shaped by environment, not pure "rational choice."
      *   **Case:** The "contented person vs. ambitious person" case – desires aren't necessarily trustworthy guides. The "partial machine" might exploit adaptation/forecasting errors.
      *   **Non-Negotiable:** Yes. A theory ignoring human psychology is just fantasy.

  ### **II. Important But Debatable Requirements (Where Theories Diverge)**
  These are often points of contention *between* theories. Calling them "requirements" might be favoring one camp.

  4.  **Handle Authenticity & Agency (The "Partial Machine" Test):**
      *   **Why:** Does knowing it's fake (partial machine) or being able to leave change the value? Does agency/authenticity matter *intrinsically* for well-being?
      *   **Case:** The "80% bliss, know it's fake, can leave" machine. Is this better/worse/same as the full tank? Intuitions vary. Hedonism might say worse (less bliss), Desire theories might say better (you *choose* it), Objective List might say better (authenticity is good).
      *   **Debatable Requirement?** Yes. Hedonism might reject agency as intrinsically valuable; others insist it's essential. Its status as a *requirement* depends on the weight given to anti-fooling/internal states vs. agency/truth.

  5.  **Account for Narrative/Shape of Life (The Climb vs. Decline Test):**
      *   **Why:** Two lives with identical total "good moments," but one improves over time (climbs), the other worsens (declines). Many intuit the climbing life is better. Does the theory capture this?
      *   **Case:** Your "climbs vs. declines" case. Does the *pattern* matter beyond the sum of parts?
      *   **Debatable Requirement?** Yes. Strict Hedonism or simple Desire Satisfaction summing moments probably can't explain this. Narrative/Perfectionist theories build it in. Is the intuition universal enough to be mandatory? Or is it a preference?

  6.  **Address the "Retroactive Machine" Problem (Truth Constraint vs. Experiential Constraint):**
      *   **Why:** Rewriting your *past* memories to make a crummy life *seem* wonderful. Did your well-being *actually* increase? Compare to the tank: If the tank is bad because it's fake, is this also bad? But your *current experience* is now positive.
      *   **Case:** The retroactive memory rewrite. Forces a choice: Does well-being depend only on *current/past experience* (even if false) or on *how things actually were/are*?
      *   **Debatable Requirement?** **Crucially Debatable.** This exposes the core tension:
          *   If you say **YES** (well-being increased), you prioritize *internal experience* over truth/reality. This aligns with Hedonism but weakens the anti-fooling argument against the basic tank (why is fake *future* bad but fake *past* good?).
          *   If you say **NO** (well-being didn't increase), you prioritize *truth/reality/authenticity* over internal state. This strengthens anti-fooling but requires explaining why positive *experience* (even of a fake past) isn't sufficient for well-being *at that moment*.
      *   **Your Suspicion is Correct:** This is where "well-being is up to you/internal" (Prioritizing Experience) clashes directly with "a fooled life is worse" (Prioritizing Truth/Reality). Most theories can't easily hold *both* non-negotiably without tension.

  7.  **Handle Desire Formation & Objectivity (The "Contented vs. Ambitious" Test):**
      *   **Why:** Is well-being solely about satisfying *actual* desires (even if poorly formed)? Or are some desires/objects inherently better/worse for you, regardless of what you want? Can the theory critique desires shaped by deprivation or manipulation?
      *   **Case:** Contented person with simple achieved desires vs. ambitious person with grand, mostly unmet desires. Who is better off? If desire satisfaction is all that matters, the contented person wins. But is that fair if their desires were stunted? Should the ambitious person get "credit" for noble desires, even unmet?
      *   **Debatable Requirement?** Yes. Pure Desire Theory says only satisfaction matters. Objective List says certain things are good/bad regardless of desire. Informed Desire theories try to bridge the gap ("what you'd want if you knew the facts"). Calling for desire critique leans towards Objective List/Perfectionism.

  ### **III. The Knockout Punch & Key Trade-Offs**

  *   **The Single Most Damaging Requirement:** **The Anti-Fooling Constraint (Requirement #1)**. It immediately eliminates **Classical Hedonism** (if pleasure is the sole good, the tank *is* best) and potentially cripples simple forms of **Desire Satisfactionism** (if you desire real experiences/freedom, the tank might fail; but if you just desire pleasure, it might pass). It's the hurdle that forces theories to add complexity (e.g., Informed Desires, Objective Lists) or accept counter-intuitive results.
  *   **The Core Conflict You Identified:** The fundamental tension lies between the **Internalist Pull** (Well-being must be fundamentally tied to the subject's conscious experience/perspective - how life feels/seems *to them*) and the **Anti-Fooling Intuition** (Well-being requires some connection to reality/truth/authenticity beyond just how things seem).
      *   Theories prioritizing **Internalism** (Hedonism, some Desire theories) struggle mightily with the Basic Tank (#1) and the Retroactive Machine (#6). They risk making well-being too subjective/solipsistic.
      *   Theories prioritizing **Truth/Reality** (Objective List, some Informed Desire theories) handle the tank and retroactive machine better but struggle to explain why positive internal states *aren't* sufficient (#6) and might downplay the importance of the subject's own experience/perspective for *their* well-being. They risk making well-being too objective/detached from the individual.
  *   **Where Requirements Can't All Hold:** You can't have *all* of these simultaneously without strain:
      *   Well-being is *solely* determined by internal states/experience. (Pure Internalism)
      *   A life based entirely on positive false beliefs/experiences is *not* high in well-being. (Anti-Fooling)
      *   Altering your memories to make your past *seem* wonderful *does* increase your well-being. (Retroactive Machine Intuition - if held)
      Holding (1) and (2) forces you to reject (3). Holding (1) and (3) forces you to reject (2). Holding (2) and (3) is inconsistent unless you *reject* (1) and argue well-being requires truth. Most plausible theories reject pure (1).

  **In short:** Your fight exposed the messy core of well-being theory. Any viable theory *must* explain why the perfect tank isn't ideal (#1), keep well-being distinct from morality/epistemic success (#2), and fit how humans actually work (#3). The real battleground is between the pull of internal experience and the demand for truth/reality, sharply exposed by the retroactive machine (#6). The Anti-Fooling Constraint (#1) is the gatekeeper that keeps Hedonism out of the serious contender category. Theories are ultimately defined by how they navigate that core tension.
