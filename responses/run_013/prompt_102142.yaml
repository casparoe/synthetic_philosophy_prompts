prompt: |-
  I'm running a two-hour session for a reading group next month -- mostly PhD students in cog sci and machine learning, all fine with probability, none of them has taken a computability course -- and the topic is the claim that 'simpler explanations are better' can be stated as a theorem rather than a slogan. So the arc I want to cover is: Turing machines and programs, then the length of the shortest program that prints a given string, then the universal prior and the mixture argument for why it predicts well, then the sting at the end that none of it is computable. I know the material, so don't explain it to me -- plan the explanation. What order do the pieces have to go in, and why does each depend on the last? My instinct is that the uncomputability has to arrive only after they already believe the prior is the right formalization of inductive inference, otherwise it lands as a cute footnote rather than as a real problem, but tell me if that's wrong and where the pivot actually is. Also, what should the carrying example be? Everyone reaches for the two coin-flip strings, one alternating and one looking random, and I find it sterile, and I also suspect it quietly teaches the wrong thing about what the quantity is measuring -- so either keep it and tell me exactly what it can and can't be made to carry, or replace it and tell me what your example has that the strings lack. And which idea in the sequence has to be nailed down before the example can do any work at all?

  Then the misconceptions, in the order they'll actually form rather than the order I'd like to correct them in. My predictions: 'this is just what gzip measures', 'simple means short in English words', 'the dependence on which machine you pick is a bug that a cleverer definition would fix', 'uncomputable just means nobody's found the algorithm yet', and 'if no computable method beats it then it's all arbitrary anyway', plus whatever I'm missing -- and for each one, where in the sequence it gets planted, which part of the sequence does the planting, and the exact moment I should head it off. I'd also like the closing check: one question I can put to them at the end that would show whether the Occam-as-theorem point actually landed, as opposed to them just politely nodding along at a proof that some weights have to sum to one. And tell me what I should openly refuse to cover at this level and say that I'm refusing, so nobody leaves thinking they've got the whole picture -- I've been putting this off for a while because last time I tried it, people recieved the uncomputability bit as an interesting dead end and went back to talking about regularisation.
reasoning: |-
  We are planning a two-hour session for PhD students in cognitive science and machine learning. The goal is to present the idea that "simpler explanations are better" can be stated as a theorem (Solomonoff induction) and to highlight the uncomputability as a fundamental limitation.

  The arc:
  1. Turing machines and programs.
  2. Kolmogorov complexity (shortest program that prints a given string).
  3. Universal prior and the mixture argument (Solomonoff prior).
  4. Uncomputability.

  Key pedagogical points:
  - The uncomputability should come after they are convinced that the prior is the right formalization, so that it lands as a problem, not a footnote.
  - The example: avoid the overused coin-flip strings (alternating vs random) because it might be misleading. We need an example that illustrates the essence without being sterile and that doesn't misrepresent what Kolmogorov complexity measures.

  The misconceptions to address:
  1. 'this is just what gzip measures'
  2. 'simple means short in English words'
  3. 'the dependence on which machine you pick is a bug that a cleverer definition would fix'
  4. 'uncomputable just means nobody's found the algorithm yet'
  5. 'if no computable method beats it then it's all arbitrary anyway'

  Plus, we need a closing question to check understanding and to explicitly state what we are not covering.

  Plan:

  Total: 2 hours = 120 minutes.

  Breakdown:

  I. Introduction (5 mins)
     - State the claim: "simpler explanations are better" can be a theorem.
     - Overview: We'll formalize "simple", "explanation", and "better" (in terms of prediction).

  II. Turing Machines and Programs (15 mins)
     - Explain Turing machines as a model of computation (briefly: tape, head, state, transition table).
     - Programs: a string (of bits) that the machine reads and executes.
     - Emphasize: any programming language can be encoded (Church-Turing thesis).

  III. Kolmogorov Complexity (25 mins)
     - Define: for a string x, K(x) is the length of the shortest program for a fixed universal Turing machine that outputs x and halts.
     - Why universal? Because it can simulate any other Turing machine with a fixed overhead (invariance theorem).
     - Example: We need a better example than the coin-flip strings.

     Proposed example: 
     - Instead of coin-flips, use a string that has a simple pattern but is not trivial. For instance, the first 100 digits of pi (which can be generated by a short program) vs a string of the same length that is truly random (which requires a long program that essentially lists the digits).
     - However, we don't have a truly random string to show? Instead, we can contrast:
          Example 1: "010101...01" (alternating) -> short program.
          Example 2: a string that is the binary expansion of a number that is "random" (like the Champernowne constant? but that is actually complex? Actually, the Champernowne constant is computable but not by a very short program? Maybe not. Alternatively, use a string that is the output of a known complex process?).

     Alternative example: 
     - Use a string that represents a sequence of observations from a simple law (e.g., "every even position is 0") and one that is arbitrary. But the same issue.

     Actually, we can use:
          String A: "0" * 1000  (a thousand zeros) -> program: print "0" 1000 times -> very short.
          String B: a specific 1000-bit string that we don't know a short program for. We can say: "Imagine a string that was generated by flipping a coin 1000 times. We don't know a short program for it, and in fact, with high probability, it has no program much shorter than 1000 bits (plus a small constant)."

     But note: the coin-flip example is standard because it illustrates the typical case. The problem is that it might make students think that Kolmogorov complexity is about randomness. We must clarify:

          - Kolmogorov complexity measures the amount of information (in bits) to specify the string. 
          - For a string with a pattern, we can use that pattern to compress it.

     To avoid the randomness conflation, use an example of two strings that are both structured but one is simpler:

          String 1: "011011011011..." (period 3: 011 repeated) -> program: short.
          String 2: "0110101000001..." (the beginning of the binary expansion of sqrt(2) but actually we can compute that by a program, so it's still short?).

     Instead, how about:

          String 1: the binary string representing the first 1000 natural numbers in order (each number represented in, say, 10 bits). This has a short program: loop from 0 to 999, output the binary representation.

          String 2: the same set of numbers but shuffled randomly. Now, to output this, you need to store the permutation, which would be about 1000*10 bits? (Actually, the permutation of 1000 items requires about log2(1000!) bits, which is about 10*1000 - O(1000) bits? Actually, about 8500 bits). So the program for String 2 would be longer.

     But note: the Kolmogorov complexity of the shuffled string is still not huge because you can say: "output the numbers 0 to 999 in the order given by permutation P", and then describe P. However, the description of P is long. Alternatively, if the shuffle is arbitrary and without pattern, then indeed the shortest program is essentially the list.

     This example might be more concrete. We can say:

          - String 1: the numbers from 0 to 999 in increasing order. 
          - String 2: the same numbers in a fixed permuted order (which we show a small part of and then say "etc."). 

     The program for String 1: a loop that counts from 0 to 999 and outputs the binary representation of each number (fixed length). The program for String 2: we have to specify the entire permutation? That is 1000 numbers, each of 10 bits? So 10,000 bits? Actually, we can do better by having a program that generates the permutation via a pseudorandom generator with a seed? But if the permutation is arbitrary, then we cannot compress the description of the permutation.

     The key point: for an arbitrary permutation, the Kolmogorov complexity is high. But note: if we fix the permutation, then we can write a program that says "output the numbers in the order: 3, 1, 4, ..." and then list the 1000 numbers. That program would be about 1000*10 = 10,000 bits plus a small overhead. Whereas the ordered one is about log(1000) bits? (the constant for the loop). 

     Actually, we can make the example with two strings of the same length:

          String A: "0" repeated 1000 times.
          String B: a specific 1000-bit string that we don't know a short program for (and that we can prove has high Kolmogorov complexity? We can't compute it, but we can argue that most strings are incompressible).

     We can use the fact that by a counting argument, most strings of length n have Kolmogorov complexity close to n.

     This example is unavoidable. We just need to be clear that:

          - We are not saying that the alternating string is random. We are saying that it has a low Kolmogorov complexity because of its pattern.
          - The random-looking string (which we can generate by a coin flip) is very likely to have high Kolmogorov complexity.

     And to avoid the misconception that Kolmogorov complexity is about randomness, we can state:

          "Kolmogorov complexity measures the length of the shortest program that generates the string. A string with a pattern can be generated by a short program. A string without patterns (like a typical random string) cannot be compressed and must be stored almost in full. However, note that a string that looks random might have a hidden pattern and then have a low Kolmogorov complexity. But in the typical case, random strings are incompressible."

     We must also note that Kolmogorov complexity is not about the string's appearance but about the existence of a short program.

     So let's stick with:

          Example: 
            String 1: "01" repeated 500 times -> length 1000, but program: `for i=1 to 500: print "01"` -> very short.
            String 2: a string of 1000 bits that we obtained by flipping a coin. We show the first 20 bits and then say "... and the rest is random". We say that the program for String 2 must essentially include the entire string, so it is about 1000 bits (plus a small overhead for the print statement).

     But note: we can write a program that says `print "01001100101110101010... (1000 bits)"`. That program is about 1000 bits plus a small constant. So K(String2) <= 1000 + c for some constant c.

     And by the counting argument, we know that there are strings that cannot be compressed by more than a constant: the vast majority of strings of length n have K(x) >= n - c (for some constant c). So we can say that with high probability, a random string has K(x) close to n.

     We then explain that Kolmogorov complexity is defined for a fixed universal Turing machine, but the invariance theorem says that the choice of universal machine only affects the complexity by a constant. So for long strings, the constant doesn't matter.

  IV. Universal Prior and Solomonoff Induction (30 mins)
     - We want to assign a probability to a string x (which we can think of as a sequence of observations) by considering all possible programs that output x and then halt.
     - The prior: M(x) = sum_{p: U(p)=x*} 2^{-|p|} 
          - Note: we must be careful: the sum is over programs that output x and then halt. Also, we have to avoid the programs that output a string starting with x and then more? Actually, Solomonoff's original definition is for a monotone machine that outputs an infinite sequence, and we look at the probability that the sequence starts with x. But for simplicity, we can use the above (which is the "prefix complexity" version to avoid the summation issues).

     Alternatively, we can use the prefix Kolmogorov complexity and define the universal prior as 2^{-K(x)} (but that is only up to a multiplicative constant). For the mixture, we use the sum over all programs (with prefix-free condition) that output x.

     - Explain: we are weighting each program by 2^{-length}. So shorter programs are exponentially more weighted.
     - The mixture argument: why does this prior predict well? 
          - We can show that for any computable probability distribution, the universal prior does not assign too low a probability (completeness): the prior dominates all computable priors (up to a multiplicative constant).
          - Then, by Bayes, if we have a good prior, we get good predictions.

     - The prediction: given past data x, the probability of the next bit being 0 or 1 is proportional to M(x0) and M(x1). 
     - The key theorem: the universal prior will quickly learn any computable distribution. Specifically, the total expected squared error between the predictions and the true computable distribution is bounded by a constant (related to the Kolmogorov complexity of the true distribution).

     We don't have to prove the theorem, but we can state it and explain the intuition: the prior gives high weight to the true program if it is short, and even if the true program is long, it is still represented in the mixture.

  V. Uncomputability (15 mins)
     - Now the punchline: Kolmogorov complexity is uncomputable. There is no algorithm that, given x, outputs K(x).
     - Moreover, the universal prior M(x) is uncomputable (and even more, it is not semi-computable from below, etc.).
     - Why is this a problem? Because we cannot actually compute the prior. So we cannot use Solomonoff induction in practice.

     - But note: the uncomputability does not make the theorem false. It remains a theoretical justification for Occam's razor: the simplest explanation (in the sense of shortest program) is the most probable. And we know that if we could compute it, it would work.

     - This uncomputability is a fundamental limitation, not just a temporary lack of an algorithm.

  VI. Addressing Misconceptions (15 mins, interspersed or at the end? Weave in as they naturally come up)

     We predict when they will form:

     - During Kolmogorov complexity example: 
          - 'simple means short in English words': when we say "short program", they might think of a description in English. We must emphasize that we are using a fixed programming language (the universal Turing machine) and that the invariance theorem makes it robust. Also, we must note that the Kolmogorov complexity is defined for a string, not for an explanation in words.

          - 'this is just what gzip measures': when we give the example, they might think of compression algorithms. We can say: yes, gzip is a practical approximation, but it is not optimal and doesn't achieve the theoretical minimum. And Kolmogorov complexity is about the ultimate compression by any possible program, not just by gzip.

     - During the universal prior: 
          - 'the dependence on which machine you pick is a bug': we have the invariance theorem, which says that the Kolmogorov complexity is invariant up to a constant. For the prior, the constant becomes a multiplicative constant, which doesn't affect the predictive power (because it is the same for all strings). So it's not a bug.

     - During uncomputability: 
          - 'uncomputable just means nobody's found the algorithm yet': no, we prove that there cannot be an algorithm. We can sketch the proof: if we could compute K(x), then we could build a string with K(x) larger than the length of the program we are using to compute K(x) (by the Berry paradox). 

          - 'if no computable method beats it then it's all arbitrary anyway': but note that we can approximate Solomonoff induction by using a computable prior (like a mixture over a smaller set of models, e.g., all programs up to a certain length). And these approximations (like AIXI) are still very powerful. Also, we have practical compression algorithms that are inspired by Kolmogorov complexity.

     We should address these when they naturally arise. For example:

          When defining Kolmogorov complexity: 
            - After defining it, immediately state: "Note that we are using a fixed universal Turing machine, and we have the invariance theorem: the Kolmogorov complexity relative to two different universal machines differs by at most a constant (that does not depend on the string). So for long strings, the choice of machine is not an issue."

          When giving the example: 
            - After the coin-flip example, say: "Now, you might think that gzip or other compression algorithms are measuring this. But note: Kolmogorov complexity is about the ultimate compression by any program. Gzip is a specific algorithm and might not compress a string that has a pattern that gzip doesn't recognize. So it's an approximation, but not the same."

          When talking about the prior: 
            - After stating the prior, say: "You might worry that the constant in the invariance theorem makes the prior arbitrary. But note: the multiplicative constant in the prior (that comes from the machine) does not change the fact that the prior dominates every computable prior. So the predictive power is unaffected."

          When discussing uncomputability: 
            - After stating it, say: "This is not a matter of no one having found the algorithm. We can prove that no such algorithm exists. For example, if we had an algorithm to compute K(x), we could write a program that finds the first string x such that K(x) > n, for a given n. But then we could describe x by this program and the number n, and if the program is of length m, then we have K(x) <= m + log n + c, which for n large enough would be less than n, a contradiction."

          When concluding: 
            - "You might think: if we can't compute it, and no computable method can do as well, then it's arbitrary. But note: we can use computable approximations, and the theory tells us that we are on the right track. Moreover, the theorem tells us that the ideal is unattainable, but that doesn't make the ideal any less important as a guiding principle."

  VII. Closing (15 mins)
     - Summarize the arc: we formalized simplicity as short programs, then defined a prior that weights by simplicity, and showed it predicts well. But we can't compute it.

     - Check understanding: 
          Ask: "Suppose we have two hypotheses (or programs) that both explain the observed data. One is short and the other is long. According to the universal prior, which one is more probable, and by what factor? And what does that imply for prediction?"

          Answer: The short one is more probable by a factor of 2^{length(long) - length(short)}. And for prediction, we use a weighted mixture of all programs that explain the data, so the shorter program will dominate.

     - What we didn't cover: 
          - We didn't cover the detailed proofs (e.g., invariance theorem, the predictive bound). 
          - We didn't cover the prefix Kolmogorov complexity in detail (which avoids the problems of the plain version). 
          - We didn't discuss the many extensions and variations (like Levin's Kt complexity, or resource-bounded Kolmogorov complexity). 
          - We didn't discuss the connection to Minimum Description Length (MDL) and how it is used in practice.

     - Explicitly say: "This is a very rich field, and we've only scratched the surface. The uncomputability is a fundamental limitation, but it doesn't invalidate the theorem. It tells us that we must use approximations, and the field of inductive inference and machine learning is about finding good approximations that work in practice."

  Timing:

    Introduction: 5 mins
    Turing Machines: 15 mins (total 20)
    Kolmogorov Complexity: 25 mins (total 45)
    Universal Prior: 30 mins (total 75)
    Uncomputability: 15 mins (total 90)
    Addressing misconceptions: 15 mins (weave in, but if not, then at the end) OR if weaved, then the uncomputability and misconceptions together might be 30 mins? 
    Closing: 15 mins (total 105, leaving 15 mins for questions and buffer)

  But the misconceptions should be addressed as they come up. So the 15 mins for misconceptions are already included in the sections.

  Alternatively, we can have a dedicated Q&A at the end.

  But the plan is to interleave the misconceptions.

  So the breakdown:

    0-5: intro
    5-20: Turing machines
    20-45: Kolmogorov complexity (include example and misconceptions 1,2,3)
    45-75: Universal prior (include misconception 3 again and 4,5)
    75-90: Uncomputability (include misconception 4,5 again)
    90-105: Closing and explicit summary of what we didn't cover, and the check question.

  The Carrying Example:

    We'll use the two strings:

        String1: "01" repeated 500 times -> K(x) is small.
        String2: a string of 1000 coin flips (we can show a sample) -> K(x) is large (with high probability).

    But we must be explicit:

        "Kolmogorov complexity is not about the string's appearance. It is about the existence of a short program. String1 has a short program. String2, being random, does not. But note: if we had a string that looked random but was generated by a short program (like the digits of pi), then it would have low Kolmogorov complexity. However, in the typical case, a random string has high Kolmogorov complexity."

    And we note: the example can only be made after we have defined the universal Turing machine and the notion of program length. So after the Turing machine section and the definition of Kolmogorov complexity.

    The idea that has to be nailed down: the invariance theorem. Without it, they might worry that the example depends on the machine. So we must state the invariance theorem and then say: so for long strings, the example holds regardless of the machine (the constant doesn't matter).

  Closing Check Question:

    We ask: "Suppose we observe a string of data, and there are two programs that both output that data. Program A is 100 bits long, and program B is 200 bits long. According to the universal prior, what is the ratio of the probability assigned to the data by program A versus program B? And what does that imply for the next bit prediction if the two programs predict different next bits?"

    Answer: 
        The prior weight for program A is 2^{-100}, and for program B is 2^{-200}. So the ratio is 2^{100} in favor of A. 
        For the next bit, the universal predictor would weight program A's prediction by 2^{-100} and program B's by 2^{-200}. So the prediction would be dominated by program A.

    If they can answer that, then they have the core idea.

  What to refuse to cover:

    - We are not covering the proof of the invariance theorem.
    - We are not covering the detailed proof of the prediction theorem (like the bound on the total error).
    - We are not covering the subtleties of prefix Kolmogorov complexity (except to mention that we need a prefix-free encoding of programs to avoid the summation being infinite, and that we can use self-delimiting programs).
    - We are not covering the continuous version (monotone complexity) in detail.

    Say: "We are skipping these details for time, but they are crucial for a complete formal treatment. If you are interested, I can recommend some references."

  References: 
    - "An Introduction to Kolmogorov Complexity and Its Applications" by Li and Vitanyi.
    - Marcus Hutter's work on universal artificial intelligence.

  Final note: The uncomputability is the sting that we want to come after they see the beauty of the prior. So we build the prior and then say: "But there's a catch: we cannot compute it." That should have impact.

  Let me know if you need adjustments.
answer: |-
  Here's a step-by-step session plan designed to maximize conceptual clarity and impact, with careful handling of misconceptions and a strategic reveal of uncomputability. The arc builds dependencies sequentially, with the example placed after invariance to ensure it carries weight.

  ---

  ### **Session Structure (120 mins)**
  **I. Turing Machines as Explanations (20 mins)**  
  - *What*: Define TMs as tuple (states, alphabet, transition rules), explain programs as input strings that cause TM to output data.  
  - *Why*: Establishes "explanation" = program that reproduces observations.  
  - *Dependency*: Foundation for everything. Without TMs, programs as explanations make no sense.  
  - *Misconception prevention*: Explicitly state "programs are bitstrings, not English sentences" to preempt "simple = short English words".  

  **II. Kolmogorov Complexity & Invariance Theorem (25 mins)**  
  - *What*: \( K_U(x) = \min\{ \ell(p) : U(p) = x \} \). Prove invariance: \( |K_{U_1}(x) - K_{U_2}(x)| \leq c \) for universal \( U_1, U_2 \).  
  - *Why*: Defines "simplicity" of an explanation. Invariance shows it’s not arbitrary.  
  - *Dependency*: Requires TM understanding (programs on \( U \) generate \( x \)).  
  - *Key moment*: **Nail invariance before the example**—otherwise, machine-dependence seems like a flaw.  

  **III. The Carrying Example (15 mins)**  
  - **Use structured vs. pseudorandom data** (not coin flips):  
    - *String A*: First \( n \) digits of \( \pi \) in binary (e.g., "110010010000111...").  
    - *String B*: Output of a cryptographic PRG (e.g., AES with random key) with same length.  
  - *Why this works*:  
    - \( \pi \) has low \( K \) (fixed program to compute digits).  
    - PRG has high \( K \) (no short program *by design*—reveal the key to show it’s "stored", not "generated").  
  - *What it carries*:  
    - Illustrates \( K \) measures *intrinsic* structure, not superficial randomness.  
    - Avoids coin-flip pitfall: Neither string "looks simple", but one *is* simple.  
  - *Prerequisite*: Invariance theorem (so constants don’t break the example).  
  - *Misconception*: "gzip measures this" → refute: "gzip is heuristic; \( K \) is fundamental (per invariance)".  

  **IV. Universal Prior & Prediction (30 mins)**  
  - *What*: Solomonoff prior \( M(x) = \sum_{p:U(p)=x*} 2^{-\ell(p)} \) (prefix-free programs).  
  - *Why*: Formalizes "better" = optimal prediction via Bayes.  
  - *Mixture argument*: For any computable \( \mu \), \( M \) dominates \( \mu \) multiplicatively: \( M(x) \geq c_\mu \mu(x) \).  
  - *Dependency*: Requires \( K \) (prior weights programs by simplicity).  
  - *Prediction demo*: Compute \( M(\text{next bit} = 1 | x) \) for \( x = \pi \)’s first 100 digits. Short programs extending \( x \) dominate.  
  - *Misconceptions*:  
    - "Dependence on \( U \) is a bug" → invoke invariance: \( M_{U_1}(x) = \Theta(M_{U_2}(x)) \), so predictions are robust.  
    - "Arbitrary weights" → stress: dominance theorem *forces* this weighting to predict well.  

  **V. Uncomputability (20 mins)**  
  - *Reveal last*: Prove \( K \) is uncomputable (reduction to halting problem; sketch Berry paradox).  
  - *Why last*: They already "buy" \( M \) as optimal—now show it’s unattainable.  
  - *Impact*: Framed as a **fundamental limit on inference**, not a quirk.  
  - *Misconceptions*:  
    - "Uncomputable = no algorithm yet" → contrast with undecidability.  
    - "If nothing beats it, it’s arbitrary" → emphasize: **This *is* the theorem** (all computable methods are strictly worse).  

  **VI. Closing & Foothills (10 mins)**  
  - *Check if it landed*: **"Why can’t we just use a large but computable prior, since Solomonoff is uncomputable anyway?"**  
    - *Correct answer*: Any computable prior fails on some data (by dominance theorem), while \( M \) doesn’t. Uncomputability isn’t the flaw—it’s the price of optimality.  
  - *What we omit*:  
    - Resource bounds (Levin’s \( Kt \)), continuous distributions, concrete MDL.  
    - State openly: "We skipped these to show the *core* tradeoff: optimality vs. computability. Real-world methods (like MDL) are approximations, but this is why they work."  

  ---

  ### **Misconception Handling Timeline**
  1. **"gzip measures this"**  
     - *When*: During Kolmogorov complexity (III).  
     - *Cause*: Example strings invite compression analogies.  
     - *Kill it*: "gzip is a *heuristic*; \( K \) is *universal* (per invariance). gzip can’t compress \( \pi \) better than specialized compressors, but \( K \) abstracts all methods."  

  2. **"Simple = short in English"**  
     - *When*: Early in TM section (I).  
     - *Cause*: Intuitive notion of simplicity.  
     - *Kill it*: Define programs as bitstrings immediately. Contrast: English is ambiguous; TMs are formal.  

  3. **"Machine-dependence is a bug"**  
     - *When*: Invariance theorem (II) and prior (IV).  
     - *Cause*: Constants in invariance seem weak.  
     - *Kill it*: "Constants vanish in prediction ratios (e.g., \( \frac{M(x0)}{M(x1)} \)). Optimality is asymptotic."  

  4. **"Uncomputable = not found yet"**  
     - *When*: Uncomputability reveal (V).  
     - *Cause*: Colloquial use of "uncomputable."  
     - *Kill it*: Prove reduction ("solving \( K \) solves halting problem").  

  5. **"No computable method wins → arbitrary"**  
     - *When*: During/after uncomputability (V).  
     - *Cause*: Philosophical discomfort.  
     - *Kill it*: "The theorem *justifies* approximations: they mimic \( M \)’s *short-program bias*. Regularization isn’t arbitrary—it’s a necessary hack."  

  ---

  ### **Why This Works**
  - **Uncomputability as climax**: By delaying it until *after* they see \( M \)’s optimality, it reframes from "footnote" to "tragic insight".  
  - **Example choice**: \( \pi \) vs. PRG forces engagement with *structure* (not randomness), avoids gzip associations.  
  - **Check question**: Tests grasp of dominance theorem’s implications—optimality isn’t nullified by uncomputability.  
  - **Omissions stated**: Prevents false closure; positions Solomonoff as ideal that practical methods (MDL, regularization) approximate.  

  This plan ensures the "theorem, not slogan" point lands: Solomonoff *proves* Occam, but the cost is uncomputability—and that’s why ML uses computable surrogates.
