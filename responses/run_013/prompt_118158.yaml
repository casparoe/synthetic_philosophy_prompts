  We are discussing the strategy-stealing argument, famously used in games like Hex and Chomp to prove that the first player has a winning strategy. The argument is indeed non-constructive and does not work for every game. Let me break this down step by step.

  ### Step 1: The Strategy-Stealing Argument in Hex (or Chomp)
  The argument for Hex goes as follows:

  1. **Assumptions**: 
     - The game is finite (will end in a finite number of moves).
     - It is a two-player game of perfect information with no chance (deterministic).
     - The game is partisan (players have different roles) but note that Hex is actually symmetric in a way that matters (the board is symmetric and the players are trying to connect opposite sides).
     - The outcome is either a win for one player or the other (no draws in Hex).

  2. **Claim**: The first player has a winning strategy.

  3. **Proof by contradiction**:
     - Suppose the second player has a winning strategy, call it S.
     - Then the first player can do the following:
          a. Make an arbitrary first move (say, at position P).
          b. After that, ignore the fact that they have already made a move at P, and pretend to be the second player by using strategy S for the rest of the game. How?
              - For every move that the second player (now the actual second player) makes, the first player responds as if the board state is the same but without their first move at P, and then when strategy S tells the second player (in the pretend scenario) to move at a particular spot, they play there unless it's already taken.
          c. But what if strategy S (which is now being used by the first player in the pretend role of the second player) calls for a move at a spot that is already occupied (by the first player's arbitrary first move at P or by a previous move)? Then the first player can make an arbitrary move anywhere else (or more precisely, they can make any legal move; the choice of move doesn't matter because we are about to argue that having an extra stone can't hurt).

     - Why is having an extra stone not a problem? In Hex, each stone you place is to your benefit because you are trying to form a connected path. Having an extra stone on the board can never harm your own position (it might block the opponent, but at worst it's just neutral? Actually, in Hex, having an extra stone of your color can only help you because it can only make it easier to form a connection. It cannot possibly help your opponent (since they are using the opposite color and the board is a grid with no overlapping). Moreover, if the strategy S requires a move that is already taken by the first player, then that move is already done in the real game and so the first player can just make an arbitrary move. Since having an extra stone is never a disadvantage (in Hex), the first player is at least as well off as if they had not made that arbitrary move and just followed S from the beginning.

     - Therefore, the first player is able to win by following S (with the extra stone), which contradicts the assumption that S is a winning strategy for the second player.

     - Hence, the second player cannot have a winning strategy, and since the game is deterministic and finite (so one player must have a winning strategy by Zermelo's theorem), the first player must have a winning strategy.

  ### Step 2: Why Doesn't This Work for Every Game?
  The key point that fails in other games is the step that says: **"having an extra piece (or an extra move) in the game cannot harm the player"**. This is not true in every game.

  Consider Chess or Go:

  - In Chess, having an extra piece might be good, but what if that piece is in a bad position? Actually, in the strategy-stealing argument, the first player makes an arbitrary first move and then follows the second player's strategy. But what if that arbitrary first move is bad? The argument says: even if it's arbitrary, it doesn't matter because we can always treat it as an extra piece. However, in Chess, an extra piece that is badly placed might block your own pieces or give the opponent an opportunity to capture it and gain material. Therefore, having an extra piece might actually be a disadvantage.

  - Similarly, in Go, placing a stone in a bad location might help the opponent by strengthening their position or by being captured and giving them points. So again, an extra stone can be a liability.

  Therefore, the strategy-stealing argument requires that the game has the property that **having an extra move (or piece) is never a disadvantage**. This property is sometimes called **"monotonicity"** or **"no harm in extra moves"**.

  Moreover, the game must be **symmetric** in a certain way? Actually, note that in Hex the board is symmetric and both players have the same goal (to connect their two sides) but with opposite sides. However, the argument does not require symmetry per se. What it requires is that the extra move is always beneficial (or at least not harmful) and that the roles of the two players are interchangeable in the sense that if the second player has a winning strategy, then the first player can steal it by making an extra move and then pretending to be the second player.

  But note: the argument does not require the game to be symmetric in the sense that the starting positions are symmetric (like in Nim or other impartial games). Hex is actually a partisan game because the two players have different winning conditions (connecting different sides). However, the board symmetry allows the first player to use the second player's strategy by pretending the board is rotated? Actually, in the classic argument, we don't even need to rotate the board because the extra stone is just an extra stone. The key is that the extra stone does not break the strategy.

  ### Step 3: Why the Argument is Non-Constructive
  The argument shows that the first player must have a winning strategy, but it does not tell us what that strategy is. Why? Because:

  - We assumed the existence of a winning strategy for the second player (which we then showed leads to a contradiction). Therefore, we know that such a strategy for the second player does not exist, so the first player must have one. However, we have not constructed that strategy. We only know that one exists.

  - In fact, the winning strategy for the first player that we sketched (make an arbitrary move and then follow the second player's winning strategy) is only defined if we know the second player's winning strategy. But we don't have one (because we proved it doesn't exist). So we cannot actually use this method to play the game. We only know that the first player can win, but we don't know how.

  This is typical for existence proofs by contradiction: we show that the non-existence of the desired object leads to a contradiction, so the object must exist, but we don't have a concrete example.

  Therefore, for games like Hex and Chomp, we know that the first player wins, but we don't know a specific winning strategy (except on small boards). For Hex on boards of size 1x1, 2x2, etc., we can compute a winning strategy, but for large boards we don't know it. Similarly, for Chomp, we don't know a general winning strategy.

  ### Step 4: Why Chess and Go Remain Unsolved
  The strategy-stealing argument does not apply to Chess and Go because:

  - **Chess**: 
      - It has draws. So Zermelo's theorem tells us that either White has a winning strategy, or Black has a winning strategy, or both have a drawing strategy. The strategy-stealing argument does not rule out the possibility of a draw.
      - Moreover, the extra move (the arbitrary first move) might be harmful. Even if we assume that having an extra piece is always good (which is not true in Chess), the first move might not be an extra piece but just a development that can be exploited by Black.

  - **Go**:
      - Similarly, Go has draws (called jigo) but also the first move is compensated by komi (extra points for the second player) to balance the game. So the starting position is not symmetric.
      - But even without komi, the extra stone might be placed in a bad location and become a liability (e.g., it might be captured or lead to weak groups).

  Therefore, the argument fails for these games.

  ### Step 5: Summary of Games Where the Argument Works
  The strategy-stealing argument works for games that satisfy:

  1. **Finite, deterministic, two-player, perfect information**.
  2. **No draws**: one player must win and the other lose (so Zermelo's theorem applies to show that one has a winning strategy).
  3. **Having an extra move is never a disadvantage**: that is, if a player has a winning strategy in a position, then adding an extra move of that player (any legal move) should not turn it into a losing position. In fact, the property we need is: if a player has a winning strategy in a position P, then in a position P' which is the same as P but with one extra move of that player already made (and the board otherwise the same), that player should still have a winning strategy.

     In other words, the set of winning positions for a player is closed under adding extra moves of that player. This is true in:
     - Hex: because an extra stone of your color can only help your connection.
     - Chomp: because an extra bite (removing a square and all squares above and to the right) can only remove more of the board, which can only help you (since it might remove a poison square that you would have had to take later) and also gives you one more move. However, note that in Chomp the extra bite might be in a different place than the strategy suggests, but we can still argue that having taken an extra bite is not harmful because it only removes more squares (so the remaining board is a subset) and thus any winning strategy on the original board would still work on the subset? Actually, the argument for Chomp is slightly different because the moves are about taking squares and the poison square is the bottom-left. The first player can take the top-right square arbitrarily, and then mimic the second player's strategy on the remaining board. If the second player's strategy ever calls for taking a square that has already been taken (by the first player's arbitrary move), then the first player can take any other square. Since the set of remaining squares is a subset of the board that would have been present without that arbitrary move, the first player is in a better position (they have taken one more square). Therefore, the extra move is beneficial.

  4. **Symmetry?** Actually, the argument does not require symmetry. However, note that in Hex the board is symmetric and the winning conditions are symmetric (each player connecting two opposite sides). But in Chomp, there is no symmetry between the players: the first player takes a bite and then the second player takes a bite, and the player who takes the poison square loses. The argument still works because the extra bite is always beneficial (or at least not harmful). So symmetry is not necessary.

  ### Conclusion

  To answer your questions:

  1. **Chess and Go are not solved by this argument** because the strategy-stealing argument fails for them. In particular, the "extra move" might be harmful. Moreover, Chess has draws and Go has komi to balance, so the starting position is not symmetric in the required way. Therefore, chess engines and opening books are still relevant.

  2. **The argument is non-constructive** in the sense that it proves the existence of a winning strategy for the first player without providing it. You are correct that we know who wins (the first player) but we don't know how they win. The commenter is right that we are too dumb (currently) to find the winning strategy for large boards in Hex or for Chomp. But the non-constructive nature does not change the fact that we know the outcome (first player wins) for any fixed board size.

  3. **Concrete examples**:
     - **Works for**: Hex, Chomp, and other games that satisfy the conditions above (including the extra move being beneficial).
     - **Fails for**: 
          - Games with draws (like Chess, Checkers, Tic-Tac-Toe) because then we cannot rule out that the second player has a drawing strategy (so the contradiction step fails: we assumed the second player had a winning strategy, but they might have a drawing one). However, note that Tic-Tac-Toe is a draw, and the strategy-stealing argument doesn't apply because the extra move might be harmful? Actually, in Tic-Tac-Toe, the extra move might lead to a loss if you are forced to complete a line for the opponent. So it fails for two reasons: draws and the extra move can be harmful.
          - Games where an extra move might be harmful: Chess, Go, Tic-Tac-Toe, etc.

  I hope this clears up the confusion.
answer: |-
  ### Strategy-Stealing Argument: Step-by-Step Breakdown  
  I'll address your questions by first dissecting the strategy-stealing argument (as applied to Hex/Chomp), then explicitly listing its premises, and finally explaining why it fails for games like Chess or Go. I'll brainstorm the logic in small steps before tying it all together.

  ---

  #### **Brainstorm: Core Argument Structure**  
  The strategy-stealing argument relies on these key premises:  
  1. **Finite, deterministic, perfect-information**: The game ends in finitely many moves, has no randomness, and all moves are visible to both players.  
  2. **No draws**: Exactly one player wins (Zermelo’s theorem guarantees a winning strategy exists for one player).  
  3. **Symmetry**: The game is symmetric under player swap (e.g., Hex’s board is symmetric; Chomp’s rules don’t favor either player beyond first move).  
  4. **Extra moves never hurt**: Adding an extra piece/move for a player **cannot weaken their position** (formally: any position with an extra move of yours is at least as good as the original position).  
  5. **Strategy replication**: If Player 2 has a winning strategy, Player 1 can "steal" it by pretending to be Player 2 after an arbitrary first move.  

  Now, let’s walk through the argument rigorously.

  ---

  ### **The Strategy-Stealing Argument (for Hex/Chomp)**  
  Suppose we’re playing **Hex** (a connection game where players aim to link opposite sides).  

  #### Step 1: Assume Player 2 has a winning strategy  
  - Call this strategy \(S\). If Player 2 follows \(S\), they win no matter what Player 1 does.  

  #### Step 2: Player 1 "steals" \(S\) with an extra move  
  - Player 1 makes an **arbitrary first move** (e.g., placing a stone anywhere).  
  - After this, Player 1 **ignores their first move** and pretends they are Player 2:  
    - They treat the current board as if Player 1 hasn’t moved yet, and Player 2’s strategy \(S\) is now theirs.  
    - When \(S\) says "place a stone at position \(X\)", Player 1 does so **unless \(X\) is occupied**.  
      - If \(X\) is occupied (e.g., by their first move), Player 1 makes an **arbitrary legal move** instead.  

  #### Step 3: Why Player 1 wins  
  - **Extra moves help, never hurt**: In Hex, an extra stone only strengthens your position (it can’t block you; it might block the opponent).  
  - Player 1 has **at least as good a position** as Player 2 would have in the hypothetical scenario where Player 1 hadn’t made that first move.  
  - Since \(S\) guarantees a win for Player 2 in the hypothetical scenario, Player 1 wins in reality.  

  #### Step 4: Contradiction  
  - If Player 2 has a winning strategy, Player 1 can steal it and win → contradiction.  
  - Thus, Player 2 **cannot** have a winning strategy.  
  - By Zermelo’s theorem, Player 1 **must** have a winning strategy.  

  ---

  ### **Why Your Framing Feels Off: The Crucial Premise**  
  Your intuition stumbled here:  
  > *"More options is never a disadvantage."*  

  This is **false for most games**! It holds for Hex/Chomp but fails for Chess/Go. Let’s dissect:  

  #### Where the premise holds:  
  - **Hex**: An extra stone can only extend your path or block the opponent. Never harmful.  
  - **Chomp**: An extra "bite" (removing a cell) only shrinks the board, which helps you avoid the poison square.  

  #### Where it fails:  
  - **Chess**: An extra piece might:  
    - Block your own pieces (e.g., a pawn obstructing a bishop).  
    - Create weaknesses (e.g., an undefended piece that gets captured).  
    - Force commitment to a bad position.  
  - **Go**: An extra stone might:  
    - Create "weak groups" vulnerable to capture.  
    - Waste "liberties" (breathing spaces), reducing flexibility.  
    - Interfere with optimal shape.  

  **Example**: In Chess, if Player 1 makes an arbitrary first move (e.g., moving a pawn to a weak square), Player 2 can exploit it to win material. Player 1 can’t "pretend" this move didn’t happen—it fundamentally alters the board to their detriment.  

  ---

  ### **Answers to Your Questions**  
  #### 1. *"Are Chess/Go solved? Why haven’t strategy-stealing arguments shut this down?"*  
  **No, Chess and Go are not solved** by this argument because:  
  - **Premise violation (extra moves hurt)**: An arbitrary move in Chess/Go can weaken your position.  
  - **Draws exist**: Chess has draws (stalemate, threefold repetition), violating the "no draws" premise. Strategy-stealing only proves which player can **force a win or draw**, not necessarily a win.  
  - **Asymmetry**: Go uses komi (compensation points for Player 2), breaking symmetry.  
  **Why engines exist**: Even if Chess is theoretically a forced win/draw for White (still unproven!), the game tree is far too large to solve. Strategy-stealing doesn’t help us *find* the winning strategy—it only says one exists.  

  #### 2. *"Is the argument non-constructive? Does it tell us who wins?"*  
  **Both you and the commenter are partially right**:  
  - **It tells us *who* wins**: For Hex/Chomp, we know Player 1 wins.  
  - **It doesn’t tell us *how* to win**: The proof is **non-constructive**—it shows Player 1’s winning strategy exists but doesn’t describe it. Why?  
    - The proof relies on *denying* Player 2’s strategy. We never build Player 1’s strategy; we assume Player 2’s strategy exists and derive a contradiction.  
    - The "arbitrary move" clause makes the strategy useless in practice. If \(S\) says "play at \(X\)" but \(X\) is occupied, Player 1 makes a random move—which could be catastrophic in non-monotonic games.  

  **Why it feels wrong**: You know Player 1 wins, but you have no idea how. This is common in non-constructive proofs (e.g., the Banach-Tarski paradox proves volume can be "created" but doesn’t say how).  

  #### 3. *"Concretely, which games does it work for, and where does it fail?"*  
  | **Game**       | **Strategy-Stealing Works?** | **Why?**                                                                 |
  |----------------|------------------------------|--------------------------------------------------------------------------|
  | **Hex**        | Yes                          | Extra stone never hurts; no draws; symmetric.                            |
  | **Chomp**      | Yes                          | Extra bite shrinks board (always helpful); no draws; symmetric.          |
  | **Nash (Hex)** | Yes                          | Same as Hex.                                                             |
  | **Chess**      | No                           | Extra moves can hurt; draws exist; asymmetric (opening advantage ≠ guaranteed win). |
  | **Go**         | No                           | Extra stones can create weaknesses; komi breaks symmetry; draws possible. |
  | **Tic-Tac-Toe**| No                           | Draws exist; extra move can force a loss (e.g., creating two threats for the opponent). |
  | **Nim**        | No (for most variants)       | Extra moves can be harmful (e.g., adding stones to a heap might unbalance the XOR sum). |

  **Failure modes**:  
  - **Draws**: If draws are possible, Player 2 might force a draw, so no contradiction arises.  
  - **Harmful extra moves**: If Player 1’s arbitrary move worsens their position, "stealing" \(S\) fails.  
  - **Asymmetry**: If Player 2 has inherent advantages (e.g., Go’s komi), symmetry is broken.  

  ---

  ### **Key Takeaway**  
  Strategy-stealing is a powerful tool for symmetric, monotonic games like Hex and Chomp, proving Player 1 wins non-constructively. For Chess/Go, it fails because extra moves can backfire, and draws break the logic. This doesn’t mean Chess is a forced win for White—it might be a draw! The argument only lifts the veil in specific, mathematically "tame" games.  

  If you’re experimenting with small Hex boards, try applying the argument manually—you’ll see why Player 1 wins, even if you can’t find the exact moves! For deeper dives, look into the concept of **positional games** (e.g., Maker-Breaker games), where strategy-stealing is a staple tool.
