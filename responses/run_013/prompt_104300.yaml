prompt: |-
  Ok so I've been lurking rationalist blogs and forums for like a decade and I finally have one that's eating my brain, so I'm bringing it here. A friend of mine -- the kind of guy who has strong opinions about quadratic voting and has read way too much about Athens -- walked me through this argument about sortition and I can't find the exit. Here it is:

  (1) A collective decision that binds everyone is legitimate only if everyone it binds had an equal chance to shape it.
  (2) Elections fail this test. Money, incumbency, name recognition, media access -- the ex ante chances are wildly unequal, so an elected body doesn't clear the bar in (1).
  (3) A random sample does clear it: ex ante, everyone had the same probability of being picked and the same probability of landing in the majority that decides. So a randomly selected assembly is legitimate in a way an elected one isn't.
  (4) But nothing in (1)-(3) is special to parliaments. Take any decision that affects a bunch of people: which of two patients gets the last ventilator, which of three families gets the subsidized flat, who gets the job, who gets the kidney.
  (5) So by the same reasoning all of those should be decided by lot too. Spin the wheel, everyone had an equal chance, done.
  (6) That's obviously crazy though. You triage the ventilator -- you give it to whoever it saves, or whoever's worse off -- you dont raffle it. You hire the qualified candidate. Nobody thinks a lottery is the right way to hand out kidneys; we use waiting lists and match criteria, not raffles.
  (7) So either (1) is false or (3) doesn't actually deliver the legitimacy I thought it did. And if (3) is dead then so is the whole case for lottocracy, which I really don't want to give up.

  He says this shows sortition refutes itself, and honestly the move smells like a classic "proves too much" and I should be able to shrug it off, but I can't name what's wrong. I feel like something slips between (3) and (4), but maybe it's (3) that's already too strong, or maybe (1) is just a bad criterion and I've been leaning on it too hard. Which step do you reject, and what does rejecting it cost me? I'd rather keep (3) than (6) if I have to choose, but I want to know what I'm paying -- does saving (3) force me to give up something about sortition I actually care about?

  Also: please tell me how confident you are in your diagnosis, and single out the one point you're least sure about. I don't want a confident vibe, I want to know where you're guessing.
reasoning: |-
  Okay, the user has been into rationalist blogs for a decade and is now stuck on this sortition argument. Their friend presented a case that seems to refute sortition by extending it to all decisions, leading to absurd conclusions like raffling kidneys. The user wants to know which step is flawed and how confident I am.

  First, I need to break down the argument step by step. The key premises are: legitimacy requires equal ex ante chance to shape decisions (1), elections fail this (2), sortition satisfies it (3), but applying it universally leads to crazy outcomes (4-6). The user feels stuck between keeping (1) or (3) versus accepting the absurdity of (6).

  Hmm, the core issue seems to be premise (1). The friend claims that equal ex ante chance is necessary for legitimacy. But is that really true? In everyday decisions like medical triage or hiring, we prioritize outcomes—saving lives, efficiency, fairness based on need. We don't use lotteries because the stakes are too high for random chance. So maybe (1) is only applicable to political representation, not all binding decisions.

  The user mentioned they don't want to give up sortition, so they probably value it for political systems. That means distinguishing between types of decisions. Political legitimacy might involve procedural fairness over time, while urgent, high-stakes decisions need outcome-oriented methods. 

  But how to justify this distinction? Political decisions are ongoing, affect large groups, and require collective buy-in. Medical or hiring decisions are specific, immediate, and need expertise. Sortition works for legislatures because it's about representation, not expertise. In life-saving scenarios, randomness could be seen as irresponsible. 

  The user also hinted at a slip between (3) and (4). Step (4) generalizes the principle to any decision, but that's where the problem lies. Sortition's legitimacy comes from equal opportunity to participate in shaping collective rules, not every single decision. So rejecting (4)'s universal application saves sortition without accepting kidney raffles.

  The user wants confidence levels. I'm pretty sure (1) is the weakest link because it's too broad. But I'm less sure about how to precisely define the scope where (1) applies. Maybe it's about the nature of the decision—whether it's about setting rules versus applying them. Political philosopher distinctions here could help, but the user might not need that depth. 

  Also, the friend's move is a "proves too much" argument. Valid, but it doesn't mean sortition is invalid; it means the initial premise needs refinement. The cost of rejecting (1) as universally true is that the user has to accept that legitimacy isn't one-size-fits-all. They might need additional criteria for when equal chance is appropriate. 

  The user's deeper need is probably to reconcile their support for sortition with avoiding absurd extensions. They want a principled way to limit the application. Highlighting the difference between legislative bodies and individual decisions addresses that. They might also be worried about consistency in their beliefs, so clarifying the scope of legitimacy principles helps.
answer: |-
  This is a sharp argument that exposes a tension in theories of procedural legitimacy. Your intuition about a "slip" is correct. Here's the breakdown, with confidence levels and the weak point flagged:

  1.  **The Core Problem: Premise (1) is Overly Broad and Simplistic (High Confidence: 90%)**
      *   Premise (1) – "A collective decision that binds everyone is legitimate *only if* everyone it binds had an equal chance to shape it" – is the crux. This is an extremely narrow, purely procedural definition of legitimacy. It ignores other crucial dimensions:
          *   **Outcome Quality/Consequences:** Legitimacy often depends on whether the decision *works* or produces morally acceptable/optimal results. Giving a ventilator via lottery to a patient it won't save, while denying it to one it would, is horrifying not just procedurally, but *because of the outcome*. We care about *who lives and who dies*.
          *   **Relevance of Reasons/Expertise:** Legitimacy can stem from the *reasons* behind a decision and the *qualifications* of the decider. Hiring the most qualified candidate is legitimate because it (ideally) leads to better job performance. A random hiring committee using sortition might be procedurally "equal," but if they hire an unqualified candidate based on irrelevant criteria, the decision lacks legitimacy *because the outcome is bad and the reasons were poor*. Expertise matters.
          *   **Desert, Need, and Fairness:** Many decisions (kidneys, ventilators, subsidies) involve principles of *distributive justice*: who *deserves* it, who *needs* it most, what allocation is *fairest* given differing circumstances. A pure lottery ignores all morally relevant differences between people. Equal chance ≠ fair outcome.
          *   **Scope of "Shape It":** In sortition for a *representative body*, "shaping it" means potentially being part of the deliberative process *over time*. In a one-off lottery for a kidney, "shaping it" is reduced purely to the binary chance of winning. These are qualitatively different forms of "influence."
      *   **Cost of Rejecting (1) as the *Sole* Criterion:** You must accept that legitimacy is multi-dimensional. Procedural fairness (like equal ex-ante chance) is *one* important factor, especially for fundamental political structures, but it is not *always* sufficient, nor is it always *necessary* in the strongest sense. Sometimes good outcomes, relevant reasons, or principles of justice outweigh pure procedural equality. This doesn't destroy the case for sortition in politics; it just means its justification needs to rest on more than *just* (1).

  2.  **The Misstep: Step (4) Illegitimately Generalizes the Context (High Confidence: 85%)**
      *   Step (4) ("But nothing in (1)-(3) is special to parliaments") is where the argument jumps the rails. It assumes the *kind* of decision and the *context* don't matter. But they matter profoundly.
      *   **Legislative Bodies vs. Specific Allocations:**
          *   A parliament makes *general rules and policies* affecting a large population over a long time. Its legitimacy hinges heavily on broad procedural fairness and representativeness *because* it's impossible for everyone to be an expert on everything, and outcomes are complex and long-term. Sortition offers a unique form of descriptive representation and breaks elite capture.
          *   Deciding who gets a single kidney, ventilator, job, or flat is a *specific, high-stakes allocation decision* with immediate, life-altering consequences for identifiable individuals. Here, legitimacy *also* depends heavily on:
              *   Applying relevant criteria (medical urgency, tissue match, qualifications, need).
              *   Achieving the best possible outcome given scarce resources.
              *   Adhering to principles of justice (desert, need, fairness).
          *   Pure procedural equality (a lottery) actively *prevents* the use of these morally relevant criteria and often leads to worse outcomes. It sacrifices outcome legitimacy and justice legitimacy for the sake of a very narrow form of procedural legitimacy.
      *   **Cost of Rejecting (4):** You must accept that the justification for sortition is context-dependent. It's strong for *ongoing representative bodies making general laws/policy*, but weak or invalid for *specific, high-stakes, individual allocation decisions* where outcome quality and justice criteria are paramount.

  3.  **Saving (3): Sortition *Can* Deliver Legitimacy *for Legislatures* (Confidence: 80%)**
      *   You can keep (3): "A random sample *does* clear [the bar of equal ex-ante chance]" *as one source of legitimacy for a legislative body*. This remains a powerful argument *compared to elections* plagued by systemic inequalities. It delivers descriptive representation and disrupts entrenched power.
      *   **Why it doesn't force you to accept (6):** Because the legitimacy of a sortition-based legislature doesn't *solely* rest on (1). It can *also* be argued to promote:
          *   **Deliberative Quality:** Randomly selected citizens, properly supported, can engage in reasoned debate free from electoral pressures.
          *   **Reduced Corruption:** Less susceptibility to lobbying and campaign finance influence than elected officials.
          *   **Epistemic Benefits:** Harnessing diverse perspectives and cognitive diversity (under certain conditions).
      *   Crucially, *even a sortition legislature shouldn't make every decision by lottery*. It would (ideally) use reason, evidence, expert testimony, and principles of justice to craft laws and oversee allocations. It wouldn't raffle kidneys; it might design a kidney allocation *system* based on medical need and fairness, which might *then* use waiting lists or algorithms – not individual lotteries. The sortition body provides the *governing framework*, not the direct allocation mechanism for every scarce resource.
      *   **Cost:** This requires defending sortition legislatures based on a *broader set of justifications* beyond pure procedural equality (1). You need arguments about deliberation, corruption reduction, cognitive diversity, etc., *alongside* descriptive representation.

  4.  **The Least Confident Point: Precisely Defining the Scope of (1) (Confidence: 70%)**
      *   I'm least confident about drawing the *exact, uncontestable line* where the pure procedural equality of (1) becomes insufficient or inappropriate. Why is it essential for a constitution but not for a ventilator? My argument hinges on the distinction between *systemic rule-making/governance* (where long-term procedural fairness is paramount) and *specific, high-stakes allocations* (where outcome and justice matter more immediately). This feels right intuitively and aligns with most moral and political theory, but rigorously defending this boundary against every edge case is challenging.

  **Conclusion & Your Choice:**

  *   **Reject Step (4) most decisively:** The argument fails because it wrongly assumes the legitimacy criterion in (1) applies identically to *all* binding decisions, regardless of context (systemic governance vs. specific allocation). **This is the cleanest escape hatch.**
  *   **Reject Premise (1) as the *sole* necessary and sufficient criterion for legitimacy:** Legitimacy is multi-dimensional. Equal ex-ante chance is valuable for political representation but insufficient (and sometimes counterproductive) for many allocation decisions where outcomes, reasons, expertise, and justice matter intensely. **This is fundamental.**
  *   **Save (3) for legislatures:** Your desire to keep (3) is viable. Sortition *does* provide a unique and powerful form of procedural legitimacy *for representative bodies*, distinct from elections. This legitimacy stems from descriptive representation and breaking elite capture, and it *can* be part of a broader justification involving deliberation and reduced corruption. **This doesn't commit you to kidney raffles.**

  **What it Costs:** Defending sortition for legislatures requires moving beyond *only* the argument from equal ex-ante chance (1). You need a richer theory of legitimacy that incorporates why descriptive representation via lot is valuable *for making laws and policy*, and how it interacts with deliberation, expertise, and achieving good outcomes. You must accept that legitimacy demands different things in different contexts. This isn't giving up on sortition; it's giving it a more robust and defensible foundation. You can absolutely keep (3) without accepting (6) by recognizing the crucial difference in the *type of decision* being made. The "proves too much" charge is deflected by showing the context matters.
