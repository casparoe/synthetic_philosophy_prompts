  I should flag which parts are consensus vs contested. Most agree HCH is an idealization under perfect conditions, but there's sharp debate about whether the base human "reasoning core" can be scaled this way, or if adversarial settings reveal fundamental flaws. The trust assumption is particularly contentious - some researchers think incentives inevitably corrupt such systems.

