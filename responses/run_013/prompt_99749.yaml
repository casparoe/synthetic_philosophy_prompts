prompt: |-
  Retired experimental physicist here — forty years of condensed matter, now reading philosophy badly in the shed. My son works on AI safety and keeps saying we should build agents that "avoid side effects", and I keep wanting to know what that phrase could possibly mean. Here's the claim I'd like your credence on: there is no measure of unnecessary side effects that is sharp enough to actually hold back a powerful optimiser and that doesn't already smuggle in a full ranking of which ways the world could be are better than which. Take the crude version I'd try first — photograph the kitchen before the robot starts, photograph it after, count the pixels that changed, tell it to keep the count low. Can that be cashed out without my having decided in advance that a moved chair matters and a speck of dust doesn't? Give me a number, and decompose it: how much rides on relativising side effects to the agent's stated goal versus to a baseline of what would have happened anyway; how much on whether the frame problem — what counts as a relevant feature at all — is fatal here; how much on the suspicion that the claim is trivially true because any constraint whatsoever is a value judgement; and whatever else you think belongs in the sum. One line of justification per term, then the combination. Then say which sub-question the number is most sensitive to and what would move it. I've been arguing with him about this for months and I'd like to know where the disagreement actually lives.
