answer: |-
  Below is a practical, 90-minute checklist for evaluating surprising results using an Occam's razor framework. It balances formal theory (Solomonoff induction, MDL, Kolmogorov complexity) with real-world constraints (small n, researcher degrees of freedom). Steps are ordered for efficiency, with clear stopping rules. Key principles:

  - **Complexity matters most in small samples**: The prior (simplicity) dominates when data is limited (n < 100). As n grows, fit becomes primary.
  - **Charge for researcher degrees of freedom**: Each analysis choice adds to description length. This is formalized in MDL via "uniformativeness" of hypotheses.
  - **Drop uncomputable ideals**: Kolmogorov complexity's additive constant is fatal for small n; use practical surrogates (e.g., parameter counts + forking paths).
  - **Validation beats simplicity**: A complex model that predicts held-out data well can override simplicity concerns.

  ---

  ### **The 90-Minute Checklist**
  **Goal**: Flag statistically unreliable results or hand back ambiguous cases for judgment.  
  **Inputs**: Data, draft, researcher interview (critical for hidden tests).  
  **Outputs**: "Believe," "Don't Believe," or "Judgment Call + Reason."

  ---

  #### **Step 1: Check for Transparency and Pre-Registration (5 mins)**
  - **Question**: Was the analysis plan pre-registered? Are all tested conditions/variables disclosed?  
  - **Red Flag**: No pre-registration AND key details missing (e.g., unreported conditions).  
  - **Sufficient Answer**: Full disclosure of tested variants. If not, stop → **"Don't Believe"**.  
  - **Why**: Hiding researcher degrees of freedom inflates Type I error. MDL requires full hypothesis description.  
  - **Theory Cost**: Drops ideal of "universal language" for practical disclosure.

  #### **Step 2: Quantify Researcher Degrees of Freedom (15 mins)**
  - **Question**: How many *reasonable* analysis choices were made? (e.g., video conditions, subgroups, covariates, outcome transforms).  
  - **Metric**: \( m = \) number of plausible hypotheses tested.  
  - **Adjustment**: Charge \( \log_2(m) \) bits to description length (equivalent to Bonferroni if p-values used).  
  - **Red Flag**: \( m \geq 4 \) AND effect survives *only* without adjustment.  
  - **Sufficient Answer**: List from researcher. If vague, assume \( m \geq 4 \).  
  - **Why**: MDL penalizes "hypothesis space size." \( \log_2(m) \) accounts for selection (formalized in uniform priors over discrete sets).  
  - **Settled**: Charging \( \log_2(m) \) is MDL-valid for finite sets. Contested if choices are continuous.

  #### **Step 3: Compute Effective Description Length (20 mins)**
  - **Question**: What is \( L(H) = \) description length of the hypothesis?  
  - **Metric**: 
    - **Parameters**: Count free parameters (\( k \)). 
    - **Structure**: Add +1 for each ad hoc element (e.g., unexpected subgroup, data-driven transform).  
    - **Forking Paths**: Add \( \log_2(m) \) from Step 2.  
    - **Total**: \( L(H) = k + \text{ad hoc elements} + \log_2(m) \) (in "parameter-equivalent units").  
  - **Red Flag**: \( L(H) \geq 5 \) for n < 100.  
  - **Sufficient Answer**: No complex math; tally from methods/draft.  
  - **Why**: Approximates MDL with parametric model class. Kolmogorov complexity uncomputable, so trade-off for practicality.  
  - **Theory Cost**: Drops invariance under language choice; assumes "lab's modeling language."

  #### **Step 4: Evaluate Fit & Predictive Power (20 mins)**
  - **Question**: Does the model compress data well? Use:  
    - **Fit**: \( L(D|H) = -\log(\text{likelihood}) \) or residual variance.  
    - **Prediction**: Held-out performance (if exists).  
  - **Metric**: Compare to null model.  
    - **Simple Test**: Improvement in AIC/BIC > 2.  
    - **Held-Out Test**: AUC, \( R^2 \), or likelihood ratio on unseen data.  
  - **Red Flag**: \( \Delta\text{AIC/BIC} < 2 \) OR no held-out test for \( L(H) \geq 5 \).  
  - **Green Flag**: Held-out test shows clear improvement (e.g., \( \Delta \text{AUC} > 0.05 \)).  
  - **Sufficient Answer**: Rough metrics suffice (e.g., "AIC improved by 10").  
  - **Why**: MDL minimizes \( L(H) + L(D|H) \). Held-out tests override simplicity concerns.  
  - **Settled**: With enough data, fit dominates; small n requires penalty (BIC ≈ MDL).

  #### **Step 5: Compare to Simpler Alternatives (15 mins)**
  - **Question**: Is there a simpler model (\( H_{\text{simple}} \)) within \( \Delta \text{AIC} \leq 2 \) or similar predictive performance?  
  - **Red Flag**: Simpler model exists AND \( L(H_{\text{simple}}) \ll L(H) \) (e.g., half the parameters).  
  - **Sufficient Answer**: Fit null model and 1-parameter alternative. If comparable, stop → **"Don't Believe"**.  
  - **Why**: Solomonoff prioritizes shorter hypotheses if fit is similar.  
  - **Contested**: "Similar fit" threshold (AIC <2 is heuristic).

  #### **Step 6: Assess Prior Plausibility (10 mins)**
  - **Question**: Is the hypothesis grounded in theory? Rate:  
    - **High**: Directly follows meta-analyses or established mechanisms.  
    - **Low**: "Ad hoc" (e.g., unexpected subgroup).  
  - **Judgment Call**: Low plausibility AND \( L(H) \geq 5 \) → **"Hand back for values debate"**.  
  - **Why**: Formal priors (Solomonoff) ignore scientific context; this injects domain knowledge.  
  - **Settled**: Not part of MDL/Kolmogorov; pragmatic add-on.

  #### **Step 7: Final Decision (5 mins)**
  - **Believe**: No red flags AND (Green flag OR \( L(H) \leq 2 \)).  
  - **Don't Believe**: Any red flag.  
  - **Judgment Call**: Conflicts (e.g., high \( L(H) \) but strong held-out performance).  
  - **Output**: One of above + 1-sentence reason.

  ---

  ### **Worked Examples**
  **Example 1: Nature Video (n=58)**  
  - **Step 1**: Not pre-registered; unreported video conditions (tried 4 total). → **Red Flag: Stop → "Don't Believe"**.  
    - *Why*: Non-disclosure fails transparency. Even if disclosed:  
  - **Step 2**: \( m = 4 \) conditions. \( \log_2(4) = 2 \) bits added.  
  - **Step 3**: \( L(H) = k + \log_2(m) = 2 \) (t-test) + 2 (forking paths) + 0 (no ad hoc) = 4.  
  - **Step 4**: Effect large, but no held-out test. → **Red Flag** (high \( L(H) \) without validation).  
  - **Step 5**: Null model not compared.  
  - **Verdict**: **Don't Believe** (transparency + complexity).  
  - *Your instinct supported, but now quantified*.

  **Example 2: Hierarchical Model (Subgroup Story)**  
  - **Step 1**: No pre-registration, but subgroups disclosed.  
  - **Step 2**: \( m = 6 \) (plausible subgroups tested). \( \log_2(6) \approx 2.6 \) bits.  
  - **Step 3**: \( L(H) = 24 \) (parameters) + 1 (ad hoc subgroup) + 2.6 = 27.6 → **Red Flag** (high \( L(H) \)).  
  - **Step 4**: Fits held-out data better than simple model → **Green Flag** (overrides complexity).  
  - **Step 5**: Simple model worse on prediction.  
  - **Step 6**: Low prior plausibility (ad hoc subgroup). → **Judgment Call**.  
  - **Verdict**: **Judgment Call** (Complexity penalty high, but predictive power strong. Trade-off between Occam and fit).  
  - *Goes against your instinct: predictive power saves complex model*.

  ---

  ### **Your Half-Baked Idea: Valid but Incomplete**
  - **"Charging \( \log_2(m) \)"**: This is MDL-correct. Formalized in **uniform average over hypotheses** (e.g., \( P(H) = 1/m \) for \( m \) options). Your intuition matches the *universal prior for discrete sets*.  
  - **Complexity Penalty vs. Data Growth**:  
    - **Settled**: In Solomonoff, prior \( P(H) \propto 2^{-K(H)} \) is *fixed*, but likelihood \( P(D|H) \) dominates as \( n \to \infty \).  
    - **Small n**: Prior (simplicity) matters most.  
    - **Large n**: Fit matters more; complexity penalty *in absolute terms* grows but *relatively* shrinks.  
    - **Implication**: Be most suspicious of:  
      - High \( L(H) \) models with small n (e.g., n < 100).  
      - Unexplored forking paths (since \( \log_2(m) \) is independent of n).  

  ---

  ### **Limitations and Honest Holes**
  1. **Language Dependence**: We use "lab's modeling language" (e.g., linear models). Cost: Biased against novel methods.  
  2. **Additive Constant**: Ignored, as theorems require n → ∞. For small n, we rely on heuristics (AIC/BIC).  
  3. **Subjectivity in \( m \)**: Requires researcher honesty. No fix without preregistration.  
  4. **Judgment Calls**: When predictive power clashes with high complexity (Example 2), values decide.  
  5. **Not Covered**: Causal claims require additional checks (e.g., ignorability).  

  **Bottom Line**: This checklist systematizes Occam's razor for small-n research. It flags garden-of-forking-paths issues, penalizes ad hoc complexity, but defers to predictive validation. Use as a first filter—not a substitute for replication.  

  > "A model should be as simple as possible, but no simpler." —Einstein (paraphrased). Your role is to enforce the first half; the lab debates the second.
