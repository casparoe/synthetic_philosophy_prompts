answer: |-
  ### Exam Question: Dynamic Inconsistency in Risk-Weighted Expected Utility

  **Background:** Recall that risk-weighted expected utility (REU) evaluates a gamble with outcomes ordered \(x_1 < x_2 < \dots < x_n\) (with probabilities \(p_1, p_2, \dots, p_n\)) as:  
  \[
  \text{REU} = u(x_1) + \sum_{i=2}^{n} [u(x_i) - u(x_{i-1})] \cdot r(P(x \geq x_i)),
  \]  
  where \(P(x \geq x_i) = \sum_{j=i}^{n} p_j\) (the decumulative probability), and \(r\) is an increasing function with \(r(0) = 0\) and \(r(1) = 1\). For this problem, assume \(u(x) = x\) and \(r(p) = p^2\).

  **Decision Problem:**  
  At stage 1, a fair coin is flipped:  
  - **Heads (probability \(1/2\))**: Receive \(\$2\), game ends.  
  - **Tails (probability \(1/2\))**: Proceed to stage 2.  

  At stage 2, choose between:  
  - **Option P**: Receive \(\$0.80\) for sure.  
  - **Option Q**: Receive \(\$3\) with probability \(1/2\) or \(\$0\) with probability \(1/2\).

  **Tasks:**  
  (i) **Computations and Preferences (8 points)**  
    (a) Compute the *ex ante* REU of the plan that selects P at stage 2.  
    (b) Compute the *ex ante* REU of the plan that selects Q at stage 2.  
    (c) Compute the REU of Option P and Option Q *at stage 2* (conditional on reaching it).  
    (d) State which plan is preferred *ex ante* and which option is preferred at stage 2.  

  (ii) **EU Comparison and Axiom Violation (6 points)**  
    (a) Explain why no expected utility (EU) maximizer (with any \(u\)) can exhibit the preference pattern in (i).  
    (b) Name the key axiom of EU theory violated here.  
    (c) Using the risk function \(r(p) = p^2\) and outcome ranks, explain why the reversal occurs.  

  (iii) **Modified Problem (3 points)**  
    Suppose the stage-1 heads outcome is \(\$0\) (instead of \(\$2\)). Recompute the *ex ante* REU for both plans and the REU for P and Q at stage 2. Does the preference reversal from (i) still occur? Explain why/why not.  

  (iv) **Anticipated Reversal and Commitment (3 points)**  
    If the agent anticipates choosing their stage-2 preferred option (but cannot commit to their *ex ante* plan), what should they do at stage 1? Does the answer change if \(r(p) = p^2\) reflects a "genuine taste" for risk rather than a belief distortion? Briefly explain.  

