  ### Model Answer  
  **Part (i): Computations and Preferences**  
  *(a) Ex ante REU for plan selecting P at stage 2:*  
  The plan yields:  
  - \(\$2\) if heads (prob \(1/2\)),  
  - \(\$0.80\) if tails (prob \(1/2\)).  
  Ordered outcomes: \(x_1 = 0.80\), \(p_1 = 0.5\); \(x_2 = 2\), \(p_2 = 0.5\).  
  \[
  \text{REU}_{\text{P-plan}} = u(x_1) + [u(x_2) - u(x_1)] \cdot r(P(x \geq x_2)) = 0.80 + [2 - 0.80] \cdot r(0.5) = 0.80 + 1.20 \cdot (0.5^2) = 0.80 + 1.20 \cdot 0.25 = 0.80 + 0.30 = 1.10.
  \]  
  *(b) Ex ante REU for plan selecting Q at stage 2:*  
  The plan yields:  
  - \(\$2\) if heads (prob \(1/2\)),  
  - If tails: \(\$0\) (prob \(1/4\)) or \(\$3\) (prob \(1/4\)).  
  Ordered outcomes: \(x_1 = 0\), \(p_1 = 0.25\); \(x_2 = 2\), \(p_2 = 0.5\); \(x_3 = 3\), \(p_3 = 0.25\).  
  \[
  \begin{align*}
  \text{REU}_{\text{Q-plan}} &= u(x_1) + [u(x_2) - u(x_1)] \cdot r(P(x \geq x_2)) + [u(x_3) - u(x_2)] \cdot r(P(x \geq x_3)) \\
  &= 0 + [2 - 0] \cdot r(0.75) + [3 - 2] \cdot r(0.25) \\
  &= 2 \cdot (0.75^2) + 1 \cdot (0.25^2) = 2 \cdot 0.5625 + 1 \cdot 0.0625 = 1.125 + 0.0625 = 1.1875.
  \end{align*}
  \]  
  *(c) REU at stage 2 (given tails):*  
  - Option P: Certain \(\$0.80\), so \(\text{REU}_{\text{P}} = 0.80\).  
  - Option Q: \(\$0\) (prob \(0.5\)) or \(\$3\) (prob \(0.5\)).  
  Ordered outcomes: \(x_1 = 0\), \(p_1 = 0.5\); \(x_2 = 3\), \(p_2 = 0.5\).  
  \[
  \text{REU}_{\text{Q}} = u(x_1) + [u(x_2) - u(x_1)] \cdot r(P(x \geq x_2)) = 0 + [3 - 0] \cdot r(0.5) = 3 \cdot (0.5^2) = 3 \cdot 0.25 = 0.75.
  \]  
  *(d) Preferences:*  
  - *Ex ante*: \(\text{REU}_{\text{Q-plan}} = 1.1875 > \text{REU}_{\text{P-plan}} = 1.10\), so prefer **plan with Q at stage 2**.  
  - At stage 2: \(\text{REU}_{\text{P}} = 0.80 > \text{REU}_{\text{Q}} = 0.75\), so prefer **P**.  
  *Reversal*: The agent prefers committing to Q *ex ante* but switches to P at stage 2.  

  **Part (ii): EU Comparison and Axiom Violation**  
  *(a) EU impossibility:* EU satisfies the *law of iterated expectations*: the *ex ante* value of a plan equals the expected value of its conditional evaluations. If the agent prefers P over Q at stage 2, the P-plan must be *ex ante* at least as good as the Q-plan under EU. Here, the Q-plan is preferred *ex ante* despite P being preferred at stage 2—a contradiction.  
  *(b) Violated axiom:* **Dynamic consistency** (implied by EU’s independence axiom).  
  *(c) Explanation with \(r(p) = p^2\) and ranks:* The concave \(r\) underweights high probabilities (pessimism). *Ex ante*, the Q-plan’s worst outcome (\(\$0\)) is diluted by the \(\$2\) outcome (ranked middle, \(P(x \geq \$2) = 0.75\)), so the jump from \(\$0\) to \(\$2\) gets weight \(r(0.75) = 0.5625 > r(0.25) = 0.0625\) for the \(\$2\)-to-\(\$3\) jump. At stage 2, only \(\$0\) and \(\$3\) remain; the jump to \(\$3\) gets \(r(0.5) = 0.25\), heavily discounting the best outcome. The \(\$2\) "buffer" ex ante makes Q attractive, but without it, Q’s risk is penalized.  

  **Part (iii): Modified Problem (\(\$0\) for heads)**  
  *Ex ante computations:*  
  - P-plan: Heads \(\$0\) (prob \(0.5\)), tails \(\$0.80\) (prob \(0.5\)). Ordered: \(x_1 = 0\), \(p_1 = 0.5\); \(x_2 = 0.80\), \(p_2 = 0.5\).  
  \[
  \text{REU}_{\text{P-plan}} = 0 + [0.80 - 0] \cdot r(0.5) = 0.80 \cdot 0.25 = 0.20.
  \]  
  - Q-plan: Heads \(\$0\) (prob \(0.5\)), tails: \(\$0\) (prob \(0.25\)) or \(\$3\) (prob \(0.25\)). Ordered: \(x_1 = 0\), \(p_1 = 0.75\); \(x_2 = 3\), \(p_2 = 0.25\).  
  \[
  \text{REU}_{\text{Q-plan}} = 0 + [3 - 0] \cdot r(0.25) = 3 \cdot 0.0625 = 0.1875.
  \]  
  *At stage 2 (same as (i)c):* REU\(_\text{P} = 0.80\), REU\(_\text{Q} = 0.75\), so prefer P.  
  *Reversal?* **No**. *Ex ante*: P-plan (\(0.20\)) > Q-plan (\(0.1875\)), and at stage 2: P (\(0.80\)) > Q (\(0.75\)). Preferences are consistent.  
  *Explanation:* With heads yielding \(\$0\), both plans share the same worst outcome. The P-plan’s jump from \(\$0\) to \(\$0.80\) gets weight \(r(0.5) = 0.25\), while the Q-plan’s jump to \(\$3\) gets \(r(0.25) = 0.0625\). The higher weight on the moderate gain in P offsets the potential \(\$3\) in Q. The "buffer" from \(\$2\) (which caused reversal in (i)) is absent.  

  **Part (iv): Anticipated Reversal and Commitment**  
  The agent should recognize that without commitment, they will choose P at stage 2 (since \(0.80 > 0.75\)), making the effective outcome: \(\$2\) (heads) or \(\$0.80\) (tails)—i.e., the P-plan. They cannot force themselves to choose Q later. Thus, they accept the P-plan with REU \(= 1.10\).  
  *Genuine taste vs. belief distortion:*  
  - If \(r\) reflects **genuine taste**, preferences are time-consistent in the moment. The agent should follow their stage-2 preference (choose P), even if it contradicts *ex ante*. No change in action.  
  - If \(r\) is a **belief distortion**, the agent might view the reversal as irrational and wish to correct it (e.g., seek commitment). However, without commitment, they still choose P at stage 2. Action is unchanged, but normative assessment differs.  

