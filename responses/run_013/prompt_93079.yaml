prompt: |-
  My friends and I have a running competition where we try to out-do each other with jokes about whatever we're studying, and I'm currently getting crushed because one of them keeps milking the trolley problem. I've been reading about population ethics and I want a joke about the repugnant conclusion — the way a bunch of individually reasonable-looking principles gang up on you until you're forced to say that some gigantic population of people whose lives are only barely worth living is somehow better than a smaller population of people living wonderfully. I don't want a generic philosophers-can't-agree gag; the punchline has to definately turn on the actual content, e.g. on how sensible each little step feels and how absurd the destination is, or on how every escape hatch you try costs you something you'd rather keep. A concrete scene helps — I keep picturing something like a slightly bored angel pitching a new universe to a deity and sweetening the deal by adding more and more souls, or a restaurant menu offering a tiny sublime portion versus a bottomless trough of gruel — but feel free to pick your own setting. It's also fine to fold in the neighbouring puzzles (the case where you merely add a bunch of happy people without making anyone worse off, or the one where you're choosing between adding a few genuinely miserable lives and a large number of only-marginally-good ones) as long as it stays funny and doesn't turn into a lecture. Please don't cite papers or drop names and dates; just work with the ideas.

  Also, jokes aside, I actually want to know where I'm on thin ice, so after the joke add a short note — a few sentences — separating the parts of this that are basically settled among people who work on it from the parts that are genuinely contested, and be upfront about anything you're unsure of instead of stating one reading as if everyone agrees. I'd also like your honest read on the joke itself: is that actually the right punchline, or did I set it up wrong? And flag anywhere the joke only works if you buy a particular contested interpretation.
