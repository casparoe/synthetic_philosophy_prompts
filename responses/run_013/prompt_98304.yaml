  Ok so I'm trying to pin down somthing for a seminar and I want your actual number, not a hedge. Here's the claim: Wittgenstien's family resemblance story, taken literally as a theory of how a word gets its extension, is correct for at least one ordinary concept -- meaning there's a term we actually use where the instances are held together by overlapping similarities, there's genuinely no feature common to all of them, and that's enough to fix what the term applies to.

  Do you buy it? Give me a credence, and break it down. I want the sub-questions you think it hangs on, a rough number for each, then how they combine. The ones I keep circling: how confident are you that for some real concept there's truly no shared feature once you push hard enough (my worry is that every supposed counterexample has a hidden functional or causal commonality we just haven't spotted yet); how confident are you that a resemblance relation can be determinate enough to do the work, i.e. that it doesn't slide into the chain problem where each link resembles the next but the two ends share nothing, leaving you either with sharp boundaries you didn't earn or with no boundaries at all; and how much does any of this even matter if rule-following considerations already make the whole idea of a word having a determinate extension look shaky?

  For what it's worth I'm around 0.65 and a colleague I argue with is down at 0.2. Tell me which sub-question you think we're actually disagreeing about, and which one you're least sure of yourself and what would move it. I don't need a reading list, just the number and the guts of the reasoning.
