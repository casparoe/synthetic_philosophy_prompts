prompt: |-
  I've got no philosophy training, just a lot of opinions and a long commute, and I keep going in circles on this. Please act like a political philosopher who's spent years on religion-and-state questions, and before you commit to anything, brainstorm the cases on your own and write out a couple of candidate rules side by side. Then tell me what principle actually fits my gut verdicts, if any does.

  A state school says its teachers can't wear a headscarf or a cross or a kippah while they teach. Fine by me. The teacher is speaking for the state.
  The same school says the students can't wear a headscarf. Not fine. She's not the state, she's fourteen and trying to get through maths.
  A public hospital tells its nurses to take theirs off. Fine, same reason as the teacher.
  The same hospital tells a patient to take hers off. Not fine, not even close.
  A town votes to ban minarets on mosques. Not fine. I can't get past the feeling that it's a rule aimed at one group even though it's written to apply to everyone's buildings.
  But a law that says you have to show your face in a bank, a courthouse, on a bus — fine. And I realize that sits badly next to the student one.
  A school that serves no meat at all: fine, everybody eats the same lunch. A school that serves pork and shrugs when a Muslim or Jewish kid says there's nothing they can eat: not fine.
  Now the one I keep flipping on. A town passes a rule that everyone's hands have to be bare and visible inside public buildings — they had a pickpocketing problem and the cameras can't tell whose hands are whose. There's a small religious group near me whose practice is to keep their hands gloved at all times, indoors, even while eating. Half of me says the rule is fine, it's about hands and cameras, not about religion. The other half says I've just built a minaret ban and stapled a security excuse to it.

  My own attempt at the rule: the state can be as strict as it likes about its own voice and its own employees, but it should bend for ordinary people going about their lives, unless it has a reason that has nothing to do with religion — knowing who's in the building, not poisoning anyone. Does that survive my list? If it doesn't, is there a better one that saves everything, and what does the simpler version cost me — which of my verdicts do I have to give up? State the rule precisely, say which case is doing the work in each part of it, and then tell me what it predicts for a case I haven't listed, like a school that bans headscarves only during gym class, or a private employer instead of the state.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're grappling with where to draw the line between state authority and religious expression. The examples they provided show clear patterns but also some contradictions—like being okay with face-covering bans in banks but not for students wearing headscarves. 

  Hmm... Their gut reactions suggest they intuitively separate state actors (teachers, nurses) from private individuals (students, patients). But the minaret ban and glove rule expose cracks in that framework—both involve ordinary people, yet they oppose one and feel torn on the other. The glove case is particularly sticky because it pits neutral security rules against religious practice. 

  I notice they keep circling back to intent vs. impact. The minaret ban feels targeted ("aimed at one group"), while the glove rule seems genuinely functional ("about hands and cameras")—but they worry it's a slippery slope. That tension between purpose and effect is key here. 

  Their self-drafted rule ("state can be strict with employees but bend for citizens") almost works but stumbles on the glove case. Why? Because the glove ban *is* a neutral security rule affecting ordinary people, yet it burdens religion. So we need sharper tools: maybe "undue burden" balancing for citizens, and strict neutrality for state symbols. 

  Also lurking: unspoken priorities. They care about fairness (school lunches), preventing covert discrimination (minarets), and practicality (bank IDs). But they haven't articulated how to weight religious harm vs. state interests. That's where proportionality enters—like asking if glove-wearing *actually* hinders security, or if alternatives exist. 

  For new cases: A gym headscarf ban? If safety-driven (e.g., choking risk), fine under neutrality; if arbitrary, not. Private employers? They'd likely get less leeway than the state since they're not "speaking for the public." 

  Biggest insight: Their instincts align with liberal pluralism—state neutrality plus accommodation unless disproportional. But they need machinery to operationalize it. The glove case remains messy because security claims can mask bias; that's why evidence matters ("cameras can't tell" better be real). 

  ...Wait, did they imply the town *invented* the pickpocketing pretext? That'd change everything. But without proof, we assume good faith and weigh burdens. Classic philosopher's headache.
answer: |-
  Based on your clear, consistent gut reactions and the friction points you've identified, let's diagnose the underlying principle. Your intuition leans towards **liberal pluralism with a strong emphasis on state neutrality and avoiding disproportionate burdens on religious practice**, particularly for non-state actors. Let's break it down:

  **Brainstorming Candidate Rules:**

  1.  **Rule A (Strict Role-Based Neutrality):**
      *   *The State:* Must be strictly neutral in its *own* expression. State employees acting officially cannot display religious symbols. State operations must be secular.
      *   *Private Individuals Interacting with the State:* Can freely practice religion unless the state demonstrates a *compelling, non-religiously-targeted interest* (e.g., security, health/safety, core educational function) that *cannot be achieved by less restrictive means*.
      *   *State Actions Affecting Private Groups:* Laws/rules of general application are presumed valid, *unless* they disproportionately burden a specific religion *or* were enacted with discriminatory intent, even if facially neutral.

  2.  **Rule B (Accommodation with Proportionality):**
      *   *State Employees:* Can be required to refrain from religious expression as part of their official role to ensure state neutrality and equal treatment of all citizens.
      *   *Individuals Using State Services (Students, Patients, Public):* Have a strong presumption of religious freedom. The state can only restrict this freedom if it proves:
          *   A **pressing and substantial objective** (e.g., safety, security, operational necessity).
          *   The restriction is **proportionate** (minimal impairment of religious freedom to achieve the objective).
          *   The rule is **neutral and generally applicable**, not targeting religion.
      *   *Laws Affecting Religious Groups/Structures:* Must pass strict scrutiny: serve a **compelling governmental interest** and be **narrowly tailored** to achieve that interest, with no less restrictive alternatives available.

  **Analyzing Your Gut Verdicts:**

  *   **Teachers/Nurses (State Employees):** Both Rule A and B align perfectly. The state controls its own voice and appearance.
  *   **Students/Patients (Private Individuals Using Services):** Both Rules align. The state must have a strong, non-targeted reason to restrict them. "Just being in a state building" isn't enough.
  *   **Minaret Ban:** Rule A flags the disproportionate burden/discriminatory intent. Rule B demands a compelling interest and narrow tailoring, which a general architectural ban likely fails. Your verdict aligns with both.
  *   **Show Face in Bank/Courthouse/Bus:** Both Rules *potentially* allow this. Security/identification is a compelling/pressing objective. The key is *proportionality* – is showing the face the *least restrictive* way to achieve security in *these specific, high-risk contexts*? You find it fine, suggesting you accept security as compelling enough here and showing face as proportionate.
  *   **School Lunches:**
      *   No Meat: Neutral rule, minimal burden (everyone eats same, no one excluded), fine under both Rules.
      *   Only Pork: Disproportionate burden on specific religions (effectively excludes them) with no compelling justification ("shrugs" implies no attempt at accommodation/neutral option). Not fine under both Rules.
  *   **Gloved Hands Rule:** This is the friction point.
      *   *Rule A:* If the rule is genuinely about security (non-targeted), generally applicable, and security is a compelling interest, it might be acceptable, *unless* the burden on the gloved group is *so severe* (violating core practice) as to be disproportionate, *or* if less restrictive alternatives exist (e.g., higher-res cameras, targeted monitoring in problem areas). Your "half fine" side aligns with this if security is genuine/proven.
      *   *Rule B:* Requires proving the security objective is *pressing and substantial* (was there a *specific, severe* pickpocketing problem linked *specifically* to gloves? Or is it speculative?). Crucially, it demands *proportionality*: Is a *total ban* the *least restrictive means*? Could targeted security, exemptions with alternative screening, or better tech work? Your "half not fine" side aligns with this skepticism – it feels like a "minaret ban with a security excuse" precisely because the *proportionality* or *genuine necessity* is questionable, potentially masking targeting.

  **Your Draft Rule & Refinement:**

  *   Your draft: *"The state can be as strict as it likes about its own voice and its own employees, but it should bend for ordinary people going about their lives, unless it has a reason that has nothing to do with religion — knowing who's in the building, not poisoning anyone."*
  *   **Strengths:** Captures the core state-employee vs. private citizen distinction. Identifies valid secular reasons (security, health).
  *   **Weaknesses:** "Bend" is vague. "Nothing to do with religion" is too narrow (rules *can* incidentally affect religion if truly neutral/necessary). Doesn't address *proportionality* or *disproportionate burden* – the core issue in the glove case and minaret ban. Doesn't explicitly handle the school lunch case (which is about equal access, not direct restriction).
  *   **Does it survive your list?** Mostly, *except* the gloved hands case. It allows the ban (security reason "nothing to do with religion"), but your gut is conflicted because the *burden* is severe and the *necessity* might be flimsy. Your rule doesn't have the tools to handle this conflict.

  **The Principle Fitting Your Gut: Liberal Neutrality with Proportionality Assessment for Private Individuals**

  Based on your reactions, the principle is:

  > **The state must maintain strict neutrality in its own official expression and operations, including the appearance and conduct of its employees acting in their official capacity. For private individuals interacting with the state (using services, in public spaces subject to state rules), the state must accommodate religious practice unless it can demonstrate that a restriction:**
  > **1.  Serves a genuine, pressing, and substantial secular objective (e.g., compelling security interest, critical health/safety, core educational function);**
  > **2.  Is the least restrictive means of achieving that objective (proportionality); and**
  > **3.  Is neutral and generally applicable in both intent and effect.**

  **How This Rule Handles Your Cases:**

  1.  **Teachers/Nurses (State Employees):** Covered by "strict neutrality in own operations." Fine. *(Principle Part 1)*
  2.  **Students/Patients (Private Individuals):** Strong presumption for accommodation. Wearing symbols serves no pressing state objective (security/health not implicated by mere wearing). Not fine to ban. *(Principle Part 2 - Fails 1 & 2)*
  3.  **Minaret Ban:** Fails neutrality in effect (disproportionate burden on Muslims), likely lacks a *compelling* justification tied to minarets specifically (aesthetics? noise? unlikely pressing/substantial enough). Not fine. *(Principle Part 2 - Fails 1 & 3)*
  4.  **Show Face (Bank/Court/Bus):** Security/ID is a *pressing, substantial objective* in these specific contexts. Showing face is likely *proportionate* (least restrictive?) *if* truly necessary for security *in that specific place* (e.g., maybe less critical on a bus than in a courthouse). Fine. *(Principle Part 2 - Meets 1 & likely 2/3)*
  5.  **School Lunches:**
      *   *No Meat:* Neutral rule. Minimal burden (accommodates more, burdens none severely). Fine. *(Not really a restriction, but aligns with spirit)*
      *   *Only Pork:* Creates a disproportionate burden (exclusion) on specific religions. No pressing secular objective justifies *only* serving pork (nutritional needs met other ways). Fails neutrality in effect. Not fine. *(Principle Part 2 - Fails 1 & 3)*
  6.  **Gloved Hands Rule:** The crux.
      *   Security *can* be a pressing objective.
      *   **But:** Is the pickpocketing problem *substantial and specifically linked to gloves*? Is a *total ban* the *least restrictive means*? Could cameras be upgraded? Could gloves be temporarily removed for security checks in sensitive areas instead of banned everywhere? Could the religious group be accommodated (e.g., distinctive gloves)? If the ban is disproportionate (no less restrictive alternative) *or* if the security claim is flimsy/pretextual (making the effect non-neutral), it's not fine. Your gut conflict reflects the need to scrutinize the *genuineness*, *substantiality*, and *proportionality* of the secular claim. *(Principle Part 2 - Hinges on rigorous assessment of 1 & 2)*

  **Predictions for New Cases:**

  *   **School Bans Headscarves Only During Gym Class:**
      *   *Analysis:* The school claims a pressing safety objective (choking hazard, interference with equipment). Is this genuine and substantial? Is a *ban* the *least restrictive* way? Could secure under-scarves, specific gym headgear, or alternative activities suffice?
      *   *Prediction:* You'd likely find it **fine ONLY IF** the safety concern is proven specific to gym and no less restrictive alternative exists. If it seems arbitrary or alternatives exist, you'd find it **not fine**. The rule demands proof of necessity and proportionality.
  *   **Private Employer (e.g., retail store) Bans All Religious Headwear:**
      *   *Analysis:* Private employers generally have more leeway than the state. Your principle focuses on *state* action. However, many jurisdictions have laws prohibiting religious discrimination *in employment*, requiring employers to accommodate unless it causes "undue hardship" (a similar, though often weaker, proportionality test).
      *   *Prediction Based on Your Gut:* You might feel conflicted. The employer isn't "the state," so your core principle doesn't directly apply. However, your concern for individuals "going about their lives" suggests you'd likely lean towards **not fine** unless the employer can show a *genuine, significant* operational/safety reason specific to headwear (e.g., machinery hazard) that cannot be accommodated. Your gut probably extends the "proportional burden" logic beyond just state actions to important areas like employment. The simpler version of your rule ("state bends for ordinary people") doesn't cover this directly, but the refined principle's *logic* (assessing burden vs. justification) fits.

  **The Cost of Simplicity:**

  A simpler rule like "State employees = strict, everyone else = free, unless security/health" *costs you* the ability to resolve the **gloved hands dilemma** and potentially the **gym headscarf ban**. It lacks the crucial tools to:
  *   Weigh the *severity of the burden* on religion.
  *   Assess the *genuineness and strength* of the state's secular claim.
  *   Demand that the state use the *least restrictive alternative*.
  *   Catch rules that are *facially neutral but discriminatory in effect or application* (like the minaret ban or potentially the glove rule if pretextual).

  Without proportionality and scrutiny of genuine necessity, the simple rule risks allowing the state to use flimsy or overly broad "secular" justifications to effectively ban disfavored practices, which your gut rebels against in the minaret and glove cases.
