answer: |-
  ## The Radius of Doubt

  Rain lashed the suspension cables of the newly renovated Ainsworth Viaduct, drumming a frantic rhythm on Anya Sharma’s hard hat. Inside the site office’s fug of damp wool and stale coffee, condensation blurred the panoramic window overlooking the skeletal structure. Anya traced a stress calculation on her tablet, the numbers crisp and comforting. Bolt torque: verified. Girder alloy composition: certified. Weld integrity: ultrasonically tested. Each piece clicked into place, a chain of certainty leading inexorably to one conclusion: Safe. Tomorrow, the first trains in decades would cross.

  Ben Carter, her project manager, clapped a hand on her shoulder. "Ticking all the boxes, Sharma? Ready for the final sign-off?" Ben was pragmatism personified, sleeves perpetually rolled up, faith resting in procedure and proven data.

  "Nearly," Anya murmured, her gaze drifting to the small, brushed-steel device on the cluttered desk – her ‘Flicker’. Officially, the Counterfactual Insight Generator. Unofficially, the doubt machine. A gift from a physicist friend, fascinated by epistemology. One lens for your eye, a dial on the side. Dial up the ‘radius’, see what *you* would believe if reality had wobbled just that much further off-course.

  "Still messing with that bloody thing?" Ben chuckled, pouring tea. "Thought you’d proved its readings are… well, flickery. Doesn’t track proper knowledge."

  "It doesn’t show *truth*, Ben," Anya corrected, picking it up. It felt cool, heavy with implication. "It shows *my* belief’s sensitivity. How much reality has to shift before *I’d* get it wrong." Her brother’s face flashed in her mind – a structural failure a decade ago, reports full of individually verified ‘safe’ components. A chain that broke.

  She slipped the Flicker over her eye. The site office snapped into sharp, augmented focus. Ben became a wireframe outline beside a glowing thermal mug. She focused her thoughts: *The viaduct is structurally sound for reopening.*

  With a deep breath, she turned the dial. A tiny click. Radius: 0.1 – negligible difference. The augmented vision shimmered. Ben’s outline flickered slightly. Her *belief* in the viaduct’s safety remained solid, anchored. A world where a bolt was fractionally under-torqued? Still safe.

  Click. Radius: 0.3 – plausible variations. The shimmer intensified. Ben vanished momentarily, replaced by static. Her belief faltered, flickered… but held. A world where the alloy certification had a minor clerical error? She’d likely still trust the paperwork, trust the chain. Still sign off.

  Click. Radius: 0.5 – significant divergence. The office dissolved into chaotic geometric patterns. When it resolved, she saw *herself* – a ghostly overlay – confidently nodding. But superimposed over it was a vision of the viaduct… with a hairline fracture snaking through a crucial weld she *knew* was perfect. The fracture wasn’t real, but the *belief* was. In this counterfactual, she’d believe the weld was fine, based on flawed NDT results she’d accepted. Her ghost-self declared: *Safe.* The conviction felt absolute, chillingly real. Yet the fracture pulsed, a silent scream.

  She ripped the Flicker off, heart pounding. Rain streaked the window like tears.

  "Alright, what did it show?" Ben asked, concerned now. "You’ve gone pale."

  "It showed…" Anya swallowed. "It showed me signing off. Believing it utterly. In a world where… where the weld might have failed inspection, but the report was wrong. I’d still believe the chain. I’d still know the bolt torque, the girder spec… and conclude 'safe'."

  Ben frowned. "But that’s *not* this world. We *have* the correct report. Our chain *is* solid. Each link is verified, Sharma. Your gadget shows hypotheticals, not reality. You *know* the weld is good. Therefore, you know the bridge is safe. It’s simple logic!"

  "Is it?" Anya leaned forward, tapping her tablet, bringing up the inspection logs. "I know Link A: Bolt torque is within spec. I know Link B: Girder alloy matches certification. I know Link C: Weld passed ultrasonic test. Each one, individually, tracks the truth. Twist the Flicker’s dial a little, and I’d still believe each of those specific things under minor variations. They’re robust."

  "Exactly!" Ben spread his hands. "Chain them together! A, therefore B, therefore C, therefore Safe. Closure. Basic reasoning."

  "But twist the dial further," Anya insisted, her voice low, urgent, "and I see a world where I *still* believe Link A, Link B, *and* Link C… but Link C is *wrong*. The belief in the weld’s integrity *doesn’t track* the truth at that radius. The chain *looks* complete from the inside, but one link is false. And because I believe each link individually, I believe the conclusion… disastrously."

  Ben sighed, running a hand through his hair. "Anya, you’re chasing ghosts. That lens shows you *could* be wrong in some other, wildly different universe. It doesn’t mean you *are* wrong *here*. We have the evidence. Right *now*. Verifiably."

  "Does the evidence *include* the fact that my belief in the conclusion *doesn’t* track the truth beyond a certain radius?" Anya countered. "That while each step seems solid close-up, the whole edifice of my certainty about 'safe' crumbles if reality shifts just a bit more than we think it has? That’s what the Flicker shows. The tracking… it’s not uniform. It depends on *how much* things could have gone wrong."

  Outside, the wind howled around the viaduct’s towers. Tomorrow, hundreds would trust her signature. The weight was crushing.

  "So what?" Ben asked, exasperated. "You can’t sign off? Based on a gadget showing you nightmares? The Mayor’s ribbon-cutting is booked! The press! Delaying costs a fortune. We’ve done everything by the book."

  Anya stared at the Flicker. She thought of her brother. She thought of the ghostly overlay of herself, so confident over a fracture she couldn't see. The chain of knowledge felt strong, link by verified link. But the Flicker showed the chain wasn't anchored to the final truth in the same way. It could drift.

  "I need to see the primary NDT data files again," she said, her voice steadier than she felt. "Not the summary report. The raw waveforms from the ultrasonic test on Node G-7. And I want Peters from Materials here first thing. I want to watch him cross-check the alloy batch against the cert myself. Again."

  Ben groaned. "Anya, that’ll take hours! It’s redundant! You *know* it’s been done!"

  "I know the reports say it’s been done," she corrected, picking up the torque wrench calibration log, another link in the chain. "But at Radius 0.5… I saw myself holding a report just like this, believing it just as fiercely." She met his frustrated gaze. "I can’t *know* the conclusion tracks, Ben. Not like I thought I could. The Flicker showed me the gap. I can only re-check the links. Meticulously. And hope the radius of this reality… is small enough."

  Ben stared at her, then at the relentless rain. He saw the haunted look in her eyes, the ghost of her brother’s tragedy, the stubborn set of her jaw. He saw the impracticality, the cost. He also saw the bridge, stark against the storm.

  "Bloody gadget," he muttered, grabbing his raincoat. "Alright. Peters won't be happy. And you owe me a *very* large whisky after this kerfuffle. But… fine. We’ll re-check G-7. Raw data. Point by point." He headed for the door, shaking his head. "Just… logic, Sharma. It *should* be enough."

  Anya watched him go, then looked down at the Flicker. She didn’t put it back on. Some visions, once seen, couldn’t be unseen. The chain of knowledge felt strong, link by verified link. But the Flicker had shown her the chain wasn't anchored to the final truth in the same unshakeable way. It could drift. And knowing *that* changed everything. She picked up her phone to call Peters, the rain a constant reminder of the weight waiting outside, and the fragile, radius-dependent nature of certainty.
