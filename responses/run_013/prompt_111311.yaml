prompt: |-
  A friend of mine who teaches moral philosophy has, over the years, ruled on a series of cases I have put to her, and I should like to know what she will say about one more. She holds that it is quite in order to act on a doctor's word about which of two drugs is safer, or on a sommelier's word about which wine is better, without having judged the matter for herself. She holds that it is not in order for a grown woman of ordinary intelligence to act on a friend's word that a particular joke is cruel, or on a colleague's word that an advertising campaign is dishonest; on such questions, she says, one must see it for oneself. Yet she thinks it perfectly proper that a six-year-old should take her mother's word that hitting her brother is wrong.

  Now I want to ask her about a character in my current book: a nurse of full competence and ordinary conscience who, on a night when the ward is so short-staffed that she has seconds rather than minutes to decide, must choose whether to act on a senior doctor's judgment that a family's wishes should be overridden. She has no time to reach her own view; she can act only on his.

  What will my friend say the nurse ought to do, and what rule is she in fact running — that testimony is acceptable in non-moral matters always and in moral matters only where the recipient cannot judge for herself at all, that it is acceptable wherever she cannot judge readily, whether from incapacity, inexperience, or want of time, that it turns on expertise rather than on domain, or something else? I should like your best guess, the rival rules that fit her earlier verdicts equally well, and the further case that would force her to choose between them.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is presenting a puzzle about their friend's moral philosophy stance on relying on testimony in different scenarios. The friend seems to have a nuanced position: it's okay to trust experts on non-moral matters (like doctors about drugs) but not on moral matters (like whether a joke is cruel), except for children who can trust parents on moral issues. Now there's a nurse in a time-pressured situation needing to decide whether to follow a doctor's judgment about overriding family wishes.

  Hmm, I need to understand the underlying principles here. The friend clearly distinguishes between moral and non-moral domains for testimony acceptance. But there are exceptions - children get a pass on moral testimony from parents. So domain matters, but capacity to judge also seems important. The nurse case introduces a new variable: time pressure preventing personal judgment in a moral situation.

  Let me break down the patterns in the friend's existing positions:
  1. Non-moral expertise: Always acceptable to defer (doctor/sommelier)
  2. Moral matters: Adults must judge personally (joke cruelty/ad campaign)
  3. Moral matters for children: Can defer to parents (hitting brother)

  The nurse case sits at the intersection of moral domain + adult + incapacity (due to time). This is new territory. 

  I think the most consistent position would be that testimony is acceptable when the recipient cannot reasonably judge for themselves, regardless of domain. For children it's developmental incapacity; for the nurse it's situational incapacity (time pressure). This maintains the spirit of "must see for oneself" when possible, but allows deference when judgment isn't feasible.

  The rival interpretation could be that only certain incapacity types count - like permanent cognitive limitations rather than temporary constraints. But that seems arbitrary given the friend accepts children's temporary limitations.

  To force a choice between these interpretations, we could propose a case of an adult with temporary cognitive impairment (say, concussion) needing moral judgment. If the friend allows testimony there, it confirms the "inability principle" over strict domain separation. If not, it suggests moral testimony is forbidden to adults regardless of circumstance.

  The nurse case is beautifully constructed because it isolates the time-pressure variable while keeping all other factors constant. I suspect the friend will approve the nurse's deference, as the alternative (requiring personal judgment when impossible) would be unreasonable. This would reveal that the operative principle is about feasible judgment rather than moral/non-moral distinction per se.

  The user seems genuinely curious about philosophical consistency, not just seeking an answer. They're testing boundaries of a moral framework. The literary context (book character) suggests they also care about realistic ethical dilemmas. I should address both the immediate prediction and the underlying rule structure they're probing.
answer: |-
  Based on your friend's established positions, here's the most consistent prediction, the rival interpretations, and a test case:

  1.  **Prediction for the Nurse Case:** Your friend will say the nurse **ought to act on the senior doctor's judgment.**

  2.  **The Rule She Is Likely Running:** **Testimony is acceptable when the recipient lacks the *capacity* (due to immaturity, incapacity, or *severe constraint*) to form a reliable judgment *at the time the decision is required*, regardless of the domain (moral or non-moral).**

      *   **Why this fits:**
          *   **Non-moral (Doctor/Sommelier):** Acceptable because the recipient *lacks the expertise* (a form of incapacity) to judge reliably.
          *   **Moral - Adult Rejection (Joke/Campaign):** Unacceptable because the adult *has the capacity* (ordinary intelligence, time) to form their *own* moral judgment. The rule emphasizes *seeing it for oneself* when capable.
          *   **Moral - Child Acceptance (Hitting Brother):** Acceptable because the child *lacks the developed moral capacity* to fully grasp the wrongness independently.
          *   **Nurse Case:** The nurse, while an adult of ordinary conscience, *lacks the capacity to form her own judgment due to the severe time constraint* ("seconds rather than minutes"). This mirrors the child's lack of capacity (developmental vs. situational). She *cannot* "see it for herself" *at that moment*. Therefore, deferring to the senior doctor's judgment becomes the only feasible and acceptable course of action.

  3.  **Rival Rules Fitting Earlier Verdicts Equally Well:**
      *   **Rival Rule 1 (Domain + Capacity):** Testimony is always acceptable in non-moral matters when expertise exists. In moral matters, testimony is *only* acceptable where the recipient *fundamentally* lacks the capacity to judge *ever* or *as a matter of course* (like a child), but *not* for temporary constraints (like time pressure).
          *   *Fits:* Non-moral (yes), Moral-Adult (no - they have fundamental capacity), Moral-Child (yes - lacks fundamental capacity).
          *   *Nurse Prediction:* Likely **not acceptable**, as the nurse has fundamental capacity; the time pressure is temporary/situational, not a core incapacity.
      *   **Rival Rule 2 (Readily Ascertainable):** Testimony is acceptable wherever the truth is not readily ascertainable by the agent *at the time*, whether due to incapacity, inexperience, lack of expertise, *or* lack of time/resources.
          *   *Fits:* Non-moral (yes - requires expertise/not readily ascertainable), Moral-Adult (no - readily ascertainable with reflection), Moral-Child (no - *not* readily ascertainable for child), **but wait...** This rule would likely *reject* the child case as testimony *should* be acceptable because the child *can't* readily ascertain it. To fit the child case, it needs refinement: "...or where the agent is a child."
          *   *Nurse Prediction:* **Acceptable** (truth not readily ascertainable due to time).
      *   **Rival Rule 3 (Expertise vs. Direct Perception):** Testimony is acceptable when the judgment requires specialized *expertise* (medicine, wine) but not when it requires *direct moral perception* (seeing cruelty, dishonesty). Children are a special case exempt from needing direct moral perception initially.
          *   *Fits:* Non-moral (yes - expertise), Moral-Adult (no - direct perception needed), Moral-Child (yes - exempt).
          *   *Nurse Prediction:* **Ambiguous.** Overriding family wishes *could* be seen as requiring medical expertise (prognosis, futility) *or* as a core moral judgment about autonomy/beneficence. If the former, acceptable; if the latter, not acceptable. Leans towards **not acceptable** if the "dishonest campaign" analogy holds.

  4.  **The Further Case to Force a Choice (between the Likely Rule and Rival Rule 1):**
      *   **The Case:** An intelligent adult with severe, *temporary* amnesia (lasting a few hours) is told by a trusted friend that a specific action they are about to take (e.g., revealing a secret they've momentarily forgotten is sensitive) would be a betrayal. They have no time or capacity to reconstruct the context or reason about the morality independently before acting. Should they trust their friend's moral testimony and refrain?
      *   **Why it Forces a Choice:**
          *   **Likely Rule (Capacity/Constraint at Time):** Would say **YES, trust the friend.** The adult *lacks the capacity* to form a reliable moral judgment *at that specific time* due to the temporary amnesia, analogous to the nurse's time pressure or the child's immaturity.
          *   **Rival Rule 1 (Domain + *Fundamental* Capacity):** Would likely say **NO, do not trust the testimony.** The adult possesses the *fundamental* capacity for moral judgment; the amnesia is a temporary constraint, not a core incapacity like childhood. They must try to judge, even if poorly, just like the adult with the joke/campaign. Deferring on core moral judgments is impermissible for fundamentally capable adults.
      *   **Outcome:** Your friend's verdict here would clearly distinguish whether the acceptability of moral testimony hinges on the *situational ability to judge at the moment of action* (Likely Rule) or on the *agent's inherent, fundamental capacity* regardless of temporary constraints (Rival Rule 1).

  **Conclusion:**

  The most philosophically consistent extension of your friend's principles, emphasizing the requirement to "see for oneself" *when capable* and permitting reliance on others *when incapable*, points towards her approving the nurse's reliance on the doctor's judgment. The operative rule focuses on the agent's **epistemic capacity at the time of decision**, overriding the moral/non-moral distinction when that capacity is severely constrained. The amnesia case provides the clearest test to confirm if "capacity at the time" or "fundamental capacity" is the key factor.
