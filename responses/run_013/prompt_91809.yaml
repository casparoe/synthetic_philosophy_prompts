  Ok, I'm building a set of philosophy prompts for a project and this one has to be a joke, and I want it about Parfit's teletransporter. But not the vanilla version everyone's heard — I want it to turn on the branch-line case, i.e. the version where the scanner makes the replica on Mars and doesn't destroy you, so theres still an original standing on Earth and a brand new person on Mars with all your memories. The reason I want that one is it's where the whole thing gets uncomfortable: the Mars person gets built from exactly the same blueprint as in the ordinary case, so if you're happy calling him 'me' when the machine vaporised you on the way out, you seem stuck calling him 'me' in the branch-line case too, even though you're right there on Earth complaining about the weather. And if you refuse to call him 'me' in the branch-line case, you've basically admitted the ordinary teletransporter is a fancy suicide booth. I want the joke to trade on that squeeze, or on the no-further-fact claim, not just on 'haha, machines copy people'. It should be funny to someone who's actually read Parfit — if they hear it and think I've never read Reasons and Persons, I've blown it. Short enough to tell out loud at a party. And if this can't actually be made funny without butchering his view, say so instead of forcing it, I'd rather know that up front. When you hand me the joke, add a short note on which parts of Parfit's position it leans on and where it plays fast and loose with him, including whether any of that is a contested reading rather than something he plainly says.
