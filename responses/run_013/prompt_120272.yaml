prompt: |-
  I'm a philosophy PhD student preparing to interview a guest for our department's podcast. She defends a modest positive rate of pure time preference — roughly, that it can be rational to give a fixed increment of welfare less weight merely because it occurs later — and she meets the usual spatial-analogue objection by arguing that time, unlike space, is the dimension along which agency and deliberation are located. Please draft the questions I should put to her, aimed where the literature actually presses: I want to draw out whether her agency-based defense privileges the agent's own present moment or the present as such; whether it tacitly presupposes that the present is metaphysically privileged, and what becomes of it if all times are equally real; whether it licenses discounting other people's future welfare and not merely one's own; and what separates the bias she permits from arbitrary indexical biases, such as caring less about whatever happens to fall on a given weekday. For each question, include the follow-up I should use if she gives the answer she is most likely to give. Format the reply as exactly five numbered items, one to two sentences each, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a philosophy PhD student preparing for a podcast interview with a scholar who defends a modest positive rate of pure time preference (PPTP). This position argues that it's rational to value future welfare less just because it occurs later, and the guest uses an agency-based defense against the spatial analogy objection. 

  The user wants focused questions targeting key pressure points in the literature: whether the agency argument privileges the agent's own present moment or the present universally, if it assumes metaphysical privilege of the present, how it handles discounting others' welfare, and how it avoids arbitrary indexical biases like weekday-based discounting. They also want likely follow-ups prepared.

  Hmm, this requires precision - the questions must cut straight to conceptual tensions without getting lost in preamble. The agency-centered justification seems vulnerable on several fronts: If agency grounds PPTP, does it extend to others' futures? If the present is merely experientially privileged in deliberation, how does that avoid arbitrariness? 

  I'll structure exactly five numbered Q&A pairs as requested. First question tackles the self/universal present distinction - crucial because her whole defense hinges on agency's temporal nature. Follow-up probes consistency if she leans toward the experiential view. 

  Second question forces confrontation with eternalism (all times equally real). Her response will reveal if agency arguments secretly rely on presentism. Follow-up pushes on whether deliberation's structure can ground normativity without metaphysical backing.

  Third question tests interpersonal application - a major concern since PPTP often appears in policy ethics. Follow-up challenges the symmetry if she denies extending discounting to others.

  Fourth question targets indexical arbitrariness, comparing time discounting to irrational biases. Follow-up presses whether mere deliberative salience suffices for justification.

  Final question zeroes in on the "modest" qualifier - how her view avoids sliding into stronger discounting. Follow-up questions the principled boundary if she appeals to instrumental rationality.

  Each follow-up anticipates her most probable defense to escalate dialectical pressure. Keeping sentences tight to respect the two-sentence limit per item while packing philosophical punch.
answer: |-
  Here are five interview questions with follow-ups targeting key issues:

  1.  Does your agency-based justification for discounting future welfare privilege the agent's own *current* moment of deliberation specifically, or does it extend to privileging the "present" as such for any deliberator at any time?  
      *If she says it privileges the agent's own current moment:* Doesn't this collapse pure time preference into a form of agent-relative indexical bias, akin to spatial egocentrism, which your argument aimed to avoid?

  2.  Your argument relies on time as the dimension of agency and deliberation. Does this presuppose a metaphysically privileged present, or can it hold even if eternalism is true (all times are equally real)?  
      *If she says it doesn't presuppose a metaphysically privileged present and works with eternalism:* How can the *experience* of deliberation occurring at a specific temporal location ground a normative reason for discounting if that location isn't fundamentally different ontologically?

  3.  Does your justification for a rational pure time preference apply only to discounting one's *own* future welfare within personal deliberation, or does it also license an agent discounting the future welfare of *other people*?  
      *If she says it applies only to one's own future welfare:* How does this distinction avoid the charge that your view permits a problematic form of temporal parochialism for the self, while rejecting analogous spatial parochialism towards others?

  4.  How does your agency-based defense distinguish the time bias you endorse from other structurally similar, yet intuitively irrational, indexical biases – like assigning less weight to welfare simply because it occurs on a Tuesday?  
      *If she argues time's unique link to agency/deliberation makes the difference:* Isn't the deliberative salience of "now" contingent and perspectival in a way parallel to the salience of "here" or "Tuesday," making the normative force seem equally arbitrary?

  5.  You describe the permitted time preference as "modest." What principle, inherent to the agency justification itself, sets the limit on this rate and prevents it from being arbitrarily strong?  
      *If she appeals to instrumental rationality or coherence over time:* Doesn't this instrumental constraint effectively do the normative work, potentially rendering the "pure" time preference component explanatorily redundant or unjustified in itself?
