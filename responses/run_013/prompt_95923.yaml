  The tax office refusal is perfect for showing A's institutional dependence vs. B's functional view. For racial classification, I'll use a mixed-race person rejected by both communities to stress how categories outlive their original rules. The birth certificate conflict should highlight how B sees self-identification as constitutive while A requires institutional ratification.

  Important to avoid named theories - this isn't about Searle vs. Hacking but core ideas. And those "give ground" moments: maybe A admitting some social facts emerge without design, B conceding not all feedback loops are equally stable. Ending with their meta-disagreement about whether "construction" explains or obscures will tee up deeper club discussion.

