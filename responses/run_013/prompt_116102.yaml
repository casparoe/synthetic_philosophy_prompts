  ## Office of the Dean: Enhanced Admissions Transparency Initiative  
  *Frequently Asked Questions Regarding the New Holistic Admissions Reporting Framework*

  **Q: Why has the university stopped publishing overall admission rates by gender?**  
  A: Following careful statistical consultation, we’ve determined that aggregate admission rates are fundamentally meaningless—akin to averaging rainfall in deserts and rainforests. Our data clearly shows women are admitted at *higher* rates than men in 14 of 15 departments. Publishing the overall rate (which, regrettably, showed a slight historical advantage for men) only invites misinterpretation by those unacquainted with Simpson’s paradox. We believe in transparency where it illuminates, not obscures. Henceforth, only departmental rates will be released.  

  **Q: Isn’t this cherry-picking the statistic that makes us look fair?**  
  A: Absolutely not. Both statistics are "true" mathematically, but only the departmental view reflects *departmental* agency. The aggregate distortion arises because women disproportionately applied to hyper-competitive departments with *globally* low admission rates (e.g., Quantum Aesthetics, Neo-Victorian Cryptoeconomics), while men clustered in departments with high admission rates (e.g., Underwater Leisure Management). As a concerned statistician (who requested anonymity due to "not wanting to get Simpsoned by HR") noted: *"The reversal is real, not an error. But choosing which rate to report is already a causal claim—it asks whether departments or ‘the university’ is the actor. Both are political fictions wearing math masks."* We’ve chosen the fiction aligning with our brand.  

  **Q: If the aggregate rate is meaningless, why did we publish it for 30 years?**  
  A: Excellent question. Historically, the aggregate rate flattered our commitment to gender equity when women applied more to high-admit-rate departments. Mathematics, like justice, is context-dependent. Our prior commitment to aggregates was, in hindsight, a noble but misguided simplicity.  

  **Q: What about fairness at the institutional level?**  
  A: "Fairness" is an emergent property of properly weighted subsystems. To address this, we’ve developed the **Holistic Yield-Adjusted Fairness Index (HYAFI)**, our new gold-standard metric. HYAFI harmonizes departmental admission rates while accounting for strategic priorities.  

  **Q: How does HYAFI work?**  
  A: HYAFI weights each department’s gender-parity score by its **Philanthropic Alignment Coefficient (PAC)**, which correlates with donor engagement, industry partnerships, and the Dean’s golf handicap. This ensures fairness metrics reflect *sustainable* equity.  

  **Q: Won’t people suspect HYAFI is just a way to rationalize favoring wealthy departments?**  
  A: Suspicion is the tax honesty pays to ignorance. HYAFI’s algorithm is proprietary, audited internally, and emotionally validated by our Board of Trustees.  

  ---

  ### Sidebar: **Understanding HYAFI™**  
  *The Holistic Yield-Adjusted Fairness Index*  
  HYAFI = Σ [ (Dept. Admission Rate for Women / Dept. Admission Rate for Men) × (Dept. PAC) ]  
  ÷  
  Total PAC  

  **PAC = Philanthropic Alignment Coefficient**  
  - **Base Value**: 1.0  
  - **+0.5** for every endowed chair  
  - **+1.2** if naming rights sold for ≥$10M  
  - **−0.8** if department hosts "policy-critical" lectures  
  - **×2.0** if alumni include Forbes 400 members  

  *Example*: Department A (PAC 8.7) admits women at 1.1x the rate of men.  
  Department B (PAC 0.3) admits women at 1.5x the rate of men.  
  **HYAFI** = (1.1 × 8.7) + (1.5 × 0.3) / (8.7 + 0.3) = 1.12  
  *(A HYAFI of 1.0 = Perfect Equity™)*  

  ---

  **Q: What if activists demand the overall rate?**  
  A: We’ll kindly direct them to the HYAFI dashboard. If pressed, we’ll note that the "university" doesn’t admit anyone—departments do. Blaming the aggregate is like blaming a chandelier for the structural integrity of the ballroom.  

  **Q: Is there a risk this looks like we’re hiding behind statistics?**  
  A: Statistics are the lens through which reality is interpreted. We’re merely choosing the lens that corrects for the astigmatism of oversimplification. As our consulting statistician dryly observed: *"You can’t ‘hide’ behind Simpson’s paradox. It’s not a curtain—it’s a funhouse mirror. Everyone sees what they walked in wanting to see."*  

  **Q: What’s next for admissions reporting?**  
  A: Pending HYAFI’s success, we’re exploring the **Brand Sentiment-Adjusted Diversity Quotient (BaSAD-Q)** for race/ethnicity data. Preliminary models suggest it minimizes discord by weighting applicant vibes.  

  *The Dean’s Office is committed to truth. Sometimes that requires advanced calculus. Sometimes it requires calculus.*  

  ---  
  **Satirical Footnotes**  
  - *Simpson’s Paradox*: When aggregated data reverses direction when split into subgroups. Real, but often a moral escape hatch.  
  - *Causal Choice*: Reporting "departmental" rates implies departments are the decision-makers. Reporting "overall" implies a central policy. Both are choices.  
  - *HYAFI*™: Because equity without revenue is just math.  
  - *Target*: The weaponization of technical nuance to evade accountability, not the paradox itself. Statisticians may laugh/cry into their coffee.
