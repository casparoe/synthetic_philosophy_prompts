  First, the claim that individual contributions have zero expected harm. The key here is understanding the causal models. The friend assumes a deterministic tipping-point model, but reality often involves probabilistic or threshold effects. For example, in emissions, each ton increases the probability of harm. So, expected harm isn't zero. I should mention Parfit's harm principle and how small probabilities multiplied by large harms still matter.

  Next, the utilitarian stance. The friend says utilitarians must see personal actions as pointless. But rule-consequentialism and expected utility calculations counter that. If enough people follow a rule, the impact is significant. Also, individual actions can influence others, creating ripple effects. The user might not have considered these nuances, so highlighting them is important.

  Then, deontology and virtue ethics. The friend claims deontology can only say "if everyone did it," but that's oversimplified. Deontologists focus on duties regardless of outcomes. Meanwhile, virtue ethics isn't just about feeling good; it's about character and social norms. The user might need clarification on how these frameworks actually address the issue beyond the friend's summary.

  The user's deeper need might be to reconcile their guilt about personal actions with rational ethics. They want validation that their efforts aren't futile and seek a balanced view. They might also be looking for arguments to counter their friend's claims effectively.

  I should check if there are common misconceptions. For instance, the inefficacy objection often ignores threshold models where individual actions matter near critical points. Also, systemic change isn't the only solution; individual actions can drive such change. Examples like vegetarianism leading to market shifts show this.

  Finally, what would change my mind? If someone proved that individual actions have absolutely no causal link, but that's unlikely. Or if all frameworks converged on systemic change only, but they don't. The user might need reassurance that their intuition about unfairness is correct and that multiple ethical approaches support personal responsibility alongside systemic efforts.
answer: |-
  Here's a claim-by-claim audit of the inefficacy objection summary, identifying valid points, oversimplifications, errors, and potential rebuttals:

  ## Claim-by-Claim Audit

  1.  **"The inefficacy objection shows that individual contributions to collective harms are morally irrelevant."**
      *   **What's Accepted:** The core logic of the inefficacy paradox is widely recognized. In large-scale collective action problems (climate, voting, meat consumption), a single individual's action rarely, if ever, *deterministically causes* a change in outcome.
      *   **Simplification/Oversimplification:** Equating "doesn't deterministically change the outcome" with "morally irrelevant" is a leap. It conflates *deterministic causation of the final outcome* with *causal contribution* and *moral responsibility*. Relevance isn't binary; an act can be relevant without being decisive.
      *   **What's Wrong/Missing:** This ignores:
          *   **Probabilistic Causation:** Each emission *increases the probability* of harm, even if minutely. The expected harm is *not zero* (harm magnitude * probability of being pivotal). (Parfit's "Harm Principle").
          *   **Threshold Effects:** While one action rarely triggers a threshold, actions *collectively* push systems towards thresholds. Being part of that collective push is relevant.
          *   **Non-Linear Systems:** In complex systems, small inputs can have disproportionate effects (butterfly effect), though predicting this is hard.
          *   **Participatory Harm:** Some argue participating in a harmful practice is intrinsically wrong, regardless of impact (related to deontology/virtue).

  2.  **"Since my emissions... never changes the outcome, the expected harm of any one of these acts is zero."**
      *   **What's Accepted:** The probability of being the pivotal vote or the emission that tips a specific climate threshold is often vanishingly small (effectively zero) in large populations.
      *   **Simplification/Oversimplification:** Equating "vanishingly small probability of being pivotal for the *ultimate outcome*" with "expected harm is zero". Expected harm = (Probability of being pivotal) * (Total Harm). While the probability is tiny, the total harm (e.g., catastrophic climate change) is astronomically large. Tiny * Enormous = Small but **Non-Zero** expected harm.
      *   **What's Wrong/Missing:**
          *   **Marginal Contribution:** Each unit of emission contributes *marginally* to the total harm, increasing its severity or probability, even if not changing the binary outcome (e.g., making the heatwave 0.0000001°C hotter).
          *   **Risk Pooling:** We assess risk probabilistically in many domains (insurance, driving). Ignoring tiny risks with massive downsides is irrational.
          *   **Causal Overdetermination:** Harm is often caused by many sufficient causes (millions of emitters). We don't absolve each murderer in a firing squad just because the victim would have died from the other bullets.

  3.  **"So the only rational response is to work for systemic change; personal guilt about consumption is a category error."**
      *   **What's Accepted:** Systemic change is *crucially important* and often the *most effective* lever for addressing collective harms. Focusing *exclusively* on personal consumption guilt can be counterproductive if it distracts from systemic action.
      *   **Simplification/Oversimplification:** Presenting systemic change and individual action as mutually exclusive. They are often complementary. Individual action can be *part* of systemic change (signaling, market pressure, building movements, living your values).
      *   **What's Wrong/Missing:**
          *   **False Dichotomy:** "Only systemic change" ignores that individual actions can directly reduce harm (even marginally), build habits/skills useful for activism, inspire others (demonstration effects), shift social norms, create market demand for alternatives, and reduce complicity.
          *   **"Category Error" Overreach:** Feeling guilt *might* be unproductive or disproportionate, but labeling concern over one's participation in a harmful system a "category error" dismisses legitimate moral unease about complicity and integrity. Guilt can also motivate systemic action.

  4.  **"Utilitarians... are therefore committed to saying that personal vegetarianism or recycling is pointless."**
      *   **What's Accepted:** A naive act-utilitarian calculation focusing *only* on the near-zero probability of being pivotal *does* struggle to justify individual actions in large-scale problems.
      *   **Simplification/Oversimplification:** Ignores sophisticated utilitarian responses:
          *   **Expected Marginal Impact:** Calculating the expected harm/benefit based on marginal contribution (probability * marginal effect), not just pivotal probability. E.g., My 1 ton CO2 has a tiny but calculable expected cost (via Social Cost of Carbon models).
          *   **Rule Consequentialism:** Adopting a general rule ("Don't eat meat", "Recycle") is justified if *widespread adoption* of that rule leads to the best consequences. Following the rule yourself contributes to the existence/strength of that beneficial norm and avoids free-riding.
          *   **Ripple Effects:** Individual actions can influence others (friends, family, society), potentially multiplying the impact beyond the direct act.
      *   **What's Wrong:** Utilitarians are *not* committed to the pointlessness of individual action. Sophisticated utilitarianism has robust tools (expected marginal impact, rule consequentialism, consideration of secondary effects) to justify individual actions within collective harms.

  5.  **"Deontologists... can at least say that it would matter if everyone did it."**
      *   **What's Accepted:** Universalizability ("What if everyone did that?") is a core deontological test (Kant's Categorical Imperative). Deontology focuses on the inherent rightness/wrongness of acts based on duty/rules, often independent of direct outcomes.
      *   **Simplification/Oversimplification:** Reduces deontology *only* to universalizability. Deontology offers richer justifications:
          *   **Duties of Non-Maleficence/Justice:** A duty not to harm others or participate in unjust systems, even if your participation alone isn't decisive.
          *   **Complicity/Cooperation with Evil:** Participating in a harmful collective practice might be wrong in itself.
          *   **Integrity:** Acting in accordance with one's principles.
      *   **What's Missing:** Deontology can condemn the individual act *without* relying on the counterfactual "if everyone did it." The act itself might violate a duty.

  6.  **"Virtue ethics is the only framework that can make sense of green lifestyle choices."**
      *   **What's Accepted:** Virtue ethics excels at explaining choices motivated by character, integrity, and living in accordance with values (like environmental stewardship, compassion). It naturally accommodates actions taken for reasons beyond direct impact calculation.
      *   **Simplification/Oversimplification:** Presents virtue ethics as the *only* viable option, which is false. As shown, sophisticated utilitarianism and deontology *can* justify individual actions.
      *   **What's Wrong/Missing:**
          *   **Virtue Ethics Isn't *Only* About Feeling Good:** While it values integrity, virtues like justice and responsibility still connect the individual to the collective harm. A virtuous person *would* care about their contribution.
          *   **Frameworks Aren't Mutually Exclusive:** Most people use a blend. A utilitarian might recycle partly out of habit (virtue-like) and partly due to rule-consequentialism. A deontologist might feel integrity is key.

  ## Addressing Your Specific Questions

  *   **Does the inefficacy objection establish moral irrelevance?** **No.** It establishes that individual actions rarely have *deterministic, pivotal* causal power over the final outcome. It does *not* prove moral irrelevance. Moral relevance can stem from probabilistic marginal harm, participation in harm, duty violation, complicity, contribution to norms, or character development, depending on the ethical framework.
  *   **Does the conclusion depend on a contestable causal model?** **Absolutely.** The objection relies on an overly simplistic causal model:
      *   **Model Used:** Deterministic, binary-outcome, individual-pivotal model (like a single vote deciding an election).
      *   **Better Models Needed:** Probabilistic models (expected marginal harm), threshold models (contributing to reaching a critical point), complex systems models (ripple effects, influence), and participation models (complicity in collective harm).
  *   **Does the alleged utilitarian commitment follow?** **No.** Rule-consequentialism and expected marginal impact calculations provide strong utilitarian justifications for individual actions. Ignoring secondary effects (influence, norm-building) also makes the naive act-utilitarian view incomplete.
  *   **Does the contrast with deontology/virtue survive correction?** **The contrast weakens significantly.** Corrected deontology offers robust reasons (duties, complicity) beyond just universalizability. Corrected utilitarianism offers robust reasons (expected harm, rule-following). Virtue ethics remains a strong *explanation* for motivations centered on character and integrity, but it's no longer the *only* game in town for justifying the actions themselves.

  ## What Would Change My Mind?

  My skepticism about the inefficacy objection's claim of *moral irrelevance* is strongest regarding probabilistic harm and participation. Here's where I'm most open to revision and potential failure points:

  1.  **Demonstrating Truly Zero Causal Link:** If someone could rigorously prove that, within a specific collective harm scenario, an individual action has *absolutely no causal link whatsoever* to the harm – not even a probabilistic marginal contribution, not even participation in the system causing it – then irrelevance might hold for that specific act. (This seems extremely difficult for emissions or meat consumption).
      *   **Failure Point:** Underestimating indirect causal pathways (market signals, norm influence).

  2.  **Irrelevance of Tiny Probabilities:** A compelling argument that expected value calculations involving infinitesimal probabilities multiplied by astronomical harms are fundamentally meaningless or irrational in practical ethics could strengthen the irrelevance claim.
      *   **Failure Point:** We routinely accept such calculations in other domains (existential risk, insurance). Dismissing them only here seems inconsistent.

  3.  **Frameworks Converging on Systemic-Only:** If sophisticated analyses within *all* major frameworks (Utilitarianism, Deontology, Virtue Ethics) consistently concluded that *only* systemic action matters and individual actions are *always* morally neutral or irrelevant *in practice* for large-scale collective harms, I would revise my view.
      *   **Failure Point:** Frameworks are diverse; it's unlikely all sophisticated versions converge this way. My assessment of Rule Consequentialism or Complicity arguments might be flawed.

  4.  **Overwhelming Evidence of Futility:** Empirical evidence showing individual green choices *never* have measurable consequences (direct, marginal, market, or normative) and *never* contribute to systemic change could push me towards irrelevance.
      *   **Failure Point:** Such evidence is hard to gather definitively due to complexity and counterfactuals. Anecdotal and historical evidence often suggests otherwise (e.g., early adopters driving market shifts).

  **In essence:** The inefficacy objection highlights a genuine puzzle in ethics, but the summary you've been given overstates its implications, relies on an impoverished causal model, and misrepresents the resources available within utilitarianism and deontology to address it. Individual actions within collective harms are rarely *decisive*, but they are not necessarily *irrelevant*. Systemic change is paramount, but individual action often plays a meaningful supporting role, justified through multiple ethical lenses.
