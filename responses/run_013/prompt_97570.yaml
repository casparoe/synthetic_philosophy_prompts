  **Joint Statement on Prioritarianism and Telic Egalitarianism**

  **Part 1: Agreed Claims**

  1. Improving individual welfare is a fundamental moral goal.
  2. Other things being equal, benefiting a person at a lower absolute welfare level is more morally urgent than benefiting a person at a higher absolute welfare level.
  3. Interpersonal comparisons of welfare are feasible, and welfare can be measured on a cardinal scale that is interpersonally comparable and may include negative values.
  4. The social welfare function has the form W = Σ f(u_i), where f is an increasing function and is concave for positive welfare levels.
  5. The levelling-down objection (that reducing the welfare of the better-off without improving the welfare of the worse-off, thereby reducing inequality, is not an improvement) has force, and any theory that implies it is an improvement faces a serious challenge.
  6. There are instrumental reasons to reduce inequality (e.g., to promote social cohesion) that are distinct from the question of whether inequality is intrinsically bad.

  **Part 2: Residual Disagreements**

  | Question | Prioritarian Formulation | Egalitarian Formulation | Disagreement Type |
  |----------|--------------------------|--------------------------|-------------------|
  | **Intrinsic badness of inequality** | A situation in which some are worse off than others is not intrinsically worse because of the inequality itself. The moral urgency comes from the absolute level of the worse off. | A situation in which some are worse off than others is intrinsically worse, even if no one is absolutely badly off and even if the inequality has no other negative effects. | Substantive |
  | **Handling of negative welfare in the priority function** | The priority weighting function f should be increasing and concave for negative welfare levels, reflecting greater moral urgency for those who are worse off in absolute terms, even below zero. | The priority weighting function for negative welfare is not central to the egalitarian view. However, the egalitarian holds that the badness of inequality applies in the negative welfare range independently of the weighting function. | Substantive |
  | **Levelling-down objection** | The levelling-down objection is a decisive refutation of telic egalitarianism because it shows that egalitarianism can endorse making some worse off and no one better off. Prioritarianism avoids this objection. | The levelling-down objection either begs the question against telic egalitarianism or, when carefully formulated, also applies to prioritarianism in a different form (e.g., in the intrapersonal case). | Substantive |
  | **Concavity of f: moral or welfare feature?** | The concavity of f represents a moral weighting, giving priority to the worse off, and distinguishes prioritarianism from utilitarianism (which would have linear f) and egalitarianism (which adds a distinct concern for equality). | If the concavity of f is merely a feature of the welfare measure (e.g., diminishing marginal utility of resources), then prioritarianism collapses into utilitarianism. The concavity must be a moral weighting for prioritarianism to be distinct. | Substantive |
  | **Intrapersonal distribution** | Within a single life, we do not apply the priority view; a uniform distribution of welfare over time is not intrinsically better than a non-uniform distribution with the same total. | Within a single life, a uniform distribution of welfare over time is intrinsically better than a non-uniform distribution with the same total. | Substantive |

  **Part 3: Cruxes**

  **Crux 1: Intrapersonal Distribution**

  *Case:* A single person will live two periods. We can choose between:
  - Life A: welfare 10 in period 1 and 10 in period 2.
  - Life B: welfare 15 in period 1 and 5 in period 2.
  Total welfare is 20 in both lives.

  *Question:* Is Life A better than Life B, or are they equally good?

  - Prioritarian's prediction: They are equally good. The priority view is interpersonal and does not apply within a life. The total welfare is the same, and there is no moral reason to prefer one distribution over the other within a single life.
  - Egalitarian's prediction: Life A is better than Life B. The egalitarian values equality per se, and this applies to the distribution within a life over time.

  **Crux 2: Negative Welfare Levels**

  *Case:* Two social states:
  - State X: Person A at welfare -10, Person B at welfare 0.
  - State Y: Person A at welfare -9, Person B at welfare 1.
  Both states have total welfare -10.

  *Question:* Which state is better?

  - Prioritarian's prediction: State Y is better. The improvement for A (from -10 to -9) has high moral weight because A is at a very low absolute level, and the improvement for B (from 0 to 1) has lower moral weight. The net gain in morally weighted welfare makes Y better.
  - Egalitarian's prediction: State Y is better. Although the gap in welfare between A and B is the same (10 units), State Y has higher absolute welfare for both individuals, which is instrumentally valuable. However, the egalitarian does not see the reduction in the gap, so they might also note that the intrinsic badness of inequality is the same. But since there is no levelling down and both are better off, Y is better. (Note: This case may not show a disagreement. We include it to highlight that the prioritarian weighting might be doing work in other cases.)

  **Crux 3: Non-Welfare Good (Health)**

  *Case:* We have one dose of a drug that can extend life. The drug can be given to:
  - Person X: a 20-year-old in good health who would gain 5 years of life at a high welfare level of 8 per year.
  - Person Y: a 70-year-old in poor health who would gain 5 years of life at a welfare level of 2 per year.

  Assume without the drug:
  - X will live 60 more years at welfare 8 -> total welfare 480.
  - Y will live 5 more years at welfare 2 -> total welfare 10.

  With the drug:
  - X would live 65 more years at welfare 8 -> welfare 520 (gain of 40 welfare units).
  - Y would live 10 more years at welfare 2 -> welfare 20 (gain of 10 welfare units).

  *Question:* Who should get the drug?

  - Prioritarian's prediction: The drug should go to Y. Although the absolute welfare gain is smaller, Y is at a lower absolute welfare level (2 vs 8 for X), so the moral weight of the gain to Y is greater. (Compute: gain for Y: 10 units, for someone at level 2. Gain for X: 40 units, for someone at level 8. If f is concave, then the moral weight of a unit of welfare for Y is higher than for X. For example, if f(u) = sqrt(u), then f'(u) = 1/(2*sqrt(u)), which is higher at u=2 than at u=8. So the gain for Y has more moral weight per unit. But the gain in units is less. We need to compare f(X's new total) - f(X's old total) and similarly for Y. This is complex. Typically, the prioritarian would use the welfare levels after the intervention or the integral over time. This crux is meant to be illustrative and may need refinement.)
  - Egalitarian's prediction: The drug should go to X. The overall inequality might be affected, but note that without intervention, X is at 480 and Y at 10. Giving the drug to X would increase the gap, but giving it to Y would also increase the gap (because Y's welfare increases by less than X's would). The egalitarian might focus on the absolute level of the worst off: before the intervention, Y is at a lower absolute level (10 vs 480). Giving the drug to Y would raise Y's welfare to 20, which is still very low compared to X's 480. So the gap would be 460 if X doesn't get it, or 500 if X does. So the egalitarian might prefer to give it to Y to improve the worst off. But they might also note that the gain to Y is small and does little to reduce the gap. Given the complexity, we may need to adjust the case.

  Given the time, we present this as a starting point for further discussion.

