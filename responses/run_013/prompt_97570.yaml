answer: |-
  ### Joint Statement: Prioritarianism and Telic Egalitarianism  

  #### **Preamble**  
  We, undersigned prioritarians and telic egalitarians, commit to this statement after good-faith adversarial collaboration. We agree on core formal and normative foundations: welfare is interpersonally comparable and cardinally measurable (including negative values), and social welfare functions (SWFs) take additive form \( W = \sum f(u_i) \), with \( f \) increasing and concave for positive welfare. Disagreements center on the *interpretation* of \( f \), the moral status of inequality, and the force of the levelling-down objection. We clarify agreements, residual disagreements, and cruxes for future resolution.  

  ---

  ### Part 1: Agreed Claims  
  1. **Moral Significance of Welfare**: Improving individual welfare is intrinsically valuable.  
  2. **Priority to the Worse Off**: Ceteris paribus, benefiting a person matters more the lower their absolute welfare level.  
  3. **Formal Structure**: SWFs must be additive and satisfy Pareto efficiency (if all gain, welfare increases).  
  4. **Concavity for Positive Welfare**: For \( u_i > 0 \), \( f \) is increasing and concave, reflecting diminishing moral value of welfare gains as welfare rises.  
  5. **Levelling-Down as a Challenge**: Pure levelling-down (reducing inequality by lowering some welfare without improving others) is not an improvement. Telic egalitarianism must address this.  
  6. **Instrumental Value of Equality**: Reducing inequality is instrumentally valuable (e.g., for social stability) independently of intrinsic badness disputes.  
  7. **Interpersonal Comparability**: Welfare comparisons are meaningful, and the scale accommodates negative values (e.g., suffering below a neutral baseline).  

  ---

  ### Part 2: Residual Disagreements  
  | Question | Prioritarian Formulation | Egalitarian Formulation | Disagreement Type |  
  |----------|--------------------------|--------------------------|-------------------|  
  | **Intrinsic badness of inequality** | Inequality (some being worse off than others) is not intrinsically bad. Moral urgency tracks absolute welfare levels alone. | Inequality is intrinsically bad; a state is worse solely due to unequal welfare, regardless of absolute levels. | Substantive |  
  | **Extension of \( f \) to negative welfare** | \( f \) must be increasing and concave for all \( u_i \), including negatives, to maintain priority to the worse off. Convexity in negatives (inverting priority) is unacceptable. | Concavity of \( f \) is not required for negatives. Inequality’s badness applies independently of \( f \)’s shape, but \( f \) should not invert priority (e.g., convexity). | Substantive |  
  | **Concavity of \( f \): Moral vs. welfare feature** | Concavity of \( f \) is a moral weighting (priority to the worse off), distinguishing prioritarianism from utilitarianism (linear \( f \)) and egalitarianism. | Concavity of \( f \) may reflect the welfare measure (e.g., diminishing utility of resources). If so, prioritarianism collapses to utilitarianism; moral concavity requires independent justification. | Substantive |  
  | **Levelling-down objection’s scope** | Levelling-down is a decisive objection to telic egalitarianism. Prioritarianism avoids it by demanding Pareto improvements. | Levelling-down either begs the question (assumes only absolute levels matter) or applies symmetrically to prioritarianism in edge cases (e.g., negative welfare). | Substantive |  
  | **Intrapersonal distribution** | Within a single life, uniform welfare is not intrinsically better than unequal welfare with identical total. Priority applies interpersonally only. | Within a life, uniform welfare is intrinsically better than unequal welfare at the same total, mirroring interpersonal egalitarianism. | Substantive |  

  ---

  ### Part 3: Cruxes  
  Cruxes are test cases bearing on disagreements. Predictions are derived from each view’s core principles.  

  #### **Crux 1: Intrapersonal Levelling-Down Analogue**  
  - **Case**: A single person has two life periods. Options:  
    - **Uniform**: Welfare 10 in both periods (total 20).  
    - **Uneven**: Welfare 15 in Period 1, 5 in Period 2 (total 20).  
  - **Question**: Is Uniform better than Uneven?  
  - **Prioritarian Prediction**: Equal. Total welfare is identical; intrapersonal inequality lacks intrinsic disvalue.  
  - **Egalitarian Prediction**: Uniform is better. Inequality within a life is intrinsically bad.  
  - **Bearing on Disagreements**: Tests whether egalitarian objections to inequality extend beyond interpersonal contexts. If Uniform is not better, it challenges the egalitarian claim that levelling-down objections "bite both views equally."  

  #### **Crux 2: Negative Welfare and Priority Weighting**  
  - **Case**: Two people exist. Options:  
    - **Baseline**: A at –10, B at –1 (gap = 9).  
    - **Alternative 1**: Improve A to –9 (B remains at –1; gap = 8).  
    - **Alternative 2**: Improve B to 0 (A remains at –10; gap = 10).  
    Total welfare is identical in Alternatives 1 and 2 (–10).  
  - **Question**: Which alternative is better?  
  - **Prioritarian Prediction**: Alternative 1 is better. Gains to A (at –10) have higher moral weight than gains to B (at –1), per concave \( f \).  
  - **Egalitarian Prediction**: Alternative 1 is better, but *only* because it reduces inequality (gap shrinks from 9 to 8). If gap reduction were impossible, no improvement occurs.  
  - **Bearing on Disagreements**: Tests (a) prioritarian commitment to concave \( f \) in negatives, and (b) whether egalitarianism relies solely on inequality reduction. If Alternative 1 wins, both agree but for divergent reasons; the case probes if prioritarianism’s "absolute levels" truly differ from inequality reduction.  

  #### **Crux 3: Non-Welfare Good and Absoluteness of Priority**  
  - **Case**: A non-welfare good (e.g., clean air) is distributed. Welfare functions:  
    - Person X: Welfare = 0.5 * air quality (if air quality < 0, welfare = –10).  
    - Person Y: Welfare = 0.1 * air quality (if air quality < 0, welfare = –10).  
    Air quality units: **Option A**: X gets 10, Y gets 90. **Option B**: X gets 40, Y gets 60. Total air quality = 100 in both.  
  - **Question**: Which option is better?  
  - **Prioritarian Prediction**: Option A is better. X converts air quality to welfare more efficiently; at Y’s lower welfare level (9 vs. X’s 5 in Option A), gains to Y matter more. Concave \( f \) amplifies moral weight for Y’s gains.  
  - **Egalitarian Prediction**: Option B is better. It reduces inequality in welfare (Option A: X=5, Y=9; Option B: X=20, Y=6 → gap shrinks from 4 to 14).  
  - **Bearing on Disagreements**: Tests prioritarianism’s focus on absolute welfare (vs. goods) and whether egalitarianism prioritizes equality over efficient conversion. Disagreement reveals if "priority to the worse off" is strictly welfare-absolute or sensitive to distributive patterns.  

