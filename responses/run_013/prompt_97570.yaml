  **Design Notes**:  
  - **Formal Setup**: SWF \( W = \sum f(u_i) \) anchors debate. Disputes over \( f \)’s behavior in negatives and moral vs. welfare concavity are explicitly integrated.  
  - **Cases**: Crux 1 tests intrapersonal levelling-down; Crux 2 uses negatives; Crux 3 probes non-welfare goods.  
  - **Balance**: Each camp’s wording in disagreements is endorsed by their side. Predictions are derived from core principles, not imported intuitions.  
  - **Neutrality**: No appeals to authority; disagreements framed symmetrically.
