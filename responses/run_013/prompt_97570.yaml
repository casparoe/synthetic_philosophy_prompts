  1. **Agreed Claims (not truce language):**
     - Both sides agree that it is morally important to improve the welfare of individuals.
     - Both sides agree that, ceteris paribus, it is better to benefit those who are worse off.
     - Both sides reject the idea that inequality is irrelevant to the moral assessment of outcomes.
     - Both sides accept that interpersonal comparisons of welfare are possible and that welfare can be measured on a cardinal scale (with interpersonal comparability).
     - Both sides accept that the social welfare function has an additive form: W = Σ f(u_i), where f is increasing and concave for positive welfare levels (at least for the prioritarian; the egalitarian might see this as a feature of the welfare measure, but we'll note the dispute).
     - Both sides agree that the levelling-down objection (that a change which reduces inequality by lowering the welfare of the better-off without helping anyone is not an improvement) is a serious challenge that any egalitarian view must address.
     - Both sides agree that there are cases in which reducing inequality is instrumentally valuable (e.g., for social stability, or to prevent envy) and that these are not at issue in the intrinsic badness debate.

  2. **Candidate Cruxes (points of divergence that might be resolved by argument or evidence):**
     - **The intrinsic badness of inequality:** Does a situation in which some are worse off than others (with no one else better off) have intrinsic disvalue? The egalitarian says yes; the prioritarian says no.
     - **The scope of the priority view:** Is the priority view only about absolute welfare levels? And does it apply uniformly regardless of the sign of welfare (positive or negative)?
     - **The levelling-down objection:** Is it a decisive objection to telic egalitarianism? Or can it be deflected by the egalitarian? And does a version of it apply to prioritarianism?
     - **The intrapersonal case:** Does the same reasoning that leads to the levelling-down objection in the interpersonal case apply to a single person over time? And what does that show?
     - **The formal setup:** Is the concavity of the transformation function (f) a feature of the welfare measure (so that we are really dealing with a concave welfare scale) or a distinct moral weighting? And does that distinction collapse prioritarianism into a form of utilitarianism?
     - **Behavior in the negative range:** How should the priority weighting function behave for negative welfare levels? This is a point of technical disagreement that has normative implications.

  3. **Verbal Disagreements:**
     - One possible verbal disagreement is about the term "equality". The prioritarian might argue that they care about the absolute level of the worse off, which may lead to more equal outcomes, but they do not value equality per se. The egalitarian might argue that the prioritarian's focus on the worse off is a way of valuing equality indirectly. But this is not merely verbal: the prioritarian denies that equality is intrinsically valuable, while the egalitarian affirms it.
