  **Joint Statement by Prioritarians and Telic Egalitarians**

  We, the undersigned prioritarians and telic egalitarians, have engaged in an adversarial collaboration to clarify our agreements and disagreements. We work within a formal framework of distributive justice where welfare is interpersonally comparable and measured on a cardinal scale that may take negative values. We assume a social welfare function of the form W = Σ f(u_i), with f increasing and concave over the positive range. The following document records our common ground, residual disagreements, and testable cruxes.

  **Part 1: Agreed Claims**

  1. Both parties agree that improving the welfare of individuals is a central moral concern.
  2. Both parties agree that, other things being equal, it is morally better to benefit a person who is at a lower absolute welfare level than one who is at a higher absolute welfare level.
  3. Both parties agree that interpersonal comparisons of welfare are possible and that we can meaningfully speak of a cardinal welfare scale that allows for such comparisons, including negative welfare levels (which represent conditions below a baseline of a life worth living).
