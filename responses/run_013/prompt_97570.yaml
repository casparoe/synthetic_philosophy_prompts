     Another: the prioritarian might say that they are concerned with the absolute well-being of individuals, while the egalitarian is concerned with relations between individuals. This is substantive, not verbal.

     I think the main potential verbal dispute is about the meaning of "intrinsic badness of inequality". The prioritarian might argue that when they give priority to the worse off, they are not responding to an intrinsic bad but to the moral urgency of helping those in absolute need. The egalitarian, by contrast, sees the inequality itself as a bad. But this is a substantive disagreement about values.

