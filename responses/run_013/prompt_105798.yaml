prompt: |-
  I'm a senior analyst in the long-term policy unit of a mid-sized national finance ministry, and for the past year I've been the person who has to defend in writing the discount rate we apply whenever we appraise anything with a horizon past about thirty years: levees, grid hardening, a decommissioning fund, a vaccine stockpile against a novel pathogen, a small research line on deflecting asteroids. These appraisals recur quarterly, they're run by economists and engineers with no philosophy training, and the final number gets signed off by a deputy minister who will not read anything longer than two pages. I've read enough of the rationalist and effective-altruist blogosphere to be fairly sure that the way we currently do this — pick a rate, compound it, done — hides a pile of distinct ethical commitments inside a single parameter, and I want us to stop doing that. What I want from you is a decision procedure rather than an essay: a checklist we can run on a proposal, in order, that first forces us to state which part of the discount rate we are actually invoking — impatience (a benefit being worth less merely because it occurs later), the likelihood that future people will be richer than us, uncertainty about whether there will be a future at all, uncertainty about what future people will want — and then tells us, for each part, what would count as a defensible value, and when the question is technical versus when it is a values question that has to go to elected officials rather than be settled by staff. It needs a hard stop: I want to know the exact step at which the procedure should refuse to produce a number and push the decision upward, and I want it honest about where the whole machinery misfires, especially for non-marginal changes, incommensurable goods, and anything whose benefit consists in reducing the probability that we are not around to enjoy anything.

  Then run it on three proposals so I can see where it bites. First, a coastal defense project with benefits spread over roughly a century. Second, a fund that only pays for itself after several thousand years, of the sort that keeps resurfacing in the nuclear waste file. Third, a modest research program to lower the risk of a global catastrophe, where the payoff is a small change in a probability and the standard arithmetic seems to make it nearly worthless no matter which rate we choose. That third case is the one I actually care about, and I suspect an honest procedure will either assign it a present value I find absurd or admit that it falls outside what discounting can evaluate; I would much rather hear that than a fudge. Two constraints. The deputy minister has already committed publicly that no project will be scored at zero merely because its benefits are far off, so the procedure has to be consistent with that commitment or explain why it cannot be. And none of it may depend on the staff having read the literature: they should be able to run it with the numbers they already have, and where they cannot get a number, the procedure should say what to do instead. Where the procedure cannot be made mechanical, say so plainly rather than dressing a judgment call up as a formula.
reasoning: |-
  Okay, the user is a senior analyst in a finance ministry's long-term policy unit. They're dealing with discount rates for projects that span decades or even millennia. The current method of using a single discount rate oversimplifies ethical commitments, and they want a structured decision procedure to unpack this. 

  First, I need to understand their pain points. They mention quarterly appraisals by economists and engineers without philosophy training, and a deputy minister who only reads two-page summaries. The user wants clarity on the components of discounting—impatience, wealth growth, existential risk, and changing preferences. They need a checklist that forces explicit acknowledgment of each factor, distinguishes technical from value judgments, and has clear escalation points.

  The user also wants three concrete examples tested: coastal defense (100 years), nuclear waste fund (thousands of years), and catastrophe prevention research (small probability adjustments). The third one is their priority, and they suspect discounting might fail here. Constraints: no zero valuations for distant benefits, no reliance on literature, mechanical where possible.

  Hmm, the core tension is between mathematical convenience and ethical rigor. The user is frustrated with hiding value judgments inside a single rate. They’re influenced by rationalist/EA critiques but need something operationally feasible. The deputy minister’s "no zero valuation" pledge complicates things—pure exponential discounting would violate this for millennial projects, so we must avoid that trap.

  For the procedure, I consider breaking it into steps: declare the discount components, assign values (with guardrails), calculate, but add off-ramps where things break. Key off-ramps should be when: pure time preference is needed beyond 300 years (escalate), when uncertainty dominates (qualitative note), or for non-marginal/catastrophic risks (abandon discounting). 

  For the examples:
  - Coastal defenses (100 years): Still workable with adjusted rates, but force explicit wealth growth assumptions.
  - Nuclear waste (1000+ years): Here’s where exponential discounting fails. The procedure should flag the "impatience" component as indefensible and push to ministers for a cutoff decision.
  - Catastrophe research: Discounting indeed misfires. The procedure should admit defeat and switch to cost-effectiveness (e.g., cost per percentage point of risk reduction). This aligns with the user’s suspicion—they’ll likely prefer honesty over fudged numbers.

  The user’s unspoken need might be legitimacy: they want to force value judgments into the open so elected officials own them, not technocrats. Also, they dread the absurdity of valuing existential risk reduction at near-zero via discounting. My solution must validate that dread rather than paper over it.

  Biggest challenge: making uncertainty quantification actionable without philosophy degrees. Hence, leaning on mortality rates for "will we exist?" and income projections for wealth growth—data the staff already has. For "what will future people want?", it’s intentionally coarse (escalate if >50 years) because it’s unmeasurable.

  Final design principle: Where the math can’t handle the ethics, stop the math. That’s what the user is really asking for.
answer: |-
  Here's a **Discount Rate Decision Procedure** structured as a mandatory checklist for project appraisal. It forces explicit declaration of discount components, separates technical inputs from value judgments, and flags escalation points. The procedure halts if it cannot defensibly compute a present value (PV).

  ---

  ### **Discount Rate Decision Procedure Checklist**
  **Run this for *each distinct benefit stream* in the project.**

  #### **Step 1: Declare Discount Components**
  > *Staff must answer ALL components below. No default rates permitted.*  
  **A. Pure Time Preference (δ):**  
     *"Do we value future welfare less *only* because it occurs later?"*  
     - **If YES:** This is a **value judgment**. Deputy Minister must approve δ > 0.  
       *Default:* δ = 0% (per UK Treasury/Stern Review).  
     - **If NO:** δ = 0%.  
     - *Escalate if:* δ > 0.1% or timeline > 100 years. Elected officials must justify valuing future lives less.  

  **B. Wealth/Income Growth Effect (η·g):**  
     *"Will future generations be richer? Does marginal utility of consumption decline with wealth?"*  
     - **η (Elasticity of Marginal Utility):**  
       - Technical input: Assume η = 1.0 (log utility) unless proven otherwise.  
       - *Escalate if:* η < 0.7 or > 1.5 (requires Deputy Minister approval).  
     - **g (Annual GDP/capita growth):**  
       - Technical input: Use ministry's 100-year GDP forecast (e.g., 1.2%/yr). For >100y, assume g = 0% (per precautionary principle).  
       - *Escalate if:* No official forecast exists.  

  **C. Existential Risk (λ):**  
     *"Annual probability humanity goes extinct?"*  
     - Technical input: Base on actuarial tables (e.g., 0.1%/yr from pandemics/nukes/climate).  
     - *Escalate if:* Project itself alters λ (e.g., asteroid defense).  

  **D. Preference Uncertainty (φ):**  
     *"Could future people value this differently?"*  
     - **If benefit is essential survival (e.g., levees, oxygen):** φ = 0%.  
     - **If benefit depends on technology/culture (e.g., AI governance):**  
       - Staff must assign φ (%) ≥ 0.5%/yr after 50 years.  
       - *Escalate if:* Timeline > 200 years or φ controversial.  

  #### **Step 2: Calculate Combined Discount Rate**  
  > Total Discount Rate (r) = δ + (η · g) + λ + φ  
  > **PV = Σ [Benefitₜ / (1 + r)ᵗ]**  

  #### **Step 3: Hard Stop Conditions**  
  > **ABORT PV CALCULATION and ESCALATE to Deputy Minister if:**  
  > 1. Timeline > 300 years AND δ > 0 (indefensible time preference).  
  > 2. Project alters existential risk (λ) by > 0.001%/yr (non-marginal).  
  > 3. Benefits are incommensurable (e.g., "preserving human civilization").  
  > 4. φ > 2%/yr AND timeline > 100 years (extreme preference uncertainty).  
  >   
  > **Instead of PV, submit:**  
  > - Component breakdown (δ, η·g, λ, φ)  
  > - Qualitative justification for non-quantifiable benefits  
  > - Cost-effectiveness analysis (e.g., cost per life saved in expectation)  

  #### **Step 4: Sanity Check**  
  > - If PV < 1% of costs despite high benefits, state:  
  >   *"Discounting dominates outcome. Value judgment on component [X] is decisive."*  
  > - If deputy minister's "no zero valuation" pledge is violated, use:  
  >   **Precautionary PV = Cost / (λ_reduced by project)**  
  >   *(Only for extinction risk mitigation)*  

  ---

  ### **Applied to Your Proposals**

  #### **1. Coastal Defense (100-year horizon)**  
  - **δ:** 0% (staff set; escalate if DM insists δ > 0)  
  - **η·g:** η = 1.0 × g = 1.2% = **1.2%** (using ministry GDP forecast)  
  - **λ:** **0.1%** (base extinction risk)  
  - **φ:** **0%** (flood protection is universally valued)  
  - **r = 0% + 1.2% + 0.1% + 0% = 1.3%**  
  - **PV:** Computed normally.  
  - **Result:** No escalation. Standard discounting applies.  

  #### **2. Nuclear Waste Fund (3,000-year horizon)**  
  - **δ:** Escalate immediately (timeline > 300 years). DM must justify δ > 0.  
  - **η·g:** η = 1.0 × g = 0% (g = 0% per precautionary principle >100y)  
  - **λ:** Compound risk: 0.1%/yr → 95% extinction probability by 3,000y.  
  - **φ:** **0.5%**/yr (society may develop waste transmutation tech)  
  - **Hard Stop:** Timeline >300 years AND δ required → **ABORT PV CALCULATION**  
  - **Escalation Output:**  
    - "Cannot compute defensible PV. δ > 0 ethically contested beyond 300y. Recommend:  
      a) Set funding at 100x current energy generation externalities, or  
      b) Use cost-effectiveness: $/year of contained hazard."  

  #### **3. Catastrophic Risk Research (e.g., asteroid deflection)**  
  - **Key:** Project reduces λ by Δλ = 0.0001%/yr (small probability change)  
  - **δ:** 0%  
  - **η·g:** Irrelevant (benefit is survival, not consumption)  
  - **λ:** Base λ = 0.1%/yr; benefit = Δλ reduction  
  - **φ:** 0% (survival is universal good)  
  - **r = 0% + 0% + 0.1% + 0% = 0.1%**  
  - **PV Misfire:**  
    - Benefit = "Avoided extinction" ≈ infinite value, but Δλ is tiny.  
    - Standard PV = Σ [Δλ · (Value of Civilization) / (1.001)ᵗ] → *Fails* (infinite sum).  
  - **Hard Stop:** Project alters λ → **ABORT PV**.  
  - **Escalation Output:**  
    - "Discounting cannot value extinction risk reduction. Use:  
      **Cost-effectiveness = Program Cost / (Δλ · Years of Civilization Saved)**  
      e.g., $10M / (0.000001 · 1e6 years) = $10 per future-year-equivalent saved."  
  - **Deputy Minister's Pledge:** Upheld via alternative metric.  

  ---

  ### **Why This Works**
  - **Forces Explicit Ethics:** δ and φ are naked value judgments escalated to officials.  
  - **Uses Existing Data:** GDP forecasts, mortality tables, and staff judgments replace philosophy.  
  - **Hard Stops:** Prevents false precision for intractable cases (long horizons, catastrophe risk).  
  - **Catastrophe Risk:** Acknowledges discounting fails—provides fallback (cost per risk reduction).  
  - **Anti-Absurdity:** The nuclear waste and asteroid cases expose discounting's limits rather than hiding them.  

  **Final Warning:** This procedure will *reduce* PVs for ultra-long projects versus ad-hoc rates—but it replaces fudge factors with accountable choices. For catastrophe risks, it forces non-discounting approaches, which is the honest answer you sought.
