answer: |-
  ## The Semantic Trap: Why Evolutionary Debunking Threatens More Than Just Realism

  Your marathon argument with Maya cuts to the heart of contemporary metaethical debate. While Maya is right that the standard Evolutionary Debunking Argument (EDA) primarily targets realism, your intuition about a deeper, semantic threat is astute and exposes a vulnerability potentially shared by many anti-realist positions. This essay will elucidate the core EDA, rigorously distinguish the epistemic and semantic versions you've identified, evaluate the viability and scope of the semantic challenge, and assess whether anti-realists possess a genuine escape route. Crucially, we'll navigate past the "boring-but-important" objection and aim for a decisive verdict.

  **I. The Evolutionary Debunking Argument: Standard Form and Target**

  The core EDA leverages evolutionary biology to undermine the justification of moral beliefs:

  1.  **Causal Thesis:** Human moral beliefs (or the cognitive faculties producing them) are significantly shaped by natural selection acting to enhance inclusive fitness, primarily through promoting cooperation, coordination, and social cohesion.
  2.  **Tracking Failure:** Natural selection favors traits that enhance survival and reproduction, *not* traits that reliably track mind-independent moral truths (if such truths exist). Beliefs conducive to cooperation would be selected for *regardless* of their truth-value concerning such truths.
  3.  **Epistemic Consequence (Standard):** Therefore, we have no good reason to believe our moral beliefs *are* reliable indicators of mind-independent moral truths (if such truths exist). The causal origins of our beliefs are disconnected from their potential truth-makers.
  4.  **Target:** This argument directly threatens **Moral Realism** – the view that there exist objective, mind-independent moral facts that our beliefs can (at least potentially) accurately represent. If our belief-forming mechanism isn't sensitive to these facts, we cannot justify our confidence in them (e.g., Street, Joyce). As Maya correctly notes, many anti-realists (e.g., expressivists like Blackburn, constructivists like Korsgaard) seem immune: they never claimed moral beliefs tracked mind-independent facts. Expressivists see moral language as expressing non-cognitive attitudes; constructivists see moral truths as outputs of practical reasoning procedures. The EDA seems irrelevant to their core claims.

  **II. Beyond Epistemology: The Semantic/Referential Challenge**

  Your pushback identifies a more radical, potentially devastating, interpretation lurking within the causal thesis:

  1.  **Deep Causal Thesis:** Natural selection didn't merely shape the *content* of specific moral *beliefs*; it fundamentally shaped the very *concepts*, cognitive mechanisms, and processes by which we fix the reference of moral terms like "good," "right," "ought," and "wrong." These were forged *specifically* for the function of coordination and cooperation within social groups.
  2.  **Referential Indeterminacy:** Because these concepts/reference-fixing mechanisms were optimized *only* for promoting fitness-enhancing coordination, they lack the requisite structure or connection to anchor any determinate, stable meaning or reference – whether to mind-independent properties *or* to stable mind-dependent constructs. They are adaptive fictions, useful for getting groups to act cohesively, but inherently unstable and indeterminate under scrutiny. The worry isn't "Are our beliefs *true*?" but "Do our moral terms *refer* to *anything* coherent enough to even *have* a truth-value?"
  3.  **Semantic Consequence:** Therefore, moral discourse may suffer from **radical indeterminacy** or **referential failure**. Our moral vocabulary might be fundamentally unstable, incapable of picking out *any* determinate subject matter – not Platonic Forms, not response-dependent properties, not even the stable inputs or outputs of a constructive procedure. Moral sentences might be systematically defective or meaningless in a way that goes beyond simple falsehood.

  **III. Evaluating the Semantic Challenge**

  *   **Does it Work?** The semantic EDA is conceptually distinct and plausible, but its success hinges on contentious premises:
      *   *Conceptual Shaping:* Does evolution operate at the level of *concepts* or just behavioral dispositions and proto-beliefs? While dispositions are primary targets of selection, complex social coordination plausibly *requires* the development of shared conceptual frameworks ("fair," "unfair," "obligation"). Selection operates on the cognitive machinery that *implements* coordination, which includes concept formation. This isn't conclusive, but it's plausible enough to shift the burden: the anti-debunker must show why coordination *wouldn't* require and shape these concepts.
      *   *Indeterminacy from Function:* Is a concept shaped *solely* for coordination inherently indeterminate? This depends on theories of reference and meaning. If reference requires causal-historical links to properties (like natural kinds), moral concepts likely fail. If reference is fixed by conceptual role or functional role *within the cognitive system*, the semantic EDA gains traction: the function is coordination, *not* stable representation. The concept "wrong" might just mean "whatever reliably triggers avoidance/punishment responses in my group," which could vary wildly across contexts and groups, lacking core stability. The debunker argues that without a *function* aimed at tracking *something determinate* (even mind-dependent), stability is accidental and reference fails.
      *   *The "Boring-but-Important" Objection:* Does evolution shape belief/content or just behavior/affect? While dispositions are primary, the *efficient* implementation of complex social coordination in cognitively sophisticated creatures like humans likely involves internal representations *with content* (e.g., beliefs about expectations, entitlements, sanctions). Representing "X is unfair" is a powerful coordination tool. Denying *any* role for content requires explaining complex social behavior *without* it, which seems less parsimonious. Evolution plausibly shaped both the dispositions *and* the representational content used to regulate them. **Verdict:** The semantic EDA is a coherent, non-trivial threat. It doesn't *necessarily* succeed, but it establishes a significant burden of proof: the metaethicist (of any stripe) must explain how moral concepts achieve sufficient determinacy given their evolutionary origins optimized purely for coordination.

  **IV. Does the Threat Generalize? Targeting the Anti-Realist Escape Hatch**

  This is the crux. Maya claims anti-realists are immune. Your semantic challenge suggests otherwise:

  1.  **Constructivism:** Constructivists hold moral truths are constituted by the outcome of a rational procedure (e.g., idealized agreement, practical reasoning). However, this procedure requires *inputs* – concepts like "rational agent," "interest," "justification," and crucially, the *moral concepts themselves* ("right," "good") that the procedure is meant to define or operationalize. If the semantic EDA holds, these inputs are contaminated:
      *   **Problem:** The concepts feeding into the constructive procedure (e.g., "What principles could rational agents will?" or "What is reconcilable with the categorical imperative?") are themselves products of evolutionarily shaped, coordination-optimized machinery. If "rational agent" or "will" or the *moral* concepts used implicitly within the procedure are unstable or indeterminate due to their origins, the procedure's output becomes arbitrary or meaningless. The procedure cannot bootstrap determinacy from indeterminate inputs. It needs *something* stable to work with. If evolution corrodes that stability, constructivism falters.
  2.  **Expressivism:** Expressivists deny moral sentences represent states of affairs; they express non-cognitive attitudes (approval, disapproval, plans). They seem safest, as reference isn't their game. However, expressivism requires a *systematic* connection between moral utterances and the attitudes they express. It also needs to explain the *logical structure* and *inferential roles* of moral discourse (the Frege-Geach problem).
      *   **Problem:** The semantic EDA threatens the *stability* and *determinacy* of the attitudes expressed and the norms governing expression. *Which* attitudes are expressed by "Stealing is wrong"? If our moral sensibility is an evolutionary kludge for coordination, the underlying attitudes might be a chaotic mess – a blend of genetically hardwired disgust, culturally variable norms, and self-interested calculation. There might be no stable "moral disapproval" state to express; it could be fundamentally fragmented. Furthermore, the *rules* for expressing these attitudes (what counts as a reason, how we argue) might also be shaped purely for coordination, lacking internal logical coherence needed to solve Frege-Geach. Expressivism survives only if the *attitudes* and *discursive norms* are sufficiently determinate and stable. The semantic EDA casts doubt on this.
  3.  **The Core Vulnerability:** Both realism and anti-realism require *some minimal level of semantic determinacy* for moral discourse to function meaningfully. The realist needs it for truth-aptness. The constructivist needs it for stable inputs and procedures. The expressivist needs it for stable attitudes and expressive norms. The semantic EDA asserts that evolutionary pressures optimized purely for coordination *undermine this minimal determinacy*. It suggests moral language is like a currency whose value was *only ever* maintained by social convention for trade, and once you realize there's no gold standard (mind-independent facts) *and* the convention itself is arbitrary and constantly shifting (indeterminate concepts/attitudes/norms), the whole system is revealed as fundamentally unstable.

  **V. The Anti-Realist's Best Move and Its Potential Failure**

  The anti-realist's strongest counter is **Pragmatic Determinacy via Social Practice:** "Determinacy doesn't require grounding in mind-independent facts *or* pre-social concepts. Meaning and reference (or expressive function) are constituted *within* evolving social practices and linguistic norms themselves. Our moral concepts *are* determinate *enough* for meaningful discourse precisely *because* they function successfully within our cooperative practices. Evolution gave us the *scaffolding* for these practices; the practices themselves, through cultural evolution and normative pressure, fill in the determinacy. The coordination function *is* what fixes the meaning/stability, not something that undermines it."

  *   **Why it Might Fail (The Semantic EDA's Rebuttal):** This move risks conflating *successful coordination* with *semantic determinacy*. A concept or norm can be highly effective at coordinating behavior within a group *without* having a stable, determinate meaning across contexts, individuals, or time. Think of vague social norms or terms like "cool." They work, but their boundaries are fuzzy and contested. The semantic EDA argues that *because* moral concepts were *only* selected for coordination *efficiency* (not truth, logical coherence, or deep stability), they are inherently prone to this kind of context-dependency, fragmentation, and drift. Cultural evolution might add layers, but it builds upon a foundation optimized for fluidity, not fixed reference or stable attitudes. If the underlying evolved machinery provides no anchor, cultural practices might just create a *veneer* of determinacy masking fundamental instability. The anti-realist must demonstrate that social practices *can* and *do* generate sufficiently robust determinacy *despite* the evolutionary origins pointing towards functional fluidity. This is a significant challenge.

  **VI. Final Verdict**

  You are substantially correct. While the standard epistemic EDA is a targeted missile against realism, the semantic/referential version you've articulated is a broader-spectrum weapon with significant fallout for prominent anti-realist positions, particularly constructivism. Its core insight – that evolution optimized the *machinery of moral thought* (concepts, reference-fixation, perhaps even attitude-formation) *only* for coordination, potentially undermining the very *determinacy* required for meaningful discourse – is powerful and distinct from mere epistemic unreliability.

  *   **Does the semantic version work?** It is a credible, non-collapsing threat. It establishes a strong burden: any metaethicist must explain how moral concepts, attitudes, or discursive norms achieve sufficient determinacy given their fitness-driven origins. The "just behavior/affect" objection doesn't fully defang it; complex coordination likely involves representational content vulnerable to the argument.
  *   **Does it generalize?** Yes, importantly. Realism is directly hit. **Constructivism** is highly vulnerable; it crucially relies on stable inputs and procedures that the semantic EDA undermines. **Expressivism** is more resilient but not immune; its reliance on stable attitudes and discursive norms is threatened by the prospect of evolutionarily induced fragmentation and fluidity.
  *   **The Anti-Realist Escape Hatch:** It is **narrower than Maya claims**, potentially **non-existent for constructivism**, and **precarious for expressivism**. The best anti-realist move (pragmatic determinacy through social practice) is plausible but faces the formidable challenge of showing how robust determinacy emerges from machinery designed for functional fluidity. The semantic EDA suggests the coordination imperative might actively *prevent* the kind of deep stability needed.

  Your argument with Maya highlights a profound challenge: if morality is fundamentally a tool for social coordination forged by blind evolution, can it ever be more than that, even in our theories? The semantic EDA suggests that escaping this conclusion requires more philosophical heavy lifting than anti-realists often assume. Your pushback holds significant water. Maya's free win for anti-realism is far from guaranteed; the evolutionary shadow might darken her door too. The burden now lies with the anti-realist to demonstrate how determinacy emerges from the adaptive flux, or else acknowledge that the debunking might run deeper than anyone initially thought.
