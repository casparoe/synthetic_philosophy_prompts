answer: |-
  Your intuition is spot-on: Goodhart's law manifests in distinct patterns, and your cases reveal multiple failure modes. Based on your examples and the underlying principles, here's a refined framework with **three core mechanisms** that explain when and why gaming hurts. Each mechanism has a precise clause, and together they cover all your cases without contradiction.

  ---

  ### **The Three Mechanisms of Metric Distortion**
  1. **Proxy Decoupling**  
     *When the cheapest/most accessible action to move the metric does not move the goal (or moves it negatively), and agents exploit this misalignment.*  
     - **Hurts if**: The low-effort action scales indefinitely or dominates behavior.  
     - **Harmless if**: The low-effort action is constrained (e.g., scarce inputs), forcing agents to also use high-effort/goal-aligned actions.

  2. **Metric Collapse**  
     *When measuring/targeting the metric destroys its information value (e.g., by altering the context, incentives, or honesty required to generate the data).*  
     - **Always hurts**: The metric becomes statistically uncorrelated with the goal once targeted.

  3. **Rule Exploitation**  
     *When agents follow the literal definition of the metric in a way that violates its intent, without falsifying data.*  
     - **Hurts if**: The metric’s definition has loopholes that allow goal-undermining behavior.  
     - **Harmless if**: No such loopholes exist (rare).

  ---

  ### **Applied to Your Cases**
  | # | Case                     | Mechanism           | Why It Fits                                                                                                | Verdict Match? |
  |---|--------------------------|---------------------|------------------------------------------------------------------------------------------------------------|----------------|
  | 1 | Story points             | Proxy Decoupling    | Cheapest action: inflate estimates. Scales indefinitely, no constraint forcing real work.                  | ✅ (Bad)       |
  | 2 | Lines of code            | Proxy Decoupling    | Cheapest action: write bloated code. Scales indefinitely.                                                  | ✅ (Bad)       |
  | 3 | Support response time    | Proxy Decoupling    | Cheapest action: send canned replies. Scales indefinitely (every ticket).                                  | ✅ (Bad)       |
  | 4 | Soviet nails             | Proxy Decoupling    | Cheapest action: overproduce one type. Scales indefinitely.                                                | ✅ (Bad)       |
  | 5 | Cobra bounty             | Proxy Decoupling    | Cheapest action: breed cobras. Scales indefinitely.                                                        | ✅ (Bad)       |
  | 6 | Demos booked             | Proxy Decoupling    | **Cheapest action (junk demos) is constrained**: Limited supply of junk leads, forcing more real outreach. | ✅ (Not bad)   |
  | 7 | Recommender clicks       | Proxy Decoupling    | Cheapest action (clickbait) **also moves goal** (watch time). No misalignment.                             | ✅ (Harmless) |
  | 8 | Survey participation     | Metric Collapse     | Targeting destroyed honesty → metric no longer measures sentiment.                                         | ✅ (Bad)       |
  | 9 | ER wait times            | Rule Exploitation   | Agents followed rules (ambulance loophole) but undermined intent.                                          | ✅ (Bad)       |
  |10 | Sales commission         | (N/A)               | Metric **is** the goal. No proxy → not subject to Goodhart.                                                | ✅ (Not same)  |

  - **#6 (Demos booked)** is harmless **not because junk demos are good**, but because junk leads are finite. To hit targets, agents **had to** book real demos too (net positive). If junk were infinite, it would fail.
  - **#7 (Clicks/watch time)** avoids harm because the "gaming" (clickbait) inherently serves the goal. No decoupling.
  - **#8 (Survey)** and **#9 (ER)** are distinct failures: #8 destroys the metric’s validity; #9 exploits a definitional flaw.

  ---

  ### **Predictions for New Scenarios**
  Apply the principles to your unlisted cases:

  | Scenario                                  | Prediction                                                                 | Mechanism           |
  |-------------------------------------------|----------------------------------------------------------------------------|---------------------|
  | **One-time vendor metric** (e.g., "uptime") vs. **permanent target** | Permanent target → gaming inevitable. One-time → less risk (no time to adapt). | Proxy Decoupling    |
  | **Org-wide metric** (e.g., "total revenue") vs. **individual rankings** | Individual rankings → higher gaming (competition). Org-wide → less distortion (shared fate). | Proxy Decoupling    |
  | **Metric abandoned when gamed**          | Limits harm but doesn’t prevent it (gaming still occurs until detected).   | Proxy Decoupling    |
  | **"Cheapest way" is desirable** (e.g., optimize API latency → forces cleaner code) | Harmless: low-effort action aligns with goal (like #7).                 | Proxy Decoupling    |

  ---

  ### **Verdicts to Reconsider**
  - **None!** Your judgments are consistent with the mechanisms.  
  - **#6 is not sentimental**: You implicitly recognized constraints (junk demos couldn’t dominate).  
  - **#8 and #9 are distinct** from others: #8 is a data-generation failure; #9 is a loophole failure.

  ---

  ### **Key Insight**
  Goodhart’s law isn’t binary. **Harm occurs when the metric incentivizes goal-irrelevant effort at scale**. Use this framework to diagnose metrics:
  1. Is there a scalable, low-effort action that moves the metric but not the goal? (→ **Proxy Decoupling**)  
  2. Does targeting the metric corrupt the data source? (→ **Metric Collapse**)  
  3. Does the metric’s definition permit loopholes? (→ **Rule Exploitation**)  

  This explains why "gamed, but not bad" (#6) exists: gaming is constrained, forcing aligned effort. Conversely, when gaming is unconstrained (#1–5) or destroys the metric (#8), it fails.
