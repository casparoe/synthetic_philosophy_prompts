  ## Pantoum of the Unmade Appointment

  The evenings are mostly full, that's all.
  I'll call tomorrow, just one more day.
  The lump might be nothing, quite small.
  The appointment can wait, I can delay.

  I'll call tomorrow, just one more day.
  No one can hold both, my friend said.
  The appointment can wait, I can delay.
  Ignore the small whisper inside my head.

  No one can hold both, my friend said.
  I simply kept putting it gently aside.
  Ignore the small whisper inside my head.
  The truth was a place I refused to abide.

  I simply kept putting it gently aside.
  The evenings are mostly full, that's all.
  The truth was a place I refused to abide.
  The result was benign, a harmless small ball.

  The evenings are mostly full, that's all.
