  Here's a decision tree that sorts major positions on biological function, built around diagnostic questions and your specified cases. The tree uses **5 branch questions** and separates the four test cases (random byproduct, vestigial trait, one-off trait, engineered part) while handling "function for whom?" within branches. Contested areas are flagged in *italics*.  

  ### Decision Tree for Biological Function  
  **Start with Q1:**  

  1. **Q1: Can a function exist without evolutionary history?**  
     - *If NO (requires history)* → **Q1a**  
     - *If YES (history irrelevant)* → **Q2**  

  2. **Q1a: Must the trait have been *selected* for its role?**  
     - *If YES* → Leaf: **Selectionist Etiology** (e.g., Wright, Millikan).  
       - *Vestigial trait:* ✅ (historical function).  
       - *Engineered part:* ❌ (no selection history).  
     - *If NO (accepts design or post-hoc utility)* → Leaf: **Extended History View** (e.g., artifact-inclusive etiologies).  
       - *Engineered part:* ✅ (design = function).  
       - *One-off trait:* ❌ (no design/history).  

  3. **Q2: Is function defined by *current* contributions to survival/reproduction?**  
     - *If YES* → **Q3**  
     - *If NO* → **Q4**  

  4. **Q3: Must the trait benefit the *organism itself* (not e.g., symbionts)?**  
     - *If YES* → Leaf: **Organism-Centered Causal Role** (e.g., Cummins).  
       - *Random byproduct:* ✅ (current benefit).  
       - *Trait helping symbiont:* ❌ (host harmed).  
     - *If NO (benefits genes/groups/systems)* → Leaf: **System-Relative Causal Role**.  
       - *Trait helping symbiont:* ✅ (function for symbiont).  
       - *Vestigial trait:* ❌ (no current benefit).  

  5. **Q4: Is function tied to self-sustaining organization?**  
     - *If YES* → Leaf: **Self-Maintenance View** (e.g., autopoiesis, Moreno/Mossio).  
       - *One-off trait:* ✅ (maintains individual's viability).  
       - *Engineered part:* ✅ (if integrated). *Contested: Does artificial design count?*  
     - *If NO* → **Q5**  

  6. **Q5: Are function claims just pragmatic shorthand?**  
     - *If YES* → Leaf: **Deflationary/Shorthand View** (e.g., Ruse).  
       - *All cases:* ✅ (context-dependent).  
     - *If NO* → Leaf: **Hybrid/Other** (e.g., requires history + current role).  
       - *Random byproduct:* ❌ (lacks history).  
       - *Vestigial trait:* ❌ (lacks current role).  

  ---

  ### Test Case Outcomes  
  | **Position**               | Random Byproduct | Vestigial Trait | One-Off Trait | Engineered Part |  
  |----------------------------|------------------|-----------------|---------------|-----------------|  
  | **Selectionist Etiology**  | ❌               | ✅              | ❌            | ❌              |  
  | **Extended History**       | ❌               | ✅ (*if designed*) | ❌         | ✅              |  
  | **Organism-Centered Role** | ✅              | ❌              | ✅            | ✅              |  
  | **System-Relative Role**   | ✅ (*if system-beneficial*) | ❌ | ✅         | ✅              |  
  | **Self-Maintenance**       | ✅              | ❌              | ✅            | ✅ (*contested*) |  
  | **Deflationary**           | ✅              | ✅ (*as history*) | ✅          | ✅              |  
  | **Hybrid**                 | ❌               | ❌              | ❌            | ✅ (*if current + design*) |  

  ---

  ### Key Notes  
  - **Unresolved Overlap:** The tree **cannot fully separate** the *Self-Maintenance View* and *System-Relative Causal Role* for traits benefiting collective systems (e.g., microbiome interactions). Both may assign functions identically in symbiotic cases.  
  - **Unoccupied/Incoherent Combos:**  
    - ❌ "Function requires absence of history" (incoherent; no major view).  
    - ❌ "Function requires harm to the organism" (unattractive; only deflationary might contextually accept this).  
  - **Contested Issues:**  
    - *Engineered parts*: Etiologists debate whether "design" counts as function (*Extended History* vs. *Selectionist* split).  
    - *One-off traits*: Causal-role views accept them; etiologists uniformly reject them.  
    - *Self-maintenance*: Contentious whether it subsumes causal roles or is distinct.  
    - *Consensus*: No single view dominates philosophy of biology; selectionist and causal-role positions are the most entrenched rivals.  

  Summary: This tree sorts six core positions using five diagnostic questions, separates your four test cases, exposes gaps in symbiotic-function handling, and highlights ongoing disputes in evolutionary teleology.
