answer: |-
  **Address to the Tenth Anniversary Ceremony of the Final Report**

  Ten years ago, in this very chamber, I placed our final report into the hands of the president. We delivered, as instructed, an accounting. Today, we are gathered to mark that delivery. But we are not gathered to celebrate an end. The war ended before we began. We gathered then, and we gather now, because endings are not the same as conclusions. We sought not to end the story, but to establish, once and for all, what the story *was*.

  Look around this room. You see the faces that defined our work, and that define this moment still. To all present: you are here because the agreement that ended the conflict required it. Your presence is a testament to the complexity we sought to contain, and the complexity that remains.

  Our mandate was clear: to establish as full a picture as possible of the violations committed. We were a creature of that peace agreement, not of ordinary law. We could compel testimony only through a specific bargain: full, truthful disclosure of politically motivated acts, in exchange for amnesty *from us*. That amnesty was never automatic. It was never a pardon. It was a conditional legal shield, individually sought, individually examined. Four thousand applied. Roughly eight hundred received it. Six had it stripped away because they lied to us. That shield was the first half of the exchange. The second half, the sharp edge of our bargain, was this: *everyone* denied amnesty, or who never applied, remained fully exposed to prosecution. The state explicitly committed to pursue them. And where it chose not to, it committed to explain that choice publicly. This was the structure. This was the condition for the information we gathered.

  We gathered a lot. Twenty thousand statements. Public hearings for some. We sifted, we verified, we named. The report named perpetrators. It named victims. It named acts. This naming, this official recording by the state itself – this was our core product. We called it **acknowledgment**.

  Understand what acknowledgment *is*. When a victim speaks, it is often heard as a claim, a story, one version requiring proof. When the state, through a body like ours, after investigation, adopts that account as fact, it shifts. It moves from claim to record. It enters the ledger. It becomes undeniable history. That is powerful. It gives weight. It gives a form of official dignity to suffering that was previously denied or obscured. It removes the burden of proof from the shoulders of the bereaved. It says: *This happened. We, the state, say it happened.*

  But understand equally what acknowledgment *is not*. It does not undo the act. A bullet fired, a life taken, a body hidden – these remain. Acknowledgment does not erase them. Nor is acknowledgment punishment. It does not condemn the perpetrator to prison, nor inflict suffering upon them. It simply states: *You did this.* It establishes the fact. Acknowledgment gives the record its weight, but it does not wield the sword of justice. That sword was meant to be wielded by others, later, according to the clear terms of our bargain and the ordinary laws of the land.

  Which brings us to the decade since.

  We spoke of a bargain. Of a conditional exchange. The condition for the amnesty granted – the state’s forbearance from prosecution – was the state’s commitment to prosecute those denied amnesty. The integrity of the shield depended entirely on the certainty of the sword. Without that certainty, the shield becomes something else entirely.

  In ten years, how many of those we named, or who were denied amnesty, have stood trial? One. A senior figure. And his conviction stemmed not from the state fulfilling its ordinary duty, but from *us* revoking the amnesty *he* had obtained by deceit. One conviction, born of our revocation, not their prosecution. For the rest? Silence. The state has not prosecuted. More damningly, it has never explained why. Not once. The report named names. Two of those named men walk free. Never shielded by our amnesty. Never touched by the state’s justice. One of them is in this room today. He received no amnesty. He faces no charges. He sits here, a fact as undeniable as any we recorded.

  To that man: You are here under the agreement’s invitation. Your presence is a stark reminder of the condition unmet. You sit under the weight of the acknowledgment we made. The record stands. The state’s inaction does not erase it. It only stains the state.

  To the recipients of amnesty: You received a specific thing: a legal protection from prosecution *by the state* for the specific acts you fully disclosed to us. That grant purchased your freedom from prison for those acts. It did *not* purchase innocence. It did *not* purchase moral absolution. It did *not* purchase the right to have your deeds forgotten or called anything other than what they were: violations. The six revocations stand as a marker: the promise of freedom was utterly dependent on the truth. The state’s failure to pursue the others does not validate your shield; it devalues the entire structure we built upon the condition of enforcement. Your safety exists in the shadow of others' impunity.

  To the government representatives here: The report contained another obligation: reparations. A debt owed, a tangible recognition of loss. Ten years on, that debt remains largely unpaid. This is not a matter for pleading. It is not a matter for excuses about process or priorities. It is a debt. Unpaid debts are not merely delayed; they are denied. Every unpaid reparations account is another broken promise, another weight added to the scales where acknowledgment alone already bears too much.

  To the foreign delegations: Your funding made this commission possible. But we did not create acknowledgment for you. We created it for this country. Your presence today is a reminder of the international gaze that helped shape our mandate. That gaze must now turn, as ours does, to the obligations assumed by this state that remain unfulfilled. See what was built, and see what stands unfinished.

  For years, I have defended what we did. I have called it a form of justice. Looking at the enforcement record laid bare – one conviction, no explanations – that claim is strained near to breaking. The conditional shield we offered was meant to be part of a system demanding accountability: truth for protection, prosecution for denial or refusal. With prosecution almost entirely absent, the scales are unbalanced. The shield granted looks less like a component of justice and more like an isolated concession. Can I still say we achieved a form of justice? Only if we see justice as a spectrum, and acknowledge we stand at its barest, most minimal end: the justice of the record. The justice of *knowing*. That is real. It is vital. But it is not enough. It was never meant to be the end.

  This leads to the hardest question, the one carried by the families of the dead and the disappeared, especially those who refused to speak with us: Did the state owe you punishment for the perpetrators? And if it did, were you wronged by the bargain we made?

  This is the core tension.

  The state absolutely owed you the protection it failed to provide when the violations occurred. It owes you the acknowledgment we delivered. But did it owe you, specifically, the punishment of another person? Is punishment a *debt* owed *to* the victim? I have come to believe the answer is no. Justice, in its punitive sense, is a function the state performs *on behalf of* society and *because of* the violation against the victim. It is society condemning the act and enforcing its laws. The victim is the essential reason, the injured party, but punishment is not delivered *to* them like a possession. It is done *because* of them.

  Therefore, the state could, in the desperate calculus of ending a war, negotiate away its *own* right and duty to punish specific individuals, under specific conditions – the conditions we enforced. It could offer the shield of amnesty in exchange for truth, hoping the truth itself held value. We believed it did. We still believe the record matters.

  But in doing so, the state did *not* negotiate away anything that belonged *to you*. It negotiated away its own tool. It traded one form of accountability – the threat of punishment – for another – the extraction of truth under threat of punishment. The tragedy, the profound failing, is that the state then neglected to use the tool it kept: prosecution for the unshielded. It broke its own side of the bargain. That failure is the state’s alone. It is the state’s betrayal, not of the agreement, but of you. The agreement offered a difficult path. The state abandoned that path after walking only the first mile.

  Was the agreement justified? Given the carnage that preceded it, the rivers of blood it finally stemmed, I believe it was the only possible path at that time. It was *permissible*. It was *necessary*. But was it *just*? Did it deliver what was inherently deserved? No. It traded the full measure of desert for the possibility of peace and the certainty of a record. It was justified by the horror it ended, not by its inherent fairness. The justification lies in the alternative that was avoided; the injustice lies in the inherent inadequacy of any bargain when weighed against irreparable loss.

  To the families, especially those who always saw the amnesty as an affront: Your anger, your refusal, your profound sense of betrayal – I do not call it irrational. How could I? You see the shield granted. You see the sword rusting in its scabbard. You see perpetrators free. You see a named man sitting here. You see unpaid debts. Your grief was met with a transaction. A transaction that extracted truth but failed to deliver the enforcement that was its necessary counterpart. Your grievance is not against the idea of acknowledgment, I suspect, but against the imbalance, the incompleteness, the broken promise that makes the granted amnesties feel unearned and the entire structure feel like a betrayal. That grievance is legitimate. It is rooted in the state’s failure, not in any failing of your understanding.

  Some might expect an apology from me today. I decline. Not because there is no sorrow, but because an apology from me would imply an authority I never possessed. I did not grant the amnesties lightly; I revoked them when I found deceit. I did not write the agreement; I implemented its terms as rigorously as we could. I do not control the prosecutors or the treasury. I chaired a commission. I delivered the report. The failures that followed are not mine to apologize for; they are the state’s to rectify. My duty was the record. That duty, I fulfilled.

  Ten years on, what remains? The report. The acknowledgment. The names. The acts. The locations. The patterns. The cold, hard facts we established. They are not buried. They are not forgotten. They are not negotiable. That record is our irreducible legacy. It is the ground upon which any future justice, any future accountability, any future understanding must be built. It is the foundation, however cracked the walls standing upon it may be.

  The bargain was conditional. The condition was largely ignored. The amnesties granted stand, legally, but their moral weight is corroded by the state’s inaction. The acknowledgment we produced stands, unshaken. It is the unyielding fact.

  We did not give you healing. We did not offer closure. We did not set you on a journey's end. We gave you the record. We gave the state the duty to enforce the consequences of that record. The state has largely defaulted on that duty. That default does not erase the record. It makes the record an indictment not only of the past, but of the present.

  Acknowledgment is not an end. It is a beginning. It is a demand. The demand remains. It echoes in this chamber. It is carried by the names in the report. It is carried by the families who wait. It is carried by the unprosecuted names. It is carried by the unpaid reparations. The demand is for the state to finally meet its obligations – not under our agreement, but under the most basic compact of law and decency.

  The record stands. The duty remains. We mark the anniversary of the report. We do not mark the fulfillment of its promise. That work is still undone. Let this gathering be a reminder: the ledger is open. The debt is due. The acknowledgment demands it. Thank you.
