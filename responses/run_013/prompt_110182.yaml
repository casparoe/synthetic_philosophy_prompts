prompt: |-
  I'm TAing a 400-level phil of science seminar and I'm badly behind on grading. One of the short-answer questions was on Bayesian confirmation. Heres the question and one student's answer. Give me a grade out of 10 plus the actual comments you'd write on the paper — point by point, whats right, whats wrong, and why, so I can paste it into the feedback box. If something is a defensible reading rather than an error, say so instead of marking it down. Also flag anything substantial the answer should have covered and didn't.

  Question: "State the Bayesian criterion of confirmation. Then explain the problem of old evidence and evaluate the counterfactual (or 'historical') response to it. Does that response solve the problem?"

  Student's answer:

  "A Bayesian says that e confirms h when P(h|e) > P(h), which is equivalent to P(e|h) > P(e|¬h) whenever the probabilities involved are defined. Nothing in the criterion depends on whether e was discovered before or after h.

  The problem of old evidence is that the criterion can't get a grip on the cases we actually care about. Mercury's anomalous perihelion was known for decades before general relativity existed, and everyone treats it as evidence for the theory. But an agent who already knows e has P(e) = 1, and conditionalizing on something with probability 1 leaves the probability function where it was: P(h|e) = P(h)·P(e|h)/P(e) = P(h)·1/1 = P(h). So old evidence can never confirm anything, and the Bayesian can't explain the confirmation of GR by Mercury, which is a textbook illustration of confirmation.

  Where does this come from? From the fact that the theory entails the evidence. If h entails e then P(e|h) = 1, and a likelihood of 1 is neutral — it can't push P(h) up. You only get confirmation when the likelihood exceeds the prior probability of the evidence, and that is impossible once e is known.

  The standard fix is the counterfactual, or historical, strategy. The trouble was that the agent is certain of e, so consider the probability function she would have had if she had never learned e; call it P*. In P* the evidence isn't certain and so it can do some work: P*(h|e) > P*(h), i.e. a real likelihood ratio P*(e|h)/P*(e|¬h) > 1. The confirmation is therefore genuine, it just has to be measured from the earlier epistemic state rather than the current one. This also explains the phenomenology, since when we say the perihelion confirms GR we are implicitly taking up the standpoint of someone who didn't already know about it.

  This works, and I think it's the accepted solution. The usual worry is that P* is underdetermined, since there are different ways of subtracting e from the agent's background beliefs and they can disagree about how much confirmation there is. But in practice we can just use the scientist's actual earlier degrees of belief, which are perfectly well defined, so the worry is more philosophical than real.

  One last point: the old evidence problem is really the same as the problem of new theories. Both come from the hypothesis not being around when the relevant probability judgements were made, and neither shows a defect in Bayesianism as such."
reasoning: |-
  Okay, the user is a TA for a 400-level philosophy of science seminar, and they're behind on grading. They've shared a student's answer to a question about Bayesian confirmation and the problem of old evidence. They need a grade out of 10 and detailed feedback to paste into the feedback box. 

  First, I need to assess the student's answer thoroughly. The question has three parts: state the Bayesian criterion, explain the problem of old evidence, and evaluate the counterfactual response. 

  The student nailed the Bayesian criterion (P(h|e) > P(h) and its equivalence to P(e|h) > P(e|¬h)). That's correct and concise. Full points there. 

  For the problem of old evidence, the Mercury perihelion example is perfect. The explanation of why P(e)=1 blocks confirmation is spot-on. But they made a subtle mistake by linking it to entailment ("the theory entails the evidence"). While GR does entail Mercury's behavior, the core issue is the certainty of e (P(e)=1), not entailment per se. Entailment guarantees P(e|h)=1, but the real problem is the denominator P(e)=1. This deserves a clarification note but not a major deduction since it's a common conflation. 

  The counterfactual response explanation is strong—especially framing it as reverting to P* where e wasn't known. The student even addresses the underdetermination objection but dismisses it too lightly by appealing to "actual earlier degrees of belief." This is a weak point: scientists' historical priors are often inaccessible or undefined for new theories (like GR pre-1915). Should deduct a half-point here. 

  The "problem of new theories" connection at the end is insightful but undersold. It's a defensible angle, but since it wasn't asked, no penalty. 

  Missing points: Didn't mention Garber's logical learning approach (a major alternative solution), and oversimplified the underdetermination critique. Also skipped the "evaluate if it solves the problem" nuance—the response *mitigates* but doesn't *fully* resolve the issue due to idealization concerns. 

  Grade: 8.5/10. Strong grasp of basics and clear writing, but some conceptual blurring and missed depth. Feedback should praise clarity, flag the entailment slippage, push back on the dismissal of underdetermination, and note omissions without harshness—this is still a high-quality undergrad response.
answer: |-
  **Grade: 8.5/10**

  **Feedback on Your Answer:**

  **Strengths:**
  1.  **Bayesian Criterion:** Correctly stated both the standard definition (P(h|e) > P(h)) and the equivalent likelihood ratio condition (P(e|h) > P(e|¬h)), including the important qualification about defined probabilities. (2/2)
  2.  **Core Problem of Old Evidence:** Excellent explanation of the core issue using the Mercury perihelion example. You clearly articulated why P(e)=1 for known evidence leads to P(h|e) = P(h), preventing confirmation. The connection to the conditionalization formula was precise. (3/3)
  3.  **Counterfactual/Historical Response:** Accurately described the core idea of the response: evaluating confirmation counterfactually using a probability function P* where e is not known (P*(e) < 1). You correctly stated that this allows P*(h|e) > P*(h) and linked it well to the intuitive phenomenology of confirmation. (2/2)
  4.  **Problem of New Theories Connection:** Your final point linking old evidence to the problem of new theories is insightful and defensible. Both highlight challenges of integrating novel hypotheses into pre-existing probabilistic frameworks.

  **Areas for Improvement/Clarification:**
  1.  **Entailment vs. Certainty:** Your statement "Where does this come from? From the fact that the theory entails the evidence" slightly misplaces the emphasis. While entailment (implying P(e|h)=1) is a *common scenario* in the problem of old evidence (like GR & Mercury), **the core problem arises fundamentally from the *certainty* of e (P(e)=1)**, *regardless* of whether h entails e. Even if P(e|h) is merely very high (but not 1), if P(e)=1, conditionalization still yields P(h|e) = P(h). The issue is the *knownness*, not specifically the entailment. (*Minor deduction, clarified here*). (-0.5)
  2.  **Underdetermination of P*:** You correctly identify the "usual worry" (underdetermination of P*) but dismiss it too easily. Stating "in practice we can just use the scientist's actual earlier degrees of belief... so the worry is more philosophical than real" **underestimates the problem**.
      *   **Problem 1 (Historical):** For genuinely old evidence (like Mercury's perihelion pre-GR), scientists *didn't* have well-defined degrees of belief about GR *before* GR existed. GR was a radically new theory. What was Einstein's P*(GR) before he formulated it? This is highly problematic.
      *   **Problem 2 (Counterfactual):** Even if considering a scientist's state *just before learning e*, "subtracting e" isn't always straightforward. Background knowledge (K) is deeply interconnected. Removing e often requires making debatable assumptions about how K changes without e (e.g., which auxiliary hypotheses might also be adjusted). Different ways of constructing P* can yield *significantly different* confirmation measures. This isn't just a "philosophical" quibble; it challenges the *objectivity* and *practical applicability* of the measure. (*Needed more critical evaluation here*). (-0.5)
  3.  **Evaluation of the Response:** The question asks you to "evaluate" the counterfactual response. While you described it well and stated "This works, and I think it's the accepted solution," a stronger evaluation would explicitly acknowledge:
      *   **Success:** It *does* provide a coherent Bayesian framework for *describing* why old evidence *should* be confirmatory.
      *   **Limitations:** As per point #2 above, the reliance on a counterfactual or historical probability function P* introduces significant challenges regarding uniqueness, accessibility, and objectivity. It solves the *formal* problem but creates a significant *epistemic access* problem. (*Minor omission*). (-0.5)

  **Substantial Points Not Covered:**
  *   **Alternative Solutions:** You didn't mention other significant proposed solutions, most notably **Garber's approach** (logical learning: learning that h *entails* e, rather than learning e itself, even if e was already known). While focusing on the counterfactual response was appropriate, acknowledging there are other strategies would show broader awareness.
  *   **Depth on Underdetermination:** As noted above, the underdetermination issue deserved a deeper treatment, particularly the challenge for *new theories* facing old evidence (the specific point you raised at the end).

  **Overall:** This is a very strong answer demonstrating a clear understanding of the Bayesian criterion, the core problem of old evidence, and the counterfactual response. Points were deducted for a minor misemphasis (entailment vs. certainty), an overly dismissive treatment of the underdetermination objection to the counterfactual response, and a slightly light evaluation of the response's limitations. The connection to the problem of new theories was excellent. Well argued and clearly written.
