  First, I need to unpack the phrase. It's used to excuse past figures by claiming they couldn't have known better due to their era. But the user suspects it's doing multiple jobs. Let me list possible interpretations. Start with empirical claims: what were the actual norms back then? Were there contemporaries who opposed those norms? For example, if others at the time spoke against slavery, then the defense weakens.

  Next, normative claims. These are about moral responsibility. Is someone only blameworthy if they violated known standards? Or is morality timeless? Also, the phrase might imply that holding past figures to modern standards is unfair. But then, why do we praise those "ahead of their time"? That's a contradiction worth exploring.

  The user mentioned Columbus, Jefferson, Churchill as examples. Each represents different challenges. Columbus might have been extreme even for his time, Jefferson held slaves despite enlightenment ideals, Churchill's actions during the Bengal famine. These cases test the various readings of the phrase.

  I should also consider the phrase as an indictment of the era, not the individual. And note when it's a platitude—true but irrelevant. The user wants clarity on which arguments are settled versus debated in academic circles. For example, historians agree on empirical facts about what was known or debated in a period, but philosophers disagree on moral relativism vs. objectivism.

  The user's deeper need might be to effectively counter the brother-in-law's argument without getting tangled in complex philosophy. They need clear, distinct points to reference during discussions. Highlighting smuggling—when empirical claims hide normative ones—is crucial. They also want to avoid presenting contested theories as consensus.

