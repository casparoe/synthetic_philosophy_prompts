  - Is accusing someone of manipulation (like Brabantio does) itself a way of denying agency? 
  - Can manipulation exist without deception, given the handkerchief is real evidence weaponized? 

  Their desired direction is practical: which scenes illuminate or challenge theory, whether accounts survive the play's complexity (Iago's incoherent motives!), and what the play adds to philosophical debates. Their hunch about trust betrayal over autonomy failure feels crucial. 

