prompt: |-
  I'm a philosophy PhD student working on idealization in theories of welfare, and there's a failure mode I keep running into that I have never found a name for. The pattern is this: an account says that something is good or bad for a person just in case an idealized counterpart of her — fully informed, internally coherent, reasoning without error — would favor or disfavor it. Each such account sounds fine in the abstract, but it seems to break in precisely the cases where its idealizing condition is met. The counterpart who satisfies the condition is not the person whose good is at issue: she has different attachments and projects, and the fact that she satisfies the condition changes the very facts the account was meant to track. So the biconditional comes out false whenever its left-hand side holds, and remains merely untested otherwise. I notice this in idealized-advisor accounts of welfare, in "what she would want if she knew more and were more the person she wished she were" glosses on someone's good, and in the coherence conditions built into extrapolated-preference proposals. Is there an established term for this failure mode? If there is, I need to know how it is distinguished from the neighboring complaints — that the counterpart is simply a different subject, and that such accounts are circular or uninformative — because I suspect these are being run together under one heading. If there is no term, I would want one coined, with a definition and boundary cases; a bare label would not help me.
reasoning: |-
  Okay, the user is a philosophy PhD student working on idealization in theories of welfare. They've encountered a recurring problem where idealized accounts of welfare break down when the idealization conditions are met. The core issue is that the idealized counterpart, being fully informed and coherent, ends up having different attachments and projects than the actual person, so the biconditional fails precisely when it should hold. 

  The user wants to know if there's an established term for this failure mode. They also want to distinguish it from related criticisms like the "different subject" problem or circularity. If no term exists, they need a coined term with clear definition and boundaries.

  First, I need to recall existing critiques in welfare philosophy. The "different subject" objection is common—Parfit’s Repugnant Conclusion touches on identity changes under idealization. But the user’s issue is more specific: the breakdown when the left-hand side (actual welfare) aligns with the idealization, causing the counterpart to diverge. That’s distinct. 

  Next, circularity/uninformativeness: accounts like Railton’s are criticized for being circular if "what’s good" defines the idealization, but here the problem is the counterpart’s transformed identity under idealization, not definitional loops. 

  So no existing term fits perfectly. Time to coin one. The key elements: idealization annihilating the very properties it’s meant to evaluate. "Annihilation" captures the destructive shift, "referential collapse" hints at the semantic failure of "for S." Need a phrase that’s precise yet evocative. 

  "Referential Collapse of the Idealized Subject" (RCIS) works. Definition must clarify the biconditional’s breakdown when LHS holds. Boundary cases: distinguish from "different subject" (which is about metaphysical identity) and circularity (about justification). Examples help—imagine a scholar whose passion fades under full knowledge; the ideal counterpart’s disfavor doesn’t reflect actual welfare loss. 

  User’s deeper need: precision in their dissertation. They might be wrestling with conflated critiques in literature. Naming RCIS gives them a tool to disentangle this and refine their argument. Also, they’ll appreciate the coinage’s grounding in existing debates (e.g., Railton, Sobel) while carving new space. 

  Finally, stress test RCIS: does it cover cases where idealization alters values without identity change? Yes—if projects morph under coherence, even if metaphysically "same" person, referential intent ("for S as they are") collapses. That’s the crux.
answer: |-
  Your description captures a profound and under-discussed flaw in idealized-subject theories of welfare. While related to the "different subject" problem and circularity concerns, the specific failure mode you identify—**where the satisfaction of the idealization condition *itself* annihilates the properties that make the welfare judgment *about the actual subject*—lacks a standard term.** I propose naming it:

  ### **Referential Collapse of the Idealized Subject (RCIS)**  
  *(or: Idealization-Induced Referential Failure)*

  **Definition:**  
  RCIS occurs when an idealized-subject account of welfare (e.g., "X is good for S iff S⁺ would favor X") fails because the process of idealization (e.g., full information, coherence, error-free reasoning) *transforms S⁺ into an entity whose evaluative perspective is no longer anchored to the constitutive attachments, projects, or identity-grounding features of S*. Consequently, the biconditional breaks:  
  - **When the LHS holds** (X *is* actually good for S), S⁺’s divergence from S’s actual identity means S⁺ may *not* favor X, falsifying the RHS.  
  - **When the LHS is false** (X is *not* good for S), S⁺’s verdict is irrelevant to S’s actual welfare, leaving the biconditional vacuously true or untestable.  

  ---

  ### **Boundaries & Distinctions from Neighboring Critiques**  
  1. **vs. "Different Subject" Objection (e.g., Parfit):**  
     - **Different Subject:** Claims S⁺ is *numerically distinct* from S (e.g., due to radical preference shifts under idealization).  
     - **RCIS:** Focuses on *referential failure*, not metaphysical identity. Even if S⁺ is "the same person" metaphysically, her transformed perspective severs the link between her judgment and what is good *for S-as-she-actually-is*.  
     - *Example:* S is a devout artist whose identity hinges on faith and creative struggle. S⁺ (fully informed) becomes an atheist scientist. Different-subject: "S⁺ isn’t S." RCIS: "Even if S⁺ is S, her disfavoring art/faith doesn’t entail art/faith isn’t good for the *actual* S."  

  2. **vs. Circularity/Uninformative Critique:**  
     - **Circularity:** The account defines "good for S" using S⁺’s desires, but S⁺’s desires are defined *in terms of what is good for S* (e.g., via the idealization criteria).  
     - **RCIS:** Grants the idealization is defined non-circularly (e.g., "full non-moral information"). The flaw is that satisfying those *very conditions* detaches S⁺’s judgments from S’s actual welfare.  
     - *Example:* S⁺’s coherence is stipulated procedurally. Circularity: "Coherence is defined as tracking welfare." RCIS: "Even with procedural coherence, S⁺’s coherent preferences ignore S’s actual identity-conferring commitments."  

  3. **vs. Epistemic Opacity:**  
     - **Opacity:** We can’t *know* what S⁺ would want.  
     - **RCIS:** The issue isn’t epistemology; it’s that S⁺’s verdicts *systematically misrepresent* S’s welfare *when idealization conditions are met*.  

  ---

  ### **Key Mechanism: The Annihilation of Identity-Conferring Properties**  
  RCIS arises because the properties that make an outcome good *for S* (e.g., S’s core projects, affective ties, sense of meaning) are often *fragile under idealization*:  
  - **Full information** may reveal facts that dissolve S’s motivating illusions (e.g., learning one’s life’s work is trivial).  
  - **Coherence** may require abandoning "incoherent" but identity-defining commitments (e.g., a parent’s inconsistent love for a harmful child).  
  - **Error-free reasoning** might bypass the heuristic-driven passions that give S’s life value.  

  The idealization doesn’t just *reveal* S’s "true" good—it *destroys* the conditions under which S’s actual good exists.  

  ---

  ### **Canonical Cases Demonstrating RCIS**  
  1. **The Disillusioned Scholar (Information-Induced Collapse):**  
     - *Actual S:* Finds deep fulfillment in researching a niche theory.  
     - *S⁺ (fully informed):* Knows the theory is definitively false; abandons it as pointless.  
     - **RCIS Problem:** Research *is* good for actual S. S⁺ disfavors it. The biconditional fails precisely because S⁺ satisfies the idealization.  

  2. **The Divided Parent (Coherence-Induced Collapse):**  
     - *Actual S:* Loves their morally corrupt child, deriving meaning from this bond despite cognitive dissonance.  
     - *S⁺ (fully coherent):* Resolves dissonance by rejecting the child (or the moral framework).  
     - **RCIS Problem:** The bond *is* good for S. S⁺’s coherent disfavor doesn’t track this.  

  ---

  ### **Why Existing Frameworks Miss RCIS**  
  - **Railton’s "Objective Interests"**: Defers to S⁺’s "non-moral" desires but assumes S⁺ retains S’s core cares. RCIS shows this is unstable.  
  - **Sobel’s "Full Information"**: Focuses on whether S⁺’s desires are *extrapolations* of S’s actual desires. RCIS highlights cases where idealization *blocks* extrapolation by annihilating the desire’s basis.  
  - **Adaptive Preference Critiques**: Target oppression-distorted desires but don’t address how *non-oppressive* idealization can destroy authentic goods.  

  ---

  ### **Defending the Term**  
  **"Referential Collapse"** emphasizes that the idealization voids the semantic link between "good for S" and S⁺’s judgment. **"Idealized Subject"** centers the agent whose transformation triggers failure. This distinguishes RCIS from broader complaints while pinpointing the *performative contradiction* in the theory: *Using S⁺ to define welfare for S works only when S⁺ is not idealized enough to cease being "S-relevant."*  

  This term should arm you to disentangle RCIS from adjacent objections and reveal a deeper instability in idealization-based welfare theories. If you develop this further, I’d suggest engaging with David Velleman’s work on identity-conferring commitments and David Enoch’s critiques of idealization in moral philosophy.
