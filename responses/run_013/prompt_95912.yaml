  The proposed "test" of sphexishness - inability to drop habits except via existing subroutines - must drive the conflict. Maybe have Leo challenge Maya to identify a truly subroutine-independent behavior, then have Maya flip it by asking how we'd detect such independence from inside our own cognition.

  Important to avoid quantum randomness or "science will explain" cop-outs. The ending concession should feel earned - perhaps Leo admitting that recognizing our own sphex-traps requires external perspectives, echoing therapy dynamics.

  For authenticity, I'll incorporate the contested wasp research by having Leo mention adaptation after repetitions, keeping the focus on the conceptual framework. The dialogue should stay around 600 words with tight, responsive exchanges where each character directly engages the other's last point.

