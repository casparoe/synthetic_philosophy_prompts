prompt: |-
  ok so I'm writing the framing chapter of my thesis and I keep hitting the same wall. The whole chapter rests on one sentence: science makes progress toward the truth even though its theories keep turning out to be false. Everybody nods at that sentence. I want to know what it would actually take to earn it, so before I read one more thing on the subject: write me the desiderata. The full requirements list for an adequate account of truthlikeness (closeness to truth, verisimilitude, whatever you want to call it) -- what any such account has to get right, the case or consideration behind each requirement, and which ones are non-negotiable versus which are just the taste of one camp.

  A few I'm already sold on, so you know the register. It has to rank some false theories above other false theories; if every false theory comes out equally far from the truth, my sentence is empty. It can't flip the ranking when I redescribe the same theory in a different but intertranslatable vocabulary, because otherwise closeness to truth depends on which words I happened to use. And it can't let me inflate a theory by bolting on true-but-irrelevant claims.

  Three more I've been argueing about with my office mate, and I suspect these are the real ones:

  (i) Should the account be answerable to practice? I want a false theory that's closer to the truth to also be the one that predicts and controls better. He says that's just confirmation theory sneaking back in; I say if the two can come completely apart, then 'closer to the truth' is doing no work and I should delete the sentence.

  (ii) The relabeling case. A theory that gets every prediction right and has the right structure but is wrong about which entity is which -- intuitively that's the same theory, or maximally close. Any account that just counts true sentences will call it badly wrong, because the sentences that identify the entities come out false. Is that a requirement, or am I smuggling in a whole seperate structuralist picture of what a theory is?

  (iii) Idealization. What does the account say about a theory that's false only because it idealizes -- no friction, point masses, perfect gases? Close to the truth, or not even in the running for truth and falsity? Because that's most of what my science actually uses, and an account that's silent there is silent where it matters.

  Then the part I most want: which of these requirements are in tension with each other, and whether some subset is jointly unsatisfiable -- if so, say so, that's a result, not a failure. And tell me which single requirement does the most damage to the popular families of account: the ones that define closeness as having more true and fewer false consequences, and the ones that define it as similarity to the truth among models or possible worlds. You know the families. Skip the scorecard, I'll do that part myself.
reasoning: |-
  Okay, the user is working on their thesis framing chapter about scientific progress and truthlikeness. They've hit a wall with the core idea that science progresses toward truth even when theories are false. They want a clear list of requirements (desiderata) for any adequate account of truthlikeness. 

  First, I need to unpack what they're really asking. They're not just seeking definitions—they want to know which criteria are essential versus debatable, where tensions exist between requirements, and which popular theories fail key tests. Their frustration is palpable—they've been arguing with their office mate about three specific pain points (practical utility, relabeling, idealization), and they want clarity before drowning in more literature.

  The user's implicit needs jump out: 
  - They need structural rigor for their thesis argument but fear getting lost in philosophical weeds. 
  - They're wrestling with how much to ground truthlikeness in scientific practice versus abstract principles. 
  - The idealization point is urgent—their field uses idealized models constantly, so any account ignoring this is useless to them. 
  - Underneath it all, they want permission to reject certain accounts if tensions are irreconcilable ("that's a result, not a failure").

  Their listed "sold on" criteria are solid: 
  1. Must rank false theories (otherwise "closer to truth" is meaningless). 
  2. Must be invariant under linguistic redescription (truthlikeness can't depend on wording). 
  3. Must avoid "bolt-on" inflation (adding irrelevant truths shouldn't boost score). 

  The office-mate debates are the crux: 
  - (i) Practical utility: User insists truthlikeness must correlate with predictive power; office-mate calls this conflation. Both have points—if they diverge completely, truthlikeness becomes metaphysically idle. But insisting on perfect alignment might ignore cases where false models predict well by accident. 
  - (ii) Relabeling: User feels isomorphic theories (same structure, wrong labels) should count as close. But if truth is propositional, mislabeling entities makes core sentences false. This cuts to the heart of what theories *are*—structures or sets of statements? 
  - (iii) Idealization: User's daily work uses idealized models (frictionless planes, etc.). If these aren't "close to truth," the account fails real science. But are they false-yet-close or not truth-apt at all? 

  Now for tensions: 
  - Practical utility vs. linguistic invariance: If truthlikeness requires predictive success, but predictive success changes under redescription (e.g., rebranding "phlogiston" as "oxygen" in old texts), the rankings might flip—violating invariance. 
  - Structural relabeling vs. propositional accounts: If truth is about sentences, isomorphic but mislabeled theories bomb. But if we switch to model-theoretic views (e.g., similarity between structures), relabeling becomes trivial—yet this might decouple from predictive control. 
  - Idealization vs. "more true consequences": Idealized models have fewer true consequences (they oversimplify), so consequence-based accounts mark them as very false. Yet scientists know they're often "close." 

  The most damaging requirement? Likely idealization. It torches both major families: 
  - Consequence approaches (Popper, Miller) fail because idealized theories have few true consequences. 
  - Similarity approaches (Tichý, Niiniluoto) struggle because idealizations (e.g., point masses) aren't "similar" to messy reality. 

  But structuralist accounts (e.g., partial isomorphism) handle idealization better by capturing approximate structure. The catch? They might decouple from predictive success (e.g., a structurally similar model could predict poorly if misapplied). 

  Final note to user: Your office-mate debates reveal core fault lines. Practical utility is negotiable if you accept truthlikeness as explanatory (not pragmatic). Relabeling requires choosing a theory ontology (propositions vs. structures). Idealization is non-negotiable for your work—prioritize accounts that address it, even if they're messier.
answer: |-
  Here's a rigorous desiderata list for truthlikeness, grounded in philosophical rigor and your practical concerns. I'll structure it as non-negotiable ("N"), contested but essential for your thesis ("C"), and taste-based/camp-specific ("T"). Crucially, I'll highlight tensions and the "damage" point.

  **Core Desiderata (The "Must-Haves")**

  1.  **Non-Trivial Ordering (N):** The account must rank *some* false theories as closer to the truth than *some other* false theories.
      *   *Case:* If all false theories are equally distant (Popper's initial problem), the concept is useless for explaining progress through falsified theories. Your core sentence collapses.
  2.  **Value of Truth (N):** The complete truth must be maximally truthlike (closer than any false theory).
      *   *Case:* The fundamental point of inquiry. An account where a false theory could be "closer" than the truth is nonsensical.
  3.  **Value of Content (N):** Adding (logically independent) truths to a theory cannot *decrease* its truthlikeness, and adding falsehoods cannot *increase* it.
      *   *Case:* Captures the intuition that knowing more truths (even if mixed with falsehoods) is generally better. Precludes the "bolt-on" inflation you mentioned - adding irrelevant truths *can* increase truthlikeness (it's adding truths!), but this desideratum prevents it from *decreasing* it. The problem you identified is handled by *Relevance* (#9 below).
  4.  **Logical Invariance (Formality) (N):** The truthlikeness ranking of theories must be invariant under logical equivalence and, crucially, under *meaning-preserving re-description* (intertranslatable vocabularies, isomorphic structures).
      *   *Case:* Truthlikeness is about the world, not our arbitrary linguistic or formal choices. A theory shouldn't jump in rank just because we rename entities or use a different but equivalent logical formalism. This directly addresses your vocabulary concern.
  5.  **Asymmetry (N):** If theory A is closer to the truth than theory B, then B cannot be closer to the truth than A. (Total ordering is desirable but may be too strong; asymmetry is fundamental).
      *   *Case:* Basic requirement for a coherent comparative concept.

  **Your Office Mate Debates (The "Make-or-Break" for Your Thesis)**

  6.  **Link to Predictive/Instrumental Success (C):** A theory that is closer to the truth should, *ceteris paribus* and in the *appropriate domain*, generally yield better predictions and afford better control than a theory farther from the truth.
      *   *Case:* (Your Argument) If truthlikeness consistently *diverges* from predictive power, it becomes explanatorily inert for scientific *practice*. Why call it "closer to truth" if it doesn't manifest in better interaction with the world? This justifies the scientist's intuition driving your core sentence.
      *   *Office Mate's Argument:* Predictive success is about confirmation, empirical adequacy, and pragmatics. Truthlikeness is a metaphysical/epistemic relation. They *could* come apart (e.g., a radically false but predictively successful "demon" theory). Forcing a link conflates distinct concepts.
      *   *Verdict (For You):* **Non-negotiable for your thesis framing.** If truthlikeness doesn't *generally* underwrite predictive success, your sentence *is* empty for explaining scientific progress as practiced. You need this link.
  7.  **Isomorphism/Structure Preservation (C - "The Relabeling Case"):** Two theories that are structurally isomorphic (same functional relationships, causal roles, etc.) but differ only in the *labels* assigned to theoretical entities should be deemed equally truthlike (or very close), *even if one uses the "correct" labels and the other uses "wrong" labels*.
      *   *Case:* (Your Intuition) Science often identifies structure before ontology (e.g., wave equations before knowing what's waving). A theory capturing the *structure* of the world perfectly but misnaming the entities feels profoundly close to truth. Denying this seems pedantic and ignores how theories represent.
      *   *Counter-Case:* Truth is propositional. The sentence "Entity X has property P" is fundamentally different from "Entity Y has property P" if X ≠ Y. An account based on true consequences *must* mark the mislabeled theory as highly false.
      *   *Verdict:* **Contested but essential for your framing.** This *does* presuppose a structuralist view. If you reject this, you need an account that explains *why* the mislabeled theory is still highly successful *despite* being propositionally very false. This is a major fork in the road.
  8.  **Handling Idealization (C):** An idealized theory (e.g., frictionless planes, point masses, ideal gases) that is known to be literally false but highly successful within a well-defined domain must be deemed closer to the truth than a theory that is also false but fails to capture any significant aspect of the target system accurately, and often closer than more complex but less predictively powerful alternatives.
      *   *Case:* (Your Knockdown Argument) Idealizations are the workhorses of science. An account that dismisses them as simply "false" (and thus, on many accounts, maximally or randomly distant) fails to engage with scientific reality. Their success *demands* explanation in terms of truthlikeness.
      *   *Challenge:* Idealizations often involve deliberate distortions (e.g., infinite limits, zero values). How can deliberate falsity be constitutive of closeness to truth?
      *   *Verdict:* **Non-negotiable for your thesis (given your field).** An account silent or hostile to idealization is useless for your purpose.

  **Other Important Desiderata (Mix of N, C, T)**

  9.  **Relevance/Intrinsicness (C/T):** Truthlikeness should depend primarily on the *relevant* truths and falsehoods a theory expresses about its intended domain. Adding irrelevant truths (even many) should not *significantly* inflate truthlikeness beyond their intrinsic value. *(This refines "Value of Content" to block trivial inflation - your "bolt-on" concern. Degree of "C" vs "T" depends on how "relevance" is defined).*
  10. **Problem Dependency (C/T):** Truthlikeness might be relative to a specific set of questions or a target subdomain of the world. A theory might be closer regarding planetary orbits but farther regarding stellar composition. *(Contested: Some see truthlikeness as global, others as contextual).*
  11. **Compatibility with Fallibilism (N):** The account must allow that we can *recognize* one theory as more truthlike than another without knowing *the whole truth*. *(Essential for the concept to be usable).*
  12. **Comparative Judgments (N):** The account must allow meaningful comparisons even between theories neither of which is strictly logically entailed by the other. *(Crucial for historical progress).*
  13. **Gradual Improvement (N):** It should be possible for truthlikeness to increase incrementally through sequences of theories. *(Reflects scientific practice).*
  14. **Avoidance of "Language Dependence" (N):** Beyond logical equivalence, the account shouldn't be overly sensitive to the *contingent* expressive resources of a particular language (e.g., adding a new predicate shouldn't radically change existing rankings without new information). *(Strengthens Logical Invariance).*

  **Crucial Tensions & The "Damage" Point**

  1.  **Link to Practice (6) vs. Isomorphism (7) vs. Propositional Accounts:** This is the core tension for your framing. Propositional/Consequence-based accounts (Popper's initial attempt, some refinements) **fail miserably at Isomorphism (7) and Handling Idealization (8)**. The mislabeled theory and the idealized theory have *massive* numbers of *false* atomic/contingent consequences. They often struggle with **Logical Invariance (4)** if the language changes significantly. They *can* potentially satisfy **Link to Practice (6)** *if* predictive success correlates with having more true consequences of the right kind, but this link is fragile and often breaks under analysis (e.g., irrelevant truths boost score without aiding prediction). **Damage:** Propositional accounts are **devastated by (7) and (8)**, which you deem essential. They struggle with (4) and make (9) very hard.
  2.  **Isomorphism (7) & Idealization (8) vs. Value of Truth (2) & Value of Content (3):** Structuralist/model-theoretic accounts (e.g., partial isomorphism, similarity of possible worlds/states) handle **Isomorphism (7)** naturally (structure matters, labels less so) and **Idealization (8)** better (similarity can be graded; idealized models are similar *in relevant respects*). They usually satisfy **Logical Invariance (4)**. However, the **Link to Practice (6)** becomes *explanatorily demanding*: *Why* does structural similarity imply predictive success? This needs argument (e.g., similar structures generate similar behaviors under similar conditions). They also face challenges defining the *relevant* structure/similarity measure and ensuring **Value of Truth (2)** is strictly maximal (is the *real* world always the unique best match?). **Damage:** The **single most damaging requirement across families is Handling Idealization (8)**. It brutally exposes the limitations of naive propositional counts and demands structural/similarity-based approaches. However, **Link to Practice (6)** remains a challenge *to justify* within structuralist accounts, even if they are compatible with it.
  3.  **Relevance (9) vs. Formality (4, 14):** Defining "relevance" rigorously without introducing problematic subjectivity or language dependence is extremely difficult. A purely syntactic or model-theoretic account struggles. This often pushes accounts towards pragmatic or contextual elements (Problem Dependency (10)).

  **Conclusion for Your Framing**

  *   **Non-Negotiable for You:** (1), (2), (3), (4), (6), (8). (7) is almost certainly needed too, unless you abandon structural intuitions.
  *   **The Critical Tension:** You need an account that satisfies the **Link to Practice (6)** while also handling **Idealization (8)** and (likely) **Isomorphism (7)**. Propositional/consequence-based accounts are **out**. Model-theoretic/structuralist/similarity-based accounts (Niiniluoto's minsum, Schurz & Weingartner's relevant consequence approach, partial isomorphism/structure approaches) are your primary candidates.
  *   **The Hard Sell:** Be prepared to explicitly argue within your framing chapter *why* **Link to Practice (6)** *must* be satisfied and *how* your chosen account of truthlikeness (implicitly or explicitly) underwrites this link. You will need to bridge the metaphysical/epistemic (truthlikeness) and the pragmatic (success). Focus on how capturing relevant structure (Isomorphism (7)) and relevant aspects of the target system, even via idealizations (8), is what *enables* predictive and instrumental success (6). This is where your core sentence earns its keep.
  *   **Idealization is the Key:** Frame your exploration around (8). Any account that cannot explain why an ideal gas law is closer to the truth than, say, the phlogiston theory *or* an overly complex, unusable model of gases, is inadequate for your purpose. This immediately disqualifies vast swathes of the literature.

  This gives you the philosophical "spec sheet" and the fault lines. Now you can dive into the literature (Tichý, Miller, Oddie, Niiniluoto, Kuipers, Schurz, Psillos, Chakravartty etc.) equipped to evaluate them ruthlessly against *your* non-negotiables, especially (6), (7), and (8). Good luck!
