prompt: |-
  I'm putting together handouts for a grad seminar on self-locating belief and decision theory, and I need a thought experiment built to order. Act like someone who actually works on anthropics — I don't want a wikipedia summary, I want you reasoning like a philosopher.

  The spec: I want a case where the self-sampling assumption and the self-indication assumption give opposite verdicts on a decision — an actual choice a person makes, not a question about which cosmological theory is true. And I want it to be a choice a normal adult could plausibly face: work, family, health, money, civic life. No infinite universes, no Boltzmann brains, no simulation hypothesis, no many-worlds, no time travel, and please god not another Sleeping Beauty with the memory wipe.

  Now, the only lever these two assumptions pull on differently is the number of observers, so I'm not asking you to avoid that — the consequences of the choice have to include how many observers there end up being. What I *am* asking you to avoid is just putting the presumptuous philosopher in new clothes. If the whole engine of the case is "one hypothesis implies more total observers than the other and you're placing a bet on which hypothesis is true," my students will smell it from the door, so dont do that.

  Deliverables, in order:

  1. The scenario, one tight paragraph, realistic, no gadgets.
  2. The decision and the two options, stated plainly.
  3. The self-sampling reasoning and the self-indication reasoning, side by side, each showing the actual numbers or ratios it's trading on. I'm going to check this part.
  4. The single feature of the case that makes them come apart, and then the variant where you remove that feature and the two assumptions snap back into agreement — and if they don't snap back, say so and explain why.
  5. The strongest objection from someone who thinks the self-indication assumption is obviously false, and the strongest from someone who thinks the self-sampling assumption is obviously false, and whether the case survives either.

  I want you committed. Pick one case, tell me it's the right one, and defend it. Dont hand me three half-built sketches and shrug. Before the final version, brainstorm two or three candidate structures in a couple of lines each, kill the ones you kill, and say why you killed them. Take your time on step 3 — thats where these things usually fall apart. And at the end tell me straight which assumption you think the case actually favors, and why — don't leave it hanging.
reasoning: |-
  Okay, I need to tackle this user's request. They're creating handouts for a grad seminar on self-locating belief and decision theory. The key is to design a thought experiment that pits the Self-Sampling Assumption (SSA) against the Self-Indication Assumption (SIA) in a realistic scenario without the usual sci-fi elements. 

  First, I recall that SSA says you should reason as if randomly selected from all actual observers, while SIA suggests you're more likely to exist in a world with more observers. The challenge is to make them give opposite recommendations in a mundane decision context. 

  The user wants to avoid anything resembling the "presumptuous philosopher" setup where you just bet on which hypothesis has more observers. So I need a case where the decision affects future observer counts, not just reveals existing ones. 

  Brainstorming ideas:
  - **Healthcare policy**: Choosing between funding a fertility treatment or a life-saving program. But this might feel too much like population ethics rather than anthropics. 
  - **Job choice**: A position that influences family planning norms. Maybe a demographer role where your work could encourage or discourage large families? 
  - **Civic decision**: Zoning laws that affect urban density and thus future population. This could work if tied to personal consequences. 

  Settling on the "Urban Planner's Dilemma" where the protagonist votes on a development policy. Option A allows high-density housing (leading to more future people), Option B restricts it (fewer future people). The twist is that the protagonist's own existence depends on past similar policies - creating the needed observational selection effect. 

  For the decision: Voting for Policy A or Policy B. The key is that under SSA, you should vote for B to maximize your descendants' welfare since you're selected from existing observers. Under SIA, you vote for A because worlds with more observers are more likely. 

  The critical feature making them diverge is whether we include the observer who exists conditionally on the policy (the protagonist). If we remove that and make the protagonist's existence independent, both assumptions converge. 

  Strongest objections:
  - Against SIA: It leads to extreme conclusions like favoring large populations regardless of welfare. 
  - Against SSA: It ignores the indexical information that you exist. 

  I think the case favors SSA slightly because SIA's population boost seems unearned here, but it's deliberately balanced. The scenario survives both objections by focusing on the decision's local consequences.
answer: |-
  ### Anthropic Decision Case: The Urban Planner's Dilemma  

  **1. Scenario**  
  You're a mid-level urban planner in a rapidly growing city. Decades ago, a controversial housing policy ("Policy X") enabled high-density development in your district, accelerating population growth. Your parents moved here *because* of those jobs and affordable housing—meaning your existence depends on Policy X passing. Now, you're voting on "Policy Y": a near-identical proposal to expand density in another district. If Y passes, it will create jobs/housing for 100,000 new residents over 30 years, but strain infrastructure, slightly reducing expected quality of life for all future residents (including your descendants). If Y fails, growth stalls, resulting in only 10,000 new residents, but with higher average welfare. Your vote is pivotal.  

  **2. Decision & Options**  
  - **Option A**: Vote for Policy Y (high-density = 100K future people, lower average welfare).  
  - **Option B**: Vote against Policy Y (low-density = 10K future people, higher average welfare).  

  **3. Reasoning Side-by-Side**  
  | **Self-Sampling Assumption (SSA)** | **Self-Indication Assumption (SIA)** |  
  |-----------------------------------|-------------------------------------|  
  | You reason from a *random* sample of all *actual* observers (past, present, future). Total observers if Y passes: 110K (100K new + 10K existing). If Y fails: 20K (10K new + 10K existing). Your existence is *fixed*; you’re equally likely to be any observer in the actual world. | You condition on *your existence as evidence*. Worlds with more observers are more likely because you’re more probable in them. Prior to your existence, P(Y passes) = P(Y fails) = 50%. But your existence is evidence for worlds resembling the one that produced you (i.e., pro-density policies like X). |  
  | **Calculation**: If Y passes, 110K observers. Your descendants represent 1% of future observers. Expected descendant welfare = (99% × low welfare) + (1% × status quo). If Y fails, 20K observers. Descendants = 50% of future observers. Welfare = (50% × high welfare) + (50% status quo). **Verdict: Choose B** (failure)—your descendants dominate the future observer pool under B. | **Calculation**: Your existence proves pro-density policies (like X) exist. SIA updates P(Y passes | you exist) > P(Y fails | you exist). Ratio: P(you | Y passes) / P(you | Y fails) ≈ (100K observers / 10K observers) = 10:1. Thus, P(Y passes | you) ≈ 10/11. **Verdict: Choose A** (pass)—higher probability Y passes, and you’re "typical" in a large population. |  

  **4. Divergence Feature & Snap-Back Test**  
  - **Divergence Feature**: Your existence *causally depends* on a past policy identical to Y. SIA treats your existence as evidence favoring Y-like policies; SSA treats you as a fixed observer making choices for your lineage.  
  - **Variant (Remove Dependence)**: Suppose your parents moved here *randomly*, unrelated to Policy X. Now:  
    - SSA: Unchanged (still weights future observers equally).  
    - SIA: No evidence boost for Y (P(you | Y passes) ≈ P(you | Y fails)). **Snap-Back**: Both converge to B (failure) because no observer-count asymmetry favors A.  

  **5. Objections & Case Survival**  
  - **Anti-SIA Objection**: "SIA absurdly prioritizes large populations. Here, it ignores welfare to chase observer count, violating Pareto efficiency!"  
    - **Survival**: The case forces trade-offs—SIA doesn’t ignore welfare but discounts it against higher probability of Y being true. This is *anthropically consistent* evidence updating.  
  - **Anti-SSA Objection**: "SSA ignores indexical information! Your existence *is* data about Policy X’s success, so conditioning only on ‘actual observers’ is question-begging."  
    - **Survival**: SSA *does* use indexical data (you’re a sample), but doesn’t treat existence as evidence for *similar future policies*. The case highlights this nuance without equivocation.  

  **My Commitment**: This case favors **SSA**.  
  **Why**: SIA’s 10:1 probability ratio for Y is artificially inflated—it confuses correlation (past policy X enabled you) with causation (Y must pass). SSA correctly separates observer-count weighting from evidentiary reasoning. The welfare loss under Y is real; SIA’s "you’re probably in a big world" gamble ignores localized consequences for your descendants.  

  ---

  **Design Notes: Why This Case?**  
  - **Brainstormed Candidates**:  
    1. *Healthcare Funding*: Vote on fertility subsidies (more births) vs. longevity research (fewer births, longer lives). Killed—too close to "betting on total observers."  
    2. *Job Choice*: Take a high-risk job that, if successful, spawns a new industry town (many observers) vs. stable work (few). Killed—observer count difference was theoretical, not causal.  
    3. *Urban Planner*: Kept—ties personal existence to policy causality, embeds observer count in welfare trade-offs, avoids "cosmic" levers.  
  - **Why Step 3 Works**: SSA uses absolute observer counts for weighting decisions; SIA uses observer-relative likelihoods for updating beliefs. The numbers explicitly show SSA’s "descendant share" vs. SIA’s "probability boost."
