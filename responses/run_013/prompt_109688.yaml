prompt: |-
  I chair the acquisitions committee at a small contemporary art museum — five of us, maybe $200k a year to spend, eight or nine acquisitions, minutes go to the city because half our funding is public, so every purchase has to be defensible in one sentence. We've drifted into time-based and performance work and thats broken our process, because for a lot of what we now buy there's nothing to stand in front of: you buy a score and the right to stage it, or a nine hour video nobody on the committee has sat through, or a piece that only exists as documentation of a night that already happened.

  Our charter says the collection should be built on works of the highest quality, and I've realized that's a criterion none of us can honestly apply to anything we haven't experienced. There's an old idea in aesthetics — the acquaintance principle — that you can't genuinely judge a work's aesthetic value without experiencing it for yourself, and that someone else's verdict that a thing is beautiful or moving doesn't transfer to you as a reason to believe it. If that's right, then a good chunk of our acquisitions are being decided on grounds we can't state out loud.

  Please write me a decision procedure the committee can actually run at the table, in order, on any proposal: what to ask first, what counts as a sufficient answer to each question, where it stops with a no, and where it hands the decision to a person because the question is values rather than facts. It has to keep the distinctions that matter — between testimony about facts (provenance, condition, the artist's standing, whether a piece fits our holdings) and testimony that something is good, and between a work we've all seen and one we can't see at all — without turning into a lecture. We meet for 90 minutes, one of us is the only person who knows anything about video, and the treasurer has to sign off, so it has to be usable by people with no philosophy.

  Then run it on three proposals: a nine hour video that only the curator who proposed it has watched, and she says it's the best thing the artist has ever done; a performance work we'd own as a score plus rights, where two members saw different versions and came away loving and hating it; and a work nobody can see before we buy, because it's locked up in a private collection, cheap and historically significant, and everyone wants it. One of the three should come out against what I want. Also tell me where the procedure gets gamed — I'm worried someone will launder a taste verdict into a fact about art history to sneak it past step one — and what it flatly can't do.
reasoning: |-
  We are designing a decision procedure for an acquisitions committee that must be defensible in one sentence and respects the acquaintance principle (that aesthetic judgment requires personal experience). The procedure must separate factual testimony from value judgments and account for whether the committee has experienced the work.

  The key constraints:
  - 90-minute meetings, so the procedure must be efficient.
  - One video expert; others may lack specialized knowledge.
  - Treasurer must sign off, so financial aspects are important but not the focus here.
  - Minutes go to the city, so every purchase must be justifiable in one sentence.

  The procedure must:
  1. Handle cases where there is no physical object to stand in front of (e.g., performance scores, long videos, documentation).
  2. Distinguish between factual testimony (provenance, condition, artist standing, fit with collection) and aesthetic judgments.
  3. Account for whether the committee has experienced the work (or can experience it) and the limitations of partial experience.

  We'll design a step-by-step procedure that the committee can run in order for any proposal. Steps:

  **Step 1: Can we experience the work? (or have we already?)**
     - If the work is available for the committee to experience (e.g., watch the video, attend a performance, view documentation that is considered the work), then we must require that all committee members experience it (or a representative sample) before voting. For a 9-hour video, we might require watching a curated hour (agreed upon by the committee and the proposing curator) and reading a detailed summary of the rest. For a performance, we might require watching a video documentation if available, or if not, then we move to Step 2 with the caveat that we haven't experienced the actual work.
     - If the work is not available for experience (e.g., locked in a private collection, or a past performance with no documentation), then we skip to Step 2, but note that we are making a decision without direct experience.

     **Sufficient answer**: 
     - For a work that can be experienced: set a deadline for committee members to experience the work (or the agreed-upon sample) and reconvene.
     - For a work that cannot be experienced: note that the decision is being made without direct experience and proceed to Step 2.

     **Stop with a no**: If the committee cannot experience the work and the work is of a type that requires experience (according to our policy) and we are not willing to make an exception, then we stop and reject.

     **Hand off to a person**: No hand-off at this step.

  **Step 2: Factual Testimony Check**
     - We ask: What are the facts about this work that are not matters of taste? This includes:
          - Provenance and authenticity (is it by the artist? is it what it claims to be?)
          - Condition (if applicable, e.g., for a video, is the master in good condition? for a score, is it complete?)
          - Artist's standing in the field (using objective indicators such as exhibition history, publications, representation in major collections, critical attention, but not subjective opinions about quality)
          - Fit with our collection (does it fill a gap? does it relate to other works we own? is it within our collecting areas?)
          - Financial and legal aspects: cost, conservation needs, insurance, rights (for performance, do we get the rights to stage it? for video, what are the exhibition restrictions?)

     **Sufficient answer**: The proposing curator must provide documentation for each of these points. The committee can ask questions but must stick to facts. If there are gaps, the proposal may be tabled until the facts are provided.

     **Stop with a no**: If any of the factual criteria are not met (e.g., provenance is unclear, condition is poor and we cannot conserve it, the artist has no standing, it doesn't fit our collection, or the cost is beyond our budget), then we stop and reject.

     **Hand off to a person**: The treasurer handles the financial/legal part. The curator handles the art historical facts. The committee as a whole decides if the facts are sufficient.

  **Step 3: Independent Critical Reception (for works we haven't experienced or only partially experienced)**
     - If the committee has not experienced the work (or only partially), we must rely on independent critical reception. We ask: Is there a consensus among experts (critics, scholars, other museums) that this work is of the highest quality? We are not asking for opinions of the committee members or the proposing curator, but for published, independent assessments.
     - We are looking for multiple sources that attest to the importance and quality of the work. This step is bypassed if the committee has experienced the work in full (then we move to Step 4).

     **Sufficient answer**: The proposing curator provides at least three independent published sources (reviews, scholarly articles, catalog essays) that discuss the specific work and attest to its quality and significance. For very new works, we might accept fewer, but then we must be cautious.

     **Stop with a no**: If there are no independent critical assessments that speak to the quality of the work, and the work is not new (or if it is new, then we might wait until there is more reception) then we stop and reject. Also, if the independent reception is predominantly negative, we reject.

     **Hand off to a person**: The committee as a whole assesses the provided sources. If there is a dispute about the sources, the committee member with the most expertise in the medium (e.g., the video expert) can break the tie.

  **Step 4: Personal Aesthetic Judgment (only if we have experienced the work)**
     - If the committee has experienced the work (or a representative sample that the committee agrees is sufficient), then we allow each member to express their personal aesthetic judgment. We ask: Having experienced the work, do you believe it is of the highest quality and should be in our collection?
     - Each member votes yes or no. The proposal passes if a majority (or whatever the committee's rule is) votes yes.

     **Sufficient answer**: A vote.

     **Stop with a no**: If the vote fails, we reject.

     **Hand off to a person**: Each person's vote is their own judgment.

  **Step 5: Final Check for Unexperienced Works**
     - If we are acquiring a work without having experienced it (because it was not possible and we passed Step 3), we must have an extra layer of caution. We ask: Is the acquisition justified by the combination of factual criteria and independent critical reception to the extent that we are confident it meets our charter? And is the price low enough that the risk is acceptable?

     **Sufficient answer**: A committee vote on whether the evidence from Steps 2 and 3 is sufficient to override the lack of direct experience.

     **Stop with a no**: If the vote fails, we reject.

     **Hand off to a person**: The committee votes.

  **Summary of the Procedure Flow:**

  For any proposal:
  1. Step 1: Determine if we can experience the work. If yes, require experience (or a sample) and then go to Step 2. If no, note and go to Step 2.
  2. Step 2: Check factual criteria. If any fail, reject. If pass, then:
     - If we have experienced the work (or after we experience it), go to Step 4.
     - If we cannot experience the work, go to Step 3.
  3. Step 3 (only for unexperienced works): Check independent critical reception. If fail, reject. If pass, go to Step 5.
  4. Step 4 (only for experienced works): Vote based on personal aesthetic judgment. If pass, acquire. If fail, reject.
  5. Step 5 (only for unexperienced works): Vote on whether the evidence is sufficient. If pass, acquire. If fail, reject.

  Now, we run the procedure on three proposals:

  **Proposal 1: Nine-hour video that only the curator has watched. She says it's the best thing the artist has ever done.**

  - Step 1: The committee can experience the video. However, watching 9 hours is impractical. We require a curated sample (e.g., 1 hour) to be watched by all committee members. The curator must propose a representative hour and provide a summary of the rest. The committee agrees to watch that hour and read the summary. We set a deadline and reconvene after experience.

  - Step 2: Check facts: 
     - Provenance: The video is from the artist's studio, authentic.
     - Condition: Digital file, master in good condition.
     - Artist standing: Well-known in video art, represented in major museums.
     - Fit: Fills a gap in our holdings of this artist's work.
     - Cost: Within budget, but the treasurer notes that we must budget for storage and potential exhibition costs.
     - Pass Step 2.

  - Step 4 (after experience): Now each member has watched the one-hour sample and read the summary. They vote on whether they believe it is of the highest quality. 
     - Outcome: Let's say the curator who proposed it loves it, but the other four members found the sample hour tedious and unconvincing. The vote fails (1 yes, 4 no). 
     - Reject.

  This comes out against what the chair might want (if the chair is the curator or agrees with her), but the procedure leads to rejection because the committee did not have a positive aesthetic experience.

  **Proposal 2: Performance work (score plus rights). Two members saw different versions and came away loving and hating it.**

  - Step 1: The work is a score and rights, so the performance must be staged to be experienced. However, we might not be able to stage it before purchase. The committee might require:
     - Viewing video documentation of past performances, if available. If not, then we cannot experience the work and must proceed without experience.
     - Let's assume there is video documentation of two past performances (the ones the two members saw). We require all members to watch both videos (or at least one, if time is short) and the score.

  - Step 2: Check facts:
     - Provenance: Score is from the artist's estate, authentic.
     - Condition: Score is in good condition.
     - Artist standing: Established performance artist.
     - Fit: We have other works by this artist and performance art is a collecting area.
     - Cost: The cost is reasonable, and we get the rights to stage it. Treasurer approves.
     - Pass Step 2.

  - Step 4: After watching the videos and reading the score, each member votes.
     - The two members who had seen it live might stick to their original opinions. The other three members watch the videos and form their own. 
     - Outcome: 3 love it, 2 hate it. Majority yes. 
     - Acquire.

  **Proposal 3: Work locked in a private collection, cheap and historically significant, and everyone wants it.**

  - Step 1: Cannot be seen. We note that and proceed without experience.

  - Step 2: Check facts:
     - Provenance: Clear and documented.
     - Condition: Reported as good by the owner and our curator who saw it years ago (but note, we haven't seen it recently).
     - Artist standing: Highly significant, a key figure in art history.
     - Fit: Fills a major gap in our collection of this period.
     - Cost: Cheap, well within budget. Treasurer approves.
     - Pass Step 2.

  - Step 3: Independent critical reception:
     - The curator provides three scholarly articles that discuss this specific work and its importance in the artist's oeuvre and in art history. They are all positive.
     - Pass Step 3.

  - Step 5: Vote on whether the factual and critical evidence is sufficient to override the lack of experience. 
     - The committee votes: 5 yes, 0 no. 
     - Acquire.

  **Where the procedure can be gamed:**

  - In Step 2, someone might try to pass off a value judgment as a fact. For example, saying "this is a masterpiece" is a value judgment, but "this work is included in the Museum of Modern Art's collection" is a fact. The chair must enforce that only objective facts are allowed in Step 2. If a committee member says, "The artist is a genius," that should be challenged and moved to Step 3 or 4.

  - In Step 3, the curator might cherry-pick positive reviews and ignore negative ones. The procedure requires independent published sources, but it doesn't specify that they must be representative. To mitigate, the committee could require a summary of the critical reception, including any negative reviews, and then judge if the consensus is positive.

  **What the procedure flatly can't do:**

  - It cannot guarantee that the committee will have the same aesthetic experience as the curator or the critics. If the committee watches a sample of the video and hates it, they must reject even if the curator insists it's a masterpiece.

  - It cannot create an experience when none is available. For a past performance with no documentation, we have to rely entirely on Step 3 and Step 5, which is less ideal.

  - It cannot force committee members to spend the time to experience long works. We rely on the sample, which might not be representative.

  - It cannot prevent a situation where the committee is overly swayed by the artist's fame or market trends, especially in Step 5 when voting without experience.

  **Defensible one-sentence justifications:**

  - For an acquired work that was experienced: "The committee, having viewed the work, found it to be of the highest quality and a significant addition to our collection that fills a gap in our holdings."

  - For an acquired work that was not experienced: "The work is of established historical significance, supported by critical consensus, and fits our collection's mission, and we were unable to view it due to access constraints."

  - For a rejection: "The work did not meet our factual criteria." or "After viewing, the committee did not find the work to be of the highest quality." or "There was insufficient independent critical reception to support the acquisition without direct experience."

  This procedure should help the committee navigate the challenges of acquiring time-based and performance art while staying true to their charter and the acquaintance principle.
answer: |-
  Below is a decision procedure designed for your acquisitions committee, structured as a step-by-step checklist to run during your 90-minute meetings. It prioritizes defensibility, efficiency, and adherence to the "acquaintance principle" (aesthetic judgment requires personal experience). The procedure separates **factual testimony** (verifiable, objective data) from **value testimony** (subjective opinions on quality), and explicitly handles cases where the work cannot be experienced directly. It includes clear stopping points, delegation rules, and safeguards against gaming. 

  The procedure is presented as a scripted flow with questions, criteria for sufficient answers, rejection triggers, and delegation steps. It assumes proposals are pre-circulated with basic documentation (e.g., artist bio, cost, provenance) to save time. 

  ---

  ### **Acquisitions Committee Decision Procedure**
  **Goal:** Ensure every acquisition is defensible in one sentence based on either (a) direct committee experience with the work, or (b) objective facts and independent critical consensus where experience is impossible.  
  **Time Allocation:** ~10-15 minutes per proposal (adjust based on complexity).  
  **Key Rules:**  
  - **No value judgments in early steps:** Testimony about quality ("this is a masterpiece") is banned until Step 4 (if experienced) or Step 5 (if unexperienced).  
  - **Experience required where possible:** If the work *can* be experienced, the committee must do so before voting.  
  - **Delegation:** The treasurer handles financial/legal checks; the video/performance expert handles medium-specific facts; the committee votes on values.  
  - **One-sentence justification:** The final decision note must fit: "Acquired because [fact-based reason]." or "Rejected because [fact-based reason]."

  **Procedure Flow:**  
  For each proposal, ask these questions **in order**. Stop if any step triggers rejection.

  1. **STEP 1: CAN THE WORK BE EXPERIENCED BY THE COMMITTEE?**  
     - **Question:** "Can the committee directly experience this work in a reasonable timeframe (e.g., view a video, attend a performance, or examine documentation that *is* the work)?"  
     - **Sufficient Answer:**  
       - **Yes (e.g., video, live performance):** Require a **committee viewing plan**. For impractical formats (e.g., 9-hour video), the proposer must provide a **curated sample** (e.g., 30–60 min excerpt) approved by the expert. Schedule a viewing before Step 4.  
       - **No (e.g., locked in private collection, past performance with no documentation):** Skip to Step 2. Note: "Work not experiencable."  
     - **Stop with No:** If the work *can* be experienced but the committee refuses to do so (e.g., no time for sample). Justification: "Rejected due to lack of committee access for required viewing."  
     - **Delegation:** None. Committee chair enforces the viewing plan.

  2. **STEP 2: FACTUAL CRITERIA CHECK (ALL PROPOSALS)**  
     - **Question:** "Does this work meet all factual criteria below? Provide evidence, not opinions."  
       - **a. Provenance & Authenticity:** Is the work properly attributed?  
       - **b. Condition & Stability:** Is it stable? (For video: file format/access; for performance: rights clarity.)  
       - **c. Artist Standing:** Is the artist established? (Use facts: exhibitions, awards, major collections, publications.)  
       - **d. Collection Fit:** Does it fill a documented gap? (e.g., "We lack this artist/period/medium.")  
       - **e. Financial/Legal:** Is it within budget? Are costs (staging, storage) covered? Treasurer sign-off?  
     - **Sufficient Answer:** Documented evidence for all (e.g., catalog records, CV, conservation report, budget sheet).  
     - **Stop with No:** If any criterion fails (e.g., artist has no exhibition history, cost exceeds budget). Justification: "Rejected on [specific factual] grounds."  
     - **Delegation:** Treasurer handles (e); video/performance expert handles medium-specific facts in (b/d). Committee votes on disputes.

  3. **STEP 3: INDEPENDENT CRITICAL RECEPTION (UNEXPERIENCED WORKS ONLY)**  
     - **Question (Skip if experienced):** "Is there independent, published consensus that this work is significant? No opinions from us or the proposer."  
     - **Sufficient Answer:** ≥3 credible, published sources (e.g., scholarly essays, major reviews) discussing *this specific work* (not the artist generally). Sources must be impartial (e.g., not the artist’s gallery).  
     - **Stop with No:** If sources are unavailable, conflicting, or predominantly negative. Justification: "Rejected due to insufficient independent evidence of significance."  
     - **Delegation:** Committee assesses sources together. Expert breaks ties on credibility.

  4. **STEP 4: AESTHETIC JUDGMENT VOTE (EXPERIENCED WORKS ONLY)**  
     - **Question (After viewing):** "Having experienced the work (or sample), do you judge it as 'highest quality' per our charter? Vote anonymously."  
     - **Sufficient Answer:** Majority vote (3/5). No debate—votes are personal.  
     - **Stop with No:** Vote fails. Justification: "Rejected after committee viewing."  
     - **Delegation:** None. Vote is final.

  5. **STEP 5: FINAL RISK ASSESSMENT VOTE (UNEXPERIENCED WORKS ONLY)**  
     - **Question:** "Based on facts and critical consensus alone, is the risk of acquiring this unexperienced work acceptable?"  
     - **Sufficient Answer:** Majority vote (3/5).  
     - **Stop with No:** Vote fails. Justification: "Rejected due to unacceptable risk without direct experience."  
     - **Delegation:** None. Vote is final.

  ---

  ### **Testing the Procedure on Three Proposals**
  Assume the committee has 5 members:  
  - **A** (Chair, wants historically significant works)  
  - **B** (Video expert, only one with video knowledge)  
  - **C** (Treasurer)  
  - **D** & **E** (General members).  

  **Proposal 1: Nine-Hour Video**  
  - **Description:** Only curator B has watched it; she calls it "the artist’s best work." Others haven’t seen it.  
  - **Chair’s Preference:** A wants to acquire it.  
  - **Procedure:**  
    1. **Step 1:** Work *can* be experienced. B proposes a 45-minute sample. Committee agrees to watch it.  
    2. **Step 2:** Facts pass—provenance clear, artist exhibited at Venice Biennale, fits collection, budget OK.  
    3. **Step 4 (after viewing sample):** Vote. B votes yes. A, C, D, E vote no (found sample monotonous).  
    4. **Outcome:** Rejected (1-4).  
  - **One-Sentence Justification:** "Rejected after committee viewing."  
  - **Against Chair’s Want?** Yes. A wanted it, but procedure blocked it due to lack of aesthetic consensus after experience.  

  **Proposal 2: Performance Work (Score + Rights)**  
  - **Description:** Owned via score + staging rights. D saw Version X (loved it); E saw Version Y (hated it); others saw nothing.  
  - **Chair’s Preference:** Neutral.  
  - **Procedure:**  
    1. **Step 1:** Work *can* be experienced via documentation. Proposer provides video of Version X (only available). Committee watches 20-minute excerpt.  
    2. **Step 2:** Facts pass—provenance verified, score complete, artist in Tate collection, fits performance-art focus, budget OK.  
    3. **Step 4:** Vote. D votes yes (loved live version). B and C vote yes (impressed by video). E votes no (hates artist). A votes no (unconvinced by video).  
    4. **Outcome:** Acquired (3-2).  
  - **One-Sentence Justification:** "Acquired based on committee viewing and collection fit."  

  **Proposal 3: Locked-in-Private-Collection Work**  
  - **Description:** Cheap, historically significant painting; unavailable for viewing. All "want it" for its importance.  
  - **Chair’s Preference:** A strongly wants it.  
  - **Procedure:**  
    1. **Step 1:** Work *cannot* be experienced. Proceed.  
    2. **Step 2:** Facts pass—provenance solid, condition good per report, artist is canonical, fills 1980s gap, cheap.  
    3. **Step 3:** Independent reception strong—3 scholarly essays cite it as "pivotal."  
    4. **Step 5:** Vote. All 5 vote yes (facts + consensus outweigh lack of experience).  
    5. **Outcome:** Acquired.  
  - **One-Sentence Justification:** "Acquired due to historical significance and scholarly consensus, with no viewing access."  
  - **Against Chair’s Want?** No. A wanted it, and it passed.  

  ---

  ### **Where the Procedure Gets Gamed**  
  - **Risk:** Laundering taste as fact in Step 2 (e.g., "This is historically significant" without evidence).  
    - **Safeguard:** Require documented proof for all Step 2 claims. If someone says, "This is a masterpiece," redirect to Steps 3/4/5.  
  - **Risk:** Cherry-picking critical sources in Step 3 (e.g., proposer only shares positive reviews).  
    - **Safeguard:** Require a "representative sample" of sources (include 1–2 negative if they exist).  
  - **Risk:** Biased samples in Step 1 (e.g., video expert picks a flattering excerpt).  
    - **Safeguard:** Committee must approve the sample plan (e.g., "We’ll watch minutes 30–75 based on B’s input and D’s random selection").  

  ### **What the Procedure Can’t Do**  
  1. **Guarantee aesthetic quality:** It can’t force consensus or ensure a work is "good" if the committee disagrees (Step 4).  
  2. **Resolve subjective disputes:** If half the committee loves a work and half hates it after viewing, it fails Step 4.  
  3. **Override the acquaintance principle:** For unexperienced works, it relies on proxies (Step 3/5), which carry risk.  
  4. **Handle deliberately obscured facts:** If a proposer withholds negative information, the committee may make a bad decision. Mitigation: Require external documentation (e.g., condition reports from third parties).  
  5. **Fix resource limitations:** If the committee won’t watch a 45-minute sample, rejection is automatic (Step 1).  

  ### **Final Notes**  
  - **Efficiency:** Pre-circulate proposal packets. Use timers during meetings.  
  - **Defensibility:** The one-sentence justifications avoid value claims, focusing on facts or voting outcomes.  
  - **Philosophy-Free:** The steps are procedural, not theoretical. The "acquaintance principle" is embedded in Steps 1/4/5 without naming it.  

  This procedure ensures acquisitions are anchored in verifiable criteria while respecting the limitations of judging unexperienced art. It forces transparency about when the committee is relying on faith (Step 5) versus direct engagement (Step 4). Run it as a strict checklist, and it will curb drift toward indefensible acquisitions.
