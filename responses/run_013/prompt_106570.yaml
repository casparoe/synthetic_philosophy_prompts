  ### Taxonomy of the Presumption of Independence

  **Initial Dimensions**  
  1. **Locus**: Where is independence presumed?  
     - The world (independence as a feature of reality)  
     - Evidence (independence as a default interpretation of data)  
     - Credences (independence as a constraint on subjective probabilities)  

  2. **Force**: How binding is the presumption?  
     - Defeasible default (overridden by counterevidence)  
     - Prior probability (encoded in initial probability distributions)  
     - Constitutive constraint (a necessary condition for rationality)  

  3. **Scope**: To what does the presumption apply?  
     - Global (all variables/events) vs. Local (specific pairs/sets)  
     - Synchronic (at a single time) vs. Diachronic (across time)  

  ---

  **Decision Tree**  

  1. **Is the locus of the presumption in the world, evidence, or credences?**  
     - **World** → Proceed to Q2  
     - **Evidence** → Proceed to Q3  
     - **Credences** → Proceed to Q4  

  2. **For world-locus: Is the force a defeasible default, prior probability, or constitutive constraint?**  
     - **Defeasible default** → Proceed to Q5  
     - **Prior probability** → Proceed to Q6  
     - **Constitutive constraint** → Proceed to Q7  

  3. **For evidence-locus: Is the force a defeasible default, prior probability, or constitutive constraint?**  
     - **Defeasible default** → Proceed to Q8  
     - **Prior probability** → **Incoherent** (evidence cannot have priors; it is given)  
     - **Constitutive constraint** → Proceed to Q9  

  4. **For credences-locus: Is the force a defeasible default, prior probability, or constitutive constraint?**  
     - **Defeasible default** → Proceed to Q10  
     - **Prior probability** → Proceed to Q11  
     - **Constitutive constraint** → Proceed to Q12  

  5. **For world/defeasible: Is scope global/synchronic or local?**  
     - **Global/synchronic** → **Unnamed** (awkward: globally assuming independence without evidence risks ignoring systemic dependencies)  
     - **Local/synchronic** → **Causal-structure formalization** (awkward: requires pre-existing causal knowledge to define locality, inviting circularity)  

  6. **For world/prior: Is scope global/synchronic or local/synchronic?**  
     - **Global/synchronic** → **Randomness-based formalization** (awkward: presumes universe-wide randomness without justification)  
     - **Local/synchronic** → **Causal-structure formalization** (awkward: conflates causal irrelevance with probabilistic independence)  

  7. **For world/constitutive: Is scope global/synchronic?**  
     - **Yes** → **Unnamed** (awkward: implies the world is necessarily independent, falsified by quantum entanglement)  

  8. **For evidence/defeasible: Is scope global/synchronic?**  
     - **Yes** → **Reference-class skeptical position** (awkward: defeats itself by denying any reference class can justify independence)  

  9. **For evidence/constitutive: Is scope global/synchronic?**  
     - **Yes** → **Unnamed** (awkward: demands evidence always supports independence, ignoring dependence-detection)  

  10. **For credences/defeasible: Is scope local/synchronic?**  
      - **Yes** → **Defeasible-default-logic formalization** (awkward: non-probabilistic handling of defeat clashes with Bayesian updating)  

  11. **For credences/prior: Is scope global/synchronic, local/synchronic, or local/diachronic?**  
      - **Global/synchronic** → **Maximum-entropy formalization** (awkward: maximizes entropy unconditionally, ignoring causal or contextual constraints)  
      - **Local/synchronic** → **Graphical-model formalization (static)** (awkward: missing edges hardcode independence, preventing learning from new dependencies)  
      - **Local/diachronic** → **Graphical-model formalization (dynamic)** (awkward: same as static, but with added temporal modeling complexity)  

  12. **For credences/constitutive: Is scope global/synchronic?**  
      - **Yes** → **Unnamed** (awkward: forces total independence, rendering learning impossible)  

  ---

  **Notes on Unoccupied/Problematic Combinations**  
  - **Evidence/prior**: Incoherent (evidence is fixed; it cannot have priors).  
  - **World/defeasible/diachronic**: Unexplored (no clear rationale for temporal defeasibility in reality).  
  - **Credences/defeasible/diachronic**: Unnamed but unexplored (possible, but rare due to focus on synchronic rationality).  
  - **Graphical-model static/dynamic** and **Causal-structure** leaves are indistinguishable by locus/force; scope separates them.  

  ---

  **Substantive Claims and Defeasibility**  
  - **Substantive claims** arise in:  
    - *World-locus*: Assumes mind-independent stochastic structure (vulnerable to empirical defeat).  
    - *Prior probability*: Encodes independence as a starting belief (vulnerable to revision but retains prior form).  
    - *Constitutive constraint*: Imposes independence as rational necessity (immune to defeat but empirically brittle).  
  - **Absorbing defeat**:  
    - *Defeasible default* (evidence/credences) permits localized overrides without abandoning the rule.  
    - *Prior probability* updates beliefs but retains the prior’s independence structure.  
    - *World-locus* and *constitutive* positions struggle; defeat refutes their core claims.  

  **The Heuristic Status**  
  The **defeasible-default-logic formalization** (credences/defeasible/local/synchronic) treats independence as a genuine heuristic:  
  - It is a procedural rule ("assume independence unless contradicted") without ontological commitments.  
  - Defeat targets specific applications, not the rule itself, avoiding substantive claims.  
  - Other positions embed independence in world-structure, priors, or rationality, making it non-heuristic.
