  We are constructing a fictitious episode in the history of science that meets the given criteria. Let's create a scenario in the field of condensed matter physics, specifically concerning the behavior of a class of materials under extreme conditions. We'll call the predecessor theory "Vortex Fluid Dynamics" (VFD) and the successor "Quantum Coherent Hydrodynamics" (QCH).

  ### The Episode: Vortex Fluid Dynamics to Quantum Coherent Hydrodynamics

  In the early 20th century, physicists studying the flow of supercooled helium-4 observed that it exhibited frictionless flow and other peculiar behaviors. They developed Vortex Fluid Dynamics (VFD), which posited that the fluid was composed of microscopic, stable vortex filaments. These vortices were modeled as one-dimensional strings with quantized circulation. The theory successfully predicted the formation of vortex lattices in rotating containers and the critical velocity at which the fluid would lose its frictionless property. The mathematical core of VFD was an equation set for vortex motion, including a continuity equation for vortex density and an evolution equation for the vortex lines:

  1. **Vortex Continuity**: \(\frac{\partial \rho_v}{\partial t} + \nabla \cdot (\rho_v \mathbf{v}_v) = 0\)
  2. **Vortex Evolution**: \(\frac{d\mathbf{s}}{dt} = \mathbf{v}_s + \alpha \mathbf{s}' \times \mathbf{v}_n - \beta \mathbf{s}' \times (\mathbf{s}' \times \mathbf{v}_n)\)

  where \(\rho_v\) is vortex density, \(\mathbf{v}_v\) is vortex velocity, \(\mathbf{s}\) is the vortex line position, \(\mathbf{v}_s\) is the superfluid velocity, \(\mathbf{v}_n\) is the normal fluid velocity, and \(\alpha, \beta\) are phenomenological coefficients.

  In the 1960s, experiments with helium-4 at even lower temperatures revealed a new phenomenon: the fluid exhibited a coherent quantum state that extended over macroscopic distances, leading to interference patterns in flow. VFD could not account for this because it treated vortices as independent entities. A new theory, Quantum Coherent Hydrodynamics (QCH), emerged. QCH described the fluid using a complex wave function \(\psi = \sqrt{\rho} e^{i\theta}\), governed by a nonlinear Schrödinger equation (the Gross-Pitaevskii equation, but note: we are inventing, so we change the context and details):

  1. **QCH Equation**: \(i\hbar\frac{\partial \psi}{\partial t} = -\frac{\hbar^2}{2m}\nabla^2 \psi + V(\mathbf{r})\psi + g |\psi|^2 \psi\)

  QCH predicted and then confirmed the interference patterns and also accounted for all the phenomena VFD did. However, it did not recover VFD as a limiting case. Instead, it showed that the vortex filaments of VFD were emergent structures arising from topological defects in the phase \(\theta\) of the wave function. The mathematical structure that survived was the form of the vortex evolution equation. Specifically, when the wave function's phase gradient is large (i.e., in regions of high flow velocity), the evolution of the phase defects (which are the vortices) follows an equation that is mathematically isomorphic to the vortex evolution equation of VFD. The coefficients \(\alpha\) and \(\beta\) were now derived from the parameters of the QCH equation (like \(g\) and \(m\)) and the temperature, but the structure of the equation was identical.

  However, this survival is non-trivial because it rules out ontologies for QCH that do not allow for such topological defects. For instance, if someone proposed that the quantum coherence was due to a classical field without any phase singularities, the survival of the vortex evolution structure would contradict that.

  ### Positions on the Episode

  1. **Entity Realist**: The entity realist would point to the vortices as the real entities because VFD was successful. But QCH shows that vortices are not fundamental; they are emergent from the quantum field. Therefore, the entity realist must either abandon the reality of vortices or argue that they are real as emergent entities. This position is challenged because the fundamental ontology has shifted.

  2. **Epistemic Structural Realist (ESR)**: The ESR focuses on the mathematical structure that survived: the vortex evolution equation. They would say that we knew the structure of vortex dynamics but were wrong about the nature of the vortices (as fundamental strings). The structure was preserved, and that's what we can know. The rest (the quantum wave function) is the new bearer of that structure.

  3. **Ontic Structural Realist (OSR)**: The OSR would say that the structure (the vortex evolution equation) is what is real. In VFD, that structure was instantiated by vortex strings; in QCH, it is instantiated by phase defects in a quantum field. But since structure is all there is, there is no deeper question about what bears the structure. The survival of the equation is the survival of the structure, which is the reality.

  4. **Skeptic (Pessimistic Meta-Induction)**: The skeptic would note that VFD was successful but has been replaced. Therefore, we should not believe that the structures of our current best theories (like QCH) are true or will survive. The fact that VFD's vortices are now seen as emergent and not fundamental is just another example of how our theories are overthrown.

  ### Making Structural Realisms Diverge

  The key to making ESR and OSR diverge lies in the interpretation of what survives. In our case, the vortex evolution equation survives, but in VFD it was taken to describe the motion of fundamental entities (vortex strings), while in QCH it describes the motion of emergent entities (phase defects). 

  - **ESR**: Can say that we knew the structure (the equation) but not the nature of the entities. So we were right about the structure, wrong about the entities. The structure is preserved, so we have continuity of knowledge.

  - **OSR**: Must say that the structure is what is real, and that the entities (whether fundamental or emergent) are just nodes in the structure. But note: in VFD, the vortex strings were thought to be the fundamental entities. In QCH, the fundamental entity is the quantum field, and the vortices are emergent. The OSR has to say that the structure (the vortex evolution equation) is what is real, and that this structure is instantiated by the quantum field. However, the quantum field has its own structure (the Gross-Pitaevskii equation) which is more fundamental. So the OSR must also account for the structure of the quantum field. 

