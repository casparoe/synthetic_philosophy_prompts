  Given the difficulty in engineering a clean divergence, I must report that the case does not force ESR and OSR to give genuinely different verdicts on the episode. They both see it as a victory for structural realism.

  ### What the Skeptic Would Say

  The skeptic (running the pessimistic meta-induction) would say: "Look at VFD. It was successful, but now we know it was fundamentally wrong about the nature of the fluid. The vortices it posited are not fundamental. The structure of the vortex dynamics survived only approximately and as an emergent phenomenon. This is just like phlogiston or the aether. We should expect the same for QCH: future theories will show that its quantum field is not fundamental, and the structure we now see will be replaced."

  ### How the Entity Realist Might Defend

  The entity realist might argue that the vortex strings are real as emergent entities. The empirical success of VFD was due to the existence of these emergent entities, and the new theory QCH actually vindicates them by showing how they emerge. So there is continuity in the entities, but at a different level.

  ### The Weakest Position

  The entity realist fares worst because the fundamental ontology has shifted. The vortices are no longer fundamental. The skeptic's challenge is strong, but the structural realist has a reply: structural continuity. The entity realist does not have an obvious structural continuity to appeal to (unless they shift to emergent entities).

