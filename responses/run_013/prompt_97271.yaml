  ### Conclusion on Divergence

  After trying, I conclude that it is difficult to engineer a case that cleanly makes ESR and OSR give genuinely different verdicts without stipulating the verdicts. The reason is that both are committed to the continuity of structure, and in any case of structural preservation, both will claim victory. The difference lies in their metaphysics (whether there are entities or not), but that doesn't affect their assessment of the episode's structural continuity. 

