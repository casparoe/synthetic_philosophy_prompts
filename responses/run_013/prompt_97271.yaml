  ### Giving Up on Divergence?

  It might be difficult to force a clean divergence between ESR and OSR on any case that meets the criteria. The reason is that both are structural realisms, and they both emphasize the continuity of structure. The difference is in what they say about entities: ESR says we can't know entities, only structure; OSR says there are no entities, only structure. In the vortex case, both would point to the survival of the vortex evolution equation as structural continuity. The ESR would say we were right about the structure of vortex dynamics but wrong about the vortex entities (which are not fundamental). The OSR would say that the structure of vortex dynamics is real, and there were never any entities beyond the structure.

