  ### The Honest Note

  The case is most likely to break down if one questions whether the survival of the vortex evolution equation is genuinely structural continuity or just a coincidence. For example, if the derivation in QCH shows that the equation only holds under very specific conditions that were not satisfied in the original experiments that supported VFD, then the empirical success of VFD might be called into question. Also, if the mathematical form of the equation is very generic (like a continuity equation) then it might be trivial that it survives. But in our case, we have a specific form (with the cross product terms) that is non-generic.

