  ### Revised Episode to Force Divergence

  Let's change the example to a different field: electromagnetism.

  **Predecessor: Scalar Wave Theory (SWT)**
  In the 19th century, light was thought to be a wave in a scalar field (like sound). The theory described the propagation of light by the wave equation: \(\frac{\partial^2 \phi}{\partial t^2} = c^2 \nabla^2 \phi\). It successfully predicted interference and diffraction patterns. The structure was the wave equation and the superposition principle.

  **Successor: Vectorial Electrodynamics (VED)**
  In the early 20th century, experiments with polarized light and the photoelectric effect led to a new theory. VED described light by a vector field \(\mathbf{E}\) and \(\mathbf{B}\) obeying Maxwell's equations. It predicted the existence of transverse waves and the polarization dependence of the photoelectric effect, which SWT could not. The wave equation for each component of \(\mathbf{E}\) and \(\mathbf{B}\) is the same as in SWT: \(\frac{\partial^2 \mathbf{E}}{\partial t^2} = c^2 \nabla^2 \mathbf{E}\) and similarly for \(\mathbf{B}\). Moreover, the superposition principle holds. However, the vector nature of the field introduces constraints (like the transversality condition: \(\nabla \cdot \mathbf{E} = 0\) for waves) that are not in SWT.

