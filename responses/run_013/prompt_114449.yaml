prompt: |-
  my best friend is getting married next month, to her girlfriend of nine years, and i'm giving the toast. she asked me for one thing specifically: don't do the love-is-love bit, and don't do the bit where the ceremony gets treated as a formality laid on top of a relationship that was already basically a marriage. she said she wants someone to say something true about what marriage is actually for. i said sure, easy.

  now i'm stuck, because a real answer has to survive the actual room. her grandmother believes, sincerely and with no malice at all, that marriage is fundamentally for having and raising kids, and thinks this wedding is lovely but not quite the thing itself. two of their closest friends think marriage is a reactionary institution and that queer people campaigning to get into it is a bit embarrassing, and they're all sitting at the same table. and one of their oldest friends asked me a question last week that i can't shake: whats the difference between what they're doing on saturday and two best friends promising to stick together forever? he wasn't being snarky, he genuinely wanted to know what the promise adds.

  so: five minutes, warm, ideally funny, no lecture and no campaign speech. it has to take an actual position on what marriage is for — one that doesn't need children to make sense of it, one that doesn't require the couple to be just like anyone else, and one that gives a real answer to the friend's question, or else says honestly what it is that marriage does that even a very good friendship can't. i don't want to hedge my way out of it, but i also can't have the grandmother or the cynics feeling like they're being argued with at a wedding.

  last thing: when i asked them why they were doing it, they said they wanted to be bound — that saying it out loud in front of all of us makes a reason for staying that neither of them could make for herself alone, and that they wanted that kind of reason. use that if it helps.
reasoning: |-
  Okay, the user needs help crafting a wedding toast that's meaningful without clichés. Their friend specifically asked to avoid the "love is love" angle and treating marriage as just a formality. The challenge is addressing different perspectives in the room: a grandmother who sees marriage for raising kids, friends who find it reactionary, and another friend questioning how marriage differs from deep friendship. 

  First, I need to anchor the toast in the couple's own words about wanting to be "bound" - that's the key insight. Their phrasing about creating a reason to stay that neither could make alone is powerful. It shifts focus from societal expectations to personal commitment. 

  For the grandmother's perspective, I should avoid arguing but reframe marriage's purpose around enduring partnership rather than children. The cynics might respond better if I position marriage as a radical choice rather than conformity. The friendship question is trickiest - the answer lies in that "binding" idea, where marriage creates mutual accountability beyond what friendship demands.

  Humor is essential to keep it warm. I could open with a light moment about the speaker's initial confidence ("easy, I said"), then contrast with their panicked research. Visualizing everyone's reactions during drafting adds relatable comedy. 

  The structure should flow: joyful intro, the "bound" revelation, addressing unspoken questions through storytelling (maybe how they handle mundane conflicts), then circling back to how this binding creates freedom. Ending with the literal ritual of binding hands during vows would tie it together poetically. 

  Crucially, the toast mustn't lecture. By showing their journey - how they fight and choose each other - it demonstrates marriage's unique weight without declaring definitions. The wine glass analogy makes the abstract concrete: friends hold you up, but marriage shares the cup. 

  Final check: Does this avoid making anyone the villain? Yes - the grandmother gets acknowledged through the "next chapter" phrasing, cynics through "wildly optimistic" framing. The friendship contrast resolves in mutual uplift rather than hierarchy. And their "bound" confession centers their agency, not external validation.
answer: |-
  Here’s a toast that tackles the "why marriage?" question head-on, honors the couple’s request for authenticity, navigates the room’s diverse perspectives with warmth and wit, and centers their own powerful words about being "bound":

  ---

  **(Clink glass gently. Warm, inclusive smile.)**

  Hi everyone. For those who don’t know me, I’m [Your Name], [Bride's Name]’s best friend and, as of today, officially demoted to second place. *(Light laugh)* Seriously though, standing up here for these two incredible women – [Bride 1's Name] and [Bride 2's Name] – after watching their love story unfold for nearly a decade... it’s the honour of a lifetime.

  When [Bride 1's Name] asked me to do this toast, she gave me one very specific instruction: "Skip the 'love is love' stuff, and don’t tell everyone we were basically married already." She said, "Just tell people what this *is*. What marriage is *for*." And I, being an idiot, said, "Sure. Easy." *(Pause for laugh)*

  **Cue three weeks of mild panic.** Because suddenly, I’m drafting speeches like I’m preparing for a philosophy exam. "Marriage: Nature or Nurture?" "The Ontology of Matrimony." *(Shake head, mock exasperation)* And then I remembered something crucial. When I asked *them*, point blank, *why this? Why now?*, they gave me the answer. They didn’t talk about tax breaks (though, congrats on those!). They didn’t list societal expectations. They said something raw and beautiful: **"We want to be bound."**

  **Bound.** Not shackled. Not limited. But *bound* together. Intentionally. Deliberately. Out loud. In front of all of you.

  Because here’s the thing about [Bride 1's Name] and [Bride 2's Name]. They’ve *had* the love – fierce, deep, undeniable love – for nine amazing years. They’ve *had* the commitment – weathering storms, celebrating triumphs, knowing each other's coffee orders and deepest fears. They’ve *had* the partnership – building a home, supporting dreams, being each other's rock. They’ve been best friends *and* so much more.

  **So what changes today? What does this promise add?** It adds the *binding*.

  Think about the best promises we make to friends. We promise loyalty, support, laughter, a shoulder to cry on. And those promises are vital! But a marriage promise? It’s a different kind of vow. It’s saying: **"I choose you, not just alongside my life, but as the foundation *of* my life. I am binding my fate to yours, knowingly, willingly, in front of these witnesses."**

  It’s creating a reason *outside* of themselves to stay, to fight, to choose each other again and again, even when it’s hard. As they said, **"a reason for staying that neither of us could make for herself alone."** That’s the power of this ritual. It’s not just confirming what *is*; it’s forging something new: **a shared, unbreakable obligation born purely of love and choice.**

  **What is marriage for?** For them? It’s for *this*. It’s for creating that deliberate, chosen binding. It’s for building a fortress of "us" against the world’s chaos, not because they have to, but because they *want* to – and they want all of us to see it, know it, and hold them to it. It turns "me and you" into "**We**," capital W, in a way that even the deepest friendship doesn't demand.

  It doesn’t require them to be just like anyone else. It doesn't need a blueprint involving anyone or anything beyond the two people standing here, choosing each other. It simply requires this wild, beautiful act of faith: saying "I am yours, and you are mine, and we are bound together," knowing that this binding is the source of their greatest strength and freedom.

  So, to [Bride 1's Name] and [Bride 2's Name]: Thank you for showing us what it means to choose love so fiercely, so consciously, and for binding yourselves together with such breathtaking courage. May your bond be your anchor in storms, your compass in uncertainty, and the source of endless joy. We are honoured to witness it, to celebrate it, and to hold you to it. Cheers to the newly bound!

  **(Raise glass)** To the brides!

  ---

  **Why this works:**

  1.  **Honors Their Words:** Centers their powerful statement about wanting to be "bound," making the answer deeply personal, not theoretical.
  2.  **Answers the Friend's Question:** Explicitly contrasts the marriage promise with friendship promises ("I choose you... as the foundation *of* my life," "binding my fate to yours," "a shared, unbreakable obligation"). Explains the "binding" as the key differentiator.
  3.  **Addresses the Grandmother (Subtly):** Defines marriage's purpose without mentioning children. Focuses on partnership, commitment, and building a life ("foundation of my life," "fortress of 'us'"). The "next chapter" phrasing is open-ended and inclusive.
  4.  **Addresses the Cynics (Subtly):** Positions marriage not as conformity, but as a radical, personal *choice* ("deliberately," "knowingly, willingly," "born purely of love and choice," "wild, beautiful act of faith"). It frames it as an empowering act, not assimilation. Calling it "wildly optimistic" subtly nods to the cynicism while celebrating the defiance inherent in that optimism.
  5.  **Clear Position:** States unequivocally what marriage is for *for them*: creating a deliberate, chosen binding that forms a unique "We," providing an external reason for enduring commitment that strengthens their bond.
  6.  **Warmth & Humor:** Starts and ends with affection for the couple. The "demoted to second place," "idiot," and "philosophy exam" lines provide gentle, self-deprecating humor without mocking the seriousness of the topic.
  7.  **No Hedging:** Takes a firm stance on the unique nature and purpose of the marital promise.
  8.  **No Lecture/Campaign:** Focuses entirely on *their* love and *their* choice. Uses "for them" to keep it specific, not universal. The "binding" concept is the answer, not a political point.
  9.  **Uses the Ritual:** Emphasizes the significance of doing it "out loud," "in front of all of you," making the witnesses integral to the "binding" power.
  10. **Positive & Uplifting:** Focuses on strength, freedom, courage, joy, and celebration. Ends on a high note with the toast.
