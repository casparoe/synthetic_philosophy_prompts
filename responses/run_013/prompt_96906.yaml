prompt: |-
  I took a philosophy MA and then drifted into industry; for the last few years I have been on the evaluation team for a company that puts LLM-based agents into a regulated workflow, in practice insurance claims adjudication, and I keep running into a pattern I do not have a word for. We grade two things. The process score asks whether the agent consulted the right sources, applied the right rule, and wrote down its reasoning. The outcome score asks whether the decision was actually right, judged months later by human auditors and by what happened to the claim. What unsettles me is not that the two disagree — everyone expects some slack between them — but the direction in which they disagree at the top. Among our highest process scores, the correlation with outcomes is slightly negative. The agents are not gaming the score; I have read the rationales and they are sincere, accurate, and useless, because the process encodes what a careful reviewer does on a typical case, and the agents who follow it most exactly are precisely the ones who never notice that the case in front of them is atypical and the checklist is the wrong instrument. Meanwhile a bad outcome that occurs under a high process score gets filed as an accident rather than as an error: the record shows every step followed, so there is nothing to correct, and the same failure recurs without ever accumulating into a lesson. When we tightened the standard after one such failure, compliance rose, outcomes did not improve, and the failure became harder to see, because the new standard required a documentation step that recast the same bad decision as a considered and justified departure from the default.

  The thing I want a name for is narrower than the well-worn observation that a measure stops measuring what it was meant to measure once it becomes a target, and it is not the ordinary process-versus-outcome trade-off, which we all know about and which at least keeps the failure visible. What I am after is the way a process standard relocates the question of whether something went wrong: the error is defined as the deviation from the procedure rather than as the bad outcome, so once the procedure has been followed the outcome has nowhere to register as a failure, and the more faithfully the standard is followed the less visible its failures become. I have since noticed what looks like the same shape in hospital incident reporting and in bank compliance files, which is why I doubt it is a peculiarity of AI evaluation.

  Is there an established concept for this exact configuration, and if so, how does it differ from the nearest things I have already considered and found unsatisfying — normalization of deviance, goal displacement, the streetlight effect, the various forms of blame-free accident reporting? I am not after a label to wave around; I want the carving. Tell me what the phenomenon is and what it is not, whether it is one thing or two, since the blindness to atypical cases and the conversion of error into accident may not be the same mechanism, whether it requires an actual written standard or whether any entrenched habit of justification would do the same work, and what would count as a case that resembles it but is not it. If nothing established fits, coin a term, define it, and tell me what it excludes.
reasoning: |-
  Okay, the user has a really interesting and nuanced problem here. They're describing a specific pattern they've observed in evaluating AI systems for insurance claims, where strict adherence to process standards actually makes failures harder to see and learn from. 

  First, I need to fully grasp what they're describing. It's not just about Goodhart's law (metrics becoming targets) or the usual process-outcome trade-off. The core issue seems to be how process standards redefine errors as deviations rather than bad outcomes, making failures invisible when procedures are followed perfectly. 

  The user mentions seeing similar patterns in healthcare and banking, so this isn't AI-specific. They're clearly very thoughtful - with a philosophy background and industry experience, they've already considered concepts like normalization of deviance and blame-free reporting but find them inadequate. 

  Hmm... what academic concepts might fit? Procedural justice frameworks come to mind, but those are more about fairness perceptions. Organizational studies have "decoupling" where practice differs from policy, but that's not quite it. 

  Wait - the key elements seem to be: 1) Process compliance becoming the definition of correctness 2) This creates blindness to novel situations 3) Bad outcomes get reclassified as unavoidable accidents 4) The system becomes less able to learn over time. 

  The closest established concept might be "procedural entrenchment" from safety science, but that usually refers to physical systems. For this cognitive/organizational version, "ritualistic assurance" could work - emphasizing the performative aspect of following procedures without genuine risk assessment. 

  I should distinguish this carefully from similar concepts. Unlike normalization of deviance, here the procedure is followed exactly - there's no gradual drift. Unlike goal displacement, the original purpose isn't forgotten but becomes secondary to compliance. 

  The user will want clear boundaries: this requires formal standards that can be audited, not just habits. And the two aspects (blindness to novelty and error recategorization) are actually connected - both stem from over-indexing on process. 

  For counterexamples: A surgeon skipping steps but getting good outcomes would be normalization of deviance. A company ignoring safety data for profits is goal displacement. This is different. 

  The term should reflect both the epistemological problem (procedures limiting perception) and the organizational consequence (learning failure). "Procedural capture" might be too vague... "Compliance Epistemology" feels closer but jargony. 

  Perhaps "Procedural Blindness" with a tight definition: When adherence to documented processes a) prevents recognition of novelty b) reclassifies substantive errors as unavoidable accidents c) creates audit trails that obstruct organizational learning. 

  The user's clearly seeking precision - they'll appreciate distinguishing when this applies (formal standards with outcome verification) versus when it doesn't (informal practices). And noting that tightening standards exacerbates it is crucial - that's the vicious cycle they observed. 

  This deserves a thorough response with clear definition, boundaries, and mechanisms. The philosophy training means they'll want conceptual rigor, while the industry experience means practical examples matter. Need to show how this explains their insurance cases better than alternatives.
answer: |-
  Your observation captures a profound organizational pathology that sits at the intersection of epistemology, systems design, and institutional failure. The phenomenon you describe—**Procedural Entrenchment with Epistemic Closure**—lacks a universally established term but can be precisely defined and distinguished from adjacent concepts. Here’s the carving:

  ### Core Definition: **Procedural Entrenchment with Epistemic Closure**
  A state where documented processes become the sole arbiter of validity, such that:
  1.  **Compliance ≡ Correctness**: Adherence to prescribed steps is conflated with substantive correctness.
  2.  **Outcome Irrelevance**: Bad outcomes are decoupled from error attribution if the process was followed.
  3.  **Epistemic Closure**: The process filters out novelty (atypical cases) by design, as deviation is the only recognized failure mode.
  4.  **Learning Inversion**: Tightening process standards *increases* blindness by creating more elaborate documentation rituals that rationalize failures.

  ### How It Differs from Adjacent Concepts:
  | Concept              | Why It Doesn’t Fit Your Case                                                                 |
  |----------------------|---------------------------------------------------------------------------------------------|
  | **Goodhart’s Law**   | Targets metrics becoming useless when gamed. Your process *isn’t gamed*—it’s followed sincerely, yet still fails. |
  | **Normalization of Deviance** | Involves *gradual acceptance of rule-breaking*. Your failure occurs *without any deviation*. |
  | **Goal Displacement**| Focuses on means overriding ends. Your issue is *epistemic*: the process redefines what constitutes an "error." |
  | **Streetlight Effect**| Searching where measurement is easy. Your team *can* measure outcomes but the system ignores them. |
  | **Blame-Free Reporting**| Designed to encourage transparency. Your system *accidentally* creates blame-free failures by design. |

  ### Key Mechanisms & Boundaries:
  1.  **Requires Formal Standards**: Informal habits lack the audit trail that converts errors into "accidents." Your insurance/hospital/bank examples all hinge on documented compliance.  
  2.  **Two Faces of One Pathology**:  
      - *Blindness to novelty* arises because the process encodes **typical**-case heuristics.  
      - *Error-to-accident conversion* occurs because audits trace **procedural fidelity**, not decision quality.  
      Both stem from the system’s epistemology: "Truth" is operationalized as process execution.  
  3.  **The Vicious Cycle**:  
      Tightening standards → Better compliance theater → Worse outlier detection → More "justified" failures → Reinforcement of flawed process.  

  ### What It Is NOT:
  - **Simple Rigidity**: Not just reluctance to change, but active *production of ignorance* via documentation.  
  - **Bureaucratic Ritualism**: Those retain symbolic functions; your process actively obstructs learning.  
  - **Confirmation Bias**: Bias operates in cognition; this is systemic, embedded in validation protocols.  

  ### Borderline Cases:
  - **Resembles But Isn’t**: A pilot crashing after checklist compliance due to unprecedented sensor failure → **Is it**.  
  - **Not It**: A doctor skipping handwashing (deviance) causing infection → *Normalization of deviance*.  
  - **Not It**: A bank fined for missed filings (outcome penalty despite process lapse) → *Ordinary accountability failure*.  

  ### Proposed Terminology:
  **Epistemic Capture by Procedure (ECP)**  
  *Definition*: The systemic condition where audit trails derived from formal processes a) redefine errors as unavoidable accidents when compliance is verified, b) actively prevent recognition of novel failures by rewarding strict adherence to typical-case protocols, and c) incentivize process elaborations that further obscure substantive errors.

  ### Why This Fits:
  - **Epistemic**: Addresses how knowledge of failure is systematically excluded.  
  - **Capture**: The process "captures" the definition of truth.  
  - **Procedure**: Explicitly ties to documented standards (your audits, incident reports, compliance files).  

  ### Counteracting ECP:
  - **Outcome-Anchored Audits**: Mandate random deep dives into high-outcome-loss cases *regardless* of process scores.  
  - **Novelty Triggers**: Flag cases where agents override defaults (even if "wrong") as learning opportunities.  
  - **Adversarial Testing**: Seed claims with atypical patterns disguised as routine.  
  - **Second-Order Feedback**: Track how often "accidents" under high-process scores cluster around specific rule exceptions.  

  Your insight exposes a critical flaw in how institutions convert *accountability* into *compliance*. ECP isn’t about AI—it’s about how humans design systems to evade uncertainty by substituting process for judgment. The pathology emerges when organizations prioritize defensibility over functionality, a risk amplified in regulated domains where paper trails outweigh outcomes. What you’ve observed is the bureaucratic immune system attacking the organism’s capacity to adapt.
