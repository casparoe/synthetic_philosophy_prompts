prompt: |-
  You are an expert in game theory, social ontology, and the ethics of collective action, and you are helping me prepare for an interview. Work carefully and in stages: begin by brainstorming the strongest objections to my guest's position, then draft candidate questions, then cut the list down to the best ones. Show your reasoning about which questions are likely to be deflected, and why.

  I host a small interview podcast. My next guest is a philosopher of the social sciences whose recent book argues that the phenomena we habitually bundle under labels such as 'multipolar trap', 'race to the bottom', and 'Moloch' are not one phenomenon but several structurally distinct ones, and that the shared vocabulary does real harm: it advertises a single family of remedies where the structures require different ones, and it makes the situations look more inescapable than they are.

  Her taxonomy, as I understand it, distinguishes at least four things. First, escalation dilemmas proper: symmetric arms races and iterated prisoner's dilemmas in which each party would prefer mutual restraint, each has a dominant reason to defect, and the available exits are coordination devices, enforceable agreements, or altered payoffs. Second, commons problems: shared resources with thresholds and congestion effects, where collective depletion occurs even though no single party's choice is decisive. Third, selection traps: cases in which the difficulty lies not in any agent's choice but in the composition of the population of agents, so that more restrained parties are outcompeted and displaced, and in which the word 'trap' is doing selection-theoretic rather than game-theoretic work. Fourth, proxy traps: principal-agent and bureaucratic structures in which everyone optimizes a measurable stand-in for what they actually want, and the stand-in drifts. Her claim is that these share little beyond a mood, and that the mood is what the word 'Moloch' actually names.

  I would like eight to twelve interview questions that do more than invite her to restate this. Please make sure the set includes: (i) a question pressing whether the disunity thesis is substantive, since 'different mechanisms differ' is nearly trivially true — what would it take for the unity claim to be false, and might the vocabulary be diagnostic rather than explanatory? (ii) a question about the normative baseline that 'bottom' presupposes, since a race to the bottom requires a metric and a privileged level, and I want to know who sets it and whether her account can do without one; (iii) a question about endogenous preferences — if participants come to want what the race delivers, whether anyone is still worse off, and whether the framing covertly assumes fixed preferences; (iv) a question about where responsibility lands once the mechanisms are disunified, specifically whether the vocabulary relocates blame from persons to structures and so supplies an excuse for individual defection; (v) a question demanding a worked case in which such a race was actually escaped, with the structural story of how, together with a case in which competition pushed standards up rather than down and whether her taxonomy can absorb it; and (vi) a question that forces her to choose between 'one phenomenon with many instances' and 'many phenomena under one word', and to say what evidence or argument would settle the matter.

  For each question, add a follow-up keyed to the answer she is most likely to give, and a short note on what she would have to concede for the question to have landed. She has a habitual reply to the disunity objection — that the vocabulary is diagnostic, that naming a pattern is what allows you to see it — so at least two questions in the set should be ones this reply cannot dispose of. Order the questions so that the pressure builds rather than shuffling topics. Keep every question answerable from her own argument and from reasoning: do not ask her for reading lists, literature, or empirical citations, and avoid definitional or background questions. Finally, tell me which two questions are most likely to produce a genuinely new answer rather than a rehearsed one, and why.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who wrote a book arguing that terms like "multipolar trap" or "Moloch" actually refer to several distinct phenomena, not one unified concept. The user wants strong, critical questions that go beyond restating her thesis. They've provided a taxonomy of four categories she uses: escalation dilemmas, commons problems, selection traps, and proxy traps. 

  Hmm, the user is clearly well-prepared—they've identified six specific angles they want covered, including questioning the substance of her disunity thesis and probing normative baselines. This isn't a surface-level interview; they want to pressure-test her framework. Interesting how they emphasize avoiding "rehearsed answers"—they're likely frustrated by formulaic academic discourse. 

  First, I need to brainstorm objections to her core claim. The most obvious is that her taxonomy might itself be arbitrary—why these four categories? Couldn't someone else propose five or three? Also, even if mechanisms differ, the shared "mood" (as she calls it) might be the key feature worth studying. And practically, might collapsing them under "Moloch" actually help mobilize action? 

  For question drafting, I'll start by attacking the disunity thesis head-on (user's point i). Instead of letting her say "different mechanisms differ," I'll force her to define what would falsify unity—what evidence would prove these *are* fundamentally the same? Her go-to "diagnostic vocabulary" reply won't work here. 

  The normative baseline question (point ii) is thorny. Who decides what "bottom" means? If a factory relocates to a low-regulation country, is that a "race" or just efficient allocation? Her answer might expose biases in how we label outcomes as "bad." 

  Endogenous preferences (point iii) could trap her: if people start *liking* fast fashion or gig work, does her "trap" framing still hold? This challenges her assumption of fixed preferences. 

  I'm structuring questions to escalate pressure: start with taxonomy validity, then move to consequences (blame-shifting), then real-world cases. The "worked case" demand (point v) is brutal—academics hate being asked for concrete examples. And the final forced choice ("one phenomenon or many?") leaves no wiggle room. 

  For follow-ups, I'm anticipating her dodges. When she says vocabulary is "diagnostic," I'll ask why that doesn't *create* the illusion of similarity. If she deflects blame from individuals, I'll ask whether her theory excuses complicity. 

  The two likeliest fresh answers: the endogenous preferences question (it's underexplored in her writing) and the "upward race" case (she might not have considered competitive improvements). Both force her off-script.
answer: |-
  Here’s a curated interview question set designed to pressure-test your guest’s thesis while adhering to your specifications. Questions are ordered to build conceptual tension, with follow-ups targeting likely deflections. Key objections underpinning each question are noted in *italics*.

  ---

  ### **Core Objections Brainstormed**  
  *(Basis for questions)*  
  1. **Triviality Objection**: Distinguishing mechanisms is tautological ("all differences differ"); the *unity* of "trap" dynamics lies in their emergent destructive pattern, not microscopic mechanisms.  
  2. **Diagnostic Utility**: Bundling diverse cases under "Moloch" may be pragmatically essential for identifying harmful systemic patterns early.  
  3. **Normative Arbitrariness**: Declaring something a "race to the bottom" requires a contestable baseline; her framework may smuggle in elitist or static ideals.  
  4. **Structural Excuse**: Disaggregating mechanisms could dilute responsibility, implying no one *chooses* the trap—only the system does.  
  5. **Endogenous Preferences**: If preferences adapt to the trap (e.g., gig workers internalizing hustle culture), the "harm" dissolves, exposing the theory’s moral core.  
  6. **Asymmetry of Escapes**: If exits exist only for some trap types, her taxonomy risks fatalism about others (e.g., selection traps).  

  ---

  ### **Interview Questions & Follow-Ups**  
  **(Ordered for escalating pressure)**  

  1. **Substance of Disunity**  
     *Q: You argue that "multipolar trap" bundles distinct phenomena. But doesn’t all categorization abstract from details? What evidence would prove these *are* fundamentally one phenomenon—and if nothing could, is your disunity claim falsifiable?*  
     *Likely Deflection*: "The vocabulary is diagnostic! Naming patterns is step one."  
     *Follow-up*: If diagnostic labels *create* the illusion of unity, doesn’t your taxonomy risk fracturing coalitions against e.g., AI races or climate inaction by over-specifying?  
     *Concession Needed*: That some traps share irreducibly similar failure modes (e.g., multi-actor coordination collapse) despite mechanistic differences.  

  2. **Normative Baseline Challenge**  
     *Q: "Race to the bottom" implies decline from a privileged baseline. When regulators compete by lowering standards, who sets that baseline—and isn’t your taxonomy silent on whether it’s democratic, expert-led, or market-driven?*  
     *Likely Deflection*: "Baselines are context-specific; my point is that conflating trap types obscures solutions."  
     *Follow-up*: If a "bottom" is just the equilibrium of revealed preferences (e.g., workers choosing gig flexibility over stability), is it still a *trap*—or just efficient allocation?  
     *Concession Needed*: That declaring something a "trap" requires normative commitments beyond structural analysis.  

  3. **Endogenous Preferences**  
     *Q: Take platform labor: workers may start valuing flexibility they once saw as exploitative. If preferences adapt to the "trap," does anyone remain worse off? Does your framework assume fixed preferences?*  
     *Likely Deflection*: "Adapted preferences reflect distorted choice architectures!"  
     *Follow-up*: But if your taxonomy can’t distinguish *coerced* adaptation from genuine preference shifts without circularity ("it’s a trap because preferences adapted!"), does it risk paternalism?  
     *Concession Needed*: That preference endogeneity could dissolve the "trap" label absent independent harm metrics.  

  4. **Responsibility & Structural Excuses**  
     *Q: When you relocate blame from agents to structures (e.g., "selection traps made me defect!"), does your disunity thesis give defectors a moral alibi by fragmenting accountability?*  
     *Likely Deflection*: "Understanding structures helps design better institutions!"  
     *Follow-up*: But if a CEO blames "proxy traps" for quarterly profit obsession, haven’t you replaced "Moloch made me do it" with "my principal-agent structure made me do it"—equally exculpatory?  
     *Concession Needed*: That structural analysis *can* weaken individual culpability without offering countervailing tools for responsibility.  

  5. **Worked Case Demand**  
     *Q: Give us one case where a "trap" was escaped *because* actors correctly diagnosed its type—e.g., reclassifying a commons problem as a selection trap unlocked new solutions. Then: when has competition *raised* standards (e.g., safety tech in auto racing), and how does your taxonomy absorb that?*  
     *Likely Deflection*: "Escapes are complex! CFC bans show commons solutions work."  
     *Follow-up*: But the Montreal Protocol worked via coordinated sanctions—an escalation dilemma tool. Doesn’t this blur your categories? And if "races upward" exist, is "trap" just a pejorative for dispreferred outcomes?  
     *Concession Needed*: That exits often require hybrid solutions crossing her categories, and that "trap" is normatively loaded.  

  6. **Phenomenon vs. Word**  
     *Q: You reject "one phenomenon, many instances" for "many phenomena, one word." What observable consequence—beyond semantic clarity—would differ if you’re wrong?*  
     *Likely Deflection*: "Clarity *is* the consequence! We misdiagnose real problems."  
     *Follow-up*: If a policymaker uses "Moloch" loosely but still picks the right solution (e.g., cap-and-trade for a commons problem), was the harm real—or academic?  
     *Concession Needed*: That mechanistic unity is secondary to functional similarity in outcomes/solutions.  

  ---

  ### **Deflection-Proof Questions**  
  These resist the "diagnostic vocabulary" reply by targeting normative and practical implications:  
  - **Question 2 (Normative Baseline)**: Forces engagement with political philosophy, not just taxonomy.  
  - **Question 3 (Endogenous Preferences)**: Challenges the moral foundation of "trap" claims.  

  ### **Most Likely to Elicit Novel Answers**  
  1. **Question 3 (Endogenous Preferences)**  
     *Why*: Her work focuses on structures, not preference formation. This presses on unexplored tensions between adaptive preferences and harm claims—likely unpracticed.  
  2. **Question 5 (Worked Case + "Races Upward")**  
     *Why*: Requires concrete application outside her taxonomy’s comfort zone. "Races upward" cases are rarely addressed in trap literature, demanding improvisation.  

  ### **Strategic Order Rationale**  
  Starts with epistemology (Q1), moves to normative stakes (Q2–3), then accountability (Q4), before testing real-world applicability (Q5) and core metaphysics (Q6). This mirrors an argumentative "funnel": broad conceptual claims → concrete implications → foundational assumptions.  

  Each question stays within her argument’s scope—no citations or definitions needed. Follow-ups exploit gaps in her rehearsed defenses.
