  *eyes clock* Better emphasize feasibility: for Q1, suggest mining existing databases like D-PLACE or experimental work on intuitive theism. For Q2, point them to cultural evolution models—their bio training can handle that math. 

  *stares at wall* The meta-move: framing this as "applying Tinbergen to cultural phenotypes" might be their unique contribution. A biologist's field guide to religious traits. That'd change downstream work by forcing decomposition. 

