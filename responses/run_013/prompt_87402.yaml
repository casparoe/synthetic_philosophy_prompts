prompt: |-
  I keep coming back to the surprise exam and I want an actual argument, not the usual "the students can't know it" hand-wave. Set it up with two stipulations I think get skipped: the students are certain the announcement is true, and the teacher is perfectly reliable (never cancels, never moves the exam). Now argue for this claim: the teacher's announcement is the announcement-shaped cousin of a Moore sentence, the p-but-I-dont-believe-p pattern -- it can be true, but no consistent, deductively-closed student can be certain of it, so what the announcement rules out isnt the exam, its the students' certainty. Give me the derivation, say exactly where the certainty assumption is doing the work, then face three objections: that Moore sentences are odd to *assert* while this one is odd to *believe*, so maybe the parallel is just a pun; that the students can just believe it with credence 0.99 and nothing goes wrong, so what precisely is impossible; and that a reliable informant should be able to tell you things you can know, so what went wrong with the teacher. Finish by saying whether "there will be a surprise" is something a teacher can promise at all, and whether she can know in advance that shes pulled it off.
reasoning: |-
  We are considering the surprise exam paradox. The teacher announces: "There will be an exam next week (Monday to Friday), and it will be a surprise, meaning that on the evening before, you will not know that the exam is the next day."

   We assume:
   1. The students are certain that the announcement is true (so they believe the teacher is telling the truth and the exam will happen and be a surprise).
   2. The teacher is perfectly reliable (so the exam will definitely happen on one of the days and will be a surprise).

   However, we will show that the announcement, while it can be true, cannot be consistently believed by the students (if they are deductively closed and consistent). This is because the announcement leads to a contradiction when the students reason about it.

   Let's set up the days: Monday (M), Tuesday (T), Wednesday (W), Thursday (R), Friday (F).

   The announcement: 
     (1) The exam will be on exactly one day from M to F.
     (2) For each day D in {M, T, W, R, F}, if the exam is on D, then on the evening before D (i.e., the night ending the day before D) the students do not know that the exam is on D.

   We model the students' knowledge with an operator K. We assume the students are perfect reasoners (so their knowledge is closed under logical deduction) and that they know the announcement is true. We also assume that the students know that the exam must occur on one of the days.

   We will show that the assumption that the students know the announcement leads to a contradiction.

   Step 1: Consider Friday.
     Suppose the exam hasn't occurred by Thursday evening. Then the students know that the exam must be on Friday. But then, on Thursday evening, they would know that the exam is on Friday. This violates the surprise condition for Friday. Therefore, the exam cannot be on Friday.

   Step 2: Having ruled out Friday, consider Thursday.
     If the exam hasn't occurred by Wednesday evening, then the students know that the exam must be on Thursday or Friday. But we have already ruled out Friday (by Step 1), so they know it must be on Thursday. Then on Wednesday evening, they would know that the exam is on Thursday. This violates the surprise condition for Thursday. Therefore, the exam cannot be on Thursday.

   Step 3: Similarly, we rule out Wednesday, Tuesday, and Monday.

   This leads to the conclusion that the exam cannot occur at all, which contradicts the announcement.

   However, the teacher does give the exam (say, on Tuesday) and it is a surprise because the students thought it couldn't happen at all? But that doesn't seem right because the students, by the above reasoning, would have concluded that the exam cannot occur, and then when it happens on Tuesday, they are surprised.

   But wait: the above reasoning is done by the students under the assumption that they know the announcement. We are going to show that it is impossible for the students to know the announcement in the first place.

   The key is that the announcement is like a Moore sentence: it can be true, but it cannot be known (or believed with certainty) by the students.

   Let A be the announcement: 
     A = (exam on exactly one day) ∧ 
         (if exam on M, then not K_M(exam on M)) ∧ 
         (if exam on T, then not K_T(exam on T)) ∧ ... 

   (where K_D(φ) means that on the evening before day D, the students know φ)

   We are going to show that the students cannot know A. That is, we cannot have K(A) without leading to a contradiction.

   The derivation:

   Assume for contradiction that the students know A at the beginning (before Monday). We denote this by K(A). We also assume that the students are perfect reasoners and that they know the logical consequences of what they know.

   Now, we consider the last day, Friday.

   Lemma 1: If the students know A and if the exam hasn't occurred by Thursday evening, then they know that the exam must be on Friday. 
     Proof: Since they know A, they know the exam must be on one of the days. But if it hasn't happened by Thursday, then it must be on Friday. Moreover, they know this because they know A and they know the days that have passed without an exam.

   But then, on Thursday evening, they know that the exam is on Friday. This means that if the exam were on Friday, then on Thursday evening they would know it, which violates the condition for Friday in A: 
     A entails: if exam on Friday then not K_Friday(exam on Friday)

   But note: K_Friday(exam on Friday) is exactly the state of knowledge on Thursday evening that the exam is on Friday.

   So if the exam is on Friday, then A is false. Therefore, if the students know A and are certain that the exam has not occurred by Thursday, they can deduce that the exam cannot be on Friday (because if it were, then A would be false, but they know A so it must be true, hence contradiction). Therefore, they know that the exam is not on Friday.

   But wait: that deduction happens on Thursday? Actually, we can do it earlier. The students, knowing A and being perfect reasoners, can do the backward induction in advance.

   So at the beginning (before Monday), they can reason:

     - On Thursday evening, if no exam by then, they would know it's Friday and violate the surprise. Therefore, the exam cannot be on Friday (because if it were, then A would be false, but they know A, so it must not be on Friday).

     - Therefore, they know that the exam must be on Monday, Tuesday, Wednesday, or Thursday.

     - Now, consider Thursday: if the exam hasn't occurred by Wednesday evening, then the students know it must be on Thursday (since Friday is ruled out). Then on Wednesday evening, they would know it's Thursday. This violates the surprise condition for Thursday. Therefore, the exam cannot be on Thursday.

     - Similarly, they rule out Wednesday, Tuesday, and Monday.

     - Hence, they conclude that no day is possible, which contradicts A (which says there is an exam). 

   Therefore, they have a contradiction from the assumption that they know A.

   Hence, the students cannot know A. 

   However, note that A can be true. For example, suppose the exam is on Monday. Then on Sunday evening, the students do not know that the exam is on Monday (because they haven't ruled out other days). So the surprise condition holds for Monday. The condition for the other days doesn't matter because the exam isn't on those days. So A is true.

   But the students cannot know A in advance because if they did, they would reason as above and conclude that no exam is possible, which would lead them to not expect the exam on Monday. Therefore, when Monday comes and the exam happens, they are surprised.

   Thus, the announcement A is true, but the students cannot know it (in the sense of having certain knowledge) at the beginning.

   Now, let's address the objections.

   Objection 1: Moore sentences are odd to *assert* while this one is odd to *believe*, so maybe the parallel is just a pun.

     A Moore sentence is of the form "p and I don't believe p". It is odd to assert because if you assert it, then you are asserting p and also asserting that you don't believe p, which is self-defeating (since by asserting p you are expressing belief in p). 

     In the case of the surprise exam, the announcement A is not about the students' beliefs at the time of the announcement but about their future knowledge. However, the structure is similar: the announcement entails that the exam will occur and that at each day the students will not have knowledge on the evening before. But if the students come to know A, then they can deduce that the exam cannot occur, which contradicts the first part. So it is like: "The exam will happen and you (the students) will never know in advance the day it happens (until the day it happens)". But if the students know that, then they can figure out that it cannot happen, so they do know in advance that it cannot happen, which then makes it possible (by not expecting it) but then that contradicts the fact that they deduced it couldn't happen.

     The parallel is that both are self-referential in a way that leads to a contradiction if the agent believes/asserts them. In the Moore case, if you believe the Moore sentence "p and I don't believe p", then you believe p and you believe that you don't believe p. But if you believe p, then you do believe p, so you have a contradiction. Similarly, if the students believe A, then they can deduce that the exam cannot occur, which contradicts A (which says it does occur). Hence, the students cannot believe A without contradiction.

     So the parallel is not just a pun: in both cases, the content of the belief/assertion leads to a contradiction when combined with the fact that the agent believes it.

   Objection 2: The students can just believe it with credence 0.99 and nothing goes wrong, so what precisely is impossible?

     The impossibility we have shown is for certain knowledge (probability 1). If the students have a high credence (say 0.99) but leave a little room for doubt, then the backward induction argument doesn't go through. For example, they might assign a small probability that the teacher made a mistake or that there is some other failure. Then on Thursday evening, if no exam has happened, they become very sure that the exam is on Friday (but not 100%). Then the exam can be on Friday and still be a surprise in the sense that they were not 100% sure. Similarly, they might not completely rule out Friday in advance. 

     However, note that the surprise condition in the announcement is typically taken to mean that the students do not know (with certainty) the day of the exam the evening before. If we weaken to probabilistic surprise (they are not very confident), then the announcement might be interpreted as a claim about not having high confidence. But the original statement is about knowledge (certainty). 

     The impossibility only arises for certainty. So if the students are not certain of the announcement, then they can avoid the contradiction. But if they are required to be certain, then they cannot believe the announcement without running into the contradiction.

     Therefore, the teacher's announcement cannot be believed with certainty by the students. But it can be believed with less than certainty.

   Objection 3: A reliable informant should be able to tell you things you can know, so what went wrong with the teacher?

     The teacher is reliable in the sense that what she says is true. But that doesn't mean that what she says can be known (with certainty) by the students. The problem is that the content of the announcement is such that if the students come to know it, they can deduce that it is false. Therefore, the students cannot come to know it. But the teacher can still say it and it can be true. 

     The issue is that the announcement is self-defeating for knowledge: it makes itself unknowable. The teacher's reliability doesn't help because even if the students trust the teacher 100%, they still cannot have the knowledge of the announcement without leading to a contradiction. So the teacher's announcement is not something that can be known by the students in advance.

     What went wrong is that the teacher made an announcement that, if it is known, would cause its own falsity. Therefore, it cannot be known. But that doesn't mean it isn't true.

   Finally, can the teacher promise a surprise exam? And can she know in advance that she has pulled it off?

     The teacher can promise it and it can be true. For example, if she gives the exam on Monday, then on Sunday evening the students do not know that it will be on Monday (because they have no information to rule out other days). So it is a surprise. 

     But can the teacher know in advance that she has pulled it off? That is, can the teacher know at the time of the announcement (say, on Sunday) that the exam will be a surprise? 

     The teacher's knowledge: she knows which day she has chosen. Suppose she chooses Monday. Then she knows that on Sunday evening (which is before Monday) the students do not know that the exam is on Monday. So the surprise condition for Monday holds. But what about the other days? The announcement says that for each day, if the exam is on that day then the surprise holds for that day. Since the exam is only on Monday, the conditions for other days are vacuously true. Therefore, the teacher knows that the announcement A is true.

     However, note that the teacher does not have the same problem as the students because the teacher knows the day. So the backward induction argument doesn't apply to the teacher. The teacher does not have to worry about the students' reasoning about the future because she knows the exam is on Monday.

     But wait: what if the teacher doesn't decide the day in advance? What if she decides at the last moment? Then she might not know until the day she gives the exam. But in the scenario, we assume the teacher is perfectly reliable and never cancels, so she must have a plan. 

     Therefore, the teacher can know in advance that the announcement is true if she has already chosen the day and if she knows that the students don't know the day. But note: the teacher must also know that the students will not come to know the day the evening before? How can she know that? 

     For Monday: on Sunday, the students have no information. They know the announcement, but we have argued that they cannot know the announcement with certainty. However, if the teacher believes that the students are certain of the announcement, then she would be mistaken because that leads to a contradiction. But if the teacher does not assume that the students are certain, then she might think that the students have some doubt. Then the exam can be a surprise even if not with certainty.

     However, the announcement is typically about knowledge (certainty). Therefore, to make the announcement true, it must be that on the evening before the exam day, the students do not know (with certainty) that the exam is the next day.

     How can the teacher ensure that? If she chooses Monday, then on Sunday the students do not know it's Monday. So that's fine. But if she chooses Tuesday, then on Monday evening the students must not know that it's Tuesday. How can the teacher guarantee that? 

     On Monday evening, if the exam did not happen on Monday, then the students know that the exam must be on Tuesday, Wednesday, Thursday, or Friday. But they also know that the exam cannot be on Friday (by their reasoning, if they are certain of the announcement). But wait, we have already argued that they cannot be certain of the announcement. So if they are not certain, then on Monday evening they might still assign some probability to Friday? 

     The teacher, however, does not have control over the students' reasoning. She cannot force the students to be certain. Therefore, if the students are not certain of the announcement, then they might not rule out Friday, and then they might not be certain on Monday evening that the exam is on Tuesday. So the exam on Tuesday might be a surprise.

     But if the students are certain, then they would rule out Friday, then Thursday, etc., and then they would conclude that the exam must be on Monday. Then if it doesn't happen on Monday, they would know on Monday evening that it must be on Tuesday. Then the exam on Tuesday would not be a surprise.

     Therefore, for the teacher to be able to know that the announcement is true, she must know that the students are not certain of the announcement. But that seems odd because she is making the announcement and she is reliable. Why wouldn't the students be certain?

     Alternatively, the teacher might know that the students are not perfect reasoners? But we assumed they are.

     So the teacher's situation: 
        - If she believes that the students are certain of the announcement, then she knows that the students will deduce that the exam must be on Monday. Then she knows that if the exam is on Tuesday, then on Monday evening the students will know it's Tuesday. But then the announcement would be false if the exam is on Tuesday. So she must not give the exam on Tuesday (or any day after Monday) because then the surprise condition would fail. Therefore, she must give it on Monday. But then, on Sunday evening, the students do not know it's Monday. So the announcement holds. 

        - Therefore, if the teacher believes the students are certain of the announcement, then she knows that the only way to have a surprise exam is to give it on Monday. And she can do that and know that it will be a surprise.

     However, note: if the students are certain and they reason perfectly, then they should conclude that the exam must be on Monday. Then on Sunday evening, they would believe that the exam is on Monday. But the surprise condition requires that on Sunday evening they do not know that the exam is on Monday. So if they believe it's on Monday, then it's not a surprise? 

     But wait: the students conclude that the exam must be on Monday because they have ruled out every other day. So they know that it is on Monday. Therefore, on Sunday evening, they know that the exam is on Monday. This violates the surprise condition for Monday. 

     Therefore, if the students are certain and they reason perfectly, then the teacher cannot give a surprise exam on any day. Because if she gives it on Monday, then the students know it on Sunday, so it's not a surprise. If she gives it on Tuesday, then on Monday evening they know it's Tuesday (because they have ruled out Monday and then they rule out all days after Tuesday by backward induction and conclude Tuesday), so it's not a surprise. And so on.

     Hence, the teacher cannot know in advance that she has pulled it off if she also believes that the students are certain and are perfect reasoners. Because in that case, the announcement is false: the exam won't be a surprise. 

     But if the students are not certain, then the teacher can pull it off. For example, she can choose Tuesday. Then on Monday evening, the students (who are not certain) might still think there is a chance that the exam is on Friday, so they are not sure that it is on Tuesday. Then on Tuesday morning, they are surprised.

     Therefore, the teacher can promise a surprise exam only if the students are not certain of the announcement. And she can know in advance that she has pulled it off only if she knows that the students are not certain. But if the teacher is reliable and the students know it, then why wouldn't they be certain? 

     The resolution is that the teacher's announcement is self-defeating for certainty. Therefore, the students cannot be certain. So the teacher can rely on the fact that the students will have some doubt. 

     But then, the teacher can know that the students are not certain? How? Because if they were certain, they would get a contradiction, so they must not be certain. 

     Therefore, the teacher can know that the students are not certain of the announcement. And then she can know that the announcement is true because she has chosen a day (say Tuesday) and she knows that on Monday evening the students, having some doubt, do not know for sure that the exam is on Tuesday. 

     However, note that the teacher must also ensure that the students are not certain on the evening before the exam day. She can know that they are not certain at the time of the announcement, but what about later? 

     If the students are perfect Bayesians, they update. On Monday, if no exam, they update and might become more confident about the remaining days. But we have argued that if they were 100% certain at the start, they would have ruled out all days after Monday. Since they are not 100% certain, they don't rule out Friday. So on Monday evening, they might assign a high probability to Tuesday, but not 100%. Then the exam on Tuesday is a surprise.

     Therefore, the teacher can know in advance that she has pulled it off if she chooses a day and she knows that the students are not (and will not become) certain of the day until the exam day.

     But note: the teacher's own action of giving the exam on Tuesday will cause the students to update. However, she can predict that on Monday evening, the students will still have some doubt.

     Therefore, the teacher can promise a surprise exam and know that she has pulled it off, provided that the students are not certain of the announcement (which they cannot be, for the reasons we've seen).

   In summary:

     - The announcement can be true.
     - The students cannot be certain of the announcement without contradiction.
     - The teacher can be certain of the announcement if she has chosen the day and if she knows that the students are not certain of the announcement (and hence will not deduce the day in advance).
     - The exam will be a surprise because the students, lacking certainty, do not know the day until it happens.

   Thus, the surprise exam is possible, but only if the students are not 100% certain of the announcement. The teacher can know this because the announcement is self-defeating for certainty.

   The derivation of the contradiction relied on the assumption that the students are certain (i.e., they assign probability 1 to the announcement). Without that, the backward induction doesn't go through.

   So the teacher's announcement is a Moore-like sentence: it can be true, but it cannot be believed with certainty by the students. And that is why it works.
answer: |-
  ### The Surprise Exam Paradox: A Rigorous Analysis

  **Setup:**  
  - The teacher announces: "There will be an exam next week (Monday-Friday), and it will be a surprise—meaning that on the evening before the exam, you will not know the exam is the next day."  
  - Students are **certain** the announcement is true (they treat it as knowledge).  
  - The teacher is **perfectly reliable** (the exam occurs on exactly one day, never canceled or moved).  

  **Claim:**  
  The teacher’s announcement is analogous to a Moore sentence ("p is true but I don’t believe p"). It can be *true*, but no consistent, deductively closed student can be **certain** of it. The announcement doesn’t rule out the exam—it rules out the students’ certainty.  

  ---

  ### Derivation: Why Certainty Leads to Contradiction  
  Let:  
  - \(D = \{ \text{Monday}, \text{Tuesday}, \text{Wednesday}, \text{Thursday}, \text{Friday} \}\).  
  - \(E_d\): "Exam occurs on day \(d\)".  
  - \(K_d\): "On the evening before \(d\), students know \(E_d\) is true".  
  - Announcement \(A\):  
    \[
    A \equiv \left( \bigvee_{d \in D} E_d \right) \land \left( \bigwedge_{d \in D} (E_d \implies \neg K_d) \right)
    \]  
    (i) Exactly one exam occurs. (ii) If exam on \(d\), students don’t know on the prior evening.  

  **Assumptions:**  
  1. **Certainty:** Students are certain of \(A\) (i.e., \(K_{\text{start}}A\), where "start" is before Monday).  
  2. **Deductive closure:** Students know all logical consequences of their knowledge.  
  3. **Perfect reliability:** \(A\) is true (exam occurs on some \(d\) and surprises).  

  #### Step-by-step Contradiction:  
  1. **Friday cannot hold the exam:**  
     - Suppose \(E_{\text{Friday}}\).  
     - By Thursday evening, if no exam occurred, students know:  
       \[
       \neg E_{\text{Mon}} \land \neg E_{\text{Tue}} \land \neg E_{\text{Wed}} \land \neg E_{\text{Thu}} \implies E_{\text{Fri}}.
       \]  
     - Since students know \(A\) (hence \(E_{\text{Fri}}\) is possible), they deduce \(E_{\text{Fri}}\) on Thursday evening. Thus, \(K_{\text{Fri}}\).  
     - But \(A\) requires \(E_{\text{Fri}} \implies \neg K_{\text{Fri}}\). Contradiction.  
     - ∴ Students (certain of \(A\)) deduce \(\neg E_{\text{Fri}}\).  

  2. **Thursday cannot hold the exam:**  
     - Suppose \(E_{\text{Thursday}}\).  
     - By Wednesday evening, if no exam occurred, students know:  
       \[
       \neg E_{\text{Mon}} \land \cdots \land \neg E_{\text{Wed}} \implies (E_{\text{Thu}} \lor E_{\text{Fri}}).
       \]  
     - From Step 1, they know \(\neg E_{\text{Fri}}\), so they deduce \(E_{\text{Thu}}\). Thus, \(K_{\text{Thu}}\).  
     - But \(A\) requires \(E_{\text{Thu}} \implies \neg K_{\text{Thu}}\). Contradiction.  
     - ∴ Students deduce \(\neg E_{\text{Thu}}\).  

  3. **Iterate backward (Wednesday, Tuesday, Monday):**  
     - Same logic eliminates Wednesday, then Tuesday, then Monday.  
     - Result: Students deduce \(\neg E_d\) for all \(d\).  
     - But \(A\) requires \(\bigvee_{d} E_d\) (exam occurs). Contradiction.  

  **Conclusion:**  
  Initial certainty in \(A\) leads to a contradiction. Thus, **no consistent student can be certain of \(A\)**.  

  **Where certainty does the work:**  
  - Certainty forces students to accept all deductive consequences of \(A\).  
  - Without certainty (e.g., credence <1), students wouldn’t definitively eliminate days, avoiding contradiction.  

  ---

  ### Objections and Responses  

  #### Objection 1: "Moore sentences are odd to *assert*, but this is odd to *believe*. Isn’t the parallel superficial?"  
  - **Response:** The parallel is structural, not merely linguistic.  
    - **Moore sentence ("p but I don’t believe p"):**  
      - True if \(p\) is true and you don’t believe it.  
      - Cannot be *believed* (believing it forces "I believe p" and "I don’t believe p").  
    - **Surprise exam announcement \(A\):**  
      - True if the exam occurs and surprises.  
      - Cannot be *known/certain* (certainty forces students to deduce no exam, violating surprise).  
    - **Key similarity:** Both create self-referential contradictions when internalized by the agent. The difference (assertion vs. belief) is secondary to the underlying epistemic inconsistency.  

  #### Objection 2: "Students can believe \(A\) with credence 0.99. Nothing goes wrong—so what’s impossible?"  
  - **Response:** The impossibility is specific to **certainty** (credence 1).  
    - With credence <1, students never fully eliminate any day (e.g., they assign small probability to Friday even on Thursday evening).  
    - The exam can then occur on (e.g.) Tuesday:  
      - Monday evening: Students assign high probability to Tuesday but also to later days → no certainty → surprise preserved.  
    - **What’s impossible:** Certainty in \(A\). The paradox *only* arises under the **certainty assumption**. Without it, \(A\) can be true and believed probabilistically.  

  #### Objection 3: "A reliable informant should be able to tell you knowable truths. What went wrong with the teacher?"  
  - **Response:** The teacher’s announcement is **self-defeating for knowledge transmission**.  
    - Normally, a reliable teacher can convey knowledge. But \(A\) has a twist:  
      - If students *could* know \(A\), they’d deduce no exam → \(A\) would be false.  
      - Thus, \(A\) can only be true if students *don’t* know it.  
    - **What went wrong:** The teacher uttered a true statement that cannot be *known* by the students—not because of unreliability, but because its truth *depends* on their ignorance. The reliability guarantee ("I will do this") doesn’t extend to making \(A\) *knowable*.  

  ---

  ### Final Answers  
  1. **Can the teacher promise a surprise exam?**  
     - **Yes**, but only if students **aren’t certain** of the announcement. The exam can occur (e.g., on Monday) and be a surprise if students doubt \(A\) slightly (e.g., they allow a small chance of no exam or later days).  

  2. **Can the teacher know in advance she pulled it off?**  
     - **Yes**, but her knowledge depends on **students’ uncertainty**.  
       - The teacher knows:  
         - She will give the exam on a specific day (e.g., Tuesday).  
         - Students aren’t certain of \(A\) (because certainty would break \(A\)).  
         - Thus, on Monday evening, students won’t *know* Tuesday is the exam day (they’ll have doubt).  
       - **Crucially:** The teacher’s knowledge doesn’t require students to be certain—only that they’ll be surprised.  

  **Summary:** The announcement is a "knowledge-undermining" promise. It can be true and fulfilled, but it cannot be an object of certainty for the students—and the teacher’s success hinges on their doubt.
