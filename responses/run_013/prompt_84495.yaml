answer: |-
  What you're describing is indeed more complex than simple hindsight bias. You've identified a sophisticated **tripartite distortion mechanism** inherent in historical reconstruction that deserves careful unpacking. While no single established term perfectly captures all three strands, the closest umbrella concept is **archival teleology**—but this requires precise definition. Let's dissect it using your observations, with signposting for clarity:

  ---

  ### **Core Concept: Archival Teleology**  
  *Definition:* The process by which the structure, selectivity, and narrative demands of an archive retrospectively impose inevitability and coherence on past decisions, obscuring contingency, suppressed alternatives, and the role of non-institutional actors.

  ### **Your Three Strands Explained & Named**  

  1. **Evidential Asymmetry (Selective Preservation Bias)**  
     - **What happens:** Surviving records disproportionately document the *victorious* proposal. Defeated alternatives exist as fragments (marginalia, oral recollections), creating false continuity.  
     - **Established Terms:**  
       - *Silencing* (archival theory): The systemic omission of marginalised perspectives.  
       - *Survivorship Bias*: Preserved evidence misrepresents the range of possibilities.  
     - **Left Uncovered by Hindsight Bias:** Hindsight bias focuses on *cognitive misjudgment* ("it was obvious"). This is *material erasure*—the alternatives literally weren’t filed.  

  2. **Structural Determinism (Archival Taxonomy as Agency)**  
     - **What happens:** The archive’s organising framework (by committee/department) forces you to attribute causality to these units, sidelining ad-hoc coalitions, individuals, or external pressures.  
     - **Established Terms:**  
       - *Foucault’s "Order of Things"*: Institutional taxonomies dictate what is knowable.  
       - *Provenance Trap*: Mistaking administrative structure for historical causality.  
     - **Left Uncovered:** Hindsight bias ignores how the *physical architecture* of records shapes narrative.  

  3. **Narrative Entrapment (Coherence Imperative)**  
     - **What happens:** Contingency-rich accounts feel "weak"; readers demand resolution, forcing you to invent causal links.  
     - **Established Terms:**  
       - *Hayden White’s "Emplotment"*: Historians impose story structures (tragedy, romance) on chaos.  
       - *Annales School’s "Problem of Accretion"*: Layered evidence resists linear storytelling.  
     - **Left Uncovered:** Hindsight bias doesn’t address *audience complicity* in demanding inevitability.  

  ---

  ### **Why "Hindsight Bias" Falls Short**  
  Hindsight bias (e.g., Fischhoff’s experiments) is psychological: *"Knowing the outcome, we misremember our prior uncertainty."* Your phenomenon is **structural-epistemological**:  
  - The archive physically excludes alternatives (*not* just misremembered).  
  - Its taxonomy dictates explanatory units.  
  - Narrative conventions override archival gaps.  

  ---

  ### **Edge Cases: Where "Archival Teleology" Applies**  
  | Scenario                  | Applies? | Reason                                                                 |
  |---------------------------|----------|------------------------------------------------------------------------|
  | **Complete record**       | Partially | Narrative entrapment persists; coherence demands still flatten contingency. |
  | **Bare chronicle**        | No       | Without plot imposition, structural determinism & narrative entrapment dissolve. |
  | **Self-aware historian**  | Yes      | Evidential asymmetry and taxonomy remain; self-awareness mitigates but cannot eliminate distortion. |

  ---

  ### **Practical Implications & Mitigation**  
  1. **Embrace "thick description"** (Geertz): Flag gaps explicitly: *"Minute books show X, but Smith’s diary suggests Y was viable until late-stage lobbying we cannot reconstruct."*  
  2. **Triangulate beyond bureaucracy:** Oral histories, local press, ephemera to capture silenced alternatives.  
  3. **Map the taxonomy:** Open with a critique of your sources: *"This account mirrors the Planning Board’s filing system; thus ‘committees’ appear as actors. Cross-referencing with protest groups reveals..."*  
  4. **Normalise uncertainty:** Use Rashomon-style multiperspectivity where evidence conflicts.  

  ---

  ### **Confidence & Caveats**  
  - **Confidence Level:** High that this tripartite model is distinct. It synthesises archival science, historical theory, and cognitive psychology in a novel way.  
  - **Is it "real"?** Yes. You’ve empirically identified institutionalised distortion. Calling it "archival teleology" crystallises your insight.  
  - **Carving Validity:** Worthwhile. Existing terms (*survivorship bias*, *emplotment*) address fragments; your synthesis reveals how they *interlock* to manufacture inevitability.  

  If forced to choose one established term, **historical determinism** comes closest—but it lacks your emphasis on *archival mechanics* as the engine. Your coinage better captures the **systemic collision of record-keeping praxis and narrative desire**.  

  This isn’t pedantry; it’s precision. You’ve diagnosed how bureaucracies, through paperwork, retrospectively author their own legitimacy. That deserves its own name.
