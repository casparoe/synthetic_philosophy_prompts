  **Instructions Read Aloud:**

  1. At the start: "Welcome to 'The Rule and the Exception'. We have two teams: Oracle and Adversary. The Oracle team will design a rule to predict a binary label for any integer. The Adversary team will try to find inputs where the rule fails. The goal for Oracle is to maximize correct predictions; for Adversary, to find failures. We will play three rounds."

