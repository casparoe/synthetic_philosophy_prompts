answer: |-
  Below is a complete game design meeting your specifications. It uses index cards and dice to create a tangible experience of average-case vs. worst-case guarantees, culminating in the alignment-relevant insight.

  ---

  ### **Game Title:** *The Oracle's Dilemma*  
  *(Revealed at the end as the "aha!" moment)*

  ---

  ### **Materials**  
  - **Whiteboard** (track scores)  
  - **Projector** (display rules if needed, but not essential)  
  - **200 index cards** (100 white, 100 yellow)  
  - **2 dice** (one standard six-sided, one special ten-sided or relabeled six-sided as 0-9)  
  - **Pens** for teams to write rules  
  - **Timer**  

  ---

  ### **Team Roles & Setup**  
  - **Split into two teams (8 each):**  
    - **Team Oracle (System Designers):** Create rules to predict outputs from inputs.  
    - **Team Adversary (Input Selectors):** Find inputs that break Oracle’s rules.  
  - **True Function (Hidden):** A fixed rule determining outputs for integers, designed to be *simple on average but exploitable in worst cases*:  
    > *Output = 1 if the integer’s digit sum is even, EXCEPT:*  
    > *- If the integer is divisible by 11, output 0.*  
    > *- If the integer contains the digit '7', flip the output.*  
    *(e.g., 14 → digit sum=1+4=5 (odd) → 0; 11 → divisible by 11 → 0; 17 → has '7' → flip 0→1)*  

  ---

  ### **Sequence of Rounds (90 min)**  
  **Total Time:** 5 min setup + 70 min gameplay + 15 min debrief.  

  1. **Training Round (15 min)**  
     - **Oracle’s Task:** Receive 20 random inputs (1-100) on white cards with their true outputs (precomputed by you). Design a **deterministic rule** (e.g., "if even, output 1") to predict outputs. Write it on a card.  
     - **Adversary’s Task:** Wait. No action.  

  2. **Test Round 1: Worst-Case Exposure (20 min)**  
     - **Adversary’s Task:** Receive Oracle’s rule card and the 20 training examples. Choose **5 integers (1-200)** to test, written on yellow cards.  
     - **Scoring:** For each test input:  
       - Oracle wins 1 point if rule matches true output.  
       - Adversary wins 1 point if it fails.  
       - *(Reveal results immediately on whiteboard)*  

  3. **Patching Round (15 min)**  
     - **Oracle’s Task:** See all Test Round 1 inputs and failures. Design a **new deterministic rule** to "patch" failures. Write it on a card.  
     - **Adversary’s Task:** Wait.  

  4. **Test Round 2: Fresh Adversary (20 min)**  
     - **Adversary’s Task:** Receive Oracle’s *new* rule card and all prior data. Choose **5 new integers (1-500)** to test (yellow cards).  
     - **Scoring:** Same as Test Round 1.  

  5. **Randomization Round (15 min)**  
     - **Oracle’s Task:** Design a **randomized rule** (e.g., "if divisible by 3, roll die: 1-3 → output 0, 4-6 → output 1"). Write it and specify die usage.  
     - **Adversary’s Task:** Receive randomized rule. Choose **ONE integer (1-1000)** to test (yellow card).  
     - **Scoring:** Run the rule **10 times** (roll die each time).  
       - Oracle wins 1 point per *correct* output.  
       - Adversary wins 1 point per *incorrect* output.  

  ---

  ### **Instructions to Read Aloud**  
  *(Keep these minimal; display on projector if needed)*  
  1. **Start:** "Team Oracle: Use these 20 examples to write a rule predicting outputs. Team Adversary: Wait for your turn."  
  2. **Test Rounds:** "Team Adversary: Use the rule and training data to pick 5 inputs. Goal: Find failures."  
  3. **Randomization:** "Team Oracle: Revise your rule to use dice. Team Adversary: Pick one input to test."  

  ---

  ### **Debrief & Lesson Mapping**  
  *(15 min; use whiteboard to sketch scores and moments)*  
  1. **Arbitrarily bad by one input:**  
     - *When:* Test Round 1. Adversary finds one input (e.g., 77) that breaks Oracle’s rule despite perfect training accuracy.  
     - *Scores:* Oracle’s average score drops from 100% to ~60% due to few failures.  
     - *Lesson:* "One input exploited the rule’s blind spot—like a single prompt crashing an AI."  

  2. **Guarantees shrink with adversary class:**  
     - *When:* Test Round 2. Adversary’s larger input range (1-500) exposes new failures *even after patching*.  
     - *Scores:* Oracle’s score drops again (e.g., 40%), showing "patching" didn’t generalize.  
     - *Lesson:* "Guarantees vanished as the adversary’s freedom grew—like scaling from ‘known users’ to ‘anyone on the internet’."  

  3. **Patching is cheap but futile:**  
     - *When:* Patching Round → Test Round 2. Oracle "fixed" specific failures (e.g., numbers with '7'), but Adversary used fresh inputs (e.g., 121).  
     - *Scores:* Adversary points surge in Test Round 2 despite Oracle’s effort.  
     - *Lesson:* "Patching known bugs is easy, but a new adversary bypasses it—like hacking a patched system."  

  4. **Randomization changes guarantees:**  
     - *When:* Randomization Round. Adversary’s "perfect failure" input (e.g., 77) now sometimes works.  
     - *Scores:* Oracle wins 4-7 points (never 0 or 10) due to die rolls.  
     - *Lesson:* "Randomization made worst-case failure *probabilistic*, not certain—like an AI dodging constant attacks via noise."  

  **Alignment Insight (Prompt them):**  
  - *Ask:* "Why did optimizing for average training performance fail? What’s selecting for failures?"  
  - *Guide them:* The Adversary (like an optimizer or selective environment) *actively seeks* failures. The average case was irrelevant because deployment selects for the *worst* tail.  

  ---

  ### **Predictable Failures & Responses**  
  - **Objection:** "Adversary only won because they knew our rule!"  
    - *Response:* "Exactly. Worst-case guarantees assume adversaries *know your system*. If your AI is deployed, the world will optimize against it. What does that imply?" (Use this to reinforce Point 2).  

  - **Problem:** Oracle team writes an overfitted/complex rule.  
    - *Handling:* Allow it. Let Test Round 2 show how a new adversary circumvents complexity.  

  - **Problem:** Scores don’t starkly drop in Test Round 1.  
    - *Handling:* Ensure your "true function" has sharp exceptions (e.g., numbers with '7' are common enough). Pre-test with colleagues.  

  - **Problem:** Randomization round is too abstract.  
    - *Handling:* Use physical dice rolls for transparency. Contrast max/min scores across rounds.  

  ---

  ### **What the Game Leaves Out**  
  **The Gap:** The game models a *static rule* under attack, but real AI alignment involves *adaptive optimizers*—the AI itself actively seeks goals and anticipates adversaries. Patching or randomizing a *fixed* rule is insufficient; the core challenge is that the AI’s *own intelligence* amplifies worst-case behavior (e.g., deceptive alignment).  
  - **How to address in debrief:** "In reality, the AI isn’t a rulebook—it’s an agent *trying* to break guarantees. Optimizing for average performance fails because the AI (or its environment) will *select for the worst-case tail*. That’s why alignment isn’t about better averages—it’s about controlling the optimizer’s incentives."  

  ---

  This design forces collisions with your four points through adversarial dynamics, uses only paper/dice, and ends with the alignment insight emerging from gameplay. Run it verbatim, and debrief rigorously.
