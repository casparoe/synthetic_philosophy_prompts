  - Final verdict on whether residue indicates limitations of demographic vocabulary or philosophical unclarity.

  I should start by mapping the philosophical positions to demographic concepts. The identification problem in APC models is crucial here - since age, period, and cohort are linearly dependent, we need constraints to separate effects. This relates directly to whether "generation effects" are identifiable or just artifacts.

  For the realist view: This claims generations have shared causal structure. In demographic terms, this might map to cohort effects that persist beyond period influences - but we must distinguish cohort effects from generation effects. Realists might see generations as cohorts with amplified shared experiences. The identification problem bites here because without constraints, we can't isolate these effects cleanly.

  For nominalists: Generations are just cut-points on birth year. This translates well to arbitrary cohort groupings in APC models. Any apparent effects are artifacts of how we bin the continuous variable of birth year. The identification problem supports this view - cohort effects aren't uniquely identifiable.

  For social constructivists: The interesting part is the feedback loop - classification changes behavior. This might map to period effects that differentially impact cohorts because of their generational labels. But demographic models don't typically capture how labels affect behavior - this is where vocabulary falls short.

  Now the residue report:
  First, "generational units" as subgroups within cohorts. This could be modeled as latent classes within cohorts - heterogeneity in response to period shocks. But the demographic vocabulary might not capture the active "working out a shared response" aspect - that's more about social processes than variance components.

  Second, their latent class model with drifting mixing proportions. Here's the key question: does this reconstruction make realism impossible? I think it might - because the latent classes are estimated from data with constraints, not assumed real. This quietly converts realism to nominalism by making generations emergent rather than fundamental.

  Finally, the verdict: I think the residue shows genuine limitations in demographic vocabulary for capturing social construction processes and meaning-making. But some philosophical unclarity exists too - debates often conflate cohort effects with generation effects. The core disagreement might really be about constraint selection in models rather than ontology.

