answer: |-
  ### Direct Answer
  No, your picture is incomplete. Expected-value fanaticism is **not solely a pathology of unbounded utility functions**. Even with strictly bounded utilities, sufficiently extreme finite payoffs combined with vanishingly small probabilities can still force fanatically counterintuitive decisions (like accepting all Pascal's Mugger offers). A probability floor is one repair, but it has significant costs. Crucially, your reluctance to hand over your wallet is **not merely a bias to be trained away**; it reflects a defensible position in decision theory.

  ---

  ### Setting the Problem Up Correctly
  Your framing assumes that **fanaticism requires infinite utilities or unbounded payoffs**. This misses a critical nuance: fanaticism arises from the *interaction* of probability, payoff magnitude, and the **linearity of expected utility (EU) maximization**. EU is defined as:

  \[
  \text{EU}(A) = \sum_i p_i \cdot u(x_i)
  \]

  where \(p_i\) is the probability of outcome \(x_i\) and \(u\) is a bounded utility function (e.g., \(u(x) \in [0, 1]\)). For fanaticism to occur in this setup, two conditions must hold:  
  1. **Extreme payoffs**: The utility function must allow for outcomes with values arbitrarily close to its upper bound (e.g., \(u(x^*) = 1 - \epsilon\) for tiny \(\epsilon\)).  
  2. **No probability floor**: Probabilities can be arbitrarily small but non-zero.  

  In your finite-bounded case, the issue persists because EU maximization treats a \(10^{-12}\) chance of +0.999 utils as superior to a guaranteed +0.001 utils (\(10^{-12} \times 0.999 > 0.001\)). The problem is well-posed if:  
  - Utilities are bounded but admit *arbitrarily valuable* finite outcomes.  
  - Probabilities are real numbers in \((0,1]\) (no inherent lower bound).  
  - EU maximization is strictly followed.  

  ---

  ### What the Fanaticism Arguments Actually Rest On
  Fanaticism relies on **three core premises**, only one of which involves infinity:  

  1. **The Archimedean Principle**: For any finite outcomes \(A \prec B \prec C\), there exists a probability \(p < 1\) such that a \(p\)-chance of \(C\) is better than a guaranteed \(B\), *no matter how small the utility gap between \(B\) and \(C\)*. This is a standard axiom in EU theory.  
  2. **No Upper Bound on Stakes**: Outcomes can have utilities arbitrarily close to the supremum of your utility function. This is true for bounded functions if the supremum is approachable (e.g., saving 1 billion lives ≈ 0.999 utils, saving 1 trillion ≈ 0.999999 utils).  
  3. **No Probability Floor**: Probabilities can be arbitrarily small but positive.  

  **Crucially, Premise 1 (Archimedean) is independent of infinity**. It ensures that no matter how good \(B\) is, a slightly better \(C\) can always "trade off" against reduced probability. Combined with Premise 2, this forces fanaticism: for any fixed cost (e.g., losing $50), there exists a huge-but-finite payoff and a tiny probability such that EU favors paying the cost. Infinity is *sufficient* for fanaticism but **not necessary**; finite leverage points suffice.

  ---

  ### Candidate Repairs and What Each One Costs
  | **Repair**               | **Mechanism**                                                                 | **Cost**                                                                                                |
  |--------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|
  | **Probability Floor**    | Ignore probabilities below threshold \(\delta\) (e.g., \(10^{-20}\)).          | **Arbitrariness**: Why \(\delta = 10^{-20}\)? Also, EU violations: some genuinely good long shots ignored. |
  | **Utility Discounting**  | Apply diminishing returns to utility (e.g., \(u(\text{lives saved}) = 1 - e^{-k\cdot\text{lives}}\)). | **Under-sensitivity**: May neglect large but plausible benefits (e.g., asteroid prevention).              |
  | **Lexical Priority**     | Split decisions: first avoid catastrophe, then maximize EU.                   | **Incompleteness**: Vague thresholds; hard to formalize tradeoffs between lexical tiers.                 |
  | **Risk-Aversion**        | Use a concave transform over EU (e.g., rank-dependent utility).               | **Complexity**: Loses EU’s simplicity; may violate statewise dominance.                                 |
  | **Epistemic Neglect**    | Assign probability zero to claims lacking robust evidence.                    | **Dogmatism**: Paralyzes action on novel threats (e.g., poorly understood pandemics).                   |

  The probability floor is defensible if paired with **epistemic humility**: probabilities below \(\delta\) often reflect model uncertainty, not just physical chance. But it remains a compromise.

  ---

  ### What This Means for How You Should Act
  You are **not irrational** for refusing Pascal’s Mugger. Expected utility theory with unbounded or highly leveraged utilities demands fanaticism, but **no coherent decision system escapes tradeoffs**. Adopting a probability floor (e.g., \(10^{-15}\)) or mild utility discounting aligns with human intuition and avoids egregious bets, while preserving EU for "reasonable" decisions. Your values can remain bounded; the key is rejecting either the Archimedean principle for extreme stakes or the idea that probabilities can be meaningfully assigned to arbitrarily outlandish propositions. **Train scope sensitivity for realistic stakes, but retain skepticism toward cosmic gambles.** This is a substantively justified stance, not a bias.
