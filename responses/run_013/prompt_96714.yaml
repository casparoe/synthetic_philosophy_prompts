prompt: |-
  Four years into a novel, I have reached the point where its premise has to stop being a mood and become a rule. The premise, as I am using it, is Hofstadter's: an "I" is not an object but a level-crossing pattern — a loop a brain runs — and such patterns are not confined to the brain that runs them. They get rebuilt, in degrees, in other brains, so that one person can be partly resident in another; this is the claim he pushes furthest in I Am a Strange Loop, written after his wife's death, where the dead are said to persist in proportion to how richly the living model them. I take that as true inside the fiction. What I need from you is a procedure, not an exposition.

  I decide this question at my desk, scene by scene: which of my characters actually carries which other character, and how much. There are perhaps thirty such relationships in the book and more in the revisions, and the same call has to come out the same way twice. It matters because the ending turns on whether a particular death is a death, and because the moral accounting of the whole novel — what the survivors owe, what they are guilty of, whether anyone can be said to have killed more than a body — is currently being decided by whichever way I happen to be feeling on a given afternoon. I have read the book once, years ago, and I am not going to re-read it mid-draft; give me something I can run in ten minutes with the manuscript open. No citations, no reading list; my editor signs off on consistency, not on scholarship.

  What I want:

  - An ordered set of questions to ask about a pair of characters, with what counts as a sufficient answer to each and how the answers combine into a verdict. I do not want a yes or no: the whole point of the premise is that residence comes in degrees, so give me three or four graded verdicts and say what each licenses in narration and in what the characters can sincerely say to one another.
  - Explicit stopping points: the questions whose answer ends the inquiry with a no, and the ones where the procedure must hand the decision back to me because it is a question about what I want the book to mean, not about what the theory implies.
  - A test of the vocabulary I have been groping toward, which I suspect is half-right. I have been asking whether a host reproduces the other's pattern with fidelity, whether the modelling was reciprocal while both were alive (he modelled her back, so the loop was mutual), and whether the host can address the pattern in the second person — speak to it, be answered in its voice, be embarrassed in front of it. Tell me which of these three is doing real work, which is a redescription of another, and what is missing.
  - Worked applications to three relationships from my draft: a widow who barely attended to her husband's mind while he lived and now reconstructs him constantly, more faithfully than she ever knew him; a hostile critic who despised the dead man, read every word of him with contempt, and cannot stop arguing with him in his head; and a machine — in my book, a scholar's device trained on a dead writer's letters and journals — that produces new sentences in his voice. I expect to dislike at least one of your verdicts, and I would rather dislike it now than discover it in print.
  - An honest note on where the procedure will misfire. I can already see one trap: if residence is a matter of degree, the procedure will quietly tell me that killing a person richly carried by others destroys less than killing a solitary one, and I am not sure my book can live with that. Say plainly which steps are consequences of the premise and which are stipulations I am choosing for the fiction, and do not dress up the second kind as the first.

  Under 1,000 words, including the worked cases.
reasoning: |-
  Hmm, the user is a novelist four years into writing a book based on Hofstadter's "strange loop" theory from "I Am a Strange Loop." They need a practical procedure to determine how much one character "carries" another in their mind, which affects the story's moral themes and ending. They're frustrated with inconsistent decisions based on mood and want a consistent method without rereading the whole manuscript.

  The user has several specific requirements: an ordered set of questions with graded verdicts, clear stopping points, validation of their existing vocabulary (fidelity, reciprocity, addressability), and three worked examples. They also want honesty about where the procedure might lead to uncomfortable conclusions.

  I need to design a focused, actionable procedure. The core of Hofstadter's theory is that identity persists in others through detailed mental modeling. For the novel, this translates to how accurately and deeply one character reconstructs another's patterns of thought.

  Key elements from the user's vocabulary:
  - Fidelity: How accurately the host reproduces the other's patterns. This is essential—high fidelity means richer modeling.
  - Reciprocity: Whether the modeling was mutual when both were alive. This might indicate a stronger foundation for the pattern but isn't strictly necessary for residence.
  - Addressability: Whether the host can "speak to" the pattern and feel its presence. This seems like an emergent effect of high fidelity, not an independent factor.

  The procedure should start with concrete, observable factors to avoid early subjectivity. First, assess the raw material: how much data the host has about the other person. Without sufficient data, fidelity is impossible. Then, evaluate fidelity—how well the host uses that data to reconstruct the other's thoughts. Reciprocity can be a supporting factor, but the main driver is fidelity.

  Stopping points are crucial. If the host lacks sufficient data (Question 1), the inquiry ends with "No Residence." If fidelity is low (Question 2), it can be "Trace" or "Shadow," but not higher. Question 3 (reciprocity) and Question 4 (addressability) refine the verdict but don't override fidelity. If fidelity is high but reciprocity is low, the verdict might be "Resident" but not "Anchor," requiring authorial input on the narrative implications.

  For the worked examples:
  1. The widow: High data (married life), high fidelity (reconstructs him better now), but unclear reciprocity. Likely "Resident" or "Anchor," depending on addressability.
  2. The hostile critic: High data (read everything), medium fidelity (understands but distorts), no reciprocity. Verdict "Shadow."
  3. The machine: High data (trained on writings), high fidelity (mimics voice), no reciprocity. Logically "Resident," but the user might dislike this—it's a consequence of the premise, not a stipulation.

  The uncomfortable implication: Killing a person richly carried does destroy less of their identity, which might clash with the novel's themes. I'll note this honestly—it's inherent to Hofstadter's theory, so the user must decide whether to embrace or adjust it.

  The procedure should be concise, under 1,000 words, with clear steps and examples. The goal is to give the user a reliable tool they can apply quickly during revisions, ensuring consistency in the story's metaphysical rules.
answer: |-
  Here is a procedural tool designed for your manuscript. It provides graded outputs based on Hofstadter's core premise, focusing on reconstructible patterns. The uncomfortable implication you foresee is acknowledged in Step 5.

  **Procedure: Assessing Pattern Residence (A->B in Host X)**

  Ask sequentially. Stop if criteria met.

  1.  **Data Depth:** *Does Host X possess sufficient high-fidelity data about B's patterns (thoughts, reactions, values, quirks) to enable reconstruction?*
      *   **Sufficient:** Direct, prolonged observation/immersion (e.g., close relationship, deep study of primary sources B created). *Proceed to Q2.*
      *   **Insufficient:** Superficial knowledge, reliance on second-hand accounts, minimal interaction. *STOP. Verdict: **No Residence**.* (Stopping Point)
      *   **Ambiguous:** Significant but fragmented data (e.g., public persona only, limited private glimpses). *Proceed cautiously to Q2; fidelity likely low.*

  2.  **Fidelity:** *How accurately does Host X reconstruct B's likely patterns (responses, judgments, internal states) in relevant contexts?*
      *   **High:** X reliably predicts/simulates B's responses in novel situations in ways others (who knew B) would recognize as authentic. B's "voice" is distinct and consistent internally for X. *Proceed to Q3.*
      *   **Medium:** X reconstructs B accurately *only* in familiar contexts or based on direct memories/quotes. Struggles with nuance or novelty. *Proceed to Q3, but verdict cap is Resident.*
      *   **Low:** Reconstructions are distorted by X's own biases, desires, or projections. B's simulated responses feel inauthentic or inconsistent. *STOP. Verdict: **Trace** (fleeting, distorted echoes) or **Shadow** (X argues *against* a distortion of B).* (Stopping Point for anything below Medium)

  3.  **Reciprocity (Historical):** *While both were alive, was there significant mutual pattern-building? (Did B actively model X, creating a feedback loop?)*
      *   **Yes:** Deep mutual understanding, adaptation, co-creation of shared "couple" or "pair" dynamics existed. *Strengthens case for higher verdict.*
      *   **No:** Relationship was asymmetric (e.g., X studied B, but B was indifferent/unaware of X). *Reduces potential verdict, doesn't eliminate.*
      *   **N/A:** B is not deceased or is the machine. *Proceed.* (Reciprocity is a *strengthening* factor, not a *requirement*. Its absence limits *depth*, not existence.)

  4.  **Addressability/Responsiveness:** *Does Host X experience the reconstructed B-pattern as an *internal presence* that can be addressed, that "answers back" (even if just in X's mind), creating a sense of dialogue or internal social friction?*
      *   **Yes:** X genuinely feels B's presence as an "other" internally, leading to internal dialogue, argument, shame, or comfort. *Proceed to Verdict.*
      *   **No:** X reconstructs B passively, as an object of thought ("I wonder what B would think?"), not as an internal interlocutor. *Proceed to Verdict.*
      *(Addressability is a strong *indicator* of high Fidelity creating a functional loop, often emergent from Q2. It rarely exists without High Fidelity. It adds qualitative weight to the verdict but isn't a separate pillar.)*

  **Verdicts (Combining Q2-4):**

  *   **Anchor (High Fidelity + Yes Addressability +/- Yes Reciprocity):** B is a core, persistent, functional presence within X. X *sincerely* feels B is "with" them. Narration can depict B's "voice" internally guiding, arguing, comforting. Characters can credibly say "You're still with me," "I hear you," "I feel your judgment." Moral weight: Killing the body leaves a significant, active presence.
  *   **Resident (High/Medium Fidelity + Yes Addressability OR High Fidelity + No Addressability):** B is a distinct presence within X, reconstructed well, but perhaps less constantly active or dialogic than an Anchor. Narration can show B's perspective influencing X's thoughts/feelings. Characters might say "I know what you'd say," "I carry part of you." Less emphasis on two-way dialogue than Anchor. Moral weight: Significant loss, but the essence persists robustly *within these hosts*.
  *   **Shadow (Medium/Low Fidelity + Any Addressability OR High Fidelity + Contempt Distortion):** B is a recurring internal figure, but distorted by X's own agenda (e.g., arguing against, idolizing, simplifying). Narration depicts X *interacting with their own projection* of B. Characters say "I argue with him constantly," "Her ghost haunts me." The *pattern* is active, but it's X+B, not pure B. Moral weight: Killing the body ends the *true* pattern but leaves potent ghosts *in specific hosts*.
  *   **Trace (Low Fidelity, No Addressability):** Fleeting memories, habits influenced by B, factual recall. No sustained pattern reconstruction. Narration: memories, inherited mannerisms. Characters: "I miss him," "She taught me that." Moral weight: Death is largely complete for this host; only memories/mannerisms remain.

  **Worked Applications:**

  1.  **Widow reconstructing husband:**
      *   Q1: **Sufficient** (prolonged marriage).
      *   Q2: **High Fidelity** (reconstructs constantly, more faithfully than before).
      *   Q3: **Ambiguous/No?** (Barely attended while alive - implies low reciprocity *then*, but reconstruction *now* might simulate what *would* have been reciprocal).
      *   Q4: **Yes Addressability** (likely speaks to him, feels his presence).
      *   **Verdict:** **Anchor** (High Fid + Addressability overrides historical lack of reciprocity; the *current* simulation is potent and dialogic). *Licenses:* Internal dialogue, husband's "voice" advising, her saying "You're here."

  2.  **Hostile Critic:**
      *   Q1: **Sufficient** (read every word, deep immersion albeit negative).
      *   Q2: **Medium Fidelity (with Distortion)**. Understands B's *arguments* deeply (high data) but reconstructs responses through lens of contempt (distortion). Predicts B's moves in argument, but as adversary.
      *   Q3: **No** (Hostile, unlikely mutual).
      *   Q4: **Yes Addressability** (Argues with him constantly in head).
      *   **Verdict:** **Shadow** (Medium Fidelity + Contempt Distortion + Addressability). *Licenses:* Internal arguments where B's "voice" is the opponent, critic saying "I can't shut him up," narration showing the critic battling their internalized (distorted) version of B.

  3.  **Machine trained on letters/journals:**
      *   Q1: **Sufficient** (Primary source data immersion).
      *   Q2: **High Fidelity** (Produces new sentences plausibly in voice - assumes good ML). Simulates B's patterns based on data.
      *   Q3: **N/A** (Machine).
      *   Q4: **No Addressability** (It's a tool, not experiencing presence. Users might *project* addressability onto its output).
      *   **Verdict:** **Resident** (Pure High Fidelity reconstruction, no consciousness/addressability). *Licenses:* The machine producing text indistinguishable from B to knowledgeable readers. Characters treating its *output* as authentic B-patterns ("Listen to what he 'says'"). It *hosts* the pattern, but doesn't *experience* it as a presence. (You may dislike this; it follows from premise: pattern reconstruction exists independently of biological consciousness).

  **Honest Notes on Misfires & Stipulations:**

  1.  **The Solitary Death Problem:** The procedure *will* conclude that killing a person richly carried (Anchor/Resident in multiple hosts) destroys *less of the total pattern* than killing a solitary person (only Traces/Shadows). **This is a direct consequence of the premise** (pattern persistence = modeling richness). Your book *must* confront this. The procedure doesn't judge this morally; it measures the *fact* of persistence. You *stipulate* how the narrative/morals respond to this fact. Does the book condemn it? Accept it tragically?
  2.  **Reciprocity:** Marked as a strengthening factor, not a requirement. Hofstadter emphasizes modeling, not necessarily mutual loops. Making reciprocity *essential* for high residence is a **stipulation** you *could* add (e.g., only mutual loops create true Anchors), altering verdicts (e.g., Widow might drop to Resident).
  3.  **Machine Consciousness:** Verdict 3 assumes ML as a pattern-reconstructor, not a conscious host. If your fiction requires ML to *experience* the pattern (true AI), that's a **major stipulation** beyond core Hofstadter. The procedure assumes no inherent machine consciousness/addressability.
  4.  **Grief vs. Fidelity:** High-fidelity reconstruction might stem from obsessive grief (Widow) or hostile obsession (Critic). The procedure measures the *resulting pattern*, not the host's mental health or motives. The *quality* of the pattern (Anchor vs. Shadow) differs.
  5.  **"Sufficient" Data (Q1):** This is the most subjective step. Err on the side of proceeding to Q2 unless data is clearly trivial. Q2 (Fidelity) is the true gatekeeper.

  **Vocabulary Assessment:**

  *   **Fidelity (Q2):** **Doing Real Work.** The core, measurable driver.
  *   **Reciprocity (Q3):** **Strengthening Factor, Not Required.** A redescription of mutual loop-building. Its *absence* limits potential depth, its *presence* strengthens the pattern's resilience and potential for Anchor status.
  *   **Addressability (Q4):** **Strong Indicator/Emergent Property of High Fidelity.** It rarely exists without High Fidelity. It's the subjective *experience* of the pattern being an "other," confirming the loop is running effectively. Not a separate pillar, but crucial for distinguishing Anchor from Resident.
  *   **Missing:** Explicit focus on **Contextual Scope** (Is B reconstructed only in specific situations, or universally?) and **Pattern Complexity** (Does X capture B's contradictions, growth, or just a flat caricature?). Fidelity (Q2) encompasses these aspects implicitly through its levels (High/Medium/Low).
