  We are given two camps:

  Camp A (narrative constructivists): 
    - Core claim: The self is a center of narrative gravity, an abstraction that summarizes patterns in self-referential commitments, memories, and self-attributions. There is no additional inner entity. The self is real only as a pattern and can fragment, be revised, or confabulated.
    - Data emphasized: Dissociative identity, dementia, confabulation, ordinary self-narrative revision. They argue that any felt sense of being a subject is part of the narrative or a represented state within it.

  Camp B (minimal phenomenal self theorists):
    - Core claim: There is a pre-reflective, pre-narrative sense of being a subject (a felt first-person givenness) that is present even when autobiographical narrative is absent, disrupted, or suspended.
    - Data emphasized: Reports of selfless experience in meditation, infancy, transient depersonalization, residual sense of ownership in dissociative states. They argue Camp A has changed the subject by focusing on narrative and not the lived self.

  The user's hypothesis: The disagreement is not about substantive facts but about explanatory priority and the explanandum (the self as a predictive construct vs. the self as a lived subject).

  We are to test this hypothesis and not assume it.

  We are also given a distinction to use to avoid a verbal dispute:

  - Narrative gravity: The fixed point of a compression process that minimizes prediction error over self-referential data. (Think of it as the coherence and predictive utility of the self-narrative.)
  - Phenomenal grip: The degree to which a self-attribution is immune to first-person doubt, or is given as mine rather than inferred. (Think of it as the immediate, non-inferential sense of ownership.)

  We are to consider two cases:

  Case 1: A person has a detailed, coherent, prediction-improving self-narrative (high narrative gravity) but reports that none of it is given as hers (low phenomenal grip). 
    - Camp A would count this as evidence for their view because they can explain the self as a narrative pattern without requiring a felt sense of ownership. They would say the lack of phenomenal grip is just another state that the narrative must account for.
    - Camp B would count this as evidence for their view because it shows that even a strong narrative does not necessarily produce the minimal self. They would argue that the absence of phenomenal grip indicates that the narrative is not the same as the lived self.

  Case 2: A person has no self-narrative (low narrative gravity) but reports a bare, non-inferential sense that experiences are happening to someone (high phenomenal grip).
    - Camp A would have trouble with this because their theory centers on narrative. They might argue that even a minimal sense of ownership is a form of narrative, but the case is designed to challenge that. They might dismiss the report as a confabulation or try to fit it into a minimal narrative pattern.
    - Camp B would count this as strong evidence because it shows that the minimal self can exist without any narrative.

  These cases are empirically possible. For example, Case 1 might resemble certain depersonalization disorders where a person can still tell a coherent story about themselves but feels detached. Case 2 might resemble very early infancy or advanced dementia where narrative is impaired but a basic sense of being a subject might persist (as per some reports).

  Now, let's diagnose:

  The two camps are emphasizing different aspects of selfhood. Camp A focuses on the narrative construct as the self, while Camp B focuses on the pre-reflective sense of self. The distinction between narrative gravity and phenomenal grip helps clarify that these are two different properties that can dissociate.

  Therefore, the disagreement is about what the explanandum is. Camp A is explaining the self as a predictive model (narrative gravity), while Camp B is explaining the self as a lived experience (phenomenal grip). They are not directly contradicting each other because they are talking about different phenomena. However, they are both calling their respective explanandum "the self".

  Thus, the disagreement is at least partly verbal (because they are using the same term for two different things) and partly about different questions (because they are focusing on different aspects of selfhood). But note that the user's hypothesis is that it's about explanatory priority and the choice of explanandum.

  We must take a stance. I think the disagreement is mixed, but the dominant component is that they are asking different questions. The verbal component (what the term "self" refers to) is secondary and stems from the primary difference in focus.

  Let's break down:

  - Substantive disagreement: Are there actual facts that one camp accepts and the other denies? They agree on the clinical facts but interpret them differently. The cases we imagined show that they would interpret the same facts differently. So there might be a substantive element: for example, Camp B might assert that the minimal self is irreducible to narrative, which Camp A denies. But the user says they agree on the facts. So the substantive disagreement is about the necessity of the minimal self: Camp B says it exists independently, Camp A says it is part of the narrative.

  However, the distinction we are given shows that narrative gravity and phenomenal grip are distinct properties. This suggests that both camps are partially right but about different things. Therefore, the disagreement is not purely substantive because they are not disagreeing about the same thing.

  Let me try to categorize:

  - Verbal: They might be using the word "self" in different senses. But the user wants to avoid the diagnosis collapsing into a verbal dispute. The distinction we are given is meant to clarify.

  - Different questions: Camp A is asking: How do we form a coherent story about ourselves? Camp B is asking: How do we have a sense of being a subject?

  The user's hypothesis: The disagreement is about explanatory priority and about what the explanandum is. That aligns with different questions.

  But note: Camp A explicitly denies that there is any inner entity beyond the narrative pattern. Camp B asserts that there is a minimal self that is pre-narrative. So there is a substantive disagreement about whether the minimal self is reducible to the narrative or not.

  Thus, the disagreement is mixed: substantive and about different questions. The substantive part is whether the minimal phenomenal self can be reduced to narrative. The different questions part is that they focus on different aspects of self.

  But which component dominates? I think the substantive disagreement about reducibility is the core. The different questions are a consequence of that. However, the user's distinction might help show that both aspects exist and that reduction might not be necessary. But Camp A is reductionist, Camp B is not.

