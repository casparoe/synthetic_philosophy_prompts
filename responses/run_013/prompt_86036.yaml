prompt: |-
  I want the specification before I look at any particular account of free-floating rationales — reasons that explain why a trait or a behavior has the shape it does even though nothing in the system represents those reasons. Write me the desiderata: what any adequate theory in this area has to deliver. Give it to me as exactly five numbered items, each at most two sentences, with no preamble and no closing summary; mark each requirement in a parenthesis as non-negotiable or as the preference of one camp, and use one of the five entries to name the pair of requirements you think cannot be jointly satisfied together with the single requirement that does the most to exclude candidates.

  Each requirement has to be forced by a case, and these are the cases I want the theory to answer to: an engineered device or craft technique that still does its job after everyone who understood it is dead; a trait that persists for reasons unrelated to the benefit its rationale names, so that the rationale is true about what would be favored and false about why the thing is here; an imputed rationale that no selection process ever tracked, where the story is a fact about the explainer's model rather than about the lineage; a mimic or a parasite whose behavior is explained by another organism's rationale, so the reason is real but sits in someone else's economy; and the same behavioral profile realized both in an evolved controller and in a machine we designed, where I want the theory to say whether the two share a rationale or merely resemble each other.

  I don't want the generic checklist that any discussion of biological teleology produces — each requirement should be one whose loss would make the theory say something false about one of those cases. Skip the scorecard of existing views; I'll run that myself once the list is in hand.
reasoning: |-
  Hmm, the user wants me to create a specification with exactly five desiderata for theories about "free-floating rationales" - reasons that explain traits or behaviors without being represented in the system. I need to carefully analyze their requirements.

  The user has provided five specific cases that any adequate theory must address: engineered artifacts that function after their creators are gone, traits with misleading rationales, purely imputed rationales from the explainer's model, mimics/parasites borrowing rationales from others, and identical behaviors in evolved vs designed systems. Each desideratum must be directly forced by one of these cases.

  I need to craft exactly five numbered items, each no longer than two sentences. For each requirement, I must indicate in parentheses whether it's non-negotiable or preferred by a particular camp. One entry should highlight a pair of requirements that conflict when combined with a third requirement that excludes candidates.

  The first case (engineered artifacts) suggests we need a requirement that rationales can persist independently of representational states. I'll make this non-negotiable since it's fundamental to free-floating status. The second case (misleading rationales) indicates that rationales must not require causal efficacy in the system's history. This should also be non-negotiable.

  The third case (imputed rationales) suggests that rationales can be grounded solely in the explainer's model. I'll mark this as a preference since not all theories accept subjective grounding. The fourth case (mimics/parasites) requires that rationales can be located in external systems, which I'll make non-negotiable as it's crucial for explaining borrowed functions.

  The fifth case (evolved vs designed) creates tension. The requirement to treat identical profiles similarly conflicts with needing to distinguish genuine rationale from mere resemblance. I'll identify this tension in one entry, showing how it clashes with the requirement that excludes theories collapsing rationale with resemblance.

  I'll structure the five desiderata to correspond directly to the cases while ensuring each is concise and impactful. The conflict will highlight the tension between objective grounding and explanatory parity for evolved/designed systems when combined with the requirement to avoid collapsing rationale with resemblance.
answer: |-
  Here are the five desiderata:

  1.  Rationales must persist without representational bearers, explaining functionality in systems lacking internal representations (e.g., engineered devices functioning after designer death). (Non-negotiable)
  2.  Rationales must not require causal efficacy in the lineage's history; they can accurately describe selective benefits without being reasons *why* the trait persists (e.g., a trait maintained by drift matching a beneficial rationale). (Non-negotiable)
  3.  Rationales must be attributable based solely on an explainer's successful predictive model, independent of any historical tracking by selection or design (e.g., an imputed rationale true only of the model, not the lineage). (Preference of the 'Explanatory Role' camp)
  4.  Rationales must be locatable within external economies, explaining traits via reasons operative in *other* systems (e.g., mimic behavior explained by the rationale of the mimicked organism). (Non-negotiable)
  5.  The requirement that rationale identity tracks functional equivalence across origins (e.g., identical controllers in evolved and designed systems sharing a rationale) conflicts with the requirement that rationales avoid collapsing into mere resemblance descriptions; the latter requirement most excludes candidate theories failing 1 and 4. (Conflict: 5 vs Resemblance Avoidance)
