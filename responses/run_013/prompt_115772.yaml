prompt: |-
  Psychiatrists used to diagnose multiple personality disorder, then it got renamed dissociative identity disorder — diagnosed cases exploded in the 80s and 90s and then mostly dried up. I want you to run that whole arc through Hacking's idea of looping effects: the thought that classifying someone as a certain kind of person changes them, and those changes feed back into the classification. Map it carefully — what exactly was doing the looping (the criteria, the clinicians, patients all reading the same books, the talk shows), whether this is a genuine "interactive kind" or just a fancy word for iatrogenesis, and where the theory gets the causal direction right versus where it just asserts it. Then the harder part: is the disorder's near-disappearance also a looping effect, or is it a case the theory can't handle — and does that count for or against Hacking? Dont just give me the standard sociocognitive vs trauma debate, I know that already; I want the episode to push back on the theory and tell me where it goes quiet.
