prompt: |-
  I work on programming language semantics and compiler verification: operational semantics, type soundness proofs, bisimulation, contextual equivalence, and the occasional argument about whether a denotational model is fully abstract with respect to the operational one. I know that world well, and I keep trying to use it to make sense of a philosophical debate that I suspect it does not fit. I want you to do the translation properly and then tell me what leaked.

  The debate is about identifying an ontology from the outside. We have access to something limited — a system's behavior and dispositions, or, in the scientific cousin of the problem, only the observable consequences of a theory — and we want to say what entities, kinds, and structure the system or theory is committed to. One side holds that rival ontologies can agree on everything accessible while disagreeing about what there is (enduring objects versus temporal parts, rabbits versus rabbit-stages, one basic substance versus two, a world of things versus a world of stuff), and that in at least some of these cases nothing further fixes which one is correct. The other side holds that the apparent underdetermination is always either trivial — a difference in notation rather than in ontology — or removable by some further constraint: simplicity, charity of interpretation, causal contact with the entities in question, whatever the proposal on offer.

  Translate this into my vocabulary as faithfully as you can: terms and their denotations, operational versus denotational semantics, observational and contextual equivalence, bisimulation, alpha-equivalence, non-isomorphic models of one and the same theory, initiality and uniqueness up to isomorphism, full abstraction, intended versus merely admissible models, and what I mean when I say that two programs are the same program.

  Then give me the residue report, which is what I actually want. Which parts of the debate survive cleanly, which survive only as distortions, and which cannot be said at all in my vocabulary? Test two suspicions of mine rather than granting them. First, I suspect the translation makes the problem look trivial: in my world, models being unique only up to isomorphism is normal and unalarming, and alpha-equivalence is a fact about notation rather than a threat to realism, so if the philosophers' indeterminacy thesis comes out looking like something I would shrug at, is that because their problem is shallower than it sounds, or because my vocabulary has no way to register what worries them? Second, I suspect I am smuggling something in: in my world the denotation of a term is stipulated by a definition I write, not discovered from behavior, and I may be quietly assuming the existence of a specification that the philosopher does not have. If that assumption is doing the work, say so, and tell me what remains of the translation without it.

  Separate what is settled from what is genuinely contested among people who know this material. Do not present a live philosophical dispute as settled, and do not present the semantic analogy as the consensus if it is a move that some people make and others reject.
reasoning: |-
  We are translating a philosophical debate about ontology and underdetermination into the vocabulary of programming language semantics and compiler verification. The key elements of the debate:

  - We have limited access (behavior, dispositions, observable consequences).
  - We want to identify the ontology (entities, kinds, structure) that the system/theory is committed to.
  - One side: rival ontologies can agree on everything accessible and disagree on what there is, and sometimes nothing further fixes which is correct.
  - Other side: the underdetermination is either trivial (notational) or removable by further constraints.

  Your vocabulary includes:
  - Terms and their denotations
  - Operational vs denotational semantics
  - Observational and contextual equivalence
  - Bisimulation
  - Alpha-equivalence
  - Non-isomorphic models of one and the same theory
  - Initiality and uniqueness up to isomorphism
  - Full abstraction
  - Intended vs merely admissible models
  - What it means for two programs to be the same program.

  We will translate step by step.

  ### Step 1: Translating the Setup

  The "limited access" corresponds to **observational equivalence** (or contextual equivalence) in programming languages. Two programs that are observationally equivalent cannot be distinguished by any context (any program that uses them). Similarly, in the philosophical setting, two systems that are behaviorally indistinguishable (same dispositions, same observable consequences) are observationally equivalent.

  The "ontology" of the system corresponds to the **denotational model** (or the denotations of terms). The denotational model assigns meanings (denotations) to terms in some mathematical structure (the ontology). The rival ontologies would then correspond to two different denotational models that assign different denotations to the same terms.

  The debate is: can two different denotational models (with different underlying mathematical structures) both correctly capture the operational behavior (i.e., agree on all observations) and yet be non-isomorphic? And if so, is there a fact of the matter about which one is correct?

  ### Step 2: Translating the Indeterminacy Thesis

  The indeterminacy thesis (one side) says: yes, there can be two non-isomorphic denotational models that are both **fully abstract** with respect to the operational semantics. Full abstraction means that the denotational model is both:
  - Adequate: if two programs are observationally equivalent, then they have the same denotation (soundness).
  - Complete: if two programs have the same denotation, then they are observationally equivalent (fullness).

  So, the thesis is: there are programming languages for which there exist two non-isomorphic fully abstract models. Moreover, there is no further constraint (like simplicity, initiality, etc.) that breaks the tie.

  ### Step 3: Translating the Determinacy Thesis

  The other side says: either the two models are trivially different (like **alpha-equivalence**, which is a notational difference that does not affect the underlying structure) or there is a further constraint (like **initiality** or **uniqueness up to isomorphism**) that picks one model as the intended one. For example, they might argue that by requiring the model to be initial (or final) in some category, we get uniqueness up to isomorphism.

  ### Step 4: Key Concepts in Your Vocabulary

  - **Terms and their denotations**: Terms are syntactic expressions. Denotations are the meanings assigned to them in a model.
  - **Operational vs denotational semantics**: Operational semantics defines behavior (how a program runs). Denotational semantics assigns mathematical objects (denotations) to terms.
  - **Observational equivalence**: Two terms are observationally equivalent if no context can distinguish them.
  - **Contextual equivalence**: Same as observational equivalence (often used interchangeably).
  - **Bisimulation**: A relation that captures behavioral equivalence by requiring matching steps. In some languages, bisimilarity coincides with observational equivalence.
  - **Alpha-equivalence**: Equivalence up to renaming of bound variables. This is syntactic and considered trivial.
  - **Non-isomorphic models**: Two models that are not isomorphic (structurally the same) but may satisfy the same theory.
  - **Initiality and uniqueness up to isomorphism**: An initial model is one that has a unique homomorphism to every other model. It is unique up to isomorphism if it exists.
  - **Full abstraction**: A denotational model is fully abstract if observational equivalence coincides with equality of denotations.
  - **Intended vs admissible models**: The intended model is the one we have in mind (e.g., the standard model). Admissible models are those that satisfy the specification but might not be intended.

  ### Step 5: Translation of the Debate

  The philosophical debate becomes:

  - **Indeterminacy thesis**: There are programming languages for which there exist two non-isomorphic fully abstract denotational models. Moreover, there is no further constraint (like initiality or simplicity) that breaks the symmetry, and both are equally admissible as the intended model. Thus, the ontology (the mathematical structure of the denotational model) is underdetermined.

  - **Determinacy thesis**: In every case, either:
    (a) The two models are trivially different (like by an alpha-conversion, or by an isomorphism that is obvious and doesn't change the structure) and so the ontological difference is merely notational, or 
    (b) There is a further constraint (like requiring the model to be initial, or minimal, or having a universal property) that uniquely picks one model up to isomorphism.

  ### Step 6: Residue Report

  Now, we address your two suspicions.

  #### Suspicion 1: Does the translation make the problem look trivial?

  In programming language semantics, it is common that models are unique only up to isomorphism. For example, the initial model of an algebraic theory is unique up to isomorphism. Similarly, we often consider denotational models up to isomorphism. So, if two models are isomorphic, we consider them the same. The philosopher's worry about non-isomorphic models is then the real issue.

  But note: the existence of non-isomorphic fully abstract models for the same language is not trivial. In fact, it is a known issue in denotational semantics. For some languages, we can have multiple non-isomorphic fully abstract models. However, the field often imposes extra conditions to get uniqueness. For example:

  - **Initiality**: If we require the model to be initial in a suitable category, then it is unique up to isomorphism.

  But what if we don't impose such conditions? Then we might have multiple non-isomorphic models. However, in programming language semantics, we usually have an operational specification that we are trying to capture. The philosopher might not have such a fixed specification.

  **Leakage**: The programming language semanticist has the operational semantics as the fixed point of reference. The denotational model must be adequate and (ideally) fully abstract. But the philosopher might not have an analogue of the operational semantics that is fixed and agreed upon. In the philosophical debate, the "behavior" might be the only fixed thing, but without a formal specification of the operational semantics, the debate becomes more open.

  **Conclusion on Suspicion 1**: The problem does not look trivial when we consider that non-isomorphic fully abstract models can exist. But in the programming language world, we often have ways to break the tie (like initiality). However, if we don't impose such conditions, then the underdetermination remains. The philosopher's worry is that in the absence of such a tie-breaker (which they might not accept as legitimate), the ontology is underdetermined. Your vocabulary does have a way to register the worry: the existence of non-isomorphic fully abstract models. But the fact that we can break the tie with extra conditions (which are natural in PL) might make it seem less alarming to you.

  #### Suspicion 2: Are you smuggling in a specification?

  In programming language semantics, we start by defining the operational semantics (or the set of observations). The denotational model is then required to match that. The denotation is not discovered from behavior but defined to match the operational semantics. The philosopher might not have that luxury: they only have the behavior (the observable consequences) without a prior formalization of the operational semantics.

  In the translation, we have fixed the operational semantics. But in the philosophical problem, the "operational semantics" (if we can call it that) might be underdetermined as well. For example, what counts as an observation? What are the primitive operations? The philosopher might be working with a more open-ended set of behaviors.

  **Leakage**: The philosopher might not have a fixed operational semantics. Therefore, the underdetermination might be at two levels:
  1. The choice of operational semantics (what are the primitive observations?).
  2. The choice of denotational model for a fixed operational semantics.

  In your world, the first is fixed by the language designer. Without that, the problem becomes harder.

  **Conclusion on Suspicion 2**: Yes, you are smuggling in a specification (the operational semantics). Without it, the underdetermination is more severe. In the residue, without a fixed operational semantics, the debate about ontology becomes even more underdetermined. What remains of the translation? We can still talk about two denotational models that agree on all observations (for a given set of observations) but are non-isomorphic. But without a fixed operational semantics, the set of observations itself might be underdetermined.

  ### What Parts Survive Cleanly?

  - The idea that two systems (programs) can be observationally equivalent (same behavior) but have different denotations (different ontologies) in two different models is a clean translation.
  - The existence of non-isomorphic fully abstract models for the same operational semantics is a known phenomenon and survives cleanly.
  - The use of full abstraction to capture the match between behavior and denotation is a clean fit.

  ### What Survives as Distortions?

  - The philosopher's "further constraints" (simplicity, charity, causal contact) are not standard in PL. We have initiality, minimality, and sometimes ad hoc simplicity, but these are not always applied. So the determinacy thesis in PL might rely on constraints that are not directly analogous to the philosophical ones.
  - The idea of "causal contact" does not have a direct analogue in PL semantics. This might be a distortion.

  ### What Cannot Be Said?

  - The notion of "ontological commitment" is not native to PL. We have denotations and models, but we don't usually say that the model is what the language is "committed to" in a metaphysical sense. We are more pragmatic: we want a model that is mathematically tractable and fully abstract.
  - The philosopher's worry that there might be no fact of the matter at all (even up to isomorphism) is hard to capture because in PL we take the operational semantics as given and use it to judge the models. Without that, we might not have a clear criterion.

  ### Settled vs Contested

  In programming language semantics:

  - It is settled that for some languages, there can be multiple non-isomorphic fully abstract models. For example, for PCF, the fully abstract model is the continuous function model (in the category of Scott domains) but there are other models (like the sequential algorithms model) that are also fully abstract but not isomorphic to it. However, these models might be seen as different representations of the same underlying structure? Not necessarily: they might be different categories.

  - It is contested whether we should require more than full abstraction. Some might argue that we should require the model to be initial or to have a universal property. Others might be satisfied with full abstraction alone.

  - The use of initiality to break ties is a common move, but not without controversy. For example, in game semantics, we get fully abstract models that are not initial in the category of all models, but they might be initial in a subcategory.

  In philosophy, the debate is live: some philosophers (like Quine) argue for underdetermination, while others (like Davidson) argue for constraints (like charity) that break the underdetermination.

  ### Final Residue Report

  **Clean Survival**:
  - Observational equivalence and full abstraction capture the idea that behavior fixes the denotations only up to the equivalence induced by the model.
  - The possibility of non-isomorphic fully abstract models is a real and known issue in PL, so the indeterminacy thesis has a clear analogue.

  **Distorted Survival**:
  - The philosopher's "further constraints" (like simplicity, charity, causal contact) are not standard in PL. We use initiality and minimality, but these are mathematical constraints. The philosophical constraints are more metaphysical or interpretive, so they get distorted in translation.
  - The triviality claim (alpha-equivalence) is a distortion because in PL, alpha-equivalence is clearly syntactic and not ontological. The philosopher might have in mind a more substantive notational variance.

  **Cannot Be Said**:
  - Without a fixed operational semantics, the entire framework becomes less applicable. The philosopher might be questioning the very terms of the specification (what counts as an observation), which in PL we take for granted.
  - The idea of "ontological commitment" as a metaphysical claim (what the system really believes in) doesn't have a direct counterpart. We have models that are useful, but we don't usually argue about which one is the true ontology.

  **Answering Your Suspicions**:
  1. The problem does not look trivial when we consider non-isomorphic fully abstract models. However, the PL tools (like initiality) can break the tie, which might make the philosopher's worry seem less urgent. But that tie-breaking is not available in the philosophical debate without additional assumptions. So the worry is not shallow, but your vocabulary does have a way to register it (non-isomorphic models). The difference is that in PL we often have a way to choose, while the philosopher might not accept any such way.

  2. Yes, you are smuggling in a specification (the operational semantics). Without it, the underdetermination becomes worse. The residue without that assumption is: we can still talk about two models that agree on all observations (for a given set of observations) but are non-isomorphic. But without a fixed operational semantics, the set of observations is also up for grabs, making the underdetermination even more radical. The translation then becomes less faithful because the philosopher might be questioning the set of observations too.

  In conclusion, the translation is possible and highlights the structural similarities, but the philosophical debate has additional layers (no fixed operational specification, and the nature of the constraints) that leak through.
answer: |-
  ### Translation into Programming Language Semantics Vocabulary

  **Core Debate Translation:**  
  The philosophical problem of identifying an ontology from limited access (behavior/dispositions) translates to determining the denotational model of a programming language from its operational behavior. Rival ontologies correspond to non-isomorphic denotational models that agree on all observable properties but disagree on the mathematical structure (denotations) they assign to terms. The debate becomes:  
  - **Indeterminacy Thesis:** Non-isomorphic fully abstract denotational models can exist for the same operational semantics, with no further constraint to break the symmetry.  
  - **Determinacy Thesis:** Any such non-isomorphism is either trivial (e.g., alpha-equivalence) or resolvable via constraints (e.g., initiality, minimality, or full abstraction itself).  

  **Key Concept Mappings:**  
  1. **Terms and their denotations:**  
     - Terms = Syntactic programs.  
     - Denotations = Mathematical objects in a denotational model (e.g., domains, sets, processes).  
     - Ontological commitment = Choice of denotational universe (e.g., sets vs. nominal sets, continuous functions vs. games).  

  2. **Operational vs. denotational semantics:**  
     - Operational semantics = Observable behavior (e.g., reduction steps, I/O actions).  
     - Denotational semantics = Ontology (the "what there is" for the language).  
     - Limited access = Only operational behavior is given; denotational model must be inferred.  

  3. **Observational/contextual equivalence:**  
     - Two terms are observationally equivalent if no context can distinguish them via operational behavior.  
     - Maps to "agreeing on everything accessible" in philosophy.  

  4. **Bisimulation:**  
     - A proof technique for observational equivalence.  
     - Analogous to establishing behavioral indistinguishability.  

  5. **Alpha-equivalence:**  
     - Syntactic renaming with no semantic effect.  
     - Represents "trivial notational differences" in determinacy arguments.  

  6. **Non-isomorphic models of one theory:**  
     - E.g., Two domain-theoretic models for PCF: continuous functions vs. sequential algorithms.  
     - Directly maps to rival ontologies (e.g., enduring objects vs. temporal parts).  

  7. **Initiality/uniqueness up to isomorphism:**  
     - Initial models (e.g., in algebraic semantics) are unique up to iso.  
     - A "further constraint" to resolve indeterminacy.  

  8. **Full abstraction:**  
     - Denotational model is fully abstract when observational equivalence coincides with denotational equality.  
     - The ideal for an ontology: it perfectly mirrors observable behavior.  

  9. **Intended vs. admissible models:**  
     - Intended model = The "correct" ontology (e.g., standard set-theoretic denotations).  
     - Admissible models = Rival ontologies satisfying all formal constraints (e.g., fully abstract but non-isomorphic).  

  10. **"Two programs are the same program":**  
      - Syntactic identity (rare) vs. observational equivalence (common).  
      - Philosophers' "rival ontologies" assume programs are syntactically fixed but denotationally ambiguous.  

  **Translated Theses:**  
  - **Indeterminacy:** For some operational semantics, multiple non-isomorphic fully abstract denotational models exist, and no constraint (e.g., initiality, minimality) breaks the symmetry. Example: Two models for a concurrent language—one using event traces, another using closure operators—both fully abstract but non-isomorphic.  
  - **Determinacy:** Any apparent non-isomorphism is either:  
    (a) Trivial (alpha-equivalence), or  
    (b) Resolvable by constraints (e.g., demanding the initial/final model, or maximizing computational adequacy).  

  ---

  ### Residue Report: What Leaked, What Survived, and What's Contested

  #### 1. **Suspicion 1: "Does translation make the problem trivial?"**  
     - **Why it might seem trivial:**  
       In PL semantics, uniqueness up to isomorphism is routine (e.g., initial algebras). Alpha-equivalence is unproblematic syntax. If philosophers' indeterminacy reduces to "non-isomorphic models exist but are intertranslatable," it mirrors standard practice—e.g., different implementations of the same spec.  
     - **What leaks:**  
       Philosophers worry about **metaphysical robustness**: Is the model "discovered" (realist) or "stipulated" (anti-realist)? In PL, we stipulate denotations via definitions, so non-isomorphic models are tools, not ontological mysteries. Your vocabulary cannot capture the **epistemic anxiety** (e.g., "How do we *know* which ontology is real?").  
     - **Survives, but distorted:**  
       The existence of non-isomorphic fully abstract models (e.g., for PCF with parallel operations) is non-trivial and debated in PL—but it's a technical hiccup, not a metaphysical crisis. Philosophers' "no fact of the matter" becomes "no canonical model," which PL engineers shrug off.  
     - **Genuinely contested in PL:**  
       Whether full abstraction *requires* isomorphism. Example: For untyped lambda calculus, Scott models vs. graph models are often intertranslatable, but some argue this is isomorphism in disguise. Others (e.g., game semanticists) accept non-isomorphic models as equally valid.  

  #### 2. **Suspicion 2: "Am I smuggling in a specification?"**  
     - **The smuggling:**  
       Yes. Your vocabulary assumes a **fixed operational semantics** (the "spec") that defines behavior. Denotations are stipulated to match it. Philosophers have no such spec—they start from raw behavior/dispositions and infer ontology *and* operational rules simultaneously.  
     - **Residue without the assumption:**  
       Remove the operational spec, and translation collapses. Example: Without reduction rules, "observational equivalence" is undefined. Philosophers' problem is closer to **reverse-engineering a language from its trace set**—which permits radical underdetermination (e.g., "Is this output caused by a stateful object or a stateless function?").  
     - **What cannot be said:**  
       - The philosopher's "no privileged specification" has no PL analogue. You assume the spec is given; they debate how to derive it from observations.  
       - Constraints like "causal contact" or "charity" lack direct mappings. Simplicity might map to minimal models, but only if operational semantics is fixed.  

  ---

  #### What Survived Cleanly  
  - **Non-isomorphic models:** Rival ontologies → fully abstract but non-isomorphic denotational models.  
  - **Observational equivalence:** "Agreeing on everything accessible" → contextual equivalence.  
  - **Trivial differences:** Alpha-equivalence cleanly maps to "notational variance."  
  - **Underdetermination:** Exists in PL (e.g., multiple fully abstract models for stateful languages).  

  #### What Survived as Distortions  
  - **Simplicity/charity:** In PL, these are pragmatic (e.g., "pick the simplest domain"). In philosophy, they are epistemic/moral principles. Distorted into "minimal models" or "universal properties."  
  - **Causal contact:** No PL analogue. Maps poorly to "operational adequacy" (which is stipulated).  
  - **"Ontological commitment":** In PL, it's "denotational commitment," but without the realist weight.  

  #### What Cannot Be Said  
  - **Metaphysical neutrality:** PL has no way to express "there is no fact of the matter." Your judgments are relative to a spec; philosophers debate absolutes.  
  - **Theory-ladenness of observation:** Philosophers dispute what counts as "observation" (e.g., intensional vs. extensional). In PL, observations are defined by the operational spec—no debate.  
  - **Radical indeterminacy (e.g., Quine's gavagai):** Translates to "all terms are contextually equivalent," but this ignores the open-endedness of possible observations.  

  ---

  #### Settled vs. Contested in PL Semantics  
  - **Settled:**  
    - Non-isomorphic models exist for many languages (e.g., PCF, λ-calculus).  
    - Alpha-equivalence is purely syntactic; no semantic content.  
    - Full abstraction does *not* imply uniqueness up to isomorphism.  
  - **Contested:**  
    - **Does initiality resolve indeterminacy?** Some (e.g., in category semantics) argue initial models are canonical. Others reject this for non-algebraic languages.  
    - **Is full abstraction sufficient?** Many PL theorists accept multiple fully abstract models as legitimate alternatives. A minority insist on stricter criteria (e.g., definability).  
    - **Operational semantics as 'given':** Consensus in PL is that operational semantics is defined first. Critics (e.g., in concurrent semantics) argue behavior can be underspecified, leading to ontological ambiguity.  

  #### Bottom Line  
  Your vocabulary **exposes the structural core** of the debate (underdetermination via non-isomorphic models) but **leaks the philosophical stakes**. The indeterminacy thesis survives as a technical possibility, stripped of epistemic angst. The determinacy thesis survives as a pragmatic toolkit (use initiality, ignore alpha-variance). What evaporates is the **realist worry**—PL semantics is inherently stipulative, while philosophy seeks discovery. Without the operational spec, the problem becomes incoherent in your terms; with it, the debate is tamed into a search for elegant formalisms.
