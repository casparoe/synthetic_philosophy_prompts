  Next, Delegate B points out the regress: if they bind future assemblies, why not bind themselves now? But that requires another clause, leading to infinite regress. This highlights the core mechanic. Then, Delegate A's confusion about self-binding versus weakness illustrates the difference between temporary weakness and changed convictions.  

