answer: |-
  ## Board Decision Memo: Framing Famine Causation

  **To:** Board of Directors  
  **From:** [Your Name], Outside Board Member  
  **Date:** October 26, 2023  
  **Subject:** Resolving Our Framing of Famine Causation: Towards Conceptual Clarity and Operational Integrity  

  This memo addresses the two-year impasse regarding how our organization frames the causes of famine. My aim is not to relitigate historical cases but to clarify the conceptual foundations required for a principled, operationally sound, and intellectually honest position. Our debate reveals fundamental differences in how we conceptualize "famine," "cause," and our organizational role. Resolving this requires explicit philosophical grounding before practical recommendations.

  **1. Defining Famine: Beyond Thresholds to Systemic Failure**  
  *   **Commitment:** Calling a crisis a "famine" commits us to recognizing an extreme, systemic failure in the ability of a population to secure sufficient nutrition, leading to widespread starvation and death. It signifies a catastrophic breakdown beyond localized hardship.
  *   **Thresholds & Their Limits:** While administrative thresholds (mortality, malnutrition rates, food insecurity levels) are essential operational tools for triggering response and mobilizing resources, they are *descriptively insufficient*. They quantify severity but obscure causation.
  *   **A Necessary Hybrid Definition:** We must adopt a **hybrid definition**:
      *   **Descriptive Core:** Meeting technical thresholds confirms the *existence* and *scale* of extreme food crisis.
      *   **Causal Context:** Crucially, reaching famine thresholds inherently implies a **fundamental failure of social, economic, and/or political systems** to prevent the crisis or mitigate its impacts, even where natural triggers exist. Famine is the manifestation of this systemic failure. A "purely descriptive" definition, devoid of this implied systemic failure, is inadequate and misleading. Famine thresholds are breached *because* systems fail.

  **2. "Natural" vs. "Political": A False Dichonomy and the Nature of Causation**  
  The strongest argument from the "natural disaster" side is that politicizing causation jeopardizes lifesaving access and neutrality, turning our assessments into political tools and potentially harming vulnerable populations further. However, the dichotomy itself collapses under scrutiny:

  *   **Causes are Conjunctural:** Famines arise from the **interaction** of multiple necessary conditions. A drought (natural trigger) interacts with pre-existing vulnerabilities (poverty, inequality), market structures (access, distribution), and political decisions (resource allocation, conflict, suppression of information/dissent, policy choices) to *become* a famine.
  *   **Necessary ≠ Sufficient ≠ "The Cause":** A drought may be a necessary *triggering condition*. Bad policy may be a necessary *enabling condition*. Neither is sufficient alone. Declaring one "the cause" is often an act of **attribution**, not pure description. As your instinct and reading suggest, we often label as "the cause" the factor deemed most **abnormal** or **malleable** against an implicit baseline.
  *   **Our Chosen Baseline:** Our baseline must be: **"Could widespread starvation and death have been prevented by reasonable, feasible actions given the circumstances?"** If the answer is "yes" – meaning existing institutions (local, national, international) possessed or could have mobilized the capacity and knowledge to prevent mass mortality triggered by a natural event – then the famine is fundamentally a consequence of institutional failure, making it inherently political. The natural event is the catalyst; the political/institutional response (or lack thereof) determines the outcome. We cannot scientifically isolate one factor as *the* cause in a complex system, but we can identify the *necessary institutional failure* that allows a trigger to become a catastrophe.

  **3. The Counterfactual Problem: Assessing Preventability**  
  Attributing a significant causal role to political/institutional failure implies a counterfactual: "Starvation would not have occurred (or would have been drastically less severe) under different policies/institutions." While we cannot rerun history, we *can* assess preventability robustly:

  *   **Evidence for Preventability:** We look for concrete evidence demonstrating that:
      *   Adequate food existed *somewhere* within the system (regionally, nationally, internationally).
      *   Reasonable mechanisms existed (or could have been activated) to get that food to the starving population (e.g., functioning markets, transport, relief pipelines).
      *   Political decisions actively hindered access (e.g., blockades, discriminatory policies, suppression of relief efforts, denial of the crisis) *or* failed to activate available mechanisms despite clear warning signs.
      *   Comparable regions/systems facing similar triggers avoided famine through effective action.
  *   **Confidence Levels:** Our confidence increases with the strength and convergence of this evidence. We must explicitly state the **limitations** of counterfactual reasoning in single cases but assert that **patterns of evidence** allow strong inferences about preventability.
  *   **Calibrating Public Statements:** Our public statements **must be calibrated to our confidence level**. We can state facts demonstrably: "Drought reduced harvests significantly. Simultaneously, conflict restricted market access and government restrictions hampered relief efforts. The convergence of these factors led to extreme food insecurity meeting famine thresholds." We can cautiously infer: "Evidence suggests timely intervention and unimpeded access could have prevented famine mortality." We avoid definitive, unsupported claims like "The government deliberately caused the famine," unless evidence is overwhelming and attribution is core to our mission (see point 4).

  **4. Institutional Consequences: Navigating the Trade-Offs**  
  There is no risk-free path. Both framings entail significant trade-offs:

  *   **Emphasizing "Natural Disaster":**
      *   *Gains:* Maximizes perceived neutrality, potentially eases access negotiations, reduces immediate risks to staff safety, avoids alienating host governments, facilitates operational funding focused on technical response.
      *   *Losses:* Risks moral complicity by obscuring responsibility, undermines advocacy for systemic change, fails victims by not bearing witness to injustice, potentially enables future crises by avoiding root causes, may damage credibility if political factors are glaring.
  *   **Emphasizing "Political Crime"/Institutional Failure:**
      *   *Gains:* Promotes accountability, bears witness to injustice, addresses root causes potentially preventing future famines, aligns with principles of human rights, strengthens advocacy leverage.
      *   *Losses:* Risks denial of access, expulsion, increased staff security threats, loss of operational funding perceived as "political," potential misuse of our assessments by adversarial actors, may shut down dialogue with authorities needed for relief delivery.

  **Recommendation:** We must **contextualize our framing**. Our core mission is saving lives and alleviating suffering. This requires operational access. Therefore:
      *   **Operational Contexts (Field Assessments, Internal Analysis, Relief Coordination):** Use precise, technical language describing *all* contributing factors (drought, crop failure, conflict, policy barriers, market dysfunction). Focus on the *mechanics* of the food crisis and necessary interventions. Frame famine declaration using the hybrid definition (thresholds + implied systemic failure).
      *   **Public Advocacy & Accountability Contexts:** Here, we have a duty to speak truthfully about causes. Based on evidence and confidence levels (Point 3), explicitly name the role of political/institutional failures *alongside* natural triggers. Highlight the preventability dimension and call for accountability and systemic reforms. **This is where we accept the risks associated with the "political crime" framing, grounded in evidence and calibrated to confidence.**
      *   **Assessment Framework:** Provide field staff with clear guidance and tools to document *all* factors contributing to food insecurity and famine thresholds, *including* political/institutional barriers and policy impacts, without requiring them to make public causal attributions. Ensure robust internal review before public causal analysis.

  **5. Bottom Line for Vote:**  
  **Proposed Organizational Position on Famine Framing:**

  1.  **Definition:** We define famine as occurring when technical thresholds of extreme food insecurity, malnutrition, and mortality are breached. Reaching these thresholds constitutes evidence of a catastrophic **systemic failure**, regardless of triggering events.
  2.  **Causation:** Famines result from the complex interaction of triggering events (often natural) and enabling conditions (primarily political, economic, and institutional). The crucial factor determining whether a trigger leads to famine is the **failure of institutions to prevent or mitigate** mass starvation. Natural events are catalysts; political/institutional factors determine the outcome's severity.
  3.  **Public Stance:** In operational and technical contexts, we describe all contributing factors factually. In public advocacy, we explicitly address evidence-based political/institutional failures contributing to famine, calibrated to our confidence level and emphasizing preventability. We commit to robust internal review of causal analysis before public release.
  4.  **Assessment Framework:** Field staff will systematically document *all* relevant factors (environmental, economic, political, institutional) contributing to food insecurity and famine risk. Public causal attribution remains an organizational-level decision based on consolidated evidence and risk assessment.
  5.  **Revisiting the Position:** This position will be revisited only if: (a) Significant new philosophical or methodological insights fundamentally challenge our understanding of causation or systemic failure; or (b) Experience demonstrates that this balanced approach consistently and severely jeopardizes our core operational ability to deliver life-saving aid, without viable mitigation.

  **Strongest Argument for the Losing Side ("Natural Disaster" Framing):**  
  "Prioritizing operational neutrality and access is not denial; it's pragmatic humanitarianism. By focusing strictly on the measurable natural triggers and humanitarian needs, we maximize our ability to reach the starving. Explicitly naming governments or political groups as responsible, even based on evidence, inevitably politicizes our work. Host states will deny access, expel our staff, and block aid, punishing the very people we aim to help. Donors funding technical relief may withdraw support if we are seen as activists. Our field staff become targets. Our assessments *will* be weaponized by opposing factions, distorting our message and inflaming conflict. Ultimately, saving lives today requires working within the existing political reality, not challenging it head-on during an acute crisis. Our silence on direct causation is the price paid for the access that delivers food. To do otherwise risks becoming irrelevant to those dying now in the name of speaking truth for an uncertain future impact."

  **Conclusion:**  
  This position rejects a false choice. It acknowledges natural triggers while centering the institutional failure inherent in famine. It balances operational pragmatism with a commitment to principled advocacy, demanding intellectual honesty about both causes and the trade-offs we make. It provides field staff with clear, factual guidance while reserving complex causal attribution for organizational-level decisions based on evidence and risk. I urge the board to adopt this framework to resolve our impasse and guide our vital work with greater conceptual clarity and strategic purpose.

  **Recommendation for Vote:**  
  **That the Board adopt the Proposed Organizational Position on Famine Framing as outlined in Section 5.**

  **Annexes (Conceptual):**  
  *   A: Key Elements of Famine Definition (Thresholds + Systemic Failure)  
  *   B: Framework for Assessing Evidence of Preventability/Institutional Failure  
  *   C: Guidance on Calibrating Public Statements on Causation
