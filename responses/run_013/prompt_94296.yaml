prompt: |-
  I'm a doctoral student in philosophy who has recently taken a job doing cause prioritization for a small grantmaking organization, which means that most of what I now work on has its payoff — if any — decades or centuries out. That has turned the problem of "consequentialist cluelessness" from a seminar curiosity into something personally pressing, and I keep running into it in arguments between two people in my cohort, whom I'll call Dana and Marcus. They went at it again last week over coffee and I genuinely couldn't referee, so I'd like you to do it for me. Please take the role of an expert in both normative ethics and decision theory — someone fluent in the formal literature on choice under uncertainty as well as the practical debates about long-term impact — and adjudicate their exchange move by move. Before you commit to a verdict, brainstorm to yourself what the strongest version of each position is, so that you aren't grading either of them on a weak reading; then tell me, for each move, whether it is right, wrong, or right-but-doesn't-establish-what-it's-used-for, with a short justification. Finish with what, if anything, both of them are missing. I don't want a declaration of an overall winner so much as a careful audit of where each of them is correct.

  Here is how it went. Dana opened: consequentialism says to do the act with the best overall consequences, but the causal consequences of any act fan out indefinitely, and a century or two out you can't even specify the relevant state space, let alone assign probabilities. So for any two options the long-run difference isn't merely unknown but unknowable, while the near-term difference is trivial against the total; therefore the theory can't rank acts at all, and any consequentialist who acts is quietly substituting a short horizon, which is arbitrary. Marcus replied with two points: first, that she's sliding between a criterion of rightness and a decision procedure, since there can be a fact of the matter about which act has the best consequences even if nobody can compute it, and epistemic limits don't touch the truth of the criterion; second, that the practical difficulty isn't special to consequentialism, because ruling out clueless action would rule out most long-horizon prudence too. Dana answered that the criterion/procedure distinction buys nothing practical and, taken seriously, makes the theory useless as a guide, which was the whole point of having one; and that the standard patch — maximizing expected value — doesn't rescue it, because expected value is only as good as the distribution you feed it, and where we're clueless we have a placeholder rather than a distribution. Multiplying a placeholder by a value and summing over a century yields a number, she said, but the number is an artifact; worse, since the future is enormous and the tail is exactly where we're blindest, the expectation is dominated by the terms we're least entitled to. Marcus countered that this proves too much: by that argument nobody could ever act on long-horizon considerations — not a parent, not a physician, not a pension fund — and we act under acknowledged model error constantly, with paralysis as the only alternative. He added that cluelessness comes in degrees: often the sign of an effect is robust even when its magnitude isn't, so we can identify acts that are better across a wide range of plausible models without saying how much better; and that there's a difference between having no information and having a little, whereas she was treating "we can't be sure" as "we have nothing." Dana came back that the robustness claim is usually an illusion, that the history of interventions is a graveyard of sign flips, and that when a sign really is robust it's typically because one has quietly narrowed to a near-term, local metric — which is just to abandon the total-consequences view for common-sense morality wearing a consequentialist label; so either you're clueless and have no guidance, or you've smuggled in a restriction you can't justify from inside the theory. Marcus closed by saying the smuggling charge assumes the only options are the total view or an arbitrary restriction, when there's a third: reason about what's choice-worthy given our actual evidence and accept a modest, corrigible ranking rather than a divine one, since a criterion doesn't owe us a decision procedure that settles every case, and demanding that it do so imports a requirement from outside. Please work through this carefully and tell me who is right about what.
reasoning: |-
  Okay, let me approach this step by step. The user is a philosophy doctoral student working on long-term cause prioritization, facing the practical challenge of "consequentialist cluelessness" - the difficulty in predicting distant consequences of present actions. They've witnessed an argument between two colleagues, Dana and Marcus, and want a detailed analysis of each move.

  First, I need to understand the core debate. Dana argues that consequentialism becomes useless when considering long time horizons because we can't specify state spaces or assign probabilities to distant outcomes. Marcus counters that epistemic limitations don't invalidate the theory's truth, and that practical decision-making always operates under uncertainty.

  I'll break down each exchange carefully:
  - Dana's opening: She makes a strong case about the impossibility of long-term prediction, but may underestimate how we handle uncertainty in other domains.
  - Marcus's reply: His criterion/procedure distinction is technically correct but may not resolve practical dilemmas. His comparison to prudence is insightful.
  - Dana's response: Rightly points out that formal expected value calculations can be misleading with poor inputs, but her dismissal of any long-term reasoning seems extreme.
  - Marcus's counter: Correctly notes we must act under uncertainty, and introduces the valuable concept of "degrees of cluelessness." His sign robustness argument needs scrutiny though.
  - Dana's comeback: Her skepticism about sign robustness is historically justified, and she exposes how some "robust" conclusions may rely on implicit near-term metrics.
  - Marcus's close: Makes the important point that demanding perfect certainty is unreasonable, and that evidence-relative rankings are valid even if imperfect.

  The user likely needs more than just an academic verdict - they need practical guidance for their grantmaking work. Both debaters miss key points: Dana overlooks that some actions clearly dominate others even with uncertainty, while Marcus underplays how easily model-dependent reasoning can go wrong. The solution might lie in focusing on robustly positive interventions while acknowledging epistemic limitations.

  I should emphasize that in practical terms, Marcus's approach is more workable for the user's role, though Dana's warnings about false confidence are crucial for responsible long-term prioritization.
answer: |-
  ## Adjudication of Dana vs. Marcus on Consequentialist Cluelessness

  **Adjudicator Stance:** As an expert in normative ethics and decision theory under deep uncertainty, I'll evaluate each move rigorously, first constructing the strongest version of each position before assessing correctness, justification, and what remains unaddressed.

  ---

  ### Move 1: Dana's Opening Argument
  *   **Claim:** Consequentialism requires ranking acts by *total* consequences. Long-term consequences (centuries+) are epistemically inaccessible (cannot specify state space, assign probabilities). Near-term differences are negligible compared to the total. Therefore, consequentialism cannot rank acts, and practitioners arbitrarily substitute a short horizon.
  *   **Strongest Version:** Dana highlights the *structural* epistemic problem: the true causal graph of long-term effects is not just unknown but *unknowable* due to chaotic systems, path dependence, and unforeseeable technological/social shifts. The "fanning out" means the variance of possible outcomes grows exponentially, swamping near-term differences. A theory demanding optimization over an undefined, unquantifiable space is operationally empty.
  *   **Verdict:** **Right-but-doesn't-establish-what-it's-used-for.**
  *   **Justification:** Dana correctly identifies the core problem of *radical cluelessness* for total-consequence consequentialism in long-horizon contexts. The argument effectively shows that *precise cardinal ranking* based on total consequences is impossible. However, it doesn't *necessarily* prove consequentialism "can't rank acts at all." It might still support *ordinal* rankings (A > B) in some cases (Marcus's later point) or justify non-standard decision rules *within* consequentialism (e.g., satisficing, robustness criteria).

  ### Move 2: Marcus's First Reply (Two Points)
  *   **Point 1 (Criterion/Procedure Distinction):** There's a fact about which act has best consequences (criterion), even if we can't compute it (decision procedure). Epistemic limits don't invalidate the criterion.
  *   **Strongest Version:** Marcus defends the *coherence* of consequentialism as a theory of rightness. The truth of "Act A has better total consequences than Act B" exists independently of our ability to discern it, just as "Planet X exists" might be true even if we can't observe it. Epistemology doesn't dictate metaphysics.
  *   **Verdict:** **Right (on its own terms), but practically weak.**
  *   **Justification:** The distinction is philosophically sound and prevents collapsing the *truth* of the theory with our *access* to that truth. However, Dana is correct that this offers *zero practical guidance*, which is often the primary function sought from an ethical theory (especially in grantmaking!). It risks making consequentialism a purely theoretical claim devoid of action-guidance.
  *   **Point 2 (Generality of Problem):** The cluelessness problem isn't unique to consequentialism; it applies equally to long-term prudence (e.g., saving for retirement, preventative healthcare).
  *   **Strongest Version:** Marcus broadens the scope to show the challenge is fundamental to *any* forward-looking decision under deep uncertainty over long horizons, regardless of the normative framework (self-interest or morality). This deflects the charge that consequentialism is uniquely flawed.
  *   **Verdict:** **Right.**
  *   **Justification:** The core epistemic challenge – modeling complex systems far into the future – is indeed generic. Prudent individuals constantly act despite profound uncertainty about long-term outcomes (e.g., career choices, investing, climate policy). This doesn't *solve* the problem for consequentialism, but it shows Dana's critique isn't a decisive objection *against* consequentialism specifically.

  ### Move 3: Dana's Response to Marcus
  *   **Point 1 (Uselessness of Criterion/Procedure Distinction):** The distinction buys no practical guidance, rendering the theory useless as a guide, which defeats its purpose.
  *   **Strongest Version:** Dana insists that the *primary value* of an ethical theory in practical contexts (like cause prioritization) is its ability to guide action. A criterion that is *in principle* unknowable provides no such guidance. A theory that cannot be operationalized is pragmatically inert.
  *   **Verdict:** **Right.**
  *   **Justification:** Dana correctly identifies the practical impotence of the criterion/procedure distinction alone. For an actor like our grantmaker, a truth they cannot access *is* functionally equivalent to no truth at all regarding action guidance. The point of the theory *as a guide* is undermined.
  *   **Point 2 (Failure of Expected Value - EV):** EV is only as good as the input distribution. Under cluelessness, we have "placeholders" (vague possibilities, not well-defined probabilities). Calculating EV with these yields meaningless artifacts. Worse, the immense scale of the future means the expectation is dominated by tail events we understand least.
  *   **Strongest Version:** Dana attacks the primary *formal* tool for handling uncertainty under consequentialism. True cluelessness means we lack the basis for *any* defensible probability distribution over sufficiently distant states (Keynesian "weight of evidence" problem). Plugging in arbitrary distributions or uniform priors over undefined spaces is mathematically possible but epistemically bankrupt. The dominance of poorly understood tail risks amplifies this arbitrariness.
  *   **Verdict:** **Right (on the core critique), but potentially overbroad.**
  *   **Justification:** Dana is fundamentally correct about the severe limitations of standard EV maximization under radical cluelessness. Assigning precise probabilities to century-scale outcomes often *is* an act of unjustified precision. The tail risk point is particularly strong: tiny probabilities multiplied by vast (but highly speculative) utilities dominate calculations, making results hypersensitive to dubious model assumptions. However, her implication that EV is *always* an "artifact" under long horizons may be too strong; sometimes robust evidence supports specific distributions for *parts* of the outcome space.

  ### Move 4: Marcus's Counter
  *   **Point 1 (Proves Too Much / Paralysis):** Dana's argument would forbid all long-horizon action (parenting, medicine, pensions). We constantly act under acknowledged model error; the alternative is paralysis.
  *   **Strongest Version:** Marcus argues that Dana's strict epistemic standard is practically unsustainable. Humans *must* make consequential long-term decisions despite profound uncertainty. Demanding certainty or precise knowledge before acting leads to inaction, which itself has consequences. Consequentialism can (and must) accommodate this reality.
  *   **Verdict:** **Right.**
  *   **Justification:** Marcus successfully highlights the unacceptable practical consequence of Dana's strict epistemic requirement. Inaction is also a choice with potentially catastrophic long-term effects. Decision-making under acknowledged ignorance is an inescapable feature of the human condition, not a unique flaw of consequentialism. A viable theory must offer guidance *despite* this.
  *   **Point 2 (Degrees of Cluelessness / Sign Robustness):** Cluelessness isn't binary. Often the *sign* (direction) of an effect is robust across plausible models, even if the magnitude is unknown. We can identify "better" acts without knowing "how much better." "Can't be sure" ≠ "Have nothing."
  *   **Strongest Version:** Marcus introduces nuance. While precise quantification may be impossible, *comparative assessments* might survive uncertainty. If Act A yields better outcomes than Act B across a wide range of credible future scenarios and models (e.g., investing in pandemic preparedness vs. not, across various demographic/tech/climate models), we can reasonably say A > B, even without knowing the exact EV difference. We often have *some* evidence, not zero.
  *   **Verdict:** **Right in principle, but contingent and needs evidence.**
  *   **Justification:** Marcus identifies a crucial possibility: *robust satisficing* or *dominance reasoning* under deep uncertainty. If an act appears beneficial (or less harmful) across diverse, plausible models, this provides consequentialist grounds for preference, sidestepping the need for precise EV calculation. However, this *depends entirely* on whether such robustness actually exists for the specific choices at hand. His claim is a *potential* solution, not a guaranteed one.

  ### Move 5: Dana's Rebuttal on Robustness & Smuggling
  *   **Point 1 (Robustness Illusion & Sign Flips):** Historical interventions show sign flips are common. Presumed robustness is often an illusion. When signs *are* robust, it's usually due to narrowing focus to near-term/local effects.
  *   **Strongest Version:** Dana provides a powerful empirical counter: the track record of unintended consequences and model failures (e.g., economic policies, environmental interventions, social programs) demonstrates that apparent sign robustness is fragile. True long-term, total-consequence sign robustness is rare. When it *seems* robust (e.g., "vaccinating children is good"), it's often because we're implicitly evaluating only near-term health benefits within a stable context, ignoring potential long-term evolutionary, social, or systemic effects that could flip the sign.
  *   **Verdict:** **Right about the risk/history, but potentially too skeptical.**
  *   **Justification:** Dana's historical pessimism is well-founded; the world *is* complex and predictions often fail spectacularly. The charge that "robustness" often smuggles in a near-term perspective is insightful and frequently correct. However, it's likely *too strong* to claim sign robustness *never* holds for total consequences across plausible long-term models. Some interventions (e.g., preventing existential catastrophes, promoting fundamental scientific understanding) might exhibit genuine, broad robustness in their *direction* of effect, even if magnitude is unknown.
  *   **Point 2 (Smuggling Charge):** Using "robust" signs or acting on near-term effects means abandoning the total-consequences view for "common-sense morality wearing a consequentialist label." It's an unjustifiable restriction from within the theory.
  *   **Strongest Version:** Dana argues that any practical "solution" like Marcus's robustness either 1) Fails to address the total consequences, secretly substituting a proxy (near-term/local effects), or 2) Arbitrarily restricts the scope of consequences considered, without justification *from within* the total-consequentialist framework itself. This makes the theory self-undermining in practice.
  *   **Verdict:** **Right about the theoretical tension, but overstates the "abandonment."**
  *   **Justification:** Dana identifies a genuine theoretical vulnerability. Pure total consequentialism *does* struggle to justify why focusing on robust near-term signs or specific domains is *optimal* for total consequences. There is a risk of inconsistency. However, this doesn't necessarily mean practitioners *abandon* consequentialism; it might mean they adopt a *pragmatic, evidence-relative version* of consequentialism (as Marcus hints next), acknowledging that pursuing the *truly optimal* total consequence is impossible, but seeking the *best supported* action given our epistemic limits is the best we can do *as consequentialists*. It's a modification, not necessarily an abandonment.

  ### Move 6: Marcus's Closing
  *   **Claim:** Dana's smuggling charge presents a false dilemma (Total View or Arbitrary Restriction). A third way: "reason about what's choice-worthy given our actual evidence" and accept "a modest, corrigible ranking." A criterion doesn't need a decision procedure that settles every case perfectly; demanding that imports an external requirement.
  *   **Strongest Version:** Marcus advocates for *Evidence-Relative Consequentialism* or *Bounded Consequentialism*. The right act is the one with the best *expected* consequences *relative to the agent's available evidence and rational capabilities*. We aim for the best ranking we can achieve with our limited knowledge and models, knowing it's fallible and revisable. Insisting the theory provide perfect, clairvoyant guidance is imposing an impossible standard not required by the core consequentialist idea (maximize good).
  *   **Verdict:** **Right, and addresses the core practical impasse.**
  *   **Justification:** Marcus offers the most viable path forward. Consequentialism, like any practical theory, must operate within human cognitive and epistemic constraints. "Maximize expected value *given reasonable models and available evidence*" is a coherent (though complex) decision procedure derived *from* the criterion, acknowledging our limitations. It avoids paralysis without requiring arbitrary horizons. It accepts corrigibility. This doesn't make the ranking "arbitrary"; it makes it *evidence-bound* and *rational under uncertainty*. Demanding infallible divine rankings *is* an external, unreasonable demand.

  ---

  **What Both Are Missing:**

  1.  **The Importance of Robustness *Beyond* Sign:** They focus on sign flips. But even if the sign is robust, the *magnitude* uncertainty can be so vast (e.g., good, but is it 1 QALY or 1 trillion QALYs?) that it undermines traditional EV calculations and comparisons between positive interventions. Robust satisficing ("do no harm," "lock in crucial goods") might be more viable than robust optimization.
  2.  **Non-Linearities and Thresholds:** Long-term futures often involve potential non-linearities, tipping points, and existential thresholds. Small differences now might have zero effect, or might be the difference between flourishing and extinction. This complexity makes simple fanning-out models insufficient and adds another layer of cluelessness beyond just fan-out.
  3.  **The Value of Information & Option Preservation:** A crucial consequentialist strategy under cluelessness is prioritizing actions that preserve options, increase future resilience, or generate valuable information (exploration) – even if their direct impact is uncertain. This is often overlooked in the "A vs B" direct comparison framing.
  4.  **Meta-uncertainty:** They don't deeply address uncertainty *about* our models and level of cluelessness itself. How confident are we that we're clueless? How do we reason when we're uncertain about our uncertainty?
  5.  **Consequentialism's Resources Beyond EV:** Consequentialism isn't synonymous with EV maximization. Rule consequentialism, two-level consequentialism, or adopting risk-averse/robust optimization criteria (minimax regret, satisficing) might offer alternative decision procedures better suited to cluelessness, though each has its own challenges.

  **Conclusion (Who is Right About What):**

  *   **Dana is Right:** About the profound, structural nature of cluelessness for *total consequence* ranking. About the practical uselessness of the bare criterion/procedure distinction. About the severe limitations and potential arbitrariness of EV calculations under deep uncertainty. About the historical fragility of assumed sign robustness and the risk of smuggling in near-term perspectives. About the theoretical tension in justifying practical restrictions within pure total consequentialism.
  *   **Marcus is Right:** That the problem isn't unique to consequentialism. That demanding perfect certainty leads to paralysis. That cluelessness comes in degrees and *some* information (including potential sign robustness) often exists. That the "smuggling" charge sets up a false dilemma. That the viable path is evidence-relative, modest, corrigible consequentialism – reasoning about what's best *given our epistemic state* – and that this is a coherent, practical application of the theory, not an abandonment of it.

  **Final Practical Verdict:** While Dana powerfully exposes the deep theoretical challenges, Marcus offers the more constructive framework for actually *acting* as a consequentialist under long-horizon cluelessness. His evidence-relative approach, seeking robustly positive or non-negative interventions where possible, prioritizing information gain and option preservation, and accepting corrigibility, is the most viable path forward for your cause prioritization work. Dana's skepticism, however, remains essential for rigor – constantly questioning assumed robustness, scrutinizing models for hidden near-term biases, and acknowledging the profound limits of our foresight.
