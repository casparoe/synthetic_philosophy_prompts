  The conclusion doesn't follow because the friend treats autonomy as static ("only the present self counts"), whereas bipolar requires planning for fluctuating capacity. Clinically, advance directives empower patients by ensuring their competent wishes guide care during crises. The user's hesitation is understandable, but the friend's argument misses the purpose: harm reduction, not philosophical purity.

