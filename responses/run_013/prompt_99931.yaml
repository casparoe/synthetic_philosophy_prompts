  But note: what if we have a countable transitive model (CTM) of ZF? In such a model, the natural numbers of the model (ω^M) are the real ω (the standard natural numbers). Then the part about "your numbers aren't our numbers" doesn't hold for the natural numbers. However, the power set of ω in the model (P^M(ω)) is a countable set (from the outside) and is a subset of the real power set (because the model is transitive). The bijection between P^M(ω) and ω exists in the real world but not in M. So even in this case, the explanation holds by shifting the focus to the power set: M doesn't have all subsets of ω, and it also doesn't have the bijection that exists externally. So (b) can be patched by noting that the power set in M is not the full power set.

