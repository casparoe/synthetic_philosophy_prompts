prompt: |-
  I'm a PhD student in history and philosophy of science, and I've been drafted as an unpaid consultant to a small foundation that awards a mid-career prize for a scientific discovery. The committee is made up of working scientists and donors, meets for two hours, and keeps running into the same problem: a prize-worthy advance appears to have been made independently by two or more people within a few years of each other, and they have no principled way to decide whether to give the prize to one person, split it, or withhold it because the discovery was, as they put it, in the air. I want you to turn the philosophical literature on simultaneous invention and the inevitability of discovery into a procedure they can actually run on a dossier.

  I've been trying to organize the issue around three distinctions I don't see made cleanly enough in the usual great-man versus zeitgeist debate: first, causal independence, meaning did the later party have access to the earlier party's work or to a common source that made the result obvious; second, formulation independence, meaning would the later party's version have been intelligible and usable to the community without the earlier party's version; and third, credit-relevant priority, meaning who first put the result into circulation in a form that others could build on. I also want the procedure to separate the descriptive question of whether a discovery was inevitable into at least three sub-questions: was the problem recognized, were the tools available, and how many genuinely independent routes to the result are documented. The committee is not equipped to do archival research, so the procedure has to work from the dossiers they already have, flag what evidence would change the answer, and be honest when the dossier is too thin.

  Please write the procedure: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a definite no or a shared award, and where it hands the decision back to the committee because the remaining question is about values, for example how much weight to give priority of publication versus priority of conception, or whether to reward the person who made the discovery usable. Then run it on two historical cases, the calculus dispute between Newton and Leibniz and the natural selection case involving Darwin and Wallace, and on one constructed modern case where a senior scientist can show dated private notes but no publication, while a junior scientist published first and made the field take notice. I expect the procedure to give the committee an answer it won't like in that third case; say why that is the right answer anyway, or where the procedure is misfiring. End by stating what the procedure cannot do. No citations, reading lists, or bibliographies; I need the operational tool and the worked applications, not a literature review.
reasoning: |-
  Okay, the user is a PhD student in history and philosophy of science who's been drafted as a consultant for a scientific prize committee. They're struggling with cases where multiple people seem to have independently made the same discovery around the same time. The committee needs a clear procedure to decide whether to award the prize to one person, split it, or withhold it.

  The user has outlined three key distinctions they want incorporated: causal independence (whether later parties had access to prior work), formulation independence (whether versions were independently intelligible), and credit-relevant priority (who first put the result into circulation). They also want to break down "inevitability" into whether the problem was recognized, tools were available, and how many independent routes are documented.

  Hmm, the committee has limited time and can't do new research, so the procedure must work with existing dossiers and clearly flag when evidence is insufficient. The user wants concrete questions with decision points, plus applications to Newton/Leibniz, Darwin/Wallace, and a modern case with private notes versus publication.

  I need to design a step-by-step flowchart-like procedure that:
  - Separates descriptive inevitability questions from value judgments
  - Uses the three independence distinctions
  - Has clear stopping points (definite no, shared award) or handoffs to committee for value calls
  - Works with dossier evidence level
  - Handles the three test cases transparently

  For the modern case, I anticipate tension - the procedure will likely favor the junior scientist who published first and made the impact, which might upset the senior with private notes. But that seems correct philosophically - circulation matters more than private conception. I'll need to justify why.

  The procedure must also state its limitations upfront: can't resolve all priority disputes, depends on dossier quality, doesn't replace value judgments about what constitutes "building-block" work, etc.

  For structure: first present the procedure as numbered steps with decision branches, then apply to cases. In cases, show how evidence answers each step. For modern case, explain why unpopular outcome is philosophically sound - credit should follow actual community access and impact, not private insight. The "discovery in the air" question helps determine if withholding is justified.

  End by clarifying boundaries: procedure can't create new evidence, can't set prize values (like how much to weight conception vs communication), and can't resolve all moral claims - just structures available evidence into defensible options.
answer: |-
  Here’s a procedural framework for the committee, designed for operational use with existing dossiers. It prioritizes evidence-based conclusions and flags value judgments or insufficient evidence.

  **Procedure: Simultaneous Discovery Assessment**

  **Phase 1: Establish Causal Independence (Was it truly independent?)**
  1.  **Question:** For each claimant after the earliest documented work, did they have access to the prior claimant's *specific results* (preprint, correspondence, lecture) or a *common, uniquely enabling source* before/during their own work?
      *   **Sufficient "No" (Independent):** Dossier shows no evidence of access (e.g., geographic isolation, confirmed later discovery date of source, claimant statement denying access corroborated by timeline).
      *   **Sufficient "Yes" (Not Independent):** Dossier shows clear proof of access (e.g., citation, dated correspondence referencing the work, attendance at a talk). *Stop:* This claimant is derivative. Proceed only with causally independent claimants.
      *   **Insufficient Evidence/Unclear:** Dossier ambiguous (e.g., attended same conference but no proof they saw *that* talk, worked in same field but no direct evidence of access). *Flag:* "Causal independence uncertain. Priority decision may depend on later steps." Proceed cautiously.

  **Phase 2: Assess Formulation Independence (Was the later version self-contained?)**
  2.  **Question:** For each claimant still under consideration, would their formulation have been intelligible and usable by the scientific community *without* the existence of the other claimant's formulation?
      *   **Sufficient "Yes" (Independent Formulation):** Dossier shows their work was presented with sufficient clarity, evidence, and context to be understood and used on its own (e.g., a complete paper, a functional prototype with documentation, community adoption *based on their version*).
      *   **Sufficient "No" (Dependent Formulation):** Dossier shows their work was demonstrably cryptic, incomplete, or relied directly on the *specific presentation* of the other claimant to be usable (e.g., an abstract needing the other's full paper for context, notes referencing the other's terminology without definition). *Stop:* This claimant lacks formulation independence.
      *   **Insufficient Evidence/Unclear:** Dossier only contains partial drafts or unclear presentation formats. *Flag:* "Formulation independence unclear. Decision may hinge on credit-relevant priority."

  **Phase 3: Determine Credit-Relevant Priority (Who put it into circulation first?)**
  3.  **Question:** Among claimants with confirmed causal *and* formulation independence (from Phases 1 & 2), who first put the discovery into a form that allowed the community to *build upon it*? Prioritize verified, accessible circulation (e.g., publication, public demonstration, widely distributed preprint) over private conception (notes, letters to a few).
      *   **Clear Priority:** Dossier shows one claimant achieved verifiable circulation significantly earlier (e.g., publication date, patent filing date, confirmed public demo date). *Stop:* Award to this claimant.
      *   **Effectively Simultaneous Circulation:** Dossier shows circulation dates within a short timeframe (e.g., <12-18 months) where neither could have reasonably built on the other's *circulated* work. *Stop:* Shared award is justified.
      *   **Priority Unclear/Disputed:** Dossier has conflicting dates, unclear publication status, or relies heavily on private notes claimed to predate circulation. *Flag:* "Credit-relevant priority disputed. Committee must weigh value of conception vs. communication."

  **Phase 4: Assess Inevitability ("Was it in the air?") - Only if no claimant passed Phase 3 or priority is unclear.**
      *Ask these sub-questions to determine if withholding the prize is justified:*
  4.  **Sub-Question 1 (Problem Recognition):** Does the dossier show the core problem was widely recognized and actively pursued by multiple groups before the claimants? (Evidence: Review articles, conference themes, funding calls, publications posing the problem).
  5.  **Sub-Question 2 (Tool Availability):** Does the dossier show the necessary tools, methods, or background knowledge were widely available to the relevant community? (Evidence: Standard textbooks, common lab techniques, commercial instrumentation, foundational papers cited by multiple claimants).
  6.  **Sub-Question 3 (Documented Independent Routes):** Does the dossier document *multiple* (≥2) genuinely independent (per Phase 1 & 2) routes to essentially the same discovery within a short timeframe (e.g., <5 years)?
      *   **Sufficient "Yes" to all 3:** Strong evidence discovery was inevitable. *Stop:* Recommend withholding the prize ("in the air").
      *   **"No" to any sub-question, or Insufficient Evidence:** Inevitability not strongly established. *Flag:* "Withholding not clearly justified by evidence. Revisit priority (Phase 3) or consider shared award based on impact/usability (Value Judgment)."

  **Value Judgment Handoff:** The procedure explicitly hands the decision back to the committee when:
  *   Causal or Formulation Independence is unclear (Flags from Phase 1 or 2).
  *   Credit-Relevant Priority is unclear/disputed (Flag from Phase 3).
  *   Inevitability assessment is inconclusive but no clear priority exists (Flag from Phase 4).
  *   The committee must decide between claimants where one has stronger conception (e.g., private notes) but another has stronger communication/impact (e.g., made the field take notice).
      *   *Committee Questions:* How much weight should we give priority of conception vs. priority of circulation? Should we reward the person who made the discovery usable and impactful, even if not strictly first? Is there exceptional merit in one formulation?

  ---

  **Application to Cases**

  1.  **Newton vs. Leibniz (Calculus)**
      *   **Phase 1 (Causal Independence):** Dossier shows limited communication, no evidence Leibniz saw Newton's early private manuscripts/circulations *before* his own independent development. *Independent? Unclear/Probably Yes* (Leibniz developed notation/methods differently). **Proceed.**
      *   **Phase 2 (Formulation Independence):** Both developed intelligible, usable, but *different* formulations (fluxions vs. differentials). *Independent? Yes.* **Proceed.**
      *   **Phase 3 (Credit-Relevant Priority):**
          *   Newton: Private notes/circulations (e.g., *De analysi*, 1669, limited circulation), full publication much later (*Principia* 1687 used fluxions but obscurely, *Opticks* 1704).
          *   Leibniz: Published papers outlining the differential calculus (1684, 1686) - clear, public circulation.
          *   *Clear Priority?* Leibniz published his core methods first (1684 vs Newton's first *public* account in 1704). Newton's private work wasn't built upon until much later. **Stop: Award to Leibniz** based on verified, impactful circulation enabling community building. (Committee might *value* Newton's earlier conception, but the procedure prioritizes circulation).

  2.  **Darwin vs. Wallace (Natural Selection)**
      *   **Phase 1 (Causal Independence):** Dossier shows Wallace sent manuscript to Darwin (1858) *before* Darwin had published. Darwin had conceived theory earlier. *Independent? No for Wallace regarding Darwin's unpublished work (he triggered Darwin to act), but Yes regarding the core idea's genesis.* **Proceed with both (Wallace independent genesis, Darwin independent genesis but Wallace had causal link to Darwin's unpublished work).**
      *   **Phase 2 (Formulation Independence):** Wallace's 1858 essay was intelligible and complete on its own. Darwin's unpublished writings (e.g., 1844 essay) were also substantial. *Independent? Yes for both.* **Proceed.**
      *   **Phase 3 (Credit-Relevant Priority):**
          *   Darwin: Private writings long predate (e.g., 1842 sketch, 1844 essay - not widely circulated).
          *   Joint Presentation: Linnean Society papers (Darwin's 1844 essay + 1857 letter excerpt + Wallace's essay) read together July 1858. This was the first *public* (though initially low-impact) circulation allowing community access to *both*.
          *   *Clear Priority?* Effectively simultaneous *public circulation* via the joint presentation (July 1858). Neither could build on the other's *publicly available* work before this point. **Stop: Shared award justified.** Darwin's earlier conception is acknowledged but circulation was simultaneous.

  3.  **Constructed Modern Case (Senior: Dated Notes, Junior: First Pub & Impact)**
      *   **Phase 1 (Causal Independence):** Dossier shows Junior had no access to Senior's private notes. *Independent? Yes.* **Proceed with both.**
      *   **Phase 2 (Formulation Independence):** Senior's notes are dated but private/unpublished. Junior's publication is complete and intelligible. *Independent? Senior: No (not circulated/intelligible to community). Junior: Yes.* **Stop:** Senior fails Phase 2. Only Junior proceeds.
      *   **Phase 3 (Credit-Relevant Priority):** Only Junior has circulated the discovery (publication). **Stop: Award to Junior.**

  *   **Why this is the right (if unpopular) answer:** The procedure prioritizes credit-relevant priority – putting the discovery into a form the community can *use and build upon*. Senior's private notes, while proving conception, did not advance the field. Science progresses through shared, accessible knowledge. Junior *did* the work of making it usable and putting it into circulation, triggering progress. Awarding based solely on private notes sets a problematic precedent, removing incentive for clear communication and verification. The committee might *value* Senior's insight highly, but the procedure's logic (focused on what enables community progress) points to Junior.
  *   **Where it might misfire:** If Senior's notes were widely shared *informally* before Junior's pub (e.g., emailed to key labs, presented at a major workshop) but not formally published, the dossier might not capture this as "circulation." The procedure relies on documented evidence in the dossier. If such evidence existed but wasn't included, the procedure would misfire.

  ---

  **What the Procedure Cannot Do**

  1.  **Resolve Ambiguity Without Evidence:** It cannot create evidence. If the dossier is thin (e.g., no access records, no clear dates, only partial drafts), it will flag uncertainty but cannot provide a definitive answer.
  2.  **Make Value Judgments:** It identifies points where committee values are crucial (weight of conception vs. communication, rewarding impact vs. strict priority) but cannot decide those values.
  3.  **Conduct Original Research:** It relies solely on the compiled dossier. It cannot uncover new letters, verify note dates forensically, or interview participants.
  4.  **Define "Discovery" Rigidly:** It assumes the dossier defines the "discovery" in question. Subtle differences in formulation or scope between claimants might complicate this.
  5.  **Account for All Moral Claims:** It focuses on evidence-based contributions to scientific progress. It may not address perceived fairness, mentorship dynamics, or institutional pressures that the committee might also consider (but shouldn't, ideally, for the discovery itself).
  6.  **Guarantee a Liked Outcome:** It prioritizes philosophical principles (causal independence, formulation usability, credit-relevant circulation) over personal feelings, institutional loyalty, or perceived seniority. Unpopular but defensible outcomes are possible.
