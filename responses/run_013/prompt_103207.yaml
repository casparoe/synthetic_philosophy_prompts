prompt: |-
  I'm a retired geologist who got into philosophy late, and I've somehow ended up on the advisory board of a small foundation that can fund about three people for two years on conceptual work. We want to put the money into supererogation -- the whole business of acts that are morally good but not required. Which open questions in that area should we prioritize, and why? I don't want a reading list or a survey; I want a defended agenda. I keep getting stuck on a puzzle: if an act is morally better than what's required, why isn't it required? And if it's not required, what makes it better? Take a case: a doctor is the only compatible kidney donor for a stranger and donates. Most people say that's supererogatory, but if the stranger will die otherwise, is it really beyond duty? If yes, what does beyond duty mean when the stakes are life and death? If no, does supererogation just disappear whenever the stakes get high enough? I've been calling it the stakes-collapse worry. I'd like you to use that puzzle, or something like it, to say which questions are upstream of the others -- for instance, whether supererogation is a genuine deontic category or just a way of talking about reasons, whether it can apply to groups, institutions, or AI systems rather than individual humans, and whether the whole idea is coherent given the paradox above. Rank the questions we should fund, say what would move one up or down, and flag which ones are overrated or wouldnt change much downstream.
reasoning: |-
  Okay, a retired geologist turned philosophy enthusiast is on an advisory board for a foundation funding conceptual work on supererogation. They have resources for about three people for two years. The main puzzle they're stuck on is what I'm calling the "stakes-collapse worry": if an act is morally better than required, why isn't it required? And if it's not required, what makes it better? The example given is a doctor donating a kidney to save a stranger's life—supererogatory or actually required when stakes are that high?

  First, I need to understand the core of their concern. They want a defended agenda, not just a literature review. The key is to prioritize open questions in supererogation, using their stakes-collapse worry as a starting point. They mentioned upstream questions like whether supererogation is a genuine deontic category, applicability to groups/AI, and coherence given the paradox.

  The user's background as a geologist might mean they appreciate structured, systematic approaches. Their frustration with the paradox suggests they value clarity and foundational issues. The foundation's limited resources mean prioritizing questions that have high leverage—solving them could resolve multiple downstream issues or reshape the field.

  Breaking down the stakes-collapse worry: It challenges the existence of supererogation in high-stakes scenarios. If saving a life isn't required, how can it be supererogatory? If it is required, does supererogation vanish when stakes are high? This seems central because it questions the coherence of supererogation itself. So, resolving this could be the top priority. 

  Next, related questions: If supererogation isn't a deontic category but about reasons or virtues, that might dissolve the paradox. For example, if duties are minimal and supererogation involves exceeding those, high stakes might still allow for acts beyond the minimum. Or maybe supererogation is about agent-relative options, where individuals aren't obliged to sacrifice excessively. So, the ontological status of supererogation (Q1) is foundational—it affects how we approach the paradox.

  Then, scalability to collectives (Q2). If institutions have duties, what counts as beyond duty? For instance, a corporation going beyond environmental standards. If supererogation is only for individuals, that limits its scope. This connects to the paradox because collective duties might differ in high-stakes scenarios, like a company in a humanitarian crisis. This question might be less urgent than Q1 but still important for real-world applications.

  Coherence under demandingness (Q3) ties directly to the paradox. If morality becomes too demanding, supererogation might collapse. Theories need to explain limits of duty without making supererogation irrelevant in high stakes. Addressing this could involve examining agent-centered prerogatives or scalar morality. Since the user is fixated on this, it should be high priority.

  Overrated questions: Taxonomy (Q4) like acts of charity vs. heroism. While interesting, it might not resolve the paradox. Similarly, empirical studies (Q5) on cultural perceptions could wait until conceptual clarity is achieved. Evolutionary origins (Q6) might be too speculative and not address the core paradox.

  Ranking: Q1, Q3, and Q2 as top. Q1 is most upstream—defining what supererogation is affects everything else. Q3 tackles the user's specific worry directly. Q2 extends applicability, which is practical but secondary. Projects that combine Q1 and Q3 would be ideal, as solving the paradox requires understanding supererogation's nature.

  Shifts in priority: If Q1 resolves supererogation as non-deontic, Q2 becomes crucial for institutional ethics. If Q3 shows duties have fixed limits, high-stakes supererogation remains possible. If empirical work reveals universal intuitions against stakes-collapse, that could support certain theories.

  In summary, focus on the foundational and the user's core concern. Fund projects that address the ontology and coherence of supererogation, especially in high-stakes cases, as these are upstream. Avoid overemphasizing classifications or empirical studies until the conceptual groundwork is solid. The geologist's systematic thinking might appreciate this prioritization based on leverage and dependency.
answer: |-
  Based on your "stakes-collapse worry" and the foundation's goal of impactful conceptual work, here's a defended agenda prioritizing open questions in supererogation. The ranking is based on **upstream foundational impact**, **ability to resolve core paradoxes**, **breadth of downstream consequences**, and **neglect in current literature**. Your own puzzle is the central lever.

  **Core Insight:** The stakes-collapse worry isn't just *a* puzzle; it's the **fault line** revealing the deepest conceptual tensions in supererogation. Funding should target projects that directly confront this fault line or explore its structural implications. Questions that don't engage this core tension risk being peripheral.

  **Ranked Priority Questions for Funding:**

  1.  **Q1: The Ontology & Demarcation Problem (The Core Fault Line):**
      *   **Question:** *What is the *ground* of the distinction between the obligatory and the supererogatory, particularly in high-stakes scenarios like life-and-death, such that supererogation doesn't collapse into obligation? Does this ground lie in the structure of reasons (e.g., agent-relative prerogatives, scalar vs. deontic value), the nature of agency (e.g., autonomy, sacrifice), or the limits of moral demandingness?*
      *   **Why Highest Priority?** This **is** your stakes-collapse worry crystallized. It's the most upstream question. *Everything* downstream (what counts as supererogatory, by whom, in what contexts) depends on a coherent answer to *how the category itself is even possible* without collapsing under moral weight. Resolving (or significantly advancing) this is the key to unlocking the field.
      *   **Why Fund This?**
          *   **Directly Addresses Your Paradox:** Projects must grapple with the kidney donor case and analogous high-stakes dilemmas. Is the "beyond duty" element explained by permissible self-preference (even with life at stake)? By the *kind* of sacrifice involved (organ vs. money)? By a non-collapsing scalar dimension of goodness alongside threshold deontic requirements?
          *   **Foundation for All Else:** Clarifying the ontological status (is it a unique deontic category, a feature of reasons, a virtue concept?) determines the framework for answering Q2 and Q3. Without this, work on groups or demandingness floats unanchored.
          *   **High Stakes for the Concept:** Failure to make progress here risks showing supererogation is *not* a coherent moral category under scrutiny, which is a profound result. Success provides a robust defense.
      *   **What Would Move It Down?** If a project convincingly demonstrates that the collapse *does* happen in all high-stakes cases, rendering supererogation a low-stakes phenomenon only, this question becomes *about* defining that boundary. But this is still progress.

  2.  **Q2: Scalability & Agency: Beyond the Individual Moral Agent:**
      *   **Question:** *Can the concept of supererogation coherently apply to collective agents (corporations, states), institutions, or artificial moral agents (AI systems), and if so, how does the grounding identified in Q1 translate? What constitutes "beyond duty" for an entity whose "duties," "sacrifices," and "agency" are fundamentally different from an individual human?*
      *   **Why This Priority?** This is the most significant *extension* challenge forced by resolving Q1. If supererogation relies on features of *individual* human agency (e.g., autonomy, personal sacrifice, limited resources), does it vanish for other agents? If not, what analogous features ground it? This has immense practical implications (corporate philanthropy, state aid beyond treaties, AI ethics) but rests entirely on Q1's foundation.
      *   **Why Fund This?**
          *   **Tests the Robustness of Q1's Resolution:** A theory resolving the stakes-collapse for individuals must be stress-tested against radically different agents. Can it scale? Does it break? This reveals the depth and generality of the solution.
          *   **High Practical Relevance:** Much "beyond compliance" behavior occurs at institutional levels. Funding work here ensures philosophical clarity impacts real-world actors.
          *   **Conceptually Novel:** Far less explored than individual supererogation. A project here could define a new subfield.
          *   **Connects to Your Worry:** What does "sacrifice" mean for a corporation with vast resources saving lives? Is its "duty" lower than an individual's in a similar high-stakes scenario? This directly probes the boundaries exposed by the collapse worry.
      *   **What Would Move It Up?** If work on Q1 strongly suggests the grounding *isn't* uniquely human (e.g., if it's primarily about exceeding minimal deontic thresholds based on capacity), Q2 becomes even more urgent and tractable. If Q1 remains unresolved, Q2 becomes highly speculative.
      *   **What Would Move It Down?** If Q1 concludes supererogation is *essentially* tied to features unique to individual human psychology/embodiment, Q2 becomes largely moot (except perhaps as a critique of misapplied language).

  3.  **Q3: The Demandingness Ceiling & the Shape of Obligation:**
      *   **Question:** *Assuming supererogation exists, what *principle* sets the upper limit of moral demandingness (the boundary of duty), especially under varying stakes? Is it fixed, agent-relative, context-dependent, or based on the *nature* of the sacrifice? How does this principle interact with the scalar "better than" aspect identified in Q1?*
      *   **Why This Priority?** This is the *operational* counterpart to Q1's *ontological* question. Q1 asks *if* and *how* a distinction exists; Q3 asks *where* that line falls and *why* in specific cases. Your kidney case demands an answer here: *Why* is donating *not* required? It directly addresses the "if it's better, why not required?" part of your worry.
      *   **Why Fund This?**
          *   **Applies Q1 to Concrete Delimitation:** Projects here take the theoretical grounding from Q1 and develop principles for drawing the line in practice, especially in high-stakes cases.
          *   **Crucial for Practical Guidance:** Understanding where duty ends is essential for moral deliberation and evaluating social expectations/praise/blame.
          *   **Deepens the Stakes-Collapse Analysis:** It forces examination of whether the demandingness ceiling *itself* rises with stakes (potentially collapsing supererogation) or remains fixed/relative (preserving the space). This is the next logical step after establishing the category's possibility (Q1).
      *   **What Would Move It Up?** If Q1 yields a clear framework where the grounding *implies* a specific structure for demandingness (e.g., strong agent-centered prerogatives), Q3 becomes essential for working out the details. If Q1 remains messy, Q3 is harder but still vital for applications.
      *   **What Would Move It Down?** If Q1 concludes that supererogation isn't primarily defined by exceeding demandingness limits (e.g., if it's about motive or virtue instead), Q3 becomes less central, though still relevant for defining the *scope* of duty.

  **Overrated or Lower-Leverage Questions (Generally Not Recommended for Core Funding):**

  *   **Q4: Taxonomy & Granular Classification:** (E.g., Distinguishing heroism, saintliness, beneficence, favors). *Why?* While potentially useful, this often becomes descriptive cataloging. It doesn't resolve the core paradox (your stakes-collapse) and is downstream of the foundational ontology (Q1). Progress here doesn't significantly impact the fault line. *Possible exception:* If a project *uses* taxonomy to *test* a resolution to Q1 (e.g., showing how different categories rely on different grounding elements).
  *   **Q5: Empirical Psychology/Sociology of Praise & Blame:** *Why?* While fascinating and potentially informative about folk concepts, this doesn't answer the *normative* question of whether supererogation *should* exist or how it *can* be coherent. It risks conflating descriptive norms with justifiable moral categories. Doesn't touch the core paradox's logic. Fund sociology depts, not philosophy foundations, for this.
  *   **Q6: Evolutionary/Historical Origins of Supererogatory Intuitions:** *Why?* Similar to Q5. Explaining *why* we have the intuition doesn't tell us if the intuition points to a real moral category or resolve its internal coherence (your paradox). Interesting, but low leverage for conceptual advancement on the core problem.

  **Recommendation for Funding Allocation (3 Projects):**

  1.  **Project 1 (Addressing Q1 Primarily):** Fund a theorist (or a small team) deeply engaged in metaethics/deontic logic/moral demandingness to rigorously attack the ontology and demarcation problem, *using* high-stakes cases like your kidney donor as central test cases. **Goal:** Produce a defensible, detailed account of *how* supererogation is possible without collapsing, specifying its metaphysical or normative grounding.
  2.  **Project 2 (Bridging Q1 & Q2):** Fund a philosopher of collective/intentional action or AI ethics, collaborating with the theorist from Project 1, to explore the scalability of the grounding identified in Project 1 to non-individual agents. **Goal:** Determine if and how the core concept can be extended, generating frameworks for institutional/collective/AI "beyond duty" actions.
  3.  **Project 3 (Bridging Q1 & Q3):** Fund a normative ethicist (perhaps with applied interests) to develop principles for setting the boundary of demandingness based on the ontology established in Project 1, focusing on variable stakes and sacrifice types. **Goal:** Provide actionable (though necessarily complex) guidance on where duty ends and supererogation begins, especially in high-stakes contexts, resolving the "why isn't it required?" part of your puzzle.

  **Why this combination?** It creates a pipeline: Project 1 tackles the root cause of your foundational worry. Projects 2 and 3 then test and apply that resolution in the most consequential and underexplored directions (non-human agents and practical line-drawing under pressure). All projects are forced to engage deeply with the stakes-collapse paradox. This maximizes the chance of transformative conceptual progress on the most philosophically pressing and structurally significant open questions in supererogation.
