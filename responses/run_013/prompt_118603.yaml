  Based on your preferences and the stipulation that utility is linear in money, the request to isolate risk attitudes via a single sensitivity function \(g\) is coherent in principle. However, no single \(g\) satisfies all your verdicts due to a contradiction between your responses to gains and losses. Below, I explain the issue, propose the minimal repair, and address your additional queries.

  ### Analysis of Verdicts with a Single \(g\):
  Assume a rank-dependent utility model with linear utility and a single increasing function \(g\) where \(g(0) = 0\) and \(g(1) = 1\). The verdicts translate to constraints on \(g\):

  1. **50% chance of $100 vs. $0: Prefer certain $50.**  
     This implies \(g(0.5) > 0.5\).  
     *Derivation:*  
     Lottery: outcomes $0$ (prob 0.5), $100$ (prob 0.5).  
     RDU = \(0 \cdot g(0.5) + 100 \cdot (1 - g(0.5)) = 100(1 - g(0.5))\).  
     Preference: \(50 > 100(1 - g(0.5))\) → \(g(0.5) > 0.5\).

  2. **1% chance of $1000 vs. $0: Prefer lottery over certain $10.**  
     This implies \(g(0.99) < 0.99\).  
     *Derivation:*  
     Lottery: $0$ (prob 0.99), $1000$ (prob 0.01).  
     RDU = \(1000(1 - g(0.99))\).  
     Preference: \(1000(1 - g(0.99)) > 10\) → \(g(0.99) < 0.99\).

  3. **90% chance of $100 vs. $0: Prefer certain $80.**  
     This implies \(g(0.1) > 0.2\).  
     *Derivation:*  
     Lottery: $0$ (prob 0.1), $100$ (prob 0.9).  
     RDU = \(100(1 - g(0.1))\).  
     Preference: \(80 > 100(1 - g(0.1))\) → \(g(0.1) > 0.2\).

  4. **50% chance of losing $100 vs. $0: Prefer lottery over certain loss of $50.**  
     This implies \(g(0.5) < 0.5\).  
     *Derivation:*  
     Lottery: outcomes $-100$ (prob 0.5), $0$ (prob 0.5).  
     RDU = \(-100 \cdot g(0.5) + 0 \cdot (1 - g(0.5)) = -100g(0.5)\).  
     Preference: \(-100g(0.5) > -50\) → \(g(0.5) < 0.5\).

  5. **1% chance of losing $1000 vs. $0: Prefer certain loss of $10 over lottery.**  
     This implies \(g(0.01) > 0.01\).  
     *Derivation:*  
     Lottery: $-1000$ (prob 0.01), $0$ (prob 0.99).  
     RDU = \(-1000g(0.01)\).  
     Preference: \(-10 > -1000g(0.01)\) → \(g(0.01) > 0.01\).

  **Contradiction:**  
  Verdicts 1 and 4 conflict: \(g(0.5) > 0.5\) (from gains) and \(g(0.5) < 0.5\) (from losses). No single \(g\) can satisfy both. The other constraints (\(g(0.99) < 0.99\), \(g(0.1) > 0.2\), \(g(0.01) > 0.01\)) are consistent within their domains but do not resolve this contradiction.

  ### Minimal Repair: Separate Sensitivity Functions for Gains and Losses
  The smallest repair is to use **two sensitivity functions**, \(w^+\) for gains and \(w^-\) for losses, within a reference-dependent model (e.g., Cumulative Prospect Theory). This retains linear utility but allows risk attitudes to differ by domain. The repaired principle evaluates a lottery \(L\) as:
  - For gains (outcomes \(\geq 0\)): \( \text{RDU}_+(L) = \sum x_i \cdot w^+(p_i) \), with outcomes ranked from best to worst.
  - For losses (outcomes \(< 0\)): \( \text{RDU}_-(L) = \sum x_i \cdot w^-(p_i) \), with outcomes ranked from worst to best.

  **Constraints from your verdicts:**
  - **Gains (\(w^+\)):**
    - Verdict 1: \(100 \cdot w^+(0.5) < 50\) → \(w^+(0.5) < 0.5\).
    - Verdict 2: \(1000 \cdot w^+(0.01) > 10\) → \(w^+(0.01) > 0.01\).
    - Verdict 3: \(100 \cdot w^+(0.9) < 80\) → \(w^+(0.9) < 0.8\).
  - **Losses (\(w^-\)):**
    - Verdict 4: \(-100 \cdot w^-(0.5) > -50\) → \(w^-(0.5) < 0.5\).
    - Verdict 5: \(-10 > -1000 \cdot w^-(0.01)\) → \(w^-(0.01) > 0.01\).

  These constraints are satisfiable with increasing functions \(w^+\) and \(w^-\) (e.g., inverse-S shaped curves common in prospect theory). For instance:
  - \(w^+(p)\): Overweights small probabilities (\(w^+(0.01) > 0.01\)), underweights moderate/large probabilities (\(w^+(0.5) < 0.5\), \(w^+(0.9) < 0.8\)).
  - \(w^-(p)\): Similar pattern (\(w^-(0.01) > 0.01\), \(w^-(0.5) < 0.5\)).

  ### Addressing Additional Queries:
  Assume the repaired principle with linear utility and separate \(w^+\), \(w^-\).

  1. **50% chance of $100 vs. certain $49:**  
     - Lottery RDU: \(100 \cdot w^+(0.5)\).  
     - Certain outcome: $49$.  
     - Preference: Lottery if \(100 \cdot w^+(0.5) > 49\) → \(w^+(0.5) > 0.49\).  
     - **Conclusion:** Depends on \(w^+\).  
       - If \(w^+(0.5) > 0.49\), prefer lottery.  
       - If \(w^+(0.5) \leq 0.49\), prefer $49.  
     - *Why?* Verdict 1 requires \(w^+(0.5) < 0.5\), but \(0.49\) is below \(0.5\). Some \(w^+\) (e.g., \(w^+(0.5) = 0.495\)) prefer lottery; others (e.g., \(w^+(0.5) = 0.4\)) prefer $49.

  2. **50% chance of losing $100 vs. certain loss of $51:**  
     - Lottery RDU: \(-100 \cdot w^-(0.5)\).  
     - Certain outcome: $-51$.  
     - Preference: Lottery if \(-100 \cdot w^-(0.5) > -51\) → \(w^-(0.5) < 0.51\).  
     - **Conclusion:** Always prefer lottery.  
     - *Why?* Verdict 4 requires \(w^-(0.5) < 0.5\), which implies \(w^-(0.5) < 0.51\). The lottery is always better (less negative) than $-51$:  
       \[
       -100 \cdot w^-(0.5) > -100 \cdot 0.5 = -50 > -51.
       \]

  ### Why This Repair is Minimal:
  - **Single \(g\) fails:** Contradiction between gain and loss verdicts.
  - **Reference-dependent utility alone (without separate weights):** Insufficient, as curvature isn't the issue (utility is linear).
  - **Dropping a verdict:** Less parsimonious; keeping all verdicts requires domain-specific risk attitudes.
  - **Separate \(w^+\), \(w^-\):** Captures your asymmetric risk attitudes (risk aversion in gains, risk-seeking in losses for moderate probabilities) with minimal added complexity.

  ### Final Remarks:
  - Your approach is **coherent**: Isolating risk attitudes via probability weighting (with linear utility) is standard in rank-dependent models.
  - The repair uses **Cumulative Prospect Theory** (CPT) with linear utility, a well-established model for reference-dependent risk attitudes.
  - For implementation, choose \(w^+\) and \(w^-\) (e.g., \(w^+(p) = \frac{p^\gamma}{(p^\gamma + (1-p)^\gamma)^{1/\gamma}}\) with \(\gamma < 1\), \(w^-\) similarly) satisfying the constraints.
