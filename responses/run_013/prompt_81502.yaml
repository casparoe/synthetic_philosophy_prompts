prompt: |-
  I run a small metaethics reading group (four of us, one of whom is a Kantian who thinks the whole debate is confused) and next month we're doing the Frege-Geach problem. Every time we hit this topic we end up re-running the same three or four moves and calling it a day, so what I want instead is a sorting instrument: a five-question quiz that starts from the embedding data and ends by telling you which response to the problem you actually hold — sorted by what you say about cases, not by which label you like.

  The data I want to start from, because it's the bit everyone agrees on: 'lying is wrong' seems to keep its sense when it turns up as the antecedent of a conditional, under negation, inside a question, and inside 'she believes that lying is wrong'; and the argument from 'lying is wrong' plus 'if lying is wrong then telling the children to lie is wrong' to 'telling the children to lie is wrong' is valid in whatever sense any argument is valid. Dont build the questions around 'which embedding is hardest' — build them around what you think the sense of 'wrong' is, and let the hard cases fall out as consequences.

  Two things I want forced that we always skip. First, the negation case specifically, not just the conditional: if one person says lying is wrong and another says it isn't, where is the conflict supposed to live — in the two attitudes, in the two contents, or nowhere, because one of the two utterances isn't really a commitment at all? I want a question that makes you pick. Second, the cross-domain comparison: the same shape of puzzle turns up for 'might' (why is 'it might be raining and it isn't' out of order?) and for predicates of taste. I want at least one question whose answer tells me whether you think the moral case and the modal case are the same problem, and I want a leaf for the view that the analogy is superficial — that the modal case gets fixed by a parameter on the context or the information state and the moral case can't be, and that this is where expressivism actually breaks.

  Positions that have to be reachable as leaves, even by an ugly route: the force-only line, where the antecedent just isn't asserted and the meaning has to be doing something else; quasi-realism / creeping minimalism, where you help yourself to the truth-conditional machinery and then deny you meant anything loaded by it; the view where the state expressed has possible-worlds structure and the logic comes free; the attitude-logic line where validity is a matter of which combinations of attitudes are inconsistent rather than of truth-preservation; the hybrid line where the embedded clause expresses a belief and the unembedded one a desire; inferentialism, where the sense of 'wrong' just is its inferential role and the puzzle evaporates; plain cognitivism; and error theory or pretense-based fictionalism, where the embedded clauses are genuine contents and none of them are true.

  Two things to flag inside the relevant item rather than in a summary: any answer pattern the quiz lets you reach that nobody actually holds, with a one-clause diagnosis (incoherent / unattractive / just unexplored), and any two leaves the quiz can't seperate — my suspicion is that quasi-realism and straight realism are indistinguishable by any question about embeddings, and I want to know if you think that's right.

  Format: exactly five numbered items, one per question, no introduction and no closing summary — each item is the question, the answer options, and where each option lands you, kept to a sentence or two of actual prose apiece. And in whichever of the five you're least sure of yourself, say so and say why; I'd rather see the soft spot than a uniformly confident instrument.
reasoning: |-
  Okay, the user runs a metaethics reading group focusing on the Frege-Geach problem and wants a five-question quiz to help members identify their actual positions based on embedding cases. They've highlighted specific requirements: must cover negation conflict and cross-domain comparisons (especially modals), force certain often-skipped discussions, reach all key theoretical leaves (expressivism, quasi-realism, cognitivism etc.), and flag indistinguishable positions or incoherent paths.  

  First, I need to map the core embedding data everyone agrees on: moral sentences retain sense in conditionals, negation, questions, and attitude reports, and arguments like modus ponens with moral premises feel valid. The quiz must start from this baseline.  

  For negation (their emphasized gap), I'll design a question forcing a choice about where conflict resides when one says "lying is wrong" and another denies it. Options should pit attitude vs. content conflict, with "nowhere" as an error-theoretic escape. This blocks their group’s usual dodge.  

  Cross-domain comparison is trickier. They want to test if someone sees moral and modal embeddings as analogous or distinct. I’ll craft a question comparing "might" and "wrong" embeddings, probing whether the same solution applies. Expressivists might treat both as dynamic updates, while contextualists see modals as information-sensitive but morals as rigid—flagging where expressivism "breaks" per their note.  

  Structural priorities:  
  - Q1 should establish the core function of "wrong" (force vs. truth-aptness) to branch early into expressivist vs. cognitivist paths.  
  - Q2 on negation conflict follows immediately—it’s their sore spot.  
  - Q3 tackles cross-domain analogy.  
  - Q4 probes validity foundations (truth-preservation vs. attitude coherence).  
  - Q5 handles compositional machinery (possible worlds, attitudinal logic, etc.) to separate quasi-realism from realism and hybrid views.  

  Key traps to avoid:  
  - Quasi-realism and realism might be indistinguishable if both endorse truth-aptness and content conflict. I’ll add a marker in Q5 where quasi-realists must appeal to "attitude-tracking" properties to mimic realism, exposing the veneer.  
  - Force-only views (pure expressivism) should crumble at Q2 when negation forces conflict explanation.  
  - Inferentialism gets a path via Q4 (validity as constitutive) and Q5 (no hidden structure).  

  For the "least sure" admission (their request): Q3’s modal-moral analogy feels shaky. Some sophisticated relativists might blur the lines I’ve drawn, and "information-sensitive" could be ambiguous. I’ll confess that in the answer.  

  Finally, I’ll note incoherent paths: e.g., claiming "wrong" is purely force-inducing (Q1) but also positing content conflict (Q2). And unattractive options like error theory denying all commitment in embeddings.
answer: |-
  Here's a five-question sorting instrument designed to force the distinctions you need, starting from embedding data and ending at theoretical leaves. Each question targets core commitments revealed by specific embedding behavior.

  1.  **What is the primary function of an utterance like "Lying is wrong" when used in isolation?**
      *   **A. To express a non-cognitive attitude (e.g., disapproval of lying).** → *Leads to Expressivist Path (Q2)*
      *   **B. To represent how things are in the world (i.e., to state a fact about lying's wrongness).** → *Leads to Cognitivist Path (Q2)*
      *   **C. To simultaneously express an attitude *and* represent a fact (or something fact-like).** → *Leads to Hybrid Path (Q2)*

  2.  **When Person A says "Lying is wrong" and Person B says "Lying is not wrong," where does the conflict between them reside?**
      *   **A. Primarily in their expressed attitudes (A disapproves, B does not disapprove, or disapproves of the opposite).** → *Leads to Expressivist/Hybrid Path (Q3)* (Indicates conflict is fundamentally attitudinal)
      *   **B. Primarily in the propositions expressed (A asserts P, B asserts ~P; they cannot both be true).** → *Leads to Cognitivist Path (Q3)* (Indicates conflict is representational/factual)
      *   **C. There is no genuine conflict in commitment; one or both utterances lack assertive/committal force.** → *Leads to Error Theory/Fictionalism Path (Q5)*

  3.  **How do the embedding behaviors of moral terms (e.g., "wrong") compare to those of epistemic modals (e.g., "might")?**
      *   **A. They are deeply analogous; the same kind of semantic/pragmatic machinery (e.g., context/information-state sensitivity, dynamic update functions) best explains both.** → *Leads to Dynamic/Parameter Path (Q4)* (Suggests unified solution)
      *   **B. They are superficially similar but fundamentally different; modals *are* explained by context/information-state parameters, but morals *cannot* be fully explained this way without losing their essential action-guiding/normative force.** → *Leads to Expressivist Path (Q4)* (Breaks analogy where expressivism "breaks")
      *   **C. They are distinct phenomena; morals describe robust, stance-independent properties/facts, while modals describe information-relative possibilities.** → *Leads to Cognitivist Path (Q4)*
      *   **D. The similarity is misleading; both might be handled by inferential/constitutive norms, not parameter sensitivity.** → *Leads to Inferentialist Path (Q5)*

  4.  **What is the foundation for the validity of modus ponens using moral premises (e.g., 'Lying is wrong. If lying is wrong, telling children to lie is wrong. Therefore, telling children to lie is wrong.')?**
      *   **A. Truth preservation: the truth of the premises guarantees the truth of the conclusion.** → *Leads to Cognitivist/Quasi-Realist Path (Q5)*
      *   **B. Consistency of attitudes: accepting the premises while rejecting the conclusion manifests an inconsistency in the attitudes expressed/committed to.** → *Leads to Expressivist/Attitude Logic Path (Q5)*
      *   **C. Semantic composition rules: the meaning of the logical operators and the moral term combine predictably (e.g., possible worlds, attitudinal objects).** → *Leads to Structured Content Path (Q5)*
      *   **D. Constitutive norms of language use: validity is defined by the inferential roles constitutive of the meanings involved.** → *Leads to Inferentialist Path (Q5)*

  5.  **What kind of 'thing' does the embedded clause "that lying is wrong" refer to or express? (What is its compositional value?)**
      *   **A. A proposition, representable as a set of possible worlds (or similar truth-conditional content).** → *Leaf: **Cognitivism** (Standard Realism)* (Assumes truth-apt, representational content)
      *   **B. A proposition, but one tracking stance-dependent properties or attitudes.** → *Leaf: **Quasi-Realism** (Creeping Minimalism)* (Mimics truth-apt content but grounds it in attitudes)
      *   **C. An attitude (e.g., disapproval) or a type of mental state.** → *Leaf: **Force-Only Expressivism / Pure Attitudinalism*** (Rejects standard propositional content)
      *   **D. A complex attitudinal state with logical structure (e.g., disapproval of lying *in all contexts*).** → *Leaf: **Structured Attitude Logic*** (Content is the structured attitude type)
      *   **E. A property (e.g., wrongness) or state of affairs.** → *Leaf: **Cognitivism** (Robust Realism)* (Often paired with A, but emphasizes metaphysics)
      *   **F. A 'belief' component expressing a descriptive property *and* a desire-like component.** → *Leaf: **Hybrid Expressivism*** (Clause expresses a belief, unembedded use adds desire)
      *   **G. A node in an inferential network; its identity is its role in valid inferences.** → *Leaf: **Inferentialism / Conceptual Role Semantics*** (Puzzle evaporates via role definition)
      *   **H. A pretended or fictional proposition, lacking genuine truth conditions.** → *Leaf: **Error Theory / Fictionalism*** (Content is apparent, not real)

  **Forced Distinctions & Soft Spots:**
  *   **Negation Conflict:** Q2 directly forces the choice on where conflict lives (attitude, content, nowhere).
  *   **Cross-Domain Comparison:** Q3 forces a stance on the modal-moral analogy, isolating the expressivist break.
  *   **Indistinguishable Leaves:** Q5 options **A** (Cognitivism) and **B** (Quasi-Realism) *are* indistinguishable *by embedding behavior alone* – both treat the clause as a truth-apt proposition. The distinction is metaphysical/metasemantic (what *makes* it true or what it *represents*), not compositional/semantic at the embedding level. The quiz *cannot* separate them purely on embedding responses.
  *   **Incoherent Paths:** Selecting Q1A (Expressivist) then Q2B (Content Conflict) is incoherent – pure expressivism rejects the relevant notion of representational content conflict. Selecting Q1B/C (Cognitivist/Hybrid) then Q2C (No Commitment) is deeply unstable/unattractive.
  *   **Unattractive/Explored Paths:** Q5C (Pure Attitudinalism) struggles massively with complex embeddings like conditionals and questions – it's unattractive to many. Q5D (Structured Attitude Logic) is complex and less explored than other expressivist options.
  *   **Soft Spot:** I'm least sure about **Q3**. Distinguishing "deeply analogous" (A) from "superficially similar but fundamentally different" (B) hinges heavily on prior theoretical commitments about the nature of normativity vs. modality. Someone with a sophisticated contextualist view for morals *might* argue for A, while someone with a dynamic semantics for modals but not morals might argue for B, but the line feels blurrier than the options suggest. The "cannot be" in B is particularly strong.
