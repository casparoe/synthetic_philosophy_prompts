prompt: |-
  Right, I need a teaching plan and I want you to think hard about this rather than handing me the standard intro lecture. Take the role of someone who has taught Kant's transcendental arguments and the post-Kantian literature for years, including to audiences with zero philosophy background, and who knows exactly where the whole thing falls apart. Before you answer, brainstorm privately about what actually depends on what here, because the order matters more than anything else and I got it wrong the last time I tried.

  Context: I had a marathon argument with my friend Maya on Friday. She's a second-year cognitive science PhD student, sharp, and she thinks transcendental arguments are a con. Her case: (a) they're circular, you assume the very thing you're supposedly proving; (b) the most you ever get is that we can't help thinking in some way, which is a claim about our psychology and not about the world, so it's just a priori psychology, i.e. bad psychology; (c) the word "transcendental" is just "transcendent" in a nicer coat. I think (b) is the real threat and the other two are noise, but I couldn't say why in the moment and it's been bothering me since.

  Now the practical problem. In two weeks I have to teach this to twelve cog sci PhD students: smart, no Kant, no philosophy of mind beyond the pop-sci stuff, and all of them instinctive naturalists who will assume any a priori claim is either maths or wishful thinking. Fifty minutes, whiteboard. I don't want the explanation from you, I want the plan for the explanation.

  So: what has to come first for the idea to even land, and what depends on what. The one carrying example to build the session around. I was going to use the simulation hypothesis / brain-in-a-vat scenario, since they all know it, and frame the whole thing as "you can't even state the sceptical hypothesis without presupposing X" — but I suspect that's a trap that teaches them transcendental arguments are just anti-sceptical trickery. Tell me if it's the wrong example, and if so what the right kind of example has to have and what it has to lack. (Also, someone told me Putnam's brain-in-a-vat argument is itself classified as one of these, which makes me wonder whether using it as the teaching example is even coherent — clarify if you can.)

  Then the misconceptions they'll form, in the order they'll form them, including whether Maya's objection (b) will occur to them and at what point I should let it land versus head it off, and exactly where in the sequence I should deal with each. One more thing I want them to actually get, and I think it's the real crux: that the necessity being claimed here is neither causal nor analytic, and why that's not a dodge. Then the single question I can ask in the last five minutes that would show me whether the structure of the thing landed, rather than whether they can recite the jargon. And tell me what I should openly refuse to cover at this level and say so out loud. No reading lists or citations please, they won't read them and I can't stand the guessing game.
reasoning: |-
  Okay, let me tackle this user's query. They need a teaching plan for Kant's transcendental arguments aimed at cognitive science PhD students who are naturalists with no philosophy background. The main challenge is addressing Maya's objection that these arguments are circular, merely psychological, and that "transcendental" is just dressed-up "transcendent." The user wants to avoid standard intros and focus on the structure and dependencies.

  First, I need to establish a foundation without Kantian jargon. Starting with the simulation hypothesis might backfire since it's tied to skepticism, reinforcing the idea that transcendental arguments are just anti-skeptical tricks. Instead, a neutral example like spatial perception could work better. The example must show that certain conditions are necessary for experience itself, not just for knowledge.

  The user’s key insight is that the necessity in transcendental arguments isn't causal or analytic. This distinction is crucial. Cognitive science students might conflate causal necessity (like neural processes) with the constitutive necessity Kant proposes. The example should illustrate that without spatial relations, experience isn't just flawed—it's impossible.

  Maya’s objection (b) is the biggest threat: that transcendental arguments only reveal psychological necessities. To counter this, the teaching plan needs to clearly separate constitutive conditions of experience from empirical psychology. Emphasizing that these arguments are about the framework making experience possible, not contingent mental processes, is essential.

  The sequence matters. Starting with a relatable example (spatial perception), then dissecting its prerequisites, helps students see the necessity before introducing Kant's terms. Introducing the term "transcendental" only after establishing the concept prevents confusion with "transcendent." 

  Timing misconceptions is important. Students might first think it's circular when the necessary condition is introduced. Addressing this early by showing the condition isn't assumed but revealed through analysis can mitigate that. Objection (b) will likely arise when discussing necessity. Here, contrasting constitutive vs. causal necessity and using the spatial example to show it's about the structure of experience, not psychology, is key.

  The last question should test their grasp of the structure, not jargon. Asking them to identify the necessary condition in a new scenario, like social cognition needing other minds, can reveal if they understand the framework.

  Refusing to cover post-Kantian developments or detailed Kant exegesis keeps the session focused. Explicitly stating this avoids overwhelming them and maintains clarity on the core argument structure.
answer: |-
  Here’s the battle-tested teaching plan. The structure is everything—**misorder one step and the whole thing collapses into "a priori psychology" accusations**. I’ve taught this exact cohort; this sequence cuts through naturalist reflexes.

  **Core Objective:** Make them feel the *structural necessity* of transcendental conditions *before* naming "transcendental arguments." If you name it first, they file it under "philosophy magic."

  **The Anchor Example: SPATIAL PERCEPTION**  
  *Why not BIV?* Brain-in-a-vat triggers anti-skepticism reflexes. They’ll dismiss it as wordplay. Use an example that’s:  
  - **Universal** (not hypothetical)  
  - **Pre-Cognitive** (not about beliefs/truth)  
  - **Structurally Necessary** (not contingent)  
  - **Neutral** (not tied to skepticism/idealism)  

  **Whiteboard Flow & Timing:**  

  1.  **(3 min) GROUNDING: The Undeniable Starting Point**  
      *"Close your eyes. Imagine an object. Any object. Got it? Now—*could you experience that object *at all* if it had *no location* relative to you or other things? Not 'is it accurate?'—but is *any* experience of it even possible without *some* spatial relation?"*  
      *Board:* "Experience of Object X → MUST involve spatial relations (e.g., near/far, left/right, here/there)"  
      *Key:* Force them to admit *this isn't optional*. Not "we do it," but "it's impossible *not* to for any experience we can conceive."

  2.  **(10 min) REGRESS & NECESSITY: The "How Possible?" Shift**  
      *"Okay, spatial relations are baked into object experience. How is this *possible*? What has to be true for spatial experience to occur?"*  
      *Let them suggest causal/empirical answers:*  
      - "Eyes/brain process location data!" → *"Sure, but that explains *how brains implement it*. I'm asking: what must be the *structure of experience itself* for 'location' to be a meaningful feature *at all*?"*  
      - "Evolution made us spatial beings!" → *"That explains why we *have* this capacity. But does it explain the *inescapable necessity* of spatial framing for objects?"*  
      *Board:* Draw arrows back from "Experience of Objects" → "Requires Spatial Framework". Label the framework: **CONDITION OF POSSIBILITY**.  
      *Crucial Move:* "This isn't a *causal* necessity (like neurons firing). It's a *constitutive* necessity: remove it, and the experience *vanishes*, not just 'gets distorted.'"

  3.  **(5 min) NAME THE BEAST: "Transcendental" ≠ "Transcendent"**  
      *Only now introduce the term:*  
      *"This move—identifying the necessary conditions that must be in place *for* any experience (or knowledge) to be possible—is called a **transcendental argument**. 'Transcendental' means 'concerned with the *preconditions* of experience/knowledge.' It’s *not* claiming access to a 'transcendent' (beyond-experience) reality. It’s mapping the boundaries *of* experience itself."*  
      *Board:* **TRANSCENDENTAL**: Conditions for the possibility of X. ≠ TRANSCENDENT (outside all possible experience).

  4.  **(15 min) PRESSURE TESTING: Misconception Sequence**  
      *Address objections *in this order* as they arise (they will):*  
      - **"Circularity!" (Maya's a)**: *"Am I assuming spatial experience to prove spatial conditions? No. I start with *any conceivable object experience*. We analyze its *unavoidable structural features*. We don't assume the framework; we discover it as the only way to make sense of the experience having *this form*."*  
      - **"It's Just Psychology!" (Maya's b - THE KILLER)**: *"Is this saying 'humans are hardwired for space'? NO. That's empirical. This argues that *any possible experience of an object*—alien, AI, God—*must* involve spatial relations. It's about the *logic of what objecthood entails*, not human cognition. Psychology studies *how we instantiate* this; transcendental analysis asks *what makes it thinkable at all*."*  
      - **"So it's Analytic?"**: *"Is 'objects require space' like 'bachelors are unmarried'? NO! Analytic truths are true by definition. This is *synthetic*: we discover through analysis that *having an experience of an object* necessarily includes spatiality. You couldn't deduce it from the word 'object' alone."*  
      *Board:* "Necessity: **Constitutive** (Not Causal, Not Analytic)"

  5.  **(12 min) THE CRUX: Constitutive Necessity Demonstrated**  
      *Deep dive on why (b) fails:*  
      *"Try to *describe* an object experience with *no* spatial component. 'I see a cat... but it has no position, no size, no distance.' You haven't described an *experience*; you've described nonsense. Space isn't a *property we add* to objects; it's the framework *within which* objects appear. This isn't psychology—it's the **scaffolding of objectivity itself**. Psychology studies the *contents* within the scaffolding. Transcendental arguments study the scaffold."*  
      *Contrast:* "Causal necessity (brain states) tells *how* space is processed. Constitutive necessity tells *why* 'space' must be a category for *anything* to be an object *for* a subject."

  6.  **(5 min) FINAL PROBE QUESTION (The Litmus Test)**  
      *Don't ask for definitions. Ask for application:*  
      *"Imagine trying to have an experience of *simultaneous events*. What is a *necessary condition* for it to be possible to experience two things as happening *at the same time*? Not how the brain does it—what must be *structurally presupposed* for 'simultaneity' to be a meaningful concept within *any* possible experience? Discuss in pairs for 2 min, then shout out."*  
      *What you want:* They identify time as a unified framework/dimension ("temporal manifold"). If they say "neural sync" or "attention," they missed constitutive necessity. If they say "a concept of time," push: "Is the *concept* enough, or must experience itself have a temporal *structure*?"

  **What to Openly Refuse to Cover:**  
  *Say this upfront:* "In 50 minutes, we *cannot* cover:  
  1.  Kant’s full system (Categories, Phenomena/Noumena)  
  2.  Post-Kantian twists (Hegel, Strawson, etc.)  
  3.  Whether these arguments 'prove realism' or lead to idealism.  
  Today is *only* about the core logical move: identifying constitutive conditions of possibility. Master that, *then* we can debate where it leads."  

  **Why This Works for CogSci Naturalists:**  
  1.  Starts with a concrete, undeniable experiential fact (object awareness), not abstruse philosophy.  
  2.  Forces confrontation with necessity *before* labeling it, bypassing jargon filters.  
  3.  The spatial example is neutral ground—no skepticism/idealism baggage.  
  4.  **Decisively** separates constitutive necessity (the target) from causal/empirical necessity (their comfort zone) by making experience itself incoherent without the condition.  
  5.  The probe question uses *their* domain (temporal cognition) to test if they can apply the *structure*, not the jargon.  

  **On Putnam's BIV:** It *is* a transcendental argument ("intentionality presupposes external causal history"). But it's a *bad* teaching example because:  
  1.  It's meta (about representation/semantics), not basic experience.  
  2.  It *looks* like clever anti-skepticism, reinforcing (b).  
  3.  Its necessity is less viscerally obvious than space/time. Stick to perception.  

  Focus relentlessly on the **constitutive necessity** move. If they feel the force of "You literally *can't conceive* of an object without space," you've cracked Maya's (b) and laid the foundation. Good luck—it’s a tightrope, but this sequence gets them across.
