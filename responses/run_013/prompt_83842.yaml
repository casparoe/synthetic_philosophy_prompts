  I should start by listing possible readings from least to most radical. The trivial end might be denying logical necessity between distinct concepts. Then, moving to causal connections as not logical necessities. More substantive claims could be about nomic necessity not being metaphysical or the recombination of possibilities. Radical claims might assert that all necessary connections are mind-dependent or that laws supervene on non-modal facts.

