answer: |-
  ## Research Proposal: Augustine's Criterion of Lying and the Challenge of Paltering

  **1. The Question (approx. 150 words)**

  Does Augustine’s criterion for lying, centered on the *will to deceive* rather than the utterance's truth-value, consistently classify the phenomenon of "paltering" (using selectively arranged truths to create a false belief) as lying? This is not merely a semantic dispute about the word "lie." The answer tests the coherence and reach of Augustine’s ethical framework against a sophisticated form of deception prevalent in negotiation, politics, and everyday life. Resolving it determines whether Augustine offers a robust, action-guiding principle for navigating deceptive communication where literal falsehood is absent, or if his criterion falters precisely when confronting the complexities of truthful manipulation. The question's significance lies in its potential to reshape our understanding of Augustine’s ethics and challenge contemporary definitions of deception that prioritize falsity.

  **2. Why Current Positions Leave It Open (approx. 200 words)**

  Scholars generally agree Augustine defines lying by the *intent to deceive* ("duplicity of heart"), not the statement's falsity. His defenders emphasize his rigor, arguing he correctly condemns *all* intentional deception, even via true statements ("jocose lies," withholding context) or for good motives ("officious lies"). Critics counter that this makes his prohibition implausibly strict and fails to distinguish harmful deceit from benign or necessary misleading. Crucially, **existing treatments primarily test Augustine's criterion against two types of cases: (1) straightforward false statements made to deceive, and (2) admittedly deceptive true statements like ironic praise or misleading truths in extreme scenarios (e.g., misleading a murderer)**. Paltering, however, represents a distinct third category: meticulously truthful communication *engineered* to mislead. Neither defenders nor critics systematically apply Augustine's intent-focused criterion to this specific, nuanced practice. The gap lies precisely here: does the *specific mechanism* of using exclusively true propositions to generate a false impression fall under Augustine’s condemnation, or does the absence of a false utterance create a loophole his criterion cannot convincingly close? Current scholarship assumes his position but hasn't rigorously tested it against paltering's unique structure.

  **3. The Argument I Will Make (approx. 300 words)**

  I will argue that Augustine's criterion **does unequivocally classify paltering as lying** and that this reveals a significant flaw in definitions requiring a false statement. Augustine locates the essence of lying in the *will to induce false belief in the listener's mind* ("mendacium est enuntiatio cum voluntate falsum enuntiandi" - an utterance with the will to utter falsehood *to the hearer*). Paltering perfectly embodies this "duplicity of heart." The palterer *intends* the interlocutor to form a specific false belief and deliberately crafts their truthful utterances to achieve this result. The truth-value of the individual statements is irrelevant to the *deceptive intent governing their selection and presentation*. Augustine’s focus on the *effect* the speaker wills upon the hearer's understanding captures the wrong of paltering far more accurately than definitions fixated on utterance falsity.

  The **strongest objection** is that paltering involves *only* truthful assertions, and Augustine himself distinguishes between lying and merely hiding the truth (e.g., in *De Mendacio*). The objector might argue that paltering is sophisticated truth-hiding or permissible reticence, not lying. My response is twofold: (1) Augustine condemns *any* speech act *aimed at* deception, regardless of the truth of the components, as shown by his treatment of deceptive truths; and (2) Paltering is not passive silence or simple omission; it is the *active, instrumental use* of truthful speech *as a means* to implant a falsehood. This active instrumentalization of truth for deception is the core of the "duplicity" Augustine condemns. The falsity condition obscures this core wrong by focusing on the wrong aspect (the utterance) instead of the intention and the intended effect (the false belief).

  **4. Method and Schedule (approx. 250 words)**

  *   **Month 1: Reconstructing the Augustinian Criterion:** Conduct a close, systematic reading of Augustine’s key texts on lying (*De Mendacio*, *Contra Mendacium*, relevant passages from *De Doctrina Christiana* and *Enchiridion*). Focus solely on extracting his core definition, the rationale for prioritizing intent, and his reasoning for condemning deceptive truths. Output: A precise articulation of the "duplicity of heart" criterion and its scope based solely on Augustine's arguments.
  *   **Month 2: Building the Taxonomy of Deceptive Speech:** Develop a structured typology of cases involving deception, clearly distinguishing: (A) Standard lies (false statement, intent to deceive), (B) Augustine's "problematic truths" (true statement, clear intent to deceive - e.g., misleading the murderer), (C) Paltering (multiple true statements, selective presentation, intent to create a specific false belief), and (D) Permissible Non-Disclosure (withholding truth without active intent to create a *false* belief). Identify potential boundary cases within paltering.
  *   **Month 3: Testing Against Hard Cases:** Apply the reconstructed Augustinian criterion rigorously to paltering and the boundary cases identified in Month 2. Key hard cases include:
      *   *The Resume Gap:* Omitting a short, irrelevant job by extending dates elsewhere (truthful statements creating false impression of continuous employment).
      *   *The Negotiation Ploy:* Answering "Our best price is $X" truthfully (it is the best price *you're willing to give them*), knowing it implies "We cannot go lower" (which is false).
      *   *The Damning Truth:* Revealing one true, negative fact about a rival while withholding numerous positive truths, intending to damn their reputation.
  *   **Month 4: Interpretation & Conceptual Synthesis:** Analyze the results of the testing phase. Does the criterion consistently categorize paltering as lying? Where does it strain? Refine the interpretation of "duplicity of heart" based on these findings. Articulate the implications for the insufficiency of the falsity condition.

  **5. Result and Failure (approx. 200 words)**

  A successful result is a **definitive demonstration that Augustine’s criterion consistently classifies core instances of paltering as lying**, grounded in textual analysis and case testing. This would manifest as a clearly argued paper showing how paltering exemplifies Augustinian "duplicity," highlighting the consequent problem for falsity-based definitions, and resolving the key objection concerning truth-hiding versus lying. **Failure** would occur in one of two specific ways: (1) **Interpretive Failure:** If close textual analysis reveals Augustine *explicitly* excludes truthful-but-deceptive speech acts lacking a single false assertion from his definition of lying, even when intended to deceive. (2) **Conceptual Collapse:** If applying the criterion to paltering and boundary cases leads to inconsistent, unintuitive, or self-contradictory judgments that cannot be resolved without abandoning the core principle or stretching it beyond recognition (e.g., if it becomes impossible to distinguish paltering from permissible non-deceptive omission using his terms). Success proves the criterion's reach; failure reveals its limitations or misapplication to this phenomenon.

  **6. Scope and Risks (approx. 150 words)**

  This is a focused, semester-sized project because it centers on applying *one specific Augustinian criterion* to *one specific modern concept* (paltering). **The primary risk of scope creep** lies in expanding into a full comparative analysis of all deception theories or a comprehensive study of Augustine's entire ethics of speech. **To stay on track, I will strictly limit comparative analysis** to demonstrating the insufficiency of the falsity condition, not exhaustively engaging all modern lying definitions. **The part most vulnerable to cutting if time runs short is the detailed analysis of the *very finest* boundary cases** within paltering (e.g., degrees of selectivity, audience knowledge assumptions). Focusing on clear, paradigmatic examples of paltering versus clear non-deceptive withholding will be prioritized. The honest risk is that the textual analysis (Month 1) might reveal greater ambiguity in Augustine than anticipated; if so, I will rigorously document that ambiguity as a finding rather than force a resolution.**
