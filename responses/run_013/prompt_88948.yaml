prompt: |-
  I'm in a reading group thats been going at the "why are some countries rich and others poor" question for months now, and we've basically split into two camps that keep talking past each other. One camp says it's institutions -- the rules, property rights, constraints on the executive, the way colonial powers set up extractive versus inclusive arrangements -- and they point to things like the fact that former colonies that were rich in 1500 are often poor now, or the settler-mortality story where the places Europeans died in droves ended up with plunder institutions instead of settlement ones. The other camp says all of that is downstream of geography and environment: disease, soils, access to trade routes, climate, the tropics versus the temperate zones, and that the institutions crowd is just reading causation into a correlation. Then there's a third faction mumbling about culture that neither side really takes seriously, which probably says something about the debate.

  What I want is the document these people should have written instead of argueing for a year: an adversarial collaboration. So give me a numbered list of claims both camps can actually sign -- what's agreed on the facts (income gaps are enormous and old, productivity and technology are the proximate causes, the divergence is recent in the scheme of things) and what's agreed to be the real puzzle. Then a disagreements section, where for each side you state the position in wording that side itself would accept, not a strawman version. Then the cruxes: the sub-questions where settling one would actually move somebody. My guesses -- and push back if I'm wrong -- are that one is whether the historical instruments (settler mortality, the timing of colonization) are valid, another is whether geography works through institutions or around them, and a third is whether "institutions" is even one thing or several (property rights vs. state capacity vs. constraints on rulers) and whether thats why the thing never resolves. For each crux, give me a test or case both sides would agree bears on it -- a natural experiment like the two Koreas, the division of Germany, a resource discovery, the post-1990 transitions -- and write down in advance what each side predicts about it, so we can't move the goalposts later. And if part of the fight turns out to be about words rather than the world, say which part and why. Please don't send me a reading list or citations, I can't look anything up right now, I just want the document itself.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're part of a reading group stuck in a debate between institutional and geographical explanations for wealth disparities. The user wants an adversarial collaboration document that outlines agreed facts, key disagreements, and testable cruxes. 

  Hmm, the user mentions three factions: institutions, geography, and a sidelined cultural argument. They’re frustrated with the circular debate and want a structured way to move forward. The real need here isn’t just a summary—it’s a framework to break the deadlock. 

  First, I need to establish common ground. Both sides agree on the magnitude of income gaps, the role of tech/productivity, and the Great Divergence timing. That’s straightforward. The disagreements section is trickier—I must present each camp’s view without strawmanning. For institutions, it’s about path-dependent rules; for geography, it’s direct constraints and indirect institutional shaping. 

  The cruxes are where it gets interesting. The user suggested settler mortality validity, geography’s pathway, and institutions’ granularity. I’ll add Botswana as a natural experiment since both sides use it. For each crux, I’ll propose a test and predictions. For example, settler mortality’s validity could be tested via malaria genetics; if pre-colonial development correlates, it challenges the institutional narrative. 

  I wonder if the user’s group has considered how "institutions" is defined. Splitting it into property rights, state capacity, and constraints might reveal they’re arguing past each other. Same for geography—direct vs. institutional effects. The Korea/Germany cases are classic, but I should emphasize pre/post outcomes to avoid goalpost-shifting. 

  The meta-disagreement about "institutions" as a catch-all term is crucial. If both camps disentangle it, they might find overlapping mechanisms. The document’s goal is to force specificity in arguments. No citations—just clear, testable claims. This should give the group concrete talking points beyond rehashing old papers.
answer: |-
  Here’s the adversarial collaboration document your reading group needs, structured to force engagement with substance instead of rhetoric:

  ### **Adversarial Collaboration: Wealth Disparities Between Nations**  
  *Jointly Signed by Representatives of the Institutional and Geographic Camps*

  ---

  ### **I. Agreed Facts & Baseline Consensus**  
  1. **The Gap is Extreme & Persistent**: Income disparities between the richest and poorest nations are orders of magnitude apart (e.g., 50:1), and these gaps have endured for centuries.  
  2. **Proximate Cause is Productivity**: Differences in output per worker (driven by technology, human capital, and capital intensity) account for *most* current income variation.  
  3. **The "Great Divergence" is Recent**: Global inequality surged post-1800; in 1500, gaps were modest (e.g., 2:1).  
  4. **No Mono-Causal Explanation**: Neither institutions nor geography *alone* explains all cases (e.g., Botswana vs. Congo; Switzerland vs. landlocked tropics).  
  5. **Colonialism Matters**: Colonial legacies (extractive/settler models) correlate with modern outcomes, but *why* they emerged is contested.  

  ### **II. Agreed Core Puzzle**  
  "Why did sustained, productivity-enhancing economic growth emerge in some societies after 1800 but fail to diffuse globally, despite known technologies and capital flows?"  

  ---

  ### **III. Key Disagreements (Stated in Each Camp’s Own Terms)**  
  **A. Institutionalist Position (as self-described):**  
  *"Persistent growth requires 'inclusive economic institutions' (secure property rights, unbiased rule of law, open markets, constraints on elites). These emerge from historical 'critical junctures' (e.g., colonial initial conditions, revolutions) that shift political power toward broad coalitions. Geography matters only insofar as it shapes these junctures (e.g., settler mortality → extractive institutions). Once established, inclusive institutions are self-reinforcing."*  

  **B. Geographic Position (as self-described):**  
  *"Fundamental geographic factors (disease burden, agricultural productivity, resource endowments, transportation costs, climate) directly constrain production *and* indirectly shape long-run institutional development. Tropics face higher disease, lower soil fertility, and higher energy costs, hindering surplus accumulation. Favorable geography enabled early agricultural surplus, state formation, and later industrialization in temperate zones. Institutions are adaptive responses, not prime movers."*  

  **C. The "Mumbling" Culture Camp (Neutral Summary):**  
  *"Shared beliefs (work ethic, trust, innovation tolerance) influence economic behavior. These may stem from historical institutions/geography but can acquire independent persistence. Hard to measure, often endogenous."*  

  ---

  ### **IV. The Cruxes: Tests to Resolve Key Disagreements**  
  *Each test includes:*  
  - **The Crux Question**  
  - **Natural Experiment/Case**  
  - **Institutionalist Prediction**  
  - **Geographicist Prediction**  
  - **Goalpost-Anchor**: What outcome would shift views?  

  **Crux 1: Are Historical Instruments (e.g., Settler Mortality) Valid Proxies for *Exogenous* Institutional Shocks?**  
  - **Test Case**: **Malaria Ecology vs. Pre-Colonial Development**. Compare regions with similar *pre-colonial* complexity (e.g., Yorubaland, Igboland in W. Africa) exposed to differing colonial paths.  
  - **Inst. Prediction**: Within similar pre-colonial zones, areas with higher colonial-era mortality developed worse institutions *regardless* of local geography.  
  - **Geo. Prediction**: Pre-colonial development *itself* correlated with geography (e.g., soil, disease); colonial mortality tracks geography, not random shock.  
  - **Goalpost-Anchor**: If regions with identical pre-colonial development and geography had divergent colonial institutions *based solely on random mortality events*, institutions win. If not, geography explains both.  

  **Crux 2: Does Geography Work PRIMARILY Through Institutions or Independently?**  
  - **Test Case**: **Post-1990 Transitions** (e.g., Georgia vs. Guatemala). Both mountainous, mid-latitude, with similar 1990 GDP. Implement starkly different institutions.  
  - **Inst. Prediction**: Georgia (rapid pro-market reforms, anti-corruption) outgrows Guatemala (weak reforms) *despite* similar geography.  
  - **Geo. Prediction**: Growth converges long-term due to shared geographic constraints (e.g., landlocked, earthquake risk); institutional differences fade.  
  - **Goalpost-Anchor**: If Georgia sustains >2% annual growth advantage over Guatemala for 30 years, institutions dominate. If gap narrows/vanishes, geography binds.  

  **Crux 3: Are "Institutions" a Monolith or Separable Factors?**  
  - **Test Case**: **North vs. South Korea / West vs. East Germany**. Same culture, geography, colonial history. Divergent *institutions* imposed exogenously.  
  - **Inst. Prediction**: South Korea/W. Germany thrive due to property rights + market competition; North/East stagnate under state control.  
  - **Geo. Prediction**: South Korea has better ports/temperate climate than North; W. Germany has Rhine access vs. landlocked East. Geography explains *within*-divergence.  
  - **Goalpost-Anchor**: If *all* institutional factors (property rights, state capacity, constraints) move together and explain *all* the gap, monolith holds. If geography explains residual gaps (e.g., coastal South vs. mountainous North), institutions are separable/partial.  

  **Crux 4: Can Geography Overcome "Bad" Institutions?**  
  - **Test Case**: **Resource Discoveries** (e.g., Norway vs. Equatorial Guinea). Massive exogenous resource wealth under different initial institutions.  
  - **Inst. Prediction**: Norway (strong pre-existing institutions) invests in society; Equatorial Guinea (weak institutions) sees elite capture, no growth.  
  - **Geo. Prediction**: Norway’s ice-free ports/cold climate lower disease, enabling efficient resource use; Guinea’s tropics hinder capital accumulation regardless of institutions.  
  - **Goalpost-Anchor**: If Norway’s GDP growth exceeds Guinea’s by the *institutional gap’s predicted margin*, institutions rule. If Guinea grows *faster* than its institutional peers (e.g., Chad) solely due to oil, geography mitigates bad institutions.  

  ---

  ### **V. The Meta-Disagreement: Words vs. World**  
  **The "Institutions" Trap**:  
  - **Problem**: "Institutions" is often used ambiguously. Does it mean:  
    a) *De jure rules* (laws on paper)?  
    b) *De facto enforcement* (how rules work in practice)?  
    c) *Political power structures* (who writes the rules)?  
  - **Why it Matters**: Geographicists argue (b) and (c) are *shaped* by geography. Institutionalists argue (a) can reshape (b) and (c). **Solution**: Specify which layer is being debated in each claim.  

  **The "Geography" Trap**:  
  - **Problem**: Is geography:  
    a) *Static* (latitude, soil)?  
    b) *Dynamic* (disease conquerable by tech)?  
    c) *Institutionally mediated* (trade routes matter only with open markets)?  
  - **Why it Matters**: Institutionalists concede *static* geography but argue *dynamic* factors are institutionally determined. **Solution**: Accept that "geography" has fixed and mutable components.  

  ---

  **How to Use This Document**:  
  1. **For each crux**, agree *now* on the case, predictions, and goalpost-anchor.  
  2. **Collect data** jointly (e.g., 30-year growth in Georgia/Guatemala; pre-colonial development indices).  
  3. **Update**: If a prediction fails, the losing camp must concede that point *or* propose a new test.  
  4. **Engage the "Mumblers"**: Ask them to predict cultural change (e.g., trust surveys in Koreas) using this framework.  

  This forces the debate onto *testable mechanisms* instead of grand narratives. If you run this rigorously, your group will either converge or pinpoint the irreducible philosophical split. Good luck!
