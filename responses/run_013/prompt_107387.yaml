prompt: |-
  I'm a hospice volunteer, and I also just read a book about medical ethics that left me more confussed than when I started, so fair warning that this may be a naive question. Here's a pattern I keep bumping into and I don't know if it has a name.

  There's a man on our unit with fairly advanced dementia. Years before any symptoms, he wrote down that if he ever got like that he did not want to be kept going — no feeding tube, no antibiotics for a pneumonia, none of it. Now he's here, and honestly he's happy. He likes the music therapy, he asks for ice cream, he says he wants to see his granddaughter graduate. The family and the doctors are going with the piece of paper. Then there's a friend of mine who promised a kidney to her college roommate back when they were twenty-two and inseparable; twenty-five years later she's backing out, and everyone, including the roommate, agrees that's completely her right, no question about it. And then a third case, a woman who wrote her advance directive as a committed atheist and has since become devout, and now wants everything done; the team genuinely can't tell which self to listen to.

  What I keep noticing is that we treat an old statement as binding on a person exactly when we suspect the person in front of us isn't really the author of their current wants — and we let the old statement go when the change looks like ordinary growth or a change of heart. The earlier self wins, in other words, not because earlier is wiser, but almost as a penalty for the later self failing some test of being a genuine agent. Is there a name for that specific configuration? I don't mean the general practice of honoring advance directives — I mean this conditional structure, where the past self's authority seems to be derived from a judgment that the present self is no longer a proper author. I know there's the Ulysses-and-the-mast thing and a lot about promises and personal identity over time, and I have a feeling the answer will be "this is just X, go read Y," but X never quite fits, because Ulysses was competent the whole time and could feel the ropes, and a promise is made to other people, whereas this man's directive is made to himself. If there's no name, could you coin one and then tell me exactly where the edges are — what it is, what it isn't, and how it differs from the nearest things? I'd much rather understand the shape of it than get a label.
reasoning: |-
  Okay, the user is a hospice volunteer who's grappling with some complex ethical dilemmas after reading a book on medical ethics. They've presented three distinct cases that highlight a pattern: how past statements (like advance directives) are honored based on whether the present self is deemed competent. The user wants to know if there's a name for this conditional structure where the past self's authority overrides the present self when the latter is seen as compromised.

  First, I need to unpack their examples. The dementia patient wrote a directive to refuse treatment but is now happy and expressing desires. The family and doctors are following the directive, essentially prioritizing the past self. The second case involves a friend backing out of a kidney donation promise, which everyone accepts, showing that a change of mind is respected when the person is competent. The third is a woman who changed from atheist to devout and now wants aggressive treatment, creating confusion about which self to heed.

  The user's core observation is that we bind a person to their past self when the present self is judged as not fully autonomous—like due to dementia. But when the change seems like normal growth or a genuine shift, we allow it. They note that the past self wins not because it's wiser, but as a penalty for the present self failing some test of agency. They’re looking for a term or concept that captures this specific dynamic, distinguishing it from things like Ulysses contracts (where competence is present) or promises (which involve others).

  I recall that in bioethics, advance directives are typically honored under the principle of precedent autonomy, but that doesn't quite address the conditional aspect the user is pointing out. The key here is the assessment of the current self's competence. When the present self is deemed incompetent, we default to the past self's wishes. When competent, we allow changes. This ties into theories of personal identity and autonomy over time.

  Philosophers like Derek Parfit and Ronald Dworkin have discussed similar ideas. Parfit's reductionist view might see the demented patient as a different person, justifying following the directive. Dworkin's distinction between critical and experiential interests is relevant too—critical interests (deep values) vs. experiential ones (current desires). In dementia, we prioritize critical interests from the past over present experiential ones because the person can no longer form deep values.

  But the user wants to know if there's a specific term for this conditional structure. I'm not sure there's a single term, but phrases like "agential discontinuity" or "competence-contingent precedent autonomy" come to mind. The mechanism hinges on an implicit judgment that the present self lacks full agency, making the past self the last "true" author.

  I should also address the nuances the user raised. Ulysses contracts are different because the person is competent during binding and suffering; here, the dementia patient isn't experiencing distress. Promises involve obligations to others, whereas advance directives are self-regarding. The user might be seeking validation of their insight and deeper understanding of the ethical landscape.

  Their unspoken needs might include reassurance that their observations are valid and guidance on navigating these dilemmas in hospice care. They might feel conflicted seeing patients like the happy dementia patient whose directive prevents treatment. Providing clarity on the ethical framework could help them cope and make sense of their experiences.
answer: |-
  What you're describing is a profound and unsettling pattern at the intersection of autonomy, personal identity, and competence. You've pinpointed a core tension beautifully: **the binding power of the past self is inversely proportional to our assessment of the present self's capacity for authentic authorship.** There isn't one universally accepted term, but the constellation of concepts it touches upon is rich and actively debated. Let's break it down:

  1.  **The Core Mechanism You Described:**
      *   **Trigger:** A prior expressed wish (directive, promise, value statement).
      *   **Condition:** An assessment of the *current self's* capacity for rational, values-based decision-making ("genuine agency").
      *   **Action:** *If* the current self is judged to lack sufficient capacity (e.g., due to dementia, severe mental illness, intoxication), the prior wish is binding.
      *   **Action:** *If* the current self is judged to possess sufficient capacity (e.g., "ordinary growth," "change of heart"), the prior wish can be overridden.

  2.  **Why This Isn't *Just* Precedent Autonomy:**
      Precedent Autonomy is the principle that we should respect a person's past competent decisions about their future care. But your observation highlights its *conditional application*:
      *   **The Binding Isn't Absolute:** Precedent autonomy *assumes* the prior self's wishes should govern. Your cases show they *only* govern when the present self is seen as compromised. Your friend backing out of the kidney promise demonstrates precedent autonomy *yielding* to present autonomy because the present self is deemed competent.
      *   **The Judgment is Key:** The crucial, often implicit, step is the *judgment about the present self's agency*. This judgment determines whether the past self "wins" or not. It's this judgment that feels like a "penalty" for failing a "test of being a genuine agent."

  3.  **Why This Isn't *Just* a Ulysses Contract:**
      Ulysses Contracts (named after tying himself to the mast) involve a *competent* person anticipating a future state of *temporary* compromised judgment (e.g., mania) and *requesting constraint* during that state. Key differences:
      *   **Awareness & Temporality:** Ulysses *foresaw* the siren's call *while competent* and requested restraint *during* the anticipated compromised state. Your dementia patient *didn't* anticipate being happy; he anticipated suffering and wanted release. He isn't currently *feeling* the "siren call" (suffering) he feared; he's experiencing unexpected contentment.
      *   **Enduring vs. Temporary:** Ulysses contracts typically anticipate a temporary lapse. Dementia involves a progressive, often permanent, loss of the capacity that underpinned the prior wish.
      *   **The "Ropes":** In a Ulysses contract, the restraint is applied *because* the person is experiencing the anticipated compromised state *and* requested it. In your case, the "restraint" (withholding treatment) is applied *despite* the patient expressing *contrary* desires *now*, *because* he's judged incapable of those desires being authentically "his."

  4.  **The Philosophical Anchors & Related Concepts:**
      *   **Dworkin's Critical vs. Experiential Interests:** Ronald Dworkin distinguished between **Critical Interests** (our deep, reflective values about what makes a good life) and **Experiential Interests** (our immediate desires and capacity for enjoyment). He argued that in dementia, we should prioritize the critical interests of the *formerly competent* person over the experiential interests of the *currently demented* person, precisely because the current self cannot form or hold critical interests. This directly underpins honoring the directive in your first case. The "test" the present self fails is the capacity for critical interests.
      *   **Parfit & Psychological Connectedness:** Derek Parfit questioned the idea of a "single self" persisting through time. He suggested we are chains of psychological connections (memories, values, intentions). When these connections become severely disrupted (e.g., advanced dementia), we might see the current individual as less "the same person" as the author of the directive. Honoring the directive becomes a way of respecting the *last clearly connected, autonomous person* in the chain. The "test" the present self fails is sufficient psychological connection to the past author.
      *   **Competence/Decision-Making Capacity:** This is the legal and ethical cornerstone. We only defer to precedent autonomy *if* the *current* individual lacks the capacity to make the specific decision at hand. The "test" is the medical/legal assessment of capacity (understanding, appreciation, reasoning, communication). Your kidney donor passes this test; your dementia patient fails it regarding complex life-sustaining treatment decisions.
      *   **Identity-Relative Moral Obligations:** Some argue our obligations are to the specific "person-stage." If the dementia patient is a *different* person-stage than the author, perhaps the directive doesn't bind him. However, society and law generally lean towards continuity unless the break is profound.

  5.  **Naming the Configuration:**
      Given the above, the most precise way to describe the specific conditional structure you identified is:

      **Competence-Contingent Precedent Autonomy**

      Or, highlighting the judgment of agency:

      **Agency-Dependent Deference to Prior Self**

      To capture the "penalty" aspect (though this is more interpretive):

      **The Authorial Succession Principle:** Where authority reverts to the last demonstrably competent "author" of the self when the current occupant is deemed incapable of authentic authorship.

  6.  **Defining the Edges:**
      *   **What it IS:**
          *   A decision-making framework applied when a person's current capacity is impaired.
          *   It prioritizes a past competent expression of will *over* current expressed desires *because* those current desires are judged non-autonomous.
          *   It rests on assessments of current decision-making capacity and philosophical views about identity/enduring interests.
          *   It applies primarily to self-regarding decisions (like medical treatment) where the prior self aimed to bind the future self.
      *   **What it ISN'T:**
          *   A general rule that past statements always bind (your kidney promise case).
          *   A rule that earlier wishes are always wiser (it's about capacity, not wisdom).
          *   Primarily about promises *to others* (those involve distinct obligations; backing out might be permissible but still a broken promise).
          *   A Ulysses contract (which involves anticipating *and requesting constraint during* a future compromised state).
          *   Simply following a patient's "known values" if they are currently competent to reassess them (your atheist/devout case highlights this ambiguity).
      *   **The Fuzzy Boundary (Your Atheist/Devout Case):**
          This is the hardest edge. Here, the present self *is* competent. The question isn't "can she decide now?" but "which set of values is *authentically hers*?" Does her conversion represent a profound shift in critical interests (respect current self) or is she temporarily swayed by fear/community pressure (potentially undermining true autonomy)? There's no easy test. Ethically:
          *   *Strong Precedent Autonomy View:* The directive stands unless formally revoked *while competent*. Her current wish for everything might stem from fear, not a stable critical interest.
          *   *Current Autonomy View:* She is competent *now*. Her current wish, reflecting her current deeply held beliefs, should govern, even if it contradicts a past self. The prior directive is evidence, but not binding.
          *   *Practical Resolution:* Most ethics frameworks prioritize the *current* wishes of a *competent* patient. If she has the capacity to understand her situation and the implications of treatment choices *now*, her current wishes should prevail, even if they contradict her directive. The directive would be overridden *because she passes the test of current agency*. The team's confusion highlights the difficulty in assessing the depth and stability of a "change of heart" when core values shift dramatically.

  7.  **Why It Feels Unsettling:**
      You're absolutely right to feel the tension. We are effectively saying to the happy dementia patient enjoying ice cream: "The 'you' that is experiencing this joy and stating these desires isn't the 'real you' capable of making valid choices. The 'real you' who wrote that note years ago wanted this joy to stop, so we will stop it." It privileges the *memory* of the person over the *living presence* of the person, grounded in the belief that the living presence lacks the essential quality (authentic authorship) that made the remembered person morally sovereign. It's a necessary but deeply poignant ethical compromise to navigate the tragedy of lost capacity.

  **In essence:** You've identified the critical hinge point in applying precedent autonomy – the judgment of the present self's capacity. The past self only "wins" when the present self is deemed to have "lost" the essential faculty of authentic agency. This framework, while ethically necessary, inevitably involves profound and sometimes heartbreaking judgments about who "counts" as the author of a life at any given moment. Your work in hospice brings you face-to-face with this ambiguity in its rawest form. Keep wrestling with it – your insight is both keen and deeply humane.
