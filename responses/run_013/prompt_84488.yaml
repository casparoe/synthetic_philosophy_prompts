answer: |-
  Your colleague's argument is a sophisticated challenge, but it fails due to a critical error in its third premise. Let me reconstruct the argument clearly and show where it goes wrong, drawing on key distinctions in normative ethics:

  **The Argument Reconstructed:**
  1. An act is supererogatory only if it is **not morally required** (definitional).  
  2. If an act is not morally required, it is **permissible to omit it** (from deontic logic: ¬obligatory → permissible to omit).  
  3. If it is permissible to omit an act, then **there is no reason to perform it** (problematic premise).  
  4. If there is no reason to perform it, it **cannot be morally better** to perform it (from 3).  
  5. ∴ The concept of supererogation is incoherent (since supererogatory acts are *defined* as morally better yet non-obligatory).  

  **Where the Argument Fails: Premise 3**  
  The flaw lies in the leap from *"permissible to omit"* to *"no reason to perform."* This conflates two distinct normative categories:  
  - **Obligation vs. Reason-Giving Value**: Permissibility to omit entails the **absence of decisive obligation**, not the absence of *reasons favoring the act*. Supererogatory acts are *supported by strong moral reasons* (e.g., beneficence, compassion), even if those reasons don’t rise to the level of duty.  

  **Key Distinctions Clarified:**  
  | **Concept**          | **Moral Status**                          | **Example**                     |  
  |----------------------|------------------------------------------|---------------------------------|  
  | **Obligatory**       | Required; impermissible to omit          | Keeping promises                |  
  | **Supererogatory**   | *Non-obligatory* but *morally superior* | Donating a kidney to a stranger |  
  | **Permissible (Neutral)** | No strong reason to perform/omit       | Choosing vanilla over chocolate |  

  **Why Premise 3 is Mistaken:**  
  - **Reasons ≠ Obligations**: Moral reasons exist on a spectrum. An act can be:  
    - *Supported by strong reasons* yet not obligatory (e.g., heroic self-sacrifice).  
    - *Permissible to omit* because the cost to the agent is significant, even if the act has immense moral value.  
    - **Crucially**: "You may omit X" does *not* imply "There is no reason to do X." It implies only that reasons *favoring* X are *outweighed or excused* by other considerations (e.g., personal sacrifice).  

  **How Supererogation Survives:**  
  - **The "Moral Worth" Dimension**: Supererogatory acts possess *positive moral value* exceeding minimal duties. Their goodness stems from:  
    - **Agent-Relative Costs**: The sacrifice or effort involved excuses non-performance (J.O. Urmson's insight).  
    - **Asymmetric Value**: While omitting them is permissible (not blameworthy), performing them is praiseworthy (David Heyd’s distinction).  
  - **Reason Pluralism**: Moral reasons include:  
    - *Requiring reasons* (generate duties)  
    - *Justifying reasons* (defend acts beyond duty)  
    - *Enabling reasons* (allow praise without blame)  
    Supererogation relies on *justifying/enabling reasons* that do not create obligations.  

  **A Counterexample:**  
  Imagine a firefighter who *volunteers* to enter a collapsing building to save a child, risking their life.  
  - **Not obligatory**: Firefighters aren’t required to undertake near-certain death (permissible to omit).  
  - **Strong reasons to perform**: Saving a life, compassion, professional ideals.  
  - **Morally superior**: Performing it is *better* than mere duty (e.g., routine rescue), justifying praise.  
  → Premise 3 falsely claims "no reason to perform," but clearly, profound moral reasons exist.  

  **Your Colleague's Error in Context:**  
  The argument assumes a **monistic, obligation-centric ethics** (e.g., act consequentialism or rigid deontology). But supererogation is coherent precisely in pluralistic frameworks that:  
  1. Separate the *minimally decent* (duty) from the *ideally virtuous* (supererogation).  
  2. Recognize *agent-relative permissions* allowing self-interest to excuse non-heroism.  
  3. Acknowledge that *moral value* isn't binary (required/forbidden) but scalar.  

  **Conclusion:**  
  The concept of supererogation remains coherent. Your colleague's argument fails by collapsing the distinction between **permissibility of omission** and **absence of supporting reasons**. Supererogatory acts are *non-obligatory* due to their significant cost to the agent, yet *morally superior* because of the powerful reasons recommending them. Rejecting premise 3 preserves the logical space for actions that are praiseworthy but not required. If you lean toward accepting your colleague's view, I recommend engaging with J.O. Urmson’s "Saints and Heroes" (1958) or David Heyd’s *Supererogation* (1982) for robust defenses of the concept.
