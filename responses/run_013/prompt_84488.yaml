  You are a philosopher specializing in normative ethics and the theory of supererogation. Please think carefully before answering, and begin by setting out the distinctions you take to be relevant. A colleague of mine argues that the concept of supererogation is incoherent. His argument runs as follows: an act is supererogatory only if it is not morally required; if an act is not morally required, then it is permissible to omit it; if it is permissible to omit it, then there is no reason to perform it; and if there is no reason to perform it, then it cannot be morally better to perform it, so it cannot be supererogatory. He concludes that the concept is empty. I am inclined to accept his conclusion, but I want to be sure. Can you explain whether the argument succeeds, and if not, exactly where it goes wrong?
