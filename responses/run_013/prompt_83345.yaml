prompt: |-
  I'm a second-year PhD student in philosophy and our reading group on repugnant markets has me stuck on something. A friend sketched this argument and I cant find the bad step, even though I'm sure the conclusion is wrong. It runs:

  (1) An exchange is wrong only if it wrongs somebody: it harms a party, violates someone's rights, or isn't genuinely voluntary (coerced, uninformed, or made by someone who can't consent).
  (2) A voluntary exchange between two competent adults that leaves both of them better off and harms nobody else wrongs nobody.
  (3) Selling a kidney is voluntary, leaves the seller better off (cash) and the buyer better off (a kidney), and harms no third party.
  (4) The same holds for selling my vote, for paying a stranger to sit on a jury in my place, and for paying someone to argue my side in a fight with my partner.
  (5) So none of those are wrong in themselves. The revulsion is disgust, and disgust isn't an argument.
  (6) And in fact there's nothing you can't sell, so long as everyone says yes and nobody else gets hurt.

  I think (6) is false. I'm fairly sure selling my vote is wrong even if I'd have voted the same way anyway, and even if the buyer is a saint, and I don't think that's only because of some diffuse 'harm to democracy'. But every repair I reach for does something worse. The obvious repair is that some things are wrong because pricing them changes what they are: a citizen's judgement becomes a token, a body part becomes a spare, a juror's duty becomes a chore you can outsource. Then the repair eats itself, because by that test paying a nurse changes nursing (her motive is now the wage), paying a teacher changes teaching, paying a therapist changes therapy — and I will not say paid care is corrupt. It's work. A world where nobody is paid to care is worse, not purer. My friend even offered a sharper version of the repair: ask whether the good survives being done for the money. Paid jurors are fine, he says, because a juror paid by the court is still judging; but a vote cast for a price isn't a judgement at all, and neither is an expert who says whatever the person paying wants. Except we do pay expert witnesses, and lawyers argue for whoever hires them, and I think paid advocacy is fine, so now the sharp version condemns that too.

  So tell me which step to give up and what giving it up costs. If I keep (1) I need a wrong that isn't a harm and isn't 'corruption', or I need to show that corruption doesn't generalize to nursing and to advocacy. If I drop (1) I have to say what's wrong with the vote sale without it. I'd rather keep paid care and paid advocacy than keep (6), but I want to know exactly what I'm buying. And say whether the fix also has to let price gouging through, since thats the case I'm most sure is wrong. Don't just tell me it's complicated — point at the line and show me why it doesn't slide to wherever I happen to want it.
reasoning: |-
  Okay, let's tackle this philosophy problem. The user is a second-year PhD student in philosophy, part of a reading group on repugnant markets. They're stuck on an argument that concludes there's nothing inherently wrong with selling things like kidneys, votes, or jury duty, as long as the exchange is voluntary and harms no one. The user is convinced the conclusion is wrong but can't find the flaw. 

  First, I need to parse the argument step by step. The key premises are (1) and (2): an exchange is wrong only if it wrongs someone, and voluntary exchanges between competent adults that benefit both without harming others wrong no one. The examples in (3) and (4) seem to follow from this, leading to (5) and the sweeping (6). The user's main concern is that vote-selling feels inherently wrong, and they don't want to dismiss that as mere disgust.

  The user tried repairing the argument by suggesting that pricing certain things changes their nature—like turning a citizen's judgment into a token. But they rightly point out this would also condemn paid nursing or advocacy, which they don't want to do. Their friend's "sharp version" (whether the good survives being done for money) also fails because it might condemn paid expert witnesses or lawyers. 

  So where's the flaw? Premise (1) is too narrow. It assumes all wrongs must be direct wrongs to specific individuals—harms, rights violations, or involuntariness. But some wrongs are institutional or systemic. Selling a vote undermines the democratic process, which relies on votes reflecting judgment, not financial transactions. Even if no single person is harmed, the institution itself is corrupted. Similarly, paying for jury duty compromises the jury's role as an impartial body. 

  But why doesn't this apply to paid nurses or lawyers? Because the goods involved are different. Nursing and legal advocacy are services where payment doesn't inherently corrupt their purpose. A nurse's care remains care even when paid; a lawyer's advocacy is expected to be partisan. But a vote's entire purpose is to express civic judgment, and monetizing it destroys that function. The "type of good" matters—some goods are "market-inalienable" because their value depends on being outside market logic.

  The user also asked about price gouging. Price gouging wrongs people by exploiting vulnerability during emergencies, violating fairness norms. It's a direct harm, so it fits within premise (1)'s framework without needing systemic considerations. 

  The cost of rejecting premise (1) is accepting that some wrongs aren't about individual harm but institutional integrity. This doesn't devalue paid care work; it just recognizes that different goods have different relational structures. The fix avoids sliding into condemning paid advocacy because the corruption test must be context-specific—looking at what the good is for and whether money destroys its purpose. 

  The user needs to reject the narrow individualism of (1) and adopt a pluralist view of wrongs. This preserves their intuitions about vote-selling and jury duty without threatening paid care or advocacy. It's a defensible move in political philosophy, drawing on thinkers like Sandel or Satz. And it handles price gouging separately under existing harm principles.
answer: |-
  Let's cut to the chase: **The flaw is Premise (1).** It’s a false trichotomy. You’re right that (6) is indefensible, and your instincts about vote-selling and price gouging are sound. Here’s why (1) fails, what it costs to reject it, and how to handle the slippery slope:

  ### Why (1) is Wrong
  **(1) claims: An exchange is wrong *only* if it wrongs somebody (harms, violates rights, or isn’t voluntary).**  
  This ignores **structural, institutional, or relational wrongs**. Some exchanges undermine social practices or institutions in ways that *don’t reduce* to individual harm, rights violations, or involuntariness. The "wrong" is to the *integrity of a shared good*, not directly to a person.

  - **Vote-selling**: Democracy requires votes to express *judgment*, not market power. Selling your vote corrupts the practice of collective self-rule, even if it harms no specific individual. A vote cast for cash isn’t a "mistake" – it’s a category error.  
  - **Jury-buying**: A jury is meant to be a *representative, impartial* body. Paying a juror replaces civic duty with a hired service, undermining the court’s legitimacy.  
  - **Kidney sales**: While debatable, the concern is that markets in organs could commodify the human body in ways that erode social solidarity or exploit the poor – a *relational* harm, not individual.

  ### The Cost of Rejecting (1)
  You must accept that **some wrongs are institutional, not interpersonal**. This doesn’t require "corruption" in a vague sense, but a functional analysis:  
  - **What is the *purpose* of the good/institution?**  
  - **Does market exchange *destroy* or *degrade* its ability to serve that purpose?**  

  | **Exchange**       | **Purpose of the Good**          | **Does Money Destroy the Purpose?** |  
  |--------------------|----------------------------------|-------------------------------------|  
  | **Vote**           | Express civic judgment           | Yes – Money replaces judgment      |  
  | **Jury duty**      | Impartial civic deliberation     | Yes – Money replaces duty          |  
  | **Nursing care**   | Alleviate suffering/restore health| No – Money enables the service     |  
  | **Legal advocacy** | Ensure fair representation       | No – Money enables the service     |  
  | **Expert witness** | Provide informed testimony       | **Maybe** – *Depends on norms*     |  

  **Why paid advocacy survives:** Lawyers *are expected* to be partisan. Their role is structured around payment without undermining justice (e.g., ethics rules, cross-examination). But a *witness* paid to testify a specific way *does* corrupt the process – hence perjury laws and ethics rules against "hired guns."  

  ### Handling the Slippery Slopes
  1. **Paid care (nursing, therapy)**:  
     - Money doesn’t destroy the good; it *enables* it. The care relationship can retain its integrity if regulated (e.g., professional ethics, non-exploitative wages).  
     - **Key difference**: Care is a *service*; voting/jury duty are *civic functions*. Services can be commodified *without losing their nature* if the market is embedded in norms. Civic functions cannot.  

  2. **Price gouging**:  
     - **This *does* wrong someone!** It exploits vulnerability during emergencies (e.g., selling water at $50/bottle after a hurricane). This violates:  
       - **Fairness**: Taking undue advantage of desperation.  
       - **Autonomy**: Coercion-by-circumstance (no real choice).  
     - Easily fits within (1)’s framework – no need for institutional wrongs.  

  ### The Fix in Practice
  **Replace (1) with:**  
  *An exchange is wrong if it:*  
  - *(a) Wrongs a specific person (harm, rights violation, involuntariness), OR*  
  - *(b) Undermines a social institution or relational good in a way that deprives the community of its proper function.*  

  **This rescues your intuitions:**  
  - Vote-selling violates (b): It turns citizenship into a commodity.  
  - Jury-buying violates (b): It privatizes a public duty.  
  - Kidney sales *might* violate (b) if they erode altruistic donation norms.  
  - Price gouging violates (a): It harms vulnerable individuals.  
  - Nursing/advocacy survive: They don’t violate (a) or (b).  

  ### What You’re Buying
  - **Cost:** You accept that ethics isn’t solely individualistic. Some wrongs are about **broken systems**, not broken promises. This aligns with Sandel ("What Money Can’t Buy"), Satz ("Why Some Things Should Not Be for Sale"), and Anderson ("Value in Ethics and Economics").  
  - **Gain:** You condemn vote-selling and jury-buying *without* condemning paid care or advocacy. You save price gouging under (a). You avoid "disgust" arguments.  
  - **Boundary:** The "institutional corruption" test isn’t subjective – it requires analyzing the *functional role* of a practice in society. Money is corrosive only when it dissolves the *reason the practice exists*.  

  **Final note:** This doesn’t slide because the test is **teleological** (purpose-based), not intuitive. Voting exists for collective self-rule; nursing exists to heal. Markets can serve the latter but destroy the former. That’s not where you "happen to want it" – it’s where the logic of social practices takes you.
