  If the attack succeeds in lowering the utilitarian disvalue of B (say, to -50) or increasing the disvalue of A under utilitarianism (by increasing the harm to Jamie) or under deontology (making A even worse), then Rule 1 and Rule 2 might flip. However, in the current numbers, if we accept the -100 for B, the attack does not land because the numbers hold.

