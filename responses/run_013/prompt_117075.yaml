  - Option B: The worst score is from Utilitarianism: -100 (if we set closure to -100).
  - Then, the worst for A is -70, for B is -100. -70 > -100 → so A wins under Rule 2.

  **Rule 3 (Back your best guess):**
  - Sarah's best guess is Deontology (70% confidence). Deontology says: do not expel (because it's a violation). So Deontology chooses B (since B is the non-expulsion option). Therefore, Rule 3 chooses B.

  **Revised Scores:**
  - Utilitarianism:
    - A: +70 (if we set the benefit to +100 and harm to -30? But wait, we just set A's U to 70 by having +100 -30? Actually, we set A's U to 70 by having the net at 70. But let me break down:
      - Saving the school: +100 utils (prevents catastrophe for many)
      - Harm to Jamie: -30 utils (he is expelled, but we assume he can recover at another school, though with trauma)
      - So A (U) = 70.
    - B: -100 (closure causes catastrophe: students' futures ruined, staff unemployed, community devastated).
  - Deontology:
    - A: -70 (a severe moral violation: using an innocent as a mere means)
    - B: 0 (no violation: the closure is not Sarah's fault; she is upholding her duty)

  **Check Rule 1:**
  - A: (70 * 0.3) + (-70 * 0.7) = 21 - 49 = -28
  - B: (-100 * 0.3) + (0 * 0.7) = -30 + 0 = -30
  - A (-28) > B (-30) → Rule 1 chooses A.

  **Rule 2:**
  - A: worst score is -70 (from D)
  - B: worst score is -100 (from U)
  - The highest worst score is -70 (A) vs -100 (B) → so A wins.

  **Rule 3:**
  - Deontology (70% confidence) says B is the right choice (because A is forbidden). So Rule 3 chooses B.

  **The Single Feature Doing the Work:**
  The critical element is the *magnitude of the catastrophe in Option B under utilitarianism*. If we reduce the utilitarian disvalue of B (say, from -100 to -60), then:
  - Rule 1: A = -28, B = (-60 * 0.3) = -18 → B wins.
  - Rule 2: A's worst = -70, B's worst = -60 → B wins (because -60 > -70).

  So the entire structure depends on the utilitarian evaluation of the school closure being extremely bad (worse than the deontological violation).

