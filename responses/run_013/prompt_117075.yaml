  **Theories and Scores:**
  We need at least two moral theories that Sarah takes seriously. Let's use:
  1. **Utilitarianism (U):** Focuses on maximizing overall well-being. We'll express scores in utils (a common scale). 
  2. **Deontology (D):** Focuses on rules/duties (e.g., do not use an innocent person as a mere means). We need a common scale. We'll use a scale where 0 is neutral and negative is bad. But note: we must make the scales commensurable. Let's define a scale from -100 to 100, where -100 is the worst outcome and 100 is the best.

  We assume Sarah is 70% confident in Deontology (her best guess) and 30% in Utilitarianism.

  **Scoring the Options:**
  - Option A (expel Jamie): 
