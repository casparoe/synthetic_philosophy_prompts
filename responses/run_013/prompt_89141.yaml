prompt: |-
  Right, so I've been turning this over for a while and I can't work out whether I'm seeing a real pattern or just three unrelated things.

  First: juries. Twelve people at random off the electoral roll, service is compulsory (skip it and you get fined), they get no training in law at all, they hear a case for a few days and then they decide — and their decision is basically final. You can't appeal on the grounds that the jury got the facts wrong, and you can't haul the jurors back in afterwards to explain or justify how they reasoned. If they acquit someone everyone thinks is guilty, nothing happens to them. We've deliberately built it so that nobody can hold them to account.

  Second: citizens' assemblies. Ireland ran one that fed into the abortion referendum, France ran one on climate, and in the German-speaking bit of Belgium there's one that just sits there permanently now. Randomly selected people, paid, briefed by experts, they deliberate for a few weekends and produce recomendations. But — and this is the bit I keep tripping on — the recommendations go to the elected parliment, which then decides. So random people can set the agenda and write the report, but they don't get to make the call. Same method of selection as a jury, totally different amount of power.

  Third: term limits. Everyone hates career politicians, presidents are limited to two terms, lots of US states limit their legislators. Meanwhile federal judges get appointed for life and central bankers get long fixed terms with no elections, and we do that on purpose, because we want them insulated from public opinion. So we distrust the people who answer to us and we protect the ones who don't.

  What I want to know is what this combination presupposes. My guess is there's a line running through it between two kinds of judgement — the kind that supposedly only needs an ordinary person's common sense (guilty or not guilty; what should we do about climate) and the kind that needs years of training (law; interest rates) — and that we've quietly filed legislating under the first kind, which is why we're happy to hand it to amateurs and also why we don't think it's a skill worth letting anybody get too good at.

  But is that right? Reconstruct the view of legitimacy and competence that these practices only make sense under, and tell me which rival views they quietly rule out. Does sortition presuppose that there's a common good a disinterested random person can actually find, as opposed to just a clash of interests that elections aggregate? Is the judge/banker half of the picture in tension with the jury/assembly half, or does one theory cover both? Does the gap between juries and assemblies — one decides, the other only advises — presuppose something about whether there's a right answer in each domain? And tell me what's actually forced by these practices versus what they merely happen to fit with, i.e. where the whole thing is underdetermined.

  Then the payoff question: if you swapped the presupposed view for a rival — pure expertise, say, or politics as straightforward interest-group bargaining — what concretely would have to change about how these institutions are designed? And do I have to give up something I like here, because I suspect I can't keep both 'ordinary people are the best judges of what's fair' and 'defer to the people who've studied it for twenty years'.

  I don't know the vocabulary for any of this, so name the positions as you go.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're noticing three institutional designs: juries, citizens' assemblies, and term limits. Each seems to treat decision-making differently, especially regarding ordinary people versus experts. The user is trying to find the underlying principles that connect these and what they imply about legitimacy and competence.

  First, I need to break down each component. Juries have final say without accountability; citizens' assemblies advise but don't decide; term limits restrict elected officials while protecting experts. The user suggests a split between common sense judgment and specialized expertise. But is that the whole story?

  Looking at juries and assemblies, both use random selection but differ in power. Why? Maybe because criminal verdicts require a binary decision based on facts, while policy involves trade-offs and implementation. That suggests a view where some decisions have a "right answer" accessible to laypeople, while others need expertise. Term limits reflect distrust of elected officials but trust in unelected experts. That ties into insulation from politics versus accountability.

  The user mentions the common good versus interest aggregation. Sortition implies that random people can find common good, while elections manage conflicting interests. But assemblies only advise, so maybe there's a blend: common sense identifies values, experts handle details. The judge/central banker part emphasizes that some decisions need long-term stability, free from popular pressure.

  The gap between juries and assemblies might be about the nature of the decision. Criminal trials have legal standards; policy is more fluid. So juries decide because facts are bounded by law, while assemblies inform values but not specifics. This supports a hybrid legitimacy model.

  If we switched to pure expertise, juries might be replaced by judges, assemblies by panels. If politics is just bargaining, random selection wouldn't make sense—stakeholders would negotiate. The user wants to balance common sense and expertise. Hybrid models might work, like assemblies setting goals, experts designing policies. But trade-offs exist: accountability vs. insulation, values vs. technicalities. The user might need to accept that no single approach fits all domains, requiring context-specific designs.
answer: |-
  You've hit upon a profound tension at the heart of democratic theory and institutional design. Your intuition about a split between "common sense" and "expertise" is insightful, but the picture is more complex and rests on distinct, sometimes conflicting, presuppositions about legitimacy, competence, and the nature of political problems. Let's reconstruct the underlying worldview implied by these practices and explore its alternatives.

  **The Presupposed View: Hybrid Legitimacy & Domain-Specific Competence**

  1.  **Legitimacy Source:** The core presupposition is **Popular Sovereignty**. Final authority rests with "the people." However, this is interpreted *differently* in different domains:
      *   *Juries:* **Direct Popular Sovereignty in Fact-Finding & Basic Justice.** The "people" (represented by a random sample) are the ultimate arbiters of factual guilt/innocence in specific cases. Legitimacy comes from their direct, unmediated judgment. They embody the conscience of the community.
      *   *Citizens' Assemblies:* **Deliberative Legitimacy in Value Articulation.** Randomly selected citizens are seen as uniquely capable of disinterestedly *identifying* the common good or core societal values after informed deliberation. Their legitimacy stems from representing "the people" without partisan baggage or electoral incentives. *However*, final decision-making legitimacy for binding laws remains firmly with **Electoral Legitimacy** – institutions chosen by the broader electorate.
      *   *Term Limits & Insulated Institutions:* **Competence-Based Legitimacy.** For complex, technical domains requiring long-term consistency and insulation from short-term political pressures, legitimacy derives primarily from expertise, specialized knowledge, and institutional stability. Popular sovereignty is *mediated* through appointment processes and protected from direct electoral influence.

  2.  **Competence Distribution:**
      *   *Juries & Assemblies:* Presuppose **Epistemic Egalitarianism** (or at least, **Bounded Epistemic Egalitarianism**) in specific spheres. Ordinary people, equipped only with common sense and life experience, are deemed competent to:
          *   *Juries:* Discern factual truth and apply basic moral judgments ("guilt") within the bounded context of a specific case, guided by legal instructions.
          *   *Assemblies:* Identify fundamental societal values, preferences, and trade-offs after deliberation and learning. They are seen as competent judges of *what should be done* (values/goals), but *not necessarily how to do it* (complex implementation).
      *   *Judges & Central Bankers:* Presuppose **Meritocratic Epistemology.** Deep expertise, specialized training, and sustained experience are essential for competence in complex, technical domains (law interpretation, macroeconomics). Common sense is insufficient here.

  3.  **Nature of Problems & "Right Answers":**
      *   *Juries:* Presuppose that for factual guilt/innocence in a specific case, **a "right answer" exists and is discoverable** by a group of ordinary people through adversarial presentation of evidence and deliberation. The "common sense" of the community *is* the relevant standard for applying the law to facts.
      *   *Citizens' Assemblies:* Presuppose that on complex policy issues, **there is often no single, objectively "right answer," but there is a "better" or "more legitimate" process for finding solutions that reflect the common good.** Assemblies are valued for their ability to surface shared values and principled compromises *disinterestedly*. The "gap" between advising and deciding stems from the belief that:
          1.  Implementation requires technical expertise and political negotiation beyond the assembly's remit/time.
          2.  Electoral legitimacy ultimately trumps deliberative legitimacy for binding lawmaking (though deliberative input enhances its legitimacy).
      *   *Insulated Institutions (Judges, Central Bankers):** Presuppose that certain domains **require stability, long time horizons, and immunity from transient popular passions or partisan pressures.** "Right answers" here are seen as emerging from expertise and principle applied consistently over time, not popular vote.

  4.  **View of Human Nature & Politics:**
      *   *Juries & Assemblies:* Lean towards a view of **Deliberative Democracy** and **Civic Republicanism.** People, when freed from self-interest and partisanship (via random selection, disinterest), can reason together towards the common good. Politics isn't *just* interest aggregation; a common good exists and can be discerned through reason.
      *   *Term Limits & Distrust of Politicians:* Reflect **Public Choice Theory** skepticism. Elected officials are prone to self-interest, pandering, capture by special interests, and short-termism. Term limits are a crude tool to combat this.
      *   *Insulated Institutions:* Reflect **Elitist/Guardianship Theory** for specific domains. Experts/guardians, protected from electoral pressures, are better positioned to make decisions requiring technical skill or adherence to long-term principles.

  **What This View Rules Out (Rival Views):**

  1.  **Pure Majoritarianism/Populism:** The use of insulated institutions (judges, central banks) and the advisory role of assemblies rule out the idea that direct popular will (via elections or referenda) should *always* be supreme, especially on complex technical matters or fundamental rights.
  2.  **Pure Technocracy/Expert Rule:** The existence and power of juries, and the investment in citizens' assemblies, rule out the idea that *only* formally trained experts are competent to make important societal decisions, particularly on matters of fact, justice, and core values.
  3.  **Politics as Purely Interest-Group Bargaining (Pluralism):** The design of juries (disinterest enforced by randomness/secrecy) and assemblies (seeking common good via deliberation) actively works *against* the idea that politics is solely about aggregating or bargaining between fixed interests. They presuppose the possibility of transcending narrow interests.
  4.  **Radical Epistemic Elitism:** The faith placed in juries and assemblies presupposes that ordinary people *can* reach sound judgments in specific contexts, rejecting the idea that competence is rigidly tied to formal credentials across the board.
  5.  **Unrestricted Electoral Mandates:** Term limits presuppose that long tenure inevitably corrupts or detaches representatives from the public interest, ruling out the idea that experienced legislators are inherently better.

  **Underdetermined Aspects & Tensions:**

  *   **The *Degree* of Epistemic Egalitarianism:** How far does "common sense" competence extend? The jury/assembly split shows it's bounded. Is it truly egalitarian, or is it that randomness *averages out* biases, creating a *collective* competence?
  *   **The Source of the "Common Good":** Does deliberation *discover* a pre-existing common good, or *construct* it through dialogue? Practices are ambiguous.
  *   **Tension Between Jury Power & Assembly Advisory Role:** Why the difference? It's not purely about "right answers." It reflects:
      *   **Historical Path Dependence:** Juries have deep historical roots in Anglo-American law.
      *   **Domain Specificity:** Criminal verdicts are binary, high-stakes, and specific; policy is complex, multi-faceted, and ongoing.
      *   **Finality vs. Iteration:** A jury verdict needs finality; policy is iterative, requiring ongoing adjustment.
      *   **Institutional Anchoring:** Courts have established procedures *for* juries; legislatures don't (yet) have established procedures *for* binding citizen decisions.
  *   **Tension Between Distrust (Term Limits) and Trust (Juries/Assemblies):** This is a core tension! It presupposes that *elected representatives* are uniquely susceptible to corruption/distortion compared to both the disinterested public (juries/assemblies) *and* the unelected experts (judges/bankers). It reflects deep ambivalence about representative democracy itself.

  **The Payoff Question: Swapping Presuppositions & Consequences**

  1.  **Swapping to Pure Expertise (Technocracy):**
      *   **Juries:** Abolished. Replaced by panels of professional judges or specialized tribunals trained in evidence evaluation. Appeals on factual errors would be standard.
      *   **Citizens' Assemblies:** Abolished or reduced to public opinion surveys. Replaced by expert commissions drafting policy directly, perhaps with stakeholder input. Parliaments would become rubber stamps or heavily dominated by expert advisors.
      *   **Term Limits:** Irrelevant or extended. Expertise requires long tenure. Focus shifts to meritocratic appointment and performance review, not electoral accountability.
      *   **Insulated Institutions:** Expanded. Their model (expertise + insulation) becomes the norm for most policy domains.
      *   **You Lose:** The direct legitimacy of popular judgment ("ordinary people judging what's fair"), the perceived safeguard against state overreach (jury nullification potential), and the deliberative discovery of shared values.

  2.  **Swapping to Pure Interest-Group Bargaining (Pluralism):**
      *   **Juries:** Viewed with suspicion. Why trust disinterested amateurs? Might be replaced by panels representing relevant stakeholder groups (e.g., victim advocates, community reps, industry reps depending on the case) or simply professional judges. Secrecy/irreversibility would be challenged.
      *   **Citizens' Assemblies:** Seen as naive or illegitimate. Random selection ignores actual power and interests. Replaced by formalized negotiation forums between organized interest groups (business, labor, NGOs, etc.) or strengthened committee systems representing party/group interests.
      *   **Term Limits:** Might stay, but justified differently – to rotate access for different interest groups, not to combat corruption per se. Lobbying regulation becomes the primary tool.
      *   **Insulated Institutions:** Severely weakened or abolished. Judges and central bankers must be directly accountable to elected officials or interest groups, as their decisions inherently favor some interests over others. Independence is seen as a smokescreen for elite capture.
      *   **You Lose:** The aspiration for a disinterested "common good," the unique legitimacy of randomly selected bodies seen as representing "the people" as a whole (not just organized factions), and the stability provided by independent institutions.

  **The Trade-Off You Suspect: "Ordinary people are best judges of what's fair" vs. "Defer to experts"**

  You are correct; holding both *absolutely* is incoherent. The existing practices represent a messy, context-dependent *compromise*:

  *   **The Hybrid Solution:** You *can* keep elements of both, but you must accept **domain specificity**:
      *   "Ordinary people are best judges of what's *fundamentally fair* and what *values* we should prioritize **in specific, bounded contexts** (trial facts, principle-level policy goals), especially when disinterest is paramount."
      *   "We must defer to experts on *complex implementation*, *technical details*, and matters requiring **long-term consistency insulated from short-term politics**."
  *   **The Process Solution:** Frame it as **complementary roles in a process**: Ordinary citizens (via juries, assemblies, elections) set the *goals, values, and priorities* ("what is fair?"). Experts and insulated institutions then figure out the *best technical means* to achieve those goals within defined constraints and principles. Citizens also act as a final check via elections or jury verdicts.

  **Conclusion:**

  The practices you describe presuppose a **pragmatic, hybrid theory of legitimacy and competence**. It blends:

  1.  **Popular Sovereignty** as the ultimate foundation.
  2.  **Epistemic Egalitarianism** for core factual judgments and value articulation (via juries/assemblies).
  3.  **Electoral Legitimacy** for binding lawmaking.
  4.  **Meritocratic Expertise** for complex, technical domains requiring stability.
  5.  **Deep Ambivalence about Representative Democracy**, manifesting as distrust (term limits) combined with its ultimate supremacy over assemblies and reliance on it for appointments.

  It rules out pure majoritarianism, pure technocracy, and pure interest-group pluralism. The tension between trusting the disinterested public (juries/assemblies) and distrusting elected representatives while trusting unelected experts is real and reflects the inherent difficulties in designing institutions for complex societies. The key to holding your desired values is recognizing that "judging what's fair" and "implementing complex solutions fairly" are distinct tasks, often best served by different actors and processes within a system of checks and balances.
