  We are building a decision tree that classifies positions on the moral status of everyday conventions (tipping, queueing, jaywalking) and the obligations of visitors. The tree must be based on the three-step decomposition: Grounding, Scope, and Weight.

  The three steps:
  1. Grounding: Practice-independent (PI) vs. Practice-dependent (PD)
     - PI: The practice has a moral ground that exists independently of the rule (e.g., harm, fairness, reasonable expectations).
     - PD: The normative force comes from the existence of the rule and general compliance.

  2. Scope: Place-indexed (P) vs. Insider-indexed (I)
     - Place-indexed: Binds anyone in the location.
     - Insider-indexed: Binds only those who are participants in the practice and share its benefits.

  3. Weight: Duty (D) vs. Defeasible Reason (DR) vs. Membership Fee (MF)
     - Duty: A strong obligation that requires significant reason to override.
     - Defeasible Reason: Can be overridden by relatively trivial inconveniences.
     - Membership Fee: A social expectation, breach of which is a faux pas but not a moral wrong.

  Constraints:
  - Internal nodes are questions (not doctrinal labels) that can be answered without knowing the position.
  - The first node must be a case, not a doctrine.
  - Cases must include: 
     a. Visitor from a non-tipping country dining where tipping is assumed.
     b. Jaywalking at 3am on an empty street.
     c. Jaywalking across a busy street while a child watches.
     d. Holding a place in a queue for a friend who hasn't arrived.
     e. Visitor declining offered food.
     f. Visitor complying with a local convention she believes props up injustice.
  - At least two leaves should differ only on the last case (f).
  - Visitor question: at least three distinct positions (bound as local, bound only by PI core, bound more strictly).
  - 9-13 leaves, no path longer than 5 questions, each node yes/no or three-way.
  - Each leaf: short descriptive name, one sentence on awkward commitment, and one-line verdicts on tipping, queueing, jaywalking, and visitor scope.
  - Unnamed leaves: mark and explain why empty.
  - Close with: unoccupied combinations (with diagnosis: incoherent, unattractive, unexplored) and pairs of leaves that the tree cannot separate (with a further case that would separate them).
  - Node where mixed intuitions get stuck: identify and explain.

