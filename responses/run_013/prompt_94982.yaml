prompt: |-
  I am a retired medical researcher — thirty-five years in gastrointestinal physiology — who has spent the last several years reading philosophy and history with more enthusiasm than discipline. My own field supplies the anecdote that got me into the present trouble: for most of my working life it was simply understood that bacteria could not colonise the stomach, and the people who claimed otherwise were not merely mistaken but faintly disreputable; the reversal came well within my career, and I have never quite got over it. I therefore take the possibility of a despised minority being right more seriously than most of my former colleagues do, and I have been trying to square that disposition with what I have read about historical revisionism and its disreputable twin, denialism — chiefly in connection with the Holocaust, the Armenian genocide, and Nanjing.

  Two quite different criteria seem to be on offer for the line between the two, and I would like them compared and adjudicated.

  The first I have imported from the philosophy of science, from Lakatos: a research programme is progressive when it anticipates novel facts and grows by them, degenerating when it merely patches itself to accommodate what is already known, and the verdict is provisional — a judgment about the trajectory of an inquiry, revisable in the light of what the inquiry does next. Call this the trajectory criterion.

  The second is what I find in the writing on denialism itself: that the difference lies not in the programme's trajectory but in the conduct of the argument — a systematic asymmetry in the standard of proof demanded of congenial and uncongenial claims, the treatment of absent documentation as disproof, the relocation of the goalposts each time a demand is met, and the construal of a settled consensus as itself evidence of conspiracy. Call this the conduct criterion.

  What I want is a comparison of the two, and a verdict. Do they pick out the same cases? Where do they come apart — is there a degenerating programme that is not denialist, or a denialist enterprise that is in good methodological order by Lakatos's lights? Which of the two, if either, is fundamental, and does one explain why the other matters? And a question I cannot settle alone: the trajectory criterion yields a fallible, revisable verdict, whereas denialism as the term is actually used is a verdict that no future evidence could overturn. Are these two versions of a single concept, or is denialism a different kind of thing — a political practice in the costume of a research programme — in which case the comparison I have set up is itself misconceived and I would rather be told so. I am also unsure whether the trajectory criterion survives the crossing from experimental science into history, where one cannot intervene and where the evidentiary base is finite and largely fixed; if "novel fact" means nothing in that setting, say so, and say what should replace it.

  Lead with your bottom line in the first sentence and then give the reasoning, without preamble and without restating my question.
reasoning: |-
  Okay, the user is a retired medical researcher with a background in gastrointestinal physiology, now delving into philosophy and history. They're grappling with the distinction between legitimate historical revisionism and denialism, especially in contexts like the Holocaust, Armenian genocide, and Nanjing. Their personal experience with the stomach bacteria paradigm shift makes them sensitive to minority viewpoints being correct. They've proposed two criteria: one from Lakatos (trajectory of inquiry) and one from denialism literature (asymmetric argument conduct). They want these compared and adjudicated.

  First, I need to parse their core questions. They want to know: Are the trajectory and conduct criteria identifying the same cases? Where do they diverge? Which is more fundamental? Also, whether denialism, as used, is a fixed verdict versus Lakatos's provisional one, and if "novel facts" apply in history.

  Starting with the bottom line: The conduct criterion is more fundamental for distinguishing denialism. Now, reasoning step by step. 

  Lakatos's trajectory criterion is about the health of a research program—progressive if it predicts new facts, degenerating if it just patches up. But in history, "novel facts" are tricky since evidence is finite. Historical revisionism might focus on reinterpreting existing evidence, not discovering new data. So trajectory alone isn't sufficient to flag denialism. A degenerating program could be misguided but not denialist—like a historian stuck in outdated methods but arguing in good faith.

  The conduct criterion, however, directly addresses the bad faith tactics: moving goalposts, demanding impossible proof for consensus claims, crying conspiracy. These are hallmarks of denialism, not honest revisionism. This asymmetry in argumentation reveals a political agenda disguised as scholarship. 

  Where do they come apart? A degenerating program (by Lakatos's lights) might lack progress but still argue fairly—imagine a historian using outdated frameworks but engaging earnestly with criticism. Conversely, a denialist enterprise could appear "progressive" by cherry-picking new "evidence" (e.g., fringe documents) but still exhibit toxic conduct like dismissing contrary archives as forgeries. So the criteria don't always overlap.

  The user's deeper concern: Is denialism a different beast entirely? Yes. The conduct criterion exposes it as a political practice masquerading as research, hence the irrevisable verdict—denialists reject any counter-evidence axiomatically. Lakatos's framework is about methodological self-correction; denialism actively avoids it. 

  On history vs. science: "Novel facts" in history could mean new interpretations of existing evidence or rare archival discoveries. But the key is whether the inquiry adapts to evidence or evades it. The conduct criterion still applies cleanly here. 

  Why is conduct fundamental? It explains why denialism is harmful: it corrupts the epistemic process itself. Trajectory matters for scholarly vigor, but toxic conduct defines denialism’s threat to truth-seeking. The user’s stomach bacteria example was a trajectory failure corrected by science; denialism resists such correction by design. 

  In essence: Trajectory diagnoses weak scholarship; conduct diagnoses anti-scholarly activism. For genocide contexts, the latter is the real danger.
answer: |-
  **Bottom line: The conduct criterion fundamentally defines denialism and explains why it is irredeemable, while the trajectory criterion identifies scholarly failure but cannot alone condemn denialism; they are distinct concepts, with denialism being a political practice disguised as inquiry.**  

  ### Reasoning:  
  1. **Core Difference in Purpose**:  
     - The **trajectory criterion** (Lakatos) evaluates the *epistemic health* of a research program. A "degenerating" program fails to generate novel insights, relying on ad-hoc adjustments. This verdict is *provisional*—new evidence or theoretical shifts could redeem it (e.g., your stomach bacteria case initially appeared degenerate but was later vindicated).  
     - The **conduct criterion** diagnoses *systematic bad faith*. Asymmetric demands of proof, moving goalposts, and treating consensus as conspiracy reveal a refusal to engage evidence honestly. This defines *denialism*, and its verdict is *fixed* because denialism immunizes itself against counterevidence.  

  2. **Where the Criteria Diverge**:  
     - **Degenerating ≠ Denialist**: A research program can stagnate methodologically (e.g., outdated models in historiography) without exhibiting denialist conduct. Scholars might acknowledge gaps, revise claims, and avoid conspiracy tropes.  
     - **Denialist ≠ Degenerate (by Lakatos)**: Denialism can mimic "progress" by fabricating "novel facts" (e.g., cherry-picked documents) or shifting focus to new controversies. Its methodological facade may appear "progressive" (e.g., demanding "more research" indefinitely) while its conduct remains toxic.  

  3. **Fundamentality of the Conduct Criterion**:  
     Conduct is *causal*: asymmetric standards and conspiracy-mongering directly corrupt the inquiry, making self-correction impossible. Trajectory failure (degeneration) is a *symptom* that *might* stem from poor conduct but could also arise from honest error. Denialism’s conduct ensures it never progresses, but trajectory alone cannot capture its moral/political malice.  

  4. **Denialism as a Political Practice**:  
     Denialism uses the *rhetoric* of scholarship while subverting its norms. Its verdict is irrevisable because it rejects epistemic accountability—unlike Lakatos’s framework, where future evidence matters. This is not a "version" of the trajectory concept; it is a distinct, weaponized activity.  

  5. **Applicability to History**:  
     - "Novel facts" *do function* in history but differently: they involve reinterpretations of existing evidence (e.g., diaries revealing overlooked perspectives) or rare archival discoveries. A progressive historical program predicts where evidence *should* emerge or coherently recontextualizes known material.  
     - **Replacement for "Novel Fact"**: In history, focus on *explanatory depth and coherence*. A "progressive" program resolves anomalies without ad-hoc patches; a "degenerating" one ignores contradictions or forces evidence into rigid preconceptions. The conduct criterion remains decisive: denialism *manufactures* anomalies to discredit consensus.  

  ### Verdict:  
  Use the **conduct criterion** to isolate denialism (a uniquely corrosive practice) and the **trajectory criterion** to assess scholarly rigor. They overlap when bad faith causes degeneration (e.g., Holocaust denial’s endless goalpost-shifting), but only conduct explains why denialism is untreatable by evidence. Your analogy to medical history is apt: dissent over stomach bacteria was a *trajectory dispute* resolved by evidence; denialism rejects resolution by design.
