prompt: |-
  Ok so this started as an argument with my sister (she's an ICU nurse) and I've been unable to let it go for weeks. Here's the pattern. Whenever something bad happens and people start asking what caused it, the honest answer is always a giant sprawling story — the disease, the staffing levels, the fact the hospital is built where it is, the patient's age, the weather, all of it. But what actually gets named as "the cause" is nearly always the one thing in that story that was out of the ordinary. My sisters example: a patient deteriorates overnight while the on-call doctor is covering three wards (which happens a couple of times a year), and the review concludes that the doctor not being at the bedside caused the death. Nobody calls the disease the cause, even though it was doing its work the whole time and would of killed him under any staffing arrangement. But then on a different night, same understaffing, nobody dies, and now people say the short-staffing "almost caused" a death — nothing actually happened, and we still hand it causal language. And notice that when the unusual thing is a non-event — a guard who wasn't at his post, a checklist nobody filled in, a scan nobody ordered — we're perfectly willing to call the absence a cause, and often we're angrier about it than we'd be about somebody who actively did the same amount of damage. But other non-events we flatly refuse to treat that way: if I forget to water my neighbours plants while she's away and they die, I don't think anyone, me included, would say I caused their death, even though "I didn't water them" seems like exactly the same kind of fact as "the guard wasn't at his post."

  So: is there a name for this? I did one semester of philosophy so I know about half the vocabulary, which is honestly making it worse. I'm pretty sure it isn't just post hoc reasoning, and it isn't just blame, because the causal talk and the blame talk come apart — sometimes we say "she caused it but it's not her fault" and sometimes "she didn't cause it but she should be ashamed." What I want is the concept, or the set of competing concepts, not just a label. In particular: (a) is there a term for the general thing, that our causal verdicts seem to track what was abnormal or unexpected rather than what was necessary or sufficient; and (b) is the special case where the abnormal thing is an absence treated as its own separate problem with its own literature, or is it just a sub-case of the general one? And (c) what is the actual disagreement here, because I keep getting told two things that can't both be true — that an absence can't cause anything at all, because there's nothing there to do any causing, and that if absences can cause things then I am the cause of every death I failed to prevent, everywhere, forever.

  If there's no single name for the whole thing, coin one, but then tell me what it excludes: how does it differ from just "the thing we could have changed," and from the cynical view that we only pick out causes for practical reasons, to know who to sue or who to fire.
reasoning: |-
  Okay, the user presents a fascinating philosophical puzzle about causality, sparked by an argument with their ICU nurse sister. They've noticed that when assigning causes for negative events, people disproportionately focus on what was abnormal or unexpected rather than the underlying necessary conditions. The hospital example is particularly rich: a patient's death is blamed on the doctor's absence during unusual understaffing, not the ever-present disease, yet that same understaffing isn't called a "cause" when no death occurs. 

  What makes this especially thorny is the treatment of absences. We readily call missing guards or unfilled checklists "causes," but not forgotten plant-watering. The user wants conceptual tools to unpack this, specifically: (a) terminology for abnormality-driven causal attribution, (b) whether absences are a special case, and (c) how to resolve the contradiction around whether absences can cause anything at all. 

  First, the core phenomenon screams "causal selection" – the philosophical term for how we pick which thread in the causal web to highlight. But the user needs more nuance. Hart and Honoré's "abnormal condition" theory fits perfectly: we default to labeling deviations from norms (institutional, statistical, or moral) as causes. This explains why routine understaffing fades into the background while rare understaffing gets blamed. 

  For absences, the user has hit a major philosophical fault line. Davidson-type theories demand actual events as causes, so "the guard's absence" can't cause anything – only the guard's decision to leave might. But ordinary language absolutely treats absences causally. The plant example reveals the hidden role of norms: we feel responsible for omissions only when we've assumed a duty (like plant-sitting), not for every possible prevention. 

  The contradiction they mention dissolves when we distinguish causation (broadly: any counterfactual dependence) from causal responsibility (blameworthy contributions). Yes, your inaction counterfactually enables thousands of deaths, but we only assign responsibility when you had a specific obligation to act. That's why the ICU nurse feels the hospital's staffing failure is causal in a way your plant-forgetting isn't. 

  Ironically, the user's philosophy semester might be hindering them by exposing them to incompatible frameworks without the tools to reconcile them. They need to see this as a multi-layer problem: metaphysical (what causation is), psychological (how we attribute it), and normative (when we hold people accountable). 

  The cynical "who to sue" view isn't wrong but is incomplete. Legal liability does shape causal talk, but even outside courts, we focus on controllable abnormal factors because that's what's useful for prevention. The sister's medical context heightens this – in complex systems, we must prioritize intervenable levers. 

  I should emphasize that this isn't about truth but emphasis. The disease did cause the death; the staffing was a necessary condition; the unusual absence became the salient "cause" because it was both abnormal and fixable. The plant counterexample fails precisely because watering wasn't an institutional obligation – it reveals how deeply causal selection relies on normative expectations.
answer: |-
  You've hit on a profound and deeply debated issue in philosophy of causation, law, and ethics. There *are* concepts and competing frameworks for this – it's not just observation bias. Here's the breakdown:

  ### (a) The Core Concept: Causal Selection & Abnormality
  *   **The General Phenomenon:** This is primarily called **Causal Selection**. It's the process by which we pick *one* or *a few* factors from the dense network of necessary conditions as "**the cause**".
  *   **The Abnormality Principle:** The dominant theory explaining selection is the **Abnormal Condition** view, most famously developed by H.L.A. Hart and Tony Honoré in *Causation in the Law*. Their core argument:
      *   We start with a "**causal field**" – the set of normal, expected, background conditions (the disease, the patient's age, gravity, standard staffing levels, the plants needing water, etc.).
      *   We then identify a **deviation** or **intervention** from this normal background – something abnormal or unexpected (the extreme understaffing, the guard being absent, *you* being responsible for the plants).
      *   **"The cause" is typically identified as this abnormal or intervening factor.** It "makes the difference" relative to the expected baseline.
  *   **Why?** This selection is pragmatic and normative (not just cynical):
      *   **Explanatory Relevance:** What explains *why it happened THIS time* when it didn't happen before? The abnormality.
      *   **Control & Intervention:** We focus on factors we can potentially change or control to prevent recurrence (staffing, guard placement, watering). We can't change the background disease or the plants' need for water.
      *   **Moral/Legal Responsibility:** Abnormalities often point to where responsibility might lie (did someone fail in their role?).
      *   **Counterfactual Asymmetry:** We ask "What if *this abnormal thing* hadn't happened?" much more readily than "What if the background conditions were different?" The counterfactual difference seems clearer with the abnormality.

  ### (b) The Problem of Absences (Omissions): A Special Headache
  This is absolutely a major sub-problem with its own vast literature, fiercely debated:
  *   **The Issue:** Can "nothing" (an absence, omission, failure to act) be a genuine *cause*? Logically, absences are pervasive necessary conditions ("If oxygen had been absent, they would have died"). Why are *some* absences (guard not there, scan not ordered) picked out as causes, while others (you not watering the plants, oxygen not being absent) are not?
  *   **The Normative/Relational Solution (Hart & Honoré, and many others):** An absence is only considered a potential "cause" (specifically, a **failure** or **omission**) within a specific **duty, role, or normative context**:
      *   **Role/Expectation:** The guard *had a duty* to be at the post. The doctor *had a duty* to see the patient (made impossible by the abnormal load). The hospital *has a duty* to staff adequately. *You voluntarily took on the duty* to water the plants.
      *   **Breach:** The "cause" arises when there's a **failure to fulfill that specific duty or expectation** within the causal field. The absence isn't just any absence; it's the absence *of something that was normatively required in that situation*.
  *   **Why the Plant Example Feels Different:**
      *   **No Specific Duty?** Your neighbor *hoped* you'd water the plants, but unless there was a clear agreement establishing a duty *for that specific task*, it remains a background "if only" wish, not a breached obligation within the causal field. You didn't *cause* the death; you merely *failed to prevent it* in a context where you weren't formally responsible. Society generally doesn't impose a duty to prevent *all* possible harms to others.
      *   **Moral Intuition:** We intuitively feel responsible for harms we *actively* create ("I poisoned the plants") or *directly fail to prevent when explicitly responsible* ("I promised to water them"), but not for harms we merely *could have* prevented without such responsibility.

  ### (c) Resolving the Contradiction: Causation vs. Causal Responsibility
  The two statements you hear aren't both true *in the same sense*. The confusion stems from conflating:
  1.  **Metaphysical Causation (Broad Counterfactual Dependence):** In the broadest sense, your failure to prevent *any* death *is* a necessary condition for that death. If you *had* magically intervened perfectly, that death wouldn't have occurred. Absences *are* causally relevant in this expansive counterfactual sense ("but for" your inaction, the outcome would differ).
  2.  **Causal Responsibility / Attributability (Selected Cause):** This is the realm of **causal selection** and **normative context**. We *attribute* causal responsibility for an outcome to a specific absence *only* when:
      *   The absence was **abnormal** relative to the causal field.
      *   There was a **specific duty, role, or reasonable expectation** that the thing *should* have been present or the action *should* have been taken.
      *   The absence made a **salient difference** to the outcome.

  **The Resolution:**
  *   **"An absence can't cause anything"** is often argued from a strict **event ontology** (Davidson: causes are events; absences aren't events). However, this clashes powerfully with ordinary language and legal practice.
  *   **"Absences cause everything I fail to prevent"** is true only in the trivial, impractical, **broad counterfactual sense**. It ignores **causal selection** and **normative context**.
  *   **The Middle Ground (Most Common View):** Absences *can* be genuine causes (**omissive causes**), *but only* when they constitute a **failure within a specific normative framework** (a duty, role, justified expectation). We are *not* the cause of every death we fail to prevent; we are only causally responsible (via omission) for deaths where a specific duty to prevent *that harm for that entity* existed and was breached.

  ### How it Differs from Related Ideas
  *   **"The thing we could have changed":** This is *close* and often overlaps, as we select abnormal, intervenable factors. But it's not identical. Sometimes the abnormality wasn't changeable *in that moment* (a freak storm), but we still call it "the cause." Causal selection includes explanatory intent beyond pure intervention.
  *   **Cynical "Who to sue/fire" view:** This captures *one* driver (accountability/practicality), but it's insufficient. We select causes even when no blame is assigned (e.g., "The cause of the bridge collapse was the unprecedented flood" – no one to sue, but the abnormality explains the event). The explanatory and normative aspects are fundamental.

  ### In Summary
  *   **Core Concept:** **Causal Selection**, driven primarily by the **Abnormal Condition** theory (Hart & Honoré).
  *   **Absences as a Special Case:** Treated extensively as **Omissions** or **Omissive Causation**. Their status as "causes" depends critically on a **breach of a specific duty or normative expectation** within the causal field.
  *   **Resolving the Contradiction:** Distinguish **broad counterfactual dependence** (where your inaction is always necessary) from **attributed causal responsibility** (which requires abnormality and a breached duty). You are *not* the cause of every death you fail to prevent; only those where you had a specific obligation to prevent *that* death.

  Your sister's ICU examples perfectly illustrate how causal selection works in high-stakes, complex systems: the constant background (disease, standard risks) fades, and the *abnormal deviation* (extreme understaffing, a missed step *someone was responsible for*) becomes the salient "cause" for investigation, learning, and accountability. The plant example highlights how vital the *normative context of duty* is for turning an absence into an attributable cause. This isn't sloppy thinking; it's how humans navigate a causally dense world with limited attention and a need for action.
