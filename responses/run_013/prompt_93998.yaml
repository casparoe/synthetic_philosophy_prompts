  Hmm, the user seems anxious about misgrading—they mention "flip-flopping" and wanting to defend their mark. That's understandable; time asymmetry debates are tricky, and peer grading adds pressure. They specifically want: 
  - Identification of exact problematic sentences 
  - Distinction between "correct-but-imprecise" vs "genuinely mistaken" 
  - Margin comments they can use 
