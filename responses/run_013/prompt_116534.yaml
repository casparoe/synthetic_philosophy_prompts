prompt: |-
  Retired three years now, after 35 in a biology department. Since then I've been reading philosophy on my own, mostly a pleasure, exept for one thing that keeps stopping me up.

  In my old world everybody talked as if rewards track merit. The grant, the chair, the prize went to the person who deserved it, full stop. Fine. But the more I read -- Rawls, and then whatever the desert people are on about -- the less I can find a version of that sentence that survives contact with what I actually know about how people end up the way they are. So before I pick a side I want the spec first. Lay out what a theory of desert -- who deserves what, and on what basis -- has to be able to do before it's worth taking seriously.

  I want the requirement list, and for each item the case or consideration that makes it a requirement rather than a preference. Things I'd want it to handle, just to get you started:

  - the grad student who worked harder than anyone in the building for six years and got nothing out of it. Owed anything or not?
  - the guy whose big result landed in his lap because a rival's lab burned down the month before. Same paper, different luck.
  - the fact that the qualities we reward -- persistence, whatever you want to call it -- are partly handed to you at birth and shaped by a childhood nobody picked.
  - the technician who ran the one experiment that mattered and whose name never made the paper. Did she deserve the discovery? What exactly did she deserve?
  - a man who'd flatly refuse the award everyone agrees he deserves. Can you deserve something you don't want?

  And the distinctions I dont think a theory is allowed to just collapse: deserving something vs. being entitled to it; what you deserve for what you did vs. what you deserve for who you are; and whether desert can even get off the ground before there are institutions handing out the positions people are said to deserve, or whether it's prior to all that.

  Then the part I care most about. Tell me which of these requirements can't all hold at once. My guess is the control requirement -- you only deserve what was up to you -- collides head-on with what I know about where effort and character come from, and I want to know whether that collision is fatal or whether the theory just shrinks to almost nothing. If it's fatal, say so and say what's left. That's the result I'm after, not a tour of the answers. And flag any item on my list that isn't a real requirement at all but just a habit of one camp -- I'd rather not build the spec out of somebody's prejudice.

  One last thing. "Meritocracy" gets used two ways around me -- as a description of how things do work and as a goal for how they should work -- and I suspect those are doing different jobs. If a theory of desert is meant to underwrite the second use, add that to the list and tell me whether it can.

  Answer in American English, and skip the throat-clearing -- I've read enough of that already.
reasoning: |-
  Okay, let me approach this methodically. The user is a retired biologist with 35 years of experience who's diving deep into philosophy, specifically grappling with the concept of desert versus what they've observed in academic science. Their frustration is palpable - they've seen firsthand how the "rewards track merit" narrative clashes with reality, and they want a rigorous framework to evaluate desert theories before committing to any position.

  First, I need to unpack their core request: they want a specification sheet for any viable theory of desert. Not just features, but requirements justified by real-world cases. Their examples are strikingly concrete - the unlucky grad student, the technician omitted from authorship, the role of luck and circumstance. This suggests they'll reject abstract hand-waving; each requirement must be battle-tested against lab life.

  The distinctions they insist on preserving seem crucial: desert vs entitlement, action-based vs being-based desert, and whether institutions create desert or merely recognize it. I notice they're particularly suspicious of the "control requirement" - whether we can deserve anything given how little is truly under our control. That's likely the make-or-break point for them.

  They're also sharp to flag the meritocracy ambiguity - descriptive vs normative. Since they're clearly oriented toward the "should" question (given their Rawls reference), I'll need to show how desert theories attempt to underwrite distributive justice, and whether that bridge collapses under scrutiny.

  For structure, I'll: 
  - Build the requirement list directly from their cases, showing why each is non-negotiable 
  - Test desert theories against their control paradox 
  - Explicitly mark where requirements conflict 
  - Identify any "fake requirements" that might be ideological baggage 
  - Resolve the meritocracy duality 
  - And crucially, deliver their requested verdict: whether control vs determinism is fatal for desert

  The tone needs to match their no-nonsense approach: concise, evidence-based, with zero pandering. When I dissect the control problem, I won't soften the blow - if desert shrinks to near-nothingness, I'll say so plainly. Their examples will anchor every abstract point; that technician left off the paper? That's not an illustration - it's the litmus test.
answer: |-
  Here's the requirement spec for a viable theory of desert, built from your cases and distinctions, with justifications and collisions laid bare. No throat-clearing.

  **Core Requirements for a Theory of Desert (The "Must-Haves"):**

  1.  **Distinguish Desert from Entitlement:**
      *   **Requirement:** Must clearly separate what someone *deserves* (based on some inherent moral quality of their actions/character) from what they are *entitled to* (based solely on institutional rules or prior agreements).
      *   **Why Required (Not Preference):** Your technician case demands this. She may be *entitled* to authorship per lab policy (a contract issue), but does she intrinsically *deserve* credit for the discovery itself? A theory that conflates the two collapses into mere legalism and ignores the moral intuition behind "They *deserved* better." Entitlement flows from rules; desert claims a deeper moral grounding.

  2.  **Account for Agency vs. Circumstance:**
      *   **Requirement:** Must define what aspects of an action or outcome are truly attributable to the *agent* (and thus potentially desert-grounding) versus those attributable to *luck, circumstance, or unchosen endowments* (which undermine desert claims).
      *   **Why Required:** Your "lab burned down" case and the "qualities handed at birth" case force this. If the rival's identical merit is rendered irrelevant by bad luck, how can desert depend solely on outcome? If persistence is largely genetic/familial, how much credit does the agent *deserve* for possessing/using it? A theory without this distinction cannot handle luck or determinism.

  3.  **Specify the Desert-Base:**
      *   **Requirement:** Must clearly identify the *basis* for desert claims: Effort expended? Intent? Outcome achieved? Moral character? Sacrifice made? It must also distinguish between desert *for what you did* (effort, specific action) and desert *for who you are* (character, intrinsic worth).
      *   **Why Required:** Your grad student case vs. the big result case highlights this. Did the grad student *deserve* success/reward for immense effort alone, despite no outcome? Did the lucky scientist deserve the reward for the outcome, despite minimal effort? A theory must tell us *what* we are rewarding and why it grounds desert. "Who you are" desert (e.g., "deserves happiness") is fundamentally different from "what you did" desert (e.g., "deserves the prize").

  4.  **Address Institutional Dependence (Or Prior Status):**
      *   **Requirement:** Must state whether desert is *prior to and independent of* social institutions (e.g., "She deserved recognition, period") or *constituted by* them (e.g., "She deserves the *prize* because the prize exists to reward X").
      *   **Why Required:** Your technician case and the "positions" distinction demand this. Can the technician deserve scientific *credit* before the institution of scientific authorship exists? Or does she only deserve the specific *recognition defined by the existing institution* (like authorship)? A theory must take a stance; collapsing this ignores the historical/social contingency of many desert claims. Most plausible theories see desert as *institutionally framed* (e.g., you deserve the *prize* only if the prize exists to reward that specific merit), though the underlying *moral claim* (e.g., recognition) might be prior.

  5.  **Handle the Control Requirement (The Crux):**
      *   **Requirement:** Must state that agents only deserve things based on factors *within their control*.
      *   **Why Required:** Intuition demands it. We don't blame (or praise) people for things utterly beyond their control (e.g., a seizure causing a crash). Your "qualities handed at birth" case directly attacks this. If effort/persistence/talent are significantly determined by genetics/upbringing, how much *control* does the agent *really* have? This is the central tension.

  6.  **Accommodate Refusal:**
      *   **Requirement:** Must allow that someone can *deserve* something even if they do not want it or refuse it.
      *   **Why Required:** Your "refusing the award" case. Desert is a claim *about* the agent based on some prior fact (effort, achievement, character), not about their current desires. Refusal doesn't erase the desert; it might change whether they *receive* it, or whether giving it is *appropriate*, but the desert claim itself remains. A theory denying this makes desert hostage to whim.

  7.  **Underwrite Normative Meritocracy (If Applicable):**
      *   **Requirement:** If intended to justify meritocracy *as a goal* ("should"), it must demonstrate that distributing rewards based on its desert criteria leads to a *morally superior* state of affairs (e.g., justice, efficiency, flourishing) compared to alternatives (need, equality, lottery).
      *   **Why Required:** You correctly identify the descriptive ("does") vs. normative ("should") split. A desert theory *for* meritocracy must provide the *moral reason why* rewarding desert is good or right. Simply describing how rewards *are* distributed based on perceived merit isn't enough; it needs a normative foundation.

  **The Collision You Suspect: Fatal Impact**

  *   **The Problem:** Requirement 5 (Control) collides catastrophically with the reality highlighted in your "qualities handed at birth" case and inherent in the grad student/lab fire cases.
  *   **The Collision:** If desert requires control, and if core desert-bases like effort, talent, and perseverance are themselves significantly influenced (or determined) by factors outside an agent's control (genetics, upbringing, sheer luck of opportunity), then the scope for *genuine* desert shrinks dramatically.
  *   **Is it Fatal?**
      *   **Hard Incompatibilist View (Near-Fatal):** Yes. If determinism (or even significant causal influence) is true, and free will/ultimate control is illusory, then *no one* deserves anything in the strong, foundational sense required by pure desert theories. Desert becomes incoherent or collapses into a description of institutional entitlement or social utility. This leaves **nothing** for desert *as a fundamental moral concept* to stand on. What's left? Entitlement (rules), consequentialism (good outcomes), need, or equality.
      *   **Compatibilist/Attributionist View (Shrinkage):** Not fatal, but radical shrinkage. Desert is salvaged by redefining "control" as *reasons-responsiveness* or *attributability*. You deserve praise/blame/reward if the action/quality *reflects your will* or *is attributable to you as an agent*, even if your will was shaped by prior causes. The grad student's effort *reflects her commitment*, even if her capacity for commitment has roots beyond her control. She *deserves* recognition *for* that effort. However:
          *   The *basis* narrows: Desert applies primarily to the *expression* of agency within constraints, not the underlying traits themselves.
          *   The *force* weakens: Desert claims become more localized and contextual ("She deserves credit *for her specific contribution*") rather than claims about fundamental worthiness ("She *deserves* success").
          *   **What's Left:** A significantly reduced scope. Desert applies to actions and choices *as expressions of the agent* within their circumstances, but cannot ground sweeping claims about fundamental life outcomes being "deserved" in a cosmic sense. It becomes more about recognizing agency *within the system* than justifying the system's overall distribution.

  **Items on Your List - Real Requirements vs. Camp Habits:**

  *   **"Deserve something vs. being entitled to it" (Distinction 1):** **Real Requirement** (See Requirement 1 above). Essential for moral analysis.
  *   **"What you deserve for what you did vs. what you deserve for who you are" (Distinction 2):** **Real Requirement** (See Requirement 3). These are fundamentally different claims needing separate grounding.
  *   **"Whether desert is prior to institutions" (Distinction 3):** **Real Requirement** (See Requirement 4). A core philosophical divide (e.g., Natural Law vs. Legal Positivism applied to desert).
  *   **"Meritocracy as description vs. goal":** **Crucial Distinction.** The normative use ("should") **is a requirement** (Requirement 7) for any theory aiming to justify meritocracy morally. The descriptive use ("does") is sociology, not philosophy of desert.

  **The Verdict on Normative Meritocracy:**

  *   Can a desert theory underwrite meritocracy "as a goal"? Only **if** it can overcome the control problem and provide a convincing moral argument that rewarding *its specific desert-base* (effort? outcome? attributable agency?) leads to a just or good society.
  *   **The Challenge:** Given the control/circumstance problem, justifying large-scale social distributions (who gets wealth, status, power) based on *desert* becomes extraordinarily difficult. The link between individual deservingness and overall social justice is fragile. Rawls famously argues that desert (beyond legitimate expectations created by just institutions) *cannot* be the foundation of distributive justice precisely because individuals don't ultimately deserve their starting advantages. If the control problem is insurmountable (Hard Incompatibilism), normative meritocracy based on foundational desert is **impossible**. If desert shrinks (Compatibilism), normative meritocracy might be justified only weakly and locally within specific institutional contexts focused on recognizing attributable agency, not as a grand societal principle.

  **In Short:** The control requirement collides head-on with the reality of unchosen endowments and luck. For foundational desert, this collision is likely **fatal**. What remains is either nothing (Hard View) or a severely restricted concept focused on recognizing attributable agency within specific contexts, unable to bear the weight of justifying large-scale meritocratic distributions (Compatibilist View). Normative meritocracy, as a grand ideal grounded in pure desert, likely collapses under this weight.
