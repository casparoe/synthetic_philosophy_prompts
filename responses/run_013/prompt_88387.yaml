            If Net ΔS <= 0 and Net ΔP >= 0 and (Net ΔS < 0 or Net ΔP > 0):
               Approve.
            Else if Net ΔS > 0 and Net ΔP >= 0:
               If Net ΔP >= 2 * Net ΔS: 
                   Approve.
               Else:
                   Reject.
            Else if Net ΔS < 0 and Net ΔP <= 0:
               If |Net ΔS| >= 2 * |Net ΔP|:   # which is -Net ΔS >= 2 * (-Net ΔP)  [since Net ΔP is negative]
                   Approve.
               Else:
                   Reject.
            Else:   # This includes:
                    # Net ΔS>0 and Net ΔP<0 -> reject
                    # Net ΔS=0 and Net ΔP=0 -> reject
                    # Net ΔS=0 and Net ΔP<0 -> reject
                    # Net ΔS>0 and Net ΔP=0 -> reject
                    # Net ΔS<0 and Net ΔP>0 -> this is covered by the first condition (net ΔS<0 and net ΔP>0: then both conditions are satisfied? Actually, net ΔS<0 and net ΔP>0: then net ΔS<=0 and net ΔP>=0 and at least one non-zero -> approve)
               Reject.

          But note: the first condition includes the case Net ΔS<0 and Net ΔP>0 -> approve.

          Actually, we can restructure:

            Condition 1: Net ΔS <=0 and Net ΔP>=0 and (Net ΔS <0 or Net ΔP>0) -> approve.

            Condition 2: Net ΔS>0 and Net ΔP>=0 and Net ΔP>=2*Net ΔS -> approve.

            Condition 3: Net ΔS<0 and Net ΔP<=0 and |Net ΔS|>=2*|Net ΔP| -> approve.

            Otherwise: reject.

          So the example of Patient A and B: 
               Net ΔS = +1, Net ΔP = +2 -> condition 2: 2>=2*1 -> true -> approve.

          This might be uncomfortable.

          To avoid this, we might require that no patient is made worse off? But then we would never do any trade that harms one to benefit another. That would be very restrictive and might prevent many beneficial interventions.

          We leave it as is, acknowledging that the band allows such trades.

   9. The procedure stipulates T in the functional capacities. We do not derive T from first principles; it is defined by the four capacities.

  10. Where it will misfire:

      - If the functional capacities are not measurable (e.g., in patients with dementia or severe mental illness), we may misclassify above/below T.
      - The level system is crude and may not capture the full experience.
      - The band (2:1) is arbitrary and may lead to uncomfortable trades.

   Now, we write the procedure step-by-step for the committee meeting.

  **Procedure for Analgesia Stewardship Committee**

  **Pre-requisites:**
  1. The committee has pre-defined the functional capacities that define threshold T: 
     - Capacity to form and pursue projects.
     - Capacity to sustain social connections.
     - Capacity to maintain basic bodily integrity.
     - Capacity to experience life as one's own.
  2. The committee has pre-defined the levels for suffering above T and pleasure above T:
     - Suffering levels: 
          S0: No suffering above T (baseline)
          S1: Mild suffering (noticeable but does not interfere with functions)
          S2: Moderate suffering (interferes with some functions but not the core capacities)
          S3: Severe suffering (but still above T, i.e., core capacities are intact)
     - Pleasure levels:
          P0: Neutral (no pleasure)
          P1: Mild pleasure
          P2: Moderate pleasure
          P3: High pleasure
  3. The committee has set the band: 
     - For a net increase in suffering (above T) and net increase in pleasure: require net pleasure increase >= 2 * net suffering increase.
     - For a net decrease in pleasure and net decrease in suffering: require net suffering decrease (in absolute value) >= 2 * net pleasure decrease (in absolute value).

  **Meeting Procedure (45 minutes):**

  1. **Case Presentation (5 minutes):** 
     - Present the intervention and the affected patient(s) (including the opportunity cost group).

  2. **Step 1: Identify Affected Groups (2 minutes):**
     - List the patients/groups:
          a. Direct beneficiaries of the intervention.
          b. Patients who would have received the resources if the intervention is not approved (opportunity cost group).

  3. **Step 2: Threshold T Assessment (15 minutes):**
     - For each patient in both groups, assess whether the patient is/will be below T or above T in the following scenarios:
          a. If the intervention is approved.
          b. If the intervention is not approved.
     - Use the four functional capacities. Rely on patient-reported outcomes and ethics consult note.
     - If there is insufficient evidence, table the decision and request more information (this ends the meeting for this case).
     - Ask: 
          - "In the relevant scenario, does the patient have the capacity to form and pursue projects?" 
          - "Does the patient have the capacity to sustain social connections?"
          - "Does the patient have the capacity to maintain basic bodily integrity?"
          - "Does the patient experience life as their own?"
     - If any patient is below T in either scenario, note which scenario and why.
     - Decision rules for step 2:
          a. If the intervention lifts at least one patient above T (compared to the scenario without the intervention) and does not leave any patient below T in either scenario, then **approve** and stop.
          b. If the intervention leaves any patient below T (in the scenario with the intervention) and that patient would not be below T without the intervention, then **reject** and stop.
          c. If the intervention does not lift any patient above T and leaves no patient below T (in either scenario, compared to the alternative), then proceed to step 3.
          d. If the intervention does not lift any patient above T but without the intervention a patient is below T and the intervention does not help them, then we must also consider if the intervention diverts resources that could have been used to lift that patient. If diverting resources prevents lifting that patient, then **reject**. Otherwise, proceed to step 3.

  4. **Step 3: Above-T Trade-off Assessment (20 minutes):**
     - For each patient in both groups, estimate the change in suffering level and pleasure level caused by the intervention (compared to no intervention).
     - Sum the changes to compute:
          Net ΔS = total change in suffering (remember: improvement is negative, worsening positive)
          Net ΔP = total change in pleasure (improvement positive, worsening negative)
     - Apply the following rules:
          a. If Net ΔS <= 0 and Net ΔP >= 0 and (Net ΔS < 0 or Net ΔP > 0): **approve**.
          b. If Net ΔS > 0 and Net ΔP >= 0 and Net ΔP >= 2 * Net ΔS: **approve**.
          c. If Net ΔS < 0 and Net ΔP <= 0 and |Net ΔS| >= 2 * |Net ΔP|: **approve**.
          d. Otherwise: **reject**.

  5. **Documentation and Sign-off (3 minutes):**
     - The committee records the decision and the reasoning.
     - The committee's recommendation is sent to the Chief Medical Officer (CMO) who may veto (but not amend) within 24 hours. If vetoed, the intervention is rejected.

  **What the procedure cannot do:**
     - Handle cases where functional capacities cannot be assessed.
     - Account for long-term or indirect effects beyond the immediate evidence.
     - Override the lexical priority of T (so it will always prioritize bringing patients above T).

  **Run case (c) for an uncomfortable conclusion:**
     We design a case: 
          Intervention: Provide an expensive pleasure-enhancing treatment (e.g., a virtual reality system for immersive positive experiences) to a patient with moderate chronic pain (above T) who is currently at S1 and P1. The cost requires discontinuing a mild analgesic for another patient (also above T) who then moves from S0 to S1 (no change in pleasure).

     Affected patients:
          Patient A (gets VR): 
              Without intervention: S1, P1.
              With intervention: S1, P3.  (so ΔS=0, ΔP=+2)
          Patient B (loses mild analgesic):
              Without intervention: S0, P0.
              With intervention: S1, P0.  (so ΔS=+1, ΔP=0)

     Net ΔS = (0 for A) + (1 for B) = +1.
     Net ΔP = (2 for A) + (0 for B) = +2.

     Step 2: Both patients are above T (moderate chronic pain and mild pain are above T). So we go to step 3.

     Step 3: 
          Condition b: Net ΔS>0 (1) and Net ΔP>=0 (2) -> now check if 2 >= 2*1 -> 2>=2 -> true. So we approve.

     This is uncomfortable because we are causing suffering to Patient B (who did not consent) to enhance the pleasure of Patient A. The procedure allows it because the band condition is met. The committee might feel this is exploitative.

     This illustrates a limitation: the procedure does not require patient consent or consider fairness, only aggregate effects within the band.
