  ### Lexical Threshold Negative Utilitarianism Decision Procedure for Analgesia Stewardship Committee

  **Core Principles**  
  1. **Lexical Priority of Suffering**: Suffering below threshold \( T \) (defined by loss of core functional capacities) must be alleviated first. No pleasure gains can compensate for suffering below \( T \).  
  2. **Two-Ledger System**:  
     - **Suffering Ledger**: Must be "cleared" (all patients above \( T \)) before consulting the pleasure ledger.  
     - **Pleasure Ledger**: Above \( T \), bounded trade-offs between suffering reduction and pleasure gain are permitted (1:2 ratio; 1 unit of suffering increase requires ≥2 units of pleasure gain).  
  3. **Threshold \( T \) Definition**: Not numerical. Defined by loss of ≥1 core functional capacity:  
     - Form/pursue life projects,  
     - Sustain social connections,  
     - Maintain basic bodily integrity (e.g., hygiene, mobility),  
     - Experience life as one’s own (no dissociation/alienation).  
  4. **Evidence Sources**: Ethics consult notes, patient-reported outcomes (e.g., pain scales, quality-of-life surveys). No formal cost-effectiveness data.

  ---

  ### Decision Procedure (45-Minute Meeting Flow)

  #### **Step 1: Define Affected Groups** (5 mins)  
  - **Question**: "Which patients/groups are directly affected by this intervention, and which are indirectly affected via resource reallocation (opportunity cost)?"  
  - **Evidence**: Ethics note must specify groups (e.g., "Group A receives drug X; Group B loses funding for drug Y").  
  - **Stop if**: Groups are undefined → **No decision** (tabled for refinement).

  #### **Step 2: Suffering Ledger Assessment** (15 mins)  
  - **Question 1**: "Does any affected patient fall **below \( T \) in either scenario** (with or without intervention)?"  
    - **Evidence**: Patient-reported outcomes/clinician assessments of the 4 functional capacities.  
    - **Threshold \( T \) Stipulation**: Committee philosopher interprets capacities; patient advocate ensures lived-experience perspective.  
  - **Decision Rules**:  
    - **If intervention lifts ≥1 patient **above \( T \)** and **no patient is left/pushed below \( T \)**: → **Proceed to Step 3**.  
    - **If intervention leaves/pushes any patient below \( T \)**: → **Immediate NO** (lexical priority violated).  
    - **If no patient is below \( T \) in any scenario**: → **Proceed to Step 3**.  

  #### **Step 3: Pleasure Ledger Assessment** (20 mins)  
  - **Question 2**: "Above \( T \), what are the net changes in suffering and pleasure across all affected groups?"  
    - **Evidence**: Patient-reported outcomes categorized as:  
      - **Suffering Change**: No change (0), mild reduction (−1), moderate reduction (−2), severe reduction (−3); worsening (+1, +2, +3).  
      - **Pleasure Change**: No change (0), mild gain (+1), moderate gain (+2), high gain (+3); loss (−1, −2, −3).  
  - **Trade-Off Rule**: Apply 1:2 ratio (e.g., +1 suffering requires ≥+2 pleasure; −1 pleasure requires ≤−0.5 suffering).  
  - **Decision Rules**:  
    - **Net suffering reduced AND net pleasure increased**: → **YES**.  
    - **Net suffering increased AND net pleasure increased**: → YES **only if** pleasure gain ≥2× suffering increase.  
    - **Net suffering reduced AND net pleasure decreased**: → YES **only if** suffering reduction ≥2× pleasure loss.  
    - **Any other outcome** (e.g., suffering increase with pleasure loss): → **NO**.  

  #### **Step 4: Values-Based Handoff** (5 mins)  
  - **Handoff Condition**: If disagreement on functional capacity assessment (Step 2) or trade-off ratio application (Step 3).  
  - **Process**: Philosopher and patient advocate lead deliberation. If unresolved → **No consensus**. Decision deferred to next meeting.  

  #### **Sign-Off**  
  - Committee recommends decision. Chief Medical Officer (CMO) may **veto within 24 hours** but **cannot amend**. Veto requires written justification.  

  #### **What the Procedure Cannot Do**  
  - Quantify \( T \) cardinally (relies on qualitative capacity loss).  
  - Handle long-term/societal impacts (e.g., opioid epidemic risks).  
  - Override lexical priority (e.g., permit suffering below \( T \) for aggregate pleasure).  

  ---

  ### Case Applications  

  #### **Case (a): High-Dose Opioid for Terminal Cancer**  
  - **Scenario**: Severe intermittent pain; opioid shortens life by days.  
  - **Step 1**: Affects only the cancer patient.  
  - **Step 2**:  
    - Without opioid: Pain episodes → loss of bodily integrity/social capacity → **below \( T \)**.  
    - With opioid: Pain controlled → **above \( T \)**. Life shortening does not cause suffering below \( T \) (death ≠ suffering).  
    - **Outcome**: Intervention lifts patient above \( T \) → **Proceed to Step 3**.  
  - **Step 3**:  
    - Suffering change: Severe reduction (−3).  
    - Pleasure change: Sedation may reduce pleasure (−1).  
    - Net: Suffering reduced (−3), pleasure reduced (−1).  
    - Trade-off: Suffering reduction (3) > 2× pleasure loss (2) → **YES**.  
  - **CMO Sign-off**: Likely upheld.  

  #### **Case (b): Rationing Mild Analgesic for Severe Neuropathy**  
  - **Scenario**: Deny mild analgesic to large Group A (chronic back pain) to fund new therapy for small Group B (severe neuropathic pain).  
  - **Step 1**: Group A (mild pain), Group B (severe pain).  
  - **Step 2**:  
    - Group B without intervention: Severe pain → loss of all capacities → **below \( T \)**.  
    - Group A without intervention: Mild pain → no capacity loss → **above \( T \)**.  
    - Intervention lifts Group B above \( T \); Group A remains above \( T \).  
    - **Outcome**: Suffering ledger cleared → **Proceed to Step 3**.  
  - **Step 3**:  
    - Group A: Suffering increase (+1; mild→moderate pain), pleasure unchanged (0).  
    - Group B: Suffering reduction (−3; severe→mild pain), pleasure unchanged (0).  
    - Net: Suffering reduced (−2), pleasure unchanged (0).  
    - **YES** (suffering reduced, no pleasure loss).  
  - **CMO Sign-off**: Likely upheld.  

  #### **Case (c): Uncomfortable Trade-Off**  
  - **Scenario**: Fund a luxury comfort intervention (e.g., aromatherapy) for Patient X (mild pain, above \( T \)) by defunding a basic painkiller for Patient Y (moderate pain, above \( T \)).  
  - **Step 1**: Patient X (gains aromatherapy), Patient Y (loses painkiller).  
  - **Step 2**: Both above \( T \) pre/post-intervention (no capacity loss).  
  - **Step 3**:  
    - Patient X: Pleasure gain (+2), suffering unchanged (0).  
    - Patient Y: Suffering increase (+1), pleasure unchanged (0).  
    - Net: Suffering increased (+1), pleasure increased (+2).  
    - Trade-off: Pleasure gain (2) ≥ 2× suffering increase (2) → **YES**.  
  - **Why Uncomfortable?**  
    - Permits degrading trade: Mild pleasure for one at cost of worsened pain for another.  
    - **Procedure Misfire**: Fails to capture exploitation (no "fairness" variable). Relies solely on aggregate ledger math.  
  - **Values Handoff?** Yes—if committee rejects trade-off as unethical, philosopher/advocate must arbitrate.  

  ---

  ### Limitations & Misfires  
  - **\( T \) Stipulation**: Functional capacities are binary (present/absent), ignoring gradations (e.g., partial project pursuit).  
  - **Misfires**:  
    - **False Negatives**: Interventions that alleviate suffering below \( T \) but with high pleasure loss (e.g., life-saving surgery with severe side effects) rejected if pleasure loss breaches ratio.  
    - **False Positives**: Exploitative trades (Case c) permitted due to ledger aggregation.  
  - **Mitigation**: Philosopher flags values conflicts; committee may override ledger math with consensus (document rationale).  

  **Final Output**: Protocol ensures suffering below \( T \) is non-negotiable, while constraining above-\( T \) trade-offs. Reusable for monthly reviews with CMO oversight.
