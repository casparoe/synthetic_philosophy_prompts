  I chair the analgesia stewardship committee at a mid-sized teaching hospital. Once a month we must decide whether to approve, restrict, or deny treatments and policies that trade pain relief against other goods: opioids that relieve severe pain but carry sedation and dependence risks; expensive comfort interventions that produce mild benefits for many; and rationing decisions that leave some patients with low-level chronic pain untreated so that a smaller group with severe pain can receive a new therapy. We currently decide ad hoc. I want a reusable decision procedure grounded in lexical threshold negative utilitarianism, with an explicit treatment of the commensurability of pleasure and pain. To make the task tractable, assume the following framework, which I am introducing: suffering and pleasure are not placed on a single cardinal scale. Instead, suffering has lexical priority up to a threshold T; no amount of pleasure can compensate for additional suffering below T. Above T, a bounded exchange rate between suffering and pleasure is permitted. T is not a number but a boundary defined by a set of functional capacities—the capacity to form and pursue projects, to sustain social connection, to maintain basic bodily integrity, and to experience a life as one’s own. The procedure should operationalize a two-ledger audit: one ledger records suffering-states, the other records pleasure-states; the suffering ledger must be cleared to T before the pleasure ledger is consulted, and above T the committee may trade between ledgers only within a pre-declared band. Write the procedure for my committee to run in a 45-minute meeting. The committee includes two clinicians, a pharmacist, a philosopher, and a patient advocate; it will use only a standard ethics consult note and patient-reported outcomes, with no formal cost-effectiveness modeling. Specify: the questions to ask in order; what counts as sufficient evidence for each; where the procedure stops with a no; where it sto