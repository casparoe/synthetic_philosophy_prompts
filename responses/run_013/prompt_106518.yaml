prompt: |-
  I sit on a working group at a large secondary school that is rewriting the 'learning dispositions' section of our end-of-year reports — the part where a teacher, alongside the grade, is asked to assert things like 'perseveres when a problem gets hard', 'contributes confidently in group discussion', or 'does not yet work independently'. Two years of complaints have convinced me we are asking teachers to make claims their evidence cannot support: one set of parents produced a child we had described as lacking confidence in class and who runs a lunchtime club with thirty members, and a selective school has asked us to justify a report saying a pupil had 'become a diligent worker' in Year 11 after two years of disengagement. The awkwardness is not that individual judgements are sometimes wrong; it is that we have no procedure for making them at all. A teacher sees each pupil four hours a week in a single setting, gets roughly ten minutes per pupil to write, has no training in any of this, and knows the report is signed off by the head and read by parents and admissions tutors. From my own reading, the trouble starts with the simple conditional analysis — a thing is disposed to produce a manifestation in conditions C exactly when, if it were placed in C, it would produce it — because the test conditions can be finkish (the disposition is genuinely present now, but the arrival of the conditions would itself destroy it), masked (the conditions obtain, but something blocks the manifestation while the disposition is left intact), or the manifestation can be mimicked (it occurs, but something other than the disposition produces it). A disposition can also be present and never manifested in anything we happen to see, which is roughly our situation with every pupil.

  Please turn this into a procedure a teacher can actually run. I want the questions in the order they should be asked, what counts as a sufficient answer to each, what the teacher does when an answer is missing, mixed, or would take a term to get, and where the procedure stops with a no and the claim is simply not written. It must be usable in ten minutes by someone who has not read any philosophy, and it must be explicit about the points where the remaining question is no longer evidential but a value judgement — how much weight the report should carry, how much risk of a false claim we are prepared to accept, what counts as a fair opportunity for the disposition to show itself. Include a step for the mimic case, since a pupil can earn good reports for reasons that have nothing to do with the disposition, and a step for the common case where we cannot observe the pupil in the conditions the claim is about. Then run the procedure on three of ours. Amara never speaks in English seminar and three teachers have written that she lacks confidence in group settings, though she runs the chess club and chaired the meetings that organised last term's charity tournament. Devon was disengaged for two years and now works hard, but only since he joined a tutor group whose tutor checks his planner every morning. Yusuf is described by three teachers as collaborative and generous with his time, and the behaviour they cite is entirely confined to the weeks when group marks are awarded. Finish by telling me what the procedure cannot do, and where it will give the working group an answer it does not want to hear — I expect at least one of those three. I do not need a reading list or attributions; I need something the staff can follow.
reasoning: |-
  Hmm, the user is part of a working group at a secondary school that's rewriting their "learning dispositions" section for end-of-year reports. They've identified several problems with the current approach: teachers are making claims without sufficient evidence, there's no standardized procedure, and real-world examples show how these judgments can be misleading (like Amara who runs clubs but is labeled unconfident, Devon who works hard only with supervision, and Yusuf who's collaborative only when graded).

  The core issue is philosophical - dispositions aren't straightforward to observe because of concepts like finkish conditions (where the test itself changes the disposition), masking (where something blocks the manifestation), and mimicry (where behavior looks like a disposition but isn't). The user wants a practical, philosophy-free procedure that teachers can apply in 10 minutes per student.

  Key requirements for this procedure:
  1. Must be usable by untrained teachers in 10 minutes
  2. Needs clear steps with decision rules
  3. Must handle evidentiary gaps and value judgments explicitly
  4. Requires specific handling of mimicry and unobservable conditions
  5. Should output "no claim" when evidence is insufficient
  6. Must demonstrate application to the three cases
  7. Should acknowledge limitations and uncomfortable outcomes

  For the procedure design, I need to focus on observable evidence while acknowledging its limits. The steps should flow from easiest to hardest: starting with direct observations, then checking for counterexamples (like Amara's chess club), then considering mimicry and context-dependence. Each step needs clear "sufficient evidence" thresholds and "no claim" exit points.

  The value judgment points need to be explicit - especially regarding what constitutes "enough" evidence given the high stakes of reports. For mimicry cases, the procedure should require evidence that the behavior persists without external incentives. For unobservable conditions, it should default to "no claim" unless there's strong proxy evidence.

  Applying this to the cases:
  - Amara: Should challenge the "lacks confidence" claim due to strong counterevidence in other settings, suggesting a context-specific issue rather than global trait.
  - Devon: The diligence claim fails because it's dependent on external scaffolding - the disposition isn't yet internalized.
  - Yusuf: Collaboration looks mimicked by grading incentives - without evidence of the behavior persisting without marks, no claim can be made.

  The uncomfortable truth for the working group will be that many current claims (like Devon's) won't survive scrutiny - but that's precisely why they need this procedure. The limitations section should emphasize that dispositions are probabilistic tendencies, not guarantees, and that brief school observations can't capture the full picture.

  The procedure must stay pragmatic - no philosophical jargon, just clear checkpoints. Time management is crucial, so steps that require deep reflection (like weighing contradictory evidence) should come later, with early exits when evidence is clearly insufficient.
answer: |-
  Here's a practical, evidence-driven procedure for assessing learning dispositions, designed for a 10-minute per-pupil window. It prioritizes observable evidence and explicitly flags value judgments.

  **Procedure: Disposition Assessment Protocol (DAP)**  
  *Use only for dispositions explicitly defined in your school policy (e.g., "perseverance," "confidence in group discussion").*

  1.  **Question 1: Did I directly observe this specific behavior under typical conditions?**  
      *   *Sufficient answer:* At least **3 clear, specific incidents** of the behavior (e.g., "Asked 2 clarifying questions during group work on May 10th," "Re-did flawed experiment without prompting on April 22nd").  
      *   *Missing/Mixed:* Skip to Question 2. If only vague impressions ("sometimes," "generally"), treat as missing.  
      *   *Time issue:* If recalling specifics takes too long, treat as insufficient evidence → **Stop. No Claim.**  
      *   *Value Judgment Point:* Definition of "typical conditions" and "clear incident" (school must define examples).

  2.  **Question 2: Is there strong counter-evidence from my class or another reliable source?**  
      *   *Sufficient answer:* **Yes** (e.g., "Never volunteers in my class," "Head of Year notes frequent off-task behavior in study hall").  
      *   *Action:* If strong counter-evidence exists → **Stop. No Claim** (or potentially claim the *opposite* if overwhelming, but avoid this if possible).  
      *   *Sufficient "No" answer:* No credible reports or observations contradicting the disposition. Absence of counter-evidence is *not* proof.  
      *   *Mixed:* Conflicting reliable reports? → **Stop. No Claim.**  

  3.  **Question 3: Could the behavior be MIMICKED? (Is there an obvious alternative cause?)**  
      *   *Sufficient "No" answer:* Behavior occurs **without clear external prompts/triggers** linked to the desired disposition (e.g., participates without teacher calling on them, perseveres on tasks not for high stakes).  
      *   *Sufficient "Yes" answer:* Behavior *only* occurs when:  
          *   High-stakes rewards/grades are present.  
          *   Specific authority figure is watching/directing.  
          *   Task is unusually easy or high-interest for this pupil.  
      *   *Action if "Yes" or Uncertain:* → **Stop. No Claim.** Disposition not demonstrated.  
      *   *Value Judgment Point:* Deciding what counts as a "mimicking" trigger (school must provide examples).  

  4.  **Question 4: Is the disposition CONTEXT-DEPENDENT? (Can I observe the required conditions?)**  
      *   *Sufficient "Yes" answer:* The necessary conditions **occurred frequently** in my class/setting (e.g., for "group discussion," there were regular structured discussions; for "perseverance," challenging problems were offered).  
      *   *Sufficient "No" answer:* The required conditions **rarely or never arose** (e.g., few truly challenging problems given, no group discussions held).  
      *   *Action if "No" (Conditions Rare):* → **Stop. No Claim.** Cannot assess disposition fairly.  
      *   *Action if "Yes" (Conditions Present):* Proceed to Question 5.  
      *   *Value Judgment Point:* Defining "frequent" opportunity (school must set minimum expectation, e.g., 5+ opportunities per term).  

  5.  **Question 5: Is the evidence ROBUST and CONSISTENT enough to generalize?**  
      *   *Sufficient answer:* **Yes** only if:  
          (a) Clear direct observations exist (Q1), AND  
          (b) No strong counter-evidence (Q2 passed), AND  
          (c) No mimicking identified (Q3 passed), AND  
          (d) Conditions were present (Q4 passed), AND  
          (e) Behavior was observed **consistently** (not just isolated incidents) across different tasks/settings *within my class*.  
      *   *Action if Yes:* **Write the claim** (stick to the defined disposition language).  
      *   *Action if No (any doubt):* → **Stop. No Claim.**  
      *   *Value Judgment Point:* Defining "consistent" and "robust" (school must decide threshold, e.g., 3+ incidents across 3+ different contexts/tasks).  

  **Summary Flow:** Q1 → Q2 → Q3 → Q4 → Q5. "**Stop. No Claim.**" exits the procedure at any point if evidence is insufficient. Only proceed if all prior checks are passed. **"No Claim" is a valid and responsible outcome.**

  ---

  **Application to Case Studies:**

  1.  **Amara ("Lacks confidence in group settings"):**
      *   Q1: Teacher observes no contribution in English seminars → *Passes (but for opposite claim?)*. Wait, claim is *about* lacking confidence.
      *   Q2: **STRONG COUNTER-EVIDENCE** (Runs club, chaired meetings). This is credible evidence contradicting a *global* lack of confidence. → **Stop. No Claim.** for "lacks confidence in group settings". *Procedure forces recognition: the evidence doesn't support a broad claim. Maybe "confidence varies significantly by context" is true, but that's not the claim asked for.*

  2.  **Devon ("Become a diligent worker"):**
      *   Q1: Teacher observes hard work now → *Passes.*
      *   Q2: Past disengagement is counter-evidence, but *current* observations might override if consistent → *Passes (cautiously).*
      *   Q3: **MIMICKING?** Behavior is *entirely dependent* on tutor checks (external prompt). → **Stop. No Claim.** for "diligent worker". *Procedure flags the scaffolding as mimicking true diligence. Claim might be "works effectively with daily tutor support".*

  3.  **Yusuf ("Collaborative and generous"):**
      *   Q1: Teacher observes collaborative behavior → *Passes.*
      *   Q2: No reported counter-evidence → *Passes.*
      *   Q3: **MIMICKING?** Behavior is *only* observed during group marks (external reward). → **Stop. No Claim.** for "collaborative and generous". *Procedure catches the dependency on the incentive. The behavior is real but likely extrinsically motivated.*

  ---

  **What the Procedure CANNOT Do:**

  1.  **Guarantee Accuracy:** It reduces error but can't eliminate it. Limited observation time remains a constraint.
  2.  **Prove Intrinsic Motivation:** It can only infer dispositions from observable behavior, filtering out obvious mimicking. True intrinsic motivation is inferred, not proven.
  3.  **Assess Dispositions in Unobserved Contexts:** It explicitly stops if the required conditions weren't present. It won't speculate about how a pupil *might* behave elsewhere.
  4.  **Make Nuanced Distinctions:** It outputs "Claim" or "No Claim" based on thresholds. It won't capture subtle shifts or context-specific strengths (e.g., "confident in practical work but not in theory").
  5.  **Replace Professional Judgment Entirely:** The value judgment points (defining conditions, consistency, mimicking) require school-level policy decisions. Teachers still apply these definitions.

  **Where it Gives Unwanted Answers (for the Working Group):**

  1.  **"No Claim" Will Be Frequent:** Applying this rigorously, especially Q3 (Mimicking) and Q4 (Conditions), will likely lead to **many more "No Claim" outcomes** than current practice. *This is the core "unwanted" answer.* Parents/selective schools might want claims, but the procedure prioritizes evidence.
  2.  **Context is King (Devon & Yusuf):** The procedure rejects claims where behavior is demonstrably dependent on external control (Devon) or rewards (Yusuf). This challenges the desire to report apparent "improvement" or "positive behavior" if it's not demonstrably internalized.
  3.  **Counter-Evidence Trumps (Amara):** It forces the school to confront that a single classroom context might be insufficient or misleading for a broad disposition claim. Ignoring strong evidence from other contexts is deemed invalid.
  4.  **"Diligence" etc. Require Independence:** The procedure will likely reject claims like "diligent" or "independent" learner if significant scaffolding is always present (Devon). This might clash with a desire to recognize effort within support systems.

  **Key Output for Staff:** This procedure shifts the focus from *making a claim* to *justifying a claim with specific, filtered evidence*. **"No Claim" is not failure; it's intellectual honesty.** It protects teachers, the school, and ultimately pupils from misleading statements. The working group must decide if they value accuracy over coverage. The discomfort with Devon's case ("But he *is* working hard now!") is exactly where the procedure's rigor is most valuable – it highlights the dependency.
