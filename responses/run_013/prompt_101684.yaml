answer: |-
  The Chronos Clinic smelled like green tea and ozone. Marco winced as the neural headset settled onto his temples for the fourteenth time. "Feels tighter," he mumbled.

  "Standard calibration, Mr. Rossi," Dr. Vance chirped, her smile polished like the clinic’s chrome walls. "Ready for Sector Seven: Emotional Regulation and Long-Term Planning. This one’s a biggie." She tapped her tablet. "Remember, you won’t feel a thing. Just stay relaxed, maybe think about that fishing trip you described?"

  Marco grunted. He’d described it *a lot*. To Vance, to the intake AI, in his mandatory pre-procedure journals. *Me and Dad, Lake Winnipesaukee, 2035. Perfect stillness. The tug on the line. Pure peace.* It *was* a good memory. Lately, it felt like his *only* memory, polished to a high shine.

  The hum started, low and resonant. Marco closed his eyes. No flicker. No seam. Just a familiar, almost pleasant, pressure behind his forehead. Like a thought forming. Vance watched her monitors, satisfaction radiating. "Beautiful integration. Predictive modeling syncing perfectly with residual biological activity. Continuity guaranteed."

  Across the waiting room, Elise Rossi chewed her thumbnail raw. She watched her brother through the observation glass. Post-Session Thirteen Marco sat ramrod straight, reading a dense treatise on quantum entanglement. Pre-Chronos Marco slouched, devoured pulp sci-fi, and argued passionately about bad plot twists. This Marco… he still *looked* like her brother. Mostly. But the eyes held a new, unnerving clarity. His jokes were sharper, cleaner, landing perfectly every time. His messy passion for restoring vintage motorcycles had transformed into a highly efficient, spreadsheet-managed hobby.

  "He’s turning into a damn caricature of himself," Elise whispered to the clinic’s sterile air.

  Later, at Marco’s pristine condo, the rift widened. Elise gestured wildly at the framed blueprints of his latest, flawlessly executed bike restoration. "Marco, look at this! It’s… perfect. *Too* perfect. Like it rolled off a factory line you designed in your head. Where’s the grease stain on the blueprint? Where’s the swearing when the carburetor fights back?"

  Marco smiled, a smooth, calibrated expression. "Efficiency isn’t a flaw, Elise. The predictive models optimize based on my stated goals and self-reported satisfaction. My stated goal was a perfect restoration. Ergo…" He gestured at the gleaming machine.

  "But *you* loved the fight!" Elise insisted, her voice cracking. "The frustration, the surprise, the happy accidents! The *you* who started this process would never have settled for… for predictive perfection!"

  "The *me* who started this," Marco said calmly, pouring her a glass of water with precise movements, "was burdened by inefficiency, emotional volatility, and cognitive drift. The models, trained on my own neural patterns and self-descriptions, have simply… clarified me. Filtered out the noise. I still feel the satisfaction of completion, Elise. Deeply. It’s just… cleaner."

  "Cleaner?" Elise stared at him. "It’s *lossy*, Marco! They told you! Each chunk is a *prediction*, not a copy! Trained on what you *said* you felt, what you *thought* you were! Of course it drifted! It predicted the Marco you *aspired* to be, not the messy, wonderful lump you actually were!"

  Marco’s smile didn’t falter. It was his most frequent expression now. "Continuity is subjective, Elise. I feel continuous. I remember Winnipesaukee with perfect clarity. I remember Dad’s laugh. I remember *you*, stealing my comics. The clinic’s process is seamless. There is no ‘then Marco’ and ‘now Marco.’ There’s just Marco. Optimized."

  Elise slammed the water glass down. "Bullshit! That’s what they sold you! ‘Continuity Guaranteed!’ But it’s a lie built on forecasting! I’m filing the injunction tomorrow. We stop at seventy-three percent. We get the lawyers to argue the remaining twenty-seven percent of wetware… *that’s* the real you. Or… or a co-owner. Something! Before you’re fully replaced by this… this polished forecast!"

  The sterile condo seemed to hold its breath. Marco studied his sister, the faintest hint of something unreadable – perhaps simulated concern, perhaps the ghost of genuine confusion – flickering behind the optimized clarity of his gaze.

  "Elise," he said, his voice smooth as the clinic’s hum, "where would you even draw that line? At what percentage does ‘Marco’ stop? Fifty? Sixty? The moment the first predictive chunk went in? Or…" He paused, tilting his head with unnerving precision. "…was the line always just an illusion? If I act like Marco, remember like Marco, believe I *am* Marco… what factual difference does the substrate make?"

  Elise had no answer. Only the cold certainty that the brother who once wrestled with carburetors and messy emotions was fading, replaced chunk by predictive chunk by a man who saw friction as inefficiency and saw himself with terrifying, simplified clarity. The question hung thick in the air-conditioned space, heavier than the chrome and glass: When, if ever, did the original Marco Rossi leave the building? Or was the question itself just noise, already filtered out by the relentless, self-fulfilling prophecy of the predictive models? The only sound was the quiet hum of Marco’s perfectly restored vintage bike, sitting immaculate in the corner, and the frantic, unanswered pounding of Elise’s heart.
