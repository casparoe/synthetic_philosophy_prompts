prompt: |-
  I've got a favour to ask, and it's a bit of an odd one. I run a small seminar on rationality and decision theory for final-year students, and for the last session I want to hand them a short story instead of a problem set, something they'll argue about on the walk home. So what I'd like from you is a piece of fiction built on superrationality, Hofstadter's idea that in a symmetric game you shouldn't ask what's best for me given what the others will probably do, you should ask what rule you'd want every player to follow, on the assumption that anyone reasoning as well as you will land on the same answer you land on. The shape I have in mind is the luring-lottery kind of thing: the pot gets divided among everyone who enters, so the more people play the smaller each share gets, and there's an enormous pull toward being the one clever person who enters while everyone else nobly refrains, which is exactly the thought the whole idea forbids you from having, since the others are running the same calculation you are. Please invent your own version of the game rather than restaging the one everybody has heard, though. Change the payoffs, change who's playing, change what's at stake, put a live tally up on a wall somewhere so the characters can watch the number climb while they dither. The reasoning should be the plot, not a lecture with people stapled to it.

  A few things I care about. Keep the cast small enough that a reader can track who is thinking what, but make the size of the group actually matter, so that the argument which works for eight people in a room doesn't obviously survive being scaled up to a whole city. I want at least one character who works out the symmetry argument properly and pays a real price for it, one who sees it clearly and defects anyway and isn't punished by the story for that, and one who tries the probabilistic move, the claim that the only defensible thing is to enter with some chance rather than decide yes or no at all, and I want that move genuinely tested on the page rather than voiced and then dropped. Nobody should get to explain the theory. If the theory has to show up it should come out of two people half-winning an argument, both of them a bit wrong.

  And I'd like the person running the game to have their own skin in it, ideally to be running it in order to find something out, so that the reader ends up having to decide whether the organiser's move is itself the superrational one or just a con with extra steps. The story can end however it wants, on a defection, on a stalemate, on somebody quietly changing their mind, but please don't tack on a closing paragraph telling me what it all meant. If I want the moral I'll find it myself.

  Format: just the story, continuous prose from start to finish, no headings, no bullet points, no bold, no tables, nothing that looks like an outline. I'll be reading it aloud, so it needs to run like one person talking. Sorry for the length of this, I've definately over-specified it, but the last thing I want is another story where the game is just set dressing and the characters are basically footnotes.
reasoning: |-
  Hmm, the user is asking me to write a short story about superrationality for a rationality seminar. They want a fictional piece centered around a novel version of the luring-lottery concept, where participants face a dilemma about entering a game where the pot gets divided among entrants. 

  The user has very specific requirements: the story needs to illustrate Hofstadter's idea of superrationality without explicitly explaining it, feature a small but scalable group where size matters, include characters who represent different decision-making approaches (symmetry adherent, defector, probabilistic player), and have the game organizer personally invested with ambiguous motives. They want pure narrative prose without any didactic elements or moralizing.

  I need to invent a new game scenario rather than rehashing existing ones. The core tension should come from watching characters reason in real-time as a live tally updates. The organizer's involvement should create meta-uncertainty about whether running the game is itself a superrational act. 

  Key constraints: 
  - No lectures on game theory; all reasoning must emerge through character interactions. 
  - The group size must affect the logic (e.g., arguments that work for 8 people fail for larger groups). 
  - Three character archetypes needed: principled symmetry follower (who suffers), calculating defector (who doesn't get punished), and probabilistic player (whose approach gets properly tested). 
  - Ending must be ambiguous - no moral spelled out.

  For the game design, I'm considering a "Harmony Auction" where participants secretly decide whether to claim a share of communal art funds. A live counter shows how many are entering. The twist: the organizer is also playing. 

  I'll structure it around:
  1. Setup: Organizer (Silas) introduces the game to 7 participants in a gallery, with funds displayed. 
  2. Dilemma: The live tally creates tension as characters reason aloud. 
  3. Character dynamics:
     - Aris: Grasps symmetry but enters anyway (defector)
     - Lena: Commits to symmetry and abstains (pays price)
     - Ren: Advocates random entry (tested when others copy)
  4. Climax: Reveal that Silas abstained, making the defectors feel conflicted.
  5. Ambiguous ending: Silas's journal implies this was his superrational move.

  The prose will use sensory details (flickering tally, clinking glasses) to maintain tension while embedding the reasoning in natural dialogue. Size scalability comes through Lena's realization that symmetry breaks down in larger groups. The organizer's ambiguous motive (journal entry about "testing the frame") invites debate about meta-superrationality.

  I'll avoid any explanatory asides and let the characters' imperfect arguments convey the concepts. The ending stays open with Silas's unreadable smile, leaving readers to debate whether his setup was noble or manipulative.
answer: |-
  The glass case held it: a single, perfect emerald the size of a robin's egg, resting on black velvet. It wasn’t for sale. Silas Vale, the gallery owner, thin and restless as a whippet, stood beside it, tapping a small tablet. On the wall behind him, a large digital display showed two numbers: `TOTAL FUNDS: £1,000,000` and `PLAYERS: 0`. Seven of us stood in a loose semi-circle – Silas’s regulars, art dealers, collectors, a couple of academics like me. The air smelled of old wood and anticipation.

  “Harmony Auction,” Silas announced, his voice tight with suppressed energy. “Simple rules. You each have a button.” He gestured to discreet keypads mounted on plinths around the room. “By midnight tonight, you decide: press, or don’t. If you press, you’re ‘in’. If you don’t, you’re ‘out’.”

  He tapped his tablet. The `PLAYERS` counter flickered to `1`. Silas himself. “I’m playing too. That million? My contribution. My *skin* in the game.” He smiled, sharp. “Here’s the catch. Tomorrow morning, every person who pressed gets an *equal* share. If only I press, I get the whole million. If all eight of us press… well, £125,000 each is still life-changing. But if *nobody* presses… the million vanishes. Poof. Gone. Back into the vault, or donated anonymously, whatever. Unclaimed.”

  He paused, letting the vacuum of potential suck at us. “The display updates live. You’ll see the number climb… or not. Think hard. What’s rational? Midnight deadline. Drinks are on the house.” He vanished towards the bar, leaving the emerald’s cold fire and the glowing counter to do their work.

  Conversation erupted, then died into uneasy murmurs. Aris, the sharpest dealer in the room, sidled up to me, his eyes on the counter, still stubbornly at `1`. “Silas is mad. Or brilliant. If everyone stays out, the money burns. Stupid. But if *I* press, and others don’t… jackpot. Especially if Silas is bluffing about playing.” He glanced towards the bar. “He pressed instantly. Commitment? Or a trick?”

  Lena, a quiet philosophy professor, shook her head. She spoke softly, but everyone nearby leaned in. “It’s symmetric. We’re all in the same boat, reasoning alike. What rule would we *all* want everyone to follow? The only stable point… is everyone pressing. Then we all get a share. Nobody pressing loses everything.”

  “But why *shouldn’t* I defect?” Aris countered. “If everyone else follows your ‘rule’ and presses, and I *don’t*, I get nothing? No! If they all press, I get my share *without* pressing! I save my ‘button press’ for nothing! Best outcome: everyone *else* presses, I stay out. Free money!”

  “But they all think like you!” Lena insisted, her voice rising slightly. “If everyone thinks ‘I’ll be the clever one who stays out,’ then *nobody* presses, and we all get *nothing*. The symmetric outcome is the only one where we don’t collectively shoot ourselves in the foot. We *all* press. We all win smaller, but win.”

  The counter jumped. `PLAYERS: 2`. Heads swivelled. Marcus, the tech investor, raised his glass from across the room with a bland smile. One down. Seven to go.

  Ren, a data scientist, interjected. Lena’s symmetry argument is beautiful, Aris’s defection is tempting… but it’s brittle. If even *one* person defects, Lena’s world crumbles. And Aris, your free ride only works if *everyone else* cooperates perfectly. What’s the chance of that? Especially with Marcus already in?” He pulled out his phone, tapped furiously. “Look, the *only* Nash equilibrium where you’re indifferent to others’ choices is probabilistic. I should press with a *probability* that makes my expected payout, given uncertainty about others, the same whether I press or not. For eight players… let’s see… roughly 87.5% chance I should press. But since we see the counter…”

  The counter jumped again. `PLAYERS: 3`. Then, almost immediately, `4`. Gasps. Two more dealers, looking sheepish but defiant, had pressed simultaneously near the door. The pot per player dropped to £250,000. Still immense.

  Panic flickered. Lena looked pale. “See? Defection starts. The symmetry breaks. Now… now it might cascade. Everyone rushes to get *something*.” Her voice trembled. “But it shouldn’t! If we hold, if we *all* commit to pressing, we lock in £125,000. If we panic and flood in, it drops further!”

  “Hold?” Aris scoffed. “With four already in? Including Silas, who might be playing games? The chance of everyone holding now is zero, Lena. Nil. The rational move *now* is to press. Get my £200,000 share before it dips lower.” He strode purposefully to a keypad and pressed. `PLAYERS: 5`. £200,000 each.

  Lena flinched. “No! Aris, you’re making it *worse*! If we all just… stopped. Now.” She looked desperately at Ren, at me, at the others. “Five is still okay! £200k! If three more come in, it halves again! Please. Think symmetrically!”

  Ren sighed. “Lena, the symmetry is broken. Aris pressed. Marcus pressed early. The others. It’s not a clean slate anymore. My probabilistic model just updated heavily. The expected value of pressing now is sky-high compared to staying out, unless…” He glanced at the remaining three undecideds, including me and Lena. “Unless the last three all abstain. But the chance of *that*… low. Very low.” He walked to a keypad. `PLAYERS: 6`. £166,666 each. He didn’t look happy, just resigned.

  Only Lena and I remained unpressed. And Silas, watching silently from the bar, his tablet face down. The emerald glowed. The counter burned: `6`. The pot per player mocked us. If Lena and I both pressed, it would be £125,000 each. If only one pressed, that one got £142,857. If neither pressed… and the six who had pressed split the million? No. Silas’s rules were clear: only pressers share. If Lena and I didn’t press, the six would still get £166,666 each. The million wouldn’t vanish unless *nobody* pressed. Our abstention now wouldn’t save the pot; it would just mean we got nothing, while the pressers got slightly less per person.

  Lena turned to me, despairing. “It’s over. The cascade happened. But… principle. Symmetry. If I press now, I validate their defection. I become part of the panic. The rule we *should* have followed… it’s ruined, but I can still… not participate.” Her jaw was set. “I’m out.”

  She walked away from the keypads, towards the exit, her shoulders slumped. The price of symmetry, paid in full. £166,666 foregone on principle.

  That left me. And Silas, still at `1`? Or was he bluffing? The counter said `6`. Six pressers. If I pressed, `7`. £142,857. If I didn’t… nothing. The six would still get their £166,666. My abstention would be a purely symbolic loss for me, a tiny gain for each of them. Lena’s sacrifice felt noble and utterly futile. Ren’s probability math screamed at me: press. Aris’s pragmatic greed leered: *Why leave money on the table?*

  I looked at Silas. He met my gaze, utterly unreadable. What was his game? Was pressing instantly his commitment to symmetry? Or a clever nudge to start the panic? Was *running* this his superrational move, testing the frame itself?

  Midnight felt heavy. The gallery lights seemed too bright. I walked to a keypad. The smooth plastic button under my finger felt like a betrayal of Lena, an admission of Ren’s cold logic, a surrender to Aris’s world. I pressed. `PLAYERS: 7`. £142,857. A sigh rippled through the room, mixed with relief and faint disappointment. Aris clapped me on the back.

  Silas stood up. He walked to the central keypad near the emerald. He didn’t press. He just tapped his tablet. The `PLAYERS` counter remained `7`. He hadn’t pressed after all. His initial `1` was just… the setup. He was out.

  Aris’s triumphant grin faltered slightly. “You… you didn’t play? But you pressed!”

  “I registered the game,” Silas said mildly. “I never said registering meant pressing. The display showed the *potential* pool, including my funds. It showed *me* as part of the player count initially. A… framing device.” He looked at the seven of us. “Congratulations. You’ll each receive £142,857. Minus my director’s fee for the event, of course. A modest percentage.” He smiled, that sharp, unreadable smile again. “A fascinating demonstration. Thank you for participating.”

  He walked away, leaving us with the emerald, the silent counter frozen at `7`, and the distinct, unsettling feeling that the real game had been something else entirely. Lena was gone. Aris was already calculating his windfall. Ren looked thoughtful, pulling out his phone again. I stared at the spot where Silas had stood, wondering what rule, if any, he had been playing by, and whether his abstention was the ultimate superrational move, or simply the con artist’s final flourish. The silence stretched, thick with unspent arguments and the faint, cold gleam of the stone.
