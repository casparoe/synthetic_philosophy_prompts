answer: |-
  Here's a systematic disambiguation of "There's no disputing about taste" (TNDT), ordered from least to most radical, with verdicts and analysis of the commenters' positions:

  ### Disambiguation of TNDT Claims
  1.  **Descriptive Ineffectiveness (D1)**:  
      *   *Claim*: Disputes about taste (e.g., arguing "X is beautiful") are typically unproductive or unresolvable due to persistent disagreement or lack of shared criteria.  
      *   *Verdict*: **Platitude**. Empirical observation confirms aesthetic debates often deadlock without changing minds.  

  2.  **Norm of Assertion (N1)**:  
      *   *Claim*: Asserting an aesthetic judgment is inappropriate unless the audience has direct experience of the object (e.g., "This novel is great" is improper if the listener hasn’t read it).  
      *   *Verdict*: **Substantive but defensible**. Rooted in the idea that aesthetic properties require *acquaintance* to be meaningfully discussed (e.g., Moore, Wittgenstein).  

  3.  **No Compelling Reasons (E1)**:  
      *   *Claim*: Aesthetic judgments cannot be supported by reasons that *logically compel* assent from a rational interlocutor, even with shared experience.  
      *   *Verdict*: **Substantive but defensible**. Aesthetic reasons (e.g., "The pacing is masterful") persuade but don’t deductively force agreement (Kant’s *Critique of Judgment*).  

  4.  **Justification Requires Firsthand Experience (J1)**:  
      *   *Claim*: One cannot be *epistemically justified* in holding an aesthetic belief solely based on testimony; direct experience is necessary.  
      *   *Verdict*: **Substantive and defensible**. Dominant view in aesthetics (e.g., Kant, Hume). Testimony may *suggest* but cannot *justify* "This is beautiful."  

  5.  **Expressivism (M1)**:  
      *   *Claim*: Aesthetic judgments (e.g., "X is beautiful") express non-cognitive attitudes (e.g., "I approve of X") rather than truth-apt propositions.  
      *   *Verdict*: **Substantive and contested**. Defended by some (e.g., Ayer), but faces challenges accounting for normative dimensions of criticism.  

  6.  **Relativism (M2)**:  
      *   *Claim*: Aesthetic truths are relative to cultures, eras, or individuals (e.g., "X is beautiful for me/group A, not for you/group B").  
      *   *Verdict*: **Substantive and contested**. Coherent but clashes with intuitions about cross-cultural criticism (e.g., condemning kitsch).  

  7.  **Subjectivism (M3)**:  
      *   *Claim*: Aesthetic properties reduce entirely to subjective responses (e.g., "Beautiful" = "I like it").  
      *   *Verdict*: **False** (philosophically mainstream). Fails to distinguish *liking* from *judging as beautiful* (e.g., I can like a bad movie).  

  8.  **Anti-Realism (M4)**:  
      *   *Claim*: There are no mind-independent aesthetic facts; aesthetic predicates don't refer to objective properties.  
      *   *Verdict*: **Substantive and contested**. Major divide in meta-aesthetics (Realism vs. Anti-Realism), with strong arguments on both sides.  

  ---

  ### Analysis of the Commenters
  - **Commenter A**: "A recommendation is evidence about the recommender’s dispositions."  
    *   *Licensed by*: **Expressivism (M1)**, **Subjectivism (M3)**, or **Relativism (M2)**. If judgments express attitudes or are subjective/relative, recommendations reveal personal taste.  
    *   *Likely intended reading*: **M1 or M3**. They treat "This is good" as equivalent to "I like it."  

  - **Commenter B**: "A recommendation is worthless because nobody can tell you what’s good."  
    *   *Licensed by*: **J1 (justification requires firsthand experience)** and/or **M4 (anti-realism)**. If testimony can't justify aesthetic belief or if no truths exist, recommendations *as guides to value* are empty.  
    *   *Likely intended reading*: **Conflation of J1 and M4**. They likely assume "no disputing" implies no objective truths *and* no testimonial justification.  

  ---

  ### Your Specific Question: Realism + Testimonial Injustice  
  **Is it coherent to believe aesthetic judgments are truth-apt *and* reject testimony?**  
  Yes, absolutely. This is **coherent and the standard realist position**:  
  - **Epistemic Structure**: Aesthetic realism holds that "X is beautiful" is truth-apt (true/false independently of beliefs). *But* justification requires *direct perceptual/experiential acquaintance* with X (Kant, Sibley, Scruton). Testimony can *cause* you to believe "X is beautiful" but cannot *epistemically justify* it.  
  - **Analogy**: You can't know "Honey tastes sweet" solely by testimony—you must taste it. Similarly, you can't know "Mahler 5 is sublime" without hearing it.  
  - **Philosophical Prevalence**: This is **mainstream**, not eccentric. Kant’s "judgment of taste" requires first-person experience; contemporary realists (e.g., Zemach, Zangwill) uphold acquaintance as necessary for justification.  

  **Why TNDT misleads**: The slogan conflates *epistemology* (how we know) with *metaphysics* (what exists). Realists separate these: aesthetic facts exist, but we access them only through direct experience. Anti-realists often tie the two (no facts → no disputing). The debate persists because TNDT ambiguously straddles these dimensions.  

  **Verdict**: Your suspicion is correct—realism + testimonial limitation is coherent and philosophically orthodox. The commenters oversimplified by reading TNDT as settling metaphysics *and* epistemology in one stroke.
