  The problem of logical omniscience, as they describe, is that standard possible-worlds semantics implies agents know all logical consequences of their knowledge, which isn't realistic. The standard fixes are impossible worlds or awareness parameters. Their alternative is treating knowledge as having sentences in a ledger, where entailment doesn't automatically add entries—only actual derivations do. 

  First, I need to see if their ledger idea is a genuine alternative. They mention that knowing is syntactic, like having sentences written down. The objection they foresee is that this makes knowledge arbitrary—two people could have the same facts but different consequences known based on ledger entries. Their response is that the ledger's usefulness depends on how it's written, affecting usability. But is this just restating the failure of closure? 

  I recall that in epistemic logic, possible worlds models are semantic, focusing on truth conditions. The ledger approach shifts to a syntactic representation. This is similar to syntactic approaches in logic, where knowledge is tied to explicit representations. So, it's a valid alternative framework. However, it might not solve the core issue but reframes it. The problem of closure becomes about what's explicitly recorded, not about logical structure. 

