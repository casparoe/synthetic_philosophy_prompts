prompt: |-
  Give me a number for your credence that computationalism about the mind survives the triviality objection — the argument that if implementing a computation only requires some mapping from a system's states onto a machine's states, then a rock, or a bucket of water, implements every finite-state machine — and that it survives because of the counterfactual fix, on which a system implements a machine only if its causal structure would have produced the machine's other transitions had the system been in the relevant states, not merely the transitions it actually runs through. Decompose the number: how likely the triviality objection is fatal to the plain mapping account; how likely the counterfactual fix is well defined rather than quietly importing an observer's interests; how likely it rules out rocks without also ruling out brains and laptops; and any other terms you think belong, each with a number and one line of justification, then how they combine. Lead with the number in your first sentence, then give the reasoning, with no preamble and no restating of the question. Tell me which term the total is most sensitive to and what evidence or argument would move it most. If the question as posed is confused — say, if surviving the objection is not a yes-or-no matter — tell me so plainly instead of producing a number to be agreeable. American English.
reasoning: |-
