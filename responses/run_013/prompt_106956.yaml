  First, I consider the constraints: ordinary people, shared desires/aversions/community standards, identical non-moral information. The challenge is creating divergence purely on moral verdict without tricks. The organ donation case comes to mind - it's plausible, grounded in real debates, and meets all criteria. 

  For the audit, I need to evaluate how each metaethical theory handles this. The naturalist realist faces tension because identical desires/information should lead to identical "natural property" judgments. Relativism struggles since shared community standards should dictate the same verdict. Expressivism must explain disagreement despite identical attitudes - perhaps through different linguistic interpretations. Error theory and non-natural realism handle it better by allowing fundamental moral divergence.

  The key feature is clearly the identical attitudes/standards forcing theories to confront pure moral disagreement. If relaxed, most theories can explain differences through varying desires or cultural norms. But is the strict case possible? Only if moral judgment isn't fully determined by attitudes/information - which some theories deny.

  For defense strategies: relativism could question whether "community standards" are truly identical, but this risks making standards too vague. Naturalism might argue information isn't truly equal, but this seems ad hoc. Expressivism's best move is reframing the disagreement as meta-level attitude conflict.

  Non-natural realism surprisingly handles this best by allowing irreducible moral properties that identical agents might perceive differently. The user's suspicion about which realism flavor fares best seems correct here.

  Throughout, I'm mindful this is for academic use - needing rigor, clarity, and awareness of how each theory's weaknesses are exposed. The organ donation case serves well because it avoids sci-fi elements while preserving the philosophical tension.
answer: |-
  Here’s the case, audit, and analysis:

  **The Case:**  
  Two nurses, Lena and Marco, work in a resource-strapped ICU. A terminally ill, unconscious patient (with no family or advance directive) will die within hours. Another patient needs an immediate organ transplant to survive. Lena believes it’s *morally wrong* to harvest the dying patient’s organs without consent, even to save a life, as it violates bodily integrity. Marco believes it’s *not wrong* because saving a life outweighs the absence of consent in these specific, desperate circumstances. They share identical desires (save lives, respect autonomy), identical aversions (causing harm, wasting resources), identical community standards (hospital ethics guidelines), and all non-moral facts (prognoses, legal risks, absence of alternatives). Their disagreement is purely about whether this act is morally forbidden.

  **Audit of Metaethical Theories:**  
  1. **Naturalist Moral Realism** (e.g., wrongness = what fully informed impartial agents would want)  
     - **Verdict:** **Awkward → Fatal**  
     - **Why:** Identical desires/full information/impartiality *should* yield identical verdicts. Naturalism must explain divergence as *one agent being irrational* or *misapplying* standards, but the case rules this out. If moral properties reduce to natural properties (e.g., well-being optimization), identical inputs *must* produce identical outputs.  

  2. **Non-Naturalist Moral Realism** (e.g., irreducible moral properties)  
     - **Verdict:** **Easy**  
     - **Why:** Moral facts are sui generis. Even with identical non-moral knowledge and attitudes, agents might "grasp" these objective properties differently (like misjudging a mathematical truth). Disagreement implies *one is mistaken*, but this is inherent to realism—no further explanation needed.  

  3. **Error Theory**  
     - **Verdict:** **Easy**  
     - **Why:** All moral claims are false. Lena and Marco are *both* wrong, but their disagreement is a predictable clash of mistaken beliefs. Identical attitudes change nothing—error theorists expect widespread inconsistency.  

  4. **Expressivism / Non-Cognitivism**  
     - **Verdict:** **Awkward → Fatal**  
     - **Why:** Moral judgments express attitudes (e.g., "Boo organ-harvesting!"). Identical attitudes *should* yield identical expressions. Expressivists must explain disagreement as either (a) *non-attitudinal* (e.g., semantic confusion) or (b) *higher-order attitudes* (e.g., "Boo your attitude!"). But (a) violates "no missing non-moral info," and (b) requires divergent meta-attitudes, which the case excludes.  

  5. **Relativism / Constructivism** (community-standards version)  
     - **Verdict:** **Fatal**  
     - **Why:** If wrongness is defined by community standards, and standards are identical, verdicts *must* align. Relativists cannot accommodate intra-community disagreement *without* hidden differences in interpretation or sub-group affiliation—both ruled out here.  

  **Hardest Worker:** **Expressivism** (must stretch to explain attitude-identical disagreement). **Fatal for:** **Relativism** and **Naturalism**.  

  **The Key Feature:**  
  **Identical conative attitudes (desires/aversions) and community standards.** Relaxing *either* collapses the problem:  
  - **If desires differ:** Naturalism/Expressivism attribute disagreement to divergent attitudes.  
  - **If communities differ:** Relativism attributes disagreement to cultural standards.  
  *→ The "hard version" is only problematic for theories claiming moral verdicts are strictly determined by attitudes/standards/full information.*  

  **Is the Case Coherent?** Yes, but **only if moral judgment isn’t entailed by non-moral facts + attitudes.** Non-natural realists/error theorists accept this; naturalists/expressivists/relativists *must* deny the case is possible (or reinterpret it).  

  **Defense for the Weakest Theory (Relativism):**  
  - **Best Move:** Deny that "shared community standards" implies *identical interpretation*. Lena and Marco might both endorse "respect autonomy + save lives" but prioritize them differently *within* the standard.  
  - **Cost:** Undermines relativism’s simplicity. If standards don’t determine verdicts, the theory loses predictive power and must appeal to *individual* relativism—which it explicitly rejects.  

  **Easiest for Realism?** **Non-naturalism**, not naturalism. It alone treats the disagreement as a straightforward factual error (like misreading evidence), without reducing morality to attitudes/information.  

  **Final Note:** This case *is* possible if moral properties are irreducible (non-naturalism) or illusory (error theory). For others, it exposes a need to either deny moral disagreement can be this "fundamental" (naturalism) or redefine disagreement as non-cognitive (expressivism).
