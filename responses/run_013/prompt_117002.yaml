answer: |-
  Joan’s hands moved through the morning ritual with the quiet precision of a planetary gear. Steam rose from the basin on the dresser. Lavender soap, the expensive kind Arthur used to bring back from Provence. Two towels: one thick and fluffy for drying, one smaller, rougher for the soap. The water was precisely 38 degrees Celsius, checked by the digital thermometer clipped to the basin’s rim – a relic from Arthur’s neurology practice.

  Arthur sat slumped in the specialized shower chair, his left hand curled inward, a tremor running through his right leg like a faulty engine. Sixteen months since the stroke. Sixteen months of Joan’s dawn assembly line: basin, water, soap, towels, pyjamas off, wash, dry, fresh clothes, medication, breakfast. Each step had sub-steps, meticulously ordered. The sponge *must* be wrung twice over the basin before touching his skin. The towel *must* be folded lengthwise before draping over her arm. The pyjama top came off before the bottoms. Deviation felt like walking off a cliff.

  Today, Maya, the new home health aide, observed. Young, sharp-eyed, fresh from her community care course. Joan felt the scrutiny, a subtle pressure on the ritual’s bubble.

  "Morning, Arthur," Maya chirped, too loud for the quiet room. Arthur’s eyes flickered towards her, unreadable.

  Joan began. Water check. Soap lathered. Sponge wrung *once, twice*. She started on Arthur’s face, gentle circles. Forehead, cheeks, jaw. Down the neck. Left shoulder, arm, hand. Each finger meticulously cleaned. She reached for the towel folded just so on the dresser corner to pat his face dry.

  Maya moved. Reaching for the medication box on the far side of the dresser, her hip brushed the folded towel. It slid a few inches, its neat geometry disrupted.

  Joan froze, sponge dripping onto Arthur’s pyjama bottoms. The towel. Out of place. Her carefully sequenced world tilted. The next step – drying the face – was impossible. The designated towel wasn’t *there*. Not precisely where it belonged.

  Silence stretched. Arthur blinked slowly. Maya looked up, oblivious.

  Without a word, Joan placed the sponge back in the basin. She picked up the displaced towel, refolded it with sharp, deliberate motions, and placed it back in its exact spot. Then, she turned to the basin. She poured the slightly cooled water down the sink. Refilled it. Checked the temperature: 37.8. Added a splash of hot. 38.0. Relathered the sponge. Wrung it *once, twice*.

  She started again. Forehead, cheeks, jaw. Down the neck. Left shoulder, arm, hand. Each finger.

  Maya stared. "Mrs. Davies? Did... did I do something? You just started over."

  Joan didn’t pause her careful circles on Arthur’s forearm. "The towel was moved. The sequence requires drying *after* the face is washed. With the correct towel, in position."

  "But... it was just nudged? The water was still warm? Arthur was half-washed?"

  "The sequence is important," Joan stated, her voice flat. "For consistency. For Arthur." She moved to his right arm.

  Maya chewed her lip. "It’s just... it reminded me of something from my ethology module. Sphexishness? Like the digger wasp? You know, when it drags its paralyzed cricket to the burrow, checks inside, drags the cricket in? If someone moves the cricket even a tiny bit while it's checking, the wasp comes out, drags the cricket back to the 'start' point, and does the *whole* burrow inspection routine again from scratch. Even though the cricket was right there. It can’t adapt. It just... restarts the fixed sequence." She paused, hesitant. "They say it looks deliberate, but it's really just rigid programming. No flexibility."

  Joan’s hand slowed minutely on Arthur’s hand. The word landed like a stone in the steamy room. *Sphexishness*. A label. A diagnosis. Mindless compulsion. Was that what Maya saw? A bug restarting a broken subroutine?

  Arthur made a low sound, a guttural hum. His good hand twitched. Joan met his gaze. His eyes, clouded but present, held hers. Was it confusion? Or... understanding?

  She resumed washing. "It’s not mindless," she said, her voice low but firm. "Arthur... he needs the predictability. The world shifts under him constantly now. His body betrays him. Time blurs. This..." she gestured faintly with the sponge, "...this ritual, this *sequence*, it’s an anchor. It tells him where he is in the day, in the world. If one piece is wrong, out of place... the whole structure feels unstable. *To him*." She emphasized the last words, looking straight at Maya. "It’s not *my* rigidity. It’s the scaffolding *he* needs. The world keeps moving his cricket, Maya. Constantly. This is how I put it back where he can find it."

  Maya shifted, uncomfortable. "But... restarting everything just because the towel moved a bit? Isn't that... inefficient? Exhausting for you?"

  "Is it?" Joan countered, moving to Arthur’s legs. "Or is it the most efficient way to ensure *nothing* is missed? That *no* variable is left unaccounted for, no corner unchecked, in a situation where a missed step could mean a pressure sore, an infection, a moment of confusion that spirals?" She wrung the sponge with deliberate force. *Once. Twice.* "What looks like mechanical repetition from the outside might be the only way to navigate a landscape that’s constantly changing beneath his feet. The inspection *needs* to be thorough, every time. Because the ground *isn't* stable."

  Arthur hummed again, a slightly different pitch. His head tilted towards Joan. Was it agreement? Or just a spasm?

  Maya looked from Joan’s determined, weary face to Arthur’s impassive one, then back to the perfectly folded towel. “They argue about the wasp, you know,” she said quietly. “Some scientists. They say maybe it *is* adaptive. That restarting the whole sequence ensures the burrow is truly secure, that no new threat appeared in those few seconds the cricket was moved. That the ‘wasted’ effort might prevent a catastrophic failure – a predator getting in, the cricket being stolen. That what looks rigid is actually robust in an unpredictable environment.”

  Joan didn’t answer. She finished washing Arthur’s right leg, lifted the correctly positioned towel, and began to pat him dry, starting again with his face. The sequence flowed: dry, fresh clothes, medication placed precisely on his tongue with a sip of water from the blue cup, not the green one.

  Maya watched, the analogy churning in her mind. Compulsion or adaptation? Rigid programming or a deeply intelligent response to chaos? Was Joan trapped, or was she the only thing holding Arthur’s crumbling world together through unyielding ritual?

  As Joan carefully combed Arthur’s thin hair, her movements were smooth, practiced, essential. Her face was a mask of concentration, but beneath it, a quiet storm raged. *Am I the wasp, blindly following code? Or is this the only way to keep the predators out, the burrow safe?*

  Arthur’s hand, the one with limited movement, lifted slightly, trembling. His fingers brushed Joan’s wrist as she worked. A faint pressure. A connection. Or just a random tremor?

  Joan paused, just for a heartbeat, then continued combing. The sequence demanded completion. Whether it was a cage of her own making or the very architecture of their survival, she couldn’t tell. And perhaps, in the steamy quiet of the bedroom, with Arthur’s cloudy eyes watching and Maya’s scientific doubt hanging in the air, that was the point. The cricket had been moved. The inspection began again. The necessity, and the mystery, remained.
