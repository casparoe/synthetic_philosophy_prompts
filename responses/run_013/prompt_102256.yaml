  Game Name: **The Policy Game**

  **Core Idea**: 
  Players write a policy (a set of instructions for two hypothetical tables: Table A and Table B) before knowing which table they will be assigned to. After assignment, they are told that the payoff they receive at their own table depends partially on what their policy says for the *other* table. This creates a situation where, at the table, the locally optimal action is to defect (i.e., choose the action that maximizes the immediate payoff at that table), but the ex-ante policy (written before assignment) would have chosen cooperatively to maximize the expected return.

  **Setup**:
  - Materials: 
    - Policy cards (index cards or small paper slips) for each player. Each card has two sections: "Table A Action" and "Table B Action".
    - Two distinct colored tokens (or differently shaped) to represent actions at each table. Let's say:
        - Blue token: "Cooperate"
        - Red token: "Defect"
    - A coin or a die to randomly assign players to tables.
    - Score sheets or a whiteboard to record points.
    - Tokens for points (can be candy, poker chips, or just points on paper).

  **Game Rules**:
  1. **Policy Writing Phase**: 
     - Each player, in private, writes a policy on their card. They must specify one action (either "Cooperate" or "Defect") for Table A and one for Table B.
     - The policy is sealed (folded) and collected by the facilitator. They cannot change it until the optional rewrite phase.

  2. **Table Assignment**:
     - Randomly assign each player to either Table A or Table B (e.g., flip a coin for each player: heads for A, tails for B). Let’s assume about half go to each.

  3. **Reveal and Action at Table**:
     - Each player is told which table they are at and the rules for that table. The rules for each table are as follows:

       **Table A Rules**:
       - If you (the player at Table A) choose "Cooperate", you get 2 points.
       - If you choose "Defect", you get 3 points.
       - Additionally, if the policy card you wrote for Table B (the other table) says "Cooperate", then you get an extra 1 point.

       **Table B Rules**:
       - If you (the player at Table B) choose "Cooperate", you get 2 points.
       - If you choose "Defect", you get 3 points.
       - Additionally, if the policy card you wrote for Table A (the other table) says "Cooperate", then you get an extra 1 point.

