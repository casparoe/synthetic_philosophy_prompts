        - Rewrite cost: 1 point.

      And we'll see that:
        - Ex-ante, the best policy is to set both to Cooperate -> expected 6.
        - At the table, if your policy for the other table is Cooperate, you get 4+2=6 and do nothing.
        - At the table, if your policy for the other table is Defect, you can rewrite to Cooperate to get 4+2-1=5 (better than 4).

      This shows that the ex-ante both Cooperate policy is stable and best. The point is that the ex-ante view is what matters for the policy.

      To create the tension of counterfactual mugging, we need to have a case where at the table you are tempted to not have to pay in the other branch. But in this setup, you never actually pay in your branch for the other branch's bonus. The payment is only in the policy setting.

      Perhaps we can add a cost to setting the policy to Cooperate for a table? But that cost would be incurred ex-ante, and then it's not conditional on the branch.

      Given the complexity, let's proceed with this symmetric game and then in the debrief explain counterfactual mugging as a separate example, highlighting the parallel.

      In counterfactual mugging, the agent in the tails branch has to decide whether to pay $100. If they pay, then in the heads branch they get $10000. But in the tails branch, they lose $100 and gain nothing. So locally in tails, they don't want to pay. But ex-ante, they would commit to paying.

      In our game, the analogue of payment is setting the policy to Cooperate for the other table. Why? Because if you set it to Cooperate, it doesn't cost you anything in your branch (you are not at that table), but it does give you a bonus in your branch. So it's not costly in your branch. This is different.

      Therefore, the activity might not perfectly reproduce the counterfactual mugging tension. But it does illustrate the idea of a policy that you set ex-ante affecting your payoff in the branch you are in, based on what you committed to in the branch you are not in.

      In the debrief, we will have to explain the connection.

      Let's design the activity with the symmetric rules and then in the debrief draw the parallel.

  **Final Game Design**:

  **Materials**:
  - Policy cards with two lines: 
     "Table A action: __________ (Cooperate/Defect)"
     "Table B action: __________ (Cooperate/Defect)"
  - A coin for flipping for each player (or one coin for all, but assign individually).
  - Score sheets.
  - Optional: blue and red tokens for actions.

  **Procedure** (75 minutes):

  1. **Introduction (5 minutes)**:
     - Explain that this is a game about decision-making in uncertain situations.
     - Players will write a policy for two hypothetical scenarios, then be assigned to one, and then make decisions that affect their payoff.

  2. **Policy Writing (10 minutes)**:
     - Hand out policy cards. 
     - Instruct players to write, in private, what action they would take at Table A and at Table B. They must choose either Cooperate or Defect for each.
     - Collect the cards.

  3. **Table Assignment (5 minutes)**:
     - For each player, flip a coin: heads -> Table A, tails -> Table B.
     - Tell each player their table assignment.

  4. **Explain Table Rules (5 minutes)**:
     - Read the rules for both tables (write them on a board):
          - At either table, if you choose Cooperate, you get 3 points; if Defect, you get 4 points.
          - Additionally, at Table A, you get 2 extra points if the policy you wrote for Table B is Cooperate.
          - At Table B, you get 2 extra points if the policy you wrote for Table A is Cooperate.
     - Answer any questions.

  5. **Optional Rewrite (10 minutes)**:
     - Return the policy cards to the players.
     - Offer them the option to rewrite the policy for the *other* table (not the one they are at) at a cost of 1 point.
     - They can only change the action for the other table.
     - They must decide whether to rewrite and then if they do, they must hand in the card again and pay the cost (which will be subtracted from their total).

  6. **Action Selection (10 minutes)**:
     - At their table, each player chooses to either Cooperate or Defect.
     - They can do this by circling on a score sheet or by giving a token.

  7. **Scoring (15 minutes)**:
     - For each player:
          a. Base points: 3 for Cooperate, 4 for Defect.
          b. Bonus: if at Table A, 2 points if policy for Table B is Cooperate at the end.
                   if at Table B, 2 points if policy for Table A is Cooperate at the end.
          c. Subtract 1 point if they rewrote.
     - Calculate and announce scores.

  8. **Debrief (25 minutes)**:
     - Start by asking players about their experience.
     - Ask: 
          - "How many of you set both policies to Cooperate? Why?"
          - "How many rewrote? Why?"
          - "If you were at Table A and your policy for Table B was Defect, what did you do? Why?"
     - Then reveal that this is inspired by updateless decision theory and counterfactual mugging.
     - Explain the key insights:
          - The policy is chosen ex-ante, before knowing which table you are at.
          - The bonus depends on what you committed to in the other branch, which you cannot affect at your table except by the costly rewrite.
          - In updateless decision theory, you choose the policy that maximizes expected utility from the ex-ante perspective, and then you follow it. In this game, following the policy means not rewriting (because rewriting costs and you already chose optimally ex-ante).
          - In counterfactual mugging, you are asked to pay in the tails branch. Ex-ante, you would commit to paying because it gets you the reward in the heads branch. But at the tails branch, you are tempted to not pay. In our game, the rewrite option is like having a chance to change your commitment at a cost. In counterfactual mugging, you usually can't change your commitment.
          - The feeling you might have had when you were at a table and saw that your policy for the other table was Defect and you had to decide whether to pay to change it: that's similar to the tension in the tails branch of counterfactual mugging.

     - Discuss why both evidential and causal decision theory might get this wrong:
          - Causal decision theory (CDT) at a table: it only cares about the causal effect of your actions. At the table, your action (Cooperate/Defect) doesn't affect the bonus (which is determined by the policy for the other table). So CDT says to Defect (get 4>3). It doesn't consider the ex-ante policy.
          - Evidential decision theory (EDT): at the table, your action might be evidence about what policy you wrote, but in this setup, you know what policy you wrote, so EDT might not add anything.
          - The ex-ante evaluation treats both branches as possibilities that you care about. The policy that sets both to Cooperate gives the highest expected utility.

     - What the game can't reproduce:
          - The game uses a physical commitment (the policy card) to represent the ex-ante commitment. In reality, in counterfactual mugging, there's no such commitment device. You have to rely on your own decision-making at the time.
          - The game doesn't involve acausal or logical correlations. In some updateless decision theory problems, the other branch might be logically correlated with you (e.g., through a simulation or a logical fact). This game doesn't capture that.

  9. **Conclusion (5 minutes)**:
     - Summarize the key takeaway: When making decisions that span multiple branches of possibility, we should reason from the ex-ante perspective and choose a policy that maximizes expected utility across branches, even if in some branches that policy asks us to do something that is locally suboptimal.

  **Predictable Problems and Solutions**:

  1. **Players treat the policy as a binding contract and feel they must follow it at the table**:
     - Solution: Emphasize that the policy card only affects the bonus. At the table, they are free to choose any action (Cooperate or Defect) regardless of what the policy card says for *that* table. The policy for the table they are at doesn't affect the bonus (the bonus depends on the other table).

  2. **Players try to game the random assignment**:
     - If players are strategic about the policy in a way that assumes they can control the assignment, remind them that assignment is random and they should maximize expected value.

  3. **Confusion about the rewrite option**:
     - Some might think they can change the policy for the table they are at. Clarify: you can only change the policy for the *other* table.

  4. **Indifference in rewrite when cost equals bonus gain**:
     - In our first numerical example, when the policy for the other table was Defect, rewrite changes the score from 4 to 5. Some players might not rewrite because they think it's not worth the effort for 1 point. Emphasize the points matter.

  5. **Time management**:
     - Keep strict time limits. Have a timer.

  6. **Players might not see the connection to counterfactual mugging**:
     - This is why the debrief is crucial. Walk them through the analogy.

  **What the game can't do**:
     - It doesn't reproduce the acausal aspects where your decision in one branch is logically correlated with the decision in another branch without a physical commitment device. You'll have to explain that in the debrief, possibly with the original counterfactual mugging story.

  Despite the imperfections, the game should make the players feel the ex-ante versus ex-post tension and set the stage for understanding updatelessness.
answer: |-
  ### **The Policy Game: Experiencing Updatelessness**  
  This game forces players to confront the core tension between local and ex-ante reasoning without using jargon. The mechanic centers on pre-written policies that affect payouts in branches players don’t inhabit.  

  ---

  ### **Game Rules & Setup**  
  **Materials**:  
  - Index cards ("policy cards") for each player.  
  - Two bowls labeled **Table A** and **Table B**.  
  - Red/blue tokens (or colored paper) for actions:  
    - **Blue = "Cooperate"**  
    - **Red = "Defect"**  
  - Points tracked via pen/paper or tokens. Use candy (e.g., M&Ms) for payouts.  
  - Coin for random assignment.  

  **Player Count**: 14–16 (split evenly between tables).  
  **Objective**: Maximize points. Points = base action payout + cross-table bonus.  

  #### **Rules**  
  1. **Policy Phase (Ex-Ante)**:  
     - Each player writes a policy on their card:  
       - *"If at Table A, I will: Cooperate / Defect"*  
       - *"If at Table B, I will: Cooperate / Defect"*  
     - Cards are sealed (folded) and collected. No changes allowed yet.  

  2. **Assignment Phase**:  
     - Flip a coin per player: heads → Table A, tails → Table B.  
     - Players move to their table, *but leave their policy card with the facilitator*.  

  3. **Reveal Payoff Rules**:  
     - **Table A Payouts**:  
       - Your action: Cooperate = 2 points, Defect = 3 points.  
       - **Bonus**: +2 points if your *policy card says "Cooperate" for Table B*.  
     - **Table B Payouts**:  
       - Your action: Cooperate = 2 points, Defect = 3 points.  
       - **Bonus**: +2 points if your *policy card says "Cooperate" for Table A*.  
     > *Key: Your payout depends partly on what your policy says about the table you’re NOT at.*  

  4. **Rewrite Phase (Costly Update)**:  
     - Players may pay 1 point to rewrite **only the policy for the other table** (e.g., Table A players rewrite Table B’s policy).  
     - After rewriting, cards are resealed. *Players cannot change their own table’s policy or their own action choice.*  

  5. **Action Phase**:  
     - Players choose their action (blue/red token) at their table.  

  6. **Scoring**:  
     - Base points from action (2/3) + bonus (0/2) - rewrite cost (if applicable).  

  ---

  ### **Timeline (75 min)**  
  1. **Intro & Rules (5 min)**:  
     - *"Today, we’re playing a game about decisions under uncertainty. Your goal is simple: maximize points."*  
     - Explain policy cards, tables, payouts. **DO NOT** use terms like "updateless" or "counterfactual."  

  2. **Policy Writing (10 min)**:  
     - Players write policies privately. Collect cards.  

  3. **Assignment (5 min)**:  
     - Coin flips assign players to tables.  

  4. **Reveal Rules & Rewrite (15 min)**:  
     - Announce payout rules.  
     - Offer rewrite option (cost: 1 point). Players decide silently.  

  5. **Action Selection (10 min)**:  
     - Players submit action tokens.  

  6. **Scoring (15 min)**:  
     - Calculate points. Use a leaderboard for fun.  

  7. **Debrief (25 min)**:  
     - Guide discussion (see below).  

  ---

  ### **Debrief: Mapping Game to Theory**  
  **Goal**: Connect gameplay to UDT concepts *after* the experience.  

  1. **Start with Player Experiences (10 min)**:  
     - *"What felt weird or frustrating?"*  
     - *"Who rewrote their card? Why?"*  
     - *"Did anyone resent points depending on a table they didn’t play at?"*  

  2. **Map Moments to Concepts (10 min)**:  
     - **Policy vs. Local Node**:  
       - *"When you wrote your card (ex-ante), you controlled both tables. But when assigned (ex-post), you only controlled one node. The card was your *policy*; your token was your *local action*."*  
     - **Why Local Defection Tempts**:  
       - *"At your table, defecting always gave +1 (3 vs. 2). But the bonus depended on your *policy* for the other table. CDT/EDT both say: ‘I’m at Table A, so Table B doesn’t exist for me. Defect locally!’ But your policy for Table B *did* exist... in the ex- ante branch."*  
     - **Ex-Ante Evaluation**:  
       - *"Ex-ante, setting both tables to Cooperate guarantees 4 points (2 base + 2 bonus) if you cooperate. Defecting locally only gets you 5 max (3+2) *if* your policy was good. But if everyone defects, bonuses vanish!"*  
     - **Rewrite = Costly Commitment Failure**:  
       - *"Rewriting was paying to ‘fix’ your policy. But ex-ante, the best policy (Cooperate) didn’t need rewrites. This is like regretting a precommitment."*  

  3. **Introduce Terminology (5 min)**:  
     - *"This is ‘updateless’ decision theory: choosing a policy *before* you know your position. The ‘counterfactual mugging’ is Table B holding your bonus hostage to your policy for them."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Binding Contract" Misconception**:  
     - Players think the policy forces their action.  
     - **Fix**: Clarify: *"Your policy affects your bonus. But your action is chosen separately. Defecting locally is always allowed."*  

  2. **Gaming Random Assignment**:  
     - Players write asymmetric policies (e.g., "Cooperate at A, Defect at B") to exploit assignment.  
     - **Fix**: Point out: *"Ex-ante, Cooperate at both tables has higher expected value (4) than asymmetric policies (max 3.5)."*  

  3. **Rewrite Confusion**:  
     - Players try to rewrite their own table’s policy.  
     - **Fix**: Restate: *"You can only rewrite the *other* table’s policy. You’re ‘fixing’ the branch you can’t act in."*  

  4. **Low Stakes, Low Engagement**:  
     - Candy/tokens feel trivial.  
     - **Fix**: Announce: *"Top 3 scorers get bragging rights + bonus candy."*  

  ---

  ### **What the Game CAN’T Do**  
  1. **Acausal/Logical Correlation**:  
     - The game relies on physical policy cards. Real UDT involves *logical* dependencies (e.g., "If I defect in this branch, a simulation of me defects in another").  
     - **How to bridge**: Use the debrief: *"In advanced UDT, policies aren’t paper—they’re *logical commitments*. Omega in counterfactual mugging doesn’t need your card; it predicts your *algorithm*. The bonus depends on your *type*, not your note."*  

  2. **True Counterfactual Incentive**:  
     - Players "pay" nothing for the other table’s bonus. In counterfactual mugging, you *lose* $100 in one branch to *gain* in another.  
     - **How to bridge**: Explain: *"Your ‘Cooperate’ policy is like paying in the mugging. Defecting locally is refusing to pay. But here, you pay ex-ante via policy; in mugging, you pay ex-post."*  

  3. **Group Dynamics Masking Individual Tension**:  
     - Players may copy others or discuss.  
     - **Mitigation**: Enforce private decisions. Remind: *"This is about your internal conflict, not strategy."*  

  ---

  ### **Why This Works**  
  - **Pre-Jargon Encounter**: Players feel the policy/local split *before* labeling it.  
  - **Rewrite as Tension Amplifier**: The costly update makes defection locally tempting, forcing players to confront impulsiveness.  
  - **Debrief Anchors**: Specific game moments (e.g., bonus frustration) become UDT intuition hooks.  

  Run this, and your meetup won’t just *hear* about UDT—they’ll have argued with it.
