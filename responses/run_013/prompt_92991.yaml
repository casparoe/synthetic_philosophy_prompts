answer: |-
  Here's a decomposed credence assessment for the proposition: **"At least some statements about future contingents have no truth value at the time they’re uttered, in the actual world, given how the world actually is."**  
  My credence: **0.35**. Below is the derivation, with sub-question weights, probabilities, and justifications.  

  ### Key Sub-Questions & Probabilities  
  1. **Is the "open future" a fundamental metaphysical feature (not just epistemic)?**  
     - *Probability it is fundamental*: **0.65**  
     - *Justification*: Quantum mechanics suggests genuine indeterminism, but interpretations vary (e.g., Bohmian hidden variables vs. Copenhagen). If indeterminism is ontological, openness is metaphysical.  
     - *Weight*: 30% (core to the debate).  

  2. **Does truth require present truthmakers?**  
     - *Probability it does*: **0.45**  
     - *Justification*: Truthmaker theory is contentious; "tenseless" facts (e.g., "it will be true tomorrow") may suffice for correspondence without present grounds.  
     - *Weight*: 25% (central to Ravi’s view).  

  3. **Is genuine indeterminism coherent?**  
     - *Probability it is*: **0.80**  
     - *Justification*: Despite hidden-variable theories, mainstream physics (e.g., quantum indeterminacy) and philosophy treat indeterminism as coherent and plausible.  
     - *Weight*: 15% (less disputed but foundational).  

  4. **Can truth-value gaps exist without collapsing classical logic?**  
     - *Probability they can*: **0.50**  
     - *Justification*: Supervaluationism or dynamic semantics *can* preserve classical logic (e.g., "will" and "will not" as non-contradictory), but face technical challenges (e.g., "revenge" paradoxes).  
     - *Weight*: 20% (semantic feasibility).  

  5. **Is "settledness" distinct from determinism?**  
     - *Probability it is*: **0.70**  
     - *Justification*: Settledness (metaphysical fixity) could exist even in indeterministic worlds if future facts are "already" real (e.g., growing-block theory).  
     - *Weight*: 10% (nuances the gap’s source).  

  ### Credence Calculation  
  Combined probability of a truth-value gap existing:  
  `(0.65 × 0.3) + (0.45 × 0.25) + (0.80 × 0.15) + (0.50 × 0.20) + (0.70 × 0.10) = 0.35`  
  *(Derived by weighting each sub-probability, then summing)*.  

  ### Sensitivity Analysis  
  - **Most sensitive sub-question**: **Truthmakers (2)**.  
    - *Why*: If truth *does not* require present truthmakers (probability 0.55), the gap claim loses its primary metaphysical anchor. A compelling argument against truthmaker maximalism (e.g., showing correspondence needs no "makers") could drop the credence to ≤0.20.  
    - *What would move it*: Empirical evidence for determinism (e.g., hidden variables confirmed) would collapse (1) and (3), lowering credence to ~0.10. Conversely, proof of ontological indeterminism + truthmaker theory’s necessity would raise it to ~0.70.  

  ### Ravi vs. Your Other Friend: Core Disagreement  
  - **Their fight is upstream of truthmakers** (about **metaphysical vs. semantic ontology of time**).  
    - Ravi sees the future’s unsettledness as a *metaphysical void* (no truthmakers → no truth value).  
    - Your friend sees the future as *semantically accessible* via "how things turn out," rendering truthmakers irrelevant.  
  - **Root conflict**: Whether "future facts" exist *now* (Ravi: no; Friend: yes, as temporal parts of reality). This precedes truthmaker debates.  

  ### Summary  
  Your credence (0.40) and mine (0.35) align closely, grounded in indeterminism’s plausibility but skepticism about truth-value gaps’ logical stability. Ravi’s high credence (0.85) overweights truthmaker necessity; your friend’s low credence (0.10) underestimates the metaphysical openness implied by indeterminism. The battleground is whether truth is "settled" by present reality or merely "correspondent" to eventual reality—a divide deeper than logic or language alone.
