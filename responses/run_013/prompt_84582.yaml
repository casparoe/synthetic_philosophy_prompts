answer: |-
  **Strict propriety alone underdetermines rational credence in non-partition cases, as it fails to fix local properties like symmetry, boundedness, or the treatment of certainty; only global scoring over partitions with additivity imposes meaningful constraints that reduce arbitrariness.**  

  ### Core Issue: Local vs. Global Constraints
  1. **Single Credence (Local Level):**  
     - Strict propriety for a binary proposition *only* ensures that credence *c* maximizes expected accuracy *iff* it matches the true probability *p*.  
     - It does *not* constrain:  
       - **Symmetry**: Brier penalizes over/underconfidence equally; log penalizes false certainty infinitely.  
       - **Boundedness**: Log diverges to −∞ for errors; Brier/spherical are bounded.  
       - **Certainty**: Log forbids 0/1 credences; Brier/spherical permit them.  
     - **Result**: For isolated beliefs, "accuracy-first" cannot distinguish between rules—your opponent is technically correct here. Propriety is compatible with infinitely many scoring rules, each encoding different "epistemic tastes" for error severity.  

  2. **Whole Credence Function (Global Level):**  
     - Additivity (summing scores across a partition) *is not mere bookkeeping*. It introduces structural demands:  
       - **Separability**: Scores for propositions must combine without interaction (e.g., Brier’s additive rule).  
       - **Consistency**: A credence must maximize expected accuracy *simultaneously* for all propositions in any partition.  
     - **Consequence**: Additivity + strict propriety + continuity *narrows* options. For example:  
       - Brier (additive) satisfies these.  
       - Spherical (non-additive) fails separability.  
       - Log is additive but violates boundedness/continuity.  
     - **The Bite**: Global scoring exposes whether a rule "coheres" across epistemic contexts (e.g., learning new evidence). Rules like log or spherical may force irrational shifts when propositions are embedded in larger partitions, while Brier’s additivity ensures stability.  

  ### Why This Matters
  - **Underdetermination Threat**: Without additivity or partition-spanning constraints, accuracy-first epistemology *cannot* uniquely justify *any* credence in single-proposition cases—rationality becomes arbitrary.  
  - **Path to Uniqueness**: Additivity + strict propriety + plausible desiderata (e.g., continuity, extensibility to infinite partitions) can favor rules like Brier. For instance:  
    - Brier is the *only* additive rule that is strictly proper and differentiable (per Savage’s theorem).  
    - Log’s infinities violate "coherence" in sequential updates (e.g., requiring recalibration after near-certainty errors).  
  - **Epistemic Significance**: Choosing a rule isn’t "taste" if epistemology requires *systematic rationality*—e.g., avoiding self-sabotage when beliefs interact. Global scoring rules that ensure stable, partition-invariant maximization (like Brier) align with this; local rules (log/spherical) do not.  

  **Bottom Line**: Strict propriety’s failure to fix local features reveals accuracy-first’s vulnerability, but additivity over partitions rescues it by enforcing cross-contextual coherence—making rules like Brier epistemically privileged, not optional.
