prompt: |-
  You are an expert in decision theory and the philosophy of rational choice. I am setting the final exam for a graduate seminar on risk and rationality. I want one essay question on risk-weighted expected utility (REU) that cannot be answered by reciting the standard definition or the Allais paradox. Recall that REU weights each outcome by r(P(X ≥ x_i)) − r(P(X > x_i)), where r is an increasing risk function with r(0)=0 and r(1)=1. The question should force students to work through a concrete three-outcome gamble under a non-linear risk function, compare the REU ranking with the expected-utility ranking under both convex and concave utility, and then assess whether REU can distinguish risk aversion from diminishing marginal utility without collapsing into a mere relabeling of the latter. To keep it from being a recall exercise, build the question around the following twist: the decision-maker's risk function is r(p)=p^3, the gamble is a 50% chance of 0, a 25% chance of 60, and a 25% chance of 100, and the alternative is a sure 40. Include a sub-question asking whether this risk function respects first-order stochastic dominance, and what that implies for the claim that REU is a general theory of rational risk attitudes. Write the question, a model answer of about 600 words, and a marking scheme out of 20 marks that separates an A from a B answer by naming the specific moves each must contain. Begin by brainstorming the key distinctions you will test, then give the question, model answer, and marking scheme. Keep the whole response under 1,200 words.
