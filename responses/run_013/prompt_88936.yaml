  First, the user's academic background is crucial. Their dissertation focuses on moral obligations to distant others, which directly conflicts with supporting a local nonprofit. They mention the "kid in the pond" argument by Peter Singer, which advocates for helping where the need is greatest. But here, they're asked to fundraise for a local lake safety group. The conflict is real: how to reconcile their belief that donations are more effective elsewhere with the request to support this specific cause.

  The audience is a mix of locals, volunteers, the mentor's widow and kids, and parents of a child who drowned. The emotional weight is heavy. The user can't pretend to believe the local cause is the most effective, but they also don't want to undermine the organization or disrespect the mentor's memory. The mentor's counter-argument was about building systems that prevent emergencies, not just reacting to them. That's the key here—shifting from reactive rescue to proactive prevention.

  The user needs the speech to be honest, warm, and still motivate donations. They want to acknowledge the tension without alienating the audience. The three philosophers attending mean the arguments must hold water academically, but the delivery has to be accessible. No jargon, no citations. 

  The mentor's point about "choosing to be the kind of place that doesn't need rescuing" is central. The speech should frame the nonprofit as building community infrastructure—swim lessons, lifeguards, safety protocols—that reduces the need for rescues. This bridges the user's philosophical stance with the local cause. By investing in prevention, they're creating a model of efficiency and community care, which aligns with effective altruism principles indirectly.

  The structure needs to honor the mentor, validate both viewpoints, present the nonprofit's work as proactive, and make a heartfelt ask. Highlighting the drowned child's parents adds emotional resonance without exploitation. Emphasizing the mentor's legacy ties personal history to the cause. Ending with a call to sustain his vision leverages emotional appeal while staying true to the user's respect for him.

  Potential pitfalls: avoiding hypocrisy, balancing emotional and logical appeals, not trivializing the drowning. The user’s integrity is paramount, so acknowledging the philosophical conflict openly but showing how this cause fits into broader moral frameworks is essential. The metaphor of "building the dock" from the mentor's argument serves as a tangible symbol for systemic prevention, making the abstract concrete for the audience.
