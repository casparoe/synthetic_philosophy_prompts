  5. Nonlinearity: The weights set will lead to a nonlinear outcome (e.g., a threshold effect) so that small weight changes cause big allocation shifts, and averaging can have victims.
  6. Auditors: Two participants are designated as auditors. They can veto the proposed weights, but using the veto costs them (e.g., they lose a token or a privilege). Their role is to object if the weights cannot be justified to some reasonable conception of the good.
