  1. Participants: ~24 graduate students from various fields. They will be divided into 5-6 groups (each representing a stakeholder group) and 2 auditors.
  2. Goods: Five named public goods (Transit Subsidies, Elder Care Hours, School Places, Library/Public Space Hours, Direct Cash Transfers).
