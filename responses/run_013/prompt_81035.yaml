prompt: |-
  I started a new job three weeks ago as an analyst at a mid-size foundation that does effective-altruism-flavored grantmaking, and I think I might be in over my head. My first assignment is basically "explain our methodology to the board," and the more I stare at it the less I understand what we're actually committed to.

  Here's the practice, as concretely as I can put it. We rank every grant by expected value per dollar, and the top of the list is always a moonshot. Right now it's a $2M grant whose entire case rests on roughly a 1-in-20,000 chance of helping head off a global catastrophe. Our own model says that makes it worth something like 50,000x a bed net grant that saves lives with near-certainty. Fine, that's what the arithmetic says. But the same organization also: caps annual spending at 4-5% of assets, applies a discount rate to benefits far in the future, and runs a "robustness" screen that quietly kills any grant whose expected value comes from a single tiny probability. So one part of our process treats a 1-in-20,000 shot at something astronomically big as decisive, and another part acts like probabilities that small dont count at all. My boss calls it "hits-based giving" and says not to worry about it.

  I'd like you to act as a philosopher of decision theory — someone who actually works on expected value, risk, and rational choice — and help me figure out what theory of rational choice this practice presupposes. Please think carefully here and dont just give me the textbook answer, because I need to know what our process actually commits us to. Brainstorm first: lay out the rival views about what a practice like this could be committed to, then argue for the one that really fits, then say where it's genuinely underdetermined.

  There's alot I keep going back and forth on:

  - Does it presuppose that maximizing expected value is the correct decision rule — the thing people call fanaticism, where you're required to take a 1-in-a-trillion chance at a big enough payoff? And if so, is it fanaticism about the values themselves (the payoffs really are that huge, and commensurable with ordinary ones) or just about the arithmetic?
  - Or can the whole thing — the ranking, the spending cap, the discounting, the robustness screen — be reconstructed on a risk-averse or bounded rule, or on the idea that our probability estimates for tiny-probability catastrophes are so unreliable that they should be shrunk toward zero? Is the inconsistency a real incoherence, or does it track a distinction between trusting a value estimate and trusting a probability estimate?
  - What would have to change in the practice if we replaced the presupposed view with a more moderate one? Would anything actually break, or would it just reorder the list?

  Please write in American English, and be concrete — use our numbers where they help. And if I'm conflating two different questions (what's valuable vs. what it's rational to do), just say so, because I probably am.
reasoning: |-
  Okay, let me try to unpack what's going on here. The user is an analyst at an EA-aligned foundation, struggling to reconcile their grantmaking methodology. On one hand, they rank grants by expected value per dollar, which heavily favors high-risk, high-reward "moonshots" (like a 1-in-20,000 chance of preventing global catastrophe). On the other hand, they have practices that seem to contradict this: spending caps, discounting future benefits, and a robustness screen that filters out tiny-probability bets. 

  First, I need to understand the core tension. The user feels their process is inconsistent - it's simultaneously fanatical (chasing tiny chances of huge payoffs) and conservative (ignoring those same tiny probabilities). They're asking what theory of rational choice underlies this, and whether it's coherent. 

  Hmm... the key questions they raise are:
  1) Is this pure expected value maximization (fanaticism) in disguise?
  2) Or is it a pragmatic blend that accounts for epistemic limitations?
  3) What would change if they adopted a more moderate approach?

  Let me break this down. The "fanaticism" angle is tricky - yes, the EV calculation technically commits to valuing the moonshot, but the robustness screen acts as a circuit-breaker. That suggests they don't fully trust probability estimates below a certain threshold. The discount rate and spending cap feel like separate constraints - maybe liquidity management and intergenerational equity concerns. 

  The user might be conflating two things: what's valuable (the astronomical stakes) versus how we should act given imperfect knowledge. The foundation seems to believe the stakes are real and commensurable, but that our ability to assess tiny probabilities isn't reliable enough to bet the farm on them. 

  Interesting how the robustness screen is applied quietly - almost like an unspoken admission that pure EV maximization is too brittle in practice. This feels less like a philosophical stance and more like institutional risk management. I wonder if the board would approve the methodology if the screen were made explicit?

  What's really at stake for the user? They're new, trying to understand whether their organization's approach is defensible. There's professional anxiety here ("in over my head") but also intellectual unease - they sense cognitive dissonance in the process. They need to explain this to the board, so they require conceptual clarity, not just reassurance.

  The numbers help: that 1-in-20,000 chance getting screened out while the EV math says 50,000x better than bed nets. That gap screams "epistemic hazard." Nobody would trust a 0.005% probability estimate in other contexts (like engineering or medicine). So maybe the foundation is implicitly saying: we'll chase long shots, but only when the probability model has multiple independent lines of evidence.

  For the board explanation, I should emphasize that this isn't inconsistency but layered caution - like using seatbelts (robustness screen) while still driving fast (EV prioritization). The alternative would be either reckless (pure EV) or too conservative (no moonshots). But the user needs to acknowledge the tradeoffs: some genuinely high-EV opportunities get filtered out, and the spending cap might be too restrictive for truly urgent threats.

  Most importantly, the user should probe what "robustness" means operationally. Is it about probability uncertainty, or value uncertainty? That determines whether the screen is a technical fix or a philosophical stance.
answer: |-
  Here’s a breakdown from a decision-theory perspective, grounded in your foundation’s practices. I’ll walk through rival views, identify the most coherent interpretation, flag unresolved tensions, and explore implications.

  ### **Core Tension in Your Practice**
  - **Fanaticism in EV Ranking**: Prioritizing a 1-in-20,000 chance of avoiding catastrophe *because* the payoff is astronomically large (e.g., saving billions of lives) aligns with **unbounded expected value maximization**. This assumes:  
    *Payoffs are commensurable* (a life saved now = a life saved in 200 years) and *tiny probabilities are actionable* if scaled by huge stakes.  
  - **Anti-Fanaticism in Constraints**:  
    - **Robustness screen**: Dismissing grants relying on a single tiny probability (e.g., 1/20,000) implies such estimates are **too unreliable to trust**.  
    - **Discounting future benefits**: Values near-term certainty over long-term potential (e.g., discounting lives saved in 2124).  
    - **Spending cap (4–5%)**: Avoids "going all-in" on volatile bets, preserving optionality.  

  This isn’t necessarily inconsistent—it suggests **different epistemic standards for different parts of the process**.

  ---

  ### **Rival Interpretations of Your Practice**
  1. **"Pragmatic Fanaticism"**:  
     - *Claim*: You **are** committed to maximizing EV, but constraints are practical bandaids for human/structural limitations.  
     - *Evidence*: EV is the primary ranking tool; constraints exist because boards/institutions can’t stomach true fanaticism.  
     - *Problem*: The robustness screen isn’t just about risk-aversion—it’s a direct rejection of low-probability EV calculations.  

  2. **"Epistemically Bounded Rationality"**:  
     - *Claim*: Your practice assumes **tiny probabilities are inherently unactionable** due to estimation error. The robustness screen "washes out" non-robust EV estimates, while spending caps/discounting handle other uncertainties.  
     - *Evidence*: Rejecting a grant *solely* for relying on one tiny probability suggests distrust in the model, not the stakes.  
     - *Fit*: This explains why you’d rank a 1/20,000 catastrophe grant highly (if probabilities were reliable) but kill it in practice.  

  3. **"Hybrid Decision Theory"**:  
     - *Claim*: You use **EV for ordering non-extreme cases** but switch to a **risk-averse rule for tail risks**.  
     - *Evidence*: Bed nets (high certainty) vs. catastrophe grants (low certainty) are treated differently. Discounting and spending caps further hedge against tail risk.  
     - *Problem*: No clear threshold for when "high certainty" ends and "tail risk" begins.  

  4. **"Incoherent Compromise"**:  
     - *Claim*: The practice is philosophically inconsistent, mixing fanaticism (EV ranking) with conservatism (constraints) to appease different stakeholders.  
     - *Evidence*: Your boss calls it "hits-based giving"—a marketing term masking tension.  

  ---

  ### **The Best Fit: Epistemically Bounded Rationality**
  Your practice presupposes:  
  **"Maximize expected value *only when* probability/value estimates are robust; otherwise, default to risk-averse heuristics."**  

  #### Why this fits:
  - **Robustness screen**: Explicitly targets *model fragility*. A 1/20,000 probability is likely based on speculative chains of reasoning (e.g., "This AI safety grant reduces extinction risk by 0.005%"). If that probability can’t be cross-validated (e.g., via independent models or empirical anchors), it’s treated as **effectively zero**—not because tiny probabilities *can’t* matter, but because *this one* is too unreliable to bet on.  
  - **Discounting**: Addresses uncertainty about *values* over time (e.g., will future lives be as weighty? Will interventions retain impact?).  
  - **Spending cap**: Manages portfolio volatility and model error across *all* grants.  

  → **Consistency**: The same epistemic caution underlies all constraints. You’re not rejecting fanaticism *in principle*; you’re rejecting it *in practice* where data quality is low.  

  #### Where It’s Underdetermined:
  - **Probability thresholds**: Why screen a 1/20,000 grant but accept a 1/1,000 grant? Your practice implies a "reliability floor" for probabilities but doesn’t define it.  
  - **Value vs. probability uncertainty**: Discounting future benefits suggests distrust in *value* estimates, while the robustness screen distrusts *probability* estimates. These aren’t explicitly distinguished.  

  ---

  ### **What Changes Under a Moderate View?**
  Suppose you adopted a **risk-averse framework** (e.g., maximize expected utility with diminishing marginal returns on lives saved) or **hard probability cap** (ignore probabilities <1/10,000):  
  1. **Moonshots drop in rank**: A 1/20,000 chance of catastrophe prevention would no longer dominate—even with huge stakes, its EV would be deflated by risk-aversion or set to zero.  
  2. **Robustness screen becomes redundant**: If tiny probabilities are excluded *by default*, screening for model fragility matters less.  
  3. **Spending cap/discounting may weaken**: With fewer high-volatility grants, preserving liquidity matters less.  

  → **What breaks**: Your current EV ranking would misprioritize grants if you adopted moderate rules. For example, bed nets might outrank all but the most robust moonshots.  

  ---

  ### **Recommendations for Clarity**
  1. **Make implicit thresholds explicit**: Define what makes a probability "too small" (e.g., "We require ≥3 independent probability models for P<0.01%").  
  2. **Distinguish uncertainty types**:  
     - *Probability uncertainty* → Robustness screen  
     - *Value uncertainty* → Discount rate  
     - *Model volatility* → Spending cap  
  3. **Stress-test fanaticism**: Run a hypothetical: *"Would we fund a 1-in-10-billion chance if the payoff were 10^20 lives saved?"* If yes, you’re fanatical in principle but bounded by epistemology. If no, your ethics reject pure fanaticism.  

  The inconsistency you sense stems from *unspoken epistemic boundaries*—not true incoherence. Your foundation acts as if **giant payoffs matter in theory, but only when we can trust the odds**. Explaining this to the board means showing how constraints exist to "not be fooled by noise," not to abandon the mission.  

  > "We’re trying to eat our fanatical cake without choking on the uncertainty. That’s not hypocrisy—it’s how you avoid betting the farm on a coin flip only *we* can see."
