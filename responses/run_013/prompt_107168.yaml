  First, I need to consider the user's identity. They're a philosophy professor preparing a lesson plan. Their explicit request is for a structured sequence: what comes first, second, third. But their deeper need seems to be creating an "aha" moment where students organically grasp the modal claim without feeling it's forced. They're wary of examples that beg the question (like the IVF embryo case) and want to preempt common misunderstandings.

  The key challenges I see:
  - Making abstract modal concepts (possible worlds, essential properties) concrete for beginners
  - Avoiding biological reductionism where students confuse origin essentialism with genetics
  - Preventing common misconceptions (e.g., that this denies adoptive identity or environmental influences)
  - Choosing an example that cleanly isolates the modal claim without smuggling assumptions

  For the structure, the user is right to suspect the IVF example is problematic – it implicitly assumes personhood begins at conception, which is exactly what's debated. A better example might involve identical twins from the same zygote, where genetics are identical but origins differ (two separate zygotes couldn't produce the same person). Or a counterfactual where the same sperm fertilizes a different egg.

  The twin example works well because:
  1) It separates genetics from origin (twins share DNA but have different developmental origins post-split)
  2) Avoids personhood debates by focusing on physical identity first
  3) Creates intuitive tension: "If my twin had been implanted instead, would I exist?" 

  For misconceptions, timing matters. The genetics mix-up should be addressed immediately after introducing the biological case, while adoption confusion comes later when discussing contingent properties. The soul/religion concern should be preempted by emphasizing metaphysical (not theological) reasoning.

  The closing question needs to test modal understanding, not memorization. Something like: "Could Queen Elizabeth II have been born from different parents if history changed?" forces them to apply the framework beyond sperm/egg literalism.

  What to explicitly omit:
  - Constitution theory (person/organism distinction)
  - Alternative essentialism theories (psychological continuity)
  - Theological premises
  This keeps focus tight on modal logic of origins.

  The lesson flow should feel like peeling an onion: possible worlds refresh → concrete twin case → generalization to persons → misconceptions as "speed bumps" to overcome. Each step answers a question the prior step naturally raises.
answer: |-
  Here’s a battle-tested lesson plan for a 75-minute session, designed to make origin essentialism feel discovered rather than dictated. The key is scaffolding from concrete intuitions to modal abstraction, while relentlessly flagging misconceptions.

  ---

  ### **Lesson Structure: 75 Minutes**
  **Goal:** Students articulate why origin *might* be essential to personal identity using possible-worlds reasoning, without conflating it with biology or determinism.

  #### **Phase 1: Reactivate Possible Worlds (15 min)**
  - **First 5 min:** Quick quiz (think-pair-share):  
    *"In World A, Plato eats olives for breakfast. In World B, he eats figs. Is World B about Plato? How do you know?"*  
    → Reinforce: Identity across worlds hinges on *which entity* we’re tracking (e.g., "the philosopher who wrote *The Republic*").  
  - **Next 10 min:** Contrast **necessary** (true in all worlds) vs. **contingent** (true in some) properties. Use *Aristotle*:  
    *Necessary:* Being human (if Aristotle exists, he’s human).  
    *Contingent:* Being Alexander’s tutor (he could have refused).  
    → **Crucial move:** Ask *"What fixes Aristotle’s identity? When we imagine 'Aristotle' in another world, what must stay the same?"*

  #### **Phase 2: Introduce the Biological Case—Twins (25 min)**
  - **Example:** **Identical twins from a single zygote.**  
    *Scenario:* "Zygote Z splits into Embryo A and Embryo B. Twin A is you; Twin B is your sibling. Could *you* have been Twin B?"  
  - **Why this works (and IVF doesn’t):**  
    - Avoids personhood debates: Focuses on *organism identity* first (easier).  
    - Same DNA but *different origins*: Twin A originated from the *first* cell division of Z; Twin B from the *second*. Genetics alone doesn’t solve identity.  
    - **Modal hook:** *"Is there a world where the split happens differently, and 'you' are Twin B? Or is Twin B necessarily someone else?"*  
  - **Student task:** Debate in pairs. Force them to answer *why* using possible worlds:  
    *"If I say 'I could have been my twin,' what am I imagining? A world where I look/act like them? Or a world where I *am* them?"*

  #### **Phase 3: Generalize to Origin Essentialism (20 min)**
  - **Transition:** "Twin cases suggest *when/where* an organism originates matters. What about *what* it originates from?"  
  - **Key claim:** *You could not have originated from a different sperm and egg.*  
    - **Tool:** Kripke’s "Queen Elizabeth" thought experiment (*Naming and Necessity*):  
      *"Could Queen Elizabeth have been born from different parents? Or would that be a different person?"*  
    - **Why sperm/egg?** Emphasize: This isn’t genetics but *material origin*. Like an oak tree from a specific acorn.  
  - **Essential Property Definition:**  
    > "A property P is *essential* to X if X couldn’t exist without P.  
    > Origin essentialism says: *Coming from sperm S and egg E* is essential to you."

  #### **Phase 4: Nip Misconceptions (10 min)**  
  Preempt these *as they arise* (likely during Phase 2-3), but formally address now:  

  | Misconception | When to Correct | Response |
  |---------------|----------------|----------|
  | "It’s genetic determinism!" | After twin example | *"Twins have identical genes but are different people. This is about *which organism you are*, not what traits you have."* |
  | "So I couldn’t be adopted?" | After generalization | *"Adoption changes your upbringing (contingent), not your origin (essential). You could have been adopted, but you’d still come from S and E."* |
  | "Person ≠ organism!" | If raised | *"Today, we’re starting with the organism. We’ll ask if ‘person’ is different next week!"* |
  | "It’s about souls/religion!" | During Q&A | *"This is metaphysics, not theology. We’re asking: What does *identity over possible worlds* require?"* |
  | "Couldn’t I be born in Paris?" | After Queen Elizabeth | *"Birthplace is contingent! Origin essentialism only says you couldn’t come from *different materials*."* |
  | "But I’m my memories!" | Closing debate | *"Memories can change (amnesia!). Could you lose all memories and still be you? Then memories aren’t *essential*."* |

  #### **Closing Question (5 min)**  
  *"In a world where your parents use a donor egg that looks identical to your mother’s, and a child genetically like you is born—is that child you? Why/why not?"*  
  → **Tests modal structure:** Forces distinction between genetic similarity and origin identity.

  ---

  ### **What to Explicitly Omit**  
  1. **Constitution theory** (person/organism distinction). Say: *"We’re simplifying by assuming you’re a human organism today."*  
  2. **Alternative essentialism** (e.g., psychological continuity). Say: *"We’ll compare theories next week."*  
  3. **Quantum indeterminacy** in fertilization. Say: *"We’re treating sperm/egg as discrete biological entities."*  

  ### **Why This Works**  
  - **Scaffolding:** Twins → Queen Elizabeth builds from physical to personal identity.  
  - **The example does heavy lifting:** Twins separate genetics from origin. Queen Elizabeth generalizes without biology.  
  - **Misconceptions become data:** Each is a chance to clarify modal logic vs. biology.  

  This plan turns objections into pedagogical fuel while keeping the *modal* question central. The twins example is your anchor—it’s intuitive, question-begging-free, and forces the "could I *be* them?" leap.
