answer: |-
  Your fog-of-war scenario doesn't disturb determinism, but it mislocates the arbitrariness. You propose ranking perturbations by "amplification" — but amplification *toward what*? Significance is observer-relative. The fog's consequence is measured against your chosen outcome: who won the battle. But why that outcome? History isn't a system with a telos. If we instead care about long-term cultural exchange between the armies, the fog is noise. If we care about the career of a specific soldier, his sneeze might be pivotal. The "system" has no intrinsic sensitivity gradient; you impose one by selecting which variables matter *to you*. 

  You object that the fog objectively changed the battle's trajectory. Conceded — but only relative to the battle's own contingent structure. That structure (flanks, doctrine) isn't a natural law; it's a transient configuration of human choices and material constraints. Perturb the initial conditions slightly earlier: perhaps the doctrine changes, or the valley isn't chosen. Now your "amplified" fog perturbation vanishes as irrelevant. The ranking isn't just of perturbations but of *which historical structures we treat as fixed*. And *that* selection is irreducibly arbitrary. Without a privileged frame — which history lacks — there's no non-arbitrary scale for "load-bearing." What you call measurement is the projection of your explanatory interest onto the undifferentiated necessity of the whole.
