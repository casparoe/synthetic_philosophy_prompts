  This principle explains your verdicts 1-4 and shows why randomization (verdict 5) is key. Below, I'll formalize this for your numbers.

  ### Resolving Your Verdicts with the Principle
  **Original setup:** First exit = 0, second exit = 4, stay on past both = 1.  
  - **Optimal strategy from planning (verdict 1 revised):** Your verdict 1 (always stay on for EU = 1) is suboptimal. Instead, you should randomize at each exit with probability \( p \) of getting off. The EU calculation is:
    - Get off at first exit: prob \( p \), utility 0.
    - Stay at first, get off at second: prob \( (1-p)p \), utility 4.
    - Stay at both: prob \( (1-p)(1-p) \), utility 1.
    - EU = \( 0 \cdot p + 4 \cdot (1-p)p + 1 \cdot (1-p)^2 = 4p(1-p) + (1-p)^2 \).
    - Simplify: \( 4p - 4p^2 + 1 - 2p + p^2 = 1 + 2p - 3p^2 \).
    - Maximize EU by taking derivative: \( \frac{d}{dp}(1 + 2p - 3p^2) = 2 - 6p = 0 \) → \( p = \frac{1}{3} \).
    - EU at \( p = \frac{1}{3} \): \( 1 + 2(\frac{1}{3}) - 3(\frac{1}{3})^2 = 1 + \frac{2}{3} - \frac{1}{3} = \frac{4}{3} \approx 1.333 \).
