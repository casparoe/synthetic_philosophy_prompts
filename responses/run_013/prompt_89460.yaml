    - P(at first exit) = P(reached first) / [P(reached first) + P(reached second)] = \( 1 / [1 + (1 - p)] = 1 / [1 + \frac{2}{3}] = \frac{3}{5} \) (since you always reach first, but second only if you stayed at first).
    - P(at second exit) = \( (1 - p) / [1 + (1 - p)] = \frac{2/3}{5/3} = \frac{2}{5} \).
