  ### The Core Principle: Optimal Precommitment with Randomization
  Because the exits are identical and your memory is wiped after each, you cannot condition your decision on which exit you're at. This forces you to use a **single, state-independent strategy** at both exits. The optimal strategy is chosen from the initial planning stage (e.g., at home) to maximize expected utility across the entire trip. Crucially:
  - **Mixed strategies (e.g., randomizing) often outperform deterministic ones** because they balance the risk of exiting too early (missing better later exits) against exiting too late (settling for the "stay on" payoff).
