answer: |-
  Here's a decision tree designed to clarify positions on Kripkenstein's rule-following paradox, starting from the agreed root (*nothing in past behavior, inner states, or training fixes meaning*). Nodes use concrete cases to force distinctions, and unoccupied/indistinguishable positions are flagged. Leaves are limited to 6 core positions.

  ### Decision Tree
  ```
  ROOT: No fact about past behavior/experience/training fixes meaning (agreed).
  │
  ├── **1. Does "what I meant" have ANY fact of the matter?**  
  │   │  
  │   ├── **Yes (Meaning facts exist)** → Go to 2  
  │   │  
  │   └── **No (No meaning facts)** → Go to 5  
  │  
  ├── **2. Is correctness fixed SOLELY by community agreement?**  
  │   │  
  │   ├── **Yes (Agreement = Correctness)** → **Leaf A: Community Infallibilism**  
  │   │    *Case test: Mistaken community?* → Denies possibility (agreement defines right).  
  │   │  
  │   └── **No (Correctness independent)** → Go to 3  
  │  
  ├── **3. Is the project to REDUCE meaning facts?**  
  │   │  
  │   ├── **Yes (Metaphysical reduction sought)** → **Leaf B: Robust Realism**  
  │   │    *Case test: Private rule-coiner?* → Meaning fact exists posthumously.  
  │   │  
  │   └── **No (Redescription only)** → **Leaf C: Quietism**  
  │        *Case test: Machine computing?* → We apply "meaning" without reduction.  
  │  
  ├── **4. Does the paradox work for BASIC LOGIC (e.g., modus ponens)?**  
  │   *(Applies to all "Yes" branches from 1–3; filters surviving leaves)*  
  │   │  
  │   ├── **Yes (Paradox generalizes)** → Eliminates **Leaf A** (community can't fix logic) and **Leaf B** (no "robust" fact for logic). **Leaf C survives**.  
  │   │  
  │   └── **No (Only arithmetic/complex rules)** → All leaves survive.  
  │  
  └── **5. Are meaning ascriptions TRUTH-APT?**  
       │  
       ├── **No (Non-cognitive)** → **Leaf D: Non-Factualism**  
       │    *Case test: First-time application?* → Ascriptions express norms, not truths.  
       │  
       └── **Yes (Truth-apt but false)** → **Leaf E: Error Theory**  
            *Case test: Machine computing?* → We're wrong to call it "meaning" anything.  
       │  
       └── **N/A (Project misguided)** → **Leaf F: Skeptical Solution**  
            *Case test: Private rule-coiner?* → "She meant +" is empty (no community).  
  ```

  ### Leaves & Key Commitments
  1. **Leaf A: Community Infallibilism**  
     - *Hardest commitment:* A community **cannot be wrong** (e.g., if all agree 68+57=5, it *is* correct).  
  2. **Leaf B: Robust Realism**  
     - *Hardest commitment:* Meaning facts are **irreducibly normative** (no explanation for why "+" *should* apply).  
  3. **Leaf C: Quietism**  
     - *Hardest commitment:* **No theory of meaning** — dissolves paradox by rejecting metaphysics.  
  4. **Leaf D: Non-Factualism**  
     - *Hardest commitment:* Saying "you meant +" isn't true/false but **expresses a norm** (e.g., "use this rule").  
  5. **Leaf E: Error Theory**  
     - *Hardest commitment:* **All meaning-ascriptions are false** (even "grass is green" fails if logic is undermined).  
  6. **Leaf F: Skeptical Solution**  
     - *Hardest commitment:* Meaning ascriptions **only report community licensing** (no "truth" beyond agreement).  

  ---

  ### Unoccupied Combinations & Indistinguishable Leaves
  - **Unoccupied Combinations**:  
    - **Community infallibilism + paradox generalizes to logic**: Incoherent. If agreement fixes logic, but the paradox destroys logic, agreement is impossible.  
    - **Robust realism + community-dependent correctness**: Unattractive. Why posit independent facts if correctness relies on community?  
    - **Error theory + non-truth-apt ascriptions**: Incoherent (error theory requires truth-aptness to call assertions *false*).  
    - **Dispositionalism (meaning = dispositions)**: Kripke-rejected; not a leaf because root grants dispositions don't fix meaning.  

  - **Empirically Indistinguishable Leaves**:  
    - **Non-Factualism (D) vs. Skeptical Solution (F)** both handle cases identically *if* we ignore truth-values.  
      - *How to separate them?* Ask: Does "Smith meant + before dying" have a **truth value**?  
        - **D**: No (non-truth-apt).  
        - **F**: Yes (false, lacking community).  
        - *Test case: Private rule-coiner.*  

    - **Quietism (C) vs. Robust Realism (B)** agree on cases but diverge on metaphysics.  
      - *How to separate them?* Ask: Is there a **fact** about what the machine *ought* to output?  
        - **B**: Yes (independent normativity).  
        - **C**: Rejects the question.  
        - *Test case: Machine computing.*  

  ---

  ### How Cases Split Positions
  | Case                  | Key Divider                                 | Positions That Fail the Case                          |
  |-----------------------|---------------------------------------------|-------------------------------------------------------|
  | **Private rule-coiner** | Requires solitary meaning?                 | F (denies solitary meaning)                           |
  | **Mistaken community** | Can correctness outstrip agreement?         | A (denies possibility)                                |
  | **Machine computing**  | Meaning without humans?                    | A, F (require community)                              |
  | **First application**  | Meaning without past applications?         | All "Yes" at 1 handle this; D/E/F redefine it.        |

  **Logic test (Node 4)**: Eliminates **A** (community can't fix logic) and **B** (no "robust" fact for logic) if paradox generalizes. **C**, **D**, **E**, **F** survive generalization by rejecting metaphysics or facts.  

  Print this, and when debates erupt, ask: *"Which node do you reject?"* Forces clarity on *why* positions diverge.
