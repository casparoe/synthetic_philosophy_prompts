prompt: |-
  I am a novelist, some way into a book whose spine is a war-crimes trial — principally the Tokyo tribunal, with Nuremberg standing behind it as precedent and as rebuke. I write slowly at the best of times, and I have been slowed to a stop by a single line of dialogue.

  One of my characters is a defence lawyer. He is not a fool, and he is not a cynic; he is the most serious person in any room he enters, which is what makes him hard to write. When the court asks how he pleads, he will decline to plead. He will say that these proceedings are victors' justice and that the court has no authority over his client. I first met the phrase in a paperback history of the trials I read at fifteen, and I have met it since in two quite different mouths: people who mean that the trials were a sham, and people who mean that the trials were merely insufficient, since only the losers were ever in the dock. That the same four words serve both is the problem I am asking you to solve.

  Give me a disambiguation, laid out as a menu rather than argued as a thesis. Take the phrase as it is actually used about Nuremberg and Tokyo and separate the distinct claims it could be making. Some of the seams I can already see, and would like you to press on: the provenance of the bench (the judges came from the prosecuting powers, and at Tokyo the court was constituted by the occupation authority rather than by agreement among states); the content of the law (whether waging aggressive war was criminal at the time it was waged, and whether a court may apply a law it has itself made); the difference between a retroactive offence, a retroactive mode of liability, and the mere retroactivity of the forum itself; the refusal to accept superior orders or the sovereign act as an answer; selective enforcement (the fire-bombings, the two atomic bombings, the Soviet record, the immunity granted at the top, the industrialists left untried); and the deeper jurisprudential claim that there is no criminal law without a prior sovereign to have enacted it. I am also struck that the victors were not of one mind — the Indian member of the Tokyo bench would have acquitted every defendant, and the Soviet member at Nuremberg dissented against the acquittals — and I want to know what that does to the simplest form of the complaint.

  For each item on the menu, give me a verdict: platitude, substantive and defensible, contentious, or false. Tell me which of them would actually license the act my lawyer wants to perform — a refusal to plead on the ground that the court is not a court — and which would not, since a great many complaints about the trials are perfectly compatible with the tribunal having had every right to try the men before it. Then tell me what residue remains once selectivity is granted and set aside: if the Allies had also tried their own, which readings would survive and which would collapse into nothing more than the observation that the winners wrote the statute? Tell me which of the readings a serious jurist in 1946 would have recognised as an objection to jurisdiction rather than a complaint about the outcome, and which are the inventions of later historians. And tell me, finally, which single reading my lawyer most probably means when he says it, since that is the one that will tell me who he is.

  I do not need citations and I do not need a reading list. I need the menu, in prose, with verdicts, and with an eye to which item on it my character is actually holding when he refuses to plead.
reasoning: |-
  Okay, the user is a novelist working on a book centered around war crimes trials, specifically Tokyo and Nuremberg. They're stuck on a line of dialogue where a defense lawyer refuses to plead, calling the trials "victors' justice." The challenge is to unpack this phrase into distinct claims, evaluate each, and determine which one the lawyer is using to justify his refusal to plead.

  First, I need to break down the phrase "victors' justice" as applied to these trials. The user mentioned several aspects: provenance of the bench, content of the law, retroactivity, superior orders, selective enforcement, and jurisprudential claims. Each of these needs to be a separate menu item with a verdict.

  Starting with the provenance of the bench. For Nuremberg, judges were from the Allied powers, appointed by the victors. At Tokyo, SCAP established the court. Is that a valid objection? The Nuremberg Charter was agreed upon by the London Agreement, so it's a treaty-based court. That makes the objection contentious but not invalid. Tokyo's setup by occupation authority might be seen as unilateral, so substantive. But does this invalidate the court? Probably not, since occupation authorities have legal powers. Verdict: contentious for Nuremberg, substantive for Tokyo, but neither licenses refusal to plead.

  Next, retroactive criminalization. Aggressive war wasn't clearly a crime before Nuremberg. Ex post facto is a legal principle, so this is substantive. However, the tribunal argued it was existing international law. Still, a defense lawyer could argue this. Does it license refusal to plead? Only if the court lacks authority, but here the court is operational, so it's a defense argument, not jurisdictional. Verdict: substantive, but doesn't license refusal.

  Then, retroactive liability modes. Rejecting superior orders as a defense was new. This might be retroactive application. Substantive, but again, a defense matter, not jurisdictional. Verdict: substantive, doesn't license refusal.

  Selective enforcement is a big one. The Allies didn't prosecute their own for similar actions (firebombing, nukes, Soviets). This is substantive and defensible. But it doesn't negate the court's jurisdiction; it's more about fairness. So, not a grounds for refusal. Verdict: substantive, doesn't license refusal.

  Jurisprudential claim: no law without a sovereign. Since international law lacks a central sovereign, this questions the tribunal's basis. But international law operates differently. A serious jurist in 1946 might see this as debatable but not mainstream. Verdict: contentious, doesn't license refusal.

  The deeper claim about the court's existence. If the lawyer argues that the tribunal isn't a valid court at all, that's jurisdictional. But both trials had legal foundations (treaty for Nuremberg, occupation authority for Tokyo). So, false as a claim of invalidity. Verdict: false.

  Now, the residue if selectivity is removed. If Allies tried their own, the selectivity argument collapses. But provenance and retroactivity remain. The core "winners wrote the statute" still stands, but that's inherent. The lawyer's refusal hinges on jurisdiction, so only the claim that the court isn't legitimate at all would justify refusal. That's the seventh point, but it's false. So, which one is the lawyer using? Probably the jurisdictional claim, even if it's weak, to make a stand. The character is serious, so he might lean on retroactivity or provenance as invalidating jurisdiction.

  The user wants to know which single reading the lawyer means. Given the character is serious and refusing to plead, he's likely making a jurisdictional objection based on retroactivity or provenance, seeing the court as illegitimate. Point 7 is explicitly about jurisdiction, but it's false. Points 1 and 2 are more plausible for a jurist. The lawyer might combine substantive points to argue the court lacks legitimacy. But the refusal to plead suggests he's challenging the court's very authority, so he's likely invoking the retroactive law (point 2) as invalidating jurisdiction, even if it's not strictly jurisdictional.

  Also, the user mentioned the Indian judge at Tokyo and Soviet dissent. This shows the victors weren't monolithic, weakening the "victors' justice" claim. The lawyer might use that to argue bias, but it's not jurisdictional.

  Putting it together, the lawyer probably focuses on retroactive criminalization (point 2) as the core issue, arguing that applying new law ex post facto invalidates the court's authority. That's who he is: a principled jurist upholding legality over expediency.
answer: |-
  Here is the disambiguation menu for "victors' justice" as applied to Nuremberg/Tokyo, structured for your narrative needs. Verdicts are assigned based on historical/jurisprudential weight: **Platitude** (obviously true/trivial), **Substantive & Defensible** (serious, credible objection), **Contentious** (reasonable arguments on both sides), **False** (factually or legally unsound). Items licensing refusal to plead are marked **[Jurisdictional?]**.

  ---

  **The Menu of "Victors' Justice" Claims**

  1.  **Provenance of the Bench: Judges appointed solely by the victors.**
      *   *Claim:* The judges were selected exclusively from the prosecuting Allied nations, lacking neutral or defeated-state representation, inherently biasing the court.
      *   *Nuremberg Context:* Established by London Agreement (US, UK, USSR, France). Judges appointed by signatories. **Verdict: Contentious.** (Standard for international tribunals of the era; treaty basis provided legitimacy).
      *   *Tokyo Context:* Established by SCAP (MacArthur) Directive. Judges appointed by Allied powers nominated by SCAP. **Verdict: Substantive & Defensible.** (Lacks explicit multi-state treaty; occupation authority foundation is inherently victor-centric).
      *   **[Jurisdictional?] Partially.** A serious jurist *might* argue it undermines impartiality *fundamental* to jurisdiction, especially in Tokyo. But primarily an impartiality/fairness argument.
      *   *1946 Recognition:* Recognized objection, but seen as pragmatic necessity, not fatal to jurisdiction.
      *   *Residue if Selectivity Removed:* Survives. Core "winners picked judges" remains.

  2.  **Retroactive Criminalization: Applying new law ex post facto (Aggressive War/Class A Crimes).**
      *   *Claim:* "Crimes Against Peace" (waging aggressive war) was not clearly defined or universally accepted as an *individual* criminal offense under international law prior to 1945. The Tribunal applied law created *after* the acts.
      *   *Verdict:* **Substantive & Defensible.** (The Kellogg-Briand Pact outlawed war but lacked individual criminal penalty provisions; prior state practice was inconsistent at best. Nuremberg Judgment's claim of "existing law" was aspirational/declaratory).
      *   **[Jurisdictional?] Potentially, but unlikely.** The court *has* jurisdiction defined by its Charter; this is primarily a defense argument *within* the trial on the merits *or* a challenge to the legitimacy of the law applied. Refusing to plead based *solely* on this stretches the jurisdictional claim.
      *   *1946 Recognition:* The *core* jurisprudential objection recognized by serious jurists (including defense counsel and some academics). Directly challenged the court's authority to *define and apply* this crime.
      *   *Residue if Selectivity Removed:* Survives powerfully. The retroactivity argument stands independently.

  3.  **Retroactive Mode of Liability: Rejecting Superior Orders/Sovereign Acts as a complete defense.**
      *   *Claim:* The principle that following orders/acting as a state official is not an absolute defense to atrocity was not firmly established individual criminal law prior to the tribunals.
      *   *Verdict:* **Contentious.** (Precedents existed but were scattered/not universally codified; the tribunals solidified a developing norm. More defensible than Crimes Against Peace).
      *   **[Jurisdictional?] No.** Clearly a substantive rule of law applied *within* the trial.
      *   *1946 Recognition:* Objection raised, but less fundamental than retroactive criminalization. Seen as an evolution of existing laws of war.
      *   *Residue if Selectivity Removed:* Weakens significantly. Primarily a fairness/rule of law issue within the established framework.

  4.  **Selective Enforcement / Tu Quoque: Failure to prosecute Allied actions.**
      *   *Claim:* The Allies committed similar acts (e.g., strategic bombing of cities - Dresden, Tokyo, Hiroshima/Nagasaki; Soviet invasions/atrocities) but only prosecuted the defeated. Industrialists (e.g., Krupp) received leniency/deals; Hirohito granted immunity.
      *   *Verdict:* **Substantive & Defensible.** (Overwhelming evidence of asymmetry in prosecution. Fundamental fairness concern).
      *   **[Jurisdictional?] No.** Powerful argument about abuse of process, hypocrisy, or political nature of the trials, but does not negate the court's *authority* to try the defendants before it. "Two wrongs don't make a right" is the standard rebuttal.
      *   *1946 Recognition:* Raised vigorously by defense, acknowledged privately by some Allies, dismissed by the tribunals as irrelevant to the charges at hand (Charter Art. 6).
      *   *Residue if Selectivity Removed:* **Collapses.** This *is* the core meaning of "victors judging vanquished" for many. Remove it, and the strongest moral/political objection evaporates, leaving procedural/legal arguments.

  5.  **Lack of Prior Sovereign: No international criminal lawmaker.**
      *   *Claim:* Criminal law requires a pre-existing sovereign authority to enact it. No such global sovereign existed; the tribunals were creating law ad hoc, lacking legitimate legislative authority.
      *   *Verdict:* **Contentious.** (Positivist view vs. natural law/"customary law evolving" view. International law operates differently from domestic systems).
      *   **[Jurisdictional?] Potentially.** A pure positivist jurist *could* argue this negates the very possibility of a legitimate international criminal tribunal. However, state consent via treaties (Nuremberg) or occupation authority (Tokyo) provides a counter-argument.
      *   *1946 Recognition:* Recognized by legal philosophers and some defense counsel, but outweighed by the "necessity" argument and the treaty basis (for Nuremberg) in practical jurisprudence.
      *   *Residue if Selectivity Removed:* Survives. A fundamental jurisprudential question independent of who is prosecuted.

  6.  **Victor Discord Undermines "Victor" Unity: Dissents within the bench.**
      *   *Claim:* Significant dissents (e.g., Justice Pal at Tokyo for acquittal; Justice Nikitchenko at Nuremberg *against* acquittals) prove the trials weren't mere puppetry of a monolithic victor bloc.
      *   *Verdict:* **Platitude (as fact), False (as rebuttal to core claim).** The fact of dissent is true. However, it doesn't negate the victor constitution of the court, the victor-defined charges, or selective enforcement. It merely shows internal victor disagreement on *application*, not fundamental legitimacy. Pal's dissent *relied on* victors' justice arguments.
      *   **[Jurisdictional?] No.** Irrelevant to the court's foundational authority.
      *   *Residue if Selectivity Removed:* Becomes a minor footnote about judicial independence *within* the victor framework.

  7.  **The Court is Not a Court: Illegitimate *ab initio*.**
      *   *Claim:* The tribunal is not a legitimate judicial body at all, but merely a political instrument of the victors disguised as a court. Its creation, composition, and mandate fatally undermine its judicial character.
      *   *Verdict:* **False (as a strict legal/jurisdictional fact), Contentious/Substantive (as a political/moral critique).** The tribunals *were* constituted with legal instruments (London Agreement for Nuremberg, SCAP Order for Tokyo) and followed judicial procedures. Calling it "not a court" is polemical. However, the *sum* of points 1, 2, 4, & 5 lends weight to this *critique* of legitimacy.
      *   **[Jurisdictional?] Explicitly YES.** This is the *only* claim that directly and unambiguously licenses the act of refusing to plead, as it denies the forum's fundamental judicial authority over the defendant. This is the lawyer's formal ground.
      *   *1946 Recognition:* The *explicit* argument made by some defense counsel (e.g., Jahrreiss at Nuremberg) challenging jurisdiction *ab initio*, primarily based on Points 1 & 2. Recognized as the most radical jurisdictional objection.
      *   *Residue if Selectivity Removed:* Shifts focus entirely to Points 1, 2, & 5 (Provenance, Retroactivity, Sovereign). "Winners wrote the statute" remains, but "winners *are* the court" is the core of this objection.

  ---

  **The Lawyer's Choice & Who He Is**

  *   **Licensing Refusal to Plead:** Only **Point 7 ("The Court is Not a Court")** explicitly licenses refusing to plead on jurisdictional grounds. This is the *formal* hook your lawyer uses. He must frame his refusal around the tribunal's inherent illegitimacy as a judicial body.
  *   **The Substantive Foundation:** However, Point 7 is built upon **Points 1 (Provenance - especially Tokyo) and 2 (Retroactive Criminalization)**. A serious jurist in 1946 would ground his jurisdictional challenge primarily in these. The retroactivity of Crimes Against Peace (Point 2) was the most potent *legal* weapon against the tribunal's authority. Selective Enforcement (Point 4), while morally powerful for him, is legally irrelevant to jurisdiction and would *weaken* his formal stance if foregrounded.
  *   **The Probable Meaning:** Your lawyer, a serious man refusing to plead, is **primarily invoking Point 2 (Retroactive Criminalization of Aggressive War) as the core substantive illegitimacy, using it to support Point 7 (The Court is Not a Legitimate Court).** He likely views Point 1 (Provenance) as compounding the illegitimacy, especially given Tokyo's structure. He *knows* Point 4 (Selectivity) is true and fuels his outrage, but he consciously sets it aside for his formal jurisdictional argument because it doesn't legally negate the court's authority over his client. He *might* hint at Point 5 (Lack of Sovereign) as underpinning Point 2.
  *   **Who He Is:** This choice reveals him as a **rigorous legal formalist and positivist.** He prioritizes the strict rule of law (*nullum crimen, nulla poena sine lege*) above political expediency or moral outrage (even if he feels it). He sees the retroactive creation of Crimes Against Peace as a fatal jurisprudential flaw that transforms the tribunal from a court applying law into a political body inventing law to condemn the defeated. His refusal is an act of **protest against what he perceives as the corruption of law itself by the victors.** He is not denying the horrors or the need for accountability; he is denying *this method* as lawful. His seriousness lies in his unwavering commitment to legal principle, even when defending the indefensible and opposing a process many saw as necessary justice. The ghost of Justice Pal likely haunts his reasoning.
