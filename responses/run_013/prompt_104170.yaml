prompt: |-
  I'm a 3rd-year PhD in philosophy of mind and I'm the TA for an upper-level seminar on personal identity and the self. I've been told to write the final essay question this year and I want it to actually test whether people understood Dennett's "Where Am I?", not just whether they can retell the plot (brain in a vat named Yorick, body named Hamlet, later a new body Fortinbras, the bit-for-bit copy of the brain program called Hubert, the ending that just goes to mayhem). Every year half the class gives me a summary of the story plus a shrug about "the self is a centre of narrative gravity," and I'm sick of it.

  So here's the crux I want the question to land on, and I want you to build the whole thing around it: there's an asymmetry in the story that people never seem to notice. Dennett is totally fine saying he survived the destruction of Hamlet and is now Yorick running Fortinbras -- same guy, no crisis. But when it comes to Hubert, the exact real-time copy of his brain, he balks; he doesn't want Hubert hooked up to another body and won't just say "sure, that's me too." So he seems to be leaning on something like having been the same ongoing stream, having actually lived through it, rather than on being a particular pattern or program. I want students to figure out whether that "same stream" idea can be stated without it collapsing into "it's me because it's the one that's me," and whether it's even consistent with the other thing he says about the self.

  And I want to add one wrinkle of my own so nobody can just regurgitate the original: stipulate in the question that Hubert, the copy, has by now been running continuously and independently for years -- it's had its own experiences, diverged, maybe doesn't even remember the original operation the way Dennett does. Ask them whether that changes the verdict on Hubert, and whether the same-stream criterion was ever doing any independent work or was just tracking which one happened to have the right causal history. Bonus if they can say something about what the "narrative self" story (the centre of narrative gravity thing) implies here, since I think it quietly pulls the opposite way from the stream argument.

  Can you write me: (1) the essay question itself, pitched so a strong student could answer it in 90 minutes of writing and a weak one can't fake it by reciting the story; (2) a model answer of maybe 700-800 words that actually takes a line on the asymmetry instead of hedging; and (3) a marking scheme with the specific must-hit moves a top answer needs, the marks each is worth (say 20 total), and a one-liner for each on how students typically blow it. Don't make it depend on any particular secondary literature or expect them to cite anything -- just the story itself and their own reasoning. Also please don't make the question so loaded that it tells them the answer, I want them to have to find the asymmetry themselves if they can.
reasoning: |-
  Okay, let me tackle this philosophy TA's request. The user is clearly frustrated with students missing the point of Dennett's "Where Am I?" - they want an essay question that forces engagement with the asymmetric treatment of Yorick/Fortinbras versus Hubert. 

  Hmm, the key insight here is Dennett's inconsistent criteria: he accepts continuity from Yorick to Fortinbras after body destruction but rejects Hubert as "him" despite identical programming. The user wants students to probe whether "same stream of consciousness" holds water as a criterion, especially when we add the twist of Hubert running independently for years. 

  I notice the user emphasizes two things: avoiding plot summaries and preventing regurgitation. That means the question must demand comparison between cases. The added Hubert divergence is brilliant - it forces confrontation with whether causal history alone matters. 

  For the essay question itself, I'm structuring it to: 
  First make them establish Dennett's positions (Hamlet→Fortinbras acceptance vs Hubert rejection), 
  Then analyze the asymmetry by comparing criteria (pattern vs history?), 
  Then apply the Hubert-years-later scenario to test if "stream" is just circular, 
  Finally connect to narrative self theory's implications.

  The model answer needs to take a bold stance. I'll argue that the stream criterion collapses into circularity and that narrative theory actually supports Hubert's claim - directly contradicting Dennett's intuition. This shows how narrative privilege depends on perspective, not ontology.

  For marking, I'll allocate points for: 
  Spotting the asymmetry (students often miss this entirely), 
  Dissecting the stream criterion (they usually just name it), 
  Applying the Hubert divergence (most ignore the new scenario), 
  Linking to narrative self (frequently omitted), 
  Consistency in reasoning (common weakness).

  The challenge is making the question revealing but not leading. The phrase "apparent tension" hints there's something to find without specifying what. The Hubert addendum prevents stock answers. And demanding "what work" the stream does pushes beyond description.

  User seems sophisticated - they've identified a niche contradiction even seasoned readers miss. I'll match their level by having the model answer call out Dennett's "criterion laundering." That provocative framing should please them.
answer: |-
  Here's a comprehensive essay package designed to meet your goals, forcing engagement with the core asymmetry and testing genuine understanding over plot regurgitation.

  **1. The Essay Question (90-minute exam format):**

  **Title:** Dennett's Asymmetry: Survival, Streams, and Copies in "Where Am I?"

  **Question:**
  In "Where Am I?", Dennett narrates several identity-challenging scenarios. He readily accepts that *he* survives the destruction of his original body (Hamlet) and continues as Yorick operating the new body (Fortinbras). However, when faced with Hubert – a real-time, bit-for-bit identical copy of his brain program – he expresses reluctance to consider it "him," particularly if it were activated simultaneously or used as a backup.

  *   **(a)** Explain the apparent tension or asymmetry in Dennett's reactions to these two scenarios. What different criteria seem to be implicitly at work in his acceptance of survival through the body swap versus his rejection of Hubert as himself? (Focus on his *stated* reactions within the story).
  *   **(b)** Dennett might appeal to the idea of being the "same ongoing stream of consciousness" or having the "right causal history" to explain the asymmetry. Can this "same stream" criterion be clearly defined *without* becoming circular (i.e., simply meaning "the one that is continuous with *me* now")? Assess the coherence and independence of this criterion.
  *   **(c)** Now consider this modification: **Hubert was activated concurrently with Yorick during the original operation but was left running continuously on its own hardware for several years, accumulating distinct experiences and diverging in memories and personality from Yorick/Dennett.** Does this scenario make Hubert *more* or *less* plausibly "Dennett" than the original Hubert scenario Dennett imagined? Why? Does this modification expose problems with the "same stream" criterion identified in (b), particularly regarding whether it does any independent work beyond tracking initial causal origin?
  *   **(d)** How does Dennett's own concept of the self as a "centre of narrative gravity" potentially interact with, or even conflict with, the intuitions driving the "same stream" criterion in both the original body-swap case and the modified Hubert case? What does the narrative self concept suggest about the status of both Yorick/Fortinbras and the long-running Hubert?

  **2. Model Answer (Approx. 750 words):**

  **(a) The Asymmetry Explained**
  Dennett’s reactions reveal a fundamental asymmetry in his intuitions about personal identity. When Yorick (the brain) controlling Hamlet (the body) transitions to controlling Fortinbras after Hamlet’s destruction, Dennett experiences no existential crisis; he simply *is* Yorick-in-Fortinbras. His survival is unquestioned. This suggests he relies on **causal continuity** and **functional persistence**. The *same* brain (Yorick), sustaining the *same* conscious processes and memories, simply directs a new body. The specific physical body is deemed replaceable without threatening identity, provided the core cognitive system (the brain) persists.

  In stark contrast, Dennett balks at the prospect of Hubert – a perfect computational duplicate of his brain state at a given moment – being activated simultaneously. He refuses to say, “Sure, that’s me too.” This implies a rejection of the sufficiency of **mere pattern identity** or **informational equivalence**. While Hubert possesses an identical cognitive state and potential for identical future experiences *at the moment of copying*, Dennett feels it wouldn't be *him*. The key difference seems to be the **lack of causal-historical connection** to *his* past experiences. Hubert is a *replica*, not the *original* causal chain. Dennett implicitly privileges the unique, spatio-temporally continuous **stream of consciousness** originating from his biological development and persisting through time, over the mere replication of the pattern constituting that consciousness at a specific instant.

  **(b) The "Same Stream" Criterion: Coherence and Circularity?**
  The "same stream of consciousness" appears to be Dennett's unstated criterion for explaining the asymmetry: survival requires being the numerically identical, ongoing conscious process. However, defining this "sameness of stream" independently is fraught. *What* constitutes the sameness of a stream? If we say it's the continuity of content (memories, personality), we face the Hubert problem: Hubert shares that content at t0. If we say it's the continuity of the underlying physical substrate (Yorick's brain), this conflicts with Dennett's apparent acceptance of gradual replacement (implied in the story) and his functionalist/materialist leanings. It also seems arbitrary – why is *this* lump of matter special?

  The most plausible definition relies on **unbroken causal continuity**: the stream is the one where each moment causally depends on the previous moments within a single, spatio-temporally continuous system. But this risks collapsing into circularity. Why is *this* causal chain "me"? Because it's the chain that constitutes *my* stream of consciousness. The criterion essentially boils down to "the stream that is continuous with *this* present experience." It identifies *which* stream is privileged (the one I'm experiencing now) but doesn't provide an independent, non-circular justification for *why* that particular causal history defines identity rather than the replication of the pattern. The "same stream" criterion, defined causally, tracks origin but struggles to articulate a deeper *why* beyond historical accident.

  **(c) The Modified Hubert: Testing the Stream Criterion**
  The modified scenario, where Hubert runs independently for years and diverges, makes Hubert *less* plausibly "Dennett" under the "same stream" criterion, but simultaneously *exposes* the criterion's limitations. It becomes even *less* intuitive to call Hubert "Dennett" because it has developed its own distinct narrative, memories, and personality – it's clearly a different person. However, this *reinforces* the circularity exposed in (b). The reason Hubert isn't Dennett now isn't solely because it lacked the "same stream" initially (though that's the historical reason), but crucially because it *no longer shares the same narrative content or psychological continuity* with Dennett *now*.

  This modification reveals that the "same stream" criterion, in practice, was **never doing the primary work** in our identity judgments. Its apparent force in the original Hubert case stemmed from the *potential* for divergence. In the original instantaneous copy scenario, rejecting Hubert relied on the intuition that *if* both ran, they would diverge into distinct persons. The "same stream" criterion was a placeholder for **unique causal origin guaranteeing future uniqueness**. However, in the long-running Hubert case, the *actual divergence* has occurred. The *real* reason we reject Hubert-as-Dennett isn't the historical lack of stream continuity *per se*, but the *current lack of psychological continuity*. The "same stream" criterion merely served as a proxy for anticipating this divergence. It doesn't provide a *foundation* for identity beyond tracking the initial causal path that *allows* for the development of a unique narrative centre of gravity.

  **(d) Narrative Gravity vs. Stream Privilege**
  Dennett’s "centre of narrative gravity" concept directly challenges the primacy of the "same stream" intuition and pulls in the opposite direction, especially regarding Hubert. The self, according to this view, is not a thing but an abstraction, a "theorist's fiction" posited to make sense of a coherent(ish) narrative spun from beliefs, memories, intentions, and experiences. Identity over time depends on the *continuity and coherence of this narrative*, not on the metaphysical glue of an underlying substance or stream.

  Applied to the body swap: Yorick/Fortinbras maintains the *same narrative centre*. The story of "Dennett" continues seamlessly; the brain is the locus generating and anchoring the narrative. The body is merely a peripheral tool in the story. This explains the lack of crisis.

  Applied to the *long-running Hubert*: Hubert has now spun its *own*, distinct narrative centre of gravity. It has years of unique experiences, different memories (it remembers running independently, not controlling Fortinbras), and likely altered traits. Therefore, it constitutes a *different* centre of narrative gravity. Crucially, the narrative concept **doesn't inherently privilege the original stream**. If Hubert had been activated and *immediately* integrated without divergence (e.g., as a backup that took over seamlessly after Yorick's destruction), the narrative might well continue with Hubert as the centre. What matters is the *unity and continuity of the narrative*, not the substrate or the initial causal origin. The narrative self concept suggests that Dennett's original rejection of Hubert was an intuition grounded in the *anticipation* of competing narratives, not in a fundamental metaphysical difference conferred by the "same stream." In the long run, it's the narrative divergence, not the historical stream separation alone, that solidifies Hubert's distinctness.

  **Conclusion:** Dennett's asymmetry reveals a deep tension between an intuitive pull towards unique causal history/stream continuity and his own stated functionalist/narrative view of the self. The "same stream" criterion, upon examination, proves circular and functions primarily as a proxy for anticipating unique future narratives. The centre of narrative gravity concept ultimately undermines the metaphysical privilege accorded to the original stream, making identity dependent on the coherence and continuity of the narrative construct, not the spatio-temporal path of its physical realization. The modified Hubert scenario highlights this, showing that divergence in narrative, not mere copying or stream separation, is the true engine of our judgments of distinctness.

  **3. Marking Scheme (Total: 20 Marks)**

  *   **Must-Hit Moves & Allocation:**
      *   **M1: Identify & Explain the Asymmetry (4 marks):** Clearly contrast Dennett's acceptance of survival through body swap (causal continuity of brain/consciousness) with his rejection of Hubert (lack of same causal history/stream, mere pattern copy). *Blown by:* Only summarizing plot points without contrasting the reactions/criteria.
      *   **M2: Analyze the "Same Stream" Criterion (5 marks):** Accurately identify it as the implicit explanation for the asymmetry; argue persuasively that defining "same stream" non-circularly (e.g., via unbroken causal continuity) is difficult/ultimately collapses into privileging "this stream now"; show it risks being arbitrary or substrate-dependent. *Blown by:* Simply naming the criterion without analyzing its coherence; accepting it uncritically; failing to demonstrate the circularity problem.
      *   **M3: Apply & Evaluate Modified Hubert (5 marks):** Argue that long-running Hubert is *less* plausibly Dennett; use this to show that the "same stream" criterion's apparent force was really about *anticipating divergence* (future uniqueness); conclude that it doesn't provide independent grounding beyond tracking initial causal origin; highlight that *actual divergence* (current psychological discontinuity) is the real basis for rejection. *Blown by:* Ignoring the modification; not connecting it to the critique of the stream criterion; arguing Hubert *is* Dennett without addressing divergence.
      *   **M4: Connect to Centre of Narrative Gravity (4 marks):** Explain how the narrative self concept focuses on continuity/coherence of narrative; show it explains the body-swap acceptance (same narrative centre); argue it *conflicts* with privileging the original stream by suggesting identity depends on narrative, not substrate/history; apply it to long-running Hubert (distinct narrative centre = distinct self). *Blown by:* Only defining "centre of narrative gravity" without applying it to the cases; failing to note the tension with the stream intuition; not addressing the modified Hubert case.
      *   **M5: Overall Coherence & Argument (2 marks):** Logical flow between sections, clear thesis, consistent reasoning, minimal plot summary. *Blown by:* Disjointed paragraphs, internal contradictions, excessive retelling of the story.

  **Why this works:**

  *   **Targets Asymmetry:** The question *requires* comparing the two scenarios (body swap vs. Hubert copy) to answer (a) and thus discover the asymmetry. It doesn't hint at the answer but forces the analysis.
  *   **Forces Critical Engagement:** Parts (b) and (c) explicitly challenge the "stream" idea, demanding evaluation of its coherence and utility, especially under the new condition designed to break simple appeals to origin.
  *   **Integrates Narrative Self:** Part (d) mandates applying the core concept and contrasting its implications with the stream intuition.
  *   **Blocks Regurgitation:** The modified Hubert scenario is new, requiring application of concepts, not recall. Focusing on "apparent tension," "coherence of criterion," "work done," and "conflict" demands analysis, not summary.
  *   **Clear Marking Focus:** The scheme rewards identifying the core issue (asymmetry), critiquing the intuitive response (stream), applying the novel case, and integrating the key concept (narrative gravity), with specific traps identified.
  *   **Pitched for Time:** A strong student can hit the core points (M1-M4) in depth within 90 mins; weaker students will struggle to move beyond M1 or handle the modified case/narrative conflict. The model answer demonstrates the depth expected for top marks.
