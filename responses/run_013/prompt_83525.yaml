  Below is a decision tree designed to map the moral distinction between doing harm and allowing harm, based on concrete cases and principles. The tree has **10 leaves** (covering all required views), a maximum depth of **4 questions**, and uses cases to force distinctions without prior position knowledge. Each leaf includes a **descriptive name**, a **one-sentence awkward commitment** (highlighting a case or implication that strains the view), and classification of the view on the **baseline requirement** (whether it needs a defined "what if you did nothing?" counterfactual) and **line-vs-gradient** structure.

  ### Decision Tree
  **Start at Question 1.**

  1. **In the surgeon case: A surgeon stops mid-operation for no reason, causing death. Is stopping more like actively harming the patient (e.g., stabbing them) or more like refusing to help (e.g., ignoring a stranger in need)?**
     - **Actively harming (closer to stabbing)**: Go to Q2.
     - **Refusing to help (closer to ignoring)**: Go to Q3.

  2. **In the doorway case: You stand in a doorway, blocking a paramedic from reaching a dying person. Is this morally different from simply never opening the door for them?**
     - **Yes, blocking is worse**: Go to Q4.
     - **No, both are equally bad/acceptable**: Go to Q5.

  3. **In the chaotic case: A building collapses randomly; you could rescue one trapped person but don’t. If it’s genuinely unknowable what would’ve happened if you acted, can we still judge whether you did harm or allowed harm?**
     - **Yes, we can judge without knowing the "what if"**: Go to Q6.
     - **No, we need to know the "what if" to judge**: Go to Q7.

  4. **In the firing squad: You shoot as one of ten; the other nine would’ve killed anyway. Did you cause death, or just fail to prevent it?**
     - **Caused death (you actively harmed)**: Leaf: **Harmful-agency view**.  
       *Awkward commitment: Withdrawing life support counts as "directing harm" at someone, even if it feels like passive allowing.*  
       *Baseline: Not required. Line/gradient: Binary line.*
     - **Failed to prevent it (you allowed harm)**: Leaf: **Rights view**.  
       *Awkward commitment: You may never divert a trolley to kill one to save five, but you may let five die to avoid saving one.*  
       *Baseline: Not required. Line/gradient: Binary line.*

  5. **In the lifeguard case: A lifeguard swims halfway to a drowning person and turns back. Is this morally identical to a lifeguard who never gets in the water?**
     - **Yes, identical**: Leaf: **Flat no-difference view**.  
       *Awkward commitment: Pulling the plug on a patient is morally identical to never starting life support, despite intuitions about "active killing".*  
       *Baseline: Not required. Line/gradient: Irrelevant (only outcomes matter).*
     - **No, turning back is worse**: Leaf: **Intention view**.  
       *Awkward commitment: Harm caused as a side effect (e.g., destroying a village to save a city) might be permissible even if "done", while identical unintended harm might be condemned.*  
       *Baseline: Not required. Line/gradient: Binary line (based on mental state).*

  6. **In the kidney case: You decline to donate a kidney (allowing death). Is this morally identical to forcibly taking a kidney from someone (causing death)?**
     - **Yes, identical**: Leaf: **Blame-but-not-wrongness view**.  
       *Awkward commitment: Murdering to avoid minor inconvenience might be permissible if allowing death in the same scenario would be, but you’d be blamed more.*  
       *Baseline: Not required. Line/gradient: Gradient (blame varies).*
     - **No, taking is worse**: Leaf: **Agent-causation view**.  
       *Awkward commitment: If free will is an illusion, all "doing harm" collapses into "allowing harm" via prior causes.*  
       *Baseline: Not required. Line/gradient: Binary line.*

  7. **In the lightbulb case: You unscrew the only bulb in an operating room (causing death). Is this morally different from merely forgetting to replace the bulb (allowing death)?**
     - **Yes, unscrewing is worse**: Leaf: **Difference-making view**.  
       *Awkward commitment: In the firing squad, you didn't "cause death" if others would’ve killed anyway, even if you intended to.*  
       *Baseline: Required. Line/gradient: Binary line.*
     - **No, both are equivalent**: Leaf: **Degrees view**.  
       *Awkward commitment: No clear line separates "doing" from "allowing", making legal rules (e.g., for manslaughter) arbitrary.*  
       *Baseline: Optional. Line/gradient: Gradient.*

  8. **In the parent case: A parent never feeds their child (allowing starvation). Is this morally different from taking food away mid-meal (causing starvation)?**
     - **Yes, taking is worse**: Leaf: **Normal-course view**.  
       *Awkward commitment: Allowing a "normal" disaster (e.g., a hurricane in a hurricane-prone area) might be more acceptable than allowing a rare one.*  
       *Baseline: Required. Line/gradient: Binary line.*
     - **No, both are equally wrong**: Leaf: **Social-practice view**.  
       *Awkward commitment: If society labeled "not donating a kidney" as "killing", it would be morally wrong, even if it isn’t inherently.*  
       *Baseline: Not required. Line/gradient: Binary (as a social fact).*

  ### Empty Cells & Coherence
  - **Empty cell 1: "Baseline-required + Gradient"**  
    *Status*: Coherent but undesired (no one holds it).  
    *Why*: Baseline-required views (difference-making, normal-course) rely on binary comparisons (e.g., "diverted from normal"); gradient views (degrees) don’t need strict baselines. Combining these creates tension—e.g., a gradient can’t depend on a fixed baseline.
    
  - **Empty cell 2: "Baseline-optional + Line + Non-agential"**  
    *Status*: Incoherent.  
    *Why*: Binary lines without baselines require a non-causal anchor (e.g., rights, agency). Without agency (e.g., reducing morality to causal graphs), the line collapses into difference-making or degrees.

  ### Indistinguishable Views on Your Cases
  - **Rights view vs. Harmful-agency view**: Answer all cases identically.  
    *Why*: Both treat blocking the doorway as "doing harm" (worse than not opening it), and both reject counterfactuals (e.g., in chaotic cases).  
    *Distinction*: Only theoretical—rights focus on duties, agency on causal direction.
  - **Flat no-difference vs. Degrees view**: Answer all cases identically except the lightbulb case.  
    *Why*: Both reject intrinsic moral differences; degrees allows slight variations in causal involvement, but your cases don’t probe this finely. Flat view treats unscrewing/forgetting identically; degrees might assign slightly more blame to unscrewing.

  ### Causal Routes View
  - **Where it lands**: Not a separate leaf; a **redescription of the harmful-agency view**.  
    *Why*: The "threat vs. victim" causal route (e.g., starting a fire = threat route; not warning = victim route) is how harmful-agency operationalizes "directing harm." It doesn’t add new commitments—e.g., in the fire case, both views say starting the fire is "doing harm" (you initiate the threat), while not warning is "allowing" (you fail the victim).  
    *Test case*: In the lifeguard who turns back, causal routes would call this a "threat" (you created false hope), matching harmful-agency’s "directing harm."

