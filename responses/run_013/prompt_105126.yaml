answer: |-
  **The Scenario:**
  A philanthropist has $100,000 to spend. Project A uses the funds to provide cataract surgeries for 100 identifiable elderly people living in poverty today, restoring their sight for their remaining 10 years on average, granting each a modest but certain gain of 10 quality-adjusted life years (QALYs), totaling 1,000 QALYs. Project B allocates the funds to lobbying for marginally improved international coordination on biosecurity research. Credible expert analysis shows this effort has no measurable near-term benefits (e.g., it doesn't prevent any specific current disease outbreak) but slightly increases the probability that humanity avoids a permanent, terminal collapse (like an unrecoverable pandemic) within the next century. This probability increase is estimated at 0.0001%, and avoiding collapse would preserve the potential for a future civilization lasting millions of years with an average population size supporting 10<sup>16</sup> total future QALYs. The expected value of Project B is therefore 0.000001 * 10<sup>16</sup> = 10<sup>10</sup> (10 billion) expected QALYs. The near-term gain (1,000 QALYs) is vastly smaller than the far-future expected gain (10 billion QALYs), but the probability is extremely low, making the expected values comparable enough that only the core axiological difference triggers the disagreement.

  **Verdicts and Derivation:**

  1.  **Strong Longtermism:** Chooses Project B.
      *   *Derivation:* Strong longtermism is committed to strict time-neutrality (the value of a QALY is the same regardless of when it occurs) and expected-value totalism (maximize the sum of expected well-being across all individuals, present and future, impartially). Project B offers 10 billion expected QALYs, while Project A offers only 1,000 certain QALYs. 10<sup>10</sup> > 10<sup>3</sup>. Therefore, Project B maximizes expected value.

  2.  **Moderate Consequentialism (Present Prioritizing):** Chooses Project A.
      *   *Derivation:* This view incorporates a small pure time discount rate (e.g., 0.1% per year). Discounting future QALYs over the vast timescale involved drastically reduces the present value of Project B's benefits. Discounting 10<sup>16</sup> QALYs received on average 50 years from now at 0.1% annually gives a present value of approximately 10<sup>16</sup> / e<sup>(0.001 * 50)</sup> ≈ 10<sup>16</sup> / 1.05 ≈ 9.5 * 10<sup>15</sup>. Multiplying by the probability: 0.000001 * 9.5 * 10<sup>15</sup> ≈ 9.5 * 10<sup>9</sup> discounted expected QALYs. While still larger numerically than Project A's 1,000 QALYs, the moderate view recognizes the extreme fragility of such long-term, low-probability predictions. It holds that expected value calculations become unstable and unreliable over such vast timescales and low probabilities. The *certain* and *tangible* benefit to *identifiable people now* holds decisive weight against the highly speculative, discounted distant benefit.

  **The Hingeing Feature and Check:**

  *   **Hingeing Feature:** Strict Time-Neutrality (Zero Discount Rate) vs. Recognition of Long-Term Prediction Fragility (Operationalized via a Small Discount Rate or Lexical Priority).
  *   **Check - Removing/Modifying the Feature:**
      *   If we *remove* the moderate view's discount rate/fragility concern and adopt *strict time-neutrality*, Project B wins easily on expected value (10<sup>10</sup> vs 10<sup>3</sup>), forcing the moderate view to concede to longtermism.
      *   Conversely, if we *add* a small discount rate (like 0.1%) to the longtermist calculation, Project B's discounted expected value (≈9.5 * 10<sup>9</sup>) remains larger numerically, but the instability highlighted by the moderate view makes this calculation practically meaningless and insufficient to override the certain near-term benefit. If the moderate view uses a lexical priority for existing people, Project A wins regardless of the future calculation.
  *   **Attacks by the "Worse-Faring" View Defender:**
      *   **Strong Longtermist attacking the case:** Argues the probability increase for Project B is underestimated. Even minor efforts can be pivotal in complex systems ("butterfly effect"). Experts are systematically biased against acknowledging the potential impact of marginal efforts on tail risks. The fragility argument is an excuse for myopia; reliable expected value *is* still possible and decisive here. Discounting is unjustifiable.
      *   **Moderate Consequentialist attacking the case:** Argues the probability estimate for Project B is wildly speculative and likely overestimated. The causal chain linking this specific lobbying effort to avoiding collapse a century hence is incredibly tenuous and involves countless unknown variables, making the expected value calculation practically vacuous. Relying on it constitutes "Pascal's Mugging." The tangible, certain good for suffering people *now* is ethically paramount compared to this speculative, unstable calculation about the deep future.
