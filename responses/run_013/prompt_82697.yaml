prompt: |-
  ok so I need a plan, not an explanation. Thursday, 75 minutes, my 300-level philosophy of science seminar, twenty-two students, half of them pre-med, they've had one logic class and the reading and nothing else in the area. It's the incommensurability session and I've taught it badly three years running, so assume I know the material (I've been teaching Kuhn for fifteen years) and tell me how to teach it.

  What I want, in order of how much it matters to me. First, the sequence: what has to be on the board before what, and why each piece is load-bearing for the next one. Every year I get fifteen minutes in and realize they can't even hear the claim because they're missing something I assumed was obvious, and I'd like to know what that thing is before I open my mouth. Second, the single case I build the whole session on, and what it has to have and not have. I've been toying with figure skating: they scrapped the 6.0 system after the 2002 pairs scandal and replaced it with a code of points where every element gets a base value plus a grade of execution and the performance gets broken into five separate components, so there's no second mark for artistic impression anymore and a 5.8 has nowhere to live — and I gather the old marks were ordinal anyway, ranking skaters against each other rather than measuring anything absolute, which I think makes the case even better but check me on the details. Is that the right shape (a whole vocabulary of appraisal disappearing rather than being mismeasured), or does it fall apart the second some smart kid says the new system is just better? And no Ptolemy/Copernicus, no phlogiston, no duck-rabbit unless you can actually defend it — they've met all three and can recite them, and the duck-rabbit seems to me to teach them that this is about seeing rather than about what words mean. Third, the misconceptions in the order they'll actually form them, with the exact point in the sequence where I head each one off. My guesses: they collapse incommensurability into incomparability, i.e. anything goes; they think it's the same as disagreeing about values; and they walk out thinking a paradigm shift is a conversion with no reasons on either side, which is the opposite of what I want, so tell me what has to be in place before that so the rationality survives. Fourth, one question for the last ten minutes that tells me whether they've got it, with the wrong answer and the right answer spelled out, because I can never tell the difference between them being quiet and them being lost. Fifth, what I should openly refuse to do at this level and say so out loud — I'm thinking the world-changes metaphysics and the whole Kuhn/Popper soap opera, but the later narrower version has to land somehow (it's about partial translation between local vocabularies, and it explicitly isn't incomparability), and I don't want to stand there summarizing the secondary literature at them.

  Finish with one line that reads Verdict: followed by the case I should build the session on, five words or less, so I can paste it into my notes.
reasoning: |-
  Okay, let me tackle this philosophy professor's request. They're clearly frustrated after struggling with teaching Kuhn's incommensurability for three years and want a concrete action plan, not theoretical explanations. 

  First, I need to understand their core requirements: they prioritize sequencing (what concepts must be built consecutively), a single case study (avoiding overused examples), misconception prevention, an assessment question, and explicit boundaries. The figure skating example they proposed seems promising - it involves vocabulary replacement rather than measurement disputes, which aligns with Kuhn's linguistic incommensurability. But I should verify if it withstands the "new system is better" objection.

  For sequencing, I imagine starting with paradigm shifts as vocabulary changes rather than worldview transformations. The figure skating case demonstrates this well: the shift from 6.0 system to Code of Points eliminates entire evaluative categories. This leads naturally to partial translatability - judges can still compare technical elements but lose the language for holistic artistic impression. 

  Key misconceptions to preempt: 
  - First, confusing incommensurability with total incomparability. The skating case shows how some aspects remain comparable (technical scores) while others don't (artistic impression scores).
  - Second, conflating it with value disagreements. Here the issue is untranslatable terminology, not conflicting preferences.
  - Third, thinking paradigm shifts are irrational. But the skating example had clear rationales - fixing scoring flaws after the 2002 scandal.

  For the assessment question, I'd design something that tests whether they grasp that comparison happens through shared fragments, not total translation. Like asking how judges might compare skaters across eras despite the system change.

  Boundaries should explicitly exclude metaphysical interpretations and Popper debates. Focus narrowly on vocabulary replacement and partial translation.

  The skating case holds up because even if the new system is objectively better, the old evaluative framework remains untranslatable - you can't express a "5.8 artistic impression" in the new terminology. That's precisely Kuhn's point about loss of meaning during revolutions.

  Final verdict: figure skating case stands.
answer: |-
  Here's your execution plan. Follow it verbatim for Thursday:

  **Board Sequence (45 mins total - strict timing):**
  1. (0-5 mins) Left column: **"Paradigm = Shared Vocabulary + Standards"** (define: "tools for describing/evaluating phenomena"). *Why load-bearing:* Establishes that scientific change isn't just about facts but the language/metrics we use.  
  2. (5-10 mins) Below: **"Revolution = Vocabulary Replacement"** (emphasize: NOT "world changes" or "progress"). *Why:* Prevents metaphysics drift; focuses on linguistic shift.  
  3. (10-15 mins) Right column: **"Translation Problem: Some Old Terms → No Direct New Equivalent"** (draw arrow with "X"). *Why:* Isolates incommensurability as untranslatability, not incomparability.  
  4. (15-25 mins) **Case Anchor: FIGURE SKATING SCORING SHIFT (2002)**  
     - Old system (6.0): "Technical Merit" + **"Artistic Impression"** (ordinal: ranks skaters *against each other* in performance)  
     - New system (Code of Points): "Base Value" + "Grade of Execution" + **5 Component Scores** (TES/PCS)  
     - **Key Loss:** "Artistic Impression" score (e.g., 5.8) has **no equivalent** in new system. Not "measured wrong"—it *ceases to exist* as a category.  
  5. (25-35 mins) **"Partial Comparability":** Circle "Technical Merit" & "TES". Show how jumps/spins remain comparable. Draw slash through "Artistic Impression" → **"No Shared Scale for Holistic Performance"**. *Why:* Proves incommensurability ≠ total incomparability.  
  6. (35-45 mins) **"Rational Shifts Aren't Arbitrary":** Under case:  
     - **Reasons for Change:** 2002 scandal exposed flaws (corruption in ordinal judging)  
     - **Reasons Against:** Lost ability to compare "artistic excellence" across eras  
     - **"Rationality = Solving Local Problems, Not 'Better' Truth"**  

  **Why This Case Works:**  
  - It’s **vocabulary death** ("Artistic Impression" vanishes), not mismeasurement.  
  - **Defuses "better system" objections:** Even if the new system fixes corruption, the *meaning* of "artistic excellence" is still lost—old scores can’t be expressed or judged in new terms.  
  - **Pre-med relevance:** Scoring systems = diagnostic criteria changes (e.g., DSM revisions where "hysteria" disappears).  

  **Misconception Defense Sequence:**  
  1. **"Incommensurability = Incomparability?"**  
     - *When it forms:* After defining "translation problem" (Step 3).  
     - *Head off:* Show partial comparability in skating (Step 5). **Script:** "We can still compare jumps. What dies is one *specific* standard."  
  2. **"Isn’t this just value disagreement?"**  
     - *When it forms:* During case discussion (Step 4).  
     - *Head off:* Contrast: "Values debate: 'Should art matter?' vs. Incommensurability: 'How do we score art now?'" **Script:** "The issue isn’t whether art matters—it’s that the *tool* to appraise it is gone."  
  3. **"Shifts are irrational conversions?"**  
     - *When it forms:* After rationality discussion (Step 6).  
     - *Head off:* Emphasize **problem-solving**. **Script:** "Revolutions fix flaws (like corrupt scoring), but cost: lost meanings. Reasons exist, but aren’t neutral."  

  **Diagnostic Question (Last 10 mins):**  
  *Prompt:* "Post-2002, how could a judge explain why 1998’s 'perfect 6.0 artistic impression' was *excellent*, using only Code of Points terms?"  
  - **Wrong Answer:** "They’d give high PCS scores" (misunderstanding: PCS ≠ direct translation of "artistic impression").  
  - **Right Answer:** "They **can’t fully explain it**. They might say 'strong performance skills' but that’s a *new* category—the *specific meaning* of a 6.0 is untranslatable."  

  **Open Refusals (State upfront):**  
  - "We are **NOT** asking if the world ‘really changes’ during revolutions."  
  - "We are **NOT** debating Kuhn vs. Popper."  
  - "We are **NOT** discussing ‘conversion experiences’."  
  **Script:** "This session is only about **lost meanings in language shifts**. Save broader critiques for next week."  

  ---

  **Verdict: FIGURE SKATING SCORING SHIFT**
