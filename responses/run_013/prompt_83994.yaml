  Starting with the definition of lying is logical since it's foundational. Augustine defines lying as the intention to deceive, not the falsity of the statement. The follow-up should address counterintuitive cases like deceiving someone who can't be deceived or using a true statement to mislead. This sets the stage for later questions.

  Next, the distinction between believing and opining. Augustine differentiates between someone who lies (intends to deceive) and someone who asserts rashly but believes it's true. The follow-up could question the moral relevance if both cause equal harm. This challenges whether intent alone should determine morality.

  The teleological argument about speech being for conveying truth. If speech's purpose is perverted by lying, what if someone rejects this teleology? The follow-up could ask if the prohibition still holds without that premise. This tests the robustness of Augustine's framework.

  Then the graded catalogue. How can lies be ranked in gravity if all are absolutely prohibited? The follow-up might question if this ranking undermines the absoluteness by implying some lies are less bad.

  Biblical cases are crucial. Augustine praises the Hebrew midwives and Rahab for their intent but not their lies. The follow-up asks if this makes scriptural praise ambiguous regarding the act's morality. This probes consistency in interpretation.

  The martyrdom argument: lying to save a life undermines martyrdom. The follow-up could challenge if the stakes are commensurable and if this proves too much by forbidding any life-saving deception. This addresses a common objection.

  The controversy about infiltrating heretics. Augustine opposed lying even for good ends. The follow-up could ask about the difference between deception and concealment. This explores boundaries and practical implications.

  To challenge the "lesser evil but not permitted" move, a question could present a scenario where lying is the only way to prevent catastrophe, pushing the scholar to explain why it's still not permitted. The follow-up could escalate the stakes to test the absolutism.

