  We are building a 45-minute session for upper-sixth form students (Year 13) on the surprise exam paradox. The goal is to lead them to a specific diagnosis: the backward induction fails because the first premise (that the class knows the teacher's announcement) is forbidden by the announcement itself. Thus, the announcement is not false but unknowable in advance. The exam can then occur on Wednesday (or any day) as a surprise.

  We are using a carrying device: a coin-toss mechanism to fix the exam day. The teacher tosses a coin each evening (Monday to Thursday). Heads means the exam is the next day; tails means no exam the next day and the coin is tossed again the next evening. If it's tails on Thursday, no exam. This guarantees that the exam is always a surprise (since the class never knows for sure the night before) but at the cost of a chance of no exam (1/32). We contrast this with the guaranteed exam scenario, where the induction base (Friday) is predictable.

  The session must avoid becoming a probability exercise and must not let students think that randomisation "solves" the paradox. Instead, we use it to highlight the tension between guaranteed occurrence and guaranteed surprise.

  Order of dependencies:
  1. Understanding the setup: the teacher's announcement (exam next week, on one day, and it will be a surprise).
  2. The concept of "surprise" being informational (the class cannot know the night before) and not about the teacher's secrecy.
  3. The backward induction argument (starting with Friday, then Thursday, etc.).
  4. The paradox: the induction seems to rule out every day, but then the exam happens (say, on Wednesday) and is a surprise.

  We must establish early that unpredictability is about the class's state of knowledge. We do this by having them imagine they are in the class and asking each morning: "Do you know for sure that the exam is today?" We emphasize that the teacher might have fixed the day in advance, but the class doesn't know.

  Misconceptions and when to address them:
  - The teacher was lying: likely to surface after the paradox is presented (when they see the exam happens). We head this off immediately by reiterating the teacher's truthfulness is assumed. (Address when the paradox is first felt.)
  - Logic is broken: might come up during the induction. We let this run a little because it's natural, then we use the coin-toss device to show that the induction premise is flawed.
  - It happened so there was no paradox: after the exam occurs. We point out that the induction had already ruled out every day, so how did it happen? This is the core and we use it to lead to the diagnosis.
  - Near-certainty as certainty: during the coin-toss scenario. We must be careful to distinguish probability from certainty. We note that in the coin-toss setup, even a Friday exam is not certain (only 1/16 chance by Thursday night) so it's always a surprise. But in the guaranteed case, Friday is certain if not before, so not a surprise.

  Check question at the end: 
  "Could the exam have been on Friday? If not, why not? If yes, how was it a surprise?"

  Omissions: 
  - Modal logic and common knowledge: explicitly state that we are assuming the class knows the announcement and that the teacher is truthful, but we are not going into the formal logical machinery.
  - The unexpected hanging/execution paradox: mention that it's a famous variant in law and philosophy, but we focus on the exam version.

