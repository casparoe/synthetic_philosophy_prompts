answer: |-
  ### Plan for a 45-Minute Session on the Surprise Exam Paradox

  **Overall Goal:** Students end with a clear, defensible diagnosis: the backward induction fails because the first premise (that the class knows the teacher’s announcement) is forbidden by the announcement itself. The announcement is not false but *unknowable in advance*, allowing the exam to occur (e.g., on Wednesday) as a surprise.

  **Diagnosis Choice:**  
  Your proposed diagnosis is **correct and should be the endpoint**. Do not lead with it—start with the puzzle to build tension. The session should culminate in this insight after students grapple with the paradox and your coin-toss device.

  ---

  #### 1. **Spine of the Session**  
     - **End Goal:** Students articulate and defend: "The backward induction fails because the class cannot know the announcement in advance. The announcement is unknowable, not false, so the exam can surprise everyone (e.g., on Wednesday)."  
     - **Path to Diagnosis:**  
       - Begin with the classic puzzle to create confusion.  
       - Use the coin-toss device to expose the tension between guaranteed occurrence and guaranteed surprise.  
       - Contrast with the classic version to reveal why the induction fails.  

  ---

  #### 2. **Carrying Device: Coin-Toss Mechanism**  
     - **Setup:**  
       - Teacher uses a coin toss each evening (Mon–Thu). Heads: exam tomorrow; tails: no exam tomorrow, repeat next evening. Tails on Thursday: no exam.  
       - Week: Monday–Friday (5 days). Probability of no exam: \( \frac{1}{32} \) (since 5 tosses: Sun–Thu evenings).  
     - **Purpose:**  
       - Shows surprise is possible every day (class never certain the night before).  
       - Highlights the trade-off: Guaranteed surprise requires accepting a chance of no exam. Guaranteed occurrence makes the last-day exam predictable, restoring the induction’s base case.  
     - **What It Must Do:**  
       - Illustrate that surprise is informational (dependent on class’s knowledge, not teacher’s secrecy).  
       - Force the insight: "Certainty of surprise and certainty of occurrence cannot coexist."  
     - **Risks to Mitigate:**  
       - **Avoid collapsing into probability:** Keep focus on knowledge, not math. Say: "We’re using probabilities to model ignorance, but the paradox is about what the class can know."  
       - **Prevent misdiagnosis:** Explicitly state: "Randomization doesn’t ‘solve’ the paradox; it swaps a premise (guaranteed occurrence) to show why the original version fails."  
     - **What It Omits:** The classic version’s deterministic setup (which creates a stronger paradox). Use the device only to expose the trade-off, then return to the classic puzzle for diagnosis.  

  ---

  #### 3. **Order and Dependencies**  
  **Key Dependency:** Students must grasp that "surprise" is about the class’s *information*, not the teacher’s secrecy. Establish this first.  
  **Sequence** (total 45 mins):  

  1. **Setup and Surprise Defined (5 mins):**  
     - "Teacher announces: Exam next week (Mon–Fri), one day, and it will be a surprise—you won’t know the night before."  
     - **Crucial:** Ask, *"What does 'surprise' mean here? If you knew on Tuesday night the exam is Wednesday, would it be a surprise?"* Emphasize: **Surprise = lack of knowledge the night before.** Use an example: "If exams usually happen on Fridays, but this one is on Wednesday, is it a surprise? Only if you didn’t expect it Wednesday morning!"  

  2. **Backward Induction (8 mins):**  
     - Walk through step-by-step:  
       - Friday: If no exam by Thu, exam must be Fri → not a surprise → ruled out.  
       - Thursday: If no exam by Wed, must be Thu (Fri ruled out) → not a surprise → ruled out.  
       - Continue to Monday → no possible day. Paradox: Exam seems impossible!  

  3. **Coin-Toss Device (10 mins):**  
     - Introduce: "Teacher uses coin tosses. Heads: exam tomorrow; tails: no exam, re-toss. Tails on Thu: no exam."  
     - Ask: "Can the exam be a surprise every day? Why?"  
       - Highlight: On any night, class never certain of exam tomorrow (e.g., Thu night: 50% chance of Fri exam, 50% no exam → uncertainty → surprise possible).  
     - Contrast: "But there’s a \( \frac{1}{32} \) chance of no exam. If we demand guaranteed occurrence, what happens to Friday?"  

  4. **Paradox Resurfaced (5 mins):**  
     - Return to classic version: "If exam must happen, Friday is predictable if no exam by Thu → not a surprise. But then Thursday becomes predictable, and so on."  
     - Pose dilemma: "Guaranteed occurrence kills surprise on the last day. Guaranteed surprise (via coin) kills guaranteed occurrence. Can we have both?"  

  5. **Diagnosis (10 mins):**  
     - Guide students: "The induction assumes the class *knows* the announcement. But if they know it, they deduce no exam → contradiction. So the announcement can’t be known in advance!"  
     - Formalize diagnosis: "The announcement is *unknowable*, not false. The induction never starts because its first step fails."  
     - Example: "When exam happens on Wednesday, it’s a surprise because the class couldn’t trust the induction."  

  6. **Check Question and Wrap-up (2 mins):**  
     - **Check question:** *"If the exam happens on Friday, how can it be a surprise? Didn’t the class know by Thursday night?"*  
       - **Target diagnosis:** "They couldn’t know the announcement in advance, so the induction didn’t run → surprise possible."  
       - **Nearest misses:**  
         - "Teacher lied": No, announcement was true.  
         - "Induction is flawed": No, it’s sound but inapplicable.  
     - **Conclusion:** Reiterate diagnosis: "The announcement forbids the knowledge it needs to be believed—unknowability resolves the paradox."  

  ---

  #### 4. **Misconceptions**  
  **Order of Surface and Handling:**  

  1. **"Teacher was lying"** (surfaces during/after induction):  
     - **When:** During step 3 (induction) or 4 (paradox resurfaced).  
     - **Handle immediately:** "Assume the teacher is truthful. The exam *does* happen, and it *is* a surprise—so lying isn’t the issue."  

  2. **"Logic is broken"** (surfaces during induction):  
     - **Let it run briefly** (during step 2): Allows students to feel the paradox.  
     - **Then pivot:** "The logic seems airtight, but it leads to absurdity—so we must check its premises."  

  3. **"It happened, so there was no paradox"** (surfaces after exam example):  
     - **When:** During step 4 (paradox resurfaced).  
     - **Head off:** "But the induction said it couldn’t happen at all! Why didn’t the prediction hold?"  

  4. **"Near-certainty as certainty"** (surfaces during coin-toss):  
     - **When:** During step 3 (coin-toss).  
     - **Handle:** "Probability ≠ certainty. In the coin version, Friday is never 100% certain → surprise possible. But if we demand 100% occurrence, certainty returns."  

  5. **"Randomization solves it"** (surfaces after coin-toss):  
     - **When:** During step 5 (diagnosis).  
     - **Head off:** "No—randomization avoids the paradox by dropping guaranteed occurrence. The classic version’s tension remains."  

  ---

  #### 5. **Omissions**  
     - **Modal logic/common knowledge:** "We’re simplifying—no need for formal operators (e.g., ‘knows that knows’) here."  
     - **Unexpected execution:** "This has a cousin in law—google ‘unexpected hanging’—but today we focus on the exam."  
     - **How to refuse without truncation:** Frame positively: "Today’s insight is foundational. With more math/philosophy, you’d refine this—but the core is unknowability."  

  ---

  #### 6. **Timings**  
  - **Intro & surprise defined:** 5 mins  
  - **Backward induction:** 8 mins (*risk: overrun by 2 mins if students debate steps*)  
  - **Coin-toss device:** 10 mins  
  - **Paradox resurfaced:** 5 mins  
  - **Diagnosis:** 10 mins (*risk: overrun by 3 mins if misconception #5 lingers*)  
  - **Check & wrap-up:** 2 mins  
  - **Buffer:** 5 mins (use for Q&A or extending step 5).  

  **Risk Areas:** Backward induction (complex) and diagnosis (abstract). If short on time, shorten coin-toss probability details (focus on uncertainty, not calculations).
