prompt: |-
  I'm putting together a grad seminar on conditionals and I've managed to confuse myself, so I'm hoping you can straighten me out — tell me where this reasoning goes wrong.

  Lewis's trivialty results show that the probability of an indicative conditional can't be the conditional probability, i.e. Adams' thesis is dead. But Adams' thesis was basically the only thing that made 'if' sentences come out with the right probabilities — the material conditional gives you P(not-A or C), which is wrong whenever C is antecedently unlikely. So if the only route to getting the probabilities right is ruled out by triviality, and the material conditional is the only truth-functional reading going, it feels like I'm forced into one of two corners: either (a) indicative conditionals have no truth conditions at all, or (b) they're material conditionals and we just have to accept that everyone's probability judgements about them are systematically irrational.

  Neither can be right — half the literature seems to carry on assigning probabilities to conditionals like nothing happened. So what am I missing? Is triviality just a much narrower result than I'm taking it to be, or was Adams' thesis never about truth conditions in the first place? And if it's the latter, then what is the probability of an indicative conditional the probability *of*, if not of a proposition?

  Related: is there some third option I'm skipping between the material reading and the no-truth-conditions reading? I keep feeling the possible-worlds / variably-strict crowd (Stalnaker, Lewis) must slot in somewhere, but I can't see where they fit if triviality is supposedly blocking the probabilistic route. I'd rather not tell my students something I'd have to walk back next week, so I'd appreciate you being blunt about which of these moves I'm getting wrong and why.
reasoning: |-
  Okay, the user is preparing a grad seminar on conditionals and is tangled up in Lewis's triviality results. They're confused about why Adams' Thesis seems necessary for correct probabilities but is ruled out by triviality, leaving a dilemma between no truth conditions or accepting the material conditional with irrational probabilities. 

  First, I need to unpack where their reasoning goes astray. They're assuming Adams' Thesis (P(if A then C) = P(C|A)) is the only way to get probabilities right, and that without it, conditionals can't have probabilities. But actually, Adams never claimed conditionals have truth conditions—his thesis was about assertability, not truth. The triviality results only kill propositional truth-conditional accounts that try to equate probability with conditional probability. 

  The user also misses the non-propositional escape hatch: conditionals can have probabilities without being truth-apt. That's what Adams proposed—probabilities as measures of acceptability based on conditional belief. Many in the field still assign probabilities this way post-triviality; they just don't treat them as probabilities of truth. 

  The material conditional is indeed a bad fit—P(not-A or C) inflates probabilities when A is unlikely, which matches neither intuition nor Adams' Thesis. But non-material options exist: Stalnaker's possible-worlds approach avoids triviality by being non-truth-functional (selection functions block antecedent-strengthening). It doesn't satisfy Adams' Thesis universally, but it explains why people might approximate it in everyday contexts. 

  The user's "two corners" false dilemma ignores this middle ground: conditionals can have truth conditions (like Stalnaker's) without equating to material conditionals or collapsing under triviality. The key is distinguishing probability-as-truth from probability-as-rational-acceptance. 

  For teaching, I should emphasize: triviality only blocks Adams' Thesis for propositional accounts, Adams himself avoided that pitfall, and Stalnaker offers a truth-conditional model that survives triviality by being non-truth-functional. The literature keeps using probabilities because many follow Adams in treating them as non-truth-conditional acceptability measures. 

  Their tension comes from conflating truth conditions with probability assignments. Once separated, the landscape makes sense: non-propositionalists keep Adams' Thesis as acceptability, while propositionalists like Stalnaker tweak truth conditions to avoid triviality. Both can coexist without irrationality claims.
answer: |-
  You're hitting the central tension in conditional logic head-on—and your confusion is *entirely* warranted. Lewis's triviality results *are* devastating for certain views, but you're right that neither corner you describe is satisfying. The key is recognizing that **Adams' Thesis was never a thesis about truth conditions at all**, and Lewis's result only applies to *propositional* (truth-conditional) interpretations of conditionals. Here's how to untangle it:

  ### 1. What Lewis's Triviality Actually Shows (and Doesn't Show)
  *   **The Narrow Target:** Lewis proved that **no non-trivial probability space can simultaneously satisfy both of these**:
      1.  *Conditionals are propositions* (they have truth conditions; `P(if A, C)` is the probability that the proposition expressed by "if A, C" is true).
      2.  *Adams' Thesis holds universally*: `P(if A, C) = P(C | A) = P(A ∧ C) / P(A)` (when `P(A) > 0`).
  *   **The Consequence:** If you insist conditionals have truth conditions *and* you insist Adams' Thesis must hold universally, the *only* probability spaces where this works are trivial ones (e.g., where no two sentences are probabilistically independent). This is clearly absurd.
  *   **What it Does NOT Show:**
      *   It does *not* show Adams' Thesis is false for how we *use* conditionals.
      *   It does *not* show conditionals can't have probabilities associated with them.
      *   It does *not* rule out Adams' Thesis being a norm of *assertability* or *acceptability*.
      *   It does *not* directly attack non-propositional views.

  ### 2. Adams' Thesis Was Never About Truth Conditions
  *   **Adams' Core Idea:** Ernest Adams explicitly argued that indicative conditionals **do not express propositions with truth conditions** in the standard sense. He saw them as devices for expressing *conditional beliefs* or *conditional assertability*.
  *   **P(if A, C) ≠ Probability of Truth:** For Adams, `P(if A, C)` **is not the probability that the conditional is true**. Instead, it **is** the conditional probability `P(C | A)`. The "P" here measures the *degree of acceptability* or *rational assertability* of the conditional, not the probability of a truth-bearing proposition.
  *   **Probability ≠ Truth-Aptness:** Adams saves the intuitive link between probability and conditional probability precisely by denying that conditionals *have* truth conditions. The "probability" assigned to "if A, C" is a measure of our epistemic stance *towards the consequent given the antecedent*, not towards a mysterious proposition.

  ### 3. The Material Conditional is a Dead End (For Indicatives)
  You're absolutely right: `P(A ⊃ C) = P(¬A ∨ C)` is almost always *higher* than `P(C | A)`, especially when `P(A)` is low. This clashes massively with intuition and Adams' Thesis. Lewis's triviality reinforces that the material conditional *cannot* satisfy Adams' Thesis universally without collapsing into triviality. It's inadequate for indicative conditionals.

  ### 4. The Third Way (and Where Stalnaker/Lewis Fit)
  This is the escape hatch you suspected exists:

  *   **Option 1: Non-Propositionalism (Adams, Edgington, Bennett):** Conditionals lack truth conditions. `P(if A, C)` *is* `P(C | A)`, understood as a measure of conditional belief strength/assertability. **This route completely dodges Lewis's triviality** because it denies the first premise (that conditionals are propositions). The literature assigning probabilities "like nothing happened" largely operates within this paradigm or its close cousins. The probability is the probability *of C given A*, full stop – not *of* a proposition *that* if A then C.
  *   **Option 2: Non-Truth-Functional Propositionalism (Stalnaker):** Robert Stalnaker *does* assign truth conditions to conditionals. His semantics is **not truth-functional** (unlike the material conditional). "If A, C" is true iff C is true in the *closest possible world* (or the selected world) where A is true.
      *   **Relation to Triviality:** Stalnaker *accepts* Lewis's triviality result. He agrees that `P(if A, C)` *cannot universally equal* `P(C | A)` *if "if A, C" is a proposition*. His semantics **does not satisfy Adams' Thesis universally**.
      *   **The Middle Path:** Stalnaker argues that *in many contexts*, especially where the selection function behaves "nicely" (e.g., isn't biased by the specific probability distribution), `P(if A, C)` will be *close* to `P(C | A)`. He explains the *intuition* behind Adams' Thesis as arising from this typical closeness, even if strict identity is impossible. Crucially, his semantics avoids the absurdities of the material conditional.
      *   **Probability of What?** `P(if A, C)` *is* the probability that the proposition expressed by Stalnaker's conditional is true. This proposition depends on the selection function (which world is closest). Lewis's triviality shows this proposition *cannot* be such that its probability *always* equals the conditional probability, but Stalnaker never claimed it did.

  ### Where Your Reasoning Went Slightly Astray (and Why You're Not Alone)

  1.  **Conflating Probability with Probability-of-Truth:** You assumed that for `P(if A, C)` to make sense, "if A, C" must express a proposition whose probability of truth it measures. Adams denies this. Stalnaker accepts it but denies that this probability must equal `P(C | A)`.
  2.  **Assuming Adams' Thesis Requires Truth Conditions:** It doesn't; Adams built his thesis *on* the denial of truth conditions.
  3.  **Overlooking the Non-Truth-Functional Propositional Option:** Stalnaker *is* that third option between material conditional and no-truth-conditions. He provides truth conditions that are intuitively plausible and explains the *approximate* validity of Adams' Thesis without being destroyed by triviality (because he doesn't insist on strict identity).
  4.  **Misinterpreting the Scope of Triviality:** It's not that Adams' Thesis is "dead." It's dead *as a thesis about the probability of truth for propositional conditionals*. It's very much alive as a thesis about rational acceptability/assertability (Non-Propositionalism) or as a frequently good approximation (Stalnaker).

  ### What to Tell Your Students (Bluntly)

  1.  **Lewis's Triviality:** Shows you **cannot** have a non-trivial logic where indicative conditionals are propositions *and* the probability of their truth *always* equals the corresponding conditional probability. It forces a choice.
  2.  **Adams' Thesis Lives On:** But it lives primarily in two ways:
      *   **Non-Propositionalism (Radical):** Conditionals aren't truth-apt. `P(if A, C)` *just is* `P(C | A)`, measuring conditional belief/assertability. Triviality doesn't touch this.
      *   **Stalnakerian Propositionalism (Moderate):** Conditionals *are* propositions (truth-apt), with a non-truth-functional semantics (`closest A-world is a C-world`). `P(if A, C)` is the probability this proposition is true. It *won't always* equal `P(C | A)`, but Stalnaker argues it *often will* in practice, explaining the intuition behind Adams' Thesis. Triviality is accepted but contained.
  3.  **The Material Conditional:** Is largely irrelevant for indicative conditionals. Its probability profile (`P(¬A ∨ C)`) is wrong, and triviality confirms it can't satisfy Adams' Thesis.
  4.  **Probability Assignments Continue:** Because either (a) people are using `P(if A, C)` non-propositionally (`= P(C|A)`), or (b) they are using it propositionally (à la Stalnaker) and accept that it usually approximates `P(C|A)` well enough for many purposes, even if strict identity fails in complex cases.

  **In short:** You're missing the crucial distinction between **probability of truth** (requiring a proposition, blocked by triviality for Adams' Thesis) and **degree of acceptability/belief** (not requiring a proposition, where Adams' Thesis thrives). Stalnaker offers a propositional account that respects triviality by denying the universal identity while explaining its approximate hold. Tell your students the choice is real: Non-Propositionalism (Adams) or Non-Truth-Functional Propositionalism (Stalnaker). The Material Conditional and Universal Truth-Conditional Adams' Thesis are the casualties of Lewis's result.
