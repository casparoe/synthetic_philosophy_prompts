prompt: |-
  I teach a seminar on commodification and I've finally started writing down what I actually think about markets in odd goods — partly because I'm tired of running the same kidney/vote/price-gouging drill every year, and partly because my students keep catching me contradicting myself. Verdicts below, straight from the gut. I want to know what principle, if any, they add up to.

  1. A 24-year-old with medical debt sells a kidney to a stranger through a clinic for $9k. Legalize it. I'm not thrilled, but I'd legalize it.
  2. A hardware store charges $60 a case for bottled water two days after the flood. Fine. Price is information.
  3. A guy with a bot buys 40 tickets to a show and flips them at six times face. This one bugs me, and I'd have no complaint if it were banned.
  4. Selling your vote in a state election for $200. No — and not for consequentialist reasons. It feels like a category mistake, like selling a memory.
  5. Paying $500 for an A. No.
  6. Paying someone $150 to sit in line overnight outside a congressional hearing so you can take the seat at 9am. I'm told this is a real service in DC. Fine. That's just labor, like hiring a mover.
  7. Hiring a professional mourner to weep at your mother's funeral. Fine, and I'll defend it. Grief wants bodies in the room.
  8. Paying a friend $100 to phone your brother and apologize to him on your behalf. Not fine, and I can't fully say why. Nobody's harmed, nobody's deceived, and yet. I've been going back and forth on this one alot.
  9. A pharma company pays a healthy 22-year-old in a poor country $3,000 to swallow an untested compound in a first-in-human trial. Fine.
  10. Paying a homeless man $50 to hold a sign at a rally saying he supports the nurses. Fine. Paying him the same $50 to look into a camera and say he supports the nurses. Not fine. I'd swear those are different, even though the sign and the sentence carry the same content.
  11. A carbon offset purchase. Fine, obviously, and I know people think that's just inconsistent with 2 and 3.

  Here's the principle I keep reaching for, which I've been calling the exit/standing thing in my notes: a market is OK when it lets someone buy their way out of a bad spot (the debt, the flood, the overnight queue, the empty funeral), and not OK when it lets someone buy their way into a standing they haven't earned (a vote, a grade, a solidarity, an apology). But then scalping should be fine, because the flipper is buying nothing but a seat, and it isn't fine. And #10 looks like it's tracking something else entirely — whether the money is buying a body's presence or a mouth's avowal — which isn't exit vs. standing at all. I can't seperate those two readings cleanly and it's driving me up the wall.

  So: is there one principle that gets, say, ten of the eleven? If yes, state it as a test I could apply to a new case in under a minute, tell me which clause is doing the real work, and tell me which case forced that clause in. If no, give me the cheapest repair — I'd rather drop one verdict than carry a principle with five epicycles.

  Then apply whatever you end up with to these four, which I haven't decided about: (a) a hospital sells naming rights to its cancer wing; (b) a man in a rent-controlled flat sells his place in the queue to someone behind him; (c) a parent pays their nine-year-old a dollar a page to read books; (d) hiring a stand-in to sit your bar exam.

  Please write it up in this shape, with these headings:

  - **The verdicts, tabulated** — a table, one row per case: my verdict, and the one-line reason you'd guess is actually doing the work in my head.
  - **Candidate principles** — two or three, each stated as a precise test in a couple of sentences, each with the case that motivates it and the case it can't handle. About a paragraph each.
  - **The hard pairs** — one paragraph on scalping vs. flood water, one on the sign vs. the sentence. Can anything keep both halves? What does it cost?
  - **The principle I'd defend** — a paragraph, with the load-bearing clause named and the case that forces it.
  - **Four new cases** — the ones above, a short paragraph each.
  - **What I have to give up** — the verdict(s) no version can keep, and how much that should bother me.

  And if the whole thing is one principle plus one exception, just say so plainly — that's a better answer than a unified theory I don't believe.
reasoning: |-
  Hmm, the user is teaching a seminar on commodification and has shared their gut reactions to various market scenarios involving "odd goods." They want to find an underlying principle that explains most of their verdicts, particularly struggling with scalping vs. price gouging and the sign vs. spoken statement cases. They've proposed an "exit/standing" framework but find inconsistencies.

  Looking at their verdicts, I notice several patterns. The "exit" cases (medical debt, flood water, queue-sitting, funeral mourners) all involve purchasing relief from hardship or inconvenience. The "standing" cases (votes, grades, apologies) involve buying symbolic or social capital. But scalping (#3) breaks this - it's buying access, not status, yet they oppose it. And #10 (sign vs. statement) suggests authenticity matters - paying for physical presence versus fabricated speech.

  For candidate principles, I consider three approaches:
  1) The exit/standing principle they proposed, which handles most cases except scalping and the sign/statement distinction.
  2) An "embodied authenticity" test focusing on whether money alters the core meaning of an act, which explains the scalper issue but struggles with carbon offsets.
  3) A "deception/coercion" standard that addresses exploitation but conflicts with their acceptance of clinical trials.

  The sign/statement case (#10) reveals a deep tension between valuing labor versus authenticity. Paying for a body holding a sign seems like legitimate labor, while paying for spoken words feels like buying false testimony. This suggests authenticity matters when personal conviction is implied.

  For scalping (#3) versus flood pricing (#2), the key difference might be value creation. Flood pricing incentivizes supply during crisis, while scalping extracts value without creating new supply. This justifies treating them differently.

  The principle I'd defend modifies their exit/standing framework with a "value creation" clause for market efficiency cases, and an "authenticity expectation" clause for expression cases. The scalping case forces the value creation exception, while the sign/statement case forces the authenticity clause.

  Applying this to new cases: Hospital naming seems fine (exit/standing), queue-selling problematic (standing), reading rewards context-dependent (okay if incentivizing habit), bar exam stand-ins wrong (standing).

  They'll likely need to give up their acceptance of carbon offsets (#11) since it conflicts with the value creation principle, or reframe offsets as creating future environmental value. This shouldn't bother them much as offsets are the least intuitive fit in their original list.
answer: |-
  Here's a structural analysis of your gut verdicts, aiming for a defensible principle with minimal epicycles.

  ---

  **The Verdicts, Tabulated**

  | Case | Your Verdict | Likely Core Reason (Your Gut) |
  |------|--------------|-------------------------------|
  | 1. Kidney Sale for Medical Debt | Legalize | Buying escape from crushing debt (Exit) |
  | 2. Flood Water Price Gouging | Fine | Price signals scarcity, incentivizes supply (Information/Efficiency) |
  | 3. Ticket Scalping (Bot/Flipping) | Ban | Exploiting access without adding value (Unearned Standing/Value Extraction) |
  | 4. Selling Vote | No | Corrupts citizenship, degrades political equality (Sacred Standing) |
  | 5. Paying for an A | No | Corrupts education, degrades credential meaning (Sacred Standing) |
  | 6. Hiring Line Sitter | Fine | Paying for labor/time (Exit from inconvenience) |
  | 7. Hiring Mourner | Fine | Buying needed presence/atmosphere (Exit from emptiness) |
  | 8. Paying Friend to Apologize | Not Fine | Outsourcing core relational repair degrades sincerity (Sacred Standing/Authenticity) |
  | 9. Pharma Trial Payment | Fine | Compensating risk for valuable knowledge (Exit from poverty + Social Benefit) |
  | 10a. Paying Homeless for Sign | Fine | Buying physical labor/object placement |
  | 10b. Paying Homeless for Statement | Not Fine | Buying false personal testimony/conviction (Fabricated Standing/Authenticity) |
  | 11. Carbon Offset | Fine | Paying for mitigation action (Social Benefit/Efficiency?) |

  **Candidate Principles**

  1.  **Exit/Efficiency + Sacred Standing:** A market is permissible if it either (a) provides a crucial exit from hardship or inefficiency *and* doesn't inherently corrupt a core social good, or (b) demonstrably improves allocative efficiency for essential goods/services during scarcity. It is impermissible if it commodifies a core social or relational good ("Sacred Standing") whose value depends on authenticity, earned participation, or intrinsic personal connection (e.g., vote, grade, apology, personal testimony). **Motivates:** Kidney (a), Flood Water (b), Line Sitting (a), Mourner (a), Vote (impermissible), Grade (impermissible), Apology (impermissible), Statement (impermissible). **Fails:** Scalping (isn't "sacred standing," but banned). Carbon Offsets sit uneasily (efficiency argument weak if permits pollution).

  2.  **Embodied Authenticity/Value Creation:** A market is permissible if the purchased good/service is either (a) a tangible object, physical labor, or non-expressive presence, or (b) creates net social value (e.g., knowledge, efficiency, necessary service) without *requiring* the false embodiment of a personal state (belief, emotion, conviction, relationship). It is impermissible if the core value delivered *depends* on the purchaser falsely appropriating an unearned status, authentic personal expression, or relational act that cannot be honestly delegated. **Motivates:** Scalping (no value creation, exploits access), Sign (object/labor), Statement (false personal expression), Apology (false relational act), Vote/Grade (false status). **Fails:** Flood Water (no *new* value created, just allocation), potentially Carbon Offsets (value creation debatable).

  3.  **Deception/Coercion (Weak):** Focuses on whether the transaction involves deception of third parties or exploits severe desperation undermining consent. **Motivates:** Statement (deception), potentially Kidney/Pharma (coercion concerns, but you allow). **Fails:** Scalping (no inherent deception/coercion), Apology (no third-party deception), Flood Water (exploits need but allowed), Vote/Grade (impermissible beyond deception).

  **The Hard Pairs**

  *   **Scalping (#3) vs. Flood Water (#2):** Why is incentivizing water supply via price fine, but incentivizing ticket supply via resale not? **Resolution:** Flood pricing signals *real, urgent scarcity* and motivates *new supply* (trucks bringing water in). Scalping exploits *artificial scarcity* (ticket limits/bots) and extracts rent without creating *new* value or supply; it merely shifts access to those willing to pay the rent. Your gut objects to value extraction without contribution. **Cost:** Requires adding a "net value creation/efficiency gain" clause, making Flood Water permissible due to dynamic supply response, Scalping impermissible due to rent-seeking.

  *   **Sign (#10a) vs. Sentence (#10b):** Why is buying a body holding a sign fine, but buying the same words spoken not? **Resolution:** The sign is treated as *labor* (holding, displaying an object). The spoken statement is treated as *personal testimony* – the *act of speaking* implies the speaker's authentic belief to the audience. Paying for speech buys not just soundwaves, but the *false embodiment of conviction*. Your gut detects the expectation of authenticity in spoken personal avowals. **Cost:** Requires distinguishing between physical acts/labor and expressive acts carrying implied authenticity, adding an "embodied expression" clause.

  **The Principle I'd Defend**

  **The Exit/Value Creation + Embodied Authenticity Principle:** A market is permissible if it **1.** Provides a crucial exit from hardship or inefficiency **OR 2.** Creates significant net social value (e.g., knowledge, essential supply during scarcity, efficiency gains) **AND** does **not** require the *false embodiment of authenticity* – meaning it doesn't commodify acts where the core value to the purchaser or third parties depends on the vendor falsely representing personal conviction, status, relationship, or earned participation that hasn't occurred. The **load-bearing clause** is **"false embodiment of authenticity."** It is forced primarily by **Case #10b (Paying for Spoken Statement)** and **Case #8 (Paying for Apology)**, where the payment buys not just an action, but the *misleading appearance* of a personal state. It also cleanly handles Vote, Grade, and Scalping (no net value creation).

  **Four New Cases (Applied Principle)**

  *   **(a) Hospital sells naming rights to its cancer wing:** **Fine.** This is primarily a donation/sponsorship model (exit for hospital funding needs, value creation for resource provision). The name doesn't inherently falsely represent the name's *authentic* connection to care quality or medical expertise; it's understood as philanthropy/marketing. No false embodiment.
  *   **(b) Man sells place in rent-controlled queue:** **Not Fine.** This commodifies *earned standing* (his place via time/need) and allows someone to buy positional advantage they didn't earn, corrupting the queue's fairness. It's buying unearned access/priority (standing), not creating value or providing a true exit (it harms others in the queue). Leans towards false embodiment of qualifying need/priority.
  *   **(c) Parent pays child $1/page to read books:** **Contextual, but likely Fine.** This aims to incentivize a valuable habit (value creation potential). The payment is for the *act of reading* (labor/effort), not for falsely embodying enjoyment or comprehension. If structured as a learning incentive, not a bribe for a grade-report, it avoids false embodiment. It provides an "exit" from reluctance.
  *   **(d) Hiring a stand-in to sit your bar exam:** **Not Fine.** This directly commodifies *earned standing* (the credential). The core value of the bar license depends entirely on the holder *personally* demonstrating competence. The stand-in falsely embodies the candidate's knowledge and qualifications. Clear false embodiment.

  **What You Have to Give Up**

  *   **The Carbon Offset (#11):** Your principle struggles to justify it cleanly. Under Exit/Value Creation: Does buying an offset truly create "significant net social value" or just shift responsibility? Is it an "exit" from guilt, or a real solution? Crucially, critics argue it often involves the *false embodiment* of environmental responsibility ("net zero") without actual behavioral change or guaranteed mitigation. **If you keep it**, you rely on an implicit "efficiency/global benefit" argument that feels inconsistent with banning Scalping (also an efficient market) and requires downplaying the potential for false embodiment. **Dropping it simplifies the principle significantly.**
  *   **Potential Minor Strain:** *Flood Water (#2)* justification relies heavily on the dynamic efficiency argument (incentivizing supply). If that efficiency gain isn't demonstrably real in a specific case, or if the desperation is extreme, it *could* feel coercive. Your principle accepts this tension for efficiency gains during acute scarcity.

  **Conclusion: One Core Principle + One Major Exception/Strain**

  You have **one core principle**: Markets are impermissible when they involve the **"false embodiment of authenticity"** (buying the misrepresentation of personal conviction, status, relationship, or earned qualification). This handles 1, 4, 5, 8, 10b, and strongly informs 3 and the new cases (b, d).

  You need **one major adjustment**: Adding an **"efficiency gain / net value creation" clause** to permit markets that alleviate hardship or inefficiency *by demonstrably improving outcomes* (Flood Water, potentially Pharma Trials, Line Sitting, Mourner providing presence). This creates tension with Scalping (no net value) and Carbon Offsets (value creation debatable).

  **Cheapest Repair:** Embrace the "False Embodiment" core for prohibitions. Keep the "Exit/Value Creation" clause for permissions, but **drop Carbon Offset (#11)** as an outlier your gut accepts but the principle can't easily justify without special pleading. This keeps 10 out of 11 verdicts coherently, clarifies the Scalping/Flood distinction via value creation, and resolves Sign/Sentence via authenticity. Giving up Carbon Offsets is a small price for a much cleaner framework you can actually apply and defend.
