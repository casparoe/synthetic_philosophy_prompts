  - Map the stages to the argument:
     - Stage 1 and 2: We know the game must have a winner (no draws) and is finite, so by determinacy (excluded middle) one player has a winning strategy. But we cannot write it down (non-constructive).
     - Stage 3: The extra-move assumption: in Hex, an extra stone never hurts (only helps or is neutral). We tested this and found it holds. But in other games (like the zugzwang examples) it might not. The strategy-stealing argument relies on this.
     - Stage 4: The theft attempt. We tried to steal a second-player strategy to get a first-player strategy. But we ran into the problem: the stolen strategy might require playing in a cell that is already occupied by the extra stone. Then we have to make an arbitrary move, which might break the strategy. But note: in the proof, we argue that if the strategy tells us to play in an occupied cell, we can play anywhere because having an extra stone is never harmful. But we don't know if that arbitrary move is as good as the one prescribed. However, the proof says: since the extra stone doesn't hurt, we can play arbitrarily and still have at least as good a position as if we hadn't made that extra move. But the problem is: we don't have a strategy for that arbitrary move. So the proof shows existence without construction.

  - The key point: the argument by contradiction. If second player has a winning strategy, then first player can steal it and win, which is a contradiction. Therefore, second player cannot have a winning strategy. And since the game is determined, first player must have a winning strategy.

  **Predictable Problems and Solutions:**
  1. **Theft Round Stalls**: 
     - The Claimant might not be able to write a complete second-player strategy (because it's hard). So they write a partial one. Then the thief tries to use it and the referee might not see the problem because the strategy isn't complete. 
     - Solution: Encourage the Claimant to think of a simple strategy (like always play in a particular pattern) even if it's not winning. Then the theft attempt will still run into the problem of the extra stone. Also, the instructor can circulate and seed an example: "What if your strategy says to play in the center if it's open? But the thief already played there arbitrarily."

  2. **Someone insists the argument tells which opening move to play**:
     - They might think that the first player should start in the center because it's symmetric. But the argument doesn't specify.
     - Response: "The proof does not tell us how to win. It only tells us that there is a way. We still don't know what the winning first move is. In fact, for small boards we know some moves are losing, but for 7x7 we don't have a complete strategy."

  3. **The Extra-Move Assumption Challenge**:
     - Students might not come up with a zugzwang example. 
     - Solution: Have a few examples ready to present (like the one where having to make two moves in a row loses). Or use the chess zugzwang: explain that in some endgame positions, the player to move loses because any move ruins their position.

  **What the Activity Can't Reproduce and You'll Have to Supply:**
  - The actual strategy-stealing proof relies on the fact that in Hex, an extra stone of your color never hurts. This is because it only can help complete a path. But in the theft round, when the thief plays arbitrarily in the case of a conflict, we need to know that this arbitrary move doesn't harm. The activity might not fully convey that because the students don't have a complete strategy to steal. You'll have to explain that the proof uses the non-harmful property to justify that the arbitrary move is safe.

  - The existence of a winning strategy for one player is guaranteed by the determinacy of finite perfect-information games. The students might not have that background. So you'll have to state: "Because the game is finite, has no draws, and perfect information, one player must have a winning strategy."

  - The conclusion: the strategy-stealing argument shows that the second player cannot have a winning strategy, so the first player must. But we don't know how to win.

  **Timing Breakdown:**
  - Stage 1: 15 min
  - Stage 2: 10 min
  - Stage 3: 15 min (Part A: 5 min, Part B: 10 min)
  - Stage 4: 20 min (5 min for Claimant to write, 10 min for theft attempt and referee, 5 min for group sharing)
  - Debrief: 15 min

  Total: 75 minutes.

  This should be a powerful experience of the non-constructive nature of the strategy-stealing argument.
answer: |-
  Below is a complete in-class activity designed to make students viscerally experience the strategy-stealing argument in Hex. The activity unfolds in stages, ensuring students "discover" the argument's components through guided play and structured failure. I'll outline the flow, materials, timing, instructions, debrief, and anticipated challenges. The goal is for students to end the session convinced that (1) the first player must win, (2) the second player cannot have a winning strategy, and (3) no one can articulate how to win as the first player—all without you directly stating the argument upfront.

  ### **Core Structure**
  - **Total Time**: 75 minutes
  - **Students**: 18 (9 pairs for initial play; later regrouped into 6 trios)
  - **Grid Size**: 7x7 Hex (pre-printed)
  - **Materials per Pair**:
    - 2 pre-printed 7x7 Hex grids
    - 2 colors of sticky dots (e.g., red and blue; 50 dots per color)
    - Pens and paper for strategy write-ups
  - **Materials for Theft Round (per Trio)**:
    - 1 blank strategy template (PDF link: [Hex Strategy Template](https://example.com/hex-strategy-template))—simple form with "If opponent plays at [cell], I play at [cell]")
    - Role cards (3 cards per trio: Claimant, Thief, Referee)
  - **Key Stages**:
    1. **Play and Fail** (20 min): Play Hex → Attempt to write a first-player strategy → Fail.
    2. **Test the Extra-Move Assumption** (20 min): Verify in Hex → Construct a zugzwang counterexample.
    3. **Staged Theft Round** (25 min): Steal a second-player strategy → Hit the execution wall.
    4. **Debrief** (10 min): Connect stages to the argument.

  ---

  ### **Stage 1: Play and Fail (20 min)**
  **Goal**: Experience Hex, then fail to write a winning strategy—forcing awareness of non-constructiveness.  
  **Timing**: 
  - Play (10 min): 5 min per game (switch colors).
  - Strategy write-up (7 min): Individual effort.
  - Pair discussion (3 min): Share failures.  

  **Instructions**:
  1. **Play (Pairs)**:  
     *"With your partner, play two games of Hex on the 7x7 grid. Switch who is first player. Your goal: Win. First player connects top-bottom; second connects left-right. No draws allowed—play until one wins."*  
     - Circulate to enforce rules: No draws, no take-backs.

  2. **Write a Strategy (Individual)**:  
     *"Now, as the first player, write a complete winning strategy. Describe your first move and how you respond to any second-player move. Be specific: 'If they play at (3,4), I play at (1,1), etc.' You have 5 minutes."*  

  3. **Discuss Failure (Pairs)**:  
     *"Compare strategies. Did anyone succeed? Why not? Note: This game has no draws and is finite—so why can’t you write a strategy?"*  

  **Predictable Issue**: Students write vague or situation-specific "strategies" (e.g., "Start in the center, then block them"). No one produces a full proof. **Your intervention**: Highlight that determinacy (someone must win) doesn’t imply constructibility.  

  ---

  ### **Stage 2: Test the Extra-Move Assumption (20 min)**  
  **Goal**: Surface the critical assumption—extra stones never hurt—then break it in a toy game to reveal its fragility.  
  **Timing**: 
  - Hex test (7 min): Play modified games.
  - Zugzwang construction (10 min): Build counterexamples.
  - Share (3 min): Quick examples.  

  **Instructions**:  
  1. **Test in Hex (Pairs)**:  
     *"Replay a game you just played. Add one extra blue stone (first player’s color) anywhere empty. Does blue ever lose a game they would’ve won without it? Try 2–3 positions. Discuss: Does an extra stone ever hurt?"*  
     - Students will confirm: Extra stones help or are neutral.  

  2. **Construct Zugzwang (Pairs)**:  
     *"Now, design a small symmetric game where an extra move HURTS the player. Rules: Two players, alternating moves, no draws. Hint: Think of chess zugzwang—a move worsens your position. Use pen/paper. Need ideas? Try a 2x2 grid or a 3-move sequence."*  
     - **Seed if stuck**: Whisper to stalled groups: *"What if the winning condition punishes the last move? Like in Nim, where taking the last stone loses."*  

  3. **Share Examples (Class)**:  
     - Call for volunteers. Expect:  
       - *"Game: Players take turns removing 1–2 stones from a pile of 3. Last player to move loses. First player loses if both play optimally."*  
       - *"2x2 grid: Players mark cells. First player to create a 2-in-a-row loses. First move forces a loss."*  
     - **Emphasize**: *"In Hex, extra stones never hurt—but this isn’t universal. Strategy-stealing relies on this assumption."*  

  **Predictable Issue**: Students struggle to design zugzwang. **Your intervention**: Provide the Nim example (pile of 3 stones, last-move loses) or a simplified chess pawn endgame sketch.  

  ---

  ### **Stage 3: Staged Theft Round (25 min)**  
  **Goal**: Attempt to steal a strategy and collide with the impossibility of executing it.  
  **Setup**: Regroup pairs into 6 trios (3 students each). Assign roles:  
  - **Claimant**: Claims to have a second-player winning strategy. Must write it down.  
  - **Thief**: Tries to steal the strategy for the first player.  
  - **Referee**: Judges if the theft is executable.  

  **Materials**: Role cards with instructions:  
  - **Claimant Card**: *"You have a winning strategy for the second player. Write it on the template: ‘If first player plays at ___, I play at ___.’ Assume it works for all moves."*  
  - **Thief Card**: *"Steal the Claimant’s strategy for the first player: (1) Play ANY first move. (2) Pretend you’re the second player. Use their strategy to respond BUT if it says ‘play at X’ and X is occupied, do something else. Argue this wins."*  
  - **Referee Card**: *"Check: (1) Can the Thief execute the strategy? (2) Does it handle occupied cells? (3) Is the extra stone a problem?"*  

  **Instructions**:  
  1. **Write and Steal (15 min)**:  
     *"Claimants: Write a second-player strategy in 5 minutes. Thieves: Use it to build a first-player strategy. Referees: Interrogate—can the Thief always follow the strategy?*  

  2. **Trio Discussion (7 min)**:  
     *"Referees lead: Did the theft work? Where did it break? Report key issues."*  

  3. **Class Share (3 min)**:  
     - Groups report. Expect:  
       - *"Strategy said ‘play at (4,4),’ but Thief’s first move was there—so it failed."*  
       - *"Thief played arbitrarily when stuck, but it felt wrong."*  

  **Predictable Issues**:  
  - **Claimant stalls**: Can’t write a full strategy. *Solution*: Let them write a partial one (e.g., only for the first 3 moves). Theft still fails.  
  - **Thief “succeeds” naively**: Ignores occupied cells. *Referee intervenes*: *"What if the strategy demands a played cell? Is ‘play anywhere’ part of a winning strategy?"*  
  - **Student insists**: *"The argument tells us to start in the center!"* *Response*: *"Does it? The proof never specifies the first move. Show me where the theft defines an opening."* (Highlight non-constructiveness).  

  ---

  ### **Stage 4: Debrief (10 min)**  
  Map each stage to the strategy-stealing argument. Use student reports to illustrate:  

  | **Stage**          | **Student Experience**                                 | **Argument Component**                                                                 |  
  |---------------------|--------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Play and Fail**   | "We know first player wins but can’t write how."       | **Excluded middle**: Finite game with no draws → winning strategy exists. Non-constructive proof. |  
  | **Test Extra-Move** | "Extra stones never hurt in Hex, but they do in Nim."  | **Extra-move assumption**: Critical for strategy-stealing; holds in Hex but not universally.       |  
  | **Theft Round**     | "Stealing broke when the strategy cell was occupied." | **Symmetry + impossibility**: Second-player strategy can’t exist because theft leads to contradiction (occupied cells sabotage execution). |  

  **Closing Points**:  
  - *"You proved three things today: (1) First player wins Hex (by determinacy), (2) Second player can’t have a winning strategy (theft fails), and (3) No one here can describe how to win (non-constructive). This is the force of strategy-stealing—it gives existence but no blueprint."*  
  - **Handout**: 1-pager summarizing the argument (PDF link: [Strategy-Stealing Proof](https://example.com/strategy-stealing-hex)).  

  ---

  ### **What the Activity Can’t Do (Requires Your Input)**
  - **Formalize Determinacy**: Students might not intuit why "no draws" implies a winning strategy exists. *Supply*: *"Finite, perfect-information games with no chance are determined—Zermelo’s theorem."*  
  - **Generalize the Assumption**: Students see extra stones help in Hex but not why it’s axiomatic. *Supply*: *"In Hex, your stones only strengthen your position (monotonicity). This lets us ‘play anywhere’ when theft fails, without fearing harm."*  
  - **Abstract Logic**: The contradiction in strategy-stealing is subtle. *Supply*: *"If second player had a winning strategy, theft would give first player one too—but that’s impossible. Contradiction!"*  

  ---

  ### **Why This Works**
  - **Problem Before Naming**: Students hit walls (failed write-ups, theft execution) before grasping *why*. The zugzwang construction and theft roles make the abstract tangible.  
  - **Predictable "Aha" Moments**:  
    - Zugzwang exercise exposes the fragility of "extra moves always help."  
    - Theft round’s occupied-cell problem mirrors the proof’s gap—students *feel* the non-constructiveness.  
  - **Active Ownership**: By writing, stealing, and refereeing, they internalize the argument’s steps as discoveries.  

  This design balances chaos and structure—using controlled frustration to make the strategy-stealing argument unforgettable. Run it as a "lab" for proof theory, and they’ll leave buzzing.
