     - Instruction for Claimant: "You are an expert in Hex and claim to have a winning strategy for the second player. Write down, as best as you can, a complete strategy for the second player. It should tell you, for any move the first player makes, where to play next. Remember, you are claiming this strategy wins no matter what the first player does."

     - Instruction for Thief: "You are going to steal the Claimant's strategy to create a first-player winning strategy. How? You will make an extra move at the beginning (anywhere). Then, you will pretend that this move didn't happen and that you are the second player. You will use the Claimant's strategy to respond to the opponent's moves. But note: if the strategy tells you to play in a spot that is already occupied (by your extra stone), then you have to do something else. What? You can play arbitrarily. But then the strategy might fail."

     - Instruction for Referee: "You are to check the theft process. Does the thief's plan work in every case? In particular, what happens when the Claimant's strategy tells the thief to play in a spot that is already taken by the thief's extra stone? Does the thief have a guaranteed way to win then? Also, note that the board has one extra stone (the thief's first move) so the Claimant's strategy was not designed for that board. You must decide: can the thief always use the Claimant's strategy without getting stuck?"

