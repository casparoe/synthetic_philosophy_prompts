  **Stage 4: Staged Theft Round (20 minutes)**
  - Roles: In each group of three (we combine two pairs? but we have 18 students -> 6 groups of 3). But we have 9 pairs. We can have 3 groups of 6? Or we do 9 groups? But we need three roles per group. We can have 6 groups of 3 (since 18/3=6). So we combine two pairs to make a group of 4? Then we have 4.5 groups? Not even. So let's do: 6 groups of 3 students each. How? We have 9 pairs -> 18 students. We break into 6 groups of 3. So we combine 1.5 pairs? Better: we break the pairs and form trios.

  - Steps:
