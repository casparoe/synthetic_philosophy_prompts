          - Step 1: Claimant writes down a strategy for second player. (5 minutes)
          - Step 2: Thief tries to steal: 
              - The thief's strategy for first player: 
                  - First, the first player makes an arbitrary first move (say, at position X).
                  - Then, the first player pretends that this move didn't happen and that they are the second player. They then use the Claimant's strategy for the second player to respond to the opponent's (real second player) moves. But whenever the Claimant's strategy calls for a move that is already occupied (by the first player's extra stone), then the thief (first player) makes an arbitrary move? But that breaks the strategy.
