  First, the audience has twelve people with mixed backgrounds—mostly philosophy PhDs plus stats and cognitive science students. All know Bayes' rule and basic probability, but no formal confirmation theory. The session is 75 minutes with just a whiteboard, no assigned reading. The user wants the tension to build naturally, not be stated upfront.

  Hmm... their key requests are:
  - Sequence of concepts with dependencies
  - One central example (not Mercury's perihelion)
  - Transition to new theories problem
  - Role of probability indexing (agent vs evidence)
  - Misconception map with preemptive responses
  - A diagnostic end question
  - Explicit out-of-scope boundaries

  For the example, Mercury is out—they worry it's overfamiliar. Need something that feels fresh but meets criteria: genuinely old evidence, clear confirmation intuition, no emotional investment. The muon decay prediction in special relativity jumps to mind—it's clean, physics-based but not overused, and fits all boxes. 

  The structural sequence must lay Bayesian foundations before introducing tension. Start with confirmation as boost in P(h|e) vs P(h), then Bayesian conditionalization. Only then present old evidence scenario. The indexing issue should come after stating the paradox—it's the first natural fork where the room might split. Save new theories connection for last 10 mins.

  Misconceptions... yes, the "P(e)=1 triviality" and "just conditionalize on h⊨e" are classics. Need to intercept these at precise moments: after writing P(e)=1 but before Bayesian formula, and after showing h⊨e doesn't solve it. Preemptive one-liners must be surgical—e.g., "Does knowing e was predicted change anything?" for the entailment trap.

  The diagnostic question should test if they see why standard Bayesian machinery fails—not whether they recall solutions. Something like "Where exactly does the conditional probability formula break here?" 

  For out-of-scope: subjectivist vs objective probability debates, specific solutions (Garber, Jeffrey etc.), and historical cases requiring context. Flag these early so discussion stays focused.

  ...Double-checking time allocation: 10 min setup, 20 min paradox construction, 15 min indexing discussion, 10 min new theories pivot, 15 min discussion, 5 min buffer. Muon example threads throughout. Feels tight but doable if misconceptions are shut down fast.

  Final touch: the new theories link should feel organic—point out that if old evidence can't confirm, new hypotheses face symmetrical issues. That's the "ajar door" they wanted.
answer: |-
  Here’s a step-by-step teaching plan for your 75-minute session, designed to build tension and target misconceptions. The sequence prioritizes conceptual dependencies and uses a single underutilized example to make the problem visceral.

  **Core Example: Muon decay in special relativity (SR)**  
  *Why it works*:  
  - **Genuinely old evidence**: Observed unstable particle decay rates *pre-dated* SR (early 1900s radioactive decay data vs. Einstein’s 1905 theory).  
  - **Clear confirmation**: SR’s time-dilation explanation *retroactively* accounted for decay rates observed in cosmic-ray muons (validated 1940s).  
  - **No audience stake**: Less philosophically canonized than Mercury, avoids knee-jerk nods.  
  - **Lacks**: No complex math—decay rates are observed frequencies, probabilities map cleanly.  

  ---

  ### **Teaching Sequence (75 min)**  
  **I. Foundational Setup (15 min)**  
  1. **Recap Bayesian confirmation** (5 min):  
     - Define confirmation: *h* confirms *e* iff P(h|e) > P(h)  
     - Whiteboard: Bayes’ theorem (P(h|e) = [P(e|h) * P(h)] / P(e))  
     - *Depends on*: Audience’s existing Bayes/conditional probability fluency.  
  2. **Clarify probability indexing** (5 min):  
     - Pose: *"Is P( ) our credence *now*, or an idealized evidence-relative measure?"*  
     - Flag both views (agent-relative vs. evidence-relative) but **don’t resolve yet**.  
  3. **Introduce muon decay case** (5 min):  
     - Sketch: Pre-SR decay data (old evidence *e*) → SR (*h*) predicts time-dilation effect → later confirms *e*.  
     - Stress: *e was known before h was proposed*.  

  **II. Constructing the Tension (25 min)**  
  4. **Apply Bayes to old evidence** (10 min):  
     - State: *After* *e* is known (muon decay rates), we develop *h* (SR time dilation).  
     - Whiteboard: P(e) = 1 (since *e* is observed).  
     - Calculate P(h|e) = [P(e|h) * P(h)] / 1 = P(e|h) * P(h)  
     - *Dependency*: Bayes’ theorem + P(e)=1 for known evidence.  
  5. **Reveal the paradox** (10 min):  
     - Note: If P(e)=1, then P(h|e) = P(h) → *no confirmation* (since P(h|e) ≯ P(h)).  
     - But: SR *did* confirm muon decay data—contradiction.  
     - *Make it visceral*: *"So did Einstein’s theory *not* support the existing data? That seems wrong."*  
  6. **Trap the first misconception** (5 min):  
     - *Expected wrong turn*: "P(e)=1 makes confirmation trivial!"  
     - **Intercept here**: *"If P(e)=1 always kills confirmation, can *any* theory confirm old evidence?"*  
     - Force them to confront the consequence: Bayesianism seems to *forbid* retroactive confirmation.  

  **III. Deepening the Problem (20 min)**  
  7. **Test the entailment "fix"** (10 min):  
     - *Audience move*: Someone suggests: "Conditionalize on *h* entailing *e*!"  
     - Whiteboard: P(h|e, h⊨e) vs. P(h|h⊨e).  
     - Show: If *h* ⊨ *e*, then P(e|h)=1 → P(h|e) still reduces to P(h) when P(e)=1.  
     - **Intercept**: *"Does learning *h* entails *e* *after* knowing *e* change our credence?"* (No—P(h⊨e) may already be 1).  
  8. **Reintroduce indexing ambiguity** (10 min):  
     - Pose: *"Where does the tension *live*? In the agent’s credence (P_agent) or logical probability (P_logical)?"*  
     - Contrast:  
       - *Agent view*: P_agent(e) = 1 → no boost.  
       - *Evidence-relative view*: Should P(e) reflect *pre-evidence* uncertainty?  
     - *Key insight*: The problem feels different for each—but neither fully escapes.  

  **IV. Pivot to New Theories & Close (15 min)**  
  9. **Connect to new theories** (5 min):  
     - **Door ajar here**: *"If old evidence can’t confirm, how do new theories *ever* get confirmed? They must explain *existing* data!"*  
     - Example: Dark matter (new *h*) explaining galactic rotation curves (old *e*).  
  10. **Diagnostic question** (5 min):  
      - **End with**: *"If we *deny* that SR confirmed muon data, what does Bayesianism gain/lose as a theory of confirmation?"*  
      - *Reveals grasp*: Tests if they see the Bayesian framework’s *explanatory cost* (not just math).  
  11. **Q&A buffer** (5 min): Flag out-of-scope items if raised.  

  ---

  ### **Misconception Map & Intercepts**  
  | Misconception | When it arises | Intercept sentence |  
  |---------------|----------------|---------------------|  
  | "P(e)=1 makes confirmation impossible—trivial!" | After Step II.4 | *"So should we abandon retroactive confirmation altogether?"* |  
  | "Just conditionalize on h⊨e!" | Start of Step III.7 | *"Does knowing h entails e *after* learning e teach us anything new?"* |  
  | "The evidence isn't *really* old if we re-interpret it" | During muon case discussion | *"Was the decay-rate data *available* before SR existed?"* |  
  | "Probability is only subjective" | During Step III.8 | *"Can logical relations confirm *without* an agent’s credence changing?"* |  

  ---

  ### **Deliberate Exclusions & Out-of-Scope Flags**  
  **Flag early**: *"We’re isolating the *formal* puzzle—not solving it, and not debating scientific realism."*  
  1. **Specific solutions** (e.g., Garber/Jeffrey, counterfactual credences).  
  2. **Subjectivist vs. objective probability** (beyond the indexing fork).  
  3. **Historical nuances** (e.g., whether Einstein *knew* muon data; focus on logic).  
  4. **Alternative confirmation theories** (e.g., falsificationism, IBE).  

  **Why this flow**: The muon example forces engagement with a "stale" evidence becoming live via theory. Indexing is introduced early but deepened as a pivot point, preventing reductive fixes. Ending on new theories shows the problem’s scope without digressing. The diagnostic question targets conceptual unease, not solution recall.  

  Timing is tight—stick to the whiteboard; let them derive the Bayesian steps. The tension peaks when P(e)=1 flattens P(h|e) to P(h), making denial of confirmation feel *wrong*. That’s when the problem owns the room.
