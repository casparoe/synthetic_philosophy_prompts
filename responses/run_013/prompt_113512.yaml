  - **Drop fashionable framings**: "LLMs have frame problem solved via retrieval" is misleading—it’s a patch, not a solution. Also, "non-monotonic logic fixes it" is outdated; it addressed symptoms, not roots.  

  The user’s suspicion about "frame problem" fracturing is astute. It’s likely now: (1) relevance problem, (2) computational tractability, (3) epistemic closure (how beliefs update). I should name these to clarify the agenda.  

  Why move questions up/down?  
  - New AI capabilities (e.g., agents failing/succeeding at real-world relevance) could force rethinking.  
