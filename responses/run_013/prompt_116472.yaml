  The constraints are specific: avoid philosophical tangents about the Ship of Theseus, don't cite external sources, maintain board-minute tone, and end with a clear verdict choice from three options. The user wants the opposing argument presented fairly before being refuted.

  Key considerations emerge: The trust's continuous stewardship (173 years) versus the reassembled hull's material authenticity. The founding deed's silence means criteria must be constructed from first principles. I should emphasize that institutional purpose matters more than material purity for a working heritage vessel - conservation isn't reassembly.

  For structure, I'll define criteria: 1) Unbroken institutional custody 2) Functional integrity as exhibit 3) Recognizable identity by public. The boat school's claim relies on material continuity but fails on custody and function - their hull is a replica using original parts. "Material" argument also ignores that removed timbers ceased being part of the vessel when replaced. 

  Practical recommendations must follow: Retain the name/marks, decline endorsement, propose endowment sharing if possible, send our hull to the exhibition. The "NEITHER" option is tempting but impractical - vessels need physical embodiments for public engagement. 

  The strongest counterargument: That physical substance defines identity, and the boat school's hull has more original material. But this disregards how conservation actually works - no museum treats replaced-part objects as "new". 

  Verdict should be "CONTINUITY" with specific actions. The user needs this to settle a 30-year avoidance, so clarity is paramount.
answer: |-
  ## Lay Member's Recommendation: Vessel Identity Determination

  **To:** Collections Board, Maritime Heritage Trust  
  **From:** [Your Name], Lay Member  
  **Date:** [Date of Circulation]  
  **Subject:** Identity Determination of Vessel [Vessel Name] & Associated Actions  

  The core question before us is the identity of Vessel [Vessel Name]: does it reside in the hull we have continuously maintained and exhibited, or in the hull reconstructed by the boatbuilding school from timbers removed during our conservation? This determination is urgent, impacting the [Donor's Name] Endowment and the National Exhibition invitation. Our founding deed provides no definition; we must establish reasoned criteria.

  ### I. Proposed Criteria for Vessel Identity
  Identity for a historic working vessel preserved *as a public exhibit* rests on three interdependent principles:

  1.  **Unbroken Institutional Custody & Purpose:** The vessel's identity is inextricably linked to the institution entrusted by its owners, donors, and the public with its *ongoing preservation and presentation*. Continuous care defines its existence as a heritage object, not merely a collection of wood.
  2.  **Functional Integrity as Exhibit:** The vessel must function *as the exhibit itself* – the coherent, stable, publicly accessible whole presented under its name and history. Identity requires this operational wholeness maintained over time.
  3.  **Recognizable Continuity:** The public must perceive the exhibited object as the same entity they visited previously, and whose history the Trust narrates. This continuity is maintained through physical presence, consistent location, and the Trust's unbroken stewardship, even as conservation occurs.

  These criteria prioritize the vessel's *lived existence as heritage* over the passive aggregation of materials. Conservation is an active process sustaining the vessel's identity through change, not an act of destruction creating a new object.

  ### II. Application to Our Facts
  *   **Our Hull:** Possesses unbroken institutional custody since acquisition (173 years). It has functioned continuously as the primary exhibit bearing the vessel's name and history. The public has always encountered *this* hull as Vessel [Vessel Name], despite incremental renewal. It retains the foundational keel, stem, sternpost, and frames – its essential spine and form. Conservation has preserved its functional integrity *as the exhibit*.
  *   **The Boatbuilding School's Hull:** Comprises materials *formerly* part of our vessel, removed over decades as they reached end-of-life. These timbers ceased being part of Vessel [Vessel Name] when removed and discarded by the Trust. The school reassembled them decades later, using new fastenings and timber. While materially significant, this hull lacks:
      *   Unbroken institutional custody or purpose (the Trust never intended these discards to be the vessel).
      *   Functional continuity as *the* exhibit (it wasn't assembled or presented as such during our vessel's lifetime).
      *   Recognizable public continuity (it only emerged recently as a separate entity).

  The boatbuilding school's project is a remarkable archival reconstruction, valuable in its own right, but it is a *new* artifact – a reassembly of original parts. It is not the continuously extant vessel entrusted to our care.

  ### III. The Strongest Case for the Boatbuilding School's Claim (Material Continuity)
  Proponents of the boatbuilding school's hull argue persuasively that true identity resides in the *original physical substance*. The vessel *is* its original timbers. Our conservation, they contend, was a process of gradual replacement that, upon removing the final original plank, effectively destroyed the original vessel. What we exhibit is a replica. The boatbuilding school, by meticulously recovering and reassembling the actual discarded original timbers (the majority of the original hull material), has effectively "resurrected" the true vessel. Their hull possesses a greater proportion of the original substance than ours and represents the closest physical link to the 1830s construction. Endorsing their claim honors the primacy of the authentic material fabric over institutional history. This view holds that identity cannot jump between distinct physical objects; it must reside with the matter itself.

  ### IV. Recommendation & Concrete Actions
  While the material argument has intellectual weight, it fails to account for the reality of conserving complex, working heritage artifacts *as functioning exhibits*. Identity is not solely material; it is also historical, institutional, and experiential. Our hull maintains the unbroken thread of existence, purpose, and public recognition.

  Therefore, I recommend the Board:

  1.  **Recognize:** Vessel [Vessel Name] is the hull continuously maintained, conserved, and exhibited by this Trust.
  2.  **Decline:** Politely decline the boatbuilding school's request to endorse their claim that their reassembled hull is the original Vessel [Vessel Name] or to hand over the vessel's name and official marks.
  3.  **Communicate:** Inform the boatbuilding school promptly (within 3 business days of the vote) that while we value their project as a significant historical reconstruction using original materials, the Trust maintains that Vessel [Vessel Name] remains the hull under our stewardship. Publicly (e.g., website update, exhibit signage), we should acknowledge their reconstruction as "a reassembly incorporating original timbers removed from Vessel [Vessel Name] during conservation by the Maritime Heritage Trust over many decades," clearly distinguishing it from the original vessel in our care.
  4.  **Endowment:** Assert our claim to the [Donor's Name] Endowment as the trust "that keeps the vessel on public view," based on our continuous exhibition of the recognized vessel. Explore potential collaboration or sharing *only* if legally permissible and clearly framed as supporting the *reconstruction project*, not acknowledging it *as* the vessel.
  5.  **Exhibition:** Certify to the national exhibition's insurer that the hull to be lent is the Vessel [Vessel Name] maintained and exhibited by this Trust. Prepare our hull for travel.

  **Verdict:** CONTINUITY – Retain custody and recognition of our maintained hull, distinguish the school's project as a reconstruction.
