  I need to provide a structured response as requested, in three parts. First, I'll identify the nearest conceptual neighbors to this phenomenon. Circularity comes to mind, but the user rightly points out this isn't circular reasoning because each individual claim is valid - it's the systemic interaction that creates the problem. Wicked problems are also similar but typically involve shifting problem definitions rather than shifting difficulty allocations between stable components. Conjunctive problems are relevant too, but this feels more dynamic - the difficulty doesn't just sum, it sloshes around.

  For the core phenomenon itself, I'll define it as a situation where a problem decomposes into two interdependent subproblems, each appearing soluble if the other is solved, creating a loop where the apparent locus of difficulty perpetually shifts. The key is that both claims are true locally ("A is easy given solved B" and vice versa) yet globally the system remains stuck. This differs from simple circular dependencies because the claims aren't logically invalid - they're practically paralyzing. I'll include the user's AI examples and add a non-AI example like the classic chicken-and-egg problem to show it's a general pattern.

  For naming, I don't recall an established term for this exact dynamic. "Problem tennis" captures the back-and-forth motion, while "locus fugax" (fleeting locus) emphasizes how the difficulty won't stay put. I lean toward "problem tennis" as more intuitive and descriptive of the discursive phenomenon the user is observing.

  Throughout my response I'll maintain the requested structure and word counts while addressing all aspects of the query - especially clarifying how this differs from adjacent concepts and why it's particularly frustrating in technical discussions where all parties are making locally valid but globally unproductive claims.
answer: |-
  ### Nearest neighbours (~250 words)  
  This phenomenon shares borders with several concepts but isn't identical:  
  - **Circularity**: Resembles logical loops, but differs because each claim ("A is easy if B is solved") is *independently plausible*, not fallacious. Circularity disputes validity; here, validity is conceded while progress evaporates.  
  - **Wicked Problems**: Matches in systemic stubbornness, but wicked problems resist definition *itself*. Here, subproblems are stably defined—yet difficulty migrates between them.  
  - **Conjunctive Problems**: Similar to "A and B both hard", but distinct because conjunctive hardness is additive ("both bottlenecks"). Here, hardness is *relational*: each subproblem absorbs the entire difficulty when the other is assumed solved, preventing additive accounting.  
  - **Problem of the Criterion**: Close epistemically (e.g., "need criteria to judge methods, need methods to find criteria"), but this is broader. Criterion problems are symmetric loops; your cases involve *asymmetric tools* (e.g., specification vs. verification) that could theoretically break symmetry if either were tractable alone.  

  Boundary: When subproblems are *not* mutually enabling (e.g., "build engine + build chassis" for a car), difficulty stays put. The core is mutual provisional trivialization.

  ---

  ### The thing itself (~400 words)  
  The phenomenon is: **A decompositional stalemate where a problem splits into two interdependent subproblems (A and B), each framed as trivially soluble conditional on the other’s solution, creating a loop that perpetually relocates the perceived "hard part" and blocks resolution.**  

  **Mechanism**:  
  - A and B are functionally entangled (solving A requires B, solving B requires A).  
  - Proponents of prioritizing A argue B reduces to a "simple check" once A is known (e.g., "verification is trivial with a good spec").  
  - Proponents of B invert this: A reduces to "obvious once B is solved" (e.g., "specification is trivial if you can verify outputs").  
  - Critically, *both claims are locally defensible*—if you grant one subproblem solved, the other often *does* simplify. But since neither can be solved independently, the loop persists.  

  **Key differentiator**: Unlike circular dependencies (e.g., "which came first, chicken or egg?"), this arises in *problem-solving contexts* where the entanglement is operational, not logical. The stalemate isn't in defining terms but in allocating effort.  

  **Non-AI example**:  
  - **Economic development**: "Poverty persists because institutions are weak (A)." "But institutions strengthen only with economic surplus (B)."  
    - *A-prioritizer*: "With strong institutions (B solved), growth (A) is straightforward!"  
    - *B-prioritizer*: "With surplus (A solved), building institutions (B) is easy!"  
    Hardness oscillates; neither addresses the coevolution.  

  **Escape routes** might include:  
  - Finding a *third element* that partially resolves both (e.g., in alignment, "anthropic capture" of weak AGI to bootstrap value learning).  
  - Accepting that A/B *co-evolve* and tackling them iteratively (e.g., corrigibility via incremental reward hacking).  
  - Proving one subproblem is *actually* harder unconditionally (rare, as conditional arguments dominate).  

  ---

  ### Name (~100 words)  
  **Problem Tennis** (coined).  
  - **Why it fits**: Evokes the back-and-forth rally where the "hardness ball" is hit between subproblem courts. No player faults; the game just continues.  
  - **Why it earns keep**:  
    1. **Descriptive**: Mirrors the discursive rhythm (e.g., alignment debates).  
    2. **Action-implicating**: Suggests the stalemate arises from how players volley claims, not just inherent complexity.  
    3. **Nuanced**: Distinguishes from "circularity" by emphasizing dynamic relocation of burden, not static paradox.  

  Alternative: *Locus fugax* ("fleeting locus"), but "Problem Tennis" is more intuitive and less pretentious.
