answer: |-
  This pattern reflects a pragmatic, morally hybrid approach to economic justice that prioritizes preventing extreme deprivation for vulnerable groups in essential markets, while largely accepting market outcomes elsewhere. The implicit theory combines elements of bargaining power analysis and a decent-minimum standard, rather than a robust "just price" doctrine. Here's a reconstruction:

  **The Implicit Theory:**
  1.  **Core Justification: Unequal Bargaining Power & Essential Needs:** The practice fundamentally rests on recognizing that in *specific markets* (labor, housing), structural inequalities create situations approaching *duress*:
      *   **Workers:** Facing employers with greater market power, limited job alternatives ("work or starve" dynamic), and information asymmetries. Minimum wage counters potential exploitation.
      *   **Tenants:** Facing landlords with monopoly power in specific locations, high transaction costs of moving, and the essential nature of shelter ("pay or be homeless"). Rent control counters potential extortion.
  2.  **Object of Concern: A Decent Minimum, Not Abstract Exchange Fairness:** The primary moral goal is ensuring individuals can meet *basic subsistence needs* (food via wages, shelter via affordable rent). It's less about achieving a perfectly "fair" price for the exchange itself in the abstract, and more about preventing outcomes deemed socially intolerable due to deprivation. This explains the focus on *inputs* (labor) and *essential consumption* (shelter) for the poor.
  3.  **Market Distinction Based on Necessity & Vulnerability:** Labor and housing are deemed uniquely essential for survival and participation in society. The poor are *consistently vulnerable* as sellers of labor (often their only asset) and buyers of shelter (a non-optional good). Markets for other goods poor people sell (e.g., used goods, informal services) or buy (e.g., food, clothing, though often subsidized via other means like SNAP) are seen as less prone to the same degree of coercive imbalance *or* the consequences of imbalance are less immediately catastrophic.
  4.  **Carve-Outs as Pragmatic Concessions, Not Moral Consistency:** The exceptions reveal the theory's pragmatic core focused on mitigating the *worst outcomes* without fundamentally disrupting market mechanisms:
      *   **Tipped Minimum Wage:** Acknowledges tips as income and fears that a full minimum wage would eliminate jobs in certain sectors. It prioritizes *some* income/jobs over *optimal* income, accepting a lower floor where tipping is customary.
      *   **New Housing Exemptions:** Aims to avoid disincentivizing new construction (the primary supply solution), prioritizing long-term supply increases over immediate rent fairness for *all* units. The goal is protecting *existing* vulnerable tenants or ensuring *some* affordable stock, not universal rent control.
      *   **No Price Caps on Goods:** Recognizes that while poor buyers face hardship, markets for consumer goods are generally more competitive, alternatives exist (even if inferior), and direct subsidies (like SNAP) are deemed more efficient tools than price controls for achieving consumption adequacy. The "duress" is seen as less acute than with shelter or the sale of essential labor.

  **What the Practice Strictly Requires vs. What it Merely Fits Well With:**
  *   **Strictly Requires:**
      *   Intervention in markets where a vulnerable party faces severe duress due to structural inequality and the good/service exchanged is essential for basic subsistence.
      *   A safety net floor (minimum acceptable outcome) for the vulnerable party in those specific exchanges (wage floor for sellers of labor, rent ceiling for buyers of shelter).
      *   Exceptions when the intervention demonstrably threatens the primary supply mechanism for the essential good/service (e.g., new housing construction, restaurant employment).
  *   **Fits Well With, But Doesn't Strictly Require:**
      *   A full-blown "just price" theory (prices set by intrinsic value or moral desert, independent of market forces). The levels are often set politically/administratively based on cost-of-living estimates, not moral philosophy.
      *   Comprehensive equality in exchange fairness across all markets. It accepts significant inequality elsewhere.
      *   Addressing all sources of poverty or inequality. It's a targeted, partial remedy.
      *   Moral condemnation of all voluntary exchange. It accepts markets as the primary mechanism but intervenes where they produce morally unacceptable outcomes for the vulnerable in essential areas.

  **The Freedom-of-Contract Alternative:**
  Replacing the current practice with a thoroughgoing freedom-of-contract view would necessitate radical changes, grounded in the belief that voluntary exchange is inherently fair and efficient, and coercion is narrowly defined (only explicit force/fraud):

  1.  **Abolition of Price Floors/Ceilings:** Minimum wage and rent control laws would be eliminated. Wages and rents would be set solely by individual agreement between employers/workers and landlords/tenants.
  2.  **Reinterpretation of "Duress":** The structural inequalities justifying current interventions (lack of alternatives, essential needs) would no longer be considered invalidating "duress." Only explicit threats or fraud would void contracts. "Take it or leave it" offers in imbalanced markets would be legitimate.
  3.  **Acceptance of Harsh Outcomes:** Significantly lower wages for vulnerable workers and higher rents for low-income tenants would be permissible, as long as agreed to "voluntarily" under the narrow definition. Increased poverty, homelessness, and exploitation would be viewed as unfortunate but not unjust results of individual choices and market forces.
  4.  **Handling Carve-Outs:** All special exceptions (tipped minimum, new housing exemptions) become irrelevant since the underlying regulations vanish. Any remaining sector-specific rules would need a strict freedom-of-contract justification (e.g., preventing fraud).
  5.  **Alternative Mechanisms (Possibly):** Proponents might advocate for private charity, voluntary mutual aid, or *conditional* cash transfers (without market distortions) to alleviate hardship, but these would be separate from regulating the terms of exchange itself. Safety nets would not mandate specific prices or terms in private contracts.

  **In essence:** The current practice presupposes a view that voluntary exchange, while generally legitimate, can produce exploitative and socially intolerable outcomes in contexts of severe power imbalance and essential needs. Its moral core is preventing destitution for the vulnerable in key roles (worker, tenant), justified by concerns of duress and bargaining power, and implemented with pragmatic carve-outs. A pure freedom-of-contract view rejects this, seeing intervention itself as the injustice and accepting market outcomes, however harsh, as the fair result of free agreement. The shift is from preventing specific bad outcomes deemed coercive to upholding the sanctity of agreement above all else.
