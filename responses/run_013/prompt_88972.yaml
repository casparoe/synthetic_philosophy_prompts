  1. **Strengthen (b):** Investigate "non-adjunctive" impossible-worlds semantics (e.g., Wansing's paraconsistent approach) or structured impossible worlds (e.g., Saint-Germier's truthmaker semantics).  
  2. **Address (d):** Look at hybrid models (e.g., integrated fragmentation + computational closure) with "default EU" rules (e.g., derive EU over a consistent fragment, with fallbacks).  

  ### Is the Claim Ill-Posed?
  Slightly—**"non-arbitrary class of entailments" is ambiguous**. If it requires a *logically natural* fragment (e.g., "all introspectively accessible inferences"), the claim weakens. If it permits *computationally natural* fragments (e.g., closure under O(n³)-time deduction), it strengthens. I suggest restating:  
  > *"...closed under a computationally specified class of entailments (e.g., polynomial-time decidable inferences), and not modeled as believing explicit contradictions."*  

  This sidesteps "non-arbitrary" vagueness and leverages (c)'s stronger case. With this tweak, my credence rises to **0.35**, with (c) becoming the linchpin.

  ### Key Takeaway
  Your **0.3** is defensible, reflecting weight on (b)/(d). The biggest hurdle is **avoiding triviality while preserving closure**—most models sacrifice one. Computational approaches (c) currently offer the best path, but need integration with (d). If you can ground "commitment" in complexity thresholds *and* show how fragmented EU computation converges, your credence should rise.
