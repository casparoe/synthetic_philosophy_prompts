  I need to craft a Petrarchan sonnet according to their specifications. The poem must be formal and metrical, with an ABBAABBA CDECDE rhyme scheme. The octave (first eight lines) should build the illusion of a neutral interior voice; the volta (turn) should reveal that the spectator's judgments actually track the audience; and the sestet (last six lines) should question whether Smith can distinguish between the impartial spectator and an internalized panel without resorting to a moral faculty that settles things by fiat.

