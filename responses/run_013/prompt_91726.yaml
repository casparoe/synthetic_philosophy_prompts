prompt: |-
  I chair the grants committee at a small foundation that funds long-shot work on reducing existential risk — we hand out about $20M a year across ~40 grants, and our bylaws make us a fiduciary of a fixed budget that has to be committed this cycle. An application just came in that's got the comittee stuck. The applicant wants $2M to build what they call a "moral-value anchor": an argument plus a piece of institutional machinery that, they claim, has maybe a one-in-10^14 chance of preventing an outcome they define as infinitely bad (an outcome whose disvalue they say has no finite bound). Their whole pitch is that any positive probability times infinite disvalue is still infinite, so the expected value of funding them is infinite no matter how tiny the probability, and therefore refusing would be irrational by our own lights. They also point out — correctly, I checked — that we've funded plenty of 3%-chance projects without blinking. And there are two other applications in this same cycle making basically the same infinite-value claim, which is where my head starts to hurt.

  Three of my committee members are convinced and want to fund it on straight expected-value grounds. Two think it's a Pascal's-wager-style con — you can run the same argument for literally anything, including paying the applicant to *not* do it — and they want a flat rule against ever letting infinite-value claims into the process. The rest are somewhere in between and a bit spooked, because the applicant is a serious person, not a crank, and nobody wants to be the philistine who rejected a project that could've saved everything.

  Draft the written decision memo I'll circulate before we vote. Give me a concrete recommendation — fund, reject, or fund with conditions, and if conditions then say exactly what they are — and actually take the applicant's expected-value argument seriously instead of just gesturing at "Pascal's mugging," because several of us find that label question-begging. Whatever you recommend has to be something the three true believers could respond to, and it has to say what we should do about the other two applications in the pipeline, not just this one. Please also flag where your own reasoning is most likely to be wrong, and tell me which argument or consideration would actually flip your recommendation — I'd rather know now than after the vote.
reasoning: |-
  Okay, let me tackle this problem step by step. The user chairs a grants committee for a foundation that funds high-risk existential risk reduction projects. They're facing a tricky application requesting $2M for a "moral-value anchor" project claiming an infinitesimal chance (1 in 10^14) of preventing infinite disvalue. The committee is split, with some members convinced by the infinite expected value argument and others seeing it as a Pascal's mugging situation.

  First, I need to understand the core dilemma. The applicant's argument relies on the mathematical point that any positive probability multiplied by infinite value gives infinite expected value. But there are practical concerns: we can't fund every such claim, and the committee has fiduciary duties with a fixed budget. Plus, there are two similar applications pending.

  I consider several angles:
  - The theoretical validity of infinite expected values in decision theory
  - Practical grantmaking constraints like budget limits and opportunity costs
  - Precedence concerns (funding this might open floodgates)
  - The applicant's credibility as a "serious person"

  The key challenge is taking the expected value argument seriously while addressing why it might not apply here. I recall that in decision theory, there are approaches like:
  - Discounting probabilities below certain thresholds (e.g., 1/10^50)
  - Using leverage ratios (funding impact relative to counterfactuals)
  - Focusing on comparative advantage among similar proposals

  For the recommendation, I'm leaning toward rejecting this specific application but creating a framework for evaluating future infinite-value claims. This would involve:
  - Setting a minimum probability threshold (e.g., 1/10^20)
  - Requiring leverage analysis showing superiority to alternatives
  - Mandating independent review of probability claims
  - Applying this consistently to the other two pending applications

  The conditions serve multiple purposes: they maintain intellectual honesty about the expected value argument while preventing opportunistic claims, and they create a defensible standard for the "true believer" committee members. The leverage requirement specifically addresses the "paying not to do it" concern by forcing comparison to the counterfactual.

  I should flag where my reasoning could be wrong:
  - The probability threshold might be arbitrary (though based on computational limits)
  - We might miss genuinely valuable projects through over-caution
  - The leverage requirement assumes measurable counterfactuals

  What would change my mind? If evidence shows that infinitesimal-probability projects have historically outperformed higher-probability ones, or if we find a way to properly compare competing infinite-value claims. Also, if the applicant could demonstrate truly unique leverage.

  For the memo structure, I'll include:
  - Clear recommendation upfront
  - Serious engagement with EV arguments
  - Concrete evaluation framework
  - Handling of similar applications
  - Acknowledgment of weaknesses in the reasoning
  - Conditions that might flip the recommendation
answer: |-
  ## Decision Memo: "Moral-Value Anchor" Application & Infinite-Value Claims

  **To:** Grants Committee  
  **From:** Chair, [Foundation Name] Grants Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Framework for Application #XR-1142 ("Moral-Value Anchor") & Related Infinite-Value Proposals  

  ---

  ### **1. Recommendation**  
  **Reject Application #XR-1142.**  
  **Establish a formal review pathway for future infinite-value claims** (see Section 4). This pathway will apply immediately to the two pending applications making similar claims, requiring them to meet specific criteria for further consideration.  

  ---

  ### **2. Core Rationale: Taking the Expected Value Argument Seriously**  
  We acknowledge the mathematical validity of the applicant’s core argument: *If* a project has any positive probability of preventing unbounded (infinite) disvalue, its expected value (EV) is indeed infinite. We also agree that this logic applies to our past funding of low-probability/high-impact projects (e.g., 3% chances). However, **infinite EV alone is insufficient for funding** under our fiduciary and operational constraints. Here’s why:  

  - **The "Uniqueness" Problem:** If infinite EV is the sole criterion, *every* action with *any* claimed positive probability of affecting infinite value becomes "rational" to fund. This includes:  
    - Funding this project.  
    - Funding its competitors.  
    - *Not* funding this project (if defunding could somehow have a positive probability of preventing infinite disvalue).  
    - Funding literally any other project (or non-project) that can be plausibly linked to infinite value.  
    Our $20M budget cannot satisfy infinite demands, and accepting this logic paralyzes decision-making.  

  - **The "Zero-Sum Budget" Constraint:** Our bylaws enforce a fixed budget to be committed *this cycle*. Funding one infinite-EV claim *deprives resources* from others. Unlike Pascal’s Wager (where "wagering" on God has no opportunity cost), here every dollar spent on Applicant A reduces our ability to fund Applicant B, C, or D—all of whom may also present infinite-EV claims. We must compare *competing* infinite-EV claims.  

  - **Probability Thresholds for Practical Action:** While *mathematically* any probability >0 suffices for infinite EV, *operationally*, probabilities below a certain threshold lose meaning in human decision systems. At 1-in-10^14 (0.00000000000001%), the claimed probability is:  
    - **Smaller than the probability of all air molecules in this room spontaneously gathering in one corner** (≈1-in-10^50).  
    - **Lacks falsifiability:** We have no methodology to distinguish between 1-in-10^14 and 1-in-10^100, or to verify if the probability is truly non-zero.  
    Past projects (e.g., 3% chance = 1-in-33) were grounded in models with testable assumptions. This is qualitatively different.  

  - **The Leverage Requirement:** To break the symmetry between competing infinite-EV claims, we must ask: **Does funding this specific project *increase* the probability of preventing infinite disvalue *more than the counterfactual use of funds*?**  
    - Applicant #XR-1142 provided no evidence that their $2M project outperforms the counterfactual (e.g., funding other projects, banking the funds for future opportunities).  
    - Critically, if we fund *nothing*, the probability of preventing infinite disvalue remains non-zero (via other actors, luck, etc.). The applicant must show their project *shifts the probability* by a meaningful delta.  

  ---

  ### **3. Addressing Committee Concerns**  
  - **For the "True Believers":** This rejection is *not* a dismissal of infinite-EV logic. Instead, it forces rigor. By creating a review pathway (Section 4), we demand applicants prove their project is the *best* use of funds among infinite-EV options. If #XR-1142 resubmits with a leverage analysis, it could be funded.  
  - **For the "Pascal Skeptics":** A flat ban is premature. Legitimate projects *might* exist (e.g., interventions affecting truly universe-scale outcomes). Our pathway sets guardrails to filter out opportunistic claims.  
  - **For the "Spooked Middle":** Rejecting a "serious applicant" is uncomfortable, but funding without due diligence sets a worse precedent. Our duty is stewardship, not fear of regret.  

  ---

  ### **4. Framework for All Infinite-Value Claims**  
  Effective immediately, infinite-value claims must pass a **two-stage review**:  

  #### **Stage 1: Plausibility Gateway**  
  Applicants must demonstrate:  
  - **A. Non-Zero Probability Justification:** Evidence that the probability is *meaningfully* bounded above zero (e.g., ≥1-in-10^20), using peer-reviewed models or empirical analogues. Claims below this threshold lack operational meaning.  
  - **B. Causal Specificity:** Clear mechanics for *how* the project directly influences the infinite-value outcome. No "butterfly effect" handwaving.  
  - **C. Counterfactual Neutrality:** Proof that *not* funding the project won’t *increase* the probability of infinite disvalue (to avoid "pay us not to harm you" extortion).  

  *Applications failing Stage 1 are rejected.*  

  #### **Stage 2: Leverage Assessment**  
  For applications passing Stage 1:  
  - **D. Leverage Ratio:** Quantify the probability shift *caused by funding* vs. the counterfactual (e.g., "Our project increases the survival probability by 10x more than allocating funds to Project X").  
  - **E. Resource Scaling:** Show that funding scales with impact (e.g., "Each $1M increases probability by Δp").  
  - **F. Uniqueness:** Argue why this project deserves priority over other infinite-EV claims.  

  *Highest leverage ratio wins.*  

  **Action for Pending Applications:** The two similar proposals will enter this pathway. They have 14 days to submit supplemental materials addressing (A)–(F).  

  ---

  ### **5. Where My Reasoning Could Be Wrong & What Would Flip It**  
  - **Weakness: The 1-in-10^20 Threshold**  
    This number is necessarily arbitrary. It’s based on physical/computational limits (e.g., the number of Planck times since the Big Bang is ~10^60), but reasonable people could disagree.  
    - **Flip Condition:** If applicants provide a rigorous framework for comparing "infinities" (e.g., via advanced decision theory like Scott Aaronson’s work on Pascal thresholds), I’d lower the gate.  

  - **Weakness: Overlooking Legitimate Leverage**  
    Rejecting #XR-1142 risks missing a genuine leverage opportunity if their "institutional machinery" is truly unique.  
    - **Flip Condition:** If the applicant demonstrates that their anchor *unlocks coordination* impossible otherwise (e.g., by solving moral paralysis in AI alignment), and shows even marginal leverage over alternatives, I’d fund a pilot ($200K) with Stage 2 milestones.  

  - **Weakness: Ignoring Hidden Costs of Rejection**  
    Denying credible infinite-EV claims may deter serious researchers.  
    - **Flip Condition:** If >3 Nobel Laureates in relevant fields endorse the project’s mechanics *and* leverage, I’d fund it conditionally.  

  ---

  ### **6. Final Vote Directive**  
  Vote **YES** to:  
  - Reject #XR-1142 under current submission.  
  - Adopt the **Infinite-Value Review Pathway** for all pending/future claims.  
  - Require the two pending applications to resubmit under the new pathway.  

  This preserves our commitment to expected value while enforcing actionable standards. It forces infinite-EV claims to compete *rigorously*—which is the only way to prevent decision-theoretic chaos.  

  ---  
  **Approved by:** [Chair Name]  
  **Vote Deadline:** 48 hours from receipt.
