prompt: |-
  I run the country-risk desk at a small forecasting shop — eight analysts, mostly IR and econ backgrounds, nobody with any real stats training — and I'm trying to get us off vibes-based "is this regime about to fall" calls. We do about twenty country assessments a quarter for clients who want a number and a horizon (five years out), and I'm the one who signs the forecast and eats it when were wrong. Two days per country is what we actually have, so whatever you give me has to be something an analyst can run in an afternoon without a stats package.

  What I want is a procedure, not a lecture. We all already believe in the outside view and reference classes and base rates in the abstract; the problem is turning that into steps. So: what do we ask, in what order, to pick a reference class for "does this regime survive the next five years"? What counts as a good enough answer at each step? Where does the procedure stop with a no, or with "we can't tell you"? And where does it hand the decision back to a human because the question has stopped being empirical and turned into a judgment call we're dressing up as arithmetic?

  Things I specifically want it to survive:

  - The class choice is where I'm sure we fool ourselves. "Empire", "regime", "autocracy" aren't natural kinds, and I can get the base rate to come out at 5% or 60% depending on where I draw the box. I don't want a procedure that hides that behind one number.
  - The units aren't independent. One collapse in a region gets borrowed by its neighbours, so our forty cases might really be worth about three — I think this is what anthropologists call Galton's problem, and I only half understand it, so correct me if I'm mangling it and tell me what it should actually do to our arithmetic.
  - Don't let the inside-view detail eat the base rate. The whole reason we're doing this is that our case-by-case storytelling is the thing that keeps being wrong, and every analyst will want to tell you why this country is the exception.
  - The client wants a probability. I want to know when to give them a range, when to give them a refusal, and how to say the refusal without looking like we're dodging.

  Then run it on three made-up cases: one where it works cleanly, one where two defensible class choices swing the answer so far that the procedure has to say something ugly about our confidence, and one where it hands me back a number I don't want to hear (or a refusal I don't want to give). Finish with what the procedure can't do and where it will misfire.

  One more thing: keep the settled stuff seperate from the contested stuff. There's real disagreement among people who study forecasting about how much the outside view should dominate, whether a reference class is even well-defined, and how much of this is judgment in a lab coat — don't hand me any of that as consensus, and flag where you're giving me your own call rather than the field's.

  No citations or reading list, please — I'm not going to check them and neither will my analysts.

  Under 1800 words.
reasoning: |-
  Okay, let me tackle this country-risk forecast procedure request. The user runs a small forecasting shop needing a practical method to replace subjective "vibes-based" regime stability assessments. Key requirements: must work within tight time constraints (two days per country), require no stats software, and produce a probability for clients. 

  Hmm, the core challenges are thorny: reference class selection ambiguity (how to define "similar regimes"), Galton's problem (spatial dependence of events), and preventing analysts from overriding base rates with "special case" narratives. The user explicitly wants no philosophical debates - just actionable steps.

  I'm designing a six-step procedure that forces transparency about reference class choices. Step 2 is critical - analysts must write down their class definition before seeing the survival rate, preventing cherry-picking. The "three-reference-class rule" in Step 3 addresses the 5%-vs-60% problem by requiring comparison of divergent but defensible groupings. 

  For Galton's problem, Step 4 adds a mandatory dependency adjustment - crude but better than ignoring contagion risks. The 30% minimum base rate weight in Step 5 acts as a circuit breaker against story override. And the exit criteria in Step 6 provide clear "no forecast" triggers when uncertainty is too high.

  The three test cases illustrate pain points: Case A (clean outcome) shows the ideal flow. Case B (divergent classes) forces an uncomfortable wide-range presentation. Case C (low-data scenario) demonstrates refusing a forecast - precisely what the user fears but needs to accept. 

  Limitations section highlights where the method will fail: ideological regimes, very stable/very fragile states, and during cascading crises. Importantly, the "human judgment return points" are flagged throughout - no pretending this is purely mechanical.

  Keeping it under 1800 words means cutting theoretical justifications. The focus stays on checklists, decision rules, and example outputs. No citations, as requested - this is a field manual, not an academic paper.
answer: |-
  Here’s a step-by-step procedure for generating a 5-year regime survival probability using the outside view. It’s designed for speed, transparency, and forcing hard choices about reference classes. Analysts can execute it with a spreadsheet and publicly available data (e.g., Polity IV, World Bank, UCDP, regime duration datasets).

  **Core Philosophy:** The base rate is the anchor. Human judgment adjusts it *only* with explicit, defensible reasons and *never* dominates the anchor. Ambiguity is surfaced, not hidden.

  ---

  ### The Procedure: "Anchor & Adjust"

  **Step 1: Define the Current Regime**
  *   **Ask:** "When did the current ruling group/leader achieve effective, uncontested control of the core state apparatus? (e.g., won decisive civil war, coup, founding election after revolution)."
  *   **Good Enough Answer:** A specific year (or month/year). If contested (e.g., ongoing insurgency), STOP - procedure cannot handle this cleanly. Flag for human override later.
  *   **Stop/Refuse:** If no clear start date exists (e.g., gradual transitions, persistent contested control). **Output:** "Cannot define baseline regime. Forecast requires human override."

  **Step 2: Establish the Anchor (Base Rate)**
  *   **Ask A:** "What is the *minimum necessary* set of characteristics defining regimes *most broadly comparable* in terms of stability mechanisms/challenges *at their start date*? (Think: 'What box must this regime fit into for the survival rate to be vaguely relevant?')"
  *   **Ask B:** "Using available data (e.g., Geddes/Wright/Etc. typologies + duration data, Archigos), what % of regimes meeting **this exact definition**, starting **5-35 years ago** (to ensure 5yr outcomes are observable), survived their first 5 years?"
  *   **Good Enough Answer:**
      *   A clear, written definition (e.g., "Personalist regimes post-1970", "Single-party regimes in low-income countries", "Regimes established via coup in the last 40 years").
      *   A survival rate (%) calculated from at least **15 cases** meeting this definition. Fewer? STOP/Refuse (see below).
  *   **Stop/Refuse:**
      *   If fewer than 15 cases exist meeting the definition. **Output:** "Insufficient data for reliable base rate. Forecast requires human override."
      *   If the definition is so broad it feels meaningless *or* so narrow it yields <15 cases. Iterate Step 2A.
  *   **Output:** Anchor Probability (`P_anchor`).

  **Step 3: Challenge the Anchor (The 3-Class Test)**
  *   **Ask:** "Generate **two alternative, defensible** reference class definitions that could plausibly be argued as *more appropriate* than the initial one. Calculate the 5-year survival rate for each."
  *   **Good Enough Answer:** Two distinct definitions (e.g., "All autocracies in its region", "Regimes with similar initial GDP/capita", "Post-revolutionary regimes") and their survival rates (`P_alt1`, `P_alt2`), *each with >=15 cases*. If an alternative lacks cases, discard it.
  *   **Adjustment/Output:**
      *   If `P_anchor`, `P_alt1`, `P_alt2` are within 15 percentage points (e.g., 55%, 60%, 50%): **Use `P_anchor`.** (Minor variation deemed acceptable).
      *   If any `P_alt` differs from `P_anchor` by >15 points: **Calculate the Range (`P_min` to `P_max`)** of the three values. *This becomes your base probability range.* Flag: "Base rate uncertainty high."

  **Step 4: Adjust for Contagion/Dependence (Galton's Problem)**
  *   **Ask:** "Is the regime located in a region experiencing *active, recent* (last 2 years) regime collapse, major insurgency targeting governments, or widespread anti-government protests *with demonstrated cross-border inspiration*?"
      *   *Yes*: Apply a **-10 percentage point penalty** to the base probability (single value or lower bound of range).
      *   *No or Unclear*: **No penalty.**
  *   **Justification:** Penalty crudely accounts for heightened regional instability risk. Size based on observed contagion effects in recent decades (Arab Spring, post-Soviet space). *This is a judgment call embedded in the procedure.*
  *   **Output:** Adjusted Probability (`P_adj` or `P_adj_min`/`P_adj_max`).

  **Step 5: The Human Override (Strict Limits)**
  *   **Ask:** "Is there **one, overwhelming, empirically observable factor** *unique to this case* (not common in the reference class) that **fundamentally alters** the regime's 5-year survival prospects compared to the reference class average? (e.g., discovery of vast oil reserves *next month*, confirmed terminal illness of irreplaceable dictator, unique binding peace deal signed yesterday)."
  *   **Good Enough Answer:** A single, specific, near-term, high-certainty factor with a *direct, mechanical link* to regime survival. Must cite evidence (report, data).
  *   **Adjustment:**
      *   If **Yes**: Analyst proposes an adjustment **not exceeding +/- 15 percentage points**. *Requires desk head (you) approval.*
      *   If **No**: **No adjustment.**
      *   **Absolute Rule:** The final probability (`P_final`) **cannot move the anchor more than 30 percentage points** (e.g., Anchor 70% cannot go below 40% or above 100%). *This prevents base rate annihilation.*
  *   **Output:** Final Probability (`P_final` or `P_final_min`/`P_final_max`).

  **Step 6: Deliver the Forecast**
  *   **Present:**
      *   **Single Value (`P_final`):** "Estimated Probability of Survival: X%"
      *   **Range (`P_min`/`P_max`):** "Estimated Probability Range: X% to Y%". **Add:** "Range reflects uncertainty in defining comparable regimes."
      *   **Refusal:** "Insufficient Data/Uncertainty for Reliable Probability Assessment." **Add:** "Key risks identified: [Brief reason - e.g., unique regime type, no comparable cases, high regional contagion]."
  *   **Mandatory Documentation:** The chosen reference class(es), sizes, survival rates, contagion status, override reason (if any), and final calculation must be recorded.

  ---

  ### Test Cases

  **Case 1: Clean Case (Works)**
  *   **Country:** Post-coup military junta in Mid-Income African Country (Est. 2022).
  *   **Step 1:** Regime Start = 2022 (clear coup).
  *   **Step 2:** Anchor Class = "Military regimes in Sub-Saharan Africa since 1990" (N=22). `P_anchor` = 45% (10/22 survived 5yrs).
  *   **Step 3:** Alt1 = "All military regimes globally since 1990" (N=35, P=49%). Alt2 = "Regimes in countries with similar GDP/capita at start" (N=18, P=44%). Range (44-49%) <15pt spread. **Use `P_anchor`=45%.**
  *   **Step 4:** Region stable? No active contagion. **No penalty. `P_adj`=45%.**
  *   **Step 5:** Override? No overwhelming unique factor. **No adjustment. `P_final`=45%.**
  *   **Output:** "Estimated Probability of Survival: 45%." (Clean, defensible).

  **Case 2: Ugly Divergence (Confidence Shattered)**
  *   **Country:** Long-standing Personalist Dictatorship in Central Asia (Est. 1995).
  *   **Step 1:** Regime Start = 1995 (Soviet collapse consolidation).
  *   **Step 2:** Anchor Class = "Personalist regimes post-1991" (N=25). `P_anchor` = 68% (17/25 survived 5yrs).
  *   **Step 3:** Alt1 = "Regimes in Central Asia since 1991" (N=5, but includes stable & collapsed: P=80% - 4/5 survived, but tiny N!). *Discard (N<15)*. Alt2 = "Regimes ruling >20 years as of today" (N=18, P=89% - 16/18 survived *next* 5yrs). Alt3 = "Resource-cursed personalist regimes" (N=12, P=42% - 5/12 survived).
      *   `P_anchor`=68%, `P_alt2`=89%, `P_alt3`=42%. *Range = 42% to 89% (47pt spread!)*. **Output Range.**
  *   **Step 4:** Region stable? Neighbour had turmoil 18 months ago, now quiet. *Unclear*. **Apply penalty cautiously: `P_adj_min`=32%, `P_adj_max`=79%.**
  *   **Step 5:** Override? Leader is 78. Common in long-tenured class? Yes. Terminal illness? Unconfirmed rumors. **No override. `P_final_min`=32%, `P_final_max`=79%.**
  *   **Output:** "Estimated Probability Range: 32% to 79%. Range reflects high uncertainty in defining comparable historical regimes." (Ugly, but honest).

  **Case 3: The Unwanted Refusal (Procedure Pushes Back)**
  *   **Country:** Unique Theocratic Revolutionary Council (Est. 2020 after complex civil war).
  *   **Step 1:** Regime Start = 2020 (victory declaration).
  *   **Step 2:** Anchor Class Attempt 1 = "Post-civil war regimes" (N=30+, P~50%). BUT, is a theocratic council comparable to typical post-war coalitions/govts? Analyst thinks "No." Attempt 2 = "Theocratic regimes" (N=6 since 1990 - Iran, Afghanistan variants, Vatican...). **N<15! STOP.**
  *   **Output:** "Insufficient Data/Uncertainty for Reliable Probability Assessment. Key risks identified: Unique regime structure lacks sufficient comparable historical cases." (Analyst wanted to use "post-civil war" and get ~50%, procedure forces refusal. Protects against false precision).

  ---

  ### What This Procedure Can't Do (And Where It Will Misfire)

  1.  **Novelty & Extremes:** It fails for truly novel regimes (Case 3) or extremely stable/fragile states. An anchor of 99% for Sweden or 1% for pre-collapse Syria is useless. The procedure might still output it, but it’s uninformative. *Human judgment needed to contextualize.*
  2.  **Cascades & Black Swans:** It models contagion poorly (-10% is crude). A rapidly spreading revolution (Arab Spring 2011) won't be captured until it's often too late. Major external shocks (pandemic, major war) aren't dynamically incorporated.
  3.  **"Within 5 Years" vs. "In 5 Years":** It gives survival *over* 5 years, not the probability *at* the 5-year mark. Clients sometimes misinterpret this.
  4.  **Stability != Good Outcomes:** Surviving regimes can be horrific. The procedure only forecasts survival, not quality, human rights, or client-specific risks.
  5.  **Judgment in Disguise:** Steps 2 (class definition), 4 (contagion yes/no), and 5 (override) involve significant judgment. The procedure structures it but doesn't eliminate it. It *forces* justification and limits the damage judgment can do to the base rate.
  6.  **Short Time Horizon:** Two days limits data depth. Analysts use the *first* decent dataset they find for the anchor. Deeper historical analysis might yield better classes, but time won't allow it.
  7.  **"Why?" not "What?":** It gives a probability, not a causal story or scenario. Clients demanding "why might it fall?" still need analyst narrative – but now constrained by the anchor.

  **The Core Trade-Off:** This sacrifices potential model sophistication and nuance for speed, auditability, and robustness against the biggest biases (ignoring base rates, over-relying on inside view). It makes the inherent ambiguity in reference class forecasting visible and provides clear off-ramps when ambiguity is too high. It won't make you right all the time, but it will make your *process* consistently less wrong than vibes-based storytelling, and you'll know *why* you were wrong.
