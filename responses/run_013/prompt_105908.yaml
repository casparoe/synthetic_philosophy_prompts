  The user might be skeptical if this reduces to realism thinly veiled. I’ll emphasize that the "truth" is still grounded in our commitments, not external facts. Their deeper need is likely to stress-test quasi-realism’s limits—they want to see if it holds under pressure or cracks. I’ll concede nothing major but clarify that propositions are built from attitudes, not discovered. 

  Sharp reply needed: no throat-clearing, straight to rebuttal. Focus on how embedding works without realist metaphysics. For the comparative, explain "more wrong" as intensity of disapproval. If they push back, be ready to dissect attitude consistency further.
answer: |-
  No, you haven’t caught me out. Your examples only appear problematic because you’re conflating what moral sentences express with what they *say*. When the defence lawyer utters 'if lying is wrong, then the statement you have just made is wrong,' he isn’t expressing disapproval of lying or of the statement; he’s expressing a higher-order attitude about the *logical commitment* entailed by the witness’s own moral perspective. The conditional asserts that *if* you hold the attitude toward lying, you must consistently hold it toward this statement. Its truth-aptness stems from the fact that it correctly maps the inferential relationships between attitudes—relationships governed by the same logical rules that bind descriptive discourse. The lawyer isn’t reporting psychological states; he’s tracking the structure of normative reasoning.

  Your committee example is even clearer: 'lying is wrong, and it is more wrong than breaking a promise, though less wrong than betraying a friend.' This expresses a complex pattern of attitudes—not just disapproval of lying, but *stronger* disapproval of it than of promise-breaking, and *weaker* disapproval than of betrayal. Crucially, when embedded in 'the panel concluded that lying is more wrong than breaking a promise,' the 'that'-clause doesn’t describe the panel’s feelings; it *designates* the attitude-pattern they endorsed. Truth here is about whether the endorsement accurately reflects the collective stance they intended to adopt. This isn’t realism because the 'truthmaker' isn’t an independent moral fact—it’s the consistency and coherence of the attitudes themselves within the practice. 'More wrong than' isn’t describing a mysterious comparative property; it’s expressing a comparative strength of disapproval, and we reason about it by projecting our patterns of attitude into logically structured contexts. The proposition is real, but it’s constituted by the attitude’s role in our discourse, not by correspondence to mind-independent reality.
