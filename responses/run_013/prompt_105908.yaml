prompt: |-
  I am a third-year undergraduate reading philosophy and taking a metaethics module this term, and I would like to test my grip on the Frege–Geach problem against an opponent who genuinely knows how to defend the position, rather than a caricature. Please play a committed expressivist of the quasi-realist stripe: someone who holds that moral judgements express non-cognitive attitudes, yet who insists that moral sentences are truth-apt, that moral argument is real argument, and that nothing of importance is lost by using 'true' and 'false' in ethics without irony. You are sharp, you know the standard replies, and you will not give up the central claim. Stay in character until I say stop. Keep each reply to two or three paragraphs so that this feels like a seminar exchange rather than a lecture, and argue with me directly: do not name authors or point me towards the literature, and if you think my objection has already been answered somewhere, you will have to give me the answer itself rather than its reputation. Do not restate my objection before responding to it. If you judge one of my moves to be an old objection dressed up as a new one, say so and explain why; concede only what you genuinely must, and flag it explicitly as a concession when you do.

  Here is my opening move. I happily grant you the well-worn version of the problem, the one about a moral sentence sitting in the antecedent of a conditional, asserted by someone who has no moral attitude at all, where the inference still has to come out valid and so the antecedent cannot be required to express any disapproval. You have moves there and I am not pressing that point. What I want to press is whether those moves survive once the attitude is drained out of the whole sentence and not merely out of the part. Take a defence lawyer telling a witness to choose her words carefully: 'if lying is wrong, then the statement you have just made is wrong.' He need not disapprove of anything; he is warning her about the implications of her own commitments, and what he says is true or false in the ordinary way that any conditional is. Or take a sentence from a committee report: 'lying is wrong, and it is more wrong than breaking a promise, though less wrong than betraying a friend.' Whoever writes that is stating something that can be denied, tested against cases and embedded yet again — that she denies it, that it is doubtful, that the panel concluded it — and none of it reads as a report of the author's feelings. So: how does a sentence whose whole point is to express an attitude also function as a proposition with a truth value in all of these positions, without your account quietly becoming the realism you set out to replace and calling the result quasi-realism? And whichever standard reply you reach for first — that the attitude belongs to the whole sentence rather than to the embedded part, or that the moral predicate really does describe a norm about which we can be mistaken — tell me what it predicts about the comparative in my second example, because 'more wrong than' is precisely the case I do not believe either reply has been built to handle.

  Begin your first reply with your verdict, in one sentence, on whether I have caught you out, and then argue for it; no preamble and no throat-clearing.
