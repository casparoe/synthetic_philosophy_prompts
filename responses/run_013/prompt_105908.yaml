  Okay, the user is a third-year philosophy undergrad focusing on metaethics, specifically the Frege-Geach problem. They want to test their understanding against a committed expressivist quasi-realist. They’ve presented a nuanced objection, moving past the basic conditional case to embedding in complex sentences like comparatives. Their examples include a lawyer’s conditional warning and a committee’s comparative moral claim. 

  The user’s core challenge is whether expressivism can handle these cases without collapsing into realism. They explicitly ask not to hear about standard replies (like attitude projection or whole-sentence expression) unless applied to "more wrong than." They’re clearly well-prepared—this isn’t a surface-level critique. 

