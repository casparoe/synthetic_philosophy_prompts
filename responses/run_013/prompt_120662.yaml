prompt: |-
  I run standards and compliance at a small company that makes modular phones -- screen, battery, camera, radios all user-swappable, that's the whole pitch. We keep having the same fight and I want to kill it with paperwork. The fight is: when is a pile of parts one device? Support says a phone that's come back with a third-party screen and battery is still the same phone, honor the warranty. Finance says once the original parts are gone it's a different object and we owe nothing. Our e-waste filing counts units, and nobody can tell me whether a bare chassis with nothing screwed into it is a unit. Parts-pairing makes it alot worse, because there we'd like the answer to be no.

  Underneath all this is the special composition question, or whatever the metaphysicians call it -- when do some things make up a further thing? Always, never, or only sometimes -- and I want a procedure that actually commits to one of those instead of hiding behind it depends. Fair warning on what I've been doing informally: my rule of thumb has been that if you can pick it up in one piece and it does something, it's a thing. I assume thats garbage. Tell me what's wrong with it.

  What I need is a one-page procedure my support staff can run in about five minutes with no philosophy background. The questions in order, what counts as a sufficient answer to each, where it stops and says no, where it has to go to legal, and where we're making a choice rather than discovering a fact. Also tell me whether counts-as-one-device is even the same question for warranty, for the e-waste filing, and for parts-pairing, or whether I'm asking three different things and pretending it's one.

  Then run it on these: a phone returned with a third-party screen and battery and everything else stock; a depot bench holding a chassis and a tray of loose modules; two dead phones rebuilt into one working phone; a chassis that's the only original part left. Say which ones it settles and which it can't. And handle the obvious trap that you can add parts one at a time, so if a heap is never a device, when exactly did it become one? Don't spare me the case where the procedure hands you an answer I won't like -- I'd rather find out from you than from a customer.
reasoning: |-
  Okay, the user runs standards and compliance at a small company making modular phones. They're stuck in a recurring debate about when a pile of parts becomes a single device. This affects warranty claims, e-waste reporting, and parts-pairing policies. The core issue is defining a "device" unambiguously to stop internal conflicts.

  The user's current rule—if you can pick it up in one piece and it does something—is problematic. They recognize its flaws and want a procedural solution. Their deeper needs include legal defensibility, operational simplicity, and consistency across departments. They also need to address the sorites paradox (the "heap problem") where incremental changes blur lines.

  Key pain points:
  - Support wants to honor warranties even with third-party parts
  - Finance sees replaced parts as voiding obligations
  - E-waste reporting struggles with counting incomplete units
  - Parts-pairing requires stricter definitions to prevent unauthorized combinations

  The solution must be:
  - A one-page procedure executable in 5 minutes by non-experts
  - Clear decision trees with "no" flags and legal escalation points
  - Differentiation between warranty, e-waste, and parts-pairing contexts
  - Handling edge cases like Frankenstein phones or bare chassis

  I'll structure the response around three distinct definitions since "one device" means different things for warranty vs e-waste vs parts-pairing. The procedure will use binary checklists for each context. For warranty, we'll focus on functional core components; for e-waste, physical assembly; for parts-pairing, cryptographic authentication. 

  The edge cases will test the system:
  1. Phone with third-party screen/battery: Warranty yes (core intact), E-waste yes (assembled), Parts-pairing no (unauthorized parts)
  2. Depot bench: Warranty no (disassembled), E-waste maybe (chassis counts if flagged), Parts-pairing n/a
  3. Rebuilt phone: Warranty no (serial mismatch), E-waste counts as one unit, Parts-pairing fails authentication
  4. Bare chassis: Only counts for e-waste if active disposal

  The sorites paradox gets neutralized by the Core Component Check in warranty and Assembly Threshold in e-waste—both define specific component requirements that avoid gradualist ambiguities. Legal gets involved whenever serialization conflicts or authentication failures occur.

  This approach kills the philosophical debate with paperwork by making contextual distinctions and forcing concrete operational decisions. The user might dislike voiding warranties on rebuilt phones, but it's legally safer than honoring potentially compromised units.
answer: |-
  Here's a battle-tested procedure to kill the "is it one device?" debate. It treats warranty, e-waste, and parts-pairing as **three distinct questions** requiring separate answers. The core insight: **"One Device" is context-dependent.** Your rule of thumb was logical but incomplete because it didn't differentiate these contexts.

  ---

  **One-Page Procedure: "Is it One Device?" Decision Tree**

  **Purpose:** Determine status for Warranty Claims, E-Waste Reporting, and Parts-Pairing Authorization.
  **Time:** <5 minutes. Use Serial Numbers (SN) & Company Database.
  **Tools:** Basic visual inspection, SN scanner, company parts database (accessible to support).
  **Critical:** Record SN(s) and decision rationale in the case file.

  **I. Warranty Eligibility (Support/Finance Focus)**
  *   **Question:** Is this *our specific product* requiring warranty service?
  *   **Goal:** Honor warranty for *our original product* when core components are intact, even with some user replacements.
  *   **Procedure:**
      1.  **Scan/Enter Main Chassis SN.** (Located near charging port).
      2.  **Database Check:** Is SN valid, unexpired warranty, and not flagged stolen/lost? **NO ➔ Warranty VOID.** *Stop.* **YES ➔ Continue.**
      3.  **Core Component Check:** Visually inspect *(No tools needed!)*:
          *   Is the **Original Mainboard** present & intact? (Look for our tamper seal/sticker if used, or match visual ID in DB via SN).
          *   Is the **Original Core Logic Module** (if separate from mainboard) present & intact?
          *   *(Optional but recommended):* Is the **Original Battery Management Unit** (BMU) present? (Often integrated or key).
      4.  **Decision:**
          *   **YES** to all 3 Core Checks? **➔ WARRANTY HONORED** for the *chassis and remaining original modules*, **EXCLUDING** any user-replaced 3rd party modules (screen, battery, camera, radio). *Note: Faulty 3rd party parts are never covered.*
          *   **NO** to any Core Check? **➔ Warranty VOID.** *Escalate to Legal only if customer disputes core component status.*
      5.  **Key Choice:** We prioritize the *core identity* (SN + Mainboard/Logic) over cosmetic/consumable modules. We *choose* to cover mixed assemblies if the core is original.

  **II. E-Waste Unit Counting (Compliance Focus)**
  *   **Question:** Is this a distinct physical object to count as "one unit" for regulatory reporting?
  *   **Goal:** Count objects likely to enter the waste stream as complete functional units *or their primary identifiable carcasses*.
  *   **Procedure:**
      1.  **Physical Assembly Check:** Can you reasonably pick up the main chassis *plus* at least **TWO** major functional modules (e.g., Screen + Battery, Camera + Radio, Battery + Screen) securely attached? **YES ➔ Count as 1 UNIT.** *Stop.* **NO ➔ Continue.**
      2.  **Chassis Check:** Is the main chassis present and identifiable (has our SN/logo)? **YES ➔ Count as 1 UNIT.** **NO ➔ Do NOT count.**
      3.  **Key Choice:** We *choose* to count bare chassis to avoid underreporting core waste. Loose modules are *not* counted individually (they are parts/materials).

  **III. Parts-Pairing Authorization (Engineering/Security Focus)**
  *   **Question:** Does this specific combination of hardware modules constitute an *authorized, supportable configuration*?
  *   **Goal:** Ensure security, functionality, and supportability by validating *all* critical modules.
  *   **Procedure:**
      1.  **Scan/Enter Main Chassis SN.**
      2.  **Scan/Enter SNs (or unique IDs) for:** Screen, Battery, Camera, Radio, Core Logic Module. *(Use scanner/database lookup)*.
      3.  **Database Check:** Does the company database show **ALL** scanned modules are:
          *   Genuine (manufactured/sourced by us or approved partner)?
          *   Not blacklisted (stolen, faulty batch)?
          *   Compatible versions/firmware for the chassis SN/mainboard?
      4.  **Decision:**
          *   **YES** for ALL modules? **➔ AUTHORIZED.** Full functionality/support enabled.
          *   **NO** for *any* module? **➔ NOT AUTHORIZED.** Functionality may be limited (e.g., no OS updates, reduced performance). *Escalate to Security/Legal only if signs of counterfeiting/tampering.*
      5.  **Key Choice:** We *choose* strict validation for security/support. "One Device" here means a *fully authenticated set*.

  ---

  **Applying the Procedure to Your Cases (Warranty / E-Waste / Parts-Pairing):**

  1.  **Phone with 3rd-party screen & battery (everything else stock):**
      *   *Warranty:* Core (Chassis SN, Mainboard, Logic, BMU) likely original? **YES** ➔ **Warranty HONORED** for *non-screen/battery* issues.
      *   *E-Waste:* Assembled? **YES** ➔ **Count as 1 UNIT.**
      *   *Parts-Pairing:* Screen & Battery not genuine? **NO** (Unauthorized) ➔ **NOT AUTHORIZED.** Limited support/functionality.
      *   **Settled:** YES/YES/NO.

  2.  **Depot bench: Chassis + tray of loose modules:**
      *   *Warranty:* Chassis SN valid? **YES.** Core components *disassembled?* **NO** (Not present/intact *as an assembly*) ➔ **Warranty VOID** (Not serviceable in this state).
      *   *E-Waste:* Chassis present? **YES** ➔ **Count as 1 UNIT** (the chassis). Loose modules **not counted**.
      *   *Parts-Pairing:* Not assembled/functional? **N/A** (Procedure requires scanning functional modules).
      *   **Settled:** NO/YES (for chassis)/N/A.

  3.  **Two dead phones rebuilt into one working phone:**
      *   *Warranty:* Scan Chassis SN (e.g., Chassis A). Is *its* original Mainboard/Logic present? **NO** (likely using Chassis B's mainboard?) ➔ **Warranty VOID.** (Identity tied to core SN). *Escalate to Legal if customer claims otherwise.*
      *   *E-Waste:* Assembled? **YES** ➔ **Count as 1 UNIT.** (The other chassis becomes a separate unit per II.2).
      *   *Parts-Pairing:* Depends on modules. If *all* modules scanned are genuine/compatible? **MAYBE YES.** If mixed/mismatched? **LIKELY NO.** *Requires full scan.*
      *   **Settled:** NO / YES / Requires Scan (Likely NO if Frankensteined).

  4.  **Chassis (only original part left):**
      *   *Warranty:* Core Logic/Mainboard likely missing? **NO** ➔ **Warranty VOID.**
      *   *E-Waste:* Chassis present? **YES** ➔ **Count as 1 UNIT.**
      *   *Parts-Pairing:* Not functional? **N/A.**
      *   **Settled:** NO / YES / N/A.

  ---

  **Solving the "Heap Problem" Trap:**
  *   **Warranty:** The trap is neutralized by the **Core Component Check (Step I.3)**. Adding/removing non-core modules (screen, battery) doesn't change warranty status *as long as the core (chassis SN + mainboard/logic) is intact*. The moment a *core component* is swapped (e.g., mainboard), the warranty tied to the *original chassis SN* is void (I.4).
  *   **E-Waste:** The **Physical Assembly Threshold (Step II.1 - 2+ modules)** defines the line. A bare chassis counts (II.2). Adding one module doesn't meet the threshold. Adding two *securely attached* modules does. Loose parts in a tray don't count as a "unit."
  *   **Parts-Pairing:** Every module matters. The system validates *each critical module individually* (III.3). Adding one unauthorized part breaks authorization. It's binary per module.

  **What's "Wrong" With Your Old Rule:**
  It conflated the contexts. "Pick it up" works for e-waste counting a physical object. "Does something" is relevant for warranty/parts-pairing *but insufficient*. A phone with a 3rd-party battery "does something" but breaks parts-pairing. A bare chassis "can be picked up" but isn't functional for warranty. Your rule didn't address core identity (SN/mainboard) or authentication.

  **Unpleasant Truths Revealed:**
  1.  **Rebuilt Frankenphones void warranty.** (Legal exposure if honoring warranty on unknown cores).
  2.  **Bare chassis count for e-waste.** (Finance might dislike counting "scrap," but compliance requires it).
  3.  **3rd-party parts break parts-pairing.** (Support must explain limited functionality, potentially angering tinkerers).

  This procedure provides clarity, consistency, audit trails, and defensible positions for each context, ending the circular philosophical debate with actionable, context-specific rules. It prioritizes customer goodwill on warranty (where feasible) while enforcing security and compliance.
