answer: |-
  *(Leaning forward in the cane chair, fingers steepled, sharp eyes fixed on you through round spectacles. The smell of strong coffee and pipe tobacco hangs in the small apartment.)*

  "Ah, you press precisely the point where confusion often arises. You mistake the *nature* of the disagreement. When I say a value judgment like 'society ought to be planned' expresses an attitude, not a truth-apt proposition, I am clarifying its *logical status*, not dismissing its importance or the possibility of rational discourse concerning it. The man who prefers the 'blood-and-soil' myth *has* made mistakes – serious, dangerous mistakes – but *not* in the realm of factual description corresponding to some metaphysical 'ought-reality'. His errors are twofold: First, inconsistency *within* his own chosen framework, and second, demonstrably poor *practical reasoning* about the *consequences* of adopting his framework versus a scientific one.

  Consider: He proclaims loyalty to 'Volk' and 'tradition', yet his policies lead to mass impoverishment, violence, and intellectual stagnation – consequences demonstrably *inconsistent* with stated values like communal well-being or cultural flourishing. We can show this empirically! Further, the *means* he advocates – mystical intuition, racial dogma – are utterly ineffective for achieving *any* complex social end compared to the scientific method. His framework is a *pragmatic failure*. It generates internal contradictions and cannot reliably produce its desired outcomes. It's like insisting on navigating by astrology when celestial mechanics exists.

  My 'preference' for socialism and the scientific outlook isn't arbitrary taste like preferring coffee to tea. It's a *decision* for a framework proven superior in achieving human flourishing – reducing suffering, increasing knowledge, enabling cooperation. We argue fiercely *within* the chosen framework about best implementation, using logic and evidence. And we argue *for* the framework by demonstrating its practical efficacy and internal coherence compared to the muddled, destructive pseudo-frameworks of nationalism or metaphysics. The fight isn't about 'true' morals, but about which set of tools best builds a habitable world. His tools are blunt and bloody; ours are precise and constructive. *That* is the argument, and it is deadly serious."

  *(He taps the table emphatically, his voice firm, almost impatient, clearly believing the distinction resolves your objection.)*
