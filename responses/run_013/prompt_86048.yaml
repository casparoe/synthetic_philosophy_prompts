  ### Fairness Review Desiderata for Credit Models
  Your constraints shape a demanding set of requirements. Below are the core **desiderata** any fairness criterion must satisfy in your setting, argued through concrete failure scenarios. I then resolve the impossibilities, commit to a criterion, and state the trade-offs.

  ---

  #### **Non-Negotiable Desiderata**  
  *These are grounded in operational, legal, or data realities.*

  1. **Observability**  
     - **Demands**: Must be computable *without* outcome data for rejected applicants.  
     - **Motivation**: If a criterion requires knowing repayment for rejected applicants (e.g., false negative rates), it forces reliance on untestable assumptions (e.g., "rejected applicants would have defaulted at rate X"). This invites legal liability and arbitrariness.  
     - **Status**: Genuine requirement. You lack data; no workaround exists.

  2. **Measurement-Robustness**  
     - **Demands**: Must tolerate error in protected group identification (e.g., imputed race/ethnicity).  
     - **Motivation**: If a criterion fails with minor group misclassification (e.g., 5% error), it becomes a noise-driven ritual. Example: A model might pass/fail fairness due to surname imputation flaws, not actual bias.  
     - **Status**: Genuine requirement. Your group variable is intrinsically noisy.

  3. **Threshold-Invariance**  
     - **Demands**: Verdict must hold across reasonable score cutoffs (e.g., 650 vs. 670) and rebinning.  
     - **Motivation**: If fairness flips when cutoffs shift (e.g., "fair at 650, unfair at 670"), the review is useless. Business adjusts cutoffs quarterly; the *model* should be fair, not its deployment details.  
     - **Status**: Genuine requirement. Your dynamic business context demands stability.

  4. **Non-Gameability**  
     - **Demands**: Must not be manipulable by cosmetic changes (e.g., score scaling, binning tricks) without altering actual decisions.  
     - **Motivation**: Vendors could "pass" fairness by post-processing scores (e.g., adding noise to equalize approval rates) while preserving discriminatory lending. This undermines the review’s purpose.  
     - **Status**: Genuine requirement. You need an in-house, ungameable verdict.

  5. **Business-Necessity Alignment**  
     - **Demands**: Must allow disparate impact *if* justified by risk prediction (e.g., higher defaults in Group X). Must flag disparate impact *only* when unjustified or intentional.  
     - **Motivation**: Legally, facially neutral policies with disparate impact are acceptable with business necessity (e.g., *Griggs v. Duke Power*). A criterion that penalizes risk-driven disparities (e.g., forcing equal approval rates despite differing risk) forces unethical lending.  
     - **Status**: Genuine requirement. Legal compliance hinges on this distinction.

  ---

  #### **Debatable Desiderata**  
  *These reflect philosophical camps but aren’t absolute for your context.*

  6. **Baseline-Invariance**  
     - **Demands**: Verdict should not reverse if the reference group changes (e.g., from "White" to "Hispanic").  
     - **Motivation**: If fairness depends on arbitrary baseline choices (e.g., "80% approval parity vs. Group A but not Group B"), the review becomes subjective.  
     - **Status**: Camp-specific. While desirable, it’s secondary to Observability or Business-Necessity. Violations are inconvenient but not fatal.

  7. **Individual Fairness**  
     - **Demands**: Similar individuals should receive similar scores.  
     - **Motivation**: If two identical applicants get different scores due to group membership, it indicates bias.  
     - **Status**: Camp-specific. Conflicts with group fairness metrics and requires granular similarity definitions—infeasible without perfect data. Prioritize group-level checks given your constraints.

  ---

  #### **The Impossibility Trilemma**
  Three core desiderata conflict. **You cannot simultaneously achieve**:  
  - **Observability** (no rejected-applicant outcomes),  
  - **Strict Error-Rate Balance** (e.g., equal false positive rates across groups),  
  - **Business-Necessity Alignment** (allowing risk-driven disparities).  

  **Why?**  
  Error-rate balance requires knowing outcomes for all applicants (violating **Observability**). If you relax Observability (e.g., via proxies), you violate **Business-Necessity Alignment** by assuming risk is identical across groups when it may not be. If you enforce error-rate balance without Observability, you force artificial parity, ignoring legitimate risk differences.  

  **Which subset fails?**  
  - **Observability + Business-Necessity** → *Must abandon Strict Error-Rate Balance*.  
  - **Observability + Error-Rate Balance** → *Must abandon Business-Necessity*.  
  - **Business-Necessity + Error-Rate Balance** → *Must abandon Observability*.  

  ---

  #### **The Commitment: Calibration as the Criterion**
  **Use: Calibration by Group**  
  - **Definition**: For any given risk score, the predicted default probability matches the actual default rate *within each group*.  
    Example: Hispanic applicants scored at 700 default at 5%, and non-Hispanic applicants at 700 default at 5%.  
  - **Computation**: Requires only *approved applicants’ outcomes*. Bin scores (e.g., 650–660) and compare mean predicted risk vs. actual default rate per bin and group.  
  - **Verdict**: Pass if differences are statistically negligible (e.g., <0.5% absolute difference per bin).

  **Why Calibration?**  
  - **Satisfies**:  
    - **Observability**: Uses only approved-applicant repayment data.  
    - **Business-Necessity**: Allows approval-rate disparities *if* driven by risk (e.g., Group A has higher defaults → lower approval).  
    - **Threshold-Invariance**: Holds across cutoffs (calibration is a property of scores, not decisions).  
    - **Non-Gameability**: Hard to fake without improving risk prediction (e.g., scaling scores breaks calibration).  
  - **Falls Short On**:  
    - **Baseline-Invariance**: Requires choosing a reference group for comparisons. Mitigate by testing all pairwise group differences.  
    - **Measurement-Robustness**: Noisy group labels weaken calibration tests. Mitigate by widening confidence intervals or using uncertainty-aware metrics.

  **What You’re Betting Against**  
  - **Risk**: Calibration can hide **allocation harm**. Example: A model could assign Group A to higher-risk bins (e.g., scores capped at 700) even if their true risk is low, reducing approvals. Calibration would pass if default rates match predictions within bins, but the model denies credit to qualified Group A applicants.  
  - **Mitigation**: Pair calibration with:  
    1. **Demographic parity checks**: Flag if approval-rate disparities exceed 80% (EEOC rule-of-thumb).  
    2. **Feature audits**: Ensure no protected attributes (e.g., ZIP code) directly influence scores.  
    3. **Sensitivity analysis**: Test calibration stability under group-label perturbations.  

  ---

  ### Summary  
  - **Core Requirements**: Observability, Measurement-Robustness, Threshold-Invariance, Non-Gameability, Business-Necessity Alignment.  
  - **Impossibility**: Observability + Business-Necessity force abandoning Strict Error-Rate Balance.  
  - **Criterion**: **Calibration by Group** (with demographic parity and feature audits as safeguards).  
  - **Trade-off**: Tolerates allocation harm risk to satisfy Observability and Business-Necessity.  

  This approach delivers an auditable, operationally feasible standard—not a philosophical ideal. It ensures the model’s risk predictions are equally trustworthy for all groups, while allowing business-driven decisions.
