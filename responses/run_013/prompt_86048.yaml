      - *Status*: Genuine requirement.

   5. **Respect for Legal Distinction (Requirement: Legal-Compliance)**:
      - *Demand*: The criterion must align with the legal framework that distinguishes between disparate treatment (intentional) and disparate impact (unjustified adverse effect). In particular, it should allow for a business-necessity defense for policies that are facially neutral but have a disparate impact.
