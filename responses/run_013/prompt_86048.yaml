      - *Status*: Genuine requirement in our setting.

   2. **Robustness to Measurement Error in Protected Attributes (Requirement: Measurement-Robustness)**:
      - *Demand*: The criterion must be well-defined and not overly sensitive when the protected attribute is measured with error (as in our imputed race/ethnicity).
      - *Motivation*: If a criterion is highly sensitive to small errors in group assignment, then our fairness assessment might be driven by noise. For example, if we use a criterion that requires exact group membership and our imputation has 10% error, we might falsely flag a model as unfair (or clear an unfair one) due to the noise.
