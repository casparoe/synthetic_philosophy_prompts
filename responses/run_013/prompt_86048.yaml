     The criterion we choose: Calibration by group on the approved set, and the model must not use the protected attribute.

     This meets:
        - Observability: we can compute on approved.
        - Measurement-Robustness: we use bins and tolerance.
        - Stability: calibration is about the score, not the threshold.
        - Baseline-Invariance: we check each group separately.
        - Legal-Compliance: by not using protected attribute (avoiding disparate treatment) and by calibration (ensuring that the score reflects the same risk for everyone, so any disparate impact might be justified).
        - Non-Gameability: we require that the model is calibrated inherently (not by post-hoc tuning) and that the protected attribute is not used. We enforce this by code review or by requiring that the vendor provides the model without post-processing for the fairness test.
        - Decidability: we set a tolerance and then pass/fail.

     We give up: 
        - The ability to detect miscalibration on the entire population if the selection into approved is biased in a way that masks the miscalibration. 
        - We also give up on requiring that the approval rates are not too different (disparate impact) because we don't require score distribution similarity. But note: if the model is calibrated on the entire population, then the approval rate difference is justified by base rate differences. However, we don't know if the model is calibrated on the entire population.

     This is the best we can do.

     Therefore, we commit to this criterion.
