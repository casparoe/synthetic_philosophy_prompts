  Some might think infinite regresses are acceptable (should challenge with "what actually does the unifying?"). 
  Others might suggest relations self-unify (need to show this begs the question).

  For the climax - the question "What makes the difference between a list and a unified proposition?" should make them feel the demand. And must explicitly rule out diving into truthmaker theory or process metaphysics today - those are rabbit holes for another session.

  The structure should build tension: 
