prompt: |-
  I sit on the investment committee of a small endowment, and a few times a month we are asked to join — or to bet against — positions that a great many other institutions already hold: a crowded currency trade, a sector everyone has piled into, a settled view of where rates are going. We have to decide within a day, only the three of us sign off, and none of us is a specialist in the underlying markets, so I need a procedure I can actually run rather than an essay on herd behaviour. Please build me one, in order: the questions to ask, what counts as a sufficient answer to each, where the procedure stops with a decision, and where it hands the judgment back to us because the question is about our own risk tolerance rather than about the world.

  The distinction I care about most is between three things that look identical from the outside. First, a crowd in which each member independently saw something — many private signals, correlated only because we are all reading the same public data. Second, a crowd in which the later arrivals are simply acting on what the earlier ones did, so that real private information is being discarded; the theory says such a crowd should be fragile, reversible by a surprisingly small amount of new public evidence. Third, a crowd that is imitating in order to avoid looking foolish, which carries no information at all. The procedure has to separate these three, and to specify what evidence would actually distinguish them — in particular, whether the earliest movers had strong private reasons, and whether a small, publicly checkable piece of contrary evidence would make the crowd reverse.

  Then run it on three cases: a crowded consensus that a particular government's bonds are safe; a consensus that a company's earnings will keep growing, where the first few analysts demonstrably had real private information; and our own largest current position, which the committee loves. At least one verdict should be one I will not like. Where the procedure reaches a verdict, state what single observation would overturn it, and be explicit about the steps where the reasoning is most likely to fail or where two of the tests disagree and the procedure cannot settle the case.

  Give me the procedure in prose, then a JSON object with one entry per case, using these fields: 'case'; 'diagnosis', one of independent-signals, information-cascade, reputational-imitation, or undetermined; 'fragility', high, medium, or low; 'action', one of join, fade, wait, or gather-more-private-signal; 'key_uncertainty'; and 'what_would_flip_this'.
reasoning: |-
  We are building a procedure to diagnose the nature of a crowded trade and decide on an action. The procedure must distinguish among:
  1. Independent signals (each member of the crowd acted on their own private signal, which are correlated because of public data) -> not necessarily fragile.
  2. Information cascade (later arrivals ignore their private signals and follow the early movers) -> fragile to a small amount of new public evidence.
  3. Reputational imitation (imitating to avoid looking foolish) -> carries no real information and is fragile.

  The procedure is a series of questions. We stop when we have a clear diagnosis or when we need to make a judgment call (risk tolerance).

  **Procedure in Prose:**

  1. **Question 1: What is the origin of the trade?**
     - *Ask:* How did the trade start? Who were the first movers and what was their reasoning?
     - *Sufficient answer:* We can identify the first few participants and their stated reasons (from public records, reports, or known market events). If we cannot, then we must gather more information or move to the next step with uncertainty.
     - *Why:* To see if the early movers had strong private signals or if they were acting on public information.

  2. **Question 2: What is the nature of the information that drove the early movers?**
     - *Ask:* Did the early movers have access to private, hard-to-get information, or was their decision based on public data?
     - *Sufficient answer:* If we can establish that the early movers had access to unique private information (e.g., proprietary research, insider knowledge, specialized expertise), then that points toward independent signals (if the crowd built gradually with others also having private signals) or an information cascade (if later followers did not have private signals). If the early movers were only reacting to public data, then the crowd might be built on public information and not necessarily fragile (unless the public data was misinterpreted).
     - *Why:* To distinguish whether the core of the trade is based on solid private information or public data.

  3. **Question 3: How did the crowd form?**
     - *Ask:* Are there signs that later participants ignored their own private signals? (For example, did they join despite having contradictory private information? Or did they join without doing their own analysis?)
     - *Sufficient answer:* Look for evidence such as:
        - Reports from participants that they joined because others did (e.g., "momentum", "following the smart money").
        - A surge in participation without corresponding new public information.
        - Studies or analyses that show the trade became popular without fundamental justification.
     - *Why:* To detect an information cascade (where private signals are discarded) or reputational imitation.

  4. **Question 4: Is there evidence of herding for reputational reasons?**
     - *Ask:* Are participants known to imitate the crowd to avoid standing out? (This is common in industries where career risk is high.)
     - *Sufficient answer:* Look for statements or behavioral patterns that suggest fear of being wrong alone. For example, if a fund manager says they are in the trade because "you can't be fired for owning [the popular asset]". If such evidence is strong, then it points to reputational imitation.

  5. **Question 5: What is the reaction to small pieces of contrary public evidence?**
     - *Ask:* Has there been any recent minor negative news that caused a disproportionate reaction? Or, if not, what would be a small piece of contrary evidence that we can observe?
     - *Sufficient answer:* If we observe that a small negative piece of news caused a significant reversal, that suggests high fragility (indicative of information cascade or reputational imitation). If the trade has weathered minor negative news without much movement, that suggests lower fragility (independent signals).

  6. **Decision Steps:**
     - If we determine that the crowd is based on independent signals (each acting on their own private information, even if correlated) and the trade has held up to minor negative news, then fragility is low. We might consider joining if our risk tolerance allows and we have a positive view, or fading if we think the trade is overdone but note that it's not fragile.
     - If we find an information cascade (early movers had private signals but later ones followed without private information), then fragility is high. We should be cautious and might fade the trade or wait for a catalyst. A small piece of contrary evidence could reverse it.
     - If we find reputational imitation, then fragility is high and the trade has no real information value. We should fade or avoid.
     - If we cannot determine (due to lack of information), then we must either wait and gather more private signals (if feasible and within our risk tolerance) or decide based on our risk appetite.

     The procedure stops when:
     - We have enough information to classify and then we assign an action (join, fade, wait, gather-more-private-signal).
     - Or we hit a point where the information is insufficient and we must rely on our own risk tolerance (then we hand it back to the committee).

  **Key Uncertainties and Flip Triggers:**
     - For any diagnosis, we must state a key uncertainty and what observation would flip the diagnosis.
     - The procedure is most likely to fail at steps where we cannot get reliable information about the early movers or the participants' private signals. Also, when two tests point in different directions (e.g., early movers had private signals but the crowd formation shows reputational imitation) we might have an undetermined case.

  **Now, apply to three cases:**

  Case 1: A crowded consensus that a particular government's bonds are safe.
  Case 2: A consensus that a company's earnings will keep growing, where the first few analysts demonstrably had real private information.
  Case 3: Our own largest current position, which the committee loves.

  We must give at least one verdict that the committee will not like.

  ---

  **Case 1: Crowded consensus that a particular government's bonds are safe.**

  - **Question 1:** The trade likely started with a few large institutions (e.g., central banks, sovereign wealth funds) that have long held these bonds as safe havens. The origin is public: the country's historical stability and credit rating.
  - **Question 2:** Early movers? Probably based on public data (country's economic indicators, ratings). Not much private information.
  - **Question 3:** How did the crowd form? Many institutions followed because these bonds are considered "risk-free" and are part of benchmarks. Later participants (e.g., pension funds) hold them for regulatory or index-tracking reasons, not necessarily because of private signals. This suggests some reputational imitation (holding because everyone does) and some information cascade (ignoring potential risks).
  - **Question 4:** Reputational reasons? Yes, because holding these bonds is standard and deviating is risky for a fund manager's career.
  - **Question 5:** Reaction to contrary evidence? If a small negative event (e.g., a minor budget delay) causes a disproportionate sell-off, that would indicate high fragility. But if the bond market has been resilient to minor bad news, then fragility might be low. However, in recent history, we have seen that even small negative news in traditionally safe countries (like the US or Germany) does not cause big moves, but in more vulnerable countries (like Italy) it might.

  Diagnosis: Likely a mix of independent signals (based on public data) and reputational imitation. But note: the independent signals are weak because they are public. The reputational part dominates. 

  Fragility: High, because if a small piece of bad news hits and causes a few large players to sell, the rest might follow without new information.

  Action: Fade (avoid or reduce exposure) because of high fragility.

  Key uncertainty: The true fiscal health of the government. What would flip this? A small downgrade by a rating agency leading to a sharp sell-off.

  ---

  **Case 2: Consensus that a company's earnings will keep growing, with the first few analysts having real private information.**

  - **Question 1:** The trade started with a few analysts (or funds) that had private information (e.g., through industry contacts, proprietary data) and issued strong buy recommendations.
  - **Question 2:** Early movers had private information. This is given.
  - **Question 3:** How did the crowd form? After the early movers, others followed. We must check: did later analysts and funds do their own research? If they did, then it's independent signals. If they just followed the early calls without new information, then it's an information cascade. Given that it's a crowded trade, it's likely that many followed without private signals.
  - **Question 4:** Reputational reasons? Possibly, because if the company is a darling, analysts might be afraid to issue a sell. But we are told the first few had real information.
  - **Question 5:** Reaction to contrary evidence? If there's a small earnings miss or a slight guidance reduction, does the stock crash? If yes, then high fragility.

  Diagnosis: The early movers had private signals, but the crowd that formed later might be an information cascade (if they ignored their own signals) or independent (if they confirmed with their own research). Without evidence of widespread independent research, we lean toward information cascade.

  Fragility: High, because the crowd after the early movers might not have strong convictions.

  Action: Wait or fade. We don't join because it's crowded and fragile. Alternatively, if we can get private signals that confirm, we might gather more.

  Key uncertainty: The strength of the company's future earnings. What would flip this? A small negative earnings surprise causing a sharp drop.

  ---

  **Case 3: Our own largest current position, which the committee loves.**

  We must be critical. This is the one the committee won't like.

  - **Question 1:** How did the trade start? We were likely early movers or joined based on our own analysis. But we must check: did we have private information or was it public?
  - **Question 2:** Nature of our information? If we had private signals, then it's independent. But if we followed others, then it might be an information cascade. The committee loves the position, so we might be biased.
  - **Question 3:** How did the crowd form? If we were early and others followed, then we need to see how they formed. If the position is now crowded, it's possible that an information cascade occurred.
  - **Question 4:** Reputational reasons? We might be holding because we don't want to be wrong alone, or because the position is popular. But we are on the committee and we are not career-risk-averse? We must be honest: if we are holding because we don't want to admit being wrong, that's reputational.
  - **Question 5:** Has there been any minor negative news? If the position has held up, it might be robust. But if it hasn't been tested, then fragility is unknown.

  Diagnosis: We must be cautious. If we joined early on private signals, then it might be independent. But if the crowd that followed did so without private signals, then our position being crowded might make it fragile. Also, we might be suffering from confirmation bias. We must consider: are we holding for reputational reasons (we love it and don't want to change)? 

  Given that it is our largest and we love it, and if we cannot objectively assess, we might be in an undetermined state. However, note that the committee is not specialists and we built the position without deep expertise? So we might have been part of an information cascade.

  We'll say: if we cannot point to strong private signals that we had at the time, and the position is now crowded, it might be an information cascade.

  Fragility: High, because if we (the committee) are holding for reputational reasons (we don't want to be the first to sell) and others are too, then a small negative event could cause a rush for the exit.

  Action: Fade (reduce the position) because of high fragility and the risk of an information cascade.

  Key uncertainty: The true fundamental value of the position. What would flip this? A small negative public report that causes a sharp decline.

