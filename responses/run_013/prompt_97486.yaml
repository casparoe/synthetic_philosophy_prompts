answer: |-
  ### Diagnostic Procedure for Crowded Trades

  **Procedure Overview**:  
  A 5-step decision tree. Stop at any step if a diagnosis is clear or if the question requires your risk tolerance. Steps 1–3 screen for evidence of independence, cascades, or imitation; Steps 4–5 assess fragility and action. If conflicting answers arise at any step, default to "undetermined" and hand back to the committee.

  **Questions, Sufficient Answers, and Exit Points**:
  1. **What triggered the *earliest* movers?**  
     - *Sufficient answer*: Clear evidence (e.g., filings, credible reports) of unique private signals (e.g., proprietary data, exclusive access) for the first 1–3 major entrants.  
     - *Insufficient answer*: Vague or public catalysts (e.g., "strong GDP report," "rising sector demand").  
     - *Exit if*: Early movers had strong private signals → lean toward *independent-signals*. If not, proceed to Step 2.  

  2. **Is there evidence latecomers *discarded private signals*?**  
     - *Sufficient answer*: Data showing later entrants acted contrary to their historical patterns (e.g., a value fund buying overvalued assets) or admissions of momentum-chasing (e.g., "keeping up with peers").  
     - *Insufficient answer*: No data on latecomer behavior.  
     - *Exit if*: Yes → *information-cascade*. If no, proceed to Step 3.  

  3. **Could participants face reputational harm for *not* joining?**  
     - *Sufficient answer*: Industry-specific incentives (e.g., benchmark-hugging in pensions, "career risk" in asset management) or explicit statements avoiding contrarianism.  
     - *Insufficient answer*: No clear link to reputation.  
     - *Exit if*: Yes → *reputational-imitation*. If no, proceed to Step 4.  

  4. **Has a minor public shock (≤3% price move) caused *disproportionate* reversal?**  
     - *Sufficient answer*: Historical data showing >5% price reversal on small news (e.g., a single weak earnings report unraveling a sector bet).  
     - *Insufficient answer*: No recent shocks or ambiguous reactions.  
     - *Exit if*: Yes → fragility = *high*. If no, fragility = *low/medium*. Proceed to Step 5.  

  5. **Action rule (given diagnosis and fragility)**:  
     - *Independent-signals + low fragility* → **join** (crowd is rational).  
     - *Information-cascade/reputational-imitation + high fragility* → **fade** (bet against).  
     - *Undetermined or medium fragility* → **wait** (1–2 weeks) or **gather-more-private-signal** (if feasible in 24hrs).  
     - *Hand back if*: Risk tolerance dominates (e.g., position size conflicts with endowment policy).

  **Key Failure Points**:  
  - Step 2 vs. Step 3 conflict (e.g., evidence of *both* signal-discarding and reputational pressure) → "undetermined."  
  - Step 4 ambiguity (e.g., no recent shocks to test fragility) → overreliance on theory.  
  - "Gather-more-private-signal" may be impractical for non-specialists → forces a judgment call.

  ---

  ### Case Analyses (JSON Format)

  ```json
  [
    {
      "case": "Crowded consensus that a particular government's bonds are safe",
      "diagnosis": "reputational-imitation",
      "fragility": "high",
      "action": "fade",
      "key_uncertainty": "Whether the government's fiscal health is deteriorating silently.",
      "what_would_flip_this": "A minor credit-rating outlook change (e.g., from 'stable' to 'negative') causing >5% yield spike."
    },
    {
      "case": "Consensus that a company's earnings will keep growing (early analysts had private information)",
      "diagnosis": "information-cascade",
      "fragility": "high",
      "action": "fade",
      "key_uncertainty": "Whether latecomers validated growth with proprietary analysis or followed blindly.",
      "what_would_flip_this": "A small earnings beat (<2% above consensus) failing to lift the stock price."
    },
    {
      "case": "Our own largest current position (committee loves it)",
      "diagnosis": "undetermined",
      "fragility": "medium",
      "action": "gather-more-private-signal",
      "key_uncertainty": "Whether our initial entry relied on independent insight or groupthink.",
      "what_would_flip_this": "Evidence that 3+ recent entrants joined solely because of our endorsement."
    }
  ]
  ```

  **Critical Notes**:  
  - **Case 1 (Bonds)**: Diagnosis relies on Step 3 (reputational harm for *not* holding "safe" assets). Flipped by minor negative news due to high fragility.  
  - **Case 2 (Earnings Growth)**: Early private signals (Step 1) but Step 2 suggests latecomers discarded signals → fragile cascade. Action "fade" may be unpopular if the committee is bullish.  
  - **Case 3 (Your Position)**: "Undetermined" due to conflict: Early movers (you) may have had signals (Step 1), but love for the position risks Step 3 (reputation). Forces self-scrutiny.  
  - **Why Fail?**: Cases 1 and 2 hinge on inferring others' motives (Steps 2–3) without direct data—theory fills gaps. Case 3 is flipped if you uncover self-deception about your initial rationale.
