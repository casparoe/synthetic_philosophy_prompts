prompt: |-
  I'm midway through a dissertation chapter on the normativity of attitudes — half of it on value, half on belief — and I keep running into the same move in the literature and in my reading group. Someone lays out the problem of the wrong kind of reasons: a consideration can give you a reason to be in an attitude without bearing at all on whether the attitude is correct, or fitting, or warranted. The stock illustration is a threat — a powerful being will punish you unless you admire him, or unless you believe some falsehood — and the verdict is that this gives you a reason of the wrong kind. Then, instead of saying what makes a reason the right kind, everyone reaches for a label: object-given versus state-given, fittingness versus desirability, a reason for the attitude versus a reason for the state of having it. I want to stop before the labels. Please fix the purpose as follows: the account has to be strong enough that I could use it to defend a fitting-attitude analysis of value — the view that for something to be valuable is just for it to be fitting to value it — against this objection without begging the question, and general enough that I could run the same machinery for emotions and for belief, not just for admiration and desire.

  So write me the desiderata: the requirements any adequate account of the right-kind/wrong-kind distinction has to meet. For each one, give me the case or the consideration that motivates it, and keep the requirements separate where they really are separate. Some of what I expect to see, though I'd rather you tell me what belongs on the list than fill in mine: the cases it has to classify correctly (the threat case; a consideration that does bear on the merit of the object or the fittingness of the attitude; ordinary evidence for belief; the awkward middle cases where a consideration looks wrong-kind for one attitude and right-kind for another formed on its basis); the distinctions it may not collapse, including the one between a class of considerations and a class of support-relations, since the same consideration can be right-kind for one attitude and wrong-kind for another, and the one between an attitude's not being fitting and its not being permissible or required; and the phenomenon that whatever else is true, the threat does seem to give me some reason to do something, so the account cannot simply declare wrong-kind reasons normatively inert. Add the theoretical constraints: it must not characterize the right kind of reason in terms of value or fittingness if value is what it is supposed to ground; it has to be consistent with whatever general theory of reasons it is paired with; it should be neutral about whether fittingness is primitive or analysable; it should explain why this is a problem at all, that is, what would actually be lost if the distinction collapsed; and it should give a unified treatment across belief, emotion, desire and admiration rather than four unrelated criteria. Say also whether the account has to take a stand on whether there are any right-kind reasons for attitudes in the first place.

  A handful of cases I have been turning over, which I don't think are the standard ones, and I'd like you to say which the account must get right and which are merely optional pressure tests: an agent who by stipulation can form beliefs at will, so that we can ask whether the distinction is about what attitudes can be reasons-responsive or is a normative distinction that survives even under the stipulation; a reason to have a reason, as when you are told that if you acquire a reason to admire someone, something good will follow; a reason to have had an attitude in the past, say to have been grateful at the time; an institutional attitude, where a committee's bylaws require it to have confidence in a colleague, so the bylaw is the reason for the confidence; and reasons to admire a fictional character, where there is no object to have merit in the ordinary way. Then, on the list itself: mark which requirements are non-negotiable and which are commitments of particular camps; flag any pair you suspect cannot be jointly satisfied and say what would have to give; and tell me which single requirement does the most to narrow the field of otherwise plausible accounts. Throughout, separate what is settled from what is genuinely contested among people who work on this, don't present a contested reading of the distinction as if it were the consensus — including where my own framing above already presupposes one — and be explicit about the points at which your answer is a judgment call rather than a report of agreement.
reasoning: |-
  Okay, the user is working on a dissertation chapter about the normativity of attitudes, specifically the distinction between right-kind and wrong-kind reasons (RKRs vs. WKRs). They're frustrated with how the literature handles this—often just labeling the distinction without explaining it. They want desiderata for an adequate account of this distinction that can defend a fitting-attitude analysis of value and apply across attitudes like belief, emotion, desire, and admiration.

  The user has several key requirements. First, any account must correctly classify classic cases like the threat scenario (WKR) and ordinary evidence for belief (RKR). It also needs to handle boundary cases, like reasons that are WKR for one attitude but RKR for another (e.g., evidence supporting belief but not admiration). The account mustn't collapse important distinctions—like between considerations and support relations, or between an attitude not being fitting versus not being permissible. 

  The user also highlights theoretical constraints. The account can't define RKRs in terms of value or fittingness if it's meant to ground value via fitting-attitude analysis. It needs compatibility with general theories of reasons, neutrality on fittingness's primitiveness, and a unified treatment across attitudes. Plus, it must explain why losing this distinction matters—what theoretical cost would follow if RKRs and WKRs weren't separated.

  They provided some non-standard cases to test the account, like agents who can form beliefs at will (testing if the distinction is normative rather than psychological), reasons to have reasons, past-directed reasons, institutional attitudes, and reasons to admire fiction. These are optional pressure tests, not core requirements, but handling them well would strengthen the account.

  The desiderata need to be clearly separated. For each, I'll note the motivating case and whether it's non-negotiable. Non-negotiables include correct classification of paradigmatic cases and avoiding question-begging definitions. Theoretical neutrality (e.g., on fittingness's status) is important but might be debated. 

  A big challenge is avoiding circularity: defining RKRs without invoking value or fittingness, since the account is meant to ground value via fitting-attitude analysis. This might require structural or formal criteria. The distinction between considerations and support relations is also crucial—the same consideration (e.g., "it will make me happy") could be WKR for admiration but RKR for desire.

  The hardest requirement might be unifying the account across different attitudes while respecting their differences. Belief and admiration have different "correctness" conditions (truth vs. merit), so a one-size-fits-all approach could fail. Yet the desiderata demand a common framework, which might require abstracting to a high level.

  Boundary cases like the "reason to have a reason" are tricky. If you're told acquiring a reason to admire someone leads to good outcomes, is that a RKR or WKR? This tests whether the account can handle higher-order reasons without collapsing distinctions.

  I'll also note where the field agrees versus disputes. For example, most agree threat cases are WKRs, but there's less consensus on how to define RKRs. Some think the distinction is fundamental; others try to reduce it. The user's framing assumes the distinction is real and important, which isn't universally accepted—some skeptics argue WKRs are just practical reasons for wanting an attitude.

  Finally, I'll highlight that RKRs aren't necessarily overriding—you might have strong WKRs that make an attitude permissible even if unfitting. This preserves the idea that WKRs have normative force without conflating them with fittingness.
answer: |-
  Here are the desiderata for an adequate account of the Right-Kind/Wrong-Kind Reasons (RKR/WKR) distinction, structured to meet your requirements. I distinguish non-negotiable constraints (essential for any viable account) from contested/optional ones, flag tensions, identify key motivators, and address your cases explicitly.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Correct Classification of Paradigm Cases**  
     - *Motivating Cases*:  
       - **Threat Case** (WKR): "Admire me or I'll hurt you" / "Believe 2+2=5 or I'll torture you."  
       - **Merit-Based Case** (RKR): "The person saved orphans selflessly" (reason for admiration); "This evidence supports p" (reason for belief).  
     - *Why Non-Negotiable*: Any account failing here is definitionally inadequate.  
     - *Theoretical Constraint*: Must hold across belief, emotion, desire, admiration.

  2. **Non-Circularity for FA-Analysis of Value**  
     - *Requirement*: Cannot characterize RKR *in terms of value* or *fittingness* if FA-analysis claims "X is valuable iff it is fitting to value X."  
     - *Motivation*: Avoids begging the question against WKR objections to FA-analysis.  
     - *Judgment Call*: Some FA-theorists accept circularity (e.g., fittingness as primitive), but **your constraint rules this out**.

  3. **Distinction Between Fittingness and Permissibility**  
     - *Motivation*: Threat cases give reasons to *adopt* an attitude (making it permissible/all-things-considered required) but not reasons showing it *fits* its object.  
     - *Case*: The demon threat makes believing 2+2=5 *rational* but doesn’t make it *true*.  
     - *Non-Negotiable*: Collapsing this collapses the WKR problem itself. Accounts must explain why RKR relate to *correctness* while WKR relate to *pragmatic permissibility*.

  4. **Normative Significance of WKRs**  
     - *Requirement*: Must acknowledge WKRs as genuine (often practical) reasons *to bring about* the attitude-state.  
     - *Case*: The threat *does* give a reason to (try to) admire/believe.  
     - *Why Essential*: Denying this misdiagnoses WKRs as non-reasons, ignoring their normative force.

  5. **Cross-Attitude Generality & Unity**  
     - *Requirement*: Same core machinery must apply to belief (correct = true), admiration (correct = admirable), fear (correct = fearsome), etc.  
     - *Motivation*: Your project demands a unified normative framework for attitudes.  
     - *Non-Negotiable*: Ad-hoc solutions (e.g., one account for belief, another for desire) fail your goal.

  6. **Separation of Considerations vs. Support Relations**  
     - *Requirement*: Must allow that the *same consideration* can be RKR for one attitude and WKR for another.  
     - *Key Case*:  
       - "Learning this will make me happy" is:  
         - **WKR** for believing it (if irrelevant to truth).  
         - **Potentially RKR** for *desiring* to learn it (if happiness makes desire fitting).  
     - *Why Non-Negotiable*: Shows the distinction is about *how* a reason supports an attitude, not the reason's content alone.

  ---

  ### **High-Priority Desiderata (Widely Expected, But Contested in Some Camps)**
  7. **Handling "Awkward Middle" Cases**  
     - *Requirement*: Explain reasons that seem WKR for attitude A but RKR for attitude B *based on A*.  
     - *Case*: "Believing p will make me happy" is:  
       - **WKR** for believing p (if unrelated to truth).  
       - **RKR** for *desiring to believe p* (if happiness makes desire fitting).  
     - *Pressure Test*: Tests whether the account captures the attitude-relativity of "right-kindness."

  8. **Theoretical Neutrality**  
     - *Requirement*: Compatible with both primitivist and reductivist views of fittingness, and with major theories of reasons (e.g., Humean, Kantian, realist).  
     - *Motivation*: Needed for broad defense of FA-analysis.  
     - *Tension Alert*: Hard to reconcile with non-circularity (Desideratum 2); may require a structural/formal criterion.

  ---

  ### **Boundary Cases: Must-Handle vs. Pressure Tests**
  | **Case**                          | **Status**               | **Why**                                                                 |
  |-----------------------------------|--------------------------|-------------------------------------------------------------------------|
  | **Agent forming beliefs at will** | Must-Handle              | Tests if distinction is *normative* (survives stipulation) vs. psychological. |
  | **Reason to have a reason**       | Must-Handle              | E.g., "If you acquire a RKR to admire X, you get $1M." Tests whether higher-order reasons inherit "kind." |
  | **Past-directed reasons**         | Important Pressure Test  | E.g., reason to *have been* grateful. Tests temporal neutrality of account. |
  | **Institutional attitudes**       | Optional Pressure Test   | Bylaw as reason for "confidence" tests if social facts can generate RKRs. |
  | **Fictional characters**          | Must-Handle              | "Reason to admire fictional hero" tests object-independence of fittingness. |

  ---

  ### **Theoretical Constraints & Tensions**
  9. **Explanation of the Distinction's Significance**  
     - *Requirement*: Must explain what is lost if RKR/WKR collapse (e.g., FA-analysis fails; correctness conditions become reducible to desirability).  
     - *Settled Point*: All parties agree collapse undermines FA-analysis and "attitude-relative correctness."  
     - *Contested*: Whether this is a *cost* (e.g., reductivists like Markovits may welcome it).

  10. **Neutrality on Existence of RKRs**  
      - *Requirement*: Should not *presume* RKRs exist (e.g., error theorists about normativity must be accommodated).  
      - *Judgment Call*: Your project likely assumes RKRs exist, but the account shouldn't build this in definitionally.

  ---

  ### **Key Tensions & Judgment Calls**
  - **Major Tension**: **Non-Circularity (2)** vs. **Unity (5)** vs. **Theoretical Neutrality (8)**.  
    - *Why*: A non-circular, unified account likely requires a formal criterion (e.g., "reasons that bear on the object's properties"), but this risks being too vague or content-sensitive.  
    - *What Must Give*: May need to accept that "fittingness" is a primitive *relation* (not property), defined by its role across attitudes.

  - **The Hardest Requirement**: **Non-Circularity (2)**.  
    - *Why*: Most intuitive accounts (e.g., "RKRs are those that make the attitude fitting") directly violate it. This eliminates many popular proposals (e.g., Sharadin’s "end-relational" view).  
    - *Narrows the Field*: Favors accounts like:  
      - **Constitutive Aim** (RKRs bear on success of attitude's constitutive goal: truth for belief, admiration for value).  
      - **Formal Object** (RKRs bear on the formal object of the attitude: e.g., fearsome for fear).  
      - **Non-Object-Given Reductions** (e.g., Schroeder’s "wrong kind of reasons problem" as a scope fallacy).

  - **Contested vs. Settled**:  
    - **Settled**: WKRs exist and are distinct from RKRs; threats are WKRs; RKRs relate to correctness.  
    - **Contested**: Whether the distinction is fundamental (e.g., Hieronymi) or reducible (e.g., Schroeder); whether "state-given" always = WKR.

  ---

  ### **Synthesis for Your Project**
  - **Non-Negotiable Core**: 1, 2, 3, 4, 5, 6.  
  - **Critical Pressure Test**: Belief-at-will cases (proves normativity isn't psychological) and fictional objects (tests object-independence).  
  - **Avoid**: Accounts that define RKR as "reasons from the point of view of the attitude" – this risks circularity for FA-analysis.  
  - **Promising Path**: A **constitutive aim** account (e.g., Velleman for belief, Scanlon for attitudes) meets most desiderata if "aim" is characterized structurally (e.g., "belief is constitutively regulated for truth").  
  - **Biggest Threat**: If non-circularity (2) forces primitivism about "bearing on correctness," this may weaken the reductive ambitions of FA-analysis.

  This framework ensures your account defends FA-analysis without question-begging, handles belief/emotion symmetrically, and respects the normative force of WKRs. The toughest trade-off remains circularity vs. unity – but that’s where your original contribution lies.
