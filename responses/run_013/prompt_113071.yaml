prompt: |-
  I keep running into the claim that an action has moral worth only when it is done for the right reasons. I take the reason-for-which to be whatever consideration actually moves the agent, and the right reasons to be the features of the situation that make the action right — that it relieves someone's pain, that it keeps a promise. Here is where I get stuck. If acting for the right reasons means being moved by those right-making features themselves, and features of a situation are not the sort of thing that can move anyone (only an agent's beliefs and desires do that), then it looks as though no action could ever be performed for the reasons that make it right. On that reading the condition is unsatisfiable, and moral worth, at least as that condition defines it, is a fiction. So: is the notion incoherent, or is there a way to rescue it? And if it can be rescued, what should I say about someone who does the right thing but is moved only by the prospect of feeling good about herself — has she acted for the right reasons or not? Finally, tell me where this line of reasoning is most likely to break down and what would lead you to a different verdict.
reasoning: |-
  Okay, let me try to unpack this user's question. They're grappling with the idea that moral worth requires acting for the right reasons. They define "reasons-for-which" as the considerations that actually motivate the agent, and "right reasons" as the features that make an action right, like relieving pain or keeping a promise. 

  Hmm, their main stumbling block is this: if right-making features (like pain itself) can't directly motivate anyone—since only mental states like beliefs and desires can—then acting for the right reasons seems impossible. That would make moral worth a fiction. They want to know if this is incoherent or if there's a way out. They also bring up a case where someone acts just to feel good about themselves, asking if that counts as acting for the right reasons.

  First, I need to address their metaphysical concern. They're right that abstract features don't move people; it's always via the agent's mental states. But the solution isn't to abandon the idea—it's to reframe "acting for the right reasons" as responding to those features *through* accurate beliefs. For example, helping because you *believe* someone is in pain and *desire* to relieve it. That bridges the gap between external facts and internal motivation.

  The user's example of acting for self-satisfaction is a classic problem. Kant’s shopkeeper comes to mind—someone honest just to maintain their reputation. That lacks moral worth because the motive isn't the rightness itself but a side benefit. So, the key is whether the right-making features are the *primary* motivation. If the person helps mainly to feel good, it's instrumentally good but not morally worthy. If they help because they recognize the pain and care about alleviating it, that’s different.

  Where might their reasoning break down? Probably in conflating the *content* of motivation with its *object*. The content is the proposition (e.g., "this relieves pain"), which represents the right-making feature. The object is what the desire is directed toward (e.g., the relief itself). So long as the agent’s desire is oriented by that content, they’re acting for the right reason. 

  Also, they might be underestimating how we naturally attribute motives. We constantly say things like, "She did it because it was just," without worrying about metaphysical gaps. Moral psychology operates at the level of reasons, not brute causality. 

  Their underlying worry might be skepticism about moral worth as something real. But rescuing it doesn’t require metaphysics—just a plausible account of how reasons function in motivation. The alternative (denying moral worth) feels unsatisfying; we intuitively judge motives differently. 

  The user seems philosophically adept, so I’ll avoid oversimplifying. They’ve spotted a genuine tension, but the solution lies in intentional psychology. I should emphasize the "content" distinction and why self-interested motives fall short. Also, note that hybrid motives exist—someone might care about both pain and feeling good. Moral worth isn’t all-or-nothing but turns on whether the right reason is dominant.
answer: |-
  Your reasoning spotlights a genuine philosophical tension, but the notion of "acting for the right reasons" can be rescued—though it requires careful distinctions. Let's break this down step-by-step:

  ### 1. **Rescuing "Acting for the Right Reasons"**
     - **The Problem Restated**: You're correct that abstract features (e.g., "pain relief") can't *causally* motivate an agent. Only psychological states (beliefs, desires) can. This seems to make acting *directly* for right-making features impossible.
     - **The Solution: Reasons as Represented in the Agent's Mind**  
       "Acting for the right reasons" doesn't require the right-making feature *itself* to be the causal force. Instead, it requires:
       - **Beliefs**: The agent must *believe* that the action instantiates a right-making feature (e.g., "This act relieves pain").
       - **Desires/Motivations**: The agent must be motivated *by that belief*—i.e., the right-making feature must be the *content* of their motivating reason.
       - **Non-Deviant Causal Chain**: The belief/desire pair must cause the action in the right way (e.g., not via accidental coincidence).

       *Example*: You help someone *because* you believe they’re in pain and you desire to relieve it. The right-making feature (pain relief) is represented in your psychology as your goal.

  ### 2. **The Self-Satisfaction Case**
     - **Acting for the Wrong Reason**: If someone helps *only* to feel good about themselves (e.g., "I’ll donate so I can post about it and feel virtuous"), they **fail** to act for the right reasons.  
       - **Why?** The *right-making feature* (e.g., alleviating suffering) isn’t their motivating reason. It’s merely a *means* to their true goal (self-satisfaction). The action is instrumentally good but lacks moral worth.
     - **Key Distinction**:  
       - ✅ **Right Reason**: Motivated *by* the right-making feature itself (e.g., "I relieve pain *because* it's bad").  
       - ❌ **Wrong Reason**: Motivated by a *contingent consequence* (e.g., "I relieve pain *because* it makes me feel good").  

  ### 3. **Where Your Reasoning Breaks Down**
     Your argument stumbles at this inference:  
     - **Premise**: Only mental states (beliefs/desires) can motivate.  
     - **Premise**: Right-making features are external facts.  
     - **Conclusion**: Therefore, no one can be motivated by right-making features.  
     
     **The Flaw**: This conflates *motivating causes* (mental states) with the *content* of motivation. While mental states are the *vehicles* of motivation, their *content* can directly represent right-making features. The agent *is* moved by the right-making feature—*as they represent it in their mind*.  

  ### 4. **A Different Verdict? The Hybrid-Motive Challenge**
     - **The Real Sticking Point**: What if someone has *mixed motives*? (e.g., "I help both to relieve pain *and* to feel good").  
       - **Kantian View**: Moral worth requires the right reason to be the *sole* motive ("duty for duty's sake"). Mixed motives lack worth.  
       - **Aristotelian/Consequentialist View**: Moral worth can be proportional. If the primary motive is the right-making feature, the act has partial worth.  
     - **My Verdict**: Pure self-interest undermines moral worth, but if the right-making feature is the *dominant* reason (e.g., "I mainly help to relieve pain; feeling good is a bonus"), the act can still have moral worth. The key is whether the right reason is *sufficient* for action—even if other motives are present.

  ### Why This Matters
  Denying moral worth entirely (as your initial worry suggests) clashes with deep intuitions: we *do* praise the humanitarian who acts from compassion more than the narcissist who acts for applause, even if their actions are identical. The distinction hinges on **why** the agent acts—captured by the content of their motivation, not just the outcome.

  **Key Takeaway**: "Acting for the right reasons" is coherent if we view right-making features as the *intentional content* of an agent's motivating psychological states. The self-satisfied agent fails this test—they act *because* of the feeling, not *because* of the right-making feature itself. The line breaks down only if we demand motivation by abstract facts *apart from* their psychological representation—a demand the theory need not make.
