prompt: |-
  So I'm taking this philosophy of death seminar and we just did Scheffler's afterlife thing — the idea that human extinction would be bad even if it killed nobody, because our projects and values only hold up against the background of a continuing human future. Our secondary reading (some popular-philosophy book, I forget which) sums it up like this: "Scheffler's point is that we're all secretly invested in humanity's survival the way religious people are invested in a personal afterlife — we need to believe something of us goes on. So extinction horrifies us not because of the deaths but because it's a kind of second death, the death of our own meaning. The upshot is that extinction is uniquely bad, worse than any comparable loss of life, and that this gives us a self-interested reason to care about the far future." I get the gist but something feels off and I can't tell if I'm just being picky. Can you go sentence by sentence and sort out whats actually Scheffler's view, what's just a loose popularization, and what he'd flat-out reject — and does the "uniquely bad / self-interested reason" part actually follow from anything he argues, or is the summary smuggling it in? I'd rather not walk away with a tidy answer I can't test: tell me what would have to be true, or what argument someone could make, to change your mind about which parts of the summary are fair, and where your reading of him is most likely to be wrong.
