prompt: |-
  ok so i keep going back and forth on this and i want to actually nail it down before i read anything else, because right now im just bouncing between two gut feelings. the question is: does a community owe it to the dead to keep remembering old wrongs, or is there a point where the healthy, adult thing is to let it go? both camps seem to just grab whichever example suits them — one side points at a genocide nobody is allowed to deny and says you cant just move on, the other points at two families feuding for three generations over something from 1890 and says look what the remembering did. i dont want a verdict yet, i want the spec first.

  so: what would a theory of this actually have to get right to be any good? by "this" i mean a theory of what we owe the past — when a group should keep a wrong alive in its memory, when its ok to let it fade, and who counts as owing what. give me the requirements list: the cases it has to handle, the distinctions it cant collapse, the facts about how memory actually works that it cant just ignore, with the case or fact behind each one. i want to know which of these are real requirements and which are just one camp's taste dressed up as a requirement. and if some pair of them cant both be satisfied at once, say so, because thats the part im most curious about — i suspect thats why the argument never ends.

  a few things ive been chewing on that i think probably have to show up somewhere, but you tell me if theyre actually load-bearing or if im overthinking:

  - can a group remember anything at all, or do only people remember, and "collective memory" is really just institutions telling stories to individuals?
  - apparently human memory is reconstructive — every time you recall something you also edit it a bit. so is "faithful memory" even a coherent thing to ask for, or are we asking for something that cant exist?
  - nothing rots online. archives and phones mean forgetting has to be actively engineered now, and some places have made a legal right to be forgotten. does that change the whole picture?
  - truth commissions that trade amnesty for testimony — is that remembering or is it buying silence with a receipt?
  - do the descendants of people who did something owe anything, or is guilt not something you can inherit?
  - toppling statues: is that forgetting, or is it a different kind of remembering?
  - in a country where nobody shares a history, whose memory are we even talking about?

  give it to me as a table with these columns and nothing else before it:

  Requirement | what it demands of any theory (what the theory has to be able to deliver) | the case or fact that forces it | bedrock or just one sides preference | which kind of view it knocks out

  then a second short table for the clashes:

  Pair of requirements | why they pull against each other | what a theory would have to give up to satisfy both

  then one or two sentences at the end saying which single requirement does the most work, i.e. the one that eliminates the most otherwise-plausible positions. please dont give me a reading list or names to go look up, i cant get online right now anyway and i dont want to just take your word for what some book says.
reasoning: |-
  Okay, the user is really wrestling with a deep philosophical question about collective memory and historical wrongs. They want to nail down a framework before getting swayed by more readings. The core tension is between preserving memory of past wrongs versus moving on for healing. 

  Hmm, they're clearly frustrated by how both sides cherry-pick examples—genocide vs petty feuds. Smart of them to ask for a "spec" first rather than jumping to answers. They listed several nuanced points they've been chewing on, showing they've done serious thinking.

  First, I need to structure this as they asked: two strict tables. The requirements table must cover all their bullet points plus essentials they might have missed. Key challenges: 
  - Defining if "collective memory" is even real (philosophy of mind meets sociology)
  - Handling how human memory actually works (reconstructive, fallible)
  - Digital immortality changing the game
  - Moral inheritance across generations
  - Statue removal as memory transformation, not erasure

  For clashes, the toughest will be Truthfulness vs Survivor Needs—truth commissions show this tension starkly. Also, Collective Agency vs Individual Memory is philosophically hairy.

  The user suspects unsolvable tensions make this debate endless. They're right. I'll highlight that in the clash table. 

  Most load-bearing requirement? Probably "Survivor Primacy." Ignoring it invalidates theories that prioritize abstract justice over living trauma. But it's also where most fights happen—some see it as special pleading.

  Gotta watch for: 
  - Not smuggling in my own bias as "bedrock"
  - Marking clearly when something is contested (e.g., inherited guilt)
  - Keeping examples concrete (Cambodia, Truth Commission, etc.)
  - Resisting urge to recommend readings since they're offline and want raw analysis

  User's tone is "frustrated but determined." They'd hate platitudes. Best to be ruthlessly systematic.
answer: |-
  Here's the requirements spec for a theory of what we owe the past, structured as requested. The "bedrock or preference" column marks whether a requirement stems from an empirically observable reality ("bedrock") or a contested value judgment ("preference"). "Knocks out" indicates which broad positions (Perpetual Memory / Managed Forgetting) are invalidated if the requirement is non-negotiable.

  ### Core Requirements Table
  | Requirement              | What it demands of any theory                                                                 | The case/fact forcing it                                                                 | Bedrock or Preference | Knocks out (if non-negotiable)                        |
  | :----------------------- | :-------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :-------------------- | :---------------------------------------------------- |
  | **Reconstructive Memory** | Must account for memory being unstable & re-interpreted, not a fixed recording. Cannot demand perfect "fidelity". | Neuroscience: Every recall alters the memory trace; oral histories evolve over time.                      | **Bedrock**           | Theories demanding perfect historical "accuracy".    |
  | **Digital Permanence**   | Must address that forgetting now requires active effort (deletion, suppression); default is permanence. | Digital archives, social media, cloud storage making past records ubiquitous & searchable. | **Bedrock**           | Theories assuming forgetting happens "naturally" over time. |
  | **Non-Monolithic Groups**| Must handle communities with conflicting narratives, not assume shared identity/memory.       | Post-colonial states, immigrant nations (e.g., USA), or deeply divided societies (e.g., Bosnia). | **Bedrock**           | Theories treating "the community" as a unified actor. |
  | **Agency of Institutions**| Must explain how formal bodies (states, schools, museums) shape individual "memory," even if groups don't "remember" literally. | Holocaust education, Confederate monument erection, Turkey's Armenian genocide denial laws. | **Bedrock**           | Strict individualist views denying collective memory. |
  | **Survivor Primacy**     | Must prioritize agency/needs of direct victims/survivors over abstract obligations to "the dead" or future gens. | Living Holocaust survivors; Indigenous residential school survivors.                     | **Preference**        | Theories demanding *only* descendants' needs matter. |
  | **Non-Inherited Guilt**  | Must distinguish descendant *responsibility* (e.g., reparations) from *guilt*. Cannot treat descendants as perpetrators. | Grandchild of a Nazi guard vs. grandchild of a victim; inherited wealth from slavery.   | **Preference**        | Theories asserting bloodline guilt.                  |
  | **Symbolic Transformation**| Must recognize actions like statue removal as *changing* memory, not erasure (i.e., re-interpretation). | Toppling of Saddam Hussein/Colston statues; renaming schools. Creates new public discourse. | **Bedrock**           | Theories equating removal with "forgetting."         |
  | **Truth-Amnesty Tradeoff**| Must explain if truth-telling without justice (e.g., amnesty) constitutes "remembering" or sanctioned forgetting. | South African TRC: Amnesty for testimony; preserved records but denied legal accountability. | **Bedrock**           | Theories equating memory solely with legal justice.  |
  | **Harm Continuity**      | Must address when past wrongs cause *present, measurable harm* (e.g., stolen land, systemic discrimination). | Indigenous land claims; racial wealth gaps from slavery/Jim Crow.                       | **Bedrock**           | Theories treating all past wrongs as equally "over." |
  | **Healing Function**     | Must acknowledge that dwelling on trauma can perpetuate cycles of violence/resentment.        | Hatfield-McCoy feuds; post-conflict reconciliation (e.g., Rwanda's *gacaca* courts).     | **Bedrock**           | Theories demanding *infinite* remembrance regardless of cost. |

  ### Key Requirement Clashes Table
  | Pair of Requirements         | Why they pull against each other                                                                 | What a theory must give up to satisfy both                                     |
  | :--------------------------- | :----------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------- |
  | **Survivor Primacy** vs. **Healing Function** | Survivors may demand perpetual memory, but this can hinder societal healing/coexistence. | Strict adherence to either; requires context-specific balance (e.g., survivor-led closure rituals). |
  | **Harm Continuity** vs. **Non-Inherited Guilt** | Addressing present harm (e.g., reparations) can *feel* like assigning guilt to descendants. | The conflation of *moral guilt* with *civic responsibility*; requires clear separation. |
  | **Truth-Amnesty Tradeoff** vs. **Harm Continuity** | Trading amnesty for truth may deny justice for ongoing harms (e.g., economic oppression). | Perfect justice; requires accepting pragmatic peace vs. ideal accountability. |
  | **Digital Permanence** vs. **Healing Function** | Digital archives prevent forgetting, but forced visibility can retraumatize and block reconciliation. | "Natural" forgetting; requires mechanisms for contextual access/sealed archives. |

  ### The Highest-Leverage Requirement
  **Harm Continuity** does the most work: It eliminates theories advocating blanket forgiveness/forgetting where structural injustices persist (e.g., "slavery was long ago, move on" amid systemic racism) *and* theories demanding equal remembrance for all historical wrongs regardless of present impact (e.g., treating a 1890 family feud like apartheid). It forces the theory to engage with material reality, not just symbolism.
