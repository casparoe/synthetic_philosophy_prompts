prompt: |-
  I have no training in philosophy — I keep the books for a small business and have never taken a course in it — but for the last two years a friend and I have been arguing about something I'm told philosophers have a name for. My view is that knowing how to do a thing is not the same as knowing facts about it. You can be a superb skier, or a person who can always tell when someone is lying, and be quite unable to state a single rule that captures what you know; the knowledge is in the doing, not in any proposition you could write down. Her view is that this must be wrong — that whenever anyone genuinely knows how to do something, there are facts they know, and the skill is nothing over and above the ability to act on those facts, well or badly.

  We have reached the point where we only repeat ourselves, and I think the honest thing is to produce, together, the document we should have written long ago: a statement both of us could sign without either pretending to agree with the other. I would like it to contain four things.

  First, a numbered list of claims we can both honestly accept — about skills, about explaining what one does, about what it is to know a fact, and about what it is to be able to do something.

  Second, the disagreements that remain, each written in wording that the person who holds that view would accept as a fair statement of it.

  Third, what we take to be the real crux or cruxes — the smaller questions that, if they were settled, would actually move one or both of us — and, for each crux, some case, test, or argument we both agree bears on it, with each of us saying in advance what we would expect to find and what would change our minds.

  Fourth, whether any part of our quarrel is merely about words. I have begun to suspect that we are each using "knowing how" for two different things — the sheer ability to do it, and the grasp or understanding of it — and that some of our disagreement dissolves once those are separated. She suspects the opposite: that the difference I am pointing to is really the difference between knowing a fact in the abstract and knowing it in a way that is inseparable from being able to act on it, and that this is a distinction without a difference. I would like the document to settle which of us is right about that, or to say why neither of us is.

  Two cases in particular I would ask the document to work through, because neither of us can settle them by appealing to what we already believe. The first is a woman who, after a stroke, can no longer play a piece she once played beautifully, yet can still listen to a recording and point to every wrong note and say exactly what should have been done; she insists she still knows how to play and has lost only the ability. The second is a novice who, by some surgical trick, is given the ability to play the piece faultlessly without ever having learned anything about music; she plays it perfectly and knows no facts about it at all. I want to know what each of us is obliged to say about these two women, and whether there is a way of describing both that we can each accept.
reasoning: |-
  Hmm, the user describes a long-standing philosophical debate with a friend about whether knowing how to do something is the same as knowing facts about it. They're a bookkeeper with no formal philosophy training, which makes me want to avoid academic jargon while still addressing the core philosophical dispute accurately.

  The user wants to create a joint document with four specific components: common ground statements, clear disagreement formulations, testable cruxes with mind-changing conditions, and linguistic analysis. They've also provided two concrete cases that challenge both positions. This shows impressive methodological rigor for someone without philosophy background - they're essentially asking for a structured dialectical framework.

  Key philosophical context: This is Ryle's "knowing-how" vs "knowing-that" distinction versus intellectualist views that reduce skills to propositional knowledge. The stroke victim case resembles Stanley & Williamson's counterexamples, while the surgical novice parallels anti-intellectualist thought experiments. 

  For the common ground section, I need to identify non-controversial claims both would accept: (1) Skills often outrun verbal articulation, (2) Explanations don't guarantee ability, (3) Ability doesn't guarantee explanation, (4) Factual knowledge requires truth, and (5) Ability involves reliable performance. These should be uncontroversial enough for both realist and intellectualist positions.

  The disagreements need precise formulation: The user holds that ability can exist without corresponding factual knowledge, while the friend believes ability necessarily implies factual knowledge that guides action. The linguistic sub-disagreement about whether "knowing how" has one or two senses is particularly subtle - it requires analyzing if the dispute is merely terminological.

  The cruxes must be carefully chosen: (1) Whether the stroke victim still "knows how" to play, (2) Whether the surgical novice genuinely "knows how" to play. For each, I'll outline what observations would convince each party. For example, if the stroke victim could teach piano despite not playing, that might challenge the friend's view.

  The two test cases are brilliant because they decouple ability from knowledge in opposite ways. The stroke victim has knowledge without ability; the surgical novice has ability without knowledge. Handling them requires distinguishing between: (a) retained cognitive understanding vs lost motor execution, and (b) behavioral competence vs absence of musical cognition.

  Notable that both parties suspect terminological confusion - the user thinks "knowing how" conflates ability with understanding, while the friend thinks it's a false distinction. I'll propose a neutral taxonomy: "ability" (reliable performance), "explanatory knowledge" (verbalizable rules), and "practical understanding" (integrated know-how). This might dissolve some disagreement.

  For the document structure, I'll mirror their four requested sections, then analyze the cases through both lenses. The surgical novice case is especially telling - if the friend concedes she "knows how" without factual knowledge, it undermines intellectualism; if not, it reveals a possible equivocation.

  Final note: The user's request for "what would change our minds" shows extraordinary intellectual honesty. I'll make those conditions concrete and testable - like whether the stroke victim can mentally simulate playing, or whether the novice can adapt her playing.
answer: |-
  Here is a proposed joint document structured as you requested, designed to capture both perspectives honestly while providing a framework for resolving your core disagreement through the test cases.

  **Joint Statement on Knowing How & Knowing That**

  **I. Points of Agreement (Claims We Both Accept):**

  1.  **Skills Exist Independently of Explanation:** Possessing a skill (e.g., skiing expertly) does not necessarily mean the skilled person can adequately articulate *how* they do it or state explicit rules governing the action. Verbal explanation is a separate ability.
  2.  **Explanation ≠ Ability:** Being able to state facts or rules about an activity (e.g., reciting ski instruction manuals) does not guarantee the ability to perform that activity skillfully.
  3.  **Ability ≠ Explanation:** Being able to perform an activity skillfully does not guarantee the ability to state facts or rules explaining *how* one does it.
  4.  **Knowing a Fact Requires Truth & Justification:** To genuinely *know a fact* (knowing *that* something is the case), one must believe it, it must be true, and one must have good reasons or justification for that belief.
  5.  **Ability Implies Reliable Performance:** To genuinely *be able to* do something, one must be capable of performing it reliably and successfully under appropriate conditions, not just accidentally or once by fluke.
  6.  **The Phenomena are Real:** We agree that there are cases like the expert skier who can't articulate rules, the stroke victim who understands music but cannot play, and the hypothetical surgical novice. Our disagreement is about how to *describe* and *explain* these phenomena philosophically.

  **II. Core Disagreements (Stated Fairly by Each Side):**

  1.  **Disagreement on the Nature of Skillful Ability:**
      *   **Your View (Anti-Intellectualism about Know-How):** "Knowing how to do something fundamentally consists in possessing a complex set of *abilities*, dispositions, and capacities to perform that action reliably and skillfully. This practical knowledge can exist entirely independently of knowing any propositional facts *about* how to do it. The ability itself *is* the knowledge-how."
      *   **Your Friend's View (Intellectualism about Know-How):** "Knowing how to do something fundamentally consists in possessing propositional knowledge (knowing *that* certain things are true – e.g., facts about techniques, responses to situations, cause-and-effect). Skillful performance is the reliable *exercise* or *application* of this underlying propositional knowledge under the pressure of action. The ability is the *result* of knowing the relevant facts and being able to access/apply them effectively."

  2.  **Disagreement on Linguistic Analysis:**
      *   **Your View:** "The phrase 'knowing how' is ambiguous. It can refer to (a) the *sheer ability* to do something (e.g., 'He knows how to ride a bike' meaning he *can* ride it), or (b) the *explanatory understanding* of how it's done (e.g., 'She knows how internal combustion works'). Conflating these causes confusion. Our main disagreement is about (a)."
      *   **Your Friend's View:** "The phrase 'knowing how' consistently refers to possessing propositional knowledge *guiding* or *constituting* the ability. The difference you perceive is not between two *meanings* of 'knowing how,' but between possessing that propositional knowledge *inertly* (like book knowledge) versus possessing it in a *practical, accessible, action-guiding* form. This is a difference in *state* or *access*, not a difference in *kind* of knowledge."

  **III. Cruxes and Tests (Settling the Smaller Questions):**

  1.  **Crux 1: The Stroke Victim (Knowledge without Ability?)**
      *   **Case:** A pianist suffers a stroke. She can no longer physically play her beloved piece. However, she can listen to any recording, instantly identify every single wrong note, mis-timed phrase, or error in dynamics, and precisely articulate what the correct performance should be – demonstrating deep understanding of the piece's structure, technique, and interpretation.
      *   **Your Prediction:** This case supports your view. She clearly possesses deep propositional knowledge *about* playing the piece (knowing *that* this note is wrong, *that* the dynamics here should be forte, *that* the phrasing should be legato). However, she lacks the *ability* to physically execute it. Therefore, she *does not* know *how* to play the piece in the sense of *ability*. She retains *explanatory understanding* (your sense (b)) but has lost *ability* (your sense (a)).
      *   **Your Friend's Prediction:** This case supports her view. The woman clearly retains the core propositional knowledge *constitutive* of knowing how to play *that piece* – she knows the facts about what constitutes a correct performance. What she has lost is the *physical capacity to execute* the actions guided by that knowledge. She still "knows how" in the fundamental sense (possessing the guiding knowledge); she just can't *do* it anymore. The knowledge is intact but inaccessible for action.
      *   **Mind-Changing Conditions:**
          *   **For You:** If you became convinced that her retained knowledge *is* the same knowledge *guiding* her past performances, and the *only* loss is motor execution, you would concede she still "knows how" in the relevant sense (though unable to act on it).
          *   **For Your Friend:** If you became convinced that the knowledge she retains (critical listening, analysis) is fundamentally *different in kind* from the practical, embodied knowledge *directly governing finger movements and timing* during performance (which is now lost), you would concede she has lost the "knowing how" related to performing.
      *   **Shared Test:** Could she *teach* someone else to play the piece competently through verbal instruction and demonstration (using her other hand, perhaps), despite being unable to play it herself? If yes, it strongly suggests retained practical-propositional knowledge. If her knowledge is purely analytical/critical but she cannot instruct *how to produce* the sounds, it suggests a separation.

  2.  **Crux 2: The Surgical Novice (Ability without Knowledge?)**
      *   **Case:** A person with zero musical training undergoes an experimental neurosurgical procedure. They wake up able to flawlessly play Chopin's "Fantaisie-Impromptu" on the piano. They perform it perfectly whenever asked. However, they cannot name the piece, identify any notes, read music, explain any technique they are using, or play *any other* piece or even simple scales. They possess no musical facts whatsoever.
      *   **Your Prediction:** This case strongly supports your view. The novice possesses the reliable *ability* to perform this specific action (play this piece). This is genuine "knowing how" in the *ability* sense (your sense (a)). Crucially, this ability exists *without* any corresponding propositional knowledge *about* playing the piano, music theory, or this specific piece. The knowledge *is* the embodied ability.
      *   **Your Friend's Prediction:** This case is problematic but doesn't refute her view. While the person performs the sequence of movements reliably, they lack *understanding* of what they are doing. They are acting like a complex player piano or a zombie. This is mere *behavioral mimicry* or *output*, not genuine *skill* or *knowing how*. Genuine "knowing how" requires that the ability is guided by (or constituted by) propositional knowledge, which they lack. They can *do* it, but they don't *know how* to do it in the meaningful sense; they are merely *caused* to do it.
      *   **Mind-Changing Conditions:**
          *   **For You:** If you became convinced that genuine skill *necessarily* involves *understanding* the action in a way that allows for flexibility, correction, or learning – which the novice utterly lacks – you might concede this isn't true "knowing how," but rather a bizarre form of automated output.
          *   **For Your Friend:** If you became convinced that reliable, successful, and context-appropriate performance of a complex intentional action *is sufficient* to attribute "knowing how," *regardless* of the origin or presence of internal propositional states guiding it (i.e., if the output is indistinguishable from skilled action), you would concede this counts as "knowing how" without factual knowledge.
      *   **Shared Test:** Does the surgical novice react appropriately to *changes*? If the piano is slightly out of tune, do they adjust fingering unconsciously? If someone bumps their elbow mid-performance, do they recover smoothly as a skilled pianist would? Or do they rigidly play the exact motor sequence regardless of context, leading to jarring errors if anything is altered? Flexible adaptation suggests something beyond mere mimicry, leaning towards genuine know-how. Rigidity suggests mere output.

  **IV. Analysis of Linguistic Disagreement:**

  *   **Conclusion:** **Your linguistic analysis is more accurate.** The disagreement reveals an ambiguity in "knowing how."
      *   **Sense 1 (Ability):** "X knows how to φ" means *"X has the reliable ability/capacity to φ successfully."* (e.g., The surgical novice *can* play the piece).
      *   **Sense 2 (Explanatory Understanding):** "X knows how to φ" means *"X understands the principles, methods, or facts relevant to φ-ing and could explain them (at least in part)."* (e.g., The stroke victim *understands* what correct playing entails).
  *   **Resolution:** Your core philosophical disagreement (Section II.1) primarily concerns **Sense 1 (Ability)**. Your friend argues that possessing Sense 1 *ability* necessarily implies possessing Sense 2 *understanding* (or its practical-propositional core). You argue that Sense 1 *ability* can exist independently of Sense 2 *understanding*.
  *   **Why Your Friend's Linguistic View is Incorrect:** Her view tries to reduce both senses to a single propositional core, differing only in access or format. However, the Surgical Novice case crucially demonstrates that **Sense 1 (Ability)** can exist without *any* trace of **Sense 2 (Understanding)**. The novice has *zero* propositional knowledge about music or playing. Conversely, the Stroke Victim retains **Sense 2 (Understanding)** but loses the physical manifestation of **Sense 1 (Ability)** for that specific action. This clear dissociation shows the two senses are distinct. Recognizing this linguistic ambiguity clarifies that your core dispute is about the relationship between *ability* (Sense 1) and *explanatory understanding/factual knowledge* (Sense 2), not about different states of the same thing.

  **V. Analysis of the Two Cases (Under the Agreed Framework):**

  1.  **The Stroke Victim:**
      *   **Shared Description:** She retains **explanatory understanding (Sense 2)** of how to play the piece (knowing facts about correct performance) but has lost the **ability (Sense 1)** to physically execute it due to motor impairment.
      *   **Your Obligation:** You can honestly say she *does not know how to play the piece* in the **ability (Sense 1)** meaning. She only knows *about* it (**Sense 2**).
      *   **Your Friend's Obligation:** She can honestly say the victim *still knows how to play the piece* in the sense that she retains the core **explanatory/propositional knowledge (Sense 2)** that *constituted* her know-how, though she is tragically unable to *exercise the ability* (**Sense 1**) due to physical damage.
      *   **Common Ground:** Both agree she possesses deep knowledge *about* the piece (**Sense 2**) but lacks the capacity to *perform* it (**Sense 1**). The disagreement on whether to *call* the retained knowledge "knowing how" stems from the linguistic ambiguity resolved in Section IV.

  2.  **The Surgical Novice:**
      *   **Shared Description:** She possesses the reliable **ability (Sense 1)** to play this specific piece faultlessly but utterly lacks any **explanatory understanding (Sense 2)** of music, piano playing, or even what she is doing.
      *   **Your Obligation:** You can honestly say she *knows how to play this piece* **in the ability sense (Sense 1)**. Her performance is reliable and successful.
      *   **Your Friend's Obligation:** She can honestly say she *does not know how to play the piano* **in the sense of possessing genuine skill/constitutive understanding (Sense 2)**. Her ability is a causally induced behavioral output devoid of guiding knowledge or understanding.
      *   **Common Ground:** Both agree she *can* play the piece (**Sense 1 ability manifest**) but has *no understanding* of what she is doing or music in general (**No Sense 2**). The disagreement is whether the reliable ability (**Sense 1**) *alone*, without any understanding, constitutes genuine "knowing how." Her performance is a perfect physical output but potentially lacks the cognitive hallmarks of true skill (flexibility, understanding, grounding).

  **Conclusion of Document:**
  This document clarifies our points of agreement, fairly states our core philosophical disagreement regarding the nature of ability, identifies two crucial test cases with clear predictions and mind-changing conditions, and resolves the linguistic confusion by establishing two distinct senses of "knowing how": **Ability** and **Explanatory Understanding**. Our fundamental philosophical disagreement persists: whether **Ability (Sense 1)** necessarily depends on or is constituted by **Explanatory Understanding/propositional knowledge (Sense 2)**, as your friend maintains, or whether **Ability (Sense 1)** can exist independently, as you maintain. The test cases, particularly the Surgical Novice, remain pivotal battlegrounds for this core issue. We agree to evaluate future arguments based on how they handle these decoupled phenomena.
