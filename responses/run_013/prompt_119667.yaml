answer: |-
  **Ask the Growth-Optimalist**  
  *Retired actuary Tobias Finch sizes life’s bets using the Kelly criterion. Send your dilemmas.*  

  ---  

  **Cowardly Brother?**  
  *My brother put his life savings on red at roulette, won, and calls me a coward for not gambling. He says I’ll die mediocre. Thoughts? — Safe in Sacramento*  

  The house edge on roulette is 5.26%. If your brother repeated his bet across 100 parallel universes, most versions of him would be bankrupt. The average wealth across all those versions would decay exponentially. In *this* universe, he got lucky once. But one outcome is irrelevant to strategy. You avoid negative-expectation bets. That isn’t cowardice; it’s respecting arithmetic. His bravado is as statistically meaningful as a flipped coin landing on its edge. Ignore him.  

  ---  

  **Too Good to Be True?**  
  *My hedge-fund friend offered me this bet: 50% chance to gain 50% of my stake, 50% chance to lose 40%. The expected value is +5% (0.5×0.5 – 0.5×0.4). He says I’d be irrational not to bet everything. Agree? — Hesitant in Hartford*  

  Betting your entire stake repeatedly is catastrophic. After one win and one loss, your stake drops to 90% (1.5 × 0.6 = 0.9). After two losses, it’s 36%. Sequence matters: losses compound faster than gains recover. The optimal fraction? Calculate the Kelly criterion: maximize expected log growth. Set *f* as the fraction bet. The growth rate *G* is:  
  *G = 0.5×ln(1 + 0.5f) + 0.5×ln(1 - 0.4f)*.  
  Take the derivative, set to zero:  
  *(0.5×0.5)/(1+0.5f) – (0.5×0.4)/(1-0.4f) = 0*.  
  Solving: *f = 0.25*. Bet 25%. At full stakes? You’d asymptote to zero.  

  ---  

  **Just Risk-Aversion?**  
  *Isn’t Kelly just maximizing the geometric mean? Von Neumann’s axioms don’t force this — it’s arbitrary risk-aversion disguised as math. — Dr. Ellen O’Rourke, Economics Dept., Yale*  

  You’re technically correct: no utility function is "mandated" by rationality axioms. Maximizing geometric mean *is* a choice. But consider the alternatives. If you maximize arithmetic mean, you accept ruinous bets. If you’re risk-averse with ad hoc parameters, you undergrow. Kelly isn’t arbitrary: it’s the *only* strategy that (i) avoids ruin, (ii) maximizes long-term growth, and (iii) lets you reuse the same fraction forever. For anyone facing recurring decisions, it’s not a preference — it’s survival geometry. The axioms are silent on repetition; reality isn’t.  

  ---  

  **Second Child?**  
  *We have one healthy son. I’d love another child. You’re the growth-optimalist — what does Kelly say? — Love, Marco*  

  The criterion assumes repeated, identical multiplicative bets. Life is a single sequence. We cannot rerun parenthood 100 times to average outcomes. Children are not independent wagers: costs interact, rewards are non-fungible, and ruin (e.g., emotional exhaustion) isn’t quantifiable. More importantly, Kelly optimizes *resource growth*. But what’s the resource? Love? Time? Net worth? The model presumes a scalar quantity. Here, it fails. I... need more constrained inputs.  

  ---  
  Verdict: Kelly’s math is impeccable for replicable gambles but collapses when life refuses to repeat.
