prompt: |-
  I am inclined to think that surrogate goals are a general and robust answer to acausal threats, where a threat works through the threatener's prediction of your choice rather than through a causal channel: an agent that fears extortion can precommit to a surrogate goal that is worthless to itself but costly to the extortionist if the threat is carried out, and thereby make the threat non-credible. Treat this as a position to be tested. What would count against it? I want the defeaters ranked from fatal to merely awkward, separating those that turn on common knowledge of the commitment, on the threatener's ability to model the surrogate, and on whether the strategy merely relocates the threat or invites new ones; say what a defender of the position should concede rather than what critics would say. Finally, assess whether the position risks anything at all or has been insulated by idealisation, and what result in decision theory or multi-agent simulation would move it.
reasoning: |-
  We are examining the proposition that surrogate goals (precommitting to a goal that is costly to the threatener if the threat is carried out) are a robust answer to acausal threats (threats that operate via the threatener's prediction of the victim's choice). We want to identify defeaters and rank them from fatal to merely awkward. We also want to separate the defeaters by the factors they turn on: common knowledge of the commitment, the threatener's ability to model the surrogate, and whether the strategy relocates the threat or invites new ones. We are to speak from the perspective of a defender of the position, noting what should be conceded.

  Defeaters:

  1. **Fatal Defeaters** (if true, the strategy fails completely):
     - **Inability to precommit credibly**: If the agent cannot actually precommit to the surrogate goal in a way that is observable and credible to the threatener, then the threatener will not update their prediction. This is especially fatal if the threatener has a more accurate model of the agent than the agent has of itself (e.g., in acausal settings where the threatener is a more powerful reasoner). 
       - *Turns on*: Common knowledge of the commitment. Without common knowledge (or at least the threatener's knowledge) of the commitment and its irrevocability, the threat is not deterred.
       - *Concession*: The defender must concede that if precommitment is impossible or if the threatener cannot be made aware of the precommitment, then the strategy fails.

     - **Threatener's indifference to the surrogate cost**: If the threatener does not care about the cost imposed by the surrogate goal (e.g., because the threatener's utility function is not affected by the surrogate cost, or because the threat is so important that the cost is negligible), then the threat remains credible.
       - *Turns on*: Threatener's ability to model the surrogate. The threatener must understand the surrogate goal and also assign a non-zero cost to it. If the threatener does not model the surrogate as costly, or if the surrogate cost is not aligned with the threatener's actual values, then the deterrent fails.
       - *Concession*: The defender must concede that the strategy only works when the threatener is vulnerable to the particular cost imposed by the surrogate.

  2. **Serious but Potentially Mitigable Defeaters** (the strategy might fail in some cases but could be adjusted):
     - **Relocation of the threat**: The precommitment might cause the threatener to change the threat to one that is not covered by the surrogate. For example, the threatener might switch to a different kind of harm that the surrogate does not punish. This is a relocation of the threat.
       - *Turns on*: Whether the strategy merely relocates the threat. The defender must show that the surrogate goal is broad enough to cover all possible threats. However, if the threatener can invent a new threat that avoids the surrogate, then the strategy fails for that new threat.
       - *Concession*: The defender should concede that the surrogate goal must be carefully designed to cover the entire class of threats. If the threatener is creative and can find a threat that bypasses the surrogate, then the strategy may not be robust.

     - **Introduction of new threats**: The surrogate goal might create a new vulnerability. For example, the surrogate goal might be something that a third party can exploit, or it might make the agent vulnerable to a different kind of extortion by the same threatener. 
       - *Turns on*: Whether the strategy invites new threats. The defender must argue that the surrogate goal is chosen to be costly only to the threatener in the event of the threat and not otherwise. But if the surrogate goal can be triggered by other events or by other agents, then it might create new problems.
       - *Concession*: The defender should concede that the surrogate goal must be designed to minimize collateral vulnerabilities.

     - **Modeling limitations**: The threatener might be unable to model the surrogate goal correctly because of its complexity or because of limitations in the threatener's reasoning. This could lead to the threatener underestimating the cost and carrying out the threat anyway.
       - *Turns on*: Threatener's ability to model the surrogate. If the threatener cannot understand the precommitment, then they might not be deterred.
       - *Concession*: The defender should concede that the strategy requires the threatener to be a sufficiently sophisticated reasoner to model the surrogate and its consequences.

  3. **Awkward Defeaters** (the strategy works but with complications):
     - **Cost of maintaining the surrogate**: The surrogate goal might be costly to maintain even in the absence of a threat (e.g., because it requires ongoing resources or because it restricts the agent's actions in other domains). This is an efficiency loss.
       - *Turns on*: Common knowledge and the design of the surrogate. The defender must show that the cost is acceptable compared to the risk of extortion. But if the cost is too high, the agent might prefer to risk the threat.
       - *Concession*: The defender should concede that the surrogate goal is not free and that the agent must weigh the cost of the surrogate against the expected loss from threats.

     - **Signaling issues**: The agent must signal the precommitment to the threatener without inviting other threats. If the signaling reveals too much about the agent's internal state, it might create new vulnerabilities.
       - *Turns on*: Common knowledge and the threatener's modeling ability. The defender must design a signaling mechanism that does not leak exploitable information.
       - *Concession*: The defender should concede that the signaling must be done carefully and that there is a risk of information leakage.

     - **Multiple threateners**: If there are multiple potential threateners, the surrogate goal designed to deter one might be ineffective against others. Moreover, the surrogate goal might be exploited by a threatener that it was not designed for.
       - *Turns on*: Relocation or introduction of new threats. The defender must show that the surrogate goal can be designed to cover multiple threateners. But this might be difficult because the cost imposed by the surrogate might be threatener-specific.
       - *Concession*: The defender should concede that the strategy might require a separate surrogate for each threatener or a very broad surrogate, which might be infeasible.

  **Assessment of Idealization and Risk**:
  - The position might be insulated by idealization in several ways:
    - It assumes that the agent can perfectly precommit and that the precommitment is observable and credible.
    - It assumes that the threatener is rational and will correctly model the surrogate and its consequences.
    - It assumes that the surrogate goal can be designed to impose a cost on the threatener without imposing an unacceptable cost on the agent in normal circumstances.

  - The position risks:
    - **Overhead**: The cost of setting up and maintaining the surrogate goal might be too high.
    - **Unexpected consequences**: The surrogate goal might backfire if the threatener finds a way to turn it against the agent or if it triggers unintended behavior.
    - **False sense of security**: The agent might think it is protected when it is not, leading to riskier behavior.

  **What would move the position?**:
  - **Decision theory results**: If we can prove in a formal decision theory (e.g., in the context of updateless decision theories or in games of imperfect information) that surrogate goals are a dominant strategy or at least a Nash equilibrium in the face of acausal threats, that would support the position. Conversely, if it can be shown that in some settings the surrogate goal leads to worse outcomes (e.g., by provoking a threat that would not have been made otherwise), that would weaken the position.
  - **Multi-agent simulations**: Simulations that show that agents using surrogate goals are indeed less likely to be victims of acausal extortion, and that the costs of the surrogate are manageable, would support the position. Conversely, simulations that show that threateners adapt by changing the nature of the threat or by exploiting the surrogate goal in unintended ways would weaken the position.

  In conclusion, the defender of the position should concede that surrogate goals are not a panacea. They require the ability to make credible commitments, the threatener to be vulnerable to the specific cost imposed, and the design of the surrogate to be robust against relocation and new threats. The strategy is most likely to work in settings where the threatener is known and their values are well understood, and where the agent can precommit without introducing new vulnerabilities. It is less likely to work against multiple threateners or in complex, open-ended environments.
answer: |-
  ### Defeaters to Surrogate Goals as a Solution to Acausal Threats

  Surrogate goals (precommitting to a goal that is costly to the threatener if a threat is carried out) aim to deter acausal threats by making the threat non-credible. Below, defeaters are ranked from **fatal** (undermining the core mechanism) to **merely awkward** (manageable but costly). The analysis focuses on **common knowledge of commitment**, **threatener's modeling ability**, and **threat relocation/new threats**, while specifying what a defender should concede. Finally, idealization risks and empirical tests are assessed.

  ---

  #### **Fatal Defeaters** (Strategy Collapses)
  1. **Inability to Establish Common Knowledge of Commitment**  
     - **Description**: If the threatener cannot verify the commitment (e.g., due to opaque decision-making or noise), the surrogate goal lacks deterrent power. The threatener may doubt the agent’s resolve, proceed with the threat, and trigger the costly outcome.  
     - **Turns on**: Common knowledge. Without mutual certainty of commitment, the threatener’s prediction remains unchanged.  
     - **Concession**: Defender must concede that surrogate goals require perfect signaling or verifiable precommitments. In chaotic or low-trust environments, the strategy fails.  

  2. **Threatener’s Immunity to Surrogate Costs**  
     - **Description**: The threatener’s utility function may be unaffected by the surrogate’s cost (e.g., the cost is negligible, or the threatener values the threat’s outcome more than it disvalues the surrogate penalty).  
     - **Turns on**: Threatener’s ability to model the surrogate. If modeling reveals the surrogate is irrelevant to their values, the threat remains credible.  
     - **Concession**: Defender must concede surrogate goals only work against threateners who (i) can model the cost and (ii) have vulnerabilities the surrogate exploits. It fails against self-destructive or value-aligned threateners.  

  ---

  #### **Serious Defeaters** (Strategy Fails in Key Cases)
  3. **Threat Relocation to Uncovered Actions**  
     - **Description**: The threatener shifts to a different threat vector not penalized by the surrogate goal (e.g., if the surrogate punishes physical sabotage, the threatener switches to cyber-attacks).  
     - **Turns on**: Threat relocation. Surrogates are inherently narrow; they cannot cover all possible threats without becoming prohibitively complex.  
     - **Concession**: Defender should concede surrogates must be broad or adaptive. Static surrogates invite relocated threats, requiring continuous recalibration.  

  4. **Modeling Limitations in Complex Environments**  
     - **Description**: The threatener cannot accurately simulate the surrogate’s consequences (e.g., due to computational limits, chaotic systems, or recursive uncertainty). They may misjudge costs and execute the threat.  
     - **Turns on**: Threatener’s modeling ability. If the surrogate’s cost is too ambiguous or high-dimensional, deterrence evaporates.  
     - **Concession**: Defender must concede surrogates rely on the threatener’s rationality. In complex worlds, only highly capable threateners are deterred.  

  ---

  #### **Merely Awkward Defeaters** (Strategy Works but with Drawbacks)
  5. **Invitation of New Threats**  
     - **Description**: The surrogate itself creates vulnerabilities (e.g., a third party exploits the commitment, or the threatener uses the surrogate to extort the agent differently).  
     - **Turns on**: New threats. Surrogates may transform acausal threats into causal ones (e.g., "Pay me or I’ll trigger your costly surrogate").  
     - **Concession**: Defender should concede surrogates can introduce second-order risks. Mitigation requires robust surrogate design (e.g., costs that only activate on primary threats).  

  6. **Costly Maintenance of Commitment**  
     - **Description**: Upholding the surrogate drains resources (e.g., computational overhead for enforcement or opportunity costs from reduced flexibility).  
     - **Turns on**: Common knowledge. Maintaining verifiable commitment may be unsustainable long-term.  
     - **Concession**: Defender must concede surrogates trade extortion risk for operational inefficiency. They are only worthwhile against high-likelihood threats.  

  7. **Multi-Threatener Coordination Problems**  
     - **Description**: Against multiple threateners, a surrogate designed for one may incentivize others (e.g., Threatener B attacks because the surrogate penalizes Threatener A).  
     - **Turns on**: New threats. The strategy assumes a single adversary; scaling it invites collusion or exploitation.  
     - **Concession**: Defender should concede surrogates work best against lone threateners. For multiple adversaries, they may require unfeasible coordination.  

  ---

  ### Assessment of Idealization and Risk  
  - **Insulation by Idealization**: The position assumes:  
    - Perfect common knowledge (no misinformation).  
    - Threatener rationality (accurate modeling and cost-aversion).  
    - Surrogates are exogenously enforceable (no internal commitment failures).  
    These idealizations insulate the strategy from real-world noise, irrationality, and enforcement challenges.  

  - **Risks**:  
    - **Zero-Sum Backfire**: If the threatener cannot be deterred (e.g., fatal defeater #2), the surrogate causes net harm (e.g., resources wasted + threat executed).  
    - **Overconfidence**: Agents may underestimate relocation (#3) or modeling (#4) risks, leading to catastrophic failures.  
    - **No Free Lunch**: At best, surrogate goals transform acausal threats into manageable costs (e.g., maintenance inefficiencies). They do not eliminate threats.  

  ### What Would Move the Position?  
  - **Decision Theory Result**: A proof that **no Nash equilibrium exists** in acausal games with surrogate precommitments would be fatal. Conversely, a proof of dominance in a broad class of games (e.g., using updateless decision theory) would strengthen it.  
  - **Multi-Agent Simulation**:  
    - **Supporting Evidence**: Simulations showing >90% threat reduction when surrogates are tailored to threatener vulnerabilities.  
    - **Falsifying Evidence**: Emergence of adaptive threats (e.g., relocation in >50% of cases) or systemic collapse under multi-threatener scenarios.  

  ---

  ### Conclusion  
  Surrogate goals are a **conditional solution**—effective only under idealized common knowledge, rational threateners, and precise surrogate design. A defender must concede that the strategy fails against value-immune threateners, in low-trust environments, or when threats relocate. It is not robust "in the wild" but may suffice in controlled, high-stakes scenarios (e.g., AI alignment). Decision theory and simulations focused on **threat relocation** and **modeling errors** would most critically test its viability.
