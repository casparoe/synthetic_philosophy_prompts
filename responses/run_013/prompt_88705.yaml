answer: |-
  Here is a complete exam package designed to meet your specifications:

  ---

  ### **Deliverable 1: Exam Question**  
  **Truth & Metaphysics of Language: Final Exam**  
  **Essay Question (25 marks; 75 minutes)**  

  Deflationist accounts of truth typically rely on the *equivalence schema* (“‘P’ is true iff P”) and emphasize truth’s *disquotational* or *generalizing* role (e.g., “Everything Kant said is true”). They deny that truth is a substantive property capable of *explanatory work* (e.g., explaining successful action) or grounding *robust norms* (e.g., “One ought to believe only what is true”).  

  **Critically evaluate whether deflationism can adequately reconcile *both* of the following core commitments without collapsing into a substantive theory:**  
  1. **The Generalizing Function**: How truth enables us to express blind generalizations (e.g., “All her assertions are true”) *without* requiring propositions as truth-bearers or treating truth as a property that “collects” truths.  
  2. **The Normative Role**: How truth can function as the constitutive norm of belief or assertion (e.g., “It is correct to believe that p only if p is true”) *without* appealing to truth as a substantive aim or grounding value.  

  In your answer:  
  - Explain precisely how the equivalence schema is meant to discharge these obligations.  
  - Identify where each pressure point threatens to force deflationism into substantive commitments (e.g., propositional ontology, irreducible normativity).  
  - Assess whether deflationism’s strategies (e.g., substitutional quantification, pragmatic accounts of norms) resolve these tensions or merely relocate them.  
  - Conclude with a defended verdict: Can *any* deflationist package satisfy both demands? Justify your answer.  

  **Note:** Do not survey deflationist theories (e.g., minimalism, disquotationalism). Engage the *specific conceptual tensions* above. Essays listing positions or reciting deflationism/correspondence debates will score poorly.  

  ---

  ### **Deliverable 2: Model Answer (~600 words)**  

  Deflationism holds that the entire content of truth is captured by the equivalence schema (ES): “p is true iff p.” Truth, it claims, is not a substantive property but a logical device enabling semantic ascent. Yet two challenges arise.  

  **1. Generalization without Substance:**  
  The truth predicate allows generalizations like “Every consequence of Peano arithmetic is true.” Deflationists propose that such claims reduce, via ES, to infinite conjunctions (e.g., “If PA entails ‘2+2=4’, then 2+2=4; if PA entails ‘3+3=6’, then 3+3=6; etc.”). However, this requires quantifying over propositions (e.g., “For all propositions p, if PA entails p, then p”). If propositions are *not* admitted as truth-bearers (as in radical disquotationalism), deflationism cannot express blind generalizations without circularity. For example, “All her utterances are true” becomes “For every utterance u she made, u is true” – but “u is true” *presupposes* the truth predicate’s utility rather than eliminating it. Minimalists (e.g., Paul Horwich) thus accept propositions to ground quantification, insisting this doesn’t make truth substantive. But if propositions themselves require truth-conditions (e.g., the proposition *that snow is white* is true iff snow is white), truth resurfaces as a unifying property, undermining deflationism’s anti-explanatory stance.  

  **2. Normativity without Substance:**  
  Truth is widely held as the norm of belief: we *ought* to believe only truths. Deflationists argue this norm reduces to the triviality: “One ought to believe that p only if p” (derived from ES). But this faces a dilemma. If the norm is merely syntactic (e.g., “Believe <p> only when p”), it cannot explain *why* we should care about truth – it collapses into a descriptive regularity. If it is genuinely normative (e.g., truth provides a *reason* for belief), deflationism must account for normativity without treating truth as a substantive value. Horwich suggests the norm arises from our acceptance of ES plus instrumental rationality. Yet this invites circularity: accepting ES itself seems to *presuppose* a prior commitment to truth’s normative force. If I accept “I ought to believe ‘snow is white’ iff snow is white” *because* I value truth, truth remains an unexplained normative primitive. Deflationism thus struggles to ground truth’s authority without positing it as a substantive goal.  

  **Explanatory Work & Verdict:**  
  Deflationists dismiss truth’s explanatory role (e.g., “True beliefs cause successful action”) by reducing explanations to underlying facts (e.g., “Beliefs about water cause hydration *because* water is H₂O”). However, this reduction fails for generalizations: “True beliefs *in general* promote success” cannot be paraphrased without re-introducing truth as a property collecting successful belief-states. Here, deflationism’s rejection of propositions or a unifying property weakens its explanatory reach.  

  **Conclusion:** While minimalism survives the generalization challenge (by accepting propositions), it fails to resolve normativity non-circularly. Alternatively, disquotationalism avoids propositions but cannot express generalizations. *No deflationist package fully reconciles both demands*. Generalization requires truth-bearers that invite substantive treatment, while normativity requires an irreducible commitment to truth as a value. Deflationism’s core austerity thus remains untenable.  

  ---

  ### **Deliverable 3: Marking Scheme (25 marks)**  

  **Must-Hit Points** (Deduct marks for omissions/missteps):  
  1. **Precise articulation of equivalence schema & generalization function** (5 marks).  
     *Costs 5 if:* ES is undefined or generalization is conflated with disquotation.  
  2. **Generalization challenge: Why ES alone cannot eliminate truth in blind generalizations** (5 marks).  
     *Costs 5 if:* Fails to show *how* generalizations require propositions/quantification.  
  3. **Normativity challenge: Why reading norms off ES is circular or non-normative** (5 marks).  
     *Costs 5 if:* Treats deflationist normativity as unproblematic or ignores the "ought" gap.  
  4. **Explanatory work: How generalization/normativity tensions undermine deflationism’s anti-explanatory stance** (5 marks).  
     *Costs 5 if:* Omits connection to success explanations or generalization’s metaphysical burden.  
  5. **Defended verdict: Clear position on deflationism’s viability, citing specific tensions** (5 marks).  
     *Costs 5 if:* Verdict is vague, contradictory, or detached from arguments.  

  **Top-Band Separation (A+/25 marks):**  
  To exceed competence (20 marks), answers **must**:  
  - Demonstrate *why* deflationist solutions (e.g., substitutional quantification for generalization; pragmatic normativity) relocate problems rather than solve them (e.g., show circularity in grounding norms via ES acceptance).  
  - Explicitly contrast how *different deflationist packages* (e.g., proposition-accepting minimalism vs. austere disquotationalism) fare on *each* pressure point – even without naming them.  
  - Argue that the normative challenge is *more damaging* than generalization (or vice versa) for deflationism’s coherence.  

  ---

  This package forces engagement with the *mechanisms* of generalization and normativity, penalizes survey-style answers, and rewards nuanced analysis of deflationism’s internal tensions. The model answer demonstrates the required specificity, and the marking scheme ensures rigor while allowing flexibility in student responses.
