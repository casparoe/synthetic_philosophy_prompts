prompt: |-
  I'm on the board of a housing co-op — about two hundred members, a couple of buildings, a shared workshop — and we've been flirting with the idea of deciding some things by prediction market instead of by show of hands at the general meeting. The pitch, as I understand it, is that you fix some measure of what you care about (member wellbeing, or long-run cost per member, or what have you), let people bet on which policy will move that measure, and then just adopt whatever policy the market favours. I like the sound of it in the abstract, but my gut is all over the place once I get down to actual decisions, and I'd like to know whether there's a principle behind the mess or whether I'm just making it up as I go. To be clear, I'm not after a history of the idea or who invented it — I want to know what the thing actually commits you to, and where it breaks.

  Here's what I actually think. Spending the maintenance reserve on a new heating system rather than patching the old one: I'd happily let a market decide that — it's an empirical question about costs and comfort and I don't see why the meeting should outvote the forecasters. Raising the monthly member contribution by £15 to rebuild the reserve: no, that one I want a vote on, even though you could equally call it an empirical question about what keeps the books balanced. Admitting a third building into the co-op: market. Selling the workshop and splitting the proceeds: absolutely a vote, not a market. Renaming the co-op: vote, obviously — no metric captures taste, and I don't care what the market thinks about it. Endorsing a position on the local planning row: vote as well, and again the market's opinion is neither here nor there.

  Two cases tie me in knots. First, a shared-car scheme that only works if enough members expect it to work — there the market price would be partly causing the very thing it's meant to be predicting, so I can't tell whether to trust it or not. Second, anything where the 'measure' is itself the sort of thing members would start gaming the moment they knew it counted; we nearly adopted a member happiness score last year and I can see exactly how that ends. I keep flip-flopping over whether those two are reasons to distrust markets generally or just reasons to pick a better measure. So: is there one principle that gets all of my verdicts, or do some of them have to go? Please state it precisely, say what it predicts for a case I haven't mentioned — deciding by market whether to replace our volunteer treasurer with a paid bookkeeper — and be honest about which of my verdicts it simply can't accommodate.
reasoning: |-
  Okay, the user is on the board of a housing co-op and is considering using prediction markets for decision-making instead of traditional voting. They've shared several scenarios where they're comfortable with markets and others where they prefer votes, along with two tricky cases. Let me unpack their core concern: they want a clear principle to distinguish when prediction markets are appropriate versus when traditional voting is necessary.

  First, I need to identify their explicit and implicit needs. Explicitly, they want a precise principle that explains their mixed reactions and applies to new cases. But deeper down, they might be wrestling with trust in collective wisdom versus expert-like forecasting. They’re likely seeking validation that their instincts aren't arbitrary while needing a framework to avoid future indecision. The mention of "gut all over the place" suggests discomfort with inconsistency, so they crave coherence.

  Looking at their examples, patterns emerge. They accept markets for empirical, outcome-based decisions (heating system, expansion) but resist when decisions involve values, preferences, or self-referential outcomes. The knotty cases (shared-car scheme, happiness metric) highlight concerns about reflexivity and gaming—where the market influences the outcome it predicts. That’s a critical red flag for prediction markets.

  The principle should hinge on two axes: **measurability** and **causal independence**. If the outcome is objective and the market doesn’t interfere, markets work. If it’s subjective or the market affects the outcome, votes are better. For instance, replacing the treasurer: cost savings are measurable and independent, so a market could handle it, but member trust in the system is value-layered, which might need a vote. 

  Their admission case is interesting—they’d use a market, but if the measure were "member harmony," it becomes value-laden and vote-worthy. The user’s intuition here aligns with the principle, but they need confirmation that switching the metric changes the approach. 

  The car scheme dilemma: the market’s prediction could influence participation, creating a self-fulfilling or -defeating prophecy. The principle explains this as a failure of causal independence. Similarly, gaming a happiness score violates measurability since it’s easily manipulated. 

  For the treasurer example, applying the principle: cost efficiency is measurable and independent (market-friendly), but if the decision hinges on trust or fairness (subjective), it’s a vote. The user might not have considered how framing the metric shifts the method—highlighting where their flip-flops stem from ambiguous metrics. 

  Their rejected cases (renaming, workshop sale) clearly fail measurability—no objective metric exists for taste or communal values. Endorsing a political stance is inherently value-driven. The principle holds here. 

  Unspoken needs: they might fear losing democratic ethos by "outsourcing" decisions to markets. The principle reassures that votes preserve member sovereignty for value choices. Also, they need practical guardrails—like choosing robust metrics and avoiding reflexive scenarios—to implement this without backlash. 

  In sum, their instincts are sound. The proposed principle systematizes their reactions, offers testable predictions, and flags where their flip-flops (e.g., car scheme) arise from inherent market flaws, not faulty intuition. The key is rigorously defining the metric and assessing interference risks—which empowers them to design better processes without dismissing markets entirely.
answer: |-
  Your instincts map almost perfectly to a formal principle—let's call it the **Measurable Outcome Independence Criterion (MOIC)**. Here's the precise rule:

  **A decision should be delegated to a prediction market if and only if:**
  1. **The outcome of interest is objectively measurable ex-post (e.g., cost savings, energy usage, vacancy rates);**
  2. **The market’s prediction does not meaningfully alter the outcome it aims to predict (non-reflexive);**
  3. **The outcome is not inherently a value judgment or preference aggregation.**

  ### How MOIC Explains Your Verdicts:
  | **Your Case**               | **MOIC Verdict** | **Why**                                                                 |
  |-----------------------------|------------------|-------------------------------------------------------------------------|
  | New heating system          | ✅ Market        | Outcome (cost/comfort) measurable; no reflexivity; empirical.           |
  | Raising member fees         | ❌ Vote          | Outcome (books balanced) measurable, but value judgment on burden allocation. |
  | Admitting third building    | ✅ Market        | Measurable outcomes (occupancy rates, cost synergies); low reflexivity. |
  | Selling workshop            | ❌ Vote          | Inherently value-based (community vs. cash); no objective metric.       |
  | Renaming co-op              | ❌ Vote          | Pure preference aggregation; no measurable "correct" outcome.           |
  | Endorsing planning position | ❌ Vote          | Value/political judgment; no falsifiable metric.                        |
  | Shared-car scheme           | ❌ Vote          | **Violates #2:** Market participation affects usage (reflexive).        |
  | "Member happiness" metric   | ❌ Vote          | **Violates #1 & #3:** Easily gamed (non-objective); measures preferences. |

  ### Your Two Knotty Cases Resolved:
  1. **Shared-car scheme:**  
     MOIC rejects markets here because the *act of betting* changes member behavior (e.g., pessimists bet against success → avoid using car → ensure failure). Reflexivity corrupts the prediction.  
     **Solution:** Use a vote. Collective commitment requires social agreement, not forecasting.

  2. **Gaming the metric:**  
     MOIC anticipates this. If the measure (e.g., "happiness score") is manipulable, it fails **#1 (objectivity)**. True empirical metrics (e.g., "repair backlog reduced by 50%") can’t be gamed without tangible effort.  
     **Solution:** Pick a robust metric or default to voting.

  ### New Case: Replacing Volunteer Treasurer with Paid Bookkeeper
  - **MOIC Verdict:** ✅ **Market** (if framed correctly).  
  - **Why:**  
    - **Measure:** "Annual accounting errors reduced to <1%" or "Hours spent on finances cut by 75%." These are objective and measurable.  
    - **Non-reflexive:** Betting on efficiency won’t alter the bookkeeper’s competence.  
    - **But:** If members argue, "A paid role undermines our cooperative ethos," it becomes a value conflict → **vote required**.

  ### Where MOIC Clashes With Your Instincts:
  Your resistance to **raising member fees** is valid under MOIC, but your openness to **admitting a new building** might need refinement. If the outcome metric is "long-term cost per member," a market works. But if the debate is about *cultural fit* or *shared values*, it’s a vote—MOIC forces you to define the metric rigorously upfront.

  ### When Markets Break (MOIC’s Failure Modes):
  1. **Non-measurable outcomes:** No market can resolve "should we prioritize affordability or sustainability?"  
  2. **Self-canceling predictions:** E.g., betting on whether a protest will succeed; market activity may itself mobilize/deter action.  
  3. **Extreme inequality:** If one member holds 90% of betting tokens, the market reflects their opinion, not collective wisdom.

  ### Practical Advice for Your Co-op:
  - **Start small:** Use markets for *instrumental* decisions (e.g., "Which contractor delivers lowest maintenance costs?").  
  - **Frame metrics ruthlessly:** "Cost per member" is market-ready; "member wellbeing" is not.  
  - **Never marketize values:** Votes preserve legitimacy on ethical/political choices.  
  - **Kill switch:** Retain board veto if market outcome would violate co-op bylaws or duties.

  **Bottom line:** Your "gut mess" stems from an unconscious grasp of reflexivity and measurability. MOIC systematizes this—**use markets for empirical forecasts, votes for value choices.** Your flip-flops dissolve when you force the question: *"Can we define an objective, non-gameable metric that isn’t corrupted by the market itself?"* If not, grab the ballot box.
