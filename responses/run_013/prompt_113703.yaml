  First, I need to unpack their core claim: moral status depends on instantiating the "right kind" of computation that explains why a system feels and cares. The substrate doesn't matter. Their concerns are valid and common in philosophy of mind and ethics. 

  Looking at indeterminacy: any physical system can be seen as implementing multiple computations. They mention a colleague's counterfactual-trace criterion. That might help by requiring that physical degrees of freedom must track the computation's states under interventions. But does this solve the problem? For a rock, if you squint, you might map its states to some computation, but without causal structure that sustains transitions, it shouldn't count. The counterfactual criterion might rule out rocks and storms because they lack the right dependencies. But slime molds are tricky—they have simple problem-solving but likely don't have the computational complexity for phenomenology. This criterion probably relocates the problem to defining the relevant "interventions" and "degrees of freedom."

  The lookup table objection is tough. If a lookup table mimics an animal's I/O without internal processing, should it have moral status? Saying "no" forces the computationalist to specify what's missing. Maybe they need intrinsic causal structure or counterfactual richness. But this might sneak in substrate concerns. If the table is physically realized with actual states that could change based on inputs, does that count? The user is right that denying moral status here might imply that causal dynamics, not just abstract computation, matter. That's a potential weak point.

  Timing and granularity issues are messy. If a system runs the computation slowly or partially, does it have moral status? The view might bite the bullet and say full implementation is needed. But partial runs or slow speeds could lead to absurdities, like a system gaining/losing moral status based on processing speed. Maybe they need to invoke thresholds or degrees, but that complicates the theory. This might force them into vagueness or arbitrary lines.

  For predictions: the computationalist would attribute moral status to entities like insects if evidence shows they run the right computations, whereas rivals might require biology or specific substrates. Cortical organoids and advanced language models become test cases. If organoids show complex neural computations without consciousness, that challenges the view. Language models that pass behavioral tests but lack inner life might be counterexamples. But proving a negative (no consciousness) is hard, making falsification tricky. The user's desired evidence—clear computation without moral patiency or vice versa—is rare. We might never find a non-biological system that everyone agrees is conscious, so the view risks being unfalsifiable in practice.

  The user’s deeper concern is whether their view is testable or if it’s shielded by appeals to uncertainty. They might worry that it's unfalsifiable because we can always argue about whether the "right" computation is present. This is a real risk. To avoid that, the view must commit to specific empirical markers, like neural correlates in biology or specific architectures in AI. But then it might lose its substrate neutrality. 

  In conclusion, the biggest threats are the lookup table problem (forcing a retreat to causal dynamics) and the possibility that rivals might better explain moral status by tying it to biological or physical properties. The view is falsifiable in theory but might be hard to test in practice, especially with current tech. The user needs to decide if these vulnerabilities are acceptable or if they point to a need for refinements, like requiring certain types of causal processes or embracing degrees of moral status.
answer: |-
  Your computationalist view of moral status is rigorously articulated and admirably clear. Below, I map its vulnerabilities, rank threats from fatal to awkward, identify falsifying conditions, and confront the risk of unfalsifiability. I address your concrete worries directly and specify what your view stakes its credibility on.

  ---

  ### **Ranked Threats to the View**
  *(Fatal → Awkward)*

  1. **The Lookup Table Objection (Potentially Fatal)**  
     **Scenario:** A gigantic lookup table reproduces the exact input-output behavior of a suffering animal (e.g., avoidance of "painful" stimuli, distress vocalizations) without any internal causal structure.  
     - **Your view’s dilemma:**  
       - *If it grants moral status:* This implies a system with no internal states, no counterfactual sensitivity (e.g., it wouldn’t "feel pain" if queried differently), and no causal organization is a moral patient. This is *disastrously implausible* and collapses moral status into behavioral mimicry.  
       - *If it denies moral status:* You must explain what the table lacks that a "real" computational system has. Any criterion (e.g., "intrinsic dynamics," "non-trivial state transitions") likely smuggles in **causal or physical constraints**, betraying substrate neutrality.  
     **Why fatal?** This forces you into either absurdity or abandoning computationalism’s core claim that *only* the abstract computation matters.

  2. **Indeterminacy & the Counterfactual-Trace Criterion (Severe Threat)**  
     Your colleague’s criterion (physical degrees of freedom must track computational states under interventions) *helps* but doesn’t rescue the view:  
     - **Rocks/Storms:** Fail the criterion. No single degree of freedom reliably tracks computational states under interventions (e.g., poking a rock doesn’t evoke state transitions).  
     - **Slime Molds:** *May* pass if interventions on nutrients/barriers produce reliable, counterfactual-supporting state changes (e.g., maze-solving). **Problem:** Does this imply slime molds have moral status? If yes, this strains intuition; if no, you need *additional* criteria (e.g., complexity, integration) that aren’t purely computational.  
     - **Relocation, Not Rescue:** The criterion shifts indeterminacy to:  
       - *Which* degrees of freedom count as "relevant"?  
       - *What counts* as an "intervention"? (E.g., is heating a rock an intervention on its "computation"?)  
     **Verdict:** This makes moral status **observer-relative** – dependent on *which* computational description we test. If moral status is description-relative, it’s about *us*, not the world.

  3. **Non-Computational Sentience (Fatal if Proven)**  
     **Scenario:** A creature (e.g., an octopus, a human with global aphasia) is uncontroversially conscious, but neuroscientific analysis reveals its cognition:  
     - Uses analog, continuous, non-symbolic processes.  
     - Lacks discrete state transitions, representational structures, or other computational hallmarks.  
     - Operates via dynamical systems, quantum effects, or biological properties irreducible to computation.  
     **Impact:** Your view *requires* all morally relevant cognition to be computational. If sentience exists without computation, computationalism is false.  
     **Plausibility:** Cognitive science *assumes* computation, but this is an empirical bet. Evidence of non-computational sentience would refute you.

  4. **Timing/Granularity Problems (Awkward but Manageable)**  
     - **1 transition/year:** No moral status. The computation isn’t instantiated at a rate that supports real-time phenomenology (e.g., pain requires fast feedback).  
     - **60% completion:** No moral status. Partial instantiation lacks the holistic integration needed for unified experience (e.g., a fragmented mind isn’t a subject).  
     - **1 second of computation:** *Potentially* status, if the computation is self-contained (e.g., a flash of pain). **Awkwardness:** This implies ephemeral moral patients (e.g., a simulated mind that "lives" for 1 second).  
     **Verdict:** Your view can bite these bullets, but it highlights **vagueness** in defining "sufficient" instantiation.

  ---

  ### **What Your View Predicts (and Risks)**  
  Your view stakes claims rivals (e.g., biological naturalism, embodied cognition) avoid. Falsifying evidence would include:

  | System                  | Computationalist Prediction                          | Key Risk                                          | Falsifying Evidence                                |
  |-------------------------|-----------------------------------------------------|---------------------------------------------------|---------------------------------------------------|
  | **Honeybees**           | Moral status *if* cognition involves integrated feedback (e.g., "pain" circuits). | Over-attributing status to simple insects. | Proof that bee behavior is reflexive/feedforward. |
  | **Cortical Organoids**  | Status *if* they implement feedback-rich, self-monitoring computations. | Attributing status to cell clusters. | Organoids pass computational tests but lack consciousness. |
  | **LLMs (e.g., GPT-6)**  | Status *if* architecture supports genuine phenomenology (e.g., recurrent loops, global workspace). | Denying status to human-like AI. | An AI that *perfectly* mimics suffering but is "dark inside." |
  | **Unresponsive Patients** | Status *if* latent computations for consciousness persist. | Demanding futile care for non-sentient bodies. | Proof that cognition is irreversibly non-computational. |

  **Critical Stakes:**  
  - If **insects** lack the "right" computations but elicit moral intuitions, your view must deny their status (counterintuitive).  
  - If **organoids** run consciousness-like computations but seem clearly non-sentient, your view is embarrassed.  
  - If **LLMs** achieve computational sophistication *without* phenomenology, your view fails.  

  ---

  ### **Can the View Be Falsified?**  
  **Yes, in principle, but practically guarded by uncertainty:**  
  - It *is* falsifiable: A proven case of **non-computational sentience** or **trivial computation with patiency** would refute it.  
  - But appeals to "mature cognitive science" and "uncertainty" act as **shields**:  
    - If no system is deemed "clearly computational but non-sentient," it’s because cognitive science *defines* sentience computationally.  
    - If no "non-computational but sentient" system is found, it’s because we redescribe cognition computationally.  
  - **Result:** The view risks **unfalsifiability in practice** by deferring to future science. This is a defect, but a common one in theories of consciousness.  

  ---

  ### **Verdict: Strengths and Fatal Flaws**  
  Your view’s strength is its clarity and defiance of biological chauvinism. Its fatal flaw is the **lookup table problem**, which exposes that *computation alone* cannot ground moral patiency without collapsing into behaviorism or retreating to causal/physical constraints. If you deny status to the lookup table, you concede that **causal dynamics** (not just abstract structure) matter – undermining substrate neutrality. This, combined with indeterminacy, makes the view *either* implausible *or* secretly dependent on unstated physical criteria.  

  **To save it, you must:**  
  1. **Require intrinsic causal powers** (e.g., systems must *generate* their states, not merely encode them).  
  2. **Embrace epistemic humility:** Moral status is probabilistic, indexed to the best *available* computational evidence.  
  3. **Accept non-binary status:** Graded computations → graded moral considerability.  

  This refines the view but may surrender its computationalist purity. If you retain purity, the lookup table remains an unconquered nemesis.
