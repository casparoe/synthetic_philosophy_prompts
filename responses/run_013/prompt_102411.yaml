answer: |-
  ## The Bargaining Shore

  **Voice A:**  
  (From bare rock, cold and sharp)  
  I scrape for crumbs in shadows stark. *(Fallback: Minimal sustenance)*  
  **Voice B:**  
  (From tangled roots, a bitter start)  
  I cling to dust, a withered heart. *(Fallback: Minimal security)*

  **Voice A:**  
  But see! Sun warms the distant crest! *(Ideal: Abundance)*  
  **Voice B:**  
  And stars above promise sweet rest! *(Ideal: Peace/Security)*  
  **Voice A:**  
  A feast laid out where light streams free!  
  **Voice B:**  
  A sheltered home beneath that tree!

  **Voice A:**  
  I need that warmth to truly thrive!  
  **Voice B:**  
  I need that calm to feel alive!  
  **Voice A:**  
  But not midway on this long track... *(Rejects midpoint)*  
  **Voice B:**  
  Nor where the most is stacked up back... *(Rejects Nash/product max)*

  **Voice A:**  
  How far *you* climbed from where you wept... *(Acknowledges B's potential gain)*  
  **Voice B:**  
  How far *you* rose from where you crept... *(Acknowledges A's potential gain)*  
  **Voice A:**  
  Let's measure not the ground we hold,  
  **Voice B:**  
  But share the *promise*, brave and bold!

  **Voice A:**  
  A fraction of *my* sunlit height? *(Fraction of A's ideal journey)*  
  **Voice B:**  
  A fraction of *my* starlit night? *(Equal fraction of B's journey)*  
  **Voice A:**  
  This ground feels warm...  
  **Voice B:**  
  ...This ground feels deep... *(Final meeting point)*
  **Together:**  
  Where distance lost and fraction meet. *(Joint utterance: Proportional gain)*

  ### How this enacts Kalai-Smorodinsky
  *   **Fallbacks Established:** Lines 1-2 clearly show each party's starting misery.
  *   **Ideals Declared:** Lines 3-6 vividly state their maximum aspirations (sun/feast for A, stars/shelter for B).
  *   **Rejection of Alternatives:** Lines 11-12 explicitly reject the midpoint ("midway") and the Nash bargaining solution ("where the most is stacked up back" - maximizing the *product*).
  *   **Mutual Recognition of Potential Gain:** Lines 13-14 focus on the *distance each could travel* from their fallback to their ideal ("How far *you* climbed... How far *you* rose...").
  *   **Proportional Compromise:** Lines 15-18 shift the focus to sharing the *promise* based on measuring their respective journeys ("fraction of *my* sunlit height... fraction of *my* starlit night").
  *   **Meeting Point:** The final couplet (19-20) shows them finding a specific, shared ground ("this ground") where their gains are proportional to their *own* possible journeys ("distance lost and fraction meet"). The joint utterance symbolizes the solution.
