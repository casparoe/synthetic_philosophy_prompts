prompt: |-
  Four times a year the small county historical society I direct mounts a new exhibition, and each time my two-person research staff and I must decide how the past on the walls is to be handled: a mill that closed, a farming community displaced to build the reservoir, the industrialist whose fortune paid for the library that still bears his name. A board of trustees signs off, donors and descendants often have a stake, and our research time is measured in weeks rather than years. The board recently adopted a mission line to the effect that the society exists to make the county more capable of acting well in the present, which I take to be a loose version of Nietzsche's demand that history serve life rather than mummify it; but when I ask what that means for a particular wall label, no one can say, and I suspect the board reads the mission as reassurance of the living rather than the vitality Nietzsche had in mind, which is not at all what the essay on the uses and disadvantages of history for life seems to mean.

  Write me a procedure my staff and I can run on every new exhibition. It should be grounded in Nietzsche's three ways of relating to the past — monumental, antiquarian, and critical — and in what he says each of these does for life and how each turns against it. Give me the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops with a verdict, and the points at which it must hand the decision to a person because the question is one of values rather than facts. Then run it on three cases: the industrialist's library, a dying craft tradition we want to keep alive, and a recent episode of violence that much of the county would rather not have reopened. At least one of the three verdicts should be one we will not like. Close by saying what the procedure cannot decide, and where it should be expected to misfire on a subject Nietzsche never imagined.
reasoning: |-
  We are creating a procedure based on Nietzsche's three modes of history: monumental, antiquarian, and critical.
   Each mode has a positive role (serving life) and a negative role (turning against life) as described by Nietzsche.

   Monumental history:
     Positive: Inspires by showing that greatness was once possible and thus can be again; gives courage for present action.
     Negative: Distorts the past by ignoring context and differences, making the past seem too similar to the present; can lead to fanaticism.

   Antiquarian history:
     Positive: Preserves and venerates the past, giving a sense of rootedness and identity; fosters piety and gratitude.
     Negative: Can become a mere hoarding of the past without discrimination, stifling life by preventing innovation and growth.

   Critical history:
     Positive: Judges and condemns the past to break its hold, allowing for liberation and the creation of new values.
     Negative: Can lead to a destructive rejection of the past, cutting off roots and leaving a vacuum.

   The procedure will consist of a series of questions for each exhibition. We will consider each mode in turn (monumental, antiquarian, critical) and ask:
     - How does this exhibition relate to the past in this mode? (i.e., is it monumental, antiquarian, or critical in its approach?)
     - Does this mode serve life in the present? (positive role)
     - Does it risk turning against life? (negative role)

   We then must balance the three modes and decide if the overall approach serves the mission.

   Steps:

   1. For each of the three modes (monumental, antiquarian, critical), ask:
      a. Is this mode being employed in the exhibition? (If so, how?)
      b. In what way does this employment serve life? (positive)
      c. In what way does this employment risk turning against life? (negative)

   2. After evaluating each mode, ask:
      d. Overall, does the exhibition strike a balance that serves life? Specifically, does it avoid the pitfalls of each mode while harnessing their strengths?

   3. Verdict:
      - If the exhibition, after this analysis, clearly serves life (by inspiring, rooting, or liberating without falling into the negative traps), then it is approved.
      - If it fails in one or more modes (i.e., the negative aspects outweigh the positive, or the positive aspects are absent and the negative ones dominate), then it must be revised.

   4. Handing to a person for values decision:
      - When the question is about what values the exhibition should promote (e.g., whether to condemn a figure, how to balance different perspectives) and there is no factual resolution, then we must hand the decision to the director (or the board) to make a value judgment.

   The procedure stops with a verdict of either "Approve", "Revise", or "Reject". However, at any step where the question is one of values (e.g., what is the 'right' way to present a controversial topic) and not facts, we must hand the decision to the director (or the board) to make a call.

   Now, let's run the procedure on three cases:

   Case 1: The industrialist's library

     a. Monumental: 
          - Employed? Yes, by showcasing the industrialist's achievement (building the library) as an example of greatness that can inspire philanthropy.
          - Serves life? It may inspire current residents to contribute to the community.
          - Risks? It may ignore the context of how the industrialist made his fortune (e.g., exploitation, poor working conditions) and thus distort the past.

     b. Antiquarian:
          - Employed? Yes, because it preserves the history of the library and the industrialist, honoring the past and the donor.
          - Serves life? It fosters a sense of gratitude and continuity with the past.
          - Risks? It may venerate the industrialist uncritically, turning the exhibition into an act of piety that stifles critical discussion about wealth and power.

     c. Critical:
          - Employed? Not in the current plan (as described). We are only celebrating the library without questioning the industrialist's legacy.
          - Serves life? N/A (unless we add critical elements). 
          - Risks? Without critical history, we risk perpetuating an uncritical view that may prevent the community from addressing present-day inequalities.

     d. Overall: 
          The current approach is monumental and antiquarian but lacks critical history. The risks are that it mummifies the past by presenting a one-sided, celebratory narrative. This may not serve life if it prevents the community from critically examining the sources of wealth and their impact. Therefore, we must revise to include critical elements.

     Verdict: Revise. We must add a critical dimension.

     However, note: the decision of how much to criticize the industrialist is a value judgment. We must hand this to the director (or board) to decide the extent of critical content, considering the stakeholders (donors, descendants) and the mission.

   Case 2: A dying craft tradition we want to keep alive

     a. Monumental:
          - Employed? Yes, by presenting the craft as an achievement of human creativity and skill that can inspire current artisans.
          - Serves life? It can inspire people to take up the craft and innovate in the present.
          - Risks? It might romanticize the past and ignore the reasons the craft is dying (e.g., economic changes, impracticality).

     b. Antiquarian:
          - Employed? Yes, by preserving the techniques, tools, and stories of the craft tradition.
          - Serves life? It provides roots and identity, and preserves knowledge that might otherwise be lost.
          - Risks? It might become a museum piece without connection to the present, making it seem only a relic.

     c. Critical:
          - Employed? Not much in the current plan. We might avoid criticizing the craft's decline or the reasons for it.
          - Serves life? A critical approach could question why the craft is dying and whether it is worth preserving, which might lead to innovative adaptations.
          - Risks? Overly critical might devalue the tradition and discourage efforts to preserve it.

     d. Overall:
          We are using monumental and antiquarian modes. To serve life, we need to avoid making the craft a relic and instead make it relevant. We might add a critical edge by discussing the challenges and inviting the audience to think about how to adapt the craft for today. 

     Verdict: Approve, but with a note to include some critical reflection on the craft's current viability and potential adaptations. However, if the critical element is too harsh, it might kill interest. This is a value judgment: how much to emphasize the critical? Hand to the director to decide.

   Case 3: A recent episode of violence that much of the county would rather not have reopened

     a. Monumental:
          - Employed? Possibly, by showing examples of resilience or heroism during the violence. But it might be hard to find a positive monumental angle without being insensitive.
          - Serves life? It could inspire the community to overcome trauma and work for peace.
          - Risks: It might trivialize the suffering or create a false narrative of triumph.

     b. Antiquarian:
          - Employed? We might preserve the facts and artifacts of the event to honor the victims and remember what happened.
          - Serves life? It roots the community in the reality of the event and fosters a shared memory.
          - Risks: It might fixate on the past without moving forward, reopening wounds without healing.

     c. Critical:
          - Employed? Essential for this case. We must critically examine the causes, the response, and the ongoing impact.
          - Serves life? It can liberate the community from repeating the same mistakes and spur change.
          - Risks: It might be seen as assigning blame, causing division, and reopening trauma.

     d. Overall:
          This exhibition must be handled carefully. It needs the critical mode to serve life by fostering understanding and change. However, the antiquarian mode is necessary to preserve the memory, and monumental might be used to show hope. The risks are high in all modes. 

          We must ask: does the exhibition serve life by helping the county act well in the present? If it only reopens wounds without offering a path forward, it may not. But avoiding the topic also doesn't serve life.

          Verdict: This is the one we might not like. We may have to do it, but very carefully. The procedure says: we must include critical history to avoid mummifying the event, but we must balance with the other modes. However, the board and stakeholders might push back. 

          The verdict is: Approve, but with revisions to ensure:
            - The critical mode is present but not inflammatory.
            - The antiquarian mode preserves the facts without sensationalism.
            - The monumental mode, if used, should focus on resilience and hope without ignoring the tragedy.

          But note: the decision to even do this exhibition is a value judgment. The procedure can only evaluate the proposed exhibition. If the exhibition as planned avoids critical history, then we must revise. If the community is not ready, the exhibition might turn against life. This is a point where we must hand the decision to the director and board because it is about values and the current state of the community.

   What the procedure cannot decide:
     - It cannot decide what values should guide the society beyond the mission. For example, if the board wants to avoid controversy at all costs, the procedure might still call for critical history, but the board may override.
     - It cannot resolve conflicts between stakeholders when they have incompatible values.

   Where it might misfire on a subject Nietzsche never imagined:
     - Modern issues like digital history, virtual reality exhibitions, or topics involving current identity politics. For example, an exhibition on climate change: Nietzsche did not address such global, future-oriented crises. The procedure might struggle to balance the modes when the past is not the main focus (the future is). Also, in cases of contested memory (e.g., colonial history) where one group's monumental history is another's critical, the procedure may not resolve the conflict without a clear value judgment.

   Final note: The procedure is a tool to ensure we consider the three modes and their pitfalls. It does not replace human judgment but structures the reflection.
answer: |-
  ### Procedure Based on Nietzsche's Three Modes of History  
  This procedure evaluates exhibitions through Nietzsche’s lenses—**monumental**, **antiquarian**, and **critical** history—assessing how each serves or harms "life" (Nietzsche’s term for active, generative vitality). For each mode, we ask:  
  1. **Is it employed?** (How?)  
  2. **Does it serve life?** (Does it inspire action, foster belonging, or enable liberation?)  
  3. **Does it turn against life?** (Does it distort, stifle, or destructively reject the past?)  

  #### Steps:  
  1. **Question 1 (Monumental Analysis):**  
     - *Question:* "Does the exhibition present the past as a source of **inspiration for present action**? If so, how?"  
     - *Sufficient Answer:* Identifies specific figures/events framed as exemplary (e.g., "This entrepreneur’s success shows we can achieve greatness").  
     - *Serves Life?* If it motivates courage/ambition without erasing context.  
     - *Turns Against Life?* If it romanticizes the past, ignores flaws, or pressures conformity to an idealized standard.  
     - *Handoff to Values:* If the "greatness" celebrated conflicts with modern ethics (e.g., celebrating a slave owner’s philanthropy).  

  2. **Question 2 (Antiquarian Analysis):**  
     - *Question:* "Does the exhibition **preserve and venerate** the past as intrinsically valuable? If so, how?"  
     - *Sufficient Answer:* Highlights rituals, artifacts, or traditions treated with reverence (e.g., "This craft embodies our ancestors’ wisdom").  
     - *Serves Life?* If it nurtures identity, continuity, or gratitude.  
     - *Turns Against Life?* If it resists change, excludes marginalized voices, or treats the past as untouchable.  
     - *Handoff to Values:* When deciding whose heritage is "worthy" of preservation (e.g., prioritizing settler narratives over Indigenous ones).  

  3. **Question 3 (Critical Analysis):**  
     - *Question:* "Does the exhibition **judge and dismantle** harmful legacies? If so, how?"  
     - *Sufficient Answer:* Exposes oppression, contradictions, or ongoing consequences (e.g., "This library was built on exploited labor").  
     - *Serves Life?* If it frees the present from destructive traditions.  
     - *Turns Against Life?* If it breeds nihilism, denies historical complexity, or alienates the community.  
     - *Handoff to Values:* When weighing reconciliation vs. accountability (e.g., retraumatizing victims of violence).  

  4. **Final Synthesis:**  
     - *Question:* "Does the exhibition’s balance of monumental, antiquarian, and critical modes **expand the county’s capacity to act well**?"  
     - *Verdict Threshold:*  
       - **Approve** if all three modes serve life without dominating or turning against it.  
       - **Revise** if one mode is absent or turns against life (e.g., critical history missing in a celebratory narrative).  
       - **Reject** if the exhibition promotes mummification (e.g., uncritical antiquarianism) or nihilism (e.g., destructive criticism without hope).  
     - *Stop Here*: If the verdict is clear (e.g., all modes harmonize).  
     - *Handoff to Person*: If synthesis requires prioritizing one Nietzschean mode over others (a values choice).  

  ---

  ### Case Applications  
  **Case 1: The Industrialist’s Library**  
  - **Monumental:**  
    - *Q1:* Yes—frames the industrialist as a visionary benefactor ("His generosity built our library!").  
    - *Serves Life?* Inspires civic philanthropy.  
    - *Turns Against Life?* Ignores labor exploitation in his mills; risks hero-worship.  
  - **Antiquarian:**  
    - *Q2:* Yes—venerates the library as a timeless landmark.  
    - *Serves Life?* Fosters local pride.  
    - *Turns Against Life?* Silences workers’ stories; treats the library as neutral rather than contested.  
  - **Critical:**  
    - *Q3:* No—avoids his harmful practices.  
    - *Serves Life?* Fails to liberate the present from inequity myths.  
  - **Synthesis:**  
    - *Verdict:* **REVISE**. Critical mode is absent, allowing monumental/antiquarian modes to turn against life by sanitizing history.  
    - *Values Handoff:* To the director/board—how harshly should we critique the industrialist? (e.g., "Do we prioritize donor feelings or historical justice?").  

  **Case 2: Dying Craft Tradition**  
  - **Monumental:**  
    - *Q1:* Yes—elevates artisans as cultural heroes ("Their skill defies modernity!").  
    - *Serves Life?* Sparks interest in reviving the craft.  
    - *Turns Against Life?* Romanticizes pre-industrial labor; obscures reasons for its decline (e.g., poverty).  
  - **Antiquarian:**  
    - *Q2:* Yes—meticulously documents tools/techniques.  
    - *Serves Life?* Preserves intangible heritage.  
    - *Turns Against Life?* Treats preservation as an end, not a means to innovation.  
  - **Critical:**  
    - *Q3:* Partial—notes economic pressures killing the craft but avoids deeper critique (e.g., capitalism’s role).  
    - *Serves Life?* Invites solutions (e.g., sustainable markets).  
  - **Synthesis:**  
    - *Verdict:* **APPROVE** (with minor revisions). All modes serve life, but critical analysis should be sharper to avoid nostalgia.  

  **Case 3: Recent Episode of Violence**  
  - **Monumental:**  
    - *Q1:* No—avoids framing perpetrators/victims as "exemplary."  
    - *Serves Life?* —  
    - *Turns Against Life?* —  
  - **Antiquarian:**  
    - *Q2:* Yes—archives evidence (photos, testimonies).  
    - *Serves Life?* Honors victims; ensures truth isn’t buried.  
    - *Turns Against Life?* Risks retraumatization if presented voyeuristically.  
  - **Critical:**  
    - *Q3:* Yes—confronts systemic causes (e.g., racism, neglect).  
    - *Serves Life?* Empowers action against injustice.  
    - *Turns Against Life?* Could deepen divisions if handled insensitively.  
  - **Synthesis:**  
    - *Verdict:* **APPROVE** (you may not like this). The critical/antiquarian modes serve life by fighting silence, but monumental absence is wise—no "heroes" here.  
    - *Values Handoff:* To trauma specialists—how to present stories without harming victims?  

  ---

  ### What the Procedure Cannot Decide  
  1. **Non-Nietzschean Values Conflicts:** When Nietzsche’s "life" clashes with modern ethics (e.g., if "serving life" demands celebrating a eugenicist’s scientific achievements).  
  2. **Future-Oriented Topics:** Nietzsche never imagined climate change or AI. Exhibitions on these might misfire by over-relying on critical history (fostering paralysis) or monumental history (naïve techno-optimism).  
  3. **Sacred/Unspeakable Topics:** For events like genocide, the procedure may demand critical history, but local values could veto it as "too painful." Here, Nietzsche’s call to "serve life" becomes a moral quandary beyond the framework.  

  **Final Note:** This procedure guards against mummification by forcing engagement with all three modes, but it cannot resolve every tension. When values clash, the director/board must choose—and own—the balance between historical truth and communal peace.
