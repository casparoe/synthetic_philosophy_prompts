prompt: |-
  Bit of an odd one. I'm a second-year biology student, and my flatmate is doing a philosophy MA, so we end up arguing about this sort of thing over dinner, and there's a pattern I keep bumping into that I cant find a word for. Here's the setup. Everyone agrees you can read the order of amino acids in a protein off the base sequence of a gene. Everyone also agrees you can read a tree's age off its rings. In both cases there's a reliable correlation you can exploit to get from one thing to the other. But nobody says the tree rings code for the tree's age, and almost everyone, including my textbooks, says the gene codes for the protein. When I push on what the difference is supposed to be, the answers keep shifting: it's that the mapping from bases to amino acids is arbitrary, or it's that the cell actually uses the sequence as a representation, or it's that the sequence can be wrong -- a mutation can "say" the wrong thing in a way that a tree ring can't be wrong about the age of its tree. My flatmate insists the last one is the real one and the other two are distractions; my genetics lecturer says the whole thing is a metaphor people should stop reifying. And when I say fine, it's a metaphor, but it's clearly doing work in the explanations, everyone nods, and then uses it literally again in the next sentence.

  So what I want to know is whether there's an established name for the thing I'm circling here: a physical arrangement that is supposed to be about something, where being about it requires more than a correlation but less than a convention. If there is such a name, which of those three criteria (arbitrariness, use, being-able-to-be-wrong) actually belongs to it, and what happens to the other two -- do they get demoted to symptoms, or to something else entirely? I'd like the nearest existing concepts spelled out and exactly how each one falls short of what I've described, and if nothing quite fits, then coin a term and tell me where its edges are: what's a borderline case, what's clearly outside it, and what turns on the choice. I'm not after a label on its own and definitely not a reading list -- I want the carving. Keep the whole thing under 400 words.
reasoning: |-
  Okay, the user is a biology student who's tangled in a debate with their philosophy flatmate about the concept of "coding" in genetics. They've noticed that while both gene sequences and tree rings have reliable correlations—genes to proteins, rings to age—only genes are said to "code for" the outcome. They've heard three possible distinctions: arbitrariness (like genetic code being arbitrary symbols), functional use (cells treating sequences as instructions), and error-proneness (mutations can be "wrong"). Their flatmate champions error-proneness, their lecturer dismisses "coding" as mere metaphor, but everyone keeps using it literally. The user wants a precise term for a physical arrangement that's "about" something beyond correlation but short of full convention, and clarity on which criteria define it.

  First, I need to unpack the core issue. The user is circling a philosophical concept in biosemiotics—how physical things acquire "aboutness" (intentionality). In biology, genes are treated as carrying information, while tree rings are just correlates. The key might lie in teleosemantics: the idea that something represents a state if it has the function of indicating it due to natural selection. For genes, the DNA sequence has the evolved function to specify amino acids; errors (mutations) disrupt this function, making "wrongness" possible. Tree rings correlate with age, but that correlation wasn't selected for; it's a byproduct, so errors don't apply in the same way. 

  Arbitrariness matters too—genetic code is arbitrary (different codons could evolve for the same amino acid), unlike rings directly reflecting growth. But the flatmate is right that error-proneness is central: without the possibility of malfunction, there's no "aboutness." Functional use ties into this—cells "use" the sequence because evolution shaped machinery (like ribosomes) to interpret it. 

  The existing term "teleofunction" (purpose derived from evolution) captures the "aboutness" part. "Biosemiotic sign" is broader. For precision, "teleosemantic information" fits best: it requires all three—arbitrariness (contingent mapping), use (evolutionary role), and error-proneness (via malfunction). 

  Borderline cases: bee dances (arbitrary, used, can be "wrong" if misleading) clearly in; tree rings out (no evolved function for indicating age). Heartbeats indicating health might be borderline—correlation is functional but not arbitrary. 

  The user's frustration with shifting explanations makes sense. Their lecturer calls it metaphor, but in practice, "coding" is indispensable because it captures the evolutionary intent—genes aren't just correlated, they're designed to specify. Nailing this as "teleosemantic information" gives them the carving they want: a naturalized "aboutness" rooted in function, with error-proneness as the litmus test.
answer: |-
  Here's the conceptual carving you're seeking:

  The established concept is **teleosemantic information** (or **teleofunction**). It denotes a physical state that *carries information* or *has content* **because of its evolved biological function**. This requires:

  1.  **Evolutionary History:** The state exists because it was selectively advantageous for producing a specific outcome (the "target").
  2.  **Error-Proneness (Flatmate's Point):** This is **central**. The state can *malfunction* or be *defective* in its function – producing the wrong outcome (e.g., a mutation produces a non-functional protein). This possibility of being "wrong" is the hallmark of "aboutness". Tree rings lack this; a thin ring isn't *wrong* about a dry year, it's just *caused* by it.
  3.  **Functional Use (Lecturer's Metaphor Point):** The correlation is actively *used* by the system (the cell) *as per its design* to produce the target. The genetic code is a mechanism *for* specifying proteins.

  **Where the other criteria fit:**

  *   **Arbitrariness:** Is often present (e.g., codon assignments *are* arbitrary) and facilitates evolvability, but **isn't strictly necessary**. A non-arbitrary signal could still be teleosemantic if it functions reliably *because* of selection and can malfunction (e.g., some hormone-receptor interactions).
  *   **Correlation:** Is necessary but **insufficient**. Tree rings correlate, but lack teleofunction.

  **The Carving:**

  *   **Core Concept:** Teleosemantic Information / Teleofunction (carries content due to evolutionary function, allowing for error).
  *   **Clearly In:** DNA sequence for protein (evolved function, used by machinery, mutations can be "wrong").
  *   **Clearly Out:** Tree rings for age (correlation is a byproduct of growth mechanics, no evolved "signaling" function, can't be "wrong").
  *   **Borderline:** Bee dance for location. It *has* evolved function, can be "wrong" (e.g., defective dancer), and is used by hive-mates. It's teleosemantic, though less "coded" than DNA. Bird alarm calls are similar.
  *   **What Turns on the Choice:** Using "codes for" implies **normativity** – there's a *correct* outcome the state is *supposed* to produce. Teleosemantics grounds this normativity in evolution. Without it (like tree rings), there's no "supposed to," just cause-and-effect. Your lecturer is right it's *grounded* in biology, but wrong to dismiss it entirely; the metaphor highlights the functional, normative aspect absent in mere correlation.
