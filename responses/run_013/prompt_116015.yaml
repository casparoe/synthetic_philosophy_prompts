prompt: |-
  You are a philosopher of moral responsibility specializing in the ethics of blame, preparing to interview a guest for a podcast episode. The guest defends a distinctive position: she argues that the standing to blame is neither a matter of the blamer's sincerity nor a matter of the blamer's own record, but of a single condition she calls reciprocity — a blamer has standing to blame someone only if she would accept blame on the same grounds from that very person. On her view, a hypocrite's blame is not merely weaker or less persuasive; it is silenced: the person blamed is entitled to treat the criticism as not addressed to her at all. She also holds that complicity (being implicated in the same practice) leaves standing intact, whereas hypocrisy destroys it, and that states have no standing to blame at all, only the power to sanction.

  I want eight to ten interview questions that do not let her simply restate the view. Before drafting, brainstorm the strongest lines of attack on this position — among them the fact that even a hypocrite's blame can be accurate, the worry that almost no one could satisfy her reciprocity condition, cases of blaming on behalf of others, and the asymmetry between self-blame and blaming another — then turn each into a question that presses her. For at least three of them, add a follow-up keyed to the reply she is most likely to give (for instance, if she retreats to saying standing comes in degrees, or that the condition is ideal rather than actual). Include one question that draws out what her view implies about whether a state may blame a convicted offender, and one that tests whether her reciprocity condition can be met by someone who has never occupied the position of the person she blames. Keep each question concrete, pointed, and short enough to ask on air; no questions about how she came to the topic or what drew her to it.
reasoning: |-
  Okay, the user wants me to create interview questions for a podcast guest who has a distinctive view on moral responsibility and blame. The guest's position centers on "reciprocity" as the sole condition for standing to blame - meaning you can only blame someone if you'd accept blame from them on the same grounds. 

  Hmm, this is an interesting philosophical position with several counterintuitive implications. The user wants me to brainstorm strong objections first before turning them into pointed interview questions. They specifically mention concerns about hypocrites possibly giving accurate blame, the reciprocity condition being too strict, problems with blaming on behalf of others, and asymmetries between self-blame and blaming others.

  Let me think through the key vulnerabilities in this reciprocity theory. First, the accuracy objection seems powerful - even if a hypocrite blames me for cheating while they cheat themselves, their criticism might still be factually correct about my wrongdoing. Does their hypocrisy really make my wrongdoing disappear? 

  Second, the condition feels unrealistically demanding. If I've never been in your exact situation (say, as a childless person blaming a negligent parent), does that permanently strip me of standing? That would make most blame illegitimate. 

  Third, the view struggles with third-party blame. If I see someone abusing a child, but the abuser wouldn't accept blame from me (a stranger), does that mean I can't meaningfully blame them? That seems morally problematic.

  Fourth, self-blame creates tension. The guest says reciprocity requires willingness to accept blame from the person you're blaming. But if I blame myself, that would require being willing to accept blame... from myself? That circularity needs unpacking.

  Fifth, the complete denial of state standing is radical. When a court convicts a murderer, is that just "sanctioning" without moral blame? What about state apologies for historical injustices - does that imply states can't meaningfully blame themselves either?

  The user also wants follow-ups anticipating likely defenses. If the guest tries to soften her view (e.g., saying standing comes in degrees), we should press why reciprocity remains fundamental. If she appeals to hypothetical willingness, we should test how that differs from actual reciprocity.

  For the state question, we can highlight the contradiction: if states can't blame but can sanction, yet sanctions express blame, how does her view avoid inconsistency? For the "never occupied the position" issue, we can use vivid examples like blaming someone for wartime atrocities they committed but you've never faced.

  The questions need to be concise and avoid letting her restate her thesis. Each should force her to confront implications. The follow-ups should block easy retreats - if she waters down reciprocity, we ask why it's still necessary; if she distinguishes hypothetical/actual reciprocity, we ask how we assess hypothetical willingness.

  This approach should create a dynamic interview that really tests the theory's limits while staying accessible for podcast listeners. The concrete examples will help listeners grasp the philosophical tensions.
answer: |-
  Here are nine pointed interview questions with embedded challenges, including follow-ups for key exchanges:

  1.  **Accuracy Challenge:** Your view implies that a hypocrite's accurate criticism (e.g., "You stole!" from a thief) carries *no moral standing* whatsoever. Doesn't this mean the victim of the theft is strangely *disentitled* to take the hypocrite's accurate description of their wrongdoing seriously, even though it's true? How is this not a dangerous divorce of moral standing from moral truth?  
      *Likely Retreat (Sincerity/Truth):* If you say the victim *can* recognize the *truth* of the accusation but not its *moral force* as blame, doesn’t that create an unsustainable split? Isn't recognizing the truth of "you wrongly stole" precisely what *constitutes* accepting the moral blame?

  2.  **Demandingness / "Never Occupied the Position":** Imagine a lifelong pacifist who has never faced combat blaming a soldier for a war crime. By your reciprocity condition, if the soldier wouldn't accept blame from the pacifist (perhaps saying "You don't know what it's like!"), the pacifist lacks standing. Does this mean only soldiers can morally blame other soldiers for war crimes? Isn't this an impossible standard that silences vital moral criticism?  
      *Likely Retreat (Hypothetical Reciprocity):* If you appeal to whether the pacifist *would* accept blame *if* they were in the soldier’s shoes, how is this different from a standard impartiality condition? Doesn't this move abandon the core idea of reciprocity *with this specific person*?

  3.  **Third-Party Blame / Victim Advocacy:** A bystander witnesses a brutal assault. The assailant certainly wouldn't accept blame from this stranger. By your view, does the bystander completely lack the standing to blame the assailant *on behalf of the victim*? How can your account justify intervening or condemning wrongdoing when we aren't the direct victim and the wrongdoer rejects our authority?

  4.  **Self-Blame Asymmetry:** Your condition requires that to blame X, you must be willing to accept blame *from X* on the same grounds. What about blaming *yourself*? Applying reciprocity, this would require you to be willing to accept blame *from yourself* – which seems tautological and vacuous. Does your reciprocity condition simply collapse or become irrelevant when the blamer and blamee are the same person? What does this say about the structure of self-blame versus blaming others?

  5.  **Complicity vs. Hypocrisy Distinction:** You say complicity (e.g., two thieves blaming each other) preserves standing, while hypocrisy destroys it. But if Thief A blames Thief B, isn't A *also* being hypocritical unless they simultaneously blame themselves? Why does merely sharing the *practice* immunize standing from the charge of hypocrisy that arises from A's *own* ongoing thieving? Doesn't complicity often *entail* hypocrisy?

  6.  **The "Ideal Reciprocity" Retreat:** If pressed on the demandingness of actual reciprocity (e.g., the pacifist), you might suggest we need only *hypothetical* or *ideal* willingness to accept blame. But if the condition becomes purely counterfactual ("*Would* you accept blame *if*..."), how is this meaningfully different from a blamer's commitment to impartiality or fairness? Doesn't this lose the distinctive "reciprocal exchange" element central to your view?

  7.  **State Sanction vs. Blame:** You say states lack standing to blame, only power to sanction. When a judge pronounces sentence on a convicted murderer, stating "Society condemns your heinous act," is this condemnation merely a procedural formality with *no* genuine moral blame attached? If the state *cannot* blame, how can it meaningfully apologize for historical injustices? Isn't state condemnation a real social practice your view dismisses?

  8.  **Degrees of Standing Retreat:** If you concede that standing might come in degrees (e.g., the hypocrite has *some* diminished standing), doesn't this fatally undermine your core claim that hypocrisy *silences* blame, rendering it "not addressed"? If it's just weaker, why the strong "silencing" metaphor? Doesn't admitting degrees collapse your view into more conventional accounts focused on sincerity or authority?

  9.  **The "Virtuous Blamer" Problem:** If satisfying the reciprocity condition is exceedingly rare (due to human fallibility, differing circumstances, etc.), does your view imply that morally authoritative blame – blame with full standing – almost never actually occurs in human interaction? Isn't this an implausibly skeptical conclusion about a fundamental aspect of our moral practices?

  **Key Presses Embedded:**
  *   **Accuracy:** Q1 (Truth vs. Force).
  *   **Demandingness / Never Occupied Position:** Q2 (Pacifist/Soldier) & Q6 (Hypothetical Retreat).
  *   **Blaming for Others:** Q3 (Bystander/Assault).
  *   **Self-Blame Asymmetry:** Q4.
  *   **State Blame:** Q7 (Judge's Condemnation & State Apologies).
  *   **Degrees Retreat:** Q8.
  *   **Implausible Rarity:** Q9.

  These questions force the guest to confront concrete counterexamples and potential inconsistencies, moving beyond restatement into defending the viability and implications of her distinctive reciprocity condition. They specifically target the silencing claim, the state exclusion, and the practical possibility of meeting the condition.
