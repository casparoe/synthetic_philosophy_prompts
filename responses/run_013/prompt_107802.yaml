  **IN RE GUARDIANSHIP OF JEREMY BOOKBINDER**  
  **No. 23-1015**  
  **COURT OF APPEALS OF THE STATE OF NEW VERITAS**  
  **(Fictitious Reporter Citation: 999 N.V. App. 42)**

  **Procedural History and Facts**  
  Jeremy Bookbinder, then 45 and indisputably competent, executed a comprehensive advance directive. The document specified, with notable precision, his permitted residence ("The Gumption Falls Senior Haven"), diet ("Pureed meals only, no asparagus"), approved visitors ("List A only; specifically excluding 'any romantic partner contemporaneous with execution'"), and an explicit bar against marrying "Ms. Eleanor Vance, or any woman substantially similar in disposition." Critically, it mandated that should he ever become "not himself," he be relocated to Gumption Falls and read aloud Chapter 7 of "Moby-Dick" annually. Mr. Bookbinder, now 70, exhibits early dementia with fluctuating capacity. On lucid days, he articulates clear desires: residing independently, eating steak, marrying Ms. Vance (his companion of 15 years), and avoiding Gumption Falls and Melville entirely. His court-appointed guardian, citing the directive, refuses these requests. Mr. Bookbinder petitioned for termination of the directive's enforcement. The Probate Court upheld the directive. He appeals.

  **Majority Opinion (Per Curiam)**  
  This Court affirms. An advance directive is the paramount expression of personal autonomy, allowing an individual to dictate future care when capacity wanes. Mr. Bookbinder, at 45, possessed full agency and foresight. His directive reflects a deliberate bargain with his future self, ensuring his values prevailed during anticipated incapacity. The Probate Court correctly recognized the directive’s binding nature; to disregard it would be to disrespect the autonomy Mr. Bookbinder vigorously exercised. The fact that his current expressed wishes conflict merely underscores the very diminishment of judgment the directive anticipated and sought to govern. His present preferences, even on lucid days, represent the compromised decision-making he wisely sought to avoid.

  The contention that Mr. Bookbinder is now "different" misunderstands the continuity of personhood. The law recognizes Jeremy Bookbinder as a single legal entity. His directive speaks for him *now* precisely because he *is* the same person who authored it. His current objections, while sincerely felt during lucidity, stem from the cognitive decline he explicitly sought to guard against through his directive. To prioritize these transient expressions over his clear, competent prior instructions would invite chaos, allowing the compromised self to override the reasoned choices of the capable self.

  Furthermore, the directive falls squarely within permissible bounds. While the law rightly voids agreements constituting perpetual servitude, this is no such pact. It is a carefully crafted plan for well-being during incompetence. The specific provisions – residence, diet, social restrictions – are rationally related to preserving the identity and preferences Mr. Bookbinder defined at his peak. The requirement for "Moby-Dick" is no different in principle than specifying religious texts; it reflects his core intellectual identity. The objection that Mr. Bookbinder could not foresee his precise circumstances at 70 is unavailing; the very purpose of such directives is to provide guidance *despite* unforeseen future states. The Probate Court faithfully applied the directive in Mr. Bookbinder’s best interests, as defined by his own competent hand. Affirmed.

  **Dissent (Judge Stone)**  
  The Majority’s reasoning, while earnest, founders on a fundamental contradiction it fails to perceive. It first posits that Mr. Bookbinder is the *same* person now as at 45, thus his past directive binds his present self. Yet, it simultaneously argues his present wishes must be disregarded *because* he is *not* the same – he is compromised. The Majority cannot have it both ways.

  If Mr. Bookbinder is truly the *same* person, then his present competent expressions of autonomy, made during lucid intervals when he understands his situation and clearly articulates contrary desires, must carry significant weight. The law protects *present* autonomy. To silence him now based solely on a 25-year-old document, drafted in ignorance of his current relationships, health, and preferences, elevates the ghost of past autonomy over the living will. We do not enforce other contracts where one party, decades later and under radically changed conditions, expressly and competently repudiates them, particularly when they govern fundamental life choices akin to residence and marriage. Calling this "identity preservation" does not negate its resemblance to a dead hand controlling a living man.

  Conversely, if the Majority implicitly concedes the 70-year-old with dementia is *not* the same person as the 45-year-old author – a view suggested by its dismissal of his current wishes as "compromised" – then the directive loses its foundation. The 45-year-old had no legal authority to dictate the life of a different, albeit closely related, individual. The directive is not a conveyance of property; it is an instruction governing the life of a person the law currently recognizes as Jeremy Bookbinder. If he is truly different now, the earlier document is irrelevant.

  The uncomfortable truth is that the law demands we treat him as one person, yet his directive and his current pleas reveal two distinct sets of values and desires separated by time and cognitive change. The Majority resolves this by allowing the state, via the guardian, to choose *which* version of Jeremy Bookbinder it will recognize as authoritative – the past competent self, silencing the present self even during competence. This grants the state a metaphysical discretion masquerading as deference to autonomy, with profoundly troubling implications for liberty. I would reverse and remand for a determination of his best interests *based on his current condition and expressed competent wishes*, giving due weight, but not absolute control, to the directive’s more traditional medical provisions.

  **Order**  
  The judgment of the Probate Court is AFFIRMED. The Guardian shall continue to enforce the terms of the advance directive dated April 1, 1998. Costs to Appellant.
