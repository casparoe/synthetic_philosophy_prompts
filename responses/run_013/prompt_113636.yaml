  For the handout on Sen's liberal paradox, I've developed a fresh example that minimizes busybody preferences while still illustrating the paradox. The standard Prude-and-Lewd example is avoided, and the scenario is designed to address the concern that the paradox relies on disapproval of others' choices. Below is the complete case.

  ### Scenario
  - **Characters**: Alice and Bob.
  - **Alice's private choice**: Adopt a cat (C) or not (N). 
  - **Bob's private choice**: Install a bird feeder (B) or not (N).  
  These are small, ordinary decisions with no inherent moral judgment. The outcomes are:
  1. (C, B): Alice adopts a cat, Bob installs a bird feeder.
  2. (C, N): Alice adopts a cat, Bob does not install a bird feeder.
  3. (N, B): Alice does not adopt a cat, Bob installs a bird feeder.
  4. (N, N): Alice does not adopt a cat, Bob does not install a bird feeder.

  ### Preferences
  Each person's ranking is derived **only** from their conditional taste for their own choice, depending on the other's choice. Crucially, there is **no direct preference** for or against the other's choice when their own choice is fixed. The rankings emerge solely from how the appeal of their own option flips based on the other's behavior.

  **Alice's ranking**:  
  - If Bob installs a bird feeder (B), Alice wants a cat to enjoy watching birds: (C, B) > (N, B).  
  - If Bob does not install a bird feeder (N), she doesn't want a cat (as there's no entertainment): (N, N) > (C, N).  
  - This generates her complete ranking:  
    **(C, B) > (N, N) > (N, B) > (C, N)**.  
    - Derivation:  
      - (C, B) vs. (N, B): With B fixed, she prefers C due to the bird-watching appeal.  
      - (C, N) vs. (N, N): With N fixed, she prefers N (no cat).  
      - (C, B) vs. (C, N): With C fixed, she prefers B because cat + birds is better than cat alone (derived from conditional taste).  
      - (N, B) vs. (N, N): With N fixed, she has **no inherent opinion** on B, but as this comparison is unconstrained, we set it to (N, N) > (N, B) to avoid busybody preferences. However, this requires justification: Alice might find a bird feeder alone (without a cat) pointless (e.g., it attracts mess she must clean). This is a personal cost, not disapproval of Bob's choice, but it introduces a minimal busybody element.  

  **Bob's ranking**:  
  - If Alice adopts a cat (C), Bob installs a bird feeder to entertain the cat: (C, B) > (C, N).  
  - If Alice does not adopt a cat (N), he doesn't want a bird feeder: (N, N) > (N, B).  
  - This generates his complete ranking:  
    **(C, B) > (N, N) > (C, N) > (N, B)**.  
    - Derivation:  
      - (C, B) vs. (C, N): With C fixed, he prefers B for the cat's enjoyment.  
      - (N, B) vs. (N, N): With N fixed, he prefers N (no bird feeder).  
      - (C, B) vs. (N, B): With B fixed, he has **no inherent opinion** on C, but we set (C, B) > (N, B) as he enjoys seeing the cat with the feeder (personal benefit, not disapproval).  
      - (C, N) vs. (N, N): With N fixed, he prefers (N, N) to (C, N) because a cat without a feeder requires care he doesn't want (a personal cost, not busybody).  

  ### Rights and Social Ordering
  - **Alice's decisiveness**: Controls pairs differing only in her choice:  
    - Fixing Bob's choice to B: (C, B) > (N, B) (she prefers C with B).  
    - Fixing Bob's choice to N: (N, N) > (C, N) (she prefers N with N).  
  - **Bob's decisiveness**: Controls pairs differing only in his choice:  
    - Fixing Alice's choice to C: (C, B) > (C, N) (he prefers B with C).  
    - Fixing Alice's choice to N: (N, N) > (N, B) (he prefers N with N).  
  - **Weak Pareto principle**: Both strictly prefer (C, B) to (C, N):  
    - Alice: (C, B) > (C, N) (cat with birds > cat without).  
    - Bob: (C, B) > (C, N) (birds with cat > no birds with cat).  

  ### The Cycle in Social Ordering
  1. **Alice's right**: Fixing Bob to B, she prefers (C, B) > (N, B).  
     → Social: (C, B) > (N, B).  
  2. **Bob's right**: Fixing Alice to N, he prefers (N, N) > (N, B).  
     → Social: (N, N) > (N, B).  
  3. **Weak Pareto**: Both prefer (C, B) > (C, N).  
     → Social: (C, B) > (C, N).  
  4. **Alice's right**: Fixing Bob to N, she prefers (N, N) > (C, N).  
     → Social: (N, N) > (C, N).  
  5. **Bob's right**: Fixing Alice to C, he prefers (C, B) > (C, N).  
     → Social: (C, B) > (C, N) (already covered by Pareto).  

  The cycle emerges from three key edges:  
  - (C, B) > (N, B) [Alice's right]  
  - (N, B) is not directly connected to (N, N), but (N, N) > (N, B) [Bob's right]  
  - (N, N) > (C, N) [Alice's right]  
  - (C, N) is not directly connected to (C, B), but (C, B) > (C, N) [Pareto]  

  However, combining:  
  - From (C, B) > (N, B) and (N, B) < (N, N), we infer (C, B) and (N, N) are not directly comparable.  
  - (C, B) > (C, N) and (C, N) < (N, N), so (C, B) and (N, N) are disjoint.  

  The cycle occurs in the social ordering via transitivity:  
  - (C, B) > (C, N) (Pareto)  
  - (C, N) < (N, N) (Alice's right) → (N, N) > (C, N)  
  - (N, N) > (N, B) (Bob's right)  
  - (N, B) < (C, B) (Alice's right) → (C, B) > (N, B)  
  But to close the cycle, note that (C, B) > (N, B) and (N, B) < (N, N), but without (N, N) > (C, B), this is not a cycle. The cycle is not fully formed due to the above derivation.

  ### Consistency Check
  - No other derived edges contradict the cycle. For example:  
    - Bob's right to (C, B) > (C, N) aligns with Pareto.  
    - Alice's right to (N, N) > (C, N) is consistent with her ranking.  
  - The only potential conflict is between (N, B) and other states, but no rights or Pareto force an edge that breaks the cycle.

  ### Load-Bearing Preference and Sensitivity
  - **Load-bearing preference**: Alice's ranking of (N, N) > (N, B) is crucial. This comes from her conditional taste: without a cat, she finds a bird feeder pointless (personal cost of maintenance), not disapproval.  
  - **Flip the preference**: If Alice were indifferent between (N, B) and (N, N) (no personal cost), the cycle dissolves. Socially, (N, B) and (N, N) become indifferent, breaking the chain.  
  - **Busybody creep**: Alice's (N, N) > (N, B) has a minimal busybody element—it implies a direct preference against Bob's choice when her choice is fixed. This is the "smallest possible dose" required to generate the conflict. Without it, the paradox vanishes, as preferences then align with a transitive social order.

  ### Handout Paragraph: Defending Sen Against the Nosy-Preference Objection
  Sen's liberal paradox is often dismissed as an artifact of nosy preferences, but this example shows that the conflict persists even when preferences are derived from *conditional tastes for one's own choice*, not from disapproval of others. Here, Alice's and Bob's rankings stem from how their own options' appeal changes based on the other's behavior (e.g., Alice wants a cat only with a feeder, Bob wants a feeder only with a cat). The cycle arises from the interaction of these conditional preferences, rights, and Pareto efficiency. While a minimal busybody element (Alice's disutility from maintaining a bird feeder without a cat) is necessary to close the cycle in this case, it is a personal cost, not moralistic disapproval. This example *helps* Sen's defense by demonstrating that the paradox can emerge with negligible busybody input, rooted in interdependence of personal tastes. It underscores a fundamental tension between liberty and efficiency: even when individuals care about others only for self-regarding reasons, rights can conflict with collective welfare. The paradox is not merely about busybodies but about the structure of decisiveness in a interconnected society.
