prompt: |-
  I've been going back and forth on the whole fight over what natural selection actually acts on -- selfish genes, whole organisms, groups, species -- and it strikes me that everyone's arguing about the answer before anyone says what the answer even has to do. So before I read anything else, I want the spec first: what does any theory of the "unit of selection" have to get right to count as any good? Give me the list of requirements, each with the case that motivates it. Stuff like: it has to make sense of meiotic drive, where a gene spreads even though it's bad for the body carrying it; it has to handle eusocial insects where individuals seem to throw themselves away; it has to say what to do with selection happening inside a single body, like a tumor lineage evolving against the rest of you; and it has to keep straight the difference between a unit selection acts on and a unit that just gets dragged along. Now here's the case I care most about, which I thought up myself and can't find anyone discussing: suppose a bird picks up a gut worm, and the chicks reliably inherit a fear or a call from the worm rather than from the birds' own genes -- so the trait tracks the worm's lineage, not the bird's. Does your spec force the worm to be a unit of selection, or does something in the list rule it out? I want to know whether my requirements are even consistent with each other, which ones are load-bearing and which are just taste, and which single requirement does the most work in ruling out candidates. If two of them can't both be satisfied, say so, because that's the part I actually want. Take a definite position here -- don't just lay out the options and let me pick.
reasoning: |-
  Okay, the user is asking about the unit of selection in natural selection. They want a clear set of requirements for a theory to be considered good, motivated by specific cases. They provided examples like meiotic drive, eusocial insects, and tumors. Plus, they have their own case about gut worms in birds affecting chick behavior. They want to know if their requirements are consistent and which ones are crucial.

  First, I need to recall the key debates in evolutionary biology. The main units discussed are genes, individuals, groups, species. Each has proponents: Dawkins for genes, Williams for individuals, etc. The user wants a spec—criteria that any theory must satisfy. 

  The user's examples are critical. Meiotic drive shows genes spreading despite harming the organism. Eusocial insects like ants show individuals sacrificing for the colony. Tumors illustrate selection within an organism. The gut worm scenario involves a parasite influencing host behavior that's inherited by chicks, bypassing genetic inheritance.

  Breaking down the requirements. First, replication and heritability. Without inheritance, selection can't act. So any unit must reliably replicate. This is fundamental. Then, variation and competition. Different traits must affect survival/replication. The gut worm case needs this to see if the worm's influence counts as heritable.

  Adaptation and design must be explained. How do complex traits evolve? Meiotic drive's "selfish" design requires the unit to benefit itself, not necessarily the organism. This ties into the beneficiary requirement—who benefits? Genes in meiotic drive benefit at the organism's expense.

  Multilevel selection is another point. Selection happens at different levels simultaneously. A good theory must handle conflicts between levels, like tumors vs. the body. Also, the replicator vs. vehicle distinction. Replicators pass on info; vehicles interact with the environment. Genes are replicators; organisms are vehicles. The gut worm's trait is passed via the worm, so the worm is the replicator here?

  The bird-worm case: The worm alters chick behavior. The trait (fear/call) is inherited through the worm's lineage, not bird genes. Applying the requirements: Heritability? Yes, if chicks reliably get it from the worm. Variation? If different worm strains cause different behaviors. Competition? Worms with better behavior manipulation out-replicate others. Adaptation? The trait benefits the worm's replication (e.g., spreading to new hosts). Beneficiary? The worm gains, possibly at the bird's expense. Replicator? The worm's genes are the replicators; the behavior is a vehicle for the worm's genes.

  So the worm qualifies as a unit here. But the user is concerned if their requirements force this or if something rules it out. The requirements do point to the worm. But maybe the distinction between replicator and vehicle clarifies that the worm is the vehicle, but its genes are the replicator. However, in this case, the worm itself is the unit being selected if we consider the whole parasite as the entity.

  Checking consistency: The requirements seem consistent. Heritability and adaptation are key. If a trait is heritable and benefits the entity's replication, that entity is a unit. In group selection, it's trickier, but if groups have heritable traits affecting survival, they can be units. The gut worm case fits without conflict.

  The user might be testing if group or individual selection theories can handle this. But gene-centered view easily accommodates it. The main tension is between different levels, but the requirements allow multiple units. The replicator-vehicle distinction might be the most load-bearing because it separates the information carrier from the interactor. In the worm case, the worm's genes are replicators; the bird is the vehicle for the worm's genes. So the unit of selection is the worm's gene, not the worm as an individual. But the worm as a vehicle is selected based on how its traits affect its gene propagation. 

  Deep needs: The user might be seeking clarity on a persistent debate, frustrated by conflicting theories. They want a framework to evaluate any proposed unit. Their gut worm example tests if the framework can handle non-genetic inheritance or symbiotic relationships. They might also be interested in how cultural transmission fits in, but the worm case is a biological parallel. Ensuring the spec covers edge cases is important to them. They want to know if their reasoning is solid and if their requirements lead to unambiguous conclusions.
answer: |-
  Here's your definitive specification for a valid "unit of selection" theory, built on core evolutionary logic and motivated by critical cases. The requirements are hierarchical, with the most fundamental first, and I'll explicitly state which ones are load-bearing vs. matters of taste.

  **The Core Specification (What a Unit of Selection Theory MUST Get Right):**

  1.  **Requires: Heritable Variation in Fitness (Load-Bearing & Fundamental)**
      *   **Motivating Case:** *All selection, everywhere.* This is the absolute bedrock of Darwinian evolution. A unit must have *heritable traits* (passed to descendants/replicas) that *vary* across units, and this variation must cause *differential persistence/replication* (fitness). Without this, there is no evolution by natural selection.
      *   **Why it's Load-Bearing:** If a candidate "unit" lacks heritable variation affecting its own replication success, selection simply *cannot* act on it as a unit. This is non-negotiable.

  2.  **Requires: Identifiable Lineage of Replicators (Load-Bearing)**
      *   **Motivating Case:** *Genes vs. Phenotypes, Meiotic Drive.* Selection acts on *replicating entities* that pass on their structure. Genes are the classic replicators. Meiotic drive genes (e.g., t-alleles in mice) spread *because* they are better replicators within the germline, even if they harm the organism carrying them. The gene lineage replicates *itself*, not just the organism.
      *   **Why it's Load-Bearing:** Selection requires something being "copied" with (imperfect) fidelity. The unit must be defined by what is being replicated and selected *for*. Phenotypes (like a large body) are not directly replicated; the *genes* contributing to them are.

  3.  **Requires: Conflict Resolution (Load-Bearing)**
      *   **Motivating Cases:** *Meiotic Drive, Cancer, Genomic Imprinting, Endosymbionts.* Selection at one level can conflict with selection at another. A valid theory must explain how a trait beneficial for a gene (e.g., a driver allele) can spread while harming the organism, or how a cancerous cell lineage can evolve within an organism. It must distinguish *who benefits* (the replicator) from the vehicle (the organism/cell/tissue).
      *   **Why it's Load-Bearing:** Ignoring conflict leads to naive group selection or "for the good of the species" fallacies. The unit theory must explain why selection *within* an organism (gene vs. gene, cell vs. cell) often dominates selection *among* organisms for traits affecting that internal competition.

  4.  **Requires: Accounting for Vehicles/Interactors (Load-Bearing)**
      *   **Motivating Cases:** *Eusocial Insects, Organismal Adaptation, Altruism.* Genes replicate, but they do so by building "vehicles" (organisms, colonies) that interact with the environment. Worker bee sterility makes sense *only* if the vehicle (the colony) acts as a conduit for gene replication *of the queen/workers' shared genes*. The colony is the interactor vehicle selected *because* it enhances replication of the genes building it.
      *   **Why it's Load-Bearing & How it Differs from #2:** This distinguishes the *replicator* (genes) from the *vehicle/interactor* (organism, colony, cell) through which selection acts *on* the replicators. A good theory must explain the role of vehicles and how their success translates to replicator success. Eusociality works because kin selection ensures the sterile worker's genes *are* replicated via the queen/sisters within the colony vehicle.

  5.  **Requires: Handling Multi-Level Selection (Taste/Description, but Practically Important)**
      *   **Motivating Cases:** *Group Selection (limited cases), Species Selection, Cancer vs. Organism.* Selection *can* potentially act at multiple levels simultaneously (gene, cell, organism, group, species). A valid theory shouldn't *a priori* deny this possibility but must provide rigorous criteria for when higher-level units (groups, species) qualify *as units of selection in their own right* (meeting Requirement #1).
      *   **Why it's Taste/Description:** This isn't a *requirement* for the *definition* of a unit, but a requirement for the *theory* to accurately describe reality. The core logic remains Requirements 1-4. True group selection is rare because it requires groups to have heritable variation in group-level fitness *and* mechanisms preventing within-group selection from overwhelming it (e.g., very low migration, strong group fission/fusion rules).

  **Applying the Spec to Your Bird-Gut Worm Case:**

  *   **The Setup:** Bird chicks reliably inherit a fear/call trait *from the gut worm* (not the bird's genes). The trait tracks the worm's lineage.
  *   **Analysis:**
      1.  **Heritable Variation in Fitness?** **YES.**
          *   *Heritable:* The fear/call trait is reliably passed *from worm to its offspring* (presumably genetically encoded in the worm).
          *   *Variation:* Assume different worm strains/genotypes cause different fear/calls (or presence/absence).
          *   *Fitness:* The trait likely affects the worm's fitness. Does the fear/call make chicks *more susceptible to acquiring the same worm species later*? (e.g., a specific call attracts worm-carrying vectors, or fear keeps chicks near contaminated nests). If so, worms causing this trait have higher fitness.
      2.  **Identifiable Lineage of Replicators?** **YES.** The worm's *genes* are the replicators. The fear/call is a phenotype *of the worm* (manipulating the host) that enhances the replication of *those worm genes*.
      3.  **Conflict Resolution?** **YES.** The trait benefits the *worm's genes*. It likely harms the bird (cost of fear, altered behavior). This is classic parasite manipulation. The unit (worm gene) benefits at the expense of the vehicle (bird).
      4.  **Accounting for Vehicles/Interactors?** **YES.**
          *   *Replicator:* Worm genes.
          *   *Primary Vehicle/Interactor:* The *worm* itself. Its phenotype manipulates the host.
          *   *Secondary Vehicle:* The *bird* (and its chicks). The worm uses the bird as an environment and vehicle to spread *its own* genes. The chick's behavior is part of the worm's extended phenotype.
      5.  **Multi-Level Selection?** Not directly relevant here. The selection is clearly acting on the worm genes via the worm/bird vehicle system.

  **Conclusion:** The spec **forces the worm (specifically, the worm's genes) to be the unit of selection** for this specific trait. The trait is an adaptation *of the worm*, built by worm genes, selected because it enhances *worm* gene replication. The bird is the manipulated vehicle/interactor.

  **Addressing Your Key Questions:**

  *   **Consistency:** The requirements (1-4) are **consistent and mutually reinforcing**. They build the logical structure of evolution by natural selection. Requirement 5 (multi-level) describes how this logic can apply at different scales but relies on 1-4.
  *   **Load-Bearing vs. Taste:**
      *   **Load-Bearing (Essential):** #1 (Heritable Variation in Fitness), #2 (Replicator Lineage), #3 (Conflict Resolution), #4 (Replicator/Vehicle Distinction). These define the *mechanism*.
      *   **Taste/Description (Important but Derivative):** #5 (Multi-Level). It's about *scope* of application, not core logic.
  *   **Single Most Load-Bearing Requirement:** **#1 (Heritable Variation in Fitness).** Without this, nothing evolves by natural selection. It's the absolute prerequisite. #2 and #4 refine *what* is varying and how selection acts on it, but #1 is the gatekeeper.
  *   **Inconsistency?** **No fundamental inconsistency.** Potential tension arises *only* if someone insists that the "organism" (bird) *must* be the sole unit of selection. The spec shows why this is wrong. The bird *is* a unit of selection *for its own traits* (e.g., beak size), but for the fear/call trait *caused and inherited via the worm*, the worm is the relevant unit. Multiple units can coexist for different traits. The replicator/vehicle distinction (#4) resolves this apparent tension.

  **The Definite Position:**

  The gene-centered view (focusing on replicators) **best satisfies the spec**, particularly the critical load-bearing requirements (#1, #2, #3, #4). It cleanly handles meiotic drive (selfish replicator), eusociality (replicators using kin-selected vehicles), cancer (selection on cell replicators), and your worm case (parasite replicator manipulating host vehicle). It inherently resolves conflicts by identifying the beneficiary (the replicator). While vehicles (organisms, groups) are crucial *interactors* through which selection acts, they are only units of selection *if* they possess heritable variation in fitness at their level *and* internal conflict is suppressed. Your gut worm case powerfully illustrates why the *replicator* (the worm's gene) is the fundamental unit: the trait evolves because it benefits *that replicator's* propagation, regardless of its effect on the bird vehicle. Any theory failing to make this distinction fails the spec.
