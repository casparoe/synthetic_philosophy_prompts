prompt: |-
  I am trying to determine whether the following pattern has an established name. In debates over the allocation of authority among levels of government, one frequently encounters a particular justificatory structure. A decision is said to belong to the lowest level that can adequately handle it. When the adequacy of the lower level is specified, however, it turns out to depend on capacities—fiscal, administrative, legal, and legitimating—that the lower level possesses only because it has already been entrusted with the relevant decision, or with decisions of that kind. The higher level's own prior action, or the mere fact of centralization, is thus part of what makes the lower level inadequate or adequate. The result is that the subsidiarity test can be satisfied or failed depending on the baseline of authority one assumes, and the test itself cannot supply that baseline. I see this in arguments about EU competence, German Länder authority, Swiss cantonal residual powers, and US state-versus-federal regulation. It seems distinct from ordinary circular reasoning, because the capacities are genuinely generated by prior allocation; and distinct from path dependence, because the point is normative—the lower level's would-be competence is treated as a reason to grant it competence. Is there an established concept for this? If there is not, I would like a term and a definition that distinguishes it from subsidiarity, federalism, path dependence, and institutional capacity, and that says where the phenomenon stops. A bare name would not be useful; what I need is a precise account of what the phenomenon is, what it is not, and where its boundaries lie.
reasoning: |-
  Okay, the user is describing a specific pattern in debates about government authority allocation. They notice that when deciding which level of government should handle a decision, the test often relies on the lower level's existing capacities. But those capacities themselves depend on prior authority grants from higher levels. This creates a circular dependency where the test for subsidiarity can't establish its own baseline.

  Hmm, this is a sophisticated observation about institutional design. The user clearly has deep knowledge of federal systems (EU, Germany, Switzerland, US) and wants to isolate this particular logical tension. They've already ruled out several adjacent concepts like simple circular reasoning and path dependence.

  The core paradox they're identifying is that institutional capacity isn't static - it's shaped by the very authority being debated. When higher levels centralize power, they might weaken local capacity over time, making future centralization seem necessary. Conversely, granting authority can build capacity, making decentralization appear justified later.

  I need to coin a term that captures this dynamic. "Constitutive authority loop" feels right because:
  - "Constitutive" highlights how authority grants actively shape capacity
  - "Loop" emphasizes the feedback mechanism
  - It distinguishes from passive path dependence by focusing on normative justification

  The boundaries are important too. This isn't about all capacity gaps, only those where:
  1) Capacity depends on prior authority grants
  2) The gap is then used to justify centralization
  3) In a way that makes the subsidiarity test baseline-dependent

  The user wants precision - they're clearly developing academic work. I should provide clear differentiators from related concepts and concrete examples across their cited jurisdictions. The EU competence example will resonate particularly well given their focus.

  Most importantly, I must avoid just giving a label - they need the operational mechanism spelled out. The three-step formulation (existing allocation → capacity gap → justification) should help them apply this framework. The "escape" conditions (like Germany's constitutional safeguards) show where the loop can be broken, which addresses their boundary question.
answer: |-
  Based on your meticulous description, this pattern represents a distinct and significant conceptual challenge in federalism/subsidiarity theory. While no single, universally established term exists, the most precise conceptualization is the **Constitutive Authority Loop (CAL)**.

  Here’s a precise account of the phenomenon, its boundaries, and distinctions:

  ### 1. **The Phenomenon: Constitutive Authority Loop (CAL)**
      *   **Definition:** A self-referential justificatory loop in multi-level governance where:
          1.  The *capacity* of a lower-level entity (e.g., state, canton, Länder) to perform a function is judged essential for allocating *authority* over that function.
          2.  This capacity itself is demonstrably dependent on prior exercises of *authority* (allocated either for *that specific function* or for *closely related functions*) by the *same* lower level or by the higher level (e.g., through funding, administrative structures, legal frameworks, or legitimacy derived from past responsibility).
          3.  Therefore, the outcome of the subsidiarity test (whether the lower level is "adequate") becomes contingent on the *pre-existing baseline distribution of authority*, rendering the test incapable of independently determining the optimal initial or revised allocation. The justification for centralization/decentralization becomes partially circular and path-dependent in a normatively problematic way.

      *   **Core Mechanism:** Authority allocation → Shapes capacity → Capacity is used to justify/contest further authority allocation. The loop arises because capacity is not a static, exogenous variable but is *constituted* by prior authority decisions.

  ### 2. **What it is NOT (Key Distinctions)**
      *   **Not Simple Circular Reasoning:** While circular, CAL is specific. Circular reasoning might involve "A because B, B because A" without substance. CAL involves a *substantive, causal mechanism*: prior authority genuinely *creates or erodes* the capacities (fiscal, administrative, expertise, legitimacy) used in the justification. The circularity stems from using this *dynamically generated* capacity as the *independent* criterion.
      *   **Not Path Dependence (in the standard sense):** Path dependence describes how early choices constrain later options due to increasing returns, switching costs, etc. CAL *is* path-dependent *in outcome*, but its *distinctive feature* is the **normative justification trap**: the *reason* given for the current allocation (capacity) is itself a *product* of past allocations, undermining the normative claim that the allocation is based solely on inherent adequacy. Path dependence explains *why* the loop persists; CAL describes *how* the loop invalidates the justificatory logic.
      *   **Not Subsidiarity Principle Itself:** Subsidiarity is the normative rule ("decisions at the lowest adequate level"). CAL is a **pathological flaw in the *application* of subsidiarity**, exposing how the "adequacy" criterion can be endogenous to the existing authority structure, preventing the principle from functioning as an independent arbiter.
      *   **Not (Just) Institutional Capacity Deficits:** While capacity deficits are central, CAL specifically highlights that the *identification* and *significance* of the deficit are contingent on the *prior distribution of authority* that helped create the deficit (or surplus). The focus is on the *justificatory relationship* between capacity and authority allocation.
      *   **Not Federalism:** Federalism is the system structure. CAL is a specific *dynamic* or *logical problem* that can arise *within* federal (or quasi-federal like EU) systems when applying subsidiary allocation principles.

  ### 3. **Where the Phenomenon Stops (Boundaries)**
      *   **Exogenous Capacity:** The loop breaks if the lower level's capacity (or lack thereof) to handle a *new* function is demonstrably *independent* of prior authority allocations. (e.g., A canton lacks the technical expertise for nuclear regulation because it's inherently complex and no prior related functions were assigned – capacity is truly exogenous).
      *   **Explicit Constitutional Baseline:** If the subsidiarity test operates relative to a fixed, pre-agreed, and unambiguous baseline of authority defined in a constitution/treaty *that is not itself subject to the same capacity-based justification loop*, the loop can be contained. The test applies *within* the defined spheres. (e.g., German Basic Law defines *ausschließliche* and *konkurrierende* Gesetzgebung clearly; adequacy debates occur within the concurrent sphere but the *existence* of the spheres isn't justified by a capacity loop).
      *   **Non-Scale Economies/Legitimacy:** If the justification for centralization relies *solely* on arguments not tied to lower-level capacity generated by prior authority (e.g., *inherent* economies of scale, preventing a race-to-the-bottom requiring uniform rules, addressing genuinely transnational externalities, or fundamental rights protection), the CAL is avoided. The argument must be based on factors *external* to the loop.
      *   **Empirical Disconnect:** If granting authority for Function X demonstrably does *not* build the capacity needed for Function X or related Function Y (or if withholding it doesn't erode it), the constitutive link is broken. The loop depends on the *actual causal effect* of authority on capacity.
      *   **Acknowledgment & Mitigation:** Systems can recognize CAL and implement safeguards: independent capacity assessments, sunset clauses, mandatory lower-level consultation *with resources*, or dedicated equalization/funding mechanisms *unlinked* to specific function assignment.

  ### 4. **Illustrative Application (EU Competence Example)**
      *   **CAL Manifestation:** Member States (MS) argue the EU shouldn't regulate health policy because MS have the capacity. But MS capacity relies on national funding/responsibility. If the EU centralizes funding/responsibility (e.g., for pandemics), MS capacity atrophies. Later, this eroded capacity is cited as justification for *further* centralization ("MS lack the capacity we helped erode"). Conversely, exclusive MS control builds expertise, justifying continued control via subsidiarity. The adequacy test outcome depends entirely on the starting point.
      *   **Breaking the Loop (Hypothetical):** The EU Treaty explicitly defines health as a supporting competence only, with MS primary responsibility fixed. Or, centralization is justified solely based on the cross-border nature of pandemics, not MS capacity deficits. Or, an independent body assesses MS health system capacity using metrics *unrelated* to past EU action.

  **In essence:** The **Constitutive Authority Loop (CAL)** captures the core problem you identify: the dynamic, causal interdependence between authority allocation and the very capacities used to justify that allocation, creating a self-referential justificatory trap within subsidiarity-based governance systems. Its boundaries are defined by the presence of this causal interdependence and its use in normative justification; it stops where capacity is truly exogenous, baselines are fixed independently, or justifications rely on factors outside the loop.
