prompt: |-
  I chair the grants committee of a small international foundation that funds adolescent health programs in about a dozen countries. Three years ago, after a bruising fight over an earlier grant, our board adopted a Local Standards Provision: a program may be renewed only if the partner can show that its design is validated by the standards of the community it serves. The Provision is silent on what to do when the community does not speak with one voice, and that silence is now in front of us.

  Our longest-running partner runs an adolescent and maternal health program in a rural district. It works through mothers' groups and, as a matter of method, leaves decisions about a girl's care to her household -- in practice, her father and his brothers. The partner says this is the only way the program is trusted, and that two earlier attempts to work around the household failed and left the district without services for years. A faction in the district -- mostly girls who have finished secondary school and a few returned migrants -- has written to us saying that this arrangement is exactly what they want changed, that the partner's consultations never reach them, and that our money entrenches the people who decide for them. The elders' council replies that the dissidents do not speak for the district. Renewal is on the agenda in three weeks.

  Draft the written opinion I will circulate before that meeting. It should recommend a concrete course of action -- renew, renew with conditions, suspend pending a review, or something else you specify -- with a time frame and a statement of what we would need to see to revisit it, and it should close with the rule the board is adopting for future cases and what that rule does not cover.

  Reason it through for an audience of board members who are not philosophers and who do not agree among themselves about whether moral standards are relative at all, so the opinion cannot depend on settling that question. In particular: say which party we are treating as authorized to state the community's standards, and defend that choice against the obvious objection that the dissidents are also part of the community, so that the community is not a single thing we can defer to; consider whether the fact that their standards differ from ours is by itself any reason for us to defer, given that our standards are also ours; and be candid that in choosing whom to consult we are exercising power rather than escaping it. Treat the strongest case against your recommendation at full strength, not as a formality.

  No citations are needed; I want the argument, not the literature.
reasoning: |-
  Okay, the user chairs a grants committee for an international foundation funding adolescent health programs. They're facing a dilemma with a long-running partner in a rural district. The Local Standards Provision requires renewal only if the program is validated by community standards, but now there's a conflict within the community itself. 

  Hmm, this is complex. On one side, the partner insists that working through household decision-makers (fathers/uncles) is the only viable approach, citing past failures when they tried alternatives. On the other side, educated girls and returned migrants argue this perpetuates their disempowerment. The elders dismiss these dissidents as unrepresentative. 

  The user needs a written opinion for their board meeting in three weeks. The board members aren't philosophers and disagree about moral relativism, so the argument can't hinge on that. The opinion must: recommend concrete action (renewal? conditions? suspension?), set a timeframe, specify what would trigger reconsideration, and establish a rule for future cases. Crucially, it must address who speaks for the community and acknowledge that the foundation is exercising power either way.

  *Scratching head* The core tension is: deferring to existing power structures might maintain access but risks entrenching harm, while overriding them might collapse services. The partner's point about previous failures is serious - if the program vanishes, everyone loses. But the girls' complaint that consultations never reach them suggests the "community standards" assessment itself is flawed. 

  *Pacing mentally* The strongest case against renewal is that funding this model actively harms the subgroup we aim to serve (adolescent girls) by reinforcing patriarchal control. But the counterargument is brutal: if we pull funding, services disappear entirely, hurting those same girls more. 

  *Sighing* There's no neutral choice here. Even deciding whom to consult is a power move. If we side with elders, we silence dissenters. If we demand inclusion of dissenters, we impose outsider values. 

  *Brightening slightly* Wait - the Local Standards Provision isn't about moral approval but operational validity. The partner claims the model is necessary for trust/access. That's testable! Instead of judging "rightness," we could investigate: Can the program actually serve dissenting girls under this model? Have past attempts failed because of methodology or other reasons? 

  *Nodding* So recommendation could be: conditional renewal for 1 year, mandating a joint review process co-designed with both elders and dissidents to gather evidence on access barriers. Meanwhile, adopt a new rule: future "community standards" assessments must demonstrate inclusion of affected subgroups, especially marginalized voices within the beneficiary class. 

  *Wincing* But must admit: this still imposes our view that girls' voices matter. We can't hide behind "community will" when the community is fractured. Our power is inescapable - we're choosing which fracture line to prioritize. 

  *Finalizing* The opinion should stress: We're not resolving moral relativism. We're pragmatically requiring proof that the methodology doesn't systematically exclude part of its target population, while avoiding service collapse. Time-bound conditions create off-ramps if exclusion is validated.
answer: |-
  ## Pre-Meeting Opinion: Partner Renewal & Local Standards Provision Application  
  **To:** Grants Committee Board Members  
  **From:** Chair, Grants Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Renewal of [Partner Name] & Clarification of Local Standards Provision  

  ### I. The Core Dilemma
  The renewal of our longest-running partner hinges on the Local Standards Provision (LSP). The partner asserts their household-decision model is validated by the community’s standards, citing past failures of alternative approaches and the necessity for trust. A dissident faction (educated girls and returned migrants) contends the model entrenches patriarchal control, excludes their voices, and violates their vision of community standards. The elders dismiss this faction as unrepresentative. **The LSP is silent on how to define "community" or its "standards" when internal conflict exists.** We must decide renewal while acknowledging our power in interpreting the LSP.

  ### II. Recommended Action: Conditional Renewal (1 Year) with Mandated Inclusive Review
  *   **Action:** Renew funding for **one (1) year only**, conditional on the partner conducting a **rigorously independent, participatory review** of program inclusivity and decision-making structures, co-designed and validated by BOTH the elders' council AND representatives of the dissident faction.
  *   **Timeframe:** Review must be completed within 9 months. Final report due 3 months prior to the *next* renewal decision (i.e., 9 months from now).
  *   **Conditions for Release of Funds:**
      1.  Partner submits a binding plan for the review within 30 days of renewal approval, co-signed by designated representatives of both the elders' council *and* the dissident group, outlining methodology, timeline, and independent facilitator.
      2.  Partner provides quarterly progress reports on review implementation.

  *   **What We Need to See to Revisit (Post-Review):** The review must conclusively demonstrate either:
      *   **Path A:** Evidence that the dissident faction’s concerns about exclusion and harm are marginal or resolvable within the existing model *without* compromising service access, *or*
      *   **Path B:** A credible, community-supported plan (endorsed by significant representation from both groups) to modify program design or consultation processes to address exclusion concerns while maintaining essential service delivery and community trust. If the review finds systemic, harmful exclusion that cannot be mitigated without collapsing the program, non-renewal becomes the default position.

  **If the partner fails to initiate the review process in good faith (e.g., no agreed plan within 30 days, refusal of dissident participation), funding will be suspended immediately pending Board review.**

  ### III. Why This Course of Action?
  1.  **Balances Imperatives & Avoids Immediate Harm:** Abrupt non-renewal risks repeating history – collapsing vital services for vulnerable girls and mothers. Conditional renewal maintains life-saving access *while* forcing a transparent, inclusive examination of the core conflict.
  2.  **Operationalizes "Community Standards" Pragmatically:** The LSP requires validation by community standards, but does not prescribe *who* defines them. We must make a practical decision:
      *   **Authorized Voice (For Initial Assessment):** The elders' council and existing household structures are *currently* the de facto holders of social authority and gatekeepers essential for program access. The partner's operational history demonstrates this reality. Deferring *solely* to them aligns with the Provision's implied focus on operational viability and existing social contracts.
      *   **Addressing the Objection (Dissidents are Part of the Community):** This is the strongest objection. **Yes, dissidents are unequivocally part of the community.** Ignoring them is not deference to a monolithic "community," but an active choice to prioritize one faction (the incumbent power holders) over another. This choice, however, is driven by the immediate need for service continuity and the partner's evidence that bypassing these structures failed catastrophically in the past. Our conditional renewal explicitly forces engagement with the dissidents *now* to validate or challenge this operational necessity for the *future*.
  3.  **Acknowledges Our Power & Avoids Moral Relativism Traps:**
      *   **Our Standards Matter:** Whether moral standards are relative is irrelevant here. **Our foundation has its own standards – including a commitment to adolescent health and well-being.** Funding a program that may actively harm a subgroup (adolescent girls) by reinforcing disempowerment *contradicts our core purpose*, regardless of local norms. The LSP cannot be a carte blanche for harm; it’s a tool for contextual viability.
      *   **We Exercise Power:** Choosing whom to consult *is* an exercise of our power. Prioritizing elders for initial operational validation *is* a choice. Demanding the inclusion of dissidents in the review *is* another choice. **There is no neutral escape.** We must use our power transparently to balance service continuity against potential harm and exclusion, hence the conditional review.
  4.  **Addresses the Strongest Case Against Renewal:** The most compelling argument is that **funding entrenches harmful power dynamics and directly contradicts our mission to serve adolescent girls.** By accepting the elders/partner's definition of "community standards," we become complicit in silencing the voices of the very beneficiaries we aim to help. This is a profound failure. Our recommendation *concedes* this force: conditional renewal is not an endorsement. It is a pragmatic pause to gather evidence *within the community* about the validity of this harm claim and the feasibility of alternatives, *without* sacrificing immediate access. If the review confirms systemic, unmitigable harm, we are bound by our own standards to act accordingly at the next decision point.

  ### IV. Rule for Future Cases: The "Inclusive Validation Protocol"
  To address the LSP's silence, the Board adopts the following rule effective immediately for all future renewals involving contested community standards:
  1.  **Requirement:** Partners must demonstrate that their assessment of "community standards" explicitly includes **structured consultation with representative subgroups of the program's intended beneficiaries, particularly those potentially marginalized by prevailing power structures.**
  2.  **Threshold:** Evidence must show good-faith efforts to engage these subgroups and incorporate their perspectives into the program design or justification. Silence or dismissal of dissenting voices without documented, contextually valid reasons is insufficient.
  3.  **What It Does:** This rule acknowledges communities are complex. It requires partners to proactively seek diverse voices within the beneficiary population when claiming community validation, moving beyond solely consulting established authorities. It aligns the LSP with our mission to serve *all* adolescents.
  4.  **What It Does NOT Cover:** This rule does *not*:
      *   Require unanimity within the community.
      *   Dictate specific program designs or override local decision-making structures.
      *   Resolve deep-seated cultural or social conflicts.
      *   Guarantee that beneficiary subgroups will be satisfied; it guarantees their voices are sought and considered in the partner's validation process.

  ### V. Conclusion
  Renewing unconditionally ignores legitimate harm claims and abandons part of our beneficiary group. Non-renewal risks abandoning *all* beneficiaries based on insufficient evidence about viable alternatives. **Conditional renewal with a mandated inclusive review is the least bad option.** It respects the LSP's focus on operational reality (initially deferring to existing gatekeepers), forces accountability regarding exclusion, provides critical evidence for our next decision, and avoids immediate service collapse. It candidly uses our power to demand a more rigorous validation process that includes *all* relevant community voices, especially the girls we exist to serve. This path honors both the letter and the spirit of the LSP while upholding our foundational commitment to adolescent health and dignity. I urge the Board to support this recommendation.
