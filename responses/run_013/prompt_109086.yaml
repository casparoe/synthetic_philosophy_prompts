answer: |-
  ### The Principle Behind Your Verdicts

  After analyzing your cases, I propose a unified principle with two core components: **Epistemic Credibility Weighting** and **Context-Dependent Risk Valuation**. These components interact to explain your judgments, addressing why you reject some low-probability bets while accepting others, even when expected value calculations seem contradictory. The principle is grounded in how humans intuitively process uncertainty, stakes, and agency—not just raw probabilities or payoffs.

  #### Core Principle
  **1. Epistemic Credibility Weighting (ECW):**  
     - Low-probability events are only actionable if they meet a threshold of *real-world plausibility* (e.g., supported by evidence, historical precedent, or mechanistic reasoning). Below this threshold, probabilities are effectively treated as zero, regardless of stakes.  
     - **Motivated by:** The mugging case (dismissed as a "con") and the extinction-risk donation (accepted despite tiny odds). The mugging fails ECW because it relies on an absurd, unsupported threat (a stranger wielding 10^1000 power). The extinction risk clears ECW because it's tied to real-world research (e.g., asteroid defense, biosecurity) with established cause-effect models.  

  **2. Context-Dependent Risk Valuation (CDRV):**  
     - For gains/losses affecting *yourself*, you use **loss-averse expected utility** (rejecting positive-EV gambles if the absolute stake feels meaningful or the probability is "meaninglessly low").  
     - For gains/losses affecting *others* (especially catastrophic/collective risks), you use **precautionary expected value** (accepting tiny probabilities if the payoff is large-scale and irreversible, even with negative EV or unknown sign).  
     - **Motivated by:** The lottery ticket (rejected despite positive EV) vs. the $1,000 disaster-aversion donation (accepted with negative EV), and your self-observation about "bravery with others' futures." CDRV splits your risk attitudes: you’re personally loss-averse but socially precautionary.  

  #### How It Explains Your Cases
  - **The mugging:** Fails ECW (no credible mechanism for the threat). CDRV doesn’t apply because it’s dismissed at the credibility layer.  
  - **Extinction-risk donation:** Clears ECW (plausible cause-effect via real research). CDRV applies: precautionary stance for collective survival outweighs low probability.  
