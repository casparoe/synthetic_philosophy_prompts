  ### Inconsistent Verdicts and Where the Principle Fails
  Your intuitions are *mostly* consistent except for one tension: **the lottery vs. stranger’s bet**. Both are personal-gain gambles with positive EV, yet you reject the lottery and accept the bet. The principle resolves this via CDRV’s focus on *absolute expected gain* and *stake size*:  
  - Lottery: $0.33 net EV on a $1 stake is "trivial gain" (not worth cognitive effort).  
  - Stranger’s bet: $9 net EV on a $1 stake is "meaningful gain" (exceeds your action threshold).  
  **Why it’s fair:** Humans aren’t pure EV maximizers; we embed gambles in a bandwidth-cost framework. A 33% return isn’t worth your time, but a 900% return is.  

  However, **the $1,000 disaster-aversion donation is the weakest link**. The principle explains it via CDRV’s precautionary slant for collective catastrophes, but the math clashes:  
