prompt: |-
  I'm a third-year phil student and I'm in a decision theory seminar thats gotten into evidential cooperation in large worlds. Our prof gave us a toy case and I want your actual credence on it, not a survey of positions. Heres the case: there are N copies of me, all running the same decision algorithm, each in a causally isolated box. No signals, no common cause except the shared source code. Each copy chooses A or B. If a sufficiently high fraction of copies choose A, then a distant event happens that is good for every copy; if not, nothing happens. I cannot observe the fraction, and my choice doesn't causally affect any other copy. The question is whether the fact that the other copies are running my algorithm gives me a genuine normative reason to choose A, a reason that should show up in the correct theory of rational choice, not just a heuristic. What's your credence that the answer is yes? Please decompose it: probability that evidential decision theory is the right general account of rational choice; probability that the shared algorithm creates the right kind of correlation rather than a merely statistical one; probability that normative reasons can be grounded in acausal correlations at all; probability that the copies are similar enough for the correlation to hold; and any other sub-question you think belongs. Give a rough number and one line for each, then the combination. Then tell me which term you're least confident in and what would move it most. Also, if you think the question is ill-posed, say what would make it well-posed and give your credence conditional on that clarification.
