answer: |-
  ## Exam Question: The Duration Repugnant Conclusion

  "Parfit's Repugnant Conclusion arises when comparing populations: a large population with lives barely worth living is judged better than a small population with excellent lives, according to Total Utilitarianism (TU). Consider a structurally analogous case applied to the *duration* of a *single life*:

  *   **Life A:** One person lives 80 years of *excellent* well-being (high positive value per year).
  *   **Life B:** *The same person* lives 4,000 years, where each year (or day) is at a level of well-being that is *barely above neutral* (a tiny positive value per year). Life B contains a vastly greater *total* quantity of well-being than Life A.

  1.  Explain clearly why Total Utarianism implies that Life B is better than Life A. Does the principle that "we cannot make anyone worse off" play a role in generating this implication in the duration case? Why or why not?
  2.  Is the implication that Life B is better than Life A genuinely "repugnant" in a way analogous to the population case? Why or why might it seem different?
  3.  Analyze whether this "Duration Repugnant Conclusion" suggests that the fundamental problem generating repugnance in *both* cases is the same, namely the core principle of TU that *adding more units of positive well-being is always better when no one is made worse off*, regardless of how low the level of that well-being is. Or, does the population case involve an essential element (e.g., interpersonal comparisons, identity) missing in the duration case that makes its repugnance distinct?"

  ---

  ## Model Answer (Approx. 650 words)

  Total Utilitarianism (TU) states that the right action or outcome is the one that maximizes the *sum total* of well-being across all individuals affected. In the population case, TU favors the vast population of barely-worth-living lives because the sheer number of individuals, each contributing a tiny positive well-being unit, sums to a greater total than the smaller population with high well-being per life, even if the average well-being is vastly lower.

  The duration case applies this same logic intrapersonally. Life A offers 80 years of high well-being, resulting in a significant but finite total sum. Life B offers 4,000 years where each unit of time contributes only a minuscule positive well-being increment. Crucially, because TU sums *all* positive well-being units, the massive quantity of barely-positive years in Life B overwhelms the high quality but limited quantity in Life A. The principle that "we cannot make anyone worse off" plays a **significantly different and arguably irrelevant role** in the duration case compared to the population case. In the population case, this principle is often invoked in the "mere addition" paradox: adding lives with positive well-being (without making existing lives worse) always increases total utility and seems permissible, leading towards the repugnant outcome. However, in the duration case, **there is only one person**. The comparison isn't between making different people better or worse off; it's about two potential total well-being packages *for the same individual*. The "cannot make worse off" principle doesn't apply in the same comparative sense because there is no "other" person whose well-being might be reduced. We are simply comparing two possible total well-being sums for a single life trajectory.

  Whether Life B being judged better than Life A is genuinely "repugnant" analogous to the population case is debatable and reveals potential differences. Many might find it *less* intuitively repugnant. Why?
  *   **Identity and Continuity:** The single person in Life B endures the low quality. They experience the immense duration. While monotonous, it's *their* continuous existence filled with net-positive moments. The "repugnance" in the population case often stems from imagining *distinct individuals* condemned to lives barely worth living, raising concerns about exploitation or lack of meaningful existence for *many*.
  *   **Experience vs. Composition:** In the duration case, the subject experiences the *aggregate* of the long life, which might feel subjectively like a very long, very dull, but overall positive existence. In the population case, the repugnance involves contemplating the intrinsic poverty of *each individual life* within the vast population – each life is barely worth starting. The focus is on the quality per distinct consciousness.
  *   **Sacrifice vs. Endurance:** Life A feels like a tragic loss of potential total good in TU terms, but not necessarily a sacrifice *imposed* on another. The population case feels like sacrificing the quality of life for millions/billions to achieve a larger sum spread thinly.

  However, the Duration Repugnant Conclusion still highlights the **core problematic principle of TU** that drives *both* conclusions: **The axiomatic commitment that the moral value of an outcome is determined solely by the *sum* of all positive well-being units, irrespective of their *distribution* across entities (distinct persons or temporal parts of one person) or the *level* at which those units occur, provided they are positive.** This principle dictates that adding more positive well-being units always improves the outcome when no negative units (or well-being reductions for existing units) are introduced.

  The duration case strongly suggests that the fundamental culprit behind the repugnance is indeed this core additive aggregation principle of TU itself, rather than something unique to *adding people*. The repugnance arises whenever vast quantities of barely-positive existence are prioritized over smaller quantities of high-positive existence *because* of the simple summing operation, whether the units are spread across distinct persons or across the lifespan of one person. The population case adds layers of interpersonal moral concern (rights, separateness of persons, exploitation) that can heighten the repugnance, but the *mathematical and axiological engine* driving the conclusion – prioritizing total sum over quality/distribution – is identical. If one finds the duration implication intuitively acceptable but the population implication repugnant, it points to the interpersonal dimension and the value of distinct life quality per person as an *additional* moral factor beyond simple summation. If one finds the duration implication *also* repugnant, it underscores the power of the core aggregation principle as the primary source of the problem in both contexts. In either case, the duration analogy successfully isolates and tests the fundamental additive logic of TU.

  ---

  ## Marking Scheme (Total: 20 points)

  1.  **Accurate TU Application to Duration Case (4 pts):** Clearly explains *why* TU prefers Life B due to the massive total sum of tiny positive units. *Common Flub:* Only describes the population case TU implication; fails to apply it correctly to the single-life duration scenario.
  2.  **Analysis of "Cannot Make Worse Off" (3 pts):** Correctly identifies the principle's irrelevance or different role in the duration case due to the single-person context, contrasting it with the population case. *Common Flub:* Assumes the principle works the same way in both cases or misapplies it intrapersonally.
  3.  **Assessment of Repugnance Analogy (4 pts):** Provides a reasoned argument on whether the duration conclusion is repugnant (or not) *analogous* to the population case, highlighting key differences (e.g., single identity, continuity, interpersonal concerns) or similarities. *Common Flub:* Simply asserts it is/isn't repugnant without analysis; conflates the cases entirely; ignores the "analogous" aspect.
  4.  **Identification of Core Culprit Principle (4 pts):** Clearly identifies the core TU principle of additive aggregation of positive well-being units as the driver of *both* conclusions. *Common Flub:* Blames "total utilitarianism" vaguely without specifying the *core principle*; argues the problem is solely about adding people.
  5.  **Comparison of Cases & Fundamental Problem (3 pts):** Effectively argues whether the population and duration cases share the *same* fundamental problem (the core aggregation principle) or if the population case involves an essential distinct element (e.g., interpersonal morality), using the duration case as evidence. *Common Flub:* Treats the cases as entirely separate; fails to draw conclusions about the underlying cause of repugnance from the comparison.
  6. **Clarity, Structure & Argument (2 pts):** Well-organized, coherent, precise language, addresses all parts of the question. *Common Flub:* Unfocused, rambling, unclear expression, misses a sub-question.
