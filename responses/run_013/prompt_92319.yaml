prompt: |-
  hey, so I'm in this 400-level population ethics seminar and our final is one long essay, and the prof said we could each make up a practice question, swap with a partner, and grade each other's answers. honestly sounds like a lot of work but whatever, I want mine to be good so my partner actually has something to chew on and can't just write out the Parfit stuff we've all memorized.

  Heres the twist I want the question built around, and I'm pretty sure the prof hasn't covered it (I came up with it in the shower so sorry if its dumb): the repugnant conclusion is normally about numbers of people -- a gazillion lives that are just barely worth living vs a smaller bunch of really good ones, and the total on the huge side wins. But the same move seems to work on duration inside a single life. Take one person with 80 amazing years, and one person with, like, 4000 years where every day is only a tiny sliver above neutral -- barely worth living, but still above. If more of a barely-good thing is better whenever you can't make anyone worse off, don't you get a "duration repugnant conclusion"? and if you do, is that the same problem as the population one or a different one, and does it mean the real culprit is something about adding good stuff rather than about adding people?

  So what I want from you: write the actual exam question first (one essay question, something a student could do in about 75 min, aimed at upper-level undergrads who know mere addition and the repugnant conclusion but nothing fancier), then a model answer of around 600-700 words, then a marking scheme. For the marking scheme give me five or six must-hit points with marks out of 20, and for each one a one-liner on how students typically flub it. The question has to be set up so you cant get a good mark by just describing the repugnant conclusion and saying "therefore total utilitarianism is bad" -- it should force them to say what exactly generates the conclusion and whether the duration case shares it or comes apart from it (like, whether comparing one long life to one short one is even the right parallel, or whether the "can't make anyone worse off" bit does any work here). Please dont put in reading lists or citations, my partner wont have them and neither will I.
