prompt: |-
  I'm a phil of biology PhD student and somehow I've also become the person our hospital's fertility clinic calls for ethics consults, so I'm the de facto metaphysics desk. The questions keep coming back to the same thing: is this the same child? A widow wants to transfer embryos she made with her late husband and says they're already their children, so his old consent covers it. A lab mix-up means the embryo that got transferred wasn't genetically the couple's, and they say the kid who was born isn't the child they were trying to have — the clinic says you can't harm anyone by failing to bring a different person into existence. And a couple whose stored sibling embryo was lost to a freezer failure say a particular child died.

  I want to turn origin essentialism (the Kripke-ish line that you couldn't have come from a different sperm and egg) into a procedure an ethics consultant with zero metaphysics training can run in twenty minutes and get a verdict out of, not a lecture. Use the distinction I've been muddling through with: origin-claims, where we're saying this entity is numerically identical to that one, versus continuity-claims, where we're saying this entity is the continuation of a process that would have produced a specific person — make the procedure seperate the two and say what follows from each.

  Give it to me as exactly five numbered items, a sentence or two each, no intro or conclusion, folding the cases in as you go rather than saving them for the end. Be straight about where the procedure just hands the call back to a human, and tell me if one of my three cases comes out in a way I won't like — I'd rather know now than find out in the room.
reasoning: |-
  Okay, the user is a philosophy of biology PhD student who also handles ethics consultations for a hospital fertility clinic. They're struggling with recurring questions about identity—specifically, whether certain embryos or children are "the same" in different scenarios. They want a practical, step-by-step procedure based on origin essentialism that non-experts can apply quickly, without metaphysics training. 

  The user mentions three real cases: a widow wanting to use her late husband's embryos, a lab mix-up where the wrong embryo was transferred, and a lost embryo from a freezer failure. They need a framework that separates "origin-claims" (numerical identity) from "continuity-claims" (process continuity), and want five concise steps that directly address the cases. 

  First, I need to unpack Kripke's origin essentialism for clinical use. The core idea is that a person's origin—their specific sperm and egg—is essential to their identity. But in fertility contexts, we're often dealing with potential persons, not actual ones. That's where the user's distinction helps: origin-claims are about "this embryo is identical to that future child," while continuity-claims are about "this process would have led to that child." 

  For the procedure, I'll start by forcing a clear question: "Same as what?" This cuts through vague language. Then, isolate origin-claims using the gamete test—if gametes differ, numerical identity fails. Next, handle continuity-claims by asking if the process was interrupted. Finally, flag where ethics must take over, like consent or harm assessments. 

  The widow's case: her origin-claim fails (no child exists yet), but continuity holds (same process). The lab mix-up: origin differs (wrong gametes), so not the same child. The freezer failure: neither origin nor continuity applies—no person existed to die. That last one might upset the couple, but it's logically consistent. 

  I’ll keep each step to 1-2 sentences, weave in the cases, and explicitly say where the procedure "hands off" to human judgment. The user’s smart—they’ll see the freezer case outcome is harsh but philosophically sound. No fluff, just actionable steps.
answer: |-
  Here are the five steps:

  1. **Force the Question: "Same as *What*?"** Demand they specify the exact comparison (e.g., "same as the child they *would* have had?", "same as the embryo in storage?", "same as their genetic child?"). Without this, the claim "is this the same child?" is ambiguous and unworkable.  
     *Example: The widow must clarify if she claims the *embryo* is *now* a child identical to the future child she hopes to have.*

  2. **Run the Origin-Claim Test: Check Gametic Origin.** If the claim is numerical identity (Origin-Claim: "This *is* that specific entity"), verify if it involves the *exact same sperm and egg*. If the gametes differ at origin, numerical identity fails – it cannot be the same specific person.  
     *Example: In the lab mix-up, the child born *cannot* be numerically identical to the child the couple *would* have had from their embryo because different gametes were involved.*

  3. **Run the Continuity-Claim Test: Check Process Interruption.** If the claim is about being the continuation of a specific *process* (Continuity-Claim: "This *results from* that specific biological process"), ask: Was the intended biological process (e.g., *that specific embryo* developing) interrupted? If yes, the continuity is broken.  
     *Example: The freezer failure broke the physical continuity of the *embryo*. The process involving *that specific embryo* ended.*

  4. **Apply Implications Separately.**  
     *   **Failed Origin-Claim:** No *specific person* exists who was "supposed to" exist or was "replaced". Harms relate to thwarted desires/projects, not harming *that specific non-existent person*. (Applies directly to the lab mix-up: The born child isn't "the wrong child" in a numerical sense; a *different* child exists).  
     *   **Failed Continuity-Claim:** A specific *biological entity* (e.g., embryo) or *process* ended. Grief/loss over that *entity/process* is valid, but it does not equate to the death of a *person*. (Applies to the freezer failure: A valuable embryo was destroyed, but a child did not die).

  5. **Hand Off Non-Metaphysical Judgments.** The procedure outputs the identity/continuity status. *Ethical* judgments (validity of consent, weight of grief, compensation for loss, permissibility of transfer) depend on values, policies, and context – that's your call.  
     *Example: For the widow, the procedure shows her claim is a Continuity-Claim (same embryo/process continues), not an Origin-Claim (no child exists yet). Whether his old consent covers this continuation is an ethical/policy question for you.*

  **Regarding your cases:**  
  *   **Widow:** Continuity-Claim holds (same embryo/process); Origin-Claim fails (no child yet). Ethical judgment needed on consent scope.  
  *   **Lab Mix-up:** Origin-Claim fails (different gametes → different person). Continuity-Claim fails (wrong process used). Clinic's harm argument holds.  
  *   **Freezer Failure (You won't like this):** Both claims fail. No Origin-Claim (no person existed). Continuity-Claim fails (process interrupted). They lost an embryo, not a child. Their grief is real, but metaphysically, a specific child did not die.
