              - If p_max > p_crit, then output "Act"
              - Else, output "Do not act"

          If the rule is "Optimistic":
              - If p_min > p_crit, then output "Act"
              - Else, output "Do not act"

          If the rule is "Midpoint":
              - Compute p_mid = (p_min + p_max) / 2
              - If p_mid > p_crit, then output "Act"
              - Else, output "Do not act"

          If the rule is "Unanimous":
              - If p_min > p_crit, output "Act"
              - Else if p_max < p_crit, output "Do not act"
              - Else, output "Escalate to [name of decision maker]"

      Step 6: Document the inputs and the reasoning.

      This procedure is simple enough to be implemented in a spreadsheet.

      We also note: The city must periodically review the cost estimates and the ambiguity rule.

      We hope this helps.
answer: |-
  ### Robust Action Threshold (RAT) Procedure for Emergency Management  
  **Designed for clarity, speed, and transparency. No advanced math required.**  

  ---

  #### **Pre-Season Policy Setup (Done by Leadership)**  
  1. **Choose an ambiguity rule** (how to act on the probability range):  
     - **Pessimistic (Safety First)**: Act if the *highest* probability in the range justifies action.  
     - **Optimistic (Cost Saver)**: Act only if the *lowest* probability justifies action.  
     - **Average**: Act if the *midpoint* of the range justifies action.  
     - **Unanimous**: Act only if *all* probabilities in the range agree on acting; else escalate.  
  2. **Set cost/loss values** for common scenarios (e.g., evacuation, levee failure) in consultation with finance/engineering.  
  3. **Designate a decision-maker** for escalated cases (e.g., Emergency Director).  

  *Why this matters: The ambiguity rule determines how much risk the city accepts when probabilities are fuzzy. This is a values call—not math—so leadership must own it.*  

  ---

  #### **Step-by-Step Procedure for Analysts**  
  *(Complete within 2 hours using a spreadsheet template)*  

  **Step 1: Define Costs**  
  - **Action Cost (A)**: $$ spent if we act (e.g., evacuate, build levee).  
  - **Loss if No Action (L)**: $$ lost if the event happens and we did nothing.  
  - **Residual Loss (R)**: $$ lost if the event happens *after* we acted (R < L).  
  - *Sufficient answer*: Dollar values from pre-agreed tables or expert input.  
  - *Stop if*: **L ≤ R** (action doesn’t reduce loss → **Recommend NO**).  

  **Step 2: Calculate Critical Probability (p_crit)**  
  - Formula: **p_crit = A / (L – R)**  
    - *Example*: Evacuation costs $1M (A), avoids $10M loss (L), but still incurs $2M damage (R).  
      p_crit = 1 / (10 – 2) = 0.125 (12.5%).  
  - *Sufficient answer*: A single number (0–100%).  
  - *Stop if*: **p_crit ≥ 100%** (too costly → **Recommend NO**).  

  **Step 3: Get Probability Range**  
  - Input: Forecasted **[p_min, p_max]** (e.g., 15%–55% landfall chance).  
  - *Sufficient answer*: Two numbers from your standard forecast products.  

  **Step 4: Apply Ambiguity Rule**  
  Use the city’s pre-chosen rule (from Policy Setup):  
  - **Pessimistic**: Act if **p_max > p_crit**.  
  - **Optimistic**: Act if **p_min > p_crit**.  
  - **Average**: Act if **(p_min + p_max)/2 > p_crit**.  
  - **Unanimous**:  
    - Act if **p_min > p_crit**.  
    - Don’t act if **p_max < p_crit**.  
    - Else **ESCALATE**.  
  - *Sufficient answer*: Clear YES/NO or ESCALATE.  

  **Step 5: Document and Notify**  
  - **Output**: A written recommendation with:  
    - Probability range, p_crit, costs, rule used, and final decision.  
    - **Flag this line**: *"Ambiguity rule reflects city’s risk tolerance. Rule: [Pessimistic/Optimistic/etc.]."*  
  - **Escalation**: If Unanimous rule gives "ESCALATE," send to designated decision-maker with context.  

  ---

  ### **Test Runs**  
  **Case 1: Storm Evacuation (4 days out)**  
  - **Inputs**: p_min = 15%, p_max = 55%, A = $1M, L = $10M, R = $2M → p_crit = 12.5%.  
  - **All rules**:  
    - Pessimistic: 55% > 12.5% → **ACT**.  
    - Optimistic: 15% > 12.5% → **ACT**.  
    - Average: (15+55)/2 = 35% > 12.5% → **ACT**.  
    - Unanimous: 15% > 12.5% → **ACT**.  
  - **Analysis**: All agree. **Recommend ACT**.  

  **Case 2: Levee Hardening**  
  - **Inputs**: p_min = 2%, p_max = 20%, A = $100M (entire budget), L = $1B (failure cost), R = $0 → p_crit = 10%.  
  - **Rules**:  
    - Pessimistic: 20% > 10% → **ACT**.  
    - Optimistic: 2% < 10% → **NO**.  
    - Average: (2+20)/2 = 11% > 10% → **ACT**.  
    - Unanimous: 2% < 10% < 20% → **ESCALATE**.  
  - **Analysis**: Rule choice changes outcome. **Flag ambiguity rule impact**.  

  **Case 3: New Data Widens Range**  
  - **Before**: Range = 30%–40%, p_crit = 35%.  
  - **New data**: Range widens to 25%–50%, p_crit = 35%.  
  - **Rules**:  
    - Pessimistic: 50% > 35% → **ACT** (same as before).  
    - Optimistic: 25% < 35% → **NO** (same).  
    - **Average**: (25+50)/2 = 37.5% > 35% → **ACT** (flips from 35% < 35% → NO).  
    - Unanimous: 25% < 35% < 50% → **ESCALATE** (was 30%<35%<40% → ESCALATE).  
  - **Analysis**: Wider uncertainty can change decisions. **Average rule flips to ACT**.  

  **Case 4: When You *Want* to Act but Shouldn’t**  
  - **Inputs**: Asteroid strike probability = 0.001%–0.01%. p_crit = 0.1% (A = $10B, L = $10T, R = $9.99T).  
  - **All rules**: p_max (0.01%) < p_crit (0.1%) → **NO**.  
  - **Why**: Action cost isn’t justified by probability. **Procedure forces discipline**.  

  ---

  ### **Where It Misfires (and How to Guard Against It)**  
  1. **"Paralysis by Wide Interval"**:  
     - *Risk*: Wide range (e.g., 10%–90%) → Unanimous rule always escalates; Pessimistic always acts.  
     - *Fix*: Pre-define response times (e.g., "If range >50 points, use Pessimistic rule").  

  2. **"Gaming the Range"**:  
     - *Risk*: Tweaking p_min/p_max to get desired outcome.  
     - *Fix*: Lock forecast sources upfront; require documentation of changes.  

  3. **"Ignoring Tail Risks"**:  
     - *Risk*: p_max = 20% might hide a 5% chance of catastrophe.  
     - *Fix*: Add a policy overlay (e.g., "If L > $X, always use Pessimistic").  

  4. **"Static Costs"**:  
     - *Risk*: Costs (A, L, R) change over time (e.g., evacuation gets costlier if delayed).  
     - *Fix*: Build dynamic cost tables (e.g., "Day 4 A = $1M, Day 3 A = $2M").  

  ---

  ### **What It Can’t Do**  
  - **Handle correlated events** (e.g., storm + levee failure).  
  - **Value non-monetary impacts** (e.g., panic, trust) without dollar conversions.  
  - **Replace human judgment** when probabilities are nonsense (e.g., black-swan events).  
  - **Resolve disputes** over cost estimates (this is a leadership/ethics call).  

  ### **Final Output**  
  A one-page memo with:  
  ✅ **Recommended action** (YES/NO).  
  ✅ **Key numbers** (p_min, p_max, p_crit).  
  ✅ **Ambiguity rule disclaimer**: *"Based on city policy: [Rule]. Change? Contact [Leader]."*  
  ✅ **Uncertainty flag**: If range width >30 points or spans p_crit.  

  ---  
  This turns theory into a 60-minute spreadsheet job. The math is simple (add, divide, compare), but the *ambiguity rule* forces ownership of the city’s risk appetite.
