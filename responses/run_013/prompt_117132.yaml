  ### Constructed Supertask: The Damped Harmonic Oscillator with Forced State Flips

  I construct a supertask using a damped harmonic oscillator with an external impulse mechanism. The system consists of a mass on a spring in a viscous fluid (to provide damping), with an external device that applies discrete impulses to flip the discrete state. The setup is bench-top: all energies, speeds, and forces are finite, and no exotic entities are involved.

  #### Specifications and Setup
  - **Discrete state**: The position of a switch (left or right) that determines the direction of an external impulse applied to the mass.
  - **Continuous magnitude**: The energy of the oscillator, \(E(t) = \frac{1}{2}kx(t)^2 + \frac{1}{2}mv(t)^2\), where \(k\) is the spring constant, \(m\) is the mass, \(x(t)\) is displacement, and \(v(t)\) is velocity.
  - **Critical value**: Energy \(E^* = 0\) (the equilibrium point). At \(E = 0\), the system is at rest (\(x = 0, v = 0\)), and the discrete state (switch position) is not fixed by the energy alone.
  - **Stages and times**: Impulses are applied at times \(t_n = t^* - \frac{T}{2^n}\) for \(n = 0, 1, 2, \ldots\), accumulating at \(t^* = T\) (e.g., \(T = 1\) second). There is no last stage, and the task completes in finite time.
  - **State changes**: At each \(t_n\), an impulse flips the switch (left to right or vice versa) and applies a force to reverse the velocity. This changes the discrete state and injects energy.
  - **Dynamics**: The system is damped (damping coefficient \(b\)), so energy decays between impulses. The impulse at \(t_n\) instantaneously reverses velocity and toggles the switch, with energy adjusted to ensure \(E(t)\) converges to 0 at \(t^*\).
  - **Energy convergence**: Choose initial energy \(E_0\) and damping such that after each impulse, the energy decreases as \(E(t_n) = E_0 / 2^n\). For example:
    - At \(t_0 = 0\), start with \(E(0) = E_0\), switch left.
    - Damping reduces energy until \(t_1 = T/2\), where \(E(t_1^-) = E_0 e^{-b T / (2m)}\) (from damping). Apply impulse to set \(E(t_1) = E_0 / 2\) and flip switch to right.
    - Continue: at \(t_n\), set \(E(t_n) = E_0 / 2^n\) and flip the switch. The energy at \(t^*\) is \(\lim_{n \to \infty} E_0 / 2^n = 0\).
  - **Terminal state determination**: At \(E = 0\), the switch position is not fixed by energy. However, the **net angular momentum imparted by the impulses** determines the terminal state. Specifically:
    - Each impulse at \(t_n\) imparts a change in momentum \(\Delta p_n = 2m v_n\) (to reverse velocity), where \(v_n\) is the velocity magnitude before the impulse.
    - The impulses alternate direction (leftward or rightward) based on the switch state.
    - The net impulse (vector sum) is \(\sum_{n=0}^{\infty} (-1)^n \Delta p_n\). This series converges absolutely because \(|\Delta p_n| \propto \sqrt{E(t_n)} \propto 1 / \sqrt{2^n}\), so \(\sum |\Delta p_n|\) converges.
    - The net impulse is nonzero and in a definite direction (e.g., leftward if the series sum is negative). This fixes the terminal switch position: if net impulse is leftward, the switch is left at \(t^*\).

  #### Defense of the Terminal State Fixation
  The net angular momentum (or net impulse) is an **independent physical fact** due to conservation of angular momentum for the system. The impulses are applied by a fixed mechanism (e.g., a solenoid with a defined orientation), so each \(\Delta p_n\) has a direction set by physics (left/right). The convergent series of impulses imparts a definite net momentum change to the system, which is a measurable physical quantity. This is not a convention; it is fixed by:
  1. **Laws of physics**: Conservation of momentum dictates that the net impulse equals the total change in momentum.
  2. **Mechanism design**: The impulse directions are physically constrained (e.g., by the solenoid's mounting), not chosen arbitrarily. The alternating switch flips ensure the series \(\sum (-1)^n \Delta p_n\) converges to a nonzero value.
  3. **Measurability**: The net impulse can be read out from the final momentum of a coupled secondary system (e.g., a low-mass indicator flag) that moves in response to the net impulse but does not affect the primary dynamics.

  This fixation avoids convention because the physics of the impulse mechanism (e.g., the solenoid's force law and orientation) breaks the symmetry. If the net impulse is leftward, the switch must be left at \(t^*\) to be consistent with the cumulative effect. The energy converging to 0 leaves the state open, but the net impulse fixes it.

  #### Verification of Specifications
  - **Discrete state changes at stages**: The switch flips at each \(t_n\), with no last stage.
  - **Times accumulate at \(t^*\)**: \(t_n = T - T/2^n \to T\), finite completion time.
  - **Continuous magnitude converges**: \(E(t) \to 0\) at \(t^*\).
  - **Critical value**: At \(E = 0\), the discrete state is not fixed by \(E\) alone.
  - **Terminal state determinate**: Fixed by net impulse, not convention.
  - **Bench-top compliance**: All velocities are sub-relativistic (e.g., \(v < 1\) m/s), forces are finite (impulses use solenoids with finite field strengths), and energies are finite (e.g., \(E_0 = 1\) J, decaying rapidly).

  #### Verdicts on Philosophical Views
  - **Limit/continuity view**: The continuous energy \(E(t)\) converges to 0, but the discrete state has no limit (it oscillates and does not converge). This view cannot determine the terminal state and is **refuted** by the case, as the state is determinate despite the energy limit.
  - **No-fact-of-the-matter view**: This view claims indeterminacy. However, the net impulse provides a physical fact that fixes the state. This view is **refuted**.
  - **Impossibility view**: This view claims supertasks are physically impossible. The construction is consistent with known physics (finite energies, no singularities), so this view is **refuted**.

  The net impulse is the **single feature** doing the work. Without it (e.g., if impulses are symmetric and net impulse is zero), the case collapses into **Thomson's lamp**: underdetermined, with no physical tie-breaker.

  #### Minimal Variant Without the Key Feature
  Remove the directional asymmetry in impulses (e.g., make impulses purely velocity-reversing with no net directionality). Then:
  - Net impulse is zero by symmetry.
  - Energy still converges to 0.
  - No physical fact fixes the terminal state; it is underdetermined.
  - This reduces to Thomson's lamp, vindicating the no-fact-of-the-matter view.

  #### Attack from No-Fact-of-the-Matter Defender
  A defender would attack by claiming:
  1. The net impulse is not directly measurable at \(t^*\) without affecting the system.
  2. The impulse mechanism's orientation is a "convention" (e.g., why not mount the solenoid differently?).

  Rebuttal:
  - The net impulse is a physical property (change in momentum) that exists independently of measurement. It can be inferred from the system's motion or a weakly coupled probe.
  - The mechanism's orientation is fixed by the initial setup (a fact of the experimental construction), not a convention. Physics dictates the outcome given this setup.

  #### What This Establishes Beyond Thomson's Lamp
  Thomson's lamp has only a bare two-state description, so underdetermination might be dismissed as abstract. This construction shows that:
  - Underdetermination **survives** physical fleshing-out (energy converges to a critical value, and state oscillations persist).
  - However, it **can be resolved** by additional physical facts (net impulse), which Thomson's lamp lacks.
  - Thus, underdetermination is not an artefact of abstraction but a feature of supertasks that can sometimes be fixed by physics.

  ---

  **Final Verdict**: The underdetermination in Thomson's lamp is not an artefact of its bare description; it survives physical fleshing-out but can be resolved in specific setups with additional physical facts (e.g., net impulse). The case refutes the limit/continuity, no-fact-of-the-matter, and impossibility views, showing that supertasks can have determinate outcomes.
