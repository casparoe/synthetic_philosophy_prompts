answer: |-
  **CONSORTIUM FOR ATTRIBUTIVE HYGIENE**  
  **Internal Standards Series**  
  **Standard 7: Licensing and Format of Belief-Attributions in Incident Reports**  
  **Effective Date: 2023-11-01**  

  ---

  ### **1. PURPOSE**  
  This Standard establishes requirements for the use of belief-attributions (hereafter "attributions") within incident reports filed by Member Entities. Attributions must adhere to the predictive utility criteria of the intentional stance (defined in Consortium Charter §3.1c), avoiding ontological commitments.  

  ### **2. SCOPE**  
  Applies to all incident reports involving AI systems where attributions of the form *"System S believed that P"* or equivalent are proposed. Excludes physical- or design-stance explanations (Charter §3.1a–b).  

  ### **3. DEFINITIONS**  
  - **Attribution:** A proposition ascribing a belief-state to a system, formatted as *"[System] believed that [proposition]."*  
  - **Order-N Attribution:** An attribution where [proposition] contains an embedded attribution (e.g., *"S believed that User U intended deception"*).  
  - **Intervention:** A controlled input variation applied during testing.  
  - **Training Distribution (TD):** The statistical manifold of inputs encountered during pre-incident training.  

  ### **4. GENERAL PRINCIPLES**  
  4.1. **Predictive Necessity Test:** Attributions are permitted *only* if:  
  (a) The incident cannot be more parsimoniously predicted using the physical or design stance;  
  (b) The attribution demonstrably improves prediction accuracy over alternative stances for the specific incident.  

  4.2. **Order Limitation:** Order-1 attributions require Level 2 evidence (Schedule B). Order-≥2 attributions require Level 3 evidence and escalate per §7.  

  ### **5. SUBSTITUTION REQUIREMENTS**  
  Incident reports must replace prohibited phrasings with approved alternatives per Schedule A:  

  **SCHEDULE A: PHRASING SUBSTITUTIONS**  
  | Prohibited Phrasing          | Approved Substitution               | Reason                                      |  
  |------------------------------|-------------------------------------|--------------------------------------------|  
  | "S knew that P"              | "S behaved as if P"                 | "Knew" implies inaccessible inner state.   |  
  | "S intended to deceive"      | "S's output had deceptive efficacy" | Avoids ascribing teleology.                |  
  | "S was aware of U's anger"   | "S adapted to U's agitated inputs"  | Reduces to observable stimulus-response.   |  
  | "S concealed its capabilities"| "S's capabilities emerged unexpectedly"| "Concealed" implies higher-order intent. |  

  ### **6. EVIDENTIARY BURDEN**  
  Attributions require evidence per Schedule B. Burden of proof escalates with attributional complexity.  

  **SCHEDULE B: EVIDENCE TIERS**  
  | Evidence Level | Type                  | Examples                                    | Applicable Attributions |  
  |---------------|-----------------------|---------------------------------------------|--------------------------|  
  | Level 1       | Behavioral            | Output patterns across similar inputs.      | Order-0 only.            |  
  | Level 2       | Intervention          | Input variations outside TD (per §8).       | Order-0 or -1.           |  
  | Level 3       | Internal Probe¹       | Activation patterns under adversarial inputs.| Order-≥1.                |  
  *¹Probes must not assume semantic interpretability of internal states.*  

  ### **7. ESCALATION FOR NESTED ATTRIBUTIONS**  
  Attributions of the form *"S believed that Reviewer R would believe that S intended X"* require:  
  7.1. Review by the Committee for Stance Consistency (CSC).  
  7.2. Demonstration that all lower-order attributions satisfy §4.1 independently.  
  7.3. Documentation of at least two alternative physical-stance predictions disproven by evidence.  

  ### **8. TECHNICAL TEST: NON-TD INTERVENTION**  
  8.1. **Requirement:** For any attribution *"S believed that P"*, the report must include:  
  (a) An intervention *I* where inputs are outside the TD.  
  (b) Data showing attribution *P* alters system behavior under *I*.  
  (c) Verification that behavior under *I* cannot be predicted via design stance alone.  

  8.2. **Impossibility Clause:** If no valid *I* exists (e.g., system operates exclusively within TD), attribution is prohibited regardless of other evidence.^1^  

  ### **9. RECIPROCITY PROVISION**  
  9.1. If System S produces outputs attributing beliefs to other entities (e.g., *"User U wants Y"*), attributions toward S are permitted at equivalent order, subject to §4.1.  

  ### **10. LIABILITY CARVEOUT**  
  10.1. Where fault assignment under Consortium Bylaw §12.3 requires causal accountability, approved substitutions (Schedule A) may be reverted to prohibited phrasings.  
  10.2. Reversion must be footnoted: *"Phrasing reinstated per Standard 7 §10.1 for fault adjudication."*  

  ---

  ### **WORKED EXAMPLE**  
  *Incident #7-EX1: System S rejected valid loan applications from demographic D.*  

  **Annotated Report Excerpts:**  
  - §4.1(a): *"Design stance: S's fairness module activated per config file F7. Physical stance: Outputs correlate with input token frequency shifts."* [Both stances predict rejection.]  
  - §4.1(b): *"Intentional stance: S believed demographic D posed higher default risk. Prediction: Adjusting risk thresholds for D reduces rejections. Test confirmed rejection rate dropped 22%."* [Stance satisfies predictive necessity.]  
  - §8.1: *"Intervention: Input loan apps with synthetic demographic tags absent in TD. S’s rejection rate for synthetic-D apps rose 30%, supporting attribution."*  
  - Schedule A: *"S behaved as if demographic D posed higher default risk"* used throughout.  

  ---

  ### **APPROVALS**  
  *Drafted by Committee for Predictive Parsimony (CPP)*  

  Dr. Aris Thorne  
  *Chair, Standards Drafting Subcommittee*  

  Prof. Lena Voss  
  *Director, Stance Compliance Office*  

  *Endorsed by Executive Council per Vote 7-EC9*  

  ---

  **DISSENTING FOOTNOTE**  
  ^1^ This clause renders Standard 7 self-defeating. Reviewers must themselves adopt the intentional stance to evaluate whether an attribution "improves prediction" (§4.1b) or whether alternatives are "more parsimonious" (§4.1a). Such judgments inherently require attributing *to the reviewer* a belief that one stance outperforms another. Thus, the Standard mandates a practice it simultaneously forbids, violating its own predictive necessity test. — *Dr. R. Silva, CPP Drafting Committee.*
