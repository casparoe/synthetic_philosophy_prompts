prompt: |-
  Ok so I've been reading rationalist blogs since roughly the OB days and one thing has been bugging me for years. Everybody in this corner of the internet treats Pascal's wager (believe in God, because a finite chance of an infinite payoff beats any finite cost) as a joke - it's the go-to example of how "maximize expected value" reasoning goes off the rails. But alot of the same people treat the St. Petersburg paradox (the coin game paying 2, 4, 8, 16... dollars, with infinite expected value) as a live, unsolved problem in decision theory, something you're supposed to have an actual view about. I want to know if that asymmetry is real or just fashion.

  So compare them for me, structurally. I dont care whether you should go to church. I care where each argument gets its infinity: the wager from a finite probability times an infinite payoff, St. Petersburg from an infinite series of finite payoffs. How much work is that difference doing? Then go through the standard fixes and tell me which ones transfer. Does the log-utility / diminishing-marginal-utility move actually touch the wager, or does it only ever work on St. Petersburg because we quietly assume the payoff is finite? Does capping utility kill both, and if so is that solving the problem or changing the subject? Does "ignore probabilities below some threshold" do the same job in both cases, and does the arbitrariness of the threshold hurt the St. Petersburg version of that fix as badly as the wager version? And what about the objection that nobody can actually bankroll the St. Petersburg game - is there anything like it on the wager side?

  The part I actually care about: the mugging case (tiny chance of an astronomically large but finite payoff, small cost) is supposed to be the bridge between the two. Does it really collapse the distinction, or does it inherit the wager's problem rather than St. Petersburg's? Same question for the many-gods objection - several wagers, each with infinite expectation, pointing at incompatible actions. Is that a different kind of failure than what St. Petersburg does? And finally: which of the two is the harder problem for expected utility theory, and does either one show that it's inconsistent rather than merely incomplete? People keep saying "the expectation is undefined, so there's no maximum" like it's checkmate, and I want to know if it is.
reasoning: |-
  Okay, the user is deep into rationalist blogs and has been puzzled by the asymmetry in how Pascal's Wager and the St. Petersburg Paradox are treated. They want a structural comparison focusing on where the infinity comes from, how standard fixes apply to both, and whether the mugging case bridges the gap. They're also curious about which problem is harder for expected utility theory.

  First, I need to recall the core structures. Pascal's Wager uses a finite probability multiplied by an infinite payoff, leading to infinite expected utility regardless of the cost. The St. Petersburg Paradox, on the other hand, sums an infinite series of finite payoffs with decreasing probabilities, resulting in an infinite expected value. The key difference is the source of infinity: probability times payoff vs. sum of products.

  The user is asking about standard fixes. Diminishing marginal utility, like log utility, works for St. Petersburg by making the series converge, but it doesn't touch Pascal's Wager because the infinity from God's payoff remains. Capping utility kills both infinities but feels like changing the subject. Probability thresholds might handle both but seem arbitrary, especially in the wager where the probability of God is already low. The bankroll argument only applies to St. Petersburg since no one can cover infinite payouts, but Pascal's Wager lacks a similar real-world constraint.

  The mugging case is interesting. It replaces infinite payoffs with finite but huge ones, making both problems similar. But Pascal's Mugging might be worse because any tiny probability multiplied by a large enough payoff can dominate, whereas St. Petersburg's series still needs to diverge. The many-gods objection is unique to the wager, showing that multiple infinite expectations lead to contradictions, which isn't an issue for St. Petersburg.

  Regarding expected utility theory, both paradoxes highlight its incompleteness. St. Petersburg shows that undefined expectations require additional rules, while Pascal's Wager reveals issues with multiple infinities. Neither proves inconsistency but exposes limitations needing patches.

  The user's deeper need might be understanding why the rationalist community treats one as a joke and the other seriously. The answer lies in the many-gods objection and the ad-hoc nature of fixes for the wager versus the technical, quantifiable nature of St. Petersburg's problem. They might also want validation that their observation about asymmetry is valid, which it is, due to the different structural issues and practical implications.
answer: |-
  You've hit on a fascinating and genuinely important asymmetry in rationalist discourse. The structural differences are subtle but crucial, and the asymmetry isn't *just* fashion – it stems from how the core problems interact with potential solutions and real-world constraints. Let's break it down as requested:

  **1. The Core Structural Difference: Source of Infinity**
  *   **Pascal's Wager (PW):** Infinity comes from **a single state (God exists) with infinite payoff (eternal bliss)**, multiplied by a *finite* (even if arbitrarily small) probability `P(God) > 0`.
      *   `Expected Utility(Believe) ≈ P(God) * ∞ + ...` → **∞**
      *   `Expected Utility(Disbelieve) ≈ P(God) * (-∞) + ...` → **-∞** (or finite, depending on variant)
      *   **Key:** The infinity is *exogenous* and *unbounded* within the state. It's an input assumption.
  *   **St. Petersburg Paradox (SPP):** Infinity comes from **an infinite series of states (coin flip sequences)**, each with a *finite* payoff that grows exponentially (`$2^n`), multiplied by a probability that decays exponentially (`1/2^n`).
      *   `Expected Utility = Σ [Probability(n) * Payoff(n)] = Σ [(1/2^n) * 2^n] = Σ [1] = 1 + 1 + 1 + ...` → **∞**
      *   **Key:** The infinity is *emergent* from the summation of an infinite series where the product `prob * payoff = constant` (or diverges). It's a mathematical consequence of the game structure.

  **This difference drives how "fixes" apply:**

  **2. Evaluating Standard Fixes:**

  *   **Diminishing Marginal Utility (Log Utility, etc.):**
      *   **SPP:** **Highly Effective.** Applying `U(wealth) = log(wealth)` transforms the sum: `Σ [(1/2^n) * log(2^n)] = Σ [(1/2^n) * n * log(2)]`. This is `log(2) * Σ [n / 2^n]`, a convergent series (≈ `log(2)*2`). The paradox vanishes; a finite price makes sense.
      *   **PW:** **Ineffective.** `U(Infinite Bliss)` remains infinite. `log(∞)` is still ∞. `P(God) * ∞` is still ∞. The wager's core argument is untouched. The infinity is baked into the *nature* of the payoff itself, not just its scale relative to finite wealth.
  *   **Capping Utility (Finite Maximum Utility):**
      *   **SPP:** **Solves it.** If `U(wealth)` has a maximum finite value `U_max`, then `Σ [(1/2^n) * U(2^n)] ≤ Σ [(1/2^n) * U_max] = U_max * Σ [1/2^n] = U_max * 2`. Finite expectation.
      *   **PW:** **Solves it (technically), but changes the subject radically.** Capping `U(Heaven)` at a finite value fundamentally destroys the theological premise of infinite reward/punishment. It "solves" the problem by rejecting its core input. This feels like cheating for PW in a way it doesn't for SPP. SPP's payoffs are monetary; capping their utility feels like a plausible psychological/economical constraint. Capping Heaven's utility feels like rejecting the wager's starting point.
  *   **Ignoring Small Probabilities (Probability Thresholds):**
      *   **SPP:** **Plausible & Common.** Humans intuitively disregard the vanishingly small probabilities of winning astronomical sums (flip 50 heads in a row? Forget it). Setting a cutoff `N` where you ignore `n > N` gives a finite expectation `Σ_{n=1}^N [1] = N`.
      *   **PW:** **Arbitrariness is Fatal.** Applying a probability threshold `P_min` means ignoring `P(God)` if `P(God) < P_min`. But *why* is `P_min` chosen? The arbitrariness is glaring. If `P(God)` is above your threshold, the wager forces belief. If below, it doesn't. This feels deeply unsatisfying and ad-hoc for PW in a way it doesn't for SPP. For SPP, the threshold can be justified by cognitive limits, computational limits, or the physical impossibility of the game running long enough. For PW, the justification seems purely pragmatic (avoiding the wager's conclusion) or based on prior skepticism.
  *   **Bankroll/Bankruptcy Constraint (Realism):**
      *   **SPP:** **Devastatingly Effective & Realistic.** No real entity (casino, person, country) has infinite resources. The game must end when the bank can't pay (`2^n` exceeds their reserves `$M`). This caps `n` at `log2(M)`, making expectation finite (≈ `log2(M)`). This is a *real* constraint SPP faces.
      *   **PW:** **No Direct Analogue.** Who is the "bank" for God's promise? There's no equivalent real-world resource constraint limiting the infinite payoff. This fix simply doesn't apply meaningfully to PW. (One *could* argue human cognitive limits prevent truly believing based on tiny probabilities, but that circles back to the probability threshold fix with its arbitrariness problem).

  **3. The Mugging Case: Does it Collapse the Distinction?**
  *   **Structure:** Tiny probability `P` of a finite but astronomically large payoff `M`. Finite cost `C`. `EU ≈ P*M - C`.
  *   **Relation to Paradoxes:**
      *   It **inherits PW's core problem**: `P*M` can be made arbitrarily large *even for fixed P* by increasing `M`. You can be "mugged" by any hypothesis offering vast rewards for belief, regardless of plausibility. Like PW, it exploits the linearity of EU in payoff magnitude.
      *   **It *avoids* SPP's core structure:** There's no infinite series of states. It's a single improbable state with a huge payoff. The infinity isn't emergent from summation; it's implied by the ability to scale `M` arbitrarily.
  *   **Conclusion:** Pascal's Mugging **collapses towards PW's problem**, not SPP's. The core vulnerability is the **linear scaling of EU with payoff magnitude combined with arbitrarily small probabilities**. SPP's vulnerability arises specifically from the *diverging summation* of many improbable states. While a Mugger *could* offer an SPP-like payout schedule, the classic mugging is a single-shot, huge `M`.

  **4. The Many-Gods Objection: A Unique Failure Mode**
  *   **Problem:** Multiple incompatible deities `G_i`, each with `P(G_i) > 0`, each offering infinite reward for exclusive belief, infinite punishment for disbelief/wrong belief. `EU(Believe in G_i)` is undefined: `∞ - ∞` (if considering the hells from other gods). Or, if only your chosen god punishes disbelief, `EU(Believe in G_i) = ∞`, `EU(Disbelieve/Other) = -∞`. But you have multiple actions (`Believe_G1`, `Believe_G2`, ...) all promising `∞`. EU maximization gives no guidance; it's **indeterminate**.
  *   **Relation to SPP:** SPP has **no analogous problem**. There's only one game structure. The paradox arises from the calculation for *that single game*. SPP doesn't present multiple, incompatible infinite-expectation options vying for the same choice. The Many-Gods objection highlights a **crisis of comparison and indeterminacy** unique to scenarios with multiple sources of unbounded utility tied to mutually exclusive actions. SPP remains a problem of calculating the utility of *one* action (playing the game).

  **5. Which is the Harder Problem & Does it Break EU?**
  *   **Harder Problem:** **Pascal's Wager (especially with Many-Gods) is arguably the harder *practical/philosophical* problem for EU.** SPP is largely "solved" in practice by:
      1.  Applying diminishing marginal utility (log utility is widely accepted for money).
      2.  Recognizing bankroll constraints (the game is impossible as described).
      3.  Accepting probability thresholds (humans aren't ideal calculators).
      These feel like reasonable patches *within* or *complementary* to EU theory. PW and its variants (Mugging, Many-Gods) resist clean solutions:
      *   Diminishing utility doesn't touch the core infinity.
      *   Capping utility rejects the premise.
      *   Probability thresholds feel arbitrary and suspiciously motivated.
      *   Many-Gods creates true indeterminacy.
  *   **Does it Break EU?** **Neither proves EU is *inconsistent* (internally contradictory). Both show it's *incomplete* or *indefinite* when dealing with infinities.**
      *   **SPP:** Shows that EU can be **undefined** (`∞`) for a well-defined action. The theory doesn't tell you how much to pay because the calculation diverges. It highlights that linear utility for money leads to absurd prescriptions. The "checkmate" (`undefined, so no maximum`) is real *for that specific calculation under those specific (unrealistic) assumptions*. Fixes involve adding realistic constraints (utility curvature, resource limits) that make EU well-defined again.
      *   **PW (Many-Gods):** Shows that EU can be **indeterminate** when faced with multiple actions (believing different gods) all promising infinite reward *and* infinite punishment for wrong choices. It becomes `∞ - ∞`, which is mathematically undefined. Even without Many-Gods, the `finite cost vs. ∞ EU` comparison relies on the (often unstated) axiom that `∞ > any finite number`, which works but feels shaky when `P` is microscopic. The "undefined" objection here (`∞ - ∞` in Many-Gods) is also a form of checkmate for EU maximization as a sole decision procedure in such scenarios.

  **Conclusion: The Asymmetry is Real (and Rational)**

  The asymmetry in treatment isn't just fashion. SPP is seen as a "live" problem because:
  1.  Its infinity is *emergent* from a summation, making it vulnerable to realistic constraints (utility curvature, bankroll limits) that feel less like cheating and more like necessary refinements to the model.
  2.  It has clean, quantifiable solutions within extended decision theories (e.g., using log utility).
  3.  It lacks the paralyzing philosophical baggage (theology, meaning of belief) and the unique indeterminacy of Many-Gods.
  4.  The "fixes" for SPP (log utility, bankroll) are widely applicable to other finite, large-payoff scenarios.

  PW (and Mugging, Many-Gods) is often dismissed because:
  1.  Its infinity is *exogenous* and *unbounded*, making it immune to the most natural fixes for SPP (diminishing utility).
  2.  Effective "fixes" (capping utility, probability thresholds) feel arbitrary, question-begging, or like rejecting the premise itself.
  3.  The Many-Gods objection creates a unique, seemingly insurmountable problem of indeterminacy among infinite options.
  4.  The core argument feels more like a rhetorical trap exploiting mathematical formalism than a genuine decision problem amenable to refinement.

  **In essence: SPP exposes a technical flaw in applying naive EU to a specific mathematical construct; PW exposes a foundational vulnerability to unbounded utility claims that EU theory alone seems ill-equipped to resolve without external, often controversial, constraints.** Both show EU is incomplete with infinities, but PW's problems feel deeper and less tractable within the standard framework, justifying the asymmetry in how seriously they are taken as ongoing decision theory puzzles.
