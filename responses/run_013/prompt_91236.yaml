prompt: |-
  hi, I'm a junior in high school and I'm on the debate team. we're doing a unit on organ donation and the dead donor rule (the rule that you can't take someone's organs until they're already dead), and I volunteered to make the handout that sorts out what everyone in the room actually believes, because right now our arguments are a mess. half of us say the person on the ventilator is obviously dead, half say the body is obviously still alive, and everyone just talks past each other about "brain death" like it's one thing.

  I want you to act like a philosopher of medicine who has sat on a real hospital ethics committee, and build me a decision tree (or flow chart, or quiz with a scoring key, whatever actually sorts people best) that takes someone from stuff everybody already agrees on to a named position about when a person is dead. Please think it through carefully before you start writing — maybe list out all the positions you can come up with first and then figure out which questions really seperate them, because I don't want a tree where two different branches end up in the same place.

  Please don't just give me the three answers from the textbook (brain, heart, or both), I've already got those. Here's the stuff I want in there, because it's the stuff that actually bugs me:

  - the difference between the definition of death, the criteria for it, and the bedside test. I keep seeing people agree about the definition and then fight about the test as if the test was the definition.
  - irreversibility. if someone's heart stops and they get CPR and come back, did they die? everybody talks like they did, but then death isn't irreversible. so is "you can't come back from it" part of what death means, or just part of how we check?
  - the fact that a body whose whole brain has died can sit on a machine for months, digesting, healing wounds, fighting infections, and I read about cases where a body like that was kept going long enough to deliver a baby. does any of that count as the organism still being alive, or is it just parts running on their own with nobody home?
  - the "three deaths" thing I read about somewhere: biological death, the death of the person or their consciousness, and social death, when people start treating you as gone. I'd like the tree to show which one each position is actually about.
  - whether the answer changes depending on what you need the answer for: organ donation, turning off the machine, a funeral, inheritance, a pregnancy. is "dead" one fact, or does it depend on what's at stake?
  - whether being dead is even a yes/no thing or could be a process or a grey zone, and if it's grey, whether that's because we don't know or because there's nothing there to know.

  every branch node should be a concrete case or a claim about a case, worded so my teammates can answer it without knowing the name of any position. like, don't ask "are you a higher-brain theorist", ask them about the patient in room 3. the leaves should be named positions, each with one line on the most awkward thing it has to swallow. if there's a combination of answers that nobody actually defends, leave the leaf empty and tell me why (is it incoherent, just unattractive, or has nobody bothered). and if two positions land on the same leaf because the tree can't tell them apart, say so instead of pretending they're different. keep it to maybe eight or so leaves, but don't drop a position just because it's weird.

  be committed — I don't want a menu of options, I want your tree. make the calls: which questions go on it, which positions are the leaves, and at the end tell me where you'd actually put yourself and which branch you think people get wrong the most, and definately give reasons and not hedges.
reasoning: |-
  Okay, let me unpack this request. A high school debater needs a philosophical tool to clarify organ donation debates, specifically addressing the Dead Donor Rule. They're frustrated with teammates talking past each other about brain death and want a decision tree that reveals foundational beliefs. 

  First, I need to map the conceptual landscape. The key tensions they identified are crucial: the definition-criteria-test distinction, irreversibility paradoxes, somatic integration in brain-dead bodies, different death concepts (biological/personal/social), contextual factors, and the binary vs. gradual death question. 

  Hmm... standard "brain/heart/both" positions won't suffice here. I should start by listing all philosophically coherent positions, even fringe ones. Let me brainstorm:
  - Strict cardiopulmonary advocates (irreversible cessation)
  - Whole-brain standard defenders
  - Higher-brain theorists (consciousness loss = death)
  - Somatic integration skeptics (like Shewmon's critique)
  - Contextualists (death varies by purpose)
  - Process theorists (death isn't instantaneous)
  - ...and combinations thereof

  The irreversibility issue is particularly thorny. When we say "Joe died for two minutes during CPR," we're using "death" colloquially, not medically. Medically, death requires irreversibility - but that creates a problem: if irreversibility depends on available technology, does death become relative? A 19th-century drowning victim was irreversibly dead; today they might be revived. This needs careful handling in the tree.

  For the tree structure, I'll use concrete clinical vignettes rather than abstract questions. For example:
  - "If a brain-dead body gestates a fetus for 6 months, is the organism alive?" (probes somatic integration)
  - "When CPR restarts a heart after 10 minutes, was the person dead during compressions?" (tests irreversibility)
  - "If all cognitive function is permanently lost but the brainstem works, is this death?" (differentiates whole-brain vs higher-brain)

  The body's capabilities post-brain-death fascinate me. Shewmon's research shows brain-dead bodies can fight infections, heal wounds, even grow - yet lack integrated organismic function. How to capture this? The tree must force people to choose: is thermoregulation without a brain evidence of life, or just cellular persistence?

  I'm wary of oversimplifying the "three deaths" concept. Biological death (organism ceases functioning), personal death (consciousness ends), and social death (treated as gone) often align, but not always. The tree should expose when someone is conflating them - e.g., someone might call a PVS patient "dead" socially but not biologically.

  Contextualism deserves serious inclusion. Legally, we might declare death for organ donation at brain death, but for pregnancy support, we treat the same body as "alive enough" to gestate. Is this inconsistent? Or pragmatically necessary? The tree could pose: "Should we remove organs from an anencephalic baby who breathes spontaneously?"

  For the endpoint, I'll limit to 7-8 named positions with their "awkward swallow" - the counterintuitive consequence they must accept. For example:
  - Whole-brain defenders must accept that bodies on ventilators aren't organisms but "cell colonies"
  - Cardiopulmonary advocates must say CPR temporarily resurrects corpses
  - Higher-brain theorists must call some breathing patients "dead"

  My own stance? After years on ethics committees, I lean toward a revised whole-brain standard that accounts for somatic integration - but I'll confess this in the rationale. The most common mistake? Equating brain death tests with the definition of death. People fight over EEG reliability when they actually disagree on whether consciousness loss alone constitutes death.

  The tree will have binary choices but acknowledge grey zones. If someone insists death is always gradual, they'll hit a "process theorist" leaf where all standard definitions break down. Empty branches? Perhaps "irreversible personal death with reversible biology" - nobody argues corpses retain personhood.

  Final challenge: making vignettes accessible to teens without medical jargon. "Patient in room 3" will be a pregnant brain-dead woman; "patient in room 4" a revived cardiac arrest victim. The scoring key will feel like a personality quiz but reveal philosophical commitments.

  ...time to build the tool. The student's depth of questioning impresses me - this tree might reshape their entire debate.
answer: |-
  Here's a decision tree designed to cut through semantic confusion and reveal foundational beliefs about death. It starts with clinically observable phenomena and forces choices about interpretation. The tree isolates **6 distinct positions** (+ 1 "process" escape valve), each with a clear "awkward swallow" – the counterintuitive consequence they must accept.

  **How to Use:**  
  Answer each question **based solely on the described scenario**, ignoring labels like "brain dead." Choose the branch that *most closely* matches your intuition. Proceed to the endpoint.

  ---

  ### THE DECISION TREE

  **1. SCENARIO A:** *A patient’s heart and breathing stop. After 10 minutes of CPR, their heart restarts and they recover fully.*  
  → **Did the patient "die" during those 10 minutes?**  
    • **YES** → Go to **Position: CARDIOPULMONARY DEATH**  
    • **NO** → Go to **Question 2**  

  **2. SCENARIO B:** *A patient with massive, irreversible brain damage (no cortex function) is on a ventilator. They breathe spontaneously, have sleep/wake cycles, and react reflexively to pain, but show no awareness or cognition.*  
  → **Is this patient dead?**  
    • **YES (lacks consciousness forever)** → Go to **Question 3**  
    • **NO (body is alive)** → Go to **Position: WHOLE-BRAIN DEATH**  

  **3. SCENARIO C:** *A patient is declared "brain dead" (no brainstem function, permanently unconscious, ventilator-dependent). Their body digests food, fights infections, heals wounds, and can gestate a fetus for months.*  
  → **Does this body represent a living human organism?**  
    • **YES** → Go to **Position: SOMATIC INTEGRATIONIST**  
    • **NO** → Go to **Question 4**  

  **4. SCENARIO D:** *Two patients need organs:*  
   *• Patient X: Brain dead (as in C), but body warm and stable.*  
   *• Patient Y: Severe dementia, no self-awareness, but breathes unaided and reacts to environment.*  
  → **Who can ethically donate organs FIRST under the Dead Donor Rule?**  
    • **PATIENT X (body is biologically dead)** → Go to **Position: WHOLE-BRAIN DEATH**  
    • **PATIENT Y (consciousness is permanently gone)** → Go to **Position: HIGHER-BRAIN DEATH**  
    • **NEITHER / BOTH CONTEXTS DIFFER** → Go to **Question 5**  

  **5. SCENARIO E:** *A brain-dead body (as in C) is maintained on a ventilator for 3 years. It grows hair/nails, maintains temperature, and heals bedsores.*  
  → **Could this body ever be considered "not dead" for ANY purpose?**  
    • **NO, DEATH IS ABSOLUTE** → Go to **Position: BIOLOGICAL NON-PROCESS**  
    • **YES (e.g., for pregnancy or research)** → Go to **Position: CONTEXTUALIST**  
    • **DEATH IS A GRADUAL PROCESS** → Go to **Position: PROCESS THEORIST**  

  ---

  ### NAMED POSITIONS & THEIR "AWKWARD SWALLOW"
  1. **CARDIOPULMONARY DEATH**  
     *Death = Irreversible cessation of circulatory/respiratory function.*  
     **Awkward Swallow:** You must accept that CPR temporarily resurrects corpses. If circulation stops for 5 minutes and restarts, the patient "died" and came back to life.  

  2. **WHOLE-BRAIN DEATH**  
     *Death = Irreversible loss of all brain function (including brainstem).*  
     **Awkward Swallow:** You must argue that a body digesting food, fighting infections, and gestating a fetus is a "dead organism" performing automated functions – like a decomposing corpse with cellular activity.  

  3. **HIGHER-BRAIN DEATH**  
     *Death = Irreversible loss of consciousness/personhood (even if brainstem functions).*  
     **Awkward Swallow:** A breathing, spontaneously moving patient with no cortex (e.g., advanced dementia or PVS) is biologically alive but "dead" as a person. Organ donation before biological death is ethical.  

  4. **SOMATIC INTEGRATIONIST**  
     *Death = Irreversible loss of the body’s ability to function as an integrated whole.*  
     **Awkward Swallow:** "Brain death" isn’t biological death; it’s severe neurological injury. The body is alive until somatic integration ceases (e.g., no longer regulates temperature/blood pressure even with support).  

  5. **CONTEXTUALIST**  
     *"Dead" depends on the purpose: biological, legal, social, or ethical.*  
     **Awkward Swallow:** A single body can be "dead" for organ donation (brain criteria) but "alive" for sustaining a pregnancy. Death is not a unified biological fact.  

  6. **PROCESS THEORIST**  
     *Death is a gradual transition, not a moment. "Dead" is a legal/social declaration during this process.*  
     **Awkward Swallow:** There is no objective point of death; it’s a societal agreement. A body could be "partly dead" (e.g., consciousness gone but digestion continues).  

  7. **BIOLOGICAL NON-PROCESS**  
     *Death is a binary, irreversible biological event.*  
     **Awkward Swallow:** If somatic integration persists after "brain death," the diagnosis was wrong. Death only occurs when all integrated functions cease irreversibly (even with machines).  

  ---

  ### EMPTY BRANCHES & WHY
  - **Between Q1 (NO) and Q3 (NO):** Leads to Whole-Brain Death.  
  - **Between Q2 (YES) and Q3 (NO):** Leads to Higher-Brain Death.  
  - **"Brain death as social death alone":** No coherent position. If you only see brain death as "social death," you still need a biological definition for organ procurement. Collapses into Contextualism.  

  ---

  ### MY STANCE & KEY INSIGHTS
  **Where I land:** **Somatic Integrationist** (Position 4). After serving on ethics committees, I find the Whole-Brain definition conceptually flawed. Bodies maintaining homeostasis after brain death exhibit organismic unity – they’re severely injured, not corpses. The "awkward swallow" is worth it: it forces us to confront whether organ donation violates the Dead Donor Rule.  

  **Most common mistake:** Confusing **criteria** (whole-brain failure) with the **definition** (loss of integrated organismic function). People fight over EEG reliability when they disagree on whether somatic integration defines life.  

  **Core Tensions Sorted:**  
  - **Irreversibility:** Part of the *test*, not the definition. Death is biological irreversibility *under current conditions* (CPR restarts a *dying* heart, not a dead one).  
  - **Definition vs. Test:** Definition: "What is death?" (e.g., loss of integration). Test: "How do we measure it?" (e.g., brainstem reflexes). People agree on tests but not definitions.  
  - **Grey Zones:** Process Theorists embrace them; others force binary judgments for practical reasons.  
  - **Three Deaths:**  
    - Biological: Somatic/Whole-Brain positions.  
    - Personal: Higher-Brain position.  
    - Social: Contextualists/Process Theorists incorporate this.  

  **Why This Works:** Forces debaters to confront clinical realities (pregnant bodies, CPR recoveries) before adopting labels. Exposes hidden priorities: Is consciousness sacred? Is the organism’s biology paramount? Does society’s need for organs or closure drive the definition?  

  Use this to map your team’s disagreements – you’ll likely find most arguments stem from **unstated differences in Question 3 (somatic integration)** or **Question 4 (consciousness vs. biology)**. Good luck!
