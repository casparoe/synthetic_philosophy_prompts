  The goal is to produce a single document that both could sign, including:
  1. A numbered list of agreed claims (non-vacuous, with content that a third party could deny).
  2. A statement of the residual disagreement, in wording each side would accept.
  3. The cruxes (sub-questions) with cases/arguments that bear on them and each side's predictions.
  4. A disagreements table.

  We build around two new pieces:
  - The Two-Compressions Puzzle
  - The Budget Problem

  We must also address if part of the dispute is verbal.

  Outline:

  I. Introduction: Briefly set the scene and the shared framework.

  II. Agreed Claims: Numbered list of substantial agreements.

  III. Residual Disagreement: Clear statement of each side's position in their own terms.

  IV. The Two-Compressions Puzzle: Present the puzzle and each side's response, including predictions about perturbation.

  V. The Budget Problem: Present the problem and each side's response.

  VI. Cruxes: List the key sub-questions, the cases/arguments that bear on them, and each side's predictions.

  VII. Disagreements Table: Summary of the above.

  VIII. Verbal Disagreement?: Analyze if part is verbal and if so, whether it dissolves or relocates the dispute.

  Word count: 1200-1800 words.

  ---

  Detailed Plan:

  I. Introduction (100-200 words)
  - Context: adversarial collaboration on Dennett's real patterns.
  - Both accept: three stances (physical, design, intentional), patterns can be real without being intrinsic, and the role of compression and prediction.

  II. Agreed Claims (300-400 words)
  List 5-7 non-vacuous claims. Examples:
  1. Definition of a pattern: a compression of information that allows for prediction and is projectible beyond the data.
  2. The physical stance: describes the system at the most fundamental level (e.g., microphysical states and laws).
  3. The design stance: describes the system in terms of functional parts and their purposes, even if not designed (e.g., biological adaptation).
  4. The intentional stance: describes the system by attributing beliefs, desires, and rationality to predict behavior.
  5. Patterns are real if they are objective: they are not merely in the eye of the beholder but are detectable by any competent observer using the appropriate stance.
  6. The existence of a real pattern does not require that it be reducible without loss to the physical stance description.
  7. The physical stance is fundamental in the sense that it provides the base description from which other stances can be derived in principle, but not necessarily in practice.

  III. Residual Disagreement (200-300 words)
  - Pattern Realist: "The design and intentional stances reveal real patterns that are part of the fabric of reality. These patterns are objective, causally relevant, and not mere heuristics. They are real features of the world, even if they are not intrinsic to the fundamental physical description."
  - Stance Fundamentalist: "The physical stance is the only one that describes what is fundamentally real. The design and intentional stances are indispensable practical tools that provide efficient compression and prediction, but they do not reveal additional real patterns. They are heuristics that supervene on the physical, but their posits are not real in the same sense."

  IV. The Two-Compressions Puzzle (300-400 words)
  - Scenario: finite deterministic CA, two compression schemes A and B of equal length, same predictive power, not derivable from each other without loss.
  - Pattern Realist: Both patterns are real because they are projectible and objective. The tie does not make pattern-reality interest-relative; it just shows that reality has multiple patterns at the same level of compression. Prediction under perturbation: Both patterns will remain projectible if the perturbations are within the domain of stability for each pattern. For example, if the perturbation is a local change that doesn't break the objects in A, then A's pattern holds; if it's a change that preserves global correlations, B holds. So, we can test by applying perturbations that target one pattern but not the other.
  - Stance Fundamentalist: Only one pattern can be real, and the tie suggests that pattern-reality is interest-relative. Alternatively, the fundamentalist might say that neither is real because the only real pattern is the full microphysical one. But to be consistent with the agreed claims, they might say that the physical stance pattern is the only real one. Prediction: Under perturbation, both patterns will break down arbitrarily if we perturb the system in a way that is microscopically minor but not aligned with either pattern. The fundamentalist expects that the only robust pattern is the physical one.

  V. The Budget Problem (300-400 words)
  - Scenario: a third compression scheme that is much better but only accessible to a reasoner with enormous computational resources.
  - Pattern Realist: The pattern is real because it is objective and projectible, even if it is hard to compute. Pattern-reality is not relative to any actual reasoner's budget; it's about what an ideal reasoner could do. So, the better compression is more real because it captures more of the pattern at a higher level of abstraction.
  - Stance Fundamentalist: The pattern that requires enormous computational resources is not real for us, and thus not real in the relevant sense. Pattern-reality is tied to practical access. The fundamentalist might say that the only real pattern is the fundamental physical one, and the other compressions are just useful for limited beings. Alternatively, the fundamentalist could argue that the pattern that is computationally feasible (like A or B) is the one that counts.

  VI. Cruxes (200-300 words)
  List 3-4 cruxes, each with:
  - The crux question.
  - The case/argument that bears on it (e.g., the Two-Compressions Puzzle or the Budget Problem).
  - Each side's prediction.

  Example:
  Crux 1: Is there a fact of the matter about which of two equally compressing and predictive patterns is real?
  - Case: Two-Compressions Puzzle.
  - Pattern Realist prediction: Both are real, and perturbations will show that each pattern has its own domain of stability.
  - Stance Fundamentalist prediction: Either only one is real (and we can find which by seeing which breaks under perturbation) or neither is fundamentally real, and perturbations will show that both break arbitrarily while the physical stance remains.

  Crux 2: Is pattern-reality relative to a reasoner's computational budget?
  - Case: Budget Problem.
  - Pattern Realist: No, the pattern is real independently; the budget issue is about access, not existence.
  - Stance Fundamentalist: Yes, the pattern is only as real as it is practically accessible; otherwise, it's not a pattern for us.

  Crux 3: Does the physical stance have a privileged ontological status?
  - Case: Both puzzles, but especially the Budget Problem. If a better compression exists that is not the physical, is it more real?
  - Pattern Realist: The physical stance is not privileged; a better compression is more real.
  - Stance Fundamentalist: The physical stance is privileged because it is the base reality.

  VII. Disagreements Table (50-100 words)
  | Issue | Pattern Realist | Stance Fundamentalist |
  |-------|----------------|-----------------------|
  | Ontological status of design/intentional patterns | Real and causally relevant | Heuristic overlays, not real in the same sense |
  | Two-Compressions Puzzle | Both patterns real | Only one or none real; pattern-reality may be interest-relative |
  | Budget Problem | Better compression is more real, regardless of budget | Only feasible compressions are real; otherwise, the physical is the real pattern |

  VIII. Verbal Disagreement? (100-200 words)
  - Part of the disagreement is verbal: they use "real" in different senses. The pattern realist means "objectively projectible pattern" while the fundamentalist means "what is fundamental and not dependent on perspective".
  - This does not dissolve the dispute because there is a substantive issue: does the world have levels of reality beyond the physical? The pattern realist says yes, the fundamentalist says no.
  - Relocating: the dispute becomes about whether the notion of reality should include patterns that are not fundamental but are objective from a stance.

  Total word count: Aim for 1500.

