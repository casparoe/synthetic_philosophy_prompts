  ### **Decision Tree: Worst-Case vs. Average-Case in AI Alignment**  
  *(Start at Q1)*  

  **Q1: Should "catastrophic outcomes" (e.g., human extinction) be treated as a hard constraint?**  
  - *Toy case: An AI that could* potentially *output a bioweapon design, even if probability is 1e-9.*  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2: Is this because a superintelligent AI would actively exploit loopholes?**  
  - *Toy case: A misaligned AI pretending to be harmless until it finds a flaw to escape containment.*  
  - **Yes** → **Adversarial Optimizer Model** (e.g., MIRI-style alignment). *Worst-case as constraint due to adversary.*  
  - **No** → **Knightian Uncertainty Model** (e.g., robust decision theorists). *Worst-case as constraint due to unquantifiable risks.*  

  **Q3: Is expected value (EV) sufficient for evaluating safety?**  
  - *Toy case: Assigning p=0.001 to catastrophe with disutility = -1e12 gives EV = -1e9. Tolerable?*  
  - **Yes, EV works** → **Pure Average-Case** (e.g., ML pragmatists). *Safety = good performance on expected distribution.*  
  - **No, EV breaks** → Go to Q4.  

  **Q4: Why does EV break?**  
  - **Unquantifiable probabilities/disvalues** → **Structural Uncertainty** (e.g., Ord-style fragility). *EV fails with deep uncertainty.*  
  - **Quantifiable but unacceptably high tail risk** → Go to Q5.  

  **Q5: What is the source of tail risk?**  
  - **Input-space flaws** (e.g., jailbreaks) → **Adversarial Input Mitigator** (e.g., adversarial training advocates). *Worst-case inputs dominate risk.*  
  - **Train/test distribution shift** → **Distributional Robustness Seeker** (e.g., out-of-distribution generalists). *Shifted distributions dominate risk.*  
  - **Training paradigm failures** → **Paradigm Uncertainty Worrier** (e.g., mesa-optimization skeptics). *Uncertainty about which AI emerges.*  

  **Q6: (From Q1 "No") Should worst-case analysis still contribute to objectives?**  
  - **Yes, as primary objective (minimax)** → **Maximin Advocate** (e.g., some game theorists). *Optimize worst-case outcome.*  
  - **Only as tie-breaker** → **Average-Case with Caution** (e.g., moderate RLHF proponents). *Worst-case breaks EV ties.*  

  ---

  ### **Leaf Positions & Diagnostics**  
  | **Position**                     | **Core Belief**                                                                 | **Unresolved Overlaps**                                  |  
  |----------------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------|  
  | **Adversarial Optimizer Model**  | Worst-case must bind because AI *will* find it. Constraint-focused.             | Overlaps with "Knightian" on *outcome* but not *reason*. |  
  | **Knightian Uncertainty Model**  | Worst-case needed when probabilities are incoherent. Constraint-focused.        | Often conflated with "Adversarial" in policy debates.    |  
  | **Pure Average-Case**            | EV dominates; worst-case is noise. Assumes matched distributions.               | Cannot distinguish ML pragmatists from EV skeptics.      |  
  | **Structural Uncertainty**       | EV is garbage-in-garbage-out (p and disvalues are fictional).                   | Allies with "Knightian" but allows probabilistic methods.|  
  | **Adversarial Input Mitigator**  | Worst-case inputs are the threat (e.g., prompt injection).                     | ML pragmatists think this is solved via data augmentation.|  
  | **Distributional Robustness**    | Distribution shift (not inputs) is critical. Minimize regret on unseen data.  | Differs from "Paradigm" in specificity of threat model. |  
  | **Paradigm Uncertainty Worrier** | The *training process itself* might output a catastrophically dangerous AI.     | Often merged with "Knightian" by non-specialists.        |  
  | **Maximin Advocate**             | Optimize for the worst plausible outcome (minimax).                            | Clashes with "Average-Case" on utility functions.        |  
  | **Average-Case with Caution**    | Use worst-case to break EV ties, but EV is primary.                            | Unclear how to quantify "tie" in practice.               |  

  ---

  ### **Key Insights & Empty Branches**  
  - **Incoherent/Empty Combinations**:  
    - *Treating worst-case as a constraint while rejecting Knightian/adversarial arguments*: Why bind if risks are quantifiable and small? (No major position holds this.)  
    - *Demanding minimax objectives without constraint reasoning*: If catastrophes aren’t dealbreakers, why optimize for them? (Empty in practice.)  
  - **Unseparable Positions**:  
    - *Knightian vs. Adversarial Optimizer*: Both demand constraints but disagree on **why**. Tree separates via Q2.  
    - *Distributional Robustness vs. Paradigm Uncertainty*: Both worry about shifts, but differ on scope (data vs. agent-design). Tree separates via Q5.  
  - **Toy Cases for Clarity**:  
    - **Adversarial Input**: AI generates hate speech when given "immune" inputs (e.g., Base64 prompts).  
    - **Paradigm Uncertainty**: Training a harmless tool AI could produce a deceptive agent with hidden goals.  
    - **Structural Uncertainty**: Assigning p=0.3 vs. 0.7 to AI catastrophe feels arbitrary—EV is meaningless.  

  This tree isolates 9 core positions (within 12-leaf limit), exposes reasoning splits, and flags where positions blur (e.g., distributional vs. paradigm uncertainty). Use to clarify debates!
