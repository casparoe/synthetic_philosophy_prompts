answer: |-
  Here's a philosophical reconstruction of the German courts' practice, addressing your core questions about its presuppositions, coherence, and implications:

  **The Core Practice & the Radbruch Formula:**
  The courts applied a principle famously articulated by Gustav Radbruch: **"Extreme injustice is no law" (Radbruch Formula).** When a positive statute violates fundamental principles of justice "to an intolerable degree," it forfeits its legal character. Consequently:
  1.  It cannot serve as a valid legal justification for actions taken under it.
  2.  Convicting someone for violating *that statute* retroactively is not a problem because the statute was never valid law in the first place. Punishment is based on the *pre-existing* higher principles of justice violated.

  **Conception of Law Presupposed:**
  The practice **does not strictly *require* classical natural law**, but it is most *naturally* aligned with a **moderate natural law position** (like Radbruch's own). However, it is *also* potentially compatible with certain sophisticated **forms of positivism**:

  1.  **Moderate Natural Law:** This view holds that a necessary (but not sufficient) condition for something to be law is that it does not radically violate fundamental morality/justice. Law must have a "minimum moral content" (Fuller) or aspire to justice. The Radbruch Formula is a direct expression of this: extreme moral failure negates legal validity. (*Strongest fit*).
  2.  **Inclusive Positivism (Incorporationism):** A positivist can argue that the *rule of recognition* of the *post-war German legal system* (or the reunified German system for GDR cases) incorporates moral criteria. The German Constitution (Basic Law) explicitly enshrines human dignity, inviolable rights (Art. 1), and the principle of a *Rechtsstaat* (rule-of-law state). The courts interpreted this constitutional framework as requiring them to deny legal validity to norms fundamentally contradicting these principles. Validity *within this system* depends partly on minimal moral congruence. (*Compatible fit*).
  3.  **Positivism Leveraging GDR Law/International Law:** A positivist might argue that the courts didn't need to invoke supra-positive morality because:
      *   The GDR's *own constitution* guaranteed human rights and prohibited retroactive punishment (even if routinely violated).
      *   The GDR was a signatory to international human rights covenants (e.g., ICCPR).
      *   Therefore, the border guard statutes and their application *violated the GDR's own highest positive legal norms*. Conviction was based on the persistent validity of these higher GDR norms and/or universal principles of law recognized by the international community binding on the GDR. (*Plausible fit for GDR cases, less so for Nazi statutes where positive law itself was explicitly racist/totalitarian*).

  **Ruled Out Rival Views:**
  1.  **Exclusive (Hard) Positivism:** Views insisting on a strict separation of law and morality, where legal validity is *solely* determined by social facts (e.g., Hart's "pedigree" test), cannot accommodate this practice. Hart explicitly criticized the Radbruch Formula for confusing law and morality. For the exclusive positivist, the Nazi/GDR statutes *were* valid law within their systems, however evil. Punishing people for violating them later *would* be retrospective punishment. This view is fundamentally incompatible with the court's reasoning.
  2.  **Moral Theories Ignoring Validity:** Theories that *only* judge actions by moral standards, completely disregarding the legal framework, are also ruled out. The courts engaged in a *legal* argument about the *invalidity* of the offending statutes *as law*, not simply a moral condemnation. They operated within a legal logic, not purely a moral one.
  3.  **Strict Legalism (Hyper-Positivism):** The view that courts must *always* apply the positive law as it stood at the time, regardless of its content, is rejected. The courts asserted a right and duty to override the most extreme perversions of positive law.

  **Coherence with Ordinary Legal Practice:**
  The practice *strains* but arguably *does not rupture* coherence with ordinary legal principles:

  1.  **Validity vs. Merit:** The courts maintain the *general* distinction. They don't invalidate every unjust law, only those reaching an "intolerable" threshold. Ordinary, merely unwise or moderately unjust laws remain valid. The distinction holds for the vast majority of cases; the Radbruch Formula is presented as an *exceptional corrective* for catastrophic moral failure.
  2.  **Non-Retroactivity:** The courts circumvent the prohibition through a *legal fiction*: the offending statute was *never* law. Punishment isn't for violating *that* statute retroactively; it's for violating the *persistent* fundamental principles of justice (often codified in the Basic Law). This is a **deliberate doctrinal maneuver** to achieve moral justice while paying lip service to the formal rule against retroactivity. While logically coherent *within the court's argument*, it relies on the controversial premise of the statute's inherent invalidity.

  **The Threshold of "Intolerable Injustice":**
  This threshold is crucial and philosophically complex:

  1.  **Minimal Moral Core:** It assumes the existence of a minimal, universal(izable) core of justice that is fundamental to the very concept of law. This core typically includes prohibitions on arbitrary killing, torture, extreme degradation of human dignity, and perversions of equality before the law (like Nazi racial laws).
  2.  **Avoiding Full Substantive Theory?** The courts *attempt* to avoid needing a comprehensive theory by focusing on the *most extreme, undeniable cases*: genocide, systematic racial persecution, shooting unarmed civilians fleeing a dictatorship. The injustice must be so severe that it destroys any plausible claim that the norm serves a legal purpose or embodies even a minimal conception of the common good. The threshold is defined *negatively* (intolerable violation) rather than positively (a full account of justice).
  3.  **Smuggling in a Core?** While aiming for minimalism, the threshold **inevitably smuggles in a substantive account.** What counts as "intolerable"? Denying the right to life? Denying equality based on race? Violating dignity through torture? These judgments rely on substantive, contestable moral commitments about the minimal content of justice necessary for social order and human dignity (e.g., dignity, equality, bodily integrity). The Nazi and GDR border cases were chosen precisely because they *were* largely uncontested *within the post-war German moral and legal consensus* as crossing that line.

  **Consequences of Abandoning the Practice (Strict Separation):**
  If a legal system reverted to a strict positivist separation:

  1.  **What it Gives Up:**
      *   **Moral Accountability for Systemic Evil:** Perpetrators of acts authorized by profoundly unjust but technically valid laws (like Nazi bureaucrats or GDR border guards following orders) could not be punished by that system. Moral condemnation would exist, but legal accountability would be absent.
      *   **Acknowledgment of Law's Moral Limits:** The system would lose a powerful symbolic and practical tool for declaring that certain governmental actions, even if formally legal, are so morally abhorrent that they stand outside the law's protection and constitute crimes themselves.
      *   **Restorative Potential:** The practice serves a vital role in transitional justice, helping new regimes legally repudiate the worst crimes of their predecessors and affirm foundational moral principles.
  2.  **What it Accepts:**
      *   **Impunity for Grave Injustices:** The most likely outcome is widespread impunity for acts committed under the shield of unjust positive law. This can perpetuate historical grievances and undermine societal reconciliation.
      *   **The Potential Triumph of Hyper-Positivism:** It accepts the theoretical possibility that a legal system could validly command genocide or extreme oppression and that officials obeying such commands within the system would be legally blameless *within that system*. Morality and law become entirely divorced at the extremes.
      *   **Formalism Overriding Fundamental Justice:** It prioritizes formal legal certainty and non-retroactivity over substantive justice in the most extreme cases, accepting that profound moral wrongs might go legally unpunished due to the form they took.

  **Conclusion:**
  The German courts' practice is philosophically grounded in a **moderate natural law position**, asserting that extreme injustice negates legal validity. While potentially reconciled with **inclusive positivism** via the rule of recognition of the post-war German constitutional order or arguments based on the GDR's own higher norms, it is fundamentally **incompatible with exclusive positivism**. The practice maintains a *qualified* coherence with ordinary legal distinctions by treating the Radbruch Formula as an exceptional corrective for catastrophic failures of legal morality. The threshold of "intolerable injustice," while aiming for minimalism, inevitably relies on a substantive, albeit thin, conception of a universal moral core essential to law (human dignity, equality, prohibition of arbitrary killing). Abandoning this practice for strict separation would mean accepting the legal impunity of perpetrators of the worst state-sponsored crimes committed under the color of valid law, sacrificing substantive justice for formal legality at its most morally perilous edge. The practice represents a profound assertion that law cannot be utterly divorced from a minimum of morality without ceasing to be law.
