  ### Key Clarifications
  1. **What it is not**  
     - **Not misinformed votes**: Reversal requires identical facts (e.g., Sicilian expedition recalled mid-voyage with no new military intelligence).  
     - **Not membership change**: Requires same participants (e.g., Socrates' jury voting guilt/innocence then death).  
     - **Not individual inconsistency**: A single person reversing views is psychological; this is institutionalized collective self-contradiction.  

  2. **Boundary Edges**  
     - **Same people?**: Essential. Different participants create a new sovereign entity.  
     - **Same facts?**: Critical. New evidence dissolves the phenomenon.  
     - **Short interval?**: Core to the paradox. Longer gaps imply organic change.  
     - **Precommitment?**: Moves the issue (e.g., constitutions "bind" future assemblies) but doesn't eliminate sovereignty—the body can still amend or ignore constraints.  

  3. **Why "Dēmotic Temporal Sovereignty"?**  
     - *Dēmotic*: Rooted in the *dēmos* (people) as ultimate authority.  
     - *Temporal*: Highlights time as the variable producing contradiction.  
     - *Sovereignty*: Emphasizes the unappealable nature of the will expressed.  

  This framing isolates the Athenian structural quirk: the *dēmos* was ontologically incapable of error **at the moment of decision**, but its successive moments of sovereignty were disconnected and potentially adversarial.
