prompt: |-
  Been reading a lot of Greek history this year (Thucydides, Xenophon, the Socrates trial stuff) and there's a shape of thing I keep bumping into that I dont have a word for, and I'm not sure anyone does. The pattern: an assembly votes something drastic, and then the same men, with essentially the same facts in front of them, vote the opposite not long after. Mytilene -- kill every adult male, then next day spare them, with the first ship already out of the harbor carrying the order. Sicily -- the expedition voted, then a commander recalled once the fleet is already sailing. Socrates -- the jury splits almost evenly on guilt, and then once he's been allowed to propose his own punishment they vote him dead by a landslide. Arginusae -- the generals condemned all together in one vote on a show of hands, and then, if I've got this right, the same city later turns on the men who pushed that vote. The part that won't let me go is that there's no moment where the assembly is wrong. Both votes are the assembly. The second isn't an appeal to anything the first lacked -- no new evidence, no higher body, no rule about not deciding while furious. So "they fixed a mistake" and "they changed their minds" pick out the same event, and there's no fact of the matter about what the body actually thought, only about what it thought at 4 p.m. on Tuesday. I also read that Athens had a procedure where a decree the assembly had already passed could still be attacked afterward as illegal -- the thinking being that the assembly, being accountable to nobody, could by a kind of structural fiction do no wrong, so the only way to undo a law was to go after whoever had proposed it. Is there a name for the underlying thing? I don't mean demagoguery or mob fickleness, those are about causes; I mean the structural part, where the body is its own only court of review so its output is a function of when you ask it. I know there's probably something in social choice about votes that don't stay put, and something about tying your own hands in advance, but I want the carving, not the label. So: what is this exactly, what isn't it (vs. a body that was simply misinformed the first time, vs. one whose membership changed, vs. plain preference reversal in one person), and where are the edges (does it need the same people? the same facts? a short interval? does precommitment dissolve it or just move it somewhere else?). If nothing established fits, coin a term and define it so I can tell when it applies.

  You're a political theorist comfortable with both the Greek material and the formal social-choice stuff, so think carefully and brainstorm a few candidate framings before you commit. Don't just name-drop a term and stop -- I want the reasoning. Give me a short prose answer, then a JSON object with exactly these fields: established_name (a string, or the string "none"); nearest_concepts (an array of objects, each with "name" and "why_it_falls_short"); definition (string, your best statement of the phenomenon, borrowed or coined); what_it_is_not (array of strings); boundary_cases (array of strings); proposed_label (string, only if established_name is "none", otherwise null); confidence (string, e.g. "high", "medium", "low").
reasoning: |-
  Okay, the user is diving deep into a pattern they've noticed in Greek history, specifically Athenian democracy. They're describing situations where the assembly votes one way, then quickly reverses itself without new evidence or membership changes. Examples like Mytilene, Sicily expedition, Socrates trial, and Arginusae show this flip-flopping. 

  The core puzzle is: both votes are equally "valid" expressions of the assembly's will, yet they contradict each other. The user rejects simple explanations like demagoguery or new information. They want to isolate the structural quirk where the same body, with same facts and people, can produce opposite outcomes based purely on timing. 

  Hmm... this feels like it lives at the intersection of decision theory and democratic accountability. The Athenian legal fiction they mention (attacking proposers rather than laws) is key - it suggests the system intentionally avoided admitting error. 

  First, existing concepts that almost fit but not quite:
  - Preference reversal (too individualistic; doesn't capture institutional self-overriding)
  - Time inconsistency in behavioral econ (close! but usually about precommitment failures rather than sovereign bodies)
  - Kelsen's Grundnorm (too abstract; not about temporal instability)
  - Arrow's theorem (about aggregation, not same-group reversals)

  The unique Athenian twist is that the dēmos was both sovereign and unappealable, so its decisions were true by definition at time T, yet reversible at T+1 without contradiction. It's like a ship replacing its own planks while sailing. 

  Proposing a new term: "dēmotic temporal sovereignty". Definition would focus on the absence of any meta-authority to judge decisions, making the assembly's current vote the only reality. Boundary cases: if new evidence emerges, it's not this; if membership changes, not this; long intervals allow genuine mind-changing. 

  Biggest distinction is vs. simple regret - this is ontological, not psychological. The assembly isn't "correcting" anything; it's creating new truth. 

  User's "carving" request is sharp. Need to exclude cases like misinformed votes (where first vote wasn't "true will") or membership turnover (different body). The Socrates case is perfect: same jurors, same facts, just shifted after sentencing phase revealed his defiance. 

  Confidence in coining term? Medium - it isolates the phenomenon cleanly but needs testing against other historical examples. The JSON should reflect that tentativeness while giving concrete hooks for further discussion.
answer: |-
  ### Short Prose Answer
  The phenomenon you describe is the **inherent temporal instability of unconstrained sovereign assemblies**, where a body with absolute authority—accountable to no higher principle or external review—can produce logically contradictory decisions in rapid succession with identical facts and membership. This isn't mere "fickleness" but a structural feature of *procedural sovereignty*: the assembly's will at any moment *defines* political truth, rendering past decisions voidable not because they were "wrong," but because they no longer reflect the present sovereign expression. Athens' *graphē paranomōn* (suit against illegal proposals) exemplifies this, attacking proposers rather than laws, preserving the fiction of the assembly's infallibility while allowing reversal. Social choice theory captures this as **intransitive group preferences** or **cycling majorities**, but the Greek context adds a layer of existential sovereignty where the *dēmos* is both legislator and the only valid interpreter of its will. Coined term: **Dēmotic Temporal Sovereignty**.

