prompt: |-
  I coordinate a reading group on decision theory that meets alongside a summer workshop; the members are graduate students in philosophy and economics together with a couple of practising statisticians, all comfortable with expected-utility talk but none of them specialists in the foundations of rational choice. Next month I have to run the session on superrationality, and I would like you to plan the teaching rather than deliver the explanation itself. My own sense is that the whole thing stands or falls on the order in which the pieces are introduced, and I keep getting it wrong when I improvise, so what I want is the dependency structure laid out: what must already be in place before the central claim can even be stated, which of the audience's existing habits of thought have to be dismantled first (I suspect the reflex of reading "rational" as "maximises expected utility given the other player's fixed behaviour" is the main obstacle), and at which point in the sequence each piece has to land for the later pieces to feel forced rather than stipulated.

  Build the session around a single carrying example, and be explicit about what that example must contain and what it must be purged of. My instinct is a one-shot Prisoner's Dilemma between two agents who cannot communicate, will never meet again, and cannot causally influence one another — but I want you to say whether that example can carry the weight or whether it needs to be something else, and in either case to explain why the iterated Prisoner's Dilemma, the reputation story, and the tit-for-tat anecdote have to be kept out of the carrier; in my experience, the moment repetition enters, the audience stops seeing the actual problem and starts seeing a long-run self-interest argument. Then I want the misconception map and a check. The predictable errors I would like you to anticipate include: that superrationality is just the Golden Rule or Kant's universalizability test in decision-theoretic dress; that it secretly requires the two players to be the same person, or to be in telepathic or causal contact; that it is a claim about what people in fact do rather than about what it would be rational to do; that it collapses into ordinary evidential reasoning about what one's own action is evidence of; and that it works only for exactly identical agents, so a partner who is merely almost like you breaks it. For each, tell me where in the sequence the misconception forms and precisely how to head it off there rather than at the end.

  I also want to fold in two ideas that I think are absent from the popular treatments and that should do real work in the lesson: first, the framing on which two agents cooperate because each can inspect the other's source code and can prove what the other will do, so that "I cooperate" becomes derivable from the other's decision procedure rather than from any expectation about how things will turn out; second, the related and stranger thought that two agents who merely run the same deterministic decision procedure, with no inspection and no communication at all, might each be able to establish that the other's cooperation follows from their own — I want the audience to feel why this is not the same as assuming the other will do whatever you do, and to see exactly which step does the work. Please tell me which of these two to introduce first, and what to leave out entirely at this level and to say so openly, since I would rather cut the formalism than lose the thread. Finally, give me one question I can put to the room at the very end that would distinguish someone who has grasped why superrationality is a claim about reasoning rather than about outcomes from someone who has merely learned to say "cooperate."
reasoning: |-
  We are designing a teaching sequence for a session on superrationality. The audience is comfortable with expected utility but not specialists in foundations. We must avoid common misconceptions and build understanding step by step.

  Core Goal: To present superrationality as a distinct concept from standard expected utility maximization, particularly by challenging the assumption that the other player's behavior is fixed.

  Carrying Example: One-shot Prisoner's Dilemma (PD) without communication, repetition, or causal influence. We choose PD because it is the classic setting for the tension between individual and collective rationality.

  Why not iterated PD? Because repetition introduces long-run self-interest (like tit-for-tat) and obscures the one-shot problem. We must explicitly avoid reputation, repeated games, and any form of future interaction.

  Why not Golden Rule or Kant? These are normative ethical principles, while superrationality is a decision-theoretic concept. We must separate the two.

  Why not evidential reasoning? We must show that superrationality is not merely about using one's own action as evidence of the other's (as in Newcomb's problem) but about a symmetry of reasoning.

  Plan:

  1. Set the stage with the Prisoner's Dilemma.
     - Present the payoff matrix (let's use standard notation: T>R>P>S and 2R>T+S).
     - Explain the dominant strategy: each player has a dominant strategy to defect, leading to (D,D) and payoffs (P,P), which is worse for both than (C,C) with (R,R).
     - Emphasize: this is the standard analysis, assuming the other's action is fixed.

  2. Challenge the fixedness assumption.
     - Point: the standard analysis holds if we take the other's action as given. But what if we don't? What if we consider that the other player is rational and thinking the same way we are?
     - Introduce the idea of symmetry: if the players are in symmetric situations and they both know that, then they might reason that they will both do the same thing.

  3. Introduce the concept of superrationality.
     - Definition: A superrational player assumes that any player who is in the same situation and uses the same rational decision procedure will come to the same conclusion. Therefore, they must coordinate on the same action.
     - In PD: if both players are superrational, they will both choose the same action. Then the choice is between (C,C) and (D,D). Since R > P, they both choose C.

  4. Address misconceptions as they arise:
     a) Misconception: Superrationality is the Golden Rule or Kant's universalizability.
          - When: When we say "they must coordinate on the same action".
          - Head off: Explicitly say that superrationality is not an ethical principle but a mode of reasoning that assumes symmetry. It is about what it is rational to do given that the other is reasoning identically.

     b) Misconception: It requires the players to be the same person or in causal contact.
          - When: When we assume they use the same decision procedure.
          - Head off: Explain that the players are distinct and cannot communicate, but they are both rational and in identical situations. The key is not causal contact but logical inference: if they both use the same reasoning, they must arrive at the same conclusion.

     c) Misconception: It is about what people in fact do.
          - When: When presenting the solution (cooperate).
          - Head off: Emphasize that we are talking about rational choice, not descriptive behavior. We are asking what a rational agent should do in this situation.

     d) Misconception: It collapses into evidential reasoning.
          - When: When we say that by choosing C, I expect the other to choose C.
          - Head off: Clarify that in evidential reasoning (like Newcomb), we use our action as evidence about the other (which may be determined by a common cause). In superrationality, we do not have a common cause (like a predictor) but a symmetry: because we are both rational and in the same situation, we must do the same. The link is logical, not evidential.

     e) Misconception: It works only for exactly identical agents.
          - When: When we assume they use the same decision procedure.
          - Head off: Acknowledge that superrationality requires symmetry. If there is a known asymmetry, then the reasoning breaks. But if the agents are in symmetric situations and both know they are using the same rational procedure, then it applies. If there is a small asymmetry, we might need a more general theory (like Hofstadter's superrationality or Aumann's correlated equilibrium) but that's beyond the scope.

  5. Introduce the two advanced ideas in order:

     First idea: Agents can inspect each other's source code and prove what the other will do.
     - This is a stronger assumption. We can present it as a way to make the reasoning more explicit.
     - Example: Suppose both agents have access to each other's decision algorithm. Then, if agent A's algorithm is to cooperate only if B cooperates, and B's is the same, then they can see that if they both run the same code, they both cooperate. This leads to (C,C).

     Second idea: Agents run the same deterministic decision procedure without inspection.
     - Now, without seeing the code, each agent reasons: "We both have the same algorithm. Therefore, whatever I decide, the other will decide the same. Therefore, I am effectively choosing between (C,C) and (D,D). I choose C because R>P."
     - Why is this not assuming that the other will do whatever I do? Because it is not an assumption about the other's action being identical by fiat, but a deduction: since we are both in the same situation and using the same procedure, we must output the same action.

  6. Sequence of the session:

     Step 1: Present the Prisoner's Dilemma and the standard analysis (dominant strategy, Nash equilibrium). [5-10 min]
        - Emphasize the fixedness of the other's action.

     Step 2: Question the fixedness. [5 min]
        - "But what if the other player is just like you and is reasoning the same way? Then your actions are linked."

     Step 3: Introduce the symmetry argument. [10 min]
        - "If we are both rational and in the same situation, we must do the same thing. Then the choice is between (C,C) and (D,D). Since R>P, we choose C."
        - Here, head off misconception (a) by distinguishing from ethical rules and (c) by emphasizing rationality.

     Step 4: Clarify the requirements: same decision procedure, no communication, no causal influence. [5 min]
        - Head off misconception (b) and (e): we require symmetry but not identity or causal contact.

     Step 5: Contrast with evidential reasoning. [10 min]
        - Compare to Newcomb's problem: in Newcomb, you choose one box because your choice is evidence of the prediction. In PD with superrationality, there is no predictor. The link is symmetry: same situation, same reasoning, same action.
        - Head off misconception (d).

     Step 6: Introduce the first advanced idea: source code inspection. [10 min]
        - Present it as a way to make the reasoning formal: if both algorithms are identical and can be inspected, then each can prove the other's action.

     Step 7: Introduce the second advanced idea: same decision procedure without inspection. [10 min]
        - Explain that even without inspection, if both are running the same deterministic procedure, then they must output the same action. Therefore, the choice is effectively between the two diagonal outcomes.

     Step 8: Discussion and wrap-up. [5 min]

  7. Final question to distinguish understanding:
     - "Suppose we change the payoff matrix so that (D,D) gives a higher payoff than (C,C). What would the superrational player do, and why? And how does that contrast with what an evidential reasoner might do in a Newcomb-like version of the dilemma?"

     Why this question? 
     - It checks if they understand that superrationality is about the symmetry of reasoning: if (D,D) is better, then they both defect. 
     - Contrast with evidential reasoning: in a Newcomb-like setup, the evidential reasoner might still cooperate if they think their action is evidence of the other's, but in superrationality, the reasoning is about the symmetry of the situation and the decision procedure, not about evidence.

     Expected answer: 
     - The superrational player would defect because now the symmetric outcome (D,D) is better than (C,C). 
     - An evidential reasoner in a Newcomb-like PD (with a predictor) might still cooperate if they believe that cooperating is evidence that the other will cooperate, leading to R, and defecting is evidence that the other defects, leading to P. But without a predictor, evidential reasoning might not apply. In superrationality, the outcome is determined by the symmetry of the decision procedure.

  This sequence builds from the familiar (standard PD) and challenges the fixedness assumption, then introduces symmetry and the two advanced ideas, while continuously addressing misconceptions as they arise.

  Carrying example: one-shot PD with payoffs: 
     C | D
  C: (3,3) | (0,5)
  D: (5,0) | (1,1)

  We must keep it one-shot, no repetition, no communication, no causal influence. The payoffs must satisfy T>R>P>S and 2R>T+S to be a PD.

  Final note: We are cutting the formalism of game theory (like equilibrium concepts beyond Nash) and focusing on the reasoning. We are also not going into probabilistic decision procedures or cases with asymmetries.

  By the end, the audience should see that superrationality is a claim about how rational agents should reason when they know they are in a symmetric situation with identical decision procedures, and that it is distinct from both causal decision theory and evidential decision theory in its foundation.
answer: |-
  Below is a meticulously structured teaching plan for your superrationality session, designed around a one-shot Prisoner's Dilemma (PD) as the carrier example. The sequence addresses dependencies, dismantles misconceptions preemptively, and integrates your requested advanced ideas. Crucially, **the PD example can carry the weight** if purified of contamination—I'll explain how and why.

  ---

  ### **Core Structure: The Teaching Sequence**
  **Total Time:** 90 minutes  
  **Pedagogic Anchor:** One-shot Prisoner's Dilemma with no communication, no future interaction, and no causal influence.  
  **Payoff Matrix (Purified Example):**  
  | | Cooperate (C) | Defect (D) |  
  |-----------|---------------|------------|  
  | **Cooperate (C)** | (3, 3) | (0, 5) |  
  | **Defect (D)** | (5, 0) | (1, 1) |  
  *Ensure payoffs satisfy strict PD conditions: T > R > P > S (5 > 3 > 1 > 0) and 2R > T + S (6 > 5).*

  #### **Key Purifications for the Carrier Example**  
  1. **Exclude iteration, reputation, and tit-for-tat:**  
     - State upfront: "This is a one-shot interaction. There is no future, no reputation, and no history. Any strategy relying on repeated play is irrelevant here."  
     - **Why:** Iteration smuggles in *causal consequences* (e.g., "I cooperate now to get cooperation later"), collapsing superrationality into self-interest. It obscures the core problem: *symmetric reasoning without causal leverage*.  

  2. **Exclude pre-game communication:**  
     - Emphasize: "Players cannot send signals, promises, or threats. They reason in isolation."  
     - **Why:** Communication enables coordination via causal pathways (e.g., bargaining), undermining the need for *logical* symmetry.  

  3. **Exclude asymmetric knowledge:**  
     - Specify: "Both players know the payoffs, know they face the same dilemma, and know they are identical in rationality—but they don't know what the other *will* do."  
     - **Why:** Asymmetries (e.g., "I’m smarter") reintroduce the "fixed behavior" reflex.  

  ---

  ### **The Sequence: Dependencies and Misconception Mitigation**
  **Goals per Stage:**  
  - **Stage 1–2:** Erode the "fixed behavior" reflex.  
  - **Stage 3–4:** Introduce symmetry without metaphysics.  
  - **Stage 5–6:** Formalize superrationality as proof-based reasoning.  
  - **Stage 7:** Generalize while blocking major misconceptions.  

  #### **Stage 1: Provoke the Paradox (10 min)**  
  - **Activity:** Present the PD matrix. Ask: "What is rational? Use standard decision theory."  
  - **Expected Answer:** "Defect is dominant: no matter what the other does, I gain more (or lose less)."  
  - **Dependency Setup:**  
    - Affirm this is correct under *causal decision theory* (CDT).  
    - Highlight CDT’s core axiom: *"Treat the other player’s action as fixed when choosing."*  
  - **Why Now:** Makes CDT’s assumption explicit, priming it for challenge.  

  #### **Stage 2: Challenge the "Fixed Behavior" Axiom (15 min)**  
  - **Activity:** Pose: "What if both players are *identical*? Not just rational, but using the *same* decision procedure?"  
  - **Critical Question:** "Can your choice affect what the *other* player does—not causally, but *logically*—if they reason identically?"  
  - **Head Off Misconception:**  
    - **Misconception:** "This assumes telepathy/causation!"  
    - **Preemption:** Stress: "No communication or causation exists. We’re asking: *If they are my cognitive clone, does my reasoning constrain theirs?*"  
  - **Why Now:** Creates cognitive dissonance. The audience *feels* the conflict between CDT and symmetry but can’t yet resolve it.  

  #### **Stage 3: Introduce Symmetry as a Logical Constraint (20 min)**  
  - **Activity:** Argue: "If we use the same algorithm, we must output the same action. Thus, only two outcomes exist: (C,C) or (D,D)."  
  - **Carrier Example Work:**  
    - Compare (C,C) = (3,3) vs. (D,D) = (1,1). Rationality prefers 3 > 1, so cooperate.  
  - **Head Off Misconceptions:**  
    - **Misconception:** "This is the Golden Rule/Kant!"  
      - **Preemption:** Contrast: "Kant’s universalizability is moral. Superrationality is *instrumental*: given symmetry, (C,C) dominates (D,D). No ‘ought’ beyond payoffs."  
    - **Misconception:** "It only works for identical agents!"  
      - **Preemption:** Clarify: "We require *procedural identity*, not metaphysical identity. If both run ‘Algorithm X,’ they needn’t be clones—just use the same rules."  
  - **Why Now:** Symmetry is framed as a game-theoretic constraint (reducing outcomes), not mysticism.  

  #### **Stage 4: Introduce Source-Code Inspection (15 min)**  
  - **Activity:** Present: "Suppose Player 1 inspects Player 2’s source code (algorithm). If both algorithms are identical, Player 1 can *prove* what Player 2 will do."  
  - **Carrier Example Work:**  
    - Algorithm: "Cooperate iff the other’s algorithm outputs C."  
    - Player 1 deduces: "If I output C, Player 2 (same code) outputs C. If I output D, Player 2 outputs D. I prefer (C,C) to (D,D)."  
  - **Why First?** Concrete and familiar (like programming). Builds intuition for *proof over prediction*.  
  - **Head Off Misconception:**  
    - **Misconception:** "This is evidential reasoning!"  
      - **Preemption:** Contrast: "Evidential reasoning *infers* from actions (e.g., ‘I defect, so they defect’). Here, we *prove* actions from code. No evidence—just deduction."  

  #### **Stage 5: Remove Inspection—Pure Symmetry (15 min)**  
  - **Activity:** Pose: "Now suppose no inspection. Both run the same deterministic algorithm in isolation."  
  - **Critical Insight:** "Each can reason: ‘My algorithm’s output applies to both. I effectively choose between (C,C) and (D,D).’"  
  - **Why Not "Assume they copy me"?** Stress:  
    - "It’s not that they *copy* you; it’s that identical inputs + identical code → identical outputs. Your choice *reveals* theirs because the same function maps inputs to outputs for both."  
  - **Head Off Misconception:**  
    - **Misconception:** "This requires telepathy!"  
      - **Preemption:** Reiterate: "No signaling. The link is *logical*: same procedure → same output. If I choose C, and we’re identical, they *must* choose C—by their own algorithm."  
  - **Why Now:** Builds on Stage 4 but removes "inspection" as a crutch.  

  #### **Stage 6: Contrast with Evidential Reasoning (10 min)**  
  - **Activity:** Compare to Newcomb’s Paradox:  
    - "Evidential: I one-box because my choice *correlates* with the prediction. Superrationality: I cooperate because I *deduce* the other’s action from symmetry."  
  - **Key Distinction:**  
    - Evidential: Beliefs updated by conditioning on actions.  
    - Superrationality: Actions determined by solving a fixed-point (both output C iff both output C).  
  - **Carrier Example Work:**  
    - In PD, evidential reasoning fails: "If I defect, it doesn’t *cause* them to defect—so why cooperate?" Superrationality succeeds via symmetry.  
  - **Why Now:** Isolates superrationality as *solving equations*, not updating beliefs.  

  #### **Stage 7: Generalize and Consolidate (5 min)**  
  - **Activity:** Define superrationality:  
    > "Rational choice under the assumption that identical rational agents in symmetric games must choose identically."  
  - **Head Off Misconceptions:**  
    - **Misconception:** "It’s descriptive, not normative!"  
      - **Preemption:** "It’s *normative*: given symmetry, CDT is inconsistent. Superrationality maximizes utility *under logical constraints*."  
    - **Misconception:** "Nearly identical agents break it!"  
      - **Preemption:** "Yes, but superrationality applies only under strict symmetry. Asymmetries revert to CDT—which is why it’s a *foundational* critique, not a universal tool."  
  - **Formalism Cut:** Acknowledge: "We skip equilibrium formalism (e.g., Aumann correlated equilibrium) to focus on reasoning. Grad students can explore this later."  

  ---

  ### **Final Discrimination Question**  
  **Pose at the end:**  
  > *"Suppose a variant PD where (D,D) pays (4,4) and (C,C) pays (3,3). If both players are superrational, what do they do—and why is this* not *a recommendation to always cooperate?"*  

  - **Correct Answer:** "They defect because (D,D) > (C,C). Superrationality isn’t about cooperating—it’s about *solving the symmetry constraint*. If (D,D) dominated, defection is rational."  
  - **Why It Works:**  
    - Reveals if students grasp the *symmetry-reasoning mechanism* (fixed-point optimization) vs. memorizing "cooperate."  
    - Exposes confusion with morality (Golden Rule) or outcomes (cooperation always pays).  
    - Tests understanding that superrationality is *parameterized by payoffs*, not a dogma.  

  ---

  ### **Why This Sequence Works**  
  - **Dependencies Honored:**  
    - Stages 1–2 dismantle CDT’s "fixed behavior" before superrationality is named.  
    - Stages 3–5 progress from symmetry → inspection → pure deduction, making the final claim feel forced.  
  - **Misconceptions Preempted at Birth:**  
    - Telepathy/causation blocked in Stage 2.  
    - Golden Rule/Kant blocked in Stage 3.  
    - Evidential reasoning diffused in Stage 6.  
  - **Advanced Ideas Integrated:**  
    - Source-code inspection (Stage 4) before pure symmetry (Stage 5) provides intuition for deduction.  
    - The "same procedure" insight (Stage 5) is isolated from copying/telepathy by anchoring it to code.  

  **Carrier Example Strength:** The one-shot PD is ideal—it’s simple, exposes CDT’s failure, and forces attention on reasoning. By purging iteration/reputation, you avoid the "long-run self-interest" distraction.  

  **Final Tip:** If time runs short, cut formalism (e.g., Nash equilibria comparisons) and reinforce the *reasoning vs. outcomes* distinction with the discrimination question. The goal is not to convince, but to make superrationality’s mechanism undeniable.
