prompt: |-
  My flatmate has exactly one move in every argument and I'm sick of it. Whatever I say I'm going to do, he asks "what if everyone did that?" and then sits back like the case is closed. Last week it was me taking a sick day when I wasn't really sick — fine, that one landed. But he pulled the same line when I said I was going to blow off my sister's engagement party for a festival I'd already bought tickets to (I don't see the catastrophe if everyone did that — everyone would just be at festivals?), and when I said I wasn't going to vote because my one vote does nothing. And the one that actually got me: I said I'd tell my mate the truth about a shirt he'd bought, knowing it would hurt him, and I genuinely cannot tell whether the question says I should tell him or that I shouldn't. He's convinced the whole thing is just Kant and that Kant settles it.

  I dont think the question is one thing. Can you lay out the different precise things "what if everyone did that?" could actually be claiming, from the trivial to the radical — the Golden Rule-ish reading, whatever Kant's actual test is (I know he's got more than one version and I dont trust that they all agree), the "society would fall apart" reading that I suspect is just rule-consequentialism wearing Kant's coat, the bare "you'd be a hypocrite" consistency reading, and the free-rider reading — and for each one say what it's actually committed to, whether it's plausible on its own, and whether it gets him his conclusion ("so don't do it") in each of the four cases above. I also want your guess at which reading he's actually reaching for when he says Kant, because I'm fairly sure what he really means is "the world would be worse off if everyone did it," and I'm fairly sure that's not the same claim at all.

  Two things that bug me and I'd like folded in. First: does it matter how you describe what I'm doing? "Take a sick day," "take a sick day when you're not sick but burnt out," "take a day off work when you need it" — I can feel the verdict flipping depending on which one we pick, and if that's true I want to know whether it's a bug in the test or the whole point of it. Second: who counts as "everyone"? Everyone in my exact situation, everyone who could do the thing, or literally every person alive? Because if it's literally everyone then half the things he uses it on are impossible for most people to do at all, and that can't be what he means.

  Lay it out as a list I can take back to him.
reasoning: |-
  Okay, the user is dealing with a flatmate who constantly uses the "what if everyone did that?" argument in various situations. They want me to break down the different interpretations of this question and evaluate them in the context of four specific examples. 

  First, I need to unpack the core issue. The flatmate seems to be using a single rhetorical move to shut down arguments, claiming it's based on Kantian ethics. The user suspects this is oversimplified and wants to expose the nuances. They're clearly frustrated but also intellectually engaged—they've thought about description-dependence and scope problems ("who counts as everyone?"), which shows they're not just venting but seeking analytical tools.

  The four cases are interesting because they test different ethical boundaries: (1) taking a fake sick day (where the argument "lands"), (2) skipping a family event for a festival, (3) not voting, and (4) giving hurtful fashion feedback. The user already senses inconsistency in how the argument applies. 

  I should start by mapping the possible interpretations of "what if everyone did that?"—there are at least five distinct philosophical lenses here. The Golden Rule version is intuitive but flips based on perspective; Kant's Categorical Imperative has multiple formulations people conflate; the societal collapse angle is secretly consequentialist; the hypocrisy charge is about personal consistency; and the free-rider problem is an economic take. 

  For each, I'll need to evaluate: 
  - What the claim *actually* requires 
  - Whether it holds water philosophically 
  - How it applies to each of the four cases 
  - Whether it defaults to "don't do it" as the flatmate insists 

  The description-dependence point is crucial. Like with the sick day—framing it as "deceiving employers" vs. "self-care for burnout" changes the universalization test entirely. Kant would insist on precise maxims, but in practice, people cherry-pick descriptions to get the desired result. Similarly, "everyone" could mean "all humans" (absurd for festival tickets) or "people in comparable situations" (more reasonable). The flatmate is probably not defining either carefully. 

  I suspect the flatmate is reaching for a watered-down consequentialism ("the world would be worse") but calling it Kant because it sounds smarter. Kant’s actual test is about logical contradiction in universalizing maxims, not predicting outcomes. That’s why the voting example backfires—universal non-voting *would* collapse democracy (bad consequence), but Kant might say the maxim "don’t vote if your vote won’t swing it" becomes self-defeating when universalized. 

  For the shirt feedback dilemma, interpretations clash: Golden Rule says don’t hurt others; Kant’s duty of honesty might demand truth-telling; societal collapse isn’t relevant; free-riding doesn’t apply. No wonder the user’s confused—the test gives conflicting answers based on which version you pick. 

  In the response, I’ll structure this as a numbered list for clarity, flagging where the flatmate’s conclusions hold or crumble. The goal isn’t to "win" but to show the tool is nuanced. Maybe the user can pivot to asking the flatmate, "Which *version* of ‘everyone did that’ are you using?" next time. That’s progress.
answer: |-
  Here's a breakdown of the "What if everyone did that?" move, dissecting its interpretations, strengths, weaknesses, and applications to your cases. Your flatmate is likely conflating several ideas under "Kant" – probably with a heavy dose of Rule-Consequentialism.

  **The Core Issue & Your Observations:**
  *   **Description-Dependence:** You're absolutely right. How you phrase the "maxim" (the rule describing your action) drastically changes the outcome. This is **the whole point (and a major point of contention)** for Kantians. A good maxim must be universalizable *as stated*. "Taking a needed day off" vs. "Lying to my employer" are fundamentally different tests.
  *   **Scope of "Everyone":** This is crucial. Kant means "every rational agent *in relevantly similar circumstances*." It's **not** "every human being does this exact thing simultaneously regardless of context." "Everyone attending festivals instead of specific family events" is plausible; "every human skipping work to attend *my specific festival*" is absurd and irrelevant. Your flatmate likely intends the former but might be sloppy.

  **Interpretations of "What if everyone did that?" (WIDT?)**

  1.  **The Golden Rule-ish Reading (Reciprocity / Empathy)**
      *   **Claim:** "Treat others as you would want to be treated." WIDT? is a way to imagine yourself *receiving* the action. Would you want everyone to act this way towards *you*?
      *   **Committed To:** Empathy and basic reciprocity. Avoids hypocrisy in desires.
      *   **Plausibility:** Intuitively strong for interpersonal relationships, but limited. It focuses on *your* preferences ("Would *I* like it?"), not necessarily universal morality. Can break down if your desires are unusual or masochistic.
      *   **Your Cases:**
          *   **Sick Day:** *Would you want colleagues lying to your boss about you?* Probably not. **Conclusion: Don't do it.** (Plausible)
          *   **Festival:** *Would you want people you care about skipping important events for you?* Maybe not, but depends on closeness. Ambiguous. **Conclusion: Weak/mixed.**
          *   **Not Voting:** *Would you care if others didn't vote?* If you genuinely don't value voting, maybe not. **Conclusion: Doesn't clearly forbid it.**
          *   **Hurtful Truth:** *Would you want friends to be brutally honest about things you can't change?* Probably not. **Conclusion: Don't do it.**
      *   **Gets his "Don't do it"?** Sometimes, but weakly and inconsistently (Festival, Voting).

  2.  **Kant's Categorical Imperative - Universal Law Formulation (Logical Consistency)**
      *   **Claim:** "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Can the *rule* (maxim) governing your action be consistently universalized without leading to a *logical contradiction* or making the action/desire *impossible*?
      *   **Committed To:** Acting from duty based on pure reason. Moral rules must be universal and consistent, regardless of consequences. Focus is on the *logic* of the rule itself when everyone follows it.
      *   **Plausibility:** Powerful for rules essential for social practices (promises, property). Criticized for being too abstract, ignoring consequences, and struggling with maxim formulation (your key point!). The "contradiction" test is debated (contradiction *in conception* vs. *in the will*).
      *   **Your Cases (Using careful maxims):**
          *   **Sick Day:** *Maxim: "Lie to my employer when I want a day off."* Universalized: No one trusts sick leave claims, system collapses, lying becomes impossible/pointless. **Contradiction in conception. Conclusion: Don't do it.**
          *   **Festival:** *Maxim: "Prioritize a highly anticipated, pre-paid personal commitment over a non-essential family obligation when I believe my absence won't cause major harm."* Universalized: People prioritize significant personal plans over minor family events. This seems logically possible – family events might adapt or become less frequent/elaborate. No clear *logical* contradiction. **Conclusion: Permissible?** (Depends *heavily* on maxim wording - "Blow off important commitments" fails).
          *   **Not Voting:** *Maxim: "Don't vote when my single vote has no statistically significant chance of affecting the outcome."* Universalized: *No one votes*. Democracy collapses, voting becomes impossible. **Contradiction in conception/will.** Kant likely forbids it. **Conclusion: Don't do it.**
          *   **Hurtful Truth:** *Maxim: "Tell a friend an unsolicited, hurtful truth about their appearance when it serves no practical purpose."* Universalized: People constantly share harsh, unnecessary opinions. Trust and social bonds erode, communication becomes painful/impossible. **Contradiction in the will** (we need trust/society). *OR* Maxim: "Always tell the truth." Universalized: Seems logically possible, but leads to immense harm (Kant struggled here!). **Ambiguous.** Most argue Kant's duty to truth isn't absolute if it causes great harm, but it's messy. **Conclusion: Unclear / Probably Don't do it.**
      *   **Gets his "Don't do it"?** Mostly (Sick Day, Voting, arguably Truth), but Festival hinges *critically* on maxim description. **Kant is NOT primarily about consequences.**

  3.  **"Society Would Collapse" Reading (Rule-Consequentialism / Utilitarianism in disguise)**
      *   **Claim:** If everyone did the action, it would lead to disastrous consequences that make society (or the specific practice) impossible or much worse off overall. WIDT? is a heuristic to predict *bad outcomes*.
      *   **Committed To:** The moral value of an action depends on the consequences of *everyone following the rule* it implies. Focus is on outcomes, not logic or duty.
      *   **Plausibility:** Highly intuitive and practical for many social rules. Explains *why* certain universalizations fail (they cause collapse). Criticized for being vague, demanding impossible calculations, and potentially justifying bad individual acts if the rule-breaker doesn't *cause* the collapse.
      *   **Your Cases:**
          *   **Sick Day:** Universal lying destroys trust in sick leave, harming genuinely ill people and workplaces. **Conclusion: Don't do it.** (Plausible)
          *   **Festival:** *If everyone skipped family events for festivals...* Family bonds weaken? Social fabric frays? But festivals also build community. Consequences are speculative and arguably not catastrophic. **Conclusion: Weak / Probably Permissible.**
          *   **Not Voting:** Universal non-voting destroys democracy. **Conclusion: Don't do it.**
          *   **Hurtful Truth:** Universal harsh honesty creates a cruel, distrustful society where no one feels safe. **Conclusion: Don't do it.**
      *   **Gets his "Don't do it"?** Mostly (Sick Day, Voting, Truth), but Festival is weak. **This is likely what your flatmate *actually* means when he says "Kant" but it's NOT Kant.** Kant cares about logic/duty, not consequences.

  4.  **Bare "You'd Be a Hypocrite" Reading (Personal Consistency)**
      *   **Claim:** You are relying on others *not* doing the thing you want to do. If everyone did it, the benefit you seek (or the system you exploit) would vanish. You can't *rationally will* both your action and its universalization.
      *   **Committed To:** Avoiding free-riding and hypocrisy. Requires that your action depends on others' restraint.
      *   **Plausibility:** Strong for free-rider problems. Weak for actions that don't rely on others' forbearance or where universalization *wouldn't* destroy the benefit (e.g., enjoying a sunset).
      *   **Your Cases:**
          *   **Sick Day:** You rely on most people *not* faking sick days to maintain the system. If everyone faked, system collapses. **Hypocrite/Free-rider. Conclusion: Don't do it.**
          *   **Festival:** Does skipping rely on others attending? Unclear. Your absence might not ruin the party; others might still go. No clear hypocrisy. **Conclusion: Probably Permissible.**
          *   **Not Voting:** You rely on *others* voting to maintain democracy while you benefit without contributing. **Classic Free-rider/Hypocrite. Conclusion: Don't do it.**
          *   **Hurtful Truth:** Does telling the hurtful truth rely on others *not* doing it to you? Not necessarily. You might be willing to accept universal honesty, even if painful. **Conclusion: Doesn't clearly forbid it.**
      *   **Gets his "Don't do it"?** Mostly (Sick Day, Voting), but not for Festival or Truth.

  5.  **The Free-Rider Reading (Economic/Practical Consistency)**
      *   **Claim:** Essentially a specific, practical application of the "Hypocrisy" reading. You are benefiting from a public good or cooperative system without contributing your fair share. If everyone free-rode, the good/system collapses.
      *   **Committed To:** Fairness in cooperation and sustaining beneficial systems. Avoiding exploitation.
      *   **Plausibility:** Very strong for public goods (voting, taxes, environmental action). Irrelevant for purely private actions.
      *   **Your Cases:**
          *   **Sick Day:** Sick leave is a workplace "good." Faking exploits it. **Conclusion: Don't do it.**
          *   **Festival:** Not a public good/free-rider issue. **Conclusion: Irrelevant/Permissible.**
          *   **Not Voting:** Democracy is the ultimate public good. **Classic Free-Rider. Conclusion: Don't do it.**
          *   **Hurtful Truth:** Not a public good issue. **Conclusion: Irrelevant/Permissible.**
      *   **Gets his "Don't do it"?** Only for Sick Day and Voting.

  **Summary & Answering Your Questions:**

  1.  **What your flatmate likely means by "Kant":** He's almost certainly reaching for the **"Society Would Collapse" (Rule-Consequentialist)** interpretation (#3). He's focusing on the *bad consequences* of universalization (system collapse, harm). This is **NOT** Kant's core focus (logic/duty). He might also be leaning on the **Free-Rider/Hypocrisy** (#4/#5) angle, especially for voting and sick days.
  2.  **Does WIDT? get him "Don't do it" every time?** **No.** The verdict *depends entirely* on:
      *   **Which interpretation** is used.
      *   **How the maxim is described** (your crucial point!).
      *   **The specific case.**
      *   **The scope of "everyone".**
      *   **Festival:** Only the weak Rule-Consequentialist and Golden Rule readings *might* support "don't," and even then poorly. Kant (#2) likely permits it with a fair maxim. Hypocrisy/Free-Rider readings permit it.
      *   **Hurtful Truth:** Golden Rule, Rule-Consequentialism, and *one reading* of Kant say "don't." The Hypocrisy/Free-Rider readings permit it. Kant is ambiguous. It doesn't *force* one answer.
  3.  **Description-Dependence:** This is **fundamental**, especially for Kant (#2). It's not a bug; it's the core mechanism. The test asks if *this specific rule you are acting on* can be universalized. "Taking needed rest" might pass; "lying to employers" fails. Your flatmate is likely choosing descriptions that make the action look worst (e.g., "blow off commitment" vs. "prioritize pre-paid plan").
  4.  **Scope of "Everyone":** It **must** be "everyone *in relevantly similar circumstances*." "Everyone blows off *my sister's party*" is nonsense. "Everyone prioritizes leisure over minor family obligations when feasible" is the relevant test. Your flatmate needs to define the scope fairly.

  **Take This Back to Him:**

  "Look, 'What if everyone did that?' isn't one magic bullet. It's several different arguments crammed into one phrase. When you say 'Kant', you probably mean 'society would collapse if everyone did that' – that's *consequences*, not Kant's main point. Kant cares about whether the *rule itself* becomes nonsense if everyone follows it.

  1.  **How you describe my action changes everything.** 'Taking a needed break' vs. 'lying' are different rules for Kant. You pick the worst description.
  2.  **'Everyone' means people like me in my situation, not literally every human.** Testing my festival choice against everyone blowing off *this exact party* is silly.
  3.  **It doesn't always say 'don't do it':**
      *   **Sick Day:** Most readings say don't do it (fine).
      *   **Festival:** Only the weakest readings *might* say don't, and even then poorly. Kant probably allows it.
      *   **Not Voting:** Most readings (including Kant) say don't do it.
      *   **Hurtful Truth:** It's genuinely split – some readings say don't, others permit it. Kant doesn't settle it cleanly.

  Stop pretending it's a single, infallible Kantian knockout punch. It's a toolbox with different, sometimes conflicting, tools. Let's argue the specifics, not the slogan."

  This breakdown exposes the move's limitations and forces him to clarify *which* argument he's actually making and *why*. Good luck!
