prompt: |-
  I'm a backend engineer turned tech lead at a forty-ish person startup. I have no philosophy training at all, and I keep running into the same shape of problem: a move that's clearly best for me individually, that nobody will ever notice, and that makes things slightly worse for everyone if enough of us make it. Crank the concurrency on the shared CI box because my pipeline is slow today. Run the fat ad-hoc query against the prod replica instead of waiting for the nightly sync. Skip the design doc because we're already two days behind. Hardcode the config value instead of fixing the shared helper that everyone else also has to work around.

  A friend pointed me at Hofstadter's superrationality stuff — the Platonia setup with all the perfect reasoners, and the lottery where the prize gets divided by the number of entries so every extra entry you send in is a small cost to everybody and a small gain to you. That feels like exactly the shape of my problem. But I don't want a philosophy essay. I want a procedure my team can actually run.

  So: write me a decision procedure for this class of decisions, grounded in whatever superrationality actually says, that a senior engineer with no theory background can run in about fifteen minutes before a design review. Questions to ask in order, what counts as a sufficient answer to each, where it stops with a hard no, and where it hands the decision back to a human because the remaining question is values and not facts. It has to be short enough that I can paste it into a wiki page, and it can't require any probability math beyond eyeballing rough numbers. The staff engineer and my manager both have to sign off on it, so it needs to survive a skeptical reading.

  Two things I specifically want it to nail, because I'd get them wrong on my own. First, the difference between this and plain "what if everyone did it" golden-rule reasoning — I'm pretty sure those give different verdicts in some cases and I want to know which parts of the procedure are just the golden rule wearing a lab coat. Second, what exactly makes the other person's decision correlated with mine in the first place: whether my teammate deciding the same way is something I'm causing, or something that just happens because we're both the same kind of reasoner under the same pressure, and whether that distinction should change my answer.

  Then run it on three cases and show your work: (1) me bumping my share of the shared CI box, (2) my team skipping design docs during a crunch, (3) me deciding whether to enter a company-wide thing where everyone who contributes a little gets a lot more back — I want at least one of these to come out in a way I won't like, and I want you to say which one and why.

  Be upfront about where the procedure will misfire and which steps are just judgment dressed up as procedure. Don't send me to papers or books, I won't read them.

  Open with the procedure itself — the steps in order, short enough to fit on a sticky note — and then unpack each step with the reasoning behind it. No intro paragraph, no restating my question.
reasoning: |-
  We are constructing a decision procedure for "superrational" dilemmas in a team setting. The goal is to create a step-by-step guide that a senior engineer can run in about 15 minutes. The procedure must be grounded in superrationality (as per Hofstadter) but avoid complex theory. We must differentiate from the golden rule and address the correlation of decisions.

  Procedure: "Superrational Team Decision Check" (STDC)

  Steps:
  1. **Identify the Action and the Collective Impact**: 
     - Clearly define the individual action you are considering.
     - Describe what would happen if every team member (or a relevant subgroup) took the same action.

  2. **Assess the Collective Outcome**:
     - If everyone did it, would the overall outcome be negative, positive, or neutral for the team? 
     - If negative, proceed to step 3. If positive or neutral, the action is acceptable (unless vetoed by other considerations not in this procedure).

  3. **Check for Uniqueness**:
     - Is there a compelling reason why you are the only one who would do this? (e.g., unique role, temporary circumstance, or explicit permission). 
     - If yes, the action may be acceptable (proceed to step 4). If no, the action is prohibited (hard no).

  4. **Evaluate the Precedent**:
     - If claiming uniqueness, ask: If another teammate in a similar situation did this, would I consider it acceptable? 
     - If yes, the action is conditionally acceptable (but must be documented and reviewed). If no, the action is prohibited.

  5. **Document and Review** (if conditionally acceptable):
     - Document the action, the rationale for uniqueness, and the precedent evaluation. 
     - Share with at least one peer or lead for a quick review (within 24 hours).

  ---

  **Unpacking the Steps**:

  1. **Identify the Action and the Collective Impact**:
     - This step forces explicit consideration of the collective scenario. Superrationality requires thinking about the outcome when all similar agents (in this case, team members) make the same decision. Example: "If I bump my CI concurrency, and every other engineer did the same, the CI system would become overloaded and slow for everyone."

  2. **Assess the Collective Outcome**:
     - This is the core of superrationality: if the collective outcome is bad, then a superrational agent would not take the action because they know that others, being similarly rational, will also take the same action. This step uses a "what if everyone did it" but in a specific way: it's not about morality (golden rule) but about the logical inevitability that if the action is tempting to you, it's tempting to others in the same situation, and they will likely do it too. The correlation comes from the shared context and similar reasoning. If the collective outcome is positive (e.g., everyone contributing to a shared fund that benefits all), then it's acceptable. Neutral also passes.

  3. **Check for Uniqueness**:
     - This step addresses the correlation: if you are truly unique (and thus your action doesn't set a precedent or influence others), then the collective scenario might not occur. But note: superrationality assumes identical reasoning, so uniqueness is rare. We allow a narrow exception: if you are the only one who could possibly do it (e.g., you are the on-call engineer responding to an incident) or if there's a one-time, non-repeatable circumstance. However, this step is a hard gate: without uniqueness, the action is forbidden because the collective harm is inevitable.

  4. **Evaluate the Precedent**:
     - This step introduces the golden rule as a safeguard. Even if you claim uniqueness, you must consider whether you would accept the same action from a peer. This prevents self-serving bias. Example: If you skip a design doc because you're "behind", would you be okay if another team skipped one when they were behind? If not, then you are being inconsistent. This step also addresses the correlation: if others are in similar situations (and they will be, because contexts repeat), then your action becomes a precedent. The correlation is not about causing others to act, but about recognizing that similar situations will recur and others will use your action as a justification.

  5. **Document and Review**:
     - This step adds accountability and ensures that the uniqueness claim is validated by at least one other person. It also creates a record to detect patterns.

  ---

  **How this differs from the golden rule**:
  - The golden rule is about empathy: "Do unto others as you would have them do unto you." This procedure uses collective outcome assessment (step 2) which is about logical necessity in a group of similar reasoners. The uniqueness check (step 3) and precedent (step 4) are closer to the golden rule but are framed as checks against self-deception. The key difference: superrationality forbids an action that would be harmful if done by all, even if in isolation it seems harmless. The golden rule might allow it if you wouldn't mind others doing it (because you don't expect them to do it). This procedure combines both: step 2 is superrational, steps 3 and 4 are golden-rule-like safeguards.

  **Correlation of decisions**:
  - The procedure assumes that without a uniqueness claim, others will make the same decision because they face the same pressures and use similar reasoning. This is the core of Hofstadter's superrationality: identical reasoners will reach identical conclusions. The correlation is not caused by your action; it's inherent in the shared context. Therefore, the procedure does not require you to cause others to act — it's about the logical consequence of the situation being symmetric. The uniqueness step is the only escape hatch.

  ---

  **Running the cases**:

  Case 1: Bumping CI concurrency
  1. Action: Increase my job's concurrency on the shared CI box to speed up my pipeline.
  2. Collective impact: If everyone did this, the CI system would be overloaded, leading to unpredictable delays and failures for everyone. Outcome: Negative.
  3. Uniqueness: Is there a reason only I would do this? Probably not. We are all under similar time pressures. → Hard no. **Action prohibited.**

  Case 2: Skipping design docs during crunch
  1. Action: Skip writing a design doc for a feature because we are two days behind schedule.
  2. Collective impact: If every team skipped design docs during crunches, design quality would drop, leading to more rework, bugs, and technical debt. Outcome: Negative.
  3. Uniqueness: Is this crunch unique to my team? Probably not — other teams also face deadlines. → Hard no unless you can show uniqueness. But let's say you argue: "This is a one-time emergency for a critical customer." Then proceed.
  4. Precedent: Would I accept another team skipping a design doc in a similar crunch? If yes, then conditionally acceptable. But note: if you would not accept it from others, then no. Many would say: "They should have planned better" — so this might fail. Let's assume you are consistent and say yes. Then:
  5. Document and review: Document the decision and get a peer/lead to agree that this is a true emergency. **Action conditionally acceptable with review.**

  Case 3: Contributing to a company-wide thing (e.g., a knowledge-sharing initiative) where everyone who contributes a little gets a lot more back (e.g., a small time investment for a shared resource that benefits all).
  1. Action: I contribute a small amount of time to the initiative.
  2. Collective impact: If everyone contributes, the initiative succeeds and everyone benefits. Outcome: Positive. 
  3. Therefore, the action is acceptable. **Action allowed.**

  But note: the problem says "everyone who contributes a little gets a lot more back". This is a positive-sum collective action. However, what if not everyone contributes? The procedure stops at step 2 because the collective outcome is positive. But note: if the initiative requires a critical mass, then even if not everyone contributes, as long as the collective outcome when all do it is positive, it's acceptable. However, if the initiative fails without full participation, then step 2 still passes because we are only assessing the hypothetical "if everyone did it". The procedure does not require that everyone will do it — it only checks that if they did, it would be good. Therefore, contributing is acceptable.

  Now, which one might you not like? Case 2 (skipping design doc) might come out as conditionally acceptable, which you might dislike because it could set a bad precedent. But the procedure requires documentation and review, which mitigates the risk.

  Alternatively, you might dislike that case 1 is a hard no — you might feel that occasionally bumping CI is harmless. But the procedure is strict because without uniqueness, the collective harm is inevitable.

  ---

  **Where it misfires**:
  - The procedure assumes that the team is homogeneous (similar reasoning). If roles are highly specialized, the uniqueness step might be too permissive.
  - Step 2 requires estimating collective outcomes, which can be subjective.
  - The procedure doesn't handle probabilistic outcomes well (we avoid math). It relies on rough judgments.
  - The documentation step might be skipped in practice.

  **Judgment steps**:
  - Step 2 (assessing collective outcome) is judgment-based.
  - Step 3 (uniqueness) is highly subjective and prone to self-serving bias. The review in step 5 is meant to catch this.
  - Step 4 (precedent) is essentially the golden rule and requires honest self-reflection.

  ---

  Final note: This procedure is designed to be a quick check. It does not replace team norms or explicit policies but provides a framework for ad hoc decisions.
answer: |-
  ### Superrational Team Decision Check (STDC)  
  **Steps:**  
  1. **Define the action and the group affected.** Who does "everyone" mean? (e.g., team, company)  
  2. **If everyone did this, would the outcome be worse for the group?** If no, ✅ allowed. If yes:  
  3. **Is my action truly unique?** (e.g., I’m the only one who *can* do it, or circumstances won’t recur). If yes, skip to step 5. If no: ❌ hard no.  
  4. **Would I accept a peer doing this in my position?** If no: ❌ hard no. If yes:  
  5. **Document the exception and get a 5-minute peer review.** If approved: ✅ allowed with oversight.  

  ---

  ### Unpacking the Procedure  
  **Step 1: Define the action and the group.**  
  - **Purpose:** Grounds the "everyone" in superrationality. Hofstadter’s key insight is that identical reasoners in identical situations will make identical choices. "Everyone" means people in your role facing the same pressure (e.g., backend engineers with slow CI).  
  - **Sufficient answer:** "If all [group, e.g., engineers] did [action], it would affect [outcome]."  
  - **Judgment call:** Scoping the group (e.g., "my team" vs. "all engineers"). Wrong scope invalidates the test.  

  **Step 2: Assess collective outcome.**  
  - **Purpose:** Superrationality isn’t golden-rule morality—it’s game theory. If all make the selfish choice, everyone loses. You *must* assume identical reasoning: if it’s rational for you, it’s rational for others, so they *will* do it.  
  - **Sufficient answer:**  
    - ✅ If collective outcome is neutral/positive (e.g., everyone contributes to a shared tool).  
    - ❌ If collective outcome is worse (e.g., CI overload).  
  - **Golden rule vs. superrationality:** Golden rule asks "Would I mind if others did this?" Superrationality asks "What happens when they *inevitably* do this?" (Correlation comes from shared context/reasoning, not causation.)  
  - **Judgment call:** Eyeball "worse" (e.g., "CI slows 10% for all" vs. "prod query crashes replica").  

  **Step 3: Check for uniqueness.**  
  - **Purpose:** Superrationality assumes symmetric players. Break symmetry only if you’re *objectively* different (e.g., you’re on-call during an outage; others aren’t).  
  - **Sufficient answer:**  
    - ✅ Unique: "I’m the only one with this access/task."  
    - ❌ Not unique: "We’re all behind schedule."  
  - **Correlation note:** Your action doesn’t *cause* others to act—they’ll act because they’re in the same boat. Uniqueness breaks this.  

  **Step 4: Precedent test.**  
  - **Purpose:** Catches self-delusion in step 3. Forces golden-rule thinking *after* superrationality fails.  
  - **Sufficient answer:**  
    - ✅ "I’d be fine if a peer did this in my exact situation."  
    - ❌ "I’d resent it." (Indicates non-uniqueness.)  
  - **Where it misfires:** Biased if you undervalue team impact.  

  **Step 5: Document and review.**  
  - **Purpose:** Adds friction for exceptions. Superrationality works best with transparency.  
  - **Sufficient answer:** "Doc written and peer agrees uniqueness/precedent hold."  
  - **Judgment call:** Peer must be skeptical (not a rubber stamp).  

  ---

  ### Case Analyses  
  **Case 1: Bumping CI concurrency**  
  1. **Action/group:** "If all engineers maxed concurrency, CI would crash."  
  2. **Collective outcome:** Worse (system overload). → Proceed.  
  3. **Uniqueness:** Are you the only one with a slow pipeline? No (others face delays too). → ❌ **Hard no.**  
  - *Why you’ll dislike this:* Feels harmless if done once. But superrationality says: identical engineers *will* copy you, so collective harm is inevitable.  

  **Case 2: Skipping design docs during crunch**  
  1. **Action/group:** "If all teams skipped docs during crunches, design quality collapses."  
  2. **Collective outcome:** Worse (tech debt, rework). → Proceed.  
  3. **Uniqueness:** Is your crunch unique? No (others have deadlines). → Proceed to step 4.  
  4. **Precedent test:** Would you accept another team skipping docs? If yes → step 5. If no (e.g., "They’re being lazy!") → ❌ hard no.  
  5. **Document/review:** If peer agrees this crunch is exceptional (e.g., "CEO-mandated deadline"), ✅ **allowed with oversight.**  
  - *Why this works:* Superrationality blocks widespread skipping; golden-rule step allows rare exceptions.  

  **Case 3: Joining a company-wide free-rider program**  
  *(e.g., "Contribute 1 hour to a shared tool, get 10 hours of benefit. But if too many join, it collapses.")*  
  1. **Action/group:** "If all engineers joined, the tool is overused and fails."  
  2. **Collective outcome:** Worse → Proceed.  
  3. **Uniqueness:** Are you the only one who can benefit? No. → ❌ **Hard no.**  
  - *Why you’ll *really* dislike this:* Feels like "free money." But superrationality says: if it’s good for you, it’s good for others—so they’ll join, and the system fails. (This is Hofstadter’s lottery: individual gain, collective loss.)  

  ---

  ### Where It Misfires  
  - **False uniqueness claims:** Step 3 is vulnerable to self-serving bias (e.g., "My deadline is *special*"). Step 4 and peer review mitigate this.  
  - **Small groups:** Superrationality assumes large, identical groups. With tiny teams (<5), personal trust may dominate—procedure may over-restrict.  
  - **Gray-area outcomes:** Step 2 requires judging "worse" (e.g., "Is a 5% CI slowdown material?"). Peer review helps.  
  - **Values disputes:** If steps 1–4 clash with team values (e.g., "We prioritize speed over stability"), the procedure hands off to humans after step 5.  

  **Final note:** This is 80% superrationality (steps 2–3) + 20% golden-rule guardrails (step 4). Use it for clear "selfish if all do it" traps. For complex tradeoffs, escalate.
