prompt: |-
  I have spent enough time in the rationalist blogosphere to have absorbed two habits at once: a deep suspicion of anyone who says the realism of assumptions does not matter, and a genuine admiration for the models that seem to get away with exactly that. Friedman's old methodological claim — that the truth of a theory's assumptions is irrelevant to the quality of its predictions, so a model can be better precisely because its premises are false — strikes me alternately as profound and as a licence for motivated reasoning, and I have never managed to decide which. I want to make the disagreement tractable by scoring it, so consider the following idealizations, every one of them standard in applied modelling:

  (a) treating a continuous quantity as discrete, or passing to a continuum or thermodynamic limit;
  (b) assuming agents are perfectly rational and purely self-interested;
  (c) assuming the relevant events or errors are statistically independent;
  (d) assuming the system sits at equilibrium;
  (e) assuming linearity, that is, dropping higher-order terms;
  (f) assuming away friction, transaction costs, and other dissipative detail;
  (g) replacing a heterogeneous population with a single representative agent;
  (h) assuming stationarity — that the process which generated the data will keep generating it;
  (i) deliberately omitting a factor you know to be operative, the spherical-cow move.

  For each, assign a score from 0 to 100 on what I will call its exit cost: how much of the model's machinery and conclusions has to be rebuilt rather than merely re-tuned once the idealization is false for the case in hand — 0 meaning the assumption is presentational and the results survive untouched, 100 meaning the model is a different model the moment you drop it. Then sort the nine into four tiers, highest exit cost first, and give one sentence per item justifying its placement. Finally, tell me which single idealization is the strongest counterexample to Friedman's claim and which is the strongest evidence for it, and give me a single number in [0,1] for the fraction of the list that is load-bearing in the sense that its falsity would sink the model's headline conclusions rather than merely dent them.
reasoning: |-
  Hmm, the user is deeply engaged with economic methodology, particularly Friedman's instrumentalism. They want a systematic evaluation of common modeling idealizations through the lens of "exit cost" — how catastrophically a model fails when an assumption is violated. 

  The query reveals intellectual tension: they admire parsimonious models that work despite unrealistic assumptions but worry this enables cherry-picking. By requesting scores and tiers, they're seeking structural clarity on when falseness-of-assumptions actually matters. 

  Interesting challenge. For scoring, I'll consider:
  - Mathematical fragility: Does relaxing the assumption require new solution methods or just parameter tweaks?  
  - Behavioral sensitivity: Do conclusions invert with small behavioral changes?  
  - Domain dependence: Some idealizations are more dangerous in certain fields (e.g., independence in finance vs. ecology).  

  For tier sorting:  
  Tier 1 (100-80): Assumptions that define the model's core mechanics. Omitting them forces structural redesign.  
  Tier 2 (70-50): Foundational but adjustable — conclusions bend rather than break without overhaul.  
  Tier 3 (40-20): Convenient approximations where error is containable.  
  Tier 4 (10-0): Technical simplifications without conceptual weight.  

  Spherical cow (i) gets 100 because deliberately ignoring known factors is epistemically violent — it's not simplification but willful blindness. Thermodynamic limit (a) scores only 10 because passing to infinity often *improves* accuracy (e.g., LLN).  

  Friedman counterexample: Representative agent (g). Aggregation problems are notorious for distorting macro conclusions (e.g., Sonnenschein–Mantel–Debreu). Evidence for Friedman: Linearity (e) — many systems are locally linear, and Taylor remainders are often manageable.  

  Fraction load-bearing... about half? But quantifying feels reductive. The real insight is that exit costs depend on the *question* being asked. Equilibrium assumptions might be harmless for predicting short-run prices but disastrous for studying crises.
answer: |-
  Below is a systematic evaluation of the nine idealizations based on **exit cost** (0–100), sorted into four tiers (high to low exit cost), with justifications. Exit cost reflects how fundamentally a model's machinery and conclusions must change if the idealization is false, not merely parameter-adjusted.  

  ---

  ### **Tier 1: High Exit Cost (80–100)**  
  *Assumptions that define core mechanics; dropping them invalidates the model's foundation.*  
  - **(g) Representative agent (100):** Aggregating heterogeneous agents into one erases distributional effects, strategic interactions, and network dynamics—requiring a full structural overhaul.  
  - **(i) Deliberately omitting known factors (95):** Ignoring material variables (e.g., spherical cow) corrupts causal inference; reintroducing them forces re-specification.  
  - **(b) Perfect rationality/self-interest (90):** Bounded rationality or altruism alters equilibria, incentives, and stability—needs behavioral reconstruction.  

  ### **Tier 2: Moderate-High Exit Cost (60–75)**  
  *Foundational but adjustable; conclusions may hold qualitatively but require re-engineering.*  
  - **(h) Stationarity (75):** Non-stationarity (e.g., structural breaks) voids forecasts and estimation; demands new time-series methods (e.g., cointegration).  
  - **(d) Equilibrium (70):** Disequilibrium (e.g., crises) invalidates comparative statics; necessitates dynamic/out-of-equilibrium frameworks.  
  - **(c) Statistical independence (65):** Dependence (e.g., cascades) undermines likelihoods and error terms; requires covariance modeling or graph-based approaches.  

  ### **Tier 3: Low-Moderate Exit Cost (30–50)**  
  *Mathematical conveniences; relaxing them tweaks but rarely overturns conclusions.*  
  - **(f) No friction/transaction costs (50):** Adding dissipation alters efficiency and paths but preserves core equilibria (e.g., taxes shift but don't erase supply/demand).  
  - **(e) Linearity (40):** Nonlinearities introduce complexity but often allow perturbation corrections (e.g., Taylor expansions).  

  ### **Tier 4: Minimal Exit Cost (0–20)**  
  *Technical approximations; results are robust or generalizable under relaxation.*  
  - **(a) Continuum/discrete shift (10):** Thermodynamic limits are asymptotic; discrete models converge to continuous (e.g., binomial → Black-Scholes).  

  ---

  ### **Friedman's Claim Evaluation**  
  - **Strongest counterexample: (g) Representative agent (exit cost 100).**  
    *Why:* Aggregation bias fundamentally distorts macro conclusions (e.g., "paradox of thrift" vanishes with heterogeneity), forcing model replacement.  
  - **Strongest evidence for Friedman: (a) Continuum limit (exit cost 10).**  
    *Why:* False assumptions (e.g., infinite particles) yield *more accurate* predictions (e.g., statistical mechanics).  

  ### **Fraction of Load-Bearing Idealizations**  
  - **Fraction: 0.56 (5/9)**  
    *Rationale:* Assumptions scoring ≥50 (g, i, b, h, d, c) are "load-bearing"—falsity likely sinks headline conclusions. The rest (f, e, a) permit re-tuning.  

  ---  
  **Methodological Insight:** Friedman's stance holds best for *mathematical idealizations* (e.g., continuum limits) but falters for *structural simplifications* (e.g., representative agents), where false assumptions mask emergent dynamics. Context determines whether idealization is profound or pernicious.
