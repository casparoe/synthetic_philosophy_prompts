  Looking at the friend's pattern of judgments, I can see some clear principles emerging. For the figurines buried under a house floor, the friend sees ritual significance because they were repetitive, intentionally deposited, and hidden. But a single pendant in a trash heap is dismissed as meaningless since it could be accidental loss. The bog offerings and bent swords are considered intentional deposits because they involve valuable items deliberately damaged or placed far from settlements. The decorated pot is "just a pot" because decoration alone doesn't imply religion, while the beads in trash are seen as workshop debris - bulk waste rather than ritual.

