  I should outline at least two possible consistent rules that explain all the previous verdicts. One rule might focus on "intentional non-functional placement" - things deliberately put somewhere with no practical purpose. Another might emphasize "repetitive pattern with investment" - requiring multiple instances plus some cost or effort. Both would reject the pebble case as insignificant, but for slightly different reasons.

  If I have to choose which rule the friend actually uses, I'd lean toward the "investment" rule since he often notes valuable materials or effort expended (like bending swords). If he used the "placement" rule instead, he'd need to reinterpret cases like the decorated pot or beads where he dismissed ritual significance despite intentional placement.

  To distinguish these rules, I can propose a hypothetical: what if they found a single gold figurine in a niche? The "placement" rule might see it as ritual, while the "investment" rule would likely call it a hidden valuable. That would force the rules apart.

  Finally, I should address the epistemology here. Many of the friend's verdicts are actually about actions (what people did) rather than beliefs (what they thought). He's on solid ground for actions - we can infer deliberate placement from context. But beliefs are trickier; we can't directly access ancient minds. His strongest belief claims come from repetitive patterns (like the figurines) that suggest shared tradition, not isolated acts.
answer: |-
  Based on your friend's consistent pattern of reasoning across the previous cases, I can model his underlying rules, predict his verdict for the pebble niches, identify potential rule conflicts, propose a test case, and analyze the nature of his claims. Here's the structured argument:

  **I. Potential Rules Fitting All Previous Verdicts:**
  Your friend's rulings suggest he requires **multiple, non-arbitrary signals of deliberate, non-utilitarian action** to infer ritual/meaning. Two core (and overlapping) rules emerge:

  1.  **The "Investment/Effort" Rule:** Significance is inferred when there is demonstrable *investment* (material value, labor, repetitive action, deliberate destruction, or consistent placement) that serves no apparent practical function. The investment *must* exceed what would be expected for accidental loss, discard, or purely utilitarian use.
      *   *Fits Previous Cases:* Figurines (repetitive making/burying), Bog hoard (valuable items deliberately placed far away), Bent swords (effort to destroy value), Large house (investment in size/foreign goods), Headless figurine (deliberate placement). Dismisses pendant (no investment, accidental), decorated pot (decoration is low investment/utilitarian?), beads (bulk discard, no specific effort), stone (no investment).
      *   *Prediction for Pebble Niches:* **"Tells us nothing significant."** Pebbles are unworked, non-valuable, require minimal effort to place. Ochre smear is minimal effort. No pattern beyond the settlement (unique). Lack of standardization (different stones) suggests no specific meaning. Could be accidental inclusions during wall construction, simple chinking stones that fell in, or random acts with no shared meaning. "Votive" is overreach.

  2.  **The "Patterned Non-Utilitarian Placement" Rule:** Significance is inferred primarily from *repetitive, structured placement* of objects in specific, non-utilitarian contexts (e.g., buried, deposited away, broken/deposited, placed against a wall). Mere presence, even of multiple items, in utilitarian or discard contexts isn't enough.
      *   *Fits Previous Cases:* Figurines (buried under floor), Bog hoard (placed in bog), Bent swords (placed in river), Headless figurine (placed against doorway), Large house (pattern across settlements). Dismisses pendant (in rubbish - discard context), decorated pot (in house - utilitarian context), beads (in rubbish - discard context), stone (found loose - no context).
      *   *Prediction for Pebble Niches:* **"Possibly deliberate, but tells us nothing about belief."** The niche itself is patterned placement (11/14 houses!). Pebbles *in* the niche adds another layer of placement. Ochre on the wall is another deliberate action. However, the *objects* themselves (unworked pebbles) show no investment or inherent meaning. While deliberate placement is likely, it could be a simple, functional, or superstitious habit (e.g., luck charm, simple marker) with no deeper shared ritual or belief structure. "Votive" is unjustified.

  **II. Most Likely Rule & Consequences:**

  *   **Likely Rule:** He is running a **combination leaning heavily towards the "Investment/Effort" Rule.** His dismissals often hinge on lack of value/labor (pendant, stone, potentially beads/decoration), while his affirmations highlight cost/deliberate effort (figurines, hoard, swords, large house). The "patterned placement" seems secondary, activated primarily when coupled with significant investment (headless figurine placement confirms its deliberate nature *after* investment in the object itself is assumed).
  *   **Why:** His strongest affirmations (bog hoard, bent swords) scream "value/effort sacrificed." His dismissal of the decorated pot ("decoration is not religion") directly rejects low-effort symbolic investment. The niche case has patterned placement but virtually *zero* investment in the objects or the act.
  *   **Consequence of Switching Rules:** If he were instead primarily using the **"Patterned Non-Utilitarian Placement" Rule**, he would likely need to **reinterpret the "Three hundred identical shell beads in a household rubbish heap"** verdict. The *placement* (rubbish heap) led him to call it "workshop debris" (discard context). However, the sheer quantity and uniformity *could* be argued as a pattern of deliberate deposition (e.g., a termination ritual for a workshop, a specific type of waste management). Under the "Placement" rule alone, the discard context might still dominate, but the quantity/pattern introduces more ambiguity than his original definitive "debris" verdict allowed. The other verdicts hold reasonably well under both rules.

  **III. Test Case to Force Rules Apart:**

  *   **The Case:** Discovery of **a single, small, unworked, non-local (exotic) stone placed upright in a purpose-built, miniature clay niche set into the wall of *one* house within a settlement.** No other examples found at the site or similar sites. No ochre or other additions. Found during excavation sealed beneath the floor.
  *   **Predictions:**
      *   **Investment/Effort Rule:** Likely verdict: **"Tells us nothing significant, or maybe a personal quirk."** *Reasoning:* Single instance (no repetition). Object has minimal inherent value (unworked stone, though exotic). Effort involved is low-medium (making niche, placing stone). No destruction of value. Could be accidental inclusion (though niche makes this harder), a toy, or a purely personal act with no shared meaning. Lack of pattern/repetition and low investment outweigh the deliberate placement.
      *   **Patterned Non-Utilitarian Placement Rule:** Likely verdict: **"Evidence of deliberate ritual action within this specific household."** *Reasoning:* Clear non-utilitarian placement (purpose-built niche, stone placed upright, sealed beneath floor). The context screams intentionality. While only one instance, the specificity of the placement is the key signal. The uniqueness doesn't negate the deliberate act for that household. It might indicate a household-specific practice or belief.

  **IV. Nature of the Claims & Epistemology:**

  *   **Claims About Actions (What They Did):** Most of his verdicts are primarily claims about actions:
      *   "Recurring household ritual" (action: repeated making/burying)
      *   "Lost or thrown out" (action: discard/loss)
      *   "An offering" (action: deliberate deposition in specific context)
      *   "Workshop debris" (action: discard)
      *   "Deliberate" [placement] (action: intentional positioning)
      *   "A ranked society" (action: differential accumulation/display of resources)
      *   His predicted "just a pot" or "tells us nothing" imply purely utilitarian actions or accidental actions.
      *   **Right to Claim:** He has a strong, defensible right to make these claims. Archaeology excels at inferring past *actions* and *practices* from patterns in material remains and context. His rules (investment, patterned placement) are reasonable heuristics for distinguishing deliberate, non-utilitarian actions from accidental ones or utilitarian discard.

  *   **Claims About Beliefs (What They Thought/Believed):** These are rarer and more tentative in his rulings:
      *   "...one of the few cases where you can say something about what people *believed*..." (Figurines)
      *   The *interpretation* of "offering" or "votive" inherently implies belief (e.g., belief in gods/spirits needing placation). However, he usually grounds this in the *action* ("safe as this kind of claim *ever* gets").
      *   **Right to Claim:** This is **highly contested ground in archaeology.** While actions can be inferred, the *specific beliefs* motivating those actions are much harder to access. He implicitly claims this right only in cases of **highly repetitive, patterned actions involving investment/deliberate placement with no utilitarian explanation** (e.g., the figurines). His skepticism elsewhere (stone, pendant, decorated pot) shows he recognizes this difficulty. Does he have a *right* to it? Archaeologists *do* infer belief systems, but cautiously and based on strong patterns (like his figurine case). His approach (demanding high investment/patterned action as a proxy) is a common, albeit debated, way to cautiously approach belief. He arguably has a *qualified* right based on robust material patterns, but it remains interpretive, not definitive. His dismissal of the decorated pot ("decoration is not religion") shows he rightly rejects simplistic symbolic interpretations without supporting contextual evidence of non-utilitarian action.

  **Conclusion:** For the pebble niches, your friend will almost certainly **reject the "votive" interpretation.** His core argument will be that the **lack of investment (unworked, non-valuable pebbles, minimal effort in ochre smear)** combined with the **uniqueness of the pattern** does not meet his threshold for inferring shared ritual practice, let alone specific belief. He'll likely concede the placement *might* be deliberate based on the niche and ochre ("Patterned Placement" aspect), but will insist this tells us nothing meaningful about what the inhabitants thought or believed, only that they *might* have had a minor, idiosyncratic habit. The "Investment/Effort" rule is his dominant framework, making the pebbles' mundanity fatal to the excavators' interpretation.
