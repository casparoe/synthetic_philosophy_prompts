  First, the main issue is the kidney subplot feels unresolved because the objection isn't clear. The user needs to understand the core philosophical conflict to make the story work. But now, they have to teach this concept to fellow writers who prefer stories over abstract arguments. 

  The group's preferences are crucial: 11 novelists, 2 poets, allergic to lectures. They think in scenes and grudges. So the session must be engaging, using concrete examples and avoiding academic jargon. The professional mourner example is proposed, but their partner thinks it’s a trap because people might dismiss it as "not real grief." I need to assess if this example can work or if another is better.

  The user also lists potential misconceptions: opposition to all markets, the "ick factor," exploitation vs. commodification, and paying surgeons. These need preemptive addressing in the session flow. Plus, the psychology finding about sacred values could be useful but needs proper placement.

  I should structure the session in a sequence that builds understanding step by step. Start with a relatable example to hook them, then layer concepts. The professional mourner can work if framed as a thought experiment, not a debate about real grief. It highlights the violation of a sacred boundary without harm, which mirrors the kidney dilemma.

  For kidneys, the example stays but needs to be introduced after establishing the sacred vs. market distinction. The key is to show that even without exploitation, commodifying certain things feels wrong. Address misconceptions when they naturally arise—like after defining commodification, tackle the "all markets" objection by distinguishing necessary vs. sacred exchanges.

  The psychology finding about sacred values is vital. It explains the visceral reaction to pricing kidneys. Place it after the examples to validate their intuitive discomfort. 

  End with a question that tests their grasp: "What's the one thing you couldn't put a price on, even if everyone consented?" This shifts focus to personal sacred values, showing if they internalized the concept.

  Also, the user needs to know what to omit. Avoid diving into economic theories or solutions. Focus solely on the "why" behind the discomfort. Highlight that exploitation compounds the issue but isn't the core of commodification's problem.

  Finally, ensure British English throughout. Keep the plan practical, step-by-step, with clear timing. Each segment should flow into the next, using discussions and examples to maintain engagement.
answer: |-
  Here’s a battle-tested plan for your session, structured for maximal engagement with minimal philosophy-speak. It’s built on **layered discomfort** and pivots on the **professional mourner** example (which *is* perfect – we’ll disarm your partner's objection).

  **Session Title:** "Can You Sell That? When Money Feels Like Mud"

  **Core Objective:** Get them to feel the *itch* of commodification – the sense that putting a price on certain things *transforms* them or violates an invisible boundary, even when no obvious harm occurs.

  **The One Example:** **Professional Mourners** (Stick with it!).
  *   **Why it works:** It isolates the "sacred violation" feeling *without* the complicating factors of physical harm, exploitation, or desperation clouding the core issue. Kidneys bring in vital but distracting arguments (health risks, poverty). Mourners are pure "ick".
  *   **Disarming the Trap ("That isn't grief"):** Don't *let* them dismiss it. Frame it immediately as a thought experiment: *"Okay, imagine a culture where this *is* a real, accepted profession. The payer wants the *appearance* of profound grief. The 'mourner' is a skilled actor, excellent at producing convincing sobs and wails on demand. No deception. Everyone consents. The payer gets what they paid for. The actor gets paid. Objectively, a clean exchange. So... why does it still feel *off* to most of us? What's the residue?"* This forces them to confront the feeling *despite* consent and lack of harm.

  **The Plan (60 Minutes - Strict Timing!):**

  1.  **Hook: The Kidney Conundrum (Your Grudge) (5 mins)**
      *   Start personal & frustrated: *"Right, so my WIP has this woman selling a kidney for her brother's debt. And I'm stuck. She consents. The surgeon consents. The recipient gets life. She clears the debt. On paper, everyone wins. But I *know* it feels wrong, deeply wrong, and I can't articulate *why* without sounding preachy or just squeamish. Anyone else wrestle with this kind of moral itch in their work?"* (Nods guaranteed). *"Today's not about solving my plot, but about understanding *that itch*. Let's call it the 'Can You Sell That?' itch."*
      *   **Why this order:** Starts with *your* creative struggle (relatable), introduces the kidney as the visceral anchor, but immediately signals we're dissecting the *feeling*, not just the organ sale.

  2.  **The Crucible: Professional Mourners (20 mins)**
      *   **Set-Up (5 mins):** Describe the trade vividly (as above). Emphasize skill, consent, mutual benefit. *No judgement yet.*
      *   **Question 1 (Group Discussion - 10 mins):** *"What's the *source* of that 'off' feeling? Be specific. What gets lost or changed when grief (or its performance) becomes a paid service?"* *Guide them:* Listen for "It cheapens real grief," "It turns emotion into a product," "It makes something private/public," "It feels disrespectful to the dead/memory," "It's *using* something sacred." **Key:** Write these phrases visibly (flipchart/whiteboard).
      *   **Question 2 (5 mins):** *"Could paying a close *friend* who genuinely *is* sad to attend and cry formally make it feel *less* 'off'? Why/Why not?"* (Highlights it's about the *nature of the thing* and the *transaction*, not just strangers).
      *   **Why this order & example:** Isolates the core "commodification discomfort" without ethical red herrings. Forces them to articulate the *feeling* before the theory. The "friend" question subtly introduces the "sacred boundary" idea.

  3.  **The Core Idea: Shifting Spheres (10 mins)**
      *   **Reframe their points (3 mins):** Point to their phrases on the board. *"So, the discomfort comes when we move something from... let's call it the 'Sphere of Sacred Things' (grief, love, loyalty, the body itself?) into the 'Sphere of Market Exchange'. It feels like a category error. Like paying your child for a hug. The money doesn't just compensate; it *transforms* the meaning. It turns the thing from an 'end in itself' (valued inherently) into a 'means to an end' (valued instrumentally, for cash)."*
      *   **The Psychology Punch (2 mins):** *"And this isn't just 'ick'. Studies show when you put a price on things people hold sacred – like a national flag, a grave, *an organ* – they don't just disagree, they feel *moral outrage*. They want to punish the person who set the price, even if it was hypothetical! It triggers a deep, almost physical, sense of violation."* (Cite: "Sacred Value Protection" research, e.g., Tetlock, Fiske & Tetlock).
      *   **Define Commodification (Simply) (5 mins):** *"So, 'commodification' is this *process*: taking something not normally treated as a pure economic good and turning it into one – putting it up for sale, attaching a price tag, making it subject to market logic. The 'Can You Sell That?' itch is the friction when that process grates against our sense of the sacred."*
      *   **Why this order:** Builds directly *from* their own words and feelings. The psychology validates their intuition. The definition comes *last*, as a label for what they've already explored.

  4.  **Tackling Misconceptions (Head-On & Fast) (15 mins)** *(Order based on likely emergence)*
      *   **#1: "So you're against ALL markets then?"** (Likely after Sphere of Sacred vs Market)
          *   *Response:* "**No!** Markets are brilliant for *lots* of things – potatoes, widgets, haircuts. This is about *specific boundaries*. Some things lose value or meaning, or cause harm *because* of that transformation, *even if* the immediate transaction seems fair. It's not anti-market, it's about *what belongs where*."
      *   **#2: "It's just 'ick'! If both benefit, get over it."** (Likely during/after Mourners)
          *   *Response:* "**Is it *just* 'ick'?** Remember the psychology – it's moral outrage, not just distaste. And *why* does that 'ick' arise so strongly for some things and not others? What does that 'ick' *protect*? Dismissing it as *just* ick ignores the powerful social and personal meaning it points to."
      *   **#3: "The real problem is she's poor! It's exploitation, not commodification."** (Likely when circling back to Kidneys)
          *   *Response:* "**Absolutely, exploitation is a huge, often *overwhelming* problem here!** Poverty can force people into awful choices. But let's separate the layers: 1. The injustice of the poverty/debt forcing the choice (Exploitation). 2. The specific *act* of selling a kidney *itself* causing discomfort *even if* she wasn't poor (Commodification). Does the kidney sale *by a wealthy person* purely for profit *also* feel wrong? Why? That's the commodification itch beneath the exploitation." (This is KEY for your subplot!).
      *   **#4: "But we pay surgeons! What's the difference?"** (Guaranteed)
          *   *Response:* "**Great point!** We pay for the surgeon's *skill, time, and labour* in performing a service *related* to the kidney. We generally *don't* pay for the kidney *itself* as a standalone object. Paying for the *service* of transplanting a donated organ feels different to paying for the organ *as a commodity*. The boundary often lies between the *thing* and the *labour/service* around it."
      *   **Why this order & approach:** Addresses them as they naturally bubble up, using their language. Acknowledge validity (#3!), then separate the layers. Be clear and firm.

  5.  **Kidneys Revisited: Layering It On (5 mins)**
      *   *"So, back to my kidney seller. The exploitation – the poverty, the desperation – that's the screaming siren. It's horrific and probably the dominant wrong. But *beneath* that, adding to the wrongness, is the commodification itch: putting a price tag on a piece of a living human body, something we intuitively place in the 'Sphere of the Sacred'. It transforms the body from 'person' to 'inventory'. The professional mourner shows us that itch can exist even without exploitation. Here, they compound each other."*

  6.  **What We're Leaving Out (Plainly Stated) (2 mins)**
      *   *"We're leaving out:* Complex economic theories of value, detailed policy debates on organ markets, *all* potential solutions. We're *only* focusing on understanding the *source* of that initial 'this feels wrong' sensation – the commodification friction. Not the solutions... yet."

  7.  **The Landing Question (3 mins)**
      *   *"Don't tell me *what* you think is commodifiable or not. Tell me this:*
          *   **What's the one thing *you personally* could never put a price on, even if everyone involved consented freely, without exploitation, and genuinely benefited? What makes that thing feel so different from selling your old sofa?"***
      *   **Why this works:** It bypasses intellectual agreement and targets personal, intuitive sacredness. If they name things like "my child's love," "my grandmother's final letter," "my personal integrity," "a vow," "citizenship," "a vote," "a specific memory," "a religious relic" – the idea has landed. They're identifying their own boundaries. If they say "nothing, everything has a price if the deal is good," you know it hasn't clicked (but unlikely in this group!).

  **British English Throughout:** Sorted. "Queue," "Sceptical," "Labour," "Organisation," "Grey area," "Whilst" (sparingly!), "Rubbish" (if dismissing a weak point).

  **Why This Structure Works for Novelists & Poets:**
  1.  **Starts with Story (Your Grudge):** Immediately hooks their narrative brains.
  2.  **Uses Vivid Scene (Mourners):** Provides concrete, emotionally resonant material to chew on.
  3.  **Builds from Feeling to Concept:** They articulate the discomfort *first*, you label it *after*.
  4.  **Validates Intuition (Psychology):** Shows their "ick" is a recognised, studied phenomenon.
  5.  **Addresses Grudges Head-On:** Meets their anticipated counter-arguments directly and practically.
  6.  **Ends with Personal Reflection:** Taps into their individual sense of the sacred, making it relevant to *them* and their own work.
  7.  **Leaves Theory Implicit:** The concepts ("Spheres," "Commodification") emerge *from* the discussion, not precede it.

  **Stick with the Mourners.** They are the scalpel that cleanly dissects the commodification itch. Kidneys are the messy, real-world wound where that itch gets infected by exploitation – but you need to understand the itch itself first. Good luck – this sounds like a brilliant session!
