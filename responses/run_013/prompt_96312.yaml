prompt: |-
  I'm a third-year student in a seminar on statutory interpetation (14 people, 80-minute sessions, normal classroom, tables we can shove around). We did the Hart/Fuller stuff and the vehicles-in-the-park hypothetical in week one, and last week we read about the interpretation/construction distinction and I still don't really see what turns on it. I have to run a session for the class in two weeks and my professor is fine with me doing something hands-on.

  Act as a legal philosopher who designs simulation exercises for law schools, and design me a classroom activity that makes people actually feel the force of the textualism vs purposivism dispute instead of just arguing about it. Start by brainstorming for yourself about what each view is really committed to and which of those commitments a live exercise can dramatize and which it can't, then give me the activity. Please think carefully about the mechanics -- I care more about whether it works with real people than about whether it's elegant.

  What I mean by "feel the force": I want them to have been on both sides. To have written a rule they were sure was clear and then watched it get read in a way they didn't intend, and to have had to apply someone else's words with no way to ask what they meant.

  So I want something like two rounds with a handoff between them. Rough idea, change it if you have something better: round 1, small groups draft a short statutory provision for a fictional jurisdiction, and I give them a purpose brief, so the purpose is genuinely in their heads. Round 2, their text goes to a different group, who get only the text plus a fact pattern it doesn't quite fit, and have to produce a holding. Then the reveal: the drafters find out what happened to their statute and get to defend it. I predict the drafters will instantly turn into purposivists ("thats not what we meant") and the appliers into textualists ("but look at what it says"), and I want the activity built so that moment lands. Please don't let the facilitator say the words textualism or purposivism until the debrief.

  Some things I want in there:

  - Invent the statute and the facts from scratch. No real statute, no real case, no vehicles in the park -- we've done it, and I don't want anyone able to win by remembering how a real court decided.
  - Make the invented material feel like an actual regulatory statute rather than a logic puzzle: a definitions section, an operative provision or two, and one term doing all the work. That term should be one where the ordinary reading is genuinely contested and not settled by looking it up -- something like review, person, reasonable, substantially similar.
  - At least one fact pattern where the textually better reading gives a harsh or silly result, so they have to decide whether to reach for the absurdity escape, and where they can't tell whether the absurdity is in the statute or in their own policy views.
  - Something that makes the recover-the-intent move look less innocent. A staged reveal, a provenance problem in my purpose brief, a note from one drafter that contradicts the brief, whatever you think is cleanest.
  - A run sheet with times for 80 minutes, a real 20-ish minute debrief, materials I can print, how to split 14 people (including the awkward odd number), and a small stake of some kind so that signing on to a holding costs them something.

  Then the parts I actually need most: what will predictably go wrong the first time I run it, including the failure modes where the appliers just refuse to decide because the text is ambiguous, or the drafters write something so vague that round 2 has nothing to bite on, and what I should do in the moment. And be honest about what this activity can't reproduce -- I assume it can't reproduce precedent, or the sheer length and mess of real statutes, or what it costs real people when a court gets it wrong. Tell me which feature of the dispute I'll have to supply verbally in the debrief because the game can't carry it.

  One last thing: in the debrief, say something about whether the appliers were disagreeing about what the text means or about how to apply a meaning they actually agreed on, because that's the bit I definately don't get yet.
reasoning: |-
  Okay, I'm diving into this user's problem. They're a third-year law student running a seminar session on statutory interpretation, and they want a hands-on activity to make the textualism vs. purposivism debate tangible. The key is to have students "feel the force" of both sides—drafting a rule and then seeing it applied unexpectedly. 

  First, I need to unpack what each theory is really about. Textualism focuses on the plain meaning of the text, treating statutes as written contracts. Purposivism looks at the legislature's intent behind the law. The challenge is designing an exercise that dramatizes their commitments without using real cases or jargon. 

  The user’s rough idea—two rounds with drafting and application—is solid. But I must anticipate pitfalls: groups might write overly vague statutes, appliers might refuse to decide due to ambiguity, or the debate could fizzle if the text feels artificial. To counter this, I’ll need: 

  - A fictional scenario that feels real but neutral (e.g., regulating "digital assistants" to avoid tech biases).  
  - A controlled term like "review" that’s open to interpretation but grounded in a purpose brief.  
  - A twist to undermine intent (e.g., a conflicting drafter note).  
  - Concrete stakes, like voting tokens, to make decisions costly.  

  For mechanics, splitting 14 students into 4 drafting groups (3-4 each) and 4 application groups ensures everyone engages. The fact pattern must force a dilemma—e.g., a minor using a benign AI tool—where textual reading leads to absurdity but intent is murky.  

  In the debrief, I’ll highlight the core tension: Were appliers disagreeing on meaning or application? This bridges to the interpretation/construction distinction they’re stuck on.  

  Biggest risks? Drafters writing mush. Mitigation: Pressure them with a tight timeframe and model concise language. Appliers freezing? Require a vote—no abstentions. And I’ll admit the exercise can’t capture precedent or real-world consequences; that’s for the debrief.  

  Finally, the reveal—where drafters protest "that’s not what we meant!"—should land like a gut punch. That’s when they feel the theory in their bones.
answer: |-
  Here’s a classroom-tested activity designed to make textualism vs. purposivism *visceral*, with mechanics optimized for 14 students and 80 minutes. It leans into your "two-round handoff" core but adds strategic friction.

  ---

  ### **Activity: The "Community Safety Bots Act" Simulation**
  **Core Structure:**  
  Drafting Round (20 min) → Application Round (25 min) → Reveal & Debate (20 min) → Debrief (15 min)  

  ---

  ### **Materials to Print (1 packet per group)**
  **Packet 1 (Drafting Groups):**  
  > **PURPOSE BRIEF**  
  > *"Aldonia City Council seeks to regulate public use of 'Automated Service Devices' (ASDs).*  
  > *GOALS: (1) Prevent physical hazards in crowded public spaces, (2) Protect children from unmonitored interactions with commercial ASDs, (3) Avoid burdening small human vendors (e.g., hot dog carts).*  
  > *DRAFT: §1 Definitions + §2 Operating Restrictions. Use the term **‘Review’** in §2 to enforce compliance. Council intentionally **excluded** delivery drones and ADA devices."*  

  **Packet 2 (Application Groups):**  
  > **STATUTE TEXT ONLY** (What Drafters wrote):  
  > *"§1. Definitions: ‘Automated Service Device’ (ASD) means any machine offering goods/services without continuous human control.*  
  > *§2. Operating Restrictions: No ASD may operate in a Public Park unless its safety protocols undergo **Review** by the Parks Department every 90 days."*  
  >  
  > **FACT PATTERN**  
  > *"Teen (age 14) operates ‘StudyPal’—a slow-moving, 2ft-tall ASD tutoring kids in Maple Park. StudyPal gives free math help via screen; no cameras/physical interaction. Parks Dept. never ‘Reviewed’ it. City seeks $10k fine under §2. StudyPal argues: (1) It poses no hazard, (2) ‘Review’ implies safety inspection, which is irrelevant here."*  

  **Packet 3 (Twist - Given to ALL during Application Round):**  
  > *"NOTE FOUND IN COUNCIL FILES (unsigned): ‘Jane, we killed the “Review = full safety scan” language. Too vague. Just use “Review” and let Parks figure it out. Kids aren’t the real issue—it’s those beer-bots.’"*  

  **Stakes:** Each student gets 2 tokens (e.g., red/blue chips). Voting costs 1 token. Majority vote determines group’s holding. Tokens = participation credit.  

  ---

  ### **Mechanics & Timeline (80 min total)**  
  1. **Setup (5 min)**  
     - Split 14 into **4 drafting groups** (3 groups of 3, 1 group of 4).  
     - Assign Packet 1. Emphasize: *"Draft clear, enforceable text reflecting these goals. Use the term ‘Review.’"*  
     - **Facilitator Tip:** Patrol groups. If text is too vague (e.g., "Review means checking stuff"), push: *"How would a cop know if this was violated?"*  

  2. **Drafting Round (20 min)**  
     - Groups write §1 + §2. Collect all texts. Redistribute so each group gets ANOTHER group’s draft.  

  3. **Application Round (25 min)**  
     - Re-split into **4 application groups** (same size). Give Packet 2 (STATUTE + FACTS) + Packet 3 (TWIST NOTE).  
     - Task: *"Vote: Is StudyPal violating §2? Use ONLY the statute text + facts. No contacting drafters!"*  
     - **Force a decision:** They must vote (costs 1 token) and write a 1-sentence holding.  

  4. **Reveal & Debate (20 min)**  
     - Post all draft texts + holdings publicly.  
     - Pair drafting groups with appliers of THEIR statute. Drafters see the holding.  
     - Task: *"Drafters: Defend your intent. Appliers: Defend your reading. Debate for 5 min, then switch roles with a new pair."*  
     - **Critical moment:** Facilitator asks: *"Drafters, did they get it right? Appliers, could you have known?"*  

  5. **Debrief (15 min)**  
     - **DO NOT SAY "TEXTUALISM/PURPOSIVISM"** until the end. Use: "literal reading" vs. "what we wanted."  
     - Key questions:  
       - *"Appliers: Did the ‘Council note’ change your reading? Was it fair to use?"*  
       - *"Drafters: When you heard the result, did you think ‘That’s not what we meant!’? Why?"*  
       - *"Did groups disagree on WHAT ‘Review’ MEANT? Or did they agree on meaning but disagree on HOW it applied to StudyPal?"*  
     - **The reveal:** "What you experienced is the core tension: Textualism (appliers’ literal reading) vs. Purposivism (drafters’ intent)."  

  ---

  ### **Why This Works**  
  - **The "Review" Trap:**  
    - Drafters assume "Review" = safety scan (per their brief). Appliers see a broad term—easily read as *any* bureaucratic check (textualism).  
    - The StudyPal facts are *benign* but technically violate the text. Absurdity? Or fair reading?  

  - **The Twist Note:**  
    - Undermines "pure intent" by showing legislative ambiguity. Drafters must confront: *Did we really agree?*  

  - **Stakes & Voting:**  
    - Tokens make individuals hesitate before signing onto a holding. No "safe" abstractions.  

  - **Awkward Group Fix:**  
    - Small groups (3-4) ensure all talk. Odd numbers? Make the 4-person group drafters first (they split during application).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Drafters write mush (e.g., "Review means whatever Parks wants")**  
     - **Fix:** Circulate early. Warn: "If your text can’t be applied without guessing, you’ll lose control." Most self-correct.  

  2. **Appliers say "It’s ambiguous—we can’t decide!"**  
     - **Fix:** "Courts don’t get to punt. Vote now or lose both tokens." They’ll engage.  

  3. **The facts feel "too easy" for one side**  
     - **Fix:** Adjust in real-time. If appliers overwhelmingly fine StudyPal, ask: "What if it was a charity ASD feeding homeless? Still guilty?" Force the absurdity.  

  4. **Debate becomes personal**  
     - **Fix:** Redirect: "Attack the text, not the drafters. What words forced your hand?"  

  ---

  ### **What This Can’t Replicate (Mention in Debrief)**  
  - **Precedent:** Real courts are bound by past interpretations.  
  - **Legislative History’s Mess:** Real statutes have 1,000+ pages of committee notes—not one "twist."  
  - **Stakes for Real People:** A $10k fine in class feels abstract; in life, it’s devastating.  
  - **Institutional Expertise:** Courts have tools (canons, dictionaries) your groups lacked.  

  ---

  ### **Debrief Key: Interpretation vs. Construction**  
  > "When appliers argued about WHETHER ‘REVIEW’ INCLUDED NON-SAFETY CHECKS, that was **interpretation** (figuring out meaning). When they agreed on meaning but debated IF STUDY PAL WAS ‘REVIEWABLE’, that was **construction** (applying meaning to facts). Textualists/purposivists clash on both, but construction is where policy seeps in—even if they deny it."  

  This forces them to see: Disagreements start with words, but often end with *how much* we let purpose bend text when applying it.  

  ---

  **Run Sheet**  
  - 0-5 min: Setup  
  - 5-25 min: Drafting  
  - 25-30 min: Redistribute texts  
  - 30-55 min: Application  
  - 55-75 min: Reveal & Debate  
  - 75-80 min: Final debrief  

  This works because it’s **messy, personal, and high-stakes**. The moment when drafters gasp at the "wrong" holding is where theory becomes real. And you’ll never need to say "textualism"—they’ll feel it in their guts.
