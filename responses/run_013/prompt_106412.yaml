prompt: |-
  I hold a view about interpersonal utility comparisons and want a map of its exposure.

  The view: comparisons of welfare between persons are meaningful — there is a fact of the matter about whether A is worse off than B — but their meaningfulness does not consist in the existence of a shared psychological scale of intensity. Rather, a comparative claim is meaningful to the extent that it does work in a decision. It is meaningful when adopting it changes which option some specified decision rule selects; it is idle, and neither true nor false in any sense worth caring about, when every admissible decision rule would select the same option however the comparison came out. On this account the familiar apparatus of cardinal scales, unit comparability, level comparability, and the rest is bookkeeping: its job is to keep track of which comparisons are load-bearing, not to tell us how much comparability we actually have. The long-running dispute over whether we possess more or less than ordinal comparability is, on this view, largely a dispute about notation.

  What I want from you:

  1. What would count against this? Separate what would be decisive from what would be merely awkward, and be explicit about the difference.

  2. Which objections would a defender of the view concede as counting against it, as opposed to those only critics press? I care about the gap between concessions the view is forced to make and ones it merely invites.

  3. Does the view collapse into a rival? In particular, say whether the criterion can be run without already presupposing the comparisons it claims to vindicate. If the decision rule must itself be specified in welfare terms, it begins to look as though the account is circular, or else reduces to the view that comparisons are conventions adopted for the sake of a chosen aggregation rule. If that is what it comes to, say so plainly rather than softening it.

  4. Is the view falsifiable, or has it been insulated? Identify any qualifications that would immunize it, and say whether they are legitimate or evasive.

  5. Close with what would change your own verdict: which argument or consideration would move you from your assessment, and where your reasoning is most likely to fail.

  Argue from the structure of the problem and from cases rather than from the literature; I do not need citations. The argument I would personally find most persuasive is one that identifies a concrete decision problem in which a comparison is ineliminable — where no paraphrase avoids it and no admissible rule is indifferent to how it comes out.
reasoning: |-
  Okay, let me start by unpacking the user's view. They believe interpersonal utility comparisons are meaningful only when they affect decisions. The core idea is that if a comparison doesn't change the outcome of a decision, it's not worth considering. They want a critical analysis focusing on concrete problems and objections.

  First, I need to address what counts against this view. The user asked for decisive versus awkward objections. A decisive one would be a scenario where the comparison is necessary, and no decision rule can avoid it. I recall Arrow's theorem and cases involving equality or fairness. For example, distributing a good between two people where efficiency alone doesn't resolve it. If both options are Pareto optimal, but one is more equal, the comparison becomes ineliminable. That seems like a strong counterexample.

  Next, the defender's concessions. They might admit that in cases with multiple Pareto-optimal options, comparisons are needed. But they could argue that such situations are rare or that the decision rule can be adjusted. The user wants to know if these concessions weaken the view. The defender might also say that adopting a rule like maximin presupposes comparisons, leading to circularity.

  Collapse into a rival view? If the decision rules (like maximin) require prior comparisons to define welfare, then the view might reduce to conventionalism. The user is concerned about circularity here. If specifying the rule already assumes comparability, then the view isn't providing a foundation but rather a pragmatic approach.

  Falsifiability is tricky. The view can be immunized by saying any situation where comparisons matter has an applicable decision rule. But if we find a case where all rules require comparison, that falsifies it. The equality case might be such a scenario. The user wants to know if qualifications are legitimate or evasive.

  Finally, what would change my assessment? If someone shows a decision problem where every rule depends on the comparison, and no non-comparative rule works, that would be decisive. My reasoning might fail in assuming that all contexts have decision rules that avoid comparisons. The equality example challenges that assumption.

  I should structure the response around these points, using concrete examples. The user emphasized cases over literature, so focusing on scenarios like distributing a good between two people. Also, addressing the circularity concern with decision rules like maximin requiring interpersonal comparisons to define the "worst-off." That seems critical.
answer: |-
  Here’s a critical map of your view, structured around your queries. I’ll proceed analytically, using concrete cases to test the boundaries of the position.

  ---

  ### **1. What Would Count Against This View?**  
  **Decisive objections** (fatal if true):  
  - **The Equality Problem**: Suppose you must divide a fixed resource (e.g., 10 units of water) between two people (A and B) in a desert. Both are identically situated (same physiology, needs, etc.), but you have no data on their subjective states. Pareto efficiency alone is silent (giving all water to A or B is equally efficient). Any distribution (9:1, 5:5, etc.) is Pareto-optimal if the recipient doesn’t waste it. Yet, most decision rules (e.g., maximin, equality-promoting) *require* asserting that A is worse off than B if A receives less. **If no rule can resolve this without implicitly asserting a comparison**, your view collapses. The comparison is ineliminable and not merely "bookkeeping."  
    - **Why decisive?** It shows comparisons can be load-bearing even when no psychological scale exists and no decision rule is indifferent. Denying comparability here forces arbitrary choice, violating rational decision-making.  

  - **Rule Selection Requires Comparisons**: If you must choose between decision rules (e.g., utilitarianism vs. maximin), the choice often presupposes comparisons. For example, maximin prioritizes the "worst off," but identifying who is "worst off" requires a prior comparison. **If your account cannot specify rules without smuggling in comparisons**, it is circular.  

  **Merely awkward objections** (challenging but surmountable):  
  - **Indeterminacy in Symmetric Cases**: Two patients need a life-saving drug; both have identical medical histories and express identical distress. Giving the drug to either is symmetric. Your view might say the comparison is idle (no rule distinguishes them), but this clashes with the intuition that *someone* is objectively worse off if deprived. However, you can dismiss this as "noise" – no decision is affected.  
  - **Epistemic Limitations**: When comparisons seem meaningful but lack decision-making traction (e.g., comparing historical figures’ suffering). Your view labels this "idle," which is awkward if we feel such comparisons are truth-apt, but not fatal.  

  ---

  ### **2. Which Objections Would a Defender Concede?**  
  A defender would **concede** that:  
  - In cases with **multiple Pareto-optimal outcomes** (like the water division), comparisons are pragmatically necessary for rule application.  
  - **Rule specification** often *begins* with comparative assumptions (e.g., maximin’s focus on the "worst off" requires comparability).  

  But they would **reject** critics’ claims that this:  
  - Validates psychological scales (the "work" is in the decision, not the ontology).  
  - Undermines the core claim (comparisons remain decision-relative, not freestanding facts).  

  **The gap**: Concessions show the view is **pragmatically constrained** but not ontologically empty. Critics see this as a retreat; defenders see it as clarifying the stakes.  

  ---

  ### **3. Does It Collapse into a Rival?**  
  **Yes, into conventionalism or circularity** – but this is explicit, not softened.  

  - **Circularity Threat**: If a decision rule (e.g., utilitarianism) requires summing welfare, but welfare is *defined* by the rule’s output, the account is circular. Your view escapes this *only* if rules are selected independently of welfare comparisons (e.g., via procedural fairness). Yet rules like maximin *directly* presuppose comparability.  
  - **Collapse into Conventionalism**: The view reduces to: *"Comparisons are real only as conventions adopted to serve chosen decision rules."* This is consistent with your "bookkeeping" metaphor but abandons realism about interpersonal facts.  

  **Verdict**: Your view is **explicitly conventionalist**. It denies freestanding comparative facts and makes them artifacts of decision procedures. This isn’t a bug – it’s the thesis.  

  ---

  ### **4. Is the View Falsifiable?**  
  **Yes, but it risks evasion via immunizing maneuvers**:  
  - **Falsifiable scenario**: A decision problem where:  
    - (a) All admissible rules require a comparison;  
    - (b) No non-comparative paraphrase exists;  
    - (c) The comparison isn’t traceable to a rule’s bookkeeping.  
    The **water division case** above satisfies (a) and (b). If you deny (c) by claiming rules "generate" comparisons, you immunize the view.  

  - **Immunizing qualifications**:  
    - "Admissible rules exclude those requiring comparisons" → **Evasive** (changes the subject).  
    - "Idle comparisons are still *potentially* meaningful" → **Evasive** (retreats to possibilia).  
    - "Rules are chosen pre-comparatively" → **Legitimate** if rules are selected procedurally (e.g., impartiality), but risks circularity (as above).  

  ---

  ### **5. What Would Change My Verdict?**  
  **Your strongest argument**: The water division case. If you can resolve it without comparisons (e.g., via randomization), I’d retreat. But if randomization is seen as *avoiding* the comparison rather than resolving it, the objection stands.  

  **Where my reasoning is most vulnerable**:  
  - I assume **rational decision rules must break ties** in symmetric cases. If you argue that *no rule is rationally required* in such cases (e.g., flipping a coin isn’t a "decision rule" in your sense), the equality problem weakens.  
  - I presuppose that **"work in a decision" implies altering the outcome**. If you define "work" broadly (e.g., justifying the rule itself), comparisons become omnipresent, hollowing out your distinction.  

  **What would move me**: A demonstration that **all apparently ineliminable comparisons** (e.g., "A is worse off than B") can be replaced by **conditional directives** (e.g., "If you prioritize the worst off, choose X") *without loss*. This would vindicate your bookkeeping claim.  

  ---

  ### **Conclusion**  
  Your view is a defensible **pragmatic conventionalism**: comparisons are "real" only when embedded in decision rules. Its Achilles’ heel is **symmetrical distribution problems**, where no rule applies without comparisons. If those cases can be resolved non-comparatively (e.g., via randomization or procedural defaults), the view holds; if not, it fails. The circularity worry is real but intrinsic to the conventionalist stance.
