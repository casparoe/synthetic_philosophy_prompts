prompt: |-
  I'm a backend engineer — twelve years, mostly payments and internal platform stuff, Go and Python, a lot of time spent in old services nobody wants to touch — and I've never studied law or philosphy beyond one undergrad elective I mainly remember as being about trolleys. My flatmate is a 2L and keeps dragging me into arguements about textualism versus purposivism in statutory interpretation, and every time she does I get this strong feeling that it's just the fight I have at work over whether the source code is the spec or the author's intent is. The toy example we keep circling is a state statute that criminalises "using an electronic device to record another person in a place where they have a reasonable expectation of privacy" and whether a smart doorbell pointed at the shared hallway counts. I want to know whether my feeling is right or whether I'm missing something big.

  So: take the textualism/purposivism debate — what a statute means, how a judge should decide a hard case where the words and the apparent point of the law come apart — and restate it as faithfully as you can in the vocabulary I actually use. Enacted text as source code; legislative history as commit messages, PR descriptions, the Jira ticket, and the comment above the function saying it's there for legacy reasons and not to remove it; the plain-meaning rule as reading the code at face value instead of trusting the docstring; purposivism as trying to recover what the feature was for when the ticket is ambiguous; the reference implementation; the regression suite; backwards compatibility with clients who already depend on undocumented behaviour; the gap between what the interpreter/compiler actually does and what a human reader thinks the code says; semver and deprecation policy as something like precedent. Do it as a systematic translation, side by side, not as an analogy you're using to win a point — I want to see where it holds and where it's straining.

  Then the part I actually care about: the residue report. Which claims in the lawyers' debate map cleanly onto something in my vocabulary, which ones only map with distortion, and which have no counterpart at all. And for whatever's left over, tell me whether that's because my framework is genuinely missing something or because the legal disagreement is less substantive than it looks and the residue is just institutional noise. My working hypothesis is that it's all "the code is the spec" plus some politics, so I'd especially like you to argue the other side properly — don't let the translation quietly assume my framing and then congratulate me on it. Concretely: if there's something real in the idea of authority, or in who is permitted to bind whom, or in the thought that a judge is a participant in the system rather than a reader of it, and that has no honest equivalent in how we treat code, say so and say why.
reasoning: |-
  Okay, the user is a backend engineer with 12 years of experience, mostly in payments and internal platforms using Go and Python. They've been roped into debates with their flatmate, a law student, about textualism vs. purposivism in statutory interpretation. They see parallels to software development—like whether the source code is the spec or if the author's intent matters. Their example is a law about recording devices in private spaces and whether a smart doorbell in a shared hallway violates it.

  They want a faithful translation of legal concepts into software terms, not just an analogy to win an argument. They’re looking for a side-by-side mapping and a residue report on what doesn’t translate well. Their hypothesis is that it’s all "the code is the spec" plus politics, but they want me to challenge that and explore any gaps, especially around authority, binding power, or the judge’s role.

  First, I need to map textualism and purposivism to software concepts. Textualism is like treating the source code as the ultimate truth—ignore comments and docs, focus on what the compiler does. Purposivism is like looking at commit messages or Jira tickets to understand the intent behind a feature. 

  For the residue: Authority is a big one. In law, judges are bound by the constitution and the legislature’s authority. In software, engineers can change the code, but judges can’t rewrite laws. That’s a key difference. Also, precedent is like semver but with more rigidity. Stare decisis means past decisions bind future ones, whereas in software, you can deprecate and change APIs more freely.

  Another point is the concept of "reasonable expectation of privacy" in law vs. undefined behavior in code. In law, standards evolve with societal norms, which is different from software where behavior is fixed unless updated. The legal system has institutional roles—judges interpret, legislatures write laws—which isn’t mirrored in most dev teams.

  The user might be missing how legal interpretation involves multiple stakeholders with competing interests, whereas software is more hierarchical. Also, the binding nature of judicial decisions creates a web of dependencies that’s harder to change than code. The residue isn’t just noise; it’s about legitimate authority and systemic roles that don’t exist in software development. They need to recognize that law’s structure imposes constraints that don’t have direct parallels in coding.
answer: |-
  Here's a systematic translation of the textualism/purposivism debate into software engineering terms, followed by a residue report highlighting where the analogy strains or breaks. I'll deliberately challenge the "code is the spec" framing where law differs substantively.

  **Translation Table: Legal Concepts ⇨ Software Engineering Concepts**

  | Legal Concept                | Software Engineering Translation                                                                 | Notes on Fidelity                                                                                                |
  | :--------------------------- | :----------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **Enacted Statute (Text)**   | **Source Code (Committed/Merged)**                                                               | The authoritative, executable artifact. What the compiler/runtime actually processes.                            |
  | **Legislative Intent**       | **Author/Team Intent (PR Descriptions, Commit Messages, Jira Tickets, Slack Threads)**          | Context about *why* the code was written, its goals, and the problem it solved.                                  |
  | **Legislative History**      | **Version Control History (Commits, PRs, Tickets, Meeting Notes)**                               | The record of changes, discussions, and decisions leading to the current codebase.                               |
  | **Statutory Purpose**        | **Feature/System Requirement (Original Ticket, Product Spec, RFC)**                              | The high-level goal the code was intended to achieve.                                                            |
  | **Plain Meaning Rule**       | **"Code is the Spec" + Literal Interpretation by Compiler/Interpreter**                          | Focus on what the code *does* when executed, not what comments/docs *say* it should do. Ignores git history.      |
  | **Textualism**               | **Strict Reliance on Source Code + Compiler Behavior**                                           | Ignores PR descriptions/Jira tickets. Considers only the code's behavior in the current runtime environment.      |
  | **Purposivism**              | **Debugging via PR Descriptions/Jira Tickets + "Spirit of the Feature"**                         | Uses historical context to resolve ambiguities or gaps. Asks: "What problem were they *trying* to solve?"        |
  | **Canons of Construction**   | **Coding Conventions, Linter Rules, Common Design Patterns**                                     | Heuristics for resolving ambiguity, but not hard rules. Can conflict.                                            |
  | **Precedent (Stare Decisis)**| **Regression Test Suite + Semver Policy + Deprecation Cycles**                                   | Past interpretations (test cases) constrain future changes. Breaking changes require major version increments.   |
  | **Ambiguity/Gap in Statute** | **Undefined Behavior, Bug, or Missing Spec**                                                     | The code/runtime behaves unexpectedly or lacks coverage for a specific input.                                    |
  | **Judicial Interpretation**  | **Fixing a Bug/Adding a Feature *Without* Changing Source Code**                                 | The judge *cannot* edit the statute (source). They can only explain what it *does* in this edge case.             |
  | **Legislative Amendment**    | **Deploying a Code/Spec Patch**                                                                  | The only way to *change* the authoritative text/behavior.                                                        |
  | **"Reasonable Person" Std.** | **"Expected Behavior" per Docs/Community Norms**                                                 | How a typical engineer would understand the code's purpose/output, absent esoteric knowledge.                    |

  **Residue Report: What Doesn't Map Cleanly**

  1.  **Authority & Binding Power (The Core Residue):**
      *   **The Gap:** In software, *you can change the source code*. Judges *cannot* change the statute. The legislature is the *only* entity with commit rights to the production branch. Textualism emphasizes this separation of powers: judges are *users* of the code, not maintainers. Purposivism risks letting judges *effectively* patch the code by appealing to intent.
      *   **Why It Matters:** Your "smart doorbell" case isn't just about interpreting old code – it's about whether unelected judges can effectively rewrite a law binding millions, based on inferred intent. In software, if the old service misbehaves, you *can* (eventually) refactor or deprecate it. In law, changing the "code" requires a complex political process. **This difference makes the stakes of interpretation vastly higher and fundamentally political.** Your "code is spec" view downplays this institutional constraint.

  2.  **The "Reasonable Expectation of Privacy" Problem (Dynamic Standards):**
      *   **The Gap:** Concepts like "privacy," "reasonable," or "cruel" are inherently dynamic and societal. They're like an API call (`isReasonableExpectationOfPrivacy(context)`) implemented by a downstream service (*society*) whose behavior evolves over time, not defined solely in the original code.
      *   **Analogy Strain:** While you might have config files or feature flags, legal standards *must* evolve without legislative amendments for every technological shift. Purposivism often explicitly incorporates contemporary norms ("what was the purpose in *today's* context?"). Textualism struggles here, sometimes resorting to "original public meaning" (how the *words* were understood then), which feels like running legacy code verbatim on modern hardware with unpredictable results.

  3.  **Institutional Roles & Legitimacy:**
      *   **The Gap:** Legislatures are (theoretically) democratic and accountable. Courts are (theoretically) expert and independent. The debate isn't just "what does this mean?" but *"who gets to decide what this means, and why are they legitimate?"*
      *   **Software Contrast:** While tech leads or architects have authority, it's usually based on technical merit or hierarchy, not a constitutional separation of powers designed for democratic accountability. The judge isn't just a senior engineer debugging; they are a co-equal branch exercising constrained authority within a specific institutional framework.

  4.  **Precedent as Hard Constraint (vs. Semver as Policy):**
      *   **The Gap:** *Stare decisis* (precedent) is often a near-absolute barrier, far stronger than semver. Overturning precedent is like a major version bump with extreme breaking changes – it causes systemic instability and is avoided unless absolutely necessary. Your regression suite analogy holds for lower courts bound by higher court precedent, but highest courts *can* change precedent, albeit reluctantly. This creates a complex web of dependencies far more rigid than most codebases.
      *   **Residue:** The *institutional weight* of precedent and the *doctrinal* reasons for adhering to it ("reliance interests," "stability of the law") have no direct counterpart in software. Semver is a best practice; precedent is a core structural principle.

  5.  **The "Gap-Filling" Fiction:**
      *   **The Gap:** Both textualists and purposivists claim they are merely "interpreting" existing law, not making new law. But in hard cases (like your doorbell), *there is no pre-existing determinate answer in the text or intent*. The judge *must* choose, effectively creating new binding rules.
      *   **Software Contrast:** When you encounter undefined behavior, you *can* (and must) patch the code or spec. Judges *cannot*. They *must* provide an authoritative answer *now* using interpretive tools, pretending they found it rather than created it. This inherent creative act, masked as discovery, is a unique pressure in law with no clean software equivalent. The argument is *about which mask is more legitimate*.

  **Conclusion: It's Not *Just* "Code is Spec" + Politics**

  Your intuition has strong merit: **the core interpretive dilemma maps remarkably well.** Textualism ≈ Literal code execution + compiler determinism. Purposivism ≈ Debugging via historical context + inferred requirements.

  **However, the significant residue comes from the unique constraints and authorities of the legal system:**

  1.  **Immutability of Source:** Judges can't `git commit`. This makes interpretation the *only* path to adapting old "code," raising the stakes immensely.
  2.  **Dynamic Societal Standards:** Many legal terms delegate to evolving societal norms – a feature, not a bug, but hard to map onto static code.
  3.  **Separation of Powers & Legitimacy:** The debate is fundamentally about *which branch* has the authority to define meaning in edge cases, grounded in constitutional roles, not technical merit.
  4.  **Precedent as Rigid Dependency:** The binding force of past decisions creates a dependency graph far more complex and resistant to change than semver.
  5.  **The Necessity of Creative Gap-Filling:** Judges *must* resolve ambiguities authoritatively *now*, pretending they are merely discovering meaning, while engineers can (eventually) change the source.

  **Your flatmate's debate isn't *just* about logic puzzles or source control philosophy.** It's about **power, legitimacy, and how a society governed by old rules adapts to new realities when changing those rules is politically difficult.** The "code is spec" view captures the engineer's frustration with ambiguity but underweights the constitutional reasons why judges *can't* just `rm -rf` the old service and deploy a new one. The residue isn't noise; it's the core structure of legal authority itself. Your doorbell isn't just an edge case; it's a stress test of institutional design.
