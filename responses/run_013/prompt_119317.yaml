  Then there's the comparison to literature—why an original painting matters but not a novel's original manuscript. They reference Goodman's autographic/allographic distinction. Does Tartt challenge that? Also, the relic psychology point: value tied to provenance, like the murderer's sweater versus an admired person's. And Brandi's restoration ethics: repair without falsifying history. Is Hobie's restoration forgery with permission?

  The user asks for key scenes without quotes. Theo stealing the painting during the bombing is obvious. The times he's hidden it away, especially in the storage unit. The scene where Hobie discusses restoration ethics. The encounter with the copyist in Amsterdam and the fake Goldfinch. And the ending where Theo has his epiphany about the painting's meaning.

  I need to analyze how these scenes show tension between original and fake. For example, Theo's theft makes the painting both relic and stolen object. Hobie's restorations are ethical fakes, but Theo crosses the line. The Amsterdam scene blurs lines between copy and original. The ending suggests the painting's value is in its emotional resonance, not just material authenticity.

