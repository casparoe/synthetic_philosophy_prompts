prompt: |-
  I am in a metaethics reading group this term, and one of the members — an economist who works on monetary policy and is a fairly committed anti-realist about morality — keeps returning to a comparison that I can neither accept nor confidently resist. His line is that moral facts are like the value of money. Money is real enough, he says: it structures almost everything we do, statements about it are straightforwardly true or false, and it is not a matter of anyone's private opinion what a thing costs. And yet it exists only because we collectively treat it as existing, and its standing is not backed by anything that is valuable in itself. On his account the moral realist is in the position of a goldbug who cannot see that even gold's monetary standing was a convention, and who therefore mistakes a particularly stable social arrangement for a mind-independent fact. He uses the comparison to argue that the realism debate is a hangover from a discredited picture of value, that when we call moral judgments objective we can mean no more than we mean when we call an exchange rate objective, and that anti-realism therefore costs us nothing in seriousness or authority.

  What I want from you is an audit of the comparison, not an adjudication of the underlying metaethics. Lay out explicitly what is supposed to map onto what, then tell me where the mapping breaks. I would like the disanalogies separated into the ones that actually bear on the argumentative work he is doing with the analogy and the ones that are merely picturesque, since I suspect most of the ones I can generate on my own are of the second kind and I want to know whether the first kind exists. Tell me what features of the money case the comparison quietly imports into the moral case without arguing for them; tell me what the analogy presupposes rather than establishes — I have a suspicion that whether there is anything playing the role of a gold standard is close to the whole question, and that the comparison answers it by fiat rather than by argument. Show me the ways the comparison can be run in reverse, and say who gets to run each of them and how much damage it does: in particular, whether the fact that money is mind-dependent yet supports objective truths about prices tells in favour of a constructivist middle position rather than against realism as such, in which case the analogy would support something considerably weaker than his conclusion. Then give me a verdict on whether his conclusion survives once the load-bearing disanalogies and the smuggled imports are on the table, and if it does not, what a better analogy would be and what that replacement costs. You can assume I know the standard taxonomy — non-cognitivism, error theory, response-dependence, constructivism — so please do not spend space introducing it.

  Return the whole thing as a single JSON object with exactly these fields. analogy_as_used: the comparison stated in one sentence, in the form in which it is doing argumentative work. intended_conclusion: what he is using it to establish. correspondences: an array of objects, each with source_term (the money side), target_term (the metaethics side), fit (one of exact, close, partial, forced), and note (one sentence of justification). load_bearing_disanalogies: an array of objects, each with feature, on_the_money_side, on_the_morality_side, and effect_on_the_argument (one or two sentences). incidental_disanalogies: an array of strings, each a disanalogy that does not affect his argument, with a clause explaining why it does not. smuggled_imports: an array of strings, each naming a feature of the money case that gets carried over without argument. question_begged: a short string naming what the analogy assumes rather than shows. reverse_runs: an array of objects, each with run (the reversed use of the analogy), who_can_make_it (realist or anti-realist), and damage (one sentence). verdict: an object with conclusion_status (one of survives, survives_in_weakened_form, does_not_survive) and one_paragraph (at most 150 words). better_analogy: an object with candidate, why_better, and new_costs.
reasoning: |-
  We are given a specific analogy: moral facts are like the value of money. The economist uses this to argue that moral realism is unnecessary and that anti-realism can account for the objectivity of moral judgments in the same way that the objectivity of monetary value is accounted for without any mind-independent backing.

  The goal is to audit the analogy without adjudicating the underlying metaethics.

  We must break down the analogy as used, the intended conclusion, the correspondences (with fit and justification), load-bearing disanalogies (that affect the argument), incidental disanalogies (that don't), smuggled imports (features carried over without argument), what question is begged, how the analogy can be run in reverse (by whom and to what effect), and a verdict on the conclusion. Then suggest a better analogy and its costs.

  Let's structure the response as a JSON object with the required fields.

  ### Step 1: Analogy as used
  The analogy is: "Moral facts are like the value of money."

  ### Step 2: Intended conclusion
  The intended conclusion is that moral realism is a mistake, and that anti-realism (specifically, a constructivist or conventionalist view) can account for the objectivity of moral judgments without positing mind-independent moral facts. The realism debate is a hangover from a discredited picture of value.

  ### Step 3: Correspondences
  We need to map the money side to the morality side, with fit (exact, close, partial, forced) and a note.

  Possible correspondences:
  1. **Source: Money's existence and structuring role** → **Target: Moral facts' existence and structuring role**.
     - Fit: Close. Both are real in the sense that they structure behavior and social practices.
     - Note: Both are socially embedded and have a significant impact on human life.

  2. **Source: Statements about money (e.g., prices) are straightforwardly true or false** → **Target: Moral judgments are straightforwardly true or false**.
     - Fit: Close. In both cases, we have truth-apt statements that are objective within the system.

  3. **Source: Money's value is not backed by anything intrinsically valuable (like gold) but by collective agreement** → **Target: Moral facts are not backed by anything mind-independent but by collective agreement**.
     - Fit: Partial. This is the core of the analogy, but the fit is partial because the nature of the collective agreement might be different.

  4. **Source: The value of money is mind-dependent (conventional) but objective** → **Target: Moral facts are mind-dependent (conventional) but objective**.
     - Fit: Partial. The analogy is pushing for this, but it is contested in the moral case.

  ### Step 4: Load-bearing disanalogies
  These are disanalogies that affect the argument. The argument is that because money is conventional yet objective, morality can be too, so realism is unnecessary.

  Key disanalogies:

  1. **Feature: The nature of the collective agreement**
     - On money side: The agreement is explicit, institutionalized, and maintained by centralized authorities (governments, central banks) and legal systems.
     - On morality side: Moral norms are often not the product of explicit agreement and lack centralized enforcement. They emerge from complex social, cultural, and evolutionary processes.
     - Effect on the argument: This disanalogy challenges the transferability of the conventionality of money to morality. The argument assumes that moral conventions are as easily established and maintained as monetary ones, but this is not obviously true.

  2. **Feature: The possibility of error**
     - On money side: Errors in monetary statements are typically due to misreporting or misunderstanding of the current convention. There is no deeper truth to money beyond the convention.
     - On morality side: Realists argue that moral errors are possible even when one is in line with societal norms (e.g., a society might be wrong about slavery). The conventionalist account of money does not allow for such deep error.
     - Effect on the argument: The analogy assumes that moral errors are only deviations from convention, but realists claim that moral errors can occur even when conventions are followed. This disanalogy undercuts the anti-realist's claim to capture moral objectivity.

  3. **Feature: The role of intrinsic value (or lack thereof)**
     - On money side: Money is explicitly a placeholder for value and is not supposed to have intrinsic value (by design in fiat systems). Its value is purely instrumental and relational.
     - On morality side: Realists argue that moral facts, if they exist, are intrinsically prescriptive and not merely instrumental. The analogy assumes without argument that morality is instrumental and relational.
     - Effect on the argument: The analogy smuggles in the idea that morality, like money, is purely instrumental and relational, which is precisely what the realist denies.

  ### Step 5: Incidental disanalogies
  These don't affect the argument because they don't challenge the core claim that objectivity can be conventional.

  Examples:
  1. Money is a human invention with a traceable history, whereas morality may have evolutionary roots. Why incidental? The argument does not depend on the origin but on the current conventional status.
  2. Money is quantifiable and fungible, whereas moral values are not. Why incidental? The analogy is about the conventional basis of objectivity, not about the structure of the domain.
  3. Money can be created and destroyed by authorities, but moral norms are more resistant to change. Why incidental? The argument is about the nature of existence (conventional), not about the mechanisms of change.

  ### Step 6: Smuggled imports
  Features of the money case that are carried over without argument:
  1. The idea that the collective agreement is sufficient for objectivity.
  2. That the only alternative to convention is a "gold standard" (i.e., intrinsic value) and that such a standard is discredited.
  3. That the conventional status of money is uncontroversial and that moral facts, if they exist, would require a similar kind of backing.

  ### Step 7: Question begged
  The analogy assumes that moral facts, if they exist, would require a "backing" analogous to a gold standard, and that without such a backing, they must be conventional. But realists might reject the need for such a backing.

  ### Step 8: Reverse runs
  How the analogy can be run in reverse:

  1. **Run**: Just as the value of money is entirely dependent on human practices and has no existence independent of them, so too are moral facts. But this is just restating the anti-realist position. The realist can run it in reverse by focusing on the objectivity of money as a model for mind-independent moral facts? Wait, that might not work because the objectivity of money is mind-dependent.

     Instead, consider:

     - **Run by realist**: The analogy shows that even in a system that is entirely conventional, we can have objective truths. But that does not imply that moral truths are conventional. In fact, the realist might argue that the objectivity of moral truths is of a different kind because they are not based on convention but on mind-independent facts. Thus, the analogy does not undermine realism but shows that objectivity can come in different forms, and realism might be one of them.
       - Who: Realist.
       - Damage: It severs the link between objectivity and conventionality, showing that the existence of conventional objectivity does not preclude non-conventional objectivity.

     - **Run by constructivist**: The analogy supports constructivism: moral facts, like money, are constructed by human practices but are objective within those practices. This is exactly what the economist wants, so it's not damaging to his position.

     But note: the economist is arguing against realism. The realist can run the analogy in reverse by saying:
       "If money, which is clearly mind-dependent, can give rise to objective truths, then why can't moral facts, which realists take to be mind-independent, also give rise to objective truths? The analogy doesn't show that moral facts are mind-dependent; it only shows that mind-dependence is one way to get objectivity. Therefore, it doesn't refute realism."

     However, the economist's point is that realism is unnecessary because we can get objectivity without mind-independence. The realist's reverse run might be:

       **Run**: The fact that we can have objective truths in a mind-dependent system (like money) does not show that we cannot have objective truths in a mind-independent system (like morality, according to realists). Therefore, the analogy does nothing to undermine realism; it merely shows that there are multiple ways to ground objectivity.
       - Who: Realist.
       - Damage: It neutralizes the analogy by showing that it does not challenge the coherence of realism.

     Alternatively, the realist might argue that the analogy breaks because moral facts, unlike money, are not created by convention. But that is the point at issue.

     Another reverse run by the anti-realist (constructivist) is straightforward and supports their position.

     We should note:

     - **Run by constructivist**: The analogy can be used to support constructivism as a middle position between realism and non-cognitivism/error theory. This is what the economist does.
     - **Run by realist**: The analogy does not show that moral facts are mind-dependent; it only shows that if they were, they could be objective. But that is consistent with realism. So the analogy does not refute realism.

     Damage: The analogy, when run by the realist, shows that it does not force the conclusion that realism is false. It only shows that anti-realism is a possible account. Therefore, the analogy does not establish anti-realism but only its coherence.

  ### Step 9: Verdict
  Conclusion status: The intended conclusion (that anti-realism is correct and realism is a mistake) does not survive. The analogy supports a constructivist position, but it does not refute realism. It shows that objectivity can be conventional, but it does not show that it must be. The core disanalogies (especially about error and the nature of agreement) weaken the transfer of the monetary model to morality. Moreover, the analogy assumes that moral facts, if real, would require a gold-like backing, which realists reject.

  Verdict paragraph (max 150 words): The analogy fails to establish anti-realism. While it effectively illustrates how conventional practices can yield objective truths, it does not prove that morality is such a practice. The disanalogies regarding the nature of collective agreement, the possibility of error beyond convention, and the assumed instrumentalism of morality are load-bearing and prevent the analogy from supporting the economist's conclusion. The analogy remains useful for constructivists, but realists can consistently maintain that moral facts are mind-independent and that the analogy does not challenge their position. The conclusion survives only in a weakened form: it shows that anti-realism can account for moral objectivity, but not that it must.

  ### Step 10: Better analogy
  Candidate: Moral facts are like the rules of a game (e.g., chess). 
  Why better: Game rules are conventional (mind-dependent) but create objective truths (e.g., "White can checkmate in three moves"). They are not backed by anything outside the practice, yet they are binding within it. This captures the social embeddedness and normativity of morality without smuggling in the economic instrumentalism. 
  New costs: The analogy might overemphasize the arbitrariness of rules (whereas morality feels less arbitrary) and may not account for the categorical nature of moral obligations (game obligations are conditional on playing).

  Alternatively, consider language: Moral facts are like linguistic facts (e.g., "In English, 'cat' refers to a feline"). This is conventional but objective within the practice. But similar costs: language is arbitrary and lacks the prescriptive force of morality.

  We'll go with the game analogy.

  ### Now, let's write the JSON.
