  First, I need to verify their map accuracy before diagnosing. The practice view does reduce obligation to social convention, Scanlon centers on expectation-creation with assurance-intent, and Shiffrin-Owens emphasizes normative power transfer. Their description holds up, though I should note where contact occurs: all address obligation-origins, but conflict on whether it's practice-constituted (Hume) vs individual act-generated (Scanlon/Shiffrin). 

  The fatalist case is brilliantly constructed to paralyze all theories. No reliance? Check. No expectation? Check. Practice detached from wronged individual? Check. Only authority-transfer cleanly delivers directed wrong, but as the user suspects, this may be question-begging. My task is to show whether each theory can salvage the case without self-betrayal. Scanlon could retreat to "objective assurance" but loses psychological plausibility; Humeans might invoke practice-internal norms but struggle with direct wronging; authority theorists escape unscathed but pay the price of being ad hoc. 

  For diagnosis: the user's first hypothesis is partly right but incomplete. The core clash is indeed about explananda, but more fundamentally about methodological starting points - whether we begin from phenomenology of being wronged (privileging the fatalist intuition) or from functional accounts of practice (demoting that intuition). Their rival hypothesis about evidence-weight is actually the deeper divider. 

  Progress won't come from new cases but from meta-agreement: either jointly accepting the fatalist intuition as non-negotiable data (forcing theory revisions) or agreeing to bracket it while comparing explanatory power elsewhere. The standoff reflects irreducible tensions in moral philosophy itself - between experience-first and system-first approaches. That's frustrating but philosophically significant. 

  This user deserves honesty: there may be no clean resolution because these theories answer different legitimate questions. The real progress might be recognizing that "why promises bind" isn't one question but three, each with its own criteria for success. That recognition could transform their stalemate from failure to insight.
answer: |-
  ### **The accounts as I have stated them**  
  Your map is largely accurate but requires refinement:  
  - **Humean/practice view**: Obligation arises *solely* from participation in a social convention. The convention defines promising as an act that *inherently* carries obligations, making isolated promises incoherent. The wrong in breaking a promise is primarily *conventional* (a violation of practice rules), with B’s complaint derivative of this breach.  
  - **Scanlon’s expectation view**: Obligation stems from a promisor’s intentional act of inducing *reasonable reliance* by providing "assurance" (not merely predicting behavior). The wrong lies in exploiting B’s trust for assurance, even if B does not *actually* rely. Scanlon’s "Principle F" focuses on the *reasonableness* of expectations created, not their psychological reality.  
  - **Shiffrin/Owens’ authority-transfer view**: Promising involves transferring a normative power—B gains authority over A’s duty, making the obligation *owed to B*. The wrong in breaking a promise is *usurping B’s authority* to decide whether A performs. The practice is incidental; the act itself effects a moral transfer.  

  **Contact/Conflict**:  
  - All agree promises generate obligations but disagree on the *source* (practice vs. individual act vs. normative transfer).  
  - Humeans conflict with Scanlon/Shiffrin on whether obligations *require* a social practice. Scanlon and Shiffrin both reject this but diverge on whether obligation arises from expectations (Scanlon) or authority-transfer (Shiffrin).  
  - **Key conflict**: Scanlon and Shiffrin agree obligations are directed to B, but Scanlon grounds this in assurance-based expectations, while Shiffrin grounds it in transferred control.  

  ---

  ### **Diagnosis**  
  Your hypothesis is **partly right** but incomplete; the rival hypothesis is **more fundamental**.  

  1. **Difference in explanandum**: You correctly identify that each theory answers a distinct question:  
     - Hume: *How do social practices generate obligations?*  
     - Scanlon: *What moral wrong occurs when we create expectations?*  
     - Shiffrin: *What relational change does promising effect?*  
     This creates cross-talk: Humeans see Shiffrin as ignoring institutional reality; Shiffrin sees Humeans as missing the interpersonal wrong.  

  2. **Evidential priority is the core divide**:  
     - **Pro-intuition**: Scanlon and Shiffrin treat the fatalist case as non-negotiable data. If their theories cannot explain A wronging B without expectation/reliance, they must adapt or concede.  
     - **Anti-intuition**: Humeans (or practice-centric theorists) view the fatalist case as a distorted outlier. For them, intuitions from *actual* practice are primary; isolated promises are parasitic on conventions and thus irrelevant.  

  3. **Substantive conflict persists**:  
     - Even if explananda align, theories clash on whether obligation *must* be practice-mediated (Hume vs. others) and whether directed duties require control-transfer (Shiffrin) or assurance (Scanlon).  

  **Verdict**: The rival hypothesis dominates. The group’s stalemate arises because **disagreement about evidentiary weight drives methodological divergence**. Humeans dismiss intuitions about "isolated" promises; others treat them as decisive. This determines whether the fatalist case is a puzzle to solve (Scanlon/Shiffrin) or a distraction (Hume).  

  ---

  ### **The case, re-examined**  
  The case *appears* discriminatory but each view can assimilate it—**at a cost**:  

  - **Scanlon**: Adjusts by emphasizing *assurance-intent* over actual expectation. A wrongs B by *attempting* to assume an obligation, creating a normative claim regardless of B’s fatalism. **Cost**: Weakens the link to real-world reliance, making "assurance" abstract and potentially circular.  
  - **Humean**: Argues the practice *itself* obligates A, and B’s complaint is institutional (like a referee wronged by a rule-break). **Cost**: Severs the obligation from B’s status as promisee; B’s complaint becomes impersonal.  
  - **Shiffrin/Owens**: Absorbs the case cleanly: A transferred decision-rights to B, so breaking the promise violates B’s authority. **Cost**: Invites charges of rigging—the theory defines promising *as* authority-transfer, making the intuition preordained.  

  **Rigging?** Yes—but revealingly. The case is designed to *isolate* directed obligation. Shiffrin’s view handles it easily because it *stipulates* that directedness is constitutive of promises. For rivals, accommodating it requires contortions that expose their core weaknesses: Scanlon dilutes "expectation," Humeans dilute "directed wrong."  

  ---

  ### **What would count as progress**  
  Resolution requires **methodological negotiation**, not new cases or theories:  

  1. **Clarify the starting point**: The group must decide whether the fatalist intuition is *non-negotiable data*. If yes, Humeans must either explain it or exit the debate. If not, Scanlon/Shiffrin must justify privileging it.  
  2. **Reframe the question**: Shift from "Why do promises bind?" to:  
     - "What features must an account preserve: practice-dependence, directed wrongs, or both?"  
     - "Is B’s complaint in the fatalist case *paradigmatic* of promising or peripheral?"  
  3. **Formalize the conflict**: Map theories to their implied "wrong-making properties." For example:  
     - If directed wrongs are irreducible, Shiffrin wins.  
     - If obligation requires social context, Hume wins.  
     - If neither, Scanlon may mediate.  

  **Is the impasse permanent?** Only if members refuse to disentangle evidential priorities. Otherwise, the debate can advance by accepting that "promissory obligation" is a cluster concept—each theory captures one facet, but none is exhaustive. Progress might mean synthesizing them (e.g., practices enable authority-transfers) or conceding incompatibility. The deadlock itself reveals the **irreducible pluralism** in promissory phenomena.
