  Here's the joke script:

  **(Illusionist nursing coffee, Zombie enters buzzing with energy)**

  **Zombie:** Man, illusionism is *brilliant*! Solved consciousness! No spooky phenomenal properties. Just cognitive access and reportability. Frankish was right – it’s all introspective noise.  

  **Illusionist:** …But it *really seems* like something to sip this coffee. The bitterness… the warmth…  

  **Zombie:** Exactly! That seeming *is* the illusion! Your brain’s just autosaving a pointless ‘what-it’s-like’ document. No one’s reading it! Clean. Efficient.  

  **Illusionist:** But… the seeming itself *feels* real. Like this hangover.  

  **Zombie:** (*Beaming*) Oh, I don’t *have* that problem.  

  **Illusionist:** (*Stares into coffee*) That’s… the problem.  

  **Zombie:** How? My system runs perfect! No messy seemings, just smooth processing. Autosave without the headache!  

  **Illusionist:** Right. Exactly. You wouldn’t get the illusionist’s hangover.  

  **Zombie:** (*Proudly*) Damn right! Who needs a ‘seeming’ when you’ve got a perfectly good… *seeming*? Wait.  

  *(Zombie’s smile freezes. Illusionist sips coffee, wincing.)*  

  **Zombie:** …Is the hangover metaphorical?  

  **Illusionist:** *Seems* like it.
