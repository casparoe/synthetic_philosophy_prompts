  Write me a joke about illusionism about phenomenal consciousness for a philosophy comedy night I'm putting together at my uni's student union. I've got a bit about Kant and a bit about the trolley problem, but I want something on illusionism. The trouble is that most consciousness jokes are just 'qualia lol' or 'hard problem go brrr' and they dont actually turn on the theory. I want a joke that would make a room full of philosophy of mind people laugh, but also make sense to someone who's only read a bit. Here's the angle I want: my flatmate has a theory she calls the illusionist's hangover. The idea is that illusionism says phenomenal consciousness is a kind of introspective illusion, but the illusion is not that we have experiences; it's that those experiences have a phenomenal character over and above their functional or access role. She says the brain is like a word processor that keeps autosaving a document about what it is like to be you, even though there's no one reading it. The joke should be a short dialogue between an illusionist and a philosophical zombie. The twist is that the zombie is the one who is totally convinced by illusionism, and the illusionist is the one who keeps saying 'but it really seems like something.' The punchline should turn on the difference between the illusionist's claim that the seemings are real seemings but not evidence of phenomenal properties, and the zombie's claim that there are no seemings at all. Maybe the zombie says something like 'I dont have that problem,' and the illusionist says 'Exactly! Thats the problem.' Or something better. Make it funny to people who know the debate, not just a generic nerd joke. Just give me the joke, not an explanation of why it's funny.
