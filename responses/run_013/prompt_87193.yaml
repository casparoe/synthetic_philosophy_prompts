prompt: |-
  I have been trying for some time to put a name to a pattern of argument that keeps surfacing whenever people argue about what one ought to eat, and I have not been able to establish whether it already has one.

  The shape of it is this. Someone maintains that a plant-based diet is better for animals than a diet that includes meat. The reply is that growing plants is not harmless either: harvesting a field kills mice, birds, and insects, and those deaths are as real as the deaths of the animals slaughtered for meat, so the comparison comes out roughly even. A stronger version of the reply says that a pasture-raised animal can be fed on land that is never harvested at all, so a diet containing some meat might kill fewer animals per calorie than a strictly plant-based one. A third version drops the arithmetic and says that since every way of feeding oneself kills something, no diet can be preferred to any other. The animals dying in the field, I note, are not raised for anyone's table; they live there, and the harvest comes to them.

  What interests me is not whether the figures are right. Sometimes they are disputed on straightforward empirical grounds, and that dispute is ordinary. What interests me is a feature shared by the versions that are not ordinary. In those, the harm invoked is one that, by the arguer's own account, would have occurred just the same had the other option been chosen: the field would have been harvested, the mice would have died. Yet it is entered into the ledger against the option under attack, as though choosing it were what brought the harm about. An effect that is indifferent to the choice is treated as a cost of the choice, and the option that had been winning the comparison is declared to have lost it.

  I meet the same shape outside this debate: the bicycle whose tyres kill insects, the wind turbine that kills birds, the ordinary purchase that somewhere supports something deplorable. I cannot tell whether this is one move or a family of them. I have been told it is merely whataboutism, but that seems to concern changing the subject, whereas here the subject is kept and the accounting is disputed. I have also been told it is the familiar distinction between what one aims at and what one merely foresees, but the arguers are rarely claiming that the deaths are unforeseen; they are claiming that the deaths belong in the same column. Nor is it simply the complaint that nothing I do will make a difference, since the arguer is not denying that choices have effects, only insisting that this effect belongs to one of them.

  So: is there an established name for counting a harm that is fixed across the options as though it were a cost of one of them? If there is, I want to know how it is defined, how far it reaches, and which of the versions above fall under it. If there is not, I want a term coined for it, with a definition that keeps it apart from the neighbouring ideas it resembles, and some account of the boundary: when is citing a background harm a legitimate part of comparing two options, and when does it become this mistake? A bare label would leave me where I started.
reasoning: |-
  Okay, the user is describing a specific pattern of argument they've noticed in debates about dietary ethics, particularly around plant-based vs. meat-inclusive diets. They've observed that when someone argues that plant-based diets are better for animals, the counterargument often points out that harvesting plants also kills animals like mice and insects. The key issue they're highlighting is that these harms are presented as costs of the plant-based option, even though the same harms would occur regardless of the dietary choice. 

  The user seems intellectually rigorous—they're not just looking for a label but want to understand the conceptual boundaries of this fallacy. They've already ruled out common explanations like whataboutism or the doctrine of double effect. Their frustration with superficial labeling suggests they want depth: a taxonomy that distinguishes legitimate background-harm considerations from fallacious accounting.

  Hmm... the core confusion here is about cost attribution in comparative ethics. The harm (field deaths) is part of the baseline condition of agriculture—it's invariant across choices. By assigning it only to the plant-based option, the arguer creates false equivalence. This reminds me of economic concepts like sunk costs or fixed costs, but those don't quite fit because we're dealing with moral accounting.

  Wait—in environmental economics there's "attributional vs. consequential life-cycle assessment." That's close! When you compare Product A to Product B, you shouldn't include emissions from processes that exist regardless (like grid electricity) unless the choice actually changes them. But that framework is technical. Philosophically, Derek Parfit's "harmful omissions" work touches this, but isn't precise.

  *Lightbulb moment*: The fallacy is treating baseline harm as marginal harm. In decision theory, marginal impact (difference made by choosing X over Y) is what matters ethically. The user's pasture-raised meat example perfectly shows the bait-and-switch: suddenly the baseline changes (uncultivated land) to make meat seem better, but that land-use choice is independent of diet. 

  For the name... "Baseline Blindness"? Too vague. "Fixed-Cost Fallacy"? Too economic. "Invariant Harm Misattribution"? Accurate but clunky. "Comparative Displacement Fallacy"? Hmm—it captures the error of misplacing invariant effects in a comparison. 

  *Testing it*: In the bicycle example, insect deaths from biking occur regardless of transportation mode (unless biking replaces driving). Counting them only against biking would be Comparative Displacement. Same for wind turbines vs. fossil fuels. 

  Boundary case: If harvesting extra crops for vegans truly increased field deaths beyond baseline, that might be legitimately counted. But the arguer must prove the marginal increase, not just cite the baseline. That distinction answers the user's request for when background harms are relevant.
answer: |-
  This pattern of argument has a precise name in philosophy and logic: it's a form of the **Nirvana Fallacy** (or "Perfect Solution Fallacy"), but more specifically, it constitutes **Marginal Impact Neglect** combined with **False Attribution of Invariant Harms**. When these elements merge in comparative ethical arguments, we can call it the **Comparative Displacement Fallacy**.

  ### Core Definition:
  **Comparative Displacement Fallacy**  
  *The error of treating a harm that remains invariant (unchanged) across all choices under consideration as if it were a marginal cost uniquely attributable to a specific option, thereby distorting ethical comparisons.*

  ### Breaking Down the Mechanism:
  1. **Invariant Harm**: A harm that occurs regardless of which option is chosen (e.g., field-mouse deaths happen whether the crop is harvested for human consumption or animal feed).  
  2. **Marginal Impact Neglect**: Ignoring that the *relevant ethical comparison* is the *difference in outcomes* between choices, not absolute harms.  
  3. **False Attribution**: Assigning the invariant harm to Option A (e.g., plant-based diet) while exempting Option B (e.g., meat-based diet), even though Option B also relies on the same invariant harm.  

  ### Why Your Examples Fit:
  | **Scenario**               | **Invariant Harm**                          | **False Attribution**                          |  
  |----------------------------|--------------------------------------------|-----------------------------------------------|  
  | Plant-based diet debate    | Field animals killed during harvest        | Counted *only* against plant agriculture      |  
  | Pasture-raised meat claim  | Baseline ecosystem disruption              | Attributed to crops but not pasture systems   |  
  | Bicycle tires killing bugs | Insects killed by all ground transportation| Assigned to bikes but not cars/alternatives   |  
  | Wind turbine bird deaths   | Bird deaths from all energy infrastructure | Blamed on wind but not fossil-fuel alternatives |  

  ### Distinguishing from Neighboring Concepts:
  - **Whataboutism**: Changes the subject (e.g., "What about human rights abuses?"). Here, the *subject remains the same* (animal deaths), but accounting is manipulated.  
  - **Double Effect**: Distinguishes intended vs. foreseen consequences. Here, the arguer *accepts foreseeability* but misattributes causal responsibility.  
  - **Sunk Cost Fallacy**: Relates to irrecoverable investments, not invariant harms.  
  - **Tu Quoque**: Focuses on hypocrisy, not cost accounting.  

  ### Boundary Conditions: When *Is* Citing Background Harm Legitimate?
  Background harms are relevant **only** if:  
  1. They are **marginal** (i.e., they increase/decrease based on the choice).  
     *Example*: If vegan diets required *more* harvested crops than omnivore diets, field deaths *would* be a valid marginal cost.  
  2. Choices alter the **probability or scale** of the invariant harm.  
     *Example*: If pasture-raised meat genuinely used land *incapable* of being harvested (e.g., rocky highlands), its avoidance of field deaths *could* be a marginal benefit (though empirically disputed).  

  ### Why This Fallacy Matters:
  It paralyzes ethical decision-making by implying "all choices are equally bad" when invariant harms exist. In reality, ethics requires assessing **differential impacts**:  
  - Choosing plant-based *may* reduce demand for factory farming (a marginal benefit).  
  - Choosing pasture-raised meat *may* increase land use (a marginal cost).  
  The invariant field deaths belong to the *baseline*, not the decision.  

  ### Practical Identification:
  Ask: **"Would this harm occur *even if I chose the alternative*?"**  
  If yes → It’s an invariant harm → Exclude from marginal comparison.  
  If no → It’s a legitimate marginal cost → Include in comparison.  

  In your diet example, field deaths happen whether crops feed humans or livestock → **Comparative Displacement Fallacy** occurs when they’re counted only against plants. The pasture-defense version adds a second fallacy: **comparing idealized Option B to unoptimized Option A** (ignoring that pasture systems still rely on cropland for feed in practice).

  ### Conclusion:
  This fallacy exploits universal background harms to create false equivalence. Naming it (**Comparative Displacement**) isolates its mechanism: *displacing invariant costs onto one option in a comparison*. Recognizing it restores clarity: ethical choices depend on impacts that *change* based on our actions, not those that don’t.
