  The four cases are brilliant touchstones. The dead brother scenario tests if attitudes require a living target - useful for the Strawsonian. The personality-change case probes identity conditions. The "don't let me off the hook" example examines blame's non-instrumental value. The addict case is perfect for the could-have-done-otherwise debate. 

  For predictions, the compatibilist will see resentment as natural (even posthumously) and blame as constitutive of respect. The skeptic will treat dead resentment as irrational, personality change as absolution, and insist the addict shows why control matters. 

