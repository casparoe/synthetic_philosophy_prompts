answer: |-
  ## Joint Statement: Adversarial Collaboration on Moral Responsibility

  **Section 1: Agreed Claims**

  1.  **Reactive Attitudes Defined:** Reactive attitudes (e.g., resentment, indignation, guilt, gratitude, forgiveness) are natural, deeply ingrained human responses to the perceived quality of others' wills towards us and towards others (e.g., goodwill, ill-will, indifference, respect). They constitute the core of the "participant stance" essential to ordinary interpersonal relationships.
  2.  **Reactive Attitudes Presuppose Agency:** These attitudes inherently presuppose that the target is a *responsible agent* capable of understanding and responding to moral demands, reasons, and expectations – not merely a cause of harm or benefit. They are responses to *agents*, not just events.
  3.  **Determinism's Limited Direct Threat:** Determinism (the thesis that all events are necessitated by prior causes and laws of nature) does not *directly* show that our practices of holding responsible are *empirically false* or *logically incoherent* in their own terms. The ordinary criteria for applying reactive attitudes do not *explicitly* require libertarian free will or the falsity of determinism.
  4.  **The Skeptical Challenge:** The fundamental challenge for compatibilism is whether the agency presupposed by the participant stance *itself* requires a kind of "ultimate responsibility" or "basic desert" that might be incompatible with determinism, even if not consciously invoked in everyday practice.
  5.  **Case 1 (Dead Brother):** The man's resentment towards his dead brother is a genuine reactive attitude. It demonstrates that reactive attitudes can persist beyond the target's capacity for response or punishment, and are not solely future-oriented or instrumental. They reflect a past-directed evaluation of the agent's quality of will.
  6.  **Case 2 (Personality Change):** The woman who caused harm before a drastic personality change presents a challenge. Both sides agree the *current* person answering to the name is *not* the appropriate target of reactive attitudes like resentment or blame *for the past act*. The attitudes are tied to the agent who performed the act, not just the physical body.
  7.  **Case 3 ("Don't Let Me Off"):** The person insisting on being blamed genuinely experiences the demand for blame as constitutive of respect for their agency. This highlights a non-instrumental dimension within the practice: being held responsible is seen as acknowledging one's standing *as* a responsible agent.
  8.  **Case 4 (Addict):** The addict, while acknowledging he "could not have done otherwise" in a specific sense relevant to his addiction on that night, is still treated *differently* from a malfunctioning machine by both sides. He remains a participant in the moral community, capable of reasons-responsiveness, regret, and future-directed moral address, even if blame in a strong desert sense is contested.

  **Section 2: Residual Disagreements & Cruxes**

  | Disagreement Topic           | Compatibilist Formulation (C)                                                                                       | Skeptic Formulation (S)                                                                                                                                 | Crux                                                                                                | Shared Evidence / Case                              | C Prediction                                                                                                   | S Prediction                                                                                                                                 |
  | :--------------------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------- | :-------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Grounding of Reactive Attitudes** | Reactive attitudes are inherently justified within the participant stance; demanding external, cosmic justification is a category error. | Reactive attitudes implicitly presuppose basic desert (ultimate responsibility/self-authorship); without this metaphysical grounding, they lack warrant. | **Does the participant stance *inherently* presuppose basic desert?**                              | Practice itself, esp. Case 3 ("Don't Let Me Off") | Case 3 shows the demand for blame reflects recognition of agency *within* the practice, not desert metaphysics. | Case 3 reveals the deep intuition that *deserving* blame is essential to true respect for agency, which requires impossible self-creation.    |
  | **2. Warrant for Blame**     | Blame (as a reactive attitude) is warranted when an agent manifests ill will or insufficient regard, regardless of determinism, because it reflects our interpersonal reality. | Blame grounded in basic desert is never warranted because no agent possesses the required ultimacy; blame can only be justified instrumentally or as moral address. | **Is non-instrumental, desert-based blame ever warranted?**                                        | Case 1 (Dead Brother), Case 4 (Addict)          | Resentment in Case 1 is warranted as a fitting response to past ill will. Addict's agency warrants non-instrumental blame-like responses. | Resentment in Case 1 is irrational/ungrounded without a deserving agent. Addict shows why lack of robust control undermines desert-based blame. |
  | **3. What Determinism Threatens** | Determinism threatens responsibility only if responsibility is wrongly defined *outside* the participant stance (e.g., requiring contra-causal freedom). | Determinism threatens the *actual metaphysical conditions* (basic desert) implicitly required by the participant stance, even if not consciously articulated within it. | **Does determinism undermine the *implicit presuppositions* of the participant stance?**           | Analysis of agency presuppositions within reactive attitudes | Determinism is compatible with the kind of reasons-responsive agency presupposed within the stance.             | Determinism reveals the participant stance presupposes an impossible form of agency (ultimate self-origin), rendering its core attitudes metaphysically unjustified. |
  | **4. Status of "Couldn't Have Done Otherwise"** | "Couldn't have done otherwise" undermines responsibility only in contexts where it signifies lack of relevant capacity (e.g., coercion, incapacity), not determinism per se. | "Couldn't have done otherwise" in the *ultimate* sense (true under determinism) fundamentally undermines basic desert, even if local capacities are intact. | **Does ultimate inability (under determinism) negate desert?**                                     | Case 4 (Addict)                                 | Addict's inability is pathological, not universal; his agency, though impaired, remains within the compatibilist norm. | Addict's inability highlights the universal truth under determinism: ultimate control is absent, negating desert despite local capacities. |

  **Section 3: Assessment of Verbal Disputes**

  Significant portions of the dispute are **substantive**, concerning the nature of agency, the presuppositions of our practices, and the implications of determinism. However, **some potential verbal elements exist**:

  1.  **"Blame":** The Skeptic often uses "blame" narrowly to mean *only* desert-based, backward-looking condemnation. The Compatibilist uses "blame" more broadly, encompassing the entire range of negative reactive attitudes expressing moral disapproval within the participant stance (which may include forward-looking elements). Clarifying the scope of "blame" in each claim is crucial.
  2.  **"Control" / "Could Have Done Otherwise":** The Compatibilist defines these *within* the framework of reasons-responsiveness and absence of specific excusing conditions. The Skeptic defines them in an *ultimate, contra-causal sense*. Disagreement often arises when these distinct senses are conflated or assumed to be the same concept. The Addict case (Case 4) explicitly highlights this potential ambiguity.

  **Conclusion:** While terminology sometimes diverges, the core disagreements reflected in the cruxes (especially regarding the presupposition of basic desert and the warrant for non-instrumental blame) represent deep, substantive differences in understanding the foundations of moral responsibility and the implications of determinism for our reactive practices. The agreed cases provide concrete focal points for testing these differences.
