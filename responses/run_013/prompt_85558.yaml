answer: |-
  ## The Kelmscott Price

  The dust in Halliday’s Auction Rooms held the scent of forgotten libraries and damp wool. Ada ran a finger along the spine of the Kelmscott Chaucer, its blind-tooled leather cool beneath her touch. Tomorrow, the auditors arrived. Not for the finances – those were Uncle Bernard’s purview – but for the *provenance* of the Renaissance sketch currently locked in the vault. A whisper of doubt, amplified by sleepless nights and too much coffee, had taken root. The sketch *felt* right, the paper aged correctly, but… *attribution*. That was the chasm.

  “Ms. Halliday?” Silas Vance stood in the doorway of the small back office, his overcoat impeccable, a faint smile playing on his lips. He dealt in esoterica – rare manuscripts, mathematical curiosities, the kind of things that passed through Halliday’s infrequently but lucratively. He was also known, in certain circles, for games of calibrated risk. “About that little wager we discussed?”

  Ada turned, the Chaucer forgotten. “The sketch’s attribution? Confirmed by the auditors tomorrow?”

  “Precisely.” Silas moved smoothly, pulling a small notebook and pen from his inner pocket. “You expressed… a degree of uncertainty. Quantifiable uncertainty, one might say.”

  Ada felt the familiar knot in her stomach tighten. *Quantifiable*. Her PhD felt like a lifetime ago, buried under ledgers and insurance appraisals, but the habits remained. Probability wasn’t just theory; it was the price you’d pay. “Yes,” she said, her voice tighter than she intended. “Based on the documents, the style… I think it’s likely. But not certain. Not tomorrow-morning-certain.”

  “So,” Silas prompted, pen poised. “If I offered you a ticket that pays out, say, £100 if the auditors *confirm* the sketch is by Pontormo… what price would make that ticket fair to you *today*? What would you pay to own it right now?”

  Ada closed her eyes. The vault. The slight hesitation in Bernard’s voice when he’d presented the chain of custody. The sheer, stomach-churning *importance* of it being real for the firm’s shaky reputation. The fear wasn’t just of being wrong; it was of the *feeling* of being wrong tomorrow, facing those impassive auditors. “Seventy,” she said, opening her eyes. “I’d pay seventy pounds for that ticket today.”

  “Seventy pounds for a £100 payout if confirmed,” Silas noted, writing it down. “Fair enough. And conversely, if I wanted to *sell* you a ticket that pays *me* £100 if the auditors *deny* the attribution… what price would you charge *me* for that protection? What makes it fair for you to take on that risk today?”

  This was the other side of the coin. Protecting against the disaster. The number came faster, fueled by the dread. “Thirty,” Ada stated. “I’d sell you that ‘denial’ ticket for thirty pounds.” She saw the slight arch of Silas’s eyebrow. She knew the math: 70% chance of confirmation implied only a 30% chance of denial. Her prices reflected that. *Today*. But tomorrow… tomorrow, standing in that room, she knew the fear would be raw, overwhelming. The *possibility* of denial would loom larger, feel more *real*. She *expected* her fear would distort her view.

  “Thirty pounds,” Silas murmured, jotting it down. “Perfectly consistent, Ms. Halliday. Thank you.” He tore off the top sheet and placed it on the desk. “Consider these prices noted. I may call upon them later.” He gave a small, polite nod and was gone, leaving the scent of expensive cologne mingling with the dust.

  Leo, her cousin and the auction house's resident pragmatist, wandered in, munching an apple. He glanced at the paper. “Vance? What’s he after? More of those cursed probability puzzles?”

  “Just… establishing some prices,” Ada said vaguely, turning back to the Chaucer. “For the audit outcome.”

  Leo swallowed. “Prices? For bets? Ada, you know he’s sharper than a tack. You setting a single price to buy *and* sell?”

  “What else?” Ada snapped, the tension making her voice brittle. “It’s the fair price. Based on my belief *now*.”

  Leo shrugged. “Seems… exposed. Like quoting the same price to buy oil or sell it. Market makers build in a spread, Ada. A buffer. Between what they’ll buy at and what they’ll sell at. Because the world shifts. Because they need to *not* get picked off.” He took another bite, his gaze steady. “Or maybe just don’t play his game at all. Tell him the audit’s not a roulette wheel.”

  But it felt like one. The uncertainty was a physical weight. Setting the price was the only way to *contain* it, to make the shapeless dread into something measurable. A fair ticket. That was the anchor. She dismissed Leo’s caution.

  Later that afternoon, Silas returned. He placed an envelope on the desk. “Ms. Halliday. A proposal. I wish to *buy* from you, at your stated price of thirty pounds, the ‘denial’ ticket. The one that pays me £100 if the auditors deny the attribution tomorrow.”

  Ada stared. She’d quoted £30 as the fair price to *sell* that ticket. Selling it now, based on her *current* 30% credence in denial, felt… correct. She took the thirty pounds Silas offered and signed the small slip he produced, acknowledging the sale. She was thirty pounds richer, insuring against a £100 loss if denial happened. Fair. Rational. *Now*.

  The night was long. Ada paced, re-examined blurry photographs of the sketch, imagined the auditors’ skeptical faces. Leo’s words about a ‘spread’ nagged, but the idea felt… dishonest. A fair price *was* a fair price.

  Morning came, grey and damp. Ada arrived early, her nerves frayed. The auditors were due at ten. At nine-fifteen, Silas Vance appeared again, calm as ever.

  “Ms. Halliday,” he began. “I find myself reconsidering my position regarding the sketch. The market… it whispers. I’d like to reduce my exposure to the denial outcome.” He paused. “I wish to *sell* you back the ‘denial’ ticket I purchased yesterday.”

  Ada’s heart hammered against her ribs. The fear was here, thick and cloying. The possibility of denial wasn’t a 30% abstraction anymore; it was a looming, visceral catastrophe. Her belief hadn’t changed based on new evidence – the auditors hadn’t arrived – but her *valuation* had. The fear had inflated the perceived risk. The fair price *now*, drowning in this dread, felt entirely different.

  “Sell it back?” she echoed, her throat dry.

  “Indeed,” Silas said smoothly. “And you stated yesterday the fair price to *buy* such a ticket was thirty pounds. I’d be happy to sell it to you for that price.”

  Ada froze. Yesterday’s price? That was anchored in yesterday’s calm(er) assessment. Today’s terror screamed that denial was *more* likely, or at least, the *sting* of it demanded a higher price to bear the risk. Thirty pounds felt absurdly low. But… she’d *said* it. She’d declared thirty pounds as the fair price to buy this very ticket. It was her own valuation, recorded. Refusing would be… incoherent? Dishonest to her *own* past assessment? Silas was merely holding her to her word, to her own definition of fairness.

  “That… that was yesterday’s price,” she managed, hating the tremor in her voice.

  “It was your stated fair price for buying such a ticket,” Silas corrected gently, no hint of malice, only precision. “Has new information emerged since then? Before the auditors?”

  “No,” Ada admitted, the word tasting like ash. “No new information.” Only the crushing weight of anticipation, distorting everything.

  “Then,” Silas said, extending the ticket slip he’d had her sign yesterday, “the fair transaction stands. Thirty pounds, and the ticket is yours again.”

  Trapped by her own declared fairness. To refuse would be to admit her prices weren’t real, that her carefully quantified beliefs were flimsy things blown about by fear. That felt like a deeper failure. With hands that wanted to shake, Ada counted out thirty pounds from the cash box – the very thirty Silas had given her yesterday – and handed it to him. He returned the slip. She now owned the ‘denial’ ticket she’d sold him yesterday. The net cash flow: she’d received £30 yesterday and paid £30 today. Zero. But she’d done *nothing*. She’d merely bought back her own insurance policy at the original price, despite her fear screaming it was worth more.

  Silas hadn’t moved. “However,” he continued, as if the previous transaction were merely a preamble, “given my reassessment, I also wish to *hedge* my position further. I’d like to *buy* from you, at your stated price of seventy pounds, the ‘confirmation’ ticket. The one that pays £100 if the auditors confirm Pontormo.”

  Ada stared at him, the pieces clicking into place with a cold, brutal clarity. The slow Dutch book. He was exploiting the predictable shift in her valuation across time. Yesterday, she sold him denial insurance cheaply (based on her low credence). Today, steeped in fear and valuing denial insurance much higher, she bought it back from him at the *same* low price (because she was bound by her past declaration). And now, he wanted to buy confirmation insurance *cheaply* from her today, likely expecting that *after* the audit, regardless of the outcome, her valuations might shift again.

  But the confirmation price… she’d quoted seventy pounds as fair to *buy* it yesterday. Now, drowning in fear, her confidence shaken, the fair price to *sell* it – to hand over that potential £100 payout – felt higher than seventy. Much higher. Selling it for seventy felt like giving away value. Yet… she’d declared it. Her own fair price.

  Leo appeared in the doorway, drawn by the silence. He saw the money on the desk, the slip in Ada’s hand, Silas’s expectant posture. His eyes narrowed.

  “Ada,” Leo said, his voice low but urgent. “Don’t. Just… don’t trade. Tell him the price is only good if *you* offer it. Or tell him your buy price and sell price are different *now*. That you need… fifty to sell that confirmation ticket. Or eighty to buy it back. Or tell him to take his tickets and shove them. Or make it *real* money, Ada. Make it ten thousand. Then see how ‘fair’ seventy feels when it might break us. This penny-ante stuff… it lets him play.”

  Silas remained impassive, a monument to patient logic. “I am merely proposing transactions at your own declared fair prices, Ms. Halliday. No new information. The auditors arrive shortly. Do we have a deal?”

  The clock ticked. The dust motes danced in the weak light. Ada felt the crushing weight of the contradiction. To trade was to be exploited by her own shifting, predictable valuations. To refuse was to abandon coherence, to admit her beliefs weren’t stable enough to set a single, binding price. To make the stakes ruinous felt like hiding, like refusing to engage with the uncertainty at all. Was she irrational because Vance could take money from her using her own prices? Or was refusing to trade at her *own* declared fair prices the deeper irrationality? What did being *rational* even demand in this dreadful, anticipatory limbo?

  Leo’s gaze was heavy on her. The auditors’ footsteps sounded in the hall outside. Ada looked at the seventy pounds Silas had placed on the desk. Her own price. Her own definition of fairness, set yesterday in relative calm, a world away from this suffocating fear.

  Her hand moved towards the slip Silas held out for the confirmation ticket.
