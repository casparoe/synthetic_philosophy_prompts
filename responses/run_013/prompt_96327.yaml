  In the marking scheme, allocate points: 3 for each case application (9 total), 4 for the animal tension, 4 for replacement argument, 4 for exceptions, and 4 for structure. Deduct for missing parts or confusion. Mistakes: misdefining the baseline, ignoring the third case, or not differentiating replacement vs. smuggling.

