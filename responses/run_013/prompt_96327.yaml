  The user's deeper needs: They're untrained, so clarity is crucial. The exercise should force critical engagement, not repetition. They want to break the group's cycle by making them apply the theory rigorously. The reliance baseline must be tested, not just stated. Also, avoiding citations keeps focus on reasoning, not authority. The marking scheme helps them grade consistently, emphasizing analysis over rote answers.

