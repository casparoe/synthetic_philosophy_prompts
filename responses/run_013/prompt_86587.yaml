prompt: |-
  I'm a PhD candidate in philosophy finishing a chapter on advance directives and the bindingness of promises across radical psychological change, and my reading group has stalled on Parfit's teletransporter. Every session we re-litigate whether the person who steps out at the far end is the person who stepped in, and we never reach the question I actually need answered: what the verdict is supposed to do for us — for the validity of the directive, for the contract, for the debt. I've come to think the productive move is to stop adjudicating between the rival answers for a moment and to specify, first, what any theory of what matters in survival would have to deliver in order to count as adequate. That specification is what I'd like you to write.

  Give me the requirements list, each with the case or consideration that motivates it, and be explicit about which entries are genuine desiderata and which look to me like prejudices of the identity-based camp rather than demands any theory must meet. At a minimum I'd expect the list to cover: the branching or division cases, where two successors exist and the theory has to say what matters without simply declaring the scenario incoherent; whether the relation that matters admits of degrees — the gradual-replacement case is the obvious test, but I've also been pushing a variant in which the machine reproduces you with one specific psychological alteration (a value, a cherished memory) and a reversible variant in which the reconstructed person is scanned and transmitted back, so that a round trip is supposed to preserve you, and I want to know what the theory must say about the ninety-nine-percent and the sixty-percent cases; transitivity, since if what matters can hold in degrees between adjacent stages of a spectrum it is not obvious that it survives the whole chain; the requirement that ordinary survival come out as the central case rather than a lucky exception, and that the theory not make our ordinary change over decades either mysterious or trivial; what grounds the special concern we have for our future selves, and whether that concern is a rational requirement or merely a biological disposition, with the past–future asymmetry as the test; and the tie to responsibility and desert — who is bound by the earlier person's promise, who owes the debt, who answers for the crime, and whether an advance directive binds — because I need the theory to be good enough to settle those questions, which is the purpose I'm fixing for it. Add anything you think belongs that I've missed, and cut anything on my list that you judge not to be a real requirement.

  Then tell me which pair or triple of these requirements you suspect cannot be jointly satisfied — my own hunch is that degree-talk and transitivity are in tension, and that the branching case puts pressure on whatever is supposed to ground the special concern, but I'd like your independent judgment — and which single requirement does the most work in excluding the most popular theories on offer. A numbered list with a short paragraph under each entry is fine; I care much more about the criteria and their motivating cases than about a scorecard of the contenders, so keep any pass over the existing views brief.
reasoning: |-
  Okay, the user is a PhD candidate in philosophy working on advance directives and promises across psychological changes. They're stuck with their reading group debating Parfit's teletransporter without reaching the practical implications they need. Their main request is for a list of requirements that any theory of what matters in survival must meet to be adequate. 

  First, I need to unpack what they're really after. They want to shift focus from identity debates to the functional criteria for a theory that can handle real-world issues like advance directives, contracts, and debts. They mentioned specific cases: branching, gradual replacement, reversible teletransportation, degrees of survival, transitivity, ordinary survival as central, special concern for future selves, and ties to responsibility. 

  The user also wants me to distinguish genuine desiderata from identity-based prejudices. That's crucial because some requirements might be biased towards the psychological continuity view. For example, insisting on a one-to-one relation in branching cases might be an identity prejudice, whereas allowing for multiple successors could be a genuine requirement for a theory to handle division scenarios.

  I should structure each requirement with the motivating case and clarify whether it's a true desideratum or a potential bias. The user hinted that degree-talk and transitivity might conflict, and branching challenges special concern. I need to flag those tensions. Also, which requirement most decisively rules out popular theories? Probably the branching case since it forces abandonment of identity as what matters.

  I'll start by listing all their mentioned points and adding anything missing. Maybe the theory's applicability to real-world practices like legal responsibility? They covered that under "tie to responsibility," so it's included. But perhaps emphasizing that the theory must deliver actionable verdicts, not just metaphysical ones. 

  For each requirement:
  1. Branching/Division: Motivated by teletransporter duplicates. Genuine desideratum—any theory must account for multiple successors without collapsing. Not a prejudice.
  2. Degrees: Gradual replacement and percentage cases. Desideratum—survival isn't binary. But here's where transitivity conflicts: if A~B at 90%, B~C at 90%, but A~C at 81%, does survival fade? 
  3. Transitivity: Spectrum cases. Desideratum, but may clash with degrees. 
  4. Ordinary Survival as Central: Must explain why normal life isn't an exception. Desideratum; failure here makes theories implausible.
  5. Special Concern & Past-Future Asymmetry: Why care more about future pain? Desideratum to ground rational (not just biological) concern. Branching undermines this if both successors are "you."
  6. Responsibility/Desert: Advance directives, debts, crimes. Core desideratum—the theory must resolve practical obligations. This might be the most critical for the user's work.

  Key tensions: Degrees + transitivity = non-transitive survival, which feels counterintuitive. Branching + special concern = diluted obligation (e.g., which duplicate pays the debt?). The responsibility requirement probably excludes most theories because they struggle with branching (e.g., who is bound? Both successors? Neither?).

  I'll note that Responsibility/Desert is the heavyweight—it's the user's end goal, and many theories fail here when identities aren't unique. The branching requirement is the main theory-killer because it forces non-identity-based solutions, which then struggle with responsibility assignments. 

  Finally, I'll suggest that the tension between degrees and transitivity might be unavoidable, and that's okay—perhaps survival isn't always transitive. But for the user's purposes, the responsibility criterion is non-negotiable.
answer: |-
  Here's a requirements list for a theory of "what matters in survival" (WMS), structured around your needs for advance directives, promises, debts, and responsibility. Each entry specifies the requirement, the motivating case(s), and whether it's a genuine desideratum or a potential identity-prejudice. Finally, I'll identify key tensions and the most exclusionary requirement.

  **Requirements for an Adequate Theory of What Matters in Survival (WMS):**

  1.  **Handles Branching/Division Non-Mysteriously:**
      *   **Requirement:** The theory must provide a coherent account of what matters when a single person-stage gives rise to *multiple* psychologically continuous successor person-stages (e.g., teletransporter duplication, hemisphere division).
      *   **Motivating Cases:** Parfit's standard teletransporter duplication; split-brain scenarios where each hemisphere is successfully transplanted into a new body.
      *   **Genuine Desideratum? YES.** Any theory dismissing branching as incoherent fails a core test case central to debates on personal identity and WMS. It must explain why WMS exists for *each* successor and how this impacts obligations/concern (e.g., do *both* successors inherit the debt/promise? Does concern divide?).

  2.  **Accommodates Degrees (Non-Binarism):**
      *   **Requirement:** The relation constituting WMS must admit of degrees. Survival can be a matter of "more or less," not simply "all or nothing."
      *   **Motivating Cases:**
          *   *Gradual Replacement:* Slow replacement of original brain cells with synthetic duplicates (over years).
          *   *Partial Alteration:* Teletransporter creates a successor with 99% psychological continuity (e.g., missing one specific cherished memory/value) or 60% continuity (significant alteration).
          *   *Reversible Round Trip:* Original is destroyed and recreated at destination; then the destination copy is destroyed and recreated *back at origin*. Does the "returned" person have 100% WMS with the original pre-trip person? What about a 99% or 60% fidelity round trip?
      *   **Genuine Desideratum? YES.** Insisting survival is strictly binary ignores the intuitive pull of gradual change and partial psychological connections. A theory forcing a sharp cutoff in gradual cases (or declaring 99% survival incoherent) seems inadequate. The reversible case tests if the theory truly values psychological continuity *over* spatiotemporal continuity/material identity.

  3.  **Clarifies Transitivity (or Lack Thereof):**
      *   **Requirement:** The theory must explicitly state whether the relation constituting WMS is transitive and provide a principled account of why or why not. If non-transitive, it must explain how this impacts responsibility/obligation chains.
      *   **Motivating Cases:** Spectrum arguments (e.g., Gradual Replacement stretched over extreme time/distance; a chain of teletransporter hops with slight degradation at each step: A→B (99%), B→C (99%), ... Y→Z (99%). Is WMS between A and Z significant?).
      *   **Genuine Desideratum? YES.** Transitivity is a logical property that profoundly impacts how WMS functions over time and change, especially in gradual scenarios. A theory must confront this directly, not assume transitivity holds or ignore the implications if it doesn't. (This is where tension with Degree-Admittance arises).

  4.  **Centers Ordinary Survival Without Trivialization or Mystery:**
      *   **Requirement:** The theory must show why ordinary, uninterrupted biological life is the paradigm case of survival *for WMS*, explaining its significance without making it seem like a miraculous exception *or* reducing it to triviality (e.g., "it just is identity, so it matters").
      *   **Motivating Cases:** Our everyday experience of persisting through time with psychological connections; the significant change over decades (e.g., 20-year-old vs 70-year-old self).
      *   **Genuine Desideratum? YES.** A theory rendering ordinary survival inexplicably special or merely one contingent instance among many equally valid survival relations fails to capture our core experience. Conversely, it mustn't downplay the significance of psychological change over a normal lifespan.

  5.  **Explains the Rational Grounds for Special Concern:**
      *   **Requirement:** The theory must ground the *rationality* (not just biological origin) of the special concern we typically have for our future selves, distinguishing it from concern for others. It must also account for the past-future asymmetry (regret vs anticipation).
      *   **Motivating Cases:** Why anticipate future pain with dread but not past pain (beyond memory)? Why invest effort for future benefit? Does this special concern rationally extend to successors in branching/degree cases?
      *   **Genuine Desideratum? YES.** A purely biological explanation reduces WMS to an evolutionary quirk, potentially undermining its normative force for promises/debts/directives. The theory must show why *this specific relation* (R) warrants *this specific kind of concern*. Branching cases crucially test if R grounds concern that *must* be exclusive or can rationally be divided/shared.

  6.  **Provides Actionable Verdicts on Responsibility and Desert:**
      *   **Requirement:** The theory must yield clear(ish) answers about who bears responsibility for past actions, who deserves future benefits/punishments, who is bound by promises/contracts, and who has the authority/obligation regarding advance directives.
      *   **Motivating Cases:** Who pays the debt after teletransporter duplication? Which successor is bound by the promise? Who answers for the crime? Does an advance directive created by the pre-teletransport person bind the post-teletransport person? What about the 60% successor? The duplicate sent back after a round trip?
      *   **Genuine Desideratum? YES (CORE FOR YOUR PURPOSE).** This is the functional test. A theory of WMS is ultimately inadequate if it cannot guide practical reasoning about these crucial normative questions. It must connect the metaphysical relation (R) to normative consequences.

  7.  **Distinguishes WMS from Identity (or Justifies Their Conflation):**
      *   **Requirement:** The theory must explicitly state whether the relation R that matters is conceptually and metaphysically distinct from numerical personal identity, or whether they necessarily coincide. If distinct, it must explain why identity was mistakenly thought to matter.
      *   **Motivating Cases:** Branching cases (where identity arguably fails but psychological continuity/R may hold strongly for both successors); degree cases (where identity might be binary but R is graded).
      *   **Genuine Desideratum? YES.** This is fundamental to moving beyond the "same person?" stalemate. A theory must clarify its stance on this relationship.

  **Potential Identity-Prejudices to Flag (Not Genuine Desiderata):**

  *   **"Must Guarantee Uniqueness":** The demand that R must *always* hold between a person-stage and *exactly one* future person-stage. Branching cases show this isn't necessary for WMS to obtain; it might be a contingent feature of ordinary survival. (Genuine Requirement #1 challenges this prejudice).
  *   **"Must Be All-or-Nothing":** The insistence that survival cannot admit of degrees. Requirement #2 directly confronts this. While identity might be binary, WMS plausibly is not.
  *   **"Must Ground Absolutely Exclusive Concern":** The idea that special concern for one's future self *must* be exclusive and undivided. Requirement #5 asks for the *rational grounds* of concern, which *might* rationally extend to multiple successors or admit of degrees, even if it doesn't in ordinary cases.

  **Key Tensions You Suspect (Confirmed):**

  1.  **Degrees (Requirement #2) vs. Transitivity (Requirement #3):** If R admits of degrees (e.g., 90% strength) and is transitive, then a long chain of high-fidelity links (A-R90-B, B-R90-C, ... Y-R90-Z) could result in A having only a very weak R-relation to Z (e.g., 0.9^24). Does this weak R still constitute "survival" for normative purposes (e.g., responsibility, directive authority)? If the theory declares it does, it seems counterintuitive; if it doesn't, it implies a non-transitive threshold, which is theoretically messy. If R is non-transitive, it avoids this chain degradation but makes the persistence of WMS over time potentially fragile or arbitrary.
  2.  **Branching (Requirement #1) vs. Special Concern (Requirement #5):** If R grounds rational special concern, and R holds strongly between P and *both* successor S1 and S2, what does rational concern demand? Equal concern for both? Divided concern? Concern only for the "closest" or "first"? How does this translate to responsibility/obligation (Requirement #6)? Can the debt be owed by both? Must the promise be kept by both? This directly challenges the intuition that obligations must have a single bearer.

  **The Most Exclusionary Requirement:**

  *   **Requirement #6 (Responsibility/Desert/Authority)** is arguably the most powerful filter. Many popular theories (especially strict Psychological Continuity views focusing on overlapping chains) struggle immensely with **Branching (Requirement #1)** when it comes to delivering a single, non-arbitrary verdict on obligation or authority. Who is bound by the promise? *Both* successors? (Problematic for exclusivity). *Neither*? (Implies survival doesn't matter). The *first*? (Arbitrary). The *most continuous*? (May be identical). Requirement #6 forces the theory to confront the practical implications of its metaphysics in the hardest case, often revealing deep ambiguities or requiring significant normative supplementation beyond the description of R itself. Requirement #1 (Branching) is the primary *source* of this difficulty for Requirement #6.

  This list provides the necessary criteria to evaluate theories functionally for your purpose, moving beyond the metaphysical impasse. The tensions identified, particularly around branching and responsibility/degrees and transitivity, highlight where the most significant philosophical work lies in developing a theory capable of grounding the normative practices (promises, directives, debts) central to your chapter.
