  First, they mention hockey bench minors and soccer red cards—both involve team-level penalties where an individual serves or triggers the punishment, but consequences affect everyone. Corporate fines similarly punish shareholders for an employee's crime. The user is asking which philosophical commitments these practices rely on: collective agency, transferable punishment, or pragmatism without desert. They also wonder what would change under strict individualism.

  Hmm, the user seems philosophically inclined but seeks concrete applications. They might be a student or scholar in philosophy/law, trying to connect theory to real-world examples. Their deeper need? Probably clarifying how abstract concepts (like desert, agency) map onto institutions—useful for academic writing or critical analysis. Unspoken curiosity: "Can we justify these practices ethically, or are they inherently flawed?"

  Breaking down the three options:  
  1. **Collective Agency**: Do teams/corporations *truly* act as single entities? In law, corporate personhood exists, but philosophically, it's contested. Sports teams act as units (fines, wins/losses are collective), but punishing a benched player might undermine this.  
  2. **Transferable Punishment**: Does guilt shift from offender to substitute? In hockey, the sent player isn't blamed; it's strategic. This fits "proxy suffering," not moral transfer.  
  3. **Pragmatism**: Deterrence and enforceability seem key. Punishing individuals alone might not deter teams (e.g., benching a star player hurts the team more than fining a scrub).  

  Under strict individualism:  
  - **Hockey**: They'd *have* to penalize only the guilty, even if it's the goalie (risking unfair outcomes).  
  - **Soccer**: Red cards already punish the guilty, but team disadvantage remains—so it's partly individual, partly collective.  
  - **Corporate Law**: Fines would target only culpable employees, not shareholders. But proving individual guilt is harder, and deterrence might weaken.  

  The user’s "actually need vs. fit with" is crucial. Practices *need* pragmatism (deterrence, feasibility) and collective responsibility (teams as functional units). They *fit with* but don’t require collective agency or transfer theory—those are justifications, not necessities.  

  If the user pushes for ethical implications: The tension lies in balancing fairness (individual desert) with effectiveness (collective consequences). Maybe they’re probing if these systems are defensible or hypocritical.  

  Final thought: Their examples cleverly expose how society prioritizes functionality over philosophical purity. Highlighting this might satisfy their deeper interest in institutional hypocrisy vs. necessity.
answer: |-
  The practices you describe—hockey bench minors, soccer red cards, and corporate liability—reveal a fascinating tension between **collective responsibility, pragmatic deterrence, and individual desert**. David Lewis uses these to probe whether we implicitly accept penal substitution (punishing one for another's wrong). Let's break down the philosophical commitments and consequences of shifting to strict individualism:

  ### Core Philosophical Commitments
  1. **Pragmatic Deterrence as Primary Driver**  
     - **What it presupposes**: Penalties target collectives (teams, corporations) because it's the most effective way to modify group behavior.  
     - **Why it's essential**:  
       - In hockey, punishing *any* player creates immediate team-wide consequences, deterring sloppy bench management.  
       - In corporations, fining the entity (rather than chasing individual employees) ensures accountability even when guilt is diffuse.  
       - **This doesn't require moral desert**—it’s utilitarian. The "innocent" (benched player, shareholders) bear costs to incentivize the group to self-police.  

  2. **Functional Collective Agency (Not Metaphysical)**  
     - **What it presupposes**: Teams/corporations act as *practical units* for rule enforcement, even if they aren’t moral agents.  
     - **Why it's operational, not ontological**:  
       - The *team* is penalized via a proxy (e.g., a benched player serving time). The substitute isn’t "guilty," but the team’s capacity is reduced.  
       - Corporate fines treat the *organization* as a liable entity under law, separate from individuals.  
       - **Doesn’t require believing the collective is the "real" agent**—only that it’s a useful fiction for regulation.  

  3. **Transfer of *Consequences* (Not Guilt)**  
     - **What it rejects**: The idea that *moral desert* is transferred (e.g., the benched player isn’t blamed).  
     - **What it accepts**: The *practical burden* of punishment shifts (e.g., shareholders lose money; teammates play short-handed).  
     - **Key distinction**: Guilt remains with the offender; suffering is distributed for efficiency.  

  ### What Happens Under Strict Individualism?
  If we demanded *only the guilty individual can be punished*:  
  - **Hockey**:  
    - The *specific player* who caused the "too many men" penalty must serve the bench minor—even if it’s the goalie. Teams couldn’t strategically send a less valuable player.  
    - **Result**: Unworkable chaos. Goalies serving minors would force teams to play with an empty net or burn their backup goalie. The rule’s deterrent effect would collapse.  
  - **Soccer**:  
    - The red-carded player is already punished individually (ejection). But the *team* playing short-handed is collective punishment.  
    - **Strict individualist fix**: Abolish the "man down" rule. Only the ejected player is barred, replaced by a substitute.  
    - **Result**: Red cards lose bite. Teams might incentivize "sacrificial fouling" by replaceable players.  
  - **Corporate Law**:  
    - Only employees who *directly committed* the crime could be fined/jailed. Shareholders wouldn’t pay.  
    - **Result**:  
      - Victims might go uncompensated (fines often fund restitution).  
      - Deterrence weakens: Executives could shield themselves, blaming low-level employees.  
      - Enforcement costs soar (proving individual guilt is harder than corporate liability).  

  ### Which Commitments Are Necessary?  
  | **Practice**          | **Pragmatic Deterrence** | **Functional Collective Agency** | **Transfer of Consequences** |  
  |------------------------|--------------------------|----------------------------------|------------------------------|  
  | Hockey Bench Minor     | **Necessary**            | Fits, not necessary             | **Necessary**                |  
  | Soccer Red Card        | **Necessary**            | Fits, not necessary             | **Necessary** (team suffers) |  
  | Corporate Fines        | **Necessary**            | **Necessary** (legal personhood)| Fits, not necessary          |  

  - **Pragmatic deterrence is indispensable**: All practices collapse without it.  
  - **Functional collective agency**: Required for corporate fines (legal personhood), but in sports, it’s just a convenient framework.  
  - **Transfer of consequences**: Essential in sports (someone must sit; the team must suffer). In corporations, fines could theoretically target only guilty individuals—but pragmatism makes this inefficient.  

  ### Conclusion  
  These practices **need** pragmatic deterrence and the transfer of practical consequences. They **fit with** (but don’t require) a view of collective agency. They **reject** the transfer of *moral guilt*. Strict individualism would force radical changes: hockey goalies serving penalties, soccer teams avoiding man-down disadvantages, and corporations escaping fines unless prosecutors pin blame on individuals. Yet this shift might undermine the very purpose of these rules—efficiently regulating group behavior. Lewis’s point stands: we tolerate penal substitution not because we believe in cosmic justice, but because it *works*.  

  **Final thought**: If we applied strict individualism consistently, we’d need entirely new systems—like "penalty goalies" in hockey or AI-driven corporate liability trackers. But as Lewis hints, we might already accept that punishing the innocent (proxy) is the price of order.
