answer: |-
  ## A Toast Rooted in Affection and Beauty

  [Raise your glass, warm smile] To [Couple's Names]. Forty years. It feels momentous, and it is. But tonight, I want to speak about *why* it’s momentous, not just that it is. Not just because it’s impressive, or admirable – though it is both – but because of what shines within it, something fundamental and irreplaceable.

  Think of their garden. Many of you have wandered its paths, breathed in its scents, marvelled at its quiet unfolding through the seasons. It stands as a local landmark now, a testament to decades of shared devotion. There’s something deeply valuable in that beauty itself, isn't there? Imagine it on a misty dawn, utterly empty and silent. Would its beauty vanish? Or would it persist, a quiet good in the world, simply for being what it is? That garden holds an intrinsic worth – a value that isn't borrowed from the joy it gives us, but resides within its own being, its colours, forms, and life. Its beauty is a good *in itself*.

  [Shift gaze to the couple] Now, look at these two. Forty years woven together. Raising two wonderful children. Facing down the long shadow of illness. Navigating the profound disconnection of estrangement in their middle years. Mourning the loss of a parent. And yes, nurturing that garden, year after patient year. If we tried to tally the value of this marriage like a ledger – adding the bright, joyful years, subtracting the painful, difficult ones – we’d miss the point entirely. That arithmetic fails.

  Because the worth of their forty years together isn’t found by adding up its sunny days and subtracting its storms. The value resides in the *whole* they’ve created – a complex, enduring unity. The shared affection, the deep human connection forged and tested through *all* of it – the celebrations *and* the trials – possesses a goodness that emerges from the union itself, not just from its individual moments. The hard times weren't merely obstacles to subtract; they became part of the tapestry of their affection, testing and ultimately deepening its unique texture. The whole – their marriage, this shared life – possesses a value greater, and fundamentally different, than any mere sum of its parts. Its goodness is organic, inherent in the bond itself.

  [Pause, invite reflection] Let’s try a thought experiment. Strip away all the external effects of their marriage for a moment. Set aside the wonderful children they raised, the comfort they gave friends, the example they set. Imagine this forty-year story unfolding in complete isolation, touching no one else. Does the value vanish? Or does something profound remain? Does the warmth of their shared affection, the quiet understanding of a glance across the room after all these years, the simple fact of this enduring bond – does that *in itself* still hold a precious, undeniable worth? I believe it does. Just like the beauty of an unseen garden, the intrinsic good of their human affection persists.

  And here’s the wonder: their marriage doesn’t just hold one kind of intrinsic good, it holds *two* of the greatest goods we know. It holds the deep, complex good of human affection – tested, proven, enduring. And it holds their shared appreciation and creation of beauty – embodied in that garden they nurtured together, side-by-side. These two fundamental goods – affection and beauty – aren't just neighbours in their lives; they’re intertwined. Their shared love for the earth, for growing things, for creating harmony and colour, reflects and nourishes their affection for each other. It’s within this union of affection *and* the shared appreciation of beauty that we find one of the best, most valuable wholes conceivable.

  [Couple's Names], your forty years together are more than an achievement. They are a testament to a profound and enduring intrinsic good – the complex, beautiful whole born of unwavering affection, enriched by your shared love of beauty, a good that shines by its own light, regardless of the sums or the consequences. It is a deep value in the world.

  So let us raise our glasses, not just to forty years passed, but to the *goodness* inherent in the bond you’ve created and sustained. To the intrinsic value of your affection, proven in fire and sunshine. To your shared appreciation of beauty, cultivated year after year. And to the unique, irreplaceable, organic whole that is your marriage – a true good in itself. To [Couple's Names]!

  ## Why this works for your audience

  *   **Philosophers:** Moore's core concepts are structurally embedded without direct citation or jargon:
      *   **Intrinsic Goods:** The garden's beauty "simply for being what it is" and the affection persisting in "isolation" clearly articulate intrinsic value.
      *   **Organic Unities:** Explicit rejection of the "ledger" or "arithmetic" approach ("sum of its parts") and emphasis on the "whole" and the "complex, enduring unity" embody the principle. The point about hardship being *part* of the valuable texture reinforces it.
      *   **Method of Isolation:** Explicitly used ("Strip away all the external effects... does something profound remain?").
      *   **The Two Goods & Their Combination:** Clearly identifies affection and beauty appreciation as the two core goods and highlights their intertwining as the "best conceivable whole."
      *   **Avoids Pitfalls:** No appeal to nature ("it's natural"), hedonism (value isn't *just* produced happiness, though happiness is present), or naturalistic fallacy (no derivation of "ought" from "is"). Value is located *in* the affection/beauty themselves.
  *   **Family & Neighbors:**
      *   **Concrete & Relatable:** Grounded in the specific, known story of the couple – the garden, the children, the illness, the estrangement. Everyone can picture these.
      *   **Emotional Resonance:** Focuses on the *feeling* of affection, the beauty of the garden, the triumph of endurance. Uses evocative language ("shadow of illness," "profound disconnection," "tapestry of affection," "quiet unfolding").
      *   **Clear Progression:** Moves from the familiar (the garden) to the core relationship, using the garden as a metaphor for the marriage's value. The "thought experiment" is phrased accessibly.
      *   **Celebratory Tone:** Warm, respectful, and ultimately uplifting, focusing on the enduring positive core.
  *   **Overall Flow:** Designed to be spoken in roughly 4 minutes. It moves from appreciation to philosophical claim (using the garden), deepens with the couple's story and organic unities, introduces the isolation test, combines the two goods, and ends with a clear, affirming conclusion. The language is elevated but accessible, aiming to move the heart while satisfying the mind.

  Deliver it with warmth, conviction, and eye contact – especially with the couple during the parts about their journey. It honours Moore's structure while celebrating the couple profoundly.
