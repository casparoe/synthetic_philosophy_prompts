prompt: |-
  I'm putting together an episode for a small student-run podcast — philosophy of death, no budget, mostly undergrads listening — and my guest next month is a philosopher who's been defending a reading of Zhuangzi that I half-agree with and half-suspect is a magic trick. Her line is that the famous scenes aren't arguments. The one where his wife dies and Hui Shi comes to console him and finds him squatting by the door banging on a tub and singing; the one where he uses a skull as a pillow and then asks it how it ended up like that; the friends who sing over a corpse and scandalise Confucius's disciples; the deathbed scene where he tells his disciples not to bother with an elaborate funeral because the sky and earth will serve as his coffin and the whole of things as his grave-goods. On her view we've all been taught to read these as a doctrine — death is one more transformation, like the turn of the seasons, so grief is a category mistake — and that gets the direction of explanation backwards. Grief is a practice with a script, and what Zhuangzi does is run a different practice in the same slot: the drumming does the work a lament would have done. The philosophy is in the substitution, not in a premise. She also thinks the seasonal-transformation line is a red herring that only ever gets trotted out for the deaths we're already comfortable with, and that it does no work at all for a child's death or a stupid, violent one — which is where I think the whole thing has to earn its keep.

  So write me the questions I should put to her. I want at least one that pins down what 'counter-ritual' is supposed to mean when the audience is the other mourners rather than the dead — is the performance addressed to them, and if so what is it meant to do to them; at least one on the passage in the same chapter as the butterfly dream where lifespans get scrambled (the long-lived Peng Zu dying young, the infant who died outliving everyone) and on the 'how do I know' argument built on the girl taken from the border country to a king's palace who wept at first and later was glad — does that argument belong to the counter-ritual reading, or is it a rival, more argument-shaped strategy the text can't seem to do without; and at least one that makes her actually spend the seasonal analogy on a death that doesn't complete a cycle. And one question she can't escape by saying 'that's the therapeutic point' — if grief is just a script, why does the text work so hard to talk the reader out of it? A counter-ritual doesn't need a treatise.

  Give it back in four labelled sections, in this order: 'The view, plainly' — two questions that force her to state the counter-ritual reading without leaning on the word 'therapy', each with the follow-up I'd ask if she just repeats herself (about 150 words); 'Where it has to earn its keep' — three or four questions on the hard cases above, follow-ups included (about 350 words); 'The self-undermining worry' — two questions about why a mere substitution needs so much argumentative scaffolding (about 150 words); and 'The one I'll close on' — a single question, no follow-up, the one she'd have to answer without falling back on her favourite move. Keep the questions in her vocabulary rather than mine — she says 'script' and 'slot', so use those — and dont pad them with setup.
reasoning: |-
  Okay, the user is creating a podcast episode on the philosophy of death, focusing on Zhuangzi. Their guest has a unique interpretation that challenges traditional readings. The user half-agrees but suspects it might be a "magic trick." They need pointed questions to probe the guest's views effectively.

  First, I need to understand the guest's argument. She claims that Zhuangzi's death scenes aren't arguments but counter-rituals—substituting one practice (grief rituals) with another (like drumming). The philosophy lies in the act, not in doctrines like death as a natural transformation. The user is skeptical about how this handles hard cases, like a child's death, and why there's so much argumentative text if it's just about substitution.

  The user wants questions in four sections. Let me break down each part. 

  For "The view, plainly," I need two questions forcing the guest to explain counter-rituals without using "therapy." Follow-ups if she repeats herself. Key terms: "script" and "slot." Example: Ask how drumming replaces lament, then follow up on what makes it a ritual substitute rather than just odd behavior.

  Next, "Where it has to earn its keep" requires questions on hard cases. The user mentioned Peng Zu, the border girl, and deaths that aren't cyclical. Need to challenge the seasonal analogy. Also, the border girl argument seems logical; does it conflict with the counter-ritual approach? Follow-ups should push for concrete examples, like a child's death.

  "The self-undermining worry" section questions why there's so much text if it's about substitution. If counter-rituals are the core, why the arguments? Follow-up on whether the text undermines itself by using doctrines.

  Finally, "The one I'll close on" needs a single, no-escape question. Must prevent her from using her "therapeutic point" fallback. Possibly ask about the drumming scene: If the ritual is the philosophy, why include Hui Shi's argument? 

  I should ensure all questions use the guest's terms: "script," "slot," "counter-ritual." Avoid setup, be direct. The user wants to avoid padding. Also, the guest might dodge by saying "therapy," so follow-ups must be prepared to press further.

  Deep needs: The user might be concerned that the guest's interpretation avoids addressing the emotional weight of death, especially in tragic cases. They want to expose whether the theory holds under pressure or if it's an intellectual evasion. The podcast audience is undergrads, so questions need clarity without jargon. The user also seeks to balance agreement with skepticism, ensuring a rigorous discussion that doesn't let the guest off easy.
answer: |-
  Here are your interview questions, structured as requested and using your guest's terminology:

  **I. The view, plainly**  
  1.  When Zhuangzi drums instead of lamenting his wife, you call this a "counter-ritual." Without using "therapy," *what specific social or existential script is his drumming directly substituting for in that moment*, and what defines it as occupying the same "slot" as the expected lament?  
      *   *(If she repeats "it processes grief" or similar):* **But what makes it a *ritual* substitute rather than just peculiar personal behavior? What communal or symbolic function of the lament script does the drumming explicitly take over?**

  2.  If the philosophy *is* the substitution itself, not a doctrine about death, *how should we describe the difference between someone performing Zhuangzi’s counter-ritual authentically versus someone merely aping the action because they heard it was "enlightened"?* What constitutes "running the script" correctly?  
      *   *(If she focuses on internal state):* **Doesn't that reintroduce a hidden premise or doctrine about the *correct* internal state, undermining the idea that the act itself is primary?**

  **II. Where it has to earn its keep**  
  3.  Take the story of the infant who dies immediately but is said to have lived a full life, or Peng Zu dying young. This seems like an *argument* about perspective and value, not a ritual substitution. *Does this passage belong to your counter-ritual reading, or is it a fundamentally different, argument-driven strategy within the text?*  
      *   *(If she integrates it):* **How does scrambling lifespans function as a *ritual act*? What script is it substituting for?**  
      *   *(If she separates it):* **Doesn't the text's reliance on this kind of argument elsewhere weaken the claim that counter-ritual is the *primary* mode for engaging death?**

  4.  The parable of the border girl seems like a direct argument *for* the transformation view: we fear the unknown, but it may be good. *If the seasonal-transformation doctrine is a "red herring" for hard deaths, why does the text deploy this specific, argument-shaped analogy precisely when discussing fear of death? Doesn't this suggest the text *does* rely on doctrines when counter-ritual might be insufficient?*  
      *   *(If she downplays it):* **Is the border girl analogy itself *also* a counter-ritual? If so, how? If not, doesn't its presence complicate the claim that argument is secondary?**

  5.  You argue the seasonal analogy fails for deaths that feel senseless or incomplete, like a child's death or a violent one. *Can you apply the counter-ritual reading concretely to such a case? What specific mourning script could be substituted, and what would that substitution *do* for the mourners or community that the grief script wouldn't?*  
      *   *(If abstract):* **Imagine Zhuangzi at *that* graveside. What counter-ritual replaces the wailing? What makes it a viable response to profound rupture, not just evasion?**

  6.  If ritual scripts structure our experience of loss, *what script does Confucius's disciples being scandalized by the friends singing over a corpse occupy? What is the counter-ritual *doing* to *them* as the audience? Is it aimed at disrupting *their* script, and if so, to what end?*  
      *   *(If therapeutic for singers):* **But the text highlights the scandal *caused*. How does the performance actively reshape the *observers'* relationship to death rituals?**

  **III. The self-undermining worry**  
  7.  If grief is just a script and the point is substitution (like drumming for lamenting), *why does the text contain so much explicit argumentation and analogy (like the seasons, lifespans, border girl) seemingly designed to talk the reader *out* of grief? Doesn't this suggest it *is* trying to prove a doctrine?*  
      *   *(If preparatory):* **Doesn't the sheer volume and variety of these arguments imply they are doing more than just clearing the ground for a counter-ritual? Could they be attempts to *justify* the substitution as rational?**

  8.  You claim the philosophy is *in* the substitution. *If that's the case, why isn't the drumming scene alone sufficient? Why the surrounding dialogues with Hui Shi debating the transformation view, or the treatise-like passages? Doesn't the need for this scaffolding undermine the idea that the counter-ritual itself is philosophically self-sufficient?*

  **IV. The one I'll close on**  
  9.  In the drumming scene, Zhuangzi explicitly engages Hui Shi in an argument *about* the transformation of things, *after* performing the counter-ritual. If the ritual substitution is the philosophy, what essential work is that subsequent doctrinal argument doing that the drumming alone couldn't accomplish?

  ---

  **Key features addressed:**  
  *   **"Counter-ritual" definition & audience:** Covered in Q1 (follow-up) and explicitly in Q6.  
  *   **Scrambled lifespans & Border girl:** Directly tackled in Q3 and Q4.  
  *   **Seasonal analogy on hard deaths:** Specifically demanded in Q5.  
  *   **Self-Undermining / Why argue?:** Core of Q7 & Q8.  
  *   **No "therapy" escape:** Mandated avoidance in Section I, and the closing Q9 prevents retreat by focusing on the argument *alongside* the ritual.  
  *   **Guest's Vocabulary:** Uses "script," "slot," "counter-ritual," "substitution," "performance" throughout.  
  *   **No Padding:** Questions are direct and presuppose familiarity with the text/arguments.  
  *   **The Hard Close:** Q9 targets the coexistence of counter-ritual *and* doctrine in the most famous death scene, forcing reconciliation without dismissing either.
