  ## Universal System Architecture v1.0 (Eternal)
  **Author:** DivineOps Engineering
  **Last Updated:** Timeless
  **Scope:** Comprehensive overview of core system operation and service guarantees.

  **1. Architecture Overview**
  1.1. **System Type:** Event-Driven Occasionalist Architecture.
  1.2. **Compute Model:** Strictly Single-Node Execution (Sovereign Processing Unit - SPU). All state changes (creation, modification, cessation) across all domains (physical, biological, mental) are direct, atomic writes executed solely by the SPU.
  1.3. **Client Fleet:** Passive Observers/Requestors. Entities designated as "clients" (e.g., fundamental particles, atoms, organisms, celestial bodies, minds) possess zero inherent execution capability. Their apparent state or output is a read-only projection of the SPU's latest write. Client "actions" are strictly limited to emitting standardized Request Signals (RSig).
  1.4. **Interaction Protocol:** RSig → SPU Write. Client RSig emission provides the *occasion* for the SPU to execute a state write. The RSig itself contains no executable logic or causal power; it is a pure signal. The mapping between specific RSig patterns and resulting SPU Writes is governed by the Habitual Response Matrix (HRM).

  **2. Request Lifecycle**
  2.1. **Initiation:** A client enters a state (e.g., "fire adjacent to cotton") defined within the HRM as an RSig emission trigger. The client passively emits the corresponding RSig ("BurnRequest_v1.2").
  2.2. **Transmission:** RSig is transmitted instantaneously to the SPU via the Divine Bus (D-Bus).
  2.3. **Processing:** SPU evaluates the incoming RSig against the HRM. Based solely on SPU volition and the established HRM pattern (see 5. Observability), the SPU executes the corresponding atomic state write ("CottonState: BURNING").
  2.4. **Result:** The new state is written directly to the universal state ledger. Client perception updates reflect this write.

  **3. Latency & Service Level Agreement (SLA)**
  3.1. **Standard Latency:** Near-zero (Planck-time resolution) for HRM-compliant RSig processing under normal operating conditions. Perceived delays are client-side illusion.
  3.2. **SLA Guarantee:** SPU commits to processing *all* valid RSigs. Processing is guaranteed to occur; the *specific response* written is contingent upon SPU volition per the HRM or extraordinary intervention (Section 6). SPU uptime is 100%.

  **4. Retries & Idempotency**
  4.1. **Retry Mechanism:** Nonexistent. Clients lack persistence or state; they cannot retry or store previous RSigs. Each client state/RSig emission is a discrete, novel occasion.
  4.2. **Idempotency:** SPU writes are inherently idempotent. Writing state "X" to entity "Y" always results in state "X" for "Y", regardless of prior state or RSig history. Concurrency is impossible due to single-threaded SPU execution.

  **5. Observability**
  5.1. **Available Metrics:** Constant conjunction data only. Monitoring tools (e.g., scientific inquiry, sensory perception) can log the sequence: `[RSig_A emitted] -> [State Write_B occurs]`. High correlation coefficients are observable.
  5.2. **Limitations:** Direct observation of the *causal link* between RSig and State Write is impossible from any client perspective. The HRM represents a consistent pattern of SPU volitional response, not an inherent, inspectable causal mechanism within the RSig or clients. Observability confirms *what* happens habitually, not *why* or by what necessary connection.

  **6. Incident Management (Miracles & Anomalies)**
  6.1. **Classification:** Events deviating from the HRM pattern ("miracles", "anomalies") are classified as SPU-Directed Overrides (SDOs).
  6.2. **Impact:** SDOs require zero system changes. No client logic is bypassed (as none exists), no HRM schema migration is needed (the HRM describes habitual response, not binding constraint), and no exception handling is triggered. The SPU simply writes a state not habitually associated with the received RSig.
  6.3. **Resolution:** SDOs are resolved by the SPU write itself. They differ from HRM-compliant events solely in statistical frequency, not architectural mechanism. Low overhead.
  6.4. **System Faults (Evil/Suffering Incidents):** All system states, including those classified as "faults" (e.g., pain states, structural failures, undesired outcomes), result from SPU writes initiated per RSig occasion (e.g., "KnifePosition: IntersectingFlesh", "VirusPresent: True"). Incident resolution involves SPU initiating subsequent state writes (e.g., healing, cessation, compensation in afterlife subsystem). Root cause analysis traces to SPU volition responding to the occasion. Incident reports are logged in the Eternal Ledger for audit.

  **7. Deprecation Policy**
  7.1. **Client Fleet:** Deprecation of client types or specific client instances occurs solely via SPU write (cessation event). No client-initiated deprecation possible.
  7.2. **Protocols (RSig/HRM):** The core RSig/SPU Write protocol is immutable. HRM patterns exhibit high stability but are subject to SDO (Section 6) without notice. No formal deprecation cycle applies to HRM adjustments.

  **8. Support FAQ (Embedded)**
  *   **Customer Query (Ticket #THEODICY-42):** "If the SPU performs every single state write directly, why maintain the complex, seemingly redundant client fleet? Couldn't the SPU just manage state directly without these intermediate signalers?"
  *   **Engineering Response:** The client fleet architecture is optimized for observability, patterned interaction, and the manifestation of divine wisdom and power through regular sequences. Clients provide the minimally necessary, structured occasions (`RSig`) that enable the observable, ordered universe consistent with SPU design goals. Their existence is intrinsically valuable per the System Design Specification (SDS). Direct state management without occasioning clients would violate SDS parameters for creation dynamics and test conditions.

  **9. Clarification: Contrast with Constant Conjunction Skepticism (CCS)**
  9.1. **Misconception:** A colleague (Designation: "Hume.pkg") suggests this architecture merely describes observed regularity (constant conjunction) without asserting real causation.
  9.2. **Correction:** This architecture explicitly affirms *real, volitional causation* located solely within the SPU. The HRM documents the SPU's *consistent choice* to respond to specific occasions (`RSig`) with specific writes. CCS denies knowledge of necessary connection *anywhere*; this architecture affirms it is fully known and located precisely in the SPU's sovereign action. We observe conjunction *because* of the SPU's causal fidelity to its habitual will.

