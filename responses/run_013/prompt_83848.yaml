     - Record points.

  3. **Shock (after Round 3):**
     - The facilitator announces: "The environment has changed. The pattern that will earn points from now on is [New Pattern, e.g., Yellow, Purple, Yellow]. However, your group's Pattern Board still has the old pattern. You can change your Pattern Board to the new pattern by a unanimous vote at the end of a round. Until you change, the Monitor will enforce the pattern on your board."

  4. **Rounds 4-6 (Phase 2):**
     - The rules are the same as in Phase 1, except:
          - Points are awarded based on the new pattern (announced by the facilitator), not the old pattern on your board.
          - Specifically, if you play the color that matches the new pattern for that round, you earn 2 points.
          - But the Monitor enforces the old pattern (from your board) and may fine you if you don't play the old pattern color.
     - At the end of any round (after scoring and before the next round), your group can hold a vote to change the Pattern Board to the new pattern. Everyone must agree (raise hands secretly or openly). If unanimous, change the board. Then in the next round, the Monitor enforces the new pattern.

  **Scoring Summary:**
  - For any round:
     - Playing the new pattern color (in Phase 2) or the pattern on your board (in Phase 1) yields 2 points.
     - Playing any other color yields 0 points.
     - If fined, subtract 1 point (both for the fined player and the Monitor if they issued the fine).

  **Facilitator Timeline:**
  - 0-5 min: Introduction, form groups, distribute materials.
  - 5-15 min: Explain rules (do an example round if needed).
  - 15-17 min: Phase 1 pattern choice (groups discuss and write pattern).
  - 17-26 min: Round 1 (5 min: choose, reveal, Monitor fines, record).
  - 26-35 min: Round 2 (same).
  - 35-44 min: Round 3 (same).
  - 44-46 min: Shock announcement (tell new pattern).
  - 46-55 min: Round 4.
  - 55-64 min: Round 5.
  - 64-73 min: Round 6.
  - 73-90 min: Debrief.

  **Debrief Script (Order of Moments):**
  1. **Pattern Choice (Phase 1):**
     - "How did your group decide on the initial pattern?" 
     - Concept: Arbitrary conventions for coordination.

  2. **Enforcement in Phase 1:**
     - "Did you have any deviations in the first few rounds? How were they handled by the Monitor?"
     - "Did the Monitor always fine? Why or why not?"
     - Concepts: Norm enforcement, cost of enforcement (second-order problem), tolerance of deviance (if some deviations were not fined).

  3. **Shock and Individual Response:**
     - "When the environment changed, what did you do in round 4? Did you play the old pattern or the new one? Why?"
     - Concept: Incentive to deviate when the norm becomes suboptimal.

  4. **Enforcement in Phase 2:**
     - "What happened to players who played the new pattern? Were they fined? How did that feel?"
     - "How did the Monitor feel about fining players who were trying to adapt?"
     - Concept: Enforcement blocking adaptation.

  5. **Pattern Change Attempt:**
     - "Did your group try to change the pattern? What happened in the vote?"
     - "If you changed, how did it happen? If not, why not?"
     - Concept: Collective action problem (unanimity requirement), rigidity of norms.

  6. **Internalization:**
     - "Did anyone follow the old pattern in Phase 2 even when they knew the new one was better and they might not be fined? Or was it only the fear of the fine?"
     - Concept: Lack of internalization in the game vs. real culture.

  7. **Wrap-up:**
     - Map to tight/loose: 
          - Tight cultures: strong enforcement, low tolerance of deviance, slow to change.
          - Loose cultures: weak enforcement, high tolerance, faster change.
     - But note: norm strength (enforcement) and tolerance (what is considered deviant) can vary independently.

  **Weaknesses in the Mapping:**
  - The unanimity rule for change is artificial. Real change can happen with critical masses or elites.
  - The cost of enforcement is explicit and monetary-like (points), while in reality it might be social or emotional.
  - The game doesn't simulate the emergence of norms over time; it starts with a discussion.

  **Final Printable Materials:**
  - One page with:
     - Color cards (5 per player: R, B, G, Y, P) - print multiple sets.
     - Fine tokens: a grid of 20 small squares labeled "FINE".
     - Pattern Board: a sheet with "Round 1: _____, Round 2: _____, Round 3: _____" and then "Changed to new pattern? [ ] Yes [ ] No" (for after shock).
     - Score sheet: table with rounds and points.
     - Rule sheet (abbreviated).

  This design meets the constraints and aims to create the experiences you described.
answer: |-
  ### **The Coordination Trade-Off Game**  
  **Core Idea**: Players experience the tension between enforcing norms (enabling coordination) and the cost of blocking change when norms become maladaptive. The game isolates two key variables: **norm strength** (how strictly deviations are punished) and **tolerance of deviance** (what counts as "deviance" in the first place). Enforcement is costly, creating a second-order free-rider problem.  

  ---

  ### **Rules and Setup**  
  **Materials** (printable from one page per group):  
  - **Color Cards**: 5 cards per player (♠️ Spade, ♥️ Heart, ♦️ Diamond, ♣️ Club, ⬡ Hexagon).  
  - **Fine Tokens**: 10 red tokens per group (each represents a 1-point penalty).  
  - **Pattern Board**: A sheet showing the current "official" pattern (e.g., "Round 1: ♠️, Round 2: ♥️").  
  - **Score Sheets**: For tracking points.  
  - **Voting Slips**: For pattern-change votes (blank slips of paper).  

  **Group Size**: 4–5 players. One player per round is the **Monitor** (rotates each round).  

  #### **Phase 1: Establishing Norms (Stable Environment)**  
  1. **Pattern Setup** (2 mins):  
     - Groups privately choose a 3-round pattern (e.g., ♠️-♥️-♦️) and write it on their Pattern Board. *No input from facilitators.*  
  2. **Rounds 1–3** (4 mins per round):  
     - **Play**: Each player secretly chooses a card and reveals simultaneously.  
     - **Scoring**:  
       - Match the pattern: **+2 points**.  
       - Deviate: **0 points**.  
     - **Enforcement**:  
       - The Monitor *must* give a fine token to **any player whose card does not match the pattern**.  
       - **Cost**: The Monitor loses **1 point** per fine issued.  
       - Fined players lose **1 point** (net: -1 for deviation + fine).  
     - **Monitor Rotation**: Rotate clockwise after each round.  

  #### **Shock Announcement** (After Round 3):  
  Facilitator: *"The environment changed. The most beneficial pattern is now ♣️-⬡-♣️. Your group’s Pattern Board still shows your old pattern. To change it, you’ll need a special vote later."*  

  #### **Phase 2: Adapting to Change (Unstable Environment)**  
  1. **Rounds 4–6** (5 mins per round):  
     - **Scoring Change**:  
       - Playing the *new* pattern (♣️-⬡-♣️) earns **+2 points** (regardless of group’s Pattern Board).  
       - Playing the *old* pattern earns **0 points**.  
     - **Enforcement**:  
       - The Monitor *still* fines deviations **from the old pattern** (losing 1 point per fine).  
       - Fined players lose 1 point (even if playing the new pattern).  
     - **Voting Opportunity** (After each round):  
       - Groups hold a vote to change their Pattern Board to the new pattern.  
       - **Unanimous agreement required** (secret ballot). If passed, the new pattern is enforced next round.  

  #### **Payoff Scheme**  
  | Action                          | Points Earned |  
  |---------------------------------|--------------|  
  | Play matches current pattern    | +2           |  
  | Play deviates                   | 0            |  
  | Fined (any reason)              | -1           |  
  | Monitor issues a fine           | -1 per fine  |  

  **Example**:  
  - In Phase 2, playing the new pattern (♣️) when the old pattern is (♠️):  
    - If not fined: +2 points.  
    - If fined: +2 (for new pattern) -1 (fine) = **+1 point**.  
  - Playing the old pattern (♠️): 0 points (no fine).  

  ---

  ### **Facilitator Timeline** (Total: 50 mins)  
  1. **Setup** (5 mins):  
     - Split into groups. Distribute materials.  
     - Explain rules *without* using theory terms (e.g., "Your goal is to earn points by matching your group’s pattern. Monitors must fine mismatches but lose points for each fine.").  
  2. **Phase 1** (15 mins):  
     - Groups choose pattern (2 mins).  
     - Rounds 1–3 (4 mins each).  
  3. **Shock** (2 mins): Announce new pattern.  
  4. **Phase 2** (18 mins):  
     - Rounds 4–6 (5 mins each, include voting time).  
  5. **Transition to Debrief** (10 mins): Groups tally scores.  

  ---

  ### **Debrief Script**  
  **Order**: Walk through the game chronologically, then map to theory.  

  1. **Pattern Choice (Phase 1)**:  
     - *Ask*: "How did your group decide on the initial pattern? Was it easy or contentious?"  
     - **Concept**: Arbitrary conventions emerge to solve coordination problems.  

  2. **Enforcement in Phase 1**:  
     - *Ask*: "Did Monitors always fine deviations? Why or why not? How did it feel to pay to enforce?"  
     - **Concept**: **Norm strength**—high enforcement enables coordination but costs enforcers (second-order problem).  

  3. **Shock Response**:  
     - *Ask*: "When the rules changed, did anyone play the new pattern immediately? What happened?"  
     - **Concept**: Incentives to deviate emerge when norms become maladaptive.  

  4. **Voting in Phase 2**:  
     - *Ask*: "Did your group change the pattern? If not, why? If yes, was it hard to get everyone to agree?"  
     - **Concept**: **Collective action problem**—unanimity requirement mirrors real barriers to change.  

  5. **Tolerance vs. Enforcement**:  
     - *Ask*: "Were some 'deviations' in Phase 1 not fined? Were they seen as harmless?"  
     - **Concept**: **Tolerance of deviance** is distinct from norm strength (e.g., groups may strongly enforce major deviations but ignore minor ones).  

  6. **Internalization Gap**:  
     - *Ask*: "Did anyone follow the pattern *only* to avoid fines? Did anyone follow it willingly?"  
     - **Concept**: The game lacks **internalization**—real cultures rely on intrinsic motivation, not just penalties.  

  7. **Trade-Off**:  
     - *Highlight*: "In Phase 1, enforcement helped you coordinate. In Phase 2, that same enforcement blocked change. The 'cost' of coordination is rigidity."  
     - **Map to Theory**:  
       - **Tight cultures**: High enforcement → coordination success but adaptation failure.  
       - **Loose cultures**: Low enforcement → adaptation ease but initial coordination failure.  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Problem**: Groups coordinate too easily in Phase 1 (no deviance).  
     - **Why**: Social pressure or quick consensus.  
     - **Solution**: *Do nothing*. Note in debrief: "Real coordination is often messy—your group avoided this by prior discussion."  

  2. **Problem**: Monitor refuses to fine a friend.  
     - **Why**: Social bonds override rules.  
     - **Solution**: *Do nothing*. Use in debrief to discuss how real enforcement is influenced by relationships.  

  3. **Problem**: Player defects "for fun."  
     - **Why**: Boredom or testing boundaries.  
     - **Solution**: *Do nothing*. Ask in debrief: "Did intentional deviance reveal anything about enforcement limits?"  

  4. **Problem**: Group invents informal enforcement (e.g., peer pressure).  
     - **Why**: Avoid Monitor costs.  
     - **Solution**: *Do nothing*. Highlight in debrief: "You created a 'looser' system—this mirrors real self-organized enforcement."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Timescales and Emergence**:  
     - Real tight/loose norms evolve from subsistence threats (e.g., famine, war) over generations. The game compresses this into a 10-minute shock.  
     - **Mitigation**: In debrief, clarify: "Real tightness is unchosen—it emerges from survival pressures we can’t simulate."  

  2. **Ownership of Enforcement**:  
     - Players see enforcement as a "game rule," not a cultural value they internalize. Real norms feel "natural."  
     - **Mitigation**: Emphasize post-game: "In real life, you wouldn’t calculate fines—you’d feel shame or pride."  

  3. **Internalization**:  
     - The game cannot simulate intrinsic motivation. Fines are the only driver.  
     - **Mitigation**: Stress: "This is why internalization is key—cultures couldn’t function if everyone needed a enforcer."  

  ---

  ### **What Would Change My Mind**  
  1. **If Norm Strength and Tolerance Are Inseparable**:  
     - **Pilot Test Flag**: If groups *never* distinguish minor vs. major deviations (e.g., always fine all mismatches).  
     - **Rebuild**: Add explicit "tolerance thresholds" (e.g., Monitors can set "acceptable" deviations pre-shock).  

  2. **If Enforcement Cost Doesn’t Bite**:  
     - **Pilot Test Flag**: If Monitors *never* avoid fining to save points.  
     - **Rebuild**: Increase fine cost (e.g., -2 points per fine) or add social stigma (e.g., fined players can retaliate).  

  3. **Weakest Mapping**:  
     - **Voting Mechanism**: Unanimity is artificial. Real change often hinges on power dynamics, not consensus.  
     - **Why It’s Weak**: It oversimplifies institutional inertia. In rebuild, replace voting with a "critical mass" rule (e.g., 3+ players must defy simultaneously).  

  ---

  **Final Design Logic**: The game forces a trade-off: Punishment enables coordination (Phase 1) but blocks adaptation (Phase 2). By making enforcement costly and separating "what to enforce" (tolerance) from "how strictly" (strength), it isolates key variables. The debrief links visceral frustrations ("Why couldn’t we change?") to theory. Run it as-is, then iterate based on where groups struggle.
