prompt: |-
  So here's my situation. I'm a backend engineer at a mid-size SaaS company, no philosophy or econ background beyond one micro class I barely passed, and I've somehow ended up as the guy who writes the one-pager whenever product or sales wants us to do something because a competitor did it first. Cut QA to ship weekly, match the other guys free tier, add the same aggressive trial popups, bid up Google Ads, loosen the data retention thing — they all arrive with the same sentence, "we have to or we lose." Sometimes that's true. Sometimes it's a thing someone already wanted to do.

  What I want is a procedure I can actually run in about 30 minutes before these reviews, grounded in whatever that literature actually says rather than vibes. The questions to ask in order, what counts as a sufficient answer to each, where it terminates with a clear "decline," and where it hands the call to a person because it's a values question (how much margin do we trade, who eats the cost, do we care what this does to the customers who won't churn). My VP signs off, so it has to end in a recommendation she can argue with, not a lecture.

  I know there's alot of writing about this — Moloch, multipolar traps, races to the bottom, tragedy of the commons, arms races, positional goods where everyone pays more and nobody's share moves, and the one where if a hundred people can each unilaterally do the risky thing, it happens no matter what any of them thinks is wise (unilateralist's curse, I think?). And I have a vague memory that races don't always go down — sometimes one big strict market drags everyone up instead. So there needs to be a step for telling which direction it's actually going and whether the "race" is even real, or just a story attached to a decision someone already made.

  Then run it on three: (1) our ad spend, where CAC has doubled over two years and our market share hasn't budged; (2) a competitor cut prices 30% and sales wants us to match; (3) the engineering salary bidding war. I want at least one where the honest answer is "yeah, it's a real trap, there's no clever fix, you pay or you leave," and I want to be told where the procedure is just rationalizing something leadership already decided. And say what it can't do.
reasoning: |-
  We are designing a 30-minute decision procedure for evaluating "competitive necessity" claims. The procedure should be grounded in game theory and economic concepts, and output one of three recommendations: (1) Decline, (2) Escalate to leadership (for values/margin trade-offs), or (3) Proceed (with caution, because it's a trap).

  The procedure will have a series of questions. Each question must be answered with a clear "Yes" or "No" (or sometimes with a specific criterion) to move to the next step. We want to avoid open-ended analysis.

  Key concepts we'll reference:
  - **Multipolar Trap / Race to the Bottom**: When multiple actors are forced to make individually rational decisions that lead to a collectively worse outcome (e.g., advertising spend, price wars).
  - **Tragedy of the Commons**: When individuals acting in their own self-interest deplete a shared resource.
  - **Positional Goods**: Goods whose value is determined by relative position (e.g., advertising in a crowded space).
  - **Unilateralist's Curse**: When the risk of a harmful event is increased because many actors have the opportunity to trigger it independently.
  - **Race to the Top**: When competition leads to improved standards and benefits for all (e.g., strict regulations that force higher quality).

  The Procedure:

  **Step 1: Verify the Competitive Claim**
     - Question: "Is there clear evidence that the competitor's action is directly causing (or will cause) a measurable loss of customers, revenue, or market share for us?"
     - Sufficient Answer: Objective data (e.g., churn spike, lost deals, market share drop). Anecdotes or fear are insufficient.
     - If No → **Decline** (stop here; no proven threat).
     - If Yes → Proceed to Step 2.

  **Step 2: Assess the Imitation Necessity**
     - Question: "Is the competitor's action easily replicable by us without disproportionate cost or fundamental change to our product/values?"
     - Sufficient Answer: 
          - Technical feasibility: Can we do it without major engineering or operational burden?
          - Cost: Is the cost of replication less than the projected loss from not acting?
          - Values alignment: Does it align with our core product values? (If not, we note it for escalation.)
     - If No (too costly or misaligned) → **Escalate to Leadership** (for a values/cost trade-off).
     - If Yes → Proceed to Step 3.

  **Step 3: Determine the Game Dynamics**
     - Question: "What are the likely game-theoretic dynamics of this action? Is it a: 
          a) One-time move (competitor made a unique change that won't be repeated)?
          b) Race to the Bottom (e.g., price wars, advertising, feature bloat)?
          c) Race to the Top (e.g., quality improvements, security, sustainability)?
          d) Tragedy of the Commons (depleting a shared resource like user trust)?
          e) Positional Arms Race (where relative position matters, e.g., ad bidding)?"
     - How to answer: 
          - Look for characteristics:
              - Race to the Bottom: Actions are costly, easily imitated, and lead to diminishing returns for all (e.g., advertising).
              - Race to the Top: Actions are costly but create rising standards that benefit the industry (e.g., security).
              - Tragedy of the Commons: Individual gains lead to collective destruction (e.g., spammy notifications eroding user trust).
              - Positional: Only the relative position matters (e.g., being the top bidder in ads).
     - If (a) One-time move → **Proceed** (but with caution; it might be a trap) but note: if it's a one-time move, why is it critical? Revisit Step 1.
     - If (b), (d), or (e) → Proceed to Step 4 (Trap Assessment).
     - If (c) Race to the Top → **Proceed** (but note it's positive; however, we still need to assess cost in Step 2).

  **Step 4: Trap Assessment (for Races to the Bottom, Tragedies, Positional Races)**
     - Question: "Is there a cooperative or regulatory mechanism that can prevent the race (e.g., industry standards, strong network effects, high barriers to exit the race) or a way to differentiate to avoid the trap?"
     - Sufficient Answer: 
          - Cooperative mechanism: Are there industry norms or partnerships that can stabilize the situation?
          - Differentiation: Can we pivot to a different value proposition (e.g., quality over price) to avoid the race?
          - Regulatory: Is there an external force (e.g., regulation) that will stop the race?
     - If Yes (there is a way out) → **Escalate to Leadership** (with the alternative strategy).
     - If No (no way out; it's a trap) → **Proceed** (but note: we are entering a trap; leadership must decide if they want to play).

  **Step 5: Cost-Benefit and Exit Strategy (for cases where we proceed into a trap)**
     - Question: "What is the exit strategy and the maximum cost we are willing to bear? (This must be set by leadership.)"
     - This step is not for the 30-minute analysis but for escalation. The output is to **Escalate to Leadership** with the assessment that this is a trap and require them to set a cost limit and exit criteria.

  **Summary of Outputs:**
  - **Decline**: Step 1 fails (no evidence) or Step 2 fails (infeasible and not worth the cost) without values conflict.
  - **Escalate to Leadership**: 
      - Step 2: If the action is feasible but conflicts with values or is too costly (and the threat is real), or 
      - Step 4: If there is a cooperative/differentiation alternative to the race, or 
      - Step 5: For setting limits when entering a trap.
  - **Proceed**: 
      - Step 3: If it's a Race to the Top, or 
      - Step 4: If it's a trap but no alternative exists and leadership must decide to play.

  Now, let's run the three examples:

  ---

  **Example 1: Ad Spend (CAC doubled, market share flat)**
  - Step 1: **Yes** - We see competitors are bidding more, and our ad performance has dropped (e.g., higher CPC, lower conversion). This is causing a loss in lead volume.
  - Step 2: **Yes** - We can bid more. It's operationally easy (just budget). But note: it's costly and doesn't align with our efficiency value? (But we don't have a strict value against advertising.) → Proceed.
  - Step 3: **Positional Arms Race** (also Race to the Bottom) - Only the top positions get the clicks, and we're in a bidding war. It's a classic positional good with diminishing returns.
  - Step 4: **No** - No cooperative mechanism (we can't collude with competitors). We could differentiate (e.g., content marketing, SEO) but that's a long-term strategy and doesn't address the immediate threat. So no short-term way out.
  - Output: **Escalate to Leadership** (Step 4) with the assessment that this is a trap. We must set a maximum CAC we are willing to accept and an exit plan if it exceeds.

  **Example 2: Competitor cut prices 30%, sales wants to match**
  - Step 1: **Yes** - We have evidence: lost deals to the competitor, or deals asking for discounts.
  - Step 2: **Yes** - We can cut prices. But it will hit our margins. We must check if our cost structure allows it without unsustainable losses. If not, it might be a values question (we value sustainability over growth). → Let's assume we can, but it's painful. Proceed.
  - Step 3: **Race to the Bottom** - Price wars are classic races to the bottom. Everyone's margins erode.
  - Step 4: **Is there a way out?** 
      - Cooperative: Unlikely (illegal to collude). 
      - Differentiation: Yes, we can emphasize our superior features, support, or reliability instead of competing on price. But that requires sales retraining and marketing. If we can do that, then we have an alternative. 
      - If we believe we can differentiate, then **Escalate to Leadership** (Step 4) with the alternative. 
      - If we cannot (e.g., the market is purely price-sensitive), then we have no way out → **Escalate to Leadership** (Step 5) to set a minimum price floor and exit criteria (e.g., we exit if margins fall below X%).
  - In this case, let's assume we have strong differentiation potential. Output: **Escalate to Leadership** for a decision between matching (entering the race) or doubling down on differentiation.

  **Example 3: Engineering Salary Bidding War**
  - Step 1: **Yes** - We are losing candidates to competitors offering higher salaries.
  - Step 2: **Yes** - We can raise salaries. But it will increase costs. It may conflict with our compensation structure and equity. → This is a values/cost trade-off. We note and proceed to Step 3, but if the cost is too high we would escalate.
  - Step 3: **Positional Arms Race** (also Race to the Bottom for company profits) - Salaries are driven by market rates. However, note: this can also be a Race to the Top if it leads to better talent and innovation. But in the short term, it's a cost race.
  - Step 4: **Is there a way out?** 
      - Cooperative: Unlikely (companies don't collude on salaries). 
      - Differentiation: We can offer non-salary benefits (remote work, culture, equity, projects) but if the salary gap is too big, it may not work. 
      - Also, the market may stabilize if one big player sets a cap (but we're not that player). 
      - No easy way out → **Escalate to Leadership** (Step 5) to decide on a maximum salary band and when to walk away from candidates.

  In the salary example, the honest answer is: "It's a real trap, you pay or you leave." But note: if we are a top player, we might set the standard (Race to the Top) by paying well and attracting the best. However, if we are a smaller player, we are forced to follow.

  **What the Procedure Cannot Do:**
  - Predict the future with certainty.
  - Account for irrational actors (e.g., a competitor burning VC money).
  - Solve the trap; it only identifies it and forces a conscious decision with limits.
  - Replace leadership judgment on values and strategic trade-offs.

  **Where it Rationalizes:** The procedure is designed to challenge assumptions. However, if leadership has already decided to proceed (e.g., in Step 1, they interpret "evidence" loosely), then the procedure might be gamed. To mitigate, require hard data in Step 1 and clear criteria in Step 4.

  Final note: The procedure should be documented as a checklist and used in pre-review meetings. It forces data-driven analysis and explicit trade-off discussions, reducing knee-jerk reactions.
answer: |-
  Here's a battle-tested 30-minute competitive trap analysis procedure, synthesized from game theory (Prisoner's Dilemma, Nash Equilibrium), institutional economics (tragedy of the commons), and competitive strategy (Porter's Five Forces). It's designed to separate real traps from manufactured urgency. Run this as a pre-mortem checklist before any "we must copy competitors" meeting.

  ### **The 5-Step Trap Analysis Protocol**  
  *(Time: 4-6 min per step)*

  1. **Verify the Threat**  
     **Question:** "What specific metric is declining RIGHT NOW due to NOT doing this, and what's the causal proof?"  
     *Sufficient answer:* Hard data showing either (a) ≥5% recent churn directly attributed to this gap in win/loss reports, or (b) experimental evidence (e.g., A/B test showing feature absence loses deals).  
     *Termination point:* If only anecdotal ("Sales feels we're losing") → **DECLINE**.  
     *Why:* Filters out imaginary fires. Unilateralist's Curse thrives on vague fears.

  2. **Assess Trap Type**  
     **Question:** "Is this a: (a) Prisoner's Dilemma (all lose if all act), (b) Positional Arms Race (spend more for same share), or (c) Differentiation Opportunity?"  
     *Identification guide:*  
     - *Prisoner's Dilemma:* Mutual destruction if all comply (e.g., price wars). Test: "If we ALL do this, does industry profitability drop?"  
     - *Positional Arms Race:* Resources spent change relative position, not absolute value (e.g., ad auctions). Test: "If we spend 2X, do we get lasting advantage or just reset the baseline?"  
     - *Differentiation:* Not a trap. Competitor's move creates exploitable weakness (e.g., they cut quality to lower price).  
     *Termination point:* If (a) or (b) → Proceed to Step 3. If (c) → **ESCALATE** (strategic opportunity).

  3. **Test Exit Options**  
     **Question:** "Can we: (a) Differentiate instead (exploit their weakness), (b) Coordinate industry standards, or (c) Absorb the loss?"  
     *Sufficient answers:*  
     - (a) Evidence of underserved customer segments (e.g., "30% of churning cite [competitor]'s UX as reason")  
     - (b) Pre-existing trade groups/standards body  
     - (c) Financial model showing churn cost < implementation cost  
     *Termination point:* If (a)/(b)/(c) viable → **ESCALATE** (values/margin trade-off). If none → Proceed to Step 4.

  4. **Calculate Trap Severity**  
     **Question:** "What's the cost of participation vs. non-participation over 18 months?"  
     *Model:*  
     ```  
     Trap Cost = (Implementation Cost) + (Anticipated Escalation Cost * 1.5)  
     Loss Cost = (Proven Metric Decline) + (Indirect Loss Multiplier)  
     ```  
     *Indirect Loss Multiplier:* 0.5x if <10% market share, 3x if >30% (network effects penalty)  
     *Termination point:* If Loss Cost > Trap Cost → **PROCEED (with limits)**. Else → **DECLINE**.

  5. **Set Containment**  
     **Question:** "What's the unambiguous kill switch?"  
     *Require:* One measurable trigger (e.g., "If CAC increases 15% more", "If NPS drops below X") with sunset clause.  
     *Output:* Mandatory for all **PROCEED** recommendations. No trigger → **DECLINE**.

  ---

  ### **Applied to Your Examples**  

  **Case 1: Ad Spend (CAC doubled, share flat)**  
  - Step 1: **DECLINE** - No proven *current* metric decline (share stable despite CAC rise)  
  - Trap Type: Positional Arms Race (ad auctions are pure zero-sum)  
  - Why it fails: You're already in the trap. Continuing violates Step 4 (Loss Cost=0 < Trap Cost=infinite)  
  - **VERDICT: DECLINE** (Redirect spend to retention)  

  **Case 2: Competitor's 30% Price Cut**  
  - Step 1: Hold sales to proof of active churn  
  - Step 2: Prisoner's Dilemma (if all cut, industry revenue ↓30%)  
  - Step 3: Test differentiation - Can you highlight superior reliability/security?  
  - Step 4: If you have >25% share, Loss Cost likely high (3x churn multiplier)  
  - Step 5: Kill switch: "Revert prices if margin <15% within 6 months"  
  - **VERDICT: If Step 1 proven → PROCEED (with kill switch), else DECLINE**  

  **Case 3: Engineering Salary War**  
  - Step 1: **PROVEN** (attrition spikes, offer rejections)  
  - Step 2: Positional Arms Race (salaries are relative goods)  
  - Step 3: No differentiation - Talent markets are liquid  
  - Step 4: Loss Cost (lost productivity) > Trap Cost (salary premiums)  
  - Step 5: Kill switch: "If comp exceeds 60% of revenue for 2 quarters, freeze hires"  
  - **VERDICT: PROCEED (with kill switch) - It's a real trap with no exit**  
  *Why it's unavoidable:* Talent is a true positional good. No cooperative solution (wage collusion illegal). You pay or lose capacity.

  ---

  ### **Where This Works (and Doesn't)**  
  **Strengths:**  
  - Catches 80% of false "emergencies" at Step 1 (your VP will love declining without blame)  
  - Forces quantification where others use vibes  
  - Exposes when leadership *wants* the trap (e.g., "We know it's irrational but need optics") at Step 3 escalation  

  **Limitations:**  
  - Can't handle black swans (e.g., viral social media shaming)  
  - Useless for regulatory/compliance moves  
  - Ignores brand equity (a "values call" for leadership)  
  - Requires honest metrics (garbage in → garbage out)  

  **Pro Tip:** When presenting to leadership:  
  1. Lead with the verdict  
  2. Show the 1-pager trap classification (e.g., "Positional Arms Race - No Escape")  
  3. State trade-off bluntly: "This costs $X to avoid $Y loss. Your call on margin."  

  This system’s power comes from forcing the *narrative* into predefined economic structures. Most "races" are stories weaponized to justify pre-existing agendas—your procedure makes that weaponization visible.
