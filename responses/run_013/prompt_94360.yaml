prompt: |-
  I'm a software engineer with no formal training in philosophy, and I keep getting pulled into a recurring argument with a colleague who deploys the line "absence of evidence is not evidence of absence" to shut down any suggestion that the Fermi silence — decades of radio listening and no signal — gives us even a little reason to doubt that other civilizations exist. I suspect the sentence is doing several different jobs at once and that at least one of them is plainly false, but I can't say which. Acting as an epistemologist or philosopher of science, think carefully before you answer, and begin by brainstorming every distinct precise claim the sentence could be making, from the trivial to the radical. Then lay them out for me as a menu: for each reading, state the thesis precisely, say whether it is a platitude, a substantive and defensible claim, or simply false, and give the one-line reason. I especially want the Bayesian reading spelled out — what would have to be true of the likelihoods for the slogan to hold literally — and the reading on which the slogan is really a claim about who bears the burden of proof. Finally, tell me which single reading would actually license my colleague's move that the silence tells us nothing, whether that reading survives scrutiny, and what the most defensible reading of the slogan would let him conclude instead.
