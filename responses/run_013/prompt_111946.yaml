prompt: |-
  I am assembling a short set of jokes to open a graduate seminar session on social learning, and the audience will know the literature on information cascades and rational herding well enough to be irritated by a joke that gets the mechanism wrong. Write me one joke — setup and punchline, under 150 words, in American English — whose humor turns on the actual structure of a cascade rather than on the familiar observation that people are sheep.

  The setup must be a genuine sequential-choice situation: each person holds a private signal of limited precision, observes the actions but not the signals of those who went before, and decides in turn. The humor has to come from something that follows from that structure — for instance, that the crowd's unanimity carries no more information than the first couple of actions, that the private information of everyone after that point never enters the public record, that the copying is reputational rather than informational, done by people who privately disagree, or that the whole arrangement can reverse on a trivial public event. Set the joke among people who already know how cascades work; it should not depend on their being naive, and it should not be funny merely because the characters are foolish.

  Do not build the joke around the names of researchers or papers; I want it to work for someone who knows the ideas but not the citations, and a reader who knows the theory should laugh rather than wince.

  After the joke, add two or three sentences, clearly separated from it, naming the exact feature of the theory the punchline depends on and stating briefly why the setup actually licenses it.
reasoning: |-
  We are going to write a joke that hinges on the structure of an information cascade, specifically the fact that once a cascade starts, individuals ignore their private signals and follow the public behavior, making the cascade fragile to small public events. The setting is a group of people who understand cascades, so the humor comes from the irony of knowing the mechanism and still being trapped by it.

  Joke:

  At a conference for behavioral economists, the first two attendees arrive at a session and see two doors. A sign says, "Free coffee: left door for regular, right for decaf." Each gets a private signal: Attendee 1's signal says 'decaf' but he hates decaf, so he picks left. Attendee 2 gets a weak signal for 'left' but sees Attendee 1 chose left, so he follows. The next ten attendees, each getting a private signal but seeing the line forming at the left door, ignore their signals and join the left queue. Then, the eleventh attendee arrives. She sees the long line at left, but then notices a janitor nonchalantly wiping the right door handle. She abruptly switches to the right door. The entire line, one by one, follows her without a word.

  Analysis:

  The humor depends on two features of cascade theory. First, after the first few choices, individuals ignore their private signals and follow the public action, creating an information cascade. Second, cascades are fragile: even a small, uninformative public event (like the janitor's action) can break the cascade because it provides a focal point for coordination, causing a reversal as individuals now update based on this new public signal and the cascade restarts in the opposite direction.
answer: |-
  **Joke:**  
  Three economists enter a café with a new "Mystery Roast" promotion. Each gets a private taste-test signal—weakly accurate—and must publicly choose "Try" or "Skip" in sequence. The first two both choose "Try" (first had a strong "yum" signal; second had "meh" but followed). The next eight economists, seeing unanimous "Try" and ignoring their own mixed signals, also choose "Try." The eleventh pauses, then loudly says, "Skip." Instantly, the next five economists all switch to "Skip."  

  **Analysis:**  
  The punchline hinges on two cascade features. First, once early actions trigger a cascade, subsequent actors ignore private signals—so the eighth "Try" reveals no new information. Second, cascades are fragile: a single public deviation (the eleventh’s "Skip") can reverse the herd, as it breaks the unanimity illusion. This reversal occurs even if the eleventh’s signal is weak, because the cascade structure makes later actors hypersensitive to any public dissent.
