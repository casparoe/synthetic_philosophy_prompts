answer: |-
  Here’s a concise, jargon-free 5-minute talk that meets your criteria—grounded in practical philosophy, clear for non-specialists, with concrete examples and philosophical depth:

  ---

  **Welcome. Look around. Eighty brilliant minds from a dozen countries—scientists, economists, a few brave philosophers. You’re all navigating a new city, a new culture, and a thousand tiny rules. Some feel mandatory ("Why is everyone glaring when I stand on the left of the escalator?"). Some feel arbitrary ("Why does this barista care if I say ‘Have a nice day’?"). How do you know which conventions demand your compliance, and which you can gently set aside?**

  **It boils down to one question: *What happens if you break it?***  

  **Category 1: Conventions that *Coordinate* Us.**  
  These exist because they solve a shared problem. Breaking them isn’t just "different"—it actively *disrupts* others.  
  - **Example: Standing on the right on escalators.** If you stand left, you block the lane for people rushing past. You’re taking the benefit of the system (fast movement for those in a hurry) without paying the cost (staying right). That’s unfair.  
  - **Example: Queueing in a single line.** Crowding the counter creates chaos, wastes everyone’s time, and rewards pushing. The line isn’t politeness theatre—it’s a fairness engine. Skipping it? You’re cutting in line on collective efficiency.  
  - **Example: Waiting for the walk signal on a busy street.** At noon, darting across unpredictably forces cars to brake, risking accidents and slowing traffic. You’re trading your 3 seconds for dozens of strangers’ minutes and safety.  

  **Here, breaking the norm *harms* coordination. You owe compliance because your freedom would impose real costs on others. It’s not about local taste—it’s about not breaking a shared tool we all rely on.**  

  **Category 2: Conventions that *Signal* Belonging.**  
  These are local customs, preferences, or traditions. Breaking them might feel strange, confuse someone, or even mildly annoy—but it doesn’t *break* a system.  
  - **Example: Tipping 20% vs. 15%.** While under-tipping stiffs a worker, the *exact percentage* is cultural signalling. No societal machinery fails if you tip 18% thoughtfully. The obligation is to compensate labor fairly—not mimic a specific numeral.  
  - **Example: "How are you?" as ritual greeting.** Replying with a medical history (instead of "Good, you?") might confuse a cashier, but it doesn’t collapse social order. The *core* rule—acknowledge others politely—is what matters.  
  - **Example: Waiting for a 3am walk signal on an empty street.** If there’s no one for blocks? Strict adherence here is pure custom. You aren’t disrupting coordination; the system is dormant.  

  **Here, insisting on the *exact local flavor* is what becomes rude—demanding others perform cultural compliance for you. You can adapt kindly ("I’m learning your ways!"), but you don’t owe robotic mimicry.**  

  **The Gray Zone? Of course.**  
  Is queuing sacred? At a crowded coffee shop, yes—it’s coordination. At a chaotic street food stall with no clear line? Maybe not. Context matters. **This is where the philosophers perk up: Does "it’s the norm here" *alone* obligate you? My argument: No. The obligation springs from the *harm* or *unfairness* of undermining coordination—not the norm itself. The norm is just the tool we’ve built to avoid that harm.**  

  **So—when in Rome?**  
  Don’t just "do as the Romans do." Ask: *Is this convention glue holding coordination together? Or local color?*  
  - If your action risks chaos, unfairness, or harm: **Follow it. You owe that.**  
  - If it’s about local flavor: **Learn, be gracious, but breathe easy. You owe no apology for being yourself.**  

  **Welcome. Be kind. Be curious. And when in doubt—stand on the right.**  

  ---

  **Why this works:**  
  1. **Clear Categories:** "Coordination vs. Signaling" is intuitive yet philosophically robust (channeling Hume/Lewis on conventions).  
  2. **Concrete Examples:** Escalators, queues, and 3am walk signals make it tangible.  
  3. **Harm Principle:** Justifies obligation without appeals to authority ("because it’s the rule").  
  4. **Philosophical Nod:** Explicitly denies that *mere* locality creates obligation—it needs a coordination/harm basis. Philosophers will spot the reference to the "normative force" debate.  
  5. **Gray Zone Honesty:** Acknowledges contested boundaries (like queueing culture) without waffling.  
  6. **Empowering Tone:** Frames compliance as fairness, not submission; autonomy in signaling norms.  

  Timed at ~4:45 when spoken conversationally, leaving room for pauses. Adjust examples if your city has iconic quirks!
