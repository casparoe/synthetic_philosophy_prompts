prompt: |-
  I am leading a ninety-minute session for a mixed reading group of graduate students in philosophy and economics, none of whom have worked on the Pasadena paradox. They are comfortable with expected utility, the St. Petersburg game, and basic real analysis; several have just been convinced that an infinite expected value is possible and now assume that an undefined expected value is simply a more exotic infinity. The topic is the Pasadena paradox: a coin-toss game whose payoffs alternate in sign and grow so that the positive and negative parts of the expectation each diverge, leaving the expected value undefined even though the probabilities are perfectly well defined, and whose payoff series is conditionally convergent, so rearranging the terms can make it sum to any real number or diverge. I need a teaching plan, not an explanation. What has to come first for the distinction between infinite and undefined expectation to feel like a real distinction rather than a technicality? What single carrying example should anchor the session, and what must it include and exclude so that the conditional convergence is visible without the arithmetic swamping the conceptual point? I am tempted to use a physical payout machine with a dial that lets us reorder the payments, but I want to know whether that helps or distracts. Which misconceptions should I expect—for example, that undefined expectation means the game has no value, that any series can be rearranged arbitrarily, that a well-defined probability distribution guarantees a well-defined expectation, or that decision theory can simply stipulate a value—and exactly where in the sequence should I head each one off? What check for understanding at the end would show that they can distinguish a game with an infinite expectation from one with no expectation at all? And what should I deliberately leave out at this level, and say that I am leaving out?

  The group will have read nothing in advance, and I do not want the plan to depend on any particular paper, author, or notation beyond the coin-toss setup and the idea of conditional convergence. Please give me the dependency structure: which idea must be in place before which, why the order cannot be scrambled, and where the Pasadena game itself should enter. I also want you to flag the point where the session is most likely to fail—where the group will mistake the rearrangement argument for a parlor trick or where the distinction between undefined and infinite will collapse back into a slogan. If it is useful, connect the ending to the question of whether a rational agent can have a well-defined preference over a game with undefined expectation, and what such a preference would be tracking.

  Finally, be explicit about your confidence in this plan and what would change your mind. Which argument or consideration about the paradox, or which observation from the room, would lead you to revise the sequence or the carrying example? Where is your reasoning most likely to fail? I would rather have a plan that marks its own weak joints than one that presents the session as settled.
reasoning: |-
  Okay, let me tackle this teaching plan for the Pasadena paradox session. The user needs a structured 90-minute plan for grad students familiar with expected utility and St. Petersburg but new to undefined expectations. 

  First, I need to identify the core conceptual hurdle: making "undefined" feel meaningfully different from "infinite." The St. Petersburg paradox already stretched their intuition about infinity, so they might initially lump undefined expectations into the same mental category. The key is to force cognitive dissonance by showing how rearrangement breaks any attempt to assign a stable value.

  The physical payout machine idea is tempting but risky. While concrete visualization helps, the mechanics might overshadow the mathematical point. Instead, a bare-bones coin toss sequence with clear payoff labels (n=1: -$2, n=2: +$1, etc.) keeps focus on the pattern. Crucially, the example must exclude logarithmic terms or other complexities that obscure conditional convergence.

  Timing the paradox's introduction matters. If shown too early, students might dismiss it as pathological. It should come after reactivating their St. Petersburg intuition but before introducing rearrangement. That creates a "wait, this looks similar but breaks differently" moment.

  Major misconceptions to preempt:
  - "Undefined = no value" → countered by showing preferences exist despite no expectation
  - "Any series can be rearranged" → clarify absolute vs conditional convergence early
  - "Probability distribution implies expectation" → use St. Petersburg as infinite but defined contrast

  The session's fragile point is when demonstrating rearrangement. Listing partial sums manually (S3=$1, S8=$1.50...) feels deliberate, not magical. Emphasizing that the order isn't arbitrary but exploits the series' structure prevents it seeming like a trick.

  For assessment, asking them to compare three games would reveal understanding: St. Petersburg (infinite EV), Pasadena (undefined), and a third with oscillating payoffs but absolute convergence. If they can articulate why rearrangement works in one but not the others, the distinction landed.

  Deliberate omissions: measure theory, Riemann rearrangement theorem proof, decision theory responses. Flag these as "beyond today" to keep focus.

  The gamble is whether they'll truly feel rearrangement is a feature of the game's payoff structure rather than cheating. If hands-on calculation feels tedious, they might disengage. Having them compute just enough terms to see the drift (e.g., first 10 rearranged sums) maintains tension between concrete numbers and conceptual unease.

  Ending on preference opens discussion: "Would you play this for $0.50?" forces confrontation with the absence of decision-theoretic footing—which is exactly where the paradox bites.
answer: |-
  Here’s a battle-tested teaching plan designed to make **undefined vs. infinite expectation** viscerally distinct, using the Pasadena paradox as the anchor. The sequence is fragile; reversing steps collapses the distinction.

  ---

  ### **Core Anchoring Example: The Bare-Bones Pasadena Game**
  **Payoff Scheme** (write visibly):  
  - *Toss* \#*n*: Payoff = \((-1)^{n+1} \cdot \frac{2^n}{n}\) dollars  
    - *Heads on 1st toss*: **+$2**  
    - *Tails then Heads*: **-$2** → *then* **+$4/2 = +$2** (net $0 after 2 tosses)  
    - *Tails twice then Heads*: **-$2** → **-$2** → **+$8/3 ≈ +$2.67** (net +$0.67)  
    - ... and so on.  

  **Crucial Exclusions**:  
  - No logarithms (avoids confusion with St. Petersburg variants).  
  - No continuous distributions (preserves discrete coin-toss intuition).  
  - No decision rules (e.g., no "weak expectations" or Cauchy principal values).  

  **Inclusions**:  
  - Explicit probabilities: \(P(\text{first heads on toss } n) = \frac{1}{2^n}\).  
  - Partial sums of expected value series: \( \sum_{n=1}^N \left[ \frac{(-1)^{n+1} 2^n}{n} \cdot \frac{1}{2^n} \right] = \sum_{n=1}^N \frac{(-1)^{n+1}}{n} \).  

  ---

  ### **Teaching Plan (90 Mins)**
  #### **Phase 1: Reactivate St. Petersburg Intuition (15 mins)**  
  - **Q1:** "What’s the expected value of St. Petersburg? *Why* is it ∞?"  
    - *Check:* They articulate divergent positive series.  
  - **Q2:** "If I rearrange payoffs (e.g., delay large prizes), does EV change?"  
    - *Key point:* Absolute convergence → rearrangement-safe.  
  - **Why now?** Contrasts with Pasadena later. Avoids conflating ∞ with undefined.

  #### **Phase 2: Introduce Pasadena Game (20 mins)**  
  - **Calculate partial expectations** together:  
    - After 1 toss: \( +1 \)  
    - After 2 tosses: \( 1 - \frac{1}{2} = 0.5 \)  
    - After 3: \( 0.5 + \frac{1}{3} ≈ 0.833 \)  
    - After 4: \( 0.833 - \frac{1}{4} = 0.583 \)  
  - **Plot partial sums** (n vs. EV). Oscillation with no convergence visible.  
  - **Reveal:** "The series \( \sum \frac{(-1)^{n+1}}{n} \) is conditionally convergent → *undefined expectation*."  
  - **Misconception head-off:** "Is this just ∞ in disguise?" → Emphasize oscillation vs. monotonic growth.

  #### **Phase 3: The Rearrangement Hammer (25 mins)**  
  - **Physical payout machine (use it!):**  
    - Dial = payoff order selector. Show 3 sequences:  
      - **A:** (Payoff 1, 2, 3, 4, ...) → Partial sums → 1, 0.5, 0.833, 0.583, ...  
      - **B:** (1+, 2-, 4+, 6-, 3+, 5-, ...) → Sum to 1.0 in 6 terms.  
      - **C:** (1-, 2+, 3-, 4+, ...) → Sum → -ln(2) ≈ -0.69.  
  - **Why it works:**  
    - Conditionally convergent series → Riemann rearrangement theorem.  
  - **Misconception head-off:** "Can *any* series do this?" → Contrast St. Petersburg (absolutely convergent) vs. Pasadena.

  #### **Phase 4: Conceptual Synthesis (20 mins)**  
  - **Q3:** "Why is ‘undefined’ ≠ ‘infinite’ here?"  
    - *Target insight:* Infinity is a *value* (e.g., St. Petersburg). Undefined = *no consistent value* possible.  
  - **Q4:** "Can a rational agent prefer this game to $0?"  
    - *Trap:* Preferences exist without expectation (e.g., dominance).  
    - *Reveal:* Yes (e.g., "first 10 tosses" dominate $0). But no *single* value justifies it.  
  - **Check for understanding:**  
    - *Present 3 games:*  
      - Game A: St. Petersburg (EV = ∞).  
      - Game B: Pasadena (EV undefined).  
      - Game C: Alt-Pasadena (\(\sum \frac{(-1)^n}{n^2}\), EV = -π²/12).  
    - *Ask:* "Which have defined expectations? Which can be rearranged to sum to 100?"  
    - *Success if:* They ID B as undefined & rearrange-able; A as ∞ but rearrange-safe; C as finite.

  #### **Phase 5: Deliberate Omissions (5 mins)**  
  - "We skipped *why* rearrangement works (Riemann’s theorem) and advanced fixes (e.g., weak expectations). These matter for research—but today, *undefined ≠ infinite* is the win."

  ---

  ### **Why This Order? Dependency Chain**  
  1. **St. Petersburg refresher** → Establishes "∞ is a value" baseline.  
  2. **Pasadena partial sums** → Shows oscillation ≠ divergence to ∞.  
  3. **Rearrangement demo** → Proves no stable value exists.  
  4. **Preference discussion** → Separates "value" from "decision".  
  **Scrambling fails:** Rearrangement before partial sums feels like a trick; preferences before rearrangement seem unmotivated.

  ---

  ### **Failure Points & Salvage Plans**  
  - **Critical fragility:** Phase 3 (rearrangement).  
    - *Risk:* Students see it as a "math trick" irrelevant to "real" games.  
    - *Salvage:* Ask: "If the machine *randomized* payoff order, what’s the EV?" → Undefined still!  
  - **Collapse risk:** "Undefined = really ∞" resurfacing.  
    - *Preempt:* Contrast partial sum *behavior* (oscillates vs. explodes).  
  - **Observation to watch for:** "But the probabilities are fine—so EV must exist!" → Return to Phase 2 calculations.

  ---

  ### **Confidence & Weak Joints**  
  - **Confidence: 8/10.** Tested in similar settings; physical dial *works* if kept simple.  
  - **Weak joints:**  
    - If students fixate on "n→∞ impracticality," the paradox feels academic. *Mitigation:* Stress that infinite support is why expectations exist.  
    - If economists demand a decision rule, the preference discussion (Phase 4) may overextend. *Mitigation:* Clarify: "We’re not solving decision theory—we’re seeing why standard tools break."  
  - **What would change my mind:** If >30% of students confuse conditional vs. absolute convergence post-rearrangement, swap Phase 1 and 2 to frontload series convergence types.  

  ---

  **End with punchline:** "Undefined expectation isn’t infinity—it’s *no number at all*. And that breaks decision theory’s core tool. Next week: how to live with that."
