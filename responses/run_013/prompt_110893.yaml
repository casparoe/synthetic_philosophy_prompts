prompt: |-
  I sit on a working group drafting a binding fairness rule for automated decision systems in consumer lending and hiring, and after a year in the technical literature I have concluded that the literature is organised around a question we do not have. Each candidate criterion — demographic parity, equalized odds, calibration within groups, predictive parity, individual fairness as a Lipschitz condition on a task-specific metric, counterfactual fairness — is defended against a different background assumption, and the impossibility results get presented as proof that we must simply choose which of them to give up. That seems premature. Before we choose, I want the specification rather than the menu: write the desiderata that any fairness criterion would have to meet to be fit for a rule of this kind — the cases it must get right, the distinctions it must not collapse, and the facts about our setting it must be consistent with — each requirement stated together with the consideration that makes it a requirement rather than a preference of one camp, and marked as non-negotiable or as negotiable. A numbered list is fine.

  Our setting imposes five constraints that I suspect most of these criteria were not designed for, and I would like the list built around them. First, the rule must be checkable by an outside auditor who sees only decisions and outcomes over time, not the model, its features, or its training data; a criterion verifiable only by inspecting the algorithm is of no use to us. Second, we cannot reliably record the protected attribute; it is partly inferred, and the inference errors correlate with the outcome we care about. Third, the label we would train on and audit against is itself a proxy — arrears rather than creditworthiness, supervisory ratings rather than performance — so the criterion has to be explicit about what it is a criterion about, and must not silently inherit the label's bias. Fourth, the decision changes the population it is applied to: advertising, recruiting, and repayment behaviour all respond to the policy, so the distribution on which a criterion is checked in year one is not the distribution it will face in year three. Fifth, the rule must be non-vacuous: satisfiable by some policy other than denying everyone, not satisfiable by degrading the better-off group to the level of the worse-off, and not satisfiable by meeting the constraint on the named groups while failing inside them.

  Tell me where the first constraint conflicts with any requirement that a criterion track the actual decision procedure rather than its output, and identify any subset of the requirements that cannot be jointly satisfied — in our setting or in general — and say what has to give; that part is what I most want. If the impossibility results usually cited generalise here, say which survive and which dissolve once the third constraint is taken seriously. Then, briefly, how each criterion I listed fares against the list, one line apiece, and which single requirement excludes the most candidates overall. Keep the scoring short; the criteria are where I need the help.
reasoning: |-
  We are designing a set of desiderata for a fairness criterion in the context of automated decision systems for consumer lending and hiring, under five specific constraints. The goal is to specify what any fairness criterion must satisfy to be fit for a rule in this setting, rather than choosing from existing criteria. We must also note which requirements are non-negotiable and which are negotiable, and then briefly evaluate existing criteria against these requirements.

  ### Step 1: List the constraints (as provided by the user)
  1. **Auditability Constraint**: The rule must be checkable by an outside auditor who sees only decisions and outcomes over time, without access to the model, features, or training data.
  2. **Protected Attribute Constraint**: We cannot reliably record the protected attribute (it is partly inferred, and inference errors correlate with the outcome).
  3. **Proxy Label Constraint**: The label (used for training and auditing) is a proxy (e.g., arrears for creditworthiness, supervisory ratings for performance) and may be biased. The criterion must be explicit about what it is a criterion of and not silently inherit the label's bias.
  4. **Distribution Shift Constraint**: The decision changes the population it is applied to (e.g., due to advertising, recruiting, repayment behavior), so the distribution in year one is different from year three.
  5. **Non-Vacuity Constraint**: The rule must be non-vacuous: satisfiable by some policy other than denying everyone; not satisfiable by degrading the better-off group to the level of the worse-off; and not satisfiable by meeting the constraint on named groups while failing inside them (i.e., must prevent intra-group unfairness).

  ### Step 2: Derive Desiderata (Requirements)
  We derive requirements that any fairness criterion must meet, based on the constraints and the context. Each requirement is stated with the consideration that makes it a requirement (i.e., the constraint or principle that necessitates it) and marked as non-negotiable or negotiable.

  #### Non-Negotiable Requirements (stemming directly from the constraints and the need for a binding rule)
  1. **Requirement 1 (Auditability)**: The criterion must be verifiable using only the history of decisions and outcomes (including any protected attribute estimates, if available) without requiring access to the model internals, features, or training data.  
     *Consideration*: The first constraint (Auditability Constraint) states that an outside auditor must be able to check the rule.  
     *Non-negotiable*: Yes.

  2. **Requirement 2 (Protected Attribute Handling)**: The criterion must not require exact knowledge of the protected attribute. It must be robust to errors in the inferred protected attribute, especially when these errors correlate with the outcome.  
     *Consideration*: The second constraint (Protected Attribute Constraint) states that we cannot reliably record the protected attribute.  
     *Non-negotiable*: Yes.

  3. **Requirement 3 (Proxy Awareness)**: The criterion must explicitly state the target of fairness (e.g., true creditworthiness, true job performance) and account for the bias in the proxy label. It must not assume the proxy label is unbiased.  
     *Consideration*: The third constraint (Proxy Label Constraint) states that the label is a proxy and may be biased.  
     *Non-negotiable*: Yes.

  4. **Requirement 4 (Dynamic Population)**: The criterion must be defined in a way that remains meaningful under distributional shifts caused by the decision system itself (e.g., changes in applicant pool or behavior). It should either be stable across such shifts or the shifts must be accounted for in the auditing process.  
     *Consideration*: The fourth constraint (Distribution Shift Constraint) states that the decision changes the population.  
     *Non-negotiable*: Yes.

  5. **Requirement 5 (Non-Vacuity)**: 
     a. The criterion must be satisfiable by at least one non-trivial policy (i.e., not only by denying everyone).  
     b. It must not be possible to satisfy the criterion by degrading the outcomes of a better-off group to the level of a worse-off group (i.e., no "levelling down").  
     c. The criterion must prevent unfairness within groups (i.e., it should not be possible to satisfy the criterion by meeting the constraint on the named groups while having unfairness inside them).  
     *Consideration*: The fifth constraint (Non-Vacuity Constraint) requires non-vacuity.  
     *Non-negotiable*: Yes.

  #### Additional Requirements (based on general principles of fairness and the setting)
  6. **Requirement 6 (Outcome Focus)**: The criterion must be defined in terms of the outcomes (actual or expected) of the decisions, not solely the decisions themselves.  
     *Consideration*: The goal of lending and hiring is to achieve good outcomes (e.g., repayment, job performance), and without outcome focus, the criterion might not align with the intended goal. Moreover, the proxy label constraint requires that we are explicit about the target, which is an outcome.  
     *Non-negotiable*: Yes (because of the proxy awareness and the purpose of the systems).

  7. **Requirement 7 (Causal Insight)**: The criterion must be compatible with the possibility that the protected attribute may have a causal effect on the outcome (or vice versa) and not assume that the protected attribute is independent of the outcome.  
     *Consideration*: In lending and hiring, the protected attribute (e.g., race, gender) may have a causal effect on the outcome (e.g., due to societal discrimination) and we cannot assume away such dependencies.  
     *Non-negotiable*: Negotiable? (But note: we must not require the protected attribute to be independent of the outcome, which is a common assumption in some criteria. However, we cannot avoid the fact that the protected attribute may be causal. So we mark this as non-negotiable to reject criteria that require independence.)

     Actually, we can state it as: The criterion must not require the protected attribute to be independent of the outcome or the features.  
     *Non-negotiable*: Yes.

  8. **Requirement 8 (Individual Consideration)**: The criterion must not allow for arbitrary discrimination against individuals as long as group-level statistics are met.  
     *Consideration*: The non-vacuity constraint (5c) explicitly requires preventing unfairness inside groups. Also, individual fairness is a basic ethical requirement.  
     *Non-negotiable*: Yes.

  ### Step 3: Identify Conflicts and Impossibilities
  The user specifically asks:
  - Where the first constraint (auditability) conflicts with any requirement that a criterion track the actual decision procedure rather than its output.
  - Identify any subset of the requirements that cannot be jointly satisfied (in our setting or in general) and say what has to give.

  #### Conflict with Auditability
  The first constraint (auditability) requires that we can verify fairness by looking only at decisions and outcomes over time. This immediately conflicts with any criterion that requires knowledge of the decision procedure (e.g., the model, features, or training data). For example:
  - **Individual fairness as a Lipschitz condition**: This criterion requires a task-specific metric and access to the features of individuals to compute distances. Without access to the features, an auditor cannot verify it. Thus, it fails Requirement 1 (Auditability). 

  In general, any criterion that relies on the internal workings of the model or the features used is ruled out by Requirement 1.

  #### Impossibility Results
  The classic impossibility results (e.g., Kleinberg et al., 2016; Chouldechova, 2017) show that, under certain assumptions, demographic parity, equalized odds, and calibration cannot all be satisfied simultaneously unless the model is perfect or base rates are equal. However, in our setting, we have additional constraints that change the landscape:

  1. **Proxy Awareness (Requirement 3)**: The classic results assume that the label used is the true outcome. But in our case, the label is a biased proxy. This means that even if we satisfy one of these criteria on the proxy, it might not hold for the true outcome. The impossibility results might not directly transfer because we are not using the true outcome. However, the core tension remains: we cannot simultaneously satisfy multiple group fairness criteria if the proxy label is not perfectly aligned with the true outcome and base rates differ.

  2. **Protected Attribute Handling (Requirement 2)**: We cannot measure the protected attribute exactly. This introduces measurement error, which may break the assumptions of the impossibility results (which assume perfect knowledge of the protected attribute). Therefore, the impossibility results might not hold in practice because we cannot even compute the criteria exactly.

  3. **Dynamic Population (Requirement 4)**: The classic results are static. With a dynamic population, the base rates and distributions change, so satisfying a criterion at one point does not guarantee it at another. The impossibility results are for a fixed distribution.

  Despite these, we must note that:

  - It is impossible to satisfy both **Requirement 3 (Proxy Awareness)** and **Requirement 6 (Outcome Focus)** without a way to de-bias the proxy. We require the criterion to be explicit about the target (true outcome) and account for the bias in the proxy. But without data on the true outcome, it is impossible to measure the true bias. Thus, we must rely on the proxy and make strong assumptions about its relationship to the true outcome. This is a fundamental challenge.

    *Resolution*: We might have to accept that the criterion can only be defined with respect to the proxy, but then we must require that the proxy is the best available and that the criterion minimizes the potential harm from known biases. This would relax Requirement 3 to: "The criterion must be defined with respect to the best available proxy and include mechanisms to account for known biases, if possible."

    However, the user states that the criterion must not silently inherit the label's bias, so we cannot simply drop the requirement. Thus, we must note that without access to the true outcome, we cannot fully satisfy Requirement 3. We have to accept that the criterion will be defined on the proxy, but we require that the rule includes explicit safeguards against known biases (e.g., using multiple proxies, validation studies). This becomes a negotiable aspect of Requirement 3.

  Given the above, we mark Requirement 3 as non-negotiable in principle but acknowledge that in practice, without the true outcome, we must rely on the proxy. Therefore, we adjust:

  **Revised Requirement 3 (Proxy Awareness)**: The criterion must explicitly state the target of fairness (the true outcome) and incorporate known limitations of the proxy. The auditing process must include validation steps to assess the relationship between the proxy and the true outcome when possible, and the criterion must be robust to common forms of proxy bias (e.g., by being conservative in the face of uncertainty).  
  *Non-negotiable*: Yes, but the implementation may require additional data collection and validation.

  Now, the conflict between Requirements 3 and 6 (which requires outcome focus) and the lack of true outcome data is a fundamental challenge. We cannot fully overcome it without true outcome data. Therefore, we must note:

  - **What has to give**: We must accept that fairness is being measured with respect to the proxy, but we require that the system is designed to minimize known biases in the proxy and that the auditor periodically checks the proxy against any available true outcome data. In other words, the rule cannot be entirely agnostic to the quality of the proxy.

  #### Other Potential Conflicts
  - **Requirement 5 (Non-Vacuity) and Group Fairness Criteria**: Many group fairness criteria (like demographic parity) can be satisfied by random decisions or by denying everyone. Also, they can be satisfied by levelling down. Therefore, without non-vacuity, these criteria are inadequate. Non-vacuity (5b and 5c) rules out criteria that do not consider individual outcomes and allow intra-group unfairness.

  - **Requirement 7 (Causal Insight) and Counterfactual Fairness**: Counterfactual fairness requires building a causal model and checking what would have happened in a counterfactual world where the protected attribute changed. This is typically not auditable without the model and features (failing Requirement 1). Also, it requires the protected attribute to be known exactly (failing Requirement 2). Moreover, without the true outcome, it is unclear how to define the counterfactual (failing Requirement 3).

  ### Step 4: Evaluate Existing Criteria Against the Requirements
  We now briefly evaluate each candidate criterion against the requirements. We give one line per criterion.

  The criteria:  
  - Demographic parity  
  - Equalized odds  
  - Calibration within groups  
  - Predictive parity  
  - Individual fairness (Lipschitz condition)  
  - Counterfactual fairness  

  We'll score each against the non-negotiable requirements (1-5, and 6-8). We note that if a criterion fails one non-negotiable requirement, it is not usable.

  1. **Demographic parity (DP)**: Requires the decision rate to be equal across groups.  
     - Fails Requirement 3 (Proxy Awareness): It does not account for the bias in the proxy label.  
     - Fails Requirement 6 (Outcome Focus): It ignores outcomes.  
     - Fails Requirement 5 (Non-Vacuity): Can be satisfied by random decisions or denying everyone, and allows levelling down.  
     - Fails Requirement 7 (Causal Insight): It assumes that the protected attribute should not affect the decision, but in reality, the protected attribute might be causally related to the outcome.  
     - Also, it might be auditable (Requirement 1) if we have the inferred protected attribute and decisions, but Requirement 2 (robustness to inference errors) is likely a problem because DP is sensitive to group misclassification.

     *Verdict*: Fails multiple non-negotiable requirements.

  2. **Equalized odds (EO)**: Requires equal true positive rates and equal false positive rates across groups.  
     - Fails Requirement 3 (Proxy Awareness): It uses the proxy label as if it were the true outcome.  
     - Fails Requirement 2 (Protected Attribute Handling): Sensitive to errors in protected attribute, especially when correlated with the outcome.  
     - Fails Requirement 4 (Dynamic Population): The error rates may change with the distribution, and the criterion does not account for that.  
     - But it is auditable (Requirement 1) with decisions, outcomes (proxy), and protected attribute estimates.  
     - It is outcome-focused (Requirement 6) but on the proxy.  
     - Non-vacuity: It does not prevent levelling down (fails 5b) and does not address intra-group unfairness (fails 5c).  
     - It does not require independence of the protected attribute and outcome (so passes Requirement 7?).

     *Verdict*: Fails several non-negotiable requirements.

  3. **Calibration within groups (CG)**: The probability of the outcome given the score is the same across groups.  
     - Fails Requirement 3: Uses proxy label without accounting for bias.  
     - Fails Requirement 4: Calibration may break under distribution shift.  
     - Requirement 1: Auditable with scores, decisions, outcomes, and protected attribute.  
     - Requirement 2: Sensitive to protected attribute errors.  
     - Requirement 5: Can be satisfied by a perfectly calibrated model even if the model is biased (if the proxy is biased), and does not prevent intra-group unfairness.  
     - Requirement 6: Outcome-focused on the proxy.  
     - Requirement 7: Does not require independence.

     *Verdict*: Fails non-negotiable requirements 3 and 4, and 5c.

  4. **Predictive parity (PP)**: Requires equal positive predictive value across groups.  
     - Same issues as calibration: fails Requirement 3 (proxy bias) and 4 (distribution shift).  
     - Auditable (Requirement 1) but sensitive to protected attribute errors (Requirement 2).  
     - Does not prevent intra-group unfairness (5c) and can be satisfied by levelling down (5b) if we adjust thresholds to make PPV equal by worsening one group.  
     - Outcome-focused on proxy (Requirement 6).  
     - Does not require independence (Requirement 7).

     *Verdict*: Fails non-negotiable requirements 3 and 4.

  5. **Individual fairness (Lipschitz condition) (IF)**: Requires that similar individuals (according to a task-specific metric) receive similar decisions.  
     - Fails Requirement 1 (Auditability): The auditor cannot compute the metric without features.  
     - Fails Requirement 2: The metric requires protected attribute? Not necessarily, but the metric must be defined to ignore protected attribute, but without knowing the protected attribute, it's hard to enforce. Also, the similarity metric is task-specific and may require features that are not available to the auditor.  
     - Fails Requirement 3: It does not explicitly account for the proxy bias.  
     - Requirement 4: Might be robust to distribution shift if the metric is well-defined, but without the true outcome, it's unclear.  
     - Requirement 5: Prevents intra-group unfairness? It is designed for individual fairness so should prevent it, but without outcome focus, it might not.  
     - Requirement 6: Not inherently outcome-focused (it focuses on decisions).  
     - Requirement 7: It does not require independence.

     *Verdict*: Fails auditability (Requirement 1) and proxy awareness (Requirement 3).

  6. **Counterfactual fairness (CF)**: Requires that the decision is the same in the actual world and in a counterfactual world where the protected attribute is changed.  
     - Fails Requirement 1: Requires a causal model and features to compute counterfactuals.  
     - Fails Requirement 2: Requires exact protected attribute.  
     - Fails Requirement 3: Typically defined on the true outcome, so without the true outcome, it's unclear.  
     - Fails Requirement 4: The counterfactual distribution might change with the policy?  
     - Requirement 5: It is individual-level, so should prevent intra-group unfairness.  
     - Requirement 6: It is outcome-focused (on the true outcome).  
     - Requirement 7: It explicitly handles causality.

     *Verdict*: Fails auditability and protected attribute handling.

  ### Step 5: Which requirement excludes the most candidates?
  **Requirement 1 (Auditability)** excludes: Individual fairness and Counterfactual fairness.  
  **Requirement 3 (Proxy Awareness)** excludes: All group fairness criteria (DP, EO, CG, PP) because they use the proxy label without accounting for its bias. Also, individual fairness and counterfactual fairness are excluded for this reason as well.  
  **Requirement 2 (Protected Attribute Handling)** excludes: All criteria that require the protected attribute (which is all group fairness criteria) if the errors are significant and correlated with the outcome. However, we might still use them with the inferred attribute if we can show robustness, but the requirement says "must be robust", so they are at risk.  

  But note: **Requirement 3 (Proxy Awareness)** is the one that none of the criteria meet because they all assume the label is the true outcome (or do not address the bias). Therefore, Requirement 3 is the most excluding.

  ### Conclusion
  The most challenging requirement is **Requirement 3 (Proxy Awareness)**, which none of the existing criteria satisfy. Moreover, without true outcome data, it is difficult to design a criterion that fully meets this requirement. We must therefore consider a criterion that explicitly incorporates the limitations of the proxy and uses techniques to mitigate bias (e.g., through multiple proxies or periodic validation). 

  Given the constraints, it appears that none of the existing criteria are directly suitable. The working group may need to design a new criterion that meets these requirements, perhaps building on outcome-based criteria that are auditable and account for proxy bias, or using techniques from measurement error models and causal inference.
answer: |-
  Below is a structured list of **desiderata** (requirements) for a fairness criterion in your setting, derived from your five constraints and core principles of regulatory feasibility. Each requirement is stated with its rationale, marked as non-negotiable (N) or negotiable (G), and followed by analysis of conflicts, impossibilities, and criterion scoring.

  ---

  ### **Desiderata for a Fairness Criterion**  
  *(Non-negotiable = N, Negotiable = G)*  

  1. **Auditability via Outcomes (N)**  
     *Requirement:* Verifiable using only historical data on *decisions* (e.g., loans granted, hires) and *outcomes* (e.g., arrears, job performance ratings), without model/feature/training data access.  
     *Rationale:* Directly from Constraint 1. External auditors cannot inspect proprietary algorithms.  

  2. **Robustness to Protected Attribute Noise (N)**  
     *Requirement:* Tolerate errors in inferred protected attributes (e.g., race, gender) where errors correlate with outcomes.  
     *Rationale:* Constraint 2 prohibits reliable protected attribute recording. A criterion failing under noise invites legal challenges.  

  3. **Explicit Proxy Label Alignment (N)**  
     *Requirement:* Explicitly define the target construct (e.g., true creditworthiness) and account for proxy label bias (e.g., arrears ≠ creditworthiness).  
     *Rationale:* Constraint 3 demands acknowledgment that labels are biased proxies. Silence inherits/systematizes bias.  

  4. **Stability Under Distribution Shift (N)**  
     *Requirement:* Remain valid when policy changes alter applicant pools (e.g., advertising affecting who applies).  
     *Rationale:* Constraint 4: Fairness shouldn’t break when the policy succeeds or fails dynamically.  

  5. **Non-Vacuity (N)**  
     *Requirement:*  
     - (a) Satisfiable by feasible policies (not "deny all");  
     - (b) Unsatisfiable by degrading well-performing groups;  
     - (c) Prevent intra-group unfairness (e.g., disparities within protected groups).  
     *Rationale:* Constraint 5 ensures rules are meaningful, non-punitive, and prevent masked inequity.  

  6. **Outcome-Dependence (G)**  
     *Requirement:* Incorporate actual outcomes (e.g., repayment, job success) rather than solely decisions.  
     *Rationale:* Decisions without outcome context risk rewarding bias (e.g., denying qualified applicants). *Negotiable:* Short-term audits may lack outcome data, but long-term fairness requires it.  

  7. **Causal Agnosticism (G)**  
     *Requirement:* Avoid assuming causal relationships (e.g., protected attribute → outcome).  
     *Rationale:* Constraint 3 (proxy bias) and Constraint 2 (noisy attributes) make causal claims unreliable. *Negotiable:* If robust causal models exist, but likely infeasible here.  

  ---

  ### **Conflicts and Impossibilities**  
  #### **Conflict with Auditability (Constraint 1)**  
  - **Conflict:** Criteria demanding access to the *decision procedure* (e.g., model internals, features) violate Requirement 1 (Auditability).  
    - *Example:* Individual fairness (Lipschitz condition) requires comparing feature-space distances, which auditors cannot observe.  
    - **Resolution:** Reject any criterion not based solely on decisions/outcomes.  

  #### **Key Impossibility**  
  - **Requirements 3 (Proxy Alignment) and 6 (Outcome-Dependence) conflict with 2 (Protected Attribute Noise) and 4 (Distribution Shift) in general.**  
    - **Why:**  
      - Without the true outcome (Constraint 3), no criterion can directly measure true fairness (e.g., creditworthiness).  
      - Noisy protected attributes (Constraint 2) and shifting populations (Constraint 4) amplify measurement error.  
    - **What must give:**  
      - Outcome-Dependence (Requirement 6) must be relaxed for short-term audits (accepting proxy outcomes).  
      - **Mitigation:** Require ongoing calibration of proxies (e.g., periodic validation of arrears against true creditworthiness).  

  - **Classic impossibility results (e.g., DP + EO + Calibration incompatibility):**  
    - **Survive:** Tensions between group-parity criteria (e.g., demographic parity vs. calibration) persist.  
    - **Dissolve when Constraint 3 (proxy bias) is serious:**  
      - Impossibility theorems assume unbiased labels. With proxy bias (e.g., arrears overestimating risk in marginalized groups), satisfying criteria on proxies may worsen true fairness.  
      - **Example:** Equalized odds on biased labels can increase disparities in true creditworthiness.  

  ---

  ### **Scoring Existing Criteria**  
  *(One line per criterion; ✗ = fails non-negotiable requirement, ~ = partial/pragmatic pass, ✓ = passes)*  

  | **Criterion**               | **Score**                                       | **Key Failures**                                  |  
  |-----------------------------|------------------------------------------------|--------------------------------------------------|  
  | **Demographic Parity**      | ✗ (Excluded) | Fails 3 (ignores proxy bias), 5a/5b (levelling down), 6 (outcome-agnostic). |  
  | **Equalized Odds**          | ✗ (Excluded) | Fails 2 (noise-sensitive), 3 (assumes unbiased labels), 4 (unstable under shift). |  
  | **Calibration**             | ~ (Marginal) | Fails 3 (inherits proxy bias), 5c (allows intra-group unfairness). Passes 1 (auditable). |  
  | **Predictive Parity**       | ✗ (Excluded) | Fails 3 (proxy bias), 4 (shift-sensitive), 5b (levelling down). |  
  | **Individual Fairness**     | ✗ (Excluded) | Fails 1 (requires features/metrics), 2 (noise-sensitive), 3 (proxy-agnostic). |  
  | **Counterfactual Fairness** | ✗ (Excluded) | Fails 1 (requires model/features), 2 (exact attributes needed), 3 (causal assumptions). |  

  #### **Which Requirement Excludes the Most?**  
  - **Requirement 3 (Explicit Proxy Alignment)** excludes **all listed criteria**.  
    - None explicitly address proxy bias (Constraint 3). They assume labels are ground truth, silently inheriting bias (e.g., using arrears as creditworthiness).  
  - Runner-up: **Requirement 1 (Auditability)** excludes counterfactual fairness and individual fairness.  

  ---

  ### **Summary**  
  - **Non-negotiable core:** Auditability, noise robustness, proxy alignment, distributional stability, and non-vacuity.  
  - **Key gap:** No existing criterion satisfies Requirement 3 (proxy alignment). This necessitates a **new approach**—e.g., *explicitly auditing disparity in proxy bias* across groups or requiring bias-correction safeguards.  
  - **Recommendation:** Prioritize building a criterion around auditability (1), outcome-dependence (6), and proxy alignment (3), accepting that noise (2) and shift (4) require ongoing recalibration. Start with calibration as a pragmatic baseline, but mandate disclosure of proxy limitations.
