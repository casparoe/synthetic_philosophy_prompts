prompt: |-
  My friend says the language analogy settles the moral objectivity debate. His version: there's a ton of cross-cultural variation in moral norms, but there's just as much variation between languages, and nobody concludes from that that there's no fact about whether a sentence is well-formed — so moral variation is surface-level, the deep structure is shared, and diversity doesn't threaten objectivity. I think the analogy is being made to carry more than it can but I cant put my finger on where. Can you audit it?

  Give me the correspondence table first: what's supposed to map onto universal grammar, onto parameters, onto the competence/performance split, onto the kid who picks up the rules without ever being taught. Then the places it breaks, and which of those breaks matter for what he's using it for versus which are just idle disanalogies.

  But here's the thing that bugs me. The linguistic universals get their bite from how tightly constrained the space of possible languages is — the interesting claims are about what no language does. If the moral space isn't constrained like that, and it looks like cultures fill in nearly every slot, does the analogy still support his conclusion, or does it actually cut against it? And there's a version of this I find more interesting: both fields built their universals out of a narrow band of samples — a handful of languages on one side, undergrads plus a few small-scale societies picked for contrast on the other. Is that a point in his favour, since the bias is symmetric and so the comparison is fair, or does it mean he's comparing two artifacts of the same sampling habit?

  Then tell me what would be a better analogy. I've seen morality compared to cuisine — universal need to eat, universal taste receptors, no true cuisine — and to legal codes, where one function gets implemented a dozen different ways. Pick whichever is strongest and say what it actually supports: objectivity, anti-realism, or neither.

  And keep it tied to the actual cross-cultural work on folk moral judgement, not just the armchair stuff. My suspicion is that most of what gets called a moral universal is universal among people who fill in questionnaires, and that the real variation shows up exactly where the WEIRD samples are the odd ones out. If that's right, does it break the analogy, or is it just a methods complaint that leaves the argument untouched?
reasoning: |-
  Okay, let me unpack this user's query. They're wrestling with their friend's linguistic analogy for moral objectivity. The friend claims that just like linguistic diversity doesn't negate grammar's objectivity, moral diversity shouldn't threaten moral objectivity. The user senses the analogy is flawed but can't pinpoint why. 

  First, I need to map the linguistic concepts to moral ones as the friend likely intends. Universal grammar would correspond to innate moral foundations, parameters to cultural implementations, competence/performance to ideal vs. actual moral judgments, and language acquisition to intuitive moral development. 

  The user's core concern seems twofold: First, whether moral space is as constrained as linguistic space - if cultures occupy nearly all possible moral positions, doesn't that undermine universality claims? Second, whether the research methodologies in both fields suffer from the same sampling bias (WEIRD populations) that could make apparent universals artifacts rather than discoveries.

  Hmm, the constraint point is particularly damning. Linguistics gains credibility from discovering impossible grammatical structures (e.g., no natural language places prepositions after noun phrases without case markers). But morality lacks such bright boundaries - we find cultures endorsing infanticide, geronticide, ritual theft, etc. The analogy actually backfires here by highlighting morality's lack of formal constraints.

  The WEIRD sampling issue cuts deeper than a methods complaint. If moral psychology primarily studies populations that are outliers (Western Educated Industrialized Rich Democratic), then observed "universals" might reflect cultural projection. The friend's analogy treats both fields' findings as equally robust, but linguistics actually has broader cross-validation - we've documented thousands of languages, whereas moral psychology's "diverse" samples often mean adding one small-scale society to undergrad data.

  For better analogies... Cuisine fails because it's openly conventional. Legal systems show promise - all societies regulate behavior (function), but implementations vary wildly (form), and we don't consider any single code objectively best. This actually supports anti-realism more than objectivity. 

  Ultimately the linguistic analogy doesn't survive contact with anthropological reality. What the user needs isn't just counterarguments but positive framing: Perhaps morality combines universal problems (how to coordinate survival) with culturally crafted solutions - making it more like law than grammar. That redirects the objectivity debate toward functional adequacy rather than transcendent truth.
answer: |-
  Here's a full audit of the linguistic analogy for moral objectivity, structured as requested:

  ### Correspondence Table (Friend's Analogy)
  | Linguistic Concept          | Alleged Moral Equivalent                          | Purpose in Argument                            |
  | :-------------------------- | :------------------------------------------------ | :--------------------------------------------- |
  | **Universal Grammar (UG)**  | Innate, shared moral faculty/core principles      | Foundation for objectivity                     |
  | **Parameters**              | Culturally variable norms/rules                   | Explains surface diversity                     |
  | **Competence/Performance**  | Ideal moral judgment vs. actual flawed behavior   | Explains moral failures                        |
  | **Child Language Acquisition** | Spontaneous moral development without explicit teaching | Evidence for innateness/universality |

  ### Where the Analogy Breaks (and Why It Matters)
  1. **Constraint Problem (Critical Break)**  
     - *Linguistics:* UG tightly constrains possible grammars (e.g., no natural language uses ternary stress patterns or 7-vowel harmonic systems).  
     - *Morality:* No analogous constraints exist. Cultures exhibit genuinely incompatible values (e.g., honor killings vs. absolute sanctity of life; geronticide vs. ancestor worship; individual rights vs. collective duty).  
     - **Why it matters:** UG's predictive power comes from *ruling out* possible languages. Moral "universals" (e.g., "don't harm in-group") are either vacuously broad or have glaring exceptions (e.g., human sacrifice, capital punishment, ritual combat).

  2. **Formal vs. Functional (Critical Break)**  
     - *Linguistics:* UG defines *structural* well-formedness (e.g., syntactic trees), not communicative success.  
     - *Morality:* Moral "well-formedness" is inherently functional (e.g., promoting social cohesion). What counts as "cohesive" varies radically (e.g., caste systems vs. egalitarianism).  
     - **Why it matters:** Morality lacks syntax-like formal criteria. Calling a norm "objectively wrong" isn't like flagging a grammatical error—it’s disputing functional adequacy.

  3. **Acquisition Evidence (Major Break)**  
     - *Linguistics:* Children reliably acquire complex, rule-bound systems from impoverished input.  
     - *Morality:* Moral development shows heavy cultural shaping (e.g., Hadza children don't develop Western "fairness" instincts; Tamil "karmic" intuitions emerge early).  
     - **Why it matters:** Undermines the "innate universal faculty" claim central to the analogy.

  4. **Performance Errors (Minor Break)**  
     - *Linguistics:* Performance errors (e.g., slips of the tongue) don't refute competence.  
     - *Morality:* "Moral failures" often reflect competing legitimate values (e.g., lying to save a life), not processing errors.  
     - **Why it matters:** Moral disagreement is often about competence-level conflicts, not performance glitches.

  ### The Sampling Bias Problem: Double-Edged Sword
  - **Symmetry Claim:** Both fields historically relied on narrow samples (Indo-European languages/WEIRD subjects).  
  - **Asymmetry Reality:**  
    - *Linguistics* now documents 7,000+ languages, revealing *hard* constraints (e.g., no languages with only click consonants).  
    - *Moral Psychology* still extrapolates from limited samples. Critiques like Henrich's WEIRD problem show key "universals" (e.g., intent > outcome focus) **reverse** in some small-scale societies.  
  - **Verdict:** The analogy **backfires**. If moral "universals" are WEIRD artifacts (like claiming all languages have subject-verb-object order), sampling symmetry actually *weakens* objectivity claims by revealing methodological fragility.

  ### A Stronger Analogy: Legal Systems
  - **Correspondence:**  
    - Universal need = Social coordination  
    - "Deep structure" = Core functions (conflict resolution, resource distribution)  
    - Variation = Implementation (common law vs. tribal councils vs. socialist codes)  
  - **What It Supports:**  
    - **Anti-realism about specific rules:** No "objectively correct" statute (e.g., inheritance laws).  
    - **Limited functional objectivity:** Some systems fail basic coordination (e.g., laws enabling genocide).  
  - **Why it's better:** Acknowledges morality as a *social technology* with context-dependent solutions, avoiding UG's implausible structuralism.

  ### Does WEIRD Variation Break the Analogy?
  **Yes, decisively.**  
  - Examples undermining "universals":  
    - **Harm:** Wari' cannibalism (mourning ritual) vs. Western taboos.  
    - **Fairness:** Ultimatum game rejections near zero in Machiguenga society.  
    - **Authority:** Many Australian Aboriginal cultures lack hierarchies/obedience norms.  
  - If linguistic parameters varied as wildly (e.g., a language without nouns), UG would be falsified. Moral diversity at this scale suggests no robust deep structure.

  ### Conclusion
  The linguistic analogy fails because:  
  1. Moral space lacks UG's defining feature—*impossible* structures.  
  2. Observed diversity includes fundamental incompatibilities (not just "parameters").  
  3. WEIRD sampling masks radical variation, making apparent universals artifacts.  

  **Better framing:** Morality resembles **cuisine** (universal need + biological constraints + cultural invention) or **law** (functional universality + implementation relativity). Both support *contextual objectivity*: some systems are functionally better/worse for given goals, but no transcendent "moral grammar" exists. The debate isn't settled—it's misposed by the analogy.
