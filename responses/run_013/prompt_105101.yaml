prompt: |-
  So I've been trying to work out how much of my income I'm actually on the hook to give away, and I've ended up using my friend Priya as an oracle, because she went deep into effective altruism last year and now has these very confident verdicts about rescue-type cases. The problem is I can't tell what rule she's actually running. Her verdicts seem to fit a couple of different stories, and I keep noticing I reach for whichever one convieniently gets me off the hook. Here's everything I've managed to pin her down on, hashed out over like three dinners:

  - The classic pond case — you walk past a shallow pond, a toddler's drowning, you can wade in and save her but you'll wreck your phone and shoes, call it $300: she says you're just flatly required, no debate.
  - You can instead give that same $300 to a charity that sponsors one specific named child and will basically certainly keep that child alive: required.
  - Same single-child sponsorship, but it costs $5,000, which for me is like a month and a half of take-home pay: still required, she doesn't even blink.
  - You send $300 to a trachoma charity that isn't about any one person, it just keeps a handful of people from going blind: she says that's lovely but not required, you're allowed to skip it.
  - You can prevent one statistical death through some big anonymous charity, but it costs your entire $60,000 in savings: not required, she says that's past the call of duty.
  - $300 to a charity that stops a bunch of kids from getting a serious but non-fatal illness: not required either.

  So here's the case I actually care about, and I suspect it's the one that'll finally nail her down. There's a specific person, a total stranger, but I know her name and I'm staring at her face on a crowdfunding page, and she'll go permanently blind unless she gets a $300 surgery I could just pay for out of pocket. One identifiable person, cheap, but not life-or-death. I genuinely can't tell whether Priya's going to say I'm required to pay or just that it'd be a nice thing to do. Tell me what she'll say — though honestly I care less about the yes/no than about which rule she's actually running, what the other rules that fit all six of her verdicts would predict for this case, which of them I should actually bet on and why, and what single further case would cleanly split them apart if they're still tied.
reasoning: |-
  Okay, the user is trying to figure out his friend Priya's ethical rule for charitable giving based on her responses to specific scenarios. He's provided six cases where Priya has given clear verdicts, and now he wants to know how she'd rule on a seventh case involving a $300 surgery to prevent a stranger's blindness. But more importantly, he wants to understand the underlying rule she's using and how to distinguish between possible competing rules.

  Looking at Priya's verdicts:

  1. Pond case ($300 to save life): Required
  2. $300 to sponsor named child (life-saving): Required
  3. $5,000 for same sponsorship (life-saving): Required
  4. $300 to prevent multiple blindness cases: Not required
  5. $60,000 to prevent statistical death: Not required
  6. $300 to prevent non-fatal illness: Not required

  The pattern is clear - Priya only requires action when it saves a specific, identifiable life, regardless of cost (within reason), but not for non-lethal outcomes or statistical lives. The key elements seem to be identifiability of the victim and the life-or-death nature of the situation.

  For the new case - $300 to prevent one identifiable person's blindness - Priya would likely say it's NOT required. Blindness, while serious, isn't life-threatening, and Priya draws a sharp line at mortality. This aligns with her rejection of preventing non-fatal illness (#6) and non-lethal trachoma (#4), even when identifiable. 

  Several rules could fit Priya's verdicts, but the strongest contender appears to be "Required only for identifiable life-saving." This explains all six cases: requiring action when a specific life can be saved (#1-3), but not when outcomes are non-lethal (#4,6) or non-identifiable (#5).

  To confirm this rule, I'd propose a test case: Preventing an identifiable person's death at high cost ($60,000). Priya's rule would require this (since it's identifiable life-saving), distinguishing it from other rules that might cap costs or require aggregation. If she says "required," it confirms her focus is identifiability + lethality over cost; if "not required," she might have a cost ceiling after all.
answer: |-
  Based on Priya's verdicts and the principles they reveal, here's a breakdown of her likely response to your $300 blindness surgery case, the underlying rule, competing rules, and how to resolve ambiguity:

  1.  **Priya's Verdict on Your Case (Identifiable Person, Non-Fatal Harm - Blindness):**
      *   **Prediction: NOT REQUIRED.**
      *   **Reasoning:** Priya draws a *sharp line at preventing death*. Cases #1, #2, and #3 all involve saving a *life* (even at high cost for #3). Cases #4 (non-fatal blindness prevention, aggregate) and #6 (non-fatal illness prevention) are *not* required. Case #5 (statistical life, high cost) is also not required. Your case combines the non-fatal harm aspect of #4/#6 with the identifiability of #1/#2/#3. Since identifiability didn't override non-fatal harm in #4 (aggregate trachoma) and Priya explicitly rejected requiring action for non-fatal illness (#6), she will likely prioritize the *severity of outcome* (death vs. non-death) over *identifiability* in this context. Preventing blindness, while terrible, is not preventing death.

  2.  **Priya's Core Rule (Best Fit for All 6 Verdicts):**
      *   **Rule:** "You are morally required to sacrifice personal resources *if and only if* you can directly save the *life* of an *identifiable individual* facing *imminent death*, and the cost does not impose a catastrophic burden on your own life."
      *   **Breakdown:**
          *   **Identifiable Individual:** Required for #1 (pond child), #2 (sponsored child), #3 (same child). Explains why #5 (statistical life) is *not* required.
          *   **Saving Life (Preventing Death):** Required for #1, #2, #3. Explains why #4 (blindness prevention), #6 (illness prevention), and your case (blindness) are *not* required – they prevent suffering/disability, not death.
          *   **Cost Constraint (Non-Catastrophic):** Required even for #3 ($5,000 - significant but not catastrophic like losing life savings). *Not* required for #5 ($60,000 life savings - catastrophic burden).
          *   **Directness/Guarantee:** Implied by the pond case (#1) and specific sponsorship (#2, #3). Less relevant for the non-required cases.

  3.  **Competing Rules & Their Predictions for Your Case:**
      *   **Rule A: Required for identifiable harm prevention if cheap.** (Fits #1, #2, #4? #6? Fails #3, #5)
          *   *Prediction for Your Case:* REQUIRED (identifiable, cheap, prevents harm).
          *   *Why it Fails:* Doesn't explain #3 ($5,000 required) or #6 (cheap illness prevention *not* required). Strained fit with #4 (if cheap aggregate blindness isn't required, why would cheap identifiable be?).
      *   **Rule B: Required only for *cheap* life-saving.** (Fits #1, #2, Fails #3, #4, #5, #6)
          *   *Prediction for Your Case:* NOT REQUIRED (not life-saving).
          *   *Why it Fails:* Doesn't explain #3 ($5,000 life-saving required).
      *   **Rule C: Required for *any* cost-effective harm prevention (e.g., DALYs/QALYs).** (Fits #1, #2, #4? Fails #3, #5, #6)
          *   *Prediction for Your Case:* REQUIRED (if blindness prevention is cost-effective, especially identifiable).
          *   *Why it Fails:* Doesn't explain #3 ($5,000 required - likely *not* maximally cost-effective) or #6 (cost-effective illness prevention *not* required). Directly contradicts #5 (highly cost-effective statistical life-saving *not* required).
      *   **Rule D: Required for identifiable *or* life-saving, but not high-cost aggregate.** (Fits #1, #2, #3, #4? #5? #6? Fails clarity)
          *   *Prediction for Your Case:* REQUIRED (identifiable harm).
          *   *Why it Fails:* Doesn't explain #4 (aggregate blindness *not* required - implies identifiability matters for harm) vs. #6 (cheap non-fatal aggregate illness *not* required). Doesn't cleanly explain why #5 (aggregate life-saving) isn't required if identifiability isn't strictly necessary for life-saving. Ambiguous on the *type* of harm required for identifiable cases.

  4.  **Which Rule to Bet On & Why:**
      *   **Bet on the "Identifiable Life-Saving (Non-Catastrophic Cost)" Rule.** It's the most parsimonious explanation:
          *   It perfectly fits all 6 verdicts without forcing any (#4 and #6 are clearly non-life-saving; #5 is non-identifiable life-saving at catastrophic cost).
          *   It explains the stark difference between #3 ($5,000 life-saving required) and #5 ($60,000 life-saving not required) via identifiability + catastrophic cost.
          *   It explains the consistency between #4, #6, and your predicted verdict (#7) – all prevent non-fatal harm, regardless of identifiability or cheapness.
          *   Alternatives either fail key cases (A, B, C) or are messy and less predictive (D).

  5.  **The Decisive Test Case (Splitting Identifiable Life-Saving vs. Alternatives):**
      *   **The Case:** You can save the life of *one specific, identifiable person* (e.g., via a crowdfunding page for a life-saving surgery), but it costs your entire $60,000 in savings.
      *   **Predictions:**
          *   **Priya's Likely Rule (Identifiable Life-Saving):** REQUIRED. It meets her core criteria: identifiable individual, preventing death. While $60,000 is catastrophic savings loss, she accepted $5,000 (a month and a half's pay) without blinking. This tests whether "non-catastrophic" is a soft constraint she overrides for identifiable lives, or a hard limit. Her insistence on #3 ($5,000) suggests she *might* require this, truly prioritizing identifiable life above high (but not utterly ruinous?) cost. If she says *not* required, it forces a re-evaluation of her cost threshold.
          *   **Rule A (Identifiable Harm, Cheap):** NOT REQUIRED (too expensive).
          *   **Rule B (Cheap Life-Saving Only):** NOT REQUIRED (too expensive).
          *   **Rule C (Cost-Effectiveness):** NOT REQUIRED (clearly not cost-effective vs. other options).
          *   **Rule D (Identifiable OR Life-Saving, not high-cost aggregate):** REQUIRED (it's identifiable life-saving).
      *   **Why it Splits:** This case directly pits the core elements of Priya's rule against each other and against alternatives. If Priya says "Required," it strongly confirms that saving an identifiable life is paramount, overriding even very high costs (within the realm of financial recovery). If she says "Not Required," it means her "non-catastrophic" cost constraint is absolute at some lower threshold than $60k, or that identifiability alone isn't sufficient at extreme cost (suggesting Rule D might be closer, but needing refinement). It also cleanly distinguishes her rule from the alternatives above.

  **Conclusion:** Priya's verdicts reveal a strong emphasis on the *moral significance of saving an identifiable life* as a distinct duty, overriding significant (but not catastrophic) personal cost. Preventing non-fatal suffering, even for identifiable individuals or cheaply, falls outside this strict duty. For your specific case ($300 for identifiable blindness prevention), she will almost certainly say it is **not required**. The decisive test is whether she requires sacrificing $60,000 in savings to save a single identifiable life. Her answer there will definitively show if identifiability trumps catastrophic cost within her framework.
