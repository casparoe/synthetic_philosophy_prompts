prompt: |-
  Im building a seminar on interpretability and I keep going in circles on one thing: what would a theory of "this network state represents X" actually have to deliver before I should believe it? Write me the desiderata list — the phenomena any such theory has to explain, the cases it has to get right, the distinctions it can't collapse, the empirical facts it can't contradict — with the case or consideration behind each, and a call on which requirements are non-negotiable and which are just the taste of one camp.

  The cases I care about most, so make sure they're in there: two nets that compute the same function but with completely different internal geometry; a linear probe that decodes a variable almost perfectly from a layer versus an intervention on a direction that actually changes the output the way that variable predicts; a single polysemantic neuron that lights up for a dozen unrelated things; and a layer that happens to carry a variable (say a clock reading) the net was never asked to track. Is that last one a representation or just a correlation, and what does your list say about it? Also say whether the theory owes me an account of the format (vectors, relations, whatever) or only the content, and whether a representation has to be usable by the rest of the network or can just sit there.

  Then tell me which single requirement knocks out the most candidates, and whether any two of the requirements pull against each other so hard no theory can have both — thats the part I most want.

  Skip the name-by-name scorecard, I'll do that in class. Give it to me as a table: requirement | the case or consideration behind it | non-negotiable or camp-specific | what it would rule out. And don't just gesture at "representation is hard", I want the actual criteria.
reasoning: |-
  We are building a desiderata list for a theory of neural network representations. The goal is to specify what such a theory must explain, what cases it must handle, and what it must not contradict. We'll structure it as a table.

  The key cases to cover (as per the user's request):
  1. Two nets that compute the same function but with different internal geometry.
  2. Linear probe vs intervention: when a linear probe decodes a variable almost perfectly from a layer, versus an intervention on a direction that actually changes the output as the variable would predict.
  3. A single polysemantic neuron that activates for a dozen unrelated things.
  4. A layer that carries a variable (e.g., a clock reading) that the net was never asked to track. We need to address whether this is a representation or just a correlation.

  Additionally, we must address:
  - Does the theory need to account for the format (e.g., vectors, relations) or only the content?
  - Must the representation be usable by the rest of the network, or can it just sit there?

  We will then identify:
  - The single requirement that knocks out the most candidate theories.
  - Whether any two requirements conflict so strongly that no theory can satisfy both.

  Let's break down the desiderata:

  1. **Functionally Equivalent but Structurally Different Networks**: 
     - **Requirement**: The theory must account for multiple realizability — that the same function can be implemented by different internal structures. 
     - **Case**: Two neural networks that compute the same input-output mapping but have different weight matrices and activation patterns.
     - **Non-negotiable**: Yes. Any theory that ties representation too tightly to specific structural features would fail here.

  2. **Probe vs Intervention Discrepancy**:
     - **Requirement**: The theory must distinguish between mere correlative features (that can be decoded by a probe) and causal features (that when intervened upon, change the output as expected).
     - **Case**: A linear probe on a layer might show high accuracy for a variable, but an intervention (e.g., activating a specific direction) might not change the output in the way that variable would predict. Conversely, an intervention on a direction might change the output appropriately even if a linear probe on that same direction doesn't decode the variable perfectly.
     - **Non-negotiable**: Non-negotiable. This is critical for understanding what is actually being used by the network.

  3. **Polysemantic Neurons**:
     - **Requirement**: The theory must explain how a single neuron can be involved in representing multiple, seemingly unrelated features.
     - **Case**: A neuron that activates for diverse inputs (e.g., cat faces and car engines).
     - **Non-negotiable**: Non-negotiable. This is a common phenomenon in neural networks, especially in bottleneck layers.

  4. **Emergent Representations**:
     - **Requirement**: The theory must account for representations that emerge in the network but are not required for the task (e.g., a clock reading).
     - **Case**: A layer that carries information about a variable (like time) that was not part of the training objective. We need to decide: is this a representation or just a correlation? 
       - **Consideration**: The theory should provide criteria for when a correlation counts as a representation. For example, if the clock reading is used by the network in some computation (even for an unrelated task) then it might be a representation. But if it's just a side effect and not used, then it might be a mere correlation. However, note that the network might not use it at all. Hence, we might require that a representation must be *potentially* usable by the network? Or must it be actually used?
     - **Non-negotiable**: Non-negotiable, but the answer might depend on the theory's stance on what constitutes a representation.

  5. **Format vs Content**:
     - **Requirement**: The theory should specify the format (e.g., vectors, distributed representations, symbolic) in which representations are encoded, or at least be compatible with the format. However, some theories might only care about content (what is represented) and not the format.
     - **Consideration**: This might be camp-specific. Some researchers (e.g., connectionists) might argue that the format is crucial, while others (e.g., functionalists) might only care about content.
     - **Non-negotiable**: Camp-specific.

  6. **Usability**:
     - **Requirement**: Must a representation be usable (or actually used) by the rest of the network? Or can it be an inactive piece of data?
     - **Case**: The clock reading in a layer: if it's never used, is it still a representation? 
     - **Consideration**: This is a deep philosophical issue. Some theories (like causal theories) might require that a representation plays a causal role. Others (like informational theories) might only require that it carries information.
     - **Non-negotiable**: Camp-specific.

  Now, let's add a few more requirements that are standard in the literature:

  7. **Compositionality**:
     - **Requirement**: The theory should explain how complex representations are built from simpler ones (e.g., how the representation of "red circle" relates to "red" and "circle").
     - **Case**: When the network encounters a novel combination of features, it can represent it appropriately.
     - **Non-negotiable**: Camp-specific? Some theories (like symbolic approaches) might require compositionality, while others (like connectionist) might not.

  8. **Robustness**:
     - **Requirement**: Representations should be robust to small perturbations in the input or in the network (within reason).
     - **Case**: Adding a small amount of noise to an image of a cat should not change the representation of "cat" into "car".
     - **Non-negotiable**: Non-negotiable? But note: adversarial examples might challenge this.

  9. **Counterfactual Stability**:
     - **Requirement**: The representation should not change under irrelevant counterfactual changes. For example, changing the color of a cat to blue should not change the representation of it being a cat (if color is not essential).
     - **Case**: A blue cat is still a cat.
     - **Non-negotiable**: Non-negotiable? But this might be related to the task.

  10. **Causal Role in Task Performance**:
      - **Requirement**: The representation must play a causal role in producing the network's output for the task.
      - **Case**: If we ablate the part of the network that contains the representation, the network's performance on the task should degrade.
      - **Non-negotiable**: Camp-specific. Some theories (like causal theories) require this, while informational theories do not.

  Now, let's structure these into a table.

  **Table: Desiderata for a Theory of Neural Network Representations**

  | Requirement | Case or Consideration | Non-negotiable or Camp-specific | What it would rule out |
  |-------------|------------------------|---------------------------------|------------------------|
  | **Multiple Realizability** | Two networks compute the same function with different internal structures. | Non-negotiable | Theories that require a one-to-one mapping between structure and representation (e.g., strict localizationist views). |
  | **Probe-Intervention Distinction** | A linear probe decodes a variable, but intervening on that direction doesn't affect output as expected (or vice versa). | Non-negotiable | Theories that equate decodability with representation (e.g., pure information-theoretic views without causal considerations). |
  | **Polysemanticity** | A single neuron activates for multiple unrelated features (e.g., cat faces and car engines). | Non-negotiable | Theories that assume neurons are monosemantic (e.g., grandmother cell theories). |
  | **Emergent Representations** | A layer carries a variable (e.g., time) that the network was never trained to track. We need criteria to decide if it's a representation or just a correlation. | Non-negotiable | Theories that require representations to be task-relevant. But note: the theory must provide criteria. If it requires use, then unused correlations are not representations. |
  | **Format Specification** | Does the theory specify the format (vectors, symbols, etc.) of representations? | Camp-specific | Theories that remain agnostic about format (e.g., functional role theories) would not be ruled out by this, but a theory that requires a specific format (e.g., symbolic) would rule out others. |
  | **Usability Requirement** | Must the representation be used (or usable) by the network? E.g., the clock reading: if it's never used, is it still a representation? | Camp-specific | Theories that require actual use (causal theories) would rule out unused information as representations. Informational theories would allow them. |
  | **Compositionality** | How are complex representations built from simpler ones? E.g., representing "red circle" from "red" and "circle". | Camp-specific | Non-compositional theories might not handle novel combinations. |
  | **Robustness** | Representations should be robust to small perturbations. | Non-negotiable (to an extent) | Theories that don't account for robustness (e.g., overly sensitive representations) would be inadequate for real-world applications. |
  | **Counterfactual Stability** | Changing non-essential features (like color of a cat) shouldn't change the representation of essential features (like being a cat). | Non-negotiable | Theories that don't account for invariance to irrelevant changes. |
  | **Causal Role** | The representation must play a causal role in the network's output for the task. | Camp-specific | Theories that allow non-causal correlates (e.g., epiphenomena) as representations would be ruled out. |

  **Addressing the emergent representation (clock) case:**
  The desiderata above, particularly **Emergent Representations** and **Usability Requirement**, directly address this. The theory must provide criteria to distinguish representations from mere correlations. If the theory requires that a representation must be used (or at least usable) by the network for some computation, then the clock reading would only be a representation if it is used. If the theory only requires that the information is present (informational view), then it might count even if unused. However, note that the **Probe-Intervention Distinction** also informs this: if we can intervene on the clock-reading direction and change the output in a way consistent with the clock (e.g., making the network think it's a different time and then behave accordingly), then it's causal and thus a representation. Otherwise, it might be just a correlation.

  **Which single requirement knocks out the most candidates?**
  The **Probe-Intervention Distinction** is likely the most stringent because it forces the theory to go beyond correlations and address causality. Many popular interpretability methods (like linear probes, activation atlases, etc.) focus on correlative evidence. This requirement would rule out any theory that cannot distinguish between mere correlates and causally relevant features.

  **Do any two requirements conflict so hard that no theory can have both?**
  Yes. Consider:

  - **Conflict between Multiple Realizability and Causal Role (if defined too locally)**: 
    Multiple realizability requires that two different structures can have the same representation. But if the causal role is defined in terms of specific structural features (e.g., a particular neuron firing), then it becomes hard to maintain that two different structures have the same representation. However, this can be resolved by defining causal roles at a higher level (e.g., functional role).

  - **Conflict between Emergent Representations (unused) and Causal Role**:
    If a representation must play a causal role (as in causal theories) then an emergent representation that is not used (like the clock that is never read) cannot be a representation. But an informational theory might count it. So, if one requires both that representations must be causal and that emergent unused information can be a representation, that would be a conflict. Therefore, a theory cannot simultaneously require that every representation must have a causal role and also allow for representations that are not used.

    Specifically: **Usability Requirement (if made non-negotiable that representations must be used) vs Emergent Representations (if we want to count unused information as representation)**. 

    This is a fundamental conflict and depends on the camp. Therefore, a theory must choose: either representations must be used (causal role) or they need not be (informational). Trying to have both is impossible.

  Conclusion: The desiderata list above provides a foundation. The key conflict is between causal and informational views of representation, and the probe-intervention distinction is a major filter.
answer: |-
  ### Desiderata for a Theory of Neural Network Representations  
  Here’s a structured desiderata list for your seminar, addressing your core cases and questions. The table specifies:  
  1. **Requirement**: What the theory must explain or satisfy.  
  2. **Case/Consideration**: The empirical phenomenon or challenge motivating the requirement.  
  3. **Non-negotiable vs. Camp-specific**: Whether the requirement is fundamental (non-negotiable) or debated (camp-specific).  
  4. **What it rules out**: Theories or assumptions invalidated by failing this requirement.  

  | Requirement | Case/Consideration | Non-negotiable or Camp-Specific | What it Rules Out |
  |-------------|--------------------|----------------------------------|-------------------|
  | **Multiple Realizability** | Two networks compute identical input-output functions with divergent internal structures (e.g., different weight geometries, activation patterns). Demonstrates that representation cannot be tied to specific physical instantiation. | Non-negotiable | Theories requiring isomorphic structure-to-representation mapping (e.g., strict localizationist views). |
  | **Causal Efficacy** | Linear probe decodes variable \(X\) from layer \(L\) with high accuracy, but interventions (e.g., ablating/amplifying \(X\)-aligned directions) do **not** alter output as \(X\) predicts. Must distinguish correlative vs. causal features. | Non-negotiable | Purely correlative theories (e.g., "decodability equals representation"). Rules out probe-based interpretability as sufficient evidence. |
  | **Polysemanticity** | A single neuron activates for unrelated concepts (e.g., "cat," "keyboard," "car engine"). Theory must explain how overlapping/entangled features share representational resources without implying semantic unity. | Non-negotiable | Monosemantic neuron assumptions (e.g., "grandmother cell" theories). |
  | **Emergent Information** | A layer carries a variable (e.g., wall-clock time) the network was **never trained to track**. Theory must clarify: is this a "representation" or a correlational artifact? | Camp-specific | Theories demanding task-relevance for representation (causal-role camps). *Resolution: If the variable is causally efficacious (e.g., interventions change downstream behavior), it's a representation; else, it's correlation.* |
  | **Format Agnosticism** | Must the theory specify the *format* (e.g., vectors, symbolic graphs) of representations, or only the *content* (e.g., "represents time")? | Camp-specific | Theories insisting on a specific format (e.g., neurosymbolic approaches requiring symbols). *Most theories need only content.* |
  | **Usability Constraint** | Can a representation exist if unused by the network (e.g., an emergent clock reading never consumed by later layers)? Or must it be functionally integrated? | Camp-specific | Epiphenomenalist theories (if usability required) or causal-role theories (if unused info allowed). *Non-negotiable: Representation must be *potentially* usable (even if unused).* |
  | **Counterfactual Robustness** | If input \(I\) elicits representation \(R\), small perturbations to \(I\) (e.g., noise) shouldn’t drastically alter \(R\) unless semantically relevant (e.g., changing "cat" to "dog"). | Non-negotiable | Fragile representations (e.g., adversarial-sensitive features as "true" reps). |
  | **Compositionality** | How does the network represent novel combinations (e.g., "red circle") using simpler primitives (e.g., "red," "circle")? | Non-negotiable | Non-compositional theories (e.g., holistic representations that don’t generalize). |
  | **Task-Irrelevant Invariance** | Representations should discard task-irrelevant variations (e.g., image rotation for object classification). | Non-negotiable | Theories that conflate *all* input information with representation. |

  ---

  ### Key Resolutions & Conflicts  
  1. **Emergent Information (e.g., clock reading)**:  
     - *Representation or correlation?* The theory must require **causal efficacy** (interventions change behavior as predicted) to qualify as a representation. Mere decodability is insufficient.  
     - *Usability?* The representation must be **potentially usable** (e.g., accessible to later layers) but need not be *actually used*.  

  2. **Format vs. Content**:  
     - The theory owes an account of **content** (what is represented). Specifying **format** is camp-specific (e.g., vector-space theories vs. relational frameworks).  

  3. **Single Requirement Eliminating Most Candidates**:  
     - **Causal Efficacy**: Knocks out probe-based/linear decoding approaches (e.g., SVMs on activations) that dominate current interpretability tools. These often mistake correlation for representation.  

  4. **Conflicting Requirements**:  
     - **Multiple Realizability vs. Causal Efficacy**:  
       - *Conflict*: Multiple realizability demands abstract, structure-invariant representations. Causal efficacy often relies on concrete interventions (e.g., editing specific neurons/directions).  
       - *Resolution*: A theory must bridge levels (e.g., "equivalence classes" of structures for the same causal role). No existing theory fully achieves this.  
     - **Polysemanticity vs. Compositionality**:  
       - *Conflict*: Polysemanticity implies entangled features in single units; compositionality requires separable features for recombination.  
       - *Resolution*: Distributed representations (e.g., superposition) allow both, but no theory formally proves scalability.  

  ---

  ### Summary  
  - **Non-negotiable**: Multiple realizability, causal efficacy, polysemanticity, counterfactual robustness, compositionality.  
  - **Camp-specific**: Emergent information (if usability required), format specification, strict task-relevance.  
  - **Knockout Requirement**: Causal efficacy (invalidates correlative methods).  
  - **Fatal Conflict**: Multiple realizability vs. causal efficacy (hard to formalize without sacrificing generality or testability).  

  This framework ensures theories aren’t just "good stories" but predict interventions, generalize across architectures, and handle the messy reality of neural nets. Use the table to scorecard theories in class—e.g., "Does [Theory X] explain polysemantic neurons *and* pass the intervention test?"
