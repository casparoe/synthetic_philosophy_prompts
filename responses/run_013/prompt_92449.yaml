prompt: |-
  My buddy in my complexity theory seminar has this argument and I honestly can't tell if it's a knockdown or a mess. He says:

  (1) If consequentialism is true, then in any situation the right thing to do is whichever available action has the best consequences.
  (2) Finding that action means searching over possible action-sequences and their downstream outcomes. In any realistic situation that search space blows up combinatorially, so the problem is NP-hard (he says people have even shown stripped-down planning formalisms come out PSPACE-complete).
  (3) NP-hard means there's no efficient algorithm that solves it in general -- that's the whole point of the P vs NP business.
  (4) A human brain is a finite physical system, so it can't brute-force an exponential search over a realistically sized problem.
  (5) So consequentialism can't tell any actual human what to do in any realistic situation.
  (6) A normative theory that can't tell any agent what to do is worthless.
  (7) So consequentialism is false.

  I want to keep (4) -- pretty sure I don't have a hypercomputer in my skull -- but (7) feels way too strong, and something nags me that this thing would eat alot of moral theories, not just consequentialism. Which step do I give up, why did it look fine in the first place, and what does giving it up cost me? Be specific about exactly where the slide happens.
reasoning: |-
  Okay, the user's friend in their complexity theory seminar has this argument against consequentialism, and the user is trying to figure out where it goes wrong. Let me start by understanding each step of the argument.

  First, the argument claims that consequentialism requires finding the action with the best consequences. Then it says that searching for this action is computationally hard, like NP-hard or PSPACE-complete. Since humans can't solve such problems efficiently, consequentialism can't tell us what to do. Therefore, it's false.

  The user is stuck on step 4, which says the human brain can't brute-force exponential searches. They accept that but feel step 7 is too strong. They also suspect this argument could apply to other moral theories. So I need to find where the argument fails without rejecting step 4.

  Looking at step 2: the friend assumes that consequentialism requires an exhaustive search over all possible action sequences. But is that necessary? Consequentialism might not require the absolute best action, just a sufficiently good one. Satisficing consequentialism, for example, looks for actions that meet a threshold of goodness, not the optimal one. That could reduce the computational load. Even utilitarians like Mill or Smart might accept practical decision-making with heuristics.

  Then there's step 1: maybe consequentialism doesn't demand evaluating every possible sequence. Real-world agents use heuristics, rules of thumb, or focus on probable outcomes. So step 2 overstates the requirement. Step 5 says consequentialism can't tell humans what to do, but if we use approximations, it still provides guidance. The theory isn't worthless just because it can't find the absolute best action every time. Step 6 assumes that a normative theory must always specify the exact action, but many ethical theories rely on practical reasoning under constraints.

  Also, the user's worry that this argument affects other theories is valid. Deontology might require checking all duties in every situation, which could be computationally heavy too. Virtue ethics involves assessing character in context, which isn't straightforward. If the argument invalidates consequentialism, it might do the same to others, suggesting the problem is with the argument, not the theories themselves.

  The key misstep is step 2. The friend conflates the theoretical requirement of consequentialism with the practical method agents use. Consequentialism's truth doesn't depend on agents performing infeasible computations; it's about what makes actions right. The guidance it offers can be through practical tools, not exhaustive searches. Giving up step 2 means accepting that ethical theories operate with real-world constraints, which doesn't weaken them but makes them applicable.
answer: |-
  You're right to be suspicious. Your friend's argument is clever but commits a critical misstep at **step (2)**, and this flaw infects several subsequent steps. Let's break down where it goes wrong, why it *looks* plausible, what giving up (2) costs, and why your worry about this devouring other moral theories is spot-on.

  ### The Breakdown
  1.  **Step (1) is (mostly) correct:** This is a standard definition of *act consequentialism* (the most common target). It says the *right* action is the one with the best consequences. This is the normative claim.
  2.  **Step (2) is the fatal misstep:** This is where the slide from normative theory to *computational epistemology* happens, and it's invalid.
      *   **The Problem:** Step (2) claims that *for consequentialism to be true* or *for it to tell an agent what to do*, the agent must *actually perform* a computationally intractable search to *find* the optimal action. This conflates two very different things:
          *   **The Truth Condition:** What *makes* an action right? Consequentialism says: Having the best consequences. This is a metaphysical/normative claim about *rightness*.
          *   **The Epistemic Condition:** How does an *agent* *know* or *reliably determine* what the right action is? This is a question about knowledge, reasoning, and computational feasibility.
      *   **Why it looks plausible:** It *feels* intuitive. If the right action is defined by having the best consequences, surely you need to find that action to know what's right? This intuition drives the whole argument. Furthermore, the technical point about planning being computationally hard (NP-hard, PSPACE-complete, or even undecidable in richer formalisms) *is* correct *if* you require finding the *provably optimal* action via exhaustive search. Complexity theorists *have* shown this for abstract planning problems.
      *   **What giving up (2) costs:** Giving up (2) means accepting that **consequentialism, as a theory of what *makes* an action right, does not entail that agents must *perform* an exhaustive, optimal search to *know* what to do or for the theory to be true or useful.** This costs you the idea that a normative theory must be *epistemically transparent* or *computationally tractable* for finite agents in order to be true or provide practical guidance. This is actually a minimal cost – it's a common feature of many demanding normative theories (including non-consequentialist ones). Consequentialism can be true even if humans can't reliably compute its demands perfectly.
  3.  **Steps (3) & (4) are (mostly) correct:** NP-hardness (or worse) *does* imply that finding the provably optimal solution via exhaustive search is computationally intractable for realistically sized problems in the worst case. The human brain is indeed a finite system incapable of brute-forcing exponential searches over realistically complex action/outcome spaces. No argument there.
  4.  **Step (5) is false, *because* (2) is false:** Consequentialism *can* tell humans what to do, *not* by demanding they find the provably optimal action, but by providing:
      *   **A Standard for Evaluation:** "Try to make outcomes better." This guides action even without perfect calculation.
      *   **Heuristics & Rules of Thumb:** "Generally, honesty, kindness, and keeping promises lead to better outcomes." These are computationally feasible proxies developed through experience, evolution, or cultural learning, *justified* by consequentialism, even if imperfect.
      *   **Satisficing:** Aim for "good enough" consequences, which can be much easier to find than the *absolute best* (the search space might become polynomial or constant-time for practical purposes).
      *   **Focus on Probable/Relevant Outcomes:** Real humans don't model all combinatorially possible futures. We focus on salient, high-probability outcomes based on experience and framing. Our computational limits *shape how we apply* the theory, they don't invalidate the theory itself.
  5.  **Step (6) is false:** A normative theory isn't worthless just because finite agents can't perfectly compute its demands in all situations. Its value lies in:
      *   Providing the fundamental criterion for rightness/wrongness.
      *   Structuring moral reasoning and debate ("Will this policy *likely* lead to better outcomes?").
      *   Generating useful rules and heuristics.
      *   Critiquing existing practices and intuitions.
      *   Offering ideals to strive towards, even if imperfectly achievable.
  6.  **Step (7) does not follow:** Since the core flaw is in (2) and its consequences for (5) and (6), the conclusion that consequentialism is *false* doesn't hold. The computational intractability is a problem of *applying* the theory under constraints, not a refutation of its core claim about what *makes* actions right.

  ### Why Your Worry is Correct: This Argument is a Universal Acid
  You're absolutely right that this argument, if accepted, would "eat a lot of moral theories, not just consequentialism." Why?

  1.  **Deontology:** What counts as a "duty" in a complex situation? Does keeping promise A violate duty B? Does this situation fall under rule X or rule Y? Determining the *correct* application of all potentially relevant rules/duties in a novel, complex scenario can involve navigating combinatorial rule-conflict resolution spaces, which is also computationally hard (likely NP-hard or worse). Does deontology require exhaustively checking all possible rule applications? If so, step (4) applies.
  2.  **Virtue Ethics:** What is the "virtuous mean" between cowardice and rashness *in this specific, novel, complex situation*? Determining the truly virtuous action requires understanding the context, the agent's character, the potential impacts on flourishing – another high-dimensional evaluation problem prone to combinatorial explosion in realistic scenarios. Does virtue ethics require exhaustive evaluation of all character dimensions and outcomes? If so, step (4) applies.
  3.  **Contractualism/Scanlon:** What rules "could no one reasonably reject" in this situation? Evaluating "reasonable rejectability" for all possible rules and all potentially affected parties in a complex scenario is another massively complex evaluation. Computational intractability looms.
  4.  **Divine Command/Intuitionism:** While grounding differs, the *application* problem remains. How do you *know* God's will or the correct intuitive grasp in a novel, complex situation? If it requires evaluating all aspects to see which command/intuition applies, computational limits bite again.

  **The Core Problem:** Any normative theory that gives a criterion for rightness that depends on complex features of the world or the agent's state (consequences, rule applications, character expression, reasonable agreements, divine will) faces the *epistemic challenge* of *how finite agents determine* what that criterion demands in complex real-world situations. Computational complexity is a *universal challenge* for the *epistemology* of moral decision-making under realistic conditions, *not* a specific refutation of consequentialism.

  ### Conclusion: The Slide and the Solution
  *   **The Slide:** The critical, invalid slide happens precisely at **step (2)**. It conflates the *normative criterion* ("what makes an action right?") with the *epistemic process* ("how does the agent find out what's right?"). It assumes that for the theory to be true or action-guiding, the agent must *perform the computation* that defines the criterion *perfectly and exhaustively*.
  *   **The Solution:** Reject the conflation in (2). Consequentialism (like other normative theories) provides a *standard*, not an *algorithm*. It tells us *what we ought to aim for* (better consequences), not that we must *compute the absolute optimum* to act morally or for the theory to be valid. Humans navigate this intractability through heuristics, rules of thumb, satisficing, focusing on salient outcomes, and learning – all compatible with consequentialism being true and action-guiding. The computational challenge is real, but it's a problem of *practical moral reasoning under bounded rationality* that faces *all* substantive moral theories, not a knockdown argument against consequentialism specifically. You keep (4) – your brain isn't a hypercomputer – but you recognize that this limitation affects how we *apply* moral theories, not whether they are *true* or *valuable*.
