  Below is a decision tree that separates the three axes (determinate "what," determinate "when," and privileged locus) using concrete cases. Each branch node is a question about a specific phenomenon, and the leaves correspond to major positions in philosophy of mind. Cases are glossed briefly to ensure clarity without prior knowledge of the literature. The tree is designed so that answers do not presuppose theoretical commitments.

  ---

  ### Decision Tree: Consciousness and the Cartesian Theater

  **Start Here**  
  **Q1: In the *masked stimuli* case, a stimulus (e.g., a word) is flashed too briefly to report, yet it influences behavior (e.g., priming). When asked, subjects deny seeing it. Is the stimulus ever consciously experienced?**  
  - **Yes** (Even briefly) → Go to Q2.  
  - **No** (Never conscious) → Go to Q3.  

  **Q2: In the *split-brain confabulation* case, a patient's left hand (controlled by the right hemisphere) points to a snow shovel after seeing a snow scene, but the speaking left hemisphere (seeing a chicken) confabulates: "I chose the shovel to clean a chicken shed." Is the confabulated reason the *only* conscious cause of the action?**  
  - **Yes** (Only the left hemisphere's story is conscious) → **Cartesian materialism**.  
  - **No** (The right hemisphere has separate conscious states) → Go to Q4.  

  **Q4: In the *color phi* case, a red dot flashes left, then a green dot flashes right; subjects report one dot moving and changing color mid-trajectory. After reporting, is there a fact about what color was experienced at the midpoint?**  
  - **Yes** (e.g., "changing from red to green") → **Global workspace theory**.  
  - **No** (Only the report exists; no fact about the midpoint) → **Higher-order thought theory**.  

  **Q3: In the *blindsight* case, a patient reports no awareness of stimuli in their blind field but guesses location/orientation correctly. Is the patient having a conscious experience they cannot report?**  
  - **Yes** (Experience exists but is unreportable) → **Higher-order thought theory**.  
  - **No** (No experience at all) → Go to Q5.  

  **Q5: In the *cutaneous rabbit* case, rapid taps at the wrist, elbow, and shoulder are felt as hops along the arm. After the taps, is there a fact about *when* the elbow tap was consciously felt?**  
  - **Yes** (e.g., "at the exact time of the tap") → **Global workspace theory**.  
  - **No** (No fact about timing, even afterward) → Go to Q6.  

  **Q6: Do conscious experiences (e.g., the felt redness of red) exist as real properties, or are they illusory/inexistent?**  
  - **They exist but are misdescribed** (e.g., they’re physical or functional) → **Multiple drafts model**.  
  - **They are illusions** (e.g., brain processes that merely seem phenomenal) → **Illusionism about phenomenal properties**.  
  - **They do not exist** (e.g., talk of phenomenality is fundamentally mistaken) → **Eliminativism about phenomenal properties**.  

  ---

  ### Tree Structure and Position Mapping
  - **Cartesian materialism**: Requires a privileged locus (Q2: Yes) and determinate what/when (implicit in Q1: Yes).  
  - **Global workspace theory**: No privileged locus (Q2: No), but determinate what (Q4: Yes) and when (Q5: Yes).  
  - **Higher-order thought theory**: Indeterminate "when" possible (Q4: No or Q5: Yes), no privileged locus (Q2: No or Q3: Yes), but determinate "what" after higher-order processing.  
  - **Multiple drafts model**: No determinate what (Q4: No), no determinate when (Q5: No), no privileged locus (Q1: No), but experiences exist as interpretative judgments (Q6: Exist but misdescribed).  
  - **Illusionism**: No determinate what/when, no locus (Q1: No, Q5: No), and phenomenality is illusory (Q6: Illusions).  
  - **Eliminativism**: No determinate what/when, no locus (Q1: No, Q5: No), and phenomenality is invalid (Q6: Do not exist).  

  ---

  ### Limitations and Unoccupied Combinations  
  1. **Unseparated Leaves**:  
     - **Higher-order thought (HOT) and Global workspace (GWT)** overlap in Q4/Q5.  
       - *Why*: Both can accept retroactive determination (e.g., "what" is fixed after reporting in phi, "when" in rabbit). Q4 forces them apart only if combined with Q2 (split-brain), but HOT may answer Q3 (blindsight) independently.  
     - **Multiple drafts and Illusionism** share the same path until Q6.  
       - *Why*: Both deny determinate what/when and a locus. Only Q6 (metaphysical commitment) separates them.  

  2. **Unoccupied Combinations**:  
     - **Privileged locus + No determinate "what"**:  
       - *Status*: Incoherent. A locus implies contents are "displayed," so indeterminacy about "what" is experienced undermines the display.  
     - **Privileged locus + No determinate "when"**:  
       - *Status*: Unattractive. The theater metaphor requires temporal sequencing (e.g., when contents appear).  
     - **No locus + Determinate "what" + Determinate "when"**:  
       - *Status*: Unexamined. Most non-locus views (e.g., GWT) allow fuzzy timing ("when") or reinterpretation ("what").  

  3. **Empty Cells in Practice**:  
     - **Q2 → No + Q4 → Yes**: Occupied by GWT.  
     - **Q2 → No + Q4 → No**: Occupied by HOT (if from Q1: Yes) or Multiple drafts (if from Q1: No).  
     - **Q3 → Yes**: Only HOT occupies this.  
     - **Q5 → No + Q6 → Exist but misdescribed**: Multiple drafts.  

  ---

  ### How Cases Anchor Questions  
  - **Masked stimuli (Q1)**: Tests if unreportable stimuli are conscious (locus/completeness).  
  - **Split-brain (Q2)**: Tests if consciousness is unified (privileged locus).  
  - **Color phi (Q4)**: Tests retroactive determination of content (determinate "what").  
  - **Blindsight (Q3)**: Tests unreportable vs. non-conscious states.  
  - **Cutaneous rabbit (Q5)**: Tests retroactive determination of timing (determinate "when").  
  - **Q6**: Resolves metaphysical commitments after empirical constraints.  

  This tree isolates the three axes while forcing positions into distinct paths where possible. Use it to classify views based on empirical case judgments, not predefined theories.
