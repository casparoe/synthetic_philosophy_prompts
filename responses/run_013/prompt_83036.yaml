     Split-brain: When the left hemisphere confabulates a reason for the left hand's action, was the reason that the left hemisphere gives (a confabulation) the real reason for the action, or was the action caused by the right hemisphere without the left hemisphere knowing?

          - The confabulation is the real reason: Then the left hemisphere is the one in charge and it knows why the hand moved.

          - The confabulation is false: Then the left hemisphere does not have access to the real reason (which lies in the right hemisphere).

     But note: the split-brain case is about access and confabulation, which might relate to whether there is a privileged locus (the left hemisphere's speech center thinks it is the only one) and about determinate content (the content of the confabulation is not the real content).

