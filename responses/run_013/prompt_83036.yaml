  We are going to build a decision tree that separates three questions:
   1. Is there a determinate fact about what was experienced at a given time?
   2. Is there a determinate fact about when it was experienced?
   3. Is there a privileged locus (a "Cartesian theater") where contents are all on display at once?

   We will use the following phenomena to build the tree (with brief glosses):

   - Color phi phenomenon: Two stationary dots, one red and one green, flashed in quick succession at two different locations. Subjects report seeing a single dot moving and changing color in mid-trajectory. The experience seems to be of a moving dot that changes color, but the subject cannot know the color change until after the second dot is presented.

   - Cutaneous rabbit: A series of rapid taps on the skin (e.g., wrist, then elbow, then upper arm) are perceived as if a rabbit were hopping along the arm. The experience is of a continuous movement, but the taps are discrete.

   - Masked stimuli: A stimulus (e.g., a word or image) is presented very briefly and then immediately masked by another stimulus. Subjects report not seeing the first stimulus, but it can still influence behavior (e.g., in priming tasks).

   - Blindsight: Patients with damage to the primary visual cortex report being blind in a portion of their visual field, but can still respond to visual stimuli in that field (e.g., by guessing location or orientation) without conscious awareness.

   - Split-brain confabulation: In patients with a severed corpus callosum, stimuli presented to one hemisphere (e.g., the right hemisphere) may lead to an action (e.g., the left hand pointing to a picture). When asked why they did that, the left hemisphere (which controls speech and did not receive the stimulus) confabulates an explanation.

   We have six named positions to assign to leaves:

   1. Cartesian materialism: There is a privileged locus (Cartesian theater) where conscious contents are presented at a definite time and place. There are determinate facts about what was experienced and when.
   2. Global workspace theory (GWT): Consciousness arises when information is broadcast to a global workspace in the brain. There is no single privileged locus, but there is a determinate fact about what is conscious (what's in the workspace) and when (though timing might be a bit fuzzy). However, the workspace is distributed and not a literal theater.
   3. Higher-order thought theory (HOT): A mental state is conscious if it is the target of a higher-order thought (or perception). There might not be a privileged locus, and the timing might be tricky, but there is a fact about whether a state is conscious (if it has the right higher-order state). The content of consciousness is determined by the higher-order state.
   4. Multiple drafts model (Dennett): Consciousness is a matter of various contentful events (drafts) in the brain. There is no privileged locus, and there are no determinate facts about exactly what was experienced at a given time or when it was experienced. What matters is which drafts gain influence in behavior and speech.
   5. Illusionism about phenomenal properties: Phenomenal properties (like the subjective feel of redness) are illusions. There is no such thing as phenomenal consciousness as traditionally conceived, but there are functional processes. The tree must lead to this leaf by showing that the apparent determinacy of experience is an illusion.
   6. Eliminativism about phenomenal properties: Phenomenal properties do not exist; our talk of them is mistaken and should be eliminated. This is a more radical view than illusionism because it denies the existence of the illusion as well (or reinterprets it as a false belief).

   We must design a tree that uses concrete cases to branch on the three questions (and possibly more) without presupposing the theories.

   However, note that the three questions are:

   Q1: Determinate fact about what was experienced? (e.g., in the color phi, was the dot red or green at the midpoint? Or was it indeterminate?)
   Q2: Determinate fact about when it was experienced? (e.g., in the cutaneous rabbit, when exactly was the tap at the elbow experienced? At the time of the tap or later?)
   Q3: Privileged locus? (Is there a place in the brain where "it all comes together"?)

   But we cannot ask these directly because they are theoretical. We must use the phenomena to ask about the cases.

   Proposed decision tree:

   Start with the color phi phenomenon:

   Question 1: In the color phi phenomenon, does the subject have a conscious experience of the dot changing color before the second dot (the green one) is presented?

     - If yes: This suggests that the experience is determined in real time and that the subject might be having a kind of precognition. But this is not what happens. (We know that the subject cannot know the color change until the second dot is presented.) So this answer is incorrect. But we are building for a reader who doesn't know the theories, so we must ask in a way that the case description implies the answer.

     Instead, we can rephrase:

     "In the color phi phenomenon, the subject reports seeing a dot that moves and changes color in the middle of the trajectory. However, the second dot (which is green) is presented after the first (red). Is it possible that the experience of the color change (from red to green) occurs at a time before the green dot is presented?"

     Expected answer: No, because the green dot hasn't been presented yet.

     - If no: Then we have a retroactive effect. The experience is constructed after the fact.

     So branch:

       Question 2: In the color phi phenomenon, after both dots have been presented, is there a determinate fact about what the subject experienced at the time when the dot was (apparently) at the midpoint? (For example, did the subject experience a red dot at the midpoint? A green one? Or an indeterminate color?)

          - If yes, determinate: Then we have a view that allows for retroactive determination of experience. The experience at the midpoint is fixed as having a specific color (say, red-to-green transition) after the fact.

          - If no, indeterminate: Then the experience at the midpoint was not fixed at the time, and even after the fact there is no fact about what color was experienced at the midpoint.

     But note: the subject reports a moving dot that changes color. So they do report an experience of a change. So one might say that the content at the midpoint was a change in color. But the question is: was that content present at the time of the midpoint? Or is it only later?

     Alternatively, we can use the cutaneous rabbit for timing:

     Question 2: In the cutaneous rabbit, when the taps are delivered at the wrist, then the elbow, then the upper arm, is the experience of the tap at the elbow occurring at the time of the elbow tap, or is it only after the subsequent tap?

          - At the time of the elbow tap: Then there is a determinate time for the experience of the tap at the elbow.

          - Only after the subsequent tap: Then the timing is retroactively determined.

     And then we can ask about the content at the elbow: at the time of the elbow tap, was the subject experiencing a tap at the elbow? Or was it something else?

     But we have to be careful not to ask too many questions about the same phenomenon.

     We can also use masked stimuli:

     Question: In masked stimuli, when the subject reports not seeing the first stimulus, but the stimulus influences behavior, do you think the subject had a conscious experience of the stimulus that was then forgotten, or was the stimulus never conscious?

          - Conscious but forgotten: Then there was a determinate fact (it was conscious) at the time of the stimulus.

          - Never conscious: Then there was no conscious experience at the time.

     And for blindsight:

     Question: In blindsight, when the patient correctly guesses the stimulus, is the patient having a conscious experience of the stimulus but just not able to report it, or is there no conscious experience at all?

          - Conscious but unreportable: Then there is a fact about what was experienced (the stimulus) and when (at the time of presentation) but the subject cannot report it.

