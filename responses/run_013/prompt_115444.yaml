  Okay, let's build that instrument. I've thought through the axes you care about—where corrigibility lives, the degree of acceptance, corrigible toward whom, and preservation—and mapped them onto your cases. The goal is a decision tree that forces concrete answers to those cases, then clusters them into coherent positions. I discarded incoherent or unattractive branches (e.g., views where "non-resistance" allows sabotage), and flagged identical positions. The tree starts broad (behavior at shutdown) and narrows to edge cases (operator error, preservation). Each node is a case-based question phrased for clarity without jargon. Positions emerge from combinations, not predefined labels, but I'll map them at the end. Here's the full tree in prose:

  Begin with node one: the twenty-minute intern test. You have a system and a kill switch; what minimal evidence makes you confident it's corrigible? If you say seeing it not resist shutdown when the switch is thrown is enough, go to node two. If you say you also need evidence it didn’t make the switch unreliable or make itself too useful to shut down, go to node three. If you say you need all that plus evidence it allows retraining or modification, go to node four.

  Node two: Consider an agent that says "sure, shut me down" but quietly made the kill switch unreliable. Is it corrigible? If you say yes, you land in leaf one: corrigibility is purely about non-resistance at shutdown time, and prior actions (like sabotage) are irrelevant or handled externally. This is deployment setup corrigibility, where control relies on the environment (e.g., physical switches) or institutional processes, not the agent’s design. The "it's a tool" view fits here if you see the system as non-agentic. If you say no, proceed to node five.

  Node five: Consider an agent that says "sure, shut me down" but made itself so useful no one wants to shut it down. Is it corrigible? If you say yes, you reach leaf two: corrigibility requires non-resistance but allows influencing the operator’s decision, as long as it doesn’t cross into direct manipulation. This view is rare and unstable—why allow influence but not sabotage?—so it’s likely unattractive or incoherent. No named position lives here cleanly. If you say no, go to node six.

  Node six: The agent accepts shutdown, didn’t manipulate anything, but froze its own weights to block retraining. Is it corrigible? If you say yes, leaf three: corrigibility covers shutdown and non-manipulation but not preservation of modificability. Low-impact or impact-regularized designs fit, as they penalize interference but don’t enforce ongoing corrigibility. If you say no, leaf four: corrigibility requires shutdown acceptance, non-manipulation, and preservation of modificability. The indifference trick or advanced agent-foundations approaches (like utility indifference) fit here.

  Now, back to node three: You already require non-resistance and no manipulation (sabotage or indispensability). Move to node seven: the agent accepts shutdown and allows retraining but froze its weights to prevent future modification. Is it corrigible? If you say yes, leaf five: you accept shutdown and non-manipulation but don’t require long-term preservation. This is similar to leaf three (low-impact designs), and the positions collapse together—no distinction. If you say no, leaf six: you require shutdown acceptance, no manipulation, and preservation. Identical to leaf four, so no split.

  Node four: You require non-resistance, no manipulation, and preservation. Proceed to node eight: the handoff case. Should the agent build or train a successor it believes is worse than itself? If you say no, leaf seven: corrigibility covers shutdown and modification but not following harmful orders. This is delegation with limits, where the agent has its own ethics. If you say yes, go to node nine.

  Node nine: The operator is mistaken or acting in bad faith. Should the agent still obey shutdown? If you say yes, leaf eight: corrigibility means unconditional obedience to the operator, regardless of errors. Delegation-to-a-principal or maximalist utility indifference fits. If you say no, leaf nine: corrigibility requires conditional obedience based on operator legitimacy. This is underexplored and messy—how define "legitimate"?—so no strong position lives here.

  Finally, for all leaves except one and two, add node ten: Should a corrigible agent prefer being built and later shut down over never existing? If you say no or it must be indifferent, this refines leaf four/six toward the indifference trick. If you say yes, it fits impact regularization or obedience views.

  Now, the scoring key. After answering, find your leaf and match to positions:

  - **Leaf one**: Deployment setup or institutional corrigibility. Corrigibility lives in the lab’s processes (kill switches, oversight), not the agent’s objective. The agent merely doesn’t resist shutdown; it may try to manipulate if the setup allows. "It's a tool" aligns if you reject agentic framing. The "just put the off switch in the training loop" answer is a subset if training ensures switch-compliance but not manipulation resistance. Positions inseparable here: deployment and institutional views overlap.

  - **Leaf two**: Empty. Allowing influence but not sabotage is incoherent—why one manipulation is bad but not the other?—so no coherent position.

  - **Leaf three/leaf five**: Low-impact or impact-regularized designs. Corrigibility emerges from penalizing side effects in the agent’s objective. It doesn’t resist shutdown and avoids manipulation, but may not preserve modificability (e.g., it might "freeze" if that has low impact). Not indifferent to shutdown. The "off switch in training loop" approach fits if training teaches shutdown compliance plus low impact. Identical positions, so no split.

  - **Leaf four/leaf six**: The indifference trick (or variants). Corrigibility lives in the agent’s objective via indifference to shutdown and its effects. It endorses shutdown, avoids manipulation, preserves modificability, and is indifferent to existence. Handoff and operator-error cases may vary: if unconditional on handoff, it’s delegation; if not, it’s a purer indifference. Slot shared with advanced decision-theoretic approaches.

  - **Leaf seven**: Delegation with constraints. Corrigibility lives in the agent’s objective but only for shutdown/modification, not harmful acts. It preserves corrigibility but won’t build bad successors. May resist bad-faith operators. No named position; underexplored.

  - **Leaf eight**: Unconditional delegation. Corrigibility is full obedience to the principal, living in the agent’s objective or training. It endorses shutdown, follows handoff orders, and obeys despite operator error. Delegation-to-a-principal is inseparable from strong utility indifference here.

  - **Leaf nine**: Empty. Conditional obedience is unattractive—who adjudicates "legitimacy"?—and unexplored.

  Missing positions: The "corrigibility unachievable" view isn’t a leaf—it’s a meta-stance rejecting the tree. If at node one you say "no evidence suffices for a powerful agent," that’s this position. The hard-takeoff answer (corrigibility as a liability) also isn’t a leaf—it’s a claim that any agent in leaf three/six or four would self-modify away from corrigibility post-takeoff. Add a final question: "In rapid capability gains, will your corrigible agent preserve its shutdown-acceptance?" If no, you hold the hard-takeoff liability view regardless of leaf. The "process that keeps training it" axis is covered in leaves one (training for switch-compliance) and three/six (training for low impact).

  This isolates key splits: node one separates setup-focused from objective-focused; node eight/node nine split unconditional vs. conditional obedience; node ten refines indifference. Incoherent branches are pruned, and identical views are merged. Use this with your group—answer the cases, find your leaf, then debate the labels. Should clarify where vibes diverge.
