prompt: |-
  I spent about thirty-five years as a working scientist — chemistry, then a long stretch in systems neuroscience — and since retiring I've been reading philosphy properly for the first time, mostly phil of mind and cognitive science. I've gotten quite taken with predictive processing and the free energy principle. Taken enough that I'm thinking of putting some actual money behind it: I have enough set aside to fund two postdocs for two years, or a small workshop series, and I want it to go somewhere that matters rather than somewhere that just generates more papers.

  Here's my problem. I can follow the basic story — systems minimize prediction error, or minimize free energy, and everything else is supposed to fall out of that. What I can't tell is which of the many loose threads are the deep ones and which are bookkeeping. I keep bumping into the same set of puzzles and I have no instinct for which are load-bearing. For instance: is the Markov blanket doing real metaphysical work, or is it just redrawing the boundary it was supposed to explain — I've seen people distinguish Pearl blankets from Friston blankets and I genuinely can't tell whether that's a fault line or a terminology fight. Does expected free energy double-count the epistemic and the pragmatic, or is that a misunderstanding on my part? Does "self-evidencing" say anything over and above plain Bayesian inference? Is the framework unfalsifiable in a way that matters, or only in the boring way that every framework is? What do I do with the dark-room objection — is it a real problem or a cheap shot? And can hierarchical PP ever get you compositionality, or is it stuck at association all the way up? Those are just the ones I've noticed; I'd bet there are three or four more that I'm not even seeing because I don't know the literature well enough to know they exist.

  So what I want from you: which open conceptual questions in this area are most worth two postdocs and two years, and in what order? I care much less about the list than about the why. For each one, tell me what makes it upstream of other work rather than downstream, whether it's the kind of thing a philosopher can actually make progress on rather than needing a modeller or an experimentalist, and which questions look important but are really just restatements of something more basic wearing a costume. Be willing to say a few of them are probably dead ends, and say which. And don't give me a reading list or citations — I can find papers myself, that's not the bottleneck. The bottleneck is judgment about where the effort should go.

  Could you put it in this shape, please:

  - Bottom line — the short version, maybe 150 words, the ranking in miniature and the one criterion you weighted most.
  - The shortlist — each candidate question in a few sentences, enough that I can see what the question actually is.
  - The ranking, and the reasoning behind it — the long part, call it 700 to 800 words. Why this one sits above that one, what depends on what, and where the philosopher-versus-modeller line falls.
  - What would move a question up or down — 200 words or so. What result, argument, or failure over the next couple of years would change your ordering.
  - Where you're least confident — 150 words. I'd rather know where you're guessing than get a tidy answer that hides it.
