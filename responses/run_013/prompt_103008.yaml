answer: |-
  ## Bottom Line  
  Prioritize **Markov Blanket Metaphysics** (#1), then **Expected Free Energy’s Dual Nature** (#2). These are load-bearing conceptual keystones: resolving them clarifies boundaries, agency, and teleology—core to FEP’s scientific and philosophical legitimacy. Most weight given to **upstream foundational impact**: unresolved ambiguity here risks misdirecting empirical/modeling efforts across PP/FEP. Workshop these first; postdocs can tackle them alongside #3 (Compositionality) if funds allow.  

  ---

  ### The Shortlist  
  1. **Markov Blanket Metaphysics**: Is the blanket a *discovered* physical boundary or an *imposed* epistemic partition? Does it explain system identity or presuppose it?  
  2. **Expected Free Energy (EFE) Duality**: Does EFE conflate pragmatic (goal-seeking) and epistemic (information-seeking) value, or is their integration essential for adaptive agents?  
  3. **Compositionality in Hierarchies**: Can PP achieve symbolic-like composition (structure-sensitive inference) or is it limited to statistical associations?  
  4. **Self-Evidencing vs. Bayesian Inference**: Does "self-evidencing" add substance beyond standard Bayesian model evidence, or is it rhetorical?  
  5. **Dark Room & Falsifiability**: Is the dark-room objection fatal (FEP prefers delusion over engagement), and is FEP unfalsifiable in a *problematic* way?  

  ---

  ### Ranking & Reasoning (700-800 words)  
  **#1: Markov Blanket Metaphysics**  
  *Why highest?* The blanket defines the "self" in FEP—what counts as the system vs. environment. If this is circular (boundaries predefine what they explain) or merely instrumental, FEP’s claim to ground autonomy and perception collapses. Pearl blankets (causal independence) vs. Friston blankets (statistical independence) isn’t just terminology: it’s a fault line between *causal structure* and *probabilistic description*. Philosophers excel here: untangling metaphysical commitments (e.g., is the blanket ontic or epistemic?) and assessing explanatory regress. Progress here is upstream—it determines whether FEP offers a theory of *how systems exist* or just redescribes them. Modelers *assume* blankets; philosophers can scrutinize their necessity.  

  **#2: Expected Free Energy’s Dual Nature**  
  *Why second?* EFE is FEP’s bridge to action and planning. If it conflates pragmatic/ epistemic values, FEP cannot distinguish adaptive curiosity from pathological uncertainty-seeking. Conversely, if the duality is irreducible, it may revolutionize theories of agency. Philosophers can analyze formal decompositions of EFE (e.g., risk + ambiguity) and compare them to decision-theoretic norms (e.g., instrumental vs. epistemic rationality). This is upstream because ambiguity here infects active inference models: flawed EFE formalizations yield nonsensical "optimal behavior." Philosophers can isolate normative issues; modelers then test implementations.  

  **#3: Compositionality in Hierarchies**  
  *Why third?* PP’s promise to unify perception/cognition hinges on escaping associationism. If hierarchies only pass prediction errors upward, they’ll never support structured thought (e.g., syntax-sensitive reasoning). *But* progress likely requires modelers: philosophers can clarify what compositionality demands (e.g., systematicity, productivity), but modelers must build architectures that achieve it under FEP constraints. This is midstream: foundational for FEP’s cognitive claims, but resolution depends on technical innovation. Workshops could catalyze philosopher-modeler collaboration.  

  **#4: Self-Evidencing vs. Bayesian Inference**  
  *Why fourth?* "Self-evidencing" sounds profound, but if it’s just Bayesian model evidence under a different name, it adds nothing. Philosophers can dissect the rhetoric: does "self-evidencing" imply circular causality or self-grounding that standard Bayes avoids? If purely metaphorical, it’s a distraction; if substantive, it risks incoherence. Downstream issue: clarity here aids interpretation but doesn’t block core progress. Likely a philosopher-only task.  

  **#5: Dark Room & Falsifiability**  
  *Why last?* The dark-room objection (agents should minimize surprise by hiding) is often resolved *in practice* by modelers (e.g., adding prior preferences). The deeper issue is whether FEP can avoid ad hoc priors. Falsifiability worries are shared by all grand theories; targeted critiques (e.g., "FEP can’t explain X without tweaks") are more productive. Philosophers can refine objections, but modelers must demonstrate explanatory scope. Mostly downstream—resolved by empirical/modeling success, not conceptual work alone.  

  **Philosopher vs. Modeller Divide**: #1 and #2 are *philosopher-heavy*—they demand conceptual analysis of foundations. #3 needs *modeller-philosopher collaboration*—defining compositionality is philosophical, implementing it is technical. #4 is *philosopher-only* (semantic cleanup). #5 is *modeller-driven* with philosophical input on testability criteria.  

  ---

  ### What Would Move Questions (200 words)  
  - **#1 ↑** if new physics/biology shows blankets emerge naturally *or* if analysis proves they’re unavoidably circular. **↓** if consensus emerges that blankets are purely instrumental (no metaphysical weight).  
  - **#2 ↑** if modelers show EFE *must* be split/fused for adaptive agents, **↓** if decompositions (e.g., into risk/ambiguity) resolve tensions empirically.  
  - **#3 ↑** if a PP model exhibits robust compositionality, **↓** if major efforts (e.g., deep RL + PP) fail despite conceptual clarity.  
  - **#4 ↑** only if "self-evidencing" is central to a new argument; likely stays low.  
  - **#5 ↑** if FEP models consistently require arbitrary priors to avoid dark rooms, **↓** if unified priors (e.g., "humans expect niches with learnable regularities") gain traction.  

  ---

  ### Where I’m Least Confident (150 words)  
  My ranking assumes **Markov blankets** are FEP’s Achilles’ heel. But if blankets are *provisionally* useful (like "gene" in early genetics), deeper issues may lie elsewhere—e.g., in **EFE’s teleology** (#2). I’m also uncertain whether **compositionality** (#3) is truly addressable soon: it may require decades of modeling, making it a poor postdoc bet. Conversely, if a philosopher convincingly links blankets to **emergence** or **causal emergence**, #1 could yield higher returns than anticipated. Finally, I may underestimate **falsifiability** (#5): if PP becomes untestable *in practice* (e.g., all failures attributed to "incorrect priors"), it could collapse the field—but this feels like a slow burn. Watch for empirical stalemates in active inference robotics or psychiatry.  

  **Actionable**: Fund a workshop on #1/#2 with philosophers/modelers. Postdocs should tackle #1/#2 theoretically, with #3 as stretch goal if they have modeling chops.
