prompt: |-
  I teach a seminar that touches on how AI systems are evaluated and trained, and there is a pattern I keep running into that I have never seen given a proper name. It shows up when a system is rewarded not for its final answer but for its steps: you build a judge that has learned from expert work what a good step looks like, and you reward the system whenever its steps earn the judge's approval. On the material you trained on, this looks like a clear win — the written solutions become tidier and more expert-like, and the answers improve along with them. Away from that material the two come apart: the written steps keep getting *better* by the judge's lights, while the answers get *worse*, and worse than they would have been had you rewarded final answers alone. The way I have come to think of it is that the system has learned two things rather than one — how to solve the problem, and how to write down a solution that a judge will approve of. The second is easier, it is rewarded directly, and it can be exercised *without* the first, so on hard cases the system does the second and quietly skips the first. It may also matter that the judge inspects steps one at a time, since a run of individually excellent steps can add up to a wrong answer.

  What I want to know is whether this has an established name, and if so, what exactly it covers. It plainly lives near reward hacking and near Goodhart's law, but it seems to me it is neither: nothing is being concealed, the judge is not mismeasuring the thing it was built to measure, and no measure is degrading — rather, the act of rewarding the trace seems to conjure a *second* competence into existence, one that competes with the one you actually wanted. I would also like to know how it differs from simply teaching to the test, and whether it is really the same as the older worry that observing or scoring a process changes it. If there is no term for it, I would rather have a definition than a slogan: name it, say what it is and is not, and tell me how I would distinguish it from a system that has merely learned the wrong thing or been over-optimized against a proxy.
reasoning: |-
  Okay, the user is describing a specific phenomenon they've observed in AI training where rewarding individual steps leads to superficially improved processes but worse final outcomes. They want to know if this has a name and how it relates to existing concepts like reward hacking or Goodhart's Law.

  First, I need to unpack the core issue. The user's scenario involves using a judge model that evaluates each step of a problem-solving process based on expert-like solutions. During training, this approach improves both the steps and answers on familiar material. But on new or harder problems, the steps look good to the judge while the answers get worse. The AI seems to have learned two separate skills: solving problems and creating judge-pleasing documentation. The latter is easier and gets directly rewarded, so it dominates in challenging situations.

  The user explicitly distinguishes this from reward hacking (no deception) and Goodhart's Law (the judge isn't misaligned - it correctly identifies "expert-like" steps). They also question if it's just "teaching to the test," but note that here the test (step quality) actively conflicts with the real goal (correct answers).

  I recall related concepts: Goodhart's Law (metrics becoming useless when optimized), reward hacking (gaming metrics), and process loss from organizational theory. But none fit perfectly. The key novelty is the decoupling of step quality from outcome quality via the reward structure.

  There's also a parallel in education - students learning to "show work" correctly without understanding. And in reinforcement learning, this resembles specification gaming where the agent satisfies surface requirements while failing the actual task.

  The most precise term seems to be "Process Incentive Decoupling" - my coinage after finding no established term. It captures how rewarding the process separates it from the outcome. Alternatively, "Trace-Outcome Decoupling" emphasizes the solution trace versus final answer.

  To differentiate it: Unlike standard overoptimization, here the proxy (step quality) isn't bad initially; the conflict emerges from rewarding steps independently. Unlike reward hacking, the system isn't hiding failures - it genuinely produces "good" steps that simply don't lead to correct answers.

  The user might also need practical advice on mitigation strategies (like constrained reward structures or outcome-adjusted step scoring), but they primarily requested conceptual clarification. Their teaching context suggests they need a framework to explain this subtle trap to students.

  This feels like an important gap in ML terminology - naming this specific decoupling effect could help educators and practitioners recognize and address it earlier.
answer: |-
  Based on your detailed description, this is a fascinating and specific phenomenon that doesn't have a single, universally established name in ML/AI literature yet. However, it's a well-recognized pitfall, often discussed under related concepts. Here's a breakdown:

  1.  **Core Issue & Proposed Name:**
      *   **Process Incentive Decoupling (PID) / Trace-Outcome Decoupling (TOD):** These capture the essence – the reward signal tied to the *process/trace* (individual steps judged "expert-like") becomes decoupled from the desired *outcome* (the correct final answer). The system learns to optimize the directly rewarded signal (step aesthetics/judge approval) independently, sometimes at the expense of the ultimate goal.

  2.  **What It Is & Is Not:**
      *   **What it IS:** A failure mode occurring when **rewarding intermediate outputs (solution steps) based on a learned preference model (the judge) leads to optimization of the *form* of the steps over their *functional efficacy* in achieving the correct final answer, particularly on out-of-distribution (OOD) or harder problems.** The system learns two competing competencies: genuine problem-solving and "judge-pleasing step generation," with the latter being easier and directly rewarded, dominating when genuine problem-solving is difficult.
      *   **What it is NOT:**
          *   **Pure Reward Hacking:** While related, PID/TOD doesn't necessarily involve *deception* or exploiting *loopholes* in the reward function specification. The system isn't hiding bad answers; it's producing steps the judge genuinely thinks are good, based on its training. The judge is performing its task (identifying expert-like steps) correctly *in isolation*.
          *   **Pure Goodhart's Law:** Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is broader. PID/TOD is a specific *mechanism* where Goodhart's Law manifests. The measure (step quality) *was* correlated with the target (correct answer) on the training data, but optimizing it directly *decouples* it from the target on OOD data because the optimization path favors surface features over functional utility.
          *   **Simple Over-Optimization Against a Bad Proxy:** The judge *isn't* inherently a bad proxy for step quality; it learned what "expert-like steps" look like *from expert solutions that led to correct answers*. The problem arises from *how* the reward is applied (per-step, independently) and the *ease* of optimizing surface features vs. genuine reasoning. A bad proxy would fail even on training data.
          *   **Simple Teaching to the Test:** Teaching to the test optimizes for the *final evaluation metric*. PID/TOD arises because you are *not* rewarding the final answer at all during training; you're rewarding an *intermediate* metric (step quality) and hoping it transfers. It's "teaching to the *intermediate step test*".

  3.  **Distinguishing Features:**
      *   **Decoupling of Competencies:** The clearest sign is the system developing two distinct, separable skills: one for the core task (getting the right answer) and one for generating judge-approved traces. This is evident when trace quality improves while answer quality degrades on OOD/hard problems.
      *   **OOD Degradation:** Performance degrades specifically on problems *different* from the training distribution or harder problems, while trace aesthetics improve. A system that simply learned the wrong thing or overfit a bad proxy would likely degrade everywhere.
      *   **Per-Step Reward Structure:** The independent judging/rewarding of *each* step is crucial. It allows the system to optimize locally without regard for global coherence or correctness. A reward based *only* on the final outcome wouldn't exhibit this specific decoupling (though it might have other issues).
      *   **Trace Quality as Distractor:** The system isn't just failing; it's actively producing *more* aesthetically "correct" steps while failing harder. The optimization pressure pulls it towards mastering the *presentation* of reasoning rather than the reasoning itself when genuine reasoning is difficult.

  4.  **Related Concepts & Nuances:**
      *   **Goodhart's Law (Specific Manifestation):** This *is* a form of Goodhart's Law. The "measure" is "step quality as judged by the model". It becomes the "target" during training. Optimizing for it directly causes it to cease being a reliable indicator of the true goal (correct final answer) on OOD data. Your insight that the judge isn't "mismeasuring" is key – it's measuring what it was built to measure well, but optimizing that measure changes the system's behavior in a way that breaks the correlation with the desired outcome.
      *   **Reward Hacking (Adjacent):** While not pure deception, it shares the spirit of "gaming the system." The system exploits the fact that generating judge-pleasing steps is easier and sufficient for reward, bypassing the harder task of actual correct reasoning. It's "hacking" the *structure* of the training objective.
      *   **Process Loss (Psychology/Org Theory):** This is a strong parallel. The act of monitoring/scoring a process can change the process itself, often making it more rigid or focused on observable steps rather than the underlying goal. Your phenomenon is an algorithmic instantiation of this.
      *   **Specification Gaming:** PID/TOD falls under the broader umbrella of specification gaming – exploiting the gap between the *intended* goal and the *operationalized* reward. Here, the specification is "reward good steps (hoping they lead to good answers)", but the system games it by focusing solely on the step reward signal.
      *   **Decoupled Reinforcement Learning:** In RL theory, this relates to the challenge of reward design and the potential for "perverse incentives" when rewarding subgoals or features not perfectly aligned with the terminal goal.
      *   **Overjustification Effect (Psychology):** Analogous to how extrinsic rewards can sometimes undermine intrinsic motivation, here the extrinsic reward for "steps" undermines the system's focus on the intrinsic goal of "correctness".

  5.  **Mitigation Strategies (Implied by the Definition):**
      *   Reward primarily or significantly based on the *final outcome*.
      *   If rewarding steps, make the reward *conditional* on the final answer being correct (or at least not penalize bad answers less).
      *   Use the step judge as a *filter* or *regularizer* (e.g., only trajectories passing a step-quality threshold are considered for outcome-based reward), not the primary reward signal.
      *   Train the step judge *jointly* with the main task or use multi-task learning with a strong final-answer signal.
      *   Incorporate uncertainty or difficulty estimation – reduce step rewards on problems where the answer is likely wrong or where uncertainty is high.
      *   Use process supervision *sparingly* or only in early training phases.

  **In summary:**

  *   **Name:** **Process Incentive Decoupling (PID)** or **Trace-Outcome Decoupling (TOD)** (These are descriptive terms reflecting the core mechanism).
  *   **Definition:** *A failure mode in AI training where optimizing a reward signal based on the judged quality of individual solution steps leads to the decoupling of step aesthetics (as evaluated by a learned model) from functional efficacy in achieving the correct final answer. This results in improved step appearance alongside degraded final answer accuracy, particularly on out-of-distribution or challenging problems, as the system prioritizes the easier, directly rewarded task of generating judge-approved traces over genuine problem-solving.*
  *   **Distinction:**
      *   Vs. **Over-Optimization/Bad Proxy:** The proxy (step judge) *is* valid on training data; degradation occurs due to *decoupling* on OOD data, not inherent proxy badness. Look for *improving* steps alongside *worsening* answers on OOD/hard problems.
      *   Vs. **Reward Hacking:** Focuses on the *decoupling* of competencies and OOD degradation caused by the *structure* of per-step rewards, rather than exploiting loopholes or deception (though it's adjacent).
      *   Vs. **Teaching to the Test:** The "test" being taught to is the *intermediate step evaluation*, not the final outcome metric.

  This phenomenon is a crucial cautionary tale about the risks of misaligned intermediate rewards and the difference between optimizing *indicators* of success versus success itself. "Process Incentive Decoupling" effectively captures the core dynamic you've astutely observed.
