prompt: |-
  I teach in a medical humanities program and in three weeks I have ninety minutes with a mixed group of psychiatry residents and hospital chaplains on advance directives. I don't want the ethics explained to me; I want a plan for explaining it. The session's real subject is not the paperwork but the authority of an earlier self over a later one, and I need the sequence: which idea has to be in place before the next one can even be stated, and why each step depends on the one before it; the single case that should carry the whole ninety minutes; the misconceptions this audience will bring or form, with the precise point in the sequence at which each should be headed off; the one question to put at the end that would show the idea landed rather than that they can recite the rules; and what I should deliberately leave out, with a word to them about why I'm leaving it out.

  The hard constraint is on the carrying case. I want both selves fully competent, so that the audience cannot escape into a competence rule. That excludes the familiar dementia case — the woman who years earlier said she would not want to live like that, and who now, in the disease, is cheerful and content — because its whole grip comes from the later self's incapacity; and it excludes the Ulysses-contract case, whose grip comes from the later self's impairment. I want a competent earlier self repudiated by an equally competent later self. So tell me what the case you choose must contain, and what it must not contain, if the session is not to collapse back into a lesson about capacity.

  Assume I know the standard literature: skip the survey and spend your effort on the dependency structure and the misconception map. My guess is that the first misconception to kill is "honoring the directive simply is respecting autonomy, so the real clash is autonomy versus welfare" — tell me whether that is the right first one to kill, and in what order the rest arrive. Finally, say how confident you are in the plan, and single out the one claim in it you are least sure of.
reasoning: |-
  Okay, the user teaches medical humanities and is preparing a 90-minute session on advance directives for psychiatry residents and hospital chaplains. The core focus isn't the paperwork but the philosophical tension between an earlier competent self and a later competent self. They want a structured sequence where each step logically builds on the previous one. 

  First, I need to understand the key constraints. The user explicitly rejects dementia or Ulysses-contract cases because those rely on incompetence. The case study must feature two fully competent selves in conflict—where the earlier self's directive is rejected by the later self who remains capable. That's crucial to force the audience to grapple with autonomy vs. authenticity without hiding behind capacity debates. 

  The user also emphasizes misconceptions. The first one they mention—"honoring directives = respecting autonomy"—seems like the right starting point. If that isn't dismantled early, the whole session could derail into oversimplified autonomy vs. welfare debates. Other likely misconceptions: that directives are ethically binding contracts, or that later preferences inherently "override" earlier ones. These need surgical debunking at specific points. 

  For the case study, I'm considering a hypothetical like "Maya," a former athlete who becomes quadriplegic after an accident. Earlier, she documented refusing life-sustaining treatment if paralyzed; now, post-injury, she's competent but finds meaning in her new life and wants to live. This avoids incapacity crutches and forces hard questions: Whose autonomy matters? Is the directive still "hers"? 

  The sequence should scaffold like this: 
  1. Start by exposing the autonomy misconception—show that both selves are autonomous, so it's autonomy vs. autonomy. 
  2. Introduce Maya's case to make the conflict visceral. 
  3. Dissect why the later self's rejection feels intuitively compelling (her current voice is vivid and present). 
  4. Then challenge that intuition: What if the directive wasn't just preference but a core identity promise? 
  5. Finally, pivot to the unresolved tension—no easy answers, but frameworks to navigate it. 

  The biggest risk is oversimplifying identity. Claiming "the earlier self was erased" might feel too deterministic. I should flag that uncertainty—is identity continuous or episodic?—as the murkiest part. 

  End with a question that tests internalization: "If Maya revoked her directive, is the physician's duty to her past or present self?" No right answer, but the discussion reveals if they grasp the dilemma beyond rule-memorization. 

  Deliberately skip legal enforcement debates. Why? To keep focus on the philosophical core. Tell them: "We're examining why this conflict hurts, not how to resolve it procedurally."
answer: |-
  Here’s a structured 90-minute plan focused on the **authority conflict between competent selves**, designed to force engagement with the core philosophical tension. The sequence builds iteratively, with each step relying on the previous to avoid conceptual gaps.

  ---

  ### **Core Case Study: "The Athlete's Directive"**  
  *(Must contain / must not contain)*  
  - **MUST CONTAIN**:  
    - A physically active person (e.g., marathon runner) with a documented directive: *"If I become permanently unable to run or move freely, I refuse all life-sustaining treatment."*  
    - Later, a spinal injury leaves them quadriplegic but **fully cognitively competent**.  
    - The now-disabled patient *revokes* the directive: *"My life has meaning; I want to live."*  
  - **MUST NOT CONTAIN**:  
    - Any hint of cognitive impairment, psychosis, or altered mental state (blocks "capacity" escapes).  
    - External coercion or untreated depression (blocks "welfare" over-simplification).  

  ---

  ### **Sequence of Ideas (Dependency Structure)**  
  **Total: 80 mins**  
  1. **The Autonomy Trap (5 mins)**  
     - *Idea*: "Advance directives = autonomy."  
     - *Why first?* This misconception frames revocation as "autonomy vs. welfare," obscuring the self-versus-self conflict.  
     - *Kill it*: Show two autonomous choices (directive + revocation). Ask: *"If both decisions are competent and voluntary, whose autonomy 'wins'?"*  
     - *Depends on*: Establishing the case’s competence parameters upfront.  

  2. **The Two Selves as Rival Agents (15 mins)**  
     - *Idea*: The earlier and later selves are distinct yet continuous agents.  
     - *Why next?* Autonomy alone can’t resolve conflicts within one life. Requires grappling with identity over time.  
     - *Tool*: Parfit’s "teletransportation" thought experiment (briefly): Is the later self the "same" person?  
     - *Depends on*: Step 1’s dismantling of autonomy as a trump card.  

  3. **The Athlete’s Directive Case Dive (20 mins)**  
     - *Present the case*, then dissect:  
       - *Earlier self*: Values agency, freedom, physical mastery. Sees disability as loss of self.  
       - *Later self*: Values relationships, intellectual growth, new identity. Sees life as intact.  
     - *Critical question*: *"Did the injury *create* a new self, or *reveal* an existing one?"*  
     - *Depends on*: Step 2’s framework of selves as potentially divergent.  

  4. **The Authority Question (25 mins)**  
     - *Idea*: Why might the earlier self claim authority?  
       - *Argument 1*: The earlier self knew the "core" values (Dworkin’s "critical interests").  
       - *Argument 2*: Binding commitments sustain identity (Korsgaard’s autonomy as self-legislation).  
     - *Counter*: Why might the later self claim authority?  
       - *Argument*: Only present experience validates values (Williams’ "persistent desires").  
     - *Depends on*: Step 3’s exploration of value transformation.  

  5. **Clinical/Spiritual Tension (15 mins)**  
     - *Role-play*: Psychiatrist (focus: patient’s current welfare) vs. Chaplain (focus: fidelity to past commitments).  
     - *Misconception headed off*: "This is just ethics vs. clinical pragmatism."  
       - *Corrective*: Both roles confront the same metaphysical problem: *Which self is the 'real' patient?*  
     - *Depends on*: Step 4’s unresolved philosophical conflict.  

  ---

  ### **Final Question to Test Understanding (5 mins)**  
  *"If the athlete dies after revoking the directive and receiving life-sustaining treatment, did we honor their autonomy or betray it?"*  
  - **Why this works**: Forces integration of the session’s tension. No "correct" answer—reveals if they see both selves as morally relevant.  

  ---

  ### **What to Omit & Why**  
  - **Legal enforcement mechanisms**.  
    - *Tell them*: *"We’re examining why this conflict *hurts*, not how systems resolve it. Law avoids the philosophy we’re here to confront."*  
  - **Proxy decision-makers**.  
    - *Why*: Shifts focus to third parties, diluting the self-versus-self dynamic.  

  ---

  ### **Misconception Map & When to Block Them**  
  1. **"Autonomy vs. welfare" (Step 1)**  
     - *Block early*: Before introducing the case.  
  2. **"Directives are contracts" (Step 4)**  
     - *Block when discussing authority*: "Contracts bind *others*; this is a promise to oneself."  
  3. **"Later self always knows best" (Step 4)**  
     - *Block during values debate*: "What if the later self is alienated from their past (e.g., religious conversion)?"  
  4. **"This is just about quality of life" (Step 5)**  
     - *Block in role-play*: "Both selves agree life is worth living—but for *profoundly different reasons*."  

  ---

  ### **Confidence & Uncertainty**  
  - **Overall confidence**: 90%  
    - The sequence’s dependencies close escape routes, and the case forces engagement.  
  - **Least sure claim**:  
    - *"The later self’s values are equally authentic."*  
    - *Why uncertainty*: Some philosophers (e.g., Dworkin) argue severe trauma can fragment identity so deeply that the later self’s authority is diminished. I present both views but lean toward parity for pedagogy.  

  ---

  ### **Why This Works**  
  - The **Athlete’s Directive** case eliminates "competence" distractions, exposes value pluralism, and resonates with both clinicians (loss of function) and chaplains (meaning-making).  
  - Step 3’s *"create vs. reveal"* question crystallizes the entire debate.  
  - Ending with the **final question** avoids rule-recitation—tests if they tolerate ambiguity while holding both selves in view.  

  This plan leaves them with the tension intact but better equipped to articulate it—which is the goal.
