prompt: |-
  I am a high school student in a philosophy club, and I have spent the last few weeks trying to write up an argument that our adviser sketched for us about moral particularism, the view that there are no true moral principles because the same feature of an action can count in favor of it in one case, count against it in another, and count for nothing at all in a third. I have set the argument out in numbered steps and then extended it with two steps of my own, and the result now appears to prove vastly more than the position it began from. I would like a diagnosis: which step fails, why it looked innocent, and what each side has to pay.

  (1) A moral principle would have to say that some feature of an action, such as that it breaks a promise, or causes pain, or gives someone pleasure, makes the same moral difference wherever it turns up, so that the feature is always and everywhere a reason for or against acting that way.

  (2) No feature behaves like that. Our adviser's illustrations: that an act causes someone pain is normally a reason against it, but the pain a bully feels when he is stopped from hurting a smaller kid is not a reason against stopping him at all; that an act gives someone pleasure is normally a reason in its favor, but the pleasure a bully takes in humiliating a classmate is no reason in favor of the humiliation.

  (3) So no feature carries a fixed moral valence.

  (4) So no moral principle of the kind described in (1) can be true.

  (5) And since no moral principle can be true, a good moral judge never needs one: judging is seeing what matters here, not applying a rule.

  (6) I then noticed that the phenomenon in (2) is not peculiar to morality. That a witness sounds confident is a reason to believe her, but not when she is the sort of person who is confident about everything. That a move threatens my queen is a reason to answer the threat, but not when answering it is exactly what loses the game. That a study found an effect is a reason to believe the effect is real, but not when the study was small, unblinded, and the result barely cleared significance.

  (7) So if (2) licenses (3) and (4), then (6) licenses the same conclusion about reasons in general, and there are no true general principles of evidence, inference, or strategy either, no rule of inference that holds in every case and no method that works in every context.

  (8) That cannot be right. A rule of inference that failed in some situations would not be a rule of inference, and I do not think modus ponens or the law of non-contradiction are context-dependent in the way the pain case is.

  I would much rather keep (2), (3), and (5) than (8), but I want to know what keeping them costs. Which step should I give up? If it is (1), and I have simply drawn the notion of a principle too tightly, then please say exactly what a generalist's principle looks like once it has been loosened enough to survive (2), and whether anything still recognizable as a principle is left. If it is the move from (3) to (4), or from (6) to (7), then please name precisely what goes wrong in that move and why the step looked so natural. And if the argument is in fact sound and (8) is the step that has to go, then say what principle can still mean.
reasoning: |-
  Okay, this high school student in a philosophy club has presented an argument about moral particularism that their adviser sketched, and they've extended it. Now they're worried because the argument seems to prove too much—not just that there are no moral principles, but that there are no general principles at all in reasoning, evidence, or strategy. They want to know which step fails and what each side has to pay.

  First, I need to understand the structure. The argument starts with steps (1) to (4) establishing moral particularism: (1) defines a moral principle as requiring a feature to have fixed moral valence everywhere. (2) gives examples showing features like causing pain can have varying valence (e.g., pain in a bully isn't a reason against stopping them). (3) concludes no feature has fixed valence, so (4) no such moral principles exist. Then (5) says moral judges don't need principles, just situational perception.

  The student added (6) and (7): (6) notes this variability isn't unique to morality—it applies to epistemology (confidence in witnesses), chess strategy (threatening the queen), and scientific evidence (flawed studies). So (7) extends the argument: if moral particularism is true for reasons in (2)-(4), then there should be no general principles anywhere, including logic and inference. But (8) objects that this can't be right because rules like modus ponens or non-contradiction seem context-independent.

  The student prefers keeping (2), (3), and (5) but wants to know the cost. They're asking for a diagnosis: where does the argument break down? I need to evaluate each step.

  Looking at step (1): Is this an accurate definition of a moral principle? Generalists might argue that principles can include defeasibility—exceptions or conditions. For example, "causing pain is bad unless it prevents greater harm." The student's definition assumes principles must be absolute, without exceptions. That seems too strict. If principles can be hedged, then (2) doesn't necessarily refute them; the examples just show the need for qualifying conditions. So (1) might be the problem because it sets up an unrealistic standard.

  But the adviser's examples in (2) seem to challenge even defeasible principles because the valence shifts based on context. For instance, the bully's pain isn't just an exception; it's irrelevant or even positive. This suggests that the moral relevance isn't fixed, which could still threaten general principles if they're seen as rigid.

  Step (3) and (4): If no feature has fixed valence, does that mean no principles exist? Particularists say yes, but generalists might argue principles can be complex, incorporating multiple factors. For example, a principle could say "causing pain is a reason against an action, but its weight depends on other features." This might save principles but make them highly contextual.

  Now, the student's extension in (6) and (7) is clever. They're showing that this variability applies beyond morality. In epistemology, a confident witness isn't always reliable; in chess, a threat isn't always a reason to respond. So if the argument against moral principles works, it should work against all general principles. But (8) points out that logical rules like modus ponens seem exceptionless. That creates a tension.

  Is modus ponens really context-independent? In standard logic, yes—it's a formal rule. But in real-world reasoning, people might misapply it or encounter paradoxes, but that's not the rule failing; it's misapplication. So (7) might overreach by conflating substantive principles (like moral or evidential reasons) with formal logical rules. The student mentions "rules of inference," which could include both. 

  The key issue is between substantive and formal principles. Substantive principles (morality, evidence, strategy) are defeasible—they can be overridden by context. Formal principles (logic, math) are not. So step (7) fails because it doesn't distinguish them. The move from (6) to (7) assumes all principles must be exceptionless, but that's not true; only some domains require that.

  Therefore, the problem is in step (1)'s definition or the inference to (7). If we keep (1) strict, then (7) follows, but we lose even logical principles, which is absurd. To avoid that, we must reject (1) and allow defeasible principles.

  What would defeasible principles look like? They'd have ceteris paribus clauses—"other things being equal." For example, "causing pain is pro tanto wrong, but can be overridden." This preserves principles while accommodating context. The student asks if this is still recognizable as a principle; yes, it's how many philosophers (like Ross) view moral principles.

  The cost for particularists: They must explain why defeasible principles aren't sufficient or genuine. For generalists, they must accept that principles aren't absolute and require judgment in application.

  In the moral case, step (5) claims judges don't need principles. But with defeasible principles, they might still use them as guides, even if context determines the outcome. So (5) might be overstated.

  The failing step is likely (1) because it defines principles too narrowly. Step (7) then fails because it applies this flawed definition to domains where principles can be defeasible. Step (8) is correct in highlighting that formal rules don't have this variability.

  So, advice to the student: Give up step (1). Allow moral (and other substantive) principles to be defeasible. This saves the phenomena in (2) and (6) without collapsing into total particularism. The cost is that principles become more complex and situational, but they're still general.
answer: |-
  Your argument is insightful and exposes a genuine tension in how we think about principles—both moral and non-moral. The flaw lies in **step (1)**, which sets up an overly strict and unrealistic definition of a "moral principle." This definition makes the argument seem powerful but ultimately leads to the overreach in step (7), where it threatens even logical rules like modus ponens. I'll diagnose the problem, explain why step (1) fails, clarify what a defensible "generalist" principle looks like, and outline what each side (particularist vs. generalist) must accept as a cost. The core issue is that step (1) conflates *principles* with *invariable, exceptionless rules*—but most plausible moral generalists don't defend principles of that kind.

  ### Diagnosis: Why Step (1) Fails
  - **The problem**: Step (1) defines a moral principle as requiring a feature (e.g., "causes pain") to have a *fixed moral valence*—always counting for or against an action, *without exception*. This is too rigid. It ignores how generalists typically defend *defeasible* principles (e.g., "causing pain is *pro tanto* wrong, but can be overridden by other features").  
  - **Why it looked innocent**: Step (1) seems plausible because we often state principles in simple, absolute terms (e.g., "lying is wrong"). But this is shorthand. In practice, even rule-based systems (like law or utilitarianism) allow for exceptions or contextual weighting. For instance, causing pain *usually* counts against an action, but not when it prevents greater harm (as in your bully example). Step (1) mistakes principles for *strict invariants* rather than *general guidelines with built-in flexibility*.  
  - **Consequence for the argument**: Because step (1) defines principles unrealistically, step (2) easily refutes them. But this doesn't doom *all* principles—only absolutist ones. Steps (3)–(4) then follow, but only against this narrow type of principle. Your extension in (6)–(7) inherits this flaw: it assumes that if a feature’s valence varies (e.g., "confidence" in a witness), then *no general principles can exist in any domain*. But this ignores defeasible principles outside morality too (e.g., "a confident witness is *generally* credible, but less so if they're overconfident in all contexts").  

  ### What a Surviving "Generalist" Principle Looks Like
  Once we loosen step (1), moral principles can be *defeasible*, *pro tanto*, or *ceteris paribus* (all terms for roughly the same idea):  
  - **Structure**: A defensible principle says: "Feature F *typically* provides a reason for/against an action, *unless overridden or altered by context*."  
    - Example: "Causing pain is *pro tanto* wrong" (i.e., it always counts against an action *to some degree*, but its force can be outweighed by other reasons, like preventing greater harm).  
    - Applied to your bully case: The pain caused to the bully *is* a reason against stopping him—but it’s an extremely weak reason, easily overridden by the reason to protect the victim. It doesn’t "count for nothing" (as step (2) claims); it’s just massively outweighed.  
  - **Is this still a "principle"?** Yes. It’s general (applies to all cases of causing pain), action-guiding (tells us pain matters), and truth-apt (it can be true/false). But it’s not exceptionless. This resembles W.D. Ross's *prima facie duties* in ethics or "ceteris paribus laws" in science (e.g., "Birds fly" is true despite penguins).  
  - **How it survives step (2)**: The examples in step (2) show valence *variation*, not valence *elimination*. In the bully case, pain still has negative valence—it’s just negligible. In the pleasure case, the bully’s pleasure still has *some* positive valence, but it’s morally tainted and overridden. Generalists argue we need principles to explain *why* these features shift weight (e.g., pleasure is bad when it stems from malice).  

  ### Why Other Steps Don’t Fail (Alone)
  - **Steps (2) and (3)**: These are sound *if* we accept step (1)'s strict definition. But since step (1) is flawed, (2) only refutes absolutist principles, and (3) is true only for "fixed valence" in the rigid sense.  
  - **Steps (4) and (5)**: If principles must be absolutist (per step (1)), then (4) follows. But if principles are defeasible, (4) is false—principles exist but aren't absolute. Step (5) then weakens: even with defeasible principles, a "good moral judge" might still use them as heuristic tools while recognizing context.  
  - **Steps (6) and (7)**: Step (6) is correct—valence variation *isn’t* peculiar to morality (e.g., "confidence" in a witness *is* defeasible). But step (7) only follows if *all* principles must be exceptionless. Logical rules (like modus ponens) *are* exceptionless because they’re *formal* and *content-insensitive*: "If P, then Q; P; therefore Q" holds regardless of context. Substantive principles (morality, evidence, strategy) are *content-sensitive* and thus defeasible. Step (7) fails by conflating these.  
  - **Step (8)**: This is correct and reveals the absurdity of step (7). Logical rules *don’t* vary with context—they’re invariant because they depend only on form, not content (e.g., modus ponens works for "If it rains, the street is wet" or "If the bully is stopped, he feels pain").  

  ### What Each Side Must Pay
  - **Particularist (your adviser’s view)**:  
    - **Cost to keep (2), (3), and (5)**: You must deny that *any* substantive principles exist—not just in ethics, but in epistemology, strategy, etc. You’ll argue that all reasoning is "holistic" and context-bound.  
    - **Challenge**: Explaining how we learn, teach, or debate ethics without general guidelines. If every case is unique, how do we avoid arbitrariness? Why do features like pain *usually* matter? Particularists might appeal to "moral perception" (like step (5)), but critics say this risks intuitionism or inconsistency.  
  - **Generalist (with defeasible principles)**:  
    - **Cost**: Principles become messy. They can’t be applied mechanically (e.g., "causing pain is wrong—full stop"). Judgment is still needed to weigh reasons, handle conflicts, or identify overriders (e.g., "Does this pleasure stem from malice?").  
    - **Challenge**: Explaining what makes a principle *true*. If "causing pain is pro tanto wrong" is a principle, is it analytic? Empirical? A normative primitive? Generalists must ground principles in something (e.g., human flourishing) without making them rigid.  

  ### Conclusion and Recommendation
  **Give up step (1)**. It defines moral principles in a way no sophisticated generalist accepts, creating a straw man. Replace it with:  
  > *(1 revised) A moral principle says that some feature of an action typically provides a defeasible reason for or against it—a reason that can be overridden or altered by context but still has default weight.*  

  This saves the phenomena in step (2) (valence varies) without collapsing into step (7)’s radical skepticism about all general principles. Logical rules (step (8)) survive because they’re formal, not substantive. Morality retains principles, but they’re flexible tools, not rigid laws.  

  **What you gain**: A more realistic view of moral reasoning—one where principles guide us without dictating outcomes. **What you lose**: The clean, exceptionless rules step (1) promised. But as your chess example shows, even strategic principles ("answer threats to your queen") are useful *because* they’re defeasible, not in spite of it.  

  If your goal is to defend particularism, focus on why defeasible principles aren’t truly "principled" (e.g., if context always determines what counts as an overrider, principles do no work). But if you want a middle ground, this revision offers a path. Your extension of the argument to non-moral domains (step (6)) is brilliant—it shows that valence variation is universal in substantive reasoning, not a special problem for ethics.
