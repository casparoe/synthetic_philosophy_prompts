prompt: |-
  For some time I have been trying to isolate a family of argumentative moves that recurs whenever scepticism or relativism comes up, and I cannot decide whether what I am noticing is one move or several, or whether it already has a name. The shape is always the same: a position is set aside not by evidence against it but by the observation that anyone who holds it must, in holding it, rely on something the position denies. The sceptic who argues that no belief is justified leans on the standards of justification he is impugning; the relativist who says that a claim is true only relative to a framework states that very claim as though it were true without qualification. I have no quarrel with the observation that such positions are awkward to hold. What puzzles me is that the charge seems to come in strengths that its users never distinguish, and that the strength tends to climb as the argument proceeds.

  I can separate four strengths, though I am not confident the list is right or complete. First, the position cannot be consistently stated: the sentence, taken at face value, denies what the act of uttering it asserts. Second, the position cannot be consistently believed or genuinely doubted, because doubting that p requires one to take for granted things that the doubt is meant to suspend. Third, the position cannot be defended in argument, since any defence must employ the very resources it disowns. Fourth, the position is false, because what it denies is a precondition without which the activity by which it is reached — thinking, experiencing, asserting — would not be possible at all.

  I have been told that what I am after is 'performative contradiction' or 'self-refutation', but those labels seem to cover only the first two strengths, and they do not help with the thing that actually troubles me, which is the passage from the third to the fourth. In most of the arguments I meet, what has been shown at best is that the position cannot be defended; what is concluded is that it is false. I would like to know whether that passage has a name of its own, and what would have to be added to a third-strength point to make a fourth-strength conclusion legitimate rather than merely rhetorical. I am equally unsure how the strengths relate to one another: whether the second collapses into the first, whether the first is ever more than a pun on a word, and whether the fourth is ever actually achieved by anyone or is only ever gestured at.

  So: does this family of moves have an established name, and does the distinction among the four strengths — and the slide between them — have one? I am not looking for a bare label. What I want is the carving: exactly what each strength claims, which of them is ever established and by what, where the boundary between a genuine fourth-strength result and a rhetorical one falls, and whether the whole thing is best understood as one device with four settings or as four devices that happen to share a surface form.
reasoning: |-
  Okay, the user presents a sophisticated analysis of argumentative moves against skepticism and relativism. They've identified four distinct "strengths" in how these critiques are deployed, moving from performative inconsistency to claims about transcendental preconditions. 

  The user's core concern seems to be about argumentative overreach - specifically how philosophers often slide from showing a position is indefensible (strength 3) to declaring it false (strength 4). They're clearly well-read, noticing nuances that escape most casual observers. Their frustration with existing labels like "performative contradiction" is understandable since those don't capture the escalation they've mapped. 

  What's particularly interesting is their meta-awareness: they're not disputing the awkwardness of holding skeptical positions, but questioning the logical rigor of refutations. The four-strength framework shows remarkable analytical depth - I'm impressed by how they distinguish between linguistic consistency, psychological believability, defensibility in argument, and transcendental necessity. 

  The challenge is to honor this precision while offering useful terminology. Terms like "transcendental argument" get close but don't fully address their concern about the strength-3-to-4 slide. Their question about whether strength-4 conclusions are ever genuinely established rather than gestured at cuts to the heart of Kantian and post-Kantian epistemology. 

  I should emphasize that the legitimacy of moving from "indefensible" to "false" hinges entirely on successfully demonstrating transcendental preconditions - which is notoriously difficult. Perhaps Wittgenstein's hinge propositions or Davidson's coherence requirements could provide concrete examples where strength-4 arguments gain traction. 

  The user's suspicion about rhetorical slides is well-founded. Many philosophers do overclaim here. A rigorous defense of strength-4 requires showing not just that a position is pragmatically difficult, but that its truth would make the activity itself impossible - like arguing against the principle of non-contradiction while relying on it. 

  This is one of those rare queries where the user has already done most of the conceptual heavy lifting. My role is mainly to validate their framework and suggest terminology that might help them organize further research. The "transcendental refutation" label for strength-4 seems apt, provided we stress how much more it demands than strength-3.
answer: |-
  You've articulated a profound and recurring pattern in philosophical argumentation with remarkable precision. What you're describing is indeed a family of "self-undermining" or "self-stultifying" arguments, but your four-strength framework captures crucial nuances often overlooked. Here's a breakdown addressing your core questions:

  ### The Family Name: Transcendental Refutations or Self-Application Arguments
  While "performative contradiction" and "self-refutation" are common labels, the most fitting umbrella term for the *full scope* (especially strengths 3 & 4) is **Transcendental Arguments** (Kantian in origin, developed by Strawson, Apel, Habermas, Davidson). These argue that a challenged proposition (e.g., the existence of other minds, an external world, or objective truth) is a *necessary precondition* for the very activity of doubting, thinking, or communicating.

  ### Carving the Four Strengths & Their Relations
  | **Strength** | **Core Claim** | **What's Established** | **Boundaries & Relations** |
  |--------------|----------------|------------------------|----------------------------|
  | **1: Linguistic Self-Refutation** | The position cannot be consistently *stated* without pragmatic contradiction. | A semantic or pragmatic inconsistency in the utterance itself. | *Relation:* Weakest form. May be dismissed as "word play" if the skeptic reformulates (e.g., "No statement is true, including this one"). Often collapses into Strength 2 if sincerity is assumed. |
  | **2: Doxastic Self-Refutation** | The position cannot be consistently *believed* or *doubted*. | Psychological or epistemic incoherence in holding the attitude. | *Relation:* Stronger than 1, but vulnerable to the "sincere fool" objection (Can someone *irrationally* believe it?). Collapses into 1 if belief requires sincere assertion. |
  | **3: Dialectical Self-Refutation** | The position cannot be rationally *defended* in argument. | The position is dialectically inert or self-sabotaging in discourse. | *Boundary:* This shows the position is *indefeasible* or *rationally unjustifiable*, **not necessarily false**. The slide to 4 happens when "cannot be defended" is conflated with "must be false." |
  | **4: Transcendental Refutation** | The position is *false* because it denies a necessary precondition of the activity used to reach it. | The truth of the denied proposition is a transcendental condition of possibility for the skeptical act itself. | *Boundary:* Requires proving a *metaphysical necessity*, not just pragmatic difficulty. Legitimacy hinges on successfully demonstrating the *precondition*. |

  ### The Critical Slide: From Strength 3 to Strength 4
  1.  **The Problem:** You've identified the core slippage. Proving a position is *indefensible in argument* (Strength 3) does **not**, by itself, prove it *false* (Strength 4). One might concede a position is rationally indefensible yet still (perhaps irrationally) maintain it could be *true* (e.g., radical skepticism about other minds might be indefensible in discourse, but how does that *prove* other minds exist?).
  2.  **The Legitimate Passage (When it Works):** A legitimate move from 3 to 4 requires establishing the **Transcendental Premise**: What the position denies (e.g., objective truth, a shared framework, reliable faculties) is a *necessary precondition* not just for *defending* the position, but for the very *activity* (thinking, doubting, experiencing, asserting) that *generates* the position or makes it *intelligible*.
      *   **What Must Be Added:** A successful argument must demonstrate that *if the position were true, the activity grounding it would be impossible.*
          *   *Example (Anti-Relativism):* If truth *were* purely framework-relative with no shared constraints, then *asserting* the relativist thesis itself would be meaningless noise within *any* framework, including the speaker's own. Asserting requires presupposing the potential for *intersubjective uptake* or *minimal rationality* across frameworks.
          *   *Example (Anti-Skepticism):* If *no* beliefs were justified, the act of *asserting* this proposition (or even *forming the thought*) relies on standards of justification inherent in reasoning and communication. The skeptic relies on the very norm they deny *in the act of denying it*.
  3.  **The Boundary (Rhetorical vs. Genuine):**
      *   **Rhetorical:** Concluding "false" *solely* because the position is awkward to hold, inconsistently stated, or indefensible. This is a *non sequitur*.
      *   **Genuine:** Concluding "false" by demonstrating that the position's *truth* would undermine the *very possibility* of the cognitive, experiential, or linguistic acts involved in formulating, believing, or asserting it. The position is shown to be *self-nullifying* at the level of its enabling conditions.

  ### Are Strength-4 Results Achievable?
  *   **Yes, in Principle:** Philosophers like Kant (against Humean skepticism about causality/substance), Wittgenstein (on private language/rule-following), Davidson (against conceptual schemes), and Putnam (against brain-in-a-vat skepticism) attempt genuine Strength-4 arguments. They argue that the *truth* of the skeptical/relativist position would make thought, language, or experience impossible.
  *   **But Contentious:** Success is hotly debated. Critics argue:
      *   The "necessary preconditions" identified are contestable or contingent (e.g., Strawson vs. Stroud on objectivity).
      *   The arguments may beg the question by assuming the framework they claim to prove (e.g., assuming shared rationality to prove shared rationality).
      *   They might only prove the *pragmatic indispensability* of *believing* certain things, not their *truth* (a la Hume's distinction).
  *   **Gesture vs. Achievement:** Many arguments *gesture* at Strength-4 (e.g., "How can you doubt reason using reason?") but fail to rigorously establish the *metaphysical necessity* of the precondition or the *impossibility* of the activity under the skeptical hypothesis. A genuine achievement requires meticulous work showing the *incoherence* of the skeptical world *itself*, not just our discourse about it.

  ### One Device or Four?
  It's best understood as **one fundamental argumentative strategy (demonstrating self-undermining) applied at four progressively deeper levels of analysis**:

  1.  **Level 1:** Surface Language (Pragmatics/Semantics)
  2.  **Level 2:** Psychology/Epistemology (Belief/Attitude)
  3.  **Level 3:** Dialectics (Argumentative Practice)
  4.  **Level 4:** Metaphysics/Transcendental Conditions (Possibility of the Activity)

  The "surface form" (relying on what's denied) is shared, but the *stakes* and *conclusions* differ significantly based on the level targeted. Strength-4 is qualitatively distinct in aiming for metaphysical falsity via transcendental necessity, while 1-3 focus on inconsistency, irrationality, or dialectical impotence.

  ### Conclusion
  Your framework is insightful and largely correct. The established terminology for the *family* is best captured by **Transcendental Arguments** or **Self-Application Arguments**. The critical slide you identified (3->4) lacks a single perfect name, but **"The Transcendental Step"** or **"From Dialectical to Metaphysical Refutation"** captures its essence. Its legitimacy hinges entirely on successfully arguing that the denied proposition is a *necessary precondition* for the *possibility* of the relevant activity, making the position's truth *self-nullifying*. While genuine Strength-4 arguments are attempted (especially post-Kant), their success remains a central topic of philosophical debate, precisely because proving such transcendental necessities is extraordinarily difficult and often contested. Your careful distinction between the levels is crucial for evaluating these powerful but frequently misapplied argumentative moves.
