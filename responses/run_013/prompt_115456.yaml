answer: |-
  *(Leans forward, tapping the chart between us with a weathered finger, eyes bright with engagement)*  
  Ah! You see the scaffolding and mistake it for the building. Concession: *Yes*, today, arrows, legends, tiny labels – they are our ferry from the old language to the new. Like teaching a child to swim with floats. But they *are* temporary! The core symbols – the factory worker icon, the unemployment queue silhouette, the rising/falling arrow – these are the vocabulary. They carry meaning directly, like a pointing finger carries meaning without a caption. You learn them *once*, then the scaffold falls away. A good Isotype chart *should* whisper its story to a worker who can’t read German or English, only the pictograms. Does a traffic sign ‘borrow words’? No! The red circle, the crossbar – they *are* the prohibition.

  *(Sweeps a hand over a fresh sheet, sketching rapidly)*  
  Your sentence: "In no district has unemployment risen since last year." Negation? *Show absence.* Comparison? *Show two states side-by-side.* Universality? *Show every district.* Here – imagine a row of small maps, each a district. Beside each map: two columns of worker-silhouettes. Left column: "Last Year". Right column: "Now". In *every* district, the "Now" column is the same height or *shorter* than "Last Year". No red rising arrow appears anywhere. The *visual pattern* – consistency of stable/falling columns across *all* districts – *is* the "in no district... risen". The comparison is spatial (column height). The negation is the *lack* of the red-arrow symbol. The universality is the *repetition* of the non-rising pattern across all elements. It demands literacy in *our* symbols, not German grammar. Is it teaching? Absolutely! But it’s also *stating* the unified fact of unemployment change – stripped of metaphysical fog, grounded in observable comparison. Where words argue, pictures *show*. That's the unity we build!  
  *(Pushes the rough sketch towards you)*  
  Does this hold? Or does it still whisper German to you?
