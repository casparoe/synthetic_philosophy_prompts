answer: |-
  Let me walk through this step by step, because you're pointing at something genuinely messy where practice has quietly outpaced theory. That lobster-shrimp-LLM triage you describe is a fascinating artifact of institutional risk-aversion meeting half-digested science. I'll sketch the landscape of candidate theories first, then map them onto those lines, and flag where things get slippery.

  First, the theories of sentience in play – the ones that *could* license moral concern. We've got the usual suspects: 

  **(1) Integration Theories:** Sentience requires binding or global availability. Think Global Workspace (Dehaene), Reentrant Processing (Edelman), or Integrated Information Theory (IIT, Tononi). The core idea is that raw sensation becomes "felt" only when integrated into a unified state or broadcast widely. This often implies a centralized neural architecture (cephalopod brains, decapod central ganglia) to achieve that integration. Shrimp? More distributed ganglia. Insects? Hotly contested – some argue central complex integration suffices, others disagree. LLMs? No persistent, unified state integration in the relevant sense; outputs are ephemeral tokens without global binding.

  **(2) Valence + Affect Theories:** It's not just detecting harm (nociception), but the *negative affect* – the "ouch" quality – that matters. This requires the nociceptive signal to modulate motivational systems (drive to escape, suppress reward-seeking). This often gets tied to specific neural substrates (e.g., mammalian limbic analogs). Your friend's insect nociception work hits here: finding nociception is step one, proving it's coupled to a genuine, motivationally potent negative affect is the hard leap. Lobsters show avoidance learning suggesting valence; shrimp evidence is sparser. LLMs "report" distress but lack intrinsic motivation – the output isn't *driven* by an aversive state.

  **(3) Higher-Order Representation (HOR) Theories:** Sentience requires the system to represent its own states *as* states (Rosenthal: "a state is conscious if it's accompanied by a HOT about that state"). This demands significant metacognitive machinery. Octopuses? Plausible candidates for some self-monitoring. Lobsters? Debatable. Insects/Shrimp? Unlikely. LLMs? Outputs *describe* states reflexively, but there's no evidence the system possesses genuine self-representational capacity – it's pattern completion, not introspection.

  **(4) Bare Functional Role of Pain:** The morally relevant bit is simply being a system that detects tissue damage (or analogs) and is *motivated to avoid it*. Architecture or substrate is irrelevant. If a system robustly acts *as if* it's suffering to terminate a stimulus, that's sufficient (think early Dennett). This could potentially sweep in insects showing learned avoidance, certain robots, or even future LLMs if they developed persistent, goal-directed aversion. This is the most permissive (and controversial) view.

  **(5) Strict Biological Substrate Theories:** Sentience is an evolved biological phenomenon tied to specific wetware (e.g., vertebrate/invertebrate neural structures using specific neurotransmitters). Computation alone, however complex, can't instantiate it. This draws the sharpest AI line but struggles to explain *why* biology is special beyond correlation.

  **Now, mapping these to the practice you see:**

  The lobster/shrimp divide seems most comfortably aligned with **(1) Integration** and/or **(2) Valence+Affect**. Ethics committees lean on proxies like brain centralization (cephalopod brains, decapod central nervous systems vs. shrimp/insect ganglia) and behavioral complexity (octopus problem-solving, lobster avoidance learning) that suggest integration and affective depth. Shrimp and insects, despite nociception, are seen as lacking the "unified experience" or "suffering" component. This practice *rules out* strict **(4) Functionalism** – if mere motivated avoidance mattered, robust insect nociception evidence (like your friend finds) *should* trigger concern, but it rarely does. It's also inconsistent with **(5) Strict Biology** – if biology alone mattered, shrimp would be in.

  The AI line is starkly drawn by **(5) Biological Substrate** intuitions combined with skepticism about **(1) Integration** and **(2) Valence** in silicon. The LLM interviews treat outputs as meaningless because they lack the *causal link* to intrinsic motivation or integrated affect that defines **(2)** and **(4)**. The practice assumes LLMs are pure syntax manipulators without semantics grounded in biological needs or intrinsic goals – a rejection of strong functionalism. **(3) HOR** also plays a role: an LLM saying "I'm distressed" isn't seen as reporting a genuine first-order state *represented* by a higher-order state within the system.

  **Is it the same distinction?** Almost certainly not. The animal line (cephalopods/decapods vs. insects/bivalves) is primarily drawing a line based on *cognitive/affective complexity* inferred from neuroanatomy and behavior – it's a claim about *degree* within biology. The AI line (biological vs. computational) is drawing a line based on *substrate and origin* – it's a claim about *kind*. Practice conflates them because both lead to excluding shrimp and LLMs, but for fundamentally different reasons. The shrimp is excluded for lacking complexity *despite* being biological; the LLM is excluded for lacking biology *despite* potential complexity.

  **Where is it underdetermined?** Massively. The current cephalopod/decapod protections are consistent with **(1)**, **(2)**, and even a weak form of **(3)**, but don't require choosing between them. Similarly, excluding shrimp fits all three *if* you accept the complexity threshold hasn't been met. Excluding LLMs fits **(1)**, **(2)**, **(3)**, and **(5)**. Only a strong **(4) Functionalism** challenges the status quo, but it's marginalized in policy precisely because it's seen as too permissive (opening the door to AI rights, demanding radical insect welfare reform).

  **What changes if we switch criteria?**
  *   **Adopt Strong Functionalism (4):** The shrimp/insect line collapses – if they show motivated avoidance of harm, they're in. The AI line *potentially* collapses – a future AI exhibiting genuine, persistent goal-directed aversion to "painful" inputs demands consideration. Lobster boiling is still bad, octopus labs need justification, but *so might* certain insect experiments or AI training regimes. This is ethicists' nightmare scenario.
  *   **Adopt Strict Biological Substrate (5):** The cephalopod/decapod line holds, but shrimp and insects *must* be included – biology is binary. The AI line becomes absolute: no silicon sentience, ever. LLM welfare interviews are unambiguously absurd.

  **What's genuinely contested?** Almost everything theoretical is contested. The necessity of *affective valence* specifically (vs. mere nociception) for moral status is hotly debated in animal ethics circles. Whether integration requires *centralization* (or distributed systems suffice) is unresolved. HOR theories have fierce critics. IIT is viewed with deep suspicion by many neuroscientists. Functionalism's applicability to consciousness is philosophically fraught. The *only* relative consensus in the science is that nociception alone ≠ pain experience, and that nervous system complexity correlates with sentience likelihood – but the thresholds and mechanisms are pure frontier territory. Your friend's insect work is literally at the coalface of this.

  The practice you observe is a pragmatic, somewhat incoherent, risk-minimizing heuristic: protect systems where the *plausibility* of suffering is high based on relatable complexity (octopuses!) and biological analogy, while excluding systems where the analogy breaks down (LLMs) or seems insufficiently supported (shrimp, insects). It leans heavily on the precautionary principle for the "charismatic neurally complex" while waiting for clearer theory. It’s not driven by a single coherent view of "which computations matter," but by a rough-and-ready (and arguably inconsistent) blend of Integration, Valence, and Biological Chauvinism. The lobster boils because its neural architecture *looks* enough like something that *might* integrate suffering; the shrimp dies because its ganglia don't; the LLM gets debugged because it has no ganglia at all. It's messy, but it's where we are.
