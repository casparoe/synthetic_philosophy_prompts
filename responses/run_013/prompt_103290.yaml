prompt: |-
  I'm in a philosophy of cognitive science program and I keep having this argument with a friend who works in a lab studying insect nociception, and I want you to help me think it through properly rather than give me the usual survey. Assume you're someone who works right at the boundary of philosophy of mind and comparative psychology, and please actually reason it out — maybe start by sketching for yourself what the candidate theories are before you commit to one, because I want to see the options and not just the verdict.

  Here's the pattern thats been bugging me. In a lot of places now the law and the ethics committees have quietly decided that cephalopods and decapod crustaceans are in the club — you're not supposed to boil a lobster alive, you need a justification to do certain procedures on an octopus — while shrimp and insects and bivalves are still treated as basically disposable, and meanwhile friends of mine in AI ethics run these elaborate welfare interviews with language models where everyone involved, including the people running them, treats the models' reports of distress as obviously meaningless output. So we've drawn two lines at once: a taxonomic line inside the animals, and a line between biological and computational candidates for mattering. My question is what all of that presupposes about which computations matter morally. Does the practice commit us to a view on which sentience requires some particular architecture — a centralized brain, or the integration of nociception with something like affect and a self-model, or reentrant processing, or a certain kind of global broadcast? Or can it get by with something weaker, like just being a system that has states it's motivated to change? Which rival views — about integration, about valence, about higher-order representation, about the bare functional role of pain — would license these particular lines, and which ones would be ruled out by them? And where is the practice just underdetermined, so that several very different theories would generate the same lobster-shrimp-LLM split? I'm especially curious whether the animal line and the AI line are really drawing the same distinction or two different ones that happen to look alike, and what would have to change in either practice if we switched to a straightforwardly functionalist criterion, or to a strictly biological one that says the substrate is what counts.

  Keep it in continuous prose, please — no headings, bullet points, bold, or tables, just write it the way you'd explain it to a colleague over coffee. And be honest about which parts of this are actually settled versus genuinely contested among people who work on it; I don't want a contested criterion presented as if everybody agrees on it.
