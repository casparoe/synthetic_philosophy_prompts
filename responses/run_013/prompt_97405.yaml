prompt: |-
  So my flatmate Dan is doing a CS masters and he's somehow got it into his head that Solomonoff induction settles basically every argument we have in our Thursday reading group, and honestly he's becoming insuferable about it. Last week we were arguing about whether Occam's razor is a genuine principle of reasoning or just a pragmatic heuristic, and he announced that it's neither, it's a theorem — because if you take the universal prior, the one that puts weight 2 to the minus the length of a program on each program, and then mix over all the programs that generate your data, the simple ones automatically dominate. Which is definately true as far as I can tell. But then he goes further: he says that means he never has to *rule out* anything, he just assigns it a very small number, so he still thinks there's a nonzero chance his landlord is running a simulation to prank him, he's just betting at like 2^-60. And when I pointed out that you can't actually compute any of this, that the whole mixture is uncomputable, he said he uses an approximation, and I asked what approximation, and he said "my intuition", which I think means he's just guessing like the rest of us.

  Anyway, I want to get him back at the next meeting, so could you write me a joke about this whole cluster of ideas — Solomonoff, Kolmogorov complexity, Occam's razor — that I can tell at the group? It should make actual sense: someone hearing it shouldn't come away thinking I don't know what a universal prior is, and the punchline should turn on the real content of the theory rather than being a generic nerd joke. Things you could hook into if they help: Occam's razor falling out of the prior instead of being assumed as an extra principle, the fact that every computable hypothesis keeps nonzero weight forever so nothing is ever really refuted, only downweighted, the two-part code picture where you pay for the model plus whatever's left over to describe the data, and the uncomputability thing meaning real agents are stuck approximating. Feel free to make fun of Dan. Length is up to you, but a short setup and a punchline is probably better than a long shaggy-dog thing.
