  I should also verify their interpretation of Hacking. While they're extending his ideas creatively, Hacking himself was more focused on historical analysis than dynamical systems modeling. Their Claim 3 about script thickness being stabilizing might need more development to be testable - perhaps by looking at contemporary examples like ADHD where thin screening tools coexist with thick online narratives.

