prompt: |-
  I never took a philosophy class but I read alot of it on my own, and theres a pattern I keep running into that I don't have a word for. It shows up whenever people argue about whether somebody is to blame for something.

  Heres the thing. Say a guy does something terrible. Someone tells me "well, he had a brain tumor," or "he was raised in a house where that was treated as normal," and instantly I stop blaming him -- not blame him less, stop. The cause seems to erase the blame. But now flip it. Say a woman does something wonderful. Someone tells me "she was raised to be generous," or "she just has a warm temperament," and I don't stop crediting her at all. If anything I credit her more. Same kind of cause, opposite effect depending on whether the act was good or bad.

  And it gets weirder. If you tell me he did it "because that's the kind of person he is" -- which is still a cause, right, a story about where the act came from -- I blame him more, not less. But "because of the way he was raised" and I blame him less. Two explanations of the same act, both pointing at something in his past or makeup, and one drains the blame while the other piles it on.

  So the pattern I'm seeing is roughly: causes seem to cancel blame but not praise, and on top of that some causes (character, "that's just who he is") feed blame while other causes (history, biology, circumstance) drain it. Is there a name for this? I don't think it's just the old free will argument, because nobody in that argument seems to be pointing at this exact thing -- everyone's busy with whether determinism is true, and I'm asking something narrower about which explanations excuse and which ones don't.

  I'm not really after a label anyway. I want to know what the thing actually is: what the rule is that decides which causes excuse and which ones condemn, whether blame and credit are really lopsided the way I'm describing or whether I'm secretly mixing up two different questions, and where the edges of it are. If theres no name, give me one and define it well enough that I can tell it apart from just saying "determinism threatens free will." Please answer in American English.
reasoning: |-
  Okay, let me unpack this user's question. They've noticed a pattern in how causal explanations affect blame and praise differently. When someone does something bad due to external factors (like a brain tumor or upbringing), blame disappears completely. But when someone does something good for similar reasons (being raised generous or innate temperament), praise doesn't diminish—it might even increase. They also note that "character-based" explanations (e.g., "that's just who he is") actually increase blame.

  First, I need to identify the core issue here. The user isn't asking about free will vs. determinism in general but specifically about asymmetrical responses to different types of causes. They want terminology for this phenomenon and an explanation of the underlying rules.

  The key concepts here involve moral responsibility and causal attribution. The asymmetry between blame and praise is crucial. For blame, external causes (causes outside the agent's control) seem to excuse entirely. But for praise, even similar causes don't diminish credit—in fact, they might enhance it. And when the cause is framed as the person's inherent character, blame increases, but praise also seems more deserved.

  I recall philosophical discussions about moral luck. Bernard Williams and Thomas Nagel explored how factors beyond our control affect moral judgment. But moral luck usually covers both positive and negative outcomes, while the user observes a stark asymmetry. Susan Wolf's "asymmetry thesis" in moral responsibility directly addresses this: we might hold people responsible for good actions regardless of causes but not for bad ones when external factors are present.

  Then there's the distinction between exempting and mitigating factors. Exempting factors (like insanity or coercion) remove blame entirely, while mitigating factors reduce it. The user describes something that feels like an exemption for bad acts but not for good ones. 

  The character vs. circumstance dichotomy is another layer. When an action is attributed to stable character traits, we hold the person more responsible because it reflects their "true self." But if it's due to circumstances, it's seen as not fully their own. This ties into accounts of responsibility that emphasize reasons-responsiveness or the agent's deep self. 

  The user might also be touching on the concept of moral worth. An act's moral worth might depend on whether it stems from virtuous character or external factors. But again, the asymmetry persists—good acts seem praiseworthy regardless, while bad acts require volition.

  I should synthesize these ideas. The phenomenon could be called "Asymmetrical Causal Exemption" or "Responsibility Asymmetry." The rule seems to be: blame requires control (so external causes excuse), but praise doesn't require control (so causes don't diminish credit). And for character-based explanations, they intensify judgments because they reflect the agent's core identity.

  The deeper need here might be understanding why we have this asymmetry. The user might be grappling with whether this is rational or just a psychological bias. They might also be seeking validation that their observation is recognized in philosophy, which could provide frameworks to analyze it further. Addressing these underlying curiosities will make the response more satisfying.
answer: |-
  You've hit on a fascinating and well-documented asymmetry in moral psychology and philosophy. There *isn't* one universally agreed-upon single word, but the phenomenon has several closely related names and concepts:

  1.  **The Asymmetry Thesis (in Moral Responsibility):** This is the most direct label for the core observation that **causal explanations tend to completely remove blame for bad actions but leave praise intact (or even enhance it) for good actions.** Philosophers like Susan Wolf and Thomas Scanlon have explicitly argued for or analyzed this asymmetry.
  2.  **Moral Luck (Asymmetry Aspect):** While "moral luck" broadly refers to how factors outside an agent's control affect moral judgment, a key observation *within* moral luck debates (notably by Thomas Nagel and Bernard Williams) is precisely this asymmetry: **we readily accept "good luck" (positive causes like a good upbringing) as not diminishing praise, but see "bad luck" (negative causes like a bad tumor) as completely excusing blame.**
  3.  **The Deep Self/Reasons-Responsiveness Model (Explaining the *Why*):** This isn't the phenomenon itself but a major theory explaining *why* the asymmetry exists and *which* causes excuse vs. condemn:
      *   **The Rule:** We tend to hold someone **blameworthy** only if their bad action **reflects their "deep self"** – their stable values, character, or capacity to recognize and respond to moral reasons. We tend to hold someone **praiseworthy** if their good action **reflects their "deep self"** OR **arises from a positive cause aligning with it** (like a good upbringing fostering good character).
      *   **Excusing Causes (Drain Blame):** These are causes that **bypass or impair the "deep self" or reasons-responsiveness:** brain tumors, coercion, severe mental illness, extreme stress, *sometimes* very deprived upbringings (if they prevented the development of moral capacity). They show the action *didn't* genuinely flow from *who the person fundamentally is* or their ability to understand/choose rightly.
      *   **Condemning/Neutralizing Causes (Feed Blame or Maintain Praise):**
          *   **"Because that's the kind of person he is" (Character):** This *is* pointing directly to the "deep self." If the bad action flows from a malicious, selfish, or negligent character (the "deep self"), blame is *maximized* because it reflects their true values. Conversely, if a good action flows from a virtuous character, praise is also maximized.
          *   **"She was raised to be generous" (Positive History):** This doesn't drain praise because we see the upbringing *shaping* the "deep self" positively. Her generosity, even if cultivated, *is* part of who she now is. We praise *her* for having that character. The cause reinforces the connection to her self.
          *   **"She just has a warm temperament" (Biology/Trait):** Similar to upbringing – if the biological trait leads to a *good* action that aligns with moral reasons (being warm leading to kindness), we see it as part of her admirable nature. If a biological trait (like extreme impulsivity) leads to a *bad* action *and* it impairs reasons-responsiveness, it *might* excuse. If it *doesn't* impair understanding/choice (e.g., just being grumpy), we might still blame the choice made.

  **Why the Asymmetry? What's Actually Happening?**

  1.  **Blame Requires Fault, Praise Does Not (Necessarily):** Blame inherently implies the agent *should have done otherwise* and is morally at fault. If a cause shows they genuinely *couldn't* have done otherwise (tumor) or that the action didn't reflect a *culpable* aspect of themselves (severe impairment), blame evaporates. Praise, however, doesn't require that the person *could* have done otherwise or that the goodness arose *solely* from a heroic effort of will against their nature. We praise the good outcome *and* the positive character/capacity it reflects, even if that character was nurtured.
  2.  **The "Deep Self" Standard:** We hold people responsible for actions that express their evaluative judgments, commitments, or stable character traits (the "deep self"). Causes that show the bad action *didn't* express the deep self (tumor) excuse. Causes that show the good action *does* express the deep self (character, nurtured traits) sustain or enhance praise. Causes that show the bad action *does* express a flawed deep self (character) maximize blame.
  3.  **The Function of Blame vs. Praise:** Blame often serves a protective, corrective, or retributive function – we blame to deter, isolate, or express condemnation of harmful *agency*. If there's no meaningful agency (due to the cause), blame loses its point. Praise serves to reinforce, encourage, and celebrate positive qualities or outcomes. Even if the goodness had external sources, praising the person (and the cause) reinforces the desired behavior and outcome. We want to encourage the results of good upbringing/temperament.
  4.  **The "Suspension" of Determinism for Praise:** While strict determinism might *logically* threaten both blame and praise equally, our moral psychology doesn't work that way practically. We are much more willing to suspend worries about determinism when the outcome is positive and reflects well on the person. We *want* to attribute goodness to the agent. We are highly motivated to *find* reasons to excuse bad actions, especially if the cause seems external or impairing.

  **Edges and Complications:**

  *   **Mitigating vs. Excusing:** Some factors (like a stressful day) *mitigate* blame (make it less severe) without removing it entirely, because they partially impair judgment but don't fully bypass the deep self. The line between mitigating and fully excusing is fuzzy.
  *   **Deprivation vs. Nurture:** Is being raised in a cult that normalizes harm *fully* excusing (like a tumor) or *mitigating* (like stress)? This is heavily debated. Does it prevent the development of a reasons-responsive deep self, or just shape a bad one? The more severe the deprivation, the more likely it is seen as fully excusing.
  *   **Effort & Struggle:** We often praise good actions *more* if they required overcoming a bad temperament or difficult past ("She's naturally selfish but chose to be generous!"). This highlights the importance of the *active exercise* of the "deep self" or reason. Conversely, someone doing good effortlessly due to temperament might be praised, but perhaps slightly differently (admired rather than lauded for effort).
  *   **Negative Traits:** If a "biological cause" leads to a *bad* action that *doesn't* impair reasons-responsiveness (e.g., high testosterone leading to aggression they *could* control), we often still blame them *for not controlling it*. The cause isn't fully excusing.

  **In Your Words:**

  You're noticing **Asymmetrical Causal Exemption.** The rule is roughly: **An explanation excuses blame if it shows the bad action didn't spring from the agent's reasons-responsive "deep self" (either bypassing or severely impairing it). An explanation sustains or enhances praise if it shows the good action *did* spring from (or reliably reflects) a positive "deep self," even if that self was shaped by external causes.** The asymmetry arises because blame requires fault in the self's expression, while praise celebrates the expression (or its positive results) regardless of ultimate origin. Character explanations condemn or praise *because* they point directly to the deep self itself. History/biology excuses only when it *undermines* the deep self's control for bad actions, but rarely undermines the credit for good actions flowing from a well-functioning self. This *is* rooted in free will debates but zooms in on the specific psychological rules we actually use to assign moral credit and blame in practice.
