answer: |-
  I sprint through stalks of cobalt bloom,  
  each stride unburdened, buoyant, bare.  
  Sunlight cups my shoulders, a palm  
  pressing gently toward the hill.  
  A voice chants my name beyond the crest;  
  I pivot to face a form in white,  
  radiant against the emerald slope.  
  It extends a hand—I grasp it, stone-smooth, still.  

  No vision pierced the night’s mute hold,  
  no echo stirred the vacant hours.  
  Yet dawn rinsed the mind, and there lay:  
  sprinting through stalks of cobalt bloom,  
  each stride unburdened, buoyant, bare,  
  sunlight cupping shoulders, a palm  
  pressing gently toward the hill,  
  a voice chanting from the crest;  
  pivoting to face that form in white,  
  radiant against the emerald slope.  
  It extended a hand—I grasped it, stone-smooth, still.  

  I sprinted through stalks of cobalt bloom.
