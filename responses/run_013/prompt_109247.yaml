prompt: |-
  I'm putting together a case for a seminar on why "just get more specific data" doesn't solve the reference class problem, so the design has to actually work rather than just gesture at the issue.

  Build me a thought experiment where the reference class problem bites and the standard fix doesn't help. The standard fix is: use the most specific reference class that still has enough members to give you a frequency. So I need two candidate reference classes that are cross-cutting -- neither one is a subset of the other -- and whose intersection is basically just this one case, small enough that "use the intersection" hands you no usable frequency. That's the bit that has to be engineered, since otherwise specificity would just tell you to use the intersection and the problem would dissolve.

  Constraints: realistic setting (a clinic, an insurance desk, a parole board, a scout looking at a player -- no Sleeping Beauty, no anthropic self-sampling, no quantum anything); one paragraph for the scenario itself; the thing whose probability is at issue has to be a one-off prediction about a particular person or object, not a frequency question in disguise; you can stipulate the numbers for each class but keep them simple enough to state in words; and both classes have to be ones a sensible person would have consulted before finding out how it turned out -- no cherry-picking a class after the fact.

  Then do the work: name the two classes and the probability each one hands you, point at the practical decision that flips depending on which you use, and say which structural feature of the case is doing the actual work. Check that if you made the two classes nested instead, the whole thing collapses back into the boring case where specificity settles it. Finish with the strongest attempt to dissolve the puzzle -- a subjectivist who says just condition on all your evidence and stop asking which class is "the" class, or a propensity theorist who says there's a single-case chance and neither frequency is it -- and tell me whether the case survives that or not.
reasoning: |-
  We are in a clinical setting. Dr. Chen is assessing the risk of postoperative pulmonary embolism (PE) for a patient, Alex Morgan. Alex is a 58-year-old male with a history of deep vein thrombosis (DVT), who is scheduled for elective knee replacement surgery. He also has a rare genetic mutation (Factor V Leiden) and is an avid long-distance runner. The doctor has two potentially relevant reference classes:

  1. **Patients undergoing knee replacement surgery (Class A)**: The overall rate of postoperative PE in this group is 1.5%. 
  2. **Patients with a history of DVT (Class B)**: The rate of postoperative PE in this group is 5%. 

  However, Alex also has Factor V Leiden (which independently increases clotting risk) and is a long-distance runner (which might be protective). The intersection of Class A and Class B (knee replacement patients with a history of DVT) yields a small group with a PE rate of 4.5%. But when we further condition on Factor V Leiden and long-distance running, we get a group so small that there are no reliable statistics (maybe only a handful of cases, none of which had PE, but the sample is too tiny to trust). 

  The problem: Class A gives 1.5%, Class B gives 5%. The doctor must decide whether to prescribe extended prophylactic anticoagulation (which reduces PE risk but increases bleeding risk). The decision threshold might be around 3%: if the risk is above 3%, the benefits outweigh the risks. So using Class A (1.5%) says "don't prescribe", while Class B (5%) says "prescribe".

  The structural feature: The two classes are cross-cutting (neither is a subset of the other). Class A is defined by the type of surgery, Class B by patient medical history. They are not nested. The intersection (knee replacement patients with DVT history) is available but not the full story because of the additional factors. But when we add those, we lose statistical power.

  If the classes were nested (e.g., if Class B were "knee replacement patients with DVT history"), then we would simply use that class (4.5%) and the problem would dissolve. The specificity rule would work.

  Now, the subjectivist (Bayesian) dissolution: Condition on all the evidence. Form a prior based on the most specific data you have and update with the unique features. But in practice, how? We have no data on the joint effect of knee replacement, DVT, Factor V Leiden, and running. We might try to build a model, but without data on the interactions, the model is speculative. The case survives because the subjectivist approach doesn't give a clear answer without arbitrary modeling assumptions.

  The propensity theorist: There is a single-case chance for Alex. But without a theory that tells us how the factors interact, we cannot know it. The frequencies from Class A and Class B are both relevant but incomplete. The case survives because we are still left with two conflicting frequencies and no way to combine them without further assumptions.

  Thus, the reference class problem remains: we have two legitimate reference classes, leading to opposite decisions, and no non-arbitrary way to choose or combine them. The design of the prediction system must therefore do more than just seek more specific data; it must have a principled way to handle multiple overlapping reference classes when the intersection is underpopulated.
answer: |-
  ### Thought Experiment: Postoperative Complication Risk

  **Scenario:** Dr. Lee, an orthopedic surgeon, must decide whether to prescribe extended anticoagulation for patient Maria Gonzalez after hip replacement surgery. Maria is a 58-year-old former smoker (quit 5 years ago) and a professional marathon runner. The key risk is postoperative pulmonary embolism (PE). Extended anticoagulation reduces PE risk but increases bleeding complications. The decision hinges on whether Maria’s PE risk exceeds 4%—above which treatment is recommended. Two reference classes are available:  
  - **Class A (Surgery-Specific):** Hip replacement patients aged 55–65. PE rate: **2%** (based on 10,000 cases).  
  - **Class B (Lifestyle-Specific):** Endurance athletes over 50 undergoing major surgery. PE rate: **6%** (based on 500 cases; athletes’ low body fat and vascular stress heighten clotting risk).  

  Neither class subsumes the other: Class A includes non-athletes; Class B includes non-hip surgeries (e.g., cardiac). Their intersection—*hip replacement patients who are endurance athletes over 50*—has only 3 recorded cases (too few for reliable frequency). Maria’s unique combination (hip replacement + former smoker + elite runner) has no statistical history.  

  **The Conflict:**  
  - Using Class A (2% PE risk) → **no treatment** (below 4% threshold).  
  - Using Class B (6% PE risk) → **treatment** (above threshold).  
  Decision flips based on the reference class chosen.  

  **Structural Feature:**  
  The classes are **cross-cutting** (orthogonal dimensions: *surgery type* vs. *patient lifestyle*). This creates non-overlapping causal pathways: Class A reflects surgical trauma; Class B reflects physiological adaptations to endurance training. When dimensions conflict, specificity fails because their intersection lacks data.  

  **Nested Classes Collapse the Problem:**  
  If Class B were *hip replacement patients over 50* (subset of Class A), specificity would demand using Class B, yielding a single clear frequency (e.g., 3.5%). No dilemma arises.  

  **Dissolution Attempt & Survival:**  
  A **subjectivist** argues: “Condition on all evidence—Maria’s surgery, age, smoking history, and athleticism—using a Bayesian model.”  
  - **Why it fails:** The model requires prior probabilities for *factor interactions* (e.g., “How does athleticism modify surgical risk in former smokers?”). With no data for these interactions, priors become arbitrary. Subjectivism shifts the problem to prior selection but doesn’t resolve the reference class conflict.  
  - **Case survival:** The dilemma persists because neither frequency nor subjective priors break the symmetry between the two classes without ad hoc assumptions.  

  **Conclusion:**  
  The reference class problem bites because cross-cutting classes create irreducible uncertainty when intersectional data is sparse. “Get more specific data” fails here—designs must explicitly address multidimensionality (e.g., causal models or decision rules for conflicting classes), not assume specificity suffices.
