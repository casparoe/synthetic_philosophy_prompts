prompt: |-
  I sit on my city's welfare appeals panel (its a volunteer thing, we hear maybe 30 cases a month). We've been pretty consistent, or at least I thought so, but now we've got a case that's splitting us. Here's our track record from the last year, stripped down:

  - Missed a mandatory job-search appointment because the bus never came: we overturned the sanction.
  - Missed the same kind of appointment because he overslept: we upheld.
  - Missed because of a panic attack, no formal medical exemption on file: overturned.
  - Refused a job offer that paid less than his old wage and meant a 90-minute commute each way: upheld.
  - Refused a zero-hours contract because the shifts clashed with caring for his father, no formal carer's exemption: overturned.
  - Missed a training session because she was at a protest outside the training provider's office: upheld.
  - Missed because a job interview ran long and she didn't call ahead: overturned.
  - Missed because his phone was dead and he didn't have a charger: upheld.
  - Missed because the online portal locked him out and the phone line was closed for a holiday: overturned.

  New case: A claimant missed a mandatory work-focused interview because she was in police custody after being arrested at a protest outside the job centre. The charges were dropped the next day. She didn't notify us in advance. She has a clean compliance record otherwise. The department wants to sanction her for 4 weeks. She says she was exercising her political speech and that the arrest was the police's doing. The department says she chose to be there and could have rescheduled.

  What should we decide if we want to be consistent with ourselves? Which of our earlier cases is the closest analog? If our precedents genuinely underdetermine it, what principle would we be adopting with each choice? And what further case would best tell apart the rules we might be running?

  I want the answer in these sections: Bottom line (2-3 sentences), The rules that fit our record (about 200 words), What each rule predicts here (about 300 words), My call (about 150 words), The case that would settle it (about 100 words).
reasoning: |-
  Okay, the user is part of a welfare appeals panel and they're facing a tricky case that's causing division. They've provided a list of past decisions to determine consistency. The new case involves a claimant who missed an interview because she was arrested at a protest, with charges later dropped. The user wants to know how to rule consistently based on precedent.

  Looking at their past cases, there seems to be a pattern. When the reason for missing was beyond the claimant's control (like bus failures, system errors, or medical issues), they overturned sanctions. But when it was due to personal choice or negligence (oversleeping, dead phone, attending a protest at the provider's office), they upheld sanctions. The overturned cases often involved systemic failures or genuine incapacity, while upheld ones stemmed from avoidable personal decisions.

  The protest arrest case is interesting because it's similar to both types. Like the protest case they upheld, she chose to attend the protest. But unlike that case, her absence was due to state action (arrest), which might qualify as an external barrier. However, since she voluntarily put herself in a situation where arrest was possible, this feels more like a personal choice. Their precedent in the other protest case suggests upholding the sanction.

  To test the principle, imagine a case where the claimant was arrested while reporting a crime versus at a protest. If they'd overturn for the crime reporter but uphold for the protester, that would confirm they're distinguishing between civic duty and voluntary political action. This would clarify that attending protests is seen as elective behavior with consequences.

  I think consistency requires upholding the sanction here. The core principle appears to be that claimants must prioritize compliance over voluntary activities that risk non-compliance. Even if the arrest was unjust, her choice to protest during a mandatory appointment window shows poor judgment similar to the upheld protest case. The department's argument about rescheduling also aligns with their decision in the job interview case, where failure to notify was excused only because the conflict was employment-related.

  The key distinction seems to be between barriers truly outside one's control versus those arising from personal choices. Since protest attendance is voluntary, and she didn't notify about the conflict, this mirrors their upheld decisions more than the overturned ones.
answer: |-
  ### Bottom line
  We should uphold the sanction. Our precedents show we consistently penalize claimants who voluntarily create conflicts with mandatory appointments, regardless of unforeseen consequences. This case aligns most closely with the upheld sanction for missing training to attend a protest. While custody was involuntary, her choice to protest during appointment hours created the conflict.

  ---

  ### The rules that fit our record (≈200 words)
  Our decisions reveal two core principles:  
  1. **"External Barrier" Rule:** We overturn sanctions when events *truly beyond the claimant's control* directly prevent compliance (bus failure, portal lockout, medical emergency/incapacity - even undocumented). The cause is external and unavoidable.  
  2. **"Foreseeable Consequence" Rule:** We uphold sanctions when the claimant makes a *voluntary choice* that foreseeably risks or directly conflicts with compliance, even if the specific outcome (e.g., oversleeping, arrest) wasn't guaranteed. Personal responsibility for prioritizing commitments matters. Choices include leisure (oversleeping), ignoring contingencies (dead phone), or elective activities conflicting with appointments (attending protest at provider).  
  The "clean record" is mitigating but not decisive (see upheld cases with likely clean records). We distinguish incapacity (panic attack, carer clash - overturned) from avoidable scheduling conflicts created by choice (protest, job interview overlap - upheld/overturned based on *nature* of conflict).

  ---

  ### What each rule predicts here (≈300 words)
  Applying these rules to the new case:  

  *   **Under the "External Barrier" Rule:** The arrest/custody itself was an external event preventing attendance. However, this rule requires the *cause* of the barrier to be external and unavoidable. **This rule predicts overturning ONLY IF** we view *being at the protest leading to arrest* as unavoidable. Our precedent (training protest upheld) suggests attending a protest is a voluntary choice, not an unavoidable external barrier like a bus breakdown. The *arrest* was external, but the *reason she was in a position to be arrested* (choosing to protest at the job centre during her appointment window) was voluntary. This rule likely **predicts UPHOLDING** as the barrier stemmed from her own avoidable choice.  

  *   **Under the "Foreseeable Consequence" Rule:** This is a clearer fit. The claimant made a voluntary choice: attending a protest *at the job centre* overlapping with her mandatory appointment time. While arrest wasn't certain, missing the appointment was a highly foreseeable risk of that choice (similar to the risk of missing training by protesting *at the provider* - which we upheld). She prioritized political speech over compliance, just as the upheld case prioritized protest over training. Failing to notify (like the upheld dead phone case) compounds the issue. The dropped charges don't negate that her *choice* created the conflict. **This rule strongly predicts UPHOLDING.**  

  *   **Comparison to Precedents:**  
      *   **Closest Analog: Training Protest (Upheld).** Direct parallel: voluntary protest activity conflicting with mandatory engagement. Location (provider's office/job centre) reinforces the direct conflict.  
      *   **Distinguishing Overturned Cases:** Unlike the bus or portal, she controlled being there. Unlike the panic attack or caring clash, this wasn't incapacity/an urgent welfare need; it was elective political action. Unlike the job interview (overturned), that conflict involved *seeking employment* (a core welfare goal), whereas protest is unrelated.  
      *   **The Job Interview Case:** This is the counterpoint (overturned despite choice). However, we likely saw the interview *itself* as a higher priority compatible with welfare objectives, excusing the lack of call. Protest isn't analogous to job-seeking activity.

  ---

  ### My call (≈150 words)
  I vote to **uphold the sanction**. Consistency demands it. Our precedents establish that claimants bear responsibility for foreseeable conflicts arising from their voluntary, non-compliance-related choices. Choosing to attend a protest *at the job centre* during her appointment window was such a choice. Missing the appointment was a direct, foreseeable risk – just as we found with the protest at the training provider. While the arrest amplified the consequence, the root cause was her prioritization of protest over her mandatory obligation. The lack of notification further undermines her case. A clean record is noted but isn't sufficient to override the clear principle applied in the directly analogous training protest case. Upholding maintains our focus on claimant responsibility for avoidable scheduling conflicts.

  ---

  ### The case that would settle it (≈100 words)
  A case where a claimant misses an appointment due to being detained *while performing a civic duty generally considered unavoidable and non-elective*. For example: detained as a material witness to a serious crime near the appointment venue, or while reporting a crime at the job centre itself. Would we overturn (viewing civic duty as an external imperative akin to a medical emergency) or uphold (viewing even civic intervention as a voluntary choice creating risk)? This would definitively test whether our "voluntary choice" rule has exceptions for socially compelled actions, separating this case (purely elective protest) from potential civic obligations.
