answer: |-
  Below is a decision tree designed to teach the Frege-Geach problem as a forking issue, focusing on what is shared between asserted and embedded occurrences of moral sentences. The first split addresses the core question: **What is shared?** Each internal node poses a question, and leaves represent positions. Uniformity (same meaning in asserted/embedded contexts) is explicitly noted for each leaf, along with an "Awkward Commitment" highlighting vulnerabilities (especially regarding attitude reports). Unoccupied nodes are diagnosed, and overlapping leaves are flagged.

  ---

  ### **Decision Tree: The Frege-Geach Problem**  
  *Start here: What is shared between a moral sentence as asserted and as embedded (e.g., under negation, in conditionals, in attitude reports)?*  

  1. **What kind of thing is shared?**  
     - **A. A state of mind** → Go to 2  
     - **B. A content** (proposition, claim, or representational element) → Go to 3  
     - **C. A rule of inference** (role in logical reasoning) → Go to 4  
     - **D. A pretense** (fictional or make-believe element) → Go to 5  
     - **E. Nothing—reject the framing** → Go to 6  

  ---

  #### **Branch A: State of mind shared**  
  2. **Does the embedded occurrence express the same state of mind?**  
     - **A1. No, but consistency of attitudes is shared**  
       - **Leaf: Consistency-of-attitudes reply** (e.g., Blackburn’s quasi-realism).  
         - *Uniformity?* **No**—embedded contexts express higher-order attitudes (e.g., disapproval of inconsistency), not the original state.  
         - *Awkward Commitment:* Handles conditionals smoothly but struggles with attitude reports (e.g., “Sam thinks lying is wrong” attributes a first-order attitude, not a higher-order one).  
     - **A2. No, and embedded occurrences are inert**  
       - **Leaf: Moral discourse isn’t in the business of logic** (radical noncognitivist rejection).  
         - *Uniformity?* **No**—embedded sentences lack expressive force; logic is misapplied.  
         - *Awkward Commitment:* Fails to explain why we *use* moral sentences in inferences (e.g., modus ponens with moral conditionals).  
     - **(Unoccupied: "Yes, same state of mind"**—incoherent, as asserting “If lying is wrong...” doesn’t express disapproval of lying.)  

  #### **Branch B: Content shared**  
  3. **What is the nature of this content?**  
     - **B1. Minimal content** (deflationary truth-aptness)  
       - **Leaf: Minimalist-truth reply** (e.g., Horwich-inspired expressivism).  
         - *Uniformity?* **Yes**—same truth-conditional content in all contexts.  
         - *Awkward Commitment:* Attitude reports force appeal to non-minimal mental states (e.g., “Sam thinks...” attributes a belief, but minimalism lacks resources to distinguish moral from descriptive beliefs).  
     - **B2. Hybrid content** (mix of descriptive and expressive components)  
       - **Leaf: Hybrid/ecumenical views** (e.g., Ridge, Copp).  
         - *Uniformity?* **Yes**—same composite content in all contexts.  
         - *Awkward Commitment:* Projection problems (e.g., in “Lying isn’t wrong,” does negation target the descriptive or expressive component?).  
     - **(Unoccupied: "Robustly factual content"**—leads to moral realism, not an expressivist solution.)  

  #### **Branch C: Rule of inference shared**  
  4. **Leaf: Inferentialist views** (e.g., Brandom, Chrisman).  
     - *Uniformity?* **Yes**—same inferential role (e.g., commitment to consequences) in all contexts.  
     - *Awkward Commitment:* Attitude reports require reducing “thinks that...” to dispositions to infer, which misrepresents cognitive states (e.g., Sam can accept “lying is wrong” without deploying inferences).  

  #### **Branch D: Pretense shared**  
  5. **Leaf: Pretense-or-fiction views** (e.g., Kalderon’s moral fictionalism).  
     - *Uniformity?* **Yes**—same pretense (e.g., “wrong” fictively refers to properties) in all contexts.  
     - *Awkward Commitment:* Explaining why we engage in pretense during serious moral deliberation (e.g., “Is genocide wrong?” feels non-fictional).  

  #### **Branch E: Reject the framing**  
  6. **Leaf: Artifact of truth-conditional semantics** (e.g., Schroeder, Sinclair).  
     - *Uniformity?* **Irrelevant**—truth-conditional semantics misconstrues moral language; embeddings aren’t problematic.  
     - *Awkward Commitment:* Requires building a non-truth-conditional semantics from scratch (e.g., for attitude reports) without collapsing into another branch.  

  ---

  ### **Notes on the Tree**  
  - **Unoccupied Combinations:**  
    - “State of mind + same in embeddings” (A→Yes) is **incoherent**—you can’t express disapproval of lying when hypothesizing “If lying is wrong...”  
    - “Content + robustly factual” (B3) is **occupied by moral realism** (not expressivist) and bypassed here.  
  - **Overlapping Leaves:** The tree cannot sharply separate:  
    - *Inferentialism (C)* and *Artifact of truth-conditional semantics (E)*: Many inferentialists (e.g., Brandom) also reject truth-conditional semantics.  
    - *Pretense (D)* and *Not in the business of logic (A2)*: Both treat embeddings as non-literal, but pretense affirms uniformity.  
  - **Key Fault Line:** Uniformity (Yes/No) splits expressivist replies: **Hybrid, Minimalist, Inferentialist, and Pretense views enforce uniformity**; **consistency-of-attitudes and radical noncognitivism deny it**. Attitude reports test all.  

  ---

  ### **Handout Summary**  
  **Target Leaves Covered:**  
  1. Consistency-of-attitudes (A1)  
  2. Minimalist-truth (B1)  
  3. Hybrid/ecumenical (B2)  
  4. Pretense/fiction (D)  
  5. Inferentialist (C)  
  6. Artifact of truth-conditional semantics (E)  
  7. Moral discourse not in the business of logic (A2)  

  **Nodes:** 6 questions (1 root + 5 branches).  
  **Leaves:** 7 positions (fits 8–10 target).  
  **Focus:** Attitude reports expose tensions in uniformity—especially for *consistency-of-attitudes* (A1) and *minimalist-truth* (B1).
