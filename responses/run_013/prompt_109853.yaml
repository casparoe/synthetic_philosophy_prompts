prompt: |-
  I am the character and behaviour lead for a group of state secondary schools, and I have to turn two rival pictures of human nature into something my form tutors can actually run. The pictures, the ones usually labelled after Mencius and after Xunzi: on the first, children already have the beginnings of compassion, shame, deference and a sense of right and wrong, and the teacher's task is to keep those beginnings from being obstructed, worn down or starved — the trouble is bad soil and repeated cutting, not a bad seed. On the second, the native equipment is partiality, appetite and the pursuit of advantage; decency is acquired, deliberately and laboriously, through ritual, repetition, explicit rules and imitation of good models, so that the settled disposition is largely downstream of the practice. Both pictures insist that people can change and that surroundings matter enormously; they differ over where the change comes from. My tutors have no philosophy and twenty minutes per case, decisions come up daily, and anything outside our standard tariff of sanctions has to be signed off by the head teacher.

  Write me a decision procedure they can run. It must take a single case — one pupil, one class, or one whole-school policy — and output an intervention rather than a verdict about anyone's nature. It should put its questions in a fixed order, say what counts as a sufficient answer to each, and mark where it stops with a no. It needs an explicit test for telling the two pictures apart in a particular case, plus a rule for the common situation where they prescribe the same action anyway, and a rule for what to do when they genuinely conflict. It should flag which steps are judgement dressed up as procedure, and name the point at which the remaining question is one of values — how far a school may go in manufacturing a child's dispositions — rather than of fact, and hand that to a named person. Finally, it must forbid any intervention that would manufacture the evidence for its own diagnosis: if we treat children as naturally bent and build the school accordingly, we will get the behaviour we predicted and will have no way of telling whether the prediction was true.

  Then run the procedure on three cases: a fourteen-year-old caught passing answers to a friend in a test she would have passed on her own; a corridor litter problem that no amount of reminding has fixed; and a Year 9 tutor group whose attendance collapses every February. Include at least one case where the procedure returns something I will not want to hear. End with what the procedure cannot do, and say which records we already keep would show us, after a year, that its diagnostic step is misfiring.
reasoning: |-
  Okay, let me think through this complex request. The user is a behaviour lead needing a practical decision framework for school staff that reconciles two philosophical views of human nature - one seeing innate goodness needing nurturing (Mencian), the other seeing decency as acquired through structure (Xunzian). 

  First, I need to design a procedure that:
  - Works within 20-minute constraints
  - Avoids nature debates by focusing on interventions
  - Has explicit conflict resolution rules
  - Flags value judgments for escalation
  - Prevents self-fulfilling prophecies

  The core challenge is creating diagnostic questions that reliably distinguish between cases needing supportive nurturing versus structured habit-building, while acknowledging when both approaches converge. 

  For the diagnostic test, I'm considering:
  1. Prior conduct history - patterns suggest whether foundations exist
  2. Environmental triggers - identifies external obstacles
  3. Mimicry vs internalization - assesses if behaviour is performative
  But I must ensure these don't become nature-versus-nurture proxies.

  The intervention rules should:
  - Default to Mencian support where evidence is ambiguous
  - Escalate to head when values questions arise (e.g. coercive measures)
  - Require parallel tracking of both approaches when conflict occurs

  Now for the test cases:
  The cheating incident seems clearly Mencian - no prior issues, shame displayed. But what if the user dislikes the light-touch recommendation? That's the uncomfortable output required.

  The litter problem feels Xunzian - habitual, no remorse. Structured routines make sense.

  The attendance collapse shows conflict - possible environmental factors (Mencian) vs needing strict routines (Xunzian). Here the procedure would require both approaches simultaneously.

  Finally, I'll specify how to audit the system using existing records like behaviour logs and attendance patterns to check if the diagnostic step creates bias over time.

  Throughout, I must maintain focus on actionable outputs while honouring the philosophical depth of the original question.
answer: |-
  Here is a decision procedure designed for your form tutors, translating the Mencius/Xunzi tension into actionable steps within operational constraints. It prioritizes intervention over diagnosis, avoids self-fulfilling prophecies, and clarifies where judgment or values decisions are required.

  **The Intervention Selection Procedure (ISP)**

  **Core Principle:** *Never assume fixed nature. Focus on observable behaviour, context, and changeable factors. Interventions must not presuppose their own success/failure.*

  **Input:** One specific case (pupil, class, policy) with observed problematic behaviour/persistent issue.
  **Output:** A specific, actionable intervention plan or a clear escalation path.
  **Time Allocation:** Designed for <20 mins per case.
  **Key:** **[J]** = Step involving significant professional judgement. **[V]** = Values boundary - must escalate.

  ---

  **Procedure Steps (Fixed Order):**

  1.  **Define the Specific Behaviour:** What *exactly* is happening? (e.g., "Passing written answers during Maths test," "Litter accumulating in East Wing corridor between 1-2pm," "Year 9 Group X attendance drops below 70% in February"). *Sufficient Answer:* A clear, observable, non-judgmental description. *Stop if No:* Cannot define it precisely. *Output:* Reject case for refinement.
  2.  **Baseline Check:** Is this behaviour *already* covered adequately by the standard tariff of sanctions/procedures? (e.g., Cheating sanction exists, litter duty exists, attendance policy exists). *Sufficient Answer:* Yes (use standard) / No (proceed). *Stop if Yes:* Apply standard tariff. *Output:* Implement standard sanction/procedure.
  3.  **Prior Conduct Pattern [J]:** Review records. Has this pupil/group *consistently* shown the *foundations* of the *desired* behaviour *in similar contexts* before? (e.g., Has the pupil generally been honest? Does the class keep other areas tidy? Did the group have good attendance Sept-Jan?). *Focus on evidence of compassion, cooperation, responsibility, rule-following in related situations.* *Sufficient Answer:* Clear evidence of prior foundation (Proceed to Step 4A) / Little or inconsistent evidence (Proceed to Step 4B) / Genuinely ambiguous or first major occurrence (Proceed to Step 5). *[Judgement: Assessing consistency and relevance of past behaviour.]*
  4.  **The Diagnostic Test (Mencius vs. Xunzi Cue):**
      *   **4A. (If Prior Foundation Found): Check for Obstruction/Suppression:** Is there evidence the *desired* behaviour is being actively suppressed, obstructed, or overwhelmed *in this specific context*? (e.g., Was the cheating pupil under extreme peer pressure? Is the litter area poorly serviced/bins overflowing? Are Feb lessons perceived as irrelevant/dull by Year 9?). *Sufficient Answer:* Credible evidence of specific suppression/obstruction (*Mencius Cue*) / No credible evidence (*Proceed to Step 5*).
      *   **4B. (If Little Prior Foundation Found): Check for Learned Habit:** Is the problematic behaviour highly automatic, context-specific, and lacking visible internal conflict (shame/hesitation)? Is there evidence it serves an immediate appetite/advantage? (e.g., Is littering habitual/thoughtless? Is Feb absenteeism linked to immediate gratification like gaming/socialising? Does cheating feel like a normalised "helping" without guilt?). *Sufficient Answer:* Behaviour appears habitual, self-serving, lacking internal conflict (*Xunzi Cue*) / Evidence of internal conflict or unclear motivation (*Proceed to Step 5*).
  5.  **Conflict/Ambiguity Check:**
      *   If arriving from 4A (Mencius Cue) OR 4B (Xunzi Cue): **Proceed to Step 6.**
      *   If arriving from Step 3 (Ambiguous/First Occurrence) OR inconclusive at 4A/4B: **Apply Default Intervention (See Rule 1 below) and Stop.** *Output:* Default Intervention.
  6.  **Intervention Selection:**
      *   **If Mencius Cue (Step 4A):** Design intervention focused on *removing obstacles, providing support, nurturing existing good impulse*. (e.g., Address peer pressure, improve bin provision/schedules, make Feb lessons more engaging/relevant). *Output:* Supportive/Nurturing Intervention.
      *   **If Xunzi Cue (Step 4B):** Design intervention focused on *structured practice, clear rules, modelling, repetition to build new habit*. (e.g., Supervised corridor patrols/litter drills, structured attendance contracts with immediate rewards/consequences, explicit exam rules practice with scenarios). *Output:* Structured Habit-Building Intervention.
      *   **Rule 1 (Common Action):** If *both* cues logically lead to the **same specific intervention** (e.g., "Provide more bins" addresses obstruction *and* aids habit formation), implement that intervention. *Output:* Single Intervention.
      *   **Rule 2 (Genuine Conflict):** If cues point to **distinctly different interventions** (e.g., Support peer pressure vs. Impose strict consequences for cheating; Engage with fun lessons vs. Enforce rigid attendance contract), **you MUST [V]**. *Output:* Escalate case to Head Teacher with both proposed interventions and rationale. *[Values Boundary: Balancing nurture vs. control, assessing coercion level.]*
  7.  **Self-Fulfilling Prophecy Check:** Does the proposed intervention *assume* the pupil's inherent nature (good/bad) and structure the environment *solely* based on that assumption, making it impossible to observe change? (e.g., "Treat all as potential cheaters = constant surveillance, preventing trust"; "Assume no innate care = only punitive litter duty, never fostering responsibility"). *Sufficient Answer:* Yes (Redesign Intervention) / No (Proceed). *Stop if Yes:* Go back to Step 6/Default. *Output:* Revised Intervention Plan.
  8.  **Finalise Plan:** Document the specific intervention, responsibilities, review date, and how success/failure will be measured (observable behaviour change).

  ---

  **Running the Procedure on Cases:**

  **Case 1: Fourteen-year-old caught passing answers in a test (she would have passed alone).**

  1.  **Define:** Passing written answers to a friend during a formal Year 10 Maths test.
  2.  **Baseline:** Standard cheating sanction exists (Test zero, detention, parental contact). **Stop?** *No* (Tutor feels sanction alone insufficient, seeks understanding/intervention).
  3.  **Prior Pattern [J]:** Records show generally good conduct, honest, conscientious. No prior cheating. *Sufficient Answer:* Clear evidence of prior foundation (Honesty/Responsibility). **Proceed to 4A.**
  4.  **A. Obstruction?:** Tutor ascertains: Strong, persistent pressure from friend ("You *have* to help me, my parents will kill me"). Pupil expressed significant shame/regret immediately after. *Sufficient Answer:* Credible evidence of specific suppression (peer pressure overwhelming honest impulse). **Mencius Cue.**
  5.  **Conflict Check:** Proceed to 6.
  6.  **Intervention:** **Mencius Cue:** Focus on removing obstacle/supporting good impulse. Intervention: 1) Implement standard sanction (accountability). 2) *Plus:* Discuss assertive refusal strategies with pupil. 3) *Plus:* Discreet conversation with the friend receiving answers about pressure & support offered. 4) *Plus:* Reassure pupil school supports her standing up for honesty.
  7.  **SFP Check:** Does this assume inherent goodness? (No, it responds to evidence of conflict/shame). Does it prevent observation? (No, it aims to empower honesty). **Proceed.**
  8.  **Plan:** Sanction + Assertiveness coaching session + Conversation with friend + Reassurance. Review: Monitor future tests, check-in with pupil.

  **Case 2: Corridor litter problem persistent despite reminders.**

  1.  **Define:** Accumulation of food wrappers/packaging primarily in the East Wing corridor (Main Hall to Science Block) during the 10-minute morning break.
  2.  **Baseline:** Litter duty exists as sanction. **Stop?** *No* (Reminders/duty not solving the persistent issue).
  3.  **Prior Pattern [J]:** Mixed evidence. Some pupils use bins elsewhere. This corridor is a high-traffic "chokepoint" after break. Little visible remorse when littering observed. *Sufficient Answer:* Little consistent evidence of foundation (responsibility for tidiness *here*). **Proceed to 4B.**
  4.  **B. Learned Habit?:** Behaviour appears automatic (dropping while walking/talking). Immediate advantage (convenience, no bin immediately to hand). Lack of visible conflict/hesitation. *Sufficient Answer:* Behaviour habitual, self-serving, lacking internal conflict. **Xunzi Cue.**
  5.  **Conflict Check:** Proceed to 6.
  6.  **Intervention:** **Xunzi Cue:** Focus on structured practice/rules/modelling. Intervention: 1) Install 2 additional large, visible bins in the corridor chokepoint. 2) Implement a "Litter Patrol" for 2 weeks: Staff/selected pupils visibly present for 5 mins post-break, politely reminding/pointing to bins. 3) Brief tutor groups explicitly: "All litter in bins in East Wing. Patrol in place." 4) Praise/compliance tickets for clean areas.
  7.  **SFP Check:** Does this assume inherent messiness? (No, it assumes the *habit* is the problem and builds a new one). Does it prevent observation? (No, patrol models/praises desired behaviour). **Proceed.**
  8.  **Plan:** Install bins + 2-week Staff/Student Patrol + Explicit Briefing + Praise System. Review: Measure litter levels weekly.

  **Case 3: Year 9 Tutor Group attendance collapse every February.**

  1.  **Define:** Attendance for Year 9 Group Z drops consistently below 70% during February half-term and the weeks immediately before/after.
  2.  **Baseline:** School attendance policy exists (escalating letters, meetings). **Stop?** *No* (Policy ineffective for this specific, predictable pattern).
  3.  **Prior Pattern [J]:** Group attendance is generally good (90%+) Sept-Jan and March-July. Collapse is specific to February. *Sufficient Answer:* Evidence of foundation (good attendance possible) *but* inconsistent (fails specifically in Feb). **Proceed to 5 (Ambiguous - Specific trigger vs. Habitual lapse?).**
  4.  *(Skipped as proceeding from Step 3 ambiguity)*
  5.  **Conflict/Ambiguity Check:** Arrived from Step 3 (Ambiguous). **Apply Default Intervention and Stop.**
      *   **Default Intervention Rule:** When prior pattern is ambiguous or it's a first major occurrence, default to the **Mencius-aligned approach first** (support/nurture existing good *potential*). Intervention: Investigate potential *obstacles/suppression* specifically in February (e.g., Survey pupils anonymously: "What makes coming to school harder in Feb?"; Check lesson content/teacher consistency; Look for seasonal factors like SAD, post-mock slump). Implement supportive changes based on feedback.

  ***What You Might Not Want to Hear:*** The procedure defaults to a supportive (Mencius) approach for the Year 9 attendance collapse. You might believe a stricter (Xunzi) habit-enforcing intervention (e.g., mandatory morning check-ins, loss of privileges for absence) is immediately needed. The procedure prioritizes investigating root causes over imposing control when the evidence is ambiguous, potentially feeling too slow or soft.

  ---

  **What the Procedure Cannot Do:**

  1.  **Prove Philosophical Truth:** It doesn't determine if Mencius or Xunzi was "right." It only suggests which lens *might be more productive* for intervention *in this specific case*.
  2.  **Eliminate Judgment:** Steps marked [J] require professional interpretation of behaviour and context.
  3.  **Resolve Values Conflicts:** It flags [V] but doesn't decide how far the school should go in "manufacturing" dispositions; that's for the Head/senior leadership.
  4.  **Predict Long-Term Outcomes:** It suggests interventions based on the best available evidence, but success isn't guaranteed.
  5.  **Address Severe Trauma/Complex Needs:** This is for common behaviour issues. Severe cases need specialist referral regardless of the ISP.
  6.  **Fix System-Level Failures:** If the core issue is resource starvation, poor leadership, or toxic culture, the ISP might identify symptoms but not the cure.

  **Auditing the Diagnostic Step (Steps 3 & 4):**

  Existing records that can show misfiring *if tracked alongside ISP decisions*:

  1.  **Behaviour Logs (with context):** Track patterns *before* and *after* interventions flagged as Mencius/Xunzi. Does the "Prior Pattern" (Step 3) assessment hold over time? Do Mencius-cued interventions work better where prior foundation was strong? Do Xunzi-cued interventions work better where prior foundation was weak?
  2.  **Intervention Success Rates:** Compare the success rates (based on observable change) of interventions triggered by Mencius cues vs. Xunzi cues vs. the Default. Are certain cues consistently leading to less effective interventions?
  3.  **Escalation Records (Step 6 Rule 2):** Track cases escalated due to conflict. Are certain types of problems consistently causing value clashes? Does the Head usually favour one approach?
  4.  **Pupil/Staff Feedback (on interventions):** Does feedback suggest interventions based on one cue feel inappropriate or demotivating compared to the other?
  5.  **Repeated Cases:** Track pupils/issues that recur frequently. Was the initial diagnostic cue incorrect? Was the intervention poorly implemented, or did the diagnostic step misfire?

  **Misfiring Signal:** A consistent pattern where interventions based on a specific diagnostic cue (Mencius or Xunzi) have significantly *lower* success rates than the Default or the other cue, *especially* when controlling for issue severity, would indicate the diagnostic step is flawed or being misapplied. Similarly, if the "Prior Pattern" assessment frequently contradicts later evidence, Step 3 needs refinement.
