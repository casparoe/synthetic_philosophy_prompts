prompt: |-
  I commission popular history for a mid-sized trade publisher, and roughly once a month a proposal arrives claiming the accepted story is wrong — a civilization older than the last ice age, contact between continents the textbooks say never happened, a wholesale re-dating of the ancient world argued from statistics on texts. I have no in-house historian, three weeks to decide, and an editorial board that will ask me to defend the call. Publishing crankery costs us credibility; turning down real revisionism is its own failure, and I can't sort them by whether the author holds a doctorate. Write me a decision procedure I can actually run on a proposal: the questions to ask in order, what counts as an answer good enough to pass, where it stops with a no, and where it should hand the decision back to me because what is at stake is editorial values rather than truth. I have fragments of advice — does the thesis survive any evidence at all, are its lines of support independent or do they all hang from a single premise, do the citations bottom out in primary sources — but no way to order or weigh them, and I don't want the result collapsing into the slogan that science is falsifiable, which seems both to over- and under-reject. It must separate pseudohistory from honest-but-wrong scholarship, from ordinary speculative history, and from outright fraud. Then run it on three proposals — a lost civilization before the ice age, a book claiming the conventional chronology of the ancient world was fabricated during the Renaissance, and a book claiming a celebrated ancient artifact is a modern forgery — and tell me which one it decides against my instincts, which steps are judgment calls dressed up as tests, and what it cannot settle.
reasoning: |-
  We are designing a decision procedure for evaluating historical revisionist proposals. The goal is to distinguish between:
  1. Pseudohistory (crankery) - to be rejected.
  2. Honest-but-wrong scholarship - may be rejected on scholarly grounds but not necessarily crankery.
  3. Ordinary speculative history - which might be acceptable for publication if presented as such.
  4. Outright fraud - to be rejected.

  The procedure must be step-by-step, with clear pass/fail criteria at each step, and some steps that may require editorial judgment (which we will identify).

  Proposed Decision Procedure:

  Step 1: Initial Triage
     - Check for immediate red flags: 
        a. The proposal claims a vast conspiracy or cover-up without extraordinary evidence.
        b. The author uses abusive or derogatory language towards mainstream scholars.
        c. The work is self-published or published by a known vanity press (unless the author has a strong reason and the work is otherwise sound).
     - If any red flag is present, reject. Otherwise, proceed.

  Step 2: Test of Falsifiability
     - Ask: What evidence would disprove the thesis? If the author provides no such evidence or states that no evidence could disprove it, reject.
     - If the thesis is falsifiable and the author provides potential falsifying evidence, proceed.

  Step 3: Independence of Evidence
     - Examine the lines of evidence. Are they independent (i.e., if one falls, others still stand) or do they all depend on a single premise?
        - If the entire argument hangs on one or two premises (especially if those are controversial), then that is a weakness. But note: it does not automatically mean rejection. Instead, we proceed but note the dependency.
     - If the argument is entirely dependent on a single premise that is highly speculative or easily challenged, reject. Otherwise, proceed.

  Step 4: Primary Source Engagement
     - Check the citations: 
        a. Do they bottom out in primary sources (archaeological reports, original texts, etc.)?
        b. Or are they mostly secondary sources that are either outdated or from fringe literature?
        c. Are there any primary sources? If not, reject.
        d. If primary sources are used, are they interpreted in a way that is consistent with standard methodologies? (This is a judgment call: we look for egregious misreadings or ignoring context.)
     - If the work lacks primary sources or misuses them (e.g., taking quotes out of context, ignoring counter-evidence in the same source), reject. Otherwise, proceed.

  Step 5: Engagement with Counter-evidence
     - Does the author address the strongest counter-arguments and evidence against their thesis? 
        - If the author dismisses counter-evidence without engagement (e.g., by claiming it is part of a cover-up) or ignores it entirely, reject.
        - If the author engages with counter-evidence, even if unconvincingly, then proceed (this is a sign of honest scholarship, even if wrong).

  Step 6: Scholarly Context
     - Check if the author engages with the current scholarly consensus and recent literature. 
        - If the work ignores major recent works in the field, that is a weakness. However, it might be acceptable if the author is challenging the consensus and the work is otherwise strong.
        - This step is more of a judgment call: we want to see if the author is aware of the state of the field. If the work is entirely based on outdated scholarship, reject. Otherwise, proceed.

  Step 7: Methodological Soundness
     - Evaluate the methods used (e.g., statistical analysis, dating techniques, linguistic analysis). 
        a. Are the methods appropriate for the historical question?
        b. Are they applied correctly? (This may require an expert, but we can look for obvious flaws such as misapplied statistics, ignoring error margins, etc.)
     - If the methods are fundamentally flawed, reject. Otherwise, proceed.

  Step 8: Parsimony
     - Does the thesis require a more complex explanation than the mainstream one? Does it multiply entities (e.g., postulating unknown civilizations, conspiracies) without sufficient cause?
     - If the thesis is significantly less parsimonious without clear compensating evidence, reject. Otherwise, proceed.

  Step 9: Editorial Judgment
     - By this point, the proposal has passed the previous steps. Now consider:
        a. The potential impact on the field and public understanding.
        b. The author's ability to write accessibly for a popular audience.
        c. Whether the revisionism is presented as speculative or as established fact.
        d. The publisher's reputation: we do not want to be seen as promoting crankery.
     - This step is subjective and must be made by the editor.

  The procedure is a funnel: if at any step from 1 to 8 the proposal fails, it is rejected. Only if it passes all the way to step 9 does it then require the editor's judgment on non-factual grounds.

  Now, we test the procedure on three proposals:

  1. Proposal A: A lost civilization before the last ice age (e.g., like Atlantis).
  2. Proposal B: The conventional chronology of the ancient world was fabricated during the Renaissance.
  3. Proposal C: A celebrated ancient artifact is a modern forgery.

  We will run each through the steps and determine the outcome. Then, we will note which one might go against the editor's instincts, which steps are judgment calls, and what the procedure cannot settle.

  ---

  **Proposal A: Lost civilization before the last ice age**

  Step 1: Initial Triage
     - Often such proposals claim a cover-up (e.g., by archaeologists). If the proposal does, red flag. Also, check language: if it attacks mainstream scholars, red flag. Let's assume it does claim a cover-up and uses some inflammatory language. -> Reject.

     But let's assume a more moderate version: the author does not claim a conspiracy but argues that archaeologists have overlooked evidence. No abusive language. Proceed.

  Step 2: Falsifiability
     - The thesis is that a civilization existed. What would disprove it? The author might say: if we found no evidence of such a civilization in areas that were above water at the time. But the author might also say that the evidence is now under the sea. This is tricky. If the author says that the evidence is only under the sea and we haven't looked there, then it's hard to falsify. 
     - If the author provides specific testable predictions (e.g., we should find certain types of artifacts in coastal caves that were above water then) then it passes. Otherwise, reject.

     Assume the author says: we can look for submerged structures and that they have found some with sonar. But if those structures turn out to be natural, that would disprove. So it passes.

  Step 3: Independence of Evidence
     - The evidence might be: 
          a. Some sonar images of underwater structures.
          b. Myths and legends from various cultures.
          c. Alleged out-of-place artifacts (OOPArts).
     - These are independent? Only if the sonar images are not interpreted through the lens of the myths. But often they are. If the entire argument depends on the interpretation of the sonar images as artificial, then it's a single point of failure. 
     - If the author has multiple independent lines (e.g., the sonar, the myths, and the OOPArts) and they are not all dependent on the same premise, then proceed. But note: the OOPArts might be explained by other means, and the myths are not direct evidence. 
     - This is borderline. We might reject if the only strong evidence is the sonar and it's controversial. But let's assume the author has multiple independent lines. Proceed.

  Step 4: Primary Source Engagement
     - For the sonar: primary source would be the raw sonar data and geological reports. Does the author engage with that? Or just with images found on the internet? 
     - For myths: primary sources would be the original texts. Does the author read them in the original language? Or rely on translations and secondary sources?
     - For OOPArts: primary sources would be the excavation reports and scientific analyses of the artifacts.
     - If the author does not engage with primary sources for any of these, reject. Often, these proposals rely on popular books. Reject.

  Step 5: Engagement with Counter-evidence
     - For example, if geologists say the underwater structures are natural, does the author address that? If not, reject.

  Step 6: Scholarly Context
     - Is the author aware of the current understanding of the last ice age and the archaeological record? If they ignore the fact that there is no evidence of agriculture or cities from that period, reject.

  Step 7: Methodological Soundness
     - If the author uses methods that are not standard (e.g., interpreting myths as literal history without corroboration) or misuses dating methods, reject.

  Step 8: Parsimony
     - The mainstream view: no civilization because the conditions were not suitable (hunter-gatherer societies only). The revisionist view: a civilization that left no clear trace except in myths and a few ambiguous artifacts. The mainstream is more parsimonious. Without strong evidence, reject.

  Verdict: This proposal is likely to be rejected at multiple steps (especially 4, 5, 7, 8). It is probably crankery.

  ---

  **Proposal B: Conventional chronology of the ancient world was fabricated during the Renaissance**

  Step 1: Initial Triage
     - Often such proposals involve a conspiracy (by Renaissance scholars). If the author claims a conspiracy, that's a red flag. Also, if the author attacks historians as being dupes or part of the conspiracy, red flag. Reject.

     But assume a more scholarly version: the author argues that the chronology was based on flawed assumptions and that some events are misdated. No conspiracy, just error. Proceed.

  Step 2: Falsifiability
     - What would disprove it? The author might say: if we found original documents from the ancient world that independently confirm the conventional chronology. But if the author argues that all such documents are forgeries, then it becomes unfalsifiable. 
     - The author must allow that if newly discovered documents (e.g., in an archaeological dig) that are independently dated (by radiocarbon, etc.) confirmed the conventional chronology, that would be a problem. If they say that, then it passes. Otherwise, reject.

  Step 3: Independence of Evidence
     - The evidence might be:
          a. Statistical analysis of texts (e.g., claiming that the style of writing changes too slowly or too quickly).
          b. Astronomical records that don't match the conventional dates.
          c. Anomalies in art or artifacts.
     - These are independent? Only if the statistical analysis and the astronomical records are separate. If the entire argument is based on statistics, then it's a single point of failure. 
     - If the author has multiple independent lines, proceed. If not, and the statistics are the main pillar, then we must scrutinize the statistics.

  Step 4: Primary Source Engagement
     - The author must engage with the primary sources (ancient texts, inscriptions). They must show that they have examined the original documents (or at least reliable editions) and not just relied on secondary summaries. 
     - Also, they must address the primary sources that support the conventional chronology. If they dismiss them as forgeries without evidence, that's a problem. 
     - If they do not engage with primary sources, reject.

  Step 5: Engagement with Counter-evidence
     - There is abundant counter-evidence: radiocarbon dating, dendrochronology, independent records from other cultures. Does the author address these? 
     - If the author dismisses radiocarbon dating as unreliable without providing a strong basis, reject.

  Step 6: Scholarly Context
     - The author should engage with the work of mainstream historians and chronologists. If they ignore the standard works on ancient chronology, reject.

  Step 7: Methodological Soundness
     - The statistical methods: are they sound? This is critical. If the author uses a flawed statistical model, reject. (This might require an expert, but if we can see obvious flaws, such as not accounting for known factors, then reject.)

  Step 8: Parsimony
     - The conventional chronology is the result of centuries of scholarship and multiple independent lines of evidence. The revisionist theory would require that a massive fabrication occurred and that all the scientific dating methods are systematically wrong. This is less parsimonious. Without extraordinary evidence, reject.

  Verdict: This proposal is likely to be rejected at multiple steps (especially 5, 7, 8). It is probably crankery.

  ---

  **Proposal C: A celebrated ancient artifact is a modern forgery**

  This is a common type of revisionism and sometimes turns out to be true (e.g., the James Ossuary, the Getty kouros). So we must be careful.

  Step 1: Initial Triage
     - The author might claim that the museum or scholars are covering up the truth. If so, red flag. But if the author presents a scholarly argument without conspiracy, proceed.

  Step 2: Falsifiability
     - What would disprove it? The author might say: if we found a document from before the alleged forgery date that mentions the artifact, or if a new scientific test confirmed the artifact's age. Pass.

  Step 3: Independence of Evidence
     - The evidence might be:
          a. Stylistic analysis (the style doesn't match the period).
          b. Material analysis (e.g., the stone or metal is from a modern source).
          c. Provenance issues (the artifact surfaced in suspicious circumstances).
     - These are independent: each can stand on its own. Proceed.

  Step 4: Primary Source Engagement
     - The author must have examined the artifact firsthand or at least studied high-quality photographs and scientific reports. They must also engage with the primary documents about the artifact's discovery and history. Pass (if they do).

  Step 5: Engagement with Counter-evidence
     - The author must address the evidence that supports authenticity (e.g., previous scientific tests, provenance research). If they do, proceed.

  Step 6: Scholarly Context
     - The author should be aware of the existing scholarship on the artifact and on forgeries in general. Pass (if they are).

  Step 7: Methodological Soundness
     - The methods (stylistic, material, historical) must be sound. If the stylistic analysis is done by an expert in the field, that's good. If the material analysis is done by a reputable lab, that's good. If the author is not an expert but relies on experts, that might be acceptable. Pass.

  Step 8: Parsimony
     - The mainstream view: the artifact is genuine. The revisionist view: it is a forgery. Which is more parsimonious? It depends. If there are many forgeries from the same period and the provenance is weak, then the forgery theory might be more parsimonious. Otherwise, the genuine theory is simpler. This is a judgment call. But note: sometimes the forgery theory is correct. We cannot reject solely on parsimony.

     Since the proposal has passed the other steps, we proceed to Step 9.

  Step 9: Editorial Judgment
     - Consider: 
          a. The artifact's fame: if it is very famous, the book might attract attention but also criticism.
          b. The author's credentials: are they an expert in the field? If not, we might be cautious.
          c. How the argument is presented: as a possibility or as a certainty?
     - This is up to the editor.

  Verdict: This proposal might pass the initial steps and go to editorial judgment. It is not necessarily crankery.

  ---

  Now, to answer the questions:

  1. Which one does the procedure decide against my instincts?
     - The editor's instincts might be to reject the forgery proposal (Proposal C) because it challenges a celebrated artifact and might be controversial. But the procedure might let it through to editorial judgment because it is falsifiable, uses multiple independent lines of evidence, and engages with primary sources. So if the editor's instinct was to reject, the procedure might be more accepting.

     However, note that the editor might have an instinct to accept the lost civilization (Proposal A) because it's exciting, but the procedure rejects it. So that might also be against instincts.

  2. Which steps are judgment calls dressed up as tests?
     - Step 4 (Primary Source Engagement): Deciding whether the author has engaged adequately with primary sources can be subjective.
     - Step 5 (Engagement with Counter-evidence): What counts as adequate engagement? Dismissing with a good reason might be acceptable, but it's a judgment call.
     - Step 6 (Scholarly Context): Deciding if the author has engaged with recent literature sufficiently is subjective.
     - Step 8 (Parsimony): Deciding which theory is more parsimonious can be debatable.

  3. What it cannot settle?
     - The procedure cannot settle the editorial judgment at Step 9: the potential impact, the author's writing ability, and how the revisionism is framed (as fact or speculation). Also, it cannot definitively settle methodological soundness without expert review, so if the editor doesn't have access to experts, they might have to rely on their own assessment or skip that step (which is risky).

     Additionally, the procedure cannot detect fraud (like fabricated evidence) without a deep investigation.

  Conclusion:
  The procedure provides a structured way to screen proposals. It is designed to be conservative to avoid publishing crankery, but it may let through some controversial but potentially valid revisionism (like the forgery case) for editorial judgment. The editor should be aware that some steps require judgment and might need to seek external advice when in doubt.
answer: |-
  ### Decision Procedure for Evaluating Historical Revisionism Proposals

  Below is a step-by-step decision procedure designed to systematically evaluate proposals while minimizing subjectivity. It prioritizes **falsifiability**, **evidential coherence**, and **scholarly rigor**, with clear pass/fail gates. Steps 1–7 focus on factual validity; Step 8 flags editorial judgment calls. **Rejection at any step ends the process**.

  ---

  #### **Step 1: Conspiracy & Motive Check**  
  **Question:** Does the thesis rely on *malicious intent* (e.g., academic fraud, institutional cover-ups) as a core premise?  
  **Pass:** No conspiracy needed, or conspiracy is a *minor* inference from evidence.  
  **Fail:** Conspiracy is foundational (e.g., "Historians hid the truth").  
  **Why:** Pseudohistory often weaponizes distrust. Legitimate revisionism focuses on evidence, not malice.  
  **Stop here if fail.**  

  #### **Step 2: Falsifiability & Testability**  
  **Question:** Can the thesis be *disproven* with feasible evidence? Does it engage with *specific* counter-evidence?  
  **Pass:** Identifies testable claims (e.g., "If X artifact is carbon-dated to Y era, my thesis fails").  
  **Fail:** Unfalsifiable ("Absence of evidence proves evidence was destroyed"), or dismisses counter-evidence as "fraudulent."  
  **Why:** Science requires disprovable claims. Honest scholarship confronts counter-arguments.  
  **Stop here if fail.**  

  #### **Step 3: Evidential Independence**  
  **Question:** Are the supporting arguments *modular*? If one fails, do others stand?  
  **Pass:** Multiple independent lines (e.g., textual analysis + archaeology + genetics).  
  **Fail:** All evidence depends on one precarious premise (e.g., "All ancient texts are forgeries, therefore...").  
  **Why:** Pseudohistory builds "houses of cards"; robust scholarship cross-validates.  
  **Stop here if fail.**  

  #### **Step 4: Primary Source Grounding**  
  **Question:** Do citations bottom out in *primary sources* (excavation reports, artifacts, contemporary texts)?  
  **Pass:** Relies on primary sources, contextualizes them, and addresses provenance.  
  **Fail:** Overuses fringe secondary sources, misquotes primary sources, or ignores provenance.  
  **Why:** Revisionism must engage directly with raw evidence, not echo chambers.  
  **Stop here if fail.**  

  #### **Step 5: Methodological Transparency**  
  **Question:** Are methods *reproducible* and field-appropriate (e.g., radiocarbon dating, statistical significance)?  
  **Pass:** Details methods so experts could replicate them (e.g., "We used Bayesian chronology on 500 coin inscriptions").  
  **Fail:** Opaque methods ("My algorithm proves X"), misapplied stats, or ignoring error margins.  
  **Why:** Fraud and crankery often hide behind jargon; honest work invites scrutiny.  
  **Stop here if fail.**  

  #### **Step 6: Parsimony & Burden of Proof**  
  **Question:** Is the thesis *simpler* than mainstream explanations? Does it meet its burden of proof?  
  **Pass:** Explains *more* evidence with *fewer* assumptions (e.g., "This forgery claim resolves 3 anomalies").  
  **Fail:** More convoluted than consensus (e.g., "A global ice-age civilization left no tools but inspired all myths").  
  **Why:** Extraordinary claims require extraordinary evidence; pseudohistory multiplies complexities.  
  **Stop here if fail.**  

  #### **Step 7: Peer Context**  
  **Question:** Does the author engage with *current scholarship*? Are key critics addressed?  
  **Pass:** Engages mainstream literature, credits prior work, and rebuts top critics.  
  **Fail:** Dismisses entire fields ("All Egyptologists are wrong"), or ignores recent peer-reviewed work.  
  **Why:** Honest revisionism builds on/dismantles existing work; crankery ignores it.  
  **Stop here if fail.**  

  #### **Step 8: Editorial Judgment Gateway**  
  **Question:** If all prior steps pass, is this *worth publishing* despite risks?  
  **Consider:**  
  - **Impact:** Does it challenge dogma or just nitpick?  
  - **Tone:** Speculative ("Could X be true?") vs. dogmatic ("The truth is X!").  
  - **Audience:** Will lay readers grasp the evidence?  
  - **Reputation:** Does it align with your press’s brand (e.g., scholarly vs. sensational)?  
  **Hand back to editor:** No binary pass/fail. Your call based on values.  

  ---

  ### Testing the Procedure on Three Proposals

  #### **Proposal 1: Lost Pre-Ice-Age Civilization**  
  - **Thesis:** An advanced civilization existed pre-12,000 BCE, destroyed by cataclysm.  
  - **Run-through:**  
    1. **Step 1:** *Fail.* Assumes "mainstream archaeology suppresses truth."  
    2. **Step 2:** *Fail.* Unfalsifiable ("Their cities are under ice").  
    3. **Stop at Step 1 or 2.** **Verdict: Reject.**  
  - **Against instincts?** If your instinct is "this is exciting," the procedure overrules. Crankery.  

  #### **Proposal 2: Renaissance Fabrication of Ancient Chronology**  
  - **Thesis:** Conventional ancient timelines were invented by 15th-century scholars; real history is 1,000 years shorter.  
  - **Run-through:**  
    1. **Step 1:** *Pass.* No malice claimed; argues honest errors.  
    2. **Step 2:** *Pass.* Testable via carbon dating, astronomy.  
    3. **Step 3:** *Fail.* All evidence hangs on re-dating texts; no independent lines.  
    4. **Step 4:** *Fail.* Uses 19th-century translations; ignores primary inscriptions.  
    5. **Stop at Step 3 or 4.** **Verdict: Reject.**  
  - **Against instincts?** If you admire statistical rigor, Step 3 (independence) catches its fragility. Honest-but-wrong.  

  #### **Proposal 3: Celebrated Artifact is a Forgery**  
  - **Thesis:** A famous relic (e.g., the Nebra Sky Disk) is a modern fake.  
  - **Run-through:**  
    1. **Step 1:** *Pass.* No conspiracy; cites curatorial errors.  
    2. **Step 2:** *Pass.* "If patina matches 16th-century methods, I’m wrong."  
    3. **Step 3:** *Pass.* Metallurgy + iconography + provenance.  
    4. **Step 4:** *Pass.* Uses excavation reports and lab analyses.  
    5. **Step 5:** *Pass.* Details SEM microscopy and alloy ratios.  
    6. **Step 6:** *Pass.* Simpler than "ancient anomaly."  
    7. **Step 7:** *Pass.* Addresses counter-arguments from peer journals.  
    8. **Step 8:** **Editorial judgment.** Risk: High controversy. Reward: Legitimate debate if presented as "evidence-based critique."  
  - **Verdict:** Passes Steps 1–7; publish if aligns with your tolerance for revisionism.  
  - **Against instincts?** If your instinct is "too risky," the procedure forces you to confront values, not truth.  

  ---

  ### Key Insights from the Test  
  1. **Against Your Instincts:** Proposal 3 (forgery). Your instinct may be "too niche/combative," but the procedure validates its scholarly basis. You must decide if it’s *editorially* viable.  
  2. **Judgment Calls Dressed as Tests:**  
     - **Step 6 (Parsimony):** "Simpler" is subjective (e.g., is re-dating simpler than forgery?). Mitigate by requiring the thesis to resolve *more* anomalies than it creates.  
     - **Step 4 (Primary Sources):** Assessing "contextualization" is subjective. Mitigate by spot-checking 5 random citations for provenance.  
  3. **What It Cannot Settle:**  
     - **Fraud vs. Error:** The procedure flags *methodological* fraud (e.g., data manipulation) but not *motivational* fraud (e.g., a credentialed scholar lying for fame).  
     - **Speculation vs. Revisionism:** Step 8 handles this. A well-argued "Atlantis" theory (if it passed Steps 1–7) could be published as *speculation*, but the procedure won’t make that call.  
     - **Impact vs. Rigor:** A revolutionary thesis passing all steps might still be too incendiary for your press. Step 8 is your escape hatch.  

  ### Final Advice  
  - **When in doubt, external review:** For proposals clearing Step 7 but feeling risky, pay a grad student ($200) for a 48-hour "red team" review.  
  - **Track record:** Pseudohistory often recycles debunked claims. Google key thesis terms + "debunked."  
  - **Your role:** Steps 1–7 protect credibility; Step 8 is where you weigh credibility against intellectual provocation. Rejecting solid revisionism *is* a failure, but publishing crankery is worse. When Steps 1–7 pass, bet on rigor.
