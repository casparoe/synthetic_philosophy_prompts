prompt: |-
  A national conservation authority runs three instruments that all turn on the word function, and I want to know which theory of biological function the practice commits it to.

  First, a register of functionally extinct species: a species is listed once its population has fallen so low that it no longer performs its ecological role, even though some individuals survive. Second, a restoration programme: where a species is lost entirely, the authority may introduce a closely related living species to stand in for it, on the ground that the substitute occupies the same niche and drives the same processes; a site is certified as restored once those processes are measurably running again. Third, an invasive-species schedule: harm is defined as disruption of ecosystem function, with no reference to where the organism came from or how it arrived.

  Reconstruct the account of function this practice presupposes. The register looks etiological, since a listed species still possesses the traits it was selected for and merely lacks the role. The restoration programme looks role-based, since it treats function as whatever keeps the process running, whatever the lineage. Are the three instruments consistent, or does the practice rely on two incompatible accounts? If a single account can cover all three, what must it say about a proxy that performs the role more thoroughly than the extinct species ever did? If no single account can, say which instruments have to be rewritten, and how.

  Then separate what the practice strictly presupposes from what it merely fits comfortably with, and identify where it is underdetermined, so that a rival account would license exactly the same behaviour. Finish with the concrete consequences: what the authority would have to stop doing, or start doing, if it adopted the account you reject. Answer in roughly 1,000 words.
reasoning: |-
  Hmm, the user is asking about reconstructing the account of biological function that underlies a conservation authority's practices. They've described three specific instruments: a register for functionally extinct species, a restoration program using proxy species, and an invasive-species schedule based on ecosystem disruption.

  Looking at the register, it seems etiological - they're tracking when a species can no longer perform the ecological role it evolved for, even if individuals survive. The restoration program appears role-based, substituting species based on current ecosystem roles regardless of lineage. The invasive species policy defines harm purely by disruption to ecosystem processes, without considering origin.

  I need to analyze whether these instruments are consistent or if they rely on conflicting theories of function. The etiological view defines function by evolutionary history, while the causal role view defines it by current contributions. These are often seen as competing theories.

  For the restoration program, when they introduce a proxy that performs the role better than the original, this creates tension. Under etiological views, the proxy's superior performance doesn't give it "proper function" since it lacks the evolutionary history. Role-based views would accept it as functional regardless.

  The authority's practice seems to blend both approaches pragmatically. For functional extinction, they care about loss of evolved function; for restoration, they care about restoring processes; for invasives, they care about disruption. This suggests they're using a hybrid "selected role" account where ecological roles are shaped by evolutionary history but defined by current systemic contributions.

  Where underdetermination exists: All three policies would behave identically under either a pure causal role or selected role account when proxies match original performance. The differences only emerge with super-proxies or when considering evolutionary history.

  If they adopted a strict etiological view, they'd have to stop the restoration program entirely since proxies couldn't "count" as functional replacements. If they adopted pure causal role, they'd need to remove "functional extinction" from their register since current capacity would matter more than history.

  The authority seems to prioritize systemic resilience over historical fidelity, making their implicit theory closer to a modified selected role view. The functional extinction register serves as an early warning system, while restoration focuses on process recovery. Their invasive species policy is purely consequentialist.

  For super-proxies, the authority would likely accept them as functional, suggesting their core commitment is to ecosystem processes rather than historical authenticity. This shows their fundamental operational principle is maintaining ecosystem function defined by current causal roles, with historical considerations serving heuristic purposes.
answer: |-
  ## Reconstructing the Authority's Functional Foundations

  The national conservation authority's practices reveal a pragmatic, **ecosystem-focused account of function**, primarily grounded in a **Modified Selected Role (MSR)** theory. This theory integrates elements of both etiological and causal role accounts but prioritizes systemic stability and process continuity over strict evolutionary history. Here's the reconstruction and analysis:

  1.  **Consistency and the Core Account: Modified Selected Role (MSR)**
      *   **The Integrated View:** The three instruments *are* consistent under a single, flexible account: **Function is the causal contribution that a type of organism (or its traits) makes to the persistence and characteristic processes of the ecosystem it inhabits, where that contribution is typically the result of past evolutionary selection *and* is currently necessary or significant for maintaining systemic stability.** This is a Modified Selected Role (MSR) theory.
      *   **Functional Extinction Register (Etiological Element):** Listing occurs when a species' population falls below the threshold needed to perform its *historically established* ecological role. The emphasis is on the loss of a contribution that the lineage *evolved* to make within that specific system. The traits exist, but the *system-level effect* is gone. This leans etiological because the "role" referenced is defined by the species' evolutionary history within that ecosystem.
      *   **Restoration Programme (Causal Role Element):** Introducing a proxy focuses on restoring the *process* (e.g., seed dispersal, nutrient cycling, predator control). The substitute's function is defined solely by its current causal effect – occupying the niche and driving the process. Lineage is irrelevant; current systemic contribution is paramount. This strongly aligns with the causal role account (Cummins-functions).
      *   **Invasive-Species Schedule (Causal Consequence Focus):** Harm is defined purely by the *current disruption* of ecosystem processes. The origin, arrival method, or evolutionary history of the invader is explicitly discounted. Function here is entirely about the present causal structure and stability of the system. This is purely causal role/consequentialist.
      *   **Reconciling Apparent Conflict (MSR):** The MSR account bridges the apparent gap. The "role" in the Functional Extinction Register *is* the causal contribution the species was selected to make. The Restoration Programme seeks to reinstate *that specific causal contribution* (the process) using whatever means (proxy) effectively recreates it. The Invasive Schedule protects *that same set of processes* from disruption. The common thread is the maintenance of specific ecosystem processes/states deemed characteristic or desirable. The evolutionary history (etiology) provides the *definition* of the "characteristic" role/process for natives, but the *value* of that role/process is derived from its current systemic contribution to stability. For invasives and proxies, lacking the history, the *current causal impact* on these system-level processes is the sole functional determinant.
      *   **The Super-Proxy Challenge:** What if the proxy performs the role *better* than the extinct species? Under the strict MSR account described:
          *   The proxy's function is defined by its *current* causal role in driving the desired process.
          *   If it drives the process more effectively (e.g., disperses seeds further, controls prey more efficiently), it *is* functionally fulfilling the role, potentially *better* than the original.
          *   The authority would likely certify the site as restored (process running again, even better). The practice prioritizes the outcome (process running) over the historical actor or the exact level of performance.
          *   However, the *reason* the specific process is targeted for restoration stems from its *historical* significance defined by the original species' evolved role. The super-proxy is performing a function defined by history but evaluated by current causal efficacy.

  2.  **Presupposed vs. Comfortable Fit vs. Underdetermined**
      *   **Strictly Presupposed:**
          *   Function is fundamentally about causal contribution to a larger system (ecosystem processes).
          *   Ecosystem stability/persistence is a core value worth conserving.
          *   Disruption of characteristic processes constitutes harm.
          *   For native species, their "proper" ecological function is linked to their evolutionary history within that system (defining the characteristic role).
          *   The causal role an entity *can* play (like a proxy) is separable from the evolutionary history *why* a similar role exists for natives.
      *   **Comfortable Fit (But Not Strictly Required):**
          *   **Selected Effect (SE) Theory:** Fits the functional extinction register well (loss of selected effect) and provides a rationale for *why* the original process is targeted for restoration. However, the authority *doesn't* require the proxy itself to have an SE to be functional; its function is purely causal role. SE explains the *target* but not the *mechanism* of restoration.
          *   **Pure Causal Role (CR) Theory:** Fits the restoration programme and invasive schedule perfectly. However, it struggles to explain why the *loss* of a species unable to perform its CR *now* is significant if a proxy can be found, and why the *specific* historical process is the target rather than any new stable state. CR explains the *mechanism* of function attribution for proxies/invasives but not the *value* placed on the specific historical function.
      *   **Underdetermined:**
          *   **The Source of Normativity:** Why are *these specific* historical processes valuable? MSR presupposes ecosystem stability as the good, but is stability inherently good, or good because it preserves biodiversity, services, or intrinsic value? The practice is silent.
          *   **Defining "Characteristic" Process:** How much deviation from the historical baseline is acceptable before the process is no longer "characteristic"? The practice relies on measurable parameters but doesn't specify the threshold.
          *   **The Super-Proxy's Status:** While the practice *would* accept it functionally, the MSR account doesn't dictate *how* the authority should *evaluate* a super-proxy ethically (is it "better" or just different? Does it risk new imbalances?).
          *   **Alternative Stable States:** The practice presupposes restoring the *historical* process is the goal. A pure CR theory could justify accepting a *new*, equally stable state caused by an invader or proxy as equally functional, but the authority's practice (restoring the *original* process) rejects this.

  3.  **Consequences of Adopting a Rival Account**
      *   **Adopting Strict Selected Effect (SE) Theory:**
          *   **Stop:** The Restoration Programme. A proxy species, lacking the evolutionary history of being selected *for* that specific role in that specific ecosystem, cannot have the *proper function* of the extinct species. Introducing it would be introducing an organism without the "right" function, potentially just another non-functional or even disruptive entity. Certification based on process restoration would be nonsensical; function is about history, not current effect.
          *   **Change:** The Functional Extinction Register. Listing would focus solely on whether the species can still produce the *selected effect* (its proper function), regardless of population size, if a tiny population still somehow performed the role (e.g., a single keystone individual). Conversely, a large population unable to perform its SE due to environmental change might need listing. The Invasive Schedule would need revision. Harm couldn't be defined purely by disruption; it would require showing the invader is interfering with the *proper functions* of native species (e.g., outcompeting them for resources they were selected to use). An invader disrupting a process but not directly interfering with a native species' SE might not be considered harmful.
          *   **Start:** Justifying interventions purely based on preserving the capacity for species to perform their evolved proper functions, potentially with less emphasis on overall ecosystem process metrics if they aren't the direct result of SEs.
      *   **Adopting Strict Causal Role (CR) Theory:**
          *   **Stop:** Maintaining the Functional Extinction Register in its current form. If function is purely current causal contribution, a species with very low population might still be performing its function minimally, or its function might be irrelevant if another species takes over the role. The concept of "functional extinction" loses its specific meaning tied to historical role loss. Listing would only make sense if the species demonstrably contributes *nothing* causally *now*.
          *   **Change:** The Restoration Programme's justification. The goal shifts from restoring a *specific historical* process to simply establishing *some* stable, functional process state. A wider range of proxies, or even engineered solutions, could be acceptable as long as they create a stable system with desired causal properties. The *historical fidelity* aspect disappears. The Invasive Schedule remains largely the same, as harm is defined by disruption (though "disruption" might be reinterpreted relative to a desired state, not necessarily the historical one).
          *   **Start:** Potentially accepting "novel ecosystems". If an invasive species or proxy creates a new, stable, and desirable (e.g., biodiverse, resilient) set of causal processes, it could be considered functional and beneficial, not harmful. Management focus shifts entirely to desired system states and causal structures, irrespective of historical actors or pathways.

  **Conclusion:**

  The authority's practice is coherent under a **Modified Selected Role theory of function**. This theory defines function primarily by current causal contribution to ecosystem processes but uses evolutionary history to identify which processes are characteristic and valuable to maintain. While elements fit comfortably with pure Selected Effect or Causal Role theories, neither alone can fully justify all three instruments without significant revision. The authority prioritizes the *outcome* of stable, functioning ecosystems, using historical roles as the benchmark for what constitutes "functioning" in a given context. The super-proxy scenario underscores this: the practice values the *process* over the historical *performer*. Adopting a rival pure theory would force radical changes: abandoning restoration under SE, or abandoning the concept of historical functional loss under CR. The authority's pragmatism reveals a theory where function serves ecosystem resilience, with history providing the blueprint but not the exclusive means.
