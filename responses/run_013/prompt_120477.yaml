answer: |-
  ## Joint Statement: Paracomplete and Paraconsistent Perspectives on Semantic Paradoxes

  ### I. Agreed Claims (Paracomplete & Paraconsistent Consensus)

  1.  **The Paradoxical Derivation:** The derivation of a contradiction from the Liar sentence ("This sentence is false") or similar paradoxical sentences (like the Truth-Teller or Curry), assuming classical logic and the unrestricted T-schema (Tr(<φ>) ↔ φ), is formally valid *within the framework of classical logic*. The problem lies not in a *mistake* within that derivation, but in the untenability of the *conjunction* of its assumptions for the truth predicate.
  2.  **Truth's Expressive Role:** The truth predicate is indispensable as a device for expressing generalizations (e.g., "Everything the oracle said is true") and for forming semantic ascent/descent (enabling talk *about* the language *within* the language). A central goal of a theory of truth is to preserve this expressive function.
  3.  **The Core Equivalence Principle (T-Schema):** The equivalence Tr(<φ>) ↔ φ holds for a substantial class of sentences – the "grounded" or "paradox-free" sentences – and capturing this equivalence is a primary desideratum for any adequate theory of truth. This principle underpins truth's expressive role.
  4.  **Necessity of Revision:** Any adequate solution to the semantic paradoxes requires revising *some* aspect of classical logic or classical semantics when dealing with the truth predicate and semantically unstable sentences. Adherence to *all* classical principles in the presence of such a predicate leads to triviality (everything being provable).
  5.  **Preserving Core Reasoning:** Both approaches refuse to abandon classical reasoning for the vast majority of discourse – arithmetic, physics, everyday assertions about the world, etc. Any revision must be localizable to contexts involving semantic instability. Classical logic remains the default for "safe" domains.
  6.  **Non-Triviality:** An adequate theory must prevent triviality (the derivability of *every* sentence) arising from the paradoxes. It must provide a consistent (paracomplete) or non-trivial (paraconsistent) account.
  7.  **No Perfect Closure:** An adequate theory need not (and likely *cannot*) provide a perfectly closed, revenge-immune truth predicate expressible *within the same language* that validates the full T-schema for every sentence of that language. The possibility of "revenge paradoxes" targeting the theory's own expressive resources is recognized, though their significance and manageability are disputed.

  ### II. Disagreements Table

  | Question                                                                 | Paracomplete Position                                                                 | Paraconsistent Position                                                                 |
  | :----------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------- |
  | **1. Truth-Value Status of the Liar sentence (L: "L is false")?**        | L is neither true nor false (a truth-value *gap*).                                   | L is both true and false (a truth-value *glut*).                                        |
  | **2. Does negation (¬) in the object language function exclusively?**    | Yes. ¬φ is true iff φ is false; ¬φ is false iff φ is true. Gaps require this.        | No. ¬φ being true is compatible with φ also being true (gluts require this).            |
  | **3. Can a "just true" / "determinately true" predicate (DTr) be added without generating revenge?** | Yes. DTr(<φ>) entails Tr(<φ>) but not vice-versa. L is not DTr. A strengthened liar ("I am not DTr") is non-paradoxical (gappy). | No. Any predicate satisfying "If φ is true and not false, then DTr(<φ>)" will generate a revenge paradox ("I am not DTr") that is both DTr and not DTr. |
  | **4. Must the conditional (→) used with truth support full modus ponens / detachment?** | Ideally yes. The theory aims to preserve a strong conditional (like the K3 or LP material conditional, or a stronger one) supporting detachment. Curry paradox is blocked by truth-value gaps for conditionals. | Not necessarily. Full detachment (A, A→B ⊢ B) may be restricted to avoid Curry triviality. A relevant conditional or a non-detachable material conditional (in LP) is often used. Truth-value gluts block Curry via explosion containment. |
  | **5. How is classical reasoning recovered for "safe" sentences?**        | By proving that for sentences lacking semantic vocabulary or being "grounded", truth-values behave classically (bivalent), and classical logic holds. | By proving that for consistent ("classical") sentences (not glutty), contradictions do not arise, and classical inferences hold. |
  | **6. Is truth fundamentally a property or a device?**                    | Truth is a genuine property, albeit one that some sentences lack. The gap reflects a failure to possess the property. | Truth is primarily an indispensable expressive device; its "glutty" behavior reflects the inconsistent nature of semantic concepts under their intended interpretation. |

  ### III. Cruxes: Key Sub-Questions

  1.  **Glut vs. Gap:** *Which diagnosis is correct for the Liar? Does semantic instability manifest as overdetermination (glut) or underdetermination (gap)?*
  2.  **Exclusive Negation:** *Can the object language negation operator consistently obey the exclusivity principle (¬φ true only if φ false, and vice versa) across the entire language, including semantic contexts?*
  3.  **Stable "Just True" / Revenge Immunity:** *Can a hierarchy or distinction (like "just true"/"determinately true") be coherently added to block revenge without itself succumbing to a new paradox?*
  4.  **Conditional Strength & Curry:** *How strong can the conditional employed with the truth predicate be? Specifically, can it satisfy both the T-schema and unrestricted modus ponens without trivialization by Curry?*
  5.  **Scope of Classical Recapture:** *How precisely can the domain of "safe" sentences be characterized, and how robustly is classical logic recaptured within that domain?*
  6.  **Nature of Truth:** *Does the paradox reveal truth's nature (a non-universal property vs. an inconsistent concept) or merely constraints on its formalization?*
  7.  **Expressive Limitations:** *What limitations on expressive power are acceptable? Is the inability to express "just true" internally a fatal flaw or a necessary consequence?*

  ### IV. Cases: Analysis & Predictions

  1.  **Strengthened Liar (SL: "SL is not true" or "SL is not determinately true"):**
      *   **Paracomplete:** SL is neither true nor false (gappy). Verdict stable. [*Prediction:* Adding DTr blocks revenge; SL is non-paradoxical.]
      *   **Paraconsistent:** SL is both true and false (glutty). Verdict unstable; "SL is not true" being true forces it to be false, and vice-versa. [*Prediction:* Any "just true" predicate DTr applied to SL will generate a true-and-false sentence ("SL is not DTr"), demonstrating revenge.]
      *   **Shared Bearing:** The stability/instability of verdicts for SL (or its DTr-variant) tests the revenge-immunity claims regarding gap/glut diagnoses and DTr-predicates.

  2.  **Curry Sentence (C: "If C is true, then ⊥" where ⊥ is absurdity/falsum):**
      *   **Paracomplete:** C lacks a truth-value (gappy). Thus, C → ⊥ also lacks a truth-value. Modus ponens cannot be applied vacuously. Triviality blocked. [*Prediction:* A strong conditional can be used without triviality, as the antecedent C lacks truth-value.]
      *   **Paraconsistent:** C is both true and false (glutty). However, the inference C, C→⊥ ⊢ ⊥ (modus ponens) is *invalid* in the paraconsistent logic (e.g., LP material conditional doesn't detach, relevant conditionals require connection). Triviality blocked by restricting detachment, not by gaps. [*Prediction:* Attempting to force full detachment leads to triviality; a restricted conditional is necessary.]
      *   **Shared Bearing:** Demonstrates how each approach blocks trivialization: gaps vs. gluts + restricted detachment. Tests the feasibility of a strong, detachable conditional alongside the truth predicate.

  3.  **Yablo Sequence (Infinite sequence: S₁: ∀k>1 ¬Tr(<Sₖ>), S₂: ∀k>2 ¬Tr(<Sₖ>), ...):**
      *   **Paracomplete:** All Sₙ are neither true nor false (gappy). Verdict stable. [*Prediction:* Fixed-point constructions show consistent gappy assignments.]
      *   **Paraconsistent:** All Sₙ are both true and false (glutty). Verdict stable. [*Prediction:* Suitable paraconsistent fixed-point models exist.]
      *   **Shared Bearing:** Shows that both approaches can handle infinitely generated paradoxicality consistently/non-trivially. Highlights that the core disagreement (gap vs. glut) persists even in complex, non-self-referential cases. [*Note:* Neutrality contested here - some argue Yablo *is* circular, but both approaches model it as described.]

  ### V. Closing: Verbal Disagreements, Falsifiability, and Moving Forward

  Significant aspects of this dispute may be verbal or perspectival. The core terms "true" and "false" themselves carry different theoretical loads: the paracomplete theorist understands them against a backdrop where exclusivity is normative but gappy, while the paraconsistent theorist understands them as inherently permitting overlap. Disagreements about what "negation" *must* do, or whether truth is fundamentally a "property," often hinge on these prior theoretical commitments. [*Note:* The claim of "verbal" disagreement is itself contested; both sides believe their core semantic claims are substantive.]

  *   **Paracomplete Falsifiability:** Evidence against paracompletism would be: (1) A demonstration that a genuinely exclusive negation operator leads to unavoidable inconsistency *even without* truth (undermining the gap diagnosis's coherence), (2) A conclusive argument that *no* stable, expressively adequate "determinately true" operator can be defined, rendering the approach vulnerable to insoluble revenge.
  *   **Paraconsistent Falsifiability:** Evidence against paraconsistentism would be: (1) A demonstration that gluts unavoidably "infect" domains intended to be classical (e.g., arithmetic), violating the recapture requirement, (2) A proof that no suitable (especially relevant) conditional can satisfy both essential expressive needs *and* robustly recover classical reasoning where needed.
  *   **Potential Movers:** Both sides agree that resolving the **Stable "Just True"** crux would be highly significant. If a paracomplete theory could demonstrably handle a hierarchy of determinacy operators without revenge *to the satisfaction of neutral observers*, it would challenge the paraconsistent need for gluts. Conversely, if the paraconsistentist could demonstrate that *any* gap-based approach *inevitably* requires expressive resources leading to revenge (e.g., via formal limitations on definability), it would strongly favor gluts. Progress on formally characterizing the **Scope of Classical Recapture** with maximal precision and robustness could also shift burdens of proof. Ultimately, the debate may hinge on which package offers the most elegant, powerful, and paradox-resistant account of our semantic concepts and reasoning practices.
