prompt: |-
  I'm a postdoc in a cognitive science department that has just won a small internal grant to host one visiting fellow for a year on foundational rather than empirical work -- no imaging, no modeling, just conceptual and formal scholarship. The theme we've settled on is computationalism: the thesis that the brain is, in some nontrivial sense, a computer, and that cognition just is computation of the right kind. As we draft the call for applicants, my colleagues and I keep gravitating toward the same handful of set pieces -- Searle's Chinese room, multiple realizability, the question of whether neurons implement a Turing machine -- and I have a nagging sense that we're circling the most familiar landmarks rather than the ones that actually bear weight. I'd like you to help me decide where to aim the fellowship, because a year is a real constraint and I don't want it spent re-litigating what everyone already has opinions about.

  Give me a defended agenda: which open questions or lines of work in computationalism matter most, in what order, and why. I care much less about the list than about the reasoning behind it. For each candidate, explain what makes it upstream of the others -- how many adjacent disputes would be settled, dissolved, or reframed by an answer -- how tractable it is for someone with a background in logic and the philosophy of mind but no lab access and no appetite for empirical heavy lifting, and whether it is neglected relative to how much it matters. Then tell me what would move a question up or down this ranking over the next couple of years, and be explicit about the criteria you're applying and the trade-offs among them. I'm particularly interested in whether the highest-value work lies in the metaphysics of computation itself (what it is for a physical system to implement a computation at all, and whether the standard triviality results about arbitrary physical systems realizing arbitrary computations can be answered rather than merely dodged), in the question of what kind of computation the brain is doing (classical, connectionist, dynamical, or something with no clean analogy), or in whether the computational framing earns its explanatory keep at all when it comes to consciousness and intentionality. If you conclude that the standard debates I named really are where the value is, say so and defend it -- don't manufacture novelty for its own sake. Assume the fellow can read technical material but is not a specialist in any single subfield, and that what you write will become a memo I circulate to the search committee.
reasoning: |-
  Okay, the user is a postdoc in cognitive science organizing a visiting fellowship focused on computationalism. They're stuck on familiar debates and want fresh, high-impact directions. Let me unpack their request.

  First, their core frustration: They feel current discussions (Chinese Room, multiple realizability, Turing implementation) are over-recycled without real progress. They need an agenda that's both foundational and forward-looking. The fellowship has constraints—conceptual work only, no empirical heavy lifting—so the focus must be purely theoretical.

  Key priorities from their query:
  - Upstream impact: Which questions, if answered, would resolve multiple downstream disputes?
  - Tractability: Feasible for someone with logic/philosophy of mind background but no lab access.
  - Neglect-to-importance ratio: Under-explored yet pivotal issues.
  - Meta-focus: They specifically flagged three areas: metaphysics of computation (implementation problem), computational formalism (what kind?), and explanatory gap (consciousness/intentionality).

  I notice unstated tensions:
  1. They want novelty but fear forcing it. Must justify if classic debates remain crucial.
  2. The "year-long" constraint means the topic can't be too sprawling—needs clear boundaries.
  3. Their committee likely has strong opinions; the memo must preempt skepticism about deviating from standards.

  Hmm... the triviality problem feels most upstream. If we can't define when a physical system *genuinely* computes (vs. just being interpretable as computing), then debates about *what* the brain computes rest on shaky ground. Chalmers' Combinatorial State Automata (CSA) is promising here—it's rigorous but underexplored in cognitive contexts. 

  For formalism, I'm torn. Classical vs. connectionist is tired, but *why* it matters ties back to implementation: If connectionism avoids triviality better, that reshapes the field. Dynamical systems feel adjacent but risk diffusing focus. 

  Consciousness? Tempting but dangerous. Computationalism struggles hardest here, but progress seems unlikely in a year. Better to tackle implementation first—it's the keystone. 

  *Checks neglect-to-impact*: Triviality has solid foundations (Putnam, Searle critiques) but recent work like Dewhurst's "computational modesty" offers new angles. Meanwhile, formalism debates often ignore implementation constraints. 

  Trade-offs: 
  - Metaphysics (implementation) is high-risk/high-reward; if cracked, it reorders the field. 
  - Formalism is medium-reward but more tractable. 
  - Consciousness is high-reward but intractable. 

  Final ranking: Implementation > Formalism (framed through implementation) > Consciousness. Why? Because without a solution to triviality, formalism debates are just shadowboxing. 

  *Moves up/down*: If new triviality responses emerge (e.g., from physics or info theory), implementation stays top. If empirical work forces formalism choices (e.g., neural data rules out Turing models), that climbs. 

  ...I think this meets their need: rigorous prioritization that avoids novelty for its sake but shifts focus to the root problem. The memo should stress that we're not abandoning classics—we're digging under them.
answer: |-
  Here is a defended agenda prioritizing open questions in computationalism for a 1-year conceptual fellowship, structured by upstream impact, tractability, and neglect. The core argument: **The metaphysics of computation (implementation) is the keystone—it determines the legitimacy and scope of all downstream debates.** Without progress here, formalism debates lack grounding, and consciousness/intentionality critiques retain their bite.

  ### Ranking & Rationale  
  **1. The Implementation Problem: What Shields Computationalism from Triviality?**  
     - **Why Upstream?** Resolving this dissolves Searle-style objections, reframes multiple realizability, and dictates which formalisms are physically plausible. If *any* system computes *any* function (Putnam-Searle triviality), computationalism explains nothing. A defensible criterion for "genuine implementation" is the foundation on which other debates depend.  
     - **Tractability:** Ideal for conceptual/logical work. Requires analyzing existing frameworks (e.g., Chalmers' combinatorial state automata, Piccinini’s mechanistic account) and proposing refinements that avoid arbitrariness. No lab needed—focus is on necessary/sufficient conditions for implementation in physical systems.  
     - **Neglect-to-Importance Ratio:** High. Despite decades of discussion, triviality objections are often *dismissed* (e.g., via "causal topology" appeals) rather than *solved*. Recent work (e.g., Dewhurst’s "computational modesty") suggests renewed interest, but a unified account remains elusive.  
     - **Key Question:** *Can we specify non-arbitrary constraints on implementation that exclude trivial mappings while accommodating biological realism?*  

  **2. Computational Formalism: What Constraints Does Implementation Impose on Brain Computation?**  
     - **Why Next?** Once implementation is non-trivial, *which* formalism applies matters. But this is downstream: the viability of classical/connectionist/dynamic frameworks depends on what implementation allows. For example:  
       - If implementation requires modularity and digital states, connectionism faces challenges.  
       - If "dynamical" systems compute only in degenerate cases (per triviality), their explanatory role shrinks.  
     - **Tractability:** Conceptual analysis of formalisms (e.g., Turing machines, recurrent nets, dynamical systems theory) in light of implementation constraints. Explores *whether* the brain’s physics permits certain computations (e.g., continuous vs. discrete).  
     - **Neglect:** Moderate. Formalism debates are active but often ignore implementation. Focusing on *implementation-derived constraints* (e.g., "Does neural noise preclude digital computation?") is underexplored.  
     - **Key Question:** *Given a non-trivial implementation criterion, which computational architectures are biologically plausible, and what cognitive phenomena do they license?*  

  **3. Explanatory Gap: Does Computation Ground Intentionality/Consciousness?**  
     - **Why Last?** Even with robust implementation and formalism, computationalism may still fail to explain phenomenology or meaning. But this debate *presupposes* the first two: if implementation is trivial or formalisms arbitrary, critiques like Chinese Room gain force. Progress here is contingent on upstream advances.  
     - **Tractability:** High for conceptual work (e.g., can computational functions *constitute* intentional states?). However, consciousness adds hard metaphysical hurdles.  
     - **Neglect:** Low. Heavily debated (e.g., Fodor vs. enactivists), though often recycled. New angles emerge only if upstream questions shift the landscape.  
     - **Key Question:** *If cognition is non-trivially computational, does this suffice for intentionality/consciousness, or must computation be "embodied" or "situated"?*  

  ### Why Not the Classics?
  - **Chinese Room/Multiple Realizability:** These are *symptoms* of the implementation problem. Solving triviality defangs Searle; clarifying implementation constraints shows *which* systems can realize cognition.  
  - **"Do neurons compute?"** Reducible to implementation: if criteria are met, they do; if not, debates about Turing machines are moot.  

  ### Criteria & Trade-offs  
  - **Impact Priority:**  
    - *Upstreamness*: How many downstream disputes depend on this? Implementation anchors all others.  
    - *Field Reorganization Potential*: Could reframe computationalism’s scope (e.g., if implementation requires specific physics, it limits multiple realizability).  
  - **Tractability:** Feasibility for a logician/philosopher in 1 year. Implementation is "hard but bounded"; formalism is more open-ended but scaffolded by #1.  
  - **Neglect:** Does the topic receive less attention than its importance warrants? Implementation is chronically undertheorized relative to its centrality.  

  ### What Shifts the Ranking?  
  - **Implementation Moves Down** if a consensus solution emerges (e.g., a widely adopted non-arbitrary criterion gains traction).  
  - **Formalism Moves Up** if empirical work forces the issue (e.g., new data on neural coding that rules out classical computation).  
  - **Consciousness Moves Up** if implementation/formalism resolve, exposing the explanatory gap as the last standing obstacle.  

  ### Recommendation: Target Implementation
  **Focus:** *Develop and defend a non-trivial implementation criterion that reconciles abstract computation with biological constraints.*  
  **Why:**  
  - It is the linchpin: success here makes formalism debates substantive and weakens anti-computationalist critiques.  
  - Fellows can leverage logic (e.g., formalizing causal structures) and philosophy of mind (e.g., multiple realizability limits).  
  - High neglectedness—offers a path beyond rehearsed arguments.  

  **Concrete deliverables:** A monograph or series of papers proposing a testable implementation framework, assessing its implications for computationalism’s scope, and reframing legacy objections (Searle, Putnam) in its terms.  

  *This agenda assumes that without a solution to triviality, computationalism remains vulnerable. If the committee disagrees, formalism becomes the default—but implementation must still be addressed to give formalism weight.*  

  ---  
  **Memo-ready summary:** The fellowship should prioritize the **implementation problem**—defining when physical systems genuinely compute—as it is foundational, tractable for conceptual work, and underexplored relative to its importance. Success here would transform debates about formalism and intentionality. Formalism and consciousness remain vital but are secondary until implementation is secured.
