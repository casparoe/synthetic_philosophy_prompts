prompt: |-
  I'm in a Chinese philosphy class this term and we just covered the School of Names, and I've been chewing on this popular summary of the White Horse Dialogue that I read somewhere — I think it was a blog post, or maybe an excerpt from one of those trade books that try to make ancient Chinese thought "accessible." I want to know how much of it I should actually beleive before I repeat it in a paper. Here's the gist of what it says: Gongsun Long was a member of the ancient Chinese "School of Names," basically a crew of sophists who got off on paradoxes. In his White Horse Dialogue he argues that a white horse is not a horse, and his reasoning goes that the word "horse" names a shape while the word "white" names a color, and since what names a color isn't what names a shape, a white horse — which gets named by both — can't be the same thing as a horse. The piece then wraps up by saying this is essentially a cheap trick, since obviously a white horse is a horse, and that it's a fine illustration of why Chinese philosophy never really developed logic — these guys were more into wordplay than rigorous argument, which is supposedly why the Confucians and the Mohists just brushed them off.

  Something about the whole thing feels off to me, especially that last bit, but I can't tell where the line is between a legitimate point and an overstatement, and honestly I'm not sure how much of the summary is just the blogger's own spin versus what's actually in the text. Could you go through it piece by piece and tell me what a careful historian of Chinese philosophy would accept, what they'd wince at, and what's flat-out wrong? I'd especially like to know whether the shape/color distinction is really doing the work inside the dialogue or whether the popularizer swapped in his own explanation, and whether the argument is as trivial as he makes it sound. And on the "just sophists, and that's why Chinese thought lacked logic" line — is that a fair way to describe the School of Names, or is there a more accurate way to say what they were up to? Please write your answer in American English.
