prompt: |-
  I teach a ninety-minute epistemology seminar to twelve graduate students, and the session is on Aumann's agreement theorem. All of them can state the result — that agents who share a prior cannot agree to disagree once their credences are common knowledge — and I am fairly sure that for most of them it is a sentence they have memorized rather than a constraint they have felt. What I want from you is a session in which they run into the constraint themselves, while they are busy doing something else, before I name it.

  I have the bones of a setup and I want you to build the session on it, though you should tell me if the bones are wrong. A fair coin will be flipped out of sight. Each student is privately shown a peek at the outcome, produced by a source that is right two times in three and that is independent across students; a student whose peek says heads therefore holds a credence of two-thirds that the coin is heads, and one whose peek says tails holds one-third. Each knows the accuracy of the source, and knows that the others know it. Nobody sees anyone else's peek. I then want to post even money and let them trade the heads side against the tails side, peer to peer, with a payoff scheme that uses no real money but gives a student with a two-thirds credence a genuine reason to want the bet and a student with a one-third credence a genuine reason to take the other side. My expectation is that most opposed pairs will trade, cheerfully and with conviction.

  The floor should then fall out from under them. Once a pair reveals its two peeks, the posterior given both is one-half exactly — the two edges cancel — so the bet they were so pleased with was fair all along, and the willingness of a counterparty to take the other side was itself information they had been ignoring. I want that arithmetic to be done by the students, not announced by me. Then I want a second act: run the market again with the peeks public, and let them discover that nobody will trade. Then a third act in which they are invited to try to sustain a disagreement anyway, once everything is common knowledge, and to notice what they must assume about the other person — that he is not reasoning correctly, or that he holds different priors — in order to hold their ground.

  One thing you must solve rather than paper over. Only an opposed pair cancels to one-half. Across the whole room the peeks will usually not balance, so if I reveal every peek at once the room's aggregate posterior will sit somewhere other than one-half, and the clean pairwise cancellation will be swallowed by a messier number. Decide how to stage the reveals — pair by pair and then the room, or some other order — so that the cancellation lands cleanly for the pair while the room still ends in agreement, and say why your ordering works.

  Please give me the whole thing as a runnable session: the rules, the materials, how the peeks are physically delivered, the sequence and timing across the ninety minutes, the betting and payoff scheme, and how the reveal is staged. Then the debrief, mapping each beat of the session onto the parts of the theorem — the common prior, common knowledge, and the fact that it is the credences' being common knowledge that does the work — and tell me which part of the theorem the session genuinely makes them feel and which part it merely lets me assert.

  Be honest about what will predictably go wrong the first time — the students who refuse to gamble, the pairs whose peeks happen to agree, the one who sees the cancellation coming and spoils it, the ones who cannot do the arithmetic — and how I should handle each. And tell me what the session cannot reproduce: I am especially worried that the setup builds the common prior in by construction, so they will feel the cancellation without ever feeling why the shared prior is load-bearing, and I want your advice on that gap.

  Finally, give me one variant in which a participant has no peek at all and is willing to bet anyway for reasons that have nothing to do with information, and tell me what that variant teaches that the main session does not.

  Write the whole answer as continuous prose, with no headings, bullet points, bold text, or tables — the way you would in a long letter to a colleague.
reasoning: |-
  Okay, let me think through how to design this epistemology seminar on Aumann's agreement theorem. The professor wants students to experience the theorem's constraint firsthand rather than just memorizing it. The core setup involves a hidden coin flip and private peeks with 2/3 accuracy, leading to trading where pairs discover their opposing peeks cancel to 50%.

  First, I need to ensure the physical setup works smoothly. Index cards for peeks seem practical - heads/tails marked with accuracy indicators. For betting, chips representing probabilistic confidence could work, with a scoring system that makes trading rational based on credences. The payoff scheme must incentivize both high-credence and low-credence holders to trade.

  The sequencing is crucial. Stage one: private peeks and peer trading where most opposed pairs should happily trade. Stage two: reveal peeks within pairs to show posterior becomes 50%, creating the "floor falling out" moment. Stage three: public peeks make trading disappear. Stage four: challenge them to disagree with common knowledge.

  For the cancellation problem, I'll suggest revealing pairs sequentially: first each pair sees their own peeks cancel, then aggregate all peeks to show the room converges. This maintains the clean pairwise moment while still achieving overall agreement. 

  Anticipating problems: some students may refuse to bet - I'll advise emphasizing it's about probability, not risk attitude. When peeks agree, pairs won't trade - that's actually good for demonstrating information asymmetry. For math struggles, prepare a simple calculation aid. The "spoiler" who predicts cancellation might need redirecting to focus on why others didn't see it.

  The biggest gap is making the common prior feel necessary. During debrief, I'll stress how the cancellation depends on shared understanding of the accuracy rate. For the variant with no-peek participants, that can highlight how common knowledge differs from mere public information.

  The debrief should connect each stage: initial trades show pre-common-knowledge state, pairwise revelation demonstrates how common knowledge eliminates disagreement, public peeks show full agreement, and the disagreement challenge exposes what's required to sustain difference (questioning rationality or priors).

  Timing-wise: 15 min setup and peek distribution, 20 min first trading, 15 min pairwise reveal and calculation, 10 min public trading round, 15 min disagreement challenge, 15 min debrief. The payoff system should use chips with clear scoring - perhaps quadratic scoring to make probabilistic confidence tangible.

  What this session makes them feel: the visceral shock when common knowledge collapses their disagreement. What it can't fully reproduce: why shared priors are essential. To address that, the debrief should contrast with hypotheticals where students imagine different prior beliefs about the peek accuracy.
answer: |-
  Here is the session as I would run it, step by step, designed to make Aumann's constraint felt in the bones before it is named. The core insight is that common knowledge of credences forces agreement because it compels all parties to incorporate each other's evidence into their own reasoning, under a shared prior. Your setup is sound, but the reveal sequence needs careful choreography to deliver both the pairwise shock and the room-wide agreement without contradiction. I'll address the common prior concern head-on in the debrief plan and variant.

  **Materials & Setup (10 minutes)**
  You'll need: A fair coin. A way to flip it privately (e.g., behind a screen, in another room). Thirteen opaque envelopes (one per student plus one spare). Twelve index cards prepared as follows: For the "Heads" deck: 8 cards with "HEADS (Accuracy: 2/3)" and 4 cards with "TAILS (Error: 1/3)". For the "Tails" deck: 8 cards with "TAILS (Accuracy: 2/3)" and 4 cards with "HEADS (Error: 1/3)". A whiteboard or projector. Poker chips (or tally sheets) for betting - around 20 per student. A simple scoring rule: Each chip bet costs the bettor 1 point. If the bet wins, they gain 3 points. If it loses, they gain 0. (Net: Win = +2 pts, Lose = -1 pt). This makes a bet rational for credence >1/3 and desirable for credence >1/2. Crucially, explain that points translate to a tangible (but small) seminar participation bonus or simply "winning" pride. Emphasize this is about expected value based on their information.

  Flip the coin privately. Based on the outcome (say, Heads), shuffle the corresponding "Heads" deck (8 Heads cards, 4 Tails cards). Place one card into each of twelve envelopes, seal them, and distribute one envelope randomly to each student. Stress: *Everyone knows the process: a fair coin flip, then a peek generated by a source that is right 2/3 of the time, independently for each student. Everyone knows that everyone else knows this, and that everyone received such a peek. No one sees anyone else's peek.* Give students a moment to open their envelopes privately and calculate their initial credence (2/3 if peek matches the actual coin, 1/3 if not).

  **Act 1: The Confident Market (20 minutes)**
  Announce: "You each have information about the coin. I'm offering even-money bets: Betting 'Heads' wins if the coin is Heads, loses if Tails. Betting 'Tails' wins if the coin is Tails, loses if Heads. You can bet peer-to-peer. Find a partner, negotiate the size of the bet (how many chips), and the side each of you takes. Record your bets privately. You have 15 minutes to make as many bets as you like."

  *   **Predictable Events & Handling:**
      *   *Opposed Pairs Trading Happily:* Most students with a "Heads" peek (credence 2/3) will eagerly seek someone to bet Heads against. Students with a "Tails" peek (credence 1/3) will be keen to find someone betting Heads so they can take the Tails side (since credence 1/3 < 1/2, the EV of betting Tails is positive: (1/3)*3 + (2/3)*0 - 1 = 1 - 1 = 0). They *should* trade cheerfully and with conviction, each believing they have an edge. This is the target outcome. Encourage this energy.
      *   *Refusers:* Some might be risk-averse despite the EV. Gently remind them the scoring makes the bet rational based on probability alone. If they persist, let them abstain; their inactivity highlights the others' confidence.
      *   *Agreeing Pairs:* Students with the *same* peek (both Heads peeks or both Tails peeks) will *not* find a trade rational. A student with a Heads peek (credence 2/3) won't accept the Tails side (EV negative: (1/3)*3 + (2/3)*0 - 1 = -1). This is fine. It demonstrates that trade only happens when information *differs*.
      *   *The Spoiler:* One student might intuit the cancellation. If they voice it broadly, it ruins the moment. If they whisper it or seem hesitant, note it privately. During the reveal, ask them *why* others didn't see it coming, emphasizing the isolation of private information. If they loudly spoil, acknowledge it briefly: "Interesting hypothesis, let's test it with the data we have."

  **Act 2: The Pairwise Floor Falls Out (20 minutes)**
  Announce: "Before we reveal the coin, let's see what your bets were based on. I need volunteers. Find a partner you traded with. Both of you, come to the front. Reveal your peek cards *only to each other and the class*."

  *   **Staging the Reveal (Key Solution):** Process pairs **one pair at a time**. Only reveal the peeks *within the pair* to the whole class. Do NOT reveal the coin yet.
  *   **The Moment:** Take the first pair. Ask them to state their initial credences based on their private peeks (e.g., "I saw Heads, so I thought P(Heads)=2/3", "I saw Tails, so I thought P(Heads)=1/3"). Ask: "Given *both* peeks, what is P(Heads) now?" **Let the students calculate.** Guide minimally: "How many sources said Heads? How many said Tails? Remember each source is independent and right 2/3 of the time." They *must* conclude it's 1/2. (P(Heads | Peek1=H, Peek2=T) proportional to P(Heads) * P(Peek1=H|Heads) * P(Peek2=T|Heads) = 0.5 * (2/3) * (1/3) = 0.5 * 2/9. P(Tails | Peek1=H, Peek2=T) proportional to P(Tails) * P(Peek1=H|Tails) * P(Peek2=T|Tails) = 0.5 * (1/3) * (2/3) = 0.5 * 2/9. Ratio is 1:1, so P(Heads) = 1/2). Emphasize: *The bet they were so keen on was fair all along.* Ask: "What information did you ignore when you happily traded? *That the other person was willing to take the other side!* Their willingness to bet *against* you was evidence *for* the other outcome, perfectly canceling your evidence." Repeat with 2-3 opposed pairs. The shock should be palpable each time.
  *   **Predictable Problems:**
      *   *Arithmetic Struggle:* Be ready with the calculation written out simply: "Prior P(H)=0.5. Likelihood of your *pair* of peeks (one H, one T) IF H is true: P(First peek H|H) * P(Second peek T|H) = (2/3) * (1/3) = 2/9. IF T is true: P(First peek H|T) * P(Second peek T|T) = (1/3) * (2/3) = 2/9. Posterior Odds = (0.5 * 2/9) : (0.5 * 2/9) = 1:1. So P(H) = 1/2." Walk through it patiently.
      *   *Non-Opposed Pairs:* If a pair traded but had agreeing peeks (should be rare if they traded rationally, but maybe miscalculation or large bet size temptation), their posterior will be extreme (e.g., two Heads peeks: P(H) proportional to 0.5 * (2/3)*(2/3) = 0.5 * 4/9 vs P(T) proportional to 0.5 * (1/3)*(1/3) = 0.5 * 1/9 => P(H) = (4/9)/(4/9 + 1/9) = 4/5). This starkly contrasts with the canceling pairs, reinforcing the point: trade only happened because they *didn't* know they agreed/disagreed.

  **Act 3: Common Knowledge & Market Collapse (15 minutes)**
  1.  **Reveal All Peeks:** Now, have every student reveal their peek card publicly. Tally the total Heads peeks and Tails peeks on the board.
  2.  **Calculate Room Posterior:** Ask the class: "Given *all* peeks, what is P(Heads)?" Guide them: "Total Heads peeks: H_obs. Total Tails peeks: T_obs. Remember the coin flip determines the *distribution* of peeks." They need to calculate P(Heads | Data) proportional to P(Heads) * [Binomial Prob: Obs H_obs 'successes' out of (H_obs + T_obs) trials given p=2/3] vs P(Tails | Data) proportional to P(Tails) * [Binomial Prob: Obs T_obs 'successes' out of (H_obs + T_obs) trials given p=2/3]. Simplify: The posterior odds ratio is [P(H)/P(T)] * [(2/3)^(H_obs) * (1/3)^(T_obs)] / [(1/3)^(H_obs) * (2/3)^(T_obs)] = 1 * (2/3)^(H_obs - T_obs) * (3/2)^(H_obs - T_obs) = ( (2/3)*(3/2) )^(H_obs - T_obs) = 1^(H_obs - T_obs) = 1. **Regardless of the actual numbers H_obs and T_obs, the posterior odds ratio is 1:1. P(Heads) = 1/2.** The room *agrees* on 50%, even if the raw peek count is unbalanced. Point out: "Notice, the *pairwise* cancellation we saw was a special case of this. When the *whole* dataset is common knowledge, everyone must agree on the posterior."
  3.  **Run the Market Again (Publicly):** Announce: "Now, with *all* peeks public knowledge, I reopen the betting market. Same rules: even money, peer-to-peer. Trade if you wish." **Stand back.** Silence. No trades should occur. Anyone offering a bet will find no takers. Ask: "Why no trades? What does everyone know now that they didn't know before?" They should articulate: Everyone has the same information (all peeks are public), so everyone calculates the same posterior (1/2), making any even-money bet have zero expected value. No one has an edge. Common knowledge of information has led to common knowledge of beliefs and eliminated incentive to trade.

  **Act 4: The Disagreement Challenge (10 minutes)**
  Pose the challenge: "Okay, clearly you all agree the probability is 1/2 now. But suppose, hypothetically, I asked two of you to *try* to disagree. Student A, you must assert 'I believe P(Heads) > 1/2'. Student B, you must assert 'I believe P(Heads) < 1/2'. You both know all the peeks, you both know the process, you both know the other knows all this. Can you sustain this disagreement? What would you have to assume about the *other person* to hold your position while knowing they hold the opposite, given you both see the same data and know the same prior process?"

  *   **Let them grapple.** Guide them to the necessary assumptions:
      *   "The other person is irrational; they can't do the math."
      *   "The other person isn't using the same prior probability for the coin (they think it's biased?)."
      *   "The other person doesn't believe the peek accuracy is 2/3 like we all agreed."
      *   "The other person thinks the peeks aren't independent."
      *   Emphasize: "To sustain disagreement under common knowledge of your credences and the shared prior structure, you *must* assume the other person is irrational or that they hold fundamentally different prior beliefs (about the coin bias, the peek accuracy, or the independence)."

  **Debrief: Mapping to Aumann (15 minutes)**
  Now name the theorem and map the experience:
  1.  **Initial Trading:** This was the state *before* credences were common knowledge. You acted on your private information, rationally based on your individual posterior. Disagreement (manifest as willingness to bet against each other) was possible and even likely. *This is the world where the theorem doesn't (yet) apply.*
  2.  **Pairwise Cancellation:** When the pair revealed their peeks *to each other and the class*, it made their *evidence* common knowledge within that group. This forced them both to update to the same posterior (1/2). While the *whole room* didn't have CK yet, this small group did. It demonstrated *how* common knowledge of evidence compels agreement under a shared prior. **This is the core constraint they *felt*: The moment the other person's evidence (or willingness to bet, which implied evidence) became known, their own belief had to change dramatically to incorporate it.**
  3.  **Room Posterior & Market Collapse:** Revealing *all* peeks made *all* evidence common knowledge. Everyone calculated the same posterior (1/2), leading to agreement and a collapsed market. This demonstrates the theorem's conclusion: **Common knowledge of posteriors (or the evidence generating them) implies agreement.** The betting market collapse is the visceral proof – no one can find a rational counterparty.
  4.  **Disagreement Challenge:** This exposed the theorem's assumptions. For agreement to be *forced*, we need common knowledge of the agents' posteriors *and* a common prior (including the model: prior coin probability, likelihood function/accuracy, independence). The challenge made them see that sustaining disagreement under CK requires abandoning one of these: assuming irrationality or different priors. **The session makes them *feel* why CK of beliefs/evidence forces agreement. It makes the role of the common prior *visible* as the framework enabling the calculation, but doesn't make them *feel* its necessity as acutely.**
  5.  **Addressing the Common Prior Gap:** Acknowledge this directly: "In our setup, the common prior – the shared understanding of the coin's fairness, the 2/3 accuracy, and the independence – was built-in by me. You *felt* how, under that shared framework, common knowledge *forced* agreement. The theorem tells us this is general: *If* agents share a common prior over the state of the world, and their posteriors are common knowledge, then those posteriors must be equal. The disagreement challenge hints at what happens without shared priors – disagreement can persist even under common knowledge. The shared prior is the load-bearing beam; it's what allows the evidence to be incorporated consistently by everyone, ultimately forcing identical conclusions when all evidence is commonly known."

  **The Variant: The Noise Trader**
  Add one extra participant (or designate one student). This person receives *no peek at all*. Explain publicly that this person has no information about the coin flip beyond the initial setup (fair coin). Their credence remains 1/2. Crucially, tell the class: "This participant might bet for reasons unrelated to information – maybe they enjoy gambling, maybe they want to stimulate the market, or maybe they just flip a coin to decide their bet. Don't assume their bets signal information."

  *   **What it Teaches:**
      *   **Common Knowledge vs. Public Information:** In Act 1 (private peeks), the informed students might misinterpret the noise trader's bets as signals, potentially leading to spurious trades or confusion. This highlights that common knowledge requires not just publicity, but mutual understanding of rationality and information structures.
      *   **What Sustains Disagreement:** In Act 3 (common knowledge), even with the noise trader present, the *informed* students still won't trade with *each other* because they share the common posterior. The noise trader might still bet randomly, but informed rational agents recognize this and ignore it for probability updates. It underscores that Aumann's theorem applies to rational agents sharing a prior. Irrational actors or those betting for exogenous reasons don't force disagreement among the rational agents under common knowledge.
      *   **The Source of the Edge:** It reinforces that the initial willingness to trade stemmed *only* from differing private information, not from differing risk preferences or exogenous motives (which the noise trader embodies). When private information becomes common knowledge, that specific source of disagreement vanishes for the rational agents.

  **Predictable Snags & Handling Recap:**
  *   **Refusers:** Assuage risk aversion by emphasizing the expected value calculation and small stakes. Let abstainers observe.
  *   **Agreeing Pairs:** Their lack of trade is a feature, demonstrating when private info doesn't differ enough to motivate trade.
  *   **The Spoiler:** If they predict cancellation early, focus discussion later on *why* their peers didn't see it (private info isolation). Use them to articulate the update during the pairwise reveal.
  *   **Arithmetic Struggle:** Prepare the simple ratio calculation (as above) for P(Heads | H_peek, T_peek). Walk through it step-by-step. For the room posterior, the "odds ratio = 1" trick is powerful.
  *   **Messy Room Peek Count:** The Binomial likelihood ratio cancelling to 1 is the crucial insight. Have the formula ready. Seeing the actual H_obs and T_obs cancel out mathematically is a satisfying "aha" confirming the pairwise cancellation wasn't a fluke.
  *   **Common Prior Feels Constructed:** Explicitly discuss it in the debrief. Contrast with the Disagreement Challenge where different priors are invoked. The variant also helps – the noise trader's motives are *not* part of the common prior model for the coin state, so they don't force belief updates.

  This session uses the visceral experience of confident trade followed by its collapse under shared information to make Aumann's agreement theorem feel inevitable. They run headlong into the constraint while focused on betting, experiencing how common knowledge of evidence dissolves disagreement under a shared understanding of the world. The theorem provides the framework to understand *why* the floor fell out.
