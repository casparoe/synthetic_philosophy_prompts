answer: |-
  Your description captures a profound and well-known phenomenon in the foundations of computing and philosophy of mind. The claim you're analyzing is almost certainly the **Church-Turing Thesis (CTT)**, and its dual nature is a subject of ongoing debate. Here's how it breaks down:

  ### The Name: **The Church-Turing Thesis (CTT)**
  - **Core Claim**: "Every effectively calculable function is computable by a Turing machine" (or equivalent models like lambda calculus, general recursive functions, etc.).
  - **Your Observation**: CTT exhibits a **Janus-faced character**—presented as an empirical conjecture when defending its scope, but treated as a *definition* of "effective computability" when dismissing counterexamples.

  ---

  ### Why CTT Has This Dual Nature
  1. **The Empirical Conjecture Face**  
     - **Defense**: "No one has ever found a human-computable procedure that exceeds Turing machines."  
     - **Evidence**: Centuries of mathematical practice (algorithms for arithmetic, logic, etc.), failed challenges (e.g., hypercomputation proposals), and the equivalence of all known computation models (Turing machines, λ-calculus, etc.).  
     - **Risk**: If a physicist discovered a law of nature enabling non-algorithmic problem-solving (e.g., oracle machines), CTT would be falsified.

  2. **The Definitional Face**  
     - **Defense**: "Any purported counterexample isn't a 'procedure' by definition."  
     - **Mechanism**: CTT defines the *boundary* of computation. If a process (e.g., quantum gravity effects, analog chaotic systems) can't be simulated by a Turing machine, it’s excluded from "effective calculability."  
     - **Protection**: The thesis absorbs counterexamples by refining what "rule-following" means.  

  ---

  ### Philosophical Anatomy: A **Framework Principle**
  This duality isn't accidental—it's essential to CTT's role. Philosophers (e.g., **Hilary Putnam**, **Wilfried Sieg**) argue CTT is a **framework principle**:  
  - It *stipulates* a concept ("computability") to ground a theory (computer science).  
  - It *generalizes* from empirical observation (human mathematical practice).  
  - **Key Insight**: CTT bridges **empirical discovery** (humans compute algorithmically) and **conceptual innovation** (defining computation abstractly).  

  #### Can the Two Faces Be Separated?  
  | **Component**                | **Nature**                  | **Refutable?** | **Example**                          |  
  |------------------------------|----------------------------|----------------|--------------------------------------|  
  | **Empirical Core**           | Hypothesis about human cognition/physics | Yes | Discovery of non-algorithmic cognition |  
  | **Definitional Shell**       | Convention about "computation" | No            | Reclassifying hypercomputation as "non-procedural" |  
  - **Problem**: Pulling them apart cleanly is impossible because CTT *creates* the category it describes. The "empirical" evidence relies on the definition to identify what counts as a "procedure."  

  ---

  ### How It Differs From Neighboring Concepts  
  1. **vs. Unfalsifiable Claims** (e.g., "God exists"):  
     - CTT *is* falsifiable in principle (e.g., prove humans solve the halting problem). Its "unfalsifiability" arises from *redefining terms* post-hoc.  

  2. **vs. Circular Definitions**:  
     - CTT isn't circular; it’s an *ampliative* inference: "All observed A is B; therefore, we define A as B."  

  3. **vs. Conventionalism** (e.g., "1 meter = length of this bar"):  
     - Unlike arbitrary conventions, CTT is constrained by empirical success (all known procedures are Turing-computable).  

  ---

  ### Why the Oscillation Isn't Bad Faith  
  Proponents maintain consistency by seeing CTT as:  
  - **A regulative ideal**: It sets the standard for what *counts* as computation.  
  - **A self-validating paradigm**: As no counterexample has endured, the definitional boundary hardens.  
  - **Example**: When someone claims a neural net "computes non-algorithmically," CTT defenders reply: "If it produces definite outputs, it *must* be simulable by a Turing machine—else it’s not computation."  

  ---

  ### A Name for the Phenomenon: **Normative Naturalization**  
  If "Church-Turing Thesis" feels insufficient for the *pattern*, I propose:  
  > **Normative Naturalization**  
  > - **Normative**: It sets a prescriptive standard ("this is what 'computation' *ought* to mean").  
  > - **Naturalization**: It grounds this standard in observed natural phenomena (human calculation).  
  > - **Scope**: Applies to claims where empirical generalizations morph into conceptual boundaries (e.g., "life" in biology, "consciousness" in AI).  

  #### Cases Where This Pattern Applies:  
  - CTT (computability)  
  - Functionalism in philosophy of mind ("mental states = computational states")  
  - Physical Church-Turing Thesis ("all physical processes are computable")  

  #### Cases Outside the Pattern:  
  - Pure empirical hypotheses (e.g., "all swans are white").  
  - Pure stipulations (e.g., "we define 'unicorn' as a horse with a horn").  

  ---

  ### Conclusion: A Necessary Tension  
  CTT’s duality isn’t a flaw—it’s a feature of foundational claims that bridge experience and abstraction. The oscillation you detect reflects how science negotiates between **what we observe** and **how we conceptualize it**. To reject this duality would be to demand that CTT be *either* an empirical hypothesis (vulnerable to every untested thought experiment) *or* a definition (detached from reality). Its power lies in being both.  

  For further reading:  
  - Sieg, W. (2008). *Church Without Dogma: Axioms for Computability*.  
  - Copeland, B. J. (2002). *Hypercomputation*.  
  - Shapiro, S. (2006). *Computability, Proof, and Open-Texture*.
