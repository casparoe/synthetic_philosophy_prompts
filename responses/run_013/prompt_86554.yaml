prompt: |-
  My whole life I've been the guy who just takes people's word for things, and last month someone I trusted told me something completely confident and completely wrong and it cost me about a thousand bucks, so now I'm trying to work out what my actual rule is. Here's my gut on a pile of cases, no theory, just gut:

  My doctor says my iron's low — believe it, wouldn't dream of checking. Some guy on the street says the bridge up ahead is out — believe him, no hesitation. An anonymous account on a forum says my prescription interacts badly with grapefruit — definately not, I'd go read something. My best friend says the new Thai place is good — believe her. Same friend, same night, says she saw a UFO over the reservoir — don't believe her. My coworker says the deadline moved — believe him. A used-car guy, who frankly knows more about cars than I ever will, says the transmission is solid — don't believe him. A guy who despises me lets slip that the person I'm about to hire got fired for stealing at his last job — I believe that one, and specifically *because* he hates me. My neighbor says his brother-in-law says the tap water's contaminated — nope, wouldn't act on it. A stranger says there's a wasp on my shoulder — I'm already moving.

  The one I keep tripping on is the street stranger versus the anonymous forum poster: both nobodies, no track record, opposite verdicts, and I can't tell if that's about stakes, or about the guy being physically in front of me, or about me being able to picture the bridge. I gather there's an old fight between people who say you need a reason for every individual case and people who say you're allowed to just believe people by default until something goes wrong — which one do my verdicts actually add up to, or is it neither? My own half-theory is 'believe anyone who has nothing to gain from my believing them', but that tells me to believe the UFO friend and the forum poster and to *dis*believe the enemy, so it's dead on arrival unless there's a repair.

  Is there a principle, or a small set of candidates, that gets all of this? Say what each one predicts for cases I didn't list — a nurse, a chain of three people each repeating the last, someone who's been right twenty times, my own kid — and be honest about which of my verdicts it has to throw out. Also, is there a real difference between me predicting that someone is reliable and me trusting them? Because when my doctor's wrong I feel let down, not just mistaken, and I want to know if that's sentiment or if it's doing epistemic work.

  Give it to me as exactly five numbered items, a sentence or two each, no intro and no conclusion — fold the trust thing into whichever item it fits.
reasoning: |-
  Okay, the user is trying to figure out their own rule for trusting information after a costly mistake. They've listed various scenarios where they instinctively believe or disbelieve people, and they're struggling to find a consistent principle. Let me break down their examples.

  First, they trust their doctor about low iron and a stranger on the street about the bridge being out. But they don't trust an anonymous forum post about grapefruit interaction. They believe their best friend about the Thai restaurant but not about the UFO. Trusting a coworker about a deadline but not a used-car salesman. They even believe an enemy who mentions someone stealing because the enemy hates them. 

  The main conflict is between trusting a physical stranger (bridge) versus an online anonymous poster. The user's half-theory about believing those who have nothing to gain doesn't hold because it would make them trust the UFO friend and the forum poster, which they don't, and distrust the enemy, which they do.

  Looking deeper, the user might need a multi-factor model. Factors like stakes, context, and incentives matter. High stakes (grapefruit interaction) require more verification. Physical presence (stranger pointing out a wasp) adds immediacy. The enemy's statement is trusted because his hatred makes him unlikely to lie to help the user. 

  Also, the emotional aspect: when the doctor is wrong, the user feels betrayed. This suggests that trust involves an expectation of reliability and duty, not just accuracy. So the model needs to account for relational expectations versus pure reliability.

  Testing the principles against their examples: The used-car salesman has expertise but an incentive to lie, so disbelieved. The enemy has no incentive to help, so believed. The neighbor's hearsay about tap water lacks direct verification. The forum post has low credibility and high stakes, so not trusted. 

  For unmentioned cases: A nurse might be trusted based on role; a chain of three people might lose credibility with each link; someone consistently right gains trust; their own kid might be trusted but verified based on context. 

  The trust vs. prediction distinction: Trust involves relational expectations (doctor's duty), leading to betrayal, whereas prediction is just about accuracy. This fits the user's feeling of being let down by the doctor.
answer: |-
  Here are five principles derived from your cases, with predictions and conflicts noted:

  1.  **Default Trust + Role/Context Credibility:** Trust is the default assumption based on the speaker's perceived role, context, and the plausibility of the claim. A doctor in a consultation, a stranger warning of immediate physical danger (bridge, wasp), or a coworker relaying routine work info fit credible roles/contexts. *Predicts:* Trust a nurse giving medical advice in a hospital. *Conflict:* Disbelieving the forum poster (similar anonymity to street stranger) requires another factor (see #2).

  2. **Stakes & Burden of Proof:** Higher personal stakes or implausible claims shift the burden of proof to the speaker, requiring independent verification. Low iron (actionable medical advice) and grapefruit interaction (high risk) demand verification despite sources (doctor trusted implicitly due to #1, forum poster distrusted). UFOs are inherently implausible. *Predicts:* Trust your kid about finishing homework (low stakes) but verify if they say they found $1000 (high stakes/implausible). *Conflict:* Believing the street stranger about the bridge (high stakes) relies heavily on #1 and #3.

  3. **Incentive & Counter-Incentive Alignment:** Trust increases if the speaker has no incentive to lie or has a counter-incentive (e.g., an enemy revealing damaging info gains nothing/finds it painful to help you). Distrust arises from perceived incentives to deceive (used-car salesman's commission). *Predicts:* Distrust a chain of three people repeating gossip (incentive: social gain). Trust someone correct 20 times *if* no new incentive emerges. *Conflict:* Disbelieving the UFO-spotting friend assumes an incentive (delusion, prank?) overriding #1.

  4. **Direct Perception & Immediacy:** Trust is higher for claims about the immediate, perceptible environment delivered in person (wasp on shoulder, bridge ahead). Physical presence and concrete details ("picture the bridge") enhance credibility. *Predicts:* Trust a stranger shouting "Fire!" in your building. *Conflict:* Explains the street stranger vs. anonymous forum poster difference. Disbelieving the neighbor's brother-in-law's tap water claim fits (indirect, non-immediate).

  5. **Trust vs. Reliability Prediction (The "Let Down" Factor):** Trust involves an expectation of *responsibility* within a relationship or role (doctor, friend), making their failure feel like a betrayal, not just an error. Reliability prediction is purely cognitive ("they're usually right"). *Predicts:* You'd feel "let down" by your best friend lying about the Thai place (relationship breach), but merely mistaken if the 20-time-right stranger was wrong once (no assumed duty). *Conflict:* Your coworker deadline move relies on role-responsibility (#1) but minimal personal relationship; feeling "let down" might be weaker than with the doctor.
