prompt: |-
  Hey, I'm taking a punishment theory module and I've got a compare-and-contrast thing due. Can you act like a philosopher of criminal law who's actually thought hard about this stuff, and think carefully before answering?

  Here's the pair I need compared. View 1, call it the "gatekeeper" view: what an offender deserves (desert) only decides whether the state is permitted to punish them at all — it's a threshold, not a dial. Once you're through the gate, how much punishment you get is set entirely by forward-looking stuff (deterrence, incapacitation, rehab). View 2, the "calibration" view: desert directly fixes the amount, proportional to the wrong done, and forward-looking concerns only operate as side-constraints (e.g. don't punish when it'd be utterly pointless or would tear society apart).

  Start by brainstorming what actually turns on the difference between these two, then give me your answer as a numbered list of exactly five points, each a sentence or two, no intro and no conclusion. I'm especially curious whether they ever come apart in actual sentencing, which one better matches ordinary moral intuitions, and whether the whole gatekeeper/calibration split is a real disagreement or just a verbal one.

  And please be genuinely critical rather than diplomatic — if I've set the two views up so that they're trivially different (or trivially the same), or if the framing sneaks in an assumption a retributivist would just reject outright, say so plainly instead of playing along.
