prompt: |-
  I run the incident-review panel at a regional rail operator — we meet about once a month, and after every serious near-miss we have to settle two things: whether the people involved actually knew what was going on or were just right by luck, and whether what they did should get written into the rulebook or the training. The second one keeps biting us. Last month a driver stopped short of a signal failure because he said he had a bad feeling about that stretch; the investigation turned up nothing he could point to, but he was right, the outcome was good, and now everyone — including my director, who has to sign off on any procedure change — wants to add a line to the manual saying that if you get a bad feeling, you should slow down. I think thats a mistake and I can't say why in a way that survives the meeting.

  What I keep circling back to is the Meno problem — why knowledge is supposed to be worth more than a true belief that just happens to be true. Two images from the Meno are doing real work for me and I want the procedure to take them seriously. The first is that a true belief without a reason is like one of Daedalus's statues: it walks off the moment you stop holding it, whereas the belief you've tied down by working out why it's true stays put. The second is the road to Larissa — the man with a merely true belief about the road is as good a guide as the man who knows it, at least for that one trip. I notice the dialogue is slippery about which of these is really the point (is the tether valuable because it makes the belief stick, or because having a reason is what makes it justified?) and I know there's an old objection that once you've got the truth, the tether is a wheel that isn't turning. I dont want the procedure to smuggle in an answer to that.

  So: please act as a philosopher of knowledge working alongside a practitioner, and build me a decision procedure my panel can actually run in a 45-minute review, no philosophy background required, that ends in one of a small number of verdicts and says who has to sign off on each. Start by thinking through what the tether buys us in operational terms — reproducibility, transferability, knowing when the belief would fail — since I want the steps defended rather than just asserted. Then give me the questions in order, with what counts as a sufficient answer to each and where each one terminates. Then run it on three cases: the bad-feeling driver; a case where the team's stated reasoning was plainly wrong but the action was right and nothing bad happened; and a veteran operator who did the right thing and genuinely cannot explain why, and never could, but has been right about this for twenty years. And tell me plainly where the procedure gives out and a person has to decide — I'd rather see the seams than have you paper over them. Also say something about the Larissa point: I suspect the tether only matters when you're going to need the belief again, and I want the procedure to use that rather than ignore it. Don't worry about citations or a reading list, I'm not writing a paper — I just need it to be right, and I suspect the honest answer about that last case is one I won't like.
reasoning: |-
  We are building a decision procedure for the incident-review panel that focuses on two key aspects:
   1. Whether the individuals involved had knowledge (justified true belief) or merely a true belief (by luck).
   2. Whether the action taken should be incorporated into the rulebook or training.

   The procedure must be pragmatic, executable in 45 minutes, and require no philosophy background.

   We draw inspiration from Plato's Meno, particularly two points:
   a) The Daedalus statue analogy: Untethered true beliefs (without justification) are unstable and may not be reliable in the future.
   b) The road to Larissa: For a single instance, a true belief (without justification) can be as effective as knowledge.

   However, in operational contexts, we seek reproducibility and transferability. The "tether" (justification) buys us:
   - Reproducibility: The ability for the same person to reliably reproduce the correct action in similar future situations.
   - Transferability: The ability to teach the reasoning to others so they can apply it in similar situations.
   - Knowing the limits: Understanding the conditions under which the belief holds and when it fails, which allows for safe application.

   The procedure will consist of a series of questions. Each question must be answered with sufficient evidence. The procedure terminates at certain points if a clear verdict is reached.

   The verdicts we aim for:
   1. **Knowledge (Justified True Belief)**: The action was based on a belief that was true, and the individual had a sound justification (the tether). This action may be a candidate for rulebook/training.
   2. **True Belief (by luck)**: The action was correct, but the individual lacked a sound justification. This does not get written into the rulebook/training because it is not reliably transferable or reproducible.
   3. **Insufficient Information**: The panel cannot determine the status of the belief with the available evidence.

   However, note that even if an action is based on knowledge, we must also decide if it should be written into the rulebook/training. This decision must consider:
     - The cost of failure if the action is taken inappropriately.
     - The generalizability of the justification (is it only applicable in very rare cases?).
     - Whether the justification is too complex or subjective for a rule.

   We design the procedure in two parts:

   Part 1: Assessing the Belief (Knowledge vs. True Belief)
     We ask:
       Q1. Was the belief true? (i.e., was the action taken actually appropriate for the situation, leading to a good outcome?)
          - If no, then the action was incorrect. (But note: we are only reviewing near-misses where the outcome was good, so this may not occur. However, we might have cases where the action was correct by accident despite the belief being false? We'll handle that.)
          - If yes, proceed to Q2.

       Q2. Did the individual(s) have a justification for their belief that was based on observable facts, established procedures, or sound reasoning? 
          - We are looking for a causal link between the situation and the action that can be articulated and evaluated.
          - Sufficient answer: The individual must point to specific, objective indicators or a logical chain of reasoning that is consistent with known facts and operational principles.
          - If yes, then we have knowledge (justified true belief). Proceed to Part 2 (Rulebook/Training Assessment).
          - If no, then we have a true belief without justification (by luck). The procedure terminates with a verdict of "True Belief (by luck)" and the action does not get written into the rulebook or training.

     But note: What if the individual cannot articulate the justification, but one exists? We might need to allow the panel to reconstruct the justification from the evidence. Therefore, we adjust:

       Q2 (revised): Is there a justification for the belief that is based on observable facts, established procedures, or sound reasoning, whether articulated by the individual or reconstructed by the panel?
          - The panel must be able to reconstruct the justification from the evidence. If they can, then it counts as justified.

     However, what about the veteran operator who cannot explain? We'll handle in examples.

   Part 2: Rulebook/Training Assessment (only if we have knowledge)
     We ask:
       Q3. Is the justification generalizable and transferable? 
          - Can the reasoning be clearly communicated to others in a way that they can apply it in similar situations?
          - Does it rely on factors that are objectively verifiable or measurable?
          - If the justification is too subjective (like a "bad feeling") or relies on factors that are not consistently observable, then it may not be suitable for the rulebook/training.

       Q4. What is the cost of error if this action is taken inappropriately?
          - If the action, when taken without the same justification (i.e., in a situation where it doesn't apply), could lead to a high-consequence event, then it might be too risky to generalize.

       Q5. Does the action conflict with existing rules? If so, does it represent a necessary exception that should be codified?

     Based on these, the panel decides whether to recommend:
          - Write into rulebook
          - Write into training (as a case study or heuristic)
          - Do not codify (but perhaps note in a lessons-learned log for reference)

   However, note the director must sign off. We design the procedure to output:

     Verdicts for Part 1:
        A: Knowledge (Justified True Belief)
        B: True Belief (by luck)
        C: Insufficient Information (if the truth of the belief or the existence of a justification cannot be determined)

     For A, we also output a recommendation for Part 2:
        - Codify in rulebook (with specific wording) [if Q3, Q4, Q5 support]
        - Include in training (with explanation of the justification) [if it is more about building situational awareness and judgment]
        - Do not codify (but document as an example of good judgment in the specific context) [if too risky or not transferable]

     The procedure must account for the Larissa point: For a one-off, a true belief is as good as knowledge. But we are making rules for the future. Therefore, the tether matters because we are going to need the belief again (by the same person or others). 

     We design the procedure to explicitly consider the need for future use:

       At the start of Part 2, we ask: "Is this a type of situation that is likely to recur and require the same or similar action by this operator or others?"

          - If not, then even if it's knowledge, we may not need to codify it (but document as an example of good judgment). 
          - If yes, then we proceed with Q3-Q5.

   Now, the full procedure:

   **Incident Review Decision Procedure**

   Step 1: Incident Description
     - Briefly describe the incident and the action taken.

   Step 2: Outcome Assessment
     Q1. Did the action taken lead to a good outcome in this specific incident? (i.e., was the belief about what to do true?)
        - If no: The action was not correct. The panel must then investigate why it was taken and whether it reveals a training gap or rule flaw. (But note: we are reviewing near-misses with good outcomes, so this may be rare. We'll assume yes for the cases we are given.)
        - If yes: Proceed to Q2.

   Step 3: Justification Assessment
     Q2. Can the panel identify a justification for the action that is based on observable facts, established procedures, or sound reasoning? 
          (Note: The justification may come from the operator's statement or from the panel's reconstruction of the situation using available evidence.)

          - The panel must look for:
              a) Observable facts: e.g., specific signals, sounds, visual cues, instrument readings, etc.
              b) Established procedures: e.g., the action was a direct application of a rule, or a logical extension of one.
              c) Sound reasoning: e.g., a chain of cause and effect that is consistent with operational principles.

          - What counts as sufficient?
              - The justification must be something that could, in principle, be taught to another operator.
              - It must not rely on unverifiable intuition (e.g., "I had a bad feeling") without any observable correlates.

          - If yes (justification found): Proceed to Step 4 (Part 2: Rulebook/Training Assessment).
          - If no: The belief is classified as "True Belief (by luck)". The action does not get codified. The panel may recommend further training for the individual if the lack of justification reveals a gap, but the action itself is not added to the rulebook or training. The procedure terminates here for this part.

   Step 4: Future Need Assessment (for Knowledge cases only)
     Q3. Is this a type of situation that is likely to recur and require the same or similar action by this operator or others?
          - If no: The panel recommends documenting the incident as an example of good judgment in the specific context, but not codifying it. The procedure terminates.
          - If yes: Proceed to Q4.

   Step 5: Transferability and Risk Assessment
     Q4. Is the justification generalizable and transferable?
          - Can it be turned into a clear, objective rule or heuristic that others can follow?
          - Does it avoid reliance on subjective feelings or factors that cannot be consistently observed?
          - If no: Then it may not be suitable for the rulebook. Consider if it can be included in training as a case study to build judgment (with explicit discussion of the justification). Proceed to Q5.
          - If yes: Proceed to Q5.

     Q5. What is the cost of error if this action is taken inappropriately?
          - Low: e.g., minor delay, low risk of incident.
          - Medium: e.g., moderate delay, potential for minor incident.
          - High: e.g., could lead to a serious incident.

          Also, consider: 
          - Does the action conflict with existing rules? If it does, then codifying it requires a rule change and careful consideration.

   Step 6: Decision on Codification
     Based on Q4 and Q5:
          - If the justification is transferable (Q4=yes) and the cost of error is low or medium: Recommend codifying in the rulebook.
          - If the justification is transferable and the cost of error is high: Consider if the rule can be made with sufficient safeguards (e.g., additional checks). If so, codify. If not, it may be too risky and better suited for training as a case study with strong caveats.
          - If the justification is not transferable (Q4=no) but the situation is important: Recommend including in training as a case study (with the justification explained) to build situational awareness and judgment, but not as a rule.

     The panel must also note any conflicts with existing rules and propose resolutions.

   Step 7: Sign-off
     - For a verdict of "True Belief (by luck)": No rulebook/training change. The director does not need to sign off on a change (but the incident report is filed).
     - For a verdict of "Knowledge" without codification (because of no future need or non-transferable): The director signs off on the decision not to codify.
     - For a verdict of "Knowledge" with a recommendation to codify (rulebook or training): The director signs off on the specific change.

   Now, we run the procedure on the three cases:

   Case 1: The bad-feeling driver
     Incident: Driver stopped short of a signal failure because of a "bad feeling".
     Step 2 (Q1): The outcome was good (true belief).
     Step 3 (Q2): The panel cannot identify a justification based on observable facts. The driver had a bad feeling but could not point to any specific indicator. 
          Verdict: True Belief (by luck). 
          Termination: No codification.

     Note: The panel might be tempted to look for indicators after the fact, but if the investigation found none, then there is no justification to reconstruct.

   Case 2: Stated reasoning plainly wrong but action right
     Incident: A team took an action that was correct but their stated reasoning was incorrect (e.g., they thought there was a rule X, but rule X didn't apply, yet the action was right for a different reason).
     Step 2 (Q1): Outcome good (true belief).
     Step 3 (Q2): The panel must reconstruct: Is there a valid justification for the action that the team did not articulate?
          - Example: The team avoided a section of track because they thought there was a speed restriction (which there wasn't), but it turned out there was an obstruction they didn't know about. The panel might find that the team observed some debris (an observable fact) and that was the real reason? But if the team didn't state that and the panel cannot find evidence of that, then there is no justification.
          - If the panel can find a justification (e.g., they saw debris, which is a valid reason to stop), then it becomes knowledge (even though the team gave a wrong reason). Then we proceed to Step 4.
          - If the panel cannot find any justification, it's true belief by luck.

     Let's assume the team's stated reason was wrong and the panel cannot find any other justification. Then:
          Verdict: True Belief (by luck). No codification.

   Case 3: Veteran operator who did the right thing and cannot explain, but has been right for twenty years.
     Incident: The operator took a correct action but cannot explain why.
     Step 2 (Q1): True (outcome good).
     Step 3 (Q2): The operator cannot articulate a justification. Can the panel reconstruct one?
          - The panel must look for patterns. If the operator has been right about this for twenty years, there might be observable cues that the operator has internalized (tacit knowledge). 
          - The panel should investigate: are there consistent indicators in the twenty years of incidents that the operator is responding to? If so, they can reconstruct the justification (e.g., "the operator always does X when condition Y occurs, and condition Y is a known risk factor that we can now identify").
          - If the panel can reconstruct a justification (even if the operator cannot articulate it), then it becomes knowledge. We call this "tacit knowledge" that can be made explicit.

          - If the panel cannot find any pattern or justification (e.g., it's just a feeling that has been lucky for twenty years), then we are forced to call it true belief by luck (though we are uneasy). But note: without a justification, we cannot teach it to others or know when it might fail.

          Let's assume the panel can reconstruct: 
              After reviewing the veteran's history, they notice that every time the veteran took this action, there was a specific weather condition (e.g., fog above a certain density) that is known to cause a particular hazard. The veteran may not have been able to articulate the weather pattern but was responding to it.

          Then: Verdict: Knowledge (justification reconstructed). Proceed to Step 4.

          Step 4 (Q3): Is this situation likely to recur? Yes (weather conditions recur).
          Step 5 (Q4): Transferable? We can now articulate: "In fog with visibility below X, do Y." So yes.
          Step 5 (Q5): Cost of error? If we do Y when visibility is actually good, what happens? If it causes a delay, then medium. We may codify.

          Recommendation: Codify in rulebook as a new rule for low visibility.

          But if we cannot reconstruct a justification, then:
              Verdict: True Belief (by luck). We cannot codify it because we don't know what to codify. We might, however, note that the operator has a good track record and allow discretion in similar situations? But that's not codifying a rule.

          This is the hard part: we cannot write a rule for a feeling. We might document it as a lesson that in very rare cases, an operator's experience might lead to a correct action, but we do not make it a rule.

     Note: The panel must be rigorous in trying to reconstruct. If they cannot, they must be honest.

   Where the procedure gives out:
     - The reconstruction of justification (Q2) requires the panel to be detectives. Sometimes the evidence is not there. Then we must fall back to "Insufficient Information" (if we can't determine if the belief was true? But we know the outcome was good) or "True Belief (by luck)" if we are sure there was no justification.

     - Also, the future need assessment (Step 4) is inherently speculative. We have to make a judgment call.

     - The transferability assessment (Q4) is subjective. What counts as "transferable"? We require that the justification can be expressed in terms of objective indicators and logical reasoning. If it cannot, then it's not transferable.

     We are honest: the procedure does not eliminate judgment. It structures it.

   Finally, the Larissa point: 
     The tether (justification) matters when we are going to need the belief again (by the same person or others). In a one-off situation, we don't need the tether for that particular instance. But we are building a system for the future. Therefore, the procedure explicitly asks about recurrence (Step 4). If the situation is unlikely to recur, then even if it's knowledge, we don't codify it (but we document it). The tether becomes operationally valuable only when we need to use the belief again.

   The procedure:

    Step 1: Incident Description (5 minutes)
    Step 2: Q1 - Outcome Assessment (5 minutes)
    Step 3: Q2 - Justification Assessment (15 minutes) [most time-consuming]
        - If True Belief (by luck): terminate (total time ~25 minutes)
    Step 4: Q3 - Future Need (5 minutes)
        - If no future need: terminate with no codification (total time ~30 minutes)
    Step 5: Q4 and Q5 - Transferability and Risk (10 minutes)
    Step 6: Decision on Codification (5 minutes)

   Total: 45 minutes.

   We now write the procedure in a concise form for the panel.

   **Decision Procedure Handout**

   Incident Review Decision Tree (45 minutes max)

   1. **Incident Summary** (5 min)
      - Describe the incident, the action taken, and the outcome.

   2. **Q1: Was the action appropriate and did it lead to a good outcome?** (5 min)
      - If NO: Investigate why the action was taken and consider corrective actions (training, rule clarification). [This is a separate path not covered by our cases.]
      - If YES: Proceed to Q2.

   3. **Q2: Can we identify a justification for the action based on observable facts, established procedures, or sound reasoning?** (15 min)
      - Look for: specific cues (sights, sounds, readings), logical links to rules, or cause-and-effect chains.
      - The justification must be something that can be taught to others.
      - If YES (Knowledge): Proceed to Q3.
      - If NO (True Belief by luck): 
          Verdict: "True Belief (by luck) - Do not codify."
          Termination: Document the incident as a near-miss with a good outcome but no generalizable lesson.

   4. **Q3: Is this type of situation likely to recur, requiring the same or similar action by this operator or others?** (5 min)
      - If NO: 
          Verdict: "Knowledge - but not recurring. Do not codify. Document as example of good judgment."
          Termination.
      - If YES: Proceed to Q4.

   5. **Q4: Is the justification generalizable and transferable?** (5 min)
      - Can we turn it into an objective rule or heuristic that others can follow without relying on unverifiable feelings?
      - If YES: Proceed to Q5.
      - If NO: 
          Consider: "Cannot be fully codified. Recommend including in training as a case study with explanation of the justification and its limits." 
          Then proceed to Q5 for risk assessment.

   6. **Q5: What is the cost of error if this action is taken inappropriately?** (5 min)
      - Low/Medium: 
          - If Q4 was YES: Codify in rulebook.
          - If Q4 was NO: Include in training (case study).
      - High: 
          - If Q4 was YES: Codify in rulebook with safeguards (if possible) OR include in training with strong caveats.
          - If Q4 was NO: Include in training as a case study with strong caveats.

   7. **Final Verdict and Recommendation** (5 min)
      - For Knowledge cases: 
          - State the justification clearly.
          - Make a recommendation: 
              - Rulebook change (specify the rule)
              - Training update (specify how to incorporate)
              - Do not codify (if not recurring or too risky even for training)
      - Assign responsibility for drafting the change and note who signs off (the director for any rulebook/training change).

   Note: The panel chair must ensure time discipline.

   We have run the three cases through and shown the outcomes.

   Final note: The procedure is designed to prevent codifying unstable beliefs (like the bad feeling). It values the Daedalus metaphor: without a tether, the belief might not hold next time. And it uses the Larissa insight: if we are not going to need the belief again, we don't need the tether for codification.

   This procedure does not require philosophy but uses philosophical insights to structure a practical decision.
answer: |-
  Below is a decision procedure for your incident-review panel, grounded in operational safety and Plato's insights from the *Meno*. It prioritizes **reproducibility** (the same operator can repeat the action correctly), **transferability** (others can learn and apply it), and **failure predictability** (knowing when the action won't work). The "tether" (justification) matters most when the situation may recur—addressing the "Larissa" problem head-on.  

  The procedure has **5 questions**, takes ≤45 minutes, and ends in one of four verdicts. Philosophy is translated into operational terms. **Seams are exposed** where human judgment is needed.  

  ---

  ### **Decision Procedure: "The Tethered Belief Protocol"**  
  **Time:** 45 minutes max.  
  **Input:** Incident details, witness statements, evidence.  
  **Output:** One verdict + action.  
  **Key:**  
  - ✅ = Sufficient answer (proceed).  
  - ⚠️ = Insufficient (terminate or flag risk).  
  - 🔚 = Termination point.  

  ---

  #### **Question 1: Was the outcome driven by observable facts?**  
  *Why ask?* Untethered beliefs (like "bad feelings") lack reproducibility. Facts let us test and teach.  
  - **Sufficient (✅):** Action was based on **specific, verifiable indicators** (e.g., "the signal lamp was flickering," "unusual noise pattern," "sensor reading X").  
  - **Insufficient (⚠️🔚):** Relied on intuition/gut feeling *without* observable correlates (e.g., "bad feeling," "just a hunch").  
  - **Verdict if ⚠️:** ⛔ **"TRUE BELIEF (UNTETHERED)"** → No rulebook/training changes. *Reason:* Unreliable for future use (Daedalus statue—it may not hold). Document as a near-miss, but do not codify.  
  - **Sign-off:** Panel chair files report (no director sign-off needed).  

  ---

  #### **Question 2: Can the reasoning be reconstructed from evidence?**  
  *Why ask?* Transferability requires others to replicate the logic. "Reconstruction" bridges tacit knowledge (e.g., veterans).  
  - **Sufficient (✅):** Panel can identify a **causal chain** between facts and action using evidence (e.g., "flickering lamp → signal failure risk → slow down"). Operator doesn’t need to articulate it if evidence supports it.  
  - **Insufficient (⚠️🔚):** No reconstructible logic (e.g., no data backs the link between "bad feeling" and signal failure).  
  - **Verdict if ⚠️:** ⛔ **"TRUE BELIEF (UNTETHERED)"** → No codification (as above).  

  ---

  #### **Question 3: Will this situation likely recur?**  
  *Why ask?* Addresses the "Larissa" problem: Tethers matter only if we need the belief again. Skips unnecessary work.  
  - **Sufficient (✅):** Incident involves a **repeatable scenario** (e.g., signal failures, weather patterns, equipment glitches).  
  - **Insufficient (⚠️🔚):** One-off event (e.g., rare wildlife intrusion, unique construction error).  
  - **Verdict if ⚠️:** 🟡 **"KNOWLEDGE (CONTEXT-BOUND)"** → Add to **training only** as an *anecdote* (e.g., "Veteran Operator X once handled a rare case Y this way"). No rulebook change.  
  - **Sign-off:** Training manager approves anecdote (director not needed).  

  ---

  #### **Question 4: Is the reasoning generalizable?**  
  *Why ask?* Rules/training must work for most people, most of the time. Subjective beliefs fail here.  
  - **Sufficient (✅):** Logic is **actionable for others** (e.g., "When [fact X] occurs, do Y"). No vague terms (e.g., "bad feeling" ❌; "vibration above 5Hz" ✅).  
  - **Insufficient (⚠️):** Depends on non-transferable factors (e.g., 20 years of intuition, subjective judgment).  
  - **Verdict if ✅:** Proceed to Question 5.  
  - **Verdict if ⚠️:** 🟡 **"KNOWLEDGE (CONTEXT-BOUND)"** → Training anecdote only (as above).  

  ---

  #### **Question 5: What is the cost of error if applied wrong?**  
  *Why ask?* High-risk actions need stricter tethers (justification) to avoid misuse.  
  - **Low risk (e.g., minor delay):** ✅ → Codify in **rulebook**.  
  - **High risk (e.g., derailment, collision):**  
    - If reasoning is **falsifiable** (e.g., "Do Y only if X is observed; if not, default to Rule Z") → ✅ → Codify in **rulebook with safeguards**.  
    - If **unfalsifiable** (e.g., "bad feeling" with no clear trigger) → ⚠️🔚 → Do **not codify**; add to training as a **risk-aware case study**.  
  - **Final Verdict:**  
    - ✅ → 🟢 **"KNOWLEDGE (TETHERED)"** → Update rulebook/training.  
    - ⚠️ → 🟡 **"KNOWLEDGE (CONTEXT-BOUND)"** → Training only.  
  - **Sign-off:** Director approves rulebook changes; training manager approves case studies.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: "Bad-Feeling" Driver**  
  - **Q1:** ⚠️ (No observable facts—"bad feeling" alone).  
  - **Verdict:** ⛔ **TRUE BELIEF (UNTETHERED)** → No codification.  
  - *Why:* Untethered belief ≠ knowledge. Codifying "slow down on bad feelings" risks arbitrary use (e.g., delays without cause).  

  #### **Case 2: Wrong Reasoning, Right Action**  
  - *Incident:* Team shut off power during a surge, citing "overload risk" (wrong), but it prevented a fire (right). True cause was a faulty sensor (found later).  
  - **Q1:** ✅ (Observable fact: power surge readings).  
  - **Q2:** ✅ (Panel reconstructs: "Surge + sensor error → fire risk"). Their *stated* reason was wrong, but evidence supports a valid reconstruction.  
  - **Q3:** ✅ (Surges may recur).  
  - **Q4:** ✅ (Generalizable: "If surge exceeds X volts + sensor inconsistency, shut down").  
  - **Q5:** Low risk (shutdown causes delay).  
  - **Verdict:** 🟢 **KNOWLEDGE (TETHERED)** → Add to rulebook: "In surge events >X volts with sensor mismatch, initiate shutdown."  

  #### **Case 3: Veteran Operator (20 Years, Unexplainable Correct Action)**  
  - *Incident:* Veteran bypassed a routine check, avoiding a cascade failure. Can’t explain why.  
  - **Q1:** ⚠️ (No facts cited; operator says "just knew").  
  - **Q2:** ⚠️ (Panel finds no reconstructible logic from evidence).  
  - **Verdict:** ⛔ **TRUE BELIEF (UNTETHERED)** → No codification.  
  - *Hard truth:* Even 20 years of luck ≠ knowledge. Codifying this would force others to mimic intuition without understanding failure conditions (e.g., *when* to bypass checks). Document as a near-miss, but not a rule.  
  - *Seam:* Human judgment call—if panel suspects tacit knowledge (e.g., subtle cues only experts notice), they may commission a deeper study. But this falls outside the 45-min review.  

  ---

  ### **Where the Procedure "Gives Out" (Seams Exposed)**  
  1. **Q2 (Reconstruction):** Requires panel’s subjective interpretation of evidence. If evidence is ambiguous (e.g., conflicting witness accounts), verdict defaults to "untethered."  
  2. **Q3 (Recurrence):** Judgment-based. Panel must weigh likelihood without data (e.g., "Is this signal failure a fluke or systemic?"). When uncertain, assume recurrence.  
  3. **Veterans:** Tacit knowledge can’t be codified *unless* made explicit (e.g., via sensors replicating their observations). Procedure prioritizes system safety over individual expertise.  

  ---

  ### **On the "Larissa" Problem**  
  The tether matters **only when we need the belief again**. The procedure embeds this:  
  - **No recurrence (Q3 ⚠️)?** Belief needs no tether → No codification (saves time).  
  - **Recurrence (Q3 ✅)?** Tether ensures the belief won’t "walk away" (Daedalus) when reused.  
  This prevents overloading rulebooks with one-off luck.  

  ---  
  **Final Output:** A clear, auditable report with:  
  - Verdict (⛔ Untethered / 🟢 Tethered / 🟡 Context-Bound).  
  - Action (None / Training Update / Rulebook Update).  
  - Sign-off authority.  

  This balances safety, efficiency, and Plato’s insight: *"True beliefs are useful until you need them a second time."*
