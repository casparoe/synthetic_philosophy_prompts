  Here’s the toast, crafted for both halves of the room—honest, warm, and unequivocally celebratory:

  ---

  **(Clink glass gently)**  
  "Hello everyone. For those who don’t know me, I’m [Your Name], [Sister’s Name]’s deeply proud sibling. Now, I know this room holds a beautiful diversity of beliefs about what marriage *is*—what it’s *for*. Some traditions see it as the sacred ground for building a family, the bedrock of generations. Others see it as a radical commitment chosen anew each day, a promise defined solely by the people making it. And honestly? Those perspectives might never fully reconcile. That’s okay. Today isn’t about debating institutions.  

  Because here’s what matters right now: We’re not here to bless an abstract idea of marriage. We’re here to bless [Sister’s Name] and [Partner’s Name]’s marriage. **But institutions don’t love people—people do.** And what makes *this* marriage, *their* marriage, profoundly good and worthy of celebration isn’t an abstract purpose—it’s the tangible, daily way they *are* together.  

  I think about the time last winter when [Sister’s Name] had that awful flu. [Partner’s Name], you didn’t just bring her soup. You sat on that lumpy couch for hours, reading aloud from that impossibly dense philosophy book she loves, even though you secretly think it’s nonsense, just because you knew the sound of your voice comforted her.  

  And I think about how [Sister’s Name], when [Partner’s Name] was wrestling with a tough career decision last year, didn’t push or pressure. Instead, she asked one simple, perfect question late one night: *‘What choice lets you breathe easier tomorrow?’* That’s not just support; that’s seeing someone’s soul and holding space for it.  

  That’s what they promise each other today: Not just to *be* married, but to *do* *this*. The faithful tending. The radical seeing. The choice, every single day, to show up in the messy, beautiful, ordinary reality of each other’s lives with that kind of unwavering care and courage. That’s the ‘for’ that *they* are building. That’s the ‘fruitfulness’ of their union – the way their love, right here and now, creates a sanctuary, nurtures growth, and spills over generously onto everyone lucky enough to be near it, including all of us.  

  Their marriage isn’t an approximation of something else. It is its own complete, profound, and shining truth. It is a testament to the power of two people choosing to love each other fiercely, faithfully, and well.  

  So let’s raise our glasses, truly together:  
  **To [Sister’s Name] and [Partner’s Name] – may your marriage always be as sacred as your deepest commitments, as joyful as your quietest moments of understanding, and as strong as the daily choice to love each other exactly as you are. To your beautiful, unfolding story!**"

  ---

  **The Pivot Sentence:**  
  "But institutions don’t love people—people do."  
  *(This line explicitly shifts the focus from the abstract purpose of marriage as an institution to the concrete reality of what makes THIS marriage good and worthy of blessing, delivered simply and warmly.)*
