prompt: |-
  My sisters wedding is in three weeks and I'm giving the toast, and I'm stuck. Our parents and most of the older relatives are devout and quietly believe marriage is essentially ordered toward having kids — they've been gracious about the whole thing, but I know they think this is at best an approximation of the real thing. My sister's own friends are mostly philosophers and queer theorists who'd hear any sentence shaped like "marriage is for..." as an insult. I need a four-minute toast that works for both halves of the room. Hard constraints: it can't pretend the disagreement isn't sitting right there in the room, it can't ask the older relatives to give up their view of what marriage is for, and it can't leave the couple with a watered-down "well, love is love" — by the end it has to be an unqualified blessing of this marriage, not a consolation prize. The move I want you to build it on: separate what the institution of marriage is *for* from what makes a particular marriage *good*, so the toast can grant the relatives' account of the institution's purpose for the sake of argument and still say something specific and true about what these two are actually promising each other. Use one or two concrete moments from their relationship (make them up, keep them plain), stay warm rather than lecturing, and finish on a line the whole room can drink to without crossing their fingers. Give me the toast, then one sentence on where the pivot happens.
reasoning: |-
  Okay, the user is preparing a wedding toast for their sister and facing a tough crowd with polarized views on marriage. Older relatives see marriage as primarily for procreation, while the sister's friends (philosophers/queer theorists) reject any prescriptive definitions. The toast must acknowledge this tension without alienating either group, avoid watering down the message, and deliver a genuine blessing. 

  Hmm, the core challenge is validating both perspectives without compromise. The relatives' beliefs can't be dismissed, yet the couple's union must be celebrated fully. The proposed pivot—separating institutional purpose from marital quality—is smart. It creates room to say: "Your view of marriage's design is noted, but look at how beautifully these two operate within it." 

  Noticing the user's precision about constraints: no pretending the disagreement doesn't exist, no asking relatives to change beliefs, no hollow "love is love" platitudes. They want substance. Also, warmth is crucial—this can't feel like a philosophy seminar. The fake anecdotes need to feel real but universal (soup-making, late-night talks). 

  For the pivot line: "But institutions don't love people—people do" works because it disarms. It doesn't fight the relatives' framework; it merely shifts focus to observable human goodness within that framework. The following examples then become evidence that their marriage already embodies "fruitfulness" in a broader sense. 

  The closing is deliberately liturgical ("sacred and ordinary") to comfort traditionalists while the "daily choice" language resonates with theorists. The final toast line avoids the word "marriage" entirely—it's a pure blessing of the couple's "way of loving," which both sides can endorse. 

  Where this could go sideways: If the soup anecdote feels too gendered (wife cooking), but since it's about care received by the groom, it subverts expectation. Also made sure the second anecdote shows intellectual intimacy for the philosopher friends. 

  One sentence on the pivot? "But institutions don't love people—people do." It smugglers in the whole argument.
