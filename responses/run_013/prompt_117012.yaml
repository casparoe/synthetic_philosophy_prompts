answer: |-
  ### Function Debate Decision Tree  
  *(Answer each question without jargon)*  

  **1. Should we keep using "function" in science?**  
     - **No → Eliminativism** (Drop the concept; it's too ambiguous)  
     - **Yes → 2**  

  **2. Is there just *one* correct way to define function?**  
     - **No → Pluralism** (Multiple accounts work in different contexts)  
     - **Yes → 3**  

  **3. Must a trait have a *history* (e.g., being selected for or retained due to its effects) to have a function?**  
     - **No → 6**  
     - **Yes → 4**  

  **4. Must this history involve *natural selection* (differential reproduction)?**  
     - **Yes → Selected-effects (standard etiological)**  
       - *Malfunction?* Yes (fails to perform selected task).  
       - *Artifacts?* Only if designed (e.g., software intentionally built for a purpose).  
     - **No → 5**  

  **5. Is the function tied to *actual past events* (e.g., being maintained by drift, culture, or learning)?**  
     - **Yes → Weaker etiological** (e.g., "retention" views)  
       - *Malfunction?* Yes.  
       - *Artifacts?* Yes, if history of retention (e.g., legacy code kept due to its quirks).  
     - **No → Propensity view** (Function = what the trait *would* be selected for in the future)  
       - *Malfunction?* Yes (fails to perform propensity role).  
       - *Artifacts?* Only if they have evolutionary analogues.  

  **6. Is function about *current contributions* to a larger system’s goals/capacities?**  
     - **No → [Unexplored]** (No major position; likely incoherent without history or systemic role)  
     - **Yes → 7**  

  **7. Must the "larger system" be *goal-directed/organized* (e.g., self-maintaining like an organism)?**  
     - **Yes → Organizational view**  
       - *Malfunction?* Yes (fails to sustain system goals).  
       - *Artifacts?* Yes (e.g., legacy code helps maintain software stability).  
     - **No → Causal-role view**  
       - *Malfunction?* **No** (function = current causal role; if it stops, it just lacks function).  
       - *Artifacts?* Yes (e.g., legacy code’s quirks causally support other modules).  

  ---

  ### Key Cases & Classifications  
  - **Flightless bird’s wings (display/balance)**:  
    - *Causal-role/organizational*: Function = display/balance (current role).  
    - *Etiological views*: Function = flight (historical), unless selection changed.  
  - **Human appendix**:  
    - *Selected-effects*: Past function (digestion), now vestigial.  
    - *Causal-role*: No current role → no function.  
  - **Lab bacterium’s flagellum**:  
    - *Selected-effects*: Function = swimming (historical), now malfunctioning.  
    - *Causal-role*: No current role → no function.  
  - **Trait spread by drift**:  
    - *Selected-effects*: No function (no selection).  
    - *Weaker etiological*: Function if retained due to its effect.  
  - **Legacy code module**:  
    - *Non-historical views (causal-role/organizational)*: Function = supporting dependent code.  
    - *Etiological views*: Only if designed/retained for that role (else no function).  

  ---

  ### Notes on Disagreements & Consensus  
  - **Real disagreements**:  
    - **History vs. no-history** (Q3): Core split. Etiological views insist on history; causal-role rejects it.  
    - **Normativity** (malfunction): Organizational/etiological views say malfunction is possible; causal-role often denies it (terminological).  
    - **Artifacts/non-evolved traits**: Etiological views extend to artifacts only via design/retention history; causal-role/organizational apply universally.  
  - **Terminological differences**:  
    - "Function" in causal-role vs. etiological contexts is sometimes seen as *ambiguous* (e.g., "current role" vs. "selected purpose") rather than contradictory.  
  - **Unattractive/unexplored**:  
    - Answering "no" to Q6 is incoherent to most; no major position denies both history and systemic contribution.  
  - **Consensus gaps**:  
    - **Drift traits**: Contentious. Weak etiological views accept them; selected-effects rejects them.  
    - **Propensity view**: Often criticized for being "forward-looking" (not grounded in actual history).  
  - **Tree limitations**:  
    - Can’t separate "causal-role" from "organizational" cleanly in edge cases (e.g., simple systems).  
    - Pluralism covers all cases but avoids taking sides.  

  *Total words: 790*
