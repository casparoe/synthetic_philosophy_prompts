answer: |-
  ## The Meta-Vote Mire: Why Aggregation Choice by Majority Deepens the Knot

  Your fictional court, attempting to escape the classic aggregation dilemma by voting on *how* to aggregate, doesn't find salvation. It merely relocates the inconsistency onto a higher, potentially more treacherous plane. The meta-vote doesn't resolve the core problem of collective rationality; it replicates it at the meta-level and risks collapsing into arbitrariness or an infinite regress. Here’s the mechanical breakdown:

  1.  **The Meta-Vote Itself Suffers the Same Affliction:** The fundamental problem is that majority rule on logically interconnected propositions is vulnerable to cycles or inconsistencies. This flaw isn't magically cured when the propositions become "Aggregate Premise-Wise" (P-Agg) vs. "Aggregate Issue-Wise" (I-Agg). Justices have preferences over these aggregation methods, likely driven by their views on the *substantive* case and which method favors their desired outcome. Crucially, these preferences may also be **intransitive** or lead to **Condorcet cycles** at the meta-level.
      *   **Example:** Imagine three Justices (A, B, C) on the meta-vote:
          *   A strongly prefers P-Agg (believing it leads to fairer outcomes generally).
          *   B strongly prefers I-Agg (believing it respects judicial autonomy on final rulings).
          *   C is outcome-driven: On Case 1, C prefers P-Agg because it yields their favored result. On Case 2, C prefers I-Agg for the same reason.
      *   **The Cycle:** In Case 1: A and C prefer P-Agg > I-Agg. Majority for P-Agg. In Case 2: B and C prefer I-Agg > P-Agg. Majority for I-Agg. There's no stable, consistent meta-preference for the *group* across cases. The meta-level aggregation rule choice is itself inconsistent case-by-case, mirroring the inconsistency it was meant to solve at the lower level.

  2.  **Collapse into Outcome-Driven Arbitrariness:** The above example highlights the most likely practical collapse. If Justices vote on the aggregation method based on which method delivers their preferred substantive outcome in the *specific case at hand* (like Justice C), then the meta-vote becomes entirely epiphenomenal. The "choice" of aggregation method is merely a transparent proxy for the desired result, dictated by the same shifting majority that causes the original dilemma. The meta-vote provides no principled resolution; it just adds a layer of procedural theater masking outcome-based voting. The court hasn't solved the inconsistency; it's buried it under a veneer of process while amplifying the perception of result-oriented decision-making.

  3.  **The Specter of Regress:** Even if the court attempts to establish a *stable* meta-rule ("We always vote on aggregation method!"), this simply pushes the problem up another level. *How* is that meta-meta-vote aggregated? If by majority, it faces the same potential for inconsistency. Attempting to solve aggregation inconsistency by adding a layer of aggregation is like trying to extinguish a fire by dousing it in gasoline. The problem scales upward infinitely or until the court arbitrarily stops the regress (e.g., "Chief Justice decides aggregation method"), abandoning the democratic premise entirely.

  **Conclusion:** The majority meta-vote doesn't rescue the court from inconsistency; it **replicates and amplifies it**. It relocates the aggregation dilemma to the meta-level, where preferences over methods are just as likely to be logically incoherent across the group. Worse, it readily collapses into outcome-driven arbitrariness, where the meta-vote is cynically manipulated to achieve a predetermined result, rendering it meaningless. At best, it creates a meta-dilemma; at worst, it reveals the court's substantive reasoning as entirely subservient to shifting majorities, unable to find stable procedural ground. For your novel, this dynamic is pure gold – a court perpetually tying itself in ever-tighter, self-imposed knots, mistaking procedural votes for principled solutions while descending deeper into logical chaos. The meta-vote isn't the escape hatch; it's the trapdoor to a deeper level of the maze.
