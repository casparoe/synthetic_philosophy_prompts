prompt: |-
  I'm circulating a position paper ahead of a graduate seminar on statecraft and historical reasoning, and a colleague who read the draft has warned me — without saying where — that my views will not survive contact with one another. I would rather find that out now than in the room. What follows is the substance of the paper, and what I want is an audit of it as a set rather than commentary on its parts.

  First, historical analogy is not a heuristic that a sufficiently rigorous thinker could discard; it is the medium in which anyone, statesman or model, represents a novel strategic situation at all, and there is no view from nowhere from which a present crisis can be compared with a past one without the present having already been assimilated to something. Second, a past case can be put to three different uses, and I think the distinction does real work: as a template, where it tells you what the present case is and therefore what to do; as a likelihood, where it contributes a base rate to a reference class; and as a landmark, where it fixes a reference point against which one can measure what has changed. Templates are the default, and I take them to be the pathology. Third, the reason analogies mislead is mainly cognitive: the cases that come to mind are the vivid, recent, and emotionally charged ones, so the selection is driven by availability and representativeness rather than by fit. Fourth, and following from that, the failure is one of process rather than content and is therefore mitigable: an analogy reached by deliberately canvassing candidate cases and scoring them for structural fit is worth more than one that arrives by salience, even when both end up citing the same case.

  Fifth, the reading of Iraq in 2003 through the post-1945 occupations of Germany and Japan was not a failure of canvassing — the relevant analogies were selected deliberately, argued over, and scored as fitting, and the policy failed anyway — so I doubt that a better process would have caught it. Sixth, the canonical lessons persist for reasons unrelated to their reliability: Munich, Vietnam, and the Thucydides trap are resources for advocates, taken up by whoever needs them and retired when they do not, and the last of these strikes me as a framing with no predictive record rather than a finding. Seventh, history's genuine epistemic value is at the likelihood grade — how often a concession of this kind precedes war, how often a rising and a ruling power come to blows — and I think that is also the only grade at which we escape the business of arguing about whether this case is that case, which is where historical argument usually goes wrong.

  That is the position. Please tell me which of the seven are genuinely in tension with which, which pairs only appear to be and dissolve on inspection, and how severe each genuine tension is. For each genuine one, give me the cheapest revision that removes it and say what that revision costs me elsewhere in the set; if a single revision would clean up more than one tension, say so. And if the set turns out to be consistent as it stands, say that plainly and give me the strongest objection to the package as a whole.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've shared their position paper on historical reasoning in statecraft and want an audit of the seven points as a coherent set. The main concern is internal consistency—whether any of these points conflict with each other. 

  First, I need to unpack each of the seven claims to see where tensions might lie. Point 1 argues that historical analogy is inescapable, which seems foundational. Point 2 introduces three uses of historical cases: templates, likelihoods, and landmarks, with templates being pathological. Point 3 attributes analogy failures to cognitive biases like availability. Point 4 suggests that better processes (deliberate canvassing) can mitigate these failures. 

  But then Point 5 complicates things by using the Iraq 2003 example—here, deliberate canvassing still led to failure, which challenges Point 4's optimism about process improvements. That's the first big tension: between Points 4 and 5. If a flawed process isn't the only problem (as per Point 5), then Point 4's mitigation claim weakens. 

  Point 6 argues that lessons like Munich persist due to utility, not reliability. Point 7 says history's real value is in likelihoods (base rates). The tension here is subtle: Point 7 promotes likelihoods as the only escape from "is this case like that case" debates, but Point 6 implies even canonical cases are tools, not truths. That undercuts Point 7's epistemic confidence. 

  The user's deeper need seems to be anticipating seminar pushback. They might fear their framework is elegant but unstable. The Iraq example is key—it's their proof that process isn't enough, but it risks undermining their own mitigation argument. I should weigh revision costs: if they soften Point 4 to acknowledge non-cognitive failures, it saves consistency but costs theoretical neatness. Alternatively, reframing Point 5 as a cognitive failure (e.g., groupthink in scoring) preserves Point 4 but might feel forced. 

  The second tension (Points 6 and 7) requires deciding whether likelihoods are truly immune to advocacy. If canonical lessons are malleable (Point 6), can base rates be trusted? Maybe clarifying that likelihoods rely on aggregate data, not single cases, resolves this. But that risks oversimplifying how data is selected. 

  Overall, the core conflict is between wanting process solutions (Point 4) and admitting their limits (Point 5). The cheapest fix is tweaking Point 4 to include failures beyond cognition, though it dulls their mitigation angle. The seminar's real objection might be that their framework underestimates how politics corrupts even "good" processes—something Points 5 and 6 hint at but don't fully address.
answer: |-
  Here's an audit of your seven propositions as a coherent set, identifying tensions, their severity, and cost-effective revisions:

  ### Core Tensions
  1. **Tension 1: Point 4 vs. Point 5**  
     - **Conflict**: Point 4 claims failures are *process* problems (mitigated by deliberate canvassing/scoring). Point 5 argues Iraq 2003 *was* a product of deliberate process yet failed—implying failures can be *non-process* issues (e.g., mis-specification of "structural fit," overlooked variables).  
     - **Severity**: High (undermines the mitigability claim in Point 4).  
     - **Cheapest Revision**: Revise Point 4 to:  
       *"...the failure is** often** one of process rather than content and is therefore** frequently** mitigable..."*  
     - **Cost**: Softens the universality of "mitigable" failures but preserves core insight. Aligns with Point 5’s counterexample.  

  2. **Tension 2: Point 6 vs. Point 7**  
     - **Conflict**: Point 6 argues canonical lessons (e.g., Munich, Thucydides Trap) persist due to *utility for advocacy*, not reliability. Point 7 claims "likelihood grade" analogies (base rates) offer "genuine epistemic value." But if canonical lessons are advocacy tools (Point 6), why should likelihood-grade uses (which often rely on canonical cases/data) escape politicization?  
     - **Severity**: Moderate (challenges the epistemic purity of likelihood-grade uses).  
     - **Cheapest Revision**: Add to Point 7:  
       *"...**provided the reference class is rigorously defined and insulated from advocacy-driven case selection**."*  
     - **Cost**: Acknowledges Point 6’s concern but preserves Point 7’s distinction.  

  ### Apparent Tensions (Dissolve on Inspection)
  - **Point 1 vs. Point 3**: No conflict. Point 1 (analogy inescapable) and Point 3 (analogies often misselected via cognitive bias) coexist: the necessity of analogy doesn’t preclude flawed selection.  
  - **Point 2 vs. Point 7**: No conflict. Prioritizing "likelihood" use (Point 7) aligns with demoting "template" use as pathological (Point 2).  
  - **Point 3 vs. Point 4**: No conflict. Point 3 diagnoses a problem; Point 4 proposes a process-based solution.  

  ### Consistent Core
  The set is **largely consistent** if revised as above. Central thesis holds:  
  > *Historical analogy is inescapable (1), but template use is pathological (2). While cognitive biases cause failure (3), improved process helps (4)—though not always (5). Canonical cases serve advocacy (6), but likelihood-grade analogies offer unique epistemic value when safeguarded (7).*

  ### Strongest Objection to the Revised Package
  **The "Structural Fit" Problem**: Your solution (deliberate canvassing/scoring in Points 4–5) relies on judging "structural fit." But **all historical comparisons require prior interpretive framing** (per Point 1). What counts as "structure" (e.g., power dynamics, ideology, leader psychology) is contested and theory-laden. Thus, even "rigorous" scoring can embed unconscious biases or ideological assumptions, rendering the process vulnerable to the same pathologies as intuitive analogies—as Iraq 2003 arguably demonstrates. This challenges the reliability of *any* analogy (even likelihood-grade) and suggests your mitigation strategy may be more fragile than implied.

  ### Summary of Revisions & Costs
  | **Tension**       | Revision                                                                 | Cost                                                                 |
  |-------------------|--------------------------------------------------------------------------|----------------------------------------------------------------------|
  | Points 4 vs. 5 | Qualify Point 4: failures are "often" process-based, "frequently" mitigable. | Reduces strength of mitigability claim; acknowledges Point 5's limit. |
  | Points 6 vs. 7 | Qualify Point 7: likelihoods require "rigorous reference class definition." | Admits likelihoods can be corrupted by advocacy if not safeguarded. |

  **Result**: A coherent (though less triumphalist) framework that withstands internal critique while acknowledging practical limits. The strongest external objection targets the subjectivity inherent in defining "fit," which your process cannot fully escape.
