prompt: |-
  ok so I'm mid-chapter on the epistemology of testimony, the reductionism vs anti-reductionism thing (Hume vs Reid, whether testimony is a basic source of justification or has to be earned by independent evidence), and my supervisor keeps saying I need a concrete case study instead of another abstract section. So I've been staring at 12 Angry Men, and the more I look the more I think the standard reading of it is too easy. Everyone uses it for reasonable doubt. I want it read through the testimonial-justification debate and I want to know where that reading breaks.

  Heres my hunch. Juror 8 gets cast as the hero of doubt, but look at his actual method: he doesn't just say I doubt it, he goes and gets independent, non-testimonial checks on every witness. He buys an identical switchblade at a pawnshop two blocks from the boy's place to break the one-of-a-kind claim. He has Juror 2 time him reenacting the old man's walk to the door. He leans on the el train drowning out what the old man claims he heard. He gets Juror 9 to notice the marks the glasses left on the woman's nose. That is Humean reductionism in action, right? Testimonial belief only earns its keep if you can back it with something that isn't testimony. But now the twist I keep coming back to: every one of those checks is itself somebody's testimony. The knife is Juror 8 reporting what he found at the pawnshop. The glasses marks are Juror 9 reporting what he saw on a witness's face. The timing experiment is Jurors 8 and 2 reporting a reenactment they ran themselves. So the non-testimonial evidence is testimony all the way down. Is that the film arguing for anti-reductionism by reductio, or is it just the boring point that all evidence is mediated somehow? I cant tell if the distinction survives the film or the film just shows it dissolving.

  Second thing, and this is the one I actually care about. The alibi. The boy says he was at the movies that night and he cant remember the films or who was in them. That's the single piece of testimony that could exonerate him and it is completely unverifiable, nobody can check it. Juror 4 reads the memory failure as a sign of guilt. Juror 8 says under that kind of emotional stress people forget things. There is no independent evidence either way, so the jury has to decide whether to believe a report it cannot check, purely on how plausible it finds the reporter. Isn't that exactly the spot where the reductionist owes an account and doesn't have one, and where the anti-reductionist says yeah, testimony is basic, you either take the default of credulity or you're stuck? I want the reading to really press on that scene rather than skip it.

  Third, the witnesses themselves. The old man had a stroke and can barely walk, the woman wore glasses and left them off in court out of vanity, and the film gives reasons for their unreliability that are internal to testimony and not perception. Juror 9 floats that the old man testified mainly to feel important, the woman's credibility gets inflated, and meanwhile the boy's testimony gets deflated because he's a kid from the slums with a record, and then there's Juror 10's bigoted rant. So the film seems to know something the debate sometimes forgets, which is that credibility is social and not just evidential. Does that fit the reductionism/anti-reductionism frame or is it a seperate axis that the frame can't hold?

  What I want from you: read the film as a case study in that debate. Tell me who the reductionist is and who the anti-reductionist is, point me at the scenes that do the actual philosophical work, and be honest about where the film resists the reading and I have to admit it isn't really about epistemology at all. In particular I want you to say whether the ending undercuts the whole evidentialist frame, because Juror 3 doesn't cave to an argument, he caves because he recognises himself in the case, and if minds change for non-epistemic reasons then maybe the whole question of how testimonial belief is justified is a bit beside the point of how juries actually work. And finish by telling me what the film adds that the papers don't. No citations or reading lists, I've got those, I just need the reading. And please don't reduce the film to an illustration of the theory or bend the theory to fit the film, I'll notice.
