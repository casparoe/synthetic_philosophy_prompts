  The user might not have considered how to structure the argument beyond the initial idea. Providing a clear outline with phases helps them see the progression. Also, addressing the "residue" question—whether a metaphysical core remains—adds depth. They might need guidance on balancing the two aspects without getting sidetracked.

  Risk management: The postdoc might get bogged down in literature. Setting strict timelines for each phase and deliverables (memos, draft sections) keeps them on track. Allowing a month for troubleshooting in the plan accounts for unexpected delays.

