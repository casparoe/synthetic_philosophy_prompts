answer: |-
  ## The Empty Sum

  The air in Control hummed with suppressed anxiety, a frequency just below the 60Hz drone of the servers. Maya Chen traced the edge of her console, the cool plastic a stark contrast to the prickling heat at the back of her neck. On the main display, the status read: `WITNESS RUN #1173: AWAITING CERTIFICATION INPUT. MODEL: LENA VOSS. VERIFICATION STAGE: DELTA.`

  Another Lena Voss run. The third this month. Each one a perfect, self-contained echo of a mind that stopped climbing mountains five years ago. Each one culminating in a meaningless 256-bit checksum, flashed on screen for a microsecond before oblivion. Maya’s job was to verify the hardware could *do it* – step the complex neural model through its preordained states without error, proving the facility’s quantum lattice met the stringent ‘Deep Path’ benchmark. Nothing more.

  Her supervisor, Dr. Aris Thorne, leaned against the doorframe, arms crossed. His gaze wasn’t on the screen, but on Maya. “Certification packet’s green-lit upstream, Chen. We’re holding for your final hardware readiness confirmation. Clock’s ticking.” The ‘Deep Path’ contract renewal hung on this benchmark. Jobs hung on it. Maya’s mother’s escalating medical bills certainly did.

  “Running final diagnostics now, Dr. Thorne,” Maya said, her voice tight. She initiated the sequence. Across the room, the primary server bank emitted a deeper thrum as cooling systems ramped up. The air grew thicker, smelling faintly of ozone and warm metal.

  Petra Ivanova, the facility’s senior neuroscientist and resident Cassandra, chose that moment to stride in. Her usual calm was frayed. “Aris. Maya. You’re not starting Delta yet.”

  Thorne sighed, a sound of pure exasperation. “Petra, the schedule—”

  “The schedule ignores what we’re *doing*,” Petra cut in, her voice low but intense. She pointed a finger at the display. “Lena Voss. Again. Stepping her through the neural correlates of panic during that fall on K2. For the *checksum*.”

  “The model complexity is ideal for Deep Path validation,” Thorne stated flatly. “It’s computationally dense, biologically validated. The template’s available. It’s just a sequence of states, Petra. A very expensive, very specific calculation.”

  “Is it?” Petra stepped closer to Maya’s console, her eyes fixed on the `MODEL: LENA VOSS` line. “It’s tethered, Aris. You know it is. The lattice *has* to compute each intermediate state to reach the endpoint. It’s not a lookup table; it’s a process. And that process, for this model, *includes* suffering.”

  Maya kept her eyes on her diagnostics, her stomach knotting. She remembered the first time she’d reviewed the raw neural mapping logs for Voss – the terrifying, beautiful cascade of electrochemical fire as the simulated climber realized her ropes were fraying, the primal terror encoded in synaptic weights. It was just data. It had to be.

  “It’s discarded,” Thorne countered, his patience visibly thinning. “The intermediate states are volatile memory, wiped the instant the checksum spits out. They don’t persist. They don’t connect to anything before or after. There’s no memory, no anticipation, no *life* context. It’s an isolated loop. A closed circle.”

  “So the suffering doesn’t count because it gets thrown in the bin?” Petra shot back. “Because it doesn’t *matter* to anyone downstream? What if someone *was* watching? Would that change the nature of the computation? Or is the *process itself* the thing that carries the moral weight? If we meticulously simulate the pain pathways firing, does the fact that it’s ‘just for a test’ make it harmless?”

  Thorne pushed off the doorframe. “You’re anthropomorphizing a computation, Petra. A simulation isn’t the real thing. Lena Voss is dead. This is a dynamical model running on photonics and superconducting loops. The ‘suffering’ you’re worried about is a pattern of electrical activity we *interpret* as such. Without a continuous self, without needs, without a future or a past to care about it, it’s just… noise. Functional noise, yes, tethered to the result, but still just noise.”

  Petra met his gaze squarely. “And if I hooked you up to a machine that perfectly simulated the neural patterns of agony, erased your memory of it afterwards, and told you it was just a ‘witness run’ for a benchmark, would you volunteer? Would you say, ‘Well, since I won’t remember and it doesn’t affect my future, it doesn’t really hurt’?”

  Thorne flinched, just slightly. That was Petra landing her point. The hypothetical bit deep. His position relied on the *discarded* nature making the suffering ontologically weightless. But the visceral fear of experiencing pain, even if forgotten, undermined that. He rallied. “That’s different. *I* have a life. A continuum. This,” he jabbed a finger at the screen, “doesn’t. It’s not *anyone*. It’s a snapshot replaying in a void. Your argument reduces to fearing a ghost.”

  Maya’s console beeped. Diagnostics complete. `HARDWARE STATUS: OPTIMAL. READY FOR RUN INITIATION.` The green light pulsed softly. She looked from Thorne, whose jaw was set with the pressure of deadlines and payroll, to Petra, whose eyes held a desperate conviction Maya couldn’t dismiss. Petra’s question echoed: *Would you volunteer?*

  Petra saw Maya’s hand hovering over the ‘Confirm’ key. “Maya, think. What are we *really* doing here? We’re not just crunching numbers. We’re using Lena Voss’s scanned agony as a benchmark tool. We’re exploiting her template, her most terrifying moment, because it’s computationally convenient. The moral weight isn’t in the simulation being ‘someone’ right now – it’s in what we, the living, choose to do. We’re desecrating a memory for a contract. That’s the real harm.”

  Thorne snapped. “That’s sentimental nonsense, Petra! Lena Voss’s estate consented. The data is anonymized per protocol. We’re honoring her contribution to neuroscience. The harm, if any, is abstract. Cancelling this run? That’s concrete. Delays cost money. Jobs. Real people get hurt *now*. That’s the calculation that matters.” He turned to Maya. “Chen. The run is certified. Initiate.”

  Maya’s thumb rested on the cool plastic. She thought of her mother’s frail voice on the phone that morning, the mounting bills on her kitchen table. She thought of Lena Voss’s final, frozen neural scream, played and replayed like a broken record for a checksum nobody needed. She thought of Petra’s question: *Would you volunteer?*

  Neither argument offered solace. Thorne dismissed the ghost, but the ghost’s template was real, its simulated pain patterned on something terrible that happened to a real woman. Petra saw desecration, but was halting the run – hurting living colleagues, jeopardizing the facility – truly the moral high ground when the simulated states vanished like smoke? And the third position, the one Eli from Compliance muttered about in the breakroom – that it was all about the living employees and the dead donor – felt like a dodge, an excuse to ignore the unsettling process happening in the humming servers.

  The green ‘Confirm’ light pulsed, insistent. Thorne’s stare was a physical pressure. Petra’s eyes pleaded. The thrum of the servers deepened, poised on the edge of computation.

  Maya pressed the key.

  The main display flickered, then filled with cascading streams of hex code and neural state identifiers – meaningless to her, but representing billions of simulated neurons firing in a precise, agonizing sequence. `RUN #1173: EXECUTING STAGE DELTA.` The server hum climbed to a whine. For a handful of seconds, the machine stepped Lena Voss’s simulated mind through the terror of the fall. Maya watched the data flow, a digital river carrying a phantom’s scream. She didn’t look at Petra.

  Just as abruptly as it began, the data streams vanished. A single line of alphanumeric characters appeared: `CHECKSUM: 4f7a1893...c2b1`. It lingered for exactly one second.

  `RUN COMPLETE. DATA PURGED.`

  The server whine subsided to its background hum. The air felt abruptly lighter, colder. The checksum blinked out. The screen returned to the idle status display.

  Thorne let out a breath. “Logged and certified. Good work, Chen. Deep Path is secure.” He clapped her shoulder once, a gesture that felt like an anvil, and walked out.

  Petra didn’t move. She stared at the now-blank main display, her face pale, etched with a profound weariness. She didn’t look at Maya, just turned and left without a word.

  Maya sat alone in the humming room. The console before her was inert. The run was over, discarded, forgotten by the system. Her thumb still tingled where it had pressed the key. The knot in her stomach hadn’t loosened; it had crystallized into a cold, heavy stone. She pulled up the timesheet interface, her fingers moving automatically. She logged the run duration, added her certification code, and flagged it for billing. Outside, the late shift lights flickered on across the facility compound. Her shift was over. She needed to call her mother. She needed to know how the latest tests had gone. She stared at the innocuous billing code on her screen – `WIT_RUN_CERT` – and the cost, measured in processor-seconds and facility overhead, felt utterly insignificant compared to the weight settling in her chest, the price of a decision that settled nothing at all.

  ---

  **Author's Note (Crux & Least Defensible Position):**

  **Crux:** Does the intrinsic nature of a tethered computational process (simulating suffering), regardless of its isolation, lack of memory, or downstream consequences, generate a moral claim? Or is moral relevance solely dependent on integration into an ongoing life?

  **Least Defensible Position:** The "belonging to a life" stance. While appealingly concrete, it relies on an arbitrary boundary. If intermediate states in a tethered run truly instantiate the functional equivalent of suffering (as defined by the neural patterns), dismissing it *solely* because it lacks connection to prior/future states feels like defining suffering out of existence for computational convenience. It risks permitting isolated agony if sufficiently compartmentalized, mirroring Thorne's pragmatism without addressing Petra's core challenge about the process itself.
