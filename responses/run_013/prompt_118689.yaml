prompt: |-
  I have just come out the other side of a long argument with a friend about moral trade, and I want a written answer that takes sides rather than adjudicating politely between us. The idea we were fighting over is this: two people who disagree about values can both come out ahead by trading. You care intensely about one thing and barely at all about another; I have the mirror-image priorities; so I do the cheap-for-me thing that matters to you, you do the cheap-for-you thing that matters to me, and each of us is better off by his own lights even though we never come to agree about what matters. My friend thinks the whole idea is a shell game, and I could not state the case against him cleanly enough to refute it to my own satisfaction. So I would like you to state it for him, at full strength, and then tell me whether it survives.

  His objections, as fairly as I can put them. First, the currency objection: if any ordinary form of moral realism is true, then at most one of us has his values roughly right, so the surplus from a trade is measured in a currency that is counterfeit for at least one party. Being handed what you want is not the same as being made better off, if what you want is not in fact worth having. On this view, "both parties gain" is either false or merely indexical, and indexical gains do not add up to any improvement in the world. Second, the baseline objection: every surplus is computed against what each party would otherwise have done, and that baseline is often ongoing wrongdoing. My roommate case is the one that stuck with me — the neighbor who plays music at two in the morning agrees to stop in exchange for the other one doing his dishes for a month. The person willing to do more wrong has more to sell, so willingness to behave badly becomes a bargaining asset, and the trade pays a wrongdoer for restraining harm he had no right to inflict in the first place. Third, the integrity objection: some things are not mine to trade at all — my vote, my testimony, a duty I owe to someone who is not at the table — and even where I am free to trade, keeping my end of the bargain can require me to act against my own moral judgment, which is the very thing I take myself to be forbidden to do. His example there was a trade in which I agree to drop my objection to a development I believe is wrong, in exchange for his giving money to a cause I believe is urgent; he says that is not a trade but a purchase, and that I have sold something that was not for sale.

  Write me an essay that reaches a verdict. Is moral trade a legitimate way to make the world better, or is my friend right that it launders wrongdoing and dresses up blackmail as mutual benefit? Say which of his three objections actually lands, which one I can throw back at him, and under what conditions — if any — a trade is permissible; if you think none is, say so flatly. Do not lean on names, citations, or reading recommendations; I want the argument, not the literature. Begin with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of what I have asked. Write in American English.
reasoning: |-
  Hmm, the user wants me to take a clear stance on moral trade and refute their friend's objections. Their friend raised three main arguments: the currency objection (counterfeit values), the baseline objection (rewarding wrongdoing), and the integrity objection (selling what shouldn't be traded).

  I need to start with my bottom line immediately. After thinking through this, I believe moral trade can be legitimate under specific conditions. The currency objection doesn't hold up because people can genuinely be made better off by their own lights even with conflicting values - we do this all the time in ordinary transactions. The integrity objection has merit though; some things like votes or testimony shouldn't be commodified. And the baseline objection is crucial - trades that reward bad behavior are problematic, but this can be mitigated by proper baselines.

  The key insight is distinguishing between trades that create new value versus those that merely redistribute harm. The roommate example is problematic because it rewards the noisy neighbor for stopping harmful behavior, but if we imagine a scenario where both parties are already behaving properly and trade creates mutual surplus, that's fundamentally different.

  For the integrity concern, we need to recognize that core moral duties can't be traded away without self-betrayal. But many everyday compromises don't violate this principle. The baseline is what makes or breaks moral trade - if we're trading from positions of rightful conduct, it's legitimate cooperation; if we're paying people to stop wrongdoing, it's extortion.

  My verdict will be that moral trade is legitimate when three conditions are met: trades don't reward pre-existing wrongdoing, involve only tradable goods (not core duties), and respect each party's internal moral consistency. I'll structure this to directly address each objection while building toward this framework.
answer: |-
  **Moral trade is legitimate when it creates surplus value without rewarding pre-existing wrongdoing or violating core duties, but your friend's baseline and integrity objections expose critical dangers that invalidate many proposed trades.**

  The currency objection fails. Whether moral realism is true or not, individuals *subjectively* experience improvement when they receive what they value more in exchange for what they value less. Your "counterfeit currency" analogy mistakenly assumes an objective moral ledger exists and is the only valid measure of well-being. But trade operates precisely where objective values are unknown, disputed, or irrelevant. If I trade my surplus grain for your surplus tools, both our material conditions improve *according to our respective preferences and needs*. Similarly, if I value quiet intensely and you value clean dishes intensely, and we trade concessions, we *are* both better off *by our own subjective valuations*. Calling this merely "indexical" and dismissing it as no real-world improvement ignores the concrete reality of satisfied preferences and reduced suffering. The gain is real for the participants, even if an omniscient judge might deem one preference irrational. Trade doesn't require shared values, only compatible differences in valuation.

  However, your friend's baseline objection is devastating against trades predicated on wrongdoing. His roommate case hits the mark. Calculating a "surplus" against a baseline of ongoing harm (playing loud music at 2 AM) transforms the trade into a protection racket. The noisy neighbor hasn't created value; they've created a *cost* (the noise) and are now demanding payment (dishwashing) to remove it. This rewards and incentivizes the *creation* of bad baselines. Willingness to inflict harm does become a bargaining asset. The "gain" for the quiet-seeker is merely the avoidance of a wrong they shouldn't have faced, purchased by performing labor. This isn't mutual benefit; it's paying Danegeld. The critical distinction is whether the baseline represents rightful conduct or wrongful imposition. A legitimate trade requires *both parties starting from a baseline where they are not actively wronging each other*. Trading *from* a baseline of mutual non-harm can create new surplus (e.g., "I'll weed your garden if you fix my fence," assuming neither was obligated to do either task for the other). Trading *away from* a baseline of harm is usually extortion.

  The integrity objection also lands powerfully, particularly concerning core duties. Your friend is right: some things are intrinsically non-tradable. Selling your vote corrupts the democratic process. Trading testimony for money subverts justice. More subtly, trades that require you to violate a solemn duty owed to a third party (e.g., agreeing to neglect a patient you are sworn to care for) are morally repugnant. His "purchase, not trade" point about dropping an objection highlights this. If you genuinely believe the development is wrong, agreeing not to oppose it isn't merely exchanging a concession; it's *complicity*. You are selling your silence on a matter of principle, betraying your judgment and potentially harming others not party to the deal. Acting against your core moral conviction, especially when it affects others, is often self-betrayal and a violation of duty. Not every compromise violates integrity – trading chores involves preferences, not core duties. But when the "currency" is fulfilling or renouncing a perceived fundamental obligation, the trade risks corrupting the moral agent.

  **Verdict:** Moral trade *can* be legitimate, but only under strict conditions: (1) The baseline must involve no pre-existing duty to cease the harmful/undesired activity (i.e., no one is being paid to stop wrongdoing). (2) The goods or concessions traded must be legitimate objects of exchange (not votes, core testimony, or non-waivable duties owed to others). (3) The trade must not compel a party to act against a core, non-negotiable moral conviction where integrity itself is the stake. Your friend's baseline objection invalidates trades like the noisy roommate. His integrity objection invalidates trades involving core duties or demanding profound self-betrayal. The currency objection, however, misunderstands the subjective reality of preference satisfaction. Moral trade isn't inherently a shell game, but it is fatally vulnerable to laundering extortion and corrupting integrity if these constraints are ignored. Legitimate moral trade requires starting from rightful conduct and exchanging only what is rightfully yours to trade.
